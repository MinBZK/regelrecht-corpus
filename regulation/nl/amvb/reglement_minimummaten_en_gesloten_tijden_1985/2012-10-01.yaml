preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Landbouw en Visserij van 15 april 1985, Directie Juridische en
    Bedrijfsorganisatorische Zaken, no. J. 2430;


    Overwegende dat het wenselijk is mede ter uitvoering van verordening (EEG) no. 3626/82 van de Raad van de Europese
    Gemeenschappen van 3 december 1982 (Pb EG L384), een herzien Reglement minimummaten en gesloten tijden vast te
    stellen;


    Gelet op de artikelen 2a, 4, 9 en 16 van de Visserijwet 1963 (Stb. 312);


    Gehoord het Produktschap voor Vis en Visprodukten, het Visserijschap, het Bedrijfschap voor de Groothandel in
    Vis en Aanverwante Bedrijven, de Nederlandse Vereniging voor Sportvissersfederaties, het Centraal Nederlands
    Hengelaarsverbond en de Voorlopige Adviesraad voor de Binnenvisserij;


    De Raad van State gehoord (advies van 30 mei 1985, no. W.11.85.0214/06.05.22);


    Gezien het nader rapport van de Staatssecretaris van Landbouw en Visserij van 31 mei 1985 no. J3589, Directie
    Juridische en Bedrijfsorganisatorische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Bij ministeriële regeling wordt de afmeting, bedoeld in [artikel 2a, eerste lid, van de Visserijwet 1963][ref1],
      bepaald.

      2 Vis van de soorten waarvoor ingevolge het eerste lid een afmeting is bepaald wordt onmiddellijk nadat deze is
      opgehaald weer in hetzelfde water teruggezet, indien de vis, gemeten vanaf de punt van de snuit tot het uiteinde
      van de staartvin, niet tenminste de daarvoor bepaalde afmeting heeft.

      3 Indien bij of krachtens het [Reglement zee- en kustvisserij 1977][ref2] voorschriften zijn gesteld inzake
      afmetingen of daarnaar wordt verwezen, zijn deze ook van toepassing op vissen die worden gevangen in de wateren,
      bedoeld in [artikel 1, vierde lid, onderdeel d, van de Visserijwet 1963][ref3], en is het tweede lid van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003144
      [ref3]: https://wetten.overheid.nl/BWBR0002416#Artikel1
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0003144
      - id: ref3
        bwb_id: BWBR0002416
        artikel: '1'
  - number: '2'
    text: |-
      1 Bij ministeriële regeling wordt het in [artikel 2a, tweede lid, van de wet][ref1] bedoelde tijdvak vastgesteld.

      2 Vis van de soorten waarvoor ingevolge het eerste lid een tijdvak is bepaald wordt onmiddellijk nadat deze is
      opgehaald weer in hetzelfde water teruggezet, indien de vis tijdens dit tijdvak is gevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: 2a
  - number: '3'
    text: |-
      Het is verboden vis voorhanden of in voorraad te hebben, aan te voeren, te vervoeren, te koop aan te bieden, te
      vervreemden, af te leveren, te bewerken of te verwerken indien:

      a. behorende tot de soorten bedoeld in [artikel 1, tweede lid][ref1], of in artikel 1, derde lid, bedoelde
      vissen, deze, gemeten van de punt van de snuit tot het uiteinde van de staartvin, niet ten minste de achter de
      desbetreffende soort vermelde maat heeft;

      b. behorende tot de soorten bedoeld in [artikel 2][ref2], in het bij de desbetreffende soort vermelde tijdvak,
      uitgezonderd de eerste zes dagen daarvan tenzij als tijdvak het gehele jaar is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003805#Artikel2
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003805
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003805
        artikel: '2'
  - number: '4'
    text: >-
      Het is verboden gerookte aal, welke, gemeten van de punt van de snuit tot het uiteinde van de staartvin, kleiner is
      dan 25 cm, voorhanden of in voorraad te hebben, te vervoeren, te koop aan te bieden, te vervreemden, af te leveren,
      te bewerken of te verwerken.
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden op of in de nabijheid van enig water vis behorende tot de in [artikel 1, tweede lid][ref1],
      bedoelde soorten of in artikel 1, derde lid, bedoelde vissen voorhanden of in voorraad te hebben, indien deze vis
      in zodanige toestand is gebracht, dat daardoor de vaststelling van de maat wordt bemoeilijkt of onmogelijk gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel1
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003805
        artikel: '1'
  - number: '6'
    text: |-
      Degenen die gerechtigd zijn de aaldogger- en aalhoekwantvisserij uit te oefenen, is het in afwijking van het
      bepaalde bij of krachtens de [artikelen 1][ref1], [2][ref2] en [3][ref3], toegestaan baars met een lengte,
      gemeten van de punt van de snuit tot het uiteinde van de staartvin, kleiner dan 15 cm, in het tijdvak van 1 maart
      tot en met 31 oktober tot een hoeveelheid van ten hoogste 5 kg te behouden, voorhanden of in voorraad te hebben en
      te vervoeren, voorzover aannemelijk is dat deze als lokaas zal worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003805#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003805#Artikel3
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003805
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003805
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003805
        artikel: '3'
  - number: '7'
    text: |-
      Degenen die gerechtigd zijn tot het vissen met de hengel, is het, tenzij het vissen in het IJsselmeer plaatsvindt,
      in afwijking van het bepaalde bij of krachtens de artikelen [1][ref1], [2][ref2] en [3][ref3], toegestaan:

      a. baars, kleiner dan de krachtens [artikel 1][ref4] voor die vissoort vastgestelde lengte, voorhanden te hebben
      onder de voorwaarde dat de vissen levend worden bewaard in een leefnet of een emmer en in hetzelfde water worden
      teruggezet;

      b. ten hoogste 20 stuks dode baars, kleiner dan de krachtens [artikel 1][ref5] voor die vissoort vastgestelde
      lengte, voorhanden of in voorraad te hebben en te vervoeren, voor zover aannemelijk is dat deze als aasvis zal
      worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003805#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003805#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003805#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003805#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0003805#Artikel1
    url: https://wetten.overheid.nl/BWBR0003805/2012-10-01#Artikel7
    references:
