  - number: 32g
    text: |-
      1 Op neventaken is het bepaalde bij of krachtens de [artikelen 26, eerste lid][ref1], [27 tot en met 28a][ref2],
      [41a][ref3], [43a tot en met 43c][ref4], [48][ref5], [50, achtste lid][ref6], [52 tot en met 53a][ref7] en
      [64c van de Mediawet][ref8] van overeenkomstige toepassing.

      2 Op neventaken die bestaan uit het uitzenden van televisieprogramma’s is het bepaalde bij of krachtens
      [artikel 54a van de Mediawet][ref9] van overeenkomstige toepassing op elk van die televisieprogramma’s.

      3 Het Commissariaat voor de Media kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het
      tweede lid.


