  - number: '24'
    text: |-
      1 Een beschikking tot intrekking van de zendtijd die is toegewezen aan een regionale of lokale omroepinstelling,
      genomen op grond van [artikel 45 van de Mediawet][ref1], gaat onmiddellijk in.

      2 Indien de intrekking van de in het eerste lid bedoelde zendtijd plaatsvindt op grond van [artikel 46][ref2], gaat
      de beschikking daartoe in, twee weken na de datum van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel46a
