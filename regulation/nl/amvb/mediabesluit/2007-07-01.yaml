  - number: '19'
    text: |-
      1 Het Commissariaat voor de Media legt de aanvraag tot toewijzing van zendtijd voor regionale omroep binnen vier
      weken na de datum van ontvangst voor aan provinciale staten.

      2 Provinciale staten brengen binnen achttien weken na ontvangst van het verzoek, bedoeld in het eerste lid, advies
      uit aan het Commissariaat en verklaren of zij bereid zijn voor de bekostiging van regionale omroep zorg te dragen.

      3 Het Commissariaat beslist binnen vier weken na ontvangst van het advies van provinciale staten.

      4 Bij toewijzing van zendtijd stelt het Commissariaat tevens voor het eerste kalenderjaar of het nog resterende
      deel daarvan, de hoeveelheid zendtijd vast en wijst het de dagen en uren en zonodig de omroepzender of
      omroepzenders aan waarop het programma wordt uitgezonden. De datum waarop de zendtijd ingaat wordt, gehoord de
      regionale omroepinstelling, door het Commissariaat vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel19
  - number: '20'
    text: |-
      1 Het Commissariaat voor de Media legt de aanvraag tot toewijzing van zendtijd voor lokale omroep binnen vier weken
      na de datum van ontvangst voor aan de gemeenteraad en zendt een afschrift van de aanvraag aan Onze Minister van
      Verkeer en Waterstaat.

      2 De gemeenteraad brengt binnen achttien weken na ontvangst van het verzoek, bedoeld in het eerste lid, advies uit
      aan het Commissariaat.

      3 Het Commissariaat beslist binnen vier weken na ontvangst van het advies van de gemeenteraad.

      4 Bij toewijzing van zendtijd kan het Commissariaat tevens voor het eerste kalenderjaar of het nog resterende
      deel daarvan, de hoeveelheid zendtijd vaststellen en de dagen en uren en zonodig de omroepzender of omroepzenders
      aanwijzen waarop het programma wordt uitgezonden. De zendtijd gaat zo spoedig mogelijk in. De eerste volzin is niet
      van toepassing bij toewijzing van zendtijd voor een programma voor lokale omroep dat wordt uitgezonden door middel
      van een omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel20
  - number: '21'
    text: |-
      1 Indien de regionale of lokale omroepinstelling waaraan voor een bepaalde periode zendtijd is toegewezen in
      aanmerking wil komen voor toewijzing van zendtijd in een aansluitende periode, dient zij de in [artikel 18][ref1]
      bedoelde aanvraag bij het Commissariaat voor de Media in ten minste zes maanden vóór afloop van de periode waarvoor
      haar zendtijd is toegewezen.

      2 In bijzondere gevallen kan van het bepaalde in de [artikelen 19][ref2] en [20][ref3] worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004237#Artikel20
