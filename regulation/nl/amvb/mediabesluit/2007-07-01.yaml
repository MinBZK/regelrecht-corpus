  - number: '71'
    text: |-
      1 Het Commissariaat voor de Media trekt de toestemming in:

      a. wanneer niet meer wordt voldaan aan de voorwaarden die in [artikel 68, eerste en tweede lid][ref1], worden
      gesteld om voor toestemming in aanmerking te komen;

      b. op gronden ontleend aan de veiligheid van de Staat.

      2 Het Commissariaat kan de toestemming intrekken indien niet wordt voldaan aan het bepaalde in
      [artikel 68, derde lid][ref2].

      3 Het Commissariaat maakt zijn voornemen tot intrekking van de toestemming kenbaar aan Onze Minister van Defensie
      en Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel68
