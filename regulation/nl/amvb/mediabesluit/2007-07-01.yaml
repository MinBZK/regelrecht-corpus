  - number: '72'
    text: |-
      1 Een beschikking tot intrekking van een verleende toestemming, genomen op grond van
      [artikel 71, eerste lid][ref1], gaat onmiddellijk in.

      2 Een beschikking tot intrekking van een verleende toestemming, genomen op grond van
      [artikel 71, tweede lid][ref2], gaat niet eerder in dan nadat de bevoegde militaire autoriteit van het voornemen
      daartoe en de gronden waarop de beschikking berust in kennis is gesteld en deze in de gelegenheid is gesteld binnen
      een redelijke termijn schriftelijke en desgewenst mondelinge opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel71
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel72
