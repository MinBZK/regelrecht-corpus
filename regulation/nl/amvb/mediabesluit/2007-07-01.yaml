        artikel: 51f
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 51f
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 51f
  - number: 25a
    text: |-
      1 Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43][ref1] verzorgen, zijn
      verplicht een behoorlijke boekhouding te voeren en hun jaarrekening vergezeld te laten gaan van een verklaring van
      een accountant-administratieconsulent of een registeraccountant omtrent de getrouwheid ervan.

      2 Deze boekhouding bevat ten minste gegevens over de kosten en opbrengsten, verdeeld naar de kosten en opbrengsten
      van de exploitatie van reclameboodschappen en telewinkelboodschappen, de kosten en opbrengsten van andere
      programma-onderdelen, onderscheidenlijk de kosten en opbrengsten van alle andere activiteiten.

      3 Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43][ref2] verzorgen
      zenden jaarlijks vóór 1 juni de jaarrekening aan het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 43a
  - number: 25b
    text: |-
      Een aanvraag voor toestemming om een programma te verzorgen als bedoeld in [artikel 67 van de Mediawet][ref1],
      wordt door de desbetreffende regionale omroepinstelling die zendtijd heeft verkregen, ingediend bij het
      Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel67
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '67'
  - number: 25c
    text: |-
      Een programma voor regionale omroep als bedoeld in[artikel 67 van de Mediawet][ref1] wordt, voorzover het
      een televisieprogramma betreft, niet uitgezonden tussen 19.00 uur en 23.00 uur, tenzij de Stichting en de
      desbetreffende regionale omroepinstelling anders zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel67
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '67'
  - number: 25d
    text: |-
      1 Een aanvraag voor toestemming om een programma te verzorgen als bedoeld in [artikel 68 van de Mediawet][ref1],
      wordt door de desbetreffende lokale omroepinstelling die zendtijd heeft verkregen, ingediend bij het Commissariaat
      voor de Media.

      2 De aanvraag gaat vergezeld van:

      a. een aanduiding of de aanvraag betrekking heeft op het verzorgen van een radio- of van een televisieprogramma, of
      van beide;

      b. een exemplaar van de notarieel vastgelegde statuten van de instelling die het programma produceert, of, indien
      het niet een rechtspersoon betreft, een aanduiding van de instelling die het programma produceert; en

      c. het advies van de Raad voor cultuur, bedoeld in [artikel 68, tweede lid, onderdeel d, van de Mediawet][ref2].

      3 Indien een lokale omroepinstelling die de in het eerste lid bedoelde toestemming heeft verkregen, in aanmerking
      wil komen voor toestemming in een aansluitende periode, dient zij daartoe ten minste vijf maanden vóór de afloop
      van de periode waarvoor haar toestemming is verleend, een aanvraag in. Het eerste en het tweede lid zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel25d
