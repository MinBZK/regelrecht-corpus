articles:
  - number: '1'
    text: |-
      1 De Stichting doet een concessiebeleidsplan als bedoeld in [artikel 30b, eerste lid, van de Mediawet][ref1], voor
      1 maart van het jaar waarin een lopende concessieperiode eindigt toekomen aan het Commissariaat voor de Media.

      2 De Stichting doet een tussentijds concessiebeleidsplan als bedoeld in
      [artikel 30b, derde lid, van de Mediawet][ref2], voor 1 maart van het jaar waarin het vijfde jaar van een lopende
      concessieperiode eindigt toekomen aan het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel1
