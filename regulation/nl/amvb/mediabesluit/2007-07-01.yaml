        bwb_id: BWBR0004149
        artikel: 46a
  - number: '25'
    text: |-
      1 Het programma van een regionale, onderscheidenlijk lokale, omroepinstelling bestaat voor ten minste vijftig
      procent uit onderdelen die door haarzelf of uitsluitend in haar opdracht zijn geproduceerd.

      2 Indien [artikel 51f, vierde lid, van de Mediawet][ref1] op een lokale omroepinstelling van toepassing
      is, heeft ten minste de helft van de zendtijd, gebruikt voor programma-onderdelen als bedoeld in
      [artikel 51f, vierde lid, onderdeel a, van de Mediawet][ref2], in het bijzonder betrekking op de gemeente waarvoor
      het programma bestemd is, en is ten minste de helft van de zendtijd, gebruikt voor programma-onderdelen als
      bedoeld in [artikel 51f, vierde lid, onderdeel b, van de Mediawet][ref3], door de lokale omroepinstelling zelf of
      uitsluitend in haar opdracht geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel25
