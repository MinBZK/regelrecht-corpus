  - number: '73'
    text: |-
      1 De bevoegde militaire autoriteit gebruikt de aan hem verleende toestemming geheel voor het programma, bedoeld
      in [artikel 68][ref1].

      2 Aan het begin en aan het einde van ieder programma wordt dagelijks ervan melding gemaakt dat het programma
      uitsluitend bestemd is voor de in Nederland gelegerde militairen van de strijdkrachten van de desbetreffende
      lidstaat en hun gezinnen.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
