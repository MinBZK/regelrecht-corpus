  - number: '33'
    text: |-
      1 Een aanvraag voor toestemming om een programma als bedoeld in [artikel 71][ref1], te verzorgen wordt ingediend
      bij het Commissariaat voor de Media.

      2 De aanvraag gaat vergezeld van:

      a. een exemplaar van de statuten;

      b. een opgave van de feitelijke vestigingsplaats, indien deze afwijkt van de statutaire vestigingsplaats;

      c. een aanduiding of de aanvraag betrekking heeft op toestemming voor het verzorgen van een radio- of van een
      televisieprogramma, of van beide;

      d. een omschrijving van de organisatorische en juridische structuur van de aanvrager, alsmede een overzicht van
      zijn bestuurders en aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
  - number: '34'
    text: |-
      Indien een commerciële omroepinstelling, in aanmerking wil komen voor toestemming in een aansluitende periode,
      dient zij een aanvraag bij het Commissariaat voor de Media in ten minste vijf maanden vóór de afloop van de periode
      waarvoor haar toestemming is verleend. Artikel 33 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel34
  - number: 34a
    text: |-
      1 In het televisieprogramma van een commerciële omroepinstelling met een bereik van ten minste 75 procent van alle
      huishoudens in Nederland is met ingang van de in het tweede lid genoemde tijdstippen ten minste een daarbij genoemd
      percentage van de uitzenduren aan oorspronkelijk Nederlandstalige programmaonderdelen voorzien van ondertiteling
      ten behoeve van mensen met een auditieve beperking.

      2 Het in het eerste lid bedoelde percentage is met ingang van:

      a. 1 januari 2008 ten minste 15 procent;

      b. 1 januari 2009 ten minste 25 procent;

      c. 1 januari 2010 ten minste 35 procent;

      d. 1 januari 2011 ten minste 50 procent.

      3 Voor de toepassing van dit artikel worden de programmaonderdelen bestaande uit reclame- of telewinkelboodschappen
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel34a
  - number: '35'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      lijst: de evenementenlijst die is opgenomen in de bij dit besluit behorende [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004237
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004237
  - number: '36'
    text: |-
      1 De evenementen, genoemd in onderdeel A van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van volledige rechtstreekse
      verslaggeving.

      2 In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen, die geheel of gedeeltelijk
      plaatsvinden tussen 00.00 uur en 07.00 uur, niet door middel van volledige rechtstreekse verslaggeving te worden
      uitgezonden.

      3 In afwijking van het eerste lid behoeven wedstrijden die deel uitmaken van de in dat lid bedoelde evenementen
      en die gelijktijdig plaatsvinden niet allemaal door middel van volledige rechtstreekse verslaggeving te worden
      uitgezonden, indien:

      a. ten minste een van deze wedstrijden wordt uitgezonden door middel van volledige rechtstreekse verslaggeving op
      een open net, én

      b. de andere hiervoor bedoelde wedstrijd of wedstrijden op dezelfde dag worden uitgezonden door middel van
      volledige of gedeeltelijke uitgestelde verslaggeving op een open net.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel36
  - number: '37'
    text: |-
      1 De evenementen, genoemd in onderdeel B van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van gedeeltelijke rechtstreekse
      verslaggeving.

      2 De uitzendingen van de evenementen, bedoeld in het eerste lid, hebben de in onderdeel B van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel37
  - number: '38'
    text: |-
      1 De evenementen, genoemd in onderdeel C van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van gedeeltelijke uitgestelde
      verslaggeving.

      2 In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen niet door middel van gedeeltelijke
      uitgestelde verslaggeving te worden uitgezonden, indien deze evenementen worden uitgezonden op een open net door
      middel van volledige rechtstreekse verslaggeving.

      3 De uitzendingen van de evenementen, bedoeld in het eerste lid, hebben de in onderdeel C van de lijst vermelde
      minimumduur.

      4 De uitzendingen van de evenementen, bedoeld in het eerste lid, vinden plaats op de dag van het evenement of
      een onderdeel daarvan, met dien verstande dat de uitzendingen van de wedstrijden van de hoogste divisie van het
      nationaal betaald voetbal uiterlijk aanvangen op de in onderdeel C van de lijst vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel38
  - number: 53c
    text: |-
      1 Voor de toepassing van [artikel 82f van de Mediawet][ref1] worden twee of meer instellingen als één instelling
      aangemerkt, indien:

      a. een instelling direct of indirect zodanige zeggenschap of feitelijke invloed heeft in een of meer andere
      instellingen, dat deze in belangrijke mate het beleid van die instelling of instellingen kan bepalen, dan wel
      aanmerkelijke invloed heeft op de inhoud van dat beleid; of

      b. een natuurlijk persoon of groep van natuurlijke personen direct of indirect zodanige zeggenschap of feitelijke
      invloed heeft in twee of meer instellingen, dat deze in belangrijke mate het beleid van die instellingen kan
      bepalen, dan wel aanmerkelijke invloed heeft op de inhoud van dat beleid.

      2 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat, kan worden
      bepaald dat in afwijking van [artikel 82f, eerste lid, van de Mediawet][ref2] voor de uitzending van de
      radioprogramma's van eenzelfde instelling meer frequentieruimte mag worden gebruikt dan één FM-frequentie of
      samenstel van FM-frequenties.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '54'
    text: |-
      Naast het in [artikel 130, vierde lid, van de Mediawet][ref1] bedoelde geval, kan het Stimuleringsfonds voor de
      pers financiële steun verlenen in de vorm van een uitkering, ten behoeve van:

      a. gezamenlijke projecten van persorganen;

      b. organisatie-onderzoek, gericht op structurele verbetering van de exploitatie van een persorgaan;

      c. onderzoek ten behoeve van de bedrijfstak als geheel, voorzover het onderzoek past in de doelstellingen van het
      Stimuleringsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
  - number: '56'
    text: |-
      De in [artikel 54, onderdeel a][ref1], bedoelde steun kan worden verleend indien:

      a. een project door de gezamenlijke persorganen is ingediend, dat gericht is op structurele verbetering van de
      exploitatiepositie van die persorganen binnen een redelijke termijn;

      b. dit project past in de doelstelling van het Stimuleringsfonds voor de pers;

      c. het Stimuleringsfonds met het project heeft ingestemd; en

      d. het project binnen een redelijke termijn wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '57'
    text: |-
      1 De in [artikel 54, onderdeel b][ref1], bedoelde steun kan worden verleend indien:

      a. de exploitatie van het bedoelde persorgaan over het boekjaar, voorafgaand aan de aanvraag, in een
      verlieslijdende positie heeft verkeerd of daarin terecht dreigde te komen;

      b. de aanvraag een voorstel bevat, inhoudende de opzet en uitvoering van het beoogde onderzoek;

      c. de aanvraag voor de verlening van deze financiële steun uitsluitend gericht is op het verkrijgen van steun voor
      ten hoogste tweederde deel van de kosten van het beoogde organisatie-onderzoek.

      2 De bepalingen van [artikel 56, onderdeel b tot en met d][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel56
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '56'
        hoofdstuk: '5'
  - number: '58'
    text: |-
      1 De in [artikel 54, onderdeel c][ref1], bedoelde steun kan worden verleend indien de aanvraag voor deze financiële
      steun betrekking heeft op:

      a. de persbedrijfstak als geheel;

      b. een vraagstuk, dat verband houdt met de doelstelling van het Stimuleringsfonds voor de pers.

      2 De bepalingen van [artikel 56, onderdeel c en d][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel56
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '56'
        hoofdstuk: '5'
  - number: '59'
    text: |-
      De aanvragen voor financiële steun als bedoeld in de [artikelen 130][ref1] en [131 van de Mediawet][ref2] worden
      bij het Stimuleringsfonds voor de pers ingediend door de rechtspersoon die de uitgaverechten bezit van het
      persorgaan waarop de aanvraag betrekking heeft, dan wel door de betreffende groep of bedrijfstak van persorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel131
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '131'
  - number: '60'
    text: |-
      1 De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel a][ref1], bevat ten minste:

      a. naam en adres van de rechtspersonen die de aanvraag indienen en die de uitgaverechten bezitten van de
      desbetreffende persorganen;

      b. een omschrijving van de juridische structuur van de bij de aanvraag betrokken persorganen; ingeval de uitgever
      van een persorgaan deel uitmaakt van een concern, tevens een omschrijving van de structuur van het concern, alsmede
      een omschrijving van de juridische en economische verhoudingen tussen de aanvrager en de andere vennootschappen van
      het concern;

      c. gegevens over het gezamenlijke project: een beschrijving ervan en van de verwachte effecten daarvan op de
      ontwikkelingen van de kosten, de opbrengsten en de liquiditeit; en

      d. een opgave van de gevraagde financiële steun ter uitvoering van het bedoelde project.

      2 De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel b][ref2], bevat ten minste:

      a. naam en adres van de rechtspersoon die de aanvraag indient en die de uitgaverechten bezit van het desbetreffende
      persorgaan;

      b. gegevens over de financiële positie van het persorgaan;

      c. gegevens over oplage en verspreiding; en

      d. gegevens over opzet en uitvoering van het beoogde onderzoek.

      3 De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel c][ref3], bevat ten minste:

      a. naam en adres van de indiener(s) van de aanvraag;

      b. een omschrijving van de juridische structuur van de bij de aanvraag betrokken persorganen, alsmede een
      omschrijving van de juridische en economische verhoudingen; en

      c. een omschrijving van het beoogde onderzoek, waarvoor de steun gevraagd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '61'
    text: |-
      1 Het Stimuleringsfonds voor de pers bevestigt de ontvangst van de aanvraag.

      2 Indien bij de aanvraag een van de gegevens bedoeld in [artikel 60][ref1] ontbreekt, dient uit de aanvraag te
      blijken waarom de gegevens niet volledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel60
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '60'
        hoofdstuk: '5'
  - number: '62'
    text: |-
      Het Stimuleringsfonds voor de pers kan indien het zulks wenselijk acht de aanvraag voorleggen aan een externe
      adviesinstantie. Daarbij wordt gezorgd dat vertrouwelijke bedrijfsgegevens als zodanig behandeld worden.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel62
  - number: '63'
    text: |-
      1 Het Stimuleringsfonds voor de pers beslist binnen dertien weken na het in behandeling nemen van de aanvraag.

      2 Aanvragen voor financiële steun als bedoeld in [artikel 54, onderdeel a, b en c][ref1], worden in volgorde van
      ontvangst behandeld en beslist. Indien het in een jaar ter beschikking staande bedrag voor steunverlening volledig
      is toegewezen, worden volgende aanvragen afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '64'
    text: |-
      Het Stimuleringsfonds voor de pers kan aan de beschikking tot financiële steunverlening aan de aanvrager
      voorschriften verbinden. Deze hebben betrekking op:

      a. de besteding van de steun overeenkomstig de daaraan ten grondslag liggende doelstellingen;

      b. de wijze waarop en de termijn waarbinnen het project respectievelijk het onderzoek wordt uitgevoerd;

      c. de verslaglegging van de activiteiten en de financiële verantwoording daarvan; en

      d. de eventuele wijzigingen in de financiële structuur van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel64
  - number: '65'
    text: |-
      Van een beschikking tot toekenning of weigering alsmede van de hoogte van de financiële steun, wordt binnen een
      week nadat de beschikking is genomen, mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel65
  - number: '66'
    text: |-
      1 Indien het Stimuleringsfonds voor de pers heeft besloten tot het verlenen van financiële steun en de hoogte
      van het steunbedrag nog niet definitief is vastgesteld, kan het een voorschot toekennen aan de aanvrager. Dit
      voorschot bedraagt ten hoogste 50 procent van de financiële steun zoals die op basis van voorlopige berekeningen
      is becijferd.

      2 Indien een voorschot is uitgekeerd, maar de definitieve berekening op een lager niveau wordt vastgesteld dan
      het verstrekte voorschot, dan dient het verschil tussen voorschot en definitieve uitkering op eerste aanmaning te
      worden terugbetaald aan het Stimuleringsfonds.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel66
  - number: '67'
    text: |-
      Het Stimuleringsfonds voor de pers kan de steunverlening beëindigen en de reeds uitgekeerde bedragen terugvorderen,
      indien:

      a. enig voorschrift verbonden aan steunverlening door de aanvrager niet wordt nagekomen;

      b. blijkt dat de bij de aanvraag overlegde gegevens onjuist waren;

      c. binnen een jaar na de datum waarop de beslissing tot steunverlening is genomen een surseance van betaling of een
      faillissement van de aanvrager is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel67
  - number: '68'
    text: |-
      1 Het Commissariaat voor de Media verleent toestemming voor het verzorgen van een programma uitsluitend bestemd
      voor in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen, dat door middel van een
      omroepzender wordt uitgezonden binnen een gebied van beperkte omvang.

      2 De toestemming wordt verleend aan de bevoegde militaire autoriteiten van een bij de Noord-atlantische
      verdragsorganisatie (NAVO) aangesloten land waarvan strijdkrachten in Nederland zijn gelegerd, voor het gebruik
      door instellingen of personen van de buitenlandse strijdkrachten die daartoe door hen worden aangewezen.

      3 Ten aanzien van het gebruik van de toestemming zijn de [artikelen 52][ref1] tot en met [53a ][ref2], [55][ref3],
      [56][ref4], [56a][ref5], vijfde en zesde lid, [134][ref6], [138b][ref7] en [138d van de Mediawet][ref8] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel56a
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel134
      [ref7]: https://wetten.overheid.nl/BWBR0004149#Artikel138
      [ref8]: https://wetten.overheid.nl/BWBR0004149#Artikel138d
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 53a
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '56'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 56a
      - id: ref6
        bwb_id: BWBR0004149
        artikel: '134'
      - id: ref7
        bwb_id: BWBR0004149
        artikel: '138'
      - id: ref8
        bwb_id: BWBR0004149
        artikel: 138d
  - number: '69'
    text: |-
      Het Commissariaat voor de Media kan zonodig de omroepzender of omroepzenders aanwijzen waarop de programma’s als
      bedoeld in [artikel 68][ref1], zullen worden uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: '70'
    text: |-
      1 Een aanvraag voor de toestemming als bedoeld in [artikel 68][ref1] wordt ingediend bij Onze Minister van
      Defensie, die deze voorzien van zijn opmerkingen binnen vier weken doorzendt aan het Commissariaat voor de Media.
      Het Commissariaat zendt een afschrift van de aanvraag aan Onze Minister van Verkeer en Waterstaat.

      2 De aanvraag gaat vergezeld van:

      a. een omschrijving van het doel van de aanvraag;

      b. een aanduiding van het gebied waarbinnen het programma zal worden uitgezonden;

      c. een verklaring van de auteursrechthebbenden aan de autoriteiten van de betreffende NAVO-lidstaat waaruit blijkt
      dat geen auteursrechtelijke toestemming zal worden verleend voor de verspreiding van het programma buiten de in
      [artikel 68][ref2] omschreven doelgroep en het gebied; en

      d. een omschrijving van de te gebruiken omroepzender waarop het programma zal worden uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004237
