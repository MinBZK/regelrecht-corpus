  - number: 32h
    text: |-
      1 Op neventaken van instellingen die zendtijd hebben verkregen voor landelijke omroep
      die bestaan uit het uitzenden van televisieprogramma’s is het bepaalde bij of krachtens
      [artikel 54, eerste tot en met vijfde, zevende en achtste lid, van de Mediawet][ref1] van overeenkomstige
      toepassing op elk van die televisieprogramma’s, met dien verstande dat in afwijking van het
      [tweede lid, eerste en tweede volzin, van genoemd artikel][ref2] een percentage van tien geldt.

      2 Op neventaken van instellingen die zendtijd hebben verkregen voor regionale omroep die bestaan uit het uitzenden
      van televisieprogramma’s is het bepaalde bij of krachtens [artikel 54, zesde en achtste lid, van de Mediawet][ref3]
      van overeenkomstige toepassing op elk van die televisieprogramma’s.

      3 Het Commissariaat voor de Media kan in bijzondere gevallen tijdelijk gedeeltelijk
      ontheffing verlenen van het eerste en tweede lid voor zover het betreft
      [artikel 54, eerste lid en zesde lid, eerste volzin, van de Mediawet][ref4], met dien verstande dat het percentage
      niet lager gesteld kan worden dan tien.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel54
