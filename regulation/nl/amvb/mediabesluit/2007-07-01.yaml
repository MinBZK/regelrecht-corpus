  - number: '13'
    text: |-
      De zendtijd voor landelijke radio-omroep wordt zodanig ingedeeld, dat de programma’s van de omroepverenigingen op
      ten minste drie radioprogrammanetten worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel13
  - number: '15'
    text: |-
      1 In het programma van de Programmastichting worden de volgende programma-onderdelen opgenomen:

      a. achtergrondinformatie en beschouwingen over politieke en maatschappelijke ontwikkelingen, onder meer op het
      gebied van economie, wetenschap en techniek;

      b. programma-onderdelen ten behoeve van maatschappelijke doelgroepen die elders niet of niet voldoende tot hun
      recht komen;

      c. consumentenvoorlichting; en

      d. andere programma-onderdelen dan die, bedoeld in [de onderdelen ][ref1] tot en met [][ref2] en in
      [artikel 51][ref3], die voorzien in de bevrediging van in het volk levende maatschappelijke, culturele,
      godsdienstige of geestelijke behoeften, zodanig dat het programma van de Programmastichting te zamen met de
      programma’s van de andere instellingen die zendtijd voor landelijke omroep hebben verkregen, een evenwichtig beeld
      oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke verscheidenheid in Nederland.

      2 In het televisieprogramma van de Programmastichting worden, naast de in het eerste lid genoemde programma-
      onderdelen, voorts opgenomen:

      a. ten minste twintig procent programma-onderdelen ten behoeve van of betrekking hebbend op etnische en culturele
      minderheden; en

      b. programma-onderdelen van educatieve aard ten behoeve van de jeugd.

      3 In het radioprogramma van de Programmastichting wordt, naast de in het eerste lid genoemde programma-onderdelen,
      voorts opgenomen ten minste vijfentwintig procent programma-onderdelen ten behoeve van of betrekking hebbend op
      etnische en culturele minderheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51b
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel15
