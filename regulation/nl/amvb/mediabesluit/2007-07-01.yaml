  - number: '22'
    text: |-
      1 De regionale omroepinstelling waaraan zendtijd is toegewezen, dient jaarlijks vóór 1 november bij het
      Commissariaat voor de Media een voorstel in met betrekking tot de vaststelling van de hoeveelheid zendtijd en de
      aanwijzing van de dagen en uren voor het daaropvolgende jaar.

      2 Het Commissariaat stelt jaarlijks vóór 30 november de hoeveelheid zendtijd voor het daaropvolgende jaar vast en
      wijst daarbij tevens aan de dagen en uren en zonodig de omroepzender of omroepzenders waarop het programma wordt
      uitgezonden. De zendtijd gaat in op 1 januari van dat daaropvolgende jaar.

      3 Indien het Commissariaat gebruik maakt van de bevoegdheid, neergelegd in [artikel 20, vierde lid][ref1], zijn
      [het eerste en tweede lid van dit artikel][ref2] van overeenkomstige toepassing ten aanzien van lokale omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel22
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel22
