  - number: '7'
    text: |-
      De Stichting Etherreclame heeft per jaar de beschikking over 10 procent van de totale gebruikte televisie-
      onderscheidenlijk radiozendtijd voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel7
  - number: '8'
    text: |-
      Toewijzing van zendtijd voor landelijke omroep kan, behoudens in de gevallen, bedoeld in [artikel 39][ref1],
      uitsluitend geschieden indien daarvoor een aanvraag bij het Commissariaat voor de Media is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39g
  - number: '9'
    text: |-
      1 Aanvragen voor toewijzing van zendtijd op grond van [artikel 39h van de Mediawet ][ref1]worden ingediend
      in de maand september. Aanvragen op grond van [artikel 39f van de Mediawet][ref2] worden ingediend in
      de maand september van het jaar voorafgaande aan het jaar waarin de vijfjaarlijkse periode, bedoeld in
      [artikel 39f, eerste lid, van de Mediawet][ref3], waarin zendtijd op grond van dat artikel kan worden toegewezen,
      eindigt.

      2 Het Commissariaat voor de Media besluit voor 1 januari van het jaar, volgend op het jaar waarin de aanvraag is
      ingediend, op de aanvraag.

      3 Indien toewijzing van zendtijd plaatsvindt, gaat deze in op 1 september van het jaar, volgend op het jaar waarin
      de aanvraag is ingediend.

      4 In bijzondere gevallen kan het Commissariaat afwijken van de in het derde lid bedoelde ingangsdatum van de
      toewijzing van zendtijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39h
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
