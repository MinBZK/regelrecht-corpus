preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur, van Onze Minister-president, Minister
    van Algemene Zaken en van Onze Minister van Binnenlandse Zaken, van 30 september 1987, RTP/JZ/U-90646 en in
    overeenstemming met onze Minister van Financiën;

    Gelet op de artikelen 31, eerste en vierde lid, 35, 38, eerste lid, 39, tweede lid, 42, vijfde lid, 50, eerste lid,
    51, vierde lid, 52, tweede lid, 58, derde en vierde lid, 72, vierde lid, 91, vierde lid, 103, 106, tweede lid, 107,
    eerste lid, 111, tweede en vijfde lid, 112, tweede en vijfde lid, 113, tweede lid, 116, 118, 119, tweede lid, 121,
    derde lid, 131, 132, tweede en derde lid, 160 en 168, eerste lid, van de Mediawet (Stb. 1987, 249);

    Gelet op artikel 1, eerste lid, van de Wet openbaarheid van bestuur (Stb. 1978, 581) en artikel 1, eerste lid,
    onderdeel b, van de Wet nationale ombudsman (Stb. 1981, 35);

    De Raad van State gehoord (advies van 10 november 1987, no. W13.87.0514);

    Gezien het nader rapport van Onze voornoemde ministers van 18 november 1987, nr. RTP/JZ/U-90973;

    Hebben goedgevonden en verstaan:
