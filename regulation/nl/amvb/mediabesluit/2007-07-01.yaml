  - number: '23'
    text: |-
      1 Indien het Commissariaat voor de Media constateert dat de regionale of lokale omroepinstelling niet meer voldoet
      aan de in [artikel 30, onderdeel b en c, van de Mediawet][ref1] gestelde vereisten, stelt het de omroepinstelling,
      provinciale staten of de gemeenteraad gehoord, daarvan op de hoogte onder verwijzing naar het gestelde in
      [artikel 45, eerste en derde lid, van de Mediawet][ref2].

      2 Binnen vier weken na afloop van het jaar na de mededeling, bedoeld in het eerste lid, doet het Commissariaat
      mededeling aan de regionale of lokale omroepinstelling van zijn beslissing omtrent de zendtijd van die
      omroepinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
