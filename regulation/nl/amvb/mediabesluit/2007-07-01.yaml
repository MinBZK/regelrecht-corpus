  - number: '30'
    text: |-
      In radio- of televisieprogramma-onderdelen zijn vermijdbare reclame-uitingen in de vorm van het tonen of vermelden
      van de naam van een bedrijf of instelling toegestaan, mits:

      a. de naam uitsluitend betrekking heeft op de benaming van een sportvereniging of sportwedstrijd;

      b. de naam niet met nadruk wordt getoond of vermeld; en

      c. de naamgeving, voor zover het de benaming van een Nederlandse sportvereniging betreft, is erkend door de
      desbetreffende bij de NOC*NSF aangesloten sportorganisatie.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel30
  - number: 30a
    text: |-
      1 Een televisieprogramma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat in Nederland
      plaatsvindt of is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen, mag
      vermijdbare reclame-uitingen bevatten, indien het evenement niet voornamelijk bestemd is om als programma te worden
      uitgezonden, en de reclame-uitingen niet overheersend zijn.

      2 Een televisieprogramma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat in het
      buitenland plaatsvindt en niet is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen,
      mag vermijdbare reclame-uitingen bevatten, indien het evenement niet voornamelijk bestemd is om als programma te
      worden uitgezonden, en de reclame-uitingen niet langer of met meer nadruk in het programma-onderdeel voorkomen dan
      nodig is in het kader van een evenwichtige registratie en presentatie.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel30a
  - number: '31'
    text: |-
      1 Een programma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat niet voornamelijk bestemd
      is om als programma te worden uitgezonden, mag gedurende ten hoogste vijf seconden, aan het begin of aan het einde
      van het programma-onderdeel, vermijdbare reclame-uitingen bevatten, bestaande uit de namen of (beeld)merken van
      die personen, bedrijven of instellingen, die een belangrijke, schriftelijk overeengekomen bijdrage hebben geleverd
      aan de totstandkoming van het evenement. De vermelding of vertoning is zodanig vormgegeven dat zij niet voldoet
      aan de definitie van reclameboodschap, bedoeld in [artikel 1, onderdeel kk, van de Mediawet][ref1]. Indien het
      een programma-onderdeel voor televisie betreft, bestaande uit het verslag of de weergave van een evenement dat
      is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen en dat niet voornamelijk is
      bestemd om als programma te worden uitgezonden, geschiedt de vertoning of vermelding uitsluitend via stilstaande
      beelden.

      2 Het eerste lid is niet van toepassing ten aanzien van personen, bedrijven of instellingen:

      a. die zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten, of

      b. die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld [onder ][ref2], of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de
      indruk krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in
      [onderdeel ][ref3] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004237#Artikel31
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel31
