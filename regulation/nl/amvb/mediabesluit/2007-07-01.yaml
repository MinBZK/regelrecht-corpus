        artikel: '68'
  - number: 26a
    text: Deze afdeling is niet van toepassing op reclameboodschappen.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel26a
  - number: '27'
    text: |-
      Niet vermijdbaar zijn reclame-uitingen die behoren tot het normale straatbeeld en die zonder opzet en zonder nadruk
      gedurende enkele seconden in een programma-onderdeel voorkomen.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel27
  - number: '28'
    text: |-
      1 In programma-onderdelen van informatieve en educatieve aard zijn vermijdbare reclame-uitingen in de vorm van het
      tonen of vermelden van een product of dienst toegestaan, mits:

      a. de vertoning of vermelding past binnen de context van het programma;

      b. de vertoning of vermelding geen afbreuk doet aan de programma-formule of de integriteit van het programma;

      c. de vertoning of vermelding niet op een overdreven of overdadige wijze plaatsvindt; en

      d. er geen sprake is van specifieke aanprijzingen van deze producten of diensten.

      2 Het eerste lid is van overeenkomstige toepassing op andere programma-onderdelen, met uitzondering van programma-
      onderdelen die in het bijzonder bestemd zijn voor minderjarigen beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel28
  - number: '29'
    text: |-
      1 Onverminderd [artikel 28][ref1] mogen programma-onderdelen van informatieve of educatieve aard
      vermijdbare reclame-uitingen in de vorm van het tonen of vermelden van namen of (beeld)merken van bepaalde
      producten of diensten of van namen van bedrijven of instellingen bevatten. Op deze reclame-uitingen is
      [artikel 28, eerste lid, onderdelen ][ref2] van overeenkomstige toepassing.

      2 In afwijking van [artikel 28, eerste lid, onderdeel ][ref3], mogen programma-onderdelen van informatieve of
      educatieve aard vermijdbare reclame-uitingen bevatten, bestaande uit het aankondigen en recenseren van boeken,
      video's, compact discs en soortgelijke culturele uitingen, alsmede van toneel,- muziek- en filmuitvoeringen,
      tentoonstellingen en soortgelijke evenementen van kunstzinnige aard.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004237#Artikel28
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel29
