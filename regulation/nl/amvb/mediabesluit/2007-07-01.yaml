  - number: '32'
    text: |-
      1 Een programma-onderdeel voor televisie, bestaande uit een film die voor een zaal publiek is of wordt vertoond,
      dan wel een televisiebewerking daarvan, mag vermijdbare reclame-uitingen bevatten die bestaan uit het vermelden of
      tonen van namen, (beeld)merken, producten of diensten van personen, bedrijven of instellingen, indien die reclame-
      uitingen in het programma-onderdeel voorkomen in dezelfde vorm en in ten hoogste dezelfde hoeveelheid als in de
      voor een zaal publiek bestemde versie van de film.

      2 Een uit het buitenland aangekocht programma-onderdeel dat ten behoeve van het buitenlandse publiek als programma
      is uitgezonden, mag vermijdbare reclame-uitingen bevatten die bestaan uit het vermelden of tonen van namen,
      (beeld)merken, producten of diensten van personen, bedrijven of instellingen, indien die reclame-uitingen in het
      programma-onderdeel voorkomen in dezelfde vorm en in ten hoogste dezelfde hoeveelheid als in de ten behoeve van het
      buitenlandse publiek uitgezonden versie van het programma-onderdeel.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32
  - number: 32a
    text: |-
      1 Bij ministeriële regeling kunnen nadere regels en modellen worden vastgesteld voor de inhoud en inrichting van:

      a. de begroting voor de instellingen die zendtijd hebben verkregen voor landelijke omroep, bedoeld in
      [artikel 99 van de Mediawet][ref1];

      b. de begroting van de Wereldomroep, bedoeld in [artikel 108 van de Mediawet][ref2].

      2 Bij ministeriële regeling kunnen nadere regels en modellen worden vastgesteld voor de inrichting van de
      jaarrekening, bedoeld in [artikel 109 van de Mediawet][ref3], van onderscheidenlijk de omroepverenigingen, de
      Programmastichting, de Stichting, de educatieve omroepinstelling, de Stichting Etherreclame, de kerkgenootschappen
      en genootschappen op geestelijke grondslag die zendtijd hebben verkregen en de Wereldomroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel109
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32a
