  - number: '10'
    text: |-
      1 Een aanvraag tot toewijzing van zendtijd als bedoeld in [artikel 39][ref1] wordt ingediend door Onze Minister van
      Algemene Zaken.

      2 Het Commissariaat voor de Media wijst de in het eerste lid bedoelde zendtijd toe aan Onze Minister van Algemene
      Zaken voor het gebruik door overheidsinstellingen of personen die daartoe door deze minister zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39h
