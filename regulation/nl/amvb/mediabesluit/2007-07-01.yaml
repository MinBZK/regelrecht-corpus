  - number: '16'
    text: |-
      1 In het programma van de Stichting worden in ieder geval opgenomen de volgende programma-onderdelen:

      a. de dagelijkse nieuwsvoorziening;

      b. de verslaggeving over Nederlandse en Europese parlementaire aangelegenheden;

      c. de verslaggeving van nationale feest- en gedenkdagen;

      d. de actuele sportverslaggeving, waaronder in ieder geval begrepen de competitie- en bekerwedstrijden en
      internationale evenementen;

      e. de verslaglegging van andere nationale en internationale gebeurtenissen van bijzondere aard, staatsbezoeken
      daaronder begrepen.

      2 In het televisieprogamma van de Stichting worden, naast de in het eerste lid genoemde programma-onderdelen,
      voorts opgenomen de nieuwsvoorziening ten behoeve van de jeugd en de nieuwsvoorziening ten behoeve van doven en
      slechthorenden.

      3 In het radioprogramma van de Stichting worden, naast de in het eerste lid genoemde programma-onderdelen, voorts
      opgenomen programma-onderdelen van dienstverlenende aard zoals informatie ten behoeve van scheepvaart, visserij,
      land- en tuinbouw en verkeer, alsmede ochtendgymnastiek.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel16
  - number: 16a
    text: |-
      1 In de zendtijd voor televisie van de gezamenlijke instellingen die zendtijd hebben verkregen voor landelijke
      omroep is met ingang van de in het tweede lid genoemde tijdstippen ten minste een daarbij genoemd percentage van de
      totale hoeveelheid zendtijd die wordt besteed aan oorspronkelijk Nederlandstalige programmaonderdelen, voorzien van
      ondertiteling ten behoeve van mensen met een auditieve beperking.

      2 Het in het eerste lid bedoelde percentage is met ingang van:

      a. 1 januari 2008 ten minste 80 procent;

      b. 1 januari 2009 ten minste 85 procent;

      c. 1 januari 2010 ten minste 90 procent;

      d. 1 januari 2011 ten minste 95 procent.

      3 Voor de toepassing van dit artikel worden de programmaonderdelen verzorgd door de Stichting Etherreclame buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel16a
  - number: '17'
    text: |-
      Inkomsten uit programmabladen van een omroepvereniging kunnen jaarlijks tot ten hoogste het bedrag dat nodig is om
      een eventueel verlies van de desbetreffende omroepvereniging te dekken, worden besteed aan verenigingsactiviteiten.
      Bij de bepaling van het resultaat blijven veranderingen in de waarde van de materiële vaste activa als gevolg van
      herwaarderingen buiten beschouwing. De gebruikelijke jaarlijkse afschrijvingen van de materiële vaste activa worden
      niet als herwaarderingen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel17
  - number: '18'
    text: |-
      1 Een aanvraag tot toewijzing van zendtijd voor regionale of lokale omroep wordt ingediend bij het Commissariaat
      voor de Media.

      2 De aanvraag heeft betrekking op een periode van ten minste vijf jaar.

      3 De aanvraag gaat vergezeld van:

      a. een exemplaar van de notarieel vastgelegde statuten;

      b. een overzicht van de belangrijkste in de gemeente of provincie voorkomende maatschappelijke, culturele,
      godsdienstige en geestelijke stromingen van waaruit leden worden benoemd in het in [artikel 30, onderdeel ][ref1]
      bedoelde orgaan van de regionale of lokale omroepinstelling;

      c. een overzicht van degenen die vanuit de in [onderdeel ][ref2] genoemde stromingen zitting hebben in bedoeld
      bestuursorgaan.

      d. een aanduiding of de aanvraag betrekking heeft op zendtijd voor radio of televisie, of op beide;

      e. een aanduiding van het gebied waarbinnen het programma zal worden uitgezonden; en

      f. een opgave van de gewenste hoeveelheid zendtijd alsmede van de dagen en uren waarop de zendtijd gewenst wordt.

      4 Het in het derde lid, onderdeel *f*, bepaalde is niet van toepassing op een verzoek om toestemming te verlenen
      een programma voor lokale omroep te verzorgen dat wordt uitgezonden door middel van een omroepnetwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel18
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel18
