        artikel: 30b
  - number: '2'
    text: |-
      1 Een aanvraag voor een erkenning of een voorlopige erkenning voor programmaverzorging voor landelijk omroep als
      bedoeld in [artikel 31][ref1], respectievelijk [artikel 37 van de Mediawet,][ref2] wordt ingediend in de maand juni
      van het jaar voorafgaande aan het jaar waarin een lopende erkenningperiode eindigt.

      2 Een aanvraag voor een erkenning of voorlopige erkenning gaat vergezeld van de statuten van de aanvrager.

      3 Onze Minister besluit voor 1 januari van het jaar, volgend op het jaar waarin de aanvraag voor een erkenning of
      voorlopige erkenning is ingediend, op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '37'
  - number: '3'
    text: |-
      1 De aanvragen voor een erkenning of voorlopige erkenning voor landelijke omroep liggen vanaf het tijdstip waarop
      zij ter advisering aan de Raad voor cultuur zijn voorgelegd, tot het tijdstip waarop Onze Minister op de aanvragen
      heeft beslist, voor een ieder ter inzage in de bibliotheek van het Ministerie van Onderwijs, Cultuur en Wetenschap.

      2 De terinzagelegging van het beleidsplan, bedoeld in [artikel 32, tweede lid][ref1], respectievelijk
      [artikel 37a, eerste lid, van de Mediawet][ref2], blijft achterwege, voor zover:

      a. het beleidsplan bedrijfsgegevens bevat, die door de aanvrager vertrouwelijk aan Onze Minister zijn medegedeeld;
      of

      b. de terinzagelegging zou leiden tot onevenredige benadeling van de aanvrager of onevenredige bevoordeling van
      derden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37a
