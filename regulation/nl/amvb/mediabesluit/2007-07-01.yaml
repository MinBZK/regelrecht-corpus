  - number: 32c
    text: |-
      In deze afdeling wordt verstaan onder neventaken: activiteiten als bedoeld in
      [artikel 13c, derde lid, van de Mediawet][ref1], die bestaan uit het anders dan als programma waarvoor zendtijd is
      verkregen, verzorgen van elektronische producten met beeld, geluid of tekst, en het al dan niet tegen betaling, al
      dan niet gecodeerd of al dan niet op individueel verzoek analoog of digitaal verspreiden daarvan via elektronische
      communicatienetwerken als bedoeld in [artikel 1.1, onderdeel e, van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '1.1'
  - number: 32d
    text: |-
      1 De in [artikel 99, tweede lid, onderdeel b, van de Mediawet][ref1] bedoelde beschrijving bevat in elk geval een
      opgave van aard, aantal en voorziene duur van de voorgenomen neventaken en een onderbouwing op welke wijze die
      neventaken mede invulling geven aan de taak van de publieke omroep op landelijk niveau en daarmee voldoen aan de
      democratische, sociale en culturele behoeften van de samenleving.

      2 De in [artikel 99, derde lid, onderdeel b, van de Mediawet][ref2] bedoelde opgave geeft tevens aan op welke wijze
      de benodigde bedragen worden gefinancierd.

      3 Instellingen die zendtijd hebben verkregen voor landelijke omroep verrichten uitsluitend neventaken indien deze
      door Onze Minister zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '99'
  - number: 32e
    text: |-
      1 Instellingen die zendtijd hebben verkregen voor regionale of lokale omroep die een neventaak willen verrichten,
      melden het voornemen daartoe bij het Commissariaat voor de Media op de door deze voorgeschreven wijze.

      2 De melding bevat in elk geval een onderbouwing op welke wijze de voorgenomen neventaak mede invulling geeft aan
      de taak van de publieke omroep op regionaal respectievelijk lokaal niveau en daarmee voorziet in democratische,
      sociale en culturele behoeften, alsmede een opgave van de benodigde financiële middelen en de wijze van
      financiering daarvan.

      3 Instellingen die zendtijd hebben verkregen voor regionale of lokale omroep verrichten uitsluitend neventaken
      indien deze door het Commissariaat zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32e
  - number: 32f
    text: |-
      Goedkeuring op grond van de [artikelen 32d, derde lid][ref1], en [32e, derde lid][ref2], laat onverlet het bepaalde
      bij of krachtens de [Telecommunicatiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0004237/2007-07-01#Artikel32f
