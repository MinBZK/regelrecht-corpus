---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mediabesluit
regulatory_layer: AMVB
publication_date: '2009-06-30'
valid_from: '2006-10-06'
bwb_id: BWBR0004237
url: https://wetten.overheid.nl/BWBR0004237/2006-10-06
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur, van Onze Minister-president, Minister
    van Algemene Zaken en van Onze Minister van Binnenlandse Zaken, van 30 september 1987, RTP/JZ/U-90646 en in
    overeenstemming met onze Minister van Financiën;

    Gelet op de artikelen 31, eerste en vierde lid, 35, 38, eerste lid, 39, tweede lid, 42, vijfde lid, 50, eerste lid,
    51, vierde lid, 52, tweede lid, 58, derde en vierde lid, 72, vierde lid, 91, vierde lid, 103, 106, tweede lid, 107,
    eerste lid, 111, tweede en vijfde lid, 112, tweede en vijfde lid, 113, tweede lid, 116, 118, 119, tweede lid, 121,
    derde lid, 131, 132, tweede en derde lid, 160 en 168, eerste lid, van de Mediawet (Stb. 1987, 249);

    Gelet op artikel 1, eerste lid, van de Wet openbaarheid van bestuur (Stb. 1978, 581) en artikel 1, eerste lid,
    onderdeel b, van de Wet nationale ombudsman (Stb. 1981, 35);

    De Raad van State gehoord (advies van 10 november 1987, no. W13.87.0514);

    Gezien het nader rapport van Onze voornoemde ministers van 18 november 1987, nr. RTP/JZ/U-90973;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De Stichting doet een concessiebeleidsplan als bedoeld in [artikel 30b, eerste lid, van de Mediawet][ref1], voor
      1 maart van het jaar waarin een lopende concessieperiode eindigt toekomen aan het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
  - number: '1.2'
    text: |-
      De Stichting doet een tussentijds concessiebeleidsplan als bedoeld in
      [artikel 30b, derde lid, van de Mediawet][ref1], voor 1 maart van het jaar waarin het vijfde jaar van een lopende
      concessieperiode eindigt toekomen aan het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 30b
  - number: '2.1'
    text: |-
      Een aanvraag voor een erkenning of een voorlopige erkenning voor programmaverzorging voor landelijk omroep als
      bedoeld in [artikel 31][ref1], respectievelijk [artikel 37 van de Mediawet,][ref2] wordt ingediend in de maand juni
      van het jaar voorafgaande aan het jaar waarin een lopende erkenningperiode eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '37'
  - number: '2.2'
    text: Een aanvraag voor een erkenning of voorlopige erkenning gaat vergezeld van de statuten van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister besluit voor 1 januari van het jaar, volgend op het jaar waarin de aanvraag voor een erkenning of
      voorlopige erkenning is ingediend, op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel2
  - number: '3.1'
    text: |-
      De aanvragen voor een erkenning of voorlopige erkenning voor landelijke omroep liggen vanaf het tijdstip
      waarop zij ter advisering aan de Raad voor cultuur zijn voorgelegd, tot het tijdstip waarop Onze Minister op de
      aanvragen heeft beslist, voor een ieder ter inzage in de bibliotheek van het Ministerie van Onderwijs, Cultuur en
      Wetenschappen te Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel3
  - number: '3.2'
    text: |-
      De terinzagelegging van het beleidsplan, bedoeld in [artikel 32, tweede lid][ref1], respectievelijk
      [artikel 37a, eerste lid, van de Mediawet][ref2], blijft achterwege, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel37a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 37a
  - number: 3.2.a
    text: het beleidsplan bedrijfsgegevens bevat, die door de aanvrager vertrouwelijk aan Onze Minister zijn medegedeeld; of
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel3
  - number: 3.2.b
    text: |-
      de terinzagelegging zou leiden tot onevenredige benadeling van de aanvrager of onevenredige bevoordeling van
      derden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel3
  - number: '7'
    text: |-
      De Stichting Etherreclame heeft per jaar de beschikking over 10 procent van de totale gebruikte televisie-
      onderscheidenlijk radiozendtijd voor landelijke omroep.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel7
  - number: '8'
    text: |-
      Toewijzing van zendtijd voor landelijke omroep kan, behoudens in de gevallen, bedoeld in [artikel 39][ref1],
      uitsluitend geschieden indien daarvoor een aanvraag bij het Commissariaat voor de Media is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39g
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39g
  - number: '9.1'
    text: |-
      Aanvragen voor toewijzing van zendtijd op grond van [artikel 39h van de Mediawet ][ref1]worden ingediend
      in de maand september. Aanvragen op grond van [artikel 39f van de Mediawet][ref2] worden ingediend in
      de maand september van het jaar voorafgaande aan het jaar waarin de vijfjaarlijkse periode, bedoeld in
      [artikel 39f, eerste lid, van de Mediawet][ref3], waarin zendtijd op grond van dat artikel kan worden toegewezen,
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39h
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel39f
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39h
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 39f
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 39f
  - number: '9.2'
    text: |-
      Het Commissariaat voor de Media besluit voor 1 januari van het jaar, volgend op het jaar waarin de aanvraag is
      ingediend, op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel9
  - number: '9.3'
    text: |-
      Indien toewijzing van zendtijd plaatsvindt, gaat deze in op 1 september van het jaar, volgend op het jaar waarin de
      aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel9
  - number: '9.4'
    text: |-
      In bijzondere gevallen kan het Commissariaat afwijken van de in het derde lid bedoelde ingangsdatum van de
      toewijzing van zendtijd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel9
  - number: '10.1'
    text: |-
      Een aanvraag tot toewijzing van zendtijd als bedoeld in [artikel 39][ref1] wordt ingediend door Onze Minister van
      Algemene Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel39h
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 39h
  - number: '10.2'
    text: |-
      Het Commissariaat voor de Media wijst de in het eerste lid bedoelde zendtijd toe aan Onze Minister van Algemene
      Zaken voor het gebruik door overheidsinstellingen of personen die daartoe door deze minister zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel10
  - number: '13'
    text: |-
      De zendtijd voor landelijke radio-omroep wordt zodanig ingedeeld, dat de programma’s van de omroepverenigingen op
      ten minste drie radioprogrammanetten worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel13
  - number: '15.1'
    text: 'In het programma van de Programmastichting worden de volgende programma-onderdelen opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.1.a
    text: |-
      achtergrondinformatie en beschouwingen over politieke en maatschappelijke ontwikkelingen, onder meer op het gebied
      van economie, wetenschap en techniek;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.1.b
    text: |-
      programma-onderdelen ten behoeve van maatschappelijke doelgroepen die elders niet of niet voldoende tot hun recht
      komen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.1.c
    text: consumentenvoorlichting; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.1.d
    text: |-
      andere programma-onderdelen dan die, bedoeld in [de onderdelen ][ref1] tot en met [][ref2] en in
      [artikel 51][ref3], die voorzien in de bevrediging van in het volk levende maatschappelijke, culturele,
      godsdienstige of geestelijke behoeften, zodanig dat het programma van de Programmastichting te zamen met de
      programma’s van de andere instellingen die zendtijd voor landelijke omroep hebben verkregen, een evenwichtig beeld
      oplevert van de maatschappelijke, culturele, godsdienstige en geestelijke verscheidenheid in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51b
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 51b
  - number: '15.2'
    text: |-
      In het televisieprogramma van de Programmastichting worden, naast de in het eerste lid genoemde programma-
      onderdelen, voorts opgenomen:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.2.a
    text: |-
      ten minste twintig procent programma-onderdelen ten behoeve van of betrekking hebbend op etnische en culturele
      minderheden; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: 15.2.b
    text: programma-onderdelen van educatieve aard ten behoeve van de jeugd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: '15.3'
    text: |-
      In het radioprogramma van de Programmastichting wordt, naast de in het eerste lid genoemde programma-onderdelen,
      voorts opgenomen ten minste vijfentwintig procent programma-onderdelen ten behoeve van of betrekking hebbend op
      etnische en culturele minderheden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel15
  - number: '16.1'
    text: 'In het programma van de Stichting worden in ieder geval opgenomen de volgende programma-onderdelen:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: 16.1.a
    text: de dagelijkse nieuwsvoorziening;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: 16.1.b
    text: de verslaggeving over Nederlandse en Europese parlementaire aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: 16.1.c
    text: de verslaggeving van nationale feest- en gedenkdagen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: 16.1.d
    text: |-
      de actuele sportverslaggeving, waaronder in ieder geval begrepen de competitie- en bekerwedstrijden en
      internationale evenementen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: 16.1.e
    text: |-
      de verslaglegging van andere nationale en internationale gebeurtenissen van bijzondere aard, staatsbezoeken
      daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: '16.2'
    text: |-
      In het televisieprogamma van de Stichting worden, naast de in het eerste lid genoemde programma-onderdelen,
      voorts opgenomen de nieuwsvoorziening ten behoeve van de jeugd en de nieuwsvoorziening ten behoeve van doven en
      slechthorenden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: '16.3'
    text: |-
      In het radioprogramma van de Stichting worden, naast de in het eerste lid genoemde programma-onderdelen, voorts
      opgenomen programma-onderdelen van dienstverlenende aard zoals informatie ten behoeve van scheepvaart, visserij,
      land- en tuinbouw en verkeer, alsmede ochtendgymnastiek.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel16
  - number: '17'
    text: |-
      Inkomsten uit programmabladen van een omroepvereniging kunnen jaarlijks tot ten hoogste het bedrag dat nodig is om
      een eventueel verlies van de desbetreffende omroepvereniging te dekken, worden besteed aan verenigingsactiviteiten.
      Bij de bepaling van het resultaat blijven veranderingen in de waarde van de materiële vaste activa als gevolg van
      herwaarderingen buiten beschouwing. De gebruikelijke jaarlijkse afschrijvingen van de materiële vaste activa worden
      niet als herwaarderingen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel17
  - number: '18.1'
    text: |-
      Een aanvraag tot toewijzing van zendtijd voor regionale of lokale omroep wordt ingediend bij het Commissariaat voor
      de Media.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: '18.2'
    text: De aanvraag heeft betrekking op een periode van ten minste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: '18.3'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: 18.3.a
    text: een exemplaar van de notarieel vastgelegde statuten;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: 18.3.b
    text: |-
      een overzicht van de belangrijkste in de gemeente of provincie voorkomende maatschappelijke, culturele,
      godsdienstige en geestelijke stromingen van waaruit leden worden benoemd in het in [artikel 30, onderdeel ][ref1]
      bedoelde orgaan van de regionale of lokale omroepinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '30'
  - number: 18.3.c
    text: |-
      een overzicht van degenen die vanuit de in [onderdeel ][ref1] genoemde stromingen zitting hebben in bedoeld
      bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel18
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
  - number: 18.3.d
    text: een aanduiding of de aanvraag betrekking heeft op zendtijd voor radio of televisie, of op beide;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: 18.3.e
    text: een aanduiding van het gebied waarbinnen het programma zal worden uitgezonden; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: 18.3.f
    text: een opgave van de gewenste hoeveelheid zendtijd alsmede van de dagen en uren waarop de zendtijd gewenst wordt.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: '18.4'
    text: |-
      Het in het derde lid, onderdeel *f*, bepaalde is niet van toepassing op een verzoek om toestemming te verlenen een
      programma voor lokale omroep te verzorgen dat wordt uitgezonden door middel van een omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel18
  - number: '19.1'
    text: |-
      Het Commissariaat voor de Media legt de aanvraag tot toewijzing van zendtijd voor regionale omroep binnen vier
      weken na de datum van ontvangst voor aan provinciale staten.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel19
  - number: '19.2'
    text: |-
      Provinciale staten brengen binnen achttien weken na ontvangst van het verzoek, bedoeld in het eerste lid, advies
      uit aan het Commissariaat en verklaren of zij bereid zijn voor de bekostiging van regionale omroep zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel19
  - number: '19.3'
    text: Het Commissariaat beslist binnen vier weken na ontvangst van het advies van provinciale staten.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel19
  - number: '19.4'
    text: |-
      Bij toewijzing van zendtijd stelt het Commissariaat tevens voor het eerste kalenderjaar of het nog resterende deel
      daarvan, de hoeveelheid zendtijd vast en wijst het de dagen en uren en zonodig de omroepzender of omroepzenders
      aan waarop het programma wordt uitgezonden. De datum waarop de zendtijd ingaat wordt, gehoord de regionale
      omroepinstelling, door het Commissariaat vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel19
  - number: '20.1'
    text: |-
      Het Commissariaat voor de Media legt de aanvraag tot toewijzing van zendtijd voor lokale omroep binnen vier weken
      na de datum van ontvangst voor aan de gemeenteraad en zendt een afschrift van de aanvraag aan Onze Minister van
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel20
  - number: '20.2'
    text: |-
      De gemeenteraad brengt binnen achttien weken na ontvangst van het verzoek, bedoeld in het eerste lid, advies uit
      aan het Commissariaat.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel20
  - number: '20.3'
    text: Het Commissariaat beslist binnen vier weken na ontvangst van het advies van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel20
  - number: '20.4'
    text: |-
      Bij toewijzing van zendtijd kan het Commissariaat tevens voor het eerste kalenderjaar of het nog resterende deel
      daarvan, de hoeveelheid zendtijd vaststellen en de dagen en uren en zonodig de omroepzender of omroepzenders
      aanwijzen waarop het programma wordt uitgezonden. De zendtijd gaat zo spoedig mogelijk in. De eerste volzin is niet
      van toepassing bij toewijzing van zendtijd voor een programma voor lokale omroep dat wordt uitgezonden door middel
      van een omroepnetwerk.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel20
  - number: '21.1'
    text: |-
      Indien de regionale of lokale omroepinstelling waaraan voor een bepaalde periode zendtijd is toegewezen in
      aanmerking wil komen voor toewijzing van zendtijd in een aansluitende periode, dient zij de in [artikel 18][ref1]
      bedoelde aanvraag bij het Commissariaat voor de Media in ten minste zes maanden vóór afloop van de periode waarvoor
      haar zendtijd is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel18
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
  - number: '21.2'
    text: |-
      In bijzondere gevallen kan van het bepaalde in de [artikelen 19][ref1] en [20][ref2] worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel20
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '20'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
  - number: '22.1'
    text: |-
      De regionale omroepinstelling waaraan zendtijd is toegewezen, dient jaarlijks vóór 1 november bij het Commissariaat
      voor de Media een voorstel in met betrekking tot de vaststelling van de hoeveelheid zendtijd en de aanwijzing van
      de dagen en uren voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel22
  - number: '22.2'
    text: |-
      Het Commissariaat stelt jaarlijks vóór 30 november de hoeveelheid zendtijd voor het daaropvolgende jaar vast en
      wijst daarbij tevens aan de dagen en uren en zonodig de omroepzender of omroepzenders waarop het programma wordt
      uitgezonden. De zendtijd gaat in op 1 januari van dat daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel22
  - number: '22.3'
    text: |-
      Indien het Commissariaat gebruik maakt van de bevoegdheid, neergelegd in [artikel 20, vierde lid][ref1], zijn
      [het eerste en tweede lid van dit artikel][ref2] van overeenkomstige toepassing ten aanzien van lokale omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel22
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '20'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '22'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '2'
  - number: '23.1'
    text: |-
      Indien het Commissariaat voor de Media constateert dat de regionale of lokale omroepinstelling niet meer voldoet
      aan de in [artikel 30, onderdeel b en c, van de Mediawet][ref1] gestelde vereisten, stelt het de omroepinstelling,
      provinciale staten of de gemeenteraad gehoord, daarvan op de hoogte onder verwijzing naar het gestelde in
      [artikel 45, eerste en derde lid, van de Mediawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel45
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '45'
  - number: '23.2'
    text: |-
      Binnen vier weken na afloop van het jaar na de mededeling, bedoeld in het eerste lid, doet het Commissariaat
      mededeling aan de regionale of lokale omroepinstelling van zijn beslissing omtrent de zendtijd van die
      omroepinstelling.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel23
  - number: '24.1'
    text: |-
      Een beschikking tot intrekking van de zendtijd die is toegewezen aan een regionale of lokale omroepinstelling,
      genomen op grond van [artikel 45 van de Mediawet][ref1], gaat onmiddellijk in.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel45
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '45'
  - number: '24.2'
    text: |-
      Indien de intrekking van de in het eerste lid bedoelde zendtijd plaatsvindt op grond van [artikel 46][ref1], gaat
      de beschikking daartoe in, twee weken na de datum van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel46a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 46a
  - number: '25.1'
    text: |-
      Het programma van een regionale, onderscheidenlijk lokale, omroepinstelling bestaat voor ten minste vijftig procent
      uit onderdelen die door haarzelf of uitsluitend in haar opdracht zijn geproduceerd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25
  - number: '25.2'
    text: |-
      Indien [artikel 51f, vierde lid, van de Mediawet][ref1] op een lokale omroepinstelling van toepassing
      is, heeft ten minste de helft van de zendtijd, gebruikt voor programma-onderdelen als bedoeld in
      [artikel 51f, vierde lid, onderdeel a, van de Mediawet][ref2], in het bijzonder betrekking op de gemeente waarvoor
      het programma bestemd is, en is ten minste de helft van de zendtijd, gebruikt voor programma-onderdelen als
      bedoeld in [artikel 51f, vierde lid, onderdeel b, van de Mediawet][ref3], door de lokale omroepinstelling zelf of
      uitsluitend in haar opdracht geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel51f
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 51f
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 51f
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 51f
  - number: 25a.1
    text: |-
      Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43][ref1] verzorgen, zijn
      verplicht een behoorlijke boekhouding te voeren en hun jaarrekening vergezeld te laten gaan van een verklaring van
      een accountant-administratieconsulent of een registeraccountant omtrent de getrouwheid ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
  - number: 25a.2
    text: |-
      Deze boekhouding bevat ten minste gegevens over de kosten en opbrengsten, verdeeld naar de kosten en opbrengsten
      van de exploitatie van reclameboodschappen en telewinkelboodschappen, de kosten en opbrengsten van andere
      programma-onderdelen, onderscheidenlijk de kosten en opbrengsten van alle andere activiteiten.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25a
  - number: 25a.3
    text: |-
      Lokale en regionale omroepinstellingen die programma-onderdelen als bedoeld in [artikel 43][ref1] verzorgen zenden
      jaarlijks vóór 1 juni de jaarrekening aan het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 43a
  - number: 25b
    text: |-
      Een aanvraag voor toestemming om een programma te verzorgen als bedoeld in [artikel 67 van de Mediawet][ref1],
      wordt door de desbetreffende regionale omroepinstelling die zendtijd heeft verkregen, ingediend bij het
      Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel67
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '67'
  - number: 25c
    text: |-
      Een programma voor regionale omroep als bedoeld in[artikel 67 van de Mediawet][ref1] wordt, voorzover het
      een televisieprogramma betreft, niet uitgezonden tussen 19.00 uur en 23.00 uur, tenzij de Stichting en de
      desbetreffende regionale omroepinstelling anders zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel67
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '67'
  - number: 25d.1
    text: |-
      Een aanvraag voor toestemming om een programma te verzorgen als bedoeld in [artikel 68 van de Mediawet][ref1],
      wordt door de desbetreffende lokale omroepinstelling die zendtijd heeft verkregen, ingediend bij het Commissariaat
      voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '68'
  - number: 25d.2
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
  - number: 25d.2.a
    text: |-
      een aanduiding of de aanvraag betrekking heeft op het verzorgen van een radio- of van een televisieprogramma, of
      van beide;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
  - number: 25d.2.b
    text: |-
      een exemplaar van de notarieel vastgelegde statuten van de instelling die het programma produceert, of, indien het
      niet een rechtspersoon betreft, een aanduiding van de instelling die het programma produceert; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
  - number: 25d.2.c
    text: |-
      het advies van de Raad voor cultuur, bedoeld in [artikel 68, tweede lid, onderdeel d, van de Mediawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '68'
  - number: 25d.3
    text: |-
      Indien een lokale omroepinstelling die de in het eerste lid bedoelde toestemming heeft verkregen, in aanmerking
      wil komen voor toestemming in een aansluitende periode, dient zij daartoe ten minste vijf maanden vóór de afloop
      van de periode waarvoor haar toestemming is verleend, een aanvraag in. Het eerste en het tweede lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel25d
  - number: 26a
    text: Deze afdeling is niet van toepassing op reclameboodschappen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel26a
  - number: '27'
    text: |-
      Niet vermijdbaar zijn reclame-uitingen die behoren tot het normale straatbeeld en die zonder opzet en zonder nadruk
      gedurende enkele seconden in een programma-onderdeel voorkomen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel27
  - number: '28.1'
    text: |-
      In programma-onderdelen van informatieve en educatieve aard zijn vermijdbare reclame-uitingen in de vorm van het
      tonen of vermelden van een product of dienst toegestaan, mits:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: 28.1.a
    text: de vertoning of vermelding past binnen de context van het programma;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: 28.1.b
    text: de vertoning of vermelding geen afbreuk doet aan de programma-formule of de integriteit van het programma;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: 28.1.c
    text: de vertoning of vermelding niet op een overdreven of overdadige wijze plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: 28.1.d
    text: er geen sprake is van specifieke aanprijzingen van deze producten of diensten.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op andere programma-onderdelen, met uitzondering van programma-
      onderdelen die in het bijzonder bestemd zijn voor minderjarigen beneden de leeftijd van twaalf jaar.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel28
  - number: '29.1'
    text: |-
      Onverminderd [artikel 28][ref1] mogen programma-onderdelen van informatieve of educatieve aard
      vermijdbare reclame-uitingen in de vorm van het tonen of vermelden van namen of (beeld)merken van bepaalde
      producten of diensten of van namen van bedrijven of instellingen bevatten. Op deze reclame-uitingen is
      [artikel 28, eerste lid, onderdelen ][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel28
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '28'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '28'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: '29.2'
    text: |-
      In afwijking van [artikel 28, eerste lid, onderdeel ][ref1], mogen programma-onderdelen van informatieve of
      educatieve aard vermijdbare reclame-uitingen bevatten, bestaande uit het aankondigen en recenseren van boeken,
      video's, compact discs en soortgelijke culturele uitingen, alsmede van toneel,- muziek- en filmuitvoeringen,
      tentoonstellingen en soortgelijke evenementen van kunstzinnige aard.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel28
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '28'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: '30'
    text: |-
      In radio- of televisieprogramma-onderdelen zijn vermijdbare reclame-uitingen in de vorm van het tonen of vermelden
      van de naam van een bedrijf of instelling toegestaan, mits:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30
  - number: 30.a
    text: de naam uitsluitend betrekking heeft op de benaming van een sportvereniging of sportwedstrijd;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30
  - number: 30.b
    text: de naam niet met nadruk wordt getoond of vermeld; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30
  - number: 30.c
    text: |-
      de naamgeving, voor zover het de benaming van een Nederlandse sportvereniging betreft, is erkend door de
      desbetreffende bij de NOC*NSF aangesloten sportorganisatie.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30
  - number: 30a.1
    text: |-
      Een televisieprogramma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat in Nederland
      plaatsvindt of is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen, mag
      vermijdbare reclame-uitingen bevatten, indien het evenement niet voornamelijk bestemd is om als programma te worden
      uitgezonden, en de reclame-uitingen niet overheersend zijn.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30a
  - number: 30a.2
    text: |-
      Een televisieprogramma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat in het buitenland
      plaatsvindt en niet is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen, mag
      vermijdbare reclame-uitingen bevatten, indien het evenement niet voornamelijk bestemd is om als programma te worden
      uitgezonden, en de reclame-uitingen niet langer of met meer nadruk in het programma-onderdeel voorkomen dan nodig
      is in het kader van een evenwichtige registratie en presentatie.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel30a
  - number: '31.1'
    text: |-
      Een programma-onderdeel, bestaande uit het verslag of de weergave van een evenement dat niet voornamelijk bestemd
      is om als programma te worden uitgezonden, mag gedurende ten hoogste vijf seconden, aan het begin of aan het einde
      van het programma-onderdeel, vermijdbare reclame-uitingen bevatten, bestaande uit de namen of (beeld)merken van
      die personen, bedrijven of instellingen, die een belangrijke, schriftelijk overeengekomen bijdrage hebben geleverd
      aan de totstandkoming van het evenement. De vermelding of vertoning is zodanig vormgegeven dat zij niet voldoet
      aan de definitie van reclameboodschap, bedoeld in [artikel 1, onderdeel kk, van de Mediawet][ref1]. Indien het
      een programma-onderdeel voor televisie betreft, bestaande uit het verslag of de weergave van een evenement dat
      is geproduceerd door of in opdracht van een instelling die zendtijd heeft verkregen en dat niet voornamelijk is
      bestemd om als programma te worden uitgezonden, geschiedt de vertoning of vermelding uitsluitend via stilstaande
      beelden.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: '31.2'
    text: 'Het eerste lid is niet van toepassing ten aanzien van personen, bedrijven of instellingen:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel31
  - number: 31.2.a
    text: die zich voornamelijk bezighouden met de productie of verkoop van sigaretten of andere tabaksproducten, of
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel31
  - number: 31.2.b
    text: |-
      die gebruik maken van namen of (beeld)merken die tevens worden gebruikt door personen, bedrijven of instellingen
      als bedoeld [onder ][ref1], of daarmee een zo sterke gelijkenis vertonen dat het publiek redelijkerwijs de
      indruk krijgt dat het mede de naam of het (beeld)merk van een persoon, bedrijf of instelling als bedoeld in
      [onderdeel ][ref2] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel31
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '31'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: '31'
        hoofdstuk: '1'
        paragraaf: '3'
        afdeling: '3'
  - number: '32.1'
    text: |-
      Een programma-onderdeel voor televisie, bestaande uit een film die voor een zaal publiek is of wordt vertoond,
      dan wel een televisiebewerking daarvan, mag vermijdbare reclame-uitingen bevatten die bestaan uit het vermelden of
      tonen van namen, (beeld)merken, producten of diensten van personen, bedrijven of instellingen, indien die reclame-
      uitingen in het programma-onderdeel voorkomen in dezelfde vorm en in ten hoogste dezelfde hoeveelheid als in de
      voor een zaal publiek bestemde versie van de film.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32
  - number: '32.2'
    text: |-
      Een uit het buitenland aangekocht programma-onderdeel dat ten behoeve van het buitenlandse publiek als programma
      is uitgezonden, mag vermijdbare reclame-uitingen bevatten die bestaan uit het vermelden of tonen van namen,
      (beeld)merken, producten of diensten van personen, bedrijven of instellingen, indien die reclame-uitingen in het
      programma-onderdeel voorkomen in dezelfde vorm en in ten hoogste dezelfde hoeveelheid als in de ten behoeve van het
      buitenlandse publiek uitgezonden versie van het programma-onderdeel.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32
  - number: 32a.1
    text: 'Bij ministeriële regeling kunnen nadere regels en modellen worden vastgesteld voor de inhoud en inrichting van:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32a
  - number: 32a.1.a
    text: |-
      de begroting voor de instellingen die zendtijd hebben verkregen voor landelijke omroep, bedoeld in
      [artikel 99 van de Mediawet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
  - number: 32a.1.b
    text: |-
      de begroting van de Wereldomroep, bedoeld in [artikel 108 van de Mediawet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '108'
  - number: 32a.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels en modellen worden vastgesteld voor de inrichting van de
      jaarrekening, bedoeld in [artikel 109 van de Mediawet][ref1], van onderscheidenlijk de omroepverenigingen, de
      Programmastichting, de Stichting, de educatieve omroepinstelling, de Stichting Etherreclame, de kerkgenootschappen
      en genootschappen op geestelijke grondslag die zendtijd hebben verkregen en de Wereldomroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel109
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '109'
  - number: 32b.1
    text: |-
      Het verstrekken van voorschotten aan instellingen die zendtijd hebben verkregen voor landelijke omroep en de
      Wereldomroep vindt plaats in de vorm van twaalf maandelijkse termijnen. In bijzondere gevallen kan de raad van
      bestuur, onderscheidenlijk het Commissariaat voor de Media, hiervan afwijken.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32b
  - number: 32b.2
    text: |-
      De hoogte van de voorschotten wordt bepaald door de raad van bestuur, onderscheidenlijk het Commissariaat.
      Dit geschiedt mede op basis van de begroting, bedoeld in [artikel 99][ref1], onderscheidenlijk
      [artikel 108, van de Mediawet][ref2], en een liquiditeitsprognose van de desbetreffende instelling welke aan de
      raad van bestuur, onderscheidenlijk het Commissariaat, ter kennisneming wordt gezonden voor 1 november van het
      jaar, voorafgaande aan het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel108
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32b
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '108'
  - number: 32b.3
    text: |-
      Zolang de liquiditeitsprognose over het desbetreffende jaar nog niet in bezit is van de raad van bestuur,
      onderscheidenlijk het Commissariaat, vindt het verstrekken van voorschotten plaats op basis van de laatstelijk
      toegezonden liquiditeitsprognose.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32b
  - number: 32b.4
    text: Het totaal aan voorschotten in enig jaar kan de voor dat jaar vastgestelde totale vergoeding niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32b
  - number: 32c
    text: |-
      In deze afdeling wordt verstaan onder neventaken: activiteiten als bedoeld in
      [artikel 13c, derde lid, van de Mediawet][ref1], die bestaan uit het anders dan als programma waarvoor zendtijd is
      verkregen, verzorgen van elektronische producten met beeld, geluid of tekst, en het al dan niet tegen betaling, al
      dan niet gecodeerd of al dan niet op individueel verzoek analoog of digitaal verspreiden daarvan via elektronische
      communicatienetwerken als bedoeld in [artikel 1.1, onderdeel e, van de Telecommunicatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel13c
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 13c
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '1'
  - number: 32d.1
    text: |-
      De in [artikel 99, tweede lid, onderdeel b, van de Mediawet][ref1] bedoelde beschrijving bevat in elk geval een
      opgave van aard, aantal en voorziene duur van de voorgenomen neventaken en een onderbouwing op welke wijze die
      neventaken mede invulling geven aan de taak van de publieke omroep op landelijk niveau en daarmee voldoen aan de
      democratische, sociale en culturele behoeften van de samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
  - number: 32d.2
    text: |-
      De in [artikel 99, derde lid, onderdeel b, van de Mediawet][ref1] bedoelde opgave geeft tevens aan op welke wijze
      de benodigde bedragen worden gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel99
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32d
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '99'
  - number: 32d.3
    text: |-
      Instellingen die zendtijd hebben verkregen voor landelijke omroep verrichten uitsluitend neventaken indien deze
      door Onze Minister zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32d
  - number: 32e.1
    text: |-
      Instellingen die zendtijd hebben verkregen voor regionale of lokale omroep die een neventaak willen verrichten,
      melden het voornemen daartoe bij het Commissariaat voor de Media op de door deze voorgeschreven wijze.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32e
  - number: 32e.2
    text: |-
      De melding bevat in elk geval een onderbouwing op welke wijze de voorgenomen neventaak mede invulling geeft aan
      de taak van de publieke omroep op regionaal respectievelijk lokaal niveau en daarmee voorziet in democratische,
      sociale en culturele behoeften, alsmede een opgave van de benodigde financiële middelen en de wijze van
      financiering daarvan.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32e
  - number: 32e.3
    text: |-
      Instellingen die zendtijd hebben verkregen voor regionale of lokale omroep verrichten uitsluitend neventaken indien
      deze door het Commissariaat zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32e
  - number: 32f
    text: |-
      Goedkeuring op grond van de [artikelen 32d, derde lid][ref1], en [32e, derde lid][ref2], laat onverlet het bepaalde
      bij of krachtens de [Telecommunicatiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel32d
      [ref2]: https://wetten.overheid.nl/BWBR0004237#Artikel32e
      [ref3]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32f
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: 32d
        hoofdstuk: '1'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004237
        artikel: 32e
        hoofdstuk: '1'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0009950
  - number: 32g.1
    text: |-
      Op neventaken is het bepaalde bij of krachtens de [artikelen 26, eerste lid][ref1], [27 tot en met 28a][ref2],
      [41a][ref3], [43a tot en met 43c][ref4], [48][ref5], [50, achtste lid][ref6], [52 tot en met 53a][ref7] en
      [64c van de Mediawet][ref8] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel41a
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel43a
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel50
      [ref7]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref8]: https://wetten.overheid.nl/BWBR0004149#Artikel64c
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: 41a
      - id: ref4
        bwb_id: BWBR0004149
        artikel: 43a
      - id: ref5
        bwb_id: BWBR0004149
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0004149
        artikel: '50'
      - id: ref7
        bwb_id: BWBR0004149
        artikel: '52'
      - id: ref8
        bwb_id: BWBR0004149
        artikel: 64c
  - number: 32g.2
    text: |-
      Op neventaken die bestaan uit het uitzenden van televisieprogramma’s is het bepaalde bij of krachtens
      [artikel 54a van de Mediawet][ref1] van overeenkomstige toepassing op elk van die televisieprogramma’s.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32g
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 54a
  - number: 32g.3
    text: |-
      Het Commissariaat voor de Media kan in bijzondere gevallen geheel of gedeeltelijk ontheffing verlenen van het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32g
  - number: 32h.1
    text: |-
      Op neventaken van instellingen die zendtijd hebben verkregen voor landelijke omroep
      die bestaan uit het uitzenden van televisieprogramma’s is het bepaalde bij of krachtens
      [artikel 54, eerste tot en met vijfde, zevende en achtste lid, van de Mediawet][ref1] van overeenkomstige
      toepassing op elk van die televisieprogramma’s, met dien verstande dat in afwijking van het
      [tweede lid, eerste en tweede volzin, van genoemd artikel][ref2] een percentage van tien geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '54'
  - number: 32h.2
    text: |-
      Op neventaken van instellingen die zendtijd hebben verkregen voor regionale omroep die bestaan uit het uitzenden
      van televisieprogramma’s is het bepaalde bij of krachtens [artikel 54, zesde en achtste lid, van de Mediawet][ref1]
      van overeenkomstige toepassing op elk van die televisieprogramma’s.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '54'
  - number: 32h.3
    text: |-
      Het Commissariaat voor de Media kan in bijzondere gevallen tijdelijk gedeeltelijk ontheffing verlenen van het eerste
      en tweede lid voor zover het betreft [artikel 54, eerste lid en zesde lid, eerste volzin, van de Mediawet][ref1],
      met dien verstande dat het percentage niet lager gesteld kan worden dan tien.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel32h
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '54'
  - number: '33.1'
    text: |-
      Een aanvraag voor toestemming om een programma als bedoeld in [artikel 71][ref1], te verzorgen wordt ingediend bij
      het Commissariaat voor de Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 71a
  - number: '33.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
  - number: 33.2.a
    text: een exemplaar van de statuten;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
  - number: 33.2.b
    text: een opgave van de feitelijke vestigingsplaats, indien deze afwijkt van de statutaire vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
  - number: 33.2.c
    text: |-
      een aanduiding of de aanvraag betrekking heeft op toestemming voor het verzorgen van een radio- of van een
      televisieprogramma, of van beide;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
  - number: 33.2.d
    text: |-
      een omschrijving van de organisatorische en juridische structuur van de aanvrager, alsmede een overzicht van zijn
      bestuurders en aandeelhouders.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel33
  - number: '34'
    text: |-
      Indien een commerciële omroepinstelling, in aanmerking wil komen voor toestemming in een aansluitende periode,
      dient zij een aanvraag bij het Commissariaat voor de Media in ten minste vijf maanden vóór de afloop van de periode
      waarvoor haar toestemming is verleend. Artikel 33 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel34
  - number: '35'
    text: |-
      In dit hoofdstuk wordt verstaan onder: lijst: de evenementenlijst die is opgenomen in de bij dit besluit behorende
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004237
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004237
  - number: '36.1'
    text: |-
      De evenementen, genoemd in onderdeel A van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van volledige rechtstreekse
      verslaggeving.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel36
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen, die geheel of gedeeltelijk
      plaatsvinden tussen 00.00 uur en 07.00 uur, niet door middel van volledige rechtstreekse verslaggeving te worden
      uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel36
  - number: '36.3'
    text: |-
      In afwijking van het eerste lid behoeven wedstrijden die deel uitmaken van de in dat lid bedoelde evenementen
      en die gelijktijdig plaatsvinden niet allemaal door middel van volledige rechtstreekse verslaggeving te worden
      uitgezonden, indien:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel36
  - number: 36.3.a
    text: |-
      ten minste een van deze wedstrijden wordt uitgezonden door middel van volledige rechtstreekse verslaggeving op een
      open net, én
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel36
  - number: 36.3.b
    text: |-
      de andere hiervoor bedoelde wedstrijd of wedstrijden op dezelfde dag worden uitgezonden door middel van volledige
      of gedeeltelijke uitgestelde verslaggeving op een open net.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel36
  - number: '37.1'
    text: |-
      De evenementen, genoemd in onderdeel B van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van gedeeltelijke rechtstreekse
      verslaggeving.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel37
  - number: '37.2'
    text: |-
      De uitzendingen van de evenementen, bedoeld in het eerste lid, hebben de in onderdeel B van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel37
  - number: '38.1'
    text: |-
      De evenementen, genoemd in onderdeel C van de lijst, die als onderdeel van een televisieprogramma worden
      uitgezonden, worden in ieder geval uitgezonden op een open net door middel van gedeeltelijke uitgestelde
      verslaggeving.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel38
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid behoeven de in dat lid bedoelde evenementen niet door middel van gedeeltelijke
      uitgestelde verslaggeving te worden uitgezonden, indien deze evenementen worden uitgezonden op een open net door
      middel van volledige rechtstreekse verslaggeving.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel38
  - number: '38.3'
    text: |-
      De uitzendingen van de evenementen, bedoeld in het eerste lid, hebben de in onderdeel C van de lijst vermelde
      minimumduur.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel38
  - number: '38.4'
    text: |-
      De uitzendingen van de evenementen, bedoeld in het eerste lid, vinden plaats op de dag van het evenement of
      een onderdeel daarvan, met dien verstande dat de uitzendingen van de wedstrijden van de hoogste divisie van het
      nationaal betaald voetbal uiterlijk aanvangen op de in onderdeel C van de lijst vermelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel38
  - number: 53c.1
    text: |-
      Voor de toepassing van [artikel 82f van de Mediawet][ref1] worden twee of meer instellingen als één instelling
      aangemerkt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: 53c.1.a
    text: |-
      een instelling direct of indirect zodanige zeggenschap of feitelijke invloed heeft in een of meer andere
      instellingen, dat deze in belangrijke mate het beleid van die instelling of instellingen kan bepalen, dan wel
      aanmerkelijke invloed heeft op de inhoud van dat beleid; of
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel53c
  - number: 53c.1.b
    text: |-
      een natuurlijk persoon of groep van natuurlijke personen direct of indirect zodanige zeggenschap of feitelijke
      invloed heeft in twee of meer instellingen, dat deze in belangrijke mate het beleid van die instellingen kan
      bepalen, dan wel aanmerkelijke invloed heeft op de inhoud van dat beleid.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel53c
  - number: 53c.2
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat, kan worden bepaald
      dat in afwijking van [artikel 82f, eerste lid, van de Mediawet][ref1] voor de uitzending van de radioprogramma's
      van eenzelfde instelling meer frequentieruimte mag worden gebruikt dan één FM-frequentie of samenstel van FM-
      frequenties.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel82f
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: 82f
  - number: '54'
    text: |-
      Naast het in [artikel 130, vierde lid, van de Mediawet][ref1] bedoelde geval, kan het Bedrijfsfonds voor de Pers
      financiële steun verlenen in de vorm van een uitkering, ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
  - number: 54.a
    text: compensatie aan dagbladen wegens ongelijkheid van voorwaarden op de advertentiemarkt van dagbladen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel54
  - number: 54.b
    text: gezamenlijke projecten van persorganen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel54
  - number: 54.c
    text: organisatie-onderzoek, gericht op structurele verbetering van de exploitatie van een persorgaan;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel54
  - number: 54.d
    text: |-
      onderzoek ten behoeve van de bedrijfstak als geheel, voorzover het onderzoek past in de doelstellingen van het
      Bedrijfsfonds.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel54
  - number: '55.1'
    text: |-
      De in [artikel 54, onderdeel ][ref1], bedoelde compensatie-uitkering aan dagbladen heeft uitsluitend betrekking op
      de boekjaren 1986 en 1989 en kan worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 55.1.a
    text: |-
      de exploitatie van het dagblad in het jaar waarover steun wordt verleend verlieslijdend is geweest, berekend
      volgens door het Bedrijfsfonds voor de Pers gegeven richtlijnen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.1.b
    text: |-
      het dagblad in het jaar waarover steun wordt verleend een gemiddelde betaalde oplage van ten hoogste 232.000
      exemplaren en een verspreidingsdichtheid van ten hoogste 0,48 heeft gehad en tevens een zodanige gemiddelde
      betaalde oplage (O i) en verspreidingsdichtheid (Di), dat na invulling van de waarden hiervan de uitkomst van de
      formule: 1 - Oi/232.000 - Di/0,48 groter is dan 0;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.1.c
    text: |-
      de personele kosten van de eigen redactie van het dagblad in het jaar waarover steun wordt verleend ten minste 30
      procent van de totale personele redactiekosten van het desbetreffende dagblad hebben bedragen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.1.d
    text: |-
      een project is ingediend dat is gericht op een structurele verbetering van de exploitatie van het dagblad binnen
      een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.1.e
    text: het Bedrijfsfonds met het project heeft ingestemd; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.1.f
    text: het project binnen een redelijke termijn wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: '55.2'
    text: 'Voor de toepassing van het eerste lid, onderdeel *b*, wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.2.a
    text: |-
      verspreidingsdichtheid: het percentage van de totale oplage van een dagblad verkocht op de thuismarkt van het blad,
      vermenigvuldigd met het dekkingspercentage op de thuismarkt;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.2.b
    text: |-
      thuismarkt: het nodale gebied waarin het dagblad zijn hoogste betaalde oplage heeft plus de daaraan grenzende
      nodale gebieden waarin het dekkingspercentage niet lager is dan 85 procent van het dekkingspercentage in het nodale
      gebied waarin het dagblad zijn hoogste betaalde oplage heeft, alsmede de aan vorengenoemde gebieden grenzende
      nodale gebieden waarin het dekkingspercentage niet lager is dan 85 procent van het dekkingspercentage in het nodale
      gebied waarin het dagblad zijn hoogste betaalde oplage heeft;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.2.c
    text: |-
      nodale gebieden: de gebieden aangegeven op de kaart van Nederland die is opgenomen in de bij dit besluit behorende
      bijlage I;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: 55.2.d
    text: |-
      dekkingspercentage op de thuismarkt: de betaalde oplage op de thuismarkt gedeeld door het aantal particuliere PTT-
      afgiftepunten in het betrokken gebied.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: '55.3'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *c*, wordt verstaan onder de eigen redactie van het dagblad:
      redactionele medewerkers in vaste dienst van het desbetreffende dagblad en freelance-redactionele medewerkers,
      voorzover en naar de mate waarin deze periodiek redactionele bijdragen aan het desbetreffende dagblad leveren.
      De centrale redactie van een dagblad, die tevens redactionele bijdragen aan andere bladen levert, wordt voor dit
      dagblad tot de eigen redactie gerekend.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: '55.4'
    text: |-
      De financiële steun bedoeld in het eerste lid is ten hoogste gelijk aan 75 procent van het geleden verlies in het
      jaar waarop de steunverlening betrekking heeft, berekend volgens door het Bedrijfsfonds gegeven richtlijnen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel55
  - number: '56'
    text: |-
      De in [artikel 54, onderdeel ][ref1], bedoelde steun kan worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 56.a
    text: |-
      een project door de gezamenlijke persorganen is ingediend, dat gericht is op structurele verbetering van de
      exploitatiepositie van die persorganen binnen een redelijke termijn;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel56
  - number: 56.b
    text: dit project past in de doelstelling van het Bedrijfsfonds voor de Pers;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel56
  - number: 56.c
    text: het Bedrijfsfonds met het project heeft ingestemd; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel56
  - number: 56.d
    text: het project binnen een redelijke termijn wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel56
  - number: '57.1'
    text: |-
      De in [artikel 54, onderdeel ][ref1], bedoelde steun kan worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 57.1.a
    text: |-
      de exploitatie van het bedoelde persorgaan over het boekjaar, voorafgaand aan de aanvraag, in een verlieslijdende
      positie heeft verkeerd of daarin terecht dreigde te komen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel57
  - number: 57.1.b
    text: de aanvraag een voorstel bevat, inhoudende de opzet en uitvoering van het beoogde onderzoek;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel57
  - number: 57.1.c
    text: |-
      de aanvraag voor de verlening van deze financiële steun uitsluitend gericht is op het verkrijgen van steun voor ten
      hoogste tweederde deel van de kosten van het beoogde organisatie-onderzoek.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel57
  - number: '57.2'
    text: |-
      De bepalingen van [artikel 56, onderdeel ][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel56
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '56'
        hoofdstuk: '5'
  - number: '58.1'
    text: |-
      De in [artikel 54, onderdeel ][ref1], bedoelde steun kan worden verleend indien de aanvraag voor deze financiële
      steun betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 58.1.a
    text: de persbedrijfstak als geheel;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel58
  - number: 58.1.b
    text: een vraagstuk, dat verband houdt met de doelstelling van het Bedrijfsfonds voor de Pers.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel58
  - number: '58.2'
    text: |-
      De bepalingen van [artikel 56, onderdeel ][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel56
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '56'
        hoofdstuk: '5'
  - number: '59.1'
    text: |-
      De aanvragen voor financiële steun als bedoeld in de [artikelen 130][ref1] en [131 van de Mediawet][ref2] worden
      bij het Bedrijfsfonds voor de Pers ingediend door de rechtspersoon die de uitgaverechten bezit van het persorgaan
      waarop de aanvraag betrekking heeft, dan wel door de betreffende groep of bedrijfstak van persorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel131
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: '131'
  - number: '59.2'
    text: |-
      Indien de aanvraag betrekking heeft op de financiële steun, bedoeld in [artikel 54, onderdeel ][ref1], wordt zij
      ingediend gedurende een door het Bedrijfsfonds vast te stellen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '60.1'
    text: |-
      De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel ][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 60.1.a
    text: |-
      naam en adres van de rechtspersoon die de aanvraag indient en die de uitgaverechten bezit van het desbetreffende
      dagblad;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.b
    text: een omschrijving van de juridische structuur van de bij de aanvraag betrokken onderneming(en);
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.c
    text: |-
      indien het persorgaan deel uitmaakt van een concern, een omschrijving van de structuur van het concern en van de
      juridische en economische verhoudingen tussen de aanvrager en de andere vennootschappen van het concern;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.d
    text: |-
      recente gegevens over de financiële positie van het persorgaan, alsmede de jaarverslagen, de jaarrekeningen en de
      accountantsrapporten betreffende de meest recente drie jaren;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.e
    text: |-
      gegevens over de oplage-ontwikkeling, de abonnementsinkomsten en de advertentie-inkomsten van het persorgaan waarop
      de aanvraag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.f
    text: |-
      indien het persorgaan zich in concernverband bevindt, gegevens over de kosten en opbrengsten van het concern
      verdeeld naar de kosten en opbrengsten van de afzonderlijke bladen en andere concernactiviteiten;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.g
    text: het redactiestatuut van het persorgaan;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.h
    text: |-
      gegevens over het project bedoeld in [artikel 55, eerste lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel55
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '55'
        hoofdstuk: '5'
  - number: 60.1.i
    text: een overzicht van de eventuele gevolgen met betrekking tot het personeel, die uit het project voortvloeien;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.1.j
    text: |-
      de schriftelijk vastgelegde visie van de betrokken redactie(s) en ondernemingsraad of -raden met betrekking tot het
      in [artikel 55, eerste lid, onderdeel ][ref1], bedoelde project;


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel55
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '55'
        hoofdstuk: '5'
  - number: 60.1.k
    text: |-
      gegevens over de gemiddelde betaalde oplage en de verspreidingsdichtheid, bedoeld in
      [artikel 55, eerste lid, onderdeel ][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel55
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '55'
        hoofdstuk: '5'
  - number: 60.1.l
    text: |-
      gegevens waaruit blijken de personele kosten, bedoeld in [artikel 55, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel55
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '55'
        hoofdstuk: '5'
  - number: '60.2'
    text: |-
      De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel ][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 60.2.a
    text: |-
      naam en adres van de rechtspersonen die de aanvraag indienen en die de uitgaverechten bezitten van de
      desbetreffende persorganen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.2.b
    text: |-
      een omschrijving van de juridische structuur van de bij de aanvraag betrokken persorganen; ingeval de uitgever van
      een persorgaan deel uitmaakt van een concern, tevens een omschrijving van de structuur van het concern, alsmede
      een omschrijving van de juridische en economische verhoudingen tussen de aanvrager en de andere vennootschappen van
      het concern;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.2.c
    text: |-
      gegevens over het gezamenlijke project: een beschrijving ervan en van de verwachte effecten daarvan op de
      ontwikkelingen van de kosten, de opbrengsten en de liquiditeit; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.2.d
    text: een opgave van de gevraagde financiële steun ter uitvoering van het bedoelde project.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: '60.3'
    text: |-
      De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel ][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 60.3.a
    text: |-
      naam en adres van de rechtspersoon die de aanvraag indient en die de uitgaverechten bezit van het desbetreffende
      persorgaan;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.3.b
    text: gegevens over de financiële positie van het persorgaan;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.3.c
    text: gegevens over oplage en verspreiding; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.3.d
    text: gegevens over opzet en uitvoering van het beoogde onderzoek.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: '60.4'
    text: |-
      De aanvraag voor de financiële steun, bedoeld in [artikel 54, onderdeel ][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: 60.4.a
    text: naam en adres van de indiener(s) van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.4.b
    text: |-
      een omschrijving van de juridische structuur van de bij de aanvraag betrokken persorganen, alsmede een omschrijving
      van de juridische en economische verhoudingen; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: 60.4.c
    text: een omschrijving van het beoogde onderzoek, waarvoor de steun gevraagd wordt.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel60
  - number: '61.1'
    text: Het Bedrijfsfonds voor de Pers bevestigt de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel61
  - number: '61.2'
    text: |-
      Indien bij de aanvraag een van de gegevens bedoeld in [artikel 60][ref1] ontbreekt, dient uit de aanvraag te
      blijken waarom de gegevens niet volledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel60
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '60'
        hoofdstuk: '5'
  - number: '62'
    text: |-
      Het Bedrijfsfonds voor de Pers kan indien het zulks wenselijk acht de aanvraag voorleggen aan een externe
      adviesinstantie. Daarbij wordt gezorgd dat vertrouwelijke bedrijfsgegevens als zodanig behandeld worden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel62
  - number: '63.1'
    text: Het Bedrijfsfonds voor de Pers beslist binnen dertien weken na het in behandeling nemen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel63
  - number: '63.2'
    text: |-
      Aanvragen voor financiële steun als bedoeld in [artikel 54, onderdeel ][ref1], worden gezamenlijk behandeld en
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '63.3'
    text: |-
      Aanvragen voor financiële steun als bedoeld in [artikel 54, onderdeel ][ref1], worden in volgorde van ontvangst
      behandeld en beslist. Indien het in een jaar ter beschikking staande bedrag voor steunverlening volledig is
      toegewezen, worden volgende aanvragen afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '64'
    text: |-
      Het Bedrijfsfonds voor de Pers kan aan de beschikking tot financiële steunverlening aan de aanvrager voorschriften
      verbinden. Deze hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel64
  - number: 64.a
    text: de besteding van de steun overeenkomstig de daaraan ten grondslag liggende doelstellingen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel64
  - number: 64.b
    text: de wijze waarop en de termijn waarbinnen het project respectievelijk het onderzoek wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel64
  - number: 64.c
    text: de verslaglegging van de activiteiten en de financiële verantwoording daarvan; en
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel64
  - number: 64.d
    text: de eventuele wijzigingen in de financiële structuur van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel64
  - number: '65'
    text: |-
      Van een beschikking tot toekenning of weigering alsmede van de hoogte van de financiële steun, wordt binnen een
      week nadat de beschikking is genomen, mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel65
  - number: '66.1'
    text: |-
      Indien het Bedrijfsfonds voor de Pers heeft besloten tot het verlenen van financiële steun en de hoogte van het
      steunbedrag nog niet definitief is vastgesteld, kan het een voorschot toekennen aan de aanvrager. Dit voorschot
      bedraagt ten hoogste 50 procent van de financiële steun zoals die op basis van voorlopige berekeningen is
      becijferd.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel66
  - number: '66.2'
    text: |-
      Indien een voorschot is uitgekeerd, maar de definitieve berekening op een lager niveau wordt vastgesteld dan het
      verstrekte voorschot, dan dient het verschil tussen voorschot en definitieve uitkering op eerste aanmaning te
      worden terugbetaald aan het Bedrijfsfonds.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel66
  - number: '67.1'
    text: |-
      Het Bedrijfsfonds voor de Pers kan de steunverlening beëindigen en de reeds uitgekeerde bedragen terugvorderen,
      indien:
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel67
  - number: 67.1.a
    text: enig voorschrift verbonden aan steunverlening door de aanvrager niet wordt nagekomen;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel67
  - number: 67.1.b
    text: blijkt dat de bij de aanvraag overlegde gegevens onjuist waren;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel67
  - number: 67.1.c
    text: |-
      binnen een jaar na de datum waarop de beslissing tot steunverlening is genomen een surseance van betaling of een
      faillissement van de aanvrager is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel67
  - number: '67.2'
    text: |-
      Het Bedrijfsfonds kan op een aanvraag om steunverlening op grond van [artikel 54, onderdeel ][ref1], negatief
      beschikken danwel besluiten van feitelijke uitbetaling van reeds toegezegde financiële ondersteuning af te zien,
      indien een dagblad failleert in de periode die verloopt tussen het jaar waarop de aangevraagde steun betrekking
      heeft en het moment waarop tot feitelijke uitbetaling van de betrokken uitkeringen zou worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel54
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '54'
        hoofdstuk: '5'
  - number: '68.1'
    text: |-
      Het Commissariaat voor de Media verleent toestemming voor het verzorgen van een programma uitsluitend bestemd
      voor in Nederland gelegerde militairen van buitenlandse strijdkrachten en hun gezinnen, dat door middel van een
      omroepzender wordt uitgezonden binnen een gebied van beperkte omvang.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel68
  - number: '68.2'
    text: |-
      De toestemming wordt verleend aan de bevoegde militaire autoriteiten van een bij de Noord-atlantische
      verdragsorganisatie (NAVO) aangesloten land waarvan strijdkrachten in Nederland zijn gelegerd, voor het gebruik
      door instellingen of personen van de buitenlandse strijdkrachten die daartoe door hen worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel68
  - number: '68.3'
    text: |-
      Ten aanzien van het gebruik van de toestemming zijn de [artikelen 52][ref1] tot en met [53a ][ref2], [55][ref3],
      [56][ref4], [56a][ref5], vijfde en zesde lid, [134][ref6], [138b][ref7] en [138d van de Mediawet][ref8] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004149#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0004149#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0004149#Artikel56a
      [ref6]: https://wetten.overheid.nl/BWBR0004149#Artikel134
      [ref7]: https://wetten.overheid.nl/BWBR0004149#Artikel138
      [ref8]: https://wetten.overheid.nl/BWBR0004149#Artikel138d
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004149
        artikel: 53a
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0004149
        artikel: '56'
      - id: ref5
        bwb_id: BWBR0004149
        artikel: 56a
      - id: ref6
        bwb_id: BWBR0004149
        artikel: '134'
      - id: ref7
        bwb_id: BWBR0004149
        artikel: '138'
      - id: ref8
        bwb_id: BWBR0004149
        artikel: 138d
  - number: '69'
    text: |-
      Het Commissariaat voor de Media kan zonodig de omroepzender of omroepzenders aanwijzen waarop de programma’s als
      bedoeld in [artikel 68][ref1], zullen worden uitgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: '70.1'
    text: |-
      Een aanvraag voor de toestemming als bedoeld in [artikel 68][ref1] wordt ingediend bij Onze Minister van Defensie,
      die deze voorzien van zijn opmerkingen binnen vier weken doorzendt aan het Commissariaat voor de Media. Het
      Commissariaat zendt een afschrift van de aanvraag aan Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: '70.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
  - number: 70.2.a
    text: een omschrijving van het doel van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
  - number: 70.2.b
    text: een aanduiding van het gebied waarbinnen het programma zal worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
  - number: 70.2.c
    text: |-
      een verklaring van de auteursrechthebbenden aan de autoriteiten van de betreffende NAVO-lidstaat waaruit blijkt
      dat geen auteursrechtelijke toestemming zal worden verleend voor de verspreiding van het programma buiten de in
      [artikel 68][ref1] omschreven doelgroep en het gebied; en


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: 70.2.d
    text: een omschrijving van de te gebruiken omroepzender waarop het programma zal worden uitgezonden.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel70
  - number: '71.1'
    text: 'Het Commissariaat voor de Media trekt de toestemming in:'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel71
  - number: 71.1.a
    text: |-
      wanneer niet meer wordt voldaan aan de voorwaarden die in [artikel 68, eerste en tweede lid][ref1], worden gesteld
      om voor toestemming in aanmerking te komen;


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: 71.1.b
    text: op gronden ontleend aan de veiligheid van de Staat.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel71
  - number: '71.2'
    text: |-
      Het Commissariaat kan de toestemming intrekken indien niet wordt voldaan aan het bepaalde in
      [artikel 68, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: '71.3'
    text: |-
      Het Commissariaat maakt zijn voornemen tot intrekking van de toestemming kenbaar aan Onze Minister van Defensie en
      Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel71
  - number: '72.1'
    text: |-
      Een beschikking tot intrekking van een verleende toestemming, genomen op grond van [artikel 71, eerste lid][ref1],
      gaat onmiddellijk in.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel71
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '71'
        hoofdstuk: '6'
  - number: '72.2'
    text: |-
      Een beschikking tot intrekking van een verleende toestemming, genomen op grond van [artikel 71, tweede lid][ref1],
      gaat niet eerder in dan nadat de bevoegde militaire autoriteit van het voornemen daartoe en de gronden waarop
      de beschikking berust in kennis is gesteld en deze in de gelegenheid is gesteld binnen een redelijke termijn
      schriftelijke en desgewenst mondelinge opmerkingen te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel71
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '71'
        hoofdstuk: '6'
  - number: '73.1'
    text: |-
      De bevoegde militaire autoriteit gebruikt de aan hem verleende toestemming geheel voor het programma, bedoeld in
      [artikel 68][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004237#Artikel68
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004237
        artikel: '68'
        hoofdstuk: '6'
  - number: '73.2'
    text: |-
      Aan het begin en aan het einde van ieder programma wordt dagelijks ervan melding gemaakt dat het programma
      uitsluitend bestemd is voor de in Nederland gelegerde militairen van de strijdkrachten van de desbetreffende
      lidstaat en hun gezinnen.
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel73
  - number: '75'
    text: 'Dit besluit wordt aangehaald als: Mediabesluit.'
    url: https://wetten.overheid.nl/BWBR0004237/2006-10-06#Artikel75
