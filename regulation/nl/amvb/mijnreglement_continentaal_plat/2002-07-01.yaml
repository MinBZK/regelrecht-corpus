preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Economische Zaken van 18 november 1966, no. 666/833 W.J.A./E.M.C., gedaan
    in overeenstemming met Onze Ministers van Onderwijs en Wetenschappen, van Defensie, van Verkeer en Waterstaat, van
    Landbouw en Visserij en van Cultuur, Recreatie en Maatschappelijk Werk;

    Gelet op artikel 26 van de Mijnwet continentaal plat (Stb. 1965, 428);

    De Raad van State gehoord (advies van 14 december 1966, no. 38);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 10 maart 1967, no. 667/212 W.J.A./E.M.C.,
    uitgebracht in overeenstemming met Onze andere voornoemde Ministers;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder: *mijnbouwkundig werk:*
      een verkennings- of opsporingsonderzoek dan wel het winnen van delfstoffen; *mijnonderneming:* een onderneming of
      instelling, waarin - of waarvoor door anderen - mijnbouwkundig werk wordt verricht krachtens een aan de eigenaar
      van die onderneming of instelling verleende vergunning of ontheffing; *mijnbouwinstallatie:*
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel1
  - number: 1.1.a
    text: |-
      een op of boven het continentaal plat geplaatste inrichting voor het instellen van een opsporingsonderzoek of het
      winnen van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel1
  - number: 1.1.b
    text: een samenstel van inrichtingen, waarvan er tenminste één aan de onder *a* gegeven omschrijving voldoet;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt onder radioactieve stoffen verstaan hetgeen
      krachtens [artikel 1, eerste lid, onder d, van de Kernenergiewet][ref1] daaronder wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '2'
    text: |-
      Indien een voorschrift in dit besluit een der termen: 'veilig', 'doelmatig' en 'voldoende' inhoudt, kan Onze
      Minister, in voorkomend geval in overeenstemming met Onze Minister, wie het mede aangaat, terzake nadere regelen
      stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel2
  - number: '4.1'
    text: Ontheffingen worden uitsluitend verleend op een daartoe strekkende aanvraag.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: '4.2'
    text: |-
      Aanvragen om ontheffing of vergunning worden tot Onze Minister gericht. Zodanige aanvragen worden bij hem ingediend
      in geval hij blijkens een desbetreffend voorschrift dient te handelen in overeenstemming met Onze Minister, wie het
      mede aangaat, en overigens bij de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: '4.3'
    text: |-
      Ontheffingen en vergunningen kunnen onder beperkingen worden verleend. Aan ontheffingen en vergunningen kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: '4.4'
    text: |-
      De houder van een vergunning of een ontheffing is verplicht aan Onze Minister kennis te geven van een na het
      verlenen van de vergunning of de ontheffing opgetreden wijziging in de gegevens, vermeld bij de aanvraag om de
      vergunning of de ontheffing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: '4.5'
    text: 'Een ontheffing of vergunning kan worden gewijzigd of ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: 4.5.a
    text: |-
      de te harer verkrijging verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken te zijn, dat op de
      aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: 4.5.b
    text: |-
      de omstandigheden, op grond waarvan zij werd verleend, zich zodanig hebben gewijzigd dat de ontheffing of de
      vergunning niet, of niet in de bestaande vorm, zou zijn verleend, als op het tijdstip van de beslissing de
      gewijzigde omstandigheden aanwezig waren geweest;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: 4.5.c
    text: zij met het oog op gevaar voor lichamelijke schade niet gehandhaafd kan blijven;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: 4.5.d
    text: blijkt, dat aan een of meer aan de ontheffing of vergunning verbonden voorschriften niet wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel4
  - number: '5'
    text: Artikel 4, tweede lid, is van overeenkomstige toepassing op andere in dit besluit voorziene beschikkingen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel5
  - number: '6'
    text: |-
      Beschikkingen, waarbij ter uitvoering van het bij of krachtens dit besluit bepaalde aanwijzingen worden gegeven
      voor bijzondere gevallen, bepalen, indien nodig, de termijn, waarbinnen de uitvoering moet zijn aangevangen,
      alsmede de termijn, waarbinnen zij moet worden voltooid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel6
  - number: 6a
    text: |-
      Ter bescherming van de veiligheid en de gezondheid van de arbeiders tijdens alle werkzaamheden dient elke bemande
      arbeidsplaats te allen tijde onder toezicht te staan van een verantwoordelijke persoon die voldoende hoedanigheden
      en bekwaamheden bezit om deze functie te vervullen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel6a
  - number: '7.1'
    text: |-
      Voor zover in dit besluit niet anders is bepaald, zijn de bestuurders van een mijnonderneming verplicht zorg te
      dragen voor de naleving in hun onderneming van de bij en krachtens dit besluit gegeven voorschriften en regelen.
      Zij dienen op gezette tijden de maatregelen die zijn genomen inzake de veiligheid en de gezondheid van de
      arbeiders, met inbegrip van het in artikel 13*g* bedoelde veiligheids- en gezondheidszorgsysteem, te onderzoeken om
      ervoor te zorgen dat de daarop betrekking hebbende bepalingen van dit besluit worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: '7.2'
    text: |-
      Gelijke verplichting rust op personen in dienst bij de onderneming, voor zover zij door de bestuurders zijn belast
      met de zorg voor de naleving van die voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: '7.3'
    text: |-
      De bestuurders en de in het tweede lid bedoelde toezichthoudende personen worden geacht aan hun in het eerste
      onderscheidenlijk tweede lid bedoelde verplichting te hebben voldaan, wanneer zij de nodige instructies hebben
      gegeven, de nodige middelen hebben verschaft en het redelijkerwijs te vorderen toezicht hebben gehouden om
      de naleving van de voorschriften en regelen te verzekeren. De instructies moeten voor de betrokken arbeiders
      begrijpelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: '7.4'
    text: |-
      Voor elke arbeidsplaats moeten schriftelijke instructies worden opgesteld ter bepaling van de in acht te nemen
      regels ter garantie van de veiligheid en de gezondheid van de arbeiders en het veilig gebruik van materieel. Deze
      instructies moeten aanwijzingen bevatten betreffende het gebruik van noodapparatuur en de wijze waarop moet worden
      opgetreden ingeval zich op of nabij de arbeidsplaats een noodsituatie voordoet. Een ieder is verplicht hem gegeven
      instructies als in dit en het derde lid bedoeld op te volgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: '7.5'
    text: |-
      Ter bescherming van de veiligheid en de gezondheid van de arbeiders moeten doelmatige voorzieningen in verband met
      voorlichting, opleiding, scholing en herscholing worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: '7.6'
    text: |-
      Onverminderd de verplichting tot naleving van de bij en krachtens dit besluit gegeven voorschriften en regelen,
      die zich rechtstreeks tot hem richten, is een ieder verplicht tot elk handelen en elk nalaten, waardoor de naleving
      van de overige bij en krachtens dit besluit gegeven voorschriften en regelen kan worden verzekerd, voor zover dat
      handelen of nalaten redelijkerwijs van hem kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7
  - number: 7a
    text: |-
      De kosten die zijn verbonden aan de naleving van de regels die bij of krachtens de bepalingen van dit besluit
      inzake de veiligheid, de hygiëne en de gezondheid op het werk zijn gesteld worden niet ten laste gebracht van door
      de mijnonderneming of de in artikel 11, eerste lid, bedoelde andere onderneming tewerkgestelde personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel7a
  - number: 8a.1
    text: |-
      Arbeidsplaatsen moeten zodanig zijn ontworpen, gebouwd, ingericht, bediend, gecontroleerd en onderhouden dat zij
      aan de te verwachten omgevingskrachten weerstand kunnen bieden. Zij dienen een constructie en een stevigheid te
      hebben die zijn afgestemd op het gebruik dat ervan wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8a
  - number: 8a.2
    text: |-
      Arbeidsplaatsen moeten volgens ergonomische beginselen worden ontworpen en gebouwd, waarbij ermee rekening wordt
      gehouden dat de arbeiders de werkzaamheden op hun werkplek kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8a
  - number: 8a.3
    text: |-
      Arbeidsplaatsen moeten zodanig zijn ingericht, dat zij een afdoende bescherming tegen risico’s bieden. Zij moeten
      schoon worden gehouden en alle gevaarlijke stoffen moeten op zodanige wijze worden verwijderd of beveiligd dat zij
      de veiligheid en de gezondheid van de arbeiders niet in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8a
  - number: 8a.4
    text: |-
      Bij de inrichting van de arbeidsplaatsen moet in voorkomend geval met gehandicapte arbeiders rekening worden
      gehouden. Dit geldt met name voor deuren, verbindingswegen, trappen, doucheruimten, wasruimten, toiletten en
      werkplekken die rechtstreeks door gehandicapte arbeiders worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8a
  - number: 8b.1
    text: |-
      De arbeiders of hun vertegenwoordigers worden voorgelicht over alle maatregelen die met betrekking tot de
      veiligheid en de gezondheid op de arbeidsplaatsen moeten worden getroffen. De informatie moet voor de betrokken
      arbeiders begrijpelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8b
  - number: 8b.2
    text: |-
      Onverminderd het bepaalde in het eerste lid moeten passende maatregelen worden genomen om ervoor te zorgen dat de
      arbeiders of hun vertegenwoordigers toegang hebben tot alle nodige informatie betreffende:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8b
  - number: 8b.2.a
    text: |-
      de risico’s voor de veiligheid en de gezondheid alsmede de beschermings- en preventiemaatregelen en -activiteiten,
      zowel voor de mijnbouwonderneming in het algemeen als voor elk type werkplek en elke functie afzonderlijk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8b
  - number: 8b.2.b
    text: de maatregelen die krachtens de artikelen 133, 134, 187 en 191 zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8b
  - number: 8c.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming wijzen een
      of meer arbeiders aan die zich met de activiteiten op het gebied van de bescherming tegen en de preventie van
      beroepsrisico’s in de onderneming of op mijnbouwinstallaties zullen bezighouden, behoudens het bepaalde in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.2
    text: |-
      De aangewezen arbeiders mogen geen nadeel ondervinden van hun activiteiten op het gebied van de bescherming tegen
      en de preventie van beroepsrisico's. Zij moeten, ten einde de uit dit reglement voortvloeiende verplichtingen te
      kunnen nakomen, over voldoende tijd beschikken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.3
    text: |-
      Indien de mogelijkheden op de mijnbouwinstallatie onvoldoende zijn om deze beschermings- en preventieactiviteiten
      te organiseren, moet een beroep gedaan worden op deskundige personen of diensten van buiten de onderneming.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.4
    text: |-
      Indien een beroep gedaan wordt op deskundigen als bedoeld in het derde lid, moeten de betrokken personen of
      diensten worden geïnformeerd over de factoren, waarvan bekend is of vermoed wordt dat zij van invloed zijn op
      de veiligheid en de gezondheid van de arbeiders, en toegang hebben tot alle in artikel 11, tweede lid, bedoelde
      informatie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.5
    text: 'In alle gevallen moeten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.5.a
    text: de aangewezen arbeiders over de benodigde capaciteiten en middelen beschikken,
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.5.b
    text: |-
      de in het derde lid bedoelde personen of diensten de nodige bekwaamheden hebben en over de nodige personele en
      professionele middelen beschikken en
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.5.c
    text: |-
      de aangewezen arbeiders en de geraadpleegde personen of diensten voldoende in aantal zijn om de beschermings-
      en preventieactiviteiten op zich te nemen, afhankelijk van de grootte van de mijnbouwinstallatie en de risico’s
      waaraan de arbeiders zijn blootgesteld, alsmede de verdeling ervan over de gehele mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.6
    text: |-
      De in dit artikel bedoelde bescherming tegen en preventie van risico’s voor de veiligheid en de gezondheid kan
      worden opgedragen aan de veiligheidsdienst, bedoeld in artikel 96, en de bedrijfsgeneeskundige dienst, bedoeld in
      artikel 146. De diensten moeten voor zover nodig samenwerken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: 8c.7
    text: Onze Minister kan nadere regelen stellen ter zake van het in het eerste en vijfde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel8c
  - number: '9.1'
    text: |-
      De bestuurders van een mijnonderneming zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld schriftelijk
      opgave te doen van de naam en de functie van de personen, die zij hebben belast met de zorg voor de naleving van de
      bij en krachtens dit besluit gegeven voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel9
  - number: '9.2'
    text: |-
      De bestuurders dienen voorts jaarlijks in de maand januari aan de Inspecteur-Generaal der Mijnen schriftelijk
      opgave te doen van de naam en de functie van de personen, die op 1 januari van het desbetreffende jaar een
      leidinggevende of toezichthoudende functie vervulden op bij die onderneming voor mijnbouwkundig werk in gebruik
      zijnde vaartuigen, luchtvaartuigen of mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel9
  - number: '9.3'
    text: |-
      De bestuurders zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld een exemplaar toe te zenden van de
      algemene schriftelijke instructies, die zij aan het personeel hunner onderneming hebben gegeven ter verzekering van
      de naleving van de bij en krachtens dit besluit gegeven voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel9
  - number: '9.4'
    text: |-
      De Inspecteur-Generaal der Mijnen draagt zorg, dat van de in het eerste en het tweede lid bedoelde opgaven, zomede
      van de in het derde lid bedoelde instructies onverwijld een afschrift wordt verstrekt aan de inspectie-ambtenaren,
      voor zover die opgaven en instructies voor het vervullen van hun taak van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel9
  - number: '10.1'
    text: |-
      Bij elke bemande arbeidsplaats moet een voldoende aantal arbeiders beschikbaar zijn die de voor de uitvoering van
      de hun opgedragen taken vereiste bekwaamheden, ervaring en opleiding dienen te bezitten. Onze Minister kan nadere
      regelen stellen ter zake van het in de eerste volzin bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10
  - number: '10.2'
    text: |-
      Werkzaamheden, van welker goede uitvoering de veiligheid of de gezondheid van de bij mijnbouwkundig werk
      tewerkgestelde personen in belangrijke mate afhankelijk is, mogen slechts worden opgedragen aan daarvoor bekwame en
      lichamelijk en geestelijk geschikte, zomede betrouwbare personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10
  - number: '10.3'
    text: |-
      Blijkt een persoon, aan wie werkzaamheden als in het eerste lid bedoeld zijn opgedragen, aan een der aldaar
      genoemde eisen niet of niet langer te voldoen, dan moet hij onverwijld van die werkzaaheden worden ontheven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10
  - number: 10a.1
    text: De arbeiders moeten worden getraind in het uitvoeren van de handelingen die in noodgevallen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10a
  - number: 10a.2
    text: |-
      Onverminderd het bepaalde in het eerste lid moeten arbeiders ook worden getraind in het uitvoeren van de
      handelingen die op een specifieke arbeidsplaats moeten worden verricht. De in de eerste volzin bedoelde handelingen
      moeten voor de desbetreffende arbeidsplaats nader worden omschreven in het in artikel 13*f* bedoelde veiligheids-
      en gezondheidsdocument.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10a
  - number: 10a.3
    text: De arbeiders moeten worden getraind in de toepassing van overlevingstechnieken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel10a
  - number: '11.1'
    text: |-
      De bestuurders van een mijnonderneming zijn verplicht aan de Inspecteur-Generaal der Mijnen onverwijld opgave
      te doen van andere ondernemingen, die in opdracht van die mijnonderneming mijnbouwkundig werk uitvoeren of bij
      mijnbouwkundig werk, door of in opdracht van die mijnonderneming uitgevoerd, werkzaamheden verrichten en van de
      aard van dat werk of die werkzaamheden. Artikel 9, vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: '11.2'
    text: |-
      De bestuurders zijn verplicht vóór de aanvang van werkzaamheden als in het eerste lid bedoeld de bestuurders van de
      andere ondernemingen in kennis te stellen van:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: 11.2.a
    text: |-
      de bij en krachtens dit besluit gegeven voorschriften en regelen, die met het oog op de te verrichten werkzaamheden
      van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: 11.2.b
    text: 'alle bijzonderheden, die in verband met de uitvoering van de te verrichten werkzaamheden van belang zijn:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: 11.2.b.1°
    text: uit een oogpunt van veiligheid en gezondheid van de bij het mijnbouwkundig werk werkzame personen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: 11.2.b.2°
    text: |-
      ter voorkoming van verontreiniging van de zee, ter bescherming van de scheepvaart en de visserij en van onderzeese
      kabels en pijpleidingen, alsmede voor het instandhouden van de levende rijkdommen van de zee.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: '11.3'
    text: |-
      De in artikel 7, eerste en tweede lid, bedoelde verplichting geldt niet ten opzichte van personen, die als
      bestuurders van of in dienst bij een andere onderneming als bedoeld in het eerste lid van het onderhavige artikel
      in het bedrijf van die andere onderneming werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: '11.4'
    text: |-
      In de gevallen, waarin het derde lid geldt, zijn het eerste onderscheidenlijk tweede lid, zomede het derde lid van
      artikel 7 van overeenkomstige toepassing op de bestuurders van de betrokken andere onderneming en op personen in
      dienst bij die onderneming, voor zover zij door die bestuurders zijn belast met de zorg voor de naleving van de bij
      en krachtens dit besluit gegeven voorschriften en regelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel11
  - number: '12'
    text: |-
      Werkzaamheden bij mijnbouwkundig werk mogen, in geval zij aan een andere onderneming worden opgedragen, uitsluitend
      opgedragen worden aan ondernemingen, waarvan redelijkerwijs mag worden verwacht, dat zij de opgedragen arbeid naar
      behoren zullen verrichten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel12
  - number: '13.1'
    text: 'Bij een mijnonderneming moeten op doelmatige plaatsen de volgende bescheiden aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.a
    text: |-
      een inspectie-register, waarin de inspectie-ambtenaren aantekening houden van hun bezoeken, alsmede van de
      opmerkingen, waartoe het bij die bezoeken geconstateerde aanleiding heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.b
    text: 'een personenregister, waarin omtrent degenen, die bij een mijnbouwkundig werk te werk zijn gesteld, worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.b.1°
    text: |-
      naam, voorletters, nationaliteit, nummer van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] en geboortedatum;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 13.1.b.2°
    text: functie, datum van aankomst op en datum van vertrek van het mijnbouwkundig werk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.b.3°
    text: bezit van bewijs van geneeskundig onderzoek alsmede de vervaldatum hiervan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.b.4°
    text: bezit van bij of krachtens dit reglement gevorderde opleidings- en trainingsbewijzen alsmede de vervaldata hiervan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.b.5°
    text: datum en tijdstip van de laatste wijziging van het register.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13.1.c
    text: |-
      bescheiden, waarin omtrent de onder *b* bedoelde personen is vermeld of zij bij een verkenningsonderzoek dan
      wel bij een opsporingsonderzoek of het winnen van delfstoffen zijn tewerkgesteld, zomede welke werkzaamheden zij
      verrichten, tenzij een en ander reeds blijkt uit de omschrijving van de ingevolge *b*, onder 2°, vermelde functie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister kan met betrekking tot door hem aangewezen personen of groepen van personen, die bij mijnbouwkundig
      werk zijn tewerkgesteld, doch niet in dienst van de betrokken mijnonderneming zijn, van het eerste lid, onder *b*
      en *c*, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13
  - number: 13a
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming zijn verplicht te
      zorgen voor de veiligheid en de gezondheid van de arbeiders inzake alle met het werk verbonden aspecten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13a
  - number: 13b.1
    text: |-
      De nodige maatregelen dienen te worden getroffen voor de bescherming van de veiligheid en de gezondheid van de
      arbeiders, met inbegrip van de maatregelen ter preventie van beroepsrisico's, voor informatie en opleiding alsmede
      voor de organisatie en de benodigde middelen. Deze maatregelen moeten worden aangepast, ten einde rekening te
      houden met gewijzigde omstandigheden en streven naar verbetering van bestaande situaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2
    text: 'Rekening houdend met de betrokken werkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.a
    text: |-
      dienen de risico’s voor de veiligheid en de gezondheid van de arbeiders geëvalueerd te worden met inbegrip van de
      keuze van de werkuitrusting, de chemische stoffen of preparaten en de inrichting van de arbeidsplaatsen; op grond
      van deze evaluatie en voor zover nodig moeten de preventieactiviteiten en de gebruikte werk- en produktiemethoden:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.a.1°
    text: een betere bescherming van de veiligheid en de gezondheid van de arbeiders verzekeren;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.a.2°
    text: geïntegreerd worden in het geheel van activiteiten van de mijnonderneming en betrekking hebben op alle niveaus;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.b
    text: |-
      dient, wanneer een arbeider met de uitvoering van een taak belast wordt, de bekwaamheid van de betrokken arbeider
      op het gebied van veiligheid en gezondheidsbescherming in aanmerking genomen te worden;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.c
    text: |-
      dient ervoor gezorgd te worden dat over de planning en invoering van nieuwe technologieën overleg wordt gepleegd
      met de arbeiders of hun vertegenwoordigers, wat betreft de gevolgen voor de veiligheid en de gezondheid van de
      arbeiders van de keuze inzake uitrusting, de arbeidsomstandigheden en de invloed van de omgevingsfactoren op het
      werk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13b.2.d
    text: |-
      dienen de nodige maatregelen genomen te worden opdat alleen arbeiders die passende instructies hebben gekregen tot
      de zones met ernstige en specifieke gevaren toegang hebben.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13b
  - number: 13c
    text: |-
      Bij de tenuitvoerlegging van de in artikel 13*b*, eerste lid, genoemde maatregelen worden de volgende algemene
      preventieprincipes in acht genomen:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.a
    text: het voorkomen van risico's;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.b
    text: het evalueren van risico’s die niet kunnen worden voorkomen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.c
    text: de bestrijding van de risico’s bij de bron;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.d
    text: |-
      de aanpassing van het werk aan de mens, met name wat betreft de inrichting van de arbeidsplaats en de keuze van
      werkuitrusting en werk- en produktiemethoden, met name om monotone arbeid en tempogebonden arbeid draaglijker te
      maken en de nadelige gevolgen daarvan voor de gezondheid te beperken;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.e
    text: het rekening houden met de ontwikkeling van de techniek;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.f
    text: de vervanging van wat gevaarlijk is door dat wat niet gevaarlijk of minder gevaarlijk is;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.g
    text: |-
      de planning van de preventie met het oog op een samenhangend geheel dat de volgende aspecten in de preventie
      integreert: techniek, organisatie van het werk, arbeidsomstandigheden, sociale betrekkingen en invloed van de
      omgevingsfactoren op het werk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.h
    text: |-
      het geven van voorrang aan maatregelen inzake collectieve bescherming boven maatregelen inzake individuele
      bescherming;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13c.i
    text: het verstrekken van passende instructies aan de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13c
  - number: 13d
    text: |-
      Ter verzekering van de veiligheid en de gezondheid van de arbeiders worden de nodige maatregelen getroffen om
      ervoor te zorgen dat:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.a
    text: |-
      de arbeidsplaatsen zodanig worden ontworpen, gebouwd, uitgerust, in bedrijf gesteld, gebruikt en onderhouden dat
      arbeiders hun werk kunnen verrichten zonder gevaar voor hun veiligheid of gezondheid of de veiligheid of gezondheid
      van andere arbeiders;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.b
    text: wanneer bemande arbeidsplaatsen in gebruik zijn, toezicht wordt uitgeoefend door een verantwoordelijke persoon;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.c
    text: |-
      werkzaamheden waaraan een bijzonder risico is verbonden uitsluitend aan vakbekwaam personeel worden opgedragen en
      overeenkomstig de verstrekte instructies worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.d
    text: alle veiligheidsinstructies voor alle betrokken arbeiders begrijpelijk zijn;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.e
    text: passende eerste-hulpvoorzieningen ter beschikking worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13d.f
    text: met regelmatige tussenpozen de nodige veiligheidsoefeningen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13d
  - number: 13e
    text: 'De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming moeten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13e
  - number: 13e.a
    text: |-
      beschikken over een evaluatie van de risico’s voor de veiligheid en de gezondheid op het werk met inbegrip van de
      risico’s voor de groepen arbeiders met bijzondere risico's;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13e
  - number: 13e.b
    text: |-
      de te nemen beschermende maatregelen en, indien nodig, de te gebruiken beschermingsmiddelen vaststellen en dit
      schriftelijk vastleggen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13e
  - number: 13e.c
    text: |-
      een lijst bijhouden van arbeidsongevallen die voor een arbeider hebben geleid tot een arbeidsongeschiktheid van
      meer dan één werkdag.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13e
  - number: 13f.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming dienen voor de bij
      ministeriële regeling te omschrijven mijnbouwinstallaties en werkzaamheden een veiligheids- en gezondheidsdocument
      op te stellen en bij te houden, dat de materie, geregeld bij of krachtens de artikelen 8*b*, 13*b*, 13*c* en 13*e*,
      bestrijkt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.2
    text: 'Uit een veiligheids- en gezondheidsdocument moet met name blijken dat:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.2.a
    text: de risico’s voor de arbeiders op de arbeidsplaats zijn bepaald en geëvalueerd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.2.b
    text: |-
      afdoende maatregelen zullen worden genomen om te voldoen aan het bij en krachtens de in het eerste lid van dit
      artikel genoemde artikelen bepaalde;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.2.c
    text: het ontwerp, gebruik en onderhoud, de bouw en verwijdering van de arbeidsplaats en de uitrusting veilig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.3
    text: |-
      Een veiligheids- en gezondheidsdocument moet vóór de aanvang van het werk worden opgesteld en worden herzien
      wanneer de arbeidsplaats belangrijke wijzigingen, uitbreidingen of verbouwingen heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13f.4
    text: |-
      Een veiligheids- en gezondheidsdocument wordt zonodig bijgewerkt door vermelding van de maatregelen die zijn
      getroffen om herhaling te voorkomen van ernstige bedrijfsongevallen of bedrijfsongevallen met dodelijke afloop, dan
      wel van situaties die een ernstig gevaar vormen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13f
  - number: 13g
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming moeten een
      veiligheids- en gezondheidszorgsysteem opstellen. Dit systeem omvat het geheel van beleid, organisatie, planning,
      uitvoering, monitoring, evaluatie, doorlichting en verbetering dat wordt gehanteerd voor de beheersing van de
      veiligheid en de gezondheid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13g
  - number: 13h.1
    text: |-
      Onverminderd het bepaalde in artikel 13*f* dient uit een veiligheids- en gezondheidsdocument te blijken dat alle
      nodige maatregelen zijn genomen om de veiligheid en gezondheid van de arbeiders zowel in normale situaties als in
      noodsituaties te beschermen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.2
    text: 'Hiertoe moet het document het volgende bevatten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.2.a
    text: |-
      een opgave van de aan de arbeidsplaats verbonden specifieke risicobronnen, met inbegrip van elke activiteit op
      die plaats, die ongevallen kunnen teweegbrengen met ernstige gevolgen voor de veiligheid en de gezondheid van de
      betrokken arbeiders;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.2.b
    text: een evaluatie van de risico’s van de onder *a* bedoelde specifieke bronnen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.2.c
    text: |-
      het bewijs dat afdoende voorzorgsmaatregelen zijn genomen om onder *a* bedoelde ongevallen te vermijden, de
      uitbreiding van ongevallen te beperken en de arbeidsplaats in noodsituaties op een doelmatige en beheerste wijze te
      kunnen evacueren;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.2.d
    text: |-
      het bewijs dat er een veiligheids- en gezondheidszorgsysteem als bedoeld in artikel 13*g* gehanteerd wordt dat
      adequaat is om de voorschriften die betrekking hebben op de veiligheid en de bescherming van de gezondheid van de
      arbeiders, bij of krachtens dit reglement bepaald, zowel in gewone situaties als in noodsituaties na te leven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.3
    text: |-
      Bij de planning en de tenuitvoerlegging van alle in artikel 13*d*, onder *a*, bedoelde fasen dienen de in het
      desbetreffende veiligheids- en gezondheidsdocument vermelde procedures en uitvoeringsbepalingen in acht te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13h.4
    text: |-
      De verschillende ondernemingen die verantwoordelijk zijn voor de verschillende arbeidsplaatsen werken in voorkomend
      geval samen bij het opstellen van de veiligheids- en gezondheidsdocumenten als bedoeld in artikel 13*f* en het
      voorbereiden van de maatregelen die nodig zijn om de veiligheid en de gezondheid van de arbeiders te garanderen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13h
  - number: 13i.1
    text: |-
      Wanneer er arbeiders van verschillende ondernemingen op een zelfde arbeidsplaats aanwezig zijn, moeten de
      bestuurders van die ondernemingen, onverminderd de andere bepalingen van dit reglement, samenwerken bij de
      uitvoering van de maatregelen inzake veiligheid, hygiëne en gezondheid en elkaar wederzijds alsmede hun arbeiders
      of hun vertegenwoordigers van de beroepsrisico’s op de hoogte stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13i
  - number: 13i.2
    text: |-
      De bestuurders van de betrokken mijnonderneming moeten de uitvoering van alle maatregelen inzake veiligheid
      en gezondheid van de arbeiders coördineren. Zij preciseren in het in artikel 13*f* bedoelde veiligheids- en
      gezondheidsdocument het doel, de maatregelen en de wijze van uitvoering van deze coördinatie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13i
  - number: 13j.1
    text: 'De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming moeten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13j.1.a
    text: |-
      alle arbeiders die blootgesteld zijn of kunnen worden aan een ernstig of onmiddellijk gevaar zo spoedig mogelijk in
      kennis stellen van dat gevaar en van de getroffen of te treffen beschermingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13j.1.b
    text: |-
      maatregelen nemen en de arbeiders instructies geven ten einde hun toe te staan, in geval van een niet te
      vermijden, ernstig en onmiddellijk gevaar, hun activiteit stop te zetten of zich in veiligheid te stellen door de
      arbeidsplaats onmiddellijk te verlaten;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13j.1.c
    text: |-
      zich er, behalve in uitzonderlijke, naar behoren gemotiveerde gevallen van onthouden de arbeiders te verzoeken hun
      werk te hervatten in een werksituatie waarin nog een ernstig en onmiddellijk gevaar bestaat.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13j.2
    text: |-
      De arbeider die, in geval van een niet te vermijden, ernstig en onmiddellijk gevaar zijn werkplek of
      een gevaarlijke zone verlaat, mag daar geen nadeel van ondervinden en moet worden beschermd tegen alle
      ongerechtvaardigde nadelige gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13j.3
    text: |-
      De in het eerste lid bedoelde bestuurders zorgen ervoor dat elke arbeider, wanneer een ernstig en onmiddellijk
      gevaar voor zijn eigen veiligheid of die van anderen dreigt en het onmogelijk is contact op te nemen met de
      bevoegde hiërarchieke chef, rekening houdend met zijn technische kennis en middelen, de nodige doeltreffende
      maatregelen kan nemen om de gevolgen van een dergelijk gevaar te voorkomen. Hun optreden mag dan voor hem geen
      enkel nadeel met zich brengen, tenzij hij ondoordacht heeft gehandeld of zich schuldig heeft gemaakt aan grove
      nalatigheid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13j
  - number: 13k
    text: Onze Minister kan nadere regelen stellen ter zake van het in de artikelen 13*a* tot en met 13*j* bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel13k
  - number: '14'
    text: |-
      De bescheiden, voorzien in het bij of krachtens dit besluit bepaalde, moeten op voldoend duidelijke wijze worden
      opgesteld, doelmatig worden ingericht en doelmatig worden bijgehouden. Zij moeten, voor zover bij of krachtens dit
      besluit niet anders is bepaald, gedurende tenminste een jaar ter beschikking blijven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel14
  - number: '15.1'
    text: |-
      Degenen, die bij mijnbouwkundig werk een leidinggevende of toezichthoudende functie vervullen, moeten kunnen
      beschikken over een exemplaar van dit besluit en van de ter uitvoering daarvan gegeven nadere regelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel15
  - number: '15.2'
    text: |-
      Een uittreksel uit dit besluit en de ter uitvoering daarvan gegeven nadere regelen, waarin zijn opgenomen de
      voorschriften en regelen, welke naar het oordeel van Onze Minister, in voorkomend geval in overeenstemming met
      Onze Minister, wie het mede aangaat, voor bepaalde bij mijnbouwkundig werk tewerkgestelde personen of groepen van
      personen in het bijzonder van belang zijn, moet bij indiensttreding, tewerkstelling of indeling bij een dergelijke
      groep aan die personen worden uitgereikt, tenzij blijkt dat zij reeds in het bezit van zodanig uittreksel zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel15
  - number: '15.3'
    text: |-
      Indien personen als in het eerste en tweede lid bedoeld de Nederlandse taal niet beheersen, dienen de in die leden
      bedoelde bescheiden in een voor hen begrijpelijke taal te zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel15
  - number: 15a
    text: |-
      Bij een mijnonderneming dienen ten aanzien van elk der mijnbouwinstallaties, in gebruik voor het in die onderneming
        - of voor die onderneming door anderen - instellen van een opsporingsonderzoek, dan wel het winnen van delfstoffen,
      voldoende maatregelen te worden getroffen om op elk gewenst moment onmiddellijk te kunnen vaststellen welke
      personen op de betrokken mijnbouwinstallatie aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel15a
  - number: '16.1'
    text: Het is aan personen, die daartoe niet gerechtigd zijn, verboden zich op een mijnbouwinstallatie te bevinden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel16
  - number: '16.2'
    text: |-
      Ten aanzien van door Onze Minister aangewezen mijnbouwinstallaties dienen voldoende maatregelen te worden
      getroffen, die de mogelijkheid tot het betreden daarvan door personen, die daartoe niet gerechtigd zijn, zoveel
      mogelijk beperken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel16
  - number: '16.3'
    text: |-
      Personen, die niet voldoende bekend zijn met een mijnbouwinstallatie of de daarop aanwezige inrichtingen, mogen
      slechts op die mijnbouwinstallatie worden toegelaten, indien zij zich gedurende hun aanwezigheid daarop onder
      bevoegd geleide bevinden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister kan in gevallen, waarin ernstige aantasting van de in
      [artikel 26, eerste lid, van de Mijnwet continentaal plat][ref1] (*Stb.* 1965, 428) bedoelde belangen ontstaat of
      dreigt te ontstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel26
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '26'
  - number: 17.1.a
    text: maatregelen voorschrijven ten aanzien van mijnbouwkundig werk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17
  - number: 17.1.b
    text: bestuursdwang toe te passen ter handhaving van de onder *a* bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister geeft aan het eerste lid geen toepassing dan in voorkomend geval in overeenstemming met Onze
      Minister, wie het mede aangaat, behoudens in geval de aantasting als in dat lid bedoeld onmiddellijk dreigt te
      ontstaan en een onverwijlde toepassing daarvan naar zijn oordeel is vereist.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17
  - number: 17a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, is toestemming vereist voor de uitvoering van
      gevaarlijke werkzaamheden en voor de uitvoering van gewoonlijk ongevaarlijke werkzaamheden die in combinatie met
      andere activiteiten ernstige risico’s met zich mee kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17a
  - number: 17a.2
    text: |-
      De toestemming moet door de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde
      andere onderneming worden gegeven voor de aanvang van de werkzaamheden en daarbij dient te worden aangegeven aan
      welke voorwaarden moet worden voldaan en welke voorzorgsmaatregelen moeten worden genomen voor, tijdens en na de
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17a
  - number: 17a.3
    text: Onze Minister kan regelen stellen ter zake van het in het eerste en tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17a
  - number: 17b
    text: |-
      De bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming
      raadplegen over vraagstukken die betrekking hebben op de veiligheid en de gezondheid op het werk de betrokken
      arbeiders of hun vertegenwoordigers en geven hun het recht tot evenwichtige deelneming aan de behandeling daarvan
      en tot het doen van voorstellen daaromtrent.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17b
  - number: 17c
    text: |-
      De arbeiders, of hun vertegenwoordigers, met een specifieke taak op het gebied van de bescherming van de veiligheid
      en de gezondheid van de arbeiders hebben toegang tot alle nodige informatie betreffende, en worden vooraf tijdig
      geraadpleegd over:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.a
    text: alle maatregelen die van wezenlijke invloed kunnen zijn op de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.b
    text: |-
      de aanwijzing van personen als bedoeld in de artikelen 8*c*, eerste lid, 135, vierde lid, 187, eerste lid, en 191,
      derde lid, en van activiteiten als bedoeld in artikel 8*c*, eerste lid;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.c
    text: de toepassing van de artikelen 8*b*, tweede lid, 11, tweede lid, 13*e* en 185;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.d
    text: het aantal en de opleiding van de onder *b* bedoelde personen en het materiaal waarover zij kunnen beschikken;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.e
    text: de van de beschermings- en preventieactiviteiten van de Inspecteur-Generaal der Mijnen afkomstige informatie;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.f
    text: |-
      het eventuele beroep dat overeenkomstig artikel 8*c*, derde lid, wordt gedaan op deskundige personen of diensten
      van buiten de onderneming;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17c.g
    text: de opzet en organisatie van de in artikel 7, vijfde lid, bedoelde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17c
  - number: 17d
    text: |-
      De in artikel 17*c*, aanhef, bedoelde arbeidersvertegenwoordigers hebben het recht de in artikel 17*b* bedoelde
      bestuurders te verzoeken passende maatregelen te nemen en hun in die zin voorstellen te doen, om alle risico’s voor
      de arbeiders te ondervangen of de bronnen van gevaar uit te schakelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17d
  - number: 17e
    text: |-
      De in artikel 17*c*, aanhef, bedoelde arbeiders en vertegenwoordigers mogen geen nadeel ondervinden van hun in de
      artikelen 17*c* en 17 *d* bedoelde activiteiten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17e
  - number: 17f
    text: |-
      De in artikel 17*b* bedoelde bestuurders dienen de arbeidersvertegenwoordigers met een specifieke taak op het
      gebied van de bescherming van de veiligheid en de gezondheid van de arbeiders gedurende voldoende tijd met behoud
      van loon vrij te stellen van werk en de nodige middelen ter beschikking te stellen om het deze vertegenwoordigers
      mogelijk te maken de uit dit reglement voortvloeiende rechten en taken uit te oefenen respectievelijk te vervullen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17f
  - number: 17g.1
    text: |-
      De arbeiders of hun vertegenwoordigers hebben het recht om zich tot de Inspecteur-Generaal der Mijnen te wenden,
      indien zij menen dat de door de in artikel 17*b* bedoelde bestuurders genomen maatregelen en ingezette middelen
      niet toereikend zijn om de veiligheid en de gezondheid op het werk te verzekeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17g
  - number: 17g.2
    text: |-
      Tijdens bezoeken en inspecties door toezichthoudende ambtenaren van het Staatstoezicht op de Mijnen moeten de
      arbeidersvertegenwoordigers in de gelegenheid worden gesteld hun opmerkingen aan hen voor te leggen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel17g
  - number: '18.1'
    text: |-
      Tenminste twee weken voordat met een verkenningsonderzoek wordt aangevangen, moet aan de Inspecteur-Generaal der
      Mijnen schriftelijk mededeling worden gedaan van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.a
    text: het doel en de wijze van het verkenningsonderzoek;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.b
    text: |-
      indien het verkenningsonderzoek met gebruikmaking van vaartuigen zal worden verricht, de namen, nationaliteit en
      registratiekenmerken van die vaartuigen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.c
    text: |-
      indien het verkenningsonderzoek met gebruikmaking van luchtvaartuigen zal worden verricht, de aard en de
      nationaliteits- en registratiekenmerken van die luchtvaartuigen, zomede de plaatsen, waar zij zullen worden
      gestationeerd en vanwaar de vluchten zullen worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.d
    text: het gebied, waarin en de lijnen, waarlangs de waarnemingen zullen worden verricht;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.e
    text: de data, waarop het verkenningsonderzoek zal worden verricht;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.1.f
    text: |-
      naam, voornamen, beroep en woon- en verblijfplaats van de leider der werkzaamheden en, indien ontplofbare stoffen
      zullen worden gebruikt, van de verantwoordelijke schietmeester.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: '18.2'
    text: 'Gelijktijdig met de in het eerste lid bedoelde mededeling moet eveneens:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.2.a
    text: |-
      een schriftelijke mededeling van de in dat lid onder *a*-*e* bedoelde gegevens worden gedaan aan de Chef van de
      Marinestaf, de Commandant der Zeemacht in Nederland en het Hoofd van de Afdeling Hydrografie van het Ministerie
      van Defensie;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.2.b
    text: |-
      indien het verkenningsonderzoek met gebruikmaking van luchtvaartuigen zal worden verricht, een schriftelijke
      mededeling van de in dat lid onder *a, c, d* en *e* bedoelde gegevens worden gedaan aan de directeur-
      hoofdinspecteur van de divisie Luchtvaart van de Inspectie Verkeer en Waterstaat en de Chef van de Luchtmachtstaf;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: 18.2.c
    text: |-
      indien bij het verkenningsonderzoek ontplofbare stoffen in, op of boven het continentaal plat tot ontploffing
      zullen worden gebracht, een schriftelijke mededeling van de in dat lid onder *a-e* bedoelde gegevens worden gedaan
      aan de houder van de concessie bedoeld in artikel 3 van de Wet op de telecommunicatievoorzieningen (*Stb.* 1988,
      520) en de Directeur-Generaal voor de Landinrichting, Grond- en Bosbeheer.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: '18.3'
    text: |-
      De in het eerste en tweede lid bedoelde mededelingen moeten vergezeld gaan van een kaart of schetstekening, waarop
      het in het eerste lid onder *d* bedoelde gebied, zomede de daar bedoelde lijnen zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: '18.4'
    text: |-
      Indien bij een verkenningsonderzoek met gebruikmaking van vaartuigen een kabel van een grotere lengte dan 1½
      zeemijl door het water zal worden gesleept, moet hiervan gelijktijdig met de in het eerste lid bedoelde mededeling
      opgave worden gedaan aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: '18.5'
    text: |-
      Van wijzigingen in de in het eerste lid bedoelde gegevens moet onverwijld schriftelijk mededeling worden gedaan aan
      de Inspecteur-Generaal der Mijnen. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel18
  - number: '19.1'
    text: |-
      Bij een verkenningsonderzoek gebruikte werktuigen, werktuigdelen, gereedschappen en kabels moeten voldoen aan de
      eis van goed en veilig werk en in goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel19
  - number: '19.2'
    text: |-
      Bij een verkenningsonderzoek gebruikte werktuigen moeten zodanig zijn ingericht, opgesteld en beschut en zodanig
      worden gebruikt, dat het gevaar, hetwelk zij voor de veiligheid van de bij een zodanig onderzoek werkzame personen
      kunnen opleveren, zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel19
  - number: '20.1'
    text: |-
      Bij een verkenningsonderzoek betrokken vaartuigen en luchtvaartuigen moeten zijn voorzien van doelmatige
      communicatiemiddelen, waarmede onder alle omstandigheden verbinding tussen die vaartuigen en luchtvaartuigen
      onderling mogelijk is, zomede met vissende vaartuigen door middel van de geëigende visserij-golflengten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel20
  - number: '20.2'
    text: |-
      Aan boord van elk der bij een verkenningsonderzoek betrokken vaartuigen of luchtvaartuigen dienen de in het eerste
      lid bedoelde communicatiemiddelen zodanig te zijn ingericht of zodanig te worden gebruikt, dat de andere bij dat
      onderzoek betrokken vaartuigen of luchtvaartuigen, zomede vissende vaartuigen tijdens de duur van de werkzaamheden
      onverwijld een verbinding met dat vaartuig of luchtvaartuig tot stand kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel20
  - number: '21'
    text: |-
      Bij een verkenningsonderzoek door middel van het in, op of boven het continentaal plat tot ontploffing brengen
      van ontplofbare stoffen betrokken vaartuigen moeten tijdens de werkzaamheden de seinen voeren, zoals vermeld in
      het algemeen bericht aan zeevarenden omtrent seismisch onderzoek, opgenomen in het Bericht aan Zeevarenden van de
      Afdeling Hydrografie van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel21
  - number: '22.1'
    text: |-
      Het is verboden een verkenningsonderzoek door middel van het in, op of boven het continentaal plat tot ontploffing
      brengen van ontplofbare stoffen te verrichten tussen zonsondergang en zonsopkomst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel22
  - number: '22.2'
    text: 'Het is voorts verboden zodanig verkenningsonderzoek te verrichten, indien en zolang:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel22
  - number: 22.2.a
    text: |-
      door hoge zeegang of anderszins bij de werkzaamheden gevaar voor de veiligheid van de bij het onderzoek werkzame
      personen kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel22
  - number: 22.2.b
    text: door mist of anderszins het zicht minder is dan de lengte van de bij de werkzaamheden te gebruiken kabel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel22
  - number: '22.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Landbouw en Visserij, van
      het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel22
  - number: '23.1'
    text: |-
      Verkenningsonderzoek door middel van het in, op of boven het continentaal plat tot ontploffing brengen van
      ontplofbare stoffen moet zodanig geschieden, dat tengevolge daarvan geen onderzeese kabels of pijpleidingen kunnen
      worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, ter bevordering van een goede
      uitvoering van het eerste lid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel23
  - number: '24.1'
    text: |-
      Het is verboden bij een verkenningsonderzoek binnen een door Onze Minister, in overeenstemming met Onze Minister
      van Landbouw en Visserij, te bepalen afstand van vissende vaartuigen of van uitstaand vistuig, dan wel in de
      nabijheid van een visschool ontplofbare stoffen in, op of boven het continentaal plat tot ontploffing te brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel24
  - number: '24.2'
    text: |-
      Bij een verkenningsonderzoek door middel van het in, op of boven het continentaal plat tot ontploffing brengen van
      ontplofbare stoffen in gebruik zijnde vaartuigen of luchtvaartuigen moeten op tenminste een afstand als krachtens
      het eerste lid vastgesteld blijven van vissende vaartuigen en van uitstaand vistuig.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel24
  - number: '25.1'
    text: 'Bij een verkenningsonderzoek moeten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel25
  - number: 25.1.a
    text: |-
      de daarbij betrokken vaartuigen zijn uitgerust met een doelmatige apparatuur voor plaatsbepaling, zomede voor het
      opsporen van visscholen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel25
  - number: 25.1.b
    text: |-
      de daarbij betrokken luchtvaartuigen zijn uitgerust met een doelmatige apparatuur voor plaatsbepaling, zomede,
      indien bij het onderzoek ontplofbare stoffen worden gebruikt en Onze Minister, in overeenstemming met Onze Minister
      van Landbouw en Visserij, zulks verlangt, voor het opsporen van visscholen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel25
  - number: '25.2'
    text: |-
      Tijdens de werkzaamheden moeten, met gebruikmaking van de in het eerste lid bedoelde apparatuur, door terzake
      deskundige personen regelmatig met voldoende nauwkeurigheid de nodige waarnemingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel25
  - number: '26.1'
    text: |-
      Aan boord van vaartuigen en luchtvaartuigen, in gebruik bij een verkenningsonderzoek door middel van het in, op
      of boven het continentaal plat tot ontploffing brengen van ontplofbare stoffen, moeten voldoende personen aanwezig
      zijn, die in staat zijn vissende vaartuigen, drijvende netten, sleepnetten en vaste vistuigen waar te nemen en
      te onderkennen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel26
  - number: '26.2'
    text: |-
      Indien Onze Minister, in overeenstemming met Onze Minister van Landbouw en Visserij, zulks verlangt, moet een door
      hen aangewezen visserij-deskundige in staat worden gesteld een verkenningsonderzoek als in het eerste lid bedoeld
      aan boord van een daarbij in gebruik zijnd vaartuig of luchtvaartuig mede te maken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel26
  - number: '26.3'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing, indien bij het verkenningsonderzoek een andere methode van
      onderzoek wordt gevolgd, welke gevaar voor de veiligheid van of schade voor de visserij kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel26
  - number: '27'
    text: |-
      Van de aan de oppervlakte waarneembare uitwerking van het in, op of boven het continentaal plat bij een
      verkenningsonderzoek tot ontploffing brengen van ontplofbare stoffen op de levende rijkdommen van de zee moet
      aantekening worden gehouden in een register, dat desgevraagd aan de Directeur-Generaal voor de Landinrichting,
      Grond- en Bosbeheer ter inzage moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel27
  - number: 27a.1
    text: |-
      Van het verloop van een verkenningsonderzoek moet wekelijks een rapport worden opgemaakt, dat voldoende gegevens
      over dit verloop bevat.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel27a
  - number: 27a.2
    text: |-
      Binnen twee weken na de afsluiting van ieder weekrapport moet een afschrift daarvan worden toegezonden aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel27a
  - number: '28.1'
    text: |-
      Een opsporingsonderzoek of het winnen van delfstoffen mag niet anders geschieden dan overeenkomstig een aan de
      Inspecteur-Generaal der Mijnen toegezonden doelmatig, schriftelijk werkplan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel28
  - number: '28.2'
    text: |-
      Een werkplan kan zich niet uitstrekken over meer dan één kalenderjaar; het moet tenminste 30 dagen voordat met de
      desbetreffende werkzaamheden wordt aangevangen en overigens vóór 1 december van het aan het betrokken kalenderjaar
      voorafgaande jaar in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel28
  - number: '28.3'
    text: |-
      Een werkplan moet op verlangen van de Inspecteur-Generaal der Mijnen door tekeningen te zijnen genoegen worden
      toegelicht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel28
  - number: '29.1'
    text: |-
      Ingrijpende wijzigingen worden in een werkplan niet aangebracht, dan nadat hiervan schriftelijk mededeling is
      gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel29
  - number: '29.2'
    text: |-
      Indien onvoorziene omstandigheden een voorafgaande schriftelijke mededeling als in het eerste lid bedoeld niet
      toelaten, moet de Inspecteur-Generaal der Mijnen van de wijziging ten spoedigste telefonisch of anderszins
      mondeling in kennis worden gesteld, welke kennisgeving onverwijld schriftelijk moet worden bevestigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel29
  - number: '30'
    text: |-
      Wanneer de uitvoering van een werkplan gevaar voor de veiligheid van de bij het opsporingsonderzoek of het winnen
      van delfstoffen werkzame personen kan opleveren, moet dit op verlangen en ten genoegen van Onze Minister worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30
  - number: 30a.1
    text: |-
      Het is verboden zonder vergunning van Onze Minister op of boven het continentaal plat een mijnbouwinstallatie op te
      richten of in stand te houden ten behoeve van de winning van aardolie of aardgas, indien de te winnen hoeveelheid
      meer dan 500 000 kg aardolie of meer dan 500 000 m3 aardgas per dag bedraagt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30a
  - number: 30a.2
    text: De vergunning kan slechts in het belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30a
  - number: 30a.3
    text: |-
      De paragrafen 3.5.2 tot en met 3.5.5 van de [Algemene wet bestuursrecht][ref1] zijn van toepassing op de
      totstandkoming van het besluit omtrent de verlening van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '31.1'
    text: |-
      Van het voornemen om een mijnbouwinstallatie op of boven het continentaal plat te plaatsen moet tenminste twee
      weken voordat met de desbetreffende werkzaamheden wordt aangevangen schriftelijk mededeling worden gedaan aan Onze
      Minister, het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie, de Directeur-Generaal Scheepvaart
      en Maritieme Zaken, de Directeur-Generaal van de Rijkswaterstaat, de houder van de concessie bedoeld in artikel 3
      van de Wet op de telecommunicatievoorzieningen en de Inspecteur-Generaal der Mijnen, onder opgave van:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: 31.1.a
    text: |-
      de ligging van de plaats, waar de mijnbouwinstallatie zal worden geplaatst, uitgedrukt in geografische coördinaten,
      berekend volgens het stelsel van de Europese vereffening;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: 31.1.b
    text: de aard en de afmetingen van de mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: 31.1.c
    text: de datum, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: '31.2'
    text: |-
      Van wijziging van de in het eerste lid bedoelde gegevens dient onverwijld schriftelijk mededeling te worden gedaan
      aan degenen, aan wie de in dat lid bedoelde mededeling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: '31.3'
    text: |-
      Zodra een mijnbouwinstallatie op of boven het continentaal plat is geplaatst, moet met gebruikmaking van
      doelmatige apparatuur, door het verrichten van voldoende metingen of andere waarnemingen, een voldoend nauwkeurige
      plaatsbepaling van de installatie worden verricht. Het resultaat hiervan moet onverwijld schriftelijk worden
      medegedeeld aan Onze Minister, de Directeur-Generaal Scheepvaart en Maritieme Zaken, de Directeur-Generaal van
      de Rijkswaterstaat en de Inspecteur-Generaal der Mijnen, zomede, onder overlegging van voldoende op de verrichte
      waarnemingen betrekking hebbende gegevens, aan het Hoofd van de Afdeling Hydrografie van het Ministerie van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: '31.4'
    text: |-
      Het in artikel 56 ten aanzien van gegevens, die voor het vervaardigen van kaarten hebben gediend, bepaalde is van
      overeenkomstige toepassing op gegevens, welke verkregen zijn door waarnemingen als in het derde lid van dit artikel
      bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31
  - number: 31a.1
    text: |-
      De voorbereiding van de plaatsing van mijnbouwinstallaties moet zodanig worden uitgevoerd dat de veiligheid en de
      stabiliteit ervan gewaarborgd zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31a
  - number: 31a.2
    text: |-
      Bij het plaatsen van een als een geheel verplaatsbare mijnbouwinstallatie moet op doelmatige wijze de
      bodempenetratie als gevolg van dat plaatsen worden bepaald; hiervan dient een doelmatig rapport te worden
      opgesteld, dat onverwijld in afschrift moet worden overgelegd aan de Inspecteur-Generaal der Mijnen en de Directeur
      van de Rijks Geologische Dienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31a
  - number: 31a.3
    text: |-
      Een niet als een geheel verplaatsbare mijnbouwinstallatie mag niet op het continentaal plat worden geplaatst
      dan nadat door het instellen van een doelmatig onderzoek voldoende gegevens zijn verkregen met betrekking tot de
      bodemgesteldheid ter plaatse van oprichting der installatie; deze gegevens dienen tijdig vóór de plaatsing van
      de mijnbouwinstallatie te worden overgelegd aan de Inspecteur-Generaal der Mijnen, de Directeur-Generaal van de
      Rijkswaterstaat en de Directeur van de Rijks Geologische Dienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31a
  - number: 31a.4
    text: |-
      Het tweede lid geldt niet ten aanzien van door Onze Minister aangewezen, niet als een geheel verplaatsbare,
      mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel31a
  - number: '32.1'
    text: |-
      Bij het plaatsen van een mijnbouwinstallatie op of boven het continentaal plat moeten voldoende maatregelen worden
      genomen in het belang van de veiligheid en de gezondheid van de daarbij werkzame personen en van de scheepvaart.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel32
  - number: '32.2'
    text: |-
      Het plaatsen van een mijnbouwinstallatie op of boven het continentaal plat moet zodanig geschieden, dat geen
      onderzeese kabels of pijpleidingen kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel32
  - number: '32.3'
    text: Ten aanzien van het tweede lid is artikel 23, tweede lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel32
  - number: '33.1'
    text: |-
      Een mijnbouwinstallatie moet ten opzichte van de te verwachten windsterkte, golven en zeestromingen, alsook zo
      nodig met het oog op het aanleggen van vaartuigen of het landen van hefschroefvliegtuigen of andere luchtvaartuigen
      veilig zijn geplaatst, verankerd of op andere doelmatige wijze op haar plaats worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel33
  - number: '33.2'
    text: |-
      Tegen verzakken, verschuiven of afdrijven van een mijnbouwinstallatie moeten met gebruikmaking van doelmatige
      hulpmiddelen voldoende voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel33
  - number: '34.1'
    text: |-
      Een mijnbouwinstallatie moet voldoende sterk zijn om bij de maximaal toelaatbare belasting de op grond van
      windsterkte, golfslag en zeestroming te verwachten krachten te weerstaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.2'
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming, waarbij een of
      meer mijnbouwinstallaties in gebruik zijn, dienen ten aanzien van elk dier installaties te beschikken over een door
      een ter zake deskundige en door Onze Minister als zodanig erkende instelling of onderneming afgegeven verklaring,
      inhoudende dat de installatie aan het bij en krachtens het eerste lid bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.3'
    text: 'Door Onze Minister aangewezen mijnbouwinstallaties moeten:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: 34.3.a
    text: |-
      regelmatig, volgens een doelmatig schema over een door Onze Minister aan te geven aantal jaren, zomede
      overeenkomstig een jaarlijks inspectieplan, achtereenvolgens op de staat van onderhoud en de sterkte van de
      onderscheiden onderdelen der installatie aan een doelmatige inspectie worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: 34.3.b
    text: |-
      telkens na verloop van het aantal jaren als onder *a* bedoeld, binnen een door Onze Minister aan te geven termijn,
      aan een voldoende en doelmatig algeheel onderzoek betreffende de staat van onderhoud en de sterkte der installatie
      worden onderworpen; Onze Minister kan bepalen, dat het onderzoek moet worden verricht door een ter zake deskundige
      instelling of onderneming.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.4'
    text: |-
      Van een schema en een plan als in het derde lid, onder *a*, bedoeld dient tijdig een exemplaar aan de Inspecteur-
      Generaal der Mijnen te worden overgelegd. Indien Onze Minister van oordeel is, dat een inspectieplan niet aan
      redelijk te stellen eisen voldoet moet dit op zijn verlangen en tot zijn genoegen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.5'
    text: |-
      Van een inspectie of onderzoek als in het derde lid bedoeld moet zo spoedig mogelijk na de voltooiing daarvan een
      doelmatig rapport worden opgesteld, van welk rapport onverwijld een exemplaar aan de Inspecteur-Generaal der Mijnen
      dient te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.6'
    text: |-
      Nadat een onderzoek als in het derde lid, onder *b*, bedoeld is voltooid dienen de betrokken bestuurders te
      beschikken over een nieuwe, onverwijld na die voltooiing door een in het tweede lid bedoelde instelling of
      onderneming afgegeven, verklaring, inhoudende dat de installatie aan het bij en krachtens het eerste lid bepaalde
      voldoet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: '34.7'
    text: |-
      Een verklaring als in het tweede of zesde lid bedoeld moet in afschrift aan de Inspecteur-Generaal der Mijnen
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34
  - number: 34a.1
    text: |-
      Indien een mijnbouwinstallatie tengevolge van een kracht als in artikel 34, eerste lid, bedoeld, dan wel door
      aanvaring of anderszins beschadigd is of naar redelijk vermoeden beschadigd kan zijn moet zo spoedig mogelijk
      een doelmatig onderzoek worden ingesteld ter vaststelling van de beschadiging of vermoedelijke beschadiging;
      Onze Minister kan bepalen, dat het onderzoek moet worden verricht door een ter zake deskundige instelling of
      onderneming.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34a
  - number: 34a.2
    text: |-
      Van het instellen van een onderzoek als in het eerste lid bedoeld dient onverwijld schriftelijk mededeling te
      worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34a
  - number: 34a.3
    text: |-
      Van het resultaat van een onderzoek als in het eerste lid bedoeld moet zo spoedig mogelijk schriftelijk mededeling
      worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34a
  - number: 34b.1
    text: |-
      Indien een mijnbouwinstallatie of een daartoe behorende inrichting als bedoeld in artikel 1, eerste lid, onder
      *b*, tengevolge van beschadiging of anderszins niet meer voldoet aan het bij of krachtens artikel 34, eerste lid,
      bepaalde moet zij, tenzij de installatie of inrichting in haar geheel wordt verwijderd, na het zo nodig treffen
      van voorlopige voorzieningen, zo spoedig mogelijk op doelmatige wijze worden hersteld onderscheidenlijk moeten
      ten aanzien daarvan doelmatige voorzieningen worden getroffen, een en ander zodanig dat zij weder aan het bij en
      krachtens genoemd lid bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34b
  - number: 34b.2
    text: |-
      Werkzaamheden krachtens het eerste lid mogen niet anders geschieden dan overeenkomstig een aan de Inspecteur-
      Generaal der Mijnen toegezonden doelmatig schriftelijk werkprogramma.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34b
  - number: 34b.3
    text: |-
      Zodanig programma moet vergezeld gaan van een opgave van naam, voornamen, beroep en woon- of verblijfplaats van de
      leider der werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34b
  - number: 34b.4
    text: |-
      Het werkprogramma moet zo tijdig mogelijk, doch als regel niet later dan 24 uur vóór de aanvang der betrokken
      werkzaamheden, in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34b
  - number: 34b.5
    text: De artikelen 28, derde lid, 29 en 30 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34b
  - number: 34c.1
    text: |-
      Zodra werkzaamheden krachtens artikel 34*b*, eerste lid, zijn voltooid moet de betrokken mijnbouwinstallatie of
      inrichting door een ter zake deskundige instelling of onderneming aan een in artikel 34, derde lid, onder *b*,
      bedoeld onderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34c
  - number: 34c.2
    text: Artikel 34, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel34c
  - number: '35.1'
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming, waarbij een of
      meer mijnbouwinstallaties in gebruik zijn, dienen zich met het oog op de toepassing van het tweede en derde lid te
      verzekeren van de bijstand van het Koninklijk Nederlands Meteorologisch Instituut of een andere op meteorologisch
      en oceanografisch gebied deskundige instelling, die door Onze Minister als zodanig is erkend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '35.2'
    text: |-
      Bij het plaatsen en het verwijderen van een mijnbouwinstallatie, alsmede met betrekking tot bemande
      mijnbouwinstallaties dienen met het oog op de veiligheid van personen, die bij dat plaatsen of verwijderen werkzaam
      zijn, alsmede van de personen, die op de mijnbouwinstallatie werkzaam zijn of zullen zijn, bij het in het eerste
      lid bedoelde instituut of de daar bedoelde instelling voldoende meteorologische en oceanografische inlichtingen te
      worden ingewonnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '35.3'
    text: |-
      Met het oog op de veiligheid van de op een bemande mijnbouwinstallatie werkzame personen moeten op, aan of in de
      onmiddellijke nabijheid van die mijnbouwinstallatie op doelmatige plaatsen voldoende en doelmatige meteorologische
      en oceanografische waarnemingen worden verricht met gebruikmaking van door Onze Minister goedgekeurde apparatuur.
      Bij het verzoek om goedkeuring moet een terzake door het in het eerste lid bedoelde instituut of de daar bedoelde
      instelling uitgebracht advies worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '35.4'
    text: |-
      De in het derde lid bedoelde waarnemingen moeten worden verricht en de daar bedoelde apparatuur moet worden
      onderhouden door of onder toezicht van een terzake deskundig persoon.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '35.5'
    text: |-
      De gegevens, welke bij de in het derde lid bedoelde waarnemingen worden verkregen, moeten worden aangetekend in een
      register. Aan het in het eerste lid bedoelde instituut moet van die gegevens op doelmatige wijze mededeling worden
      gedaan in het register of een gewaarmerkt afschrift daarvan ter inzage worden afgegeven, een en ander op door het
      instituut te bepalen tijdstippen. Indien de bijstand wordt verleend door een andere instelling als in het eerste
      lid bedoeld, geldt bovendien een overeenkomstige verplichting ten behoeve van die instelling. Zodanige instelling
      stelt bedoelde tijdstippen niet vast dan na overleg met het instituut.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '35.6'
    text: Onze Minister kan van de voorgaande leden ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel35
  - number: '36'
    text: |-
      Een mijnbouwinstallatie moet zodanig zijn geconstrueerd, ingericht en worden onderhouden, dat wordt voldaan aan de
      eis van goed en veilig werk.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36
  - number: 36a.1
    text: 'Doelmatige maatregelen moeten worden genomen om:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: 36a.1.a
    text: |-
      de evacuatiestations en de veilige verzamelpunten te beschermen tegen warmte en rook, en, zoveel mogelijk, tegen de
      gevolgen van explosies;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: 36a.1.b
    text: de vluchtroutes van en naar de evacuatiestations en verzamelpunten te allen tijde bruikbaar te laten blijven;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: 36a.1.c
    text: |-
      de evacuatiestations en de veilige verzamelpunten gemakkelijk bereikbaar te laten zijn vanuit de
      verblijfsaccomodatie en de werkruimten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: 36a.2
    text: |-
      De in het eerste lid bedoelde maatregelen moeten zodanig zijn dat dat ze de arbeiders lang genoeg bescherming
      bieden om, indien nodig, in alle veiligheid een evacuatie- en reddingsoperatie te kunnen organiseren en uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: 36a.3
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen moet een van de in het eerste lid bedoelde
      beschermde plaatsen zijn voorzien van afstandsbedieningssystemen voor noodgevallen zoals bedoeld in artikel 39*b*
      en van een communicatiesysteem waarmee een verbinding met de vaste wal en met hulpdiensten kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel36a
  - number: '37.1'
    text: |-
      De dekken van een mijnbouwinstallatie moeten door een doelmatige verschansing of een doelmatig relingwerk zijn
      omgeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel37
  - number: '37.2'
    text: Langs trappen en loopgangen moet een doelmatige bescherming zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel37
  - number: '38'
    text: De dekken van een mijnbouwinstallatie moeten zodanig zijn ingericht, dat overkomend water voldoende kan afvloeien.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel38
  - number: '39.1'
    text: |-
      Plaatsen, waar arbeid wordt of moet worden verricht of waar arbeiders, al dan niet in verband met hun arbeid,
      aanwezig plegen te zijn, moeten bereikt kunnen worden en verlaten kunnen worden via vluchtwegen en nooduitgangen
      die via de kortste weg leiden naar de open lucht, een veiligheidszone, een veilig verzamelpunt of een veilig
      evacuatiestation.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde plaatsen alsmede de wegen en doorgangen tot het bereiken en verlaten van die plaatsen
      moeten zo mogelijk voldoende ruim zijn en worden vrij gehouden van al hetgeen de de arbeid of de doorgang kan
      belemmeren of aanleiding kan geven tot ongevallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.3'
    text: Bij gevaar moeten alle werkplekken snel en optimaal veilig door de arbeiders kunnen worden ontruimd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.4'
    text: |-
      Het aantal, de locatie en de afmetingen van de vluchtwegen en de nooduitgangen zijn afhankelijk van het gebruik,
      de uitrusting en de afmetingen van de arbeidsplaatsen, alsmede van het maximum aantal personen dat zich op deze
      plaatsen kan ophouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.5'
    text: |-
      De woon- en verblijfsruimten moeten ten minste twee afzonderlijke nooduitgangen hebben, die zover mogelijk van
      elkaar zijn gelegen en uitkomen in een veiligheidszone, een veilig verzamelpunt of een veilig evacuatiestation.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.6'
    text: |-
      Bij het uitvallen van de verlichting moeten de vluchtwegen en nooduitgangen die verlichting behoeven met een
      voldoende sterke noodverlichting zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.7'
    text: Voor zover daartoe aanleiding bestaat, moeten voorzieningen zijn getroffen tegen glijden, struikelen of vallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: '39.8'
    text: |-
      Trappen, vaste ladders en laadplatforms, moeten zodanig berekend, gedimensioneerd en gelegen zijn dat zij
      gemakkelijk, veilig en overeenkomstig hun bestemming kunnen worden gebruikt en de arbeiders geen enkel risico
      lopen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39
  - number: 39a.1
    text: |-
      Plaats, aantal en afmetingen van deuren en poorten en de materialen waarvan zij zijn vervaardigd, moeten worden
      bepaald door de aard en het gebruik van de lokalen of ruimten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.2
    text: |-
      Deuren van nooduitgangen moeten naar buiten kunnen worden geopend of, wanneer dit niet mogelijk is schuifdeuren
      zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.3
    text: |-
      Deuren op het traject van vluchtwegen moeten gemarkeerd zijn. Zij mogen niet op slot zijn of op zodanige wijze
      gesloten zijn dat zij niet gemakkelijk en onmiddellijk kunnen worden geopend door iedereen die ze in geval van nood
      zou moeten gebruiken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.4
    text: |-
      Klapdeuren en -poorten moeten transparant zijn of van transparante panelen zijn voorzien. Op de transparante deuren
      moet op ooghoogte een signalering zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.5
    text: |-
      Wanneer de transparante of lichtdoorlatende oppervlakken van deuren en poorten niet van veiligheidsmateriaal zijn
      vervaardigd en als het gevaar bestaat dat werknemers gewond raken als een deur of een poort breekt, moeten deze
      oppervlakken tegen indrukken worden beveiligd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.6
    text: |-
      Schuifdeuren moeten voorzien zijn van een veiligheidssysteem waardoor zij niet uit hun rails kunnen lopen of
      onverwacht kunnen omvallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.7
    text: |-
      Deuren en poorten die naar boven toe opengaan, moeten voorzien zijn van een veiligheidssysteem waardoor zij niet
      onverwacht kunnen terugvallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.8
    text: |-
      In de onmiddellijke nabijheid van poorten die hoofdzakelijk voor het verkeer van voertuigen zijn bestemd moeten
      zich, tenzij de doorgang voor voetgangers veilig is, deuren voor voetgangers bevinden die duidelijk zichtbaar zijn
      gesignaleerd en voortdurend vrij moeten blijven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.9
    text: |-
      Automatische deuren en poorten moeten zodanig functioneren dat zij voor de arbeiders geen risico’s opleveren. Zij
      moeten zijn uitgerust met gemakkelijk herkenbare en toegankelijke noodstopvoorzieningen en moeten ook met de hand
      kunnen worden geopend, tenzij ze bij een energiestoring automatisch opengaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39a.10
    text: |-
      Wanneer kettingen of soortgelijke voorzieningen worden gebruikt om te verhinderen dat een bepaalde ruimte wordt
      betreden, moeten de kettingen of soortgelijke voorzieningen goed zichtbaar zijn en op doelmatige wijze worden
      voorzien van verbods- of waarschuwingsborden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39a
  - number: 39b
    text: |-
      Ramen en andere voorzieningen voor licht en voor luchtverversing die geopend, geregeld of beveiligd kunnen worden,
      moeten op zodanige wijze geconstrueerd zijn dat deze handelingen op veilige wijze kunnen worden uitgevoerd. In
      geopende stand mogen zij geen gevaar opleveren voor de arbeiders. Ramen en andere voorzieningen voor licht en voor
      luchtverversing moeten zonder gevaar kunnen worden schoongemaakt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39b
  - number: 39c.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet elke bemande arbeidsplaats zijn
      uitgerust met:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39c
  - number: 39c.1.a
    text: |-
      een audiovisueel systeem waarmee een alarmmelding zonodig kan worden doorgestuurd naar elk bemand deel van de
      arbeidsplaats;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39c
  - number: 39c.1.b
    text: |-
      een luidsprekersysteem dat duidelijk kan worden gehoord op alle delen van de installatie waar zich vaak arbeiders
      ophouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39c
  - number: 39c.2
    text: |-
      De in het eerste lid bedoelde systemen moeten in geval van nood operationeel kunnen blijven. Het
      luidsprekersysteem moet worden aangevuld met communicatiesystemen die niet afhankelijk zijn van kwetsbare
      stroomvoorzieningsinstallaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39c
  - number: 39c.3
    text: De voorzieningen voor het slaan van alarm moeten op doelmatige plaatsen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel39c
  - number: '30.1'
    text: |-
      Hefschroefvliegtuigen of andere luchtvaartuigen mogen slechts op een mijnbouwinstallatie landen of daarvan
      opstijgen, indien daarvoor een doelmatig ingericht dek beschikbaar is, met gebruikmaking waarvan dit veilig kan
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30
  - number: '30.2'
    text: Op een bemande mijnbouwinstallatie moet een dek als in het eerste lid bedoeld aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30
  - number: '30.3'
    text: |-
      Het is verboden om zonder een verklaring als bedoeld in artikel 40*a*, eerste lid, van een zodanig dek gebruik
      te maken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30
  - number: '30.4'
    text: Onze Minister kan van het tweede lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel30
  - number: 40a.1
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming, waarbij een
      of meer mijnbouwinstallaties in gebruik zijn, waarop een dek als bedoeld in artikel 40, eerste lid, aanwezig is,
      dienen ten aanzien van elk van die installaties te beschikken over een door de directeur-hoofdinspecteur van de
      divisie Luchtvaart van de Inspectie Verkeer en Waterstaat afgegeven verklaring, inhoudende dat het dek op die
      installatie aan het bij en krachtens artikel 40, eerste lid, bepaalde voldoet. De geldigheid van de verklaring
      verloopt 14 maanden na de dag waarop de verklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.2
    text: |-
      Een dek als bedoeld in artikel 40, eerste lid, moet eenmaal per jaar op de staat van onderhoud en het veilig
      gebruik aan een doelmatige inspectie worden onderworpen. Deze inspectie wordt uitgevoerd door een ter zake
      deskundige en door Onze Minister in overeenstemming met Onze Minister van Verkeer en Waterstaat als zodanig erkende
      instelling of onderneming. Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat,
      bij nadere regelen vaststellen aan welke voorwaarden een instelling of onderneming moet voldoen om erkenning als
      bedoeld in de vorige volzin te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.3
    text: |-
      De door een erkende instelling of onderneming als bedoeld in het tweede lid uit te voeren inspectie moet geschieden
      overeenkomstig een tevoren aan de directeur-hoofdinspecteur van de divisie Luchtvaart van de Inspectie Verkeer en
      Waterstaat overgelegd inspectieplan. Indien de directeur-hoofdinspecteur van de divisie Luchtvaart van de Inspectie
      Verkeer en Waterstaat van oordeel is, dat een inspectieplan niet aan redelijk te stellen eisen voldoet, moet dit op
      zijn verlangen en tot zijn genoegen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.4
    text: |-
      Van een inspectie als in het tweede lid bedoeld moet zo spoedig mogelijk na de voltooiing daarvan een doelmatig
      rapport worden opgesteld, van welk rapport onverwijld een exemplaar aan de Inspecteur-Generaal der Mijnen en
      aan de directeur-hoofdinspecteur van de divisie Luchtvaart van de Inspectie Verkeer en Waterstaat dient te
      worden toegezonden. De erkende instelling of onderneming, bedoeld in het tweede lid, adviseert de directeur-
      hoofdinspecteur van de divisie Luchtvaart van de Inspectie Verkeer en Waterstaat voor de afgifte van de in het
      eerste lid bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.5
    text: |-
      Nadat een inspectie als in het tweede lid bedoeld is voltooid, geeft de directeur-hoofdinspecteur van de divisie
      Luchtvaart van de Inspectie Verkeer en Waterstaat aan de betrokken bestuurders onverwijld een nieuwe verklaring af,
      inhoudende dat het dek aan het bij en krachtens artikel 40, eerste lid, bepaalde voldoet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.6
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, bij nadere regelen bepalen, dat
      voor de afgifte van de eerste verklaring voor een bepaalde mijnbouwinstallatie in die regelen aan te geven gegevens
      aan de directeur-hoofdinspecteur van de divisie Luchtvaart van de Inspectie Verkeer en Waterstaat moeten worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40a.7
    text: |-
      Een verklaring als in het eerste of vijfde lid bedoeld moet in afschrift aan de Inspecteur-Generaal der Mijnen
      worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40a
  - number: 40b.1
    text: |-
      Op een mijnbouwinstallatie, waarop een dek als bedoeld in artikel 40, eerste lid, aanwezig is, moet een doelmatig
      ingericht register over de verrichtingen met hefschroefvliegtuigen aanwezig zijn en worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40b
  - number: 40b.2
    text: |-
      Indien de verrichtingen met hefschroefvliegtuigen worden geleid vanaf een andere mijnbouwinstallatie dan die waarop
      het in het eerste lid bedoelde dek aanwezig is, mag, in afwijking van het eerste lid, het register aanwezig zijn en
      worden bijgehouden op de mijnbouwinstallatie waar vanaf de verrichtingen worden geleid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel40b
  - number: '41.1'
    text: 'Een mijnbouwinstallatie moet van zonsondergang tot zonsopkomst van de volgende lichten zijn voorzien:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: 41.1.a
    text: |-
      een of meer witte lichten van zodanige sterkte, dat de veiligheid van de scheepvaart en van de op de
      mijnbouwinstallatie werkzame personen zoveel mogelijk is gewaarborgd, en welke zodanig zijn ingericht en geplaatst,
      dat ongeacht vanuit welke richting de installatie wordt genaderd, tenminste één licht zichtbaar is; deze lichten
      moeten synchroon branden en dienen een Morse-karakter te hebben overeenkomend met dat van de Morse-letter U, met
      een periode van 15 seconden, verdeeld als volgt: helder ½ seconde, duister ½ seconde, helder ½ seconde, duister ½
      seconde, helder 1½ seconde, duister 11½ seconde;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: 41.1.b
    text: |-
      indien een mijnbouwinstallatie een grootste horizontale afmeting heeft van meer dan 15 meter, op de uiteinden van
      de installatie vaste, rondom zichtbare, witte lichten van zodanige sterkte, dat de omtrek van die installatie op
      zodanige afstand kan worden waargenomen, dat het gevaar voor aanvaring zoveel mogelijk wordt voorkomen, tenzij de
      onder *a* bedoelde lichten op die uiteinden zijn geplaatst;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: 41.1.c
    text: |-
      indien een mijnbouwinstallatie een hoogte heeft van meer dan 30 meter boven gemiddeld hoog water, op het hoogste
      punt van de installatie een vast, rood licht van een sterkte van tenminste 10 candelas, dat zichtbaar is vanuit
      ieder punt boven de horizon, en indien de installatie hoger is dan 45 meter, bovendien halverwege tussen genoemd
      licht en het zee-oppervlak een zodanig aantal vaste, rode lichten van dezelfde sterkte, dat vanuit ieder punt boven
      de horizon tenminste één daarvan zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, nadere regelen stellen ten
      aanzien van de inrichting, sterkte en plaatsing van de lichten, bedoeld in het eerste lid onder *a* en *b*, zomede
      ten aanzien van de inrichting van de lichten, bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: '41.3'
    text: |-
      De in het eerste lid bedoelde lichten moeten zodanig zijn ingericht en worden gevoed, dat hun ononderbroken werking
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: '41.4'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, van het eerste lid ontheffing
      verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel41
  - number: '42.1'
    text: 'Een mijnbouwinstallatie moet zijn voorzien:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: 42.1.a
    text: |-
      van een of meer apparaten, waarmede geluidssignalen kunnen worden gegeven van zodanige sterkte, dat de veiligheid
      van de scheepvaart en van de op de mijnbouwinstallatie werkzame personen zoveel mogelijk is gewaarborgd, en
      welke zodanig zijn ingericht en geplaatst, dat ongeacht vanuit welke richting de installatie wordt genaderd, het
      geluidssignaal hoorbaar is;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: 42.1.b
    text: |-
      van een radarreflector, indien Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat, zulks
      verlangt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: '42.2'
    text: |-
      Indien de meteorologische zichtbaarheid minder is dan twee zeemijlen, moet met de apparaten, bedoeld in het eerste
      lid onder *a*, een geluidssignaal worden gegeven, waarvan het karakter overeenkomt met dat van de Morse-letter U,
      met een periode van 30 seconden, verdeeld als volgt: signaal 3/4 seconde, stilte 1 seconde, signaal 3/4 seconde,
      stilte 1 seconde, signaal 2½ seconde, stilte 24 seconden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: '42.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, nadere regelen stellen ten
      aanzien van de inrichting, sterkte en plaatsing van de apparaten, bedoeld in het eerste lid onder a.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: '42.4'
    text: |-
      De in het eerste lid, onder *a*, bedoelde apparaten moeten zodanig worden gevoed, dat hun ononderbroken werking
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: '42.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, van het eerste lid, onder *a*,
      ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel42
  - number: '43.1'
    text: |-
      De bestuurders van een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming moeten voor elke
      bij die onderneming in gebruik zijnde mijnbouwinstallatie in het bezit zijn van een verklaring van de Directeur
      van de technische dienst van ’s Rijks Kustverlichting, waaruit blijkt dat ten tijde, dat zij werd afgegeven, was
      voldaan aan de bij en krachtens de artikelen 41 en 42 gegeven voorschriften. In een zodanige verklaring kan worden
      bepaald, dat zij slechts geldig is tot een daarin aangegeven tijdstip.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel43
  - number: '43.2'
    text: |-
      Ter verkrijging van de in het eerste lid bedoelde verklaring dienen aan de Directeur van de technische dienst van
      ’s Rijks Kustverlichting de door hem te bepalen gegevens te worden verstrekt. Tevens dient aan hem, indien hij
      zulks verlangt, de desbetreffende apparatuur of een kenmerkend monster daarvan voor onderzoek op een door hem te
      bepalen plaats ter beschikking te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel43
  - number: '43.3'
    text: De verklaring moet op een doelmatige plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel43
  - number: '43.4'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, van het eerste lid ontheffing
      verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel43
  - number: '44'
    text: |-
      Op het boven het wateroppervlak uitstekende deel van een mijnbouwinstallatie moeten op doelmatige plaatsen door
      Onze Minister vastgestelde doelmatige herkenningstekens op voldoend duidelijke wijze zijn aangebracht. Tenminste
      een van deze herkenningstekens moet, ongeacht vanuit welke richting de installatie wordt genaderd, zichtbaar zijn,
      zowel bij dag als bij nacht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel44
  - number: '45.1'
    text: |-
      Een bemande mijnbouwinstallatie moet zijn voorzien van doelmatige communicatiemiddelen, waarmede onder alle
      omstandigheden verbinding met de vaste wal en met vaartuigen en luchtvaartuigen, welke ten dienste van een
      opsporingsonderzoek of het winnen van delfstoffen in gebruik zijn, mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel45
  - number: '45.2'
    text: |-
      Op een mijnbouwinstallatie, niet zijnde een bemande mijnbouwinstallatie, mogen geen personen aanwezig zijn, tenzij
      zij kunnen beschikken over een doelmatig communicatiemiddel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel45
  - number: '45.3'
    text: |-
      De op een mijnbouwinstallatie ten behoeve van een opsporingsonderzoek op het winnen van delfstoffen aanwezige
      communicatiemiddelen moeten door voldoend deskundig personeel worden bediend en op doelmatige wijze worden
      gebruikt. Dit personeel moet op doelmatige wijze een radiodagboek bijhouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel45
  - number: '46'
    text: |-
      Het plaatsen van materieel of materialen op een mijnbouwinstallatie moet zodanig geschieden, dat de tengevolge
      daarvan optredende krachten en spanningen zonder bezwaar in de constructie van de installatie kunnen worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel46
  - number: '47.1'
    text: |-
      Op een mijnbouwinstallatie moet, ter plaatse waar de arbeid wordt verricht, een verlichting aanwezig zijn,
      welke voor deze arbeid voldoende en doelmatig is. Er moet, voor zover mogelijk, voldoende daglicht kunnen
      binnenkomen en er dienen, rekening houdend met de klimatologische omstandigheden, de nodige voorzieningen voor een
      adequate kunstverlichting aanwezig te zijn om de veiligheid en de gezondheid van de arbeiders te beschermen. De
      verlichtingsinstallaties in werkruimten en verbindingswegen moeten zodanig zijn aangebracht dat de verlichting geen
      ongevallenrisico’s voor de arbeiders oplevert.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: '47.2'
    text: |-
      Portalen, trappen, loopgangen en andere doorgangen, was-, bad- en kleedgelegenheden, magazijnen, bergplaatsen,
      inschepingsplaatsen en vrije dekruimten op een mijnbouwinstallatie moeten op tijden, dat personen daarvan gebruik
      moeten maken, voor dat gebruik voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: '47.3'
    text: |-
      Portalen, trappen, loopgangen en andere doorgangen, zomede inschepingsplaatsen en vrije dekruimten op een bemande
      mijnbouwinstallatie moeten voortdurend voldoende en doelmatig zijn verlicht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: '47.4'
    text: |-
      In recreatie-, schaft- en slaapverblijven op een mijnbouwinstallatie moet een voldoende en doelmatige verlichting
      zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: '47.5'
    text: |-
      Privaten en urinoirs op een mijnbouwinstallatie moeten zodanig zijn verlicht, dat zij behoorlijk zijn te gebruiken
      en dat goed kan worden waargenomen, of zij in zindelijke staat verkeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: '47.6'
    text: |-
      Arbeidsplaatsen waar arbeiders bij het uitvallen van de kunstverlichting aan bijzondere risico’s zijn blootgesteld,
      moeten met een doelmatige en voldoende sterke noodverlichting zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47
  - number: 47a.1
    text: |-
      Verlichtingsinstallaties moeten zodanig ontworpen zijn dat operationele bedieningsruimten, vluchtwegen,
      inschepingszones en gevaarlijke zones verlicht blijven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47a
  - number: 47a.2
    text: |-
      Wanneer arbeidsplaatsen slechts bij gelegenheid bemand zijn, geldt hetgeen in het eerste lid is voorgeschreven
      slechts voor de duur van de aanwezigheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47a
  - number: 47b.1
    text: |-
      De oppervlakte, de hoogte en het luchtvolume van de werkruimten moeten toereikend zijn om de arbeiders in staat te
      stellen hun werk zonder gevaar voor veiligheid en gezondheid uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47b
  - number: 47b.2
    text: |-
      De afmetingen van het vrije oppervlak van de werkplek moeten zodanig zijn dat de arbeider bij zijn taakuitoefening
      over voldoende bewegingsvrijheid beschikt en zijn werk op veilige wijze kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel47b
  - number: '48'
    text: |-
      De afvoer van gassen, vloeistoffen en vaste stoffen vanaf een mijnbouwinstallatie moet op doelmatige wijze
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel48
  - number: '49'
    text: |-
      Voor de toepassing van het bij of krachtens dit hoofdstuk bepaalde wordt verstaan onder: *olie:* minerale olie in
      elke vorm; *oliehoudend mengsel:* een mengsel, dat olie in welk gehalte dan ook bevat; *sanitair afval:*
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49
  - number: 49.a
    text: spoelwater en ander afval, afkomstig van privaten en urinoirs;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49
  - number: 49.b
    text: spoelwater, afkomstig uit verblijven voor de voorlopige verzorging van gewonden en zieken;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49
  - number: 49.c
    text: |-
      ander afvalwater, indien vermengd met spoelwater als onder *a* of *b* bedoeld; *vuilnis:* etensresten, met
      uitzondering van verse vis of gedeelten daarvan, alle soorten huishoudelijke afvalstoffen en vast afval,
      voortvloeiende uit de bedrijfsvoering; *lozen:* het al of niet opzettelijk in zee doen terecht- of vrijkomen van
      stoffen, zoals door het storten, pompen, doen wegvloeien of doen ontsnappen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49
  - number: 49a.1
    text: Het is verboden olie, een oliehoudend mengsel, sanitair afval of vuilnis vanaf een mijnbouwinstallatie te lozen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2
    text: 'Het eerste lid geldt niet ten aanzien van het lozen van:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.a
    text: |-
      een oliehoudend mengsel in de gevallen en op de wijze als door Onze Minister, in overeenstemming met Onze Ministers
      van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, bepaald;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.b
    text: 'sanitair afval:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.b.1°
    text: |-
      vanaf een vast opgestelde niet-bemande mijnbouwinstallatie of een vast opgestelde bemande mijnbouwinstallatie,
      waarop niet meer dan tien personen aanwezig plegen te zijn;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.b.2°
    text: |-
      vanaf een vast opgestelde permanent bemande mijnbouwinstallatie, waarop meer dan 50 personen aanwezig plegen te
      zijn of een als een geheel verplaatsbare mijnbouwinstallatie, indien dit afval is afgebroken door middel van een
      biologisch zuiveringssysteem;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.b.3°
    text: |-
      vanaf een andere mijnbouwinstallatie, indien dit afval is behandeld door middel van een mechanisch
      vermalingssysteem;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.2.c
    text: |-
      vuilnis, voor zover bestaande uit etensresten, in de gevallen en op de wijze als door Onze Minister, in
      overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.3
    text: 'Het eerste lid geldt evenmin, indien het lozen:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.3.a
    text: noodzakelijk is om de veiligheid van de installatie te verzekeren dan wel om mensenlevens te redden;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.3.b
    text: |-
      het gevolg is van schade aan de installatie of aan de uitrusting daarvan, indien na het ontstaan van de schade of
      na de ontdekking van de lozing alle redelijke voorzorgen zijn getroffen om de verdere lozing te voorkomen of tot
      een minimum te beperken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.4
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, nadere regelen stellen met betrekking tot de in het tweede en derde lid
      bedoelde lozingen omtrent:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.4.a
    text: de registratie van toegestane lozingen van oliehoudende mengsels;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49a.4.b
    text: de controle op het oliegehalte van de toegestane lozingen van oliehoudende mengsels.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49a
  - number: 49b.1
    text: |-
      Op een mijnbouwinstallatie moeten met betrekking tot het met het normale gebruik van de installatie samenhangende
      of daaruit voortvloeiende lozen van andere dan in artikel 49*a*, eerste lid, bedoelde afvalstoffen of
      verontreinigende dan wel schadelijke stoffen zodanige maatregelen worden genomen dat verontreiniging van de zee
      zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49b.2
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, nadere regelen stellen met betrekking tot de in het eerste lid bedoelde
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49b.3
    text: 'De in het tweede lid bedoelde regelen kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49b.3.a
    text: een verbod tot lozing, zo nodig met een mogelijkheid van ontheffing;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49b.3.b
    text: |-
      voorschriften inzake de bewerking die een stof voor lozing moet ondergaan, de hoeveelheid te lozen stof, en de
      plaats en de wijze van lozing;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49b.3.c
    text: voorschriften omtrent de registratie van stoffen die worden geloosd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49b
  - number: 49ba.1
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, ter voorkoming van verontreiniging van de zee regelen stellen met betrekking
      tot het gebruik van bepaalde stoffen op een mijnbouwinstallatie.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49ba
  - number: 49ba.2
    text: 'De in het eerste lid bedoelde regelen kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49ba
  - number: 49ba.2.a
    text: een verbod tot gebruik, zo nodig met een mogelijkheid van ontheffing;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49ba
  - number: 49ba.2.b
    text: voorschriften inzake de hoeveelheid te gebruiken stof en de wijze van gebruik;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49ba
  - number: 49ba.2.c
    text: voorschriften omtrent de registratie van stoffen die worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49ba
  - number: 49c.1
    text: Een mijnbouwinstallatie moet ter voorkoming van verontreiniging van de zee doelmatig zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49c
  - number: 49c.2
    text: |-
      Door Onze Minister, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, aangewezen mijnbouwinstallaties dienen voldoende te zijn uitgerust om:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49c
  - number: 49c.2.a
    text: niet bij of krachtens de artikelen 49*a*, tweede lid, en 49*b* toegestane lozingen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49c
  - number: 49c.2.b
    text: |-
      elke krachtens artikel 49*a*, tweede lid, onder *a*, toegestane lozing van een oliehoudend mengsel doelmatig te
      registreren en op het oliegehalte te controleren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49c
  - number: 49d
    text: |-
      In geval olie dan wel een oliehoudend mengsel, sanitair afval, vuilnis of een stof als in artikel 49*b*, eerste
      lid, of artikel 49*ba*, eerste lid, bedoeld in strijd met het bepaalde bij of krachtens artikel 49*a*, 49*b*
      of 49*ba* in zee is terechtgekomen, moet van het voorval onverwijld op doelmatige wijze en met vermelding van
      voldoende gegevens mededeling worden gedaan aan Onze Minister, de Directeur-Generaal van de Rijkswaterstaat, de
      Directeur-Generaal voor de Milieuhygiëne en de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel49d
  - number: '50'
    text: |-
      Bij een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt ingesteld, dan wel
      delfstoffen worden gewonnen, moeten op doelmatige plaatsen aanwezig zijn doelmatige kaarten, al dan niet op
      doorzichtig materiaal getekend, waarop ten genoegen van het Hoofd van de Afdeling Hydrografie van het Ministerie
      van Defensie de ligging van het deel van het continentaal plat is aangegeven, waar bedoelde handelingen worden
      verricht, zomede de binnen dat deel voor kortere of langere duur aanwezige mijnbouwinstallaties met krachtens
      [artikel 27 van de Mijnwet continentaal plat][ref1] ingestelde veiligheidszones, onder aanduiding van de
      mijnbouwinstallaties of andere objecten, die als vaste punten voor het verrichten van metingen of andere
      waarnemingen dienst doen of waarop waarnemingstekens zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel27
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '27'
  - number: '51.1'
    text: |-
      De in artikel 50 bedoelde kaarten moeten op materiaal van duurzame kwaliteit worden vervaardigd. De schaal en de
      op de kaarten ter verduidelijking aan te brengen gegevens worden door Onze Minister, in overeenstemming met Onze
      Minister van Defensie, in overleg met de bestuurders van de betrokken mijnonderneming vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel51
  - number: '51.2'
    text: |-
      Op de kaarten moeten op doelmatige wijze op het stelsel van de Europese vereffening berustende coördinatenlijnen
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel51
  - number: '52.1'
    text: |-
      Van de in artikel 50 bedoelde kaarten moet een exemplaar aan het Hoofd van de Afdeling Hydrografie van het
      Ministerie van Defensie en de Inspecteur-Generaal der Mijnen worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel52
  - number: '52.2'
    text: |-
      De exemplaren van kaarten, welke aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie en aan
      de Inspecteur-Generaal der Mijnen zijn toegezonden, moeten elke zes maanden door de zorg van de bestuurders van de
      betrokken mijnonderneming worden bijgewerkt. Onze Minister kan, in overeenstemming met Onze Minister van Defensie,
      in bijzondere gevallen een kortere termijn vaststellen. Het bijwerken mag niet langer duren dan vier weken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel52
  - number: '52.3'
    text: |-
      In geval kaarten geheel of gedeeltelijk door nieuwe worden vervangen, blijven de vervangen exemplaren onder
      berusting van het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie en de Inspecteur-Generaal der
      Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel52
  - number: '53.1'
    text: |-
      Het vervaardigen en bijwerken van in artikel 50 bedoelde kaarten dient met voldoende nauwkeurigheid te geschieden
      door of vanwege terzake deskundige personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel53
  - number: '53.2'
    text: |-
      De aldus vervaardigde of bijgewerkte kaarten moeten door de betrokken deskundige persoon, zomede door de
      bestuurders van de betrokken mijnonderneming zijn ondertekend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel53
  - number: '53.3'
    text: |-
      Een deskundig persoon als in het eerste lid bedoeld is verplicht alle hem bij de uitoefening van zijn taak
      gebleken misstanden onmiddellijk ter kennis van de bestuurders van de betrokken mijnonderneming te brengen en deze
      kennisgeving schriftelijk te bevestigen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel53
  - number: '54'
    text: |-
      Wanneer blijkt, dat in de in artikel 50 bedoelde kaarten onnauwkeurigheden, fouten of nalatigheden voorkomen,
      moeten de door Onze Minister, in overeenstemming met Onze Minister van Defensie, aangegeven veranderingen en
      aanvullingen binnen een door hem vastgestelde termijn worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel54
  - number: '55.1'
    text: |-
      Ten dienste van het vervaardigen en bijwerken van in artikel 50 bedoelde kaarten moeten voldoende metingen en
      andere waarnemingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel55
  - number: '55.2'
    text: |-
      De in het eerste lid bedoelde waarnemingen moeten met gebruikmaking van doelmatige apparatuur en met voldoende
      nauwkeurigheid worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel55
  - number: '56.1'
    text: |-
      De gegevens van waarnemingen, die voor het vervaardigen van in artikel 50 bedoelde kaarten hebben gediend, moeten
      in registers worden vermeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel56
  - number: '56.2'
    text: |-
      De in het eerste lid bedoelde registers of gewaarmerkte afschriften daarvan en de in verband met waarnemingen
      gemaakte berekeningen moeten, nadat de in artikel 14 bedoelde termijn is verstreken, worden toegezonden aan het
      Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie. Zij worden in het archief opgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel56
  - number: '57'
    text: |-
      In geval een meting of andere waarneming vanwege het Hoofd van de Afdeling Hydrografie van het Ministerie
      van Defensie wordt verricht, zijn de bestuurders van de betrokken mijnonderneming verplicht de nodige hulp te
      verschaffen en desverlangd de bij hun onderneming voor het verrichten van waarnemingen voorhanden zijnde apparatuur
      beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel57
  - number: '58'
    text: |-
      Een boorinstallatie, met alles wat daartoe behoort, moet in veilige en deugdelijke staat verkeren en geschikt zijn
      voor het doel, waarvoor zij wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel58
  - number: '59.1'
    text: |-
      Een boring mag niet anders geschieden dan overeenkomstig een aan de Inspecteur-Generaal der Mijnen toegezonden
      doelmatig, schriftelijk boorprogramma. Dit programma moet vergezeld gaan van een opgave van naam, voornamen,
      beroep en woonplaats van de leider der werkzaamheden. In geval deze in het buitenland woonachtig is, dient zijn
      verblijfplaats in Nederland te worden opgegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel59
  - number: '59.2'
    text: |-
      Het boorprogramma moet tenminste vier weken vóór de aanvang der betrokken werkzaamheden in het bezit zijn van de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel59
  - number: '59.3'
    text: De artikelen 28, derde lid, 29 en 30 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel59
  - number: '60.1'
    text: |-
      Bij een boring moeten doelmatige maatregelen worden genomen om de verstoring van de aangetroffen geologische
      formaties zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel60
  - number: '60.2'
    text: |-
      Onze Minister kan van het eerste lid ontheffing verlenen, indien de voortgang van een boring of de winning van
      delfstoffen zulks noodzakelijk maakt of daardoor kan worden bespoedigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel60
  - number: '61'
    text: 'Bij een boring moeten doelmatige maatregelen worden genomen:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel61
  - number: 61.a
    text: ter voorkoming van een onnodig verloren gaan van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel61
  - number: 61.b
    text: |-
      ter vermijding van het binnendringen van vloeistoffen of gassen in geologische formaties, waardoor de winning van
      delfstoffen zou kunen worden geschaad.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel61
  - number: '62.1'
    text: Bij een boring moet elke serie der verbuizing over voldoende afstand doelmatig worden gecementeerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel62
  - number: '62.2'
    text: |-
      Ten aanzien van door Onze Minister aan te wijzen boringen moet na het inbouwen en cementeren van elke serie der
      verbuizing omtrent de deugdelijkheid daarvan door middel van doelmatige persproeven zekerheid zijn verkregen,
      alvorens de boring wordt voortgezet of het boorgat ten behoeve van het winnen van delfstoffen in gebruik wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel62
  - number: '62.3'
    text: |-
      Bij een boring als in het tweede lid bedoeld moet na het inbouwen van de eerste serie der verbuizing worden zorg
      gedragen voor een veilige afsluiting.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel62
  - number: '63'
    text: |-
      Indien bij een boring een andere delfstof wordt aangetroffen dan die welke doel van de boring is, moeten de
      boorwerkzaamheden op zodanige wijze worden verricht, dat in het belang van de bescherming van delfstoffen voldoende
      gegevens omtrent het betrokken delfstofvoorkomen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63
  - number: 63a.1
    text: |-
      Een boorgat mag niet ten behoeve van het winnen van delfstoffen in gebruik worden genomen dan nadat het daartoe
      deugdelijk is ingericht en afgewerkt, zomede van doeltreffende beveiligingen ter afsluiting is voorzien.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63a
  - number: 63a.2
    text: |-
      Onze Minister kan ten aanzien van door hem aangewezen boorgaten nadere regelen stellen met betrekking tot de
      inrichting, afwerking en beveiligingen als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63a
  - number: 63b.1
    text: |-
      Werkzaamheden in een bestaand boorgat, dan wel aan de inrichting, afwerking of beveiligingen als in artikel 63*a*,
      eerste lid, bedoeld, zoals nodig in verband met reparatie of onderhoud, moeten op doeltreffende wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63b
  - number: 63b.2
    text: |-
      Tenzij de onmiddellijke uitvoering in het belang van de veiligheid van de op de betrokken mijnbouwinstallatie
      werkzame personen noodzakelijk is, mogen bepaalde door Onze Minister aan te wijzen werkzaamheden als in het eerste
      lid bedoeld, ten aanzien van door hem daarbij aangegeven boorgaten, niet anders geschieden dan overeenkomstig een
      aan de Inspecteur-Generaal der Mijnen toegezonden doelmatig schriftelijk werkprogramma.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63b
  - number: 63b.3
    text: |-
      Het werkprogramma moet zo tijdig mogelijk, doch in ieder geval niet later dan vier weken vóór de aanvang van de
      betrokken werkzaamheden in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63b
  - number: 63b.4
    text: De artikelen 28, derde lid, 29, 30 en 59, eerste lid, tweede en derde volzin, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel63b
  - number: '64.1'
    text: |-
      Bij een boring dienen op de betrokken mijnbouwinstallatie aanwezig te zijn een doelmatig register, dat voldoende
      gegevens bevat betreffende het boorgat en aangaande de afsluiting daarvan, en een doelmatig, nauwkeurig
      bijgehouden, boorprofiel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel64
  - number: '64.2'
    text: |-
      Indien een boorgat ten behoeve van het winnen van delfstoffen wordt gebruikt dienen op de betrokken
      mijnbouwinstallatie of op een door Onze Minister goedgekeurde plaats elders aanwezig te zijn:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel64
  - number: 64.2.1°
    text: |-
      een doelmatig register, dat met het oog op bedoeld gebruik voldoende gegevens bevat betreffende: a. het boorgat,
      zomede voldoende gegevens betreffende: b. de inrichting en de afwerking van het boorgat, alsook aangaande de
      beveiligingen ter afsluiting daarvan, c. de verrichte werkzaamheden als in artikel 63*b*, eerste lid, bedoeld en
      d. de wijzigingen, welke het boorgat, dan wel de inrichting, de afwerking of een beveiliging ter afsluiting daarvan
      als gevolg van de verrichte werkzaamheden of anderszins heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel64
  - number: 64.2.2°
    text: |-
      het in het eerste lid bedoelde boorprofiel, dat voor wat betreft de wijzigingen daarin als gevolg van met
      betrekking tot het boorgat verrichte werkzaamheden nauwkeurig moet zijn bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel64
  - number: '65.1'
    text: |-
      Van het verloop van een boring en van werkzaamheden, aangewezen krachtens artikel 63*b*, tweede lid, ten aanzien
      van een daarbij aangegeven boorgat moet dagelijks een kort verslag worden opgemaakt, hetwelk onverwijld op
      doelmatige wijze ter kennis van de Inspecteur-Generaal der Mijnen dient te worden gebracht. Het verslag moet
      voldoende gegevens bevatten ten einde het verloop van de boring of de werkzaamheden te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel65
  - number: '65.2'
    text: |-
      Voorts moet van het verloop als in het eerste lid bedoeld maandelijks een rapport worden opgemaakt, hetwelk binnen
      zeven dagen na afloop van de betrokken maand in afschrift aan de Inspecteur-Generaal der Mijnen dient te worden
      toegezonden. Het rapport moet voldoende gegevens bevatten ten einde het verloop van de boring of de werkzaamheden
      te kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel65
  - number: '66.1'
    text: |-
      Van staking, beëindiging of hervatting van een boring moet onverwijld mededeling worden gedaan aan de Inspecteur-
      Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: '66.2'
    text: |-
      Na het beëindigen van een boring moeten aan de Inspecteur-Generaal der Mijnen zo spoedig mogelijk worden
      toegezonden:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: 66.2.a
    text: een exemplaar van het in artikel 64, eerste lid, bedoelde boorprofiel en
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: 66.2.b
    text: |-
      voldoende uit de boring verkregen andere gegevens, die van belang kunnen zijn voor de veiligheid van de bij een
      opsporingsonderzoek of het winnen van delfstoffen werkzame personen en voor de bescherming van delfstoffen, zomede,
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: 66.2.c
    text: |-
      indien het boorgat ten behoeve van het winnen van delfstoffen in gebruik zal worden genomen, een doelmatig rapport
      omtrent de inrichting, afwerking en beveiligingen als in artikel 63*b*, eerste lid, bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: '66.3'
    text: |-
      Indien na beëindiging van een boring het boorgat wordt gebruikt ten behoeve van het winnen van delfstoffen, moet
      van wijziging van het boorprofiel of van de in het tweede lid, onder *b*, bedoelde gegevens, dan wel van de in het
      aldaar onder *c* bedoelde rapport vermelde gegevens zo spoedig mogelijk schriftelijk kennis worden gegeven aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel66
  - number: '67'
    text: |-
      Doelmatige maatregelen moeten worden genomen om te voorkomen, dat de winning van delfstoffen, waarvan de
      aanwezigheid is aangetoond of wordt vermoed, wordt belemmerd of geschaad.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel67
  - number: '68.1'
    text: |-
      Een niet meer in gebruik zijnde mijnbouwinstallatie moet geheel worden verwijderd, zomede het bij het plaatsen of
      verwijderen dan wel als gevolg van het gebruik daarvan ter plaatse of in de naaste omgeving van de installatie op
      de zeebodem terechtgekomen schroot of ander materiaal, voor zover de aanwezigheid hiervan gevaar voor de veiligheid
      van de scheepvaart of de visserij kan opleveren. Bij het verrichten van de desbetreffende werkzaamheden moeten
      voldoende maatregelen worden genomen in het belang van de veiligheid van de daarmede belaste personen, van de
      scheepvaart en van de visserij, alsmede ter voorkoming van verontreiniging van de zee.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel68
  - number: '68.2'
    text: Onze Minister kan een termijn vaststellen, waarbinnen aan het eerste lid moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel68
  - number: '69.1'
    text: |-
      Van het voornemen om een mijnbouwinstallatie te verwijderen moet tenminste 24 uur voordat met de desbetreffende
      werkzaamheden wordt aangevangen mededeling worden gedaan aan de Inspecteur-Generaal der Mijnen en het Hoofd
      van de Afdeling Hydrografie van het Ministerie van Defensie, onder opgave van de ligging van de plaats, waar de
      mijnbouwinstallatie is geplaatst, uitgedrukt in geografische coördinaten, berekend volgens het stelsel van de
      Europese vereffening, alsmede van het tijdstip, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel69
  - number: '69.2'
    text: |-
      Van het voornemen om een door Onze Minister, in overeenstemming met Onze Minister van Verkeer en Waterstaat,
      aangewezen, niet als een geheel verplaatsbare, mijnbouwinstallatie te verwijderen moet bovendien tenminste een
      bij de aanwijzing te bepalen aantal dagen voordat met de desbetreffende werkzaamheden wordt aangevangen mededeling
      worden gedaan aan de Directeur-Generaal Scheepvaart en Maritieme Zaken, onder opgave van de in het eerste lid
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel69
  - number: '69.3'
    text: |-
      Indien een mijnbouwinstallatie is verwijderd, moet daarvan onverwijld schriftelijk mededeling worden gedaan
      aan Onze Minister, het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie, de Directeur-Generaal
      Scheepvaart en Maritieme Zaken en de Inspecteur-Generaal der Mijnen, onder opgave van de ligging van de plaats,
      waar de mijnbouwinstallatie was geplaatst, uitgedrukt in geografische coördinaten, berekend volgens het stelsel van
      de Europese vereffening.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel69
  - number: '70.1'
    text: 'Het is verboden een boorgat te verlaten voordat:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: 70.1.a
    text: |-
      voldoende maatregelen zijn genomen ter voorkoming van het optreden van gevaar voor de veiligheid van de scheepvaart
      en van de visserij, zomede ter voorkoming van verontreiniging van de zee;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: 70.1.b
    text: |-
      de delfstofhoudende lagen en de delfstofafzettingen, voor zover daaraan door water schade kan worden toegebracht,
      waterdicht zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: '70.2'
    text: |-
      Het verlaten van een boorgat dient te geschieden overeenkomstig een aan de Inspecteur-Generaal der Mijnen
      toegezonden doelmatig schriftelijk werkprogramma.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: '70.3'
    text: |-
      Het werkprogramma moet zo tijdig mogelijk, doch in ieder geval niet later dan 24 uur vóór de aanvang van de
      betrokken werkzaamheden, in het bezit zijn van de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: '70.4'
    text: De artikelen 28, derde lid, 29, 30 en 59, eerste lid, tweede en derde volzin, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: '70.5'
    text: |-
      Zodra een boorgat is verlaten moet daarvan onverwijld mededeling worden gedaan aan de Inspecteur-Generaal der
      Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: '70.6'
    text: |-
      Nadat een boorgat is verlaten moeten op een door Onze Minister goedgekeurde plaats, gedurende een door hem
      aangegeven tijd, worden bewaard een doelmatig register, dat voldoende gegevens betreffende het boorgat bevat, en
      het in artikel 64, eerste lid, bedoelde boorprofiel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70
  - number: 70a.1
    text: |-
      Het is verboden zonder vergunning van Onze Minister in of op het continentaal plat een pijpleiding met een diameter
      van meer dan 80 centimeter en een lengte van meer dan 40 kilometer te leggen of in stand te houden ten behoeve van
      de winning van aardolie of aardgas.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70a
  - number: 70a.2
    text: De vergunning kan slechts in het belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70a
  - number: 70a.3
    text: |-
      De paragrafen 3.5.2 tot en met 3.5.5 van de [Algemene wet bestuursrecht][ref1] zijn van toepassing op de
      totstandkoming van het besluit omtrent de verlening van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '71.1'
    text: |-
      Van het voornemen om in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van
      delfstoffen een pijpleiding te leggen moet, tenminste twaalf weken voordat met de desbetreffende werkzaamheden
      wordt aangevangen, schriftelijk mededeling worden gedaan aan Onze Minister, het Hoofd van de Afdeling Hydrografie
      van het Ministerie van Defensie, de Directeur-Generaal Scheepvaart en Maritieme Zaken, de houder van de concessie
      bedoeld in artikel 3 van de Wet op de telecommunicatievoorzieningen, de Directeur-Generaal van de Rijkswaterstaat,
      de Directeur-Generaal voor de Landinrichting, Grond- en Bosbeheer, de Hoofdingenieur-Directeur van de Dienst voor
      het Stoomwezen en de Inspecteur-Generaal der Mijnen, onder opgave van:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: 71.1.a
    text: |-
      de ligging van het traject, waarlangs de pijpleiding zal worden gelegd, uitgedrukt in geografische coördinaten,
      berekend volgens het stelsel van de Europese vereffening;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: 71.1.b
    text: |-
      de diameter van de pijpleiding en, indien zij in het continentaal plat zal worden gelegd, de minimale diepte waarop
      zij daarin zal komen te liggen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: 71.1.c
    text: de datum, waarop met de desbetreffende werkzaamheden zal worden aangevangen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: '71.2'
    text: |-
      Een mededeling als in het eerste lid bedoeld moet vergezeld gaan van een doelmatige kaart, waarop de ligging van
      het traject, waarlangs de pijpleiding zal worden gelegd, en, indien zij in het continentaal plat zal worden gelegd,
      de minimale diepte waarop zij daarin zal komen te liggen op voldoend duidelijke wijze zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: '71.3'
    text: |-
      Van wijziging van de in het eerste lid bedoelde gegevens dient onverwijld schriftelijk mededeling te worden gedaan
      aan degenen, aan wie de in dat lid bedoelde mededeling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel71
  - number: '72'
    text: |-
      Wanneer het in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen
      leggen van een pijpleiding gevaar kan opleveren voor de veiligheid van de daarbij werkzame personen, van de
      scheepvaart of van de visserij, dan wel voor beschadiging van reeds aanwezige onderzeese kabels of pijpleidingen,
      zomede wanneer het gebruik van de te leggen leiding gevaar kan opleveren voor verontreiniging van de zee, kan Onze
      Minister, in voorkomend geval in overeenstemming met Onze Minister, wie het mede aangaat, bij een ten hoogste acht
      weken na de ontvangst door hem van de in artikel 71, eerste lid, bedoelde mededeling aan de bestuurders van de
      betrokken onderneming toe te zenden beschikking bepalen, dat het leggen van die pijpleiding niet mag plaatsvinden
      dan langs een traject en op een minimale diepte in het continentaal plat, zomede op een wijze, welke bij die
      beschikking zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel72
  - number: '73.1'
    text: |-
      Bij het in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen leggen
      van een pijpleiding moeten voldoende maatregelen worden genomen in het belang van de veiligheid van de daarbij
      werkzame personen, van de scheepvaart en van de visserij, zomede ter voorkoming van verontreiniging van de zee.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel73
  - number: '73.2'
    text: Artikel 35, eerste, tweede en zesde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel73
  - number: '74.1'
    text: |-
      Op of in het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen gelegde
      pijpleidingen moeten bestaan uit voldoend sterke pijpen, die op doelmatige wijze onderling zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel74
  - number: '74.2'
    text: De pijpleidingen moeten doelmatig tegen corrosie en uitwendige krachten zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel74
  - number: '74.3'
    text: |-
      Ten aanzien van pijpleidingen moeten ook overigens voldoende maatregelen worden genomen ter voorkoming van
      het optreden van gevaar voor de veiligheid van de scheepvaart en van de visserij, zomede ter voorkoming van
      verontreiniging van de zee.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel74
  - number: '74.4'
    text: |-
      Onze Minister kan in verband met de toepassing van het bij en krachtens de voorgaande leden bepaalde aangeven welke
      verdere gegevens bij een mededeling als in artikel 71, eerste lid, bedoeld aan de Hoofdingenieur-Directeur van de
      Dienst voor het Stoomwezen en de Inspecteur-Generaal der Mijnen moeten worden opgegeven. Artikel 71, derde lid, is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel74
  - number: 74a
    text: |-
      Met het ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen in of op het continentaal plat leggen
      van een pijpleiding mag niet worden aangevangen dan nadat de aan de Hoofdingenieur-Directeur van de Dienst voor het
      Stoomwezen verstrekte gegevens door die dienst zijn beoordeeld en de leiding blijkens een door die Hoofdingenieur-
      Directeur aan de bestuurders van de betrokken mijnonderneming afgegeven schriftelijke verklaring, met name wat
      betreft materiaalkeuze en wijze van vervaardigen, aan artikel 74, eerste, tweede en derde lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel74a
  - number: '75.1'
    text: |-
      Het in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen leggen van
      pijpleidingen moet zodanig geschieden, dat geen onderzeese kabels of andere pijpleidingen kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel75
  - number: '75.2'
    text: Artikel 23, tweede lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel75
  - number: '76.1'
    text: |-
      Een in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen gelegde
      pijpleiding moet, tijdig voordat zij in gebruik wordt genomen, door een ter zake deskundige instelling of
      onderneming op doelmatige wijze worden onderzocht ter nauwkeurige vaststelling van het traject, waarlangs zij is
      gelegen, en, indien de leiding in het continentaal plat is gelegen, de diepte waarop zij daarin ligt, zomede ten
      overstaan van de Hoofdingenieur-Directeur van de Dienst voor het Stoomwezen op de staat waarin zij verkeert.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76
  - number: '76.2'
    text: |-
      Een pijpleiding als in het eerste lid bedoeld moet vervolgens binnen door Onze Minister aangegeven termijnen
      periodiek, alsmede tussentijds, indien en voor zover hij zulks verlangt, door een ter zake deskundige instelling
      of onderneming op doelmatige wijze worden onderzocht, indien de pijpleiding op het continentaal plat is gelegd,
      ter vaststelling van mogelijke afwijkingen van haar ligging ten opzichte van het traject, zoals opgegeven ingevolge
      artikel 71, eerste lid, onder *a*, of aangegeven krachtens artikel 72, dan wel toegestaan krachtens artikel 76*a*,
      tweede lid, of, indien zij in het continentaal plat is gelegd, ter vaststelling van haar mogelijk ondiepere ligging
      daarin dan opgegeven ingevolge artikel 71, eerste lid, onder *b*, of aangegeven krachtens artikel 72, dan wel
      toegestaan krachtens artikel 76*a*, tweede lid. Een periodiek onderzoek moet te allen tijde en een tussentijds
      onderzoek moet, indien Onze Minister zulks verlangt, mede omvatten een op de staat waarin de leiding verkeert
      gericht onderzoek; zodanig onderzoek moet, indien en voor zover door Onze Minister, in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid, noodzakelijk geacht, ten overstaan van de Hoofdingenieur-Directeur
      van de Dienst voor het Stoomwezen worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76
  - number: '76.3'
    text: |-
      Indien en voor zover bij een periodiek of tussentijds onderzoek van een in het continentaal plat gelegen
      pijpleiding een ondiepere ligging daarvan als in het eerste lid bedoeld wordt geconstateerd en zij door die
      ondiepere ligging gevaar voor de veiligheid van de scheepvaart of van de visserij kan opleveren, moet het onderzoek
      mede zijn gericht op mogelijke afwijkingen van de ligging der pijpleiding ten opzichte van het traject als in dat
      lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76
  - number: '76.4'
    text: |-
      Tenminste twee weken voordat met een onderzoek ingevolge het eerste of tweede lid wordt aangevangen moet aan de
      Inspecteur-Generaal der Mijnen schriftelijk worden medegedeeld door welke instelling of onderneming het onderzoek
      zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76
  - number: '76.5'
    text: |-
      Van ieder ingevolge het eerste of tweede lid verricht onderzoek moet een doelmatig rapport worden opgesteld,
      waarvan binnen een door Onze Minister te bepalen termijn aan hem een afschrift dient te worden toegezonden, alsmede
      aan het Hoofd van de Afdeling Hydrografie van het Ministerie van Defensie, de Directeur-Generaal Scheepvaart en
      Maritieme Zaken, de Directeur-Generaal van de Rijkswaterstaat, de Directeur-Generaal voor de Landinrichting, Grond-
      en Bosbeheer, de Hoofdingenieur-Directeur van de Dienst voor het Stoomwezen en de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76
  - number: 76a.1
    text: |-
      Het is verboden een in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van
      delfstoffen gelegde pijpleiding in gebruik te nemen, indien:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76a
  - number: 76a.1.a
    text: zij niet in deugdelijke staat verkeert en daardoor gevaar voor verontreiniging van de zee kan opleveren;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76a
  - number: 76a.1.b
    text: |-
      haar ligging afwijkt van die van het traject of haar ligging in het continentaal plat ondieper is dan de diepte
      daarin, zoals opgegeven ingevolge artikel 71, eerste lid, onder *a*, onderscheidenlijk *b*, dan wel aangegeven
      krachtens artikel 72, en zij daardoor gevaar voor de veiligheid van de scheepvaart of van de visserij kan
      opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76a
  - number: 76a.2
    text: |-
      Onze Minister kan, in voorkomend geval in overeenstemming met Onze Minister, wie het mede aangaat, van het eerste
      lid, onder *b*, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76a
  - number: 76a.3
    text: |-
      Indien alsnog blijkt, dat de pijpleiding gevaar kan opleveren voor verontreiniging van de zee doordat zij niet in
      deugdelijke staat verkeert, dan wel voor de veiligheid van de scheepvaart of van de visserij doordat haar ligging
      afwijkt van die van het traject of haar ligging in het continentaal plat ondieper is dan de diepte daarin, zoals
      opgegeven ingevolge artikel 71, eerste lid, onder *a*, onderscheidenlijk *b*, of aangegeven krachtens artikel
      72, dan wel toegestaan krachtens het tweede lid van dit artikel, kan Onze Minister, in voorkomend geval in
      overeenstemming met Onze Minister, wie het mede aangaat, maatregelen voorschrijven ter opheffing of beperking van
      dat gevaar.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel76a
  - number: '77.1'
    text: |-
      Indien bij een onderzoek als in artikel 76, tweede lid, bedoeld of anderszins enige aanwijzing van corrosie van
      een in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen gelegde
      pijpleiding wordt verkregen, dan wel beschadiging van zodanige leiding als gevolg van uitwendige krachten wordt
      vastgesteld moet daarvan zo spoedig mogelijk mededeling worden gedaan aan de Hoofdingenieur-Directeur van de Dienst
      voor het Stoomwezen en de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77
  - number: '77.2'
    text: |-
      Onze Minister kan in geval van corrosie of beschadiging als in het eerste lid bedoeld maatregelen ter voorkoming
      van verdere corrosie voorschrijven onderscheidenlijk herstelling van de beschadiging verlangen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77
  - number: 77a.1
    text: |-
      Zodra lekkage van een in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van
      delfstoffen gelegde pijpleiding wordt geconstateerd:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77a
  - number: 77a.1.a
    text: |-
      moet de pijpleiding of het betrokken deel daarvan, indien de lekkage gevaar voor de veiligheid van de bij
      mijnbouwkundig werk werkzame personen, van de scheepvaart of van de visserij dan wel voor verontreiniging van de
      zee oplevert, onverwijld buiten gebruik worden gesteld;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77a
  - number: 77a.1.b
    text: |-
      moeten, tenzij de pijpleiding of het betrokken deel daarvan buiten gebruik is gesteld, onverwijld de nodige
      herstelwerkzaamheden worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77a
  - number: 77a.1.c
    text: |-
      mag, indien de uitvoering van de herstelwerkzaamheden gevaar voor de veiligheid van de daarbij werkzame personen,
      van de scheepvaart of van de visserij, dan wel voor verontreiniging van de zee kan opleveren, daarmede niet worden
      aangevangen of voortgegaan dan nadat de pijpleiding of het betrokken deel daarvan buiten gebruik is gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77a
  - number: 77a.2
    text: |-
      Ten aanzien van het opnieuw in gebruik nemen van een in verband met herstelwerkzaamheden buiten gebruik zijnde
      pijpleiding of buiten gebruik zijnd deel van zodanige leiding zijn de artikelen 76, eerste, vierde en vijfde lid,
      en 76*a*, eerste en tweede lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77a
  - number: 77b.1
    text: |-
      Herstelwerkzaamheden aan een in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen
      van delfstoffen gelegde pijpleiding mogen niet anders geschieden dan overeenkomstig een aan de Hoofdingenieur-
      Directeur van de Dienst voor het Stoomwezen en de Inspecteur-Generaal der Mijnen toegezonden doelmatig schriftelijk
      herstelprogramma.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77b
  - number: 77b.2
    text: |-
      Het herstelprogramma moet tijdig, als regel ten minste 14 dagen, vóór de aanvang der betrokken werkzaamheden in
      het bezit zijn van de in het eerste lid bedoelde ambtenaren, dan wel, in geval de beschadiging of de lekkage van
      de pijpleiding onmiddellijk herstel vereist, bij het begin van de herstelwerkzaamheden onverwijld aan hen worden
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77b
  - number: 77b.3
    text: De artikelen 28, derde lid, 29, 30 en 59, eerste lid, tweede en derde volzin, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77b
  - number: 77c.1
    text: |-
      Indien bij het in of op het continentaal plat ten behoeve van een opsporingsonderzoek of het winnen van delfstoffen
      leggen van een pijpleiding of bij het verrichten van onderhouds- of herstelwerkzaamheden aan zodanige leiding
      schroot of ander materiaal op de zeebodem is terechtgekomen moet dit, voor zover de aanwezigheid hiervan gevaar
      voor de veiligheid van de scheepvaart of van de visserij kan opleveren, onverwijld worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77c
  - number: 77c.2
    text: |-
      Ten aanzien van onderhouds- en herstelwerkzaamheden aan een pijpleiding als in het eerste lid bedoeld is artikel
      73, eerste lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel77c
  - number: '78'
    text: |-
      Voldoende maatregelen moeten worden genomen en doelmatige instructies moeten worden uitgevaardigd ter verzekering
      van een veilig voetgangersverkeer op een mijnbouwinstallatie, alsmede van het op een zodanige installatie veilig
      vervoeren, het op en van de installatie brengen daaronder begrepen, van materieel, van materialen en van personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel78
  - number: '79.1'
    text: |-
      Op een mijnbouwinstallatie aanwezige transportinrichtingen, met alles wat daartoe behoort, moeten zodanig zijn
      ingericht en worden onderhouden, dat de veiligheid van de op die installatie werkzame personen voldoende is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel79
  - number: '79.2'
    text: Doelmatige maatregelen moeten worden genomen tegen de gevaren, welke hun gebruik kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel79
  - number: '80'
    text: |-
      De bediening van op een mijnbouwinstallatie aanwezige transportinrichtingen moet door voldoend deskundig personeel
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel80
  - number: '82'
    text: |-
      Van elke bij het verkeer of vervoer als in artikel 78 bedoeld voorgekomen bijzondere gebeurtenis, die van invloed
      kan zijn of zijn geweest op de veiligheid van de op een mijnbouwinstallatie werkzame personen, dan wel die gevaar
      oplevert of opgeleverd heeft van verontreiniging van de zee of voor de instandhouding van de daarin levende
      rijkdommen, moet onverwijld mededeling worden gedaan aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel82
  - number: '83.1'
    text: |-
      Bij de keuze, de installatie, de ingebruikneming, de werking en het onderhoud van werktuigen, werktuigdelen,
      drijfwerken, gereedschappen, leidingen, ketels, reservoirs en andere toestellen moet rekening gehouden worden met
      de veiligheid en gezondheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel83
  - number: '83.2'
    text: |-
      Wanneer de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg van de ontbranding
      van gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, moet zij aangepast zijn aan gebruik in
      een dergelijke zone. Indien nodig moet zij worden voorzien van afdoende beschermingsmiddelen en systemen ter
      beveiliging bij defecten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel83
  - number: '83.3'
    text: |-
      De mechanische apparatuur en installaties moeten de nodige sterkte bezitten, vrij zijn van zichtbare gebreken en
      geschikt zijn voor het gebruik waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel83
  - number: '83.4'
    text: |-
      Er moet een doelmatig plan worden opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend
      geval, het beproeven van de apparatuur. Onderhoud, inspectie en beproeving van enig onderdeel van de apparatuur
      moet door een daartoe aangewezen deskundig persoon worden uitgevoerd. Er moeten doelmatige inspectie- en
      beproevingsrapporten worden opgesteld en naar behoren worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel83
  - number: '84.1'
    text: |-
      Op een mijnbouwinstallatie aanwezige werktuigen en drijfwerken moeten zodanig zijn ingericht, opgesteld en beschut
      en zodanig worden gebruikt, dat het gevaar, hetwelk zij voor de op die installatie werkzame personen kunnen
      opleveren, zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel84
  - number: '84.2'
    text: |-
      Werktuigen, waarvan de onderdelen door snijden, knellen of pletten, door hun grote snelheid of op andere wijze
      gevaar kunnen opleveren, of bij het gebruik waarvan gevaar bestaat voor het afvliegen van vonken, splinters,
      schilfers of dergelijke kleine delen, moeten zijn voorzien van zodanige toestellen of beschuttingen, dat gevaar
      zoveel mogelijk wordt voorkomen. Zo nodig moeten doelmatige hulp- en beschuttingsmiddelen beschikbaar zijn, welke
      bij het verrichten van werkzaamheden, waarvoor deze middelen bestemd zijn, op doelmatige wijze moeten worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel84
  - number: '84.3'
    text: |-
      De gevaar veroorzakende delen van een werkstuk, dat ter bewerking door een werktuig in beweging wordt gehouden,
      moeten zo nodig en zo mogelijk doelmatig zijn beschut.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel84
  - number: '84.4'
    text: |-
      Ter verzekering van het veilig tornen en op gang brengen en het onverwijld en met zekerheid stilzetten van
      werktuigen en drijfwerken en ter voorkoming van overschrijding van veilige snelheden daarvan, moeten zo nodig
      doelmatige inrichtingen zijn aangebracht en worden gebruikt, waarschuwingstekens of -seinen worden gegeven en alle
      verder nodige maatregelen worden genomen om gevaar zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel84
  - number: '84.5'
    text: |-
      Indien het verrichten van werkzaamheden aan of in de nabijheid van een in beweging zijnd deel van een werktuig
      of drijfwerk gevaar kan opleveren, moeten zij bij stilstand daarvan worden verricht. Indien dit niet mogelijk is,
      moeten de werkzaamheden worden verricht met gebruikmaking van zodanige hulpmiddelen en toepassing van zodanige
      veiligheidsmaatregelen, dat het gevaar zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel84
  - number: '85.1'
    text: |-
      Een hijs- of hefwerktuig op een mijnbouwinstallatie moet zodanig zijn ingericht, opgesteld, beveiligd en zo nodig
      verankerd of vastgezet, dat het gevaar van een onverwacht in beweging komen, kantelen, beschadigen en dergelijke
      zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel85
  - number: '85.2'
    text: |-
      Een hijs- of hefwerktuig moet zijn voorzien van een doelmatige inrichting, waardoor het dalen van de last te allen
      tijde kan worden stopgezet, zo nodig de snelheid van het dalen kan worden geregeld en onverhoeds dalen van de last
      wordt belet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel85
  - number: '85.3'
    text: |-
      Een met een hijs- of hefwerktuig te verplaatsen last mag niet zwaarder zijn dan een veilig gebruik van het werktuig
      toelaat. Met betrekking tot de werkbelasting moet rekening worden gehouden met de omstandigheden, waaronder een
      hijs- of hefwerktuig wordt gebruikt; zij moet op een doelmatige plaats onuitwisbaar en duidelijk leesbaar zijn
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel85
  - number: '86.1'
    text: |-
      Een door een krachtwerktuig gedreven hijs- of hefwerktuig op een mijnbouwinstallatie moet, voordat het in gebruik
      wordt genomen, aan een deskundig onderzoek worden onderworpen. Zodanig onderzoek moet regelmatig worden herhaald.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel86
  - number: '86.2'
    text: De bij elk onderzoek verkregen gegevens moeten op doelmatige wijze schriftelijk worden vastgelegd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel86
  - number: '86.3'
    text: |-
      Onze Minister kan tijdstippen bepalen, waarop het herhaalde onderzoek moet plaatsvinden. Hij kan voorts bepalen,
      dat door hem aangewezen hijs- of hefwerktuigen van dit onderzoek zijn uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel86
  - number: 86a
    text: De bediening van een hijs- of hefwerktuig moet door voldoende deskundig personeel geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel86a
  - number: '87'
    text: |-
      Een op een mijnbouwinstallatie aanwezige lift, met alles wat daartoe behoort, moet op doelmatige wijze zijn beschut
      en zodanig zijn ingericht en beveiligd, dat het gevaar, dat personen vallen of bekneld geraken of geraakt worden
      door vallende voorwerpen, zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87
  - number: 87a.1
    text: |-
      In dit artikel wordt onder «lift» en «veiligheidscomponenten» verstaan hetgeen daaronder wordt verstaan in het
      [Besluit liften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 87a.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk liften of veiligheidscomponenten voorhanden
      te hebben of te gebruiken die niet in overeenstemming zijn met het bij en krachtens het [Besluit liften][ref1]
      bepaalde. Dit verbod geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 87a.2.a
    text: |-
      gevaarlijke werktuigen als bedoeld in [artikel 4 van het Besluit liften][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '4'
  - number: 87a.2.b
    text: liften en veiligheidscomponenten die voor 1 juli 1997 in bedrijf zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
  - number: 87a.3
    text: |-
      De artikelen 83 tot en met 87, 88, 89 en 94 zijn niet van toepassing op liften en veiligheidscomponenten die
      in overeenstemming zijn met het bij en krachtens het [Besluit liften][ref1] bepaalde voor zover deze bepalingen
      eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze of de eigenschappen van liften of
      veiligheidscomponenten of daarop aangebrachte vermeldingen als bedoeld in [artikel 5 van het Besluit liften][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008212
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel5
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '5'
  - number: 87a.4
    text: |-
      Het bij en krachtens [artikel 23, eerste en derde lid, van het Besluit liften][ref1] bepaalde is van
      overeenkomstige toepassing met betrekking tot liften en veiligheidscomponenten die aanwezig zijn op
      een mijnbouw-installatie of worden gebruikt bij mijnbouwkundig werk, met dien verstande dat het in
      [artikel 23, eerste lid, van het Besluit liften][ref2] gestelde niet geldt ten aanzien van de Inspecteur-Generaal
      der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008212#Artikel23
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0008212
        artikel: '23'
  - number: 87a.5
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd herstelling te eisen van liften of veiligheidscomponenten binnen
      een door hem vast te stellen termijn. Voorts kan hij, indien blijkt dat een lift of veiligheidscomponent
      niet in overeenstemming is met het bij en krachtens het [Besluit liften][ref1] bepaalde, die lift of die
      veiligheidscomponent voorzien van een merk van afkeuring. Door het aanbrengen van een merk van afkeuring verliest
      de op de lift of de veiligheidscomponent aangebrachte CE-markering van rechtswege haar geldigheid. Een krachtens de
      eerste zin gestelde eis moet worden nageleefd door degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0008212
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87a
    references:
      - id: ref1
        bwb_id: BWBR0008212
  - number: 87b
    text: |-
      Bij de installatie van een lift op een mijnbouwinstallatie stellen de bestuurders van de betrokken
      mijnbouwonderneming of de in artikel 11, eerste lid, bedoelde andere onderneming en degene die de lift installeert
      elkaar in kennis van de nodige gegevens en nemen zij passende maatregelen om de goede werking en het veilige
      gebruik van de lift te waarborgen. Dit voorschrift geldt niet voor gevaarlijke werktuigen als bedoeld in
      [artikel 4 van het Besluit liften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '4'
  - number: 87c.1
    text: |-
      In liftschachten mogen geen leidingen of installaties worden aangebracht die niet voor de werking of veiligheid van
      de lift zijn vereist.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.2
    text: |-
      Machinekamers, schijvenruimten en schachtputten mogen niet worden gebruikt als bergruimte van voorwerpen, welke
      niet tot de lift behoren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.3
    text: Machinekamers, schijvenruimten en luiken, bestemd voor inspectie en onderhoud, zijn afgesloten met slot en sleutel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.4
    text: |-
      De in het derde lid bedoelde sleutels zijn voorzien van aanduidingen en worden op een uitsluitend voor bevoegden
      toegankelijke plaats bewaard.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.5
    text: |-
      In de machinekamers is een aanwijzing opgehangen, waarin is aangegeven, op welke wijze de machine kan worden
      getornd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.6
    text: 'Het eerste tot en met vijfde lid gelden niet voor:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87c.6.a
    text: |-
      gevaarlijke werktuigen als bedoeld in [artikel 4 van het Besluit liften][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0008212#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0008212
        artikel: '4'
  - number: 87c.6.b
    text: liften en veiligheidscomponenten die voor 1 juli 1997 in bedrijf zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87c
  - number: 87d.1
    text: |-
      De schachtdeuren van een lift welke is voorzien van een merk van afkeuring mogen niet zonder bijzondere
      hulpmiddelen kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87d
  - number: 87d.2
    text: |-
      Op of nabij elke schachtdeur van een lift welke is voorzien van een merk van afkeuring is duidelijk en opvallend
      een opschrift aangebracht waaruit blijkt dat de lift buiten dienst is gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel87d
  - number: '88.1'
    text: |-
      Kettingwerk, staaldraadkabels en touwen op een mijnbouwinstallatie moeten voldoen aan de eis van goed en veilig
      werk en in goede staat van onderhoud verkeren. Zij moeten zodanig worden gebruikt, dat gevaar zoveel mogelijk wordt
      voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel88
  - number: '88.2'
    text: Onze Minister kan ter bevordering van een goede uitvoering van het eerste lid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel88
  - number: '88.3'
    text: |-
      Het inkorten en verlengen van kettingwerk, staaldraadkabels en touwen, zomede het bevestigen daarvan aan een hijs-
      of hefwerktuig, last of ander voorwerp moeten op doelmatige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel88
  - number: '89.1'
    text: |-
      Op een mijnbouwinstallatie aanwezige stookinrichtingen, stoomketels, vaten en dergelijke, waarin zich gassen,
      dampen of vloeistoffen bevinden of kunnen bevinden, moeten doelmatig zijn ingericht, opgesteld en beschut en op
      veilige wijze worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel89
  - number: '89.2'
    text: |-
      Op een mijnbouwinstallatie aanwezige installaties, toestellen en leidingen, waarin zich vloeistoffen of gassen
      bevinden, moeten doelmatig zijn ingericht, aangelegd en beschut en op veilige wijze worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel89
  - number: '90.1'
    text: |-
      Op een mijnbouwinstallatie mogen slechts veilige stoom- en damptoestellen als bedoeld in de [Stoomwet][ref1]
      (*Stb.* 1953, 179) en veilige drukhouders worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '90.2'
    text: |-
      Voor de toepassing van het bij of krachtens dit artikel bepaalde worden onder drukhouders verstaan toestellen of
      andere technische voortbrengselen, niet zijnde stoom- of damptoestellen als bedoeld in de [Stoomwet][ref1], die een
      gas of een mengsel van gassen onder overdruk bevatten, dan wel daartoe bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '90.3'
    text: |-
      Op een mijnbouwinstallatie gebruikte stoom- en damptoestellen als bedoeld in de [Stoomwet][ref1] en drukhouders
      moeten, voorzover deze daartoe door Onze Minister zijn aangewezen, zijn voorzien van een geldig, door Onze Minister
      goedgekeurd, merkteken ten bewijze van de afgifte van een certificaat van goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0002108
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002108
  - number: '90.4'
    text: |-
      Het certificaat van goedkeuring moet zijn afgegeven en het merkteken moet zijn aangebracht door de Dienst voor het
      Stoomwezen of door een door Onze Minister erkende instelling of onderneming. Het certificaat van goedkeuring moet
      inhouden, dat het betrokken stoom- of damptoestel dan wel de betrokken drukhouder, met alles wat daartoe behoort,
      blijkens een door bedoelde instantie verrichte keuring, ten tijde van de afgifte voldoet aan het bij en krachtens
      het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
  - number: '90.5'
    text: Onze Minister kan ten aanzien van de keuring nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
  - number: '90.6'
    text: |-
      Onze Minister kan merktekens en certificaten, die in het buitenland zijn aangebracht, onderscheidenlijk afgegeven,
      gelijkstellen met krachtens het derde lid goedgekeurde en krachtens het vierde lid aangebrachte merktekens,
      onderscheidenlijk met krachtens het vierde lid afgegeven certificaten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
  - number: '90.7'
    text: Een certificaat van goedkeuring en een merkteken zijn slechts geldig voor een door Onze Minister te bepalen tijd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90
  - number: 90a.1
    text: |-
      In dit artikel wordt onder 'drukvat' verstaan hetgeen daaronder wordt verstaan in het
      [Besluit drukvaten van eenvoudige vorm][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005627
  - number: 90a.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk drukvaten voorhanden
      te hebben of te gebruiken die niet in overeenstemming zijn met het bij en krachtens het
      [Besluit drukvaten van eenvoudige vorm][ref1] bepaalde. Dit verbod geldt niet voor drukvaten als bedoeld in
      [artikel 3 van het Besluit drukvaten van eenvoudige vorm][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005627
      [ref2]: https://wetten.overheid.nl/BWBR0005627#Artikel3
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005627
      - id: ref2
        bwb_id: BWBR0005627
        artikel: '3'
  - number: 90a.3
    text: |-
      Het bij en krachtens [artikel 11, eerste en derde lid, van het Besluit drukvaten van eenvoudige vorm][ref1]
      bepaalde is van overeenkomstige toepassing met betrekking tot drukvaten die aanwezig zijn op een
      mijnbouwinstallatie of worden gebruikt bij mijnbouwkundig werk, met dien verstande dat het in
      [artikel 11, eerste lid, van het Besluit drukvaten van eenvoudige vorm][ref2] gestelde niet geldt ten aanzien van
      de Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005627#Artikel11
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0005627
        artikel: '11'
  - number: 90a.4
    text: |-
      De artikelen 83, 89 en 90 zijn niet van toepassing op drukvaten voor zover deze bepalingen eisen stellen met
      betrekking tot het ontwerp, de vervaardigingswijze of de eigenschappen van drukvaten of daarop aangebrachte
      vermeldingen als bedoeld in [artikel 4 van het Besluit drukvaten van eenvoudige vorm][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005627#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005627
        artikel: '4'
  - number: 90a.5
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd herstelling te eisen van drukvaten binnen een door hem vast te stellen
      termijn. Voorts kan hij, indien blijkt dat een drukvat niet in overeenstemming is met het bij en krachtens het
      [Besluit drukvaten van eenvoudige vorm][ref1] bepaalde, dat drukvat voorzien van een merk van afkeuring. Door het
      aanbrengen van een merk van afkeuring verliest de op het drukvat aangebrachte CE-markering van rechtswege haar
      geldigheid. Een krachtens de eerste zin gestelde eis moet worden nageleefd door degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005627
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005627
  - number: 90b.1
    text: |-
      In dit artikel wordt onder «drukapparatuur», «samenstellen» en «druksystemen» verstaan hetgeen daaronder wordt
      verstaan in het [Besluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 90b.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk drukapparatuur, samenstellen of
      druksystemen voorhanden te hebben of te gebruiken die niet in overeenstemming zijn met de bij en krachtens het
      [Besluit drukapparatuur][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: 90b.3
    text: |-
      De bij en krachtens de [artikelen 23][ref1], [23a][ref2], [24][ref3], [26, eerste en derde lid][ref4], en
      [29 van het Besluit drukapparatuur][ref5] gestelde regels zijn van overeenkomstige toepassing met betrekking tot
      drukapparatuur, samenstellen en druksystemen die aanwezig zijn op een mijnbouwinstallatie of worden gebruikt bij
      mijnbouwkundig werk, met dien verstande dat de in [artikel 26, eerste lid, van het Besluit drukapparatuur][ref6]
      gestelde regels niet gelden ten aanzien van de Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0010586#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0010586#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0010586#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0010586#Artikel26
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0010586
        artikel: 23a
      - id: ref3
        bwb_id: BWBR0010586
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0010586
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0010586
        artikel: '29'
      - id: ref6
        bwb_id: BWBR0010586
        artikel: '26'
  - number: 90b.4
    text: |-
      De artikelen 83, 89 en 90 zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen voor zover
      deze bepalingen eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze, de eigenschappen of de
      ingebruikneming van drukapparatuur, samenstellen en druksystemen of daarop aangebrachte vermeldingen als bedoeld in
      [artikel 5 van het Besluit drukapparatuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel5
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '5'
  - number: 90b.5
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd drukapparatuur, samenstellen en druksystemen te beproeven of te
      onderzoeken en zo nodig herstelling daarvan binnen een door hem vast te stellen termijn te eisen. Voorts kan hij,
      indien blijkt dat drukapparatuur, samenstellen of druksystemen niet in overeenstemming zijn met de bij en krachtens
      het [Besluit drukapparatuur][ref1] gestelde regels, die drukapparatuur, samenstellen of druksystemen voorzien
      van een merk van afkeuring. Door het aanbrengen van een merk van afkeuring verliest de op de drukapparatuur of
      samenstellen aangebrachte CE-markering van rechtswege haar geldigheid. Een krachtens de eerste zin gestelde eis
      moet worden nageleefd door degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0010586
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel90b
    references:
      - id: ref1
        bwb_id: BWBR0010586
  - number: '91'
    text: |-
      Het bij de arbeid op een mijnbouwinstallatie tijdelijk buiten werking stellen of terzijde leggen van werktuigen,
      gereedschappen of andere voorwerpen moet zodanig geschieden, dat gevaar zoveel mogelijk wordt voorkomen. In
      het bijzonder moeten zo nodig maatregelen worden genomen tegen een onverwacht weer op gang komen van door een
      krachtwerktuig aangedreven werktuigen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91
  - number: 91a.1
    text: |-
      In dit artikel wordt onder 'machine' en 'veiligheidscomponent' verstaan hetgeen daaronder wordt verstaan in het
      [Besluit machines][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005884
  - number: 91a.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk machines of veiligheidscomponenten voorhanden
      te hebben of te gebruiken die niet in overeenstemming zijn met het bij en krachtens het [Besluit machines][ref1]
      bepaalde. Dit verbod geldt niet voor machines als bedoeld in [artikel 3 van het Besluit machines][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005884
      [ref2]: https://wetten.overheid.nl/BWBR0005884#Artikel3
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005884
      - id: ref2
        bwb_id: BWBR0005884
        artikel: '3'
  - number: 91a.3
    text: |-
      Artikel 19, eerste lid is niet van toepassing op machines en veiligheidscomponenten. De artikelen
      19, tweede lid, 83 tot en met 87 en 89 zijn niet van toepassing op machines en veiligheidscomponenten
      voor zover deze bepalingen eisen stellen met betrekking tot het ontwerp, de vervaardigingswijze of de
      eigenschappen van machines of veiligheidscomponenten of daarop aangebrachte vermeldingen als bedoeld in
      [artikel 4 van het Besluit machines][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005884#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005884
        artikel: '4'
  - number: 91a.4
    text: |-
      Het bij en krachtens [artikel 12, eerste en derde lid, van het Besluit machines][ref1] bepaalde is
      van overeenkomstige toepassing met betrekking tot machines en veiligheidscomponenten die aanwezig zijn
      op een mijnbouwinstallatie of worden gebruikt bij mijnbouwkundig werk, met dien verstande dat het in
      [artikel 12, eerste lid, van het Besluit machines][ref2] gestelde niet geldt ten aanzien van de Inspecteur-Generaal
      der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005884#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005884#Artikel12
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005884
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0005884
        artikel: '12'
  - number: 91a.5
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd herstelling te eisen van machines of veiligheidscomponenten binnen
      een door hem vast te stellen termijn. Voorts kan hij, indien blijkt dat een machine of veiligheidscomponent
      niet in overeenstemming is met het bij en krachtens het [Besluit machines][ref1] bepaalde, die machine of dat
      veiligheidscomponent voorzien van een merk van afkeuring. Door het aanbrengen van een merk van afkeuring verliest
      de op de machine of de veiligheidscomponent aangebrachte CE-markering van rechtswege haar geldigheid. Een krachtens
      de eerste zin gestelde eis moet worden nageleefd door degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91a
    references:
      - id: ref1
        bwb_id: BWBR0005884
  - number: 91b.1
    text: |-
      In dit artikel wordt onder 'explosieveilig materieel' verstaan hetgeen daaronder wordt verstaan in het
      [Besluit explosieveilig materieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: 91b.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk explosieveilig materieel
      voorhanden te hebben of te gebruiken dat niet in overeenstemming is met het bij en krachtens het
      [Besluit explosieveilig materieel][ref1] bepaalde. Dit verbod geldt niet voor materieel als bedoeld in
      [artikel 3 van het Besluit explosieveilig materieel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007497
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel3
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0007497
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '3'
  - number: 91b.3
    text: |-
      Artikel 19, eerste lid, is niet van toepassing op explosieveilig materieel. De artikelen 19, tweede lid, 83 tot en
      met 87, 89, 92 en 94 zijn niet van toepassing op explosieveilig materieel voor zover deze bepalingen eisen stellen
      met betrekking tot het ontwerp, de vervaardigingswijze of de eigenschappen van explosieveilig materieel of daarop
      aangebrachte vermeldingen als bedoeld in [artikel 4 van het Besluit explosieveilig materieel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '4'
  - number: 91b.4
    text: |-
      Het bij en krachtens [artikel 17, eerste en derde lid, van het Besluit explosieveilig materieel][ref1]
      bepaalde is van overeenkomstige toepassing met betrekking tot explosieveilig materieel dat aanwezig
      is op een mijnbouwinstallatie of wordt gebruikt bij mijnbouwkundig werk, met dien verstande dat het in
      [artikel 17, eerste lid, van het Besluit explosieveilig materieel][ref2] gestelde niet geldt ten aanzien van de
      Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0007497#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007497#Artikel17
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0007497
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007497
        artikel: '17'
  - number: 91b.5
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd herstelling te eisen van explosieveilig materieel binnen een door hem
      vast te stellen termijn. Voorts kan hij, indien blijkt dat explosieveilig materieel niet in overeenstemming is met
      het bij en krachtens het [Besluit explosieveilig materieel][ref1] bepaalde, dat materieel voorzien van een merk van
      afkeuring. Door het aanbrengen van een merk van afkeuring verliest de op het explosieveilig materieel aangebrachte
      CE-markering van rechtswege haar geldigheid. Een krachtens de eerste zin gestelde eis moet worden nageleefd door
      degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0007497
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91b
    references:
      - id: ref1
        bwb_id: BWBR0007497
  - number: 91c.1
    text: |-
      In dit artikel wordt onder «apparaat» verstaan hetgeen daaronder wordt verstaan in de Wet op de
      telecommunicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91c
  - number: 91c.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij een mijnbouwkundig werk ten behoeve van een opsporingsonderzoek
      of het winnen van delfstoffen apparaten te gebruiken anders dan in overeenstemming met het bij en krachtens
      hoofdstuk V van de Wet op de telecommunicatievoorzieningen bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91c
  - number: 91c.3
    text: |-
      De artikelen 19, 83 tot en met 87, 89, 92 en 94 zijn niet van toepassing op apparaten voorzover deze bepalingen
      eisen stellen als bedoeld in artikel 3 van het Besluit elektromagnetische compatibiliteit met betrekking tot de
      elektromagnetische compatibiliteit van apparaten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel91c
  - number: '92.1'
    text: |-
      Op een mijnbouwinstallatie moeten elektrische installaties en onderdelen daarvan zodanig worden ingericht en
      aangelegd en elektrische machines, transformatoren, schakel- en verdeelinrichtingen, zomede elektrische toestellen
      en elektrische leidingen en bijbehoren van deze leidingen zodanig worden geconstrueerd, samengesteld, beveiligd
      en beschermd, dat zoveel mogelijk wordt voorkomen, dat bij gebruik of bediening, alsmede bij herstellings-,
      onderhouds-, meet- of controlewerkzaamheden gevaar, met inbegrip van gevaar voor de veiligheid en de gezondheid van
      arbeiders, optreedt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '92.2'
    text: |-
      Bij het op een mijnbouwinstallatie aanleggen, uitbreiden, wijzigen, herstellen, onderhouden, onderzoeken, meten en
      controleren van elektrische installaties of onderdelen daarvan moeten de nodige voorzieningen worden getroffen om
      zoveel mogelijk te voorkomen, dat gevaar voor het ontstaan van brand of ontploffing of voor verwonding van personen
      optreedt, of dat een gevaarlijke stroomovergang op personen plaats heeft.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '92.3'
    text: |-
      Wanneer op een mijnbouwinstallatie de apparatuur zich bevindt in een zone waar brand- of explosiegevaar als gevolg
      van de ontbranding van gassen, dampen of vluchtige vloeistoffen bestaat of kan bestaan, moet zij zijn aangepast
      aan het gebruik in een dergelijke zone. Indien nodig moet zij worden voorzien van afdoende beschermingsmiddelen en
      systemen ter beveiliging bij defecten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '92.4'
    text: |-
      De elektrotechnische apparatuur en installaties op een mijnbouwinstallatie moeten voldoende kracht en vermogen
      hebben voor het gebruik waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '92.5'
    text: |-
      Er moet een doelmatig plan worden opgesteld voor het systematisch inspecteren, het onderhouden en, in voorkomend
      geval, het beproeven van de apparatuur en installaties. Onderhoud, inspectie en beproeving van enig onderdeel
      van de apparatuur en installaties moet door een daartoe aangewezen deskundig persoon worden uitgevoerd. Er moeten
      doelmatige inspectie- en beproevingsrapporten worden opgesteld en naar behoren worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '92.6'
    text: Onze Minister kan ter bevordering van een goede uitvoering van de voorgaande leden nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel92
  - number: '93'
    text: |-
      Naar gelang van de aard en de mate van het ontploffingsgevaar kan Onze Minister mijnbouwinstallaties of delen
      daarvan indelen in gevarenklassen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel93
  - number: '94.1'
    text: |-
      Onze Minister kan in het belang van het voorkomen van het optreden van ontploffingsgevaar bepalen, dat op
      een mijnbouwinstallatie of op een deel daarvan aanwezige elektrische machines, transformatoren, schakel- en
      verdeelinrichtingen, elektrische toestellen of elektrische leidingen en bijbehoren van deze leidingen, in verband
      met de indeling krachtens artikel 93 van die mijnbouwinstallatie of dat deel daarvan in een bepaalde gevarenklasse,
      moeten zijn voorzien van een geldig, in overeenstemming met hem vastgesteld, merkteken ten bewijze van de afgifte
      van een certificaat van goedkeuring.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '94.2'
    text: |-
      Het certificaat van goedkeuring moet zijn afgegeven door een daartoe door Onze Minister aangewezen instelling of
      onderneming. Het certificaat moet inhouden, dat het betrokken materieel, blijkens een door de afgever verrichte
      keuring, ten tijde van de afgifte voldeed aan het bij en krachtens artikel 92 bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '94.3'
    text: |-
      Bij een aanwijzing krachtens het tweede lid kunnen voorwaarden worden gesteld; zij kan te allen tijde worden
      ingetrokken of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '94.4'
    text: |-
      Onze Minister kan merktekens en certificaten, die in het buitenland op elektrisch materieel zijn aangebracht,
      onderscheidenlijk daarvoor zijn afgegeven, met de krachtens het eerste lid vastgestelde merktekens en de krachtens
      het tweede lid afgegeven certificaten gelijkstellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '94.5'
    text: |-
      In door Onze Minister aangewezen gevallen kan worden volstaan met keuring van een of meer het type materieel
      kenmerkende monsters. Ten aanzien van het monster is alsdan het tweede lid van overeenkomstige toepassing. Het
      krachtens het eerste lid vastgestelde merkteken mag op elektrisch materieel, dat geheel overeenkomstig het monster,
      waarvoor een certificaat is afgegeven, is vervaardigd, zonder nadere keuring worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '94.6'
    text: Onze Minister kan ter bevordering van een goede uitvoering van de voorgaande leden nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel94
  - number: '95'
    text: |-
      Op verlangen van de Inspecteur-Generaal der Mijnen moet een certificaat van goedkeuring voor elektrisch materieel
      aan deze worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel95
  - number: '96.1'
    text: |-
      Aan een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt ingesteld, dan wel
      delfstoffen worden gewonnen, moet een doelmatig georganiseerde veiligheidsdienst zijn verbonden, die is belast met:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: 96.1.a
    text: |-
      het met inachtneming van het bij of krachtens dit besluit bepaalde overwegen en voorbereiden van maatregelen, die
      bij mijnbouwkundig werk met betrekking tot de veiligheid van de daarbij werkzame personen, van de scheepvaart en
      van de visserij, zomede tot het voorkomen van verontreiniging van de zee dienen te worden genomen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: 96.1.b
    text: het doen van voorstellen daaromtrent aan de bestuurders van de betrokken onderneming;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: 96.1.c
    text: het toezien op de uitvoering van de door of vanwege de bestuurders terzake genomen beslissingen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: '96.2'
    text: |-
      De in het eerste lid bedoelde veiligheidsdienst moet zijn gevestigd op een door de bestuurders van de
      mijnonderneming, onder goedkeuring van Onze Minister, te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: '96.3'
    text: |-
      Onze Minister kan van het eerste lid ontheffing verlenen; hij kan daarbij goedkeuren, dat de eigenaren van bepaalde
      mijnondernemingen voor de uitvoering van dat lid een gemeenschappelijke veiligheidsdienst vormen of gebruik maken
      van de diensten van een bestaande veiligheidsdienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96
  - number: 96a.1
    text: |-
      Door de bestuurders van een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt
      ingesteld, dan wel delfstoffen worden gewonnen, dient jaarlijks aan de Inspecteur-Generaal der Mijnen, de
      Directeur-Generaal van de Rijkswaterstaat en de Directeur-Generaal voor de Milieuhygiëne een op het volgende
      kalenderjaar betrekking hebbend rampenbestrijdingsplan voor alle bij dat onderzoek of die winning in gebruik zijnde
      mijnbouwinstallaties te worden toegezonden; het plan moet ten minste 14 dagen vóór de aanvang van het betrokken
      kalenderjaar in het bezit van die ambtenaren zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.2
    text: |-
      In geval in de loop van enig kalenderjaar met een opsporingsonderzoek of het winnen van delfstoffen wordt begonnen,
      dient door de bestuurders van de betrokken mijnonderneming tijdig tevoren een op dat jaar en op de bij dat
      onderzoek of die winning te gebruiken mijnbouwinstallatie(s) betrekking hebbend rampenbestrijdingsplan aan de in
      het eerste lid bedoelde ambtenaren te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.3
    text: |-
      Het plan moet voldoende gegevens bevatten betreffende de maatregelen, welke zijn of zullen worden genomen zowel ter
      bestrijding van voorvallen, die ernstig gevaar opleveren voor de veiligheid van de bij mijnbouwkundig werk werkzame
      personen, van de scheepvaart of van de visserij, dan wel voor verontreiniging van de zee, als ter beperking van de
      gevolgen van zodanige voorvallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.4
    text: |-
      Indien het plan voor wat betreft de daarin aangegeven maatregelen naar het oordeel van Onze Minister wegens
      onvolledigheid of anderszins niet voldoet aan redelijk te stellen eisen, moet dit op zijn verlangen en te zijnen
      genoegen, voor wat betreft de maatregelen ter beperking van de gevolgen van voorvallen als in het derde lid
      bedoeld, in voorkomend geval in overeenstemming met Onze Minister wie het mede aangaat, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.5
    text: 'Onze Minister kan van het eerste en tweede lid ontheffing verlenen; hij kan daarbij:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.5.a
    text: |-
      in geval van ontheffing van het eerste lid, goedkeuren dat de bestuurders van door hem daarbij aan te wijzen
      mijnondernemingen voor de uitvoering van dat lid een gemeenschappelijk plan indienen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96a.5.b
    text: |-
      in geval van ontheffing van het tweede lid, goedkeuren dat de bestuurders van de betrokken mijnonderneming zich
      voor de uitvoering van dat lid conformeren aan een op het betrokken kalenderjaar betrekking hebbend plan als onder
      *a* bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96a
  - number: 96b.1
    text: |-
      Onze Minister kan bepalen dat de bestuurders van daarbij aangewezen mijnondernemingen, waarin - of waarvoor door
      anderen - een opsporingsonderzoek wordt ingesteld, dan wel delfstoffen worden gewonnen, op daarbij aangegeven
      plaatsen en in een daarbij aangegeven omvang gezamenlijk voor onmiddellijk gebruik gereed moeten hebben doelmatig
      ingerichte vaartuigen, luchtvaartuigen en ander doelmatig materieel, zomede voldoende middelen ter bestrijding van
      voorvallen als in artikel 96*a*, derde lid, bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.2
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister, wie het mede aangaat, bovendien bepalen dat het materieel
      en de middelen als in het eerste lid bedoeld mede in een daarbij aangegeven omvang moeten omvatten materieel en
      middelen ter beperking van de gevolgen van voorvallen als in artikel 96*a*, derde lid, bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.3
    text: |-
      In geval van zodanig voorval moeten de bestuurders van de betrokken mijnonderneming indien en voor zover nodig
      onverwijld kunnen beschikken over materieel en middelen als in het eerste of tweede lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.4
    text: |-
      Indien Onze Minister zulks verlangt zijn, in geval van een voorval als in artikel 96*a*, derde lid, bedoeld, de
      bestuurders van mijnondernemingen, die in de omgeving van het voorval werkzaam zijn, gehouden bij het bestrijden
      van het voorval of het beperken van de gevolgen daarvan zoveel mogelijk hulp en bijstand te verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.5
    text: |-
      Onze Minister kan ten aanzien van het bestrijden van een voorval als in artikel 96*a*, derde lid, bedoeld, zomede
      ten aanzien van het beperken van de gevolgen van zodanig voorval, voor wat betreft dat beperken in voorkomend geval
      in overeenstemming met Onze Minister, wie het mede aangaat:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.5.a
    text: |-
      aangeven op welke wijze de desbetreffende werkzaamheden dienen te worden verricht en welke bestrijdingsmiddelen
      daarbij al dan niet mogen worden aangewend;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96b.5.b
    text: |-
      bepalen, dat de desbetreffende werkzaamheden dienen te worden opgedragen aan een ter zake deskundige en daarin
      gespecialiseerde instelling of onderneming.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96b
  - number: 96c
    text: |-
      Het verrichten van werkzaamheden ter bestrijding van een voorval als in artikel 96*a*, derde lid, bedoeld of ter
      beperking van de gevolgen van zodanig voorval moet onder toezicht van een daartoe aangewezen deskundig persoon
      geschieden door vakkundig personeel, dat voldoende geoefend en geïnstrueerd is om de desbetreffende werkzaamheden
      doeltreffend te kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96c
  - number: 96d.1
    text: |-
      In dit artikel wordt onder 'veiligheids- of gezondheidssignalering' verstaan hetgeen daaronder wordt verstaan in
      het [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 96d.2
    text: |-
      Bij werkzaamheden bij mijnbouwkundig werk is [hoofdstuk 8, afdeling 2 van het Arbeidsomstandighedenbesluit][ref1]
      van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 96d.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
  - number: 96d.2.b
    text: de personen die werkzaam zijn bij mijnbouwkundig werk in de plaats treden van de werknemers.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
  - number: 96d.3
    text: |-
      Personen die werkzaam zijn bij mijnbouwkundig werk of hun vertegenwoordigers dienen te worden geïnformeerd over
      alle ten aanzien van de veiligheids- of gezondheidssignalering op het werk te nemen maatregelen. Personen die
      werkzaam zijn bij mijnbouwkundig werk dienen voorts ten aanzien van de veiligheids- of gezondheidssignalering op
      het werk een passende opleiding te krijgen, met name in de vorm van nauwkeurige instructies. Deze opleiding dient
      in het bijzonder betrekking te hebben op de betekenis van de signalering, met name wanneer daarbij woorden worden
      gebruikt, en op de te volgen algemene en specifieke handelwijzen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
  - number: 96d.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen worden geraadpleegd omtrent en nemen deel
      aan de behandeling van de onderwerpen betreffende veiligheids- of gezondheidssignalering.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
  - number: 96d.5
    text: |-
      Bij de uitvoering van de bij het tweede lid van overeenkomstige toepassing verklaarde
      [afdeling 2 van hoofdstuk 8 van het Arbeidsomstandighedenbesluit][ref1] gaan de bestuurders van de betrokken
      mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming uit van elke krachtens het Mijnreglement
      continentaal plat verrichte risico-evaluatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 96d.6
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het tweede tot en met vijfde lid nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96d
  - number: 96e
    text: |-
      Op alle normaliter bemande arbeidsplaatsen moeten op gezette tijden veiligheidsoefeningen worden gehouden die erop
      gericht zijn:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96e
  - number: 96e.a
    text: |-
      arbeiders aan wie in noodgevallen concrete taken worden opgedragen waarbij noodapparatuur moet worden gebruikt,
      gehanteerd of bediend, hierin te trainen en na te gaan of zij bekwaam zijn die taken te vervullen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96e
  - number: 96e.b
    text: |-
      alle bij de oefeningen gebruikte noodapparatuur te controleren, schoon te maken en zo nodig opnieuw op te laden
      of te vervangen en alle gebruikte draagbare apparatuur opnieuw naar de plaats te brengen waar zij zich normaliter
      bevindt;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96e
  - number: 96e.c
    text: na te gaan of de reddingvaartuigen gebruiksklaar zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel96e
  - number: '97.1'
    text: Het is verboden op een mijnbouwinstallatie alcoholhoudende drank mede te nemen, bij zich te hebben of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel97
  - number: '97.2'
    text: |-
      Een persoon, die onder de invloed van alcoholhoudende drank verkeert, moet de toegang tot een mijnbouwinstallatie
      worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel97
  - number: '97.3'
    text: |-
      Voor de toepassing van de voorgaande leden wordt met alcoholhoudende drank gelijkgesteld elke stof, door het
      gebruik waarvan iemands geestelijke of lichamelijke gesteldheid zodanig wordt beïnvloed, dat daardoor gevaar voor
      de veiligheid kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel97
  - number: '97.4'
    text: Onze Minister kan van het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel97
  - number: '98'
    text: 'Wanneer bij mijnbouwkundig werk op enige wijze:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98
  - number: 98.a
    text: |-
      de veiligheid van daarbij werkzame personen wordt bedreigd, dan wel een of meer personen zich in levensgevaar
      bevinden of bevonden hebben,
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98
  - number: 98.b
    text: |-
      de veiligheid van de scheepvaart of van de visserij wordt bedreigd, dan wel een of meer schepen zich in ernstig
      gevaar bevinden of bevonden hebben, of
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98
  - number: 98.c
    text: ernstig gevaar voor verontreiniging van de zee dreigt of heeft gedreigd,
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98
  - number: 98a.1
    text: |-
      Zones waar een bijzonder risico bestaat, moeten worden afgebakend en er moeten doelmatige waarschuwingsborden
      worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98a
  - number: 98a.2
    text: |-
      Arbeidsplaatsen waar door de aard van het werk gevarenzones, met inbegrip van zones waar valgevaar voor arbeiders
      of gevaar voor vallende voorwerpen bestaat, voorkomen, moeten zoveel mogelijk zijn uitgerust met voorzieningen die
      moeten beletten dat arbeiders deze zones zonder toestemming betreden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98a
  - number: 98a.3
    text: Er moeten doelmatige maatregelen worden getroffen om de arbeiders die de gevarenzone mogen betreden, te beschermen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98a
  - number: 98a.4
    text: De gevarenzones moeten duidelijk zichtbaar worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98a
  - number: 98a.5
    text: Onze Minister kan nadere regelen stellen ter zake van het in de voorgaande leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel98a
  - number: '99'
    text: |-
      Wanneer bij mijnbouwkundig werk twee of meer arbeiders tot een groep verenigd arbeid verrichten, moet een van
      hen zijn aangewezen om toe te zien op al hetgeen nodig is teneinde gevaar voor ongevallen te keren en de vereiste
      maatregelen te nemen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel99
  - number: '100.1'
    text: |-
      Bij mijnbouwkundig werk moet iedere arbeider zich vóór de aanvang van zijn werkzaamheden van de veiligheid op zijn
      werkpunt overtuigen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel100
  - number: '100.2'
    text: |-
      Bij onmiddellijk dreigend gevaar moet het nodige worden verricht tot afwending daarvan en moet de ter plaatse
      verantwoordelijke toezichthoudende persoon onverwijld op de hoogte worden gesteld; de werkzaamheden moeten zo
      nodig terstond worden gestaakt en de betrokken plaats onderscheidenlijk mijnbouwinstallatie moet zo nodig worden
      verlaten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel100
  - number: '100.3'
    text: |-
      De voorman van elke groep moet aan de voorman van de daaropvolgende groep alle bijzonderheden mededelen, die
      in zijn werktijd zijn voorgevallen of waargenomen, voor zover deze op de veiligheid van de bij mijnbouwkundig
      werk werkzame personen van invloed kunnen zijn. Zo nodig moet deze mededeling ter plaatse van het voorvallen of
      waarnemen der bijzonderheden geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel100
  - number: '100.5'
    text: |-
      In geval een mededeling als in het derde lid bedoeld niet kan geschieden vóór het overnemen van de arbeid
      door de eerstvolgende groep, moeten de desbetreffende bijzonderheden worden medegedeeld aan de ter plaatse
      verantwoordelijke toezichthoudende persoon, die ervoor zorg draagt, dat zij tijdig ter kennis van de voorman van de
      eerderbedoelde groep worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel100
  - number: '100.5'
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing op personen, die zelfstandig op een werkpunt werkzaam
      zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel100
  - number: '101.1'
    text: |-
      Een ieder is verplicht bij het verrichten van arbeid bij mijnbouwkundig werk de zorgvuldigheid te betrachten, die
      noodzakelijk is ten einde te voorkomen, dat gevaar voor de veiligheid van de daarbij werkzame personen, van de
      scheepvaart of van de visserij, dan wel voor verontreiniging van de zee optreedt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel101
  - number: '101.2'
    text: Op elke arbeidsplaats en voor elke activiteit moeten veilige werkmethoden worden toegepast.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel101
  - number: '101.3'
    text: |-
      Doelmatige veiligheidsapparatuur moet steeds gebruiksklaar en in goede staat worden gehouden. Bij het onderhoud
      daarvan dient naar behoren rekening te worden gehouden met de uitgeoefende activiteiten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel101
  - number: '101.4'
    text: |-
      Door Onze Minister aangewezen personen, werkzaam bij mijnbouwkundig werk, moeten in voldoende mate zijn geoefend
      in het verrichten van bepaalde, daarbij aan te geven, werkzaamheden of handelingen ter voorkoming of opheffing van
      gevaar als in het eerste lid bedoeld. Onze Minister kan tevens aanwijzingen geven aangaande de registratie van de
      aangewezen personen en van de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel101
  - number: '102.1'
    text: |-
      Een arbeider, die op een mijnbouwinstallatie werkzaamheden verricht, waarbij kennelijk het gevaar bestaat, dat zijn
      kleren of hoofdhaar door enig deel van een drijfwerk of werktuig worden gegrepen, moet de beschikking hebben over
      doelmatige kleding en doelmatige hoofdbedekking.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102
  - number: '102.2'
    text: |-
      Op een plaats op een mijnbouwinstallatie, waar kennelijk gevaar bestaat voor verwonding, moeten de arbeiders de
      beschikking hebben over doelmatige beveiligings- of hulpmiddelen en over zodanige en van zodanige stof vervaardigde
      kleding en andere middelen, dat bij gebruik van het een en ander het gevaar zoveel mogelijk is afgewend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102
  - number: '102.3'
    text: |-
      De in de voorgaande leden bedoelde kleding en middelen moeten overeenkomstig hun bestemming worden gedragen en
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102
  - number: 102a.1
    text: |-
      In dit artikel wordt onder 'persoonlijk beschermingsmiddel' verstaan hetgeen daaronder wordt verstaan in het
      [Besluit persoonlijke beschermingsmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006095
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0006095
  - number: 102a.2
    text: |-
      Het is verboden op een mijnbouwinstallatie of bij mijnbouwkundig werk persoonlijke beschermingsmiddelen
      voorhanden te hebben of te gebruiken die niet in overeenstemming zijn met het bij en krachtens het
      [Besluit persoonlijke beschermingsmiddelen][ref1] bepaalde. Dit verbod geldt niet voor persoonlijke
      beschermingsmiddelen als bedoeld in [artikel 3 van het Besluit persoonlijke beschermingsmiddelen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006095
      [ref2]: https://wetten.overheid.nl/BWBR0006095#Artikel3
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0006095
      - id: ref2
        bwb_id: BWBR0006095
        artikel: '3'
  - number: 102a.3
    text: |-
      Het bij en krachtens [artikel 11, eerste en derde lid, van het Besluit persoonlijke beschermingsmiddelen][ref1]
      bepaalde is van overeenkomstige toepassing met betrekking tot persoonlijke beschermingsmiddelen die
      aanwezig zijn op een mijnbouwinstallatie of worden gebruikt bij mijnbouwkundig werk, met dien verstande dat
      [artikel 11, eerste lid, van het Besluit persoonlijke beschermingsmiddelen][ref2] niet geldt ten aanzien van de
      Inspecteur-Generaal der Mijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0006095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006095#Artikel11
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0006095
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006095
        artikel: '11'
  - number: 102a.4
    text: |-
      De Inspecteur-Generaal der Mijnen is bevoegd herstelling te eisen van persoonlijke beschermingsmiddelen binnen
      een door hem vast te stellen termijn. Voorts kan hij, indien blijkt dat een persoonlijk beschermingsmiddel niet
      in overeenstemming is met het bij en krachtens het [Besluit persoonlijke beschermingsmiddelen][ref1] bepaalde, dat
      persoonlijke beschermingsmiddel voorzien van een merk van afkeuring. Door het aanbrengen van een merk van afkeuring
      verliest de op het persoonlijke beschermingsmiddel aangebrachte CE-markering van rechtswege haar geldigheid. Een
      krachtens de eerste zin gestelde eis moet worden nageleefd door degene tot wie hij is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0006095
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0006095
  - number: '103.1'
    text: |-
      Bij het monteren, plaatsen, onderhouden, herstellen of demonteren van een mijnbouwinstallatie of van onderdelen
      daarvan moeten voldoende maatregelen worden genomen teneinde de arbeiders zoveel mogelijk tegen ongevallen te
      beschermen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.2'
    text: |-
      Vloeren, trappen, ladders, klimijzers, bordessen, gaanderijen, steigers, stellingen, afdekkingen van
      vloeropeningen, mangatdeksels, loopplanken, loopbruggen en leuningen op een mijnbouwinstallatie moeten zijn
      vervaardigd van deugdelijk materiaal en in goede staat van onderhoud verkeren. Zij moeten voldoende breed en
      voldoende sterk zijn in verband met de belasting, waaraan zij zullen worden onderworpen. Zij moeten zodanig zijn
      gemaakt, dat geen onderdeel in sterke mate of ten opzichte van een ander onderdeel ongelijkmatig kan doorbuigen.
      Voor zover zij gevaar opleveren, moeten daartegen doelmatige voorzieningen zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.3'
    text: |-
      Een heistelling, met alles wat daartoe behoort, gebruikt ten behoeve van een opsporingsonderzoek of het winnen van
      delfstoffen, moet voldoen aan de eis van goed en veilig werk en in goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.4'
    text: |-
      Vloeren van ruimten moeten vrij zijn van hobbels, putten of gevaarlijke hellingen; zij moeten vast, stabiel en
      slipvrij zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.5'
    text: |-
      De arbeidsplaatsen waar werkplekken zijn ingericht moeten voldoende thermisch geïsoleerd zijn, rekening houdend met
      de aard van het bedrijf en van de lichamelijke activiteit van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.6'
    text: |-
      Transparante of lichtdoorlatende wanden in ruimten of in de omgeving van werkplekken moeten duidelijk zijn
      gemarkeerd en van veiligheidsmaterialen zijn vervaardigd of op zodanige wijze van die werkplekken zijn afgescheiden
      dat de arbeiders niet met deze wanden in aanraking kunnen komen en ook niet gewond kunnen raken wanneer deze
      breken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '103.7'
    text: |-
      Toegang tot daken die zijn vervaardigd van materialen die niet voldoende weerstand bieden is slechts toegestaan,
      indien uitrusting wordt verstrekt waardoor het betrokken werk veilig kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel103
  - number: '104.1'
    text: |-
      Voor het op een mijnbouwinstallatie verrichten van arbeid, waarbij het gevaar bestaat van een hoogte van 2,50 m
      of meer te vallen, of gevaar voor bedwelming, verstikking, verbranding, vergiftiging of verdrinking als gevolg van
      een val, moet een doelmatige steiger, stelling of werkvloer dan wel een doelmatig bordes zijn aangebracht, tenzij
      het arbeid betreft, welke op voldoend veilige wijze staande op een ladder kan worden verricht. Indien genoemde
      voorzieningen niet of slechts ten dele kunnen worden getroffen, moet tot afwending van het gevaar gebruik worden
      gemaakt van doelmatige veiligheidsgordels, vangnetten of dergelijke, tenzij het gebruik hiervan uit een oogpunt van
      veiligheid niet dienstig is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104
  - number: '104.2'
    text: |-
      Bij werkzaamheden op een mijnbouwinstallatie in bunkers, kokers of dergelijke ruimten, waar het gevaar bestaat te
      worden bedolven onder instortend materiaal of gevaar voor afstorten, moeten zij, die deze werkzaamheden verrichten,
      met behulp van doelmatige veiligheidsgordels op veilige wijze zijn aangebonden en moet een voldoende aantal
      personen aanwezig zijn om hen in geval van gevaar buiten die ruimten te kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104
  - number: '104.3'
    text: |-
      Het op een mijnbouwinstallatie plaatsen, opstapelen en van stapel nemen van voorwerpen of stoffen moet zodanig
      geschieden, dat onverhoeds omvallen of verzakken van de voorwerpen, de stoffen of de stapel zoveel mogelijk wordt
      voorkomen; zo nodig moeten tegen onverhoeds omvallen of verzakken doelmatige voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104
  - number: '104.4'
    text: |-
      Tegen het gevaar op een mijnbouwinstallatie te worden getroffen door vallende of wegvliegende voorwerpen moeten
      doelmatige voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104
  - number: 104a.1
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet er een afstandsbedieningsysteem voor
      noodgevallen worden geïnstalleerd. Dit systeem moet beschikken over controleposten op geschikte locaties die in
      geval van nood kunnen worden gebruikt, indien nodig met inbegrip van controleposten op veilige verzamelpunten en
      in evacuatiestations.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104a
  - number: 104a.2
    text: |-
      De in het eerste lid bedoelde apparatuur moet ten minste systemen omvatten voor ventilatie, het in noodgevallen
      afsluiten van apparatuur die een ontbranding zou kunnen veroorzaken, het voorkomen van het ontsnappen van
      ontvlambare vloeistoffen en gassen, brandbeveiliging en putbewaking.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel104a
  - number: '105.1'
    text: |-
      Het is verboden op een mijnbouwinstallatie een ruimte, die geen natuurlijke of kunstmatige ventilatie heeft of
      die moeilijk toegankelijk is, te betreden of daarin te verblijven, tenzij door of vanwege de bestuurders van
      de betrokken mijnonderneming daartoe schriftelijk toestemming is verleend. Aan deze toestemming worden zodanige
      voorwaarden verbonden, dat de veiligheid voldoende is gewaarborgd. Het geschrift, dat de toestemming bevat, moet
      berusten bij de ter plaatse verantwoordelijke toezichthoudende persoon.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel105
  - number: '105.2'
    text: |-
      Alvorens toestemming als in het eerste lid bedoeld wordt verleend, moet uit een doelmatig onderzoek zijn gebleken,
      dat in de betrokken ruimte, boven de veilig toelaatbare concentratie, geen stof aanwezig is of gevaarlijke of
      schadelijke gassen of dampen voorkomen, dan wel de lucht aldaar uit anderen hoofde voor inademing niet ongeschikt
      is. Doelmatige maatregelen moeten worden genomen teneinde te voorkomen, dat tijdens het verblijf in de ruimte,
      boven de toelaatbare concentratie, zich stof ontwikkelt of verspreidt of gevaarlijke of schadelijke gassen of
      dampen zich ontwikkelen of verspreiden, dan wel de lucht uit anderen hoofde voor inademing ongeschikt wordt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel105
  - number: '105.3'
    text: |-
      Wanneer aan het in het tweede lid gestelde vereiste voor het verlenen van toestemming redelijkerwijs niet kan
      worden voldaan en het betreden van een ruimte als in het eerste lid bedoeld, waarin, boven de veilig toelaatbare
      concentratie, stof aanwezig kan zijn of gevaarlijke of schadelijke gassen of dampen kunnen voorkomen, dan wel de
      lucht uit anderen hoofde voor inademing ongeschikt kan zijn, niettemin noodzakelijk is, mag toestemming desondanks
      worden verleend, doch onder de voorwaarde, dat van doelmatige beschermingsmiddelen wordt gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel105
  - number: '105.4'
    text: |-
      Bij verblijf in een ruimte als in het eerste lid bedoeld moeten een voldoende aantal personen en doelmatige
      middelen in de onmiddellijke nabijheid van de ruimte aanwezig zijn om de daarin aanwezige persoon of personen in
      geval van gevaar onverwijld buiten de ruimte te kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel105
  - number: '106'
    text: |-
      Doelmatige maatregelen moeten worden genomen ter verzekering van de veiligheid van de bij een boring aanwezige
      personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel106
  - number: '107.1'
    text: |-
      Het is verboden een boring op zodanige wijze te verrichten, dat de veiligheid van de op een mijnbouwinstallatie
      werkzame personen kan worden bedreigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel107
  - number: '107.2'
    text: In door Onze Minister bepaalde gevallen mogen boringen slechts op veilige afstand van elkaar worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel107
  - number: '108'
    text: |-
      Indien opsporing of winning van aardolie of aardgas doel van een boring is of indien zich enige aanwijzing
      voordoet, dat aardolie of aardgas bij een boring kan worden aangetroffen, moeten doelmatige maatregelen worden
      genomen teneinde de bij de boring betrokken personen op de hoogte te brengen van de gevaren, aan de aanwezigheid
      van aardolie en aardgas verbonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel108
  - number: '109'
    text: Door Onze Minister aangewezen mijnbouwinstallaties moeten op doelmatige wijze worden bewaakt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel109
  - number: '110'
    text: De bij het winnen van aardolie of aardgas gebruikte inrichtingen moeten doelmatig en veilig zijn samengesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel110
  - number: '111'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens dit hoofdstuk, zomede van het bepaalde bij of krachtens
      de artikelen 149 en 149*a* wordt onder het verrichten van werkzaamheden onder water of onder druk verstaan het
      verrichten van werkzaamheden, daaronder begrepen het in verband met het verrichten van werkzaamheden verblijven:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel111
  - number: 111.a
    text: |-
      in een inrichting onder water, welke kunstmatig wordt geventileerd of waarin het voor ademhaling bestemde
      gasmengsel wordt geregenereerd, dan wel
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel111
  - number: 111.b
    text: onder een druk, die hoger is dan de atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel111
  - number: '112.1'
    text: |-
      Het is verboden bij of ten behoeve van mijnbouwkundig werk duikuitrustingen, dan wel caissons of andere
      inrichtingen voor het verrichten van werkzaamheden onder water of onder druk zonder vergunning van Onze Minister
      te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel112
  - number: '112.2'
    text: |-
      Uitrustingen en inrichtingen als in het eerste lid bedoeld, welke worden gebruikt bij of ten behoeve van
      mijnbouwkundig werk, moeten, met alles wat daartoe behoort, zodanig zijn ingericht en worden onderhouden, dat de
      veiligheid voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel112
  - number: '112.3'
    text: |-
      Tegen de gevaren, welke het gebruik van die uitrustingen en inrichtingen kan opleveren, moeten doelmatige
      voorzorgsmaatregelen worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel112
  - number: '113.1'
    text: |-
      Het is verboden bij of ten behoeve van mijnbouwkundig werk werkzaamheden onder water of onder druk te verrichten,
      tenzij de veiligheid van de daarbij betrokken personen in redelijke mate is gewaarborgd en nadelige of schadelijke
      invloeden voor de gezondheid van die personen in redelijke mate worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: '113.2'
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het eerste lid nadere regelen stellen, welke onder
      meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.a
    text: |-
      de maximale diepte, waarop en de maximale druk, waaronder de werkzaamheden onder water of onder druk mogen worden
      verricht, afhankelijk van de gebruikte uitrustingen of inrichtingen, zomede van de samenstelling van het voor
      ademhaling bestemde gasmengsel en de mogelijkheid tot verversing of regeneratie daarvan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.b
    text: |-
      de wijze van compressie en decompressie bij het verrichten van werkzaamheden en het verblijven onder een druk, die
      hoger is dan de atmosferische druk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.c
    text: de samenstelling, de zuiverheid en de temperatuur van het voor ademhaling bestemde gasmengsel;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.d
    text: de meting en controle van het voor ademhaling bestemde gasmengsel en de wijze van verversing daarvan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.e
    text: de hoeveelheid van het voor ademhaling bestemde gasmengsel, welke in reserve moet zijn;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.f
    text: |-
      de aanwezigheid, toestand en plaats van reserve-apparatuur voor verversing, zuivering en regeneratie van het voor
      ademhaling bestemde gasmengsel;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.g
    text: het gebruik van elektriciteit;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: 113.2.h
    text: de verlichting.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel113
  - number: '114.1'
    text: |-
      Het is verboden bij of ten behoeve van mijnbouwkundig werk werkzaamheden onder water of onder druk langer te
      verrichten dan gedurende een met het oog op de veiligheid en de gezondheid van de bij die werkzaamheden betrokken
      personen ten hoogste verantwoorde tijdsduur, te bepalen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel114
  - number: '114.2'
    text: |-
      Tussen twee perioden, waarin werkzaamheden onder een druk, die hoger is dan de atmosferische druk, worden
      verricht, moeten de bij die werkzaamheden betrokken personen tenminste gedurende een met het oog op hun gezondheid
      voldoende tijd onder normale atmosferische omstandigheden vertoeven; onmiddellijk na het verrichten van zodanige
      werkzaamheden moeten zij gedurende een door Onze Minister te bepalen tijd op een plaats aanwezig zijn, waar
      zo nodig doelmatige maatregelen kunnen worden genomen ter voorkoming of bestrijding van met het verrichten van
      werkzaamheden onder druk verband houdende ziekteverschijnselen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel114
  - number: '115'
    text: |-
      Het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig werk moet
      onder toezicht van een daartoe aangewezen deskundig persoon geschieden door personen, die voldoende ervaring en
      deskundigheid bezitten om zodanige werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel115
  - number: '116.1'
    text: |-
      Een persoon, belast met het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van
      mijnbouwkundig werk, mag zodanige werkzaamheden uitsluitend verrichten, wanneer uit de uitslag van een geneeskundig
      onderzoek als in artikel 149 bedoeld blijkt, dat het verrichten van die werkzaamheden op medische gronden
      toelaatbaar is. Indien uit de uitslag van het geneeskundig onderzoek blijkt, dat het verrichten van werkzaamheden
      onder water of onder druk slechts onder de daarin aangegeven beperkende voorschriften toelaatbaar is, moeten deze
      voorschriften in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel116
  - number: '116.2'
    text: |-
      Indien uit de uitslag van het geneeskundig onderzoek blijkt, dat een in het eerste lid bedoelde persoon
      werkzaamheden onder water of onder druk niet of slechts onder beperkende voorschriften mag verrichten, wordt deze
      uitslag aan de onderzochte personen en aan de Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel116
  - number: '116.3'
    text: |-
      De onderzochte persoon kan binnen 14 dagen, nadat hij van de hem gedane mededeling kennis heeft kunnen nemen,
      schriftelijk aan Onze Minister om een nader geneeskundig onderzoek verzoeken. Met dit onderzoek worden belast een
      of meer door Onze Minister aan te wijzen andere artsen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel116
  - number: '117'
    text: Het is aan een persoon van 16 of 17 jaar verboden werkzaamheden onder water of onder druk te verrichten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel117
  - number: '118.1'
    text: |-
      Alvorens met het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig werk
      wordt aangevangen moeten voldoende voorzorgsmaatregelen zijn genomen voor het zo nodig verlenen van hulp aan en het
      zo nodig redden van de bij die werkzaamheden betrokken personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel118
  - number: '118.2'
    text: |-
      Tijdens het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig werk
      moet ter plaatse van die werkzaamheden een voldoend aantal voldoend deskundige en ervaren personen aanwezig zijn
      ter beveiliging van de personen, die de werkzaamheden verrichten, zomede voldoende geneeskundig personeel of
      geneeskundig hulppersoneel, indien dat personeel niet voldoende snel bereikbaar is of voldoende snel ter plaatse
      aanwezig kan zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel118
  - number: '118.3'
    text: |-
      Voorts moeten tijdens het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van
      mijnbouwkundig werk ter plaatse van die werkzaamheden voldoende en doelmatig reddingsmateriaal, zomede voldoende en
      doelmatige middelen voor het verlenen van eerste hulp voorradig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel118
  - number: '119.1'
    text: |-
      Tijdens het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig werk moet
      de plaats, waar die werkzaamheden worden verricht, voldoende duidelijk zichtbaar zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel119
  - number: '119.2'
    text: |-
      Indien werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig werk vanaf een vaartuig worden
      verricht, moet dit vaartuig zodanig zijn verankerd, dat het zich niet kan verplaatsen, dan wel op andere doelmatige
      wijze ter plaatse worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel119
  - number: '120'
    text: |-
      Het is verboden bij het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van
      mijnbouwkundig werk zonder vergunning van Onze Minister elektrisch te lassen of te snijden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel120
  - number: '121'
    text: |-
      Een ieder, die met het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve van mijnbouwkundig
      werk is belast, dan wel direct bij het verrichten van die werkzaamheden is betrokken, moet in het bezit zijn van
      een door Onze Minister goedgekeurde schriftelijke instructie, vermeldende hetgeen bij die werkzaamheden behoort te
      worden nagekomen of nagelaten in het belang van de veiligheid en ter voorkoming van lichamelijke schade.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel121
  - number: '122.1'
    text: |-
      Van bij of ten behoeve van mijnbouwkundig werk verrichte werkzaamheden onder water of onder druk moet aantekening
      worden gehouden in een register, onder vermelding van door Onze Minister vastgestelde gegevens. Het register moet
      op een doelmatige plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel122
  - number: '122.2'
    text: |-
      Personen, die belast zijn met het verrichten van werkzaamheden onder een hogere dan de atmosferische druk bij of
      ten behoeve van mijnbouwkundig werk, moeten in door Onze Minister aangewezen gevallen een door hem vastgesteld
      bewijs van deelneming aan die werkzaamheden gedurende door hem bepaalde tijden bij zich dragen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel122
  - number: '123.1'
    text: |-
      Bij mijnbouwkundig werk moeten het vervoer, het laden, het lossen en het zich ontdoen van ontplofbare stoffen
      of van ontstekers onder toezicht van een daartoe aangewezen deskundig persoon op veilige en doelmatige wijze
      geschieden door personen, die voldoende met de gevaren daarvan bekend zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel123
  - number: '123.2'
    text: |-
      Het is verboden zich bij mijnbouwkundig werk van ontplofbare stoffen of ontstekers te ontdoen zonder tijdig
      voorafgaande, doelmatige kennisgeving aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel123
  - number: '124.1'
    text: |-
      Het is verboden bij mijnbouwkundig werk zonder vergunning van Onze Minister ontplofbare stoffen of
      ontstekingsmiddelen te gebruiken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel124
  - number: '124.2'
    text: |-
      Indien een vergunning als in het eerste lid bedoeld betrekking heeft op het gebruik van ontplofbare stoffen ten
      behoeve van een verkenningsonderzoek, kan Onze Minister in overeenstemming met Onze Minister van Landbouw en
      Visserij, daarbij voorschriften geven ten behoeve van de visserij en het in stand houden van de levende rijkdommen
      van de zee.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel124
  - number: '125.1'
    text: |-
      Het is verboden bij mijnbouwkundig werk ontplofbare stoffen of ontstekingsmiddelen te gebruiken, die niet door Onze
      Minister zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel125
  - number: '125.2'
    text: |-
      Bij mijnbouwkundig werk moeten ontplofbare stoffen en ontstekingsmiddelen doelmatig en op veilige wijze worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel125
  - number: '125.3'
    text: |-
      Bij een verkenningsonderzoek moeten niet tot ontploffing gekomen ladingen op veilige wijze en, indien mogelijk,
      onverwijld onschadelijk worden gemaakt en mogen uitsluitend ladingen worden gebruikt, die door inwerking van water
      binnen een door Onze Minister te bepalen tijd van ten hoogste 12 uur onschadelijk zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel125
  - number: '126.1'
    text: |-
      Voldoende maatregelen moeten worden genomen, dat bij mijnbouwkundig werk alleen deugdelijke ontplofbare stoffen en
      ontstekingsmiddelen voor gebruik ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel126
  - number: '126.2'
    text: |-
      Onze Minister bepaalt voor elke soort ontplofbare stof en voor elke soort ontsteker de maximale tijdsduur van
      opslag.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel126
  - number: '126.3'
    text: |-
      Ontplofbare stoffen en ontstekers, welke niet meer deugdelijk zijn of waarvoor de krachtens het tweede lid bepaalde
      tijdsduur is verstreken, moeten op veilige wijze worden verwijderd en zo nodig worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel126
  - number: '127.1'
    text: |-
      Het is verboden zonder vergunning van Onze Minister op een mijnbouwinstallatie een magazijn voor ontplofbare
      stoffen of ontstekers in te richten of in gebruik te nemen en in gebruik te houden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel127
  - number: '127.2'
    text: |-
      Bij een aanvrage om vergunning voor het verrichten van een magazijn moeten duidelijke tekeningen worden overgelegd,
      waaruit de ligging en de inrichting van het magazijn blijken, alsmede een opgave van de hoeveelheden en soorten
      ontplofbare stoffen of ontstekers, welke in het magazijn zullen worden opgeborgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel127
  - number: '127.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op aanvragen om vergunning voor het in gebruik nemen of in gebruik
      houden van een magazijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel127
  - number: '127.4'
    text: |-
      Het is aan andere personen dan hen, die belast zijn met de uitgifte of het vervoer van ontplofbare stoffen en
      ontstekers of het toezicht daarop, verboden een magazijn als in het eerste lid bedoeld te betreden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel127
  - number: '128.1'
    text: 'Bij mijnbouwkundig werk mag de uitgifte van ontplofbare stoffen en ontstekers uitsluitend geschieden:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel128
  - number: 128.1.a
    text: door daartoe aangewezen betrouwbare personen of door doelmatige zelfbediening;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel128
  - number: 128.1.b
    text: aan personen, die tot schieten bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel128
  - number: '128.2'
    text: De uitgifte moet op veilige en doelmatige wijze plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel128
  - number: '128.3'
    text: Van de uitgifte moet aantekening worden gehouden in een register.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel128
  - number: '129'
    text: |-
      Bij mijnbouwkundig werk moeten het medenemen van ontplofbare stoffen en ontstekers uit een magazijn en het
      overbrengen naar de werkpunten en omgekeerd, zomede het bewaren bij de werkpunten op veilige en doelmatige wijze
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel129
  - number: '130.1'
    text: |-
      Het is aan anderen dan de daartoe aangewezen personen verboden bij mijnbouwkundig werk schietwerkzaamheden te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel130
  - number: '130.2'
    text: |-
      Aangewezen mogen uitsluitend worden personen, die voldoende betrouwbaarheid en geschiktheid bezitten en die tevens
      met goed gevolg een examen hebben afgelegd, dat in het bijzonder op de door hen te verrichten schietwerkzaamheden
      betrekking had.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel130
  - number: '130.3'
    text: |-
      Aan de Inspecteur-Generaal der Mijnen moet opgave worden gedaan van door Onze Minister gewenste gegevens over de
      bij mijnbouwkundig werk voor schietwerkzaamheden aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel130
  - number: '130.4'
    text: |-
      Bij schietwerkzaamheden moet tenminste één voldoende geïnstrueerd en deskundig persoon met de dagelijkse controle
      op die werkzaamheden zijn belast.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel130
  - number: '131'
    text: |-
      Voor en na het bij mijnbouwkundig werk afvuren van ladingen moeten doelmatige veiligheidsmaatregelen worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel131
  - number: '132.1'
    text: |-
      Aan een mijnonderneming, waarin - of waarvoor door anderen - een opsporingonderzoek wordt ingesteld, dan wel
      delfstoffen worden gewonnen, moet een doelmatig georganiseerde brandbestrijdingsdienst zijn verbonden, die is
      belast met het voorbereiden en indien nodig uitvoeren van maatregelen ter voorkoming onderscheidenlijk bestrijding
      van brand en ontploffing van mijnbouwinstallaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel132
  - number: '132.2'
    text: |-
      Onze Minister kan van het eerste lid ontheffing verlenen; hij kan daarbij goedkeuren, dat de eigenaren van bepaalde
      mijnondernemingen voor de uitvoering van dat lid een gemeenschappelijke brandbestrijdingsdienst vormen of gebruik
      maken van de diensten van een bestaande brandbestrijdingsdienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel132
  - number: '133.1'
    text: |-
      Een brandbestrijdingsdienst moet bestaan uit een voldoende aantal op het gebied van de bestrijding van brand en
      ontploffing en in het gebruik van brandblusmiddelen voldoend geoefende personen en moet beschikken over voldoende
      doelmatig materieel ter bestrijding van brand.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel133
  - number: '133.2'
    text: |-
      Voldoende maatregelen moeten worden genomen opdat voldoende personen als in het eerste lid bedoeld, alsmede het
      nodige materieel zo nodig onverwijld naar de betrokken mijnbouwinstallatie kunnen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel133
  - number: '134'
    text: |-
      Bij een brandbestrijdingsdienst moet een doelmatig register aanwezig zijn, waarin aantekening wordt gehouden van
      personen als in artikel 133, eerste lid, bedoeld en van de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel134
  - number: '135.1'
    text: |-
      Alle nodige doelmatige maatregelen moeten worden genomen om brand en ontploffing te voorkomen en om brand op te
      sporen, te bestrijden en de uitbreiding ervan tegen te gaan. Zonodig moeten brandbarrières worden aangebracht met
      het oog op de afscheiding van zones waar brandrisico bestaat.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '135.2'
    text: 'Op een mijnbouwinstallatie moeten op doelmatige plaatsen aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: 135.2.a
    text: een voldoende aantal branddetectie-, brandbeschermings- en alarmsystemen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: 135.2.b
    text: een voldoende aantal doelmatige en voor onmiddellijk gebruik gereed zijnde brandblusmiddelen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: 135.2.c
    text: doelmatige en zo nodig automatisch werkende inrichtingen voor brandblussing of branddoving.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '135.3'
    text: |-
      De in het eerste lid bedoelde middelen en inrichtingen moeten in goede staat van onderhoud verkeren; de
      inrichtingen moeten telkens na verloop van ten hoogste een jaar op hun bruikbaarheid worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '135.4'
    text: |-
      Op een bemande mijnbouwinstallatie moet een voldoende aantal personen met voldoende ervaring in het gebruik van de
      in het eerste lid bedoelde middelen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '135.5'
    text: |-
      Niet-automatische brandbestrijdingsmiddelen moeten gemakkelijk bereikbaar en te bedienen zijn en zo nodig tegen
      beschadiging zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '135.6'
    text: |-
      Branddetectie- en brandbeschermingssystemen, inrichtingen voor brandblussing of branddoving en alarmsystemen moeten
      zijn afgeschermd tegen ongelukken en wel op zodanige wijze dat hun functies in noodgevallen operationeel blijven.
      Zo nodig dienen dergelijke systemen in dubbele uitvoering te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel135
  - number: '136.1'
    text: |-
      Door de bestuurders van een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt
      ingesteld, dan wel delfstoffen worden gewonnen, dient jaarlijks aan de Inspecteur-Generaal der Mijnen een op
      het volgende kalenderjaar betrekking hebbend brandbeschermingsplan voor alle bij dat onderzoek of die winning in
      gebruik zijnde mijnbouwinstallaties te worden toegezonden; het moet tenminste 14 dagen vóór de aanvang van het
      kalenderjaar in zijn bezit zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel136
  - number: '136.2'
    text: |-
      In geval in de loop van enig kalenderjaar met een opsporingsonderzoek of het winnen van delfstoffen wordt
      begonnen, dient door de bestuurders van de betrokken mijnonderneming tijdig tevoren een op dat jaar en op de bij
      dat onderzoek of die winning te gebruiken mijnbouwinstallaties betrekking hebbend brandbeschermingsplan aan de
      Inspecteur-Generaal der Mijnen te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel136
  - number: '136.3'
    text: |-
      Het brandbeschermingsplan dient gedetailleerde gegevens te bevatten over de te nemen maatregelen voor bescherming
      tegen brand, voor brandmelding en voor bestrijding van het uitbreken en de uitbreiding van branden en moet op de
      mijnbouwinstallatie beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel136
  - number: '136.4'
    text: Onze Minister kan nadere regelen stellen ter uitvoering van het derde lid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel136
  - number: '136.5'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, bepalen dat bij de bestrijding van een brand geen door hem daarbij aan te
      geven brandblusmiddelen, welke de zee kunnen verontreinigen, mogen worden aangewend.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel136
  - number: '137.1'
    text: |-
      Er moet een explosiepreventieplan worden opgesteld met gedetailleerde gegevens over de vereiste apparatuur en de
      vereiste maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel137
  - number: '137.2'
    text: |-
      Doelmatige maatregelen moeten worden genomen voor het evalueren van de aanwezigheid en het meten van de
      concentratie van potentieel explosieve stoffen in de atmosfeer.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel137
  - number: '137.3'
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet bewakingsapparatuur voor het
      automatisch en continu registreren van de gasconcentraties op bepaalde plaatsen, automatische alarminstallaties
      en voorzieningen voor de automatische afsluiting van de stroomtoevoer naar elektrische installaties en voor het
      automatisch stopzetten van verbrandingsmotoren worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel137
  - number: '137.4'
    text: Van automatische metingen moeten de meetwaarden worden geregistreerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel137
  - number: '138.1'
    text: |-
      Met betrekking tot het op een mijnbouwinstallatie opstellen, bewaren en vervoeren van flessen en andere vaten, die
      gassen in samengeperste, tot vloeistof verdichte of onder druk in vloeistof opgeloste toestand bevatten, en de op
      die flessen en andere vaten te gebruiken afsluiters en andere appendages moeten ter voorkoming van gevaar voldoende
      voorzieningen zijn getroffen en doelmatige maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel138
  - number: '138.2'
    text: Bedoelde flessen en andere vaten moeten van een duidelijke aanduiding betreffende hun inhoud zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel138
  - number: '139.1'
    text: |-
      Het is verboden op een mijnbouwinstallatie met vuur en ontplofbare of licht ontvlambare stoffen op niet veilige
      wijze om te gaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '139.2'
    text: |-
      Ten aanzien van een plaats of een ruimte op een mijnbouwinstallatie, waar stoffen, voor welke verhoogd brandgevaar
      bestaat, worden verkregen, behandeld, verwerkt, gebezigd, vervoerd of opgeslagen, moeten doelmatige maatregelen
      worden genomen ter voorkoming van brand.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '139.3'
    text: |-
      Ten aanzien van een plaats of een ruimte op een mijnbouwinstallatie, waar stoffen, die direct of indirect gevaar
      voor ontploffing kunnen veroorzaken, worden verkregen, behandeld, verwerkt, gebezigd, vervoerd of opgeslagen,
      en ten aanzien van de naaste omgeving daarvan, moeten doelmatige maatregelen worden genomen ter voorkoming van
      ontploffing. Deze stoffen mogen aldaar niet in een grotere hoeveelheid voorhanden worden gehouden dan voor de goede
      gang van het werk is vereist.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '139.4'
    text: |-
      Uitsluitend bij noodzakelijke werkzaamheden van tijdelijke aard mag op plaatsen of in ruimten als in het tweede
      of het derde lid bedoeld en in de naaste omgeving daarvan open vuur worden gebruikt, doch dan is voor deze
      werkzaamheden in elk geval een schriftelijke toestemming van de bedrijfsleiding vereist, waarin doelmatige
      veiligheidsmaatregelen moeten zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '139.5'
    text: |-
      De krachtens artikel 2 met betrekking tot de in het tweede en derde lid bedoelde maatregelen door Onze Minister
      vastgestelde nadere regelen moeten onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: 139.5.a
    text: de wijze van verlichting;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: 139.5.b
    text: het aanwezig hebben van gereedschap, apparaten, werktuigen, voertuigen of onderdelen daarvan;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: 139.5.c
    text: |-
      het bij zich hebben van rookmateriaal, rookgereedschap, lucifers, aanstekers of andere middelen om vuur te
      verwekken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '139.6'
    text: |-
      Onze Minister kan van het tweede, derde en vierde lid ontheffing verlenen, alsook met betrekking tot het aldaar
      bepaalde nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel139
  - number: '140.1'
    text: Het is verboden op een mijnbouwinstallatie te roken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel140
  - number: '140.2'
    text: |-
      Het eerste lid geldt niet voor andere dan de in de artikel 139, tweede of derde lid, bedoelde plaatsen of ruimten,
      die door de bestuurders van de betrokken mijnonderneming, onder goedkeuring van Onze Minister, als plaatsen of
      ruimten waar roken is toegestaan zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel140
  - number: '142'
    text: |-
      De door Onze Minister daartoe aangewezen onderdelen van een mijnbouwinstallatie dienen doelmatig te zijn geaard of
      anderszins tegen blikseminslag te zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel142
  - number: '143.1'
    text: |-
      Aan een mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming, waarbij ten behoeve van
      mijnbouwkundig werk tenminste een door Onze Minister te bepalen aantal arbeiders in dienst is, moet een
      bedrijfsgeneeskundige dienst zijn verbonden. Deze dienst moet zijn gevestigd op een door de bestuurders van de
      onderneming, onder goedkeuring van Onze Minister, te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '143.2'
    text: |-
      Aan het eerste lid kan mede worden voldaan door het oprichten en instandhouden van een bedrijfsgeneeskundige dienst
      tezamen met een of meer eigenaren van andere ondernemingen, dan wel door aansluiting en aangesloten blijven bij
      een bestaande bedrijfsgeneeskundige dienst, verbonden aan een of meer andere ondernemingen, mits deze dienst is
      gevestigd in een door Onze Minister goedgekeurde plaats en het beheer van de gezamenlijke bedrijfsgeneeskundige
      dienst is opgedragen aan een rechtspersoon als in het vierde lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '143.3'
    text: Onze Minister kan van het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '143.4'
    text: |-
      Het beheer van een bedrijfsgeneeskundige dienst kan worden opgedragen aan een rechtspersoon, mits deze niet beoogt
      winst te maken en geen ander doel heeft dan de bevordering van de preventieve gezondheidszorg en het verrichten van
      werkzaamheden als in artikel 147, tweede lid, bedoeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '143.5'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot de eisen waaraan een bedrijfsgeneeskundige dienst moet
      voldoen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '143.6'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot het bijhouden en verstrekken van statistische gegevens,
      alsmede omtrent het uitbrengen van verslagen van bedrijfsgeneeskundige diensten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel143
  - number: '144.1'
    text: |-
      Een bedrijfsgeneeskundige dienst als in artikel 143, eerste lid of tweede lid, bedoeld behoeft erkenning door Onze
      Minister; de erkenning wordt uitsluitend verleend op een daartoe strekkende aanvraag.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: '144.2'
    text: |-
      Een zodanige erkenning is niet vereist, indien de bedrijfsgeneeskundige dienst reeds is erkend ingevolge
      [artikel 224 van het Mijnreglement 1964][ref1] (*Stb.* 538).


      [ref1]: https://wetten.overheid.nl/BWBR0002474#Artikel224
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0002474
        artikel: '224'
  - number: '144.3'
    text: |-
      De erkenning kan worden verleend met een beperking ten aanzien van haar geldingsduur, dan wel worden geweigerd,
      indien:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: 144.3.a
    text: |-
      gegronde vrees bestaat, dat de bedrijfsgeneeskundige dienst een of meer der in artikel 146, onder *a*, *b*,
      *d*-*i*, *k* en *l*, bedoelde taken niet of niet doeltreffend zal vervullen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: 144.3.b
    text: de bedrijfsgeneeskundige dienst andere taken vervult dan in de artikelen 146 en 147, tweede lid, bedoeld;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: 144.3.c
    text: de bedrijfsgeneeskundige dienst niet voldoet aan de artikelen 143, 145 en 147.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: '144.4'
    text: |-
      In geval van een omstandigheid als in het derde lid bedoeld kan Onze Minister een verleende erkenning ten aanzien
      van haar verdere geldingsduur beperken, dan wel intrekken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel144
  - number: '145.1'
    text: |-
      De aan een bedrijfsgeneeskundige dienst verbonden bedrijfsartsen en assistent-bedrijfsartsen zijn verplicht tot
      geheimhouding tegenover hun werkgevers en tegenover de betrokken bestuurders van alle gegevens omtrent personen en
      omstandigheden, welke zij op grond van hun geheimhoudingsplicht niet aan derden mogen bekend maken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel145
  - number: '145.2'
    text: |-
      De verplichting tot geheimhouding van de in het eerste lid bedoelde gegevens rust mede op het geneeskundige en
      administratieve personeel van bedrijfsgeneeskundige diensten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel145
  - number: '146'
    text: |-
      De bedrijfsgeneeskundige dienst bevordert, in verband met de arbeid en het arbeidsmilieu in de onderneming of
      ondernemingen, waaraan hij is verbonden, de maatregelen, welke een doeltreffende preventieve gezondheidszorg in die
      onderneming of ondernemingen verzekeren. Dienovereenkomstig omvat zijn taak:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.a
    text: het verrichten van geneeskundig onderzoek bij het indiensttreden van de arbeider;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.b
    text: het verrichten van een geneeskundig onderzoek als in artikel 149 bedoeld;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.c
    text: het verrichten van geneeskundig onderzoek van arbeiders anderes dan onder *a* en *b* bedoeld;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.d
    text: het doen van aanbevelingen tot het voorkomen van beroepsziekten;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.e
    text: het medewerken aan het bestrijden van ongevallen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.f
    text: het medewerken aan revalidatie in het bedrijf;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.g
    text: |-
      het medewerken aan het weren en bestrijden van schadelijke invloeden, waaraan de arbeider in verband met zijn
      arbeid kan zijn blootgesteld, zoals van schadelijke gassen, dampen, nevels, stralingen, schadelijk stof of
      schadelijk of hinderlijk geluid, dan wel andere schadelijke of hinderlijke trillingen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.h
    text: |-
      het houden van toezicht aangaande de omstandigheden, waaronder de arbeid wordt verricht, zoals temperatuur,
      vochtigheid, luchtbeweging, verlichting, lawaai, zindelijkheid en het optreden van stof;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.i
    text: |-
      het houden van toezicht aangaande schadelijke invloeden, welke de arbeider kan ondervinden door de aard van zijn
      arbeid, zijn werktijden, zijn arbeidsmilieu of het arbeidstempo, zoals invloeden tengevolge van ploegenarbeid,
      stukwerk of het automatiseren van het produktieproces;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.j
    text: het medewerken aan het bevorderen van goede arbeidsverhoudingen in de onderneming;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.k
    text: het houden van een bedrijfsgeneeskundig spreekuur;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.l
    text: |-
      het verlenen van eerste hulp bij ongevallen of ziekte en het doen van aanbevelingen tot het organiseren van de
      eerstehulpdienst en tot het plaatsen van het aan deze dienst verbonden personeel, alsmede het opleiden en het
      instrueren van dit personeel;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.m
    text: het medewerken aan het verrichten van arbeidsanalyse;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.n
    text: het medewerken aan het bestrijden van ziekteverzuim;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.o
    text: het optreden als medisch adviseur van sociale fondsen en instellingen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: 146.p
    text: |-
      het doen van andere aanbevelingen en het verrichten van andere werkzaamheden, die aan het in dit artikel gestelde
      doel dienstbaar kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel146
  - number: '147.1'
    text: |-
      Een bedrijfsgeneeskundige dienst geeft bij het uitoefenen van de in artikel 146 omschreven taak geen adviezen
      en past geen behandelingen toe, welke treden in de verhouding van de patiënt tot zijn huisarts; hij onthoudt
      zich na het constateren van een ziekte of afwijking van verrichtingen, welke behoren tot het terrein, waarop
      consultatiebureaus en soortgelijke instellingen van gezondheidszorg plegen werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: '147.2'
    text: 'Het eerste lid geldt niet:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.a
    text: |-
      voor zover een huisarts, een consultatiebureau of een instelling als in dat lid bedoeld een verzoek deed tot het
      behandelen van de patiënt en deze daartegen geen bezwaar heeft;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.b
    text: |-
      indien en zolang een patiënt door weersomstandigheden of anderszins niet van de betrokken mijnbouwinstallatie naar
      de vaste wal kan worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.c
    text: |-
      indien een bedrijfsgeneeskundige dienst aan een persoon, die werkzaam is in een onderneming, waaraan die dienst is
      verbonden, eerste hulp bij een ongeval of een beroepsziekte heeft verleend, ten aanzien van de verdere genees- of
      heelkundige behandeling met betrekking tot dat ongeval of die ziekte, in gevallen, waarin de patiënt met zodanige
      behandeling instemt en hij ten gevolge van het ongeval of de ziekte:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.c.1°
    text: zijn arbeid niet heeft onderbroken, of
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.c.2°
    text: |-
      zijn arbeid heeft onderbroken, doch ambulant blijft en de behandeling van het letsel of de ziekte naar verwachting
      van de bedrijfsgeneeskundige dienst een door Onze Minister te bepalen termijn van ten hoogste vijf weken, welke
      termijn naar gelang van de aard van het uitgeoefende bedrijf kan verschillen, niet zal overschrijden;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.2.d
    text: |-
      indien in gevallen als bedoeld onder *c*, 2°, na de daarbedoelde termijn nog behoefte aan behandeling blijkt te
      bestaan en de patiënt en diens huisarts met voortzetting van de behandeling door de bedrijfsgeneeskundige dienst
      instemmen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: '147.3'
    text: |-
      Een bedrijfsgeneeskundige dienst mag verdere genees- of heelkundige behandeling als in het tweede lid, onder
      *c*, bedoeld slechts verstrekken, indien daartoe op een desbetreffende aanvraag door Onze Minister toestemming
      is verleend. Zodanige toestemming wordt verleend, indien aan de bedrijfsgeneeskundige dienst een zodanig
      aantal ter zake bekwame artsen en geneeskundige hulpkrachten is verbonden en hij kan beschikken over zodanige
      vervoersmogelijkheden en een zodanige outillage, dat bedoelde behandeling op verantwoorde wijze kan geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: '147.4'
    text: 'Een toestemming als in het derde lid bedoeld wordt niet verleend dan onder de voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.4.a
    text: |-
      dat de bedrijfsgeneeskundige dienst in gevallen als bedoeld in het tweede lid, onder *c*, 2°, zodra met de verdere
      genees- of heelkundige behandeling van een persoon is begonnen, de huisarts van de betrokken persoon daarvan in
      kennis moet stellen, onder opgave van de aard van het letsel of de beroepsziekte van die persoon;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.4.b
    text: |-
      dat de bedrijfsgeneeskundige dienst dag en nacht beschikbaar moet zijn voor het met gebruikmaking van die
      toestemming verstrekken van genees- en heelkundige behandeling;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: 147.4.c
    text: |-
      dat in verblijven voor de voorlopige verzorging van gewonden en zieken en in eet- en recreatieverblijven een
      duidelijk leesbare kennisgeving op een voor een ieder waarneembare plaats moet zijn opgehangen, vermeldende
      dat een persoon, die door een bedrijfsongeval of een beroepsziekte is getroffen, te allen tijde bevoegd is
      om zich na de verlening van eerste hulp verder te doen behandelen door een door hemzelf gekozen, niet aan de
      bedrijfsgeneeskundige dienst verbonden, arts.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: '147.5'
    text: |-
      Een toestemming als in het derde lid bedoeld kan door Onze Minister worden ingetrokken, indien de betrokken
      bedrijfsgeneeskundige dienst de in het tweede lid, onder *c*, bedoelde behandeling niet meer op doeltreffende wijze
      verstrekt of kan verstrekken, dan wel indien een voorwaarde als in het vierde lid bedoeld niet wordt nagekomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel147
  - number: '149.1'
    text: |-
      Personen, die worden belast met het verrichten van werkzaamheden op een mijnbouwinstallatie, waarbij zij tezamen
      met een of meer anderen langer dan 72 uur ononderbroken op zodanige installatie zullen doorbrengen, moeten tevoren
      worden onderworpen aan een geneeskundig onderzoek, gericht op de gevaren, welke hun geestelijke of lichamelijke
      gesteldheid voor de gezondheid of de veiligheid van anderen kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: '149.2'
    text: |-
      Personen, die worden belast met het verrichten van werkzaamheden onder water of onder druk bij of ten behoeve
      van mijnbouwkundig werk, zomede personen, die worden belast met het verrichten van werkzaamheden, welke door Onze
      Minister op grond van de bijzondere gevaren voor de gezondheid van de daarmede belaste personen zijn aangewezen,
      moeten tevoren worden onderworpen aan een geneeskundig onderzoek, gericht op de bijzondere gevaren voor de
      gezondheid, waaraan zij bij de uitoefening van hun werkzaamheden kunnen blootstaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: '149.3'
    text: |-
      Voor een persoon, die wordt belast met het verrichten van werkzaamheden als in het eerste of tweede lid bedoeld,
      ten aanzien van wie door bijzondere omstandigheden een voorafgaand geneeskundig onderzoek als in die leden bedoeld,
      in verband met de geregelde gang van de bedrijfsarbeid bezwaarlijk of onmogelijk is, kan het onderzoek plaats
      hebben, nadat hij met de desbetreffende werkzaamheden is belast, mits redelijkerwijs kan worden aangenomen: ten
      aanzien van een persoon, die wordt belast met het verrichten van werkzaamheden als in het eerste lid bedoeld,
      dat zijn geestelijke of lichamelijke gesteldheid geen gevaar voor de gezondheid of de veiligheid van anderen kan
      opleveren; ten aanzien van een persoon die wordt belast met het verrichten van werkzaamheden als in het tweede
      lid bedoeld, dat de te verrichten werkzaamheden geen gevaar voor zijn gezondheid zullen opleveren. In een geval
      als vorenbedoeld moet het onderzoek zo spoedig als zulks mogelijk is plaatsvinden. Het onderzoek kan achterwege
      blijven, indien het niet heeft kunnen plaatsvinden gedurende de tijd, dat de betrokken persoon met het verrichten
      van de werkzaamheden was belast.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: '149.4'
    text: |-
      Het in het eerste en tweede lid bedoelde geneeskundige onderzoek moet periodiek worden herhaald en wel ten aanzien
      van personen, belast met het verrichten van: werkzaamheden als in het eerste lid bedoeld: telkens binnen ten
      hoogste twee jaren; werkzaamheden onder water of onder druk: telkens binnen ten hoogste één jaar, onverminderd het
      zesde lid; werkzaamheden als in het tweede lid bedoeld, anders dan onder water of onder druk: telkens binnen een
      door Onze Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: '149.5'
    text: |-
      Onze Minister kan in bijzondere gevallen bepalen, dat personen, belast met het verrichten van werkzaamheden als
      in het eerste lid bedoeld, tussentijds moeten worden onderworpen aan een geneeskundig onderzoek, gericht op de
      gevaren, welke hun geestelijke of lichamelijke gesteldheid voor de gezondheid of de veiligheid van anderen kan
      opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: '149.6'
    text: |-
      Onze Minister kan voorschrijven, dat het periodieke onderzoek van personen, die zijn belast met het verrichten
      van werkzaamheden onder water of onder druk, afhankelijk van de frequentie waarmede, de diepte waarop of de druk
      waaronder deze werkzaamheden moeten worden verricht, telkens binnen een kortere, door hem te bepalen termijn moet
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149
  - number: 149a.1
    text: |-
      Een geneeskundig onderzoek als in artikel 149 bedoeld wordt verricht door een arts, die terzake deskundig is, dan
      wel door de aan de betrokken onderneming verbonden bedrijfsgeneeskundige dienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.2
    text: |-
      Onze Minister kan, met afwijking van het eerste lid, artsen aanwijzen voor het verrichten van het geneeskundige
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.3
    text: |-
      Het in artikel 149, eerste lid, bedoelde geneeskundige onderzoek en, indien medisch noodzakelijk, het in artikel
      149, vierde of vijfde lid, bedoelde geneeskundige onderzoek van personen, die zijn belast met het verrichten van
      werkzaamheden als in het eerste lid van dat artikel bedoeld, moeten onder meer een radiografisch onderzoek van de
      longen omvatten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.4
    text: |-
      Met betrekking tot het geneeskundige onderzoek van personen, die worden of zijn belast met het verrichten van
      werkzaamheden onder water of onder druk, stelt Onze Minister eisen betreffende:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.4.a
    text: de gegevens, welke bij het onderzoek moeten worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.4.b
    text: de wijze, waarop het onderzoek moet worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.4.c
    text: |-
      de wijze van beoordeling van de geschiktheid of ongeschiktheid van personen voor het verrichten van werkzaamheden
      onder water of onder druk;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149a.4.d
    text: |-
      de wijze van registratie, verwerking en bewaring, alsmede de tijdsduur van bewaring van de uit het onderzoek
      verkregen gegevens.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149a
  - number: 149b.1
    text: |-
      Een persoon, belast met het verrichten van werkzaamheden als in artikel 149, eerste lid, bedoeld, mag zodanige
      werkzaamheden niet verrichten, indien uit de uitslag van een geneeskundig onderzoek blijkt, dat zijn geestelijke of
      lichamelijke gesteldheid gevaar voor de gezondheid of de veiligheid van anderen kan opleveren.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149b
  - number: 149b.2
    text: |-
      Indien uit de uitslag van een geneeskundig onderzoek blijkt, dat de geestelijke of lichamelijke gesteldheid van de
      onderzochte persoon gevaar voor de gezondheid of de veiligheid van anderen kan opleveren, wordt deze uitslag aan
      die persoon en aan de Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149b
  - number: 149b.3
    text: |-
      De onderzochte persoon kan binnen 14 dagen, nadat hij van de hem gedane mededeling kennis heeft kunnen nemen,
      schriftelijk aan Onze Minister om een nader geneeskundig onderzoek verzoeken. Met dit onderzoek worden belast een
      of meer door Onze Minister aan te wijzen andere artsen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel149b
  - number: '150.1'
    text: |-
      Op een bemande mijnbouwinstallatie moet op een voldoende aantal doelmatig gekozen plaatsen goed drinkwater aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '150.2'
    text: |-
      Indien personen aanwezig zijn op een mijnbouwinstallatie, niet zijnde een bemande mijnbouwinstallatie, moeten zij
      over goed drinkwater kunnen beschikken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '150.3'
    text: |-
      De aanvoer, de bereiding, de bewaring en de distributie van drinkwater op een mijnbouwinstallatie moeten op
      doelmatige wijze geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '150.4'
    text: |-
      Op een bemande mijnbouwinstallatie moet een doelmatig register worden bijgehouden waarin gegevens betreffende de
      kwaliteit van het drinkwater alsmede betreffende handelingen en gebeurtenissen, die van invloed zijn of kunnen zijn
      op de kwaliteit van het drinkwater, worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '150.5'
    text: De kwaliteit van drinkwater moet regelmatig worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '150.6'
    text: Onze Minister kan nadere regelen stellen ter uitvoering van het in de voorgaande leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel150
  - number: '151.1'
    text: |-
      Op een bemande mijnbouwinstallatie moet op een voldoende aantal doelmatig gekozen plaatsen een voldoende aantal
      doelmatige urinoirs en naar de seksen der gebruikers gescheiden privaten beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel151
  - number: '151.2'
    text: |-
      De privaten en urinoirs moeten zodanig zijn geplaatst, ingericht en worden onderhouden, dat stank zoveel mogelijk
      wordt vermeden; zij dienen regelmatig te worden gereinigd en zo nodig op doelmatige wijze te worden ontsmet.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel151
  - number: '151.3'
    text: |-
      De toegang of toegangsruimte tot elk der privaten moet zijn voorzien van een duidelijk waarneembare aanduiding van
      de sekse der gebruikers, voor welke het bestemd is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel151
  - number: '152.1'
    text: |-
      Op een mijnbouwinstallatie is het bewerken van voorwerpen, waarbij zand of een andere stof, welke kwarts of een
      andere vorm van kristallijn silicium-dioxyde bevat, die voorwerpen met grote snelheid treft, verboden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152
  - number: '152.2'
    text: |-
      Het eerste lid geldt niet ten aanzien van bewerkingen, waardoor een laag materiaal op voorwerpen wordt aangebracht,
      alsmede niet ten aanzien van het bewerken van bougies, voor zover dit geschiedt in toestellen, welke zodanig zijn
      ingericht, dat zich van daaruit geen stof kan verspreiden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152
  - number: '152.3'
    text: Onze Minister kan van het eerste lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152
  - number: 152a.1
    text: |-
      In dit artikel wordt onder 'asbest', 'crocidoliet', 'asbesthoudende produkten' en 'crocidoliethoudende produkten'
      verstaan hetgeen daaronder wordt verstaan in het [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 152a.2
    text: |-
      Bij werkzaamheden bij mijnbouwkundig werk is het bij en krachtens
      [hoofdstuk 4, afdeling 5 van het Arbeidsomstandighedenbesluit][ref1] van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling5
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '5'
  - number: 152a.2.a
    text: |-
      de krachtens [artikel 31 van de Mijnwet continentaal plat][ref1] aangewezen ambtenaren in de plaats treden van de
      ambtenaren, bedoeld in [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 152a.2.b
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
  - number: 152a.2.c
    text: de personen die werkzaam zijn bij mijnbouwkundig werk in de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
  - number: 152a.2.d
    text: |-
      het in [artikel 4.52 van het Arbeidsomstandighedenbesluit][ref1] bedoelde medisch onderzoek in afwijking van het
      derde lid van dat artikel moet worden uitgevoerd door de in artikel 143, eerste lid, bedoelde bedrijfsgeneeskundige
      dienst, dan wel, bij het ontbreken van een dergelijke dienst, door een ter zake deskundige arts.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 152a.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder *a*, *b*, *c* en *d*, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4, afdeling 5 van het Arbeidsomstandighedenbesluit][ref2] vastgestelde
      voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling5
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        afdeling: '5'
  - number: 152a.4
    text: |-
      Onze Minister kan ontheffing verlenen van de bij het tweede lid van overeenkomstige toepassing verklaarde
      voorschriften, met inachtneming van het in het [Arbeidsomstandighedenbesluit][ref1] omtrent de verlening van
      ontheffingen bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 152a.5
    text: |-
      Personen, die arbeid verrichten waarbij gevaar voor blootstelling aan asbeststof of crocidolietstof bestaat,
      alsmede personen, die asbest of asbesthoudende produkten dan wel crocidoliet of crocidoliethoudende produkten
      slopen, moeten overeenkomstig een schriftelijk plan doelmatige voorlichting en doelmatig onderricht ontvangen over
      door Onze Minister bij ministeriële regeling aan te wijzen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
  - number: 152a.6
    text: |-
      Indien is aangetoond of redelijkerwijs het vermoeden bestaat dat iemand ten gevolge van de in de aanhef van
      het tweede lid bedoelde werkzaamheden aan asbestose of mesothelioom lijdt, wordt dit zo spoedig mogelijk aan de
      Inspecteur-Generaal der Mijnen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
  - number: 152a.7
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152a
  - number: 152b.1
    text: |-
      In dit artikel wordt onder 'lood' verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 152b.2
    text: |-
      Bij werkzaamheden bij mijnbouwkundig werk is het bij en krachtens
      [hoofdstuk 4, afdeling 7 van het Arbeidsomstandighedenbesluit][ref1] van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling7
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '7'
  - number: 152b.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming, in de
      plaats treden van de werkgever en
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
  - number: 152b.2.b
    text: de personen die werkzaam zijn bij mijnbouwkundig werk in de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
  - number: 152b.2.c
    text: |-
      de in artikel 143, eerste lid, bedoelde bedrijfsgeneeskundige dienst, dan wel de in
      artikel 149*a*, eerste lid, bedoelde terzake deskundige arts, in de plaats treedt van de in
      [artikel 4.74, tweede en derde lid, van het Arbeidsomstandighedenbesluit][ref1] bedoelde dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 152b.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder *a*, *b* en *c*, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4, afdeling 7 van het Arbeidsomstandighedenbesluit][ref2] vastgestelde
      voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling7
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        afdeling: '7'
  - number: 152b.4
    text: |-
      Personen, die arbeid verrichten waarbij gevaar van blootstelling aan lood bestaat, alsmede hun vertegenwoordigers
      in het bedrijf of de vestiging, moeten doelmatige voorlichting ontvangen over door Onze Minister bij ministeriële
      regeling aan te wijzen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
  - number: 152b.5
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152b
  - number: 152c.1
    text: |-
      In dit artikel wordt onder 'kankerverwekkende stof' verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 152c.2
    text: |-
      Bij werkzaamheden bij mijnbouwkundig werk is het bij en krachtens
      [hoofdstuk 4, afdeling 2 van het Arbeidsomstandighedenbesluit][ref1], van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 152c.2.a
    text: de Inspecteur-Generaal der Mijnen in de plaats treedt van het districtshoofd;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.2.b
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.2.c
    text: de personen die werkzaam zijn bij mijnbouwkundig werk in de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.2.d
    text: |-
      bij de in [artikel 4.14, eerste lid, van het Arbeidsomstandighedenbesluit][ref1] bedoelde beoordeling bijzondere
      aandacht wordt besteed aan de eventuele gevolgen voor de veiligheid of de gezondheid van bijzonder kwetsbare
      risicogroepen en aan de wenselijkheid de betrokken personen niet te werk te stellen op plaatsen waar zij in contact
      kunnen komen met kankerverwekkende stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 152c.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, onder *a*, *b* en *c*, vrijstellingen, door Onze Minister van
      Sociale Zaken en Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      verleend van de bij of krachtens [hoofdstuk 4, afdeling 2 van het Arbeidsomstandighedenbesluit][ref2] vastgestelde
      voorschriften, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 152c.4
    text: |-
      Personen, die arbeid verrichten waarbij gevaar voor blootstelling aan kankerverwekkende stoffen bestaat, moeten
      een voldoende en tevens doelmatige opleiding op basis van alle beschikbare gegevens krijgen met name in de vorm
      van voorlichting en instructies. Deze opleiding moet worden aangepast aan de ontwikkeling van de risico’s en
      aan het ontstaan van nieuwe risico’s en, indien nodig, op gezette tijden worden herhaald. Onze Minister kan bij
      ministeriële regeling bepalen waarop deze opleiding in ieder geval betrekking moet hebben.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.5
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging, of bij het ontbreken daarvan, de betrokken personen worden
      geraadpleegd en hebben medezeggenschap omtrent de materie die onder het tweede lid, onder *d*, valt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.6
    text: |-
      Indien is aangetoond of redelijkerwijs het vermoeden bestaat dat een persoon aan kanker lijdt als een gevolg van
      blootstelling aan een kankerverwekkende stof op het werk, moet hiervan zo spoedig mogelijk mededeling worden gedaan
      aan de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: 152c.7
    text: Onze Minister kan ter bevordering van een goede uitvoering van het tweede lid nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel152c
  - number: '153'
    text: |-
      Op een mijnbouwinstallatie aanwezige vaste, vloeibare en gasvormige stoffen, die giftig of bijtend zijn of
      anderszins gevaar kunnen opleveren, moeten op veilige wijze worden bewaard, vervoerd, verwerkt en gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel153
  - number: '154.1'
    text: |-
      Aan personen, die bij hun werkzaamheden blootstaan aan voor de gezondheid schadelijke invloeden, moet zo mogelijk
      de beschikking worden gegeven over doelmatige kleding en doelmatige middelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154
  - number: '154.2'
    text: De in het eerste lid bedoelde kleding en middelen moeten overeenkomstig hun bestemming worden gedragen en gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154
  - number: 154a.1
    text: |-
      Op plaatsen, waar personen in verband met door hen te verrichten arbeid moeten verblijven, dient het geluidsniveau
      te worden beoordeeld en, indien nodig, gemeten ten einde de arbeidsplaatsen te bepalen waar personen aan niveaus
      van schadelijk geluid kunnen worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154a.2
    text: |-
      De beoordeling en de meting, bedoeld in het eerste lid, moeten geprogrammeerd en op een kundige wijze worden
      uitgevoerd en moeten representatief zijn voor de blootstelling aan geluid op de arbeidsplaats gedurende de
      dagelijkse arbeidstijd. De beoordeling en de meting moeten met passende tussenpozen worden herhaald, doch in
      elk geval indien er voor het geluid op de arbeidsplaats relevante veranderingen plaatsvinden in de arbeid of de
      omstandigheden waaronder deze arbeid wordt verricht en indien er redenen zijn om aan te nemen, dat de uitgevoerde
      beoordeling of meting onjuist is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154a.3
    text: |-
      De bij de meting gebruikte methoden en apparaten moeten aan de desbetreffende omstandigheden zijn aangepast. Met
      name moet daarbij worden gelet op de kenmerken van het te meten geluid en de omgevingsfactoren. De meetmethode en
      het meetapparaat dienen op elkaar te zijn afgestemd. De gebruikte methoden en apparaten moeten geschikt zijn om
      te bepalen of de krachtens de artikelen 154b, 154c en 154e vastgestelde niveaus van schadelijk geluid al dan niet
      worden overschreden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154a.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen wordt de gelegenheid gegeven een oordeel
      over de wijze van beoordeling en meting kenbaar te maken. De ondernemingsraad of, bij het ontbreken daarvan, de
      betrokken personen krijgen op hun verzoek uitleg over de betekenis van de meetresultaten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154a.5
    text: |-
      De resultaten van de ingevolge dit artikel uitgevoerde beoordelingen en metingen moeten in een doelmatig
      register en gedurende ten minste 10 jaren worden bewaard. De resultaten worden, voorzien van een toelichting,
      ter kennis gebracht van de ondernemingsraad of, bij het ontbreken daarvan, van de betrokken werkzame personen.
      De bedrijfsgeneeskundige dienst, bedoeld in artikel 143, dan wel, indien artikel 143, derde lid, toepassing
      heeft gevonden, de desbetreffende arts, heeft toegang tot de resultaten van de ingevolge dit artikel uitgevoerde
      beoordelingen en metingen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154a.6
    text: Onze Minister kan ter uitvoering van dit artikel nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154a
  - number: 154b.1
    text: |-
      Werktuigen, werktuigdelen, drijfwerken, gereedschappen, ketels en andere toestellen, met alles wat daartoe behoort,
      moeten van zodanige constructie zijn, zodanig zijn ingericht, opgesteld of ondersteund zijn en zodanig worden
      onderhouden, dat zij bij het in werking zijn geen schadelijk geluid veroorzaken, tenzij zulks redelijkerwijs niet
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154b.2
    text: |-
      Het verrichten van werkzaamheden moet zodanig geschieden dat daarbij geen schadelijk geluid wordt veroorzaakt,
      tenzij zulks redelijkerwijs niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154b.3
    text: |-
      Indien de uitzondering, vervat in de laatste zinsnede van het eerste of tweede lid, van toepassing is, moeten
      overeenkomstig een programma doelmatige voorzieningen zijn aangebracht, waardoor zoveel mogelijk wordt voorkomen
      dat schadelijk geluid heerst in een ruimte waarin personen arbeid verrichten, tenzij zulks redelijkerwijs niet kan
      worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154b.4
    text: |-
      In gevallen waarin voorzieningen, aangebracht ingevolge het derde lid, de daar bedoelde personen onvoldoende
      bescherming bieden tegen het schadelijk geluid en in gevallen waarin het aanbrengen van vorenbedoelde voorzieningen
      redelijkerwijs niet kan worden gevergd, moeten overeenkomstig een programma doeltreffende maatregelen genomen zijn
      om de blootstellingsduur alsmede het aantal personen die aan schadelijk geluid worden blootgesteld zo veel mogelijk
      te beperken.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154b.5
    text: |-
      Onze Minister kan met betrekking tot mijnbouwkundig onderzoek of het winnen van delfstoffen één of meer niveaus
      vaststellen, waarboven geluid voor de toepassing van het eerste tot en met vierde lid wordt geacht schadelijk te
      zijn in de zin van die leden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154b.6
    text: |-
      De betrokken personen en, indien aanwezig, de ondernemingsraad worden in kennis gesteld van de redenen waarom de
      in de laatste zinsnede van het eerste, tweede en derde lid vervatte uitzonderingen van toepassing zijn, van de
      ingevolge het derde lid aangebrachte voorzieningen en van de ingevolge het vierde lid genomen maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154b
  - number: 154c.1
    text: |-
      In gevallen, waarin personen kunnen worden blootgesteld aan een door Onze Minister voor de toepassing van dit
      artikellid vastgesteld schadelijk geluidsniveau, moeten doelmatige gehoorbeschermingsmiddelen in voldoende aantal
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.2
    text: |-
      Onze Minister kan de niveaus van schadelijk geluid vaststellen waarboven door personen gehoorbeschermingsmiddelen
      moeten worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.3
    text: |-
      De gehoorbeschermingsmiddelen, bedoeld in het eerste en tweede lid, dienen een demping van het geluid te bieden
      tot het in het eerste lid bedoelde niveau. Indien een zodanige demping technisch niet mogelijk is, moet door
      de gehoorbeschermingsmiddelen ten minste een demping van het geluid worden geboden tot beneden het krachtens
      het tweede lid vastgestelde niveau van schadelijk geluid. De gehoorbeschermingsmiddelen moeten in goede staat
      verkeren en zindelijk worden gehouden. De betrokken personen wordt de gelegenheid gegeven een oordeel over de
      keuze van de soort gehoorbeschermingsmiddelen kenbaar te maken. Het ongevalsrisico verbonden aan het gebruik van
      gehoorbeschermingsmiddelen moet zo veel als redelijkerwijs mogelijk is door doelmatige maatregelen zijn beperkt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.4
    text: |-
      De plaatsen waar overschrijding van ten minste één van de krachtens het tweede lid vastgestelde niveaus van
      schadelijk geluid kan worden verwacht, dienen duidelijk te zijn afgebakend en te zijn gemarkeerd door signalen.
      Alleen personen die beroepshalve of uit hoofde van hun functie deze plaatsen moeten betreden mogen daar worden
      toegelaten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.5
    text: |-
      Personen, waarvan waarschijnlijk is dat ze worden blootgesteld aan een van de door Onze Minister voor de toepassing
      van dit artikellid vastgesteld niveaus van schadelijk geluid, krijgen zo nodig een opleiding over:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.5.a
    text: de mogelijke gevaren voor het gehoor als gevolg van blootstelling aan geluid;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.5.b
    text: de bestaande regelgeving met betrekking tot geluid en de op grond van deze regelgeving genomen maatregelen;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.5.c
    text: |-
      de gevallen waarin gehoorbeschermingsmiddelen ter beschikking moeten worden gesteld alsmede de gevallen waarin en
      wijze waarop gehoorbeschermingsmiddelen moeten worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154c.5.d
    text: |-
      de inhoud en betekenis van een periodiek te herhalen audiometrisch onderzoek en de gevallen waarin aan werknemers
      de gelegenheid moet worden geboden om een dergelijk onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154c
  - number: 154d
    text: |-
      In gevallen waarin personen die bijzondere taken uitvoeren in verband met het uitvoeren van deze taken moeten
      verblijven op plaatsen waar het niveau van het geluid van dag tot dag sterk varieert en het redelijkerwijze
      niet kan worden gevergd dat de in artikel 154*b*, derde en vierde lid, bedoelde voorzieningen en maatregelen
      aangebracht, onderscheidenlijk genomen worden, gelden de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154d
  - number: 154d.a
    text: |-
      het gemiddelde niveau van het geluid, berekend of gemeten over een periode van een week, mag de voor artikel
      154*b*, vijfde lid, vastgestelde niveau van schadelijk geluid niet overschrijden, tenzij zulks redelijkerwijze niet
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154d
  - number: 154d.b
    text: |-
      met regelmatige tussenpozen, doch in elk geval indien er voor het geluid op de arbeidsplaats relevante
      veranderingen plaatsvinden in de arbeid of de omstandigheden waaronder deze arbeid wordt verricht, moet worden
      gecontroleerd of nog wordt voldaan aan het in onderdeel *a* genoemde voorschrift.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154d
  - number: 154e.1
    text: |-
      Personen die worden blootgesteld aan een door Onze Minister voor de toepassing van dit artikel vastgesteld niveau
      van schadelijk geluid moeten in de gelegenheid worden gesteld een audiometrisch onderzoek te ondergaan dat erop
      gericht is de gehoorfunctie van de betrokken persoon zoveel mogelijk in stand te houden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154e.2
    text: |-
      Het audiometrisch onderzoek, bedoeld in het eerste lid, moet worden uitgevoerd door de bedrijfsgeneeskundige
      dienst, bedoeld in artikel 143, dan wel, indien artikel 143, derde lid, toepassing heeft gevonden, door een arts
      die terzake deskundig is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154e.3
    text: |-
      Zolang de blootstelling aan het in het eerste lid bedoelde niveau van schadelijk geluid duurt, moeten de betrokken
      personen met tussenpozen van vier jaren opnieuw in de gelegenheid worden gesteld om een audiometrisch onderzoek als
      bedoeld in het eerste en tweede lid te ondergaan, dan wel met kortere tussenpozen indien dit naar het oordeel van
      de dienst of de arts, bedoeld in het tweede lid, noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154e.4
    text: |-
      Aan de dienst of de arts, bedoeld in het tweede lid, moet inzage gegeven worden in het in artikel 154*a*, vijfde
      lid, bedoelde register en moet de gelegenheid worden geboden om te adviseren over de te nemen persoonlijke
      beschermende dan wel preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154e.5
    text: De resultaten van het audiometrisch onderzoek moeten gedurende ten minste tien jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154e.6
    text: |-
      De betrokken personen moeten in kennis worden gesteld van de resultaten van elk audiometrisch onderzoek dat zij
      overeenkomstig dit artikel hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154e
  - number: 154f.1
    text: |-
      In dit artikel wordt onder 'beeldscherm' en 'werkplek' verstaan hetgeen daaronder wordt verstaan in het
      [Arbeidsomstandighedenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 154f.2
    text: |-
      Bij werkzaamheden bij mijnbouwkundig werk is [hoofdstuk 5, afdeling 2 van het Arbeidsomstandighedenbesluit][ref1]
      van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 154f.2.a
    text: |-
      de bestuurders van de betrokken mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming in de
      plaats treden van de werkgever;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: 154f.2.b
    text: de personen die werkzaam zijn bij mijnbouwkundig werk in de plaats treden van de werknemers;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: 154f.2.c
    text: |-
      het in [artikel 5.11 van het Arbeidsomstandighedenbesluit][ref1] bedoelde onderzoek in afwijking van het
      vijfde lid van dat artikel moet worden uitgevoerd door de in artikel 143, eerste lid, van dit besluit bedoelde
      bedrijfsgeneeskundige dienst, dan wel, bij het ontbreken van een dergelijke dienst, door een terzake deskundige
      arts.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel5
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '5'
  - number: 154f.3
    text: |-
      Voorts zijn, met inachtneming van het tweede lid, vrijstellingen, door Onze Minister van Sociale Zaken en
      Werkgelegenheid op grond van [artikel 30, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] verleend van de
      bij of krachtens [hoofdstuk 5, afdeling 2 van het Arbeidsomstandighedenbesluit][ref2] vastgestelde voorschriften,
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0008498
        afdeling: '2'
  - number: 154f.4
    text: |-
      De in het tweede lid, onder *b*, bedoelde personen moeten worden voorgelicht over voorschriften inzake veiligheid
      en gezondheid bij het werken met beeldschermen. De ondernemingsraad of de personeelsvertegenwoordiging, of bij het
      ontbreken daarvan, de betrokken personen moeten op de hoogte worden gesteld van alle maatregelen betreffende de
      veiligheid en de gezondheid, die met toepassing van dit artikel worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: 154f.5
    text: |-
      Aan de in het tweede lid, onder *b*, bedoelde personen moet bovendien een opleiding worden gegeven betreffende
      de wijze van gebruik van beeldschermen, alvorens zij hiermee beginnen te werken en voorts telkens wanneer de
      organisatie van de werkplek ingrijpend wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: 154f.6
    text: |-
      Onze Minister kan ter bevordering van een goede uitvoering van het tweede, vierde en vijfde lid nadere regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: 154f.7
    text: |-
      De ondernemingsraad of de personeelsvertegenwoordiging, of bij het ontbreken daarvan, de betrokken personen worden
      geraadpleegd en hebben medezeggenschap omtrent te nemen maatregelen inzake veiligheid en gezondheid bij het werken
      met beeldschermen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel154f
  - number: '155.1'
    text: |-
      In lokalen op een mijnbouwinstallatie, waarin personen arbeid plegen te verrichten, moet voor een voldoende
      behagelijk klimaat worden gezorgd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel155
  - number: '155.2'
    text: |-
      Doelmatige metingen moeten worden verricht om te kunnen beoordelen, of aan het bij of krachtens het eerste lid
      bepaalde wordt voldaan. Onze Minister kan bepalen, waar en wanneer deze metingen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel155
  - number: '155.3'
    text: |-
      Personen, die op een mijnbouwinstallatie niet in een lokaal als in het eerste lid bedoeld werkzaam zijn, moeten
      ter plaatse waar zij arbeid verrichten, voor zover mogelijk, voldoende beschut zijn tegen mogelijke schadelijke
      klimatologische invloeden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel155
  - number: '155.4'
    text: |-
      Voor zover het niet mogelijk is een persoon voldoende tegen invloeden als in het derde lid bedoeld te beschutten,
      kan Onze Minister aanwijzingen geven met betrekking tot de tijd, gedurende welke deze persoon op de betrokken
      plaats arbeid mag verrichten, alsmede met betrekking tot de tijd, gedurende welke aan hem extra rust moet worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel155
  - number: '155.5'
    text: Onze Minister kan van het eerste en tweede lid ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel155
  - number: '156.1'
    text: |-
      De lucht in een lokaal op een mijnbouwinstallatie, waarin personen plegen aanwezig te zijn, moet voldoende en op
      doelmatige wijze worden ververst onder vermijding van hinderlijke tocht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.2'
    text: |-
      In besloten werkruimten moet ervoor worden gezorgd dat, rekening houdend met de werkmethoden en de door de
      arbeiders te leveren lichamelijke inspanningen, voldoende reine lucht aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.3'
    text: |-
      Indien een luchtverversingsinstallatie wordt gebruikt, moet deze altijd gebruiksklaar zijn. Storingen moeten door
      een controlesysteem worden gemeld als dat noodzakelijk is voor de gezondheid van de arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.4'
    text: |-
      Indien airconditioningsinstallaties of mechanische ventilatieinstallaties worden gebruikt moeten die op zodanige
      wijze functioneren dat de arbeiders niet aan hinderlijke tocht worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.5'
    text: |-
      Elke ongerechtigheid die via verontreiniging van de ingeademde lucht een onmiddellijk gevaar kan meebrengen voor de
      gezondheid van de arbeiders, moet snel worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.6'
    text: |-
      De temperatuur van ontspanningruimten, ruimten voor het personeel in avond- en nachtdienst, sanitaire ruimten,
      kantines en eerstehulpruimten moet op de specifieke bestemming van deze ruimten zijn afgestemd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.7'
    text: |-
      De temperatuur in de werkruimten moet gedurende de arbeidstijd afgestemd zijn op het menselijk organisme, rekening
      houdend met werkmethoden, de aard van het werk en de door de arbeiders te leveren lichamelijke inspanningen.
      Hiertoe moeten de arbeidsplaatsen waar feitelijk werkplekken zijn ingericht voldoende thermisch geïsoleerd zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '156.8'
    text: |-
      Ramen, bovenlichtvoorzieningen en glazen wanden moeten zodanig geconstrueerd zijn dat, rekening houdend met het
      soort werk en de aard van de arbeidsplaats, overmatig zonlicht op de arbeidsplaats wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel156
  - number: '157'
    text: |-
      Een persoon, wiens werkzaamheden op een mijnbouwinstallatie hem blootstellen aan aanraking met koude of natte
      oppervlakken, aan bespatting door water of aan regen, moet, wanneer daarvan nadelige invloeden kunnen worden
      verwacht, tegen deze invloeden voldoende worden beschut.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel157
  - number: '158.1'
    text: |-
      Lokalen op een mijnbouwinstallatie, waarin personen plegen aanwezig te zijn, moeten met de zich aldaar bevindende
      inventaris zindelijk en zoveel mogelijk vrij worden gehouden van stof en vocht. Het oppervlak van vloeren, muren en
      plafonds van de ruimten moeten van zodanige aard zijn dat zij kunnen worden schoongemaakt en onderhouden ten einde
      passende hygiënische omstandigheden te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel158
  - number: '158.2'
    text: |-
      In een ruimte op een mijnbouwinstallatie, waarin water wordt gebruikt, moet dit op doelmatige wijze kunnen
      afvloeien. Afval en vuilnis moeten zo spoedig mogelijk en op doelmatige wijze worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel158
  - number: '159.1'
    text: Op een bemande mijnbouwinstallatie moet voldoende en doelmatige was-, bad- en kleedgelegenheid aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel159
  - number: '159.2'
    text: |-
      Bij aanwezigheid van één gelegenheid als in het eerste lid bedoeld moet zij zodanig zijn ingericht dat ieder zich
      gescheiden van personen van de andere sekse kan wassen, baden en uit- en aankleden; bij aanwezigheid van meerdere
      zodanige gelegenheden moeten zij naar de seksen der gebruikers gescheiden zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel159
  - number: '159.3'
    text: |-
      Een gelegenheid als in het eerste lid bedoeld moet in zindelijke toestand worden gehouden, zomede doelmatig worden
      geventileerd en voldoende zijn verwarmd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel159
  - number: '159.4'
    text: |-
      In de in het eerste lid bedoelde was- en badgelegenheid moet voldoende zuiver warm en koud stromend water aanwezig
      zijn. Dit water moet voldoende zuiver en van behoorlijke temperatuur zijn. Het gebruikte water moet onmiddellijk
      kunnen wegvloeien.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel159
  - number: '160.1'
    text: |-
      Op een bemande mijnbouwinstallatie moet een voldoende aantal naar de seksen der gebruikers gescheiden doelmatige
      slaapverblijven met voldoende doelmatige slaapplaatsen aanwezig zijn, alsmede een gemakkelijk toegankelijk en
      doelmatig eet- en recreatieverblijf.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel160
  - number: '160.2'
    text: |-
      De in het eerste lid bedoelde verblijven mogen noch geheel noch gedeeltelijk aan hun bestemming worden onttrokken.
      Zij moeten in zindelijke toestand worden gehouden, zomede doelmatig worden geventileerd en voldoende zijn verwarmd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel160
  - number: '160.3'
    text: |-
      De toegang tot elk der slaapverblijven moet zijn voorzien van een duidelijk waarneembare aanduiding van de sekse
      der gebruikers, voor welke het bestemd is.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel160
  - number: '160.4'
    text: Onze Minister kan van het tweede lid, eerste volzin, ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel160
  - number: '161'
    text: |-
      Schafttijden moeten zo mogelijk worden doorgebracht in het in artikel 160, eerste lid, bedoelde eet- en
      recreatieverblijf.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel161
  - number: '162.1'
    text: |-
      Op een bemande mijnbouwinstallatie moeten voor het bereiden en het bewaren van voedsel doelmatig ingerichte ruimten
      aanwezig zijn, welke ruimten voor geen ander doel mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel162
  - number: '162.2'
    text: Het bereiden en het bewaren van voedsel mogen niet in andere dan de in het eerste lid bedoelde ruimten geschieden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel162
  - number: '162.3'
    text: |-
      De in het eerste lid bedoelde ruimten moeten zindelijk worden gehouden; zo nodig moeten voldoende maatregelen
      worden genomen om bederf van voedsel te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel162
  - number: '163.1'
    text: |-
      Het ontstaan en de verspreiding van schadelijke of hinderlijke gassen, dampen of nevels of van schadelijk of
      hinderlijk stof in een ruimte of op een plaats op een mijnbouwinstallatie, waar personen plegen aanwezig te zijn,
      moeten worden voorkomen. Waar dit niet mogelijk is moeten doelmatige maatregelen worden genomen tot afvoer daarvan.
      Het afvoersysteem moet in staat zijn schadelijke stoffen in de atmosfeer te verdunnen zonder risico’s voor de
      arbeiders.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.2'
    text: |-
      Indien personen ondanks ingevolge het eerste lid genomen maatregelen blootstaan aan de invloed van schadelijke of
      hinderlijke gassen, dampen of nevels of van schadelijk of hinderlijk stof, moeten zij op doelmatige wijze daartegen
      worden beschermd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.3'
    text: |-
      Met het oog op de uitvoering van het eerste en het tweede lid kan Onze Minister voor de concentratie van gassen,
      dampen, nevels en stof grenswaarden vaststellen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.4'
    text: |-
      Doelmatige metingen moeten worden verricht om te kunnen beoordelen of aan het eerste en het tweede lid, met
      inachtneming van het krachtens het derde lid bepaalde, is voldaan. Onze Minister kan bepalen, waar en wanneer deze
      metingen moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.5'
    text: |-
      Doelmatige maatregelen moeten worden genomen voor het evalueren van de aanwezigheid en het meten van de
      concentratie van schadelijke stoffen in de atmosfeer.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.6'
    text: |-
      Wanneer de veiligheid en de gezondheid van de arbeiders dat vereisen, moet bewakingsapparatuur voor het
      automatisch en continu registreren van de gasconcentraties op bepaalde plaatsen, automatische alarminstallaties
      en voorzieningen voor de automatische afsluiting van de stroomtoevoer naar elektrische installaties en voor het
      automatisch stopzetten van verbrandingsmotoren worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: '163.7'
    text: Van automatische metingen moeten de meetwaarden worden geregistreerd en bewaard.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163
  - number: 163a.1
    text: |-
      In zones waar personen kunnen worden blootgesteld aan een atmosfeer die schadelijk is voor de gezondheid moet een
      voldoende aantal doelmatige ademhalings- en reanimatieapparaten ter beschikking zijn. In dergelijke gevallen moet
      ervoor worden gezorgd dat er op de arbeidsplaats voldoende personen ter beschikking staan die deze apparatuur
      kunnen bedienen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163a
  - number: 163a.2
    text: De in het eerste lid bedoelde apparatuur moet naar behoren worden opgeslagen en onderhouden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163a
  - number: 163a.3
    text: |-
      Wanneer zwavelwaterstof of andere toxische gassen in de atmosfeer aanwezig zijn of kunnen zijn, moet er een
      beschermingsplan aanwezig zijn met gedetailleerde gegevens over de beschikbare apparatuur en de preventieve
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel163a
  - number: '185.1'
    text: |-
      Eenmaal per kalenderweek moet aan de Inspecteur-Generaal der Mijnen opgave worden gedaan van de ongevallen welke in
      de voorafgaande kalenderweek, in verband met de arbeid bij mijnbouwkundig werk, aan personen zijn overkomen. Onze
      Minister stelt de vorm van de opgave vast.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel185
  - number: '185.2'
    text: |-
      Onverminderd het eerste lid, moet, indien een ongeval de dood van een persoon of letsel, dat een persoon
      vermoedelijk gedurende omstreeks 8 weken of langer voor de arbeid ongeschikt doet zijn, ten gevolge heeft gehad,
      hiervan onverwijld worden kennis gegeven aan de Inspecteur-Generaal der Mijnen. In zodanig geval moet, voor zover
      dit zonder gevaar mogelijk is, alles ter plaatse in dezelfde toestand worden gelaten totdat een inspectie-ambtenaar
      van het Staatstoezicht op de Mijnen toestemming tot opruiming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel185
  - number: '185.3'
    text: |-
      Van alle bij het gebruik, het vervoer of de opslag van ontplofbare stoffen opgetreden voorvallen, die de veiligheid
      in gevaar hadden kunnen brengen of hebben gebracht, moet onverwijld worden kennis gegeven aan de Inspecteur-
      Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel185
  - number: '185.4'
    text: |-
      Onze Minister kan verlangen, dat aan de Inspecteur-Generaal der Mijnen opgave wordt gedaan van andere dan in de
      voorgaande leden bedoelde ongevallen en voorvallen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel185
  - number: '186.1'
    text: |-
      Aan een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt ingesteld, dan wel
      delfstoffen worden gewonnen, moet een doelmatig georganiseerde reddingsdienst zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel186
  - number: '186.2'
    text: |-
      Onze Minister kan van het eerste lid ontheffing verlenen; hij kan daarbij goedkeuren, dat de eigenaren van bepaalde
      mijnondernemingen voor de uitvoering van dat lid een gemeenschappelijke reddingsdienst vormen of gebruik maken van
      de diensten van een bestaande reddingsdienst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel186
  - number: '187.1'
    text: |-
      Een reddingsdienst moet bestaan uit een voldoende aantal in het gebruik van het in artikel 188, eerste lid,
      bedoelde materieel voldoend geoefende personen en moet beschikken over voldoende doelmatig materieel voor het
      verrichten van reddingswerk.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel187
  - number: '187.2'
    text: |-
      Bij een reddingsdienst moet een doelmatig register aanwezig zijn, waarin aantekening wordt gehouden van personen
      als in het eerste lid bedoeld en van de door hen gehouden oefeningen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel187
  - number: '187.3'
    text: |-
      Voldoende maatregelen moeten worden genomen opdat voldoende personen als in het eerste lid bedoeld, alsmede het
      nodige materieel zo nodig onverwijld naar de betrokken mijnbouwinstallatie kunnen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel187
  - number: '188.1'
    text: 'Op een mijnbouwinstallatie, waarop een of meer personen plegen aanwezig te zijn, moeten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188
  - number: 188.1.a
    text: |-
      een voldoende aantal voor onmiddellijk gebruik gereed zijnde doelmatige reddingsmiddelen om de installatie zo nodig
      onverwijld en op veilige wijze te kunnen verlaten;
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188
  - number: 188.1.b
    text: |-
      een voldoende hoeveelheid doelmatig, voor onmiddellijk gebruik gereed zijnd en in voldoend gereinigde toestand
      verkerend ander materieel voor het uitvoeren van reddingswerk.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188
  - number: '188.2'
    text: |-
      Van de op een mijnbouwinstallatie als in het eerste lid bedoeld aanwezige personen moet een voldoende aantal
      ervaren zijn in het gebruik van het in dat lid bedoelde materieel.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188
  - number: 188a.1
    text: |-
      Voor elk veilig verzamelpunt moet een lijst worden opgesteld, bijgehouden en ter plaatse worden aangeplakt met de
      namen van de arbeiders voor wie dat verzamelpunt is bestemd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188a
  - number: 188a.2
    text: |-
      Een lijst met de namen van de arbeiders die in geval van nood speciale taken hebben moet worden opgesteld en
      bijgehouden en moet op doelmatige plaatsen worden aangeplakt. De namen van deze arbeiders moeten eveneens worden
      vermeld in de schriftelijke instructies, bedoeld in artikel 7, vierde lid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel188a
  - number: '189.1'
    text: |-
      Door de bestuurders van een mijnonderneming, waarin - of waarvoor door anderen - een opsporingsonderzoek wordt
      ingesteld, dan wel delfstoffen worden gewonnen, dient jaarlijks aan de Inspecteur-Generaal der Mijnen een op het
      volgende kalenderjaar betrekking hebbend doelmatig reddingsplan voor alle bij dat onderzoek of die winning in
      gebruik zijnde mijnbouwinstallaties te worden toegezonden; het moet tenminste 14 dagen vóór de aanvang van het
      betrokken kalenderjaar in zijn bezit zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel189
  - number: '189.2'
    text: |-
      In geval in de loop van enig kalenderjaar met een opsporingsonderzoek of het winnen van delfstoffen wordt
      begonnen, dient door de bestuurders van de betrokken mijnonderneming tijdig tevoren een op dat jaar en op de bij
      dat onderzoek of die winning te gebruiken mijnbouwinstallaties betrekking hebbende doelmatig reddingsplan aan de
      Inspecteur-Generaal der Mijnen te worden toegezonden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel189
  - number: '189.3'
    text: |-
      Onze Minister bepaalt, welke gegevens in een reddingsplan moeten worden vermeld. Het reddingsplan moet een noodplan
      omvatten voor gevallen waarin iemand overboord valt of de arbeidsplaats moet worden geëvacueerd. Het noodplan,
      dat moet zijn gebaseerd op het in artikel 13*f* bedoelde veiligheids- en gezondheidsdocument, moet voorzien in
      het gebruik van bijstandsboten (standby vessels) en helikopters en moet criteria bevatten voor de capaciteit en de
      reactietijd daarvan. De vereiste reactietijd moet in het veiligheids- en gezondheidsdocument van elke installatie
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel189
  - number: 189b
    text: |-
      De in artikel 189, derde lid, bedoelde bijstandsboten moeten doelmatig zijn ontworpen en uitgerust en moeten
      voldoen aan de eisen in verband met evacuatie en redding.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel189b
  - number: '190.1'
    text: |-
      Reddingswerkzaamheden op een mijnbouwinstallatie in een atmosfeer, waarin verstikkende of giftige gassen aanwezig
      zijn, of in een met radioactieve stoffen besmette atmosfeer mogen slechts worden verricht door terzake voldoend
      ervaren personen, die zijn uitgerust met toestellen, die het mogelijk maken in een zodanige atmosfeer door te
      dringen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel190
  - number: '190.2'
    text: |-
      Voldoende maatregelen moeten worden genomen ter verzekering van de veiligheid en de gezondheid van de bij een
      opsporingsonderzoek of het winnen van delfstoffen met reddingswerkzaamheden belaste personen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel190
  - number: '191.1'
    text: |-
      Op een bemande mijnbouwinstallatie moeten op alle plaatsen waar de werkomstandigheden dat vereisen voldoende en
      doelmatige verband-, genees- en hulpmiddelen en draagbaren voor het transport van gewonden en zieken aanwezig zijn,
      alsmede een of meer doelmatige verblijven voor de voorlopige verzorging van gewonden en zieken, overeenkomstig
      de omvang van de installatie en de aard van de uitgevoerde werkzaamheden. Eerste-hulpmateriaal moet duidelijk
      gesignaleerd en gemakkelijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel191
  - number: '191.2'
    text: |-
      Voldoende maatregelen moeten worden genomen opdat op een mijnbouwinstallatie aanwezige personen, die gewond of ziek
      zijn, onverwijld kunnen worden vervoerd naar een plaats, waar zij voorlopig kunnen worden verzorgd, en zo nodig
      naar de vaste wal.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel191
  - number: '191.3'
    text: |-
      Op een bemande mijnbouwinstallatie moet een voldoende aantal personen van voldoende bekwaamheid aanwezig zijn om
      in alle omstandigheden eerste hulp te kunnen verlenen of in voorkomend geval een medische behandeling uit te voeren
      onder de leiding van een arts, die al dan niet aanwezig kan zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel191
  - number: '191.4'
    text: |-
      Op een bemande mijnbouwinstallatie moeten op doelmatige plaatsen duidelijke en beknopte handleidingen voor het
      verlenen van eerste hulp bij ongevallen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel191
  - number: '193'
    text: Op een mijnbouwinstallatie mag geen arbeid worden verricht door een persoon van 16 of 17 jaar.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193
  - number: 193a
    text: |-
      Voor de toepassing van de artikelen 193*b* tot en met 193*e* wordt verstaan onder: zwangere vrouw: de vrouwelijke
      arbeider die zwanger is en de desbetreffende mijnonderneming of in artikel 11, eerste lid, bedoelde andere
      onderneming hiervan in kennis heeft gesteld; vrouw tijdens de lactatie: de vrouwelijke arbeider die haar kind
      borstvoeding geeft en de desbetreffende mijnonderneming of in artikel 11, eerste lid, bedoelde andere onderneming
      hiervan in kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193a
  - number: 193b.1
    text: |-
      Voor alle werkzaamheden waarbij zich een specifiek risico kan voordoen van blootstelling aan de agentia, procédés
      of arbeidsomstandigheden als bedoeld in bijlage I van de [richtlijn nr. 92/85/EEG](31992L0085) van de Raad van
      de Europese Gemeenschappen van 19 oktober 1992 inzake de tenuitvoerlegging van maatregelen ter bevordering van
      de verbetering van de veiligheid en de gezondheid op het werk van werkneemsters tijdens de zwangerschap, na de
      bevalling en tijdens de lactatie (*PbEG* L 348), moeten de aard, de mate en de duur van de blootstelling zwangere
      vrouwen en vrouwen tijdens de lactatie worden geëvalueerd, ten einde:
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193b.1.a
    text: |-
      ieder risico voor de veiligheid of de gezondheid, alsmede iedere verstoring van de zwangerschap of de lactatie van
      de betrokken vrouwen te kunnen beoordelen en
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193b.1.b
    text: te kunnen vaststellen welke maatregelen moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193b.2
    text: |-
      Een wijziging van bijlage I van de in het eerste lid bedoelde richtlijn treedt voor de toepassing van dit artikel
      in werking met ingang van de dag waarop aan de betrokken wijziging uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193b.3
    text: |-
      De door de Europese Commissie op basis van artikel 3, eerste lid, van de in het eerste lid bedoelde richtlijn
      vastgestelde richtsnoeren dienen als leidraad voor de evaluatie te worden gebruikt, zodra deze in de
      *Staatscourant* zijn gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193b.4
    text: |-
      De ondernemingsraad of, bij het ontbreken daarvan, de betrokken personen worden geïnformeerd over de resultaten van
      de in het eerste lid bedoelde evaluatie en over alle maatregelen op het gebied van de veiligheid en de gezondheid
      op het werk.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193b
  - number: 193c.1
    text: |-
      Indien uit de resultaten van de in artikel 193*b*, eerste lid, bedoelde evaluatie een risico voor de veiligheid
      of de gezondheid of een verstoring van de zwangerschap of de lactatie van een zwangere vrouw of een vrouw
      tijdens de lactatie blijkt, moeten de nodige maatregelen worden genomen opdat door tijdelijke aanpassing van de
      arbeidsomstandigheden en/of werktijden van de betrokken vrouw de blootstelling van deze vrouw aan dit risico wordt
      vermeden.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193c
  - number: 193c.2
    text: |-
      Indien nakoming van het eerste lid redelijkerwijs niet kan worden gevergd, worden de betrokken vrouw tijdelijk
      andere werkzaamheden gegeven.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193c
  - number: 193c.3
    text: |-
      Indien nakoming van het tweede lid redelijkerwijs niet kan worden gevergd, wordt de betrokken vrouw tijdelijk
      vrijgesteld van het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193c
  - number: 193d.1
    text: |-
      Een zwangere vrouw mag niet worden verplicht om werkzaamheden onder water of onder druk te verrichten. Artikel 111
      is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193d
  - number: 193d.2
    text: |-
      Een zwangere vrouw mag niet worden verplicht werkzaamheden te verrichten met de biologische agentia toxoplasma en
      rubeolavirus, tenzij aangetoond kan worden dat zij door immunisatie voldoende tegen deze agentia is beschermd.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193d
  - number: 193d.3
    text: |-
      Een zwangere vrouw en een vrouw tijdens de lactatie mogen niet worden verplicht werkzaamheden met lood en
      loodderivaten te verrichten, indien deze door het menselijk organisme kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193d
  - number: 193d.4
    text: |-
      Onverminderd het bepaalde in artikel 201 mogen een zwangere vrouw en een vrouw tijdens de lactatie niet worden
      verplicht werkzaamheden te verrichten tussen 23 uur en 6 uur.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193d
  - number: 193d.5
    text: Artikel 193c is van overeenkomstige toepassing op de in het eerste, tweede en derde lid genoemde situaties.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193d
  - number: 193e.1
    text: |-
      Aan een zwangere vrouw of een vrouw tijdens de lactatie moet behoorlijk gelegenheid worden gegeven om onder
      doelmatige omstandigheden in liggende positie te kunnen rusten.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193e
  - number: 193e.2
    text: Aan een vrouw tijdens de lactatie moet behoorlijk gelegenheid worden gegeven haar kind te zogen.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel193e
  - number: '214'
    text: |-
      Het is verboden bij het verrichten van mijnbouwkundig werk een zuiver wetenschappelijk onderzoek, waarvoor
      goedkeuring van Onze Minister van Onderwijs en Wetenschappen, dan wel een ontheffing als bedoeld in
      [artikel 2, tweede lid, van de Mijnwet continentaal plat][ref1] is verleend, te belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
  - number: '215'
    text: |-
      Indien bij mijnbouwkundig werk voorwerpen, sporen of overblijfselen worden gevonden, welke naar redelijkerwijs
      kan worden vermoed van historisch, oudheidkundig of ander wetenschappelijk belang zijn, dient hiervan zo spoedig
      mogelijk, doch uiterlijk binnen een week mededeling te worden gedaan aan de directeur van de Rijksdienst voor
      het oudheidkundig bodemonderzoek, alsmede aan het Hoofd van de Afdeling Hydrografie van het Ministerie van
      Defensie, onder vermelding van de aard van de vondst, alsmede van een zo nauwkeurig mogelijke plaatsaanduiding in
      geografische coördinaten, berekend volgens het stelsel van de Europese vereffening.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel215
  - number: '216'
    text: |-
      Een voorwerp of overblijfsel als bedoeld in artikel 215, dat zich in de feitelijke macht van de mijnonderneming of
      in artikel 11, eerste lid, bedoelde andere onderneming bevindt, dient zo mogelijk zes maanden ter beschikking te
      worden gehouden, tenzij de directeur van de Rijksdienst voor het oudheidkundig bodemonderzoek een kortere termijn
      toestaat.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel216
  - number: '217'
    text: 'Dit besluit kan worden aangehaald als: Mijnreglement continentaal plat.'
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel217
  - number: '218'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad*, waarin
      het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0002564/2002-07-01#Artikel218
