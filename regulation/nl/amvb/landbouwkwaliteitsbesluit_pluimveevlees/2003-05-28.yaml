preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 januari 2003, TRCJZ/2003/696,
    gedaan in overeenstemming met Onze Minister van Economische Zaken;

    Gelet op verordening (EEG) nr. 1906/90 van de Raad van de Europese Gemeenschappen van 26 juni 1990 tot vaststelling
    van handelsnormen voor vlees van pluimvee (PbEG L 173/1), alsmede gelet op verordening nr. 1538/91 van de Commissie
    van de Europese Gemeenschappen van 5 juni 1991 houdende uitvoeringsbepalingen van verordening (EEG) nr. 1906/90 van
    de Raad tot vaststelling van handelsnormen voor vlees van pluimvee (PbEG L 143/11);

    Gelet op de artikelen 2, 3, 4, 6, 7, 8 en 9 van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 21 maart 2003, nummer W11.03.0038/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 14 april 2003, no.
    TRCJZ/2003/3195, uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Landbouwkwaliteitswet][ref1];

      b. Stichting CPE: Stichting Controlebureau voor Pluimvee, Eieren en Eiproducten;

      c. [verordening nr. 1906/90](31990R1906): [verordening (EEG) nr. 1906/90](31990R1906) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 tot vaststelling van handelsnormen voor vlees van pluimvee (PbEG L 173/1);

      d. [verordening nr. 1538/91](31991R1538): [verordening (EEG) nr. 1538/91](31991R1538) van de Commissie van
      de Europese Gemeenschappen van 5 juni 1991 houdende uitvoeringsbepalingen van [Verordening (EEG) nr. 1906/90]
      (31990R1906) van de Raad tot vaststelling van handelsnormen voor vlees van pluimvee (PbEG L 143/11).

      2 Als bevoegde autoriteit als bedoeld in artikel 11, eerste lid, van [verordening nr. 1538/91](31991R1538) wordt in
      dit besluit en de daarop berustende bepalingen aangewezen: Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: '2'
    text: |-
      Het is verboden om vlees van pluimvee in de handel te brengen dat niet voldoet aan [verordening nr. 1906/90]
      (31990R1906) en [verordening nr. 1538/91](31991R1538).
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel2
  - number: '3'
    text: |-
      1 Een slachterij die op grond van artikel 10, eerste lid, van [verordening nr. 1538/91](31991R1538) het
      houderijsysteem bij de etikettering van zijn producten vermeldt, moet overeenkomstig artikel 11, eerste lid, van
      [verordening nr. 1538/91](31991R1538) worden geregistreerd.

      2 Terzake van de registratie, bedoeld in het eerste lid, kan door Onze Minister medewerking worden gevorderd van
      het bestuur van het Productschap Pluimvee en Eieren.
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel3
  - number: '4'
    text: |-
      Indien pluimveevlees afkomstig uit landen buiten de Europese Unie de vermeldingen en aanduidingen vastgesteld op
      grond van artikel 9 en 10 van [verordening nr. 1538/91](31991R1538) voert, moet dit vlees vergezeld gaan van een
      certificaat dat is afgegeven door de bevoegde autoriteit van het land van oorsprong overeenkomstig artikel 13 van
      [verordening nr. 1538/91](31991R1538).
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel4
  - number: '5'
    text: |-
      De Stichting CPE is belast met controle en toezicht op de naleving door de bij haar aangeslotenen van de artikelen
      10 en 11 van [verordening nr. 1538/91](31991R1538) alsmede van de krachtens artikel 3 van dit besluit gestelde
      regelen.
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel5
  - number: '6'
    text: |-
      De categorieën van bedrijven, bedoeld in artikel 11, derde lid, van [verordening nr. 1538/91](31991R1538) dienen
      aangesloten te zijn bij de Stichting CPE indien zij gebruik maken van de aanduidingen van houderijsystemen bij de
      etikettering van hun producten, bedoeld in artikel 10, van [verordening nr. 1538/91](31991R1538).
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Landbouwkwaliteitsbesluit pluimveevlees.'
    url: https://wetten.overheid.nl/BWBR0015006/2003-05-28#Artikel8
