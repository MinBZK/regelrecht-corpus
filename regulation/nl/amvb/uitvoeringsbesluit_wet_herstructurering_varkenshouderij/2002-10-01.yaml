  - number: '4'
    text: |-
      Voor de toepassing van [artikel 15, tweede lid, van de wet][ref1] wordt, in zoverre in afwijking van artikel 3,
      bij de bepaling van de in het desbetreffende jaar tot het bedrijf behorende oppervlakte landbouwgrond geen rekening
      gehouden met een binnen hetzelfde jaar plaatsvindende verkleining gevolgd door een vergroting van de tot het
      bedrijf behorende oppervlakte landbouwgrond, voor zover de vergroting in omvang gelijk is aan de verkleining.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009763/2002-10-01#Artikel4
