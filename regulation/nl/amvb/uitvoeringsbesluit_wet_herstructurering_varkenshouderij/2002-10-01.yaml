    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 27 april 1998, no. J. 984240,
    Directie Juridische Zaken;

    Gelet op de artikelen 21, eerste en tweede lid, en 33 van de Wet herstructurering varkenshouderij en de artikelen
    55, zesde lid, en 61, eerste lid, van de Meststoffenwet;

    De Raad van State gehoord (advies van 25 mei 1998, no. W11.98.0174);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 26 juni 1998, nr. J. 985770,
    Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
