articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. wet: [Wet herstructurering varkenshouderij][ref1];

      b. Verplaatsingsbesluit Meststoffenwet: Verplaatsingbesluit Meststoffenwet, zoals dat luidde vóór 15 december 1996;

      c. pluimveerecht: pluimveerecht als bedoeld in [artikel 1, eerste lid, onderdeel ag, van de Meststoffenwet][ref2];

      d. kippen en kalkoenen: dieren van de diersoort kippen, onderscheidenlijk kalkoenen, opgenomen in
      [bijlage A bij de Meststoffenwet][ref3];

      e. andere dieren: dieren van andere in [bijlage A bij de Meststoffenwet][ref4] opgenomen diersoorten dan varkens,
      kippen en kalkoenen.

      e. andere dieren: dieren van andere in [bijlage A bij de Meststoffenwet][ref5] opgenomen diersoorten dan varkens,
      kippen en kalkoenen.

      2 Voor de toepassing van [artikel 2a][ref6] wordt onder «overdracht» verstaan: overdracht als bedoeld in artikel 4,
      onderdeel c of d, van het Verplaatsingsbesluit Meststoffenwet.


