  - number: 8a
    text: |-
      Indien de krachtens artikel 24 van de wet gestelde regels worden gewijzigd, kan bij die regels een termijn worden
      bepaald waarbinnen de in artikel 24, derde lid, van de wet bedoelde melding, in zoverre in afwijking van dat
      artikel, wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009763/2002-10-01#Artikel8a
