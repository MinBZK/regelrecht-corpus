        artikel: '20'
  - number: '7'
    text: |-
      Indien in enig jaar registratie van een kennisgeving als bedoeld in [artikel 30 van de wet][ref1] heeft
      plaatsgevonden, wordt in het desbetreffende jaar voor de toepassing van [artikel 15, eerste lid, van de wet][ref2]
      ten aanzien van het desbetreffende bedrijf onder een groter aantal varkens, onderscheidenlijk fokzeugen, verstaan:
      een groter aantal varkens, onderscheidenlijk fokzeugen, dan het op de dag voorafgaande aan de registratie van de
      kennisgeving geldende varkensrecht, respectievelijk fokzeugenrecht, dat achtereenvolgens is vermenigvuldigd met
      het op het tijdstip van registratie in het desbetreffende jaar verstreken aantal maanden gedeeld door twaalf,
      en is vermeerderd met het op 31 december van het desbetreffende jaar geldende varkensrecht, respectievelijk
      fokzeugenrecht, dat is vermenigvuldigd met het sedert het tijdstip van de registratie in het desbetreffende jaar
      verstreken aantal maanden gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel15
    url: https://wetten.overheid.nl/BWBR0009763/2002-10-01#Artikel7
    references:
      - id: ref1
