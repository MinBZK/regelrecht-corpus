  - number: '3'
    text: |-
      1 Voor de toepassing van de [artikelen 15, tweede lid][ref1], en [17, derde lid, van de wet][ref2] wordt de in een
      jaar gemiddeld tot het bedrijf behorende oppervlakte landbouwgrond bepaald door de som van het aantal op de eerste
      dag van elke kalendermaand tot het bedrijf behorende hectares landbouwgrond te delen door twaalf.

      2 Indien de [artikelen 15, tweede lid][ref3], en [17, derde lid, van de wet][ref4] op een andere datum dan 1
      januari in werking treden, wordt in afwijking van het eerste lid in het desbetreffende jaar de gemiddeld tot het
      bedrijf behorende oppervlakte landbouwgrond bepaald voor het tijdvak dat bestaat uit het nog niet verstreken deel
      van het jaar naar de som van het aantal op de eerste dag van elke kalendermaand tot het bedrijf behorende hectares
      landbouwgrond, gedeeld door het aantal kalendermaanden waaruit dat tijdvak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009542#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009542#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009542#Artikel15
