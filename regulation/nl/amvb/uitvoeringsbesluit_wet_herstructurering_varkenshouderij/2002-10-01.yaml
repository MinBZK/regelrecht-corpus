  - number: 2a
    text: |-
      1 Indien de tot het bedrijf behorende oppervlakte landbouwgrond in 1996 is verkleind als gevolg van een overdracht
      wordt voor de toepassing van de [artikelen 15, eerste en tweede lid][ref1], en [16, tweede lid, van de wet][ref2]
      alsmede van [artikel 8 van dit besluit][ref3], onder het grondgebonden deel van het varkensrecht, onderscheidenlijk
      fokzeugenrecht, niet begrepen het aantal varkenseenheden dat wordt bepaald door het aantal hectaren waarmee
      de tot het bedrijf behorende oppervlakte landbouwgrond in 1996 als gevolg van de overdracht is verkleind,
      te vermenigvuldigen met 125 kilogram fosfaat, dit product te verminderen met de hoeveelheid fosfaat waarmee
      het voor het bedrijf geldende niet-gebonden mestproductierecht voor varkens en kippen in 1996 op grond van
      [artikel 55, vierde lid, onderdeel b, van de Meststoffenwet][ref4], en artikel 5, onderdelen a, b en c, van het
      Verplaatsingsbesluit Meststoffenwet, als gevolg van de overdracht is toegenomen, en de uitkomst hiervan te delen
      door 7,4 kilogram fosfaat.

      2 Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref5], onderscheidenlijk overeenkomstig
      [paragraaf 1 van hoofdstuk 2 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref6], is bepaald,
      en de overdracht plaatsvond in 1995, onderscheidenlijk 1994, is het eerste lid van overeenkomstige toepassing met
      dien verstande dat in plaats van «1996» telkens wordt gelezen« 1995», onderscheidenlijk: 1994.

      3 Indien het varkensrecht overeenkomstig [artikel 7 van de wet][ref7], onderscheidenlijk overeenkomstig
      [paragraaf 1 van hoofdstuk 2 van het Besluit hardheidsgevallen herstructurering varkenshouderij][ref8], is
      bepaald, en de overdracht plaatsvond in 1996, onderscheidenlijk in 1995 of 1996, wordt voor de toepassing
      van de [artikelen 15, eerste en tweede lid][ref9], en [16, tweede lid, van de wet][ref10] alsmede van
      [artikel 8 van dit besluit][ref11], onder het grondgebonden deel van het varkensrecht, onderscheidenlijk
      fokzeugenrecht, niet begrepen het aantal varkenseenheden dat wordt bepaald door het aantal hectaren waarmee de tot
      het bedrijf behorende oppervlakte landbouwgrond als gevolg van de overdracht is verkleind te vermenigvuldigen met
      125 kilogram fosfaat, en dit product vervolgens te delen door 7,4 kilogram fosfaat.


