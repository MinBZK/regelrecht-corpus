        artikel: '30'
      - id: ref2
        bwb_id: BWBR0009542
        artikel: '15'
  - number: '8'
    text: |-
      Voor de toepassing van [artikel 55a, eerste lid, van de Meststoffenwet][ref1], wordt in dat artikellid in
      plaats van «het overeenkomstig [hoofdstuk II van de Wet herstructurering varkenshouderij][ref2] bepaalde
      varkensrecht achtereenvolgens te vermenigvuldigen met 100/90 en 7,4 kilogram fosfaat» gelezen: het overeenkomstig
      [hoofdstuk II van de Wet herstructurering varkenshouderij][ref3] bepaalde varkensrecht, verminderd met het
      grondgebonden deel daarvan, achtereenvolgens te vermenigvuldigen met 100/90 en 7, 4 kilogram fosfaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel55a
      [ref2]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0009542#HoofdstukII
