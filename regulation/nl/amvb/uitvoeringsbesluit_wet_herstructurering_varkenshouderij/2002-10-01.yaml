        artikel: '15'
  - number: '5'
    text: |-
      In afwijking van de in de [artikelen 18, derde lid][ref1], en [20, tweede lid, van de wet][ref2] genoemde
      percentages waarmee het varkensrecht en het fokzeugenrecht op het tijdstip van registratie worden verminderd, geldt
      een percentage van 0.


