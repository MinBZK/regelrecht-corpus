      1 Voor de toepassing van de [artikelen 15, eerste en tweede lid][ref1], en [16, tweede lid, van de wet][ref2]
      alsmede van [artikel 8 van dit besluit][ref3], wordt onder het grondgebonden deel van het varkensrecht,
      onderscheidenlijk fokzeugenrecht, niet begrepen het op het tijdstip van inwerkingtreding van de wet
      geldende varkensrecht, onderscheidenlijk fokzeugenrecht, voor zover dat als gevolg van de toepassing van de
      [artikelen 7, vierde en vijfde lid][ref4], [9][ref5] of [10 van de wet][ref6] is vergroot ten opzichte van
      het varkensrecht, onderscheidenlijk fokzeugenrecht, zoals dat is bepaald op grond van de [artikelen 6][ref7],
      [7][ref8], [8][ref9] of [11, tweede en derde lid, van de wet][ref10].

      2 Voor zover de hoogte van het varkensrecht en het fokzeugenrecht worden bepaald op grond van het Besluit
      hardheidsgevallen herstructurering varkenshouderij, is het eerste lid van overeenkomstige toepassing ten aanzien
      van het op grond van die regels bepaalde grondgebonden deel van het varkensrecht en het fokzeugenrecht, voor zover
      de [artikelen 9][ref11] en [10 van de wet][ref12] daarbij overeenkomstige toepassing vinden.


