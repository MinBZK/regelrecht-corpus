        bwb_id: BWBR0006813
        artikel: '10'
  - number: '12'
    text: |-
      Onze Minister kan ter uitvoering van krachtens artikel 3, derde lid, en artikel 22 van de richtlijn vastgestelde
      maatregelen:

      a. met betrekking tot [artikel 5][ref1] specifieke regels stellen inzake het onderzoek met behulp van een
      digestiemethode voor het opsporen van trichinose, alsmede inzake het trichinoscopisch of microscopisch onderzoek in
      verband met opsporing van trichinose;

      b. met betrekking tot [artikel 7, eerste en tweede lid][ref2], nadere regels stellen;

      c. met betrekking tot [artikel 8][ref3] afwijkende regels stellen ten einde rekening te houden met de verschillende
      wijzen waarop het vlees van vrij wild in de handel wordt aangeboden;

      d. met betrekking tot [artikel 9, onder ][ref4], nadere regels stellen, met name inzake de toekenning van de
      codenummers en de opstelling van een of meer lijsten aan de hand waarvan de keuringsdierenartsen kunnen worden
      geïdentificeerd;

      e. met betrekking tot [artikel 10, vierde lid, onder ][ref5], de aard en de frequentie van de daarbedoelde
      controles, alsmede de methoden van monsterneming en bacteriologisch onderzoek vaststellen.


