    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.

      2 In afwijking van het eerste lid treedt dit besluit voor vrij-wildinrichtingen waaraan door Onze Minister op de
      voet van artikel 8 van de richtlijn een afwijking is toegestaan van bepaalde eisen van bijlage I, hoofdstuk I, van
      de richtlijn, voor wat betreft die eisen in werking met ingang van 1 januari 1997. Vlees van vrij wild afkomstig
      uit in dit lid bedoelde inrichtingen wordt voorzien van een door Onze Minister vast te stellen stempel.

      3 Wijzigingen van een of meer onderdelen van richtlijnen waarnaar in dit besluit wordt verwezen, treden voor de
      toepassing van de artikelen van dit besluit, waarin naar die onderdelen van deze richtlijnen wordt verwezen, in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
