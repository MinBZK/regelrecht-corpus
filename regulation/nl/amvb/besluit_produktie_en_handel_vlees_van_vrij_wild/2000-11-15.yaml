  - number: '11'
    text: |-
      Voor de toepassing van dit besluit wordt een ter uitvoering van artikel 7 van de richtlijn door een andere lid-
      staat van de Europese Gemeenschappen of andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte erkende inrichting gelijkgesteld met een inrichting, erkend overeenkomstig [artikel 10][ref1]
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006813#Artikel10
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel11
    references:
