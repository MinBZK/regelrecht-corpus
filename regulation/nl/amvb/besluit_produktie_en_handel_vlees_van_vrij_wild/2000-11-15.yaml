  - number: '9'
    text: |-
      Met betrekking tot de produktie en het in de handel brengen van goedgekeurd vlees van vrij wild wordt tevens
      voldaan aan de eisen dat:

      a. het vlees na de onder bevredigende hygiënische omstandigheden uitgevoerde keuring post mortem wordt opgeslagen
      overeenkomstig bijlage I, hoofdstuk X, in een overeenkomstig [artikel 10][ref1] erkende inrichting of in een
      koel- of vrieshuis dat reeds een erkenning heeft ingevolge het [Besluit produktie en handel vers vlees][ref2]
      of ingevolge de Regeling uitvoer vlees en vleesbereidingen 1985 danwel krachtens de
      [Gezondheids- en welzijnswet voor dieren][ref3] en de [Landbouwwet][ref4] ter implementatie van artikel 10 van
      [richtlijn nr. 64/433/EEG](31964L0433) gestelde regels;

      b. het vlees gedurende het vervoer vergezeld gaat van een door de keuringsdierenarts geviseerd begeleidend
      handelsdocument, met dien verstande dat dit document:

        - naast de gegevens, bedoeld in [bijlage I][ref5], [hoofdstuk VII][ref6], [punt 2][ref7], voor ingevroren vlees de
      niet-gecodeerde vermelding van de maand en het jaar van invriezing bevat alsmede het codenummer aan de hand waarvan
      de keuringsdierenarts kan worden geïdentificeerd;
        - gedurende ten minste één jaar door de geadresseerde wordt bewaard, zodat het desgevraagd aan de hoofdinspecteur
      kan worden overgelegd;

      c. het vlees wordt vervoerd onder bevredigende hygiënische omstandigheden overeenkomstig [bijlage I][ref8],
      [hoofdstuk XI][ref9];

      d. het vlees wordt geëtiketteerd onder aanduiding van de benaming van de diersoort;

      e. het vlees voldoet aan de voorschriften van [bijlage I][ref10], [hoofdstuk VIII][ref11], inzake onmiddellijke
      en eindverpakking.


