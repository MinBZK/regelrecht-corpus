  - number: '10'
    text: |-
      1 Onze Minister kan inrichtingen erkennen als vrij-wildverwerkingsinrichtingen, indien zij voldoen aan het bepaalde
      bij of krachtens dit besluit.

      2 Wanneer wordt geconstateerd dat de hygiënevoorschriften niet worden nageleefd en wanneer de in [bijlage I][ref1],
      [hoofdstuk V][ref2], [punt 5][ref3], tweede alinea, bedoelde maatregelen onvoldoende zijn gebleken om dit te
      verhelpen, wordt de erkenning tijdelijk door Onze Minister opgeschort.

      3 Wanneer de exploitant of de beheerder van de inrichting de geconstateerde gebreken niet binnen de door Onze
      Minister vastgestelde termijn verhelpt, trekt Onze Minister de erkenning in.

      4 Aan de erkenning zijn de volgende voorschriften verbonden:

      a. De exploitant of de beheerder van de inrichting doet de algemene hygiëne bij de produktie in zijn inrichting
      regelmatig controleren, ook door middel van microbiologische controles. De controles betreffen de werktuigen,
      installaties en machines in alle produktiestadia en, zo nodig, de produkten.

      b. De exploitant of de beheerder van de inrichting stelt op verzoek de keuringsdierenarts of de veterinaire
      deskundigen van de Commissie van de EEG, bedoeld in artikel 12 van de richtlijn, in kennis van aard, frequentie en
      resultaat van de te dien einde verrichte controles, alsmede, zo nodig, van de naam van het controlelaboratorium.

      c. De exploitant of beheerder van de inrichting geeft medewerking aan de controles, bedoeld in artikel 12 van de
      richtlijn.

      d. De exploitant of de beheerder van de inrichting zet een opleidingsprogramma op dat het personeel in staat
      stelt te voldoen aan de voorschriften inzake hygiënische produktie die zijn aangepast aan de produktiestructuur.
      De keuringsdierenarts die voor de inrichting verantwoordelijk is, wordt bij het opzetten en de uitvoering van dit
      programma worden betrokken.


