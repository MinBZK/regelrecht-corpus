  - number: '3'
    text: |-
      Vlees van vrij wild is slechts geschikt voor menselijke consumptie indien het wordt goedgekeurd. Onze Minister
      bepaalt in welke gevallen vlees van vrij wild wordt afgekeurd en onbruikbaar moet worden gemaakt voor voedsel voor
      mens en dier.
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel3
  - number: '4'
    text: |-
      1 Indien de keuringsdierenarts op grond van de bevindingen bij de keuring de aanwezigheid van residuen vermoedt,
      worden de desbetreffende dieren of het vlees daarvan op residuen onderzocht. Dit onderzoek heeft betrekking op
      opsporing van residuen van stoffen, milieucontaminanten daaronder begrepen, die in het vlees terecht kunnen komen
      en die gevaarlijk of schadelijk kunnen zijn voor de gezondheid van de mens.

      2 Indien in het onderzochte vlees sporen van residuen voorkomen in hoeveelheden die de toegestane toleranties
      overschrijden, wordt dit vlees afgekeurd.

      3 De onderzoeken op residuen worden verricht volgens deugdelijk gebleken methoden die wetenschappelijk zijn erkend,
      in het bijzonder die welke zijn omschreven in de desbetreffende regelingen krachtens het EEG-verdrag of in andere
      internationale normen.

      4 Onze Minister stelt de toleranties vast voor stoffen die in het vlees terecht kunnen komen en die gevaarlijk of
      schadelijk kunnen zijn voor de gezondheid van de mens.

      5 Onze Minister kan het in het eerste lid bedoelde onderzoek voorschrijven ten aanzien van dieren of vlees zonder
      dat sprake is van een bij de keuring ontstaan vermoeden van aanwezigheid van residuen.
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel4
  - number: '5'
    text: |-
      Vlees van everzwijnen of van andere voor trichinose gevoelige soorten wordt onderzocht met behulp van een
      digestiemethode overeenkomstig [richtlijn nr. 77/96/EEG](31977L0096) (*PbEG* L 26) of een trichinoscopisch
      onderzoek met microscopische waarnemingen van veelvoudige monsters van elk dier die ten minste zijn genomen van
      de kauwspieren en de middenrifspieren, het spierstelsel van de onderpoten, het intercostale spierstelsel en het
      spierstelsel van de tong.
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel5
  - number: '6'
    text: |-
      Ingeval de keuringsdierenarts bij de verrichte keuring post mortem een voor de mens besmettelijke ziekte danwel in
      het vlees residugehalten boven de toegestane maxima constateert, stelt hij hiervan onverwijld de hoofdinspecteur
      in kennis.
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel6
  - number: '7'
    text: |-
      1 Vlees van vrij wild dat is afgekeurd, dient duidelijk te kunnen worden onderscheiden van vlees van vrij wild dat
      is goedgekeurd.

      2 Vlees van vrij wild dat is afgekeurd, ondergaat een behandeling overeenkomstig [richtlijn nr. 90/667/EEG]
      (31990L0667) (*PbEG* L 363).

      3 Vlees van vrij wild afkomstig uit een zone waarvoor veterinairrechtelijke beperkingen gelden, wordt onderworpen
      aan door Onze Minister, in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij, vastgestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#Artikel7
  - number: '8'
    text: |-
      Vlees van vrij wild dat is goedgekeurd, wordt voorzien van een keurmerk overeenkomstig [bijlage I][ref1],
      [hoofdstuk VII][ref2].


