    text: |-
      Met betrekking tot de produktie en het in de handel brengen van vlees van vrij wild wordt voldaan aan de eisen
      dat het:

      a. afkomstig is van vrij wild dat:

        - gedood is in een jachtgebied met door de [Jachtwet][ref1] geoorloofde middelen;
        - niet afkomstig is uit een gebied waarvoor veterinairrechtelijke beperkingen gelden;
        - onmiddellijk na het doden bereid is overeenkomstig [bijlage I][ref2], [hoofdstuk III][ref3], en binnen ten
      hoogste twaalf uur vervoerd is naar een overeenkomstig [artikel 10][ref4] erkende vrij-wildverwerkingsinrichting,
      danwel naar een verzamelplaats waar het op de in [bijlage I][ref5], [hoofdstuk III][ref6], voorgeschreven
      temperaturen moet worden gebracht en waarvandaan het naar een zodanige vrij-wildverwerkingsinrichting moet worden
      vervoerd binnen twaalf uur, of, voor afgelegen gebieden, en wanneer de klimaatomstandigheden zulks toestaan,
      binnen een door de hoofdinspecteur vast te stellen termijn om de keuringsdierenarts de mogelijkheid te bieden de in
      [bijlage I][ref7], [hoofdstuk V][ref8], bedoelde keuring post mortem onder bevredigende voorwaarden te verrichten;

      b. verkregen is in een overeenkomstig [artikel 10][ref9] erkende vrij-wildverwerkingsinrichting.
      Voor zover als zodanig wordt erkend een inrichting die reeds een erkenning heeft ingevolge het
      [Besluit produktie en handel vers vlees][ref10] of ingevolge de Regeling uitvoer vlees en vleesbereidingen 1985
      danwel krachtens de [Gezondheids- en welzijnswet voor dieren][ref11] en de [Landbouwwet][ref12] ter implementatie
      van artikel 10 van [richtlijn nr. 64/433/EEG](31964L0433) gestelde regels:

        - worden de gehele stukken vrij wild in andere dan de voor het in genoemde regelingen bedoelde vlees gereserveerde
      lokalen danwel op andere tijdstippen onthuid,
        - worden maatregelen genomen zodat duidelijk blijkt of sprake is van vlees van vrij wild of van vlees in de zin van
      de in de aanhef bedoelde regelingen;

      c. afkomstig is van gedode dieren die door de keuringsdierenarts visueel zijn onderzocht, ten einde:

        - eventuele afwijkingen op te sporen;
        - na te gaan of de dood niet aan andere oorzaken dan de jacht is te wijten;

      d. afkomstig is van:

      1. hetzij gehele stukken onthuid vrij wild:

        - die zijn gehanteerd onder bevredigende hygiënische omstandigheden, overeenkomstig [bijlage I][ref13],
      [hoofdstukken III][ref14] en [IV][ref15];
        - die overeenkomstig [bijlage I][ref16], [hoofdstuk V][ref17], post mortem zijn gekeurd door de keuringsdierenarts
      of door keurmeesters die voldoen aan door Onze Minister te stellen eisen van vakbekwaamheid en handelen onder
      toezicht van de keuringsdierenarts;
        - die geen afwijkingen hebben vertoond, met uitzondering van bij het doden opgelopen traumatische laesies of
      van plaatselijke misvormingen of afwijkingen, voor zover is geconstateerd, zo nodig met behulp van geschikte
      laboratoriumtests, dat deze het vlees niet ongeschikt maken voor menselijke consumptie, noch enig gevaar opleveren
      voor de gezondheid van de mens;

      2. hetzij gehele stukken niet-onthuid vrij wild:

        - die voldoen aan de eisen gesteld bij onderdeel *a*, onderdeel *c* en onderdeel *d*, onder 1, eerste
      gedachtenstreepje;
        - die in een overeenkomstig [artikel 10][ref18] erkende vrij-wildverwerkingsinrichting een keuring post mortem van
      de ingewanden hebben ondergaan;
        - die vergezeld gaan van een gezondheidscertificaat, waarvan het model wordt vastgesteld door Onze Minister, dat
      door de keuringsdierenarts wordt ondertekend en waarin wordt verklaard dat het resultaat van de hierboven bedoelde
      keuring post mortem bevredigend is en dat het vlees geschikt is voor menselijke consumptie;
        - die gebracht zijn op een temperatuur die hoger is dan of gelijk is aan -1 °C en: i). lager dan + 7 °C en op deze
      temperatuur zijn gehouden tijdens het vervoer naar een erkende vrij-wildverwerkingsinrichting binnen een termijn
      van ten hoogste zeven dagen die begint te lopen vanaf eerdergenoemde keuring post mortem of ii). lager dan + 1 °C
      en op deze temperatuur zijn gehouden tijdens het vervoer naar een erkende vrijwildverwerkingsinrichting binnen een
      termijn van ten hoogste vijftien dagen die begint te lopen vanaf eerdergenoemde keuring post mortem;
        - die overeenkomstig [bijlage I][ref19], [hoofdstuk V][ref20], post mortem zijn gekeurd door de keuringsdierenarts
      na te zijn onthuid.


