preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 23 augustus 1993 DGVgz/VVP/V-
    931459, gedaan in overeenstemming met de Staatssecretaris van Landbouw, Natuurbeheer en Visserij;

    Gelet op richtlijn nr. 92/45/EEG van de Raad van de Europese Gemeenschappen van 16 juni 1992 betreffende de
    gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de
    handel brengen van vlees van vrij wild (PbEG L 268) alsmede op de artikelen 1, 18, 19, 19a, 25 en 30a van de
    Vleeskeuringswet;

    De Raad van State gehoord (advies van 16 maart 1994, nr. W13.93.0592);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 29 juni 1994, DGVgz/VVP/V-
    941074, uitgebracht in overeenstemming met de Staatssecretaris van Landbouw, Natuurbeheer en Visserij.

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006813/2000-11-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;

      b. de wet: de [Vleeskeuringswet][ref1];

      c. hoofdinspecteur: de veterinaire hoofdinspecteur van de Keuringsdienst van Waren;

      d. keuringsdierenarts: persoon, bedoeld in de eerste zinsnede van artikel 25 van de wet, belast met keuring van
      slachtdieren en van vlees;

      e. de richtlijn: [richtlijn nr. 92/45/EEG](31992L0045) van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor het doden van vrij wild en het in de handel
      brengen van vlees van vrij wild (*PbEG* L 268);

      f. karkas: het uitgebloede gehele slachtdier dat is ontdaan van de ingewanden, waarvan de poten zijn afgesneden
      ter hoogte van het voorkniegewricht respectievelijk het spronggewricht, en waarvan de kop, de staart en de uier
      zijn verwijderd;

      g. ingewanden: het slachtafval in de borst-, buik- en de bekkenholte, met inbegrip van de luchtpijp en de slokdarm;

      h. vervoermiddelen: voor belading bestemde gedeelten van motorvoertuigen, van spoorvoertuigen en van
      luchtvaartuigen, alsmede scheepsruimten of containers voor het vervoer over land, over zee of door de lucht;

      i. onmiddellijke verpakking: het beschermen van vers vlees door middel van een eerste omhulsel of een eerste
      bergingsmiddel dat rechtstreeks in contact komt met het betrokken verse vlees, alsmede het eerste omhulsel of het
      eerste bergingsmiddel zelf;

      j. eindverpakking: het plaatsen van vers vlees in onmiddellijke verpakking in een tweede bergingsmiddel, alsmede
      het bergingsmiddel zelf;

      k. vrij wild: bejaagde niet-gedomesticeerde landzoogdieren van de familie der hoefdieren (met inbegrip van niet-
      gedomesticeerde zoogdieren die in een gesloten gebied leven met een zelfde vrijheid als vrij wild) die niet in
      gevangenschap zijn gekweekt, gehouden en geslacht;

      l. vlees van vrij wild: alle voor menselijke consumptie geschikte delen van vrij wild;

      m. vrij-wildverwerkingsinrichting: inrichting waar het vrij wild wordt behandeld en vlees van vrij wild wordt
      verkregen en gekeurd overeenkomstig de hygiënevoorschriften van dit besluit;

      n. verzamelplaats: plaats waar gedood vrij wild overeenkomstig de hygiënevoorschriften van [bijlage I][ref2],
      [hoofdstuk III][ref3], [punt 2][ref4], wordt ingeleverd met het oog op het vervoer naar een vrij-
      wildverwerkingsinrichting;

      o. in de handel brengen: het in bezit hebben of uitstallen met het oog op verkoop, het te koop aanbieden, het
      verkopen, het leveren of op enigerlei andere wijze in Nederland op de markt brengen van vlees van vrij wild voor
      menselijke consumptie;

      p. [richtlijn nr. 64/433/EEG](31964L0433): de [richtlijn nr. 64/433/EEG](31964L0433) van de Raad van de Europese
      Gemeenschappen betreffende de produktie en het in de handel brengen van vers vlees (*PbEG* L 121);

      q. [richtlijn nr. 90/667/EEG](31990L0667): de [richtlijn nr. 90/667/EEG](31990L0667) van de Raad van de Europese
      Gemeenschappen van 27 november 1990 tot vaststelling van gezondheidsvoorschriften voor de verwijdering en
      verwerking van dierlijke afvallen en ter voorkoming van de aanwezigheid van ziekteverwekkers in diervoeders van
      dierlijke oorsprong (vissen daaronder begrepen) en tot wijziging van [richtlijn nr. 90/425/EEG](31990L0425) (*PbEG*
      L 363);

      r. [richtlijn nr. 77/96/EEG](31977L0096): de [richtlijn nr. 77/96/EEG](31977L0096) van de Raad van de Europese
      Gemeenschappen van 21 december 1976 inzake het opsporen van trichinen bij de invoer van vers vlees van varkens en
      huisdieren uit derde landen (*PbEG* L 26);

      2 Dit besluit is niet van toepassing op:

      a. het afstaan door de jager aan de consument of aan de kleinhandelaar van kleine aantallen gehele stukken niet-
      onthuid vrij wild;

      b. het afstaan van kleine hoeveelheden vlees van vrij wild aan de eindverbruiker;

      c. het uitsnijden en opslaan van vlees van vrij wild in detailhandelzaken of in lokalen die aan verkooppunten
      grenzen, waar het uitsnijden en opslaan uitsluitend met het oog op rechtstreekse verkoop ter plaatse aan de
      consument geschieden.

      3 Met ingang van een door Onze Minister te bepalen datum wordt onder "vrij wild" tevens verstaan: kangoeroes.


