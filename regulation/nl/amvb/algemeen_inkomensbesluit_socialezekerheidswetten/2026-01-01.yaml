  - number: 2:9.1
    text: |-
      Voor het bepalen van inkomen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________ geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel29
    references:
