    text: loondoorbetaling wordt aangemerkt als overig inkomen;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel210
  - number: 2:10.b
    text: |-
      niet als inkomen wordt aangemerkt een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel l][ref1], of een
      uitkering die naar aard en strekking daarmee overeenkomt; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:10.c
    text: |-
      indien op grond van [artikel 7, eerste lid, van de Toeslagenwet][ref1] van het inkomen uit arbeid een
      gedeelte is vrijgelaten, de op dat inkomen betrekking hebbende uitkeringen op grond van de verplichte
      verzekering van de [Ziektewet][ref2], op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref3],
      [artikel 4:2b][ref4] of [6:3 van de Wet arbeid en zorg][ref5] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref6] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref7], voor zolang de dienstbetrekking voortduurt, alsmede aanvullingen op die uitkeringen als
      inkomen uit arbeid worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel210
    references:
