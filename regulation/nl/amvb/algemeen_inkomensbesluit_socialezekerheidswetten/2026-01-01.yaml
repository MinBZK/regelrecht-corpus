  - number: 1:1.3
    text: |-
      In geval van toepassing van dit besluit voor het bepalen van het inkomen, bedoeld in de
      [artikelen 8, eerste lid][ref1], [10, eerste en tweede lid][ref2], en [11 van de Algemene Ouderdomswet][ref3],
      wordt, in afwijking van het eerste lid, onder uitkeringsgerechtigde verstaan de echtgenoot van de
      pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel11
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel11
    references:
      - id: ref1
