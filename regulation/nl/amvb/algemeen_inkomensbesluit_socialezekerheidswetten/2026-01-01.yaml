        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 2:4.5
    text: |-
      Indien een recht op uitkering op grond van de [Werkloosheidswet][ref1] geheel of gedeeltelijk is geëindigd omdat de
      uitkeringsgerechtigde minder beschikbaar is voor arbeid dan het aantal arbeidsuren dat hij heeft verloren wordt die
      uitkering in aanmerking genomen alsof die eindiging niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel24
    references:
