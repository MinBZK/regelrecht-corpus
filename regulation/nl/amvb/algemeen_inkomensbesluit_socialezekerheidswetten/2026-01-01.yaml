      [artikelen 2:2, eerste lid, onderdeel a][ref2], en [2:4, eerste lid, onderdelen l en o][ref3], dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel210
