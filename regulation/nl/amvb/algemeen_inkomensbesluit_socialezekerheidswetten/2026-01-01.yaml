        bwb_id: BWBR0001888
        artikel: '29'
  - number: 2:1
    text: |-
      Dit hoofdstuk is van toepassing op het bepalen van inkomen als bedoeld in de [Algemene nabestaandenwet][ref1],
      de [Algemene Ouderdomswet][ref2], de [Toeslagenwet][ref3], de [Wet inkomensvoorziening oudere werklozen][ref4],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0004043
      [ref4]: https://wetten.overheid.nl/BWBR0024394
