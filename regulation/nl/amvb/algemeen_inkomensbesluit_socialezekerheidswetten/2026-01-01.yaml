        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:8.1.a
    text: |-
      een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel l][ref1], en een uitkering die naar aard en
      strekking overeenkomt met een uitkering als bedoeld in artikel 2:4, eerste lid, onderdeel l;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:8.1.b
    text: |-
      een eenmalige premie die door burgemeester en wethouders kan worden toegekend in het kader van een voorziening
      gericht op arbeidsinschakeling van ten hoogste € 3.398,00 per kalenderjaar; en
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel28
  - number: 2:8.1.c
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste de in
      [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref1], genoemde gezamenlijke waarden per maand en per
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: 2:8.2
    text: |-
