        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '11'
  - number: 1:1.4
    text: |-
      Indien een uitkeringsgerechtigde recht heeft op een uitkering op grond van
      [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref1] wordt die uitkering steeds aangemerkt als een
      reguliere WW-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel11
