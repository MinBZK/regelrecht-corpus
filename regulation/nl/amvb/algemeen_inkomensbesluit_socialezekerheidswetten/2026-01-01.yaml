  - number: 2:2.1
    text: 'Onder inkomen uit arbeid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
  - number: 2:2.1.a
    text: |-
      hetgeen onder loon wordt verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref1]
      voor de werknemer, bedoeld in [artikel 1, onderdeel o, van die wet][ref2] met dien verstande dat niet tot het
      inkomen uit arbeid worden gerekend uitkeringen op grond van een werknemersverzekering of wachtgeld als bedoeld
      in [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref3], al dan niet vermeerderd met een toeslag op
      grond van de [Toeslagenwet][ref4] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking
      staat of stond;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004043
  - number: 2:2.1.b
    text: |-
      het loon, bedoeld in de [artikelen 9 tot en met 13 van de Wet op de loonbelasting 1964][ref1], voor zover de
      uitkeringsgerechtigde niet als werknemer als bedoeld in onderdeel a inkomen verdient, met dien verstande dat niet
      tot het inkomen uit arbeid worden gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
  - number: 2:2.1.b.1°
    text: |-
      hetgeen uit een vroegere dienstbetrekking als bedoeld in die [wet][ref1] wordt genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 2:2.1.b.3°
    text: |-
      de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 2:2.1.c
    text: |-
      het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref1]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref2], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref3], en
      [3.92 van die wet][ref4], voor zover de uitkeringsgerechtigde geen werknemer is als bedoeld in de onderdelen a
      en b;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.3.1
      - id: ref2
        bwb_id: BWBR0011353
        paragraaf: 3.4.1
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2:2.1.d
    text: |-
      de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1],
      vermeerderd met de ondernemersaftrek en de MKB-winstvrijstelling, bedoeld in de [artikelen 3.74][ref2]
      en [3.79a van die wet][ref3], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, van die wet][ref4], niet geacht worden te behoren tot de winst;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2:2.1.e
    text: |-
      een uitkering op grond van de [Wet arbeid en zorg][ref1] aan de zelfstandige of de beroepsbeoefenaar
      op arbeidsovereenkomst, bedoeld in [artikel 3:17, eerste lid, onder a en b, van die wet][ref2]
      waaronder mede wordt verstaan een uitkering als bedoeld in [artikel 4:2b, zevende lid][ref3], of
      [artikel 6:3, zevende lid, van die wet][ref4] aan die persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel6
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '6'
  - number: 2:2.1.f
    text: |-
      een uitkering op grond van [artikel 29, tweede lid, onderdelen e tot en met g, van de Ziektewet][ref1],
      indien tevens sprake is van een privaatrechtelijke of een publiekrechtelijke dienstbetrekking als bedoeld in
      [artikel 3, eerste lid, van de Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '3'
  - number: 2:2.2
    text: |-
      Indien het inkomen, bedoeld in het eerste lid, onderdelen c of d, een negatief bedrag is, dan wordt dat inkomen op
      nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
  - number: 2:2.3
    text: |-
      Indien geen recht op loondoorbetaling bestaat door toepassing van
      [artikel 629, derde of negende lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of een algemeen verbindend
      voorschrift als bedoeld in [artikel 76b, eerste tot en met het derde lid, van de Ziektewet][ref2], dan wel de
      betaling daarvan geheel of gedeeltelijk is opgeschort door toepassing van artikel 629, zesde lid, van Boek 7 van
      het Burgerlijk Wetboek, wordt voor de toepassing van dit artikel het loon of de bezoldiging in aanmerking genomen
      als ware er wel recht op doorbetaling en ware deze niet geheel of gedeeltelijk opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76b
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76b
  - number: 2:3.1
    text: |-
      Gedurende de periode dat de uitkeringsgerechtigde: a. recht heeft op een uitkering als bedoeld in
      [hoofdstuk IV van de Werkloosheidswet][ref1]; b. recht heeft op een uitkering in verband met werkloosheid
      als bedoeld in [artikel 18, eerste lid, van de Werkloosheidswet][ref2]; c. recht heeft op een uitkering in
      verband met werkloosheid die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3] ontheffing is verleend; of d.
      met verlof is, wordt als inkomen uit arbeid beschouwd het inkomen dat werd genoten in het aangiftetijdvak voor het
      aangiftetijdvak waarin: 1°. het recht ontstond op een uitkering als bedoeld in de onderdelen a tot en met c. 2°.
      het verlof aanving.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 2:3.2
    text: |-
      Niet als inkomen uit arbeid wordt beschouwd het loon dat door de uitkeringsgerechtigde wordt genoten indien hij
      tegelijkertijd uit hoofde van dezelfde arbeidsrelatie inkomen als bedoeld in het eerste lid geniet.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel23
  - number: 2:4.1
    text: 'Onder overig inkomen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel24
  - number: 2:4.1.a
    text: |-
      een uitkering op grond van de [Werkloosheidswet][ref1] met uitzondering van de uitkeringen, bedoeld in
      [artikel 2:3, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:4.1.b
    text: |-
