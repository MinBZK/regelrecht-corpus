      van toepassing is, wordt het inkomen dat is vastgesteld op grond van de [artikelen 10][ref2]
      en [11 van de Algemene Ouderdomswet][ref3], zoals deze luidden voor de inwerkingtreding van de
      [Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving][ref4], eveneens aangemerkt als het inkomen van die
      echtgenoot in het kader van [artikel 12 van de Algemene Ouderdomswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel64a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel11
