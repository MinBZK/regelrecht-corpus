  - number: 2:11
    text: |-
      Voor het bepalen van inkomen als bedoeld in de [Wet inkomensvoorziening oudere werklozen][ref1] geldt in afwijking
      van [artikel 2:4, eerste lid, onderdelen h tot en met l en o][ref2], dat niet als overig inkomen wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0024394
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel211
    references:
