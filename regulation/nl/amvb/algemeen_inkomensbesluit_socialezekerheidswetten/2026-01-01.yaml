        paragraaf: '1'
  - number: 2:5.2
    text: |-
      Indien over het inkomen uit arbeid of overig inkomen geen aanspraak op vakantiebijslag bestaat, wordt van
      dit inkomen slechts in aanmerking genomen: 100 x B / (100 + A) waarbij: A staat voor het percentage van de
      vakantiebijslag, bedoeld in [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1]; en B
      staat voor het inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel25
    references:
