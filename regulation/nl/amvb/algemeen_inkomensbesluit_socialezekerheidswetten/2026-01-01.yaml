    text: |-
      de winst, bedoeld in onderdeel a, wordt gecorrigeerd met alle geldelijke voor- en nadelen voor
      de gewezen zelfstandige, die uit diens verhouding tot de besloten of naamloze vennootschap
      voortvloeien, tenzij het inkomen uit arbeid of overig inkomen betreft als bedoeld in
      [artikel 2:2, eerste lid, onderdeel a tot en met c, e en f,][ref1] en [artikel 2:4, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel29
