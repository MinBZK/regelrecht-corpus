    text: |-
      [Artikel 2:3, eerste lid, onderdeel c][ref1], zoals dat luidde voor de inwerkingtreding van artikel I, onderdeel
      A, van het besluit van 18 juni 2015, houdende wijziging van enige algemene maatregelen van bestuur in verband
      met de Wet werk en zekerheid, het invoeren van een ontheffing in verband met de zorg voor een pasgeboren kind bij
      overlijden van de moeder, een wijziging van het Remigratiebesluit in verband met de berekenwijze van de jaarlijkse
      indexatie van de remigratie-uitkeringen, het vrijlaten van de afkoopsom klein pensioen voor verschillende
      uitkeringen in het Algemeen inkomensbesluit socialezekerheidswetten alsmede enkele technische wijzigingen in
      enkele besluiten (Stb. 242), blijft van toepassing op de uitkeringsgerechtigde die recht heeft op een uitkering
      in verband met werkloosheid die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] ontheffing is verleend.


