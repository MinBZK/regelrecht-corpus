        bwb_id: BWBR0024394
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:11.a
    text: |-
      een uitkering of toeslag als bedoeld in [artikel 2:4, eerste lid, onderdelen h tot en met l][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel211
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:11.b
    text: |-
      een uitkering of toeslag die naar aard en strekking overeenkomt met een uitkering of toeslag als bedoeld in
      onderdeel a.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel211
  - number: 3:1
    text: |-
      Dit hoofdstuk is van toepassing op het bepalen van inkomen als bedoeld in de
      [Werkloosheidswet][ref1], de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3] en de [Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0001888
  - number: 3:2.1
    text: 'Onder inkomen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.1.a
    text: |-
      hetgeen onder loon wordt verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref1]
      voor de werknemer, bedoeld in [artikel 1, onderdeel o, van die wet][ref2], met dien verstande dat niet tot het
      inkomen worden gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '1'
  - number: 3:2.1.a.1°
    text: |-
      uitkeringen op grond van een werknemersverzekering of wachtgeld als bedoeld in
      [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref1], al dan niet vermeerderd met een toeslag op
      grond van de [Toeslagenwet][ref2] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking
      staat;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004043
  - number: 3:2.1.a.2°
    text: |-
      hetgeen wordt genoten uit loondoorbetaling indien het overeengekomen loon niet volledig wordt doorbetaald, al dan
      niet vermeerderd met een toeslag op grond van de [Toeslagenwet][ref1] en de aanvullingen daarop van degene tot wie
      de werknemer in dienstbetrekking staat;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 3:2.1.b
    text: |-
      het loon, bedoeld in [hoofdstuk II van de Wet op de loonbelasting 1964][ref1], voor zover de uitkeringsgerechtigde
      niet als werknemer als bedoeld in onderdeel a inkomen verdient, met dien verstande dat niet tot het inkomen worden
      gerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: II
  - number: 3:2.1.b.1°
    text: hetgeen uit een vroegere dienstbetrekking als bedoeld in die wet wordt genoten;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.1.b.2°
    text: |-
      de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 3:2.1.c
    text: |-
      het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref1]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref2], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref3], en
      [3.92 van die wet][ref4], voor zover de uitkeringsgerechtigde geen werknemer is als bedoeld in de onderdelen a
      en b;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.3.1
      - id: ref2
        bwb_id: BWBR0011353
