        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 3:3.2.c
    text: |-
      een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of een op basis van een wettelijke regeling
      verstrekte uitkering die naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
