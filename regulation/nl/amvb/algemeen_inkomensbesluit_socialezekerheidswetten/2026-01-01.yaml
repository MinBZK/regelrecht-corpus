        artikel: 7a
  - number: 3:3.2.d
    text: 'een op basis van een wettelijke regeling verstrekte uitkering die naar aard en strekking overeenkomt met:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.2.d.1
    text: uitkering als bedoeld in het vijfde lid, onderdeel a; of
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.2.d.2
    text: |-
      uitkering als bedoeld in het vijfde lid, onderdeel b, met uitzondering van een
      bovenwettelijke werkloosheidsuitkering voor overheidswerknemers als bedoeld in
      [artikel 1, onderdeel j, van de Werkloosheidswet][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: 3:3.3
    text: |-
      Indien de uitkeringsgerechtigde die recht heeft op een uitkering op grond van [artikel 18][ref1] of
      [hoofdstuk IV van de Werkloosheidswet][ref2] of [artikel 29, tweede lid, van de Ziektewet][ref3] met verlof gaat,
      wordt tevens onder inkomen verstaan het inkomen als bedoeld in [artikel 3:2, eerste lid][ref4], dat werd genoten
      in het aangiftetijdvak voor het aangiftetijdvak waarin het verlof aanving, mits het recht op verlof is ontstaan uit
      werkzaamheden die zijn gestart nadat een eerder recht op uitkering op grond van artikel 18 of hoofdstuk IV van de
      Werkloosheidswet of artikel 29, tweede lid, van de Ziektewet is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.4
    text: |-
      Indien voor de uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van [artikel 18][ref1] of
      [hoofdstuk IV van de Werkloosheidswet][ref2] of [artikel 29, tweede lid, van de Ziektewet][ref3], recht ontstaat
      op:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 3:3.4.a
    text: |-
      een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 3:3.4.b
    text: |-
      een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 3:3.5
    text: |-
      Indien voor de uitkeringsgerechtigde naast een recht op uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] recht bestaat op:


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 3:3.5.a
    text: |-
      een uitkering op grond [artikel 29, tweede lid, van de Ziektewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 3:3.5.b
    text: |-
      een reguliere WW-uitkering of een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 3:3.6
    text: 'In geval van een uitkeringsgerechtigde voor wie naast een reguliere WW-uitkering, recht bestaat op:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.6.a
    text: |-
      een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 3:3.6.b
    text: |-
      een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 3:3.7
    text: |-
      In geval van een uitkeringsgerechtigde voor wie naast een reguliere WW-uitkering nog een recht ontstaat op een
      reguliere WW-uitkering, wordt het maandloon van de laatst ontstane uitkering aangemerkt als inkomen voor het eerst
      ontstane recht.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.8
    text: |-
      Indien de uitkeringsgerechtigde, die recht heeft op een reguliere WW-uitkering of op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] met verlof is, wordt tevens onder inkomen verstaan het inkomen als
      bedoeld in [artikel 3:2, eerste lid][ref2], dat werd genoten in het aangiftetijdvak voor het aangiftetijdvak waarin
      het verlof aanving.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.9
    text: |-
      Voor zover de uitkeringsgerechtigde die recht heeft op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] op de dag voorafgaand aan de eerste dag van de wachttijd, bedoeld
      in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref2], recht heeft op een uitkering als bedoeld in
      het tweede lid, onderdeel c, wordt die uitkering niet aangemerkt als inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 3:3.10
    text: |-
      Indien geen recht op loondoorbetaling bestaat door toepassing van
      [artikel 629, derde of negende lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of een algemeen verbindend
      voorschrift als bedoeld in [artikel 76b, eerste tot en met het derde lid, van de Ziektewet][ref2], of op gronden
      die naar aard en strekking daarmee overeenkomen, wordt voor de toepassing van dit artikel het loon of bezoldiging
      in aanmerking genomen als ware er wel recht op doorbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76b
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76b
  - number: 3:3.11
    text: |-
      Indien de uitkering op grond van de [Werkloosheidswet][ref1] is geëindigd omdat de uitkeringsgerechtigde
      niet beschikbaar is voor arbeid, wordt die uitkering in aanmerking genomen alsof die eindiging niet heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3:3.12
    text: |-
      Na het bepalen van het inkomen op grond van het vierde tot en met zesde lid wordt voor de toepassing
      van die leden het dagloon niet herzien als bedoeld in de [artikelen 16 van de Ziektewet][ref1] of
      [1b, zevende lid van de Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 1b
  - number: 3:3.13
    text: |-
      Indien er sprake is van een per aangiftetijdvak wisselend inkomen, wordt, in afwijking van het eerste,
      tweede, derde of achtste lid of [artikel 3:2, twintigste lid][ref1] als inkomen aangemerkt het gemiddelde van het
      inkomen in de drie aangiftetijdvakken voor het aangiftetijdvak waarin het recht ontstond op de doorbetaling van
      loon, bezoldiging of uitkering, bedoeld in het eerste of tweede lid, of [artikel 3:2, twintigste lid][ref2], of
      het verlof, bedoeld in het derde of achtste lid, aanving, met dien verstande dat bij de toepassing van dit lid het
      veertiende lid van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.14
    text: |-
      Indien het inkomen in het voorliggende aangiftetijdvak, bedoeld in het eerste, tweede, derde, achtste of dertiende
      lid, of [artikel 3:2, twintigste lid][ref1], minder bedraagt dan het inkomen, de loondoorbetaling, bezoldiging of
      uitkering in het te vervangen aangiftetijdvak, bedoeld in de genoemde leden, wordt in afwijking van de genoemde
      leden, als inkomen aangemerkt het inkomen dat, of de loondoorbetaling, bezoldiging of uitkering die is genoten in
      het te vervangen aangiftetijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.15
    text: |-
      Bij de toepassing van het eerste, tweede, derde, achtste, dertiende of veertiende lid, of
      [artikel 3:2, twintigste lid][ref1], wordt het betaalde bedrag aan vakantiebijslag en het betaalde
      arbeidsvoorwaardenbedrag:


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:3.15.a
    text: |-
      tevens onder inkomen verstaan voor zover dat bedrag is betaald in het te vervangen aangiftetijdvak, bedoeld in de
      genoemde leden, en dat bedrag nog niet in aanmerking is genomen;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.15.b
    text: |-
      niet onder inkomen verstaan voor zover dat bedrag is betaald in het voorliggende aangiftetijdvak, bedoeld in de
      genoemde leden, en dat bedrag reeds als inkomen in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:4.1
    text: |-
      Voor het bepalen van het inkomen, bedoeld in
      [artikel 52, vierde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], geldt dat het
      loon dat door de werkgever wordt betaald, voordat het recht op loondoorbetaling, bedoeld in
      [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] voor het eerst is geëindigd, niet als
      inkomen wordt aangemerkt, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 3:4.1.a
    text: |-
      sprake is van een verkorte wachttijd als bedoeld in
      [artikel 23, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 3:4.1.b
    text: |-
      de uitkeringsgerechtigde geen recht had op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt was na
      afloop van de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1]
      en de volledige en duurzame arbeidsongeschiktheid intreedt binnen vijf jaar daarna en voortkomt uit dezelfde
      oorzaak als op grond waarvan hij gedurende die wachttijd ongeschikt was tot het verrichten van arbeid; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 3:4.1.c
    text: |-
      de uitkeringsgerechtigde op de dag voorafgaand aan het intreden van de volledige en duurzame arbeidsongeschiktheid
      recht had op een WGA-uitkering.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
  - number: 3:4.2
    text: |-
      Voor het bepalen van het inkomen, bedoeld in de [artikelen 60, eerste lid, aanhef en onderdeel a][ref1], en
      [61, tweede en vierde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2], geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel61
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '61'
  - number: 3:4.2.a
    text: |-
      indien de uitkeringsgerechtigde recht heeft op een uitkering op grond van
      [artikel 29, tweede lid, van de Ziektewet][ref1], [artikel 3:2, achtste, negende of tiende lid][ref2], uitsluitend
      van toepassing is indien de dienstbetrekking voortduurt op grond waarvan het recht op uitkering ontstond;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.b
    text: |-
      [artikel 3:3, tweede lid, onderdeel d, onder 1°][ref1], uitsluitend van toepassing is indien de dienstbetrekking
      voortduurt op grond waarvan het recht op uitkering ontstond;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.c
    text: |-
      [artikel 3:3, achtste lid][ref1], uitsluitend van toepassing is indien het verlof als bedoeld in de
      [Wet arbeid en zorg][ref2] betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
  - number: 3:4.2.d
    text: |-
      [artikel 3:3, vijfde lid, onderdeel a][ref1], uitsluitend van toepassing is, indien de dienstbetrekking voortduurt
      op grond waarvan het recht op uitkering ontstond;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.e
    text: |-
      indien de uitkeringsgerechtigde recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1] zijn
      [artikelen 3:2][ref2] en [3:3][ref3] niet van toepassing met dien verstande dat onder inkomen wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.e.1°
    text: |-
      indien het een reguliere WW-uitkering of een uitkering op grond van [hoofdstuk III van de Werkloosheidswet][ref1]
      betreft, het inkomen, bedoeld in [artikel 3:2, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.e.2°
    text: |-
      indien het een WW-uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref1] of een naar aard en strekking
      overeenkomstige regeling betreft, het inkomen, bedoeld in [artikel 3:2, eerste lid][ref2], dat werd genoten in het
      aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op die uitkering en het inkomen, bedoeld in artikel
      3:2, eerste lid, tenzij dat inkomen wordt ontvangen uit de dienstbetrekking waaruit de uitkeringsgerechtigde
      werkloos is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:4.2.e.3°
    text: |-
      indien het een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1] betreft, het dagloon op grond
      waarvan die uitkering wordt berekend en het inkomen, bedoeld in [artikel 3:2, eerste lid][ref2], tenzij dat inkomen
      wordt ontvangen uit de dienstbetrekking waaruit de uitkeringsgerechtigde werkloos is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:5.1
    text: |-
      [ Artikel 3:2, eerste lid, onderdeel b, c, d en e][ref1], is niet van toepassing bij de vaststelling van het
      inkomen voor de [Werkloosheidswet][ref2], tenzij


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: 3:5.1.a
    text: |-
      deze onderdelen betrekking hebben op bezoldiging in verband met het uitoefenen van werkzaamheden als lid van de
      Eerste Kamer der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam, dat bij
      rechtstreekse verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
  - number: 3:5.1.b
    text: |-
      [artikel 3:2, eerste lid, onderdeel e][ref1], betrekking heeft op een uitkering als bedoeld in
      [artikel 4:2b, zevende lid][ref2], of [artikel 6:3, zevende lid, van de Wet arbeid en zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel6
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '6'
  - number: 3:5.2
    text: |-
      [Artikel 3:3, eerste lid, onderdeel c en tweede lid, onderdeel c][ref1] zijn niet van toepassing bij de
      vaststelling van inkomen voor de [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
  - number: 3:5.3
    text: |-
      Voor zover de uitkeringsgerechtigde op de dag voorafgaand aan de eerste dag van werkloosheid, bedoeld in
      [artikel 16a van de Werkloosheidswet][ref1], inkomen ontvangt als bedoeld in het eerste lid, wordt dat inkomen niet
      in aanmerking genomen voor de uitkering op grond van de [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 16a
      - id: ref2
        bwb_id: BWBR0004045
  - number: 3:5.4
    text: |-
      Voor de [Werkloosheidswet][ref1] wordt als inkomen in verband met arbeid beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3:5.4.a
    text: |-
      een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3:5.4.b
    text: |-
      een uitkering op grond van het bepaalde bij of krachtens dan wel op de voet van de
      [Algemene pensioenwet politieke ambtsdragers][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: 3:5.4.c
    text: een wettelijke buitenlandse uitkering wegens arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
  - number: 3:5.5
    text: |-
      In afwijking van het vierde lid, onderdeel a, wordt niet tot het inkomen in verband met arbeid gerekend de
      uitkering, bedoeld in het vierde lid, onderdeel a, indien die uitkering door de uitkeringsgerechtigde voor het
      intreden van de werkloosheid werd ontvangen en die samenhangt met een eerder verlies van arbeidsuren.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
  - number: 3:5.6
    text: |-
      In afwijking van het vierde lid, onderdeel b, wordt de uitkering op grond van het bepaalde bij of krachtens dan
      wel op de voet van de [Algemene pensioenwet politieke ambtsdragers][ref1], voor een uitkering op grond van de
      [Werkloosheidswet][ref2] niet tot inkomen in verband met arbeid gerekend, indien die uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0002691
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002691
      - id: ref2
        bwb_id: BWBR0004045
  - number: 3:5.6.a
    text: |-
      door de uitkeringsgerechtigde reeds voor het intreden van de werkloosheid werd ontvangen naast de dienstbetrekking
      waaruit hij werkloos is geworden; of
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
  - number: 3:5.6.b
    text: |-
      door de uitkeringsgerechtigde na het intreden van de werkloosheid wordt ontvangen uit werkzaamheden die voor het
      intreden van de werkloosheid reeds werden verricht naast de dienstbetrekking waaruit de werkloosheid is ontstaan of
      een dienstbetrekking waarvoor de dienstbetrekking waaruit de werkloosheid is ontstaan in de plaats is getreden.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
  - number: 3:5.7
    text: |-
      In afwijking van het vierde lid, onderdeel a, wordt niet tot inkomen in verband met arbeid gerekend een uitkering
      die door de uitkeringsgerechtigde reeds werd ontvangen voorafgaand aan het ontstaan van de dienstbetrekking waaruit
      het recht op uitkering op grond van de [Werkloosheidswet][ref1] is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3:5.8
    text: |-
      In afwijking van het vierde lid, onderdeel a, wordt niet tot inkomen in verband met arbeid gerekend het inkomen
      dat op grond van de [Werkloosheidswet][ref1] reeds in aanmerking genomen is voor een uitkering op grond van de
      Werkloosheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3:6.1
    text: |-
      Bij het bepalen van het inkomen, bedoeld in de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1],
      zijn de [artikelen 2:2, derde lid][ref2], [2:4, derde lid][ref3], [2:5][ref4] en [3:3, tiende en elfde lid][ref5],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:6.2
    text: |-
      Bij het bepalen van het inkomen, bedoeld in het eerste lid wordt, in afwijking van
      [artikel 3:2, eerste lid, onderdeel a, onder 1° en 2°][ref1], onder inkomen verstaan hetgeen onder loon wordt
      verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref2] voor de werknemer, bedoeld
      in [artikel 1, onderdeel o, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '1'
  - number: 3:6.3
    text: 'Bij het bepalen van het inkomen, bedoeld in het eerste lid, wordt tevens onder inkomen verstaan:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
  - number: 3:6.3.a
    text: |-
      hetgeen wordt genoten op grond van een wettelijke regeling die naar aard en strekking overeenkomt met een uitkering
      op grond van een werknemersverzekering;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
  - number: 3:6.3.b
    text: |-
      hetgeen wordt genoten op grond van een wettelijke regeling die naar aard en strekking overeenkomt met
      [artikel 629 van Boek 7 BW][ref1] of daarmee overeenkomende regeling die geldt voor een werknemer met een
      publiekrechtelijke dienstbetrekking; en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 3:6.3.c
    text: |-
      een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3:6.4
    text: |-
      Bij het bepalen van het inkomen, bedoeld in het eerste lid, wordt in afwijking van het derde lid niet tot het
      inkomen gerekend:
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
  - number: 3:6.4.a
    text: |-
      een toeslag op grond van de [Toeslagenwet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 3:6.4.b
    text: |-
      de aanvulling op een uitkering op grond van een werknemersverzekering van degene tot wie de werknemer in
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel36
  - number: 4:1.1
    text: 'Het inkomen voor de toepassing van:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.1.a
    text: |-
      de [Algemene nabestaandenwet][ref1], de [Algemene Ouderdomswet][ref2], de
      [Wet inkomensvoorziening oudere werklozen][ref3], de [Werkloosheidswet][ref4] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref5] wordt herleid tot een bedrag per kalendermaand;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0024394
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0024394
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0019057
  - number: 4:1.1.b
    text: |-
      de [Toeslagenwet][ref1], de [Ziektewet][ref2] en de [artikelen 1a:4, vierde lid][ref3], [2:6][ref4] en
      [3:2a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] wordt herleid tot een bedrag per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel1a
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0008657
        artikel: 1a
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 4:1.2
    text: |-
      Voor de toepassing van het eerste lid wordt de kalendermaand gesteld op 21,75 dagen. De kalenderweek wordt gesteld
      op vijf dagen. Het boek- of kalenderjaar wordt gesteld op 261 dagen.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.3
    text: |-
      Bij de toepassing van het eerste lid wordt het loon of het inkomen in verband met arbeid, bedoeld in
      [artikel 3:5, vierde lid][ref1], door de uitkeringsgerechtigde geacht te zijn genoten in het aangiftetijdvak
      waarover de werkgever of de inhoudingsplichtige van dat loon of dat inkomen in verband met arbeid opgave heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 4:1.4
    text: |-
      Bij de toepassing van het eerste lid worden betalingen van het overig inkomen toegerekend aan de perioden waarin
      hierop recht bestaat.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.5
    text: |-
      Bij de toepassing van het eerste lid worden het belastbaar loon, het belastbaar resultaat
      uit overige werkzaamheden, de belastbare winst uit onderneming en de uitkering, bedoeld in de
      [artikelen 2:2, eerste lid, onderdelen c, d en e][ref1], en [3:2, eerste lid, onderdelen c, d en e][ref2],
      evenredig toegerekend aan de betreffende kalendermaanden in het boek- of kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4:1.6
    text: |-
      De SVB of het UWV kunnen op basis van een geschat inkomen een gemiddeld inkomen per kalendermaand bepalen, waarna
      per periode van ten hoogste twaalf maanden een herberekening plaatsvindt en het gemiddeld inkomen per periode kan
      worden toegerekend aan maanden in die periode.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.7
    text: |-
      De SVB of het UWV kan bij de vaststelling van het inkomen het loon dat door de uitkeringsgerechtigde is genoten in
      een aangiftetijdvak, toerekenen aan de dag waarop dat loon betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.8
    text: |-
      De SVB kan bij de vaststelling van het inkomen het in een aangiftetijdvak opgebouwde bedrag aan vakantiebijslag
      en de in een aangiftetijdvak opgebouwde looncomponenten ten behoeve van een arbeidsvoorwaardenbedrag in aanmerking
      nemen, waarbij het betaalde bedrag aan vakantiebijslag en de uitbetaalde looncomponenten ten laste van een
      arbeidsvoorwaardenbedrag niet in aanmerking worden genomen. Het UWV neemt bij de vaststelling van het inkomen
      het in een aangiftetijdvak opgebouwde bedrag aan vakantiebijslag en de opgebouwde looncomponenten ten behoeve
      van een arbeidsvoorwaardenbedrag in aanmerking, waarbij het betaalde bedrag aan vakantiebijslag en de uitbetaalde
      looncomponenten ten laste van een arbeidsvoorwaardenbedrag niet in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.9
    text: |-
      In afwijking van het derde lid, wordt voor de vaststelling van het inkomen voor de [Werkloosheidswet][ref1]
      het inkomen over een aangiftetijdvak van vier weken geacht te zijn genoten in de kalendermaand waarin het
      aangiftetijdvak van vier weken eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 4:1.10
    text: |-
      In afwijking van het achtste lid neemt het UWV voor de vaststelling van het inkomen voor de [Werkloosheidswet][ref1]
      het in een aangiftetijdvak betaalde bedrag aan vakantiebijslag en de in een aangiftetijdvak uitbetaalde componenten
      ten laste van een arbeidsvoorwaardenbedrag in aanmerking voor zover deze componenten zijn aan te merken als loon
      als bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref2], waarbij de opgebouwde bedragen en
      looncomponenten niet in aanmerking worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 4:1.11
    text: |-
      Indien toepassing van dit artikel leidt tot een kennelijk onredelijk resultaat bepaalt de SVB of het UWV het
      inkomen op een andere wijze.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
  - number: 4:1.12
    text: |-
      Het UWV kan bij de toepassing van het eerste lid het genoten inkomen in verband met arbeid, bedoeld in
      [artikel 3:5, vierde lid][ref1], toerekenen aan de perioden waarin hierop recht bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 4:2
    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: 4:2.a
    text: |-
      Het inkomen uit arbeid of overig inkomen wordt toegerekend aan de perioden waarin hierop recht bestaat en wordt
      vervolgens herleid tot een bedrag per kalendermaand;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
  - number: 4:2.b
    text: |-
      indien op grond van
      __REF000___________________________________________________________________________________________________________
      _________ de uitkering over een kortere periode dan een maand wordt uitbetaald, het inkomen en de uitkering eerst
      per maand vastgesteld worden, waarna de uitkering over een kortere periode naar evenredigheid wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel21
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '21'
  - number: 4:2.c
    text: |-
      indien aannemelijk is dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in onderdeel
      a bedoelde inkomen, dat bestanddeel per maand vastgesteld wordt op 1/3 onderscheidenlijk 1/12 van het bedrag, dat
      over drie maanden onderscheidenlijk een jaar is verworven;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
  - number: 4:2.d
    text: |-
      indien winst als bedoeld in [artikel 2:2, eerste lid, onderdeel d][ref1], wordt genoten, het daaruit voortvloeiende
      inkomensbestanddeel per maand vastgesteld wordt op 1/12 van de winst, genoten over het kalenderjaar of het niet met
      het kalenderjaar samenvallend boekjaar, voorafgaand aan de maand waarover aanspraak op uitkering wordt gemaakt; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4:2.e
    text: |-
      indien de toepassing van de onderdelen a tot en met d gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, het college bepaalt op welke periode dat
      inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit geacht moet worden over deze periode te
      zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel42
  - number: 4:3.1
    text: |-
      Indien het bij de toepassing van dit hoofdstuk noodzakelijk is om niet in euro’s uitgedrukt inkomen om te rekenen
      in euro’s, geschiedt dat met behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel43
  - number: 4:3.2
    text: |-
      Een wijziging van een wisselkoers als bedoeld in het eerste lid beïnvloedt het vastgestelde inkomen niet, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel43
  - number: 4:3.2.a
    text: bij wijziging van het inkomen, anders dan ten gevolge van de koersmutaties, een omrekening plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel43
  - number: 4:3.2.b
    text: ten minste eens per jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel43
  - number: 5:1.1
    text: |-
      Voor het bepalen van het inkomen, bedoeld in de [artikelen 52, vierde lid][ref1],
      en [61, achtste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] of
      [artikel 35aa, eerste lid, onderdeel b, van de Werkloosheidswet][ref3] wordt onder verlof
      als bedoeld in [artikel 3:3, derde lid][ref4], tevens verstaan verlof als bedoeld in de
      [artikelen 3:1][ref5] en [3:2 van de Wet arbeid en zorg][ref6], en wordt in afwijking van
      artikel 3:2, eerste lid, onderdeel a, niet onder inkomen verstaan een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7], indien dit verlof is aangevangen voor
      inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het Inkomensbesluit volksverzekeringen en
      sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet
      werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen (Stb. 79).


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35aa
      [ref4]: https://wetten.overheid.nl/BWBR0029368#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 35aa
      - id: ref4
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 5:1.2
    text: |-
      Voor het bepalen van het inkomen, bedoeld in [artikel 35aa, eerste lid, onderdeel b, van de Werkloosheidswet][ref1],
      geldt dat indien voor de uitkeringsgerechtigde naast een uitkering op grond van de Werkloosheidswet:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel35aa
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 35aa
  - number: 5:1.2.a
    text: |-
      recht ontstaat op een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet ][ref1]of
      [hoofdstuk II][ref2] of [III van de Werkloosheidswet][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: III
  - number: 5:1.2.b
    text: |-
      het recht, bedoeld onder a, is ontstaan voor de inwerkingtreding van het besluit van 22 februari 2012 tot
      wijziging van het Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband met toepassing op de
      Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en
      werknemersverzekeringen (Stb. 79);
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
  - number: 5:1.3
    text: |-
      Voor het bepalen van het inkomen, bedoeld in de [Wet werk en inkomen naar arbeidsvermogen][ref1], geldt dat indien
      voor de uitkeringsgerechtigde naast een uitkering op grond van de Wet werk en inkomen naar arbeidsvermogen:


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 5:1.3.a
    text: |-
      recht bestaat op een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref1] of
      [hoofdstuk II][ref2] of [III van de Werkloosheidswet][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: III
  - number: 5:1.3.b
    text: |-
      het recht op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1] en het recht, bedoeld
      onder a, zijn ontstaan voor de inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het
      Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet
      inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen
      (Stb. 79);


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 5:1.4
    text: |-
      In geval van een uitkeringsgerechtigde waarvan het recht op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] en het ontvangen van ziekengeld op grond van
      [artikel 29, tweede lid, van de Ziektewet][ref2] zijn ontstaan voor inwerkingtreding van het besluit van
      22 februari 2012 tot wijziging van het Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband
      met toepassing op de Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning
      jonggehandicapten en werknemersverzekeringen (Stb. 79) is, voor de duur van dat recht op grond van artikel 29,
      tweede lid, van de Ziektewet, [artikel 3:4, tweede lid, onderdelen a en d][ref3], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 5:1.5
    text: |-
      Ingeval van een uitkeringsgerechtigde die recht heeft op een uitkering op grond
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1] en recht heeft op een uitkering op
      grond van een vrijwillige verzekering op grond van de [Werkloosheidswet][ref2], [Ziektewet][ref3],
      [Wet werk en inkomen naar arbeidsvermogen][ref4] of [Wet op de arbeidsongeschiktheidsverzekering][ref5]
      op de dag voor inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het Inkomensbesluit
      volksverzekeringen en sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet inkomensvoorziening
      oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen (Stb. 79) is
      [artikel 3:6, onderdeel b, onder 3][ref6], voor zover het de uitkering op grond van een vrijwillige verzekering
      betreft, niet van toepassing gedurende de duur van die uitkering doch ten hoogste gedurende twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008657
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0029368#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008657
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0002524
      - id: ref6
        bwb_id: BWBR0029368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 5:1a.1
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel51a
  - number: 5:1a.1.a
    text: |-
      meer dan een recht op uitkering op grond van de [Werkloosheidswet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] dan wel de [Ziektewet][ref3] bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0001888
