      van het gezamenlijke inkomen, bedoeld in [artikel 12, eerste lid, van de Algemene Ouderdomswet][ref2] een
      uitkering van een pensioengerechtigde die naar aard en strekking overeenkomt met een uitkering als bedoeld in
      [artikel 2:4, eerste lid, onderdeel K][ref3], aangemerkt als overig inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
