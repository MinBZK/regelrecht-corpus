    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.17
    text: 'In afwijking van het tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.17.a
    text: |-
      een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
  - number: 3:2.17.b
    text: |-
      een uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 3:2.17.c
    text: tevens inkomen als bedoeld in het eerste lid, onderdeel a, ontvangt,
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.18
    text: 'In afwijking van het negende en veertiende lid wordt, indien een uitkeringsgerechtigde recht heeft op:'
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.18.a
    text: |-
      een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 3:2.18.b
    text: een reguliere WW-uitkering; en
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.18.c
    text: |-
      na aanvang van de wachttijd, bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref1], tevens
      inkomen ontvangt als bedoeld in het eerste lid, onderdeel b, c, d of e ontvangt,


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 3:2.19
    text: |-
      Voor de toepassing van het achtste, negende, tiende, veertiende tot en met zestiende lid geldt dat, indien het
      inkomen, bedoeld in het eerste lid, meer bedraagt dan het dag- of maandloon op grond waarvan de uitkering waarvoor
      dat inkomen in aanmerking is genomen, wordt berekend, wordt dat meerdere in aanmerking genomen voor de andere
      uitkering.
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
  - number: 3:2.20
    text: |-
      Indien de uitkeringsgerechtigde voor wie een van de leden acht tot en met achttien van toepassing
      is met verlof gaat of recht ontstaat op een uitkering die voorafgaat aan een uitkering bij
      wijze van oudedagsvoorziening of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], wordt voor de toepassing van het achtste, tot en
      met negentiende lid het inkomen dat werd genoten in het aangiftetijdvak voor het aangiftetijdvak waarin het verlof
      aanving respectievelijk het recht op die uitkering ontstond aangemerkt als inkomen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3:3.1
    text: |-
      Ingeval van een uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van [artikel 18][ref1] of
      [hoofdstuk IV van de Werkloosheidswet][ref2] of [artikel 29, tweede lid, van de Ziektewet][ref3] recht ontstaat op:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 3:3.1.a
    text: loondoorbetaling, indien het overeengekomen loon niet volledig wordt doorbetaald;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.1.b
    text: |-
      een uitkering als bedoeld in [hoofdstuk IV van de Werkloosheidswet][ref1] of een op basis van een wettelijke
      regeling verstrekte uitkering die naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 3:3.1.c
    text: |-
      een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of een op basis van een wettelijke regeling
      verstrekte uitkering die naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 3:3.1.d
    text: |-
      een op basis van een wettelijke regeling verstrekte uitkering die naar aard en strekking overeenkomt met een
      uitkering als bedoeld in het vierde lid,
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.2
    text: |-
      Ingeval van een uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] of recht op een reguliere WW-uitkering recht bestaat op:


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 3:3.2.a
    text: loondoorbetaling, indien het overeengekomen loon niet volledig wordt doorbetaald;
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
  - number: 3:3.2.b
    text: |-
      een uitkering als bedoeld in [hoofdstuk IV van de Werkloosheidswet][ref1] of een op basis van een wettelijke
      regeling verstrekte uitkering die naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel33
    references:
