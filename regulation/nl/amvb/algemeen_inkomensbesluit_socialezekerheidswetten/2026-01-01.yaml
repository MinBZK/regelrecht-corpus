  - number: 2:5.1
    text: |-
      In afwijking van de [artikelen 2:2][ref1], [2:3][ref2] en [2:4][ref3] wordt vakantiebijslag, vakantiebon of
      een aanspraak die naar aard en strekking daarmee overeenkomt niet als inkomen uit arbeid of als overig inkomen
      beschouwd.


