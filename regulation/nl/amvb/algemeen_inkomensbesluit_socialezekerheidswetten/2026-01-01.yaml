  - number: 5:1a.2
    text: |-
      Het eerste lid is niet langer van toepassing als er sprake is van een recht op uitkering op
      grond van [hoofdstuk II van de Werkloosheidswet][ref1], niet zijnde een uitkering op grond van
      [artikel 18 van die wet][ref2], dat op grond van [artikel 130z][ref3] of [130aa van de Werkloosheidswet][ref4]
      is omgezet.


