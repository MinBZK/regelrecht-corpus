    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] geldt dat in
      afwijking van [artikel 2:4, eerste lid, onderdelen l en o][ref2], niet als overig inkomen wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel28
    references:
