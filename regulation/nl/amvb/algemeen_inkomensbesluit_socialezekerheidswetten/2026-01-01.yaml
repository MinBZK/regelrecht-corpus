      [artikel 31, tweede lid, onderdelen j en k, van de Participatiewet][ref1], genoemde bedragen daartoe aanleiding
      geeft. De gewijzigde bedragen en de dag waarop deze wijziging ingaat, worden door of namens Onze Minister
      medegedeeld in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0029368/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
