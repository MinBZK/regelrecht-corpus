  - number: 5:1a
    text: |-
      1 Indien:

      a. meer dan een recht op uitkering op grond van de [Werkloosheidswet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] dan wel de [Ziektewet][ref3] bestaat;

      b. voor de uitkeringsgerechtigde zowel het Algemeen inkomensbesluit socialezekerheidswetten
      van toepassing zou zijn, zoals dat luidde voor het tijdstip van inwerkingtreding van
      [artikel XXVI, onderdeel S, van de Wet werk en zekerheid][ref4], als het Algemeen inkomensbesluit sociale
      zekerheidswetten, zoals dat luidde na het tijdstip van inwerkingtreding van artikel XXVI, onderdeel S, onderdeel V
      dan wel onderdeel C van de Wet werk en zekerheid; en

      c. inkomen, verrekend zou worden met een andere uitkering op grond van het Algemeen inkomensbesluit
      socialezekerheidswetten, zoals dat luidde voor het tijdstip van inwerkingtreding van
      [artikel XXVI, onderdeel S, van de Wet werk en zekerheid][ref5] dan op grond van het eveneens van toepassing zijnde
      Algemeen inkomensbesluit socialezekerheidswetten, zoals dat luidde na dat tijdstip,

      dan wordt de op de samenloop betrekking hebbende bepaling uit Algemeen inkomensbesluit
      socialezekerheidswetten toegepast, zoals die bepaling luidde voor het tijdstip van inwerkingtreding van
      [artikel XXVI, onderdeel S, van de Wet werk en zekerheid][ref6].

      2 Het eerste lid is niet langer van toepassing als er sprake is van een recht op uitkering op
      grond van [hoofdstuk II van de Werkloosheidswet][ref7], niet zijnde een uitkering op grond van
      [artikel 18 van die wet][ref8], dat op grond van [artikel 130z][ref9] of [130aa van de Werkloosheidswet][ref10]
      is omgezet.


