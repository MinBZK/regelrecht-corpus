  - number: 2:3
    text: |-
      1 Gedurende de periode dat de uitkeringsgerechtigde:

      a. recht heeft op een uitkering als bedoeld in [hoofdstuk IV van de Werkloosheidswet][ref1];

      b. recht heeft op een uitkering in verband met werkloosheid als bedoeld in
      [artikel 18, eerste lid, van de Werkloosheidswet][ref2];

      c. recht heeft op een uitkering in verband met werkloosheid die uitsluitend het gevolg is van verkorting van de
      werktijd, waarvoor op grond van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3]
      ontheffing is verleend; of

      d. met verlof is,

      wordt als inkomen uit arbeid beschouwd het inkomen dat werd genoten in het aangiftetijdvak voor het aangiftetijdvak
      waarin:

      1°. het recht ontstond op een uitkering als bedoeld in de onderdelen a tot en met c.

      2°. het verlof aanving.

      2 Niet als inkomen uit arbeid wordt beschouwd het loon dat door de uitkeringsgerechtigde wordt genoten indien hij
      tegelijkertijd uit hoofde van dezelfde arbeidsrelatie inkomen als bedoeld in het eerste lid geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
