  - number: 4:3
    text: >-
      1 Indien het bij de toepassing van dit hoofdstuk noodzakelijk is om niet in euro’s uitgedrukt inkomen om te rekenen
      in euro’s, geschiedt dat met behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen.


      2 Een wijziging van een wisselkoers als bedoeld in het eerste lid beïnvloedt het vastgestelde inkomen niet, met
      dien verstande dat:


      a. bij wijziging van het inkomen, anders dan ten gevolge van de koersmutaties, een omrekening plaatsvindt; en


      b. ten minste eens per jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029368/2026-07-01#Artikel43
  - number: 5:1
    text: |-
      1 Voor het bepalen van het inkomen, bedoeld in de [artikelen 52, vierde lid][ref1],
      en [61, achtste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2] of
      [artikel 35aa, eerste lid, onderdeel b, van de Werkloosheidswet][ref3] wordt onder verlof
      als bedoeld in [artikel 3:3, derde lid][ref4], tevens verstaan verlof als bedoeld in de
      [artikelen 3:1][ref5] en [3:2 van de Wet arbeid en zorg][ref6], en wordt in afwijking van
      artikel 3:2, eerste lid, onderdeel a, niet onder inkomen verstaan een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref7], indien dit verlof is aangevangen voor
      inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het Inkomensbesluit volksverzekeringen en
      sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet
      werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen (Stb. 79).

      2 Voor het bepalen van het inkomen, bedoeld in
      [artikel 35aa, eerste lid, onderdeel b, van de Werkloosheidswet][ref8], geldt dat indien voor de
      uitkeringsgerechtigde naast een uitkering op grond van de Werkloosheidswet:

      a. recht ontstaat op een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet ][ref9]of
      [hoofdstuk II][ref10] of [III van de Werkloosheidswet][ref11]; en

      b. het recht, bedoeld onder a, is ontstaan voor de inwerkingtreding van het besluit van 22 februari 2012 tot
      wijziging van het Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband met toepassing op de
      Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en
      werknemersverzekeringen (Stb. 79);

      voor de duur van dat recht, bedoeld in [onderdeel a, artikel 3:3, vierde lid][ref12], niet van toepassing is
      en wordt tevens onder inkomen wordt verstaan het inkomen, bedoeld in [artikel 3:2, eerste lid][ref13], dat werd
      genoten in het aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op die uitkering.

      3 Voor het bepalen van het inkomen, bedoeld in de [Wet werk en inkomen naar arbeidsvermogen][ref14], geldt dat
      indien voor de uitkeringsgerechtigde naast een uitkering op grond van de Wet werk en inkomen naar arbeidsvermogen:

      a. recht bestaat op een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref15] of
      [hoofdstuk II][ref16] of [III van de Werkloosheidswet][ref17]; en

      b. het recht op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref18] en het recht, bedoeld
      onder a, zijn ontstaan voor de inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het
      Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet
      inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen
      (Stb. 79);

      voor de duur van het recht, bedoeld in [onderdeel a, artikel 3:3, vijfde lid][ref19], niet van toepassing is en
      tevens onder inkomen wordt verstaan het inkomen, bedoeld in [artikel 3:2, eerste lid][ref20], dat werd genoten in
      het aangiftetijdvak voor het aangiftetijdvak waarin recht bestond op die uitkering.

      4 In geval van een uitkeringsgerechtigde waarvan het recht op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref21] en het ontvangen van ziekengeld op grond van
      [artikel 29, tweede lid, van de Ziektewet][ref22] zijn ontstaan voor inwerkingtreding van het besluit van
      22 februari 2012 tot wijziging van het Inkomensbesluit volksverzekeringen en sociale voorzieningen in verband
      met toepassing op de Toeslagenwet, Wet inkomensvoorziening oudere werklozen, Wet werk en arbeidsondersteuning
      jonggehandicapten en werknemersverzekeringen (Stb. 79) is, voor de duur van dat recht op grond van artikel 29,
      tweede lid, van de Ziektewet, [artikel 3:4, tweede lid, onderdelen a en d][ref23], niet van toepassing.

      5 Ingeval van een uitkeringsgerechtigde die recht heeft op een uitkering op grond
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref24] en recht heeft op een uitkering op
      grond van een vrijwillige verzekering op grond van de [Werkloosheidswet][ref25], [Ziektewet][ref26],
      [Wet werk en inkomen naar arbeidsvermogen][ref27] of [Wet op de arbeidsongeschiktheidsverzekering][ref28]
      op de dag voor inwerkingtreding van het besluit van 22 februari 2012 tot wijziging van het Inkomensbesluit
      volksverzekeringen en sociale voorzieningen in verband met toepassing op de Toeslagenwet, Wet inkomensvoorziening
      oudere werklozen, Wet werk en arbeidsondersteuning jonggehandicapten en werknemersverzekeringen (Stb. 79) is
      [artikel 3:6, onderdeel b, onder 3][ref29], voor zover het de uitkering op grond van een vrijwillige verzekering
      betreft, niet van toepassing gedurende de duur van die uitkering doch ten hoogste gedurende twee jaar.


