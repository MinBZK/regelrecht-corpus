  - number: 3:5
    text: |-
      1 [ Artikel 3:2, eerste lid, onderdeel b, c, d en e][ref1], is niet van toepassing bij de vaststelling van het
      inkomen voor de [Werkloosheidswet][ref2], tenzij

      a. deze onderdelen betrekking hebben op bezoldiging in verband met het uitoefenen van werkzaamheden als lid van
      de Eerste Kamer der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam, dat bij
      rechtstreekse verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap;

      b. [artikel 3:2, eerste lid, onderdeel e][ref3], betrekking heeft op een uitkering als bedoeld in
      [artikel 4:2b, zevende lid][ref4], of [artikel 6:3, zevende lid, van de Wet arbeid en zorg][ref5].

      2 [Artikel 3:3, eerste lid, onderdeel c en tweede lid, onderdeel c][ref6] zijn niet van toepassing bij de
      vaststelling van inkomen voor de [Werkloosheidswet][ref7].

      3 Voor zover de uitkeringsgerechtigde op de dag voorafgaand aan de eerste dag van werkloosheid, bedoeld in
      [artikel 16a van de Werkloosheidswet][ref8], inkomen ontvangt als bedoeld in het eerste lid, wordt dat inkomen niet
      in aanmerking genomen voor de uitkering op grond van de [Werkloosheidswet][ref9].

      4 Voor de [Werkloosheidswet][ref10] wordt als inkomen in verband met arbeid beschouwd:

      a. een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref11];

      b. een uitkering op grond van het bepaalde bij of krachtens dan wel op de voet van de
      [Algemene pensioenwet politieke ambtsdragers][ref12]; en

      c. een wettelijke buitenlandse uitkering wegens arbeidsongeschiktheid.

      5 In afwijking van het vierde lid, onderdeel a, wordt niet tot het inkomen in verband met arbeid gerekend de
      uitkering, bedoeld in het vierde lid, onderdeel a, indien die uitkering door de uitkeringsgerechtigde voor het
      intreden van de werkloosheid werd ontvangen en die samenhangt met een eerder verlies van arbeidsuren.

      6 In afwijking van het vierde lid, onderdeel b, wordt de uitkering op grond van het bepaalde bij of krachtens dan
      wel op de voet van de [Algemene pensioenwet politieke ambtsdragers][ref13], voor een uitkering op grond van de
      [Werkloosheidswet][ref14] niet tot inkomen in verband met arbeid gerekend, indien die uitkering:

      a. door de uitkeringsgerechtigde reeds voor het intreden van de werkloosheid werd ontvangen naast de
      dienstbetrekking waaruit hij werkloos is geworden; of

      b. door de uitkeringsgerechtigde na het intreden van de werkloosheid wordt ontvangen uit werkzaamheden die voor het
      intreden van de werkloosheid reeds werden verricht naast de dienstbetrekking waaruit de werkloosheid is ontstaan of
      een dienstbetrekking waarvoor de dienstbetrekking waaruit de werkloosheid is ontstaan in de plaats is getreden.

      7 In afwijking van het vierde lid, onderdeel a, wordt niet tot inkomen in verband met arbeid gerekend een uitkering
      die door de uitkeringsgerechtigde reeds werd ontvangen voorafgaand aan het ontstaan van de dienstbetrekking waaruit
      het recht op uitkering op grond van de [Werkloosheidswet][ref15] is ontstaan.

      8 In afwijking van het vierde lid, onderdeel a, wordt niet tot inkomen in verband met arbeid gerekend het inkomen
      dat op grond van de [Werkloosheidswet][ref16] reeds in aanmerking genomen is voor een uitkering op grond van de
      Werkloosheidswet.


