      [10, vijfde lid, van de Wet inkomensvoorziening oudere werklozen][ref2], [1b, tiende lid][ref3], en
      [47, tweede lid, van de Werkloosheidswet][ref4], [1a:4, vierde lid][ref5], [2:6][ref6] en [3:2a van de Wet
      arbeidsongeschiktheidsvoorziening jonggehandicapten](onbekend), [21, zesde lid][ref7], [52, vierde lid][ref8],
      [60, vijfde lid][ref9], en [61, achtste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref10] en
      [31, derde lid, van de Ziektewet][ref11].


