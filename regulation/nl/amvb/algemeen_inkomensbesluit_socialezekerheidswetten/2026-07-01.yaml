    text: |-
      1 Voor het bepalen van inkomen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________ geldt dat:

      a. in geval van een gewezen zelfstandige die een onderneming heeft uitgeoefend in de vorm van een naamloze
      vennootschap of een besloten vennootschap in afwijking van [artikel 2:2, eerste lid, onderdeel d][ref2],
      onder belastbare winst uit onderneming wordt verstaan hetgeen ingevolge het bepaalde bij of krachtens
      [Hoofdstuk II van de Wet op de vennootschapsbelasting 1969][ref3] onder winst wordt verstaan alsmede de betalingen
      die aan de echtgenoot worden gedaan ter zake van in de onderneming verrichte arbeid;

      b. de winst, bedoeld in onderdeel a, wordt gecorrigeerd met alle geldelijke voor- en nadelen
      voor de gewezen zelfstandige, die uit diens verhouding tot de besloten of naamloze vennootschap
      voortvloeien, tenzij het inkomen uit arbeid of overig inkomen betreft als bedoeld in
      [artikel 2:2, eerste lid, onderdeel a tot en met c, e en f,][ref4] en [artikel 2:4, eerste lid][ref5];

      c. in aanvulling op [artikel 2:2, eerste lid, onderdeel d][ref6], mede onder belastbare winst uit onderneming wordt
      verstaan de partnervergoeding, bedoeld in [artikel 3:16, vierde lid, van de Wet inkomstenbelasting 2001][ref7],
      indien deze vergoeding € 5.000,– of hoger is, en de winst van de echtgenoot van de gewezen zelfstandige, indien het
      bedrijf en beroep mede voor rekening van de echtgenoot wordt uitgeoefend;

      d. in afwijking van [artikel 1:1, derde lid][ref8], en behoudens het bepaalde in onderdeel c onder inkomen uit
      arbeid en overig inkomen niet wordt verstaan het inkomen van de echtgenoot; en

      e. [artikel 2:8, eerste lid, aanhef en onderdelen b en c, en het derde lid][ref9], van overeenkomstige toepassing
      zijn.

      2 Voor het bepalen van inkomen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________ geldt dat:

      a. in afwijking van [artikel 2:2, eerste lid, onderdeel d][ref11], belastbare winst uit onderneming niet tot het
      inkomen wordt gerekend; en

      b. [artikel 2:8, eerste lid, aanhef en onderdelen b en c, en het derde lid][ref12], van overeenkomstige toepassing
      zijn.


