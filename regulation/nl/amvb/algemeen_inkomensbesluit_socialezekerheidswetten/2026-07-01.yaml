  - number: 4:1
    text: |-
      1 Het inkomen voor de toepassing van:

      a. de [Algemene nabestaandenwet][ref1], de [Algemene Ouderdomswet][ref2], de
      [Wet inkomensvoorziening oudere werklozen][ref3], de [Werkloosheidswet][ref4] en de
      [Wet werk en inkomen naar arbeidsvermogen][ref5] wordt herleid tot een bedrag per kalendermaand;

      b. de [Toeslagenwet][ref6], de [Ziektewet][ref7] en de [artikelen 1a:4, vierde lid][ref8], [2:6][ref9] en
      [3:2a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref10] wordt herleid tot een bedrag per dag.

      2 Voor de toepassing van het eerste lid wordt de kalendermaand gesteld op 21,75 dagen. De kalenderweek wordt
      gesteld op vijf dagen. Het boek- of kalenderjaar wordt gesteld op 261 dagen.

      3 Bij de toepassing van het eerste lid wordt het loon of het inkomen in verband met arbeid, bedoeld in
      [artikel 3:5, vierde lid][ref11], door de uitkeringsgerechtigde geacht te zijn genoten in het aangiftetijdvak
      waarover de werkgever of de inhoudingsplichtige van dat loon of dat inkomen in verband met arbeid opgave heeft
      gedaan.

      4 Bij de toepassing van het eerste lid worden betalingen van het overig inkomen toegerekend aan de perioden waarin
      hierop recht bestaat.

      5 Bij de toepassing van het eerste lid worden het belastbaar loon, het belastbaar resultaat
      uit overige werkzaamheden, de belastbare winst uit onderneming en de uitkering, bedoeld in de
      [artikelen 2:2, eerste lid, onderdelen c, d en e][ref12], en [3:2, eerste lid, onderdelen c, d en e][ref13],
      evenredig toegerekend aan de betreffende kalendermaanden in het boek- of kalenderjaar.

      6 De SVB of het UWV kunnen op basis van een geschat inkomen een gemiddeld inkomen per kalendermaand bepalen, waarna
      per periode van ten hoogste twaalf maanden een herberekening plaatsvindt en het gemiddeld inkomen per periode kan
      worden toegerekend aan maanden in die periode.

      7 De SVB of het UWV kan bij de vaststelling van het inkomen het loon dat door de uitkeringsgerechtigde is genoten
      in een aangiftetijdvak, toerekenen aan de dag waarop dat loon betrekking heeft.

      8 De SVB kan bij de vaststelling van het inkomen het in een aangiftetijdvak opgebouwde bedrag aan vakantiebijslag
      en de in een aangiftetijdvak opgebouwde looncomponenten ten behoeve van een arbeidsvoorwaardenbedrag in aanmerking
      nemen, waarbij het betaalde bedrag aan vakantiebijslag en de uitbetaalde looncomponenten ten laste van een
      arbeidsvoorwaardenbedrag niet in aanmerking worden genomen. Het UWV neemt bij de vaststelling van het inkomen
      het in een aangiftetijdvak opgebouwde bedrag aan vakantiebijslag en de opgebouwde looncomponenten ten behoeve
      van een arbeidsvoorwaardenbedrag in aanmerking, waarbij het betaalde bedrag aan vakantiebijslag en de uitbetaalde
      looncomponenten ten laste van een arbeidsvoorwaardenbedrag niet in aanmerking worden genomen.

      9 In afwijking van het derde lid, wordt voor de vaststelling van het inkomen voor de [Werkloosheidswet][ref14]
      het inkomen over een aangiftetijdvak van vier weken geacht te zijn genoten in de kalendermaand waarin het
      aangiftetijdvak van vier weken eindigt.

      10 In afwijking van het achtste lid neemt het UWV voor de vaststelling van het inkomen voor
      de [Werkloosheidswet][ref15] het in een aangiftetijdvak betaalde bedrag aan vakantiebijslag en
      de in een aangiftetijdvak uitbetaalde componenten ten laste van een arbeidsvoorwaardenbedrag
      in aanmerking voor zover deze componenten zijn aan te merken als loon als bedoeld in
      [artikel 16 van de Wet financiering sociale verzekeringen][ref16], waarbij de opgebouwde bedragen en
      looncomponenten niet in aanmerking worden genomen.

      11 Indien toepassing van dit artikel leidt tot een kennelijk onredelijk resultaat bepaalt de SVB of het UWV het
      inkomen op een andere wijze.

      12 Het UWV kan bij de toepassing van het eerste lid het genoten inkomen in verband met arbeid, bedoeld in
      [artikel 3:5, vierde lid][ref17], toerekenen aan de perioden waarin hierop recht bestaat.


