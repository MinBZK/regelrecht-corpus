  - number: 2:2
    text: |-
      1 Onder inkomen uit arbeid wordt verstaan:

      a. hetgeen onder loon wordt verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref1]
      voor de werknemer, bedoeld in [artikel 1, onderdeel o, van die wet][ref2] met dien verstande dat niet tot het
      inkomen uit arbeid worden gerekend uitkeringen op grond van een werknemersverzekering of wachtgeld als bedoeld
      in [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref3], al dan niet vermeerderd met een toeslag op
      grond van de [Toeslagenwet][ref4] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking
      staat of stond;

      b. het loon, bedoeld in de [artikelen 9 tot en met 13 van de Wet op de loonbelasting 1964][ref5], voor zover de
      uitkeringsgerechtigde niet als werknemer als bedoeld in onderdeel a inkomen verdient, met dien verstande dat niet
      tot het inkomen uit arbeid worden gerekend:

      1°. hetgeen uit een vroegere dienstbetrekking als bedoeld in die [wet][ref6] wordt genoten;

      2°.

      3°. de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref7];

      c. het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref8]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref9], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref10], en
      [3.92 van die wet][ref11], voor zover de uitkeringsgerechtigde geen werknemer is als bedoeld in de onderdelen a
      en b;

      d. de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref12],
      vermeerderd met de ondernemersaftrek en de MKB-winstvrijstelling, bedoeld in de [artikelen 3.74][ref13]
      en [3.79a van die wet][ref14], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, van die wet][ref15], niet geacht worden te behoren tot de winst;

      e. een uitkering op grond van de [Wet arbeid en zorg][ref16] aan de zelfstandige of de beroepsbeoefenaar
      op arbeidsovereenkomst, bedoeld in [artikel 3:17, eerste lid, onder a en b, van die wet][ref17]
      waaronder mede wordt verstaan een uitkering als bedoeld in [artikel 4:2b, zevende lid][ref18], of
      [artikel 6:3, zevende lid, van die wet][ref19] aan die persoon;

      f. een uitkering op grond van [artikel 29, tweede lid, onderdelen e tot en met g, van de Ziektewet][ref20],
      indien tevens sprake is van een privaatrechtelijke of een publiekrechtelijke dienstbetrekking als bedoeld in
      [artikel 3, eerste lid, van de Ziektewet][ref21].

      2 Indien het inkomen, bedoeld in het eerste lid, onderdelen c of d, een negatief bedrag is, dan wordt dat inkomen
      op nihil gesteld.

      3 Indien geen recht op loondoorbetaling bestaat door toepassing van
      [artikel 629, derde of negende lid, van Boek 7 van het Burgerlijk Wetboek][ref22] of een algemeen verbindend
      voorschrift als bedoeld in [artikel 76b, eerste tot en met het derde lid, van de Ziektewet][ref23], dan wel de
      betaling daarvan geheel of gedeeltelijk is opgeschort door toepassing van artikel 629, zesde lid, van Boek 7 van
      het Burgerlijk Wetboek, wordt voor de toepassing van dit artikel het loon of de bezoldiging in aanmerking genomen
      als ware er wel recht op doorbetaling en ware deze niet geheel of gedeeltelijk opgeschort.


