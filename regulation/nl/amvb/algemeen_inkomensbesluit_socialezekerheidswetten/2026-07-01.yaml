    text: |-
      Over de periode van 1 juli 2021 tot 1 januari 2022 wordt in afwijking van
      [artikel 4:1, achtste en tiende lid][ref1], voor de vaststelling van het inkomen voor de [Werkloosheidswet][ref2],
      het uitbetaalde bedrag aan vakantiebijslag als inkomen aangemerkt.


