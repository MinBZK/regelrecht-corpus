  - number: 3:3
    text: |-
      1 Ingeval van een uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van [artikel 18][ref1] of
      [hoofdstuk IV van de Werkloosheidswet][ref2] of [artikel 29, tweede lid, van de Ziektewet][ref3] recht ontstaat op:

      a. loondoorbetaling, indien het overeengekomen loon niet volledig wordt doorbetaald;

      b. een uitkering als bedoeld in [hoofdstuk IV van de Werkloosheidswet][ref4] of een op basis van een wettelijke
      regeling verstrekte uitkering die naar aard en strekking daarmee overeenkomt;

      c. een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref5], of een op basis van een wettelijke regeling
      verstrekte uitkering die naar aard en strekking daarmee overeenkomt;

      d. een op basis van een wettelijke regeling verstrekte uitkering die naar aard en strekking overeenkomt met een
      uitkering als bedoeld in het vierde lid,

      wordt tevens onder inkomen verstaan het inkomen, bedoeld in [artikel 3:2, eerste lid][ref6], dat werd genoten
      in het aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op loon, bezoldiging respectievelijk
      uitkering. Dit lid is uitsluitend van toepassing indien het recht op uitkering, bezoldiging of loon is ontstaan
      uit hoofde van werkzaamheden die zijn gestart nadat het recht op uitkering op grond van [artikel 18][ref7] of
      [hoofdstuk IV van de Werkloosheidswet][ref8] of [artikel 29, tweede lid, van de Ziektewet][ref9] is ontstaan.

      2 Ingeval van een uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref10] of recht op een reguliere WW-uitkering recht bestaat op:

      a. loondoorbetaling, indien het overeengekomen loon niet volledig wordt doorbetaald;

      b. een uitkering als bedoeld in [hoofdstuk IV van de Werkloosheidswet][ref11] of een op basis van een wettelijke
      regeling verstrekte uitkering die naar aard en strekking daarmee overeenkomt;

      c. een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref12], of een op basis van een wettelijke regeling
      verstrekte uitkering die naar aard en strekking daarmee overeenkomt;

      d. een op basis van een wettelijke regeling verstrekte uitkering die naar aard en strekking overeenkomt met:

      1° uitkering als bedoeld in het vijfde lid, onderdeel a; of

      2° uitkering als bedoeld in het vijfde lid, onderdeel b, met uitzondering van een
      bovenwettelijke werkloosheidsuitkering voor overheidswerknemers als bedoeld in
      [artikel 1, onderdeel j, van de Werkloosheidswet][ref13]

      wordt tevens onder inkomen verstaan het inkomen, bedoeld in [artikel 3:2, eerste lid][ref14], dat werd genoten in
      het aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op loon, bezoldiging respectievelijk uitkering.

      3 Indien de uitkeringsgerechtigde die recht heeft op een uitkering op grond van [artikel 18][ref15] of
      [hoofdstuk IV van de Werkloosheidswet][ref16] of [artikel 29, tweede lid, van de Ziektewet][ref17] met verlof gaat,
      wordt tevens onder inkomen verstaan het inkomen als bedoeld in [artikel 3:2, eerste lid][ref18], dat werd genoten
      in het aangiftetijdvak voor het aangiftetijdvak waarin het verlof aanving, mits het recht op verlof is ontstaan uit
      werkzaamheden die zijn gestart nadat een eerder recht op uitkering op grond van artikel 18 of hoofdstuk IV van de
      Werkloosheidswet of artikel 29, tweede lid, van de Ziektewet is ontstaan.

      4 Indien voor de uitkeringsgerechtigde voor wie naast recht op een uitkering op grond van [artikel 18][ref19] of
      [hoofdstuk IV van de Werkloosheidswet][ref20] of [artikel 29, tweede lid, van de Ziektewet][ref21], recht ontstaat
      op:

      a. een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref22]; of

      b. een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref23],

      wordt tevens onder inkomen verstaan het dag- of maandloon op grond waarvan de uitkering, bedoeld in onderdeel
      a of b, wordt berekend, mits dat recht op uitkering is ontstaan uit hoofde van werkzaamheden die zijn gestart
      nadat het recht op uitkering op grond van [artikel 18][ref24] of [hoofdstuk IV van de Werkloosheidswet][ref25] of
      [artikel 29, tweede lid, van de Ziektewet][ref26] is ontstaan.

      5 Indien voor de uitkeringsgerechtigde naast een recht op uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref27] recht bestaat op:

      a. een uitkering op grond [artikel 29, tweede lid, van de Ziektewet][ref28]; of

      b. een reguliere WW-uitkering of een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref29],

      wordt tevens onder inkomen verstaan het dag- of maandloon op grond waarvan de uitkering, bedoeld in onderdeel a of
      b, wordt berekend.

      6 In geval van een uitkeringsgerechtigde voor wie naast een reguliere WW-uitkering, recht bestaat op:

      a. een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref30]; of

      b. een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref31];

      wordt tevens onder inkomen verstaan het dag- of maandloon op grond waarvan de uitkering, bedoeld in onderdeel a of
      b, wordt berekend.

      7 In geval van een uitkeringsgerechtigde voor wie naast een reguliere WW-uitkering nog een recht ontstaat op een
      reguliere WW-uitkering,

      wordt het maandloon van de laatst ontstane uitkering aangemerkt als inkomen voor het eerst ontstane recht.

      8 Indien de uitkeringsgerechtigde, die recht heeft op een reguliere WW-uitkering of op een uitkering op grond van
      de [Wet werk en inkomen naar arbeidsvermogen][ref32] met verlof is, wordt tevens onder inkomen verstaan het inkomen
      als bedoeld in [artikel 3:2, eerste lid][ref33], dat werd genoten in het aangiftetijdvak voor het aangiftetijdvak
      waarin het verlof aanving.

      9 Voor zover de uitkeringsgerechtigde die recht heeft op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref34] op de dag voorafgaand aan de eerste dag van de wachttijd, bedoeld
      in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref35], recht heeft op een uitkering als bedoeld in
      het tweede lid, onderdeel c, wordt die uitkering niet aangemerkt als inkomen.

      10 Indien geen recht op loondoorbetaling bestaat door toepassing van
      [artikel 629, derde of negende lid, van Boek 7 van het Burgerlijk Wetboek][ref36] of een algemeen verbindend
      voorschrift als bedoeld in [artikel 76b, eerste tot en met het derde lid, van de Ziektewet][ref37], of op gronden
      die naar aard en strekking daarmee overeenkomen, wordt voor de toepassing van dit artikel het loon of bezoldiging
      in aanmerking genomen als ware er wel recht op doorbetaling.

      11 Indien de uitkering op grond van de [Werkloosheidswet][ref38] is geëindigd omdat de uitkeringsgerechtigde
      niet beschikbaar is voor arbeid, wordt die uitkering in aanmerking genomen alsof die eindiging niet heeft
      plaatsgevonden.

      12 Na het bepalen van het inkomen op grond van het vierde tot en met zesde lid wordt voor de toepassing
      van die leden het dagloon niet herzien als bedoeld in de [artikelen 16 van de Ziektewet][ref39] of
      [1b, zevende lid van de Werkloosheidswet][ref40].

      13 Indien er sprake is van een per aangiftetijdvak wisselend inkomen, wordt, in afwijking van het eerste,
      tweede, derde of achtste lid of [artikel 3:2, twintigste lid][ref41] als inkomen aangemerkt het gemiddelde van het
      inkomen in de drie aangiftetijdvakken voor het aangiftetijdvak waarin het recht ontstond op de doorbetaling van
      loon, bezoldiging of uitkering, bedoeld in het eerste of tweede lid, of [artikel 3:2, twintigste lid][ref42], of
      het verlof, bedoeld in het derde of achtste lid, aanving, met dien verstande dat bij de toepassing van dit lid het
      veertiende lid van overeenkomstige toepassing is.

      14 Indien het inkomen in het voorliggende aangiftetijdvak, bedoeld in het eerste, tweede, derde, achtste of
      dertiende lid, of [artikel 3:2, twintigste lid][ref43], minder bedraagt dan het inkomen, de loondoorbetaling,
      bezoldiging of uitkering in het te vervangen aangiftetijdvak, bedoeld in de genoemde leden, wordt in afwijking van
      de genoemde leden, als inkomen aangemerkt het inkomen dat, of de loondoorbetaling, bezoldiging of uitkering die is
      genoten in het te vervangen aangiftetijdvak.

      15 Bij de toepassing van het eerste, tweede, derde, achtste, dertiende of veertiende lid, of
      [artikel 3:2, twintigste lid][ref44], wordt het betaalde bedrag aan vakantiebijslag en het betaalde
      arbeidsvoorwaardenbedrag:

      a. tevens onder inkomen verstaan voor zover dat bedrag is betaald in het te vervangen aangiftetijdvak, bedoeld in
      de genoemde leden, en dat bedrag nog niet in aanmerking is genomen;

      b. niet onder inkomen verstaan voor zover dat bedrag is betaald in het voorliggende aangiftetijdvak, bedoeld in de
      genoemde leden, en dat bedrag reeds als inkomen in aanmerking is genomen.


