    text: |-
      1 Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] geldt dat in
      afwijking van [artikel 2:4, eerste lid, onderdelen l en o][ref2], niet als overig inkomen wordt aangemerkt:

      a. een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel l][ref3], en een uitkering die naar aard en
      strekking overeenkomt met een uitkering als bedoeld in artikel 2:4, eerste lid, onderdeel l;

      b. een eenmalige premie die door burgemeester en wethouders kan worden toegekend in het kader van een voorziening
      gericht op arbeidsinschakeling van ten hoogste € 3.446 per kalenderjaar; en

      c. een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste de in
      [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref4], genoemde gezamenlijke waarden per maand en per
      kalenderjaar.

      2 De bedragen, genoemd in het eerste lid, onderdelen b en c, worden gewijzigd indien de ontwikkeling van de in
      [artikel 31, tweede lid, onderdelen j en k, van de Participatiewet][ref5], genoemde bedragen daartoe aanleiding
      geeft. De gewijzigde bedragen en de dag waarop deze wijziging ingaat, worden door of namens Onze Minister
      medegedeeld in de Staatscourant.

      3 Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6] is
      [artikel 2:5][ref7] niet van toepassing.


