  - number: 2:4
    text: |-
      1 Onder overig inkomen wordt verstaan:

      a. een uitkering op grond van de [Werkloosheidswet][ref1] met uitzondering van de uitkeringen, bedoeld in
      [artikel 2:3, eerste lid][ref2];

      b. een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3];

      c. een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4];

      d. een uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5];

      e. een uitkering of inkomensvoorziening op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6];

      f. een uitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7];

      g. een uitkering op grond van de [Ziektewet][ref8] als bedoeld in [artikel 29, tweede lid, van die wet][ref9],
      tenzij artikel [2:2, eerste lid, onderdeel f][ref10], van toepassing is;

      h. een toeslag op grond van de [Toeslagenwet][ref11];

      i. een uitkering op grond van de [Wet inkomensvoorziening oudere werklozen][ref12];

      j. een uitkering op grond van de [Algemene nabestaandenwet][ref13];

      k. een uitkering op grond van de [Algemene Ouderdomswet][ref14];

      l. een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref15];

      m. een uitkering op grond van een pensioenregeling als bedoeld in de [Wet op de loonbelasting 1964][ref16], op
      grond van een regeling voor vervroegde uittreding of op grond van functioneel leeftijdsontslag;

      n. een basisbeurs of een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref17];

      o. een uitkering, toeslag of een beurs die naar aard en strekking overeenkomt met een uitkering, toeslag of beurs
      als bedoeld in de onderdelen a tot en met n;

      p. een uitkering als bedoeld in onderdeel o, waarop recht bestaat, maar die niet wordt uitbetaald, omdat onder de
      toepasselijke wetgeving gebruik is gemaakt van het daarin voorziene recht af te zien van het recht op die uitkering
      of de uitbetaling daarvan; en

      q. loon dat uit een vroegere dienstbetrekking wordt genoten.

      2 In afwijking van het eerste lid wordt niet als overig inkomen beschouwd:

      a. het bedrag waarmee de uitkering of inkomensvoorziening op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref18], de [Wet werk en inkomen naar arbeidsvermogen][ref19],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref20] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref21] is verhoogd wegens hulpbehoevendheid
      op grond van [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref22], de
      [artikelen 53][ref23] of [63 van de Wet werk en inkomen naar arbeidsvermogen][ref24],
      [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref25], de [artikelen 1a:5][ref26],
      [2:51][ref27] of [3:9 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref28] of een combinatie van
      deze artikelen;

      b. een eenmalige uitkering die na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden;

      d. de uitbetaalde afkoopwaarde van een klein pensioen als bedoeld in [artikel 66 van de Pensioenwet][ref29] en
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref30].

      3 Indien een uitkering, toeslag of beurs als bedoeld in het eerste lid, geheel of gedeeltelijk wordt geweigerd
      in verband met enig handelen of nalaten van betrokkene dat hem redelijkerwijs kan worden verweten, wordt voor
      de toepassing van dit artikel de uitkering, toeslag of beurs in aanmerking genomen als ware deze niet geheel of
      gedeeltelijk geweigerd.

      4 In afwijking van [artikel 2:2, eerste lid, onderdeel a][ref31], wordt onder overig inkomen mede verstaan een
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref32], indien het recht
      op die uitkering is ontstaan omdat recht op een uitkering als bedoeld in het eerste lid bestond.

      5 Indien een recht op uitkering op grond van de [Werkloosheidswet][ref33] geheel of gedeeltelijk is geëindigd omdat
      de uitkeringsgerechtigde minder beschikbaar is voor arbeid dan het aantal arbeidsuren dat hij heeft verloren wordt
      die uitkering in aanmerking genomen alsof die eindiging niet heeft plaatsgevonden.


