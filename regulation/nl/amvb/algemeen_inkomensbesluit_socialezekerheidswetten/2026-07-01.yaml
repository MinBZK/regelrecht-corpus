      1 In afwijking van de [artikelen 2:2][ref1], [2:3][ref2] en [2:4][ref3] wordt vakantiebijslag, vakantiebon of
      een aanspraak die naar aard en strekking daarmee overeenkomt niet als inkomen uit arbeid of als overig inkomen
      beschouwd.

      2 Indien over het inkomen uit arbeid of overig inkomen geen aanspraak op vakantiebijslag bestaat, wordt van dit
      inkomen slechts in aanmerking genomen:

      100 x B / (100 + A)

      waarbij:

      A staat voor het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref4]; en

      B staat voor het inkomen.

      3 Het tweede lid is van overeenkomstige toepassing indien de vakantiebijslag wordt betaald als onderdeel van het
      periodieke loon of als onderdeel van een arbeidsvoorwaardenbedrag.


