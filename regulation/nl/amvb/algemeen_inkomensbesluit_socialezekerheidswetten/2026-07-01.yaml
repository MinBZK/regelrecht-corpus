  - number: 2:10
    text: |-
      Voor het bepalen van inkomen als bedoeld in de [Toeslagenwet][ref1] geldt in afwijking van de
      [artikelen 2:2, eerste lid, onderdeel a][ref2], en [2:4, eerste lid, onderdelen l en o][ref3], dat:

      a. loondoorbetaling wordt aangemerkt als overig inkomen;

      b. niet als inkomen wordt aangemerkt een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel l][ref4], of
      een uitkering die naar aard en strekking daarmee overeenkomt; en

      c. indien op grond van [artikel 7, eerste lid, van de Toeslagenwet][ref5] van het inkomen uit arbeid een
      gedeelte is vrijgelaten, de op dat inkomen betrekking hebbende uitkeringen op grond van de verplichte
      verzekering van de [Ziektewet][ref6], op grond van [hoofdstuk 3, afdeling 2, paragraaf 1][ref7],
      [artikel 4:2b][ref8] of [6:3 van de Wet arbeid en zorg][ref9] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref10] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref11], voor zolang de dienstbetrekking voortduurt, alsmede aanvullingen op die uitkeringen als
      inkomen uit arbeid worden beschouwd.


