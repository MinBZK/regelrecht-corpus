  - number: 4:2
    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] geldt dat:

      a. Het inkomen uit arbeid of overig inkomen wordt toegerekend aan de perioden waarin hierop recht bestaat en wordt
      vervolgens herleid tot een bedrag per kalendermaand;

      b. indien op grond van
      __REF000___________________________________________________________________________________________________________
      _________ de uitkering over een kortere periode dan een maand wordt uitbetaald, het inkomen en de uitkering eerst
      per maand vastgesteld worden, waarna de uitkering over een kortere periode naar evenredigheid wordt vastgesteld;

      c. indien aannemelijk is dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in
      onderdeel a bedoelde inkomen, dat bestanddeel per maand vastgesteld wordt op 1/3 onderscheidenlijk 1/12 van het
      bedrag, dat over drie maanden onderscheidenlijk een jaar is verworven;

      d. indien winst als bedoeld in [artikel 2:2, eerste lid, onderdeel d][ref4], wordt genoten, het daaruit
      voortvloeiende inkomensbestanddeel per maand vastgesteld wordt op 1/12 van de winst, genoten over het kalenderjaar
      of het niet met het kalenderjaar samenvallend boekjaar, voorafgaand aan de maand waarover aanspraak op uitkering
      wordt gemaakt; en

      e. indien de toepassing van de onderdelen a tot en met d gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, het college bepaalt op welke periode dat
      inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit geacht moet worden over deze periode te
      zijn verdeeld.


