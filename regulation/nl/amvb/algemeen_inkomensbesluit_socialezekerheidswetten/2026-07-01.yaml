  - number: 3:2
    text: |-
      1 Onder inkomen wordt verstaan:

      a. hetgeen onder loon wordt verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref1]
      voor de werknemer, bedoeld in [artikel 1, onderdeel o, van die wet][ref2], met dien verstande dat niet tot het
      inkomen worden gerekend:

      1°. uitkeringen op grond van een werknemersverzekering of wachtgeld als bedoeld in
      [artikel 6, vijfde lid, tweede zin, van de Werkloosheidswet][ref3], al dan niet vermeerderd met een toeslag op
      grond van de [Toeslagenwet][ref4] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking
      staat;

      2°. hetgeen wordt genoten uit loondoorbetaling indien het overeengekomen loon niet volledig wordt doorbetaald, al
      dan niet vermeerderd met een toeslag op grond van de [Toeslagenwet][ref5] en de aanvullingen daarop van degene tot
      wie de werknemer in dienstbetrekking staat;

      b. het loon, bedoeld in [hoofdstuk II van de Wet op de loonbelasting 1964][ref6], voor zover de
      uitkeringsgerechtigde niet als werknemer als bedoeld in onderdeel a inkomen verdient, met dien verstande dat niet
      tot het inkomen worden gerekend:

      1°. hetgeen uit een vroegere dienstbetrekking als bedoeld in die wet wordt genoten;

      2°. de eindheffingsbestanddelen, bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref7];

      c. het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref8]
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref9], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref10], en
      [3.92 van die wet][ref11], voor zover de uitkeringsgerechtigde geen werknemer is als bedoeld in de onderdelen a
      en b;

      d. de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref12],
      vermeerderd met de ondernemersaftrek en de MKB-winstvrijstelling, bedoeld in de [artikelen 3.74][ref13]
      en [3.79a van die wet][ref14], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, van die wet][ref15], niet geacht worden te behoren tot de winst;

      e. een uitkering op grond van de [Wet arbeid en zorg][ref16] aan de zelfstandige of de beroepsbeoefenaar
      op arbeidsovereenkomst, bedoeld in [artikel 3:17, eerste lid, onder a en b, van die wet][ref17]
      waaronder mede wordt verstaan een uitkering als bedoeld in [artikel 4:2b, zevende lid][ref18], of
      [artikel 6:3, zevende lid, van die wet][ref19] aan die persoon.

      2 Indien het inkomen, bedoeld in het eerste lid, onderdelen c of d, een negatief bedrag is, dan wordt dat inkomen
      op nihil gesteld.

      3 In afwijking van het eerste lid, wordt niet tot het inkomen gerekend:

      inkomen dat is verdiend in uren die reeds via de [Werkloosheidswet][ref20] met de uitkering op grond van die wet
      zijn verrekend.

      4 Voor zover de uitkeringsgerechtigde op de dag voorafgaand aan:

      a. de dag waarop het recht op een uitkering op grond van [artikel 18][ref21] of
      [hoofdstuk IV van de Werkloosheidswet][ref22] is ontstaan; of

      b. de eerste dag van de ongeschiktheid tot werken, bedoeld in [artikel 29, derde lid, van de Ziektewet][ref23], in
      geval de uitkeringsgerechtigde recht heeft op een uitkering op grond van artikel 29, tweede lid, van de Ziektewet,

      inkomen als bedoeld in het eerste lid, ontvangt uit andere werkzaamheden dan de werkzaamheden waaruit het
      recht op de uitkering op grond van [artikel 18][ref24] of [hoofdstuk IV van de Werkloosheidswet][ref25] of
      [artikel 29, tweede lid, van de Ziektewet][ref26] is ontstaan, wordt dat inkomen niet in aanmerking genomen voor
      die uitkering op grond van de [Werkloosheidswet][ref27] respectievelijk de [Ziektewet][ref28].

      5 Voor zover de uitkeringsgerechtigde die recht heeft op een uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref29] op de dag voorafgaand aan de eerste dag van de wachttijd, bedoeld
      in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref30], inkomen ontvangt als bedoeld in eerste
      lid, onderdelen b tot en met d, uit andere werkzaamheden dan de werkzaamheden waaruit het recht op uitkering is
      ontstaan, wordt dat inkomen niet in aanmerking genomen voor de uitkering op grond van de Wet werk en inkomen naar
      arbeidsvermogen.

      6 Voor zover een uitkeringsgerechtigde die recht heeft op een uitkering op grond van
      [artikel 29, tweede lid, van de Ziektewet][ref31]:

      a. op de dag voorafgaand aan de eerste dag van de ongeschiktheid tot werken, bedoeld in
      [artikel 29, derde lid, van de Ziektewet][ref32], recht had op een uitkering op grond van de
      [artikelen 3:7][ref33], [3:8][ref34], [3:9][ref35] of [3:10 van de Wet arbeid en zorg][ref36]; en

      b. op de dag voorafgaand aan de dag waarop dat recht op een uitkering op grond van de [Wet arbeid en zorg][ref37]
      is ontstaan inkomen als bedoeld in het eerste lid, onderdeel a, ontvangt uit een andere dienstbetrekking dan de
      dienstbetrekking waaruit het recht op hiervoor genoemde uitkering op grond van de [Ziektewet][ref38] is ontstaan;

      wordt dat inkomen niet in aanmerking genomen.

      7 Voor zover een uitkeringsgerechtigde die recht heeft op een uitkering op grond van [artikel 18][ref39] of
      [hoofdstuk IV van de Werkloosheidswet][ref40]:

      a. op de dag voorafgaand aan de dag waarop het recht op een uitkering op grond van [artikel 18][ref41]
      of [hoofdstuk IV van de Werkloosheidswet][ref42] is ontstaan recht had op een uitkering op grond van de
      [artikelen 3:7][ref43], [3:8][ref44], [3:9][ref45] of [3:10 van de Wet arbeid en zorg][ref46]; en

      b. op de dag voorafgaand aan de dag waarop dat recht op een uitkering op grond van de [Wet arbeid en zorg][ref47]
      is ontstaan inkomen als bedoeld in het eerste lid, onderdeel a, ontvangt uit een andere dienstbetrekking dan de
      dienstbetrekking waaruit het recht op hiervoor genoemde uitkering op grond van de [Werkloosheidswet][ref48] is
      ontstaan;

      wordt dat inkomen niet in aanmerking genomen.

      8 Indien een uitkeringsgerechtigde inkomen als bedoeld in het eerste lid ontvangt uit dezelfde
      werkzaamheden als de werkzaamheden waaruit een recht op uitkering op grond van de [Werkloosheidswet][ref49],
      [artikel 29, tweede lid, van de Ziektewet][ref50] of [Wet werk en inkomen naar arbeidsvermogen][ref51] of
      recht op loondoorbetaling bestaat, wordt dat inkomen uitsluitend in aanmerking genomen voor die uitkering of
      loondoorbetaling.

      9 Indien de uitkeringsgerechtigde:

      a. een recht op uitkering heeft op grond van de [Werkloosheidswet][ref52],
      [artikel 29, tweede lid, van de Ziektewet][ref53] of de [Wet werk en inkomen naar arbeidsvermogen][ref54] dan wel
      recht bestaat op loondoorbetaling;

      b. daarnaast een recht op uitkering heeft op grond van de [Werkloosheidswet][ref55],
      [artikel 29, tweede lid, van de Ziektewet][ref56] of de [Wet werk en inkomen naar arbeidsvermogen][ref57] dan wel
      recht bestaat op loondoorbetaling; en

      c. inkomen als bedoeld in het eerste lid ontvangt uit werkzaamheden die zijn aangevangen nadat het eerste recht
      op uitkering of loondoorbetaling is ontstaan, uit andere werkzaamheden dan de werkzaamheden waaruit de rechten
      op uitkering of loondoorbetaling zijn ontstaan en voordat het tweede recht op uitkering of loondoorbetaling is
      ontstaan,

      wordt dat inkomen in aanmerking genomen voor de uitkering of loondoorbetaling waarvan het recht als eerste is
      ontstaan.

      10 Indien de uitkeringsgerechtigde:

      a. een recht op uitkering heeft op grond van de [Werkloosheidswet][ref58],
      [artikel 29, tweede lid, van de Ziektewet][ref59] of de [Wet werk en inkomen naar arbeidsvermogen][ref60] dan wel
      recht bestaat op loondoorbetaling;

      b. daarnaast een recht op uitkering heeft op grond van de [Werkloosheidswet][ref61],
      [artikel 29, tweede lid, van de Ziektewet][ref62] of de [Wet werk en inkomen naar arbeidsvermogen][ref63] dan wel
      recht bestaat op loondoorbetaling; en

      c. daarna inkomen als bedoeld in het eerste lid ontvangt uit andere werkzaamheden dan de werkzaamheden waaruit de
      rechten op uitkering of loondoorbetaling zijn ontstaan,

      dan wordt dat inkomen in aanmerking genomen voor de uitkering of loondoorbetaling waarvan het recht als tweede
      is ontstaan.

      11 In afwijking van het tiende lid, wordt, indien de uitkeringsgerechtigde:

      a. een recht op uitkering heeft op grond van [artikel 29, tweede lid, van de Ziektewet][ref64] dan wel recht heeft
      op loondoorbetaling;

      b. een recht op uitkering heeft op grond van [artikel 29, tweede lid, van de Ziektewet][ref65] dan wel recht heeft
      op loondoorbetaling; en

      c. daarna inkomen als bedoeld in het eerste lid ontvangt uit andere werkzaamheden dan de werkzaamheden waaruit de
      rechten op uitkering of loondoorbetaling zijn ontstaan,

      dat inkomen pro rata in aanmerking genomen voor de twee uitkeringen of rechten op loondoorbetaling.

      12 In afwijking van het achtste en negende lid wordt, indien de uitkeringsgerechtigde recht heeft op twee reguliere
      WW-uitkeringen en daarnaast inkomen als bedoeld in het eerste lid ontvangt, dat inkomen in aanmerking genomen voor
      de uitkering waarvan het recht als tweede is ontstaan.

      13 In afwijking van het negende en tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:

      a. een reguliere WW-uitkering;

      b. een uitkering op grond van [artikel 18][ref66] of [hoofdstuk IV van de Werkloosheidswet][ref67]; en

      c. tevens inkomen als bedoeld in het eerste lid ontvangt,

      het inkomen in aanmerking genomen voor de reguliere WW-uitkering.

      14 In afwijking van het achtste, negende en tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:

      a. een reguliere WW-uitkering;

      b. een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref68]; en

      c. tevens inkomen als bedoeld in het eerste lid ontvangt,

      het inkomen in aanmerking genomen voor de reguliere WW-uitkering.

      15 In afwijking van het negende en tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:

      a. een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref69];

      b. een uitkering op grond van [artikel 18][ref70] of [hoofdstuk IV van de Werkloosheidswet][ref71]; en

      c. tevens inkomen als bedoeld in het eerste lid ontvangt,

      het inkomen in aanmerking genomen voor de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref72].

      16 In afwijking van het tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:

      a. een uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref73];

      b. een uitkering op grond van [artikel 18][ref74] of [hoofdstuk IV van de Werkloosheidswet][ref75]; en

      c. tevens inkomen als bedoeld in het eerste lid ontvangt,

      het inkomen in aanmerking genomen voor de uitkering op grond van [artikel 29, tweede lid, van de Ziektewet][ref76].

      17 In afwijking van het tiende lid wordt, indien de uitkeringsgerechtigde recht heeft op:

      a. een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref77];

      b. een uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref78]; en

      c. tevens inkomen als bedoeld in het eerste lid, onderdeel a, ontvangt,

      het inkomen in aanmerking genomen voor de op grond van [hoofdstuk IV van de Werkloosheidswet][ref79] ontstane
      uitkering.

      18 In afwijking van het negende en veertiende lid wordt, indien een uitkeringsgerechtigde recht heeft op:

      a. een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref80];

      b. een reguliere WW-uitkering; en

      c. na aanvang van de wachttijd, bedoeld in [artikel 23 van de Wet werk en inkomen naar arbeidsvermogen][ref81],
      tevens inkomen ontvangt als bedoeld in het eerste lid, onderdeel b, c, d of e ontvangt,

      het inkomen in aanmerking genomen voor de uitkering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref82].

      19 Voor de toepassing van het achtste, negende, tiende, veertiende tot en met zestiende lid geldt dat, indien het
      inkomen, bedoeld in het eerste lid, meer bedraagt dan het dag- of maandloon op grond waarvan de uitkering waarvoor
      dat inkomen in aanmerking is genomen, wordt berekend, wordt dat meerdere in aanmerking genomen voor de andere
      uitkering.

      20 Indien de uitkeringsgerechtigde voor wie een van de leden acht tot en met achttien van
      toepassing is met verlof gaat of recht ontstaat op een uitkering die voorafgaat aan een uitkering
      bij wijze van oudedagsvoorziening of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref83], wordt voor de toepassing van het achtste, tot en
      met negentiende lid het inkomen dat werd genoten in het aangiftetijdvak voor het aangiftetijdvak waarin het verlof
      aanving respectievelijk het recht op die uitkering ontstond aangemerkt als inkomen als bedoeld in het eerste lid.


