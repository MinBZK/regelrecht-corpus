      1 Voor het bepalen van het inkomen, bedoeld in
      [artikel 52, vierde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1], geldt dat het
      loon dat door de werkgever wordt betaald, voordat het recht op loondoorbetaling, bedoeld in
      [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] voor het eerst is geëindigd, niet als
      inkomen wordt aangemerkt, indien:

      a. sprake is van een verkorte wachttijd als bedoeld in
      [artikel 23, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3];

      b. de uitkeringsgerechtigde geen recht had op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt was na
      afloop van de wachttijd, bedoeld in [artikel 23, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4]
      en de volledige en duurzame arbeidsongeschiktheid intreedt binnen vijf jaar daarna en voortkomt uit dezelfde
      oorzaak als op grond waarvan hij gedurende die wachttijd ongeschikt was tot het verrichten van arbeid; of

      c. de uitkeringsgerechtigde op de dag voorafgaand aan het intreden van de volledige en duurzame
      arbeidsongeschiktheid recht had op een WGA-uitkering.

      2 Voor het bepalen van het inkomen, bedoeld in de [artikelen 60, eerste lid, aanhef en onderdeel a][ref5], en
      [61, tweede en vierde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref6], geldt dat:

      a. indien de uitkeringsgerechtigde recht heeft op een uitkering op grond van
      [artikel 29, tweede lid, van de Ziektewet][ref7], [artikel 3:2, achtste, negende of tiende lid][ref8], uitsluitend
      van toepassing is indien de dienstbetrekking voortduurt op grond waarvan het recht op uitkering ontstond;

      b. [artikel 3:3, tweede lid, onderdeel d, onder 1°][ref9], uitsluitend van toepassing is indien de
      dienstbetrekking voortduurt op grond waarvan het recht op uitkering ontstond;

      c. [artikel 3:3, achtste lid][ref10], uitsluitend van toepassing is indien het verlof als bedoeld in de
      [Wet arbeid en zorg][ref11] betreft;

      d. [artikel 3:3, vijfde lid, onderdeel a][ref12], uitsluitend van toepassing is, indien de dienstbetrekking
      voortduurt op grond waarvan het recht op uitkering ontstond;

      e. indien de uitkeringsgerechtigde recht heeft op een uitkering op grond van de [Werkloosheidswet][ref13] zijn
      [artikelen 3:2][ref14] en [3:3][ref15] niet van toepassing met dien verstande dat onder inkomen wordt verstaan:

      1°. indien het een reguliere WW-uitkering of een uitkering op grond van
      [hoofdstuk III van de Werkloosheidswet][ref16] betreft, het inkomen, bedoeld in [artikel 3:2, eerste lid][ref17];

      2°. indien het een WW-uitkering op grond van [hoofdstuk IV van de Werkloosheidswet][ref18] of een naar aard en
      strekking overeenkomstige regeling betreft, het inkomen, bedoeld in [artikel 3:2, eerste lid][ref19], dat werd
      genoten in het aangiftetijdvak voor het aangiftetijdvak waarin recht ontstond op die uitkering en het inkomen,
      bedoeld in artikel 3:2, eerste lid, tenzij dat inkomen wordt ontvangen uit de dienstbetrekking waaruit de
      uitkeringsgerechtigde werkloos is geworden;

      3°. indien het een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref20] betreft, het dagloon op
      grond waarvan die uitkering wordt berekend en het inkomen, bedoeld in [artikel 3:2, eerste lid][ref21], tenzij dat
      inkomen wordt ontvangen uit de dienstbetrekking waaruit de uitkeringsgerechtigde werkloos is geworden.


