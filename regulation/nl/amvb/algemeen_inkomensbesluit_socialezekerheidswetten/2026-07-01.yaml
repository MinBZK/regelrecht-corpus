    text: |-
      1 Voor het bepalen van inkomen als bedoeld in de [Algemene Ouderdomswet][ref1] geldt dat:

      a. in afwijking van [artikel 2:4, eerste lid, onderdelen h, k, l en o][ref2], een uitkering of toeslag als
      bedoeld in artikel 2:4, eerste lid, onderdelen h, k en l, en een uitkering of toeslag die naar aard en strekking
      overeenkomt met een uitkering of toeslag als bedoeld in artikel 2:4, eerste lid, onderdelen h, k en l, niet
      aangemerkt wordt als inkomen;

      b. indien de pensioengerechtigde en zijn echtgenoot samenwerken in de uitoefening van een bedrijf of in de
      zelfstandige uitoefening van een beroep en de echtgenoot dan wel de pensioengerechtigde geen vergoeding ontvangt
      ter zake van de in de onderneming verrichte arbeid, ter vaststelling van het deel van de met inachtneming van het
      bepaalde in [artikel 2:2, eerste lid, onderdeel d][ref3], berekende winst, dat de echtgenoot toekomt, de winst
      wordt vermenigvuldigd met de factor X/(X+Y), waarbij:

      X staat voor het loon van de werknemer, die in dienstbetrekking een gelijkwaardige functie uitoefent als de
      echtgenoot, en

      Y staat voor het loon van de werknemer die in dienstbetrekking een gelijkwaardige functie uitoefent als de
      pensioengerechtigde; en

      c. de [artikelen 2:2, derde lid][ref4], [2:3, eerste lid, onderdeel d][ref5], en [2:4, derde en vijfde lid][ref6],
      niet van toepassing zijn.

      2 In afwijking van het eerste lid, onderdeel a, en [artikel 1.1, tweede lid][ref7], wordt voor het bepalen
      van het gezamenlijke inkomen, bedoeld in [artikel 12, eerste lid, van de Algemene Ouderdomswet][ref8] een
      uitkering van een pensioengerechtigde die naar aard en strekking overeenkomt met een uitkering als bedoeld in
      [artikel 2:4, eerste lid, onderdeel K][ref9], aangemerkt als overig inkomen.

      3 Voor de echtgenoot van de pensioengerechtigde waarop [artikel 64a van de Algemene Ouderomdswet][ref10]
      van toepassing is, wordt het inkomen dat is vastgesteld op grond van de [artikelen 10][ref11]
      en [11 van de Algemene Ouderdomswet][ref12], zoals deze luidden voor de inwerkingtreding van de
      [Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving][ref13], eveneens aangemerkt als het inkomen van
      die echtgenoot in het kader van [artikel 12 van de Algemene Ouderdomswet][ref14].


