preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 27 sepember 2010, nr. IVV/I/2010/18284;


    Gelet op de artikelen 10, tweede lid, en 20 van de Algemene nabestaandenwet, 12a van de Algemene Ouderdomswet, 8,
    derde lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers, 8, vierde
    lid, van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, 47, tweede
    lid, van de Wet financiering sociale verzekeringen, 10, zesde lid, van de Wet inkomensvoorziening oudere werklozen,
    2:6 van de Wet werk en arbeidsondersteuning jonggehandicapten, 52, vijfde lid, 60, vijfde lid, en 61, negende lid,
    van de Wet werk en inkomen naar arbeidsvermogen, 8, tweede lid, van de Tijdelijke wet pilot loondispensatie en 45a,
    vijfde lid, van de Ziektewet;


    De Afdeling advisering van de Raad van State gehoord (advies van 27 oktober 2010, nr. W12.10.0475/III);


    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 21 december 2010, nr. IVV/
    FB/2010/21595;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029368/2026-07-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      1 In dit besluit wordt verstaan onder:

      - *aangiftetijdvak:* het tijdvak van vier weken dan wel een maand waarop de aangifte op basis waarvan de ingehouden
      loonbelasting wordt afgedragen betrekking heeft;
      - *arbeidsvoorwaardenbedrag:* het aan de werknemer toegekende en in geld uitgedrukte toekomstige loonbestanddeel,
      niet zijnde een afzonderlijke opbouw van vakantiebijslag, dat in is opgebouwd ingevolge afspraken in de individuele
      of collectieve arbeidsovereenkomst, voor zover dit toekomstige loonbestanddeel kan leiden tot loon als bedoeld in
      [artikel 16 van de Wet financiering sociale verzekeringen][ref1];
      - *college:* college van burgemeester en wethouders;
      - *loondoorbetaling:* doorbetaling van loon als bedoeld in
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref2], doorbetaling van bezoldiging op grond van
      [artikel 76a van de Ziektewet][ref3] of loondoorbetaling of bezoldiging die naar aard en strekking daarmee
      overeenkomt;
      - *reguliere WW-uitkering:* een uitkering op grond van de [Werkloosheidswet][ref4], niet zijnde een uitkering op
      grond van [artikel 18][ref5] of [hoofdstuk IV van de Werkloosheidswet][ref6];
      - *stamrecht:* recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon;
      - *SVB:* Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];
      - *uitbetaalde looncomponenten ten laste van een arbeidsvoorwaardenbedrag:* door de werkgever als loon in de
      zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref8] uitbetaalde bedragen ten laste van een
      arbeidsvoorwaardenbedrag voor zover dit loon belastbaar is op grond van de [Wet op de loonbelasting 1964][ref9];
      - *uitkeringsgerechtigde:* de persoon die recht heeft op een uitkering, toeslag of inkomensvoorziening op grond van
      een wet als bedoeld in de [artikelen 2:1][ref10] en [3:1][ref11];
      - *UWV:* Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12];
      - *verlof:* een tussen werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd overeengekomen
      tijdvak, waarin de werknemer geen arbeid jegens de werkgever verricht, met uitzondering van verlof als bedoeld in
      de [artikelen 3:1][ref13], [3:2][ref14], [4:2a][ref15][en 6:3 van de Wet arbeid en zorg][ref16];
      - *werknemersverzekering:* werknemersverzekering, bedoeld in
      [artikel 2, onderdeel c, van de Wet financiering sociale verzekeringen][ref17].

      2 In geval van toepassing van dit besluit voor het bepalen van het
      inkomen, bedoeld in [artikel 12 van de Algemene Ouderdomswet][ref18], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref19],
      de [Toeslagenwet][ref20] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref21], wordt onder
      uitkeringsgerechtigde mede verstaan de echtgenoot van de uitkeringsgerechtigde, bedoeld in het eerste lid.

      3 In geval van toepassing van dit besluit voor het bepalen van het inkomen, bedoeld in de
      [artikelen 8, eerste lid][ref22], [10, eerste en tweede lid][ref23], en [11 van de Algemene Ouderdomswet][ref24],
      wordt, in afwijking van het eerste lid, onder uitkeringsgerechtigde verstaan de echtgenoot van de
      pensioengerechtigde.

      4 Indien een uitkeringsgerechtigde recht heeft op een uitkering op grond van
      [artikel 29, tweede lid, onderdeel d, van de Ziektewet][ref25] wordt die uitkering steeds aangemerkt als een
      reguliere WW-uitkering.


