    text: |-
      Voor het bepalen van inkomen als bedoeld in de [Wet inkomensvoorziening oudere werklozen][ref1] geldt in afwijking
      van [artikel 2:4, eerste lid, onderdelen h tot en met l en o][ref2], dat niet als overig inkomen wordt aangemerkt:

      a. een uitkering of toeslag als bedoeld in [artikel 2:4, eerste lid, onderdelen h tot en met l][ref3]; of

      b. een uitkering of toeslag die naar aard en strekking overeenkomt met een uitkering of toeslag als bedoeld in
      onderdeel a.


