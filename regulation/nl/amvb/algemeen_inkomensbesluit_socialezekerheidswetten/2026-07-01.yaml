  - number: 3:6
    text: |-
      1 Bij het bepalen van het inkomen, bedoeld in de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1],
      zijn de [artikelen 2:2, derde lid][ref2], [2:4, derde lid][ref3], [2:5][ref4] en [3:3, tiende en elfde lid][ref5],
      van overeenkomstige toepassing.

      2 Bij het bepalen van het inkomen, bedoeld in het eerste lid wordt, in afwijking van
      [artikel 3:2, eerste lid, onderdeel a, onder 1° en 2°][ref6], onder inkomen verstaan hetgeen onder loon wordt
      verstaan op grond van [artikel 16 van de Wet financiering sociale verzekeringen][ref7] voor de werknemer, bedoeld
      in [artikel 1, onderdeel o, van die wet][ref8].

      3 Bij het bepalen van het inkomen, bedoeld in het eerste lid, wordt tevens onder inkomen verstaan:

      a. hetgeen wordt genoten op grond van een wettelijke regeling die naar aard en strekking overeenkomt met een
      uitkering op grond van een werknemersverzekering;

      b. hetgeen wordt genoten op grond van een wettelijke regeling die naar aard en strekking overeenkomt met
      [artikel 629 van Boek 7 BW][ref9] of daarmee overeenkomende regeling die geldt voor een werknemer met een
      publiekrechtelijke dienstbetrekking; en

      c. een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref10].

      4 Bij het bepalen van het inkomen, bedoeld in het eerste lid, wordt in afwijking van het derde lid niet tot het
      inkomen gerekend:

      a. een toeslag op grond van de [Toeslagenwet][ref11]; en

      b. de aanvulling op een uitkering op grond van een werknemersverzekering van degene tot wie de werknemer in
      dienstbetrekking staat.


