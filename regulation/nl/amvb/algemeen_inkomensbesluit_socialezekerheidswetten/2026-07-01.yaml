    text: |-
      1 Voor het bepalen van inkomen als bedoeld in de [Algemene nabestaandenwet][ref1] geldt dat:

      a. in afwijking van [artikel 2:4, eerste lid, onderdelen h, j tot en met l en o][ref2], een uitkering of toeslag
      als bedoeld in artikel 2:4, eerste lid, onderdelen h, j tot en met l, en een uitkering of toeslag die naar aard en
      strekking overeenkomt met een uitkering of toeslag als bedoeld in artikel 2:4, eerste lid, onderdelen h, j tot en
      met l, niet wordt aangemerkt als inkomen;

      b. in afwijking van [artikel 2:4, eerste lid, onderdelen m, o en q][ref3]:

      1°. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, die ten behoeve van de
      uitkeringsgerechtigde in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten en het
      loon, bedoeld in [artikel 2:4, eerste lid, onderdeel q][ref4], wordt aangemerkt als inkomen uit arbeid; en

      2°. een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel m][ref5], en een uitkering die naar aard en
      strekking overeenkomt met een uitkering als bedoeld in artikel 2:4, eerste lid, onderdeel m, wordt aangemerkt als
      inkomen uit arbeid, met dien verstande dat een weduwen-, weduwnaars- en partnerpensioen niet wordt aangemerkt als
      inkomen; en

      c. de [artikelen 2:2, derde lid][ref6], [2:3, eerste lid, onderdeel d][ref7], en [2:4, derde en vijfde lid][ref8],
      niet van toepassing zijn.

      2 Een op grond van de wetgeving van:

      a. een andere mogendheid;

      b. Nederland ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba;

      c. Aruba, Curaçao of Sint Maarten; of

      d. een volkenrechtelijke organisatie,

      toegekende uitkering, waaronder mede begrepen een verhoging van een uitkering, die naar aard en strekking
      overeenkomt met een gehele of een deel van een uitkering als bedoeld in de [artikelen 14][ref9] of
      [26 van de Algemene nabestaandenwet][ref10] anders dan op grond van de vrijwillige verzekering, wordt op de
      uitkering, bedoeld in de artikelen 14 respectievelijk 26 van de Algemene nabestaandenwet in mindering gebracht.

      3 [Artikel 2:4, eerste lid, onderdeel P, en derde lid][ref11], zijn van overeenkomstige toepassing op het tweede
      lid.


