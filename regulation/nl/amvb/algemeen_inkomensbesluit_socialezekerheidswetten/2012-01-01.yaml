        bwb_id: BWBR0002471
        artikel: '9'
  - number: 2:2.1.b.1°
    text: |-
      hetgeen uit een vroegere dienstbetrekking als bedoeld in die [wet][ref1] wordt genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
    references:
