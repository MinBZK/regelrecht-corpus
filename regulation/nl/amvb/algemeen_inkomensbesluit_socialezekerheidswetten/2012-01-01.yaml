  - number: 1:1.2
    text: |-
      In geval van toepassing van dit besluit voor het bepalen van het
      inkomen, bedoeld in [artikel 12 van de Algemene Ouderdomswet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], wordt onder
      uitkeringsgerechtigde mede verstaan de echtgenoot van de uitkeringsgerechtigde, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel11
    references:
