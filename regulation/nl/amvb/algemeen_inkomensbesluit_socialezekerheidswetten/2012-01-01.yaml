  - number: 2:1
    text: |-
      Dit hoofdstuk is van toepassing op het bepalen van inkomen als bedoeld in
      de [Algemene nabestaandenwet][ref1], de [Algemene Ouderdomswet][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel21
    references:
