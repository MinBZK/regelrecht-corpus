    text: |-
      een uitkering op grond van de [Wet arbeid en zorg][ref1] aan de zelfstandige of de beroepsbeoefenaar op
      arbeidsovereenkomst, bedoeld in [artikel 3:17, eerste lid, onder a en b, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
