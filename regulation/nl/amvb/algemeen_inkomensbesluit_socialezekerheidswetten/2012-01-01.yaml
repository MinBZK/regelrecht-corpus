  - number: 2:2.1
    text: 'Onder inkomen uit arbeid wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
  - number: 2:2.1.a
    text: |-
      hetgeen onder loon wordt verstaan op grond van
      [artikel 16, eerste en tweede lid, van de Wet financiering sociale verzekeringen][ref1] voor de werknemer, bedoeld
      in [artikel 1, onderdeel o, van die wet][ref2], met dien verstande dat niet tot het inkomen uit arbeid worden
      gerekend uitkeringen op grond van een werknemersverzekering, al dan niet vermeerderd met een toeslag op grond
      van de [Toeslagenwet][ref3] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking staat
      of stond;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0004043
  - number: 2:2.1.b
    text: |-
      het loon, bedoeld in de [artikelen 9 tot en met 13 van de Wet op de loonbelasting 1964][ref1], voor zover de
      uitkeringsgerechtigde niet als werknemer als bedoeld in onderdeel a inkomen verdient, met dien verstande dat niet
      tot het inkomen uit arbeid worden gerekend:


