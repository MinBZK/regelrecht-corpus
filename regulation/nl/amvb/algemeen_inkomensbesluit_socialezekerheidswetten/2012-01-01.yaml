        bwb_id: BWBR0001888
        artikel: '3'
  - number: 2:2.2
    text: |-
      Indien het inkomen, bedoeld in het eerste lid, onderdelen c of d, een negatief bedrag is, dan wordt dat inkomen op
      nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
  - number: 2:2.3
    text: |-
      Indien geen recht op doorbetaling van loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1]
      of de doorbetaling van bezoldiging op grond van [artikel 76a van de Ziektewet][ref2] bestaat door toepassing van
      artikel 629, derde lid, van Boek 7 van het Burgerlijk Wetboek of een algemeen verbindend voorschrift als bedoeld
      in [artikel 76b, eerste tot en met het derde lid, van de Ziektewet][ref3], dan wel de betaling daarvan geheel
      of gedeeltelijk is opgeschort door toepassing van artikel 629, zesde lid, van Boek 7 van het Burgerlijk Wetboek,
      wordt voor de toepassing van dit artikel het loon of de bezoldiging in aanmerking genomen als ware er wel recht op
      doorbetaling en ware deze niet geheel of gedeeltelijk opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel76b
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 76b
  - number: 2:3.1
    text: |-
      Gedurende de periode dat de uitkeringsgerechtigde: a. recht heeft op een uitkering als bedoeld in
      [hoofdstuk IV van de Werkloosheidswet][ref1]; b. recht heeft op een uitkering in verband met werkloosheid
      als bedoeld in [artikel 18, eerste lid, van de Werkloosheidswet][ref2]; c. recht heeft op een uitkering in
      verband met werkloosheid die uitsluitend het gevolg is van verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3] ontheffing is verleend; of d.
      met verlof is, wordt als inkomen uit arbeid beschouwd het inkomen dat werd genoten in het aangiftetijdvak voor het
      aangiftetijdvak waarin: 1°. het recht ontstond op een uitkering als bedoeld in de onderdelen a tot en met c. 2°.
      het verlof aanving.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel23
    references:
