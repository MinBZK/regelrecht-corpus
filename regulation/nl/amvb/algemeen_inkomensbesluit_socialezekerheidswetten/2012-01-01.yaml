        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.2
    text: |-
      In afwijking van het eerste lid, onderdeel a, en [artikel 1.1, tweede lid][ref1], wordt voor het bepalen
      van het gezamenlijke inkomen, bedoeld in [artikel 12, eerste lid, van de Algemene Ouderdomswet][ref2] een
      uitkering van een pensioengerechtigde die naar aard en strekking overeenkomt met een uitkering als bedoeld in
      [artikel 2:4, eerste lid, onderdeel K][ref3], aangemerkt als overig inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.3
    text: |-
      Voor de echtgenoot van de pensioengerechtigde waarop [artikel 64a van de Algemene Ouderomdswet][ref1]
      van toepassing is, wordt het inkomen dat is vastgesteld op grond van de [artikelen 10][ref2]
      en [11 van de Algemene Ouderdomswet][ref3], zoals deze luidden voor de inwerkingtreding van de
      [Wet harmonisatie en vereenvoudiging socialezekerheidswetgeving][ref4], eveneens aangemerkt als het inkomen van die
      echtgenoot in het kader van [artikel 12 van de Algemene Ouderdomswet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel64a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0029334
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel12
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 64a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0029334
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '12'
  - number: 2:8.1
    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] geldt dat in
      afwijking van [artikel 2:4, eerste lid, onderdelen l en o][ref2], niet als overig inkomen wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:8.1.a
    text: |-
      een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel l][ref1], en een uitkering die naar aard en
      strekking overeenkomt met een uitkering als bedoeld in artikel 2:4, eerste lid, onderdeel l;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:8.1.b
    text: |-
      een eenmalige premie die door burgemeester en wethouders kan worden toegekend in het kader van een voorziening
      gericht op arbeidsinschakeling van ten hoogste € 2.288,00 per kalenderjaar; en
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
  - number: 2:8.1.c
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste € 95,– per maand
      met een maximum van € 764,– per jaar, dan wel een kostenvergoeding voor het verrichten van
      vrijwilligerswerk in het kader van een voorziening gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] van ten hoogste € 150,– per maand met een
      maximum van € 1.500,– per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 2:8.2
    text: |-
      Onze Minister wijzigt de bedragen, bedoeld in het eerste lid, onderdelen b en c,
      met ingang van een door hem te bepalen dag, voor zover de ontwikkeling van de in
      [artikel 31, tweede lid, onderdelen j en k, van de Wet werk en bijstand][ref1] genoemde bedragen daartoe aanleiding
      geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: 2:8.3
    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] is
      [artikel 2:5][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:9.1
    text: |-
      Voor het bepalen van inkomen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________ geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
  - number: 2:9.1.a
    text: |-
      in geval van een gewezen zelfstandige die een onderneming heeft uitgeoefend in de vorm van een naamloze
      vennootschap of een besloten vennootschap in afwijking van [artikel 2:2, eerste lid, onderdeel d][ref1],
      onder belastbare winst uit onderneming wordt verstaan hetgeen ingevolge het bepaalde bij of krachtens
      [Hoofdstuk II van de Wet op de vennootschapsbelasting 1969][ref2] onder winst wordt verstaan alsmede de betalingen
      die aan de echtgenoot worden gedaan ter zake van in de onderneming verrichte arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002672
        hoofdstuk: II
  - number: 2:9.1.b
    text: |-
      de winst, bedoeld in onderdeel a, wordt gecorrigeerd met alle geldelijke voor- en nadelen voor
      de gewezen zelfstandige, die uit diens verhouding tot de besloten of naamloze vennootschap
      voortvloeien, tenzij het inkomen uit arbeid of overig inkomen betreft als bedoeld in
      [artikel 2:2, eerste lid, onderdeel a tot en met c, e en f,][ref1] en [artikel 2:4, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:9.1.c
    text: |-
      in aanvulling op [artikel 2:2, eerste lid, onderdeel d][ref1], mede onder belastbare winst uit onderneming wordt
      verstaan de partnervergoeding, bedoeld in [artikel 3:16, vierde lid, van de Wet inkomstenbelasting 2001][ref2],
      indien deze vergoeding € 5.000,– of hoger is, en de winst van de echtgenoot van de gewezen zelfstandige, indien het
      bedrijf en beroep mede voor rekening van de echtgenoot wordt uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2:9.1.d
    text: |-
      in afwijking van [artikel 1:1, derde lid][ref1], en behoudens het bepaalde in onderdeel c onder inkomen uit arbeid
      en overig inkomen niet wordt verstaan het inkomen van de echtgenoot; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel1
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:9.1.e
    text: |-
      [artikel 2:8, eerste lid, aanhef en onderdelen b en c, en het derde lid][ref1], van overeenkomstige toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2:9.2
    text: |-
      Voor het bepalen van inkomen als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __________ geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel8
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '8'
  - number: 2:9.2.a
    text: |-
      in afwijking van [artikel 2:2, eerste lid, onderdeel d][ref1], belastbare winst uit onderneming niet tot het
      inkomen wordt gerekend; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:9.2.b
    text: |-
      [artikel 2:8, eerste lid, aanhef en onderdelen b en c, en het derde lid][ref1], van overeenkomstige toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 4:1.1
    text: |-
      Het inkomen, met uitzondering van het inkomen voor de toepassing van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2], wordt herleid tot
      een bedrag per kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: 4:1.2
    text: |-
      Voor de toepassing van het eerste lid wordt de kalendermaand gesteld op 21,75 dagen. De kalenderweek wordt gesteld
      op vijf dagen.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:1.3
    text: |-
      Bij de toepassing van het eerste lid wordt het loon door de uitkeringsgerechtigde geacht te zijn genoten in het
      aangiftetijdvak waarover de werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:1.4
    text: |-
      Bij de toepassing van het eerste lid worden betalingen van het overig inkomen toegerekend aan de perioden waarin
      hierop recht bestaat.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:1.5
    text: |-
      Bij de toepassing van het eerste lid worden het belastbaar loon, het belastbaar resultaat
      uit overige werkzaamheden, de belastbare winst uit onderneming en de uitkering, bedoeld in
      [artikel 2:2, eerste lid, onderdelen c, d en e][ref1], evenredig toegerekend aan de betreffende kalendermaanden in
      het boek- of kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4:1.6
    text: |-
      Bij een per kalendermaand wisselend inkomen kan op basis van een geschat inkomen een gemiddeld inkomen per
      kalendermaand worden bepaald, waarna per periode van ten hoogste twaalf maanden een herberekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:1.7
    text: |-
      De SVB kan bij de vaststelling van het inkomen het loon dat door de uitkeringsgerechtigde is genoten in een
      aangiftetijdvak, toerekenen aan de dag waarop dat loon betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:1.8
    text: |-
      De SVB kan bij de vaststelling van het inkomen
      [artikel 3, eerste lid, van het Besluit dagloonregels werknemersverzekeringen][ref1] overeenkomstig toepassen ten
      aanzien van loon dat het karakter heeft van een extra periodiek salaris, waarbij in plaats van een refertejaar,
      kalendermaand wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018842#Artikel3
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018842
        artikel: '3'
  - number: 4:1.9
    text: |-
      Indien toepassing van dit artikel leidt tot een kennelijk onredelijk resultaat bepaalt de SVB het inkomen op een
      andere wijze.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel41
  - number: 4:2
    text: |-
      Voor het bepalen van inkomen als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: 4:2.a
    text: |-
      het inkomen uit arbeid of overig inkomen in de maand waarover aanspraak op uitkering wordt gemaakt vastgesteld
      wordt op het bedrag dat de uitkeringsgerechtigde over die maand verwerft of redelijkerwijs geacht kan worden te
      verwerven;
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
  - number: 4:2.b
    text: |-
      indien op grond van
      __REF000___________________________________________________________________________________________________________
      _________ de uitkering over een kortere periode dan een maand wordt uitbetaald, het inkomen en de uitkering eerst
      per maand vastgesteld worden, waarna de uitkering over een kortere periode naar evenredigheid wordt vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel21
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '21'
  - number: 4:2.c
    text: |-
      indien aannemelijk is dat een inkomensbestanddeel geen juiste maatstaf biedt voor de bepaling van het in onderdeel
      a bedoelde inkomen, dat bestanddeel per maand vastgesteld wordt op 1/3 onderscheidenlijk 1/12 van het bedrag, dat
      over drie maanden onderscheidenlijk een jaar is verworven;
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
  - number: 4:2.d
    text: |-
      indien winst als bedoeld in [artikel 2:2, eerste lid, onderdeel d][ref1], wordt genoten, het daaruit voortvloeiende
      inkomensbestanddeel per maand vastgesteld wordt op 1/12 van de winst, genoten over het kalenderjaar of het niet met
      het kalenderjaar samenvallend boekjaar, voorafgaand aan de maand waarover aanspraak op uitkering wordt gemaakt; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4:2.e
    text: |-
      indien de toepassing van de onderdelen a tot en met d gelet op het tijdstip van verwerving van een
      inkomensbestanddeel, tot een kennelijk onredelijk resultaat leidt, het college bepaalt op welke periode dat
      inkomensbestanddeel geacht moet worden betrekking te hebben en hoe dit geacht moet worden over deze periode te
      zijn verdeeld.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel42
  - number: 4:3.1
    text: |-
      Indien het bij de toepassing van dit hoofdstuk noodzakelijk is om niet in euro’s uitgedrukt inkomen om te rekenen
      in euro’s, geschiedt dat met behulp van de door de Europese Centrale Bank geadviseerde wisselkoersen.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel43
  - number: 4:3.2
    text: |-
      Een wijziging van een wisselkoers als bedoeld in het eerste lid beïnvloedt het vastgestelde inkomen niet, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel43
  - number: 4:3.2.a
    text: bij wijziging van het inkomen, anders dan ten gevolge van de koersmutaties, een omrekening plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel43
  - number: 4:3.2.b
    text: ten minste eens per jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel43
  - number: 5:7.1
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
  - number: 5:7.1.a
    text: |-
      [Inkomens- en samenloopbesluit Anw][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008086
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008086
  - number: 5:7.1.b
    text: |-
      [Inkomensbesluit IOAW][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004091
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004091
  - number: 5:7.1.c
    text: |-
      [Inkomensbesluit IOAZ][ref1]; en

      [ref1]: https://wetten.overheid.nl/BWBR0004167
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004167
  - number: 5:7.1.d
    text: |-
      [Inkomensbesluit AOW 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008136
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008136
  - number: 5:7.2
    text: |-
      Ingeval ter zake van het belastbare loon [artikel 39c van de Wet op de loonbelasting 1964][ref1] wordt toegepast
      wordt voor toepassing van [artikel 2:2, eerste lid, onderdeel b, onder 3°][ref2], onder eindheffingsbestanddelen
      als bedoeld in [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref3]
      verstaan eindheffingsbestanddelen als bedoeld in artikel 31, eerste lid, onderdelen b tot en met h, van die wet,
      zoals dat artikel luidde op 31 december 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39c
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39c
      - id: ref2
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 5:7.3
    text: |-
      Het tweede lid vervalt met ingang van de dag waarop [artikel 39c van de Wet op de loonbelasting 1964][ref1]
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39c
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39c
  - number: 5:8
    text: |-
      In afwijking van [artikel 5:7][ref1] blijft [artikel 9b van het Inkomensbesluit IOAW][ref2] van toepassing in
      wettelijke procedures en rechtsgedingen inzake besluiten die op grond van artikel 9b van het Inkomensbesluit IOAW
      zijn genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, zowel in eerste aanleg als in
      verdere instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004091#Artikel9b
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004091
        artikel: 9b
  - number: 5:10
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2011 met uitzondering van [artikel 5:5][ref1], dat in
      werking treedt met ingang van de dag na de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst
      en terug werkt tot en met 9 juni 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel5
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel510
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '5'
        hoofdstuk: '5'
  - number: 5:11
    text: 'Dit besluit wordt aangehaald als: Inkomensbesluit volksverzekeringen en sociale voorzieningen.'
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel511
