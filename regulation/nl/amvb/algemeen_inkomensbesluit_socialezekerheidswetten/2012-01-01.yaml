        artikel: '18'
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 2:3.2
    text: |-
      Niet als inkomen uit arbeid wordt beschouwd het loon dat door de uitkeringsgerechtigde wordt genoten indien hij
      tegelijkertijd uit hoofde van dezelfde arbeidsrelatie inkomen als bedoeld in het eerste lid geniet.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel23
  - number: 2:4.1
    text: 'Onder overig inkomen wordt verstaan:'
