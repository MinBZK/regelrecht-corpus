        artikel: '15'
  - number: 2:6.1
    text: |-
      Voor het bepalen van inkomen als bedoeld in de [Algemene nabestaandenwet][ref1] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 2:6.1.a
    text: |-
      in afwijking van [artikel 2:4, eerste lid, onderdelen h, j tot en met l en o][ref1], een uitkering of toeslag als
      bedoeld in artikel 2:4, eerste lid, onderdelen h, j tot en met l, en een uitkering of toeslag die naar aard en
      strekking overeenkomt met een uitkering of toeslag als bedoeld in artikel 2:4, eerste lid, onderdelen h, j tot en
      met l, niet wordt aangemerkt als inkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
