        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 2:2.1.f
    text: |-
      een uitkering op grond van [artikel 29, tweede lid, onderdelen e tot en met g, van de Ziektewet][ref1],
      indien tevens sprake is van een privaatrechtelijke of een publiekrechtelijke dienstbetrekking als bedoeld in
