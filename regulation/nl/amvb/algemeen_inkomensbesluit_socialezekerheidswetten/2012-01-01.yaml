  - number: 2:4.2.b
    text: |-
      een eenmalige uitkering die na beëindiging van de dienstbetrekking aan een werknemer in verband met die beëindiging
      wordt betaald; en
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.2.c
    text: |-
      periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.3
    text: |-
      Indien een uitkering, toeslag of beurs als bedoeld in het eerste lid, geheel of gedeeltelijk wordt geweigerd
      in verband met enig handelen of nalaten van betrokkene dat hem redelijkerwijs kan worden verweten, wordt voor
      de toepassing van dit artikel de uitkering, toeslag of beurs in aanmerking genomen als ware deze niet geheel of
      gedeeltelijk geweigerd.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.4
    text: |-
      In afwijking van [artikel 2:2, eerste lid, onderdeel a][ref1], wordt onder overig inkomen mede verstaan een
      uitkering op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2], indien het recht op
      die uitkering is ontstaan omdat recht op een uitkering als bedoeld in het eerste lid bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
    references:
