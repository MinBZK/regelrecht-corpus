      een uitkering op grond van een pensioenregeling als bedoeld in de [Wet op de loonbelasting 1964][ref1], op grond
      van een regeling voor vervroegde uittreding of op grond van functioneel leeftijdsontslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 2:4.1.n
    text: |-
      een basisbeurs of een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 2:4.1.o
    text: |-
      een uitkering, toeslag of een beurs die naar aard en strekking overeenkomt met een uitkering, toeslag of beurs als
      bedoeld in de onderdelen a tot en met n;
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.1.p
    text: |-
      een uitkering als bedoeld in onderdeel o, waarop recht bestaat, maar die niet wordt uitbetaald, omdat onder de
      toepasselijke wetgeving gebruik is gemaakt van het daarin voorziene recht af te zien van het recht op die uitkering
      of de uitbetaling daarvan; en
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.1.q
    text: loon dat uit een vroegere dienstbetrekking wordt genoten.
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.2
    text: 'In afwijking van het eerste lid wordt niet als overig inkomen beschouwd:'
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel24
  - number: 2:4.2.a
    text: |-
      het bedrag waarmee de uitkering of inkomensvoorziening op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], de [Wet werk en inkomen naar arbeidsvermogen][ref2],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3] of de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref4] is verhoogd wegens hulpbehoevendheid
      op grond van [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref5],
      de [artikelen 53][ref6] of [63 van de Wet werk en inkomen naar arbeidsvermogen][ref7],
      [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8], de [artikelen 2:51][ref9] of
      [3:9 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref10] of een combinatie van deze artikelen;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
