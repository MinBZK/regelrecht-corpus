        paragraaf: '1'
  - number: 2:5.1
    text: |-
      In afwijking van de [artikelen 2:2][ref1], [2:3][ref2] en [2:4][ref3] wordt vakantiebijslag of een vakantiebon niet
      als inkomen uit arbeid of als overig inkomen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel25
    references:
