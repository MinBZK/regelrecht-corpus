      en [3.79a van die wet][ref3], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, van die wet][ref4], niet geacht worden te behoren tot de winst;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
