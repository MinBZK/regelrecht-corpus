  - number: 2:7.1
    text: |-
      Voor het bepalen van inkomen als bedoeld in de [Algemene Ouderdomswet][ref1] geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 2:7.1.a
    text: |-
      in afwijking van [artikel 2:4, eerste lid, onderdelen h, k, l en o][ref1], een uitkering of toeslag als bedoeld in
      artikel 2:4, eerste lid, onderdelen h, k en l, en een uitkering of toeslag die naar aard en strekking overeenkomt
      met een uitkering of toeslag als bedoeld in artikel 2:4, eerste lid, onderdelen h, k en l, niet aangemerkt wordt
      als inkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.1.b
    text: |-
      indien de pensioengerechtigde en zijn echtgenoot samenwerken in de uitoefening van een bedrijf of in de
      zelfstandige uitoefening van een beroep en de echtgenoot dan wel de pensioengerechtigde geen vergoeding ontvangt
      ter zake van de in de onderneming verrichte arbeid, ter vaststelling van het deel van de met inachtneming van
      het bepaalde in [artikel 2:2, eerste lid, onderdeel d][ref1], berekende winst, dat de echtgenoot toekomt, de
      winst wordt vermenigvuldigd met de factor X/(X+Y), waarbij: X staat voor het loon van de werknemer, die in
      dienstbetrekking een gelijkwaardige functie uitoefent als de echtgenoot, en Y staat voor het loon van de werknemer
      die in dienstbetrekking een gelijkwaardige functie uitoefent als de pensioengerechtigde; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:7.1.c
    text: |-
      de [artikelen 2:2, derde lid][ref1], [2:3, eerste lid, onderdeel d][ref2], en [2:4, derde lid][ref3], niet van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel27
    references:
      - id: ref1
