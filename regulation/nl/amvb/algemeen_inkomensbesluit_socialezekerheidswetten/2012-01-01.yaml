        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.1.b
    text: |-
      in afwijking van [artikel 2:4, eerste lid, onderdelen m, o en q][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.1.b.1°
    text: |-
      een uitkering op grond van een particuliere verzekering wegens derving van inkomen, die ten behoeve van de
      uitkeringsgerechtigde in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten en het
      loon, bedoeld in [artikel 2:4, eerste lid, onderdeel q][ref1], wordt aangemerkt als inkomen uit arbeid; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0029368
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2:6.1.b.2°
    text: |-
      een uitkering als bedoeld in [artikel 2:4, eerste lid, onderdeel m][ref1], en een uitkering die naar aard en
      strekking overeenkomt met een uitkering als bedoeld in artikel 2:4, eerste lid, onderdeel m, wordt aangemerkt als
      inkomen uit arbeid, met dien verstande dat een weduwen-, weduwnaars- en partnerpensioen niet wordt aangemerkt als
      inkomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
