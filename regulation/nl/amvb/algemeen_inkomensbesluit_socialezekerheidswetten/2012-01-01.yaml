  - number: 2:6.2
    text: 'Een op grond van de wetgeving van:'
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
  - number: 2:6.2.a
    text: een andere mogendheid;
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
  - number: 2:6.2.b
    text: Nederland ten behoeve van de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
  - number: 2:6.2.c
    text: Aruba, Curaçao of Sint Maarten; of
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
  - number: 2:6.2.d
    text: een volkenrechtelijke organisatie,
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
  - number: 2:6.3
    text: |-
      Indien bij de vaststelling van de hoogte van een toegekende uitkering als bedoeld in het tweede lid, die naar aard
      en strekking overeenkomt met een uitkering als bedoeld in de [artikel 14 van de Algemene nabestaandenwet][ref1],
      rekening wordt gehouden met tot het gezin van de nabestaande behorende kinderen, worden voor de toepassing van het
      tweede lid, de uitkeringen bedoeld in de artikelen 14 en [22 van de Algemene nabestaandenwet][ref2] samengeteld en
      als één uitkering beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007795#Artikel22
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0007795
        artikel: '22'
  - number: 2:6.4
    text: |-
      [Artikel 2:4, eerste lid, onderdeel P, en derde lid][ref1], zijn van overeenkomstige toepassing op het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0029368#Artikel2
    url: https://wetten.overheid.nl/BWBR0029368/2012-01-01#Artikel26
    references:
