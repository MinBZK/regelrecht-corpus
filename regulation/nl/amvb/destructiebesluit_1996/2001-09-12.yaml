  - number: '35'
    text: Het Destructiebesluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel35
  - number: '38'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van afgifte van het *Staatsblad* waarin het
      wordt geplaatst, met uitzondering van artikel 37, dat in werking treedt op een bij koninklijk besluit te bepalen
      tijdstip.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel38
  - number: '39'
    text: |-
      Dit besluit wordt aangehaald als: Destructiebesluit, met vermelding van het jaartal van het *Staatsblad* waarin het
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel39
