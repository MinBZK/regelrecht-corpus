  - number: '22'
    text: |-
      1 Verwerkingsbedrijven die laag-risico-materiaal gebruiken voor de bereiding van voeder voor gezelschapsdieren,
      beschikken over daartoe geschikte bedrijfsruimten, gereedschap en verwerkingsinstallaties, alsmede over passende
      voorzieningen voor de afvoer van afvalwater. Degene die een verwerkingsbedrijf als bedoeld in de eerste volzin in
      stand houdt, draagt ervoor zorg dat de bedrijfsruimten schoon worden gehouden en dat overigens het produktieproces
      zo hygiënisch mogelijk plaatsvindt.

      2 Het bestuur van het Produktschap voor Veevoeder kan ten aanzien van de verwerkingsbedrijven, bedoeld in het
      eerste lid, nadere regels stellen met betrekking tot de onderwerpen, bedoeld in dat lid en in artikel 17, tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel22
  - number: '23'
    text: |-
      1 Degene die een inrichting in stand houdt waarin laag-risico-materiaal wordt voorbewerkt tot voeder voor
      edelpelsdieren, draagt ervoor zorg dat niet meer voor de voorbewerking te gebruiken materiaal aan een
      verwerkingsbedrijf voor hoog-risico-materiaal wordt aangeboden.

      2 [De artikelen 9, eerste lid][ref1], [14][ref2] en [17, tweede en vierde lid][ref3], zijn ten aanzien van de in
      [de eerste volzin][ref4] bedoelde inrichtingen van overeenkomstige toepassing.

      3 De inrichtingen, bedoeld in het eerste lid, beschikken over passende bedrijfsruimten, voorbewerkingsinstallaties
      of -toestellen en gereedschap, alsmede over handenwasgelegenheid en passende voorzieningen voor de afvoer van
      afvalwater. De bedrijfsruimten bevinden zich in goede staat van onderhoud en reinheid. Degene die een inrichting
      in stand houdt draagt ervoor zorg dat het personeel tijdens het proces van voorbewerking een zo groot mogelijke
      hygiëne in acht neemt.

      4 Het bestuur van het Produktschap voor Veevoeder stelt ten aanzien van de inrichtingen, bedoeld in het eerste lid,
      nadere regels met betrekking tot de onderwerpen, bedoeld in het derde lid en [artikel 17, tweede lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel9
