  - number: '14'
    text: |-
      De beheerder treft systematisch maatregelen ter wering van ongedierte, knaagdieren en insekten daaronder begrepen,
      en vogels in lokalen en op het open terrein van het bedrijf en neemt, indien zich daar ongedierte of vogels
      bevinden, maatregelen ter bestrijding daarvan.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel14
  - number: '15'
    text: |-
      1 De beheerder draagt ervoor zorg dat personen die in het onreine gedeelte werkzaam zijn, het reine gedeelte niet
      betreden zonder hun werkkleding te hebben verwisseld en hun schoeisel te hebben ontsmet.

      2 De beheerder draagt ervoor zorg dat toestellen en gereedschappen niet van het onreine naar het reine gedeelte
      worden gebracht.

      3 De beheerder draagt ervoor zorg dat het onreine gedeelte en de zich daarin bevindende voorwerpen en kolken elke
      dag na beëindiging van de werkzaamheden in dat gedeelte worden gereinigd en ontsmet. Hij draagt voorts ervoor zorg
      dat het overige gedeelte van het bedrijf wordt schoongehouden.

      4 Het afvalwater dat afkomstig is van het onreine gedeelte van het bedrijf wordt zodanig behandeld dat daarin geen
      ziektekiemen meer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel15
  - number: '16'
    text: |-
      1 Hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal wordt door de ondernemer opgehaald en naar het
      verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal vervoerd uiterlijk op de
      eerste werkdag volgend op die waarop het door de eigenaar of houder daarvan is aangemeld, tenzij het hoog-risico-
      materiaal of gespecificeerd hoog-risico-materiaal betreft dat overeenkomstig door Onze Minister gestelde regels op
      gezette tijden door de ondernemer wordt opgehaald. Voor de toepassing van de eerste volzin wordt de zaterdag niet
      als werkdag aangemerkt.

      2 Het eerste lid is niet van toepassing op het ophalen en vervoeren van dode honden en katten.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel16
  - number: '17'
    text: |-
      1 Hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal wordt zo spoedig mogelijk na aankomst in het
      verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal verwerkt. Tot het tijdstip
      van verwerking wordt het materiaal op een aan de aard van het desbetreffende materiaal aangepaste wijze opgeslagen.

      2 Laag-risico-materiaal dat wordt aangevoerd in een bedrijf, wordt onmiddellijk na aankomst verwerkt dan wel
      zodanig opgeslagen dat het op het moment van verwerking daarvoor nog geschikt is.

      3 De in een verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal verkregen huiden
      worden gezouten met natriumchloride.

      4 In de ruimte van een bedrijf waarin het verwerken van destructiemateriaal plaatsvindt, is geen vlees aanwezig dat
      bestemd is voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel17
  - number: 17a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het merken en etiketteren van destructiemateriaal
      door een bedrijf.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel17a
  - number: '18'
    text: |-
      1 Hoog-risico-materiaal en door Onze Minister aangewezen categorieën van laag-risico-materiaal worden in afgesloten
      verwerkingsinstallaties door warmtebehandeling onschadelijk gemaakt.

      2 Indien gespecificeerd hoog-risico-materiaal met inachtneming van [artikel 3, derde lid][ref1], van de wet wordt
      voorbewerkt door middel van warmtebehandeling is het eerste lid van overeenkomstige toepassing.

      3 Bij ministeriële regeling:

      a. worden nadere regels gesteld met betrekking tot de warmtebehandeling bedoeld in het eerste en tweede lid;

      b. kunnen nadere regels worden gesteld omtrent de wijze waarop bloed wordt verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel3
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '3'
        paragraaf: '2'
  - number: '19'
    text: |-
      De beheerder draagt ervoor zorg dat de installaties en toestellen van het bedrijf in goede staat zijn en blijven.
      De meetapparatuur van de verwerkingsinstallaties moet regelmatig worden geijkt.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel19
  - number: '20'
    text: |-
      1 De beheerder controleert de kritische punten van het produktieproces in zijn bedrijf en maakt aantekeningen van
      zijn bevindingen. De aantekeningen worden ten minste twee jaren bewaard.

      2 De beheerder beschikt over een systeem dat het mogelijk maakt een verband te leggen tussen een verzonden partij
      met eindprodukten en het tijdstip waarop die partij is geproduceerd.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel20
  - number: '21'
    text: |-
      1 Degene die een verwerkingsbedrijf in stand houdt dat laag-risico-materiaal gebruikt voor de bereiding van
      voeder voor gezelschapsdieren of technische of farmaceutische produkten, draagt ervoor zorg dat niet meer voor de
      produktie te gebruiken materiaal aan een verwerkingsbedrijf voor hoog-risico-materiaal wordt aangeboden.

      2 [De artikelen 9, eerste lid][ref1], [14][ref2] en [17, tweede en vierde lid][ref3], zijn ten aanzien
      van verwerkingsbedrijven als bedoeld in het eerste lid, van overeenkomstige toepassing. Ten aanzien van
      verwerkingsbedrijven die laag-risico-materiaal gebruiken voor de bereiding van technische of farmaceutische
      produkten zijn bovendien [de artikelen 4][ref4], [12, tweede lid][ref5], en [15, derde lid, tweede volzin][ref6],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007837#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007837#Artikel17
