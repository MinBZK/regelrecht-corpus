      1 Ten behoeve van de vaststelling van de schadeloosstellingen en de bedragen, bedoeld in [de artikelen 31][ref1] en
      [32][ref2], verstrekt de ondernemer aan Onze Minister alle door deze verlangde gegevens.

      2 De ondernemer staat inzage van boeken en bescheiden door of vanwege Onze Minister toe.


