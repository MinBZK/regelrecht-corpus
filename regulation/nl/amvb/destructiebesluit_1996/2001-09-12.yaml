  - number: '34'
    text: |-
      1 De vergoeding, bedoeld in [artikel 14][ref1] van de wet, bedraagt negentig percent van de netto-opbrengst van de
      huid, na aftrek van de omzetbelasting.

      2 Vergoeding vindt niet plaats:

      a. indien ingevolge een wettelijk voorschrift de huid moet worden gedestrueerd;

      b. voor de huiden van kleine dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel14
