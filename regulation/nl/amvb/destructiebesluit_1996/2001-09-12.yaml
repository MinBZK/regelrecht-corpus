preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 24 januari 1995, kenmerk DGVgz/VVP/V-
    942717, mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op richtlijn nr. 90/667/EEG van de Raad van de Europese Gemeenschappen van 27 november 1990 betreffende de
    vaststelling van gezondheidsvoorschriften voor de verwijdering en verwerking van dierlijke afvallen, voor het in de
    handel brengen van dierlijke afvallen en ter voorkoming van de aanwezigheid van ziekteverwekkers in diervoeders van
    dierlijke oorsprong (vissen daaronder begrepen) en tot wijziging van richtlijn nr. 90/445/EEG (PbEG L 363), alsmede
    op de artikelen 9, eerste lid, 10, zesde lid, 13, derde lid, en 14 van de Destructiewet;

    Gezien het advies van de Destructieraad van 28 november 1994, kenmerk DR/U-94019;

    De Raad van State gehoord (advies van 15 mei 1995, no. W13.95.0031);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 22 december 1995, DGVgz/
    VVP/V952705, uitgebracht mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      a. wet: de [Destructiewet][ref1];

      b. bedrijf: een verwerkingsbedrijf voor hoog-risico-materiaal, een verwerkingsbedrijf voor gespecificeerd hoog-
      risico-materiaal of een verwerkingsbedrijf waarin laag-risico-materiaal tot ingrediënten van diervoeder of vismeel
      wordt verwerkt;

      c. beheerder: de natuurlijke persoon of de rechtspersoon die een bedrijf in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002244
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002244
  - number: '2'
    text: |-
      1 Het terrein van het bedrijf is op passende wijze gescheiden van de openbare weg. Voor onbevoegden is het
      bedrijfsterrein niet vrij toegankelijk. Dieren worden niet toegelaten op het terrein.

      2 Het is verboden op het terrein van een verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-
      risico-materiaal een slachterij te hebben.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel2
  - number: '3'
    text: |-
      1 Het bedrijf omvat een rein en een onrein gedeelte, die op passende wijze gescheiden zijn.

      2 Het onreine gedeelte heeft een overdekte ruimte voor het in ontvangst nemen van het destructiemateriaal.

      3 Indien op het bedrijf zowel hoog-risico-materiaal als gespecificeerd hoog-risico-materiaal wordt verwerkt, is het
      gedeelte waar het gespecificeerd hoog-risico-materiaal wordt verwerkt volledig gescheiden van het gedeelte waar het
      hoog-risico-materiaal wordt verwerkt.

      4 In een bijzonder geval kan Onze Minister op verzoek aan een verwerkingsbedrijf voor gespecificeerd hoog-risico-
      materiaal ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel3
  - number: '4'
    text: |-
      1 Het gedeelte van het bedrijf waarin het destructiemateriaal wordt ontvangen, bewaard en voorbewerkt, is
      gescheiden van het gedeelte waarin het materiaal wordt verwerkt en de eindprodukten van de verwerking worden
      opgeslagen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bewaren van destructiemateriaal.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel4
  - number: '5'
    text: |-
      1 De ruimten in het onreine gedeelte zijn ten minste voorzien van:

      a. vloeren van ondoordringbaar, gemakkelijk te reinigen en te ontsmetten materiaal, die niet kunnen rotten en
      zo zijn aangelegd dat het water gemakkelijk kan wegvloeien naar met een rooster bedekte en van stankafsluiting
      voorziene kolken, vanwaar het wordt afgevoerd;

      b. gladde, duurzame en ondoordringbare wanden, die van een heldere en afwasbare bekleding zijn voorzien tot een
      hoogte van ten minste 2,5 meter;

      c. een behoorlijke ventilatie.

      2 De overgang van de vloer van het onreine gedeelte naar de wanden en van de wanden onderling is rond.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel5
  - number: '6'
    text: |-
      De vloeren in het reine gedeelte zijn vervaardigd van ondoordringbaar, gemakkelijk te reinigen en te ontsmetten
      materiaal.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel6
  - number: '7'
    text: |-
      1 In of in de onmiddellijke omgeving van het onreine gedeelte is een handenwasgelegenheid aanwezig,
      voorzien van zeep en een ontsmettingsmiddel dat voor dat doel is toegelaten op grond van de
      [Bestrijdingsmiddelenwet 1962][ref1].

      2 Bij de uitgang van het onreine gedeelte bevinden zich voorzieningen voor de ontsmetting van
      voetbedekking, die een ontsmettingsmiddel bevatten dat voor dat doel is toegelaten op grond van de
      [Bestrijdingsmiddelenwet 1962][ref2].

      3 Het bedrijf beschikt over toiletten en over een kleedruimte met was- en douchegelegenheid voor het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0002380
  - number: '8'
    text: |-
      1 Indien het onthuiden of ontharen van dieren tot de activiteiten van het bedrijf behoort, zijn in het onreine
      gedeelte daarvoor geschikte voorzieningen aanwezig alsmede een opslagruimte voor huiden.

      2 Indien het verkleinen van destructiemateriaal tot de activiteiten van het bedrijf behoort, is in het onreine
      gedeelte een voorziening aanwezig waarmee de kleingemaakte delen in de verwerkingsinstallatie kunnen worden
      geladen.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel8
  - number: '9'
    text: |-
      1 Het bedrijf beschikt over voorzieningen voor de reiniging en ontsmetting van de recipiënten en containers waarin
      en de vervoermiddelen waarmee het destructiemateriaal wordt vervoerd, schepen daaronder niet begrepen.

      2 Het verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal beschikt bovendien
      over voorzieningen om de wielen van de vervoermiddelen die het onreine gedeelte verlaten vlak voor vertrek te
      ontsmetten.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel9
  - number: '10'
    text: |-
      1 Het bedrijf beschikt over een installatie die het afvalwater op hygiënische wijze afvoert.

      2 Het bedrijf beschikt over voldoende energiebronnen voor het opwekken van de voor het verwerkingsproces benodigde
      hoeveelheid warm water en stoom.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel10
  - number: '11'
    text: |-
      Het bedrijf beschikt zelf over of kan gebruik maken van een laboratorium dat is uitgerust om de analyses uit te
      voeren die nodig zijn om te controleren of aan het bij of krachtens [artikel 18][ref1] bepaalde wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel18
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '18'
        paragraaf: '3'
  - number: '12'
    text: |-
      1 Een verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal beschikt over een
      verwerkingsinstallatie die is voorzien van:

      a. meetapparatuur om de temperatuur en de druk in de installatie te kunnen controleren;

      b. een toestel dat onafgebroken de meetresultaten registreert;

      c. een veiligheidssysteem dat tot doel heeft te voorkomen dat het te verwerken materiaal onvoldoende wordt
      verwarmd.

      2 Indien in een bedrijf laag-risico-materiaal wordt verwerkt door toepassing van een warmtebehandeling, is het
      eerste lid van overeenkomstige toepassing.

      3 In een bijzonder geval kan Onze Minister op verzoek aan een verwerkingsbedrijf voor gespecificeerd hoog-risico-
      materiaal ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel12
  - number: '13'
    text: |-
      1 In [dit artikel][ref1] wordt onder een overlaadstation verstaan een tot een verwerkingsbedrijf voor hoog-
      risico-materiaal of gespecificeerd hoog-risico-materiaal behorende, niet op zijn terrein gelegen inrichting die is
      bestemd voor het tijdelijk opslaan van hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal of voor andere
      handelingen die verband houden met het verdere vervoer van dat materiaal.

      2 [De artikelen 2][ref2], [3, tweede lid][ref3], [5][ref4], [7][ref5], [9][ref6] en [10, eerste lid][ref7], zijn
      ten aanzien van een overlaadstation van overeenkomstige toepassing.

      3 Het is verboden zonder toestemming van Onze Minister een overlaadstation voor een andere bestemming dan die,
      omschreven in het eerste lid, te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007837#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007837#Artikel3
