  - number: '31'
    text: |-
      1 De schadeloosstelling, bedoeld in [artikel 10, derde lid, onder ][ref1], van de wet, wordt vastgesteld op het
      door Onze Minister te bepalen bedrag van het werkelijke nadeel dat de ondernemer als gevolg van de wijziging van
      het gebied dan wel van de te verwerken categorieën hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal
      lijdt.

      2 Het te betalen bedrag, bedoeld in [artikel 10, derde lid, onder ][ref2], van de wet wordt vastgesteld op het door
      Onze Minister te bepalen bedrag van het werkelijke voordeel dat de ondernemer als gevolg van de wijziging van het
      gebied dan wel van de te verwerken categorieën hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal heeft.

      3 De betaling van de schadeloosstelling of van het bedrag geschiedt binnen zes maanden na de gebiedswijziging dan
      wel na de wijziging van de te verwerken categorieën hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007837#Artikel10
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel31
