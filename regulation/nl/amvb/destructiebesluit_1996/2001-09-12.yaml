  - number: '28'
    text: |-
      1 Bij regeling van Onze Minister worden regels vastgesteld met betrekking tot:

      a. de eisen waaraan de door verwerking van destructiemateriaal verkregen eindprodukten moeten voldoen;

      b. de monsterneming en het onderzoek van de eindprodukten door het bedrijf of het verwerkingsbedrijf, bedoeld in
      paragraaf 4, zelf en de registratie van de gegevens die het onderzoek heeft opgeleverd;

      c. de door de toezichthoudende ambtenaren wie de aangelegenheid uit hoofde van de hen toevertrouwde belangen
      aangaat, ten aanzien van de eindprodukten toe te passen controlemethoden en de medewerking van het bedrijf of het
      verwerkingsbedrijf, bedoeld [onder ][ref1], die daarbij is vereist.

      2 De eindprodukten worden zodanig behandeld en opgeslagen dat besmetting van buiten af wordt voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel28
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '28'
        paragraaf: '8'
  - number: '29'
    text: |-
      1 De beheerder, degene die een verwerkingsbedrijf als bedoeld in [paragraaf 4][ref1] in stand houdt, en degene die
      een inrichting als bedoeld in [paragraaf 5][ref2] in stand houdt, richten een register in waarin wordt aangetekend:

      a. de aard en de hoeveelheid van het aangevoerde destructiemateriaal alsmede de datum waarop het is verkregen en,
      indien het destructiemateriaal betreft dat uitsluitend wordt bewaard, tevens de datum waarop het wordt afgevoerd;

      b. de aard en de hoeveelheid van het be- of verwerkte materiaal dat wordt afgevoerd, alsmede de datum van afvoer.

      2 De beheerder richt daarnaast een register in waarin wordt aangetekend de identificatiecode die is voorgeschreven
      voor runderen ingevolge het [Besluit identificatie en registratie van dieren][ref3].

      3 De beheerder is verplicht binnen 3 werkdagen de identificatiecode, bedoeld in het tweede lid, te melden aan de
      dienst die is aangewezen krachtens het [Besluit identificatie en registratie van dieren][ref4].

      4 De aantekeningen in het register worden ten minste twee jaren bewaard.

      5 Bij ministeriële regeling kunnen nadere regels omtrent het register worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0007837#Paragraaf5
