  - number: '24'
    text: |-
      Ten aanzien van inrichtingen waarin laag-risico-materiaal wordt opgeslagen of wordt voorbewerkt anders dan
      tot voeder voor edelpelsdieren zijn [de artikelen 4][ref1], [5][ref2], [6][ref3], [9 eerste lid][ref4],
      [10, eerste lid][ref5], [14][ref6], [15, derde lid, tweede volzin][ref7], [17, tweede en vierde lid][ref8],
      en [19, eerste volzin][ref9], van overeenkomstige toepassing. In de werkruimten van de inrichtingen is een
      handenwasgelegenheid aanwezig, voorzien van zeep.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007837#Artikel5
