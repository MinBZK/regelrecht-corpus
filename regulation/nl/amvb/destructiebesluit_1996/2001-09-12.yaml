      [ref5]: https://wetten.overheid.nl/BWBR0007837#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0007837#Artikel15
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel21
