  - number: '25'
    text: |-
      1 Het vervoer van hoog-risico-materiaal en gespecificeerd hoog-risico-materiaal geschiedt in vervoermiddelen met
      een waterdichte laadruimte die op passende wijze is afgedekt, dan wel in op passende wijze afgesloten recipiënten.

      2 De vervoermiddelen van hoog-risico-materiaal en gespecificeerd hoog-risico-materiaal zijn zo ingericht dat
      verspreiding van smetstof bij het in- en uitladen en tijdens het vervoer wordt voorkomen.

      3 Gespecificeerd hoog-risico-materiaal wordt gescheiden van ander destructiemateriaal vervoerd.

      4 Laag-risico-materiaal wordt gescheiden van ander destructiemateriaal vervoerd.

      5 Het is verboden laag-risico-materiaal te vervoeren in vervoermiddelen waarvan de laadruimte niet waterdicht is en
      niet zodanig is afgesloten dat besmetting van buiten af wordt voorkomen.

      6 De vervoermiddelen worden telkens na lediging gereinigd en ontsmet.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel25
  - number: '26'
    text: |-
      1 Het is verboden destructiemateriaal te vervoeren zonder in het bezit te zijn van een gegevensdrager waarop de
      gegevens ter zake van de herkomst, de hoeveelheid, de aard en de bestemming van het materiaal zijn vastgelegd.

      2 Bij ministeriële regeling kunnen nadere regels betreffende de gegevensdrager worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel26
  - number: '27'
    text: |-
      1 Indien bij aangevoerd hoog-risico-materiaal of gespecificeerd hoog-risico-materiaal verschijnselen worden
      waargenomen van een besmettelijke ziekte waarop [hoofdstuk II][ref1], [afdeling 3, van de Gezondheids- en
      welzijnswet voor dieren](onbekend) geheel of gedeeltelijk van toepassing is zonder dat de aanwezigheid van deze
      ziekte bekend was, wordt het desbetreffende materiaal zodanig bewaard dat het volledig is afgezonderd van ander
      destructiemateriaal en dat onderzoek naar behoren kan plaatsvinden. Indien bij aangevoerd hoog-risico-materiaal of
      gespecificeerd hoog-risico-materiaal de aanwezigheid van miltvuur wordt vermoed, blijft al het in de desbetreffende
      ruimte aanwezige destructiemateriaal ter plaatse tot de toezichthoudende ambtenaar wie de aangelegenheid uit
      hoofde van de hem toevertrouwde belangen aangaat en aan wie door de ondernemer op de snelste wijze bericht van het
      vermoeden wordt gezonden, nadere aanwijzingen ter zake heeft gegeven.

      2 Dode slachtdieren, gestorven aan of verdacht van miltvuur, die worden aangevoerd in een voor de
      onschadelijkmaking van deze dieren bestemd verwerkingsbedrijf voor hoog-risico-materiaal of gespecificeerd hoog-
      risico-materiaal, worden in hun geheel onschadelijk gemaakt in een ketel die zo is afgescheiden van de omgeving dat
      de vloer binnen de afscheiding afzonderlijk kan worden ontsmet. Het is verboden het overeenkomstig de eerste volzin
      onschadelijk gemaakte destructiemateriaal af te leveren voor voederdoeleinden.

      3 Het is verboden met vervoermiddelen waarmee erven en boerderijen zijn bezocht die door het plaatsen van een
      kenteken als bedoeld in [artikel 22, eerste lid, onder ][ref2], besmet of van besmetting verdacht zijn verklaard,
      erven en boerderijen waarop zodanig kenteken niet is geplaatst te bezoeken, tenzij na voorafgaande reiniging en
      ontsmetting.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel22
    url: https://wetten.overheid.nl/BWBR0007837/2001-09-12#Artikel27
