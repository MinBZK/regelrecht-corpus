  - number: '30'
    text: |-
      1 [Artikel 13, derde lid, van de wet][ref1] is van toepassing ten aanzien van dode honden en katten die:

      a. hetzij worden begraven op een terrein dat ter beschikking staat van de eigenaar of houder van de desbetreffende
      dode honden of katten, dan wel op een plaats die ingevolge een besluit van het gemeentebestuur voor dit doel is
      toegelaten;

      b. hetzij volledig worden verast in een crematorium.

      2 [Artikel 13, derde lid, van de wet][ref2] is van toepassing ten aanzien van dode paarden die volledig worden
      verast in een crematorium.

      3 [De artikelen 4, eerste lid][ref3], [5][ref4], [7, eerste en derde lid][ref5], [8, tweede lid][ref6],
      [9, eerste lid][ref7], en [10, eerste lid][ref8], zijn van overeenkomstige toepassing ten aanzien van de inrichting
      van een crematorium voor dode paarden.

      4 Dode paarden worden door de beheerder van een crematorium voor dode paarden opgehaald en naar het crematorium
      vervoerd uiterlijk op de eerste werkdag volgend op die waarop het door de eigenaar of houder daarvan is aangemeld,
      waarbij de zaterdag niet als werkdag wordt aangemerkt.

      5 [De artikelen 25, eerste, tweede en zesde lid][ref9], en [26, eerste lid][ref10], zijn van overeenkomstige
      toepassing ten aanzien van het vervoer van dode paarden naar een crematorium.


