  - number: '11'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de betrokkene, aan wie een suppletie is toegekend, wordt een bedrag
      uitgekeerd, gelijk aan de berekeningsgrondslag van de suppletie van betrokkene over een tijdvak van drie maanden.

      2 Het in het eerste lid bedoelde bedrag wordt uitgekeerd:

      a. aan de langstlevende der echtgenoten indien de overledene niet duurzaam van de andere echtgenoot gescheiden
      leefde;

      b. bij ontstentenis van de onder *a* bedoelde persoon aan de minderjarige wettige of natuurlijke kinderen;

      c. bij ontstentenis van de onder *a* en *b* bedoelde personen aan degenen ten aanzien van wie de overledene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.

      3 Voor de toepassing van het tweede lid kan tegelijkertijd slechts één persoon als echtgenoot worden aangemerkt en
      worden mede als echtgenoot aangemerkt niet gehuwde personen van verschillend of gelijk geslacht die duurzaam een
      gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste of tweede
      graad bestaat, alsmede de geregistreerde partner.

      4 Van een gezamenlijke huishouding als bedoeld in het derde lid, kan slechts sprake zijn indien twee ongehuwde
      personen gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in de kosten van de
      huishouding danwel op andere wijze in elkaars verzorging voorzien.

      5 Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van de betrokkene ter zake van diens overlijden aanspraak kunnen maken uit
      hoofde van een of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de
      [Ziektewet][ref1] danwel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop
      betrokkene recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '12'
    text: |-
      1 Op aanvraag wordt vastgesteld of er recht op suppletie bestaat.

      2 Een aanvraag wordt ingediend door middel van een daartoe beschikbaar gesteld aanvraagformulier.

      3 De suppletie wordt zo spoedig mogelijk uitbetaald, doch uiterlijk binnen een maand nadat het recht op die
      suppletie is vastgesteld. De suppletie wordt per maand achteraf uitbetaald.

      4 De suppletie die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. In bijzondere gevallen kan ten gunste van betrokkene worden afgeweken
      van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel12
  - number: '13'
    text: |-
      1 Ambtshalve kan een naar redelijkheid vast te stellen voorschot op een suppletie worden betaald indien uitsluitend
      onzekerheid bestaat omtrent de hoogte van de suppletie, omtrent het van de suppletie aan de betrokkene te betalen
      bedrag of omtrent het nakomen van een verplichting als bedoeld in [artikel 3][ref1].

      2 Op aanvraag van de betrokkene kan een naar redelijkheid vast te stellen voorschot op een suppletie worden betaald
      indien onzekerheid bestaat omtrent het recht op suppletie.

      3 Een voorschot, bedoeld in het eerste en tweede lid, wordt beschouwd als een suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0007758#Artikel3
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007758
        artikel: '3'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Onze Minister kan regels stellen op grond waarvan in bij die regels aan te geven gevallen en met inachtneming
      van bij die regels te stellen beperkingen de betrokkene bevoegd is deel te nemen aan een opleiding of scholing
      in dagonderwijs.

      2 Indien de betrokkene die recht heeft op suppletie gaat deelnemen aan een voor hem noodzakelijke opleiding of
      scholing, blijft volgens door Onze Minister te stellen regels het recht op suppletie bestaan totdat die opleiding
      of scholing is geëindigd.

      3 In de regels, bedoeld in het tweede lid, worden in ieder geval voorschriften en beperkingen gegeven met
      betrekking tot de aard, de omvang en de duur van de in het tweede lid bedoelde opleiding of scholing.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel14
  - number: '15'
    text: |-
      1 De betrokkene die onbeloonde activiteiten verricht, is verplicht daarvan mededeling te doen.

      2 De betrokkene heeft voor het verrichten van bijzondere vormen van onbeloonde activiteiten voorafgaande
      toestemming nodig.

      3 Onze Minister kan nadere regels stellen ten aanzien van de in het tweede lid bedoelde toestemming.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel15
  - number: '16'
    text: |-
      Bij ministeriële regeling worden nadere regels vastgesteld met betrekking tot:

      a. een doelmatige controle ten aanzien van de betrokkenen;

      b. het genieten van vakantie tijdens de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel16
  - number: '19'
    text: |-
      Indien het niveau van de WAO-uitkering als bedoeld in paragraaf 9 van de [Wet privatisering ABP][ref1] een
      algemene neerwaartse wijziging ondergaat, wordt deze neerwaartse wijziging, behoudens indien sociale partners
      anders overeenkomen binnen zes maanden na de datum van het *Staatsblad* waarin de maatregel is gepubliceerd, op
      overeenkomstige wijze ten aanzien van de suppletie doorgevoerd, vanaf de in het *Staatsblad* vermelde datum van
      inwerkingtreding van bedoelde maatregel, doch niet eerder dan zes maanden na de datum van het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: 19a
    text: |-
      Ten aanzien van de betrokkene wiens tijdstip van ingang van zijn ontslag is gelegen in de periode vóór 1 januari
      2006 zijn de bepalingen uit de Suppletieregeling gedeeltelijke arbeidsongeschikten sector Rijk van toepassing zoals
      deze luidden op de dag vóór 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel19a
  - number: '20'
    text: Onze Minister is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel20
  - number: 20a
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, kan Onze
      Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel20a
  - number: '21'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996. Indien het *Staatsblad* waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 1995, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad* waarin het wordt geplaatst en werkt het terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk.'
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel22
