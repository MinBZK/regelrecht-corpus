  - number: '8'
    text: |-
      1 Indien de betrokkene gedurende de periode dat recht bestaat op suppletie, ter zake van de dienstbetrekking
      waaruit dat recht op suppletie is ontstaan, een ZW-uitkering, een werkloosheidsuitkering danwel een
      arbeidsongeschiktheidsuitkering ontvangt, wordt het bedrag van genoemde uitkering of uitkeringen in
      mindering gebracht op het bedrag van de suppletie. Indien de bedoelde betrokkene uit hoofde van twee of meer
      dienstbetrekkingen als overheidswerknemer recht heeft op een WAO-uitkering, wordt die uitkering voor de toepassing
      van de eerste volzin toegerekend aan de dienstbetrekking ter zake waarvan hem recht op suppletie is toegekend, naar
      rato van de feitelijk genoten inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.

      2 Indien de betrokkene recht heeft op een arbeidsongeschiktheidsuitkering die kan worden toegerekend aan
      een dienstbetrekking, waaruit hij is ontslagen op een datum, gelegen vóór de datum van ontslag uit de
      dienstbetrekking ter zake waarvan hem recht op suppletie is toegekend, welk recht voortduurt na laatstgenoemde
      datum, wordt, ingeval van een verhoging van de mate van de arbeidsongeschiktheid waardoor het bedrag
      van die arbeidsongeschiktheidsuitkering verhoogd wordt, uitsluitend het bedrag van die verhoging van die
      arbeidsongeschiktheidsuitkering in mindering gebracht op het bedrag van de suppletie. Indien de bedoelde betrokkene
      uit hoofde van twee of meer dienstbetrekkingen als overheidswerknemer recht heeft op een WAO-uitkering, wordt die
      uitkering voor de toepassing van de vorige volzin toegerekend aan de in die volzin eerstgenoemde dienstbetrekking,
      naar rato van de feitelijk genoten inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.

      3 Indien de toerekeningswijze, bedoeld in het tweede lid, in een individueel geval leidt tot een kennelijk
      onredelijke uitkomst voor de betrokkene, kan ten gunste van die betrokkene tot een wijze van toerekenen worden
      besloten die met de strekking van dit artikel overeenkomt.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel8
  - number: '9'
    text: |-
      1 Indien betrokkene gedurende de periode dat recht bestaat op suppletie inkomsten verwerft uit of in verband
      met arbeid of bedrijf, anders dan bedoeld in [artikel 8][ref1], wordt de berekeningsgrondslag van de suppletie
      verminderd met de inkomsten uit of in verband met arbeid of bedrijf.

      2 Onder inkomsten uit of in verband met arbeid of bedrijf, bedoeld in het eerste lid, worden begrepen inkomsten uit
      of in verband met arbeid of bedrijf die zijn ontstaan:

      a. met ingang van of na de dag waarop het ontslag ter zake waarvan de betrokkene suppletie is toegekend, hem is
      aangezegd;

      b. gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het ontslag ter zake waarvan de
      betrokkene suppletie is toegekend;

      c. vóór de dag van het ontslag ter zake waarvan de betrokkene suppletie is toegekend, anders dan bedoeld in
      onderdeel *a* en *b*, en [artikel 8, tweede lid][ref2], voor zover uit deze arbeid of dit bedrijf na die dag
      inkomsten of meer inkomsten worden genoten door de betrokkene, terwijl die inkomsten of die meerdere inkomsten of
      een gedeelte daarvan, het gevolg zijn van een verhoogde werkzaamheid danwel verband houden met het ontslag.

      3 In bijzondere gevallen kan het bevoegd gezag ten gunste van betrokkene afwijken van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007758#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007758#Artikel8
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel9
