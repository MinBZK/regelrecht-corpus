  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 31 juli 1995, nr. AD95/U733, directoraat-generaal
    Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst, afdeling Arbeidsvoorwaarden en Sociaal
    Beleid;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet;

    De Raad van State gehoord (advies van 13 november 1995, kenmerk W04.95.0424);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 12 december 1995, nr. AD95/1162, directoraat-
    generaal Management en Personeelsbeleid, directie Personeelsmanagement Rijksdienst, afdeling Arbeidsvoorwaarden en
    Sociaal Beleid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van
      [artikel 18, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1];

      c. arbeidsongeschiktheidsuitkering: een periodieke uitkering, toegekend op grond van arbeidsongeschiktheid, die
      voortvloeit uit enig dienstverband van betrokkene;

      d. WAO-uitkering: uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2];

      e. betrokkene: de overheidswerknemer, bedoeld in [artikel 2 van de Wet privatisering ABP][ref3]:

      1°. in vaste dienst;

      2°. aan wie ontslag is verleend op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte als bedoeld in [artikel 98, eerste lid, onder f, van het Algemeen Rijksambtenarenreglement][ref4],
      in [artikel 129, eerste lid, onder f, van het Ambtenarenreglement Staten-Generaal][ref5], of in
      [artikel 101, eerste lid, onder e, van het Reglement Dienst Buitenlandse Zaken][ref6];

      3°. die ten tijde van dat ontslag minder dan 80% arbeidsongeschikt is; en

      4°. die uit dat ontslag werkloos is geworden in de zin van de [Werkloosheidswet][ref7].

      f. suppletie: de suppletie, bedoeld in [artikel 6][ref8];

      g. dagloon: het dagloon in de zin van [artikel 14 van de Wet op de arbeidsongeschiktheidsverzekering][ref9] en
      [artikel 13 van de Wet werk en inkomen naar arbeidsvermogen][ref10] zonder toepassing van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref11] met betrekking tot een loontijdvak
      van een dag, vermeerderd met het bedrag aan pensioenbijdrageverhaal op grond van de overeenkomst naar burgerlijk
      recht, bedoeld in [artikel 4 van de Wet privatisering ABP][ref12], waarin de aanspraken van overheidswerknemers in
      de zin van die wet, gewezen overheidswerknemers en hun nagelaten betrekkingen ter zake van pensioenen, alsmede hun
      daarmee samenhangende verplichtingen, zijn neergelegd;

      h. berekeningsgrondslag van de suppletie: het dagloon van betrokkene op de dag voorafgaande aan het ontslag
      ter zake waarvan hem recht op suppletie wordt toegekend, voor zover dat betrekking heeft op het inkomen uit de
      betrekking waaraan het recht op suppletie wordt ontleend;

      i. werkloosheidsuitkering: een periodieke uitkering ter zake van ontslag of werkloosheid, die voortvloeit uit enig
      dienstverband van betrokkene;

      j. ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref13].

      2 Indien op het salaris van de betrokkene op de dag voorafgaande aan het ontslag ter zake waarvan hem recht op
      suppletie wordt toegekend een inhouding werd toegepast op grond van [artikel 21a, vijfde lid][ref14], dan wel
      [artikel 57b, eerste lid, van het Algemeen Rijksambtenarenreglement][ref15], wordt voor het dagloon, bedoeld in het
      eerste lid, onderdeel g, uitgegaan van het dagloon zoals dat zou zijn vastgesteld indien geen sprake was geweest
      van bedoelde inhouding.


