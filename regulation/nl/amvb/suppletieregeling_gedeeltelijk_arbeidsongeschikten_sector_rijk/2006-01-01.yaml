    text: |-
      1 Betrokkene heeft recht op suppletie vanaf het tijdstip dat aan hem ontslag is verleend op grond van
      ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte.

      2 Het eerste lid is niet van toepassing indien het in dat lid bedoelde ontslag wordt verleend na het moment dat
      de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte 90 maanden onafgebroken heeft geduurd. Voor
      het bepalen van genoemde periode van 90 maanden worden perioden van ziekte samengeteld indien die elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Het verplichtingen- en sanctieregime van de [Werkloosheidswet][ref1] is van overeenkomstige toepassing op het
      recht op suppletie.

      2 Onverminderd het eerste lid omvat passende arbeid in de zin van de [Werkloosheidswet][ref2] voor de toepassing
      op de suppletie mede gangbare arbeid. Hierbij is onder gangbare arbeid verstaan: alle algemeen geaccepteerde arbeid
      waartoe de betrokkene met zijn krachten en bekwaamheden in staat is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '4'
    text: |-
      Het recht op suppletie komt niet tot uitbetaling voor zolang:

      a. betrokkene een WAO-uitkering ontvangt, berekend naar een mate van arbeidsongeschiktheid van 80% of meer;

      b. betrokkene is herplaatst in een functie waaraan hij recht kan ontlenen op herplaatsingstoelage als bedoeld in
      paragraaf 9 van het pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel4
  - number: '5'
    text: |-
      Het recht op suppletie eindigt:

      a. na ommekomst van de duur van de suppletie;

      b. met ingang van de dag volgende op die waarop de betrokkene is overleden;

      c. met ingang van de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel5
  - number: '6'
    text: |-
      1 De suppletie bedraagt gedurende 66 maanden 70% van het voor betrokkene geldende dagloon.

      2 De berekeningsgrondslag van de suppletie wordt in voorkomende gevallen gewijzigd overeenkomstig een algemene
      salariswijziging.
    url: https://wetten.overheid.nl/BWBR0007758/2006-01-01#Artikel6
  - number: '7'
    text: |-
      1 In afwijking van [artikel 6, eerste lid][ref1], wordt, indien het in [artikel 2][ref2] bedoelde ontslag is
      verleend op een latere datum dan het moment waarop de ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte 24 maanden onafgebroken heeft geduurd, de in [artikel 6, eerste lid][ref3], genoemde periode verminderd
      met de periode die gelegen is tussen de ontslagdatum en het moment waarop genoemde ongeschiktheid 24 maanden
      onafgebroken heeft geduurd.

      2 Voor het bepalen van de in het eerste lid bedoelde periode van 24 maanden worden perioden van ziekte samengeteld
      indien die elkaar met een onderbreking van minder dan vier weken opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007758#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007758#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007758#Artikel6
