  - number: '29'
    text: |-
      1 Het is verboden vanaf een schip olie of oliehoudende mengsels als bedoeld in voorschrift 1 van Bijlage I van
      het Verdrag in zee te lozen, anders dan met inachtneming van de in die Bijlage gegeven voorschriften, met dien
      verstande dat:

      a. in het gebied van de Middellandse Zee, het gebied van de Oostzee, het gebied van de Zwarte Zee, het Golfgebied,
      de Noordwest-Europese wateren en de Zuidelijke Zuid-Afrikaanse wateren, bedoeld in voorschrift 1 van die Bijlage,
      en het Antarctisch gebied de voorschriften 15 en 34 van die Bijlage wat betreft lozingen in bijzondere gebieden van
      toepassing zijn;

      b. in de overige bijzondere gebieden, bedoeld in voorschrift 1 van die Bijlage, de voorschriften 15 en 34 van die
      Bijlage wat betreft lozingen buiten bijzondere gebieden van toepassing zijn, en in deze gebieden de voorschriften
      15 en 34 wat betreft lozingen in bijzondere gebieden van toepassing worden op een nader bij besluit van Onze
      Minister vast te stellen tijdstip, dat wordt bekendgemaakt in de Staatscourant;

      c. in afwijking van de onderdelen a en b, voor zover het de toepasselijkheid van voorschrift 15 van die Bijlage
      betreft, ten aanzien van schepen van minder dan 400 GT in alle gebieden met uitzondering van het Antarctisch gebied
      voorschrift 15, onderdeel C, van die Bijlage van toepassing is.

      2 Het is verboden vanaf een schip bestemd of gebruikt voor het vervoer van schadelijke vloeistoffen in bulk de
      volgende vloeistoffen in zee te lozen, anders dan met inachtneming van de in Bijlage II van het Verdrag gegeven
      voorschriften:

      a. schadelijke vloeistoffen, inclusief restanten daarvan, of ballastwater, waswater van tanks of andere mengsels
      die dergelijke stoffen bevatten;

      b. vloeistoffen die op grond van Bijlage II niet zijn gecategoriseerd, noch voorlopig ingedeeld of geëvalueerd, of
      ballastwater, waswater van tanks of andere mengsels die dergelijke restanten bevatten.

      Het lozen van lens- of ballastwater of andere restanten of mengsels die alleen stoffen bevatten aangeduid met OS in
      de kolom verontreinigingscategorie in Hoofdstuk 18 van de IBC-code is niet verboden.

      3 Het is verboden vanaf een schip schadelijke stoffen in verpakte vorm te lozen, anders dan met inachtneming van
      de Bijlage III van het Verdrag gegeven voorschriften. Dit verbod is ook van toepassing op lege, niet gereinigde
      verpakkingen die eerder zijn gebruikt voor het vervoer van schadelijke stoffen in verpakte vorm, tenzij toereikende
      maatregelen zijn getroffen die verzekeren dat geen restanten zijn achtergebleven die schade kunnen toebrengen aan
      het mariene milieu.

      4 Het is verboden vanaf schepen als bedoeld in [artikel 5, vierde lid][ref1], sanitair afval in zee te lozen anders
      dan met inachtneming van de in Bijlage IV van het Verdrag gegeven voorschriften, met dien verstande dat:

      a. met betrekking tot een passagiersschip in de bijzondere gebieden, bedoeld in voorschrift 1 van die Bijlage,
      voorschrift 11 van die Bijlage wat betreft lozingen buiten bijzondere gebieden van toepassing is en

      b. met betrekking tot een passagiersschip in de onder a bedoelde gebieden voorschrift 11 van die Bijlage wat
      betreft lozingen in bijzondere gebieden van toepassing is met ingang van een nader bij besluit van Onze Minister
      vast te stellen tijdstip, dat wordt bekendgemaakt in de Staatscourant.

      5 Het is verboden vanaf een schip vuilnis als bedoeld in voorschrift 1 van Bijlage V van het Verdrag in zee te
      lozen, anders dan met inachtneming van de in die Bijlage gegeven voorschriften, met dien verstande dat:

      a. in het gebied van de Middellandse Zee, het gebied van de Oostzee, het Golfgebied, het gebied van de Noordzee en
      het Caribisch gebied, bedoeld in voorschrift 1 van die Bijlage, en in het Antarctisch gebied voorschrift 6 van die
      Bijlage van toepassing is;

      b. in de overige bijzondere gebieden, bedoeld in voorschrift 1 van die Bijlage, voorschrift 4 van die Bijlage van
      toepassing is, en in deze gebieden voorschrift 6 van die Bijlage van toepassing wordt op een nader bij besluit van
      Onze Minister vast te stellen tijdstip, dat wordt bekendgemaakt in de Staatscourant;

      c. in afwijking van de onderdelen a en b, ten aanzien van drijvende platforms en alle andere schepen langszij en
      binnen 500 meter van deze platforms voorschrift 5 van toepassing is.

      6 Voor de toepassing van de op grond van dit artikel toepasselijke voorschriften van het Verdrag wordt verstaan
      onder Administratie: Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel5
