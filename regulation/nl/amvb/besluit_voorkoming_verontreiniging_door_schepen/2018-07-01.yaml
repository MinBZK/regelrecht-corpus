  - number: '41'
    text: |-
      1 Onze Minister draagt zorg voor de bekendmaking van de op grond van dit besluit toepasselijke Codes.

      2 Van de wijze van bekendmaking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel41
  - number: '42'
    text: |-
      1 Een wijziging van de op grond van dit besluit toepasselijke verdragen en Codes gaat, tenzij bij besluit van Onze
      Minister anders is bepaald, voor de toepassing van dit besluit gelden met ingang van de dag waarop die wijziging
      internationaal in werking treedt.

      2 Voorzover een wijziging als bedoeld in het eerste lid slechts geldt ten aanzien van schepen gebouwd op of na een
      bepaalde datum, blijft, tenzij bij besluit van Onze Minister anders is bepaald, op schepen gebouwd voor die datum,
      het verdrag of de Code zoals dat, onderscheidenlijk die, voor de desbetreffende wijziging luidde, van toepassing,
      met inachtneming van hetgeen bij die wijziging, in het gewijzigde verdrag of in de gewijzigde Code is bepaald
      omtrent de bij herstellingen, verbouwingen en andere veranderingen in de toestand of uitrusting van een schip toe
      te passen voorschriften.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de reeds voor de inwerkingtreding van dit besluit
      in werking getreden wijzigingen van de in het eerste lid bedoelde verdragen en Codes.

      4 Een besluit van Onze Minister als bedoeld in het eerste of tweede lid wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel42
  - number: '43'
    text: |-
      1 Voor een schip, waarvoor op grond van het
      [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref1] een
      certificaat is afgegeven waarvan de geldigheid eindigt op 1 januari 2007 of later, geeft Onze Minister een
      certificaat als bedoeld in [artikel 12, tweede lid][ref2], af met een vervaldatum die gelijk is aan de vervaldatum
      van het op grond van voornoemd Besluit afgegeven certificaat.

      2 Voor schepen als bedoeld in [artikel 5, vierde lid, onderdelen c en d][ref3], worden de certificaten, bedoeld in
      [artikel 12, derde lid][ref4], afgegeven met ingang van 28 september 2008.

      3 Voor schepen van 400 GT of meer, gebouwd voor 19 mei 2005, worden de certificaten, bedoeld in
      [artikel 12, vierde lid][ref5], afgegeven uiterlijk bij de eerstvolgende, geplande droogzetting na inwerkingtreding
      van dit besluit, maar in geen geval later dan 19 mei 2008.

      4 Voor schepen die voldoen aan de eisen van Bijlage 1 van het AFS-verdrag voor de datum waarop die eisen in werking
      treden, worden de certificaten, bedoeld in [artikel 13][ref6], afgegeven uiterlijk twee jaar na de inwerkingtreding
      van die eisen.

      5 Het verbod, bedoeld in [artikel 29, vierde lid][ref7], geldt voor schepen als bedoeld in
      [artikel 5, vierde lid, onderdelen c en d][ref8], met ingang van 28 september 2008.

      6 Voor schepen, gebouwd voor 18 juli 1982, waarvan de bruto-inhoud is vastgesteld overeenkomstig het op 10 juni
      1947 te Oslo totstandgekomen Verdrag nopens een eenvormig stelsel voor de meting van zeeschepen (Stb. 1949, J 370;
      Trb. 1955, 52), wordt voor de toepassing van dit besluit de eenheid bruto-registerton gelijkgesteld met de eenheid
      GT.

      7 Voor een schip dat voorafgaand aan de datum waarop de norm van voorschrift D-2 van de bijlage bij het
      Ballastwaterverdrag voor het desbetreffende schip van toepassing wordt, een ballastwaterbeheersysteem in gebruik
      heeft genomen dat voldoet aan een bij ministeriële regeling vastgesteld programma voor het testen en beoordelen van
      technieken voor ballastwaterbehandeling, is de norm van voorschrift D-2 van de bijlage bij het Ballastwaterverdrag
      niet van toepassing gedurende een in de bij die ministeriële regeling vastgestelde periode.


