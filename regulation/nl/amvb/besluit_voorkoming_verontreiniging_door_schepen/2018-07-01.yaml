  - number: '16'
    text: |-
      1 Schepen worden ter verkrijging van een in [artikel 12, eerste tot en met vierde en zesde lid][ref1], genoemd
      certificaat en tijdens de geldigheidsduur van dat certificaat onderworpen aan de volgende in het Verdrag
      voorgeschreven onderzoeken:

      a. in verband met het Internationaal certificaat van voorkoming van verontreiniging door olie: de in Bijlage I van
      het Verdrag voorgeschreven onderzoeken;

      b. in verband met een certificaat als bedoeld in [artikel 12, tweede lid][ref2]: de in Bijlage II van het Verdrag
      voorgeschreven onderzoeken;

      c. in verband met het Internationaal certificaat van voorkoming van verontreiniging door sanitair afval: de in
      Bijlage IV van het Verdrag voorgeschreven onderzoeken;

      d. in verband met het Internationaal certificaat betreffende voorkoming van luchtverontreiniging: de in voorschrift
      5.1 van Bijlage VI van het Verdrag voorgeschreven onderzoeken;

      e. in verband met het Internationaal certificaat betreffende energie efficiëntie: de in voorschrift 5.4 van Bijlage
      VI van het Verdrag voorgeschreven onderzoeken.

      2 Ter verkrijging van een Internationaal certificaat betreffende voorkoming van luchtverontreiniging door
      motoren en tijdens de geldigheidsduur van dat certificaat wordt de motor waarop het certificaat betrekking heeft,
      onderworpen aan de in de NO-Code voorgeschreven onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel12
