preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 23 augustus 2006, nr. HDJZ/SCH/2006-1285,
    Hoofddirectie Juridische Zaken, gedaan mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer;

    Gelet op het op 2 november 1973 te Londen totstandgekomen Internationaal Verdrag ter voorkoming van
    verontreiniging door schepen (Trb. 1975, 147) met het op 17 februari 1978 te Londen totstandgekomen Protocol
    bij dat Verdrag (Trb. 1978, 188), op Bijlage IV van het op 4 oktober 1991 te Madrid totstandgekomen Protocol
    betreffende milieubescherming bij het Verdrag inzake Antarctica (Trb. 1992, 110), het op 5 oktober 2001 te Londen
    totstandgekomen Internationaal Verdrag inzake de beperking van schadelijke aangroeiwerende verfsystemen op schepen
    (Trb. 2004, 44), richtlijn nr. 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27
    november 2000 betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), richtlijn
    nr. 2005/33/EG van het Europees Parlement en de Raad van de Europese Unie van 6 juli 2005 tot wijziging van
    richtlijn 1999/32/EG wat het zwavelgehalte van scheepsbrandstoffen betreft (PbEU L 191), en de artikelen 1, 2, 4,
    5, 6, 7, 8, 8a, 9, 10, 11, 12c, 12e, 21, 23, en 38 van de Wet voorkoming verontreiniging door schepen;

    De Raad van State gehoord (advies van 12 oktober 2006, nr. W09.06.0362/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 5 december 2006, nr. HDJZ/SCH/2006-1806,
    Hoofddirectie Juridische Zaken, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet voorkoming verontreiniging door schepen][ref1];

      b. olietankschip: een olietankschip als bedoeld in voorschrift 1 van Bijlage I van het Verdrag;

      c. passagiersschip: schip als bedoeld in voorschrift 1 van Bijlage IV van het Verdrag.

      d. schadelijke vloeistof: een schadelijke vloeistof als bedoeld in voorschrift 1 van Bijlage II van het Verdrag;

      e. schadelijke stoffen in verpakte vorm: schadelijke stoffen als bedoeld in voorschrift 1 van Bijlage III van het
      Verdrag, in verpakte vorm als bedoeld in dat voorschrift, met uitzondering van schadelijke stoffen in verpakte
      vorm, bestemd voor eigen scheepsgebruik of behorend tot de eigen scheepsuitrusting;

      f. sanitair afval: sanitair afval als bedoeld in voorschrift 1 van Bijlage IV van het Verdrag met uitzondering van
      spoelwater afkomstig uit ruimten waar zich huisdieren bevinden;

      g. Antarctisch gebied: gebied ten zuiden van 60° zuiderbreedte;

      h. uitstoot: emissie als bedoeld in voorschrift 2 van Bijlage VI van het Verdrag;

      i. GT: de maateenheid bruto-tonnage waarin de totale inhoud van een schip, vastgesteld overeenkomstig het op 23
      juni 1969 te Londen totstandgekomen Verdrag betreffende de meting van schepen (Trb. 1970, 122), wordt uitgedrukt;

      j. lengte: de overeenkomstig het verdrag, genoemd in onderdeel h, vastgestelde lengte van een schip;

      k. internationale reis: een reis tussen twee verschillende landen, waarbij een gebied voor welks buitenlandse
      betrekkingen een buiten dat gebied zetelende regering verantwoordelijk is of waarvan de Verenigde Naties het
      besturend lichaam zijn, mede als een afzonderlijk land wordt aangemerkt;

      l. AFS-verdrag: het op 5 oktober 2001 te Londen totstandgekomen Internationaal Verdrag inzake de beperking van
      schadelijke aangroeiwerende verfsystemen op schepen (Trb. 2004, 44);

      m. IMO: de Internationale Maritieme Organisatie van de Verenigde Naties;

      n. Mariene Milieucommissie: de gelijknamige commissie van de IMO;

      o. BCH-Code: de bij resolutie MEPC.20(22) van de Mariene Milieucommissie aangenomen Code voor de bouw en uitrusting
      van schepen die gevaarlijke chemicaliën in bulk vervoeren (*Bulk Chemical Code*);

      p. IBC-Code: de bij resolutie MEPC.19(22) van de Mariene Milieucommissie aangenomen Internationale Code voor de
      bouw en uitrusting van schepen die gevaarlijke chemicaliën in bulk vervoeren (*International Bulk Chemical Code*);

      q. NO-Code: de Technische Code inzake de beheersing van de emissie van stikstofoxiden door scheepsdieselmotoren
      (*Technical Code on Control of Emission of Nitrogen Oxides from Marine Diesel Engines*, Trb. 2005, 30),
      aangenomen als bijlage bij resolutie 2 bij het Protocol van 1997 tot wijziging van het Verdrag ter voorkoming van
      verontreiniging door schepen, 1973, zoals gewijzigd bij het Protocol van 1978, met Bijlage (Trb. 1999, 169);

      q. *Ballastwaterverdrag:* het op 13 februari 2004 te Londen tot stand gekomen Internationaal Verdrag voor de
      controle en het beheer van ballastwater en sedimenten van schepen (Trb. 2005, 44);

      r. *ballastwater:* water dat aan boord genomen wordt teneinde de trim, helling, diepgang, stabiliteit van of
      krachten op het schip te beheersen;

      s. *Scheepsrecyclingsverdrag:* het op 15 mei 2009 te Hongkong tot stand gekomen Internationaal verdrag voor het
      veilig en milieuvriendelijk recyclen van schepen (Trb. 2010, 227 en 2017, 29).

      2 Voor de toepassing van de op grond van dit besluit toepasselijke verdragen en Codes wordt in dit besluit en de
      daarop berustende bepalingen, tenzij bij of krachtens dit besluit anders is bepaald, verstaan onder Administratie:
      Onze Minister.

      3 Voor de toepassing van dit besluit wordt met een internationale reis gelijkgesteld een trans-Atlantische reis
      tussen landen van het Koninkrijk of delen daarvan.

      4 Bij regeling van Onze Minister kan worden bepaald dat voor de toepassing van dit besluit ook reizen tussen landen
      van het Koninkrijk of delen daarvan binnen Caribisch Nederland met een internationale reis gelijk worden gesteld.


