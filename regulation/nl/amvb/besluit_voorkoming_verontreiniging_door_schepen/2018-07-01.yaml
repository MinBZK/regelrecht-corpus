  - number: '6'
    text: |-
      Aan boord van elk schip dat zich in het Antarctisch gebied bevindt zijn één of meer verzameltanks aanwezig met
      voldoende capaciteit voor het opslaan van sanitair afval.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel6
  - number: '7'
    text: |-
      1 Elk schip voldoet aan de op dat schip van toepassing zijnde eisen van Bijlage 1 van het AFS-verdrag.

      2 Elk schip met een lengte van 24 meter of meer, maar van minder dan 400 GT, dat internationale reizen maakt, is
      voorzien van een door de eigenaar of diens bevoegde agent ondertekende verklaring als bedoeld in voorschrift 5 van
      Bijlage 4 van het AFS-verdrag, die voldoet aan de daaraan in dat voorschrift gestelde eisen.

      3 Het tweede lid is niet van toepassing op drijvende platforms, drijvende opslageenheden en drijvende productie-,
      opslag-, en overslageenheden.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel7
  - number: 7a
    text: |-
      1 Elk schip dat internationale reizen maakt, voldoet aan de op dat schip van toepassing zijnde eisen van
      voorschrift B-3 en voorschrift B-5, lid 2, van de bijlage van het Ballastwaterverdrag, tenzij er sprake is van een
      uitzondering als bedoeld in voorschrift A-3 van de bijlage bij het Ballastwaterverdrag.

      2 Elk schip dat internationale reizen maakt, voldoet aan de op dat schip van toepassing zijnde eisen van
      voorschrift B-1 van de bijlage bij het Ballastwaterverdrag voor het hebben van een ballastwaterbeheerplan.

      3 De in het eerste en tweede lid bedoelde eisen gelden niet voor schepen die niet ontworpen of gebouwd zijn voor
      het vervoer van ballastwater en voor schepen die ballastwater vervoeren in permanent verzegelde tanks en dit
      ballastwater niet lozen.

      4 In afwijking van het eerste lid is voor een schip waarop een ballastwaterbeheersysteem in gebruik is dat
      voldoet aan een bij ministeriële regeling vastgesteld programma voor het testen en beoordelen van technieken voor
      ballastwaterbehandeling, de norm van voorschrift D-2 van de bijlage bij het Ballastwaterverdrag niet van toepassing
      gedurende een in de bij die ministeriële regeling vastgestelde periode.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel7a
  - number: '8'
    text: |-
      1 Bij regeling van Onze Minister kunnen eisen worden vastgesteld waaraan schepen in verband met een krachtens
      [artikel 15][ref1] vereist certificaat moeten voldoen.

      2 Bij regeling van Onze Minister kunnen voor schepen aanvullende eisen worden vastgesteld, alsmede nadere regels
      met betrekking tot de in de [artikelen 5 tot en met 7a][ref2], waarbij kan worden bepaald dat de eisen en regels
      alleen gelden in daarbij aangewezen gebieden bedoelde eisen.


