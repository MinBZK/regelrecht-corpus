    text: |-
      1 De kapitein van een schip dat een haven aandoet die is aangewezen krachtens
      [artikel 6, eerste lid, van de wet][ref1] voert een voorwas uit van zijn tank voor zover deze voorwas verplicht is
      ingevolge de in Bijlage II van het Verdrag gegeven voorschriften.

      2 Het voorwassen van ladingtanks geschiedt uitsluitend met inachtneming van de in Bijlage II van het Verdrag
      gegeven voorschriften.


