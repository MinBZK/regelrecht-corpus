  - number: '17'
    text: |-
      Ter verkrijging van een Internationaal certificaat betreffende het aangroeiwerende verfsysteem en tijdens
      de geldigheidsduur van dat certificaat wordt een schip onderworpen aan de in Bijlage 4 van het AFS-verdrag
      voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel17
  - number: 17a
    text: |-
      Ter verkrijging van een Internationaal ballastwaterbeheercertificaat en tijdens de geldigheidsduur van dat
      certificaat wordt een schip onderworpen aan de in voorschrift E-1 van de bijlage bij het Ballastwaterverdrag
      voorgeschreven onderzoeken.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel17a
  - number: '18'
    text: |-
      De in de [artikelen 16][ref1], [17][ref2] en [17a][ref3] bedoelde onderzoeken vinden plaats op de in de
      desbetreffende verdragen en Codes voorgeschreven tijdstippen, met dien verstande dat het hernieuwde onderzoek
      waaraan een schip in verband met de vernieuwing van een certificaat wordt onderworpen, steeds plaatsvindt in de
      laatste drie maanden van de geldigheidsduur van het desbetreffende certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0020762#Artikel17a
