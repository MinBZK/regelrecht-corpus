  - number: '45'
    text: |-
      De navolgende besluiten worden ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen van die besluiten en voor verschillende categorieën van schepen verschillend
      kan worden vastgesteld;

      a. het [Besluit aangroeiwerende verfsystemen zeeschepen][ref1];

      b. het [Besluit melding voorvallen van verontreiniging door schepen][ref2];

      c. het [Besluit sanitair afval zeeschepen][ref3];

      d. het [Besluit voorkoming olieverontreiniging door schepen][ref4];

      e. het [Besluit voorkoming verontreiniging door met schepen in bulk vervoerde schadelijke vloeistoffen][ref5];

      f. het [Besluit voorkoming verontreiniging door met schepen vervoerde schadelijke stoffen in verpakte vorm][ref6];

      g. het [Besluit voorkoming verontreiniging door vuilnis van schepen][ref7].


