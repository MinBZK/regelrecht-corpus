  - number: '23'
    text: |-
      1 De in [artikel 12][ref1] genoemde certificaten hebben een geldigheidsduur van vijf jaren, met uitzondering
      van het Internationaal certificaat betreffende voorkoming van luchtverontreiniging door motoren, dat geldig is
      gedurende de volledige levensduur van de motor.

      2 Het Internationaal certificaat betreffende energie efficiëntie en het Internationaal certificaat betreffende het
      aangroeiwerende verfsysteem zijn, behoudens het bepaalde in [artikel 9 van de wet][ref2], onbeperkt geldig.

      3 Het ballastwaterbeheercertificaat heeft een geldigheidsduur van vijf jaren.

      4 Onze Minister kan certificaten afgeven met een kortere geldigheidsduur dan in het eerste en het derde lid
      bepaald, indien nog niet alle onderzoeken naar zijn genoegen zijn voltooid, of indien hij nog niet over alle door
      hem gevraagde gegevens over het schip beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel9
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel23
    references:
      - id: ref1
