      1 Het is verboden vanaf een schip dat zich in het Antarctisch gebied bevindt, sanitair afval te lozen anders dan
      met inachtneming van de in Bijlage IV van het op 4 oktober 1991 te Madrid tot stand gekomen Protocol betreffende
      milieubescherming bij het Verdrag inzake Antarctica, met Bijlagen (Trb. 1992, 110) gegeven voorschriften, met
      dien verstande dat voor de toepassing van die voorschriften onder «lozingen in zee van onbehandeld sanitair afval»
      wordt verstaan «lozingen van sanitair afval die niet voldoen aan voorschrift 11.1.2 van Bijlage IV van het MARPOL-
      verdrag» en onder «personen» wordt verstaan «passagiers».

      2 Het is verboden vanaf een schip dat zich in het Antarctisch gebied bevindt, vuilnis als bedoeld in voorschrift
      1 van Bijlage V van het Verdrag te lozen anders dan met inachtneming van de in het eerste lid bedoelde Bijlage IV
      gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel30
  - number: '31'
    text: |-
      1 Het is verboden opzettelijk stoffen die de ozonlaag aantasten als bedoeld in voorschrift 2 van Bijlage VI van het
      Verdrag uit te stoten anders dan met inachtneming van de in die Bijlage gegeven voorschriften.

      2 Het is verboden om:

      a. aan boord van schepen brandstofolie te gebruiken die niet voldoet aan de eisen die daaraan in Bijlage VI van het
      Verdrag in het algemeen of ten aanzien van het gebruik in bepaalde zeegebieden worden gesteld;

      b. afval en andere stoffen als bedoeld in voorschrift 16 van Bijlage VI van het Verdrag aan boord van een schip te
      verbranden anders dan met inachtneming van de in die Bijlage gegeven voorschriften.

      3 Het eerste lid en het tweede lid, onderdeel b, zijn ook van toepassing op buitenlandse schepen gedurende de tijd
      dat deze zich bevinden op de Nederlandse binnenwateren.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel31
  - number: 31a
    text: |-
      1 Het is verboden met een schip ballastwater of sediment uit ballastwater in te nemen of te lozen, tenzij:

      a. deze inname of lozing in overeenstemming is met het bepaalde in de bijlage bij het Ballastwaterverdrag, de
      krachtens [artikel 8, tweede lid][ref1], gestelde voorschriften, of op grond van [artikel 9, tweede lid][ref2]
      toegestane afwijkingen van de bijlage bij het Ballastwaterverdrag;

      b. deze inname of lozing in overeenstemming is met de krachtens [artikel 38, tweede lid][ref3], gestelde
      voorschriften;

      c. deze inname of lozing plaatsvindt om ballastwater te wisselen in een krachtens [artikel 33a, tweede lid][ref4],
      aangewezen gebied, in overeenstemming met de krachtens dat artikel gestelde voorschriften; of

      d. voor het desbetreffende schip in overeenstemming met het Ballastwaterverdrag een vrijstellig of ontheffing is
      verleend als bedoeld in [artikel 35 van de wet][ref5].


