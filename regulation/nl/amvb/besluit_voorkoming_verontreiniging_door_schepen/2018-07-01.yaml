      2 Van een ontheffing als bedoeld in [artikel 35, tweede lid, van de wet][ref5], van de in [artikel 7a][ref6]
      bedoelde eisen wordt aantekening gemaakt in het ballastwaterjournaal van het desbetreffende schip.


