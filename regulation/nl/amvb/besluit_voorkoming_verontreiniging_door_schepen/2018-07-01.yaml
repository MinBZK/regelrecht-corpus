      1 De kapitein van een schip dat een haven aandoet die is aangewezen krachtens
      [artikel 6, eerste lid, van de wet][ref1] geeft restanten van schadelijke vloeistoffen af bij een
      havenontvangstvoorziening voorzover afgifte daarvan verplicht is ingevolge de in Bijlage II van het Verdrag gegeven
      voorschriften.

      2 De afgifte van restanten van schadelijke stoffen als bedoeld in [artikel 2, onderdeel a][ref2], en restanten van
      schadelijke vloeistoffen bij een houder van een havenontvangstvoorziening geschiedt uitsluitend met inachtneming
      van de in Bijlage I en II van het Verdrag gegeven voorschriften.

      3 Als stoffen of uitrusting die deze stoffen bevat als bedoeld in
      [artikel 12e, eerste lid, onderdeel a, van de wet][ref3] worden aangewezen stoffen die de ozonlaag aantasten als
      bedoeld in voorschrift 2 van Bijlage VI van het Verdrag en uitrusting die deze stoffen bevat.


