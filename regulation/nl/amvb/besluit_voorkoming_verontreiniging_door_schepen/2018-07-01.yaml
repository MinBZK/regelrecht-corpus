  - number: '26'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de geldigheidsduur van de
      certificaten en de verklaring, bedoeld in [artikel 15][ref1], en kunnen nadere regels worden gesteld met betrekking
      tot de geldigheidsduur van het in de [artikelen 12][ref2], [13][ref3] en [13a][ref4] bedoelde certificaat.


