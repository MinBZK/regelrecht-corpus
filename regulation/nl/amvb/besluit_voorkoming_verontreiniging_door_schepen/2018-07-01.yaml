  - number: '20'
    text: |-
      1 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot:

      a. de onderzoeken waaraan schepen in verband met een certificaat als bedoeld in
      [artikel 15, eerste of derde lid][ref1], worden onderworpen;

      b. de onderzoeken waaraan schepen worden onderworpen waarop de [artikelen 12][ref2], [13][ref3] en [13a][ref4] niet
      van toepassing zijn.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de onderzoeken waaraan
      schepen ter verkrijging van de certificaten, bedoeld in de [artikelen 16][ref5], [17][ref6] en [17a][ref7], en
      tijdens de geldigheidsduur daarvan worden onderworpen.


