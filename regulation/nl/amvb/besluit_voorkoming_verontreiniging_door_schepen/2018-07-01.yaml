        artikel: '33'
        hoofdstuk: '5'
  - number: '39'
    text: |-
      1 De beheerders van losplaatsen gelegen in havens, die krachtens [artikel 6, eerste lid, van de wet][ref1] zijn
      aangewezen, waar schepen schadelijke vloeistoffen lossen, treffen zodanige voorzieningen dat dergelijke schepen hun
      ladingtanks geheel kunnen leeglossen met inachtneming van de in Bijlage II van het Verdrag gegeven voorschriften en
      de krachtens [artikel 38][ref2] gegeven nadere regels met betrekking tot die voorschriften.

      2 Bij losplaatsen als bedoeld in het eerste lid worden voorzieningen getroffen om te voorkomen dat de inhoud van
      slangen of leidingen van de walinstallatie, welke gebruikt zijn voor het lossen van schadelijke vloeistoffen,
      terugstroomt in het schip.

      3 Indien naar het oordeel van de kapitein van een schip als bedoeld in het eerste lid, of zijn vertegenwoordiger,
      bij losplaatsen de voorzieningen, bedoeld in dit artikel, ontoereikend zijn, kan hij zulks melden aan de
      havenbeheerder. [Artikel 8, tweede tot en met vierde lid, van het Besluit havenontvangstvoorzieningen][ref3] is van
      overeenkomstige toepassing op de afwikkeling van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0017136#Artikel8
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel39
