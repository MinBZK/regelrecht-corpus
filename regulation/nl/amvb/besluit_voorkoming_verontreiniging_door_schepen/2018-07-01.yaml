        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '9'
  - number: '24'
    text: |-
      Na voltooiing van een hernieuwd onderzoek in verband met de vernieuwing van een certificaat is het nieuwe
      certificaat, in afwijking van [artikel 23][ref1], geldig vanaf de datum van voltooiing van het desbetreffende
      onderzoek tot een datum niet later dan vijf jaren na de vervaldatum van het bestaande certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel23
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020762
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '25'
    text: |-
      1 Indien een schip zich op het tijdstip waarop een certificaat zijn geldigheid verliest, niet in een haven bevindt
      waar een hernieuwd onderzoek kan plaatsvinden, kan Onze Minister de geldigheidsduur van het certificaat met ten
      hoogste drie maanden verlengen teneinde het schip in staat te stellen zijn reis naar de haven waar het zal worden
      onderzocht, te voltooien. Het schip verlaat die haven vervolgens niet zonder nieuw certificaat.

      2 Onze Minister kan de geldigheidsduur van een certificaat dat is afgegeven ten behoeve van een schip dat korte
      reizen maakt, met ten hoogste een maand verlengen.

      3 In een geval als bedoeld in het eerste of tweede lid wordt na de voltooiing van het hernieuwde onderzoek de
      geldigheidsduur van het nieuwe certificaat bepaald aan de hand van de oorspronkelijke vervaldatum van het bestaande
      certificaat.

      4 Indien na de voltooiing van een hernieuwd onderzoek het nieuwe certificaat niet voor de vervaldatum van het
      bestaande certificaat kan worden afgegeven of aan het schip kan worden verstrekt, kan degene die het onderzoek
      heeft uitgevoerd daarvan een aantekening plaatsen op het bestaande certificaat. In dat geval wordt het bestaande
      certificaat nog als geldig aangemerkt voor een tijdvak van ten hoogste vijf maanden na zijn vervaldatum.

      5 Onze Minister kan de geldigheidsduur van een certificaat, bedoeld in [artikel 23, vierde lid][ref1], verlengen
      tot een datum die is gelegen vijf jaren na de afgiftedatum van het certificaat, met dien verstande dat:

      a. de geldigheidsduur van een certificaat als bedoeld in [artikel 12, eerste, tweede en vierde lid][ref2], alleen
      kan worden verlengd na voltooiing van een tussentijds of jaarlijks onderzoek als bedoeld in Bijlage I, II en VI van
      het Verdrag; en

      b. de geldigheidsduur van een certificaat als bedoeld in [artikel 13a][ref3] alleen kan worden verlengd na
      voltooiing van een tussentijds onderzoek als bedoeld in de Bijlage bij het Ballastwaterverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020762#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0020762#Artikel13a
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel25
    references:
      - id: ref1
