    text: |-
      Een ingevolge [artikel 8, derde lid, van de wet][ref1], aangewezen natuurlijke persoon of rechtspersoon is, indien
      bij een onderzoek als bedoeld in de [artikelen 16][ref2], [17][ref3] en [17a][ref4] gebreken aan het schip of zijn
