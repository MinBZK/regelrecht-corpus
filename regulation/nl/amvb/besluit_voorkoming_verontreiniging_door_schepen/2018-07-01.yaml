    text: |-
      1 Indien een schip door zijn eigenaar wordt onttrokken aan zijn algemene bestemming als schip, vervallen de voor
      dat schip afgegeven certificaten.

      2 Indien een schip door zijn eigenaar wordt onttrokken aan een bijzondere bestemming die het had ten tijde van de
      afgifte van de voor dat schip benodigde certificaten, doch zijn algemene bestemming als schip behoudt, vervallen de
      in verband met die bijzondere bestemming afgegeven certificaten.

      3 Onze Minister kan een certificaat intrekken:

      1°. wanneer het schip schade van betekenis heeft opgelopen en de herstelling daarvan niet naar behoren is geschied,
      of

      2°. wanneer uit een onderzoek van de ambtenaar van de Inspectie Verkeer en Waterstaat is gebleken dat het schip
      niet zonder gevaar voor verontreiniging van het mariene milieu de haven kan verlaten.

      4 Een vervallen of ingetrokken certificaat wordt door de eigenaar zo spoedig mogelijk aan Onze Minister ingezonden
      door tussenkomst van ambtenaren van de Inspectie Verkeer en Waterstaat, de ambtenaren met de in- of uitklaring
      belast, dan wel de Nederlandse diplomatieke of consulaire ambtenaren.

      5 Voor een ingezonden certificaat wordt desverlangd een bewijs van ontvangst afgegeven.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel27
  - number: '28'
    text: |-
      Onze Minister kan de geldigheid van een certificaat dat ingevolge
      [artikel 9, eerste lid, onderdeel e, van de wet][ref1] is vervallen, herstellen, indien naar zijn mening bij een
      inspectie voldoende is gebleken dat het schip voldoet aan de desbetreffende eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel9
