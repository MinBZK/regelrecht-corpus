    text: |-
      1 De kapitein van een olietankschip van 150 GT of meer of van een schip geen olietankschip zijnde, van 400 GT of
      meer draagt er zorg voor dat aan boord het oliejournaal deel I, bedoeld in voorschrift 17 van Bijlage I van het
      Verdrag, wordt bijgehouden met inachtneming van hetgeen dienaangaande in die Bijlage is bepaald.

      2 De kapitein van een olietankschip van 150 GT of meer draagt er tevens zorg voor dat aan boord het oliejournaal
      deel II, bedoeld in voorschrift 36 van Bijlage I van het Verdrag, wordt bijgehouden met inachtneming van hetgeen
      dienaangaande in die Bijlage is bepaald.

      3 De kapitein van een schip bestemd of gebruikt voor het vervoer van schadelijke vloeistoffen in bulk of van
      een schip als bedoeld in [artikel 5, derde lid, onderdeel b][ref1], draagt er zorg voor dat aan boord het
      ladingjournaal, bedoeld in voorschrift 15 van Bijlage II van het Verdrag, wordt bijgehouden met inachtneming van
      hetgeen dienaangaande in die Bijlage is bepaald.

      4 De kapitein van een schip dat zich in het Antarctisch gebied bevindt draagt er zorg voor dat elke lozing van
      sanitair afval in een sanitair-afvaljournaal dan wel in het vuilnisjournaal, bedoeld in voorschrift 9 van Bijlage
      V van het Verdrag, wordt bijgehouden met inachtneming van hetgeen dienaangaande met betrekking tot vuilnis in die
      Bijlage is bepaald.

      5 De kapitein:

      a. van elk schip dat zich in het Antarctisch gebied bevindt, en

      b. van elk schip dat zich buiten het Antarctisch gebied bevindt en een tonnage van 400 of meer heeft of waarmee 15
      of meer personen mogen worden vervoerd,

      draagt er zorg voor dat aan boord het vuilnisjournaal, bedoeld in voorschrift 9 van Bijlage V van het Verdrag,
      wordt bijgehouden met inachtneming van hetgeen dienaangaande in die Bijlage is bepaald.

      6 De kapitein van een schip dat verschillende soorten brandstofolie gebruikt teneinde te voldoen aan voorschrift
      14 van Bijlage VI van het Verdrag draagt er zorg voor dat aan boord een journaal wordt bijgehouden met inachtneming
      van hetgeen dienaangaande in dat voorschrift is bepaald.

      7 De kapitein van een schip waarop voorschrift 6.1 van Bijlage VI van het Verdrag van toepassing is en dat
      navulbare systemen heeft die ozonlaagaantastende stoffen bevatten, draagt er zorg voor dat aan boord het journaal
      met betrekking tot ozonlaagaantastende stoffen, bedoeld in voorschrift 12 van bijlage VI van het Verdrag, wordt
      bijgehouden met inachtneming van hetgeen dienaangaande in dat voorschrift is bepaald.

      8 Onze Minister maakt aantekeningen in het ladingjournaal overeenkomstig de in Bijlage II van het Verdrag gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel5
