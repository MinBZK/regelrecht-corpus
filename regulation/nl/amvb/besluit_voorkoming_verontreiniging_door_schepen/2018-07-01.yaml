      1 Het vervoer van olie als bedoeld in voorschrift 1 van Bijlage I van het Verdrag en ballastwater geschiedt met
      inachtneming van de in die Bijlage gegeven voorschriften.

      2 Het vervoer van schadelijke vloeistoffen in bulk geschiedt met inachtneming van de in Bijlage II van het Verdrag
      gegeven voorschriften.

      3 Het vervoer van schadelijke stoffen in verpakte vorm geschiedt met inachtneming van de in Bijlage III van het
      Verdrag gegeven voorschriften.

      4 Het derde lid is ook van toepassing op het vervoer van lege, niet gereinigde verpakkingen die eerder zijn
      gebruikt voor het vervoer van schadelijke stoffen in verpakte vorm, tenzij toereikende maatregelen zijn getroffen
      die verzekeren dat geen restanten zijn achtergebleven die schade kunnen toebrengen aan het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel33
  - number: 33a
    text: |-
      1 Een schip waarvoor op grond van voorschrift B-3 van de bijlage van het Ballastwaterverdrag de normen van
      voorschrift D-1 van de bijlage van het Ballastwaterverdrag van toepassing zijn, wisselt ballastwater in
      overeenstemming met het bepaalde in voorschrift B-4 van de bijlage van het Ballastwaterverdrag.

      2 Bij ministeriële regeling kunnen gebieden worden aangewezen als bedoeld in voorschrift B-4, lid 2, van de bijlage
      bij het Ballastwaterverdrag, waar ballastwater wordt gewisseld overeenkomstig de daarbij gestelde regels.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel33a
  - number: '34'
    text: |-
      1 De kapitein draagt er zorg voor dat aan boord van een schip de in Bijlage I, V en VI van het Verdrag opgenomen
      voorschriften en verplichtingen worden nageleefd.

      2 De kapitein draagt er zorg voor dat aan boord van een schip in het Antarctisch gebied geen stoffen als bedoeld
      in voorschrift 43 van Bijlage I van het Verdrag als brandstof worden gebruikt anders dan met inachtneming van dit
      voorschrift.

      3 De kapitein draagt er zorg voor dat aan boord van een schip de in de bijlage van het Ballastwaterverdrag
      opgenomen voorschriften en verplichtingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel34
