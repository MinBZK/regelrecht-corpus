  - number: '15'
    text: |-
      1 Bij regeling van Onze Minister kan worden bepaald dat voor bepaalde schepen, waarvan na onderzoek is gebleken
      dat ze voldoen aan de op die schepen van toepassing zijnde eisen, bedoeld in [artikel 8, eerste lid][ref1], een
      bijzonder certificaat wordt afgegeven.

      2 Bij regeling van Onze Minister kan worden bepaald dat voor bepaalde schepen waarop de [artikelen 12][ref2],
      [13][ref3] en [13a][ref4] niet van toepassing zijn, waarvan na onderzoek is gebleken dat ze voldoen aan de op
      die schepen van toepassing zijnde eisen, bedoeld in de [artikelen 5 tot en met 7a][ref5] en de met die artikelen
      samenhangende eisen, bedoeld in [artikel 8][ref6], op verzoek van de reder een verklaring kan worden afgegeven.

      3 Bij regeling van Onze Minister kan worden bepaald dat voor de afgifte van een certificaat of het plaatsen van
      aantekeningen hierop, onderscheidenlijk voor de afgifte van een document op grond van een verdrag of een besluit
      van een volkenrechtelijke organisatie, de inspectie onderscheidenlijk beoordeling op basis van een rechtstreeks
      in al zijn onderdelen verbindend besluit van één of meer van de instellingen van de Europese Unie alleen of
      gezamenlijk volstaat, indien:

      a. die betrekking hebben op de voorkoming van verontreiniging door schepen, en

      b. daarin gelijkluidende regels worden gesteld ten aanzien van de eisen aan het schip, het onderzoek en het
      certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel8
