      1 Indien een schip schade heeft opgelopen of zich een gebeurtenis heeft voorgedaan waardoor het vermoeden rijst
      dat schade of een gebrek is ontstaan waardoor het schip een gevaar kan vormen voor het milieu, licht de kapitein zo
      spoedig mogelijk Onze Minister in. Voorts licht hij, indien het schip zich in een haven buiten Nederland bevindt,
      de ter plaatse bevoegde autoriteiten in.

      2 Indien het schip zich in een haven bevindt, mag de reis niet worden voortgezet, voordat de kapitein van Onze
      Minister een verklaring heeft ontvangen, inhoudende dat eventuele herstellingen naar behoren zijn geschied of dat
      de reis zonder gevaar voor het milieu kan worden voortgezet, voorzover de ter plaatse bevoegde autoriteiten zich
      niet tegen voortzetting van de reis verzetten.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel37
  - number: '38'
    text: |-
      1 Bij regeling van onze minister kunnen voor het vervoer van schadelijke stoffen, bedoeld in [artikel 33][ref1],
      aanvullende voorschriften worden vastgesteld, alsmede nadere regels met betrekking tot de in de
      [artikelen 33 tot en met 36][ref2] bedoelde voorschriften en verplichtingen.

      2 Bij regeling van Onze Minister kunnen aanvullende voorschriften worden gegeven over het beheer van ballastwater
      die gelden in bij deze regeling aangewezen gebieden.

      3 De krachtens het eerste en tweede lid gestelde regels kunnen ook van toepassing worden verklaard op buitenlandse
      schepen gedurende de tijd dat deze zich bevinden op de Nederlandse binnenwateren.


