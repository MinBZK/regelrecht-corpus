    text: |-
      1 Als bouwdatum van een schip wordt aangemerkt de dag waarop de kiel van het schip is gelegd, dan wel de dag waarop
      met inachtneming van hetgeen dienaangaande in de op grond van dit besluit toepasselijke verdragen of Codes is
      bepaald, een met de kiellegging vergelijkbaar constructiestadium is bereikt.

      2 In afwijking van het eerste lid wordt als bouwdatum van een schip dat een verbouwing tot een ander op grond van
      dit besluit onderscheiden scheepstype heeft ondergaan, aangemerkt de dag waarop met de verbouwing van het schip
      een aanvang is gemaakt, tenzij dienaangaande in de op grond van dit besluit toepasselijke verdragen of Codes anders
      is bepaald.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de bij nieuwbouw of
      verbouwing van schepen als bouwdatum aan te merken datum. Deze regels kunnen mede betrekking hebben op de bij
      overschrijding van een bij die regeling te bepalen termijn voor de afbouw van een schip of de voltooiing van een
      bepaalde constructiefase als bouwdatum van een schip aan te merken datum.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel4
  - number: '5'
    text: |-
      1 Elk schip voldoet aan de op dat schip van toepassing zijnde eisen van Bijlage I van het Verdrag.

      2 Een schip bestemd of gebruikt voor het vervoer van schadelijke vloeistoffen in bulk, voldoet aan de op dat schip
      van toepassing zijnde eisen van Bijlage II van het Verdrag.

      3 Het tweede lid is van overeenkomstige toepassing op de in dat lid bedoelde schepen:

      a. waarvoor een certificaat als bedoeld in [artikel 12, tweede lid][ref1], benodigd is, of

      b. die geen reizen maken naar havens buitengaats binnen de rechtsmacht van andere partijen bij het Verdrag.

      4 Elk schip van 400 GT of meer dat internationale reizen maakt en elk schip van minder dan 400 GT dat
      internationale reizen maakt en gerechtigd is meer dan 15 personen te vervoeren, voldoet aan de op dat schip
      van toepassing zijnde eisen van Bijlage IV van het Verdrag, met dien verstande dat met betrekking tot een
      passagiersschip in de bijzondere gebieden, bedoeld in voorschrift 1 van die Bijlage, voorschrift 9.1. van die
      Bijlage van toepassing is en voorschrift 9.2 van die Bijlage van toepassing is met ingang van het tijdstip, bedoeld
      in [artikel 29, vierde lid][ref2].

      5 Elk schip voldoet aan de op dat schip van toepassing zijnde eisen van hoofdstuk 3 van Bijlage VI van het Verdrag.

      6 Een schip met een of meer dieselmotoren waarop voorschrift 13 van Bijlage VI van het Verdrag van toepassing
      is, voldoet met betrekking tot die motoren tevens aan de in de NO-Code opgenomen eisen. Het voldoen aan die eisen
      blijkt voor motoren ten aanzien waarvan op grond van de No-Code een pre-certificeringsonderzoek verplicht is,
      uit een overeenkomstig de NO-Code voor de motor afgegeven Internationaal certificaat betreffende voorkoming van
      luchtverontreiniging door motoren, behorende bij die Code.

      7 Elk schip van 400 GT of meer voldoet aan de op dat schip van toepassing zijnde eisen van hoofdstuk 4 van Bijlage
      VI van het Verdrag.


