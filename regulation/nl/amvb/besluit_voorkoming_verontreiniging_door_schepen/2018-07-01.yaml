  - number: '40'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de in [artikel 39][ref1]
      bedoelde voorschriften en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel39
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel40
