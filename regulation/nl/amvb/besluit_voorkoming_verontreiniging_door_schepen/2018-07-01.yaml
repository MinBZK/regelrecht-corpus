    text: |-
      1 Onze Minister kan, met inachtneming van hetgeen dienaangaande in het desbetreffende verdrag of de
      desbetreffende Code is bepaald, afwijking toestaan van de in [artikel 5][ref1] bedoelde eisen en de in
      [artikel 31, eerste en tweede lid][ref2], bedoelde eisen en voorschriften waaronder de in deze artikelleden
      bedoelde handelingen mogen worden verricht, indien aan boord van het schip een voorziening wordt getroffen die naar
      zijn oordeel ten minste gelijkwaardig is aan de in het voorschrift waarvan wordt afgeweken, geëiste voorziening.

      2 Onze Minister kan, met inachtneming van hetgeen dienaangaande is bepaald in voorschrift A-5 van de bijlage bij
      het Ballastwaterverdrag, afwijkingen toestaan van de voorschriften van de bijlage bij het Ballastwaterverdrag,
      indien aan boord van het schip een voorziening wordt getroffen of een maatregel wordt genomen die naar zijn oordeel
      tenminste gelijkwaardig is aan het voorschrift waarvan wordt afgeweken.


