  - number: '22'
    text: |-
      Nadat een bij of krachtens dit besluit voorgeschreven onderzoek, met uitzondering van het onderzoek, bedoeld in
      [artikel 17][ref1], is voltooid, wordt de toestand van het schip en zijn uitrusting gehandhaafd in overeenstemming
      met de bij of krachtens dit besluit gestelde regels. In deze toestand wordt geen verandering aangebracht zonder
      voorafgaande toestemming van Onze Minister of van de ingevolge [artikel 8, derde lid, van de wet][ref2], aangewezen
      natuurlijke persoon of rechtspersoon die het onderzoek heeft uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020762#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel8
