  - number: '11'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld betreffende de voorwaarden voor toelating van
      uitrusting aan boord van schepen, het gebruik van die uitrusting en de documenten waarvan zij in bij die regeling
      bepaalde gevallen vergezeld gaat.
    url: https://wetten.overheid.nl/BWBR0020762/2018-07-01#Artikel11
  - number: '12'
    text: |-
      1 Voor een olietankschip van 150 GT of meer of een schip geen olietankschip zijnde, van 400 GT of meer, waarvan
      na onderzoek is gebleken dat het voldoet aan de eisen, bedoeld in [artikel 5, eerste lid][ref1], en de met dat
      artikellid samenhangende eisen, bedoeld in [artikel 8, tweede lid][ref2], wordt een Internationaal certificaat van
      voorkoming van verontreiniging door olie als bedoeld in voorschrift 7 van Bijlage I van het Verdrag afgegeven.

      2 Voor een schip bestemd of gebruikt voor het vervoer van schadelijke vloeistoffen in bulk, waarvan na onderzoek
      is gebleken dat het voldoet aan de eisen, bedoeld in [artikel 5, tweede lid][ref3], en de met dat artikellid
      samenhangende eisen, bedoeld in [artikel 8, tweede lid][ref4], wordt, al naar gelang de categorie waartoe het schip
      behoort, een van de volgende certificaten afgegeven:

      a. voor chemicaliëntankschepen gebouwd op of na 1 juli 1986: een certificaat van geschiktheid voor het vervoer van
      gevaarlijke chemicaliën in bulk, behorende bij de IBC-Code;

      b. voor chemicaliëntankschepen gebouwd voor 1 juli 1986: een certificaat van geschiktheid voor het vervoer van
      gevaarlijke chemicaliën in bulk, behorende bij de BCH-Code;

      c. voor schepen die schadelijke vloeistoffen in bulk vervoeren en niet behoren tot de in de onderdelen a en b
      genoemde categorieën: een Internationaal certificaat van voorkoming van verontreiniging voor het vervoer van
      schadelijke vloeistoffen in bulk als bedoeld in voorschrift 9 van Bijlage II van het Verdrag.

      3 Voor schepen als bedoeld in [artikel 5, vierde lid][ref5], waarvan na onderzoek is gebleken dat ze voldoen
      aan de eisen, bedoeld in [artikel 5, vierde lid][ref6], en de met dat artikellid samenhangende eisen, bedoeld
      in [artikel 8, tweede lid][ref7], wordt een Internationaal certificaat van voorkoming van verontreiniging door
      sanitair afval als bedoeld in voorschrift 5 van Bijlage IV van het Verdrag afgegeven.

      4 Voor een schip van 400 GT of meer, waarvan na onderzoek is gebleken dat het voldoet aan de eisen,
      bedoeld in [artikel 5, vijfde en zesde lid][ref8], en de met dat artikellid samenhangende eisen, bedoeld in
      [artikel 8, tweede lid][ref9], wordt een Internationaal certificaat betreffende voorkoming van luchtverontreiniging
      als bedoeld in voorschrift 6.1 van Bijlage VI van het Verdrag afgegeven.

      5 Voor schepen met een of meer dieselmotoren waarop voorschrift 13 van Bijlage VI van het Verdrag van toepassing
      is, wordt overeenkomstig de NO-Code voor elk van die motoren een Internationaal certificaat betreffende voorkoming
      van luchtverontreiniging door motoren, behorende bij die Code, afgegeven.

      6 Voor een schip van 400 GT of meer, waarvan na onderzoek is gebleken dat het voldoet aan de eisen,
      bedoeld in [artikel 5, zevende lid][ref10], en de met dat artikellid samenhangende eisen, bedoeld in
      [artikel 8, tweede lid][ref11], wordt een Internationaal certificaat betreffende energie efficiëntie als bedoeld in
