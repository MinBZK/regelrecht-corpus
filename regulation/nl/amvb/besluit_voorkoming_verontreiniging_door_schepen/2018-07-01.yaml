  - number: '2'
    text: |-
      Als schadelijke stoffen als bedoeld in [artikel 1, onderdeel h, van de wet][ref1] worden aangewezen:

      a. olie en oliehoudende mengsels als bedoeld in voorschrift 1 van Bijlage I van het Verdrag;

      b. schadelijke vloeistoffen, inclusief restanten daarvan, of ballastwater, waswater van tanks of andere mengsels
      die dergelijke stoffen bevatten;

      c. vloeistoffen die op grond van Bijlage II niet zijn gecategoriseerd, noch voorlopig ingedeeld of geëvalueerd, of
      ballastwater, waswater van tanks of andere mengsels die dergelijke restanten bevatten;

      d. schadelijke stoffen in verpakte vorm;

      e. sanitair afval;

      f. vuilnis als bedoeld in voorschrift 1 van Bijlage V van het Verdrag;

      g. ballastwater en sediment afkomstig uit een ballastwatertank van een schip.


