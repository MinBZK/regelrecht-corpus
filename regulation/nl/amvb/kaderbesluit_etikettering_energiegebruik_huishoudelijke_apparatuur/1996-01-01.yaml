  - number: '5'
    text: |-
      De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1], aangewezen
      categorie, stelt technische documentatie samen die voldoet aan de bij ministeriële regeling gestelde eisen. Deze
      eisen bestaan uit een verwijzing naar de eisen die terzake worden gesteld in de op de desbetreffende categorie van
      huishoudelijke apparaten betrekking hebbende uitvoeringsrichtlijn of een daarbij behorende bijlage. De leverancier
      houdt deze documentatie beschikbaar voor inspectiedoeleinden met ingang van de datum waarop het desbetreffende type
      van het desbetreffende apparaat door hem in de handel wordt gebracht tot vijf jaar nadat het laatste exemplaar van
      dat type is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: '6'
    text: |-
      1 Het is een handelaar in huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1],
      aangewezen categorie, verboden:

      a. een tot die categorie behorend apparaat uit te stallen zonder dat op een bij ministeriële regeling aangewezen
      duidelijk zichtbare plaats een in de Nederlandse taal gesteld etiket als bedoeld in [artikel 3, eerste lid][ref2],
      is aangebracht;

      b. aan de eindgebruiker een brochure over een tot die categorie behorend apparaat te verstrekken zonder dat daarin
      een in de Nederlandse taal gestelde kaart als bedoeld in [artikel 3, eerste lid][ref3], is opgenomen;

      c. indien er aan hem door de leverancier van de tot die categorie behorende apparaten geen brochures over het
      desbetreffende apparaat worden verstrekt, andere schriftelijke informatie over dat apparaat te verstrekken
      zonder dat daarbij een in de Nederlandse taal gestelde kaart als bedoeld in [artikel 3, eerste lid][ref4], wordt
      verstrekt.

      2 Het is een handelaar in huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref5],
      aangewezen categorie, verboden een tot die categorie behorend apparaat uit te stallen terwijl daarop een etiket
      dan wel een merkteken, symbool of opschrift met betrekking tot het energiegebruik is aangebracht dat afwijkt van
      het etiket, bedoeld in [artikel 3, eerste lid][ref6], onderscheidenlijk afwijkt van de op dat etiket vermelde
      merktekens, symbolen of opschriften en daarmee kan worden verward.

      3 Het tweede lid geldt niet voor overeenkomstig communautaire of nationale voorschriften op huishoudelijke
      apparaten aangebrachte milieukeuren.


