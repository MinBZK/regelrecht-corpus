---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderbesluit_etikettering_energiegebruik_huishoudelijke_apparatuur
regulatory_layer: AMVB
publication_date: '2012-03-16'
valid_from: '1996-01-01'
bwb_id: BWBR0007551
url: https://wetten.overheid.nl/BWBR0007551/1996-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 5 juli 1995, nr. 95045148 WJA/W, gedaan mede
    namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en in overeenstemming met Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn nr. 92/75/EEG van de Raad van de Europese Gemeenschappen van 22 september 1992 betreffende de
    vermelding van het energieverbruik en het verbruik van andere hulpbronnen op de etikettering en in de standaard-
    produktinformatie van huishoudelijke apparaten (PbEG L 297), de artikelen 6 en 21 van de Wet energiebesparing
    toestellen, de artikelen 8, 13 en 14 van de Warenwet en artikel 8 van de Wet geluidhinder;

    De Raad van State gehoord (advies van 7 augustus 1995, nr. W10.95.0332);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 7 september 1995, nr. 9556122 WJA/W,
    uitgebracht mede namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en in overeenstemming met Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.a
    text: |-
      kaderrichtlijn: [richtlijn nr. 92/75/EEG](31992L0075) van de Raad van de Europese Gemeenschappen van 22 september
      1992 betreffende de vermelding van het energieverbruik en het verbruik van andere hulpbronnen op de etikettering en
      in de standaard-produktinformatie van huishoudelijke apparaten (*PbEG* L 297);
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.b
    text: 'uitvoeringsrichtlijn: een ter uitvoering van artikel 9 van de kaderrichtlijn vastgestelde EG-richtlijn;'
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.c
    text: |-
      leverancier: de fabrikant van huishoudelijke apparaten, zijn officiële vertegenwoordiger in de gebieden waarop de
      Overeenkomst betreffende de Europese Economische Ruimte van toepassing is en degene die de desbetreffende apparaten
      in die gebieden in de handel brengt;
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.d
    text: |-
      handelaar: degene die huishoudelijke apparaten aan eindgebruikers verkoopt, verhuurt, in huurkoop aanbiedt of voor
      hen uitstalt;
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.e
    text: 'kaart: een gestandaardiseerde lijst van informatie over het desbetreffende huishoudelijke apparaat;'
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.f
    text: |-
      andere belangrijke hulpbronnen: water, chemische stoffen en alles wat het desbetreffende huishoudelijke apparaat
      bij normaal gebruik voorts verbruikt;
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: 1.1.g
    text: |-
      aanvullende informatie: informatie over de prestaties van het desbetreffende huishoudelijke apparaat, die verband
      houdt met het energiegebruik daarvan of het verbruik van andere belangrijke hulpbronnen, of die nuttig is om zulks
      te evalueren.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: '1.2'
    text: |-
      Zodra aan een op grond van dit besluit of de daarop berustende bepalingen op een leverancier rustende verplichting
      is voldaan door een van degenen, die ingevolge het eerste lid, onder *c*, als zodanig wordt beschouwd, is de
      verplichting van de anderen opgeheven.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: '2.1'
    text: |-
      De bij of krachtens dit besluit vastgestelde bepalingen zijn van toepassing op huishoudelijke apparaten, behorende
      tot een bij ministeriële regeling aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: '2.2'
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid strekt uitsluitend tot uitvoering van
      uitvoeringsrichtlijnen.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: '2.3'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: 2.3.a
    text: tweedehands huishoudelijke apparaten;
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: 2.3.b
    text: |-
      modellen van huishoudelijke apparaten die na het tijdstip van inwerkingtreding van een daarop betrekking hebbende
      uitvoeringsrichtlijn niet meer worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: '3.1'
    text: |-
      De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1], aangewezen
      categorie, draagt ervoor zorg dat de handelaren in die apparaten in de gebieden, waarop de overeenkomst betreffende
      de Europese Economische Ruimte van toepassing is, beschikken over de nodige etiketten en kaarten inzake het
      energiegebruik en - voor zover van toepassing - het verbruik van andere belangrijke hulpbronnen van die apparaten
      alsmede inzake aanvullende informatie over die apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: '3.2'
    text: |-
      De op het etiket vermelde gegevens en de opmaak, afmetingen en kleurstelling van het etiket voldoen aan de daaraan
      bij ministeriële regeling gestelde eisen. Deze eisen bestaan uit een verwijzing naar de eisen die terzake worden
      gesteld in de op de desbetreffende categorie van huishoudelijke apparaten betrekking hebbende uitvoeringsrichtlijn
      of een daarbij behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
  - number: '3.3'
    text: |-
      De op de kaart vermelde gegevens en de opmaak van de kaart voldoen aan de daaraan bij ministeriële regeling
      gestelde eisen. Deze eisen bestaan uit een verwijzing naar de eisen die terzake worden gesteld in de op de
      desbetreffende categorie van huishoudelijke apparaten betrekking hebbende uitvoeringsrichtlijn of een daarbij
      behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
  - number: '3.4'
    text: Het etiket en de kaart zijn gesteld in de daarvoor in aanmerking komende taal.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
  - number: '3.5'
    text: Het etiket wordt kosteloos ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
  - number: '3.6'
    text: |-
      De kaart wordt opgenomen in alle brochures over het desbetreffende apparaat. Indien door de leverancier geen
      brochures worden verstrekt, voegt hij kaarten bij andere schriftelijke informatie die over het desbetreffende
      apparaat wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
  - number: '4.1'
    text: |-
      De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1], aangewezen
      categorie, draagt zorg voor de juistheid van de gegevens, bedoeld in [artikel 3, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007551
        artikel: '3'
  - number: '4.2'
    text: |-
      De gegevens, bedoeld in [artikel 3, tweede en derde lid][ref1], worden gemeten overeenkomstig de normen waarin
      de geharmoniseerde normen, bedoeld in de op de desbetreffende categorie van huishoudelijke apparaten betrekking
      hebbende uitvoeringsrichtlijn of een daarbij behorende bijlage, in Nederland zijn omgezet en waarvan de
      referentienummers in de *Staatscourant* zijn bekendgemaakt dan wel overeenkomstig de normen waarin voornoemde
      geharmoniseerde normen in een andere lid-staat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte zijn omgezet en waarvan de referentienummers in die staat
      zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '3'
  - number: '5'
    text: |-
      De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1], aangewezen
      categorie, stelt technische documentatie samen die voldoet aan de bij ministeriële regeling gestelde eisen. Deze
      eisen bestaan uit een verwijzing naar de eisen die terzake worden gesteld in de op de desbetreffende categorie van
      huishoudelijke apparaten betrekking hebbende uitvoeringsrichtlijn of een daarbij behorende bijlage. De leverancier
      houdt deze documentatie beschikbaar voor inspectiedoeleinden met ingang van de datum waarop het desbetreffende type
      van het desbetreffende apparaat door hem in de handel wordt gebracht tot vijf jaar nadat het laatste exemplaar van
      dat type is vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: '6.1'
    text: |-
      Het is een handelaar in huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1],
      aangewezen categorie, verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: 6.1.a
    text: |-
      een tot die categorie behorend apparaat uit te stallen zonder dat op een bij ministeriële regeling aangewezen
      duidelijk zichtbare plaats een in de Nederlandse taal gesteld etiket als bedoeld in [artikel 3, eerste lid][ref1],
      is aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '3'
  - number: 6.1.b
    text: |-
      aan de eindgebruiker een brochure over een tot die categorie behorend apparaat te verstrekken zonder dat daarin een
      in de Nederlandse taal gestelde kaart als bedoeld in [artikel 3, eerste lid][ref1], is opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '3'
  - number: 6.1.c
    text: |-
      indien er aan hem door de leverancier van de tot die categorie behorende apparaten geen brochures over het
      desbetreffende apparaat worden verstrekt, andere schriftelijke informatie over dat apparaat te verstrekken
      zonder dat daarbij een in de Nederlandse taal gestelde kaart als bedoeld in [artikel 3, eerste lid][ref1], wordt
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '3'
  - number: '6.2'
    text: |-
      Het is een handelaar in huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1],
      aangewezen categorie, verboden een tot die categorie behorend apparaat uit te stallen terwijl daarop een etiket
      dan wel een merkteken, symbool of opschrift met betrekking tot het energiegebruik is aangebracht dat afwijkt van
      het etiket, bedoeld in [artikel 3, eerste lid][ref2], onderscheidenlijk afwijkt van de op dat etiket vermelde
      merktekens, symbolen of opschriften en daarmee kan worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007551
        artikel: '3'
  - number: '6.3'
    text: |-
      Het tweede lid geldt niet voor overeenkomstig communautaire of nationale voorschriften op huishoudelijke apparaten
      aangebrachte milieukeuren.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel6
  - number: '7'
    text: |-
      Degene die huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1], aangewezen
      categorie, door middel van een gedrukte mededeling te koop, in huurkoop of te huur aanbiedt op een wijze
      die inhoudt dat de koop-, huur- of huurkoopovereenkomst tot stand pleegt te komen zonder dat de potentiële
      eindgebruiker die apparaten ziet uitgestald, neemt in die gedrukte mededeling in de daarvoor in aanmerking
      komende taal de gegevens op, die voldoen aan de bij ministeriële regeling gestelde eisen. Deze eisen bestaan uit
      een verwijzing naar de eisen die terzake worden gesteld in de op de desbetreffende categorie van huishoudelijke
      apparaten betrekking hebbende uitvoeringsrichtlijn of een daarbij behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: '8.1'
    text: |-
      Voor zover in dit besluit of de daarop berustende bepalingen wordt verwezen naar de kaderrichtlijn, een
      uitvoeringsrichtlijn of een bij die richtlijnen behorende bijlage treedt voor de toepassing van de desbetreffende
      bepaling een wijziging van de richtlijn of een daarbij behorende bijlage in werking met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister van Economische Zaken doet mededeling van een wijziging als bedoeld in het eerste lid in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel8
  - number: '10'
    text: Het Besluit etikettering energiegebruik koel- en vriesapparatuur wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel10
  - number: '11'
    text: Dit besluit treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Kaderbesluit etikettering energiegebruik huishoudelijke apparatuur.'
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel12
