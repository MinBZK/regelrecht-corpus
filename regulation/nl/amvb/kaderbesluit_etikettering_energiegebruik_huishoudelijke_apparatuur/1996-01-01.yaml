preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 5 juli 1995, nr. 95045148 WJA/W, gedaan mede
    namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en in overeenstemming met Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn nr. 92/75/EEG van de Raad van de Europese Gemeenschappen van 22 september 1992 betreffende de
    vermelding van het energieverbruik en het verbruik van andere hulpbronnen op de etikettering en in de standaard-
    produktinformatie van huishoudelijke apparaten (PbEG L 297), de artikelen 6 en 21 van de Wet energiebesparing
    toestellen, de artikelen 8, 13 en 14 van de Warenwet en artikel 8 van de Wet geluidhinder;

    De Raad van State gehoord (advies van 7 augustus 1995, nr. W10.95.0332);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 7 september 1995, nr. 9556122 WJA/W,
    uitgebracht mede namens de Staatssecretaris van Volksgezondheid, Welzijn en Sport en in overeenstemming met Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. kaderrichtlijn: [richtlijn nr. 92/75/EEG](31992L0075) van de Raad van de Europese Gemeenschappen van 22
      september 1992 betreffende de vermelding van het energieverbruik en het verbruik van andere hulpbronnen op de
      etikettering en in de standaard-produktinformatie van huishoudelijke apparaten (*PbEG* L 297);

      b. uitvoeringsrichtlijn: een ter uitvoering van artikel 9 van de kaderrichtlijn vastgestelde EG-richtlijn;

      c. leverancier: de fabrikant van huishoudelijke apparaten, zijn officiële vertegenwoordiger in de gebieden waarop
      de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is en degene die de desbetreffende
      apparaten in die gebieden in de handel brengt;

      d. handelaar: degene die huishoudelijke apparaten aan eindgebruikers verkoopt, verhuurt, in huurkoop aanbiedt of
      voor hen uitstalt;

      e. kaart: een gestandaardiseerde lijst van informatie over het desbetreffende huishoudelijke apparaat;

      f. andere belangrijke hulpbronnen: water, chemische stoffen en alles wat het desbetreffende huishoudelijke apparaat
      bij normaal gebruik voorts verbruikt;

      g. aanvullende informatie: informatie over de prestaties van het desbetreffende huishoudelijke apparaat, die
      verband houdt met het energiegebruik daarvan of het verbruik van andere belangrijke hulpbronnen, of die nuttig is
      om zulks te evalueren.

      2 Zodra aan een op grond van dit besluit of de daarop berustende bepalingen op een leverancier rustende
      verplichting is voldaan door een van degenen, die ingevolge het eerste lid, onder *c*, als zodanig wordt beschouwd,
      is de verplichting van de anderen opgeheven.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel1
  - number: '2'
    text: |-
      1 De bij of krachtens dit besluit vastgestelde bepalingen zijn van toepassing op huishoudelijke apparaten,
      behorende tot een bij ministeriële regeling aangewezen categorie.

      2 Een ministeriële regeling als bedoeld in het eerste lid strekt uitsluitend tot uitvoering van
      uitvoeringsrichtlijnen.

      3 Dit besluit is niet van toepassing op:

      a. tweedehands huishoudelijke apparaten;

      b. modellen van huishoudelijke apparaten die na het tijdstip van inwerkingtreding van een daarop betrekking
      hebbende uitvoeringsrichtlijn niet meer worden vervaardigd.
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel2
  - number: '3'
    text: |-
      1 De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1],
      aangewezen categorie, draagt ervoor zorg dat de handelaren in die apparaten in de gebieden, waarop de overeenkomst
      betreffende de Europese Economische Ruimte van toepassing is, beschikken over de nodige etiketten en kaarten
      inzake het energiegebruik en - voor zover van toepassing - het verbruik van andere belangrijke hulpbronnen van die
      apparaten alsmede inzake aanvullende informatie over die apparaten.

      2 De op het etiket vermelde gegevens en de opmaak, afmetingen en kleurstelling van het etiket voldoen aan
      de daaraan bij ministeriële regeling gestelde eisen. Deze eisen bestaan uit een verwijzing naar de eisen die
      terzake worden gesteld in de op de desbetreffende categorie van huishoudelijke apparaten betrekking hebbende
      uitvoeringsrichtlijn of een daarbij behorende bijlage.

      3 De op de kaart vermelde gegevens en de opmaak van de kaart voldoen aan de daaraan bij ministeriële regeling
      gestelde eisen. Deze eisen bestaan uit een verwijzing naar de eisen die terzake worden gesteld in de op de
      desbetreffende categorie van huishoudelijke apparaten betrekking hebbende uitvoeringsrichtlijn of een daarbij
      behorende bijlage.

      4 Het etiket en de kaart zijn gesteld in de daarvoor in aanmerking komende taal.

      5 Het etiket wordt kosteloos ter beschikking gesteld.

      6 De kaart wordt opgenomen in alle brochures over het desbetreffende apparaat. Indien door de leverancier geen
      brochures worden verstrekt, voegt hij kaarten bij andere schriftelijke informatie die over het desbetreffende
      apparaat wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007551
        artikel: '2'
  - number: '4'
    text: |-
      1 De leverancier van huishoudelijke apparaten, behorende tot een krachtens [artikel 2, eerste lid][ref1],
      aangewezen categorie, draagt zorg voor de juistheid van de gegevens, bedoeld in
      [artikel 3, tweede en derde lid][ref2].

      2 De gegevens, bedoeld in [artikel 3, tweede en derde lid][ref3], worden gemeten overeenkomstig de normen
      waarin de geharmoniseerde normen, bedoeld in de op de desbetreffende categorie van huishoudelijke apparaten
      betrekking hebbende uitvoeringsrichtlijn of een daarbij behorende bijlage, in Nederland zijn omgezet en waarvan
      de referentienummers in de *Staatscourant* zijn bekendgemaakt dan wel overeenkomstig de normen waarin voornoemde
      geharmoniseerde normen in een andere lid-staat van de Europese Unie of een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte zijn omgezet en waarvan de referentienummers in die staat
      zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007551#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007551#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007551#Artikel3
    url: https://wetten.overheid.nl/BWBR0007551/1996-01-01#Artikel4
