      *ambtenaar:* de ambtenaar in de zin van het [ARAR][ref1], [ARSG][ref2] of [RDBZ][ref3] met een aanstelling in vaste
      dienst of een aanstelling in tijdelijke dienst voor een proeftijd;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel1
