  - number: '16'
    text: |-
      [Artikel 100a van het ARAR][ref1], [artikel 132a van het ARSG][ref2] of [artikel 107 van het RDBZ][ref3] kan door
      het bevoegd gezag van overeenkomstige toepassing worden verklaard op andere ambtenaren dan herplaatsingskandidaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel100a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel132a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel107
