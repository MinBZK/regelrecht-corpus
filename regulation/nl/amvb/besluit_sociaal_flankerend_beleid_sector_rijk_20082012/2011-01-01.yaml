  - number: 1.g
    text: |-
      *aangewezen ambtenaar:* de ambtenaar die schriftelijk in kennis is gesteld dat hij een functie bekleedt die door
      het bevoegd gezag is aangewezen omdat zonder maatregelen in die functie of groep van functies waartoe de ambtenaar
      behoort op termijn sprake zal zijn van overtolligheid dan wel gedwongen standplaatswijziging;
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel1
  - number: 1.h
    text: '*Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel1
  - number: 1.i
    text: |-
      *herplaatsingskandidaat:* een herplaatsingskandidaat als bedoeld in [artikel 49d][ref1] of
      [artikel 49e, tweede lid, van het ARAR][ref2], [artikel 84d][ref3] of [84e, tweede lid, van het ARSG][ref4], dan
      wel [artikel 58c][ref5] of [artikel 58d, tweede lid, van het RDBZ][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49d
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel49e
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel84d
