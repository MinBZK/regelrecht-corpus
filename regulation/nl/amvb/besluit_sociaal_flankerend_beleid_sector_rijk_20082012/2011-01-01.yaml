  - number: 1.j
    text: |-
      *bevoegd gezag:* het tot aanstelling bevoegd gezag, of, indien deze bevoegdheid bij Ons berust, het tot voordracht
      voor die aanstelling bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel1
  - number: '2'
    text: |-
      In het in [artikel 71, eerste lid, van het ARAR][ref1], [artikel 106, eerste lid, van het ARSG][ref2] en
      [artikel 78, eerste lid, van het RDBZ][ref3] bedoelde gesprek wordt tevens jaarlijks aandacht besteed aan de
      ontwikkeling van de loopbaan en aan de onderwerpen mobiliteit, flexibiliteit en loopbaanperspectief in de toekomst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel78
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '106'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '78'
  - number: '3.1'
    text: |-
      Aan de aangewezen ambtenaar en aan de herplaatsingskandidaat wordt door een mobiliteitsadviseur ondersteuning
      geboden bij de invulling en uitvoering van een begeleidingstraject van werk naar werk. Aan andere ambtenaren kan
      het bevoegd gezag besluiten de in de vorige zin bedoelde ondersteuning te bieden.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      Met de aangewezen ambtenaar wordt door een mobiliteitsadviseur een mobiliteitsplan opgesteld, waarin onder meer
      de eigen kwaliteiten, ontwikkelpunten, reële loopbaanwensen en het volgen van relevante scholing kunnen worden
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de herplaatsingskandidaat wordt door de mobiliteitsadviseur, in samenspraak met het bevoegd gezag en
      de ambtenaar een herplaatsingsplan opgesteld, waarin in ieder geval het loopbaanplan en eventueel bestaande
      loopbaanafspraken en, indien de ambtenaar daarmee instemt, de uitkomst van de eventuele loopbaanscan worden
      betrokken. Het bevoegd gezag en de ambtenaar stellen het herplaatsingsplan gezamenlijk vast. Indien binnen een
      redelijke termijn geen overeenstemming over het plan kan worden bereikt, stelt het bevoegd gezag het plan eenzijdig
      vast, waarbij de ambtenaar in de gelegenheid wordt gesteld zijn visie apart te vermelden.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel3
  - number: '3.4'
    text: |-
      Gedurende de herplaatsingstermijn wordt de uitvoering van het herplaatsingsplan iedere zes maanden geëvalueerd en
      wordt het plan zo nodig bijgesteld.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel3
  - number: '3.5'
    text: |-
      De ambtenaar wordt in de gelegenheid gesteld om loopbaangegevens en loopbaanwensen rijksbreed kenbaar te maken
      door opname van die gegevens in een rijksbrede mobiliteitsadministratie. De herplaatsingskandidaat is verplicht de
      benodigde informatie ten behoeve van de bedoelde administratie aan te leveren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel3
  - number: '4.1'
    text: |-
      De ambtenaar heeft onverlet de termijnen, genoemd in [artikel 71b, eerste lid, van het ARAR][ref1],
      [artikel 107a, eerste lid, van het ARSG][ref2] en [artikel 25a, eerste lid, van het RDBZ][ref3], het recht om één
      vertrouwelijke loopbaanscan te doen, met behulp van een professionele externe loopbaandeskundige, bestaande uit ten
      minste één gesprek en een schriftelijk advies van deze deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71b
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel107a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel25a
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 71b
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 107a
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 25a
  - number: '4.2'
    text: |-
      De ambtenaar die gebruik heeft gemaakt van het in het eerste lid genoemde recht, heeft na zijn aanwijzing
      als aangewezen ambtenaar of als herplaatsingskandidaat het recht om voor beide aanwijzingen samen één extra
      loopbaanscan te doen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 59, tweede lid, van het ARAR][ref1], [artikel 94, tweede lid, van het ARSG][ref2] en
      [artikel 67, tweede lid, van het RDBZ][ref3] zijn van overeenkomstige toepassing op de aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel67
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '94'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '67'
  - number: '6.1'
    text: |-
      In afwijking van [artikel 49h van het ARAR][ref1], [artikel 84h van het ARSG][ref2] en
      [artikel 58g van het RDBZ][ref3] geldt gedurende de eerste zes maanden van de herplaatsingstermijn de beperking dat
      uitsluitend sprake kan zijn van een passende functie indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49h
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84h
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58g
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49h
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84h
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58g
  - number: 6.1.a
    text: |-
      de voor de functie geldende salarisschaal niet meer dan één salarisschaal lager is gewaardeerd dan de laatstelijk
      vervulde functie en niet meer dan twee schalen lager is dan de salarisschaal die voor de ambtenaar geldt, en
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel6
  - number: 6.1.b
    text: de reistijd voor woon-werkverkeer enkele reis niet met meer dan 15 minuten toeneemt.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor de bepaling van de reistijd, bedoeld in het eerste lid, onder b, wordt uitgegaan van de route met de minste
      reistijd berekend met de ANWB-routeplanner.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel6
  - number: '7.1'
    text: |-
      De aangewezen ambtenaar, de herplaatsingskandidaat en de ambtenaar die wegens arbeidsongeschiktheid in verband
      met ziekte of gebrek geplaatst moet worden op een andere functie, heeft bij de vervulling van vacatures binnen de
      sector Rijk een voorrangspositie op andere kandidaten.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is niet van toepassing indien een ambtenaar als bedoeld in het [ARSG][ref1] solliciteert naar een
      functie buiten de Staten-Generaal, of indien een ambtenaar als bedoeld in het [ARAR][ref2] of het [RDBZ][ref3]
      solliciteert naar een functie bij de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003229
      [ref2]: https://wetten.overheid.nl/BWBR0001950
      [ref3]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003229
      - id: ref2
        bwb_id: BWBR0001950
      - id: ref3
        bwb_id: BWBR0004052
  - number: '8'
    text: |-
      [Artikel 5, vijfde lid, aanhef en onderdeel d, van het BBRA 1984][ref1] en [artikel 57b van het ARAR][ref2], dan
      wel [artikel 92b van het ARSG][ref3] of [artikel 35 van het RDBZ][ref4] zijn niet van toepassing op de aangewezen
      ambtenaar en de herplaatsingskandidaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel92b
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel35
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 57b
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 92b
      - id: ref4
        bwb_id: BWBR0004052
        artikel: '35'
  - number: '9.1'
    text: |-
      Bij gedwongen plaatsing van de aangewezen ambtenaar of de herplaatsingskandidaat op een functie waarvan de
      salarisschaal lager is dan de salarisschaal die geldt voor de laatstelijk door de ambtenaar vervulde functie,
      spant het bevoegd gezag zich gedurende twee jaar na plaatsing in om, zodra een passende functie beschikbaar is op
      het schaalniveau van de laatstelijk door de ambtenaar vervulde functie, en waarvoor geen geschikte kandidaat of
      geschikte dan wel geschikt te maken herplaatsingskandidaat met een voorrangsrecht als bedoeld in [artikel 7][ref1]
      beschikbaar is, hem in aanmerking te laten komen voor plaatsing in deze functie.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel7
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '7'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De ambtenaar die als herplaatsingskandidaat is geplaatst in een lager gewaardeerde functie dan de functie die hij
      daarvoor vervulde, heeft gedurende twee jaar na plaatsing recht op toepassing van de voorzieningen in dit besluit
      voor herplaatsingskandidaten, voor zover die toepassing kan leiden tot plaatsing in een passende functie die
      gewaardeerd is met de eigen salarisschaal.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel9
  - number: '10'
    text: |-
      In afwijking van [artikel 18b, derde lid, van het BBRA 1984][ref1] bedraagt de aflopende toelage, bedoeld in het
      eerste lid van genoemd artikel, voor aangewezen ambtenaren en herplaatsingskandidaten gedurende het eerste en
      tweede jaar 100%, het derde jaar 75%, het vierde jaar 50% en het vijfde jaar 25% van de bedoelde berekeningsbasis.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel18b
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 18b
  - number: '11.1'
    text: |-
      In afwijking van het gestelde bij of krachtens [artikel 8, tweede lid, van het VKB 1989][ref1] bedraagt voor de
      aangewezen ambtenaar of de herplaatsingskandidaat het maximum van het bedrag, bedoeld in artikel 8, eerste lid,
      onder c, van het VKB 1989 € 5818,46 indien binnen twee jaar na verplaatsing als gevolg van een reorganisatie aan
      een verhuisplicht wordt voldaan, dan wel zonder verhuisplicht wordt verhuisd van buiten 50 kilometer van de plaats
      van tewerkstelling naar binnen 25 kilometer van de standplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel8
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: '8'
  - number: '11.2'
    text: |-
      In afwijking van [artikel 49n, eerste lid, van het ARAR][ref1], [artikel 84n, eerste lid, van het ARSG][ref2]
      respectievelijk [artikel 58m, eerste lid, van het RDBZ][ref3] bedraagt voor de aangewezen ambtenaar of de
      herplaatsingskandidaat het in die artikelen genoemde bedrag € 11.637,69.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84n
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58m
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49n
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84n
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58m
  - number: '11.3'
    text: |-
      De bedragen, genoemd in het eerste en tweede lid, worden jaarlijks per 1 januari bij ministeriële regeling van Onze
      Minister gewijzigd overeenkomstig de Consumentenprijsindex van het CBS die geldt voor de voorafgaande periode van
      november tot en met oktober.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het bevoegd gezag kan het eerste tot en met het derde lid van overeenkomstige toepassing verklaren op andere
      ambtenaren dan aangewezen ambtenaren of herplaatsingskandidaten.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel11
  - number: '12.1'
    text: |-
      In afwijking van het bepaalde bij of krachtens [artikel 12ba, tweede lid][ref1], en
      [artikel 12bb van het Verplaatsingskostenbesluit 1989][ref2] heeft de betrokkene, bedoeld in eerstgenoemd
      artikellid, die aangewezen ambtenaar of herplaatsingskandidaat is, en als gevolg van reorganisatie wordt
      verplaatst, gedurende twee jaar na verplaatsing recht op volledige vergoeding van de door het bevoegd gezag
      redelijk geachte pensionkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12ba
      [ref2]: https://wetten.overheid.nl/BWBR0004630#Artikel12bb
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12ba
      - id: ref2
        bwb_id: BWBR0004630
        artikel: 12bb
  - number: '12.2'
    text: Het bevoegd gezag kan het eerste lid van overeenkomstige toepassing verklaren op andere ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel12
  - number: '13.1'
    text: |-
      In afwijking van [artikel 49m van het ARAR][ref1], [artikel 84m van het ARSG][ref2] en
      [artikel 58l van het RDBZ][ref3] wordt de in genoemde artikelen geregelde aanspraak volledig toegekend gedurende
      twee jaren en wordt gedurende het derde, vierde en vijfde jaar respectievelijk 75%, 50% en 25% van de bedoelde
      extra reistijd als werktijd aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49m
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84m
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58l
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49m
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84m
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58l
  - number: '13.2'
    text: |-
      [Artikel 49m van het ARAR][ref1], [artikel 84m van het ARSG][ref2] en [artikel 58l van het RDBZ][ref3] en het
      eerste lid zijn van overeenkomstige toepassing op de aangewezen ambtenaar en kunnen door het bevoegd gezag van
      overeenkomstige toepassing worden verklaard op andere dan in het eerste lid bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49m
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84m
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58l
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49m
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84m
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58l
  - number: '14.1'
    text: |-
      In afwijking van [artikel 12b1, derde lid, van het VKB 1989][ref1] bedraagt de in het eerste en tweede lid van
      genoemd artikel bedoelde tegemoetkoming voor aangewezen ambtenaren en herplaatsingskandidaten na plaatsing of
      herplaatsing het eerste en tweede jaar 100%, het derde jaar 75%, het vierde jaar 50% en het vijfde jaar 25% van
      de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0004630#Artikel12b1
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004630
        artikel: 12b1
  - number: '14.2'
    text: |-
      Het eerste lid kan door het bevoegd gezag van overeenkomstige toepassing worden verklaard op andere dan in het
      eerste lid bedoelde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel14
  - number: '15'
    text: |-
      De aanspraak, bedoeld in [artikel 79, tweede lid, van het ARAR][ref1],
      [artikel 114, tweede lid, van het ARSG][ref2] en [artikel 85, tweede lid, van het RDBZ][ref3] geldt tevens bij
      ontslag op eigen aanvraag als bedoeld in [artikel 94][ref4] of [94a van het ARAR][ref5], [artikel 124][ref6] of
      [124a van het ARSG][ref7] en [artikel 96][ref8] of [97 van het RDBZ][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel94
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
      [ref6]: https://wetten.overheid.nl/BWBR0003229#Artikel124
      [ref7]: https://wetten.overheid.nl/BWBR0003229#Artikel124a
      [ref8]: https://wetten.overheid.nl/BWBR0004052#Artikel96
      [ref9]: https://wetten.overheid.nl/BWBR0004052#Artikel97
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel15
