        bwb_id: BWBR0004052
        artikel: '107'
  - number: '17.1'
    text: |-
      Ten behoeve van de (her)plaatsingsmogelijkheden of het realiseren van gemaakte loopbaanafspraken, en indien de
      organisatie van het werk het toelaat en er een geschikte plek beschikbaar is, heeft een aangewezen ambtenaar of
      een herplaatsingskandidaat het recht om op eigen verzoek voor een periode van ten hoogste drie maanden te worden
      gedetacheerd of een stage te lopen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het eerste lid kan door het bevoegd gezag van overeenkomstige toepassing worden verklaard op andere dan in het
      eerste lid bedoelde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het bevoegd gezag legt de aangewezen ambtenaar en de herplaatsingskandidaat niet de terugbetalingsverplichting
      op, bedoeld in [artikel 33g, achtste lid][ref1], en [artikel 59, zesde lid, van het ARAR][ref2],
      [artikel 62a, achtste lid][ref3], en [artikel 94, zesde lid, van het ARSG][ref4], [artikel 45b, achtste lid][ref5],
      en [artikel 67, zesde lid, van het RDBZ][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel33g
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0003229#Artikel62a
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel94
      [ref5]: https://wetten.overheid.nl/BWBR0004052#Artikel45b
      [ref6]: https://wetten.overheid.nl/BWBR0004052#Artikel67
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 33g
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '59'
      - id: ref3
        bwb_id: BWBR0003229
        artikel: 62a
      - id: ref4
        bwb_id: BWBR0003229
        artikel: '94'
      - id: ref5
        bwb_id: BWBR0004052
        artikel: 45b
      - id: ref6
        bwb_id: BWBR0004052
        artikel: '67'
  - number: '18.2'
    text: |-
      Het eerste lid is niet van toepassing in geval van disciplinair ontslag of indien de betrokkene een passende
      functie heeft geweigerd.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel18
  - number: '19.1'
    text: |-
      Aan een herplaatsingskandidaat die op zijn aanvraag wordt ontslagen wegens het aanvaarden van een dienstbetrekking
      op een lager inkomensniveau buiten de sector Rijk kent het bevoegd gezag op zijn aanvraag gedurende vijf jaar een
      aanvulling op het inkomen toe.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      De berekeningsbasis voor de aanvulling is het verschil tussen enerzijds de som van het salaris, de vakantie-
      uitkering, de eindejaarsuitkering en de toelagen en toeslagen en anderzijds het volledige inkomen uit de
      dienstbetrekking buiten de sector Rijk, met een maximum van 30% van de som van het oude salaris, de vakantie-
      uitkering, de eindejaarsuitkering en de toelagen en toeslagen. Het inkomen uit de dienstbetrekking bij de sector
      Rijk wordt eenmalig vastgesteld. Indien de arbeidsduurfactor uit bedoelde dienstbetrekking een andere is dan
      die als ambtenaar, wordt de som van het salaris, de vakantie-uitkering, de eindejaarsuitkering en de toelagen
      en toeslagen als ambtenaar omgerekend naar de arbeidsduurfactor in de dienstbetrekking buiten de sector Rijk.
      De aanvulling wordt jaarlijks vastgesteld en bedraagt het eerste jaar 100% het tweede jaar 80%, het derde
      jaar 60%, het vierde jaar 40% en het vijfde jaar 20% van de berekeningsbasis. De betrokkene legt hiertoe een
      inkomensverklaring over de voorgaande twaalf maanden over.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
  - number: '19.3'
    text: 'Geen recht op de in het eerste lid bedoelde aanvulling bestaat:'
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
  - number: 19.3.a
    text: |-
      indien bij vertrek een stimuleringspremie is toegekend als bedoeld in [artikel 20, eerste of derde lid][ref1], of
      een premie als bedoeld in artikel 20, vierde lid, onder c;


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel20
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '20'
        paragraaf: '1'
  - number: 19.3.b
    text: |-
      indien gebruik wordt gemaakt van een salarissuppletie als bedoeld in [artikel 49p van het ARAR][ref1],
      [artikel 84p van het ARSG][ref2] en [artikel 58o van het RDBZ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49p
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84p
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58o
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49p
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84p
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58o
  - number: '19.4'
    text: Het bevoegd gezag kan de in het eerste lid bedoelde aanvulling toekennen aan aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
  - number: '19.5'
    text: |-
      Onder door het bevoegd gezag te stellen voorwaarden wordt de in dit artikel bedoelde aanvulling op aanvraag van
      de ambtenaar afgekocht tegen 40% van de gekapitaliseerde waarde op het moment van afkoop. Het bevoegd gezag kan
      besluiten het in de vorige volzin bedoelde percentage te verhogen in bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel19
  - number: '20.1'
    text: |-
      Aan de herplaatsingskandidaat die binnen de herplaatsingstermijn op zijn aanvraag ontslag wordt verleend wordt een
      stimuleringspremie toegekend.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
  - number: '20.2'
    text: |-
      De stimuleringspremie, bedoeld in het eerste lid, is afhankelijk van het aantal jaren dat de ambtenaar in
      overheidsdienst is geweest op het moment dat het ontslag ingaat en het aantal maanden dat na de aanwijzing als
      herplaatsingskandidaat is verstreken, en bedraagt uitgedrukt in aantallen maandsalarissen:











                    Aantal maanden, verstreken na de aanwijzing/
                    *Aantal jaren in overheidsdienst*


                    Maand 1 t/m 6


                    Maand 7 t/m 9


                    Maand 10 t/m 12


                    Maand 13 t/m 15


                    Maand 16 t/m 18


                    Maand 19 t/m 30






                    *Tot 5 jaar*


                    6


                    5


                    5


                    4


                    4


                    3




                    *5 t/m 9 jaar*


                    9


                    7


                    6


                    5


                    4


                    3




                    *10 jaar en hoger*


                    12


                    10


                    9


                    7


                    5


                    3
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
  - number: '20.3'
    text: |-
      Aan de aangewezen ambtenaar die op zijn aanvraag ontslag wordt verleend kan een stimuleringspremie ter grootte van
      ten hoogste twaalf maandsalarissen worden toegekend
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
  - number: '20.4'
    text: 'Geen stimuleringspremie als bedoeld in het eerste en derde lid wordt toegekend indien:'
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
  - number: 20.4.a
    text: |-
      de in [artikel 19, eerste of vierde lid][ref1], bedoelde aanvulling op het inkomen, de in artikel 19, derde lid
      onder b bedoelde salarissuppletie of de in [artikel 22][ref2] bedoelde terugkeergarantie is toegekend;


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0027815#Artikel22
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '19'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027815
        artikel: '22'
        paragraaf: '1'
  - number: 20.4.b
    text: |-
      het ontslag is verleend op grond van [artikel 94a van het ARAR][ref1], [artikel 124a van het ARSG][ref2] of
      [artikel 97 van het RDBZ][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel124a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel97
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 94a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 124a
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '97'
  - number: 20.4.c
    text: |-
      een premie op grond van [artikel 49o van het ARAR][ref1], [artikel 84o van het ARSG][ref2] of
      [artikel 58n van het RDBZ][ref3] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49o
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84o
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58n
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49o
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84o
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58n
  - number: '20.5'
    text: Het bevoegd gezag kan in het belang van de dienst afwijken van het vierde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
  - number: '20.6'
    text: |-
      De stimuleringspremie wordt op de in [artikel 100a van het ARAR][ref1], [artikel 132a van het ARSG][ref2]
      respectievelijk [artikel 107 van het RDBZ][ref3] genoemde uitkering in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel100a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel132a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel107
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 100a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 132a
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '107'
  - number: '21.1'
    text: |-
      Aan de herplaatsingskandidaat aan wie eervol ontslag op zijn aanvraag wordt verleend in verband met de aanvaarding
      van een functie bij een werkgever die niet is aangesloten bij de Stichting Pensioenfonds Abp, kan het bevoegd gezag
      op zijn verzoek een bijdrage toekennen voor aanvulling van het in de toekomst op te bouwen pensioen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel21
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde aanspraak wordt betaald aan een pensioenfonds of verzekeringsmaatschappij nadat
      de termijnen, genoemd in [artikel 100a, tweede lid, van het ARAR][ref1], [artikel 132a van het ARSG][ref2]
      respectievelijk [artikel 107 van het RDBZ][ref3] en [artikel 22, eerste lid][ref4], zijn verstreken. De aanspraak
      vervalt indien gebruik wordt gemaakt van de aanspraak op hernieuwde aanstelling op grond van artikel 22.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel100a
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel132a
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0027815#Artikel22
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 100a
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 132a
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '107'
      - id: ref4
        bwb_id: BWBR0027815
        artikel: '22'
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Aan de herplaatsingskandidaat aan wie op zijn aanvraag eervol ontslag wordt verleend om buiten de sector Rijk een
      functie te aanvaarden, wordt op zijn aanvraag bij de ontslagverlening het recht op hernieuwde aanstelling toegekend
      overeenkomstig de aanstelling voor het ontslag met een salaris dat overeenkomt met het laatstelijk genoten salaris
      voor het ontslag. Het recht op hernieuwde aanstelling geldt tijdens de eerste zes maanden van uitoefening van de
      functie buiten de sector Rijk bij ontslag in die periode aantoonbaar buiten eigen schuld of toedoen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel22
  - number: '22.2'
    text: Het in het eerste lid bedoelde recht kan worden toegekend aan aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het in het eerste en tweede lid bedoelde recht wordt niet toegekend indien een stimuleringspremie als bedoeld in
      [artikel 20, eerste of derde lid][ref1], of een premie als bedoeld in artikel 20, vierde lid, onder c, is toegekend
      of wanneer een aanvulling op het inkomen als bedoeld in [artikel 19][ref2] is afgekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0027815#Artikel19
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '20'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027815
        artikel: '19'
        paragraaf: '1'
  - number: '22.4'
    text: |-
      Indien gebruik wordt gemaakt van het in het eerste of tweede lid bedoelde recht, wordt aan de betrokkene de status
      van herplaatsingskandidaat verleend waarbij de eerdere periode waarin betrokkene herplaatsingskandidaat is geweest,
      in mindering wordt gebracht op de herplaatsingstermijn, met dien verstande dat de nieuwe herplaatsingstermijn ten
      minste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel22
  - number: '23.1'
    text: |-
      Aan de herplaatsingskandidaat aan wie op zijn aanvraag eervol ontslag is verleend voor het aanvangen van eigen
      bedrijfsactiviteiten, wordt op zijn verzoek onmiddellijk voorafgaand aan de ingangsdatum van zijn ontslag
      buitengewoon verlof met behoud van bezoldiging verleend gedurende drie maanden.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel23
  - number: '23.2'
    text: |-
      In plaats van het in het eerste lid bedoelde verlof kan op aanvraag van de ambtenaar een bedrag worden toegekend
      ter grootte van driemaal zijn maandelijkse bezoldiging op de dag voorafgaande aan zijn ontslag, vermeerderd met de
      vakantie-uitkering en de eindejaarsuitkering daarover.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel23
  - number: '23.3'
    text: |-
      Voor de toepassing van dit artikel geldt als voorwaarde de indiening van een bewijs van inschrijving bij de Kamer
      van Koophandel.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel23
  - number: '23.4'
    text: Het bevoegd gezag kan de voorziening, bedoeld in het eerste of tweede lid, toekennen aan een aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel23
  - number: '24'
    text: |-
      Indien binnen een jaar na plaatsing het bevoegd gezag van oordeel is dat een herplaatsingskandidaat
      is geplaatst in een functie die niet passend is, wijst het bevoegd gezag de betrokkene opnieuw aan als
      herplaatsingskandidaat waarbij de eerdere periode waarin betrokkene herplaatsingskandidaat is geweest,
      in mindering wordt gebracht op de herplaatsingstermijn. In dat geval is de redelijke termijn, bedoeld in
      [artikel 96, tweede lid, van het ARAR][ref1], [artikel 126, tweede lid, van het ARSG][ref2] respectievelijk
      [artikel 99, tweede lid, van het RDBZ][ref3], gelijk aan de resterende herplaatsingstermijn met een minimum van
      drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel99
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '96'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '126'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '99'
  - number: '25'
    text: |-
      Indien binnen een jaar na plaatsing het bevoegd gezag van oordeel is dat een aangewezen ambtenaar is geplaatst in
      een functie die niet passend is, heeft de ambtenaar, vanaf de dag dat hem dit oordeel schriftelijk ter kennis is
      gebracht, gedurende een jaar het recht op toepassing van de voorzieningen die op grond van dit besluit gelden voor
      de aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel25
  - number: '26'
    text: Het bevoegd gezag kan besluiten andere dan geldelijke faciliteiten aan te bieden in verband met mobiliteit.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel26
  - number: '27.1'
    text: |-
      De termijn, genoemd in [artikel 49g, eerste lid, van het ARAR][ref1], [artikel 84g, eerste lid, van het ARSG][ref2]
      en [artikel 58f, eerste lid, van het RDBZ][ref3], wordt verlengd, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49g
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel84g
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel58f
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49g
      - id: ref2
        bwb_id: BWBR0003229
        artikel: 84g
      - id: ref3
        bwb_id: BWBR0004052
        artikel: 58f
  - number: 27.1.a
    text: een herplaatsingskandidaat gedurende deze termijn op tijdelijke basis werkzaamheden verricht, dan wel
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: 27.1.b
    text: aan het eind van de termijn nog geen passende functie is aangeboden aan de herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: '27.2'
    text: |-
      De termijn wordt in het geval, bedoeld in het eerste lid, onder a, verlengd met de periode waarin de werkzaamheden
      op tijdelijke basis zijn verricht, waarbij het aantal gewerkte uren per week voor deze werkzaamheden in verhouding
      tot de arbeidsduur wordt meegewogen. De termijn wordt in het geval, genoemd in het eerste lid, onder b, verlengd
      met de periode die nodig is om alsnog een passende functie aan te bieden.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: '27.3'
    text: |-
      De totale verlenging van de termijn, in de gevallen, bedoeld in het eerste lid, bedraagt ten hoogste twaalf
      maanden.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: '27.4'
    text: |-
      Indien de betrokken ambtenaar voor 1 januari 2008 als herplaatsingskandidaat is aangewezen en het bevoegd gezag
      voor die datum heeft besloten tot verlenging van de herplaatsingstermijn, wordt de totale maximale verlenging,
      bedoeld in het derde lid, verminderd met de periode van de eerdere verlenging.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: '27.5'
    text: |-
      In afwijking van het eerste tot en met vierde lid kan de verlenging van de herplaatsingstermijn in bijzondere
      gevallen worden geweigerd indien de betrokken ambtenaar voor 1 januari 2008 als herplaatsingskandidaat is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel27
  - number: '28'
    text: |-
      De voorzieningen op grond van dit besluit ten behoeve van aangewezen ambtenaren en herplaatsingskandidaten kunnen
      tevens door het bevoegd gezag van toepassing worden verklaard op andere ambtenaren voor zover daarmee de plaatsing
      van een aangewezen ambtenaar of herplaatsing van een herplaatsingskandidaat wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel28
  - number: '29.1'
    text: |-
      In dit artikel wordt verstaan onder RDBZ-ambtenaar: de ambtenaar in de zin van het [RDBZ][ref1] met een aanstelling
      in vaste dienst of een aanstelling in tijdelijke dienst voor een proeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004052
  - number: '29.2'
    text: |-
      De voorzieningen op grond van deze paragraaf ten behoeve van aangewezen ambtenaren zijn, met uitzondering van de
      in [artikel 7][ref1] bedoelde voorziening, van overeenkomstige toepassing op de RDBZ-ambtenaar die geen aangewezen
      ambtenaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel7
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '7'
        paragraaf: '1'
  - number: '29.3'
    text: |-
      De RDBZ-ambtenaar die is geplaatst in het buitenland kan aan [artikel 9][ref1] geen recht ontlenen op plaatsing in
      een andere standplaats voordat de voor hem vastgestelde plaatsingsduur is afgelopen.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel9
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '9'
        paragraaf: '1'
  - number: '29.4'
    text: |-
      Voor de toepassing van de [artikelen 19][ref1], [21][ref2] en [23][ref3] wordt met een herplaatsingskandidaat
      gelijkgesteld de RDBZ-ambtenaar die anders dan uitsluitend om in zijn persoon gelegen redenen krachtens
      [artikel 27, vierde lid, van het RDBZ][ref4] ter beschikking wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0027815#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0027815#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0004052#Artikel27
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '19'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0027815
        artikel: '21'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0027815
        artikel: '23'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004052
        artikel: '27'
  - number: '30'
    text: |-
      Het bevoegd gezag kan van deze paragraaf afwijken voor zover toepassing zal leiden tot een onbillijkheid van
      overwegende aard voor de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel30
  - number: '36'
    text: |-
      Indien vóór 1 januari 2008 op grond van [artikel 113 van het Algemeen Rijksambtenarenreglement][ref1],
      [artikel 139 van het Ambtenarenreglement Staten-Generaal][ref2] of
      [artikel 142 van het Reglement Dienst Buitenlandse Zaken][ref3] in het overleg met de centrales van verenigingen
      van ambtenaren ten aanzien van een reorganisatie een voorziening is overeengekomen die voor een ambtenaar die
      is betrokken bij die reorganisatie, gunstiger is dan een soortgelijke voorziening in dit besluit, dan treedt
      eerstgenoemde voorziening op aanvraag van de ambtenaar in de plaats van die in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel139
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel142
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '113'
      - id: ref2
        bwb_id: BWBR0003229
        artikel: '139'
      - id: ref3
        bwb_id: BWBR0004052
        artikel: '142'
  - number: '39.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, werkt terug tot en met 1 januari 2008 en vervalt met ingang van 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel39
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid werkt [artikel 37][ref1] terug tot en met 1 januari 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel37
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '37'
        paragraaf: '3'
  - number: '39.3'
    text: |-
      In afwijking van het eerste lid werkt [artikel 38][ref1] terug tot en met 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0027815#Artikel38
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0027815
        artikel: '38'
        paragraaf: '3'
  - number: '40'
    text: 'Dit besluit wordt aangehaald als: Besluit sociaal flankerend beleid sector Rijk 2008–2012.'
    url: https://wetten.overheid.nl/BWBR0027815/2011-01-01#Artikel40
