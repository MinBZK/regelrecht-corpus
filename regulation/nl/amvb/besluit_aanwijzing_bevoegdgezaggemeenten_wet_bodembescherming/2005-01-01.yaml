articles:
  - number: '1'
    text: |-
      [Artikel 88, eerste lid, van de Wet bodembescherming][ref1] wordt van overeenkomstige toepassing verklaard op de
      navolgende gemeenten:

      a. Alkmaar,

      b. Almelo,

      c. Amersfoort,

      d. Arnhem,

      e. Breda,

      f. Deventer,

      g. Dordrecht,

      h. Eindhoven,

      i. Emmen,

      j. Enschede,

      k. Groningen,

      l. Haarlem,

      m. Heerlen,

      n. Helmond,

      o. Hengelo,

      p. ‘s-Hertogenbosch,

      q. Leeuwarden,

      r. Leiden,

      s. Maastricht,

      t. Nijmegen,

      u. Schiedam,

      v. Tilburg,

      w. Venlo,

      x. Zaanstad en

      y. Zwolle


