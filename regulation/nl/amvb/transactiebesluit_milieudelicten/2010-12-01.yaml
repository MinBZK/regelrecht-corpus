---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: transactiebesluit_milieudelicten
regulatory_layer: AMVB
publication_date: '2012-04-27'
valid_from: '2010-12-01'
bwb_id: BWBR0011481
url: https://wetten.overheid.nl/BWBR0011481/2010-12-01
preamble:
  text: |-
    Op de voordracht van Onze Minister van Justitie van 9 maart 2000, directie Wetgeving, nr. 5014874/00/6, gedaan na
    overleg met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuurbeheer
    en Visserij, alsmede de Staatssecretarissen van Verkeer en Waterstaat en van Financiën;

    Gelet op artikel 37, eerste lid, van de Wet op de economische delicten, artikel 74c van het Wetboek van Strafrecht
    en artikel 2, eerste lid, van het Besluit Instelling Centraal Justitieel Incassobureau;

    De Raad van State gehoord (advies van 22 mei 2000, nr. W03.00.0106/I);

    Gezien het nader rapport van Onze Minister van Justitie van 4 juli 2000, directie Wetgeving, nr. 5037621/00/6,
    uitgebracht na overleg met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van
    Landbouw, Natuurbeheer en Visserij, alsmede de Staatssecretarissen van Verkeer en Waterstaat en van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel1
  - number: 1.a
    text: |-
      transactiebevoegdheid: de bevoegdheid, bedoeld in [artikel 37 van de Wet op de economische delicten][ref1], tot
      het stellen van een of meer voorwaarden als bedoeld in [artikel 5][ref2] aan de verdachte ter voorkoming van
      strafvervolging;


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0011481#Artikel5
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0011481
        artikel: '5'
  - number: 1.b
    text: |-
      lichaam of persoon: een lichaam of een persoon als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel2
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '2'
  - number: 1.c
    text: |-
      Centraal Justitieel Incassobureau: het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: '2'
    text: 'Transactiebevoegdheid wordt toegekend aan de volgende lichamen en personen, met een publieke taak belast:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.a
    text: |-
      het college van gedeputeerde staten van de provincie Noord-Brabant, voorzover het de feiten betreft, genoemd onder
      de nummers M 100, M 110 tot en met M 116, M 250 tot en met M 252, M 254, M 260 tot en met M 262 en M 470 van de bij
      dit besluit behorende bijlage, en de feiten zijn begaan binnen het arrondissement 's-Hertogenbosch;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.b
    text: |-
      de colleges van burgemeester en wethouders van de gemeenten Beverwijk, Castricum, Heemskerk, Veere, Velzen en
      Vlissingen, voorzover het de feiten betreft, genoemd onder de nummers M 002 tot en met M 020, M 096, M 097,
      M 100 tot en met 102, M 161, M 162, M 166 tot en met M 171, M 176, M 210 tot en met M 213, M 220 tot en met
      M 222, M 230 tot en met M 232, M 250 tot en met M 253, M 271 en M 274 c van de bij dit besluit behorende
      bijlage, en voor zover niet voor die feiten in de desbetreffende gemeente krachtens een verordening als bedoeld in
      [artikel 154b, eerste lid, van de Gemeentewet][ref1] een bestuurlijke boete kan worden opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel154b
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 154b
  - number: 2.c
    text: |-
      het dagelijks bestuur van het waterschap Friesland, voorzover het de feiten betreft, genoemd onder de nummers M 271
      tot en met M 274 van de bij dit besluit behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.d
    text: |-
      de bij besluit van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen ambtenaar,
      voorzover het de feiten betreft, genoemd onder de nummers M 272, M 280 tot en met M 289, M 410 tot en met M 414,
      M 420, M 425, M 426, M 430 en M 440 tot en met M 448 van de bij dit besluit behorende bijlage, en de feiten zijn
      begaan binnen het arrondissement Rotterdam;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.e
    text: |-
      de directeur van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij, voorzover
      het de feiten betreft, genoemd onder de nummers M 290 tot en met M 293, M 295, M 296, M 300 tot en met M 312, M 320
      tot en met M 324, M 330 tot en met M 332, M 340 tot en met M 352, M 360 tot en met M 369, M 380, M 381, M 390 tot
      en met M 393, M 400, M 401 en M 450 tot en met M 463 van de bij dit besluit behorende bijlage, en de feiten zijn
      begaan binnen de arrondissementen Almelo, Arnhem, Assen, Groningen, Leeuwarden, Zutphen en Zwolle-Lelystad;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.f
    text: |-
      de directeur-generaal van de Rijkswaterstaat van het Ministerie van Verkeer en Waterstaat, voorzover het de
      feiten betreft, genoemd onder de nummers M 271 tot en met 273, M 274 a en M 274 e van de bij dit besluit behorende
      bijlage, en de feiten zijn begaan binnen het arrondissement Leeuwarden;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: 2.g
    text: |-
      de directeur van de directie Douane van de Belastingdienst van het Ministerie van Financiën, voorzover het de
      feiten betreft, genoemd onder de nummers M 456 en M 457 van de bij dit besluit behorende bijlage, en de feiten zijn
      begaan binnen het arrondissement Haarlem.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel2
  - number: '3'
    text: 'Een lichaam of een persoon maakt van zijn transactiebevoegdheid geen gebruik indien:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.a
    text: over het feit dan wel de strafbaarheid daarvan verschil van inzicht bestaat met de verdachte;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.b
    text: het feit wordt geconstateerd tezamen met drie of meer andere feiten waarvoor transactiebevoegdheid is verleend;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.c
    text: het feit wordt geconstateerd tezamen met een of meer andere feiten waarvoor geen transactiebevoegdheid is verleend;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.d
    text: |-
      het feit daadwerkelijk milieuschade tot gevolg heeft gehad en de kosten van herstel van die schade dan wel de
      kosten van het treffen van voorzieningen om de gevolgen van die schade te compenseren op meer dan € 1200 worden
      geraamd;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.e
    text: voorwerpen in beslag zijn genomen met het oog op verbeurdverklaring daarvan;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.f
    text: het een overtreding betreft die is begaan door een persoon die jonger is dan twaalf jaar;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.g
    text: het een misdrijf betreft dat is begaan door een persoon die jonger is dan achttien jaar;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: 3.h
    text: het een feit betreft dat is begaan door het lichaam of de persoon of een ander bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel3
  - number: '4.1'
    text: |-
      De hoofdofficier van justitie kan met het oog op het belang van een goede rechtsbedeling bepalen dat in bepaalde
      gebieden binnen zijn arrondissement of in bepaalde zaken een lichaam of een persoon geen gebruik maakt van zijn
      transactiebevoegdheid.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel4
  - number: '4.2'
    text: |-
      Alvorens de hoofdofficier van justitie gebruik maakt van zijn bevoegdheid, bedoeld in het eerste lid, voert hij
      daarover overleg met het betrokken lichaam of de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel4
  - number: '5.1'
    text: |-
      Een lichaam of een persoon stelt als voorwaarde het betalen aan de staat van een geldsom die per strafbaar feit ten
      hoogste € 1200 bedraagt.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel5
  - number: '5.2'
    text: 'Een lichaam of persoon kan naast de voorwaarde, bedoeld in het eerste lid, tevens de volgende voorwaarden stellen:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel5
  - number: 5.2.a
    text: |-
      het verrichten van hetgeen wederrechtelijk is nagelaten, het tenietdoen van hetgeen wederrechtelijk is verricht en
      het verrichten van prestaties tot het goedmaken van een en ander, alles op kosten van de verdachte, voorzover deze
      een bedrag van € 1200 niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel5
  - number: 5.2.b
    text: het afstand doen van voorwerpen die in beslag zijn genomen en vatbaar zijn voor onttrekking aan het verkeer.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel5
  - number: '6.1'
    text: |-
      Het Centraal Justitieel Incassobureau int de geldsom, bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel5
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '5'
  - number: '6.2'
    text: |-
      De directeur van het Centraal Justitieel Incassobureau maakt de geïnde geldsommen periodiek over op een daartoe
      bestemde rekening van het Ministerie van Justitie.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel6
  - number: '6.3'
    text: |-
      Een ieder die betrokken is bij de inning van de geldsom, bedoeld in [artikel 5, eerste lid][ref1], verstrekt het
      Centraal Justitieel Incassobureau alle gegevens die het in verband met de uitoefening van de taak, bedoeld in het
      eerste lid, nodig heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel5
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '5'
  - number: '7.1'
    text: |-
      Indien een lichaam of een persoon besluit gebruik te maken van zijn transactiebevoegdheid, doet dat lichaam of die
      persoon de verdachte schriftelijk een kennisgeving, houdende een transactievoorstel.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: '7.2'
    text: 'Het lichaam of de persoon baseert zijn transactievoorstel op het proces-verbaal dat is opgemaakt door:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.2.a
    text: |-
      een buitengewoon opsporingsambtenaar die belast is met de opsporing van strafbare feiten waarvoor het lichaam of de
      persoon transactiebevoegdheid is toegekend, dan wel
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.2.b
    text: |-
      een ambtenaar van politie als bedoeld in
      [artikel 3, eerste lid, onder a en c, en tweede lid, van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '7.3'
    text: |-
      Het lichaam of de persoon doet slechts in bijzondere gevallen en na overleg met de officier van justitie een beroep
      op een ambtenaar van politie als bedoeld in het tweede lid, onder b, voor het opmaken van een proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: '7.4'
    text: 'In het transactievoorstel, bedoeld in het eerste lid, vermeldt het lichaam of de persoon:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.4.a
    text: |-
      het feit ter zake waarvan het onderscheidenlijk hij de voorwaarde of de voorwaarden stelt, onder verwijzing naar
      het wettelijk voorschrift dat de verdachte heeft overtreden;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.4.b
    text: een aanduiding van de plaats waar en het tijdstip waarop de verdachte het feit heeft begaan;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.4.c
    text: |-
      welke voorwaarde of voorwaarden als bedoeld in [artikel 5][ref1] het onderscheidenlijk hij stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel5
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '5'
  - number: 7.4.d
    text: de hoogte van de betalen geldsom;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.4.e
    text: |-
      , voorzover van toepassing, wat de verdachte moet verrichten van hetgeen wederrechtelijk is nagelaten, tenietdoen
      van hetgeen wederrechtelijk is verricht en welke prestaties hij moet verrichten tot het goedmaken van een en ander;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: 7.4.f
    text: |-
      , voorzover van toepassing, van welke voorwerpen als bedoeld in [artikel 5, tweede lid, onder b][ref1], de
      verdachte afstand moet doen.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel5
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '5'
  - number: '7.5'
    text: |-
      Het lichaam of de persoon doet de rechtstreeks belanghebbende die hem bekend is, onverwijld schriftelijk mededeling
      van de datum waarop het lichaam of de persoon het transactievoorstel heeft gedaan en de termijn waarbinnen de
      verdachte aan de voorwaarde of de voorwaarden dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel7
  - number: '8.1'
    text: |-
      De verdachte betaalt de geldsom, bedoeld in [artikel 7, vierde lid, onder d][ref1], door middel van storting of
      overschrijving op een daartoe bestemde bankrekening van het Centraal Justitieel Incassobureau.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '8.2'
    text: |-
      De betaling geschiedt binnen zes weken na de datum van dagtekening van de kennisgeving, bedoeld in
      [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '8.3'
    text: |-
      In afwijking van het eerste en tweede lid betaalt de verdachte, indien hij geen bekend woonadres in
      Nederland heeft, de geldsom binnen twee weken na de datum van dagtekening van de kennisgeving, bedoeld in
      [artikel 7, eerste lid][ref1], of zoveel eerder als hij het Nederlands grondgebied verlaat, contant op een in het
      transactievoorstel aangewezen politiebureau of douanekantoor. De verdachte ontvangt van de betaling van de geldsom
      een bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '8.4'
    text: |-
      Het politiebureau of het douanekantoor, bedoeld in het derde lid, stort de betaalde geldsom uiterlijk binnen vier
      weken na de datum van betaling op een daartoe bestemde bankrekening van het Centraal Justitieel Incassobureau of
      schrijft deze binnen die termijn daarop over.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel8
  - number: '8.5'
    text: |-
      Indien de verdachte de geldsom niet heeft betaald binnen de termijn, bedoeld in het tweede of derde lid, zendt
      het lichaam of de persoon het proces-verbaal van het desbetreffende feit aan de officier van justitie in het
      arrondissement waarbinnen de verdachte het feit heeft begaan.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel8
  - number: '9.1'
    text: |-
      De verdachte voldoet aan de voorwaarde, bedoeld in [artikel 7, vierde lid, onder e][ref1], binnen de termijn die
      het lichaam of de persoon in het transactievoorstel, bedoeld in [artikel 7, eerste lid][ref2], daarvoor heeft
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '9.2'
    text: |-
      Indien de verdachte niet binnen de termijn, bedoeld in het eerste lid, aan de voorwaarde, bedoeld in
      [artikel 7, vierde lid, onder e][ref1], heeft voldaan, zendt het lichaam of de persoon het proces-verbaal van
      het desbetreffende feit aan de officier van justitie in het arrondissement waarbinnen de verdachte het feit heeft
      begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '10'
    text: |-
      De verdachte doet afstand van de voorwerpen, bedoeld in [artikel 7, vierde lid, onder f][ref1], door het
      afleggen van de verklaring, bedoeld in [artikel 116, tweede lid, van het Wetboek van Strafvordering][ref2].
      [Artikel 8, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0011481#Artikel8
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '116'
      - id: ref3
        bwb_id: BWBR0011481
        artikel: '8'
  - number: '11.1'
    text: 'Het lichaam of de persoon draagt ervoor zorg dat aantekening wordt gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel11
  - number: 11.1.a
    text: ieder feit ten aanzien waarvan het onderscheidenlijk hij gebruik heeft gemaakt van zijn transactie-bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel11
  - number: 11.1.b
    text: |-
      ieder feit ten aanzien waarvan de verdachte aan de voorwaarde of de voorwaarden, bedoeld in
      [artikel 7, vierde lid, onder c][ref1], heeft voldaan, alsmede de datum waarop hij dit heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011481#Artikel7
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011481
        artikel: '7'
  - number: '11.2'
    text: |-
      Het lichaam of de persoon zendt de officier van justitie in het arrondissement waarbinnen de feiten zijn begaan ten
      aanzien waarvan het onderscheidenlijk hij gebruik heeft gemaakt van zijn transactiebevoegdheid, iedere vier weken
      een overzicht van de zaken, bedoeld in het eerste lid, onder a en b.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel11
  - number: '11.3'
    text: |-
      Het lichaam of de persoon doet de rechtstreeks belanghebbende op zijn verzoek onverwijld schriftelijk mededeling
      van de datum waarop de verdachte aan de voorwaarde of de voorwaarden heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel11
  - number: '12.1'
    text: |-
      In afwijking van [artikel 2, vijfde lid, onder c, van het Transactiebesluit 1994][ref1] wordt geen
      transactiebevoegdheid toegekend aan de buitengewoon opsporingsambtenaar in dienst van de gemeente Beverwijk,
      Castricum, Heemskerk, Veere, Velzen of Vlissingen die als lid van de reinigingspolitie werkzaam is, voorzover het
      de zaken, vermeld onder de nummers H 002 tot en met H 106, betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel2
    url: https://wetten.overheid.nl/BWBR0011481/2010-12-01#Artikel12
