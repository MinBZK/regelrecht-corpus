  - number: '5'
    text: |-
      1 Degene die voornemens is over te gaan tot ingeperkt gebruik, maakt, voordat hij daarmee begint, een analyse van
      de risico’s voor mens of milieu die aan dat gebruik kunnen zijn verbonden. Hij maakt daarvan een schriftelijke
      samenvatting, die hij ter beschikking houdt van Onze Minister en van het gezag dat in het kader van de
      [Wet milieubeheer][ref1] bevoegd is ten aanzien van de inrichting waar de betrokken handeling plaatsvindt.

      2 Onze Minister stelt regels omtrent de gegevens die de analyse bevat. Tevens kan hij daarbij nadere regels stellen
      met betrekking tot de samenvatting. [Artikel 2, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel2
