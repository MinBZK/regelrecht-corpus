  - number: 23a
    text: >-
      1 Indien de aanvrager of houder van een vergunning voor het in de handel brengen dan wel voor overige doeleinden
      kennis neemt van nieuwe informatie ten aanzien van de risico's die de genetisch gemodificeerde organismen of
      de handelingen daarmee kunnen opleveren voor mens of milieu of indien sprake is van een wijziging of onbedoelde
      verandering in de doelbewuste introductie van genetisch gemodificeerde organismen in het milieu, draagt hij er zorg
      voor dat:


      a. daarvan terstond mededeling wordt gedaan aan Onze Minister;


      b. terstond de maatregelen worden getroffen die in verband met die risico's nodig zijn ter bescherming van mens of
      milieu, en


      c. de in de aanvraag om een vergunning vermelde informatie wordt herzien en bij Onze Minister wordt ingediend.


      2 Indien Onze Minister de beschikking krijgt over informatie als bedoeld in het eerste lid, maakt hij deze bekend
      door kennisgeving in een van overheidswege uitgegeven blad, in een of meer dag-, nieuws- of huis-aan-huis-bladen of
      op andere geschikte wijze, indien:


      a. uit die informatie blijkt dat de betrokken genetisch gemodificeerde organismen of de handelingen daarmee
      significante gevolgen voor mens of milieu kunnen opleveren, en


      b. het een aanvraag om een vergunning dan wel een vergunning betreft voor overige doeleinden.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel23a
  - number: 23b
    text: >-
      Zodra Onze Minister op de hoogte is van de introductie in het milieu van genetisch gemodificeerde organismen zonder
      een vergunning, geeft hij daarvan kennis in een van overheidswege uitgegeven blad, in een of meer dag-, nieuws- of
      huis-aan-huis-bladen of op andere geschikte wijze, alsmede aan de Commissie van de Europese Gemeenschappen en aan
      de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel23b
  - number: 23c
    text: |-
      1 De houder van een vergunning voor overige doeleinden, maakt jaarlijks en na voltooiing van de introductie
      overeenkomstig bij regeling van Onze Minister aan te wijzen beschikkingen van de Raad van de Europese Unie dan wel
      van de Commissie van de Europese Gemeenschappen vóór 1 januari een verslag over de resultaten van de doelbewuste
      introductie van genetisch gemodificeerde organismen in het milieu waarin in ieder geval de eventuele risico's voor
      mens of milieu in het voorafgaande kalenderjaar worden vermeld en zonodig aandacht wordt besteed aan producten die
      de vergunninghouder nog wil introduceren in het milieu overeenkomstig [paragraaf 3.3][ref1]. De vergunninghouder
      houdt de resultaten gedurende drie jaren ter beschikking van Onze Minister.

      2 De houder van een vergunning voor het in de handel brengen, dient de monitoringrapporten in bij Onze Minister,
      de Commissie van de Europese Gemeenschappen en bij de bevoegde instanties van de andere lidstaten van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Paragraaf3
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0004703
        paragraaf: '3'
  - number: '24'
    text: |-
      1 De aanvraag om een vergunning voor overige doeleinden bevat:

      a. informatie overeenkomstig bijlage III bij [richtlijn nr. 2001/18](32001L0018), die nodig is om een
      milieurisicoanalyse uit te voeren, daaronder in ieder geval begrepen:

      1°. informatie over algemene zaken, en informatie over personeel en opleiding;

      2°. informatie over het genetisch gemodificeerde organisme;

      3°. informatie over de omstandigheden van de introductie en het potentiële milieu waarin doelbewust wordt
      geïntroduceerd;

      4°. informatie over de interactie tussen het genetisch gemodificeerde organisme en het milieu;

      5°. een monitoringplan overeenkomstig bijlage IIIA, onderdeel V, en bijlage IIIB, onderdeel G;

      6°. informatie over plannen voor monitoring, herstelmethoden, afvalstoffenbehandeling en noodmaatregelen;

      7°. een samenvatting van het dossier;

      b. een milieurisicoanalyse overeenkomstig bijlage II bij [richtlijn nr. 2001/18](32001L0018), zoals gewijzigd dan
      wel aangevuld met, bij regeling van Onze Minister aan te wijzen, beschikkingen van de Raad van de Europese Unie of
      de Commissie van de Europese Gemeenschappen, voorzien van alle bibliografische verwijzingen en indicaties over de
      gebruikte methoden.

      2 De aanvrager kan ter voldoening aan het eerste lid, verwijzen naar gegevens of resultaten van een eerdere
      aanvraag om een vergunning van een andere aanvrager, voor zover die informatie, gegevens of resultaten niet
      vertrouwelijk zijn of de andere vergunninghouder daarvoor schriftelijk toestemming heeft verleend, of door hem
      relevant geachte aanvullende informatie indienen.

      3 Onze Minister kan toestaan dat een enkele aanvraag wordt ingediend voor hetzelfde genetisch gemodificeerde
      organisme dat op dezelfde plaats of op verschillende plaatsen voor hetzelfde doel en binnen een beperkte periode
      doelbewust in het milieu wordt geïntroduceerd.

      4 Onze Minister tekent onverwijld de datum van ontvangst van de aanvraag aan en zendt de aanvrager onverwijld een
      bewijs van ontvangst, waarin die datum is vermeld.

      5 Onze Minister zendt binnen 30 dagen na ontvangst van de aanvraag een samenvatting daarvan aan de Commissie van de
      Europese Gemeenschappen.

      6 Onze Minister kan, indien zulks naar zijn oordeel voor het inzicht in de gevaren die voor mens of milieu kunnen
      ontstaan, noodzakelijk is, aan de aanvrager opdragen nadere door hem aangeduide gegevens over te leggen.

      7 Onze Minister neemt het besluit op de aanvraag binnen 120 dagen na ontvangst van de aanvraag waarbij, indien van
      toepassing, opmerkingen die andere lidstaten van de Europese Unie hebben gemaakt in aanmerking worden genomen.

      8 Onze Minister kan de vergunning ambtshalve of op een daartoe strekkend verzoek wijzigen of intrekken.

      9 Onze Minister trekt vergunningen ambtshalve in ter uitvoering van beschikkingen van de Raad van de Europese Unie
      dan wel van de Commissie van de Europese Gemeenschappen over geleidelijke uitfasering van genetisch gemodificeerde
      organismen.

      10 Onze Minister beslist niet op een aanvraag om een vergunning of tot het wijzigen of intrekken van een vergunning
      dan:

      a. in overeenstemming met Onze Minister van Landbouw, Natuur en Voedselkwaliteit voor zover het betreft die
      aspecten van de bescherming van het milieu waarvoor deze verantwoordelijk is;

      b. na overleg met Onze Minister van Volksgezondheid, Welzijn en Sport, voor zover het betreft die
      aspecten van de volksgezondheid waarvoor deze verantwoordelijk is, tenzij het een aanvraag om een
      vergunning betreft voor handelingen met genetisch gemodificeerde organismen waarvoor ingevolge de
      [Wet medisch-wetenschappelijk onderzoek met mensen][ref1] tevens een positief oordeel is vereist van een op grond
      van die wet bevoegde commissie;

      c. na overleg met Onze overige Ministers wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel24
