      Bij de beoordeling van een aanvraag om een vergunning als bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3]
      of [11][ref4], houdt Onze Minister rekening met alle hem ter beschikking staande gegevens die verband houden met
      de risico’s voor mens of milieu die aan de betrokken handelingen zijn verbonden. Daartoe behoren onder meer de
      gevolgen voor het afvalbeheer, de veiligheid en de bestrijding van rampen en zware ongevallen.


