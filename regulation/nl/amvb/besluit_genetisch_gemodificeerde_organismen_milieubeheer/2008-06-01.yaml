  - number: '20'
    text: Onze Minister kan een vergunning verlenen voor een bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel20
  - number: '21'
    text: |-
      Indien Onze Minister, nadat hij vergunning heeft verleend naar aanleiding van een aanvraag om een vergunning als
      bedoeld in de [artikelen 8][ref1], [9][ref2], [10][ref3] of [11][ref4], kennis neemt van nieuwe gegevens die
      belangrijke gevolgen kunnen hebben voor de risico’s die aan het ingeperkt gebruik zijn verbonden, kan hij:

      a. degene aan wie de vergunning is verleend, opdragen de betrokken handelingen tijdelijk of definitief te staken of

      b. de voorschriften wijzigen, die zijn verbonden aan de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004703#Artikel11
