    text: |-
      1 Degene die handelingen van categorie B verricht met organismen die behoren tot groep II, dient daarvoor, voordat
      hij daartoe overgaat, een aanvraag om een vergunning in bij Onze Minister.

      2 De aanvraag om een vergunning bevat in ieder geval de gegevens, bedoeld in [bijlage 4, onderdeel 4][ref1], bij
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004703
