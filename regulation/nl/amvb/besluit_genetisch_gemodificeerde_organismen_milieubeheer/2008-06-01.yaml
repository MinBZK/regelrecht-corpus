  - number: '6'
    text: |-
      1 Onze Minister kan regels stellen die voor de houders van een vergunning krachtens [artikel 17][ref1] gelden naast
      of in plaats van de aan die vergunning verbonden voorschriften.

      2 Voorts beziet degene die handelingen met genetisch gemodificeerde organismen verricht, dan wel zodanige
      organismen vervaardigt, bij ingeperkt gebruik jaarlijks of zoveel keren meer als de aard van de betrokken
      handelingen vereist, de getroffen maatregelen opnieuw, ten einde rekening te houden met nieuw verworven
      wetenschappelijke of technische kennis inzake risicobeheersing en behandeling en het beheer van afvalstoffen; zo
      nodig treft hij verdergaande maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel17
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel6
