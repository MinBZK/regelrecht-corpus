        bwb_id: BWBR0009408
  - number: 24a
    text: |-
      1 Een vergunning als bedoeld in [artikel 23][ref1] geldt tevens voor een wijziging van de locatie, bedoeld in
      bijlage IIIA, onder III, categorie B, onder 1, dan wel bijlage IIIB, onderdeel E, onder 1 bij [richtlijn nr.
      2001/18](32001L0018), die niet leidt tot andere of grotere risico's voor mens of milieu dan die het gevolg kunnen
      zijn van de vergunde handeling, indien:

      a. de voorgenomen wijziging van de locatie er uitsluitend toe leidt dat de vergunde handeling op een andere locatie
      wordt verricht;

      b. de voorgenomen wijziging van de locatie voldoet aan de in de vergunningvoorschriften neergelegde criteria voor
      locatiekeuze;

      c. de voorgenomen locatie waar de handeling wordt uitgevoerd ligt binnen de in de vergunning vermelde gemeente;

      d. is voldaan aan het vergunningvoorschrift dat, indien gebruik is gemaakt van de vergunning, een verslag van
      verrichte werkzaamheden voor het eind van het kalenderjaar waarin die werkzaamheden hebben plaatsgevonden, aan Onze
      Minister is verstrekt;

      e. het voornemen tot wijziging van de locatie waar de handeling wordt uitgevoerd door de vergunninghouder
      schriftelijk overeenkomstig het tweede lid aan Onze Minister is gemeld, en

      f. Onze Minister, in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, aan de
      vergunninghouder schriftelijk heeft verklaard dat de voorgenomen wijziging van de locatie waar de handeling wordt
      uitgevoerd, voldoet aan de voorwaarden in dit artikellid en de wijziging van de locatie naar zijn oordeel geen
      aanleiding geeft tot wijziging van de vergunning, bedoeld in [artikel 24, achtste lid][ref2].

      2 Bij de melding, bedoeld in het eerste lid, onder e, vermeldt de vergunninghouder:

      a. zijn naam en adres;

      b. de vergunning waarop de voorgenomen wijziging van de locatie betrekking heeft;

      c. de wijziging van de locatie, bedoeld in bijlage IIIA, onder III, categorie B, onder 1, dan wel bijlage IIIB,
      onderdeel E, onder 1 bij [richtlijn nr. 2001/18](32001L0018), en

      d. gegevens waaruit blijkt dat de voorgenomen wijziging van de locatie voldoet aan de in het eerste lid gestelde
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel24
