  - number: '36'
    text: >-
      1 Onze Minister tekent onverwijld de datum van ontvangst aan van de aanvraag om verlenging van een vergunning
      voor het in de handel brengen en zendt de vergunninghouder onverwijld een bewijs van ontvangst, waarin die datum
      is vermeld.


      2 Onze Minister stelt na ontvangst van de aanvraag een beoordelingsrapport op, overeenkomstig bijlage VI bij
      [richtlijn nr. 2001/18](32001L0018).


      3 Onze Minister zendt het beoordelingsrapport aan de vergunninghouder en zendt het beoordelingsrapport en een
      afschrift van de aanvraag onverwijld aan de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister neemt binnen 105 dagen na de verspreiding door de Commissie van de Europese Gemeenschappen van het
      beoordelingsrapport, bedoeld in [artikel 36, tweede lid][ref1], een besluit.

      2 De termijn voor het nemen van een besluit op een aanvraag om verlenging als bedoeld in
      [artikel 35, vierde lid][ref2], wordt opgeschort indien een andere lidstaat van de Europese Unie of de Commissie
      van de Europese Gemeenschappen heeft verklaard bedenkingen te hebben tegen het in de handel brengen van de
      genetisch gemodificeerde organismen, en deze bedenkingen handhaaft.

      3 Onze Minister neemt geen besluit dan in overeenstemming met Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit voor zover het betreft die aspecten van de bescherming van het milieu waarvoor deze
      verantwoordelijk is, en na overleg met Onze overige Ministers wie het mede aangaat.

      4 Een vergunning voor het in de handel brengen wordt met maximaal tien jaren verlengd, met dien verstande dat
      in het geval er geen met redenen omklede bezwaren van een lidstaat van de Europese Unie of de Commissie van de
      Europese Gemeenschappen zijn binnengekomen, Onze Minister de geldigheidsduur om specifieke redenen kan beperken
      of verlengen.

      5 Indien er wel met redenen omklede bezwaren van een lidstaat van de Europese Unie of de Commissie van de Europese
      Gemeenschappen zijn binnengekomen, maar daarover binnen 75 dagen na de verspreiding van het beoordelingsrapport
      alsnog overeenstemming wordt bereikt, kan Onze Minister de geldigheidsduur van een vergunning voor het in de handel
      brengen met tien jaren verlengen of deze naar behoefte beperken.

      6 Onze Minister zendt het besluit aan de vergunninghouder en stelt de Commissie van de Europese Gemeenschappen en
      de bevoegde instanties van de andere lidstaten van de Europese Unie daarvan binnen 30 dagen in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel35
