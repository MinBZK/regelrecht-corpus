  - number: '4'
    text: |-
      [Paragraaf 2][ref1] is niet van toepassing op:

      a. de tijdelijke opslag tijdens vervoer van genetisch gemodificeerde organismen:

      1º. niet zijnde micro-organismen dan wel planten of dieren in associatie met genetisch gemodificeerde organismen
      die zich bevinden in een vervoerseenheid die voldoet aan door Onze Minister te stellen regels voor vervoer buiten
      de inrichting die bestemd is voor activiteiten met genetisch gemodificeerde organismen, en de verpakking is
      voorzien van gegevens van de geadresseerde en de afzender;

      2º. die zich bevinden in een vervoerseenheid die voldoet aan de regels gesteld op basis
      van [artikel 4b, tweede lid, onder a, van de Wegenverkeerswet 1994][ref2], en op basis van
      [artikel 2 van het Besluit vervoer gevaarlijke stoffen][ref3], onderscheidenlijk zijn verpakt overeenkomstig
      regels gesteld op basis van [artikel 26, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref4], en de
      [artikelen 2][ref5] en [5, derde lid, van het Besluit vervoer gevaarlijke stoffen][ref6], en de verpakking is
      voorzien van gegevens van de geadresseerde en de afzender;

      b. het vervaardigen, vervoeren, toepassen, voorhanden hebben, aan een ander ter beschikking stellen of zich ontdoen
      van typen van genetisch gemodificeerde micro-organismen die zijn opgesomd in bijlage II, deel C, bij [richtlijn
      98/81](31998L0081);

      c. het vervaardigen van organismen door, dan wel het vervoeren, toepassen, voorhanden hebben, aan een ander ter
      beschikking stellen of zich ontdoen van organismen die zijn vervaardigd door:

      1°. celfusie, met inbegrip van protoplastfusie, van eukaryotische soorten, met inbegrip van de productie van
      hybridoma's, uitgezonderd de fusie van plantencellen,

      2°. zelfklonering van niet-pathogene, van nature voorkomende micro-organismen die geen bijkomende agentia
      bezitten en aantoonbaar veilig zijn gebleken bij langdurig gebruik, dan wel ingebouwde biologische barrières
      bezitten die niet van invloed zijn op de optimale groei in kunstmatige media, maar beperkte overlevings- of
      vermenigvuldigingskansen bieden zonder schadelijke effecten voor mens en milieu, of

      3°. celfusie, met inbegrip van protoplastfusie, van prokaryotische soorten die genetisch materiaal uitwisselen door
      middel van bekende fysiologische processen,

      tenzij bij de vervaardiging daarvan als recipiënt of ouderorganisme gebruik wordt gemaakt van
      genetisch gemodificeerde organismen, die niet zijn verkregen op de onder 1°, 2° of 3° of de in
      [bijlage 1, onderdeel 1, onder a of b][ref7], beschreven wijze en ten aanzien waarvan geen toepassing heeft
      plaatsgehad van [artikel 23, tweede lid, onder d][ref8], dan wel van genetisch gemodificeerde organismen die niet
      vallen onder [artikel 23, tweede lid, onder e][ref9].


