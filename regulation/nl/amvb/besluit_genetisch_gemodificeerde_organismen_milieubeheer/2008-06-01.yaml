  - number: 24b
    text: |-
      1 Een besluit als bedoeld in [artikel 24a, eerste lid, onder f][ref1], wordt uiterlijk drie weken na ontvangst van
      de melding bekendgemaakt.

      2 Zo spoedig mogelijk na de bekendmaking wordt het besluit ter inzage gelegd. Met het besluit worden ter inzage
      gelegd:

      - een exemplaar van de melding, bedoeld in [artikel 24a, eerste lid, onder e][ref2], met de daarbij behorende
      stukken;
      - de vergunning waarop de wijziging van de locatie betrekking heeft, en
      - andere stukken die betrekking hebben op het besluit, voorzover deze redelijkerwijs nodig zijn voor een
      beoordeling van het besluit.

      3 Voorafgaand aan de terinzagelegging geeft Onze Minister in een of meer dag-, nieuws- of huis-aan-huis-bladen
      of op andere geschikte wijze kennis van het besluit. De kennisgeving wordt in ieder geval in de Staatscourant
      geplaatst.

      4 In de kennisgeving wordt vermeld:

      - wat de zakelijke inhoud van het besluit is;
      - waar en wanneer de stukken ter inzage liggen;
      - wie in de gelegenheid worden gesteld om bezwaar te maken tegen het besluit, en
      - op welke wijze dit kan geschieden.

      5 Onze Minister deelt de in de kennisgeving vermelde gegevens tevens mee aan degene die de melding, bedoeld in
      [artikel 24a, eerste lid, onder e][ref3], heeft gedaan.

      6 De stukken liggen gedurende zes weken ter inzage.

      7 Indien bepaalde stukken niet ter inzage worden gelegd, als gevolg van een besluit van Onze Minister tot
      geheimhouding daarvan op grond van [artikel 19.3 van de Wet milieubeheer][ref4], wordt daarvan mededeling gedaan.

      8 Tegen vergoeding van ten hoogste de kosten wordt afschrift van de ter inzage gelegde stukken verstrekt.


