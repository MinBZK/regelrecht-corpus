    text: |-
      1 Voor de toepassing van [paragraaf 2][ref1] worden de genetisch gemodificeerde organismen onderscheiden in de
      volgende groepen:

      a. groep I: genetisch gemodificeerde micro-organismen die voldoen aan de krachtens het tweede lid gestelde regels
      dan wel waarvan na toepassing van het vierde lid is vastgesteld dat zij eveneens voldoen aan de criteria voor
      indeling in groep I;

      b. groep II: overige genetisch gemodificeerde micro-organismen;

      c. groep III: overige genetisch gemodificeerde organismen, niet zijnde micro-organismen.

      2 Onze Minister stelt regels voor de indeling van genetisch gemodificeerde organismen. Hij stelt daarbij onder
      meer vast welke door hem aangewezen organismen en vectoren geschikt zijn voor de vervaardiging van organismen die
      behoren tot groep I. Voorts kan hij daarbij vaststellen of een insertie geschikt is voor de vervaardiging van die
      organismen.

      3 Het ontwerp van de regels, bedoeld in het tweede lid, wordt door Onze Minister in de *Staatscourant*
      bekendgemaakt. Aan een ieder wordt de gelegenheid geboden gedurende een bij die bekendmaking vast te stellen
      termijn opmerkingen over het ontwerp schriftelijk ter kennis van Onze Minister te brengen.

      4 Degene die wil overgaan tot handelingen met genetisch gemodificeerde micro-organismen die zijn vervaardigd met
      behulp van organismen en vectoren die niet zijn aangewezen overeenkomstig het tweede lid, tweede volzin, dan wel
      degene die een zodanig organisme wil vervaardigen, kan Onze Minister verzoeken vast te stellen dat de betrokken
      organismen of vectoren geschikt zijn voor de vervaardiging van organismen die behoren tot groep I. Onze Minister
      beslist op het verzoek binnen vier weken. Met betrekking tot het verzoek is [artikel 13][ref2] van overeenkomstige
      toepassing, met dien verstande dat voor de toepassing van [artikel 13, tweede lid][ref3], de in de voorgaande
      volzin genoemde termijn wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel13
