preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 februari
    1989, no. MJZ 0629072, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Landbouw, Natuurbeheer en Visserij en de Staatssecretarissen van Sociale Zaken en Werkgelegenheid en
    van Welzijn, Volksgezondheid en Cultuur;


    Overwegende dat het in het milieu brengen van genetisch gemodificeerde organismen ongewenste effecten op mens of
    milieu kan hebben;


    dat deze effecten vanwege het reproductievermogen onomkeerbaar kunnen zijn;


    dat een volledig inzicht in de mechanismen die leiden tot deze effecten nog ontbreekt;


    dat de mogelijke onomkeerbaarheid van de effecten enerzijds en het ontbreken van een volledig inzicht anderzijds
    een beoordeling vooraf van het in het milieu brengen van genetisch gemodificeerde organismen wenselijk maken;


    Gelet op de artikelen 24 en 26 van de Wet milieugevaarlijke stoffen (Stb. 1985, 639), en artikel 2 van de Hinderwet
    (Stb. 1981, 410);


    Gezien het advies van de Centrale raad voor de milieuhygiëne (advies van 25 november 1988, nr. GGO-88/1247);


    De Raad van State gehoord (advies van 12 juli 1989, nr.W08.89.0122);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    22 januari 1990, no. MJZ 2219077, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij en de Staatssecretarissen van Sociale
    Zaken en Werkgelegenheid en van Welzijn, Volksgezondheid en Cultuur;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. genetisch materiaal: desoxyribonucleïne-zuur (DNA) en ribonucleïnezuur (RNA);

      c. genetische modificatie: het veranderen van genetisch materiaal op een wijze die van nature niet mogelijk is door
      voortplanting of recombinatie;

      d. micro-organismen: cellulaire en niet-cellulaire micro-biologische entiteiten met het vermogen tot
      vermenigvuldiging of tot overbrenging van genetisch materiaal, daaronder mede begrepen virussen, viroïden, en
      dierlijke en plantencellen in cultuur;

      e. organismen: micro-organismen en andere biologische entiteiten met het vermogen tot vermenigvuldiging of tot
      overbrenging van genetisch materiaal;

      f. genetisch gemodificeerde organismen: organismen, met uitzondering van menselijke wezens, waarvan het genetisch
      materiaal is veranderd op een wijze die van nature niet mogelijk is door voortplanting of natuurlijke recombinatie;

      g. ingeperkt gebruik: genetische modificatie van organismen of vermeerderen, opslaan, aan een ander ter
      beschikking stellen, toepassen, voorhanden hebben, vervoeren, met uitzondering van vervoeren als bedoeld in
      [artikel 23, tweede lid, onder c][ref1], zich ontdoen of vernietigen van genetisch gemodificeerde organismen
      in een afgesloten ruimte dan wel in een installatie of in apparatuur in een inrichting als bedoeld in categorie
      21 van [bijlage I bij het Inrichtingen- en vergunningenbesluit milieubeheer][ref2], indien met betrekking tot
      die afgesloten ruimte, die installatie of die apparatuur fysische barrières of een combinatie van fysische met
      chemische of biologische barrières zijn of worden toegepast om het contact van die organismen met mens en milieu te
      beperken, overeenkomstig door Onze Minister te stellen regels;

      h. [richtlijn 98/81](31998L0081): [richtlijn nr. 98/81/EG](31998L0081) van de Raad van de Europese Unie van 26
      oktober 1998 tot wijziging van [Richtlijn 90/219/EEG](31990L0219) inzake het ingeperkt gebruik van genetisch
      gemodificeerde micro-organismen;

      i. zelfklonering: verwijdering van genetisch materiaal uit een organisme, gevolgd door het terugbrengen van dit
      genetisch materiaal of van een deel daarvan, al dan niet in vitro, enzymatisch, chemisch of mechanisch bewerkt,
      in cellen van hetzelfde organisme of van een nauw verwante soort die door natuurlijke fysiologische processen
      chromosomaal DNA kan uitwisselen met het eerstbedoelde organisme;

      j. [richtlijn nr. 2001/18](32001L0018): [richtlijn nr. 2001/18/EG](32001L0018) van het Europees Parlement en
      de Raad van de Europese Unie van 12 maart 2001 inzake de doelbewuste introductie van genetisch gemodificeerde
      organismen in het milieu en tot intrekking van [Richtlijn 90/220/EEG](31990L0220) van de Raad (PbEG L 106);

      k. in de handel brengen: het al dan niet tegen betaling ter beschikking stellen van genetisch gemodificeerde
      organismen aan derden, uitgezonderd:

      1º. het ter beschikking stellen voor ingeperkt gebruik;

      2º. het ter beschikking stellen uitsluitend ten behoeve van activiteiten overeenkomstig de voorschriften in
      paragraaf 3.2;

      l. overige doeleinden: activiteiten met genetisch gemodificeerde organismen niet zijnde ingeperkt gebruik of het in
      de handel brengen;

      m. product: een in de handel gebracht preparaat, bestaande uit een genetisch gemodificeerd organisme, een
      combinatie van genetisch gemodificeerde organismen of deze bevattende;

      n. milieurisicoanalyse: de beoordeling overeenkomstig bijlage II bij [richtlijn nr. 2001/18](32001L0018) van
      optredende risico's voor mens of milieu welke de doelbewuste introductie in het milieu van de te introduceren
      genetisch gemodificeerde organismen of een combinatie daarvan met zich mee kan brengen;

      o. risicoanalyse: de beoordeling overeenkomstig [artikel 5][ref3] van optredende risico's voor mens of milieu welke
      ingeperkt gebruik van genetisch gemodificeerde organismen met zich mee kan brengen;

      p. [verordening 1946/2003](32003R1946): [verordening (EG) nr. 1946/2003](32003R1946) van het Europees Parlement
      en de Raad van de Europese Unie van 15 juli 2003 betreffende de grensoverschrijdende verplaatsing van genetisch
      gemodificeerde organismen (PbEU L 287);

      q. [verordening 1829/2003](32003R1829): [verordening (EG) nr. 1829/2003](32003R1829) van het Europees Parlement en
      de Raad van de Europese Unie van 22 september 2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders
      (PbEU L 268);

      r. [verordening 1830/2003](32003R1830): [verordening (EG) nr. 1830/2003](32003R1830) van het Europees Parlement
      en de Raad van de Europese Unie van 22 september 2003 betreffende de traceerbaarheid en etikettering van genetisch
      gemodificeerde organismen en de traceerbaarheid van met genetisch gemodificeerde organismen geproduceerde
      levensmiddelen en diervoeders en tot wijziging van [richtlijn 2001/18/EG](32001L0018) (PbEU L 268).

      2 Onder genetisch gemodificeerd organisme dan wel genetisch gemodificeerde organismen wordt mede verstaan: een
      combinatie van genetisch gemodificeerde organismen.


