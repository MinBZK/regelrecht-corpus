  - number: '28'
    text: |-
      1 De aanvraag om een vergunning voor het in de handel brengen bevat in ieder geval:

      a. informatie overeenkomstig bijlage III en IV bij [richtlijn nr. 2001/18](32001L0018);

      b. een milieurisicoanalyse zoals aangevuld met richtsnoeren vastgesteld bij, bij regeling van Onze Minister aan te
      wijzen beschikkingen van de Raad van de Europese Unie dan wel de Commissie van de Europese Gemeenschappen;

      c. voorwaarden voor het in de handel brengen van de genetisch gemodificeerde organismen als product of in
      producten, daaronder begrepen voorschriften inzake gebruik en behandeling;

      d. de gewenste geldigheidsduur van de vergunning, met inachtneming van [artikel 31, eerste lid][ref1];

      e. een monitoringplan overeenkomstig bijlage VII bij [richtlijn nr. 2001/18](32001L0018) en overeenkomstig bij
      regeling van Onze Minister aan te wijzen beschikkingen van de Raad van de Europese Unie of van de Commissie van de
      Europese Gemeenschappen, daaronder mede begrepen een voorstel voor de duur van het plan;

      f. een voorstel met betrekking tot de etikettering en de verpakking overeenkomstig bijlage IV bij [richtlijn nr.
      2001/18](32001L0018);

      g. een samenvatting van het dossier overeenkomstig bij regeling van Onze Minister aan te wijzen beschikkingen van
      de Raad van de Europese Unie of van de Commissie van de Europese Gemeenschappen, en

      h. indien van toepassing, informatie over gegevens of resultaten van de introducties van dezelfde genetisch
      gemodificeerde organismen, waarvoor reeds eerder of tegelijkertijd een vergunning dan wel toestemming is
      aangevraagd of verleend of informatie over gegevens of resultaten van de introducties van dezelfde genetisch
      gemodificeerde organismen, die op dat moment worden verricht binnen of buiten de Gemeenschap.

      2 Onze Minister kan ter uitvoering van beschikkingen van de Raad van de Europese Unie dan wel van de Commissie van
      de Europese Gemeenschappen, voor bij die beschikkingen aangegeven soorten genetisch gemodificeerde organismen als
      product of in producten, van het eerste lid afwijkende regels stellen.

      3 Onze Minister kan op verzoek van de aanvrager toestaan dat de in het eerste lid, onder a, bedoelde gegevens
      overeenkomstig onderdeel B van bijlage IV bij [richtlijn nr. 2001/18](32001L0018) niet of slechts ten dele
      overgelegd behoeven te worden, indien de aanvrager aannemelijk kan maken dat het in de handel brengen en het
      gebruik van genetisch gemodificeerde organismen als product of in producten geen risico's met zich meebrengt voor
      mens of milieu.

      4 De aanvrager kan ter voldoening aan het eerste lid, verwijzen naar gegevens of resultaten van eerdere
      vergunningaanvragen van andere vergunninghouders, of door hem relevant geachte aanvullende informatie indienen,
      voor zover die informatie, gegevens en resultaten niet vertrouwelijk zijn of de andere vergunninghouders daarvoor
      schriftelijk toestemming hebben verleend.

      5 Onze Minister tekent onverwijld de datum van ontvangst van de aanvraag aan en zendt de aanvrager onverwijld een
      bewijs van ontvangst, waarin die datum is vermeld.

      6 Onze Minister zendt onverwijld de in het eerste lid, onder g, bedoelde samenvatting aan de bevoegde instanties
      van de andere lidstaten van de Europese Unie en aan de Commissie van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004703
        artikel: '31'
        paragraaf: '3'
  - number: '29'
    text: >-
      1 Onze Minister stelt binnen 90 dagen na ontvangst van een aanvraag om een vergunning voor het in de handel
      brengen, een beoordelingsrapport op overeenkomstig bijlage VI bij [richtlijn nr. 2001/18](32001L0018).


      2 Indien het beoordelingsrapport inhoudt dat het genetisch gemodificeerde organisme in de handel mag worden
      gebracht en onder welke voorwaarden, vermeldt het de voorwaarden waaronder dat mag gebeuren. Onze Minister zendt
      het beoordelingsrapport en een afschrift van de aanvraag onverwijld aan de aanvrager en aan de Commissie van de
      Europese Gemeenschappen.


      3 Indien het beoordelingsrapport inhoudt dat het genetisch gemodificeerde organisme niet in de handel mag worden
      gebracht, zendt Onze Minister ten vroegste 15 dagen na toezending van het beoordelingsrapport aan de aanvrager en
      uiterlijk 105 dagen na ontvangst van de aanvraag, het beoordelingsrapport samen met de informatie waarop het is
      gebaseerd, aan de Commissie van de Europese Gemeenschappen.


      4 Indien Onze Minister na toezending van het beoordelingsrapport maar vóór vergunningverlening kennis neemt van
      nieuwe informatie die van invloed kan zijn op de risico's van de betrokken genetisch gemodificeerde organismen
      voor mens of milieu, zendt hij die informatie onverwijld aan de Commissie van de Europese Gemeenschappen en aan de
      bevoegde instanties van de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel29
  - number: '30'
    text: >-
      1 Onze Minister neemt binnen 225 dagen na ontvangst van een aanvraag om een vergunning voor het in de handel
      brengen een besluit, zendt dit onverwijld aan de aanvrager en stelt de Commissie van de Europese Gemeenschappen en
      de andere lidstaten van de Europese Unie daarvan binnen 30 dagen in kennis.


      2 De termijn voor het nemen van een besluit op een aanvraag wordt opgeschort indien een andere lidstaat van de
      Europese Unie of de Commissie van de Europese Gemeenschappen heeft verklaard bedenkingen te hebben tegen het in de
      handel brengen van de genetisch gemodificeerde organismen, en deze bedenkingen handhaaft.


      3 Onze Minister neemt geen besluit dan in overeenstemming met Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, voor zover het betreft die aspecten van de bescherming van het milieu waarvoor deze
      verantwoordelijk is en na overleg met Onze overige Ministers wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel30
  - number: '31'
    text: >-
      1 Onverminderd het tweede en derde lid, wordt een vergunning voor het in de handel brengen voor maximaal tien jaren
      verleend.


      2 De vergunning voor een genetisch gemodificeerd organisme of een nakomeling van dat organisme uitsluitend
      met als doel het in de handel brengen van hun zaden overeenkomstig de daarop betrekking hebbende communautaire
      voorschriften, wordt verleend voor een periode van maximaal tien jaren na de datum waarop het eerste plantenras
      afkomstig van het genetisch gemodificeerde organisme, voor het eerst op een officiële nationale lijst van
      plantenrassen is opgenomen overeenkomstig de in artikel 15, vierde lid, tweede alinea, van [richtlijn nr.
      2001/18](32001L0018), genoemde richtlijnen betreffende de gemeenschappelijke rassenlijst voor landbouwgewassen
      onderscheidenlijk betreffende het in de handel brengen van groentezaad.


      3 De vergunning voor bosbouwkundig teeltmateriaal wordt verleend voor een periode van maximaal tien jaren na de
      datum waarop uitgangsmateriaal afkomstig van het genetisch gemodificeerde organisme voor het eerst op een officiële
      nationale lijst is opgenomen overeenkomstig de in artikel 15, vierde lid, derde alinea, van [richtlijn nr. 2001/18]
      (32001L0018), genoemde richtlijn betreffende het in de handel brengen van bosbouwkundig teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel31
  - number: '32'
    text: |-
      1 Indien een vergunning wordt verleend, wordt daarin in ieder geval vermeld:

      a. de reikwijdte, daaronder mede begrepen de identiteit van de genetisch gemodificeerde organismen die als product
      of in producten in de handel worden gebracht en het unieke bijbehorende identificatiesymbool;

      b. de geldigheidsduur;

      c. de voorschriften die worden gesteld aan het in de handel brengen van de genetisch gemodificeerde organismen
      als product of in producten, daaronder mede begrepen voorschriften voor gebruik, behandeling en de verpakking en
      voorschriften voor de bescherming van specifieke ecosystemen, milieus of geografische gebieden waarin het product
      volgens plan zal worden gebruikt;

      d. de verplichting om op verzoek van Onze Minister controlesteekproeven beschikbaar te stellen;

      e. de voorschriften met betrekking tot etikettering, overeenkomstig bijlage IV bij [richtlijn nr. 2001/18]
      (32001L0018), en

      f. de monitoringvoorschriften overeenkomstig bijlage VII bij [richtlijn nr. 2001/18](32001L0018) en overeenkomstig
      bij regeling van Onze Minister aan te wijzen beschikkingen van de Raad van de Europese Unie of van de Commissie van
      de Europese Gemeenschappen, daaronder mede begrepen de rapportage, de termijn van het monitoringplan en voor zover
      van toepassing voorschriften voor degenen die het product verkopen of gebruiken waaronder voor geteelde genetisch
      gemodificeerde organismen, de informatie die over de teeltlocatie moet worden verschaft.

      2 Producten waarin onvoorziene of technisch niet te voorkomen sporen van toegelaten genetisch gemodificeerde
      organismen niet zijn uit te sluiten, worden geëtiketteerd en verpakt volgens de vergunningvoorschriften met
      inachtneming van de drempelwaarden die zijn vastgesteld bij, bij regeling van Onze Minister aan te wijzen,
      beschikkingen op grond van artikel 21, tweede lid, van [richtlijn nr. 2001/18](32001L0018), en waar beneden geen
      etiketterings- of verpakkingsplicht geldt.

      3 Sporen als bedoeld in het tweede lid die bestemd zijn voor rechtstreekse bewerking of verwerking, behoeven niet
      te worden geëtiketteerd en verpakt overeenkomstig de vergunningvoorschriften, voor zover deze sporen aanwezig zijn
      in een verhouding van ten hoogste 0,9% of een lagere drempelwaarde die is vastgesteld in, bij regeling van Onze
      Minister aan te wijzen, beschikkingen op grond van artikel 21, derde lid, van [richtlijn 2001/18](32001L0018), mits
      de aanwezigheid van deze sporen onvoorzien en technisch niet te voorkomen is.

      4 Een besluit als bedoeld in [artikel 30, eerste lid][ref1], wordt bekend gemaakt door kennisgeving daarvan in
      een van overheidswege uitgegeven blad, in een of meer dag-, nieuws- of huis-aan-huis-bladen of op andere geschikte
      wijze.

      5 Het is verboden te handelen in strijd met artikel 4, eerste, tweede, vierde en zesde lid, van [verordening
      1830/2003](32003R1830), tenzij het zevende of achtste lid, van deze verordening van toepassing is, dan wel, wat
      betreft artikel 4, eerste en tweede lid, artikel 6 van deze verordening van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel30
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel32
