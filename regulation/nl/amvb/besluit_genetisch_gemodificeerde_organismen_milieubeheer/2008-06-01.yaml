  - number: '15'
    text: |-
      Degene die een aanvraag om een vergunning heeft gedaan, als bedoeld in de [artikelen 8][ref1], [9][ref2],
      [10][ref3] of [11][ref4], stelt Onze Minister onverwijld op de hoogte van nieuwe gegevens waarover hij de
      beschikking krijgt of redelijkerwijs de beschikking kan krijgen, indien die gegevens belangrijke gevolgen kunnen
      hebben voor de risico’s die aan het ingeperkt gebruik zijn verbonden. Hij dient een gewijzigde aanvraag om een
      vergunning in, waarbij hij aangeeft welke maatregelen in verband met deze nieuwe gegevens zijn getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004703#Artikel11
