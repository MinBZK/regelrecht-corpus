  - number: '7'
    text: |-
      1 Onze Minister kan regels stellen omtrent de verdere gegevens die bij de aanvragen om een vergunning, bedoeld
      in de [artikelen 8, eerste lid][ref1], [9, eerste lid][ref2], [10, eerste lid][ref3], en [11, eerste lid][ref4],
      worden ingediend. [Artikel 2, derde lid][ref5], is van overeenkomstige toepassing.

      2 Ingeval organismen die behoren tot verschillende groepen in combinatie worden toegepast, kan worden volstaan met
      een gezamenlijke aanvraag om een vergunning.


