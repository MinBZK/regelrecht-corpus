  - number: '22'
    text: >-
      Voorts kan Onze Minister op een daartoe strekkende, schriftelijk bij hem ingediende aanvraag van de
      vergunninghouder of van andere belanghebbenden de voorschriften, verbonden aan een vergunning, wijzigen, aanvullen
      of intrekken, alsnog voorschriften aan de vergunning verbinden, dan wel de vergunning intrekken. Indien de
      beschikking daartoe niet op aanvraag van de vergunninghouder wordt gegeven, gaat Onze Minister daartoe slechts over
      indien het belang van de bescherming van mens of milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel22
  - number: 22a
    text: >-
      De houder van een vergunning als bedoeld in artikel 17, eerste lid, die genetisch gemodificeerde organismen aan
      een ander ter beschikking stelt, draagt er zorg voor dat op het etiket van de verpakking van of het bijgevoegde
      document bij de genetisch gemodificeerde organismen duidelijk zichtbaar is aangegeven dat er genetisch
      gemodificeerde organismen in aanwezig zijn, overeenkomstig de toepasselijke delen van bijlage IV bij [richtlijn
      nr. 2001/18](32001L0018) en overeenkomstig bij regeling van Onze Minister aan te wijzen beschikkingen van de Raad
      van de Europese Unie dan wel de Commissie van de Europese Gemeenschappen op grond van artikel 26, tweede lid, van
      [richtlijn nr. 2001/18](32001L0018).
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel22a
  - number: '23'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister genetisch gemodificeerde organismen te vervaardigen, toe te
      passen, voorhanden te hebben, aan een ander ter beschikking te stellen of in Nederland in te voeren alsmede zich
      ervan te ontdoen, dan wel genetisch gemodificeerde organismen, niet zijnde micro-organismen, te vervoeren.

      2 Het eerste lid is niet van toepassing op:

      a. ingeperkt gebruik;

      b. handelingen die zijn beschreven in [bijlage 1][ref1] bij dit besluit indien die handelingen worden uitgevoerd
      onder de voorwaarden die in die bijlage zijn vermeld, voor zover die voorwaarden blijkens die bijlage van
      toepassing zijn;

      c. het vervoeren van genetisch gemodificeerde organismen, niet zijnde micro-organismen, voor overige doeleinden
      indien dat vervoeren geschiedt overeenkomstig door Onze Minister te stellen regels;

      d. handelingen voor overige doeleinden van medicinale stoffen en preparaten voor gebruik door de mens die bestaan
      uit genetisch gemodificeerde organismen of die deze bevatten, voor zover die handelingen krachtens communautaire
      regelgeving, niet zijnde [richtlijn nr. 2001/18](32001L0018), zijn toegelaten en die communautaire regelgeving
      voorziet in:

      1º. een specifieke milieurisicoanalyse overeenkomstig bijlage II en aan de hand van de in bijlage III bij
      [richtlijn nr. 2001/18](32001L0018) vermelde informatie;

      2º. schriftelijke goedkeuring voorafgaand aan de doelbewuste introductie in het milieu;

      3º. een monitoringplan overeenkomstig de desbetreffende delen van bijlage III van [richtlijn nr. 2001/18]
      (32001L0018) om de effecten van de introductie van een genetisch gemodificeerd organisme op mens of milieu te
      kunnen traceren, en

      4º. voorschriften met betrekking tot behandeling van nieuwe informatie, voorlichting, informatie over resultaten
      van introducties en uitwisseling van informatie, gelijkwaardig aan de voorschriften vermeld in dit besluit;

      e. genetisch gemodificeerde organismen als product of in producten die in de handel worden gebracht, voor zover
      die krachtens communautaire regelgeving, niet zijnde [richtlijn nr. 2001/18](32001L0018), zijn toegelaten en die
      communautaire regelgeving voorziet in:

      1º. een specifieke milieurisicoanalyse overeenkomstig bijlage II en aan de hand van de in bijlage III bij
      [richtlijn nr. 2001/18](32001L0018) vermelde informatie;

      2º. voorschriften met betrekking tot de milieurisicobeheersing, etikettering, monitoring en voorlichting,
      gelijkwaardig aan dit besluit, en

      3º. een vrijwaringsclausule, gelijkwaardig aan die in [artikel 17.19 van de Wet milieubeheer][ref2] en
      [artikel 33][ref3];

      f. genetisch gemodificeerde organismen als product of in producten die in de handel worden gebracht, voor zover
      die krachtens de verordening, bedoeld in [artikel 1, eerste lid, onder fff, van de Geneesmiddelenwet][ref4],
      zijn toegelaten, en een specifieke milieurisicoanalyse overeenkomstig bijlage II en aan de hand van soortgelijke
      informatie als bedoeld in bijlage III bij richtlijn nr. 2001/18 is verricht, onverminderd andere voorschriften over
      risicobeoordeling, risicobeheersing, etikettering, toezicht, publieksvoorlichting en vrijwaringsclausules, zoals
      geregeld in communautaire regelgeving inzake geneesmiddelen voor menselijk en diergeneeskundig gebruik;

      g. genetisch gemodificeerde organismen als product of in producten die in de handel worden gebracht, voor zover
      de bevoegde instantie van een andere lidstaat een vergunning als bedoeld in het eerste lid voor het in de handel
      brengen heeft verstrekt dan wel op andere wijze daarvoor schriftelijke toestemming heeft verleend overeenkomstig
      [richtlijn nr. 2001/18](32001L0018);

      h. sporen van een genetisch gemodificeerd organisme in producten die in de handel worden gebracht en die bedoeld
      zijn voor rechtstreeks gebruik als levensmiddel of diervoeder of voor verwerking, indien wordt voldaan aan de
      voorwaarden van artikel 47 van [verordening 1829/2003](32003R1829), met dien verstande dat deze uitzondering geldt
      tot en met 18 april 2007.

      3 Het is verboden materiaal, dat is afgeleid van genetisch gemodificeerde organismen waarvoor een vergunning is
      verleend voor overige doeleinden dan wel waarvoor voor die doeleinden op andere wijze door een bevoegde instantie
      van een andere lidstaat van de Europese Unie schriftelijk toestemming is verleend, in de handel te brengen tenzij
      hiervoor een vergunning dan wel schriftelijk toestemming is verleend.

      4 Onze Minister doet mededeling in de *Staatscourant* van de communautaire regelgeving, bedoeld in het tweede lid,
      onderdelen d tot en met f.


      [ref1]: https://wetten.overheid.nl/BWBR0004703
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel17.19
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel33
