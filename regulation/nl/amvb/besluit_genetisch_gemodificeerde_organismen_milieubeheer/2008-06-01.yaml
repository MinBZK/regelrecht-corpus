        artikel: '7'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Degene die handelingen van categorie B verricht met organismen die behoren tot groep I, dient daarvoor, voordat
      hij daartoe overgaat, een aanvraag om een vergunning in bij Onze Minister.

      2 De aanvraag om een vergunning bevat in ieder geval de gegevens, bedoeld in [bijlage 4, onderdeel 2][ref1], bij
      dit besluit.

      3 In afwijking van het eerste lid is geen aanvraag om een vergunning vereist, indien Onze Minister op verzoek van
      degene die ingeperkt gebruik verricht, heeft vastgesteld dat er sprake is van een wijziging van geringe aard van
      een handeling als bedoeld in het eerste lid:

      a. waarvoor een vergunning is verleend als bedoeld in [artikel 17, eerste lid][ref2], dan wel

      b. waarop het derde lid van dat artikel van toepassing is.

      4 Onze Minister beslist binnen vier weken na de datum van ontvangst van een verzoek als bedoeld in het derde lid.
      Met betrekking tot het verzoek is [artikel 13][ref3] van overeenkomstige toepassing, met dien verstande dat voor
      de toepassing van [artikel 13, tweede lid][ref4], de in de eerste volzin genoemde termijn wordt opgeschort. Indien
      Onze Minister niet binnen de in de eerste volzin bedoelde termijn een beslissing heeft genomen op het verzoek,
      heeft de vaststelling van rechtswege plaatsgehad.

      5 Onze Minister kan regels stellen omtrent de beoordeling van een verzoek als bedoeld in het derde lid.


