  - number: '40'
    text: >-
      1 Onze Minister is de bevoegde instantie, bedoeld in artikel 3, negentiende lid, van [verordening 1946/2003]
      (32003R1946) en treedt op als nationaal contactpunt, bedoeld in artikel 3, twintigste lid, van [verordening
      1946/2003](32003R1946).


      2 Onze Minister draagt zorg voor de taken die in [verordening 1946/2003](32003R1946) aan de lidstaten zijn
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel40
  - number: '41'
    text: >-
      Het is verboden te handelen in strijd met:


      a. het verbod, gesteld bij artikel 5, eerste lid, tweede volzin, en derde lid, van [verordening 1946/2003]
      (32003R1946),


      b. de voorschriften gesteld bij artikel 4, tweede en derde volzin, van [verordening 1946/2003](32003R1946),


      c. de voorschriften gesteld bij artikel 6, eerste alinea, van [verordening 1946/2003](32003R1946),


      d. de voorschriften gesteld bij artikel 8, derde lid, van [verordening 1946/2003](32003R1946), voor zover er geen
      adequate maatregelen zijn genomen.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel41
  - number: '42'
    text: >-
      Het is verboden te handelen in strijd met:


      a. het verbod, gesteld bij artikel 10, derde lid, tweede volzin, van [verordening 1946/2003](32003R1946),


      b. de voorschriften, gesteld bij artikel 10, eerste en tweede lid, van [verordening 1946/2003](32003R1946).
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel42
  - number: '43'
    text: >-
      Het is verboden te handelen in strijd met de voorschriften gesteld bij artikel 12 en artikel 13 van [verordening
      1946/2003](32003R1946).
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel43
  - number: '44'
    text: >-
      Een wijziging van de bijlagen bij [richtlijn nr. 2001/18](32001L0018) of delen daarvan met uitzondering van de
      bijlagen of delen daarvan, genoemd in artikel 27 van die richtlijn, treedt voor de toepassing van dit besluit in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel44
  - number: 44b
    text: |-
