  - number: '3'
    text: |-
      1 Voor de toepassing van [paragraaf 2][ref1] wordt ingeperkt gebruik van genetisch gemodificeerde micro-organismen
      onderscheiden in de volgende categorieën:

      a. categorie A: handelingen als bedoeld in categorie 21, onderdeel *a*, van
      [bijlage I bij het Inrichtingen- en vergunningenbesluit milieubeheer][ref2];

      b. categorie B: overige handelingen.

      2 Onze Minister kan nadere regels stellen voor de indeling van handelingen in de categorieën A en B.
      [Artikel 2, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0005829
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel2
