  - number: '13'
    text: |-
      1 Onze Minister kan van degene die de aanvraag om een vergunning heeft gedaan, nadere gegevens verlangen omtrent
      het ingeperkt gebruik waar de aanvraag om een vergunning betrekking op heeft.

      2 Ingeval het eerste lid toepassing vindt, worden de termijnen, bedoeld in de [artikelen 14][ref1] en [17][ref2],
      opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel17
