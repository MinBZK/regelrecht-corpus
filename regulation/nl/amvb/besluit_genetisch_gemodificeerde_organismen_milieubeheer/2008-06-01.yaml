  - number: '12'
    text: |-
      1 Onze Minister tekent de datum van ontvangst aan op een aanvraag om een vergunning als bedoeld in de
      [artikelen 8][ref1], [9][ref2], [10][ref3] of [11][ref4], en zendt een bewijs van ontvangst waarop die datum is
      vermeld aan degene die de aanvraag om een vergunning heeft ingediend.

      2 Indien Onze Minister van oordeel is dat bij de aanvraag om een vergunning niet aan het bij of krachtens de
      [artikelen 8][ref5], [9][ref6], [10][ref7] of [11][ref8], in samenhang met [artikel 7, eerste lid][ref9], bepaalde
      is voldaan, stelt hij binnen vier weken na de datum van ontvangst degene die de aanvraag om een vergunning heeft
      gedaan in de gelegenheid de aanvraag om een vergunning binnen een door Onze Minister gestelde termijn aan te
      vullen. Indien degene die de aanvraag om een vergunning heeft gedaan geen gebruik maakt van deze gelegenheid
      of indien Onze Minister na aanvulling van de aanvraag om een vergunning van oordeel is dat nog niet is voldaan
      aan het bij of krachtens de artikelen [8][ref10], [9][ref11], [10][ref12] of [11][ref13], in samenhang met
      [artikel 7, eerste lid][ref14], bepaalde, laat Onze Minister de aanvraag om een vergunning buiten behandeling.


