  - number: '10'
    text: |-
      1 Degene die handelingen van categorie A verricht met organismen die behoren tot groep II of handelingen met
      organismen die behoren tot groep III, dan wel zodanige organismen vervaardigt, dient daarvoor, voordat hij daartoe
      overgaat, een aanvraag om een vergunning in bij Onze Minister.

      2 De aanvraag om een vergunning bevat in ieder geval de gegevens, bedoeld in [bijlage 4, onderdeel 3][ref1], bij
      dit besluit. [Artikel 9, derde tot en met vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004703
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel9
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel10
