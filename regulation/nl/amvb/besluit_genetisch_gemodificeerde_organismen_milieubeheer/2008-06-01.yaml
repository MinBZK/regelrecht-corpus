        artikel: '30'
        paragraaf: '3'
  - number: '33'
    text: >-
      1 Onze Minister kan een vergunning voor het in de handel brengen ambtshalve of op een daartoe strekkend verzoek
      wijzigen of intrekken.


      2 In het geval Onze Minister kennis heeft genomen van nieuwe informatie die van invloed kan zijn op de risico's van
      de betrokken genetisch gemodificeerde organismen voor mens of milieu, stelt hij binnen 60 dagen na ontvangst van de
      nieuwe informatie een beoordelingsrapport, overeenkomstig bijlage VI bij [richtlijn nr. 2001/18](32001L0018), op.


      3 Onze Minister zendt het beoordelingsrapport onverwijld aan de vergunninghouder en aan de Commissie van de
      Europese Gemeenschappen.


      4 Onze Minister neemt binnen 75 dagen na verspreiding van het beoordelingsrapport door de Commissie van de Europese
      Gemeenschappen, een besluit tot het al dan niet wijzigen of intrekken van de vergunning.


      5 De termijn voor het nemen van een besluit wordt opgeschort indien een andere lidstaat van de Europese Unie of de
      Commissie van de Europese Gemeenschappen heeft verklaard bedenkingen te hebben tegen het in de handel brengen van
      de genetisch gemodificeerde organismen, en deze bedenkingen handhaaft.


      6 Onze Minister neemt geen besluit dan in overeenstemming met Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit voor zover het betreft die aspecten van de bescherming van het milieu waarvoor deze
      verantwoordelijk is, en na overleg met Onze overige Ministers wie het mede aangaat.


      7 Onze Minister zendt het besluit aan de vergunninghouder en stelt de Commissie van de Europese Gemeenschappen en
      de bevoegde instanties van de andere lidstaten van de Europese Unie daarvan binnen 30 dagen in kennis.


      8 Onze Minister trekt vergunningen ambtshalve in ter uitvoering van beschikkingen van de Raad van de Europese
      Unie dan wel van de Commissie van de Europese Gemeenschappen omtrent geleidelijke uitfasering van genetisch
      gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel33
  - number: '34'
    text: >-
      1 Indien Onze Minister als gevolg van nieuwe of aanvullende informatie dan wel als gevolg van herbeoordeling van
      bestaande informatie aan de hand van nieuwe of nadere wetenschappelijke kennis duidelijke redenen heeft om aan te
      nemen dat de betrokken genetisch gemodificeerde organismen als product of in een product waarvoor Onze Minister
      voor het in de handel brengen een vergunning heeft verleend of de bevoegde instantie van een andere lidstaat van de
      Europese Unie schriftelijke toestemming heeft gegeven, gevaar opleveren voor mens of milieu, kan hij de handelingen
      met die genetisch gemodificeerde organismen als product of in een product in Nederland tijdelijk beperken of
      verbieden.


      2 Onze Minister zendt onverwijld een besluit als bedoeld in het eerste lid, alsmede een nieuwe milieurisicoanalyse,
      de daaraan naar zijn mening te verbinden gevolgen en, indien aanwezig, bijkomende informatie, aan de Commissie van
      de Europese Gemeenschappen en aan de bevoegde instanties van de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel34
  - number: '35'
    text: |-
      1 Onze Minister kan op aanvraag van de vergunninghouder:

      a. een krachtens [artikel 30, eerste lid][ref1], verleende vergunning voor het in de handel brengen verlengen,
      indien deze verlenging uiterlijk negen maanden voor het verstrijken van de geldigheidsduur van de vergunning is
      aangevraagd;

      b. een vóór 17 oktober 2002 verleende vergunning voor het in de handel brengen van de genetisch gemodificeerde
      organismen als product of in producten verlengen, indien deze verlenging uiterlijk op 17 oktober 2006 is
      aangevraagd. De [artikelen 28 tot en met 31][ref2] zijn niet van toepassing.

      2 Een vergunning als bedoeld in het eerste lid, onder a, blijft, indien de verlenging tijdig is aangevraagd, geldig
      tot het moment waarop op de aanvraag om verlenging is beslist.

      3 Een vergunning als bedoeld in het eerste lid, onder b, blijft, indien uiterlijk op 17 oktober 2006 verlenging is
      aangevraagd, geldig tot het moment waarop op de aanvraag om verlenging is beslist.

      4 Een aanvraag om verlenging wordt schriftelijk bij Onze Minister ingediend en bevat in ieder geval:

      a. een afschrift van de vergunning voor het in de handel brengen;

      b. een rapportage als bedoeld in [artikel 23c][ref3], tweede lid, indien monitoring in de oorspronkelijke
      vergunning is voorgeschreven;

      c. nieuwe informatie die over de risico's van de genetisch gemodificeerde organismen als product of in producten
      voor mens of milieu beschikbaar is gekomen;

      d. zo nodig een voorstel tot wijziging of aanvulling van de voorschriften van de verleende vergunning, waaronder in
      ieder geval worden begrepen de voorschriften die verband houden met de toekomstige monitoring en de geldigheidsduur
      van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004703#Artikel23c
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel35
