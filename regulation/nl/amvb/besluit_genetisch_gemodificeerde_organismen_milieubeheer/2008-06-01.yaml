  - number: '25'
    text: |-
      In afwijking van [artikel 24, eerste lid][ref1], kan Onze Minister, indien de genetisch gemodificeerde organismen
      voldoen aan de criteria in bijlage V bij [richtlijn nr. 2001/18](32001L0018), toestaan dat een aanvraag om een
      vergunning voor overige doeleinden, ten minste informatie bevat over de genetisch gemodificeerde organismen, de
      introductie-omstandigheden en het milieu waarin introductie wordt voorzien, de interactie tussen de genetisch
      gemodificeerde organismen en het milieu en de milieurisicoanalyse, voor zover de Raad van de Europese Unie dan wel
      de Commissie van de Europese Gemeenschappen heeft besloten dat voldoende ervaring is opgedaan met de introductie
      van bepaalde genetisch gemodificeerde organismen in een bepaald milieu, en daarvoor bij, bij regeling van Onze
      Minister aan te wijzen, beschikkingen op grond van artikel 7, derde lid, van [richtlijn nr. 2001/18](32001L0018),
      vereenvoudigde procedures heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel24
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004703
        artikel: '24'
        paragraaf: '3'
  - number: '26'
    text: >-
      De houder van een vergunning voor overige doeleinden, die genetisch gemodificeerde organismen aan een ander ter
      beschikking stelt, draagt er zorg voor dat op het etiket van de verpakking van of het bijgevoegde document bij de
      genetisch gemodificeerde organismen duidelijk zichtbaar is aangegeven dat er genetisch gemodificeerde organismen
      in aanwezig zijn, overeenkomstig de toepasselijke delen van bijlage IV bij [richtlijn nr. 2001/18](32001L0018)
      en overeenkomstig bij regeling van Onze Minister aan te wijzen beschikkingen van de Raad van de Europese Unie dan
      wel de Commissie van de Europese Gemeenschappen op grond van artikel 26, tweede lid, van [richtlijn nr. 2001/18]
      (32001L0018).
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel26
  - number: '27'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] zijn niet
      van toepassing op:

      1. een aanvraag om een vergunning voor het in de handel brengen als bedoeld in [artikel 28, eerste lid][ref3],
      en [35, vierde lid][ref4];

      2. een wijziging of een intrekking als bedoeld in [artikel 9.2.2.3, vijfde lid, van de Wet milieubeheer][ref5].


