  - number: '8'
    text: |-
      1 Degene die handelingen van categorie A verricht met organismen die behoren tot groep I, dan wel zodanige
      organismen vervaardigt, dient daarvoor, voordat hij daartoe voor de eerste keer overgaat, een aanvraag om een
      vergunning in bij Onze Minister.

      2 De aanvraag om een vergunning bevat in ieder geval de gegevens, bedoeld in [bijlage 4, onderdeel 1][ref1].

      3 De persoon, bedoeld in het eerste lid, maakt jaarlijks voor 1 juni een verslag over de in het eerste lid bedoelde
      handelingen in het voorafgaande kalenderjaar en houdt dit gedurende 5 jaar ter beschikking van Onze Minister.
      [Artikel 7, eerste lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004703
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel8
