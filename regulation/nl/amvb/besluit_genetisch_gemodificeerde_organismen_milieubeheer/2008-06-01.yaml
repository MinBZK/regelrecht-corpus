  - number: '17'
    text: |-
      1 Het is verboden over te gaan tot ingeperkt gebruik van genetisch gemodificeerde organismen, als bedoeld
      in de [artikelen 8][ref1], [9][ref2], [10][ref3] of [11][ref4], zonder vergunning die door Onze Minister is
      verleend naar aanleiding van een aanvraag om een vergunning als bedoeld in het betrokken artikel. Het verbod
      in de eerste volzin geldt niet voor zover toepassing is gegeven aan [artikel 9, derde lid][ref5], of aan
      [artikel 10, tweede lid, j° artikel 9, derde lid][ref6].

      2 Op een aanvraag om een vergunning als bedoeld in [artikel 11][ref7] beslist Onze Minister binnen 87 dagen na de
      datum van ontvangst van de aanvraag om een vergunning.

      3 Op een aanvraag om een vergunning als bedoeld in de [artikelen 8][ref8], [9][ref9] en [10][ref10] beslist Onze
      Minister binnen 45 dagen na de datum van ontvangst van de aanvraag om een vergunning.

      4 Op de voorbereiding van een besluit tot verlening, wijziging of intrekking van een vergunning die wordt of
      is verleend naar aanleiding van een aanvraag om een vergunning als bedoeld in [artikel 8][ref11], [9][ref12] of
      [10][ref13], is [afdeling 3.4 van de Algemene wet bestuursrecht][ref14] niet van toepassing.


