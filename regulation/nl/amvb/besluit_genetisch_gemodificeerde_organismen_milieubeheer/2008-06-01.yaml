  - number: '14'
    text: |-
      1 Onze Minister doet van een aanvraag om een vergunning als bedoeld in [artikel 11][ref1], zo spoedig mogelijk
      mededeling; hij doet dit in elk geval binnen 45 dagen na de datum van ontvangst van de aanvraag om een vergunning,
      dan wel, indien een besluit om de aanvraag om een vergunning buiten behandeling te laten. als bedoeld in
      [artikel 12, tweede lid][ref2], in beroep is vernietigd, uiterlijk twee weken na de dagtekening van de uitspraak
      waarbij het besluit is vernietigd.

      2 Onze Minister legt met een exemplaar van de aanvraag om een vergunning stukken ter inzage, die bevatten:

      a. naam en adres van degene die de aanvraag om een vergunning doet;

      b. de beschrijving van het genetisch gemodificeerde organisme of de genetisch gemodificeerde organismen en van de
      voorgenomen handelingen;

      c. de plaats en het doel van het ingeperkt gebruik;

      d. de volgende gegevens en bescheiden, indien deze niet gelijktijdig ter inzage liggen ten behoeve van de
      totstandkoming van de beschikking op de aanvraag om een vergunning op grond van de [Wet milieubeheer][ref3] voor de
      inrichting waarin de betrokken handeling plaatsheeft:

      1°. gegevens over de installatie;

      2°. gegevens over het afvalstoffenbeheer;

      3°. gegevens over de veiligheidsmaatregelen, het toezicht op de veiligheid en de noodmaatregelen en

      4°. de analyse van de risico’s voor mens of milieu, als bedoeld in [artikel 5, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004703#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0004703#Artikel5
    url: https://wetten.overheid.nl/BWBR0004703/2008-06-01#Artikel14
