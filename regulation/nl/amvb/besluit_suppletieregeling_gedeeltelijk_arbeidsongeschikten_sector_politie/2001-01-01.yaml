  - number: '17.4'
    text: |-
      Het bevoegd gezag stelt ambtshalve van iedere overheidswerknemer als bedoeld in het eerste lid, het recht op
      suppletie vast met inachtneming van het in dit artikel bepaalde.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel17
  - number: '17.5'
    text: |-
      [Artikel 6, eerste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat voor
      de vaststelling van de berekeningsgrondslag voor de betrokkene als dagloon zoals bepaald in
      [artikel 42, derde en vierde lid, van de Wet privatisering ABP][ref2], zonder toepassing van de maximumdagloongrens
      van [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel17
    references:
      - id: ref1
