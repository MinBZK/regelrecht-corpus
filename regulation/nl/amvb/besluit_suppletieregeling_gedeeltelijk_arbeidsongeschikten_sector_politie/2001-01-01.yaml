  - number: '19'
    text: |-
      Indien het niveau van de WAO-uitkering als bedoeld in [paragraaf 9 van de Wet privatisering ABP][ref1] een
      algemene neerwaartse wijziging ondergaat, wordt deze neerwaartse wijziging, behoudens indien sociale partners
      anders overeenkomen binnen zes maanden na de datum van het *Staatsblad* waarin de maatregel is gepubliceerd, op
      overeenkomstige wijze ten aanzien van de suppletie doorgevoerd, vanaf de in het *Staatsblad* vermelde datum van
      inwerkingtreding van bedoelde maatregel, doch niet eerder dan zes maanden na de datum van het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Paragraaf9
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel19
