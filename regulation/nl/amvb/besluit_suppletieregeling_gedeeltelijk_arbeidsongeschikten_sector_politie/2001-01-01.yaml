        paragraaf: '9'
  - number: '20'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel20
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit suppletieregeling gedeeltelijk arbeidsongeschikten sector politie.'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel21
