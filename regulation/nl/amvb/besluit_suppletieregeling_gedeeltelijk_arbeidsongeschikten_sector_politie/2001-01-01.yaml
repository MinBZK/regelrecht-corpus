        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '17.6'
    text: |-
      Bij de bepaling op 1 januari 1996 van de periode waarover herplaatsingswachtgeld is genoten, wordt deze periode
      naar beneden afgerond op een hele maand.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel17
  - number: '18'
    text: |-
      Indien de overheidswerknemer, bedoeld in [artikel 2 van de Wet privatisering ABP][ref1], op 1 januari 1996
      onafgebroken gedurende een periode van 52 weken of langer onafgebroken arbeidsongeschikt is geweest in de zin van
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] en de mate van zijn algemene
      invaliditeit op grond van de [Algemene burgerlijke pensioenwet](onbekend) is vastgesteld op ten minste 15 procent
      danwel de mate van arbeidsongeschiktheid op grond van de ministeriële regeling op grond van artikel 8, derde lid,
      van de Algemene Arbeidsongeschiktheidswet, zoals dit artikel luidde op de dag voorafgaand aan de inwerkingtreding
      van de [Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref3] is vastgesteld op ten minste 25
      procent, binnen een periode van zes maanden is aan te merken als betrokkene, geldt voor hem als dagloon het dagloon
      zoals bepaald in [artikel 39, vierde en vijfde lid, van de Wet privatisering ABP][ref4], zonder toepassing van de
      maximumdagloongrens van [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0008658
      [ref4]: https://wetten.overheid.nl/BWBR0007791#Artikel39
      [ref5]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel18
