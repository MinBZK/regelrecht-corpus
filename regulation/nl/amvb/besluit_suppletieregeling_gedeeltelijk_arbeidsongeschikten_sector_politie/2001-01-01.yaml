$id: besluit_suppletieregeling_gedeeltelijk_arbeidsongeschikten_sector_politie
regulatory_layer: AMVB
publication_date: '2015-08-26'
valid_from: '2001-01-01'
bwb_id: BWBR0008099
url: https://wetten.overheid.nl/BWBR0008099/2001-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 23 februari 1996, directoraat-generaal
    voor Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Onderwijs en Personeelsbeleid, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA96/U468;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993 en artikel 9, zesde lid, van de LSOP-wet;

    De Raad van State gehoord (advies van 6 mei 1996, No.W04.96.0089);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 7 juni 1996, directoraat-generaal
    voor Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Onderwijs en Personeelsbeleid, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA96/1451;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
  - number: 1.a
    text: |-
      arbeidsongeschiktheid: arbeidsongeschiktheid in de zin van
      [artikel 18, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 1.b
    text: |-
      arbeidsongeschiktheidsuitkering: een periodieke uitkering, toegekend op grond van arbeidsongeschiktheid, die
      voortvloeit uit enig dienstverband van betrokkene;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
  - number: 1.c
    text: |-
      WAO-uitkering: de uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.d
    text: |-
      betrokkene: de overheidswerknemer, bedoeld in [artikel 2 van de Wet privatisering ABP][ref1],
      aan wie uit een dienstbetrekking bij de sector politie ontslag is verleend op grond
      van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte als bedoeld in
      [artikel 94, eerste lid, onderdeel e, van het Besluit algemene rechtspositie politie][ref2], en die ten tijde van
      dat ontslag minder dan 80% arbeidsongeschikt is, met uitzondering van degene die zijn resterende verdienvermogen
      volledig benut in een of meer aangehouden betrekkingen;


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel94
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: '94'
  - number: 1.e
    text: |-
      bevoegd gezag: het bevoegd gezag, bedoeld in [artikel 1, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.f
    text: |-
      suppletie: de suppletie, bedoeld in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel6
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '6'
        paragraaf: '3'
  - number: 1.g
    text: |-
      dagloon: het dagloon in de zin van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] zonder toepassing
      van de maximumdagloongrens van [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2],
      vermeerderd met het bedrag aan pensioenbijdrageverhaal, bedoeld in
      [artikel 10 van de Wet financiële voorzieningen privatisering ABP][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Artikel10
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007211
        artikel: '10'
  - number: 1.h
    text: |-
      berekeningsgrondslag van de suppletie: het dagloon van betrokkene op de dag voorafgaande aan het ontslag ter zake
      waarvan hem recht op suppletie wordt toegekend, voor zover dat betrekking heeft op het inkomen uit de betrekking
      waaraan het recht op suppletie wordt ontleend;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
  - number: 1.i
    text: |-
      werkloosheidsuitkering: een periodieke uitkering ter zake van ontslag of werkloosheid, die voortvloeit uit enig
      dienstverband van betrokkene;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
  - number: 1.j
    text: |-
      ZW-uitkering: ziekengeld als bedoeld in [artikel 19 van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '19'
  - number: '2.1'
    text: |-
      Betrokkene heeft recht op suppletie vanaf het tijdstip dat aan hem ontslag is verleend op grond van ongeschiktheid
      tot het verrichten van zijn arbeid wegens ziekte.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing indien het in dat lid bedoelde ontslag wordt verleend na het moment dat
      de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte 90 maanden onafgebroken heeft geduurd. Voor
      het bepalen van genoemde periode van 90 maanden worden perioden van ziekte samengeteld indien die elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het verplichtingen- en sanctieregime van de [Werkloosheidswet][ref1] is van overeenkomstige toepassing op het recht
      op suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.2'
    text: |-
      Onverminderd het eerste lid, omvat passende arbeid in de zin van de [Werkloosheidswet][ref1] voor de toepassing op
      de suppletie mede gangbare arbeid. Hierbij wordt onder gangbare arbeid verstaan: alle algemeen geaccepteerde arbeid
      waartoe de betrokkene met zijn krachten en bekwaamheden in staat is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '4'
    text: 'Het recht op suppletie komt niet tot uitbetaling voor zolang:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel4
  - number: 4.a
    text: betrokkene een WAO-uitkering ontvangt, berekend naar een mate van arbeidsongeschiktheid van 80% of meer;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel4
  - number: 4.b
    text: |-
      betrokkene is herplaatst in een functie waaraan hij recht kan ontlenen op herplaatsingstoelage als bedoeld in
      paragraaf 9 van het pensioenreglement van de Stichting Pensioenfonds ABP.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel4
  - number: '5'
    text: 'Het recht op suppletie eindigt:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel5
  - number: 5.a
    text: na ommekomst van de duur van de suppletie;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel5
  - number: 5.b
    text: met ingang van de dag volgende op die waarop de betrokkene is overleden;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel5
  - number: 5.c
    text: met ingang van de eerste dag van de maand waarin de betrokkene de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel5
  - number: '6.1'
    text: De suppletie bedraagt een percentage van de berekeningsgrondslag van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel6
  - number: '6.2'
    text: |-
      De berekeningsgrondslag van de suppletie wordt telkens aangepast aan de voor de sector politie geldende algemene
      bezoldigingswijziging.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel6
  - number: '6.3'
    text: 'Het in het eerste lid bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel6
  - number: 6.3.a
    text: gedurende de eerste drieëndertig maanden 80%; en
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel6
  - number: 6.3.b
    text: gedurende de daaropvolgende drieëndertig maanden 70%.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel6
  - number: '7.1'
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], wordt, indien het in [artikel 2][ref2] bedoelde ontslag is verleend
      op een latere datum dan het moment waarop de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte 24
      maanden onafgebroken heeft geduurd, de in [artikel 6, derde lid][ref3], genoemde periode verminderd met de periode
      die gelegen is tussen de ontslagdatum en het moment waarop genoemde ongeschiktheid 24 maanden onafgebroken heeft
      geduurd. Deze vermindering vindt plaats, te beginnen met de periode gedurende welke de betrokkene recht heeft op
      80% van de berekeningsgrondslag van de suppletie.


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008099#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008099#Artikel6
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008099
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008099
        artikel: '6'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      Voor het bepalen van de in het eerste lid bedoelde periode van 24 maanden worden perioden van ziekte samengeteld
      indien die elkaar met een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de betrokkene gedurende de periode dat recht bestaat op suppletie, ter zake van de dienstbetrekking waaruit
      dat recht op suppletie is ontstaan, een werkloosheidsuitkering of een arbeidsongeschiktheidsuitkering of een ZW-
      uitkering ontvangt, wordt het bedrag van genoemde uitkering of uitkeringen in mindering gebracht op het bedrag van
      de suppletie. Indien de bedoelde betrokkene uit hoofde van twee of meer dienstbetrekkingen als overheidswerknemer
      recht heeft op een WAO-uitkering, wordt die uitkering voor de toepassing van de eerste volzin, toegerekend aan de
      dienstbetrekking ter zake waarvan hem recht op suppletie is toegekend, naar rato van de feitelijk genoten inkomsten
      uit hoofde van de desbetreffende dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien de betrokkene recht heeft op een arbeidsongeschiktheidsuitkering die kan worden toegerekend aan
      een dienstbetrekking, waaruit hij is ontslagen op een datum, gelegen vóór de datum van ontslag uit de
      dienstbetrekking ter zake waarvan hem recht op suppletie is toegekend, welk recht voortduurt na laatstgenoemde
      datum, wordt, ingeval van een verhoging van de mate van de arbeidsongeschiktheid waardoor het bedrag
      van die arbeidsongeschiktheidsuitkering verhoogd wordt, uitsluitend het bedrag van die verhoging van die
      arbeidsongeschiktheidsuitkering in mindering gebracht op het bedrag van de suppletie. Indien de bedoelde betrokkene
      uit hoofde van twee of meer dienstbetrekkingen als overheidswerknemer recht heeft op een WAO-uitkering, wordt die
      uitkering voor de toepassing van de vorige volzin toegerekend aan de in die volzin eerstgenoemde dienstbetrekking,
      naar rato van de feitelijk genoten inkomsten uit hoofde van de desbetreffende dienstbetrekkingen.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien de toerekeningswijze, bedoeld in het tweede lid, in een individueel geval naar het oordeel van het bevoegd
      gezag leidt tot een kennelijk onredelijke uitkomst voor de betrokkene, kan het bevoegd gezag ten gunste van die
      betrokkene tot een wijze van toerekenen besluiten die met de strekking van dit artikel overeenkomt.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien betrokkene gedurende de periode dat recht bestaat op suppletie inkomsten verwerft uit of in verband
      met arbeid of bedrijf, anders dan bedoeld in [artikel 8][ref1], wordt de berekeningsgrondslag van de suppletie
      verminderd met de inkomsten uit of in verband met arbeid of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel8
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '8'
        paragraaf: '3'
  - number: '9.2'
    text: |-
      Indien de betrokkene gedurende de periode dat recht bestaat op suppletie recht krijgt op een ZW-uitkering, wordt de
      berekeningsgrondslag van de suppletie verminderd met de ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onder inkomsten uit of in verband met arbeid of bedrijf, bedoeld in het eerste lid, worden begrepen inkomsten uit
      of in verband met arbeid of bedrijf die zijn ontstaan:
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
  - number: 9.3.a
    text: |-
      met ingang van of na de dag waarop het ontslag ter zake waarvan de betrokkene suppletie is toegekend, hem is
      aangezegd;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
  - number: 9.3.b
    text: |-
      gedurende non-activiteit, vakantie of verlof onmiddellijk voorafgaande aan het ontslag ter zake waarvan de
      betrokkene suppletie is toegekend;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
  - number: 9.3.c
    text: |-
      vóór de dag van het ontslag ter zake waarvan de betrokkene suppletie is toegekend, anders dan bedoeld in onderdeel
      a en b, en [artikel 8, tweede lid, en onderdeel ][ref1], voor zover uit deze arbeid of dit bedrijf na die dag
      inkomsten of meer inkomsten worden genoten door de betrokkene, terwijl die inkomsten of die meerdere inkomsten of
      een gedeelte daarvan, het gevolg zijn van een verhoogde werkzaamheid danwel verband houden met het ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel8
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '8'
        paragraaf: '3'
  - number: '9.4'
    text: In bijzondere gevallen kan het bevoegd gezag ten gunste van betrokkene afwijken van het derde lid.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel9
  - number: '10'
    text: |-
      Voor de toepassing van de [artikelen 8][ref1] en [9][ref2] worden uitkeringen steeds geacht onverminderd door
      betrokkene te zijn genoten indien, als gevolg van handelingen of het nalaten van handelingen door betrokkene, één
      of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de [Ziektewet][ref3]
      danwel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop betrokkene recht
      heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008099#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008099
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0001888
  - number: 10.a
    text: vermindering ondergaan;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel10
  - number: 10.b
    text: blijvend geheel geweigerd worden;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel10
  - number: 10.c
    text: tijdelijk of blijvend gedeeltelijk geweigerd worden; danwel
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel10
  - number: 10.d
    text: in uitkeringsduur beperkt worden.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel10
  - number: '11.1'
    text: |-
      Zo spoedig mogelijk na het overlijden van de betrokkene, aan wie een suppletie is toegekend, keert het bevoegd
      gezag een bedrag uit, gelijk aan de berekeningsgrondslag van de suppletie van betrokkene over een tijdvak van drie
      maanden.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: '11.2'
    text: 'Het in het eerste lid bedoelde bedrag wordt uitgekeerd:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: 11.2.a
    text: aan de langstlevende der echtgenoten indien de overledene niet duurzaam van de andere echtgenoot gescheiden leefde;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: 11.2.b
    text: bij ontstentenis van de onder *a* bedoelde persoon aan de minderjarige wettige of natuurlijke kinderen;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: 11.2.c
    text: |-
      bij ontstentenis van de onder *a* en *b* bedoelde personen aan degenen ten aanzien van wie de overledene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: '11.3'
    text: |-
      Voor de toepassing van het tweede lid kan tegelijkertijd slechts één persoon als echtgenoot worden aangemerkt en
      worden mede als echtgenoot aangemerkt niet gehuwde personen van verschillend of gelijk geslacht die duurzaam een
      gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste of tweede
      graad bestaat, alsmede de geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: '11.4'
    text: |-
      Van een gezamenlijke huishouding als bedoeld in het derde lid kan slechts sprake zijn indien twee ongehuwde
      personen gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in de kosten van de
      huishouding danwel op andere wijze in elkaars verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
  - number: '11.5'
    text: |-
      Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nagelaten betrekkingen van de betrokkene ter zake van diens overlijden aanspraak kunnen maken uit
      hoofde van een of meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de
      [Ziektewet][ref1] danwel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop
      betrokkene recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '12.1'
    text: Het bevoegd gezag stelt op aanvraag vast of er recht op suppletie bestaat.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel12
  - number: '12.2'
    text: Een aanvraag wordt ingediend door middel van een door het bevoegd gezag beschikbaar gesteld aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het bevoegd gezag betaalt de suppletie zo spoedig mogelijk uit, doch uiterlijk binnen een maand nadat het het recht
      op die suppletie heeft vastgesteld. Het bevoegd gezag betaalt de suppletie in de regel per maand achteraf.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel12
  - number: '12.4'
    text: |-
      De suppletie die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. Het bevoegd gezag kan in bijzondere gevallen ten gunste van betrokkene
      afwijken van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het bevoegd gezag betaalt ambtshalve een naar redelijkheid vast te stellen voorschot op een suppletie indien
      uitsluitend onzekerheid bestaat omtrent de hoogte van de suppletie, omtrent het van de suppletie aan de betrokkene
      te betalen bedrag of omtrent het nakomen van een verplichting als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel3
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008099
        artikel: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Het bevoegd gezag kan op aanvraag van de betrokkene een naar redelijkheid vast te stellen voorschot op een
      suppletie betalen indien onzekerheid bestaat omtrent het recht op suppletie.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel13
  - number: '13.3'
    text: Een voorschot, bedoeld in het eerste en tweede lid, wordt beschouwd als een suppletie.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het bevoegd gezag kan regels stellen op grond waarvan in bij die regels aan te geven gevallen en met inachtneming
      van bij die regels te stellen beperkingen de betrokkene bevoegd is deel te nemen aan een opleiding of scholing
      in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de betrokkene die recht heeft op suppletie gaat deelnemen aan een voor hem noodzakelijke opleiding of
      scholing, blijft volgens door het bevoegd gezag te stellen regels het recht op suppletie bestaan totdat die
      opleiding of scholing is geëindigd.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel14
  - number: '14.3'
    text: |-
      In de door het bevoegd gezag te stellen regels, bedoeld in het tweede lid, worden in ieder geval voorschriften en
      beperkingen gegeven met betrekking tot de aard, de omvang en de duur van de in het tweede lid bedoelde opleiding
      of scholing.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel14
  - number: '15.1'
    text: De betrokkene die onbeloonde activiteiten verricht, is verplicht daarvan mededeling te doen aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel15
  - number: '15.2'
    text: |-
      De betrokkene heeft voor het verrichten van bijzondere vormen van onbeloonde activiteiten voorafgaande toestemming
      van het bevoegd gezag nodig.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel15
  - number: '15.3'
    text: Het bevoegd gezag kan nadere regels stellen ten aanzien van de in het tweede lid bedoelde toestemming.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel15
  - number: '16'
    text: 'Het bevoegd gezag stelt nadere regels vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel16
  - number: 16.a
    text: een doelmatige controle ten aanzien van de betrokkenen;
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel16
  - number: 16.b
    text: het genieten van vakantie tijdens de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel16
  - number: '17.1'
    text: |-
      Degene die op 31 december 1995 recht heeft op een herplaatsingswachtgeld als bedoeld in [artikel K 4, tweede lid]
      (onbekend), juncto [artikel K 6 van de Algemene burgerlijke pensioenwet](onbekend), zoals die wet luidde op die
      datum, waarvan de duur op 1 januari 1996 nog niet is verstreken, heeft recht op suppletie.
    url: https://wetten.overheid.nl/BWBR0008099/2001-01-01#Artikel17
