  - number: '17.3'
    text: |-
      De [artikelen 3 tot en met 5][ref1], [6, tweede lid][ref2], [7 tot en met 11][ref3], alsmede
      [artikel 12, derde lid tot en met 16][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008099#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008099#Artikel6
