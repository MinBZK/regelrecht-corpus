  - number: 19b
    text: |-
      1 Indien de meetwaarde van een basisschool voor het schooljaar 2000–2001, onderscheidenlijk 2001–2002, zoals
      berekend op grond van het tweede lid, lager is dan de referentiewaarde van de basisschool zoals berekend op grond
      van het derde lid, komt zij in aanmerking voor overgangsformatie in aanvulling op de formatie zoals die is berekend
      op grond van [de artikelen 4 tot en met 15d][ref1].

      2 De meetwaarde voor het schooljaar 2000–2001, onderscheidenlijk 2001–2002, wordt berekend door de som van
      de aantallen formatierekeneenheden zoals die voor het desbetreffende schooljaar zijn berekend op grond van de
      [artikelen 8][ref2], [13a, tweede lid][ref3], [15][ref4] en [15a][ref5], te delen door de som van het aantal
      leerlingen en het schoolgewicht op de voor het desbetreffende schooljaar geldende teldatum. De meetwaarde wordt
      rekenkundig afgerond op twee decimalen.

      3 De referentiewaarde wordt aan de hand van het aantal leerlingen op 1 oktober 1999 berekend door de som van
      de formatie voor de vervulling van reguliere taken van de school en de formatie voor speciale doeleinden te
      verminderen met de som van de opslag in verband met de toepassing van de regeling bevordering arbeidsparticipatie
      ouderen, het in formatierekeneenheden uitgedrukte deel van de formatie voor de schoolleiding, de vermeerdering
      van de basisformatie ten behoeve van basisscholen met een of meer nevenvestigingen en de toeslag voor kleine
      scholen, en de uitkomst van deze berekening te delen door de som van het aantal leerlingen en het schoolgewicht op
      1 oktober 1999. In geval van samenvoeging van basisscholen wordt voor de toepassing van de eerste volzin onder het
      aantal leerlingen verstaan het aantal leerlingen van de samengevoegde scholen tezamen. De referentiewaarde wordt
      rekenkundig afgerond op twee decimalen.

      4 De referentiewaarde wordt berekend op grond van de artikelen van dit besluit zoals die luidden op de dag
      voorafgaand aan de inwerkingtreding van het besluit van 12 april 2000, houdende wijziging van het Formatiebesluit
      WPO en enkele andere besluiten in verband met onder meer de verkleining van de groepsgrootte voor de 4- tot en met
      7-jarige leerlingen van basisscholen (Stb. 179), met uitzondering van de vermeerdering van de basisformatie ten
      behoeve van basisscholen met een of meer nevenvestigingen, de toeslag voor kleine scholen en het schoolgewicht op 1
      oktober 1999, die berekend worden op grond van de[ artikelen 6][ref6], [13][ref7] en [15b][ref8] zoals deze luiden
      met ingang van de dag van inwerkingtreding van voornoemd besluit.

      5 De overgangsformatie voor het schooljaar 2000–2001, onderscheidenlijk het schooljaar 2001–2002, wordt berekend
      door het verschil tussen de referentiewaarde en de voor het desbetreffende schooljaar berekende meetwaarde te
      vermenigvuldigen met de som van het aantal leerlingen en het schoolgewicht op de voor het desbetreffende schooljaar
      geldende teldatum. De uitkomst wordt rekenkundig afgerond op een geheel getal.

      6 Scholen die bij de aanvang van het schooljaar 2000–2001 in aanmerking komen voor de verhoging, bedoeld in
      [artikel 3][ref9], komen niet aanmerking voor overgangsformatie.


