    text: |-
      Wijziging in de besteding van de formatie voor personeelsbeleid, kwaliteitsverbetering
      en innovatie van een basisschool mag niet leiden tot kosten van uitkeringen krachtens het
      [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
