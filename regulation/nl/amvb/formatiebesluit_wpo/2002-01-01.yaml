      1 Het formatiebudget waarop het bevoegd gezag van een basisschool per schooljaar aanspraak heeft, bestaat uit:

      a. de basisformatie, bedoeld in [artikel 120, eerste lid onderdeel a, van de wet][ref1],

      b. in voorkomende gevallen formatie voor speciale doeleinden, bedoeld in
      [artikel 120, eerste lid onderdeel b, van de wet][ref2],

      c. in voorkomende gevallen groeiformatie en bijzondere groeiformatie als bedoeld in de [artikelen 15c][ref3] tot en
      met [15c3][ref4], en

      d. in voorkomende gevallen aanvullende formatie als bedoeld in [artikel 120, vijfde lid, van de wet][ref5].

      2 De omvang van het formatiebudget is de som van de aantallen formatierekeneenheden zoals voor de school berekend
      op grond van de [artikelen 2 tot en met 15c3][ref6].

      3 De omvang van het formatiebudget van een basisschool die nog geen leerlingen heeft, bedraagt 233
      formatierekeneenheden voor een periode van ten hoogste acht weken.

      4 Onverminderd het derde lid, heeft een basisschool die op de teldatum geen leerlingen heeft, geen aanspraak op
      formatierekeneenheden.


