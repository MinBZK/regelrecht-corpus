articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      wet: [Wet op het primair onderwijs][ref1];

      Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      school: een basisschool of een speciale school voor basisonderwijs, tenzij het tegendeel blijkt;

      samenwerkingsverband: een samenwerkingsverband als bedoeld in [artikel 18][ref2] van de wet;

      centrale dienst: centrale dienst die formatie ontvangt als bedoeld in artikel 132 van de wet;

      bevoegd gezag: wat betreft

      a. een openbare school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen, dan wel het krachtens een
      gemeenschappelijke regeling bevoegde orgaan;

      b. een bijzondere school: de rechtspersoon, bedoeld in artikel 55 van de wet;

      teldatum: 'voor wat betreft:'

      a. basisscholen: een van de data, bedoeld in artikel 121, eerste en tweede lid, van de wet,

      b. speciale scholen voor basisonderwijs: een van de data, bedoeld in artikel 122, derde lid, van de wet;

      schooljaar: het tijdvak van 1 augustus tot en met 31 juli daaropvolgend;

      leerling met een niet-Nederlandse culturele achtergrond: leerling:

      a. die behoort tot de Molukse bevolkingsgroep,

      b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige
      Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije,

      c. van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de Nederlandse Antillen of Aruba,

      d. van wie ten minste een van de ouders of voogden door Onze Minister van Justitie als vluchteling is toegelaten op
      grond van artikel 15 van de Vreemdelingenwet (Stb. 1965, 40),

      e. van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië;.

      formatiebudget: het formatiebudget, bedoeld in artikel 123, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0005441#Artikel18
