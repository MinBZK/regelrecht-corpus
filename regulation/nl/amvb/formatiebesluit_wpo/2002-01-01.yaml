  - number: 17b
    text: |-
      Indien het verbruik van het aantal formatierekeneenheden in een maand afwijkt van het aantal formatierekeneenheden,
      dat op grond van het formatiebudget beschikbaar is voor de school, kan een bevoegd gezag het te weinig of te veel
      verbruikte aantal formatierekeneenheden van die maand besteden onderscheidenlijk minder besteden in een of meer
      andere maanden van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel17b
  - number: 17c
    text: |-
      1 Het aantal formatierekeneenheden, bedoeld in artikel 124, eerste lid, van de wet bedraagt 9,1.

      2 Het aantal formatierekeneenheden, bedoeld in artikel 124, tweede lid, van de wet bedraagt 13,5.

      3 Het op grond van het eerste onderscheidenlijk het tweede lid berekende aantal formatierekeneenheden wordt
      rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel17c
  - number: 17d
    text: |-
      1 Het aantal formatierekeneenheden, bedoeld in artikel 125, eerste en tweede lid, van de wet bedraagt voor elk
      van de vier schooljaren volgend op het schooljaar van de toelating van de leerling tot de speciale school voor
      basisonderwijs 13,5 formatierekeneenheden, met dien verstande dat dit aantal in het eerste schooljaar volgend op de
      toelating 22,6 formatierekeneenheden bedraagt indien de toelating heeft plaatsgevonden in de periode van 2 oktober
      tot 1 augustus daaropvolgend.

      2 Het op grond van het eerste lid berekende aantal formatierekeneenheden wordt rekenkundig afgerond op een geheel
      getal.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel17d
  - number: '18'
    text: |-
      1 Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar van het beschikbare
      formatiebudget formatierekeneenheden overdragen aan een andere school, een school voor speciaal onderwijs, een
      school voor voortgezet speciaal onderwijs” een school voor speciaal en voortgezet speciaal onderwijs of een
      instelling als bedoeld in de [Wet op de expertisecentra][ref1] of [deel II van de Wet op het voortgezet onderwijs]
      (onbekend) van hetzelfde bevoegd gezag of van een ander bevoegd gezag dan wel het bestuur van een centrale dienst.
      Het aantal formatierekeneenheden bedoeld in de eerste volzin, is een geheel getal.

      2 Overdracht van formatierekeneenheden anders dan op grond van de overdrachtsverplichtingen ingevolge de
      [artikelen 124](onbekend) en [125 van de wet en artikel XLIV van de wet van 2 april 1998 tot wijziging van enkele
      onderwijswetten en technische wijziging van enkele andere wetten in verband met het totstandbrengen van onder meer
      een Wet op het primair onderwijs en een Wet op de expertisecentra](onbekend) (Stb. 1998, 228) mag niet leiden tot
      kosten van ontslaguitkeringen krachtens het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref2].

      3 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, deelt het bevoegd gezag
      van de overdragende school en dat van de ontvangende school, instelling of centrale dienst voor 15 mei voorafgaande
      aan het desbetreffende schooljaar aan Onze Minister mee hoeveel formatierekeneenheden worden overgedragen. Het
      bevoegd gezag kan voor 1 oktober van een schooljaar een nadere beslissing als bedoeld in het eerste lid nemen en
      voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden overgedragen.


