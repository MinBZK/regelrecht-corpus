    text: |-
      Vanwege herbezetting in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen, bedoeld
      in [hoofdstuk I-V van het Rechtspositiebesluit onderwijspersoneel][ref1], wordt het aantal formatierekeneenheden
      dat voor een basisschool is berekend op grond van de [artikelen 8][ref2], [13][ref3], [13a][ref4], [15][ref5] en
      [15a][ref6], verhoogd met het aantal formatierekeneenheden dat behoort bij het gedeelte van de betrekkingsomvang
      dat kan worden herbezet in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen.


