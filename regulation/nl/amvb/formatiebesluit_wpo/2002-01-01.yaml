    text: |-
      1 De basisformatie, bedoeld in artikel 16a, eerste lid onderdeel a, van een speciale school voor basisonderwijs
      bestaat uit het aantal leerlingen op de teldatum vermenigvuldigd met 9,1 formatierekeneenheden. Het aldus berekende
      aantal formatierekeneenheden wordt rekenkundig afgerond op een geheel getal.

      2 De formatie, bedoeld in artikel 16a, eerste lid onderdeel d, van een speciale school voor basisonderwijs bestaat
      uit:

      a. het aantal formatierekeneenheden voor schoolleiding en

      b. het aantal formatierekeneenheden dat behoort bij het gedeelte van een betrekkingsomvang dat kan worden herbezet
      in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen, bedoeld in [hoofdstuk I-V van
      het Rechtspositiebesluit onderwijspersoneel](onbekend), waarbij de uitkomst rekenkundig wordt afgerond op een
      geheel getal.

      3 Het in het tweede lid, onderdeel a, bedoelde aantal formatierekeneenheden voor schoolleiding wordt berekend
      volgens het onderstaande schema:








                    aantal leerlingen op de teldatum


