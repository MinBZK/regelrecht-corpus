  - number: '14'
    text: |-
      De formatie voor speciale doeleinden van een basisschool omvat:

      a. de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie, en

      b. de formatie voor de bestrijding van onderwijsachterstanden, bedoeld in artikel 120 van de wet.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel14
  - number: '15'
    text: |-
      De formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie van een basisschool wordt berekend
      door de som van het aantal leerlingen op de teldatum en het schoolgewicht, bedoeld in [artikel 15b][ref1], te
      vermenigvuldigen met 0,29.


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel15b
