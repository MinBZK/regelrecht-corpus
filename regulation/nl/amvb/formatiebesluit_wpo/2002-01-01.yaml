    text: |-
      1 Het bestuur van een centrale dienst kan telkens voor de periode van een schooljaar overeenkomstig het
      zorgplan formatierekeneenheden overdragen aan een school, of indien het andere formatie betreft dan bedoeld
      in [artikel 132 van de wet][ref1], een school voor speciaal onderwijs, een school voor voortgezet speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs, of een instelling als bedoeld in de
      [Wet op de expertisecentra][ref2] of [deel II van de Wet op het voortgezet onderwijs](onbekend). Indien het
      formatie betreft als bedoeld in [artikel 132 van de wet][ref3] is de overdracht, bedoeld in de eerste volzin,
      uitsluitend mogelijk indien dit in overeenstemming is met het zorgplan.

      2 Overdracht van formatierekeneenheden mag niet leiden tot kosten van ontslaguitkeringen krachtens het Besluit
      Werkloosheid onderwijs- en onderzoekpersoneel.

      3 Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, deelt het bestuur van
      de overdragende centrale dienst voor 15 mei voorafgaande aan het desbetreffende schooljaar aan Onze Minister mee
      hoeveel formatierekeneenheden worden overgedragen.

      4 Het bestuur van de centrale dienst kan tot 1 oktober van het desbetreffende schooljaar aan Onze Minister meedelen
      dat de overdracht, bedoeld in het derde lid wordt gewijzigd. Indien het formatie betreft als bedoeld in artikel 132
      van de wet, is dit uitsluitend mogelijk indien dit in overeenstemming is met het zorgplan en het gevolg is van

      a. een vacature die niet meteen kan worden vervuld,

      b. een verklaring van een accountant dat de opgave van de leerlingenaantallen moet worden bijgesteld,

      c. vertraging in de besluitvorming over het zorgplan door een geschillenprocedure als bedoeld in [artikel 22][ref4]
      van de wet,

      d. wijziging van de formatie door het vertrek per 1 augustus van een boventallig personeelslid
