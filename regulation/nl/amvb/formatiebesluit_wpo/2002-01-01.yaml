      Indien het totale aantal formatierekeneenheden dat voor een basisschool is berekend op grond van
      [de artikelen 4 tot en met 15b][ref1], in voorkomende gevallen vermeerderd met de groeiformatie en de
      bijzondere groeiformatie, bedoeld in [de artikelen 15c tot en met 15c3][ref2], lager is dan 530, wordt
      het aantal formatierekeneenheden waarop het bevoegd gezag van die school aanspraak heeft, verhoogd tot 530
      formatierekeneenheden.


