  - number: 16a
    text: |-
      1 Het formatiebudget waarop het bevoegd gezag van een speciale school voor basisonderwijs per schooljaar aanspraak
      heeft, bestaat uit:

      a. de basisformatie, bedoeld in artikel 122, eerste lid onderdeel a, van de wet,

      b. in voorkomende gevallen formatie voor speciale doeleinden, bedoeld in artikel 122, eerste lid onderdeel b, van
      de wet,

      c. de zorgformatie, bedoeld in artikel 122, eerste lid onderdeel c, van de wet en

      d. de formatie, bedoeld in artikel 122, vierde lid, van de wet.

      2 De omvang van het formatiebudget is de som van de aantallen formatierekeneenheden, zoals voor de school berekend
      op grond van [de artikelen 16b tot en met 16e][ref1].

      3 Het formatiebudget van een speciale school voor basisonderwijs die nog geen leerlingen heeft, bedraagt 265
      formatierekeneenheden voor een periode van ten hoogste acht weken.

      4 Onverminderd het derde lid, heeft een speciale school voor basisonderwijs die op de teldatum geen leerlingen
      heeft, geen aanspraak op formatierekeneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005441#Artikel16b
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel16a
