  - number: 16d
    text: |-
      1 De formatie voor speciale doeleinden van een speciale school voor basisonderwijs omvat de formatie voor de
      bestrijding van onderwijsachterstanden, bedoeld in artikel 122 van de wet.

      2 De formatie voor de bestrijding van onderwijsachterstanden wordt berekend door het aantal leerlingen met een
      niet-Nederlandse culturele achtergrond boven het aantal van 4 te vermenigvuldigen met 8,3 formatierekeneenheden.
      Het aldus berekende aantal formatierekeneenheden wordt rekenkundig afgerond op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel16d
  - number: 16e
    text: |-
      1 De zorgformatie, bedoeld in [artikel 16a, eerste lid onderdeel c][ref1], van een speciale school voor
      basisonderwijs wordt in elk samenwerkingsverband waaraan de school deelneemt, berekend aan de hand van de formule:

      H = p/q x (0,02 x r) x 13,5 rekeneenheden, waarin

      H = het aantal formatierekeneenheden zorgformatie dat een speciale school voor basisonderwijs in het desbetreffende
      samenwerkingsverband ontvangt,

      p = het aantal leerlingen van de speciale school voor basisonderwijs, voor zover dit op grond van het derde lid aan
      het desbetreffende samenwerkingsverband is toe te rekenen,

      q = het totale aantal leerlingen van alle speciale scholen voor basisonderwijs die deelnemen aan het desbetreffende
      samenwerkingsverband, voor zover dit op grond van het derde lid aan dat samenwerkingsverband is toe te rekenen en

      r = het totale aantal leerlingen van alle basisscholen en speciale scholen voor basisonderwijs die deelnemen aan
      het desbetreffende samenwerkingsverband, voor speciale scholen voor basisonderwijs uitsluitend voor zover dit op
      grond van het derde lid aan dat samenwerkingsverband is toe te rekenen.

      2 Bij het bepalen van p, q en r, bedoeld in het eerste lid, wordt het aantal leerlingen op de teldatum genomen.

      3 Bij het bepalen van p, q en r, bedoeld in het eerste lid, wordt het aantal leerlingen van een speciale
      school voor basisonderwijs die deelneemt aan meer dan één samenwerkingsverband, aan de desbetreffende
      samenwerkingsverbanden toegerekend naar rato van het aantal basisschoolleerlingen van elk verband op 1 oktober van
      het jaar voorafgaande aan het jaar waarvoor de zorgformatie wordt toegekend.

      4 Bij het bepalen van p, q en r, bedoeld in het eerste lid, worden de leerlingen van afdelingen die aan de school
      zijn verbonden niet meegeteld.

      5 In de formule, bedoeld in het eerste lid, wordt de component *0,02 x r* rekenkundig afgerond op een geheel getal.
      De uitkomst van de formule wordt vervolgens berekend op 4 cijfers achter de komma en rekenkundig afgerond op een
      geheel getal.

      6 De zorgformatie van een speciale school voor basisonderwijs is de som van de zorgformatie van de school in alle
      samenwerkingsverbanden waaraan de school deelneemt.


