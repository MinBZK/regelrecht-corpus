  - number: 15c2
    text: |-
      1 Aan het bevoegd gezag van een basisschool wordt bijzondere groeiformatie toegekend, indien:

      a. het aantal leerlingen van die school in de periode van 1 april tot en met 31 mei van een schooljaar met ten
      minste 26 is toegenomen ten opzichte van het aantal leerlingen op 31 maart van dat schooljaar; en

      b. het bevoegd gezag van die school het aantal leerlingen op grond waarvan het bevoegd gezag aanspraak maakt op
      bijzondere groeiformatie, binnen twee weken na de telling op een daartoe bij ministeriële regeling vastgesteld
      formulier aan Onze Minister heeft gemeld.

      2 De bijzondere groeiformatie wordt toegekend met ingang van de eerste dag van de maand volgende op de telling
      waarop de melding, bedoeld in het eerste lid, onder a, betrekking heeft.

      3 Bijzondere groeiformatie kan per schooljaar slechts eenmaal worden toegekend.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel15c2
  - number: 15c3
    text: |-
      1 De bijzondere groeiformatie bestaat uit extra groepsformatie en een verhoging van het formatieve deel van de
      toeslag voor de schoolleiding.

      2 De omvang van de extra groepsformatie wordt berekend door het verschil tussen het toegenomen totale
      aantal leerlingen en 103% van het aantal leerlingen op de teldatum te vermenigvuldigen met 8,28.
      [Artikel 15c, tweede lid][ref1], is van toepassing. Indien voor 1 april van een schooljaar groeiformatie als
      bedoeld in [artikel 15c][ref2] is toegekend, wordt de omvang van de extra groepsformatie berekend door het
      verschil tussen het toegenomen totale aantal leerlingen en het aantal leerlingen op grond waarvan de laatste maal
      groeiformatie is toegekend, te vermenigvuldigen met 8,28. De uitkomst van de berekeningen, bedoeld in de eerste en
      de derde volzin, wordt rekenkundig afgerond op een geheel getal.

      3 De omvang van de verhoging van het formatieve deel van de toeslag voor de schoolleiding wordt berekend door het
      verschil tussen enerzijds het toegenomen totale aantal leerlingen en anderzijds 103% van het aantal leerlingen op
      de teldatum, onderscheidenlijk het aantal leerlingen op grond waarvan de laatste maal groeiformatie is toegekend,
      te vermenigvuldigen met 0,44. [Artikel 15c, tweede lid][ref3], is van toepassing. Indien voor 1 april van een
      schooljaar groeiformatie als bedoeld in [artikel 15c][ref4] is toegekend, wordt de omvang van de verhoging
      van het formatieve deel van de toeslag voor de schoolleiding berekend door het verschil tussen het toegenomen
      totale aantal leerlingen en het aantal leerlingen op grond waarvan de laatste maal groeiformatie is toegekend,
      te vermenigvuldigen met 0,44. De uitkomst van de berekeningen, bedoeld in de eerste en de derde volzin, wordt
      rekenkundig afgerond op een geheel getal.

      4 Indien de school in aanmerking komt voor de toeslag voor kleine scholen, bedoeld in [artikel 13][ref5], wordt de
      extra groepsformatie, berekend op grond van de eerste en de tweede volzin van het tweede lid, onderscheidenlijk de
      derde volzin van het tweede lid, verminderd met 2,5 maal het verschil tussen enerzijds het toegenomen totale aantal
      leerlingen en anderzijds 103% van het aantal leerlingen op de teldatum, onderscheidenlijk het aantal leerlingen op
      grond waarvan de laatste maal groeiformatie is toegekend. [Artikel 15c, tweede lid][ref6], is van toepassing. De
      uitkomst van de berekening, bedoeld in de eerste volzin, wordt rekenkundig afgerond op een geheel getal. Indien het
      toegenomen totale aantal leerlingen hoger is dan 140, wordt voor de toepassing van de eerste volzin het toegenomen
      totale aantal leerlingen op 140 gesteld.


