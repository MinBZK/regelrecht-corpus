  - number: 15b
    text: |-
      1 Voor elke leerling die volgens onderstaande tabel in een categorie kan worden ingedeeld, wordt bij de toelating
      tot een basisschool het bij die categorie behorende gewicht vastgesteld, met dien verstande dat een leerling
      slechts bij één categorie wordt ingedeeld.









                    leerling categorie


                    gewicht






                    a.


                    Leerling van wie beide ouders of verzorgers een schoolopleiding hebben genoten tot of tot en met het
      niveau eindexamen voorbereidend beroepsonderwijs: Indien het betreft een leerling uit een eenoudergezin, geldt deze
      opleidingseis ten aanzien van de desbetreffende ouder of verzorger.


                    0,25




                    b.


                    Leerling die verblijft in een internaat of pleeggezin en van wie de vader of moeder het
      schippersbedrijf uitoefent of heeft uitgeoefend:


                    0,4




                    c.


                    Leerling van wie de ouders een trekkend bestaan leiden als bedoeld in het Besluit trekkende bevolking
      WPO, anders dan bedoeld onder b:


                    0,7




                    d.


                    Leerling met een niet-Nederlandse culturele achtergrond die tevens voldoet aan een van de volgende
      voorwaarden:






                    1. de vader of verzorger heeft een schoolopleiding genoten tot of tot en met het niveau eindexamen
      voorbereidend beroepsonderwijs,






                    2. de moeder of verzorgster heeft een schoolopleiding genoten tot het niveau eindexamen voorbereidend
      beroepsonderwijs, of






                    3. de meest verdienende ouder of verzorger oefent een beroep uit in loondienst, waarin hij
      lichamelijke of handarbeid verricht, of geniet geen inkomsten uit tegenwoordige arbeid:


                    0,9






      Met het hebben genoten van een schoolopleiding tot of tot en met het niveau eindexamen voorbereidend
      beroepsonderwijs wordt gelijkgesteld het hebben doorlopen van ten hoogste de eerste twee leerjaren van een andere
      vorm van voortgezet onderwijs.

      2 Het schoolgewicht wordt berekend door de som van de volgens het eerste lid vastgestelde gewichten van de op
      de teldatum ingeschreven leerlingen te verminderen met een getal, gelijk aan 9% van het aantal leerlingen op de
      teldatum. De uitkomst wordt rekenkundig afgerond op een geheel getal. Indien de uitkomst negatief is, bedraagt het
      schoolgewicht nul.

      3 Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, bestaat het schoolgewicht
      van de basisschool uit de som van de schoolgewichten die de afzonderlijke vestigingen zouden hebben, indien zij
      zelfstandige scholen zouden zijn.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel15b
  - number: 15c
    text: |-
      1 Aan het bevoegd gezag van een basisschool wordt groeiformatie toegekend, indien:

      a. het aantal leerlingen van die school voor 1 april van een schooljaar met ten minste 13 is toegenomen ten
      opzichte van 103% van het aantal leerlingen op de teldatum, en vervolgens telkens indien het aantal leerlingen
      van die school voor 1 april van hetzelfde schooljaar met ten minste 13 is toegenomen ten opzichte van het aantal
      leerlingen op grond waarvan de laatste maal in dat schooljaar groeiformatie is toegekend; en

      b. het bevoegd gezag van die school het aantal leerlingen op grond waarvan het bevoegd gezag aanspraak maakt op
      groeiformatie, binnen twee weken na de telling op een daartoe bij ministeriële regeling vastgesteld formulier aan
      Onze Minister heeft gemeld.

      2 Bij de berekening van 103% van het aantal leerlingen op de teldatum als bedoeld in het eerste lid, onder a, wordt
      de uitkomst naar beneden afgerond op een geheel getal.

      3 De groeiformatie wordt toegekend met ingang van de eerste dag van de maand volgende op de telling waarop de
      melding, bedoeld in het eerste lid, onder b, betrekking heeft, dan wel, indien de telling waarop de melding
      betrekking heeft, heeft plaatsgevonden op de voor de school geldende eerste schooldag van het schooljaar, met
      ingang van de eerste dag van dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel15c
  - number: 15c1
    text: |-
      1 De groeiformatie bestaat uit extra groepsformatie en een verhoging van het formatieve deel van de toeslag voor
      de schoolleiding.

      2 De omvang van de extra groepsformatie wordt berekend door het verschil tussen enerzijds het toegenomen
      totale aantal leerlingen en anderzijds 103% van het aantal leerlingen op de teldatum, onderscheidenlijk het
      aantal leerlingen op grond waarvan de laatste maal groeiformatie is toegekend, te vermenigvuldigen met 8,28.
      [Artikel 15c, tweede lid][ref1], is van toepassing. De uitkomst van de berekening, bedoeld in de eerste volzin,
      wordt rekenkundig afgerond op een geheel getal.

      3 De omvang van de verhoging van het formatieve deel van de toeslag voor de schoolleiding wordt berekend door het
      verschil tussen enerzijds het toegenomen totale aantal leerlingen en anderzijds 103% van het aantal leerlingen op
      de teldatum, onderscheidenlijk het aantal leerlingen op grond waarvan de laatste maal groeiformatie is toegekend,
      te vermenigvuldigen met 0,44. [Artikel 15c, tweede lid][ref2], is van toepassing. De uitkomst van de berekening,
      bedoeld in de eerste volzin, wordt rekenkundig afgerond op een geheel getal.

      4 Indien de basisschool in aanmerking komt voor de toeslag voor kleine scholen, bedoeld in [artikel 13][ref3],
      wordt de extra groepsformatie, berekend op grond van de eerste en de tweede volzin van het tweede lid, verminderd
      met 2,5 maal het verschil tussen enerzijds het toegenomen totale aantal leerlingen en anderzijds 103% van het
      aantal leerlingen op de teldatum, onderscheidenlijk het aantal leerlingen op grond waarvan de laatste maal
      groeiformatie is toegekend. [Artikel 15c, tweede lid][ref4], is van toepassing. De uitkomst van de berekening,
      bedoeld in de eerste volzin, wordt rekenkundig afgerond op een geheel getal. Indien het toegenomen totale aantal
      leerlingen hoger is dan 140, wordt voor de toepassing van de eerste volzin het toegenomen totale aantal leerlingen
      op 140 gesteld.


