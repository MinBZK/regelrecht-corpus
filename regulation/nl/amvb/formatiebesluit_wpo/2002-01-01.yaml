    text: |-
      1 Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar beslissen minder
      formatierekeneenheden te besteden dan voor die school mogelijk zou zijn op grond van het beschikbare
      formatiebudget, tot ten hoogste:

      a. 10% van het voor de school beschikbare formatiebudget, daaronder niet begrepen het aantal formatierekeneenheden
      dat nodig is voor de bekostiging van de vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref1] en daaronder wat betreft een
      basisschool niet begrepen de formatie voor personeelsbeleid, kwaliteitsverbetering en personeelsinnovatie,

      b. wat betreft een basisschool de formatie voor personeelsbeleid, kwaliteitsverbetering en personeelsinnovatie,

      c. het aantal formatierekeneenheden dat nodig is voor het betalen van vergoedingen aan een school voor voortgezet
      onderwijs voor de inzet van personeel, en

      d. het aantal formatierekeneenheden dat nodig is voor de bekostiging van de
      vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref2].

      In dat geval keert Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de
      geldswaarde van de gedurende het schooljaar niet verbruikte formatierekeneenheden.

      2 Het verzilveren van formatierekeneenheden, bedoeld in het eerste lid, onderdeel *c*, mag niet leiden tot kosten
      van ontslaguitkeringen krachtens het Besluit Werkloosheid onderwijs- en onderzoekpersoneel.

      3 Het bevoegd gezag neemt een beslissing als bedoeld in het eerste lid voor 15 mei voorafgaande aan het
      desbetreffende schooljaar en deelt voor die datum aan Onze Minister mee hoeveel formatierekeneenheden worden
      verzilverd. Het bevoegd gezag kan voor 1 oktober van een schooljaar een nadere beslissing als bedoeld in het eerste
      lid nemen en voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden verzilverd, met dien
      verstande dat deze nadere beslissing niet kan inhouden dat in totaal minder formatierekeneenheden worden verzilverd
      dan overeenkomstig de eerste volzin is medegedeeld aan Onze Minister.

      4 De geldswaarde van de verzilverde formatierekeneenheden voor speciale doeleinden wordt besteed aan de speciale
      doeleinden waarvoor de formatierekeneenheden waren bestemd. De geldswaarde van de verzilverde formatierekeneenheden
      groepsformatie ten behoeve van het onderwijs aan leerlingen in de leeftijd van 4 tot en met 7 jaar wordt in het
      schooljaar waarvoor die rekeneenheden zijn toegekend, besteed ten behoeve van het onderwijs in de eerste vier
      leerjaren.

      5 Het bestuur van een centrale dienst kan telkens voor de periode van een schooljaar overeenkomstig het zorgplan
      tot ten hoogste 10% minder formatierekeneenheden besteden dan voor die dienst mogelijk zou zijn op grond van de
      door de dienst krachtens artikel 132 van de wet ontvangen formatierekeneenheden. De laatste volzin van het eerste
      lid en het tweede en derde lid zijn van overeenkomstige toepassing, met dien verstande dat de mededeling en de
      nadere mededeling in overeenstemming dienen te zijn met het zorgplan.

      6 Indien een bevoegd gezag alle scholen in een samenwerkingsverband in stand houdt, zijn het eerste tot en met het
      vierde lid van overeenkomstige toepassing op de aan het bevoegd gezag toegekende zorgformatie.


