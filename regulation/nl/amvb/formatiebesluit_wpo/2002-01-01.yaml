  - number: '5'
    text: |-
      De basisformatie van een basisschool omvat, voor zover van toepassing:

      a. de groepsformatie;

      b. de toeslag voor kleine scholen;

      c. de toeslag voor de schoolleiding; en

      d. de toeslag voor herbezetting in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel5
  - number: '6'
    text: |-
      Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de basisformatie van
      die school vermeerderd met drievierde van het verschil tussen enerzijds de som van de toeslagen voor kleine scholen
      die de hoofdvestiging en de nevenvestigingen als zelfstandige scholen tezamen zouden ontvangen, en anderzijds de
      toeslag voor kleine scholen die de basisschool als school zonder nevenvestigingen zou ontvangen. De uitkomst wordt
      rekenkundig afgerond op twee decimalen.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel6
  - number: '8'
    text: |-
      1 De groepsformatie ten behoeve van het onderwijs aan leerlingen in de leeftijd van 4 tot en met 7 jaar wordt
      berekend door het aantal leerlingen in de leeftijd van 4 tot en met 7 jaar op de teldatum te vermenigvuldigen met
      10,21.

      2 De groepsformatie ten behoeve van het onderwijs aan leerlingen in de leeftijd van 8 jaar en ouder wordt berekend
      door het aantal leerlingen in de leeftijd van 8 jaar en ouder op de teldatum te vermenigvuldigen met 6,97.
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel8
  - number: '13'
    text: |-
      Indien een basisschool op de teldatum minder dan 137 leerlingen had, komt zij in aanmerking voor de toeslag voor
      kleine scholen, die wordt berekend volgens de volgende formule:

      toeslag voor kleine scholen = 350 – (aantal leerlingen op de teldatum x 2,57).
    url: https://wetten.overheid.nl/BWBR0005441/2002-01-01#Artikel13
  - number: 13a
    text: |-
      1 De toeslag voor de schoolleiding van een basisschool bestaat uit een formatief deel en een salair deel.

      2 Het formatieve deel van de toeslag voor de schoolleiding wordt berekend door de som van het aantal leerlingen op
      de teldatum en het schoolgewicht, bedoeld in [artikel 15b][ref1], te vermenigvuldigen met 0,45.

      3 Het salaire deel van de toeslag voor de schoolleiding wordt vastgesteld op basis van 103% van het aantal
      leerlingen op de teldatum, naar beneden afgerond op een geheel getal, volgens onderstaand schema:








                    103% van het aantal leerlingen op de teldatum, naar beneden afgerond op een geheel getal


                    aantal formatierekeneenheden






                    1 tot en met 99


                    54




                    100 tot en met 199


                    86




                    200 tot en met 399


                    118




                    400 tot en met 899


                    140




                    900 en hoger


                    213






      4 Voor een basisschool in een samenwerkingsverband dat de instemming, bedoeld in [artikel 18, zevende lid][ref2],
      van de wet, heeft verkregen, wordt het salaire deel van de toeslag voor de schoolleiding voor 2% van het aantal
      leerlingen van de school op 1 oktober van het voorafgaande schooljaar, rekenkundig afgerond op een geheel getal,
      verhoogd met 0,2 formatierekeneenheid per leerling.


