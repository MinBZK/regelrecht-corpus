$id: besluit_opheffing_landbouwschap
regulatory_layer: AMVB
publication_date: '2001-10-04'
valid_from: '2002-01-01'
bwb_id: BWBR0011674
url: https://wetten.overheid.nl/BWBR0011674/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, van 10 juli 2000, Directie
    Arbeidsverhoudingen, Nr. AV/A&M/2000/45114, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel XVII van de wet van 24 juni 1992, Stb. 409, en op artikel 70 van de Wet op de bedrijfsorganisatie,
    zoals dat artikel voor de inwerkingtreding van die wet laatstelijk luidde;

    De Raad van State gehoord (advies van 10 augustus 2000, nr. W12.00.0289/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 29 augustus 2000, Directie
    Arbeidsverhoudingen, Nr. AV/A&M/2000/53805, uitgebracht mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: 1.a
    text: 'de Raad: de Sociaal-Economische Raad;'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      de wet: de [Wet op de bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 1.d
    text: |-
      jaarrekening 1997: rekening der inkomsten en uitgaven als bedoeld in [artikel 124 van de wet][ref1], zoals
      vastgesteld door het bestuur van het Landbouwschap bij besluit van 13 april 1999;


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel124
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '124'
  - number: 1.e
    text: 'financieringsreserve: de in de jaarrekening 1997 zo genoemde algemene reserve van het vermogen;'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: 1.f
    text: |-
      saldi opcenten algemene heffing: de in de jaarrekening 1997 zo genoemde post 4.01, bevattende saldi opcenten van
      sectoren en subsectoren;
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: 1.g
    text: |-
      sectorsaldi: de tot de bestemmingsreserves van het vermogen behorende fondsen en saldi, behoudens de in de
      jaarrekening 1997 zo genoemde posten 3.2, 3.3, 4.01, 4.10, 4.13 en 4.16.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel1
  - number: '2.1'
    text: Het Bedrijfschap voor de landbouw, genaamd Landbouwschap, is opgeheven.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: '2.2'
    text: 'De Raad is bevoegd toepassing te geven aan de volgende verordeningen en besluiten van het Landbouwschap:'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: 2.2.a
    text: Verordening registratie en verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: 2.2.b
    text: Besluit verstrekking gegevens 1995 (exploitatie land- en tuinbouw-werktuigen);
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: 2.2.c
    text: Besluit verstrekking gegevens 1997;
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: 2.2.d
    text: Verordening vereffeningsheffing Landbouwschap.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      De in het tweede lid genoemde verordeningen en besluiten blijven van kracht totdat zij door de Raad worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
  - number: '2.4'
    text: |-
      Met uitzondering van de in het tweede lid genoemde verordeningen en besluiten, de Heffingsverordening Verbruik
      Aardgas en de daaraan gerelateerde besluiten voor toepassing in 1996 en 1997, alsmede de in de [artikelen 6][ref1]
      en [7][ref2] bedoelde verordeningen, vervallen de door het Landbouwschap vastgestelde verordeningen en andere
      algemeen verbindende besluiten, voorzover nog van kracht bij de inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011674#Artikel7
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011674
        artikel: '7'
  - number: '3.1'
    text: Vanaf de inwerkingtreding van dit besluit berust het beheer van het vermogen van het Landbouwschap bij de Raad.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Rechtsvorderingen die tot het vermogen van het Landbouwschap behorende rechten of verplichtingen tot onderwerp
      hebben, voorzover deze geen betrekking hebben op de heffingen, bedoeld in [artikel 6][ref1], worden ingesteld door
      of tegen de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel6
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '6'
  - number: '3.3'
    text: |-
      Rechtsvorderingen die betrekking hebben op VUT-regelingen, flexibele spaarpensioenregelingen en de regeling van
      het sociaal plan, uitgezonderd de bepalingen ten aanzien van de pensioenen en wachtgelden, worden ingesteld door of
      tegen de Raad.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel3
  - number: '3.4'
    text: |-
      Rechtsvorderingen die betrekking hebben op rechten en verplichtingen, neergelegd in pensioen- en
      wachtgeldregelingen, met inbegrip van de ingevolge het derde lid uitgezonderde bepalingen, worden ingesteld door of
      tegen het Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De Raad is belast met de vereffening van het vermogen van het Landbouwschap. Hij kan daartoe de tot het vermogen
      van het Landbouwschap behorende roerende zaken vervreemden.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      De Raad maakt met het oog op de vereffening een boedelbeschrijving op. Hij stelt tevens de rekening van inkomsten
      en uitgaven van het Landbouwschap vast over het tijdvak, aanvangende op de eerste januari van het jaar, volgende op
      het kalenderjaar waarover laatstelijk een rekening van inkomsten en uitgaven door het bestuur van het Landbouwschap
      dient te worden vastgesteld, en eindigende op de dag van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel4
  - number: '4.3'
    text: De boedelbeschrijving, bedoeld in het tweede lid, behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel4
  - number: '4.4'
    text: |-
      De Raad stelt zo nodig de rekening van inkomsten en uitgaven vast over de jaren die voorafgaan aan het in het
      tweede lid bedoelde tijdvak.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel4
  - number: '4.5'
    text: |-
      De vaststelling van een rekening van inkomsten en uitgaven door de Raad strekt, na verkregen instemming van Onze
      Minister, tot décharge van het dagelijks bestuur van het Landbouwschap, behoudens in geval van later gebleken
      valsheid in bewijsstukken of andere onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      De Raad maakt het tijdstip van de aanvang van de vereffening bekend in de Staatscourant en in het Mededelingenblad
      Bedrijfsorganisatie, alsmede in de daartoe naar zijn oordeel in aanmerking komende nieuwsbladen, onder vermelding
      van de afkondiging van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      In de bekendmaking worden degenen die een vordering op het Landbouwschap hebben, opgeroepen die vorderingen binnen
      een daarbij aangegeven termijn bij de Raad in te dienen. Deze termijn wordt niet korter gesteld dan zes maanden, te
      rekenen vanaf de dag van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De opheffing van het Landbouwschap tast de rechtskracht van de door dat lichaam wettig opgelegde heffingen niet
      aan.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      De Raad vordert bij verordening de medewerking van de besturen van de daarbij aan te wijzen
      productschappen ten behoeve van de invordering van de aan het Landbouwschap, krachtens
      [artikel 126, eerste en tweede lid, van de wet][ref1], op het tijdstip van inwerkingtreding van dit besluit
      verschuldigde bedragen, voorzover hun grond vindende in heffingsverordeningen waarop de in het eerste lid bedoelde
      heffingen zijn gebaseerd, inclusief de rechtsvorderingen die samenhangen met de heffingen. Met ingang van de
      inwerkingtreding van dit besluit zijn de bedragen verschuldigd aan de bedoelde productschappen. De in de eerste zin
      bedoelde medewerking kan tevens worden gevorderd indien in het kader van de vereffening van het vermogen toepassing
      wordt gegeven aan de verordening, genoemd in [artikel 2, tweede lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0011674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
      - id: ref2
        bwb_id: BWBR0011674
        artikel: '2'
  - number: '6.3'
    text: |-
      Door of namens de voorzitter van het Landbouwschap uitgevaardigde dwangbevelen als bedoeld in
      [artikel 127, eerste lid, van de wet][ref1] behouden hun rechtskracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '127'
  - number: '6.4'
    text: |-
      De kosten van de invordering van de in het tweede lid bedoelde bedragen worden in rekening gebracht bij de Raad,
      die deze ten laste brengt van het vermogen van het Landbouwschap. [Artikel 10, eerste, derde en vierde lid][ref1],
      is in dat geval van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel10
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '10'
  - number: '6.5'
    text: |-
      De in het tweede lid bedoelde bedragen worden na inning overgedragen aan de Raad en toegevoegd aan het vermogen van
      het Landbouwschap.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      De rechten en verplichtingen jegens en van de werknemers en de gewezen werknemers van het Landbouwschap,
      voortvloeiende uit de Salarisverordening Personeel Landbouwschap 1988/1989, de Verordening tot wijziging van
      de Verordening Salarisverordening Personeel Landbouwschap 1988/1989, de Verordening Wachtgelden Personeel
      Landbouwschap 1972, de Verordening Uitkeringen bij ontslag 1993, de Verordening vrijwillig vervroegde uittreding
      personeel Landbouwschap 1994, de Pensioenverordening Personeel Landbouwschap 1989, de Verordening tot wijziging
      van de Pensioenverordening Personeel Landbouwschap 1989, de Verordening tot vaststelling Reglement Flexibel
      Spaarpensioen Personeel Landbouwschap en de Verordening Sociaal Plan Landbouwschap blijven ook na de opheffing van
      het Landbouwschap in stand.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Voorzover de rechten en verplichtingen betrekking hebben op VUT-uitkeringen, flexibele spaarpensioenen en
      voorzieningen in het sociaal plan, kunnen zij na de opheffing geldend worden gemaakt, onderscheidenlijk moeten zij
      worden gekweten tegenover de Raad.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Voorzover de rechten en verplichtingen betrekking hebben op pensioenen en wachtgelden, kunnen zij na de opheffing
      geldend worden gemaakt, onderscheidenlijk moeten zij worden gekweten tegenover het Hoofdproductschap Akkerbouw.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Raad vormt een fonds ten bedrage van € 12 705 846 ten behoeve van de betaling van de wachtgelden en daarmee
      samenhangende pensioenpremies, alsmede een fonds ten bedrage van € 907 560 voor de aanspraken op de voorzieningen
      in het sociaal plan, voortvloeiende uit de in [artikel 7][ref1] genoemde verordeningen. De stortingen in deze
      fondsen komen ten laste van het vermogen van het Landbouwschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel7
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '7'
  - number: '8.2'
    text: |-
      Het voor de betaling van de wachtgelden en daarmee samenhangende pensioenpremies gevormde fonds wordt, in verband
      met [artikel 3, vierde lid][ref1], beheerd door het Hoofdproductschap Akkerbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel3
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '3'
  - number: '8.3'
    text: |-
      Het fonds, gevormd voor de betaling van voorzieningen in het sociaal plan wordt, in verband met
      [artikel 3, derde lid][ref1], beheerd door de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel3
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '3'
  - number: '8.4'
    text: |-
      Het fonds, dat is gevormd voor het verlenen van toeslagen op ingegane pensioenen en premievrije pensioenaanspraken,
      blijft in stand. Dit fonds wordt, in verband met [artikel 3, vierde lid][ref1], beheerd door het Hoofdproductschap
      Akkerbouw. Uit het fonds kunnen volgens door het dagelijks bestuur van het Hoofdproductschap Akkerbouw te stellen
      regelen, op basis van het tot dusverre ter zake gevoerde beleid, toeslagen worden verleend op pensioenen en
      premievrije pensioenaanspraken van gewezen werknemers van het Landbouwschap of hun nabestaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel3
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '3'
  - number: '8.5'
    text: |-
      De kortingen welke worden verkregen over de pensioenpremies die ten laste van het in het tweede lid bedoelde fonds
      worden betaald, worden gestort in het fonds, bedoeld in het vierde lid. Aan dat fonds kunnen ook andere baten
      worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      De Raad en het Hoofdproductschap Akkerbouw voldoen uit de in de vorige leden bedoelde fondsen geen andere
      vorderingen dan die welke strekken tot nakoming van de verplichtingen waarvoor de fondsen zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
  - number: '8.7'
    text: De over de middelen van een fonds verkregen rente wordt aan het desbetreffende fonds toegevoegd.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
  - number: '8.8'
    text: |-
      Het Hoofdproductschap Akkerbouw verantwoordt het beheer van de in het tweede en vierde lid bedoelde fondsen aan
      de Raad.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
  - number: '8.9'
    text: |-
      De Raad verantwoordt het beheer van het in het derde lid bedoelde fonds via een bijzondere dienst in zijn begroting
      en zijn rekening van inkomsten en uitgaven.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Zo spoedig mogelijk nadat de Raad het vermogen van het Landbouwschap heeft vereffend, brengt hij daarover aan
      Onze Minister verslag uit. Het verslag gaat vergezeld van een door de Raad vastgestelde rekening van inkomsten
      en uitgaven.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      De vaststelling van het verslag en van de rekening van inkomsten en uitgaven betreffende de vereffening kan slechts
      plaatsvinden nadat de ontwerpen van deze stukken gedurende twee maanden ten kantore van de Raad voor een ieder
      ter lezing zijn neergelegd en tegen betaling van de kosten algemeen verkrijgbaar zijn gesteld en indien binnen
      die termijn bij de Raad geen bezwaren zijn ingekomen. Van de neerlegging en de verkrijgbaarheid geschiedt openbare
      kennisgeving in de Staatscourant en in het Mededelingenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Elk ingekomen bezwaar wordt door de Raad onderzocht; wordt het gegrond bevonden, dan zet de Raad de vereffening
      voort en maakt, zo nodig, een nieuw verslag en een nieuwe rekening van inkomsten en uitgaven op waarin aan het
      bezwaar is tegemoet gekomen. Ten aanzien van laatstbedoeld verslag en laatstbedoelde rekening is het tweede lid van
      overeenkomstige toepassing, met dien verstande dat de Raad nieuwe bezwaren, welke reeds tegen het eerste verslag en
      de eerste rekening hadden kunnen worden ingebracht, niet in overweging neemt. Wordt het bezwaar ongegrond bevonden,
      dan stelt de Raad het verslag en de rekening alsnog vast.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De rekening behoeft de instemming van Onze Minister. De instemming strekt tot décharge van de Raad. De Raad
      doet van het verlenen van de instemming zo spoedig mogelijk openbare kennisgeving in de Staatscourant en in het
      Mededelingenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De uitvoerings- en liquidatiekosten van het Landbouwschap worden ten laste gebracht van het vermogen van het
      Landbouwschap.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Voorzover de in het eerste lid bedoelde kosten naar objectieve maatstaven kunnen worden toegeschreven aan een
      bepaalde sector, worden zij voldaan uit het desbetreffend gedeelte van de saldi opcenten algemene heffing en,
      voorzover dat niet toereikend is, uit het desbetreffend gedeelte van de sectorsaldi.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Voorzover het tweede lid niet van toepassing is worden de kosten voldaan uit de financieringsreserve. Voorzover de
      financieringsreserve niet toereikend is worden zij sectorsgewijs en naar rato van de in de bijlage bij dit besluit
      genoemde percentages voldaan uit de saldi opcenten algemene heffing. Voorzover een gedeelte van de saldi opcenten
      algemene heffing niet toereikend is, worden zij voldaan uit het desbetreffend gedeelte van de sectorsaldi.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel10
  - number: '10.4'
    text: |-
      Voorzover een sectorsaldo of een gedeelte daarvan niet toereikend is, kunnen de kosten worden voldaan
      met middelen die door de Raad worden verkregen door toepassing te geven aan de verordening, genoemd in
      [artikel 2, tweede lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel2
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '2'
  - number: '10.5'
    text: |-
      Indien de fondsen, bedoeld in [artikel 8][ref1], niet toereikend zijn, zijn voorzover noodzakelijk ter dekking van
      het tekort, het eerste, derde en vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel8
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '8'
  - number: '11.1'
    text: |-
      Voorzover de saldi opcenten algemene heffing betrekking hebben op de werkingssfeer van, respectievelijk voorzover
      de sectorsaldi betrekking hebben op de vervulling van taken die zijn overgedragen aan het Hoofdproductschap
      Akkerbouw, het Productschap Tuinbouw, het Productschap Pluimvee en Eieren, het Productschap Vee en Vlees en het
      Produktschap voor Zuivel, komen de desbetreffende, uit de goedgekeurde rekening blijkende eindsaldi ten goede aan
      de genoemde productschappen.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Hetgeen na toepassing van het eerste lid aan vermogen van het Landbouwschap resteert, alsmede hetgeen na
      beëindiging van de taken van de in [artikel 8, eerste lid][ref1], bedoelde fondsen resteert, komt ten goede aan de
      in het eerste lid genoemde productschappen, naar rato van de in de bijlage bij dit besluit genoemde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel8
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '8'
  - number: '11.3'
    text: |-
      Voorzover niet reeds bij verordening bepaald, beslissen de besturen van de genoemde productschappen over de
      bestemming van de gelden. Alvorens te besluiten, wint het bestuur het advies in van het betrokken sectorbestuur dan
      wel de sectorcommissie, voorzover daarin organisatorisch bij de betrokken productschappen is voorzien.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel11
  - number: '11.4'
    text: Besluiten als bedoeld in het derde lid behoeven de goedkeuring van de Raad.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel11
  - number: '11.5'
    text: |-
      De bestemming van hetgeen na beëindiging van de taken van het in [artikel 8, vierde lid][ref1], bedoelde fonds
      resteert, wordt door de Raad, gehoord de betrokken ondernemers- en werknemersorganisaties, bepaald. Dit besluit
      behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel8
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '8'
  - number: '12.1'
    text: |-
      De opheffing van het Landbouwschap heeft geen gevolg voor de ontvankelijkheid van beroepen ingevolge de
      [Wet bestuursrechtspraak bedrijfsorganisatie][ref1]. In plaats van het Landbouwschap treedt de Raad als partij op.


      [ref1]: https://wetten.overheid.nl/BWBR0002144
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002144
  - number: '12.2'
    text: |-
      Bezwaarschriften aangaande beslissingen van het bestuur van het Landbouwschap, met uitzondering van die betreffende
      de aanslagen bedoeld in [artikel 6][ref1], worden na de inwerkingtreding van dit besluit gericht aan de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel6
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '6'
  - number: '12.3'
    text: |-
      Gerechtelijke uitspraken, gedaan tegen het Landbouwschap of, op grond van het eerste lid, tegen de Raad,
      worden door de Raad uitgevoerd, voorzover nodig ten laste van het vermogen van het opgeheven Landbouwschap.
      [Artikel 10, eerste tot en met vierde lid][ref1], is in dat geval van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011674#Artikel10
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011674
        artikel: '10'
  - number: '13'
    text: |-
      De Raad draagt zorg, in de zin van de [Archiefwet 1995][ref1], voor de archiefbescheiden van het Landbouwschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '14'
    text: Het [Instellingsbesluit Landbouwschap](onbekend) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel14
  - number: '15'
    text: Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit opheffing Landbouwschap.'
    url: https://wetten.overheid.nl/BWBR0011674/2002-01-01#Artikel16
