    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.17a
  - number: 2.17a.1.f
    text: zorg en welzijn.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.17a
  - number: 2.17a.2
    text: |-
      Het bevoegd gezag van een school die deel uitmaakt van een scholengemeenschap met een gemengde leerweg kan een
      leerling in de theoretische leerweg in de gelegenheid stellen om de praktijkgerichte vakken te volgen die in de
      gemengde leerweg worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.17a
  - number: '2.18'
    text: |-
      Het bevoegd gezag kan de leerling in de theoretische leerweg in de gelegenheid stellen, in plaats van de
      vakken, genoemd in de [artikelen 2.15][ref1], [2.16][ref2] en [2.17, onderdeel b][ref3], de overeenkomstige
      vakken voor vwo, genoemd in de [artikelen 2.5 tot en met 2.7][ref4], of voor havo, genoemd in de
      [artikelen 2.10 tot en met 2.12][ref5] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0045787#Artikel2
