  - number: 9.35.1
    text: |-
      Het Rijk betaalt elke maand van het kalenderjaar aan het bevoegd gezag van een school een gedeelte van de
      bekostiging, bedoeld in [artikel 9.25][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel9
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.35
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '6'
  - number: 9.35.2
    text: |-
      De aanvullende bekostiging, bedoeld in de [artikelen 5.9][ref1] en [5.10 van de wet][ref2], wordt in een keer
      betaald, dan wel wordt betaald volgens een bij ministeriële regeling te bepalen betaalritme.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.35
    references:
