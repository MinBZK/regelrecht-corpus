  - number: '2.7'
    text: 'Het vrije deel van een profiel in vwo omvat ter keuze van de leerling ten minste een vak uit het geheel van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.7
  - number: 2.7.a
    text: |-
      de vakken, genoemd in de [artikelen 2.5][ref1] en [2.6][ref2], voor zover deze vakken niet al deel uitmaken van het
      profiel en het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.7.a.1°
    text: |-
      binnen een profiel zijn toegestaan de combinatie van wiskunde A en wiskunde B of de combinatie van wiskunde B en
      wiskunde C, en dat wiskunde D kan worden gekozen indien wiskunde B al deel uitmaakt van het profiel;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.7
  - number: 2.7.a.2°
    text: |-
      kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.7
  - number: 2.7.a.3°
    text: van de vakken tekenen, handvaardigheid en textiele vormgeving er een deel kan uitmaken van het profiel;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.7
  - number: 2.7.b
    text: |-
      de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, voor zover het vak niet al
      eerder is gevolgd of niet al deel uitmaakt van het profiel en voor zover het bevoegd gezag deze vakken in het vrije
