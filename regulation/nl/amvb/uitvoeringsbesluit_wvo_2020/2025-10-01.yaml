  - number: '2.67'
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in [artikel 2.109 van de wet][ref1] omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.67.a
    text: het doel van de samenwerking;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
  - number: 2.67.b
    text: de doelgroep;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
  - number: 2.67.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
  - number: 2.67.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
  - number: 2.67.e
    text: een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.67
  - number: 2.68.1
    text: |-
      De gegevens, bedoeld in [artikel 2.111 van de wet][ref1], waarover een bevoegd gezag of een samenwerkingsverband
      beschikt voor het beleid van Onze Minister, worden gedefinieerd en geordend volgens de regels vermeld in
      [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.68
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
  - number: 2.68.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gegevens, bedoeld in het eerste lid, en over de
      wijze waarop de gegevens beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.68
  - number: '2.69'
    text: |-
      Onze Minister kan bij een verzoek om beschikbaarstelling van de gegevens, bedoeld in
      [artikel 2.111 van de wet][ref1], bij hem bekende gegevens opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.69
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: '2.70'
    text: |-
      Bij de gegevensverstrekking op grond van [artikel 2.111 van de wet][ref1] maakt het bevoegd gezag gebruik van het
      burgerservicenummer van een lid van het personeel of gewezen personeel van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.70
