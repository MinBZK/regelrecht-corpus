  - number: 2.19.1
    text: |-
      In het derde leerjaar volgt de leerling in de theoretische leerweg naast de vakken van het gemeenschappelijk deel,
      onderwijs in ten minste zeven vakken van het profieldeel of het vrije deel waarin eindexamen kan worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.19
  - number: 2.19.2
    text: |-
      Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in een voorafgaand leerjaar,
      is het aantal vakken, bedoeld in het eerste lid, zes.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.19
  - number: 2.19.3
    text: |-
      Indien de leerling onderwijs in een praktijkgericht vak volgt, genoemd in [artikel 2.17a][ref1], is het aantal
      vakken, bedoeld in het eerste lid, zes.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.19
    references:
