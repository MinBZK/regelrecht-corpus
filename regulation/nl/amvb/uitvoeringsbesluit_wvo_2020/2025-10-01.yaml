  - number: 2.8.1
    text: |-
      De leerling van een school voor vwo met het diploma havo is vrijgesteld van het volgen van onderwijs in het vak
      maatschappijleer en als het gaat om een atheneum ook in het vak culturele en kunstzinnige vorming.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.8
  - number: 2.8.2
    text: |-
      De leerling van een school voor vwo met het diploma havo of het diploma vmbo die in plaats van een vak
      voor die schoolsoort of als extra vak examen heeft afgelegd in een overeenkomstig vak, genoemd in de
      [artikelen 2.5 tot en met 2.7][ref1], is vrijgesteld van het volgen van onderwijs in dit vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.8.3
    text: |-
      De leerling van een atheneum is vrijgesteld van het volgen van onderwijs in het vak culturele en kunstzinnige
      vorming, indien Latijnse taal en cultuur of Griekse taal en cultuur, of beide, deel uitmaken van het profiel.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Het bevoegd gezag van een atheneum kan een leerling ontheffing verlenen voor het volgen van onderwijs in een tweede
      moderne vreemde taal als bedoeld in [artikel 2.5, eerste lid, onderdeel c][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.9.1.a
    text: |-
      de leerling een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die effect
      heeft op taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.9
  - number: 2.9.1.b
    text: de leerling een andere moedertaal heeft dan de Nederlandse taal of de Friese taal; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.9
  - number: 2.9.1.c
    text: |-
      de leerling onderwijs volgt in het profiel natuur en techniek of in het profiel natuur en gezondheid en het
      onderwijs in de taal naar verwachting verhindert dat de opleiding met goed gevolg wordt afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.9
  - number: 2.9.2
    text: |-
      In geval van een ontheffing als bedoeld in het eerste lid, wordt de taal vervangen door een van de vakken of
      programmaonderdelen, genoemd in de [artikelen 2.6][ref1] of [2.7, onderdeel c en d][ref2], met een normatieve
      studielast van ten minste 440 uren, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken of
      programmaonderdelen als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
