  - number: 9.32.1
    text: |-
      Voor het bepalen van de hoogte van de bekostiging van een school of scholengemeenschap worden niet meegeteld de
      leerlingen die :
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
  - number: 9.32.1.a
    text: |-
      vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen zonder geldige
      reden hebben verzuimd; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
  - number: 9.32.1.b
    text: |-
      deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 2.9, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 9.32.2
    text: 'Als geldige reden als bedoeld in het eerste lid, onderdeel a, voor verzuim wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
  - number: 9.32.2.a
    text: |-
      ten aanzien van een leerplichtige leerling: een vrijstelling van geregeld schoolbezoek als bedoeld in de
      [LPW BES][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
    references:
      - id: ref1
        bwb_id: BWBR0030281
  - number: 9.32.2.b
    text: |-
      ten aanzien van een niet-leerplichtige leerling: dezelfde gronden als die welke leiden tot vrijstelling van
      geregeld schoolbezoek als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
  - number: 9.32.3
    text: |-
      Bij het bepalen van het aantal leerlingen op de school, bedoeld in
      [artikel 9.25, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1], worden tevens ingeschreven studenten als
      bedoeld in de [WEB BES][ref2] meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.32
