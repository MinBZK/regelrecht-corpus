  - number: '9.24'
    text: |-
      In plaats van [artikel 6.1][ref1] is [artikel 9.25][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel9
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.24
    references:
