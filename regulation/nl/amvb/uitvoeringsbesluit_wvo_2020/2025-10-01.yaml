        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.7.3.b
    text: een vak dat behoort tot het eindexamen vwo of havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.7
  - number: 3.7.3.c
    text: |-
      een praktijkgericht vak als bedoeld in [artikel 2.25a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.7.4
    text: |-
      Het profielwerkstuk van het eindexamen vmbo gemengde leerweg heeft betrekking op een thema uit een profiel waarin
      de leerling onderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.7
  - number: 3.8.1
    text: 'De examenkandidaat is bij het eindexamen vrijgesteld van het vak waarvoor:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.8
  - number: 3.8.1.a
    text: |-
      een vrijstelling geldt van het volgen van onderwijs op grond van de [artikelen 2.8][ref1], [2.14][ref2] of
      [2.32][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.8.1.b
    text: |-
      een ontheffing is verleend voor het volgen van onderwijs op grond van [artikel 2.33, vierde lid, van de wet][ref1]
      of de [artikelen 2.9][ref2] of [2.33][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.8.2
    text: |-
      In geval van een ontheffing in vwo (atheneum) voor het volgen van onderwijs in een tweede moderne vreemde taal op
      grond van [artikel 2.9, eerste lid][ref1], wordt het eindexamen in de taal vervangen door het eindexamen in het
      vak, bedoeld in het tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.8.3
    text: |-
      In geval van een ontheffing in vmbo op grond van [artikel 2.33, eerste lid][ref1], voor het volgen van onderwijs
      in Franse of Duitse taal, wordt het eindexamen in de taal vervangen door het eindexamen in het vak, bedoeld in het
      tweede lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '3.9'
    text: |-
      Indien het eindexamen een of meer vakken omvat van een andere schoolsoort of leerweg dan die waarvoor de
      examenkandidaat als leerling is ingeschreven, behoort ten minste een vak van de schoolsoort of leerweg van
      inschrijving tot de voorgeschreven eindexamenvakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Het eindexamen vwo, havo en vmbo kan ook een maatschappelijke stage als bedoeld in [artikel 2.32 van de wet][ref1]
      omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.10.2
    text: De maatschappelijke stage als onderdeel van het eindexamen duurt ten minste 30 uur.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.10
  - number: 3.11.1
    text: |-
      Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Het examendossier voor het vmbo theoretische leerweg en gemengde leerweg omvat ook de resultaten die de leerling
      heeft behaald voor de vakken, bedoeld in [artikel 2.19][ref1] onderscheidenlijk [artikel 2.28][ref2], als in die
      vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.12.1
    text: |-
      In de gevallen, bedoeld in [artikel 3.17][ref1], wordt het schoolexamen in het vak waarop dit schoolexamen
      betrekking heeft, afgesloten tien werkdagen voor de afname van het centraal examen in dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.2
    text: |-
      Indien het centraal examen overeenkomstig [artikel 2.56, vierde lid, van de wet][ref1] wordt afgesloten in
      het voorlaatste leerjaar of het daaraan voorafgaande leerjaar, wordt het schoolexamen in dat vak of die vakken
      afgesloten voordat in dat leerjaar het centraal examen in dat vak of die vakken aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.13.1
    text: |-
      Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en met
      10 met de daartussen liggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.13
  - number: 3.13.2
    text: |-
      Indien in een vak geen centraal examen wordt afgelegd, wordt het cijfer van het schoolexamen uitgedrukt in een
      cijfer van 1 tot en met 10, zonder decimaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.13
  - number: 3.13.3
    text: |-
      In afwijking van het eerste lid wordt in alle schoolsoorten het vak lichamelijke opvoeding uit het
      gemeenschappelijk deel van elk profiel en in het vmbo de kunstvakken beoordeeld met «goed», «voldoende» of
      «onvoldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.13
  - number: 3.13.4
    text: |-
      De beoordeling van het vak lichamelijke opvoeding en de kunstvakken inclusief culturele en kunstzinnige vorming
      gaat uit van de prestaties van de leerling binnen zijn mogelijkheden, zoals blijkend uit het examendossier.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.13
  - number: 3.14.1
    text: |-
      In afwijking van [artikel 3.13, eerste lid][ref1], wordt het profielwerkstuk in het vmbo beoordeeld met «goed»,
      «voldoende» of «onvoldoende».


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.14.2
    text: |-
      De beoordeling van het profielwerkstuk in het vmbo vindt plaats op de grondslag van het voldoende voltooien van het
      profielwerkstuk, zoals blijkend uit het examendossier.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.14
  - number: 3.14.3
    text: Het profielwerkstuk in het vmbo wordt beoordeeld door ten minste twee examinatoren.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.14
  - number: 3.15.1
    text: 'Voor de aanvang van het centraal examen verstrekt de rector of directeur aan de examenkandidaat:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.15.1.a
    text: het cijfer of de cijfers voor het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.15.1.b
    text: de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.15.1.c
    text: de beoordeling van het profielwerkstuk in het vmbo; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.15.1.d
    text: |-
      een overzicht van de behaalde resultaten van alle onderdelen in het examendossier, bedoeld in [artikel 3.11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.15.2
    text: |-
      De rector of directeur en de examensecretaris tekenen voor de verstrekking van de in het eerste lid genoemde
      cijfers, beoordelingen en overzicht.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.15.3
    text: De examenkandidaat tekent voor ontvangst van de in het eerste lid genoemde cijfers, beoordelingen en overzicht.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.15
  - number: 3.16.1
    text: |-
      De examenkandidaat die eindexamen vmbo aflegt kan het schoolexamen maatschappijleer behorend tot het
      gemeenschappelijk deel van de leerwegen opnieuw afleggen, indien hij voor dat vak een eindcijfer heeft behaald
      lager dan 6.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Het bevoegd gezag van een school voor mavo of vbo kan bepalen dat een examenkandidaat voor een of meer andere
      vakken dan maatschappijleer het schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.16
  - number: 3.16.3
    text: Het herexamen omvat door het bevoegd gezag aangegeven onderdelen van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.16
  - number: 3.16.4
    text: Het bevoegd gezag stelt vast hoe het cijfer van het herexamen wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.16
  - number: 3.16.5
    text: |-
      Het hoogste cijfer voor een vak, behaald bij het schoolexamen of het herexamen, is het definitieve cijfer van het
      schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.16
  - number: 3.17.1
    text: |-
      Het college kan bepalen dat een centraal examen in een vak wordt afgenomen op een tijdstip dat is gelegen voor de
      aanvang van het eerste tijdvak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Het college kan voor een centraal examen in een vak een afnameperiode instellen waarbinnen het bevoegd gezag zelf
      de afnametijdstippen bepaalt. Deze afnameperiode vangt niet eerder aan dan op 1 april van dat examenjaar en omvat
      het eerste en tweede tijdvak van dat examenjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.17
  - number: '3.18'
    text: |-
      De rector of directeur deelt jaarlijks voor 1 november aan Onze Minister mee hoeveel examenkandidaten per vak aan
      het centraal examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.18
  - number: 3.19.1
    text: |-
      Onze Minister draagt er zorg voor dat de opgaven, bedoeld in
      [artikel 2, onderdeel c, van de Wet College voor toetsen en examens][ref1], tijdig beschikbaar worden gesteld aan
      de rector of directeur van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.19.2
    text: |-
      De rector of directeur draagt er zorg voor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang
      van de toets waarvoor deze opgaven dienen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.19
  - number: 3.19.3
    text: Het college kan opgaven aanwijzen waarop het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.19
  - number: 3.20.1
    text: De rector of directeur draagt zorg voor het nodige toezicht bij het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.20.2
    text: |-
      Tijdens het centraal examen worden aan de examenkandidaten geen mededelingen van welke aard ook over de opgaven
      gedaan, uitgezonderd mededelingen van het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de rector of directeur samen
      met het gemaakte examenwerk.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.20.4
    text: Een examenkandidaat wordt tot uiterlijk een half uur na de aanvang tot een toets toegelaten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.20.5
    text: De aan de examenkandidaten voorgelegde opgaven blijven in het examenlokaal tot het einde van die toets.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.20.6
    text: Het college kan regels stellen voor de uitvoering van een toets van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.20
  - number: 3.21.1
    text: 'De rector of directeur doet aan de examinator in een vak toekomen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.1.a
    text: het gemaakte werk van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.1.b
    text: een exemplaar van de opgaven;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.1.c
    text: de beoordelingsnormen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.1.d
    text: het proces-verbaal van het examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.2
    text: |-
      De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.21.3
    text: |-
      De examinator drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.21.4
    text: De examinator zendt de score en het beoordeelde werk aan de rector of directeur.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.5
    text: |-
      Bij digitale examinering met gebruikmaking van de daartoe door het college beschikbaar gestelde programmatuur
      worden de handelingen, bedoeld in dit artikel, digitaal verricht, uitgezonderd de handelingen die betrekking hebben
      op het proces-verbaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.21.6
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de beoordeling van het centraal examen door de
      examinator.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.21
  - number: 3.22.1
    text: |-
      Onze Minister maakt een koppeling van scholen en instellingen voor educatie en beroepsonderwijs voor de uitvoering
      van de tweede correctie door gecommitteerden als bedoeld in [artikel 2.56, zesde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.22.2
    text: |-
      Onze Minister maakt de koppeling bekend aan het bevoegd gezag van elke school of elke instelling voor educatie en
      beroepsonderwijs en kan, zo nodig, zelf een gecommitteerde aanwijzen voor een school of instelling.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.22
  - number: 3.23.1
    text: |-
      Het bevoegd gezag wijst op grond van de koppeling, bedoeld in [artikel 3.22][ref1], een of meer gecommitteerden
      aan.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.23.2
    text: |-
      Het bevoegd gezag maakt de gecommitteerden, bedoeld in het eerste lid, bekend aan de scholen waarvoor zij de tweede
      correctie verrichten. Zij blijven als gecommitteerde aangewezen tot na de afloop van de herkansing.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.23
  - number: 3.23.3
    text: Het bevoegd gezag draagt er zorg voor dat de aangewezen gecommitteerde zijn verplichtingen nakomt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.23
  - number: 3.23.4
    text: Voor het cspe van het centraal examen vmbo wordt geen gecommitteerde aangewezen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.23
  - number: 3.24.1
    text: |-
      De rector of directeur, bedoeld in [artikel 3.21][ref1], doet onverwijld na de beoordeling door de examinator aan
      de rector of directeur van de gecommitteerde toekomen:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.24.1.a
    text: het door de examinator beoordeelde werk van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.1.b
    text: een exemplaar van de opgaven;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.1.c
    text: de beoordelingsnormen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.1.d
    text: het proces-verbaal van het examen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.1.e
    text: |-
      de regels voor het bepalen van de score, bedoeld in [artikel 3.21, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.24.2
    text: |-
      De rector of directeur van de gecommitteerde doet de documenten, bedoeld in het eerste lid, toekomen aan de
      gecommitteerde.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.3
    text: |-
      [Artikel 3.21, tweede, derde, vijfde en zesde lid][ref1], is van overeenkomstige toepassing op de beoordeling door
      de gecommitteerde.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.24.4
    text: |-
      De gecommitteerde voegt bij het gecorrigeerde werk een verklaring over de verrichte correctie. Deze verklaring is
      medeondertekend door het bevoegd gezag van de school waar de gecommitteerde werkzaam is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.24.5
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het bepaalde in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.24
  - number: 3.25.1
    text: De examinator en de gecommitteerde stellen in onderling overleg de score voor het centraal examen vast.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.25
  - number: 3.25.2
    text: |-
      Indien de examinator en de gecommitteerde niet tot overeenstemming over de score komen, wordt het geschil
      voorgelegd aan het bevoegd gezag van de gecommitteerde. Het bevoegd gezag van de gecommitteerde kan hierover in
      overleg treden met het bevoegd gezag van de examinator.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.25
  - number: 3.25.3
    text: |-
      Indien het geschil niet kan worden beslecht, wordt hiervan melding gemaakt aan de inspectie. De inspectie kan
      een onafhankelijke corrector aanwijzen. De beoordeling van deze corrector komt in de plaats van de eerdere
      beoordelingen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.25
  - number: 3.25.4
    text: |-
      De rector of directeur stelt het cijfer voor het centraal examen in een vak vast op grond van de score, bedoeld
      in het eerste lid, of de beoordeling, bedoeld in het derde lid, en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.26.1
    text: |-
      De rector of directeur draagt er zorg voor dat bij het maken van het cspe van een eindexamen vmbo een examinator in
      het vak of programma aanwezig is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.26
  - number: 3.26.2
    text: |-
      De examinator beoordeelt de prestaties van de examenkandidaat tijdens het maken van de opgaven en legt zijn
      bevindingen van de verrichtingen van de examenkandidaat schriftelijk vast, volgens daartoe door het college gegeven
      richtlijnen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.26
  - number: 3.26.3
    text: |-
      De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.26.4
    text: |-
      De examinator drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 3.26.5
    text: De examinator doet de score en voor zover mogelijk het beoordeelde werk toekomen aan de rector of directeur.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.26
  - number: 3.27.1
    text: |-
      Voor het cspe van het eindexamen vmbo vindt de beoordeling ook plaats door een tweede examinator als
      bedoeld in [artikel 3.26, tweede lid][ref1]. De tweede examinator kan een deskundige als bedoeld in
      [artikel 2.51, vierde lid, van de wet][ref2] of een examinator van de school zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.27.2
    text: |-
      De tweede examinator beoordeelt het resultaat van de opgaven en de verrichtingen van de examenkandidaat zoals
      blijkend uit de schriftelijke vastlegging, bedoeld in [artikel 3.26, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.27.3
    text: 'De rector of directeur overhandigt aan de tweede examinator:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
  - number: 3.27.3.a
    text: een exemplaar van de opgaven;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
  - number: 3.27.3.b
    text: de beoordelingsnormen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
  - number: 3.27.3.c
    text: het proces-verbaal; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
  - number: 3.27.3.d
    text: de regels voor het bepalen van de score, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
  - number: 3.27.4
    text: |-
      [Artikel 3.21, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.28'
    text: |-
      Het college kan vakken aanwijzen waarin wegens het zeer geringe aantal examenkandidaten, het centraal examen in het
      tweede tijdvak door dit college wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Indien een examenkandidaat om een geldige reden, ter beoordeling van de rector of directeur, is verhinderd bij
      het centraal examen van een of meer vakken in het eerste tijdvak aanwezig te zijn, krijgt in het tweede tijdvak de
      gelegenheid het centraal examen alsnog te voltooien. De examenkandidaat maakt in dat geval maximaal twee toetsen
      per dag.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.29
  - number: 3.29.2
    text: |-
      Indien een examenkandidaat ook in het tweede tijdvak om een geldige reden, ter beoordeling van de rector of
      directeur, verhinderd is, of als hij het centraal examen in het tweede tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld in het derde tijdvak ten overstaan van het college zijn eindexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.29
  - number: 3.29.3
    text: |-
      Indien het bevoegd gezag op grond van [artikel 3.17, tweede lid][ref1], zelf de afnametijdstippen van een centraal
      examen bepaalt, kan de rector of directeur een examenkandidaat de gelegenheid geven om binnen de afnameperiode die
      het college daarvoor heeft ingesteld, alsnog het centraal examen te voltooien, waarvoor hij eerder was verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.30.1
    text: |-
      Indien een examenkandidaat gebruik wil maken van de gelegenheid, bedoeld in [artikel 3.29, tweede lid][ref1], meldt
      hij dit zo spoedig mogelijk aan de rector of directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.30.2
    text: |-
      De rector of directeur deelt voorafgaande aan het tweede of het derde tijdvak aan het college mee welke
      examenkandidaten het centraal examen in deze tijdvakken ten overstaan van het college zullen afleggen en in welke
      vakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
  - number: 3.30.3
    text: |-
      Indien voor een examenkandidaat toepassing is gegeven aan de [artikelen 3.54][ref1] of [3.55][ref2], deelt de
      rector of directeur dit mee aan het college, onder vermelding van de toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.30.4
    text: |-
      De examenkandidaat levert de opgaven, de door hem gemaakte aantekeningen en andere door hem gemaakte stukken in bij
      een van degenen die toezicht houden. Het college bepaalt in welke gevallen wordt afgeweken van de eerste volzin en
      in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere stukken, bedoeld in die volzin, aan
      de examenkandidaat worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
  - number: 3.30.5
    text: |-
      Het college deelt het door de examenkandidaat behaalde cijfer voor het centraal examen aan de rector of directeur
      mee.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
  - number: 3.30.6
    text: |-
      Indien sprake is van een centraal eindexamen met geheime opgaven, kan de examenkandidaat over zijn werk gedurende
      een periode van zes maanden na de mededeling, bedoeld in het vijfde lid, inlichtingen inwinnen bij het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.30
  - number: 3.31.1
    text: |-
      Het bevoegd gezag bewaart het gemaakte werk van het centraal examen van de examenkandidaat gedurende ten minste zes
      maanden na de vaststelling van de uitslag, ter inzage voor belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.31
  - number: 3.31.2
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven
      gedurende ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.31
  - number: 3.32.1
    text: Het eindcijfer voor vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.32
  - number: 3.32.2
    text: |-
      De rector of directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen en
      het cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.32
  - number: 3.32.3
    text: |-
      Indien in een vak alleen een schoolexamen is afgenomen en niet ook een centraal examen, is het cijfer voor het
      schoolexamen ook het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.32
  - number: 3.33.1
    text: |-
      De rector of directeur stelt voor de vaststelling van de uitslag van het eindexamen vast of de
      examenkandidaat het eindexamen heeft afgelegd in de voor het eindexamen voorgeschreven vakken, bedoeld in de
      [artikelen 3.1 tot en met 3.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.33.2
    text: |-
      De examenkandidaat toont in voorkomend geval ten genoegen van de rector of directeur aan dat hij recht heeft op een
      vrijstelling op grond van [artikel 3.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.33.3
    text: |-
      Indien dat nodig is om de examenkandidaat te laten slagen betrekken de rector of directeur en de examensecretaris
      een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken
      dienen een eindexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.33
  - number: 3.33.4
    text: |-
      Indien de examenkandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      eindexamen in een of meer vakken aan een instelling voor educatie en beroepsonderwijs, betrekken de rector of
      directeur en de examensecretaris de met het deelstaatsexamen respectievelijk dat eindexamen behaalde cijfers,
      indien de examenkandidaat daarom tijdig en schriftelijk heeft verzocht, bij de uitslagbepaling.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.33
  - number: 3.34.1
    text: 'De examenkandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.b
    text: |-
      hij voor één van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of hoger heeft behaald en hij voor het andere vak of andere
      hier genoemde vakken als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.c.1°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.c.2°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.c.4°
    text: |-
      voor een van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor een van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      hoger heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.d
    text: hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.1.e
    text: |-
      hij voor het vak lichamelijke opvoeding van het gemeenschappelijk deel van elk profiel, de kwalificatie «voldoende»
      of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van een vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer, culturele en kunstzinnige vorming en het profielwerkstuk. Het bevoegd gezag kan daaraan
      toevoegen:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.2.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van die
      taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.2.b
    text: algemene natuurwetenschappen in vwo en havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.2.c
    text: |-
      bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande dat
      indien het bevoegd gezag hiertoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs geen
      onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met toepassing
      van [artikel 3.1, eerste lid, onderdeel c][ref1], [artikel 3.2, eerste lid, onderdeel c][ref2], of
      [artikel 3.3, eerste lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.34.3
    text: |-
      Indien het bevoegd gezag toepassing geeft aan het tweede lid, tweede volzin, wordt in het examenreglement vermeld
      welk onderdeel of welke onderdelen zijn toegevoegd voor de bepaling van het eindcijfer, bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.4
    text: |-
      De rector of directeur bepaalt het eindcijfer, bedoeld in het tweede lid, als het rekenkundig gemiddelde van de
      eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
  - number: 3.34.5
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de rector of directeur deze schriftelijk
      aan de examenkandidaat bekend, onder mededeling van het recht van herkansing, bedoeld in [artikel 3.38][ref1].
      Indien de examenkandidaat geen herexamen doet is deze uitslag de definitieve uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.35.1
    text: 'De examenkandidaat die het eindexamen vmbo in een leerweg heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.b
    text: hij voor het vak Nederlandse taal als eindcijfer 5 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.c.1°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.c.2°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft behaald;
      of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft
      behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.d
    text: hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.e
    text: |-
      hij voor de vakken lichamelijke opvoeding en kunstvakken inclusief culturele en kunstzinnige vorming de
      kwalificatie «voldoende» of «goed» heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.1.f
    text: |-
      als het gaat om een eindexamen vmbo gemengde of theoretische leerweg: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo theoretische leerweg het
      eindcijfer van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen vmbo gemengde leerweg bij
      de uitslagbepaling betrokken als deze vakken samen ten minste een volledig beroepsgericht programma als bedoeld in
      [artikel 3.7, eerste lid, onderdeel d][ref1], dan wel het praktijkgerichte programma, als bedoeld in artikel 3.7,
      lid 1a, vormen. In dat geval is het vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.35.3
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo basisberoepsgerichte
      leerweg en kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken
      aangemerkt als het eindcijfer van een vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.4
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo gemengde leerweg het
      gemiddelde van de eindcijfers van het profielvak, dan wel het praktijkgerichte vak dat in de plaats van het
      profielvak is gekozen, en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van een vak, met dien
      verstande dat het eindcijfer voor het profielvak, dan wel het praktijkgerichte vak daarbij net zo vaak meetelt als
      het aantal eindcijfers van beroepsgerichte keuzevakken dat in de berekening wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.5
    text: |-
      De rector of directeur bepaalt het eindcijfer, bedoeld in het derde en vierde lid, als het rekenkundig gemiddelde
      van de eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal
      is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.6
    text: |-
      In afwijking van het eerste lid is de examenkandidaat die het eindexamen vmbo basisberoepsgerichte leerweg heeft
      afgelegd ter afsluiting van een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref1] geslaagd indien:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.35.6.a
    text: hij voor het vak Nederlandse taal als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.6.b
    text: hij voor het profielvak als eindcijfer 6 of hoger heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.6.c
    text: hij als eindcijfer, bedoeld in het derde lid, 6 of hoger heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
  - number: 3.35.7
    text: |-
      Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de rector of directeur deze schriftelijk
      aan de examenkandidaat bekend, onder mededeling van het recht van herkansing, bedoeld in [artikel 3.38][ref1].
      Indien de examenkandidaat geen herexamen doet is deze uitslag de definitieve uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.36.1
    text: |-
      Indien een leerling overeenkomstig [artikel 2.56, vierde lid, van de wet][ref1] in een of meer vakken eindexamen
      heeft afgelegd in het voorlaatste of direct daaraan voorafgaande leerjaar, maakt de rector of directeur het
      eindcijfer van dit eindexamen schriftelijk aan de examenkandidaat bekend zodra deze is vastgesteld, onder
      mededeling van het recht van herkansing, bedoeld in [artikel 3.38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.36
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.36.2
    text: |-
      Indien een leerling als bedoeld in het eerste lid niet is bevorderd tot het volgende leerjaar, vervallen de met dit
      centraal examen of deze centrale examens behaalde resultaten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.36
  - number: '3.37'
    text: |-
      Indien een examenkandidaat gebruik heeft gemaakt van de mogelijkheid tot het afleggen van eindexamen in een
      overeenkomstig vak op een hoger niveau dan het niveau van de schoolsoort of leerweg van inschrijving, stelt de
      rector of directeur de examenkandidaat in de gelegenheid alsnog in dat vak het eindexamen af te leggen van die
      schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.37
  - number: 3.38.1
    text: |-
      De examenkandidaat kan voor één vak van het eindexamen waarin hij centraal examen heeft afgelegd, in het tweede of,
      indien [artikel 3.29, eerste lid][ref1], van toepassing is, het derde tijdvak, opnieuw deelnemen aan het centraal
      examen of aan het cspe.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.38.2
    text: |-
      Bij het eindexamen vmbo basisberoepsgerichte leerweg en kaderberoepsgerichte leerweg kan de examenkandidaat ook
      opnieuw deelnemen aan het cspe dat door het bevoegd gezag aansluitend aan het eerste tijdvak of in het tweede
      tijdvak wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
  - number: 3.38.3
    text: De herkansing van het cspe bestaat uit het opnieuw afleggen van deze toets of van een of meer onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
  - number: 3.38.4
    text: |-
      De examenkandidaat heeft het recht, bedoeld in het eerste en tweede lid, indien op grond van
      [artikel 3.34, vijfde lid][ref1], of [artikel 3.35, zevende lid][ref2], de eindcijfers zijn bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.38.5
    text: |-
      De examenkandidaat deelt de rector of directeur voor een door deze laatste te bepalen dag en tijdstip schriftelijk
      mee dat hij gebruik maakt van het recht van herkansing, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
  - number: 3.38.6
    text: |-
      Dit artikel is ook van toepassing als in plaats van een volledig eindexamen, eindexamen in een of meer vakken wordt
      afgelegd. De examenkandidaat die in een examenjaar zowel een volledig eindexamen als eindexamen in een of meer
      vakken aflegt, oefent het recht, bedoeld in het eerste en tweede lid, ten hoogste eenmaal uit.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.38
  - number: 3.39.1
    text: |-
      Het hoogste cijfer voor een vak, behaald bij het centraal examen of de herkansing, is het definitieve cijfer van
      het centraal examen in dat vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.39
  - number: 3.39.2
    text: |-
      Na afloop van de herkansing in het laatste leerjaar stelt de rector of directeur de uitslag definitief vast
      met overeenkomstige toepassing van [artikel 2.57, tweede lid, van de wet][ref1] en de [artikelen 3.34][ref2] en
      [3.35][ref3] en maakt deze schriftelijk aan de examenkandidaat bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.39
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.39.3
    text: |-
      Na afloop van een herkansing in het voorlaatste of direct daaraan voorafgaande leerjaar maakt de rector of
      directeur het definitief cijfer schriftelijk aan de examenkandidaat bekend.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.39
  - number: 3.40.1
    text: 'Op de cijferlijst van het eindexamen worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.a
    text: de cijfers voor het schoolexamen en de cijfers voor het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.b
    text: voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.c
    text: voor vmbo theoretische leerweg en gemengde leerweg het thema en de beoordeling van het profielwerkstuk;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.d
    text: de beoordeling van het vak lichamelijke opvoeding in vwo en havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.e
    text: |-
      de beoordeling van de vakken lichamelijke opvoeding en kunstvakken inclusief culturele en kunstzinnige vorming uit
      het gemeenschappelijk deel van een leerweg in mavo en vbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.f
    text: |-
      de beoordeling van de maatschappelijke stage, indien deze onderdeel is van het eindexamen en is beoordeeld met
      «voldoende» of «goed»;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.1.g
    text: |-
      de eindcijfers voor de examenvakken, met inbegrip van het eindcijfer, bedoeld in [artikel 3.34, tweede lid][ref1],
      of [artikel 3.35, derde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.40.1.h
    text: |-
      de uitslag van het eindexamen, bedoeld in [artikel 2.57, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.40.2
    text: |-
      Indien een examenkandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een
      eindexamen vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst
      vermeld, tenzij de examenkandidaat daartegen bedenkingen heeft geuit.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.3
    text: De rector of directeur en de examensecretaris ondertekenen de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: 3.40.4
    text: |-
      Indien de examenkandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de rector of directeur er op
      verzoek van de examenkandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar eindexamen
      in een of meer vakken of deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.40
  - number: '3.41'
    text: |-
      Op de cijferlijst van een examenkandidaat als bedoeld in [artikel 3.52][ref1] die eindexamen vmbo aan een school
      heeft afgelegd in een of meer vakken worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.41.a
    text: de leerweg;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.41
  - number: 3.41.b
    text: de cijfers voor het schoolexamen en het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.41
  - number: 3.41.c
    text: het thema en de beoordeling van het profielwerkstuk; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.41
  - number: 3.41.d
    text: |-
      de eindcijfers voor de examenvakken, met inbegrip van het eindcijfer, bedoeld in
      [artikel 3.35, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.41
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.42'
    text: |-
      Bij het eindexamen vwo en het eindexamen havo geldt voor de vermelding op de cijferlijst van vakken waarvoor de
      examenkandidaat bij het eindexamen vrijstelling is verleend het volgende:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.42
  - number: 3.42.a
    text: |-
      het vak maatschappijleer waarvoor de examenkandidaat bij het eindexamen vwo is vrijgesteld op grond van het bezit
      van een diploma havo, wordt niet vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.42
  - number: 3.42.b
    text: |-
      vakken waarvoor de examenkandidaat bij het eindexamen vwo is vrijgesteld op grond van een eerder afgelegd
      eindexamen havo of eindexamen vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met
      vermelding van het eerder behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.42
  - number: 3.42.c
    text: |-
      vakken waarvoor de examenkandidaat bij het eindexamen havo is vrijgesteld op grond van een eerder afgelegd
      eindexamen vmbo waarvan deze havo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het
      eerder behaalde cijfer; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.42
  - number: 3.42.d
    text: |-
      andere vakken waarvoor de examenkandidaat vrijstelling is verleend, worden vermeld op de cijferlijst, zonder
      vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.42
  - number: '3.43'
    text: |-
      Bij het eindexamen vmbo geldt voor de vermelding op de cijferlijst van vakken waarvoor de examenkandidaat bij het
      eindexamen vrijstelling is verleend het volgende:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.43
  - number: 3.43.a
    text: |-
      vakken waarvoor de examenkandidaat bij het eindexamen vmbo theoretische leerweg is vrijgesteld op grond van een
      eerder afgelegd eindexamen vmbo kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg waarvan deze
      vakken van de theoretische leerweg deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.43
  - number: 3.43.b
    text: |-
      de extra vakken die op grond van [artikel 3.4, vierde lid][ref1], bij het eindexamen vmbo theoretische leerweg zijn
      gekozen worden vermeld op de cijferlijst, met vermelding van het daarvoor behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.43
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.43.c
    text: |-
      andere vakken waarvoor de examenkandidaat vrijstelling is verleend, worden vermeld op de cijferlijst, zonder
      vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.43
  - number: '3.44'
    text: |-
      De rector of directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een
      diploma gymnasium een diploma atheneum uitreiken aan een examenkandidaat indien:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.44
  - number: 3.44.a
    text: de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.44
  - number: 3.44.b
    text: |-
      de scholengemeenschap of school voor vwo overeenkomstig [artikel 2.93 van de wet][ref1] kenbaar heeft gemaakt dat
      het behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.44.c
    text: de examenkandidaat staat ingeschreven voor atheneum onderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.44
  - number: '3.45'
    text: |-
      De rector of directeur van een scholengemeenschap die in elk geval een school voor mavo omvat, reikt op verzoek van
      de examenkandidaat die met goed gevolg het examen vmbo gemengde leerweg aan die school heeft afgelegd en bovendien
      examen heeft afgelegd in een extra algemeen vak en met het meetellen van dat vak voldoet aan [artikel 3.35][ref1]
      voor zover het gaat om de uitslag van het eindexamen vmbo theoretische leerweg, het diploma vmbo theoretische
      leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.46.1
    text: |-
      Het diploma voor het eindexamen vermeldt het profiel of de profielen die bij de uitslag van het eindexamen zijn
      betrokken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.46
  - number: 3.46.2
    text: Het diploma vmbo vermeldt in elk geval de leerweg die bij de uitslag is betrokken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.46
  - number: 3.46.3
    text: De rector of directeur en de examensecretaris ondertekenen het diploma.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.46
  - number: 3.47.1
    text: |-
