        paragraaf: '8'
  - number: 9.4.2
    text: |-
      [Artikel 2.45][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.4
    references:
