        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.11.3
    text: |-
      De aanvullende bekostiging, bedoeld in [artikel 6.2, tweede lid][ref1], wordt in een keer betaald dan wel wordt
      betaald volgens een bij ministeriële regeling te bepalen betaalritme.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.11
