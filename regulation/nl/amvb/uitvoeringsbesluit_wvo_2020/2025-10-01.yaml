        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '9.3'
    text: |-
      [Artikel 2.41][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.3
    references:
