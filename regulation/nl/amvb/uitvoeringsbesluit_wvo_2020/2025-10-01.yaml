      geplaatst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.7
  - number: 6.7.2
    text: Een leerling telt voor één school mee voor de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Voor het bepalen van de hoogte van de bekostiging van een school of scholengemeenschap worden niet meegeteld de
      leerlingen die:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.8
  - number: 6.8.1.a
    text: |-
      vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen zonder geldige
      reden hebben verzuimd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.8
  - number: 6.8.1.b
    text: |-
      al met goed gevolg eindexamen aan een school voor vwo, havo, mavo of vbo hebben afgelegd en zich voorbereiden op
      het opnieuw afleggen van het eindexamen aan een gelijksoortige school, met dien verstande dat het afleggen van
      het eindexamen in een bepaalde leerweg van het vmbo door een leerling die al met goed gevolg het eindexamen heeft
      afgelegd van een andere leerweg van het vmbo niet wordt aangemerkt als het opnieuw afleggen van het eindexamen aan
      een gelijksoortige school;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.8
  - number: 6.8.1.c
    text: |-
      deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 2.9, tweede lid, van de wet][ref1]; en


