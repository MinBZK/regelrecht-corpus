    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.d.2°
    text: ter keuze van de leerling, biologie of natuur- en scheikunde I;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.e
    text: 'het profiel dienstverlening en producten:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: '2.22'
    text: 'Het vrije deel van een profiel in de beroepsgerichte leerwegen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.22
  - number: 2.22.a
    text: |-
      omvat door de leerling te kiezen beroepsgerichte keuzevakken, met dien verstande dat het bevoegd gezag beslist
      welke beroepsgerichte keuzevakken worden aangeboden; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.22
  - number: 2.22.b
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.22
  - number: 2.23.1
    text: |-
      Het bevoegd gezag kan een leerling in een beroepsgerichte leerweg in de gelegenheid stellen om in plaats van
      de vakken van het gemeenschappelijk deel of van het profieldeel van de beroepsgerichte leerweg, genoemd in de
      [artikelen 2.20][ref1] en [2.21][ref2], of van de vakken die in de plaats komen van een tweede moderne vreemde taal
      te volgen:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
