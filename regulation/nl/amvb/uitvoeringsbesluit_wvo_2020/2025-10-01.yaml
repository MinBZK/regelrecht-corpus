        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: '9.36'
    text: |-
      [Artikel 6.14][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.36
    references:
