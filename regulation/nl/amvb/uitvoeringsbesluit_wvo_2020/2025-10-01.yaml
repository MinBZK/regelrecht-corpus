        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '2.20'
    text: 'Het gemeenschappelijk deel van een profiel in de beroepsgerichte leerwegen omvat de volgende vakken:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.20.a
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.20.b
    text: Engelse taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.20.c
    text: maatschappijleer;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.20.d
    text: lichamelijke opvoeding en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.20.e
    text: ten minste een van de vakken behorende tot de beeldende vorming, muziek, dans, of drama.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.20
  - number: 2.21.1
    text: |-
      Het profieldeel van de beroepsgerichte leerwegen omvat voor de volgende profielen de daarachter vermelde
      profielvakken:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.a
    text: 'het profiel bouwen, wonen en interieur: het profielvak bouwen, wonen en interieur;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.b
    text: 'het profiel produceren, installeren en energie: het profielvak produceren, installeren en energie;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.c
    text: 'het profiel mobiliteit en transport: het profielvak mobiliteit en transport;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.d
    text: 'het profiel media, vormgeving en ICT: het profielvak media, vormgeving en ICT;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.e
    text: 'het profiel maritiem en techniek: het profielvak maritiem en techniek;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.f
    text: 'het profiel zorg en welzijn: het profielvak zorg en welzijn;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.g
    text: 'het profiel economie en ondernemen: het profielvak economie en ondernemen;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.h
    text: 'het profiel horeca, bakkerij en recreatie: het profielvak horeca, bakkerij en recreatie;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.i
    text: 'het profiel groen: het profielvak groen; en'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.1.j
    text: 'het profiel dienstverlening en producten: het profielvak dienstverlening en producten.'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2
    text: 'Naast het profielvak omvat het profieldeel voor de volgende profielen de daarachter vermelde vakken:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.a
    text: |-
      het profiel bouwen, wonen en interieur, het profiel produceren, installeren en energie, het profiel mobiliteit en
      transport en het profiel media, vormgeving en ICT:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.a.1°
    text: wiskunde; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.a.2°
    text: natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.b
    text: 'het profiel zorg en welzijn:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.b.1°
    text: biologie; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.b.2°
    text: |-
      ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde, met
      dien verstande dat het bevoegd gezag beslist welke van de laatste drie vakken wordt of worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.c
    text: 'het profiel economie en ondernemen, en het profiel horeca, bakkerij en recreatie:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.c.1°
    text: economie; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.c.2°
    text: |-
      ter keuze van de leerling, wiskunde, Franse taal of Duitse taal, met dien verstande dat het bevoegd gezag beslist
      welke van de twee laatste vakken wordt of worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.d
    text: 'het profiel groen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.21
  - number: 2.21.2.d.1°
