      teldatum als werkelijk schoolgaand op de school zijn ingeschreven, als bedoeld in [artikel 6.7, eerste lid][ref3].
      [Artikel 6.8, eerste lid, onderdeel a, en tweede lid][ref4], is op deze leerlingen van overeenkomstige toepassing.


