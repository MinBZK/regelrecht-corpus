        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '6'
  - number: 9.25.1
    text: |-
      De bekostiging, bedoeld in [artikel 11.56 van de wet][ref1], voor scholen op Bonaire bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11'
  - number: 9.25.1.a
    text: een bedrag per school dat afhangt van het aantal leerlingen op de school;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.1.b
    text: 'een bedrag per leerling, waarbij onderscheid wordt gemaakt tussen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.1.b.1°
    text: |-
      leerlingen in het praktijkonderwijs of in het derde of vierde leerjaar van de basisberoepsgerichte
      of kaderberoepsgerichte leerweg van het vbo, alsmede ISK-leerlingen en leerlingen met een specifieke
      onderwijsbehoefte; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.1.b.2°
    text: |-
      leerlingen in het vwo, havo, mavo of vbo, met uitzondering van leerlingen in het derde of vierde leerjaar van de
      basisberoepsgerichte en kaderberoepsgerichte leerweg van het vbo, ISK-leerlingen en leerlingen met een specifieke
      onderwijsbehoefte;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.1.c
    text: |-
      een bij ministeriële regeling te bepalen procentuele opslag over de optelsom van de bedragen bedoeld in de
      onderdelen a en b, in verband met de zorg aan leerlingen met een specifieke onderwijsbehoefte, bedoeld in
      [artikel 11.23, eerste lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11'
  - number: 9.25.1.d
    text: |-
      een aanvullend bedrag per school voor het opzetten en in stand houden van kleine arbeidsmarktgerelateerde mbo-
      opleidingen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2
    text: |-
      De bekostiging, bedoeld in [artikel 11.56 van de wet][ref1], voor scholen als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref2], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0045020#Artikel1
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0045020
        artikel: '1'
  - number: 9.25.2.a
    text: een bedrag per school, dat afhangt van het aantal leerlingen op de school;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.b
    text: 'een bedrag per leerling, waarbij onderscheid wordt gemaakt tussen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.b.1°
    text: leerlingen in de lower forms of leerlingen die CSEC en CAPE volgen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.b.2°
    text: leerlingen in het praktijkonderwijs of leerlingen die CVQ volgen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.c
    text: |-
      een bij ministeriële regeling nader te bepalen procentuele opslag over de optelsom van de bedragen, bedoeld in
      de onderdelen a en b, in verband met de zorg aan leerlingen met een specifieke onderwijsbehoefte, bedoeld in
      [artikel 11.23, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '11'
  - number: 9.25.2.d
    text: |-
      een bij ministeriële regeling te bepalen procentuele opslag over de optelsom van de onderdelen a tot en met c in
      verband met het loon- en prijspeil en de examenkosten op Sint-Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.e
    text: |-
      een aanvullend bedrag per school in verband met de geïsoleerde ligging en de kleinschaligheid op Sint Eustatius en
      Saba, dat afhangt van het aantal leerlingen op de school; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.2.f
    text: |-
      een aanvullend bedrag per school voor het opzetten en in stand houden van kleine arbeidsmarktgerelateerde CVQ-
      opleidingen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.25.3
    text: |-
      De bekostiging, bedoeld in het eerste en tweede lid, wordt vastgesteld in US dollars, en wordt rekenkundig afgerond
      op twee decimalen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.25
  - number: 9.26.1
    text: |-
      In [artikel 6.2, eerste lid][ref1], wordt voor «[artikel 5.6][ref2]» gelezen «[artikel 11.56][ref3]».


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel11
