        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.28.1
    text: |-
      In het derde leerjaar volgt de leerling in de gemengde leerweg naast de vakken van het gemeenschappelijk deel ten
      minste onderwijs in een beroepsgericht programma als bedoeld in [artikel 3.7, eerste lid, onderdeel d][ref1], en
      vijf algemene vakken waarin eindexamen kan worden afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.28.2
    text: |-
      Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand leerjaar,
      is het aantal algemene vakken, bedoeld in het eerste lid, vier.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.28
  - number: 2.28.3
    text: |-
      Indien de leerling in plaats van een beroepsgericht programma als bedoeld in
      [artikel 3.7, eerste lid, onderdeel d][ref1], onderwijs in een praktijkgericht programma als bedoeld in artikel
      3.7, lid 1a, volgt of heeft gevolgd, is het aantal algemene vakken, bedoeld in het eerste lid, vier.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.29.1
    text: 'Bij ministeriële regeling wordt bepaald welke beroepsgerichte keuzevakken deel kunnen uitmaken van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.29
  - number: 2.29.1.a
    text: het beroepsgerichte programma in de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg van het vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.29
  - number: 2.29.1.b
    text: het praktijkgerichte programma in de gemengde leerweg van het vmbo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.29
  - number: 2.29.2
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de school voldoende beroepsgerichte keuzevakken aanbiedt waaruit
      leerlingen kunnen kiezen in het kader van hun beroepsgerichte programma, dan wel praktijkgerichte programma.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.29
  - number: 2.29.3
    text: |-
      Bij zijn keuze welke beroepsgerichte keuzevakken door de school worden aangeboden, consulteert het bevoegd gezag
      een of meer instellingen voor educatie en beroepsonderwijs en een of meer regionale arbeidsmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.29
  - number: 2.30.1
    text: |-
      Het bevoegd gezag van een school voor vmbo kan, in samenwerking met een of meer instellingen voor educatie en
      beroepsonderwijs en een of meer regionale arbeidsmarktpartijen, een beroepsgericht keuzevak ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.30
  - number: 2.30.2
    text: |-
      Het bevoegd gezag stelt de medezeggenschapsraad van de school op de hoogte van het voornemen tot ontwikkeling van
      een beroepsgericht keuzevak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.30
  - number: 2.30.3
    text: |-
      Het bevoegd gezag meldt het voornemen tot ontwikkeling van een beroepsgericht keuzevak zo spoedig mogelijk aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.30
  - number: 2.30.4
    text: Onze Minister brengt binnen zes weken na de melding schriftelijk advies uit over het voornemen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.30
  - number: 2.30.5
    text: |-
      Bij ministeriële regeling wordt een model vastgesteld voor de melding van het voornemen en kunnen nadere regels
      worden gesteld over de procedure voor deze melding.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.30
  - number: 2.31.1
    text: Onze Minister beslist over de goedkeuring van een beroepsgericht keuzevak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.2
    text: |-
      Onze Minister beslist binnen dertien weken op de aanvraag tot goedkeuring en laat zich daarbij adviseren door een
      onafhankelijke adviescommissie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.3
    text: |-
      Als Onze Minister een aanvraag inwilligt, neemt hij het nieuwe beroepsgerichte keuzevak uiterlijk met ingang van
      1 augustus daaropvolgend op in de ministeriële regeling, bedoeld in [artikel 2.29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.31.4
    text: 'Bij ministeriële regeling worden regels gesteld over beroepsgerichte keuzevakken, waaronder in elk geval over:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.4.a
    text: de aard en omvang van het beroepsgerichte keuzevak;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.4.b
    text: |-
      de opbouw van de leerstof, gedifferentieerd naar de verschillende leerwegen waarin het beroepsgerichte keuzevak kan
      worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.4.c
    text: de mate waarin een nieuw beroepsgerichte keuzevak zich onderscheidt van bestaande beroepsgerichte keuzevakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31.5
    text: |-
      Bij ministeriële regeling wordt een model vastgesteld voor de aanvraag tot goedkeuring van een beroepsgericht
      keuzevak en kunnen nadere regels worden gesteld over de procedure voor deze goedkeuring.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31
  - number: 2.31a
    text: |-
      Het bevoegd gezag dat een praktijkgericht vak, genoemd in [artikel 2.17a][ref1] of [artikel 2.25a][ref2], aanbiedt,
      werkt indien mogelijk, samen met ten minste één regionale arbeidsmarktpartij, dan wel instelling voor educatie en
      beroepsonderwijs bij het uitvoeren van het praktijkgericht vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.31a
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.32.1
    text: |-
      De leerling van een school voor mavo of vbo die in het bezit is van een diploma vmbo in een andere leerweg dan de
      leerweg van zijn inschrijving, en die met toepassing van de [artikelen 2.18][ref1], [2.23][ref2] of [2.27][ref3]
      in plaats van een vak voor de leerweg waarin hij eindexamen heeft afgelegd, examen heeft afgelegd in een
      overeenkomstig vak voor een andere leerweg, voor havo of voor vwo, of als extra vak, is vrijgesteld van het volgen
      van onderwijs in dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.32.2
    text: |-
      Dit artikel is ook van toepassing op een leerling die in een hoger leerjaar voor de eerste maal in Nederland tot
      een school is toegelaten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.32
  - number: 2.33.1
    text: |-
      Het bevoegd gezag kan een ontheffing als bedoeld in [artikel 2.4, tweede of derde lid][ref1], verleend voor de
      eerste twee leerjaren van het volgen van onderwijs in Franse taal of Duitse taal ook aanmerken als ontheffing
      voor het volgen van onderwijs in die taal voor de periode waarin de leerling onderwijs in de theoretische,
      kaderberoepsgerichte of gemengde leerweg volgt. Deze ontheffing wordt verleend aan leerlingen die:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.33.1.a
    text: |-
      op grond van [artikel 2.4, tweede lid][ref1], beschikken over een ontheffing en deze ontheffing wordt voortgezet;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.33.1.b
    text: in de periode van de eerste twee leerjaren onderwijs in Spaanse taal, Arabische taal of Turkse taal volgden; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
  - number: 2.33.1.c
    text: |-
      onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
  - number: 2.33.2
    text: |-
      Bij een ontheffing op grond van het eerste lid wordt het onderwijs in de betrokken taal vervangen door het
      onderwijs in Arabische taal, Turkse taal, Spaanse taal, maatschappijkunde, geschiedenis en staatsinrichting, of
      aardrijkskunde.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
  - number: 2.33.3
    text: |-
      Dit artikel is ook van toepassing op een leerling die in een hoger leerjaar voor de eerste maal in Nederland tot
      een school is toegelaten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.33
  - number: '2.34'
    text: |-
      De stage, bedoeld in de [artikelen 2.26, derde lid][ref1], en [2.27, derde lid, van de wet][ref2], maakt onderdeel
      uit van de profielvakken van de basisberoepsgerichte, kaderberoepsgerichte of gemengde leerweg, de praktijkgerichte
      vakken, genoemd in [artikel 2.25a][ref3] of van de beroepsgerichte keuzevakken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.35.1
    text: Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.35
  - number: 2.35.2
    text: |-
      Een stage wordt doorlopen op een of meer stageplaatsen, die ter beschikking worden gesteld door een of meer
      stagebieders.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.35
  - number: 2.36.1
    text: |-
      Het bevoegd gezag sluit met de ouders respectievelijk de leerling indien deze handelingsbekwaam is en de
      stagebieder een schriftelijke stageovereenkomst waaruit blijkt dat de leerling leeractiviteiten ontplooit in het
      kader van het stageplan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.2
    text: |-
      Het bevoegd gezag wijst op de school een stageleraar aan die belast is met het toezicht op de leerling gedurende
      de stage. De stagebieder wijst een stagebegeleider aan die bij hem werkzaam is en belast is met de begeleiding van
      de leerling.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3
    text: 'De stageovereenkomst omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3.a
    text: |-
      de leeractiviteiten die de leerling bij de aangewezen stagebieder op een of meer specifieke stageplaatsen moet
      ontplooien;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3.b
    text: de aanvangsdatum, de einddatum en de tijden van de leeractiviteiten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3.c
    text: |-
      een regeling voor de begeleiding van de leerling bij de stagebieder waarin in elk geval wordt geregeld welk aandeel
      in de begeleiding door de stageleraar respectievelijk door de stagebegeleider wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3.d
    text: de wijze waarop de stagebieder bij de beoordeling van de leeractiviteiten wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.3.e
    text: een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.4
    text: 'De stageovereenkomst bepaalt ook:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.4.a
    text: |-
      wie de verzekering sluit tegen het financiële risico van ongevallen en tegen wettelijke aansprakelijkheid van de
      leerling voor de tijd dat deze zich bevindt bij de stagebieder; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: 2.36.4.b
    text: ten laste van wie de verzekeringspremie zal komen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.36
  - number: '2.37'
    text: |-
      Het bevoegd gezag kan voor de leerlingen een schriftelijke samenwerkingsovereenkomst met een of meer stagebieders
      sluiten waarin ook een of meer onderdelen van de stageovereenkomst, bedoeld in [artikel 2.36, derde lid][ref1],
      worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.38.1
    text: 'Praktijkonderwijs omvat ten minste onderwijs in:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.1.a
    text: Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.1.b
    text: rekenen/wiskunde;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.1.c
    text: informatiekunde;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.1.d
    text: lichamelijke opvoeding; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.1.e
    text: |-
      aangelegenheden waarvan het bevoegd gezag heeft vastgesteld dat deze van belang zijn voor het uitoefenen van
      functies binnen de regionale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: 2.38.2
    text: |-
      Het bevoegd gezag overlegt voor de vaststelling, bedoeld in het eerste lid, onderdeel e, met het college van
      burgemeester en wethouders dat daarbij de werkgevers betrekt die werkzaam zijn op de regionale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.38
  - number: '2.39'
    text: |-
      De [artikelen 2.34 tot en met 2.37][ref1] zijn van overeenkomstige toepassing op het onderwijs in de praktijk van
      de uitoefening van een vak of beroep aan een school voor praktijkonderwijs, voor zover dat onderwijs buiten die
      school plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.40.1
    text: |-
      Indien het bevoegd gezag bij de vaststelling van vakken en andere programmaonderdelen van het vrije deel van
      profielen in vwo, havo, mavo of vmbo instellingen of deskundigen van buiten de school betrekt, kan het onderwijs in
      die vakken en andere programmaonderdelen van het vrije deel, onverminderd de verantwoordelijkheid van het bevoegd
      gezag voor het onderwijs aan de school, ook worden gegeven door die andere instellingen of deskundigen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.40
  - number: 2.40.2
    text: |-
      Het bevoegd gezag stelt als voorwaarde dat die instellingen of deskundigen voldoen aan de wettelijke regels die
      voor hen gelden of, indien deze regels ontbreken, aan de binnen de beroepsgroep algemeen erkende normen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.40
  - number: 2.40.3
    text: |-
      De [artikelen 7.3.][ref1] en [7.11, eerste lid, van de wet][ref2] zijn van overeenkomstige toepassing
      op degenen die dit onderwijs geven, met dien verstande dat als getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, onderdeel a][ref3], geldt een kwalificatie die, gelet op het eerste en tweede lid,
      passend is.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '7'
  - number: 2.40.4
    text: Het bevoegd gezag informeert de inspectie over de kwalificatie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.40
  - number: 2.41.1
    text: |-
      Een stageovereenkomst voor een maatschappelijke stage als bedoeld in [2.32 van de wet][ref1] omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.41.1.a
    text: de leerdoelen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
  - number: 2.41.1.b
    text: de activiteiten die de leerling moet ontplooien om de leerdoelen te bereiken;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
  - number: 2.41.1.c
    text: de aanvangsdatum, de einddatum en de tijden van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
  - number: 2.41.1.d
    text: een regeling voor de begeleiding van de leerling bij de stagebieder.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
  - number: 2.41.2
    text: |-
      Indien er geen externe stagebieder is, wordt de stageovereenkomst gesloten tussen het bevoegd gezag en ouders
      respectievelijk de leerling indien deze handelingsbekwaam is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
  - number: 2.41.3
    text: |-
      [Artikel 2.36, vierde lid][ref1], is van overeenkomstige toepassing op de stageovereenkomst voor een
      maatschappelijke stage.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 2.42.1
    text: 'Op de volgende dagen wordt geen onderwijs gegeven:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.1.a
    text: de zaterdag en de zondag, ingeval van een vijfdaagse schoolweek;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.1.b
    text: de zondag, ingeval van een zesdaagse schoolweek;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.1.c
    text: nieuwjaarsdag, tweede Paasdag, Hemelvaartsdag, tweede Pinksterdag en de beide Kerstdagen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.1.d
    text: Koningsdag en Bevrijdingsdag.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.2
    text: |-
      Het bevoegd gezag van een bijzondere school waar onderwijs wordt gegeven gebaseerd op een godsdienst of
      levensovertuiging, kan in plaats van of naast de feestdagen, bedoeld in het eerste lid, onderdeel c, andere dagen
      die verband houden met deze godsdienst of levensovertuiging aanwijzen als feestdagen waarop geen onderwijs wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
  - number: 2.42.3
    text: |-
      Het bevoegd gezag wijst bij een zesdaagse schoolweek ten hoogste dertien extra dagen per schooljaar aan en bij
      een vijfdaagse schoolweek ten hoogste twaalf extra dagen per schooljaar aan waarop geen onderwijs wordt gegeven,
      waarvan ten hoogste zes dagen onmiddellijk aansluitend voor of na de zomervakantie die voor de school bij
      ministeriële regeling op grond van [2.39, vierde lid, van de wet][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.43.1
    text: |-
      Het aantal dagen dat per schooljaar ten hoogste als vakantie wordt vastgesteld, bedraagt 66 bij een zesdaagse
      schoolweek en 55 bij een vijfdaagse schoolweek.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.43
  - number: 2.43.2
    text: |-
      Indien voor een school het aantal dagen vakanties dat bij ministeriële regeling op grond van
      [artikel 2.39, vierde lid, van de wet][ref1] wordt vastgesteld lager is dan het aantal dagen, bedoeld in het eerste
      lid, kan het bevoegd gezag voor het betrokken schooljaar extra dagen vakanties vaststellen, met dien verstande dat
      het totaal aantal dagen vakanties het aantal, bedoeld in het eerste lid, niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.43.3
    text: |-
      Onder dagen in het eerste lid wordt verstaan elke dag van de week met uitzondering van de zondag bij een zesdaagse
      schoolweek en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.43
  - number: 2.43.4
    text: |-
      Behalve als zij vallen binnen een vakantie vastgesteld bij ministeriële regeling op grond van
      [artikel 2.39, vierde lid, van de wet][ref1], of door het bevoegd gezag op grond van het tweede lid, worden de
      feestdagen, bedoeld in [artikel 2.42 eerste lid, onderdelen c en d, en tweede lid][ref2], niet meegeteld bij het
      aantal dagen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: '2.44'
    text: |-
      Het aantal klokuren onderwijs in de praktijk van de uitoefening van een vak of beroep, bedoeld in
      [artikel 2.38, achtste lid, van de wet][ref1] op een school voor praktijkonderwijs bedraagt gedurende de cursusduur
      gemiddeld ten hoogste 50% van het aantal uren waarin onderwijs wordt gegeven, met dien verstande dat voor
      leerlingen tot en met het schooljaar waarop zij de leeftijd van 17 jaar hebben bereikt het aantal uren onderwijs
      in de praktijk van de uitoefening van een vak of beroep per schoolweek ten hoogste 80% bedraagt van het aantal uren
      waarin in die week onderwijs wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.45.1
    text: |-
      Onderwijstijd telt als klokuren als bedoeld in [artikel 2.38 van de wet][ref1], indien tussen het bevoegd gezag
      van een school of scholengemeenschap en het bevoegd gezag van een school voor voortgezet speciaal onderwijs, een
      school voor speciaal en voortgezet speciaal onderwijs, of van een instelling voor speciaal en voortgezet speciaal
      onderwijs, een schriftelijke overeenkomst over de uitvoering daarvan is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.45.2
    text: 'De schriftelijke overeenkomst omvat in elk geval afspraken over:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.2.a
    text: de termijn waarvoor deze is aangegaan;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.2.b
    text: de vakken die de leerling volgt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.2.c
    text: het aantal uren onderwijstijd per week per vak dat ten minste wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.2.d
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.3
    text: |-
      Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige onderwijsprogramma
      volgen op een school of instelling als bedoeld in het eerste lid. In dat geval omvat de overeenkomst in elk geval
      afspraken over:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.3.a
    text: de termijn waarvoor deze is aangegaan;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.3.b
    text: de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.3.c
    text: |-
      het bedrag voor de personele en materiële kosten dat het bevoegd gezag van de school of scholengemeenschap waar de
      leerling is ingeschreven betaalt aan het bevoegd gezag van de school of van een instelling, bedoeld in het eerste
      lid, waarmee de overeenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
  - number: 2.45.4
    text: |-
      Het derde lid, onderdeel c, is niet van toepassing op een overeenkomst met een school waaraan
      onderwijs wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 2.45.5
    text: |-
      Indien voor de toepassing van [artikel 2.40, eerste lid, van de wet][ref1], scholen, scholengemeenschappen of
      instellingen als bedoeld in het eerste lid binnen hetzelfde bevoegd gezag zijn betrokken, maakt dit bevoegd gezag
      afspraken met de directies van deze betrokken scholen, scholengemeenschappen of instellingen over de onderdelen,
      genoemd in het tweede, en, indien van toepassing, het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.46.1
    text: |-
      Een samenwerkingsverband baseert zijn beslissing op een in [artikel 2.30, vijfde lid, van de wet][ref1]
      bedoelde aanvraag van het bevoegd gezag of de leerling toelaatbaar is voor het praktijkonderwijs, of een in
      [artikel 2.43, eerste lid, van de wet][ref2] bedoelde aanvraag of de leerling is aangewezen op leerwegondersteunend
      onderwijs uitsluitend op:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.46.1.a
    text: |-
      de door het bevoegd gezag gegeven motivering, gebaseerd op ervaringen met de leerling in het onderwijsleerproces,
      zoals die onder meer blijken uit het onderwijskundig rapport, bedoeld in [artikel 42, eerste lid, WPO][ref1] of
      in [artikel 43 WEC][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: 2.46.1.b
    text: |-
      de leerachterstand van de leerling in de domeinen technisch lezen, spellen, begrijpend lezen of inzichtelijk
      rekenen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.1.c
    text: |-
      het intelligentiequotiënt van de leerling, uitdrukkende zijn cognitieve capaciteiten op basis van scores op verbaal
      en niet-verbaal gebied;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.1.d
    text: |-
      indien dat noodzakelijk is voor het vormen van een oordeel, de resultaten van een of meer
      persoonlijkheidsonderzoeken over prestatiemotivatie, faalangst en emotionele instabiliteit die een beeld geven van
      het sociaal-emotioneel functioneren van de leerling in relatie tot de leerprestaties; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.1.e
    text: 'voor een aanvraag voor toelaatbaarheid tot het praktijkonderwijs: de zienswijze van de ouders.'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.2
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober screenings- of testinstrumenten vastgesteld voor de
      beoordeling van de gegevens, bedoeld in het eerste lid, onderdelen b tot en met d, alsmede regels voor het gebruik
      van die instrumenten. Bij de beslissing op de aanvraag controleert het samenwerkingsverband of het bevoegd gezag
      deze screenings- of testinstrumenten heeft gebruikt. De testinstrumenten voor de gegevens, bedoeld in het eerste
      lid, onderdelen c en d, worden toegepast onder verantwoordelijkheid van een diagnostisch geschoold psycholoog of
      diagnostisch geschoold orthopedagoog.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.3
    text: |-
      De leerachterstand van de leerling in de domeinen technisch lezen, spellen, begrijpelijk lezen en inzichtelijk
      rekenen is de uitkomst van 1 minus (DLE/DL), waarin:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.3.a
    text: |-
      DLE staat voor didactische leeftijdseenheden en het aantal maanden onderwijs dat behoort bij het niveau dat de
      leerling feitelijk heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.3.b
    text: |-
      DL staat voor didactische leeftijd en het aantal maanden dat een leerling vanaf groep 3 in de perioden van
      september tot en met juni was ingeschreven bij een school als bedoeld in [artikel 1 WPO][ref1] of een school voor
      speciaal onderwijs als bedoeld in [artikel 1 WEC][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '1'
  - number: 2.46.4
    text: 'Het samenwerkingsverband wijst de aanvraag voor praktijkonderwijs uitsluitend toe indien de leerling:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.4.a
    text: een intelligentiequotiënt heeft binnen de bandbreedte van 55 tot en met 80; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.4.b
    text: |-
      een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste een van deze twee domeinen gaat om inzichtelijk rekenen of begrijpend lezen en deze
      leerachterstand ten minste 0,5 bedraagt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5
    text: 'Het samenwerkingsverband wijst de aanvraag voor leerwegondersteunend onderwijs uitsluitend toe indien:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.a
    text: 'de leerling:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.a.1°
    text: een intelligentiequotiënt heeft binnen de bandbreedte 75 tot en met 90; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.a.2°
    text: |-
      een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste een van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft en deze
      leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.b
    text: 'de leerling:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.b.1°
    text: een intelligentiequotiënt heeft binnen de bandbreedte 91 tot en met 120;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.b.2°
    text: |-
      een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen, technisch
      lezen en spellen, ten minste een van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft en deze
      leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.5.b.3°
    text: een sociaal-emotionele problematiek heeft waardoor het onderwijsleerproces substantieel wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.46.6
    text: |-
      Een leerling die als het gaat om intelligentiequotiënt of leerachterstand voldoet aan de vereisten voor
      toelaatbaarheid tot het praktijkonderwijs en die bovendien voldoet aan de vereisten voor het leerwegondersteunend
      onderwijs, kan toelaatbaar worden verklaard tot praktijkonderwijs of aangewezen worden op het leerwegondersteunend
      onderwijs, afhankelijk van de door het bevoegd gezag gegeven motivering, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.46
  - number: 2.47.1
    text: |-
      De criteria, bedoeld in [artikel 2.30, tweede lid, onderdeel c, van de wet][ref1], voor de toelaatbaarheid van
      een leerling tot het praktijkonderwijs, zijn dat het zorg- en onderwijsaanbod van het praktijkonderwijs naar het
      oordeel van het bevoegd gezag het beste aansluit bij de behoeften van de leerling, en dat die leerling:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.47.1.a
    text: 'vbo of mavo bezoekt en op leerwegondersteunend onderwijs is aangewezen, en:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.1.a.1°
    text: |-
      scores heeft op de criteria, bedoeld in [artikel 2.46][ref1], in het grensvlak van het leerwegondersteunend
      onderwijs en praktijkonderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '9'
  - number: 2.47.1.a.2°
    text: |-
      naar het oordeel van het bevoegd gezag een toegenomen problematiek heeft nadat de beslissing is genomen dat de
      leerling op leerwegondersteunend onderwijs is aangewezen; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.1.a.3°
    text: |-
      naar het oordeel van het bevoegd gezag een stapeling van andersoortige problematiek heeft dan wordt beoordeeld in
      het onderzoek of de leerling is aangewezen op leerwegondersteunend onderwijs of praktijkonderwijs; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.1.b
    text: |-
      beschikt over een toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs van een
      samenwerkingsverband of een ontwikkelingsperspectief, en:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.1.b.1°
    text: |-
      voldoet aan het intelligentiequotiëntcriterium of leerachterstandscriterium voor toelating tot het
      praktijkonderwijs, bedoeld in [artikel 2.46, vierde lid][ref1], zoals blijkt uit gegevens die gebaseerd zijn op
      screenings- of testinstrumenten als bedoeld in [artikel 2.46, tweede lid][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '9'
  - number: 2.47.1.b.2°
    text: |-
      naar het oordeel van het bevoegd gezag, ongeacht de intelligentiequotiënt of de leerachterstand, een zodanige
      problematiek heeft dat toelaatbaarheid tot het praktijkonderwijs geboden is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2
    text: |-
      Het samenwerkingsverband baseert de beslissing over de toelaatbaarheid tot het praktijkonderwijs uitsluitend op de
      volgende, bij de aanvraag gevoegde, gegevens:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.a
    text: |-
      een kopie van de beslissing dat de leerling is aangewezen op leerwegondersteunend onderwijs, een kopie van de
      toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs, of een kopie van het
      ontwikkelingsperspectief;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.b
    text: de schriftelijke zienswijze en instemming van de ouders;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.c
    text: |-
      een motivering van het bevoegd gezag waaruit blijkt dat de leerling voldoet aan de criteria, bedoeld in het eerste
      lid; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.d
    text: 'een leerling-dossier dat in elk geval omvat:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.d.1°
    text: |-
      het ontwikkelingsperspectief of het onderwijskundig rapport over de leerling, bedoeld in
      [artikel 42, eerste lid, WPO][ref1] en [artikel 43 WEC][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel43
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '43'
  - number: 2.47.2.d.2°
    text: |-
      een beschrijving van de activiteiten van het verwijzende bevoegd gezag in het kader van de begeleiding van de
      leerling, en van de resultaten van die activiteiten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.d.3°
    text: |-
      een document waaruit blijkt welke externe deskundigen voor advies of hulp zijn ingeschakeld bij de begeleiding van
      de leerling;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.d.4°
    text: |-
      een beschrijving van de risico’s die zich naar verwachting zullen voordoen indien de leerling vbo, mavo, speciaal
      onderwijs of voortgezet speciaal onderwijs blijft volgen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.47.2.d.5°
    text: mogelijk relevante test- en toetsgegevens.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.47
  - number: 2.48.1
    text: |-
      Indien een samenwerkingsverband regels stelt als bedoeld in
      [artikel 2.48, eerste lid, onderdeel b, van de wet][ref1], over de duur van de beoordeling voor het aangewezen
      zijn op leerwegondersteunend onderwijs, heeft de beslissing van het samenwerkingsverband over het aangewezen zijn
      op het leerwegondersteunend onderwijs betrekking op een periode van een of meer schooljaren. Indien de beslissing
      wordt genomen in de loop van een schooljaar, wordt de periode tot de eerste dag van het eerstvolgende schooljaar
      toegevoegd aan deze periode.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.48.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitoefening van de in
      [artikel 2.48, eerste en tweede lid, van de wet][ref1] bedoelde bevoegdheden van een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.49.1
    text: |-
      Het ontwikkelingsperspectief, bedoeld in [artikel 2.44 van de wet][ref1], van een leerling die praktijkonderwijs
      volgt of extra ondersteuning nodig heeft, bevat ten minste informatie over het vervolgonderwijs dat wordt verwacht
      en de onderbouwing daarvan. Voor een leerling die praktijkonderwijs volgt heeft de informatie ook betrekking op de
      soort arbeid waarvan uitstroom van de leerling wordt verwacht, en de onderbouwing daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.49.2
    text: |-
      De onderbouwing, bedoeld in het eerste lid, bevat ten minste een weergave van de belemmerende en bevorderende
      factoren die van invloed zijn op het onderwijs aan de leerling.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.49
  - number: 2.50.1
    text: |-
      Een leerling die is of wordt ingeschreven bij een school, kan gedurende ten hoogste twee jaar het
      onderwijsprogramma of een gedeelte daarvan volgen bij een orthopedagogisch-didactisch centrum als bedoeld in
      [artikel 2.47, twaalfde lid van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.50.2
    text: |-
      Het onderwijs van leerlingen die langer dan drie maanden een programma volgen bij het orthopedagogisch-didactisch
      centrum, wordt gegeven door leraren die daartoe bevoegd zijn.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.50
  - number: 2.50.3
    text: |-
      Indien een samenwerkingsverband een orthopedagogisch-didactisch centrum heeft ingericht, wordt dat vermeld in het
      ondersteuningsplan, bedoeld in [artikel 2.47, negende lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.51.1
    text: |-
      De deskundigen, bedoeld in [artikel 2.47, veertiende lid, van de wet][ref1] zijn een orthopedagoog of een
      psycholoog en, afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd, ten minste een tweede
      deskundige, te weten een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker
      of een arts.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.51
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.51.2
    text: |-
      Indien het samenwerkingsverband beslist dat een leerling aangewezen is op het leerwegondersteunend onderwijs of
      toelaatbaar is tot het praktijkonderwijs, kan de tweede deskundige ook een deskundige op het terrein van vbo, mavo,
      vmbo en praktijkonderwijs zijn.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.51
  - number: 2.52.1
    text: |-
      De inspectie hanteert de volgende indicatoren voor de beoordeling van de leerresultaten van het voortgezet
      onderwijs:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.52.1.a
    text: het percentage leerlingen met een onvertraagde studievoortgang in de eerste twee leerjaar;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.52.1.b
    text: het percentage leerlingen met een onvertraagde studievoortgang in de overige leerjaren;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.52.1.c
    text: |-
      het niveau dat de leerling in het derde leerjaar daadwerkelijk heeft bereikt ten opzichte van het niveau dat de
      leerling gelet op het schooladvies, bedoeld in [artikel 45d, eerste lid, WPO][ref1], naar verwachting in het derde
      leerjaar zou bereiken; en


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45d
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 45d
  - number: 2.52.1.d
    text: het gemiddelde cijfer van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.52.2
    text: |-
      De indicatoren worden onderscheiden naar de schoolsoorten en leerwegen, genoemd in
      [artikel 2.94, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.52.3
    text: |-
      Bij de bepaling van de leerresultaten, bedoeld in het eerste lid, kan rekening worden gehouden met groepskenmerken
      en individuele kenmerken van leerlingen, met dien verstande dat in elk geval rekening wordt gehouden met de
      sociaaleconomische situatie van de leerlingen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.52.4
    text: |-
      De scores waarop het oordeel over de indicatoren wordt gebaseerd, kunnen wegens bijzondere omstandigheden worden
      gecorrigeerd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.52
  - number: 2.53.1
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de berekening van de indicatoren voor
      de beoordeling van de leerresultaten, waaronder begrepen de toe te passen correcties, bedoeld in
      [artikel 2.52, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '10'
  - number: 2.53.2
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.53
  - number: 2.53.2.a
    text: |-
      de aard en de aantallen gegevens over de leerresultaten die ten minste nodig zijn voor de toepassing van de
      indicatoren;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.53
  - number: 2.53.2.b
    text: |-
      de normering waarop de inspectie het oordeel voldoende of onvoldoende onderwijsresultaat baseert, na toepassing van
      de indicatoren;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.53
  - number: 2.53.2.c
    text: |-
      de wijze waarop per schoolsoort of leerweg de beoordelingen, gebaseerd op de afzonderlijke indicatoren, leiden tot
      een oordeel over de leerresultaten van die schoolsoort respectievelijk leerweg.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.53
  - number: 2.54.1
    text: |-
      Indien recente ontwikkelingen, een eigen analyse of signalen uit het veld daartoe aanleiding geven, kan de
      inspecteur-generaal van het onderwijs Onze Minister een voorstel doen voor het vaststellen van een nieuwe indicator
      voor de beoordeling van de leerresultaten of het aanpassen van een indicator.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.54
  - number: 2.54.2
    text: |-
      Over een voornemen tot een voorstel als bedoeld in het eerste lid overlegt de inspecteur-generaal met de daarvoor
      in aanmerking komende organisaties uit het onderwijsveld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.54
  - number: 2.54.3
    text: |-
      De inspecteur-generaal legt het voorstel voor aan Onze Minister met vermelding van de wijze waarop het voorstel
      rekening houdt met de reacties van de geraadpleegde organisaties uit het onderwijsveld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.54
  - number: 2.54.4
    text: |-
      Onze Minister beslist op basis van het voorstel of een voorstel van wet of ontwerp algemene maatregel van bestuur
      wordt voorbereid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.54
  - number: 2.54.5
    text: |-
      De wijze van meting en de aanpassing van de wijze van meting in het kader van toepassing van de indicatoren,
      alsmede de normering en de aanpassing van de normering, stelt Onze Minister vast op voorstel van de inspecteur-
      generaal van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.54
  - number: '2.55'
    text: |-
      Het instrument ter monitoring van de veiligheid van leerlingen, bedoeld in
      [artikel 3.40, eerste lid, onderdeel b, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '3'
  - number: 2.55.a
    text: |-
      geeft inzicht in de ervaren en feitelijke veiligheid en het welbevinden van de leerlingen, voor zover dat verband
      houdt met de veiligheid, op school;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.55
  - number: 2.55.b
    text: wordt ten minste eens per schooljaar afgenomen onder een representatief deel van de leerlingen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.55
  - number: 2.55.c
    text: is gestandaardiseerd, valide en betrouwbaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.55
  - number: '2.56'
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in [artikel 2.100 van de wet][ref1] omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.56.a
    text: het doel van de samenwerking;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.56.b
    text: de doelgroep;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.56.c
    text: de wijze waarop wordt nagegaan of het doel wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.56.d
    text: het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.56.e
    text: |-
      bij overdracht van een deel van de bekostiging met toepassing van [artikel 5.39, zevende lid, van de wet][ref1], de
      omvang en de bestemming van de over te dragen middelen;


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 2.56.f
    text: de wijze waarop de school geregeld contact onderhoudt met de leerlingen die aan die school zijn ingeschreven; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.56.g
    text: een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.56
  - number: 2.57.1
    text: |-
      De volgende leerlingen kunnen op grond van [artikel 2.99, eerste lid, aanhef en onderdeel a, van de wet][ref1]
      in de gelegenheid worden gesteld in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven,
      ook onderwijs te ontvangen aan een school van een ander bevoegd gezag of aan een instelling voor educatie en
      beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.57.1.a
    text: |-
      voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel a, van de wet][ref1]: leerlingen in het derde of het
      vierde leerjaar vbo of mavo die naar het oordeel van het bevoegd gezag zonder gerichte ondersteuning een vergrote
      kans lopen om het onderwijs te verlaten zonder ten minste een diploma van een basisberoepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, WEB][ref2] of [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 2.57.1.b
    text: |-
      voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel b, van de wet][ref1]: leerlingen die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om vervolgonderwijs met goed gevolg te volgen door extra
      verrijking, verdieping en oriëntatie naast hun reguliere opleiding, of door onderdelen van beroepsopleidingen
      als bedoeld in [artikel 7.2.2 WEB][ref2] of [artikel 7.2.2 WEB BES][ref3] of opleidingen educatie als bedoeld
      in [artikel 7.3.1 WEB][ref4] of [artikel 7.3.1 WEB BES][ref5] te volgen, naast hun reguliere opleiding in het
      voortgezet onderwijs; en


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 2.57.1.c
    text: |-
      voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel c, van de wet][ref1]: iedere leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.57.2
    text: |-
      Een leerling als bedoeld in het eerste lid volgt voor ten hoogste de helft van het aantal klokuren van het
      onderwijsprogramma lessen of stages aan de andere school of aan een instelling voor educatie en beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.57
  - number: '2.58'
    text: |-
      Bij een samenwerking op grond van [artikel 2.99, eerste lid, aanhef en onderdeel a, van de wet][ref1] met een
      andere school wordt ten minste een deel van het onderwijs in de bovenbouw op de eigen school gegeven, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.58.a
    text: |-
      als het gaat om een school voor vwo of een school voor havo, het onderwijs op de eigen school gegeven wordt in ten
      minste een van de profielen, bedoeld in [artikel 2.20, derde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.58.b
    text: |-
      als het gaat om een school voor mavo, het onderwijs op de eigen school gegeven wordt in ten minste een van de
      profielen, bedoeld in [artikel 2.25, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.58.c
    text: |-
      als het gaat om een school voor vbo, het onderwijs op de eigen school gegeven wordt in ten minste een van de
      profielen bedoeld in [artikel 2.26, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.58.d
    text: |-
      als het gaat om onderwijs in de gemengde leerweg aan een school voor mavo of aan een school voor
      vbo, het onderwijs op de eigen school gegeven wordt in ten minste een van de profielen, bedoeld in
      [artikel 2.27, tweede lid van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.59.1
    text: |-
      Leerlingen van zestien en zeventien jaar die naar het oordeel van het bevoegd gezag een grotere kans
      hebben een diploma of volgend diploma als bedoeld in [artikel 2.58, tweede lid, van de wet][ref1]
      te behalen indien zij vavo volgen in plaats van voortgezet onderwijs, kunnen op grond
      [artikel 2.99, eerste lid, aanhef en onderdeel b, van de wet][ref2] deelnemen aan een opleiding vavo en die
      opleiding met een examen afsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.59
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.59.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op leerlingen van achttien jaar of ouder die ononderbroken in
      het voortgezet onderwijs of daarmee op grond van de [LPW][ref1] of de [LPW BES][ref2] gelijkgesteld onderwijs
      ingeschreven zijn geweest, voor ten hoogste de periode van de resterende cursusduur van de opleiding waarvoor zij
      aan de school zijn ingeschreven, vermeerderd met een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.59
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0030281
  - number: 2.59.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing op leerlingen van zestien en zeventien jaar, die naar het oordeel
      van het bevoegd gezag grotere kans krijgen om vervolgonderwijs met gunstig resultaat te volgen door, aansluitend
      op hun met goed gevolg afgelegd eindexamen vwo, havo of vmbo in de theoretische of gemengde leerweg, aan het vavo
      onderwijs te volgen en examen te doen in een of meerdere vakken op het niveau van de schoolsoort of leerweg waarin
      zij reeds met goed gevolg eindexamen hebben afgelegd, voor ten hoogste de duur van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.59
  - number: '2.60'
    text: |-
      Leerlingen als bedoeld in de [artikelen 2.56][ref1] en [2.58][ref2] gelden voor de toepassing van
      [hoofdstuk 8a WEB][ref3] voor het onderwijs dat zij volgen aan een instelling ook als student als bedoeld in de
      [WEB][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
      [ref4]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '12'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: 8a
      - id: ref4
        bwb_id: BWBR0007625
  - number: '2.61'
    text: |-
      In afwijking van [artikel 7.9, eerste lid, van de wet][ref1] kan in geval van samenwerking het onderwijs bij een
      instelling voor educatie en beroepsonderwijs ook worden gegeven door docenten van de instelling voor educatie en
      beroepsonderwijs waarmee het bevoegd gezag van de school een samenwerkingsovereenkomst heeft gesloten als bedoeld
      in [artikel 2.100 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: '2.62'
    text: |-
      Het bevoegd gezag van een school voor vbo kan leerlingen jonger dan zestien jaar op grond van
      [artikel 2.102, eerste lid, van de wet][ref1] de gelegenheid geven om een entreeopleiding te volgen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.62
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.62.a
    text: |-
      de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref1] en [7.2.9 WEB][ref2] of de [artikelen 7.2.8][ref3]
      en [7.2.9 WEB BES][ref4], alleen het verrichten van lichte arbeid van geschikte aard omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.62
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 2.62.b
    text: |-
      in plaats van de basisberoepsgerichte leerweg geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderwijs in de praktijk van de uitoefening van een vak of beroep wordt verzorgd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.62
  - number: 2.62.c
    text: |-
      een gekwalificeerde mentor of docentbegeleider de voortgang van het onderwijs in de praktijk van de uitoefening van
      het beroep bewaakt; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.62
  - number: 2.62.d
    text: |-
      het binnenschools en buitenschools onderwijs in de praktijk van de uitoefening van een vak of beroep geïntegreerd
      worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.62
  - number: 2.63.1
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in [artikel 2.102, vijfde lid, van de wet][ref1] voor het verzorgen van
      een entreeopleiding omvat in elk geval afspraken over:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.63.1.a
    text: de entreeopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden verzorgd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.63.1.b
    text: de inschrijving van leerlingen als extraneus bij de instelling voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.63.1.c
    text: de examinering en diplomering door de instelling voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.63.1.d
    text: |-
      de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in de
      [artikelen 7.2.8][ref1] en [7.2.9 WEB][ref2] of de [artikelen 7.2.8][ref3] en [7.2.9 WEB BES][ref4],
      met dien verstande dat het bevoegd gezag de overeenkomst, bedoeld in [artikel 7.2.9 WEB][ref5] of
      [artikel 7.2.9 WEB BES][ref6], ook ondertekent;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel7
