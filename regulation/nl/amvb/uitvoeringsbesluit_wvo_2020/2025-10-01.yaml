  - number: '11.2'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan en voor het Europese deel van Nederland en de openbare lichamen Bonaire, Sint
      Eustatius en Saba verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel11.2
