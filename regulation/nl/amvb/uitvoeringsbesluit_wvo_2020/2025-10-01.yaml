  - number: 2.63.1.e
    text: |-
      de toepassing van [artikel 2.102, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.63.1.f
    text: de rechtsbescherming van de leerling; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.63.1.g
    text: de doorstroom van de leerlingen na het met goed gevolg afsluiten van de entreeopleiding.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.63.2
    text: |-
      Indien het bevoegd gezag ook het bevoegd gezag is van een instelling voor educatie en beroepsonderwijs, regelt het
      bevoegd gezag op overeenkomstige wijze de onderwerpen, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.63
  - number: 2.64.1
    text: |-
      Tot het verzorgen van het buitenschoolse praktijkgedeelte van een leer-werktraject als bedoeld in
      [artikel 2.103 van de wet][ref1] zijn bevoegd bedrijven en organisaties die voldoen aan de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.64.1.a
    text: |-
      op de leer-werkplek of combinatie van leerwerkplekken kunnen de door het bevoegd gezag vastgestelde
      praktijkopdrachten daadwerkelijk worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.b
    text: elke praktijkopdracht kan in een bedrijf of organisatie worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.c
    text: |-
      in het bedrijf of de organisatie is een gekwalificeerde praktijkbegeleider of leermeester aanwezig, die in staat
      is om kennis, inzicht en vaardigheden van de leerling en de vorderingen daarin te beoordelen, en de leerling zowel
      werkinhoudelijk als pedagogisch-didactisch te begeleiden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.d
    text: |-
      het bedrijf of de organisatie is bereid met de mentor of docentbegeleider, bedoeld in het tweede lid, contact te
      onderhouden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.e
    text: |-
      de leerling kan zonder grote overgangsdrempels binnen hetzelfde bedrijf of dezelfde organisatie, dezelfde
      moederorganisatie of dezelfde branche, de leerdoelen van het vmbo en de eindtermen van de entreeopleiding of
      basisberoepsopleiding, bedoeld in de [WEB][ref1] behalen;


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 2.64.1.f
    text: |-
      het bedrijf of de organisatie waarborgt dat een gekwalificeerde praktijkbegeleider of leermeester is gekoppeld
      aan een leerling, en dat deze leermeester er zorg voor draagt dat de leerling voldoende hulp en tijd krijgt om de
      praktijkopdrachten uit te voeren;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.g
    text: |-
      het productie- of dienstverleningsproces is technisch en organisatorisch voldoende gevarieerd en kan leerlingen
      goed praktijkmateriaal bieden en hen gedegen opleiden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.h
    text: de leer-werkplek past binnen de dagelijkse bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.i
    text: |-
      het bedrijf of de organisatie is bereid de leerling de vereiste praktijkopdrachten uit te laten voeren en het werk
      en het stageverslag te bespreken en te beoordelen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.j
    text: |-
      het bedrijf of de organisatie is geschikt voor de betrokken leeftijdsgroep waar het gaat om onder meer ruimte om te
      leren of fouten te maken, erkenning van jong zijn;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.1.k
    text: |-
      het bedrijf of de organisatie respecteert, voor zover van toepassing, het multiculturele karakter van de
      leerlingenpopulatie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: 2.64.2
    text: |-
      Het bevoegd gezag draagt zorg voor beschikbaarheid van een gekwalificeerde mentor of docentbegeleider die de
      voortgang op de leer-werkplek en ook de integratie tussen het binnenschools en buitenschools programma bewaakt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.64
  - number: '2.65'
    text: |-
      Een leer-werkovereenkomst als bedoeld in [artikel 2.103, zesde lid, van de wet][ref1] regelt de rechten en plichten
      van partijen en omvat ten minste afspraken over:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.65.a
    text: inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.65
  - number: 2.65.b
    text: de begeleiding van de leerling; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.65
  - number: 2.65.c
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.65
  - number: '2.66'
    text: |-
      Leerlingen van zestien en zeventien jaar die naar het oordeel van het bevoegd gezag van een aangewezen school
      als bedoeld in de [artikel 2.66 van de wet][ref1] een grotere kans hebben een diploma of volgend diploma
      als bedoeld in [artikel 2.58, tweede lid, van de wet][ref2] te behalen indien zij vavo volgen in plaats van
      voortgezet onderwijs, kunnen op grond [artikel 2.109, eerste lid, aanhef en onderdeel b, van de wet][ref3]
      deelnemen aan een opleiding vavo bij een instelling voor educatie en beroepsonderwijs als bedoeld in
      [artikel 2.109, eerste lid, van de wet][ref4] en die opleiding met een examen afsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.66
    references:
      - id: ref1
        bwb_id: BWBR0044212
