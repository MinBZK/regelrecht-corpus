      - id: ref2
        bwb_id: BWBR0042639
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0042639
        artikel: '8'
  - number: 6.12.2.b
    text: |-
      indien de in onderdeel a bedoelde gegevens naar het oordeel van het bevoegd gezag onjuist zijn, de door het bevoegd
      gezag gecorrigeerde gegevens; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.12.2.c
    text: een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.12.3
    text: 'Bij ministeriële regeling kan worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.12.3.a
    text: een model voor de verklaring, bedoeld in het tweede lid, onderdelen a en c; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.12.3.b
    text: een leidraad voor de controle door de accountant, bedoeld in het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.12.4
    text: |-
      Indien Onze Minister voor 1 juli in enig jaar aanvullende bekostiging heeft vastgesteld, dient het bevoegd gezag
      voor die datum bij Onze Minister een verklaring in over de juistheid van de respectievelijk voor de vaststelling
      van de aanvullende bekostiging aan Onze Minister gemelde gegevens. Het tweede lid, onderdelen b en c, en het derde
      lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.12
  - number: 6.13.1
    text: |-
      Onze Minister maakt het bedrag voor de bekostiging, bedoeld in [artikel 5.6][ref1] en [5.9 van de wet][ref2],
      bekend voorafgaand aan het kalenderjaar waarop dit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.13.2
    text: |-
      Indien de verklaring, bedoeld in [artikel 6.12, tweede lid, onderdeel c][ref1], van de accountant daartoe
      aanleiding geeft, wijzigt Onze Minister de bekostiging of aanvullende bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.13.3
    text: |-
      Onze Minister kan de bekostiging wijzigen wegens algemene salarismaatregelen of wegens andere al dan niet uit de
      rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen op de bekostiging, bedoeld in
      [artikel 6.4, eerste lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.14.2
    text: |-
      De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt zo snel mogelijk na afloop van
      het desbetreffende kalenderjaar plaats.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.14
  - number: 6.14.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop toepassing wordt gegeven aan het
      in mindering brengen van bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.14
  - number: '6.15'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap met een bijzondere
      inrichting van het onderwijs besluiten dat wordt afgeweken van de [artikelen 6.1 tot en met 6.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.16.1
    text: |-
      De boekhouding van een niet door een gemeente in stand gehouden school is zodanig ingericht dat op doelmatige wijze
      informatie kan worden verkregen over het gevoerde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.16
  - number: 6.16.2
    text: Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.16
  - number: 6.17.1
    text: Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de school.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.17
  - number: 6.17.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de financiële informatie wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.17
  - number: 6.18.1
    text: Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.18.2
    text: |-
      De begroting bevat een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen bekostiging komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.18.3
    text: Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.18.4
    text: |-
      Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden overeenkomstig
      door het bevoegd gezag vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.18.5
    text: Het bevoegd gezag zendt Onze Minister op diens verzoek de vastgestelde begroting.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.18.6
    text: Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.18
  - number: 6.19.1
    text: |-
      Het jaarverslag, bedoeld in [artikel 5.46 van de wet][ref1], wordt ingericht overeenkomstig bij ministeriële
      regeling vast te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.19.2
    text: Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarverslag vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.19.3
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening blijkt
      dat sprake is van een rechtmatige aanwending van de rijksbekostiging. De jaarrekening omvat ook de gegevens die van
      belang zijn voor de verantwoording met betrekking tot de besteding van toegekende aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.19.4
    text: |-
      Het bevoegd gezag zendt het vastgestelde jaarverslag voor 1 juli van het jaar volgend op het boekjaar aan Onze
      Minister. Het jaarverslag gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen accountant. Bij de aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de accountant.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.19.5
    text: |-
      Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en een
      gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in het
      bestedingspatroon voor de afzonderlijke scholen van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.19.6
    text: Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.19.7
    text: |-
      Bij ministeriële regeling kan een leidraad worden vastgesteld over de inrichting en de uitvoering van de controle
      door de accountant.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.19
  - number: 6.20.1
    text: |-
      Indien aan het bevoegd gezag van een school een aanvullende bekostiging is verstrekt onder de voorwaarde dat deze
      bekostiging voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze bekostiging voor dat doel is besteed.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.20
  - number: 6.20.2
    text: |-
      Indien verrekening plaatsvindt of zal plaatsvinden van het daadwerkelijk bestede bedrag met de vastgestelde
      aanvullende bekostiging, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk
      bestede bedrag.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.20
  - number: 6.21.1
    text: |-
      Onverminderd de bevoegdheid van de inspectie op grond van de [WOT][ref1] kan Onze Minister een onderzoek instellen
      of doen instellen naar:


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 6.21.1.a
    text: de jaarverslaggeving;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
  - number: 6.21.1.b
    text: de gegevens die noodzakelijk zijn voor de vaststelling van de bekostiging;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
  - number: 6.21.1.c
    text: de rechtmatigheid van de bestedingen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
  - number: 6.21.1.d
    text: de doelmatigheid van het financiële beheer van de school.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
  - number: 6.21.2
    text: |-
      Onze Minister kan besluiten tot het aanbrengen van correcties op de bekostiging indien uit een onderzoek als
      bedoeld in het eerste lid blijkt dat de bekostiging van een school onjuist is vastgesteld. Onze Minister doet het
      bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
  - number: 6.21.3
    text: |-
      Onverminderd [artikel 4:49 Awb][ref1], kan Onze Minister besluiten dat een gedeelte van de bekostiging niet ten
      laste komt van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, indien
      uit het jaarverslag, bedoeld in [artikel 5.46, eerste lid, van de wet][ref2], uit de verklaring van de accountant,
      bedoeld in [artikel 5.46, vierde lid, van de wet][ref3] of uit een op grond van het eerste lid ingesteld onderzoek
      blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '5'
  - number: '6.22'
    text: |-
      Onze Minister betaalt een correctie als bedoeld in [artikel 6.21, tweede lid][ref1], die strekt tot
      verhoging van de bekostiging, binnen acht weken na de bekendmaking van de mededeling, bedoeld in
      [artikel 6.21, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 6.23.1
    text: |-
      De gegevens, bedoeld in de [artikel 5.48, eerste lid, van de wet][ref1], waarover een bevoegd gezag of een
      samenwerkingsverband beschikt, worden gedefinieerd en geordend volgens de regels vermeld in [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0045787
  - number: 6.23.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gegevens, bedoeld in het eerste lid, en over de
      wijze waarop de gegevens beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.23
  - number: 6.23.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de gegevens die betrekking hebben op verstrekte
      aanvullende bekostiging en de wijze waarop deze gegevens worden gedefinieerd, geordend en beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.23
  - number: 6.23.4
    text: |-
      In de ministeriële regeling wordt geregeld welke gevraagde gegevens van belang zijn voor de berekening van de
      hoogte van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.23
  - number: '6.24'
    text: |-
      Bij ministeriële regeling kan in spoedeisende gevallen een aanvullende vragenlijst over de bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.24
  - number: '6.25'
    text: |-
      Onze Minister kan bij het verzoek om beschikbaarstelling van gegevens als bedoeld in
      [artikel 5.48, eerste lid, van de wet][ref1] bij hem bekende gegevens opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.26.1
    text: |-
      In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum en de
      op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere voorschriften
      geven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.26
  - number: 6.26.2
    text: |-
      Onze Minister kan in verband met de aanvang of beëindiging van de bekostiging van een school, van een
      scholengemeenschap of van een profiel aan een school voor vbo afwijken van de [artikelen 6.7][ref1] en [6.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.27.1
    text: |-
      Bij samenvoeging van scholen als bedoeld in [artikel 4.10 van de wet][ref1], op 1 augustus van enig kalenderjaar,
      wordt de bekostiging op grond van [artikel 5.4 van de wet][ref2], en de aanvullende bekostiging van alle bij de
      samenvoeging betrokken scholen gehandhaafd tot het einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.27.2
    text: |-
      Bij afsplitsing van een of meer scholen van een scholengemeenschap als bedoeld in
      [artikel 4.2, derde lid, van de wet][ref1], op 1 augustus van enig kalenderjaar, wordt de bekostiging op
      grond van [artikel 5.4 van de wet][ref2], en de aanvullende bekostiging van de bij de afsplitsing betrokken
      scholengemeenschap gehandhaafd tot het einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: '6.28'
    text: |-
      Het bevoegd gezag doet binnen twee weken na een besluit tot opheffing van de school daarvan mededeling aan Onze
      Minister, gedeputeerde staten, de inspectie, en indien het een bijzondere school betreft, eveneens aan burgemeester
      en wethouders van de gemeente waarin de school is gelegen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.28
  - number: 6.29.1
    text: |-
      Indien een school wordt opgeheven anders dan in verband met samenvoeging met een andere school of de aanspraak
      op bekostiging voor een school verloren gaat, stort het bevoegd gezag het exploitatie-overschot, bedoeld in
      [artikel 5.37 van de wet][ref1], terug in ’s Rijks kas. Het neemt daarbij het derde lid in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.29.2
    text: 'Het exploitatie-overschot is de som van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
  - number: 6.29.2.a
    text: |-
      het bedrag van de bekostiging, bedoeld in [artikel 5.32 van de wet][ref1], verminderd met de lasten over dat jaar
      voor zover deze als rechtmatig kunnen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.29.2.b
    text: de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
  - number: 6.29.2.c
    text: |-
      voor zover het gaat om een bijzondere school, de niet bestede gedeelten van de uitkeringen op grond van de
      voorschriften inzake de gemeentelijke overschrijding.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
  - number: 6.29.3
    text: |-
      Indien het exploitatie-overschot van een bijzondere school ook is opgebouwd uit uitkeringen als bedoeld in het
      tweede lid, onderdeel c, geldt als maatstaf voor de verdeling van dat deel van het exploitatie-overschot tussen
      het Rijk en de gemeente de verhouding tussen het ontvangen bedrag aan bekostiging van het Rijk en het ontvangen
      bedrag aan overschrijdingsuitkeringen van de gemeente in een periode van vijf jaren, voorafgaand aan het jaar van
      de beëindiging van de bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.29
  - number: 6.30.1
    text: |-
      Het samenwerkingsverband neemt in het ondersteuningsplan een datum op wanneer wordt vastgesteld of
      sprake is van een meer dan gemiddelde toename van het aantal ingeschreven leerlingen, bedoeld in
      [artikel 2.47, negende lid, onderdeel g, van de wet][ref1]. Deze vaststelling vindt in ieder geval plaats in de
      periode tussen 1 februari en 1 juni.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 6.30.2
    text: |-
      Indien een meer dan gemiddelde toename, bedoeld in het eerste lid, wordt vastgesteld, draagt het
      samenwerkingsverband voor het aantal leerlingen dat na 1 februari toelaatbaar is verklaard tot het voortgezet
      speciaal onderwijs per leerling een bedrag over aan de school waar de leerling is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.30
  - number: 6.30.3
    text: |-
      Het bedrag, bedoeld in het tweede lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.30
  - number: 6.30.4
    text: De overdracht, bedoeld in het tweede lid, heeft betrekking op het kalenderjaar dat volgt op de teldatum.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.30
  - number: '6.32'
    text: |-
      [Paragraaf 4][ref1] is van overeenkomstige toepassing op een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0045787
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '7.1'
    text: Dit artikel treedt niet meer in werking. Het artikel is ingetrokken door Stb. 2024/14.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel7.1
  - number: '7.2'
    text: Dit artikel treedt niet meer in werking. Het artikel is ingetrokken door Stb. 2024/14.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel7.2
  - number: '7.3'
    text: Dit artikel treedt niet meer in werking. Het artikel is ingetrokken door Stb. 2024/14.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel7.3
  - number: '7.4'
    text: Dit artikel treedt niet meer in werking. Het artikel is ingetrokken door Stb. 2024/14.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel7.4
  - number: 8.1.1
    text: |-
      De gevallen, bedoeld in [artikel 8.5, eerste lid, aanhef en onderdeel c, van de wet][ref1], waarin het bevoegd
      gezag een kandidaat-leerling mag toelaten die afkomstig is van een andere school, zijn opgenomen in het tweede tot
      en met vierde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.1.2
    text: 'Het bevoegd gezag van een school voor vwo of voor havo kan tot het eerste leerjaar van die school toelaten:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.2.a
    text: de kandidaat-leerling die tot het eerste leerjaar van een andere school voor vwo of voor havo is toegelaten; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.2.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor mavo gedeeltelijk heeft doorlopen, indien de
      studieresultaten naar het oordeel van het bevoegd gezag aanleiding geven tot toelating tot vwo of havo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.3
    text: 'Het bevoegd gezag van een school voor mavo kan tot het eerste leerjaar van die school toelaten:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.3.a
    text: |-
      de kandidaat-leerling die tot het eerste leerjaar van een andere school voor mavo of tot het eerste leerjaar van
      een school voor vwo of voor havo is toegelaten; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.3.b
    text: |-
      de kandidaat-leerling die het eerste leerjaar van een school voor vbo gedeeltelijk heeft doorlopen, indien de
      studieresultaten naar het oordeel van het bevoegd gezag aanleiding geven tot toelating tot mavo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.1.4
    text: |-
      Het bevoegd gezag van een school voor vbo kan tot het eerste leerjaar van die school toelaten de kandidaat-leerling
      die tot het eerste leerjaar van een andere school is toegelaten, ongeacht de schoolsoort.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.1
  - number: 8.2.1
    text: |-
      Het bevoegd gezag kan zijn bevoegdheid, bedoeld in [artikel 8.6, eerste lid, van de wet][ref1], om te beslissen
      over de toelating van een leerling tot de school, onder zijn verantwoordelijkheid laten uitoefenen door een door
      hem in te stellen toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.2.2
    text: |-
      Het bevoegd gezag stelt regels over de omvang, samenstelling en werkzaamheden van de toelatingscommissie en kan
      nadere regels stellen over de bevoegdheidsuitoefening van de toelatingscommissie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Indien voor een kandidaat-leerling geen definitief schooladvies als bedoeld in
      [artikel 8.6, tweede lid, van de wet][ref1] is vastgesteld, baseert het bevoegd gezag zijn beslissing over de
      toelating tot het eerste leerjaar op een doorstroomtoets als bedoeld in [artikel 45b, derde lid, WPO][ref2],
      [artikel 48c, derde lid, WEC][ref3] of [artikel 51b, eerste lid, WPO BES][ref4]. Indien de leerling geen
      doorstroomtoets heeft afgelegd, baseert het bevoegd gezag zijn beslissing tot toelating op een onderzoek naar de
      geschiktheid van de kandidaat-leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel45b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel48c
      [ref4]: https://wetten.overheid.nl/BWBR0030280#Artikel51b
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 45b
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 48c
      - id: ref4
        bwb_id: BWBR0030280
        artikel: 51b
  - number: 8.3.2
    text: |-
      Het bevoegd gezag van een school met een bijzondere inrichting waarvoor specifieke kennis of vaardigheden van
      de kandidaat-leerling noodzakelijk zijn, kan een onderzoek naar die specifieke kennis of vaardigheden bij de
      kandidaat-leerling afnemen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.3
  - number: '8.4'
    text: |-
      Het bevoegd gezag stelt een procedure op voor de toelating van leerlingen tot het eerste leerjaar en zendt de
      procedure aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.4
  - number: '8.5'
    text: |-
      Het bevoegd gezag stelt jaarlijks een verslag op over de middelen die het heeft toegepast voor de toelating van
      leerlingen tot het eerste leerjaar en over de daarmee opgedane ervaringen en zendt het verslag jaarlijks binnen zes
      maanden na de toelating aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.5
  - number: '8.6'
    text: |-
      Het bevoegd gezag stelt de directeur van de basisschool, de speciale school voor basisonderwijs, de school voor
      speciaal onderwijs, de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal en
      voortgezet speciaal onderwijs in kennis van:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.6
  - number: 8.6.a
    text: de beslissing over de toelating; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.6
  - number: 8.6.b
    text: indien de directeur dit verzoekt, de studieresultaten van de leerling na afloop van het eerste leerjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.6
  - number: '8.7'
    text: |-
      Bij toelating plaatst het bevoegd gezag de leerling, die van een gelijksoortige school afkomstig is, in het
      leerjaar waarin die leerling op die andere school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.7
  - number: 8.8.1
    text: Het bevoegd gezag vermeldt een voorwaardelijke bevordering op het eindrapport.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.8
  - number: 8.8.2
    text: |-
      Het bevoegd gezag doet ook schriftelijk mededeling van de voorwaardelijke bevordering aan de ouders van de
      betrokken leerling, waarbij worden vermeld:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.8
  - number: 8.8.2.a
    text: de datum tussen 1 oktober en 1 januari daaropvolgend waarop definitief over de overgang zal worden beslist; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.8
  - number: 8.8.2.b
    text: de voorwaarden voor bevordering.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.8
  - number: 8.8.3
    text: Bevordering tot het hoogste leerjaar gebeurt niet voorwaardelijk.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de theoretische leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
  - number: 8.9.1.a
    text: |-
      de vakken, genoemd in [artikel 2.16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 8.9.1.b
    text: |-
      de vakken, genoemd in [artikel 2.17, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 8.9.1.c
    text: |-
      de vakken, genoemd in [artikelen 2.6][ref1] en [2.7][ref2], met uitzondering van de vakken genoemd in
      [artikel 2.7, onderdeel c, subonderdelen 1° en 2°, en onderdeel d][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.9.1.d
    text: |-
      de vakken, genoemd in [artikelen 2.11][ref1] en [2.12][ref2], met uitzondering van de vakken, genoemd in
      [artikel 2.12, onderdeel c, subonderdelen 1° en 2°, en onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 8.9.2
    text: |-
      Een leerling die in het bezit is van een diploma vmbo in de gemengde leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
  - number: 8.9.2.a
    text: |-
      de vakken, genoemd in [artikel 2.25, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 8.9.2.b
    text: |-
      de vakken, genoemd in [artikel 2.26, onderdeel c][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 8.9.2.c
    text: de vakken, bedoeld in het eerste lid, onderdelen c en d.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.9
  - number: 8.10.1
    text: 'Het bevoegd gezag draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.10.1.a
    text: een overzichtelijke administratie van de inschrijving van leerlingen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.10.1.b
    text: de beschikbaarheid van een bewijs van de uitschrijving en van de gegevens over het verzuim van leerlingen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.10.1.c
    text: |-
      de beschikbaarheid van de gegevens van leerlingen en hun ouders die noodzakelijk zijn voor de vaststelling van
      de bekostiging.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.10.2
    text: |-
      De gegevens van de leerling die in de leerlingenadministratie zijn opgenomen, worden nadat de leerling is
      uitgeschreven ten minste vijf jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.10.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de leerlingenadministratie wordt
      ingericht.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.10
  - number: 8.11.1
    text: |-
      Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1], schrijft het bevoegd gezag van een
      school een leerling slechts in na een beslissing van het bevoegd gezag tot toelating van de leerling, of indien de
      leerling tijdelijk op de school wordt geplaatst op grond van [artikel 8.13 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.11.2
    text: 'Het bevoegd gezag schrijft de leerling in met ingang van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.11
  - number: 8.11.2.a
    text: de dag waarop de leerling de school voor het eerst bezoekt; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.11
  - number: 8.11.2.b
    text: |-
      1 augustus van het schooljaar, indien de leerling de school voor het eerst op de eerste schooldag van het
      schooljaar bezoekt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.11
  - number: 8.12.1
    text: |-
      Het bevoegd gezag maakt bij beslissingen tot verwijdering van leerlingen op de grond dat deze niet zijn bevorderd
      tot het zesde leerjaar van het vwo dan wel het vijfde leerjaar van het havo, geen onderscheid tussen leerlingen op
      basis van de schoolsoort of leerweg waarvoor zij eerder stonden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.12
  - number: 8.12.2
    text: Een leerling wordt op grond van onvoldoende vorderingen niet in de loop van een schooljaar verwijderd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.12
  - number: 8.13.1
    text: 'Het bevoegd gezag schrijft de leerling uit met ingang van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.13
  - number: 8.13.1.a
    text: |-
      31 juli van het schooljaar, indien de leerling de school op de laatste schooldag van dat schooljaar heeft bezocht;
      of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.13
  - number: 8.13.1.b
    text: de dag waarop de leerling de school voor het laatst heeft bezocht.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.13
  - number: 8.13.2
    text: |-
      Indien het bevoegd gezag van een school waarop de leerling stond ingeschreven, binnen vier weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school voor ander onderwijs, wijzigt het bevoegd gezag de datum van uitschrijving, bedoeld in het
      eerste lid, onderdeel b, alsnog in de datum van de dag voorafgaande aan de dag van inschrijving op die andere
      school of die school voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: 8.14.1
    text: |-
      Een ziekte als bedoeld in [artikel 8.30, eerste lid, van de wet][ref1] kan alleen worden aangetoond door middel van
      een gedagtekende verklaring van een arts.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.14.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid zonder geldige
      reden van vier weken van een leerling als bedoeld in [artikel 8.30, eerste lid, van de wet][ref1], aan deze
      leerling dat van die afwezigheid in de leerlingenadministratie van de school aantekening is gemaakt en verzoekt de
      leerling om opgaaf van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de levering van
      de gegevens van de leerling, bedoeld in [artikel 8.20, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.14.3
    text: |-
      Het bevoegd gezag stelt uiterlijk op de vijfde werkdag na afloop van een periode van acht weken na de aanvang van
      de afwezigheid vast:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
  - number: 8.14.3.a
    text: of de reden die de leerling tijdens deze acht weken gaf voor zijn afwezigheid, een geldige is; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
  - number: 8.14.3.b
    text: dat de leerling tijdens deze acht weken geen reden heeft opgegeven voor die afwezigheid; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
  - number: 8.14.3.c
    text: of de leerling tijdens deze acht weken weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
  - number: 8.14.4
    text: |-
      De melding, bedoeld in [artikel 8.30, eerste lid, van de wet][ref1], vindt plaats uiterlijk op de vijfde werkdag na
      afloop van de periode van acht weken, bedoeld in het tweede lid. Indien die leerling tijdens deze acht weken weer
      aan het onderwijs is gaan deelnemen, meldt het bevoegd gezag Onze Minister ook de datum daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
  - number: 8.14.5
    text: |-
      De periode van vijf weken, bedoeld in [artikel 8.30, eerste lid, van de wet][ref1], en de periode van acht weken,
      bedoeld in het tweede lid, worden verlengd met de weken waarin vanwege vakantie geen onderwijs wordt gegeven.
      Vakantieweken worden niet als onderbreking van de periode gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8'
  - number: '8.15'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *inrichtingsplan:* inrichtingsplan, bedoeld in [artikel 9.3h, derde lid,
      van de wet](onbekend);
        - *instellingscode:* code bestaande uit twee cijfers en twee hoofdletters waarmee de school uniek is te
      identificeren in de Registratie Instellingen en Opleidingen;
        - *vestigingscode:* nummer dat bestaat uit de instellingscode, aangevuld met de twee cijfers die de vestiging
      aanduiden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.15
  - number: 8.16.1
    text: |-
      De melding van het bevoegd gezag over de inrichting van een tijdelijke nieuwkomersvoorziening, bedoeld in [artikel
      9.3h, eerste lid, van de wet](onbekend), gaat vergezeld van de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.a
    text: de naam van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.b
    text: het correspondentieadres van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.c
    text: het telefoonnummer van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.d
    text: het e-mailadres van de contactpersoon;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.e
    text: de naam en het bestuursnummer van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.f
    text: |-
      de naam en de instellingscode van de school en de vestigingscode waarvan de tijdelijke nieuwkomersvoorziening een
      uitbreiding is;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.g
    text: het vestigingsadres;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.h
    text: de startdatum;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.i
    text: |-
      het aantal leerlingen in de tijdelijke nieuwkomersvoorziening of het aantal leerlingen dat naar verwachting de
      tijdelijke nieuwkomersvoorziening zal bezoeken en het aantal groepen of klassen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.j
    text: indien van toepassing de specifieke opvanglocatie waaraan de tijdelijke nieuwkomersvoorziening is verbonden; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.1.k
    text: de contactgegevens van de betrokken samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.2
    text: |-
      Het inrichtingsplan bevat de gegevens, bedoeld in het eerste lid, en een beschrijving van de wijze waarop voldoende
      expertise over het aanbieden van onderwijs aan nieuwkomers wordt geborgd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.16.3
    text: |-
      Het bevoegd gezag stelt het inrichtingsplan beschikbaar aan de ouders van de leerlingen van een tijdelijke
      nieuwkomersvoorziening.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.16
  - number: 8.17.1
    text: |-
      Het bevoegd gezag stelt voor elke leerling in een tijdelijke nieuwkomersvoorziening binnen zes weken na de
      inschrijving van de leerling een doorstroomperspectief vast.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.17
  - number: 8.17.2
    text: |-
      Het doorstroomperspectief bevat in elk geval een plan over de wijze waarop een leerling zo snel mogelijk en in
      ieder geval binnen twee jaren na inschrijving in een tijdelijke nieuwkomersvoorziening zal doorstromen naar een
      school voor speciaal onderwijs, school voor voortgezet speciaal onderwijs, school voor speciaal en voortgezet
      speciaal onderwijs of een school voor voortgezet onderwijs, niet zijnde een tijdelijke nieuwkomersvoorziening.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.17
  - number: 8.17.3
    text: |-
      Het bevoegd gezag evalueert ten minste een keer per jaar het doorstroomperspectief in overleg met de ouders en
      stelt dit indien nodig bij.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.17
  - number: '8.18'
    text: |-
      Indien een vacature voor het geven van onderwijs in een tijdelijke nieuwkomersvoorziening niet kan worden
      vervuld door een bevoegde leraar of door onderwijspersoneel als bedoeld in [artikel 9.3h van de wet](onbekend),
      dan kan het bevoegd gezag in afwijking van de [artikelen 2.38, eerste tot en met negende lid][ref1], en
      [2.39 eerste en tweede lid, van de wet][ref2] het aantal klokuren onderwijs in de tijdelijke nieuwkomersvoorziening
      tijdelijk beperken, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 8.18.a
    text: de onderwijstijd niet meer en langer dan strik noodzakelijk wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.18
  - number: 8.18.b
    text: |-
      leerlingen ten minste 12,5 klokuren per week onderwijs ontvangen verspreid over ten minste 3 onderwijsdagen per
      week; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.18
  - number: 8.18.c
    text: leerlingen ten minste 10 klokuren per week onderwijs ontvangen in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.18
  - number: '8.19'
    text: |-
      Bij vaststelling van het schoolplan en de schoolgids, bedoeld in de [artikelen 2.88][ref1], [2.89][ref2],
      [2.90][ref3], [2.91][ref4] en [2.92 van de wet][ref5], wordt de tijdelijke nieuwkomersvoorziening niet betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.19
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 8.20.1
    text: Het bevoegd gezag meldt het voornemen tot opheffing van een tijdelijke nieuwkomersvoorziening aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
  - number: 8.20.2
    text: Na de melding plaatst het bevoegd gezag geen nieuwe leerlingen in de tijdelijke nieuwkomersvoorziening.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
  - number: 8.20.3
    text: 'De melding gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
  - number: 8.20.3.a
    text: |-
      de gegevens, bedoeld in [artikel 8.16][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '8'
        hoofdstuk: 8a
  - number: 8.20.3.b
    text: een uitfaseringsplan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
  - number: 8.20.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het uitfaseringsplan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.20
  - number: 8.21.1
    text: |-
      Een tijdelijke nieuwkomersvoorziening moet zijn opgeheven indien de termijn bedoeld in [artikel 9.3d, vierde lid,
      van de wet](onbekend) is verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.21
  - number: 8.21.2
    text: |-
      Onze Minister verbindt aan het besluit, bedoeld in [9.3d, vierde lid, van de wet](onbekend), een uiterlijke termijn
      voor het plaatsen van nieuwe leerlingen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.21
  - number: 8.21.3
    text: |-
      Het bevoegd gezag zendt twee maanden voor het verstrijken van de termijn de gegevens bedoeld in
      [artikel 8.16, eerste lid][ref1], en het uitfaseringsplan, bedoeld in [artikel 8.20, derde lid, onder b][ref2], aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.21
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '8'
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '8'
        hoofdstuk: 8a
  - number: '8.22'
    text: Hoofdstuk 8a vervalt op het tijdstip waarop [hoofdstuk 9, paragraaf 2a, van de wet](onbekend) vervalt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel8.22
  - number: '9.1'
    text: Dit hoofdstuk is van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.1
  - number: 9.2.1
    text: |-
      In de [artikelen 2.3][ref1], [2.4][ref2] en [2.33][ref3] wordt voor «Duitse taal» telkens gelezen «Spaanse taal» en
      wordt voor «Spaanse taal» telkens gelezen «Papiaments, Duitse taal».


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 9.2.2
    text: |-
      In de [artikelen 2.5, eerste lid][ref1], [2.6, derde lid][ref2], en [2.11, derde en vierde lid][ref3], wordt voor
      «Franse taal en literatuur» telkens gelezen «Papiaments, Franse taal en literatuur».


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 9.2.3
    text: |-
      In aanvulling op de [artikelen 2.17][ref1] en [2.26][ref2] kan het vrije deel van de theoretische leerweg en van de
      gemengde leerweg ook het vak Papiaments omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 9.2.4
    text: |-
      In aanvulling op [artikel 2.23][ref1] kan het bevoegd gezag de leerling in een beroepsgerichte leerweg in de
      gelegenheid stellen om Papiaments als extra vak te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 9.2.5
    text: |-
      In aanvulling op de [artikelen 2.7, onderdeel b][ref1], en [2.12, onderdeel b][ref2], kunnen ook Papiaments
      (elementair) en Duitse taal en literatuur (elementair) deel uitmaken van het vrije deel van een profiel in vwo en
      havo, voor zover deze taal niet al eerder is gevolgd of niet al deel uitmaakt van het profiel en het bevoegd gezag
      deze vakken aanbiedt, met een normatieve studielast van 480 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
