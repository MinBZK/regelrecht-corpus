        hoofdstuk: '6'
        paragraaf: '7'
  - number: '9.41'
    text: |-
      Het bevoegd gezag van een school voor praktijkonderwijs kan als leerling toelaten degene die ten minste de leeftijd
      van twaalf jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.41
  - number: '9.42'
    text: |-
      In afwijking van [artikel 8.13, eerste lid][ref1], schrijft het bevoegd gezag de leerling uit met ingang van de dag
      volgende op de dag waarop de leerling de school voor het laatst heeft bezocht en verstrekt de ouders of de leerling
      indien deze handelingsbekwaam is een bewijs van uitschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.42
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 9.43.1
    text: |-
      [Hoofdstuk 8a][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.43
    references:
      - id: ref1
        bwb_id: BWBR0045787
        hoofdstuk: 8a
  - number: 9.43.2
    text: Deze bepaling vervalt op het tijdstip waarop [hoofdstuk 11, paragraaf 8a van de wet](onbekend) vervalt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.43
  - number: 10.1.1
    text: |-
      De landelijke commissie voor geschillen, bedoeld in [artikel 12.34 van de wet][ref1], bestaat uit ten minste
      zeven leden. De leden worden benoemd op gezamenlijke bindende voordracht van de landelijke ouderorganisaties, de
      landelijke patiënten- en gehandicaptenorganisaties en de sectororganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '12'
  - number: 10.1.2
    text: Onze Minister benoemt en ontslaat de leden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.1.3
    text: De leden worden benoemd voor een periode van vier jaar en kunnen ten hoogste twee maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.1.4
    text: |-
      De commissie is zo samengesteld dat zij beschikt over (ortho)pedagogische, psychologische, onderwijskundige,
      maatschappelijke, bestuurlijke, juridische en medische deskundigheid. Voor de behandeling van elk ingediend geschil
      kiest de commissie uit haar leden een voorzitter en twee leden. De commissie bepaalt welke samenstelling bij de
      behandeling van het geschil het meest geschikt is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.1.5
    text: De leden worden op hun verzoek door Onze Minister ontslagen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.1.6
    text: |-
      De leden mogen geen deel uitmaken van het bevoegd gezag van een van de scholen die deelnemen aan het
      samenwerkingsverband dat betrokken is in het geschil of het bevoegd gezag van dat samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.1.7
    text: De leden functioneren zonder last of ruggenspraak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.1
  - number: 10.2.1
    text: |-
      De landelijke commissie voor geschillen, bedoeld in [artikel 12.34 van de wet][ref1], zendt haar oordeel over een
      geschil aan het bevoegd gezag en een afschrift van haar oordeel aan de ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '12'
  - number: 10.2.2
    text: |-
      Het bevoegd gezag van de school die het oordeel van de commissie heeft ontvangen, deelt schriftelijk aan de ouders
      en aan de commissie mee wat met het oordeel wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.2
  - number: 10.2.3
    text: |-
      Indien de beslissing van het bevoegd gezag van de school afwijkt van het oordeel van de commissie, wordt in de
      beslissing de reden voor die afwijking vermeld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.2
  - number: 10.3.1
    text: |-
      Het eindexamen vmbo en havo omvat voor leerlingen die geen eindexamen afleggen in het vak wiskunde een schoolexamen
      rekenen als bedoeld in [artikel 12.45 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '12'
  - number: 10.3.2
    text: |-
      In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van een
      leerweg in het vmbo en die het schoolexamen rekenen heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1] is
      vastgesteld voor het eindexamen vmbo, bij het afleggen van het eindexamen in een andere leerweg van het vmbo,
      vrijgesteld van het schoolexamen rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 10.3.3
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen vmbo aflegt aan een instelling voor educatie en
      beroepsonderwijs vrijgesteld van het schoolexamen rekenen, indien hij reeds eerder een schoolexamen rekenen vmbo of
      een schoolexamen rekenen havo heeft gemaakt. De vorige volzin is van overeenkomstige toepassing op de kandidaat die
      het eindexamen havo aflegt aan een instelling voor educatie en beroepsonderwijs en reeds eerder een schoolexamen
      rekenen havo heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
  - number: 10.3.4
    text: |-
      Het cijfer voor het schoolexamen rekenen weegt niet mee in de uitslagbepaling voor het eindexamen vmbo en havo,
      bedoeld in de [artikelen 3.34][ref1] en [3.35][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 10.3.5
    text: |-
      In afwijking van de [artikelen 3.40, eerste lid, onderdeel a][ref1], [3.49, tweede lid][ref2],
      [3.72, onderdeel a][ref3], en [3.41, onderdeel b][ref4], wordt het cijfer voor het schoolexamen rekenen vermeld op
      een bijlage bij de cijferlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 10.3.6
    text: |-
      Indien de kandidaat is vrijgesteld van het schoolexamen rekenen op grond van het vierde lid, wordt het schoolexamen
      rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
  - number: 10.3.7
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in de uitslagbepaling, bedoeld
      in [artikel 3.34][ref1] of [artikel 3.35][ref2], en de kandidaat bedenkingen heeft geuit tegen het opnemen van het
      eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 3.40, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 10.3.8
    text: |-
      Dit artikel is van overeenkomstige toepassing op de kandidaat die het eindexamen vmbo in de basisberoepsgerichte
      leerweg aflegt ter afsluiting van een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 10.3.9
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.3
  - number: 10.4.1
    text: |-
      Het staatsexamen vmbo en havo omvat voor kandidaten die geen schoolexamen rekenen als bedoeld in
      [artikel 12.45 van de wet][ref1], of eindexamen in het vak wiskunde hebben afgelegd, of voor kandidaten die
      geen staatsexamen afleggen of hebben afgelegd in het vak wiskunde, een college-examen rekenen als bedoeld in
      [artikel 12.46 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel12
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '12'
  - number: 10.4.2
    text: |-
      In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van een leerweg
      in het vmbo en die een schoolexamen rekenen als bedoeld in [artikel 12.45 van de wet][ref1], of
      een college-examen rekenen als bedoeld in het eerste lid, heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2] is
      vastgesteld voor het eindexamen vmbo, bij het afleggen van het staatsexamen in een andere leerweg van het vmbo,
      vrijgesteld van het college-examen rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 10.4.3
    text: |-
      In afwijking van het eerste lid is de kandidaat die de rekentoets, bedoeld in
      [artikel 60, zesde lid, van de wet][ref1], zoals dat artikel luidde op de dag voor inwerkingtreding van artikel
      I, onderdeel C, van de Wet van 1 juli 2020 tot wijziging van onder andere de Wet op het voortgezet onderwijs in
      verband met de afschaffing van de rekentoets in het voortgezet onderwijs (afschaffing rekentoets vo) (Stb. 2020,
      233), heeft afgelegd, vrijgesteld van het college-examen rekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel60
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '60'
  - number: 10.4.4
    text: |-
      Het cijfer voor het college-examen rekenen weegt niet mee in de uitslagbepaling voor het staatsexamen vmbo en havo,
      bedoeld in de [artikelen 4.20][ref1] en [4.21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 10.4.5
    text: |-
      In afwijking van de [artikelen 4.25, eerste lid, onderdeel a, tweede lid, onderdeel a][ref1], en
      [4.26, eerste lid, onderdeel a][ref2], wordt het cijfer voor het college-examen rekenen vermeld op een bijlage bij
      de cijferlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 10.4.6
    text: |-
      Indien de kandidaat is vrijgesteld van het college-examen rekenen op grond van het tweede of het derde lid, wordt
      het college-examen rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
  - number: 10.4.7
    text: |-
      Het vijfde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen of staatsexamen in het vak wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in de
      uitslagbepaling, bedoeld in [artikel 4.20][ref1] of [artikel 4.21][ref2], en de kandidaat bezwaar heeft tegen het
      opnemen van het eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 4.25, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 10.4.8
    text: |-
      Dit artikel is van overeenkomstige toepassing op de kandidaat die het staatsexamen vmbo in de basisberoepsgerichte
      leerweg aflegt ter afsluiting van een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 10.4.9
    text: Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.4
  - number: 10.5.1
    text: |-
      Het eindcijfer van het profielvak, behaald in het schooljaar 2020–2021 of 2021–2022, wordt betrokken bij
      de berekening van het rekenkundig gemiddelde, bedoeld in [artikel 3.35, eerste lid, onderdeel a][ref1], of
      [artikel 4.21, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 10.5.2
    text: |-
      De kandidaat, bedoeld in [artikel 2.56, vierde lid, van de wet][ref1], of [artikel 3.56][ref2], die in het
      schooljaar 2020–2021 of 2021–2022 het eindexamen in het profielvak heeft afgerond, behoudt het recht op herkansing
      van het cspe, bedoeld in artikel 3.38, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 10.5.3
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer is vastgesteld, nog geen 10
      jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.5
  - number: 10.5.4
    text: Deze bepaling vervalt met ingang van 1 januari 2033.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel10.5
