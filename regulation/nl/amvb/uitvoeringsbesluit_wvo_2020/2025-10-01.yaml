      [ref1]: https://wetten.overheid.nl/BWBR0045787#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0045787
        hoofdstuk: '2'
        paragraaf: '10'
  - number: 9.7.1
    text: |-
      Het bevoegd gezag kan bij een samenwerkingsovereenkomst als bedoeld in [artikel 2.56][ref1] afwijken van
      [artikel 2.57, tweede lid][ref2], als het gaat om het geven van vakken of onderdelen van het profieldeel of het
      vrije deel van de beroepsgerichte leerwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '12'
  - number: 9.7.2
    text: |-
      De [artikelen 2.59][ref1] en [2.60][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.7
    references:
