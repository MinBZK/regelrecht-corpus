  - number: 4.32.1
    text: |-
      Op het certificaat, bedoeld in [artikel 2.80, tweede lid, onderdeel b, van de wet][ref1] worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
