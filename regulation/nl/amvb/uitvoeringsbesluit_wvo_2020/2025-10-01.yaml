  - number: '1.2'
    text: |-
      Dit besluit is ook van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, tenzij anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel1.2
  - number: '2.1'
    text: |-
      De kerndoelen voor de eerste twee leerjaren voortgezet onderwijs vwo, havo, mavo en vbo worden bepaald in
      [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0045787
  - number: 2.2.1
    text: |-
      Leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn alle delen van het onderwijsprogramma,
      bedoeld in [artikel 2.14 van de wet][ref1], te volgen, kunnen in aanmerking komen voor afwijkingen in het
      onderwijsprogramma als bedoeld in [artikel 2.18, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.2.2
    text: |-
      Het bevoegd gezag stelt een commissie in die hem adviseert voor welke leerlingen
      [artikel 2.18, tweede lid, van de wet][ref1] kan worden toegepast. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 2.2.3
    text: |-
      In haar schriftelijk advies doet de commissie aan het bevoegd gezag voorstellen over de aard van de afwijkingen.
      Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.4
    text: 'De commissie betrekt in elk geval bij haar oordeelsvorming:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.4.a
    text: |-
      in voorkomende gevallen het onderwijskundig rapport, bedoeld in [artikel 42, eerste lid, WPO][ref1],
      [artikel 48 van de WPO BES][ref2] of [artikel 43 WEC][ref3] en de resultaten van het onderzoek naar de
      geschiktheid, bedoeld in [artikel 8.3, eerste lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0030280#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel8
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0030280
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0045787
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 2.2.4.b
    text: |-
      indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de verklaring die is
      afgegeven door een deskundige;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.4.c
    text: de schriftelijke zienswijze van de ouders van de leerlingen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.4.d
    text: de schriftelijke zienswijze van de leraar of leraren die zijn belast met het betrokken onderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Indien het bevoegd gezag het voornemen heeft om af te wijken van het advies van de commissie, overlegt het bevoegd
      gezag met de commissie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.6
    text: |-
      De beslissing van het bevoegd gezag van een bijzondere school over het afwijken van onderdelen van het
      onderwijsprogramma berust op een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Het bevoegd gezag zendt zijn besluit, voorzien van een deugdelijke motivering en vergezeld van het advies van de
      commissie en de daarbij gevoegde gegevens, bedoeld in het vierde lid, aan de ouders van de betrokken leerlingen,
      aan de betrokken leraar of leraren en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Het onderwijsprogramma in de eerste drie leerjaren aan een school voor vwo en aan een school voor havo omvat ook
      onderwijs in Franse taal en Duitse taal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen voor het volgen
      van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Russische taal,
      Italiaanse taal, Arabische taal, Turkse taal of, in vwo, Chinese taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ook ontheffing verlenen voor het
      volgen van onderwijs in Franse taal of Duitse taal of in beide talen, indien de leerling:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.3.a
    text: voor de eerste maal tot een school als bedoeld in het eerste lid is toegelaten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.3.b
    text: is geplaatst in een hoger leerjaar dan het eerste;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.3.c
    text: eerder buiten Nederland vergelijkbaar onderwijs heeft gevolgd; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.3.d
    text: daarbij geen of te weinig onderwijs in deze taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Het onderwijsprogramma in de eerste drie leerjaren aan een gymnasium omvat ook onderwijs in Latijnse taal en
      cultuur en Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het onderwijsprogramma in de eerste twee leerjaren aan een school voor mavo en aan een school voor vbo omvat ook
      onderwijs in Franse taal of Duitse taal. De eerste volzin is niet van toepassing op leerlingen voor wie naar de
      verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg het meest geschikt is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen voor het volgen
      van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Arabische taal of
      Turkse taal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ook ontheffing verlenen voor het
      volgen van onderwijs in de Franse taal of Duitse taal, indien de leerling:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.3.a
    text: voor de eerste maal tot een school als bedoeld in het eerste lid is toegelaten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.3.b
    text: is geplaatst in een hoger leerjaar dan het eerste;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.3.c
    text: eerder buiten Nederland vergelijkbaar onderwijs heeft gevolgd; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.3.d
    text: daarbij geen of te weinig onderwijs in deze taal of talen heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.4.4
    text: |-
      De leerling die op basis van het eerste lid, tweede volzin, geen onderwijs volgt in de Franse taal of
      Duitse taal, volgt in het profiel economie en ondernemen of het profiel horeca, bakkerij en recreatie van de
      basisberoepsgerichte leerweg in plaats hiervan, naar keuze van de leerling, het vak Arabische taal, Turkse taal,
      Spaanse taal, maatschappijkunde, geschiedenis en staatsinrichting of aardrijkskunde.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Het gemeenschappelijk deel van een profiel in het atheneum omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.5
  - number: 2.5.1.a
    text: 'Nederlandse taal en literatuur: 480;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.5
  - number: 2.5.1.b
    text: 'Engelse taal en literatuur: 400;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.5
  - number: 2.5.1.c
    text: |-
