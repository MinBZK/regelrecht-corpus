  - number: '2.26'
    text: 'Het vrije deel van een profiel in de gemengde leerweg:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.26
  - number: 2.26.a
    text: |-
      omvat door de leerling te kiezen vakken, genoemd in [artikel 2.25][ref1], voor zover deze niet al deel uitmaken van
      het profiel;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.b
    text: |-
      omvat door de leerling te kiezen beroepsgerichte keuzevakken, met dien verstande dat het bevoegd gezag beslist
      welke beroepsgerichte keuzevakken worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.26
  - number: 2.26.c
    text: |-
      kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, kunstvakken inclusief culturele
      en kunstzinnige vorming, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie, door de
      leerling te kiezen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.26
  - number: 2.26.d
    text: kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.26
  - number: '2.27'
    text: |-
      Het bevoegd gezag kan de leerling in de gemengde leerweg in de gelegenheid stellen in plaats van de
      vakken, genoemd in de [artikelen 2.24][ref1], [2.25][ref2] en [2.26, onderdeel c][ref3], de overeenkomstige
      vakken voor vwo, genoemd in de [artikelen 2.5 tot en met 2.7][ref4], of voor havo, genoemd in de
      [artikelen 2.10 tot en met 2.12][ref5] te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0045787
