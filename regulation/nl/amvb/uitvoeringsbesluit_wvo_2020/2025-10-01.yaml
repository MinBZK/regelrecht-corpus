  - number: 9.4.1
    text: |-
      In [artikel 2.42, eerste lid, onderdeel d][ref1], wordt voor «Bevrijdingsdag» gelezen «Koninkrijksdag».


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel9.4
    references:
