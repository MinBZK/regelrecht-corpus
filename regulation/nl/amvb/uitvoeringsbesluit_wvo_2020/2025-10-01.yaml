  - number: 3.49.1
    text: 'De rector of directeur verstrekt een voorlopige cijferlijst aan de examenkandidaat:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.1.a
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.1.a.1°
    text: |-
      in het voorlaatste of direct daaraan voorafgaande leerjaar een centraal examen of een afsluitend schoolexamen in
      een of meer vakken heeft afgelegd, voor zover de cijfers niet op grond van [artikel 3.36, tweede lid][ref1], zijn
      vervallen; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.49.1.a.2°
    text: |-
      het gespreid centraal examen, bedoeld in [artikel 3.56][ref1], aflegt; en


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.49.1.b
    text: die vervolgens de school verlaat zonder het eindexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2
    text: 'Op de voorlopige cijferlijst worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2.a
    text: het vak of de vakken waarin de examenkandidaat centraal examen of een afsluitend schoolexamen heeft afgelegd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2.b
    text: het cijfer van het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2.c
    text: het cijfer van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2.d
    text: het eindcijfer voor het vak;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.2.e
    text: |-
      de aantekening of gebruik is gemaakt van het recht van herkansing, bedoeld in [artikel 3.38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.49.3
    text: Bij ministeriële regeling wordt het model voor de voorlopige cijferlijst vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
  - number: 3.49.4
    text: |-
      De examenkandidaat kan geen rechten meer ontlenen aan de voorlopige cijferlijst met ingang van het moment waarop
      aan de examenkandidaat een cijferlijst als bedoeld in [artikel 2.58, eerste lid, van de wet][ref1] is uitgereikt
      die in ieder geval de eindcijfers van de voorlopige cijferlijst omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.49
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: '3.50'
    text: |-
      Op het certificaat, bedoeld in [artikel 2.58, eerste lid, onderdeel d, van de wet][ref1], voor de voor het
      eindexamen vmbo afgewezen examenkandidaat die de school verlaat, worden vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.50
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.50.a
    text: het vak of de vakken waarvoor de examenkandidaat een eindcijfer 6 of hoger heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.50
  - number: 3.50.b
    text: het thema van het profielwerkstuk, indien beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.50
  - number: 3.51.1
    text: Van een afgegeven diploma, certificaat, bewijs van ontheffing of cijferlijst wordt geen duplicaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.51
  - number: 3.51.2
    text: |-
      Onze Minister kan een schriftelijke verklaring verstrekken dat een document als bedoeld in het eerste lid is
      afgegeven. Deze verklaring heeft dezelfde waarde als dat document zelf.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.51
  - number: 3.51.3
    text: |-
      Onze Minister kan een document ter vervanging van een diploma, certificaat of cijferlijst
      verstrekken indien op grond van [artikel 4, vierde lid][ref1], [artikel 7, eerste lid][ref2], of
      [artikel 28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] of ten gevolge van het verkrijgen van het
      Nederlanderschap op grond van [artikel 7, eerste lid, van de Rijkswet op het Nederlanderschap][ref4], de voornaam
      respectievelijk de geslachtsnaam van de examenkandidaat is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 28b
      - id: ref4
        bwb_id: BWBR0003738
        artikel: '7'
  - number: 3.52.1
    text: |-
      Het bevoegd gezag van een school voor vbo kan een leerling in de basisberoepsgerichte leerweg, de
      kaderberoepsgerichte leerweg of de gemengde leerweg die is ingeschreven aan een school voor voortgezet speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs in de gelegenheid stellen als extraneus het
      eindexamen af te leggen in een of meer profielvakken, praktijkgerichte vakken of beroepsgerichte keuzevakken van
      die leerwegen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.52
  - number: 3.52.2
    text: |-
      Het bevoegd gezag van een school voor mavo kan een leerling in de theoretische leerweg die is ingeschreven aan een
      school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet onderwijs in de gelegenheid
      stellen als extraneus het eindexamen af te leggen in een praktijkgericht vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.52
  - number: 3.53.1
    text: |-
      Een extraneus is aan het bevoegd gezag een financiële bijdrage verschuldigd van € 720 voor het afleggen van een
      eindexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.53
  - number: 3.53.2
    text: |-
      De financiële bijdrage voor het afleggen van een eindexamen is niet verschuldigd door de extraneus die is
      ingeschreven bij een andere uit ’s Rijks kas bekostigde school, afdeling of onderwijsinstelling en die aldaar geen
      eindexamen of geen eindexamen in alle vakken aflegt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.53
  - number: 3.53.3
    text: |-
      Bij ministeriële regeling kan het bedrag, bedoeld in het eerste lid, worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.53
  - number: 3.53.4
    text: In afwijking van het eerste lid bedraagt de financiële bijdrage, bedoeld in het eerste lid, in 2022 € 685.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.53
  - number: 3.54.1
    text: |-
      De rector of directeur kan toestaan dat een examenkandidaat op grond van zijn handicap of ziekte het eindexamen
      geheel of gedeeltelijk aflegt op een wijze die is aangepast aan de mogelijkheden van die examenkandidaat.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.2
    text: |-
      De rector of directeur bepaalt de wijze waarop het eindexamen door de examenkandidaat vanwege zijn handicap of
      ziekte wordt afgelegd, met dien verstande dat aan de overige bepalingen van dit besluit wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.3
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap of ziekte, geldt voor de aangepaste wijze van
      examineren, bedoeld in het eerste lid, dat:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.3.a
    text: |-
      er een deskundigenverklaring is die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.3.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in elk geval kan bestaan uit een verlenging van
      de duur van de toets van het centraal examen met ten hoogste 30 minuten; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.3.c
    text: |-
      een andere aanpassing kan worden toegestaan voor zover daartoe in de onderdeel a genoemde deskundigenverklaring
      over betrokkene een voorstel wordt gedaan of indien de aanpassing aantoonbaar aansluit bij de begeleidingsadviezen,
      vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.54.4
    text: |-
      De rector of directeur doet van de wijze waarop het examen ingevolge dit artikel wordt afgelegd zo spoedig mogelijk
      mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.54
  - number: 3.55.1
    text: |-
      Het bevoegd gezag kan toestaan dat voor een examenkandidaat op grond van onvoldoende beheersing van de Nederlandse
      taal wordt afgeweken van dit besluit, indien deze examenkandidaat met inbegrip van het schooljaar waarin hij
      eindexamen aflegt, ten hoogste zes jaar onderwijs in Nederland heeft gevolgd en het Nederlands niet de moedertaal
      is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.2
    text: 'De afwijking, bedoeld in het eerste lid, kan betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.2.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.2.b
    text: het vak Nederlandse taal; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.2.c
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.3
    text: |-
      De afwijking bestaat voor zover betrekking hebbend op het centraal examen uit een verlenging van de duur van het
      centraal examen met ten hoogste 30 minuten en het verlenen van toestemming tot het gebruik van een verklarend
      woordenboek van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.55.4
    text: De rector of directeur doet van elke afwijking ingevolge dit artikel mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.55
  - number: 3.56.1
    text: |-
      Het bevoegd gezag kan, de inspectie gehoord, toestaan dat een examenkandidaat die in het laatste leerjaar langdurig
      ziek is of die lange tijd ten gevolge van een bijzondere, van zijn wil onafhankelijke, omstandigheid niet in staat
      is geweest het onderwijs in alle eindexamenvakken gedurende het laatste leerjaar te volgen, het centraal examen en
      in voorkomend geval het schoolexamen, voor een deel van de vakken in het ene schooljaar en voor het andere deel in
      het daarop volgende schooljaar aflegt. In dat geval wordt het eindexamen in een vak in het eerste of in het tweede
      van deze schooljaren afgesloten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.56
  - number: 3.56.2
    text: |-
      Het bevoegd gezag geeft de toestemming, bedoeld in het eerste lid, uiterlijk voor de aanvang van het eerste tijdvak
      van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin voor een
      examenkandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.56
  - number: 3.56.3
    text: |-
      De examenkandidaat heeft het recht van herkansing, bedoeld in [artikel 3.38][ref1], in het eerste en in het
      tweede schooljaar van het gespreid centraal examen, met dien verstande dat het recht van herkansing in het eerste
      schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal examen is
      afgesloten, voor de eerste maal zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.56.4
    text: |-
      De rector of directeur en de examensecretaris stellen op verzoek van de examenkandidaat de uitslag van het
      eindexamen vast aan het einde van het eerste schooljaar van het gespreid centraal examen of het gespreid
      schoolexamen, met overeenkomstige toepassing van [artikel 3.34][ref1] of [artikel 3.35][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.56
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.57'
    text: |-
      In het examenreglement, bedoeld in [artikel 2.60 van de wet][ref1], kan worden opgenomen dat tot
      herkansingsmogelijkheden van het schoolexamen, bedoeld in [artikel 2.60, eerste lid, onderdeel c, van de wet][ref2]
      kunnen behoren gevallen dat de examenkandidaat door ziekte of ten gevolge van een bijzondere van zijn wil
      onafhankelijke omstandigheid, niet in staat is geweest aan de toets deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.58.1
    text: |-
      De maatregelen, bedoeld in [artikel 2.61, eerste lid, van de wet][ref1], die de rector of directeur jegens een
      examenkandidaat kan nemen, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.58.1.a
    text: het toekennen van het cijfer 1 voor een toets van het schoolexamen of het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.1.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen of het centraal
      examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.1.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het al afgelegde deel van het schoolexamen of het centraal
      examen; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.1.d
    text: |-
      het bepalen dat het diploma en de cijferlijst alleen kunnen worden uitgereikt na een hernieuwd examen in door de
      rector of directeur aan te wijzen onderdelen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, kunnen afhankelijk van de aard van de onregelmatigheid afzonderlijk of
      in combinatie met elkaar genomen worden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.3
    text: |-
      Indien een hernieuwd examen als bedoeld in het eerste lid, onderdeel d, betrekking heeft op een of meer onderdelen
      van het centraal examen legt de examenkandidaat dat examen af in een volgend tijdvak van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.58.4
    text: |-
      De rector of directeur zendt de beslissing waarbij een maatregel als bedoeld in het eerste lid wordt genomen aan de
      examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.58
  - number: 3.59.1
    text: |-
      De commissie van beroep voor de eindexamens stelt bij haar beslissing op een bezwaarschrift tegen een maatregel als
      bedoeld in [artikel 3.58][ref1] zo nodig vast op welke wijze de examenkandidaat alsnog in de gelegenheid zal worden
      gesteld het eindexamen geheel of gedeeltelijk af te leggen, onverminderd [artikel 3.58, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '7'
  - number: 3.59.2
    text: |-
      De commissie zendt haar beslissing aan de examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift
      aan de rector of directeur en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.59
  - number: 3.59.3
    text: |-
      De samenstelling en het adres van de commissie van beroep voor de eindexamens worden vermeld in het
      examenreglement, bedoeld in [artikel 2.60, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 3.60.1
    text: |-
      De bij of krachtens dit hoofdstuk gestelde bepalingen, met uitzondering van de [artikelen 3.10][ref1] en
      [3.53][ref2], zijn ook van toepassing op het eindexamen bij een opleiding vavo aan een instelling voor educatie en
      beroepsonderwijs, tenzij in deze paragraaf hiervan wordt afgeweken, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: 3.60.1.a
    text: |-
      voor «bevoegd gezag» telkens wordt gelezen «bevoegd gezag, bedoeld in [artikel 1.1.1 WEB][ref1] of
      [artikel 1.1.1 WEB BES][ref2]»;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '1'
  - number: 3.60.1.b
    text: voor «leerling» telkens wordt gelezen «vavo-student»;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
  - number: 3.60.1.c
    text: |-
      voor «school» telkens wordt gelezen «instelling voor educatie en beroepsonderwijs», met dien verstande dat in de
      [artikelen 3.22][ref1] en [3.62][ref2] onder «school» wordt verstaan «school voor voortgezet onderwijs»;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.60.1.d
    text: |-
      voor «rector of directeur» of voor «rector of directeur en examensecretaris» telkens wordt gelezen «de
      examencommissie vavo».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
  - number: 3.60.2
    text: |-
      In deze paragraaf wordt verstaan onder: - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1.1.1. WEB][ref1]
      of [artikel 1.1.1 WEB BES][ref2];
        - *examencommissie vavo:* examencommissie voor een opleiding vavo, bedoeld in [artikel 7.4.11, tweede lid][ref3],
      juncto [artikel 7.4.5 WEB][ref4] of [artikel 7.4.13, tweede lid][ref5], juncto [artikel 7.4.7 WEB BES][ref6];
        - *instelling voor educatie en beroepsonderwijs:* een instelling voor educatie en beroepsonderwijs, voor zover het
      gaat om door die instelling verzorgde opleidingen vavo.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0028395
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0028395
        artikel: '7'
  - number: '3.61'
    text: 'Het bevoegd gezag stelt de vavo-student in de gelegenheid af te leggen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.61
  - number: 3.61.a
    text: het volledig eindexamen vwo, havo of vmbo theoretische leerweg; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.61
  - number: 3.61.b
    text: het eindexamen vwo, havo of vmbo theoretische leerweg in een of meer vakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.61
  - number: 3.62.1
    text: |-
      Het volledig eindexamen vwo (atheneum), havo en vmbo theoretische leerweg aan een instelling voor educatie en
      beroepsonderwijs omvat de vakken van het eindexamen vwo (atheneum), havo, respectievelijk vmbo theoretische leerweg
      aan een school, met uitzondering van de volgende vakken van het gemeenschappelijk deel:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.62.1.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.62.1.b
    text: 'voor vwo (atheneum) en havo: culturele en kunstzinnige vorming; en'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.62.1.c
    text: 'voor vmbo theoretische leerweg: de vakken behorende tot de beeldende vorming, muziek, dans of drama.'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.62.2
    text: |-
      Het volledig eindexamen vwo (gymnasium) aan een instelling voor educatie en beroepsonderwijs omvat de vakken
      van het eindexamen vwo (gymnasium) aan een school, met uitzondering van het vak lichamelijke opvoeding van het
      gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.62.3
    text: |-
      Het volledig eindexamen vwo (atheneum), havo en vmbo theoretische leerweg aan een instelling voor educatie en
      beroepsonderwijs omvat ook het profielwerkstuk.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.62
  - number: 3.63.1
    text: |-
      Indien de examenkandidaat aan een instelling voor educatie en beroepsonderwijs eindexamen aflegt in een vak
      of in een aantal vakken die samen geen eindexamen vormen, kan de examenkandidaat daaraan voorafgaand aan de
      examencommissie vavo kenbaar maken, het volledig eindexamen te willen afsluiten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
  - number: 3.63.2
    text: |-
      De examenkandidaat kan het volledige eindexamen afsluiten door voor de ontbrekende vakken in aanvulling op de
      cijferlijst voor die vakken aan de examencommissie vavo een of meer van de volgende bewijsstukken over te leggen:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
  - number: 3.63.2.a
    text: |-
      een door een school uitgereikte cijferlijst als bedoeld in [2.58, eerste lid van de wet][ref1] of
      [artikel 3.39][ref2], uitgereikt in een eerder schooljaar;


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.63.2.b
    text: |-
      een door een andere instelling voor educatie en beroepsonderwijs uitgereikte cijferlijst als bedoeld in
      [artikel 2.58, eerste lid, van de wet][ref1] of [artikel 3.72][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.63.2.c
    text: |-
      een resultatenlijst als bedoeld in [artikel 7.4.6, derde lid, WEB][ref1] of [7.4.8, tweede lid, WEB BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
  - number: 3.63.2.d
    text: |-
      een cijferlijst van een staatsexamen of deelstaatsexamen als bedoeld in [artikel 4.25][ref1] of
      [artikel 4.26][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 3.63.2.e
    text: |-
      een bewijs van ontheffing als bedoeld in [artikel 3.67, derde lid][ref1], of [artikel 4.9, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 3.63.3
    text: |-
      Een cijferlijst wordt bij de vaststelling van de uitslag van het eindexamen betrokken, indien na het jaar waarin
      deze is vastgesteld, nog geen tien jaar zijn verstreken. Een bewijs van ontheffing wordt bij de vaststelling van
      de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.63
  - number: 3.64.1
    text: 'De examenkandidaat aan een instelling voor educatie en beroepsonderwijs is vrijgesteld van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.a
    text: |-
      het eindexamen in een vak in vwo op grond van een examen vwo, indien voor het overeenkomstige vak een eindcijfer 6
      of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.b
    text: |-
      het eindexamen in een vak in havo op grond van een examen vwo of havo, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.c
    text: |-
      het eindexamen in een vak van de theoretische leerweg in het vmbo op grond van een examen vwo, havo, theoretische
      leerweg of gemengde leerweg vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee
      overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.d
    text: |-
      het eindexamen in een vak van vwo, havo of vmbo op grond van het overeenkomstige examen, afgelegd in Curaçao,
      Sint Maarten of Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende
      waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.e
    text: |-
      het profielwerkstuk vwo of havo, indien eerder een profielwerkstuk is gemaakt dat betrekking heeft op een of meer
      vakken van dezelfde schoolsoort, behorende tot het profiel van de examenkandidaat en waarvoor een eindcijfer 6 of
      hoger is behaald; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.1.f
    text: |-
      het profielwerkstuk vmbo, indien eerder een profielwerkstuk vmbo is gemaakt dat betrekking heeft op een thema uit
      het profiel van de examenkandidaat, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.2
    text: |-
      Het eerste lid is van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is vastgesteld, nog
      geen tien jaar zijn verstreken. Het eerste lid, onderdeel f, is van overeenkomstige toepassing op een eerder
      gemaakt sectorwerkstuk dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.64.3
    text: |-
      De examenkandidaat, bedoeld in het eerste lid, aanhef en onderdelen a tot en met d, is ook vrijgesteld van het
      eindexamen in dat vak indien het eindcijfer 5 of 4 is behaald, mits de examenkandidaat voldoet aan de voorwaarden,
      bedoeld in de [artikelen 3.34][ref1] of [3.35][ref2], om te slagen voor het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 3.64.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.64
  - number: 3.65.1
    text: |-
      Onverminderd de toepasselijkheid van [artikel 3.8][ref1] op het eindexamen bij een instelling voor educatie en
      beroepsonderwijs, is de examenkandidaat aan een instelling voor educatie en beroepsonderwijs die eerder op grond
      van de [artikelen 3.8][ref2], [3.64][ref3] of het tweede en derde lid, bij het eindexamen is vrijgesteld in een
      vak, bij het eindexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.65.2
    text: |-
      De examenkandidaat aan een instelling voor educatie en beroepsonderwijs, aan wie eerder op grond van
      [artikel 3.66][ref1] of [artikel 4.8][ref2] een bewijs van ontheffing is verleend voor het eindexamen of
      staatsexamen in een vak, is bij het eindexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 3.65.3
    text: |-
      Op grond van de bevoegdheid, bedoeld in [artikel 9.3, eerste lid, van de wet][ref1], is
      de examenkandidaat aan een instelling voor educatie en beroepsonderwijs, die op grond van
      [artikel 12 van de Beleidsregel verstrekking licentie Topsporttalentschool VO 2020][ref2] of
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO 2020][ref3], ontheffing heeft verkregen voor een vak
      als genoemd in die artikelen, bij het eindexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0044028#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0044030#Artikel13
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.65
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0044028
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0044030
        artikel: '13'
  - number: 3.65.4
    text: |-
      Een bewijs van ontheffing als bedoeld in het tweede lid wordt bij de vaststelling van de uitslag van het eindexamen
      betrokken, indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is vastgesteld,
      nog geen tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.65
  - number: 3.66.1
    text: |-
      Het college kan op aanvraag van de examenkandidaat aan een instelling voor educatie en beroepsonderwijs bij het
      eindexamen ontheffing verlenen voor een vak, indien de examenkandidaat op grond van eerder gevolgd onderwijs
      aantoonbaar in het bezit is van voldoende kennis en vaardigheden over dat vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.66
  - number: 3.66.2
    text: |-
      De ontheffing, bedoeld in het eerste lid, kan worden verleend op basis van een diploma, getuigschrift, certificaat
      of ander bewijsstuk, al dan niet behaald in Nederland, dat door het college wordt aanvaard als bewijs van voldoende
      kennis en vaardigheden. Indien het college dit nodig oordeelt, onderzoekt het college of de examenkandidaat in het
      bezit is van voldoende kennis en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.66
  - number: 3.66.3
    text: |-
      Het tweede lid is van toepassing indien na het jaar waarin het diploma, getuigschrift, certificaat of ander
      bewijsstuk is vastgesteld, nog geen tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.66
  - number: 3.66.4
    text: |-
      Tot het diploma, getuigschrift, certificaat en ander bewijsstuk, bedoeld in het tweede lid, behoren in elk geval
      die van het Internationaal Baccalaureaat, het Europees Baccalaureaat en die van het overeenkomstige onderwijs in
      een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.66
  - number: 3.67.1
    text: |-
      De aanvrager voegt bij een aanvraag voor een ontheffing als bedoeld in [artikel 3.66][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.67.1.a
    text: een gewaarmerkt afschrift van gegevens uit de basisregistratie personen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.1.b
    text: |-
      een gewaarmerkte kopie van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop de aanvraag om
      ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.2
    text: |-
      Indien het college de gevraagde ontheffing verleent, verstrekt het college de aanvrager een bewijs van ontheffing,
      en zendt het college Onze Minister een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.3
    text: 'Het bewijs van ontheffing vermeldt:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.3.a
    text: de gronden van de ontheffing; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.3.b
    text: het tijdstip van het verrichten van de onderwijs- of examenprestatie waarop de ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.67.4
    text: |-
      Indien van toepassing gaat het bewijs van ontheffing vergezeld van een verklaring over het onderzoek, bedoeld in
      [artikel 3.66, tweede lid][ref1], naar de kennis en vaardigheden van de examenkandidaat, of naar de bewijsstukken,
      bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.67.5
    text: Bij ministeriële regeling wordt het model voor het bewijs van ontheffing vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.67
  - number: 3.68.1
    text: |-
      Het bevoegd gezag kan de examenkandidaat die het eindexamen atheneum aflegt aan een instelling voor educatie
      en beroepsonderwijs bij het eindexamen ontheffing verlenen voor een tweede moderne vreemde taal, genoemd in
      [artikel 2.5, eerste lid, onderdeel c][ref1], indien de leerling:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.68.1.a
    text: |-
      een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die effect heeft op
      taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.68
  - number: 3.68.1.b
    text: een andere moedertaal heeft dan de Nederlandse taal; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.68
  - number: 3.68.1.c
    text: |-
      onderwijs volgt in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs in de taal
      verhindert naar verwachting dat de opleiding met goed gevolg wordt afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.68
  - number: 3.68.2
    text: |-
      In geval van een ontheffing als bedoeld in het eerste lid wordt het eindexamen in de taal vervangen door het
      eindexamen in een van de vakken, genoemd in [artikel 2.6][ref1] of in [artikel 2.7, onderdeel c][ref2], met een
      normatieve studielast van ten minste 440 uren, naar keuze van de examenkandidaat, voor zover het bevoegd gezag deze
      als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.68
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.69.1
    text: |-
      Het bevoegd gezag kan de examenkandidaat die het eindexamen vmbo theoretische leerweg aflegt aan een instelling
      voor educatie of beroepsonderwijs bij het eindexamen ontheffing verlenen van de vakken Franse taal of Duitse taal
      van het profieldeel, of van beide, indien de leerling:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.69
  - number: 3.69.1.a
    text: |-
      een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die effect heeft op
      taal;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.69
  - number: 3.69.1.b
    text: een andere moedertaal heeft dan de Nederlandse taal; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.69
  - number: 3.69.1.c
    text: |-
      onderwijs volgt in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs in de taal
      verhindert naar verwachting dat de opleiding met goed gevolg wordt afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.69
  - number: 3.69.2
    text: |-
      In geval van een ontheffing op grond van het eerste lid, wordt het eindexamen in de taal vervangen door het
      eindexamen in een van de vakken, genoemd in [artikel 2.33, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.69
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 3.70.1
    text: |-
      Onverminderd [artikel 3.33, eerste lid][ref1], betrekt de eindexamencommissie vavo bij de vaststelling van de
      uitslag van een volledig eindexamen bewijsstukken als bedoeld in [artikel 3.63, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.70
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 3.70.2
    text: |-
      Onverminderd [artikel 3.33, tweede lid][ref1], toont de examenkandidaat aan een instelling voor educatie en
      beroepsonderwijs in voorkomend geval ten genoegen van de eindexamencommissie vavo aan dat hij recht heeft op een
      vrijstelling of ontheffing als bedoeld in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.70
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.71'
    text: |-
      Onverminderd de [artikelen 3.42][ref1] en [3.43][ref2], wordt op de cijferlijst van de examenkandidaat aan een
      instelling voor educatie en beroepsonderwijs vermeld de vakken waarvoor de examenkandidaat is vrijgesteld op grond
      van [artikel 3.64][ref3] of [4.5][ref4], met vermelding van het eerder behaalde cijfer.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.71
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '3.72'
    text: |-
      De examencommissie vavo reikt aan de examenkandidaat die eindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs in een of meer vakken, een cijferlijst uit waarop worden vermeld:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.72
  - number: 3.72.a
    text: de cijfers voor het schoolexamen en het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.72
  - number: 3.72.b
    text: voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.72
  - number: 3.72.c
    text: voor het vmbo het thema en de beoordeling van het profielwerkstuk; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.72
  - number: 3.72.d
    text: |-
      de eindcijfers voor de examenvakken met inbegrip van het eindcijfer, bedoeld in [artikel 3.34, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.72
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.73'
    text: |-
      De examencommissie vavo reikt aan de examenkandidaat die aan een instelling voor educatie en beroepsonderwijs
      eindexamen heeft afgelegd en aan wie op grond van de uitslag niet een diploma kan worden uitgereikt of die
      eindexamen heeft afgelegd in een of meer vakken, een certificaat uit, waarop voor zover van toepassing zijn
      vermeld:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.73
  - number: 3.73.a
    text: het vak of de vakken waarvoor de examenkandidaat een eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.73
  - number: 3.73.b
    text: voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.73
  - number: 3.73.c
    text: voor het vmbo het thema van het profielwerkstuk, indien beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.73
  - number: '3.74'
    text: |-
      Onze Minister kan toestaan dat wordt afgeweken van dit hoofdstuk voor experimenten met een andere inrichting van
      het eindexamen dan in dit hoofdstuk geregeld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel3.74
  - number: 4.1.1
    text: Het college stelt de aanmeldingsprocedure voor het staatsexamen en het deelstaatsexamen vast.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
  - number: 4.1.2
    text: 'De aanmelding heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
  - number: 4.1.2.a
    text: |-
      het verkrijgen van toelating tot het afleggen van het staatsexamen of het deelstaatsexamen ten overstaan van het
      college; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
  - number: 4.1.2.b
    text: |-
      het overleggen aan het college van de bewijsstukken, bedoeld in
      [artikel 2.72, tweede lid, onderdeel b, van de wet][ref1], ter verkrijging van het staatsexamendiploma, al dan niet
      in combinatie met het afleggen van het staatsexamen in een of meer vakken ten overstaan van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4.1.3
    text: |-
      Onze Minister maakt de aanmeldingsprocedure tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding
      aan de examenkandidaat.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Uit de aanmelding voor het staatsexamen blijkt ook of sprake is van een of meer vrijstellingen of ontheffingen als
      bedoeld in de [artikelen 4.5][ref1], [4.6][ref2], [4.7][ref3] of [4.8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.1.5
    text: Indien de examenkandidaat minderjarig is, ondertekenen ook de wettelijke vertegenwoordigers de aanmelding.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.1
  - number: 4.2.1
    text: |-
      Tot het staatsexamen vmbo basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg of gemengde leerweg wordt
      toegelaten de examenkandidaat die:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
  - number: 4.2.1.a
    text: 'ten tijde van de aanmelding voor het staatsexamen:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
  - number: 4.2.1.a.1°
    text: |-
      is ingeschreven als student aan een beroepsopleiding als bedoeld in de [WEB][ref1] of [WEB BES][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0028395
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0028395
  - number: 4.2.1.a.2°
    text: |-
      is ingeschreven aan een school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet
      speciaal onderwijs en als extraneus het eindexamen vmbo in een in de aanhef genoemde leerweg heeft afgelegd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
  - number: 4.2.1.b
    text: eerder voor het eindexamen vmbo in een in de aanhef genoemde leerweg is afgewezen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      een cijferlijst overlegt waaruit blijkt dat voor elk van de vakken van het beroepsgerichte programma, bedoeld
      in de [artikelen 3.5, eerste lid, onderdeel c][ref1], [artikel 3.6, eerste lid, onderdeel c][ref2], of
      [artikel 3.7, eerste lid, onderdeel d][ref3], dan wel het praktijkgerichte programma, als bedoeld in artikel 3.7,
      lid 1a, waarin eindexamen is afgelegd, het eindcijfer 6 of hoger is behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.2.2
    text: |-
      Tot het deelstaatsexamen vmbo voor een of meer algemene vakken in de basisberoepsgerichte leerweg,
      kaderberoepsgerichte leerweg of gemengde leerweg wordt ook toegelaten de examenkandidaat die is ingeschreven aan
      een school voor voortgezet speciaal onderwijs of school voor speciaal en voortgezet speciaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De financiële bijdrage, bedoeld in [artikel 2.72, vierde lid, van de wet][ref1], voor toelating tot het afleggen
      van het staatsexamen bedraagt € 720.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4.3.2
    text: |-
      De financiële bijdrage voor toelating tot het afleggen van een deelstaatsexamen voor een vak waarin zowel het
      college-examen als het centraal examen wordt afgelegd bedraagt € 144.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
  - number: 4.3.3
    text: |-
      De financiële bijdrage voor toelating tot het afleggen van deelstaatsexamen voor een vak waarin alleen het centraal
      examen of alleen het college-examen wordt afgelegd, bedraagt € 71.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
  - number: 4.3.4
    text: |-
      De bedragen, genoemd in het eerste, tweede en derde lid, kunnen bij ministeriële regeling worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
  - number: 4.3.5
    text: |-
      Bij ministeriële regeling wordt de financiële bijdrage vastgesteld die per kalenderjaar ten hoogste is verschuldigd
      voor toelating tot het afleggen van deelstaatsexamens.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
  - number: 4.3.6
    text: De verschuldigde financiële bijdrage wordt voldaan op de wijze en voor de datum, bepaald door het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Het staatsexamen vwo (atheneum), havo en vmbo theoretische leerweg omvat de vakken van het eindexamen vwo
      (atheneum), havo, respectievelijk vmbo theoretische leerweg, aan een school, met uitzondering van de volgende
      vakken van het gemeenschappelijk deel:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.1.a
    text: lichamelijke opvoeding;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.1.b
    text: 'voor vwo (atheneum) en havo: culturele en kunstzinnige vorming; en'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.1.c
    text: 'voor vmbo theoretische leerweg: de vakken behorende tot de beeldende vorming, muziek, dans of drama.'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Het staatsexamen vmbo theoretische leerweg omvat niet een praktijkgericht vak als bedoeld in [artikel 2.17a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.4.3
    text: |-
      Het staatsexamen vwo (gymnasium) omvat de vakken van het eindexamen vwo (gymnasium) aan een school, met
      uitzondering van het vak lichamelijke opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.4
    text: |-
      Het staatsexamen vmbo basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg en gemengde leerweg omvat de
      vakken van het eindexamen vmbo in deze leerwegen, met dien verstande dat in deze leerwegen alleen de algemene
      vakken van het eindexamen via het staatsexamen kunnen worden afgesloten, met uitzondering van een praktijkgericht
      vak, als bedoeld in [artikel 2.25a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 4.4.5
    text: |-
      Het college kan, al dan niet voor een bepaalde groep examenkandidaten, besluiten dat geen gelegenheid wordt gegeven
      tot het afleggen van staatsexamen in een vak dat alleen behoort tot het vrije deel van een profiel, het vak kunst
      (drama) of het vak kunst (dans).
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.6
    text: |-
      Het profielwerkstuk vwo en havo heeft betrekking op een of meer vakken van het staatsexamen. Ten minste een van
      deze vakken heeft minimaal de volgende omvang:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.6.a
    text: 'voor havo: 320 uur;'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.6.b
    text: 'voor vwo: 400 uur.'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.4.7
    text: |-
      Het profielwerkstuk vmbo theoretische leerweg heeft betrekking op een thema uit een profiel waarin de leerling
      onderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.4
  - number: 4.5.1
    text: 'De examenkandidaat die staatsexamen aflegt is vrijgesteld van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.a
    text: |-
      het staatsexamen in een vak in vwo op grond van een examen vwo, indien voor het overeenkomstige vak een eindcijfer
      6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.b
    text: |-
      het staatsexamen in een vak in havo op grond van een examen vwo of havo, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.c
    text: |-
      het staatsexamen in een vak in de theoretische of gemengde leerweg van het vmbo op grond van een examen vwo, havo,
      vmbo theoretische leerweg of vmbo gemengde leerweg, indien voor het overeenkomstige vak een eindcijfer 6 of hoger
      is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.d
    text: |-
      het staatsexamen in een vak in de basisberoepsgerichte of kaderberoepsgerichte leerweg van het vmbo op grond van
      een examen vwo, havo of vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.e
    text: |-
      het staatsexamen in een vak van vwo, havo of vmbo op grond van het overeenkomstige examen, afgelegd in Curaçao,
      Sint Maarten, Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.f
    text: |-
      het profielwerkstuk vwo of havo, indien eerder een profielwerkstuk is gemaakt dat betrekking heeft op een of meer
      vakken van dezelfde schoolsoort, behorende tot het profiel van de examenkandidaat en waarvoor een eindcijfer 6 of
      hoger is behaald; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.1.g
    text: |-
      het profielwerkstuk vmbo, indien eerder een profielwerkstuk vmbo is gemaakt dat betrekking heeft op een thema uit
      dat profiel, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.2
    text: |-
      In aanvulling op het eerste lid, onderdelen a tot en met d, is de examenkandidaat vrijgesteld van het onderdeel
      literatuur van elke moderne taal, indien de examenkandidaat bij het eerder afgelegde examen, voor literatuur een
      cijfer 6 of hoger heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.3
    text: |-
      Het eerste en tweede lid zijn van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.4
    text: |-
      De examenkandidaat, bedoeld in het eerste lid, onderdelen a tot en met f, en derde lid, is ook vrijgesteld van het
      vak indien het eindcijfer 5 of 4 is behaald, mits hij voldoet aan de voorwaarden van de [artikelen 4.20][ref1] of
      [4.21][ref2] om te slagen voor het staatsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.5.5
    text: Bij ministeriële regeling worden nadere regels gesteld over de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
  - number: 4.5.6
    text: |-
      [Artikel 3.40, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 4.6.1
    text: |-
      De examenkandidaat die eerder op grond van de [artikelen 3.8][ref1], [3.64][ref2] of [3.65][ref3] bij het
      eindexamen aan een school of een instelling voor educatie en beroepsonderwijs is vrijgesteld van een vak, is bij
      het staatsexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 4.6.2
    text: |-
      De examenkandidaat aan wie eerder op grond van [artikel 3.67][ref1] bij het eindexamen aan een instelling voor
      educatie en beroepsonderwijs of op grond van [artikel 4.7][ref2] ontheffing is verleend voor het eindexamen in een
      vak, is bij het staatsexamen vrijgesteld in dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.6.3
    text: |-
      Een bewijs van ontheffing wordt bij de vaststelling van de uitslag van het staatsexamen betrokken, indien na het
      jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is vastgesteld, nog geen tien jaar zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.6
  - number: 4.7.1
    text: |-
      De examenkandidaat met het diploma havo is bij het staatsexamen vwo vrijgesteld van het vak maatschappijleer van
      het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.7
  - number: 4.7.2
    text: |-
      De examenkandidaat met het diploma havo of het diploma vmbo die in plaats van een vak voor die
      schoolsoort of als extra vak examen heeft afgelegd in een overeenkomstige vak voor vwo, genoemd in de
      [artikelen 2.5 tot en met 2.7][ref1], is bij het staatsexamen vwo vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 4.7.3
    text: |-
      De examenkandidaat met het diploma vmbo die in plaats van een vak voor die schoolsoort of als extra vak examen
      heeft afgelegd in een overeenkomstige vak voor havo, genoemd in de [artikelen 2.10 tot en met 2.12][ref1], is bij
      het staatsexamen havo vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 4.7.4
    text: |-
      De examenkandidaat die op grond van [artikel 12 van de Beleidsregel verstrekking LOOT-licentie VO][ref1] of
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO][ref2] ontheffing heeft verkregen voor een vak,
      genoemd in die artikelen, is bij het staatsexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0026643#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0044030#Artikel13
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0026643
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0044030
        artikel: '13'
  - number: 4.8.1
    text: |-
      Het college kan op aanvraag van de examenkandidaat voor het staatsexamen ontheffing verlenen voor een vak, indien
      de examenkandidaat op grond van eerder gevolgd onderwijs aantoonbaar in het bezit is van voldoende kennis en
      vaardigheden over dat vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.8
  - number: 4.8.2
    text: |-
      De ontheffing, bedoeld in het eerste lid, kan worden verleend op basis van een diploma, getuigschrift, certificaat
      of ander bewijsstuk, al dan niet behaald in Nederland, dat door het college wordt aanvaard als bewijs van voldoende
      kennis en vaardigheden. Indien het college dit nodig oordeelt, onderzoekt het college of de examenkandidaat in het
      bezit is van voldoende kennis en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Het tweede lid is van toepassing indien na het jaar waarin het diploma, getuigschrift, certificaat of ander
      bewijsstuk is vastgesteld, nog geen tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.8
  - number: 4.8.4
    text: |-
      Tot het diploma, getuigschrift, certificaat en ander bewijsstuk, bedoeld in het tweede lid, behoren in elk geval
      die van het Internationaal Baccalaureaat, het Europees Baccalaureaat en die van het overeenkomstige onderwijs in
      een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.8
  - number: 4.9.1
    text: |-
      De aanvrager voegt bij de aanvraag voor een ontheffing als bedoeld in [artikel 4.8][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.9.1.a
    text: een gewaarmerkt afschrift van gegevens uit de basisregistratie personen; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.1.b
    text: |-
      een gewaarmerkte fotokopie van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop de aanvraag om
      ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.2
    text: |-
      Indien het college de gevraagde ontheffing verleent, verstrekt het college de aanvrager een bewijs van ontheffing,
      en zendt het college Onze Minister een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.3
    text: 'Het bewijs van ontheffing vermeldt:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.3.a
    text: de gronden van de ontheffing;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.3.b
    text: het tijdstip van het verrichten van de onderwijs- of examenprestatie waarop de ontheffing berust.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Indien van toepassing gaat het bewijs van ontheffing vergezeld van een verklaring over het onderzoek, bedoeld in
      [artikel 4.8, tweede lid][ref1], naar de kennis en vaardigheden van de examenkandidaat, of naar de bewijsstukken,
      bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.9.5
    text: Bij ministeriële regeling wordt het model voor het bewijs van ontheffing vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.9
  - number: '4.10'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het college gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.10
  - number: 4.11.1
    text: |-
      Het cijfer van het college-examen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10 gebruikt met de daartussen liggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Indien in een vak geen centraal examen wordt afgelegd, wordt het cijfer van het college-examen uitgedrukt in een
      cijfer van 1 tot en met 10, zonder decimaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.11
  - number: 4.11.3
    text: |-
      In afwijking van het eerste lid wordt het profielwerkstuk in het vmbo beoordeeld met «goed», «voldoende» of
      «onvoldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.11
  - number: '4.12'
    text: |-
      Indien bij het college, al dan niet naar aanleiding van mededelingen van de examenkandidaat, twijfel is gerezen
      over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een vak, kan het college
      die beoordeling ongeldig verklaren en een nieuw examen in dat vak of onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.12
  - number: 4.13.1
    text: |-
      Onze Minister draagt er zorg voor dat de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor toetsen en examens][ref1], tijdig beschikbaar worden
      gesteld aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 4.13.2
    text: |-
      Het college draagt er zorg voor dat de opgaven en correctieregels voor het centraal examen geheim blijven tot de
      aanvang van de toets.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Tijdens een schriftelijke toets van het centraal examen worden aan de examenkandidaat geen mededelingen van welke
      aard ook over de opgaven gedaan, uitgezonderd mededeling van door het college vastgestelde errata.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.14.2
    text: Het college draagt zorg voor het nodige toezicht bij het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.14.3
    text: |-
      Zij die toezicht hebben gehouden, maken daarvan een proces-verbaal op. Zij leveren dit samen met het gemaakte
      examenwerk in bij het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.14.4
    text: Een examenkandidaat wordt tot uiterlijk een half uur na de aanvang tot de toets toegelaten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.14.5
    text: De aan de examenkandidaat voorgelegde opgaven blijven in het examenlokaal tot het einde van die toets.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.14.6
    text: |-
      De examenkandidaat levert de opgaven, de door hem gemaakte aantekeningen en ook andere door hem gemaakte stukken in
      bij een van degenen die toezicht houden. Het college bepaalt in welke gevallen kan worden afgeweken van de eerste
      volzin, en ook in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere stukken, bedoeld in
      die volzin, aan de examenkandidaat worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.14
  - number: 4.15.1
    text: |-
      Het college draagt er zorg voor dat elk afzonderlijk gemaakte werk voor het centraal examen achtereenvolgens door
      twee door het college aan te wijzen correctoren wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
  - number: 4.15.2
    text: De correctoren kijken het werk onafhankelijk van elkaar na.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
  - number: 4.15.3
    text: |-
      De corrector past bij zijn beoordeling de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 4.15.4
    text: |-
      De corrector drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 4.15.5
    text: De corrector zendt de score en het beoordeelde werk aan het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
  - number: 4.15.6
    text: |-
      Indien dit het college noodzakelijk voorkomt, wordt het oordeel van een derde corrector ingeroepen. Het tweede,
      derde en vierde lid zijn van overeenkomstige toepassing op de derde corrector.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.15
  - number: 4.16.1
    text: Het college stelt op grond van scores van de correctoren de score voor het centraal examen vast.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.16
  - number: 4.16.2
    text: |-
      Het college stelt het cijfer voor het centraal examen vast op grond van de
      score voor het centraal examen en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref1] voor toetsen en examen.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: 4.16.3
    text: |-
      Bij de vaststelling van het cijfer gebruikt het college een van de cijfers uit de schaal lopend van 1 tot en met
      10, met de tussenliggende cijfers met 1 decimaal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.16
  - number: 4.17.1
    text: |-
      Indien een examenkandidaat om een geldige reden, ter beoordeling van het college, is verhinderd bij het centraal
      examen in een of meer vakken in het eerste tijdvak aanwezig te zijn, krijgt hij in het tweede tijdvak de
      gelegenheid het centraal examen voor ten hoogste twee vakken alsnog te voltooien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.2
    text: |-
      Indien een examenkandidaat ook in het tweede tijdvak om een geldige reden, ter beoordeling van het college,
      verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.3
    text: |-
      Indien een examenkandidaat ook in het derde tijdvak om een geldige reden, ter beoordeling van het college,
      verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld op een door het college vast te stellen tijdstip het staatsexamen te voltooien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.4
    text: 'Voor de aanvang van het derde tijdvak zendt Onze Minister aan de inspectie een opgave van:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.4.a
    text: de kandidaten;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.4.b
    text: de in het eerste of tweede tijdvak door hen behaalde cijfers;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.4.c
    text: voor zover van toepassing de alsnog behaalde cijfers; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.17.4.d
    text: een overzicht van het vak of de vakken waarin elke kandidaat zal worden geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.17
  - number: 4.18.1
    text: |-
      Het eindcijfer voor alle vakken van het staatsexamen en het deelstaatsexamen wordt uitgedrukt in een geheel cijfer
      uit de reeks van 1 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Het college bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het cijfer voor het college-
      examen en het cijfer voor het centraal examen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.18
  - number: 4.18.3
    text: |-
      Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het college-examen ook het
      eindcijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.18
  - number: 4.18.4
    text: |-
      Indien voor een vak alleen een centraal examen wordt afgenomen, vormt het cijfer voor het centraal examen, afgerond
      overeenkomstig het tweede lid, het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.18
  - number: 4.19.1
    text: |-
      Het college stelt voor de vaststelling van de uitslag van het staatsexamen vast of de examenkandidaat het
      staatsexamen heeft afgelegd in de voor het staatsexamen voorgeschreven vakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.2
    text: |-
      Het college kan een examenkandidaat die deelstaatsexamen aflegt toestaan het volledige staatsexamen af te leggen,
      als deze examenkandidaat het college daar voorafgaand aan zijn examens om verzoekt. Het examen wordt in datgeval
      afgerond door voor de ontbrekende vakken, in aanvulling op de cijferlijst voor het deelstaatsexamen, aan het
      college bewijsstukken te over te leggen als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.3
    text: 'De uitslag van het staatsexamen wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.3.a
    text: op grond van de eindcijfers die zijn behaald voor een volledig staatsexamen dat in dat jaar is afgelegd; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.3.b
    text: op grond van bewijsstukken als bedoeld in vierde lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.4
    text: |-
      De bewijsstukken, bedoeld in [artikel 2.72 van de wet][ref1], ter verkrijging van een diploma van het staatsexamen
      zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4.19.4.a
    text: eindcijfers van deelstaatsexamens die in dat jaar zijn afgelegd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.4.b
    text: |-
      cijferlijsten als bedoeld in [artikel 2.80, eerste lid, van de wet][ref1] en de [artikelen 4.25][ref2] en
      [4.26][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4.19.4.c
    text: cijferlijsten van een school;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.4.d
    text: resultatenlijsten of cijferlijsten van instellingen voor educatie en beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.4.e
    text: |-
      bewijzen van ontheffing als bedoeld in [artikel 4.9, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.19.4.f
    text: |-
      bewijzen van ontheffing als bedoeld in [artikel 3.67, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
  - number: 4.19.5
    text: |-
      Een cijferlijst wordt bij de vaststelling van de uitslag betrokken, indien na het jaar waarin deze is vastgesteld,
      nog geen tien jaar zijn verstreken. Een bewijs van ontheffing wordt bij de vaststelling van de uitslag betrokken
      indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is vastgesteld, nog geen
      tien jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.19.6
    text: |-
      Indien dat nodig is om de examenkandidaat te laten slagen voor het staatsexamen, betrekt het college een of meer
      eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken dienen een
      staatsexamen te vormen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.19
  - number: 4.20.1
    text: 'De examenkandidaat die staatsexamen vwo of havo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.b
    text: |-
      hij voor een van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van toepassing
      wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of hoger heeft behaald en hij voor het andere vak of andere
      hier genoemde vakken als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.c.1°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.c.2°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt; of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.c.4°
    text: |-
      voor een van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor een van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      hoger heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.1.d
    text: hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk. Het college kan daaraan toevoegen:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.2.a
    text: |-
      literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het college daartoe
      niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het college-examen van deze taal
      en literatuur;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.2.b
    text: algemene natuurwetenschappen in vwo en havo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.3
    text: |-
      Het eindcijfer, bedoeld in het tweede lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers van de
      samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal indien
      het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is,
      naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.4
    text: De examenkandidaat wiens staatsexamen niet voldoet aan dit artikel is afgewezen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
  - number: 4.20.5
    text: |-
      Zodra de uitslag van het staatsexamen is vastgesteld, maakt het college deze samen met de eindcijfers schriftelijk
      aan de examenkandidaat bekend. Indien de examenkandidaat is afgewezen voor het staatsexamen, wordt bij de
      bekendmaking mededeling gedaan van het recht op herkansing als bedoeld in [artikel 4.22][ref1]. De uitslag is de
      definitieve uitslag indien de examenkandidaat geen gebruik maakt van het recht op herkansing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.21.1
    text: 'De examenkandidaat die het staatsexamen vmbo heeft afgelegd, is geslaagd indien:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.a
    text: het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.b
    text: hij voor het vak Nederlandse taal als eindcijfer 5 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.c
    text: 'hij onverminderd onderdeel b:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.c.1°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.c.2°
    text: |-
      voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft behaald;
      of
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.c.3°
    text: |-
      voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft
      behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.d
    text: hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.1.e
    text: |-
      als het gaat om een staatsexamen gemengde of theoretische leerweg: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de theoretische leerweg het eindcijfer
      van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg niet
      betrokken, tenzij deze vakken samen ten minste een volledig beroepsgericht programma als bedoeld in
      [artikel 3.7, eerste lid, onderdeel d][ref1], dan wel het praktijkgerichte programma, als bedoeld in artikel 3.7,
      lid 1a, vormen. In dat geval is het vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.21.3
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.4
    text: |-
      Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de gemengde leerweg het gemiddelde van
      de eindcijfers van het profielvak, dan wel het praktijkgerichte vak, en alle beroepsgerichte keuzevakken
      aangemerkt als het eindcijfer van een vak, met dien verstande dat het eindcijfer voor het profielvak, dan wel het
      praktijkgerichte vak, daarbij net zo vaak meetelt als het aantal eindcijfers van beroepsgerichte keuzevakken dat in
      de berekening wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.5
    text: |-
      Het eindcijfer, bedoeld in het derde en vierde lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers
      van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal
      indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of
      hoger is, naar boven afgerond.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.6
    text: De examenkandidaat wiens staatsexamen niet voldoet aan dit artikel, is afgewezen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
  - number: 4.21.7
    text: |-
      Zodra de uitslag van het staatsexamen is vastgesteld, maakt het college deze samen met de eindcijfers schriftelijk
      aan de examenkandidaat bekend. Indien de examenkandidaat is afgewezen voor het staatsexamen, wordt bij de
      bekendmaking mededeling gedaan van het recht op herkansing als bedoeld in [artikel 4.22][ref1]. De uitslag is de
      definitieve uitslag indien de examenkandidaat geen gebruik maakt van het recht op herkansing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.22.1
    text: |-
      De examenkandidaat die in enig jaar is afgewezen voor het staatsexamen, heeft recht op herkansing in het derde
      tijdvak van dat jaar, mits de examenkandidaat daardoor alsnog kan slagen voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.22
  - number: 4.22.2
    text: |-
      Indien de examenkandidaat op grond van [artikel 4.17, tweede lid][ref1], in de gelegenheid wordt gesteld in het
      derde tijdvak het centraal examen te voltooien, wordt het recht op herkansing uitgeoefend op een door het college
      te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 4.22.3
    text: |-
      Het recht op herkansing houdt in om voor twee door de examenkandidaat te kiezen vakken waarin hij dat jaar door het
      college is geëxamineerd, opnieuw deel te nemen aan:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.22
  - number: 4.22.3.a
    text: |-
      het college-examen of onderdelen daarvan, in door het college vast te stellen onderdelen van het examenprogramma;
      en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.22
  - number: 4.22.3.b
    text: het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.22
  - number: 4.23.1
    text: |-
      De examenkandidaat die van zijn recht op herkansing als bedoeld in [artikel 4.22][ref1] gebruik wil maken,
      stelt het college binnen acht dagen na de bekendmaking, bedoeld in [artikel 4.20, vijfde lid][ref2], of
      [artikel 4.21, zevende lid][ref3], schriftelijk hiervan in kennis, onder vermelding van de vakken waarin hij
      opnieuw wil deelnemen aan het college-examen en de vakken waarin hij opnieuw wil deelnemen aan het centraal examen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.23.2
    text: |-
      Indien de examenkandidaat het college niet overeenkomstig het eerste lid in kennis stelt, is hij alsnog afgewezen
      voor het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.23
  - number: 4.23.3
    text: |-
      Het college bevestigt zo spoedig mogelijk schriftelijk aan de examenkandidaat de ontvangst van de kennisgeving,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.23
  - number: 4.24.1
    text: |-
      Het college stelt vast op welke wijze het cijfer van de herkansing voor het college-examen wordt bepaald. In zijn
      overwegingen betrekt het college de cijfers voor die toetsen van het eerder afgelegde college-examen die betrekking
      hebben op niet tot de herkansing behorende onderdelen van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.24
  - number: 4.24.2
    text: |-
      Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen of centraal
      examen geldt als definitief cijfer voor het college-examen of het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.24
  - number: 4.24.3
    text: |-
      Na afloop van de herkansing stelt het college de uitslag definitief vast met overeenkomstige toepassing van de
      [artikelen 4.18 tot en met 4.21][ref1] en maakt de uitslag schriftelijk aan de examenkandidaat bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.25.1
    text: |-
      Op de cijferlijst van de examenkandidaat die is afgewezen voor het staatsexamen worden over de vakken waarin hij in
      dat jaar door het college is geëxamineerd, vermeld:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.1.a
    text: de cijfers voor het college-examen en het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.1.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.1.d
    text: de eindcijfers voor de examenvakken;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.1.e
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2
    text: |-
      Op de cijferlijst van de examenkandidaat die is geslaagd voor het staatsexamen worden over elk examenvak dat bij de
      bepaling van de uitslag is betrokken vermeld:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.a
    text: de cijfers voor het college-examen, het centraal examen, en in voorkomend geval het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.d
    text: |-
      de vakken waarvoor de examenkandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de
      cijfers voor deze vakken;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.e
    text: de eindcijfers voor de examenvakken; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.2.f
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.3
    text: |-
      Indien een examenkandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste nodig zijn voor
      het behalen van het staatsexamen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de
      cijferlijst vermeld, tenzij de examenkandidaat daartegen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.25.4
    text: Het college ondertekent de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.25
  - number: 4.26.1
    text: 'Het college reikt aan de kandidaat die deelstaatsexamen heeft afgelegd een cijferlijst uit waarop zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: 4.26.1.a
    text: de cijfers voor het college-examen en het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: 4.26.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: 4.26.1.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: 4.26.1.d
    text: de eindcijfers voor de examenvakken.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: 4.26.2
    text: Het college ondertekent de cijferlijst voor het deelstaatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.26
  - number: '4.27'
    text: 'Bij het staatsexamen vwo en het staatsexamen havo worden op de cijferlijst vermeld:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.27
  - number: 4.27.a
    text: |-
      vakken waarvoor de examenkandidaat is vrijgesteld op grond van de [artikelen 3.64][ref1] of [4.5][ref2], met
      vermelding van het eerder behaalde cijfer;


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.27.b
    text: |-
