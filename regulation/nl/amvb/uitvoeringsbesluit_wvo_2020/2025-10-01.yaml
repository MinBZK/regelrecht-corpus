    text: |-
      Het Rijk betaalt elke maand van het kalenderjaar aan het bevoegd gezag van een school een gedeelte van de
      bekostiging, bedoeld in [artikel 6.2, eerste lid][ref1], waarop het over dat jaar recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.11
    references:
