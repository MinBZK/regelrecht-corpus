      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel6
