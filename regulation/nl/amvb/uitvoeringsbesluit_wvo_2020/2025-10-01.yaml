  - number: 2.25.1a
    text: |-
      In afwijking van het eerste lid kan het profieldeel van de gemengde leerweg vmbo in plaats van het profielvak, één
      praktijkgericht vak behorend bij het profiel, genoemd in [artikel 2.25a][ref1], omvatten, indien het bevoegd gezag
      dit aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.25
    references:
