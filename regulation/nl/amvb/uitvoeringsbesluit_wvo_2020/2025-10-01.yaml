preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 6 juli 2021, nr. WJZ/27929139
    (6797), directie Wetgeving en Juridische Zaken;

    Gelet op de Wet voortgezet onderwijs 2020, de artikelen 7.3.4, tweede lid, 7.4.11, derde en vijfde lid, van de
    Wet educatie en beroepsonderwijs, en de artikelen 7.3.3, tweede lid, en 7.4.13, derde en vijfde lid, van de Wet
    educatie en beroepsonderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 25 augustus 2021, nr. W05.21.0191/I);

    Gezien het nader rapport van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 12 oktober 2021, nr.
    WJZ/29176009 (6797), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanvullende bekostiging:* aanvullende
      bekostiging als bedoeld in de [artikelen 5.5][ref1], [5.9][ref2] en [5.10 van de wet][ref3];
        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4] of
      een deskundige als bedoeld in [artikel 121, zesde lid, van Boek 2 van het Burgerlijk Wetboek BES][ref5];
        - *algemeen vak:* vak, niet zijnde een profielvak of een beroepsgericht keuzevak;
        - *beroepsgericht keuzevak:* keuzevak als bedoeld in [artikel 2.29][ref6];
        - *beroepsgericht programma:* programma als bedoeld in [artikel 3.7, eerste lid, onderdeel d][ref7];
        - *college:* College voor toetsen en examens;
        - *cspe:* centraal schriftelijk en praktisch examen in een profielvak;
        - *eerste schooldag:* 1 augustus of de dag waarop het onderwijs aan de school in enig schooljaar is aangevangen;
        - *examinator:* examinator als bedoeld in [artikel 2.51, derde lid, van de wet][ref8];
        - *extraneus:* extraneus als bedoeld in [artikel 2.51, tweede lid, van de wet][ref9];
        - *gemeenschappelijk deel:* deel van een profiel als bedoeld in
      [artikel 2.21, eerste lid, onderdeel a, van de wet][ref10] of
      [artikel 2.24, eerste lid, onderdeel a, van de wet][ref11];
        - *hoofdvestiging:* hoofdvestiging als bedoeld in [artikel 4.13 van de wet][ref12];
        - *instelling voor educatie en beroepsonderwijs:* instelling voor educatie en beroepsonderwijs als bedoeld in
      [artikel 1.1.1 WEB][ref13] of [artikel 1.1.1 WEB BES][ref14];
        - *nevenvestiging:* nevenvestiging als bedoeld in [artikel 4.14 van de wet][ref15];
        - *nieuwkomer:* leerling die: a. vreemdeling als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref16] is,
      b. als werkelijk schoolgaand staat ingeschreven bij een school, c. geen Internationaal georiënteerd voortgezet
      onderwijs of Europees secundair onderwijs volgt, en; d. in Nederland verblijft en korter dan twee jaar geleden
      voor het eerst is ingeschreven op een school als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref17],
      [artikel 1 van de Wet op de expertisecentra][ref18] of [artikel 1.1 van de wet][ref19];
        - *praktijkgericht programma:* programma als bedoeld in [artikel 3.7, lid 1a][ref20];
        - *profiel:* profiel als bedoeld in [artikel 2.21, eerste lid, van de wet][ref21] en
      [artikel 2.24, eerste lid, van de wet][ref22];
        - *profieldeel:* deel van een profiel als bedoeld in de [artikel 2.21, eerste lid, onderdeel b, van de wet][ref23]
      of [artikel 2.24, eerste lid, onderdeel b, van de wet][ref24];
        - *profielvak:* vak als bedoeld in [artikel 2.21, eerste lid][ref25], en [artikel 2.25, eerste lid][ref26];
        - *profielwerkstuk:* profielwerkstuk als bedoeld in [artikel 2.53, derde lid, van de wet][ref27];
        - *schoolsoortgroep 1:* scholen voor mavo, vbo, praktijkonderwijs en scholengemeenschappen bestaande uit ten minste
      twee van deze schoolsoorten, inclusief het leerwegondersteunend onderwijs;
        - *schoolsoortgroep 2:* scholen voor vbo, havo en scholengemeenschappen bestaande uit een combinatie van deze
      scholen;
        - *schoolsoortgroep 3:* scholengemeenschappen bestaande uit scholen voor havo, mavo, al dan niet in combinatie met
      scholen voor vwo, inclusief het leerwegondersteunend onderwijs;
        - *schoolsoortgroep 4:* scholengemeenschappen bestaande uit scholen voor havo, mavo en vbo, al dan niet in
      combinatie met scholen voor praktijkonderwijs of scholen voor vwo, inclusief het leerwegondersteunend onderwijs;
        - *teldatum:* datum van 1 oktober, bedoeld in [artikel 5.8, eerste lid, van de wet][ref28];
        - *uitkering:* een werkloosheidsuitkering, een suppletie inzake arbeidsongeschiktheid of een uitkering wegens
      ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref29];
        - *vavo:* opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, WEB][ref30] en [artikel 7.3.1, eerste lid, onderdeel a, WEB BES][ref31];
        - *vrije deel:* deel van een profiel als bedoeld in de [artikel 2.21, eerste lid, onderdeel c, van de wet][ref32]
      of [artikel 2.24, eerste lid, onderdeel c, van de wet][ref33];
        - *wet:* [Wet voortgezet onderwijs 2020][ref34].


