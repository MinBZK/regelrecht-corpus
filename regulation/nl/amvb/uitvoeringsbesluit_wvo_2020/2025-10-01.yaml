        artikel: '2'
  - number: 4.32.1.a
    text: het vak of de vakken waarvoor de kandidaat een eindcijfer 6 of hoger heeft behaald;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.32
  - number: 4.32.1.b
    text: het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.32
  - number: 4.32.1.c
    text: het thema en de beoordeling van het profielwerkstuk vmbo, voor zover beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.32
  - number: 4.32.2
    text: Het college ondertekent het certificaat.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.32
  - number: 4.33.1
    text: Van een afgegeven diploma, certificaat, bewijs van ontheffing of cijferlijst worden geen duplicaat verstrekt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.33
  - number: 4.33.2
    text: |-
      Onze Minister kan een schriftelijke verklaring verstrekken dat een document als bedoeld in het eerste lid is
      afgegeven. Deze verklaring heeft dezelfde waarde als dat document zelf.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.33
  - number: 4.33.3
    text: |-
      Onze Minister kan een document ter vervanging van een diploma, certificaat of cijferlijst
      verstrekken indien op grond van [artikel 4, vierde lid][ref1], [artikel 7, eerste lid][ref2], of
      [artikel 28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] of ten gevolge van het verkrijgen van het
      Nederlanderschap op grond van [artikel 7, eerste lid, van de Rijkswet op het Nederlanderschap][ref4], de voornaam
      respectievelijk de geslachtsnaam van de examenkandidaat is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0003738#Artikel7
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.33
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 28b
      - id: ref4
        bwb_id: BWBR0003738
        artikel: '7'
  - number: 4.34.1
    text: |-
      Het college kan toestaan dat een examenkandidaat op grond van zijn handicap of ziekte het staatsexamen geheel of
      gedeeltelijk aflegt op een wijze die is aangepast aan de mogelijkheden van die examenkandidaat.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.2
    text: |-
      Het college bepaalt de wijze waarop het staatsexamen door de examenkandidaat wordt afgelegd, met dien verstande dat
      aan de overige bepalingen in dit besluit wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.3
    text: |-
      Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt voor de aangepaste wijze van
      examineren, bedoeld in het eerste lid, dat:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.3.a
    text: |-
      een deskundigenverklaring voorligt die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.3.b
    text: |-
      de aanpassing voor zover betrekking hebbend op het centraal examen in elk geval kan bestaan uit een verlenging van
      de duur van het centraal examen met ten hoogste 30 minuten; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.3.c
    text: |-
      een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde deskundigenverklaring
      over betrokkene een voorstel wordt gedaan of indien de aanpassing aantoonbaar aansluit bij de begeleidingsadviezen,
      vermeld in die deskundigenverklaring.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.34.4
    text: Het college doet van elke afwijking op grond van dit artikel zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.34
  - number: 4.35.1
    text: |-
      Het college kan toestaan dat voor examenkandidaat op grond van onvoldoende beheersing van de Nederlandse taal wordt
      afgeweken van de bij of krachtens dit besluit gestelde regels, indien de examenkandidaat met inbegrip van het jaar
      waarin hij staatsexamen of deelstaatsexamen aflegt, ten hoogste zes jaar onderwijs in Nederland heeft gevolgd en
      niet het Nederlands als moedertaal heeft.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.35.2
    text: 'De afwijking, bedoeld in het eerste lid, kan betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.35.2.a
    text: het vak Nederlandse taal en literatuur;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.35.2.b
    text: enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.35.3
    text: |-
      De afwijking, bedoeld in het eerste lid, bestaat voor het centraal examen uit een verlenging van de duur van het
      centraal examen met ten hoogste 30 minuten, en het verlenen van toestemming tot het gebruik van een verklarend
      woordenboek van de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.35.4
    text: Het college doet van elke afwijking op grond van dit artikel mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.35
  - number: 4.36.1
    text: |-
      De maatregelen, bedoeld in [artikel 2.82, eerste lid, van de wet][ref1], die het college jegens een examenkandidaat
      kan nemen, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4.36.1.a
    text: het toekennen van het cijfer 1 voor een toets van het college-examen of het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.1.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het college-examen of het centraal
      examen van dat vak;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.1.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het al afgelegde deel van het college-examen of het centraal
      examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.1.d
    text: minder vergaande maatregelen dan die, bedoeld onderdelen a tot en met c.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.2
    text: |-
      De maatregelen kunnen afhankelijk van de aard van de onregelmatigheid afzonderlijk of in combinatie met elkaar
      genomen worden.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.3
    text: |-
      De ontzegging, bedoeld in het eerste lid, onderdeel b, ten aanzien van een examenkandidaat die in meer dan een vak
      eindexamen aflegt, kan betrekking hebben op alle toetsen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.36.4
    text: |-
      Indien de onregelmatigheid pas wordt ontdekt na afloop van het examen, kan het college de examenkandidaat het
      diploma, bedoeld in [artikel 2.80, tweede lid, onderdeel a, van de wet][ref1], het certificaat, bedoeld in
      [artikel 2.80, tweede lid, onderdeel b, van de wet][ref2], of de cijferlijst onthouden, of kan bepalen dat aan de
      betrokken examenkandidaat dat diploma of certificaat, of die cijferlijst, alleen kunnen worden uitgereikt na een
      hernieuwd examen in de door het college aan te wijzen onderdelen en op de door deze te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2'
  - number: 4.36.5
    text: |-
      Het college zendt het besluit waarbij een maatregel als bedoeld in het eerste lid wordt genomen aan de
      examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.36
  - number: 4.37.1
    text: |-
      Het college stelt bij zijn beslissing op een bezwaarschrift tegen een maatregel als bedoeld in [artikel 4.36][ref1]
      zo nodig vast op welke wijze de examenkandidaat alsnog in de gelegenheid zal worden gesteld het staatsexamen geheel
      of gedeeltelijk af te leggen of opnieuw af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '8'
  - number: 4.37.2
    text: |-
      Het college zendt zijn beslissing op het bezwaar in afschrift aan de wettelijke vertegenwoordigers indien de
      examenkandidaat minderjarig is en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.37
  - number: 4.38.1
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het college aan Onze Minister en aan
      de inspectie een lijst die voor een examenkandidaat die niet is geslaagd voor het staatsexamen, voor zover van
      toepassing, vermeldt:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.a
    text: de vakken waarin examen is afgelegd;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.c
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.d
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.f
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.1.g
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2
    text: |-
      Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het college aan Onze Minister en aan de
      inspectie een lijst die voor een examenkandidaat die is geslaagd voor het staatsexamen, voor zover van toepassing,
      vermeldt:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.a
    text: het profiel of de profielen waarop het examen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.b
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.c
    text: de cijfers van het college-examen of het schoolexamen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.d
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.e
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.f
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.g
    text: de eindcijfers;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.h
    text: |-
      de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor die vakken;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.2.i
    text: de uitslag van het staatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3
    text: |-
      Zo spoedig mogelijk na de vaststelling van de eindcijfers van de examenkandidaten die deelstaatsexamen hebben
      afgelegd, zendt het college aan Onze Minister en aan de inspectie een lijst die voor een examenkandidaat vermeldt:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.a
    text: de vakken die zijn vermeld op de cijferlijst;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.b
    text: de cijfers van het college-examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.c
    text: het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.d
    text: de beoordeling en het thema van het profielwerkstuk vmbo;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.e
    text: de cijfers van het centraal examen;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.38.3.f
    text: de eindcijfers.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.38
  - number: 4.39.1
    text: |-
      Het schriftelijke werk van de examenkandidaat wordt gedurende ten minste zes maanden na afloop van het examen
      bewaard op een door het college te bepalen wijze. Een examenkandidaat die voor een vak centraal examen aflegt
      met geheime opgaven kan over zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      college. De andere examenkandidaten kunnen gedurende die periode hun schriftelijk werk inzien.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.39
  - number: 4.39.2
    text: |-
      Een door het college ondertekend exemplaar van de lijst, bedoeld in
      [artikel 4.38, eerste, tweede en derde lid][ref1], en de door de examenkandidaat overgelegde documenten, worden
      gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van het college bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.39
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '9'
  - number: 4.39.3
    text: |-
      Het college draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van het college.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel4.39
  - number: 5.1.1
    text: |-
      Onderwijs in de gemengde leerweg aan een hoofdvestiging of een nevenvestiging van een school voor vbo wordt op
      grond van [artikel 4.20, eerste lid, aanhef en onderdeel d, van de wet][ref1], voor bekostiging in aanmerking
      gebracht, indien het bevoegd gezag van dat onderwijs met het bevoegd gezag van een school voor mavo een
      samenwerkingsovereenkomst heeft gesloten voor de uitwisseling van expertise, de leerlingbegeleiding en de
      examinering.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '4'
  - number: 5.1.2
    text: |-
      Het vorige lid is van overeenkomstige toepassing op onderwijs in de gemengde leerweg aan een hoofdvestiging of een
      nevenvestiging van een school voor mavo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel5.1
  - number: 6.1.1
    text: |-
      Een vestiging van een school of scholengemeenschap komt in aanmerking voor het bedrag, bedoeld in
      [artikel 5.4, eerste lid, onderdeel a, van de wet][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.1.1.a
    text: |-
      sprake is van een hoofdvestiging of een nevenvestiging, waaraan door Onze Minister een registratienummer als
      bedoeld in [artikel 5, eerste lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref1] is toegekend;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0042639#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0042639
        artikel: '5'
  - number: 6.1.1.b
    text: |-
      bij die vestiging op de teldatum ten minste 130 leerlingen of, indien sprake is van een vestiging waaraan
      uitsluitend praktijkonderwijs wordt verzorgd, 60 leerlingen, staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Bij het bepalen van het bedrag per vestiging, bedoeld in [artikel 5.4, eerste lid, onderdeel a, van de wet][ref1]
      wordt onderscheid gemaakt tussen een bedrag voor de hoofdvestiging van een school of scholengemeenschap en een
      bedrag voor een nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.1.3
    text: |-
      Bij het bepalen van het bedrag per leerling, bedoeld in [artikel 5.4, eerste lid, onderdeel b, van de wet][ref1]
      wordt onderscheid gemaakt tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.1.3.a
    text: |-
      leerlingen in het praktijkonderwijs of in het derde of vierde leerjaar van de basisberoepsgerichte of
      kaderberoepsgerichte leerweg van het vbo; en
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
  - number: 6.1.3.b
    text: |-
      leerlingen in het vwo, havo, mavo of vbo, met uitzondering van leerlingen in het derde of vierde leerjaar van de
      basisberoepsgerichte en kaderberoepsgerichte leerweg van het vbo.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
  - number: 6.1.4
    text: |-
      Een hoofd- of nevenvestiging van een scholengemeenschap komt in aanmerking voor aanvullende bekostiging als bedoeld
      in [artikel 5.9, derde lid, van de wet][ref1], indien aan die vestiging onderwijs wordt verzorgd in alle leerjaren
      van het vwo, havo, mavo en vbo. De hoogte van deze aanvullende bekostiging wordt vastgesteld bij ministeriële
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.2.1
    text: |-
      Onze Minister stelt jaarlijks voor elke school of scholengemeenschap de hoogte van de bekostiging, bedoeld in
      [artikel 5.6 van de wet][ref1] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.2.2
    text: |-
      Onze Minister stelt voor elke school of scholengemeenschap die daarvoor in aanmerking komt het bedrag van de
      aanvullende bekostiging, bedoeld in de [artikelen 5.9][ref1] en [5.10][ref2] vast.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.2.3
    text: |-
      De bekostiging bedoeld in het eerste lid komt tot stand door het aantal vestigingen, bedoeld in
      [artikel 6.1, eerste lid][ref1], en het aantal leerlingen, bedoeld in artikel 8, te vermenigvuldigen met de
      bedragen per vestiging en per leerling, bedoeld in [artikel 5.4, eerste lid, van de wet][ref2], waarbij de uitkomst
      van deze vermenigvuldigingen bij elkaar wordt opgeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: 6.3.1
    text: |-
      Het Rijk verstrekt de bekostiging, bedoeld in de [artikelen 5.4][ref1] en [5.5 van de wet][ref2], met ingang van de
      eerste schooldag van een school waarvan het bekostigd onderwijs op grond [hoofdstuk 4 van de wet][ref3] een aanvang
      neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0044212
        hoofdstuk: '4'
  - number: 6.3.2
    text: |-
      Onze Minister kan op verzoek van het bevoegd gezag een door hem te bepalen deel van de bekostiging, bedoeld
      in de [artikelen 5.4][ref1] en [5.5 van de wet][ref2], verstrekken gedurende een periode van ten hoogste
      vier maanden voorafgaand aan de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van
      [hoofdstuk 4 van de wet][ref3] een aanvang neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0044212
        hoofdstuk: '4'
  - number: 6.3.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gesteld over de wijze waarop de bekostiging wordt vastgesteld
      en verstrekt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.3
  - number: 6.4.1
    text: |-
      Onze Minister brengt op de bekostiging, bedoeld in [artikel 5.32 van de wet ][ref1]voor een school voor een
      kalenderjaar een bedrag in mindering volgens de volgende formule: (PI/PL) x (A + B + C + D) In deze formule wordt
      verstaan onder: PI: de bekostiging, bedoeld in [artikel 5.4 van de wet][ref2] van de desbetreffende school voor het
      desbetreffende kalenderjaar; PL: de bekostiging, bedoeld in [artikel 5.4 van de wet][ref3], van alle scholen voor
      het desbetreffende kalenderjaar; A: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen
      personeel van de scholen voortvloeiend uit een ontslag dat is geëffectueerd voor 1 augustus 1995; B: de kosten
      van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de scholen voortvloeiend uit een
      ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari 2007 en waarvoor de rechtspersoon,
      bedoeld in [artikel 98b van de Wet op het voortgezet onderwijs][ref4], zoals luidend op 31 december 2006, heeft
      ingestemd op grond van [artikel 96o, derde lid, tweede volzin, van de Wet op het voortgezet onderwijs][ref5],
      zoals luidend op 31 december 2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze
      uitkeringen; C: een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in
      het desbetreffende kalenderjaar voor gewezen personeel van de scholen voortvloeiend uit een ontslag dat is
      geëffectueerd op of na 1 januari 2007, waarbij ten aanzien van de verschillende soorten uitkeringen verschillende
      percentages kunnen worden vastgesteld; D: de kosten van de uitkeringen in het desbetreffende kalenderjaar
      voor gewezen personeel van een school die de taken beëindigt, anders dan op grond van een samenvoeging, een
      bestuursoverdracht als bedoeld in [artikel 3.33 van de wet][ref6], of een splitsing, indien het bevoegd gezag van
      deze school niet tevens een andere school onder zijn bestuur heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
      [ref6]: https://wetten.overheid.nl/BWBR0044212#Artikel3
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 98b
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 96o
      - id: ref6
        bwb_id: BWBR0044212
        artikel: '3'
  - number: 6.4.2
    text: |-
      Onze Minister brengt tevens op de bekostiging van een school of samenwerkingsverband voor het in het eerste lid
      bedoelde kalenderjaar in mindering:
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: 6.4.2.a
    text: |-
      de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de desbetreffende
      school voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari
      2007 en waarvoor de rechtspersoon, bedoeld in [artikel 98b van de Wet op het voortgezet onderwijs][ref1],
      zoals luidend op 31 december 2006, niet heeft ingestemd op grond van
      [artikel 96o, derde lid, tweede volzin, van de Wet op het voortgezet onderwijs][ref2], zoals luidend op 31 december
      2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel96o
