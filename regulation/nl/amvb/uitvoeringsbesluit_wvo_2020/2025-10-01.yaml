    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.25
  - number: 2.25.1.h
    text: het profiel horeca, bakkerij en recreatie; het profielvak horeca, bakkerij en recreatie;
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.25
