  - number: 2.23.2
    text: |-
      Indien het gaat om een leerling in de basisberoepsgerichte leerweg, kan het bevoegd gezag de leerling ook in
      de gelegenheid stellen om in plaats van de vakken van het gemeenschappelijk deel of het profieldeel van de
      basisberoepsgerichte leerweg, genoemd in de [artikelen 2.20][ref1] en [2.21][ref2], van de vakken die in de plaats
      komen van een tweede moderne vreemde taal of van de beroepsgerichte keuzevakken, de overeenkomstige vakken van de
      kaderberoepsgerichte leerweg te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel2.23
