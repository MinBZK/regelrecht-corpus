    text: |-
      een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in het desbetreffende
      kalenderjaar voor gewezen personeel van de desbetreffende school of samenwerkingsverband voortvloeiend uit een
      ontslag dat is geëffectueerd op of na 1 januari 2007, waarbij het percentage bedoeld in het eerste lid, onder c, en
      het in dit onderdeel bedoelde percentage samen 100 bedraagt.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: 6.4.3
    text: |-
      De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op hele
      eurocenten.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: 6.4.4
    text: |-
      Indien een school is opgeheven, wordt het desbetreffende bevoegd gezag belast indien deze nog ten minste één andere
      school onder zijn bestuur heeft.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: 6.4.5
    text: |-
      Over het moment en de wijze van in mindering brengen, bedoeld in het eerste en tweede lid, kunnen bij ministeriële
      regeling nadere voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: 6.4.6
    text: Het tweede lid is niet van toepassing op een school binnen een verticale scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.4
  - number: '6.5'
    text: |-
      In afwijking van [artikel 6.1, tweede lid][ref1], wordt er voor een school of scholengemeenschap die deel
      uitmaakt van een verticale scholengemeenschap in het bedrag per vestiging geen onderscheid gemaakt tussen de
      hoofdvestiging en een nevenvestiging. De hoofdvestiging van de school of scholengemeenschap die voldoet aan
      [artikel 6.1, eerste lid][ref2], komt in aanmerking voor het op grond van [artikel 6.1, tweede lid][ref3],
      vastgestelde bedrag voor een nevenvestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel6
