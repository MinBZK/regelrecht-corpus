        bwb_id: BWBR0045787
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.11.2
    text: |-
      Onze Minister kan op de in [artikel 6.2, eerste lid][ref1], bedoelde bekostiging de verwachte bedragen als bedoeld
      in [artikel 5.34, vijfde lid, van de wet][ref2] in mindering brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0045787/2025-10-01#Artikel6.11
    references:
