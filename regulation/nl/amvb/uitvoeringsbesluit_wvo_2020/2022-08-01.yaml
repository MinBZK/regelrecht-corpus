        bwb_id: BWBR0045787
        artikel: '2.52'
        hoofdstuk: '2'
        paragraaf: '10'
  - number: '2.54'
    text: |-
      1 Indien recente ontwikkelingen, een eigen analyse of signalen uit het veld daartoe aanleiding geven, kan de
      inspecteur-generaal van het onderwijs Onze Minister een voorstel doen voor het vaststellen van een nieuwe indicator
      voor de beoordeling van de leerresultaten of het aanpassen van een indicator.

      2 Over een voornemen tot een voorstel als bedoeld in het eerste lid overlegt de inspecteur-generaal met de daarvoor
      in aanmerking komende organisaties uit het onderwijsveld.

      3 De inspecteur-generaal legt het voorstel voor aan Onze Minister met vermelding van de wijze waarop het voorstel
      rekening houdt met de reacties van de geraadpleegde organisaties uit het onderwijsveld.

      4 Onze Minister beslist op basis van het voorstel of een voorstel van wet of ontwerp algemene maatregel van bestuur
      wordt voorbereid.

      5 De wijze van meting en de aanpassing van de wijze van meting in het kader van toepassing van de indicatoren,
      alsmede de normering en de aanpassing van de normering, stelt Onze Minister vast op voorstel van de inspecteur-
      generaal van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.54
  - number: '2.55'
    text: |-
      Het instrument ter monitoring van de veiligheid van leerlingen, bedoeld in
      [artikel 3.40, eerste lid, onderdeel b, van de wet][ref1]:

      a. geeft inzicht in de ervaren en feitelijke veiligheid en het welbevinden van de leerlingen, voor zover dat
      verband houdt met de veiligheid, op school;

      b. wordt ten minste eens per schooljaar afgenomen onder een representatief deel van de leerlingen; en

      c. is gestandaardiseerd, valide en betrouwbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel3.40
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '3.40'
  - number: '2.56'
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in [artikel 2.100 van de wet][ref1] omvat in elk geval:

      a. het doel van de samenwerking;

      b. de doelgroep;

      c. de wijze waarop wordt nagegaan of het doel wordt bereikt;

      d. het onderwijsprogramma dat volgens de samenwerking wordt vormgegeven;

      e. bij overdracht van een deel van de bekostiging met toepassing van [artikel 5.39, zevende lid, van de wet][ref2],
      de omvang en de bestemming van de over te dragen middelen;

      f. de wijze waarop de school geregeld contact onderhoudt met de leerlingen die aan die school zijn ingeschreven; en

      g. een regeling voor de beslechting van geschillen tussen partijen over de uitvoering van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.100
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5.39
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.56
