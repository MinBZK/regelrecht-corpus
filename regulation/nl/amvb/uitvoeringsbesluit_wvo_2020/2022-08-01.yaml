      1 Het Rijk verstrekt de bekostiging, bedoeld in de [artikelen 5.4][ref1] en [5.5 van de wet][ref2], met ingang
      van de eerste schooldag van een school waarvan het bekostigd onderwijs op grond [hoofdstuk 4 van de wet][ref3] een
      aanvang neemt.

      2 Onze Minister kan op verzoek van het bevoegd gezag een door hem te bepalen deel van de bekostiging, bedoeld
      in de [artikelen 5.4][ref4] en [5.5 van de wet][ref5], verstrekken gedurende een periode van ten hoogste
      vier maanden voorafgaand aan de eerste schooldag van een school waarvan het bekostigd onderwijs op grond van
      [hoofdstuk 4 van de wet][ref6] een aanvang neemt.

      3 Bij ministeriële regeling kunnen voorschriften worden gesteld over de wijze waarop de bekostiging wordt
      vastgesteld en verstrekt.


