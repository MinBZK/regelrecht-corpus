  - number: '4.37'
    text: |-
      1 Het college stelt bij zijn beslissing op een bezwaarschrift tegen een maatregel als bedoeld in
      [artikel 4.36][ref1] zo nodig vast op welke wijze de examenkandidaat alsnog in de gelegenheid zal worden gesteld
      het staatsexamen geheel of gedeeltelijk af te leggen of opnieuw af te leggen.

      2 Het college zendt zijn beslissing op het bezwaar in afschrift aan de wettelijke vertegenwoordigers indien de
      examenkandidaat minderjarig is en aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.36
