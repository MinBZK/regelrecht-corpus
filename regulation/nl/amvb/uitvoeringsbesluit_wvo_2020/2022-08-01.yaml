  - number: '2.58'
    text: |-
      Bij een samenwerking op grond van [artikel 2.99, eerste lid, aanhef en onderdeel a, van de wet][ref1] met een
      andere school wordt ten minste een deel van het onderwijs in de bovenbouw op de eigen school gegeven, met dien
      verstande dat:

      a. als het gaat om een school voor vwo of een school voor havo, het onderwijs op de eigen school gegeven wordt in
      ten minste een van de profielen, bedoeld in [artikel 2.20, derde lid, van de wet][ref2];

      b. als het gaat om een school voor mavo, het onderwijs op de eigen school gegeven wordt in ten minste een van de
      profielen, bedoeld in [artikel 2.25, tweede lid, van de wet][ref3];

      c. als het gaat om een school voor vbo, het onderwijs op de eigen school gegeven wordt in ten minste een van de
      profielen bedoeld in [artikel 2.26, tweede lid, van de wet][ref4];

      d. als het gaat om onderwijs in de gemengde leerweg aan een school voor mavo of aan een school voor
      vbo, het onderwijs op de eigen school gegeven wordt in ten minste een van de profielen, bedoeld in
      [artikel 2.27, tweede lid van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.99
