  - number: '2.32'
    text: |-
      1 De leerling van een school voor mavo of vbo die in het bezit is van een diploma vmbo in een andere leerweg dan
      de leerweg van zijn inschrijving, en die met toepassing van de [artikelen 2.18][ref1], [2.23][ref2] of [2.27][ref3]
      in plaats van een vak voor de leerweg waarin hij eindexamen heeft afgelegd, examen heeft afgelegd in een
      overeenkomstig vak voor een andere leerweg, voor havo of voor vwo, of als extra vak, is vrijgesteld van het volgen
      van onderwijs in dat vak.

      2 Dit artikel is ook van toepassing op een leerling die in een hoger leerjaar voor de eerste maal in Nederland tot
      een school is toegelaten.


