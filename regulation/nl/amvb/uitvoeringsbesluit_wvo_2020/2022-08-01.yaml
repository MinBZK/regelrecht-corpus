        artikel: '3.35'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.42'
    text: |-
      Bij het eindexamen vwo en het eindexamen havo geldt voor de vermelding op de cijferlijst van vakken waarvoor de
      examenkandidaat bij het eindexamen vrijstelling is verleend het volgende:

      a. het vak maatschappijleer waarvoor de examenkandidaat bij het eindexamen vwo is vrijgesteld op grond van het
      bezit van een diploma havo, wordt niet vermeld op de cijferlijst;

      b. vakken waarvoor de examenkandidaat bij het eindexamen vwo is vrijgesteld op grond van een eerder afgelegd
      eindexamen havo of eindexamen vmbo waarvan deze vwo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met
      vermelding van het eerder behaalde cijfer;

      c. vakken waarvoor de examenkandidaat bij het eindexamen havo is vrijgesteld op grond van een eerder afgelegd
      eindexamen vmbo waarvan deze havo-vakken deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het
      eerder behaalde cijfer; en

      d. andere vakken waarvoor de examenkandidaat vrijstelling is verleend, worden vermeld op de cijferlijst, zonder
      vermelding van een cijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.42
  - number: '3.43'
    text: |-
      Bij het eindexamen vmbo geldt voor de vermelding op de cijferlijst van vakken waarvoor de examenkandidaat bij het
      eindexamen vrijstelling is verleend het volgende:

      a. vakken waarvoor de examenkandidaat bij het eindexamen vmbo theoretische leerweg is vrijgesteld op grond van
      een eerder afgelegd eindexamen vmbo kaderberoepsgerichte leerweg of de basisberoepsgerichte leerweg waarvan deze
      vakken van de theoretische leerweg deel uitmaakten, worden vermeld op de cijferlijst, met vermelding van het eerder
      behaalde cijfer;

      b. de extra vakken die op grond van [artikel 3.4, vierde lid][ref1], bij het eindexamen vmbo theoretische leerweg
      zijn gekozen worden vermeld op de cijferlijst, met vermelding van het daarvoor behaalde cijfer;

      c. andere vakken waarvoor de examenkandidaat vrijstelling is verleend, worden vermeld op de cijferlijst, zonder
      vermelding van een cijfer.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.4
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.43
