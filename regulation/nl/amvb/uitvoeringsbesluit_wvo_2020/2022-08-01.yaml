  - number: '3.31'
    text: |-
      1 Het bevoegd gezag bewaart het gemaakte werk van het centraal examen van de examenkandidaat gedurende ten minste
      zes maanden na de vaststelling van de uitslag, ter inzage voor belanghebbenden.

      2 Het bevoegd gezag draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven
      gedurende ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van de school.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.31
  - number: '3.32'
    text: |-
      1 Het eindcijfer voor vakken van het eindexamen wordt uitgedrukt in een geheel cijfer uit de reeks 1 tot en met 10.

      2 De rector of directeur bepaalt het eindcijfer op het rekenkundig gemiddelde van het cijfer voor het schoolexamen
      en het cijfer voor het centraal examen. Indien de uitkomst van de berekening niet een geheel getal is, wordt dat
      getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5
      of hoger is, naar boven afgerond.

      3 Indien in een vak alleen een schoolexamen is afgenomen en niet ook een centraal examen, is het cijfer voor het
      schoolexamen ook het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.32
  - number: '3.33'
    text: |-
      1 De rector of directeur stelt voor de vaststelling van de uitslag van het eindexamen vast of de
      examenkandidaat het eindexamen heeft afgelegd in de voor het eindexamen voorgeschreven vakken, bedoeld in de
      [artikelen 3.1 tot en met 3.7][ref1].

      2 De examenkandidaat toont in voorkomend geval ten genoegen van de rector of directeur aan dat hij recht heeft op
      een vrijstelling op grond van [artikel 3.8][ref2].

      3 Indien dat nodig is om de examenkandidaat te laten slagen betrekken de rector of directeur en de examensecretaris
      een of meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken
      dienen een eindexamen te vormen.

      4 Indien de examenkandidaat eindexamen heeft afgelegd en in datzelfde jaar deelstaatsexamen heeft afgelegd of
      eindexamen in een of meer vakken aan een instelling voor educatie en beroepsonderwijs, betrekken de rector of
      directeur en de examensecretaris de met het deelstaatsexamen respectievelijk dat eindexamen behaalde cijfers,
      indien de examenkandidaat daarom tijdig en schriftelijk heeft verzocht, bij de uitslagbepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.8
