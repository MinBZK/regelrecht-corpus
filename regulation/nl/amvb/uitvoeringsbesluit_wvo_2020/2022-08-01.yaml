        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.36'
    text: |-
      1 Indien een leerling overeenkomstig [artikel 2.56, vierde lid, van de wet][ref1] in een of meer vakken eindexamen
      heeft afgelegd in het voorlaatste of direct daaraan voorafgaande leerjaar, maakt de rector of directeur het
      eindcijfer van dit eindexamen schriftelijk aan de examenkandidaat bekend zodra deze is vastgesteld, onder
      mededeling van het recht van herkansing, bedoeld in [artikel 3.38][ref2].

      2 Indien een leerling als bedoeld in het eerste lid niet is bevorderd tot het volgende leerjaar, vervallen de met
      dit centraal examen of deze centrale examens behaalde resultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.38
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.36
    references:
