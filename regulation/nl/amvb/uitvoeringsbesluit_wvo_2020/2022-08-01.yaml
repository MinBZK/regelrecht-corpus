  - number: '4.34'
    text: |-
      1 Het college kan toestaan dat een examenkandidaat op grond van zijn handicap of ziekte het staatsexamen geheel of
      gedeeltelijk aflegt op een wijze die is aangepast aan de mogelijkheden van die examenkandidaat.

      2 Het college bepaalt de wijze waarop het staatsexamen door de examenkandidaat wordt afgelegd, met dien verstande
      dat aan de overige bepalingen in dit besluit wordt voldaan.

      3 Tenzij sprake is van een objectief waarneembare lichamelijke handicap, geldt voor de aangepaste wijze van
      examineren, bedoeld in het eerste lid, dat:

      a. een deskundigenverklaring voorligt die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of
      psychiater is opgesteld;

      b. de aanpassing voor zover betrekking hebbend op het centraal examen in elk geval kan bestaan uit een verlenging
      van de duur van het centraal examen met ten hoogste 30 minuten; en

      c. een andere aanpassing slechts kan worden toegestaan voor zover daartoe in de onder a genoemde
      deskundigenverklaring over betrokkene een voorstel wordt gedaan of indien de aanpassing aantoonbaar aansluit bij de
      begeleidingsadviezen, vermeld in die deskundigenverklaring.

      4 Het college doet van elke afwijking op grond van dit artikel zo spoedig mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.34
  - number: '4.35'
    text: |-
      1 Het college kan toestaan dat voor examenkandidaat op grond van onvoldoende beheersing van de Nederlandse taal
      wordt afgeweken van de bij of krachtens dit besluit gestelde regels, indien de examenkandidaat met inbegrip van het
      jaar waarin hij staatsexamen of deelstaatsexamen aflegt, ten hoogste zes jaar onderwijs in Nederland heeft gevolgd
      en niet het Nederlands als moedertaal heeft.

      2 De afwijking, bedoeld in het eerste lid, kan betrekking hebben op:

      a. het vak Nederlandse taal en literatuur;

      b. enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.

      3 De afwijking, bedoeld in het eerste lid, bestaat voor het centraal examen uit een verlenging van de duur van
      het centraal examen met ten hoogste 30 minuten, en het verlenen van toestemming tot het gebruik van een verklarend
      woordenboek van de Nederlandse taal.

      4 Het college doet van elke afwijking op grond van dit artikel mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.35
  - number: '4.36'
    text: |-
      1 De maatregelen, bedoeld in [artikel 2.82, eerste lid, van de wet][ref1], die het college jegens een
      examenkandidaat kan nemen, zijn:

      a. het toekennen van het cijfer 1 voor een toets van het college-examen of het centraal examen;

      b. het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het college-examen of het
      centraal examen van dat vak;

      c. het ongeldig verklaren van een of meer toetsen van het al afgelegde deel van het college-examen of het centraal
      examen;

      d. minder vergaande maatregelen dan die, bedoeld onderdelen a tot en met c.

      2 De maatregelen kunnen afhankelijk van de aard van de onregelmatigheid afzonderlijk of in combinatie met elkaar
      genomen worden.

      3 De ontzegging, bedoeld in het eerste lid, onderdeel b, ten aanzien van een examenkandidaat die in meer dan een
      vak eindexamen aflegt, kan betrekking hebben op alle toetsen.

      4 Indien de onregelmatigheid pas wordt ontdekt na afloop van het examen, kan het college de examenkandidaat
      het diploma, bedoeld in [artikel 2.80, tweede lid, onderdeel a, van de wet][ref2], het certificaat, bedoeld in
      [artikel 2.80, tweede lid, onderdeel b, van de wet][ref3], of de cijferlijst onthouden, of kan bepalen dat aan de
      betrokken examenkandidaat dat diploma of certificaat, of die cijferlijst, alleen kunnen worden uitgereikt na een
      hernieuwd examen in de door het college aan te wijzen onderdelen en op de door deze te bepalen wijze.

      5 Het college zendt het besluit waarbij een maatregel als bedoeld in het eerste lid wordt genomen aan de
      examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.82
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.80
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.80
