  - number: '1.2'
    text: |-
      Dit besluit is ook van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, tenzij anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel1.2
  - number: '2.1'
    text: |-
      De kerndoelen voor de eerste twee leerjaren voortgezet onderwijs vwo, havo, mavo en vbo worden bepaald in
      [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.1
