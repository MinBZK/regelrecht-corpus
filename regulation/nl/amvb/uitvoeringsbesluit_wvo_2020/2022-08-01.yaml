  - number: '2.10'
    text: |-
      Het gemeenschappelijk deel van een profiel in havo omvat de volgende vakken, met de daarbij vermelde normatieve
      studielast, uitgedrukt in uren:

      a. Nederlandse taal en literatuur: 400;

      b. Engelse taal en literatuur: 360;

      c. maatschappijleer: 120;

      d. culturele en kunstzinnige vorming: 120; en

      e. lichamelijke opvoeding: 120.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Het profieldeel van het profiel natuur en techniek in havo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde B: 360;

      b. natuurkunde: 400;

      c. scheikunde: 320; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 320;

      2°. informatica: 320;

      3°. biologie: 400;

      4°. wiskunde D: 320.

      2 Het profieldeel van het profiel natuur en gezondheid in havo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 320, met dien verstande dat de leerling wiskunde A kan vervangen door wiskunde B, voor zover het
      bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt;

      b. biologie: 400;

      c. scheikunde: 320; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 320;

      2°. aardrijkskunde: 320;

      3°. natuurkunde: 400.

      3 Het profieldeel van het profiel economie en maatschappij in havo omvat de volgende vakken, met de daarbij
      vermelde normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 320, met dien verstande dat de leerling wiskunde A kan vervangen door wiskunde B, voor zover het
      bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt;

      b. economie: 400;

      c. geschiedenis: 320; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. bedrijfseconomie: 320;

      2°. aardrijkskunde: 320;

      3°. maatschappijwetenschappen: 320;

      4°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400.

      4 Het profieldeel van het profiel cultuur en maatschappij in havo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. geschiedenis: 320;

      b. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur,
      ter keuze van de leerling, voor zover het bevoegd gezag deze vakken aanbiedt: 400;

      c. een van de volgende culturele profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:

      1°. kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 320;

      2°. filosofie: 320;

      3°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, of Friese taal en cultuur:
      400; en

      d. een van de volgende maatschappelijke profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:

      1°. aardrijkskunde: 320;

      2°. maatschappijwetenschappen: 320;

      3°. economie: 400.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.11
  - number: '2.12'
    text: |-
      Het vrije deel van een profiel in havo omvat ter keuze van de leerling ten minste één vak uit het geheel van:

      a. de vakken, genoemd in de [artikelen 2.10][ref1] en [2.11][ref2], voor zover deze vakken niet al deel uitmaken
      van het profiel en het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt, met dien verstande dat:

      1°. binnen een profiel zijn toegestaan de combinatie van wiskunde A en wiskunde B, en dat wiskunde D uitsluitend
      kan worden gekozen indien wiskunde B al deel uitmaakt van het profiel;

      2°. kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek;

      3°. van de vakken tekenen, handvaardigheid en textiele vormgeving er één deel kan uitmaken van het profiel;

      b. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, voor zover het vak niet
      al eerder is gevolgd of al deel uitmaakt van het profiel en het bevoegd gezag deze vakken aanbiedt:

      1°. Spaanse taal en literatuur (elementair): 320;

      2°. Russische taal en literatuur (elementair): 320;

      3°. Italiaanse taal en literatuur (elementair): 320;

      4°. Arabische taal en literatuur (elementair): 320;

      5°. Turkse taal en literatuur (elementair): 320;

      c. de volgende vakken, met de daarbij vermelde normatieve studielast in uren:

      1°. kunst (algemeen): 120;

      2°. algemene natuurwetenschappen: 120;

      3°. bewegen, sport en maatschappij: 320;

      d. door het bevoegd gezag vast te stellen vakken en andere programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.12
    references:
