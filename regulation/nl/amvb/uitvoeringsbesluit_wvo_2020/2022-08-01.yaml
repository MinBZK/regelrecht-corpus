  - number: '6.4'
    text: |-
      1 Onze Minister brengt op de bekostiging, bedoeld in [artikel 5.32 van de wet ][ref1]voor een school voor een
      kalenderjaar een bedrag in mindering volgens de volgende formule:

      (PI/PL) x (A + B + C + D)

      In deze formule wordt verstaan onder:

      PI: de bekostiging, bedoeld in [artikel 5.4 van de wet][ref2] van de desbetreffende school voor het desbetreffende
      kalenderjaar;

      PL: de bekostiging, bedoeld in [artikel 5.4 van de wet][ref3], van alle scholen voor het desbetreffende
      kalenderjaar;

      A: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de scholen
      voortvloeiend uit een ontslag dat is geëffectueerd voor 1 augustus 1995;

      B: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van de scholen
      voortvloeiend uit een ontslag dat is geëffectueerd in de periode tussen 31 juli 1995 en 1 januari 2007
      en waarvoor de rechtspersoon, bedoeld in [artikel 98b van de Wet op het voortgezet onderwijs][ref4],
      zoals luidend op 31 december 2006, heeft ingestemd op grond van
      [artikel 96o, derde lid, tweede volzin, van de Wet op het voortgezet onderwijs][ref5], zoals luidend op 31 december
      2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen;

      C: een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in het desbetreffende
      kalenderjaar voor gewezen personeel van de scholen voortvloeiend uit een ontslag dat is geëffectueerd op of na
      1 januari 2007, waarbij ten aanzien van de verschillende soorten uitkeringen verschillende percentages kunnen
      worden vastgesteld;

      D: de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel van een school
      die de taken beëindigt, anders dan op grond van een samenvoeging, een bestuursoverdracht als bedoeld in
      [artikel 3.33 van de wet][ref6], of een splitsing, indien het bevoegd gezag van deze school niet tevens een andere
      school onder zijn bestuur heeft.

      2 Onze Minister brengt tevens op de bekostiging van een school of samenwerkingsverband voor het in het eerste lid
      bedoelde kalenderjaar in mindering:

      a. de kosten van de uitkeringen in het desbetreffende kalenderjaar voor gewezen personeel
      van de desbetreffende school voortvloeiend uit een ontslag dat is geëffectueerd in de
      periode tussen 31 juli 1995 en 1 januari 2007 en waarvoor de rechtspersoon, bedoeld in
      [artikel 98b van de Wet op het voortgezet onderwijs][ref7], zoals luidend op 31 december 2006, niet heeft ingestemd
      op grond van [artikel 96o, derde lid, tweede volzin, van de Wet op het voortgezet onderwijs][ref8], zoals luidend
      op 31 december 2006, met het ten laste van bedoelde rechtspersoon brengen van de kosten van deze uitkeringen; en

      b. een bij ministeriële regeling vast te stellen percentage van de kosten van de uitkeringen in het desbetreffende
      kalenderjaar voor gewezen personeel van de desbetreffende school of samenwerkingsverband voortvloeiend uit een
      ontslag dat is geëffectueerd op of na 1 januari 2007, waarbij het percentage bedoeld in het eerste lid, onder c, en
      het in dit onderdeel bedoelde percentage samen 100 bedraagt.

      3 De uitkomsten van de in het eerste en tweede lid bedoelde berekeningen worden rekenkundig afgerond op hele
      eurocenten.

      4 Indien een school is opgeheven, wordt het desbetreffende bevoegd gezag belast indien deze nog ten minste één
      andere school onder zijn bestuur heeft.

      5 Over het moment en de wijze van in mindering brengen, bedoeld in het eerste en tweede lid, kunnen bij
      ministeriële regeling nadere voorschriften worden gegeven.

      6 Het tweede lid is niet van toepassing op een school binnen een verticale scholengemeenschap.


