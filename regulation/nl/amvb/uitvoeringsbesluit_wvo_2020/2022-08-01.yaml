  - number: '6.28'
    text: |-
      Het bevoegd gezag doet binnen twee weken na een besluit tot opheffing van de school daarvan mededeling aan Onze
      Minister, gedeputeerde staten, de inspectie, en indien het een bijzondere school betreft, eveneens aan burgemeester
      en wethouders van de gemeente waarin de school is gelegen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.28
  - number: '6.29'
    text: |-
      1 Indien een school wordt opgeheven anders dan in verband met samenvoeging met een andere school of de aanspraak
      op bekostiging voor een school verloren gaat, stort het bevoegd gezag het exploitatie-overschot, bedoeld in
      [artikel 5.37 van de wet][ref1], terug in ’s Rijks kas. Het neemt daarbij het derde lid in acht.

      2 Het exploitatie-overschot is de som van:

      a. het bedrag van de bekostiging, bedoeld in [artikel 5.32 van de wet][ref2], verminderd met de lasten over dat
      jaar voor zover deze als rechtmatig kunnen worden aangemerkt;

      b. de reserveringen voor zover afkomstig uit ’s Rijks kas, met inbegrip van de ontvangen rentebaten; en

      c. voor zover het gaat om een bijzondere school, de niet bestede gedeelten van de uitkeringen op grond van de
      voorschriften inzake de gemeentelijke overschrijding.

      3 Indien het exploitatie-overschot van een bijzondere school ook is opgebouwd uit uitkeringen als bedoeld in het
      tweede lid, onderdeel c, geldt als maatstaf voor de verdeling van dat deel van het exploitatie-overschot tussen
      het Rijk en de gemeente de verhouding tussen het ontvangen bedrag aan bekostiging van het Rijk en het ontvangen
      bedrag aan overschrijdingsuitkeringen van de gemeente in een periode van vijf jaren, voorafgaand aan het jaar van
      de beëindiging van de bekostiging. De verdeling behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.37
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5.32
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5.37'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5.32'
  - number: '6.30'
    text: |-
      1 Het samenwerkingsverband neemt in het ondersteuningsplan een datum op wanneer wordt vastgesteld
      of sprake is van een meer dan gemiddelde toename van het aantal ingeschreven leerlingen, bedoeld in
      [artikel 2.47, negende lid, onderdeel g, van de wet][ref1]. Deze vaststelling vindt in ieder geval plaats in de
      periode tussen 1 februari en 1 juni.

      2 Indien een meer dan gemiddelde toename, bedoeld in het eerste lid, wordt vastgesteld, draagt het
      samenwerkingsverband voor het aantal leerlingen dat na 1 februari toelaatbaar is verklaard tot het voortgezet
      speciaal onderwijs per leerling een bedrag over aan de school waar de leerling is ingeschreven.

      3 Het bedrag, bedoeld in het tweede lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en wordt bij ministeriële regeling vastgesteld.

      4 De overdracht, bedoeld in het tweede lid, heeft betrekking op het kalenderjaar dat volgt op de teldatum.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.47
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.47'
  - number: '6.32'
    text: |-
      [Paragraaf 4][ref1] is van overeenkomstige toepassing op een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0045787
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '8.1'
    text: |-
      1 De gevallen, bedoeld in [artikel 8.5, eerste lid, aanhef en onderdeel c, van de wet][ref1], waarin het bevoegd
      gezag een kandidaat-leerling mag toelaten die afkomstig is van een andere school, zijn opgenomen in het tweede tot
      en met vierde lid van dit artikel.

      2 Het bevoegd gezag van een school voor vwo of voor havo kan tot het eerste leerjaar van die school toelaten:

      a. de kandidaat-leerling die tot het eerste leerjaar van een andere school voor vwo of voor havo is toegelaten; of

      b. de kandidaat-leerling die het eerste leerjaar van een school voor mavo gedeeltelijk heeft doorlopen, indien de
      studieresultaten naar het oordeel van het bevoegd gezag aanleiding geven tot toelating tot vwo of havo.

      3 Het bevoegd gezag van een school voor mavo kan tot het eerste leerjaar van die school toelaten:

      a. de kandidaat-leerling die tot het eerste leerjaar van een andere school voor mavo of tot het eerste leerjaar van
      een school voor vwo of voor havo is toegelaten; of

      b. de kandidaat-leerling die het eerste leerjaar van een school voor vbo gedeeltelijk heeft doorlopen, indien de
      studieresultaten naar het oordeel van het bevoegd gezag aanleiding geven tot toelating tot mavo.

      4 Het bevoegd gezag van een school voor vbo kan tot het eerste leerjaar van die school toelaten de kandidaat-
      leerling die tot het eerste leerjaar van een andere school is toegelaten, ongeacht de schoolsoort.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.5
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8.5'
  - number: '8.2'
    text: |-
      1 Het bevoegd gezag kan zijn bevoegdheid, bedoeld in [artikel 8.6, eerste lid, van de wet][ref1], om te beslissen
      over de toelating van een leerling tot de school, onder zijn verantwoordelijkheid laten uitoefenen door een door
      hem in te stellen toelatingscommissie.

      2 Het bevoegd gezag stelt regels over de omvang, samenstelling en werkzaamheden van de toelatingscommissie en kan
      nadere regels stellen over de bevoegdheidsuitoefening van de toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.6
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8.6'
  - number: '8.3'
    text: |-
      1 Indien voor een kandidaat-leerling geen schooladvies als bedoeld in [artikel 8.6, tweede lid, van de wet][ref1]
      is vastgesteld, baseert het bevoegd gezag zijn beslissing over de toelating tot het eerste leerjaar op de centrale
      eindtoets of andere eindtoets als bedoeld in [artikel 9b WPO][ref2] of [artikel 18b WEC][ref3]. Indien de leerling
      geen centrale eindtoets heeft afgelegd, baseert het bevoegd gezag zijn beslissing tot toelating op een onderzoek
      naar de geschiktheid van de kandidaat-leerling.

      2 Het bevoegd gezag van een school met een bijzondere inrichting waarvoor specifieke kennis of vaardigheden van
      de kandidaat-leerling noodzakelijk zijn, kan een onderzoek naar die specifieke kennis of vaardigheden bij de
      kandidaat-leerling afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.6
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel18b
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '8.6'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: 9b
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 18b
  - number: '8.4'
    text: |-
      Het bevoegd gezag stelt een procedure op voor de toelating van leerlingen tot het eerste leerjaar en zendt de
      procedure aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.4
  - number: '8.5'
    text: |-
      Het bevoegd gezag stelt jaarlijks een verslag op over de middelen die het heeft toegepast voor de toelating van
      leerlingen tot het eerste leerjaar en over de daarmee opgedane ervaringen en zendt het verslag jaarlijks binnen zes
      maanden na de toelating aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.5
  - number: '8.6'
    text: |-
      Het bevoegd gezag stelt de directeur van de basisschool, de speciale school voor basisonderwijs, de school voor
      speciaal onderwijs, de school voor voortgezet speciaal onderwijs of de school of instelling voor speciaal en
      voortgezet speciaal onderwijs in kennis van:

      a. de beslissing over de toelating; en

      b. indien de directeur dit verzoekt, de studieresultaten van de leerling na afloop van het eerste leerjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.6
  - number: '8.7'
    text: |-
      Bij toelating plaatst het bevoegd gezag de leerling, die van een gelijksoortige school afkomstig is, in het
      leerjaar waarin die leerling op die andere school onderwijs had mogen volgen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Het bevoegd gezag vermeldt een voorwaardelijke bevordering op het eindrapport.

      2 Het bevoegd gezag doet ook schriftelijk mededeling van de voorwaardelijke bevordering aan de ouders van de
      betrokken leerling, waarbij worden vermeld:

      a. de datum tussen 1 oktober en 1 januari daaropvolgend waarop definitief over de overgang zal worden beslist; en

      b. de voorwaarden voor bevordering.

      3 Bevordering tot het hoogste leerjaar gebeurt niet voorwaardelijk.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.8
  - number: '8.9'
    text: |-
      1 Een leerling die in het bezit is van een diploma vmbo in de theoretische leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:

      a. de vakken, genoemd in [artikel 2.16][ref1];

      b. de vakken, genoemd in [artikel 2.17, onderdeel b][ref2];

      c. de vakken, genoemd in [artikelen 2.6][ref3] en [2.7][ref4], met uitzondering van de vakken genoemd in
      [artikel 2.7, onderdeel c, subonderdelen 1° en 2°, en onderdeel d][ref5]; of

      d. de vakken, genoemd in [artikelen 2.11][ref6] en [2.12][ref7], met uitzondering van de vakken, genoemd in
      [artikel 2.12, onderdeel c, subonderdelen 1° en 2°, en onderdeel d][ref8].

      2 Een leerling die in het bezit is van een diploma vmbo in de gemengde leerweg kan de toelating tot het vierde
      leerjaar van een school voor havo worden geweigerd, indien het eindexamen dat heeft geleid tot zijn diploma geen
      van de volgende vakken als extra vak omvat:

      a. de vakken, genoemd in [artikel 2.25, tweede lid][ref9];

      b. de vakken, genoemd in [artikel 2.26, onderdeel c][ref10]; of

      c. de vakken, bedoeld in het eerste lid, onderdelen c en d.


