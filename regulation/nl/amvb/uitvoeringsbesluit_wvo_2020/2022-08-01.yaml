      1 Het eindexamen vwo (atheneum) omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van een profiel, genoemd in [artikel 2.5, eerste lid][ref1];

      b. de vakken van het profieldeel, genoemd in [artikel 2.6][ref2]; en

      c. ten minste een vak met een normatieve studielast van ten minste 440 uren van het vrije deel van een profiel,
      genoemd in [artikel 2.7][ref3], met dien verstande dat een door het bevoegd gezag vast te stellen vak alleen
      onderdeel is van het eindexamen voor zover Onze Minister daarvoor goedkeuring heeft verleend.

      2 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen vwo (atheneum) ter keuze van de examenkandidaat
      extra vakken omvatten, voor zover het bevoegd gezag hem dat toestaat en het vak niet inhoudelijk overeenkomt met
      een vak dat al onderdeel is van dat eindexamen.

      3 Het profielwerkstuk van het eindexamen vwo (atheneum) heeft betrekking op een of meer vakken van het eindexamen.
      Ten minste een van deze aan het profielwerkstuk gekoppelde vakken heeft een omvang van 400 uur of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
