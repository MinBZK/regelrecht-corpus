  - number: '3.68'
    text: |-
      1 Het bevoegd gezag kan de examenkandidaat die het eindexamen atheneum aflegt aan een instelling voor educatie
      en beroepsonderwijs bij het eindexamen ontheffing verlenen voor een tweede moderne vreemde taal, genoemd in
      [artikel 2.5, eerste lid, onderdeel c][ref1], indien de leerling:

      a. een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die effect heeft
      op taal;

      b. een andere moedertaal heeft dan de Nederlandse taal; of

      c. onderwijs volgt in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs in de
      taal verhindert naar verwachting dat de opleiding met goed gevolg wordt afgerond.

      2 In geval van een ontheffing als bedoeld in het eerste lid wordt het eindexamen in de taal vervangen door het
      eindexamen in een van de vakken, genoemd in [artikel 2.6][ref2] of in [artikel 2.7, onderdeel c][ref3], met een
      normatieve studielast van ten minste 440 uren, naar keuze van de examenkandidaat, voor zover het bevoegd gezag deze
      als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2.7
