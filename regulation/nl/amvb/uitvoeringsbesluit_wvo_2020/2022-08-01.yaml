  - number: '2.68'
    text: |-
      1 De gegevens, bedoeld in [artikel 2.111 van de wet][ref1], waarover een bevoegd gezag of een samenwerkingsverband
      beschikt voor het beleid van Onze Minister, worden gedefinieerd en geordend volgens de regels vermeld in
      [bijlage 2][ref2].

      2 Bij ministeriële regeling worden nadere regels gesteld over de gegevens, bedoeld in het eerste lid, en over de
      wijze waarop de gegevens beschikbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.111
