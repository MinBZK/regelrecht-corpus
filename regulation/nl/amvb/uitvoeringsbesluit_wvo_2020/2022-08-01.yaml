  - number: '3.49'
    text: |-
      1 De rector of directeur verstrekt een voorlopige cijferlijst aan de examenkandidaat:

      a. die:

      1°. in het voorlaatste of direct daaraan voorafgaande leerjaar een centraal examen of een afsluitend schoolexamen
      in een of meer vakken heeft afgelegd, voor zover de cijfers niet op grond van [artikel 3.36, tweede lid][ref1],
      zijn vervallen; of

      2°. het gespreid centraal examen, bedoeld in [artikel 3.56][ref2], aflegt; en

      b. die vervolgens de school verlaat zonder het eindexamen te voltooien.

      2 Op de voorlopige cijferlijst worden vermeld:

      a. het vak of de vakken waarin de examenkandidaat centraal examen of een afsluitend schoolexamen heeft afgelegd;

      b. het cijfer van het schoolexamen;

      c. het cijfer van het centraal examen;

      d. het eindcijfer voor het vak;

      e. de aantekening of gebruik is gemaakt van het recht van herkansing, bedoeld in [artikel 3.38][ref3].

      3 Bij ministeriële regeling wordt het model voor de voorlopige cijferlijst vastgesteld.

      4 De examenkandidaat kan geen rechten meer ontlenen aan de voorlopige cijferlijst met ingang van het moment waarop
      aan de examenkandidaat een cijferlijst als bedoeld in [artikel 2.58, eerste lid, van de wet][ref4] is uitgereikt
      die in ieder geval de eindcijfers van de voorlopige cijferlijst omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.36
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.56
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.38
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
