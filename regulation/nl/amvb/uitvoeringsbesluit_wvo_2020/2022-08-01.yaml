  - number: '3.52'
    text: |-
      Het bevoegd gezag van een school voor vbo kan een leerling in de basisberoepsgerichte leerweg, de
      kaderberoepsgerichte leerweg of de gemengde leerweg die is ingeschreven aan een school voor voortgezet speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs in de gelegenheid stellen als extraneus het
      eindexamen af te leggen in een of meer profielvakken of beroepsgerichte keuzevakken van die leerwegen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.52
  - number: '3.53'
    text: |-
      1 Een extraneus is aan het bevoegd gezag een financiële bijdrage verschuldigd van € 720 voor het afleggen van een
      eindexamen.

      2 De financiële bijdrage voor het afleggen van een eindexamen is niet verschuldigd door de extraneus die is
      ingeschreven bij een andere uit ’s Rijks kas bekostigde school, afdeling of onderwijsinstelling en die aldaar geen
      eindexamen of geen eindexamen in alle vakken aflegt.

      3 Bij ministeriële regeling kan het bedrag, bedoeld in het eerste lid, worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.

      4 In afwijking van het eerste lid bedraagt de financiële bijdrage, bedoeld in het eerste lid, in 2022 € 685.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.53
  - number: '3.54'
    text: |-
      1 De rector of directeur kan toestaan dat een examenkandidaat op grond van zijn handicap of ziekte het eindexamen
      geheel of gedeeltelijk aflegt op een wijze die is aangepast aan de mogelijkheden van die examenkandidaat.

      2 De rector of directeur bepaalt de wijze waarop het eindexamen door de examenkandidaat vanwege zijn handicap of
      ziekte wordt afgelegd, met dien verstande dat aan de overige bepalingen van dit besluit wordt voldaan.

      3 Tenzij sprake is van een objectief waarneembare lichamelijke handicap of ziekte, geldt voor de aangepaste wijze
      van examineren, bedoeld in het eerste lid, dat:

      a. er een deskundigenverklaring is die door een ter zake kundige psycholoog, orthopedagoog, neuroloog of psychiater
      is opgesteld;

      b. de aanpassing voor zover betrekking hebbend op het centraal examen in elk geval kan bestaan uit een verlenging
      van de duur van de toets van het centraal examen met ten hoogste 30 minuten; en

      c. een andere aanpassing kan worden toegestaan voor zover daartoe in de onderdeel a genoemde deskundigenverklaring
      over betrokkene een voorstel wordt gedaan of indien de aanpassing aantoonbaar aansluit bij de begeleidingsadviezen,
      vermeld in die deskundigenverklaring.

      4 De rector of directeur doet van de wijze waarop het examen ingevolge dit artikel wordt afgelegd zo spoedig
      mogelijk mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.54
  - number: '3.55'
    text: |-
      1 Het bevoegd gezag kan toestaan dat voor een examenkandidaat op grond van onvoldoende beheersing van de
      Nederlandse taal wordt afgeweken van dit besluit, indien deze examenkandidaat met inbegrip van het schooljaar
      waarin hij eindexamen aflegt, ten hoogste zes jaar onderwijs in Nederland heeft gevolgd en het Nederlands niet de
      moedertaal is.

      2 De afwijking, bedoeld in het eerste lid, kan betrekking hebben op:

      a. het vak Nederlandse taal en literatuur;

      b. het vak Nederlandse taal; of

      c. enig ander vak waarbij het gebruik van de Nederlandse taal van overwegende betekenis is.

      3 De afwijking bestaat voor zover betrekking hebbend op het centraal examen uit een verlenging van de duur van
      het centraal examen met ten hoogste 30 minuten en het verlenen van toestemming tot het gebruik van een verklarend
      woordenboek van de Nederlandse taal.

      4 De rector of directeur doet van elke afwijking ingevolge dit artikel mededeling aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.55
  - number: '3.56'
    text: |-
      1 Het bevoegd gezag kan, de inspectie gehoord, toestaan dat een examenkandidaat die in het laatste leerjaar
      langdurig ziek is of die lange tijd ten gevolge van een bijzondere, van zijn wil onafhankelijke, omstandigheid niet
      in staat is geweest het onderwijs in alle eindexamenvakken gedurende het laatste leerjaar te volgen, het centraal
      examen en in voorkomend geval het schoolexamen, voor een deel van de vakken in het ene schooljaar en voor het
      andere deel in het daarop volgende schooljaar aflegt. In dat geval wordt het eindexamen in een vak in het eerste of
      in het tweede van deze schooljaren afgesloten.

      2 Het bevoegd gezag geeft de toestemming, bedoeld in het eerste lid, uiterlijk voor de aanvang van het eerste
      tijdvak van het centraal examen. In bijzondere gevallen kan het bevoegd gezag afwijken van de eerste volzin voor
      een examenkandidaat die nog niet in alle betrokken eindexamenvakken centraal examen heeft afgelegd.

      3 De examenkandidaat heeft het recht van herkansing, bedoeld in [artikel 3.38][ref1], in het eerste en in het
      tweede schooljaar van het gespreid centraal examen, met dien verstande dat het recht van herkansing in het eerste
      schooljaar ontstaat nadat de eindcijfers van de vakken waarvoor in het eerste schooljaar het centraal examen is
      afgesloten, voor de eerste maal zijn vastgesteld.

      4 De rector of directeur en de examensecretaris stellen op verzoek van de examenkandidaat de uitslag van
      het eindexamen vast aan het einde van het eerste schooljaar van het gespreid centraal examen of het gespreid
      schoolexamen, met overeenkomstige toepassing van [artikel 3.34][ref2] of [artikel 3.35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.38
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.56
