  - number: '9.25'
    text: |-
      1 De bekostiging, bedoeld in [artikel 11.56 van de wet][ref1], voor scholen op Bonaire bestaat uit:

      a. een bedrag per school dat afhangt van het aantal leerlingen op de school;

      b. een bedrag per leerling, waarbij onderscheid wordt gemaakt tussen:

      1°. leerlingen in het praktijkonderwijs of in het derde of vierde leerjaar van de basisberoepsgerichte
      of kaderberoepsgerichte leerweg van het vbo, alsmede ISK-leerlingen en leerlingen met een specifieke
      onderwijsbehoefte; en

      2°. leerlingen in het vwo, havo, mavo of vbo, met uitzondering van leerlingen in het derde of vierde leerjaar
      van de basisberoepsgerichte en kaderberoepsgerichte leerweg van het vbo, ISK-leerlingen en leerlingen met een
      specifieke onderwijsbehoefte;

      c. een bij ministeriële regeling te bepalen procentuele opslag over de optelsom van de bedragen bedoeld in
      de onderdelen a en b, in verband met de zorg aan leerlingen met een specifieke onderwijsbehoefte, bedoeld in
      [artikel 11.23, eerste lid, van de wet][ref2]; en

      d. een aanvullend bedrag per school voor het opzetten en in stand houden van kleine arbeidsmarktgerelateerde mbo-
      opleidingen.

      2 De bekostiging, bedoeld in [artikel 11.56 van de wet][ref3], voor scholen als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref4], bestaat uit:

      a. een bedrag per school, dat afhangt van het aantal leerlingen op de school;

      b. een bedrag per leerling, waarbij onderscheid wordt gemaakt tussen:

      1°. leerlingen in de lower forms of leerlingen die CSEC en CAPE volgen; en

      2°. leerlingen in het praktijkonderwijs of leerlingen die CVQ volgen.

      c. een bij ministeriële regeling nader te bepalen procentuele opslag over de optelsom van de bedragen, bedoeld
      in de onderdelen a en b, in verband met de zorg aan leerlingen met een specifieke onderwijsbehoefte, bedoeld in
      [artikel 11.23, eerste lid, van de wet][ref5];

      d. een bij ministeriële regeling te bepalen procentuele opslag over de optelsom van de onderdelen a tot en met c in
      verband met het loon- en prijspeil en de examenkosten op Sint-Eustatius en Saba;

      e. een aanvullend bedrag per school in verband met de geïsoleerde ligging en de kleinschaligheid op Sint Eustatius
      en Saba, dat afhangt van het aantal leerlingen op de school; en

      f. een aanvullend bedrag per school voor het opzetten en in stand houden van kleine arbeidsmarktgerelateerde CVQ-
      opleidingen.

      3 De bekostiging, bedoeld in het eerste en tweede lid, wordt vastgesteld in US dollars, en wordt rekenkundig
      afgerond op twee decimalen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.56
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel11.23
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel11.56
      [ref4]: https://wetten.overheid.nl/BWBR0045020#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel11.23
