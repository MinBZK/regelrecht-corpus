  - number: '2.62'
    text: |-
      Het bevoegd gezag van een school voor vbo kan leerlingen jonger dan zestien jaar op grond van
      [artikel 2.102, eerste lid, van de wet][ref1] de gelegenheid geven om een entreeopleiding te volgen, indien:

      a. de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref2] en [7.2.9 WEB][ref3] of de
      [artikelen 7.2.8][ref4] en [7.2.9 WEB BES][ref5], alleen het verrichten van lichte arbeid van geschikte aard omvat;

      b. in plaats van de basisberoepsgerichte leerweg geheel of gedeeltelijk zowel binnenschools als buitenschools
      onderwijs in de praktijk van de uitoefening van een vak of beroep wordt verzorgd;

      c. een gekwalificeerde mentor of docentbegeleider de voortgang van het onderwijs in de praktijk van de uitoefening
      van het beroep bewaakt; en

      d. het binnenschools en buitenschools onderwijs in de praktijk van de uitoefening van een vak of beroep
      geïntegreerd worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.102
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.9
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.8
      [ref5]: https://wetten.overheid.nl/BWBR0028395#Artikel7.2.9
