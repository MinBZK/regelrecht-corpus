  - number: '2.41'
    text: |-
      1 Een stageovereenkomst voor een maatschappelijke stage als bedoeld in [2.32 van de wet][ref1] omvat in elk geval:

      a. de leerdoelen;

      b. de activiteiten die de leerling moet ontplooien om de leerdoelen te bereiken;

      c. de aanvangsdatum, de einddatum en de tijden van de activiteiten;

      d. een regeling voor de begeleiding van de leerling bij de stagebieder.

      2 Indien er geen externe stagebieder is, wordt de stageovereenkomst gesloten tussen het bevoegd gezag en ouders
      respectievelijk de leerling indien deze handelingsbekwaam is.

      3 [Artikel 2.36, vierde lid][ref2], is van overeenkomstige toepassing op de stageovereenkomst voor een
      maatschappelijke stage.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.32
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.36
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.41
