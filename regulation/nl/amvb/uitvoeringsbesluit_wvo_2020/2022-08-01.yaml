  - number: '3.69'
    text: |-
      1 Het bevoegd gezag kan de examenkandidaat die het eindexamen vmbo theoretische leerweg aflegt aan een instelling
      voor educatie of beroepsonderwijs bij het eindexamen ontheffing verlenen van de vakken Franse taal of Duitse taal
      van het profieldeel, of van beide, indien de leerling:

      a. een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die effect heeft
      op taal;

      b. een andere moedertaal heeft dan de Nederlandse taal; of

      c. onderwijs volgt in het profiel natuur en techniek of het profiel natuur en gezondheid en het onderwijs in de
      taal verhindert naar verwachting dat de opleiding met goed gevolg wordt afgerond.

      2 In geval van een ontheffing op grond van het eerste lid, wordt het eindexamen in de taal vervangen door het
      eindexamen in een van de vakken, genoemd in [artikel 2.33, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.33
