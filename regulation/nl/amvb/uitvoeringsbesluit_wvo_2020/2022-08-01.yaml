      1 Het eindexamen vmbo theoretische leerweg omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 2.15][ref1];

      b. de twee vakken van het profieldeel, genoemd in [artikel 2.16][ref2]; en

      c. in het vrije deel twee nog niet in het profieldeel gekozen vakken, genoemd in
      [artikel 2.17, onderdelen a, b, of d][ref3], met dien verstande dat het profieldeel en het vrije deel samen ten
      minste twee vakken omvatten die geen moderne vreemde taal zijn.

      2 Indien de examenkandidaat in het vrije deel twee kunstvakken kiest, wordt een kunstvak gekozen uit de vakken
      behorende tot de beeldende vorming en een kunstvak uit de vakken muziek, dans en drama.

      3 In plaats van de vakken, bedoeld in het eerste en tweede lid, kan het eindexamen vmbo theoretische leerweg ter
      keuze van de examenkandidaat overeenkomstige vakken als bedoeld in [artikel 2.18][ref4] op het niveau van vwo of
      havo omvatten, voor zover het bevoegd gezag hem dat toestaat en het vervangen vak niet als extra vak als bedoeld in
      het vierde lid gekozen wordt.

      4 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo theoretische leerweg ter keuze van de
      examenkandidaat de volgende extra vakken omvatten, voor zover het bevoegd gezag hem dat toestaat en het vak niet
      inhoudelijk overeenkomt met een vak dat al onderdeel is van het eindexamen:

      a. een vak als bedoeld in [artikel 2.17, onderdelen a en b][ref5], dat behoort tot het vrije deel van de
      theoretische leerweg;

      b. een vak dat behoort tot het eindexamen vmbo gemengde leerweg; of

      c. een vak dat behoort tot het eindexamen vwo of havo.

      5 Het profielwerkstuk van het eindexamen vmbo theoretische leerweg heeft betrekking op een thema uit een profiel
      waarin de leerling onderwijs volgt.


