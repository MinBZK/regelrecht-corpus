  - number: '2.19'
    text: |-
      1 In het derde leerjaar volgt de leerling in de theoretische leerweg naast de vakken van het gemeenschappelijk
      deel, onderwijs in ten minste zeven vakken van het profieldeel of het vrije deel waarin eindexamen kan worden
      afgelegd.

      2 Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in een voorafgaand
      leerjaar, is het aantal vakken, bedoeld in het eerste lid, zes.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.19
  - number: '2.20'
    text: |-
      Het gemeenschappelijk deel van een profiel in de beroepsgerichte leerwegen omvat de volgende vakken:

      a. Nederlandse taal;

      b. Engelse taal;

      c. maatschappijleer;

      d. lichamelijke opvoeding en

      e. ten minste een van de vakken behorende tot de beeldende vorming, muziek, dans, of drama.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.20
  - number: '2.21'
    text: |-
      1 Het profieldeel van de beroepsgerichte leerwegen omvat voor de volgende profielen de daarachter vermelde
      profielvakken:

      a. het profiel bouwen, wonen en interieur: het profielvak bouwen, wonen en interieur;

      b. het profiel produceren, installeren en energie: het profielvak produceren, installeren en energie;

      c. het profiel mobiliteit en transport: het profielvak mobiliteit en transport;

      d. het profiel media, vormgeving en ICT: het profielvak media, vormgeving en ICT;

      e. het profiel maritiem en techniek: het profielvak maritiem en techniek;

      f. het profiel zorg en welzijn: het profielvak zorg en welzijn;

      g. het profiel economie en ondernemen: het profielvak economie en ondernemen;

      h. het profiel horeca, bakkerij en recreatie: het profielvak horeca, bakkerij en recreatie;

      i. het profiel groen: het profielvak groen; en

      j. het profiel dienstverlening en producten: het profielvak dienstverlening en producten.

      2 Naast het profielvak omvat het profieldeel voor de volgende profielen de daarachter vermelde vakken:

      a. het profiel bouwen, wonen en interieur, het profiel produceren, installeren en energie, het profiel mobiliteit
      en transport en het profiel media, vormgeving en ICT:

      1°. wiskunde; en

      2°. natuur- en scheikunde I.

      b. het profiel zorg en welzijn:

      1°. biologie; en

      2°. ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde,
      met dien verstande dat het bevoegd gezag beslist welke van de laatste drie vakken wordt of worden aangeboden;

      c. het profiel economie en ondernemen, en het profiel horeca, bakkerij en recreatie:

      1°. economie; en

      2°. ter keuze van de leerling, wiskunde, Franse taal of Duitse taal, met dien verstande dat het bevoegd gezag
      beslist welke van de twee laatste vakken wordt of worden aangeboden;

      d. het profiel groen:

      1°. wiskunde; en

      2°. ter keuze van de leerling, biologie of natuur- en scheikunde I;

      e. het profiel dienstverlening en producten:

      ter keuze van de leerling, twee van de vakken wiskunde, economie, biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.21
  - number: '2.22'
    text: |-
      Het vrije deel van een profiel in de beroepsgerichte leerwegen:

      a. omvat door de leerling te kiezen beroepsgerichte keuzevakken, met dien verstande dat het bevoegd gezag beslist
      welke beroepsgerichte keuzevakken worden aangeboden; en

      b. kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het bevoegd gezag kan een leerling in een beroepsgerichte leerweg in de gelegenheid stellen om in plaats van
      de vakken van het gemeenschappelijk deel of van het profieldeel van de beroepsgerichte leerweg, genoemd in de
      [artikelen 2.20][ref1] en [2.21][ref2], of van de vakken die in de plaats komen van een tweede moderne vreemde taal
      te volgen:

      a. de overeenkomstige vakken van de theoretische leerweg, genoemd in de [artikelen 2.15 tot en met 2.17][ref3];

      b. de overeenkomstige vakken van de gemengde leerweg, genoemd in de [artikelen 2.24 tot en met 2.26][ref4];

      c. de overeenkomstige vakken voor havo, genoemd in de [artikelen 2.10 tot en met 2.12][ref5]; of

      d. de overeenkomstige vakken voor vwo, genoemd in de [artikelen 2.5 tot en met 2.7.][ref6]

      2 Indien het gaat om een leerling in de basisberoepsgerichte leerweg, kan het bevoegd gezag de leerling ook
      in de gelegenheid stellen om in plaats van de vakken van het gemeenschappelijk deel of het profieldeel van de
      basisberoepsgerichte leerweg, genoemd in de [artikelen 2.20][ref7] en [2.21][ref8], van de vakken die in de plaats
      komen van een tweede moderne vreemde taal of van de beroepsgerichte keuzevakken, de overeenkomstige vakken van de
      kaderberoepsgerichte leerweg te volgen.

      3 Het bevoegd gezag kan de leerling in een beroepsgerichte leerweg in de gelegenheid stellen om Friese taal en
      cultuur als extra vak te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.20
