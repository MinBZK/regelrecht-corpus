      1 Het onderzoek naar de geschiktheid, bedoeld in [artikel 11.89, derde lid, van de wet][ref1], van een leerling
      vindt plaats met behulp van ten minste een van de hierna genoemde middelen, ter keuze van het bevoegd gezag:

      a. een toelatingsexamen, door de leraren van de school afgenomen, dat zich ten minste uitstrekt over de vakken
      Nederlandse taal en rekenen;

      b. een proefklas;

      c. een onderzoek naar de kennis en het inzicht van de kandidaat-leerling in ten minste het laatstelijk door hem
      gevolgde schooljaar aan de basisschool;

      d. een psychologisch onderzoek.

      2 Een kandidaat-leerling wordt alleen met toestemming van de ouders onderworpen aan een psychologisch onderzoek
      als bedoeld in het eerste lid, onderdeel d. Deze ouders worden op hun verzoek in de gelegenheid gesteld van de
      resultaten van het onderzoek kennis te nemen.

      3 Het bevoegd gezag draagt er zorg voor dat het rapport van het psychologisch onderzoek wordt bewaard op een plaats
      die alleen toegankelijk is voor het bevoegd gezag en de met het onderzoek belaste functionarissen. De ouders en de
      inspectie krijgen desgewenst inzage in dit rapport.

      4 Het rapport van het psychologisch onderzoek wordt in de school bewaard tot ten minste drie jaar en ten hoogste
      vijf jaar na het tijdstip waarop de leerling de school heeft verlaten en wordt in elk geval binnen twee maanden na
      het verstrijken van de termijn van vijf jaar vernietigd.

      5 Dit artikel is niet van toepassing op een school voor vwo, voor havo of voor mavo die een gemeenschappelijk
      eerste leerjaar heeft met een school voor vbo.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel11.89
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel9.40
