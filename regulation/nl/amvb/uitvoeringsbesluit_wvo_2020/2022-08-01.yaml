        paragraaf: '3'
  - number: '2.13'
    text: |-
      Het bevoegd gezag kan de leerling van een school voor havo in de gelegenheid stellen in plaats van de vakken voor
      havo, genoemd in de [artikelen 2.10 tot en met 2.12][ref1], de overeenkomstige vakken voor vwo, genoemd in de
      [artikelen 2.5 tot en met 2.7][ref2], te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.13
