  - number: '2.60'
    text: |-
      Leerlingen als bedoeld in de [artikelen 2.56][ref1] en [2.58][ref2] gelden voor de toepassing van
      [hoofdstuk 8a WEB][ref3] voor het onderwijs dat zij volgen aan een instelling ook als student als bedoeld in de
      [WEB][ref4].


