      1 Het eindexamen vmbo kaderberoepsgerichte leerweg omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 2.20][ref1];

      b. de twee algemene vakken van het profieldeel, genoemd in [artikel 2.21, tweede lid][ref2]; en

      c. een beroepsgericht programma, bestaande uit:

      1°. het profielvak, bedoeld in [artikel 2.21, eerste lid][ref3], van het profieldeel; en

      2°. in het vrije deel van het profiel vier beroepsgerichte keuzevakken.

      2 In plaats van de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo kaderberoepsgerichte leerweg ter
      keuze van de examenkandidaat overeenkomstige vakken als bedoeld in [artikel 2.23][ref4] op het niveau van vwo, havo
      of vmbo theoretische leerweg omvatten, voor zover het bevoegd gezag hem dat toestaat en het vervangen vak niet als
      extra vak als bedoeld in het derde lid gekozen wordt.

      3 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo kaderberoepsgerichte leerweg ter keuze van de
      examenkandidaat de volgende extra vakken omvatten, voor zover het bevoegd gezag hem dat toestaat, het vak nog geen
      onderdeel van dat eindexamen is en niet inhoudelijk overeenkomt met een vak dat al onderdeel is van het eindexamen:

      a. een algemeen vak van het profieldeel, genoemd in [artikel 2.21, tweede lid][ref5], of een beroepsgericht
      keuzevak;

      b. het vak Friese taal en cultuur;

      c. een vak als bedoeld in [artikel 2.23, tweede lid][ref6], dat op grond van dat artikel onderdeel kan zijn van de
      kaderberoepsgerichte leerweg,

      d. een algemeen vak dat behoort tot het eindexamen vmbo theoretische leerweg of vmbo gemengde leerweg; of

      e. een vak dat behoort tot het eindexamen vwo of havo.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.21
