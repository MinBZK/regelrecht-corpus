  - number: '3.64'
    text: |-
      1 De examenkandidaat aan een instelling voor educatie en beroepsonderwijs is vrijgesteld van:

      a. het eindexamen in een vak in vwo op grond van een examen vwo, indien voor het overeenkomstige vak een eindcijfer
      6 of hoger of een daarmee overeenkomende waardering is behaald;

      b. het eindexamen in een vak in havo op grond van een examen vwo of havo, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;

      c. het eindexamen in een vak van de theoretische leerweg in het vmbo op grond van een examen vwo, havo,
      theoretische leerweg of gemengde leerweg vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een
      daarmee overeenkomende waardering is behaald;

      d. het eindexamen in een vak van vwo, havo of vmbo op grond van het overeenkomstige examen, afgelegd in Curaçao,
      Sint Maarten of Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende
      waardering is behaald;

      e. het profielwerkstuk vwo of havo, indien eerder een profielwerkstuk is gemaakt dat betrekking heeft op een of
      meer vakken van dezelfde schoolsoort, behorende tot het profiel van de examenkandidaat en waarvoor een eindcijfer 6
      of hoger is behaald; of

      f. het profielwerkstuk vmbo, indien eerder een profielwerkstuk vmbo is gemaakt dat betrekking heeft op een thema
      uit het profiel van de examenkandidaat, en dat is beoordeeld als «voldoende» of «goed».

      2 Het eerste lid is van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is vastgesteld,
      nog geen tien jaar zijn verstreken. Het eerste lid, onderdeel f, is van overeenkomstige toepassing op een eerder
      gemaakt sectorwerkstuk dat is beoordeeld als «voldoende» of «goed».

      3 De examenkandidaat, bedoeld in het eerste lid, aanhef en onderdelen a tot en met d, is ook vrijgesteld van het
      eindexamen in dat vak indien het eindcijfer 5 of 4 is behaald, mits de examenkandidaat voldoet aan de voorwaarden,
      bedoeld in de [artikelen 3.34][ref1] of [3.35][ref2], om te slagen voor het eindexamen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
