  - number: '2.65'
    text: |-
      Een leer-werkovereenkomst als bedoeld in [artikel 2.103, zesde lid, van de wet][ref1] regelt de rechten en plichten
      van partijen en omvat ten minste afspraken over:

      a. inhoud, leerdoelen, duur, periode van en beoordelingsmaatstaven voor het buitenschoolse praktijkgedeelte;

      b. de begeleiding van de leerling; en

      c. de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.103
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.103'
  - number: '2.66'
    text: |-
      Leerlingen van zestien en zeventien jaar die naar het oordeel van het bevoegd gezag van een aangewezen school
      als bedoeld in de [artikel 2.66 van de wet][ref1] een grotere kans hebben een diploma of volgend diploma
      als bedoeld in [artikel 2.58, tweede lid, van de wet][ref2] te behalen indien zij vavo volgen in plaats van
      voortgezet onderwijs, kunnen op grond [artikel 2.109, eerste lid, aanhef en onderdeel b, van de wet][ref3]
      deelnemen aan een opleiding vavo bij een instelling voor educatie en beroepsonderwijs als bedoeld in
      [artikel 2.109, eerste lid, van de wet][ref4] en die opleiding met een examen afsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.66
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.109
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2.109
