        artikel: 4:49
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '5.46'
      - id: ref4
        bwb_id: BWBR0044212
        artikel: '5.46'
  - number: '6.22'
    text: |-
      Onze Minister betaalt een correctie als bedoeld in [artikel 6.21, tweede lid][ref1], die strekt tot
      verhoging van de bekostiging, binnen acht weken na de bekendmaking van de mededeling, bedoeld in
      [artikel 6.21, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6.21
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel6.21
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6.21'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '6.21'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '6.23'
    text: |-
      1 De gegevens, bedoeld in de [artikel 5.48, eerste lid, van de wet][ref1], waarover een bevoegd gezag of een
      samenwerkingsverband beschikt, worden gedefinieerd en geordend volgens de regels vermeld in [bijlage 3][ref2].

      2 Bij ministeriële regeling worden nadere regels gesteld over de gegevens, bedoeld in het eerste lid, en over de
      wijze waarop de gegevens beschikbaar worden gesteld.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de gegevens die betrekking hebben op
      verstrekte aanvullende bekostiging en de wijze waarop deze gegevens worden gedefinieerd, geordend en beschikbaar
      gesteld.

      4 In de ministeriële regeling wordt geregeld welke gevraagde gegevens van belang zijn voor de berekening van de
      hoogte van de bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.48
      [ref2]: https://wetten.overheid.nl/BWBR0045787
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5.48'
      - id: ref2
        bwb_id: BWBR0045787
  - number: '6.24'
    text: |-
      Bij ministeriële regeling kan in spoedeisende gevallen een aanvullende vragenlijst over de bekostiging worden
      vastgesteld ter beantwoording door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.24
  - number: '6.25'
    text: |-
      Onze Minister kan bij het verzoek om beschikbaarstelling van gegevens als bedoeld in
      [artikel 5.48, eerste lid, van de wet][ref1] bij hem bekende gegevens opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.48
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5.48'
  - number: '6.26'
    text: |-
      1 In geval van oprichting, verplaatsing of splitsing van een school kan Onze Minister afwijken van de teldatum
      en de op die afwijkende datum getelde leerlingen toerekenen aan de nieuwe scholen. Hij kan daarbij nadere
      voorschriften geven.

      2 Onze Minister kan in verband met de aanvang of beëindiging van de bekostiging van een school, van een
      scholengemeenschap of van een profiel aan een school voor vbo afwijken van de [artikelen 6.7][ref1] en [6.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel6.8
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.26
