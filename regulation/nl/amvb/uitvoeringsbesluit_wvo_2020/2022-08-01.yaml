  - number: '6.27'
    text: |-
      1 Bij samenvoeging van scholen als bedoeld in [artikel 4.10 van de wet][ref1], op 1 augustus van enig kalenderjaar,
      wordt de bekostiging op grond van [artikel 5.4 van de wet][ref2], en de aanvullende bekostiging van alle bij de
      samenvoeging betrokken scholen gehandhaafd tot het einde van dat kalenderjaar.

      2 Bij afsplitsing van een of meer scholen van een scholengemeenschap als bedoeld in
      [artikel 4.2, derde lid, van de wet][ref3], op 1 augustus van enig kalenderjaar, wordt de bekostiging op
      grond van [artikel 5.4 van de wet][ref4], en de aanvullende bekostiging van de bij de afsplitsing betrokken
      scholengemeenschap gehandhaafd tot het einde van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5.4
