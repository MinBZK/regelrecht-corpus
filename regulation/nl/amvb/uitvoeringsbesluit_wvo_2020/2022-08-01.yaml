  - number: '4.7'
    text: |-
      1 De examenkandidaat met het diploma havo is bij het staatsexamen vwo vrijgesteld van het vak maatschappijleer van
      het gemeenschappelijk deel.

      2 De examenkandidaat met het diploma havo of het diploma vmbo die in plaats van een vak voor die
      schoolsoort of als extra vak examen heeft afgelegd in een overeenkomstige vak voor vwo, genoemd in de
      [artikelen 2.5 tot en met 2.7][ref1], is bij het staatsexamen vwo vrijgesteld van dat vak.

      3 De examenkandidaat met het diploma vmbo die in plaats van een vak voor die schoolsoort of als extra vak examen
      heeft afgelegd in een overeenkomstige vak voor havo, genoemd in de [artikelen 2.10 tot en met 2.12][ref2], is bij
      het staatsexamen havo vrijgesteld van dat vak.

      4 De examenkandidaat die op grond van [artikel 12 van de Beleidsregel verstrekking LOOT-licentie VO][ref3] of
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO][ref4] ontheffing heeft verkregen voor een vak,
      genoemd in die artikelen, is bij het staatsexamen vrijgesteld van dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.10
