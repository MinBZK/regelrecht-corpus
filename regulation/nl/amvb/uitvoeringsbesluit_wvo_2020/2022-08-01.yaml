    text: |-
      1 Leerlingen als bedoeld in de [artikelen 2.57][ref1] en [2.59][ref2] worden aangemerkt als leerlingen die op de
      teldatum als werkelijk schoolgaand op de school zijn ingeschreven, als bedoeld in [artikel 6.7, eerste lid][ref3].
      [Artikel 6.8, eerste lid, onderdeel a, en tweede lid][ref4], is op deze leerlingen van overeenkomstige toepassing.

      2 In afwijking van het eerste lid, tellen leerlingen die zijn afgewezen voor een eindexamen als bedoeld in
      [artikel 2.51 van de wet][ref5] en aansluitend op grond van [artikel 2.58][ref6] voor een of meer vakken vavo
      volgen in plaats van voortgezet onderwijs, op de teldatum voor 50% mee.

      3 In afwijking van het eerste lid en van [artikel 6.8, eerste lid, onderdeel b][ref7], tellen leerlingen die op
      grond van [artikel 2.58, derde lid][ref8], voor een of meer vakken vavo volgen in plaats van voortgezet onderwijs,
      op de teldatum voor 50% mee.


