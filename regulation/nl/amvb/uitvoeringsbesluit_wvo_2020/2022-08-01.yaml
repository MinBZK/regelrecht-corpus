  - number: '4.30'
    text: |-
      1 Een examenkandidaat is geslaagd voor het staatsexamen vwo met toekenning van het judicium cum laude indien de
      examenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer, bedoeld in
      [artikel 4.20, tweede lid][ref1], en de vakken van het profieldeel; en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld;

      b. ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 4.20][ref2]; en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      2 Een examenkandidaat is geslaagd voor het staatsexamen havo met toekenning van het judicium cum laude indien de
      examenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer bedoeld in
      [artikel 4.20, tweede lid][ref3], en de vakken van het profieldeel; en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld;

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 4.20][ref4]; en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.


