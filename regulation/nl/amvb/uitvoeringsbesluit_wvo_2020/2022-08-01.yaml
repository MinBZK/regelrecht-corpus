  - number: '2.63'
    text: |-
      1 Een samenwerkingsovereenkomst als bedoeld in [artikel 2.102, vijfde lid, van de wet][ref1] voor het verzorgen van
      een entreeopleiding omvat in elk geval afspraken over:

      a. de entreeopleiding die geheel of gedeeltelijk in plaats van de basisberoepsgerichte leerweg zal worden verzorgd;

      b. de inschrijving van leerlingen als extraneus bij de instelling voor educatie en beroepsonderwijs;

      c. de examinering en diplomering door de instelling voor educatie en beroepsonderwijs;

      d. de invulling van de betrokkenheid van het bevoegd gezag bij de beroepspraktijkvorming, bedoeld in
      de [artikelen 7.2.8][ref2] en [7.2.9 WEB][ref3] of de [artikelen 7.2.8][ref4] en [7.2.9 WEB BES][ref5],
      met dien verstande dat het bevoegd gezag de overeenkomst, bedoeld in [artikel 7.2.9 WEB][ref6] of
      [artikel 7.2.9 WEB BES][ref7], ook ondertekent;

      e. de toepassing van [artikel 2.102, tweede lid, van de wet][ref8];

      f. de rechtsbescherming van de leerling; en

      g. de doorstroom van de leerlingen na het met goed gevolg afsluiten van de entreeopleiding.

      2 Indien het bevoegd gezag ook het bevoegd gezag is van een instelling voor educatie en beroepsonderwijs, regelt
      het bevoegd gezag op overeenkomstige wijze de onderwerpen, genoemd in het eerste lid.


