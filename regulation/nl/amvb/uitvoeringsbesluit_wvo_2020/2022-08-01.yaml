      1 Het eindexamen havo omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 2.10][ref1];

      b. de vakken van het profieldeel, genoemd in [artikel 2.11][ref2]; en

      c. ten minste een vak met een normatieve studielast van ten minste 320 uur van het vrije deel van elk profiel,
      genoemd in [artikel 2.12][ref3], met dien verstande dat een door het bevoegd gezag vast te stellen vak alleen
      onderdeel is van het eindexamen voor zover Onze Minister daarvoor goedkeuring heeft verleend.

      2 In plaats van de vakken, bedoeld in het eerste lid, kan het eindexamen havo ter keuze van de examenkandidaat
      overeenkomstige vakken als bedoeld in [artikel 2.13][ref4] op het niveau van vwo omvatten, voor zover het bevoegd
      gezag hem dat toestaat en het vervangen vak niet als extra vak als bedoeld in het derde lid gekozen wordt.

      3 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen havo ter keuze van de examenkandidaat extra vakken
      omvatten, voor zover het bevoegd gezag hem dat toestaat en het vak niet inhoudelijk overeenkomt met een vak dat al
      onderdeel is van dat eindexamen.

      4 Het profielwerkstuk van het eindexamen havo heeft betrekking op een of meer vakken van het eindexamen. Ten minste
      een van deze aan het profielwerkstuk gekoppelde vakken heeft een omvang van 320 uur of meer.


