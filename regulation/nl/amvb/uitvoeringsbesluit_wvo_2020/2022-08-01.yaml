        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.9'
    text: |-
      1 Het bevoegd gezag van een atheneum kan een leerling ontheffing verlenen voor het volgen van onderwijs in een
      tweede moderne vreemde taal als bedoeld in [artikel 2.5, eerste lid, onderdeel c][ref1], indien:

      a. de leerling een stoornis heeft die specifiek betrekking heeft op taal of een zintuiglijke stoornis heeft die
      effect heeft op taal;

      b. de leerling een andere moedertaal heeft dan de Nederlandse taal of de Friese taal; of

      c. de leerling onderwijs volgt in het profiel natuur en techniek of in het profiel natuur en gezondheid en het
      onderwijs in de taal naar verwachting verhindert dat de opleiding met goed gevolg wordt afgerond.

      2 In geval van een ontheffing als bedoeld in het eerste lid, wordt de taal vervangen door een van de vakken of
      programmaonderdelen, genoemd in de [artikelen 2.6][ref2] of [2.7, onderdeel c en d][ref3], met een normatieve
      studielast van ten minste 440 uren, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken of
      programmaonderdelen als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2.7
