        artikel: '2.100'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5.39'
  - number: '2.57'
    text: |-
      1 De volgende leerlingen kunnen op grond van [artikel 2.99, eerste lid, aanhef en onderdeel a, van de wet][ref1]
      in de gelegenheid worden gesteld in het kader van het onderwijs waarvoor zij aan de school zijn ingeschreven,
      ook onderwijs te ontvangen aan een school van een ander bevoegd gezag of aan een instelling voor educatie en
      beroepsonderwijs:

      a. voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel a, van de wet][ref2]: leerlingen in
      het derde of het vierde leerjaar vbo of mavo die naar het oordeel van het bevoegd gezag zonder gerichte
      ondersteuning een vergrote kans lopen om het onderwijs te verlaten zonder ten minste een diploma
      van een basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel b, WEB][ref3] of
      [artikel 7.2.2, eerste lid, onderdeel b, WEB BES][ref4];

      b. voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel b, van de wet][ref5]: leerlingen die naar het
      oordeel van het bevoegd gezag een grotere kans hebben om vervolgonderwijs met goed gevolg te volgen door extra
      verrijking, verdieping en oriëntatie naast hun reguliere opleiding, of door onderdelen van beroepsopleidingen
      als bedoeld in [artikel 7.2.2 WEB][ref6] of [artikel 7.2.2 WEB BES][ref7] of opleidingen educatie als bedoeld
      in [artikel 7.3.1 WEB][ref8] of [artikel 7.3.1 WEB BES][ref9] te volgen, naast hun reguliere opleiding in het
      voortgezet onderwijs; en

      c. voor het doel, bedoeld in [artikel 2.99, tweede lid, onderdeel c, van de wet][ref10]: iedere leerling.

      2 Een leerling als bedoeld in het eerste lid volgt voor ten hoogste de helft van het aantal klokuren van het
      onderwijsprogramma lessen of stages aan de andere school of aan een instelling voor educatie en beroepsonderwijs.


