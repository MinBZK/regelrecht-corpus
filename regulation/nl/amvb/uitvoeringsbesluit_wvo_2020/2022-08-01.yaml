  - number: '2.44'
    text: |-
      Het aantal klokuren onderwijs in de praktijk van de uitoefening van een vak of beroep, bedoeld in
      [artikel 2.38, achtste lid, van de wet][ref1] op een school voor praktijkonderwijs bedraagt gedurende de cursusduur
      gemiddeld ten hoogste 50% van het aantal uren waarin onderwijs wordt gegeven, met dien verstande dat voor
      leerlingen tot en met het schooljaar waarop zij de leeftijd van 17 jaar hebben bereikt het aantal uren onderwijs
      in de praktijk van de uitoefening van een vak of beroep per schoolweek ten hoogste 80% bedraagt van het aantal uren
      waarin in die week onderwijs wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.38
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.38'
  - number: '2.45'
    text: |-
      1 Onderwijstijd telt als klokuren als bedoeld in [artikel 2.38 van de wet][ref1], indien tussen het bevoegd gezag
      van een school of scholengemeenschap en het bevoegd gezag van een school voor voortgezet speciaal onderwijs, een
      school voor speciaal en voortgezet speciaal onderwijs, of van een instelling voor speciaal en voortgezet speciaal
      onderwijs, een schriftelijke overeenkomst over de uitvoering daarvan is gesloten.

      2 De schriftelijke overeenkomst omvat in elk geval afspraken over:

      a. de termijn waarvoor deze is aangegaan;

      b. de vakken die de leerling volgt;

      c. het aantal uren onderwijstijd per week per vak dat ten minste wordt aangeboden;

      d. de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling.

      3 Een leerling kan gedurende een termijn van ten hoogste drie maanden aaneengesloten het volledige
      onderwijsprogramma volgen op een school of instelling als bedoeld in het eerste lid. In dat geval omvat de
      overeenkomst in elk geval afspraken over:

      a. de termijn waarvoor deze is aangegaan;

      b. de aanwezigheid van leraren, onderwijsondersteunend personeel en andere begeleiding van de leerling; en

      c. het bedrag voor de personele en materiële kosten dat het bevoegd gezag van de school of scholengemeenschap
      waar de leerling is ingeschreven betaalt aan het bevoegd gezag van de school of van een instelling, bedoeld in het
      eerste lid, waarmee de overeenkomst wordt gesloten.

      4 Het derde lid, onderdeel c, is niet van toepassing op een overeenkomst met een school waaraan
      onderwijs wordt gegeven aan leerlingen die zijn opgenomen in een inrichting als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref2] of een gesloten accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref3].

      5 Indien voor de toepassing van [artikel 2.40, eerste lid, van de wet][ref4], scholen, scholengemeenschappen of
      instellingen als bedoeld in het eerste lid binnen hetzelfde bevoegd gezag zijn betrokken, maakt dit bevoegd gezag
      afspraken met de directies van deze betrokken scholen, scholengemeenschappen of instellingen over de onderdelen,
      genoemd in het tweede, en, indien van toepassing, het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.38
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel2.40
