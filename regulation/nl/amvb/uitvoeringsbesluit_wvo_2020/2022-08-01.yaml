    text: |-
      In afwijking van [artikel 6.1, tweede lid][ref1], wordt er voor een school of scholengemeenschap die deel
      uitmaakt van een verticale scholengemeenschap in het bedrag per vestiging geen onderscheid gemaakt tussen de
      hoofdvestiging en een nevenvestiging. De hoofdvestiging van de school of scholengemeenschap die voldoet aan
      [artikel 6.1, eerste lid][ref2], komt in aanmerking voor het op grond van [artikel 6.1, tweede lid][ref3],
      vastgestelde bedrag voor een nevenvestiging.


