      - id: ref1
        bwb_id: BWBR0045787
  - number: '2.2'
    text: |-
      1 Leerlingen die naar het oordeel van het bevoegd gezag niet in staat zijn alle delen van het onderwijsprogramma,
      bedoeld in [artikel 2.14 van de wet][ref1], te volgen, kunnen in aanmerking komen voor afwijkingen in het
      onderwijsprogramma als bedoeld in [artikel 2.18, tweede lid, van de wet][ref2].

      2 Het bevoegd gezag stelt een commissie in die hem adviseert voor welke leerlingen
      [artikel 2.18, tweede lid, van de wet][ref3] kan worden toegepast. Het bevoegd gezag regelt de omvang en
      samenstelling van de commissie.

      3 In haar schriftelijk advies doet de commissie aan het bevoegd gezag voorstellen over de aard van de afwijkingen.
      Daarbij geeft zij aan waarop deze voorstellen zijn gegrond.

      4 De commissie betrekt in elk geval bij haar oordeelsvorming:

      a. in voorkomende gevallen het onderwijskundig rapport, bedoeld in [artikel 42, eerste lid, WPO][ref4],
      [artikel 48 van de WPO BES][ref5] of [artikel 43 WEC][ref6] en de resultaten van het onderzoek naar de
      geschiktheid, bedoeld in [artikel 8.3, eerste lid][ref7], of [artikel 9.40][ref8];

      b. indien de omstandigheid op grond waarvan afwijking wordt voorgesteld daartoe aanleiding geeft, de verklaring die
      is afgegeven door een deskundige;

      c. de schriftelijke zienswijze van de ouders van de leerlingen;

      d. de schriftelijke zienswijze van de leraar of leraren die zijn belast met het betrokken onderwijs.

      5 Indien het bevoegd gezag het voornemen heeft om af te wijken van het advies van de commissie, overlegt het
      bevoegd gezag met de commissie.

      6 De beslissing van het bevoegd gezag van een bijzondere school over het afwijken van onderdelen van het
      onderwijsprogramma berust op een deugdelijke motivering.

      7 Het bevoegd gezag zendt zijn besluit, voorzien van een deugdelijke motivering en vergezeld van het advies van de
      commissie en de daarbij gevoegde gegevens, bedoeld in het vierde lid, aan de ouders van de betrokken leerlingen,
      aan de betrokken leraar of leraren en aan de inspectie.


