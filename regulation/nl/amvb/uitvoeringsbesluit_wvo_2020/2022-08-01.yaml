        artikel: '2.57'
  - number: '3.41'
    text: |-
      Op de cijferlijst van een examenkandidaat als bedoeld in [artikel 3.52][ref1] die eindexamen vmbo aan een school
      heeft afgelegd in een of meer vakken worden vermeld:

      a. de leerweg;

      b. de cijfers voor het schoolexamen en het centraal examen;

      c. het thema en de beoordeling van het profielwerkstuk; en

      d. de eindcijfers voor de examenvakken, met inbegrip van het eindcijfer, bedoeld in
      [artikel 3.35, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.52
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.41
