      1 De bij of krachtens dit hoofdstuk gestelde bepalingen, met uitzondering van de [artikelen 3.10][ref1] en
      [3.53][ref2], zijn ook van toepassing op het eindexamen bij een opleiding vavo aan een instelling voor educatie en
      beroepsonderwijs, tenzij in deze paragraaf hiervan wordt afgeweken, met dien verstande dat:

      a. voor «bevoegd gezag» telkens wordt gelezen «bevoegd gezag, bedoeld in [artikel 1.1.1 WEB][ref3] of
      [artikel 1.1.1 WEB BES][ref4]»;

      b. voor «leerling» telkens wordt gelezen «vavo-student»;

      c. voor «school» telkens wordt gelezen «instelling voor educatie en beroepsonderwijs», met dien verstande dat in de
      [artikelen 3.22][ref5] en [3.62][ref6] onder «school» wordt verstaan «school voor voortgezet onderwijs»;

      d. voor «rector of directeur» of voor «rector of directeur en examensecretaris» telkens wordt gelezen «de
      examencommissie vavo».

      2 In deze paragraaf wordt verstaan onder:

        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1.1.1. WEB][ref7] of [artikel 1.1.1 WEB BES][ref8];
        - *examencommissie vavo:* examencommissie voor een opleiding vavo, bedoeld in [artikel 7.4.11, tweede lid][ref9],
      juncto [artikel 7.4.5 WEB][ref10] of [artikel 7.4.13, tweede lid][ref11], juncto [artikel 7.4.7 WEB BES][ref12];
        - *instelling voor educatie en beroepsonderwijs:* een instelling voor educatie en beroepsonderwijs, voor zover het
      gaat om door die instelling verzorgde opleidingen vavo.


