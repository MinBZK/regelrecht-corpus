  - number: '8.10'
    text: |-
      1 Het bevoegd gezag draagt zorg voor:

      a. een overzichtelijke administratie van de inschrijving van leerlingen;

      b. de beschikbaarheid van een bewijs van de uitschrijving en van de gegevens over het verzuim van leerlingen; en

      c. de beschikbaarheid van de gegevens van leerlingen en hun ouders die noodzakelijk zijn voor de vaststelling van
      de bekostiging.

      2 De gegevens van de leerling die in de leerlingenadministratie zijn opgenomen, worden nadat de leerling is
      uitgeschreven ten minste vijf jaar bewaard.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de leerlingenadministratie wordt
      ingericht.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.10
  - number: '8.11'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [Les- en cursusgeldwet][ref1], schrijft het bevoegd gezag van een
      school een leerling slechts in na een beslissing van het bevoegd gezag tot toelating van de leerling, of indien de
      leerling tijdelijk op de school wordt geplaatst op grond van [artikel 8.13 van de wet][ref2].

      2 Het bevoegd gezag schrijft de leerling in met ingang van:

      a. de dag waarop de leerling de school voor het eerst bezoekt; of

      b. 1 augustus van het schooljaar, indien de leerling de school voor het eerst op de eerste schooldag van het
      schooljaar bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8.13
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '8.13'
  - number: '8.12'
    text: |-
      1 Het bevoegd gezag maakt bij beslissingen tot verwijdering van leerlingen op de grond dat deze niet zijn bevorderd
      tot het zesde leerjaar van het vwo dan wel het vijfde leerjaar van het havo, geen onderscheid tussen leerlingen op
      basis van de schoolsoort of leerweg waarvoor zij eerder stonden ingeschreven.

      2 Een leerling wordt op grond van onvoldoende vorderingen niet in de loop van een schooljaar verwijderd.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.12
  - number: '8.13'
    text: |-
      1 Het bevoegd gezag schrijft de leerling uit met ingang van:

      a. 31 juli van het schooljaar, indien de leerling de school op de laatste schooldag van dat schooljaar heeft
      bezocht; of

      b. de dag waarop de leerling de school voor het laatst heeft bezocht.

      2 Indien het bevoegd gezag van een school waarop de leerling stond ingeschreven, binnen vier weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school voor ander onderwijs, wijzigt het bevoegd gezag de datum van uitschrijving, bedoeld in het
      eerste lid, onderdeel b, alsnog in de datum van de dag voorafgaande aan de dag van inschrijving op die andere
      school of die school voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '8.14'
    text: |-
      1 Een ziekte als bedoeld in [artikel 8.30, eerste lid, van de wet][ref1] kan alleen worden aangetoond door middel
      van een gedagtekende verklaring van een arts.

      2 Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid zonder geldige
      reden van vier weken van een leerling als bedoeld in [artikel 8.30, eerste lid, van de wet][ref2], aan deze
      leerling dat van die afwezigheid in de leerlingenadministratie van de school aantekening is gemaakt en verzoekt de
      leerling om opgaaf van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de levering van
      de gegevens van de leerling, bedoeld in [artikel 8.20, eerste lid, van de wet][ref3].

      3 Het bevoegd gezag stelt uiterlijk op de vijfde werkdag na afloop van een periode van acht weken na de aanvang van
      de afwezigheid vast:

      a. of de reden die de leerling tijdens deze acht weken gaf voor zijn afwezigheid, een geldige is; of

      b. dat de leerling tijdens deze acht weken geen reden heeft opgegeven voor die afwezigheid; en

      c. of de leerling tijdens deze acht weken weer aan het onderwijs is gaan deelnemen.

      4 De melding, bedoeld in [artikel 8.30, eerste lid, van de wet][ref4], vindt plaats uiterlijk op de vijfde werkdag
      na afloop van de periode van acht weken, bedoeld in het tweede lid. Indien die leerling tijdens deze acht weken
      weer aan het onderwijs is gaan deelnemen, meldt het bevoegd gezag Onze Minister ook de datum daarvan.

      5 De periode van vijf weken, bedoeld in [artikel 8.30, eerste lid, van de wet][ref5], en de periode van acht weken,
      bedoeld in het tweede lid, worden verlengd met de weken waarin vanwege vakantie geen onderwijs wordt gegeven.
      Vakantieweken worden niet als onderbreking van de periode gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8.30
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8.30
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel8.20
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel8.30
      [ref5]: https://wetten.overheid.nl/BWBR0044212#Artikel8.30
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel8.14
