      1 Het staatsexamen vmbo en havo omvat voor kandidaten die geen schoolexamen rekenen als bedoeld in
      [artikel 12.45 van de wet][ref1], of eindexamen in het vak wiskunde hebben afgelegd, of voor kandidaten die
      geen staatsexamen afleggen of hebben afgelegd in het vak wiskunde, een college-examen rekenen als bedoeld in
      [artikel 12.46 van de wet][ref2].

      2 In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van een
      leerweg in het vmbo en die een schoolexamen rekenen als bedoeld in [artikel 12.45 van de wet][ref3],
      of een college-examen rekenen als bedoeld in het eerste lid, heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref4] is
      vastgesteld voor het eindexamen vmbo, bij het afleggen van het staatsexamen in een andere leerweg van het vmbo,
      vrijgesteld van het college-examen rekenen.

      3 In afwijking van het eerste lid is de kandidaat die de rekentoets, bedoeld in
      [artikel 60, zesde lid, van de wet][ref5], zoals dat artikel luidde op de dag voor inwerkingtreding van artikel
      I, onderdeel C, van de Wet van 1 juli 2020 tot wijziging van onder andere de Wet op het voortgezet onderwijs in
      verband met de afschaffing van de rekentoets in het voortgezet onderwijs (afschaffing rekentoets vo) (Stb. 2020,
      233), heeft afgelegd, vrijgesteld van het college-examen rekenen.

      4 Het cijfer voor het college-examen rekenen weegt niet mee in de uitslagbepaling voor het staatsexamen vmbo en
      havo, bedoeld in de [artikelen 4.20][ref6] en [4.21][ref7].

      5 In afwijking van de [artikelen 4.25, eerste lid, onderdeel a, tweede lid, onderdeel a][ref8], en
      [4.26, eerste lid, onderdeel a][ref9], wordt het cijfer voor het college-examen rekenen vermeld op een bijlage bij
      de cijferlijst.

      6 Indien de kandidaat is vrijgesteld van het college-examen rekenen op grond van het tweede of het derde lid, wordt
      het college-examen rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.

      7 Het vijfde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen of staatsexamen in het vak wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in de
      uitslagbepaling, bedoeld in [artikel 4.20][ref10] of [artikel 4.21][ref11], en de kandidaat bezwaar heeft tegen het
      opnemen van het eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 4.25, derde lid][ref12].

      8 Dit artikel is van overeenkomstige toepassing op de kandidaat die het staatsexamen vmbo in
      de basisberoepsgerichte leerweg aflegt ter afsluiting van een leer-werktraject als bedoeld in
      [artikel 2.103 van de wet][ref13].

      9 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


