  - number: '2.3'
    text: |-
      1 Het onderwijsprogramma in de eerste drie leerjaren aan een school voor vwo en aan een school voor havo omvat ook
      onderwijs in Franse taal en Duitse taal.

      2 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen voor het
      volgen van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Russische
      taal, Italiaanse taal, Arabische taal, Turkse taal of, in vwo, Chinese taal en cultuur.

      3 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ook ontheffing verlenen voor het
      volgen van onderwijs in Franse taal of Duitse taal of in beide talen, indien de leerling:

      a. voor de eerste maal tot een school als bedoeld in het eerste lid is toegelaten;

      b. is geplaatst in een hoger leerjaar dan het eerste;

      c. eerder buiten Nederland vergelijkbaar onderwijs heeft gevolgd; en

      d. daarbij geen of te weinig onderwijs in deze taal of talen heeft gevolgd.

      4 Het onderwijsprogramma in de eerste drie leerjaren aan een gymnasium omvat ook onderwijs in Latijnse taal en
      cultuur en Griekse taal en cultuur.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Het onderwijsprogramma in de eerste twee leerjaren aan een school voor mavo en aan een school voor vbo omvat ook
      onderwijs in Franse taal of Duitse taal. De eerste volzin is niet van toepassing op leerlingen voor wie naar de
      verwachting van het bevoegd gezag het onderwijs in de basisberoepsgerichte leerweg het meest geschikt is.

      2 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ontheffing verlenen voor het
      volgen van onderwijs in Franse taal of Duitse taal, indien de leerling onderwijs volgt in Spaanse taal, Arabische
      taal of Turkse taal.

      3 Het bevoegd gezag kan een leerling van een school als bedoeld in het eerste lid ook ontheffing verlenen voor het
      volgen van onderwijs in de Franse taal of Duitse taal, indien de leerling:

      a. voor de eerste maal tot een school als bedoeld in het eerste lid is toegelaten;

      b. is geplaatst in een hoger leerjaar dan het eerste;

      c. eerder buiten Nederland vergelijkbaar onderwijs heeft gevolgd; en

      d. daarbij geen of te weinig onderwijs in deze taal of talen heeft gevolgd.

      4 De leerling die op basis van het eerste lid, tweede volzin, geen onderwijs volgt in de Franse taal of
      Duitse taal, volgt in het profiel economie en ondernemen of het profiel horeca, bakkerij en recreatie van de
      basisberoepsgerichte leerweg in plaats hiervan, naar keuze van de leerling, het vak Arabische taal, Turkse taal,
      Spaanse taal, maatschappijkunde, geschiedenis en staatsinrichting of aardrijkskunde.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.4
  - number: '2.5'
    text: |-
      1 Het gemeenschappelijk deel van een profiel in het atheneum omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. Nederlandse taal en literatuur: 480;

      b. Engelse taal en literatuur: 400;

      c. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, Chinese taal en cultuur of
      Friese taal en cultuur, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken aanbiedt: 480;

      d. maatschappijleer: 120;

      e. culturele en kunstzinnige vorming: 160; en

      f. lichamelijke opvoeding: 160.

      2 Het gemeenschappelijk deel van een profiel in het gymnasium omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. Nederlandse taal en literatuur: 480;

      b. Engelse taal en literatuur: 400;

      c. Latijnse taal en cultuur of Griekse taal en cultuur, ter keuze van de leerling uit deze beide door het bevoegd
      gezag aan te bieden vakken: 760;

      d. maatschappijleer: 120; en

      e. lichamelijke opvoeding: 160.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.5
  - number: '2.6'
    text: |-
      1 Het profieldeel van het profiel natuur en techniek in vwo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde B: 600;

      b. natuurkunde: 480;

      c. scheikunde: 440; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 440;

      2°. informatica: 440;

      3°. biologie: 480; of

      4°. wiskunde D: 440.

      2 Het profieldeel van het profiel natuur en gezondheid in vwo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 520, met dien verstande dat de leerling het vak wiskunde A kan vervangen door wiskunde B, voor zover
      het bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt;

      b. biologie: 480;

      c. scheikunde: 440; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. natuur, leven en technologie: 440;

      2°. aardrijkskunde: 440; of

      3°. natuurkunde: 480.

      3 Het profieldeel van het profiel economie en maatschappij in vwo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde A: 520, met dien verstande dat de leerling het vak wiskunde A kan vervangen door wiskunde B, voor zover
      het bevoegd gezag dit vak als onderdeel van dit profiel aanbiedt;

      b. economie: 480;

      c. geschiedenis: 440; en

      d. een van de volgende profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze vakken
      aanbiedt:

      1°. bedrijfseconomie: 440;

      2°. aardrijkskunde: 440;

      3°. maatschappijwetenschappen: 440; of

      4°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, Chinese taal en cultuur of
      Friese taal en cultuur: 480.

      4 Het profieldeel van het profiel cultuur en maatschappij in vwo omvat de volgende vakken, met de daarbij vermelde
      normatieve studielast, uitgedrukt in uren:

      a. wiskunde C: 480, met dien verstande dat de leerling het vak wiskunde C kan vervangen door wiskunde A of wiskunde
      B, voor zover het bevoegd gezag deze vakken als onderdeel van dit profiel aanbiedt;

      b. geschiedenis: 480;

      c. een van de volgende culturele profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag deze
      vakken aanbiedt:

      1°. kunst (beeldende vormgeving), kunst (muziek), kunst (drama), kunst (dans), muziek, tekenen, handvaardigheid of
      textiele vormgeving: 480;

      2°. filosofie: 480;

      3°. Franse taal en literatuur, Duitse taal en literatuur, Spaanse taal en literatuur, Russische taal en literatuur,
      Italiaanse taal en literatuur, Arabische taal en literatuur, Turkse taal en literatuur, Chinese taal en cultuur,
      Friese taal en cultuur met een normatieve studielast van 480 uren, Latijnse taal en cultuur of Griekse taal en
      cultuur met een normatieve studielast van 760 uren; of

      d. een van de volgende maatschappelijke profielkeuzevakken, ter keuze van de leerling, voor zover het bevoegd gezag
      deze vakken aanbiedt:

      1°. aardrijkskunde: 440;

      2°. maatschappijwetenschappen: 440; of

      3°. economie: 480.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.6
  - number: '2.7'
    text: |-
      Het vrije deel van een profiel in vwo omvat ter keuze van de leerling ten minste een vak uit het geheel van:

      a. de vakken, genoemd in de [artikelen 2.5][ref1] en [2.6][ref2], voor zover deze vakken niet al deel uitmaken van
      het profiel en het bevoegd gezag deze vakken als onderdeel van het vrije deel aanbiedt, met dien verstande dat:

      1°. binnen een profiel zijn toegestaan de combinatie van wiskunde A en wiskunde B of de combinatie van wiskunde B
      en wiskunde C, en dat wiskunde D kan worden gekozen indien wiskunde B al deel uitmaakt van het profiel;

      2°. kunst (beeldende vormgeving) niet gekozen kan worden in combinatie met tekenen, handvaardigheid of textiele
      vormgeving, dat kunst (muziek) niet gekozen kan worden in combinatie met muziek;

      3°. van de vakken tekenen, handvaardigheid en textiele vormgeving er een deel kan uitmaken van het profiel;

      b. de volgende vakken, met de daarbij vermelde normatieve studielast, uitgedrukt in uren, voor zover het vak niet
      al eerder is gevolgd of niet al deel uitmaakt van het profiel en voor zover het bevoegd gezag deze vakken in het
      vrije deel aanbiedt:

      1°. Spaanse taal en literatuur (elementair): 480;

      2°. Russische taal en literatuur (elementair): 480;

      3°. Italiaanse taal en literatuur (elementair): 480;

      4°. Arabische taal en literatuur (elementair): 480;

      5°. Turkse taal en literatuur (elementair): 480; en

      6°. Chinese taal en cultuur (elementair): 480;

      c. de volgende vakken, met de daarbij vermelde normatieve studielast uitgedrukt in uren, voor zover het bevoegd
      gezag deze vakken als onderdeel van het vrije deel aanbiedt:

      1°. kunst (algemeen): 200;

      2°. algemene natuurwetenschappen: 120; en

      3°. bewegen, sport en maatschappij: 440;

      d. door het bevoegd gezag vast te stellen vakken en andere programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.7
