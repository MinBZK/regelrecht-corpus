  - number: '2.59'
    text: |-
      1 Leerlingen van zestien en zeventien jaar die naar het oordeel van het bevoegd gezag een grotere
      kans hebben een diploma of volgend diploma als bedoeld in [artikel 2.58, tweede lid, van de wet][ref1]
      te behalen indien zij vavo volgen in plaats van voortgezet onderwijs, kunnen op grond
      [artikel 2.99, eerste lid, aanhef en onderdeel b, van de wet][ref2] deelnemen aan een opleiding vavo en die
      opleiding met een examen afsluiten.

      2 Het eerste lid is van overeenkomstige toepassing op leerlingen van achttien jaar of ouder die ononderbroken
      in het voortgezet onderwijs of daarmee op grond van de [LPW][ref3] of de [LPW BES][ref4] gelijkgesteld onderwijs
      ingeschreven zijn geweest, voor ten hoogste de periode van de resterende cursusduur van de opleiding waarvoor zij
      aan de school zijn ingeschreven, vermeerderd met een jaar.

      3 Het eerste lid is van overeenkomstige toepassing op leerlingen van zestien en zeventien jaar, die naar het
      oordeel van het bevoegd gezag grotere kans krijgen om vervolgonderwijs met gunstig resultaat te volgen door,
      aansluitend op hun met goed gevolg afgelegd eindexamen vwo, havo of vmbo in de theoretische of gemengde leerweg,
      aan het vavo onderwijs te volgen en examen te doen in een of meerdere vakken op het niveau van de schoolsoort of
      leerweg waarin zij reeds met goed gevolg eindexamen hebben afgelegd, voor ten hoogste de duur van een schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.99
      [ref3]: https://wetten.overheid.nl/BWBR0002628
      [ref4]: https://wetten.overheid.nl/BWBR0030281
