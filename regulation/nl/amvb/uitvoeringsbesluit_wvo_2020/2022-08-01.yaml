  - number: '3.8'
    text: |-
      1 De examenkandidaat is bij het eindexamen vrijgesteld van het vak waarvoor:

      a. een vrijstelling geldt van het volgen van onderwijs op grond van de [artikelen 2.8][ref1], [2.14][ref2] of
      [2.32][ref3]; of

      b. een ontheffing is verleend voor het volgen van onderwijs op grond van
      [artikel 2.33, vierde lid, van de wet][ref4] of de [artikelen 2.9][ref5] of [2.33][ref6].

      2 In geval van een ontheffing in vwo (atheneum) voor het volgen van onderwijs in een tweede moderne vreemde taal
      op grond van [artikel 2.9, eerste lid][ref7], wordt het eindexamen in de taal vervangen door het eindexamen in het
      vak, bedoeld in het tweede lid van dat artikel.

      3 In geval van een ontheffing in vmbo op grond van [artikel 2.33, eerste lid][ref8], voor het volgen van onderwijs
      in Franse of Duitse taal, wordt het eindexamen in de taal vervangen door het eindexamen in het vak, bedoeld in het
      tweede lid van dat artikel.


