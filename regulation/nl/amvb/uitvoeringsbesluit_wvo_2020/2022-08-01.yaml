  - number: '3.65'
    text: |-
      1 Onverminderd de toepasselijkheid van [artikel 3.8][ref1] op het eindexamen bij een instelling voor educatie en
      beroepsonderwijs, is de examenkandidaat aan een instelling voor educatie en beroepsonderwijs die eerder op grond
      van de [artikelen 3.8][ref2], [3.64][ref3] of het tweede en derde lid, bij het eindexamen is vrijgesteld in een
      vak, bij het eindexamen vrijgesteld van dat vak.

      2 De examenkandidaat aan een instelling voor educatie en beroepsonderwijs, aan wie eerder op grond van
      [artikel 3.66][ref4] of [artikel 4.8][ref5] een bewijs van ontheffing is verleend voor het eindexamen of
      staatsexamen in een vak, is bij het eindexamen vrijgesteld van dat vak.

      3 Op grond van de bevoegdheid, bedoeld in [artikel 9.3, eerste lid, van de wet][ref6], is
      de examenkandidaat aan een instelling voor educatie en beroepsonderwijs, die op grond van
      [artikel 12 van de Beleidsregel verstrekking licentie Topsporttalentschool VO 2020][ref7] of
      [artikel 13 van de Beleidsregel verstrekking DAMU-licentie VO 2020][ref8], ontheffing heeft verkregen voor een vak
      als genoemd in die artikelen, bij het eindexamen vrijgesteld van dat vak.

      4 Een bewijs van ontheffing als bedoeld in het tweede lid wordt bij de vaststelling van de uitslag van het
      eindexamen betrokken, indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen tien jaar zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.8
