  - number: '6.14'
    text: |-
      1 Onze Minister gaat gedurende het kalenderjaar waarop de verminderingen op de bekostiging, bedoeld in
      [artikel 6.4, eerste lid][ref1], betrekking hebben, per maand over tot een voorlopige inhouding op de bekostiging.

      2 De definitieve vaststelling van de verminderingen, bedoeld in het eerste lid, vindt zo snel mogelijk na afloop
      van het desbetreffende kalenderjaar plaats.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop toepassing wordt gegeven aan
      het in mindering brengen van bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6.4'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.15'
    text: |-
      Onze Minister kan op aanvraag van het bevoegd gezag van een school of scholengemeenschap met een bijzondere
      inrichting van het onderwijs besluiten dat wordt afgeweken van de [artikelen 6.1 tot en met 6.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '6.1'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.16'
    text: |-
      1 De boekhouding van een niet door een gemeente in stand gehouden school is zodanig ingericht dat op doelmatige
      wijze informatie kan worden verkregen over het gevoerde financiële beheer.

      2 Het boekjaar is gelijk aan het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.16
  - number: '6.17'
    text: |-
      1 Het bevoegd gezag verstrekt op verzoek van Onze Minister nadere financiële informatie met betrekking tot de
      school.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de financiële informatie wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.17
  - number: '6.18'
    text: |-
      1 Het bevoegd gezag stelt jaarlijks tijdig voor het komende begrotingsjaar een begroting vast voor de school.

      2 De begroting bevat een raming van de baten en lasten van de school en is sluitend. De in de begroting voorziene
      baten uit de van het Rijk te ontvangen bekostiging komen overeen met de voor het desbetreffende jaar door Onze
      Minister vastgestelde bekostiging.

      3 Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.

      4 Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden
      overeenkomstig door het bevoegd gezag vastgestelde regels.

      5 Het bevoegd gezag zendt Onze Minister op diens verzoek de vastgestelde begroting.

      6 Bij ministeriële regeling kan een model voor de inrichting van de begroting worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.18
  - number: '6.19'
    text: |-
      1 Het jaarverslag, bedoeld in [artikel 5.46 van de wet][ref1], wordt ingericht overeenkomstig bij ministeriële
      regeling vast te stellen regels.

      2 Het bevoegd gezag stelt jaarlijks ten behoeve van de school een jaarverslag vast over het afgelopen jaar.

      3 In de jaarrekening legt het bevoegd gezag verantwoording af over het financieel beheer. Uit de jaarrekening
      blijkt dat sprake is van een rechtmatige aanwending van de rijksbekostiging. De jaarrekening omvat ook de gegevens
      die van belang zijn voor de verantwoording met betrekking tot de besteding van toegekende aanvullende bekostiging.

      4 Het bevoegd gezag zendt het vastgestelde jaarverslag voor 1 juli van het jaar volgend op het boekjaar aan Onze
      Minister. Het jaarverslag gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het
      bevoegd gezag aangewezen accountant. Bij de aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze
      Minister op diens verzoek inzage wordt geboden in de controlerapporten en de controledossiers van de accountant.

      5 Indien het bevoegd gezag meer dan één school in stand houdt, wordt voor deze scholen een gezamenlijke balans en
      een gezamenlijke exploitatierekening vastgesteld. Bij de jaarrekening is een bijlage gevoegd die inzicht biedt in
      het bestedingspatroon voor de afzonderlijke scholen van het bevoegd gezag.

      6 Bij ministeriële regeling wordt een model voor de inrichting van de jaarrekening vastgesteld.

      7 Bij ministeriële regeling kan een leidraad worden vastgesteld over de inrichting en de uitvoering van de controle
      door de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.46
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5.46'
  - number: '6.20'
    text: |-
      1 Indien aan het bevoegd gezag van een school een aanvullende bekostiging is verstrekt onder de voorwaarde dat deze
      bekostiging voor het bij de verstrekking aangegeven doel wordt besteed, blijkt uit de jaarrekening van de school in
      hoeverre deze bekostiging voor dat doel is besteed.

      2 Indien verrekening plaatsvindt of zal plaatsvinden van het daadwerkelijk bestede bedrag met de vastgestelde
      aanvullende bekostiging, maakt het bevoegd gezag in de desbetreffende jaarrekening melding van het daadwerkelijk
      bestede bedrag.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.20
  - number: '6.21'
    text: |-
      1 Onverminderd de bevoegdheid van de inspectie op grond van de [WOT][ref1] kan Onze Minister een onderzoek
      instellen of doen instellen naar:

      a. de jaarverslaggeving;

      b. de gegevens die noodzakelijk zijn voor de vaststelling van de bekostiging;

      c. de rechtmatigheid van de bestedingen;

      d. de doelmatigheid van het financiële beheer van de school.

      2 Onze Minister kan besluiten tot het aanbrengen van correcties op de bekostiging indien uit een onderzoek als
      bedoeld in het eerste lid blijkt dat de bekostiging van een school onjuist is vastgesteld. Onze Minister doet het
      bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie op de bekostiging.

      3 Onverminderd [artikel 4:49 Awb][ref2], kan Onze Minister besluiten dat een gedeelte van de bekostiging niet ten
      laste komt van het Rijk of dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, indien
      uit het jaarverslag, bedoeld in [artikel 5.46, eerste lid, van de wet][ref3], uit de verklaring van de accountant,
      bedoeld in [artikel 5.46, vierde lid, van de wet][ref4] of uit een op grond van het eerste lid ingesteld onderzoek
      blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel5.46
      [ref4]: https://wetten.overheid.nl/BWBR0044212#Artikel5.46
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0013800
      - id: ref2
