  - number: '3.12'
    text: |-
      1 In de gevallen, bedoeld in [artikel 3.17][ref1], wordt het schoolexamen in het vak waarop dit schoolexamen
      betrekking heeft, afgesloten tien werkdagen voor de afname van het centraal examen in dat vak.

      2 Indien het centraal examen overeenkomstig [artikel 2.56, vierde lid, van de wet][ref2] wordt afgesloten in
      het voorlaatste leerjaar of het daaraan voorafgaande leerjaar, wordt het schoolexamen in dat vak of die vakken
      afgesloten voordat in dat leerjaar het centraal examen in dat vak of die vakken aanvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.17
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
