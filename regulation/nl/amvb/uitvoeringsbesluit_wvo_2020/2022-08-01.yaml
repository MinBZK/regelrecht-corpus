  - number: '2.61'
    text: |-
      In afwijking van [artikel 7.9, eerste lid, van de wet][ref1] kan in geval van samenwerking het onderwijs bij een
      instelling voor educatie en beroepsonderwijs ook worden gegeven door docenten van de instelling voor educatie en
      beroepsonderwijs waarmee het bevoegd gezag van de school een samenwerkingsovereenkomst heeft gesloten als bedoeld
      in [artikel 2.100 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.9
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.100
