  - number: '2.8'
    text: |-
      1 De leerling van een school voor vwo met het diploma havo is vrijgesteld van het volgen van onderwijs in het vak
      maatschappijleer en als het gaat om een atheneum ook in het vak culturele en kunstzinnige vorming.

      2 De leerling van een school voor vwo met het diploma havo of het diploma vmbo die in plaats van een
      vak voor die schoolsoort of als extra vak examen heeft afgelegd in een overeenkomstig vak, genoemd in de
      [artikelen 2.5 tot en met 2.7][ref1], is vrijgesteld van het volgen van onderwijs in dit vak.

      3 De leerling van een atheneum is vrijgesteld van het volgen van onderwijs in het vak culturele en kunstzinnige
      vorming, indien Latijnse taal en cultuur of Griekse taal en cultuur, of beide, deel uitmaken van het profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.8
    references:
