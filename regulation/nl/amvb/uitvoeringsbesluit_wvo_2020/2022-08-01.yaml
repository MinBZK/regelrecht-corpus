        artikel: '2.10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.14'
    text: |-
      De leerling van een school voor havo met een diploma vmbo die in plaats van een vak voor het vmbo
      of als extra vak examen heeft afgelegd in een overeenkomstig vak voor havo of vwo, genoemd in de
      [artikelen 2.10 tot en met 2.12 ][ref1]respectievelijk de [artikelen 2.5 tot en met 2.7][ref2], is vrijgesteld van
      het volgen van onderwijs in dit vak.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.10
