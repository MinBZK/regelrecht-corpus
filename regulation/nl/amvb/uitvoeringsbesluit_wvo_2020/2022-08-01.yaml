      1 Onze Minister stelt jaarlijks voor elke school of scholengemeenschap de hoogte van de bekostiging, bedoeld in
      [artikel 5.6 van de wet][ref1] vast.

      2 Onze Minister stelt voor elke school of scholengemeenschap die daarvoor in aanmerking komt het bedrag van de
      aanvullende bekostiging, bedoeld in de [artikelen 5.9][ref2] en [5.10][ref3] vast.

      3 De bekostiging bedoeld in het eerste lid komt tot stand door het aantal vestigingen, bedoeld in
      [artikel 6.1, eerste lid][ref4], en het aantal leerlingen, bedoeld in artikel 8, te vermenigvuldigen met de
      bedragen per vestiging en per leerling, bedoeld in [artikel 5.4, eerste lid, van de wet][ref5], waarbij de uitkomst
      van deze vermenigvuldigingen bij elkaar wordt opgeteld.


