  - number: '4.3'
    text: |-
      1 De financiële bijdrage, bedoeld in [artikel 2.72, vierde lid, van de wet][ref1], voor toelating tot het afleggen
      van het staatsexamen bedraagt € 720.

      2 De financiële bijdrage voor toelating tot het afleggen van een deelstaatsexamen voor een vak waarin zowel het
      college-examen als het centraal examen wordt afgelegd bedraagt € 144.

      3 De financiële bijdrage voor toelating tot het afleggen van deelstaatsexamen voor een vak waarin alleen het
      centraal examen of alleen het college-examen wordt afgelegd, bedraagt € 71.

      4 De bedragen, genoemd in het eerste, tweede en derde lid, kunnen bij ministeriële regeling worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.

      5 Bij ministeriële regeling wordt de financiële bijdrage vastgesteld die per kalenderjaar ten hoogste is
      verschuldigd voor toelating tot het afleggen van deelstaatsexamens.

      6 De verschuldigde financiële bijdrage wordt voldaan op de wijze en voor de datum, bepaald door het college.

      7 In afwijking van het eerste lid bedraagt de financiële bijdrage, bedoeld in dat lid, in 2022 € 685.

      8 In afwijking van het tweede lid bedraagt de financiële bijdrage, bedoeld in dat lid, in 2022 € 137.

      9 In afwijking van het derde lid bedraagt de financiële bijdrage, bedoeld in dat lid, in 2022 € 68.

      10 Het zevende tot en met negende lid en dit lid vervallen met ingang van 1 januari 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.72
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.3
