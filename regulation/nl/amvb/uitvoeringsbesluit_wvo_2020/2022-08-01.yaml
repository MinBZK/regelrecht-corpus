  - number: '3.58'
    text: |-
      1 De maatregelen, bedoeld in [artikel 2.61, eerste lid, van de wet][ref1], die de rector of directeur jegens een
      examenkandidaat kan nemen, zijn:

      a. het toekennen van het cijfer 1 voor een toets van het schoolexamen of het centraal examen;

      b. het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen of het
      centraal examen;

      c. het ongeldig verklaren van een of meer toetsen van het al afgelegde deel van het schoolexamen of het centraal
      examen; of

      d. het bepalen dat het diploma en de cijferlijst alleen kunnen worden uitgereikt na een hernieuwd examen in door de
      rector of directeur aan te wijzen onderdelen.

      2 De maatregelen, bedoeld in het eerste lid, kunnen afhankelijk van de aard van de onregelmatigheid afzonderlijk of
      in combinatie met elkaar genomen worden.

      3 Indien een hernieuwd examen als bedoeld in het eerste lid, onderdeel d, betrekking heeft op een of meer
      onderdelen van het centraal examen legt de examenkandidaat dat examen af in een volgend tijdvak van het centraal
      examen.

      4 De rector of directeur zendt de beslissing waarbij een maatregel als bedoeld in het eerste lid wordt genomen aan
      de examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift aan de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.61
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.58
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.61'
  - number: '3.59'
    text: |-
      1 De commissie van beroep voor de eindexamens stelt bij haar beslissing op een bezwaarschrift tegen een maatregel
      als bedoeld in [artikel 3.58][ref1] zo nodig vast op welke wijze de examenkandidaat alsnog in de gelegenheid zal
      worden gesteld het eindexamen geheel of gedeeltelijk af te leggen, onverminderd [artikel 3.58, derde lid][ref2].

      2 De commissie zendt haar beslissing aan de examenkandidaat en zijn wettelijke vertegenwoordigers, en in afschrift
      aan de rector of directeur en aan de inspectie.

      3 De samenstelling en het adres van de commissie van beroep voor de eindexamens worden vermeld in het
      examenreglement, bedoeld in [artikel 2.60, eerste lid, van de wet][ref3].


