        bwb_id: BWBR0045787
        artikel: '3.34'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.73'
    text: |-
      De examencommissie vavo reikt aan de examenkandidaat die aan een instelling voor educatie en beroepsonderwijs
      eindexamen heeft afgelegd en aan wie op grond van de uitslag niet een diploma kan worden uitgereikt of die
      eindexamen heeft afgelegd in een of meer vakken, een certificaat uit, waarop voor zover van toepassing zijn
      vermeld:

      a. het vak of de vakken waarvoor de examenkandidaat een eindcijfer 6 of hoger heeft behaald;

      b. voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk; en

      c. voor het vmbo het thema van het profielwerkstuk, indien beoordeeld met «goed» of «voldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.73
  - number: '3.74'
    text: |-
      Onze Minister kan toestaan dat wordt afgeweken van dit hoofdstuk voor experimenten met een andere inrichting van
      het eindexamen dan in dit hoofdstuk geregeld.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.74
  - number: '4.1'
    text: |-
      1 Het college stelt de aanmeldingsprocedure voor het staatsexamen en het deelstaatsexamen vast.

      2 De aanmelding heeft betrekking op:

      a. het verkrijgen van toelating tot het afleggen van het staatsexamen of het deelstaatsexamen ten overstaan van het
      college; of

      b. het overleggen aan het college van de bewijsstukken, bedoeld in
      [artikel 2.72, tweede lid, onderdeel b, van de wet][ref1], ter verkrijging van het staatsexamendiploma, al dan niet
      in combinatie met het afleggen van het staatsexamen in een of meer vakken ten overstaan van het college.

      3 Onze Minister maakt de aanmeldingsprocedure tijdig bekend, voert die uit en bevestigt schriftelijk de aanmelding
      aan de examenkandidaat.

      4 Uit de aanmelding voor het staatsexamen blijkt ook of sprake is van een of meer vrijstellingen of ontheffingen
      als bedoeld in de [artikelen 4.5][ref2], [4.6][ref3], [4.7][ref4] of [4.8][ref5].

      5 Indien de examenkandidaat minderjarig is, ondertekenen ook de wettelijke vertegenwoordigers de aanmelding.


