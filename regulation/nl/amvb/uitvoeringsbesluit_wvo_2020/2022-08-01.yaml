  - number: '3.50'
    text: |-
      Op het certificaat, bedoeld in [artikel 2.58, eerste lid, onderdeel d, van de wet][ref1], voor de voor het
      eindexamen vmbo afgewezen examenkandidaat die de school verlaat, worden vermeld:

      a. het vak of de vakken waarvoor de examenkandidaat een eindcijfer 6 of hoger heeft behaald; en

      b. het thema van het profielwerkstuk, indien beoordeeld met «goed» of «voldoende».


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.50
    references:
