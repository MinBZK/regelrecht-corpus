  - number: '3.61'
    text: |-
      Het bevoegd gezag stelt de vavo-student in de gelegenheid af te leggen:

      a. het volledig eindexamen vwo, havo of vmbo theoretische leerweg; of

      b. het eindexamen vwo, havo of vmbo theoretische leerweg in een of meer vakken.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.61
  - number: '3.62'
    text: |-
      1 Het volledig eindexamen vwo (atheneum), havo en vmbo theoretische leerweg aan een instelling voor educatie en
      beroepsonderwijs omvat de vakken van het eindexamen vwo (atheneum), havo, respectievelijk vmbo theoretische leerweg
      aan een school, met uitzondering van de volgende vakken van het gemeenschappelijk deel:

      a. lichamelijke opvoeding;

      b. voor vwo (atheneum) en havo: culturele en kunstzinnige vorming; en

      c. voor vmbo theoretische leerweg: de vakken behorende tot de beeldende vorming, muziek, dans of drama.

      2 Het volledig eindexamen vwo (gymnasium) aan een instelling voor educatie en beroepsonderwijs omvat de vakken
      van het eindexamen vwo (gymnasium) aan een school, met uitzondering van het vak lichamelijke opvoeding van het
      gemeenschappelijk deel.

      3 Het volledig eindexamen vwo (atheneum), havo en vmbo theoretische leerweg aan een instelling voor educatie en
      beroepsonderwijs omvat ook het profielwerkstuk.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.62
  - number: '3.63'
    text: |-
      1 Indien de examenkandidaat aan een instelling voor educatie en beroepsonderwijs eindexamen aflegt in een vak
      of in een aantal vakken die samen geen eindexamen vormen, kan de examenkandidaat daaraan voorafgaand aan de
      examencommissie vavo kenbaar maken, het volledig eindexamen te willen afsluiten.

      2 De examenkandidaat kan het volledige eindexamen afsluiten door voor de ontbrekende vakken in aanvulling op de
      cijferlijst voor die vakken aan de examencommissie vavo een of meer van de volgende bewijsstukken over te leggen:

      a. een door een school uitgereikte cijferlijst als bedoeld in [2.58, eerste lid van de wet][ref1] of
      [artikel 3.39][ref2], uitgereikt in een eerder schooljaar;

      b. een door een andere instelling voor educatie en beroepsonderwijs uitgereikte cijferlijst als bedoeld in
      [artikel 2.58, eerste lid, van de wet][ref3] of [artikel 3.72][ref4];

      c. een resultatenlijst als bedoeld in [artikel 7.4.6, derde lid, WEB][ref5] of [7.4.8, tweede lid, WEB BES][ref6];

      d. een cijferlijst van een staatsexamen of deelstaatsexamen als bedoeld in [artikel 4.25][ref7] of
      [artikel 4.26][ref8]; of

      e. een bewijs van ontheffing als bedoeld in [artikel 3.67, derde lid][ref9], of [artikel 4.9, derde lid][ref10].

      3 Een cijferlijst wordt bij de vaststelling van de uitslag van het eindexamen betrokken, indien na het jaar waarin
      deze is vastgesteld, nog geen tien jaar zijn verstreken. Een bewijs van ontheffing wordt bij de vaststelling van
      de uitslag betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is
      vastgesteld, nog geen tien jaar zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.58
