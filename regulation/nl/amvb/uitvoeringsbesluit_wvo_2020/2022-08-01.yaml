        artikel: '3.13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.15'
    text: |-
      1 Voor de aanvang van het centraal examen verstrekt de rector of directeur aan de examenkandidaat:

      a. het cijfer of de cijfers voor het schoolexamen;

      b. de beoordeling van de vakken waarvoor geen cijfer wordt vastgesteld;

      c. de beoordeling van het profielwerkstuk in het vmbo; en

      d. een overzicht van de behaalde resultaten van alle onderdelen in het examendossier, bedoeld in
      [artikel 3.11][ref1].

      2 De rector of directeur en de examensecretaris tekenen voor de verstrekking van de in het eerste lid genoemde
      cijfers, beoordelingen en overzicht.

      3 De examenkandidaat tekent voor ontvangst van de in het eerste lid genoemde cijfers, beoordelingen en overzicht.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3.11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '3.16'
    text: |-
      1 De examenkandidaat die eindexamen vmbo aflegt kan het schoolexamen maatschappijleer behorend tot het
      gemeenschappelijk deel van de leerwegen opnieuw afleggen, indien hij voor dat vak een eindcijfer heeft behaald
      lager dan 6.

      2 Het bevoegd gezag van een school voor mavo of vbo kan bepalen dat een examenkandidaat voor een of meer andere
      vakken dan maatschappijleer het schoolexamen waarin geen centraal examen wordt afgenomen, opnieuw kan afleggen.

      3 Het herexamen omvat door het bevoegd gezag aangegeven onderdelen van het examenprogramma.

      4 Het bevoegd gezag stelt vast hoe het cijfer van het herexamen wordt bepaald.

      5 Het hoogste cijfer voor een vak, behaald bij het schoolexamen of het herexamen, is het definitieve cijfer van het
      schoolexamen in dat vak.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 Het college kan bepalen dat een centraal examen in een vak wordt afgenomen op een tijdstip dat is gelegen voor de
      aanvang van het eerste tijdvak.

      2 Het college kan voor een centraal examen in een vak een afnameperiode instellen waarbinnen het bevoegd gezag zelf
      de afnametijdstippen bepaalt. Deze afnameperiode vangt niet eerder aan dan op 1 april van dat examenjaar en omvat
      het eerste en tweede tijdvak van dat examenjaar.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.17
  - number: '3.18'
    text: |-
      De rector of directeur deelt jaarlijks voor 1 november aan Onze Minister mee hoeveel examenkandidaten per vak aan
      het centraal examen in het eerste tijdvak zullen deelnemen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.18
  - number: '3.19'
    text: |-
      1 Onze Minister draagt er zorg voor dat de opgaven, bedoeld in
      [artikel 2, onderdeel c, van de Wet College voor toetsen en examens][ref1], tijdig beschikbaar worden gesteld aan
      de rector of directeur van de school.

      2 De rector of directeur draagt er zorg voor, dat de opgaven voor het centraal examen geheim blijven tot de aanvang
      van de toets waarvoor deze opgaven dienen.

      3 Het college kan opgaven aanwijzen waarop het tweede lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '3.20'
    text: |-
      1 De rector of directeur draagt zorg voor het nodige toezicht bij het centraal examen.

      2 Tijdens het centraal examen worden aan de examenkandidaten geen mededelingen van welke aard ook over de opgaven
      gedaan, uitgezonderd mededelingen van het college.

      3 Zij die toezicht hebben gehouden, maken een proces-verbaal op. Zij leveren dit in bij de rector of directeur
      samen met het gemaakte examenwerk.

      4 Een examenkandidaat wordt tot uiterlijk een half uur na de aanvang tot een toets toegelaten.

      5 De aan de examenkandidaten voorgelegde opgaven blijven in het examenlokaal tot het einde van die toets.

      6 Het college kan regels stellen voor de uitvoering van een toets van het centraal examen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.20
  - number: '3.21'
    text: |-
      1 De rector of directeur doet aan de examinator in een vak toekomen:

      a. het gemaakte werk van het centraal examen;

      b. een exemplaar van de opgaven;

      c. de beoordelingsnormen; en

      d. het proces-verbaal van het examen.

      2 De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe.

      3 De examinator drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref2].

      4 De examinator zendt de score en het beoordeelde werk aan de rector of directeur.

      5 Bij digitale examinering met gebruikmaking van de daartoe door het college beschikbaar gestelde programmatuur
      worden de handelingen, bedoeld in dit artikel, digitaal verricht, uitgezonderd de handelingen die betrekking hebben
      op het proces-verbaal.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de beoordeling van het centraal examen door de
      examinator.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '3.22'
    text: |-
      1 Onze Minister maakt een koppeling van scholen en instellingen voor educatie en beroepsonderwijs voor de
      uitvoering van de tweede correctie door gecommitteerden als bedoeld in [artikel 2.56, zesde lid, van de wet][ref1].

      2 Onze Minister maakt de koppeling bekend aan het bevoegd gezag van elke school of elke instelling voor educatie en
      beroepsonderwijs en kan, zo nodig, zelf een gecommitteerde aanwijzen voor een school of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.56
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.56'
  - number: '3.23'
    text: |-
      1 Het bevoegd gezag wijst op grond van de koppeling, bedoeld in [artikel 3.22][ref1], een of meer gecommitteerden
      aan.

      2 Het bevoegd gezag maakt de gecommitteerden, bedoeld in het eerste lid, bekend aan de scholen waarvoor zij de
      tweede correctie verrichten. Zij blijven als gecommitteerde aangewezen tot na de afloop van de herkansing.

      3 Het bevoegd gezag draagt er zorg voor dat de aangewezen gecommitteerde zijn verplichtingen nakomt.

      4 Voor het cspe van het centraal examen vmbo wordt geen gecommitteerde aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.22
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3.22'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.24'
    text: |-
      1 De rector of directeur, bedoeld in [artikel 3.21][ref1], doet onverwijld na de beoordeling door de examinator aan
      de rector of directeur van de gecommitteerde toekomen:

      a. het door de examinator beoordeelde werk van het centraal examen;

      b. een exemplaar van de opgaven;

      c. de beoordelingsnormen;

      d. het proces-verbaal van het examen; en

      e. de regels voor het bepalen van de score, bedoeld in [artikel 3.21, derde lid][ref2].

      2 De rector of directeur van de gecommitteerde doet de documenten, bedoeld in het eerste lid, toekomen aan de
      gecommitteerde.

      3 [Artikel 3.21, tweede, derde, vijfde en zesde lid][ref3], is van overeenkomstige toepassing op de beoordeling
      door de gecommitteerde.

      4 De gecommitteerde voegt bij het gecorrigeerde werk een verklaring over de verrichte correctie. Deze verklaring is
      medeondertekend door het bevoegd gezag van de school waar de gecommitteerde werkzaam is.

      5 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het bepaalde in dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.21
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.21
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.21
