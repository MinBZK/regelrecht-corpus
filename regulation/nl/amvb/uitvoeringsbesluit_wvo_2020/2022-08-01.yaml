      1 Onze Minister maakt het bedrag voor de bekostiging, bedoeld in [artikel 5.6][ref1] en [5.9 van de wet][ref2],
      bekend voorafgaand aan het kalenderjaar waarop dit betrekking heeft.

      2 Indien de verklaring, bedoeld in [artikel 6.12, tweede lid, onderdeel c][ref3], van de accountant daartoe
      aanleiding geeft, wijzigt Onze Minister de bekostiging of aanvullende bekostiging.

      3 Onze Minister kan de bekostiging wijzigen wegens algemene salarismaatregelen of wegens andere al dan niet uit de
      rijksbegroting voortvloeiende maatregelen.


