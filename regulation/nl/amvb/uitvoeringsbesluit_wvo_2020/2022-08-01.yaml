  - number: '2.28'
    text: |-
      1 In het derde leerjaar volgt de leerling in de gemengde leerweg naast de vakken van het gemeenschappelijk deel ten
      minste onderwijs in een beroepsgericht programma als bedoeld in [artikel 3.7, eerste lid, onderdeel d][ref1], en
      vijf algemene vakken waarin eindexamen kan worden afgelegd.

      2 Indien de leerling onderwijs in een derde moderne vreemde taal volgt of heeft gevolgd in enig voorafgaand
      leerjaar, is het aantal algemene vakken, bedoeld in het eerste lid, vier.


