  - number: '3.25'
    text: |-
      1 De examinator en de gecommitteerde stellen in onderling overleg de score voor het centraal examen vast.

      2 Indien de examinator en de gecommitteerde niet tot overeenstemming over de score komen, wordt het geschil
      voorgelegd aan het bevoegd gezag van de gecommitteerde. Het bevoegd gezag van de gecommitteerde kan hierover in
      overleg treden met het bevoegd gezag van de examinator.

      3 Indien het geschil niet kan worden beslecht, wordt hiervan melding gemaakt aan de inspectie. De inspectie
      kan een onafhankelijke corrector aanwijzen. De beoordeling van deze corrector komt in de plaats van de eerdere
      beoordelingen.

      4 De rector of directeur stelt het cijfer voor het centraal examen in een vak vast op grond van de score, bedoeld
      in het eerste lid, of de beoordeling, bedoeld in het derde lid, en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '3.26'
    text: |-
      1 De rector of directeur draagt er zorg voor dat bij het maken van het cspe van een eindexamen vmbo een examinator
      in het vak of programma aanwezig is.

      2 De examinator beoordeelt de prestaties van de examenkandidaat tijdens het maken van de opgaven en legt zijn
      bevindingen van de verrichtingen van de examenkandidaat schriftelijk vast, volgens daartoe door het college gegeven
      richtlijnen.

      3 De examinator beoordeelt het werk zo spoedig mogelijk en past daarbij toe de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1].

      4 De examinator drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref2].

      5 De examinator doet de score en voor zover mogelijk het beoordeelde werk toekomen aan de rector of directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
