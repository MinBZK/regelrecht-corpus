  - number: '4.25'
    text: |-
      1 Op de cijferlijst van de examenkandidaat die is afgewezen voor het staatsexamen worden over de vakken waarin hij
      in dat jaar door het college is geëxamineerd, vermeld:

      a. de cijfers voor het college-examen en het centraal examen;

      b. het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;

      c. het thema en de beoordeling van het profielwerkstuk vmbo;

      d. de eindcijfers voor de examenvakken;

      e. de uitslag van het staatsexamen.

      2 Op de cijferlijst van de examenkandidaat die is geslaagd voor het staatsexamen worden over elk examenvak dat bij
      de bepaling van de uitslag is betrokken vermeld:

      a. de cijfers voor het college-examen, het centraal examen, en in voorkomend geval het schoolexamen;

      b. het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;

      c. het thema en de beoordeling van het profielwerkstuk vmbo;

      d. de vakken waarvoor de examenkandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de
      cijfers voor deze vakken;

      e. de eindcijfers voor de examenvakken; en

      f. de uitslag van het staatsexamen.

      3 Indien een examenkandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste nodig zijn voor
      het behalen van het staatsexamen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de
      cijferlijst vermeld, tenzij de examenkandidaat daartegen bezwaar heeft.

      4 Het college ondertekent de cijferlijst.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.25
  - number: '4.26'
    text: |-
      1 Het college reikt aan de kandidaat die deelstaatsexamen heeft afgelegd een cijferlijst uit waarop zijn vermeld:

      a. de cijfers voor het college-examen en het centraal examen;

      b. het vak of de vakken en het onderwerp of de titel van het profielwerkstuk vwo of havo;

      c. het thema en de beoordeling van het profielwerkstuk vmbo; en

      d. de eindcijfers voor de examenvakken.

      2 Het college ondertekent de cijferlijst voor het deelstaatsexamen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.26
  - number: '4.27'
    text: |-
      Bij het staatsexamen vwo en het staatsexamen havo worden op de cijferlijst vermeld:

      a. vakken waarvoor de examenkandidaat is vrijgesteld op grond van de [artikelen 3.64][ref1] of [4.5][ref2], met
      vermelding van het eerder behaalde cijfer;

      b. vakken waarvoor de examenkandidaat bij het staatsexamen vwo is vrijgesteld op grond van een eerder afgelegd
      examen havo of vmbo waarvan deze vwo-vakken deel uitmaakten, met vermelding van het eerder behaalde cijfer;

      c. vakken waarvoor de examenkandidaat bij het staatsexamen havo is vrijgesteld op grond van een eerder afgelegd
      examen vmbo waarvan deze vakken of de overeenkomstige vakken, bedoeld in [artikel 3.3, tweede lid][ref3], deel
      uitmaakten, met vermelding van het eerder behaalde cijfer;

      d. andere vakken waarvoor de examenkandidaat vrijstelling of ontheffing is verleend, zonder vermelding van een
      cijfer.


