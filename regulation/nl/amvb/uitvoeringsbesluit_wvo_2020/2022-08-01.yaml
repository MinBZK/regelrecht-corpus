  - number: '3.11'
    text: |-
      1 Het schoolexamen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      schoolexamen zoals gedocumenteerd in een door het bevoegd gezag gekozen vorm.

      2 Het examendossier voor het vmbo theoretische leerweg en gemengde leerweg omvat ook de resultaten die de leerling
      heeft behaald voor de vakken, bedoeld in [artikel 2.19][ref1] onderscheidenlijk [artikel 2.28][ref2], als in die
      vakken geen eindexamen is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.28
