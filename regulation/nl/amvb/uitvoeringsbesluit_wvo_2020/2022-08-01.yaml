  - number: '4.23'
    text: |-
      1 De examenkandidaat die van zijn recht op herkansing als bedoeld in [artikel 4.22][ref1] gebruik wil maken,
      stelt het college binnen acht dagen na de bekendmaking, bedoeld in [artikel 4.20, vijfde lid][ref2], of
      [artikel 4.21, zevende lid][ref3], schriftelijk hiervan in kennis, onder vermelding van het vak waarin hij opnieuw
      wil deelnemen aan het college-examen en het vak waarin hij opnieuw wil deelnemen aan het centraal examen.

      2 Indien de examenkandidaat het college niet overeenkomstig het eerste lid in kennis stelt, is hij alsnog afgewezen
      voor het staatsexamen.

      3 Het college bevestigt zo spoedig mogelijk schriftelijk aan de examenkandidaat de ontvangst van de kennisgeving,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.22
