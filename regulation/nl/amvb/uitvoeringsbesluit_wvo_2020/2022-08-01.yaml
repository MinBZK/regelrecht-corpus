  - number: '3.66'
    text: |-
      1 Het college kan op aanvraag van de examenkandidaat aan een instelling voor educatie en beroepsonderwijs bij
      het eindexamen ontheffing verlenen voor een vak, indien de examenkandidaat op grond van eerder gevolgd onderwijs
      aantoonbaar in het bezit is van voldoende kennis en vaardigheden over dat vak.

      2 De ontheffing, bedoeld in het eerste lid, kan worden verleend op basis van een diploma, getuigschrift,
      certificaat of ander bewijsstuk, al dan niet behaald in Nederland, dat door het college wordt aanvaard als
      bewijs van voldoende kennis en vaardigheden. Indien het college dit nodig oordeelt, onderzoekt het college of de
      examenkandidaat in het bezit is van voldoende kennis en vaardigheden.

      3 Het tweede lid is van toepassing indien na het jaar waarin het diploma, getuigschrift, certificaat of ander
      bewijsstuk is vastgesteld, nog geen tien jaar zijn verstreken.

      4 Tot het diploma, getuigschrift, certificaat en ander bewijsstuk, bedoeld in het tweede lid, behoren in elk geval
      die van het Internationaal Baccalaureaat, het Europees Baccalaureaat en die van het overeenkomstige onderwijs in
      een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.66
  - number: '3.67'
    text: |-
      1 De aanvrager voegt bij een aanvraag voor een ontheffing als bedoeld in [artikel 3.66][ref1]:

      a. een gewaarmerkt afschrift van gegevens uit de basisregistratie personen; en

      b. een gewaarmerkte kopie van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop de aanvraag om
      ontheffing berust.

      2 Indien het college de gevraagde ontheffing verleent, verstrekt het college de aanvrager een bewijs van
      ontheffing, en zendt het college Onze Minister een afschrift daarvan.

      3 Het bewijs van ontheffing vermeldt:

      a. de gronden van de ontheffing; en

      b. het tijdstip van het verrichten van de onderwijs- of examenprestatie waarop de ontheffing berust.

      4 Indien van toepassing gaat het bewijs van ontheffing vergezeld van een verklaring over het onderzoek, bedoeld in
      [artikel 3.66, tweede lid][ref2], naar de kennis en vaardigheden van de examenkandidaat, of naar de bewijsstukken,
      bedoeld in dat lid.

      5 Bij ministeriële regeling wordt het model voor het bewijs van ontheffing vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.66
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.66
