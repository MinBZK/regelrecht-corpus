  - number: '2.15'
    text: |-
      Het gemeenschappelijk deel van een profiel in de theoretische leerweg omvat de volgende vakken:

      a. Nederlandse taal;

      b. Engelse taal;

      c. maatschappijleer;

      d. lichamelijke opvoeding; en

      e. ten minste een van de vakken behorende tot de beeldende vorming, muziek, dans, of drama.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.15
  - number: '2.16'
    text: |-
      1 Het profieldeel van het profiel techniek van de theoretische leerweg omvat de volgende vakken:

      a. wiskunde; en

      b. natuur- en scheikunde I.

      2 Het profieldeel van het profiel zorg en welzijn van de theoretische leerweg omvat de volgende vakken:

      a. biologie; en

      b. een van de volgende vakken, ter keuze van de leerling, met dien verstande dat het bevoegd gezag beslist welk
      vak, genoemd onder 2° tot met 4°, wordt of worden aangeboden:

      1°. wiskunde;

      2°. maatschappijkunde;

      3°. geschiedenis en staatsinrichting; of

      4°. aardrijkskunde.

      3 Het profieldeel van het profiel economie van de theoretische leerweg omvat de volgende vakken:

      a. economie; en,

      b. een van de volgende vakken, ter keuze van de leerling, met dien verstande dat het bevoegd gezag beslist welk
      vak, genoemd onder 2° en 3°, wordt of worden aangeboden:

      1°. wiskunde;

      2°. Franse taal; of

      3°. Duitse taal.

      4 Het profieldeel van het profiel groen van de theoretische leerweg omvat de volgende vakken:

      a. wiskunde; en

      b. een van de volgende vakken, ter keuze van de leerling:

      1°. biologie; of

      2°. natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.16
  - number: '2.17'
    text: |-
      1 Het vrije deel van de theoretische leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in [artikel 2.16][ref1], voor zover deze niet al deel uitmaken
      van het profiel;

      b. kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, kunstvakken inclusief
      culturele en kunstzinnige vorming, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie, door
      de leerling te kiezen, met dien verstande dat het bevoegd gezag beslist welke vakken worden aangeboden; en

      c. kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.

      2 Naast het onderwijsprogramma, bedoeld in het eerste lid en in de [artikelen 2.15][ref2], [2.16][ref3] ,
      kan het bevoegd gezag de leerling in de gelegenheid stellen om beroepsgerichte keuzevakken als bedoeld
      in [artikel 2.26, onderdeel b][ref4], te volgen, met dien verstande dat het bevoegd gezag beslist welke
      beroepsgerichte keuzevakken worden aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.16
