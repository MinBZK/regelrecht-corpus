  - number: '4.38'
    text: |-
      1 Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het college aan Onze Minister en aan
      de inspectie een lijst die voor een examenkandidaat die niet is geslaagd voor het staatsexamen, voor zover van
      toepassing, vermeldt:

      a. de vakken waarin examen is afgelegd;

      b. de cijfers van het college-examen;

      c. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      d. de beoordeling en het thema van het profielwerkstuk vmbo;

      e. de cijfers van het centraal examen;

      f. de eindcijfers;

      g. de uitslag van het staatsexamen.

      2 Zo spoedig mogelijk na de vaststelling van de definitieve uitslag zendt het college aan Onze Minister en aan de
      inspectie een lijst die voor een examenkandidaat die is geslaagd voor het staatsexamen, voor zover van toepassing,
      vermeldt:

      a. het profiel of de profielen waarop het examen betrekking heeft;

      b. de vakken die zijn vermeld op de cijferlijst;

      c. de cijfers van het college-examen of het schoolexamen;

      d. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      e. de beoordeling en het thema van het profielwerkstuk vmbo;

      f. de cijfers van het centraal examen;

      g. de eindcijfers;

      h. de vakken waarvoor de kandidaat vrijstelling of ontheffing is verleend, met voor zover van toepassing de cijfers
      voor die vakken;

      i. de uitslag van het staatsexamen.

      3 Zo spoedig mogelijk na de vaststelling van de eindcijfers van de examenkandidaten die deelstaatsexamen hebben
      afgelegd, zendt het college aan Onze Minister en aan de inspectie een lijst die voor een examenkandidaat vermeldt:

      a. de vakken die zijn vermeld op de cijferlijst;

      b. de cijfers van het college-examen;

      c. het vak of de vakken waarop het profielwerkstuk vwo of havo betrekking heeft;

      d. de beoordeling en het thema van het profielwerkstuk vmbo;

      e. de cijfers van het centraal examen;

      f. de eindcijfers.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.38
  - number: '4.39'
    text: |-
      1 Het schriftelijke werk van de examenkandidaat wordt gedurende ten minste zes maanden na afloop van het examen
      bewaard op een door het college te bepalen wijze. Een examenkandidaat die voor een vak centraal examen aflegt
      met geheime opgaven kan over zijn werk gedurende genoemde periode van zes maanden inlichtingen inwinnen bij het
      college. De andere examenkandidaten kunnen gedurende die periode hun schriftelijk werk inzien.

      2 Een door het college ondertekend exemplaar van de lijst, bedoeld in
      [artikel 4.38, eerste, tweede en derde lid][ref1], en de door de examenkandidaat overgelegde documenten, worden
      gedurende ten minste zes maanden na de vaststelling van de uitslag in het archief van het college bewaard.

      3 Het college draagt er zorg voor dat een volledig stel van de bij de centrale examens gebruikte opgaven gedurende
      ten minste zes maanden na de vaststelling van de uitslag bewaard blijft in het archief van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.38
