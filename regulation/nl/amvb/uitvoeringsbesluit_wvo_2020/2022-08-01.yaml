      1 Het Rijk betaalt elke maand van het kalenderjaar aan het bevoegd gezag van een school een gedeelte van de
      bekostiging, bedoeld in [artikel 6.2, eerste lid][ref1], waarop het over dat jaar recht heeft.

      2 Onze Minister kan op de in [artikel 6.2, eerste lid][ref2], bedoelde bekostiging de verwachte bedragen als
      bedoeld in [artikel 5.34, vijfde lid, van de wet][ref3] in mindering brengen.

      3 De aanvullende bekostiging, bedoeld in [artikel 6.2, tweede lid][ref4], wordt in een keer betaald dan wel wordt
      betaald volgens een bij ministeriële regeling te bepalen betaalritme.


