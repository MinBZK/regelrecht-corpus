  - number: '3.39'
    text: |-
      1 Het hoogste cijfer voor een vak, behaald bij het centraal examen of de herkansing, is het definitieve cijfer van
      het centraal examen in dat vak.

      2 Na afloop van de herkansing in het laatste leerjaar stelt de rector of directeur de uitslag definitief vast
      met overeenkomstige toepassing van [artikel 2.57, tweede lid, van de wet][ref1] en de [artikelen 3.34][ref2] en
      [3.35][ref3] en maakt deze schriftelijk aan de examenkandidaat bekend.

      3 Na afloop van een herkansing in het voorlaatste of direct daaraan voorafgaande leerjaar maakt de rector of
      directeur het definitief cijfer schriftelijk aan de examenkandidaat bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.57
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.39
