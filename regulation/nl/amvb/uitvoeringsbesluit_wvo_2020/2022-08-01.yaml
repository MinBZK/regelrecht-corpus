  - number: '4.31'
    text: |-
      1 Een examenkandidaat is geslaagd voor het staatsexamen vmbo theoretische leerweg met toekenning van het judicium
      cum laude indien de examenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel, en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld,

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 4.21][ref1], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      2 Een examenkandidaat is geslaagd voor het staatsexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte
      leerweg met toekenning van het judicium cum laude indien de examenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:

      1°. de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel, en

      2°. het eindcijfer, bedoeld in [artikel 4.21, derde lid][ref2],

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 4.21][ref3], en

      c. alle centrale examens zijn afgelegd binnen de periode van een jaar voorafgaand aan de diplomering.

      3 Een examenkandidaat is geslaagd voor het staatsexamen vmbo gemengde leerweg met toekenning van het judicium cum
      laude indien de examenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel;

      2°. het algemene vak uit het vrije deel of het eindcijfer, bedoeld in [artikel 4.21, vierde lid][ref4]; en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 4.21][ref5].


