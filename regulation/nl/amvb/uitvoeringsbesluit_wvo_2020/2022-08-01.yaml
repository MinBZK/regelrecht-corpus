  - number: '3.7'
    text: |-
      1 Het eindexamen vmbo gemengde leerweg omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elke profiel, genoemd in [artikel 2.24][ref1];

      b. de twee algemene vakken van het profieldeel, genoemd in [artikel 2.25, tweede lid][ref2];

      c. in het vrije deel van het profiel een nog niet in het profieldeel gekozen algemeen vak, genoemd in
      [artikel 2.25, tweede lid][ref3], of [artikel 2.26, onderdeel b][ref4];

      d. een beroepsgericht programma, bestaande uit:

      1°. het profielvak van het profieldeel, bedoeld in [artikel 2.25, eerste lid][ref5]; en

      2°. in het vrije deel twee beroepsgerichte keuzevakken.

      2 In plaats van de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo gemengde leerweg ter keuze van de
      examenkandidaat overeenkomstige vakken als bedoeld in [artikel 2.27][ref6] op het niveau van vwo of havo omvatten,
      voor zover het bevoegd gezag hem dat toestaat en het vervangen vak niet als extra vak als bedoeld in het derde lid
      gekozen wordt.

      3 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo gemengde leerweg ter keuze van de
      examenkandidaat de volgende extra vakken omvatten, voor zover het bevoegd gezag hem dat toestaat en het vak niet
      inhoudelijk overeenkomt met een vak dat al onderdeel is van het eindexamen:

      a. een vak als bedoeld in [artikel 2.26, onderdelen a, b of c][ref7];

      b. een vak dat behoort tot het eindexamen vwo of havo.

      4 Het profielwerkstuk van het eindexamen vmbo gemengde leerweg heeft betrekking op een thema uit een profiel waarin
      de leerling onderwijs volgt.


