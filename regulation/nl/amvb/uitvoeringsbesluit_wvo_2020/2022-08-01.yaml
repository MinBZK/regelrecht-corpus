  - number: '2.24'
    text: |-
      Het gemeenschappelijk deel van een profiel in de gemengde leerweg omvat de volgende vakken:

      a. Nederlandse taal;

      b. Engelse taal;

      c. maatschappijleer;

      d. lichamelijke opvoeding; en

      e. ten minste een van de vakken behorende tot de beeldende vorming, muziek, dans, of drama.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.24
  - number: '2.25'
    text: |-
      1 Het profieldeel van de gemengde leerweg vmbo omvat voor de volgende profielen de daarachter vermelde
      profielvakken:

      a. het profiel bouwen, wonen en interieur; het profielvak bouwen, wonen en interieur;

      b. het profiel produceren, installeren en energie; het profielvak produceren, installeren en energie;

      c. het profiel mobiliteit en transport; het profielvak mobiliteit en transport;

      d. het profiel media, vormgeving en ICT; het profielvak media, vormgeving en ICT;

      e. het profiel maritiem en techniek; het profielvak maritiem en techniek;

      f. het profiel zorg en welzijn; het profielvak zorg en welzijn;

      g. het profiel economie en ondernemen; het profielvak economie en ondernemen;

      h. het profiel horeca, bakkerij en recreatie; het profielvak horeca, bakkerij en recreatie;

      i. het profiel groen; het profielvak groen; en

      j. het profiel dienstverlening en producten: het profielvak dienstverlening en producten.

      2 Naast het profielvak omvat het profieldeel voor de volgende profielen de daarachter vermelde vakken:

      a. het profiel bouwen, wonen en interieur, het profiel produceren, installeren en energie, het profiel mobiliteit
      en transport, het profiel media, vormgeving en ICT:

      1°. wiskunde; en

      2°. natuur- en scheikunde I;

      b. het profiel zorg en welzijn:

      1°. biologie; en,

      2°. ter keuze van de leerling, wiskunde, maatschappijkunde, geschiedenis en staatsinrichting, of aardrijkskunde,
      met dien verstande dat het bevoegd gezag beslist welke van de laatste drie vakken wordt of worden aangeboden;

      c. het profiel economie en ondernemen, en het profiel horeca, bakkerij en recreatie:

      1°. economie; en,

      2°. ter keuze van de leerling, wiskunde, Franse taal of Duitse taal, met dien verstande dat het bevoegd gezag
      beslist welke van de twee laatste vakken wordt aangeboden;

      d. het profiel groen:

      1°. wiskunde; en,

      2°. ter keuze van de leerling, biologie of natuur- en scheikunde I;

      e. het profiel dienstverlening en producten: ter keuze van de leerling twee van de vakken wiskunde, economie,
      biologie en natuur- en scheikunde I.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.25
  - number: '2.26'
    text: |-
      Het vrije deel van een profiel in de gemengde leerweg:

      a. omvat door de leerling te kiezen vakken, genoemd in [artikel 2.25][ref1], voor zover deze niet al deel uitmaken
      van het profiel;

      b. omvat door de leerling te kiezen beroepsgerichte keuzevakken, met dien verstande dat het bevoegd gezag beslist
      welke beroepsgerichte keuzevakken worden aangeboden;

      c. kan omvatten natuur- en scheikunde II, Spaanse taal, Turkse taal, Arabische taal, kunstvakken inclusief
      culturele en kunstzinnige vorming, Friese taal en cultuur, lichamelijke opvoeding 2 en informatietechnologie, door
      de leerling te kiezen; en

      d. kan omvatten door het bevoegd gezag vast te stellen vakken en programmaonderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.25
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.26
