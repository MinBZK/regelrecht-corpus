  - number: '6.8'
    text: |-
      1 Voor het bepalen van de hoogte van de bekostiging van een school of scholengemeenschap worden niet meegeteld de
      leerlingen die:

      a. vanaf het begin van het schooljaar tot de teldatum meer dan de helft van het aantal schooldagen zonder geldige
      reden hebben verzuimd;

      b. al met goed gevolg eindexamen aan een school voor vwo, havo, mavo of vbo hebben afgelegd en zich voorbereiden
      op het opnieuw afleggen van het eindexamen aan een gelijksoortige school, met dien verstande dat het afleggen van
      het eindexamen in een bepaalde leerweg van het vmbo door een leerling die al met goed gevolg het eindexamen heeft
      afgelegd van een andere leerweg van het vmbo niet wordt aangemerkt als het opnieuw afleggen van het eindexamen aan
      een gelijksoortige school;

      c. deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 2.9, tweede lid, van de wet][ref1]; en

      d. voor zover het betreft de bekostiging bedoeld in de [artikelen 5.4, eerste lid, onderdeel b][ref2], en
      [5.5 van de wet][ref3], nieuwkomers zijn die op de teldatum korter dan 1 jaar in Nederland zijn.

      2 Als geldige reden voor verzuim als bedoeld in het eerste lid, onderdeel a, wordt aangemerkt:

      a. ten aanzien van een leerplichtige leerling: een vrijstelling van geregeld schoolbezoek als bedoeld in de
      [LPW][ref4] of de [LPW BES][ref5];

      b. ten aanzien van een niet-leerplichtige leerling: dezelfde gronden als die welke leiden tot vrijstelling van
      geregeld schoolbezoek als bedoeld in onderdeel a.


