  - number: '4.10'
    text: |-
      Het college-examen bestaat uit een examendossier. Het examendossier is het geheel van de onderdelen van het
      college-examen zoals gedocumenteerd in een door het college gekozen vorm.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 Het cijfer van het college-examen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10 gebruikt met de daartussen liggende cijfers met 1 decimaal.

      2 Indien in een vak geen centraal examen wordt afgelegd, wordt het cijfer van het college-examen uitgedrukt in een
      cijfer van 1 tot en met 10, zonder decimaal.

      3 In afwijking van het eerste lid wordt het profielwerkstuk in het vmbo beoordeeld met «goed», «voldoende» of
      «onvoldoende».
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.11
  - number: '4.12'
    text: |-
      Indien bij het college, al dan niet naar aanleiding van mededelingen van de examenkandidaat, twijfel is gerezen
      over de juistheid van de beoordeling van het college-examen in enig vak of onderdeel van een vak, kan het college
      die beoordeling ongeldig verklaren en een nieuw examen in dat vak of onderdeel opleggen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 Onze Minister draagt er zorg voor dat de opgaven, bedoeld in
      [artikel 2, tweede lid, onderdeel c, van de Wet College voor toetsen en examens][ref1], tijdig beschikbaar worden
      gesteld aan het college.

      2 Het college draagt er zorg voor dat de opgaven en correctieregels voor het centraal examen geheim blijven tot de
      aanvang van de toets.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '4.14'
    text: |-
      1 Tijdens een schriftelijke toets van het centraal examen worden aan de examenkandidaat geen mededelingen van welke
      aard ook over de opgaven gedaan, uitgezonderd mededeling van door het college vastgestelde errata.

      2 Het college draagt zorg voor het nodige toezicht bij het centraal examen.

      3 Zij die toezicht hebben gehouden, maken daarvan een proces-verbaal op. Zij leveren dit samen met het gemaakte
      examenwerk in bij het college.

      4 Een examenkandidaat wordt tot uiterlijk een half uur na de aanvang tot de toets toegelaten.

      5 De aan de examenkandidaat voorgelegde opgaven blijven in het examenlokaal tot het einde van die toets.

      6 De examenkandidaat levert de opgaven, de door hem gemaakte aantekeningen en ook andere door hem gemaakte stukken
      in bij een van degenen die toezicht houden. Het college bepaalt in welke gevallen kan worden afgeweken van de
      eerste volzin, en ook in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere stukken,
      bedoeld in die volzin, aan de examenkandidaat worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.14
  - number: '4.15'
    text: |-
      1 Het college draagt er zorg voor dat elk afzonderlijk gemaakte werk voor het centraal examen achtereenvolgens door
      twee door het college aan te wijzen correctoren wordt beoordeeld.

      2 De correctoren kijken het werk onafhankelijk van elkaar na.

      3 De corrector past bij zijn beoordeling de beoordelingsnormen, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref1] toe.

      4 De corrector drukt zijn beoordeling uit in de score, bedoeld in
      [artikel 2, tweede lid, onderdeel d, van de Wet College voor toetsen en examens][ref2].

      5 De corrector zendt de score en het beoordeelde werk aan het college.

      6 Indien dit het college noodzakelijk voorkomt, wordt het oordeel van een derde corrector ingeroepen. Het tweede,
      derde en vierde lid zijn van overeenkomstige toepassing op de derde corrector.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '4.16'
    text: |-
      1 Het college stelt op grond van scores van de correctoren de score voor het centraal examen vast.

      2 Het college stelt het cijfer voor het centraal examen vast op grond van de
      score voor het centraal examen en met inachtneming van de regels, bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Wet College voor toetsen en examens][ref1] voor toetsen en examen.

      3 Bij de vaststelling van het cijfer gebruikt het college een van de cijfers uit de schaal lopend van 1 tot en met
      10, met de tussenliggende cijfers met 1 decimaal.


      [ref1]: https://wetten.overheid.nl/BWBR0025364#Artikel2
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0025364
        artikel: '2'
  - number: '4.17'
    text: |-
      1 Indien een examenkandidaat om een geldige reden, ter beoordeling van het college, is verhinderd bij het
      centraal examen in een of meer vakken in het eerste tijdvak aanwezig te zijn, krijgt hij in het tweede tijdvak de
      gelegenheid het centraal examen voor ten hoogste twee vakken alsnog te voltooien.

      2 Indien een examenkandidaat ook in het tweede tijdvak om een geldige reden, ter beoordeling van het college,
      verhinderd is, of wanneer hij het centraal examen in het tweede tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld in het derde tijdvak het centraal examen te voltooien.

      3 Indien een examenkandidaat ook in het derde tijdvak om een geldige reden, ter beoordeling van het college,
      verhinderd is, of wanneer hij het centraal examen in het derde tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld op een door het college vast te stellen tijdstip het staatsexamen te voltooien.

      4 Voor de aanvang van het derde tijdvak zendt Onze Minister aan de inspectie een opgave van:

      a. de kandidaten;

      b. de in het eerste of tweede tijdvak door hen behaalde cijfers;

      c. voor zover van toepassing de alsnog behaalde cijfers; en

      d. een overzicht van het vak of de vakken waarin elke kandidaat zal worden geëxamineerd.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.17
  - number: '4.18'
    text: |-
      1 Het eindcijfer voor alle vakken van het staatsexamen en het deelstaatsexamen wordt uitgedrukt in een geheel
      cijfer uit de reeks van 1 tot en met 10.

      2 Het college bepaalt het eindcijfer voor een vak op het rekenkundig gemiddelde van het cijfer voor het college-
      examen en het cijfer voor het centraal examen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      3 Indien in een vak alleen een college-examen wordt afgenomen, is het cijfer voor het college-examen ook het
      eindcijfer.

      4 Indien voor een vak alleen een centraal examen wordt afgenomen, vormt het cijfer voor het centraal examen,
      afgerond overeenkomstig het tweede lid, het eindcijfer.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.18
  - number: '4.19'
    text: |-
      1 Het college stelt voor de vaststelling van de uitslag van het staatsexamen vast of de examenkandidaat het
      staatsexamen heeft afgelegd in de voor het staatsexamen voorgeschreven vakken.

      2 Het college kan een examenkandidaat die deelstaatsexamen aflegt toestaan het volledige staatsexamen af te leggen,
      als deze examenkandidaat het college daar voorafgaand aan zijn examens om verzoekt. Het examen wordt in datgeval
      afgerond door voor de ontbrekende vakken, in aanvulling op de cijferlijst voor het deelstaatsexamen, aan het
      college bewijsstukken te over te leggen als bedoeld in het vierde lid.

      3 De uitslag van het staatsexamen wordt vastgesteld:

      a. op grond van de eindcijfers die zijn behaald voor een volledig staatsexamen dat in dat jaar is afgelegd; of

      b. op grond van bewijsstukken als bedoeld in vierde lid.

      4 De bewijsstukken, bedoeld in [artikel 2.72 van de wet][ref1], ter verkrijging van een diploma van het
      staatsexamen zijn:

      a. eindcijfers van deelstaatsexamens die in dat jaar zijn afgelegd;

      b. cijferlijsten als bedoeld in [artikel 2.80, eerste lid, van de wet][ref2] en de [artikelen 4.25][ref3] en
      [4.26][ref4];

      c. cijferlijsten van een school;

      d. resultatenlijsten of cijferlijsten van instellingen voor educatie en beroepsonderwijs;

      e. bewijzen van ontheffing als bedoeld in [artikel 4.9, tweede lid][ref5];

      f. bewijzen van ontheffing als bedoeld in [artikel 3.67, tweede lid][ref6].

      5 Een cijferlijst wordt bij de vaststelling van de uitslag betrokken, indien na het jaar waarin deze is
      vastgesteld, nog geen tien jaar zijn verstreken. Een bewijs van ontheffing wordt bij de vaststelling van de uitslag
      betrokken indien na het jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is vastgesteld,
      nog geen tien jaar zijn verstreken.

      6 Indien dat nodig is om de examenkandidaat te laten slagen voor het staatsexamen, betrekt het college een of
      meer eindcijfers van de vakken niet bij de bepaling van de definitieve uitslag. De overgebleven vakken dienen een
      staatsexamen te vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.72
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.80
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel4.25
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel4.26
      [ref5]: https://wetten.overheid.nl/BWBR0045787#Artikel4.9
      [ref6]: https://wetten.overheid.nl/BWBR0045787#Artikel3.67
