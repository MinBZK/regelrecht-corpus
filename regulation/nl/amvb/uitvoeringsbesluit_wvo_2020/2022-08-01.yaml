      1 Het eindexamen vmbo basisberoepsgerichte leerweg omvat in elk geval:

      a. de vakken van het gemeenschappelijk deel van elk profiel, genoemd in [artikel 2.20][ref1],

      b. de twee algemene vakken van het profieldeel, genoemd in [artikel 2.21, tweede lid][ref2]; en

      c. een beroepsgericht programma, bestaande uit:

      1°. het profielvak, bedoeld in [artikel 2.21, eerste lid][ref3]; en

      2°. in het vrije deel van het profiel vier beroepsgerichte keuzevakken.

      2 In plaats van de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo basisberoepsgerichte leerweg ter
      keuze van de examenkandidaat overeenkomstige vakken als bedoeld in [artikel 2.23, eerste lid][ref4], omvatten op
      het niveau van vwo, havo, vmbo theoretische leerweg of vmbo kaderberoepsgerichte leerweg, voor zover het bevoegd
      gezag hem dat toestaat en het vervangen vak niet als extra vak als bedoeld in het derde lid gekozen wordt.

      3 Naast de vakken, bedoeld in het eerste lid, kan het eindexamen vmbo basisberoepsgerichte leerweg ter keuze van de
      examenkandidaat de volgende extra vakken omvatten, voor zover het bevoegd gezag hem dat toestaat, het vak nog geen
      onderdeel van dat eindexamen is en niet inhoudelijk overeenkomt met een vak dat al onderdeel is van het eindexamen:

      a. een algemeen vak van het profieldeel, bedoeld in [artikel 2.21, tweede lid][ref5], of een beroepsgericht
      keuzevak;

      b. het vak Friese taal en cultuur;

      c. een vak als bedoeld in [artikel 2.4, vierde lid][ref6], dat op grond van dat artikel onderdeel kan zijn van de
      basisberoepsgerichte leerweg;

      d. een algemeen vak dat behoort tot het eindexamen vmbo theoretische leerweg, kaderberoepsgerichte leerweg of
      gemengde leerweg; of

      e. een vak dat behoort tot het eindexamen vwo of havo.

      4 Bij een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref7], omvat het eindexamen vmbo
      basisberoepsgerichte leerweg in elk geval:

      a. het vak Nederlandse taal;

      b. het beroepsgerichte programma, bedoeld in [artikel 2.103, vierde lid, van de wet][ref8], dat onderdeel is van
      het leer-werktraject.

      5 Bij een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref9] kan het eindexamen vmbo
      basisberoepsgerichte leerweg ter keuze van de examenkandidaat ook omvatten een of meer andere vakken van de
      basisberoepsgerichte leerweg waarvan het bevoegd gezag op grond van [artikel 2.103, vierde lid, van de wet][ref10]
      heeft beslist dat zij behoren tot het leer-werktraject van die leerling.


