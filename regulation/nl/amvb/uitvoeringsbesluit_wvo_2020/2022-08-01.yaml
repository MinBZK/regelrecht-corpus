  - number: '4.22'
    text: |-
      1 De examenkandidaat die in enig jaar is afgewezen voor het staatsexamen, heeft recht op herkansing in het derde
      tijdvak van dat jaar, mits de examenkandidaat daardoor alsnog kan slagen voor het staatsexamen.

      2 Indien de examenkandidaat op grond van [artikel 4.17, tweede lid][ref1], in de gelegenheid wordt gesteld in het
      derde tijdvak het centraal examen te voltooien, wordt het recht op herkansing uitgeoefend op een door het college
      te bepalen tijdstip.

      3 Het recht op herkansing houdt in:

      a. het recht om voor een door de examenkandidaat te kiezen vak waarin hij in dat jaar door het college is
      geëxamineerd, opnieuw deel te nemen aan het college-examen, in door het college vast te stellen onderdelen van het
      examenprogramma; en

      b. het recht om voor een door de examenkandidaat te kiezen vak waarin hij in dat jaar door het college is
      geëxamineerd, opnieuw deel te nemen aan het centraal examen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.17
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.22
