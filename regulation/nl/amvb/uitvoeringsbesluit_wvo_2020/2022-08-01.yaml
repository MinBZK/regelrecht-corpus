        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0045787
        artikel: '3.35'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.40'
    text: |-
      1 Op de cijferlijst van het eindexamen worden vermeld:

      a. de cijfers voor het schoolexamen en de cijfers voor het centraal examen;

      b. voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk;

      c. voor vmbo theoretische leerweg en gemengde leerweg het thema en de beoordeling van het profielwerkstuk;

      d. de beoordeling van het vak lichamelijke opvoeding in vwo en havo;

      e. de beoordeling van de vakken lichamelijke opvoeding en kunstvakken inclusief culturele en kunstzinnige vorming
      uit het gemeenschappelijk deel van een leerweg in mavo en vbo;

      f. de beoordeling van de maatschappelijke stage, indien deze onderdeel is van het eindexamen en is beoordeeld met
      «voldoende» of «goed»;

      g. de eindcijfers voor de examenvakken, met inbegrip van het eindcijfer, bedoeld in
      [artikel 3.34, tweede lid][ref1], of [artikel 3.35, derde lid][ref2]; en

      h. de uitslag van het eindexamen, bedoeld in [artikel 2.57, tweede lid, van de wet][ref3].

      2 Indien een examenkandidaat in meer vakken examen heeft afgelegd dan in de vakken die ten minste samen een
      eindexamen vormen, worden de vakken die niet bij de bepaling van de uitslag zijn betrokken, op de cijferlijst
      vermeld, tenzij de examenkandidaat daartegen bedenkingen heeft geuit.

      3 De rector of directeur en de examensecretaris ondertekenen de cijferlijst.

      4 Indien de examenkandidaat in een bepaald jaar is geslaagd voor het eindexamen, draagt de rector of directeur
      er op verzoek van de examenkandidaat zorg voor dat de behaalde cijfers voor de vakken waarin in datzelfde jaar
      eindexamen in een of meer vakken of deelstaatsexamen is afgelegd, worden vermeld op de cijferlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.57
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.40
    references:
