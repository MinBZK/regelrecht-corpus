  - number: '9.2'
    text: |-
      1 In de [artikelen 2.3][ref1], [2.4][ref2] en [2.33][ref3] wordt voor «Duitse taal» telkens gelezen «Spaanse taal»
      en wordt voor «Spaanse taal» telkens gelezen «Papiaments, Duitse taal».

      2 In de [artikelen 2.5, eerste lid][ref4], [2.6, derde lid][ref5], en [2.11, derde en vierde lid][ref6], wordt voor
      «Franse taal en literatuur» telkens gelezen «Papiaments, Franse taal en literatuur».

      3 In aanvulling op de [artikelen 2.17][ref7] en [2.26][ref8] kan het vrije deel van de theoretische leerweg en van
      de gemengde leerweg ook het vak Papiaments omvatten.

      4 In aanvulling op [artikel 2.23][ref9] kan het bevoegd gezag de leerling in een beroepsgerichte leerweg in de
      gelegenheid stellen om Papiaments als extra vak te volgen.

      5 In aanvulling op de [artikelen 2.7, onderdeel b][ref10], en [2.12, onderdeel b][ref11], kunnen ook Papiaments
      (elementair) en Duitse taal en literatuur (elementair) deel uitmaken van het vrije deel van een profiel in vwo en
      havo, voor zover deze taal niet al eerder is gevolgd of niet al deel uitmaakt van het profiel en het bevoegd gezag
      deze vakken aanbiedt, met een normatieve studielast van 480 uur.


