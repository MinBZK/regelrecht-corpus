  - number: '2.29'
    text: |-
      1 Bij ministeriële regeling wordt bepaald welke beroepsgerichte keuzevakken deel kunnen uitmaken van het
      beroepsgerichte programma in de basisberoepsgerichte, kaderberoepsgerichte en gemengde leerweg van het vmbo.

      2 Het bevoegd gezag draagt er zorg voor dat de school voldoende beroepsgerichte keuzevakken aanbiedt waaruit
      leerlingen kunnen kiezen in het kader van hun beroepsgerichte programma.

      3 Bij zijn keuze welke beroepsgerichte keuzevakken door de school worden aangeboden, consulteert het bevoegd gezag
      een of meer instellingen voor educatie en beroepsonderwijs en een of meer regionale arbeidsmarktpartijen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.29
  - number: '2.30'
    text: |-
      1 Het bevoegd gezag van een school voor vmbo kan, in samenwerking met een of meer instellingen voor educatie en
      beroepsonderwijs en een of meer regionale arbeidsmarktpartijen, een beroepsgericht keuzevak ontwikkelen.

      2 Het bevoegd gezag stelt de medezeggenschapsraad van de school op de hoogte van het voornemen tot ontwikkeling van
      een beroepsgericht keuzevak.

      3 Het bevoegd gezag meldt het voornemen tot ontwikkeling van een beroepsgericht keuzevak zo spoedig mogelijk aan
      Onze Minister.

      4 Onze Minister brengt binnen zes weken na de melding schriftelijk advies uit over het voornemen.

      5 Bij ministeriële regeling wordt een model vastgesteld voor de melding van het voornemen en kunnen nadere regels
      worden gesteld over de procedure voor deze melding.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.30
  - number: '2.31'
    text: |-
      1 Onze Minister beslist over de goedkeuring van een beroepsgericht keuzevak.

      2 Onze Minister beslist binnen dertien weken op de aanvraag tot goedkeuring en laat zich daarbij adviseren door een
      onafhankelijke adviescommissie.

      3 Als Onze Minister een aanvraag inwilligt, neemt hij het nieuwe beroepsgerichte keuzevak uiterlijk met ingang van
      1 augustus daaropvolgend op in de ministeriële regeling, bedoeld in [artikel 2.29, eerste lid][ref1].

      4 Bij ministeriële regeling worden regels gesteld over beroepsgerichte keuzevakken, waaronder in elk geval over:

      a. de aard en omvang van het beroepsgerichte keuzevak;

      b. de opbouw van de leerstof, gedifferentieerd naar de verschillende leerwegen waarin het beroepsgerichte keuzevak
      kan worden aangeboden;

      c. de mate waarin een nieuw beroepsgerichte keuzevak zich onderscheidt van bestaande beroepsgerichte keuzevakken.

      5 Bij ministeriële regeling wordt een model vastgesteld voor de aanvraag tot goedkeuring van een beroepsgericht
      keuzevak en kunnen nadere regels worden gesteld over de procedure voor deze goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.29
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.31
