  - number: '2.34'
    text: |-
      De stage, bedoeld in de [artikelen 2.26, derde lid][ref1], en [2.27, derde lid, van de wet][ref2], maakt
      onderdeel uit van de profielvakken van de basisberoepsgerichte, kaderberoepsgerichte of gemengde leerweg of van de
      beroepsgerichte keuzevakken.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.26
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.26'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2.27'
  - number: '2.35'
    text: |-
      1 Het doel, de inhoud, de omvang, de opbouw en de organisatie van de stage worden beschreven in een stageplan.

      2 Een stage wordt doorlopen op een of meer stageplaatsen, die ter beschikking worden gesteld door een of meer
      stagebieders.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.35
  - number: '2.36'
    text: |-
      1 Het bevoegd gezag sluit met de ouders respectievelijk de leerling indien deze handelingsbekwaam is en de
      stagebieder een schriftelijke stageovereenkomst waaruit blijkt dat de leerling leeractiviteiten ontplooit in het
      kader van het stageplan.

      2 Het bevoegd gezag wijst op de school een stageleraar aan die belast is met het toezicht op de leerling gedurende
      de stage. De stagebieder wijst een stagebegeleider aan die bij hem werkzaam is en belast is met de begeleiding van
      de leerling.

      3 De stageovereenkomst omvat in elk geval:

      a. de leeractiviteiten die de leerling bij de aangewezen stagebieder op een of meer specifieke stageplaatsen moet
      ontplooien;

      b. de aanvangsdatum, de einddatum en de tijden van de leeractiviteiten;

      c. een regeling voor de begeleiding van de leerling bij de stagebieder waarin in elk geval wordt geregeld welk
      aandeel in de begeleiding door de stageleraar respectievelijk door de stagebegeleider wordt verzorgd;

      d. de wijze waarop de stagebieder bij de beoordeling van de leeractiviteiten wordt betrokken;

      e. een regeling die de inspectie in staat stelt toezicht te houden op de leeractiviteiten.

      4 De stageovereenkomst bepaalt ook:

      a. wie de verzekering sluit tegen het financiële risico van ongevallen en tegen wettelijke aansprakelijkheid van de
      leerling voor de tijd dat deze zich bevindt bij de stagebieder; en

      b. ten laste van wie de verzekeringspremie zal komen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.36
  - number: '2.37'
    text: |-
      Het bevoegd gezag kan voor de leerlingen een schriftelijke samenwerkingsovereenkomst met een of meer stagebieders
      sluiten waarin ook een of meer onderdelen van de stageovereenkomst, bedoeld in [artikel 2.36, derde lid][ref1],
      worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.36
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2.36'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.38'
    text: |-
      1 Praktijkonderwijs omvat ten minste onderwijs in:

      a. Nederlandse taal;

      b. rekenen/wiskunde;

      c. informatiekunde;

      d. lichamelijke opvoeding; en

      e. aangelegenheden waarvan het bevoegd gezag heeft vastgesteld dat deze van belang zijn voor het uitoefenen van
      functies binnen de regionale arbeidsmarkt.

      2 Het bevoegd gezag overlegt voor de vaststelling, bedoeld in het eerste lid, onderdeel e, met het college van
      burgemeester en wethouders dat daarbij de werkgevers betrekt die werkzaam zijn op de regionale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.38
  - number: '2.39'
    text: |-
      De [artikelen 2.34 tot en met 2.37][ref1] zijn van overeenkomstige toepassing op het onderwijs in de praktijk van
      de uitoefening van een vak of beroep aan een school voor praktijkonderwijs, voor zover dat onderwijs buiten die
      school plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.34
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '2.34'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '2.40'
    text: |-
      1 Indien het bevoegd gezag bij de vaststelling van vakken en andere programmaonderdelen van het vrije deel van
      profielen in vwo, havo, mavo of vmbo instellingen of deskundigen van buiten de school betrekt, kan het onderwijs in
      die vakken en andere programmaonderdelen van het vrije deel, onverminderd de verantwoordelijkheid van het bevoegd
      gezag voor het onderwijs aan de school, ook worden gegeven door die andere instellingen of deskundigen.

      2 Het bevoegd gezag stelt als voorwaarde dat die instellingen of deskundigen voldoen aan de wettelijke regels die
      voor hen gelden of, indien deze regels ontbreken, aan de binnen de beroepsgroep algemeen erkende normen.

      3 De [artikelen 7.3.][ref1] en [7.11, eerste lid, van de wet][ref2] zijn van overeenkomstige
      toepassing op degenen die dit onderwijs geven, met dien verstande dat als getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, onderdeel a][ref3], geldt een kwalificatie die, gelet op het eerste en tweede lid,
      passend is.

      4 Het bevoegd gezag informeert de inspectie over de kwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.3
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7.11
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel7.11
