  - number: '2.33'
    text: |-
      1 Het bevoegd gezag kan een ontheffing als bedoeld in [artikel 2.4, tweede of derde lid][ref1], verleend voor
      de eerste twee leerjaren van het volgen van onderwijs in Franse taal of Duitse taal ook aanmerken als ontheffing
      voor het volgen van onderwijs in die taal voor de periode waarin de leerling onderwijs in de theoretische,
      kaderberoepsgerichte of gemengde leerweg volgt. Deze ontheffing wordt verleend aan leerlingen die:

      a. op grond van [artikel 2.4, tweede lid][ref2], beschikken over een ontheffing en deze ontheffing wordt
      voortgezet;

      b. in de periode van de eerste twee leerjaren onderwijs in Spaanse taal, Arabische taal of Turkse taal volgden; of

      c. onderwijs gaan volgen in de basisberoepsgerichte leerweg en die in het schooljaar voorafgaand aan het betrokken
      schooljaar leerwegondersteunend onderwijs volgden.

      2 Bij een ontheffing op grond van het eerste lid wordt het onderwijs in de betrokken taal vervangen door het
      onderwijs in Arabische taal, Turkse taal, Spaanse taal, maatschappijkunde, geschiedenis en staatsinrichting, of
      aardrijkskunde.

      3 Dit artikel is ook van toepassing op een leerling die in een hoger leerjaar voor de eerste maal in Nederland tot
      een school is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel2.4
