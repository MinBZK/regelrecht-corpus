  - number: '9.23'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *CAPE:* Caribbean Advanced Proficiency Examination als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref1];
        - *CCSLC:* Caribbean Certificate of Secondary Level Competence als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref2];
        - *CSEC:* Caribbean Secondary Education Certificate als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref3];
        - *CVQ:* Caribbean Vocational Qualification als bedoeld in
      [artikel 1 van het Besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref4];
        - *ISK-leerlingen:* leerlingen in een internationale schakelklas op scholen op Bonaire;
        - *lower forms:* de eerste drie leerjaren van het voortgezet onderwijs aan scholen op Sint Eustatius en Saba, dat
      wordt ingevuld met CCSLC, eventueel aangevuld met vakken van CSEC en CVQ.


      [ref1]: https://wetten.overheid.nl/BWBR0045020#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0045020#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0045020#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0045020#Artikel1
