  - number: '4.6'
    text: |-
      1 De examenkandidaat die eerder op grond van de [artikelen 3.8][ref1], [3.64][ref2] of [3.65][ref3] bij het
      eindexamen aan een school of een instelling voor educatie en beroepsonderwijs is vrijgesteld van een vak, is bij
      het staatsexamen vrijgesteld van dat vak.

      2 De examenkandidaat aan wie eerder op grond van [artikel 3.67][ref4] bij het eindexamen aan een instelling voor
      educatie en beroepsonderwijs of op grond van [artikel 4.7][ref5] ontheffing is verleend voor het eindexamen in een
      vak, is bij het staatsexamen vrijgesteld in dat vak.

      3 Een bewijs van ontheffing wordt bij de vaststelling van de uitslag van het staatsexamen betrokken, indien na het
      jaar waarin het onderliggende diploma, getuigschrift of ander bewijsstuk is vastgesteld, nog geen tien jaar zijn
