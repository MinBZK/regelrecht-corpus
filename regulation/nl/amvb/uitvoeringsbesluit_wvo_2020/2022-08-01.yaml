  - number: '4.4'
    text: |-
      1 Het staatsexamen vwo (atheneum), havo en vmbo theoretische leerweg omvat de vakken van het eindexamen vwo
      (atheneum), havo, respectievelijk vmbo theoretische leerweg, aan een school, met uitzondering van de volgende
      vakken van het gemeenschappelijk deel:

      a. lichamelijke opvoeding;

      b. voor vwo (atheneum) en havo: culturele en kunstzinnige vorming; en

      c. voor vmbo theoretische leerweg: de vakken behorende tot de beeldende vorming, muziek, dans of drama.

      2 Het staatsexamen vwo (gymnasium) omvat de vakken van het eindexamen vwo (gymnasium) aan een school, met
      uitzondering van het vak lichamelijke opvoeding van het gemeenschappelijk deel.

      3 Het staatsexamen vmbo basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg en gemengde leerweg omvat de
      vakken van het eindexamen vmbo in deze leerwegen, met dien verstande dat in deze leerwegen alleen de algemene
      vakken van het eindexamen via het staatsexamen kunnen worden afgesloten.

      4 Het college kan, al dan niet voor een bepaalde groep examenkandidaten, besluiten dat geen gelegenheid wordt
      gegeven tot het afleggen van staatsexamen in een vak dat alleen behoort tot het vrije deel van een profiel, het vak
      kunst (drama) of het vak kunst (dans).

      5 Het profielwerkstuk vwo en havo heeft betrekking op een of meer vakken van het staatsexamen. Ten minste een van
      deze vakken heeft minimaal de volgende omvang:

      a. voor havo: 320 uur;

      b. voor vwo: 400 uur.

      6 Het profielwerkstuk vmbo theoretische leerweg heeft betrekking op een thema uit een profiel waarin de leerling
      onderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 De examenkandidaat die staatsexamen aflegt is vrijgesteld van:

      a. het staatsexamen in een vak in vwo op grond van een examen vwo, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;

      b. het staatsexamen in een vak in havo op grond van een examen vwo of havo, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger is behaald;

      c. het staatsexamen in een vak in de theoretische of gemengde leerweg van het vmbo op grond van een examen vwo,
      havo, vmbo theoretische leerweg of vmbo gemengde leerweg, indien voor het overeenkomstige vak een eindcijfer 6 of
      hoger is behaald;

      d. het staatsexamen in een vak in de basisberoepsgerichte of kaderberoepsgerichte leerweg van het vmbo op grond van
      een examen vwo, havo of vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      e. het staatsexamen in een vak van vwo, havo of vmbo op grond van het overeenkomstige examen, afgelegd in Curaçao,
      Sint Maarten, Aruba, indien voor het overeenkomstige vak een eindcijfer 6 of hoger is behaald;

      f. het profielwerkstuk vwo of havo, indien eerder een profielwerkstuk is gemaakt dat betrekking heeft op een of
      meer vakken van dezelfde schoolsoort, behorende tot het profiel van de examenkandidaat en waarvoor een eindcijfer 6
      of hoger is behaald; of

      g. het profielwerkstuk vmbo, indien eerder een profielwerkstuk vmbo is gemaakt dat betrekking heeft op een thema
      uit dat profiel, en dat is beoordeeld als «voldoende» of «goed».

      2 In aanvulling op het eerste lid, onderdelen a tot en met d, is de examenkandidaat vrijgesteld van het onderdeel
      literatuur van elke moderne taal, indien de examenkandidaat bij het eerder afgelegde examen, voor literatuur een
      cijfer 6 of hoger heeft behaald.

      3 Het eerste en tweede lid zijn van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen tien jaar zijn verstreken.

      4 De examenkandidaat, bedoeld in het eerste lid, onderdelen a tot en met f, en derde lid, is ook vrijgesteld van
      het vak indien het eindcijfer 5 of 4 is behaald, mits hij voldoet aan de voorwaarden van de [artikelen 4.20][ref1]
      of [4.21][ref2] om te slagen voor het staatsexamen.

      5 Bij ministeriële regeling worden nadere regels gesteld over de toepassing van het eerste lid.

      6 [Artikel 3.40, vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.20
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4.21
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.40
