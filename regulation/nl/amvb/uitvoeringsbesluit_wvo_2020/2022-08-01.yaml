  - number: '3.35'
    text: |-
      1 De examenkandidaat die het eindexamen vmbo in een leerweg heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor het vak Nederlandse taal als eindcijfer 5 of hoger heeft behaald;

      c. hij onverminderd onderdeel b:

      1°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;

      2°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft behaald;
      of

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger
      heeft behaald;

      d. hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;

      e. hij voor de vakken lichamelijke opvoeding en kunstvakken inclusief culturele en kunstzinnige vorming de
      kwalificatie «voldoende» of «goed» heeft behaald; en

      f. als het gaat om een eindexamen vmbo gemengde of theoretische leerweg: hij voor het profielwerkstuk de
      kwalificatie «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo theoretische leerweg
      het eindcijfer van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen vmbo gemengde leerweg
      bij de uitslagbepaling betrokken als deze vakken samen ten minste een volledig beroepsgericht programma als
      bedoeld in [artikel 3.7, eerste lid, onderdeel d][ref1], vormen. In dat geval is het vierde lid van overeenkomstige
      toepassing.

      3 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo basisberoepsgerichte
      leerweg en kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken
      aangemerkt als het eindcijfer van een vak.

      4 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt bij het eindexamen vmbo gemengde leerweg het
      gemiddelde van de eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer
      van een vak, met dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal
      eindcijfers van beroepsgerichte keuzevakken dat in de berekening wordt betrokken.

      5 De rector of directeur bepaalt het eindcijfer, bedoeld in het derde en vierde lid, als het rekenkundig gemiddelde
      van de eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal
      is, wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      6 In afwijking van het eerste lid is de examenkandidaat die het eindexamen vmbo basisberoepsgerichte leerweg heeft
      afgelegd ter afsluiting van een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref2] geslaagd indien:

      a. hij voor het vak Nederlandse taal als eindcijfer 6 of hoger heeft behaald;

      b. hij voor het profielvak als eindcijfer 6 of hoger heeft behaald; en

      c. hij als eindcijfer, bedoeld in het derde lid, 6 of hoger heeft behaald.

      Indien de vakken waarin examen is afgelegd, samen het eindexamen vmbo basisberoepsgerichte leerweg vormen, zijn het
      eerste en derde lid van overeenkomstige toepassing.

      7 Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de rector of directeur deze
      schriftelijk aan de examenkandidaat bekend, onder mededeling van het recht van herkansing, bedoeld in
      [artikel 3.38][ref3]. Indien de examenkandidaat geen herexamen doet is deze uitslag de definitieve uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.103
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.38
