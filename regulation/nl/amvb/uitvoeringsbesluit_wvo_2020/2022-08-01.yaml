      1 Onverminderd het bepaalde in de [artikelen 6.7][ref1], [6.8][ref2] en [6.10][ref3], wordt een
      leerling meegeteld voor de aanvullende bekostiging voor leerwegondersteunend onderwijs, bedoeld in
      [artikel 5.5, eerste lid, van de wet][ref4], indien:

      a. het samenwerkingsverband voor de teldatum heeft bepaald dat:

      1°. de leerling is aangewezen op leerwegondersteunend onderwijs; of

      2°. de leerling is toelaatbaar tot het praktijkonderwijs; of

      b. sprake is van een tijdelijke plaatsing als bedoeld in [artikel 8.13 van de wet][ref5].

      2 Onverminderd het bepaalde in de [artikelen 6.7][ref6], [6.8][ref7] en [6.10][ref8] wordt
      een leerling in het praktijkonderwijs meegeteld voor de aanvullende bekostiging, bedoeld in
      [artikel 5.5, tweede lid, van de wet][ref9], indien:

      a. het samenwerkingsverband voor de teldatum heeft bepaald dat de leerling toelaatbaar is tot het
      praktijkonderwijs; of

      b. er sprake is van een tijdelijke plaatsing als bedoeld in [artikel 8.13 van de wet][ref10].


