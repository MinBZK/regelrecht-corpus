  - number: '2.47'
    text: |-
      1 De criteria, bedoeld in [artikel 2.30, tweede lid, onderdeel c, van de wet][ref1], voor de toelaatbaarheid van
      een leerling tot het praktijkonderwijs, zijn dat het zorg- en onderwijsaanbod van het praktijkonderwijs naar het
      oordeel van het bevoegd gezag het beste aansluit bij de behoeften van de leerling, en dat die leerling:

      a. vbo of mavo bezoekt en op leerwegondersteunend onderwijs is aangewezen, en:

      1°. scores heeft op de criteria, bedoeld in [artikel 2.46][ref2], in het grensvlak van het leerwegondersteunend
      onderwijs en praktijkonderwijs;

      2°. naar het oordeel van het bevoegd gezag een toegenomen problematiek heeft nadat de beslissing is genomen dat de
      leerling op leerwegondersteunend onderwijs is aangewezen; of

      3°. naar het oordeel van het bevoegd gezag een stapeling van andersoortige problematiek heeft dan wordt beoordeeld
      in het onderzoek of de leerling is aangewezen op leerwegondersteunend onderwijs of praktijkonderwijs; of

      b. beschikt over een toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs van
      een samenwerkingsverband of een ontwikkelingsperspectief, en:

      1°. voldoet aan het intelligentiequotiëntcriterium of leerachterstandscriterium voor toelating tot het
      praktijkonderwijs, bedoeld in [artikel 2.46, vierde lid][ref3], zoals blijkt uit gegevens die gebaseerd zijn op
      screenings- of testinstrumenten als bedoeld in [artikel 2.46, tweede lid][ref4]; of

      2°. naar het oordeel van het bevoegd gezag, ongeacht de intelligentiequotiënt of de leerachterstand, een zodanige
      problematiek heeft dat toelaatbaarheid tot het praktijkonderwijs geboden is.

      2 Het samenwerkingsverband baseert de beslissing over de toelaatbaarheid tot het praktijkonderwijs uitsluitend op
      de volgende, bij de aanvraag gevoegde, gegevens:

      a. een kopie van de beslissing dat de leerling is aangewezen op leerwegondersteunend onderwijs, een kopie van
      de toelaatbaarheidsverklaring voor het speciaal onderwijs of voortgezet speciaal onderwijs, of een kopie van het
      ontwikkelingsperspectief;

      b. de schriftelijke zienswijze en instemming van de ouders;

      c. een motivering van het bevoegd gezag waaruit blijkt dat de leerling voldoet aan de criteria, bedoeld in het
      eerste lid; en

      d. een leerling-dossier dat in elk geval omvat:

      1°. het ontwikkelingsperspectief of het onderwijskundig rapport over de leerling, bedoeld in
      [artikel 42, eerste lid, WPO][ref5] en [artikel 43 WEC][ref6];

      2°. een beschrijving van de activiteiten van het verwijzende bevoegd gezag in het kader van de begeleiding van de
      leerling, en van de resultaten van die activiteiten;

      3°. een document waaruit blijkt welke externe deskundigen voor advies of hulp zijn ingeschakeld bij de begeleiding
      van de leerling;

      4°. een beschrijving van de risico’s die zich naar verwachting zullen voordoen indien de leerling vbo, mavo,
      speciaal onderwijs of voortgezet speciaal onderwijs blijft volgen; en

      5°. mogelijk relevante test- en toetsgegevens.


