    text: |-
      De volgende besluiten worden ingetrokken:

      a. het [Bekostigingsbesluit WVO BES][ref1];

      b. het [Besluit bekostiging WVO 2021][ref2];

      c. het [Besluit informatievoorziening WVO][ref3];

      d. het [Besluit informatievoorziening WVO BES][ref4];

