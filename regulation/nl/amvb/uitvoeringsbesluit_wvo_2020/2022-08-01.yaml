        bwb_id: BWBR0044212
        artikel: '2.44'
  - number: '2.50'
    text: |-
      1 Een leerling die is of wordt ingeschreven bij een school, kan gedurende ten hoogste twee jaar het
      onderwijsprogramma of een gedeelte daarvan volgen bij een orthopedagogisch-didactisch centrum als bedoeld in
      [artikel 2.47, twaalfde lid van de wet][ref1].

      2 Het onderwijs van leerlingen die langer dan drie maanden een programma volgen bij het orthopedagogisch-didactisch
      centrum, wordt gegeven door leraren die daartoe bevoegd zijn.

      3 Indien een samenwerkingsverband een orthopedagogisch-didactisch centrum heeft ingericht, wordt dat vermeld in het
      ondersteuningsplan, bedoeld in [artikel 2.47, negende lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.47
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.47
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.47'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2.47'
  - number: '2.51'
    text: |-
      1 De deskundigen, bedoeld in [artikel 2.47, veertiende lid, van de wet][ref1] zijn een orthopedagoog of een
      psycholoog en, afhankelijk van de leerling over wiens toelaatbaarheid wordt geadviseerd, ten minste een tweede
      deskundige, te weten een kinder- of jeugdpsycholoog, een pedagoog, een kinderpsychiater, een maatschappelijk werker
      of een arts.

      2 Indien het samenwerkingsverband beslist dat een leerling aangewezen is op het leerwegondersteunend onderwijs of
      toelaatbaar is tot het praktijkonderwijs, kan de tweede deskundige ook een deskundige op het terrein van vbo, mavo,
      vmbo en praktijkonderwijs zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.47
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.51
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.47'
  - number: '2.52'
    text: |-
      1 De inspectie hanteert de volgende indicatoren voor de beoordeling van de leerresultaten van het voortgezet
      onderwijs:

      a. het percentage leerlingen met een onvertraagde studievoortgang in de eerste twee leerjaar;

      b. het percentage leerlingen met een onvertraagde studievoortgang in de overige leerjaren;

      c. het niveau dat de leerling in het derde leerjaar daadwerkelijk heeft bereikt ten opzichte van het niveau dat de
      leerling gelet op het schooladvies, bedoeld in [artikel 42, tweede lid, WPO][ref1], naar verwachting in het derde
      leerjaar zou bereiken; en

      d. het gemiddelde cijfer van het centraal examen.

      2 De indicatoren worden onderscheiden naar de schoolsoorten en leerwegen, genoemd in
      [artikel 2.94, eerste lid, van de wet][ref2].

      3 Bij de bepaling van de leerresultaten, bedoeld in het eerste lid, kan rekening worden gehouden met
      groepskenmerken en individuele kenmerken van leerlingen, met dien verstande dat in elk geval rekening wordt
      gehouden met de sociaaleconomische situatie van de leerlingen.

      4 De scores waarop het oordeel over de indicatoren wordt gebaseerd, kunnen wegens bijzondere omstandigheden worden
      gecorrigeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.94
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '2.94'
  - number: '2.53'
    text: |-
      1 Bij ministeriële regeling worden nadere regels gesteld over de berekening van de indicatoren voor
      de beoordeling van de leerresultaten, waaronder begrepen de toe te passen correcties, bedoeld in
      [artikel 2.52, derde en vierde lid][ref1].

      2 Bij ministeriële regeling worden regels gesteld over:

      a. de aard en de aantallen gegevens over de leerresultaten die ten minste nodig zijn voor de toepassing van de
      indicatoren;

      b. de normering waarop de inspectie het oordeel voldoende of onvoldoende onderwijsresultaat baseert, na toepassing
      van de indicatoren;

      c. de wijze waarop per schoolsoort of leerweg de beoordelingen, gebaseerd op de afzonderlijke indicatoren, leiden
      tot een oordeel over de leerresultaten van die schoolsoort respectievelijk leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel2.52
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.53
