        artikel: '3.4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.44'
    text: |-
      De rector of directeur van een scholengemeenschap of school voor vwo die gymnasium verzorgt, kan in plaats van een
      diploma gymnasium een diploma atheneum uitreiken aan een examenkandidaat indien:

      a. de scholengemeenschap of school voor vwo atheneum onderwijs verzorgt;

      b. de scholengemeenschap of school voor vwo overeenkomstig [artikel 2.93 van de wet][ref1] kenbaar heeft gemaakt
      dat het behalen van een diploma atheneum en het volgen van atheneumonderwijs mogelijk is; en

      c. de examenkandidaat staat ingeschreven voor atheneum onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.93
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.44
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.93'
  - number: '3.45'
    text: |-
      De rector of directeur van een scholengemeenschap die in elk geval een school voor mavo omvat, reikt op verzoek van
      de examenkandidaat die met goed gevolg het examen vmbo gemengde leerweg aan die school heeft afgelegd en bovendien
      examen heeft afgelegd in een extra algemeen vak en met het meetellen van dat vak voldoet aan [artikel 3.35][ref1]
      voor zover het gaat om de uitslag van het eindexamen vmbo theoretische leerweg, het diploma vmbo theoretische
      leerweg uit.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.45
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3.35'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.46'
    text: |-
      1 Het diploma voor het eindexamen vermeldt het profiel of de profielen die bij de uitslag van het eindexamen zijn
      betrokken.

      2 Het diploma vmbo vermeldt in elk geval de leerweg die bij de uitslag is betrokken.

      3 De rector of directeur en de examensecretaris ondertekenen het diploma.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.46
  - number: '3.47'
    text: |-
      1 Een examenkandidaat is geslaagd voor het eindexamen vwo met toekenning van het judicium cum laude indien de
      eindexamenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer, bedoeld in
      [artikel 3.34, tweede lid][ref1], en de vakken van het profieldeel; en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 7 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 3.34][ref2].

      2 Een examenkandidaat is geslaagd voor het eindexamen havo met toekenning van het judicium cum laude indien de
      eindexamenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken in het gemeenschappelijke deel van het profiel, het eindcijfer, bedoeld in
      [artikel 3.34, tweede lid][ref3], en de vakken van het profieldeel; en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 3.34][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
