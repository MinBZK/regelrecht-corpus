  - number: '4.20'
    text: |-
      1 De examenkandidaat die staatsexamen vwo of havo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor een van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van
      toepassing wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of hoger heeft behaald en hij voor het andere vak
      of andere hier genoemde vakken als eindcijfer 6 of hoger heeft behaald;

      c. hij onverminderd onderdeel b:

      1°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;

      2°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde
      van de eindcijfers ten minste 6,0 bedraagt; of

      4°. voor een van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor een van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      hoger heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt; en

      d. hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de volgende
      onderdelen aangemerkt als het eindcijfer van één vak, voor zover voor deze onderdelen een eindcijfer is bepaald:
      maatschappijleer en het profielwerkstuk. Het college kan daaraan toevoegen:

      a. literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het college
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het college-examen van
      deze taal en literatuur;

      b. algemene natuurwetenschappen in vwo en havo.

      3 Het eindcijfer, bedoeld in het tweede lid, wordt bepaald als het rekenkundig gemiddelde van de eindcijfers van de
      samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is, wordt dat getal indien
      het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat cijfer een 5 of hoger is,
      naar boven afgerond.

      4 De examenkandidaat wiens staatsexamen niet voldoet aan dit artikel is afgewezen voor het staatsexamen.

      5 Zodra de uitslag van het staatsexamen is vastgesteld, maakt het college deze samen met de eindcijfers
      schriftelijk aan de examenkandidaat bekend. Indien de examenkandidaat is afgewezen voor het staatsexamen, wordt bij
      de bekendmaking mededeling gedaan van het recht op herkansing als bedoeld in [artikel 4.22][ref1]. De uitslag is de
      definitieve uitslag indien de examenkandidaat geen gebruik maakt van het recht op herkansing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.22
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel4.20
