  - number: '6.12'
    text: |-
      1 Voor de vaststelling van de bekostiging zendt Onze Minister jaarlijks voor 15 januari volgend op de teldatum aan
      het bevoegd gezag overzichten van de gegevens, bedoeld in de [artikelen 5, eerste lid][ref1], [6, derde lid][ref2],
      en [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref3] over het aantal leerlingen op
      de teldatum dat bij de vaststelling van de bekostiging voor het daarop volgende kalenderjaar in aanmerking wordt
      genomen.

      2 Het bevoegd gezag zendt jaarlijks voor 1 juli aan Onze Minister voor het daaropvolgende schooljaar:

      a. een verklaring van het bevoegd gezag omtrent de juistheid van de gegevens,
      bedoeld in de [artikelen 5, eerste lid][ref4], [6, derde lid][ref5], en
      [8, vijfde lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref6] van de leerlingen op de teldatum
      die het aan Onze Minister heeft gemeld; of

      b. indien de in onderdeel a bedoelde gegevens naar het oordeel van het bevoegd gezag onjuist zijn, de door het
      bevoegd gezag gecorrigeerde gegevens; en

      c. een verklaring van een accountant omtrent de juistheid van de gegevens, bedoeld in onderdeel a of onderdeel b.

      3 Bij ministeriële regeling kan worden vastgesteld:

      a. een model voor de verklaring, bedoeld in het tweede lid, onderdelen a en c; en

      b. een leidraad voor de controle door de accountant, bedoeld in het tweede lid, onderdeel c.

      4 Indien Onze Minister voor 1 juli in enig jaar aanvullende bekostiging heeft vastgesteld, dient het bevoegd gezag
      voor die datum bij Onze Minister een verklaring in over de juistheid van de respectievelijk voor de vaststelling
      van de aanvullende bekostiging aan Onze Minister gemelde gegevens. Het tweede lid, onderdelen b en c, en het derde
      lid, zijn van overeenkomstige toepassing.


