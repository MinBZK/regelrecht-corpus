  - number: '6.1'
    text: |-
      1 Een vestiging van een school of scholengemeenschap komt in aanmerking voor het bedrag, bedoeld in
      [artikel 5.4, eerste lid, onderdeel a, van de wet][ref1] indien:

      a. sprake is van een hoofdvestiging of een nevenvestiging, waaraan door Onze Minister een registratienummer als
      bedoeld in [artikel 5, eerste lid, onderdeel a, van het Besluit register onderwijsdeelnemers][ref2] is toegekend;
      en

      b. bij die vestiging op de teldatum ten minste 130 leerlingen of, indien sprake is van een vestiging waaraan
      uitsluitend praktijkonderwijs wordt verzorgd, 60 leerlingen, staan ingeschreven.

      2 Bij het bepalen van het bedrag per vestiging, bedoeld in [artikel 5.4, eerste lid, onderdeel a, van de wet][ref3]
      wordt onderscheid gemaakt tussen een bedrag voor de hoofdvestiging van een school of scholengemeenschap en een
      bedrag voor een nevenvestiging.

      3 Bij het bepalen van het bedrag per leerling, bedoeld in [artikel 5.4, eerste lid, onderdeel b, van de wet][ref4]
      wordt onderscheid gemaakt tussen:

      a. leerlingen in het praktijkonderwijs of in het derde of vierde leerjaar van de basisberoepsgerichte of
      kaderberoepsgerichte leerweg van het vbo; en

      b. leerlingen in het vwo, havo, mavo of vbo, met uitzondering van leerlingen in het derde of vierde leerjaar van de
      basisberoepsgerichte en kaderberoepsgerichte leerweg van het vbo.

      4 Een hoofd- of nevenvestiging van een scholengemeenschap komt in aanmerking voor aanvullende bekostiging als
      bedoeld in [artikel 5.9, derde lid, van de wet][ref5], indien aan die vestiging onderwijs wordt verzorgd in
      alle leerjaren van het vwo, havo, mavo en vbo. De hoogte van deze aanvullende bekostiging wordt vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5.4
