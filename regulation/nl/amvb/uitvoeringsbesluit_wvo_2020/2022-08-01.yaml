  - number: '2.46'
    text: |-
      1 Een samenwerkingsverband baseert zijn beslissing op een in [artikel 2.30, vijfde lid, van de wet][ref1]
      bedoelde aanvraag van het bevoegd gezag of de leerling toelaatbaar is voor het praktijkonderwijs, of een in
      [artikel 2.43, eerste lid, van de wet][ref2] bedoelde aanvraag of de leerling is aangewezen op leerwegondersteunend
      onderwijs uitsluitend op:

      a. de door het bevoegd gezag gegeven motivering, gebaseerd op ervaringen met de leerling in het
      onderwijsleerproces, zoals die onder meer blijken uit het onderwijskundig rapport, bedoeld in
      [artikel 42, eerste lid, WPO][ref3] of in [artikel 43 WEC][ref4];

      b. de leerachterstand van de leerling in de domeinen technisch lezen, spellen, begrijpend lezen of inzichtelijk
      rekenen;

      c. het intelligentiequotiënt van de leerling, uitdrukkende zijn cognitieve capaciteiten op basis van scores op
      verbaal en niet-verbaal gebied;

      d. indien dat noodzakelijk is voor het vormen van een oordeel, de resultaten van een of meer
      persoonlijkheidsonderzoeken over prestatiemotivatie, faalangst en emotionele instabiliteit die een beeld geven van
      het sociaal-emotioneel functioneren van de leerling in relatie tot de leerprestaties; en

      e. voor een aanvraag voor toelaatbaarheid tot het praktijkonderwijs: de zienswijze van de ouders.

      2 Bij ministeriële regeling worden jaarlijks voor 1 oktober screenings- of testinstrumenten vastgesteld voor de
      beoordeling van de gegevens, bedoeld in het eerste lid, onderdelen b tot en met d, alsmede regels voor het gebruik
      van die instrumenten. Bij de beslissing op de aanvraag controleert het samenwerkingsverband of het bevoegd gezag
      deze screenings- of testinstrumenten heeft gebruikt. De testinstrumenten voor de gegevens, bedoeld in het eerste
      lid, onderdelen c en d, worden toegepast onder verantwoordelijkheid van een diagnostisch geschoold psycholoog of
      diagnostisch geschoold orthopedagoog.

      3 De leerachterstand van de leerling in de domeinen technisch lezen, spellen, begrijpelijk lezen en inzichtelijk
      rekenen is de uitkomst van 1 minus (DLE/DL), waarin:

      a. DLE staat voor didactische leeftijdseenheden en het aantal maanden onderwijs dat behoort bij het niveau dat de
      leerling feitelijk heeft bereikt;

      b. DL staat voor didactische leeftijd en het aantal maanden dat een leerling vanaf groep 3 in de perioden van
      september tot en met juni was ingeschreven bij een school als bedoeld in [artikel 1 WPO][ref5] of een school voor
      speciaal onderwijs als bedoeld in [artikel 1 WEC][ref6].

      4 Het samenwerkingsverband wijst de aanvraag voor praktijkonderwijs uitsluitend toe indien de leerling:

      a. een intelligentiequotiënt heeft binnen de bandbreedte van 55 tot en met 80; en

      b. een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste een van deze twee domeinen gaat om inzichtelijk rekenen of begrijpend lezen
      en deze leerachterstand ten minste 0,5 bedraagt.

      5 Het samenwerkingsverband wijst de aanvraag voor leerwegondersteunend onderwijs uitsluitend toe indien:

      a. de leerling:

      1°. een intelligentiequotiënt heeft binnen de bandbreedte 75 tot en met 90; en

      2°. een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste een van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft
      en deze leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5; of

      b. de leerling:

      1°. een intelligentiequotiënt heeft binnen de bandbreedte 91 tot en met 120;

      2°. een leerachterstand heeft op ten minste twee van de vier domeinen inzichtelijk rekenen, begrijpend lezen,
      technisch lezen en spellen, ten minste een van deze twee domeinen inzichtelijk rekenen of begrijpend lezen betreft
      en deze leerachterstand is gelegen binnen de bandbreedte van 0,25 tot 0,5; en

      3°. een sociaal-emotionele problematiek heeft waardoor het onderwijsleerproces substantieel wordt belemmerd.

      6 Een leerling die als het gaat om intelligentiequotiënt of leerachterstand voldoet aan de vereisten voor
      toelaatbaarheid tot het praktijkonderwijs en die bovendien voldoet aan de vereisten voor het leerwegondersteunend
      onderwijs, kan toelaatbaar worden verklaard tot praktijkonderwijs of aangewezen worden op het leerwegondersteunend
      onderwijs, afhankelijk van de door het bevoegd gezag gegeven motivering, bedoeld in het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.30
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.43
