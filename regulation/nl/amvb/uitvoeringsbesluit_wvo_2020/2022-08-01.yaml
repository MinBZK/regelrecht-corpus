  - number: '3.27'
    text: |-
      1 Voor het cspe van het eindexamen vmbo vindt de beoordeling ook plaats door een tweede examinator als
      bedoeld in [artikel 3.26, tweede lid][ref1]. De tweede examinator kan een deskundige als bedoeld in
      [artikel 2.51, vierde lid, van de wet][ref2] of een examinator van de school zijn.

      2 De tweede examinator beoordeelt het resultaat van de opgaven en de verrichtingen van de examenkandidaat zoals
      blijkend uit de schriftelijke vastlegging, bedoeld in [artikel 3.26, tweede lid][ref3].

      3 De rector of directeur overhandigt aan de tweede examinator:

      a. een exemplaar van de opgaven;

      b. de beoordelingsnormen;

      c. het proces-verbaal; en

      d. de regels voor het bepalen van de score, bedoeld in het eerste lid.

      4 [Artikel 3.21, vijfde lid][ref4], is van overeenkomstige toepassing.


