  - number: '10.1'
    text: |-
      1 De landelijke commissie voor geschillen, bedoeld in [artikel 12.34 van de wet][ref1], bestaat uit ten minste
      zeven leden. De leden worden benoemd op gezamenlijke bindende voordracht van de landelijke ouderorganisaties, de
      landelijke patiënten- en gehandicaptenorganisaties en de sectororganisaties.

      2 Onze Minister benoemt en ontslaat de leden.

      3 De leden worden benoemd voor een periode van vier jaar en kunnen ten hoogste twee maal worden herbenoemd.

      4 De commissie is zo samengesteld dat zij beschikt over (ortho)pedagogische, psychologische, onderwijskundige,
      maatschappelijke, bestuurlijke, juridische en medische deskundigheid. Voor de behandeling van elk ingediend geschil
      kiest de commissie uit haar leden een voorzitter en twee leden. De commissie bepaalt welke samenstelling bij de
      behandeling van het geschil het meest geschikt is.

      5 De leden worden op hun verzoek door Onze Minister ontslagen.

      6 De leden mogen geen deel uitmaken van het bevoegd gezag van een van de scholen die deelnemen aan het
      samenwerkingsverband dat betrokken is in het geschil of het bevoegd gezag van dat samenwerkingsverband.

      7 De leden functioneren zonder last of ruggenspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12.34
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel10.1
