  - number: '4.24'
    text: |-
      1 Het college stelt vast op welke wijze het cijfer van de herkansing voor het college-examen wordt bepaald. In zijn
      overwegingen betrekt het college de cijfers voor die toetsen van het eerder afgelegde college-examen die betrekking
      hebben op niet tot de herkansing behorende onderdelen van het examenprogramma.

      2 Het hoogste cijfer van de cijfers behaald bij de herkansing en bij het eerder afgelegde college-examen of
      centraal examen geldt als definitief cijfer voor het college-examen of het centraal examen.

      3 Na afloop van de herkansing stelt het college de uitslag definitief vast met overeenkomstige toepassing van de
      [artikelen 4.18 tot en met 4.21][ref1] en maakt de uitslag schriftelijk aan de examenkandidaat bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel4.18
