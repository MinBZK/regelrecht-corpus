  - number: '3.9'
    text: |-
      Indien het eindexamen een of meer vakken omvat van een andere schoolsoort of leerweg dan die waarvoor de
      examenkandidaat als leerling is ingeschreven, behoort ten minste een vak van de schoolsoort of leerweg van
      inschrijving tot de voorgeschreven eindexamenvakken.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Het eindexamen vwo, havo en vmbo kan ook een maatschappelijke stage als bedoeld in
      [artikel 2.32 van de wet][ref1] omvatten.

      2 De maatschappelijke stage als onderdeel van het eindexamen duurt ten minste 30 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.32
