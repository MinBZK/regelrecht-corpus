        bwb_id: BWBR0044212
        artikel: '2.56'
      - id: ref2
        bwb_id: BWBR0045787
        artikel: '3.38'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '3.37'
    text: |-
      Indien een examenkandidaat gebruik heeft gemaakt van de mogelijkheid tot het afleggen van eindexamen in een
      overeenkomstig vak op een hoger niveau dan het niveau van de schoolsoort of leerweg van inschrijving, stelt de
      rector of directeur de examenkandidaat in de gelegenheid alsnog in dat vak het eindexamen af te leggen van die
      schoolsoort of leerweg.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.37
  - number: '3.38'
    text: |-
      1 De examenkandidaat kan voor één vak van het eindexamen waarin hij centraal examen heeft afgelegd, in het tweede
      of, indien [artikel 3.29, eerste lid][ref1], van toepassing is, het derde tijdvak, opnieuw deelnemen aan het
      centraal examen of aan het cspe.

      2 Bij het eindexamen vmbo basisberoepsgerichte leerweg en kaderberoepsgerichte leerweg kan de examenkandidaat
      ook opnieuw deelnemen aan het cspe dat door het bevoegd gezag aansluitend aan het eerste tijdvak of in het tweede
      tijdvak wordt afgenomen.

      3 De herkansing van het cspe bestaat uit het opnieuw afleggen van deze toets of van een of meer onderdelen daarvan.

      4 De examenkandidaat heeft het recht, bedoeld in het eerste en tweede lid, indien op grond van
      [artikel 3.34, vijfde lid][ref2], of [artikel 3.35, zevende lid][ref3], de eindcijfers zijn bekendgemaakt.

      5 De examenkandidaat deelt de rector of directeur voor een door deze laatste te bepalen dag en tijdstip
      schriftelijk mee dat hij gebruik maakt van het recht van herkansing, bedoeld in het eerste of tweede lid.

      6 Dit artikel is ook van toepassing als in plaats van een volledig eindexamen, eindexamen in een of meer vakken
      wordt afgelegd. De examenkandidaat die in een examenjaar zowel een volledig eindexamen als eindexamen in een of
      meer vakken aflegt, oefent het recht, bedoeld in het eerste en tweede lid, ten hoogste eenmaal uit.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.29
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.35
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.38
