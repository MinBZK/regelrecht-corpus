  - number: '3.13'
    text: |-
      1 Het cijfer van het schoolexamen wordt uitgedrukt in een cijfer uit een schaal van cijfers lopende van 1 tot en
      met 10 met de daartussen liggende cijfers met 1 decimaal.

      2 Indien in een vak geen centraal examen wordt afgelegd, wordt het cijfer van het schoolexamen uitgedrukt in een
      cijfer van 1 tot en met 10, zonder decimaal.

      3 In afwijking van het eerste lid wordt in alle schoolsoorten het vak lichamelijke opvoeding uit het
      gemeenschappelijk deel van elk profiel en in het vmbo de kunstvakken beoordeeld met «goed», «voldoende» of
      «onvoldoende».

      4 De beoordeling van het vak lichamelijke opvoeding en de kunstvakken inclusief culturele en kunstzinnige vorming
      gaat uit van de prestaties van de leerling binnen zijn mogelijkheden, zoals blijkend uit het examendossier.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 In afwijking van [artikel 3.13, eerste lid][ref1], wordt het profielwerkstuk in het vmbo beoordeeld met «goed»,
      «voldoende» of «onvoldoende».

      2 De beoordeling van het profielwerkstuk in het vmbo vindt plaats op de grondslag van het voldoende voltooien van
      het profielwerkstuk, zoals blijkend uit het examendossier.

      3 Het profielwerkstuk in het vmbo wordt beoordeeld door ten minste twee examinatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.14
