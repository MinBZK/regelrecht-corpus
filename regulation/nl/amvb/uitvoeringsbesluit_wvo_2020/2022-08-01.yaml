  - number: '3.34'
    text: |-
      1 De examenkandidaat die eindexamen vwo of havo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor één van de vakken Nederlandse taal en literatuur, Engelse taal en literatuur en voor zover van
      toepassing wiskunde A, wiskunde B of wiskunde C als eindcijfer 5 of hoger heeft behaald en hij voor het andere vak
      of andere hier genoemde vakken als eindcijfer 6 of hoger heeft behaald;

      c. hij onverminderd onderdeel b:

      1°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;

      2°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde van de
      eindcijfers ten minste 6,0 bedraagt;

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald, en het gemiddelde
      van de eindcijfers ten minste 6,0 bedraagt; of

      4°. voor een van de vakken waarvoor een eindcijfer is vastgesteld als eindcijfer 4 en voor een van deze vakken als
      eindcijfer 5 heeft behaald en voor de overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of
      hoger heeft behaald, en het gemiddelde van de eindcijfers ten minste 6,0 bedraagt;

      d. hij voor geen van de onderdelen, genoemd in het tweede lid, lager dan het eindcijfer 4 heeft behaald; en

      e. hij voor het vak lichamelijke opvoeding van het gemeenschappelijk deel van elk profiel, de kwalificatie
      «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, wordt het gemiddelde van de eindcijfers van ten minste de
      volgende onderdelen aangemerkt als het eindcijfer van een vak, voor zover voor deze onderdelen een eindcijfer is
      bepaald: maatschappijleer, culturele en kunstzinnige vorming en het profielwerkstuk. Het bevoegd gezag kan daaraan
      toevoegen:

      a. literatuur, als onderdeel van alle afzonderlijke moderne talen, met dien verstande dat indien het bevoegd gezag
      daartoe niet besluit, literatuur voor de bepaling van de eindcijfers een onderdeel is van het schoolexamen van die
      taal en literatuur;

      b. algemene natuurwetenschappen in vwo en havo;

      c. bij bijzondere scholen: godsdienst of levensbeschouwelijk vormingsonderwijs, met dien verstande dat
      indien het bevoegd gezag hiertoe niet besluit, godsdienst of levensbeschouwelijk vormingsonderwijs geen
      onderdeel is van het eindexamen, tenzij Onze Minister daarvoor goedkeuring heeft verleend met toepassing
      van [artikel 3.1, eerste lid, onderdeel c][ref1], [artikel 3.2, eerste lid, onderdeel c][ref2], of
      [artikel 3.3, eerste lid, onderdeel c][ref3].

      3 Indien het bevoegd gezag toepassing geeft aan het tweede lid, tweede volzin, wordt in het examenreglement vermeld
      welk onderdeel of welke onderdelen zijn toegevoegd voor de bepaling van het eindcijfer, bedoeld in dat lid.

      4 De rector of directeur bepaalt het eindcijfer, bedoeld in het tweede lid, als het rekenkundig gemiddelde van
      de eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      5 Zodra de eindcijfers en indien mogelijk de uitslag zijn vastgesteld, maakt de rector of directeur deze
      schriftelijk aan de examenkandidaat bekend, onder mededeling van het recht van herkansing, bedoeld in
      [artikel 3.38][ref4]. Indien de examenkandidaat geen herexamen doet is deze uitslag de definitieve uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.2
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.3
      [ref4]: https://wetten.overheid.nl/BWBR0045787#Artikel3.38
