  - number: '3.72'
    text: |-
      De examencommissie vavo reikt aan de examenkandidaat die eindexamen heeft afgelegd aan een instelling voor educatie
      en beroepsonderwijs in een of meer vakken, een cijferlijst uit waarop worden vermeld:

      a. de cijfers voor het schoolexamen en het centraal examen;

      b. voor vwo en havo het vak of de vakken en het onderwerp of de titel van het profielwerkstuk;

      c. voor het vmbo het thema en de beoordeling van het profielwerkstuk; en

      d. de eindcijfers voor de examenvakken met inbegrip van het eindcijfer, bedoeld in
      [artikel 3.34, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.34
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.72
    references:
