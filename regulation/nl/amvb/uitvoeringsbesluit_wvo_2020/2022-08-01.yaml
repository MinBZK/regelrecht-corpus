  - number: '3.48'
    text: |-
      1 Een examenkandidaat is geslaagd voor het eindexamen vmbo theoretische leerweg met toekenning van het judicium cum
      laude indien de eindexamenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel; en

      2°. het vak uit het vrije deel waarvoor het hoogste eindcijfer is vastgesteld, en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 3.35][ref1].

      2 Een examenkandidaat is geslaagd voor het eindexamen vmbo basisberoepsgerichte leerweg of kaderberoepsgerichte
      leerweg met toekenning van het judicium cum laude indien de eindexamenuitslag voldoet aan de volgende
      voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van:

      1°. de eindcijfers voor het profielvak en de twee algemene vakken van het profieldeel; en

      2°. het eindcijfer, bedoeld in [artikel 3.35, derde lid][ref2], en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor alle vakken die meetellen bij de
      uitslagbepaling op grond van [artikel 3.35][ref3].

      3 Een examenkandidaat is geslaagd voor het eindexamen vmbo gemengde leerweg met toekenning van het judicium cum
      laude indien de eindexamenuitslag voldoet aan de volgende voorschriften:

      a. ten minste het gemiddelde eindcijfer 8,0, berekend op basis van de eindcijfers voor:

      1°. de vakken Nederlandse taal, Engelse taal en maatschappijleer, en de algemene vakken van het profieldeel; en

      2°. het algemene vak uit het vrije deel of het eindcijfer, bedoeld in [artikel 3.35, derde lid][ref4]; en

      b. ten minste het eindcijfer 6 of ten minste de kwalificatie «voldoende» voor het profielwerkstuk en alle vakken
      die meetellen bij de uitslagbepaling op grond van [artikel 3.35][ref5].


