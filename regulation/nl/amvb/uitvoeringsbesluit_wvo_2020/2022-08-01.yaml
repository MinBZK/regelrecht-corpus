        artikel: '12.34'
  - number: '10.2'
    text: |-
      1 De landelijke commissie voor geschillen, bedoeld in [artikel 12.34 van de wet][ref1], zendt haar oordeel over een
      geschil aan het bevoegd gezag en een afschrift van haar oordeel aan de ouders.

      2 Het bevoegd gezag van de school die het oordeel van de commissie heeft ontvangen, deelt schriftelijk aan de
      ouders en aan de commissie mee wat met het oordeel wordt gedaan.

      3 Indien de beslissing van het bevoegd gezag van de school afwijkt van het oordeel van de commissie, wordt in de
      beslissing de reden voor die afwijking vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel12.34
