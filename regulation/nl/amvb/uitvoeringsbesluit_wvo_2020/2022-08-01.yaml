  - number: '3.57'
    text: |-
      In het examenreglement, bedoeld in [artikel 2.60 van de wet][ref1], kan worden opgenomen dat tot
      herkansingsmogelijkheden van het schoolexamen, bedoeld in [artikel 2.60, eerste lid, onderdeel c, van de wet][ref2]
      kunnen behoren gevallen dat de examenkandidaat door ziekte of ten gevolge van een bijzondere van zijn wil
      onafhankelijke omstandigheid, niet in staat is geweest aan de toets deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.60
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.60
