  - number: '5.1'
    text: |-
      1 Onderwijs in de gemengde leerweg aan een hoofdvestiging of een nevenvestiging van een school voor vbo
      wordt op grond van [artikel 4.20, eerste lid, aanhef en onderdeel d, van de wet][ref1], voor bekostiging in
      aanmerking gebracht, indien het bevoegd gezag van dat onderwijs met het bevoegd gezag van een school voor mavo
      een samenwerkingsovereenkomst heeft gesloten voor de uitwisseling van expertise, de leerlingbegeleiding en de
      examinering.

      2 Het vorige lid is van overeenkomstige toepassing op onderwijs in de gemengde leerweg aan een hoofdvestiging of
      een nevenvestiging van een school voor mavo.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel4.20
