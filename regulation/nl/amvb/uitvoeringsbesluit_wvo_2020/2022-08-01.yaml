  - number: '10.3'
    text: |-
      1 Het eindexamen vmbo en havo omvat voor leerlingen die geen eindexamen afleggen in het vak wiskunde een
      schoolexamen rekenen als bedoeld in [artikel 12.45 van de wet][ref1].

      2 In afwijking van het eerste lid is een kandidaat die in het bezit is van het diploma van
      een leerweg in het vmbo en die het schoolexamen rekenen heeft afgelegd zoals dit op grond van
      [artikel 2, tweede lid, en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2] is
      vastgesteld voor het eindexamen vmbo, bij het afleggen van het eindexamen in een andere leerweg van het vmbo,
      vrijgesteld van het schoolexamen rekenen.

      3 In afwijking van het eerste lid is de kandidaat die het eindexamen vmbo aflegt aan een instelling voor educatie
      en beroepsonderwijs vrijgesteld van het schoolexamen rekenen, indien hij reeds eerder een schoolexamen rekenen
      vmbo of een schoolexamen rekenen havo heeft gemaakt. De vorige volzin is van overeenkomstige toepassing op de
      kandidaat die het eindexamen havo aflegt aan een instelling voor educatie en beroepsonderwijs en reeds eerder een
      schoolexamen rekenen havo heeft gemaakt.

      4 Het cijfer voor het schoolexamen rekenen weegt niet mee in de uitslagbepaling voor het eindexamen vmbo en havo,
      bedoeld in de [artikelen 3.34][ref3] en [3.35][ref4].

      5 In afwijking van de [artikelen 3.40, eerste lid, onderdeel a][ref5], [3.49, tweede lid][ref6],
      [3.72, onderdeel a][ref7], en [3.41, onderdeel b][ref8], wordt het cijfer voor het schoolexamen rekenen vermeld op
      een bijlage bij de cijferlijst.

      6 Indien de kandidaat is vrijgesteld van het schoolexamen rekenen op grond van het vierde lid, wordt het
      schoolexamen rekenen vermeld op een bijlage bij de cijferlijst, zonder vermelding van een cijfer.

      7 Het vijfde lid is van overeenkomstige toepassing op het eindcijfer van het vak wiskunde, indien de kandidaat het
      eindexamen wiskunde heeft afgelegd, het eindcijfer voor wiskunde niet is betrokken in de uitslagbepaling, bedoeld
      in [artikel 3.34][ref9] of [artikel 3.35][ref10], en de kandidaat bedenkingen heeft geuit tegen het opnemen van het
      eindcijfer van het vak wiskunde op de cijferlijst op grond van [artikel 3.40, tweede lid][ref11].

      8 Dit artikel is van overeenkomstige toepassing op de kandidaat die het eindexamen vmbo in de basisberoepsgerichte
      leerweg aflegt ter afsluiting van een leer-werktraject als bedoeld in [artikel 2.103 van de wet][ref12].

      9 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


