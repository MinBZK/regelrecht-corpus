  - number: '4.21'
    text: |-
      1 De examenkandidaat die het staatsexamen vmbo heeft afgelegd, is geslaagd indien:

      a. het rekenkundig gemiddelde van zijn bij het centraal examen behaalde cijfers ten minste 5,5 is;

      b. hij voor het vak Nederlandse taal als eindcijfer 5 of hoger heeft behaald;

      c. hij onverminderd onderdeel b:

      1°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 of hoger en voor de overige
      vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger heeft behaald;

      2°. voor een van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 4 en voor de overige vakken
      waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger heeft behaald;
      of

      3°. voor twee van zijn vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 5 heeft behaald en voor de
      overige vakken waarvoor een eindcijfer is vastgesteld, als eindcijfer 6 of hoger waarvan ten minste een 7 of hoger
      heeft behaald;

      d. hij voor geen van de onderdelen, genoemd in het derde of vierde lid, lager dan het eindcijfer 4 heeft behaald;
      en

      e. als het gaat om een staatsexamen gemengde of theoretische leerweg: hij voor het profielwerkstuk de kwalificatie
      «voldoende» of «goed» heeft behaald.

      2 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de theoretische leerweg het eindcijfer
      van een profielvak of beroepsgericht keuzevak behorende tot het eindexamen van de gemengde leerweg niet
      betrokken, tenzij deze vakken samen ten minste een volledig beroepsgericht programma als bedoeld in
      [artikel 3.7, eerste lid, onderdeel d][ref1], vormen. In dat geval is het vierde lid van overeenkomstige
      toepassing.

      3 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de basisberoepsgerichte leerweg en de
      kaderberoepsgerichte leerweg het gemiddelde van de eindcijfers van alle beroepsgerichte keuzevakken aangemerkt als
      het eindcijfer van één vak.

      4 Bij de uitslagbepaling volgens het eerste lid, onderdeel c, wordt in de gemengde leerweg het gemiddelde van de
      eindcijfers van het profielvak en alle beroepsgerichte keuzevakken aangemerkt als het eindcijfer van een vak, met
      dien verstande dat het eindcijfer voor het profielvak daarbij net zo vaak meetelt als het aantal eindcijfers van
      beroepsgerichte keuzevakken dat in de berekening wordt betrokken.

      5 Het eindcijfer, bedoeld in het derde en vierde lid, wordt bepaald als het rekenkundig gemiddelde van de
      eindcijfers van de samenstellende onderdelen. Indien de uitkomst van deze berekening niet een geheel getal is,
      wordt dat getal indien het eerste cijfer achter de komma een 4 of lager is, naar beneden afgerond en indien dat
      cijfer een 5 of hoger is, naar boven afgerond.

      6 De examenkandidaat wiens staatsexamen niet voldoet aan dit artikel, is afgewezen voor het staatsexamen.

      7 Zodra de uitslag van het staatsexamen is vastgesteld, maakt het college deze samen met de eindcijfers
      schriftelijk aan de examenkandidaat bekend. Indien de examenkandidaat is afgewezen voor het staatsexamen, wordt bij
      de bekendmaking mededeling gedaan van het recht op herkansing als bedoeld in [artikel 4.22][ref2]. De uitslag is de
      definitieve uitslag indien de examenkandidaat geen gebruik maakt van het recht op herkansing.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.7
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel4.22
