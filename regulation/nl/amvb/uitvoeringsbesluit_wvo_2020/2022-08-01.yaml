  - number: '4.2'
    text: |-
      1 Tot het staatsexamen vmbo basisberoepsgerichte leerweg, kaderberoepsgerichte leerweg of gemengde leerweg wordt
      toegelaten de examenkandidaat die:

      a. ten tijde van de aanmelding voor het staatsexamen:

      1°. is ingeschreven als student aan een beroepsopleiding als bedoeld in de [WEB][ref1] of [WEB BES][ref2]; of

      2°. is ingeschreven aan een school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet
      speciaal onderwijs en als extraneus het eindexamen vmbo in een in de aanhef genoemde leerweg heeft afgelegd;

      b. eerder voor het eindexamen vmbo in een in de aanhef genoemde leerweg is afgewezen; en

      c. een cijferlijst overlegt waaruit blijkt dat voor elk van de vakken van het beroepsgerichte programma,
      bedoeld in de [artikelen 3.5, eerste lid, onderdeel c][ref3], [artikel 3.6, eerste lid, onderdeel c][ref4], of
      [artikel 3.7, eerste lid, onderdeel d][ref5], waarin eindexamen is afgelegd, het eindcijfer 6 of hoger is behaald.

      2 Tot het deelstaatsexamen vmbo voor een of meer algemene vakken in de basisberoepsgerichte leerweg,
      kaderberoepsgerichte leerweg of gemengde leerweg wordt ook toegelaten de examenkandidaat die is ingeschreven aan
      een school voor voortgezet speciaal onderwijs of school voor speciaal en voortgezet speciaal onderwijs.


