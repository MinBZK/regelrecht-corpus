  - number: '2.42'
    text: |-
      1 Op de volgende dagen wordt geen onderwijs gegeven:

      a. de zaterdag en de zondag, ingeval van een vijfdaagse schoolweek;

      b. de zondag, ingeval van een zesdaagse schoolweek;

      c. nieuwjaarsdag, tweede Paasdag, Hemelvaartsdag, tweede Pinksterdag en de beide Kerstdagen; en

      d. Koningsdag en Bevrijdingsdag.

      2 Het bevoegd gezag van een bijzondere school waar onderwijs wordt gegeven gebaseerd op een godsdienst of
      levensovertuiging, kan in plaats van of naast de feestdagen, bedoeld in het eerste lid, onderdeel c, andere dagen
      die verband houden met deze godsdienst of levensovertuiging aanwijzen als feestdagen waarop geen onderwijs wordt
      gegeven.

      3 Het bevoegd gezag wijst bij een zesdaagse schoolweek ten hoogste dertien extra dagen per schooljaar aan en
      bij een vijfdaagse schoolweek ten hoogste twaalf extra dagen per schooljaar aan waarop geen onderwijs wordt
      gegeven, waarvan ten hoogste zes dagen onmiddellijk aansluitend voor of na de zomervakantie die voor de school bij
      ministeriële regeling op grond van [2.39, vierde lid, van de wet][ref1] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.39
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.39'
  - number: '2.43'
    text: |-
      1 Het aantal dagen dat per schooljaar ten hoogste als vakantie wordt vastgesteld, bedraagt 66 bij een zesdaagse
      schoolweek en 55 bij een vijfdaagse schoolweek.

      2 Indien voor een school het aantal dagen vakanties dat bij ministeriële regeling op grond van
      [artikel 2.39, vierde lid, van de wet][ref1] wordt vastgesteld lager is dan het aantal dagen, bedoeld in het eerste
      lid, kan het bevoegd gezag voor het betrokken schooljaar extra dagen vakanties vaststellen, met dien verstande dat
      het totaal aantal dagen vakanties het aantal, bedoeld in het eerste lid, niet te boven gaat.

      3 Onder dagen in het eerste lid wordt verstaan elke dag van de week met uitzondering van de zondag bij een
      zesdaagse schoolweek en met uitzondering van de zaterdag en de zondag bij een vijfdaagse schoolweek.

      4 Behalve als zij vallen binnen een vakantie vastgesteld bij ministeriële regeling op grond van
      [artikel 2.39, vierde lid, van de wet][ref2], of door het bevoegd gezag op grond van het tweede lid, worden de
      feestdagen, bedoeld in [artikel 2.42 eerste lid, onderdelen c en d, en tweede lid][ref3], niet meegeteld bij het
      aantal dagen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.39
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.39
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel2.43
