      bekostiging, bedoeld in [artikel 9.25][ref1], waarop het over dat jaar recht heeft.

      2 De aanvullende bekostiging, bedoeld in de [artikelen 5.9][ref2] en [5.10 van de wet][ref3], wordt in een keer
      betaald, dan wel wordt betaald volgens een bij ministeriële regeling te bepalen betaalritme.


