  - number: '3.28'
    text: |-
      Het college kan vakken aanwijzen waarin wegens het zeer geringe aantal examenkandidaten, het centraal examen in het
      tweede tijdvak door dit college wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.28
  - number: '3.29'
    text: |-
      1 Indien een examenkandidaat om een geldige reden, ter beoordeling van de rector of directeur, is verhinderd bij
      het centraal examen van een of meer vakken in het eerste tijdvak aanwezig te zijn, krijgt in het tweede tijdvak de
      gelegenheid het centraal examen alsnog te voltooien. De examenkandidaat maakt in dat geval maximaal twee toetsen
      per dag.

      2 Indien een examenkandidaat ook in het tweede tijdvak om een geldige reden, ter beoordeling van de rector of
      directeur, verhinderd is, of als hij het centraal examen in het tweede tijdvak niet kan voltooien, wordt hij in de
      gelegenheid gesteld in het derde tijdvak ten overstaan van het college zijn eindexamen te voltooien.

      3 Indien het bevoegd gezag op grond van [artikel 3.17, tweede lid][ref1], zelf de afnametijdstippen van een
      centraal examen bepaalt, kan de rector of directeur een examenkandidaat de gelegenheid geven om binnen de
      afnameperiode die het college daarvoor heeft ingesteld, alsnog het centraal examen te voltooien, waarvoor hij
      eerder was verhinderd.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0045787/2022-08-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0045787
        artikel: '3.17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '3.30'
    text: |-
      1 Indien een examenkandidaat gebruik wil maken van de gelegenheid, bedoeld in [artikel 3.29, tweede lid][ref1],
      meldt hij dit zo spoedig mogelijk aan de rector of directeur.

      2 De rector of directeur deelt voorafgaande aan het tweede of het derde tijdvak aan het college mee welke
      examenkandidaten het centraal examen in deze tijdvakken ten overstaan van het college zullen afleggen en in welke
      vakken.

      3 Indien voor een examenkandidaat toepassing is gegeven aan de [artikelen 3.54][ref2] of [3.55][ref3], deelt de
      rector of directeur dit mee aan het college, onder vermelding van de toepassing.

      4 De examenkandidaat levert de opgaven, de door hem gemaakte aantekeningen en andere door hem gemaakte stukken in
      bij een van degenen die toezicht houden. Het college bepaalt in welke gevallen wordt afgeweken van de eerste volzin
      en in welke gevallen en op welk tijdstip de opgaven, de aantekeningen en de andere stukken, bedoeld in die volzin,
      aan de examenkandidaat worden teruggegeven.

      5 Het college deelt het door de examenkandidaat behaalde cijfer voor het centraal examen aan de rector of directeur
      mee.

      6 Indien sprake is van een centraal eindexamen met geheime opgaven, kan de examenkandidaat over zijn werk gedurende
      een periode van zes maanden na de mededeling, bedoeld in het vijfde lid, inlichtingen inwinnen bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0045787#Artikel3.29
      [ref2]: https://wetten.overheid.nl/BWBR0045787#Artikel3.54
      [ref3]: https://wetten.overheid.nl/BWBR0045787#Artikel3.55
