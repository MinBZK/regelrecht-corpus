preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën, mede namens Onze Minister van Buitenlandse Zaken van 26 april
    1996, nr. WJB 96/468 M, in overeenstemming met Onze Ministers van Economische Zaken en Landbouw, Natuurbeheer en
    Visserij;

    Overwegende dat de regeling die in het Besluit financieel verkeer strategische goederen 1981 aangepast dient te
    worden aan verordening (EG) nr. 3381/94 van de Raad van de Europese Unie van 19 december 1994 tot instelling van
    een communautaire regeling voor exportcontrole op goederen voor tweeërlei gebruik en besluit 94/942/GBVB van de
    Raad van de Europese Unie van 19 december 1994 betreffende het gemeenschappelijk optreden, zoals door de Raad
    vastgesteld op grond van artikel J.3 van het Verdrag betreffende de Europese Unie, ten aanzien van de controle op
    uitvoer uit de Gemeenschap van goederen voor tweeërlei gebruik;

    Gelet op artikel 5, eerste lid, van de Wet financiële betrekkingen buitenland 1994;

    De Raad van State gehoord (advies van 15 juli 1996, nr. W06.96 00 197);

    Gezien het nader rapport van Onze Ministers van Financiën en van Buitenlandse Zaken van 18 oktober 1996, nr. WJB
    96/912 4,

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het is aan ingezetenen verboden zonder een door Onze Minister verleende vergunning handelingen te verrichten
      ten behoeve van het financiële verkeer met betrekking tot de transito- en driehoekshandel van goederen
      waarvan de uitvoer zonder vergunning van de Minister van Economische Zaken verboden is op basis van
      [artikel 2, eerste en tweede lid, van het In- en uitvoerbesluit strategische goederen][ref1], welke zich buiten de
      Gemeenschap bevinden, dan wel in de Gemeenschap anders dan in het vrije verkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002408#Artikel2
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002408
        artikel: '2'
  - number: '2.1'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op het financieel verkeer met betrekking tot strategische goederen waarvan
      de uitvoer zonder vergunning is verboden op basis van artikel 3, eerste lid, van [verordening (EG) nr. 1334/2000]
      (32000R1334) van de Raad van de Europese Unie van 22 juni 2000 tot instelling van een communautaire regeling voor
      controle op de uitvoer van producten en technologie voor tweeërlei gebruik (PbEG L 159).


      [ref1]: https://wetten.overheid.nl/BWBR0008298#Artikel1
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008298
        artikel: '1'
  - number: '2.2'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op het financieel verkeer met betrekking tot de uitvoer van strategische
      goederen waarop artikel 6, eerste lid, onder *a*, van de in het eerste lid bedoelde verordening van toepassing
      is, behoudens voor zover met betrekking tot die goederen een internationaal importcertificaat als bedoeld in het
      [Besluit afgifte verklaringen strategische goederen][ref2] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008298#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004001
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008298
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004001
  - number: '3'
    text: Het Besluit financieel verkeer strategische goederen 1981 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel3
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit financieel verkeer strategische goederen 1996.'
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008298/2001-06-10#Artikel5
