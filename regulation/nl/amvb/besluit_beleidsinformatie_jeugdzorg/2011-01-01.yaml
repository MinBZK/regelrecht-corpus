  - number: 6.h
    text: |-
      de datum waarop de stichting het plan, bedoeld in [artikel 13, derde lid, van de wet][ref1] vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '7'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting per jeugdige
      de volgende gegevens over de taken, bedoeld in [artikel 10, eerste lid, onder c en d, van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 7.a
    text: |-
      de datum waarop de stichting de op schrift vastgelegde beslissing heeft ontvangen waaruit blijkt dat een taak een
      aanvang heeft genomen met een aanduiding van de hoedanigheid van degene die de beslissing heeft genomen;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
  - number: 7.b
    text: de datum waarop een taak aanvangt met een omschrijving van de aard;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
  - number: 7.c
    text: de datum waarop een taak eindigt met een aanduiding van de reden daarvan;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
  - number: 7.d
    text: |-
      de datum waarop de stichting aan de jeugdige, zijn ouders of degene die hem als behorende tot hun gezin verzorgen
      en opvoeden mededeelt dat een taak is aangevangen;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
  - number: 7.e
    text: de datum waarop een medewerker van de stichting over een taak een eerste contact heeft met de jeugdige;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
  - number: 7.f
    text: |-
      de datum waarop de stichting het plan, bedoeld in [artikel 13, derde lid, van de wet][ref1] vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '8'
    text: |-
      Voor de verwerking van de gegevens, bedoeld in [artikel 42 van de wet][ref1], registreert de stichting de volgende
      gegevens over de taak, bedoeld in [artikel 10, eerste lid, onder e, van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 8.a
    text: de datum van de melding van kindermishandeling of een vermoeden daarvan;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
  - number: 8.b
    text: de hoedanigheid van de melder;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
  - number: 8.c
    text: |-
      de datum waarop de stichting het advies, bedoeld in [artikel 11, tweede lid, van de wet][ref1] afgeeft waarbij een
      onderscheid wordt gemaakt tussen een eenmalig advies en andere adviezen;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
  - number: 8.d
    text: |-
      de datum waarop het onderzoek, bedoeld in [artikel artikel 11, eerste lid, onder a, van de wet][ref1] aanvangt
      en eindigt;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
  - number: 8.e
    text: het vervolg dat aan het onderzoek wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
  - number: 8.f
    text: of het onderzoek heeft geleid tot de vaststelling van kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel8
  - number: '9.1'
    text: |-
      De in de [artikelen 2 tot en met 8][ref1] bedoelde gegevens worden zodanig geregistreerd dat het mogelijk is
      kruiselingse verbanden te leggen tussen de gegevens die op grond van dit besluit geregistreerd moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0018280#Artikel2
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018280
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De gegevens worden ook overigens op zodanige wijze geregistreerd dat zij op eenvoudige wijze in kwantitatieve en
      kwalitatieve zin zijn te verwerken tot beleidsinformatie voor het beleid, bedoeld in [artikel 42 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
  - number: '10.1'
    text: |-
      Ten behoeve van de verstrekking van de gegevens, bedoeld in [artikel 44, eerste lid, van de wet][ref1], verwerkt de
      stichting de krachtens dit besluit te registeren persoonsgegevens tot niet tot de persoon herleidbare gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
  - number: '10.2'
    text: |-
      De stichting verstrekt geen persoonsgegevens ten behoeve van de verwerking van gegevens, bedoeld in
      [artikel 42 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '42'
  - number: '11.1'
    text: |-
      Voor het verstrekken door de stichting van gegevens aan gedeputeerde staten van betrokken provincies en
      zorgverzekeraars, bedoeld in [artikel 44, eerste lid, van de wet][ref1], bepalen Onze Ministers met het oog op de
      registratie, bedoeld in de [artikelen 2 tot en met 8][ref2], bij ministeriële regeling:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0018280#Artikel2
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0018280
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 11.1.a
    text: welke gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: 11.1.b
    text: de wijze waarop de gegevens worden geregistreerd en verstrekt;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: 11.1.c
    text: de tijdvakken waarop de gegevens die worden verstrekt, betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: 11.1.d
    text: de termijnen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: '11.2'
    text: Onze ministers kunnen beleidsregels vaststellen over de uitleg van dit besluit en de daarop berustende regelingen.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: '11.3'
    text: |-
      Bij de regeling en de beleidsregels, bedoeld in het eerste en tweede lid, kan worden verwezen naar een door Onze
      Ministers goed te keuren informatieprotocol.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel11
  - number: '12'
    text: |-
      Ten behoeve van de verstrekking van gegevens aan Onze Minister van Justitie en de gedeputeerde staten van
      de betrokken provincies, bedoeld in [artikel 44, tweede lid, van de wet][ref1] registreert de raad voor de
      kinderbescherming per minderjarige de volgende gegevens die verband houden met de taken en bevoegdheden van de raad
      op grond van [Boek 1 van het Burgerlijk Wetboek][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002656
  - number: 12.a
    text: |-
      de datum van meldingen bij de raad op grond waarvan een maatregel met betrekking tot het gezag over een
      minderjarige overwogen dient te worden met een aanduiding van de instantie of de hoedanigheid van de melder en het
      vervolg dat aan de melding wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
  - number: 12.b
    text: |-
      de datum van een verzoek van de raad aan een stichting om aanvullende gegevens naar aanleiding van een
      inkennisstelling als bedoeld in [artikel 9, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel9
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '9'
  - number: 12.c
    text: |-
      de datum en aard van een verzoek van de raad waarin de rechter wordt verzocht een maatregel met betrekking tot het
      gezag te nemen;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
  - number: 12.d
    text: |-
      de datum van aanvang en einde van het onderzoek van de raad om te bepalen of een maatregel met betrekking tot het
      gezag overwogen dient te worden;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
  - number: 12.e
    text: |-
      de datum waarop de raad voor de kinderbescherming, na onderzoek om te bepalen of een maatregel met betrekking tot
      het gezag als bedoeld onder a overwogen dient te worden, tot de conclusie komt dat verdere bemoeienis van de raad
      niet meer noodzakelijk is en de raad de cliënt adviseert zich elders voor hulp te vervoegen.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel12
  - number: '13'
    text: |-
      Ten behoeve van de verstrekking van gegevens aan Onze Minister van Justitie en de gedeputeerde staten van
      de betrokken provincies, bedoeld in [artikel 44, tweede lid, van de wet][ref1] registreert de raad voor de
      kinderbescherming per jeugdige gegevens over de datum waarop hij de stichting inschakelt voor vrijwillige
      begeleiding als bedoeld in [artikel 77hh, tweede lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77hh
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77hh
  - number: '14.1'
    text: |-
      Ten behoeve van de verstrekking van gegevens aan Onze Minister van Justitie, bedoeld in
      [artikel 44, tweede lid, van de wet][ref1] registreert de rechtspersoon per minderjarige de
      volgende gegevens die verband houden met de taken en bevoegdheden van de rechtspersoon op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002656
  - number: 14.1.a
    text: de datum van aanmelding;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.c
    text: het geslacht;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.d
    text: het geboorteland of de geboortestreek, alsmede het geboorteland of de geboortestreek van zijn ouders;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.e
    text: de dagbesteding;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.f
    text: de leefsituatie;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.g
    text: de gemeente van inschrijving in het bevolkingsregister;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.h
    text: het adres in de gemeente van inschrijving in het bevolkingsregister;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.i
    text: de verblijfplaats indien deze afwijkt van het adres, bedoeld onder f;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.1.j
    text: de soort verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onverminderd het eerste lid registreert de rechtspersoon per minderjarige bij de taken, bedoeld
      [artikel 10, eerste lid, onder a of b, van de wet][ref1] de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 14.2.a
    text: |-
      de datum waarop een taak als bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] aanvangt en eindigt met
      een aanduiding van de soort voogdij en de reden van beëindiging;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 14.2.b
    text: |-
      de datum waarop de taak, bedoeld in [artikel 10, eerste lid, onder b, van de wet][ref1] aanvangt of wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 14.2.c
    text: |-
      de datum waarop een taak als bedoeld in [artikel 10, eerste lid, onder b, van de wet][ref1] eindigt met een
      aanduiding van de reden daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 14.2.d
    text: |-
      de datum waarop de rechter een machtiging tot uithuisplaatsing heeft gegeven met een aanduiding van de soort
      machtiging uithuisplaatsing en de duur van de machtiging;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.2.e
    text: |-
      de datum waarop de rechtspersoon aan de minderjarige, zijn ouders of degene die hem als behorende tot hun gezin
      verzorgen en opvoeden mededeelt dat een taak is aangevangen;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.2.f
    text: de datum waarop een medewerker van de rechstpersoon over een taak een eerste contact heeft met de cliënt;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
  - number: 14.2.g
    text: |-
      de datum waarop de rechtspersoon het plan, bedoeld in [artikel 13, derde lid, van de wet][ref1] vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '15.1'
    text: |-
      De [artikelen 10][ref1] en [11][ref2] zijn van overeenkomstige toepassing met dien verstande dat de raad voor de
      kinderbescherming en de rechtspersoon geen gegevens verstrekken aan zorgverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0018280#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018280#Artikel11
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018280
        artikel: '10'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018280
        artikel: '11'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      [Artikel 9][ref1] is van overeenkomstige toepassing op de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0018280#Artikel9
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018280
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: '16'
    text: |-
      De raad voor de kinderbescherming en de rechtspersoon verstrekken op verzoek van de Minister van Justitie
      of gedeputeerde staten van de betrokken provincie gegevens met het oog op de registratie, bedoeld in de
      [artikelen 12][ref1] en [13][ref2], ten behoeve van de verwerking, bedoeld in [artikel 42, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018280#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018280#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018280
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018280
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '42'
  - number: '17.1'
    text: |-
      Voor het door gedeputeerde staten van de betrokken provincies verstrekken van gegevens aan Onze Ministers, bedoeld
      in [artikel 44, derde lid][ref1], bepalen Onze Ministers bij ministeriële regeling:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
  - number: 17.1.a
    text: welke gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
  - number: 17.1.b
    text: de wijze waarop de gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
  - number: 17.1.c
    text: de tijdvakken waarop de gegevens die worden verstrekt, betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
  - number: 17.1.d
    text: de termijnen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
  - number: '17.2'
    text: |-
      Bij de regeling, bedoeld in het eerste lid, kan worden verwezen naar een door Onze Ministers goed te keuren
      informatieprotocol.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel17
  - number: '18'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit beleidsinformatie jeugdzorg.'
    url: https://wetten.overheid.nl/BWBR0018280/2011-01-01#Artikel19
