  - number: 14c
    text: |-
      1 Het is verboden een bestrijdingsmiddel met als werkzame stof methylbromide, aluminimumfosfide of magnesiumfosfide
      anders dan voor toepassingen als bedoeld in artikel 1, eerste lid, onderdeel *g*, sub 3 en onderdeel *h*, van de
      wet en anders dan in een speciale installatie waarvoor ingevolge de [Wet milieubeheer][ref1] een vergunning is
      afgegeven voor uitsluitend het gebruik van gasvormende en gasvormige bestrijdingsmiddelen, toe te passen zonder dat
      hierover van tevoren een kennisgeving heeft plaatsgevonden aan de regio-directeur van de Inspectiedienst Sociale
      Zaken en Werkgelegenheid binnen wiens ambtsgebied het betrokken middel wordt toegepast.

      2 Degene die een bestrijdingsmiddel als bedoeld in het eerste lid heeft toegepast is verplicht, zodra het
      behandelde object in aanmerking komt om gasvrij verklaard te worden, hiervan een verklaring aan de opdrachtgever
      te verstrekken.

      3 Onze betrokken Minister stelt nadere regels omtrent de inhoud van de in het eerste lid bedoelde kennisgeving,
      alsmede omtrent de inhoud van de in het tweede lid bedoelde gasvrijverklaring en de omstandigheden waaronder een
      zodanige verklaring afgegeven kan worden. Daarbij wordt tevens bepaald op welke wijze vorengenoemde kennisgeving en
      verklaring moet worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '15'
    text: |-
      1 Ieder, die bedrijfsmatig bestrijdingsmiddelen, genoemd in [artikel 14, eerste lid][ref1], aflevert of hiermede
      bij anderen ontsmettingen of andere bestrijdingen uitvoert, is verplicht:

      a. onverwijld de volgende gegevens in een door hem aan te houden overzichtelijk ingericht register te boeken:

      1e. de benaming en hoeveelheid van het ingekochte, afgeleverde, onderscheidenlijk gebruikte bestrijdingsmiddel;

      2e. de naam en het adres van de leverancier alsmede van de afnemer dan wel van degene, bij wie het middel is
      gebruikt;

      3e. de datum, waarop de onder 1e bedoelde handeling heeft plaatsgehad;

      b. het onder *a* bedoelde register ten minste gedurende één jaar, te rekenen van de datum, waarop hierin voor het
      laatst een boeking is verricht, te bewaren.

      2 Onze Minister van Sociale Zaken en Werkgelegenheid kan bij regeling het eerste lid met betrekking tot bij zijn
      regeling daartoe aangewezen andere bestrijdingsmiddelen van overeenkomstige toepassing verklaren, indien zulks naar
      zijn oordeel geboden is vanwege de gevaarlijkheid dezer middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel14
