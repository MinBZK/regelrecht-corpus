preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Volksgezondheid van 14 april 1964, Directie van de Arbeid,
    Hoofdafd. Wetgevingsbeleid, No. 5663, gedaan mede namens Onze Minister van Landbouw en Visserij;

    Gelet op de artikelen 13, eerste lid, 14 en 15 der Bestrijdingsmiddelenwet 1962 (Stb. 1962, 288);

    Gezien het advies van de Bestrijdingsmiddelencommissie;

    De Raad van State gehoord (advies van 17 juni 1964, No. 81);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Volksgezondheid van 21 juli 1964, Directie van de
    Arbeid, Hoofdafd. Wetgevingsbeleid, No. 6283 en van Onze Minister van Landbouw en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit verstaat onder:

      a. *wet:* de [Bestrijdingsmiddelenwet 1962][ref1];

      b. *vervoeren:* het vervoeren na aflevering aan de kleinhandel, anders dan in een vervoeronderneming, en door de
      gebruiker;

      c. *grondwaterbeschermingsgebied:* een gebied dat krachtens artikel 1.2, tweede lid, onder *a*, van de
      [Wet milieubeheer][ref2] bij de provinciale milieuverordening is aangewezen en waarvoor regels zijn gesteld
      ter bescherming van het grondwater met oog op de waterwinning, daaronder niet begrepen een gebied waarbinnen
      uitsluitend fysische bodemaantastingen worden tegengegaan.

      2 Dit besluit verstaat onder *personeel* mede de personen, die anders dan in dienstbetrekking onder gezag van de
      ondernemer werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0003245
  - number: '2'
    text: |-
      1 Het is verboden bestrijdingsmiddelen in voorraad te hebben of af te leveren anders dan in de verpakking, waarin
      zij voor de eerste maal hier te lande in het verkeer zijn gebracht.

      2 Onze betrokken Minister kan bij regeling van het in het eerste lid gestelde verbod met betrekking tot bij zijn
      regeling daartoe aangewezen bestrijdingsmiddelen vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel2
  - number: '3'
    text: |-
      Het is verboden bestrijdingsmiddelen, waarvan de verpakking ingevolge de voorschriften, gegeven krachtens de
      artikelen 3, tweede lid, onder *b*, 5, derde lid, en 9, derde lid, van de wet, voorzien moet zijn van de afbeelding
      van een doodshoofd of van een Andreaskruis, af te leveren door middel van personeel beneden de leeftijd van
      achttien jaar.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden bestrijdingsmiddelen als in [artikel 3][ref1] bedoeld te vervoeren door middel van personeel
      beneden de leeftijd van achttien jaar.

      2 Degene, die bestrijdingsmiddelen vervoert, is verplicht daarbij zodanige zorgvuldigheid te betrachten als
      redelijkerwijs mag worden gevergd om te voorkomen, dat de verpakking verloren gaat of beschadigd wordt of de
      bestrijdingsmiddelen in handen raken van niet bij het vervoer betrokken personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel3
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '3'
  - number: '5'
    text: |-
      1 Het is verboden bestrijdingsmiddelen, waarvan de verpakking ingevolge de voorschriften, gegeven krachtens de
      artikelen 3, tweede lid, onder *b*, 5, derde lid, en 9, derde lid, van de wet, voorzien moet zijn van de afbeelding
      van een doodshoofd, van een Andreaskruis of van inwerkend zuur, te gebruiken door middel van personeel beneden de
      leeftijd van achttien jaar.

      2 Het is verboden andere bestrijdingsmiddelen dan die, bedoeld in het eerste lid, te gebruiken door middel van
      personeel beneden de leeftijd van zestien jaar.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel5
  - number: 5a
    text: |-
      1 Het is verboden bestrijdingsmiddelen waarvan de verpakking ingevolge de voorschriften, gegeven krachtens
      de artikelen 3, tweede lid, onder *b*, 5, derde lid , en 9, derde lid, van de wet, voorzien moet zijn van een
      afbeelding van een doodshoofd, te gebruiken in volkstuinen en particuliere tuinen, wegbermen, kampeerplaatsen
      als bedoeld in artikel 1, eerste lid, van de Kampeerwet (*Stb.* 1981, 372), voor het publiek toegankelijke
      natuurgebieden, bossen, parken en plantsoenen, alsmede andere plaatsen waar derden ongewild met deze middelen in
      aanraking kunnen komen.

      2 Onze betrokken Minister kan in bijzondere gevallen op een daartoe strekkend verzoek van het in het eerste lid
      neergelegde verbod ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel5a
  - number: '6'
    text: |-
      1 Degene, bij wie bestrijdingsmiddelen worden gebruikt, is verplicht zorg te dragen, dat ten behoeve van de daarbij
      werkzame personen een doelmatige wasplaats met water, zeep en een handdoek aanwezig is.

      2 Degene, die bestrijdingsmiddelen, welke gevaar opleveren voor vergiftiging of huidaandoening, gebruikt, is
      verplicht zorg te dragen, dat ten behoeve van de daarbij werkzame personen doelmatige handschoenen, laarzen,
      kledingstukken, hoofd- en gelaatbedekking en ademhalingsbeschermingsmiddelen beschikbaar zijn en gedurende het
      verrichten van de betrokken werkzaamheden door hen worden gedragen.

      3 Degene, die werkzaam is bij het gebruik van bestrijdingsmiddelen, welke gevaar opleveren voor vergiftiging of
      huidaandoening, is verplicht gedurende het verrichten van de betrokken werkzaamheden doelmatige handschoenen,
      laarzen, kledingstukken, hoofd- en gelaatbedekking en een ademhalingsbeschermingsmiddel te dragen.

      4 Degene, die bestrijdingsmiddelen gebruikt, welke zich in reservoirs, toestellen of leidingen bevinden, is
      verplicht zorg te dragen, dat deze reservoirs, toestellen of leidingen zodanig zijn ingericht, dat zij geen gevaar
      kunnen opleveren en dat zij in verband hiermede zijn voorzien van de nodige controle- en veiligheidsinrichtingen.

      5 Degene, die bestrijdingsmiddelen bedoeld in [artikel 5, eerste lid][ref1], gebruikt, is verplicht zorg te
      dragen, dat geschikte middelen tot het verlenen van eerste hulp bij ongevallen en de op de verpakking van het
      bestrijdingsmiddel vermelde middelen ten dienste van de behandelende arts in voldoende hoeveelheid en in goede
      staat van onderhoud aanwezig zijn. Deze middelen moeten zodanig worden bewaard, dat zij tegen verontreiniging
      zijn beschut en dat er te allen tijde over kan worden beschikt. Onze betrokken Minister kan ter zake nadere
      voorschriften geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel5
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel6
