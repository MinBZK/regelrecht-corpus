        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002450
        artikel: '6'
  - number: '8'
    text: |-
      1 Het is verboden bestrijdingsmiddelen voorhanden of in voorraad te hebben dan wel resten van bestrijdingsmiddelen
      of ongereinigde verpakkingen te bewaren anders dan in een uitsluitend voor dit doel gebezigde bewaarplaats, welke
      voldoet aan de eisen, gesteld in [artikel 9][ref1], en, zo het een betreedbare bewaarplaats betreft, tevens aan de
      eisen, gesteld in [artikel 10][ref2].

      2 Het bepaalde in het eerste lid geldt niet voor het voorhanden of in voorraad hebben in winkels, op markten
      of enige andere voor het publiek toegankelijke verkoopplaats van andere bestrijdingsmiddelen dan die bedoeld in
      [artikel 3][ref3], mits zij zijn bestemd voor gebruik door particulieren en buiten het bereik van kinderen wordt
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002450#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002450#Artikel3
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002450
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002450
        artikel: '3'
  - number: '9'
    text: |-
      1 De toegang tot de bewaarplaats moet buiten de tijd gedurende welke de beheerder onmiddellijk toezicht uitoefent
      met een deugdelijk slot afgesloten zijn en aan de buitenzijde voorzien zijn van een deugdelijk en op doelmatige
      wijze aangebracht waarschuwingssignaal betreffende giftige stoffen, dat is vervaardigd overeenkomstig een door
      Onze Minister van Sociale Zaken en Werkgelegenheid bij regeling vast te stellen model, met daaronder een duidelijk
      leesbaar opschrift luidende: "Bestrijdingsmiddelen".

      2 De elektrische installatie van een bewaarplaats moet zijn vervaardigd van materiaal, dat voldoende tegen
      chemische invloeden bestand is of daartegen is gevrijwaard.

      3 De bewaarplaats moet doelmatig ingericht, doelmatig geventileerd en van deugdelijke constructie zijn. Zij moet in
      goede staat van onderhoud en in zindelijke toestand verkeren.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel9
  - number: '10'
    text: |-
      1 De betreedbare bewaarplaats moet op de buitenlucht geventileerd zijn. Raamopeningen moeten van draadglas of van
      een daaraan gelijkwaardig materiaal voorzien zijn.

      2 In of nabij de bewaarplaats moeten doelmatige brandblusmiddelen en middelen voor het verwijderen van gemorste
      bestrijdingsmiddelen aanwezig zijn.

      3 In of nabij de bewaarplaats moeten beschuttingsmiddelen als in [artikel 6, tweede lid][ref1], bedoeld en een
      wasplaats als in het eerste lid van dat artikel bedoeld aanwezig zijn.

      4 In de bewaarplaats moet, indien daarin een hoeveelheid van 400 of meer kilogram bestrijdingsmiddelen aanwezig is
      of pleegt te zijn, een door het bevoegde districtshoofd der Arbeidsinspectie goedgekeurde instructie, vermeldende
      wat in het belang der veiligheid moet worden gedaan of nagelaten, opgehangen zijn. De instructie moet duidelijk
      zichtbaar en leesbaar zijn.

      5 De bewaarplaats moet, indien daarin een hoeveelheid van meer dan 400 kilogram brandgevaarlijke
      bestrijdingsmiddelen aanwezig is of pleegt te zijn, van brandwerende constructie zijn of doelmatig met brandwerend
      materiaal bekleed zijn.

      6 De deur van de bewaarplaats moet voorzien zijn van een deugdelijk en op doelmatige wijze aangebracht
      verbodssignaal betreffende vuur, open vlam en roken verboden, dat is vervaardigd overeenkomstig een door Onze
      Minister van Sociale Zaken en Werkgelegenheid bij regeling vast te stellen model, alsmede van een duidelijk
      leesbaar opschrift luidende: "Verboden toegang voor onbevoegden".


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel6
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '6'
  - number: '11'
    text: |-
      Degene, die bestrijdingsmiddelen voorhanden of in voorraad heeft in een betreedbare bewaarplaats, is verplicht
      ervoor zorg te dragen, dat in die bewaarplaats niet wordt gerookt en geen open vuur wordt gebezigd.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel11
  - number: '12'
    text: |-
      1 Degene, die bestrijdingsmiddelen voorhanden of in voorraad heeft, is verplicht deze ordelijk op te slaan en bij
      het bewaren zodanige zorgvuldigheid te betrachten als redelijkerwijs mag worden gevergd om te voorkomen, dat de
      verpakking wordt beschadigd of de bestrijdingsmiddelen zich onderling vermengen.

      2 Degene, die bestrijdingsmiddelen voorhanden of in voorraad heeft in een besloten ruimte, is verplicht deze droog,
      koel en zonder dat zij aan bestraling van de zon worden blootgesteld, op te slaan.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel12
  - number: '13'
    text: |-
      1 Het is verboden gebruikte verpakkingen op zodanige wijze te vernietigen, dat die verpakkingen of delen daarvan
      anders dan als grondstof kunnen worden gebezigd.

      2 Het is verboden gebruikte verpakkingen of resten van al dan niet verdunde bestrijdingsmiddelen op zodanige wijze
      te verwijderen dat zij:

      a. in enig oppervlaktewater geraken of kunnen geraken;

      b. in de bodem van een grondwaterbeschermingsgebied geraken of kunnen geraken, met uitzondering van spuitresten van
      bestrijdingsmiddelen die in dat gebied mogen worden gebruikt en van resten aanwezig in spoelwater dat is gebruikt
      voor het reinigen van zo goed mogelijk geledigde apparatuur waarmede die bestrijdingsmiddelen zijn toegepast, mits
      deze spuitresten en resten aanwezig in spoelwater over landbouwgrond worden verspreid;

      c. op of langs de openbare weg geraken of kunnen geraken.

      3 Onze betrokken Minister kan bij regeling nadere regelen stellen omtrent het verwijderen en vernietigen van
      bestrijdingsmiddelen of resten daarvan en van gebruikte verpakkingen. Deze regelen kunnen naar gelang van de aard
      van de verpakking en de aard van het middel verschillen.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel13
  - number: '14'
    text: |-
      1 Degene, die een besloten ruimte, de zich daarin bevindende voorwerpen of produkten of de zich daaronder
      bevindende grond behandelt met cyaanwaterstof, giftige cyaanverbindingen, bestrijdingsmiddelen die giftige
      cyaanverbindingen kunnen opleveren, ethyleenoxyde, mengsels waarin ethyleenoxyde aanwezig is, methylbromide,
      fosforwaterstof of bestrijdingsmiddelen die fosforwaterstof kunnen opleveren, is verplicht ervoor zorg te dragen,
      dat gedurende deze behandeling, alsmede gedurende de inwerking van de daarbij opgekomen gassen of dampen en
      gedurende de ontgassing, aan de buitenzijde van deze ruimte op alle plaatsen, die daartoe toegang verlenen,
      een waarschuwingssignaal betreffende giftige stoffen en een duidelijk leesbaar opschrift zijn aangebracht
      overeenkomstig een door Onze Minister van Sociale Zaken en Werkgelegenheid bij regeling vast te stellen model.
      Hij is voorts verplicht zorg te dragen, dat tijdens de in de vorige volzin bedoelde behandeling en inwerking
      verspreiding dezer middelen buiten de ruimte of grond, waarin deze behandeling plaatsvindt, zoveel mogelijk wordt
      voorkomen.

      2 Degene, bij wie een behandeling als in het eerste lid bedoeld wordt verricht, is verplicht ervoor zorg te dragen,
      dat de ruimte gedurende de in dat lid bedoelde tijd ontoegankelijk is voor onbevoegden en dat het in dat lid
      bedoelde opschrift na de ontgassing wordt verwijderd.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid kan bij regeling de voorgaande leden met betrekking tot bij
      zijn regeling daartoe aangewezen andere bestrijdingsmiddelen van overeenkomstige toepassing verklaren, indien zulks
      naar zijn oordeel geboden is vanwege de gevaren, welke het gebruik van die middelen medebrengt.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel14
  - number: 14a
    text: |-
      1 Het is verboden bestrijdingsmiddelen, genoemd in [artikel 14, eerste lid][ref1], met uitzondering van
      bestrijdingsmiddelen bestemd voor de bestrijding van mollen en woelratten die de werkzame stof fosforwaterstof
      bevatten of kunnen opleveren of aangewezen krachtens het derde lid van dat artikel, te gebruiken, indien de
      betrokken werkzaamheden niet worden verricht door of onder toezicht van een deskundige. Onze Minister van Sociale
      Zaken en Werkgelegenheid kan ten aanzien van door hem aan te geven werkwijzen voorschrijven dat de in de vorige
      volzin bedoelde werkzaamheden slechts door een deskundige mogen worden verricht.

      2 Voor de toepassing van het eerste lid wordt als deskundige aangemerkt een persoon die in het bezit is van
      een door Onze Minister van Sociale Zaken en Werkgelegenheid ten hoogste vijf jaren tevoren afgegeven bewijs dat
      aangeeft:

      a. dat hij voldoende op de hoogte is wanneer en onder welke omstandigheden het gebruik van de daar bedoelde
      bestrijdingsmiddelen verantwoord is en

      b. dat hij voldoende op de hoogte is van de gevaren welke het gebruik met zich brengt en van de wijze waarop deze
      gevaren kunnen worden voorkomen.

      Indien het bewijs slechts betrekking heeft op bepaalde bestrijdingsmiddelen of op bepaalde toepassingen dan wel
      op de behandeling van bepaalde ruimten of terreinen, wordt de betrokkene slechts te dien aanzien als deskundige
      aangemerkt.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid kan een bewijs als bedoeld in het tweede lid binnen vijf jaren
      na de afgifte vervallen verklaren, indien de betrokkene ernstig te kort schiet in hetgeen op grond van dat bewijs
      van hem mag worden verwacht.

      4 Degene die bestrijdingsmiddelen, als bedoeld in het eerste lid, gebruikt, is verplicht ervoor zorg te dragen dat
      de in dat lid bedoelde deskundige zo nodig beschikt over hulpmiddelen waarmee de aanwezigheid of de concentratie
      van het toegepaste bestrijdingsmiddel kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel14
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002450
        artikel: '14'
  - number: 14b
    text: |-
      Een bestrijdingsmiddel, genoemd in [artikel 14, eerste lid][ref1], of aangewezen krachtens het derde lid van dat
      artikel, mag slechts worden afgeleverd aan een persoon die aantoont dat hij de handel in bestrijdingsmiddelen
      uitoefent alsmede aan een persoon:

      a. die in het bezit is van een voor dat middel geldend bewijs als bedoeld in [artikel 14][ref2], of

      b. die beschikt over een door Onze Minister van Sociale Zaken en Werkgelegenheid ten hoogste vijf jaren tevoren
      afgegeven verklaring waaruit blijkt dat hij een persoon in dienst heeft, die in het bezit is van een voor dat
      middel geldend bewijs als bedoeld in [artikel 14][ref3];

      c. die in het bezit is van een door het bevoegde districtshoofd van de Arbeidsinspectie afgegeven vergunning voor
      éénmalige aankoop, of

      d. die in bezit is van een vergunning mollen en woelratten bestrijding afgegeven op grond van het
      [Besluit vakkennis- en vakbekwaamheidseisen bestrijdingsmiddelen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002450#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0002450#Artikel14a
      [ref4]: https://wetten.overheid.nl/BWBR0006814
