  - number: '18'
    text: |-
      1 Door het college kan ten aanzien van bestrijdingsmiddelen, als bedoeld in
      [artikel 15, eerste lid van de wet][ref1], op aanvrage geheel of gedeeltelijk ontheffing worden verleend van de in
      de [artikelen 2][ref2] en [10 van de wet][ref3] gestelde verboden. [Artikel 17, tweede en derde lid][ref4], is van
      overeenkomstige toepassing.

      2 Voorzover bij een ontheffing, als bedoeld in het voorgaande lid, niet anders is bepaald, is de houder van de
      ontheffing, indien bij de beproeving eet- of drinkwaren, genotmiddelen of voor de voortbrenging daarvan bestemde
      gewassen dan wel voor de productie daarvan bestemde delen van gewassen betrokken zijn, verplicht vóór een in
      de ontheffing aangegeven tijdstip aan de Hoofdinspecteur van de Volksgezondheid, belast met het toezicht op
      levensmiddelen, kennis te geven van de beproeving met gebruikmaking van een daartoe door die hoofdinspecteur
      verkrijgbaar te stellen formulier.


