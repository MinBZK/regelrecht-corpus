  - number: '17'
    text: |-
      1 Het bevoegde districtshoofd der Arbeidsinspectie kan van het in de [artikelen 3][ref1], [4, eerste lid][ref2],
      [5][ref3] en [8][ref4] bepaalde op aanvrage ontheffing verlenen.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      3 Een ontheffing kan te allen tijde worden ingetrokken, indien een der criteria, genoemd in artikel 3, eerste lid,
      van de wet, zulks vereist of de reden, waarom de ontheffing is verleend, is vervallen dan wel een aan de ontheffing
      verbonden voorschrift niet wordt nageleefd.

      4 Een belanghebbende kan tegen een besluit als bedoeld in het eerste, tweede en derde lid, beroep instellen bij
      Onze Minister van Sociale Zaken en Werkgelegenheid.


