  - number: '16'
    text: |-
      De [artikelen 4, eerste lid][ref1], [5][ref2], [8][ref3], [12][ref4] en [13, eerste lid][ref5], gelden niet ten
      aanzien van handelingen als daar bedoeld voor zover deze worden verricht door een particulier persoon in of ten
      behoeve van het gebruik in een door hem bewoonde ruimte.


