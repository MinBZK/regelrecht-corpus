  - number: '7'
    text: |-
      Het in de [artikelen 5][ref1] en [6][ref2] met betrekking tot het gebruiken van bestrijdingsmiddelen bepaalde
      is van overeenkomstige toepassing met betrekking tot het verwijderen en vernietigen van gebruikte verpakkingen en
      resten van bestrijdingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002450#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002450#Artikel6
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel7
