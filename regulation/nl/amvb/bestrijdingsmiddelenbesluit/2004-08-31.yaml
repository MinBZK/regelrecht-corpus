  - number: 18a
    text: |-
      1 Door het college kan ten aanzien van bestrijdingsmiddelen, als bedoeld in [artikel 15, tweede lid, van de wet]
      (onbekend) op aanvrage geheel of gedeeltelijk ontheffing worden verleend van de in de [artikelen 2](onbekend) en
      [10 van de wet](onbekend) gestelde verboden.

      2 Bij regeling van Onze betrokken Minister worden regels gesteld omtrent de indiening van een aanvraag en over de
      voorwaarden waaronder een ontheffing, bedoeld in het eerste lid, kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel18a
  - number: '22'
    text: Het Bestrijdingsmiddelenbesluit 1948 (*Stb.* I 368) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel22
  - number: '23'
    text: 'Dit besluit kan worden aangehaald als: Bestrijdingsmiddelenbesluit.'
    url: https://wetten.overheid.nl/BWBR0002450/2004-08-31#Artikel23
  - number: '24'
    text: Dit besluit treedt in werking op het tijdstip, waarop de artikelen 13-15 van de wet in werking treden.
