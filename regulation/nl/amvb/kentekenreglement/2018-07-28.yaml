        bwb_id: BWBR0006622
        artikel: '1'
  - number: 1a.b
    text: motorrijtuigen met een door de constructie bepaalde maximumsnelheid van ten hoogste 6 km/h;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel1a
  - number: 1a.c
    text: motorrijtuigen die bestemd zijn om door een voetganger te worden meegevoerd, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel1a
  - number: 1a.d
    text: |-
      motorrijtuigen met drie symmetrisch geplaatste wielen, waarvan een wiel aan de voorzijde en twee wielen aan de
      achterzijde, die voornamelijk zijn ontworpen voor gebruik buiten de wegen en voor vrijetijdsbesteding.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel1a
  - number: '2.1'
    text: |-
      De opgave van een kenteken geschiedt door inschrijving dan wel door tenaamstelling van een voertuig in het
      kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel2
  - number: '2.2'
    text: Het kenteken bestaat uit een combinatie van letters en cijfers dan wel een combinatie van één letter en cijfers.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel2
  - number: '3'
    text: |-
      Aan een erkend bedrijf of aan een natuurlijke persoon of rechtspersoon als bedoeld in
      [artikel 42, eerste lid, onderdeel b][ref1], kan, mits wordt voldaan aan [hoofdstuk 5][ref2], voor de in
      [artikel 37, derde lid, van de wet][ref3] bedoelde voertuigen een kenteken worden opgegeven bevattende:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006951
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '37'
  - number: 3.a
    text: |-
      voor wat betreft motorrijtuigen, met uitzondering van bromfietsen, de lettergroep HA, HF of FH en twee groepen van
      twee cijfers;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel3
  - number: 3.b
    text: voor wat betreft bromfietsen de lettergroep HC en twee groepen van twee cijfers, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel3
  - number: 3.c
    text: voor wat betreft aanhangwagens de lettergroep OA en twee groepen van twee cijfers.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel3
  - number: '4.1'
    text: |-
      Aan leden van het Koninklijk Huis en aan buitenlandse diplomaten kan een kenteken worden opgegeven, bevattende
      de lettergroep AA, onderscheidenlijk CD, en aan hen die behoren tot het Internationaal Gerechtshof dan wel tot
      een door Onze Minister van Buitenlandse Zaken aangewezen internationale organisatie een kenteken, bevattende de
      lettergroep CDJ.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.2'
    text: |-
      Kentekens, bevattende de lettergroep BN of GN en twee groepen van twee cijfers worden slechts opgegeven voor
      voertuigen:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: 4.2.a
    text: |-
      waarvoor overeenkomstig de voorschriften van de Minister van Financiën een vrijstelling van belasting is verleend,
      of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: 4.2.b
    text: |-
      waarvan de eigenaar of houder behoort tot het personeel van buitenlandse ambassades, consulaten en daarmee
      gelijkgestelde instellingen, voor zover daarvoor naar het oordeel van de Minister van Buitenlandse Zaken aanleiding
      is.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      Kentekens, bevattende de lettergroep GV en twee groepen van twee cijfers, worden slechts opgegeven voor
      motorrijtuigen met beperkte snelheid en landbouw- of bosbouwtrekkers, die in het grensverkeer worden gebezigd
      alsmede voor door deze categorieën voertuigen voortbewogen aanhangwagens.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.4'
    text: |-
      Kentekens, bevattende de lettergroep ZZ of ZZZ en een combinatie van een of meerdere letters of cijfers worden
      slechts opgegeven voor voertuigen die zich in verband met hun constructie uitsluitend op de weg mogen bevinden met
      een ontheffing van de wegbeheerder dan wel van de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.5'
    text: |-
      Kentekens, bevattende twee groepen van drie letters en cijfers of een combinatie daarvan, worden slechts opgegeven
      voor voertuigen die naar het oordeel van de Dienst Wegverkeer technisch in goede staat zijn en die niet in
      Nederland zijn geregistreerd en binnen of buiten Nederland worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.6'
    text: |-
      Kentekens, bevattende de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee cijfers worden
      slechts opgegeven voor voertuigen die ter verkrijging van een kentekenbewijs met één of twee lettergroepen naar en
      van de plaats van weging en onderzoek moeten worden gereden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '4.7'
    text: |-
      Indien naar oordeel van Onze Minister sprake is van een uitzonderlijke gelegenheid met een karakter van nationaal
      of internationaal belang, kunnen tijdelijke kentekens worden opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel4
  - number: '5.1'
    text: Het kenteken wordt aangebracht op een plaat die behoort tot een door de Dienst Wegverkeer goedgekeurde soort.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel5
  - number: '5.2'
    text: Het eerste lid geldt niet in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde plaat en de onderdelen daarvan zijn in bij ministeriële regeling vast te stellen
      gevallen voorzien van bij die regeling vast te stellen merken.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel5
  - number: '6.1'
    text: 'Het kentekenregister bevat uitsluitend de volgende categorieën gegevens:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.a
    text: |-
      de naam, de voornaam of voornamen, de adellijke titel of het predicaat, de geboortedatum, de geboorteplaats, het
      geboorteland, het geslacht en het adres van degene aan wie het kenteken is dan wel was opgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.b
    text: |-
      de naam, het adres en het inschrijvingsnummer bij de Kamer van Koophandel van de rechtspersoon waaraan het kenteken
      is dan wel was opgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.c
    text: |-
      de naam, de voornaam of voornamen, de geboortedatum, de geboorteplaats, het geboorteland, het geslacht en het
      adres van degene die bij de aanvraag van een inschrijving of tenaamstelling als gemachtigde van een rechtspersoon
      is opgetreden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.d
    text: |-
      de naam en het adres van degene die een voertuig waarvoor nog geen kenteken is opgegeven, op Nederlands grondgebied
      heeft gebracht of in Nederland heeft vervaardigd;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.e
    text: |-
      de naam, het adres en de gegevens omtrent het legitimatiebewijs van degene die een voertuig voorgoed buiten
      Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.f
    text: |-
      gegevens omtrent bij de aanvraag van een inschrijving of tenaamstelling alsmede bij de aanvraag van een
      kentekenbewijs overgelegde legitimatiebewijzen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.g
    text: |-
      gegevens omtrent de inschrijving en tenaamstelling en het verval van de tenaamstelling, alsmede de afgifte,
      uitreiking en ongeldigverklaring van het kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.h
    text: |-
      gegevens omtrent de erkenning bedrijfsvoorraad, de erkenning exportdienstverlening en de erkenning tenaamstelling,
      bedoeld in respectievelijk de [artikelen 61a][ref1], [62][ref2] en [66a van de wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 66a
  - number: 6.1.i
    text: |-
      gegevens omtrent de schorsing, bedoeld in [hoofdstuk IV, paragraaf 6 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        paragraaf: '6'
  - number: 6.1.j
    text: |-
      gegevens omtrent de verplichting tot periodieke keuring, bedoeld in [hoofdstuk V van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 6.1.k
    text: |-
      gegevens ten behoeve van de heffing van de motorrijtuigenbelasting, bedoeld in
      de [Wet op de motorrijtuigenbelasting 1994][ref1] en de belasting, bedoeld in de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
  - number: 6.1.l
    text: |-
      gegevens omtrent voertuigen die zijn of waren te naam gesteld alsmede voertuigen die op Nederlands grondgebied zijn
      gebracht of in Nederland zijn vervaardigd, die nog niet zijn ingeschreven of te naam gesteld;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.m
    text: |-
      gegevens omtrent het bepaalde in andere wettelijke regelingen ten aanzien van voertuigen dan de wet en de in
      onderdeel k bedoelde wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.n
    text: |-
      gegevens omtrent in het buitenland geregistreerde voertuigen waarvoor inschrijving of tenaamstelling wordt
      verzocht;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.o
    text: gegevens omtrent typegoedkeuringen van voertuigen, voertuigonderdelen en uitrustingsstukken;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.p
    text: |-
      gegevens in verband met het verwerken van gegevens in het kader van het kentekenregister alsmede het gebruiken van
      deze gegevens door belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.q
    text: gegevens van administratieve aard, verband houdende met de tenaamstelling van voertuigen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.r
    text: gegevens omtrent de vermissing van voertuigen en de aangifte van diefstal of verduistering van voertuigen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.s
    text: |-
      het burgerservicenummer, het administratienummer, bedoeld in
      [artikel 4.9 van de Wet basisregistratie personen][ref1], en het door de Dienst Wegverkeer in het kader van het
      kentekenregister toegekende persoonsidentificatienummer;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: 6.1.t
    text: het gegeven dat degene op wiens naam een voertuig is geregistreerd is overleden, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: 6.1.u
    text: |-
      het gegeven dat ten aanzien van een te naam gesteld voertuig niet is voldaan aan de verplichting tot het
      betalen van motorrijtuigenbelasting als bedoeld in de [Wet op de motorrijtuigenbelasting 1994][ref1],
      of de verplichtingen inzake opgelegde administratieve sancties als bedoeld in de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0004581
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden, voor zover zij verband houden met een tenaamstelling, maximaal negen
      jaar na het verval van de tenaamstelling in het kentekenregister bewaard. De overige gegevens worden gedurende een
      door de Dienst Wegverkeer vastgestelde periode bewaard.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel6
  - number: '7.1'
    text: |-
      Als authentieke gegevens of categorieën daarvan als bedoeld in [artikel 42a, derde lid, van de wet][ref1] worden
      aangewezen gegevens omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 42a
  - number: 7.1.a
    text: |-
      inschrijving en tenaamstelling van een voertuig in het kentekenregister bedoeld in
      [artikel 6, eerste lid, onderdelen f en u][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel6
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.1.b
    text: |-
      een natuurlijk persoon of rechtspersoon aan wie een erkenning bedrijfsvoorraad, een erkenning exportdienstverlening
      of een erkenning tenaamstelling, bedoeld in respectievelijk de [artikelen 61a][ref1], [62][ref2] en
      [66a van de wet][ref3], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 66a
  - number: 7.1.c
    text: voertuigstatus;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.1.d
    text: aansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.1.e
    text: uitvoering en constructie van een voertuig;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.1.f
    text: milieuaspecten van een voertuig; of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.1.g
    text: gebruik van een voertuig.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: '7.2'
    text: 'Als gevoelige gegevens worden aangewezen gegevens of combinaties van gegevens die zijn aan te merken als:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.a
    text: persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.b
    text: |-
      gegevens waarvan de verstrekking een nadelig effect kan hebben op de concurrentiepositie van een onderneming,
      waaronder in elk geval worden verstaan voertuigidentificerende gegevens in combinatie met gegevens ten aanzien van
      een rechtspersoon omtrent:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.b.1°
    text: naam, adres en vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.b.2°
    text: datum van oprichting en opheffing;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.b.3°
    text: aan de rechtspersoon gerelateerde nummers en coderingen, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.b.4°
    text: rechtspersoonsstatus.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c
    text: |-
      gegevens waarvan de verstrekking het risico van handelen in strijd met een wettelijk voorschrift met zich brengt
      waaronder in elk geval worden verstaan gegevens omtrent:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c.1°
    text: identificatie en registratie van een voertuig;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c.2°
    text: diefstal van een voertuig;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c.3°
    text: aansprakelijkheden met betrekking tot het voertuig;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c.4°
    text: Inschrijving- of tenaamstellingsstatus, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: 7.2.c.5°
    text: voertuigstatus.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: '7.3'
    text: Niet-gevoelige gegevens zijn alle gegevens die niet op grond van het tweede lid als gevoelig zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel7
  - number: '8'
    text: 'De Dienst Wegverkeer bepaalt de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8
  - number: 8.a
    text: |-
      overheidsorganen als bedoeld in [artikel 41a, eerste lid, onderdeel a, van de wet][ref1] een melding als bedoeld in
      [artikel 43c, eerste lid, van de wet][ref2] doen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 41a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 43c
  - number: 8.b
    text: |-
      een authentiek gegeven als bedoeld in [artikel 41a, eerste lid, onderdeel c, van de wet][ref1] «in onderzoek» wordt
      geplaatst als bedoeld in [artikel 43c, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 41a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 43c
  - number: 8a
    text: 'Uit het kentekenregister worden door de Dienst Wegverkeer gevoelige gegevens verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8a
  - number: 8a.a
    text: |-
      met de registratie van voertuigen belaste autoriteiten buiten Nederland ten behoeve van de registratie van
      voertuigen aldaar;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8a
  - number: 8a.b
    text: |-
      autoriteiten buiten Nederland die zijn belast met de handhaving van verkeersregels, de opsporing van
      verkeersovertredingen en de heffing van parkeerbelasting of andere heffingen inzake het gebruik van de weg;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8a
  - number: 8a.c
    text: |-
      met de toelating van voertuigen belaste autoriteiten buiten Nederland, omtrent typen voertuigen, voertuigsystemen,
      voertuigonderdelen of technische eenheden en omtrent de uitstoot van verontreinigde gassen en deeltjes;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8a
  - number: 8a.d
    text: |-
      autoriteiten buiten Nederland en instellingen van volkenrechtelijke organisaties voor zover dit ter uitvoering van
      een verdrag of een bindend besluit van een volkenrechtelijke organisaties vereist is.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel8a
  - number: '9.1'
    text: 'Aan de volgende personen en instanties kunnen gevoelige gegevens worden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.1.a
    text: |-
      door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering
      van een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk dan wel, in geval van verstrekking
      van gegevens omtrent de verplichtingen, bedoeld in artikel 19a, eerste lid, onderdeel a, respectievelijk onderdeel
      b, door Onze Minister en Onze Minister van Financiën, respectievelijk Onze Minister en Onze Minister van Justitie,
      gezamenlijk aangewezen beroepsbeoefenaren of categorieën van beroepsbeoefenaren;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.1.b
    text: |-
      door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering van
      een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen informatieproviders;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.1.c
    text: belanghebbenden, niet zijnde personen en instanties als bedoeld in de onderdelen a en b, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.1.d
    text: |-
      onderzoeks- en onderwijsinstellingen, ten behoeve van wetenschappelijk onderzoek voor zover zij aantonen dat dit
      onderzoek namens of in opdracht van een overheidsorgaan wordt uitgevoerd en die gegevens noodzakelijk zijn voor
      dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: '9.2'
    text: |-
      Onverminderd de [artikelen 11 tot en met 14][ref1] kunnen met betrekking tot gevoelige gegevens als bedoeld in
      [artikel 7, tweede lid][ref2], bij ministeriële regeling nadere regels worden gesteld die betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel7
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '7'
        hoofdstuk: '3'
  - number: 9.2.a
    text: de personen en instanties, bedoeld in het eerste lid, aan wie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.2.b
    text: de gevallen waarin wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.2.c
    text: de voorwaarden waaronder wordt verstrekt, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: 9.2.d
    text: de doeleinden waarvoor wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: '9.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent het gebruik van de aan de in het eerste lid genoemde
      personen en instanties verstrekte gegevens. Daarbij kunnen beperkingen aan het gebruik worden gesteld alsmede
      voorschriften ten aanzien van de beveiliging van de verstrekte gegevens en voorschriften voor het verlenen van
      medewerking aan het toezicht door de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel9
  - number: '10.1'
    text: |-
      De aanvraag tot het verstrekken van gegevens geschiedt op door de Dienst Wegverkeer te bepalen wijze en onder
      opgave van de reden, waarbij de identiteit van de aanvrager met voldoende zekerheid door deze dienst kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel10
  - number: '10.2'
    text: |-
      Indien de aanvrager persoonlijk bij de Dienst Wegverkeer verschijnt teneinde een aanvraag tot het verstrekken van
      gegevens in te dienen, legitimeert deze zich ten genoege van deze dienst.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel10
  - number: '10.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien de aanvraag wordt ingediend door belanghebbenden als
      bedoeld in [artikel 9, eerste lid, onderdelen a of b][ref1], mits overeenkomstig het door de Dienst Wegverkeer
      bepaalde, is vastgesteld dat de aanvrager tot één van de genoemde categorieën behoort en voldoende zekerheid is
      verkregen omtrent diens identiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '10.4'
    text: |-
      In afwijking van het eerste tot en met derde lid hoeft bij de aanvraag van niet-gevoelige gegevens geen reden voor
      de aanvraag te worden opgegeven noch is vaststelling van de identiteit van de aanvrager noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel10
  - number: '11.1'
    text: |-
      Nadat een belanghebbende als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], een verzoek om verstrekking van
      persoonsgegevens heeft ingediend, vraagt de Dienst Wegverkeer aan betrokkene toestemming voor de verstrekking van
      deze gegevens. Deze dienst geeft daarbij aan voor welke doeleinden de verstrekking is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Het vragen van toestemming blijft achterwege indien uit het kentekenregister blijkt dat betrokkene zijn toestemming
      aan elke verstrekking aan belanghebbenden als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], heeft
      onthouden, dan wel indien het voertuig waarop de aanvraag betrekking heeft, blijkens door de Dienst Wegverkeer
      aangewezen bescheiden is betrokken bij een verkeersongeval waarbij aan de aanvrager schade is toegebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Aan belanghebbenden als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], worden persoonsgegevens niet
      verstrekt indien betrokkene zijn toestemming daaraan onthoudt, dan wel zijn toestemming aan elke verstrekking aan
      desbetreffende belanghebbenden heeft onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.4'
    text: |-
      In afwijking van het derde lid worden aan belanghebbenden als bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1], de gevraagde gegevens zonder toestemming van betrokkene verstrekt,
      indien het voertuig waarop de aanvraag betrekking heeft, blijkens door de Dienst Wegverkeer aangewezen bescheiden,
      is betrokken bij een verkeersongeval waarbij aan de aanvrager schade is toegebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.5'
    text: |-
      In afwijking van het eerste lid blijft het vragen van toestemming achterwege indien het een aanvraag betreft
      door degene die als eigenaar van het desbetreffende voertuig in het kentekenregister staat geregistreerd tot
      verstrekking van persoonsgegevens met betrekking tot de houder aan wie het kentekenbewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel11
  - number: '12'
    text: |-
      Aan beroepsbeoefenaren of categorieën van beroepsbeoefenaren als bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref1], worden de gevraagde gegevens verstrekt, voor zover zij deze gegevens
      beroepshalve nodig hebben voor het realiseren van rechten en plichten met betrekking tot het desbetreffende
      voertuig of de eigenaar dan wel houder daarvan, die voor de aanvrager of diens cliënt bestaan of kunnen ontstaan,
      voortvloeiend uit wettelijk voorschrift of uit overeenkomst, een en ander voor zover bij de aanwijzing, bedoeld in
      artikel 9, eerste lid, onderdeel a, is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Aan rechtspersonen kunnen gevoelige gegevens worden verstrekt met betrekking tot de motorrijtuigen en aanhangwagens
      ten aanzien waarvan de desbetreffende rechtspersoon als eigenaar dan wel houder in het kentekenregister staat
      geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel13
  - number: '13.2'
    text: |-
      In aanvulling op het eerste lid kunnen aan degene die in het kentekenregister staat geregistreerd als eigenaar
      van een voertuig waarvan het kentekenbewijs is afgegeven aan een houder, gevoelige gegevens als bedoeld in
      [artikel 7, tweede lid, onderdelen b en c][ref1], die betrekking hebben op de houder of diens voertuig worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel7
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '7'
        hoofdstuk: '3'
  - number: '14.1'
    text: |-
      Aan informatieproviders bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], kunnen op aanvraag bij ministeriële
      regeling bepaalde gevoelige gegevens worden verstrekt in overeenstemming met de aanwijzing als bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref2]. De verstrekking van gevoelige gegevens vindt slechts plaats ten behoeve
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: 14.1.a
    text: statistische doeleinden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel14
  - number: 14.1.b
    text: |-
      bij de aanwijzing als bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], aangewezen voertuiginformatiesystemen
      ten behoeve van de voertuigbranche, of


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: 14.1.c
    text: andere bij ministeriële regeling te bepalen doeleinden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel14
  - number: '14.2'
    text: |-
      Aan de in het eerste lid bedoelde informatieproviders worden uitsluitend gegevens verstrekt die de situatie
      weergeven op het moment van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel14
  - number: '15'
    text: |-
      De personen en instanties als bedoeld in [artikel 9, eerste lid][ref1], mogen de aan hen verstrekte gevoelige
      gegevens slechts gebruiken voor de doeleinden waarvoor zij zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      Op verzoek van betrokkene wordt in het kentekenregister geregistreerd dat hij zijn toestemming onthoudt
      aan de verstrekking van op hem betrekking hebbende gevoelige gegevens aan belanghebbenden als bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: 16a
    text: |-
      Het tarief, bedoeld in [artikel 45a, derde lid, van de wet][ref1] wordt in rekening gebracht in bij ministeriële
      regeling te bepalen gevallen aan in die ministeriële regeling aangewezen personen en instanties of categorieën
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
  - number: '17.1'
    text: |-
      In verband met de tenaamstelling van een voertuig in het kentekenregister wordt een kentekencard en een
      kentekenbewijs deel II afgegeven en een tenaamstellingscode verstrekt. De Dienst Wegverkeer houdt het
      kentekenbewijs deel II in bewaring.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: '17.2'
    text: |-
      Het kentekenbewijs deel II wordt aan de eigenaar of houder van een voertuig uitgereikt ten behoeve van het voorgoed
      buiten Nederland brengen van het voertuig.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: '17.3'
    text: |-
      In afwijking van eerste lid wordt geen kentekenbewijs deel II afgegeven voor voertuigen waarvoor een kenteken is
      opgegeven:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: 17.3.a
    text: |-
      als bedoeld in [artikel 4, vijfde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 17.3.b
    text: dat bestaat uit de lettergroep AA, CD, CDJ dan wel de lettergroep BN, GN, of GV en twee groepen van twee cijfers;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: 17.3.c
    text: dat bestaat uit de enkele letter A, E, H, K, L, N, P, S, T, V, W, X of Z en twee groepen van twee cijfers, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: 17.3.d
    text: dat bestaat uit de lettergroep FH, HA, HF, HC of OA en twee groepen van twee cijfers.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: '17.4'
    text: |-
      In afwijking van het tweede lid wordt geen deel II uitgereikt aan de eigenaar, respectievelijk de houder van een
      voertuig, indien uit het kentekenregister blijkt dat het recht op uitreiking van het kentekenbewijs deel II is
      voorbehouden aan de eigenaar, respectievelijk de houder.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: '17.5'
    text: De afgifte van een kentekenbewijs geschiedt niet elektronisch.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
  - number: '17.6'
    text: |-
      In bij ministeriële regeling te bepalen gevallen kan worden afgeweken van het vijfde lid, indien de aanvraag van
      een kentekenbewijs betrekking heeft op een kenteken als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '18'
    text: |-
      Voor voertuigen waarvoor een van de in [artikel 17, derde lid][ref1], bedoelde kentekens is opgegeven, verstrekt de
      Dienst Wegverkeer geen tenaamstellingscode.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '19.1'
    text: |-
      Het in [artikel 48, eerste lid, van de wet][ref1] bedoelde vereiste dat een natuurlijk persoon of een
      rechtspersoon die inschrijving en tenaamstelling verzoekt, in Nederland woonachtig, respectievelijk
      gevestigd moet zijn, is niet van toepassing op aanvragen gericht op opgave van een kenteken als bedoeld in
      [artikel 4, eerste tot en met derde en vijfde tot en met zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Het in [artikel 50, eerste lid, van de wet][ref1] bedoelde vereiste, dat de aanvrager van een
      tenaamstelling persoonlijk dient te verschijnen bij een erkend bedrijf tenaamstelling of bij de Dienst
      Wegverkeer, is niet van toepassing op de aanvraag gericht op de opgave van een kenteken als bedoeld in
      [artikel 4, eerste tot en met derde, vijfde tot en met zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '20.1'
    text: |-
      De tenaamstelling van een voertuig wordt geweigerd indien uit het kentekenregister blijkt dat de aanvrager ten
      aanzien van een of meer voertuigen die op zijn naam in het kentekenregister zijn of waren ingeschreven, niet
      voldoet aan:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel20
  - number: 20.1.a
    text: |-
      de verplichting tot het betalen van motorrijtuigenbelasting als bedoeld in de
      [Wet op de motorrijtuigenbelasting 1994][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006324
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006324
  - number: 20.1.b
    text: |-
      de verplichtingen inzake opgelegde administratieve sancties als bedoeld in de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde weigering vindt slechts plaats indien onherroepelijk vaststaat dat de aanvrager
      tenminste vijf maal niet aan een of meer van de in dat lid bedoelde verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel20
  - number: '21'
    text: |-
      Overeenkomstig [artikel 48, zesde lid, van de wet][ref1] kan een voertuig worden ingeschreven zonder
      tenaamstelling, indien met betrekking tot het voertuig bij een in [artikel 22][ref2] of [26 van de wet][ref3]
      bedoelde keuring niet kan worden vastgesteld, dan wel slechts op termijn kan worden vastgesteld of dat voertuig
      al dan niet voldoet aan de voor toelating tot het verkeer op de weg vastgestelde eisen en inschrijving naar het
      oordeel van de Dienst Wegverkeer verantwoord is.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '26'
  - number: '22.1'
    text: |-
      De verplichting tot het ter inzage afgeven van het kentekenbewijs als bedoeld in [artikel 160 van de wet][ref1],
      heeft betrekking op de voor het voertuig afgegeven kentekencard en op het kentekenbewijs deel II voor zover dit
      door de Dienst Wegverkeer is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
  - number: '22.2'
    text: |-
      De verplichting tot het ter inzage geven van het kentekenbewijs als bedoeld in [artikel 160 van de wet][ref1] geldt
      vanaf het moment waarop het door de Dienst Wegverkeer is uitgereikt. Voor de kentekencard geldt de verplichting tot
      het ter inzage geven in ieder geval vanaf 14 dagen na de tenaamstelling van het voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
  - number: '22.3'
    text: |-
      Indien de in [artikel 160 van de wet][ref1] bedoelde vordering betrekking heeft op een kentekenbewijs dat is
      afgegeven voor een aanhangwagen die overeenkomstig [artikel 3.2][ref2] of [3.7 van de Regeling voertuigen][ref3] is
      voorzien van een constructieplaat, kan aan de vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '3'
  - number: '23.1'
    text: |-
      Gedurende de tijd dat de tenaamstelling van een voertuig is geschorst ingevolge [artikel 67 van de wet][ref1], mag:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
  - number: 23.1.a
    text: |-
      op de dag waarop het voertuig, naar aanleiding van de aanvraag van een keuringsrapport als bedoeld in
      [artikel 75 van de wet][ref1] dan wel naar aanleiding van de aanvraag van een keuring als bedoeld in
      [artikel 99][ref2] of [artikel 106 van de wet][ref3] aan een zodanige keuring wordt onderworpen, met dat voertuig
      via de kortste route naar en van de plaats van keuring worden gereden;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '106'
  - number: 23.1.b
    text: |-
      met een voertuig van 15 jaar of ouder op de weg worden gereden indien er naar het oordeel van Onze Minister van
      Financiën sprake is van een bijzondere gelegenheid en wordt voldaan aan de in het kader daarvan door die minister
      gestelde voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel23
  - number: '23.2'
    text: |-
      Met een voertuig zonder tenaamstelling als bedoeld in [artikel 21][ref1] mag worden gereden gedurende een periode
      van drie maanden na de dag waarop het voertuig is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel21
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '21'
        hoofdstuk: '4'
  - number: '24.1'
    text: |-
      De eigenaar of houder van een voertuig waarvoor opgave van een kenteken als bedoeld in
      [artikel 4, vijfde lid][ref1], wordt gevraagd stelt het desbetreffende voertuig voor een onderzoek ter beschikking
      van de Dienst Wegverkeer onder overlegging van een bij ministeriële regeling aangewezen legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '24.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat een aanvraag als bedoeld in het eerste lid niet binnen een bij die
      regeling te bepalen periode meerdere keren voor hetzelfde voertuig plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel24
  - number: '25.1'
    text: |-
      De eigenaar of houder van een voertuig waarvoor de eerste inschrijving en tenaamstelling wordt gevraagd, stelt
      het voertuig voor een onderzoek ter beschikking bij de Dienst Wegverkeer en legt een bij ministeriële regeling
      aangewezen legitimatiebewijs over.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: '25.2'
    text: |-
      De eigenaar of houder van een voertuig waarvoor de eerste tenaamstelling wordt gevraagd en dat reeds is
      ingeschreven op grond van de bevoegdheid bedoeld in [artikel 46, tweede lid, onderdeel a][ref1], verzoekt
      om tenaamstelling bij de Dienst Wegverkeer onder overlegging van een bij ministeriële regeling aangewezen
      legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '25.3'
    text: |-
      De Dienst Wegverkeer gaat over tot inschrijving en tenaamstelling, respectievelijk tenaamstelling van het voertuig
      van degene die aan de verplichtingen van het eerste respectievelijk het tweede lid heeft voldaan en geeft aan de
      aanvrager een kentekencard af en verstrekt aan hem een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: '25.4'
    text: |-
      Indien de aanvraag wordt gedaan door een erkend bedrijf bedrijfsvoorraad dat geen gebruik maakt van de bevoegdheid
      bedoeld in [artikel 46, tweede lid, onderdeel a][ref1], geeft de Dienst Wegverkeer aan de aanvrager tevens een
      tenaamstellingsverslag af met gegevens die verband houden met de opname in bedrijfsvoorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '25.5'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat tot het moment van uitreiking van de kentekencard aan het erkende
      bedrijf bedrijfsvoorraad de kentekencard ten behoeve van de overdracht van een voertuig op bij ministeriele
      regeling te bepalen wijze en onder bij die regeling te bepalen voorwaarden kan worden vervangen door een tijdelijk
      document.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: '25.6'
    text: |-
      In afwijking van het derde en vierde lid houdt de Dienst Wegverkeer de beslissing op de aanvraag aan indien daartoe
      naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: '25.7'
    text: |-
      Het eerste en het derde tot en met het zesde lid zijn van overeenkomstige toepassing indien inschrijving en
      tenaamstelling wordt aangevraagd voor een voertuig dat reeds eerder was ingeschreven en tenaamgesteld en blijkens
      het kentekenregister:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: 25.7.a
    text: voorgoed buiten gebruik is gesteld;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: 25.7.b
    text: voorgoed buiten Nederland is gebracht;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: 25.7.c
    text: definitief is bestemd voor gebruik buiten de weg; of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: 25.7.d
    text: een kentekenbewijs met een bijzonder kenteken is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25
  - number: 25a.1
    text: |-
      Indien de aanvraag, bedoeld in [artikel 25, tweede lid][ref1], wordt gedaan met betrekking tot een voertuig
      in bedrijfsvoorraad van een erkend bedrijf bedrijfsvooraad dat gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel d][ref2], kan de aanvraag, gericht tot de Dienst Wegverkeer, bij dat bedrijf
      worden ingediend. In afwijking van artikel 25, tweede en derde lid, is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '25'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 25a.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijk persoon legt deze in persoon aan het erkende bedrijf
      bedrijfsvoorraad een bij ministeriele regeling aangewezen legitimatiebewijs over, alsmede een verklaring waaruit
      duidelijk het verzoek tot tenaamstelling blijkt en het kenteken van het voertuig dat wordt overgedragen, en welke
      overigens voldoet aan bij ministeriële regeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3
    text: |-
      Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in het
      handelsregister, machtigt deze het erkende bedrijf bedrijfsvoorraad de aanvraag bij de Dienst Wegverkeer in te
      dienen. Degene die blijkens het handelsregister bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het
      erkende bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.a
    text: een kopie van een bij ministeriële regeling aangewezen legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.b
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.b.1°
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.b.2°
    text: |-
      een opgave van zijn unieke nummer, bedoeld in [artikel 9, onder a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 25a.3.b.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.b.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.3.b.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.4
    text: |-
      Het erkende bedrijf dient de aanvraag bij de Dienst Wegverkeer in en meldt de bij ministeriële regeling
      voorgeschreven gegevens.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.5
    text: |-
      De Dienst Wegverkeer geeft indien aan de verplichtingen in het eerste tot en met het vierde lid is voldaan een
      kentekencard en een tenaamstellingsverslag af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25a.6
    text: |-
      De Dienst Wegverkeer houdt de beslissing op de aanvraag aan, indien daartoe naar het oordeel van deze dienst
      aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25a
  - number: 25b.1
    text: |-
      De eigenaar of houder van een voertuig waarvoor de eerste inschrijving en tenaamstelling wordt gevraagd en waarvoor
      reeds eerder een kentekenbewijs is afgegeven in een andere lidstaat van de Europese Unie, overlegt het deel I van
      dat kentekenbewijs en, voor zover dit is afgegeven, tevens het deel II.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25b
  - number: 25b.2
    text: |-
      Inschrijving en tenaamstelling als bedoeld in het eerste lid wordt geweigerd, indien het deel II van het
      kentekenbewijs, voor zover dat deel is afgegeven, ontbreekt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25b
  - number: 25b.3
    text: |-
      In uitzonderlijke gevallen kan door de Dienst Wegverkeer in afwijking van het tweede lid een voertuig worden
      ingeschreven en te naam gesteld, op voorwaarde dat van de bevoegde autoriteiten van de lidstaat waar het voertuig
      voordien was ingeschreven langs schriftelijke of elektronische weg de bevestiging is verkregen dat de aanvrager het
      recht heeft om het voertuig in een andere lidstaat in te schrijven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25b
  - number: 25b.4
    text: |-
      De Dienst Wegverkeer bewaart de ingenomen kentekenbewijzen dan wel de ingenomen delen daarvan, gedurende zes
      maanden en stelt de autoriteiten van de lidstaat die het kentekenbewijs hebben afgegeven binnen twee maanden na de
      datum van inname daarvan op de hoogte. Op verzoek stuurt de Dienst Wegverkeer de ingenomen kentekenbewijzen terug
      naar de autoriteiten van de lidstaat die het kentekenbewijs hebben afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel25b
  - number: '26.1'
    text: |-
      Degene op wiens naam een voertuig in het kentekenregister is ingeschreven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van
      het voertuig waarvoor de inschrijving gold verplicht terstond de kentekencard ter hand te stellen en de
      tenaamstellingscode terstond mee te delen aan degene die eigenaar of houder van het voertuig is geworden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '26.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden is verplicht binnen een week nadat hij eigenaar of
      houder van het voertuig is geworden bij de Dienst Wegverkeer om tenaamstelling te verzoeken onder overlegging van
      de kentekencard, de tenaamstellingscode en een bij ministeriële regeling aangewezen legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '26.3'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan een
      vrijwaringsbewijs, een tenaamstellingsverslag en een kentekencard af en verstrekt een nieuwe tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '26.4'
    text: |-
      Degene die het vrijwaringsbewijs en het tenaamstellingsverslag heeft ontvangen is verplicht dit terstond tezamen
      met de oude kentekencard te doen toekomen aan degene die is opgehouden eigenaar of houder van het voertuig te zijn.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '26.5'
    text: |-
      In afwijking van het derde lid houdt de Dienst Wegverkeer de beslissing op het verzoek, bedoeld in het tweede lid,
      aan indien daartoe naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '26.6'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van een
      voertuig, aan wie een kentekenbewijs is afgegeven, met de houder, respectievelijk de eigenaar van het voertuig
      overeenkomt dat het voertuig op naam van deze houder, respectievelijk eigenaar als tenaamgestelde in het
      kentekenregister wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel26
  - number: '27.1'
    text: |-
      In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig dat is ingeschreven en te naam
      gesteld, zijn in afwijking van [artikel 26, het tweede tot en met achtste lid][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.2'
    text: |-
      Degene op wiens naam een voertuig in het kentekenregister is ingeschreven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, is verplicht aan het erkende bedrijf bedrijfsvoorraad terstond de
      kentekencard ter hand te stellen en de tenaamstellingscode mee te delen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.3'
    text: |-
      Het erkende bedrijf bedrijfsvoorraad verzoekt terstond nadat het de kentekencard heeft ontvangen en de
      tenaamstellingscode is meegedeeld bij de Dienst Wegverkeer om opname in bedrijfsvoorraad onder vermelding van de
      gegevens op het kentekenbewijs en de tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.4'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan een
      tenaamstellingsverslag en, op verzoek, een kentekencard af en verstrekt een nieuwe tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.5'
    text: 'Het erkende bedrijf bedrijfsvoorraad is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: 27.5.a
    text: |-
      een vrijwaringsbewijs met de middels datacommunicatie ter beschikking gestelde gegevens die verband houden met de
      opname in bedrijfsvoorraad aan te maken, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: 27.5.b
    text: |-
      aan degene die is opgehouden de eigenaar of houder van het voertuig te zijn het vrijwaringsbewijs alsmede de oude
      kentekencard terstond ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat tot het moment van uitreiking van de kentekencard aan het erkende
      bedrijf bedrijfsvoorraad de kentekencard voor de overdracht van een voertuig op bij ministeriële regeling te
      bepalen wijze en onder bij die regeling te bepalen voorwaarden kan worden vervangen door een tijdelijk document.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.7'
    text: |-
      De Dienst Wegverkeer houdt de beslissing op het verzoek, bedoeld in het derde lid, aan indien daartoe naar het
      oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '27.8'
    text: |-
      Het tweede lid, onderdeel b, is niet van toepassing indien de kentekencard verloren is geraakt of teniet is gegaan
      en het erkende bedrijf bedrijfsvoorraad bij het in het derde lid bedoelde verzoek tevens meldt dat het voertuig
      voorgoed buiten gebruik wordt gesteld, mits degene die in het kentekenregister als tenaamgestelde is geregistreerd
      of degene die na diens overlijden eigenaar of houder van het voertuig is geworden:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: 27.8.a
    text: verklaart dat de kentekencard verloren is geraakt of teniet is gegaan, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: 27.8.b
    text: bij het erkende bedrijf bedrijfsvoorraad de bij ministeriële regeling aangewezen documenten overlegt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel27
  - number: '28.1'
    text: |-
      Indien een voertuig dat is ingeschreven en te naam gesteld ophoudt te behoren tot de bedrijfsvoorraad van
      een erkend bedrijf bedrijfsvoorraad, is [artikel 26][ref1] of, in geval van overdracht ten behoeve van een
      bedrijfsvoorraad, [artikel 27][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: '28.2'
    text: |-
      Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad en
      dit bedrijf het voertuig tot eigen gebruik bestemt, verzoekt het bedrijf terstond om tenaamstelling bij de
      Dienst Wegverkeer, onder overlegging van de tenaamstellingscode en een bij ministeriële regeling aangewezen
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28
  - number: '28.3'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan zowel een
      kentekencard als een vrijwaringsbewijs af en verstrekt een nieuwe tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28
  - number: 28a.1
    text: |-
      In geval van overdracht van een voertuig dat ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf
      bedrijfsvoorraad dat gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d][ref1],
      kan, in afwijking van [artikel 28][ref2], een aanvraag om tenaamstelling gericht aan de Dienst Wegverkeer, bij dat
      bedrijf worden ingediend. In afwijking van artikel 28 is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel28
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '28'
        hoofdstuk: '4'
  - number: 28a.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijk persoon legt deze in persoon aan het erkende bedrijf
      bedrijfsvoorraad een bij ministeriële regeling aangewezen legitimatiebewijs over, alsmede een verklaring waaruit
      duidelijk het verzoek tot tenaamstelling blijkt en het kenteken van het voertuig dat wordt overgedragen en welke
      overigens voldoet aan bij ministeriële regeling gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3
    text: |-
      Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in het
      handelsregister, machtigt deze het erkende bedrijf bedrijfsvoorraad de aanvraag bij de Dienst Wegverkeer in te
      dienen. Degene die blijkens het handelsregister bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het
      erkende bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.a
    text: een kopie van een bij ministeriële regeling aangewezen legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.b
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.b.1°
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.b.2°
    text: |-
      een opgave van zijn unieke nummer, bedoeld in [artikel 9, onder a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 28a.3.b.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.b.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.3.b.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: 28a.4
    text: |-
      Het erkende bedrijf bedrijfsvoorraad meldt de bij ministeriële regeling als bedoeld in
      [artikel 62, vierde lid, van de wet][ref1], voorgeschreven gegevens. In geval van een aanvraag als bedoeld in het
      derde lid meldt het bedrijf ook de vestigingsdatum en de gegevens vermeld in de machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 28a.5
    text: |-
      De Dienst Wegverkeer geeft, indien aan de verplichtingen in het tweede tot en met vierde lid is voldaan, een nieuwe
      kentekencard, een tenaamstellingsverslag en een vrijwaringsbewijs af aan de aanvrager en verstrekt een nieuwe
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel28a
  - number: '29.1'
    text: |-
      In afwijking van de [artikelen 26, tweede lid][ref1], en [27, tweede lid][ref2], is, in geval van overlijden van
      degene die in het kentekenenregister als tenaamgestelde staat geregistreerd, degene die als erfgenaam eigenaar of
      houder van het voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is geworden bij de
      Dienst Wegverkeer een verzoek in te dienen om het voertuig op zijn naam te registreren onder overlegging van de
      kentekencard, de tenaamstellingscode en een bij ministeriële regeling aangewezen legitimatiebewijs of, indien de
      tenaamstellingscode niet kan worden niet kan worden overgelegd, een verklaring van erfrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      In afwijking van het eerste lid kan de Dienst Wegverkeer overgaan tot tenaamstelling indien naar het oordeel van
      deze dienst in redelijkheid niet aan de in het eerste lid genoemde verplichtingen kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel29
  - number: '29.3'
    text: |-
      De Dienst Wegverkeer geeft na de wijziging van tenaamstelling als bedoeld in het eerste of tweede lid
      aan de eigenaar een vrijwaringsbewijs, een tenaamstellingsverslag en een kentekencard af en verstrekt een
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel29
  - number: '30.1'
    text: |-
      De Dienst Wegverkeer kan een voertuig te naam stellen zonder dat aan de in de [artikelen 26 tot en met 29][ref1]
      bedoelde verplichtingen is voldaan, indien de aanvraag hiertoe wordt ingediend door een natuurlijk persoon of een
      rechtspersoon die verklaart eigenaar of houder van het voertuig te zijn en indien naar het oordeel van de Dienst
      Wegverkeer aannemelijk is gemaakt dat niet aan bedoelde verplichtingen kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
  - number: '30.2'
    text: |-
      De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van de
      inschrijving en tenaamstelling het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs
      overlegt en de kentekencard, respectievelijk het kentekenbewijs inlevert.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel30
  - number: '31.1'
    text: |-
      Degene die als tenaamgestelde van een voertuig in het kentekenregister is ingeschreven of degene die na diens
      overlijden eigenaar of houder van het voertuig is geworden, is, in geval van overdracht van een voertuig aan een
      in het buitenland woonachtige natuurlijk persoon of een in het buitenland gevestigde rechtspersoon verplicht de
      kentekencard tezamen met de tenaamstellingscode aan de degene aan wie het voertuig wordt overgedragen ter hand
      te stellen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel31
  - number: '31.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij de kentekencard
      en de tenaamstellingscode heeft ontvangen bij de Dienst Wegverkeer de kentekencard, de tenaamstellingscode en een
      bij ministeriële regeling aangewezen legitimatiebewijs over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel31
  - number: '31.3'
    text: |-
      De Dienst Wegverkeer geeft de oude kentekencard en het legitimatiebewijs terug aan degene die aan de in het tweede
      lid bedoelde verplichtingen heeft voldaan en reikt ten behoeve van het voorgoed buiten Nederland brengen van het
      voertuig een kentekenbewijs deel II uit en geeft een vrijwaringsbewijs af aan de in het tweede lid bedoelde persoon
      ten behoeve van de in het eerste lid bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel31
  - number: '31.4'
    text: |-
      Degene die het kentekenbewijs deel II en het vrijwaringsbewijs heeft ontvangen is verplicht het vrijwaringsbewijs
      terstond te doen toekomen aan de in het eerste lid bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel31
  - number: '31.5'
    text: |-
      Het eerste tot en met het vierde lid is van overeenkomstige toepassing in geval van overdracht van een tot de
      bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad behorend voertuig aan een in het buitenland woonachtige
      natuurlijk persoon of een in het buitenland gevestigde rechtspersoon, indien het erkende bedrijf bedrijfsvoorraad
      geen gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '32.1'
    text: |-
      In afwijking van [artikel 31][ref1], is, ingeval het erkende bedrijf bedrijfsvoorraad gebruik maakt van de
      bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel b, het tweede en derde lid][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '31'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '32.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht terstond bij het erkende bedrijf
      bedrijfsvoorraad een bij ministeriële regeling aangewezen legitimatiebewijs over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
  - number: '32.3'
    text: 'Het erkende bedrijf bedrijfsvoorraad is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
  - number: 32.3.a
    text: het legitimatiebewijs te controleren;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
  - number: 32.3.b
    text: |-
      de overdracht van het voertuig aan de in het buitenland woonachtige persoon of de in het buitenland gevestigde
      rechtspersoon terstond te melden aan de Dienst Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
  - number: 32.3.c
    text: een vrijwaringsbewijs aan te maken en onder zich te houden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel32
  - number: '33.1'
    text: |-
      Degene aan wie een kentekencard is afgegeven of degene die na diens overlijden eigenaar of houder van het voertuig
      is geworden, is, ingeval hij het voertuig voorgoed buiten Nederland brengt, verplicht de kentekencard en een bij
      ministeriële regeling aangewezen legitimatiebewijs bij de Dienst Wegverkeer over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel33
  - number: '33.2'
    text: |-
      De Dienst Wegverkeer geeft de kentekencard en het legitimatiebewijs terug aan degene die aan de in het eerste lid
      bedoelde verplichtingen heeft voldaan en reikt tevens tegen betaling van een door de Dienst Wegverkeer te bepalen
      tarief een kentekenbewijs deel II uit.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel33
  - number: '33.3'
    text: |-
      In afwijking van het eerste tot en met tweede lid, is, ingeval het erkende bedrijf bedrijfsvoorraad gebruik maakt
      van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel b][ref1], het erkende bedrijf verplicht het
      voorgoed buiten Nederland brengen van het voertuig te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '34.1'
    text: |-
      Indien een voertuig niet meer overeenstemt met de gegevens in het kentekenregister, is degene op wiens naam het
      voertuig is geregistreerd of degene die na diens overlijden eigenaar of houder van het voertuig is geworden,
      verplicht onverwijld bij de Dienst Wegverkeer de gewijzigde gegevens te melden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel34
  - number: '34.2'
    text: |-
      Indien de melding leidt tot wijziging van een gegeven in het kentekenregister en dit gegeven op de kentekencard
      staat, geeft de Dienst Wegverkeer aan degene die aan de in het eerste lid bedoelde verplichting heeft voldaan een
      kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel34
  - number: '34.3'
    text: |-
      De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in [artikel 98 van de wet][ref1]
      een nieuwe kentekencard af nadat de wijziging is goedgekeurd ingevolge artikel 98 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel98
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '98'
  - number: '35'
    text: |-
      Bij ministeriële regeling kunnen kentekenbewijzen worden aangewezen waarvoor geen bedrag ter dekking van de in
      [artikel 4q, tweede lid, van de wet][ref1], bedoelde kosten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
  - number: '36.1'
    text: |-
      De aanvraag van een vervangende kentekencard of een vervangende tenaamstellingscode geschiedt bij de Dienst
      Wegverkeer door degene die als tenaamgestelde in het kentekenregister is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel36
  - number: '36.2'
    text: |-
      De Dienst Wegverkeer kan verlangen dat bij de aanvraag van een vervangende kentekencard de te vervangen
      kentekencard wordt ingeleverd alsmede dat een bij ministeriële regeling aangewezen legitimatiebewijs wordt
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel36
  - number: '36.3'
    text: |-
      Indien een te vervangen kentekencard is afgegeven aan de houder van een voertuig en deze een vervangende
      kentekencard aanvraagt, kan de Dienst Wegverkeer in door deze dienst te bepalen gevallen verlangen dat de eigenaar
      voor de afgifte van de vervangende kentekencard en de tenaamstellingscode toestemming verleent. In deze gevallen
      kan de Dienst Wegverkeer bepalen dat de vervangende kentekencard en de tenaamstellingscode naar de eigenaar of een
      door deze aangewezen persoon wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel36
  - number: '36.4'
    text: |-
      De aanvraag van een vervangende tenaamstellingscode geschiedt onder overlegging van de kentekencard en een bij
      ministeriële regeling aangewezen legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel36
  - number: '36.5'
    text: |-
      De aanvraag bedoeld in het eerste lid heeft geen betrekking op een kentekenbewijs dat hoort bij een kenteken als
      bedoeld in [artikel 17, derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '38.1'
    text: |-
      De Dienst Wegverkeer kan bepalen dat met een te naam gesteld voertuig niet op de weg mag worden gereden indien naar
      het oordeel van deze dienst:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
  - number: 38.1.a
    text: |-
      het voertuig niet ter beschikking wordt gesteld ten behoeve van de in [artikel 45a, tweede lid, van de wet][ref1]
      bedoelde inspectie, of


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 45a
  - number: 38.1.b
    text: |-
      het voertuig niet voldoet aan een of meer van de in
      [artikel 51a, derde lid, onderdelen b, c, of d, van de wet][ref1] bedoelde eisen


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
  - number: '38.2'
    text: |-
      Het verbod om met een voertuig op de weg te rijden als bedoeld in [artikel 48, zevende lid, van de wet][ref1] geldt
      vanaf het tijdstip waarop dit door een van de in [artikel 159 van de wet][ref2] bedoelde personen is aangezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '159'
  - number: '38.3'
    text: |-
      Indien een situatie als bedoeld in het eerste lid zich voordoet dan wordt daarvan een aantekening in het
      kentekenregister geplaatst.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
  - number: '38.4'
    text: |-
      In afwijking van het tweede lid mag op de dag waarop het voertuig waarvoor de kentekencard is afgegeven naar
      aanleiding van een aanvraag van een keuring als bedoeld in [artikel 99][ref1] of [artikel 106 van de wet][ref2]
      aan een zodanige keuring wordt onderworpen, met dat voertuig via de kortste route naar en van de plaats van keuring
      worden gereden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '106'
  - number: '38.5'
    text: Onverminderd het in het eerste lid bepaalde mag een voertuig waarmee niet mag worden gereden op de weg staan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel38
  - number: '39.1'
    text: |-
      Tot het vorderen tot overgifte als bedoeld in [artikel 60, eerste lid, van de wet][ref1] van de kentekencard zijn
      bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 39.1.a
    text: |-
      de Directie van de Dienst Wegverkeer en de door de Directie daartoe aangewezen tot die dienst behorende ambtenaren,
      indien naar hun oordeel [artikel 60, eerste lid, onderdelen b of c, of tweede lid, van de wet][ref1], van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 39.1.b
    text: |-
      de door Onze Minister in overeenstemming met Onze Minister van Financiën aangewezen ambtenaren der
      Rijksbelastingdienst, indien naar hun oordeel [artikel 60, eerste lid, onderdeel a, van de wet][ref1], van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 39.1.c
    text: |-
      de ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1], indien naar hun oordeel
      [artikel 60, eerste lid, onderdeel a, b of c, of tweede lid, van de wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
  - number: '39.2'
    text: |-
      De verplichting tot overgifte, bedoeld in [artikel 60, eerste lid, van de wet][ref1], heeft betrekking op de
      kentekencard en op het kentekenbewijs deel II indien dit is uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: '39.3'
    text: |-
      Indien dit bij de vordering van de eigenaar of houder dan wel de bezitter wordt geëist, is deze verplicht tot het
      op een daarbij te bepalen tijd en plaats ter beschikking houden van het voertuig, waarop de vordering betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
  - number: '39.4'
    text: |-
      Indien de in het eerste lid bedoelde vordering betrekking heeft op een aanhangwagen die overeenkomstig
      [artikel 3.2][ref1] of [3.7 van de Regeling voertuigen][ref2] is voorzien van een constructieplaat, kan aan de
      vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '3'
  - number: '40'
    text: 'De tenaamstelling in het register vervalt zodra:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
  - number: 40.a
    text: |-
      op grond van een aanvraag als bedoeld in [artikel 26, tweede lid][ref1], een voertuig is tenaamgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
  - number: 40.b
    text: |-
      op grond van een verzoek als bedoeld in [artikel 27, derde lid][ref1], een voertuig is opgenomen in de
      bedrijfsvoorraad;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: 40.c
    text: |-
      op grond van een verzoek als bedoeld in [artikel 28, tweede lid][ref1], een aanvraag als
      bedoeld in [artikel 28a, tweede tot en met vierde lid][ref2], of de verplichting als bedoeld in
      [artikel 29, eerste lid][ref3], een voertuig is tenaamgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel29
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '28'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 28a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '29'
        hoofdstuk: '4'
  - number: 40.d
    text: |-
      krachtens [artikel 30][ref1] het voertuig is ingeschreven en tenaamgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel30
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '30'
        hoofdstuk: '4'
  - number: 40.e
    text: |-
      een erkend bedrijf bedrijfsvoorraad een melding als bedoeld in [artikel 46, tweede lid, onderdeel b of c][ref1],
      heeft gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 40.f
    text: |-
      de Dienst Wegverkeer een certificaat van vernietiging, als bedoeld in artikel 5, derde lid, van richtlijn nr.
      2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000 betreffende autowrakken
      (PbEG L 269), heeft ontvangen dat door een daartoe bevoegde verwerker, zoals bedoeld in deze richtlijn, in een
      andere lidstaat van de Europese Gemeenschappen is afgegeven, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
  - number: 40.g
    text: |-
      de Dienst Wegverkeer de tenaamstelling vervallen heeft verklaard op grond van een verzoek als bedoeld in
      [artikel 40c, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40c
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 40c
        hoofdstuk: '4'
  - number: 40a.1
    text: |-
      De tenaamstelling van een voertuig waarvoor een kenteken als bedoeld in [artikel 4, tweede lid][ref1], is opgegeven
      vervalt na twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 40a.2
    text: |-
      De tenaamstelling van een voertuig waarvoor een kenteken als bedoeld in [artikel 4, vijfde lid][ref1], is opgegeven
      vervalt na twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 40a.3
    text: |-
      De tenaamstelling van een voertuig waarvoor een kenteken, als bedoeld in [artikel 4, zesde lid][ref1], vervalt na
      één dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 40b.1
    text: |-
      De Dienst Wegverkeer verklaart een tenaamstelling vervallen indien deze dienst van oordeel is, dat de
      omstandigheden bedoeld in [artikel 51a, tweede lid, onderdelen a of b, van de wet][ref1] zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 51a
  - number: 40b.2
    text: |-
      De Dienst Wegverkeer kan een tenaamstelling vervallen verklaren indien voor het voertuig, waarvoor de
      tenaamstelling gold een nieuw kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.3
    text: |-
      De Dienst Wegverkeer kan een tenaamstelling vervallen verklaren indien naar het oordeel van deze dienst blijkt dat
      het voertuig waarvoor de tenaamstelling geldt:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.3.a
    text: voorgoed buiten gebruik is gesteld;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.3.b
    text: voorgoed buiten Nederland is gebracht;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.3.c
    text: definitief is bestemd voor gebruik buiten de weg, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.3.d
    text: |-
      is gaan behoren tot een der ingevolge [artikel 37 van de wet][ref1] van de kentekenplicht uitgezonderde categorieën
      van voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: 40b.4
    text: 'De Dienst Wegverkeer kan een tenaamstelling vervallen verklaren indien naar oordeel van deze dienst blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.4.a
    text: |-
      degene op wiens naam het voertuig is ingeschreven opgehouden is eigenaar, bezitter of houder van het voertuig te
      zijn;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.4.b
    text: |-
      de reden waarom voor het voertuig een kenteken bevattende de lettergroep BN, CD, CDJ, GN, GV, ZZ of ZZZ is
      opgegeven is vervallen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.4.c
    text: de eigenaar of houder van het voertuig onvrijwillig het bezit of het houderschap van het voertuig heeft verloren
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.4.d
    text: |-
      degene die als tenaamgestelde in het kentekenregister is ingeschreven niet langer in Nederland woonachtig of
      gevestigd is.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.5
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel a, verklaart de Dienst Wegverkeer de tenaamstelling
      vervallen indien het voorgoed buiten gebruik stellen van het voertuig overeenkomstig het bepaalde krachtens
      [artikel 62, derde lid, van de wet][ref1] wordt gemeld door een erkend bedrijf bedrijfsvoorraad dat gebruik maakt
      van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 40b.6
    text: 'In afwijking van het vijfde lid verklaart de Dienst Wegverkeer een tenaamstelling vervallen indien:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.6.a
    text: |-
      de melding geschiedt door een ander dan een erkend bedrijf bedrijfsvoorraad dat de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c][ref1], heeft verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 40b.6.b
    text: |-
      de melding betrekking heeft op een voertuig dat behoort tot een bij ministeriële regeling aangewezen categorie van
      voertuigen, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.6.c
    text: wordt voldaan aan nadere bij ministeriële regeling vastgestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.7
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel c, verklaart de Dienst Wegverkeer de tenaamstelling vervallen
      indien ten aanzien van de bestemming van het voertuig wordt voldaan aan nadere bij ministeriële regeling
      vastgestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.8
    text: |-
      In het geval, bedoeld in het vierde lid, onderdeel c, verklaart de Dienst Wegverkeer de tenaamstelling
      vervallen indien het verlies van het bezit of het houderschap van het voertuig het gevolg is van
      diefstal of verduistering en hiervan aangifte is gedaan bij een van de in de [artikelen 141][ref1] en
      [142 van het Wetboek van Strafvordering][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 40b.9
    text: 'De op grond van het achtste lid vervallen verklaarde tenaamstelling herleeft:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.9.a
    text: op verzoek van de eigenaar of houder van het voertuig, of
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40b.9.b
    text: |-
      30 dagen na een kennisgeving aan de Dienst Wegverkeer van de in dat lid genoemde personen dat het voertuig niet
      langer wordt vermist.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40b
  - number: 40c.1
    text: |-
      Degene die naar zijn mening ten onrechte als tenaamgestelde in het kentekenregister is vermeld, kan de Dienst
      Wegverkeer verzoeken de tenaamstelling te doen vervallen. De Dienst Wegverkeer verklaart de tenaamstelling
      vervallen indien hiervoor naar het oordeel van deze dienst voldoende gronden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40c
  - number: 40c.2
    text: |-
      De tenaamstelling in het kentekenregister vervalt niet eerder dan op de dag waarop daartoe een verzoek bij deze
      dienst is ingediend.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40c
  - number: 40c.3
    text: |-
      In afwijking van het tweede lid kan de Dienst Wegverkeer in uitzonderlijke gevallen het vervallen van de
      tenaamstelling eerder laten ingaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40c
  - number: 40d
    text: |-
      De Dienst Wegverkeer kan de vervallen tenaamstelling in het register herstellen indien de reden voor
      vervallenverklaring is komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40d
  - number: 40e
    text: |-
      Een wijziging van richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van
      18 september 2000 betreffende autowrakken (PbEG L 269) gaat voor de toepassing van [artikel 40][ref1] en
      [artikel 46][ref2] gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '40'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '41'
    text: |-
      Voor voertuigen als bedoeld in [artikel 37, derde lid, van de wet][ref1], geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits dat voertuig een kenteken voert als bedoeld in
      [artikel 3][ref2], dat behoort bij een ingevolge [artikel 42][ref3] afgegeven handelaarskentekenbewijs waarvan
      gebruik wordt gemaakt overeenkomstig de in dit hoofdstuk bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel42
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
  - number: '42.1'
    text: 'Een handelaarsketekenbewijs kan worden aangevraagd door en worden afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel42
  - number: 42.1.a
    text: een erkend bedrijf, dan wel
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel42
  - number: 42.1.b
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen, waar voertuigen
      bedrijfsmatig voor derden worden hersteld of bewerkt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel42
  - number: '42.2'
    text: De aanvraag wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel42
  - number: '42.3'
    text: |-
      De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel42
  - number: '43'
    text: |-
      Onverminderd [artikel 42][ref1] wordt de afgifte van handelaarskentekenbewijzen geweigerd indien een of meer aan de
      aanvrager afgegeven handelaarskentekenbewijzen op grond van [artikel 45, eerste lid, onderdeel d][ref2], ongeldig
      zijn verklaard binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '45'
        hoofdstuk: '5'
  - number: '44.1'
    text: |-
      Een handelaarskenteken mag slechts worden gebruikt door degene aan wie het is opgegeven dan wel een door deze
      aangewezen persoon. Het gebruik is slechts toegestaan voor de categorie waarvoor het is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel44
  - number: '44.2'
    text: |-
      Een handelaarskenteken mag worden gebruikt voor voertuigen die ter bewerking of herstel aan degene aan wie het
      kenteken is opgegeven ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel44
  - number: '44.3'
    text: |-
      Een handelaarskenteken moet worden gebruikt voor voertuigen die behoren tot de bedrijfsvoorraad van degene aan wie
      het kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel44
  - number: '44.4'
    text: |-
      Een handelaarskenteken mag uitsluitend worden gebruikt indien met het voertuig als bedoeld in het tweede en
      derde lid gebruik van de weg wordt gemaakt in het kader van bedrijfsactiviteiten van het erkende bedrijf of de
      natuurlijke persoon of rechtspersoon aan wie het handelaarskenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel44
  - number: '44.5'
    text: |-
      Voor overtreding van het eerste tot en met vierde lid is degene aan wie het handelaarskenteken is opgegeven
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel44
  - number: '45.1'
    text: |-
      De Dienst Wegverkeer kan een handelaarskentekenbewijs ongeldig verklaren indien degene aan wie het
      handelaarskentekenbewijs is afgegeven:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: 45.1.a
    text: om zodanige ongeldigverklaring verzoekt,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: 45.1.b
    text: aangifte heeft gedaan van het onvrijwillig verlies van het handelaarskentekenbewijs,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: 45.1.c
    text: |-
      niet langer voldoet aan [artikel 42][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
  - number: 45.1.d
    text: 'handelt in strijd met het bepaalde:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: 45.1.d.1°
    text: |-
      bij of krachtens [artikel 37, derde of vierde lid, van de wet][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: 45.1.d.2°
    text: |-
      krachtens [artikel 37, zevende lid, van de wet][ref1], voor zover het betreft nadere regels ter uitvoering van het
      derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '45.2'
    text: |-
      Degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft, levert dit onverwijld in bij de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: '45.3'
    text: |-
      Indien degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft niet voldoet aan de verplichting
      van het tweede lid, kan het handelaarskentekenbewijs worden ingenomen door de daartoe bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45
  - number: 45a
    text: |-
      Na indiening van het verzoek om intrekking, als bedoeld in [artikel 61d, eerste lid, van de wet][ref1], kan de
      Dienst Wegverkeer bepalen dat de erkenning gedurende twee jaar van kracht blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel61d
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 61d
  - number: '46.1'
    text: |-
      Een erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1], wordt verleend teneinde voertuigen met
      behulp van een bedrijfsvoorraadpas in bedrijfsvoorraad op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '46.2'
    text: 'Aan de erkenning kan worden verbonden:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
  - number: 46.2.a
    text: de bevoegdheid tot het versneld aanvragen van de inschrijving van voertuigen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
  - number: 46.2.b
    text: |-
      de bevoegdheid tot het versneld melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten Nederland
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
  - number: 46.2.c
    text: |-
      de bevoegdheid tot het melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten gebruik worden
      gesteld, alsmede het verstrekken van een certificaat van vernietiging, als bedoeld in artikel 5, derde lid,
      van richtlijn nr. 2000/53/EG van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
      betreffende autowrakken (PbEG L 269), met dien verstande dat voor voertuigen waar die richtlijn op van toepassing
      isde melding alleen wordt gedaan nadat het certificaat van vernietiging is verstrekt; en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
  - number: 46.2.d
    text: |-
      de bevoegdheid om in geval van verkoop van een voertuig uit eigen bedrijfsvoorraad namens de aanvrager
      middels een voor datacommunicatie geschikte voorziening bij de Dienst Wegverkeer, overeenkomstig
      [artikel 50, eerste lid, aanhef en onderdeel b, van de wet][ref1] een aanvraag van een tenaamstelling in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
  - number: '47.1'
    text: |-
      Een erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1], kan worden aangevraagd door en worden
      verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 47.1.a
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht of gefabriceerd met het doel deze te verkopen,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
  - number: 47.1.b
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht met het doel deze te bewaren of te bewerken, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
  - number: 47.1.c
    text: |-
      bij ministeriële regeling aan te wijzen personen of instanties die voertuigen in eigendom hebben, zonder deze zelf
      te hebben ingekocht, met het doel deze te verkopen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
  - number: '47.2'
    text: De aanvraag wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
  - number: '47.3'
    text: |-
      De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel47
  - number: '48.1'
    text: |-
      Bij het verlenen van de erkenning verstrekt de Dienst Wegverkeer aan het erkende bedrijf een of meer
      bedrijfsvoorraadpassen van een bij ministeriële regeling vastgesteld model, waarmee de registratie van voertuigen
      in bedrijfsvoorraad kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel48
  - number: '48.2'
    text: |-
      Op aanvraag verstrekt de Dienst Wegverkeer aan een erkend bedrijf meerdere bedrijfsvoorraadpassen als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel48
  - number: '48.3'
    text: |-
      Voor versleten of zoekgeraakte bedrijfsvoorraadpassen verstrekt de Dienst Wegverkeer op aanvraag aan het
      erkende bedrijf vervangende passen. Voor versleten bedrijfsvoorraadpassen geeft de Dienst Wegverkeer niet eerder
      vervangende passen af dan nadat de versleten passen zijn ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel48
  - number: '48.4'
    text: |-
      De Dienst Wegverkeer kan verlangen dat de aanvrager van nieuwe en vervangende bedrijfsvoorraadpassen, bedoeld in
      het tweede en derde lid, de bij ministeriële regeling aangewezen bescheiden overlegt die verband houden met de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel48
  - number: '49.1'
    text: |-
      Indien dit bij de intrekking, wijziging of schorsing van de erkenning als bedoeld in [artikel 65 van de wet][ref1],
      is bepaald, levert degene aan wie de erkenning is dan wel was verleend alle aan hem verstrekte
      bedrijfsvoorraadpassen onverwijld in bij de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '65'
  - number: '49.2'
    text: |-
      Indien degene aan wie de erkenning is dan wel was verleend niet voldoet aan het eerste lid, kunnen de
      bedrijfsvoorraadpassen worden ingenomen door de daartoe bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49
  - number: 49a
    text: |-
      Een erkenning als bedoeld in [artikel 66a, eerste lid, van de wet][ref1], wordt verleend teneinde ten behoeve van
      derden de tenaamstelling van voertuigen in het kentekenregister langs geautomatiseerde weg te beëindigen in verband
      met het voorgoed buiten Nederland brengen van een voertuig.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
  - number: 49b.1
    text: |-
      Een erkenning als bedoeld in [artikel 66a, eerste lid, van de wet][ref1], kan worden aangevraagd door en worden
      verleend aan een natuurlijk persoon of rechtspersoon die exploitant is van een of meer ondernemingen waarin aan
      derden bedrijfsmatig diensten worden verleend in verband met de export van in het kentekenregister tenaamgestelde
      voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel66a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 66a
  - number: 49b.2
    text: De aanvraag wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49b
  - number: 49b.3
    text: |-
      De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel49b
  - number: '50.1'
    text: |-
      De aanvraag bij de Dienst Wegverkeer van een schorsing als bedoeld in [artikel 67 van de wet][ref1] vindt plaats op
      één van de volgende wijzen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
  - number: 50.1.a
    text: |-
      door de kentekencard, een bij ministeriële regeling aangewezen legitimatiebewijs alsmede de tenaamstellingscode
      over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel50
  - number: 50.1.b
    text: langs elektronische weg door gebruikmaking van een door de Dienst Wegverkeer vastgesteld authenticatiemiddel.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel50
  - number: '50.2'
    text: |-
      De Dienst Wegverkeer geeft aan de aanvrager een schorsingsverslag af en in het geval van een aanvraag als bedoeld
      in het eerste lid, onderdeel a, verstrekt deze dienst een nieuwe tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel50
  - number: '51.1'
    text: |-
      Een verzoek tot beëindiging van een schorsing ingevolge [artikel 69 van de wet][ref1] vindt plaats op één van de
      volgende wijzen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
  - number: 51.1.a
    text: |-
      door de kentekencard, een bij ministeriële regeling aangewezen legitimatiebewijs en de tenaamstellingscode bij de
      Dienst Wegverkeer over te leggen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel51
  - number: 51.1.b
    text: langs elektronische weg door gebruikmaking van een door de Dienst Wegverkeer vastgesteld authenticatiemiddel.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel51
  - number: '51.2'
    text: |-
      De Dienst Wegverkeer verstrekt in het geval van een verzoek als bedoeld in het eerste lid, onderdeel a, een nieuwe
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel51
  - number: '52'
    text: 'Een schorsing eindigt niet door gebruik van de weg indien:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel52
  - number: 52.a
    text: |-
