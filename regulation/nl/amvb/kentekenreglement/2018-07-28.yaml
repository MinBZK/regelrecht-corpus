        artikel: '59'
        hoofdstuk: '10'
  - number: '55.2'
    text: |-
      Voor de toepassing van [artikel 5 van het Reglement kentekenregistratie][ref1] wordt met een kentekenbewijs
      gelijkgesteld een kentekenbewijs, afgegeven op basis van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002938#Artikel5
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002938
        artikel: '5'
  - number: '57.1'
    text: |-
      De [artikelen 17][ref1] en [23 van het Reglement kentekenregistratie][ref2], zoals deze artikelen luidden vóór
      het tijdstip waarop zij op grond van [artikel 59][ref3] zijn ingetrokken, blijven van kracht ten aanzien van op
      basis van de Wegenverkeerswet afgegeven kentekenbewijzen die vóór bedoeld tijdstip met toepassing van genoemde
      [artikelen 17][ref4] en [23][ref5] ongeldig zijn verklaard en moeten worden ingeleverd, indien op eerderbedoeld
      tijdstip die inlevering nog niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002938#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002938#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel23
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002938
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002938
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '59'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '23'
        hoofdstuk: '4'
  - number: '57.2'
    text: |-
      Op basis van de Wegenverkeerswet afgegeven kentekenbewijzen die nog niet op grond van
      [artikel 54, eerste lid][ref1], zijn vervangen, worden voor de toepassing van de [artikelen 37][ref2] en [45][ref3]
      gelijkgesteld met kentekenbewijzen, afgegeven op basis van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '54'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '37'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '45'
        hoofdstuk: '5'
  - number: '58'
    text: |-
      Voor de toepassing van dit besluit wordt een op basis van het [Reglement kentekenregistratie][ref1] afgegeven kopie
      deel III gelijkgesteld met een overschrijvingsbewijs tot het tijdstip dat het kopie deel III is vervangen door een
      zodanig bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002938
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002938
  - number: 58a
    text: |-
      In afwijking van de [artikelen 26 tot en met 30][ref1] en [34][ref2] zijn op driedelige kentekenbewijzen
      alsmede op kentekenbewijzen die bestaan uit een deel I dat is afgegeven voor 31 mei 2004, een deel I B en een
      overschrijvingsbewijs, de [artikelen 58b tot en met 58i][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '34'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
  - number: 58b.1
    text: |-
      Degene aan wie een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van het
      voertuig waarvoor dat kentekenbewijs is afgegeven, verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58b.1.a
    text: |-
      het deel II of het deel I B en het overschrijvingsbewijs terstond over te dragen aan degene die eigenaar of houder
      van het voertuig is geworden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.1.b
    text: |-
      het deel I van het kentekenbewijs onder zich te houden, totdat hij het in het derde lid bedoelde vrijwaringsbewijs
      en het oude deel II of I B heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.2
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel II
      of I B en het overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om tenaamstelling te verzoeken
      onder overlegging van het deel II of I B, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.3
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan, een
      vrijwaringsbewijs, een tenaamstellingsverslag een kentekencard af en verstrekt een tenaamstellingcode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.4
    text: |-
      Degene die het vrijwaringsbewijs en de tenaamstellingcode heeft ontvangen, is verplicht deze terstond, tezamen met
      het oude deel II of I B, te doen toekomen aan degene die het deel I, bedoeld in het eerste lid, onderdeel b, onder
      zich heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.5
    text: |-
      Degene die het deel I, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden, is verplicht dit terstond
      af te geven aan degene van wie hij het vrijwaringsbewijs en het oude deel II of I B heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
  - number: 58b.6
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van
      een voertuig, aan wie een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven, met de houder,
      respectievelijk de eigenaar van het voertuig overeenkomt dat het kenteken aan deze houder, respectievelijk eigenaar
      wordt opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58c.1
    text: |-
      In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig waarvoor
      een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven, zijn in afwijking van
      [artikel 58b, het tweede tot en met zesde lid][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
  - number: 58c.2
    text: |-
      Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.2.a
    text: |-
      aan het erkende bedrijf bedrijfsvoorraad terstond het deel II of I B van het kentekenbewijs en het
      overschrijvingsbewijs over te dragen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.2.b
    text: |-
      het deel I van het kentekenbewijs onder zich te houden totdat hij het in het vijfde lid bedoelde vrijwaringsbewijs
      en het oude deel II of I B heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.3
    text: |-
      Het erkende bedrijf bedrijfsvoorraad is verplicht binnen een week, nadat hij het deel II of I B en het
      overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om opname in bedrijfsvoorraad te verzoeken onder
      overlegging van deel II of I B, het overschrijvingsbewijs en de bedrijfsvoorraadpas.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.4
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan een
      tenaamstellingsverslag en op verzoek een kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.5
    text: 'Het erkende bedrijf bedrijfsvoorraad is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.5.a
    text: |-
      een vrijwaringsbewijs met de middels datacommunicatie ter beschikking gestelde gegevens die verband houden met de
      opname in bedrijfsvoorraad aan te maken, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.5.b
    text: |-
      aan degene van wie hij het deel II of I B en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs
      alsmede het oude deel II of I B terstond ter hand te stellen
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.6
    text: |-
      Het tweede en het vijfde lid zijn niet van toepassing indien een of meer delen van het kentekenbewijs verloren
      zijn geraakt of teniet zijn gegaan en het erkende bedrijf bedrijfsvoorraad bij de in het achtste lid, onderdeel
      a, bedoelde melding tevens meldt dat het voertuig voorgoed buiten gebruik wordt gesteld, mits degene aan wie het
      kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58c.6.a
    text: |-
      aan het erkende bedrijf terstond de niet verloren geraakte of teniet gegane delen van het kentekenbewijs
      overdraagt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.6.b
    text: |-
      verklaart dat de niet aan het erkende bedrijf overgedragen delen van het kentekenbewijs verloren zijn geraakt of
      teniet zijn gegaan, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58c.6.c
    text: bij het erkende bedrijf de bij ministeriële regeling aangewezen documenten overlegt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58c
  - number: 58d.1
    text: |-
      Indien een voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven, ophoudt te behoren
      tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad, is [artikel 58b][ref2] of, in geval van overdracht
      ten behoeve van een bedrijfsvoorraad, [artikel 58c][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58c
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58c
        hoofdstuk: 9A
  - number: 58d.2
    text: |-
      Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad en dit
      bedrijf het voertuig tot eigen gebruik bestemt, verzoekt het bedrijf terstond om tenaamstelling bij de Dienst
      Wegverkeer, onder overlegging van het bedrijfsvoorraad deel II of I B, het overschrijvingsbewijs en een bij
      ministeriële regeling aangewezen legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58d
  - number: 58d.3
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan, zowel een
      vrijwaringsbewijs, een tenaamstellingsverslag als een kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58d
  - number: 58e.1
    text: |-
      In geval van overdracht van een voertuig dat ophoudt te behoren tot de bedrijfsvoorraad van een erkende bedrijf
      bedrijfsvoorraad dat gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d, ][ref1]kan,
      in afwijking van artikel 58d, een aanvraag om tenaamstelling, gericht aan de Dienst Wegverkeer, bij dat bedrijf
      worden ingediend. In afwijking van [artikel 58d][ref2] is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58d
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58d
        hoofdstuk: 9A
  - number: 58e.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijk persoon overlegt deze in persoon aan het erkende bedrijf
      bedrijfsvoorraad een bij ministeriële regeling aangewezen legitimatiebewijs, alsmede een verklaring waaruit
      duidelijk het verzoek tot tenaamstelling blijkt en het kenteken van het voertuig dat wordt overgedragen, en welke
      overigens voldoet aan bij ministeriële regeling als bedoeld in [artikel 50, vijfde lid, van de wet][ref1], gestelde
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
  - number: 58e.3
    text: |-
      Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in het
      handelsregister, machtigt deze het erkende bedrijf bedrijfsvoorraad de aanvraag bij de Dienst Wegverkeer in te
      dienen. Degene die blijkens het handelsregister bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het
      erkende bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.a
    text: een kopie van een bij ministeriële regeling aangewezen legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.b
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.b.1°
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.b.2°
    text: |-
      een opgave van zijn unieke nummer, bedoeld in [artikel 9, onder a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 58e.3.b.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.b.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.3.b.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58e.4
    text: |-
      Het erkende bedrijf bedrijfsvoorraad meldt de bij ministeriële regeling als bedoeld in
      [artikel 62, vierde lid, van de wet][ref1], voorgeschreven gegevens vermeld op het overschrijvingsbewijs, op het
      bedrijfsvoorraad deel II of I B en het burgerservicenummer dan wel het rijbewijsnummer. In geval van een aanvraag
      als bedoeld in het tweede lid meldt het bedrijf ook de geboortedatum van de aanvrager. In geval van een aanvraag
      als bedoeld in het derde lid meldt het bedrijf ook de vestigingsdatum en de gegevens, vermeld in de machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 58e.5
    text: |-
      De Dienst Wegverkeer geeft, indien aan de verplichtingen in het tweede tot en met vierde lid is voldaan, aan
      de aanvrager een nieuwe kentekencard, een tenaamstellingsverslag en een vrijwaringsbewijs af en verstrekt een
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58e
  - number: 58f.1
    text: |-
      In afwijking van de [artikelen 58b, tweede lid][ref1], en [58c, derde lid][ref2], is, in geval van overlijden
      van degene aan wie een kentekenbewijs als bedoeld in [artikel 58a][ref3] is afgegeven, degene die als erfgenaam
      eigenaar of houder van het voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is
      geworden bij de Dienst Wegverkeer een verzoek in te dienen om het voertuig op zijn naam te registreren onder
      overlegging van het deel II, het deel I B of het bedrijfsvoorraad deel II of I B, het overschrijvingsbewijs en een
      bij ministeriële regeling aangewezen legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58c
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58c
        hoofdstuk: 9A
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58f.2
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het eerste lid heeft voldaan, zowel een
      kentekencard, een tenaamstellingsverslag, als een vrijwaringsbewijs af en verstrekt een tenaamstellingcode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58f
  - number: 58g.1
    text: |-
      De Dienst Wegverkeer kan een voertuig tenaamstellen zonder dat aan de in de [artikelen 58b tot en met 58f][ref1]
      bedoelde verplichtingen is voldaan, indien de aanvraag hiertoe wordt ingediend door een natuurlijk persoon of een
      rechtspersoon die verklaart eigenaar of houder van het voertuig te zijn en indien naar het oordeel van de Dienst
      Wegverkeer aannemelijk is gemaakt dat niet aan bedoelde verplichtingen kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
  - number: 58g.2
    text: |-
      De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van de
      tenaamstelling het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs overlegt en een of
      meer delen van het kentekenbewijs inlevert.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58g
  - number: 58h.1
    text: |-
      Indien het voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven niet meer
      overeenstemt met de gegevens op het deel I, is degene aan wie het kentekenbewijs is afgegeven of degene die na
      diens overlijden eigenaar of houder van het voertuig is geworden, verplicht onverwijld bij de Dienst Wegverkeer de
      gewijzigde gegevens te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58h
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58h.2
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de in het eerste lid bedoelde verplichting heeft voldaan een nieuwe
      kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58h
  - number: 58h.3
    text: |-
      De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in [artikel 98 van de wet][ref1]
      een nieuwe kentekencard af nadat de wijziging is goedgekeurd ingevolge artikel 98 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel98
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58h
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '98'
  - number: 58i
    text: |-
      Indien de aanvraag tot schorsing van de tenaamstelling betrekking heeft op een kentekenbewijs als bedoeld in
      [artikel 58a][ref1] geldt:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58i
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58a
        hoofdstuk: 9A
  - number: 58i.a
    text: |-
      in afwijking van de [artikelen 50, eerste lid, onderdeel a][ref1], dat het deel II dan wel deel I B van het
      betrokken kentekenbewijs, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen legitimatiebewijs
      worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58i
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '50'
        hoofdstuk: '7'
  - number: 58i.b
    text: |-
      in afwijking van de [artikelen 50, tweede lid][ref1], dat de aanvrager, na ontvangst van het nieuwe deel I B van
      het betrokken kentekenbewijs, het ongeldig geworden deel II dan wel deel I B, respectievelijk het deel IA en het
      deel IB van het kentekenbewijs vernietigt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58i
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '50'
        hoofdstuk: '7'
  - number: 58j
    text: |-
      In afwijking van de [artikelen 22][ref1], [26 tot en met 31][ref2], [34][ref3], [36][ref4], [39][ref5],
      [50][ref6] en [51][ref7] zijn op tweedelige kentekenbewijzen afgegeven na 31 mei 2004, maar voor 1 januari 2014 de
      [artikelen 58k tot en met 58w][ref8] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel39
      [ref6]: https://wetten.overheid.nl/BWBR0006951#Artikel50
      [ref7]: https://wetten.overheid.nl/BWBR0006951#Artikel51
      [ref8]: https://wetten.overheid.nl/BWBR0006951#Artikel58k
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58j
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '22'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '34'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: '36'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '39'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0006951
        artikel: '50'
        hoofdstuk: '7'
      - id: ref7
        bwb_id: BWBR0006951
        artikel: '51'
        hoofdstuk: '7'
      - id: ref8
        bwb_id: BWBR0006951
        artikel: 58k
        hoofdstuk: 9b
  - number: 58k.1
    text: |-
      De verplichting tot het ter inzage afgeven van het kentekenbewijs als bedoeld in artikel 160 van de wet, heeft
      betrekking op het voor het voertuig afgegeven kentekenbewijs deel I, indien sprake is van een kentekenbewijs als
      bedoeld in [artikel 58j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58k
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58k.2
    text: |-
      Indien de in [artikel 160 van de wet][ref1] bedoelde vordering betrekking heeft op een kentekenbewijs dat is
      afgegeven voor een aanhangwagen die overeenkomstig [artikel 3.2][ref2] of [3.7 van de Regeling voertuigen][ref3] is
      voorzien van een constructieplaat, kan aan de vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58k
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '160'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '3'
  - number: 58l.1
    text: |-
      Degene aan wie een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van het
      voertuig waarvoor dat kentekenbewijs is afgegeven, verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58l.1.a
    text: |-
      het deel I B en het overschrijvingsbewijs terstond over te dragen aan degene die eigenaar of houder van het
      voertuig is geworden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.1.b
    text: |-
      het deel I A van het kentekenbewijs onder zich te houden, totdat hij het in het derde lid bedoelde
      vrijwaringsbewijs en het oude deel I B heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.2
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel
      I B en het overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om tenaamstelling te verzoeken
      onder overlegging van het deel I B, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.3
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan, een
      vrijwaringsbewijs, een tenaamstellingsverslag en een kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.4
    text: |-
      Degene die het vrijwaringsbewijs en de heeft ontvangen, is verplicht dit terstond, tezamen met het oude deel I B,
      te doen toekomen aan degene die het deel IA, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.5
    text: |-
      Degene die het deel I A, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan degene van wie hij het vrijwaringsbewijs en het oude deel I B heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
  - number: 58l.6
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van
      een voertuig, aan wie een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven, met de houder,
      respectievelijk de eigenaar van het voertuig overeenkomt dat het kenteken aan deze houder, respectievelijk eigenaar
      wordt opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58m.1
    text: |-
      In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig waarvoor
      een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven, zijn in afwijking van
      [artikel 58l het tweede tot en met achtste lid][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58l
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58l
        hoofdstuk: 9b
  - number: 58m.2
    text: |-
      Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.2.a
    text: |-
      aan het erkende bedrijf bedrijfsvoorraad terstond het deel I B van het kentekenbewijs en het overschrijvingsbewijs
      over te dragen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.2.b
    text: |-
      het deel IA van het kentekenbewijs onder zich te houden totdat hij het in het vijfde lid bedoelde vrijwaringsbewijs
      en het oude deel I B heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.3
    text: |-
      Het erkende bedrijf bedrijfsvoorraad is verplicht binnen een week, nadat hij het deel I B en het
      overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om opname in bedrijfsvoorraad te verzoeken onder
      overlegging van deel II, het overschrijvingsbewijs en de bedrijfsvoorraadpas.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.4
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan een
      tenaamstellingsverslag en, op verzoek, een kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.5
    text: |-
      Bij ministeriële regeling kan worden bepaald dat tot het moment van uitreiking van de kentekencard aan het erkende
      bedrijf bedrijfsvoorraad de kentekencard voor de overdracht van een voertuig op bij ministeriële regeling te
      bepalen wijze en onder bij die regeling te bepalen voorwaarden kan worden vervangen door een tijdelijk document.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.6
    text: 'Het erkende bedrijf bedrijfsvoorraad is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.6.a
    text: een vrijwaringsbewijs met de in het vierde lid bedoelde gegevens aan te maken, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.6.b
    text: |-
      aan degene van wie hij het deel I B en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs, het
      tenaamstellingsverslag, alsmede het oude deel I B terstond ter hand te stellen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.7
    text: |-
      Degene die het deel I A, bedoeld in het tweede lid, onderdeel b, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan het erkende bedrijf bedrijfsvoorraad van wie hij het vrijwaringsbewijs en het oude deel I
      B heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.8
    text: |-
      Het tweede en het zesde lid zijn niet van toepassing indien een of meer delen van het kentekenbewijs verloren
      zijn geraakt of teniet zijn gegaan en het erkende bedrijf bedrijfsvoorraad bij de in het achtste lid, onderdeel
      a, bedoelde melding tevens meldt dat het voertuig voorgoed buiten gebruik wordt gesteld, mits degene aan wie het
      kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58m.8.a
    text: aan het erkende bedrijf terstond de niet verloren geraakte of tenietgegane delen van het kentekenbewijs overdraagt,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.8.b
    text: |-
      verklaart dat de niet aan het erkende bedrijf overgedragen delen van het kentekenbewijs verloren zijn geraakt of
      teniet zijn gegaan, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58m.8.c
    text: bij het erkende bedrijf de bij ministeriële regeling aangewezen documenten overlegt.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58m
  - number: 58n.1
    text: |-
      Indien een voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven, ophoudt te behoren
      tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad, is [artikel 58l][ref2] of, in geval van overdracht
      ten behoeve van een bedrijfsvoorraad, [artikel 58m][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58l
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58m
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58n
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58l
        hoofdstuk: 9b
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58m
        hoofdstuk: 9b
  - number: 58n.2
    text: |-
      Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad en dit
      bedrijf het voertuig tot eigen gebruik bestemt, verzoekt het bedrijf terstond om tenaamstelling bij de Dienst
      Wegverkeer, onder overlegging van het bedrijfsvoorraad deel I B, het overschrijvingsbewijs en een bij ministeriële
      regeling aangewezen legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58n
  - number: 58n.3
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan een
      vrijwaringsbewijs en een kentekencard af en verstrekt een tenaamstellingcode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58n
  - number: 58o.1
    text: |-
      In geval van overdracht van een voertuig dat ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf
      bedrijfsvoorraad dat gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d][ref1], kan,
      in afwijking van [artikel 58n][ref2], een aanvraag om tenaamstelling, gericht aan de Dienst Wegverkeer, bij dat
      bedrijf worden ingediend. In afwijking van artikel 58n is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58n
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58n
        hoofdstuk: 9b
  - number: 58o.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijk persoon overlegt deze in persoon aan het erkende bedrijf
      bedrijfsvoorraad een bij ministeriële regeling aangewezen legitimatiebewijs, alsmede een verklaring waaruit
      duidelijk het verzoek tot tenaamstelling blijkt en het kenteken van het voertuig dat wordt overgedragen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3
    text: |-
      Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in het
      handelsregister, machtigt deze het erkende bedrijf bedrijfsvoorraad de aanvraag bij de Dienst Wegverkeer in te
      dienen. Degene die blijkens het handelsregister bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het
      erkende bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.a
    text: een kopie van een bij ministeriële regeling aangewezen legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.b
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.b.1°
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.b.2°
    text: |-
      een opgave van zijn unieke nummer, bedoeld in [artikel 9, onder a, van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '9'
  - number: 58o.3.b.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.b.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.3.b.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58o.4
    text: |-
      Het erkende bedrijf bedrijfsvoorraad meldt de bij ministeriële regeling, als bedoeld in
      [artikel 62, vierde lid, van de wet][ref1], voorgeschreven gegevens vermeld op het overschrijvingsbewijs, op het
      bedrijfsvoorraad deel I B en indien van toepassing het burgerservicenummer dan wel het rijbewijsnummer. In geval
      van een aanvraag als bedoeld in het tweede lid meldt het bedrijf ook de geboortedatum van de aanvrager. In geval
      van een aanvraag als bedoeld in het derde lid meldt het bedrijf ook de vestigingsdatum en de gegevens, vermeld in
      de machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 58o.5
    text: |-
      De Dienst Wegverkeer geeft, indien aan de verplichtingen in het tweede tot en met vierde lid is voldaan
      aan de aanvrager een kentekencard, een tenaamstellingsverslag en een vrijwaringsbewijs af en verstrekt een
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58o
  - number: 58p.1
    text: |-
      In afwijking van de [artikelen 58l, tweede lid][ref1], en [58m, derde lid][ref2], is, in geval van overlijden
      van degene aan wie een kentekenbewijs als bedoeld in [artikel 58j][ref3] is afgegeven, degene die als erfgenaam
      eigenaar of houder van het voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is
      geworden bij de Dienst Wegverkeer een verzoek in te dienen om het voertuig op zijn naam te registreren onder
      overlegging van het deel I B of het bedrijfsvoorraad deel I B, het overschrijvingsbewijs en een bij ministeriële
      regeling aangewezen legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58l
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58m
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58p
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58l
        hoofdstuk: 9b
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58m
        hoofdstuk: 9b
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58p.2
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het eerste lid heeft voldaan zowel een
      kentekencard, een tenaamstellingsverslag als een vrijwaringsbewijs af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58p
  - number: 58q.1
    text: |-
      De Dienst Wegverkeer kan een voertuig tenaamstellen zonder dat aan de in de [artikelen 58l tot en met 58p][ref1]
      bedoelde verplichtingen is voldaan, indien de aanvraag hiertoe wordt ingediend door een natuurlijk persoon of een
      rechtspersoon die verklaart eigenaar of houder van het voertuig te zijn en indien naar het oordeel van de Dienst
      Wegverkeer aannemelijk is gemaakt dat niet aan bedoelde verplichtingen kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58l
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58q
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58l
        hoofdstuk: 9b
  - number: 58q.2
    text: |-
      De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van de
      tenaamstelling het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs overlegt en een of
      meer delen van het kentekenbewijs inlevert.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58q
  - number: 58r.1
    text: |-
      Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden, is, in geval van overdracht van een voertuig aan een in het buitenland woonachtige
      natuurlijk persoon of een in het buitenland gevestigde rechtspersoon, verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.1.a
    text: het deel I B en het deel II terstond over te dragen aan degene die eigenaar of houder van het voertuig is geworden;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.1.b
    text: het deel I A van het kentekenbewijs onder zich te houden,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.2
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel I B
      en het deel II heeft ontvangen bij de Dienst Wegverkeer het deel I B en het deel II, een bij ministeriële regeling
      aangewezen legitimatiebewijs over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.3
    text: |-
      De Dienst Wegverkeer plaatst op het deel I B een aantekening en geeft het deel I B en het legitimatiebewijs terug
      aan degene die aan de in het tweede lid bedoelde verplichtingen heeft voldaan tezamen met een vrijwaringsbewijs en
      een deel II.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.4
    text: |-
      Degene die het in het derde lid bedoelde vrijwaringsbewijs heeft ontvangen is verplicht dit terstond af te geven
      aan degene die het deel I A onder zich heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.5
    text: |-
      Degene die het deel IA onder zich heeft gehouden is verplicht dit terstond af te geven aan degene van wie hij het
      in het vierde lid bedoelde vrijwaringsbewijs heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
  - number: 58r.6
    text: |-
      In geval van overdracht van een tot de bedrijfsvoorraad van een erkend bedrijf bedrijfsvoorraad behorend voertuig
      waarvoor een tweedelig kentekenbewijs is afgegeven aan een in het buitenland woonachtige natuurlijk persoon of
      een in het buitenland gevestigde rechtspersoon, zonder dat het erkende bedrijf gebruik maakt van de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel b][ref1], is het eerste tot en met vijfde lid van overeenkomstige
      toepassing, met dien verstande dat het bedrijfsvoorraad deel I B in de plaats treedt van het deel I B.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 58s.1
    text: |-
      Indien het voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven niet meer
      overeenstemt met de gegevens op het deel I, is degene aan wie het kentekenbewijs is afgegeven of degene die na
      diens overlijden eigenaar of houder van het voertuig is geworden, verplicht onverwijld bij de Dienst Wegverkeer de
      gewijzigde gegevens te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58s
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58s.2
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de in het eerste lid bedoelde verplichting heeft voldaan een
      kentekencard af en verstrekt een tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58s
  - number: 58s.3
    text: |-
      De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in [artikel 98 van de wet][ref1]
      een nieuwe kentekencard af en verstrekt een tenaamstellingscode nadat de wijziging is goedgekeurd ingevolge artikel
      98 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel98
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58s
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '98'
  - number: 58t.1
    text: |-
      De aanvraag van een vervangende kentekencard geschiedt bij de Dienst Wegverkeer door degene aan wie het tweedelig
      kentekenbewijs, waarvoor een vervangend document wordt aangevraagd, is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58t
  - number: 58t.2
    text: |-
      De Dienst Wegverkeer kan verlangen dat bij de aanvraag van een vervangende kentekencard het kentekenbewijs
      als bedoeld in [artikel 58j][ref1] wordt ingeleverd alsmede dat een bij ministeriële regeling aangewezen
      legitimatiebewijs wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58t
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58t.3
    text: |-
      Indien een kentekenbewijs als bedoeld in [artikel 58j][ref1] is afgegeven aan de houder van een voertuig en deze
      een vervangende kentekencard aanvraagt, kan de Dienst Wegverkeer in door deze dienst te bepalen gevallen verlangen
      dat de eigenaar voor de afgifte van de vervangende kentekencard, toestemming verleent. In deze gevallen kan de
      Dienst Wegverkeer bepalen dat de vervangende kentekencard naar de eigenaar of een door deze aangewezen persoon
      wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58t
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58u.1
    text: |-
      Tot het vorderen tot overgifte van een kentekenbewijs als bedoeld in [artikel 58j][ref1] zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58u.1.a
    text: |-
      de Directie van de Dienst Wegverkeer en de door de Directie daartoe aangewezen tot die dienst behorende ambtenaren,
      indien naar hun oordeel [artikel 60, eerste lid, onderdelen b of c, of tweede lid, van de wet][ref1], van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 58u.1.b
    text: |-
      de door Onze Minister in overeenstemming met Onze Minister van Financiën aangewezen ambtenaren der
      Rijksbelastingdienst, indien naar hun oordeel [artikel 60, eerste lid, onderdeel a, van de wet][ref1], van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 58u.1.c
    text: |-
      de ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1], indien naar hun oordeel
      [artikel 60, eerste lid, onderdeel a, b of c][ref2], dan wel artikel 60, tweede lid, van de wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 58u.2
    text: |-
      De verplichting tot overgifte, bedoeld in [artikel 60, eerste lid, van de wet][ref1], heeft betrekking op deel IA
      en op deel IB van het kentekenbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
  - number: 58u.3
    text: |-
      De in het eerste lid bedoelde ambtenaren geven de ter inzage overgegeven delen van het kentekenbewijs, na inzage
      terug aan degene van wie het is ingevorderd.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
  - number: 58u.4
    text: |-
      Indien dit bij de vordering van de houder van een kentekenbewijs wordt geëist, is deze verplicht tot het op een
      daarbij te bepalen tijd en plaats ter beschikking houden van het voertuig, waarvoor het bewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
  - number: 58u.5
    text: |-
      Indien de vordering betrekking heeft op een kentekenbewijs dat is afgegeven voor een aanhangwagen die
      overeenkomstig [artikel 3.2][ref1] of [3.7 van de Regeling voertuigen][ref2] is voorzien van een constructieplaat,
      kan aan de vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '3'
  - number: 58v.1
    text: |-
      De aanvraag bij de Dienst Wegverkeer tot een schorsing als bedoeld in [artikel 67 van de wet][ref1] van een
      tenaamstelling van een voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58j][ref2] is afgegeven vindt
      plaats op één van de volgende wijzen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58v
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58v.1.a
    text: |-
      door het deel I B van het kentekenbewijs, het deel II alsmede een bij ministeriële regeling aangewezen
      legitimatiebewijs over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58v
  - number: 58v.1.b
    text: langs elektronische weg door gebruikmaking van een door de Dienst Wegverkeer vastgesteld authenticatiemiddel.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58v
  - number: 58v.2
    text: |-
      De Dienst Wegverkeer geeft aan de aanvrager een kentekencard en een schorsingsverslag af en verstrekt een
      tenaamstellingscode.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58v
  - number: 58w.1
    text: |-
      Een aanvraag tot opheffing van een schorsing ingevolge [artikel 69 van de wet][ref1] van een voertuig waarvoor een
      kentekenbewijs als bedoeld in [artikel 58j][ref2] is afgegeven, vindt plaats op één van de volgende wijzen:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58j
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 58j
        hoofdstuk: 9b
  - number: 58w.1.a
    text: |-
      door het deel I B van het kentekenbewijs, het deel II alsmede een bij ministeriële regeling aangewezen
      legitimatiebewijs over te leggen;
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58w
  - number: 58w.1.b
    text: langs elektronische weg door gebruikmaking van een door de Dienst Wegverkeer vastgesteld authenticatiemiddel.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58w
  - number: 58w.2
    text: |-
      De Dienst Wegverkeer verstrekt in het geval van een aanvraag als bedoeld in het eerste lid, onderdeel a, een nieuwe
      tenaamstellingscode,
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel58w
  - number: '59'
    text: |-
      Het [Reglement kentekenregistratie][ref1] wordt ingetrokken met ingang van een bij koninklijk besluit te bepalen
      tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002938
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002938
  - number: '60'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel60
  - number: '61'
    text: 'Dit besluit kan worden aangehaald als: Kentekenreglement.'
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel61
