  - number: 1a
    text: |-
      Als categorieën bromfietsen, bedoeld in [artikel 37, eerste lid, onderdeel a, onder 1°, van de wet][ref1]
      waarop [artikel 36 van de wet][ref2] niet van toepassing is, worden, voor zover deze voertuigen voldoen aan de
      begripsomschrijving van bromfiets in [artikel 1, eerste lid, onder e, van de wet][ref3], vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel1a
    references:
