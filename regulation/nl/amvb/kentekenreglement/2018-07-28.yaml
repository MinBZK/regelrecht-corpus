        artikel: '36'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 1a.a
    text: |-
      bromfietsen als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#Artikel1a
    references:
