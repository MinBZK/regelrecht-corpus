  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 juni 1993, nr. RV 151906, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 18 oktober 1993, nr. W09.93.0363);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 30 september 1994, nr. R 183051;
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006951/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop rustende bepalingen wordt verstaan onder: - *bedrijfsvoorraad:* te verhandelen, bewaren
      of bewerken voertuigen waarvan een erkend bedrijf bedrijfsvoorraad de eigendom heeft verkregen;
        - *bedrijfsvoorraad deel I B:* deel I B van een kentekenbewijs van een bij ministeriële regeling vastgesteld model,
      afgegeven door een erkend bedrijf bedrijfsvoorraad, ten behoeve van voertuigen die in de bedrijfsvoorraad zijn
      opgenomen;
        - *bedrijfsvoorraadpas:* pas als bedoeld in [artikel 48, eerste lid][ref1];
        - *bijzonder kenteken:* kenteken als bedoeld in [artikel 38 van de wet][ref2];
        - *erkend bedrijf bedrijfsvoorraad:* natuurlijk persoon of rechtspersoon aan wie een erkenning overeenkomstig
      [artikel 62 van de wet][ref3] is verleend;
        - *erkend bedrijf exportdienstverlening:* natuurlijk persoon of rechtspersoon aan wie een erkenning overeenkomstig
      [artikel 66a van de wet][ref4] is verleend;
        - *erkend bedrijf tenaamstelling:* natuurlijk persoon of rechtspersoon aan wie een erkenning overeenkomstig
      [artikel 61a van de wet][ref5] is verleend;
        - *handelaarskenteken:* kenteken als bedoeld in [artikel 3][ref6];
        - *kentekenbewijs deel II:* deel II van een tweedelig kentekenbewijs;
        - *kentekencard:* deel I van een tweedelig kentekenbewijs afgegeven na 31 december 2013;
        - *schorsingsverslag:* uittreksel uit het kentekenregister waaruit blijkt dat een voertuig is geschorst;
        - *tenaamstellingsverslag:* uittreksel uit het kentekenregister waaruit blijkt dat een voertuig is tenaamgesteld;
        - *voertuig:* motorrijtuig of aanhangwagen als bedoeld in
      [artikel 1, eerste lid, onderdelen c en d, van de wet][ref7];
        - *vrijwaringsbewijs:* bewijs van beëindiging van tenaamstelling in het kentekenregister;
        - *wet:* [Wegenverkeerswet 1994](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel48
