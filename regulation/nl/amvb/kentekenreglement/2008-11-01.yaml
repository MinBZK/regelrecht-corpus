  - number: '16'
    text: |-
      Op verzoek van betrokkene wordt in het kentekenregister geregistreerd dat hij zijn toestemming onthoudt
      aan de verstrekking van op hem betrekking hebbende gevoelige gegevens aan belanghebbenden als bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref1].


