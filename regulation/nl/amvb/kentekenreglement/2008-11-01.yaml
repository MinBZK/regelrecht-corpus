  - number: 58d
    text: |-
      1 Indien een voertuig waarvoor een kentekenbewijs als bedoeld in artikel 58a is afgegeven, ophoudt te behoren
      tot de bedrijfsvoorraad van een erkend bedrijf, is artikel 58b of, in geval van overdracht ten behoeve van een
      bedrijfsvoorraad, artikel 58c van overeenkomstige toepassing, met dien verstande dat het bedrijfsvoorraad deel II
      of I B in de plaats treedt van het gewone deel II of I B.

      2 Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf en dit bedrijf het voertuig
      tot eigen gebruik bestemt, vraagt het bedrijf binnen een week een nieuw deel I B aan bij de Dienst Wegverkeer,
      onder overlegging van het bedrijfsvoorraad deel II of I B, het overschrijvingsbewijs en een bij ministeriële
      regeling aangewezen legitimatiebewijs.

      3 De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan, zowel een
      vrijwaringsbewijs als een nieuw deel I B af.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58d
  - number: 58e
    text: |-
      1 In geval van overdracht van een voertuig dat ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf
      dat gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel f][ref1], kan, in afwijking van
      [artikel 58d][ref2], een aanvraag van een nieuw deel I B, gericht aan de Dienst Wegverkeer, bij dat bedrijf worden
      ingediend. In afwijking van [artikel 58d][ref3] is dit artikel van toepassing.

      2 Indien de aanvraag wordt gedaan door een natuurlijke persoon overlegt deze in persoon aan het erkende bedrijf
      een rijbewijs, alsmede een verklaring waaruit duidelijk het verzoek tot tenaamstelling blijkt en het kenteken
      van het voertuig dat wordt overgedragen, en welke overigens voldoet aan bij ministeriële regeling als bedoeld in
      [artikel 50, vijfde lid, van de wet][ref4], gestelde voorschriften.

      3 Indien de aanvraag wordt ingediend door een in Nederland gevestigde rechtspersoon, die dient te zijn ingeschreven
      in een daartoe bij de wet aangewezen register, machtigt deze het erkende bedrijf de aanvraag bij de Dienst
      Wegverkeer in te dienen. Degene die blijkens het register bevoegd is de rechtspersoon te vertegenwoordigen
      verstrekt aan het erkende bedrijf:

      a. een kopie van zijn rijbewijs;

      b. een gewaarmerkt uittreksel uit het in de aanhef bedoelde register;

      c. een ondertekende machtiging welke vermeldt:

      1°. naam en adres van de aanvrager,

      2°. het inschrijfnummer van het Handelsregister als bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref5],

      3°. naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt,

      4°. naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en

      5°. het kenteken van het voertuig waarop de aanvraag betrekking heeft.

      4 Het erkende bedrijf meldt de bij ministeriële regeling als bedoeld in [artikel 62, vierde lid, van de wet][ref6],
      voorgeschreven gegevens vermeld op het overschrijvingsbewijs, op het uittreksel, bedoeld in het derde lid,
      onderdeel b, op het bedrijfsvoorraad deel II of I B, het rijbewijsnummer. In geval van een aanvraag als bedoeld in
      het tweede lid meldt het bedrijf ook de geboortedatum van de aanvrager. In geval van een aanvraag als bedoeld in
      het derde lid meldt het bedrijf ook de vestigingsdatum en de gegevens, vermeld in de machtiging.

      5 De Dienst Wegverkeer geeft, indien aan de verplichtingen in het tweede tot en met vierde lid is voldaan, een
      nieuw deel I B en een vrijwaringsbewijs af en verstrekt dit aan het erkende bedrijf. Het erkende bedrijf stelt het
      nieuwe deel I B te zamen met het deel I en het overschrijvingsbewijs terstond in handen van de aanvrager, of doet
      deze, in geval van een aanvraag als bedoeld in het derde lid, zo spoedig mogelijk aan de aanvrager toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
