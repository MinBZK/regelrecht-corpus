  - number: '42'
    text: |-
      1 Een handelaarsketekenbewijs kan worden aangevraagd door en worden afgegeven aan:

      a. een erkend bedrijf, dan wel

      b. een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen, waar voertuigen
      bedrijfsmatig voor derden worden hersteld of bewerkt.

      2 De aanvraag wordt ingediend bij de Dienst Wegverkeer.

      3 De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel42
  - number: '43'
    text: |-
      Onverminderd [artikel 42][ref1] wordt de afgifte van handelaarskentekenbewijzen geweigerd indien een of meer aan de
      aanvrager afgegeven handelaarskentekenbewijzen op grond van [artikel 45, eerste lid, onderdeel d][ref2], ongeldig
      zijn verklaard binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel43
