  - number: '33'
    text: |-
      1 Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is, ingeval hij het voertuig voorgoed buiten Nederland brengt, verplicht het deel I B,
      een bij ministeriële regeling aangewezen legitimatiebewijs, een ingevulde en ondertekende verklaring in drievoud
      van een bij ministeriële regeling vastgesteld model alsmede, voor zover bij ministeriële regeling bepaald, het deel
      II bij de Dienst Wegverkeer over te leggen.

      2 De Dienst Wegverkeer plaatst op het deel I B en op het deel II een aantekening, vult de verklaring in en geeft
      het deel I B, de verklaring in tweevoud, het legitimatiebewijs alsmede het deel II terug aan degene die aan de in
      het eerste lid bedoelde verplichtingen heeft voldaan.

      3 Ingeval een erkend bedrijf een tot zijn bedrijfsvoorraad behorend voertuig voorgoed buiten Nederland brengt, is
      het eerste en tweede lid van overeenkomstige toepassing, met dien verstande dat het bedrijfsvoorraad deel I B in de
      plaats treedt van het deel I B.

      4 In afwijking van het eerste tot en met derde lid, is, ingeval het erkende bedrijf gebruik maakt
      van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel c][ref1], het erkende bedrijf
      verplicht het voorgoed buiten Nederland brengen van het voertuig te melden overeenkomstig het krachtens
      [artikel 62, derde lid, van de wet][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
