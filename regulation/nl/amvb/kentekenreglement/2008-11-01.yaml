  - number: '38'
    text: |-
      1 De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren voor het rijden op de weg indien naar het oordeel
      van deze dienst:

      a. het voertuig waarvoor het kentekenbewijs is afgegeven niet ter beschikking wordt gesteld ten behoeve van de in
      [artikel 45a, tweede lid, van de wet][ref1] bedoelde inspectie;

      b. niet wordt voldaan aan de krachtens [artikel 52, tweede lid, van de wet][ref2] in het kentekenbewijs vermelde
      voorschriften, of

      c. het voertuig waarvoor het kentekenbewijs is afgegeven niet voldoet aan een of meer van de in
      [artikel 58, tweede lid, onderdelen b, c, of d, van de wet][ref3] bedoelde eisen.

      2 Ingeval het deel I A van een voor het rijden over de weg ongeldig verklaard kentekenbewijs op grond van het
      bepaalde krachtens [artikel 57, derde lid, van de wet][ref4] is ingeleverd, doet de Dienst Wegverkeer na ontvangst
      van dat deel I A een ontvangstbewijs toekomen aan degene aan wie het kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel45a
