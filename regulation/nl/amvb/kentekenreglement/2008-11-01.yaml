      1 De tenaamstelling in het register vervalt zodra:

      a. krachtens [artikel 26, derde lid][ref1], een vrijwaringsbewijs en een nieuw deel I B zijn afgegeven;

      b. krachtens [artikel 27, vierde lid][ref2], een formulier is afgegeven;

      c. de gegevens als bedoeld in [artikel 27, achtste lid, onderdeel b][ref3], aan het erkende bedrijf ter beschikking
      zijn gesteld;

      d. krachtens [artikel 28, derde lid][ref4], of [artikel 28a, vijfde lid][ref5], een vrijwaringsbewijs en een nieuw
      deel I B zijn afgegeven;

      e. krachtens [artikel 29, tweede lid][ref6], een vrijwaringsbewijs en een nieuw deel I B zijn afgegeven;

      f. krachtens [artikel 30][ref7] een kentekenbewijs is afgegeven;

      g. krachtens de [artikelen 31, derde lid][ref8], [32, derde lid, onderdeel c][ref9], of
      [33, tweede en vierde lid][ref10], op het kentekenbewijs een aantekening is geplaatst;

      h. de Dienst Wegverkeer het kentekenbewijs ongeldig heeft verklaard ingevolge
      [artikel 37, eerste, tweede of derde lid][ref11];

      i. de Dienst Wegverkeer het handelaarskentekenbewijs ongeldig heeft verklaard ingevolge
      [artikel 45, eerste lid][ref12];

      j. een erkend bedrijf een melding als bedoeld in [artikel 46, tweede lid, onderdeel c of d][ref13], heeft gedaan;

      k. de Dienst Wegverkeer een certificaat van vernietiging, als bedoeld in artikel 5, derde lid, van [richtlijn
      nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
      betreffende autowrakken (PbEG L 269), heeft ontvangen dat door een daartoe bevoegde verwerker, zoals bedoeld in
      deze richtlijn, in een andere lidstaat van de Europese Gemeenschappen is afgegeven;

      l. de Dienst Wegverkeer de tenaamstelling vervallen heeft verklaard op grond van een verzoek als bedoeld in het
      tweede lid.

      2 Degene die naar zijn mening ten onrechte als tenaamgestelde in het register is vermeld, kan de Dienst Wegverkeer
      verzoeken de tenaamstelling te doen vervallen. De Dienst Wegverkeer gaat over tot het doen vervallen van de
      tenaamstelling indien hiervoor naar het oordeel van deze dienst voldoende gronden aanwezig zijn.


