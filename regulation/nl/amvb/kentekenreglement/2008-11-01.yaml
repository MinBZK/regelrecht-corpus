      1 Als deel van een kentekenbewijs waarvan het tarief mede een bij ministeriële regeling vastgesteld bedrag ter
      dekking van de in [artikel 4q, tweede lid, van de wet][ref1], bedoelde kosten omvat, worden aangewezen de delen IA
      en IB van het kentekenbewijs.

      2 Bij ministeriële regeling kunnen kentekenbewijzen worden aangewezen waarvoor het eerste lid niet geldt.

      3 Het in het eerste lid bedoelde tarief dient tevens ter dekking van de kosten van verstrekkingen waarbij inning
      van het tarief meer kost dan het te innen tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
