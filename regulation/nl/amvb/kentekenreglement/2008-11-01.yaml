  - number: '37'
    text: |-
      1 De Dienst Wegverkeer verklaart een kentekenbewijs ongeldig indien deze dienst van oordeel is, dat de
      omstandigheden, bedoeld in [artikel 58, eerste lid, onderdeel a of b , van de wet][ref1], zich voordoen.

      2 De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren indien voor het voertuig, waarvoor dat bewijs is
      afgegeven, een nieuw kenteken is opgegeven.

      3 De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren indien naar het oordeel van deze dienst blijkt
      dat:

      a. het voertuig, waarvoor dat bewijs is afgegeven, voorgoed buiten gebruik is gesteld,

      b. het voertuig, waarvoor dat bewijs is afgegeven, voorgoed buiten Nederland is gebracht,

      c. het voertuig, waarvoor dat bewijs is afgegeven, definitief is bestemd voor gebruik buiten de weg,

      d. degene aan wie dat bewijs is afgegeven, opgehouden is eigenaar, bezitter of houder van het voertuig te zijn,

      e. de reden waarom het kentekenbewijs bevattende de lettergroep BN, CD, CDJ, GN, GV of ZZ is afgegeven, is
      vervallen,

      f. de eigenaar of houder van het voertuig onvrijwillig het bezit of het houderschap van het voertuig heeft
      verloren,

      g. het voertuig is gaan behoren tot een der ingevolge [artikel 37 van de wet][ref2] van de kentekenplicht
      uitgezonderde categorieën van voertuigen,

      h. sprake is van de situatie als bedoeld in [artikel 40, eerste lid, onderdeel k][ref3], dan wel,

      i. degene aan wie dat bewijs is afgegeven, niet langer in Nederland woonachtig of gevestigd is.

      4 In het geval, bedoeld in het derde lid, onderdeel *a*, verklaart de Dienst Wegverkeer het kentekenbewijs
      ongeldig, mits het voorgoed buiten gebruik stellen van het voertuig overeenkomstig het bepaalde krachtens
      [artikel 62, derde lid, van de wet][ref4] wordt gemeld door een erkend bedrijf dat gebruik maakt van de
      bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d][ref5].

      5 In afwijking van het vierde lid verklaart de Dienst Wegverkeer een kentekenbewijs ongeldig
      indien de melding geschiedt door een ander dan een erkend bedrijf dat de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel d][ref6], heeft verkregen, mits de melding betrekking heeft op een voertuig
      dat behoort tot een bij ministeriële regeling aangewezen categorie van voertuigen en wordt voldaan aan nadere bij
      ministeriële regeling vastgestelde voorwaarden.

      6 In het geval, bedoeld in het derde lid, onderdeel *c*, verklaart de Dienst Wegverkeer het kentekenbewijs ongeldig
      mits ten aanzien van de bestemming van het voertuig wordt voldaan aan nadere bij ministeriële regeling vastgestelde
      voorwaarden.

      7 In het geval, bedoeld in het derde lid, onderdeel *f*, verklaart de Dienst Wegverkeer het kentekenbewijs
      ongeldig mits van het verlies van het bezit of het houderschap van het voertuig aangifte is gedaan bij een der in
      [artikel 141][ref7] of [142 van het Wetboek van Strafvordering][ref8] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel40
