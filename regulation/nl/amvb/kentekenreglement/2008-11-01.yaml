  - number: '13'
    text: |-
      1 Aan rechtspersonen kunnen gevoelige gegevens worden verstrekt met betrekking tot de motorrijtuigen
      en aanhangwagens ten aanzien waarvan de desbetreffende rechtspersoon als eigenaar dan wel houder in het
      kentekenregister staat geregistreerd.

      2 In aanvulling op het eerste lid kunnen aan degene die in het kentekenregister staat geregistreerd als eigenaar
      van een voertuig waarvan het kentekenbewijs is afgegeven aan een houder, gevoelige gegevens als bedoeld in
      [artikel 7, tweede lid, onderdelen b en c][ref1], die betrekking hebben op de houder of diens voertuig worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel7
