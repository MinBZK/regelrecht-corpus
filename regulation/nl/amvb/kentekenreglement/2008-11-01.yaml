  - number: '58'
    text: |-
      Voor de toepassing van dit besluit wordt een op basis van het [Reglement kentekenregistratie][ref1] afgegeven kopie
      deel III gelijkgesteld met een overschrijvingsbewijs tot het tijdstip dat het kopie deel III is vervangen door een
      zodanig bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002938
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002938
  - number: 58a
    text: |-
      In afwijking van de [artikelen 26 tot en met 30][ref1] en [34][ref2] zijn op driedelige kentekenbewijzen
      alsmede op kentekenbewijzen die bestaan uit een deel I dat is afgegeven voor 31 mei 2004, een deel I B en een
      overschrijvingsbewijs, de [artikelen 58b tot en met 58h][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '34'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: 58b
        hoofdstuk: 9A
  - number: 58b
    text: |-
      1 Degene aan wie een kentekenbewijs als bedoeld in artikel 58a is afgegeven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van het
      voertuig waarvoor dat kentekenbewijs is afgegeven, verplicht:

      a. het deel II of het deel I B en het overschrijvingsbewijs terstond over te dragen aan degene die eigenaar of
      houder van het voertuig is geworden;

      b. het deel I van het kentekenbewijs onder zich te houden, totdat hij het in het derde lid bedoelde
      vrijwaringsbewijs en het oude deel II of I B heeft ontvangen.

      2 Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel II of
      I B en het overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om afgifte van een deel I B of een nieuw
      deel I B te verzoeken onder overlegging van het deel II of I B, het overschrijvingsbewijs en een bij ministeriële
      regeling aangewezen legitimatiebewijs.

      3 De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan, een
      vrijwaringsbewijs en een deel I B of nieuw deel I B af.

      4 Degene die het vrijwaringsbewijs heeft ontvangen, is verplicht dit terstond, te zamen met het oude deel II of I
      B, te doen toekomen aan degene die het deel I, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden.

      5 Degene die het deel I, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan degene van wie hij het vrijwaringsbewijs en het oude deel II of I B heeft verkregen.

      6 De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van een
      voertuig, aan wie een kentekenbewijs als bedoeld in artikel 58a is afgegeven, met de houder, respectievelijk de
      eigenaar van het voertuig overeenkomt dat het kenteken aan deze houder, respectievelijk eigenaar wordt opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58b
  - number: 58c
    text: |-
      1 In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig waarvoor een kentekenbewijs als
      bedoeld in [artikel 58a][ref1] is afgegeven, zijn in afwijking van [artikel 58b][ref2], het tweede tot en met
      achtste lid van toepassing.

      2 Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is verplicht:

      a. aan het erkende bedrijf terstond het deel II of I B van het kentekenbewijs en het overschrijvingsbewijs over
      te dragen;

      b. het deel I van het kentekenbewijs onder zich te houden totdat hij het in het vijfde lid bedoelde
      vrijwaringsbewijs en het oude deel II of I B heeft ontvangen.

      3 Het erkende bedrijf is verplicht binnen een week, nadat hij het deel II of I B en het overschrijvingsbewijs heeft
      ontvangen, bij de Dienst Wegverkeer om opname in bedrijfsvoorraad te verzoeken onder overlegging van deel II of I
      B, het overschrijvingsbewijs en de bedrijfsvoorraadpas.

      4 De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan, een formulier af
      met gegevens die verband houden met de opname in bedrijfsvoorraad.

      5 Het erkende bedrijf is verplicht:

      a. een vrijwaringsbewijs en een bedrijfsvoorraad deel I B met de in het vierde lid bedoelde gegevens in te vullen;

      b. aan degene van wie hij het deel II of I B en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs
      alsmede het oude deel II of I B terstond ter hand te stellen;

      c. het bedrijfsvoorraad deel I B onder zich te houden.

      6 Degene die het deel I, bedoeld in het tweede lid, onderdeel b, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan het erkende bedrijf van wie hij het vrijwaringsbewijs en het oude deel II of I B heeft
      verkregen.

      7 In afwijking van het derde en vijfde lid, is een erkend bedrijf, indien dit gebruik maakt van de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel a][ref3], verplicht:

      a. de overdracht van het voertuig ten behoeve van diens bedrijfsvoorraad terstond na de overdracht te melden aan de
      Dienst Wegverkeer;

      b. het vrijwaringsbewijs en het bedrijfsvoorraad deel I B met de middels datacommunicatie ter beschikking gestelde
      gegevens die verband houden met de opname in bedrijfsvoorraad in te vullen;

      c. aan degene van wie hij het deel II of I B en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs en
      het oude deel II of I B terstond ter hand te stellen;

      d. het bedrijfsvoorraad deel I B onder zich te houden.

      8 Het tweede en het zesde lid zijn niet van toepassing indien een of meer delen van het kentekenbewijs verloren
      zijn geraakt of teniet zijn gegaan en het erkende bedrijf bij de in het achtste lid, onderdeel a, bedoelde melding
      tevens meldt dat het voertuig voorgoed buiten gebruik wordt gesteld, mits degene aan wie het kentekenbewijs als
      bedoeld in [artikel 58a][ref4] is afgegeven of degene die na diens overlijden eigenaar of houder van het voertuig
      is geworden:

      a. aan het erkende bedrijf terstond de niet verloren geraakte of teniet gegane delen van het kentekenbewijs
      overdraagt,

      b. verklaart dat de niet aan het erkende bedrijf overgedragen delen van het kentekenbewijs verloren zijn geraakt of
      teniet zijn gegaan, en

      c. bij het erkende bedrijf de bij ministeriële regeling aangewezen documenten overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
