  - number: 19a
    text: |-
      1 De afgifte van een kentekenbewijs wordt geweigerd indien uit het kentekenregister blijkt dat de aanvrager ten
      aanzien van een of meer voertuigen waarvan het kenteken aan hem is dan wel was opgegeven, niet voldoet aan:

      a. de verplichting tot het betalen van motorrijtuigenbelasting als bedoeld in de
      [Wet op de motorrijtuigenbelasting 1994][ref1], of

      b. de verplichtingen inzake opgelegde administratieve sancties als bedoeld in de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2].

      2 De in het eerste lid bedoelde weigering vindt slechts plaats indien onherroepelijk vaststaat dat de aanvrager
      tenminste vijf maal niet aan een of meer van de in dat lid bedoelde verplichtingen heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel19a
