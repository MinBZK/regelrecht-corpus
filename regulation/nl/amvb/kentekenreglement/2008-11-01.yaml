  - number: '23'
    text: |-
      1 Gedurende de tijd dat de geldigheid van het kentekenbewijs is geschorst ingevolge [artikel 67 van de wet][ref1],
      mag:

      a. op de dag waarop het voertuig waarvoor dat kentekenbewijs is afgegeven, naar aanleiding van de aanvraag van
      een keuringsrapport als bedoeld in [artikel 75 van de wet][ref2] dan wel naar aanleiding van een aanvraag van
      een keuring als bedoeld in [artikel 99][ref3] of [artikel 106 van de wet][ref4] aan een zodanige keuring wordt
      onderworpen, met dat voertuig via de kortste route naar en van de plaats van keuring worden gereden;

      b. met een voertuig van 15 jaar of ouder waarvoor dat kentekenbewijs is afgegeven, op de weg worden gereden indien
      er naar het oordeel van Onze Minister van Financiën sprake is van een bijzondere gelegenheid en wordt voldaan aan
      de in het kader daarvan door die minister gestelde voorschriften en beperkingen.

      2 Wanneer het kentekenbewijs is ingevorderd overeenkomstig [artikel 60 van de wet][ref5], mag op de dag waarop het
      voertuig als gevolg van [artikel 39, vierde lid][ref6], aan de aldaar bedoelde ambtenaren moet worden getoond, met
      dat voertuig via de kortste route naar en van de plaats van onderzoek worden gereden.

      3 Wanneer het kentekenbewijs ongeldig is verklaard voor het rijden over de weg overeenkomstig [artikel 38][ref7],
      mag op de dag waarop het voertuig waarvoor dat kentekenbewijs is afgegeven naar aanleiding van een aanvraag van
      een keuring als bedoeld in [artikel 99][ref8] of [artikel 106 van de wet][ref9] aan een zodanige keuring wordt
      onderworpen, met dat voertuig via de kortste route naar en van de plaats van keuring worden gereden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
