  - number: '17'
    text: |-
      1 Een tweedelig kentekenbewijs bestaat uit een deel I A, een deel I B en een deel II.

      2 Een tweedelig kentekenbewijs, voor een voertuig in bedrijfsvoorraad afgegeven aan een erkend bedrijf, bestaat uit
      een deel I A, een bedrijfsvoorraad deel I B en een deel II.

      3 Een kentekenbewijs, bevattende

      a. de lettergroep AA, CD, CDJ dan wel de lettergroep BN, GN, of GV en twee groepen van twee cijfers, of

      b. een kenteken opgegeven voor voertuigen als bedoeld in [artikel 4, vijfde lid, aanhef en onder b][ref1],

      bestaat uit een deel IA en IB.

      4 Een kentekenbewijs, bevattende

      a. de enkele letter A, E, H, K, L, N, P, S, T, V, W, X of Z en twee groepen van twee cijfers, of

      b. een kenteken opgegeven voor voertuigen als bedoeld in [artikel 4, vijfde lid, aanhef en onder a][ref2],

      bestaat uit een deel I.

      5 Een kentekenbewijs, bevattende de lettergroep FH, HA, HF, HC of OA en twee groepen van twee cijfers, bestaat uit
      een deel I.

      6 Een kentekenbewijs dat wordt afgegeven indien met betrekking tot het voertuig bij een in [artikel 22][ref3]
      of [26 van de wet][ref4] bedoelde keuring niet kan worden vastgesteld dan wel slechts op termijn kan worden
      vastgesteld of dat voertuig al dan niet voldoet aan de voor toelating tot het verkeer op de weg vastgestelde eisen
      en afgifte naar het oordeel van de Dienst Wegverkeer verantwoord is, bestaat uit een deel I A.

      7 Aan deel I A van een kentekenbewijs kan bij de afgifte daarvan een bijlage worden toegevoegd, bevattende gegevens
      met betrekking tot het voertuig; deze bijlage maakt deel uit van het deel I A.

      8 De afgifte van een kentekenbewijs geschiedt niet elektronisch.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel26
