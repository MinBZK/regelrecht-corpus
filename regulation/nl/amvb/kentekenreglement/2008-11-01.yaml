  - number: 1a
    text: |-
      Als categorieën bromfietsen, bedoeld in [artikel 37, eerste lid, onderdeel a, onder 1°, van de wet][ref1]
      waarop [artikel 36 van de wet][ref2] niet van toepassing is, worden, voor zover deze voertuigen voldoen aan de
      begripsomschrijving van bromfiets in [artikel 1, eerste lid, onder e, van de wet][ref3], vastgesteld:

      a. motorrijtuigen met een door de constructie bepaalde maximumsnelheid van ten hoogste 6 km/h;

      b. motorrijtuigen die bestemd zijn om door een voetganger te worden meegevoerd, en

      c. motorrijtuigen met drie symmetrisch geplaatste wielen, waarvan een wiel aan de voorzijde en twee wielen aan de
      achterzijde, die voornamelijk zijn ontworpen voor gebruik buiten de wegen en voor vrijetijdsbesteding.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel1a
