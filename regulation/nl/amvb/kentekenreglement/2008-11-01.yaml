  - number: '7'
    text: |-
      1 Als authentieke gegevens of categorieën daarvan als bedoeld in [artikel 42a, derde lid, van de wet][ref1] worden
      aangewezen gegevens omtrent:

      a. afgifte van een kentekenbewijs, bedoeld in [artikel 6, onderdelen f en u][ref2];

      b. een natuurlijk persoon of rechtspersoon aan wie een erkenning als bedoeld in
      [artikel 62, eerste lid, van de wet][ref3] is verleend;

      c. voertuigstatus;

      d. aansprakelijkheid;

      e. uitvoering en constructie van een voertuig;

      f. milieuaspecten van een voertuig; of

      g. gebruik van een voertuig.

      2 Als gevoelige gegevens worden aangewezen gegevens of combinaties van gegevens die zijn aan te merken als:

      a. persoonsgegevens als bedoeld in [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref4];

      b. gegevens waarvan de verstrekking een nadelig effect kan hebben op de concurrentiepositie van een onderneming,
      waaronder in elk geval worden verstaan voertuigidentificerende gegevens in combinatie met gegevens ten aanzien van
      een rechtspersoon omtrent:

      1°. naam, adres en vestigingsplaats;

      2°. datum van oprichting en opheffing;

      3°. aan de rechtspersoon gerelateerde nummers en coderingen, en

      4°. rechtspersoonsstatus.

      c. gegevens waarvan de verstrekking het risico van handelen in strijd met een wettelijk voorschrift met zich brengt
      waaronder in elk geval worden verstaan gegevens omtrent:

      1°. identificatie en registratie van een voertuig;

      2°. diefstal van een voertuig;

      3°. aansprakelijkheden met betrekking tot het voertuig;

      4°. kentekenbewijsstatus, en

      5°. voertuigstatus.

      3 Niet-gevoelige gegevens zijn alle gegevens die niet op grond van het tweede lid als gevoelig zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42a
