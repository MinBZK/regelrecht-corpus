      1 De verplichting tot het ter inzage afgeven van het kentekenbewijs als bedoeld in [artikel 160 van de wet][ref1],
      heeft betrekking op deel I van het voor het voertuig afgegeven kentekenbewijs.

      2 Indien de in [artikel 160 van de wet][ref2] bedoelde vordering betrekking heeft op een kentekenbewijs dat is
      afgegeven voor een aanhangwagen die overeenkomstig [artikel 3.7.3, eerste lid, van het Voertuigreglement][ref3] is
      voorzien van een constructieplaat, kan aan de vordering worden voldaan binnen een termijn van een week.


