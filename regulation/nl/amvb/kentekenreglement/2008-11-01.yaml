  - number: '14'
    text: |-
      1 Aan informatieproviders bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], kunnen op aanvraag bij
      ministeriële regeling bepaalde gevoelige gegevens worden verstrekt in overeenstemming met de aanwijzing als bedoeld
      in [artikel 9, eerste lid, onderdeel b][ref2]. De verstrekking van gevoelige gegevens vindt slechts plaats ten
      behoeve van:

      a. statistische doeleinden;

      b. bij de aanwijzing als bedoeld in [artikel 9, eerste lid, onderdeel b][ref3], aangewezen
      voertuiginformatiesystemen ten behoeve van de voertuigbranche, of

      c. andere bij ministeriële regeling te bepalen doeleinden.

      2 Aan de in het eerste lid bedoelde informatieproviders worden uitsluitend gegevens verstrekt die de situatie
      weergeven op het moment van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel9
