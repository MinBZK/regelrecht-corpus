    text: |-
      De Dienst Wegverkeer brengt die aantekeningen aan op dan wel verwijdert die aantekeningen van het kentekenbewijs
      voor zover dat bij of krachtens de wet is voorgeschreven of mogelijk wordt gemaakt.
