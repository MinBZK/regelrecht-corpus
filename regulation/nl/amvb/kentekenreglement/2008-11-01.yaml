  - number: '54'
    text: |-
      1 Kentekenbewijzen en ter vervanging van die bewijzen uitgereikte duplicaten, afgegeven op basis van de
      Wegenverkeerswet, worden vóór een bij ministeriële regeling vastgesteld tijdstip vervangen door een kentekenbewijs,
      afgegeven op basis van de wet.

      2 Overeenkomstig het eerste lid vervangen kentekenbewijzen en duplicaten verliezen hun geldigheid op het in het
      eerste lid bedoelde tijdstip; zij worden onverwijld ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel54
  - number: '55'
    text: |-
      1 De [artikelen 5][ref1], [7, eerste en tweede lid][ref2], [14][ref3], eerste lid, [15][ref4], eerste lid en
      [16 van het Reglement kentekenregistratie][ref5], zoals deze bepalingen luidden vóór het tijdstip waarop zij op
      grond van [artikel 59][ref6] zijn ingetrokken, blijven voor wat betreft het in die bepalingen bepaalde ten aanzien
      van registratiebewijzen en aanvullingsbladen van kracht tot een bij ministeriële regeling vastgesteld tijdstip.
      Tot dat tijdstip kan de Dienst Wegverkeer tevens een voorlopig registratiebewijs afgeven van een bij ministeriële
      regeling vastgesteld model.

      2 Voor de toepassing van [artikel 5 van het Reglement kentekenregistratie][ref7] wordt met een kentekenbewijs
      gelijkgesteld een kentekenbewijs, afgegeven op basis van de wet.


