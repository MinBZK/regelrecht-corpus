  - number: '46'
    text: |-
      1 Een erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1], wordt verleend teneinde voertuigen met
      behulp van een bedrijfsvoorraadpas in bedrijfsvoorraad op te nemen.

      2 Aan de erkenning kan worden verbonden:

      a. de bevoegdheid om voertuigen met behulp van een voor datacommunicatie geschikte voorziening in bedrijfsvoorraad
      op te nemen,

      b. de bevoegdheid tot het aanvragen van nog niet tenaamgestelde kentekenbewijzen,

      c. de bevoegdheid tot het versneld melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten
      Nederland worden gebracht, alsmede het verstrekken van kentekenbewijzen die een kenteken bevatten als bedoeld in
      [artikel 4, zesde lid][ref2],

      d. de bevoegdheid tot het melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten gebruik worden
      gesteld, alsmede het verstrekken van een certificaat van vernietiging, als bedoeld in artikel 5, derde lid, van
      [richtlijn nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de Europese Unie van 18 september
      2000 betreffende autowrakken (PbEG L 269), met dien verstande dat de melding alleen wordt gedaan nadat het
      certificaat van vernietiging is verstrekt, en

      e. de bevoegdheid om in geval van overdracht van een voertuig uit de bedrijfsvoorraad van het
      betrokken bedrijf namens de aanvrager van een kentekenbewijs de aanvraag in te dienen, overeenkomstig
      [artikel 50, eerste lid, onderdeel a, van de wet][ref3];

      f. de bevoegdheid om in geval van verkoop van een voertuig uit eigen bedrijfsvoorraad namens de aanvrager
      middels een voor datacommunicatie geschikte voorziening bij de Dienst Wegverkeer, overeenkomstig
      [artikel 50, eerste lid, aanhef en onderdeel b, van de wet][ref4] een aanvraag voor een kentekenbewijs of een deel
      I B in te dienen en dit aan de aanvrager uit te reiken;

      g. de bevoegdheid om een onderzoek te verrichten als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
