      1 Onverminderd het derde tot en met zesde lid, is een kentekenbewijs geldig totdat het op grond van het bepaalde in
      [artikel 57 van de wet][ref1] zijn geldigheid heeft verloren.

      2

      3 Een kentekenbewijs, bevattende de lettergroep BN of GN en twee groepen van twee cijfers heeft een geldigheidsduur
      van ten hoogste twaalf maanden.

      4 Een kentekenbewijs als bedoeld in [artikel 17, zesde lid][ref2], heeft een geldigheidsduur van ten hoogste drie
      maanden.

      5 Een kentekenbewijs, bevattende een kenteken als bedoeld in [artikel 4, vijfde lid, aanhef en onder a of b][ref3],
      heeft een geldigheidsduur van twee weken.

      6 Een kentekenbewijs, bevattende de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee
      cijfers heeft een geldigheidsduur van één dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel4
