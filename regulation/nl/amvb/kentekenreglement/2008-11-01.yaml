      2 Het ingevolge [artikel 34, vierde lid][ref2], [38, tweede lid][ref3], of [39, derde lid][ref4], afgegeven
      ontvangstbewijs treedt voor de toepassing van de [artikelen 26][ref5], [27][ref6] en [31 tot en met 33][ref7] in de
