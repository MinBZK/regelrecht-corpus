  - number: 8a
    text: |-
      1 Uit het kentekenregister worden door de Dienst Wegverkeer gevoelige gegevens verstrekt aan:

      a. met de registratie van voertuigen belaste autoriteiten buiten Nederland ten behoeve van de registratie van
      voertuigen aldaar;

      b. autoriteiten buiten Nederland die zijn belast met de handhaving van verkeersregels, de opsporing van
      verkeersovertredingen en de heffing van parkeerbelasting of andere heffingen inzake het gebruik van de weg;

      c. met de toelating van voertuigen belaste autoriteiten buiten Nederland, omtrent typen voertuigen,
      voertuigsystemen, voertuigonderdelen of technische eenheden en omtrent de uitstoot van verontreinigde gassen en
      deeltjes;

      d. autoriteiten buiten Nederland en instellingen van volkenrechtelijke organisaties voor zover dit ter uitvoering
      van een verdrag of een bindend besluit van een volkenrechtelijke organisaties vereist is.

      2 Gevoelige gegevens als bedoeld in het eerste lid worden slechts verstrekt aan autoriteiten uit landen
      die geen deel uitmaken van de Europese Unie, de Europese Vrijhandelsassociatie of de Europese Economische
      Ruimte en aan instellingen van volkenrechtelijke organisaties welke niet door een lidstaat van de Europese
      Unie, de Europese Vrijhandelsassociatie of de Europese Economische Ruimte als zodanig zijn aangewezen,
      indien dat land of die instelling naar het oordeel van de Dienst Wegverkeer een passend beschermingsniveau
      waarborgt. De beoordeling of sprake is van een passend beschermingsniveau geschiedt overeenkomstig
      [artikel 76, tweede lid, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel76
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '76'
  - number: '9'
    text: |-
      1 Aan de volgende personen en instanties kunnen gevoelige gegevens worden verstrekt:

      a. door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering
      van een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk dan wel, in geval van verstrekking
      van gegevens omtrent de verplichtingen, bedoeld in [artikel 19a, eerste lid, onderdeel a][ref1], respectievelijk
      onderdeel b, door Onze Minister en Onze Minister van Financiën, respectievelijk Onze Minister en Onze Minister van
      Justitie, gezamenlijk aangewezen beroepsbeoefenaren of categorieën van beroepsbeoefenaren;

      b. door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering
      van een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen informatieproviders, en

      c. belanghebbenden, niet zijnde personen en instanties als bedoeld in de onderdelen a en b.

      2 Onverminderd de [artikelen 11 tot en met 14][ref2] kunnen met betrekking tot gevoelige gegevens als bedoeld in
      [artikel 7, tweede lid][ref3], bij ministeriële regeling nadere regels worden gesteld die betrekking hebben op:

      a. de personen en instanties, bedoeld in het eerste lid, aan wie wordt verstrekt;

      b. de gevallen waarin wordt verstrekt;

      c. de voorwaarden waaronder wordt verstrekt, of

      d. de doeleinden waarvoor wordt verstrekt.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent het gebruik van de aan de in het eerste lid
      genoemde personen en instanties verstrekte gegevens. Daarbij kunnen beperkingen aan het gebruik worden gesteld
      alsmede voorschriften ten aanzien van de beveiliging van de verstrekte gegevens en voorschriften voor het verlenen
      van medewerking aan het toezicht door de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel7
