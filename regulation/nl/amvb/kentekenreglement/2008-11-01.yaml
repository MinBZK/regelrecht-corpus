  - number: 25b
    text: |-
      1 De eigenaar of houder van een voertuig waarvoor de eerste afgifte van een tweedelig kentekenbewijs wordt gevraagd
      en waarvoor reeds eerder een kentekenbewijs is afgegeven in een andere lidstaat van de Europese Unie, overlegt het
      deel I van dat kentekenbewijs en, voor zover dit is afgegeven, tevens het deel II.

      2 Afgifte als bedoeld in het eerste lid wordt geweigerd, indien het deel II van het kentekenbewijs, voorzover dat
      deel is afgegeven, ontbreekt.

      3 In uitzonderlijke gevallen kan door de Dienst Wegverkeer in afwijking van het tweede lid een kentekenbewijs
      worden afgegeven, op voorwaarde dat van de bevoegde autoriteiten van de lidstaat waar het voertuig voordien was
      ingeschreven langs schriftelijke of elektronische weg de bevestiging is verkregen dat de aanvrager het recht heeft
      om het voertuig in een andere lidstaat in te schrijven.

      4 De Dienst Wegverkeer bewaart de ingenomen kentekenbewijzen dan wel de ingenomen delen daarvan, gedurende zes
      maanden en stelt de autoriteiten van de lidstaat die het kentekenbewijs hebben afgegeven binnen twee maanden na de
      datum van inname daarvan op de hoogte. Op verzoek stuurt de Dienst Wegverkeer de ingenomen kentekenbewijzen terug
      naar de autoriteiten van de lidstaat die het kentekenbewijs hebben afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel25b
  - number: '26'
    text: |-
      1 Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van het voertuig waarvoor dat
      kentekenbewijs is afgegeven, verplicht:

      a. het deel I B en het deel II terstond over te dragen aan degene die eigenaar of houder van het voertuig is
      geworden;

      b. het deel I A van het kentekenbewijs onder zich te houden, totdat hij het in het derde lid bedoelde
      vrijwaringsbewijs en het oude deel I B heeft ontvangen.

      2 Degene die eigenaar of houder van het voertuig is geworden is verplicht binnen een week nadat hij het deel I
      B en het deel II heeft ontvangen, bij de Dienst Wegverkeer om afgifte van een nieuw deel I B te verzoeken onder
      overlegging van het deel I B, het deel II en een bij ministeriële regeling aangewezen legitimatiebewijs.

      3 De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan, een
      vrijwaringsbewijs en een nieuw deel I B af.

      4 Degene die het vrijwaringsbewijs heeft ontvangen, is verplicht dit terstond, te zamen met het oude deel I B, te
      doen toekomen aan degene die het deel I A, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden.

      5 Degene die het deel I A, bedoeld in het eerste lid, onderdeel b, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan degene van wie hij het vrijwaringsbewijs en het oude deel I B heeft verkregen.

      6 In afwijking van het derde lid houdt de Dienst Wegverkeer de beslissing op het verzoek, bedoeld in het tweede
      lid, aan indien daartoe naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich
      tot de Dienst Wegverkeer.

      7 De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van een
      voertuig, aan wie een tweedelig kentekenbewijs is afgegeven, met de houder, respectievelijk de eigenaar van het
      voertuig overeenkomt dat het kenteken aan deze houder, respectievelijk eigenaar wordt opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel26
  - number: '27'
    text: |-
      1 In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig waarvoor een tweedelig
      kentekenbewijs is afgegeven, zijn in afwijking van [artikel 26, het tweede tot en met negende lid][ref1] van
      toepassing.

      2 Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is verplicht:

      a. aan het erkende bedrijf terstond het deel I B van het kentekenbewijs en het deel II over te dragen;

      b. het deel I A van het kentekenbewijs onder zich te houden totdat hij het in het vijfde lid bedoelde
      vrijwaringsbewijs en het oude deel I B heeft ontvangen.

      3 Het erkende bedrijf is verplicht binnen een week, nadat hij het deel I B en het deel II heeft ontvangen, bij
      de Dienst Wegverkeer om opname in bedrijfsvoorraad te verzoeken onder overlegging van deel I B, het deel II en
      de bedrijfsvoorraadpas.

      4 De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan, een formulier af
      met gegevens die verband houden met de opname in bedrijfsvoorraad.

      5 Het erkende bedrijf is verplicht:

      a. een vrijwaringsbewijs en een bedrijfsvoorraad deel I B met de in het vierde lid bedoelde gegevens in te vullen;

      b. aan degene van wie hij het deel I B en het deel II heeft ontvangen, het vrijwaringsbewijs alsmede het oude deel
      I B terstond ter hand te stellen;

      c. het bedrijfsvoorraad deel I B onder zich te houden.

      6 Degene die het deel I A, bedoeld in het tweede lid, onderdeel b, onder zich heeft gehouden, is verplicht
      dit terstond af te geven aan het erkende bedrijf van wie hij het vrijwaringsbewijs en het oude deel I B heeft
      verkregen.

      7 De Dienst Wegverkeer houdt de beslissing op het verzoek, bedoeld in het derde lid, aan indien daartoe naar het
      oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.

      8 In afwijking van het derde en vijfde lid, is een erkend bedrijf, indien dit gebruik maakt van de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel a][ref2], verplicht:

      a. de overdracht van het voertuig ten behoeve van diens bedrijfsvoorraad terstond na de overdracht te melden aan de
      Dienst Wegverkeer;

      b. het vrijwaringsbewijs en het bedrijfsvoorraad deel I B met de middels datacommunicatie ter beschikking gestelde
      gegevens die verband houden met de opname in bedrijfsvoorraad in te vullen;

      c. aan degene van wie hij het deel I B en het deel II heeft ontvangen, het vrijwaringsbewijs en het oude deel I B
      terstond ter hand te stellen;

      d. het bedrijfsvoorraad deel I B onder zich te houden.

      9 Het tweede en het zesde lid zijn niet van toepassing indien een of meer delen dan wel bladzijden van het
      kentekenbewijs verloren zijn geraakt of teniet zijn gegaan en het erkende bedrijf bij de in het achtste lid,
      onderdeel a, bedoelde melding tevens meldt dat het voertuig voorgoed buiten gebruik wordt gesteld, mits degene aan
      wie het tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van het voertuig
      is geworden:

      a. aan het erkende bedrijf terstond de niet verloren geraakte of teniet gegane delen dan wel bladzijden van het
      kentekenbewijs overdraagt,

      b. verklaart dat de niet aan het erkende bedrijf overgedragen delen dan wel bladzijden van het kentekenbewijs
      verloren zijn geraakt of teniet zijn gegaan, en

      c. bij het erkende bedrijf de bij ministeriële regeling aangewezen documenten overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
