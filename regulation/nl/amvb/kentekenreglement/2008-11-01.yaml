  - number: '10'
    text: |-
      1 De aanvraag tot het verstrekken van gegevens geschiedt op door de Dienst Wegverkeer te bepalen wijze en onder
      opgave van de reden, waarbij de identiteit van de aanvrager met voldoende zekerheid door deze dienst kan worden
      vastgesteld.

      2 Indien de aanvrager persoonlijk bij de Dienst Wegverkeer verschijnt teneinde een aanvraag tot het verstrekken van
      gegevens in te dienen, legitimeert deze zich ten genoege van deze dienst.

      3 Het eerste en derde lid zijn niet van toepassing indien de aanvraag wordt ingediend door belanghebbenden als
      bedoeld in [artikel 9, eerste lid, onderdelen a of b][ref1], mits overeenkomstig het door de Dienst Wegverkeer
      bepaalde, is vastgesteld dat de aanvrager tot één van de genoemde categorieën behoort en voldoende zekerheid is
      verkregen omtrent diens identiteit.

      4 In afwijking van het eerste tot en met derde lid hoeft bij de aanvraag van niet-gevoelige gegevens geen reden
      voor de aanvraag te worden opgegeven noch is vaststelling van de identiteit van de aanvrager noodzakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11'
    text: |-
      1 Nadat een belanghebbende als bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], een verzoek om verstrekking
      van persoonsgegevens heeft ingediend, vraagt de Dienst Wegverkeer aan betrokkene toestemming voor de verstrekking
      van deze gegevens. Deze dienst geeft daarbij aan voor welke doeleinden de verstrekking is verzocht.

      2 Het vragen van toestemming blijft achterwege indien uit het kentekenregister blijkt dat betrokkene zijn
      toestemming aan elke verstrekking aan belanghebbenden als bedoeld in [artikel 9, eerste lid, onderdeel c][ref2],
      heeft onthouden, dan wel indien het voertuig waarop de aanvraag betrekking heeft, blijkens door de Dienst
      Wegverkeer aangewezen bescheiden is betrokken bij een verkeersongeval waarbij aan de aanvrager schade is
      toegebracht.

      3 Aan belanghebbenden als bedoeld in [artikel 9, eerste lid, onderdeel c][ref3], worden persoonsgegevens niet
      verstrekt indien betrokkene zijn toestemming daaraan onthoudt, dan wel zijn toestemming aan elke verstrekking aan
      desbetreffende belanghebbenden heeft onthouden.

      4 In afwijking van het derde lid worden aan belanghebbenden als bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref4], de gevraagde gegevens zonder toestemming van betrokkene verstrekt,
      indien het voertuig waarop de aanvraag betrekking heeft, blijkens door de Dienst Wegverkeer aangewezen bescheiden,
      is betrokken bij een verkeersongeval waarbij aan de aanvrager schade is toegebracht.

      5 In afwijking van het eerste lid blijft het vragen van toestemming achterwege indien het een aanvraag betreft
      door degene die als eigenaar van het desbetreffende voertuig in het kentekenregister staat geregistreerd tot
      verstrekking van persoonsgegevens met betrekking tot de houder aan wie het kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
