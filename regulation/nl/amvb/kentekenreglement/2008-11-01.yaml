  - number: '2'
    text: |-
      1 De opgave van een kenteken geschiedt door afgifte van een kentekenbewijs dan wel door afgifte van een deel I B of
      een bedrijfsvoorraad deel I B van een kentekenbewijs.

      2 Het kenteken bestaat uit een combinatie van letters en cijfers dan wel een combinatie van één letter en cijfers.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel2
  - number: '3'
    text: |-
      Aan een erkend bedrijf of aan een natuurlijke persoon of rechtspersoon als bedoeld in
      [artikel 42, eerste lid, onderdeel b][ref1], kan, mits wordt voldaan aan [hoofdstuk 5][ref2], voor de in
      [artikel 37, derde lid, van de wet][ref3] bedoelde voertuigen een kenteken worden opgegeven bevattende:

      a. voor wat betreft motorrijtuigen, met uitzondering van bromfietsen, de lettergroep HA, HF of FH en twee groepen
      van twee cijfers;

      b. voor wat betreft bromfietsen de lettergroep HC en twee groepen van twee cijfers, of

      c. voor wat betreft aanhangwagens de lettergroep OA en twee groepen van twee cijfers.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel3
