      1 Het in [artikel 48, eerste lid, van de wet][ref1] bedoelde vereiste dat een natuurlijke persoon
      of een rechtspersoon die een kentekenbewijs aanvraagt, in Nederland woonachtig, respectievelijk
      gevestigd moet zijn, is niet van toepassing op kentekenbewijzen, bevattende een kenteken als bedoeld in
      [artikel 4, eerste tot en met derde en vijfde tot en met zevende lid][ref2].

      2 Het in [artikel 50, eerste lid, van de wet][ref3] bedoelde vereiste, dat de aanvrager van een
      kentekenbewijs persoonlijk dient te verschijnen bij een bij ministeriële regeling aan te wijzen
      instantie, geldt niet voor de aanvraag van kentekenbewijzen, bevattende een kenteken als bedoeld in
      [artikel 4, eerste tot en met derde, vijfde en zesde lid][ref4].


