  - number: 58f
    text: |-
      1 In afwijking van de artikelen 58b, tweede lid, en 58c, derde lid, is, in geval van overlijden van degene aan wie
      een kentekenbewijs als bedoeld in artikel 58a is afgegeven, degene die als erfgenaam eigenaar of houder van het
      voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is geworden bij de Dienst Wegverkeer
      om afgifte van een deel I B of een nieuw deel I B te verzoeken onder overlegging van het deel II, het deel I B
      of het bedrijfsvoorraad deel II of I B, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen
      legitimatiebewijs.

      2 De Dienst Wegverkeer geeft aan degene die aan de verplichting van het eerste lid heeft voldaan, zowel een
      vrijwaringsbewijs als een deel I B of een nieuw deel I B af.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58f
  - number: 58g
    text: |-
      1 De Dienst Wegverkeer kan voor een voertuig een tweedelig kentekenbewijs afgeven zonder dat aan de in de
      [artikelen 58b tot en met 58f][ref1] bedoelde verplichtingen is voldaan, indien de aanvraag voor het kentekenbewijs
      wordt ingediend door een natuurlijke persoon of een rechtspersoon die verklaart eigenaar of houder van het
      voertuig te zijn en indien naar het oordeel van de Dienst Wegverkeer aannemelijk is gemaakt dat niet aan bedoelde
      verplichtingen kan worden voldaan.

      2 De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van het
      kentekenbewijs het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs overlegt en een of
      meer delen van het kentekenbewijs inlevert.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58b
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel58g
