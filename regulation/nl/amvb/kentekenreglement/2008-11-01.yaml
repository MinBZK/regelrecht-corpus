  - number: '12'
    text: |-
      Aan beroepsbeoefenaren of categorieën van beroepsbeoefenaren als bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref1], worden de gevraagde gegevens verstrekt, voor zover zij deze
      gegevens beroepshalve nodig hebben voor het realiseren van rechten en plichten met betrekking tot het
      desbetreffende voertuig die voor de aanvrager of diens cliënt bestaan of kunnen ontstaan, voortvloeiend
      uit wettelijk voorschrift of uit overeenkomst, een en ander voor zover bij de aanwijzing, bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref2], is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel9
