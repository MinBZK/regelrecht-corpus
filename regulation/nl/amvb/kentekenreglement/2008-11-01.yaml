  - number: 58h
    text: |-
      1 Indien het voertuig waarvoor een kentekenbewijs als bedoeld in [artikel 58a][ref1] is afgegeven niet meer
      overeenstemt met de gegevens op het deel I, vraagt degene aan wie het kentekenbewijs is afgegeven of degene die
      na diens overlijden eigenaar of houder van het voertuig is geworden, onverwijld bij de Dienst Wegverkeer onder
      overlegging van het kentekenbewijs een nieuw kentekenbewijs aan.

      2 Indien het kentekenbewijs is ingevorderd ingevolge [artikel 60 van de wet][ref2], geeft de Dienst Wegverkeer
      op verzoek een nieuw kentekenbewijs af. Degene aan wie het kentekenbewijs is afgegeven of degene die na
      diens overlijden eigenaar of houder van het voertuig is geworden, dient hiertoe bij de Dienst Wegverkeer
      onder overlegging van het bij de invordering afgegeven ontvangstbewijs een aanvraag in. De Dienst Wegverkeer
      geeft niet eerder een nieuw kentekenbewijs af dan nadat het voertuig is goedgekeurd overeenkomstig
      [artikel 105 van de wet][ref3].

      3 De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in [artikel 98 van de wet][ref4]
      een nieuw kentekenbewijs af nadat de wijziging is goedgekeurd ingevolge artikel 98 van de wet. Deze dienst kan
      daarbij verlangen dat het in [artikel 6.16, eerste lid, van het Voertuigreglement][ref5] bedoelde ontvangstbewijs
      wordt overgelegd.

      4 De Dienst Wegverkeer geeft voor een kentekenbewijs dat wordt ingeleverd bij een door Onze Minister aangewezen
      instantie in verband met een wijziging aan het voertuig die niet behoeft te worden goedgekeurd ingevolge
      [artikel 98 van de wet][ref6], een ontvangstbewijs af.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel105
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel98
      [ref5]: https://wetten.overheid.nl/BWBR0006746#Artikel6.16
      [ref6]: https://wetten.overheid.nl/BWBR0006622#Artikel98
