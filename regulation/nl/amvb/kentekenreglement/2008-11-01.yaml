  - number: '39'
    text: |-
      1 Tot de invordering van het kentekenbewijs als bedoeld in [artikel 60 van de wet][ref1] zijn bevoegd:

      a. de Directie van de Dienst Wegverkeer en de door de Directie daartoe aangewezen tot die dienst behorende
      ambtenaren, indien naar hun oordeel [artikel 60, eerste lid, onderdeel b of c of tweede lid, van de wet][ref2], van
      toepassing is;

      b. de door Onze Minister in overeenstemming met Onze Minister van Financiën aangewezen ambtenaren der
      Rijksbelastingdienst, indien naar hun oordeel niet is voldaan aan [artikel 36, vijfde lid, van de wet][ref3], dan
      wel naar hun oordeel [artikel 60, eerste lid, onderdeel a , van de wet][ref4], van toepassing is;

      c. de ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref5], indien naar hun oordeel
      [artikel 60, eerste lid, onderdeel a, b of c][ref6], dan wel [artikel 60, tweede lid, van de wet][ref7] van
      toepassing is.

      2 De verplichting tot overgifte, bedoeld in [artikel 60, eerste lid, van de wet][ref8], heeft betrekking op deel I
      van het kentekenbewijs.

      3 De in het eerste lid bedoelde ambtenaren geven het deel I B van het kentekenbewijs, indien dit was afgegeven, na
      inzage terug aan degene van wie het is ingevorderd en reiken voor deel I A onverwijld een ontvangstbewijs uit. Zij
      doen dit deel met vermelding van de reden van invordering zo spoedig mogelijk toekomen aan de Dienst Wegverkeer.

      4 Indien de invordering heeft plaatsgevonden op grond van [artikel 60, eerste lid, onderdeel b , van de wet][ref9],
      mogen de in het eerste lid, onderdeel c, bedoelde ambtenaren het deel I A van het kentekenbewijs gedurende ten
      hoogste vier weken onder zich houden. Zij geven dit deel tegen teruggave van het ontvangstbewijs aan de houder
      daarvan terug, indien binnen deze termijn naar hun oordeel is aangetoond dat het voertuig in overeenstemming
      is gebracht met de bij of krachtens de wet vastgestelde eisen. Van het onder zich houden, respectievelijk het
      teruggeven, stellen zij de Dienst Wegverkeer in kennis.

      5 Indien dit bij de vordering van de houder van een kentekenbewijs wordt geëist, is deze verplicht tot het op een
      daarbij te bepalen tijd en plaats ter beschikking houden van het voertuig, waarvoor het bewijs is afgegeven.

      6 Indien de vordering betrekking heeft op een kentekenbewijs dat is afgegeven voor een aanhangwagen die
      overeenkomstig [artikel 3.7.3, eerste lid, van het Voertuigreglement][ref10] is voorzien van een constructieplaat,
      kan aan de vordering worden voldaan binnen een termijn van een week.


