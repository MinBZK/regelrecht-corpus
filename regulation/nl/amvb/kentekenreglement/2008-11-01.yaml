    text: |-
      Een voertuig mag op de weg staan, wanneer het voor dat voertuig afgegeven kentekenbewijs ongeldig is
      verklaard voor het rijden over de weg overeenkomstig [artikel 38][ref1], dan wel is ingevorderd overeenkomstig
      [artikel 60 van de wet][ref2].


