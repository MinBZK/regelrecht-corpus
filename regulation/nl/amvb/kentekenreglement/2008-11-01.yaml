  - number: 24a
    text: |-
      1 De eigenaar of houder van een voertuig waarvoor de afgifte van een kentekenbewijs als bedoeld in
      [artikel 17, derde lid, onder b][ref1], wordt gevraagd, stelt het voertuig voor een onderzoek ter beschikking
      van de Dienst Wegverkeer en vraagt bij deze dienst onder overlegging van een bij ministeriële regeling aangewezen
      legitimatiebewijs, een kentekenbewijs aan.

      2 Bij ministeriële regeling kan worden bepaald dat een kentekenbewijs als bedoeld in
      [artikel 17, derde lid, onder b][ref2], niet binnen een bij die regeling te bepalen periode meerdere keren voor
      hetzelfde voertuig wordt afgegeven.


