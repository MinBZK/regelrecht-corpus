  - number: '30'
    text: |-
      1 De Dienst Wegverkeer kan voor een voertuig een tweedelig kentekenbewijs afgeven zonder dat aan de in de
      [artikelen 26 tot en met 29][ref1] bedoelde verplichtingen is voldaan, indien de aanvraag voor het kentekenbewijs
      wordt ingediend door een natuurlijke persoon of een rechtspersoon die verklaart eigenaar of houder van het
      voertuig te zijn en indien naar het oordeel van de Dienst Wegverkeer aannemelijk is gemaakt dat niet aan bedoelde
      verplichtingen kan worden voldaan.

      2 De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van het
      kentekenbewijs het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs overlegt en een of
      meer delen of bladzijden van het kentekenbewijs inlevert.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel30
