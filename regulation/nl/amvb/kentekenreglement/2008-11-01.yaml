  - number: '32'
    text: |-
      1 In afwijking van [artikel 31][ref1], is, ingeval het erkende bedrijf gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c, het tweede en derde lid][ref2] van toepassing.

      2 Degene die eigenaar of houder van het voertuig is geworden, is verplicht terstond bij het erkende bedrijf een
      bij ministeriële regeling aangewezen legitimatiebewijs alsmede een ingevulde en ondertekende verklaring van een bij
      ministeriële regeling vastgesteld model in drievoud over te leggen.

      3 Het erkende bedrijf is verplicht overeenkomstig het krachtens [artikel 62, derde lid, van de wet][ref3] bepaalde:

      a. het legitimatiebewijs te controleren;

      b. de overdracht van het voertuig aan de in het buitenland woonachtige persoon of de in het buitenland gevestigde
      rechtspersoon terstond te melden aan de Dienst Wegverkeer;

      c. op het deel I A en het deel II een aantekening te plaatsen alsmede de verklaring in drievoud in te vullen;

      d. aan degene aan wie het voertuig wordt overgedragen het deel I A, het bedrijfsvoorraad deel I B en het deel II te
      zamen met de verklaring in tweevoud terstond ter hand te stellen;

      e. het daartoe bestemde deel van de verklaring onder zich te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel62
