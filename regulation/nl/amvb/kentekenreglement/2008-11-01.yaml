  - number: '25'
    text: |-
      1 De eigenaar of houder van een voertuig waarvoor de eerste afgifte van een tweedelig kentekenbewijs wordt
      gevraagd, stelt het voertuig voor een onderzoek ter beschikking bij de Dienst Wegverkeer en vraagt bij deze dienst
      onder overlegging van een bij ministeriële regeling aangewezen legitimatiebewijs, een kentekenbewijs aan.

      2 De eigenaar of houder van een voertuig waarvoor de eerste afgifte van een tweedelig kentekenbewijs
      wordt gevraagd en waarvoor reeds een nog niet tenaamgesteld kentekenbewijs is afgegeven krachtens
      [artikel 46, tweede lid, onderdeel b][ref1], vraagt dit tweedelig kentekenbewijs aan bij de Dienst Wegverkeer onder
      overlegging van het deel I A, het deel II en het in het eerste lid bedoelde legitimatiebewijs.

      3 De Dienst Wegverkeer geeft aan degene die aan de verplichtingen in het eerste of tweede lid heeft voldaan, een
      kentekenbewijs, respectievelijk een deel I B af.

      4 Indien de aanvraag wordt gedaan door een erkend bedrijf dat geen gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel b][ref2], geeft de Dienst Wegverkeer in plaats van een deel I B een formulier af
      met gegevens die verband houden met de opname in bedrijfsvoorraad.

      5 Ingeval een formulier als bedoeld in het vierde lid is afgegeven, is het erkende bedrijf verplicht een
      bedrijfsvoorraad deel I B met de op dat formulier vermelde gegevens in te vullen.

      6 In afwijking van het derde en vierde lid houdt de Dienst Wegverkeer de beslissing op de aanvraag, bedoeld in het
      eerste en tweede lid, aan indien daartoe naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de
      aanvrager zich tot de Dienst Wegverkeer.

      7 Het [eerste en het derde tot en met zesde lid van artikel 25][ref3] zijn van overeenkomstige toepassing indien
      een tweedelig kentekenbewijs wordt aangevraagd voor een voertuig waarvoor door de Dienst Wegverkeer reeds eerder
      een tweedelig of driedelig kentekenbewijs is afgegeven en blijkens het kentekenregister:

      a. dat voertuig voorgoed buiten gebruik is gesteld,

      b. dat voertuig voorgoed buiten Nederland is gebracht,

      c. dat voertuig definitief is bestemd voor gebruik buiten de weg, of

      d. voor dat voertuig nadien een kentekenbewijs met een bijzonder kenteken is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel25
