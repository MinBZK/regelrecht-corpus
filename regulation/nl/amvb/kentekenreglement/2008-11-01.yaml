  - number: '41'
    text: |-
      Voor voertuigen als bedoeld in [artikel 37, derde lid, van de wet][ref1], geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits dat voertuig een kenteken voert als bedoeld in
      [artikel 3][ref2], dat behoort bij een ingevolge [artikel 42][ref3] afgegeven handelaarskentekenbewijs waarvan
      gebruik wordt gemaakt overeenkomstig de in dit hoofdstuk bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel42
