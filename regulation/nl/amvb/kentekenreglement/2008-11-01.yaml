preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 juni 1993, nr. RV 151906, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 18 oktober 1993, nr. W09.93.0363);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 30 september 1994, nr. R 183051;
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet* : [Wegenverkeerswet 1994][ref1];

      b. *voertuig* : motorrijtuig of aanhangwagen als bedoeld in
      [artikel 1, eerste lid, onderdelen c en d , van de wet][ref2];

      c. *bijzonder kenteken*: kenteken als bedoeld in [artikel 38 van de wet][ref3];

      d. *erkend bedrijf* : natuurlijke persoon of rechtspersoon aan wie een erkenning overeenkomstig
      [artikel 62 van de wet][ref4] is verleend;

      e. *bedrijfsvoorraad* : te verhandelen, bewaren of te bewerken voertuigen waarvan een erkend bedrijf de eigendom
      heeft verkregen;

      f. *bedrijfsvoorraad deel I B*: deel I B van een kentekenbewijs van een bij ministeriële regeling vastgesteld
      model, afgegeven aan een erkend bedrijf, ten behoeve van de voertuigen die in bedrijfsvoorraad zijn opgenomen;

      g. *bedrijfsvoorraadpas*: pas als bedoeld in [artikel 48, eerste lid][ref5];

      h. *handelaarskenteken*: kenteken als bedoeld in [artikel 3][ref6];

      i. *vrijwaringsbewijs* : bewijs van een bij ministeriële regeling vastgesteld model, blijkens welk aan de
      verplichtingen van [artikel 26, tweede lid][ref7], [27, derde lid][ref8], [27, achtste lid, onderdeel a][ref9],
      [28, tweede lid][ref10], [28a, vierde lid][ref11], of [29, eerste lid][ref12], is voldaan;

      j. *betrokkene*: betrokkene als bedoeld in [artikel 1, onderdeel f, van de Wet bescherming persoonsgegevens][ref13].


