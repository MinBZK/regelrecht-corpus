        hoofdstuk: '4'
  - number: '31'
    text: |-
      1 Degene aan wie een tweedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden, is, in geval van overdracht van een voertuig aan een in het buitenland woonachtige
      natuurlijke persoon of een in het buitenland gevestigde rechtspersoon, verplicht:

      a. het deel I B en het deel II terstond over te dragen aan degene die eigenaar of houder van het voertuig is
      geworden;

      b. het deel I A van het kentekenbewijs onder zich te houden, totdat hij het in het vierde lid bedoelde deel van de
      verklaring heeft ontvangen.

      2 Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel I B
      en het deel II heeft ontvangen bij de Dienst Wegverkeer het deel I B en het deel II, een bij ministeriële regeling
      aangewezen legitimatiebewijs alsmede een ingevulde en ondertekende verklaring van een bij ministeriële regeling
      vastgesteld model in drievoud over te leggen.

      3 De Dienst Wegverkeer plaatst op het deel I B en op het deel II een aantekening, vult de verklaring in en geeft
      het deel I B, het deel II, de verklaring in tweevoud alsmede het legitimatiebewijs terug aan degene die aan de in
      het tweede lid bedoelde verplichtingen heeft voldaan.

      4 Degene die de verklaring in tweevoud heeft ontvangen, is verplicht het daartoe bestemde deel van de verklaring
      terstond te doen toekomen aan degene die het deel I A onder zich heeft gehouden.

      5 Degene die het deel I A onder zich heeft gehouden, is verplicht dit terstond af te geven aan degene van wie hij
      het in het vierde lid bedoelde deel van de verklaring heeft verkregen.

      6 In geval van overdracht van een tot de bedrijfsvoorraad van een erkend bedrijf behorend voertuig waarvoor een
      tweedelig kentekenbewijs is afgegeven aan een in het buitenland woonachtige natuurlijke persoon of een in het
      buitenland gevestigde rechtspersoon, zonder dat het erkende bedrijf gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c][ref1], is het eerste tot en met vijfde lid van overeenkomstige toepassing,
      met dien verstande dat het bedrijfsvoorraad deel I B in de plaats treedt van het deel I B.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel31
