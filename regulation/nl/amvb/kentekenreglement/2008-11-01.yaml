  - number: '5'
    text: |-
      1 Het kenteken wordt aangebracht op een plaat die behoort tot een door de Dienst Wegverkeer goedgekeurde soort.

      2 Het eerste lid geldt niet in bij ministeriële regeling vast te stellen gevallen.

      3 De in het eerste lid bedoelde plaat en de onderdelen daarvan zijn in bij ministeriële regeling vast te stellen
      gevallen voorzien van bij die regeling vast te stellen merken.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel5
  - number: '6'
    text: |-
      1 Het kentekenregister bevat uitsluitend de volgende categorieën gegevens:

      a. de naam, de voornaam of, in geval van meer voornamen, de eerste voornaam en de beginletters van de overige
      voornamen, de geboortedatum, de geboorteplaats, het geboorteland, het geslacht en het adres van degene aan wie het
      kenteken is dan wel was opgegeven;

      b. de naam, het adres en het inschrijvingsnummer bij de Kamer van Koophandel van de rechtspersoon waaraan het
      kenteken is dan wel was opgegeven;

      c. de naam, de voornaam of, in geval van meer voornamen, de eerste voornaam en de beginletters van de overige
      voornamen, de geboortedatum, de geboorteplaats, het geboorteland, het geslacht en het adres van degene die bij de
      aanvraag van een kentekenbewijs als gemachtigde van een rechtspersoon is opgetreden;

      d. de naam en het adres van degene die een voertuig waarvoor nog geen kenteken is opgegeven, op Nederlands
      grondgebied heeft gebracht of in Nederland heeft vervaardigd;

      e. de naam, het adres en de gegevens omtrent het legitimatiebewijs van degene die een voertuig voorgoed buiten
      Nederland brengt;

      f. gegevens omtrent bij de aanvraag van een kentekenbewijs overgelegde legitimatiebewijzen;

      g. gegevens omtrent de afgifte, de invordering alsmede de ongeldigverklaring van het kentekenbewijs;

      h. gegevens omtrent de erkenning bedrijfsvoorraad, bedoeld in [hoofdstuk IV, paragraaf 5 van de wet][ref1];

      i. gegevens omtrent de schorsing, bedoeld in [hoofdstuk IV, paragraaf 6 van de wet][ref2];

      j. gegevens omtrent de verplichting tot periodieke keuring, bedoeld in [hoofdstuk V van de wet][ref3];

      k. gegevens ten behoeve van de heffing van de motorrijtuigenbelasting, bedoeld in
      de [Wet op de motorrijtuigenbelasting 1994][ref4] en de belasting, bedoeld in de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref5];

      l. gegevens omtrent voertuigen waarvoor een kenteken is dan wel was opgegeven alsmede voertuigen die op Nederlands
      grondgebied zijn gebracht of in Nederland zijn vervaardigd, waarvoor nog geen kenteken is opgegeven;

      m. gegevens omtrent het bepaalde in andere wettelijke regelingen ten aanzien van voertuigen dan de wet en de in
      onderdeel *k* bedoelde wettelijke regelingen;

      n. gegevens omtrent in het buitenland geregistreerde voertuigen waarvoor de opgave van een kenteken wordt verzocht;

      o. gegevens omtrent typegoedkeuringen van voertuigen, voertuigonderdelen en uitrustingsstukken;

      p. gegevens in verband met het verwerken van gegevens in het kader van het kentekenregister alsmede het gebruiken
      van deze gegevens door belanghebbenden;

      q. gegevens van administratieve aard, verband houdende met de tenaamstelling van kentekens;

      r. gegevens omtrent de vermissing van voertuigen en de aangifte van diefstal of verduistering van voertuigen;

      s. het sociaal-fiscaal nummer, het GBA-nummer en het door de Dienst Wegverkeer in het kader van het
      kentekenregister toegekende persoonsidentificatienummer;

      t. het gegeven dat degene aan wie een kenteken is opgegeven, is overleden, en

      u. het gegeven dat ten aanzien van een voertuig waarvoor een kenteken is opgegeven, niet is
      voldaan aan de verplichting tot het betalen van motorrijtuigenbelasting als bedoeld in de
      [Wet op de motorrijtuigenbelasting 1994][ref6], of de verplichtingen inzake opgelegde administratieve sancties als
      bedoeld in de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref7].

      2 De in het eerste lid bedoelde gegevens worden, voor zover zij verband houden met een tenaamstelling, maximaal
      negen jaar na het verval van de tenaamstelling in het kentekenregister bewaard. De overige gegevens worden
      gedurende een door de Dienst Wegverkeer vastgestelde periode bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Paragraaf6
