  - number: '34'
    text: |-
      1 Indien het voertuig waarvoor het kentekenbewijs is afgegeven niet meer overeenstemt met de gegevens op het deel
      I A, vraagt degene aan wie het kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, onverwijld bij de Dienst Wegverkeer onder overlegging van het deel I A een nieuw deel I
      A aan.

      2 Indien het kentekenbewijs is ingevorderd ingevolge [artikel 60 van de wet][ref1], geeft de Dienst Wegverkeer op
      verzoek een nieuw deel I A af. Degene aan wie het kentekenbewijs is afgegeven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, dient hiertoe bij de Dienst Wegverkeer onder overlegging van het
      bij de invordering afgegeven ontvangstbewijs een aanvraag in. De Dienst Wegverkeer geeft niet eerder een nieuw deel
      I A af dan nadat het voertuig is goedgekeurd overeenkomstig [artikel 105 van de wet][ref2].

      3 De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in [artikel 98 van de wet][ref3]
      een nieuw deel I A af nadat de wijziging is goedgekeurd ingevolge [artikel 98 van de wet][ref4]. Deze dienst kan
      daarbij verlangen dat het in [artikel 6.16, eerste lid, van het Voertuigreglement][ref5] bedoelde ontvangstbewijs
      wordt overgelegd.

      4 De Dienst Wegverkeer geeft voor een deel I A dat wordt ingeleverd bij een door Onze Minister aangewezen
      instantie in verband met een wijziging aan het voertuig die niet behoeft te worden goedgekeurd ingevolge
      [artikel 98 van de wet][ref6], een ontvangstbewijs af.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
