        hoofdstuk: '5'
  - number: '44'
    text: |-
      1 Een handelaarskenteken mag slechts worden gebruikt door degene aan wie het is opgegeven dan wel een door deze
      aangewezen persoon. Het gebruik is slechts toegestaan voor de categorie waarvoor het is opgegeven.

      2 Een handelaarskenteken mag worden gebruikt voor voertuigen die ter bewerking of herstel aan degene aan wie het
      kenteken is opgegeven ter beschikking zijn gesteld.

      3 Een handelaarskenteken moet worden gebruikt voor voertuigen die behoren tot de bedrijfsvoorraad van degene aan
      wie het kenteken is opgegeven.

      4 Een handelaarskenteken mag uitsluitend worden gebruikt indien met het voertuig als bedoeld in het tweede en
      derde lid gebruik van de weg wordt gemaakt in het kader van bedrijfsactiviteiten van het erkende bedrijf of de
      natuurlijke persoon of rechtspersoon aan wie het handelaarskenteken is opgegeven.

      5 Voor overtreding van het eerste tot en met vierde lid is degene aan wie het handelaarskenteken is opgegeven
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel44
  - number: '45'
    text: |-
      1 De Dienst Wegverkeer kan een handelaarskentekenbewijs ongeldig verklaren indien degene aan wie het
      handelaarskentekenbewijs is afgegeven:

      a. om zodanige ongeldigverklaring verzoekt,

      b. aangifte heeft gedaan van het onvrijwillig verlies van het handelaarskentekenbewijs,

      c. niet langer voldoet aan [artikel 42][ref1], dan wel

      d. handelt in strijd met het bepaalde:

      1°. bij of krachtens [artikel 37, derde of vierde lid, van de wet][ref2], dan wel

      2°. krachtens [artikel 37, zevende lid, van de wet][ref3], voor zover het betreft nadere regels ter uitvoering van
      het derde lid van dat artikel.

      2 Degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft, levert dit onverwijld in bij de
      Dienst Wegverkeer.

      3 Indien degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft niet voldoet aan de
      verplichting van het tweede lid, kan het handelaarskentekenbewijs worden ingenomen door de daartoe bevoegde
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel37
