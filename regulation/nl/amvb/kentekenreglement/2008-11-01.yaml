  - number: '28'
    text: |-
      1 Indien een voertuig waarvoor een tweedelig kentekenbewijs is afgegeven, ophoudt te behoren tot de
      bedrijfsvoorraad van een erkend bedrijf, is [artikel 26][ref1] of, in geval van overdracht ten behoeve van een
      bedrijfsvoorraad, [artikel 27][ref2] van overeenkomstige toepassing, met dien verstande dat het bedrijfsvoorraad
      deel I B in de plaats treedt van het gewone deel I B.

      2 Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf en dit bedrijf het voertuig
      tot eigen gebruik bestemt, vraagt het bedrijf binnen een week een nieuw deel I B aan bij de Dienst Wegverkeer,
      onder overlegging van het bedrijfsvoorraad deel I B, het deel II en een bij ministeriële regeling aangewezen
      legitimatiebewijs.

      3 De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan, zowel een
      vrijwaringsbewijs als een nieuw deel I B af.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel27
