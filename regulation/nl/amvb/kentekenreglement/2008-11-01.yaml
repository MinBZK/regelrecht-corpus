  - number: '47'
    text: |-
      1 Een erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1], kan worden aangevraagd door en worden
      verleend aan:

      a. een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht of gefabriceerd met het doel deze te verkopen,

      b. een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht met het doel deze te bewaren of te bewerken, en

      c. bij ministeriële regeling aan te wijzen personen of instanties die voertuigen in eigendom hebben, zonder deze
      zelf te hebben ingekocht, met het doel deze te verkopen.

      2 De aanvraag wordt ingediend bij de Dienst Wegverkeer.

      3 De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: '48'
    text: |-
      1 Bij het verlenen van de erkenning verstrekt de Dienst Wegverkeer aan het erkende bedrijf een of meer
      bedrijfsvoorraadpassen van een bij ministeriële regeling vastgesteld model, waarmee de registratie van voertuigen
      in bedrijfsvoorraad kan plaatsvinden alsmede formulieren die bestemd zijn om te dienen als vrijwaringsbewijs en als
      bedrijfsvoorraad deel I B.

      2 Op aanvraag verstrekt de Dienst Wegverkeer aan een erkend bedrijf meerdere bedrijfsvoorraadpassen en formulieren
      als bedoeld in het eerste lid.

      3 Voor versleten of zoekgeraakte bedrijfsvoorraadpassen verstrekt de Dienst Wegverkeer op aanvraag aan het
      erkende bedrijf vervangende passen. Voor versleten bedrijfsvoorraadpassen geeft de Dienst Wegverkeer niet eerder
      vervangende passen af dan nadat de versleten passen zijn ingeleverd.

      4 De Dienst Wegverkeer kan verlangen dat de aanvrager van nieuwe en vervangende bedrijfsvoorraadpassen, bedoeld
      in het tweede en derde lid, de bij ministeriële regeling aangewezen bescheiden overlegt die verband houden met
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel48
  - number: '49'
    text: |-
      1 Indien dit bij de intrekking, wijziging of schorsing van de erkenning als bedoeld in
      [artikel 65 van de wet][ref1], is bepaald, levert degene aan wie de erkenning is dan wel was verleend alle aan hem
      verstrekte bedrijfsvoorraadpassen en formulieren onverwijld in bij de Dienst Wegverkeer.

      2 Indien degene aan wie de erkenning is dan wel was verleend niet voldoet aan het eerste lid, kunnen de
      bedrijfsvoorraadpassen en formulieren worden ingenomen door de daartoe bevoegde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '65'
  - number: '50'
    text: |-
      1 De aanvrager van een schorsing als bedoeld in [artikel 67 van de wet][ref1] legt ten behoeve van deze aanvraag
      bij de Dienst Wegverkeer het deel I B van het kentekenbewijs, het deel II alsmede een bij ministeriële regeling
      aangewezen legitimatiebewijs over.

      2 De Dienst Wegverkeer plaatst op het deel I B een bij ministeriële regeling vastgestelde aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
  - number: '51'
    text: |-
      1 Indien de schorsing eindigt ingevolge [artikel 68 van de wet][ref1], wordt bij de Dienst Wegverkeer, onder
      overlegging van deel I B van het kentekenbewijs, het deel II alsmede een bij ministeriële regeling aangewezen
      legitimatiebewijs, een nieuw deel I B aangevraagd.

      2 Indien het einde van de schorsing als bedoeld in het eerste lid, betrekking heeft op een driedelig
      kentekenbewijs dan wel een kentekenbewijs dat bestaat uit een voor 31 mei 2004 afgegeven deel I, een deel I
      B en een overschrijvingsbewijs, wordt, in afwijking van het eerste lid, bij de Dienst Wegverkeer een nieuw
      deel I B aangevraagd onder overlegging van het deel II of deel I B van het betrokken kentekenbewijs, het
      overschrijvingsbewijs en een bij ministeriële regeling aangewezen legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel68
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '68'
  - number: '52'
    text: |-
      Een schorsing eindigt niet door gebruik van de weg indien:

      a. het voertuig waarvan de geldigheid van het kentekenbewijs is geschorst een kenteken voert als bedoeld in
      [artikel 3][ref1], dat behoort bij een ingevolge [artikel 42][ref2] afgegeven handelaarskentekenbewijs dat voldoet
      aan [hoofdstuk 5][ref3] en waarvan gebruik wordt gemaakt overeenkomstig de in dat hoofdstuk bedoelde voorschriften,
      dan wel

      b. [artikel 23, eerste lid][ref4], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel23
