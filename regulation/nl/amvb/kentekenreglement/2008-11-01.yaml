        artikel: '37'
  - number: '4'
    text: |-
      1 Aan leden van het Koninklijk Huis en aan buitenlandse diplomaten kan een kenteken worden opgegeven, bevattende
      de lettergroep AA, onderscheidenlijk CD, en aan hen die behoren tot het Internationaal Gerechtshof dan wel tot
      een door Onze Minister van Buitenlandse Zaken aangewezen internationale organisatie een kenteken, bevattende de
      lettergroep CDJ.

      2 Kentekens, bevattende de lettergroep BN of GN en twee groepen van twee cijfers worden slechts opgegeven voor
      voertuigen:

      a. waarvoor overeenkomstig de voorschriften van de Minister van Financiën een vrijstelling van belasting is
      verleend, of

      b. waarvan de eigenaar of houder behoort tot het personeel van buitenlandse ambassades, consulaten en daarmee
      gelijkgestelde instellingen, voor zover daarvoor naar het oordeel van de Minister van Buitenlandse Zaken aanleiding
      is.

      3 Kentekens, bevattende de lettergroep GV en twee groepen van twee cijfers, worden slechts opgegeven voor
      motorrijtuigen met beperkte snelheid en landbouw- of bosbouwtrekkers, die in het grensverkeer worden gebezigd
      alsmede voor door deze categorieën voertuigen voortbewogen aanhangwagens.

      4 Kentekens, bevattende de lettergroep ZZ en twee groepen van twee cijfers worden slechts opgegeven voor voertuigen
      die zich in verband met hun constructie uitsluitend op de weg mogen bevinden met een ontheffing van de wegbeheerder
      dan wel van de Dienst Wegverkeer.

      5 Kentekens, bevattende twee groepen van drie letters en cijfers of een combinatie daarvan worden slechts opgegeven
      voor voertuigen, die naar het oordeel van de Dienst Wegverkeer technisch in goede staat zijn, en die:

      a. overeenkomstig de [artikelen 31][ref1], [32][ref2] of [33][ref3] voorgoed buiten Nederland worden gebracht, of

      b. niet in Nederland zijn geregistreerd en binnen of buiten Nederland worden gebracht.

      6 Kentekens, bevattende de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee cijfers
      worden slechts opgegeven voor voertuigen die ter verkrijging van een kentekenbewijs met één of twee lettergroepen
      naar en van de plaats van weging en onderzoek moeten worden gereden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel33
    url: https://wetten.overheid.nl/BWBR0006951/2008-11-01#Artikel4
