  - number: '8'
    text: |-
      De Dienst Wegverkeer bepaalt de wijze waarop:

      a. overheidsorganen als bedoeld in [artikel 41a, eerste lid, onderdeel a, van de wet][ref1] een melding als bedoeld
      in [artikel 43c, eerste lid, van de wet][ref2] doen;

      b. een authentiek gegeven als bedoeld in [artikel 41a, eerste lid, onderdeel c, van de wet][ref3] «in onderzoek»
      wordt geplaatst als bedoeld in [artikel 43c, derde lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43c
