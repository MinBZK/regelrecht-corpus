    text: |-
      1 De [artikelen 17][ref1] en [23 van het Reglement kentekenregistratie][ref2], zoals deze artikelen luidden vóór
      het tijdstip waarop zij op grond van [artikel 59][ref3] zijn ingetrokken, blijven van kracht ten aanzien van op
      basis van de Wegenverkeerswet afgegeven kentekenbewijzen die vóór bedoeld tijdstip met toepassing van genoemde
      [artikelen 17][ref4] en [23][ref5] ongeldig zijn verklaard en moeten worden ingeleverd, indien op eerderbedoeld
      tijdstip die inlevering nog niet heeft plaatsgevonden.

      2 Op basis van de Wegenverkeerswet afgegeven kentekenbewijzen die nog niet op grond van
      [artikel 54, eerste lid][ref6], zijn vervangen, worden voor de toepassing van de [artikelen 37][ref7] en [45][ref8]
      gelijkgesteld met kentekenbewijzen, afgegeven op basis van de wet.


