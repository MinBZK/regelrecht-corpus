      1 De aanvraag van een vervangend kentekenbewijs dan wel deel of bladzijde daarvan geschiedt bij de Dienst
      Wegverkeer door degene aan wie het kentekenbewijs, deel of bladzijde waarvoor een vervangend document wordt
      aangevraagd, is afgegeven.

      2 De Dienst Wegverkeer kan verlangen dat bij de aanvraag van een of meer vervangende delen, of bladzijden daarvan,
      van een kentekenbewijs, een of meer van de overige delen, of bladzijden daarvan, van het kentekenbewijs worden
      ingeleverd alsmede dat een bij ministeriële regeling aangewezen legitimatiebewijs wordt overgelegd.

      3 Indien een kentekenbewijs is afgegeven aan de houder van een voertuig en deze een vervangend kentekenbewijs dan
      wel deel of bladzijde daarvan aanvraagt, kan de Dienst Wegverkeer in door deze dienst te bepalen gevallen verlangen
      dat de eigenaar voor de afgifte van het vervangend kentekenbewijs dan wel deel of bladzijde daarvan, toestemming
      verleent. In deze gevallen kan de Dienst Wegverkeer bepalen dat het vervangende kentekenbewijs dan wel deel of
      bladzijde daarvan naar de eigenaar of een door deze aangewezen persoon wordt gezonden.

      4 De aanvraag bedoeld in het eerste lid heeft geen betrekking op een kentekenbewijs dan wel deel of bladzijde daarvan
      als bedoeld in [artikel 17, derde lid, tweede gedachtestreepje, en vierde lid, tweede gedachtestreepje][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
