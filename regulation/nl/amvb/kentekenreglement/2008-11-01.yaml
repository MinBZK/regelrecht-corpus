  - number: 25a
    text: |-
      1 Indien de aanvraag, bedoeld in [artikel 25, tweede lid][ref1], wordt gedaan met betrekking tot een
      voertuig in bedrijfsvoorraad van een erkend bedrijf dat gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel f][ref2], kan de aanvraag, gericht tot de Dienst Wegverkeer, bij dat bedrijf
      worden ingediend. In afwijking van [artikel 25, tweede en derde lid][ref3], is dit artikel van toepassing.

      2 Indien de aanvraag wordt gedaan door een natuurlijke persoon overlegt deze in persoon aan het erkende bedrijf
      ter legitimatie een rijbewijs, alsmede een verklaring waaruit duidelijk het verzoek tot tenaamstelling blijkt en
      het kenteken van het voertuig dat wordt overgedragen, en welke overigens voldoet aan bij ministeriële regeling als
      bedoeld in [artikel 50, vijfde lid, van de wet][ref4], gestelde voorschriften.

      3 Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in een
      daartoe bij de wet aangewezen register, machtigt deze het erkende bedrijf de aanvraag bij de Dienst Wegverkeer
      in te dienen. Degene die blijkens het register bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het
      erkende bedrijf:

      a. een kopie van zijn rijbewijs;

      b. een gewaarmerkt uittreksel, uit het in de aanhef bedoelde register;

      c. een ondertekende machtiging welke vermeldt:

      1°. naam en adres van de aanvrager,

      2°. het inschrijfnummer van het Handelsregister als bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref5],

      3°. naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt,

      4°. naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en

      5°. het kenteken van het voertuig waarop de aanvraag betrekking heeft.

      4 Het erkende bedrijf dient de aanvraag bij de Dienst Wegverkeer in en meldt de bij ministeriële regeling als
      bedoeld in [artikel 62, vierde lid, van de wet][ref6], voorgeschreven gegevens vermeld op deel I A en het deel
      II en het rijbewijsnummer. In geval van een aanvraag als bedoeld in het tweede lid meldt het bedrijf ook de
      geboortedatum van de aanvrager. In geval van een aanvraag als bedoeld in het derde lid meldt het bedrijf ook de
      vestigingsdatum, vermeld op het uittreksel, bedoeld in het derde lid, onderdeel b, en de gegevens vermeld in de
      machtiging.

      5 De Dienst Wegverkeer geeft, indien aan de verplichtingen in het eerste tot en met vierde lid is voldaan, een deel
      I B af. Het erkende bedrijf verstrekt het deel I B tezamen met het deel I A en het deel II zo spoedig mogelijk aan
      de aanvrager.

      6 De Dienst Wegverkeer houdt de beslissing op de aanvraag aan, indien daartoe naar het oordeel van deze dienst
      aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel25
