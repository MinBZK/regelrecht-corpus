      1 In afwijking van de [artikelen 26, tweede lid][ref1], en [27, derde lid][ref2], is, in geval van overlijden
      van degene aan wie een tweedelig kentekenbewijs is afgegeven, degene die als erfgenaam eigenaar of houder van het
      voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is geworden bij de Dienst Wegverkeer
      om afgifte van een nieuw deel I B te verzoeken onder overlegging van het deel I B of het bedrijfsvoorraad deel I B,
      het deel II en een bij ministeriële regeling aangewezen legitimatiebewijs.

      2 De Dienst Wegverkeer geeft aan degene die aan de verplichting van het eerste lid heeft voldaan, zowel een
      vrijwaringsbewijs als een nieuw deel I B af.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
