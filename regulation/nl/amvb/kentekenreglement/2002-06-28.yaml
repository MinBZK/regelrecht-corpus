        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '23'
        hoofdstuk: '4'
  - number: '57.2'
    text: |-
      Op basis van de Wegenverkeerswet afgegeven kentekenbewijzen die nog niet op grond van
      [artikel 54, eerste lid][ref1], zijn vervangen, worden voor de toepassing van de [artikelen 37][ref2] en [45][ref3]
      gelijkgesteld met kentekenbewijzen, afgegeven op basis van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '54'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '37'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '45'
        hoofdstuk: '5'
  - number: '58'
    text: |-
      Voor de toepassing van dit besluit wordt een op basis van het [Reglement kentekenregistratie][ref1] afgegeven kopie
      deel III gelijkgesteld met een overschrijvingsbewijs tot het tijdstip dat het kopie deel III is vervangen door een
      zodanig bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002938
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002938
  - number: '59'
    text: |-
      Het [Reglement kentekenregistratie][ref1] wordt ingetrokken met ingang van een bij koninklijk besluit te bepalen
      tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002938
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002938
  - number: '60'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel60
  - number: '61'
    text: 'Dit besluit kan worden aangehaald als: Kentekenreglement.'
