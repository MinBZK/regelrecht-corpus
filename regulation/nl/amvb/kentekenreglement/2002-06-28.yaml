        artikel: '1'
        hoofdstuk: '1'
      - id: ref6
        bwb_id: BWBR0006951
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.1'
    text: |-
      De opgave van een kenteken geschiedt door afgifte van een kentekenbewijs dan wel door afgifte van een deel II of
      een bedrijfsvoorraad deel II van een kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel2
  - number: '2.2'
    text: Het kenteken bestaat uit een combinatie van letters en cijfers dan wel een combinatie van één letter en cijfers.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel2
  - number: '3'
    text: |-
      Aan een erkend bedrijf of aan een natuurlijke persoon of rechtspersoon als bedoeld in
      [artikel 42, eerste lid, onderdeel ][ref1], kan voor de in [artikel 37, derde lid][ref2], van de wet bedoelde
      voertuigen een kenteken worden opgegeven bevattende de lettergroep HA, HF of FH en twee groepen van twee cijfers,
      mits wordt voldaan aan [hoofdstuk 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '37'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        hoofdstuk: '5'
  - number: '4.1'
    text: |-
      Aan leden van het Koninklijk Huis en aan buitenlandse diplomaten kan een kenteken worden opgegeven, bevattende
      de lettergroep AA, onderscheidenlijk CD, en aan hen die behoren tot het Internationaal Gerechtshof dan wel tot
      een door Onze Minister van Buitenlandse Zaken aangewezen internationale organisatie een kenteken, bevattende de
      lettergroep CDJ.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.2'
    text: |-
      Kentekens, bevattende de lettergroep BN of GN en twee groepen van twee cijfers worden slechts opgegeven voor
      motorrijtuigen:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: 4.2.a
    text: |-
      waarvoor overeenkomstig de voorschriften van de Minister van Financiën een vrijstelling van belasting is verleend,
      of
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: 4.2.b
    text: |-
      waarvan de eigenaar of houder behoort tot het personeel van buitenlandse ambassades, consulaten en daarmee
      gelijkgestelde instellingen, voor zover daarvoor naar het oordeel van de Minister van Buitenlandse Zaken aanleiding
      is.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.3'
    text: |-
      Kentekens, bevattende de lettergroep GV en twee groepen van twee cijfers worden slechts opgegeven voor
      motorrijtuigen, met uitzondering van bromfietsen, die in het grensverkeer voor landbouwdoeleinden worden gebezigd
      en waarvoor in Nederland geen kenteken is vereist.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.4'
    text: |-
      Kentekens, bevattende de lettergroep HH en twee groepen van twee cijfers worden slechts opgegeven voor bromfietsen,
      die deelnemen aan het verkeer in landen waar voor deze voertuigen een kenteken is vereist.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.5'
    text: |-
      Kentekens, bevattende de lettergroep ZZ en twee groepen van twee cijfers worden slechts opgegeven voor voertuigen
      die zich in verband met hun constructie uitsluitend op de weg mogen bevinden met een ontheffing van de wegbeheerder
      dan wel van de Dienst Wegverkeer .
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.6'
    text: |-
      Kentekens, bevattende twee groepen van drie letters en cijfers of een combinatie daarvan worden slechts opgegeven
      voor voertuigen die overeenkomstig de [artikelen 31][ref1], [32][ref2] of [33][ref3] voorgoed buiten Nederland
      worden gebracht, mits het voertuig naar het oordeel van de Dienst Wegverkeer technisch in goede staat is.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel33
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '31'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '32'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '33'
        hoofdstuk: '4'
  - number: '4.7'
    text: |-
      Kentekens, bevattende de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee cijfers worden
      slechts opgegeven voor voertuigen die ter verkrijging van een kentekenbewijs met één of twee lettergroepen naar en
      van de plaats van weging en onderzoek moeten worden gereden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '4.8'
    text: |-
      Kentekens, bevattende de enkele letter Z en twee groepen van twee cijfers worden slechts opgegeven voor voertuigen
      die binnen of buiten Nederland worden gebracht.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel4
  - number: '5.1'
    text: Het kenteken wordt aangebracht op een plaat die behoort tot een door de Dienst Wegverkeer goedgekeurde soort.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel5
  - number: '5.2'
    text: Het eerste lid geldt niet in bij ministeriële regeling vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde plaat en de onderdelen daarvan zijn in bij ministeriële regeling vast te stellen
      gevallen voorzien van bij die regeling vast te stellen merken.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel5
  - number: '6.1'
    text: 'Het kentekenregister bevat uitsluitend de volgende categorieën gegevens:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.a
    text: |-
      de naam, de voornaam of, in geval van meer voornamen, de eerste voornaam en de beginletters van de overige
      voornamen, de geboortedatum, de geboorteplaats, het geboorteland, het geslacht en het adres van degene aan wie het
      kenteken is dan wel was opgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.b
    text: |-
      de naam, het adres en het inschrijvingsnummer bij de Kamer van Koophandel van de rechtspersoon waaraan het kenteken
      is dan wel was opgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.c
    text: |-
      de naam, de voornaam of, in geval van meer voornamen, de eerste voornaam en de beginletters van de overige
      voornamen, de geboortedatum, de geboorteplaats, het geboorteland, het geslacht en het adres van degene die bij de
      aanvraag van een kentekenbewijs als gemachtigde van een rechtspersoon is opgetreden;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.d
    text: |-
      de naam en het adres van degene die een voertuig waarvoor nog geen kenteken is opgegeven, op Nederlands grondgebied
      heeft gebracht of in Nederland heeft vervaardigd;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.e
    text: |-
      de naam, het adres en de gegevens omtrent het legitimatiebewijs van degene die een voertuig voorgoed buiten
      Nederland brengt;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.f
    text: gegevens omtrent bij de aanvraag van een kentekenbewijs overgelegde legitimatiebewijzen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.g
    text: gegevens omtrent de afgifte, de invordering alsmede de ongeldigverklaring van het kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.h
    text: |-
      gegevens omtrent de erkenning bedrijfsvoorraad, bedoeld in [hoofdstuk IV, paragraaf 5 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        paragraaf: '5'
  - number: 6.1.i
    text: |-
      gegevens omtrent de schorsing, bedoeld in [hoofdstuk IV, paragraaf 6 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        paragraaf: '6'
  - number: 6.1.j
    text: |-
      gegevens omtrent de verplichting tot periodieke keuring, bedoeld in [hoofdstuk V van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: V
  - number: 6.1.k
    text: |-
      gegevens ten behoeve van de heffing van de motorrijtuigenbelasting, bedoeld in
      de [Wet op de motorrijtuigenbelasting 1994][ref1] en de belasting, bedoeld in de
      [Wet op de belasting van personenauto’s en motorrijwielen 1992][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0005806
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0005806
  - number: 6.1.l
    text: |-
      gegevens omtrent voertuigen waarvoor een kenteken is dan wel was opgegeven alsmede voertuigen die op Nederlands
      grondgebied zijn gebracht of in Nederland zijn vervaardigd, waarvoor nog geen kenteken is opgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.m
    text: |-
      gegevens omtrent het bepaalde in andere wettelijke regelingen ten aanzien van voertuigen dan de wet en de in
      onderdeel *k* bedoelde wettelijke regelingen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.n
    text: gegevens omtrent in het buitenland geregistreerde voertuigen waarvoor de opgave van een kenteken wordt verzocht;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.o
    text: gegevens in verband met het verstrekken en gebruiken van gegevens uit het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.p
    text: gegevens van administratieve aard, verband houdende met de tenaamstelling van kentekens;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.q
    text: gegevens omtrent de vermissing van voertuigen en de aangifte van diefstal of verduistering van voertuigen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.r
    text: |-
      het sociaal-fiscaal nummer, het GBA-nummer en het door de houder van het kentekenregister toegekende
      persoonsidentificatienummer;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.s
    text: het gegeven dat degene aan wie een kenteken is opgegeven, is overleden, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: 6.1.t
    text: |-
      het gegeven dat ten aanzien van een voertuig waarvoor een kenteken is opgegeven, niet is
      voldaan aan de verplichting tot het betalen van motorrijtuigenbelasting als bedoeld in de
      [Wet op de motorrijtuigenbelasting 1994][ref1], of de verplichtingen inzake opgelegde administratieve sancties als
      bedoeld in de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006324
      [ref2]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006324
      - id: ref2
        bwb_id: BWBR0004581
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden, voor zover zij verband houden met een tenaamstelling, maximaal negen
      jaar na het verval van de tenaamstelling in het kentekenregister bewaard. De overige gegevens worden gedurende een
      door de Dienst Wegverkeer vastgestelde periode bewaard.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel6
  - number: '7'
    text: De dagelijkse leiding van het register berust bij de houder van het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel7
  - number: '8'
    text: |-
      De in [artikel 43, eerste lid, van de wet][ref1] bedoelde autoriteiten doen mededeling aan de houder van het
      kentekenregister van de hun in de uitoefening van hun functie ter kennis gekomen feiten, ingeval deze feiten
      aanleiding kunnen zijn om tot wijziging of aanvulling van de in het kentekenregister opgenomen gegevens over te
      gaan dan wel anderszins van belang kunnen zijn voor de juistheid van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
  - number: '9'
    text: |-
      Voor de verstrekking van gegevens op grond van [artikel 44 van de wet][ref1] worden belanghebbenden onderscheiden
      in:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel44
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '44'
  - number: 9.a
    text: particulieren,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel9
  - number: 9.b
    text: |-
      door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering
      van een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk dan wel, in geval van verstrekking
      van gegevens omtrent de verplichtingen, bedoeld in [artikel 19a, eerste lid, onderdeel a][ref1], respectievelijk
      onderdeel b, door Onze Minister en Onze Minister van Financiën, respectievelijk Onze Minister en Onze Minister van
      Justitie, gezamenlijk aangewezen beroepsbeoefenaren of categorieën van beroepsbeoefenaren,


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel19a
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 19a
        hoofdstuk: '4'
  - number: 9.c
    text: |-
      personen of instanties met een publiekrechtelijke taak, niet zijnde autoriteiten als bedoeld in
      [artikel 43, eerste lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel43
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '43'
  - number: 9.d
    text: |-
      door Onze Minister of, in geval van verstrekking van gegevens omtrent de aangifte van diefstal of verduistering van
      een voertuig, door Onze Minister en Onze Minister van Justitie gezamenlijk aangewezen organisaties die de belangen
      van de automobielbranche behartigen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel9
  - number: '10.1'
    text: |-
      De aanvraag tot het verstrekken van gegevens wordt schriftelijk ingediend bij de houder van het kentekenregister
      onder opgave van de naam en het adres van de aanvrager alsmede de redenen van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel10
  - number: '10.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt niet in behandeling genomen dan nadat het door de Dienst Wegverkeer
      vastgestelde tarief is voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel10
  - number: '10.3'
    text: |-
      Indien de aanvrager persoonlijk bij de houder van het kentekenregister verschijnt teneinde een aanvraag tot het
      verstrekken van gegevens in te dienen, legitimeert deze zich ten genoege van de houder.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel10
  - number: '10.4'
    text: |-
      Het eerste en derde lid zijn niet van toepassing indien de aanvraag wordt ingediend door belanghebbenden als
      bedoeld in [artikel 9, onderdelen b, c of d][ref1], mits overeenkomstig het door de Dienst Wegverkeer bepaalde,
      is vastgesteld dat de aanvrager tot één van de genoemde categorieën behoort en voldoende zekerheid is verkregen
      omtrent diens identiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.1'
    text: |-
      Nadat een belanghebbende als bedoeld in [artikel 9, onderdeel a][ref1], een verzoek om verstrekking van
      persoonsgegevens als bedoeld in artikel 1 van de Wet persoonsregistraties heeft ingediend, vraagt de houder van
      het kentekenregister schriftelijk toestemming voor de verstrekking van deze gegevens aan degene op wie de gegevens
      betrekking hebben. De houder geeft daarbij aan voor welke doeleinden de verstrekking is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Het vragen van toestemming blijft achterwege indien uit het kentekenregister blijkt dat degene op wie
      de gegevens betrekking hebben zijn toestemming aan elke verstrekking aan belanghebbenden als bedoeld in
      [artikel 9, onderdeel a][ref1], heeft onthouden, dan wel indien het voertuig waarop de aanvraag betrekking heeft,
      blijkens door de Dienst Wegverkeer aangewezen bescheiden is betrokken bij een verkeersongeval waarbij aan de
      aanvrager schade is toegebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      Aan belanghebbenden als bedoeld in [artikel 9, onderdeel a][ref1], worden persoonsgegevens niet verstrekt indien
      degene op wie deze gegevens betrekking hebben zijn toestemming daaraan onthoudt, dan wel zijn toestemming aan elke
      verstrekking aan particulieren heeft onthouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '11.4'
    text: |-
      In afwijking van het derde lid worden aan belanghebbenden als bedoeld in [artikel 9, onderdeel a][ref1], de
      gevraagde gegevens zonder toestemming van degene op wie de gegevens betrekking hebben verstrekt, indien het
      voertuig waarop de aanvraag betrekking heeft, blijkens door de Dienst Wegverkeer aangewezen bescheiden, is
      betrokken bij een verkeersongeval waarbij aan de aanvrager schade is toegebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '12'
    text: |-
      Aan belanghebbenden als bedoeld in [artikel 9, onderdeel b][ref1], worden de gevraagde gegevens verstrekt,
      voor zover zij deze gegevens beroepshalve nodig hebben voor het realiseren van rechten en plichten met
      betrekking tot het desbetreffende voertuig die voor de aanvrager of diens cliënt bestaan of kunnen ontstaan,
      voortvloeiend uit wettelijk voorschrift of uit overeenkomst, een en ander voor zover bij de aanwijzing, bedoeld in
      [artikel 9, onderdeel b][ref2], is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '13'
    text: |-
      Aan belanghebbenden als bedoeld in [artikel 9, onderdeel c][ref1], worden de gevraagde gegevens verstrekt, voor
      zover zij deze gegevens behoeven voor de uitvoering van hun taak en de persoonlijke levenssfeer van degene op wie
      de gegevens betrekking hebben daardoor niet onevenredig wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '14.1'
    text: |-
      Aan belanghebbenden als bedoeld in [artikel 9, onderdeel ][ref1], worden de gevraagde gegevens verstrekt, voor
      zover zij deze gegevens behoeven voor:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: 14.1.a
    text: het verrichten van activiteiten die verband houden met een goede uitvoering van de wet,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel14
  - number: 14.1.b
    text: wetenschappelijk onderzoek en statistiek, dan wel
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel14
  - number: 14.1.c
    text: |-
      voertuiginformatiesystemen ten behoeve van de automobielbranche, een en ander voor zover bij de aanwijzing, bedoeld
      in [artikel 9, onderdeel ][ref1], is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Aan de in het eerste lid bedoelde belanghebbenden worden uitsluitend gegevens verstrekt die de situatie weergeven
      op het moment van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel14
  - number: '15.1'
    text: |-
      Belanghebbenden als bedoeld in [artikel 9, onderdelen ][ref1], mogen de aan hen verstrekte gegevens uitsluitend
      gebruiken voor de doeleinden waarvoor zij zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '15.2'
    text: |-
      Belanghebbenden als bedoeld in [artikel 9, onderdeel ][ref1], mogen de aan hen verstrekte gegevens gebruiken voor
      de doeleinden waarvoor zij zijn verstrekt. Daarnaast mogen zij de aan hen verstrekte gegevens, met uitzondering van
      die omtrent de aangifte van diefstal of verduistering van een voertuig, gebruiken voor bij ministeriële regeling
      aangewezen doeleinden, indien degene op wie de gegevens betrekking hebben tegen een dergelijk gebruik geen bezwaar
      heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      Op verzoek van degene van wie gegevens in het kentekenregister zijn opgenomen, wordt in het kentekenregister
      geregistreerd dat:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel16
  - number: 16.a
    text: |-
      hij zijn toestemming onthoudt aan elke verstrekking van op hem betrekking hebbende gegevens aan belanghebbenden als
      bedoeld in [artikel 9, onderdeel a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
  - number: 16.b
    text: |-
      op hem betrekking hebbende gegevens door belanghebbenden als bedoeld in [artikel 9, onderdeel d][ref1], niet
      gebruikt worden voor de in [artikel 15, tweede lid][ref2], bedoelde, bij ministeriële regeling aangewezen,
      doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel15
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '9'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      Een driedelig kentekenbewijs bestaat uit een deel I, [een deel II][ref1] en een overschrijvingsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      Een driedelig kentekenbewijs, voor een voertuig in bedrijfsvoorraad afgegeven aan een erkend bedrijf, bestaat uit
      [een deel I][ref1], een bedrijfsvoorraad [deel II][ref2] en een overschrijvingsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '17.3'
    text: |-
      Een kentekenbewijs, bevattende de lettergroep AA, CD, CDJ dan wel de lettergroep FH, HA of HF en twee groepen van
      twee cijfers bestaat uit [een deel I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '17.4'
    text: |-
      Een kentekenbewijs, bevattende de lettergroep HH of GV en twee groepen van twee cijfers dan wel de enkele
      [letter A][ref1], [E][ref2], [H][ref3], [K][ref4], [L][ref5], [N][ref6], [P][ref7], [S][ref8], [T][ref9],
      V, W, X of Z en twee groepen van twee cijfers alsmede een kentekenbewijs, bevattende een kenteken als bedoeld in
      [artikel 4, zesde lid][ref10], bestaat uit [een deel I][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref9]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref10]: https://wetten.overheid.nl/BWBR0006951#Artikel4
      [ref11]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
      - id: ref10
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
      - id: ref11
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '17.5'
    text: |-
      Een kentekenbewijs, bevattende de lettergroep BN of GN en twee groepen van twee cijfers, bestaat uit
      [een deel I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '17.6'
    text: |-
      Een kentekenbewijs dat wordt afgegeven indien met betrekking tot het voertuig bij een in [artikel 22][ref1] of 26
      van de wet bedoelde keuring niet kan worden vastgesteld dan wel slechts op termijn kan worden vastgesteld of dat
      voertuig al dan niet voldoet aan de voor toelating tot het verkeer op de weg vastgestelde eisen en afgifte naar het
      oordeel van de Dienst Wegverkeer verantwoord is, bestaat uit een deel I.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel22
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '22'
        hoofdstuk: '4'
  - number: '17.7'
    text: |-
      Aan deel I van een kentekenbewijs kan bij de afgifte daarvan een bijlage worden toegevoegd, bevattende gegevens met
      betrekking tot het voertuig; deze bijlage maakt deel uit van het deel I.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel17
  - number: '18.1'
    text: |-
      Het ingevolge [artikel 6.16, eerste lid, van het Voertuigreglement][ref1] afgegeven ontvangstbewijs treedt voor het
      deel I van het kentekenbewijs in de plaats zolang geen nieuw deel I is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6'
  - number: '18.2'
    text: |-
      Het ingevolge [artikel 34, vierde lid][ref1], 38, tweede lid, of 39, derde lid, afgegeven ontvangstbewijs treedt
      voor de toepassing van de artikelen 26, 27 en 31 tot en met 33 in de plaats van het deel I van het kentekenbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel34
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '34'
        hoofdstuk: '4'
  - number: '19.1'
    text: |-
      Het in [artikel 48, eerste lid][ref1], van de wet bedoelde vereiste dat een natuurlijke persoon of een
      rechtspersoon die een kentekenbewijs aanvraagt, in Nederland woonachtig, respectievelijk gevestigd moet zijn, is
      niet van toepassing op kentekenbewijzen, bevattende een kenteken als bedoeld in [artikel 4][ref2], eerste tot en
      met vierde en zesde tot en met achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '48'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Het in [artikel 50, eerste lid][ref1], van de wet bedoelde vereiste, dat de aanvrager van een kentekenbewijs
      persoonlijk dient te verschijnen bij een bij ministeriële regeling aan te wijzen instantie, geldt niet voor de
      aanvraag van kentekenbewijzen, bevattende een kenteken als bedoeld in [artikel 4][ref2], eerste tot en met vierde
      en zesde tot en met achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '50'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 19a.1
    text: |-
      De afgifte van een kentekenbewijs wordt geweigerd indien uit het kentekenregister blijkt dat de aanvrager ten
      aanzien van een of meer voertuigen waarvan het kenteken aan hem is dan wel was opgegeven, niet voldoet aan:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19a
  - number: 19a.1.a
    text: |-
      de verplichting tot het betalen van motorrijtuigenbelasting als bedoeld in de
      [Wet op de motorrijtuigenbelasting 1994][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0006324
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0006324
  - number: 19a.1.b
    text: |-
      de verplichtingen inzake opgelegde administratieve sancties als bedoeld in de
      [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 19a.2
    text: |-
      De in het eerste lid bedoelde weigering vindt slechts plaats indien onherroepelijk vaststaat dat de aanvrager
      tenminste vijf maal niet aan een of meer van de in dat lid bedoelde verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel19a
  - number: '20.1'
    text: |-
      Onverminderd het derde tot en met zevende lid, is een kentekenbewijs geldig totdat het op grond van het bepaalde in
      [artikel 57][ref1] van de wet zijn geldigheid heeft verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel57
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '57'
        hoofdstuk: '9'
  - number: '20.3'
    text: |-
      Een kentekenbewijs, bevattende de lettergroep BN of GN en twee groepen van twee cijfers heeft een geldigheidsduur
      van ten hoogste twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
  - number: '20.4'
    text: |-
      Een kentekenbewijs als bedoeld in [artikel 17, zesde lid][ref1], heeft een geldigheidsduur van ten hoogste drie
      maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel17
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '17'
        hoofdstuk: '4'
  - number: '20.5'
    text: |-
      Een kentekenbewijs, bevattende een kenteken als bedoeld in [artikel 4, zesde lid][ref1], heeft een geldigheidsduur
      van twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: '20.6'
    text: |-
      Een kentekenbewijs, bevattende de enkele [letter A][ref1], [E][ref2], [H][ref3], [K][ref4], [L][ref5],
      [N][ref6], [P][ref7], [S][ref8], [T][ref9], V, W of X en twee groepen van twee cijfers heeft een
      geldigheidsduur van één dag.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0006951#Artikel20
      [ref9]: https://wetten.overheid.nl/BWBR0006951#Artikel20
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
  - number: '20.7'
    text: |-
      Een kentekenbewijs, bevattende de enkele [letter Z][ref1] en twee groepen van twee cijfers heeft een
      geldigheidsduur van ten hoogste een week.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel20
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.1'
    text: |-
      De verplichting tot het ter inzage afgeven van het kentekenbewijs als bedoeld in artikel 160 van de wet
      heeft betrekking op alle delen van het voor het voertuig afgegeven kentekenbewijs, met uitzondering van het
      overschrijvingsbewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel22
  - number: '22.2'
    text: |-
      Indien de in artikel 160 van de wet bedoelde vordering betrekking heeft op een kentekenbewijs dat is afgegeven voor
      een aanhangwagen die overeenkomstig [artikel 3.7.3, eerste lid, van het Voertuigreglement][ref1] is voorzien van
      een constructieplaat, kan aan de vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '3'
  - number: '23.1'
    text: |-
      Gedurende de tijd dat de geldigheid van het kentekenbewijs is geschorst ingevolge [artikel 67 van de wet][ref1],
      mag:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '67'
  - number: 23.1.a
    text: |-
      op de dag waarop het voertuig waarvoor dat kentekenbewijs is afgegeven, naar aanleiding van de aanvraag van
      een keuringsrapport als bedoeld in [artikel 75 van de wet][ref1] dan wel naar aanleiding van een aanvraag van
      een keuring als bedoeld in [artikel 99][ref2] of [artikel 106 van de wet][ref3] aan een zodanige keuring wordt
      onderworpen, met dat voertuig via de kortste route naar en van de plaats van keuring worden gereden;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '106'
  - number: 23.1.b
    text: |-
      met een voertuig van 15 jaar of ouder waarvoor dat kentekenbewijs is afgegeven, op de weg worden gereden indien er
      naar het oordeel van Onze Minister van Financiën sprake is van een bijzondere gelegenheid en wordt voldaan aan de
      in het kader daarvan door die minister gestelde voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel23
  - number: '23.2'
    text: |-
      Wanneer het kentekenbewijs is ingevorderd overeenkomstig [artikel 60 van de wet][ref1], mag op de dag waarop het
      voertuig als gevolg van [artikel 39, vierde lid][ref2], aan de aldaar bedoelde ambtenaren moet worden getoond, met
      dat voertuig via de kortste route naar en van de plaats van onderzoek worden gereden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel39
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '39'
        hoofdstuk: '4'
  - number: '23.3'
    text: |-
      Wanneer het kentekenbewijs ongeldig is verklaard voor het rijden over de weg overeenkomstig [artikel 38][ref1],
      mag op de dag waarop het voertuig waarvoor dat kentekenbewijs is afgegeven naar aanleiding van een aanvraag van
      een keuring als bedoeld in [artikel 99][ref2] of [artikel 106 van de wet][ref3] aan een zodanige keuring wordt
      onderworpen, met dat voertuig via de kortste route naar en van de plaats van keuring worden gereden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel99
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel106
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '38'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '99'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '106'
  - number: '24'
    text: |-
      Een voertuig mag op de weg staan, wanneer het voor dat voertuig afgegeven kentekenbewijs ongeldig is
      verklaard voor het rijden over de weg overeenkomstig [artikel 38][ref1], dan wel is ingevorderd overeenkomstig
      [artikel 60 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '38'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '60'
  - number: '25.1'
    text: |-
      De eigenaar of houder van een voertuig waarvoor de eerste afgifte van een driedelig kentekenbewijs wordt gevraagd,
      stelt het voertuig voor een onderzoek ter beschikking bij de Dienst Wegverkeer en vraagt bij deze dienst onder
      overlegging van een bij ministeriële regeling aangewezen legitimatiebewijs, een kentekenbewijs aan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: '25.2'
    text: |-
      De eigenaar of houder van een voertuig waarvoor de eerste afgifte van een driedelig kentekenbewijs
      wordt gevraagd en waarvoor reeds een nog niet tenaamgesteld kentekenbewijs is afgegeven krachtens
      [artikel 46, tweede lid, onderdeel b][ref1], vraagt dit driedelig kentekenbewijs aan bij de Dienst Wegverkeer onder
      overlegging van het deel I, het overschrijvingsbewijs en het in het eerste lid bedoelde legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '25.3'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen in het eerste of tweede lid heeft voldaan, een
      kentekenbewijs, respectievelijk een deel II af.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: '25.4'
    text: |-
      Indien de aanvraag wordt gedaan door een erkend bedrijf dat geen gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel b][ref1], geeft de Dienst Wegverkeer in plaats van een deel II een formulier af
      met gegevens die verband houden met de opname in bedrijfsvoorraad.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '25.5'
    text: |-
      Ingeval een formulier als bedoeld in het vierde lid is afgegeven, is het erkende bedrijf verplicht een
      bedrijfsvoorraad deel II met de op dat formulier vermelde gegevens in te vullen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: '25.6'
    text: |-
      In afwijking van het derde en vierde lid houdt de Dienst Wegverkeer de beslissing op de aanvraag, bedoeld in het
      eerste en tweede lid, aan indien daartoe naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de
      aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: '25.7'
    text: |-
      Het eerste en het derde tot en met zesde lid zijn van overeenkomstige toepassing indien een driedelig
      kentekenbewijs wordt aangevraagd voor een voertuig waarvoor door de Dienst Wegverkeer reeds eerder een driedelig
      kentekenbewijs is afgegeven en blijkens het kentekenregister:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: 25.7.a
    text: dat voertuig voorgoed buiten gebruik is gesteld,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: 25.7.b
    text: dat voertuig voorgoed buiten Nederland is gebracht,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: 25.7.c
    text: dat voertuig definitief is bestemd voor gebruik buiten de weg, of
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: 25.7.d
    text: voor dat voertuig nadien een kentekenbewijs met een bijzonder kenteken is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25
  - number: 25a.1
    text: |-
      Indien de aanvraag, bedoeld in [artikel 25, tweede lid][ref1], wordt gedaan met betrekking tot een
      voertuig in bedrijfsvoorraad van een erkend bedrijf dat gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel f][ref2], kan de aanvraag, gericht tot de Dienst Wegverkeer, bij dat bedrijf
      worden ingediend. In afwijking van [artikel 25, tweede en derde lid][ref3], is dit artikel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel25
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '25'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '25'
        hoofdstuk: '4'
  - number: 25a.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijke persoon overlegt deze in persoon aan
      het erkende bedrijf ter legitimatie een rijbewijs als bedoeld in [artikel 107][ref1] of
      [artikel 108, eerste lid, onderdeel h, van de wet][ref2], voor zover de aldaar bedoelde registratie heeft
      plaatsgevonden, alsmede een verklaring waaruit duidelijk het verzoek tot tenaamstelling blijkt en het
      kenteken van het voertuig dat wordt overgedragen, en welke overigens voldoet aan bij ministeriële regeling als
      bedoeld in [artikel 50, vijfde lid, van de wet][ref3], gestelde voorschriften. Een rijbewijs als bedoeld in
      [artikel 108, eerste lid, onderdeel h, van de wet][ref4], wordt altijd overgelegd tezamen met een kopie van de
      mededeling van registratie, bedoeld in [artikel 13, eerste lid, van het Reglement rijbewijzen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel13
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '13'
  - number: 25a.3
    text: |-
      Indien de aanvraag wordt gedaan door een in Nederland gevestigde rechtspersoon, die is ingeschreven in een daartoe
      bij de wet aangewezen register, machtigt deze het erkende bedrijf de aanvraag bij de Dienst Wegverkeer in te
      dienen. Degene die blijkens het register bevoegd is de rechtspersoon te vertegenwoordigen verstrekt aan het erkende
      bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.a
    text: |-
      een kopie van zijn rijbewijs als bedoeld in[ artikel 107][ref1] of
      [artikel 108, eerste lid, onderdeel h, van de wet][ref2], voor zover de aldaar bedoelde registratie
      heeft plaatsgevonden, tezamen met een kopie van de mededeling van registratie, bedoeld in
      [artikel 13, eerste lid, van het Reglement rijbewijzen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel13
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '13'
  - number: 25a.3.b
    text: een gewaarmerkt uittreksel, uit het in de aanhef bedoelde register;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.c
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.c.1°
    text: naam en adres van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.c.2°
    text: |-
      het inschrijfnummer van het Handelsregister als bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: 25a.3.c.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.c.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.3.c.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.4
    text: |-
      Het erkende bedrijf dient de aanvraag bij de Dienst Wegverkeer in en meldt de bij ministeriële regeling
      als bedoeld in [artikel 62, vierde lid, van de wet][ref1], voorgeschreven gegevens vermeld op deel I en het
      overschrijvingsbewijs, het rijbewijsnummer en, indien van toepassing, het nummer van het bewijs van registratie,
      bedoeld in [artikel 108, eerste lid, onderdeel h, van de wet][ref2]. In geval van een aanvraag als bedoeld in het
      tweede lid meldt het bedrijf ook de geboortedatum van de aanvrager. In geval van een aanvraag als bedoeld in het
      derde lid meldt het bedrijf ook de vestigingsdatum, vermeld op het uittreksel, bedoeld in het derde lid, onderdeel
      b, en de gegevens vermeld in de machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel108
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '108'
  - number: 25a.5
    text: |-
      De Dienst Wegverkeer geeft, indien aan de verplichtingen in het eerste tot en met vierde lid is voldaan, een deel
      II af. Het erkende bedrijf verstrekt het deel II tezamen met het deel I en het overschrijvingsbewijs zo spoedig
      mogelijk aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: 25a.6
    text: |-
      De Dienst Wegverkeer houdt de beslissing op de aanvraag aan, indien daartoe naar het oordeel van deze dienst
      aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel25a
  - number: '26.1'
    text: |-
      Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden, is, ingeval hij ophoudt eigenaar of houder te zijn van het voertuig waarvoor dat
      kentekenbewijs is afgegeven, verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: 26.1.a
    text: |-
      het deel II en het overschrijvingsbewijs terstond over te dragen aan degene die eigenaar of houder van het voertuig
      is geworden;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: 26.1.b
    text: |-
      het deel I van het kentekenbewijs onder zich te houden, totdat hij het in het derde lid bedoelde vrijwaringsbewijs
      en het oude deel II heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden is verplicht binnen een week nadat hij het deel
      II en het overschrijvingsbewijs heeft ontvangen, bij de Dienst Wegverkeer om afgifte van een nieuw deel II te
      verzoeken onder overlegging van het deel II, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.3'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het tweede lid heeft voldaan, een
      vrijwaringsbewijs en een nieuw deel II af.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.4'
    text: |-
      Degene die het vrijwaringsbewijs heeft ontvangen, is verplicht dit terstond, te zamen met het oude deel II, te doen
      toekomen aan degene die het deel I, bedoeld in het eerste lid, onderdeel *b*, onder zich heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.5'
    text: |-
      Degene die het deel I, bedoeld in het eerste lid, onderdeel *b*, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan degene van wie hij het vrijwaringsbewijs en het oude deel II heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.6'
    text: |-
      In afwijking van het derde lid houdt de Dienst Wegverkeer de beslissing op het verzoek, bedoeld in het tweede lid,
      aan indien daartoe naar het oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '26.7'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing indien de eigenaar, respectievelijk de houder van een
      voertuig, aan wie een driedelig kentekenbewijs is afgegeven, met de houder, respectievelijk de eigenaar van het
      voertuig overeenkomt dat het kenteken aan deze houder, respectievelijk eigenaar wordt opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel26
  - number: '27.1'
    text: |-
      In geval van overdracht ten behoeve van een bedrijfsvoorraad, van een voertuig waarvoor een driedelig
      kentekenbewijs is afgegeven, zijn in afwijking van [artikel 26, het tweede tot en met negende lid][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.2'
    text: |-
      Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.2.a
    text: aan het erkende bedrijf terstond het deel II van het kentekenbewijs en het overschrijvingsbewijs over te dragen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.2.b
    text: |-
      het deel I van het kentekenbewijs onder zich te houden totdat hij het in het vijfde lid bedoelde vrijwaringsbewijs
      en het oude deel II heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.3'
    text: |-
      Het erkende bedrijf is verplicht binnen een week, nadat hij het deel II en het overschrijvingsbewijs heeft
      ontvangen, bij de Dienst Wegverkeer om opname in bedrijfsvoorraad te verzoeken onder overlegging van deel II, het
      overschrijvingsbewijs en de bedrijfsvoorraadpas.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.4'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichtingen van het derde lid heeft voldaan, een formulier af
      met gegevens die verband houden met de opname in bedrijfsvoorraad.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.5'
    text: 'Het erkende bedrijf is verplicht:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.5.a
    text: een vrijwaringsbewijs en een bedrijfsvoorraad deel II met de in het vierde lid bedoelde gegevens in te vullen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.5.b
    text: |-
      aan degene van wie hij het deel II en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs alsmede het
      oude deel II terstond ter hand te stellen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.5.c
    text: het bedrijfsvoorraad deel II onder zich te houden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.6'
    text: |-
      Degene die het deel I, bedoeld in het tweede lid, onderdeel *b*, onder zich heeft gehouden, is verplicht dit
      terstond af te geven aan het erkende bedrijf van wie hij het vrijwaringsbewijs en het oude deel II heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.7'
    text: |-
      De Dienst Wegverkeer houdt de beslissing op het verzoek, bedoeld in het derde lid, aan indien daartoe naar het
      oordeel van deze dienst aanleiding bestaat. In dat geval wendt de aanvrager zich tot de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.8'
    text: |-
      In afwijking van het derde en vijfde lid, is een erkend bedrijf, indien dit gebruik maakt van de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel a][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 27.8.a
    text: |-
      de overdracht van het voertuig ten behoeve van diens bedrijfsvoorraad terstond na de overdracht te melden aan de
      Dienst Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.8.b
    text: |-
      het vrijwaringsbewijs en het bedrijfsvoorraad deel II met de middels datacommunicatie ter beschikking gestelde
      gegevens die verband houden met de opname in bedrijfsvoorraad in te vullen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.8.c
    text: |-
      aan degene van wie hij het deel II en het overschrijvingsbewijs heeft ontvangen, het vrijwaringsbewijs en het oude
      deel II terstond ter hand te stellen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.8.d
    text: het bedrijfsvoorraad deel II onder zich te houden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '27.9'
    text: |-
      Het tweede en het zesde lid zijn niet van toepassing indien een of meer delen van het kentekenbewijs verloren
      zijn geraakt of teniet zijn gegaan en het erkende bedrijf bij de in het achtste lid, onderdeel *a*, bedoelde
      melding tevens meldt dat het voertuig voorgoed buiten gebruik wordt gesteld, mits degene aan wie het driedelig
      kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van het voertuig is geworden:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.9.a
    text: |-
      aan het erkende bedrijf terstond de niet verloren geraakte of teniet gegane delen van het kentekenbewijs
      overdraagt,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.9.b
    text: |-
      verklaart dat de niet aan het erkende bedrijf overgedragen delen van het kentekenbewijs verloren zijn geraakt of
      teniet zijn gegaan, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: 27.9.c
    text: bij het erkende bedrijf de bij ministeriële regeling aangewezen documenten overlegt.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel27
  - number: '28.1'
    text: |-
      Indien een voertuig waarvoor een driedelig kentekenbewijs is afgegeven, ophoudt te behoren tot de bedrijfsvoorraad
      van een erkend bedrijf, is [artikel 26][ref1] of, in geval van overdracht ten behoeve van een bedrijfsvoorraad,
      [artikel 27][ref2] van overeenkomstige toepassing, met dien verstande dat het bedrijfsvoorraad deel II in de plaats
      treedt van het gewone deel II.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: '28.2'
    text: |-
      Indien een voertuig ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf en dit bedrijf het voertuig
      tot eigen gebruik bestemt, vraagt het bedrijf binnen een week een nieuw deel II aan bij de Dienst Wegverkeer, onder
      overlegging van het bedrijfsvoorraad deel II, het overschrijvingsbewijs en een bij ministeriële regeling aangewezen
      legitimatiebewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28
  - number: '28.3'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het tweede lid heeft voldaan, zowel een
      vrijwaringsbewijs als een nieuw deel II af.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28
  - number: 28a.1
    text: |-
      In geval van overdracht van een voertuig dat ophoudt te behoren tot de bedrijfsvoorraad van een erkend bedrijf dat
      gebruik maakt van de bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel f][ref1], kan, in afwijking van
      [artikel 28][ref2], een aanvraag van een nieuw deel II, gericht aan de Dienst Wegverkeer, bij dat bedrijf worden
      ingediend. In afwijking van [artikel 28][ref3] is [dit artikel][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel28a
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '28'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '28'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006951
        artikel: 28a
        hoofdstuk: '4'
  - number: 28a.2
    text: |-
      Indien de aanvraag wordt gedaan door een natuurlijke persoon overlegt deze in persoon aan het erkende bedrijf
      een rijbewijs als bedoeld in [artikel 107][ref1] of [artikel 108, eerste lid, onderdeel h, van de wet][ref2],
      voor zover de aldaar bedoelde registratie heeft plaatsgevonden, alsmede een verklaring waaruit duidelijk het
      verzoek tot tenaamstelling blijkt en het kenteken van het voertuig dat wordt overgedragen, en welke overigens
      voldoet aan bij ministeriële regeling als bedoeld in [artikel 50, vijfde lid, van de wet][ref3], gestelde
      voorschriften. Een rijbewijs als bedoeld in [artikel in 108, eerste lid, onderdeel h, van de wet][ref4],
      wordt overgelegd tezamen met een kopie van de mededeling van registratie, bedoeld in
      [artikel 13, eerste lid, van het Reglement rijbewijzen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel13
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '13'
  - number: 28a.3
    text: |-
      Indien de aanvraag wordt ingediend door een in Nederland gevestigde rechtspersoon, die dient te zijn ingeschreven
      in een daartoe bij de wet aangewezen register, machtigt deze het erkende bedrijf de aanvraag bij de Dienst
      Wegverkeer in te dienen. Degene die blijkens het register bevoegd is de rechtspersoon te vertegenwoordigen
      verstrekt aan het erkende bedrijf:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.a
    text: |-
      een kopie van diens rijbewijs als bedoeld in [artikel 107][ref1] of
      [artikel 108, eerste lid, onderdeel h, van de wet][ref2], voor zover de aldaar bedoelde registratie
      heeft plaatsgevonden, tezamen met een kopie van de mededeling van registratie, bedoeld in
      [artikel 13, eerste lid, van het Reglement rijbewijzen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel13
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '13'
  - number: 28a.3.b
    text: een gewaarmerkt uittreksel uit het in de aanhef bedoelde register;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.c
    text: 'een ondertekende machtiging welke vermeldt:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.c.1°
    text: naam en adres van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.c.2°
    text: |-
      het inschrijfnummer van het Handelsregister als bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: 28a.3.c.3°
    text: naam en geboortedatum van degene die de rechtspersoon vertegenwoordigt,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.c.4°
    text: naam en adres van het erkende bedrijf waar de aanvraag wordt ingediend, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.3.c.5°
    text: het kenteken van het voertuig waarop de aanvraag betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: 28a.4
    text: |-
      Het erkende bedrijf meldt de bij ministeriële regeling als bedoeld in [artikel 62, vierde lid, van de wet][ref1],
      voorgeschreven gegevens vermeld op het overschrijvingsbewijs, op het uittreksel, bedoeld in het derde lid,
      onderdeel b, op het bedrijfsvoorraad [deel II][ref2], het rijbewijsnummer en, indien van toepassing, het nummer
      van het bewijs van registratie, bedoeld in [artikel 108, eerste lid, onderdeel h van de wet][ref3]. In geval van
      een aanvraag als bedoeld in het tweede lid meldt het bedrijf ook de geboortedatum van de aanvrager. In geval van
      een aanvraag als bedoeld in het derde lid meldt het bedrijf ook de vestigingsdatum en de gegevens vermeld in de
      machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel108
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: 28a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '108'
  - number: 28a.5
    text: |-
      De Dienst Wegverkeer geeft, indien aan de verplichtingen in het tweede tot en met vierde lid is voldaan, een nieuw
      deel II en een vrijwaringsbewijs af en verstrekt dit aan het erkende bedrijf. Het erkende bedrijf stelt het nieuwe
      deel II tezamen met het deel I en het overschrijvingsbewijs terstond in handen van de aanvrager, of doet deze, in
      geval van een aanvraag als bedoeld in het derde lid, zo spoedig mogelijk aan de aanvrager toekomen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel28a
  - number: '29.1'
    text: |-
      In afwijking van de [artikelen 26, tweede lid][ref1], en [27, derde lid][ref2], is, in geval van overlijden van
      degene aan wie een driedelig kentekenbewijs is afgegeven, degene die als erfgenaam eigenaar of houder van het
      voertuig is geworden, verplicht binnen vijf weken nadat hij eigenaar of houder is geworden bij de Dienst Wegverkeer
      om afgifte van een nieuw deel II te verzoeken onder overlegging van het deel II of het bedrijfsvoorraad deel II,
      het overschrijvingsbewijs en een bij ministeriële regeling aangewezen legitimatiebewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      De Dienst Wegverkeer geeft aan degene die aan de verplichting van het eerste lid heeft voldaan, zowel een
      vrijwaringsbewijs als een nieuw deel II af.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel29
  - number: '30.1'
    text: |-
      De Dienst Wegverkeer kan voor een voertuig een driedelig kentekenbewijs afgeven zonder dat aan de in
      [de artikelen 26 tot en met 29][ref1] bedoelde verplichtingen is voldaan, indien de aanvraag voor het
      kentekenbewijs wordt ingediend door een natuurlijke persoon of een rechtspersoon die verklaart eigenaar of houder
      van het voertuig te zijn en indien naar het oordeel van de Dienst Wegverkeer aannemelijk is gemaakt dat niet aan
      bedoelde verplichtingen kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '26'
        hoofdstuk: '4'
  - number: '30.2'
    text: |-
      De Dienst Wegverkeer kan in verband met het bepaalde in het eerste lid verlangen dat de aanvrager van het
      kentekenbewijs het voertuig toont, een bij ministeriële regeling aangewezen legitimatiebewijs overlegt en een of
      meer delen van het kentekenbewijs inlevert.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel30
  - number: '31.1'
    text: |-
      Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder
      van het voertuig is geworden, is, in geval van overdracht van een voertuig aan een in het buitenland woonachtige
      natuurlijke persoon of een in het buitenland gevestigde rechtspersoon, verplicht:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: 31.1.a
    text: |-
      het deel II en het overschrijvingsbewijs terstond over te dragen aan degene die eigenaar of houder van het voertuig
      is geworden;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: 31.1.b
    text: |-
      het deel I van het kentekenbewijs onder zich te houden, totdat hij het in het vierde lid bedoelde deel van de
      verklaring heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: '31.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht binnen een week nadat hij het deel II en
      het overschrijvingsbewijs heeft ontvangen bij de Dienst Wegverkeer het deel II en het overschrijvingsbewijs, een
      bij ministeriële regeling aangewezen legitimatiebewijs alsmede een ingevulde en ondertekende verklaring van een bij
      ministeriële regeling vastgesteld model in drievoud over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: '31.3'
    text: |-
      De Dienst Wegverkeer plaatst op het deel II een aantekening, vult de verklaring in en geeft het deel II, de
      verklaring in tweevoud alsmede het legitimatiebewijs terug aan degene die aan de in het tweede lid bedoelde
      verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: '31.4'
    text: |-
      Degene die de verklaring in tweevoud heeft ontvangen, is verplicht het daartoe bestemde deel van de verklaring
      terstond te doen toekomen aan degene die het deel I onder zich heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: '31.5'
    text: |-
      Degene die het deel I onder zich heeft gehouden, is verplicht dit terstond af te geven aan degene van wie hij het
      in het vierde lid bedoelde deel van de verklaring heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
  - number: '31.6'
    text: |-
      In geval van overdracht van een tot de bedrijfsvoorraad van een erkend bedrijf behorend voertuig waarvoor een
      driedelig kentekenbewijs is afgegeven aan een in het buitenland woonachtige natuurlijke persoon of een in het
      buitenland gevestigde rechtspersoon, zonder dat het erkende bedrijf gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel c][ref1], is het eerste tot en met vijfde lid van overeenkomstige toepassing,
      met dien verstande dat het bedrijfsvoorraad deel II in de plaats treedt van het deel II.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '32.1'
    text: |-
      In afwijking van [artikel 31][ref1], is, ingeval het erkende bedrijf gebruik maakt van de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel ][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '31'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '32.2'
    text: |-
      Degene die eigenaar of houder van het voertuig is geworden, is verplicht terstond bij het erkende bedrijf een bij
      ministeriële regeling aangewezen legitimatiebewijs alsmede een ingevulde en ondertekende verklaring van een bij
      ministeriële regeling vastgesteld model in drievoud over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: '32.3'
    text: 'Het erkende bedrijf is verplicht overeenkomstig het krachtens artikel 62, derde lid, van de wet bepaalde:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: 32.3.a
    text: het legitimatiebewijs te controleren;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: 32.3.b
    text: |-
      de overdracht van het voertuig aan de in het buitenland woonachtige persoon of de in het buitenland gevestigde
      rechtspersoon terstond te melden aan de Dienst Wegverkeer;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: 32.3.c
    text: op het kentekenbewijs een aantekening te plaatsen alsmede de verklaring in drievoud in te vullen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: 32.3.d
    text: |-
      aan degene aan wie het voertuig wordt overgedragen het deel I en het bedrijfsvoorraad deel II van het
      kentekenbewijs te zamen met de verklaring in tweevoud ter stond ter hand te stellen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: 32.3.e
    text: het overschrijvingsbewijs en het daartoe bestemde deel van de verklaring onder zich te houden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel32
  - number: '33.1'
    text: |-
      Degene aan wie een driedelig kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van
      het voertuig is geworden, is, ingeval hij het voertuig voorgoed buiten Nederland brengt, verplicht het deel II,
      een bij ministeriële regeling aangewezen legitimatiebewijs, een ingevulde en ondertekende verklaring in drievoud
      van een bij ministeriële regeling vastgesteld model alsmede, voor zover bij ministeriële regeling bepaald, het
      overschrijvingsbewijs bij de Dienst Wegverkeer over te leggen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel33
  - number: '33.2'
    text: |-
      De Dienst Wegverkeer plaatst op het deel II een aantekening, vult de verklaring in en geeft het deel II, de
      verklaring in tweevoud alsmede het legitimatiebewijs terug aan degene die aan de in het eerste lid bedoelde
      verplichtingen heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel33
  - number: '33.3'
    text: |-
      Ingeval een erkend bedrijf een tot zijn bedrijfsvoorraad behorend voertuig voorgoed buiten Nederland brengt, is
      het eerste en tweede lid van overeenkomstige toepassing, met dien verstande dat het bedrijfsvoorraad deel II in de
      plaats treedt van het deel II.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel33
  - number: '33.4'
    text: |-
      In afwijking van het eerste tot en met derde lid, is, ingeval het erkende bedrijf gebruik maakt van de bevoegdheid,
      bedoeld in [artikel 46, tweede lid, onderdeel ][ref1], het erkende bedrijf verplicht het voorgoed buiten Nederland
      brengen van het voertuig te melden overeenkomstig het krachtens artikel 62, derde lid, van de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '34.1'
    text: |-
      Indien het voertuig waarvoor het kentekenbewijs is afgegeven niet meer overeenstemt met de gegevens op het deel I,
      vraagt degene aan wie het kentekenbewijs is afgegeven of degene die na diens overlijden eigenaar of houder van het
      voertuig is geworden, onverwijld bij de Dienst Wegverkeer onder overlegging van het deel I een nieuw deel I aan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel34
  - number: '34.2'
    text: |-
      Indien het kentekenbewijs is ingevorderd ingevolge [artikel 60][ref1] van de wet, geeft de Dienst Wegverkeer op
      verzoek een nieuw deel I af. Degene aan wie het kentekenbewijs is afgegeven of degene die na diens overlijden
      eigenaar of houder van het voertuig is geworden, dient hiertoe bij de Dienst Wegverkeer onder overlegging van het
      bij de invordering afgegeven ontvangstbewijs een aanvraag in. De Dienst Wegverkeer geeft niet eerder een nieuw deel
      I af dan nadat het voertuig is goedgekeurd overeenkomstig artikel 105 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: '34.3'
    text: |-
      De Dienst Wegverkeer geeft in geval van wijziging in de constructie als bedoeld in artikel 98 van de wet een nieuw
      deel I af nadat de wijziging is goedgekeurd ingevolge artikel 98 van de wet. Deze dienst kan daarbij verlangen dat
      het in [artikel 6.16, eerste lid, van het Voertuigreglement][ref1] bedoelde ontvangstbewijs wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel6
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '6'
  - number: '34.4'
    text: |-
      De Dienst Wegverkeer geeft voor een deel I dat wordt ingeleverd bij een door Onze Minister aangewezen
      instantie in verband met een wijziging aan het voertuig die niet behoeft te worden goedgekeurd ingevolge
      [artikel 98 van de wet][ref1], een ontvangstbewijs af.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel98
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '98'
  - number: '35.1'
    text: |-
      Als deel van een kentekenbewijs waarvan het tarief mede een bij ministeriële regeling vastgesteld bedrag ter
      dekking van de in artikel 4, van de wet, bedoelde kosten omvat, wordt aangewezen het deel I van het kentekenbewijs.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel35
  - number: '35.2'
    text: |-
      Als deel van een kentekenbewijs waarvan het tarief mede een bij ministeriële regeling vastgesteld
      bedrag ter dekking van de in artikel V, tweede lid, van de wet van 29 maart 1996 tot wijziging van de
      [Wegenverkeerswet 1994][ref1], houdende regeling van de verzelfstandiging van de Rijksdienst voor het Wegverkeer
      (*Stb.* 257), bedoelde kosten omvat, wordt aangewezen het deel I van het kentekenbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '35.3'
    text: Bij ministeriële regeling kunnen kentekenbewijzen worden aangewezen waarvoor het eerste en tweede lid niet gelden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel35
  - number: '36.1'
    text: |-
      De aanvraag van een vervangend kentekenbewijs of deel daarvan geschiedt bij de Dienst Wegverkeer door degene aan
      wie het kentekenbewijs waarvoor een vervangend kentekenbewijs of deel daarvan wordt aangevraagd, is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel36
  - number: '36.2'
    text: |-
      De Dienst Wegverkeer kan verlangen dat bij de aanvraag van een of meer vervangende delen van een kentekenbewijs,
      een of meer van de overige delen van het kentekenbewijs worden ingeleverd alsmede dat een bij ministeriële regeling
      aangewezen legitimatiebewijs wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel36
  - number: '36.3'
    text: |-
      Indien een kentekenbewijs is afgegeven aan de houder van een voertuig en deze een vervangend kentekenbewijs of deel
      daarvan aanvraagt, kan de Dienst Wegverkeer in door deze dienst te bepalen gevallen verlangen dat de eigenaar voor
      de afgifte van het vervangend kentekenbewijs of deel daarvan toestemming verleent. In deze gevallen kan de Dienst
      Wegverkeer bepalen dat het vervangende kentekenbewijs of deel daarvan naar de eigenaar of een door deze aangewezen
      persoon wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel36
  - number: '37.1'
    text: |-
      De Dienst Wegverkeer verklaart een kentekenbewijs ongeldig indien deze dienst van oordeel is, dat de
      omstandigheden, bedoeld in [artikel 58, eerste lid, onderdeel a of b , van de wet][ref1], zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel58
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '58'
  - number: '37.2'
    text: |-
      De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren indien voor het voertuig, waarvoor dat bewijs is
      afgegeven, een nieuw kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: '37.3'
    text: 'De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren indien naar het oordeel van deze dienst blijkt dat:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.a
    text: het voertuig, waarvoor dat bewijs is afgegeven, voorgoed buiten gebruik is gesteld,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.b
    text: het voertuig, waarvoor dat bewijs is afgegeven, voorgoed buiten Nederland is gebracht,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.c
    text: het voertuig, waarvoor dat bewijs is afgegeven, definitief is bestemd voor gebruik buiten de weg,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.d
    text: degene aan wie dat bewijs is afgegeven, opgehouden is eigenaar, bezitter of houder van het voertuig te zijn,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.e
    text: |-
      de reden waarom het kentekenbewijs bevattende de lettergroep BN, CD, CDJ, GN, GV, HH of ZZ is afgegeven, is
      vervallen,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.f
    text: de eigenaar of houder van het voertuig onvrijwillig het bezit of het houderschap van het voertuig heeft verloren,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: 37.3.g
    text: |-
      het voertuig is gaan behoren tot een der ingevolge [artikel 37 van de wet][ref1] van de kentekenplicht
      uitgezonderde categorieën van voertuigen,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: 37.3.h
    text: |-
      sprake is van de situatie als bedoeld in [artikel 40, eerste lid, onderdeel k][ref1], dan wel,


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '40'
        hoofdstuk: '4'
  - number: 37.3.i
    text: degene aan wie dat bewijs is afgegeven, niet langer in Nederland woonachtig of gevestigd is.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: '37.4'
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel *a*, verklaart de Dienst Wegverkeer het kentekenbewijs
      ongeldig, mits het voorgoed buiten gebruik stellen van het voertuig overeenkomstig het bepaalde krachtens
      [artikel 62, derde lid, van de wet][ref1] wordt gemeld door een erkend bedrijf dat gebruik maakt van de
      bevoegdheid, bedoeld in [artikel 46, tweede lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '37.5'
    text: |-
      In afwijking van het vierde lid verklaart de Dienst Wegverkeer een kentekenbewijs ongeldig
      indien de melding geschiedt door een ander dan een erkend bedrijf dat de bevoegdheid, bedoeld in
      [artikel 46, tweede lid, onderdeel d][ref1], heeft verkregen, mits de melding betrekking heeft op een voertuig
      dat behoort tot een bij ministeriële regeling aangewezen categorie van voertuigen en wordt voldaan aan nadere bij
      ministeriële regeling vastgestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '37.6'
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel *c*, verklaart de Dienst Wegverkeer het kentekenbewijs ongeldig
      mits ten aanzien van de bestemming van het voertuig wordt voldaan aan nadere bij ministeriële regeling vastgestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
  - number: '37.7'
    text: |-
      In het geval, bedoeld in het derde lid, onderdeel *f*, verklaart de Dienst Wegverkeer het kentekenbewijs
      ongeldig mits van het verlies van het bezit of het houderschap van het voertuig aangifte is gedaan bij een der in
      [artikel 141][ref1] of [142 van het Wetboek van Strafvordering][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '38.1'
    text: |-
      De Dienst Wegverkeer kan een kentekenbewijs ongeldig verklaren voor het rijden over de weg indien naar het oordeel
      van deze dienst niet wordt voldaan aan de krachtens artikel 52, tweede lid, van de wet in het kentekenbewijs
      vermelde voorschriften dan wel indien het voertuig waarvoor het kentekenbewijs is afgegeven, niet voldoet aan een
      of meer van de in [artikel 58, tweede lid, onderdeel ][ref1] van de wet, bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '58'
        hoofdstuk: '9'
  - number: '38.2'
    text: |-
      Ingeval het deel I van een voor het rijden over de weg ongeldig verklaard kentekenbewijs op grond van het bepaalde
      krachtens [artikel 57, derde lid][ref1], van de wet is ingeleverd, doet de Dienst Wegverkeer na ontvangst van dat
      deel I een ontvangstbewijs toekomen aan degene aan wie het kentekenbewijs is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel57
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '57'
        hoofdstuk: '9'
  - number: '39.1'
    text: |-
      Tot de invordering van het kentekenbewijs als bedoeld in [artikel 60][ref1] van de wet zijn bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: 39.1.a
    text: |-
      de Directie van de Dienst Wegverkeer en de door de Directie daartoe aangewezen tot die dienst behorende ambtenaren,
      indien naar hun oordeel [artikel 60, eerste lid, onderdeel ][ref1], van de wet, van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: 39.1.b
    text: |-
      de door Onze Minister in overeenstemming met Onze Minister van Financiën aangewezen ambtenaren der
      Rijksbelastingdienst, indien naar hun oordeel niet is voldaan aan [artikel 36, vijfde lid][ref1], van de wet, dan
      wel naar hun oordeel [artikel 60, eerste lid, onderdeel ][ref2], van de wet, van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: 39.1.c
    text: |-
      de ambtenaren, bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1], indien naar hun oordeel
      [artikel 60, eerste lid, onderdeel a, b of c][ref2], dan wel [artikel 60, tweede lid][ref3], van de wet van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: '39.2'
    text: |-
      De verplichting tot overgifte, bedoeld in [artikel 60, eerste lid][ref1], van de wet, heeft betrekking op alle
      delen van het kentekenbewijs, met uitzondering van het overschrijvingsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: '39.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren geven het deel II van het kentekenbewijs, indien dit was afgegeven, na
      inzage terug aan degene van wie het is ingevorderd en reiken voor [deel I][ref1] onverwijld een ontvangstbewijs
      uit. Zij doen dit deel met vermelding van de reden van invordering zo spoedig mogelijk toekomen aan de Dienst
      Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel39
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '39'
        hoofdstuk: '4'
  - number: '39.4'
    text: |-
      Indien de invordering heeft plaatsgevonden op grond van [artikel 60, eerste lid, onderdeel ][ref1], van de wet,
      mogen de in het eerste lid, onderdeel c, bedoelde ambtenaren het deel I van het kentekenbewijs gedurende ten
      hoogste vier weken onder zich houden. Zij geven dit deel tegen teruggave van het ontvangstbewijs aan de houder
      daarvan terug, indien binnen deze termijn naar hun oordeel is aangetoond dat het voertuig in overeenstemming
      is gebracht met de bij of krachtens de wet vastgestelde eisen. Van het onder zich houden, respectievelijk het
      teruggeven, stellen zij de Dienst Wegverkeer in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel60
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '60'
        hoofdstuk: '10'
  - number: '39.5'
    text: |-
      Indien dit bij de vordering van de houder van een kentekenbewijs wordt geëist, is deze verplicht tot het op een
      daarbij te bepalen tijd en plaats ter beschikking houden van het voertuig, waarvoor het bewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
  - number: '39.6'
    text: |-
      Indien de vordering betrekking heeft op een kentekenbewijs dat is afgegeven voor een aanhangwagen die
      overeenkomstig [artikel 3.7.3, eerste lid, van het Voertuigreglement][ref1] is voorzien van een constructieplaat,
      kan aan de vordering worden voldaan binnen een termijn van een week.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '3'
  - number: '40.1'
    text: 'De tenaamstelling in het register vervalt zodra:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.a
    text: krachtens artikel 26, derde lid, een vrijwaringsbewijs en een nieuw deel II zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.b
    text: krachtens artikel 27, vierde lid, een formulier is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.c
    text: |-
      de gegevens als bedoeld in [artikel 27, achtste lid, onderdeel b][ref1], aan het erkende bedrijf ter beschikking
      zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel27
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '27'
        hoofdstuk: '4'
  - number: 40.1.d
    text: |-
      krachtens artikel 28, derde lid, of artikel 28a, vijfde lid, een vrijwaringsbewijs en een nieuw deel II zijn
      afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.e
    text: krachtens artikel 29, tweede lid, een vrijwaringsbewijs en een nieuw deel II zijn afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.f
    text: krachtens artikel 30 een kentekenbewijs is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.g
    text: |-
      krachtens de artikelen 31, derde lid, 32, derde lid, onderdeel *c*, of 33, tweede en vierde lid, op het
      kentekenbewijs een aantekening is geplaatst;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.h
    text: |-
      de Dienst Wegverkeer het kentekenbewijs ongeldig heeft verklaard ingevolge
      [artikel 37, eerste, tweede of derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '37'
        hoofdstuk: '4'
  - number: 40.1.i
    text: |-
      de Dienst Wegverkeer het handelaarskentekenbewijs ongeldig heeft verklaard ingevolge
      [artikel 45, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '45'
        hoofdstuk: '5'
  - number: 40.1.j
    text: |-
      een erkend bedrijf een melding als bedoeld in [artikel 46, tweede lid, onderdeel c of d][ref1], heeft gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: 40.1.k
    text: |-
      de Dienst Wegverkeer een certificaat van vernietiging, als bedoeld in artikel 5, derde lid, van [richtlijn
      nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000
      betreffende autowrakken (PbEG L 269), heeft ontvangen dat door een daartoe bevoegde verwerker, zoals bedoeld in
      deze richtlijn, in een andere lidstaat van de Europese Gemeenschappen is afgegeven;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40.1.l
    text: |-
      de Dienst Wegverkeer de tenaamstelling vervallen heeft verklaard op grond van een verzoek als bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: '40.2'
    text: |-
      Degene die naar zijn mening ten onrechte als tenaamgestelde in het register is vermeld, kan de Dienst Wegverkeer
      verzoeken de tenaamstelling te doen vervallen. De Dienst Wegverkeer gaat over tot het doen vervallen van de
      tenaamstelling indien hiervoor naar het oordeel van deze dienst voldoende gronden aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40
  - number: 40a
    text: |-
      Een wijziging van [richtlijn nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de Europese
      Unie van 18 september 2000 betreffende autowrakken (PbEG L 269) gaat voor de toepassing van [artikel 40][ref1] en
      [artikel 46][ref2] gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel46
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '40'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '46'
        hoofdstuk: '6'
  - number: '41'
    text: |-
      Voor voertuigen als bedoeld in [artikel 37, derde lid, van de wet][ref1], geldt het vereiste dat een kenteken
      voor een bepaald voertuig dient te zijn opgegeven niet, mits dat voertuig een kenteken voert als bedoeld in
      [artikel 3][ref2], dat behoort bij een ingevolge [artikel 42][ref3] afgegeven handelaarskentekenbewijs waarvan
      gebruik wordt gemaakt overeenkomstig de in dit hoofdstuk bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel42
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
  - number: '42.1'
    text: 'Een handelaarsketekenbewijs kan worden aangevraagd door en worden afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel42
  - number: 42.1.a
    text: een erkend bedrijf, dan wel
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel42
  - number: 42.1.b
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen, waar voertuigen
      bedrijfsmatig voor derden worden hersteld of bewerkt.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel42
  - number: '42.2'
    text: De aanvraag wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel42
  - number: '42.3'
    text: |-
      De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel42
  - number: '43'
    text: |-
      Onverminderd [artikel 42][ref1] wordt de afgifte van handelaarskentekenbewijzen geweigerd indien een of meer aan de
      aanvrager afgegeven handelaarskentekenbewijzen op grond van [artikel 45, eerste lid, onderdeel d][ref2], ongeldig
      zijn verklaard binnen een direct aan de datum van indiening van de aanvraag voorafgaande periode van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel45
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '45'
        hoofdstuk: '5'
  - number: '44.1'
    text: |-
      Een handelaarskenteken mag slechts worden gebruikt door degene aan wie het is opgegeven dan wel een door deze
      aangewezen persoon. Het gebruik is slechts toegestaan voor de categorie waarvoor het is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel44
  - number: '44.2'
    text: |-
      Een handelaarskenteken mag worden gebruikt voor voertuigen die ter bewerking of herstel aan degene aan wie het
      kenteken is opgegeven ter beschikking zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel44
  - number: '44.3'
    text: |-
      Een handelaarskenteken moet worden gebruikt voor voertuigen die behoren tot de bedrijfsvoorraad van degene aan wie
      het kenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel44
  - number: '44.4'
    text: |-
      Een handelaarskenteken mag uitsluitend worden gebruikt indien met het voertuig als bedoeld in het tweede en
      derde lid gebruik van de weg wordt gemaakt in het kader van bedrijfsactiviteiten van het erkende bedrijf of de
      natuurlijke persoon of rechtspersoon aan wie het handelaarskenteken is opgegeven.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel44
  - number: '44.5'
    text: |-
      Voor overtreding van het eerste tot en met vierde lid is degene aan wie het handelaarskenteken is opgegeven
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel44
  - number: '45.1'
    text: |-
      De Dienst Wegverkeer kan een handelaarskentekenbewijs ongeldig verklaren indien degene aan wie het
      handelaarskentekenbewijs is afgegeven:
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: 45.1.a
    text: om zodanige ongeldigverklaring verzoekt,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: 45.1.b
    text: aangifte heeft gedaan van het onvrijwillig verlies van het handelaarskentekenbewijs,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: 45.1.c
    text: |-
      niet langer voldoet aan [artikel 42][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel42
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '42'
        hoofdstuk: '5'
  - number: 45.1.d
    text: 'handelt in strijd met het bepaalde:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: 45.1.d.1°
    text: |-
      bij of krachtens [artikel 37, derde of vierde lid, van de wet][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: 45.1.d.2°
    text: |-
      krachtens [artikel 37, zevende lid, van de wet][ref1], voor zover het betreft nadere regels ter uitvoering van het
      derde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '45.2'
    text: |-
      Degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft, levert dit onverwijld in bij de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: '45.3'
    text: |-
      Indien degene die een ongeldig verklaard handelaarskentekenbewijs onder zich heeft niet voldoet aan de verplichting
      van het tweede lid, kan het handelaarskentekenbewijs worden ingenomen door de daartoe bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel45
  - number: '46.1'
    text: |-
      Een erkenning als bedoeld in artikel 62, eerste lid, van de wet, wordt verleend teneinde voertuigen met behulp van
      een bedrijfsvoorraadpas in bedrijfsvoorraad op te nemen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
  - number: '46.2'
    text: 'Aan de erkenning kan worden verbonden:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
  - number: 46.2.a
    text: |-
      de bevoegdheid om voertuigen met behulp van een voor datacommunicatie geschikte voorziening in bedrijfsvoorraad op
      te nemen,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
  - number: 46.2.b
    text: de bevoegdheid tot het aanvragen van nog niet tenaamgestelde kentekenbewijzen,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
  - number: 46.2.c
    text: |-
      de bevoegdheid tot het versneld melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten
      Nederland worden gebracht, alsmede het verstrekken van kentekenbewijzen die een kenteken bevatten als bedoeld in
      [artikel 4, zesde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
        hoofdstuk: '2'
  - number: 46.2.d
    text: |-
      de bevoegdheid tot het melden dat tot de bedrijfsvoorraad behorende voertuigen voorgoed buiten gebruik worden
      gesteld, alsmede het verstrekken van een certificaat van vernietiging, als bedoeld in artikel 5, derde lid, van
      [richtlijn nr. 2000/53/EG](32000L0053) van het Europees Parlement en de Raad van de Europese Unie van 18 september
      2000 betreffende autowrakken (PbEG L 269), met dien verstande dat de melding alleen wordt gedaan nadat het
      certificaat van vernietiging is verstrekt, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
  - number: 46.2.e
    text: |-
      de bevoegdheid om in geval van overdracht van een voertuig uit de bedrijfsvoorraad van het betrokken
      bedrijf namens de aanvrager van een kentekenbewijs de aanvraag in te dienen, overeenkomstig
      [artikel 50, eerste lid, onderdeel a][ref1], van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '50'
        hoofdstuk: '7'
  - number: 46.2.f
    text: |-
      de bevoegdheid om in geval van verkoop van een voertuig uit eigen bedrijfsvoorraad namens de aanvrager
      middels een voor datacommunicatie geschikte voorziening bij de Dienst Wegverkeer, overeenkomstig
      [artikel 50, eerste lid, aanhef en onderdeel b, van de wet][ref1] een aanvraag voor een kentekenbewijs of een deel
      II in te dienen en dit aan de aanvrager uit te reiken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel50
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '50'
  - number: '47.1'
    text: |-
      Een erkenning als bedoeld in [artikel 62, eerste lid, van de wet][ref1], kan worden aangevraagd door en worden
      verleend aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 47.1.a
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht of gefabriceerd met het doel deze te verkopen,
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
  - number: 47.1.b
    text: |-
      een natuurlijke persoon of rechtspersoon die exploitant is van een of meer ondernemingen waar voertuigen
      bedrijfsmatig worden ingekocht met het doel deze te bewaren of te bewerken, en
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
  - number: 47.1.c
    text: |-
      bij ministeriële regeling aan te wijzen personen of instanties die voertuigen in eigendom hebben, zonder deze zelf
      te hebben ingekocht, met het doel deze te verkopen.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
  - number: '47.2'
    text: De aanvraag wordt ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
  - number: '47.3'
    text: |-
      De aanvrager stelt de Dienst Wegverkeer in de gelegenheid te onderzoeken of te zijnen aanzien aan het eerste lid
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel47
  - number: '48.1'
    text: |-
      Bij het verlenen van de erkenning verstrekt de Dienst Wegverkeer aan het erkende bedrijf een of meer
      bedrijfsvoorraadpassen van een bij ministeriële regeling vastgesteld model, waarmee de registratie van voertuigen
      in bedrijfsvoorraad kan plaatsvinden alsmede formulieren die bestemd zijn om te dienen als vrijwaringsbewijs en als
      bedrijfsvoorraad deel II.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel48
  - number: '48.2'
    text: |-
      Op aanvraag verstrekt de Dienst Wegverkeer aan een erkend bedrijf meerdere bedrijfsvoorraadpassen en formulieren
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel48
  - number: '48.3'
    text: |-
      Voor versleten of zoekgeraakte bedrijfsvoorraadpassen verstrekt de Dienst Wegverkeer op aanvraag aan het
      erkende bedrijf vervangende passen. Voor versleten bedrijfsvoorraadpassen geeft de Dienst Wegverkeer niet eerder
      vervangende passen af dan nadat de versleten passen zijn ingeleverd.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel48
  - number: '48.4'
    text: |-
      De Dienst Wegverkeer kan verlangen dat de aanvrager van nieuwe en vervangende bedrijfsvoorraadpassen, bedoeld in
      het tweede en derde lid, de bij ministeriële regeling aangewezen bescheiden overlegt die verband houden met de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel48
  - number: '49.1'
    text: |-
      Indien dit bij de intrekking, wijziging of schorsing van de erkenning als bedoeld in [artikel 65 van de wet][ref1],
      is bepaald, levert degene aan wie de erkenning is dan wel was verleend alle aan hem verstrekte
      bedrijfsvoorraadpassen en formulieren onverwijld in bij de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel65
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '65'
  - number: '49.2'
    text: |-
      Indien degene aan wie de erkenning is dan wel was verleend niet voldoet aan het eerste lid, kunnen de
      bedrijfsvoorraadpassen en formulieren worden ingenomen door de daartoe bevoegde ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel49
  - number: '50.1'
    text: |-
      De aanvrager van een schorsing als bedoeld in artikel 67 van de wet legt ten behoeve van deze aanvraag bij de
      Dienst Wegverkeer het deel II van het kentekenbewijs, het overschrijvingsbewijs alsmede een bij ministeriële
      regeling aangewezen legitimatiebewijs over.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel50
  - number: '50.2'
    text: De Dienst Wegverkeer plaatst op het deel II een bij ministeriële regeling vastgestelde aantekening.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel50
  - number: '51'
    text: |-
      Indien de schorsing eindigt ingevolge artikel 68 van de wet, wordt bij de Dienst Wegverkeer, onder overlegging
      van deel II van het kentekenbewijs, het overschrijvingsbewijs alsmede een bij ministeriële regeling aangewezen
      legitimatiebewijs, een nieuw deel II aangevraagd.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel51
  - number: '52'
    text: 'Een schorsing eindigt niet door gebruik van de weg indien:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel52
  - number: 52.a
    text: |-
      het voertuig waarvan de geldigheid van het kentekenbewijs is geschorst een kenteken voert als bedoeld in
      [artikel 3][ref1], dat behoort bij een ingevolge [artikel 42][ref2] afgegeven handelaarskentekenbewijs dat voldoet
      aan [hoofdstuk 5][ref3] en waarvan gebruik wordt gemaakt overeenkomstig de in dat hoofdstuk bedoelde voorschriften,
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel52
