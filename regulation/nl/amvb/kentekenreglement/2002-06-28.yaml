preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 juni 1993, nr. RV 151906, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 18 oktober 1993, nr. W09.93.0363);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 30 september 1994, nr. R 183051;
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
  - number: 1.a
    text: |-
      wet : [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.b
    text: |-
      voertuig : motorrijtuig of aanhangwagen als bedoeld in [artikel 1, eerste lid, onderdelen ][ref1], van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.c
    text: |-
      bijzonder kenteken: kenteken als bedoeld in [artikel 38][ref1] van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel38
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '38'
        hoofdstuk: '4'
  - number: 1.d
    text: |-
      erkend bedrijf : natuurlijke persoon of rechtspersoon aan wie een erkenning overeenkomstig artikel 62 van de wet
      is verleend;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
  - number: 1.e
    text: |-
      bedrijfsvoorraad : te verhandelen, bewaren of te bewerken voertuigen waarvan een erkend bedrijf de eigendom heeft
      verkregen;
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
  - number: 1.f
    text: |-
      bedrijfsvoorraad [deel II][ref1]: deel II van een kentekenbewijs van een bij ministeriële regeling vastgesteld
      model, afgegeven aan een erkend bedrijf, ten behoeve van de voertuigen die in bedrijfsvoorraad zijn opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.g
    text: |-
      bedrijfsvoorraadpas: pas als bedoeld in [artikel 48, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel48
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '48'
        hoofdstuk: '6'
  - number: 1.h
    text: |-
      handelaarskenteken: kenteken als bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel3
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.i
    text: |-
      vrijwaringsbewijs : bewijs van een bij ministeriële regeling vastgesteld model, blijkens welk aan de
      verplichtingen van [artikel 26, tweede lid][ref1], 27, [derde lid][ref2], 27, [achtste lid, onderdeel ][ref3], 28,
      [tweede lid][ref4], 28a, [vierde lid][ref5], of 29, [eerste lid][ref6], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0006951#Artikel1
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel1
