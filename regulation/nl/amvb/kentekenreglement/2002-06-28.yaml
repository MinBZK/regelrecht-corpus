  - number: '55.2'
    text: |-
      Voor de toepassing van [artikel 5 van het Reglement kentekenregistratie][ref1] wordt met een kentekenbewijs
      gelijkgesteld een kentekenbewijs, afgegeven op basis van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002938#Artikel5
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002938
        artikel: '5'
  - number: '57.1'
    text: |-
      De [artikelen 17][ref1] en [23 van het Reglement kentekenregistratie][ref2], zoals deze artikelen luidden vóór
      het tijdstip waarop zij op grond van [artikel 59][ref3] zijn ingetrokken, blijven van kracht ten aanzien van op
      basis van de Wegenverkeerswet afgegeven kentekenbewijzen die vóór bedoeld tijdstip met toepassing van genoemde
      [artikelen 17][ref4] en [23][ref5] ongeldig zijn verklaard en moeten worden ingeleverd, indien op eerderbedoeld
      tijdstip die inlevering nog niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002938#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002938#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0006951#Artikel59
      [ref4]: https://wetten.overheid.nl/BWBR0006951#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0006951#Artikel23
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002938
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002938
        artikel: '23'
      - id: ref3
