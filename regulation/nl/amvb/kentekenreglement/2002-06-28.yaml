  - number: '54.1'
    text: |-
      Kentekenbewijzen en ter vervanging van die bewijzen uitgereikte duplicaten, afgegeven op basis van de
      Wegenverkeerswet, worden vóór een bij ministeriële regeling vastgesteld tijdstip vervangen door een kentekenbewijs,
      afgegeven op basis van de wet.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel54
  - number: '54.2'
    text: |-
      Overeenkomstig het eerste lid vervangen kentekenbewijzen en duplicaten verliezen hun geldigheid op het in het
      eerste lid bedoelde tijdstip; zij worden onverwijld ingeleverd bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel54
  - number: '55.1'
    text: |-
      De [artikelen 5][ref1], [7, eerste en tweede lid][ref2], [14][ref3], eerste lid, [15][ref4], eerste lid en
      [16 van het Reglement kentekenregistratie][ref5], zoals deze bepalingen luidden vóór het tijdstip waarop zij op
      grond van [artikel 59][ref6] zijn ingetrokken, blijven voor wat betreft het in die bepalingen bepaalde ten aanzien
      van registratiebewijzen en aanvullingsbladen van kracht tot een bij ministeriële regeling vastgesteld tijdstip.
      Tot dat tijdstip kan de Dienst Wegverkeer tevens een voorlopig registratiebewijs afgeven van een bij ministeriële
      regeling vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0002938#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002938#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002938#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002938#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0002938#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0006951#Artikel59
    url: https://wetten.overheid.nl/BWBR0006951/2002-06-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002938
        artikel: '5'
      - id: ref2
