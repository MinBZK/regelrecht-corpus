    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, van 14 september 2004, nr.
    TRCJZ/2004/5069, Directie Juridische Zaken, gedaan mede namens de Staatssecretaris van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 5, vierde lid, in samenhang met Bijlage III, onderdeel 1, onder 2, van richtlijn nr. 91/676/
    EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 inzake de bescherming van water tegen
    verontreiniging door nitraten uit agrarische bronnen (PbEG L 375);

    Gelet op de artikelen 6a en 7, eerste lid, aanhef en onderdeel b, van de Meststoffenwet;

