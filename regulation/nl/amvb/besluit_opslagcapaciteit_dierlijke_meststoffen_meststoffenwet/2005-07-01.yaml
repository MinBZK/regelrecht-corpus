articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *producent van dierlijke meststoffen:* persoon of rechtspersoon die, of samenwerkingsverband van personen of
      rechtspersonen dat dierlijke meststoffen produceert;

      b. *opslagruimte voor dierlijke meststoffen:* ruimte voor de opslag van dierlijke meststoffen waarvoor een
      vergunning geldt als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1], of waarop een algemene maatregel van
      bestuur op grond van [artikel 8.40 van de Wet milieubeheer][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
    url: https://wetten.overheid.nl/BWBR0018444/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.40'
  - number: '2'
    text: |-
      1 De producent van dierlijke meststoffen draagt er zorg voor dat de capaciteit van de opslagruimte voor dierlijke
      meststoffen op het bedrijf voldoende is voor de opslag van de hoeveelheid dierlijke meststoffen die in de periode
      van september tot en met februari op het bedrijf wordt geproduceerd.

      2 De hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt berekend door vermenigvuldiging van:

      a. het aantal dieren van de onderscheiden diersoorten en diercategorieën dat op grond van de vergunning, bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1], in de tot het bedrijf behorende stallen kan worden gehouden, met

      b. de voor de betrokken diersoort en diercategorie bij ministeriële regeling vastgestelde forfaitaire
      productienormen, uitgedrukt in kubieke meters per dier.

      3 Ingeval voor het bedrijf ingevolge [artikel 8.40 van de Wet milieubeheer][ref2] geen vergunningplicht geldt,
      wordt, in plaats van het in het tweede lid, onderdeel a, bedoelde aantal dieren, als uitgangspunt genomen het
      aantal dieren van de onderscheiden diersoorten en diercategorieën dat in de bij het bedrijf behorende stallen kan
      worden gehouden.

      4 De in het tweede lid, onderdeel b, bedoelde productienormen kunnen verschillend worden vastgesteld al naar gelang
      het gehanteerde bedrijfssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
    url: https://wetten.overheid.nl/BWBR0018444/2005-07-01#Artikel2
    references:
