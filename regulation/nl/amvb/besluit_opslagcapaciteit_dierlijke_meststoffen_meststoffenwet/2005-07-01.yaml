        bwb_id: BWBR0003245
        artikel: '8.40'
  - number: '3'
    text: |-
      1 De capaciteit van de opslagruimte voor dierlijke meststoffen kan kleiner zijn dan de ingevolge [artikel 2][ref1]
      vereiste capaciteit, voor zover de producent van dierlijke meststoffen kan aantonen dat:

      a. de overeenkomstig [artikel 2, tweede en derde lid][ref2], berekende hoeveelheid dierlijke meststoffen die wordt
      geproduceerd boven de werkelijke opslagcapaciteit op een voor het milieu onschadelijke wijze van het bedrijf zal
      worden verwijderd,

      b. de overeenkomstig [artikel 2, tweede en derde lid][ref3], berekende hoeveelheid dierlijke meststoffen die wordt
      geproduceerd boven de werkelijke opslagcapaciteit zal worden gebruikt op tot het bedrijf behorend bouwland of
      braakland waarvoor het in [artikel 4 van het Besluit gebruik meststoffen][ref4] gestelde verbod niet geldt,

      c. het aantal dieren dat in de periode van september tot en met februari feitelijk in de tot het
      bedrijf behorende stallen kan worden gehouden kleiner is dan op grond van de vergunning, bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref5], is toegestaan, of

      d. in de periode van september tot en met februari stelselmatig minder dieren worden gehouden in de tot het bedrijf
      behorende stallen.

      2 Het eerste lid, aanhef en onderdeel b, geldt niet voor de hoeveelheid dierlijke meststoffen die in februari wordt
      geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018444#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018444#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018444#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009066#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
