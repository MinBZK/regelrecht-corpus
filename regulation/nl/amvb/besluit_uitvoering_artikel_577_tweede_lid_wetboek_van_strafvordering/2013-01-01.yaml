        paragraaf: '1'
  - number: '6'
    text: |-
      Een ieder die betrokken is bij de inning van de gelden bedoeld in [artikel 1][ref1], verstrekt het Centraal
      Justitieel Incassobureau en het openbaar ministerie de gegevens die zij behoeven in verband met de uitoefening van
      hun in [artikel 1][ref2] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006714#Artikel1
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
  - number: '7'
    text: |-
      1 Het Hoofd van de Centrale Directie Financieel Economische Zaken van het Ministerie van Veiligheid en Justitie
      draagt zorg voor de opening van een of meer afzonderlijke giro- of bankrekeningen van het Centraal Justitieel
      Incassobureau welke rekeningen bestemd zijn voor de betaling van gelden bedoeld in [artikel 1][ref1].

      2 De directeur van het Centraal Justitieel Incassobureau is belast met het beheer van de in het eerste lid bedoelde
      giro- of bankrekeningen.

      3 Onze Minister van Veiligheid en Justitie stelt nadere voorschriften vast omtrent het beheer van de in het eerste
      lid bedoelde giro- of bankrekeningen en de in verband daarmee te voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel1
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
  - number: '8'
    text: |-
      1 Onze Minister stelt het formulier vast van het door de in [artikel 5, eerste lid][ref1], bedoelde personen uit te
      reiken betalingsbewijs.

      2 De ontvangen gelden worden regelmatig overgemaakt op de door het Centraal Justitieel Incassobureau aangegeven
      wijze op de daartoe bestemde giro- of bankrekeningen van het Centraal Justitieel Incassobureau.

      3 Onze Minister van Veiligheid en Justitie stelt nadere voorschriften vast omtrent de verstrekking en het beheer
      van de betalingswijzen, de afrekening en de verantwoording van de ontvangen gelden alsmede de in verband daarmee te
      voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel5
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      De korpschef doet op de door Onze Minister van Veiligheid en Justitie te bepalen wijze jaarlijks opgave van de
      uitvoering van de in [artikel 8, derde lid][ref1], bedoelde voorschriften en van de met het oog op de toepassing
      van dit besluit verrichte accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel8
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '8'
        paragraaf: '3'
  - number: '10'
    text: >-
      1 De uitlevering van niet in beslag genomen, verbeurd verklaarde voorwerpen, geschiedt bij de griffie van de
      rechtbank in het arrondissement waar de strafzaak in eerste aanleg is vervolgd.


      2 Het openbaar ministerie bij de rechtbank waarbij het de zaak aanhangig heeft gemaakt, kan in afwijking van het
      eerste lid voor het uitleveren van de in het eerste lid bedoelde voorwerpen een andere plaats aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel10
  - number: '11'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering artikel 577, tweede lid.'
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel12
