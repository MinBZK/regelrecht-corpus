articles:
  - number: '1'
    text: |-
      Het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1], heeft tot taak Onze Minister van
      Veiligheid en Justitie en het openbaar ministerie te ondersteunen bij hun taken met betrekking tot de betaling
      van de geschatte waarde van niet in beslag genomen, verbeurd verklaarde voorwerpen, alsmede bij hun taken met
      betrekking tot de betaling van de kosten van openbaarmaking van de uitspraak waartoe de rechter de last heeft
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: '2'
    text: |-
      Het Centraal Justitieel Incassobureau verricht de werkzaamheden die Onze Minister van Veiligheid en Justitie of het
      openbaar ministerie van hem in verband met de uitoefening van hun in [artikel 1][ref1] genoemde taken verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel1
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
  - number: '3'
    text: >-
      De betaling van de geschatte waarde van niet in beslag genomen verbeurd verklaarde goederen, alsmede van de kosten
      van openbaarmaking van de uitspraak, geschiedt door storting of overschrijving daarvan op een daartoe bestemde
      giro- of bankrekening van het Centraal Justitieel Incassobureau. In bijzondere gevallen kan de betaling geschieden
      op een door het Centraal Justitieel Incassobureau aan te wijzen plaats, dan wel aan een door het Centraal
      Justitieel Incassobureau aan te wijzen persoon.
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 Degene die betaalt, maakt daarbij op een door het Centraal Justitieel Incassobureau aan te geven wijze melding
      van de zaak waar betaling van de gelden als bedoeld [artikel 1][ref1], betrekking op heeft.

      2 Ingeval geen melding is gemaakt van de zaak waar betaling van de gelden als bedoeld in [artikel 1][ref2]
      betrekking op heeft kan het Centraal Justitieel Incassobureau het aan hem betaalde bedrag terugstorten op de
      rekening waarvan het bedrag afkomstig is, of anderszins het bedrag terugbetalen aan de persoon die betaald heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006714#Artikel1
    url: https://wetten.overheid.nl/BWBR0006714/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006714
        artikel: '1'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 In het belang van een juiste taakuitoefening bij de inning van de gelden bedoeld in [artikel 1][ref1], wordt
      in de gevallen bedoeld in [artikel 3, tweede volzin][ref2], onverwijld een betalingsbewijs uitgereikt dat door de
      persoon aan wie wordt voldaan, is gedagtekend en ondertekend.

      2 In de gevallen bedoeld in [artikel 3, tweede volzin][ref3], wordt van de inning van de gelden als bedoeld in
      [artikel 1][ref4], aantekening gehouden op de wijze zoals door het Centraal Justitieel Incassobureau is aangegeven.

      3 De aantekeningen worden, uiterlijk een jaar nadat zij zijn opgemaakt, desverlangd getoond aan de personen die met
      het toezicht op de inning van de gelden bedoeld in [artikel 1][ref5] zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0006714#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006714#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006714#Artikel3
