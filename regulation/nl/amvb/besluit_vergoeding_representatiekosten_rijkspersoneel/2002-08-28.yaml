preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 23 april 1993, nr. AB93/U356, directoraat-generaal
    Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsvoorwaarden Rijkspersoneel;

    gelet op de artikelen 125, eerste lid, onderdeel j. en 134, eerste lid, van de Ambtenarenwet 1929;

    de Raad van State gehoord (advies van 16 juni 1993, nr. W04.93.0248);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 14 juli 1993, nr. AB93/585, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsvoorwaarden Rijkspersoneel;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel1
  - number: 1.1.a
    text: |-
      de ambtenaar: de ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1] of het
      [Ambtenarenreglement Staten-Generaal][ref2] en de in Nederland werkzame ambtenaar of werknemer in de zin van het
      [Reglement Dienst Buitenlandse Zaken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
      - id: ref3
        bwb_id: BWBR0004052
  - number: 1.1.b
    text: 'het bevoegd gezag: Onze Minister;'
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel1
  - number: 1.1.c
    text: |-
      representatiekosten: kosten van de ambtenaar die voortvloeien uit de eisen die de uitoefening van de functie stelt
      ten aanzien van het onderhouden van externe contacten en die niet declarabel zijn.
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit worden met het bevoegd gezag gelijkgesteld de voorzitters van elk der beide
      Kamers der Staten Generaal, de vice-president van de Raad van State, het College van de Algemene Rekenkamer, de
      Nationale ombudsman en de directeur van het Kabinet der Koningin.
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel1
  - number: '2.1'
    text: |-
      Voor representatiekosten van een ambtenaar kan het bevoegd gezag een vergoeding verstrekken welke ten hoogste  €
      6 400 per kalenderjaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel2
  - number: '2.2'
    text: Onze Minister kan met betrekking tot het eerste lid nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel2
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot en met 1 januari 1991.
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit vergoeding representatiekosten rijkspersoneel.'
    url: https://wetten.overheid.nl/BWBR0006102/2002-08-28#Artikel6
