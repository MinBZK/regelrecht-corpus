  - number: '3'
    text: |-
      Indien een voorschrift dat is opgenomen in dit besluit inhoudt dat daarbij aangegeven middelen ter voorkoming
      of beperking van verontreiniging van een oppervlaktewaterlichaam moeten worden toegepast, kan degene die
      agrarische activiteiten uitvoert andere middelen toepassen mits hij, voordat hij die andere middelen toepast,
      aan de beheerder aantoont dat met de door hem gekozen middelen een tenminste gelijkwaardige bescherming van een
      oppervlaktewaterlichaam wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel3
  - number: '4'
    text: |-
      1 Bij agrarische activiteiten dan wel activiteiten die daarmee verband houden wordt voldoende zorg in acht genomen
      om verontreiniging van een oppervlaktewaterlichaam te voorkomen.

      2 De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan
      vermoeden dat door zijn handelen of nalaten een oppervlaktewaterlichaam kan worden verontreinigd, verplicht is
      dergelijk handelen achterwege te laten voorzover zulks in redelijkheid kan worden gevergd, dan wel alle maatregelen
      te nemen die redelijkerwijs van hem kunnen worden gevergd teneinde die verontreiniging te voorkomen of, voorzover
      die verontreiniging niet kan worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel4
  - number: '5'
    text: |-
      1 Lozen is verboden.

      2 In afwijking van het eerste lid is lozen toegestaan, indien het betreft:

      a. huishoudelijk afvalwater, met inachtneming van de voorschriften, genoemd in [artikel 6][ref1];

      b. lozen ten gevolge van het wassen of uitwendig reinigen van voertuigen, werktuigen of apparaten, met inachtneming
      van de voorschriften, genoemd in [artikel 7][ref2];

      c. lozen ten gevolge van het spoelen van landbouwgewassen, met inachtneming van de voorschriften, genoemd in
      [artikel 8][ref3];

      d. lozen ten gevolge van de ontijzering van grondwater, met inachtneming van de voorschriften, genoemd in
      [artikel 9][ref4];

      e. lozen ten gevolge van het reinigen van gebouwen of opstallen waarin agrarische activiteiten dan wel activiteiten
      die daarmee verband houden plaatsvinden, met inachtneming van de voorschriften, genoemd in [artikel 10][ref5];

      f. lozen van koel- en condenswater, met inachtneming van de voorschriften, genoemd in [artikel 11][ref6];

      g. lozen van hemelwater en water dat bij het reinigen van verhard oppervlak vrijkomt, met inachtneming van de
      voorschriften, genoemd in [artikel 12][ref7];

      h. het op een andere wijze dan met behulp van een werk lozen door pleksgewijze, driftvrije, toepassing van
      gewasbeschermingsmiddelen op het talud;

      i. overig op een andere wijze dan met behulp van een werk lozen, dat verband houdt met gewasbescherming en
      toediening van meststoffen, met inachtneming van de voorschriften, genoemd in de [artikelen 13][ref8], [15][ref9]
      en [16][ref10];

      j. water dat bij normaal landbouwkundig gebruik uit de bodem vrijkomt en via een drainagesysteem wordt geloosd.

      3 Ander lozen dan genoemd in het tweede lid, onderdeel a tot en met j, is toegestaan indien degene die de
      agrarische activiteiten waarvan het voorgenomen lozen het gevolg zal zijn uitvoert, voor de aanvang van het lozen
      aan de beheerder aantoont, dat het lozen geen nadelige gevolgen voor een oppervlaktewaterlichaam zal veroorzaken.

      4 Het gebruiken van gewasbeschermingsmiddelen nabij een oppervlaktewaterlichaam is

      a. verboden, tenzij de voorschriften gesteld bij of krachtens [artikel 13][ref11] in acht worden genomen;

      b. binnen een afstand van 14 m vanaf de insteek van een oppervlaktewaterlichaam verboden, tenzij de voorschriften
      gesteld bij of krachtens [artikel 15][ref12] in acht worden genomen.


