      1 Met betrekking tot het lozen van hemelwater en water waarmee verhard oppervlak wordt gereinigd worden de
      voorschriften, gesteld bij of krachtens het tweede tot en met het derde lid, in acht genomen.

      2 Materialen, apparaten, voedingsstoffen, afvalstoffen en grondstoffen waarmee het hemelwater verontreinigd kan
      raken worden zodanig op verhard oppervlak opgeslagen of gestald dat te lozen hemelwater en water waarmee het
      verhard oppervlak wordt gereinigd daarmee niet in contact kan komen.

      3 Materialen, apparaten, voedingsstoffen, afvalstoffen en grondstoffen worden op onverhard oppervlak langs een
      oppervlaktewaterlichaam:

      a. op een afstand van tenminste 5 m tot de insteek van een oppervlaktewaterlichaam opgeslagen of gestald of

      b. zodanig opgeslagen of gestald dat te lozen hemelwater niet in contact kan komen met die materialen, apparaten,
      voedingsstoffen, afvalstoffen en grondstoffen.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel12
  - number: '13'
