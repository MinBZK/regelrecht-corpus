  - number: '15'
    text: |-
      1 Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van gewasbescherming
      worden binnen een afstand van 14 m vanaf de insteek van een oppervlaktewaterlichaam de voorschriften, gesteld bij
      of krachtens het derde tot en met het zevende lid, in acht genomen.

      2 Met betrekking tot het gebruiken van gewasbeschermingsmiddelen binnen een afstand van 14 m vanaf de insteek van
      een oppervlaktewaterlichaam, worden de voorschriften gesteld bij of krachtens het derde tot en met het zevende lid
      in acht genomen.

      3 Gewasbeschermingsmiddelen worden niet gebruikt

      a. met veldspuitapparatuur, met uitzondering van een overkapte beddenspuit, die:

      1°. niet is voorzien van kantdoppen en andere driftarme doppen, of

      2°. zodanig is ingesteld dat de spuitdoppen zich op een hoogte groter dan 50 cm boven het gewas of de kale grond
      bevinden;

      b. met een spuitgeweer dat is voorzien van een werveldop of dat gebruik maakt van een werkdruk van 5 bar of meer,
      zodat over een afstand van meer dan 2 m vloeistof verspreid kan worden;

      c. bij een windsnelheid van 5 m of meer per seconde gemeten op spuitdophoogte tenzij:

      1°. de gewasbeschermingsmiddelen worden gebruikt met een overkapte beddenspuit;

      2°. degene die de gewasbeschermingsmiddelen gebruikt kan aantonen, dat redelijkerwijs niet anders dan door het
      gebruiken van die middelen bij een windsnelheid van 5 m of meer per seconde een teeltbedreigende situatie kan
      worden afgewend.

      4 Binnen de teeltvrije zone worden gewasbeschermingsmiddelen niet gebruikt met apparatuur die bestemd is voor het
      druppelsgewijs gebruiken van gewasbeschermingsmiddelen, met uitzondering van pleksgewijze onkruidbestrijding met
      een afgeschermde spuitdop.

      5 In afwijking van het vijfde lid is het toepassen van gewasbeschermingsmiddelen op overhangend loof met
      een maximale omvang van een halve gewasrij toegestaan, tenzij daartoe gebruik wordt gemaakt van naar een
      oppervlaktewaterlichaam gerichte apparatuur.

      6 Het driftarm karakter van doppen als bedoeld in het vierde lid, onderdeel a,

      a. blijkt uit een testcertificaat en

      b. wordt volgens een door Onze Ministers bij ministeriële regeling aan te wijzen testmethode dan wel een daaraan
      gelijkwaardige methode vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel15
  - number: '16'
    text: |-
      1 Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van het gebruik
      van meststoffen worden de voorschriften, gesteld bij of krachtens het tweede tot en met het zevende lid in acht
      genomen.

      2 Het is verboden meststoffen toe te dienen op de ingevolge [artikel 13][ref1] voorgeschreven teeltvrije zone.

      3 In afwijking van het tweede lid is het verboden bij de teelt van opwaarts en zijwaarts te bespuiten
      boomkwekerijgewassen als bedoeld in [bijlage I][ref2] bij dit besluit of van appelen, peren en overige pit- en
      steenvruchten, meststoffen toe te dienen binnen 25 cm vanaf de insteek van een oppervlaktewaterlichaam, niet zijnde
      een oppervlaktewaterlichaam als bedoeld in [artikel 13, negende lid][ref3], indien in de teeltvrije zone geen ander
      gewas dan gras wordt geteeld.

      4 Bij gebruik van korrel- of poedervormige meststoffen op de strook gelegen naast de teeltvrije zone wordt direct
      langs de zone een kantstrooivoorziening toegepast.

      5 In afwijking van het tweede lid is het pleksgewijs bemesten van een vanggewas op de teeltvrije zone toegestaan
      buiten een afstand van 50 cm gemeten vanaf de insteek van een oppervlaktewaterlichaam, niet zijnde een
      oppervlaktewaterlichaam als bedoeld in [artikel 13, negende lid][ref4], onverminderd het zevende lid.

      6 Bij de toepassing van bladmeststoffen op de strook gelegen naast de teeltvrije zone wordt direct langs de zone:

      a. bij het bemesten van landbouwgewassen als bedoeld in [artikel 13, vierde en achtste lid][ref5], gebruik gemaakt
      van kantdoppen en andere driftarme doppen die zich maximaal op een hoogte van 50 cm boven het gewas of de kale
      grond bevinden;

      b. bij het bemesten van landbouwgewassen als bedoeld in [artikel 13, vijfde en zesde lid][ref6], geen gebruik
      gemaakt van naar een oppervlaktewaterlichaam gerichte apparatuur.

      7 Bij de toepassing van bladmeststoffen bij de teelt van een gewas waarbij ingevolge
      [artikel 13, dertiende lid, aanhef en onderdeel b, onder 2°][ref7], geen teeltvrije zone wordt aangehouden, wordt
      gebruik gemaakt van een emissiescherm waarvan geen afdruipende bladmeststoffen in een oppervlaktewaterlichaam
      kunnen geraken.

      8 Onverminderd het eerste tot en met het zesde lid zijn de
      [artikelen 1a tot en met 6d van het Besluit gebruik meststoffen][ref8] binnen een afstand van 14 m vanaf de insteek
      van een oppervlaktewaterlichaam van overeenkomstige toepassing.


