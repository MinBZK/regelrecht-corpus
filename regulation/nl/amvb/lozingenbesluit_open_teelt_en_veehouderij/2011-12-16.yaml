  - number: '19'
    text: |-
      1 Degene die voornemens is agrarische activiteiten uit te voeren ten gevolge waarvan een lozing kan plaatsvinden
      meldt het lozen tenminste zes weken voordat daarmee wordt aangevangen aan de beheerder.

      2 Een melding als bedoeld in het eerste lid wordt schriftelijk gedaan en omvat in ieder geval:

      a. de naam, het adres en het telefoonnummer van degene die meldt;

      b. een omschrijving van de agrarische activiteiten die worden verricht;

      c. de lozingen bedoeld in [artikel 5, tweede lid][ref1], ten gevolge van agrarische activiteiten dan wel
      activiteiten die daarmee verband houden;

      d. de locatie van gebouwen van waaruit lozingen plaatsvinden;

      e. de locatie van de percelen van waar af lozingen plaatsvinden;

      f. in geval van het lozen van huishoudelijk afvalwater gegevens op grond waarvan het aantal inwonerequivalenten kan
      worden bepaald;

      g. gegevens waaruit kan worden afgeleid hoeveel meter de afstand tot de dichtstbijzijnde riolering bedraagt;

      h. gegevens met betrekking tot de voorzieningen bedoeld in [artikel 6, vierde lid][ref2],
      [artikel 7, derde lid, onderdeel c][ref3], [artikel 8, zevende en negende lid][ref4],
      [artikel 9, derde en vijfde lid][ref5], [artikel 10, vijfde en zevende lid][ref6] en
      [artikel 11, vierde lid][ref7];

      i. gegevens waaruit kan worden afgeleid dat sprake is van biologische teelt.

      3 De melding wordt gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.

      4 Degene die voornemens is agrarische activiteiten ten gevolge waarvan een lozing plaatsvindt te veranderen, meldt
      veranderend lozen voordat daarmee wordt aangevangen aan de beheerder, tenzij het veranderend lozen uitsluitend het
      gevolg is van een wijziging in teelt en de gegevens omtrent het te telen landbouwgewas en de betreffende percelen
      op grond van [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref8] zijn gemeld aan Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit. Het tweede en derde lid zijn van overeenkomstige toepassing.

      5 De beheerder is bevoegd de krachtens [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref9] gemelde
      gegevens te gebruiken voor zover noodzakelijk voor het toezicht op de naleving van de bij of krachtens dit besluit
      gestelde regels.


