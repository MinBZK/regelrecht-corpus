  - number: '2'
    text: |-
      1 Dit besluit is van toepassing op het lozen en het gebruiken van bestrijdingsmiddelen nabij een
      oppervlaktewaterlichaam ten gevolge van agrarische activiteiten dan wel van activiteiten die daarmee verband
      houden, met uitzondering van:

      a. het lozen en het gebruiken van bestrijdingsmiddelen vanuit respectievelijk op bedrijfsterreinen die in
      belangrijke mate bestemd zijn voor technische dienstverlening aan derden voor gemechaniseerd agrarisch loonwerk;

      b. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van glastuinbouwactiviteiten of activiteiten die
      daar direct mee verband houden, als bedoeld in het [Besluit glastuinbouw][ref1].

      c. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij witloftrek;

      d. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij paddestoelenteelt;

      e. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van
      landbouwgewassen in potten, containers of substraat op een dichte of doorlatende ondergrond;

      f. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van vaste
      planten in een waterbassin;

      g. het lozen en het gebruiken van bestrijdingsmiddelen vanuit respectievelijk op wetenschappelijke
      onderzoeksinstellingen;

      h. het lozen ten gevolge van het spoelen van landbouwgewassen die uitsluitend of in hoofdzaak afkomstig zijn van
      agrarische activiteiten van derden;

      i. het lozen van huishoudelijk afvalwater met een omvang van meer dan 10 inwonerequivalenten, behoudens het
      omvangrijk lozen waarbij de afstand tot de dichtstbijzijnde riolering waarop kan worden aangesloten, gemeten vanaf
      de plaats waar dat afvalwater ontstaat, minder bedraagt dan:

      1°. 100 m bij 10 tot 25 inwonerequivalenten,

      2°. 600 m bij 25 tot 50 inwonerequivalenten,

      3°. 1500 m bij 50 tot 100 inwonerequivalenten en

      4°. 3000 m bij meer dan 100 inwonerequivalenten doch niet meer dan 200 inwonerequivalenten;

      j. het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van bloembollen
      of -knollen op hetzelfde gewasperceel gedurende een periode van twee of meer achtereenvolgende teeltseizoenen in de
      in [bijlage II][ref2] bij dit besluit aangewezen gebieden;

      k. het lozen en het gebruiken van bestrijdingsmiddelen waarvoor op de datum van het inwerking treden van dit
      besluit

      1°. door de beheerder een aanvraag voor een vergunning op grond van
      [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref3] is ontvangen dan wel

      2°. een zodanige vergunning van kracht is, tenzij door de beheerder een aanvraag om intrekking is ontvangen vóór de
      datum van inwerking treden van het besluit;

      l. het lozen vanuit inrichtingen die behoren tot een categorie als bedoeld in bijlage I van de richtlijn (EG) nr.
      96/61/EG van de Raad van de Europese Unie van 24 september 1996 inzake geïntegreerde preventie en bestrijding van
      verontreiniging (PbEG L 257);

      m. het lozen ten gevolge van het sorteren of transporteren van landbouwgewassen.

      2 De verboden, bedoeld in [artikel 6.2 van de wet][ref4], gelden niet voor het lozen met betrekking waartoe dit
      besluit van toepassing is.

      3 Degene die agrarische activiteiten dan wel activiteiten die daarmee verband houden uitvoert neemt de bij en
      krachtens dit besluit gestelde voorschriften in acht.


