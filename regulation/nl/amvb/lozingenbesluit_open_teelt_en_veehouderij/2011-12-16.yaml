preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 30 juni 1999, nr. CDJZ/BVW 967-99, en de
    Staatssecretaris van Landbouw, Natuurbeheer en Visserij, gedaan mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer, Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris
    van Sociale Zaken en Werkgelegenheid, drs. J.F. Hoogervorst;

    Gelet op de richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1991, 91/676/EEG (PbEG L375)
    inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen, gelet op de artikelen
    1, 2a, 2b, 2c, tweede lid, van de Wet verontreiniging oppervlaktewateren en mede gelet op artikel 13 van de
    Bestrijdingsmiddelenwet 1962, voorzover het betreft de artikelen 1, 2, 3, 5, 13, 14, 15, 17, 21 en 25;

    De Raad van State gehoord (advies van 18 november 1999, no. W09.99.0322/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van, nr. CDJZ/2000-83 en
    de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze Minister van Volksgezondheid, Welzijn en Sport en de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *afvalwater:* alle water waarvan de houder zich – met het oog op de verwijdering daarvan – ontdoet, voornemens
      is zich te ontdoen of zich moet ontdoen;

      b. *agrarische activiteiten:* een geheel van activiteiten die betrekking hebben op landbouwgewassen en
      landbouwhuisdieren als bedoeld in [bijlage I][ref1] bij dit besluit;

      c. *beperkt lozen:* lozen van 10 inwonerequivalenten of minder;

      d. *bestaand lozen:* lozen dat reeds voor het tijdstip van het in werking treden van het besluit plaatsvond;

      e. *bestrijdingsmiddel*: gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen of biociden][ref2];

      f. *biologische teelt:* teelt uitgevoerd overeenkomstig het bepaalde bij of krachtens het
      [Landbouwkwaliteitsbesluit 2007][ref3];

      g. *condenswater:* water dat bij afkoeling van lucht in koelinstallaties en langs koude oppervlakken in
      bewaarruimten ontstaat;

      h. *controlevoorziening:* voorziening ten behoeve van het nemen van monsters;

      i. *driftarme dop:* een spuitdop die in het toe te passen drukbereik vergeleken met de grensdop van de klasse fijn
      en midden volgens de British Crop Protection Council (BCPC)-klassificatie (31-030-F110 bij 3 bar), een 50% kleiner
      volumepercentage druppels met een diameter kleiner dan 100 μm produceert;

      j. *emissiescherm:* tijdens het gebruiken van een bestrijdingsmiddel of bladmeststof aanwezige, aan de grond
      verankerde barrière van ondoorlatend materiaal of van gaas met een windreductie van 50% of meer, die van tenminste
      gelijke hoogte is als de bovenste in gebruik zijnde spuitdop van de gebruikte apparatuur én van tenminste gelijke
      hoogte als het gewas op het perceel, die het verwaaien van spuitvloeistof naar een oppervlaktewaterlichaam beperkt,
      die met uitzondering van een doorrijscherm op de kopakker aaneengesloten is;

      k. *gewasbed:* strook beteelde grond die in de breedte wordt begrensd door een strook onbeteelde grond;

      l. *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref4];

      m. *hemelwater:* water dat als gevolg van neerslag op het perceel, het erf of de gebouwen terechtkomt;

      n. *huishoudelijk afvalwater:* afvalwater dat naar zijn aard en samenstelling overeenkomt met afvalwater afkomstig
      van een particulier huishouden;

      o. *insteek van een oppervlaktewaterlichaam:* snijpunt van de raaklijnen van het talud en het horizontale maaiveld;

      p. *kantdop:* driftarme dop die als gevolg van de constructie en bevestiging aan de veldspuitapparatuur een
      tophoek van maximaal 90° kent en aan de zijde van een oppervlaktewaterlichaam een verticale of nagenoeg verticale
      neerwaartse richting van het bestrijdingsmiddel creëert;

      q. *kantstrooivoorziening:* voorziening die tijdens het toedienen van korrel- en poedervormige meststoffen
      bewerkstelligt dat de verspreiding van die meststoffen richting een oppervlaktewaterlichaam wordt verhinderd;

      r. *lozen:* het brengen van stoffen in een oppervlaktewaterlichaam als bedoeld in
      [artikel 6.2, eerste lid, van de Waterwet][ref5];

      s. *luchtondersteuning:* voorziening aan de spuitboom van veldspuitapparatuur, waarbij een separate luchtstroom een
      geforceerde neerwaartse richting van het bestrijdingsmiddel creëert;

      t. *meststoffen:* stoffen als bedoeld in [artikel 1, onderdeel d, van de Meststoffenwet][ref6];

      u. *NEN:* door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;

      v. *nieuw lozen:* lozen dat geen bestaand lozen is;

      w. *omvangrijk lozen:* lozen van meer dan 10 doch niet meer dan 200 inwonerequivalenten;

      x. *Onze Minister:* Onze Minister van Verkeer en Waterstaat;

      y. *Onze Ministers:* Onze Minister en Onze Minister van Landbouw, Natuur en Voedselkwaliteit

      z. *overkapte beddenspuit:* apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen waarbij de
      spuitdoppen gemonteerd zijn binnen een overkapping, die met uitzondering van de voor- en de achterzijde van de
      apparatuur, het gewasbed min of meer omsluit en waarbij per gewasbed een eenheid van spuitleiding en overkapping
      wordt gebruikt;

      aa. *reflectiescherm:* verticale constructie aan een apparaat dat bestemd is voor het gebruiken van
      bestrijdingsmiddelen, met een zodanige hoogte en breedte dat het verwaaien van spuitnevel wordt beperkt;

      bb. *riolering:* voorziening voor de inzameling en het transport van afvalwater als bedoeld in
      [artikel 10.30 van de Wet milieubeheer][ref7] of een daarop aangesloten bedrijfsriolering;

      cc. *spuitdop:* uitstroomopening van apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen die
      in staat is spuitvloeistof zo te verdelen in druppels dat er op de grond of op het landbouwgewas een regelmatige
      verdeling ontstaat;

      dd. *spuitgeweer:* apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen bestaande uit een
      spuitleiding die is voorzien van één spuitdop die met de hand wordt vastgehouden en bediend;

      ee. *teeltvrije zone:* strook tussen de insteek van een oppervlaktewaterlichaam en het te telen gewas waarop,
      behoudens grasland, geen gewas of niet hetzelfde gewas als op de rest van het perceel wordt geteeld;

      ff. *testcertificaat:* schriftelijke verklaring, afgegeven door een deskundig, onafhankelijk instituut, waaruit
      blijkt dat een driftarme dop, die bij het gebruiken van gewasbeschermingsmiddelen wordt toegepast, voldoet aan de
      bij of krachtens dit besluit gestelde eisen ten aanzien van driftarme doppen;

      gg. *tunnelspuit:* apparatuur die is bestemd voor het gebruiken van bestrijdingsmiddelen in een gewasrij waarbij
      het verwaaien van spuitnevel wordt beperkt door een constructie die de gewasrij geheel of gedeeltelijk omsluit;

      hh. *vanggewas:* tijdens het gebruiken van een bestrijdingsmiddel aanwezige barrière van bomen, struiken of
      andere gewassen welke van tenminste gelijke hoogte is als de bovenste in gebruik zijnde spuitdop van de gebruikte
      apparatuur én van tenminste gelijke hoogte als het gewas op het perceel, die het verwaaien van spuitvloeistof naar
      een oppervlaktewaterlichaam beperkt, die met uitzondering van een doorrijscherm op de kopakker aaneengesloten is;

      ii. *veldspuitapparatuur:* mechanisch voortbewogen apparatuur die bestemd is voor het gebruiken van
      bestrijdingsmiddelen, bestemd voor bovengrondse volveldsbehandeling in buitenteelten, die een overwegend
      neerwaartse uitstroming van de spuitvloeistof bewerkstelligt;

      jj. *wet:* [Waterwet][ref8].

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen, wordt de afstand tot de dichtstbijzijnde
      riolering berekend langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden
      aangelegd.

      3 Voor de toepassing van dit besluit en de daarop berustende bepalingen, wordt in uiterwaarden en buitendijkse
      gebieden onder oppervlaktewaterlichaam verstaan: beddingen waarin ten tijde van het lozen een aan het aardoppervlak
      en de open lucht grenzende watermassa voorkomt.

      4 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt het aantal inwonerequivalenten van
      een lozing van huishoudelijk afvalwater berekend door:

      a. het aantal kubieke meters gebruikt water per 365 dagen te vermenigvuldigen met de factor 0,023, of

      b. het aantal mandagen per 365 dagen te vermenigvuldigen met de factor 0,0011.

      5 Dit besluit berust voor de [artikelen 1][ref9], [2][ref10], [3][ref11], [5][ref12], [13][ref13],
      [15][ref14], [17][ref15], [21][ref16] en [25][ref17] mede op de [artikelen 79][ref18] en
      [80 van de Wet gewasbeschermingsmiddelen en biociden][ref19].


