    text: |-
      1 Met betrekking tot het lozen ten gevolge van het spoelen van landbouwgewassen worden de voorschriften, gesteld
      bij of krachtens het tweede tot en met het veertiende lid, in acht genomen.

      2 Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het te lozen afvalwater ontstaat een
      riolering aanwezig is.

      3 Het spoelproces is onderverdeeld in voorspoelen en naspoelen, waarbij de uitsleep van water uit het voorspoelen
      zo veel mogelijk wordt voorkomen en de hoeveelheid naspoelwater wordt geminimaliseerd.

      4 Binnen het spoelproces vindt hergebruik van spoelwater plaats.

      5 Er wordt uitsluitend naspoelwater geloosd.

      6 Het lozen van naspoelwater is alleen toegestaan, indien het naspoelwater niet kan worden benut voor hergebruik.

      7 Het lozen van naspoelwater vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.

      8 In enig monster van het te lozen naspoelwater bedraagt het gehalte aan onopgeloste bestanddelen niet meer dan 100
      mg/l, bepaald volgens NEN 6621, uitgave 1988.

      9 Het naspoelwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een
      doelmatige en goed toegankelijke controlevoorziening.

      10 Indien aan het desbetreffende oppervlaktewaterlichaam in een plan, vastgesteld ingevolge de [Waterwet][ref1],
      een bijzondere functie of waterkwaliteitsdoelstelling is toegekend kan de beheerder ten aanzien van het spoelproces
      nadere eisen stellen die voor de kwaliteit van dat oppervlaktewaterlichaam voldoende bescherming bieden.

      11 Indien blijkens een toxiciteitsproef in enig monster van het op het desbetreffende oppervlaktewaterlichaam te
      lozen water sprake is van acute toxiciteit voor waterorganismen kan de beheerder ten aanzien van het spoelproces
      nadere eisen stellen die voor de kwaliteit van dat oppervlaktewaterlichaam voldoende bescherming bieden.

      12 De beheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de controlevoorziening,
      bedoeld in het negende lid.

      13 Het derde tot en met het zesde lid is niet van toepassing op het spoelen van:

      a. prei, indien voorafgaand aan het spoelen vervuiling met de buitenste bladeren van het gewas is verwijderd;

      b. asperges.

      14 Het zevende tot en met het negende lid zijn van overeenkomstige toepassing op het water afkomstig van het
      spoelen van gewassen als bedoeld in het dertiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
