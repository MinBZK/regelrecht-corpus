      1 Met betrekking tot het lozen van koel- en condenswater worden de voorschriften, gesteld bij of krachtens het
      tweede tot en met het zesde lid, in acht genomen.

      2 Het te lozen koelwater is uitsluitend thermisch verontreinigd en is niet warmer dan 30° C.

      3 De beheerder kan in het belang van de kwaliteit van een oppervlaktewaterlichaam nadere eisen stellen ten aanzien
      van het gehalte aan chloride, ijzer of zuurstof of organische stoffen in het te lozen koelwater. Daarbij mag het
      gehalte niet bepaald worden op een waarde:

        - 1° lager dan 200 mg/l voor chloride;
        - 2° lager dan 2 mg/l voor ijzer;
        - 3° hoger dan 5 mg/l voor zuurstof;
        - 4° lager dan 15 mg/l voor organische stof.

      4 Het te lozen koel- of condenswater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander
      afvalwater een doelmatige en goed toegankelijke controlevoorziening.

      5 Condenswater wordt niet geloosd, indien dit afkomstig is uit ruimten waarin bestrijdingsmiddelen worden
      toegepast.

      6 De beheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de controlevoorziening,
      bedoeld in het vierde lid.
