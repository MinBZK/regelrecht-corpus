  - number: '20'
    text: |-
      Indien zich als gevolg van agrarische activiteiten dan wel van activiteiten die daarmee verband houden een ongewoon
      voorval voordoet of heeft voorgedaan, waardoor nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam
      zijn ontstaan of dreigen te ontstaan,

      a. worden onmiddellijk de maatregelen genomen die redelijkerwijs verlangd kunnen worden om de gevolgen van die
      gebeurtenis te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, om deze zoveel mogelijk te
      beperken en ongedaan te maken;

      b. wordt zo spoedig mogelijk, doch uiterlijk binnen 8 uur, melding gemaakt van het voorval aan de beheerder van het
      desbetreffende oppervlaktewaterlichaam;

      c. worden onverwijld alle maatregelen die de beheerder voorschrijft ter voorkoming van verdere verontreiniging van
      een oppervlaktewaterlichaam getroffen.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel20
  - number: '21'
    text: |-
      De bij of krachtens de [artikelen 13][ref1] en [15][ref2] gestelde voorschriften zijn niet van toepassing indien
      de directeur van de Plantenziektenkundige Dienst, of deze directeur namens Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit op grond van of krachtens [artikel 3 van de Plantenziektenwet][ref3], de gebruiker van
      gewasbeschermingsmiddelen heeft aangezegd deze middelen te gebruiken ter voorkoming van het optreden en van de
      verbreiding van schadelijke organismen en ter bestrijding daarvan, dan wel de verplichting tot dit gebruik op grond
      van of krachtens [artikel 3 van de Plantenziektenwet][ref4] aan deze gebruiker is opgelegd.


