  - number: '25'
    text: |-
      In afwijking van [artikel 13, zesde lid][ref1], bedraagt de teeltvrije zone van percelen die niet breder
      zijn dan 70 m en aan de zijde parallel of nagenoeg parallel aan de gewasrijen worden begrensd door een
      oppervlaktewaterlichaam tot 1 januari 2010 tenminste 150 cm, indien bij de bespuiting van de buitenste gewasrij
      geen gebruik wordt gemaakt van naar een oppervlaktewaterlichaam gerichte apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
