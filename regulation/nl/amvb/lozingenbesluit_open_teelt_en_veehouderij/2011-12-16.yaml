      1 Met betrekking tot het lozen ten gevolge van het reinigen van gebouwen of opstallen waarin agrarische
      activiteiten dan wel activiteiten die daarmee verband houden plaatsvinden worden de voorschriften, gesteld bij of
      krachtens het tweede tot en met het achtste lid, in acht genomen.

      2 Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat een riolering
      aanwezig is.

      3 Afvalwater dat afkomstig is uit stallen, ruimten waarin bestrijdingsmiddelen worden toegepast of worden
      opgeslagen, ruimten waarin meststoffen worden opgeslagen dan wel ruimten waarin onderhoud aan voertuigen,
      werktuigen of apparaten plaatsvindt, wordt niet geloosd.

      4 Afvalwater waarin reinigings- of ontsmettingsmiddelen voorkomen en afvalwater dat vrijkomt bij het schoonmaken
      van onderdelen die afkomstig zijn uit de in het eerste lid bedoelde gebouwen of opstallen en in aanraking zijn
      geweest met bestrijdingsmiddelen of meststoffen, wordt niet geloosd.

      5 Het lozen van afvalwater dat vrijkomt ten gevolge van het reinigen van gebouwen en opstallen als bedoeld in het
      eerste lid, vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.

      6 In enig monster van het te lozen afvalwater bedraagt het gehalte aan onopgeloste bestanddelen niet meer dan 100
      mg/l, bepaald volgens NEN 6621, uitgave 1988.

      7 Het te lozen afvalwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater
      een doelmatige en goed toegankelijke controlevoorziening.

      8 De beheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de controlevoorziening.
