  - number: 1b
    text: |-
      [Hoofdstuk 6 van de Waterwet][ref1] is mede van toepassing op handelingen waaromtrent regels zijn gesteld bij of
      krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref2], voor zover die handelingen plaatsvinden bij het
      verrichten van agrarische activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0021670
