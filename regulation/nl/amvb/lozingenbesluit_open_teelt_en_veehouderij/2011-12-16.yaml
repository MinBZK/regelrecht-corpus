    text: |-
      1 Met betrekking tot het lozen van huishoudelijk afvalwater worden de voorschriften, gesteld bij of krachtens het
      tweede tot en met het tiende lid, in acht genomen.

      2 Beperkt lozen is verboden, indien de afstand tot de dichtstbijzijnde riolering gemeten vanaf de plaats waar het
      afvalwater ontstaat, 40 m of minder bedraagt.

      3 Omvangrijk lozen, binnen de afstanden als bedoeld in [artikel 2, onderdeel i, onder 1° tot en met 4°][ref1],
      is verboden.

      4 Indien de in het tweede lid bedoelde afstand meer bedraagt dan 40 m, wordt het afvalwater door een voorziening
      voor de individuele behandeling van afvalwater geleid waarmee de nadelige gevolgen voor de kwaliteit van een
      oppervlaktewaterlichaam zoveel mogelijk worden voorkomen.

      5 Bij bestaand beperkt lozen kan de beheerder, in een geval als bedoeld in het vierde lid, nadere eisen stellen
      aan de voorziening indien aan het desbetreffende oppervlaktewaterlichaam in een plan, vastgesteld ingevolge de
      [Waterwet][ref2], een bijzondere functie of waterkwaliteitsdoelstelling is toegekend. De eisen kunnen worden
      gesteld ten aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik en het onderhoud van de
      voorziening, alsmede de aanwezigheid, de uitvoering en de situering van een controlevoorziening.

      6 Bij nieuw beperkt lozen kan de beheerder, in een geval als bedoeld in het vierde lid, nadere eisen stellen ten
      aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik of het onderhoud van de voorziening,
      alsmede de aanwezigheid, de uitvoering en de situering van een controlevoorziening.

      7 Tenzij toepassing is gegeven aan het vijfde of zesde lid, wordt alleen aan de eis van het vierde lid voldaan,
      indien het afvalwater wordt geleid door een septic tank die is uitgevoerd overeenkomstig de voorschriften gesteld
      krachtens [artikel 7, tweede lid, van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref3].

      8 De septic tank wordt zo dikwijls geledigd als voor een goede werking daarvan noodzakelijk is.

      9 Het is verboden de bij het ledigen van de septic tank vrijkomende stoffen te lozen.

      10 In afwijking van het zevende lid kan worden volstaan met een voorziening die wat het zuiveringsrendement betreft
      tenminste gelijkwaardig is aan een voorziening als bedoeld in dat lid, indien voldaan wordt aan door de beheerder
      te stellen nadere eisen ten aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik of het
      onderhoud van de voorziening.


