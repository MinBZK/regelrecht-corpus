  - number: '17'
    text: |-
      1 Het is verboden apparatuur, die bestemd is voor het gebruiken van gewasbeschermingsmiddelen, vanuit of nabij een
      oppervlaktewaterlichaam te vullen, tenzij daarbij het tweede en het derde lid in acht worden genomen.

      2 Bij uit een oppervlaktewaterlichaam vullen van apparatuur die bestemd is voor het gebruiken van
      gewasbeschermingsmiddelen wordt een voorziening getroffen die terugstroming van het mengsel van
      gewasbeschermingsmiddelen en water voorkomt.

      3 Het vullen van de apparatuur die gebruikt wordt voor het gebruiken van gewasbeschermingsmiddelen vindt op een
      afstand van tenminste 2 m van de insteek van een oppervlaktewaterlichaam plaats.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel17
  - number: '18'
    text: |-
      1 In afwijking van [artikel 6, tweede lid][ref1], [artikel 7, derde lid, onder a][ref2],
      [artikel 8, tweede lid][ref3], [artikel 9, tweede lid][ref4] en [artikel 10, tweede lid][ref5], is lozen
      toegestaan, indien krachtens de [Wet milieubeheer][ref6] is bepaald dat het desbetreffende afvalwater niet of niet
      volledig op een riolering wordt gebracht.

      2 [Artikel 6 , vierde tot en met tiende lid][ref7], [artikel 7, derde lid, onderdelen b en c, en vierde lid][ref8],
      [artikel 8, derde tot en met elfde lid][ref9], [artikel 9, derde tot en met zesde lid][ref10], en
      [artikel 10, derde tot en met achtste lid][ref11], zijn van overeenkomstige toepassing op het in het eerste lid
      bedoelde lozen.


