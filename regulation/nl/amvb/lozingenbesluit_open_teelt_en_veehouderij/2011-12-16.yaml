      1 Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van gewasbescherming
      worden de voorschriften, gesteld bij of krachtens het derde tot en met het veertiende lid, in acht genomen.

      2 Met betrekking tot het gebruiken van gewasbeschermingsmiddelen worden de voorschriften, gesteld bij of krachtens
      het derde tot en met het veertiende lid, in acht genomen.

      3 Langs een oppervlaktewaterlichaam wordt een teeltvrije zone aangehouden.

      4 De teeltvrije zone bedraagt bij de teelt van NAK-pootaardappelen, consumptieaardappelen, fabrieksaardappelen
      inclusief pootgoed, poot- en plantuien, zaaiuien, bloembollen en -knollen, aardbeien, asperges, prei, schorseneren,
      sla, was- en bospenen, winterpenen, vaste planten, en in neerwaartse richting te bespuiten boomkwekerijgewassen,
      als bedoeld in [bijlage I][ref1] bij dit besluit:

      a. tenminste 150 cm;

      b. tenminste 100 cm, indien gebruik gemaakt wordt van:

      1°. veldspuitapparatuur met luchtondersteuning,

      2°. een overkapte beddenspuit,

      3°. een motorisch aangedreven handgedragen spuit,

      4°. vanggewas, of

      c. tenminste 50 cm, indien gebruik gemaakt wordt van een handmatig aangedreven handgedragen spuit.

      5 De teeltvrije zone bedraagt bij de teelt van in opwaartse of zijwaartse richting te bespuiten
      boomkwekerijgewassen als bedoeld in bijlage I bij dit besluit tenminste 500 cm.

      6 De teeltvrije zone bedraagt bij de teelt van appelen, peren en overige pit- en steenvruchten:

      a. tenminste 900 cm;

      b. tenminste 450 cm, indien gebruik wordt gemaakt van een reflectiescherm;

      c. tenminste 300 cm, indien:

      1°. gebruik wordt gemaakt van een tunnelspuit,

      2°. gebruik wordt gemaakt van een vanggewas,

      3°. sprake is van biologische teelt, of

      4°. gebruik wordt gemaakt van een dwarsstroomspuit met reflectiescherm en van een emissiescherm, waarvan geen
      afdruipende gewasbeschermingsmiddelen in een oppervlaktewaterlichaam kunnen geraken;

      d. met ingang van een bij koninklijk besluit te bepalen tijdstip, tenminste 300 cm, indien gebruik wordt gemaakt
      van een dwarsstroomspuit en bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van naar een
      oppervlaktewaterlichaam gerichte apparatuur en slechts gebruik wordt gemaakt van spuitdoppen waarvan door een
      deskundig, onafhankelijk instituut is vastgesteld dat het gebruik van die spuitdoppen bij die wijze van bespuiten
      resulteert in een driftdepositie in een oppervlaktewaterlichaam in de volbladsituatie van ten hoogste 1,5%.

      7 In afwijking van het zesde lid, onderdeel a, bedraagt de teeltvrije zone langs de kopakker tenminste 600 cm,
      indien bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van naar een oppervlaktewaterlichaam
      gerichte apparatuur.

      8 De teeltvrije zone bedraagt bij de teelt van:

      a. grasland, graszaad, haver, rogge, spelt, teff, triticale, vlas, zomertarwe, wintertarwe, zomergerst en
      wintergerst tenminste 25 cm;

      b. overige landbouwgewassen met uitzondering van de landbouwgewassen genoemd in het vierde tot en met zesde lid,
      tenminste 50 cm.

      9 In afwijking van het vierde lid, het zesde lid, onderdelen b tot en met d, en het achtste lid bedraagt de
      teeltvrije zone langs de in de [bijlage bij artikel 3 van het Uitvoeringsbesluit Meststoffenwet][ref2] aangewezen
      oppervlaktewaterlichamen tenminste 500 cm.

      10 De teeltvrije zone bedoeld in het vierde tot en met het negende lid, wordt gemeten vanaf de insteek van een
      oppervlaktewaterlichaam en strekt zich, met uitzondering van de teelt van grasland, uit tot het hart van de
      buitenste planten van de te telen landbouwgewassen.

      11 Bij aanwezigheid van een talud dat breder is dan 200 cm kan de beheerder bij nadere eis een minder brede
      teeltvrije zone voorschrijven dan bedoeld in het vierde tot en met het tiende lid. In gevallen waarin toepassing is
      gegeven aan de vorige volzin, zijn die bepalingen niet van toepassing.

      12 Indien aan het desbetreffende oppervlaktewaterlichaam in een plan, vastgesteld ingevolge de [Waterwet][ref3],
      een bijzondere functie of waterkwaliteitsdoelstelling is toegekend, kan de beheerder bij nadere eis een bredere
      teeltvrije zone voorschrijven dan bedoeld in het vierde tot en met het tiende lid. In gevallen waarin toepassing is
      gegeven aan de vorige volzin, zijn die bepalingen niet van toepassing.

      13 In afwijking van het derde lid behoeft een teeltvrije zone niet te worden aangehouden langs andere dan de in het
      negende lid bedoelde oppervlaktewaterlichamen:

      a. bij de teelt van appelen, peren en overige pit- en steenvruchten van bomen, waarvan de laagste gesteltak op
      175 cm of hoger uit de stam ontspringt, indien binnen een afstand van ten minste 900 cm vanaf de insteek van een
      oppervlaktewaterlichaam geen gewasbeschermingsmiddelen worden toegepast;

      b. bij teelt anders dan de teelt van appelen, peren en overige pit- en steenvruchten, indien:

      1°. sprake is van biologische teelt;

      2°. gebruik wordt gemaakt van een emissiescherm, waarvan geen afdruipende gewasbeschermingsmiddelen in een
      oppervlaktewaterlichaam kunnen geraken.

      14 In afwijking van het derde lid behoeft een teeltvrije zone niet te worden aangehouden langs gegraven waterlopen,
      die van 1 april tot 1 oktober onder normale omstandigheden geen water bevatten, mits daaraan niet in een plan,
      vastgesteld ingevolge de [Waterwet][ref4], een bijzondere functie of waterkwaliteitsdoelstelling is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011133
      [ref2]: https://wetten.overheid.nl/BWBR0019031
      [ref3]: https://wetten.overheid.nl/BWBR0025458
      [ref4]: https://wetten.overheid.nl/BWBR0025458
