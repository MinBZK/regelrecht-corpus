  - number: '22'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Landbouw, Natuur- en Voedselkwaliteit en Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer binnen vier jaar na de inwerkingtreding van dit besluit
      en vervolgens telkens na vier jaar aan de Staten-Generaal een verslag over de mate waarin dit besluit bijdraagt aan
      het behalen van de waterkwaliteitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel22
  - number: '23'
    text: |-
      1 Indien binnen de in [artikel 6, tweede lid][ref1], bepaalde afstand riolering wordt aangelegd waarop aangesloten
      kan worden, is bestaand beperkt lozen, in afwijking van [artikel 6, tweede lid][ref2], toegestaan gedurende 5 jaar
      vanaf het tijdstip waarop aansluiting op de riolering mogelijk is, indien het afvalwater door een voorziening wordt
      geleid die voldoet aan de voorschriften gesteld krachtens [artikel 6][ref3].

      2 Indien binnen de afstanden genoemd in [artikel 2, onderdeel i, onder 1° tot en met 4°][ref4]
      riolering wordt aangelegd waarop aangesloten kan worden, is bestaand omvangrijk lozen, in afwijking van
      [artikel 6, derde lid][ref5], toegestaan gedurende:

      a. 5 jaar vanaf het tijdstip waarop aansluiting op de riolering mogelijk is met dien verstande, dat
      [artikel 6, vierde, vijfde en zesde lid][ref6], van overeenkomstige toepassing is;

      b. 3 jaar vanaf het tijdstip waarop aansluiting op de riolering mogelijk is, in de overige gevallen.

      3 In afwijking van het eerste en tweede lid zijn de overgangsbepalingen uit
      [hoofdstuk V van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref7] van toepassing op lozen dat tot het moment
      van inwerkingtreding van het onderhavige besluit door eerstgenoemd besluit werd geregeld.


