      1 Met betrekking tot het lozen ten gevolge van het wassen of uitwendig reinigen van voertuigen, werktuigen of
      apparaten worden de voorschriften, gesteld bij of krachtens het tweede tot en met het vijfde lid, in acht genomen.

      2 Afvalwater dat afkomstig is van het op verhard oppervlak wassen of uitwendig reinigen van voertuigen, werktuigen
      of apparaten die bestemd zijn voor het gebruiken van bestrijdingsmiddelen of meststoffen, wordt niet geloosd.

      3 Indien het wassen of uitwendig reinigen van voertuigen, werktuigen of apparaten op verhard oppervlak plaatsvindt
      dan is lozen verboden tenzij:

      a. binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat geen riolering aanwezig is;

      b. het gehalte minerale olie in enig monster van het te lozen afvalwater niet meer dan 20 mg/l, bepaald volgens
      NEN-EN-ISO 9377-2, uitgave december 2000, bedraagt en het gehalte onopgeloste bestanddelen niet meer dan 100 mg/l,
      bepaald volgens NEN 6621, uitgave 1988, bedraagt en

      c. het te lozen afvalwater voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een
      doelmatige en goed toegankelijke controlevoorziening doorloopt.

      4 De beheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de controlevoorziening.

      5 Indien het wassen of uitwendig reinigen niet op verhard oppervlak plaatsvindt, wordt een zodanige afstand van
      het te reinigen voertuig, werktuig of apparaat tot de insteek van een oppervlaktewaterlichaam aangehouden dat geen
      lozen plaatsvindt. De aan te houden afstand bedraagt tenminste 5 m.
