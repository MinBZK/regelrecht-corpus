      1 Met betrekking tot het lozen ten gevolge van de ontijzering van grondwater worden de voorschriften, gesteld bij
      of krachtens het tweede tot en met het zesde lid, in acht genomen.

      2 Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat een riolering
      aanwezig is.

      3 Het lozen vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.

      4 In enig monster van het te lozen afvalwater bedraagt het gehalte aan ijzer niet meer dan 5 mg/l, bepaald volgens
      NEN 6426, uitgave 1995.

      5 Het te lozen afvalwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater
      een doelmatige en goed toegankelijke controlevoorziening.

      6 De beheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2011-12-16#Artikel9
