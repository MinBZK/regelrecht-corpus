        bwb_id: BWBR0021670
        artikel: '80'
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op het lozen en het gebruiken van bestrijdingsmiddelen nabij oppervlaktewater ten
      gevolge van agrarische activiteiten dan wel van activiteiten die daarmee verband houden, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.a
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen vanuit respectievelijk op bedrijfsterreinen die in belangrijke
      mate bestemd zijn voor technische dienstverlening aan derden voor gemechaniseerd agrarisch loonwerk;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.b
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van glastuinbouwactiviteiten of activiteiten die
      daar direct mee verband houden, als bedoeld in het [Besluit glastuinbouw][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: 2.1.c
    text: het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij witloftrek;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.d
    text: het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij paddestoelenteelt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.e
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van
      landbouwgewassen in potten, containers of substraat op een dichte of doorlatende ondergrond;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.f
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van vaste planten
      in een waterbassin;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.g
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen vanuit respectievelijk op wetenschappelijke
      onderzoeksinstellingen;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.h
    text: |-
      het lozen ten gevolge van het spoelen van landbouwgewassen die uitsluitend of in hoofdzaak afkomstig zijn van
      agrarische activiteiten van derden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.i
    text: |-
      het lozen van huishoudelijk afvalwater met een omvang van meer dan 10 inwonerequivalenten, behoudens het omvangrijk
      lozen waarbij de afstand tot de dichtstbijzijnde riolering waarop kan worden aangesloten, gemeten vanaf de plaats
      waar dat afvalwater ontstaat, minder bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.i.1°
    text: 100 m bij 10 tot 25 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.i.2°
    text: 600 m bij 25 tot 50 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.i.3°
    text: 1500 m bij 50 tot 100 inwonerequivalenten en
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.i.4°
    text: 3000 m bij meer dan 100 inwonerequivalenten doch niet meer dan 200 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.j
    text: |-
      het lozen en het gebruiken van bestrijdingsmiddelen ten gevolge van respectievelijk bij de teelt van bloembollen of
      -knollen op hetzelfde gewasperceel gedurende een periode van twee of meer achtereenvolgende teeltseizoenen in de in
      [bijlage II][ref1] bij dit besluit aangewezen gebieden;


      [ref1]: https://wetten.overheid.nl/BWBR0011133
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011133
  - number: 2.1.k
    text: het lozen en het gebruiken van bestrijdingsmiddelen waarvoor op de datum van het inwerking treden van dit besluit
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.k.1°
    text: |-
      door de waterkwaliteitsbeheerder een aanvraag voor een vergunning op grond van [artikel 1 van de wet][ref1] is
      ontvangen dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: 2.1.k.2°
    text: |-
      een zodanige vergunning van kracht is, tenzij door de waterkwaliteitsbeheerder een aanvraag om intrekking is
      ontvangen vóór de datum van inwerking treden van het besluit;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.l
    text: |-
      het lozen vanuit inrichtingen die behoren tot een categorie als bedoeld in bijlage I van de richtlijn (EG) nr.
      96/61/EG van de Raad van de Europese Unie van 24 september 1996 inzake geïntegreerde preventie en bestrijding van
      verontreiniging (PbEG L 257);
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: 2.1.m
    text: het lozen ten gevolge van het sorteren of transporteren van landbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: '2.2'
    text: |-
      De verboden, bedoeld in [artikel 1, eerste en derde lid, van de wet][ref1], gelden niet voor het lozen met
      betrekking waartoe dit besluit van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '2.3'
    text: |-
      Degene die agrarische activiteiten dan wel activiteiten die daarmee verband houden uitvoert neemt de bij en
      krachtens dit besluit gestelde voorschriften in acht.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel2
  - number: '3'
    text: |-
      Indien een voorschrift dat is opgenomen in dit besluit inhoudt dat daarbij aangegeven middelen ter voorkoming
      of beperking van verontreiniging van het oppervlaktewater moeten worden toegepast, kan degene die agrarische
      activiteiten uitvoert andere middelen toepassen mits hij, voordat hij die andere middelen toepast, aan de
      waterkwaliteitsbeheerder aantoont dat met de door hem gekozen middelen een tenminste gelijkwaardige bescherming van
      het oppervlaktewater wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel3
  - number: '4.1'
    text: |-
      Bij agrarische activiteiten dan wel activiteiten die daarmee verband houden wordt voldoende zorg in acht genomen om
      verontreiniging van het oppervlaktewater te voorkomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel4
  - number: '4.2'
    text: |-
      De zorg, bedoeld in het eerste lid, houdt in ieder geval in dat een ieder die weet of redelijkerwijs kan vermoeden
      dat door zijn handelen of nalaten het oppervlaktewater kan worden verontreinigd, verplicht is dergelijk handelen
      achterwege te laten voorzover zulks in redelijkheid kan worden gevergd, dan wel alle maatregelen te nemen
      die redelijkerwijs van hem kunnen worden gevergd teneinde die verontreiniging te voorkomen of, voorzover die
      verontreiniging niet kan worden voorkomen, deze zoveel mogelijk te beperken of ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel4
  - number: '5.1'
    text: Lozen is verboden.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: '5.2'
    text: 'In afwijking van het eerste lid is lozen toegestaan, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: 5.2.a
    text: |-
      huishoudelijk afvalwater, met inachtneming van de voorschriften, genoemd in [artikel 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
  - number: 5.2.b
    text: |-
      lozen ten gevolge van het wassen of uitwendig reinigen van voertuigen, werktuigen of apparaten, met inachtneming
      van de voorschriften, genoemd in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel7
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '7'
        hoofdstuk: II
  - number: 5.2.c
    text: |-
      lozen ten gevolge van het spoelen van landbouwgewassen, met inachtneming van de voorschriften, genoemd in
      [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel8
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '8'
        hoofdstuk: II
  - number: 5.2.d
    text: |-
      lozen ten gevolge van de ontijzering van grondwater, met inachtneming van de voorschriften, genoemd in
      [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel9
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '9'
        hoofdstuk: II
  - number: 5.2.e
    text: |-
      lozen ten gevolge van het reinigen van gebouwen of opstallen waarin agrarische activiteiten dan wel activiteiten
      die daarmee verband houden plaatsvinden, met inachtneming van de voorschriften, genoemd in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel10
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '10'
        hoofdstuk: II
  - number: 5.2.f
    text: |-
      lozen van koel- en condenswater, met inachtneming van de voorschriften, genoemd in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel11
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '11'
        hoofdstuk: II
  - number: 5.2.g
    text: |-
      lozen van hemelwater en water dat bij het reinigen van verhard oppervlak vrijkomt, met inachtneming van de
      voorschriften, genoemd in [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel12
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '12'
        hoofdstuk: II
  - number: 5.2.h
    text: |-
      het op een andere wijze dan met behulp van een werk lozen door pleksgewijze, driftvrije, toepassing van
      gewasbeschermingsmiddelen op het talud;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: 5.2.i
    text: |-
      overig op een andere wijze dan met behulp van een werk lozen, dat verband houdt met gewasbescherming en toediening
      van meststoffen, met inachtneming van de voorschriften, genoemd in de [artikelen 13][ref1], [15][ref2] en
      [16][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel16
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '16'
        hoofdstuk: II
  - number: 5.2.j
    text: water dat bij normaal landbouwkundig gebruik uit de bodem vrijkomt en via een drainagesysteem wordt geloosd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: '5.3'
    text: |-
      Ander lozen dan genoemd in het tweede lid, onderdeel a tot en met j, is toegestaan indien degene die de agrarische
      activiteiten waarvan het voorgenomen lozen het gevolg zal zijn uitvoert, voor de aanvang van het lozen aan de
      waterkwaliteitsbeheerder aantoont, dat het lozen geen nadelige gevolgen voor het oppervlaktewater zal veroorzaken.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: '5.4'
    text: Het gebruiken van gewasbeschermingsmiddelen nabij oppervlaktewater is
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
  - number: 5.4.a
    text: |-
      verboden, tenzij de voorschriften gesteld bij of krachtens [artikel 13][ref1] in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: 5.4.b
    text: |-
      binnen een afstand van 14 m vanaf de insteek van het oppervlaktewater verboden, tenzij de voorschriften gesteld bij
      of krachtens [artikel 15][ref1] in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel15
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '15'
        hoofdstuk: II
  - number: '6.1'
    text: |-
      Met betrekking tot het lozen van huishoudelijk afvalwater worden de voorschriften, gesteld bij of krachtens het
      tweede tot en met het tiende lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.2'
    text: |-
      Beperkt lozen is verboden, indien de afstand tot de dichtstbijzijnde riolering gemeten vanaf de plaats waar het
      afvalwater ontstaat, 40 m of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.3'
    text: |-
      Omvangrijk lozen, binnen de afstanden als bedoeld in [artikel 2, onderdeel i, onder 1° tot en met 4°][ref1],
      is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel2
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '2'
        hoofdstuk: I
  - number: '6.4'
    text: |-
      Indien de in het tweede lid bedoelde afstand meer bedraagt dan 40 m, wordt het afvalwater door een voorziening
      voor de individuele behandeling van afvalwater geleid waarmee de nadelige gevolgen voor de kwaliteit van het
      oppervlaktewater zoveel mogelijk worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.5'
    text: |-
      Bij bestaand beperkt lozen kan de waterkwaliteitsbeheerder, in een geval als bedoeld in het vierde lid, nadere
      eisen stellen aan de voorziening indien aan het desbetreffende oppervlaktewater in een plan, vastgesteld ingevolge
      de [Wet op de waterhuishouding][ref1], een bijzondere functie of waterkwaliteitsdoelstelling is toegekend. De
      eisen kunnen worden gesteld ten aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik en het
      onderhoud van de voorziening, alsmede de aanwezigheid, de uitvoering en de situering van een controlevoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '6.6'
    text: |-
      Bij nieuw beperkt lozen kan de waterkwaliteitsbeheerder, in een geval als bedoeld in het vierde lid, nadere eisen
      stellen ten aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik of het onderhoud van de
      voorziening, alsmede de aanwezigheid, de uitvoering en de situering van een controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.7'
    text: |-
      Tenzij toepassing is gegeven aan het vijfde of zesde lid, wordt alleen aan de eis van het vierde lid voldaan,
      indien het afvalwater wordt geleid door een septic tank die is uitgevoerd overeenkomstig de voorschriften gesteld
      krachtens [artikel 7, tweede lid, van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel7
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '7'
  - number: '6.8'
    text: De septic tank wordt zo dikwijls geledigd als voor een goede werking daarvan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.9'
    text: Het is verboden de bij het ledigen van de septic tank vrijkomende stoffen te lozen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '6.10'
    text: |-
      In afwijking van het zevende lid kan worden volstaan met een voorziening die wat het zuiveringsrendement
      betreft tenminste gelijkwaardig is aan een voorziening als bedoeld in dat lid, indien voldaan wordt aan door de
      waterkwaliteitsbeheerder te stellen nadere eisen ten aanzien van het zuiveringsrendement dan wel de doelmatigheid,
      het gebruik of het onderhoud van de voorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel6
  - number: '7.1'
    text: |-
      Met betrekking tot het lozen ten gevolge van het wassen of uitwendig reinigen van voertuigen, werktuigen of
      apparaten worden de voorschriften, gesteld bij of krachtens het tweede tot en met het vijfde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: '7.2'
    text: |-
      Afvalwater dat afkomstig is van het op verhard oppervlak wassen of uitwendig reinigen van voertuigen, werktuigen of
      apparaten die bestemd zijn voor het gebruiken van bestrijdingsmiddelen of meststoffen, wordt niet geloosd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: '7.3'
    text: |-
      Indien het wassen of uitwendig reinigen van voertuigen, werktuigen of apparaten op verhard oppervlak plaatsvindt
      dan is lozen verboden tenzij:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: 7.3.a
    text: binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat geen riolering aanwezig is;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: 7.3.b
    text: |-
      het gehalte minerale olie in enig monster van het te lozen afvalwater niet meer dan 20 mg/l, bepaald volgens NEN-
      EN-ISO 9377-2, uitgave december 2000, bedraagt en het gehalte onopgeloste bestanddelen niet meer dan 100 mg/l,
      bepaald volgens NEN 6621, uitgave 1988, bedraagt en
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: 7.3.c
    text: |-
      het te lozen afvalwater voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een doelmatige
      en goed toegankelijke controlevoorziening doorloopt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: '7.4'
    text: |-
      De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de
      controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: '7.5'
    text: |-
      Indien het wassen of uitwendig reinigen niet op verhard oppervlak plaatsvindt, wordt een zodanige afstand van
      het te reinigen voertuig, werktuig of apparaat tot de insteek van het oppervlaktewater aangehouden dat geen lozen
      plaatsvindt. De aan te houden afstand bedraagt tenminste 5 m.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel7
  - number: '8.1'
    text: |-
      Met betrekking tot het lozen ten gevolge van het spoelen van landbouwgewassen worden de voorschriften, gesteld bij
      of krachtens het tweede tot en met het veertiende lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.2'
    text: |-
      Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het te lozen afvalwater ontstaat een
      riolering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.3'
    text: |-
      Het spoelproces is onderverdeeld in voorspoelen en naspoelen, waarbij de uitsleep van water uit het voorspoelen zo
      veel mogelijk wordt voorkomen en de hoeveelheid naspoelwater wordt geminimaliseerd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.4'
    text: Binnen het spoelproces vindt hergebruik van spoelwater plaats.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.5'
    text: Er wordt uitsluitend naspoelwater geloosd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.6'
    text: Het lozen van naspoelwater is alleen toegestaan, indien het naspoelwater niet kan worden benut voor hergebruik.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.7'
    text: Het lozen van naspoelwater vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.8'
    text: |-
      In enig monster van het te lozen naspoelwater bedraagt het gehalte aan onopgeloste bestanddelen niet meer dan 100
      mg/l, bepaald volgens NEN 6621, uitgave 1988.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.9'
    text: |-
      Het naspoelwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een
      doelmatige en goed toegankelijke controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.10'
    text: |-
      Indien aan het desbetreffende oppervlaktewater in een plan, vastgesteld ingevolge de
      [Wet op de waterhuishouding][ref1], een bijzondere functie of waterkwaliteitsdoelstelling is toegekend kan de
      waterkwaliteitsbeheerder ten aanzien van het spoelproces nadere eisen stellen die voor de kwaliteit van dat
      oppervlaktewater voldoende bescherming bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '8.11'
    text: |-
      Indien blijkens een toxiciteitsproef in enig monster van het op het desbetreffende oppervlaktewater te lozen water
      sprake is van acute toxiciteit voor waterorganismen kan de waterkwaliteitsbeheerder ten aanzien van het spoelproces
      nadere eisen stellen die voor de kwaliteit van dat oppervlaktewater voldoende bescherming bieden.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.12'
    text: |-
      De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de
      controlevoorziening, bedoeld in het negende lid.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.13'
    text: 'Het derde tot en met het zesde lid is niet van toepassing op het spoelen van:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: 8.13.a
    text: prei, indien voorafgaand aan het spoelen vervuiling met de buitenste bladeren van het gewas is verwijderd;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: 8.13.b
    text: asperges.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '8.14'
    text: |-
      Het zevende tot en met het negende lid zijn van overeenkomstige toepassing op het water afkomstig van het spoelen
      van gewassen als bedoeld in het dertiende lid.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel8
  - number: '9.1'
    text: |-
      Met betrekking tot het lozen ten gevolge van de ontijzering van grondwater worden de voorschriften, gesteld bij of
      krachtens het tweede tot en met het zesde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '9.2'
    text: |-
      Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat een riolering
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '9.3'
    text: Het lozen vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '9.4'
    text: |-
      In enig monster van het te lozen afvalwater bedraagt het gehalte aan ijzer niet meer dan 5 mg/l, bepaald volgens
      NEN 6426, uitgave 1995.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '9.5'
    text: |-
      Het te lozen afvalwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een
      doelmatige en goed toegankelijke controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '9.6'
    text: |-
      De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de
      controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel9
  - number: '10.1'
    text: |-
      Met betrekking tot het lozen ten gevolge van het reinigen van gebouwen of opstallen waarin agrarische activiteiten
      dan wel activiteiten die daarmee verband houden plaatsvinden worden de voorschriften, gesteld bij of krachtens het
      tweede tot en met het achtste lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.2'
    text: |-
      Lozen is verboden indien binnen een afstand van 40 m vanaf de plaats waar het afvalwater ontstaat een riolering
      aanwezig is.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.3'
    text: |-
      Afvalwater dat afkomstig is uit stallen, ruimten waarin bestrijdingsmiddelen worden toegepast of worden opgeslagen,
      ruimten waarin meststoffen worden opgeslagen dan wel ruimten waarin onderhoud aan voertuigen, werktuigen of
      apparaten plaatsvindt, wordt niet geloosd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.4'
    text: |-
      Afvalwater waarin reinigings- of ontsmettingsmiddelen voorkomen en afvalwater dat vrijkomt bij het schoonmaken van
      onderdelen die afkomstig zijn uit de in het eerste lid bedoelde gebouwen of opstallen en in aanraking zijn geweest
      met bestrijdingsmiddelen of meststoffen, wordt niet geloosd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.5'
    text: |-
      Het lozen van afvalwater dat vrijkomt ten gevolge van het reinigen van gebouwen en opstallen als bedoeld in het
      eerste lid, vindt plaats via een voorziening voor het tegenhouden van onopgeloste bestanddelen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.6'
    text: |-
      In enig monster van het te lozen afvalwater bedraagt het gehalte aan onopgeloste bestanddelen niet meer dan 100 mg/
      l, bepaald volgens NEN 6621, uitgave 1988.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.7'
    text: |-
      Het te lozen afvalwater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander afvalwater een
      doelmatige en goed toegankelijke controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '10.8'
    text: |-
      De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de
      controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel10
  - number: '11.1'
    text: |-
      Met betrekking tot het lozen van koel- en condenswater worden de voorschriften, gesteld bij of krachtens het tweede
      tot en met het zesde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '11.2'
    text: Het te lozen koelwater is uitsluitend thermisch verontreinigd en is niet warmer dan 30° C.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '11.3'
    text: |-
      De waterkwaliteitsbeheerder kan in het belang van de kwaliteit van het oppervlaktewater nadere eisen stellen ten
      aanzien van het gehalte aan chloride, ijzer of zuurstof of organische stoffen in het te lozen koelwater. Daarbij
      mag het gehalte niet bepaald worden op een waarde: - 1° lager dan 200 mg/l voor chloride;
        - 2° lager dan 2 mg/l voor ijzer;
        - 3° hoger dan 5 mg/l voor zuurstof;
        - 4° lager dan 15 mg/l voor organische stof.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '11.4'
    text: |-
      Het te lozen koel- of condenswater doorloopt voorafgaand aan het lozen en voordat het vermengd wordt met ander
      afvalwater een doelmatige en goed toegankelijke controlevoorziening.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '11.5'
    text: Condenswater wordt niet geloosd, indien dit afkomstig is uit ruimten waarin bestrijdingsmiddelen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '11.6'
    text: |-
      De waterkwaliteitsbeheerder kan nadere eisen stellen ten aanzien van de uitvoering en de situering van de
      controlevoorziening, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel11
  - number: '12.1'
    text: |-
      Met betrekking tot het lozen van hemelwater en water waarmee verhard oppervlak wordt gereinigd worden de
      voorschriften, gesteld bij of krachtens het tweede tot en met het derde lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel12
  - number: '12.2'
    text: |-
      Materialen, apparaten, voedingsstoffen, afvalstoffen en grondstoffen waarmee het hemelwater verontreinigd kan raken
      worden zodanig op verhard oppervlak opgeslagen of gestald dat te lozen hemelwater en water waarmee het verhard
      oppervlak wordt gereinigd daarmee niet in contact kan komen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel12
  - number: '12.3'
    text: |-
      Materialen, apparaten, voedingsstoffen, afvalstoffen en grondstoffen worden op onverhard oppervlak langs
      oppervlaktewater:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel12
  - number: 12.3.a
    text: op een afstand van tenminste 5 m tot de insteek van het oppervlaktewater opgeslagen of gestald of
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel12
  - number: 12.3.b
    text: |-
      zodanig opgeslagen of gestald dat te lozen hemelwater niet in contact kan komen met die materialen, apparaten,
      voedingsstoffen, afvalstoffen en grondstoffen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel12
  - number: '13.1'
    text: |-
      Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van gewasbescherming
      worden de voorschriften, gesteld bij of krachtens het derde tot en met het veertiende lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.2'
    text: |-
      Met betrekking tot het gebruiken van gewasbeschermingsmiddelen worden de voorschriften, gesteld bij of krachtens
      het derde tot en met het veertiende lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.3'
    text: Langs oppervlaktewater wordt een teeltvrije zone aangehouden.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.4'
    text: |-
      De teeltvrije zone bedraagt bij de teelt van NAK-pootaardappelen, consumptieaardappelen, fabrieksaardappelen
      inclusief pootgoed, poot- en plantuien, zaaiuien, bloembollen en -knollen, aardbeien, asperges, prei, schorseneren,
      sla, was- en bospenen, winterpenen, vaste planten, en in neerwaartse richting te bespuiten boomkwekerijgewassen,
      als bedoeld in [bijlage I][ref1] bij dit besluit:


      [ref1]: https://wetten.overheid.nl/BWBR0011133
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011133
  - number: 13.4.a
    text: tenminste 150 cm;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.b
    text: 'tenminste 100 cm, indien gebruik gemaakt wordt van:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.b.1°
    text: veldspuitapparatuur met luchtondersteuning,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.b.2°
    text: een overkapte beddenspuit,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.b.3°
    text: een motorisch aangedreven handgedragen spuit,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.b.4°
    text: vanggewas, of
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.4.c
    text: tenminste 50 cm, indien gebruik gemaakt wordt van een handmatig aangedreven handgedragen spuit.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.5'
    text: |-
      De teeltvrije zone bedraagt bij de teelt van in opwaartse of zijwaartse richting te bespuiten boomkwekerijgewassen
      als bedoeld in bijlage I bij dit besluit tenminste 500 cm.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.6'
    text: 'De teeltvrije zone bedraagt bij de teelt van appelen, peren en overige pit- en steenvruchten:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.a
    text: tenminste 900 cm;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.b
    text: tenminste 450 cm, indien gebruik wordt gemaakt van een reflectiescherm;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.c
    text: 'tenminste 300 cm, indien:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.c.1°
    text: gebruik wordt gemaakt van een tunnelspuit,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.c.2°
    text: gebruik wordt gemaakt van een vanggewas,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.c.3°
    text: sprake is van biologische teelt, of
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.c.4°
    text: |-
      gebruik wordt gemaakt van een dwarsstroomspuit met reflectiescherm en van een emissiescherm, waarvan geen
      afdruipende gewasbeschermingsmiddelen in het oppervlaktewater kunnen geraken;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.6.d
    text: |-
      met ingang van een bij koninklijk besluit te bepalen tijdstip, tenminste 300 cm, indien gebruik wordt gemaakt
      van een dwarsstroomspuit en bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van naar het
      oppervlaktewater gerichte apparatuur en slechts gebruik wordt gemaakt van spuitdoppen waarvan door een deskundig,
      onafhankelijk instituut is vastgesteld dat het gebruik van die spuitdoppen bij die wijze van bespuiten resulteert
      in een driftdepositie in oppervlaktewater in de volbladsituatie van ten hoogste 1,5%.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.7'
    text: |-
      In afwijking van het zesde lid, onderdeel a, bedraagt de teeltvrije zone langs de kopakker tenminste 600 cm, indien
      bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van naar het oppervlaktewater gerichte
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.8'
    text: 'De teeltvrije zone bedraagt bij de teelt van:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.8.a
    text: |-
      grasland, graszaad, haver, rogge, spelt, teff, triticale, vlas, zomertarwe, wintertarwe, zomergerst en wintergerst
      tenminste 25 cm;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.8.b
    text: |-
      overige landbouwgewassen met uitzondering van de landbouwgewassen genoemd in het vierde tot en met zesde lid,
      tenminste 50 cm.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.9'
    text: |-
      In afwijking van het vierde lid, het zesde lid, onderdelen b tot en met d, en het achtste lid bedraagt de
      teeltvrije zone langs de in de bijlage bij artikel 3 van het Uitvoeringsbesluit Meststoffenwet aangewezen
      oppervlaktewateren tenminste 500 cm.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.10'
    text: |-
      De teeltvrije zone bedoeld in het vierde tot en met het negende lid, wordt gemeten vanaf de insteek van het
      oppervlaktewater en strekt zich, met uitzondering van de teelt van grasland, uit tot het hart van de buitenste
      planten van de te telen landbouwgewassen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.11'
    text: |-
      Bij aanwezigheid van een talud dat breder is dan 200 cm kan de waterkwaliteitsbeheerder bij nadere eis een minder
      brede teeltvrije zone voorschrijven dan bedoeld in het vierde tot en met het tiende lid. In gevallen waarin
      toepassing is gegeven aan de vorige volzin, zijn die bepalingen niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.12'
    text: |-
      Indien aan het desbetreffende oppervlaktewater in een plan, vastgesteld ingevolge de
      [Wet op de waterhuishouding][ref1], een bijzondere functie of waterkwaliteitsdoelstelling is toegekend, kan de
      waterkwaliteitsbeheerder bij nadere eis een bredere teeltvrije zone voorschrijven dan bedoeld in het vierde tot
      en met het tiende lid. In gevallen waarin toepassing is gegeven aan de vorige volzin, zijn die bepalingen niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '13.13'
    text: |-
      In afwijking van het derde lid behoeft een teeltvrije zone niet te worden aangehouden langs andere dan de in het
      negende lid bedoelde oppervlaktewateren:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.13.a
    text: |-
      bij de teelt van appelen, peren en overige pit- en steenvruchten van bomen, waarvan de laagste gesteltak op 175
      cm of hoger uit de stam ontspringt, indien binnen een afstand van ten minste 900 cm vanaf de insteek van het
      oppervlaktewater geen gewasbeschermingsmiddelen worden toegepast;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.13.b
    text: 'bij teelt anders dan de teelt van appelen, peren en overige pit- en steenvruchten, indien:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.13.b.1°
    text: sprake is van biologische teelt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: 13.13.b.2°
    text: |-
      gebruik wordt gemaakt van een emissiescherm, waarvan geen afdruipende gewasbeschermingsmiddelen in het
      oppervlaktewater kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
  - number: '13.14'
    text: |-
      In afwijking van het derde lid behoeft een teeltvrije zone niet te worden aangehouden langs gegraven waterlopen,
      die van 1 april tot 1 oktober onder normale omstandigheden geen water bevatten, mits daaraan niet in een plan,
      vastgesteld ingevolge de [Wet op de waterhuishouding][ref1], een bijzondere functie of waterkwaliteitsdoelstelling
      is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004575
  - number: '15.1'
    text: |-
      Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van gewasbescherming
      worden binnen een afstand van 14 m vanaf de insteek van het oppervlaktewater de voorschriften, gesteld bij of
      krachtens het derde tot en met het zevende lid, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.2'
    text: |-
      Met betrekking tot het gebruiken van gewasbeschermingsmiddelen binnen een afstand van 14 m vanaf de insteek van
      het oppervlaktewater, worden de voorschriften gesteld bij of krachtens het derde tot en met het zevende lid in
      acht genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.3'
    text: Gewasbeschermingsmiddelen worden niet gebruikt met een luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.4'
    text: Gewasbeschermingsmiddelen worden niet gebruikt
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.a
    text: 'met veldspuitapparatuur, met uitzondering van een overkapte beddenspuit, die:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.a.1°
    text: niet is voorzien van kantdoppen en andere driftarme doppen, of
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.a.2°
    text: |-
      zodanig is ingesteld dat de spuitdoppen zich op een hoogte groter dan 50 cm boven het gewas of de kale grond
      bevinden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.b
    text: |-
      met een spuitgeweer dat is voorzien van een werveldop of dat gebruik maakt van een werkdruk van 5 bar of meer,
      zodat over een afstand van meer dan 2 m vloeistof verspreid kan worden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.c
    text: 'bij een windsnelheid van 5 m of meer per seconde gemeten op spuitdophoogte tenzij:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.c.1°
    text: de gewasbeschermingsmiddelen worden gebruikt met een overkapte beddenspuit;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.4.c.2°
    text: |-
      degene die de gewasbeschermingsmiddelen gebruikt kan aantonen, dat redelijkerwijs niet anders dan door het
      gebruiken van die middelen bij een windsnelheid van 5 m of meer per seconde een teeltbedreigende situatie kan
      worden afgewend.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.5'
    text: |-
      Binnen de teeltvrije zone worden gewasbeschermingsmiddelen niet gebruikt met apparatuur die bestemd is voor het
      druppelsgewijs gebruiken van gewasbeschermingsmiddelen, met uitzondering van pleksgewijze onkruidbestrijding met
      een afgeschermde spuitdop.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.6'
    text: |-
      In afwijking van het vijfde lid is het toepassen van gewasbeschermingsmiddelen op overhangend loof met een maximale
      omvang van een halve gewasrij toegestaan, tenzij daartoe gebruik wordt gemaakt van naar het oppervlaktewater
      gerichte apparatuur.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '15.7'
    text: Het driftarm karakter van doppen als bedoeld in het vierde lid, onderdeel a,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.7.a
    text: blijkt uit een testcertificaat en
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: 15.7.b
    text: |-
      wordt volgens een door Onze Ministers bij ministeriële regeling aan te wijzen testmethode dan wel een daaraan
      gelijkwaardige methode vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel15
  - number: '16.1'
    text: |-
      Met betrekking tot het lozen op een andere wijze dan met behulp van een werk in het kader van het gebruik van
      meststoffen worden de voorschriften, gesteld bij of krachtens het tweede tot en met het zevende lid in acht
      genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
  - number: '16.2'
    text: |-
      Het is verboden meststoffen toe te dienen op de ingevolge [artikel 13][ref1] voorgeschreven teeltvrije zone.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '16.3'
    text: |-
      In afwijking van het tweede lid is het verboden bij de teelt van opwaarts en zijwaarts te bespuiten
      boomkwekerijgewassen als bedoeld in [bijlage I][ref1] bij dit besluit of van appelen, peren en overige pit- en
      steenvruchten, meststoffen toe te dienen binnen 25 cm vanaf de insteek van het oppervlaktewater van andere dan de
      in [artikel 13, negende lid][ref2], bedoelde oppervlaktewateren, indien in de teeltvrije zone geen ander gewas dan
      gras wordt geteeld.


      [ref1]: https://wetten.overheid.nl/BWBR0011133
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '16.4'
    text: |-
      Bij gebruik van korrel- of poedervormige meststoffen op de strook gelegen naast de teeltvrije zone wordt direct
      langs de zone een kantstrooivoorziening toegepast.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
  - number: '16.5'
    text: |-
      In afwijking van het tweede lid is het pleksgewijs bemesten van een vanggewas op de teeltvrije zone
      toegestaan buiten een afstand van 50 cm gemeten vanaf de insteek van het oppervlaktewater van andere dan de in
      [artikel 13, negende lid][ref1], bedoelde oppervlaktewateren, onverminderd het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '16.6'
    text: 'Bij de toepassing van bladmeststoffen op de strook gelegen naast de teeltvrije zone wordt direct langs de zone:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
  - number: 16.6.a
    text: |-
      bij het bemesten van landbouwgewassen als bedoeld in [artikel 13, vierde en achtste lid][ref1], gebruik gemaakt van
      kantdoppen en andere driftarme doppen die zich maximaal op een hoogte van 50 cm boven het gewas of de kale grond
      bevinden;


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: 16.6.b
    text: |-
      bij het bemesten van landbouwgewassen als bedoeld in [artikel 13, vijfde en zesde lid][ref1], geen gebruik gemaakt
      van naar het oppervlaktewater gerichte apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '16.7'
    text: |-
      Bij de toepassing van bladmeststoffen bij de teelt van een gewas waarbij ingevolge
      [artikel 13, dertiende lid, aanhef en onderdeel b, onder 2°][ref1], geen teeltvrije zone wordt aangehouden, wordt
      gebruik gemaakt van een emissiescherm waarvan geen afdruipende bladmeststoffen in het oppervlaktewater kunnen
      geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '16.8'
    text: |-
      Onverminderd het eerste tot en met het zesde lid zijn de
      [artikelen 1a tot en met 6d van het Besluit gebruik meststoffen][ref1] binnen een afstand van 14 m vanaf de insteek
      van het oppervlaktewater van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009066#Artikel2
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009066
        artikel: '2'
  - number: '17.1'
    text: |-
      Het is verboden apparatuur, die bestemd is voor het gebruiken van gewasbeschermingsmiddelen, vanuit of nabij
      oppervlaktewater te vullen, tenzij daarbij het tweede en het derde lid in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel17
  - number: '17.2'
    text: |-
      Bij uit oppervlaktewater vullen van apparatuur die bestemd is voor het gebruiken van gewasbeschermingsmiddelen
      wordt een voorziening getroffen die terugstroming van het mengsel van gewasbeschermingsmiddelen en water voorkomt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel17
  - number: '17.3'
    text: |-
      Het vullen van de apparatuur die gebruikt wordt voor het gebruiken van gewasbeschermingsmiddelen vindt op een
      afstand van tenminste 2 m van de insteek van het oppervlaktewater plaats.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel17
  - number: '18.1'
    text: |-
      In afwijking van [artikel 6, tweede lid][ref1], [artikel 7, derde lid, onder a][ref2],
      [artikel 8, tweede lid][ref3], [artikel 9, tweede lid][ref4] en [artikel 10, tweede lid][ref5], is lozen
      toegestaan, indien krachtens de [Wet milieubeheer][ref6] is bepaald dat het desbetreffende afvalwater niet of niet
      volledig op een riolering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011133#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0011133#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0011133
        artikel: '9'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0011133
        artikel: '10'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0003245
  - number: '18.2'
    text: |-
      [Artikel 6 , vierde tot en met tiende lid][ref1], [artikel 7, derde lid, onderdelen b en c, en vierde lid][ref2],
      [artikel 8, derde tot en met elfde lid][ref3], [artikel 9, derde tot en met zesde lid][ref4], en
      [artikel 10, derde tot en met achtste lid][ref5], zijn van overeenkomstige toepassing op het in het eerste lid
      bedoelde lozen.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011133#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0011133#Artikel10
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0011133
        artikel: '9'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0011133
        artikel: '10'
        hoofdstuk: II
  - number: '19.1'
    text: |-
      Degene die voornemens is agrarische activiteiten uit te voeren ten gevolge waarvan een lozing kan plaatsvinden
      meldt het lozen tenminste zes weken voordat daarmee wordt aangevangen aan de waterkwaliteitsbeheerder.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: '19.2'
    text: 'Een melding als bedoeld in het eerste lid wordt schriftelijk gedaan en omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.a
    text: de naam, het adres en het telefoonnummer van degene die meldt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.b
    text: een omschrijving van de agrarische activiteiten die worden verricht;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.c
    text: |-
      de lozingen bedoeld in [artikel 5, tweede lid][ref1], ten gevolge van agrarische activiteiten dan wel activiteiten
      die daarmee verband houden;


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel5
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '5'
        hoofdstuk: II
  - number: 19.2.d
    text: de locatie van gebouwen van waaruit lozingen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.e
    text: de locatie van de percelen van waar af lozingen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.f
    text: |-
      in geval van het lozen van huishoudelijk afvalwater gegevens op grond waarvan het aantal inwonerequivalenten kan
      worden bepaald;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.g
    text: gegevens waaruit kan worden afgeleid hoeveel meter de afstand tot de dichtstbijzijnde riolering bedraagt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: 19.2.h
    text: |-
      gegevens met betrekking tot de voorzieningen bedoeld in [artikel 6, vierde lid][ref1],
      [artikel 7, derde lid, onderdeel c][ref2], [artikel 8, zevende en negende lid][ref3],
      [artikel 9, derde en vijfde lid][ref4], [artikel 10, vijfde en zevende lid][ref5] en
      [artikel 11, vierde lid][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011133#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0011133#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011133#Artikel11
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0011133
        artikel: '9'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0011133
        artikel: '10'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0011133
        artikel: '11'
        hoofdstuk: II
  - number: 19.2.i
    text: gegevens waaruit kan worden afgeleid dat sprake is van biologische teelt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: '19.3'
    text: De melding wordt gedaan op een formulier waarvan het model wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
  - number: '19.4'
    text: |-
      Degene die voornemens is agrarische activiteiten ten gevolge waarvan een lozing plaatsvindt te veranderen, meldt
      veranderend lozen voordat daarmee wordt aangevangen aan de waterkwaliteitsbeheerder, tenzij het veranderend lozen
      uitsluitend het gevolg is van een wijziging in teelt en de gegevens omtrent het te telen landbouwgewas en de
      betreffende percelen op grond van [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref1] zijn gemeld aan Onze
      Minister van Landbouw, Natuur en Voedselkwaliteit. Het tweede en derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel26
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '26'
  - number: '19.5'
    text: |-
      De waterkwaliteitsbeheerder is bevoegd de krachtens [artikel 26 van het Uitvoeringsbesluit Meststoffenwet][ref1]
      gemelde gegevens te gebruiken voor zover noodzakelijk voor het toezicht op de naleving van de bij of krachtens dit
      besluit gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel26
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019031
        artikel: '26'
  - number: '20'
    text: |-
      Indien zich als gevolg van agrarische activiteiten dan wel van activiteiten die daarmee verband houden een ongewoon
      voorval voordoet of heeft voorgedaan, waardoor nadelige gevolgen voor de kwaliteit van het oppervlaktewater zijn
      ontstaan of dreigen te ontstaan,
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel20
  - number: 20.a
    text: |-
      worden onmiddellijk de maatregelen genomen die redelijkerwijs verlangd kunnen worden om de gevolgen van die
      gebeurtenis te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, om deze zoveel mogelijk te
      beperken en ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel20
  - number: 20.b
    text: |-
      wordt zo spoedig mogelijk, doch uiterlijk binnen 8 uur, melding gemaakt van het voorval aan de
      waterkwaliteitsbeheerder van het desbetreffende oppervlaktewater;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel20
  - number: 20.c
    text: |-
      worden onverwijld alle maatregelen die de waterkwaliteitsbeheerder voorschrijft ter voorkoming van verdere
      verontreiniging van oppervlaktewateren getroffen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel20
  - number: '21'
    text: |-
      De bij of krachtens de [artikelen 13][ref1] en [15][ref2] gestelde voorschriften zijn niet van toepassing indien
      de directeur van de Plantenziektenkundige Dienst, of deze directeur namens Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit op grond van of krachtens [artikel 3 van de Plantenziektenwet][ref3], de gebruiker van
      gewasbeschermingsmiddelen heeft aangezegd deze middelen te gebruiken ter voorkoming van het optreden en van de
      verbreiding van schadelijke organismen en ter bestrijding daarvan, dan wel de verplichting tot dit gebruik op grond
      van of krachtens [artikel 3 van de Plantenziektenwet][ref4] aan deze gebruiker is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002075#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002075
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002075
        artikel: '3'
  - number: '22'
    text: |-
      Onze Minister zendt in overeenstemming met Onze Minister van Landbouw, Natuur- en Voedselkwaliteit en Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer binnen vier jaar na de inwerkingtreding van dit besluit
      en vervolgens telkens na vier jaar aan de Staten-Generaal een verslag over de mate waarin dit besluit bijdraagt aan
      het behalen van de waterkwaliteitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel22
  - number: '23.1'
    text: |-
      Indien binnen de in [artikel 6, tweede lid][ref1], bepaalde afstand riolering wordt aangelegd waarop aangesloten
      kan worden, is bestaand beperkt lozen, in afwijking van [artikel 6, tweede lid][ref2], toegestaan gedurende 5 jaar
      vanaf het tijdstip waarop aansluiting op de riolering mogelijk is, indien het afvalwater door een voorziening wordt
      geleid die voldoet aan de voorschriften gesteld krachtens [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel6
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
  - number: '23.2'
    text: |-
      Indien binnen de afstanden genoemd in [artikel 2, onderdeel i, onder 1° tot en met 4°][ref1]
      riolering wordt aangelegd waarop aangesloten kan worden, is bestaand omvangrijk lozen, in afwijking van
      [artikel 6, derde lid][ref2], toegestaan gedurende:


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel6
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
  - number: 23.2.a
    text: |-
      5 jaar vanaf het tijdstip waarop aansluiting op de riolering mogelijk is met dien verstande, dat
      [artikel 6, vierde, vijfde en zesde lid][ref1], van overeenkomstige toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel6
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '6'
        hoofdstuk: II
  - number: 23.2.b
    text: 3 jaar vanaf het tijdstip waarop aansluiting op de riolering mogelijk is, in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel23
  - number: '23.3'
    text: |-
      In afwijking van het eerste en tweede lid zijn de overgangsbepalingen uit
      [hoofdstuk V van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref1] van toepassing op lozen dat tot het moment
      van inwerkingtreding van het onderhavige besluit door eerstgenoemd besluit werd geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008512#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008512
        hoofdstuk: V
  - number: '25'
    text: |-
      In afwijking van [artikel 13, zesde lid][ref1], bedraagt de teeltvrije zone van percelen die niet breder zijn dan
      70 m en aan de zijde parallel of nagenoeg parallel aan de gewasrijen worden begrensd door oppervlaktewater tot
      1 januari 2010 tenminste 150 cm, indien bij de bespuiting van de buitenste gewasrij geen gebruik wordt gemaakt van
      naar het oppervlaktewater gerichte apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel13
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
  - number: '26'
    text: |-
      In een geval, als bedoeld in [artikel 2, eerste lid, onderdeel k, onder 2°][ref1], de zinsnede beginnend met
      «tenzij» en eindigend met «besluit,» wordt dit besluit van toepassing voor het desbetreffende lozen met ingang van
      de datum waarop de beschikking tot intrekking van de vergunning, onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel2
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '2'
        hoofdstuk: I
  - number: 29a
    text: |-
      Met de in dit besluit bedoelde middelen en methoden worden gelijkgesteld middelen en methoden die rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie, dan wel rechtmatig zijn
      vervaardigd in een staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte, en die aan ten
      minste gelijkwaardige technische eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel29a
  - number: '30'
    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip liggende vier weken na de datum van uitgifte van het
      Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel30
