---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: lozingenbesluit_open_teelt_en_veehouderij
regulatory_layer: AMVB
publication_date: '2012-10-01'
valid_from: '2009-10-01'
bwb_id: BWBR0011133
url: https://wetten.overheid.nl/BWBR0011133/2009-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 30 juni 1999, nr. CDJZ/BVW 967-99, en de
    Staatssecretaris van Landbouw, Natuurbeheer en Visserij, gedaan mede namens Onze Minister van Volkshuisvesting,
    Ruimtelijke Ordening en Milieubeheer, Onze Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris
    van Sociale Zaken en Werkgelegenheid, drs. J.F. Hoogervorst;

    Gelet op de richtlijn van de Raad van de Europese Gemeenschappen van 12 december 1991, 91/676/EEG (PbEG L375)
    inzake de bescherming van water tegen verontreiniging door nitraten uit agrarische bronnen, gelet op de artikelen
    1, 2a, 2b, 2c, tweede lid, van de Wet verontreiniging oppervlaktewateren en mede gelet op artikel 13 van de
    Bestrijdingsmiddelenwet 1962, voorzover het betreft de artikelen 1, 2, 3, 5, 13, 14, 15, 17, 21 en 25;

    De Raad van State gehoord (advies van 18 november 1999, no. W09.99.0322/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van, nr. CDJZ/2000-83 en
    de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, uitgebracht mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Onze Minister van Volksgezondheid, Welzijn en Sport en de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.a
    text: |-
      *afvalwater:* alle water waarvan de houder zich – met het oog op de verwijdering daarvan – ontdoet, voornemens is
      zich te ontdoen of zich moet ontdoen;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.b
    text: |-
      *agrarische activiteiten:* een geheel van activiteiten die betrekking hebben op landbouwgewassen en
      landbouwhuisdieren als bedoeld in [bijlage I][ref1] bij dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0011133
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011133
  - number: 1.1.c
    text: '*beperkt lozen:* lozen van 10 inwonerequivalenten of minder;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.d
    text: '*bestaand lozen:* lozen dat reeds voor het tijdstip van het in werking treden van het besluit plaatsvond;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.e
    text: |-
      *bestrijdingsmiddel*: gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen of biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
  - number: 1.1.f
    text: |-
      *biologische teelt:* teelt uitgevoerd overeenkomstig het bepaalde bij of krachtens het
      [Landbouwkwaliteitsbesluit 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022535
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022535
  - number: 1.1.g
    text: |-
      *condenswater:* water dat bij afkoeling van lucht in koelinstallaties en langs koude oppervlakken in bewaarruimten
      ontstaat;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.h
    text: '*controlevoorziening:* voorziening ten behoeve van het nemen van monsters;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.i
    text: |-
      *driftarme dop:* een spuitdop die in het toe te passen drukbereik vergeleken met de grensdop van de klasse fijn
      en midden volgens de British Crop Protection Council (BCPC)-klassificatie (31-030-F110 bij 3 bar), een 50% kleiner
      volumepercentage druppels met een diameter kleiner dan 100 μm produceert;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.j
    text: |-
      *emissiescherm:* tijdens het gebruiken van een bestrijdingsmiddel of bladmeststof aanwezige, aan de grond
      verankerde barrière van ondoorlatend materiaal of van gaas met een windreductie van 50% of meer, die van tenminste
      gelijke hoogte is als de bovenste in gebruik zijnde spuitdop van de gebruikte apparatuur én van tenminste gelijke
      hoogte als het gewas op het perceel, die het verwaaien van spuitvloeistof naar het oppervlaktewater beperkt, die
      met uitzondering van een doorrijscherm op de kopakker aaneengesloten is;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.k
    text: '*gewasbed:* strook beteelde grond die in de breedte wordt begrensd door een strook onbeteelde grond;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.h
    text: |-
      *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
  - number: 1.1.m
    text: '*hemelwater:* water dat als gevolg van neerslag op het perceel, het erf of de gebouwen terechtkomt;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.n
    text: |-
      *huishoudelijk afvalwater:* afvalwater dat naar zijn aard en samenstelling overeenkomt met afvalwater afkomstig van
      een particulier huishouden;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.o
    text: '*insteek van het oppervlaktewater:* snijpunt van de raaklijnen van het talud en het horizontale maaiveld;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.p
    text: |-
      *kantdop:* driftarme dop die als gevolg van de constructie en bevestiging aan de veldspuitapparatuur een tophoek
      van maximaal 90° kent en aan de zijde van het oppervlaktewater een verticale of nagenoeg verticale neerwaartse
      richting van het bestrijdingsmiddel creëert;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.q
    text: |-
      *kantstrooivoorziening:* voorziening die tijdens het toedienen van korrel- en poedervormige meststoffen
      bewerkstelligt dat de verspreiding van die meststoffen richting het oppervlaktewater wordt verhinderd;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.r
    text: '*lozen:* het in oppervlaktewater brengen van afvalstoffen, verontreinigende of schadelijke stoffen;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.s
    text: |-
      *luchtondersteuning:* voorziening aan de spuitboom van veldspuitapparatuur, waarbij een separate luchtstroom een
      geforceerde neerwaartse richting van het bestrijdingsmiddel creëert;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.t
    text: |-
      *meststoffen:* stoffen als bedoeld in [artikel 1, onderdeel d, van de Meststoffenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '1'
  - number: 1.1.u
    text: '*NEN:* door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.v
    text: '*nieuw lozen:* lozen dat geen bestaand lozen is;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.w
    text: '*omvangrijk lozen:* lozen van meer dan 10 doch niet meer dan 200 inwonerequivalenten;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.x
    text: '*Onze Minister:* Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.y
    text: '*Onze Ministers:* Onze Minister en Onze Minister van Landbouw, Natuur en Voedselkwaliteit'
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.z
    text: |-
      *overkapte beddenspuit:* apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen waarbij de
      spuitdoppen gemonteerd zijn binnen een overkapping, die met uitzondering van de voor- en de achterzijde van de
      apparatuur, het gewasbed min of meer omsluit en waarbij per gewasbed een eenheid van spuitleiding en overkapping
      wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.aa
    text: |-
      *reflectiescherm:* verticale constructie aan een apparaat dat bestemd is voor het gebruiken van
      bestrijdingsmiddelen, met een zodanige hoogte en breedte dat het verwaaien van spuitnevel wordt beperkt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.bb
    text: |-
      *riolering:* voorziening voor de inzameling en het transport van afvalwater als bedoeld in
      [artikel 10.30 van de Wet milieubeheer][ref1] of een daarop aangesloten bedrijfsriolering;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 1.1.cc
    text: |-
      *spuitdop:* uitstroomopening van apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen die in staat
      is spuitvloeistof zo te verdelen in druppels dat er op de grond of op het landbouwgewas een regelmatige verdeling
      ontstaat;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.dd
    text: |-
      *spuitgeweer:* apparatuur die bestemd is voor het gebruiken van bestrijdingsmiddelen bestaande uit een spuitleiding
      die is voorzien van één spuitdop die met de hand wordt vastgehouden en bediend;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.ee
    text: |-
      *teeltvrije zone:* strook tussen de insteek van het oppervlaktewater en het te telen gewas waarop, behoudens
      grasland, geen gewas of niet hetzelfde gewas als op de rest van het perceel wordt geteeld;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.ff
    text: |-
      *testcertificaat:* schriftelijke verklaring, afgegeven door een deskundig, onafhankelijk instituut, waaruit blijkt
      dat een driftarme dop, die bij het gebruiken van gewasbeschermingsmiddelen wordt toegepast, voldoet aan de bij of
      krachtens dit besluit gestelde eisen ten aanzien van driftarme doppen;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.gg
    text: |-
      *tunnelspuit:* apparatuur die is bestemd voor het gebruiken van bestrijdingsmiddelen in een gewasrij waarbij het
      verwaaien van spuitnevel wordt beperkt door een constructie die de gewasrij geheel of gedeeltelijk omsluit;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.hh
    text: |-
      *vanggewas:* tijdens het gebruiken van een bestrijdingsmiddel aanwezige barrière van bomen, struiken of andere
      gewassen welke van tenminste gelijke hoogte is als de bovenste in gebruik zijnde spuitdop van de gebruikte
      apparatuur én van tenminste gelijke hoogte als het gewas op het perceel, die het verwaaien van spuitvloeistof naar
      het oppervlaktewater beperkt, die met uitzondering van een doorrijscherm op de kopakker aaneengesloten is;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.ii
    text: |-
      *veldspuitapparatuur:* mechanisch voortbewogen apparatuur die bestemd is voor het gebruiken van
      bestrijdingsmiddelen, bestemd voor bovengrondse volveldsbehandeling in buitenteelten, die een overwegend
      neerwaartse uitstroming van de spuitvloeistof bewerkstelligt;
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.1.jj
    text: |-
      *waterkwaliteitsbeheerder:* het bestuursorgaan dat overeenkomstig [artikel 3 van de wet][ref1] bevoegd is of zou
      zijn een vergunning te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
  - number: 1.1.kk
    text: |-
      *wet:* [Wet verontreiniging oppervlaktewateren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen, wordt de afstand tot de dichtstbijzijnde
      riolering berekend langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden
      aangelegd.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen, wordt in uiterwaarden en buitendijkse
      gebieden onder oppervlaktewater verstaan: beddingen waarin ten tijde van het lozen een aan het aardoppervlak en de
      open lucht grenzende watermassa voorkomt.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt het aantal inwonerequivalenten van een
      lozing van huishoudelijk afvalwater berekend door:
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.4.a
    text: het aantal kubieke meters gebruikt water per 365 dagen te vermenigvuldigen met de factor 0,023, of
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: 1.4.b
    text: het aantal mandagen per 365 dagen te vermenigvuldigen met de factor 0,0011.
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
  - number: '1.5'
    text: |-
      Dit besluit berust voor de [artikelen 1][ref1], [2][ref2], [3][ref3], [5][ref4], [13][ref5],
      [15][ref6], [17][ref7], [21][ref8] en [25][ref9] mede op de [artikelen 79][ref10] en
      [80 van de Wet gewasbeschermingsmiddelen en biociden][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0011133#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011133#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011133#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011133#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0011133#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0011133#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0011133#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0011133#Artikel21
      [ref9]: https://wetten.overheid.nl/BWBR0011133#Artikel25
      [ref10]: https://wetten.overheid.nl/BWBR0021670#Artikel79
      [ref11]: https://wetten.overheid.nl/BWBR0021670#Artikel80
    url: https://wetten.overheid.nl/BWBR0011133/2009-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011133
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0011133
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0011133
        artikel: '3'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0011133
        artikel: '5'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0011133
        artikel: '13'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0011133
        artikel: '15'
        hoofdstuk: II
      - id: ref7
