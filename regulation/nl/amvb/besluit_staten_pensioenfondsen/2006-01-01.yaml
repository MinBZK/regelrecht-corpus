  - number: '6'
    text: |-
      1 Het bedrag van de boete, bedoeld in
      [artikel 23c, vijfde lid, eerste volzin, van de Pensioen- en spaarfondsenwet][ref1], wordt bepaald op de wijze,
      voorzien in [bijlage C][ref2] bij dit besluit.

      2 De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in [bijlage C][ref3] is bepaald,
      indien het bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel23c
      [ref2]: https://wetten.overheid.nl/BWBR0009874
      [ref3]: https://wetten.overheid.nl/BWBR0009874
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 23c
      - id: ref2
        bwb_id: BWBR0009874
      - id: ref3
        bwb_id: BWBR0009874
  - number: '7'
    text: |-
      De Pensioen- & Verzekeringskamer kan een fonds ontheffing verlenen van de verplichting om bepaalde staten
      of gedeelten daarvan in te dienen. Een ontheffing kan onder beperkingen worden verleend en daaraan kunnen
      voorschriften worden verbonden. De ontheffing kan voorts worden gewijzigd en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel7
  - number: '8'
    text: |-
      Ieder fonds dat voor eigen rekening en risico belegt, dient binnen 6 weken na afloop van ieder kwartaal bij de
      Pensioen- & Verzekeringskamer gegevens in omtrent zijn beleggingen.
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel8
  - number: '9'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel9
  - number: '10'
    text: De besluiten van 26 oktober 1993, Stb. 577 en Stb. 578, worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel10
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit staten pensioenfondsen.'
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel12
