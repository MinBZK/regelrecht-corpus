preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 26 juni 1998, Directie Sociale
    Verzekeringen, Nr. SV/VP/98/2787a;

    Gelet op artikel 28 van de Pensioen- en spaarfondsenwet en artikel 25 van de Wet betreffende verplichte deelneming
    in een beroepspensioenregeling;

    De Raad van State gehoord (advies van 16 juli 1998, No. W12.98.0282);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 20 augustus 1998,
    Directie Sociale Verzekeringen, SV/VP/98/3150;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit berust op [artikel 10b, achtste lid, van de Pensioen- en spaarfondsenwet][ref1].

      2 In dit besluit wordt verstaan onder:

      a. Pensioen- & Verzekeringskamer: de Pensioen- & Verzekeringskamer, bedoeld in
      [artikel 2, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2];

      b. fonds: een bedrijfstakpensioenfonds, ondernemingspensioenfonds of een ondernemingsspaarfonds, waarop de
      [Pensioen- en spaarfondsenwet][ref3] van toepassing is;

      c. staten: de jaarlijks door ieder fonds bij de Pensioen- & Verzekeringskamer in te dienen gegevens met de daarbij
      behorende omslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 10b
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002089
  - number: '2'
    text: |-
      1 Ieder fonds vult de staten in, verstrekt de daartoe vereiste gegevens naar waarheid en ondertekent de staten.

      2 Staten die niet van toepassing zijn op een fonds behoeven niet te worden ingediend. Bij verschil van mening
      hierover beslist de Pensioen- & Verzekeringskamer.

      3 Op de omslag wordt de statutaire naam van het fonds ingevuld.

      4 De staten worden ingevuld volgens het model, opgenomen in [bijlage A][ref1] bij dit besluit.

      5 De Pensioen- & Verzekeringskamer kan met betrekking tot het invullen van de staten aanwijzingen geven en deze
      aanwijzingen wijzigen en aanvullen.


      [ref1]: https://wetten.overheid.nl/BWBR0009874
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009874
  - number: '4'
    text: |-
      1 De indiening van de staten over een kalenderjaar vindt vóór 1 juli van het daarop volgende kalenderjaar plaats.

      2 De Pensioen- & Verzekeringskamer kan in bijzondere gevallen ontheffing verlenen van de verplichting om de staten
      vóór de datum, genoemd in het eerste lid, in te dienen onder gelijktijdige vermelding van een latere datum waarvoor
      indiening plaatsvindt. De [tweede en derde zin van artikel 7][ref1] zijn daarbij van overeenkomstige toepassing.

      3 Een aanvraag voor ontheffing wordt vóór 1 mei van het betreffende kalenderjaar bij de Pensioen- &
      Verzekeringskamer ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009874#Artikel7
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009874
        artikel: '7'
  - number: '5'
    text: |-
      1 De staten worden in enkelvoud ingediend bij de Pensioen- & Verzekeringskamer. Indien bij het invullen van de
      staten gebruik wordt gemaakt van de in het tweede lid bedoelde informatiedragers of informatiemedia, worden deze
      meegezonden.

      2 Indien de staten worden ingevuld met gebruikmaking van elektronische informatiedragers of informatiemedia, wordt
      voor de samenstelling en aanlevering van de daarop aanwezige gegevens gebruik gemaakt van de door de Pensioen-
      & Verzekeringskamer voor dat doel ter beschikking gestelde programmatuur, overeenkomstig de daarbij gegeven
      instructies omtrent de volledigheid van de in te dienen gegevens en de uit te voeren consistentiecontrole.

      3 Aan de staten, waarvan het model is opgenomen in [bijlage A][ref1] bij dit besluit, worden geen andere posten of
      rubrieken toegevoegd.

      4 Staat 3.400 (Actuarieel verslag) wordt voorzien van een verklaring van een actuaris, tegen wie de Pensioen- &
      Verzekeringskamer geen bedenkingen naar voren heeft gebracht. Met deze verklaring bevestigt de actuaris dat hij
      zich ervan heeft overtuigd, dat:

      a. de technische voorzieningen met inachtneming van de op de staat 3.400 voorkomende gegevens als geheel op
      voldoende voorzichtige grondslagen zijn berekend;

      b. voldaan is aan [artikel 9a, van de Pensioen- en spaarfondsenwet][ref2]; en

      c. dat de sterftevergelijking juist is weergegeven, waarvan hij als bewijs de staten 3.410 en 3.530 waarmerkt. De
      actuaris kan zijn verklaring nader toelichten of op onderdelen een voorbehoud maken.

      5 Een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] waarmerkt de
      staten en voorziet deze van een accountantsverklaring.

      6 De door een fonds in te dienen staten worden ondertekend door het bestuur. Bestaat het bestuur uit meer dan twee
      personen, dan worden de staten door twee bestuursleden ondertekend.

      7 De Pensioen- & Verzekeringskamer kan ten aanzien van het eerste en zesde lid nadere regels stellen met betrekking
      tot de wijze van indiening en ondertekening van de staten.


      [ref1]: https://wetten.overheid.nl/BWBR0009874
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009874/2006-01-01#Artikel5
