    text: |-
      In afwijking van [artikel 2][ref1] ontvangt de verzekerde ingevolge de [Ziekenfondswet][ref2] de vergoeding indien
      hij in 1997, onderscheidenlijk in 1997 en 1998, de maximale bijdrage, bedoeld in artikel 2*b*, eerste lid, van dat
      besluit, heeft betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002520#Artikel2c
      [ref2]: https://wetten.overheid.nl/BWBR0002460
