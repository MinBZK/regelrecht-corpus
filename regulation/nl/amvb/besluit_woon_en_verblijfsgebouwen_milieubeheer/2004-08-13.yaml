  - number: 1.g
    text: |-
      equivalent geluidniveau: gemiddelde van de afwisselende niveaus van het ter plaatse optredende geluid, gemeten
      in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de «Handleiding meten en rekenen
      industrielawaai, IL-HR-13-01», uitgave 1981;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel1
  - number: 1.h
    text: |-
