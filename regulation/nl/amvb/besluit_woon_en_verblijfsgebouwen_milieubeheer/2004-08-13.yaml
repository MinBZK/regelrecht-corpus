  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op een inrichting waar een of meer voorzieningen of installaties aanwezig zijn,
      waardoor de inrichting kan worden aangemerkt als uitsluitend of in hoofdzaak een gebouw voor:
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.a.1°
    text: tijdelijke of permanente bewoning;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.a.2°
    text: |-
      het bieden van dag- of nachtverblijf of het bieden van sociaal maatschappelijke opvang, hulp- of dienstverlening,
      of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.a.3°
    text: het bieden van opvang, of tijdelijk verblijf aan personen;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.b
    text: |-
      het leveren van administratieve diensten of producten, anders dan het verkopen of verhuren aan particulieren van
      roerende zaken, het verrichten van administratieve werkzaamheden of het verrichten van financiële transacties;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.c
    text: het voorbereiden en het houden van kerkelijke of levensbeschouwelijke bijeenkomsten of lijkplechtigheden;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.d
    text: het bieden van onderwijs, opleiding, vorming of cursussen;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.e
    text: |-
      het verrichten van medische of paramedische controle, onderzoek, behandeling, het bieden van verpleging, verzorging
      of therapie of het afnemen van bloed of plasma;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.f
    text: het opslaan en uitlenen van hulp- of verzorgingsartikelen ten behoeve van de thuiszorg;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.g
    text: |-
      het opslaan van boeken, documenten, bescheiden of andere informatiedragers en voortbrengsels van kunst, cultuur of
      wetenschap, of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: 2.1.h
    text: |-
      het voorbereiden of uitvoeren van radio- of televisie-uitzendingen met een permanente voorziening voor de
      aanwezigheid van bezoekend publiek tot een maximum van 50 personen.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op inrichtingen waarin uitsluitend of in hoofdzaak sprake is van een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a tot en met h.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel2
  - number: '3'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009934#Artikel2
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009934
        artikel: '2'
  - number: 3.a
    text: |-
      in de inrichting of een onderdeel daarvan een of meer stookinstallaties voor verwarming of warmtekrachtopwekking
      aanwezig zijn met een thermisch vermogen per toestel van 2500 kW of meer;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.b
    text: |-
      in de inrichting of een onderdeel daarvan een of meer installaties of voorzieningen aanwezig zijn die kunnen
      worden gebruikt voor het verstoken of verbranden van andere brandstoffen dan aardgas, propaangas, butaangas of
      gasolie, tenzij sprake is van een open haard voor het verbranden van hout, die alleen is bedoeld voor bij- of
      sfeerverwarming;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.c
    text: |-
      in de inrichting of een onderdeel daarvan koel- of vriesinstallaties of warmtepompen aanwezig zijn met een
      capaciteit of een totale capaciteit van meer dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels
      van propaan en butaan;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.d
    text: |-
      afvalstoffen worden op- of overgeslagen die van buiten de inrichting afkomstig zijn voorzover de inrichting
      beschikt over een capaciteit:
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.d.1°
    text: van meer dan 35 m3 voor de opslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.d.2°
    text: voor de opslag van gevaarlijke afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.d.3°
    text: van meer dan 1000 m3 per jaar voor de overslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.e
    text: 'in de inrichting of een onderdeel daarvan voorzieningen of installaties aanwezig zijn voor het:'
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.e.1°
    text: opslaan van gevaarlijke stoffen met een capaciteit van 10 000 kg of meer;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.e.2°
    text: |-
      afleveren van brandstoffen aan andere transportmiddelen dan die welke voor eigen gebruik binnen de inrichting
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.e.3°
    text: |-
      opslaan van vloeibare gevaarlijke stoffen of vloeibare gevaarlijke afvalstoffen in tanks, tenzij sprake is van
      opslaan in ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is,
      dan wel sprake is van opslaan van brandbare vloeistoffen in bovengrondse tanks dan wel sprake is van een opslag
      overeenkomstig voorschrift 2.1.5, onder a;


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.e.4°
    text: |-
      opslaan van gassen of gasmengsels in tanks, tenzij sprake is van opslag waarop het
      [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 3.e.5°
    text: |-
      opslaan van bestrijdingsmiddelen in de zin van de [Bestrijdingsmiddelenwet][ref1] met een capaciteit van 400 kg
      of meer;


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 3.f
    text: 'deze is ingericht:'
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.f.1°
    text: |-
      voor het doen verblijven van dieren van anderen dan degene die de inrichting drijft, op een terrein in de open
      lucht;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.f.2°
    text: als hippisch opleidingscentrum;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.f.3°
    text: voor het bedrijfsmatig houden, fokken, verhandelen of slachten van dieren;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.f.4°
    text: als brandweerkazerne, of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.f.5°
    text: voor het opslaan van vuurwerk.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.g
    text: |-
      vaklokalen of werkplaatsen niet uitsluitend of in hoofdzaak worden gebruikt voor onderwijs dan wel voor onderhoud,
      ondersteuning of reparatie van tot de inrichting behorende gebouwen, installaties of toestellen;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.h
    text: |-
      in de inrichting onderzoek of werkzaamheden worden verricht met genetisch gemodificeerde organismen, als bedoeld in
      [artikel 1, onder f, van het Besluit genetisch gemodificeerde organismen Wet milieugevaarlijke stoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004703#Artikel1
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004703
        artikel: '1'
  - number: 3.i
    text: |-
      de inrichting of een onderdeel daarvan is bestemd tot praktijkruimte voor chemisch
      of biochemisch, natuurkundig, technisch, agrarisch of veterinair onderwijs waarop de
      [Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 3.j
    text: |-
      de inrichting of een onderdeel daarvan is bestemd tot academisch ziekenhuis, als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en het wetenschappelijk onderzoek][ref1],
      dan wel tot algemeen of categoraal ziekenhuis, als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ____, of tot laboratorium;


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003257#Artikel1
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003257
        artikel: '1'
  - number: 3.k
    text: |-
      in de inrichting met vuurwapens wordt geschoten, met ontvlambare of explosieve voorwerpen wordt geworpen of op een
      open terrein van de inrichting met wapens werkend met luchtdruk of gasdruk wordt geschoten;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.l
    text: |-
      het totale permanent aanwezige elektromotorische en verbrandingsmotorische vermogen voor reprografische
      activiteiten meer bedraagt dan 40 kW, of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: 3.m
    text: de inrichting is bestemd tot tandartspraktijk.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel3
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel4
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, hoofdstukken 1 tot en met 3, inhoudt dat daarbij aangegeven
      middelen ter bescherming van het milieu moeten worden toegepast, kan degene die de inrichting drijft, andere
      middelen toepassen mits hij, voordat hij die andere middelen toepast, aan het bevoegd gezag aantoont dat met de
      door hem gekozen middelen een ten minste gelijkwaardige bescherming voor het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel4
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen, afvalwater,
      waterbesparing, lucht en verlichting, voorzover dat in hoofdstuk 4 van die bijlage is aangegeven, of
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel5
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, onderzoek naar bodemverontreiniging voorzover dat in
      hoofdstuk 4 van de bijlage is aangegeven, de gevolgen van het verkeer van personen of goederen van en naar de
      inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan veroorzaken waarop paragraaf 1.8 van de
      bijlage betrekking heeft, indien dat bijzonder is aangewezen in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit tevoren aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '6.2'
    text: De melding geschiedt ten minste vier weken voor het tijdstip waarop de inrichting zal worden opgericht.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '6.3'
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing met betrekking tot het veranderen van een
      inrichting en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding
      overeenkomstig dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding
      verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '6.4'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: 6.4.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: 6.4.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien degene die de inrichting drijft of zal drijven, een andere persoon is, de naam en het adres van die persoon;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: 6.4.c
    text: de aard van en de activiteiten of processen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: 6.4.d
    text: de indeling en de uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: 6.4.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '6.5'
    text: |-
      De in het vierde lid vermelde gegevens behoeven niet te worden verstrekt indien degene die de inrichting drijft,
      deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '6.6'
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het bevoegd
      gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel6
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning gold, blijven de voorschriften van die vergunning gelden als nadere
      eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften, gedurende
      drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009934#Artikel5
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009934
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009934
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens het Besluit
      woon- of kantoorgebouwen milieubeheer of het Besluit scholen en opleidingsinstituten milieubeheer, blijven gelden
      als nadere eis, bedoeld in [artikel 5][ref1], na het tijdstip van de inwerkingtreding van dit besluit, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009934#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009934#Artikel5
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009934
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009934
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning gold of geen melding was gedaan krachtens het Besluit
      woon- of kantoorgebouwen milieubeheer of het Besluit scholen en opleidingsinstituten milieubeheer, meldt degene die
      de inrichting drijft aan het bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009934#Artikel6
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009934
        artikel: '6'
  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten van
      een inrichting door het bevoegd gezag in behandeling is genomen en dit besluit op de inrichting van toepassing is
      of zal zijn, zijn het eerste en tweede lid niet van toepassing. De aanvraag om de vergunning wordt in dat geval
      aangemerkt als een melding overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009934#Artikel6
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009934
        artikel: '6'
  - number: '9.1'
    text: |-
      Het Besluit woon- of kantoorgebouwen milieubeheer en het Besluit scholen en opleidingsinstituten milieubeheer
      worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel9
  - number: '9.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      de bijlage opgenomen voorschrift 1.3.13, onder b, c, g en h.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel9
  - number: '10'
    text: Dit besluit treedt in werking met ingang van 1 december 1998.
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit woon- en verblijfsgebouwen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0009934/2004-08-13#Artikel11
