preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 13 februari 1995, directoraat-generaal voor Openbare
    Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening, afdeling
    Arbeidsvoorwaardenbeleid, nr. EA94/1434;

    Gelet op artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 6 maart 1995, nummer W04.95.0071);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 29 maart 1995, directoraat-generaal voor
    Openbare Orde en Veiligheid, directie Politie, hoofdafdeling Personeel, Onderwijs en Informatievoorziening,
    afdeling Arbeidsvoorwaardenbeleid, nr. EA95/U741;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.b
    text: |-
      de vrijwillige ambtenaar in opleiding: degene die door het bevoegd gezag is benoemd tot vrijwillige ambtenaar in
      opleiding en die is toegelaten tot de opleiding tot vrijwillige ambtenaar van politie;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.c
    text: |-
      vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak: de ambtenaar, bedoeld in
      [artikel 2, onderdeel c, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 1.1.d
    text: |-
      de vrijwillige ambtenaar van politie: de vrijwillige ambtenaar aangesteld voor de uitvoering van de politietaak, de
      vrijwillige ambtenaar aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie en de vrijwillige ambtenaar in opleiding;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.e
    text: 'bevoegd gezag:'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.e.1
    text: |-
      de korpschef, voor zover het betreft de vrijwillige ambtenaar van politie, die werkzaam is bij het landelijk
      politiekorps;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.e.2
    text: het College van procureurs-generaal, voor zover het betreft ambtenaren van de rijksrecherche;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: 1.1.f
    text: |-
      de vrijwillige ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste
      van de politie: de ambtenaar, bedoeld in [artikel 2, eerste lid, onderdeel b, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder echtgenote of echtgenoot mede verstaan de geregistreerde partner
      alsmede de levenspartner met wie de niet-gehuwde ambtenaar samenwoont en – met het oogmerk duurzaam samen te leven
      – een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende
      de wederzijdse rechten en verplichtingen ter zake van die samenwoning en gemeenschappelijke huishouding. Onder
      weduwe of weduwnaar wordt mede begrepen de achtergebleven geregistreerde partner alsmede de nabestaande partner.
      Tot gezinslid wordt in voorkomend geval mede gerekend de geregistreerde partner alsmede de levenspartner.
      Tegelijkertijd kan slechts een persoon als echtgenoot of echtgenote dan wel weduwe of weduwnaar worden aangemerkt.
      Het bevoegd gezag kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt
      dat een samenlevingscontract als bedoeld in de eerste volzin is gesloten.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel1
  - number: '2.1'
    text: De aanstelling geschiedt in tijdelijke of in vaste dienst.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel2
  - number: '2.2'
    text: Een aanstelling in tijdelijke dienst geschiedt voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      De aanstelling van de vrijwillige ambtenaar in opleiding geschiedt in tijdelijke dienst voor de tijd dat de
      opleiding tot vrijwillige ambtenaar van politie wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Na het voltooien van de opleiding tot vrijwillige ambtenaar van politie vindt een aanstelling in tijdelijke dienst
      plaats voor een proeftijd van één jaar, zonodig in bijzondere gevallen op verzoek van de ambtenaar met één jaar
      te verlengen en zonodig ambtshalve te verlengen met de tijd gedurende welke de ambtenaar de proeftijd niet in
      werkelijke dienst heeft doorgebracht.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Degene die de opleiding tot vrijwillige ambtenaar van politie alsmede de daarop volgende proeftijd heeft voltooid,
      wordt in vaste dienst aangesteld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3
  - number: 3a.1
    text: |-
      Een aanstelling van een vrijwillige ambtenaar, aangesteld voor de uitvoering van technische, administratieve en
      andere taken ten dienste van de politie kan in tijdelijke dienst plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.1.a
    text: |-
      voor een proeftijd van één jaar, zonodig in bijzondere gevallen op aanvraag van de ambtenaar met één jaar te
      verlengen en zonodig ambtshalve te verlengen met de tijd, gedurende welke de ambtenaar de proeftijd niet in
      werkelijke dienst heeft doorgebracht;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.1.b
    text: ter vervanging van een wegens ziekte of uit anderen hoofde afwezige ambtenaar;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.1.c
    text: ter uitvoering van werkzaamheden van kennelijk tijdelijk karakter;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.1.d
    text: |-
      indien het een ambtenaar betreft die in dienst wordt genomen als leerling ter opleiding tot een functie binnen de
      politieorganisatie dan wel in verband met zijn verdere praktische opleiding of vorming, of indien een wijziging in
      de taak van het betrokken dienstvak is voorgenomen;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.1.e
    text: indien een wijziging in de taak van het betrokken dienstvak is voorgenomen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Zodra de omstandigheid die leidde tot een aanstelling in tijdelijke dienst als bedoeld in het eerste lid,
      onderdelen a tot en met e, zich niet meer voordoet, wordt de desbetreffende ambtenaar zo mogelijk in vaste dienst
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.3
    text: |-
      In de gevallen, bedoeld in het eerste lid, onderdelen c en e, wordt in ieder geval aangenomen dat de omstandigheid
      die leidde tot een aanstelling in tijdelijke dienst zich niet meer voordoet, wanneer de ambtenaar sinds twee jaar
      zonder onderbreking van langer dan één maand , waarvan laatstelijk gedurende ten minste één jaar in zijn huidige
      betrekking, in dienst is. Dit geldt echter niet in die gevallen waarin vaststaat dat zijn werkzaamheden in de door
      hem vervulde betrekking binnen het jaar zullen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: 3a.4
    text: |-
      Bij ministeriële regeling worden criteria gegeven op grond waarvan de in het derde lid genoemde periode van twee
      jaar kan worden verlengd tot vijf jaar.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel3a
  - number: '4.1'
    text: 'Voor aanstelling als vrijwillige ambtenaar van politie komt uitsluitend in aanmerking degene die:'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: 4.1.a
    text: Nederlander is;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: 4.1.b
    text: de door Onze Minister vast te stellen minimum leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: 4.1.c
    text: |-
      voldoet aan bij regeling van Onze Minister te stellen eisen met betrekking tot het
      opleidingsniveau, de psychologische keuring en een geneeskundige keuring als bedoeld in
      [artikel 1, onder a, van de Wet op de medische keuringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel1
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '1'
  - number: 4.1.d
    text: voldoet aan overige bij regeling van Onze Minister te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      Teneinde vast te stellen of de ambtenaar in voldoende mate geschikt en bekwaam is voor de vervulling van de
      functie, kan het bevoegd gezag de gegevens die door de betrokkene desgevraagd zijn verstrekt, verifiëren en zonodig
      aanvullen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      De betrokkene die op grond van het eerste lid, onderdeel c, is onderworpen aan een geneeskundige keuring, wordt
      bij aanstelling in een andere functie opnieuw aan een geneeskundige keuring onderworpen, indien betrokkene voor het
      vervullen van die functie aan andere medische eisen dient te voldoen dan voor de tot dusverre vervulde functie.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4
  - number: 4a.1
    text: |-
      Aanstelling als vrijwillige ambtenaar van politie in opleiding is slechts mogelijk, indien op grond van een ten
      aanzien van de betrokkene ingesteld onderzoek naar de betrouwbaarheid en geschiktheid geen bezwaar blijkt te
      bestaan tegen diens aanstelling.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Ten behoeve van een onderzoek als bedoeld in het eerste lid, vraagt het bevoegde gezag om verstrekking van
      justitiële gegevens als bedoeld in [artikel 23 van het Besluit justitiële gegevens][ref1] en om verstrekking van
      gegevens als bedoeld in [artikel 4:3 van het Besluit politiegegevens][ref2], tenzij het een functie betreft als
      bedoeld in [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0023086
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 4a.3
    text: |-
      Een onderzoek als bedoeld in het eerste lid, of een veiligheidsonderzoek wordt ingesteld nadat het bevoegde gezag
      de betrokkene overigens bekwaam en geschikt acht.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4a
  - number: 4a.4
    text: |-
      Het eerste lid is niet van toepassing indien het een aanstelling betreft in een functie waarin technische,
      administratieve en andere taken ten dienste van de politie worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4a
  - number: 4aa
    text: |-
      Voor de aanstelling als vrijwillige ambtenaar, aangesteld voor de uitvoering van technische,
      administratieve en andere taken ten dienste van de politie gelden dezelfde eisen, bedoeld in
      [artikel 8 van het Besluit algemene rechtspositie politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel8
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4aa
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '8'
  - number: 4b.1
    text: |-
      Indien naar het oordeel van het bevoegd gezag de aard van de functie of van de werkzaamheden hiertoe aanleiding
      geeft, kan in de volgende gevallen opnieuw een onderzoek als bedoeld in [artikel 4a, eerste lid][ref1], worden
      uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel4a
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
  - number: 4b.1.a
    text: bij wijziging van werkzaamheden,
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
  - number: 4b.1.b
    text: bij aanstelling in een andere functie,
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
  - number: 4b.1.c
    text: bij de vervulling van de functie gedurende ten minste vijf dienstjaren, of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
  - number: 4b.1.d
    text: |-
      bij een redelijk vermoeden van ernstig plichtsverzuim dat de integriteit of de verantwoordelijkheid van de
      betrokkene raakt.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
  - number: 4b.2
    text: |-
      Het eerste lid is niet van toepassing indien het een functie als bedoeld in
      [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref1], betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '1'
  - number: 4c
    text: |-
      Onze Minister stelt nadere regels vast ter uitvoering van het in de [artikelen 4a][ref1] en [4b][ref2] bedoelde
      onderzoek naar de betrouwbaarheid en geschiktheid voor zover ten behoeve van dat onderzoek wordt gevraagd om
      verstrekking van justitiële gegevens als bedoeld in [artikel 23 van het Besluit justitiële gegevens][ref3] en
      om verstrekking van gegevens als bedoeld in [artikel 4:3 van het Besluit politiegegevens][ref4]. Deze nadere
      regels bevatten in ieder geval waarborgen omtrent een voldoende bescherming van de persoonlijke levenssfeer van
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0007321#Artikel4b
      [ref3]: https://wetten.overheid.nl/BWBR0016544#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0023086#Artikel4
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: 4a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007321
        artikel: 4b
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0016544
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0023086
        artikel: '4'
  - number: '5.1'
    text: |-
      Vóór de aanvaarding van zijn ambt legt de vrijwillige ambtenaar van politie de volgende eed dan wel verklaring
      en belofte van zuivering af: «Ik zweer (verklaar), dat ik middellijk of onmiddellijk in welke vorm dan ook, tot
      het verkrijgen van mijn aanstelling aan niemand, wie hij ook zij, iets heb gegeven of beloofd. Ik zweer (beloof),
      dat ik, om iets in mijn betrekking te doen of te laten, van niemand, middellijk of onmiddellijk, enige beloften
      of geschenken zal aannemen. Zo waarlijk helpe mij God almachtig (Dat verklaar en beloof ik)!». Daarna wordt de
      volgende eed of belofte afgelegd: «Ik zweer (beloof) trouw aan de Koning, aan de Grondwet en aan de wetten van
      ons land. Ik zweer (beloof) dat ik de krachtens de wet uitgevaardigde voorschriften en verordeningen zal nakomen
      en handhaven, dat ik de mij verstrekte opdrachten plichtsgetrouw en nauwgezet zal volbrengen en de zaken, waarvan
      ik door mijn ambt kennis draag en die mij als geheim zijn toevertrouwd, of waarvan ik het vertrouwelijk karakter
      moet begrijpen, niet zal openbaren aan anderen dan aan hen, aan wie ik volgens de wet of ambtshalve tot mededeling
      verplicht ben. Ik zweer (beloof) dat ik mij zal gedragen zoals een goed ambtenaar betaamt, dat ik zorgvuldig,
      onkreukbaar en betrouwbaar zal zijn en dat ik niets zal doen dat het aanzien van het ambt zal schaden. Zo waarlijk
      helpe mij God almachtig (Dat beloof ik)!»
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De vrijwillige ambtenaren van politie leggen de eden dan wel verklaringen en beloften af ten overstaan van het
      bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel5
  - number: '6.1'
    text: |-
      Aan de vrijwillige ambtenaar van politie wordt, zo mogelijk vóór de aanvaarding van zijn ambt, een akte van
      aanstelling door of vanwege het bevoegd gezag uitgereikt, waarin in elk geval worden vermeld:
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.a
    text: de naam, de voornamen en de geboortedatum van de ambtenaar;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.b
    text: |-
      of de aanstelling geschiedt in vaste of in tijdelijke dienst al dan niet met een proeftijd en de duur van de
      eventuele proeftijd;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.c
    text: de functie waarin hij wordt aangesteld;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.d
    text: |-
      de plaats van tewerkstelling en het werkgebied, bedoeld in
      [artikel 1, eerste lid, onderdelen v en x, van het Besluit algemene rechtspositie politie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 6.1.e
    text: de datum van ingang van de aanstelling;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.f
    text: de rang waarin hij wordt aangesteld en
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: 6.1.g
    text: het gegeven dat de eden dan wel de verklaringen en beloften zijn afgelegd, en de datum waarop dit is gebeurd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Voor zover deze gegevens niet reeds in de akte van aanstelling zijn vermeld, deelt het bevoegd gezag de ambtenaar
      zo spoedig mogelijk schriftelijk andere hem mogelijk toegekende voordelen mee, onder verwijzing naar de regeling
      waarop de toekenning berust en de eventuele voorwaarden die aan de toekenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      De vrijwillige ambtenaar van politie wordt bij zijn aanstelling schriftelijk door het bevoegd gezag op de hoogte
      gesteld van de hoofdlijnen van zijn rechtspositie.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Regelingen waarin zijn rechtspositie is neergelegd, worden op een voor de ambtenaar gemakkelijk toegankelijke
      plaats ter inzage gelegd. Hij kan kosteloos hiervan afschriften maken.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      De schriftelijk vastgestelde en voor hem geldende regelingen en instructies, die hij bij de vervulling van zijn
      dienst heeft na te leven, worden eveneens op een voor de ambtenaar gemakkelijk toegankelijke plaats ter inzage
      gelegd. Hij kan kosteloos hiervan afschriften maken.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel7
  - number: '7.4'
    text: Over wijzigingen in regelingen betreffende zijn rechtspositie wordt de ambtenaar schriftelijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel7
  - number: '8'
    text: |-
      Het bevoegd gezag bepaalt de werktijden voor de vrijwillige ambtenaren, aangesteld voor de uitvoering van de
      politietaak met dien verstande dat de vrijwillige ambtenaren ten minste gemiddeld vier uur per maand besteden aan
      oefening en scholing.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het bevoegd gezag sluit ten behoeve van de vrijwillige ambtenaren, aangesteld voor de uitvoering van de
      politietaak, een ongevallenverzekering af.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder 'ongeval' en 'arbeidsongeschiktheid' hetgeen daaronder
      wordt verstaan in de door het bevoegd gezag ter zake gesloten ongevallenverzekering.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      De vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak, die arbeidsongeschikt is, heeft,
      indien deze ongeschiktheid blijkens een geneeskundig onderzoek het gevolg is van een ongeval in verband met de
      vervulling van zijn functie, aanspraak op een uitkering overeenkomstig de bepalingen van de verzekering, bedoeld in
      [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel9
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '10.2'
    text: |-
      De verzekering, bedoeld in [artikel 9, eerste lid][ref1], bevat in elk geval de bepaling dat bij blijvende
      arbeidsongeschiktheid aanspraak op een uitkering ineens bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel9
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '10.3'
    text: |-
      De vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak, heeft behoudens [artikel 12][ref1] geen
      aanspraak op enige vergoeding ten laste van het bevoegd gezag ter zake van een ongeval.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel12
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.1'
    text: |-
      Indien een vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak, ten gevolge van een ongeval,
      in verband met de vervulling van zijn functie, komt te overlijden, hebben zijn echtgenote of echtgenoot en
      gezinsleden aanspraak op een uitkering overeenkomstig de bepalingen van de ongevallenverzekering, bedoeld in
      [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel9
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Bij vermissing als bedoeld in [boek 1, titel 18, afdeling 2, van het Burgerlijk Wetboek][ref1], van de vrijwillig
      ambtenaar, aangesteld voor de uitvoering van de politietaak, is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
  - number: '11.3'
    text: |-
      Het tweede lid is niet van toepassing indien gegronde vermoedens bestaan dat de vermissing het gevolg is van
      ongeoorloofde afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel11
  - number: '12'
    text: |-
      In geval van een ongeval, ontstaan ten gevolge van de vervulling van zijn functie, worden de vrijwillige ambtenaar
      van politie, aangesteld voor de vervulling van de politietaak, de te zijnen laste blijvende, naar het oordeel van
      het bevoegd gezag noodzakelijk gemaakte kosten van geneeskundige behandeling of verzorging vergoed.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel12
  - number: '13'
    text: |-
      Indien geen sprake is van een ongeval maar wel van een ziekte die is ontstaan of verergerd ten gevolge van de
      vervulling van de functie, stelt het bevoegd gezag ter zake een uitkering vast voor zover de verzekering, bedoeld
      in [artikel 9, eerste lid][ref1], daar niet in voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel9
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '14'
    text: |-
      De [artikelen 10 tot en met 13][ref1] zijn eveneens van toepassing op de gewezen vrijwillige ambtenaar, aangesteld
      voor de uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel10
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 14a.1
    text: |-
      Het bevoegd gezag bepaalt de wijze waarop de melding als bedoeld in
      [artikel 8, tweede lid, onderdeel a, Ambtenarenwet 2017][ref1] plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel8
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '8'
  - number: 14a.2
    text: |-
      Het bevoegd gezag kan nadere regels stellen omtrent het verbod als bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Ambtenarenwet 2017][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel8
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '8'
  - number: 14c
    text: |-
      De [artikelen 55da tot en met 55dr van het Besluit algemene rechtspositie politie][ref1] zijn van overeenkomstige
      toepassing op vrijwillige ambtenaren van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55da
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55da
  - number: '15.1'
    text: |-
      De verstrekking van uniformkleding aan de vrijwillige ambtenaar van politie geschiedt door de zorg van het bevoegd
      gezag. De verstrekking van uniformkleding geschiedt kosteloos. Onze Minister kan ter zake van de verstrekking van
      uniformkleding nadere regels vaststellen, alsmede ter zake van het onderhoud van uniformkleding regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      De verstrekking van dienstkleding aan de vrijwillige ambtenaar van politie geschiedt door de zorg van het bevoegd
      gezag. De verstrekking van dienstkleding geschiedt kosteloos. Onze Minister kan ter zake van de verstrekking van
      dienstkleding nadere regels vaststellen, alsmede ter zake van het onderhoud van dienstkleding regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel15
  - number: '15.3'
    text: |-
      De vrijwillig ambtenaar van politie is verplicht het uniform en de onderscheidingstekenen te dragen, voor zover dit
      voor hem voorgeschreven is.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      Het is de vrijwillig ambtenaar van politie verboden in dienst uniformkledingstukken te dragen, tenzij deze van
      dienstwege zijn verstrekt of voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het is de vrijwillig ambtenaar van politie verboden bij gekleed gaan in uniform insignes of andere
      onderscheidingstekens te dragen, tenzij deze van regeringswege zijn verstrekt of voorgeschreven of tot het dragen
      daarvan door het bevoegd gezag vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel16
  - number: '17'
    text: |-
      De vrijwillige ambtenaar van politie kan zich niet beroepen op de omstandigheid niet in dienst te zijn, in die
      gevallen waarin zijn optreden redelijkerwijze is vereist.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel17
  - number: '18'
    text: |-
      Indien de vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak, door ziekte of anderszins
      verhinderd is zijn dienst te verrichten, is hij verplicht daarvan, onder opgave van redenen, zo spoedig mogelijk
      mededeling te doen op de door het bevoegd gezag aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel18
  - number: '20.1'
    text: |-
      Van de vrijwillig ambtenaar van politie en de gewezen vrijwillig ambtenaar van politie die geheel of gedeeltelijk
      op kosten van het bevoegd gezag een opleiding hebben verkregen, kunnen deze kosten geheel of gedeeltelijk worden
      teruggevorderd indien:
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: 20.1.a
    text: |-
      de opleiding niet met goed gevolg is afgerond door toedoen van de vrijwillig ambtenaar van politie of in het geval
      het niet met goed gevolg afronden aan eigen schuld van de vrijwillig ambtenaar van politie is te wijten;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: 20.1.b
    text: |-
      de opleiding voortijdig wordt beëindigd door toedoen van de vrijwillig ambtenaar van politie of in het geval de
      beëindiging aan eigen schuld van de vrijwillig ambtenaar van politie is te wijten;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: 20.1.c
    text: |-
      de vrijwillig ambtenaar van politie binnen een periode van drie jaar na afronding van de opleiding de politie
      verlaat tenzij hem het vertrek niet is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      Tot terugvordering van de kosten, bedoeld in het eerste lid, kan slechts worden overgegaan indien de vrijwillig
      ambtenaar van politie schriftelijk heeft verklaard bekend te zijn met de mogelijkheid van terugvordering en met de
      kosten die voor de terugvordering in aanmerking kunnen komen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: '20.3'
    text: |-
      De terugvordering, bedoeld in het eerste lid onder c, geschiedt binnen drie maanden na de datum waarop de
      vrijwillig ambtenaar van politie de politie heeft verlaten. Bij de berekening van de terug te betalen kosten wordt
      rekening gehouden met het reeds verstreken deel van de periode van drie jaar.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: '20.4'
    text: Het bevoegd gezag stelt over de uitvoering van het eerste lid nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het bevoegd gezag kan de vrijwillige ambtenaar van politie verplichten de door de dienst geleden schade, voor zover
      deze aan de ambtenaar is te wijten, geheel of gedeeltelijk te vergoeden. Ten aanzien van gevallen waarin de schade
      minder bedraagt dan € 226,89 kan het bevoegd gezag dan wel, indien het een vrijwillige ambtenaar in opleiding
      betreft, de directeur van de instelling waar hij deze opleiding volgt, de in de eerste volzin bedoelde bevoegdheid
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het bedrag van de schadevergoeding wordt niet vastgesteld dan nadat de ambtenaar in de gelegenheid is gesteld zich
      schriftelijk of mondeling te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel21
  - number: '22.1'
    text: |-
      Aan de vrijwillige ambtenaar van politie wordt de schade aan zijn goederen vergoed die hij buiten zijn schuld lijdt
      ten gevolge van de uitoefening van zijn dienst, voor zover die schade niet bestaat uit de normale slijtage van
      die goederen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      De ambtenaar heeft geen aanspraak, bedoeld in het eerste lid, indien hij terzake van die schade rechten tegenover
      derden kan doen gelden. Indien de ambtenaar zijn rechten tegenover derden aan de regio dan wel het Rijk cedeert,
      wordt hij in het genot gesteld van het in geld uitgedrukte bedrag van de schade.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het bevoegd gezag terzake van de door voornoemde cessie verkregen rechten een civiele vordering instelt,
      worden de kosten die hieruit voor het bevoegd gezag voortvloeien, niet op de ambtenaar verhaald.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22
  - number: 22a.1
    text: |-
      Indien de vrijwillige ambtenaar van politie wegens de uitvoering van de politietaak aansprakelijk wordt
      gesteld naar burgerlijk recht of als verdachte wordt aangemerkt naar strafrecht, kent het bevoegd gezag hem
      een tegemoetkoming in de kosten van rechtskundige hulp toe, tenzij hij naar het oordeel van het bevoegd gezag
      opzettelijk onrechtmatig dan wel opzettelijk wederrechtelijk of bewust roekeloos heeft gehandeld, of grof nalatig
      is geweest.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.2
    text: |-
      Indien de vrijwillige ambtenaar van politie schadevergoeding vordert op grond van onrechtmatige daad, jegens hem
      gepleegd tijdens de uitoefening van de politietaak, kent het bevoegd gezag hem een tegemoetkoming in de kosten van
      rechtskundige hulp toe, tenzij het bevoegd gezag van oordeel is dat de vordering kennelijk onvoldoende grond heeft
      of kennelijk onredelijk is.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.3
    text: |-
      Het eerste en het tweede lid zijn van overeenkomstige toepassing indien de rechtskundige hulp aan de
      ambtenaar is verleend, op grond van zijn lidmaatschap, door een centrale of een vereniging als bedoeld in
      [artikel 2, tweede lid, van het Besluit overleg en medezeggenschap politie 1994][ref1], met dien verstande dat
      de tegemoetkoming in de kosten van rechtskundige hulp rechtstreeks wordt betaald aan voornoemde centrale of
      vereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
  - number: 22a.4
    text: |-
      Het bevoegd gezag kan verdere tegemoetkoming in de kosten van rechtskundige hulp staken of de tegemoetkoming in de
      kosten van de rechtskundige hulp terugvorderen, indien
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.4.a
    text: |-
      de aan een derde toegebrachte schade blijkens rechterlijk vonnis het gevolg is van opzettelijk onrechtmatig dan wel
      opzettelijk wederrechtelijk of bewust roekeloos handelen van de vrijwillige ambtenaar van politie, of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.4.b
    text: indien de vrijwillige ambtenaar van politie strafrechtelijk wordt veroordeeld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.5
    text: |-
      In bijzondere gevallen, gelet op de aard van de zaak of de omstandigheden van de vrijwillige ambtenaar van politie,
      kan het bevoegd gezag, overwegend dat de handeling geen gevolg is van de taakuitoefening van de vrijwillige
      ambtenaar van politie, besluiten tot een tegemoetkoming in de kosten van rechtskundige hulp.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: 22a.6
    text: Onze Minister stelt een regeling vast met betrekking tot tegemoetkoming in de kosten van rechtskundige hulp.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel22a
  - number: '23.1'
    text: |-
      De vrijwillige ambtenaar van politie die in contact staat of kort geleden heeft gestaan met een persoon die een
      ziekte heeft waarvoor krachtens de [Infectieziektenwet][ref1] een nominatieve aangifteplicht geldt, mag zijn dienst
      niet verrichten en heeft geen toegang tot dienstgebouwen, -lokalen en -terreinen dan met toestemming vanwege de
      deskundige persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref2], die is belast met
      de taken, bedoeld in de onderdelen b of c van dat lid, of de arbodienst, bedoeld in [die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009684
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009684
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0010346
  - number: '23.2'
    text: |-
      De ambtenaar die verkeert in de situatie, bedoeld in het eerste lid, is verplicht daarvan ten spoedigste kennis te
      geven aan de deskundige persoon, bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1], die
      is belast met de taken, bedoeld in de onderdelen b of c van dat lid, of de arbodienst, bedoeld in [die wet][ref2].
      Hij is gehouden zich te gedragen naar de vanwege de bedrijfskundige dienst gegeven aanwijzingen, waaronder die met
      betrekking tot het ondergaan van een arbeidsgezondheidskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
  - number: '24.1'
    text: |-
      Aan de vrijwillige ambtenaar van politie kan door het bevoegd gezag de toegang tot de dienstlokalen,
      dienstgebouwen, dienstterreinen, dan wel het verblijf aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel24
  - number: '24.2'
    text: |-
      Hij is verplicht zich te gedragen naar de maatregelen van orde die ten aanzien van het verblijf op voornoemde
      plaatsen zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      De vrijwillige ambtenaar van politie kan wegens buitengewone toewijding of bijzonder loffelijke dienstverrichtingen
      worden beloond.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel25
  - number: '25.2'
    text: 'De beloningen zijn:'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel25
  - number: 25.2.a
    text: tevredenheidsbetuiging of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel25
  - number: 25.2.b
    text: een gratificatie van maximaal € 226,89.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel25
  - number: '26.1'
    text: |-
      De vrijwillige ambtenaar van politie die de hem opgelegde verplichtingen niet nakomt of zich overigens aan
      plichtsverzuim schuldig maakt, kan disciplinair worden gestraft.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel26
  - number: '26.2'
    text: |-
      Plichtsverzuim omvat zowel het overtreden van een voorschrift als het doen of nalaten van iets dat een goed
      ambtenaar in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel26
  - number: '27.1'
    text: 'De straffen die kunnen worden opgelegd, zijn:'
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel27
  - number: 27.1.a
    text: schriftelijke berisping;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel27
  - number: 27.1.b
    text: schorsing voor een bepaalde tijd of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel27
  - number: 27.1.c
    text: ontslag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel27
  - number: '27.2'
    text: De straffen, bedoeld in het eerste lid, worden opgelegd door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      Bij het opleggen van een straf kan worden bepaald dat deze niet ten uitvoer zal worden gelegd, indien de
      vrijwillige ambtenaar van politie zich gedurende de bij het opleggen van de straf te bepalen termijn niet
      schuldig maakt aan soortgelijk plichtsverzuim als waarvoor de bestraffing plaatsvindt, noch aan enig ander ernstig
      plichtsverzuim en zich houdt aan bij het opleggen van de straf eventueel te stellen bijzondere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      Indien met toepassing van het eerste lid de straf van ontslag wordt opgelegd, kan tegelijk met deze straf één van
      de in [artikel 27, eerste lid, onderdeel a][ref1], genoemde straffen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel27
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
  - number: '29.1'
    text: |-
      Indien de vrijwillige ambtenaar van politie gebruik maakt van de mogelijkheid zich te verantwoorden in het geval
      dat het bevoegd gezag voornemens is hem een straf op te leggen, geschiedt de verantwoording ten overstaan van het
      bevoegd gezag. Dit bepaalt of deze verantwoording mondeling of schriftelijk zal plaatsvinden. Bij schriftelijke
      verantwoording wordt de ambtenaar op zijn verzoek de gelegenheid gegeven tot nadere mondelinge toelichting.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel29
  - number: '29.2'
    text: |-
      Van de mondelinge verantwoording wordt direct een verslag opgemaakt, dat na voorlezing wordt getekend door degene
      tegenover wie de verantwoording heeft plaatsgevonden en door de ambtenaar. Indien de ambtenaar het verslag weigert
      te ondertekenen, wordt dit in het verslag, zo mogelijk met opgave van de redenen, vermeld. De ambtenaar ontvangt
      een afschrift van het verslag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel29
  - number: '29.3'
    text: |-
      Indien de ambtenaar dit verlangt, worden hem of zijn raadsman afschriften verstrekt van de ambtelijke rapporten of
      andere geschriften die op de hem ten laste gelegde feiten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel29
  - number: '30.1'
    text: |-
      De vrijwillige ambtenaar van politie kan niet worden gestraft wegens overtreding van
      [artikel 10, eerste lid, van de Ambtenarenwet 2017][ref1], dan nadat daarover advies is ingewonnen van de
      Adviescommissie grondrechten- en functieuitoefening politieambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel10
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '10'
  - number: '30.2'
    text: |-
      Het bevoegd gezag geeft bij zijn besluit tot strafoplegging te kennen of dit in overeenstemming is met het
      ingewonnen advies.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel30
  - number: '31'
    text: |-
      De ambtenaar dient van de ontvangst van een besluit inzake strafoplegging te doen blijken door onmiddellijke
      terugzending van een door hem ondertekend en gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel31
  - number: '32'
    text: |-
      De straf, behalve die van schriftelijke berisping, wordt niet ten uitvoer gelegd zolang zij niet onherroepelijk is
      geworden, tenzij bij het opleggen van de straf is bevolen dat deze onmiddellijk ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel32
  - number: '33'
    text: |-
      De vrijwillige ambtenaar van politie is van rechtswege in zijn ambt geschorst wanneer hem rechtmatig
      zijn vrijheid is ontnomen, tenzij de vrijheidsontneming het gevolg is van een maatregel, anders dan op
      grond van de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] of de
      [Wet verplichte geestelijke gezondheidszorg][ref2], genomen in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0040632
      - id: ref2
        bwb_id: BWBR0040635
  - number: '34.1'
    text: |-
      Onverminderd [artikel 27, eerste lid, onderdeel ][ref1], kan de vrijwillige ambtenaar van politie in zijn ambt
      worden geschorst:


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel27
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
  - number: 34.1.a
    text: indien een strafrechtelijke vervolging ter zake van een misdrijf tegen hem is ingesteld;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
  - number: 34.1.b
    text: |-
      wanneer hem door het bevoegd gezag het voornemen tot bestraffing met onvoorwaardelijk ontslag is meegedeeld dan wel
      wanneer hem die straf is opgelegd of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
  - number: 34.1.c
    text: wanneer naar het oordeel van het bevoegd gezag het belang van de dienst dit vereist.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      Schorsing geschiedt door het bevoegd gezag. In afwachting van de schorsing kan de vrijwillige ambtenaar van politie
      buiten functie worden gesteld door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
  - number: '34.3'
    text: |-
      De duur van de schorsing bedraagt maximaal zes maanden. In uitzonderlijke gevallen kan deze termijn met drie
      maanden worden verlengd.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel34
  - number: '35.1'
    text: Ontslag wordt gegeven door het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel35
  - number: '35.2'
    text: |-
      Bij ontslag niet op eigen aanvraag wordt de vrijwillige ambtenaar van politie behalve in het geval, bedoeld in
      [artikel 41][ref1], de reden van het ontslag schriftelijk medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel41
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '41'
        hoofdstuk: II
        paragraaf: '6'
  - number: '36.1'
    text: De vrijwillige ambtenaar van politie wordt op zijn eigen aanvraag ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '36.2'
    text: Het ontslag wordt niet verleend met ingang van een datum gelegen binnen een maand.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '36.3'
    text: |-
      Van het eerste lid kan worden afgeweken indien een strafrechtelijke vervolging terzake van een misdrijf tegen de
      ambtenaar is ingesteld of indien wordt overwogen de straf van ontslag op te leggen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '36.4'
    text: Van het tweede lid kan worden afgeweken op aanvraag van de vrijwillige ambtenaar van politie.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '36.5'
    text: |-
      Indien een ontslag op eigen aanvraag wordt verleend aan een vrijwillige ambtenaar in opleiding, gaat dit ontslag,
      in afwijking van het tweede lid, onmiddellijk in.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '36.6'
    text: Het ontslag op eigen aanvraag wordt eervol verleend.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel36
  - number: '37.1'
    text: |-
      Aan de vrijwillige ambtenaar in opleiding die tegen het einde van de basisopleiding of bij het einde van de
      proeftijd, bedoeld in [artikel 3, tweede lid][ref1], niet voldoet aan de eisen van bekwaamheid en geschiktheid
      wordt ontslag verleend met ingang van de dag, volgend op die waarop de proeftijd is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel3
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '37.2'
    text: |-
      Aan de vrijwillige ambtenaar in opleiding die gedurende de opleiding of de proeftijd niet de geschiktheid blijkt
      te bezitten die voor de dienst wordt vereist, kan met ingang van een dag gelegen binnen de proeftijd eervol ontslag
      worden verleend, mits een opzeggingstermijn in acht wordt genomen van een maand.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel37
  - number: '37.3'
    text: Het ontslag kan, al dan niet op eigen aanvraag, ingaan vóór de afloop van de opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel37
  - number: 38a.1
    text: |-
      Aan de vrijwillige ambtenaar, aangesteld voor de uitvoering van technische, administratieve
      of andere taken ten dienste van de politie, die tegen het einde van de proeftijd, bedoeld in
      [artikel 3a, eerste lid, onderdeel a][ref1], niet voldoet aan de eisen van bekwaamheid of geschiktheid, wordt
      eervol ontslag verleend met ingang van de dag, volgend op die waarop de proeftijd is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: 3a
        hoofdstuk: II
        paragraaf: '1'
  - number: 38a.2
    text: |-
      De vrijwillige ambtenaar, aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste
      van de politie, die is aangesteld voor onbepaalde tijd, kan ontslag worden verleend, mits een opzegtermijn in acht
      wordt genomen van:
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel38a
  - number: 38a.2.a
    text: |-
      drie maanden, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand ten minste twaalf maanden
      ononderbroken in dienst is geweest;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel38a
  - number: 38a.2.b
    text: |-
      twee maanden, indien de ambtenaar ten tijde van opzegging direct daaraan voorafgaand ten minste zes maanden doch
      korter dan twaalf maanden ononderbroken in dienst is geweest of
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel38a
  - number: 38a.2.c
    text: |-
      één maand, indien de ambtenaar ten tijde van de opzegging direct daaraan voorafgaand korter dan zes maanden
      ononderbroken in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel38a
  - number: '39'
    text: |-
      Aan de ambtenaar die in verband met de aanvaarding van een functie in een publiekrechtelijk college waarin hij is
      aangesteld of verkozen, tijdelijk is ontheven van de waarneming van zijn ambt, wordt, indien hij ophoudt zodanige
      functie te bekleden en hij naar het oordeel van het bevoegd gezag niet in actieve dienst kan worden hersteld,
      eervol ontslag verleend.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel39
  - number: '40.1'
    text: |-
      Anders dan op eigen aanvraag, bij wijze van straf of ingevolge [artikel 37][ref1] of [39][ref2] kan de vrijwillige
      ambtenaar van politie worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0007321#Artikel39
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '37'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0007321
        artikel: '39'
        hoofdstuk: II
        paragraaf: '6'
  - number: 40.1.a
    text: |-
      het verlies van een vereiste voor de aanstelling, gesteld bij een regeling aan de benoeming voorafgegaan, tenzij
      het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.b
    text: een onherroepelijk geworden rechterlijke uitspraak waarbij de ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.c
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.d
    text: een onherroepelijk geworden veroordeling tot een vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.e
    text: een blijvende ongeschiktheid uit hoofde van ziekte of gebreken voor de vervulling van zijn ambt;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.f
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: 40.1.g
    text: |-
      het bereiken van de leeftijd waarop op grond van de [Algemene Ouderdomswet][ref1] recht op ouderdomspensioen
      ontstaat of


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 40.1.h
    text: |-
      het bij of in verband met indiensttreding of keuring verstrekken van onjuiste of onvolledige inlichtingen, zonder
      welke handelwijze niet tot indiensttreding of goedkeuring zou zijn overgegaan, tenzij de vrijwillige ambtenaar van
      politie aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: '40.2'
    text: |-
      Een ontslag op grond van het eerste lid, onderdelen a, e en f wordt steeds eervol verleend. Het ontslag kan niet
      eerder ingaan dan de dag, volgende op die waarop de reden van het ontslag voor het eerst aanwezig was.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel40
  - number: '41'
    text: |-
      Een vrijwillige ambtenaar van politie kan ook op andere gronden, dan die welke in [artikel 40][ref1] zijn geregeld
      of waarnaar in dat artikel wordt verwezen, worden ontslagen. Het ontslag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Artikel40
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007321
        artikel: '40'
        hoofdstuk: II
        paragraaf: '6'
  - number: '42'
    text: |-
      [Artikel 3 van het Besluit overleg en medezeggenschap politie 1994][ref1] is van overeenkomstige toepassing op
      vrijwillige ambtenaren van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel3
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '3'
  - number: '43'
    text: |-
      Gedurende de tijd dat de vrijwillige ambtenaar in opleiding de opleiding tot vrijwillige ambtenaar van politie
      volgt, of de vrijwillige ambtenaar, aangesteld voor de uitoefening van de politietaak, in opdracht van het bevoegd
      gezag een voor zijn functie relevante cursus volgt dan wel deelneemt aan een oefening of in opdracht van het
      bevoegd gezag werkelijke dienst verricht, ontvangt hij een uurvergoeding overeenkomstig de door Onze Minister vast
      te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel43
  - number: '44.1'
    text: |-
      De [hoofdstukken II][ref1] en [III van het Besluit reis-, verblijf- en verhuiskosten politie][ref2] zijn van
      overeenkomstige toepassing op vrijwillige ambtenaren van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0024064#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0024064
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0024064
        hoofdstuk: III
  - number: '44.2'
    text: |-
      Het bevoegd gezag kan besluiten om in individuele gevallen af te wijken van de [hoofdstukken II][ref1] en
      [III van het Besluit reis-, verblijf- en verhuiskosten politie][ref2], indien de afwijking strekt tot het vermijden
      van onbillijkheden van overwegende aard welke uit de toepassing van die regels zouden voortkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0024064#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0024064
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0024064
        hoofdstuk: III
  - number: '45'
    text: |-
      Een vrijwillige ambtenaar, aangesteld voor de uitvoering van de politietaak, die op grond van [afdeling 1,
      hoofstuk 2, artikel 1, van de Invoeringswet Politiewet 1993](onbekend) naar een politieregio dan wel het Korps
      landelijke politiediensten is overgegaan en die op de dag voorafgaande aan de datum van inwerkingtreding van
      de [Politiewet 1993][ref1] aanspraken had op grond van de Rechtstoestandsregeling reservepolitie behoudt deze
      aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '46'
    text: |-
      De [Algemene termijnenwet][ref1] is niet van toepassing op de in dit besluit genoemde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '47'
    text: |-
      Besluiten, genomen in de periode van 1 april 1994 tot en met de dag voorafgaande aan de inwerkingtreding van dit
      besluit op grond van het Beloningsreglement reservepolitie 1968, of de daarop berustende bepalingen, als zouden dit
      reglement en die bepalingen in genoemde periode nog hebben gegolden, zijn rechtsgeldig genomen.
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel47
  - number: '48'
    text: |-
      Degene die in de periode van 1 april 1994 tot en met de dag voorafgaand aan de inwerkingtreding van dit besluit
      ingevolge een opdracht van het bevoegd gezag werkzaamheden als vrijwillige ambtenaar van politie heeft verricht
      en in verband met die werkzaamheden aanspraak zou hebben gehad op een uitkering of voorziening als bedoeld in
      [artikel 47, derde lid, van de Wet rechtspositionele voorzieningen rampbestrijders][ref1] in het geval deze wet
      voor hem zou hebben gegolden, heeft, indien hij binnen een jaar na de inwerkingtreding van dit besluit een verzoek
      om toekenning van een zodanige uitkering of voorziening heeft ingediend, aanspraak op een met bedoelde uitkering of
      voorziening overeenkomende uitkering of voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0005643#Artikel47
    url: https://wetten.overheid.nl/BWBR0007321/2020-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005643
        artikel: '47'
  - number: '49'
    text: |-
      Het koninklijk besluit van de Ministers van Justitie en van Binnenlandse Zaken van 25 november 1964,
      houdende wijziging van het koninklijk besluit van 24 december 1957, *Stb.* 559 en vaststelling van de
      Rechtstoestandsregeling reservepolitie (*Stb.* 473) wordt ingetrokken.
