---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_aanvraagprocedure_nummers
regulatory_layer: AMVB
publication_date: '2013-03-21'
valid_from: '1999-04-01'
bwb_id: BWBR0008157
url: https://wetten.overheid.nl/BWBR0008157/1999-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 15 maart 1996, nr. HDTP/96/774/JWD Hoofddirectie
    Telecommunicatie en Post;

    Gelet op de artikelen 40d, derde lid, en 41, eerste lid, onder j, van de Wet op de telecommunicatievoorzieningen en
    de artikelen 2, derde lid, en 24, onder b, van de Vergunningen-wet kabelgebonden telecommunicatie-infrastructuur;

    De Raad van State gehoord (advies van 18 juni 1996, no. W09.96.0139);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat a.i. van 1 juli 1996 nr. HDTP/96/1692/PvL,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel1
  - number: 1.a
    text: 'wet: de Wet op de telecommunicatievoorzieningen;'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel1
  - number: 1.b
    text: 'nummerhouder: degene aan wie nummers zijn toegekend;'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel1
  - number: 1.c
    text: 'reserveringhouder: degene voor wie nummers zijn gereserveerd;'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel1
  - number: 1.d
    text: |-
      college: het college genoemd in artikel 2, eerste lid, van de Wet Onafhankelijke post- en
      telecommunicatieautoriteit.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel1
  - number: '3'
    text: |-
      Een aanvraag tot toekenning van nummers kan uitsluitend worden gedaan voor een bestemming die is aangegeven in enig
      nummerplan, vastgesteld op grond van artikel 40*d*, eerste lid, van de wet of voor een bestemming die is aangegeven
      in een ministeriële regeling, vastgesteld op grond van artikel 40*e* van de wet.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel3
  - number: '4.1'
    text: 'Een aanvraag tot toekenning van nummers wordt geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.1.a
    text: |-
      de aanvrager niet behoort tot degenen, bedoeld in [artikel 3, derde lid][ref1], 7, vijfde lid,
      13*w*, eerste lid, 17, elfde lid, 22, derde lid, of artikel 23, zesde lid, van de wet of in
      [artikel 2, vierde lid, van de Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref2], en geen
      aanleiding bestaat om toepassing te geven aan artikel 40*f* van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0008157#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007973#Artikel2
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008157
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007973
        artikel: '2'
  - number: 4.1.b
    text: |-
      naar verwachting door de aanvrager niet zal of kan worden voldaan aan het bij of krachtens de wet of dit besluit
      met betrekking tot nummers bepaalde.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: '4.2'
    text: 'Een aanvraag tot toekenning van nummers kan geheel of gedeeltelijk worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.a
    text: |-
      op grond van de aanvraag redelijkerwijs niet is te verwachten dat het voorgenomen gebruik binnen een jaar kan
      worden verwezenlijkt;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.b
    text: |-
      het in de aanvraag omschreven voorgenomen gebruik de toekenning van de gevraagde hoeveelheid nummers niet
      rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.c
    text: de aanvrager geen vestiging in Nederland heeft en zijn boekhouding niet in Nederland wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.d
    text: op een aanmerkelijk deel van het vermogen van de aanvrager beslag is gelegd;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.e
    text: |-
      een verzoek tot verlening van surséance van betaling aan de aanvrager is ingediend, of surséance van betaling aan
      de aanvrager is verleend;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.f
    text: een verzoek tot faillietverklaring van de aanvrager is ingediend;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: 4.2.g
    text: de aanvrager failliet is verklaard.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel4
  - number: '5.1'
    text: |-
      Met betrekking tot een aanvraag tot reservering van nummers zijn de [artikelen 3][ref1] en
      [4, eerste lid, en tweede lid, onder c tot en met g][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008157#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008157#Artikel4
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008157
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008157
        artikel: '4'
  - number: '5.2'
    text: 'Een aanvraag tot reservering van nummers kan bovendien geheel of gedeeltelijk worden geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel5
  - number: 5.2.a
    text: |-
      op grond van de aanvraag redelijkerwijs niet is te verwachten dat het voorgenomen gebruik binnen drie jaar kan
      worden verwezenlijkt;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel5
  - number: 5.2.b
    text: |-
      het in de aanvraag omschreven voorgenomen gebruik de reservering van de gevraagde hoeveelheid nummers niet
      rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel5
  - number: '5.3'
    text: |-
      De reservering van nummers geldt voor een periode van drie jaar. De gereserveerde nummers zijn, onverminderd het
      bepaalde in [artikel 10][ref1], tijdens de reserveringsduur uitsluitend beschikbaar voor een toekenning aan de
      desbetreffende reserveringhouder en wel voor het gebruiksdoel waarvoor de reservering is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008157#Artikel10
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008157
        artikel: '10'
  - number: '6.1'
    text: |-
      Aan een besluit tot toekenning of reservering van nummers kunnen voor wat betreft het verstrekken van informatie de
      volgende voorschriften worden verbonden:
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel6
  - number: 6.1.a
    text: |-
      het voorschrift om op verzoek van het college die informatie aan het college te verstrekken die het college nodig
      heeft ten behoeve van de aan het college in artikel 40*d*, lid 2, van de wet opgedragen zorg voor het nummerbeheer
      of ten behoeve van het toezicht op de naleving van dit besluit en de bij de toekenning of reservering gestelde
      voorschriften en beperkingen;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel6
  - number: 6.1.b
    text: |-
      het voorschrift om periodiek aan het college de in het voorschrift aangegeven schriftelijke informatie te
      verstrekken over het gebruik van toegekende nummers of over de activiteit waarvoor de nummers zijn toegekend of
      gereserveerd.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel6
  - number: 6a
    text: |-
      Een nummerhouder en een reserveringhouder zijn verplicht om aan Onze Minister die informatie te verstrekken die
      hij nodig heeft ten behoeve van de aan hem in artikel 40*d*, eerste lid, van de wet opgedragen zorg voor het
      nummerbeleid.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel6a
  - number: '7.1'
    text: |-
      Indien een nummerhouder de aan hem toegekende nummers in gebruik geeft aan dienstaanbieders of gebruikers, dient
      dit op niet-discriminatoire en transparante wijze te geschieden met gebruikmaking van objectieve criteria.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel7
  - number: '7.2'
    text: |-
      De nummerhouder is er verantwoordelijk voor dat het gebruik van de aan hem toegekende nummers in overeenstemming
      is met het bij of krachtens de wet en de [Vergunningenwet kabelgebonden telecommunicatie-infrastructuur][ref1]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007973
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007973
  - number: '8.1'
    text: |-
      Een besluit tot toekenning of reservering van nummers kan op aanvraag van de betreffende nummerhouder of
      reserveringhouder worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
  - number: '8.2'
    text: |-
      Een aanvraag van een reserveringhouder tot wijziging van het tot hem gerichte besluit tot reservering, inhoudende
      een verzoek tot toekenning van nummers daaruit, wordt ingewilligd, tenzij:
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
  - number: 8.2.a
    text: de reservering geen betrekking heeft op het voorgenomen gebruik, of
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
  - number: 8.2.b
    text: |-
      naar het oordeel van het college niet aannemelijk is dat de ontwikkeling van de activiteit die ten grondslag ligt
      aan de reservering, de gevraagde toekenning noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
  - number: '8.3'
    text: |-
      Een aanvraag tot wijziging, inhoudende gedeeltelijke intrekking van de toegekende of gereserveerde nummers, wordt
      ingewilligd.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
  - number: '8.4'
    text: |-
      Met betrekking tot andere aanvragen om een wijziging zijn de [artikelen 3][ref1] en [4][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008157#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008157#Artikel4
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008157
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008157
        artikel: '4'
  - number: '9.1'
    text: |-
      Een besluit tot toekenning of reservering van nummers wordt behoudens het bepaalde in het tweede lid op aanvraag
      van de desbetreffende nummerhouder of reserveringhouder ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel9
  - number: '9.2'
    text: |-
      Een aanvraag van een reserveringhouder tot intrekking van het tot hem gerichte besluit tot reservering, inhoudende
      een verzoek tot toekenning van de voor hem gereserveerde nummers, wordt ingewilligd, tenzij:
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel9
  - number: 9.2.a
    text: de reservering geen betrekking heeft op het voorgenomen gebruik, of
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel9
  - number: 9.2.b
    text: |-
      naar het oordeel van het college niet aannemelijk is dat de ontwikkeling van de activiteit die ten grondslag ligt
      aan de reservering, de gevraagde toekenning noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel9
  - number: '10.1'
    text: 'Een besluit tot toekenning of reservering van nummers wordt ambtshalve gewijzigd indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.1.a
    text: een wijziging van het desbetreffende nummerplan dit vereist;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.1.b
    text: het ongewijzigd instandhouden van de reservering de toekenning van nummers ernstig belemmert;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.1.c
    text: het doelmatig gebruik van nummers in het algemeen maatschappelijk en economisch belang dit vordert;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.1.d
    text: zulks noodzakelijk is om feitelijke onjuistheden van eenvoudige aard weg te nemen.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: '10.2'
    text: 'Een besluit tot toekenning of reservering van nummers wordt ambtshalve ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.2.a
    text: een wijziging van het desbetreffende nummerplan dit vereist;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.2.b
    text: de gronden waarop de toekenning of reservering is verleend zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.2.c
    text: het instandhouden van de reservering de toekenning van nummers ernstig belemmert;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.2.d
    text: de nummerhouder of reserveringhouder zijn onderneming staakt;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.2.e
    text: |-
      Onze Minister van oordeel is dat de vrees gewettigd is dat het van kracht blijven van de toekenning of reservering
      ernstig gevaar zal opleveren voor de veiligheid van de Staat of de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: '10.3'
    text: 'Een besluit tot toekenning of reservering van nummers kan ambtshalve worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.3.a
    text: |-
      de nummerhouder of reserveringhouder de bij of krachtens de wet gestelde regels dan wel de aan het betreffende
      besluit verbonden voorschriften of beperkingen niet nakomt;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.3.b
    text: op een aanmerkelijk deel van het vermogen van de nummerhouder of reserveringhouder beslag is gelegd;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.3.c
    text: |-
      een verzoek tot verlening van surséance van betaling aan de nummerhouder of reserveringhouder is ingediend, of
      surséance van betaling aan de nummerhouder of reserveringhouder is verleend;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.3.d
    text: een verzoek is ingediend tot faillietverklaring van de nummerhouder of reserveringhouder;
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: 10.3.e
    text: de nummerhouder of reserveringhouder failliet is verklaard.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel10
  - number: '11'
    text: |-
      Gedurende vier en twintig weken na het tijdstip van de inwerkingtreding van dit besluit kunnen de in die periode
      ontvangen aanvragen tot reservering door Onze Minister worden aangehouden. Binnen vier weken na verloop van de in
      de vorige volzin genoemde termijn worden de aanvragen in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel11
  - number: '12'
    text: Dit besluit treedt in werking met ingang van 1 augustus 1996.
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit aanvraagprocedure nummers.'
    url: https://wetten.overheid.nl/BWBR0008157/1999-04-01#Artikel13
