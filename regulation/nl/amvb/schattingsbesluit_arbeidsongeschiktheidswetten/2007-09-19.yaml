    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid J. F. Hoogervorst van 28 april 2000,
    nr. SV/WV/00/26762;

    Gelet op de artikelen 18, achtste en tiende lid, van de Wet op de arbeidsongeschiktheidsverzekering, 2, zevende en
    negende lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen, en 2, achtste en tiende lid, van de Wet
