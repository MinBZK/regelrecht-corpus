      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 1.c
    text: |-
      Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008657
  - number: 1.d
    text: |-
      Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 1.e
    text: |-
      verzekerde: de verzekerde, bedoeld in [artikel 3 van de Waz][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
  - number: 1.f
    text: |-
      jonggehandicapte: de jonggehandicapte, bedoeld in [artikel 5 van de Wajong][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: '2.1'
    text: |-
      De arbeidsongeschiktheidsbeoordeling, bedoeld in de [WAO][ref1], de [Waz][ref2] en de [Wajong][ref3] en de
      beoordeling van volledige en duurzame arbeidsongeschiktheid of de mate van gedeeltelijke arbeidsgeschiktheid,
      bedoeld in de [Wet WIA][ref4], worden gebaseerd op een verzekeringsgeneeskundig onderzoek en een arbeidsdeskundig
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0019057
  - number: '2.2'
    text: 'Van het arbeidsdeskundig onderzoek kan worden afgezien:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.2.a
    text: |-
      gedurende de periode waarin uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare
      mogelijkheden heeft;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.2.b
    text: |-
      indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft
      maar dat hij die mogelijkheden naar verwachting binnen drie maanden zal verliezen, en dit verlies in een
      verzekeringsgeneeskundig onderzoek wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.2.c
    text: |-
      indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft maar dat
      hij wegens zijn terminale ziekte een zodanig slechte levensverwachting heeft dat hij die mogelijkheden naar
      verwachting binnen afzienbare termijn zal verliezen, en dit verlies in een verzekeringsgeneeskundig onderzoek wordt
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.2.d
    text: |-
      indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene zodanig wisselend belastbaar is voor arbeid dat
      betrokkene geen benutbare mogelijkheden heeft.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '2.3'
    text: |-
      Indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare mogelijkheden heeft maar
      betrokkene die mogelijkheden naar verwachting na verloop van een periode wel zal hebben, vindt na verloop van die
      periode opnieuw een verzekeringsgeneeskundig onderzoek plaats.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '2.4'
    text: |-
      Het wisselend belastbaar zijn voor arbeid, bedoeld in het tweede lid, onderdeel d, wordt ten minste drie maal in
      een verzekeringsgeneeskundig onderzoek vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '2.5'
    text: 'Benutbare mogelijkheden als bedoeld in het tweede tot en met het vierde lid zijn alleen dan niet aanwezig indien:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.5.a
    text: |-
      betrokkene is opgenomen in een ziekenhuis of in een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref1] die zorg verleent waarop
      aanspraak bestaat ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref2], met uitzondering van een inrichting
      waar geestelijk gestoorde delinquenten van overheidswege verpleegd worden;


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
  - number: 2.5.b
    text: betrokkene bedlegerig is;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.5.c
    text: |-
      betrokkene voor het uitvoeren van activiteiten van het dagelijks leven dermate afhankelijk is dat hij lichamelijk
      niet zelfredzaam is; of
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: 2.5.d
    text: |-
      betrokkene als gevolg van een ernstige psychische stoornis in zijn zelfverzorging, in zijn directe
      samenlevingsverband alsook in zijn sociale contacten, waaronder zijn werkrelaties, niet of dermate minimaal
      functioneert dat hij psychisch niet zelfredzaam is.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '2.6'
    text: |-
      Van het arbeidsdeskundig onderzoek kan worden afgezien indien de verzekeringsarts vaststelt dat betrokkene niet
      ongeschikt is tot het verrichten van zijn laatstelijk uitgeoefende arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '2.7'
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel2
  - number: '3.1'
    text: |-
      Het verzekeringsgeneeskundig onderzoek strekt ertoe vast te stellen of betrokkene ten gevolge van ziekte, gebrek,
      zwangerschap of bevalling ongeschikt is tot werken.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel3
  - number: '3.2'
    text: |-
      Daarbij onderzoekt de verzekeringsarts of bij betrokkene sprake is van vermindering of verlies van lichamelijke of
      psychische structuur of functie, die vermindering of verlies van normale gedragingen en activiteiten en van normale
      sociale rolvervulling tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel3
  - number: '3.3'
    text: |-
      Tevens stelt de verzekeringsarts vast welke beperkingen betrokkene in zijn functioneren in arbeid ondervindt ten
      gevolge van het verlies of vermindering van vermogens, bedoeld in het tweede lid, alsmede in welke mate betrokkene
      belastbaar is voor arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel3
  - number: '4.1'
    text: 'Het verzekeringsgeneeskundig onderzoek voldoet aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel4
  - number: 4.1.a
    text: |-
      de gebruikte onderzoeksmethoden, argumentatie, bevindingen en conclusies van het verzekeringsgeneeskundig onderzoek
      worden schriftelijk vastgelegd;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel4
  - number: 4.1.b
    text: |-
      een door een andere verzekeringsarts uitgevoerd verzekeringsgeneeskundig onderzoek zal tot dezelfde bevindingen en
      conclusies kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel4
  - number: 4.1.c
    text: de redeneringen en conclusies van het verzekeringsgeneeskundig onderzoek zijn vrij van innerlijke tegenspraak.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel4
  - number: '4.2'
    text: |-
      De vaststellingen en het onderzoek, bedoeld in [artikel 3][ref1], geschieden aan de hand van algemeen aanvaarde
      verzekeringsgeneeskundige onderzoeksmethoden die gericht zijn op het kunnen vaststellen van ongeschiktheid tot
      werken als gevolg van ziekte, gebrek, zwangerschap of bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: 'Het arbeidsdeskundig onderzoek strekt tot vaststelling van:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel5
  - number: 5.a
    text: |-
      de mate van arbeidsongeschiktheid, bedoeld in [artikel 18 van de WAO][ref1], zoals dit artikel luidt sinds
      1 augustus 1993, [artikel 2 van de Waz][ref2] en [artikel 2 van de Wajong][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002551
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '2'
  - number: 5.b
    text: |-
      volledige arbeidsongeschiktheid als bedoeld in [artikel 4 van de Wet WIA][ref1]; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
  - number: 5.c
    text: |-
      de mate van gedeeltelijke arbeidsgeschiktheid, bedoeld in [artikel 5 van de Wet WIA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
  - number: '6.1'
    text: |-
      Het maatmaninkomen WAO is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 18, eerste lid, van de WAO][ref1], met arbeid gewoonlijk verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: '6.2'
    text: |-
      Het maatmaninkomen Waz is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 2, eerste lid, van de Waz][ref1], met arbeid als verzekerde gewoonlijk verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
  - number: '6.3'
    text: 'Het maatmaninkomen Wajong is voor de jonggehandicapte die:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
  - number: 6.3.a
    text: |-
      geen inkomsten uit arbeid geniet, 108% van het bedrag dat voor een werknemer van dezelfde leeftijd geldt als
      minimumloon per uur op grond van de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 6.3.b
    text: |-
      inkomsten uit arbeid geniet, het inkomen dat een niet-jonggehandicapt persoon van dezelfde leeftijd met de door de
      jonggehandicapte feitelijk verrichte arbeid gedurende de normale, volledige werkweek, per uur zou verdienen.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
  - number: '6.4'
    text: |-
      Het maatmaninkomen van de jonggehandicapte, bedoeld in het derde lid, wordt hoger gesteld, en ten minste op een
      bedrag gelijk aan anderhalf maal het bedrag dat voor de belanghebbende geldt als minimumloon per uur op grond van
      de [Wet minimumloon en minimumvakantiebijslag][ref1], indien de jonggehandicapte:


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 6.4.a
    text: |-
      arbeidsongeschikt is geworden binnen een jaar onmiddellijk voorafgaande aan het behalen van een diploma, dan
      wel na het behalen van een diploma, aan een beroepsgerichte opleiding die opleidt voor een beroep waarvan het
      aanvangssalaris ten minste gelijk is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd
      geldt als minimumloon op grond van de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 6.4.b
    text: |-
      tijdens de arbeidsongeschiktheid doch uiterlijk op de dag dat hij de leeftijd van 30 jaar bereikt, een diploma
      behaalt van een beroepsgerichte opleiding die opleidt voor een beroep waarvan het aanvangssalaris ten minste gelijk
      is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd geldt als minimumloon op grond van de
      [Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '6.5'
    text: |-
      Indien de vaststelling van het maatmaninkomen met toepassing van het vierde lid tot een hoger maatmaninkomen leidt
      dan de vaststelling van het maatmaninkomen met toepassing van het derde lid, wordt uitgegaan van het eerstgenoemde
      maatmaninkomen.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
  - number: '6.6'
    text: |-
      In de gevallen waarin [artikel 43a van de WAO][ref1], [artikel 19 van de Wajong][ref2],
      [artikel 48, eerste lid, aanhef en onderdelen b en c][ref3], [50, eerste lid, aanhef en onderdeel b][ref4], of
      [55, eerste lid, aanhef en onderdelen b en c, van de Wet WIA][ref5] toepassing vindt, alsmede in de gevallen waarin
      dat niet het geval is omdat [artikel 29b van de Ziektewet][ref6] toepassing kan vinden, wordt het maatmaninkomen
      niet lager vastgesteld dan het maatmaninkomen dat voor de vaststelling van de mate van arbeidsongeschiktheid
      of mate van gedeeltelijke arbeidsgeschiktheid in aanmerking zou worden genomen indien de uitkering niet zou
      zijn ingetrokken, dan wel indien aan het einde van de wachttijd, bedoeld in [artikel 19 van de WAO][ref7],
      [artikel 6 van de Wajong][ref8] of [artikel 23 van de Wet WIA][ref9], recht zou hebben bestaan op een dergelijke
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref7]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref8]: https://wetten.overheid.nl/BWBR0008657#Artikel6
      [ref9]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '48'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '50'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref7
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref8
        bwb_id: BWBR0008657
        artikel: '6'
      - id: ref9
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '6.7'
    text: |-
      In de gevallen waarin, na eerdere intrekking van een uitkering op grond van de [WAO][ref1], de [Wajong][ref2] of
      de [Wet WIA][ref3], dan wel na het eerder niet toekennen van een uitkering aan het einde van de wachttijd, bedoeld
      in [artikel 19 van de WAO][ref4], [artikel 6 van de Wajong][ref5] of [artikel 23 van de Wet WIA][ref6], bij de
      vaststelling van het maatmaninkomen wordt uitgegaan van arbeid op basis waarvan voor de betrokkene reeds eerder een
      maatmaninkomen is vastgesteld, wordt het maatmaninkomen vastgesteld op het maatmaninkomen dat voor de vaststelling
      van de mate van arbeidsongeschiktheid of mate van gedeeltelijke arbeidsgeschiktheid in aanmerking zou worden
      genomen indien de uitkering niet zou zijn ingetrokken, dan wel indien aan het einde van de genoemde wachttijd recht
      zou hebben bestaan op een dergelijke uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0008657
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '23'
  - number: 6a
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld in verband met de vaststelling van het maatmaninkomen
      ten behoeve van de vaststelling, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      Nadat een eerste beoordeling in verband met de vaststelling, bedoeld in [artikel 5][ref1], heeft plaatsgevonden,
      wordt bij een hernieuwde vaststelling, een heropening, een herleving of een herziening van de uitkering geen
      rekening gehouden met na die eerste beoordeling opgetreden wijzigingen in het maatmaninkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.1'
    text: |-
      In afwijking van [artikel 7][ref1] wordt bij de vaststelling van de mate van arbeidsongeschiktheid het
      maatmaninkomen aangepast aan de eerst-gepubliceerde cijfers van de index van de CAO-lonen per uur inclusief
      bijzondere beloningen, zoals dit door het Centraal Bureau voor de Statistiek wordt gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel7
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      In gevallen waarin het maatmaninkomen voor het laatst is vastgesteld voor 1 januari 2001 vindt bij de
      eerstvolgende vaststelling van de mate van arbeidsongeschiktheid na deze datum naast de aanpassing,
      bedoeld in het eerste lid, eenmalig een extra verhoging van het maatmaninkomen plaats overeenkomstig
      [artikel 3 van de Wet brutering overhevelingstoeslag lonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '3'
  - number: '9'
    text: 'Bij bepaling van hetgeen betrokkene nog met arbeid kan verdienen worden de volgende regels in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.a
    text: |-
      in aanmerking wordt genomen die algemeen geaccepteerde arbeid waarmee betrokkene per uur het meest kan verdienen,
      waaronder mede wordt begrepen arbeid waarvoor bekwaamheden nodig zijn die algemeen gebruikelijk zijn en binnen
      zes maanden kunnen worden verworven, tenzij betrokkene niet over dergelijke bekwaamheden beschikt en als
      rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebrek dergelijke bekwaamheden niet kan
      verwerven. Onder deze bekwaamheden worden ten minste verstaan mondelinge beheersing van de Nederlandse taal
      en eenvoudig computergebruik. Deze arbeid wordt nader omschreven in de vorm van ten minste drie verschillende
      in Nederland uitgeoefende functies. Deze functies vertegenwoordigen ieder ten minste drie arbeidsplaatsen. De
      gegevens met betrekking tot de in aanmerking genomen functies, met alle daaraan verbonden specifieke aspecten
      inzake belasting, beloning en opleidingseisen mogen op het moment van de datum waarop de ter gelegenheid van de
      arbeidsongeschiktheidsbeoordeling gegeven beschikking betrekking heeft, niet ouder zijn dan 24 maanden;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.b
    text: |-
      bij het bepalen van de urenomvang van de onder a bedoelde functies mogen ook functies in aanmerking worden genomen
      met een omvang groter dan de urenomvang van de door de in [artikel 6][ref1] bedoelde gezonde persoon uitgeoefende
      arbeid, tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval de urenomvang van de onder a
      bedoelde functies niet meer bedraagt dan dat aantal uren;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 9.c
    text: |-
      arbeid, die door betrokkene alleen kan worden verricht na toepassing van zodanige voorzieningen, dat het accepteren
      van die toepassing in redelijkheid niet van een werkgever kan worden verlangd, blijft bij de toepassing van
      onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.d
    text: |-
      arbeid, die niet door betrokkene kan worden verricht omdat voor het verrichten van die arbeid een in de wet of
      collectieve arbeidsovereenkomst neergelegde functionele leeftijdsgrens geldt, die door betrokkene is overschreden
      of nog niet is bereikt, blijft bij de toepassing van onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.e
    text: |-
      indien betrokkene zodanige kenmerken heeft, dat van een werkgever in redelijkheid niet kan worden verlangd hem in
      bepaalde arbeid te werk te stellen, blijft die arbeid bij de toepassing van onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.f
    text: |-
      bij de toepassing van onderdeel a blijft arbeid die meer dan incidenteel tussen 0.00 uur en 6.00 uur wordt verricht
      buiten beschouwing, tenzij de gezonde persoon, bedoeld in [artikel 6][ref1], in dergelijke arbeid werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 9.g
    text: |-
      Indien betrokkene de leeftijd van 23 jaar nog niet heeft bereikt wordt onderdeel a toegepast alsof hij die leeftijd
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: 9.h
    text: |-
      in afwijking van de onderdelen b en f wordt uitgegaan van de arbeid die feitelijk wordt verricht, mits dit
      leidt tot een lagere mate van arbeidsongeschiktheid dan de met toepassing van onderdeel a en [artikel 10][ref1]
      vastgestelde mate van arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel10
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 9.i
    text: |-
      voor de toepassing van onderdeel h wordt onder arbeid die feitelijk wordt verricht mede verstaan arbeid die na
      het intreden van de arbeidsongeschiktheid feitelijk is verricht en waartoe de betrokkene met zijn krachten en
      bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel9
  - number: '10.1'
    text: 'Bij de berekening van hetgeen betrokkene met arbeid kan verdienen, wordt:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
  - number: 10.1.a
    text: |-
      uitgegaan van de urenomvang van de door de in [artikel 6][ref1] bedoelde gezonde persoon uitgeoefende arbeid,
      tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval van dit aantal wordt uitgegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10.1.b
    text: |-
      in aanmerking genomen het loon van de middelste van de in [artikel 9, onderdeel a][ref1], bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Indien betrokkene de leeftijd van 23 jaar nog niet heeft bereikt wordt het inkomen
      per uur dat hij na toepassing van het eerste lid met arbeid kan verdienen verlaagd
      door het te vermenigvuldigen met het minimumjeugdloonpercentage, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________ (Stb. 300), tenzij wordt uitgegaan van feitelijke inkomsten uit arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0003599#Artikel2
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003599
        artikel: '2'
  - number: '10.3'
    text: |-
      Indien het inkomen per uur dat betrokkene na toepassing van het eerste en tweede lid met arbeid kan verdienen, meer
      bedraagt dan zijn maatmaninkomen per uur, wordt hetgeen hij met arbeid kan verdienen niet hoger gesteld dan zijn
      maatmaninkomen per uur.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
  - number: '10.4'
    text: 'Het derde lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
  - number: 10.4.a
    text: indien wordt uitgegaan van de feitelijke inkomsten uit arbeid; of
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
  - number: 10.4.b
    text: |-
      indien betrokkene nog tot arbeid in dezelfde omvang in staat is als de in [artikel 6][ref1] bedoelde gezonde
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      Voor de toepassing van de [Wet WIA][ref1] wordt onder de gezonde persoon, bedoeld in het eerste
      lid, onderdeel a, en het vierde lid, onderdeel b, verstaan: de gezonde persoon, bedoeld in
      [artikel 1, onder maatmaninkomen, van de Wet WIA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
  - number: '11'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de [artikelen 9][ref1] en [10][ref2] nadere regels worden
      gesteld. Daarbij kan worden bepaald wat mede wordt verstaan onder bekwaamheden die algemeen gebruikelijk zijn en
      binnen zes maanden kunnen worden verworven als bedoeld in [artikel 9, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12'
    text: |-
      Indien de mate van arbeidsongeschiktheid voor de eerste maal is vastgesteld op een datum gelegen vóór 10 augustus
      1994 wordt, bij een hernieuwde vaststelling of een herziening van de uitkering na laatstgenoemde datum, geen
      rekening gehouden met de sedert de laatste vaststelling of herziening van de mate van arbeidsongeschiktheid
      opgetreden wijzingen in het maatmaninkomen. Voor personen, bedoeld in de [artikelen XX][ref1], [XXI][ref2],
      [XXIV][ref3] en [XXV van de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref4],
      zoals deze artikelen luidden voor de inwerkingtreding van de eerste fase van de
      [Wet overheidspersoneel onder de werknemersverzekeringen][ref5], wordt de in de eerste zin bedoelde datum gesteld
      op 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelXX
      [ref2]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXI
      [ref3]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXIV
      [ref4]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXV
      [ref5]: https://wetten.overheid.nl/BWBR0009267
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006072
        artikel: XX
      - id: ref2
        bwb_id: BWBR0006072
        artikel: XXI
      - id: ref3
        bwb_id: BWBR0006072
        artikel: XXIV
      - id: ref4
        bwb_id: BWBR0006072
        artikel: XXV
      - id: ref5
        bwb_id: BWBR0009267
  - number: 12a.1
    text: |-
      De [artikelen 2][ref1], [6][ref2], [9][ref3], [10][ref4] en [11][ref5], zoals die luidden op de dag
      voor inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit
      arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de introductie van een
      maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434), blijven van toepassing op een recht op uitkering
      met een ingangsdatum voor of op die dag indien betrokkene voor of op 1 juli 1959 is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel11
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12a.2
    text: |-
      In afwijking van het eerste lid is [artikel 9, onderdeel a, laatste zin][ref1], van toepassing op een recht op
      uitkering als bedoeld in het eerste lid van de betrokkene die voor of op 1 juli 1959 is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12a.3
    text: |-
      Onverminderd het eerste lid alsmede [artikel 13, tweede lid][ref1], zijn op personen, wier mate van
      arbeidsongeschiktheid voor de eerste maal is vastgesteld op een datum gelegen vóór inwerkingtreding van het
      besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit arbeidsongeschiktheidswetten met betrekking
      tot de te duiden functies alsmede in verband met de introductie van een maatmaninkomensgarantie en enkele andere
      onderwerpen (Stb. 434), de [artikelen 2][ref2], [6][ref3], [8][ref4], [9][ref5],[10][ref6] en [11][ref7],
      zoals deze luiden na inwerkingtreding van dat besluit, eerst van toepassing indien een beoordeling van de mate
      van arbeidsongeschiktheid plaatsvindt ter zake waarvan een beschikking wordt afgegeven, bij gelegenheid van die
      beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0011478#Artikel11
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0011478
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12a.4
    text: |-
      In afwijking van het derde lid is [artikel 6, zesde lid][ref1], niet van toepassing in de gevallen waarin
      [artikel 43a van de WAO][ref2], [artikel 20 van de WAZ][ref3] of [artikel 19 van de Wajong][ref4] toepassing
      heeft gevonden voor de datum van inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het
      Schattingsbesluit arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de
      introductie van een maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434).


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel19
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '19'
  - number: '13.1'
    text: Het Schattingsbesluit WAO, WAZ en Wajong wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid blijft artikel 10 van het Schattingsbesluit WAO, WAZ, Wajong, zoals dat luidde
      op de dag voor de inwerkingtreding van deze wet, van toepassing op personen op wie dit artikel op die dag van
      toepassing was.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Schattingsbesluit arbeidsongeschiktheidswetten.'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel15
