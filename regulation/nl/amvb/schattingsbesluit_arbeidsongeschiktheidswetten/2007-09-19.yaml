    De Raad van State gehoord (advies van 6 juni 2000, No.W12.00.0178/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 7
    juli 2000, nr. SV/WV/00/45397;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011478/2007-09-19#Artikel1
  - number: 1.a
    text: |-
      WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
