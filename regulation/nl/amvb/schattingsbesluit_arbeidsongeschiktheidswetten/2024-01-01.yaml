  - number: 1.l
    text: |-
      minimumloon per uur: het bedrag, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 1a.1
    text: |-
      Betrokkene heeft geen mogelijkheden tot arbeidsparticipatie als bedoeld in de [artikelen 1a:1, eerste lid][ref1],
      [2:4, eerste lid][ref2], en [3:8a, eerste lid, van de Wajong][ref3], indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 1a.1.a
    text: geen taak kan uitvoeren in een arbeidsorganisatie;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: 1a.1.b
    text: niet over basale werknemersvaardigheden beschikt;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: 1a.1.c
    text: niet aaneengesloten kan werken gedurende ten minste een periode van een uur; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: 1a.1.d
    text: |-
      niet ten minste vier uur per dag belastbaar is, tenzij hij ten minste twee uur per dag belastbaar is en in staat is
      per uur ten minste een bedrag te verdienen dat gelijk is aan het minimumloon per uur.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Een taak als bedoeld in het eerste lid, onderdeel a, is de kleinste eenheid van een functie en bestaat uit één of
      meerdere handelingen.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: 1a.3
    text: Bij ministeriële regeling kunnen met betrekking tot het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel1a
  - number: '2.1'
    text: |-
      De arbeidsongeschiktheidsbeoordeling, bedoeld in de [WAO][ref1], de [Waz][ref2] en de [hoofdstukken 2][ref3] en
      [3 van de Wajong][ref4], de beoordeling van duurzaam geen mogelijkheden tot arbeidsparticipatie hebben als bedoeld
      in de [hoofdstukken 1a][ref5], 2 en 3, van de Wajong, de beoordeling van het percentage van het maatmaninkomen
      dat de verzekerde kan verdienen, bedoeld in de [ZW][ref6] en de beoordeling van volledige en duurzame
      arbeidsongeschiktheid of de mate van gedeeltelijke arbeidsgeschiktheid, bedoeld in de [Wet WIA][ref7], worden
      gebaseerd op een verzekeringsgeneeskundig onderzoek en een arbeidsdeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk1a
      [ref6]: https://wetten.overheid.nl/BWBR0001888
      [ref7]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0008657
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0008657
        hoofdstuk: 1a
      - id: ref6
        bwb_id: BWBR0001888
      - id: ref7
        bwb_id: BWBR0019057
  - number: '2.2'
    text: 'Van het arbeidsdeskundig onderzoek kan worden afgezien:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.2.a
    text: |-
      gedurende de periode waarin uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare
      mogelijkheden heeft;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.2.b
    text: |-
      indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft
      maar dat hij die mogelijkheden naar verwachting binnen drie maanden zal verliezen, en dit verlies in een
      verzekeringsgeneeskundig onderzoek wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.2.c
    text: |-
      indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft maar dat
      hij wegens zijn terminale ziekte een zodanig slechte levensverwachting heeft dat hij die mogelijkheden naar
      verwachting binnen afzienbare termijn zal verliezen, en dit verlies in een verzekeringsgeneeskundig onderzoek wordt
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.2.d
    text: |-
      indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene zodanig wisselend belastbaar is voor arbeid dat
      betrokkene geen benutbare mogelijkheden heeft.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare mogelijkheden heeft maar
      betrokkene die mogelijkheden naar verwachting na verloop van een periode wel zal hebben, vindt na verloop van die
      periode opnieuw een verzekeringsgeneeskundig onderzoek plaats.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het wisselend belastbaar zijn voor arbeid, bedoeld in het tweede lid, onderdeel d, wordt ten minste drie maal in
      een verzekeringsgeneeskundig onderzoek vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: '2.5'
    text: 'Benutbare mogelijkheden als bedoeld in het tweede tot en met het vierde lid zijn alleen dan niet aanwezig indien:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.5.a
    text: |-
      betrokkene is opgenomen in een ziekenhuis of in een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref1] die zorg verleent waarop
      aanspraak bestaat ingevolge de [Wet langdurige zorg][ref2], met uitzondering van een inrichting waar geestelijk
      gestoorde delinquenten van overheidswege verpleegd worden;


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035917
  - number: 2.5.b
    text: betrokkene bedlegerig is;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.5.c
    text: |-
      betrokkene voor het uitvoeren van activiteiten van het dagelijks leven dermate afhankelijk is dat hij lichamelijk
      niet zelfredzaam is; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2.5.d
    text: |-
      betrokkene als gevolg van een ernstige psychische stoornis in zijn zelfverzorging, in zijn directe
      samenlevingsverband alsook in zijn sociale contacten, waaronder zijn werkrelaties, niet of dermate minimaal
      functioneert dat hij psychisch niet zelfredzaam is.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: '2.6'
    text: |-
      Van het arbeidsdeskundig onderzoek kan worden afgezien indien de verzekeringsarts vaststelt dat betrokkene niet
      ongeschikt is tot het verrichten van zijn laatstelijk uitgeoefende arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: '2.7'
    text: Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2
  - number: 2a.1
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], kan bij de vaststelling, bedoeld in
      [artikel 8:10b van de Wajong][ref2], of een jonggehandicapte met een recht op arbeidsongeschiktheidsuitkering
      op grond van [hoofdstuk 3 van de Wajong][ref3] met een mate van arbeidsongeschiktheid van 80% of meer, geen
      mogelijkheden tot arbeidsparticipatie heeft, worden afgezien van verzekeringsgeneeskundig en arbeidsdeskundig
      onderzoek, indien deze vaststelling op basis van reeds beschikbare gegevens mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0008657
        hoofdstuk: '3'
  - number: 2a.2
    text: 'Van verzekeringsgeneeskundig en arbeidsdeskundig onderzoek wordt in ieder geval afgezien, indien:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.a
    text: 'de jonggehandicapte op of na 1 januari 2008:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.a.1°
    text: arbeid in een dienstbetrekking verrichtte;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.a.2°
    text: inkomen als zelfstandige verwierf;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.a.3°
    text: deelnam aan activiteiten of werkzaamheden gericht op zijn inschakeling in arbeid;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.a.4°
    text: |-
      een verhoogde arbeidsongeschiktheidsuitkering ontving op grond van [artikel 3:9 van de Wajong][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 2a.2.a.5°
    text: |-
      blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoorde van de
      [Wet sociale werkvoorziening][ref1], of blijkens een op of na 1 januari 2008 genomen beschikking van het
      Uitvoeringsinstituut werknemersverzekeringen niet tot die doelgroep behoorde;


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 2a.2.b
    text: |-
      de jonggehandicapte op of na 1 juli 2014 op eigen verzoek begeleiding van het Uitvoeringsinstituut
      werknemersverzekeringen kreeg, gericht op arbeidsparticipatie; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c
    text: |-
      de mogelijkheden tot arbeidsparticipatie kunnen worden beoordeeld aan de hand van op of na 1 januari 2008 in het
      dossier van de jonggehandicapte opgenomen gegevens over:
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c.1°
    text: |-
      arbeid die de jonggehandicapte verrichtte, een gevolgde opleiding of een traject gericht op de inschakeling in
      arbeid;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c.2°
    text: de mogelijkheden en beperkingen van de jonggehandicapte, welke door een verzekeringsarts zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c.3°
    text: het voornemen de jonggehandicapte op enig moment nogmaals te beoordelen;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c.4°
    text: de aanwezigheid van een progressieve ziekte; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.2.c.5°
    text: |-
      het verrichten van activiteiten in het kader van dagbesteding in de zin van de
      [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 2a.3
    text: |-
      Indien wordt afgezien van verzekeringsgeneeskundig of arbeidsdeskundig onderzoek op grond van het eerste of
      tweede lid wordt voorafgaand aan de vaststelling of de jonggehandicapte geen mogelijkheden tot arbeidsparticipatie
      heeft alsnog verzekeringsgeneeskundig of arbeidsdeskundig onderzoek verricht, indien de jonggehandicapte aangeeft
      dat de reeds beschikbare gegevens, bedoeld in het eerste lid, onvolledig of onjuist zijn en als gevolg daarvan
      vaststelling zonder verzekeringsgeneeskundig of arbeidsdeskundig onderzoek niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: 2a.4
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het eerste en tweede lid nadere regels worden gesteld met
      betrekking tot de beoordeling van het geen mogelijkheden tot arbeidsparticipatie hebben.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Het verzekeringsgeneeskundig onderzoek strekt ertoe vast te stellen of betrokkene ten gevolge van ziekte, gebrek,
      zwangerschap of bevalling ongeschikt is tot werken.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Daarbij onderzoekt de verzekeringsarts of bij betrokkene sprake is van vermindering of verlies van lichamelijke of
      psychische structuur of functie, die vermindering of verlies van normale gedragingen en activiteiten en van normale
      sociale rolvervulling tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Tevens stelt de verzekeringsarts vast welke beperkingen betrokkene in zijn functioneren in arbeid ondervindt ten
      gevolge van het verlies of vermindering van vermogens, bedoeld in het tweede lid, alsmede in welke mate betrokkene
      belastbaar is voor arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel3
  - number: '3.4'
    text: |-
      De verzekeringsarts stelt bij een beoordeling van het duurzaam geen mogelijkheden tot arbeidsparticipatie
      hebben, bedoeld in de [hoofdstukken 1a][ref1] en [3 van de Wajong][ref2], van de volledige en duurzame
      arbeidsongeschiktheid, bedoeld in [hoofdstuk 2 van de Wajong][ref3], en van de volledige en duurzame
      arbeidsongeschiktheid, bedoeld in de [Wet WIA][ref4], vast of de gevolgen van ziekte, gebrek, zwangerschap of
      bevalling waardoor de betrokkene ongeschikt is tot werken duurzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk1a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008657
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0008657
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0008657
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0019057
  - number: '4.1'
    text: 'Het verzekeringsgeneeskundig onderzoek voldoet aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de gebruikte onderzoeksmethoden, argumentatie, bevindingen en conclusies van het verzekeringsgeneeskundig onderzoek
      worden schriftelijk vastgelegd;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel4
  - number: 4.1.b
    text: |-
      een door een andere verzekeringsarts uitgevoerd verzekeringsgeneeskundig onderzoek zal tot dezelfde bevindingen en
      conclusies kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel4
  - number: 4.1.c
    text: de redeneringen en conclusies van het verzekeringsgeneeskundig onderzoek zijn vrij van innerlijke tegenspraak.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      De vaststellingen en het onderzoek, bedoeld in [artikel 3][ref1], geschieden aan de hand van algemeen aanvaarde
      verzekeringsgeneeskundige onderzoeksmethoden die gericht zijn op het kunnen vaststellen van ongeschiktheid tot
      werken als gevolg van ziekte, gebrek, zwangerschap of bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.1'
    text: 'Het arbeidsdeskundig onderzoek strekt tot vaststelling van:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de mate van arbeidsongeschiktheid, bedoeld in [artikel 18 van de WAO][ref1], zoals dit artikel luidt sinds
      1 augustus 1993, [artikel 2 van de Waz][ref2] en [artikel 3:1 van de Wajong][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002551
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 5.1.b
    text: |-
      volledige en duurzame arbeidsongeschiktheid als bedoeld in [artikel 2:5, eerste lid, van de Wajong][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
  - number: 5.1.c
    text: |-
      duurzaam geen mogelijkheden tot arbeidsparticipatie hebben als bedoeld in de [artikelen 1a:1][ref1], [3:8a][ref2]
      en [8:10b van de Wajong][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel8
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '8'
  - number: 5.1.d
    text: |-
      volledige arbeidsongeschiktheid als bedoeld in [artikel 4 van de Wet WIA][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
  - number: 5.1.e
    text: |-
      de mate van gedeeltelijke arbeidsongeschiktheid, bedoeld in [artikel 5 van de Wet WIA][ref1], en de beoordeling
      van wat iemand met arbeid kan verdienen, bedoeld in [artikel 2:5, eerste lid, van de Wajong][ref2], en
      [artikel 19aa, eerste lid, onderdeel b, van de ZW][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 19aa
  - number: '5.2'
    text: |-
      Bij het onderzoek, bedoeld in het eerste lid, onderdelen a, d en e, wordt het maatmaninkomen per uur van betrokkene
      vergeleken met hetgeen hij met arbeid kan verdienen.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het maatmaninkomen WAO is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 18, eerste lid, van de WAO][ref1], met arbeid gewoonlijk verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: '6.2'
    text: |-
      Het maatmaninkomen Waz is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 2, eerste lid, van de Waz][ref1], met arbeid als verzekerde, bedoeld in [artikel 3 van de Waz][ref2]
      gewoonlijk verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '3'
  - number: '6.3'
    text: |-
      Het maatmaninkomen, bedoeld in de [hoofdstukken 2][ref1] en [3 van de Wajong][ref2], is voor de jonggehandicapte
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008657
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008657
        hoofdstuk: '3'
  - number: 6.3.a
    text: |-
      geen inkomsten uit arbeid geniet, 108% van het bedrag dat voor een werknemer van dezelfde leeftijd geldt als
      minimumloon per uur;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
  - number: 6.3.b
    text: |-
      inkomsten uit arbeid geniet, het inkomen dat een niet-jonggehandicapt persoon van dezelfde leeftijd met de door de
      jonggehandicapte feitelijk verrichte arbeid gedurende de normale, volledige werkweek, per uur zou verdienen.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het maatmaninkomen van de jonggehandicapte, bedoeld in het derde lid, wordt hoger gesteld, en ten minste op een
      bedrag gelijk aan anderhalf maal het bedrag dat voor de belanghebbende geldt als minimumloon per uur, indien de
      jonggehandicapte:
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
  - number: 6.4.a
    text: |-
      arbeidsongeschikt is geworden binnen een jaar onmiddellijk voorafgaande aan het behalen van een diploma, dan
      wel na het behalen van een diploma, aan een beroepsgerichte opleiding die opleidt voor een beroep waarvan het
      aanvangssalaris ten minste gelijk is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd
      geldt als minimumloon op grond van de [Wet minimumloon en minimumvakantiebijslag][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 6.4.b
    text: |-
      tijdens de arbeidsongeschiktheid doch uiterlijk op de dag dat hij de leeftijd van 30 jaar bereikt, een diploma
      behaalt van een beroepsgerichte opleiding die opleidt voor een beroep waarvan het aanvangssalaris ten minste gelijk
      is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd geldt als minimumloon op grond van de
      [Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '6.5'
    text: |-
      Indien de vaststelling van het maatmaninkomen met toepassing van het vierde lid tot een hoger maatmaninkomen leidt
      dan de vaststelling van het maatmaninkomen met toepassing van het derde lid, wordt uitgegaan van het eerstgenoemde
      maatmaninkomen.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
  - number: '6.6'
    text: |-
      In de gevallen waarin [artikel 43a van de WAO][ref1], [artikel 2:3, tweede lid][ref2], [2:17][ref3]
      of [3:21 van de Wajong][ref4], [artikel 48, eerste lid, aanhef en onderdelen b en c][ref5],
      [50, eerste lid, aanhef en onderdeel b][ref6], of [55, eerste lid, aanhef en onderdelen b en c, van de Wet WIA][ref7]
      toepassing vindt, alsmede in de gevallen waarin dat niet het geval is omdat [artikel 29b van de Ziektewet][ref8]
      toepassing kan vinden, wordt het maatmaninkomen niet lager vastgesteld dan het maatmaninkomen dat voor de
      vaststelling van de mate van arbeidsongeschiktheid of mate van gedeeltelijke arbeidsgeschiktheid in aanmerking
      zou worden genomen indien de uitkering niet zou zijn ingetrokken, dan wel indien aan het einde van de
      wachttijd, bedoeld in [artikel 19 van de WAO][ref9], [artikel 2:3][ref10] of [3:3 van de Wajong][ref11] of
      [artikel 23 van de Wet WIA][ref12], recht zou hebben bestaan op een dergelijke uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel50
      [ref7]: https://wetten.overheid.nl/BWBR0019057#Artikel55
      [ref8]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
      [ref9]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref10]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref11]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref12]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '50'
      - id: ref7
        bwb_id: BWBR0019057
        artikel: '55'
      - id: ref8
        bwb_id: BWBR0001888
        artikel: 29b
      - id: ref9
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref10
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref11
        bwb_id: BWBR0008657
        artikel: '3'
      - id: ref12
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '6.7'
    text: |-
      In de gevallen waarin, na eerdere intrekking van een uitkering op grond van de [ZW][ref1], de [WAO][ref2], de
      [Wajong][ref3] of de [Wet WIA][ref4], dan wel na het eerder niet toekennen van een uitkering aan het einde van
      de wachttijd, bedoeld in [artikel 19 van de WAO][ref5], [artikel 2:3][ref6] of [3:3 van de Wajong][ref7] of
      [artikel 23 van de Wet WIA][ref8], bij de vaststelling van het maatmaninkomen wordt uitgegaan van arbeid op basis
      waarvan voor de betrokkene reeds eerder een maatmaninkomen is vastgesteld, wordt het maatmaninkomen vastgesteld
      op het maatmaninkomen dat voor de vaststelling van de mate van arbeidsongeschiktheid of mate van gedeeltelijke
      arbeidsgeschiktheid in aanmerking zou worden genomen indien de uitkering niet zou zijn ingetrokken, dan wel indien
      aan het einde van de genoemde wachttijd recht zou hebben bestaan op een dergelijke uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0008657#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref7
        bwb_id: BWBR0008657
        artikel: '3'
      - id: ref8
        bwb_id: BWBR0019057
        artikel: '23'
  - number: '7.1'
    text: |-
      Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1],
      [artikel 19aa, vijfde lid, van de ZW][ref2] en in [artikel 1 van de Wet WIA][ref3], worden het inkomen, de
      inkomsten uit arbeid en de verdiensten van de gezonde of de niet-jonggehandicapte persoon bepaald door van de
      verzekerde of de jonggehandicapte in aanmerking te nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19aa
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 7.1.a
    text: |-
      het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref1] voor de werknemer in de zin
      van [die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0017745
  - number: 7.1.b
    text: |-
      het loon in de zin van de [Wet op de loonbelasting 1964][ref1], voor zover de verzekerde of de jonggehandicapte
      niet als werknemer als bedoeld in onderdeel a inkomen verdient;


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 7.1.c
    text: |-
      het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref1],
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref2], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref3], en
      [artikel 3.92 van die wet][ref4], voor zover de verzekerde of de jonggehandicapte geen werknemer is als bedoeld in
      de onderdelen a en b;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.3.1
      - id: ref2
        bwb_id: BWBR0011353
        paragraaf: 3.4.1
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 7.1.d
    text: |-
      de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1],
      vermeerderd met de ondernemersaftrek, bedoeld in [artikel 3.74 van die wet][ref2] en vermeerderd met de MKB-
      winstvrijstelling, bedoeld in [artikel 3.79a van die wet][ref3], met dien verstande dat de bestanddelen van de
      winst, bedoeld in [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref4], niet geacht worden te behoren
      tot de winst.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '7.2'
    text: |-
      Indien de berekening van het resultaat uit overige werkzaamheden, bedoeld in het eerste lid, onderdeel c,
      of de winst, bedoeld in het eerste lid, onderdeel d, leidt tot een negatief bedrag, wordt het resultaat,
      onderscheidenlijk de winst op nihil gesteld.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid, onderdelen a en b, wordt voor de vaststelling van het maatmaninkomen,
      bedoeld in [artikel 6, eerste en derde lid][ref1], [artikel 19aa, vijfde lid, van de ZW][ref2] en in
      [artikel 1 van de Wet WIA][ref3] niet als inkomen, inkomsten uit arbeid of verdiensten in aanmerking genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19aa
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 7.3.a
    text: |-
      het loon uit vroegere dienstbetrekking in de zin van de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 7.3.b
    text: |-
      loondervingsuitkeringen, al dan niet vermeerderd met een toeslag op grond van de [Toeslagenwet][ref1] en de door de
      werkgever betaalde aanvullingen op die uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 7.3.c
    text: |-
      de eindheffingsbestanddelen als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 7a.1
    text: |-
      Het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1], [artikel 19aa, vijfde lid, van de ZW][ref2]
      en [artikel 1 van de Wet WIA][ref3], wordt vastgesteld door het loon, bedoeld in
      [artikel 7, eerste lid, onderdelen a en b][ref4], dat de verzekerde of de jonggehandicapte met de maatgevende
      arbeid in het refertejaar heeft verdiend te delen door het aantal uren van die maatgevende arbeid in het
      refertejaar, waarbij het loon geacht wordt te zijn genoten in het aangiftetijdvak waarover de werkgever of de
      inhoudingsplichtige van dat loon opgave heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel7
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19aa
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7a.2
    text: |-
      Bij de toepassing van het eerste lid worden het loon verdiend met maatgevende arbeid en het aantal uren van de
      maatgevende arbeid in volledige aangiftetijdvakken in aanmerking genomenen worden daarbij de aangiftetijdvakken
      buiten beschouwing gelaten waarin geen sprake is van maatgevende arbeid van de verzekerde of de jonggehandicapte of
      waarin sprake is van arbeid in een urenomvang die niet maatgevend is.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7a
  - number: 7a.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt een andere periode van maximaal één jaar vast waarover het
      inkomen en het aantal uren van de maatgevende arbeid in aanmerking worden genomen, indien in het refertejaar geen
      sprake is van maatgevende arbeid of van arbeid van een urenomvang die maatgevend is.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7a
  - number: 7a.4
    text: |-
      Indien de verzekerde of de jonggehandicapte feitelijk geen inkomen heeft verdiend met maatgevende arbeid of
      arbeid van een urenomvang die maatgevend is, neemt het Uitvoeringsinstituut werknemersverzekeringen het inkomen
      in aanmerking, dat de verzekerde of de jonggehandicapte zou hebben verdiend, indien hij de maatgevende arbeid of
      arbeid in de urenomvang die maatgevend is, zou hebben verricht, alsmede het aantal uren van die arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7a
  - number: 7a.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan loon in aanmerking nemen, waarvan geen opgave is gedaan
      in de aangiftetijdvakken in het refertejaar, indien de verzekerde aantoont, dat hij daarop wel recht had in die
      aangiftetijdvakken.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1],
      [artikel 19aa, vijfde lid, van de ZW][ref2] en [artikel 1 van de Wet WIA][ref3], worden het inkomen, de inkomsten
      uit arbeid en de verdiensten, bedoeld [artikel 7, eerste lid][ref4], die bij toepassing van [artikel 7a][ref5]
      in aanmerking worden genomen, vanaf het begin van het eerste in aanmerking genomen aangiftetijdvak aangepast aan
      de eerst-gepubliceerde cijfers van de index van de CAO-lonen per uur inclusief bijzondere beloningen, zoals die
      uiterlijk ten tijde van het arbeidsdeskundig onderzoek, bedoeld in [artikel 5][ref6], door het Centraal Bureau voor
      de Statistiek wordt gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel7a
      [ref6]: https://wetten.overheid.nl/BWBR0011478#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19aa
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0011478
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.2'
    text: |-
      Nadat een eerste beoordeling in verband met de vaststelling, bedoeld in [artikel 5][ref1], heeft plaatsgevonden,
      wordt bij een hernieuwde vaststelling, een heropening, een herleving of een herziening van de uitkering geen
      rekening gehouden met na die eerste beoordeling opgetreden wijzigingen in het maatmaninkomen, met dien verstande
      dat bij de hernieuwde vaststelling van de mate van arbeidsongeschiktheid het maatmaninkomen wordt aangepast
      aan de eerst-gepubliceerde cijfers van de index van de CAO-lonen per uur inclusief bijzondere beloningen, zoals
      dit uiterlijk ten tijde van het arbeidsdeskundig onderzoek door het Centraal Bureau voor de Statistiek wordt
      gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      In gevallen waarin het maatmaninkomen voor het laatst is vastgesteld voor 1 januari 2001 vindt bij de
      eerstvolgende vaststelling van de mate van arbeidsongeschiktheid na deze datum naast de aanpassing,
      bedoeld in het tweede lid, eenmalig een extra verhoging van het maatmaninkomen plaats overeenkomstig
      [artikel 3 van de Wet brutering overhevelingstoeslag lonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '3'
  - number: '9'
    text: 'Bij bepaling van hetgeen betrokkene nog met arbeid kan verdienen worden de volgende regels in acht genomen:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.a
    text: |-
      in aanmerking wordt genomen die algemeen geaccepteerde arbeid waarmee betrokkene per uur het meest kan verdienen,
      waaronder mede wordt begrepen arbeid waarvoor bekwaamheden nodig zijn die algemeen gebruikelijk zijn en binnen
      zes maanden kunnen worden verworven, tenzij betrokkene niet over dergelijke bekwaamheden beschikt en als
      rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebrek dergelijke bekwaamheden niet kan
      verwerven. Onder deze bekwaamheden worden ten minste verstaan mondelinge beheersing van de Nederlandse taal
      en eenvoudig computergebruik. Deze arbeid wordt nader omschreven in de vorm van ten minste drie verschillende
      in Nederland uitgeoefende functies. Deze functies vertegenwoordigen ieder ten minste drie arbeidsplaatsen. De
      gegevens met betrekking tot de in aanmerking genomen functies, met alle daaraan verbonden specifieke aspecten
      inzake belasting, beloning en opleidingseisen mogen op het moment van de datum waarop de ter gelegenheid van de
      arbeidsongeschiktheidsbeoordeling gegeven beschikking betrekking heeft, niet ouder zijn dan 24 maanden;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.b
    text: |-
      bij het bepalen van de urenomvang van de onder a bedoelde functies mogen ook functies in aanmerking worden genomen
      met een omvang groter dan de urenomvang van de door de in [artikel 6][ref1], [artikel 1 van de Wet WIA][ref2] of
      [artikel 19aa, vijfde lid, van de ZW][ref3] bedoelde gezonde persoon uitgeoefende arbeid, tenzij betrokkene voor
      een geringer aantal uren belastbaar is, in welk geval de urenomvang van de onder a bedoelde functies niet meer
      bedraagt dan dat aantal uren;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 19aa
  - number: 9.c
    text: |-
      arbeid, die door betrokkene alleen kan worden verricht na toepassing van zodanige voorzieningen, dat het accepteren
      van die toepassing in redelijkheid niet van een werkgever kan worden verlangd, blijft bij de toepassing van
      onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.d
    text: |-
      arbeid, die niet door betrokkene kan worden verricht omdat voor het verrichten van die arbeid een in de wet of
      collectieve arbeidsovereenkomst neergelegde functionele leeftijdsgrens geldt, die door betrokkene is overschreden
      of nog niet is bereikt, blijft bij de toepassing van onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.e
    text: |-
      indien betrokkene zodanige kenmerken heeft, dat van een werkgever in redelijkheid niet kan worden verlangd hem in
      bepaalde arbeid te werk te stellen, blijft die arbeid bij de toepassing van onderdeel a buiten beschouwing;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.f
    text: |-
      bij de toepassing van onderdeel a blijft arbeid die meer dan incidenteel tussen 0.00 uur en 6.00 uur wordt verricht
      buiten beschouwing, tenzij de gezonde persoon, bedoeld in [artikel 6][ref1], [artikel 1 van de Wet WIA][ref2] of
      [artikel 19aa, vijfde lid, van de ZW][ref3], in dergelijke arbeid werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel19aa
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 19aa
  - number: 9.g
    text: |-
      Indien betrokkene de leeftijd van 21 jaar nog niet heeft bereikt wordt onderdeel a toegepast alsof hij die leeftijd
      heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: 9.h
    text: |-
      in afwijking van de onderdelen b en f wordt uitgegaan van de arbeid die feitelijk wordt verricht, mits dit
      leidt tot een lagere mate van arbeidsongeschiktheid dan de met toepassing van onderdeel a en [artikel 10][ref1]
      vastgestelde mate van arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel10
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 9.i
    text: |-
      voor de toepassing van onderdeel h wordt onder arbeid die feitelijk wordt verricht mede verstaan arbeid die na
      het intreden van de arbeidsongeschiktheid feitelijk is verricht en waartoe de betrokkene met zijn krachten en
      bekwaamheden in staat is.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel9
  - number: '10.1'
    text: 'Bij de berekening van hetgeen betrokkene met arbeid kan verdienen, wordt:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
  - number: 10.1.a
    text: |-
      uitgegaan van de urenomvang van de arbeid, die bij de toepassing van [artikel 7][ref1] en [7a][ref2] in aanmerking
      wordt genomen, tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval van dit aantal wordt
      uitgegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel7a
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10.1.b
    text: |-
      in aanmerking genomen het loon van de middelste van de in [artikel 9, onderdeel a][ref1], bedoelde functies.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      Indien betrokkene de leeftijd van 21 jaar nog niet heeft bereikt wordt het inkomen per uur dat hij na
      toepassing van het eerste lid met arbeid kan verdienen verlaagd door het te vermenigvuldigen met het het
      minimumloonpercentage, bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1],
      tenzij wordt uitgegaan van feitelijke inkomsten uit arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '10.3'
    text: |-
      Indien het inkomen per uur dat betrokkene na toepassing van het eerste en tweede lid met arbeid kan verdienen, meer
      bedraagt dan zijn maatmaninkomen per uur, wordt hetgeen hij met arbeid kan verdienen niet hoger gesteld dan zijn
      maatmaninkomen per uur.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
  - number: '10.4'
    text: 'Het derde lid vindt geen toepassing:'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
  - number: 10.4.a
    text: indien wordt uitgegaan van de feitelijke inkomsten uit arbeid; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
  - number: 10.4.b
    text: |-
      indien betrokkene nog tot arbeid in dezelfde omvang in staat is als de in [artikel 6][ref1] bedoelde gezonde
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      Voor zover het niet gaat om feitelijke inkomsten uit arbeid, wordt onder het loon, bedoeld in dit artikel,
      verstaan: het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref1] voor de werknemer
      in de zin van die wet, dat voor de desbetreffende functie gebruikelijk is. Hierbij wordt geen rekening gehouden met
      incidentele loonbestanddelen of loonbestanddelen die op de persoon van de werknemer betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: '10.6'
    text: |-
      De feitelijke inkomsten uit arbeid in dit artikel worden vastgesteld door hetgeen daarvoor op grond van
      [artikel 7][ref1] in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel7
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.1
    text: |-
      Dit artikel is van toepassing bij de uitvoering van de [artikelen 44, eerste lid, van de WAO][ref1] of
      [58, eerste lid, van de Waz][ref2], indien er sprake is van loon als bedoeld in het tweede lid van de genoemde
      artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
  - number: 10a.2
    text: |-
      De [artikelen 9][ref1] en [10][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel10
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 10a.3
    text: |-
      Het maatmaninkomen per uur, bedoeld in hoofdstuk 2, paragraaf 1, wordt herleid naar een maatmaninkomen per
      aangiftetijdvak. Dit gebeurt door het maatmaninkomen per uur te vermenigvuldigen met:
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
  - number: 10a.3.a
    text: |-
      de urenomvang per week van de maatgevende arbeid en het quotiënt van 52,2 en 12, indien het aangiftetijdvak een
      kalendermaand betreft; of
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
  - number: 10a.3.b
    text: de urenomvang per week van de maatgevende arbeid en 4, indien het aangiftetijdvak vier weken betreft.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Het arbeidsongeschiktheidspercentage wordt als volgt berekend: (M–L) / M * 100% Hierbij staat L voor het
      loon, bedoeld in de [artikelen 44, tweede lid, van de WAO][ref1] en [58, tweede lid, van de Waz][ref2], per
      aangiftetijdvak; en M voor het maatmaninkomen zoals berekend op grond van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel58
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '58'
  - number: '11'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de berekening van het
      maatmaninkomen en de resterende verdiencapaciteit ten behoeve van de vaststelling, bedoeld in [artikel 5][ref1].
      Daarbij kan worden bepaald wat mede wordt verstaan onder bekwaamheden die algemeen gebruikelijk zijn en binnen zes
      maanden kunnen worden verworven als bedoeld in [artikel 9, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 11a.1
    text: |-
      Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 7a][ref1], en van de feitelijke inkomsten
      uit arbeid, bedoeld in [artikel 10, zesde lid][ref2], wordt het in de relevante aangiftetijdvakken opgebouwde
      bedrag aan vakantiebijslag en de opgebouwde looncomponenten ten behoeve van een arbeidsvoorwaardenbedrag in
      aanmerking genomen in plaats van het in relevante aangiftetijdvakken uitbetaalde bedrag aan vakantiebijslag en de
      looncomponenten ten laste van een arbeidsvoorwaardenbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel10
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 11a.2
    text: |-
      Onder een arbeidsvoorwaardenbedrag als bedoeld in het eerste lid wordt verstaan het aan de werknemer
      toegekende en in geld uitgedrukte toekomstige loonbestanddeel, niet zijnde een afzonderlijke
      opbouw van vakantiebijslag, dat is opgebouwd ingevolge afspraken in de individuele of collectieve
      arbeidsovereenkomst, voor zover dit toekomstige loonbestanddeel kan leiden tot loon als bedoeld in
      [artikel 16 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: '12'
    text: |-
      Indien de mate van arbeidsongeschiktheid voor de eerste maal is vastgesteld op een datum gelegen vóór 10 augustus
      1994 wordt, bij een hernieuwde vaststelling of een herziening van de uitkering na laatstgenoemde datum, geen
      rekening gehouden met de sedert de laatste vaststelling of herziening van de mate van arbeidsongeschiktheid
      opgetreden wijzingen in het maatmaninkomen. Voor personen, bedoeld in de [artikelen XX][ref1], [XXI][ref2],
      [XXIV][ref3] en [XXV van de Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref4],
      zoals deze artikelen luidden voor de inwerkingtreding van de eerste fase van de
      [Wet overheidspersoneel onder de werknemersverzekeringen][ref5], wordt de in de eerste zin bedoelde datum gesteld
      op 1 januari 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelXX
      [ref2]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXI
      [ref3]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXIV
      [ref4]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXV
      [ref5]: https://wetten.overheid.nl/BWBR0009267
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006072
        artikel: XX
      - id: ref2
        bwb_id: BWBR0006072
        artikel: XXI
      - id: ref3
        bwb_id: BWBR0006072
        artikel: XXIV
      - id: ref4
        bwb_id: BWBR0006072
        artikel: XXV
      - id: ref5
        bwb_id: BWBR0009267
  - number: 12a.1
    text: |-
      De [artikelen 2][ref1], [6][ref2], [9][ref3], [10][ref4] en [11][ref5], zoals die luidden op de dag
      voor inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit
      arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de introductie van een
      maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434), blijven van toepassing op een recht op uitkering
      met een ingangsdatum voor of op die dag indien betrokkene voor of op 1 juli 1959 is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel11
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 12a.2
    text: |-
      In afwijking van het eerste lid is [artikel 9, onderdeel a, laatste zin][ref1], van toepassing op een recht op
      uitkering als bedoeld in het eerste lid van de betrokkene die voor of op 1 juli 1959 is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12a.3
    text: |-
      Onverminderd het eerste lid alsmede [artikel 13, tweede lid][ref1], zijn op personen, wier mate van
      arbeidsongeschiktheid voor de eerste maal is vastgesteld op een datum gelegen vóór inwerkingtreding van het
      besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit arbeidsongeschiktheidswetten met betrekking
      tot de te duiden functies alsmede in verband met de introductie van een maatmaninkomensgarantie en enkele andere
      onderwerpen (Stb. 434), de [artikelen 2][ref2], [6][ref3], [8][ref4], [9][ref5],[10][ref6] en [11][ref7],
      zoals deze luiden na inwerkingtreding van dat besluit, eerst van toepassing indien een beoordeling van de mate
      van arbeidsongeschiktheid plaatsvindt ter zake waarvan een beschikking wordt afgegeven, bij gelegenheid van die
      beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011478#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0011478#Artikel11
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0011478
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0011478
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 12a.4
    text: |-
      In afwijking van het derde lid is [artikel 6, zesde lid][ref1], niet van toepassing in de gevallen waarin
      [artikel 43a van de WAO][ref2], [artikel 20 van de WAZ][ref3] of [artikel 3:21 van de Wajong][ref4] toepassing
      heeft gevonden voor de datum van inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het
      Schattingsbesluit arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de
      introductie van een maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434).


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref3]: https://wetten.overheid.nl/BWBR0008656#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref3
        bwb_id: BWBR0008656
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 12b.1
    text: |-
      Op de persoon die voor 1 juli 2008 recht had op een uitkering op grond van de [WAO][ref1], [Waz][ref2],
      [Wajong][ref3] of [Wet WIA][ref4] worden, onverminderd [artikel 8, tweede lid][ref5], de [artikelen 7][ref6] en
      [7a][ref7] slechts toegepast, indien de maatgevende arbeid die bepalend is voor het maatmaninkomen, na 1 juli 2008
      is gewijzigd, waarbij deze artikelen voor de uitkering op grond van de [Waz][ref8] van overeenkomstige toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0011478#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0011478#Artikel7a
      [ref8]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0011478
        artikel: 7a
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0008656
  - number: 12b.2
    text: |-
      Indien het inkomen, de inkomsten uit arbeid en de verdiensten, bedoeld in [artikel 7][ref1], betrekking
      hebben op aangiftetijdvakken, die zijn gelegen voor 1 januari 2006, wordt voor de bepaling van het inkomen,
      de inkomsten uit arbeid of de verdiensten uitgegaan van het loon waarnaar de premies met toepassing van
      de [Coördinatiewet Sociale Verzekering][ref2], met uitzondering van [artikel 9 van die wet][ref3], zoals
      [die wet][ref4] luidde ten tijde van die aangiftetijdvakken, zou zijn geheven. Hierbij wordt geen rekening gehouden
      met het betaalde bedrag aan vakantiebijslag en periodieke loonelementen, maar met een evenredig deel van de
      vakantiebijslag en periodieke loonelementen.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002126
      [ref3]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002126
      - id: ref3
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002126
  - number: 12b.3
    text: |-
      Tot 1 juli 2010 is [artikel 10, vijfde lid][ref1], niet van toepassing op niet door het Uitvoeringsinstituut
      werknemersverzekeringen geactualiseerde functies, die worden gebruikt bij de bepaling van hetgeen betrokkene nog
      met arbeid kan verdienen als bedoeld in de [artikelen 9][ref2] en [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011478#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011478#Artikel10
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011478
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12b.4
    text: |-
      Op de persoon die op 30 juni 2008 recht had op uitkering op grond van de [WAO][ref1], [Waz][ref2], [Wajong][ref3]
      of [Wet WIA][ref4], en inkomsten uit arbeid had, wordt [artikel 10, zesde lid][ref5], pas van toepassing, indien na
      30 juni 2008 een onderzoek plaatsvindt als bedoeld in [artikel 5][ref6] bij gelegenheid van dat onderzoek, dan wel
      indien de inkomsten uit arbeid op of na 1 januari 2013 wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0011478#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011478#Artikel5
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0011478
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0011478
        artikel: '5'
        hoofdstuk: '3'
  - number: '13.1'
    text: Het Schattingsbesluit WAO, WAZ en Wajong wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid blijft artikel 10 van het Schattingsbesluit WAO, WAZ, Wajong, zoals dat luidde
      op de dag voor de inwerkingtreding van deze wet, van toepassing op personen op wie dit artikel op die dag van
      toepassing was.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Schattingsbesluit arbeidsongeschiktheidswetten.'
    url: https://wetten.overheid.nl/BWBR0011478/2024-01-01#Artikel15
