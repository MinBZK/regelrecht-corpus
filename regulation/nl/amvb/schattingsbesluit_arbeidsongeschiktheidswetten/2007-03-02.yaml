    text: |-
      1 In afwijking van [artikel 7][ref1] wordt bij de vaststelling van de mate van arbeidsongeschiktheid het
      maatmaninkomen aangepast aan de eerst-gepubliceerde cijfers van de index van de CAO-lonen per uur inclusief
      bijzondere beloningen, zoals dit door het Centraal Bureau voor de Statistiek wordt gepubliceerd.

      2 In gevallen waarin het maatmaninkomen voor het laatst is vastgesteld voor 1 januari 2001 vindt bij
      de eerstvolgende vaststelling van de mate van arbeidsongeschiktheid na deze datum naast de aanpassing,
      bedoeld in het eerste lid, eenmalig een extra verhoging van het maatmaninkomen plaats overeenkomstig
      [artikel 3 van de Wet brutering overhevelingstoeslag lonen][ref2].


