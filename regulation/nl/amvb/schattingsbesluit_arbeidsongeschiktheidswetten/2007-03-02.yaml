  - number: '3'
    text: |-
      1 Het verzekeringsgeneeskundig onderzoek strekt ertoe vast te stellen of betrokkene ten gevolge van ziekte, gebrek,
      zwangerschap of bevalling ongeschikt is tot werken.

      2 Daarbij onderzoekt de verzekeringsarts of bij betrokkene sprake is van vermindering of verlies van lichamelijke
      of psychische structuur of functie, die vermindering of verlies van normale gedragingen en activiteiten en van
      normale sociale rolvervulling tot gevolg heeft.

      3 Tevens stelt de verzekeringsarts vast welke beperkingen betrokkene in zijn functioneren in arbeid ondervindt ten
      gevolge van het verlies of vermindering van vermogens, bedoeld in het tweede lid, alsmede in welke mate betrokkene
      belastbaar is voor arbeid.
    url: https://wetten.overheid.nl/BWBR0011478/2007-03-02#Artikel3
  - number: '4'
    text: |-
      1 Het verzekeringsgeneeskundig onderzoek voldoet aan de volgende vereisten:

      a. de gebruikte onderzoeksmethoden, argumentatie, bevindingen en conclusies van het verzekeringsgeneeskundig
      onderzoek worden schriftelijk vastgelegd;

      b. een door een andere verzekeringsarts uitgevoerd verzekeringsgeneeskundig onderzoek zal tot dezelfde bevindingen
      en conclusies kunnen leiden;

      c. de redeneringen en conclusies van het verzekeringsgeneeskundig onderzoek zijn vrij van innerlijke tegenspraak.

      2 De vaststellingen en het onderzoek, bedoeld in [artikel 3][ref1], geschieden aan de hand van algemeen aanvaarde
      verzekeringsgeneeskundige onderzoeksmethoden die gericht zijn op het kunnen vaststellen van ongeschiktheid tot
      werken als gevolg van ziekte, gebrek, zwangerschap of bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel3
    url: https://wetten.overheid.nl/BWBR0011478/2007-03-02#Artikel4
