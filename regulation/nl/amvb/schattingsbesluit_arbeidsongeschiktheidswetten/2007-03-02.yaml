  - number: '5'
    text: |-
      Het arbeidsdeskundig onderzoek strekt tot vaststelling van:

      a. de mate van arbeidsongeschiktheid, bedoeld in [artikel 18 van de WAO][ref1], zoals dit artikel luidt sinds
      1 augustus 1993, [artikel 2 van de Waz][ref2] en [artikel 2 van de Wajong][ref3];

      b. volledige arbeidsongeschiktheid als bedoeld in [artikel 4 van de Wet WIA][ref4]; dan wel

      c. de mate van gedeeltelijke arbeidsgeschiktheid, bedoeld in [artikel 5 van de Wet WIA][ref5].

      Daartoe wordt het maatmaninkomen per uur van betrokkene vergeleken met hetgeen hij met arbeid kan verdienen.


