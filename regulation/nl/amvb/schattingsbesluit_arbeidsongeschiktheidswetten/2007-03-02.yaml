  - number: '10'
    text: |-
      1 Bij de berekening van hetgeen betrokkene met arbeid kan verdienen, wordt:

      a. uitgegaan van de urenomvang van de door de in [artikel 6][ref1] bedoelde gezonde persoon uitgeoefende arbeid
      doch niet meer dan gemiddeld 38 uur, tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval
      van dit aantal wordt uitgegaan; en

      b. in aanmerking genomen het loon van de middelste van de in [artikel 9, onderdeel a][ref2], bedoelde functies.

      2 Indien betrokkene de leeftijd van 23 jaar nog niet heeft bereikt wordt het
      inkomen per uur dat hij na toepassing van het eerste lid met arbeid kan verdienen
      verlaagd door het te vermenigvuldigen met het minimumjeugdloonpercentage, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________ (Stb. 300), tenzij wordt uitgegaan van feitelijke inkomsten uit arbeid.

      3 Indien het inkomen per uur dat betrokkene na toepassing van het eerste en tweede lid met arbeid kan verdienen,
      meer bedraagt dan zijn maatmaninkomen per uur, wordt hetgeen hij met arbeid kan verdienen niet hoger gesteld dan
      zijn maatmaninkomen per uur.

      4 Het derde lid vindt geen toepassing:

      a. indien wordt uitgegaan van de feitelijke inkomsten uit arbeid; of

      b. indien betrokkene nog tot arbeid in dezelfde omvang in staat is als de in [artikel 6][ref4] bedoelde gezonde
      persoon.

      5 Voor de toepassing van de [Wet WIA][ref5] wordt onder de gezonde persoon, bedoeld in het
      eerste lid, onderdeel a, en het vierde lid, onderdeel b, verstaan: de gezonde persoon, bedoeld in
      [artikel 1, onder maatmaninkomen, van de Wet WIA][ref6].


