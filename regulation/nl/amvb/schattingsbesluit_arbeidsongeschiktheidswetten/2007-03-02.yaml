  - number: '2'
    text: |-
      1 De arbeidsongeschiktheidsbeoordeling, bedoeld in de [WAO][ref1], de [Waz][ref2] en de [Wajong][ref3] en de
      beoordeling van volledige en duurzame arbeidsongeschiktheid of de mate van gedeeltelijke arbeidsgeschiktheid,
      bedoeld in de [Wet WIA][ref4], worden gebaseerd op een verzekeringsgeneeskundig onderzoek en een arbeidsdeskundig
      onderzoek.

      2 Van het arbeidsdeskundig onderzoek kan worden afgezien:

      a. gedurende de periode waarin uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare
      mogelijkheden heeft;

      b. indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft
      maar dat hij die mogelijkheden naar verwachting binnen drie maanden zal verliezen, en dit verlies in een
      verzekeringsgeneeskundig onderzoek wordt vastgesteld;

      c. indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene benutbare mogelijkheden heeft maar dat
      hij wegens zijn terminale ziekte een zodanig slechte levensverwachting heeft dat hij die mogelijkheden naar
      verwachting binnen afzienbare termijn zal verliezen, en dit verlies in een verzekeringsgeneeskundig onderzoek wordt
      vastgesteld;

      d. indien uit verzekeringsgeneeskundig onderzoek blijkt dat betrokkene zodanig wisselend belastbaar is voor arbeid
      dat betrokkene geen benutbare mogelijkheden heeft.

      3 Indien uit het verzekeringsgeneeskundig onderzoek blijkt dat betrokkene geen benutbare mogelijkheden heeft maar
      betrokkene die mogelijkheden naar verwachting na verloop van een periode wel zal hebben, vindt na verloop van die
      periode opnieuw een verzekeringsgeneeskundig onderzoek plaats.

      4 Het wisselend belastbaar zijn voor arbeid, bedoeld in het tweede lid, onderdeel d, wordt ten minste drie maal in
      een verzekeringsgeneeskundig onderzoek vastgesteld.

      5 Benutbare mogelijkheden als bedoeld in het tweede tot en met het vierde lid zijn alleen dan niet aanwezig indien:

      a. betrokkene is opgenomen in een ziekenhuis of in een instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet toelating zorginstellingen][ref5] die zorg verleent waarop
      aanspraak bestaat ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref6], met uitzondering van een inrichting
      waar geestelijk gestoorde delinquenten van overheidswege verpleegd worden;

      b. betrokkene bedlegerig is;

      c. betrokkene voor het uitvoeren van activiteiten van het dagelijks leven dermate afhankelijk is dat hij
      lichamelijk niet zelfredzaam is; of

      d. betrokkene als gevolg van een ernstige psychische stoornis in zijn zelfverzorging, in zijn directe
      samenlevingsverband alsook in zijn sociale contacten, waaronder zijn werkrelaties, niet of dermate minimaal
      functioneert dat hij psychisch niet zelfredzaam is.

      6 Van het arbeidsdeskundig onderzoek kan worden afgezien indien de verzekeringsarts vaststelt dat betrokkene niet
      ongeschikt is tot het verrichten van zijn laatstelijk uitgeoefende arbeid.

      7 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld.


