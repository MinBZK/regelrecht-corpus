  - number: 12c
    text: |-
      Op de betrokkene van wie de mate van arbeidsongeschiktheid is vastgesteld met toepassing van [artikel 9a][ref1],
      zoals dat luidde voorafgaand aan het tijdstip waarop dat artikel vervalt, blijft dat artikel van toepassing tot de
      eerste gelegenheid van beoordeling van de mate van arbeidsongeschiktheid die betrekking heeft op een datum gelegen
      na het tijdstip waarop dat artikel vervalt, ter zake waarvan een beschikking wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel9a
