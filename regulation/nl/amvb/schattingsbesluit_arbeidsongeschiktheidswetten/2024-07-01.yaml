  - number: '13'
    text: |-
      1 Het Schattingsbesluit WAO, WAZ en Wajong wordt ingetrokken.

      2 In afwijking van het eerste lid blijft artikel 10 van het Schattingsbesluit WAO, WAZ, Wajong, zoals dat luidde
      op de dag voor de inwerkingtreding van deze wet, van toepassing op personen op wie dit artikel op die dag van
      toepassing was.
    url: https://wetten.overheid.nl/BWBR0011478/2024-07-01#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011478/2024-07-01#Artikel14
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Schattingsbesluit arbeidsongeschiktheidswetten.'
    url: https://wetten.overheid.nl/BWBR0011478/2024-07-01#Artikel15
