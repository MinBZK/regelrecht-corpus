  - number: 2a
    text: |-
      1 In afwijking van [artikel 2, eerste lid][ref1], kan bij de vaststelling, bedoeld in
      [artikel 8:10b van de Wajong][ref2], of een jonggehandicapte met een recht op arbeidsongeschiktheidsuitkering
      op grond van [hoofdstuk 3 van de Wajong][ref3] met een mate van arbeidsongeschiktheid van 80% of meer, geen
      mogelijkheden tot arbeidsparticipatie heeft, worden afgezien van verzekeringsgeneeskundig en arbeidsdeskundig
      onderzoek, indien deze vaststelling op basis van reeds beschikbare gegevens mogelijk is.

      2 Van verzekeringsgeneeskundig en arbeidsdeskundig onderzoek wordt in ieder geval afgezien, indien:

      a. de jonggehandicapte op of na 1 januari 2008:

      1°. arbeid in een dienstbetrekking verrichtte;

      2°. inkomen als zelfstandige verwierf;

      3°. deelnam aan activiteiten of werkzaamheden gericht op zijn inschakeling in arbeid;

      4°. een verhoogde arbeidsongeschiktheidsuitkering ontving op grond van [artikel 3:9 van de Wajong][ref4]; of

      5°. blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoorde van de
      [Wet sociale werkvoorziening][ref5], of blijkens een op of na 1 januari 2008 genomen beschikking van het
      Uitvoeringsinstituut werknemersverzekeringen niet tot die doelgroep behoorde;

      b. de jonggehandicapte op of na 1 juli 2014 op eigen verzoek begeleiding van het Uitvoeringsinstituut
      werknemersverzekeringen kreeg, gericht op arbeidsparticipatie; of

      c. de mogelijkheden tot arbeidsparticipatie kunnen worden beoordeeld aan de hand van op of na 1 januari 2008 in het
      dossier van de jonggehandicapte opgenomen gegevens over:

      1°. arbeid die de jonggehandicapte verrichtte, een gevolgde opleiding of een traject gericht op de inschakeling
      in arbeid;

      2°. de mogelijkheden en beperkingen van de jonggehandicapte, welke door een verzekeringsarts zijn vastgesteld;

      3°. het voornemen de jonggehandicapte op enig moment nogmaals te beoordelen;

      4°. de aanwezigheid van een progressieve ziekte; of

      5°. het verrichten van activiteiten in het kader van dagbesteding in de zin van de
      [Algemene Wet Bijzondere Ziektekosten][ref6].

      3 Indien wordt afgezien van verzekeringsgeneeskundig of arbeidsdeskundig onderzoek op grond van het eerste of
      tweede lid wordt voorafgaand aan de vaststelling of de jonggehandicapte geen mogelijkheden tot arbeidsparticipatie
      heeft alsnog verzekeringsgeneeskundig of arbeidsdeskundig onderzoek verricht, indien de jonggehandicapte aangeeft
      dat de reeds beschikbare gegevens, bedoeld in het eerste lid, onvolledig of onjuist zijn en als gevolg daarvan
      vaststelling zonder verzekeringsgeneeskundig of arbeidsdeskundig onderzoek niet mogelijk is.

      4 Bij ministeriële regeling kunnen ten aanzien van het eerste en tweede lid nadere regels worden gesteld met
      betrekking tot de beoordeling van het geen mogelijkheden tot arbeidsparticipatie hebben.


