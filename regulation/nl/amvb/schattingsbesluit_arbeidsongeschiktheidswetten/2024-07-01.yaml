    text: |-
      In dit besluit wordt verstaan onder:

      a. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref1];

      b. Waz: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2];

      c. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];

      d. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref4];

      e. ZW: [Ziektewet][ref5];

      f. verzekerde: de verzekerde in de zin van de [ZW][ref6], de [Wet WIA][ref7] of de [WAO][ref8];

      g. jonggehandicapte: de jonggehandicapte, bedoeld in de [artikelen 1a:1][ref9], [2:3][ref10] en
      [3:2 van de Wajong][ref11];

      h. aangiftetijdvak: aangiftetijdvak, bedoeld in [artikel 1 van het Dagloonbesluit werknemersverzekeringen][ref12];

      i. refertejaar: refertejaar, bedoeld in [artikel 13 van het Dagloonbesluit werknemersverzekeringen][ref13];

      j. maatgevende arbeid: uitgeoefende arbeid door gezonde personen met soortgelijke opleiding en ervaring,
      als bedoeld in [artikel 18, eerste lid, van de WAO][ref14], de [artikelen 2:2, eerste lid][ref15],
      en [3:1, eerste lid, van de Wajong][ref16], [artikel 19aa, vijfde lid, van de ZW][ref17], en in
      [artikel 1, onder maatmaninkomen, van de Wet WIA][ref18];

      k. loondervingsuitkeringen:

      1°. uitkeringen op grond van de [Werkloosheidswet][ref19];

      2°. uitkeringen op grond van de [Ziektewet][ref20];

      3°. hetgeen wordt genoten op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref21] of de bezoldiging
      op grond van [artikel 76a van de Ziektewet][ref22];

      4°. uitkeringen op grond van de [artikelen 6][ref23], [51][ref24] en
      [131 van de Algemene pensioenwet politieke ambtsdragers][ref25];

      5°. uitkeringen bij ziekte of werkloosheid op grond van een regeling welke geldt voor personen die op
      grond van [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Ziektewet][ref26] onderscheidenlijk
      [artikel 6, eerste lid, onderdeel a of onderdeel b, van de Werkloosheidswet][ref27], niet ingevolge
      [die wet][ref28] verzekerd zijn;

      6°. een uit een dienstbetrekking voortvloeiende periodieke uitkering bij wijze van oudedagsvoorziening, dan wel
      een uitkering die voorafgaat aan die uitkering of het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref29];

      7°. uitkeringen op grond van de wetgeving van Aruba, Curaçao, Sint Maarten, of van Nederland ten behoeve van de
      openbare lichamen Bonaire, Sint Eustatius en Saba, een andere Mogendheid of een volkenrechtelijke organisatie die
      naar aard en strekking overeenkomen met de uitkeringen, bedoeld onder 1° tot en met 6°;

      8°. uitkeringen en inkomensvoorzieningen op grond van de [Wet WIA][ref30], de [WAO][ref31], de [Waz][ref32] en de
      [Wajong][ref33] en arbeidsongeschiktheidsuitkeringen, die daarmee naar hun strekking overeenkomen;

      l. minimumloon per uur: het bedrag, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref34].


