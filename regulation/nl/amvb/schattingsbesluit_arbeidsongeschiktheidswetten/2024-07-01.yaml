    text: |-
      1 Het arbeidsdeskundig onderzoek strekt tot vaststelling van:

      a. de mate van arbeidsongeschiktheid, bedoeld in [artikel 18 van de WAO][ref1], zoals dit artikel luidt sinds
      1 augustus 1993, [artikel 2 van de Waz][ref2] en [artikel 3:1 van de Wajong][ref3];

      b. volledige en duurzame arbeidsongeschiktheid als bedoeld in [artikel 2:5, eerste lid, van de Wajong][ref4];

      c. duurzaam geen mogelijkheden tot arbeidsparticipatie hebben als bedoeld in de [artikelen 1a:1][ref5],
      [3:8a][ref6] en [8:10b van de Wajong][ref7];

      d. volledige arbeidsongeschiktheid als bedoeld in [artikel 4 van de Wet WIA][ref8]; of

      e. de mate van gedeeltelijke arbeidsongeschiktheid, bedoeld in [artikel 5 van de Wet WIA][ref9], en de beoordeling
      van wat iemand met arbeid kan verdienen, bedoeld in [artikel 2:5, eerste lid, van de Wajong][ref10], en
      [artikel 19aa, eerste lid, onderdeel b, van de ZW][ref11].

      2 Bij het onderzoek, bedoeld in het eerste lid, onderdelen a, d en e, wordt het maatmaninkomen per uur van
      betrokkene vergeleken met hetgeen hij met arbeid kan verdienen.


