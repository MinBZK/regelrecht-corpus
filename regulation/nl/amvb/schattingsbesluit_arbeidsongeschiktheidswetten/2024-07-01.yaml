  - number: 9a
    text: |-
      1 In afwijking van [artikel 5, tweede lid][ref1], wordt bij het onderzoek tot vaststelling van volledige
      arbeidsongeschiktheid of de mate van gedeeltelijke arbeidsgeschiktheid als bedoeld in [artikelen 4][ref2] en
      [5 van de Wet WIA][ref3], het maatmaninkomen per uur vergeleken met de inkomsten uit arbeid die door de betrokkene
      na het intreden van de arbeidsongeschiktheid feitelijk wordt verricht.

      2 Onder arbeid als bedoeld in het eerste lid wordt mede verstaan arbeid die na het intreden van de
      arbeidsongeschiktheid feitelijk is verricht en waartoe de betrokkene met zijn krachten en bekwaamheden in staat
      is, mits van die arbeid bij eerder onderzoek tot vaststelling van volledige arbeidsongeschiktheid of de mate van
      gedeeltelijke arbeidsgeschiktheid als bedoeld in [artikelen 4][ref4] en [5 van de Wet WIA][ref5] is uitgegaan.

      3 In afwijking van [artikel 3, derde lid][ref6], stelt de verzekeringsarts vast of de betrokkene voor de feitelijk
      verrichte arbeid belastbaar is.

      4 Indien de betrokkene met de feitelijk verrichte arbeid ten hoogste 20% van het maatmaninkomen per uur verdient of
      heeft verdiend, wordt het onderzoek alsnog verricht met toepassing van [artikel 5, tweede lid][ref7]. Het derde lid
      is op dat onderzoek niet van toepassing. Van de feitelijk verrichte arbeid wordt slechts uitgegaan, indien daarmee
      sprake is van een lagere mate van arbeidsongeschiktheid dan de met toepassing van [artikel 9, onderdeel a][ref8],
      en [artikel 10][ref9] vastgestelde mate van arbeidsongeschiktheid.

      5 Op de betrokkene van wie de mate van arbeidsongeschiktheid, bedoeld in de [Wet WIA][ref10], voor de eerste maal
      is vastgesteld op een datum gelegen vóór inwerkingtreding van artikel I, onderdeel B van het Besluit van 19 juni
      2024 tot wijziging van het Schattingsbesluit arbeidsongeschiktheidswetten in verband met tijdelijke regels over
      het beoordelen van arbeidsongeschiktheid bij feitelijke arbeid, is artikel 9a, zoals dat luidt na inwerkingtreding
      van dat besluit, eerst van toepassing bij gelegenheid van beoordeling van de mate van arbeidsongeschiktheid die
      betrekking heeft op een datum gelegen na de inwerkingtreding van dat besluit, ter zake waarvan een beschikking
      wordt afgegeven.

      6 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


