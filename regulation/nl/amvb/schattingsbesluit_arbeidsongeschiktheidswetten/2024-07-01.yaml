  - number: 10a
    text: |-
      1 Dit artikel is van toepassing bij de uitvoering van de [artikelen 44, eerste lid, van de WAO][ref1] of
      [58, eerste lid, van de Waz][ref2], indien er sprake is van loon als bedoeld in het tweede lid van de genoemde
      artikelen.

      2 De [artikelen 9][ref3] en [10][ref4] zijn niet van toepassing.

      3 Het maatmaninkomen per uur, bedoeld in hoofdstuk 2, paragraaf 1, wordt herleid naar een maatmaninkomen per
      aangiftetijdvak. Dit gebeurt door het maatmaninkomen per uur te vermenigvuldigen met:

      a. de urenomvang per week van de maatgevende arbeid en het quotiënt van 52,2 en 12, indien het aangiftetijdvak een
      kalendermaand betreft; of

      b. de urenomvang per week van de maatgevende arbeid en 4, indien het aangiftetijdvak vier weken betreft.

      4 Het arbeidsongeschiktheidspercentage wordt als volgt berekend:

      (M–L) / M * 100%

      Hierbij staat

      L voor het loon, bedoeld in de [artikelen 44, tweede lid, van de WAO][ref5] en [58, tweede lid, van de Waz][ref6],
      per aangiftetijdvak; en

      M voor het maatmaninkomen zoals berekend op grond van het derde lid.


