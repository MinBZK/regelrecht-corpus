  - number: '4'
    text: |-
      1 Het verzekeringsgeneeskundig onderzoek voldoet aan de volgende vereisten:

      a. de gebruikte onderzoeksmethoden, argumentatie, bevindingen en conclusies van het verzekeringsgeneeskundig
      onderzoek worden schriftelijk vastgelegd;

      b. een door een andere verzekeringsarts uitgevoerd verzekeringsgeneeskundig onderzoek zal tot dezelfde bevindingen
      en conclusies kunnen leiden;

      c. de redeneringen en conclusies van het verzekeringsgeneeskundig onderzoek zijn vrij van innerlijke tegenspraak.

      2 De vaststellingen en het onderzoek, bedoeld in [artikel 3][ref1], geschieden aan de hand van algemeen aanvaarde
      verzekeringsgeneeskundige onderzoeksmethoden die gericht zijn op het kunnen vaststellen van ongeschiktheid tot
      werken als gevolg van ziekte, gebrek, zwangerschap of bevalling.


      [ref1]: https://wetten.overheid.nl/BWBR0011478#Artikel3
