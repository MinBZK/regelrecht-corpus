  - number: 12a
    text: |-
      1 De [artikelen 2][ref1], [6][ref2], [9][ref3], [10][ref4] en [11][ref5], zoals die luidden op de
      dag voor inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit
      arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de introductie van een
      maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434), blijven van toepassing op een recht op uitkering
      met een ingangsdatum voor of op die dag indien betrokkene voor of op 1 juli 1959 is geboren.

      2 In afwijking van het eerste lid is [artikel 9, onderdeel a, laatste zin][ref6], van toepassing op een recht op
      uitkering als bedoeld in het eerste lid van de betrokkene die voor of op 1 juli 1959 is geboren.

      3 Onverminderd het eerste lid alsmede [artikel 13, tweede lid][ref7], zijn op personen, wier mate van
      arbeidsongeschiktheid voor de eerste maal is vastgesteld op een datum gelegen vóór inwerkingtreding van het
      besluit van 18 augustus 2004 tot wijziging van het Schattingsbesluit arbeidsongeschiktheidswetten met betrekking
      tot de te duiden functies alsmede in verband met de introductie van een maatmaninkomensgarantie en enkele andere
      onderwerpen (Stb. 434), de [artikelen 2][ref8], [6][ref9], [8][ref10], [9][ref11],[10][ref12] en [11][ref13],
      zoals deze luiden na inwerkingtreding van dat besluit, eerst van toepassing indien een beoordeling van de mate
      van arbeidsongeschiktheid plaatsvindt ter zake waarvan een beschikking wordt afgegeven, bij gelegenheid van die
      beoordeling.

      4 In afwijking van het derde lid is [artikel 6, zesde lid][ref14], niet van toepassing in de gevallen waarin
      [artikel 43a van de WAO][ref15], [artikel 20 van de WAZ][ref16] of [artikel 3:21 van de Wajong][ref17] toepassing
      heeft gevonden voor de datum van inwerkingtreding van het besluit van 18 augustus 2004 tot wijziging van het
      Schattingsbesluit arbeidsongeschiktheidswetten met betrekking tot de te duiden functies alsmede in verband met de
      introductie van een maatmaninkomensgarantie en enkele andere onderwerpen (Stb. 434).


