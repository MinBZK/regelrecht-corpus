  - number: '9'
    text: |-
      Bij bepaling van hetgeen betrokkene nog met arbeid kan verdienen worden de volgende regels in acht genomen:

      a. in aanmerking wordt genomen die algemeen geaccepteerde arbeid waarmee betrokkene per uur het meest kan
      verdienen, waaronder mede wordt begrepen arbeid waarvoor bekwaamheden nodig zijn die algemeen gebruikelijk zijn
      en binnen zes maanden kunnen worden verworven, tenzij betrokkene niet over dergelijke bekwaamheden beschikt en
      als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of gebrek dergelijke bekwaamheden niet
      kan verwerven. Onder deze bekwaamheden worden ten minste verstaan mondelinge beheersing van de Nederlandse taal
      en eenvoudig computergebruik. Deze arbeid wordt nader omschreven in de vorm van ten minste drie verschillende
      in Nederland uitgeoefende functies. Deze functies vertegenwoordigen ieder ten minste drie arbeidsplaatsen. De
      gegevens met betrekking tot de in aanmerking genomen functies, met alle daaraan verbonden specifieke aspecten
      inzake belasting, beloning en opleidingseisen mogen op het moment van de datum waarop de ter gelegenheid van de
      arbeidsongeschiktheidsbeoordeling gegeven beschikking betrekking heeft, niet ouder zijn dan 24 maanden;

      b. bij het bepalen van de urenomvang van de onder a bedoelde functies mogen ook functies
      in aanmerking worden genomen met een omvang groter dan de urenomvang van de door de in
      [artikel 6][ref1], [artikel 1 van de Wet WIA][ref2] of [artikel 19aa, vijfde lid, van de ZW][ref3] bedoelde gezonde
      persoon uitgeoefende arbeid, tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval de
      urenomvang van de onder a bedoelde functies niet meer bedraagt dan dat aantal uren;

      c. arbeid, die door betrokkene alleen kan worden verricht na toepassing van zodanige voorzieningen, dat het
      accepteren van die toepassing in redelijkheid niet van een werkgever kan worden verlangd, blijft bij de toepassing
      van onderdeel a buiten beschouwing;

      d. arbeid, die niet door betrokkene kan worden verricht omdat voor het verrichten van die arbeid een in de wet of
      collectieve arbeidsovereenkomst neergelegde functionele leeftijdsgrens geldt, die door betrokkene is overschreden
      of nog niet is bereikt, blijft bij de toepassing van onderdeel a buiten beschouwing;

      e. indien betrokkene zodanige kenmerken heeft, dat van een werkgever in redelijkheid niet kan worden verlangd hem
      in bepaalde arbeid te werk te stellen, blijft die arbeid bij de toepassing van onderdeel a buiten beschouwing;

      f. bij de toepassing van onderdeel a blijft arbeid die meer dan incidenteel tussen 0.00
      uur en 6.00 uur wordt verricht buiten beschouwing, tenzij de gezonde persoon, bedoeld in
      [artikel 6][ref4], [artikel 1 van de Wet WIA][ref5] of [artikel 19aa, vijfde lid, van de ZW][ref6], in dergelijke
      arbeid werkzaam is;

      g. Indien betrokkene de leeftijd van 21 jaar nog niet heeft bereikt wordt onderdeel a toegepast alsof hij die
      leeftijd heeft bereikt;

      h. in afwijking van onderdeel a wordt uitgegaan van de arbeid die feitelijk wordt verricht, mits dit leidt tot een
      lagere mate van arbeidsongeschiktheid dan de met toepassing van onderdeel a en [artikel 10][ref7] vastgestelde mate
      van arbeidsongeschiktheid;

      i. voor de toepassing van onderdeel h wordt onder arbeid die feitelijk wordt verricht mede verstaan arbeid die
      na het intreden van de arbeidsongeschiktheid feitelijk is verricht en waartoe de betrokkene met zijn krachten en
      bekwaamheden in staat is.


