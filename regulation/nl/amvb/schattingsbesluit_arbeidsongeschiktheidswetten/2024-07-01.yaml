        artikel: '8'
  - number: 1a
    text: |-
      1 Betrokkene heeft geen mogelijkheden tot arbeidsparticipatie als bedoeld in de [artikelen 1a:1, eerste lid][ref1],
      [2:4, eerste lid][ref2], en [3:8a, eerste lid, van de Wajong][ref3], indien hij:

      a. geen taak kan uitvoeren in een arbeidsorganisatie;

      b. niet over basale werknemersvaardigheden beschikt;

      c. niet aaneengesloten kan werken gedurende ten minste een periode van een uur; of

      d. niet ten minste vier uur per dag belastbaar is, tenzij hij ten minste twee uur per dag belastbaar is en in staat
      is per uur ten minste een bedrag te verdienen dat gelijk is aan het minimumloon per uur.

      2 Een taak als bedoeld in het eerste lid, onderdeel a, is de kleinste eenheid van een functie en bestaat uit één of
      meerdere handelingen.

      3 Bij ministeriële regeling kunnen met betrekking tot het eerste lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1a1
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel38a
