  - number: 11a
    text: |-
      1 Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 7a][ref1], en van de feitelijke inkomsten
      uit arbeid, bedoeld in [artikel 10, zesde lid][ref2], wordt het in de relevante aangiftetijdvakken
      opgebouwde bedrag aan vakantiebijslag en extra periodiek salaris op de wijze als is bepaald in
      [artikel 3, eerste lid, van het Besluit dagloonregels werknemersverzekeringen][ref3] in aanmerking genomen.

      2 Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 7a][ref4], en van de feitelijke inkomsten
      uit arbeid, bedoeld in [artikel 10, zesde lid][ref5], wordt niet in aanmerking genomen het in de relevante
      aangiftetijdvakken betaalde bedrag aan vakantiebijslag en extra periodiek salaris, op de wijze als bepaald is in
      [artikel 3, eerste lid, van het Besluit dagloonregels werknemersverzekeringen][ref6].


