  - number: '8'
    text: |-
      1 Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1], en
      [artikel 1 van de Wet WIA][ref2], worden het inkomen, de inkomsten uit arbeid en de verdiensten, bedoeld
      [artikel 7, eerste lid][ref3], die bij toepassing van [artikel 7a][ref4] in aanmerking worden genomen, vanaf
      het begin van het eerste in aanmerking genomen aangiftetijdvak aangepast aan de eerst-gepubliceerde cijfers
      van de index van de CAO-lonen per uur inclusief bijzondere beloningen, zoals die uiterlijk ten tijde van het
      arbeidsdeskundige onderzoek, bedoeld in [artikel 5][ref5], door het Centraal Bureau voor de Statistiek wordt
      gepubliceerd.

      2 Nadat een eerste beoordeling in verband met de vaststelling, bedoeld in [artikel 5][ref6], heeft plaatsgevonden,
      wordt bij een hernieuwde vaststelling, een heropening, een herleving of een herziening van de uitkering geen
      rekening gehouden met na die eerste beoordeling opgetreden wijzigingen in het maatmaninkomen, met dien verstande
      dat bij de hernieuwde vaststelling van de mate van arbeidsongeschiktheid het maatmaninkomen wordt aangepast
      aan de eerst-gepubliceerde cijfers van de index van de CAO-lonen per uur inclusief bijzondere beloningen, zoals
      dit uiterlijk ten tijde van het arbeidsdeskundige onderzoek door het Centraal Bureau voor de Statistiek wordt
      gepubliceerd.

      3 In gevallen waarin het maatmaninkomen voor het laatst is vastgesteld voor 1 januari 2001 vindt bij
      de eerstvolgende vaststelling van de mate van arbeidsongeschiktheid na deze datum naast de aanpassing,
      bedoeld in het tweede lid, eenmalig een extra verhoging van het maatmaninkomen plaats overeenkomstig
      [artikel 3 van de Wet brutering overhevelingstoeslag lonen][ref7].


