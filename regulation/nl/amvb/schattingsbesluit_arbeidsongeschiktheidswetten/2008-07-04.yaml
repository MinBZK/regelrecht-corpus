  - number: 12b
    text: |-
      1 Op de persoon die voor 1 juli 2008 recht had op een uitkering op grond van de [WAO][ref1], [Waz][ref2],
      [Wajong][ref3] of [Wet WIA][ref4] worden, onverminderd [artikel 8, tweede lid][ref5], de [artikelen 7][ref6] en
      [7a][ref7] slechts toegepast, indien de maatgevende arbeid die bepalend is voor het maatmaninkomen, na 1 juli 2008
      is gewijzigd, waarbij deze artikelen voor de uitkering op grond van de [Waz][ref8] van overeenkomstige toepassing
      zijn.

      2 Indien het inkomen, de inkomsten uit arbeid en de verdiensten, bedoeld in [artikel 7][ref9], betrekking
      hebben op aangiftetijdvakken, die zijn gelegen voor 1 januari 2006, wordt voor de bepaling van het inkomen,
      de inkomsten uit arbeid of de verdiensten uitgegaan van het loon waarnaar de premies met toepassing van de
      [Coördinatiewet Sociale Verzekering][ref10], met uitzondering van [artikel 9 van die wet][ref11], zoals
      [die wet][ref12] luidde ten tijde van die aangiftetijdvakken, zou zijn geheven. Hierbij wordt geen rekening
      gehouden met het betaalde bedrag aan vakantiebijslag en periodieke loonelementen, maar met een evenredig deel van
      de vakantiebijslag en periodieke loonelementen.

      3 Tot 1 juli 2010 is [artikel 10, vijfde lid][ref13], niet van toepassing op niet door het Uitvoeringsinstituut
      werknemersverzekeringen geactualiseerde functies, die worden gebruikt bij de bepaling van hetgeen betrokkene nog
      met arbeid kan verdienen als bedoeld in de [artikelen 9][ref14] en [10][ref15].

      4 Op de persoon die op 30 juni 2008 recht had op uitkering op grond van de [WAO][ref16], [Waz][ref17],
      [Wajong][ref18] of [Wet WIA][ref19], en inkomsten uit arbeid had, wordt [artikel 10, zesde lid][ref20], pas van
      toepassing, indien na 30 juni 2008 een onderzoek plaatsvindt als bedoeld in [artikel 5][ref21] bij gelegenheid van
      dat onderzoek.


