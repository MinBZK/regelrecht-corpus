  - number: '6'
    text: |-
      1 Het maatmaninkomen WAO is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 18, eerste lid, van de WAO][ref1], met arbeid gewoonlijk verdienen.

      2 Het maatmaninkomen Waz is het inkomen per uur dat gezonde personen, bedoeld in
      [artikel 2, eerste lid, van de Waz][ref2], met arbeid als verzekerde, bedoeld in [artikel 3 van de Waz][ref3]
      gewoonlijk verdienen.

      3 Het maatmaninkomen Wajong is voor de jonggehandicapte die:

      a. geen inkomsten uit arbeid geniet, 108% van het bedrag dat voor een werknemer van dezelfde leeftijd geldt als
      minimumloon per uur op grond van de [Wet minimumloon en minimumvakantiebijslag][ref4];

      b. inkomsten uit arbeid geniet, het inkomen dat een niet-jonggehandicapt persoon van dezelfde leeftijd met de door
      de jonggehandicapte feitelijk verrichte arbeid gedurende de normale, volledige werkweek, per uur zou verdienen.

      4 Het maatmaninkomen van de jonggehandicapte, bedoeld in het derde lid, wordt hoger gesteld, en ten minste op een
      bedrag gelijk aan anderhalf maal het bedrag dat voor de belanghebbende geldt als minimumloon per uur op grond van
      de [Wet minimumloon en minimumvakantiebijslag][ref5], indien de jonggehandicapte:

      a. arbeidsongeschikt is geworden binnen een jaar onmiddellijk voorafgaande aan het behalen van een diploma, dan
      wel na het behalen van een diploma, aan een beroepsgerichte opleiding die opleidt voor een beroep waarvan het
      aanvangssalaris ten minste gelijk is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd
      geldt als minimumloon op grond van de [Wet minimumloon en minimumvakantiebijslag][ref6];

      b. tijdens de arbeidsongeschiktheid doch uiterlijk op de dag dat hij de leeftijd van 30 jaar bereikt, een diploma
      behaalt van een beroepsgerichte opleiding die opleidt voor een beroep waarvan het aanvangssalaris ten minste gelijk
      is aan anderhalf maal het bedrag dat voor een werknemer van dezelfde leeftijd geldt als minimumloon op grond van de
      [Wet minimumloon en minimumvakantiebijslag][ref7].

      5 Indien de vaststelling van het maatmaninkomen met toepassing van het vierde lid tot een hoger maatmaninkomen
      leidt dan de vaststelling van het maatmaninkomen met toepassing van het derde lid, wordt uitgegaan van het
      eerstgenoemde maatmaninkomen.

      6 In de gevallen waarin [artikel 43a van de WAO][ref8], [artikel 19 van de Wajong][ref9],
      [artikel 48, eerste lid, aanhef en onderdelen b en c][ref10], [50, eerste lid, aanhef en onderdeel b][ref11],
      of [55, eerste lid, aanhef en onderdelen b en c, van de Wet WIA][ref12] toepassing vindt, alsmede in de
      gevallen waarin dat niet het geval is omdat [artikel 29b van de Ziektewet][ref13] toepassing kan vinden,
      wordt het maatmaninkomen niet lager vastgesteld dan het maatmaninkomen dat voor de vaststelling van de mate
      van arbeidsongeschiktheid of mate van gedeeltelijke arbeidsgeschiktheid in aanmerking zou worden genomen
      indien de uitkering niet zou zijn ingetrokken, dan wel indien aan het einde van de wachttijd, bedoeld in
      [artikel 19 van de WAO][ref14], [artikel 6 van de Wajong][ref15] of [artikel 23 van de Wet WIA][ref16], recht zou
      hebben bestaan op een dergelijke uitkering.

      7 In de gevallen waarin, na eerdere intrekking van een uitkering op grond van de [WAO][ref17], de [Wajong][ref18]
      of de [Wet WIA][ref19], dan wel na het eerder niet toekennen van een uitkering aan het einde van de wachttijd,
      bedoeld in [artikel 19 van de WAO][ref20], [artikel 6 van de Wajong][ref21] of [artikel 23 van de Wet WIA][ref22],
      bij de vaststelling van het maatmaninkomen wordt uitgegaan van arbeid op basis waarvan voor de betrokkene reeds
      eerder een maatmaninkomen is vastgesteld, wordt het maatmaninkomen vastgesteld op het maatmaninkomen dat voor de
      vaststelling van de mate van arbeidsongeschiktheid of mate van gedeeltelijke arbeidsgeschiktheid in aanmerking
      zou worden genomen indien de uitkering niet zou zijn ingetrokken, dan wel indien aan het einde van de genoemde
      wachttijd recht zou hebben bestaan op een dergelijke uitkering.


