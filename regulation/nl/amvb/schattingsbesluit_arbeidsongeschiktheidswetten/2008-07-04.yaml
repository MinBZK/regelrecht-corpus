  - number: '11'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de berekening van het
      maatmaninkomen en de resterende verdiencapaciteit ten behoeve van de vaststelling, bedoeld in [artikel 5][ref1].
      Daarbij kan worden bepaald wat mede wordt verstaan onder bekwaamheden die algemeen gebruikelijk zijn en binnen zes
      maanden kunnen worden verworven als bedoeld in [artikel 9, onderdeel a][ref2].


