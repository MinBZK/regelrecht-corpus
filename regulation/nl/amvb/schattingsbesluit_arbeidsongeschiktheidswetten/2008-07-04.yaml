  - number: '7'
    text: |-
      1 Bij de vaststelling van het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1], en in
      [artikel 1 van de Wet WIA][ref2], worden het inkomen, de inkomsten uit arbeid en de verdiensten van de gezonde of
      de niet-jonggehandicapte persoon bepaald door van de verzekerde of de jonggehandicapte in aanmerking te nemen:

      a. het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref3] voor de werknemer in de
      zin van [die wet][ref4];

      b. het loon in de zin van de [Wet op de loonbelasting 1964][ref5], voor zover de verzekerde of de jonggehandicapte
      niet als werknemer als bedoeld in onderdeel a inkomen verdient;

      c. het belastbaar loon of het belastbaar resultaat uit overige werkzaamheden, bedoeld in [paragraaf 3.3.1][ref6],
      onderscheidenlijk [paragraaf 3.4.1 van de Wet inkomstenbelasting 2001][ref7], behoudens voor zover het
      een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref8], en
      [artikel 3.92 van die wet][ref9], voor zover de verzekerde of de jonggehandicapte geen werknemer is als bedoeld in
      de onderdelen a en b;

      d. de belastbare winst uit onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref10],
      vermeerderd met de ondernemersaftrek, bedoeld in [artikel 3.74 van die wet][ref11] en vermeerderd met de MKB-
      winstvrijstelling, bedoeld in [artikel 3.79a van die wet][ref12], met dien verstande dat de bestanddelen van
      de winst, bedoeld in [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref13], niet geacht worden te
      behoren tot de winst.

      2 Indien de berekening van het resultaat uit overige werkzaamheden, bedoeld in het eerste lid, onderdeel
      c, of de winst, bedoeld in het eerste lid, onderdeel d, leidt tot een negatief bedrag, wordt het resultaat,
      onderscheidenlijk de winst op nihil gesteld.

      3 In afwijking van het eerste lid, onderdelen a en b, wordt voor de vaststelling van het maatmaninkomen, bedoeld
      in [artikel 6, eerste en derde lid][ref14], en in [artikel 1 van de Wet WIA][ref15] niet als inkomen, inkomsten uit
      arbeid of verdiensten in aanmerking genomen:

      a. het loon uit vroegere dienstbetrekking in de zin van de [Wet op de loonbelasting 1964][ref16];

      b. loondervingsuitkeringen, alsmede de door de werkgever betaalde aanvullingen op die uitkeringen;

      c. een vergoeding voor de inkomensafhankelijke bijdrage als bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref17];

      d. de eindheffingsbestanddelen als bedoeld in
      [artikel 31, eerste lid, onderdelen b tot en met h, van de Wet op de loonbelasting 1964][ref18].


