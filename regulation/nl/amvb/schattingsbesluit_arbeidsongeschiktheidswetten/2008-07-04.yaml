articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref1];

      b. Waz: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2];

      c. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];

      d. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref4];

      e. verzekerde: de verzekerde in de zin van de [Wet WIA][ref5] of de [WAO][ref6];

      f. jonggehandicapte: de jonggehandicapte, bedoeld in [artikel 5 van de Wajong][ref7];

      g. aangiftetijdvak: aangiftetijdvak, bedoeld in
      [artikel 1 van het Besluit dagloonregels werknemersverzekeringen][ref8];

      h. refertejaar: refertejaar, bedoeld in [artikel 1 van het Besluit dagloonregels werknemersverzekeringen][ref9];

      i. maatgevende arbeid: uitgeoefende arbeid door gezonde personen met soortgelijke opleiding en ervaring, als
      bedoeld in [artikel 18, eerste lid, van de WAO][ref10], [artikel 2, eerste lid, van de Wajong][ref11], en in
      [artikel 1, onder maatmaninkomen, van de Wet WIA][ref12];

      j. loondervingsuitkeringen: loondervingsuitkeringen, bedoeld in [artikel 1 van het Inkomensbesluit Wet WIA][ref13],
      alsmede de uitkeringen op grond van de [Wet WIA][ref14], de [WAO][ref15], de [Waz][ref16] en de [Wajong][ref17] en
      arbeidsongeschiktheidsuitkeringen, die daarmee naar hun strekking overeenkomen.


