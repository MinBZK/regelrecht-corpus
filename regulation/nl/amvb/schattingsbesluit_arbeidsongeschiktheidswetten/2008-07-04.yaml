  - number: 7a
    text: |-
      1 Het maatmaninkomen, bedoeld in [artikel 6, eerste en derde lid][ref1], en [artikel 1 van de Wet WIA][ref2],
      wordt vastgesteld door het loon, bedoeld in [artikel 7, eerste lid, onderdelen a en b][ref3], dat de verzekerde of
      de jonggehandicapte met de maatgevende arbeid in het refertejaar heeft verdiend te delen door het aantal uren van
      die maatgevende arbeid in het refertejaar, waarbij het loon geacht wordt te zijn genoten in het aangiftetijdvak
      waarover de werkgever of de inhoudingsplichtige van dat loon opgave heeft gedaan.

      2 Bij de toepassing van het eerste lid worden het loon verdiend met maatgevende arbeid en het aantal uren van de
      maatgevende arbeid in volledige aangiftetijdvakken in aanmerking genomenen worden daarbij de aangiftetijdvakken
      buiten beschouwing gelaten waarin geen sprake is van maatgevende arbeid van de verzekerde of de jonggehandicapte of
      waarin sprake is van arbeid in een urenomvang die niet maatgevend is.

      3 Het Uitvoeringsinstituut werknemersverzekeringen stelt een andere periode van maximaal één jaar vast waarover het
      inkomen en het aantal uren van de maatgevende arbeid in aanmerking worden genomen, indien in het refertejaar geen
      sprake is van maatgevende arbeid of van arbeid van een urenomvang die maatgevend is.

      4 Indien de verzekerde of de jonggehandicapte feitelijk geen inkomen heeft verdiend met maatgevende arbeid of
      arbeid van een urenomvang die maatgevend is, neemt het Uitvoeringsinstituut werknemersverzekeringen het inkomen
      in aanmerking, dat de verzekerde of de jonggehandicapte zou hebben verdiend, indien hij de maatgevende arbeid of
      arbeid in de urenomvang die maatgevend is, zou hebben verricht, alsmede het aantal uren van die arbeid.

      5 Het Uitvoeringsinstituut werknemersverzekeringen kan loon in aanmerking nemen, waarvan geen opgave is gedaan
      in de aangiftetijdvakken in het refertejaar, indien de verzekerde aantoont, dat hij daarop wel recht had in die
      aangiftetijdvakken.


