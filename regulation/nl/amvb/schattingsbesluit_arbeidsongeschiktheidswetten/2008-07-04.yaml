  - number: '10'
    text: |-
      1 Bij de berekening van hetgeen betrokkene met arbeid kan verdienen, wordt:

      a. uitgegaan van de urenomvang van de arbeid, die bij de toepassing van [artikel 7][ref1] en [7a][ref2] in
      aanmerking wordt genomen, tenzij betrokkene voor een geringer aantal uren belastbaar is, in welk geval van dit
      aantal wordt uitgegaan; en

      b. in aanmerking genomen het loon van de middelste van de in [artikel 9, onderdeel a][ref3], bedoelde functies.

      2 Indien betrokkene de leeftijd van 23 jaar nog niet heeft bereikt wordt het inkomen per uur dat hij na
      toepassing van het eerste lid met arbeid kan verdienen verlaagd door het te vermenigvuldigen met het het
      minimumloonpercentage, bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref4],
      tenzij wordt uitgegaan van feitelijke inkomsten uit arbeid.

      3 Indien het inkomen per uur dat betrokkene na toepassing van het eerste en tweede lid met arbeid kan verdienen,
      meer bedraagt dan zijn maatmaninkomen per uur, wordt hetgeen hij met arbeid kan verdienen niet hoger gesteld dan
      zijn maatmaninkomen per uur.

      4 Het derde lid vindt geen toepassing:

      a. indien wordt uitgegaan van de feitelijke inkomsten uit arbeid; of

      b. indien betrokkene nog tot arbeid in dezelfde omvang in staat is als de in [artikel 6][ref5] bedoelde gezonde
      persoon.

      5 Voor zover het niet gaat om feitelijke inkomsten uit arbeid, wordt onder het loon, bedoeld in dit artikel,
      verstaan: het loon in de zin van [artikel 16 van de Wet financiering sociale verzekeringen][ref6] voor de werknemer
      in de zin van die wet, dat voor de desbetreffende functie gebruikelijk is. Hierbij wordt geen rekening gehouden met
      incidentele loonbestanddelen of loonbestanddelen die op de persoon van de werknemer betrekking hebben.

      6 De feitelijke inkomsten uit arbeid in dit artikel worden vastgesteld door hetgeen daarvoor op grond van
      [artikel 7][ref7] in aanmerking wordt genomen.


