  - number: '2'
    text: |-
      Dit besluit is van toepassing met betrekking tot schepen die zich bevinden op de voor het openbare
      scheepvaartverkeer openstaande binnenwateren, daaronder begrepen de daarin aanwezige waterstaatswerken.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel2
  - number: '3'
    text: |-
      In afwijking van [artikel 2][ref1] is dit besluit niet van toepassing op bij regeling van Onze Minister aangewezen
      vaartuigen, voor zover in die regeling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel2
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '4'
    text: |-
      Het is verboden scheepsafvalstoffen dan wel delen van de lading vanaf een schip in een oppervlaktewaterlichaam te
      brengen, behoudens voorzover elders in dit besluit anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel4
  - number: '5'
    text: |-
      Het verbod, bedoeld in [artikel 4][ref1], is niet van toepassing ten aanzien van het in een oppervlaktewaterlichaam
      brengen van overslagresten, restlading, ladingrestanten dan wel afvalwater dat ladingrestanten bevat vanaf schepen
      die bestemd zijn voor andere diensten dan goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '6'
    text: |-
      1 Indien vanaf een schip scheepsafvalstoffen dan wel delen van de lading in een oppervlaktewaterlichaam geraken of
      dreigen te geraken, waarschuwt de schipper onverwijld de dichtstbijzijnde bevoegde autoriteit, tenzij het een geval
      betreft als bedoeld in [artikel 4][ref1], laatste zinsnede, of [artikel 5][ref2].

      2 Bij de toepassing van het eerste lid geeft de schipper de plaats van het voorval alsmede de hoeveelheid en de
      aard van de afvalstoffen of de lading zo nauwkeurig mogelijk aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel5
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '7'
    text: Het is verboden scheepsafvalstoffen aan boord van een schip te verbranden.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel7
  - number: '8'
    text: |-
      De exploitant van een schip dat niet onder het gezag van een schipper staat, neemt met betrekking tot dat schip de
      tot de schipper gerichte voorschriften van dit besluit in acht.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel8
  - number: '9'
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot gemotoriseerde schepen, indien in een of meer van de motoren
      gasolie wordt verbruikt.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel9
  - number: '10'
    text: |-
      Dit hoofdstuk, met uitzondering van [paragraaf 2.6][ref1], is niet van toepassing met betrekking tot zeeschepen,
      ook voor zover die zich bevinden op andere wateren dan bedoeld in [artikel 3, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel3
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '2'
        paragraaf: '2.6'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '11'
    text: |-
      De schipper draagt er zorg voor dat bilgewater en overige olie- en vethoudende scheepsafvalstoffen aan boord in
      de bilge van de machinekamer, onderscheidenlijk gescheiden in de daarvoor bestemde verzamelreservoirs, worden
      verzameld en bewaard.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel11
  - number: '12'
    text: |-
      1 De in [artikel 11][ref1] bedoelde verzamelreservoirs worden aan boord zo aangebracht dat lekkage gemakkelijk en
      tijdig opgemerkt en gestopt kan worden.

      2 Voor de opslag van afgewerkte olie worden geen los aan dek staande verzamelreservoirs gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel11
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '13'
    text: |-
      1 Het is verboden reinigingsmiddelen die olie of vet oplossen dan wel emulgerend zijn in de bilge van de
      machinekamer dan wel in het bilgewater te doen geraken.

      2 Van het verbod, bedoeld in het eerste lid, zijn uitgezonderd reinigingsmiddelen die de verwerking van het
      bilgewater niet bemoeilijken.

      3 Bij regeling van Onze Minister kunnen reinigingsmiddelen als bedoeld in het eerste of tweede lid worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel13
  - number: '14'
    text: |-
      1 De schipper draagt er zorg voor dat een geldig olie-afgifteboekje aan boord aanwezig is.

      2 Een olie-afgifteboekje wordt op aanvraag verstrekt door een dienst of instelling, aangewezen door Onze Minister.

      3 Het model van het olie-afgifteboekje wordt vastgesteld bij regeling van Onze Minister.

      4 Na verkrijging van een nieuw olie-afgifteboekje wordt het voorgaande olie-afgifteboekje ten minste zes maanden na
      de datum van de laatste daarin opgenomen vermelding van een afgifte aan boord bewaard.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel14
  - number: '15'
    text: |-
      1 De schipper biedt olie- en vethoudende scheepsafvalstoffen tijdig aan bij een ontvangstvoorziening.

      2 De schipper legt bij een afgifte als bedoeld in het eerste lid het olie-afgifteboekje voor aan degene die de
      ontvangstvoorziening drijft of een door deze aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel15
  - number: '16'
    text: |-
      Degene die een inrichting voor het inzamelen van scheepsafvalstoffen drijft, draagt er zorg voor dat de ingevolge
      [artikel 15][ref1] aangeboden olie- en vethoudende scheepsafvalstoffen worden ingenomen in die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17'
    text: |-
      Het in ontvangst nemen van olie- en vethoudende scheepsafvalstoffen wordt bevestigd door invulling en ondertekening
      van de eerste niet ingevulde bladzijde van het door de schipper ingevolge [artikel 15][ref1] overgelegde olie-
      afgifteboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '18'
    text: |-
      Nadat gevolg is gegeven aan [artikel 17][ref1], ondertekent de schipper de desbetreffende bladzijde van het olie-
      afgifteboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel17
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '19'
    text: |-
      1 Met het oog op de toepassing van [artikel 20, eerste lid][ref1], is de eigenaar van een schip verplicht:

      a. een rekening bij een nationaal instituut als bedoeld in artikel 9 van het verdrag te openen, en

      b. zorg te dragen dat de schipper de beschikking heeft over de ED-kaart.

      2 Onze Minister kan nadere regels met betrekking tot de vormgeving en andere kenmerken van de ED-kaart stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel20
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '20'
    text: |-
      1 Ter gelegenheid van het betrekken van gasolie ten behoeve van een schip wordt de door de eigenaar van een schip
      verschuldigde afvalbeheersbijdrage over het betrokken aantal liters gasolie betaald met behulp van de ED-kaart op
      een bij regeling van Onze Minister te bepalen wijze.

      2 De ED-kaart wordt gebruikt in het geval dat:

      a. het tegoed voldoende is om de verschuldigde afvalbeheersbijdrage te betalen,

      b. het tegoed niet negatief maar ontoereikend is om de verschuldigde verwijderingsbijdrage te betalen, of

      c. het tegoed negatief is en het nationaal instituut die de ED-kaart heeft verstrekt toestaat dat de ED-kaart wordt
      gebruikt bij een negatief saldo.

      3 Indien het tweede lid, onderdeel b of c van toepassing is, heft de eigenaar van het schip het tekort op de
      rekening binnen een periode van twee weken na de dag van de bunkering op.

      4 De leverancier draagt er zorg voor dat in tweevoud een betalingsbewijs wordt opgemaakt waarop het nummer
      waaronder het tegoed is geregistreerd, het betrokken aantal liters gasolie, het bedrag van de betaalde
      afvalbeheersbijdrage, de datum en het tijdstip van de bunkering worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel20
  - number: '21'
    text: |-
      1 De leverancier biedt aan de eigenaar van het schip namens het nationaal instituut de mogelijkheid de
      verschuldigde afvalbeheersbijdrage te betalen overeenkomstig de in het tweede en derde lid bepaalde procedure in
      het geval dat:

      a. de schipper niet over de ED-kaart beschikt;

      b. het tegoed negatief is en het nationaal instituut die de ED-kaart heeft verstrekt gebruik bij negatief saldo
      niet toestaat, of

      c. het gebruik van de ED-kaart als gevolg van een storing niet mogelijk is.

      2 De schipper vult in drievoud in namens de eigenaar van het schip:

      a. een schuldbekentenis tot betaling van de verschuldigde afvalbeheersbijdrage in het geval van het eerste lid,
      onderdeel a, of

      b. een machtiging tot incasso van de verschuldigde afvalbeheersbijdrage in het geval van het eerste lid, onderdeel
      b of c.

      3 Na vermelding van het verstrekte aantal liters gasolie door de leverancier in de schuldbekentenis respectievelijk
      de machtiging, ondertekent de schipper namens de eigenaar van het schip dit document.

      4 De eigenaar van het schip stort binnen een periode van twee weken na de dag van bunkering een bedrag op de
      rekening bij het nationaal instituut teneinde de schuld respectievelijk het eventuele tekort op te heffen.

      5 De leverancier zendt de ondertekende schuldbekentenis of machtiging onverwijld aan het nationaal instituut.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel21
  - number: '22'
    text: |-
      1 Ter gelegenheid van een levering van gasolie ten behoeve van een schip wordt door de leverancier een
      schriftelijke bunkerverklaring opgemaakt. Deze verklaring moet ten minste de volgende gegevens bevatten:

      a. de naam en het adres van de eigenaar van het schip;

      b. de naam en het adres van de leverancier;

      c. het geleverde aantal liters, onder vermelding dat het gasolie betreft;

      d. de naam en het nummer van teboekstelling en het land van registratie van het schip;

      e. de naam van de schipper;

      f. de hoogte van de afvalbeheersbijdrage; en

      g. de plaats en datum van handeling.

      2 De leverancier hecht aan de bunkerverklaring:

      a. het betalingsbewijs, bedoeld in [artikel 20, vierde lid][ref1],

      b. de schuldbekentenis, bedoeld in [artikel 21, tweede lid, onderdeel a][ref2], of

      c. de machtiging, bedoeld in [artikel 21, tweede lid, onderdeel b][ref3].

      3 De verklaring wordt door de leverancier ondertekend en ter mede-ondertekening voorgelegd aan de schipper.

      4 Indien een leverancier ter gelegenheid van een levering als bedoeld in het eerste lid ten behoeve van de eigenaar
      van het schip een verklaring als bedoeld in [artikel 19, onderdeel b, van het Uitvoeringsbesluit accijns][ref4]
      opmaakt, neemt hij de bunkerverklaring op in het formulier van die verklaring. In een zodanig geval kan de
      leverancier de bunkerverklaring, in afwijking van het tweede lid, ondertekenen nadat de schipper ingevolge
      [artikel 23][ref5] de verklaring heeft ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel23
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel22
