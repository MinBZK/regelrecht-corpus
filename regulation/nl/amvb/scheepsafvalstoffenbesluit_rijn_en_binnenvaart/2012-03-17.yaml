  - number: '24'
    text: De leverancier stelt aan de schipper een afschrift van de bunkerverklaring ter hand.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel24
  - number: '25'
    text: |-
      De leverancier bewaart een overeenkomstig [artikel 22][ref1] opgemaakte en ondertekende bunkerverklaring in zijn
      bedrijfsadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel22
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '26'
    text: |-
      1 De schipper hecht aan het ingevolge [artikel 24][ref1] ontvangen afschrift van de bunkerverklaring:

      a. het betalingsbewijs, bedoeld in [artikel 20, vierde lid][ref2],

      b. de schuldbekentenis, bedoeld in [artikel 21, tweede lid, onderdeel a][ref3], of

      c. de machtiging, bedoeld in [artikel 21, tweede lid, onderdeel b][ref4].

      2 De schipper bewaart het afschrift, alsmede een door hem ontvangen afschrift van een buiten Nederland opgemaakte
      bunkerverklaring inzake het betrekken van gasolie ten behoeve van het schip, gedurende ten minste zes maanden aan
      boord.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel21
