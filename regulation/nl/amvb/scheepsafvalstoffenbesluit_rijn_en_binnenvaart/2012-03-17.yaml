  - number: '98'
    text: |-
      In afwijking van het bepaalde in [artikel 42][ref1] is tot het tijdstip liggende vijf jaar na het in
      [artikel 101, eerste lid][ref2], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit te bepalen tijdstip,
      toegelaten dat in gevallen waarin ingevolge [artikel 42][ref3] bij het nalossen de losstandaard vacuümschoon zou
      moeten worden bereikt, de losstandaard bezemschoon wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel101
