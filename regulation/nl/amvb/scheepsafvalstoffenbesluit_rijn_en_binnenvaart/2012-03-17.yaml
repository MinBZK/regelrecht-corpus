  - number: '23'
    text: |-
      De schipper ondertekent een overeenkomstig [artikel 22][ref1] opgestelde en aan hem voorgelegde bunkerverklaring en
      stelt deze ter hand aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel22
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel23
