        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '78'
    text: |-
      Het nationaal instituut organiseert een doelmatig en doeltreffend beheer van olie- en vethoudende
      scheepsafvalstoffen, overeenkomstig het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel78
  - number: '79'
    text: |-
      Het nationaal instituut geeft op zodanige wijze uitvoering aan het bepaalde in [artikel 78][ref1] dat:

      a. een voldoende dicht net van ontvangstvoorzieningen, met voldoende capaciteit voor de inzameling van olie- en
      vethoudende scheepsafvalstoffen op de voet van onderdeel b, beschikbaar is langs de Nederlandse vaarwegen, alsmede
      voorzieningen met voldoende capaciteit voor het beheer van op die voet ingezamelde afvalstoffen beschikbaar zijn;

      b. indien olie- en vethoudende scheepsafvalstoffen overeenkomstig [artikel 15][ref2] worden aangeboden bij een
      ontvangstvoorziening als bedoeld onder a, die afvalstoffen aldaar in ontvangst worden genomen zonder dat daarbij
      kosten of vergoedingen in rekening worden gebracht aan de eigenaar of de exploitant van het schip, dan wel de
      schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '80'
    text: |-
      1 Het nationaal instituut houdt een overzicht bij van adressen en verdere bereikbaarheidsgegevens van de in
      [artikel 79][ref1] bedoelde ontvangstvoorzieningen.

      2 Het nationaal instituut verstrekt ter gelegenheid van de verstrekking van een olie-afgifteboekje als bedoeld in
      [artikel 14][ref2] een exemplaar van het overzicht aan de betrokkene.

      3 Het nationaal instituut geeft aan belanghebbenden in de bedrijfstak van de scheepvaart kennis van wijzigingen van
      het overzicht in daartoe geschikte dag- of nieuwsbladen.

      4 Het nationaal instituut zendt een exemplaar van het overzicht en elke wijziging daarvan toe aan het
      internationaal orgaan.

      5 Het nationaal instituut geeft op andere daartoe geschikte wijzen voorlichting over het beheer van olie- en
      vethoudende scheepsafvalstoffen aan belanghebbenden in de bedrijfstak van de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel14
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '79'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '81'
    text: |-
      Het nationaal instituut draagt zorg voor de financiering van het in [artikel 78][ref1] bedoelde beheer uit de
      opbrengst van de afvalbeheersbijdrage en de verevening.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '82'
    text: |-
      1 Ter uitvoering van [artikel 81][ref1] draagt het nationaal instituut zorg voor:

      a. het invoeren en het in stand houden van het door Onze Minister nader te omschrijven digitale systeem voor het
      betalen van de afvalbeheersbijdrage;

      b. het Nederlandse aandeel in de verevening;

      c. het na het openen van een rekening aan de eigenaar van een gemotoriseerd schip, kosteloos namens Onze Minister
      verstrekken van maximaal twee ED-kaarten per schip;

      d. het op verzoek van de leverancier kosteloos verstrekken van een betaalterminal per bunkerfaciliteit; en

      e. de uitvoering van een ministeriële regeling ingevolge [artikel 29][ref2], voor zover het in die regeling is
      bepaald, alsmede voorlichting over die regeling aan belanghebbenden in de bedrijfstak van de scheepvaart.

      2 Het nationaal instituut draagt zorg voor de geheimhouding van de gegevens, die het met betrekking tot de ED-kaart
      onder zich heeft.

      3 Op verzoek van Onze Minister verstrekt het nationaal instituut inzage in het digitale systeem aan een door deze
      minister aangewezen dienst teneinde te onderzoeken of de verschuldigde afvalbeheersbijdrage is betaald.

      4 Bij regeling van Onze Minister kunnen administratieve verplichtingen van het nationaal instituut jegens de houder
      van de ED-kaart in verband met het digitaal betalen van de afvalbeheersbijdrage worden geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel29
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '84'
    text: |-
      1 Het nationaal instituut neemt deel aan de verevening overeenkomstig het bepaalde in de artikelen 4.02, eerste
      en derde lid, en 4.03 van de Uitvoeringsregeling en hetgeen krachtens [artikel 10, derde lid, van het verdrag]
      (onbekend) ter zake is bepaald in het Huishoudelijk Reglement van het internationaal orgaan.

      2 Door het nationaal instituut ontvangen subsidiebedragen uit hoofde van
      [artikel 39h, eerste lid, onderdeel b, van de Binnenvaartwet][ref1] worden in het kader van de verevening
      aangemerkt als opbrengst van de afvalbeheersbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39h
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39h
  - number: '85'
    text: |-
      Het nationaal instituut wijst twee vertegenwoordigers in het internationaal orgaan aan, waarvan één afkomstig is
      uit de bedrijfstak van de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel85
  - number: '86'
    text: |-
      Het nationaal instituut draagt er zorg voor dat de ingevolge [artikel 85][ref1] aangewezen vertegenwoordigers
      deelnemen aan de werkzaamheden van het internationaal orgaan in overeenstemming met het bepaalde bij of krachtens
      artikel 10 van het verdrag en artikel 4.01 van de Uitvoeringsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel85
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '87'
    text: |-
      1 Het nationaal instituut houdt een administratie bij ten aanzien van hetgeen door dat instituut wordt verricht ter
      uitvoering van dit besluit.

      2 Het nationaal instituut draagt er zorg voor dat een sluitende registratie van het in [artikel 78][ref1] bedoelde
      beheer beschikbaar is, welke het nationaal instituut in staat stelt te voldoen aan zijn verplichtingen ingevolge
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '88'
    text: |-
      1 Het nationaal instituut stelt jaarlijks voor 1 juli een rapport op over de uitvoering van zijn taken in het
      afgelopen kalenderjaar en de vooruitzichten ter zake voor de eerstkomende 5 kalenderjaren.

      2 Het nationaal instituut brengt het rapport ter kennis van Onze Minister en het internationaal orgaan.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel88
  - number: '89'
    text: |-
      Het nationaal instituut neemt bij de uitvoering van zijn taken het gestelde in het afvalbeheersplan, bedoeld in
      [artikel 10.3 van de Wet milieubeheer][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.3
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.3'
  - number: '90'
    text: |-
      1 Het nationaal instituut neemt bij de uitvoering van zijn taken een door Onze Minister gegeven aanwijzing in acht.

      2 Een aanwijzing als bedoeld in het eerste lid kan worden vastgesteld ten behoeve van een doelmatige en
      doeltreffende uitvoering van het verdrag.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel90
  - number: '92'
    text: |-
      Onze Minister verschaft, onverminderd het bepaalde in [artikel 2:5 van de Algemene wet bestuursrecht][ref1], aan
      het nationaal instituut de nodige gegevens en inlichtingen ten behoeve van de uitvoering van de taken door dat
      instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel25
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:5
  - number: '93'
    text: |-
      De subsidie-ontvanger is verplicht de taken van het nationaal instituut uit te voeren overeenkomstig het bepaalde
      in dit besluit.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel93
  - number: '94'
    text: |-
      [Artikel 4:76 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op het financieel verslag
      van de subsidie-ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel476
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:76
  - number: '95'
    text: |-
      1 Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt de accountant
      tevens de naleving van de aan de subsidie verbonden verplichtingen.

      2 Onze Minister stelt een aanwijzing vast over de reikwijdte en de intensiteit van de controle, bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel478
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel479
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:78
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:79
  - number: '97'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], en van [artikel 45][ref2] kan tot het tijdstip liggende
      vijf jaar na het in [artikel 101, eerste lid][ref3], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit
      te bepalen tijdstip, afvalwater dat ingevolge artikel 45 in de bedrijfsriolering gebracht zou moeten worden, in een
      oppervlaktewaterlichaam worden gebracht, indien ten minste de losstandaard bezemschoon is bewerkstelligd voor het
      desbetreffende laadruim.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel101
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0012019
