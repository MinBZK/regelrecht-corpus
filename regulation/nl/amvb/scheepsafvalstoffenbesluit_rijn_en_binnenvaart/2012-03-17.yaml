  - number: '54'
    text: |-
      1 De schipper vult de toepasselijke rubrieken van de hem overeenkomstig [artikel 53, vierde lid][ref1], voorgelegde
      losverklaring in drievoud in en ondertekent deze.

      2 De schipper bezorgt na de ondertekening een exemplaar van de losverklaring terug aan degene die de losverklaring
      heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel54
