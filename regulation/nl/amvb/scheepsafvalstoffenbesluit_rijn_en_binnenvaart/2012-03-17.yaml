  - number: 28a
    text: |-
      De leverancier stelt het nationaal instituut onverwijld op de hoogte zodra als gevolg van een storing gebruik van
      de ED-kaart niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel28a
  - number: '29'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter uitvoering van besluiten van de conferentie krachtens
      artikel 14, derde lid, onderdeel d, van het verdrag.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel29
  - number: '30'
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot het laden of lossen van een schip in het kader van
      goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel30
  - number: '31'
    text: |-
      In afwijking van [artikel 30][ref1] is dit hoofdstuk niet van toepassing op het laden of het lossen van een
      schip, indien het lading betreft waarvan het vervoer aan boord van het schip geheel of gedeeltelijk over zee
      zalplaatsvinden, onderscheidenlijk heeft plaatsgevonden, tenzij het varen van dit schip over zee kennelijk
      ondergeschikt is aan het varen over binnenwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel30
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '32'
    text: |-
      1 Het is verboden een stof, preparaat of ander product, behorende tot een goederensoort die is vermeld in
      aanhangsel III behorende bij de Uitvoeringsregeling in of op een schip te laden, tenzij degene die laadt het
      bepaalde in de [artikelen 40][ref1], [41, eerste lid][ref2], en [61][ref3] in acht neemt.

      2 Het is verboden een stof, preparaat of ander produkt, behorende tot een goederensoort die is vermeld in
      aanhangsel III behorende bij de Uitvoeringsregeling uit of van een schip te lossen, tenzij degene die lost het
      bepaalde in de [artikelen 41, tweede lid][ref4], [42][ref5], [43][ref6], [45][ref7], [47][ref8], [53][ref9],
      [57][ref10] en [60][ref11] in acht neemt.

      3 Het eerste lid, dan wel het tweede lid is niet van toepassing indien het laden, onderscheidenlijk het lossen,
      plaatsvindt in een overslaginrichting.

      4 Bij ministeriële regeling worden nadere voorschriften gegeven met betrekking tot aanhangsel III behorende bij
      de Uitvoeringsregeling.


