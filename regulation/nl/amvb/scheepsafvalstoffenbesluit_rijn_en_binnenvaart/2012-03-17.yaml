  - number: '71'
    text: |-
      De ontvanger is jegens de afzender en de vervoerder verplicht ter zake van het lossen van droge lading van of uit
      een schip:

      a. de in de [artikelen 41, tweede lid][ref1], en [42][ref2] bedoelde maatregelen te treffen;

      b. de in de [artikelen 45][ref3] en [47][ref4] bedoelde maatregelen te treffen, voor zover het betreft de
      wasverplichting en het daarbij ontstane waswater, indien uit de laatst afgegeven losverklaring blijkt dat het
      laadruim, onderscheidenlijk de ladingtank, na vorige lossing gewassen is en

      c. ten aanzien van regenwater of buiswater dat in het laadruim is geraakt na aanvang van het laden en voordat
      het lossen overeenkomstig het bepaalde in [paragraaf 3.4][ref5] is beëindigd, de in [artikel 45][ref6] bedoelde
      maatregelen te treffen, tenzij overeengekomen was dat het vervoer afgedekt zou plaatsvinden, en

      d. de kosten te dragen van inname van het onder b bedoelde waswater en het onder c bedoelde regenwater of buiswater
      door een ontvangstvoorziening, alsmede voor wachttijden en omwegen die zijn ontstaan als gevolg van de toepassing
      van de onder a, b en c bedoelde maatregelen;

      e. de in [artikel 53][ref7] bedoelde maatregel te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel42
