  - number: '56'
    text: |-
      De schipper draagt er zorg voor dat de overeenkomstig [artikel 53][ref1] ontvangen verklaringen het transport
      begeleiden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '57'
    text: |-
      Het ingevolge [artikel 54, tweede lid][ref1], terug ontvangen exemplaar van de losverklaring wordt in de
      bedrijfsadministratie bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '58'
    text: |-
      1 Indien een schip wordt ingezet ten behoeve van eenheidstransporten, draagt de schipper er zorg voor dat aan
      boord een verklaring aanwezig is van de opdrachtgever van de eenheidstransporten. De verklaring is gedagtekend en
      vermeldt ten minste

      1°. de naam van de opdrachtgever;

      2°. de naam en het registratienummer van het schip;

      3°. de in aanhangsel III behorende bij de Uitvoeringsregeling gegeven omschrijving van de goederensoorten waartoe
      de te vervoeren lading behoort en de nummers daarvan;

      4°. of tussentijds nalossen dan wel nalenzen noodzakelijk is en

      5°. de datum van aanvang van de eenheidstransporten.

      2 Indien een schip dat niet onder het gezag van een schipper staat wordt ingezet ten behoeve van
      eenheidstransporten, draagt de exploitant van het schip er zorg voor dat een verklaring als bedoeld in het eerste
      lid aanwezig is in zijn administratie.

      3 Ten aanzien van de uitvoering van het eerste en tweede lid alsmede [artikel 60][ref1] is
      [artikel 53, vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '59'
    text: |-
      Indien een lading wordt gelost van een schip dat blijkens een verklaring als bedoeld in [artikel 58][ref1] wordt
      ingezet ten behoeve van eenheidstransporten, zijn met betrekking tot dat lossen niet van toepassing:

      a. de [artikelen 36 tot en met 38][ref2], [42][ref3], [43][ref4] en de zinsneden van
      [artikel 55, tweede lid, onderdeel a][ref5], die verwijzen naar de desbetreffende voorschriften, voorzover blijkens
      die verklaring nalossen of nalenzen niet noodzakelijk is, en

      b. de [artikelen 45][ref6] en [47][ref7] en de zinsneden van [artikel 55, tweede lid, onderdeel a][ref8], die
      verwijzen naar de desbetreffende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel36
