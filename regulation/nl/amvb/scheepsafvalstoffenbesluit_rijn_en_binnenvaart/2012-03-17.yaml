  - number: '73'
    text: |-
      1 De schipper draagt er zorg voor dat huisvuil, slops, zuiveringsslib en klein gevaarlijk afval aan boord naar
      categorie gescheiden worden gehouden en gescheiden worden aangeboden bij een ontvangstvoorziening.

      2 Huisvuil wordt, indien mogelijk, gescheiden naar de categorieën papier, glas, overige te hergebruiken stoffen en
      overig huisvuil afgegeven.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel73
  - number: '74'
    text: |-
      In afwijking van het bepaalde in [artikel 73][ref1] rust met betrekking tot een passagiersschip dat is uitgerust
      met een boordzuiveringsinstallatie voor afvalwater de verplichting tot aanbieden van het zuiveringsslib van die
      installatie bij een ontvangstvoorziening op de exploitant van dat schip.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel73
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '75'
    text: |-
      Degene die een inrichting voor het inzamelen van scheepsafvalstoffen drijft, draagt er zorg voor dat de ingevolge
      [artikel 73][ref1] of [74][ref2] aangeboden afvalstoffen worden ingenomen in die inrichting en aldaar gescheiden
      worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel74
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '76'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan bedrijfsafvalwater uit keukens, eetruimten,
      wasruimten en bijkeukens, daaronder begrepen toiletwater, vanaf hotelschepen met meer dan 50 slaapplaatsen
      of vanaf andere passagiersschepen die toegelaten zijn voor het vervoer van meer dan 50 passagiers in een
      oppervlaktewaterlichaam worden gebracht, voorzover het afvalwater is behandeld in een zuiveringsinstallatie die
      voldoet aan bij regeling van Onze Minister gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '77'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan huishoudelijk afvalwater dan wel bedrijfsafvalwater
      uit keukens, eetruimten, wasruimten en bijkeukens, daaronder begrepen toiletwater, in een oppervlaktewaterlichaam
      worden gebracht vanaf andere dan de in [artikel 76][ref2] bedoelde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel76
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel77
