  - number: '36'
    text: |-
      Een schip wordt door de exploitant voor vervoer van lading ter beschikking gesteld met bezemschone laadruimen dan
      wel nagelensde ladingtanks en vrij van overslagresten.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel36
  - number: '37'
    text: |-
      Een schip wordt door de exploitant slechts voor vervoer van vloeibare lading ter beschikking gesteld indien het is
      uitgerust met een nalenssysteem dat voldoet aan het bepaalde in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel38
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38'
    text: |-
      1 Het nalenssysteem is vast op het schip geïnstalleerd.

      2 Het nalenssysteem is voor de ingebruikname met water als beproevingsmiddel beproefd, overeenkomstig bij regeling
      van Onze Minister gegeven voorschriften, door een onderzoeksbureau dat is toegelaten door de bevoegde autoriteiten
      van een lidstaat van de Europese Unie of van een staat die partij is bij de overeenkomst inzake de Europese
      Economische Ruimte dan wel van Zwitserland. Indien het systeem later is omgebouwd dan is voor de hernieuwde
      ingebruikname dezelfde beproeving uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel38
  - number: '40'
    text: Bij het laden wordt in het vervoersdocument de bij regeling van Onze Minister te bepalen informatie opgenomen.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel40
  - number: '41'
    text: |-
      1 Bij het laden wordt het schip vrij van overslagresten gehouden. Zijn er toch overslagresten ontstaan, dan worden
      deze na het laden van het schip verwijderd en zo veel mogelijk toegevoegd aan de lading.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van het lossen.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel41
  - number: '42'
    text: |-
      1 Aansluitend aan het lossen van droge lading van of uit een laadruim van een schip wordt de in het laadruim
      achtergebleven restlading verwijderd, zodanig dat de losstandaard bezemschoon wordt bereikt, en wordt het
      verpakkings- en stuwmateriaal verwijderd.

      2 In bij regeling van Onze Minister te bepalen gevallen wordt in afwijking van het eerste lid de restlading in
      verdergaande mate verwijderd.

      3 De restlading wordt ingenomen en zo veel mogelijk toegevoegd aan de geloste lading.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel42
  - number: '43'
    text: |-
      1 Aansluitend aan het lossen van vloeibare lading uit een ladingtank van een schip wordt met behulp van een leiding
      die wordt aangesloten op het nalenssysteem van het schip de in de ladingtank achtergebleven restlading verwijderd,
      zodanig dat de losstandaard nagelensde ladingtank wordt bereikt.

      2 Aansluitend aan de toepassing van het eerste lid ten aanzien van alle ladingtanks van het schip wordt dat lid
      overeenkomstig toegepast ten aanzien van het leidingsysteem van het schip.

      3 Bij de toepassing van het eerste en tweede lid is de tegendruk van de walkant in de in het eerste lid bedoelde
      leiding niet hoger dan 3 bar.

      4 De restlading wordt ingenomen en zo veel mogelijk toegevoegd aan de geloste lading.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel43
  - number: '44'
    text: |-
      De schipper verleent medewerking aan de toepassing van de [artikelen 41 tot en met 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '45'
    text: |-
      In bij regeling van Onze Minister te bepalen gevallen wordt na lossing de laadruimte of de ladingtank gewassen
      en wordt afvalwater dat ladingrestanten bevat ingenomen en behandeld en daarna op de bedrijfsriolering geloosd
      onderscheidenlijk in de laadruimte of de ladingtank achtergelaten.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel45
  - number: '47'
    text: |-
      1 Voor het wassen, bedoeld in [artikel 45][ref1], kan de schipper een voorziening buiten de losplaats worden
      toegewezen, mits hem daarbij tevens, in afwijking van artikel 45, in overleg met de exploitant van het schip een
      ontvangstvoorziening wordt toegewezen voor het afgeven van het afvalwater dat zich na het wassen in het laadruim of
      de ladingtank en het leidingsysteem bevindt.

      2 De aangewezen ontvangstvoorziening is gelegen in de nabijheid van de losplaats of op de route van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '52'
    text: |-
      De schipper verleent medewerking aan de toepassing van de [artikelen 45][ref1] en [47][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel52
