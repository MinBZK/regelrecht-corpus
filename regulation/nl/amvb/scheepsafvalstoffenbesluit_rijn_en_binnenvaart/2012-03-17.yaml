  - number: '63'
    text: |-
      In afwijking van [artikel 6][ref1] behoeft de dichtstbijzijnde bevoegde autoriteit niet te worden gewaarschuwd
      indien afvalwater dat ladingrestanten bevat van een goederensoort waarvoor in kolom 3 of 4 van de tabel een
      losstandaard is aangegeven, in een oppervlaktewaterlichaam geraakt of dreigt te geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel6
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '64'
    text: |-
      Indien afvalwater ingevolge het bepaalde in [artikel 47][ref1] of [61][ref2] moet worden afgegeven, brengt de
      schipper het afvalwater over naar de hem toegewezen ontvangstvoorziening en biedt het aldaar aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel61
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '61'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '65'
    text: |-
      De schipper draagt er zorg voor dat afvalwater dat ladingrestanten van een goederensoort bevat aan boord zo veel
      mogelijk gescheiden wordt gehouden van afvalwater dat ladingrestanten bevat van een andere goederensoort.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel65
  - number: '66'
    text: |-
      Bij het afgeven van afvalwater dat ladingrestanten bevat aan een ontvangstvoorziening legt de schipper in tweevoud
      de door hem ondertekende losverklaring voor aan degene die de ontvangstvoorziening drijft of een door deze
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel66
  - number: '67'
    text: |-
      Degene die een inrichting voor het inzamelen van scheepsafvalstoffen drijft, draagt er zorg voor dat afvalwater dat
      ingevolge [artikel 64][ref1] wordt aangeboden, wordt ingenomen in die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel64
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '64'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '68'
    text: |-
      1 Het in ontvangst nemen van afvalwater dat ladingrestanten bevat wordt bevestigd door invulling en ondertekening
      van de daartoe bestemde rubrieken van de ingevolge [artikel 66][ref1] voorgelegde losverklaring in tweevoud
      voorgelegde verklaringen. De ontvangstvoorziening bezorgt na ondertekening een exemplaar van de ondertekende
      losverklaring terug aan de schipper.

      2 De houder van de inrichting als bedoeld in [artikel 67][ref2] bewaart een van de in het eerste lid bedoelde
      losverklaring in zijn administratie.

      3 De schipper bewaart de van de inrichting terugontvangen ondertekende losverklaring gedurende ten minste zes
      maanden aan boord.

      4 De exploitant van het schip bewaart de van de inrichting terugontvangen ondertekende losverklaring in zijn
      bedrijfsadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel67
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3.9'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '67'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '69'
    text: |-
      De vervoerder stelt een schip voor vervoer van lading aan de afzender ter beschikking met bezemschone laadruimen
      dan wel nagelensde ladingtanks en vrij van overslagresten.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel69
  - number: '70'
    text: |-
      1 De afzender is jegens de ontvanger en de vervoerder verplicht ter zake van het laden van een schip de in de
      [artikelen 41, eerste lid][ref1], en [61][ref2] bedoelde maatregelen te treffen.

      2 De afzender is jegens de ontvanger en de vervoerder verplicht ter zake van het lossen van vloeibare lading van of
      uit een schip

      a. de in de [artikelen 41, tweede lid][ref3], en [43][ref4] bedoelde maatregelen te treffen;

      b. de in de [artikelen 45][ref5] en [47][ref6] bedoelde maatregelen te treffen, voor zover het betreft de
      wasverplichting en het daarbij ontstane waswater, indien uit de laatst afgegeven losverklaring blijkt dat het
      laadruim, onderscheidenlijk de ladingtank, na vorige lossing gewassen is en

      c. de kosten te dragen van inname van het onder b bedoelde waswater door een ontvangstvoorziening, alsmede voor
      wachttijden en omwegen die zijn ontstaan als gevolg van de toepassing van de onder a en b bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel43
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref6]: https://wetten.overheid.nl/BWBR0012019#Artikel47
