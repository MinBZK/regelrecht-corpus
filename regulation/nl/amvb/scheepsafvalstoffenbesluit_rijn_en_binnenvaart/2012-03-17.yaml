preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 13 oktober 1999, nr. CDJZ/WVW 1999-1325,
    gedaan mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Justitie;

    Gelet op het op 9 september 1996 te Straatsburg tot stand gekomen Verdrag inzake de verzameling, afgifte en inname
    van afval in de Rijn- en binnenvaart (Trb. 1996, 293), alsmede de artikelen 1, derde lid, 2f, 28c, 28e, 28i en
    28k van de Wet verontreiniging oppervlaktewateren, de artikelen 8.44, 10.4 en 10.35a, tweede lid, van de Wet
    milieubeheer, artikel 929a, eerste en tweede lid, van Boek 8 van het Burgerlijk Wetboek en de artikelen 4:77 en
    4:79 van de Algemene wet bestuursrecht;

    De Raad van State gehoord (advies van 31 januari 2000, nr. W09.990513/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 11 december 2000, nr. CDJZ/WVW 2000-
    1290, Centrale Directie Juridische Zaken, uitgebracht mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. scheepsafvalstoffen: de in de onderdelen b tot en met d nader bepaalde afvalstoffen;

      b. olie- en vethoudende scheepsafvalstoffen: afgewerkte olie, bilgewater en overige olie- of vethoudende
      afvalstoffen die bij het in bedrijf zijn of het onderhoud van een schip aan boord ontstaan;

      c. afval van de lading: ladingrestanten dan wel afvalwater dat ladingrestanten bevat;

      d. overige scheepsafvalstoffen: afvalwater, huisvuil, zuiveringsslib, slops en gevaarlijke afvalstoffen, voorzover
      die afvalstoffen bij het in bedrijf zijn of het onderhoud van een schip aan boord ontstaan en niet vallen onder
      olie- en vethoudende scheepsafvalstoffen of afval van de lading;

      e. afvalstoffen: alle stoffen, preparaten of voorwerpen waarvan de houder zich ontdoet, voornemens is zich te
      ontdoen of zich moet ontdoen;

      f. afvalwater: alle water waarvan de houder zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen;

      g. schip: een vaartuig dat feitelijk wordt gebruikt dan wel geschikt is om te worden gebruikt als middel voor
      verplaatsing te water, alsmede een drijvend werktuig;

      h. schipper: de gezagvoerder van een schip of degene, die deze vervangt;

      i. zeeschip: een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd;

      j. exploitant van een schip: de eigenaar, de rompbevrachter of ieder ander die de zeggenschap heeft over het
      gebruik van het schip;

      k. gemotoriseerd schip: een schip waarvan de hoofd- of hulpmotoren, met uitzondering van ankerliermotoren,
      verbrandingsmotoren zijn;

      l. ontvangstvoorziening: een inrichting of schip voor het inzamelen van scheepsafvalstoffen;

      m. bevoegde autoriteit: de autoriteit of autoriteiten die ten aanzien van een vaarweg voor de toepassing van
      [artikel 1.15, tweede lid, van het Rijnvaartpolitiereglement 1995][ref1], [artikel 1.15, tweede lid, van het
      Binnenvaartpolitiereglement](onbekend), [artikel 1.15 van het Scheepvaartreglement Gemeenschappelijke Maas]
      (onbekend) of [artikel 43 van het Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen][ref2],
      is of zijn aangewezen bij of krachtens het desbetreffende reglement dan wel, binnen het toepassingsgebied
      van het [Scheepvaartreglement Westerschelde 1990][ref3] of het [Scheepvaartreglement Eemsmonding][ref4]:
      de Rijkshavenmeester Westerschelde, onderscheidenlijk de bevoegde autoriteit, aangewezen ingevolge
      [artikel 1, eerste lid, onderdeel i, van het Scheepvaartreglement Eemsmonding][ref5];

      n. verdrag: het op 9 september 1996 te Straatsburg tot stand gekomen
      [Verdrag inzake de verzameling, afgifte en inname van afval in de Rijn- en binnenvaart (Trb. 1996, 293)][ref6]:

      o. Uitvoeringsregeling: [bijlage 2](onbekend), behorende bij het [verdrag][ref7];

      p. conferentie: de Conferentie der Verdragsluitende Partijen, bedoeld in [artikel 14 van het verdrag](onbekend);

      q. internationaal orgaan: het Internationale Verevenings- en Coördinatieorgaan, bedoeld in [artikel 10 van het
      verdrag](onbekend);

      r. Onze Minister: Onze Minister van Infrastructuur en Milieu;

      s. afgewerkte olie: afgewerkte olie als bedoeld in
      [artikel 1, eerste lid, van het Besluit inzamelen afvalstoffen][ref8].

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bilgewater: oliehoudend afvalwater uit de bilge van de machinekamer, de voor- en achterpiek, de kofferdammen en
      de ruimten tussen zijwand en beunwand;

      b. olie-afgifteboekje: een olie-afgifteboekje, afgegeven overeenkomstig het bepaalde in [artikel 14][ref9], dan wel
      een buiten Nederland afgegeven olie-afgifteboekje als bedoeld in artikel 2.03 van de Uitvoeringsregeling;

      c. tegoed: geldelijk tegoed van de eigenaar van het schip op de rekening van een nationaal instituut als bedoeld in
      artikel 9 van het verdrag;

      d. ED-kaart: elektronische informatiedrager, bedoeld in artikel 3.01, onderdeel b, van de Uitvoeringsregeling (ECO-
      kaart);.

      e. betaalterminal: apparaat waarmee in combinatie met de ED-kaart de verschuldigde afvalbeheersbijdrage digitaal
      wordt betaald;

      f. bunkerverklaring: een bunkerverklaring als bedoeld in artikel 22 dan wel een buiten Nederland opgemaakte
      bunkerverklaring als bedoeld in artikel 3.04 van de Uitvoeringsregeling.

      3 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. overslaginrichting: een inrichting ten behoeve van het laden of lossen van schepen;

      b. afzender, ontvanger, onderscheidenlijk vervoerder: de afzender, de ontvanger, onderscheidenlijk de vervoerder,
      bedoeld in [artikel 929a van Boek 8 van het Burgerlijk Wetboek][ref10];

      c. vloeibare lading: vloeibare in bulk vervoerde lading;

      d. droge lading: andere lading dan bedoeld in onderdeel c;

      e. eenheidstransporten: transporten waarbij tijdens opeenvolgende reizen in het laadruim of de ladingtank van een
      schip dezelfde lading of een andere lading, waarvan het transport geen reiniging van het laadruim of de ladingtank
      vereist, wordt vervoerd;

      f. overslagresten: lading die bij de overslag buiten de laadruimen of de ladingtanks op het schip terechtkomt;

      g. leidingsysteem: alle leidingen waarin zich vloeibare of gasvormige lading kan bevinden, met inbegrip van de
      bijbehorende pompen, filters en afsluitinrichtingen;

      h. restlading: lading die na het lossen doch zonder nalossen in de ladingtank, het leidingsysteem of het laadruim
      van een schip is achtergebleven;

      i. nalossen: het uit de laadruimen, ladingtanks en het leidingsysteem van een schip verwijderen van restlading en
      het van een schip verwijderen van verpakkings- en stuwmateriaal;

      j. nalenssysteem: een systeem voor het nalossen van de ladingtanks en het leidingsysteem van een schip;

      k. nagelensde ladingtank: een ladingtank van een schip waaruit de restlading is verwijderd met behulp van een
      nalenssysteem en waarin zich nog slechts ladingrestanten bevinden;

      l. ladingrestanten: vloeibare lading die zich in een ladingtank of het leidingsysteem van een schip bevindt en
      daaruit niet met behulp van het nalenssysteem kan worden verwijderd, dan wel droge lading die zich in een laadruim
      van een schip bevindt en daaruit niet kan worden verwijderd met behulp van bezems of veegmachines, dan wel, indien
      de losstandaard vacuümschoon van toepassing is, met behulp van vacuümreinigers;

      m. bezemschoon laadruim: een laadruim waaruit de restlading is verwijderd met behulp van bezems of veegmachines en
      waarin zich nog slechts ladingrestanten bevinden;

      n. vacuümschoon laadruim: een laadruim waaruit de restlading is verwijderd met behulp van vacuümreinigers en waarin
      zich nog slechts ladingrestanten bevinden;

      o. wassen: het verwijderen van ladingrestanten met behulp van stoom of water;

      p. gewassen laadruim of ladingtank: een laadruim of ladingtank met aansluitend leidingsysteem, dat
      onderscheidenlijk die na het wassen in beginsel voor elke soort lading geschikt is;

      q. waswater: afvalwater dat afkomstig is van het wassen van een laadruim dan wel een ladingtank of het
      leidingsysteem, dan wel een gangboord of andere licht vervuilde oppervlakte van een schip;

      r. losverklaring: een verklaring als bedoeld in [artikel 53, derde lid][ref11], dan wel een buiten Nederland
      opgestelde verklaring als bedoeld in artikel 6.03 van de Uitvoeringsregeling.

      4 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. huisvuil: met huishoudelijke afvalstoffen vergelijkbare organische en anorganische afvalstoffen, afkomstig
      uit het huishouden en van restaurants aan boord van een schip, met uitzondering van huishoudelijk afvalwater en
      zuiveringsslib;

      b. huishoudelijk afvalwater: afvalwater afkomstig uit particuliere huishoudens;

      c. bedrijfsafvalwater: afvalwater, niet zijnde huishoudelijk afvalwater;

      d. zuiveringsslib: afvalstoffen die bij gebruik van een zuiveringsinstallatie aan boord van een schip ontstaan;

      e. slops: verpompbare of niet verpompbaar mengsel van afvalstoffen die bij het in bedrijf zijn of het onderhoud van
      een schip aan boord ontstaan, bestaande uit roest, slib of afvalwater dat ladingrestanten bevat;

      f. klein gevaarlijk afval: gevaarlijke afvalstoffen die bij het in bedrijf zijn of het onderhoud van een schip aan
      boord ontstaan, met uitzondering van olie- en vethoudende scheepsafvalstoffen, en de in de onderdelen a tot en met
      c genoemde afvalstoffen;

      g. hotelschip: een passagiersschip met hutten voor de overnachting van passagiers;

      h. ISO-norm: een door de Internationale Organisatie voor Standaardisatie uitgegeven norm.

      5 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. verevening: de internationale financiële verevening, bedoeld in [artikel 10 van het verdrag](onbekend);

      b. subsidie: de subsidie, bedoeld in [artikel 39h, eerste lid, van de Binnenvaartwet][ref12];

      c. subsidie-ontvanger: de rechtspersoon die ingevolge [artikel 39g van de Binnenvaartwet][ref13] is aangewezen als
      nationaal instituut.


