  - number: '27'
    text: |-
      Een leverancier verstrekt, uiterlijk op de laatste dag van elke kalendermaand op de bij regeling van Onze Minister
      aangegeven wijze aan de daarbij aangewezen dienst schriftelijk de volgende gegevens betreffende elke levering van
      gasolie ten behoeve van een schip, die heeft plaatsgevonden in de voorafgaande kalendermaand:

      a. de naam van de eigenaar van het schip;

      b. het geleverde aantal liters gasolie;

      c. de naam en het nummer van teboekstelling van het schip;

      d. de wijze van betaling van de afvalbeheersbijdrage; en

      e. het bedrag van de betaalde afvalbeheersbijdrage.
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel27
  - number: '28'
    text: |-
      1 Bij regeling van Onze Minister kan aan leveranciers, behorende tot een bij de regeling aan te wijzen categorie,
      vrijstelling worden verleend van de in [artikel 27][ref1] bedoelde verplichtingen, voor zover het belang van een
      goede uitvoering van het verdrag zich daartegen niet verzet.

      2 Onze Minister kan aan een leverancier op aanvraag ontheffing verlenen van de in [artikel 27][ref2] bedoelde
      verplichtingen.

      3 Aan een vrijstelling of ontheffing worden de voorschriften verbonden die nodig zijn voor een goede uitvoering van
      het verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel27
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel28
