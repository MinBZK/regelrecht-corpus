  - number: '60'
    text: |-
      Een afschrift of exemplaar van de in [artikel 58][ref1] bedoelde verklaring wordt in de bedrijfsadministratie
      bewaard als bijlage bij het ingevolge [artikel 54, tweede lid][ref2], terug ontvangen exemplaar van de
      losverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel54
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel60
