      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '53'
    text: |-
      1 In dit artikel en in de [artikelen 54][ref1], [56][ref2], [57][ref3], [60][ref4], [66][ref5] en [68][ref6] wordt
      onder de losverklaring mede begrepen de aanvullende verklaring, bedoeld in het tweede lid.

      2 Indien bij de losverklaring een aanvullende verklaring wordt gevoegd overeenkomstig het bij regeling van Onze
      Minister vastgestelde model, is het [Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen][ref7] op de
      desbetreffende overbrenging van afvalstoffen niet van toepassing.

      3 Aansluitend aan de toepassing van het bepaalde in de [paragrafen 3.4][ref8] en [3.5][ref9] worden de
      toepasselijke rubrieken van een losverklaring, overeenkomstig het bij regeling van Onze Minister vastgestelde
      model, in drievoud ingevuld en ondertekend.

      4 De losverklaring wordt na de toepassing van het eerste lid in drievoud voorgelegd aan de schipper dan wel, indien
      het schip niet onder gezag van een schipper staat, aan de exploitant van het schip.

      5 Aan het eerste en het tweede lid alsmede de [artikelen 54][ref10], [56][ref11], [57][ref12], [66][ref13] en
      [68][ref14] kan in overeenstemming tussen degene die de losverklaring opstelt en de schipper dan wel, indien
      het schip niet onder gezag van een schipper staat, de exploitant van het schip en, indien toepassing moet worden
      gegeven aan [paragraaf 3.9][ref15], degene die de ontvangstvoorziening drijft, langs elektronische weg uitvoering
      worden gegeven, mits voldaan wordt aan de bij regeling van Onze Minister aangegeven waarborgen voor de echtheid van
      de losverklaring, met inbegrip van de ondertekening, en de controleerbaarheid van de losverklaring aan boord dan
      wel in de bedrijfsadministratie van de exploitant van het schip, alsmede in de bedrijfsadministratie van degene die
      de losverklaring heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel56
