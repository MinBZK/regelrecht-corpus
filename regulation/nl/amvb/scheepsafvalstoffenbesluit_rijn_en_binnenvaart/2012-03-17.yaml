  - number: '61'
    text: |-
      Ingeval van eenheidstransporten wordt voor de aanvang van het laden overeenkomstige toepassing gegeven aan de
      [artikelen 45][ref1] en [47][ref2] ten aanzien van het regenwater en het buiswater dat na beëindiging van de
      voorafgaande lossing in het laadruim terecht is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel61
    references:
