        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '55'
    text: |-
      1 De schipper verlaat met het schip de laadplaats na het laden niet eerder dan nadat hij zich er van vergewist
      heeft, dat de overslagresten zijn verwijderd.

      2 De schipper verlaat met het schip de losplaats na het lossen niet eerder dan nadat:

      a. hij zich er van vergewist heeft, dat

      1°. de overslagresten zijn verwijderd;

      2°. alle geloste laadruimen zijn nagelost of ladingtanks nagelensd;

      3°. voldaan is aan de wasverplichting indien die van toepassing is, dan wel hem daartoe overeenkomstig
      [artikel 47][ref1] een voorziening is toegewezen en

      4°. indien [artikel 45][ref2] van toepassing of van overeenkomstige toepassing is, het afvalwater dat
      ladingrestanten bevat is ingenomen dan wel hem daartoe een ontvangstvoorziening is toegewezen, en

      b. hij voldaan heeft aan het bepaalde in [artikel 54][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel54
    url: https://wetten.overheid.nl/BWBR0012019/2012-03-17#Artikel55
    references:
