        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '62'
    text: |-
      1 In afwijking van het verbod van [artikel 4][ref1] kan afvalwater dat ladingrestanten bevat van een goederensoort
      waarvoor in bij regeling van Onze Minister te bepalen gevallen een losstandaard is aangegeven, in een
      oppervlaktewaterlichaam worden gebracht indien:

      a. zodanig afvalwater ingevolge [artikel 45][ref2] op of in het schip is achtergelaten;

      b. de restlading overeenkomstig het bepaalde in [paragraaf 3.4][ref3] is verwijderd uit het laadruim of de
      ladingtank en het leidingsysteem en

      c. een en ander blijkt uit een losverklaring die voldoet aan het bepaalde in [paragraaf 3.6][ref4].

      2 In afwijking van het verbod van [artikel 4][ref5] kan voorts in een oppervlaktewaterlichaam worden gebracht:

      a. regenwater, buiswater of ballastwater dat, blijkens een losverklaring welke voldoet aan het bepaalde in
      [paragraaf 3.6][ref6], afkomstig is uit een gewassen laadruim of ladingtank;

      b. waswater dat afkomstig is van een bezemschone gangboord of van een andere licht verontreinigde oppervlakte van
      het schip of

      c. afvalwater dat ladingrestanten bevat van een goederensoort waarvoor in bij regeling van Onze Minister te
      bepalen gevallen een losstandaard is aangegeven en dat, blijkens een losverklaring die voldoet aan het bepaalde
      in [paragraaf 3.6][ref7], afkomstig is uit een laadruim of ladingtank waaruit de restlading is verwijderd
      overeenkomstig het bepaalde in [paragraaf 3.4][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel4
