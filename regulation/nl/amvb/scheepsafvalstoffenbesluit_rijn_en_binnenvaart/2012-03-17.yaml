  - number: '72'
    text: |-
      Indien de afzender dan wel de ontvanger gebruik maakt van een overslaginstallatie, treedt de exploitant van die
      installatie voor de toepassing van [artikel 70, eerste lid, en tweede lid, onder a en b][ref1], onderscheidenlijk
      [artikel 71, onder a, b, c en e][ref2], in de plaats van de afzender, onderscheidenlijk de ontvanger, met dien
      verstande dat hij slechts verplicht is de kosten van de in die bepalingen bedoelde maatregelen te dragen voorzover
      het betreft de kosten van de toepassing van [artikel 41][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel41
