        bwb_id: BWBR0004552
        artikel: '1'
  - number: 1.1.o
    text: |-
      verdrag: het op 9 september 1996 te Straatsburg tot stand gekomen Verdrag inzake de verzameling, afgifte en inname
      van afval in de Rijn- en binnenvaart (Trb. 1996, 293):
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.p
    text: 'Uitvoeringsregeling: bijlage 2, behorende bij het verdrag;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.q
    text: 'conferentie: de Conferentie der Verdragsluitende Partijen, bedoeld in artikel 14 van het verdrag;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.r
    text: 'internationaal orgaan: het Internationale Verevenings- en Coördinatieorgaan, bedoeld in artikel 10 van het verdrag;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.s
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.t
    text: |-
      afgewerkte olie: afgewerkte olie als bedoeld in
      [artikel 1, eerste lid, van het Besluit inzamelen afvalstoffen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016530#Artikel1
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016530
        artikel: '1'
  - number: 1.1.u
    text: 'dampen: gasvormige uit vloeibare lading vervluchtigende verbindingen (gasvormige restanten van vloeibare lading).'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.2.a
    text: |-
      bilgewater: oliehoudend afvalwater uit de bilge van de machinekamer, de voor- en achterpiek, de kofferdammen en de
      ruimten tussen zijwand en beunwand;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.2.b
    text: |-
      olie-afgifteboekje: een olie-afgifteboekje, afgegeven overeenkomstig het bepaalde in [artikel 14][ref1], dan wel
      een buiten Nederland afgegeven olie-afgifteboekje als bedoeld in artikel 2.03 van de Uitvoeringsregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel14
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 1.2.c
    text: |-
      tegoed: geldelijk tegoed van de eigenaar van het schip op de rekening van een nationaal instituut als bedoeld in
      artikel 9 van het verdrag;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.2.d
    text: |-
      ED-kaart: elektronische informatiedrager, bedoeld in artikel 3.01, onderdeel b, van de Uitvoeringsregeling (ECO-
      kaart);.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.2.e
    text: |-
      betaalterminal: apparaat waarmee in combinatie met de ED-kaart de verschuldigde afvalbeheerbijdrage digitaal wordt
      betaald;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.2.f
    text: |-
      bunkerverklaring: een bunkerverklaring als bedoeld in artikel 22 dan wel een buiten Nederland opgemaakte
      bunkerverklaring als bedoeld in artikel 3.04 van de Uitvoeringsregeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.a
    text: |-
      overslaginstallatie: voor het laden en lossen van schepen bedoelde locatie waarop een milieubelastende activiteit
      die is aangewezen in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref1] wordt verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041330
        hoofdstuk: '3'
  - number: 1.3.b
    text: |-
      afzender, ontvanger, onderscheidenlijk vervoerder: de afzender, de ontvanger, onderscheidenlijk de vervoerder,
      bedoeld in [artikel 929a van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel929a
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: 929a
  - number: 1.3.c
    text: 'vloeibare lading: vloeibare in bulk vervoerde lading;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.d
    text: 'droge lading: andere lading dan bedoeld in onderdeel c;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.e
    text: |-
      eenheidstransporten: transporten waarbij tijdens opeenvolgende reizen in het laadruim of de ladingtank van een
      schip aantoonbaar dezelfde lading of een andere lading, waarvan het transport geen reiniging van het laadruim of de
      ladingtank vereist, wordt vervoerd;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.f
    text: |-
      verenigbare transporten: transporten waarbij tijdens opeenvolgende reizen in het laadruim of de ladingtank van een
      schip aantoonbaar een lading, waarvan het transport geen wassen van het laadruim of de ladingtank vereist, wordt
      vervoerd;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.g
    text: 'overslagresten: lading die bij de overslag buiten de laadruimen of de ladingtanks op het schip terechtkomt;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.h
    text: |-
      leidingsysteem: alle leidingen waarin zich vloeibare of gasvormige lading kan bevinden, met inbegrip van de
      bijbehorende pompen, filters en afsluitinrichtingen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.i
    text: |-
      restlading: lading die na het lossen doch zonder nalossen in de ladingtank, het leidingsysteem of het laadruim van
      een schip is achtergebleven;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.j
    text: |-
      uitstoten van dampen: elk afblazen van dampen uit een gesloten ladingtank met uitzondering van het ontspannen
      van de tank om de luiken te openen en om de dampconcentratie te meten alsmede bij het inschakelen van de
      veiligheidsventielen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.k
    text: |-
      nalossen: het uit de laadruimen, ladingtanks en het leidingsysteem van een schip verwijderen van restlading en het
      van een schip verwijderen van verpakkings- en stuwmateriaal;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.l
    text: 'nalenssysteem: een systeem voor het nalossen van de ladingtanks en het leidingsysteem van een schip;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.m
    text: |-
      nagelensde ladingtank: een ladingtank van een schip waaruit de restlading is verwijderd met behulp van een
      nalenssysteem en waarin zich nog slechts ladingrestanten bevinden;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.n
    text: |-
      ladingrestanten: vloeibare lading die zich in een ladingtank of het leidingsysteem van een schip bevindt en daaruit
      niet met behulp van het nalenssysteem kan worden verwijderd, dan wel droge lading die zich in een laadruim van
      een schip bevindt en daaruit niet kan worden verwijderd met behulp van bezems of veegmachines, dan wel, indien de
      losstandaard vacuümschoon van toepassing is, met behulp van vacuümreinigers;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.o
    text: |-
      bezemschoon laadruim: een laadruim waaruit de restlading is verwijderd met behulp van bezems of veegmachines en
      waarin zich nog slechts ladingrestanten bevinden;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.p
    text: |-
      vacuümschoon laadruim: een laadruim waaruit de restlading is verwijderd met behulp van vacuümreinigers en waarin
      zich nog slechts ladingrestanten bevinden;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.q
    text: 'wassen: het verwijderen van ladingrestanten met behulp van stoom of water;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.r
    text: |-
      gewassen laadruim of ladingtank: een laadruim of ladingtank met aansluitend leidingsysteem, dat onderscheidenlijk
      die na het wassen in beginsel voor elke soort lading geschikt is;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.s
    text: |-
      waswater: afvalwater dat afkomstig is van het wassen van een laadruim dan wel een ladingtank of het leidingsysteem,
      dan wel een gangboord of andere licht vervuilde oppervlakte van een schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.s
    text: |-
      losverklaring: een verklaring als bedoeld in [artikel 53, derde lid][ref1], dan wel een buiten Nederland opgestelde
      verklaring als bedoeld in artikel 6.03 van de Uitvoeringsregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 1.3.t
    text: |-
      ontgassen: verwijderen van dampen, overeenkomstig aanhangsel IIIa behorende bij de Uitvoeringsregeling, uit een
      nagelensde ladingtank bij een ontvangstvoorziening door gebruik te maken van hiervoor geschikte procedures en
      technieken;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.u
    text: 'ventileren: rechtstreekse afgifte van dampen uit de ladingtank aan de atmosfeer;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.3.v
    text: |-
      ontgaste of geventileerde tank: ladingtank waaruit de dampen, overeenkomstig de ontgassingsstandaarden van
      aanhangsel IIIa, behorende bij de Uitvoeringsregeling, zijn verwijderd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: '1.4'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.a
    text: |-
      huisvuil: met huishoudelijke afvalstoffen vergelijkbare organische en anorganische afvalstoffen, afkomstig uit
      het huishouden en van restaurants aan boord van een schip, met uitzondering van huishoudelijk afvalwater en
      zuiveringsslib;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.b
    text: 'huishoudelijk afvalwater: afvalwater afkomstig uit particuliere huishoudens;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.c
    text: 'bedrijfsafvalwater: afvalwater, niet zijnde huishoudelijk afvalwater;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.d
    text: 'zuiveringsslib: afvalstoffen die bij gebruik van een zuiveringsinstallatie aan boord van een schip ontstaan;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.e
    text: |-
      slops: verpompbare of niet verpompbaar mengsel van afvalstoffen die bij het in bedrijf zijn of het onderhoud van
      een schip aan boord ontstaan, bestaande uit roest, slib of afvalwater dat ladingrestanten bevat;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.f
    text: |-
      klein gevaarlijk afval: gevaarlijke afvalstoffen die bij het in bedrijf zijn of het onderhoud van een schip aan
      boord ontstaan, met uitzondering van olie- en vethoudende scheepsafvalstoffen, en de in de onderdelen a tot en met
      c genoemde afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.g
    text: 'hotelschip: een passagiersschip met hutten voor de overnachting van passagiers;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.4.h
    text: 'ISO-norm: een door de Internationale Organisatie voor Standaardisatie uitgegeven norm.'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: '1.5'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.5.a
    text: 'verevening: de internationale financiële verevening, bedoeld in artikel 10 van het verdrag;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.5.b
    text: |-
      subsidie: de subsidie, bedoeld in [artikel 39h, eerste lid, van de Binnenvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39h
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39h
  - number: 1.5.c
    text: |-
      subsidie-ontvanger: de rechtspersoon die ingevolge [artikel 39g van de Binnenvaartwet][ref1] is aangewezen als
      nationaal instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39g
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39g
  - number: '2'
    text: |-
      Dit besluit is van toepassing met betrekking tot schepen die zich bevinden op de voor het openbare
      scheepvaartverkeer openstaande binnenwateren, daaronder begrepen de daarin aanwezige waterstaatswerken.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel2
  - number: '3'
    text: |-
      In afwijking van [artikel 2][ref1] is dit besluit niet van toepassing op bij regeling van Onze Minister aangewezen
      vaartuigen, voor zover in die regeling bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel2
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 3a
    text: |-
      Het in het oppervlaktewaterlichaam brengen van stoffen bedoeld in de [artikelen 62][ref1], [76][ref2], [77][ref3]
      en [100][ref4] is vrijgesteld van het in [artikel 6.2, eerste lid, van de Waterwet][ref5] bedoelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel100
      [ref5]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '3.8'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '77'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '100'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '4'
    text: |-
      Het is verboden scheepsafvalstoffen dan wel delen van de lading vanaf een schip in een oppervlaktewaterlichaam te
      brengen of dampen in de atmosfeer uit te stoten, behoudens voorzover elders in dit besluit anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel4
  - number: '5'
    text: |-
      Het verbod, bedoeld in [artikel 4][ref1], is niet van toepassing ten aanzien van het in een oppervlaktewaterlichaam
      brengen van overslagresten, restlading, ladingrestanten dan wel afvalwater dat ladingrestanten bevat vanaf schepen
      die bestemd zijn voor andere diensten dan goederenvervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '6.1'
    text: |-
      Indien vanaf een schip scheepsafvalstoffen dan wel delen van de lading in een oppervlaktewaterlichaam geraken of
      dreigen te geraken of dampen ten aanzien waarvan in aanhangsel IIIa behorende bij de Uitvoeringsregeling ontgassing
      voorgeschreven is, vrijkomen of dreigen vrij te komen, waarschuwt de schipper onverwijld de dichtstbijzijnde
      bevoegde autoriteit, tenzij het een geval betreft als bedoeld in [artikel 4][ref1], laatste zinsnede, of
      [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel5
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '6.2'
    text: |-
      Bij de toepassing van het eerste lid geeft de schipper de plaats van het voorval alsmede de hoeveelheid en de aard
      van de afvalstoffen of de lading zo nauwkeurig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel6
  - number: '7'
    text: Het is verboden scheepsafvalstoffen aan boord van een schip te verbranden.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel7
  - number: '8'
    text: |-
      De exploitant van een schip dat niet onder het gezag van een schipper staat, neemt met betrekking tot dat schip de
      tot de schipper gerichte voorschriften van dit besluit in acht.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel8
  - number: '9'
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot gemotoriseerde schepen, indien in een of meer van de motoren
      gasolie wordt verbruikt.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel9
  - number: '10'
    text: |-
      Dit hoofdstuk, met uitzondering van [paragraaf 2.6][ref1], is niet van toepassing met betrekking tot zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '11'
    text: |-
      De schipper draagt er zorg voor dat bilgewater en overige olie- en vethoudende scheepsafvalstoffen aan boord in
      de bilge van de machinekamer, onderscheidenlijk gescheiden in de daarvoor bestemde verzamelreservoirs, worden
      verzameld en bewaard.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel11
  - number: '12.1'
    text: |-
      De in [artikel 11][ref1] bedoelde verzamelreservoirs worden aan boord zo aangebracht dat lekkage gemakkelijk en
      tijdig opgemerkt en gestopt kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel11
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '12.2'
    text: Voor de opslag van afgewerkte olie worden geen los aan dek staande verzamelreservoirs gebruikt.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel12
  - number: '13.1'
    text: |-
      Het is verboden reinigingsmiddelen die olie of vet oplossen dan wel emulgerend zijn in de bilge van de machinekamer
      dan wel in het bilgewater te doen geraken.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel13
  - number: '13.2'
    text: |-
      Van het verbod, bedoeld in het eerste lid, zijn uitgezonderd reinigingsmiddelen die de verwerking van het
      bilgewater niet bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel13
  - number: '13.3'
    text: Bij regeling van Onze Minister kunnen reinigingsmiddelen als bedoeld in het eerste of tweede lid worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel13
  - number: '14.1'
    text: De schipper draagt er zorg voor dat een geldig olie-afgifteboekje aan boord aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel14
  - number: '14.2'
    text: Een olie-afgifteboekje wordt op aanvraag verstrekt door een dienst of instelling, aangewezen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel14
  - number: '14.3'
    text: Het model van het olie-afgifteboekje wordt vastgesteld bij regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel14
  - number: '14.4'
    text: |-
      Na verkrijging van een nieuw olie-afgifteboekje wordt het voorgaande olie-afgifteboekje ten minste zes maanden na
      de datum van de laatste daarin opgenomen vermelding van een afgifte aan boord bewaard.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel14
  - number: '15.1'
    text: De schipper biedt olie- en vethoudende scheepsafvalstoffen tijdig aan bij een ontvangstvoorziening.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel15
  - number: '15.2'
    text: |-
      De schipper legt bij een afgifte als bedoeld in het eerste lid het olie-afgifteboekje voor aan degene die de
      ontvangstvoorziening exploiteert of een door deze aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel15
  - number: '16'
    text: |-
      Degene die een ontvangstvoorziening exploiteert, draagt er zorg voor dat de ingevolge [artikel 15][ref1] aangeboden
      olie- en vethoudende scheepsafvalstoffen worden ingenomen op de ontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17'
    text: |-
      Het in ontvangst nemen van olie- en vethoudende scheepsafvalstoffen wordt bevestigd door invulling en ondertekening
      van de eerste niet ingevulde bladzijde van het door de schipper ingevolge [artikel 15][ref1] overgelegde olie-
      afgifteboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '18'
    text: |-
      Nadat gevolg is gegeven aan [artikel 17][ref1], ondertekent de schipper de desbetreffende bladzijde van het olie-
      afgifteboekje.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel17
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '19.1'
    text: |-
      Met het oog op de toepassing van [artikel 20, eerste lid][ref1], is de eigenaar van een schip verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel20
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 19.1.a
    text: een rekening bij een nationaal instituut als bedoeld in artikel 9 van het verdrag te openen, en
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel19
  - number: 19.1.b
    text: zorg te dragen dat de schipper de beschikking heeft over de ED-kaart.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel19
  - number: '19.2'
    text: Onze Minister kan nadere regels met betrekking tot de vormgeving en andere kenmerken van de ED-kaart stellen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel19
  - number: '20.1'
    text: |-
      Ter gelegenheid van het betrekken van gasolie ten behoeve van een schip wordt de door de eigenaar van een schip
      verschuldigde afvalbeheerbijdrage over het betrokken aantal liters gasolie betaald met behulp van de ED-kaart op
      een bij regeling van Onze Minister te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: '20.2'
    text: 'De ED-kaart wordt gebruikt in het geval dat:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: 20.2.a
    text: het tegoed voldoende is om de verschuldigde afvalbeheerbijdrage te betalen,
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: 20.2.b
    text: het tegoed niet negatief maar ontoereikend is om de verschuldigde verwijderingsbijdrage te betalen, of
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: 20.2.c
    text: |-
      het tegoed negatief is en het nationaal instituut die de ED-kaart heeft verstrekt toestaat dat de ED-kaart wordt
      gebruikt bij een negatief saldo.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: '20.3'
    text: |-
      Indien het tweede lid, onderdeel b of c van toepassing is, heft de eigenaar van het schip het tekort op de rekening
      binnen een periode van twee weken na de dag van de bunkering op.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: '20.4'
    text: |-
      De leverancier draagt er zorg voor dat in tweevoud een betalingsbewijs wordt opgemaakt waarop het nummer waaronder
      het tegoed is geregistreerd, het betrokken aantal liters gasolie, het bedrag van de betaalde afvalbeheerbijdrage,
      de datum en het tijdstip van de bunkering worden vermeld.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel20
  - number: '21.1'
    text: |-
      De leverancier biedt aan de eigenaar van het schip namens het nationaal instituut de mogelijkheid de verschuldigde
      afvalbeheerbijdrage te betalen overeenkomstig de in het tweede en derde lid bepaalde procedure in het geval dat:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: 21.1.a
    text: de schipper niet over de ED-kaart beschikt;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: 21.1.b
    text: |-
      het tegoed negatief is en het nationaal instituut die de ED-kaart heeft verstrekt gebruik bij negatief saldo niet
      toestaat, of
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: 21.1.c
    text: het gebruik van de ED-kaart als gevolg van een storing niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: '21.2'
    text: 'De schipper vult in drievoud in namens de eigenaar van het schip:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: 21.2.a
    text: |-
      een schuldbekentenis tot betaling van de verschuldigde afvalbeheerbijdrage in het geval van het eerste lid,
      onderdeel a, of
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: 21.2.b
    text: |-
      een machtiging tot incasso van de verschuldigde afvalbeheerbijdrage in het geval van het eerste lid, onderdeel b
      of c.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: '21.3'
    text: |-
      Na vermelding van het verstrekte aantal liters gasolie door de leverancier in de schuldbekentenis respectievelijk
      de machtiging, ondertekent de schipper namens de eigenaar van het schip dit document.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: '21.4'
    text: |-
      De eigenaar van het schip stort binnen een periode van twee weken na de dag van bunkering een bedrag op de rekening
      bij het nationaal instituut teneinde de schuld respectievelijk het eventuele tekort op te heffen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: '21.5'
    text: De leverancier zendt de ondertekende schuldbekentenis of machtiging onverwijld aan het nationaal instituut.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel21
  - number: '22.1'
    text: |-
      Ter gelegenheid van een levering van gasolie ten behoeve van een schip wordt door de leverancier een schriftelijke
      bunkerverklaring opgemaakt. Deze verklaring moet ten minste de volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.a
    text: de naam en het adres van de eigenaar van het schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.b
    text: de naam en het adres van de leverancier;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.c
    text: het geleverde aantal liters, onder vermelding dat het gasolie betreft;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.d
    text: de naam en het nummer van teboekstelling en het land van registratie van het schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.e
    text: de naam van de schipper;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.f
    text: de hoogte van de afvalbeheerbijdrage; en
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.1.g
    text: de plaats en datum van handeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: '22.2'
    text: 'De leverancier hecht aan de bunkerverklaring:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: 22.2.a
    text: |-
      het betalingsbewijs, bedoeld in [artikel 20, vierde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel20
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 22.2.b
    text: |-
      de schuldbekentenis, bedoeld in [artikel 21, tweede lid, onderdeel a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel21
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 22.2.c
    text: |-
      de machtiging, bedoeld in [artikel 21, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel21
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '22.3'
    text: De verklaring wordt door de leverancier ondertekend en ter mede-ondertekening voorgelegd aan de schipper.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
  - number: '22.4'
    text: |-
      Indien een leverancier ter gelegenheid van een levering als bedoeld in het eerste lid ten behoeve van de eigenaar
      van het schip een verklaring als bedoeld in [artikel 19, onderdeel b, van het Uitvoeringsbesluit accijns][ref1]
      opmaakt, neemt hij de bunkerverklaring op in het formulier van die verklaring. In een zodanig geval kan de
      leverancier de bunkerverklaring, in afwijking van het tweede lid, ondertekenen nadat de schipper ingevolge
      [artikel 23][ref2] de verklaring heeft ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel23
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '23'
    text: |-
      De schipper ondertekent een overeenkomstig [artikel 22][ref1] opgestelde en aan hem voorgelegde bunkerverklaring en
      stelt deze ter hand aan de leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel22
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '24'
    text: De leverancier stelt aan de schipper een afschrift van de bunkerverklaring ter hand.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel24
  - number: '25'
    text: |-
      De leverancier bewaart een overeenkomstig [artikel 22][ref1] opgemaakte en ondertekende bunkerverklaring in zijn
      bedrijfsadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel22
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '26.1'
    text: |-
      De schipper hecht aan het ingevolge [artikel 24][ref1] ontvangen afschrift van de bunkerverklaring:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel24
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 26.1.a
    text: |-
      het betalingsbewijs, bedoeld in [artikel 20, vierde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel20
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 26.1.b
    text: |-
      de schuldbekentenis, bedoeld in [artikel 21, tweede lid, onderdeel a][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel21
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 26.1.c
    text: |-
      de machtiging, bedoeld in [artikel 21, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel21
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '26.2'
    text: |-
      De schipper bewaart het afschrift, alsmede een door hem ontvangen afschrift van een buiten Nederland opgemaakte
      bunkerverklaring inzake het betrekken van gasolie ten behoeve van het schip, gedurende ten minste twaalf maanden
      aan boord.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel26
  - number: '27'
    text: |-
      Een leverancier verstrekt, uiterlijk op de laatste dag van elke kalendermaand op de bij regeling van Onze Minister
      aangegeven wijze aan de daarbij aangewezen dienst schriftelijk de volgende gegevens betreffende elke levering van
      gasolie ten behoeve van een schip, die heeft plaatsgevonden in de voorafgaande kalendermaand:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: 27.a
    text: de naam van de eigenaar van het schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: 27.b
    text: het geleverde aantal liters gasolie;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: 27.c
    text: de naam en het nummer van teboekstelling van het schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: 27.d
    text: de wijze van betaling van de afvalbeheerbijdrage; en
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: 27.e
    text: het bedrag van de betaalde afvalbeheerbijdrage.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel27
  - number: '28.1'
    text: |-
      Bij regeling van Onze Minister kan aan leveranciers, behorende tot een bij de regeling aan te wijzen categorie,
      vrijstelling worden verleend van de in [artikel 27][ref1] bedoelde verplichtingen, voor zover het belang van een
      goede uitvoering van het verdrag zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel27
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '28.2'
    text: |-
      Onze Minister kan aan een leverancier op aanvraag ontheffing verlenen van de in [artikel 27][ref1] bedoelde
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel27
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2.6'
  - number: '28.3'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden die nodig zijn voor een goede uitvoering van
      het verdrag.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel28
  - number: 28a
    text: |-
      De leverancier stelt het nationaal instituut onverwijld op de hoogte zodra als gevolg van een storing gebruik van
      de ED-kaart niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel28a
  - number: '29'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter uitvoering van besluiten van de conferentie krachtens
      artikel 14, derde lid, onderdeel d, van het verdrag.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel29
  - number: '30'
    text: |-
      Dit hoofdstuk is van toepassing met betrekking tot het laden of lossen van een schip in het kader van
      goederenvervoer.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel30
  - number: '31'
    text: |-
      In afwijking van [artikel 30][ref1] is dit hoofdstuk niet van toepassing op het laden of het lossen van een
      schip, indien het lading betreft waarvan het vervoer aan boord van het schip geheel of gedeeltelijk over zee
      zalplaatsvinden, onderscheidenlijk heeft plaatsgevonden, tenzij het varen van dit schip over zee kennelijk
      ondergeschikt is aan het varen over binnenwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel30
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '32.1'
    text: |-
      Het is verboden een stof, preparaat of ander product, behorende tot een goederensoort die is vermeld in aanhangsel
      III of aanhangsel IIIa behorende bij de Uitvoeringsregeling in of op een schip te laden, tenzij degene die laadt
      het bepaalde in de [artikelen 40][ref1], [41, eerste lid][ref2], en [61][ref3] in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel61
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '61'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '32.2'
    text: |-
      Het is verboden een stof, preparaat of ander produkt, behorende tot een goederensoort die is vermeld in aanhangsel
      III of aanhangsel IIIa behorende bij de Uitvoeringsregeling uit of van een schip te lossen, tenzij degene die lost
      het bepaalde in de [artikelen 41, tweede lid][ref1], [42][ref2], [43][ref3], [45][ref4], [47][ref5], [53][ref6],
      [57][ref7] en [60][ref8] in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0012019#Artikel53
      [ref7]: https://wetten.overheid.nl/BWBR0012019#Artikel57
      [ref8]: https://wetten.overheid.nl/BWBR0012019#Artikel60
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref5
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref6
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref7
        bwb_id: BWBR0012019
        artikel: '57'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref8
        bwb_id: BWBR0012019
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '32.3'
    text: |-
      Het eerste lid, dan wel het tweede lid is niet van toepassing indien het laden, onderscheidenlijk het lossen,
      plaatsvindt in een overslaginstallatie.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel32
  - number: '32.4'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven met betrekking tot aanhangsel III of aanhangsel IIIa
      behorende bij de Uitvoeringsregeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel32
  - number: '33'
    text: |-
      Degene die een overslaginstallatie exploiteert neemt met betrekking tot het laden of het lossen van een
      schip op die overslaginstallatie het bepaalde ten aanzien van laden, onderscheidenlijk lossen, in de
      [artikelen 40 tot en met 43][ref1], [45][ref2], [47][ref3], [53][ref4], [57][ref5], [60][ref6] en [61][ref7] in
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel53
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0012019#Artikel60
      [ref7]: https://wetten.overheid.nl/BWBR0012019#Artikel61
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref5
        bwb_id: BWBR0012019
        artikel: '57'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref6
        bwb_id: BWBR0012019
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref7
        bwb_id: BWBR0012019
        artikel: '61'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '36'
    text: |-
      Een schip wordt door de exploitant voor vervoer van lading ter beschikking gesteld met bezemschone laadruimen dan
      wel nagelensde ladingtanks en vrij van overslagresten.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel36
  - number: '37'
    text: |-
      Een schip wordt door de exploitant slechts voor vervoer van vloeibare lading ter beschikking gesteld indien het is
      uitgerust met een nalenssysteem dat voldoet aan het bepaalde in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel38
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38.1'
    text: Het nalenssysteem is vast op het schip geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel38
  - number: '38.2'
    text: |-
      Het nalenssysteem is voor de ingebruikname met water als beproevingsmiddel beproefd, overeenkomstig bij regeling
      van Onze Minister gegeven voorschriften, door een onderzoeksbureau dat is toegelaten door de bevoegde autoriteiten
      van een lidstaat van de Europese Unie of van een staat die partij is bij de overeenkomst inzake de Europese
      Economische Ruimte dan wel van Zwitserland. Indien het systeem later is omgebouwd dan is voor de hernieuwde
      ingebruikname dezelfde beproeving uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel38
  - number: '40'
    text: Bij het laden wordt in het vervoersdocument de bij regeling van Onze Minister te bepalen informatie opgenomen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel40
  - number: '41.1'
    text: |-
      Bij het laden wordt het schip vrij van overslagresten gehouden. Zijn er toch overslagresten ontstaan, dan worden
      deze na het laden van het schip verwijderd en zo veel mogelijk toegevoegd aan de lading.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel41
  - number: '41.2'
    text: 'Tot het laden en lossen van een schip behoren ook de maatregelen tot nalossen alsmede:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel41
  - number: 41.2.a
    text: bij wassen, voor het wassen en
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel41
  - number: 41.2.b
    text: bij ontgassen, voor het ontgassen,
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel41
  - number: '41.3'
    text: Het eerste lid is van overeenkomstige toepassing ten aanzien van het lossen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel41
  - number: '42.1'
    text: |-
      Aansluitend aan het lossen van droge lading van of uit een laadruim van een schip wordt de in het laadruim
      achtergebleven restlading verwijderd, zodanig dat de losstandaard bezemschoon wordt bereikt, en wordt het
      verpakkings- en stuwmateriaal verwijderd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel42
  - number: '42.2'
    text: |-
      In bij regeling van Onze Minister te bepalen gevallen wordt in afwijking van het eerste lid de restlading in
      verdergaande mate verwijderd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel42
  - number: '42.3'
    text: De restlading wordt ingenomen en zo veel mogelijk toegevoegd aan de geloste lading.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel42
  - number: '43.1'
    text: |-
      Aansluitend aan het lossen van vloeibare lading uit een ladingtank van een schip wordt met behulp van een leiding
      die wordt aangesloten op het nalenssysteem van het schip de in de ladingtank achtergebleven restlading verwijderd,
      zodanig dat de losstandaard overeenkomstig aanhangsel III behorende bij de Uitvoeringsregeling in de nagelensde
      ladingtank wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel43
  - number: '43.2'
    text: |-
      Aansluitend aan de toepassing van het eerste lid ten aanzien van alle ladingtanks van het schip wordt dat lid
      overeenkomstig toegepast ten aanzien van het leidingsysteem van het schip.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel43
  - number: '43.3'
    text: |-
      Bij de toepassing van het eerste en tweede lid is de tegendruk van de walkant in de in het eerste lid bedoelde
      leiding niet hoger dan 3 bar.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel43
  - number: '43.4'
    text: De restlading wordt ingenomen en zo veel mogelijk toegevoegd aan de geloste lading.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel43
  - number: '44'
    text: |-
      De schipper verleent medewerking aan de toepassing van de [artikelen 41 tot en met 43][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '45.1'
    text: |-
      In bij regeling van Onze Minister te bepalen gevallen wordt na lossing de laadruimte of de ladingtank gewassen
      overeenkomstig de losstandaarden en de afgifte- en innamevoorschriften van aanhangsel III behorende bij de
      Uitvoeringsregeling en wordt afvalwater dat ladingrestanten bevat ingenomen en behandeld en daarna op de
      bedrijfsriolering geloosd onderscheidenlijk in de laadruimte of de ladingtank achtergelaten.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel45
  - number: '45.2'
    text: |-
      In bij regeling van Onze Minister te bepalen gevallen wordt na lossing de ladingtank ontgast overeenkomstig de
      ontgassingsstandaarden in Aanhangsel IIIa behorende bij de Uitvoeringsregeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel45
  - number: '45.3'
    text: |-
      Tot het moment dat de termijn van twee jaar, bedoeld in artikel 11.01, onderdeel b, van de Uitvoeringsregeling, is
      verstreken, is het verboden om de dampen van de goederen met de UN-nummers vermeld in Tabel II van aanhangsel IIIa
      bij het verdrag in de atmosfeer uit te stoten, tenzij aan de voorwaarden, bedoeld in dat aanhangsel, wordt voldaan.
      De dampen van deze goederen worden ontgast overeenkomstig het tweede lid, tenzij anders is bepaald in artikel 7.04
      van de Uitvoeringsregeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel45
  - number: '45.4'
    text: |-
      De kosten voor de ontgassing, bedoeld in het derde lid, worden verdeeld overeenkomstig artikel 7.06 van de
      Uitvoeringsregeling.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel45
  - number: '47.1'
    text: |-
      Voor het wassen, bedoeld in [artikel 45][ref1], kan de schipper een voorziening buiten de losplaats worden
      toegewezen, mits hem daarbij tevens, in afwijking van artikel 45, in overleg met de exploitant van het schip een
      ontvangstvoorziening wordt toegewezen voor het afgeven van het afvalwater dat zich na het wassen in het laadruim of
      de ladingtank en het leidingsysteem bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '47.2'
    text: |-
      Bij vloeibare lading, waarbij dampen ontstaan die een ontgassing vereisen zoals bedoeld in
      [artikel 70, tweede lid, onderdeel c][ref1], is de afzender verplicht de vervoerder in de vervoersovereenkomst een
      ontvangstvoorziening toe te wijzen, waar het schip na het lossen, met inbegrip van het nalossen en de verwijdering
      van de overslagresten, ontgast moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel70
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '70'
        hoofdstuk: '3'
        paragraaf: '3.10'
  - number: '47.3'
    text: De aangewezen ontvangstvoorziening is gelegen in de nabijheid van de losplaats of op de route van het schip.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel47
  - number: '52'
    text: |-
      De schipper verleent medewerking aan de toepassing van de [artikelen 45][ref1] en [47][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '53.1'
    text: |-
      In dit artikel en in de [artikelen 54][ref1], [56][ref2], [57][ref3], [60][ref4], [66][ref5] en [68][ref6] wordt
      onder de losverklaring mede begrepen de aanvullende verklaring, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel66
      [ref6]: https://wetten.overheid.nl/BWBR0012019#Artikel68
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
