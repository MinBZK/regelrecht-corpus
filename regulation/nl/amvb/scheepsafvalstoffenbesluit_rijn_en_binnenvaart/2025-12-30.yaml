        paragraaf: '3.6'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref5
        bwb_id: BWBR0012019
        artikel: '66'
        hoofdstuk: '3'
