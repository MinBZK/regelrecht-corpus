$id: scheepsafvalstoffenbesluit_rijn_en_binnenvaart
regulatory_layer: AMVB
publication_date: '2024-09-02'
valid_from: '2025-12-30'
bwb_id: BWBR0012019
url: https://wetten.overheid.nl/BWBR0012019/2025-12-30
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 13 oktober 1999, nr. CDJZ/WVW 1999-1325,
    gedaan mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Justitie;

    Gelet op het op 9 september 1996 te Straatsburg tot stand gekomen Verdrag inzake de verzameling, afgifte en inname
    van afval in de Rijn- en binnenvaart (Trb. 1996, 293), alsmede de artikelen 1, derde lid, 2f, 28c, 28e, 28i en
    28k van de Wet verontreiniging oppervlaktewateren, de artikelen 8.44, 10.4 en 10.35a, tweede lid, van de Wet
    milieubeheer, artikel 929a, eerste en tweede lid, van Boek 8 van het Burgerlijk Wetboek en de artikelen 4:77 en
    4:79 van de Algemene wet bestuursrecht;

    De Raad van State gehoord (advies van 31 januari 2000, nr. W09.990513/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 11 december 2000, nr. CDJZ/WVW 2000-
    1290, Centrale Directie Juridische Zaken, uitgebracht mede namens Onze Ministers van Volkshuisvesting, Ruimtelijke
    Ordening en Milieubeheer en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.a
    text: 'scheepsafvalstoffen: de in de onderdelen b tot en met d nader bepaalde afvalstoffen;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.b
    text: |-
      olie- en vethoudende scheepsafvalstoffen: afgewerkte olie, bilgewater en overige olie- of vethoudende afvalstoffen
      die bij het in bedrijf zijn of het onderhoud van een schip aan boord ontstaan;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.c
    text: |-
      afval van de lading: afval en afvalwater, dat in verband met de lading aan boord van het schip ontstaat. Hiertoe
      behoren niet de restlading, dampen en overslagresten, bedoeld in Deel B van de Uitvoeringsregeling;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.d
    text: |-
      overige scheepsafvalstoffen: afvalwater, huisvuil, zuiveringsslib, slops en gevaarlijke afvalstoffen, voorzover die
      afvalstoffen bij het in bedrijf zijn of het onderhoud van een schip aan boord ontstaan en niet vallen onder olie-
      en vethoudende scheepsafvalstoffen of afval van de lading;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.e
    text: |-
      afvalstoffen: alle stoffen, preparaten of voorwerpen waarvan de houder zich ontdoet, voornemens is zich te ontdoen
      of zich moet ontdoen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.f
    text: 'afvalwater: alle water waarvan de houder zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.g
    text: |-
      schip: een vaartuig dat feitelijk wordt gebruikt dan wel geschikt is om te worden gebruikt als middel voor
      verplaatsing te water, alsmede een drijvend werktuig;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.h
    text: 'schipper: de gezagvoerder van een schip of degene, die deze vervangt;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.i
    text: 'zeeschip: een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.j
    text: |-
      exploitant van een schip: de eigenaar, de rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik
      van het schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.k
    text: |-
      gemotoriseerd schip: een schip waarvan de hoofd- of hulpmotoren, met uitzondering van ankerliermotoren,
      verbrandingsmotoren zijn;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.l
    text: |-
      ontvangstvoorziening: een vaste of mobiele inrichting, door de bevoegde autoriteiten toegelaten voor het in
      ontvangst nemen van scheepsafval of dampen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.m
    text: 'exploitant van de ontvangstvoorziening: degene die beroepsmatig een ontvangstvoorziening exploiteert;'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
  - number: 1.1.n
    text: |-
      bevoegde autoriteit: de autoriteit of autoriteiten die ten aanzien van een vaarweg voor de toepassing van
      [artikel 1.15, tweede lid, van het Rijnvaartpolitiereglement 1995][ref1], [artikel 1.15, tweede lid, van het
      Binnenvaartpolitiereglement](onbekend), [artikel 1.15 van het Scheepvaartreglement Gemeenschappelijke Maas]
      (onbekend) of [artikel 43 van het Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen][ref2],
      is of zijn aangewezen bij of krachtens het desbetreffende reglement dan wel, binnen het toepassingsgebied
      van het [Scheepvaartreglement Westerschelde 1990][ref3] of het [Scheepvaartreglement Eemsmonding][ref4]:
      de Rijkshavenmeester Westerschelde, onderscheidenlijk de bevoegde autoriteit, aangewezen ingevolge
      [artikel 1, eerste lid, onderdeel i, van het Scheepvaartreglement Eemsmonding][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0006923#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0005393
      [ref4]: https://wetten.overheid.nl/BWBR0004552
      [ref5]: https://wetten.overheid.nl/BWBR0004552#Artikel1
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006923
        artikel: '1'
      - id: ref2
