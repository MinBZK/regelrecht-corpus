      - id: ref6
        bwb_id: BWBR0012019
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '53.2'
    text: |-
      Indien bij de losverklaring een aanvullende verklaring wordt gevoegd overeenkomstig het bij regeling van Onze
      Minister vastgestelde model, is het [Besluit melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen][ref1] op de
      desbetreffende overbrenging van afvalstoffen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017294
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017294
  - number: '53.3'
    text: |-
      Aansluitend aan de toepassing van het bepaalde in de [paragrafen 3.4][ref1] en [3.5][ref2] worden de toepasselijke
      rubrieken van een losverklaring, overeenkomstig het bij regeling van Onze Minister vastgestelde model, in drievoud
      ingevuld en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '53.4'
    text: |-
      De losverklaring wordt na de toepassing van het eerste lid in drievoud voorgelegd aan de schipper dan wel, indien
      het schip niet onder gezag van een schipper staat, aan de exploitant van het schip.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel53
  - number: '53.5'
    text: |-
      Aan het eerste en het tweede lid alsmede de [artikelen 54][ref1], [56][ref2], [57][ref3], [66][ref4] en [68][ref5]
      kan in overeenstemming tussen degene die de losverklaring opstelt en de schipper dan wel, indien het schip niet
      onder gezag van een schipper staat, de exploitant van het schip en, indien toepassing moet worden gegeven aan
      [paragraaf 3.9][ref6], degene die de ontvangstvoorziening exploiteert, langs elektronische weg uitvoering worden
      gegeven, mits voldaan wordt aan de bij regeling van Onze Minister aangegeven waarborgen voor de echtheid van de
      losverklaring, met inbegrip van de ondertekening, en de controleerbaarheid van de losverklaring aan boord dan wel
      in de bedrijfsadministratie van de exploitant van het schip, alsmede in de bedrijfsadministratie van degene die de
      losverklaring heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel66
      [ref5]: https://wetten.overheid.nl/BWBR0012019#Artikel68
      [ref6]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '56'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '57'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3.9'
      - id: ref5
        bwb_id: BWBR0012019
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '3.9'
      - id: ref6
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '54.1'
    text: |-
      De schipper vult de toepasselijke rubrieken van de hem overeenkomstig [artikel 53, vierde lid][ref1], voorgelegde
      losverklaring in drievoud in en ondertekent deze.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '54.2'
    text: |-
      De schipper bezorgt na de ondertekening een exemplaar van de losverklaring terug aan degene die de losverklaring
      heeft opgesteld.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel54
  - number: '55.1'
    text: |-
      De schipper verlaat met het schip de laadplaats na het laden niet eerder dan nadat hij zich er van vergewist heeft,
      dat de overslagresten zijn verwijderd.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
  - number: '55.2'
    text: 'De schipper verlaat met het schip de losplaats na het lossen niet eerder dan nadat:'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
  - number: 55.2.a
    text: hij zich er van vergewist heeft, dat
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
  - number: 55.2.a.1°
    text: de overslagresten zijn verwijderd;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
  - number: 55.2.a.2°
    text: alle geloste laadruimen zijn nagelost of ladingtanks nagelensd;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
  - number: 55.2.a.3°
    text: |-
      voldaan is aan de wasverplichting overeenkomstig de losstandaarden en de afgifte- en innamevoorschriften
      van aanhangsel III behorende bij de Uitvoeringsregeling, indien die van toepassing is, dan wel hem daartoe
      overeenkomstig [artikel 47][ref1] een voorziening is toegewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 55.2.a.4°
    text: |-
      indien [artikel 45][ref1] van toepassing of van overeenkomstige toepassing is, het afvalwater dat ladingrestanten
      bevat is ingenomen dan wel hem daartoe een ontvangstvoorziening is toegewezen, en


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 55.2.a.5°
    text: |-
      voldaan is aan de ontgassingsverplichting en de toepasselijke ontgassingsstandaarden van aanhangsel IIIa behorende
      bij de Uitvoeringsregeling, dan wel hem daartoe overeenkomstig [artikel 47][ref1] een voorziening is toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 55.2.b
    text: |-
      hij voldaan heeft aan het bepaalde in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '56'
    text: |-
      De schipper draagt er zorg voor dat de overeenkomstig [artikel 53][ref1] ontvangen verklaringen het transport
      begeleiden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '57'
    text: |-
      Het ingevolge [artikel 54, tweede lid][ref1], terug ontvangen exemplaar van de losverklaring wordt gedurende ten
      minste zes maanden na afgifte in de bedrijfsadministratie bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel54
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '54'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '58.1'
    text: |-
      Indien de laadruimten en ladingtanks van schepen worden ingezet voor verenigbare transporten wordt dit schriftelijk
      aangetoond door de schipper. De ladingontvanger dan wel de overslaginstallatie vult in dat geval de toepasselijke
      rubriek van de losverklaring in.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
  - number: '58.2'
    text: |-
      Een ladingtank van schepen die verenigbare transporten uitvoeren hoeft niet ontgast te worden voor zover bij een
      volgende belading de dampen overeenkomstig Aanhangsel IIIa door de overslaginstallatie worden opgevangen en niet in
      de atmosfeer terechtkomen. De vervoerder dient dit schriftelijk in de losverklaring te kunnen aantonen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
  - number: '58.3'
    text: |-
      De schipper zorgt ervoor dat het in de eerste regel van het eerste lid bedoelde schriftelijke bewijs tot na de
      beëindiging van het lossen van de verenigbare vervolglading aan boord aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
  - number: '58.4'
    text: |-
      Indien op het moment van het lossen de vervolglading nog niet bekend is, maar verwacht wordt dat die verenigbaar
      zal zijn, kan de toepassing van de [artikelen 45][ref1] en [47][ref2] bedoelde maatregelen worden uitgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '58.5'
    text: |-
      De in [artikel 70][ref1] bedoelde afzender en de in [artikel 71][ref2] bedoelde ontvanger wijzen voorlopig een
      ontvangstvoorziening als bedoeld in [artikel 47][ref3] aan en vullen dit in de toepasselijke rubrieken op de
      losverklaring in.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '70'
        hoofdstuk: '3'
        paragraaf: '3.10'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '71'
        hoofdstuk: '3'
        paragraaf: '3.10'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '58.6'
    text: |-
      Een ladingruim en ladingtank behoeven niet gewassen te worden wanneer, voordat de in het vierde lid bedoelde
      ontvangstvoorziening wordt aangelopen, aantoonbaar vaststaat dat de vervolglading verenigbaar is. De schipper
      vult dit in bij de toepasselijke rubriek op de losverklaring en zorgt ervoor dat deze tot en met het lossen van de
      verenigbare vervolglading aan boord aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel58
  - number: '59'
    text: |-
      Indien een lading wordt gelost van een schip dat, blijkens de door de ladingontvanger dan wel de
      overslaginstallatie ingevulde toepasselijke rubriek op de losverklaring, wordt ingezet ten behoeve van
      eenheidstransporten zijn met betrekking tot dat lossen niet van toepassing:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel59
  - number: 59.a
    text: |-
      de [artikelen 36][ref1], [42][ref2], [43][ref3] en [artikel 55, tweede lid, onderdeel a, onder 2°][ref4], en;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0012019#Artikel55
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref4
        bwb_id: BWBR0012019
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 59.b
    text: |-
      de [artikelen 45][ref1], [47][ref2] en [artikel 55, tweede lid, onderdeel a, onder 3° en 4°][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel55
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '61'
    text: |-
      Ingeval van eenheidstransporten wordt voor de aanvang van het laden overeenkomstige toepassing gegeven aan de
      [artikelen 45][ref1] en [47][ref2] ten aanzien van het regenwater en het buiswater dat na beëindiging van de
      voorafgaande lossing in het laadruim terecht is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '62.1'
    text: |-
      In afwijking van het verbod van [artikel 4][ref1] kan afvalwater dat ladingrestanten bevat van een goederensoort
      waarvoor in bij regeling van Onze Minister te bepalen gevallen een losstandaard is aangegeven, in een
      oppervlaktewaterlichaam worden gebracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 62.1.a
    text: |-
      zodanig afvalwater ingevolge [artikel 45][ref1] op of in het schip is achtergelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 62.1.b
    text: |-
      de restlading overeenkomstig het bepaalde in [paragraaf 3.4][ref1] is verwijderd uit het laadruim of de ladingtank
      en het leidingsysteem en


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 62.1.c
    text: |-
      een en ander blijkt uit een losverklaring die voldoet aan het bepaalde in [paragraaf 3.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '62.2'
    text: |-
      In afwijking van het verbod van [artikel 4][ref1] kan voorts in een oppervlaktewaterlichaam worden gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 62.2.a
    text: |-
      ballastwater uit ballasttanks, ballastwater dat blijkens een losverklaring welke voldoet aan het bepaalde in
      [paragraaf 3.6][ref1] afkomstig is uit een gewassen laadruim of ladingtank, regenwater of buiswater;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 62.2.b
    text: |-
      waswater dat afkomstig is van een bezemschone gangboord of van een andere licht verontreinigde oppervlakte van het
      schip of
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
  - number: 62.2.c
    text: |-
      afvalwater dat ladingrestanten bevat van een goederensoort waarvoor in bij regeling van Onze Minister te
      bepalen gevallen een losstandaard is aangegeven en dat, blijkens een losverklaring die voldoet aan het bepaalde
      in [paragraaf 3.6][ref1], afkomstig is uit een laadruim of ladingtank waaruit de restlading is verwijderd
      overeenkomstig het bepaalde in [paragraaf 3.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '62.3'
    text: |-
      In afwijking van het verbod van [artikel 4][ref1] kunnen dampen, ten aanzien waarvan de afgifte aan de atmosfeer
      door middel van ventileren overeenkomstig Aanhangsel IIIa behorende bij de Uitvoeringsregeling uitdrukkelijk is
      toegestaan, in de atmosfeer worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '62.4'
    text: |-
      In afwijking van het verbod van [artikel 4][ref1] kunnen dampen, met inachtneming van de bepalingen van aanhangsel
      IIIa, behorende bij de Uitvoeringsregeling en onderdeel 7.2.3.7 van het ADN, worden uitgestoten indien dit wordt
      vereist door een onvoorzien verblijf op de scheepswerf of door een onvoorziene reparatie ter plaatse door een
      scheepswerf of een andere gespecialiseerde onderneming en de dampen niet naar een ontvangstvoorziening kunnen
      worden afgevoerd. Daarbij moet de plaats waar de dampen worden uitgestoten alsmede de hoeveelheid en de aard van de
      stof of de dampen zo nauwkeurig mogelijk worden aangeven.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '63'
    text: |-
      In afwijking van [artikel 6][ref1] behoeft de dichtstbijzijnde bevoegde autoriteit niet te worden gewaarschuwd
      indien afvalwater dat ladingrestanten bevat van een goederensoort waarvoor in kolom 3 of 4 van de tabel een
      losstandaard is aangegeven, in een oppervlaktewaterlichaam geraakt of dreigt te geraken.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel6
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '64.1'
    text: |-
      Indien afvalwater ingevolge het bepaalde in [artikel 47][ref1] of [61][ref2] moet worden afgegeven, brengt de
      schipper het afvalwater over naar de hem toegewezen ontvangstvoorziening en biedt het aldaar aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel61
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '61'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '64.2'
    text: |-
      Indien dampen ingevolge het bepaalde in [artikel 47][ref1] moeten worden afgegeven, brengt de schipper deze over
      naar de hem toegewezen ontvangstvoorziening en biedt deze aldaar aan.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '65'
    text: |-
      De schipper draagt er zorg voor dat afvalwater dat ladingrestanten van een goederensoort bevat aan boord zo veel
      mogelijk gescheiden wordt gehouden van afvalwater dat ladingrestanten bevat van een andere goederensoort.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel65
  - number: '66'
    text: |-
      Bij het afgeven van afvalwater dat ladingrestanten bevat aan een ontvangstvoorziening legt de schipper in tweevoud
      de door hem ondertekende losverklaring voor aan degene die de ontvangstvoorziening exploiteert of een door deze
      aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel66
  - number: '67'
    text: |-
      Degene die een ontvangstvoorziening exploiteert, draagt er zorg voor dat afvalwater dat ingevolge
      [artikel 64][ref1] wordt aangeboden, wordt ingenomen op de ontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel64
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '64'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '68.1'
    text: |-
      Het in ontvangst nemen van afvalwater dat ladingrestanten bevat wordt bevestigd door invulling en ondertekening van
      de daartoe bestemde rubrieken van de ingevolge [artikel 66][ref1] voorgelegde losverklaring in tweevoud voorgelegde
      verklaringen. De ontvangstvoorziening bezorgt na ondertekening een exemplaar van de ondertekende losverklaring
      terug aan de schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel66
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '68.2'
    text: |-
      Indien het schip, overeenkomstig [artikel 47, tweede lid][ref1], naar een ontvangstvoorziening voor het ontgassen
      is doorverwezen bevestigt de exploitant van deze voorziening de ontgassing van het schip in de losverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '68.3'
    text: |-
      De exploitant van de ontvangstvoorziening voor het ontgassen dient een kopie van de door hem en de schipper
      ingevulde en ondertekende losverklaring gedurende ten minste zes maanden na afgifte in zijn bedrijfsadministratie
      te bewaren.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
  - number: '68.4'
    text: |-
      Degene die de ontvangstvoorziening exploiteert als bedoeld in [artikel 67][ref1] bewaart een exemplaar van de door
      hem, de ladingontvanger of de overslaginstallatie, en de schipper ingevulde en ondertekende losverklaring gedurende
      ten minste zes maanden na afgifte in zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel67
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '67'
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: '68.5'
    text: |-
      De schipper bewaart de van de ontvangstvoorziening terugontvangen ondertekende losverklaring gedurende ten minste
      zes maanden aan boord.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
  - number: '68.6'
    text: |-
      De exploitant van het schip bewaart de van de ontvangstvoorziening terugontvangen ondertekende losverklaring in
      zijn bedrijfsadministratie.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel68
  - number: '69.1'
    text: |-
      De vervoerder stelt een schip voor vervoer van lading aan de afzender ter beschikking met bezemschone laadruimen
      dan wel nagelensde of ontgaste ladingtanks en vrij van overslagresten.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel69
  - number: '69.2'
    text: |-
      Indien het schip voor het laden niet overeenstemt met de voorgeschreven losstandaard en indien de ladingontvanger
      of afzender van het vorige transport zijn verplichtingen niet is nagekomen, draagt de vervoerder de kosten voor het
      nalossen en:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel69
  - number: 69.2.a
    text: bij het wassen, de kosten voor het wassen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel69
  - number: 69.2.b
    text: bij het ontgassen, de kosten voor het ontgassen,
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel69
  - number: '70.1'
    text: |-
      De afzender is jegens de ontvanger en de vervoerder verplicht ter zake van het laden van een schip de in de
      [artikelen 41, eerste lid][ref1], en [61][ref2] bedoelde maatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel61
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '61'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '70.2'
    text: |-
      De afzender is jegens de ontvanger en de vervoerder verplicht ter zake van het lossen van vloeibare lading van of
      uit een schip
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
  - number: 70.2.a
    text: |-
      de in de [artikelen 41, tweede lid][ref1], en [43][ref2] bedoelde maatregelen te treffen;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel43
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 70.2.b
    text: |-
      de in de [artikelen 45][ref1] en [47][ref2] bedoelde maatregelen te treffen, voor zover het betreft de
      wasverplichting en het daarbij ontstane waswater, indien het schip goederen heeft vervoerd waarvan de
      ladingrestanten overeenkomstig de losstandaarden en afgifte- en innamevoorschriften van aanhangsel III bij de
      Uitvoeringsregeling niet met het waswater in het water geloosd mogen worden;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 70.2.c
    text: |-
      de in de [artikelen 45][ref1] en [47][ref2] bedoelde maatregelen te treffen, voor zover het betreft de
      ontgassingsverplichting en de daarbij ontstane dampen, indien uit de laatst afgegeven losverklaring blijkt dat het
      laadruim, onderscheidenlijk de ladingtank, na de vorige lossing ontgast is, en


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 70.2.d
    text: |-
      de kosten te dragen van inname van het onder b bedoelde waswater of de onder c bedoelde dampen door een
      ontvangstvoorziening, alsmede voor wachttijden en omwegen die zijn ontstaan als gevolg van de toepassing van de
      onder a en b bedoelde maatregelen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel70
  - number: '71'
    text: |-
      De ontvanger is jegens de afzender en de vervoerder verplicht ter zake van het lossen van droge lading van of uit
      een schip:
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
  - number: 71.a
    text: |-
      de in de [artikelen 41, tweede lid][ref1], en [42][ref2] bedoelde maatregelen te treffen;


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel42
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 71.b
    text: |-
      de in de [artikelen 45][ref1] en [47][ref2] bedoelde maatregelen te treffen, voor zover het betreft de
      wasverplichting en het daarbij ontstane waswater, indien het schip goederen heeft vervoerd waarvan de
      ladingrestanten overeenkomstig de losstandaarden en afgifte- en innamevoorschriften van aanhangsel III bij de
      Uitvoeringsregeling niet met het waswater in het water geloosd mogen worden en


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel47
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '47'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 71.c
    text: |-
      ten aanzien van regenwater of buiswater dat in het laadruim is geraakt na aanvang van het laden en voordat het
      lossen overeenkomstig het bepaalde in [paragraaf 3.4][ref1] is beëindigd, de in [artikel 45][ref2] bedoelde
      maatregelen te treffen, tenzij overeengekomen was dat het vervoer afgedekt zou plaatsvinden, en


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012019
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 71.d
    text: |-
      de kosten te dragen van inname van het onder b bedoelde waswater en het onder c bedoelde regenwater of buiswater
      door een ontvangstvoorziening, alsmede voor wachttijden en omwegen die zijn ontstaan als gevolg van de toepassing
      van de onder a, b en c bedoelde maatregelen;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
  - number: 71.e
    text: |-
      de in [artikel 53][ref1] bedoelde maatregel te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel53
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '72'
    text: |-
      Indien de afzender dan wel de ontvanger gebruik maakt van een overslaginstallatie, treedt de exploitant van die
      installatie voor de toepassing van [artikel 70, eerste lid, en tweede lid, onder a en b][ref1], onderscheidenlijk
      [artikel 71, onder a, b, c en e][ref2], in de plaats van de afzender, onderscheidenlijk de ontvanger, met dien
      verstande dat hij slechts verplicht is de kosten van de in die bepalingen bedoelde maatregelen te dragen voorzover
      het betreft de kosten van de toepassing van [artikel 41][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel41
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '70'
        hoofdstuk: '3'
        paragraaf: '3.10'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '71'
        hoofdstuk: '3'
        paragraaf: '3.10'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '73.1'
    text: |-
      De schipper draagt er zorg voor dat huisvuil, slops, zuiveringsslib en klein gevaarlijk afval aan boord naar
      categorie gescheiden worden gehouden en gescheiden worden aangeboden bij een ontvangstvoorziening.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel73
  - number: '73.2'
    text: |-
      Huisvuil wordt, indien mogelijk, gescheiden naar de categorieën papier, glas, overige te hergebruiken stoffen en
      overig huisvuil afgegeven.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel73
  - number: '74.1'
    text: |-
      In afwijking van het bepaalde in [artikel 73][ref1] rust met betrekking tot een passagiersschip dat is uitgerust
      met een boordzuiveringsinstallatie voor afvalwater de verplichting tot aanbieden van het zuiveringsslib van die
      installatie bij een ontvangstvoorziening op de exploitant van dat schip.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel73
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '74.2'
    text: |-
      De schipper van een passagiersschip dient zeker te stellen dat het bedrijfsafvalwater uit keukens, eetruimten,
      wasruimten en bijkeukens, daaronder begrepen toiletwater, op een passende wijze aan boord van het schip
      wordt verzameld en bij een ontvangstvoorziening wordt afgegeven, voor zover het passagiersschip niet over een
      zuiveringsinstallatie als bedoeld in [artikel 76][ref1], beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel76
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '75'
    text: |-
      Degene die een ontvangstvoorziening exploiteert, draagt er zorg voor dat de ingevolge [artikel 73][ref1]
      of [74][ref2] aangeboden afvalstoffen worden ingenomen op de ontvangstvoorziening en aldaar gescheiden worden
      gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel74
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '74'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '76'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan bedrijfsafvalwater uit keukens, eetruimten,
      wasruimten en bijkeukens, daaronder begrepen toiletwater, vanaf hotelschepen met meer dan 50 slaapplaatsen
      of vanaf andere passagiersschepen die toegelaten zijn voor het vervoer van meer dan 50 passagiers in een
      oppervlaktewaterlichaam worden gebracht, voorzover het afvalwater is behandeld in een zuiveringsinstallatie die
      voldoet aan bij regeling van Onze Minister gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '77.1'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan huishoudelijk afvalwater dan wel bedrijfsafvalwater
      uit keukens, eetruimten, wasruimten en bijkeukens, daaronder begrepen toiletwater, in een oppervlaktewaterlichaam
      worden gebracht vanaf andere dan de in [artikel 76][ref2] bedoelde schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel76
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '76'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '77.2'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan toiletwater, afkomstig van zeeschepen:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 77.2.a
    text: met minder dan 50 slaapplaatsen, of;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: 77.2.b
    text: die bestemd zijn voor het vervoer van minder dan 50 passagiers, of;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: 77.2.c
    text: waar minder dan 50 personen aan boord zijn,
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: '77.3'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan bedrijfsafvalwater uit keukens, eetruimten,
      wasruimten, bijkeukens en toiletwater afkomstig van zeeschepen:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 77.3.a
    text: met meer dan 50 slaapplaatsen, of;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: 77.3.b
    text: die bestemd zijn voor het vervoer van meer dan 50 passagiers, of;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: 77.3.c
    text: waar meer dan 50 personen aan boord zijn,
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel77
  - number: '78'
    text: |-
      Het nationaal instituut organiseert een doelmatig en doeltreffend beheer van olie- en vethoudende
      scheepsafvalstoffen, overeenkomstig het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel78
  - number: '79'
    text: |-
      Het nationaal instituut geeft op zodanige wijze uitvoering aan het bepaalde in [artikel 78][ref1] dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 79.a
    text: |-
      een voldoende dicht net van ontvangstvoorzieningen, met voldoende capaciteit voor de inzameling van olie- en
      vethoudende scheepsafvalstoffen op de voet van onderdeel b, beschikbaar is langs de Nederlandse vaarwegen, alsmede
      voorzieningen met voldoende capaciteit voor het beheer van op die voet ingezamelde afvalstoffen beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel79
  - number: 79.b
    text: |-
      indien olie- en vethoudende scheepsafvalstoffen overeenkomstig [artikel 15][ref1] worden aangeboden bij een
      ontvangstvoorziening als bedoeld onder a, die afvalstoffen aldaar in ontvangst worden genomen zonder dat daarbij
      kosten of vergoedingen in rekening worden gebracht aan de eigenaar of de exploitant van het schip, dan wel de
      schipper.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel15
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '80.1'
    text: |-
      Het nationaal instituut houdt een overzicht bij van adressen en verdere bereikbaarheidsgegevens van de in
      [artikel 79][ref1] bedoelde ontvangstvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel79
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '79'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '80.2'
    text: |-
      Het nationaal instituut verstrekt ter gelegenheid van de verstrekking van een olie-afgifteboekje als bedoeld in
      [artikel 14][ref1] een exemplaar van het overzicht aan de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel14
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '80.3'
    text: |-
      Het nationaal instituut geeft aan belanghebbenden in de bedrijfstak van de scheepvaart kennis van wijzigingen van
      het overzicht in daartoe geschikte dag- of nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel80
  - number: '80.4'
    text: |-
      Het nationaal instituut zendt een exemplaar van het overzicht en elke wijziging daarvan toe aan het internationaal
      orgaan.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel80
  - number: '80.5'
    text: |-
      Het nationaal instituut geeft op andere daartoe geschikte wijzen voorlichting over het beheer van olie- en
      vethoudende scheepsafvalstoffen aan belanghebbenden in de bedrijfstak van de scheepvaart.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel80
  - number: '81'
    text: |-
      Het nationaal instituut draagt zorg voor de financiering van het in [artikel 78][ref1] bedoelde beheer uit de
      opbrengst van de afvalbeheerbijdrage en de verevening.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '82.1'
    text: |-
      Ter uitvoering van [artikel 81][ref1] draagt het nationaal instituut zorg voor:


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel81
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '81'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 82.1.a
    text: |-
      het invoeren en het in stand houden van het door Onze Minister nader te omschrijven digitale systeem voor het
      betalen van de afvalbeheerbijdrage;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: 82.1.b
    text: het Nederlandse aandeel in de verevening;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: 82.1.c
    text: |-
      het na het openen van een rekening aan de eigenaar van een gemotoriseerd schip, kosteloos namens Onze Minister
      verstrekken van maximaal twee ED-kaarten per schip;
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: 82.1.d
    text: het op verzoek van de leverancier kosteloos verstrekken van een betaalterminal per bunkerfaciliteit; en
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: 82.1.e
    text: |-
      de uitvoering van een ministeriële regeling ingevolge [artikel 29][ref1], voor zover het in die regeling is
      bepaald, alsmede voorlichting over die regeling aan belanghebbenden in de bedrijfstak van de scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel29
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2.7'
  - number: '82.2'
    text: |-
      Het nationaal instituut draagt zorg voor de geheimhouding van de gegevens, die het met betrekking tot de ED-kaart
      onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: '82.3'
    text: |-
      Op verzoek van Onze Minister verstrekt het nationaal instituut inzage in het digitale systeem aan een door deze
      minister aangewezen dienst teneinde te onderzoeken of de verschuldigde afvalbeheerbijdrage is betaald.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: '82.4'
    text: |-
      Bij regeling van Onze Minister kunnen administratieve verplichtingen van het nationaal instituut jegens de houder
      van de ED-kaart in verband met het digitaal betalen van de afvalbeheerbijdrage worden geregeld.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel82
  - number: '84.1'
    text: |-
      Het nationaal instituut neemt deel aan de verevening overeenkomstig het bepaalde in de artikelen 4.02, eerste en
      derde lid, en 4.03 van de Uitvoeringsregeling en hetgeen krachtens artikel 10, derde lid, van het verdrag ter zake
      is bepaald in het Huishoudelijk Reglement van het internationaal orgaan.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel84
  - number: '84.2'
    text: |-
      Door het nationaal instituut ontvangen subsidiebedragen uit hoofde van
      [artikel 39h, eerste lid, onderdeel b, van de Binnenvaartwet][ref1] worden in het kader van de verevening
      aangemerkt als opbrengst van de afvalbeheerbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel39h
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: 39h
  - number: '85'
    text: |-
      Het nationaal instituut wijst twee vertegenwoordigers in het internationaal orgaan aan, waarvan één afkomstig is
      uit de bedrijfstak van de binnenvaart.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel85
  - number: '86'
    text: |-
      Het nationaal instituut draagt er zorg voor dat de ingevolge [artikel 85][ref1] aangewezen vertegenwoordigers
      deelnemen aan de werkzaamheden van het internationaal orgaan in overeenstemming met het bepaalde bij of krachtens
      artikel 10 van het verdrag en artikel 4.01 van de Uitvoeringsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel85
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '87.1'
    text: |-
      Het nationaal instituut houdt een administratie bij ten aanzien van hetgeen door dat instituut wordt verricht ter
      uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel87
  - number: '87.2'
    text: |-
      Het nationaal instituut draagt er zorg voor dat een sluitende registratie van het in [artikel 78][ref1] bedoelde
      beheer beschikbaar is, welke het nationaal instituut in staat stelt te voldoen aan zijn verplichtingen ingevolge
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel78
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '78'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '88.1'
    text: |-
      Het nationaal instituut stelt jaarlijks voor 1 juli een rapport op over de uitvoering van zijn taken in het
      afgelopen kalenderjaar en de vooruitzichten ter zake voor de eerstkomende 5 kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel88
  - number: '88.2'
    text: Het nationaal instituut brengt het rapport ter kennis van Onze Minister en het internationaal orgaan.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel88
  - number: '89'
    text: |-
      Het nationaal instituut neemt bij de uitvoering van zijn taken het gestelde in het circulair materialenplan,
      bedoeld in [artikel 10.3 van de Wet milieubeheer][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '90.1'
    text: Het nationaal instituut neemt bij de uitvoering van zijn taken een door Onze Minister gegeven aanwijzing in acht.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel90
  - number: '90.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid kan worden vastgesteld ten behoeve van een doelmatige en doeltreffende
      uitvoering van het verdrag.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel90
  - number: '92'
    text: |-
      Onze Minister verschaft, onverminderd het bepaalde in [artikel 2:5 van de Algemene wet bestuursrecht][ref1], aan
      het nationaal instituut de nodige gegevens en inlichtingen ten behoeve van de uitvoering van de taken door dat
      instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '93'
    text: |-
      De subsidie-ontvanger is verplicht de taken van het nationaal instituut uit te voeren overeenkomstig het bepaalde
      in dit besluit.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel93
  - number: '94'
    text: |-
      [Artikel 4:76 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing op het financieel verslag
      van de subsidie-ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '95.1'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt de accountant
      tevens de naleving van de aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '95.2'
    text: |-
      Onze Minister stelt een aanwijzing vast over de reikwijdte en de intensiteit van de controle, bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '97'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], en van [artikel 45][ref2] kan tot het tijdstip liggende
      vijf jaar na het in [artikel 101, eerste lid][ref3], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit
      te bepalen tijdstip, afvalwater dat ingevolge artikel 45 in de bedrijfsriolering gebracht zou moeten worden, in een
      oppervlaktewaterlichaam worden gebracht, indien ten minste de losstandaard bezemschoon is bewerkstelligd voor het
      desbetreffende laadruim.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel101
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '45'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '101'
        hoofdstuk: '6'
  - number: '98'
    text: |-
      In afwijking van het bepaalde in [artikel 42][ref1] is tot het tijdstip liggende vijf jaar na het in
      [artikel 101, eerste lid][ref2], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit te bepalen tijdstip,
      toegelaten dat in gevallen waarin ingevolge [artikel 42][ref3] bij het nalossen de losstandaard vacuümschoon zou
      moeten worden bereikt, de losstandaard bezemschoon wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel42
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '101'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '99.1'
    text: |-
      In afwijking van het bepaalde in [artikel 37][ref1] is het tot het tijdstip liggende vijf jaar na het in
      [artikel 101, eerste lid][ref2], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit te bepalen tijdstip,
      toegelaten een schip voor vervoer van vloeibare lading ter beschikking te stellen dat niet beschikt over een
      nalenssysteem als bedoeld in [artikel 37][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel101
      [ref3]: https://wetten.overheid.nl/BWBR0012019#Artikel37
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '101'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0012019
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '99.2'
    text: |-
      In afwijking van het bepaalde in [artikel 43][ref1] is het tot het tijdstip liggende vijf jaar na het in
      [artikel 101, eerste lid][ref2], bedoelde tijdstip, dan wel een eerder bij koninklijk besluit te bepalen tijdstip,
      verplicht de in de ladingtank en het leidingsysteem aanwezige restlading zo veel mogelijk te verwijderen met behulp
      van de daarvoor beschikbare voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0012019#Artikel101
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0012019
        artikel: '101'
        hoofdstuk: '6'
  - number: '100'
    text: |-
      In afwijking van het verbod, bedoeld in [artikel 4][ref1], kan tot een door Onze Minister te bepalen tijdstip
      bedrijfsafvalwater uit keukens, eetruimten, wasruimten en bijkeukens, daaronder begrepen toiletwater, vanaf
      hotelschepen met meer dan 50 slaapplaatsen, onderscheidenlijk vanaf andere passagiersschepen die toegelaten zijn
      voor het vervoer van meer dan 50 passagiers, in een oppervlaktewaterlichaam worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012019#Artikel4
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012019
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 100a
    text: |-
      Dit besluit berust mede op de [artikelen 4.3][ref1] en [4.5 van de Omgevingswet][ref2] en de
      [artikelen 9.5.2.][ref3] en [10.40a, tweede lid, van de Wet milieubeheer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '101'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel101
  - number: '102'
    text: 'Dit besluit wordt aangehaald als: Scheepsafvalstoffenbesluit Rijn- en binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0012019/2025-12-30#Artikel102
