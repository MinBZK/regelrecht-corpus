        artikel: '2'
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2005, met dien verstande dat [artikel 6, eerste lid][ref1],
      voor het eerst wordt toegepast over het jaar 2006. Indien het Staatsblad waarin het besluit wordt geplaatst, wordt
      uitgegeven na 31 december 2004, treedt het besluit in werking met ingang van de dag na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 2005.


