articles:
  - number: '1'
    text: |-
      In het bepaalde bij of krachtens dit besluit wordt verstaan onder:

      a. kosten van verstrekkingen en uitkeringen: kosten van verstrekkingen en uitkeringen ter zake van verleende zorg
      als bedoeld in [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1];

      b. beheerskosten: de beheerskosten van de in de [Algemene Wet Bijzondere Ziektekosten][ref2] geregelde verzekering,
      waaronder begrepen de kosten van controle in het kader van die verzekering;

      c. centraal administratiekantoor: het centraal administratiekantoor, bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref3] mede in zijn hoedanigheid van centraal
      betaalkantoor als bedoeld in het [Besluit regeling vergoeding Bijzondere Ziektekostenverzekering][ref4];

      d. uitvoeringsorgaan: een orgaan als bedoeld in
      [artikel 1, onderdeel h, van de Algemene Wet Bijzondere Ziektekosten][ref5];

      e. verbindingskantoor: een verbindingskantoor als bedoeld in het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref6];

      f. onverantwoorde uitgaven: uitgaven waarvan het College toezicht heeft vastgesteld dat ze niet noodzakelijk zijn
      voor de uitvoering van de verzekering ingevolge de [Algemene Wet Bijzondere Ziektekosten][ref7];

      g. beheerskostenbudget: de ten laste van het Algemeen Fonds Bijzondere Ziektekosten voor het centraal
      administratiekantoor, de uitvoeringsorganen en de verbindingskantoren beschikbare middelen ter dekking van de
      voor de uitvoering van de [Algemene Wet Bijzondere Ziektekosten][ref8] te maken beheerskosten die zij in hun
      hoedanigheid maken.


