  - number: '6'
    text: |-
      De reserve uitvoering [AWBZ][ref1] ultimo enig jaar, bedoeld in [artikel 5, vijfde lid][ref2], mag voor
      verbindingskantoren maximaal 20% en voor het centraal administratiekantoor maximaal 5% van het beheerskostenbudget
      van dat jaar bedragen. Indien het College zorgverzekeringen vaststelt dat de reserve het gestelde maximum te boven
      gaat, stort het verbindingskantoor of het centraal administratiekantoor het door het College zorgverzekeringen
      vastgestelde bedrag van de overschrijding binnen vier weken in het Algemeen Fonds Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018059#Artikel5
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018059
        artikel: '5'
  - number: '7'
    text: |-
      Het College toezicht is bevoegd opgaven en gegevens van een uitvoeringsorgaan, verbindingskantoor en het centraal
      administratiekantoor, die van invloed zijn op de omvang van de ten laste van het Algemeen Fonds Bijzondere
      Ziektekosten beschikbare middelen en op de hoogte van de vergoedingen en uitkeringen ingevolge dit besluit, op hun
      juistheid te beoordelen en te verbeteren.
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel7
  - number: '8'
    text: |-
      Het College zorgverzekeringen bepaalt met inachtneming van het
      [Administratiebesluit Bijzondere Ziektekostenverzekering][ref1] en het bepaalde bij en krachtens het
      [Besluit regeling vergoeding bijzondere ziektekostenverzekering][ref2], de wijze van betaalbaarstelling van de
      uitkeringen ingevolge dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003585
      [ref2]: https://wetten.overheid.nl/BWBR0002777
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel8
    references:
