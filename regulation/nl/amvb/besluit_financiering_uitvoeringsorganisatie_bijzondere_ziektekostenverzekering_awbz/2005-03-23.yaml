        bwb_id: BWBR0004783
  - number: '11'
    text: |-
      Besluiten die Onze Minister en het College zorgverzekeringen op grond van het
      [Besluit financiering uitvoeringsorganisatie Bijzondere Ziektekostenverzekering][ref1] met betrekking tot het jaar
      2005 ter zake van de onderwerpen welke worden geregeld in de [artikelen 2 tot en met 8][ref2] van dit besluit,
      worden aangemerkt als besluiten op grond van de desbetreffende artikelen in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004783
      [ref2]: https://wetten.overheid.nl/BWBR0018059#Artikel2
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel11
