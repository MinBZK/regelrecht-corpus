  - number: '2'
    text: |-
      Het College zorgverzekeringen vergoedt uit het Algemeen Fonds Bijzondere Ziektekosten jaarlijks aan de
      uitvoeringsorganen de kosten van verstrekkingen en uitkeringen naar werkelijke kosten. Daarbij blijven
      onverantwoorde uitgaven buiten beschouwing, tenzij het College toezicht anders besluit.
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel2
  - number: '3'
    text: |-
      Onze Minister geeft het College zorgverzekeringen jaarlijks een aanwijzing terzake van de voor alle
      uitvoeringsorganen, verbindingskantoren en het centraal administratiekantoor tezamen voor dat kalenderjaar ten
      laste van het Algemeen Fonds Bijzondere Ziektekosten beheerskostenbudget.
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel3
  - number: '4'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 3][ref1] beschikbaar gestelde middelen, voor ieder uitvoeringsorgaan afzonderlijk ten laste van
      het Algemeen Fonds Bijzondere Ziektekosten het beheerskostenbudget vast ter dekking van de beheerskosten die zij
      maken anders dan in de hoedanigheid van verbindingskantoor.

      2 De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van de door het
      College zorgverzekeringen vast te stellen beleidsregels.

      3 De in het tweede lid bedoelde beleidsregels behoeven de goedkeuring van Onze Minister.

      4 In geval van onthouding van goedkeuring aan een beleidsregel stelt het College zorgverzekeringen met inachtneming
      van door Onze Minister te geven instructies een nieuwe beleidsregel vast.

      5 Indien Onze Minister aan de in het vierde lid bedoelde beleidsregel eveneens goedkeuring onthoudt, stelt hij
      terzake zelf de beleidsregel vast.

      6 Het College zorgverzekeringen keert jaarlijks uit het Algemeen Fonds Bijzondere Ziektekosten aan een
      uitvoeringsorgaan de voor dat uitvoeringsorgaan ingevolge het eerste lid vastgestelde beheerskostenbudget uit.

      7 Indien een uitvoeringsorgaan op een naar het oordeel van het College toezicht onverantwoorde wijze op zijn
      beheerskosten bespaart, wordt de uitkering, bedoeld in het eerste lid, voor het desbetreffende kalenderjaar door
      het College zorgverzekeringen verlaagd met het bedrag van die besparing.


      [ref1]: https://wetten.overheid.nl/BWBR0018059#Artikel3
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018059
        artikel: '3'
  - number: '5'
    text: |-
      1 Het College zorgverzekeringen stelt jaarlijks, in het kader van de verdeling van de voor het kalenderjaar
      krachtens [artikel 3][ref1] beschikbaar gestelde middelen, afzonderlijk voor ieder verbindingskantoor en voor het
      centraal administratiekantoor het beheerskostenbudget vast.

      2 De vaststelling van het beheerskostenbudget, bedoeld in het eerste lid, geschiedt aan de hand van
      door het College zorgverzekeringen vast te stellen beleidsregels. Ten aanzien van die beleidsregels is
      [artikel 4, derde lid][ref2], van overeenkomstige toepassing.

      3 Het College zorgverzekeringen keert jaarlijks uit het Algemeen Fonds Bijzondere Ziektekosten aan de
      verbindingskantoren en het centraal administratiekantoor het voor hen ingevolge het eerste lid vastgestelde
      beheerskostenbudget.

      4 Indien een verbindingskantoor of het centraal administratiekantoor op een naar het oordeel van het College
      toezicht onverantwoorde wijze op zijn beheerskosten bespaart, wordt de uitkering, bedoeld in het eerste lid, voor
      het desbetreffende kalenderjaar door het College zorgverzekeringen verlaagd met het bedrag van die besparing.

      5 Een verbindingskantoor en het centraal administratiekantoor houden een reserve uitvoering [AWBZ][ref3] aan.

      6 Het saldo van baten en lasten over enig boekjaar van het verbindingskantoor voor de beheerskosten die het in
      of in verband met die hoedanigheid maakt, wordt toegevoegd aan, onderscheidenlijk ten laste gebracht van de in
      het vijfde lid bedoelde reserve. Daarbij blijven onverantwoorde uitgaven buiten beschouwing, tenzij het College
      toezicht anders besluit. De eerste volzin is van overeenkomstige toepassing voor het centraal administratiekantoor.

      7 Bij het eindigen van de aanwijzing, bedoeld in [artikel 16 van de Algemene Wet Bijzondere Ziektekosten][ref4],
      zonder dat aansluitend een nieuwe aanwijzing plaatsvindt, stort de rechtspersoon een bedrag ten belope van de
      reserve, bedoeld in het vijfde lid, binnen vier weken in het Algemeen Fonds Bijzondere Ziektekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018059#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002614
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel16
