      - id: ref2
        bwb_id: BWBR0002777
  - number: '9'
    text: |-
      Het [Besluit financiering uitvoeringsorganisatie Bijzondere Ziektekostenverzekering][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004783
    url: https://wetten.overheid.nl/BWBR0018059/2005-03-23#Artikel9
    references:
