    text: |-
      Onze Minister wijst de instantie aan, bedoeld in
      [artikel 4.06, eerste lid, onder a, van het Binnenvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel4
