    text: |-
      De besluiten en aanwijzingen, bedoeld in [artikel 4][ref1] en [artikel 5, eerste lid, onderdeel a][ref2],
      worden in de *Staatscourant* geplaatst, de aanwijzingen, bedoeld in artikel 5, eerste lid, onderdeel b, in
      het publicatieblad, bedoeld in [artikel 2 van de Bekendmakingswet][ref3], van het openbaar lichaam waartoe het
      aanwijzende orgaan behoort en de aanwijzingen, bedoeld in artikel 5, eerste lid, onderdeel c, in het gemeenteblad.


