preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 5 april 1983, nr. RRV 16 895, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, mede namens Onze Minister van Justitie;

    Overwegende, dat de ontwikkelingen in het scheepvaartverkeer en het streven te komen tot een uniform stelsel van
    verkeersregels en verkeerstekens voor de vaarwegen in Europa het wenselijk maken de bepalingen ter voorkoming van
    aanvaring of aandrijving op de openbare wateren in het Rijk, die voor de scheepvaart openstaan, te herzien;

    Gelet op artikel 1 van de Wet van 15 april 1891 (Stb. 91), houdende bepalingen tot voorkoming van aanvaring of
    aandrijving op de openbare wateren in het Rijk, die voor de scheepvaart openstaan;

    De Raad van State gehoord (advies van 7 september 1983, nr. W09.83.0219/08.3.35);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 12 oktober 1983, nr. RRV 54005,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Vastgesteld wordt een reglement houdende bepalingen ter voorkoming van aanvaring of aandrijving op de openbare
      wateren in het Rijk, die voor de scheepvaart openstaan, met de daarbij behorende bijlagen, dat is gevoegd bij dit
      besluit, en dat wordt aangehaald als " Binnenvaartpolitiereglement".
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel1
  - number: 1a
    text: |-
      Een wijziging van [richtlijn nr. 2002/59/EG](32002L0059) van het Europees Parlement en de Raad van de Europese
      Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor de
      zeescheepvaart en tot intrekking van [richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG L 208), gaat voor de
      toepassing van het [Binnenvaartpolitiereglement][ref1] gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: '2.1'
    text: |-
      Het [Binnenvaartpolitiereglement][ref1] geldt op de openbare wateren in het Rijk, die voor de scheepvaart
      openstaan, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 2.1.a
    text: de Boven-Rijn, de Waal, het Pannerdensch Kanaal, de Neder-Rijn en de Lek;
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.b
    text: |-
      de aan de onder a genoemde vaarwegen gelegen havens, laad- en losplaatsen en recreatieplassen, met uitzondering van
      de voorhavens van sluizen;
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.c
    text: de Westerschelde met haar mondingen;
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.d
    text: het Kanaal van Terneuzen met de buitenvoorhavens te Terneuzen;
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.e
    text: de Eemsmonding, zoals bedoeld in het Eems-Dollardverdrag;
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.f
    text: de Nederlandse gedeelten van de gemeenschappelijke Maas; en
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: 2.1.g
    text: de zeewaarts van de in het tweede lid vermelde lijn gelegen wateren.
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde lijn is de langs de Nederlandse kust gaande lijn, die loopt van: - het snijpunt van
      de breedtecirkel 53°26'.5 N met de Duitse kust ter plaatse van Upleward,
        - vandaar naar het punt met de coördinaten 53°26'.5 N en 006°55'.9 E,
        - vandaar naar een punt gelegen 25 meter westelijk van de kop van de strekdam van Borkum,
        - vandaar via de noordelijkste punten van Rottumeroog, Rottumerplaat en de zandplaat Simonszand, naar het
      oostelijkste punt van Schiermonnikoog, en voorts langs de noordelijke kust naar het westelijkste punt van
      Schiermonnikoog,
        - vandaar naar het noordelijkste punt van de zandplaat Het Rif,
        - vandaar naar het oostelijkste punt van Ameland en voorts langs de noordelijke kust naar het westelijkste punt van
      dit eiland,
        - vandaar naar het oostelijkste punt van Terschelling en voorts langs de noordelijke kustlijn naar het westelijkste
      punt van dit eiland,
        - vandaar naar het noordelijkste punt van Vlieland en voorts langs de noordelijke kust naar het westelijkste punt
      van dit eiland,
        - vandaar naar het noordelijkste punt van Texel en voorts langs de westelijke kust tot het snijpunt van de kustlijn
      en de lijn tussen het Loodsmansduin te Texel, met de coördinaten 53°01'.3 N en 004°43'.7 E, en het punt met de
      coördinaten 52°58'.4 N en 004°39'.4 E, op het eiland Noorderhaaks,
        - vandaar naar het punt met de coördinaten 52°58'.4 N en 004°39'.4 E,
        - vandaar naar de Noord-Hollandse kust ter hoogte van de vuurtoren Kijkduin bij Den Helder en voorts langs de kust
      van Noord- en Zuid-Holland, waarbinnen zijn begrepen de hoofden van IJmuiden, Scheveningen en Hoek van Holland, tot
      aan de Haringvlietdam,
        - vandaar langs de zeezijde van deze dam en de zeezijde van de buitenhaven van Stellendam, naar Goeree en voorts
      langs de westelijke kust hiervan naar de Brouwersdam,
        - vandaar langs de zeezijde van deze dam naar Schouwen en voorts langs de westelijke kust hiervan naar de
      afsluiting in de Oosterschelde,
        - vandaar langs de zeezijde van deze afsluiting, over de havenhoofden van de vluchthaven Neeltje Jans en de
      Noordland Buitenhaven, Roompotsluis, naar Noord-Beveland en voorts langs de kustlijn hiervan naar de Veersedam,
        - vandaar langs de zeezijde van deze dam naar Walcheren en voorts langs de westelijke kust hiervan naar de
      lichtopstand de Nolle, met de coördinaten 51°26'.9 N en 003°33'.1 E, bij Vlissingen,
        - vandaar naar de lichtopstand Nieuwe Sluis, met de coördinaten 51°24'.4 N en 003°31'.3 E, in Zeeuws-Vlaanderen
      en voorts langs de noordwestelijke kust hiervan naar het punt van grensovergang tussen Nederland en België. De
      coördinaten zijn uitgedrukt in lengte en breedte volgens het World Geodetic System (WGS)-84, in graden en minuten.
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid gelden de [artikelen 1.01, onder A, 16°, 17° en 18°][ref1],
      [1.09, eerste lid, onder a][ref2], 8.01 tot en met 8.08, [9.04][ref3] en
      [9.05 van het Binnenvaartpolitiereglement][ref4] tevens op de Boven-Rijn, de Waal, het Pannerdensch Kanaal, de
      Neder-Rijn en de Lek, en op de daaraan gelegen havens, laad- en losplaatsen en recreatieplassen.


