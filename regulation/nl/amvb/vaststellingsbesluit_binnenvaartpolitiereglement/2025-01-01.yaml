  - number: 7a
    text: |-
      Overtreding van de bepalingen van het [Binnenvaartpolitiereglement][ref1], dan wel overtreding van de aan een
      aanwijzing van de bevoegde autoriteit verbonden voorwaarden, of de aan een vergunning, vrijstelling of ontheffing
      verbonden voorwaarden of voorschriften, is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: '10'
    text: |-
      Dit besluit treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen andere tijdstippen vaststellen waarop
      verschillende artikelen of onderdelen van artikelen van dit besluit, dan wel verschillende artikelen of onderdelen
      van artikelen van het Binnenvaartpolitiereglement, in werking treden.
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel10
  - number: '11'
    text: Dit besluit kan worden aangehaald als "Vaststellingsbesluit Binnenvaartpolitiereglement".
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel11
