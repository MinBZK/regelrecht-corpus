  - number: '3'
    text: 'In dit besluit wordt verstaan onder Onze Minister: Onze Minister van Infrastructuur en Milieu.'
    url: https://wetten.overheid.nl/BWBR0003627/2025-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt de voorschriften en de nadere regels vast, bedoeld
      in de [artikelen 1.01, aanhef en onder C, onderdelen 3° en 4°][ref1],
      [4.06, eerste lid, onder a, en derde lid, ][ref2][6.32, eerste lid][ref3], [9.02, eerste lid][ref4],
      [9.07, eerste en tweede lid][ref5], en [10.02, eerste lid, van het Binnenvaartpolitiereglement][ref6].


