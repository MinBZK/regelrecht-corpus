    text: |-
      Onze Minister wijst de categorieën van schepen aan, bedoeld in
      [artikel 4.06, vierde lid, van het Binnenvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
