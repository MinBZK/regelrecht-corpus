        artikel: '9'
      - id: ref4
        bwb_id: BWBR0003628
        artikel: '10'
  - number: '4.2'
    text: |-
      Onze Minister wijst de instantie aan, bedoeld in artikel 4.06, eerste lid, onder a, van het
      Binnenvaartpolitiereglement.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister wijst de vaarwegen aan, bedoeld in de artikelen 4.06, derde en vierde lid, en
      [10.02, eerste lid, van het Binnenvaartpolitiereglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel10
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '10'
  - number: '4.4'
    text: |-
      Onze Minister wijst de marifoonkanalen aan, bedoeld in de [artikelen 4.05, vierde lid][ref1], 4.06, tweede lid, en
      [6.32, derde en vierde lid, van het Binnenvaartpolitiereglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003628
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003628
        artikel: '6'
  - number: '4.5'
    text: |-
      Onze Minister wijst de categorieën van schepen aan, bedoeld in artikel 4.06, vierde lid, van het
      Binnenvaartpolitiereglement.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel4
  - number: '5.1'
    text: |-
      In het [Binnenvaartpolitiereglement][ref1] wordt onder de bevoegde autoriteit verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 5.1.a
    text: voor de vaarwegen in beheer bij het Rijk, de personen die worden aangewezen door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel5
  - number: 5.1.b
    text: |-
      voor de vaarwegen in beheer bij een ander openbaar lichaam, de personen die worden aangewezen telkens door het
      bestuur van het openbare lichaam;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel5
  - number: 5.1.c
    text: |-
      voor de vaarwegen niet in beheer bij enig openbaar lichaam, de personen die worden aangewezen door het college van
      burgemeester en wethouders van de gemeente waarin telkens de vaarweg is gelegen.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel5
  - number: '5.2'
    text: |-
      In de volgende bepalingen van het [Binnenvaartpolitiereglement][ref1] worden onder de bevoegde autoriteit
      eveneens verstaan de ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak:
      [artikelen 1.10, vierde lid][ref2], [1.12, derde en vierde lid][ref3], [1.13, tweede en derde lid][ref4],
      [1.14][ref5], [1.15, tweede lid][ref6], [1.17, eerste lid][ref7], [1.20][ref8], [6.19, zesde lid][ref9], en
      [7.02, derde lid][ref10].


