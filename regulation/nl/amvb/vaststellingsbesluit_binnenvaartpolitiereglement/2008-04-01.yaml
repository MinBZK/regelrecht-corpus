        artikel: '9'
  - number: '3'
    text: 'In dit besluit wordt verstaan onder Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt de voorschriften en de regelen vast, bedoeld in de [artikelen 1.01, onder C, 3° en 4°][ref1],
      4.06, eerste lid, onder a, en derde lid, [6.32, eerste lid][ref2], [9.07, eerste en tweede lid][ref3], en
      [10.02, eerste lid, van het Binnenvaartpolitiereglement][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel10
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel4
    references:
      - id: ref1
