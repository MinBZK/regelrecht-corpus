preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 5 april 1983, nr. RRV 16 895, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, mede namens Onze Minister van Justitie;

    Overwegende, dat de ontwikkelingen in het scheepvaartverkeer en het streven te komen tot een uniform stelsel van
    verkeersregels en verkeerstekens voor de vaarwegen in Europa het wenselijk maken de bepalingen ter voorkoming van
    aanvaring of aandrijving op de openbare wateren in het Rijk, die voor de scheepvaart openstaan, te herzien;

    Gelet op artikel 1 van de Wet van 15 april 1891 (Stb. 91), houdende bepalingen tot voorkoming van aanvaring of
    aandrijving op de openbare wateren in het Rijk, die voor de scheepvaart openstaan;

    De Raad van State gehoord (advies van 7 september 1983, nr. W09.83.0219/08.3.35);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 12 oktober 1983, nr. RRV 54005,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, uitgebracht mede namens Onze
    Minister van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Vastgesteld wordt een reglement houdende bepalingen ter voorkoming van aanvaring of aandrijving op de openbare
      wateren in het Rijk, die voor de scheepvaart openstaan, met de daarbij behorende bijlagen, dat is gevoegd bij dit
      besluit, en dat wordt aangehaald als " Binnenvaartpolitiereglement".
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel1
  - number: 1a
    text: |-
      Een wijziging van [richtlijn nr. 2002/59/EG](32002L0059) van het Europees Parlement en de Raad van de Europese
      Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor de
      zeescheepvaart en tot intrekking van [richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG L 208), gaat voor de
      toepassing van het [Binnenvaartpolitiereglement][ref1] gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt
      bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: '2.1'
    text: |-
      Het [Binnenvaartpolitiereglement][ref1] geldt op de openbare wateren in het Rijk, die voor de scheepvaart
      openstaan, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0003628
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003628
  - number: 2.1.a
    text: de Boven-Rijn, de Waal, het Pannerdensch Kanaal, de Neder-Rijn en de Lek;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.b
    text: |-
      de aan de onder a genoemde vaarwegen gelegen havens, laad- en losplaatsen en recreatieplassen, met uitzondering van
      de voorhavens van sluizen;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.c
    text: de Westerschelde met haar mondingen;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.d
    text: het Kanaal van Terneuzen met de buitenvoorhavens te Terneuzen;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.e
    text: de Eemsmonding, zoals bedoeld in het Eems-Dollardverdrag;
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.f
    text: de Nederlandse gedeelten van de gemeenschappelijke Maas; en
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: 2.1.g
    text: de zeewaarts van de in het tweede lid vermelde lijn gelegen wateren.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: '2.2'
    text: |-
      De in het eerste lid bedoelde lijn loopt langs de zuidwestelijke grens van de Eemsmonding, zoals bedoeld in het
      Eems-Dollardverdrag (*Trb.* 1960, 69), tot het punt waar zij wordt gesneden door de lijn die loopt van de Grote
      Kaap op Rottummeroog (53°32'.7 N, 06°34'.7 O) over de lichttoren op Schiermonnikoog (53°29'.2 N, 06°08'.9 O) naar
      de Oostkaap op Ameland (53°27'.8 N, 05°55'.8 O) vervolgens van de lichttoren op Ameland (53°27'.0 N, 05°37'.6 O)
      naar de Noordkaap op Terschelling (53°26'.6 N, 05°32'.8 O), voorts van de lichttoren Brandaris op Terschelling
      (53°21'.7 N, 05°12'.8 O) naar de lichttoren Vuurduin op Vlieland (53°17'.8 N, 05°03'.6 O), dan van paal 35 ZW op
      Vlieland (53°13'.3 N, 04°52.2 O) naar lichttoren Eierland op Texel (53°11'.0 N, 04°51'.4 O), vervolgens van paal
      Onrust Z op Texel (52°59'.6 N, 04°43'.7 O) naar de lichttoren Kijkduin bij Den Helder (52°57'.4 N, 04°43'.7 O),
      vandaar langs de Noord- en Zuidhollandse kustlijn en de kustlijn van de Maasvlakte, Voorne, Goeree, Schouwen,
      Noord-Beveland en Walcheren - en van de dammen daartussen - tot het snijpunt van de kustlijn van Walcheren met de
      lijn over de kerktorens van Aagtekerke en Domburg, vandaar tot de positie 51°37'.0 N, 03°27'.2 O, vandaar tot de
      positie 51°35'.6 N, 03°23'.3 O, vandaar tot de positie 51°34'.0 N, 03°22'.2 O, vandaar tot de positie 51°24'.7 N,
      03°17'.9 O, en vandaar naar de grenspaal 369 op de grens van Nederland en België. De lijn loopt over de zeehoofden
      van de havens.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid gelden de [artikelen 1.01, onder A, 16°, 17° en 18°][ref1],
      [1.09, eerste lid, onder a][ref2], 8.01 tot en met 8.08, [9.04][ref3] en
      [9.05 van het Binnenvaartpolitiereglement][ref4] tevens op de Boven-Rijn, de Waal, het Pannerdensch Kanaal, de
      Neder-Rijn en de Lek, en op de daaraan gelegen havens, laad- en losplaatsen en recreatieplassen.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003628#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003628#Artikel9
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel2
    references:
