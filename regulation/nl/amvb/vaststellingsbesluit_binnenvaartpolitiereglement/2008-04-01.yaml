  - number: '10'
    text: |-
      Dit besluit treedt in werking op een door Ons te bepalen tijdstip. Wij kunnen andere tijdstippen vaststellen waarop
      verschillende artikelen of onderdelen van artikelen van dit besluit, dan wel verschillende artikelen of onderdelen
      van artikelen van het Binnenvaartpolitiereglement, in werking treden.
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel10
  - number: '11'
    text: Dit besluit kan worden aangehaald als "Vaststellingsbesluit Binnenvaartpolitiereglement".
    url: https://wetten.overheid.nl/BWBR0003627/2008-04-01#Artikel11
