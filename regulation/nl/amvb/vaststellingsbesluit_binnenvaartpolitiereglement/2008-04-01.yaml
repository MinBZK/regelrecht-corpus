  - number: 7a
    text: |-
      Overtreding van de bepalingen van het [Binnenvaartpolitiereglement][ref1], met uitzondering
      van de [artikelen 1.01][ref2], [1.02, tweede en vijfde lid][ref3], [1.03, derde lid][ref4],
      [3.01, vijfde, zesde en zevende lid][ref5], [3.01a][ref6], [3.25, derde lid][ref7],
      [5.01, derde en vierde lid][ref8], [5.02][ref9], [6.01][ref10], [6.28b, eerste lid][ref11],
      [6.29, tweede lid][ref12], [8.04][ref13], [9.01][ref14], [10.01][ref15], [12.01][ref16], [12.02][ref17] en
      [12.03][ref18], dan wel overtreding van de aan ontheffingen verbonden voorschriften, met uitzondering van
      overtreding van de voorschriften verbonden aan een ontheffing als bedoeld in [artikel 10.07, tweede lid][ref19],
      vormt een strafbaar feit.


