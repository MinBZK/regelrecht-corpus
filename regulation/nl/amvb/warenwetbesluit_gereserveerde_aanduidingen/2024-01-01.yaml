preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 23 september 1997, nr. GZB/
    VVB/975144, gedaan in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op artikel 8, onder b, en artikel 12 van de Warenwet;

    De Raad van State gehoord (advies van 18 november 1997, no. W13.97.0626);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 18 maart 1998 met
    nummer GZB/VVB/98814, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.a
    text: '*druiven:* vruchten van Vitis Vinifera L;'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.b
    text: |-
      *verordening (EU) 2019/787:* [Verordening (EU) 2019/787](32687R2019) van het Europees Parlement en de Raad van
      17 april 2019 betreffende de definitie, omschrijving, presentatie en etikettering van gedistilleerde dranken, het
      gebruik van de namen van gedistilleerde dranken in de presentatie en etikettering van andere levensmiddelen en de
      bescherming van geografische aanduidingen van gedistilleerde dranken, het gebruik van ethylalcohol en distillaten
      uit landbouwproducten in alcoholhoudende dranken, en tot intrekking van [Verordening (EG) nr. 110/2008](32008R0110)
      (PbEU 2019 L 130);
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.c
    text: |-
      *ethylalcohol uit landbouwproducten:* een vloeistof met de in artikel 5 van [verordening (EU) 2019/787](32687R2019)
      genoemde vereisten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.d
    text: |-
      *verordening (EEG) 2658/87:* verordening (EEG) nr. 2658/87 van de Raad van 23 juli 1987 met betrekking tot de
      tarief- en statistieknomenclatuur en het gemeenschappelijk douanetarief (PbEG 1987, L 256);
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.e
    text: '*gedistilleerde drank:* drank als bedoeld in artikel 2 van [verordening (EU) 2019/787](32687R2019);'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.f
    text: |-
      *moutwijn:* granen eau-de-vie of granendistillaat zoals omschreven in verordening (EG) 110/2008, bereid door
      distillatie met een alcoholpercentage van ten minste 46% vol en ten hoogste 48% vol;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.g
    text: |-
      *verordening (EG) 1334/2008:* verordening (EG) nr. 1334/2008 van het Europees Parlement en de Raad van
      16 december 2008 **inzake aroma’s en bepaalde voedselingrediënten met aromatiserende eigenschappen voor gebruik
      in levensmiddelen en tot wijziging van Verordening (EEG) nr. 1601/91 van de Raad, Verordening (EG) nr. 2232/96,
      Verordening (EG) nr. 110/2008 en Richtlijn 2000/13/EG (PbEU 2008, L 354);**
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: 1.h
    text: |-
      *zwak gedistilleerde drank:* alcoholhoudend product met minder dan 15% vol, met uitzondering van eierlikeur en
      advocaat, behorend tot GN-code 2208 van verordening (EEG) 2658/87, waarvoor in geval van gebruik of verbruik hier
      te lande alcoholaccijns verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden met gebruikmaking van de bij dit besluit aangegeven aanduidingen andere waren te verhandelen dan
      die waaraan die aanduidingen bij dit besluit zijn voorbehouden.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      De aanduiding *azijn*mag uitsluitend worden gebezigd voor een vloeibare waar die azijnzuur als kenmerkend
      bestanddeel bevat, met dien verstande dat het gehalte aan azijnzuur van de waar ten minste 4 gram per 100 ml
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      De aanduiding natuurazijn mag uitsluitend worden gebezigd voor een vloeibare waar als bedoeld in het eerste lid die
      wordt verkregen door een alcoholische en een azijnzure fermentatie van eet- of drinkwaren van agrarische oorsprong.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel3
  - number: '4'
    text: |-
      De aanduiding *mayonaise*mag uitsluitend worden gebezigd voor een eetwaar bestaande uit een emulsie van het type
      olie in water, die ten minste 70% vet en ten minste 5% eigeel bevat.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel4
  - number: '5'
    text: |-
      De aanduiding *vruchtenwijn*mag uitsluitend worden gebezigd voor een gegiste drank die is bereid uit het sap van
      ander fruit dan druiven, met een alcoholgehalte van ten minste 8,5 volumeprocenten bij 20°C.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel5
  - number: '6'
    text: |-
      De aanduiding roomijs mag uitsluitend worden gebezigd voor consumptie-ijs dat bestemd is om in bevroren toestand te
      worden genuttigd, en dat:
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel6
  - number: 6.−
    text: geen ander vet bevat dan melkvet;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel6
  - number: 6.−
    text: een melkvetgehalte heeft van ten minste 5%; en
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel6
  - number: 6.−
    text: geen ander eiwit bevat dan melkeiwitten.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel6
  - number: '7'
    text: |-
      De aanduiding *mosterd*mag uitsluitend worden gebezigd voor een eetwaar die ten minste is samengesteld uit
      mosterdzaad of mosterdmeel, en azijn of een azijnzuurhoudende vloeistof, voor zover het gehalte aan droge stof ten
      minste 20%, en het gehalte aan mosterdolie ten minste 20% van de keukenzoutvrije droge stof bedraagt.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7
  - number: 7a
    text: |-
      De aanduiding *limonade* of *frisdrank* mag uitsluitend worden gebezigd voor een drinkwaar die geen alcohol bevat,
      tenzij dit door een natuurlijk gistingsproces onbedoeld en onvermijdelijk aanwezig is tot een gehalte van ten
      hoogste 5 gram ethylalcohol per liter, en die bestaat uit: - water, natuurlijk mineraalwater of bronwater; en
        - suikers of zoetstoffen;
        - waaraan mogen zijn toegevoegd:
        - koolzuur;
        - aroma's;
        - eetbare bestanddelen van vruchten of planten;
        - vruchten- of plantensappen;
        - technische hulpstoffen; of
        - additieven die voldoen aan de voorschriften gesteld bij of krachtens Verordening (EG) nr. 1333/2008 van het
      Europees Parlement en de Raad van 16 december 2008 inzake levensmiddelenadditieven (PbEU 2008, L 354).
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7a
  - number: 7b
    text: |-
      De aanduiding *bier* mag uitsluitend worden gebezigd voor een drinkwaar verkregen na alcoholische gisting van
      wort, hoofdzakelijk bereid uit zetmeel- en suikerhoudende grondstoffen, hop en brouwwater, met dien verstande dat
      ten minste 60% van het extractgehalte van de wort, voor vergisting, afkomstig is van geste- of tarwemout, en die
      bestaat uit: - gerstemout of tarwemout;
        - andere zetmeelhoudende grondstoffen;
        - suikerhoudende grondstoffen;
        - hop en zijn onderscheidene verwerkte vormen;
        - brouwwater, zijnde voor menselijke consumptie bestemd water, dat voldoet aan de eisen gesteld bij of krachtens
      de [Drinkwaterwet][ref1] en dat in zijn minerale samenstelling en zuurgraad mag zijn aangepast aan de specifieke
      eisen, die de brouwprocessen van de onderscheidene biersoorten stellen;
        - gist; waaraan mogen zijn toegevoegd: - vruchten of vruchtensappen en aroma’s, met dien verstande dat het gebruik
      van deze ingrediënten uitsluitend is toegestaan voor de bereiding van andere bieren dan bieren van het type pils
      als bedoeld in [artikel 7f][ref2];
        - technische hulpstoffen;
        - additieven die voldoen aan de voorschriften gesteld bij of krachtens Verordening (EG) nr. 1333/2008 van het
      Europees Parlement en de Raad van 16 december 2008 inzake levensmiddelenadditieven (PbEU 2008, L 354).


      [ref1]: https://wetten.overheid.nl/BWBR0026338
      [ref2]: https://wetten.overheid.nl/BWBR0009499#Artikel7f
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0026338
      - id: ref2
        bwb_id: BWBR0009499
        artikel: 7f
  - number: 7c
    text: |-
      De aanduiding *alcoholvrij bier* mag uitsluitend worden gebezigd voor bier dat ten hoogste 0,1 volumeprocent
      alcohol bevat en een extractgehalte van de stamwort heeft van ten minste 4%.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7c
  - number: 7d
    text: |-
      De aanduiding *alcoholarm bier* mag uitsluitend worden gebezigd voor bier dat meer dan 0,1 en ten hoogste
      1,2 volumeprocent alcohol bevat en een extractgehalte van de stamwort heeft van ten minste 4%.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7d
  - number: 7e
    text: |-
      De aanduiding *oud bruin* of iedere aanduiding waarvan de woorden *oud bruin* een grondbestanddeel vormen, mag
      uitsluitend worden gebezigd voor gezoete donkergekleurde bieren met een extractgehalte van de stamwort van 7 tot
      11%.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7e
  - number: 7f
    text: |-
      De aanduiding *pils* of iedere andere aanduiding waarvan het woord *pils* een grondbestanddeel vormt, mag
      uitsluitend worden gebezigd voor lichtgekleurde bieren met een extractgehalte van de stamwort van 11 tot 13,5%.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7f
  - number: 7g
    text: |-
      De aanduiding *bok*, *bock* of iedere andere aanduiding waarvan *bok* of *bock* een grondbestanddeel vormt, mag
      uitsluitend worden gebezigd voor bieren met een extractgehalte van de stamwort boven de 15%.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7g
  - number: 7h
    text: 'De aanduiding *korenwijn* mag uitsluitend worden gebezigd voor een gedistilleerde drank, die:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.a
    text: |-
      bereid is met ethylalcohol uitsluitend van granen en waarvan de alcoholcomponent voor minstens 51% bestaat uit
      moutwijn of tot 70% vol geherdistilleerde moutwijn;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.b
    text: |-
      voor wat betreft aromatisering uitsluitend natuurlijke aromastoffen, bedoeld in artikel 3, tweede lid, onderdeel
      c, van verordening (EG) 1334/2008, of aromatiserende preparaten, bedoeld in artikel 3, tweede lid, onderdeel d, van
      verordening (EG) 1334/2008, mag bevatten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.c
    text: bijgekleurd kan zijn met uitsluitend karamel;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.d
    text: een suikergehalte kan hebben van ten hoogste 20 gram per liter;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.e
    text: kleurloos, lichtgeel of lichtbruin van kleur is;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7h.f
    text: een alcoholgehalte heeft van ten minste 38% vol.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7h
  - number: 7i
    text: |-
      De aanduiding *advocaat* mag uitsluitend worden gebezigd voor een gedistilleerde drank die voldoet aan categorie 39
      van bijlage I van [verordening (EU) 2019/787](32687R2019) en die:
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7i
  - number: 7i.a
    text: geel van kleur is;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7i
  - number: 7i.b
    text: |-
      een alcohol-, suiker- en zuiver eigeelgehalte heeft in overeenstemming met bijlage I van [verordening (EU)
      2019/787](32687R2019);
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7i
  - number: 7i.c
    text: |-
      uitsluitend is bereid met eigeel en eiwit afkomstig van kippeneieren welke onbeschadigd zijn en voldoen aan de
      voorschriften gesteld bij of krachtens verordening (EG) nr. 1820/2006 van de Raad van 19 juni 2006 betreffende
      bepaalde handelsnormen voor eieren (PbEU 2006, L 186) en richtlijn 98/437/EEG van de Raad van 20 juni 1989 inzake
      hygiëne- en gezondheidsvraagstukken bij de bereiding en het in de handel brengen van eiprodukten (PbEG 1989,
      L 212);
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7i
  - number: 7i.d
    text: |-
      als kenmerkende bestanddelen ethylalcohol of brandewijn, en suiker bevat, en waaraan aroma's, kleurstoffen en
      verdikkingsmiddelen kunnen zijn toegevoegd.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7i
  - number: 7j
    text: 'De aanduiding *vieux* mag uitsluitend worden gebezigd voor een gedistilleerde drank, die:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.a
    text: licht- tot donkerbruin van kleur is;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.b
    text: vervaardigd is uit ethylalcohol uit landbouwproducten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.c
    text: aromatische geur of smaakstoffen bevat, welke de drank het aroma van uit wijn gestookt gedistilleerd verlenen;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.d
    text: een suikergehalte kan hebben van ten hoogste 20 gram per liter;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.e
    text: kleurstoffen mag bevatten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7j.f
    text: een alcoholgehalte heeft van ten minste 35% vol.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7j
  - number: 7k
    text: 'De aanduiding *brandewijn* mag uitsluitend worden gebezigd voor een gedistilleerde drank, die:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7k.a
    text: nagenoeg kleurloos is;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7k.b
    text: vervaardigd is uit ethylalcohol uit landbouwproducten, al dan niet gezuiverd over actieve koolfilters;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7k.c
    text: |-
      gedistilleerd is over zuurmakende stoffen of vruchten of zaden, dan wel met toevoeging van aroma’s of geur- en
      smaakstoffen, welke de drank het kenmerkende organoleptische karakter geven;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7k.d
    text: een suikergehalte kan hebben van ten hoogste 20 gram per liter;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7k.e
    text: een alcoholgehalte heeft van ten minste 35% vol.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7k
  - number: 7l
    text: 'De aanduiding *vruchtenbrandewijn* mag uitsluitend worden gebezigd voor een gedistilleerde drank, die:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7l
  - number: 7l.a
    text: |-
      vervaardigd is uit brandewijn of ethylalcohol uit landbouwproducten met de ingrediënten van brandewijn, door middel
      van distillatie of infuus van vrucht(en) of vruchten- en plantendelen of toevoeging van vruchtensap(pen) of een
      distillaat dan wel extract van vruchten- of plantendelen;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7l
  - number: 7l.b
    text: aroma’s, kleurstoffen of andere geur- en smaakstoffen mag bevatten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7l
  - number: 7l.c
    text: een suikergehalte heeft van ten minste 100 gram per liter;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7l
  - number: 7l.d
    text: een alcoholgehalte heeft van ten minste 20% vol.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7l
  - number: 7m
    text: 'De aanduiding *likorette* mag uitsluitend worden gebezigd voor een zwak gedistilleerde drank, die:'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7m
  - number: 7m.a
    text: |-
      behalve ethylalcohol uit landbouwproducten als kenmerkende bestanddelen suiker bevat en een distillaat of infuus
      of extract van vruchten of vruchtendelen of plantendelen of zaden of kruiden of vruchtensappen of melk, room of
      andere zuivelproducten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7m
  - number: 7m.b
    text: kleurstoffen of andere aroma’s of geur- en smaakstoffen mag bevatten;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7m
  - number: 7m.c
    text: een suikergehalte heeft van ten minste 100 gram per liter;
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7m
  - number: 7m.d
    text: een alcoholgehalte heeft van ten minste 12% vol.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7m
  - number: 7n
    text: De aanduiding *kaviaar* mag uitsluitend worden gebezigd voor kuit van steurachtige vissen (chondrostei).
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel7n
  - number: '8'
    text: |-
      Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of al dan niet is voldaan
      aan de bij dit besluit gestelde regels, worden aangewezen chromatografische en andere scheidingsmethoden,
      organoleptische bepalingsmethoden en detectiemethoden, alsmede de daartoe door een andere lid-staat van de Europese
      Unie aangewezen methoden.
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van 1 april 1998, met uitzondering van [artikel 6][ref1] en
      [artikel 7][ref2], die in werking treden met ingang van 1 mei 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0009499#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009499#Artikel7
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009499
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009499
        artikel: '7'
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Gereserveerde aanduidingen.'
    url: https://wetten.overheid.nl/BWBR0009499/2024-01-01#Artikel10
