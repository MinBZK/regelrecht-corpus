  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in de bijlage, gelden voor een ieder die de inrichting drijft. Deze draagt er
      zorg voor dat de voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in de bijlage, onder B, hoofdstukken 1 tot en met 3, inhoudt dat daarbij
      aangegeven middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft
      en die voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere
      middelen wil toepassen aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij de melding overeenkomstig het tweede lid, worden aan het bevoegd gezag gegevens verstrekt waaruit blijkt dat
      met de volgens die melding toe te passen middelen een ten minste gelijkwaardige bescherming van het milieu wordt
      bereikt. Het bevoegd gezag beslist over de juistheid van een gekozen middel.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel4
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel5
  - number: 5.1.a
    text: |-
      de in de bijlage opgenomen voorschriften ten aanzien van geluid, trilling, energieverbruik, afvalstoffen,
      afvalwater, lucht, verlichting, waterbesparing, veiligheid en bodembescherming, voorzover dat in hoofdstuk 4 van de
      bijlage is aangegeven, of
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de veiligheid van toestellen en installaties voor gas of elektriciteit, de veiligheid van de opslag van stoffen,
      het verbruik van grondstoffen, de gevolgen van het verkeer van personen of goederen van en naar de inrichting,
      en de nadelige gevolgen voor het milieu die de inrichting kan veroorzaken waarop voorschrift 1.9.1 van de bijlage
      betrekking heeft, indien dat bijzonder is aangewezen in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien degene die de inrichting drijft of zal drijven, een andere persoon is, de naam en het adres van die persoon,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.3.d
    text: de indeling en de uitvoering van de inrichting en
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.4'
    text: |-
      Bij de melding wordt tevens een rapport van een akoestisch onderzoek gevoegd indien het aannemelijk is dat in
      enig vertrek van de inrichting het langtijdgemiddeld beoordelingsniveau (LAr, LT), veroorzaakt door de ten gehore
      gebrachte muziek in de representatieve bedrijfssituatie, meer bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.4.1
    text: |-
      70 dB(A), indien dit vertrek in- of aanpandig is gelegen met woningen of met ruimten deel uitmakend van andere
      geluidsgevoelige gebouwen en geluidsgevoelige terreinen, of
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: 6.4.2
    text: |-
      80 dB(A), indien dit vertrek niet in- of aanpandig is gelegen met woningen of met ruimten deel uitmakend van andere
      geluidsgevoelige gebouwen en geluidsgevoelige terreinen.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.5'
    text: |-
      Uit het rapport van het akoestisch onderzoek blijkt op grond van verrichte geluidmetingen of geluidberekeningen
      of aan de waarden in voorschrift 1.1.1 of 1.1.5 van de bijlage kan worden voldaan. In het rapport wordt
      aangegeven welke voorzieningen worden getroffen om te voorkomen dat de in de eerste volzin bedoelde waarden worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.6'
    text: |-
      Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien de beoogde uitbreiding of verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed kan zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.7'
    text: |-
      Indien bij de melding geen rapport van een akoestisch onderzoek is gevoegd, kan het bevoegd gezag besluiten
      dat het overleggen van een zodanig rapport niet is vereist, indien het aannemelijk is dat het langtijdgemiddeld
      beoordelingsniveau (LAr, LT) en het piekniveau (LAmax), veroorzaakt door de inrichting, niet meer bedragen dan de
      waarden bedoeld in voorschrift 1.1.1 of 1.1.5 van de bijlage.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.8'
    text: |-
      Bij de melding wordt een rapport van een onderzoek naar de nulsituatie van de bodem gevoegd, gericht op het
      in beeld brengen van de toestand van de bodem voor het tijdstip waarop de inrichting of de verandering daarvan
      in werking is gebracht. Het onderzoek naar de nulsituatie richt zich uitsluitend op de stoffen die door de
      werkzaamheden ter plaatse een bedreiging van de bodemkwaliteit vormen en op de plaatsen waar bodembedreigende
      handelingen plaatsvinden dan wel zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.9'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.10'
    text: |-
      De in het derde tot en met het vijfde lid en in het achtste lid vermelde gegevens behoeven niet te worden verstrekt
      indien het bevoegd gezag reeds over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '6.11'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij
      reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel6
  - number: '7'
    text: |-
      Het bevoegd gezag verbindt aan een vergunning voor een inrichting waarbij uitsluitend of in
      hoofdzaak sprake is van een jachthaven met meer dan 500 ligplaatsen voor pleziervaartuigen,
      die gewoonlijk wordt aangedaan door zeegaande pleziervaartuigen en die niet krachtens
      [artikel 6, eerste lid, van de Wet voorkoming verontreiniging door schepen][ref1] is aangewezen, in ieder geval
      voorschriften die ertoe strekken dat voldaan wordt aan de voorschriften 2.2.1 tot en met 2.2.8 van hoofdstuk 2
      juncto hoofdstuk 2A, van de bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
  - number: '10.1'
    text: |-
      Voor een inrichting waarop [hoofdstuk 2][ref1] van toepassing is en die op het tijdstip van inwerkingtreding
      van dit besluit reeds was opgericht en waarvoor onmiddellijk daaraan voorafgaand een vergunning in werking en
      onherroepelijk was, blijven de voorschriften van die vergunning in verbinding met de gegevens die behoren bij
      de aanvraag, alsmede de aanvraag voorzover die deel uitmaakt van de vergunning en gegevens bevat die zich lenen
      voor opname of omzetting in voorschriften, gelden als nadere eis, bedoeld in [artikel 5][ref2], behoudens eerdere
      wijziging of intrekking van die voorschriften, gedurende drie jaar na het tijdstip van het van toepassing worden
      van dit besluit op die inrichting, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 5, eerste lid, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0017082#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017082#Artikel5
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017082
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017082
        artikel: '5'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0017082
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning, blijven na het tijdstip van de inwerkingtreding van dit besluit gelden als nadere eis, bedoeld
      in [artikel 5][ref1], mits de desbetreffende nadere eis betrekking heeft op een onderwerp dat is genoemd in
      [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017082#Artikel5
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017082
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017082
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting waarop [hoofdstuk 2][ref1] van
      toepassing is, reeds is opgericht en voor die inrichting onmiddellijk voor dat tijdstip geen vergunning in werking
      en onherroepelijk was, meldt degene die de inrichting drijft aan het bevoegd gezag dat hij de inrichting in werking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017082
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De melding geschiedt binnen twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Artikel6
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017082
        artikel: '6'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten
      van een inrichting is ingediend en dit besluit op de inrichting van toepassing is of zal zijn, zijn het eerste
      en tweede lid niet van toepassing. De aanvraag om de vergunning wordt in dat geval aangemerkt als een melding
      overeenkomstig [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Artikel6
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017082
        artikel: '6'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Dit besluit treedt, met uitzondering van [artikel 7][ref1] en hoofdstuk 2A van de bijlage, in werking op een bij
      koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Artikel7
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017082
        artikel: '7'
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      [Artikel 7][ref1] en hoofdstuk 2A van de bijlage treden in werking op het tijdstip
      waarop het bij koninklijk besluit van 15 januari 2004 ingediende voorstel van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________________________ (PbEG L332) (Kamerstukken II 2003–
      2004, 29 400, nrs. 1–2) tot wet is verheven en in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017082#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016992
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017082
        artikel: '7'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0016992
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit jachthavens.'
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel13
