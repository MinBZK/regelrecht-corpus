    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel3
  - number: '3.2'
    text: 'Dit hoofdstuk is eveneens niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel3
  - number: 3.2.a
    text: |-
