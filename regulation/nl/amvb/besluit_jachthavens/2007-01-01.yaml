  - number: '2.1'
    text: |-
      Dit hoofdstuk is van toepassing op een inrichting waarbij uitsluitend of in hoofdzaak sprake is van een jachthaven
      met ten minste 10 en ten hoogste 500 ligplaatsen voor pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      Dit hoofdstuk is eveneens van toepassing op een inrichting waarin uitsluitend of in hoofdzaak sprake is van
      een samenstel van een jachthaven als bedoeld in het eerste lid met een of meer van de volgende activiteiten,
      voorzieningen of installaties:
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.a
    text: het stallen of gestald houden van pleziervaartuigen,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.b
    text: het onderhouden of repareren van pleziervaartuigen,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.c
    text: installaties voor het afleveren van brandstoffen aan pleziervaartuigen,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.d
    text: |-
      een hotel, restaurant, pension, café, cafetaria, snackbar, discotheek, clubhuis of daaraan verwante gelegenheid
      waar tegen vergoeding logies wordt verstrekt, dranken worden geschonken of spijzen voor directe consumptie worden
      bereid of verstrekt,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.e
    text: een gelegenheid tot zwemmen of baden,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.f
    text: het bieden van recreatief nachtverblijf in ten hoogste 400 vakantiewoningen,
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.g
    text: een kampeerterrein met een capaciteit van ten hoogste 750 kampeermiddelen, of
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
  - number: 2.2.h
    text: het verkopen of verhuren van pleziervaartuigen, scheepsbenodigdheden, kampeerartikelen of levensmiddelen.
    url: https://wetten.overheid.nl/BWBR0017082/2007-01-01#Artikel2
