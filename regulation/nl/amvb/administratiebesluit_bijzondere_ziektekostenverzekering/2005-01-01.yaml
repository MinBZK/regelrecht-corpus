$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: administratiebesluit_bijzondere_ziektekostenverzekering
regulatory_layer: AMVB
publication_date: '2014-12-18'
valid_from: '2005-01-01'
bwb_id: BWBR0003585
url: https://wetten.overheid.nl/BWBR0003585/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 8 april 1982, DG Vgz/VKG/VZ, no 120992;

    Gelet op artikel 16, eerste lid, van de Algemene Wet Bijzondere Ziektekosten (Stb. 1967, 655);

    Gehoord de Ziekenfondsraad;

    De Raad van State gehoord (advies van 30 juni 1982, No. 2220/15/8224);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 22 maart 1983, DG Vgz/
    VKG/VZ, no. 123739;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel1
  - number: 1.a
    text: |-
      de Wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.b
    text: |-
      het centraal administratiekantoor: de ingevolge [artikel 3, eerste lid][ref1], aangewezen centrale instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel3
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '3'
  - number: 1.c
    text: |-
      een verbindingskantoor: een ingevolge [artikel 3, tweede lid][ref1], aangewezen perifere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel3
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '3'
  - number: '2'
    text: |-
      Als zorg, ten aanzien waarvan het in de [artikelen 4 tot en met 6][ref1] en [8][ref2]
      aangegeven deel van de administratie wordt verricht door het centraal administratiekantoor en de
      verbindingskantoren, wordt aangewezen de zorg, geregeld in de [artikelen 3 tot en met 11][ref3]
      en [16 tot en met 18 van het Besluit zorgaanspraken AWBZ][ref4], alsmede de zorg, geregeld in
      [artikel 13 van dat besluit][ref5], voor zover door Onze Minister ingevolge [artikel 3, tweede lid][ref6], voor de
      desbetreffende ziekenhuizen een verbindingskantoor wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0003585#Artikel3
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0014149
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0014149
        artikel: '13'
      - id: ref6
        bwb_id: BWBR0003585
        artikel: '3'
  - number: '3.1'
    text: |-
      Onze Minister wijst een rechtspersoon met volledige rechtsbevoegdheid aan als centrale instelling voor het
      verrichten van het in de [artikelen 4][ref1] tot en met [9][ref2] aangegeven deel van de administratie ten aanzien
      van zorg die in het [Besluit zorgaanspraken AWBZ][ref3] is geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014149
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0014149
  - number: '3.2'
    text: |-
      Onze Minister wijst telkens voor een periode van vier jaren uitvoeringsorganen of rechtspersonen als bedoeld in
      [artikel 1x11, derde lid, van de Ziekenfondswet][ref1], aan als perifere instelling voor het verrichten van het in
      [artikel 8][ref2] aangegeven deel van de administratie met betrekking tot zorg als bedoeld in [artikel 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x11
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003585#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x11
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003585
        artikel: '2'
  - number: '3.3'
    text: Onze Minister kan een aanwijzing bedoeld in het eerste en tweede lid wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel3
  - number: '3.4'
    text: |-
      Aan een aanwijzing van een instelling als bedoeld in het eerste en tweede lid, kan Onze Minister voorwaarden
      verbinden. Nieuwe voorwaarden kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel3
  - number: '3.5'
    text: |-
      De in de leden 2, 3 en 4 vermelde bevoegdheden ten aanzien van de aanwijzing van een instelling als bedoeld in
      het tweede lid, worden door Onze Minister uitgeoefend op voordracht van de organisaties van uitvoeringsorganen
      gezamenlijk, gehoord het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het centraal administratiekantoor verricht de administratieve taak van landelijk kantoor voor de betaling van
      bedragen, welke uit hoofde van de uitvoering van de wet verschuldigd zijn aan personen en instellingen ter zake van
      het verlenen van zorg als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '2'
  - number: '4.2'
    text: De in het eerste lid bedoelde betalingen geschieden namens de uitvoeringsorganen.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het centraal administratiekantoor levert ten behoeve van de vaststelling van de bijdrage, bedoeld in de
      [artikelen 4][ref1] en [14 van het Bijdragebesluit zorg][ref2], aan de uitvoeringsorganen inkomensgegevens die door
      de Belastingsdienst voor dat doel aan hem zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel14
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '14'
  - number: '5.2'
    text: |-
      Het centraal administratiekantoor verricht voor de uitvoeringsorganen de vaststelling en de inning van de bijdrage,
      bedoeld in [artikel 16d van het Bijdragebesluit zorg][ref1], op basis van de door de Belastingsdienst verstrekte
      inkomensgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16d
  - number: '7.1'
    text: |-
      Het centraal administratiekantoor verricht voorts de administratieve taak van landelijk kantoor voor betaling van
      bedragen, welke dienen tot vergoeding van bedragen welke de uitvoeringsorganen uit hoofde van de uitvoering van
      de wet verschuldigd zijn aan personen en instellingen ter zake van het verlenen van zorg, voor zover die niet is
      begrepen onder die, genoemd in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '2'
  - number: '7.2'
    text: De in het eerste lid bedoelde betalingen geschieden namens het College zorgverzekeringen.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      De verbindingskantoren bevorderen het administratieve contact tussen de personen en instellingen die zorg verlenen
      enerzijds en het centraal administratiekantoor anderzijds. Zij dienen de uitvoeringsorganen voor zover nodig
      van advies met betrekking tot de beoordeling van de aanspraken van verzekerden, alsmede met betrekking tot de
      verschuldigdheid en de betalingswijze van bijdragen als bedoeld in [artikel 5, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel5
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '5'
  - number: '8.2'
    text: |-
      De uitvoeringsorganen enerzijds en de verbindingskantoren anderzijds verstrekken elkaar alle gegevens, welke zij
      voor de vervulling van hun taak bij de uitvoering van de wet nodig hebben.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Het centraal administratiekantoor enerzijds en de verbindingskantoren anderzijds verstrekken elkaar alle gegevens,
      welke zij voor de vervulling van hun taak bij de uitvoering van de wet nodig hebben.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het centraal administratiekantoor verricht de in [artikel 4, eerste lid][ref1], bedoelde betalingen aan de hand van
      de overeenkomstig het derde lid van de verbindingskantoren verkregen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel4
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '4'
  - number: '8.5'
    text: |-
      Het College zorgverzekeringen kan termijnen vaststellen, binnen welke de in het derde lid bedoelde gegevens dienen
      te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het centraal administratiekantoor kan aan personen en instellingen voorschotten op de verschuldigde bedragen in
      rekening-courant uitkeren.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het centraal administratiekantoor keert de in het eerste lid bedoelde voorschotten uit aan de hand van de
      overeenkomstig [artikel 8, derde lid][ref1], van de verbindingskantoren verkregen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '8'
  - number: '9.3'
    text: Het College zorgverzekeringen kan nadere regels stellen met betrekking tot het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het College toezicht is belast met het toezicht op de rechtmatige en doelmatige uitvoering van de Wet door het
      centraal administratiekantoor en door de verbindingskantoren.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel10
  - number: '10.2'
    text: |-
      De [artikelen 1x7][ref1], [1x11][ref2], [1x12][ref3], [43e][ref4] en [43f van de Ziekenfondswet][ref5] zijn van
      overeenkomstige toepassing op het centraal administratiekantoor en de verbindingskantoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1x7
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1x11
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel1x12
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel43e
      [ref5]: https://wetten.overheid.nl/BWBR0002460#Artikel43f
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1x7
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1x11
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 1x12
      - id: ref4
        bwb_id: BWBR0002460
        artikel: 43e
      - id: ref5
        bwb_id: BWBR0002460
        artikel: 43f
  - number: '10.3'
    text: |-
      Onverminderd het tweede lid kan het College zorgverzekeringen regels stellen over de wijze waarop het centraal
      administratiekantoor en de verbindingskantoren hun werkzaamheden uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel10
  - number: '11'
    text: |-
      De kosten welke het centraal administratiekantoor en de verbindingskantoren voor de uitvoering van hun taken maken,
      worden gedekt door uitkeringen uit het Algemeen Fonds Bijzondere Ziektekosten volgens het bepaalde bij en krachtens
      het [Besluit financiering uitvoeringsorganisatie Bijzondere Ziektekostenverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004783
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004783
  - number: '12'
    text: |-
      Het Besluit regeling administratie verstrekkingen Bijzondere Ziektekostenverzekering (*Stb.* 1968, 13) wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel12
  - number: '13'
    text: Dit besluit kan worden aangehaald als Administratiebesluit Bijzondere Ziektekostenverzekering.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst. Onze Minister van Welzijn, Volksgezondheid en Cultuur is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003585/2005-01-01#Artikel14
