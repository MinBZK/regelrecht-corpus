  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst. Onze Minister van Welzijn, Volksgezondheid en Cultuur is belast met de uitvoering van dit besluit.
