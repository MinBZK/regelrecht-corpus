        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '2'
  - number: '8'
    text: |-
      1 De verbindingskantoren bevorderen het administratieve contact tussen de zorgaanbieders enerzijds en het CAK
      anderzijds. Zij dienen de zorgverzekeraars voor zover nodig van advies met betrekking tot de beoordeling van de
      aanspraken van verzekerden, alsmede met betrekking tot de verschuldigdheid en de betalingswijze van bijdragen als
      bedoeld in de [artikelen 4][ref1], [14][ref2] en [16d van het Bijdragebesluit zorg][ref3].

      2 De zorgverzekeraars verstrekken de verbindingskantoren alle gegevens, welke zij voor de vervulling van hun taak
      bij de uitvoering van de wet nodig hebben.

      3 Het CAK verricht de in [artikel 49, onder e, van de wet][ref4] bedoelde betalingen aan de hand van
      de overeenkomstig de [artikelen 54, eerste lid][ref5], en [55, eerste lid, van de wet][ref6], van de
      verbindingskantoren verkregen gegevens.

      4 Het Zorginstituut kan termijnen vaststellen, binnen welke de in het derde lid bedoelde gegevens dienen te worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel54
      [ref6]: https://wetten.overheid.nl/BWBR0002614#Artikel55
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel8
