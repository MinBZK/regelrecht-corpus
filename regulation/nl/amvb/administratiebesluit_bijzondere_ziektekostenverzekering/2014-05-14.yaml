  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 8 april 1982, DG Vgz/VKG/VZ, no 120992;

    Gelet op artikel 16, eerste lid, van de Algemene Wet Bijzondere Ziektekosten (Stb. 1967, 655);

    Gehoord de Ziekenfondsraad;

    De Raad van State gehoord (advies van 30 juni 1982, No. 2220/15/8224);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 22 maart 1983, DG Vgz/
    VKG/VZ, no. 123739;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

      a. *de wet:* de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b.

      c. een verbindingskantoor: een ingevolge [artikel 3, tweede lid][ref2], aangewezen perifere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel3
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel1
