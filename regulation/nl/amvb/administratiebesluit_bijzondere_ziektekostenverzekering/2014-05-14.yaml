  - number: '3'
    text: |-
      1 Onze Minister wijst voor een periode van ten hoogste vier jaren rechtspersonen aan voor het verrichten van het in
      [artikel 8][ref1] aangegeven deel van de administratie met betrekking tot zorg als bedoeld in [artikel 2][ref2].

      2 Onze Minister kan een aanwijzing bedoeld in het eerste lid wijzigen of intrekken.

      3 Aan een aanwijzing van een instelling als bedoeld in het eerste lid, kan Onze Minister voorwaarden verbinden.
      Nieuwe voorwaarden kunnen worden gesteld.

      4 De in het eerste tot en met derde lid vermelde bevoegdheden worden door Onze Minister uitgeoefend op gezamenlijke
      voordracht van de organisaties van zorgverzekeraars, gehoord het Zorginstituut en het College toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel3
    references:
