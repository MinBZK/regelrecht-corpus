        artikel: '3'
  - number: '2'
    text: |-
      Als zorg, ten aanzien waarvan het in [artikel 8][ref1] aangegeven deel van de administratie
      wordt verricht door de verbindingskantoren, wordt aangewezen de zorg, geregeld in de
      [artikelen 4 tot en met 6][ref2], [8 tot en met 12][ref3], [13, tweede lid][ref4], [14][ref5], [17][ref6] en
      [18 van het Besluit zorgaanspraken AWBZ][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
