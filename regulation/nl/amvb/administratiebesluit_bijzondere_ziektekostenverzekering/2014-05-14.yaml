preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 8 april 1982, DG Vgz/VKG/VZ, no 120992;

    Gelet op artikel 16, eerste lid, van de Algemene Wet Bijzondere Ziektekosten (Stb. 1967, 655);

    Gehoord de Ziekenfondsraad;

    De Raad van State gehoord (advies van 30 juni 1982, No. 2220/15/8224);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 22 maart 1983, DG Vgz/
    VKG/VZ, no. 123739;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel1
  - number: 1.a
    text: |-
      *de wet:* de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.c
    text: |-
      een verbindingskantoor: een ingevolge [artikel 3, tweede lid][ref1], aangewezen perifere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel3
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '3'
  - number: '2'
    text: |-
      Als zorg, ten aanzien waarvan het in [artikel 8][ref1] aangegeven deel van de administratie
      wordt verricht door de verbindingskantoren, wordt aangewezen de zorg, geregeld in de
      [artikelen 4 tot en met 6][ref2], [8 tot en met 12][ref3], [13, tweede lid][ref4], [14][ref5], [17][ref6] en
      [18 van het Besluit zorgaanspraken AWBZ][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0014149#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0014149#Artikel18
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0014149
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0014149
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0014149
        artikel: '17'
      - id: ref7
        bwb_id: BWBR0014149
        artikel: '18'
  - number: '3.1'
    text: |-
      Onze Minister wijst voor een periode van ten hoogste vier jaren rechtspersonen aan voor het verrichten van het in
      [artikel 8][ref1] aangegeven deel van de administratie met betrekking tot zorg als bedoeld in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '2'
  - number: '3.2'
    text: Onze Minister kan een aanwijzing bedoeld in het eerste lid wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel3
  - number: '3.3'
    text: |-
      Aan een aanwijzing van een instelling als bedoeld in het eerste lid, kan Onze Minister voorwaarden verbinden.
      Nieuwe voorwaarden kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel3
  - number: '3.4'
    text: |-
      De in het eerste tot en met derde lid vermelde bevoegdheden worden door Onze Minister uitgeoefend op gezamenlijke
      voordracht van de organisaties van zorgverzekeraars, gehoord het Zorginstituut en het College toezicht.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel3
  - number: '8.1'
    text: |-
      De verbindingskantoren bevorderen het administratieve contact tussen de zorgaanbieders enerzijds en het CAK
      anderzijds. Zij dienen de zorgverzekeraars voor zover nodig van advies met betrekking tot de beoordeling van de
      aanspraken van verzekerden, alsmede met betrekking tot de verschuldigdheid en de betalingswijze van bijdragen als
      bedoeld in de [artikelen 4][ref1], [14][ref2] en [16d van het Bijdragebesluit zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008253
        artikel: 16d
  - number: '8.2'
    text: |-
      De zorgverzekeraars verstrekken de verbindingskantoren alle gegevens, welke zij voor de vervulling van hun taak bij
      de uitvoering van de wet nodig hebben.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel8
  - number: '8.3'
    text: |-
      Het CAK verricht de in [artikel 49, onder e, van de wet][ref1] bedoelde betalingen aan de hand van
      de overeenkomstig de [artikelen 54, eerste lid][ref2], en [55, eerste lid, van de wet][ref3], van de
      verbindingskantoren verkregen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel55
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '54'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '55'
  - number: '8.4'
    text: |-
      Het Zorginstituut kan termijnen vaststellen, binnen welke de in het derde lid bedoelde gegevens dienen te worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel8
  - number: '9.1'
    text: |-
      Het CAK keert eventuele voorschotten op de aan zorgaanbieders verschuldigde bedragen uit aan de hand van de
      overeenkomstig [artikel 8, derde lid][ref1], van de verbindingskantoren verkregen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '8'
  - number: '9.2'
    text: |-
      Het Zorginstituut kan regels stellen met betrekking tot het uitkeren van voorschotten op de verschuldigde bedragen
      door het CAK aan zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel9
  - number: '10.1'
    text: |-
      De [artikelen 36][ref1], [37][ref2], [55, tweede lid][ref3], en [56 van de wet][ref4] zijn van overeenkomstige
      toepassing op de verbindingskantoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel56
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '36'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '56'
  - number: '10.2'
    text: |-
      Onverminderd het eerste lid kan het Zorginstituut regels stellen over de wijze waarop de verbindingskantoren hun
      werkzaamheden uitvoeren.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel10
  - number: '11'
    text: |-
      Dit besluit is niet van toepassing op forensische zorg als bedoeld in
      [artikel 2 van het Interimbesluit forensische zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel2
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '2'
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Administratiebesluit Bijzondere Ziektekostenverzekering.'
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel13
  - number: '14'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst. Onze Minister van Welzijn, Volksgezondheid en Cultuur is belast met de uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel14
