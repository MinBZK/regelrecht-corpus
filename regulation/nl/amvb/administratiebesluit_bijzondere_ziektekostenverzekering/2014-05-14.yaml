  - number: '9'
    text: |-
      1 Het CAK keert eventuele voorschotten op de aan zorgaanbieders verschuldigde bedragen uit aan de hand van de
      overeenkomstig [artikel 8, derde lid][ref1], van de verbindingskantoren verkregen gegevens.

      2 Het Zorginstituut kan regels stellen met betrekking tot het uitkeren van voorschotten op de verschuldigde
      bedragen door het CAK aan zorgaanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel8
    url: https://wetten.overheid.nl/BWBR0003585/2014-05-14#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '8'
  - number: '10'
    text: |-
      1 De [artikelen 36][ref1], [37][ref2], [55, tweede lid][ref3], en [56 van de wet][ref4] zijn van overeenkomstige
      toepassing op de verbindingskantoren.

      2 Onverminderd het eerste lid kan het Zorginstituut regels stellen over de wijze waarop de verbindingskantoren hun
      werkzaamheden uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel36
