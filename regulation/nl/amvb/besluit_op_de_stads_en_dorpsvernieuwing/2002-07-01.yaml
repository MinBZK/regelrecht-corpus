preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 23 juli
    1984, no. MJZ 2374020, Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Gelet op de artikelen 4, derde en vierde lid, 39, derde, vierde en zevende lid, 40, tweede lid, 42, 43 en 53 van de
    Wet op de stads- en dorpsvernieuwing (Stb. 1984, 406);

    De Raad van State gehoord, advies van 17 oktober 1984, no. W 08.84.0399/14.4.42;

    Gezien het nader rapport van voornoemde Staatssecretaris van 22 oktober 1984, no. MJZ 2204037, Centrale Directie
    Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: de wet: de [Wet op de stads- en dorpsvernieuwing][ref1]; Onze Minister: Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003709
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003709
  - number: '7.1'
    text: |-
      Een stadsvernieuwingsfonds mag, behoudens op een daartoe strekkend verzoek van burgemeester en wethouders of
      Gedeputeerde Staten door Onze Minister met toepassing van de wet verleende vrijstelling, ten hoogste een bedrag
      bevatten, gelijk aan vier maal het bedrag van de krachtens de wet aan de gemeente of provincie uitgekeerde
      jaarlijkse bijdrage.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel7
  - number: '7.2'
    text: |-
      De stand van het stadsvernieuwingsfonds aan het einde van het kalenderjaar en het bedrag van de over datzelfde
      kalenderjaar krachtens de wet aan de gemeente of provincie uitgekeerde jaarlijkse bijdrage, vermeerderd met de
      bedragen van de betrokken bijdragen over de drie onmiddellijk daaraan voorafgaande kalenderjaren, zijn bepalend bij
      de vaststelling of het in het eerste lid gestelde maximum wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel7
  - number: '7.3'
    text: |-
      Indien en zodra Onze Minister van oordeel is of vermoedt, dat het in het eerste lid gestelde maximum wordt
      overschreden, stelt hij het gemeentebestuur of het provinciaal bestuur in de gelegenheid binnen een door hem te
      bepalen termijn op de door hem te bepalen wijze nadere inlichtingen te verstrekken en een zienswijze naar voren te
      brengen over verlaging of stopzetting van de jaarlijkse bijdrage.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister maakt zijn besluit omtrent verlaging of stopzetting van de jaarlijkse bijdrage bekend binnen vier
      weken nadat het betrokken bestuur gevolg heeft gegeven aan het derde lid, of, indien dat bestuur niet binnen de
      krachtens dat lid gestelde termijn gevolg geeft aan dat lid, binnen vier weken na het verloop van die termijn. Het
      besluit wordt van kracht op 1 januari van het kalenderjaar dat volgt op dat waarin het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel7
  - number: '7.5'
    text: |-
      Onze Minister kan een besluit tot verlaging of stopzetting van de jaarlijkse bijdrage intrekken na een daartoe
      strekkend verzoek van het gemeentebestuur of het provinciaal bestuur. De intrekking wordt van kracht op 1 januari
      van een door Onze Minister daarbij te bepalen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel7
  - number: '9'
    text: |-
      Indien burgemeester en wethouders of Gedeputeerde Staten een verzoek hebben ingediend tot het verlenen van
      een vrijstelling als bedoeld in [artikel 7, eerste lid][ref1], stelt Onze Minister het gemeentebestuur of het
      provinciaal bestuur in de gelegenheid binnen een door hem te bepalen termijn op de door hem te bepalen wijze nadere
      inlichtingen te verstrekken. [Artikel 7, vierde en vijfde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003719#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003719#Artikel7
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003719
        artikel: '7'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003719
        artikel: '7'
        hoofdstuk: '5'
  - number: '12'
    text: |-
      De middelen die ingevolge besluiten tot verlaging of stopzetting van een jaarlijkse bijdrage beschikbaar komen
      bij het Rijk, worden toegevoegd aan de jaarlijkse bijdragen voor de door die besluiten niet getroffen gemeenten
      en provincies, waarbij het percentage wordt toegepast dat ingevolge [artikel 4][ref1], zoals dat luidde op
      31 december 1999, laatstelijk voor die toevoeging is toegepast bij het berekenen van het bedrag, bedoeld in
      [artikel 39, derde of vierde lid, van de wet][ref2] zoals dat artikel op 31 december 1999 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0003719#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003709#Artikel39
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003719
        artikel: '4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0003709
        artikel: '39'
  - number: '13.1'
    text: |-
      Het door burgemeester en wethouders en Gedeputeerde Staten ingevolge [artikel 42 van de wet][ref1], zoals dat
      luidde op 31 december 1999, uit te brengen verslag over de besteding van de uit de jaarlijkse bijdragen ontvangen
      gelden en over de stand van het stadsvernieuwingsfonds, is schriftelijk, wordt ingericht overeenkomstig de bij dit
      besluit behorende [bijlage I][ref2] en vermeldt alle in die bijlage gevraagde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003719
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003719
  - number: '13.2'
    text: |-
      Onze Minister kan nadere aanwijzingen geven ten aanzien van de wijze waarop de in het eerste lid bedoelde gegevens
      moeten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel13
  - number: '13.3'
    text: |-
      De accountantsverklaring, bedoeld in [artikel 42, tweede volzin, van de wet][ref1], zoals die volzin luidde op 31
      december 1999, wordt opgesteld met inachtneming van de bij dit besluit behorende [bijlage II][ref2]. De verklaring
      gaat vergezeld van het rapport van bevindingen, bedoeld in punt 3 van het onderdeel, getiteld «Richtlijnen», van
      die bijlage, indien een zodanig rapport is opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003709#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003719
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003709
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0003719
  - number: '13.4'
    text: |-
      In een bijlage van of toelichting op het verslag vermelden burgemeester en wethouders en Gedeputeerde Staten al
      hetgeen zij nodig of nuttig achten voor een juiste beoordeling van het verslag.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel13
  - number: '13.5'
    text: |-
      Onze Minister kan een controle doen instellen op de gegevens die vermeld zijn in het verslag, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel13
  - number: '20.1'
    text: |-
      Dit besluit treedt in werking tegelijk met de [Wet op de Stads- en dorpsvernieuwing][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003709
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003709
  - number: '20.2'
    text: Het kan worden aangehaald als Besluit op de stads- en dorpsvernieuwing.
    url: https://wetten.overheid.nl/BWBR0003719/2002-07-01#Artikel20
