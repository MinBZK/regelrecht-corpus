  - number: '24'
    text: |-
      Overschrijding van de in dit hoofdstuk gestelde termijnen door de overdragende of ontvangende uitvoerder wordt de
      deelnemer niet tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel24
  - number: '25'
    text: |-
      1 De overdrachtswaarde van pensioenaanspraken is ten minste gelijk aan de contante waarde van de over te dragen
      pensioenaanspraken op de overdrachtsdatum en wordt berekend op basis van het standaardtarief. Onze Minister stelt
      regels inzake het standaardtarief. Het standaardtarief wordt berekend op basis van marktwaardering.

      2 Indien de overdrachtswaarde niet op basis van het standaardtarief berekend kan worden, worden de
      pensioenaanspraken met behoud van de actuariële gelijkwaardigheid eerst omgezet in pensioenaanspraken waarop het
      standaardtarief wel toegepast kan worden.

      3 Bij de berekening van de overdrachtswaarde mogen buiten beschouwing blijven:

      a. partnerpensioen dat is verzekerd op risicobasis, wezenpensioen en arbeidsongeschiktheidspensioen; en

      b. aanspraken op partnerpensioen die achterblijven bij de overdragende uitvoerder.

      4 De overdrachtswaarde wordt, in afwijking van het eerste lid, niet berekend op basis van het standaardtarief
      indien de pensioenaanspraken voortvloeien uit:

      a. een kapitaalovereenkomst of kapitaalregeling;

      b. een premieovereenkomst of premieregeling, waarbij de premie wordt belegd; of

      c. een premieovereenkomst of premieregeling waarbij de premie wordt aangewend voor de aankoop van een verzekerd
      kapitaal.

      5 Onze Minister stelt regels voor de berekening van de overdrachtswaarde in de in het vierde lid genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel25
  - number: '26'
    text: |-
      Indien bij een uitkeringsovereenkomst, een uitkeringsregeling of een premieovereenkomst of premieregeling
      waarbij de premie onmiddellijk na het beschikbaar stellen wordt omgezet in een aanspraak op een uitkering de
      overdrachtswaarde niet gelijk is aan de waarde van het gefinancierde deel van de aanspraken, komt het verschil ten
      gunste, respectievelijk ten laste, van de oude werkgever of van het fonds waar de regeling was ondergebracht.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel26
  - number: '27'
    text: |-
      1 Onze Minister stelt regels voor de berekening van de inkoop van pensioenaanspraken op grond van de
      overdrachtswaarde in de pensioenregeling van de ontvangende uitvoerder.

      2 In geval van waardeoverdracht naar een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      wordt de overdrachtswaarde binnen een week na ontvangst van de overdrachtswaarde aangewend voor de aankoop van
      beleggingseenheden.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel27
  - number: '28'
    text: |-
      1 De na waardeoverdracht verkregen aanspraken in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder,
      worden behandeld alsof zij in die regeling zelf zijn opgebouwd, waarbij zij ook ten aanzien van de toeslagverlening
      op dezelfde manier behandeld worden.

      2 Indien de ontvangende uitvoerder een beroepspensioenregeling uitvoert, kan worden afgeweken van het eerste lid
      ten aanzien van de toeslagverlening indien toepassing van het eerste lid op dat punt zou leiden tot een kennelijk
      onredelijk resultaat.

      3 Indien in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder, pensioenopbouw plaatsvindt op basis
      van dienstjaren, wordt de overdrachtswaarde omgezet in voor de pensioenopbouw meetellende dienstjaren.

      4 In een pensioenregeling die voor de pensioenopbouw rekent met een maximaal te bereiken aantal dienstjaren, geldt
      dat, indien toepassing van het tweede lid leidt tot meer dan het maximale aantal dienstjaren, het meerdere wordt
      behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel28
  - number: '29'
    text: |-
      Voorafgaand aan de benoeming van een persoon die het beleid van een fonds gaat bepalen of mede
      bepalen toetst de Nederlandsche Bank de deskundigheid en betrouwbaarheid van die persoon, bedoeld in
      [artikel 105 van de Pensioenwet][ref1] dan wel [artikel 110 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '110'
  - number: '30'
    text: |-
      1 Voor het voldoen aan de vereiste deskundigheid is er in de kring van personen die het beleid
      van het fonds bepalen of mede bepalen ten minste een zodanig niveau van kennis en ervaring
      aanwezig dat het fonds, mede gelet op [artikel 105, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 110, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], behoorlijk wordt bestuurd.

      2 Ten minste twee personen in de kring van personen die het beleid van het fonds bepalen of mede bepalen dienen
      meerjarige ervaring te hebben in het besturen van een organisatie.

      3 De in het eerste lid bedoelde deskundigheid heeft betrekking op:

      a. het besturen van een organisatie;

      b. relevante wet- en regelgeving;

      c. pensioenregelingen en pensioensoorten;

      d. financieel technische en actuariële aspecten, waaronder financiering, beleggingen, actuariële principes en
      herverzekering;

      e. administratieve organisatie en interne controle; en

      f. communicatie.

      4 Het fonds geeft op verzoek van de Nederlandsche Bank aan:

      a. hoe het beleid van het fonds ter bevordering en handhaving van het vereiste deskundigheidsniveau luidt;

      b. welke personen belast zijn met welke beleidsbepalende taken;

      c. welke personen over welke deskundigheid beschikken; en

      d. hoe en binnen welke termijn bepaalde tekortkomingen in de vereiste deskundigheid opgeheven zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel30
    references:
      - id: ref1
