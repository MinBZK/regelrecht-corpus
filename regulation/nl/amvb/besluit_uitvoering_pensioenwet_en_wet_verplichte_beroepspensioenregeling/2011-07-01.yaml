  - number: '11'
    text: |-
      Als principes voor goed pensioenfondsbestuur als bedoeld in [artikel 33, tweede lid, van de Pensioenwet][ref1]
      dan wel [artikel 42, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] worden aangewezen de
      Principes voor goed pensioenfondsbestuur, zoals geformuleerd door de Stichting van de Arbeid op 16 december
      2005. De principes die daarbij zijn geformuleerd voor verzekeraars zijn van overeenkomstige toepassing op
      premiepensioeninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel11
