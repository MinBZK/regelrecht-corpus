  - number: '34'
    text: |-
      1 De betrouwbaarheid van een persoon als bedoeld in [artikel 31][ref1] staat niet buiten twijfel als deze
      veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van de bijlage bij dit besluit, tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.

      2 De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 35][ref2], afwijken van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel35
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel34
    references:
