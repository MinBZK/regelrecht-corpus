  - number: '42'
    text: |-
      1 De toezichthouder brengt jaarlijks een bedrag in rekening aan uitvoerders ter zake van kosten als bedoeld in
      [artikel 160 van de Pensioenwet][ref1] dan wel [artikel 155 van de Wet verplichte beroepspensioenregeling][ref2],
      voor zover de desbetreffende kosten niet al op grond van [artikel 41][ref3] in rekening worden gebracht.

      2 De op grond van het eerste lid in rekening te brengen kosten worden op basis van de begroting waarmee is
      ingestemd door Onze Minister, geraamd voor het jaar waarop het in rekening te brengen bedrag betrekking heeft.

      3 De geraamde kosten worden toegerekend aan categorieën van uitvoerders naar de mate van het beslag
      op de werkzaamheden van de toezichthouder, bedoeld in [artikel 160 van de Pensioenwet][ref4] en
      [artikel 155 van de Wet verplichte beroepspensioenregeling][ref5].

      4 De per categorie toegerekende geraamde kosten worden verminderd of vermeerderd met het aan de desbetreffende
      categorie toe te rekenen exploitatiesaldo als bedoeld in [artikel 160, tweede lid, van de Pensioenwet][ref6]
      en [artikel 155, tweede lid, van de Wet verplichte beroepspensioenregeling][ref7], en verminderd
      met de aan de desbetreffende categorie toe te rekenen opbrengsten uit bestuurlijke boetes en
      verbeurde dwangsommen als bedoeld in [artikel 160, derde lid, van de Pensioenwet][ref8] en
      [artikel 155, derde lid, van de Wet verplichte beroepspensioenregeling][ref9] die niet reeds zijn opgenomen in
      het exploitatiesaldo.

      5 De in het derde lid bedoelde categorieën van pensioenuitvoerders zijn:

      a. fondsen;

      b. verzekeraars;

      c. premiepensioeninstellingen.

      6 Bij regeling van Onze Minister kunnen nadere categorieën worden vastgesteld.


