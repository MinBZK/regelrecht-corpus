  - number: '43'
    text: |-
      1 Het bedrag, bedoeld in [artikel 42, eerste lid][ref1], bestaat uit per categorie vast te stellen minimumbedragen
      ter dekking van de minimale toezichtkosten per uitvoerder in de desbetreffende categorie, vermeerderd met een
      bedrag dat:

      a. wordt gebaseerd op de kosten die per categorie zijn toegerekend op de wijze, bedoeld in [artikel 42][ref2],
      onder aftrek van het totaal van de aan de desbetreffende categorie in rekening te brengen minimumbedragen, en

      b. is doorberekend naar rato van de maatstafgegevens die betrekking hebben op het voorafgaande jaar dan wel, indien
      deze gegevens niet beschikbaar zijn, het daaraan voorafgaande jaar of het lopende jaar.

      2 Bij regeling van Onze Minister kunnen op voorstel van de toezichthouder per onderwerp van toezicht worden
      vastgesteld:

      a. de minimumbedragen per categorie;

      b. de maatstaven per categorie;

      c. de maximummaatstaven per categorie; en

      d. de tarieven per categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '42'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '42'
        hoofdstuk: '9'
  - number: '44'
    text: |-
      1 Het bedrag, bepaald op basis van [artikel 43][ref1], wordt voor een uitvoerder die niet eerder dan 1 februari van
      het lopende jaar onder een categorie valt, in rekening gebracht naar evenredigheid van het aantal maanden in het
      jaar dat de uitvoerder onder de categorie valt, waarbij een gedeelte van een maand geldt als volledige maand.

      2 Aan een uitvoerder die niet langer onder een categorie valt, wordt het bedrag terugbetaald naar evenredigheid van
      het aantal maanden van het jaar dat de uitvoerder niet langer onder de categorie valt, waarbij een gedeelte van een
      maand geldt als volledige maand.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel43
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '43'
        hoofdstuk: '9'
  - number: '45'
    text: |-
      1 Een uitvoerder verstrekt binnen een door de toezichthouder te stellen redelijke termijn een opgave van de
      maatstafgegevens.

      2 Indien een uitvoerder niet binnen de in het eerste lid bedoelde termijn een opgave heeft gedaan of een kennelijk
      onjuiste of onvolledige opgave heeft gedaan, kan de toezichthouder een schatting maken van de maatstafgegevens.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel45
  - number: '46'
    text: |-
      1 De toezichthouder bepaalt de wijze en het tijdstip van betaling van de bedragen, bedoeld in de
      [artikelen 41][ref1] en [42][ref2].

      2 Indien als wijze van betaling automatische incasso is overeengekomen, kan de toezichthouder bij het in rekening
      brengen van het bedrag per factuur een korting toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '41'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '42'
        hoofdstuk: '9'
  - number: '47'
    text: |-
      Indien een uitvoerder het vermogen heeft gekregen van een uitvoerder die in het lopende jaar of in het voorafgaande
      jaar is opgehouden onder een categorie te vallen, wordt het bedrag ter vergoeding van de kosten, bedoeld in
      [artikel 42, eerste lid][ref1], die door de toezichthouder ten aanzien van laatstbedoelde uitvoerder zijn gemaakt,
      in rekening gebracht bij de verkrijgende uitvoerder, voor zover deze kosten niet reeds bij de laatstbedoelde
      uitvoerder in rekening zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '42'
        hoofdstuk: '9'
  - number: '48'
    text: |-
      1 De toezichthouder stelt een bestuurlijke boete in de tweede of derde categorie vast
      op het basisbedrag, bedoeld in [artikel 179, tweede lid, van de Pensioenwet][ref1] en
      [artikel 174, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2].

      2 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de ernst of duur van de
      overtreding een dergelijke verlaging of verhoging rechtvaardigt.

      3 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de mate van
      verwijtbaarheid van de overtreder een dergelijke verlaging of verhoging rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel174
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '174'
  - number: '49'
    text: |-
      De door de toezichthouder met toepassing van [artikel 48][ref1] vast te stellen bestuurlijke boete wordt verdubbeld
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '48'
        hoofdstuk: '10'
  - number: '50'
    text: |-
      1 De toezichthouder houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.

      2 De toezichthouder kan op basis van het eerste lid de op te leggen bestuurlijke boete verlagen met maximaal 100
      procent.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel50
  - number: '51'
    text: |-
      1 De toezichthouder houdt bij het vaststellen van een bestuurlijke boete voor pensioenuitvoerders rekening met
      schade voor derden.

      2 De toezichthouder kan de op te leggen bestuurlijke boete, na inachtneming van de bepalingen, bedoeld in de
      [artikelen 48][ref1], [49][ref2] en [50][ref3] verlagen met maximaal 75 procent.


