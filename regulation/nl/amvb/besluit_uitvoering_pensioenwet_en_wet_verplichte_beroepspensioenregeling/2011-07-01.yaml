        bwb_id: BWBR0020809
      - id: ref3
        bwb_id: BWBR0018831
  - number: 35a
    text: |-
      1 De Nederlandsche Bank verleent de verklaring van geen bezwaar, bedoeld in [artikel 108a van de Pensioenwet][ref1]
      en [artikel 113a van de Wet verplichte beroepspensioenregeling][ref2].

      2 Bij de aanvraag van de verklaring van geen bezwaar, bedoeld in het eerste lid, worden in ieder geval verstrekt:

      a. een door een accountant gecontroleerde en gewaarmerkte balans van het fonds met als peildatum de datum van
      omzetting van het fonds in een andere rechtsvorm; en

      b. de schriftelijk vastgelegde afspraken over de besteding van het vermogen van het fonds en de vruchten daarvan na
      de omzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel108a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel113a
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel35a
