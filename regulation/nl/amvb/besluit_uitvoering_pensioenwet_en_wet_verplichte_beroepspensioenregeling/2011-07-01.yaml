  - number: '2'
    text: |-
      1 De informatie over de inhoud van de basispensioenregeling, bedoeld in [artikel 21 van de Pensioenwet][ref1] dan
      wel [artikel 48 van de Wet verplichte beroepspensioenregeling][ref2], bevat in ieder geval het volgende:

      a. de ingangsdatum van de pensioenovereenkomst dan wel beroepspensioenregeling;

      b. de pensioensoorten, waarbij aangegeven wordt of nabestaandenpensioen, al dan niet samen met ouderdomspensioen,
      deel uitmaakt van de basispensioenregeling;

      c. het karakter van de pensioenovereenkomst, bedoeld in [artikel 10 van de Pensioenwet][ref3], dan wel de
      beroepspensioenregeling, bedoeld in [artikel 28 van de Wet verplichte beroepspensioenregeling][ref4], waarbij wordt
      vermeld welke risico’s door de werknemer dan wel beroepsgenoot gedragen worden;

      d. de wijze waarop de pensioenaanspraken worden vastgesteld;

      e. de ingangsdatum van het pensioen en de duur van de uitkering;

      f. de gevolgen van beëindiging van de deelneming voor de hoogte van de pensioenaanspraken waarbij aangegeven wordt
      welke pensioenaanspraken op risicobasis zijn;

      g. de gevolgen van arbeidsongeschiktheid voor de verwerving van pensioenaanspraken;

      h. een betalingsvoorbehoud van de werkgever;

      i. de mogelijkheid tot vrijwillige voortzetting, bedoeld in [artikel 54 van de Pensioenwet][ref5] dan wel
      [artikel 65 van de Wet verplichte beroepspensioenregeling][ref6]; en

      j. de informatieverplichtingen van de werknemer dan wel beroepsgenoot jegens de werkgever en de uitvoerder.

      2 Indien er sprake is van een premieovereenkomst dan wel premieregeling informeert de uitvoerder de werknemer dan
      wel beroepsgenoot over:

      a. de bestemming van de premie waarbij onderscheid gemaakt wordt tussen pensioen op opbouwbasis, pensioen op
      risicobasis, de kosten en de ontwikkeling van deze elementen in de tijd; en

      b. het verloop van de premie.

      3 Tevens wordt informatie verstrekt over:

      a. het wettelijk recht op waardeoverdracht, bedoeld in [artikel 71 van de Pensioenwet][ref7] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref8] of de mogelijkheid tot waardeoverdracht, bedoeld
      in [artikel 75 van de Pensioenwet][ref9] dan wel [artikel 86 van de Wet verplichte beroepspensioenregeling][ref10];

      b. de keuzemogelijkheden die er zijn ten aanzien van uitruil;

      c. het bestaan van een vrijwillige pensioenregeling en de pensioensoort waarop deze vrijwillige pensioenregeling
      betrekking heeft;

      d. welke informatie op verzoek wordt verstrekt op grond van [artikel 46 van de Pensioenwet][ref11],
      [artikel 57 van de Wet verplichte beroepspensioenregeling][ref12] en [artikel 9][ref13];

      e. het actueel zijn van een korte- of langetermijnherstelplan; en

      f. de bij de uitvoerder geldende klachtenregeling.


