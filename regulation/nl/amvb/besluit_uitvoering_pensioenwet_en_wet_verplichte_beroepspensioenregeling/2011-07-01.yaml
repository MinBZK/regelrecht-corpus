  - number: '5'
    text: |-
      1 Aan de deelnemers wordt jaarlijks een opgave van de verworven pensioenaanspraken verstrekt waarbij onderscheid
      wordt gemaakt tussen een uitkeringsovereenkomst dan wel uitkeringsregeling, een kapitaalovereenkomst dan wel
      kapitaalregeling en een premieovereenkomst dan wel premieregeling.

      2 De opgave van de reglementair te bereiken pensioenaanspraken bevat:

      a. in geval van een uitkeringsovereenkomst dan wel uitkeringsregeling een opgave van de hoogte van het periodiek
      uit te keren pensioen vanaf de ingangsdatum van het pensioen;

      b. in geval van een kapitaalovereenkomst dan wel kapitaalregeling een opgave van de hoogte van het voor periodieke
      uitkeringen aan te wenden kapitaal op de ingangsdatum van het pensioen; of

      c. in geval van een premieovereenkomst dan wel premieregeling:

      1°. de hoogte van de periodieke uitkering wanneer de premie voor de ingangsdatum van het pensioen reeds daarvoor
      wordt aangewend; en

      2°. de hoogte van het voor periodieke uitkeringen aan te wenden verzekerd kapitaal wanneer de premie voor de
      ingangsdatum van het pensioen reeds daarvoor wordt aangewend.

      3 Bij de in het tweede lid bedoelde opgave wordt ten aanzien van nabestaandenpensioen aangegeven wat de
      consequenties zijn van de gekozen wijze van financieren.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel5
  - number: '6'
    text: |-
      De uitvoerder verstrekt de deelnemer bij beëindiging van de deelneming informatie over:

      a. de mogelijkheid van afkoop, bedoeld in [artikel 66 van de Pensioenwet][ref1] dan wel
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref2], voor zover er sprake is van een pensioenaanspraak
      onder de afkoopgrens;

      b. het recht op waardeoverdracht, bedoeld in [artikel 71 van de Pensioenwet][ref3] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref4], of de mogelijkheid tot waardeoverdracht, bedoeld
      in [artikel 75 van de Pensioenwet][ref5] dan wel [artikel 86 van de Wet verplichte beroepspensioenregeling][ref6];

      c. de consequenties van arbeidsongeschiktheid;

      d. het actueel zijn van een korte- of langetermijnherstelplan; en

      e. het vervallen van de dekking tegen het risico op overlijden indien nabestaandenpensioen werd verworven op basis
      van risicofinanciering.


