    text: |-
      1 Indien sprake is van een premieovereenkomst dan wel premieregeling waarbij de deelnemer tijdens de opbouwperiode
      de verantwoordelijkheid voor de beleggingen heeft overgenomen verstrekt de uitvoerder op verzoek van de deelnemer
      en de gewezen deelnemer informatie over alle beleggingsmogelijkheden, de feitelijke beleggingsportefeuille, de
      risicopositie en de kosten in verband met de beleggingen.

      2 Bij een premieovereenkomst of premieregeling waarbij de premie wordt belegd verstrekt de pensioenuitvoerder
      op verzoek van de deelnemer, gewezen deelnemer of gewezen partner een indicatie van het te bereiken voor
      periodieke uitkeringen aan te wenden kapitaal op de pensioendatum en de daarbij gehanteerde veronderstellingen.
      [Artikel 8, derde en vierde lid][ref1], is van overeenkomstige toepassing.

      3 De pensioenuitvoerder verstrekt op verzoek van de deelnemer, gewezen deelnemer of gewezen partner een indicatie
      van de hoogte van de periodieke uitkeringen op de pensioendatum wanneer het kapitaal, bedoeld in het tweede lid en
      [artikel 5, tweede lid, onderdelen b en c, onder 2°][ref2], daarvoor wordt aangewend.

      4 Bij de indicatie, bedoeld in het derde lid, worden de op het moment van het verzoek bij de pensioenuitvoerder
      geldende tarieven gehanteerd. De periodieke uitkeringen worden gecorrigeerd voor te verwachten prijsinflatie. Bij
      regeling van Onze Minister wordt bepaald met welke te verwachten prijsinflatie gecorrigeerd wordt.

      5 Bij het verstrekken van de indicatie, bedoeld in het derde lid, dient de pensioenuitvoerder er op te wijzen dat
      het risico dat de definitieve pensioenuitkering afwijkt van de indicatie bij de betrokkene ligt.

      6 Het fonds of de premiepensioeninstelling verstrekt de deelnemer, de gewezen deelnemer, de gewezen
      partner of de pensioengerechtigde op verzoek de verklaring inzake beleggingsbeginselen, bedoeld in
      [artikel 145 van de Pensioenwet][ref3], [artikel 140 van de Wet verplichte beroepspensioenregeling][ref4] of
      [artikel 3:267a, van de Wet op het financieel toezicht][ref5].

      7 De uitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde op
      verzoek:

      a. het kortetermijnherstelplan, bedoeld in [artikel 140 van de Pensioenwet][ref6] dan wel
      [artikel 135 van de Wet verplichte beroepspensioenregeling][ref7];

      b. het langetermijnherstelplan, bedoeld in [artikel 138 van de Pensioenwet][ref8] dan wel
      [artikel 133 van de Wet verplichte beroepspensioenregeling][ref9];

      c. informatie over de hoogte van de dekkingsgraad;

      d. informatie over het van toepassing zijn van een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref10]
      dan wel [artikel 166 van de Wet verplichte beroepspensioenregeling][ref11]; en

      e. informatie over de aanstelling van een bewindvoerder als bedoeld in [artikel 173 van de Pensioenwet][ref12] dan
      wel [artikel 168 van de Wet verplichte beroepspensioenregeling][ref13].

      8 De uitvoerder verstrekt de deelnemer of gewezen deelnemer op verzoek informatie over de consequenties van uitruil
      als bedoeld in [artikel 60][ref14], [61][ref15] of [62 van de Pensioenwet][ref16] dan wel de [artikelen 72][ref17],
      [73][ref18] of [74 van de Wet verplichte beroepspensioenregeling][ref19] voor de deelnemer.


