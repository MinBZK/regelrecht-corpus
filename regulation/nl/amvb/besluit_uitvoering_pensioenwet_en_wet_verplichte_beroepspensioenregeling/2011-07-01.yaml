  - number: '37'
    text: |-
      De Stichting Autoriteit Financiële Markten beschikt niet over de bevoegdheden, bedoeld in de
      [artikelen 172][ref1], [173][ref2] en [174 van de Pensioenwet][ref3] en de [artikelen 167][ref4], [168][ref5] en
