  - number: '17'
    text: |-
      Indien met de werkgever niet uitdrukkelijk een bepaalde verhouding tussen verschillende pensioensoorten
      is overeengekomen wordt de beschikbaar gestelde premie of de aanspraak op kapitaal, bedoeld in
      [artikel 12c, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref1] zodanig vastgesteld dat,
      ervan uitgaande dat slechts ouderdomspensioen is toegezegd, het in te kopen pensioen naar het inzicht op het
      tijdstip van vaststelling van die bijdrage voor mannen en vrouwen gelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel12c
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 12c
  - number: '18'
    text: |-
      1 De ontvangende uitvoerder vraagt binnen één maand nadat de deelnemer een opgave heeft gevraagd van zijn
      pensioenaanspraken, aan de overdragende uitvoerder een opgave per de overdrachtsdatum van de overdrachtswaarde en
      de daaraan ten grondslag liggende gegevens, waaronder:

      a. de pensioenaanspraken waarop de overdrachtswaarde is gebaseerd;

      b. de toeslagverlening;

      c. geslacht, geboortedatum en pensioendatum; en

      d. alle overige informatie die van belang is voor de uitvoering van de waardeoverdracht.

      Bij de informatie over toeslagverlening is [artikel 4][ref1] van overeenkomstige toepassing.

      2 Indien de overdragende uitvoerder een premieovereenkomst of premieregeling uitvoert waarbij de premie wordt
      belegd, geldt de opgave als een voorlopige opgave en is het eerste lid, onderdelen a en b, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel4
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '4'
        hoofdstuk: '2'
  - number: '19'
    text: |-
      De overdragende uitvoerder verstrekt de opgave of de voorlopige opgave, bedoeld in [artikel 18][ref1], binnen twee
      maanden na ontvangst van het daartoe strekkende verzoek aan de ontvangende uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
  - number: '20'
    text: |-
      De ontvangende uitvoerder verstrekt de opgave of voorlopige opgave, bedoeld in [artikel 18][ref1], binnen
      twee maanden na ontvangst aan de deelnemer onder vermelding van de aanspraken die zullen voortvloeien uit de
      waardeoverdracht en de wijze waarop de aanspraken in de pensioenregeling, ondergebracht bij de ontvangende
      uitvoerder, zullen worden behandeld. Bij de informatie over toeslagverlening is [artikel 4][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel4
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '4'
        hoofdstuk: '2'
  - number: '21'
    text: |-
      1 Indien de deelnemer gebruik wil maken van zijn recht op waardeoverdracht, dient hij binnen twee maanden
      na ontvangst van de opgave of voorlopige opgave, bedoeld in [artikel 18][ref1], en, indien van toepassing,
      [artikel 22][ref2], een verzoek tot waardeoverdracht in bij de ontvangende uitvoerder.

      2 Pensioenaanspraken die door de rechthebbende zijn of worden verkregen op grond van de FVP-bijdrage worden geacht
      inbegrepen te zijn in het verzoek, bedoeld in het eerste lid.

      3 Indien de partner die begunstigde is voor het partnerpensioen niet instemt met het verzoek tot
      waardeoverdracht met betrekking tot het partnerpensioen, is [artikel 58 van de Pensioenwet][ref3] dan wel
      [artikel 69 van de Wet verplichte beroepspensioenregeling][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel69
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '22'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '58'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '69'
  - number: '22'
    text: |-
      De deelnemer kan voor het einde van de termijn genoemd in [artikel 21, eerste lid][ref1], verzoeken om een
      aanvullende opgave voor het geval de waarde van het partnerpensioen niet wordt overgedragen. De termijnen, genoemd
      in de [artikelen 18 tot en met 21, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '21'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
  - number: '23'
    text: |-
      1 De ontvangende uitvoerder stelt de overdragende uitvoerder terstond in kennis van de ontvangst van het verzoek
      tot waardeoverdracht.

      2 Het risico dat betrekking heeft op de over te dragen aanspraken, komt met ingang van de datum van het verzoek van
      de rechthebbende, bedoeld in [artikel 21, eerste lid][ref1], voor rekening van de ontvangende uitvoerder.

      3 De overdrachtswaarde wordt binnen tien werkdagen na ontvangst van het verzoek tot waardeoverdracht door de
      overdragende uitvoerder aan de ontvangende uitvoerder betaald.

      4 De overdragende uitvoerder is rente verschuldigd aan de ontvangende uitvoerder over de overdrachtswaarde
      over de periode tussen de overdrachtsdatum en de datum waarop de overdrachtswaarde wordt betaald, tenzij
      het de waardeoverdracht betreft van een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      naar een andere premieovereenkomst of premieregeling waarbij de premie wordt belegd. Bij overdracht van een
      premieovereenkomst of premieregeling waarbij de premie wordt belegd naar een kapitaal- of uitkeringsovereenkomst of
      een kapitaal- of uitkeringsregeling wordt de rente geacht in de overdrachtswaarde begrepen te zijn. Onze Minister
      stelt regels over de berekening van de rente.

      5 De termijnen, genoemd in dit hoofdstuk, zijn op waardeoverdracht van pensioenaanspraken als bedoeld in
      [artikel 21, tweede lid][ref2], niet eerder van toepassing dan nadat de overdragende uitvoerder de FVP-bijdrage
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel21
