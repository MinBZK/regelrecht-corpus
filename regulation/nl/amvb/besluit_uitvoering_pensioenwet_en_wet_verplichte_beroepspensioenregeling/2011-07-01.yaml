  - number: '16'
    text: |-
      1 De afkoopwaarde, bedoeld in de [artikelen 66][ref1] en [69, tweede lid, van de Pensioenwet][ref2] dan wel bedoeld
      in [artikel 78 van de Wet verplichte beroepspensioenregeling][ref3], wordt door de pensioenuitvoerder vastgesteld
      door middel van een afkoopvoet.

      2 Er wordt dezelfde afkoopvoet vastgesteld voor een door de pensioenuitvoerder vast te stellen periode voor alle
      deelnemers en gewezen deelnemers.

      3 De afkoopvoet wordt zodanig vastgesteld dat er sprake is van collectieve actuariële gelijkwaardigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel69
