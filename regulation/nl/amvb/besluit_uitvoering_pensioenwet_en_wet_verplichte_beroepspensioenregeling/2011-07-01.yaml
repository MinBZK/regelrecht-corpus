        artikel: '105'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '110'
  - number: '31'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon
      als bedoeld in [artikel 105, vijfde lid, van de Pensioenwet][ref1] dan wel
      [artikel 110, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2] buiten twijfel staat op basis van
      diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel31
