  - number: '4'
    text: |-
      1 De informatie over toeslagverlening die op grond van de
      [artikelen 21][ref1] en [38 tot en met 45 van de Pensioenwet][ref2] dan wel de
      [artikelen 48 tot en met 56 van de Wet verplichte beroepspensioenregeling][ref3] wordt verstrekt heeft betrekking
      op:

      a. het ambitieniveau en de voorwaarden die gelden bij de toeslagverlening;

      b. de wijze van financiering van voorwaardelijke toeslagverlening en, indien is gekozen voor
      financiering als bedoeld in [artikel 137, eerste lid, onderdeel a, van de Pensioenwet][ref4] dan wel
      [artikel 132, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref5], de hoogte van de
      voorziening in relatie tot de benodigde voorziening;

      c. de verwachtingen ten aanzien van toekomstige toeslagverlening; en

      d. de toeslagverlening over de afgelopen drie jaar waarbij wordt aangegeven of dit in overeenstemming met het
      gepresenteerde toeslagenbeleid is geweest.

      2 Bij de verlening van informatie over de verwachtingen ten aanzien van toekomstige toeslagverlening wordt door
      fondsen gebruik gemaakt van de continuïteitsanalyse.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld over de informatieverstrekking over toeslagverlening.


