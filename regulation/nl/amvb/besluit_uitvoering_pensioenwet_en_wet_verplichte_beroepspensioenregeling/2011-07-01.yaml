  - number: '36'
    text: |-
      1 De Stichting Autoriteit Financiële Markten houdt toezicht op de naleving van de regels, gesteld bij of
      krachtens de [artikelen 21, eerste lid, tweede lid, tweede zin, vierde lid][ref1], [28, eerste lid][ref2],
      indien het fonds geen deelnemersraad heeft, [29, eerste lid][ref3], 29, zevende lid, voor zover het betreft de
      overeenkomstige toepassing van artikel 29, eerste lid, [33][ref4], voor zover het betreft de klachtenregeling
      van verzekeraars en premiepensioeninstellingen, [36][ref5], [38 tot en met 47][ref6], [48][ref7], met
      uitzondering van de berekeningen ten behoeve van de kwalitatieve en beeldende maatstaf, [49 tot en met 51][ref8],
      [52, tweede tot en met zesde lid][ref9], [66, derde en vierde lid][ref10], [67, tweede lid][ref11],
      [68, tweede lid][ref12], [71, derde lid][ref13], voor zover het de opgave van pensioenaanspraken betreft,
      [74, tweede en derde lid][ref14],[ 76, derde en negende lid][ref15], voor zover het de opgave van
      pensioenaanspraken betreft, [83, tweede, lid, onderdeel a][ref16], voor zover het betrekking heeft op het
      informeren van de daarin genoemde personen en [134, tweede lid van de Pensioenwet][ref17].

      2 De Stichting Autoriteit Financiële Markten houdt toezicht op de naleving van de regels, gesteld
      bij of krachtens de [artikelen 38][ref18], [39, eerste lid][ref19], 39, zevende lid, voor zover het
      betreft de overeenkomstige toepassing van artikel 39, eerste lid, [42][ref20], voor zover het betreft de
      klachtenregeling van verzekeraars en premiepensioeninstellingen, [44][ref21], [48 tot en met 58][ref22],
      [59][ref23], met uitzondering van de berekeningen ten behoeve van de kwalitatieve en beeldende maatstaf,
      [60 tot en met 62][ref24], [63, tweede tot en met zesde lid][ref25], [78, derde en vierde lid][ref26],
      [79, tweede lid][ref27], [80, tweede lid][ref28], [82, derde lid][ref29], voor zover het de opgave van
      pensioenaanspraken betreft, [85, tweede en derde lid][ref30], [91, tweede, lid, onderdeel a][ref31],
      voor zover het betrekking heeft op het informeren van de daarin genoemde personen en
      [129, tweede lid, van de Wet verplichte beroepspensioenregeling][ref32].

      3 De Nederlandsche Bank houdt toezicht op de naleving van de regels, gesteld bij of krachtens de
      [Pensioenwet][ref33] en de [Wet verplichte beroepspensioenregeling][ref34], met uitzondering van de regels genoemd
      in het eerste en tweede lid.


