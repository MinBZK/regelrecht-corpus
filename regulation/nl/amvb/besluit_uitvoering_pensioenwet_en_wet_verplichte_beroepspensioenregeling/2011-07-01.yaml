  - number: '8'
    text: |-
      1 De uitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling over de
      inhoud van de vrijwillige pensioenregeling, waarbij [artikel 2, eerste en tweede lid][ref1], en [artikel 3][ref2]
      van overeenkomstige toepassing zijn.

      2 De informatie over de reglementair te bereiken pensioenaanspraken wordt overeenkomstig
      [artikel 5, tweede lid][ref3], vastgesteld. Indien bij een premieovereenkomst of een premieregeling de premie wordt
      belegd wordt een indicatie gegeven van het te bereiken voor periodieke uitkeringen aan te wenden kapitaal op de
      pensioendatum en de daarbij gehanteerde veronderstellingen.

      3 De indicatie van het te bereiken kapitaal, bedoeld in het tweede lid, wordt berekend op basis van drie
      scenario’s: een historisch, een vier procent rendement en een pessimistisch opbrengstscenario.

      4 De regels op grond van [artikel 66, vierde lid, van het Besluit gedragstoezicht financiële ondernemingen Wft][ref4]
      zijn van overeenkomstige toepassing.


