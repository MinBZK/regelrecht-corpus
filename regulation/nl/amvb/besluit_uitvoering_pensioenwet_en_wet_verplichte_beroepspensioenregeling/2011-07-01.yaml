        artikel: '199'
  - number: '39'
    text: |-
      1 De toezichthouder deelt Onze Minister schriftelijk mee welk bestuurslid dan wel directielid fungeert als
      aanspreekpunt voor Onze Minister.

      2 De toezichthouder stelt Onze Minister schriftelijk in kennis van wijzigingen in de samenstelling en taakverdeling
      binnen het bestuur of de directie.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel39
  - number: '40'
    text: |-
      1 De toezichthouder richt zijn organisatie zodanig in dat de uitvoering van het toezicht onafhankelijk kan
      plaatsvinden.

      2 De toezichthouder beschikt over een beleid met betrekking tot het vervullen van nevenbetrekkingen. Dit beleid
      richt zich op het voorkomen van nevenbetrekkingen die ongewenst zijn met het oog op een goede vervulling van de
      functie of de handhaving van de onafhankelijkheid.

      3 De toezichthouder besteedt de oordeelsvorming en de toepassing van handhavinginstrumenten niet uit.

      4 De toezichthouder beschikt over een beschrijving van de administratieve organisatie en over een systeem van
      periodieke interne controle.
    url: https://wetten.overheid.nl/BWBR0020892/2011-07-01#Artikel40
  - number: '41'
    text: |-
      1 De Nederlandsche Bank kan eenmalig een bedrag in rekening brengen aan een uitvoerder ter vergoeding van kosten
      van de behandeling van:

      a. de toetsing van de betrouwbaarheid van personen als bedoeld
      in [artikel 105, negende lid, van de Pensioenwet][ref1] en
      [artikel 110, negende lid, van de Wet verplichte beroepspensioenregeling][ref2];

      b. de toetsing van de deskundigheid van personen als bedoeld in [artikel 30][ref3];

      c. een verzoek om verlening of wijziging van een vergunning als
      bedoeld in [artikel 125, onderdeel a, van de Pensioenwet][ref4] en
      [artikel 25, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref5];

      d. de inschrijving in het register, bedoeld in artikel [210 van de Pensioenwet][ref6] en
      [artikel 204 van de Wet verplichte beroepspensioenregeling][ref7].

      2 Bij regeling van Onze Minister wordt op voorstel van de Nederlandsche Bank de hoogte van de eenmalig in rekening
      te brengen bedragen, bedoeld in het eerste lid, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
