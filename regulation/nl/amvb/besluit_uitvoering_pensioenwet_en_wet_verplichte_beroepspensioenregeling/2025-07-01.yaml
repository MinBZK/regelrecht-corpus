  - number: 1cb
    text: |-
      1 Voor toepassing van de [artikelen 1ca][ref1] en [1cc][ref2] stelt de uitvoerder een spreidingsmethodiek vast. Een
      spreidingsmethodiek is de wijze waarop de uitvoerder de pensioenuitkeringen bij gelijke aanpassingen met spreiden
      vaststelt, waarbij onder de spreidingsmethodiek wordt begrepen:

      a. de duur van de spreidingsperiode;

      b. de wijze waarop het bepaalde in [artikel 1ca, tweede tot en met het zevende lid][ref3], wordt verwerkt, waarbij
      een positief en negatief financieel resultaat op gelijke wijze worden verwerkt;

      c. de grenzen aan de positieve en negatieve omvang van het spreidingsvermogen; en

      d. de wijze waarop [artikel 1cc][ref4] wordt toegepast.

      2 De spreidingsmethodiek is evenwichtig, transparant en consistent. De uitvoerder maakt de uitkomsten van de
      spreidingsmethodiek inzichtelijk aan de hand van een stochastische ALM-analyse en onderbouwt de gemaakte keuzes en
      vormgeving aan de hand van deze analyse.

      3 De uitvoerder legt de spreidingsmethodiek vast voor minimaal vijf jaar. Onder omstandigheden kan hiervan
      afgeweken worden. De uitvoerder onderbouwt waarom deze keuze is gemaakt.

      4 Een wijziging van de spreidingsmethodiek heeft geen gevolgen voor de al onvoorwaardelijk verwerkte en toebedeelde
      financiële resultaten in het spreidingsvermogen, het uitkeringsvermogen en de pensioenuitkeringen.

      5 De uitvoerder legt de spreidingsmethodiek vast in de opdrachtbevestiging, het pensioenreglement en de
      uitvoeringsovereenkomst dan wel het uitvoeringsreglement.


