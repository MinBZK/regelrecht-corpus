  - number: 5c
    text: |-
      Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] geldt vanaf vijf jaar voor pensioendatum
      het volgende:

      a. de uitvoerder vermeldt dat het voor pensioenuitkering aan te wenden vermogen, genoemd in
      [artikel 5a, eerste, tweede en derde lid][ref2], vanaf pensioendatum bestaat uit een spreidingsvermogen en
      uitkeringsvermogen en geeft daarbij informatie over gelijke aanpassingen met spreiden; en

      b. de uitvoerder geeft bij de opgave, bedoeld in [artikel 5a][ref3], een kwalitatieve toelichting over het verloop
      van de pensioenuitkeringen en geeft daarbij aan of het pensioen waarschijnlijk zal dalen, stijgen of gelijk zal
      blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel5a
