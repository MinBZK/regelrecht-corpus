  - number: '44'
    text: |-
      1 Bij de uitwerking van het transitieplan, bedoeld in [artikel 150d, eerste lid, van de Pensioenwet][ref1] dan
      wel [artikel 145c, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt, naast de informatie,
      bedoeld in artikel 150d, tweede lid, van de Pensioenwet dan wel artikel 145c, tweede lid, van de Wet verplichte
      beroepspensioenregeling, in ieder geval opgenomen:

      a. de doelstellingen van de transitie;

      b. de kwantitatieve maatstaven voor de beoordeling van de doelstellingen, waartoe in ieder geval netto en bruto
      profijt en de pensioenverwachting horen, en de uitkomsten daarvan die aanvaardbaar zijn;

      c. welke voorrangsregels gelden voor de doelstellingen bij de uitvoering van de opdracht;

      d. bij uitvoering door fondsen: in hoeverre verschillende, positieve en negatieve, financiële en economische
      omstandigheden zijn verkend en in welke situaties de afgesproken doelstellingen, voorrangsregels en maatstaven
      zonder meer gelden en geen nadere besluitvorming nodig is; en

      e. bij uitvoering door fondsen: het niveau van de dekkingsgraad vanaf wanneer de financiële positie van een
      fonds dusdanig is dat de gemaakte afspraken uit het transitieplan niet meer toereikend zijn, een onderbouwing
      van de berekening van deze dekkingsgraad, de alternatieve afspraken die van toepassing zijn indien het fonds een
      dergelijke dekkingsgraad heeft en, indien van toepassing, de procedure die voor deze situatie is afgesproken.

      2 Indien de financiële positie van een fonds dusdanig is dat de gemaakte afspraken uit het transitieplan
      niet meer toereikend zijn als bedoeld in het eerste lid, onderdeel e, en nieuwe afspraken zijn gemaakt, zendt
      de werkgever het gewijzigde transitieplan binnen twee weken na afronding aan het fonds. Het fonds stelt het
      gewijzigde transitieplan op zijn website beschikbaar voor de deelnemer, gewezen deelnemer, gewezen partner en
      pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150d
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145c
