      [artikelen 2 tot en met 10][ref1] en [artikel 15][ref2].

      2 De [artikelen 2 tot en met 10][ref3] treden in werking met ingang van 1 januari 2008.

      3 [Artikel 15][ref4] geldt ten aanzien van de keuzemogelijkheid, bedoeld in
      [artikel 61, eerste, derde, vierde en zesde lid, van de Pensioenwet][ref5] en
      [artikel 73, eerste, derde, vierde en zesde lid, van de Wet verplichte beroepspensioenregeling][ref6] met ingang
      van 1 januari 2008.

      4 [Artikel 15][ref7] geldt ten aanzien van de keuzemogelijkheid, bedoeld in
      [artikel 61, tweede, zevende, achtste en negende lid, van de Pensioenwet][ref8] en
      [artikel 73, tweede, zevende, achtste en negende lid, van de Wet verplichte beroepspensioenregeling][ref9] met
      ingang van 1 januari 2009.


