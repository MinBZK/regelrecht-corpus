        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '43'
  - number: '13'
    text: |-
      1 Een fonds legt de overeenkomst met de derde waaraan de werkzaamheden worden uitbesteed schriftelijk vast.

      2 In de overeenkomst wordt in ieder geval het volgende geregeld:

      a. welke werkzaamheden worden uitbesteed onder verwijzing, indien mogelijk, naar de administratieve
      organisatiebeschrijving van het fonds, alsmede de voorwaarden waaronder de uitbesteding plaatsvindt;

      b. sluitende afspraken in beleggingsmandaten bij uitbesteding van vermogensbeheer;

      c. de informatie-uitwisseling tussen het fonds en de derde;

      d. de verplichting voor de derde om informatie waar de toezichthouder ter uitvoering van zijn wettelijke taak om
      vraagt rechtstreeks aan de toezichthouder ter beschikking te stellen;

      e. de mogelijkheid voor het fonds om te allen tijde wijzigingen aan te brengen in de wijze waarop de uitvoering van
      de werkzaamheden door de derde geschiedt;

      f. de verplichting voor de derde om het fonds in staat te stellen blijvend te voldoen aan het bij of krachtens de
      [Pensioenwet][ref1] dan wel de [Wet verplichte beroepspensioenregeling][ref2] bepaalde;

      g. de mogelijkheid voor de toezichthouder om onderzoek ter plaatse te doen of te laten doen bij de derde;

      h. de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat het fonds de
      werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere derde kan laten
      uitvoeren; en

      i. de toepasselijkheid van de algemene beginselen van het beloningsbeleid van het fonds op de derde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: '14'
    text: |-
      1 Een fonds draagt zorg voor een systematische analyse van de risico’s die samenhangen met de uitbesteding van
      werkzaamheden en legt deze vast. Het fonds maakt de analyse op het niveau van zijn eigen organisatie in zijn geheel
      en op het niveau van de onderscheiden bedrijfsonderdelen.

      2 Een fonds voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking tot de
      uitbesteding van werkzaamheden, als onderdeel van een beheerste en integere bedrijfsvoering als bedoeld in
      [artikel 143 van de Pensioenwet][ref1] dan wel [artikel 138 van de Wet verplichte beroepspensioenregeling][ref2].

      3 Een fonds legt het beleid met betrekking tot de uitbesteding van werkzaamheden schriftelijk vast en draagt zorg
      voor de uitvoering van dat beleid. Het fonds evalueert het beleid ten minste driejaarlijks en past het beleid na
      een belangrijke wijziging zo spoedig mogelijk aan.

      4 Een fonds hanteert een adequate selectieprocedure voor derden aan wie werkzaamheden worden uitbesteed. Het fonds
      legt vast op grond van welke afwegingen zij tot de keuze voor een bepaalde derde is gekomen.

      5 Een fonds beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om de uitvoering van de
      uitbestede werkzaamheden te kunnen beoordelen.

      6 Een fonds draagt er zorg voor dat de algemene beginselen van het beloningsbeleid van het fonds worden toegepast
      bij derden waaraan werkzaamheden van het fonds zijn uitbesteed, tenzij de derde valt onder een richtlijn, genoemd
      in artikel 2, tweede lid, onderdeel b, van [richtlijn 2016/2341](32016L2341)/EU. Indien de derde valt onder
      een richtlijn, genoemd in artikel 2, tweede lid, onderdeel b, van [richtlijn 2016/2341](32016L2341)/EU heeft
      het fonds zicht op het beloningsbeleid van de derde aan wie werkzaamheden worden besteed, betrekt het fonds
      het beloningsbeleid bij de keuze voor de derde waaraan de werkzaamheden worden uitbesteed en maakt zijn beleid
      dienaangaande openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel138
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14
    references:
