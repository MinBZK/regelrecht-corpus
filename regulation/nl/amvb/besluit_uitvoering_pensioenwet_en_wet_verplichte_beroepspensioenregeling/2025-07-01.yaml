  - number: 14ba
    text: |-
      Bij het op grond van [artikel 52, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] aan een deelnemer of
      gewezen deelnemer bieden van de mogelijkheid om de verantwoordelijkheid voor de beleggingen over te nemen
      informeert de pensioenuitvoerder de deelnemer of gewezen deelnemer dat, indien de deelnemer of gewezen
      deelnemer hier niet voor kiest of geen keuze kenbaar maakt, de pensioenuitvoerder verantwoordelijk blijft
      voor de beleggingen en daarbij handelt overeenkomstig [artikel 135 van de Pensioenwet][ref3] dan wel
      [artikel 130 van de Wet verplichte beroepspensioenregeling][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel135
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel130
