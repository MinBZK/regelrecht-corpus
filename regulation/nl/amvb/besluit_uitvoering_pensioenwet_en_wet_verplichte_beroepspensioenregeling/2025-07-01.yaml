  - number: '18'
    text: |-
      1 De ontvangende uitvoerder vraagt binnen één maand nadat de deelnemer een opgave
      heeft gevraagd als bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 82, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] van zijn pensioenaanspraken, aan de
      overdragende uitvoerder een opgave per de overdrachtsdatum van de overdrachtswaarde en de daaraan ten grondslag
      liggende gegevens, waaronder:

      a. de pensioenaanspraken waarop de overdrachtswaarde is gebaseerd;

      b. de toeslagverlening;

      c. geslacht, geboortedatum en pensioendatum; en

      d. alle overige informatie die van belang is voor de uitvoering van de waardeoverdracht.

      Bij de informatie over toeslagverlening is [artikel 4, tweede lid][ref3] van overeenkomstige toepassing.

      2 Indien de overdragende uitvoerder een premieovereenkomst of premieregeling uitvoert waarbij de premie wordt
      belegd, geldt de opgave als een voorlopige opgave en is het eerste lid, onderdelen a en b, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel4
