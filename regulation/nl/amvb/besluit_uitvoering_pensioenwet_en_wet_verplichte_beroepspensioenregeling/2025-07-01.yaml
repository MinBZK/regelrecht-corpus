  - number: '9'
    text: |-
      1 De uitvoerder verstrekt de deelnemer, gewezen deelnemer of gewezen partner op verzoek in geval van een
      flexibele premieovereenkomst of premie-uitkeringsovereenkomst dan wel een flexibele premieregeling of premie-
      uitkeringsregeling een indicatie van het te bereiken voor periodieke uitkeringen aan te wenden kapitaal op de
      pensioendatum met de daarbij gehanteerde veronderstellingen.

      2 Bij de in het eerste lid bedoelde opgave wordt ten aanzien van nabestaandenpensioen aangegeven wat de
      consequenties zijn van de gekozen wijze van financieren.

      3 Indien sprake is van een premieovereenkomst dan wel premieregeling waarbij de deelnemer of gewezen deelnemer
      tijdens de opbouwperiode de verantwoordelijkheid voor de beleggingen heeft overgenomen verstrekt de uitvoerder
      op verzoek van de deelnemer of gewezen deelnemer informatie over alle beleggingsmogelijkheden, de feitelijke
      beleggingsportefeuille, de risicopositie en de kosten in verband met de beleggingen.

      4 De uitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde op
      verzoek:

      a. informatie over het van toepassing zijn van een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref1]
      dan wel [artikel 166 van de Wet verplichte beroepspensioenregeling][ref2]; en

      b. informatie over de aanstelling van een bewindvoerder als bedoeld in [artikel 173 van de Pensioenwet][ref3] dan
      wel [artikel 168 van de Wet verplichte beroepspensioenregeling][ref4].

      5 De uitvoerder verstrekt de deelnemer of gewezen deelnemer op verzoek informatie over de consequenties van
      uitruil als bedoeld in [artikel 60][ref5], [61][ref6], [61a][ref7] of [62 van de Pensioenwet][ref8] dan wel de
      [artikelen 72][ref9], [73][ref10], [73a][ref11], of [74 van de Wet verplichte beroepspensioenregeling][ref12] voor
      de deelnemer of gewezen deelnemer.

      6 De uitvoerder verstrekt op verzoek van de deelnemer, gewezen deelnemer of pensioengerechtigde informatie over
      de resultaten die de beleggingen van de pensioenregeling ten minste de afgelopen vijf jaar hebben behaald of,
      indien de pensioenregeling minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is
      uitgevoerd door de pensioenuitvoerder.

      7 Voor zover sprake is van gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref13] verstrekt de
      uitvoerder op verzoek van de pensioengerechtigde in ieder geval informatie over:

      a. de reeds verwerkte en toebedeelde financiële resultaten in het voor pensioenuitkering bestemd vermogen in de
      afgelopen vijf jaar tenzij de spreidingsperiode langer is dan geldt die periode;

      b. hoe de pensioenuitkeringen als gevolg van het verwerkte en toebedeelde financiële resultaten zijn aangepast in
      de afgelopen vijf jaar tenzij de spreidingsperiode langer is, dan geldt die periode;

      c. de hoogte van het uitkeringsvermogen en spreidingsvermogen in het jaar van het verzoek; en

      d. het verloop van de toekomstige pensioenuitkeringen gedurende de spreidingsperiode.


