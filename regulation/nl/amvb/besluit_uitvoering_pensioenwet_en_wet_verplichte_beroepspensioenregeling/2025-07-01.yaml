      [52, eerste lid, onderdeel b][ref14], [53, eerste lid, onderdeel b][ref15], [54, eerste lid, onderdeel c][ref16],
      en [56, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref17] wordt verstrekt heeft
      betrekking op de toeslagverlening over de afgelopen vijf jaar waarbij wordt aangegeven in hoeverre de prijsinflatie
      hiermee is gecompenseerd.

      3 De informatie over toeslagverlening die op grond van
      [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref18] en
      [artikel 57a, eerste lid, onderdeel b van de Wet verplichte beroepspensioenregeling][ref19] wordt verstrekt of
      beschikbaar gesteld heeft betrekking op de toeslagverlening over de afgelopen tien jaar waarbij wordt aangegeven in
      hoeverre de prijsinflatie hiermee is gecompenseerd en of dit in overeenstemming met het toeslagenbeleid is geweest.


