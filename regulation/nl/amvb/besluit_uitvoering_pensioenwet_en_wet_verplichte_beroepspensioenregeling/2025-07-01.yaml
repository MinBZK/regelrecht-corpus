  - number: 9a
    text: |-
      1 De titel van het uniform pensioenoverzicht bevat het woord «pensioenoverzicht».

      2 Het uniform pensioenoverzicht bevat naast de informatie, bedoeld in de
      [artikelen 38, eerste lid][ref1], [40, eerste lid][ref2], [42, eerste lid][ref3],
      [44, eerste lid][ref4], en [48, vijfde lid, tweede zin, van de Pensioenwet][ref5] dan wel de
      [artikelen 49, eerste lid][ref6], [51, eerste lid][ref7], [53, eerste lid][ref8], [55, eerste lid][ref9], en
      [59, vijfde lid, tweede zin, van de Wet verplichte beroepspensioenregeling][ref10] in ieder geval het volgende:

      a. de persoonsgegevens van de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde;

      b. de naam en het contactadres van de pensioenuitvoerder;

      c. het soort pensioenregeling; en

      d. de datum waarop de informatie betrekking heeft.

      3 Op het uniform pensioenoverzicht wordt elke wezenlijke wijziging ten opzichte van het uniform pensioenoverzicht
      van het voorgaande jaar duidelijk aangegeven.


