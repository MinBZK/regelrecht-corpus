  - number: 9b
    text: |-
      1 De verdere informatie over de pensioenregeling, bedoeld in
      [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 57a, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2], betreft in ieder geval
      informatie over:

      a. het vervallen van een pensioenaanspraak als bedoeld in [artikel 55, vijfde lid, van de Pensioenwet][ref3] dan
      wel [artikel 66, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref4];

      b. het beleid van de uitvoerder ten aanzien van waardeoverdracht als bedoeld in
      [artikel 70a van de Pensioenwet][ref5] dan wel [artikel 81a van de Wet verplichte beroepspensioenregeling][ref6],
      en de daarbij toe te passen procedure; en

      c. de geldende spreidingsmethodiek, bedoeld in [artikel 1cb][ref7], indien sprake is van gelijke aanpassingen met
      spreiden als bedoeld in [artikel 1ca][ref8].

      2 De informatie over uitvoeringskosten, bedoeld in [artikel 46a, eerste lid, onderdeel c, van de Pensioenwet][ref9]
      dan wel [artikel 57a, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref10], betreft:

      a. de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref11];

      b. de kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref12]; en

      c. de transactiekosten, bedoeld in [artikel 10a, derde lid][ref13].

      3 De informatie over uitvoeringskosten die op de website wordt geplaatst betreft:

      a. voor fondsen en premiepensioeninstellingen: de administratieve uitvoeringskosten als bedrag per deelnemer of
      pensioengerechtigde en de kosten van vermogensbeheer en de transactiekosten als percentage van het gemiddeld belegd
      vermogen;

      b. voor verzekeraars: de administratieve uitvoeringskosten als bedrag per deelnemer of pensioengerechtigde en de
      kosten van vermogensbeheer en de transactiekosten:

      1°. indien de kosten van invloed zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld
      belegd vermogen; en

      2°. indien de kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht met vermelding dat deze
      kosten niet zijn opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het pensioenrecht.

      4 De informatie over de beleggingen en het beleggingsbeleid, bedoeld in
      [artikel 46a, tweede lid, onderdeel d, van de Pensioenwet][ref14] dan wel
      [artikel 57a, tweede lid, onderdeel d, van de Wet verplichte beroepspensioenregeling][ref15], betreft:

      a. beleggingsresultaten van het collectieve vermogen, met onderscheid tussen de verschillende
      beleggingscategorieën; en

      b. de verhouding van deze resultaten tot het strategisch beleggingsbeleid.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.


