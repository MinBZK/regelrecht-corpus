  - number: '57'
    text: |-
      Het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling, zoals dat luidde op de dag voor het
      tijdstip van inwerkingtreding van het [Besluit toekomst pensioenen][ref1] blijft van toepassing tot het tijdstip
      dat de uitvoerder overgaat op uitvoering van een gewijzigde pensioenovereenkomst of beroepspensioenregeling, maar
      uiterlijk tot 1 januari 2027. In afwijking van de vorige zin zijn vanaf het tijdstip van inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ____________ van toepassing:

      a. de gewijzigde [artikelen 1][ref3], [2][ref4], [3][ref5], [4][ref6], [5][ref7], [7c][ref8],
      [7e][ref9], voor zover het betreft toevoeging van [artikel 150j van de Pensioenwet][ref10] dan wel
      [artikel 145i van de Wet verplichte beroepspensioenregeling][ref11], [9a][ref12], [9b][ref13], voor zover het
      betreft het vervallen van het eerste lid, [9f][ref14], [28d][ref15], [54][ref16] en 57;

      b. de [artikelen 36][ref17], [40a][ref18] en [51a][ref19], voor het toezicht op de pensioenuitvoerder die is
      overgegaan op uitvoering van een gewijzigde pensioenovereenkomst of beroepspensioenregeling;

      c. de [hoofdstukken 4b][ref20], [4c][ref21] en [9b][ref22].


