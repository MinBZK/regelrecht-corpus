  - number: 9g
    text: |-
      Voor de gegevensverwerking in het kader van keuzebegeleiding:

      a. zijn de Sociale verzekeringsbank en de uitvoerders die via het pensioenregister gegevens verstrekken,
      gezamenlijke verwerkingsverantwoordelijken voor de verwerking van de door hen verstrekte gegevens via het
      pensioenregister;

      b. is de aangewezen uitvoerder, bedoeld in [artikel 51, tweede lid, van de Pensioenwet][ref1],
      verwerkingsverantwoordelijke voor:

      1°. de verwerking van gegevens die plaatsvindt na verstrekking van de gegevens uit het pensioenregister;

      2°. de verwerking van gegevens voor zover het gegevens betreft over pensioenaanspraken en pensioenrechten bij die
      uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
  - number: 9h
    text: |-
      Bij de toepassing van [artikel 9g, onderdeel a][ref1], dragen de volgende organisaties zorg voor de toepassing van
      de artikelen 12 tot en met 22, 33 en 34 van de Algemene verordening gegevensbescherming:

      a. de Sociale verzekeringsbank voor zover het gegevens betreft over aanspraken op ouderdomspensioen en rechten op
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref2];

      b. de uitvoerder voor zover het gegevens betreft met betrekking tot pensioenaanspraken en pensioenrechten die zijn
      opgebouwd bij die uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel9g
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel9h
