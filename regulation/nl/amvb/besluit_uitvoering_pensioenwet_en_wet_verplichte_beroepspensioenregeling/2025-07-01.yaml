  - number: 10.0a
    text: De informatie die de pensioenuitvoerder verstrekt of beschikbaar stelt is beschikbaar in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel10.0a
  - number: 10a
    text: |-
      1 De administratieve uitvoeringskosten, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref1] dan
      wel [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], zijn de kosten voor het
      pensioenbeheer. Hieronder wordt onder meer begrepen de kosten voor:

      a. het vaststellen en innen van de premie;

      b. registratie van pensioenaanspraken en pensioenrechten;

      c. informatieverstrekking aan en communicatie met deelnemers, andere aanspraakgerechtigden, pensioengerechtigden en
      de werkgever;

      d. het bestuur; en

      e. het toezicht door de toezichthouders.

      2 De kosten van vermogensbeheer, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref3] dan wel
      [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4], zijn de kosten voor het beheer van
      het belegde vermogen, met uitzondering van de transactiekosten. Onder de kosten van vermogensbeheer wordt onder
      meer begrepen de kosten voor:

      a. fiduciair vermogensbeheer;

      b. bewaarloon; en

      c. advieskosten.

      3 De transactiekosten, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref5] dan wel
      [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6], zijn de kosten voor de transacties
      in vermogenstitels. Hieronder wordt onder meer begrepen de kosten voor:

      a. aankoop en verkoop van vermogensbestanddelen;

      b. acquisitie van beleggingen; en

      c. deelname aan beleggingsfondsen.

      4 Kosten die niet kunnen worden toebedeeld aan een van de drie categorieën, bedoeld in het eerste tot en met derde
      lid, worden over de categorieën, bedoeld in het eerste en tweede lid, verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
