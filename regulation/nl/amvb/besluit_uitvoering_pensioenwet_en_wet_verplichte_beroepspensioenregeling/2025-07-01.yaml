  - number: 9e
    text: |-
      1 Een vermindering van de pensioenaanspraken en pensioenrechten wordt door de uitvoerders binnen vier maanden
      verwerkt in de gegevens die door middel van het pensioenregister worden verstrekt.

      2 Een andere wijziging van de pensioenaanspraken en pensioenrechten dan bedoeld in het eerste lid wordt door de
      uitvoerders binnen vier maanden nadat de wijziging in de administratie van de uitvoerders is doorgevoerd verwerkt
      in de gegevens die door middel van het pensioenregister worden verstrekt.

      3 Het pensioenregister geeft in ieder geval inzicht in de hoogte van het te bereiken pensioen door:

      a. weergave in netto bedragen per maand en in bruto bedragen per jaar;

      b. de mogelijkheid om ter vergelijking het huidige netto inkomen per maand in te voeren.

      4 Met betrekking tot de keuzes ten aanzien van ouderdomspensioen worden in ieder geval de indicatieve gevolgen op
      het pensioeninkomen getoond van het vervroegen of uitstellen van de pensioeningangsdatum.

      5 Met betrekking tot belangrijke gebeurtenissen worden in ieder geval bij nabestaandenpensioen de gevolgen getoond
      van overlijden op het moment van de uitvraag, na beëindiging van de deelneming en na pensionering.

      6 Voor weergave van ouderdomspensioen in scenario’s wordt gebruik gemaakt van een navigatiemetafoor die op een
      herkenbare plek in het pensioenregister is weergegeven. Een navigatiemetafoor bevat ten minste drie pijlen en de
      volgende bedragen en teksten:

      a. de opgebouwde pensioenaanspraken en de pensioenrechten;

      b. de op te bouwen pensioenaanspraken en de pensioenrechten bij een pessimistisch scenario, met gebruik van de
      tekst «Als het tegenzit, ontvangt u minder: € <bedrag>»;

      c. de op te bouwen pensioenaanspraken en de pensioenrechten bij een verwacht scenario, met gebruik van de tekst
      «Verwacht eindresultaat: € <bedrag>»; en

      d. de op te bouwen pensioenaanspraken en de pensioenrechten bij een optimistisch scenario, met gebruik van de tekst
      «Als het meezit, ontvangt u meer <bedrag>».
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel9e
  - number: 9f
    text: |-
      1 Bij toepassing van [artikel 51, tweede lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 62, tweede lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2] verstrekt het
      pensioenregister ten behoeve van de keuzebegeleiding aan de aangewezen uitvoerder:

      a. gegevens over pensioenaanspraken en pensioenrechten, inclusief de verwachte hoogte van het te bereiken pensioen;

      b. voor zover het ouderdomspensioen betreft, de gegevens over een pessimistisch scenario, een verwacht scenario en
      een optimistisch scenario;

      c. gegevens over uitvoerders waarbij pensioen wordt opgebouwd of is opgebouwd;

      d. gegevens over aanspraken op ouderdomspensioen en rechten op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref3].

      2 De gegevens, bedoeld in het eerste lid, kunnen tevens gegevens over een derde zijn, indien dat voor een adequate
      keuzebegeleiding nodig is en indien die derde daar toestemming voor heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002221
