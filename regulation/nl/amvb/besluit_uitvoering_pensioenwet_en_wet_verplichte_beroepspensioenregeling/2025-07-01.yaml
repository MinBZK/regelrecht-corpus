  - number: '49'
    text: |-
      De door de toezichthouder met toepassing van [artikel 48][ref1] vast te stellen bestuurlijke boete wordt verdubbeld
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '48'
        hoofdstuk: '10'
  - number: '50'
    text: |-
      1 De toezichthouder houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.

      2 De toezichthouder kan op basis van het eerste lid de op te leggen bestuurlijke boete verlagen met maximaal 100
      procent.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel50
  - number: '51'
    text: |-
      1 De toezichthouder houdt bij het vaststellen van een bestuurlijke boete voor pensioenuitvoerders rekening met
      schade voor derden.

      2 De toezichthouder kan de op te leggen bestuurlijke boete, na inachtneming van de bepalingen, bedoeld in de
      [artikelen 48][ref1], [49][ref2] en [50][ref3] verlagen met maximaal 75 procent.


