      [Wet verplichte beroepspensioenregeling][ref64].

      3 De Nederlandsche Bank houdt toezicht op de naleving van de regels, gesteld bij of krachtens de
      [Pensioenwet][ref65] en de [Wet verplichte beroepspensioenregeling][ref66], met uitzondering van de regels genoemd
      in het eerste en tweede lid.


