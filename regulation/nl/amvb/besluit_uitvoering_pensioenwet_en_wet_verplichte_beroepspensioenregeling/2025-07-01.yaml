      [artikel 2, onderdeel e][ref7], wordt verstrekt heeft betrekking op de toeslagverlening over de afgelopen drie jaar
      waarbij wordt aangegeven in hoeverre de prijsinflatie hiermee is gecompenseerd.

      2 De informatie over toeslagverlening die op grond van de [artikelen 39, eerste lid, onderdeel b][ref8],
      [41, eerste lid, onderdeel b][ref9], [42, eerste lid, onderdeel b][ref10], [43, eerste lid, onderdeel c][ref11],
