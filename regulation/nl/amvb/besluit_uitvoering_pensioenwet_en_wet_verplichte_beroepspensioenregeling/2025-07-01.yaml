  - number: 23a
    text: |-
      1 De vaststelling door fondsen of de plicht tot waardeoverdracht, bedoeld in de [artikelen 71][ref1]
      en [76 van de Pensioenwet][ref2] of [artikel 82 van de Wet verplichte beroepspensioenregeling][ref3],
      wordt opgeschort vanwege de in [artikel 72, onderdeel a, van de Pensioenwet][ref4] of
      [artikel 83, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref5] omschreven situatie, vindt plaats
      per de eerste dag van iedere kalendermaand aan de hand van de beleidsdekkingsgraad op de laatste dag van de
      voorafgaande kalendermaand.

      2 Indien de plicht tot waardeoverdracht is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref6] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref7] omschreven situatie na de datum waarop de
      ontvangende uitvoerder de gegevens, bedoeld in [artikel 20][ref8], aan de deelnemer heeft verstrekt, verhindert de
      opschorting de verdere afhandeling van deze waardeoverdracht niet.

      3 Indien de plicht tot waardeoverdracht is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref9]
      of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref10] omschreven situatie informeert de
      ontvangende uitvoerder de deelnemer die een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in
      [artikel 18][ref11] schriftelijk over de opschorting van de plicht tot waardeoverdracht en de gevolgen daarvan.

      4 De plicht tot waardeoverdracht herleeft zodra de ontvangende en de overdragende uitvoerder niet langer in de
      in [artikel 72 van de Pensioenwet][ref12] of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref13]
      omschreven situatie verkeren. Het eerste lid is van overeenkomstige toepassing.

      5 Als de plicht tot waardeoverdracht na een periode van opschorting vanwege de in
      [artikel 72 van de Pensioenwet][ref14] of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref15]
      omschreven situatie herleeft, geldt het volgende:

      a. indien de datum waarop de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld
      in artikel 18, ligt voor de datum waarop de plicht tot waardeoverdracht herleeft en de gegevens, bedoeld in
      [artikel 20][ref16], niet aan de deelnemer zijn verstrekt voor de datum waarop de plicht tot waardeoverdracht is
      opgeschort, is, in afwijking van de definitie, bedoeld in [artikel 1][ref17], de overdrachtsdatum de datum waarop
      de plicht tot waardeoverdracht is herleefd;

      b. indien de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref18]
      voor de herleving van de plicht tot waardeoverdracht, vraagt de ontvangende uitvoerder binnen drie maanden na
      herleving van de plicht tot waardeoverdracht aan de overdragende uitvoerder een opgave als bedoeld in artikel 18,
      tenzij de plicht tot waardeoverdracht weer is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref19] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref20] beschreven situatie.

      6 Indien in de in het tweede lid beschreven situatie de deelnemer voor de datum van inwerkingtreding
      van het Besluit van 12 november 2009 tot wijziging van het Besluit uitvoering Pensioenwet en Wet
      verplichte beroepspensioenregeling in verband met aanpassing van de regeling voor waardeoverdracht en
      de kostenregeling (Stb. 2009, 598), een verzoek tot waardeoverdracht als bedoeld in [artikel 21][ref21]
      heeft gedaan dat niet is afgehandeld vanwege de in [artikel 72 van de Pensioenwet][ref22] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref23] omschreven situatie, stelt de ontvangende
      uitvoerder de deelnemer in de gelegenheid zijn verzoek in te trekken.


