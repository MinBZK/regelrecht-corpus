  - number: '6'
    text: |-
      De uitvoerder verstrekt de deelnemer bij beëindiging van de deelneming informatie over:

      a. het vervallen van een pensioenaanspraak als bedoeld in [artikel 55, vijfde lid, van de Pensioenwet][ref1] dan
      wel [artikel 66, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2], voor zover sprake is van een
      pensioenaanspraak onder de vervalgrens;.

      b. het gebruik van het recht van de uitvoerder tot waardeoverdracht, bedoeld in
      [artikel 70a van de Pensioenwet][ref3] dan wel [artikel 81a van de Wet verplichte beroepspensioenregeling][ref4],
      voor zover er sprake is van een pensioenaanspraak onder de overdrachtgrens en de daarbij gevolgde procedure;

      c. het recht op waardeoverdracht, bedoeld in [artikel 71 van de Pensioenwet][ref5] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref6], of de mogelijkheid tot waardeoverdracht, bedoeld
      in [artikel 75 van de Pensioenwet][ref7] dan wel [artikel 86 van de Wet verplichte beroepspensioenregeling][ref8];

      d. het recht tot afkoop, bedoeld in de [artikelen 66, tweede lid, onderdeel c, en derde lid][ref9], en
      [69, tweede lid, van de Pensioenwet][ref10] dan wel de [artikelen 78, tweede lid, onderdeel c, en derde lid][ref11],
      en [80a, tweede lid, van de Wet verplichte beroepspensioenregeling][ref12], voor zover er sprake is van
      een pensioenaanspraak onder de afkoopgrens en de uitvoerder [artikel 70a van de Pensioenwet][ref13] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling toepast][ref14];

      e. de consequenties van arbeidsongeschiktheid;

      f. het actueel zijn van een herstelplan of geactualiseerd herstelplan;

      g. het voortzetten van de dekking voor het nabestaandenpensioen,
      bedoeld in [artikel 55, vierde lid, van de Pensioenwet][ref15] dan wel
      [artikel 66, vierde lid, van de Wet verplichte beroepspensioenregeling][ref16] en het recht op uitruil van
      ouderdomspensioen in partnerpensioen op risicobasis, bedoeld in [artikel 61a van de Pensioenwet][ref17] dan wel
      [artikel 73a van de Wet verplichte beroepspensioenregeling][ref18];

      h. het vervallen van de dekking tegen het risico op overlijden indien nabestaandenpensioen werd verworven op basis
      van risicofinanciering; en

      i. de website waarop het pensioenregister te raadplegen is.


