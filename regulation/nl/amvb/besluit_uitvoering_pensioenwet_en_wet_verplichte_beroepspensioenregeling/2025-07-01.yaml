  - number: '55'
    text: |-
      [Artikel 41][ref1], zoals dat luidde op de dag voor het tijdstip van inwerkingtreding van het Besluit van
      22 juni 2023 tot wijziging van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling
      vanwege aanpassing van de regeling voor nettopensioen (*Stb.* 2023, 220), blijft van toepassing
      tot het tijdstip dat het fonds overgaat op uitvoering van een gewijzigde pensioenovereenkomst dan
      wel gewijzigde beroepspensioenregeling, bedoeld in [artikel 220i van de Pensioenwet][ref2] dan wel
      [artikel 214g, van de Wet verplichte beroepspensioenregeling][ref3], maar uiterlijk tot 1 januari 2027.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel214g
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel55
