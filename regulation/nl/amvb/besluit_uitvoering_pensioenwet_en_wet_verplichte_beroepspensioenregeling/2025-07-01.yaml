  - number: '26'
    text: |-
      Indien bij een premieovereenkomst of een premieregeling, waarbij de premie onmiddellijk na het
      beschikbaar stellen is omgezet in een aanspraak op een uitkering, een uitkeringsovereenkomst, zoals
      gedefinieerd in [artikel 1 van de Pensioenwet][ref1] dan wel een uitkeringsregeling, zoals gedefinieerd in
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], zoals deze artikelen luidden op de
      dag voor het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref3], de overdrachtswaarde niet gelijk
      is aan de waarde van het gefinancierde deel van de aanspraken, komt het verschil ten gunste, respectievelijk ten
      laste, van de oude werkgever of van het fonds waar de regeling was ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0048328
