  - number: 1d
    text: |-
      1 In de [artikelen 10a, vijfde lid][ref1], [10b, vierde lid][ref2], en [63a, vierde lid, van de Pensioenwet][ref3],
      dan wel de [artikelen 28a, vijfde lid][ref4], [28b, vierde lid][ref5], en
      [75a, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6] is bepaald dat er op voorhand geen
      herverdelingseffecten plaatsvinden. Hieronder wordt verstaan dat het niet is toegestaan om het risico van
      een belegging toe te delen aan een deelnemer, gewezen deelnemer of pensioengerechtigde en de bijbehorende
      risicobeloning van deze belegging toe te delen aan een andere deelnemer, gewezen deelnemer of pensioengerechtigde.
      De toedeling van het risico en de bijbehorende risicobeloning is consistent met prijzen, zoals geobserveerd op
      financiële markten.

      2 Indien van toepassing onderbouwt de uitvoerder kwantitatief dat herverdelingseffecten plaatsvinden
      voor zover dat nodig is om gelijke aanpassingen van ingegane uitkeringen en van de opgebouwde aanspraak
      op nabestaandenpensioen van pensioengerechtigden te realiseren en daarbij alleen herverdelingseffecten
      optreden tussen pensioengerechtigden onderling als bedoeld in de [artikelen 10a, vijfde lid][ref7],
      en [10b, vierde lid, van de Pensioenwet][ref8], dan wel de [artikelen 28a, vijfde lid][ref9], en
      [28b, vierde lid, van de Wet verplichte beroepspensioenregeling][ref10].

      3 Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref11] leidt een projectierendement lager dan
      een risicovrije rente op voorhand niet tot herverdelingseffecten.


