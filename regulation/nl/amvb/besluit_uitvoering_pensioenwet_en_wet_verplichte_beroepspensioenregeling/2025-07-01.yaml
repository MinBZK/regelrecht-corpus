  - number: 1e
    text: |-
      1 Een uitvoerder die voor bepaalde leeftijdscohorten de leenrestrictie opheft en deze daarmee effectief blootstelt
      aan meer dan 100% beleggingsrisico, voor zover dit passend is bij de risicohouding van deze cohorten, onderbouwt
      waarom dit in het belang van de deelnemers is.

      2 Onder blootstelling aan meer dan 100% beleggingsrisico wordt verstaan: de
      effectieve blootstelling aan meer dan 100% zakelijke waardenrisico als bedoeld in
      [artikel 13, achtste lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]. Effectieve
      blootstelling houdt in dat wordt getoetst aan hoeveel beleggingsrisico’s deelnemers worden blootgesteld, inclusief
      toepassing van toedeelregels.

      3 De uitvoerder legt regels vast waarin wordt beschreven op welke wijze negatieve pensioenvermogens of kapitalen
      worden voorkomen waarbij verdeelregels worden vastgesteld voor de verschillende bronnen.

      4 Voor de onderbouwing, bedoeld in het eerste lid, en de regels, bedoeld in het derde lid, maakt de uitvoerder
      gebruik van een stochastische ALM-analyse.

      5 De uitvoerder draagt er zorg voor dat de pensioenvermogens of kapitalen niet negatief zijn op 31 december van
      ieder jaar en bij beëindiging van de verwerving door de deelnemer op een ander tijdstip dan 31 december.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel13
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '13'
  - number: 1f
    text: |-
      1 De uitvoerder legt de toedelingskring vast en informeert de deelnemer, gewezen deelnemer of pensioengerechtigde
      hierover voorafgaand aan zijn toetreding tot de toedelingskring.

      2 De uitvoerder legt de vormgeving van het toedelingsmechanisme voor het beleggingsrisico vast en onderbouwt dat
      daarbij op voorhand geen sprake is van herverdelingseffecten tussen leeftijdsgroepen.

      3 Bij een fonds gelden voor de omzetting van het kapitaal voortvloeiend uit de premies in een vastgestelde
      uitkering op de pensioendatum de volgende voorwaarden:

      a. de omzetting vindt plaats op basis van een dekkingsgraadneutraal tarief;

      b. voor de vaststelling van het tarief hanteert het fonds de risicovrije rente voor fondsen; en

      c. er wordt rekening gehouden met tariefgrondslagen passend bij de groep deelnemers of gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel1f
  - number: 1g
    text: |-
      De verzekeraar of premiepensioeninstelling informeert de deelnemer of gewezen deelnemer over de mogelijkheid
      te kiezen voor een vastgestelde uitkering in ieder geval voorafgaand aan het moment dat de deelnemer of gewezen
      deelnemer voor het eerst deze keuze kan maken.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel1g
  - number: 1h
    text: |-
      1 De uitvoerder heeft een solidariteitsreserve of, indien van toepassing, risicodelingsreserve voor iedere
      afzonderlijke pensioenregeling of kan, indien kruissubsidiëring tussen de pensioenregelingen niet kan voorkomen,
      een reserve hebben voor meerdere pensioenregelingen.

      2 De uitvoerder berekent voor de solidariteitsreserve of risicodelingsreserve in het kader van de toetsing van
      evenwichtigheid de baten en lasten voor alle cohorten die worden onderscheiden voor de risicohouding en onderbouwt
      dat deze baten en lasten in lijn zijn met de doelstellingen van de reserve. Het inzichtelijk maken van deze
      kwantitatieve effecten wordt toegelicht, waarbij de baten en lasten voor de cohorten met en zonder de reserve
      worden vergeleken. Voor de kwantitatieve onderbouwing wordt gebruik gemaakt van een scenario-analyse of een
      stochastische ALM-analyse.

      3 De evenwichtigheid van afspraken rond de solidariteitsreserve of risicodelingsreserve wordt door de uitvoerder
      beoordeeld en in de besluitvorming onderbouwd. Onder evenwichtigheid wordt onder meer verstaan dat bij de
      inrichting van de reserve op voorhand wordt voorkomen dat een bepaalde generatie binnen een pensioenregeling
      uitsluitend baten of lasten heeft van de reserve. Voor de kwantitatieve onderbouwing wordt gebruik gemaakt van een
      scenario-analyse of een stochastische ALM-analyse.

      4 De uitvoerder legt de regels voor de solidariteitsreserve of risicodelingsreserve in beginsel vast voor een
      periode van minimaal vijf jaar. Bij bijzondere omstandigheden kan van deze minimale termijn afgeweken worden.
      De uitvoerder onderbouwt dat deze afwijking van de minimale termijn in het belang van alle deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden is.

      5 De uitvoerder past het tweede en derde lid toe bij vaststelling van de regels voor de solidariteitsreserve of
      risicodelingsreserve, bij wijziging van de inrichting van de reserve of bij een wijziging van het beleid of het
      deelnemersbestand indien de wijziging relevant is voor de doelstellingen of regels voor het vullen van en uitdelen
      uit de reserve.

      6 Indien van toepassing legt de uitvoerder van tevoren vast bij welk inflatieniveau sprake is van afdekking
      van onverwachte inflatie via de solidariteitsreserve of risicodelingsreserve. De uitvoerder onderbouwt dit
      inflatieniveau op basis van objectief te verifiëren informatie.

      7 De vaststelling of de omvang van de solidariteitsreserve of risicodelingsreserve blijft binnen de maximale omvang
      van 15% van het geheel voor pensioen gereserveerde vermogen inclusief de reserve, vindt plaats op 31 december van
      enig jaar.

      8 Als bij een risicodelingsreserve wordt ingelegd uit vermogen bij toetreding tot het collectief
      toedelingsmechanisme voor de collectieve uitkeringsfase, bedraagt de inleg uit vermogen niet meer dan het verschil
      tussen het percentage dat op grond van het pensioenreglement het voorgaande jaar uit premie is ingelegd en 10%.

      9 De Nederlandsche Bank kan nadere regels stellen over de wijze waarop de berekeningen, bedoeld in het tweede en
      derde lid, worden gemaakt en toegelicht.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel1h
  - number: '2'
    text: |-
      De informatie over de kenmerken van de pensioenregeling en de uitvoering van de pensioenregeling, bedoeld in
      [artikel 21 van de Pensioenwet][ref1] dan wel [artikel 48 van de Wet verplichte beroepspensioenregeling][ref2],
      bevat in ieder geval het volgende:

      a. de pensioensoorten waarin de basispensioenregeling voorziet;

      b. de pensioensoorten waarin de basispensioenregeling niet voorziet;

      c. de wijze waarop pensioen wordt opgebouwd;

      d. de keuzemogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling voorziet;

      e. de risico’s;

      f. de soorten uitvoeringskosten;

      g. de beleidsdekkingsgraad met een omschrijving van de gevolgen ervan;

      h. op welke wijze in het beleggingsbeleid rekening wordt gehouden met milieu en klimaat, mensenrechten en sociale
      verhoudingen; en

      i. indien van toepassing, de beleggingsmogelijkheden van de deelnemer of gewezen deelnemer waarin de
      pensioenregeling voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel2
