  - number: 44a
    text: |-
      Een vereniging van gewezen deelnemers respectievelijk van pensioengerechtigden, vertegenwoordigt een
      substantieel gedeelte van de gewezen deelnemers respectievelijk van de pensioengerechtigden als bedoeld in
      [artikel 150g van de Pensioenwet][ref1] dan wel [artikel 145f van de Wet verplichte beroepspensioenregeling][ref2],
      indien aan de volgende voorwaarden wordt voldaan:

      a. de vereniging bezit volledige rechtsbevoegdheid als bedoeld in [Boek 2 van het Burgerlijk Wetboek][ref3];

      b. haar statutaire doel omvat in elk geval de belangenbehartiging van gewezen deelnemers respectievelijk van
      pensioengerechtigden bij het fonds;

      c. de vereniging vertegenwoordigt ten minste:

      1°. duizend gewezen deelnemers of 10% van alle gewezen deelnemers bij het fonds; of

      2°. duizend pensioengerechtigden of 10% van alle pensioengerechtigden bij het fonds; en

      d. de vereniging maakt haar bestaan tijdig kenbaar aan de partijen die betrokken zijn bij de vaststelling,
      wijziging of intrekking van de pensioenovereenkomst dan wel de beroepspensioenregeling waarbij de vereniging de
      melding rechtstreeks kan doen of via het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150g
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145f
      [ref3]: https://wetten.overheid.nl/BWBR0003045
