  - number: 7a
    text: |-
      1 De uitvoerder verstrekt degene die pensioengerechtigde wordt voorafgaand aan of bij de pensioeningang in ieder
      geval informatie over:

      a. het recht te kiezen voor een hoger of eerder ingaand ouderdomspensioen, bedoeld in
      [artikel 60 van de Pensioenwet][ref1] dan wel [artikel 72 van de Wet verplichte beroepspensioenregeling][ref2],
      voor zover sprake is van opbouw van ouderdomspensioen en partnerpensioen;

      b. de mogelijkheid van afkoop, bedoeld in [artikel 66 tot en met 69 van de Pensioenwet][ref3] dan wel
      [artikel 78 tot en met 80a van de Wet verplichte beroepspensioenregeling][ref4], voor zover sprake is van een
      pensioenaanspraak onder de afkoopgrens of een fiscaal bovenmatige pensioenaanspraak;

      c. de mogelijkheid tot of het recht op waardeoverdracht, bedoeld in de [artikelen 80][ref5], [81][ref6],
      [81a, tweede lid][ref7], en [81b, van de Pensioenwet][ref8] dan wel de [artikelen 88][ref9], [89][ref10],
      [89a, tweede lid][ref11], en [89b van de Wet verplichte beroepspensioenregeling][ref12], voor zover sprake is van
      een aan te wenden kapitaal op de pensioendatum;

      d. andere keuzemogelijkheden die de pensioenregeling biedt; en

      e. de gehanteerde spreidingsperiode bij de uitkering waarbij de uitvoerder die een spreidingperiode hanteert
      van meer dan vijf jaar dan wel gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref13] toepast, de
      volgende tekst opneemt: De ontwikkeling van uw pensioen hangt onder meer af van economische omstandigheden. Uw
      pensioen kan hierdoor omhoog of omlaag gaan. Wij spreiden financiële meevallers en tegenvallers over <x> jaar om
      grote schokken in de hoogte van uw pensioen te voorkomen. Bij langdurige tegenvallers en bij een spreidingsperiode
      van meer dan vijf jaar kan uw pensioen na verloop van tijd flink lager uitvallen.

      2 Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref14] verstrekt de uitvoerder degene die
      pensioengerechtigde wordt voorafgaand aan of bij de pensioeningang informatie. Hierbij geldt het volgende:

      a. de uitvoerder vermeldt dat het voor pensioenuitkering bestemd vermogen vanaf pensioendatum bestaat uit een
      uitkeringsvermogen en een spreidingsvermogen en geeft daarbij informatie over gelijke aanpassingen met spreiden;

      b. de uitvoerder vermeldt de gevolgen voor de hoogte van de pensioenuitkering op moment van ingang, waarbij deze
      informatie persoonlijk en concreet is;

      c. de uitvoerder geeft concrete en persoonlijke informatie over het verloop van de pensioenuitkeringen en geeft
      daarbij aan of het pensioen waarschijnlijk zal dalen, stijgen of gelijk zal blijven; en

      d. de uitvoerder verstrekt informatie over de mogelijkheid om informatie, bedoeld in
      [artikel 9, zevende lid][ref15], bij de uitvoerder op te vragen.


