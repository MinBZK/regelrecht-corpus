      - id: ref2
        bwb_id: BWBR0020892
        artikel: 45b
        hoofdstuk: 9b
        paragraaf: 9b.3
  - number: 45a
    text: |-
      1 De transitiecommissie wordt ondersteund door een secretariaat. Het secretariaat is ondergebracht bij de Sociaal-
      Economische Raad, bedoeld in de [Wet op de Sociaal-Economische Raad][ref1].

      2 De werkzaamheden en huisvesting van het secretariaat van de transitiecommissie worden, voor zover goedgekeurd,
      gefinancierd door Onze Minister. Hieronder worden in ieder geval verstaan:

      a. de kosten voor de faciliteiten van vergaderingen en voor secretariële ondersteuning;

      b. de kosten voor het inschakelen van externe deskundigheid; en

      c. de kosten voor publicaties van jaarverslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 45b
    text: |-
      1 De transitiecommissie maakt een jaarverslag van haar werkzaamheden dat bestaat uit een financieel jaarverslag en
      een verslag van de werkzaamheden.

      2 De transitiecommissie maakt het jaarverslag over het afgelopen jaar steeds openbaar voor 1 april. Het jaarverslag
      over 2026 dient uiterlijk voor 1 juli 2026 openbaar gemaakt te worden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45b
  - number: 45c
    text: |-
      1 De transitiecommissie stelt een reglement vast waarin in ieder geval is vastgelegd:

      a. de procedure voor het aanvragen van bemiddeling dan wel bindend advies;

      b. de termijnen die gelden voor het in behandeling nemen van een aanvraag;

      c. in welke gevallen een aanvraag niet dan wel niet langer in behandeling wordt genomen en hoe de aanvragers
      daarover worden geïnformeerd;

      d. de procedure voor het openbaar maken van een bindend advies; en

      e. de wijze waarop besluitvorming plaatsvindt.

      2 De transitiecommissie kan in het reglement nadere regels opnemen met betrekking tot de informatie en opgaven,
      bedoeld in [artikel 45d, eerste lid][ref1].

      3 Het reglement wordt door de transitiecommissie vastgesteld na overleg met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel45d
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 45d
        hoofdstuk: 9b
        paragraaf: 9b.3
  - number: 45d
    text: |-
      1 Indien de aanvraag een verzoek tot bindend advies betreft overleggen de aanvragers bij de aanvraag:

      a. informatie over de onderwerpen waarover overeenstemming is bereikt;

      b. informatie over de onderwerpen waarover geen overeenstemming is bereikt;

      c. informatie over de onderhandelingsinzet van de beide aanvragers bij de onderwerpen waarover geen overeenstemming
      is bereikt;

      d. de berekeningen van de effecten voor de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde van
      de verschillende opties; en

      e. een oordeel over de uitvoerbaarheid van de beoogde uitvoerder.

      2 De transitiecommissie maakt een bindend advies openbaar binnen vier weken na bekendmaking aan de aanvragers.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45d
  - number: 45e
    text: |-
      1 Een verzoek tot bemiddeling door de transitiecommissie dient voor 1 januari 2024 te worden ingediend bij de
      transitiecommissie als partijen de pensioenovereenkomst dan wel de beroepspensioenregeling willen laten uitvoeren
      door een pensioenfonds en voor 1 januari 2025 als partijen deze willen laten uitvoeren door een verzekeraar of
      premiepensioeninstelling.

      2 Een verzoek tot het bindend adviseren door de transitiecommissie dient voor 1 juli 2024 te worden ingediend
      bij de transitiecommissie als partijen de pensioenovereenkomst dan wel de beroepspensioenregeling willen laten
      uitvoeren door een pensioenfonds en voor 1 januari 2026 als partijen deze willen laten uitvoeren door een
      verzekeraar of premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45e
  - number: '46'
    text: |-
      1 In het kader van de wijze waarop voorbereidingen worden getroffen voor de uitvoering van de gewijzigde
      pensioenovereenkomst dan wel de gewijzigde beroepspensioenregeling en de besluiten op grond van
      de [artikelen 150m][ref1] en [150n van de Pensioenwet][ref2] dan wel de [artikelen 145l][ref3] en
      [145m van de Wet verplichte beroepspensioenregeling][ref4] wordt in het implementatieplan van fondsen ten minste
      opgenomen:

      a. informatie over het doorlopen en te doorlopen besluitvormingsproces;

      b. de genomen en te nemen stappen in de implementatiefase en uitvoeringsfase en het beoogde tijdpad hiervoor
      en welke stappen gezet moeten worden ingeval financiële, economische en andere schokken optreden tijdens de
      transitieperiode; en

      c. de onderwerpen, bedoeld in [artikel 44, onderdelen d en e][ref5].

      2 Een fonds onderbouwt hoe zal worden omgegaan met de opgebouwde pensioenaanspraken en pensioenrechten,
      alsmede de berekeningen daarbij en de overwegingen daartoe. Indien een fonds zal overgaan tot
      een collectieve waardeoverdracht als bedoeld in [artikel 150m van de Pensioenwet][ref6] dan wel
      [artikel 145l van de Wet verplichte beroepspensioenregeling][ref7] betreft dit in ieder geval:

      a. welk gedeelte van het vermogen wordt gebruikt om te voldoen aan de vereisten ten aanzien van het minimaal
      vereist eigen vermogen;

      b. indien van toepassing, de onderbouwing van het toepassen van de vba-methode voor de waardering van de
      pensioenaanspraken en pensioenrechten en het aanwenden van het vermogen;

      c. hoe invulling wordt gegeven aan de keuzes die een fonds op grond van [artikel 150n van de Pensioenwet][ref8] dan
      wel [artikel 145m van de Wet verplichte beroepspensioenregeling][ref9] kan maken;

      d. indien van toepassing, de hoogte van de initiële vulling van het compensatiedepot;

      e. indien van toepassing, de hoogte van de initiële vulling van de solidariteitsreserve of risicodelingsreserve;

      f. hoe het rekening heeft gehouden met de gevolgen voor deelnemers, gewezen
      deelnemers, gewezen partners en pensioengerechtigden van gebruikmaking van
      overbruggingsplannen als bedoeld in [artikel 150p van de Pensioenwet][ref10] dan wel
      [artikel 145o van de Wet verplichte beroepspensioenregeling][ref11];

      g. hoe het rekening heeft gehouden of zal houden met de gevolgen voor deelnemers, gewezen deelnemers, gewezen
      partners of pensioengerechtigden wanneer gebruik is of zal worden gemaakt van de mogelijkheid toeslag te verlenen
      bij een beleidsdekkingsgraad vanaf 105%;

      h. hoe zal worden omgegaan met arbeidsongeschiktheidspensioen, premievrije voortzetting en nabestaandenpensioen; en

      i. indien van toepassing, de onderbouwing van het toepassen van een andere spreidingstermijn
      dan tien jaar bij de standaardregel, bedoeld in [artikel 150n van de Pensioenwet][ref12] dan wel
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref13].

      3 Een fonds neemt een analyse op ten aanzien van:

      a. operationele en IT-risico’s waaronder de continuïteit en betrouwbaarheid van de dienstverlening voor, tijdens en
      na de transitie en de beheersing van deze risico’s;

      b. de beschikbaarheid van data voor, tijdens en na de transitie en de beheersing van de risico’s hierbij;

      c. de datakwaliteit voor, tijdens en na de transitie en de beheersing van de risico’s hierbij;

      d. de procesbeheersing en de beheersing van de risico’s hierbij waarbij tevens de onderbouwing van de risicoanalyse
      die na de inwerkingtreding van de [Wet toekomst pensioenen][ref14] is uitgevoerd wordt opgenomen;

      e. de risico’s die samenhangen met de uitbesteding van werkzaamheden en de beheersing van deze risico’s; en

      f. de financiële risico’s en de beheersing van deze risico’s.

      4 Een fonds moet kunnen aantonen dat de datakwaliteit voor, tijdens en na de transitie geborgd is. Dit doet zij
      door het uitvoeren van een risicoanalyse als bedoeld in het derde lid, onderdeel c. Een fonds dat besluit tot een
      collectieve waardeoverdracht van de opgebouwde pensioenaanspraken en pensioenrechten geeft tevens aan hoe zij de
      kwaliteit van de data zekerstelt voor, tijdens en na de transitie. Dat doet zij door:

      a. voorafgaand aan het indienen van het implementatieplan een externe accountant of een externe IT-auditor opdracht
      te geven werkzaamheden te verrichten waarmee het fondsbestuur in staat wordt gesteld een oordeel te vormen over
      de juistheid en volledigheid van de relevante pensioendata benodigd voor de transitie waarbij de resultaten van
      de bevindingen van de accountant of de IT-auditor, de wijze waarop de eventuele bevindingen zijn opgevolgd en de
      oordeelsvorming van het fonds dienen opgenomen te worden in het implementatieplan of meegestuurd te worden bij
      indiening van het implementatieplan bij De Nederlandsche Bank; en

      b. na de transitie een externe accountant opdracht te geven een oordeel te vellen over de juistheid en volledigheid
      van de transitie, waaronder tenminste de berekeningen die ten grondslag liggen aan de verdeling van vermogens en,
      indien van toepassing, het compensatiedepot, de solidariteitsreserve of de risicodelingsreserve bij invaren.

      5 Op verzekeraars en premiepensioeninstellingen is het eerste lid, onderdelen a en b, het tweede lid, eerste zin,
      en het derde lid, aanhef en onderdelen a, b, c en d, van overeenkomstige toepassing. Daar waar de onderdelen in het
      implementatieplan overeenkomen met het reeds doorlopen productontwikkelingsproces kan daarnaar verwezen worden.

      6 De uitvoerder dient het implementatieplan, zonder het communicatieplan, in bij De Nederlandsche
      Bank en informeert de deelnemers, gewezen deelnemers, gewezen partners of pensioengerechtigden over
      de indiening en over de inhoud van het implementatieplan waaronder de voorgenomen wijzigingen in de
      pensioenregeling, de gemaakte keuzes en het verdere proces. De verzekeraar of premiepensioeninstelling
      die gebruikt maakt van [artikel 150i, vierde lid, onderdeel b, van de Pensioenwet][ref15], of
      [artikel 145h, vierde lid, van de Wet verplichte beroepspensioenregeling][ref16], informeert de deelnemers,
      gewezen deelnemers, gewezen partners of pensioengerechtigden tijdig maar uiterlijk wanneer de gewijzigde
      pensioenovereenkomst of gewijzigde beroepspensioenregeling bekend is.


