  - number: 14c
    text: |-
      1 Indien de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen stelt
      de uitvoerder op basis van de informatie, bedoeld in [artikel 52, zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, zesde lid, van de Wet verplichte beroepspensioenregeling][ref2], het risicoprofiel van de deelnemer of
      gewezen deelnemer vast en baseert het advies, bedoeld in artikel 52, derde lid, van de Pensioenwet dan wel artikel
      63, derde lid, van de Wet verplichte beroepspensioenregeling, op dit risicoprofiel.

      2 Het risicoprofiel van de deelnemer of gewezen deelnemer geeft de mate weer waarin hij beleggingsrisico kan en
      wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar, indien een belangrijke gebeurtenis
      daartoe aanleiding geeft en als de deelnemer of gewezen deelnemer om toetsing vraagt. Indien het nieuwe
      risicoprofiel daartoe aanleiding geeft adviseert de uitvoerder de deelnemer of gewezen deelnemer over een ander
      passend beleggingsprofiel.

      3 De pensioenuitvoerder informeert de deelnemer of gewezen deelnemer over de voorwaarden die aan de beschikbare
      beleggingsmogelijkheden zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14c
