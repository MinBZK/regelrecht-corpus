      1 Voor de weergave op basis van een pessimistisch scenario, een verwacht scenario
      en een optimistisch scenario, bedoeld in de [artikelen 10c, vierde lid][ref1],
      [38, eerste lid, onderdeel g][ref2], [40, eerste lid, onderdeel a][ref3], [44a, eerste lid][ref4],
      [45, tweede lid][ref5], [46, derde en vijfde lid][ref6], [51, eerste lid, onderdeel a][ref7],
      [63b, tweede lid][ref8], en [150j, tweede lid, onderdelen a en b, van de Pensioenwet][ref9],
      de [artikelen 28c, vierde lid][ref10], [49, eerste lid, onderdeel g][ref11],
      [51, eerste lid, onderdeel b][ref12], [55a, eerste lid][ref13], [56, tweede lid][ref14],
      [57, derde en vijfde lid][ref15], [62, eerste lid, onderdeel a][ref16], [75b, tweede lid][ref17], en
      [145i, tweede lid, onderdelen a en b, van de Wet verplichte beroepspensioenregeling][ref18] wordt gebruik gemaakt
      van de scenariosets, bedoeld in [artikel 23b van het Besluit financieel toetsingskader pensioenfondsen][ref19] en
      een voorgeschreven rekenmethodiek.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de rekenmethodiek.


