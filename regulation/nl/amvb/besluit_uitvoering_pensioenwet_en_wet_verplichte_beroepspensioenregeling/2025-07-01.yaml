  - number: 7c
    text: |-
      1 Bij de informatie die wordt verstrekt over een variabele uitkering, bedoeld in de
      [artikelen 44a, eerste lid][ref1], of [63b, tweede lid, van de Pensioenwet][ref2] dan wel de
      [artikelen 55a, eerste lid][ref3], of [75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4], geldt
      het volgende:

      a. een uitvoerder die één uniform beleggingsprofiel hanteert, vermeldt dit;

      b. een uitvoerder die meerdere beleggingsprofielen hanteert of die een uitkering aanbiedt bestaande uit een
      vastgesteld en een variabel gedeelte, baseert de opgave van de hoogte van de variabele uitkering of de verhouding
      tussen het vastgestelde en variabele gedeelte op het beleggingsprofiel dat passend is gezien het risicoprofiel van
      de deelnemer of gewezen deelnemer.

      2 De uitvoerder die een spreidingsperiode hanteert van meer dan vijf jaar neemt in de informatie
      die wordt verstrekt over een variabele uitkering, bedoeld in [artikel 44a, eerste lid][ref5], of
      [artikel 63b, tweede lid, van de Pensioenwet][ref6] dan wel [artikel 55a, eerste lid][ref7], of
      [artikel 75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref8], de volgende tekst op:

      De ontwikkeling van uw pensioen hangt onder meer af van economische omstandigheden. Uw pensioen kan hierdoor omhoog
      of omlaag gaan. Wij spreiden financiële meevallers en tegenvallers over <x> jaar om grote schokken in de hoogte van
      uw pensioen te voorkomen. Bij langdurige tegenvallers en bij een spreidingsperiode van meer dan vijf jaar kan uw
      pensioen na verloop van tijd flink lager uitvallen.

      3 De uitvoerder die geen vastgestelde uitkeringen uitvoert, geeft bij de opgave van de hoogte van
      de vastgestelde uitkeringen, bedoeld in [artikel 44a, eerste lid, van de Pensioenwet][ref9] dan wel
      [artikel 55a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref10], aan dat een vastgestelde uitkering
      naar verwachting lager is dan een variabele uitkering maar met minder of geen kans op afwijking.


