  - number: 10d
    text: |-
      In de uitvoeringsovereenkomst met een algemeen pensioenfonds wordt een regeling opgenomen waaruit blijkt welke
      diensten worden uitgevoerd, onder welke voorwaarden dat gebeurt en waarbij in ieder geval afspraken worden
      opgenomen over indicatoren met betrekking tot de kwaliteit van dienstverlening.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel10d
  - number: '11'
    text: |-
      1 Als principes voor goed pensioenfondsbestuur als bedoeld in [artikel 33, tweede lid, van de Pensioenwet][ref1]
      dan wel [artikel 42, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] worden aangewezen voor
      fondsen de Code Pensioenfondsen, zoals geformuleerd door de Stichting van de Arbeid en de Pensioenfederatie en voor
      verzekeraars de Code Rechtstreeks verzekerde regelingen, zoals geformuleerd door de Stichting van de Arbeid en het
      Verbond van Verzekeraars. Deze laatste code is van overeenkomstige toepassing op premiepensioeninstellingen. De
      codes, en iedere wijziging daarvan, behoeven de goedkeuring van Onze Minister

      2 Een uitvoerder doet in het bestuursverslag mededeling over de naleving van de principes, bedoeld in het eerste
      lid. Indien een uitvoerder de principes niet heeft nageleefd of niet voornemens is deze in het lopende en daarop
      volgende boekjaar na te leven, doet hij daarvan in het bestuursverslag gemotiveerd opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel11
