        artikel: '143'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '138'
  - number: 14.0a
    text: |-
      1 Een fonds stelt De Nederlandsche Bank tijdig in kennis van het uitbesteden van werkzaamheden aan een derde.
      Indien de uitbesteding de risicobeheerfunctie, interne auditfunctie, actuariële functie of het beheer van het
      pensioenfonds betreft, wordt De Nederlandsche Bank daarvan in kennis gesteld voordat de overeenkomst met de derde
      waaraan de werkzaamheden worden uitbesteed in werking treedt.

      2 Een fonds stelt de Nederlandsche Bank in kennis van belangrijke ontwikkelingen met betrekking tot de uitbestede
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14.0a
