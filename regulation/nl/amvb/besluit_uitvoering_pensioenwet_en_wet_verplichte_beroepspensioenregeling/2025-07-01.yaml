  - number: '47'
    text: |-
      1 Het overbruggingsplan, bedoeld in [artikel 150p van de Pensioenwet][ref1] dan wel
      [artikel 145o van de Wet verplichte beroepspensioenregeling][ref2], bevat in ieder geval:

      a. de in [artikel 150p, derde en vierde lid, onderdeel a, van de Pensioenwet][ref3] dan wel
      [artikel 145o, derde en vierde lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref4] genoemde
      onderwerpen;

      b. een beschrijving van de voorziene ontwikkeling van de technische voorzieningen en de waarden; en

      c. een beschrijving van de concrete maatregelen waardoor het eigen vermogen binnen de looptijd van het
      overbruggingsplan op de invaardekkingsgraad komt, waarbij rekening wordt gehouden met de toeslagverlening en de
      overige verplichtingen van het fonds.

      2 Een fonds dat een overbruggingsplan indient en nog geen implementatieplan heeft ingediend,
      onderbouwt in het overbruggingsplan de verwachting dat het zal overgaan tot een collectieve
      waardeoverdracht als bedoeld in [artikel 150m, eerste lid, van de Pensioenwet][ref5] dan wel
      [artikel 145l, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6].

      3 Het overbruggingsplan is ten aanzien van het eerste lid, onderdelen b en c, gebaseerd op een deterministische
      analyse op basis van een dekkingsgraadsjabloon.

      4 Voor toeslagverlening in de looptijd van het overbruggingsplan geldt dat geen toeslag wordt verleend:

      a. bij een beleidsdekkingsgraad onder 105%;

      b. bij een dekkingsgraad onder 105% of, nadat het fonds het implementatieplan heeft ingediend, onder de
      invaardekkingsgraad; en

      c. voor zover de dekkingsgraad van het fonds door de toeslagverlening lager zou worden dan 105% of lager dan de
      invaardekkingsgraad.

      5 De in het eerste lid, onderdeel c, genoemde maatregelen mogen er niet toe leiden dat het risico dat niet wordt
      voldaan aan de vereisten ten aanzien van het eigen vermogen doelbewust worden vergroot. In afwijking hiervan
      kan een fonds eenmalig, na dit in het implementatieplan te hebben onderbouwd, het strategisch beleggingsbeleid
      aanpassen mits dit past bij de risicohoudingen per cohort die voor het implementatieplan zijn vastgesteld. Als
      het fonds besluit niet over te gaan tot collectieve waardeoverdracht, dan brengt het fonds het risico van het
      strategische beleggingsbeleid zo snel mogelijk terug naar het eerdere niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
