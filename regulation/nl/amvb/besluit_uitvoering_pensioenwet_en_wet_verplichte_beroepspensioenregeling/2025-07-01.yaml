  - number: '12'
    text: |-
      In aanvulling op [artikel 34, tweede lid, van de Pensioenwet][ref1] en
      [artikel 43, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] besteedt een uitvoerder niet uit,
      indien:

      a. door de uitbesteding het operationele risico onnodig toeneemt;

      b. door de uitbesteding de continuïteit en de toereikendheid van de dienstverlening aan deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden wordt ondermijnd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel43
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel12
