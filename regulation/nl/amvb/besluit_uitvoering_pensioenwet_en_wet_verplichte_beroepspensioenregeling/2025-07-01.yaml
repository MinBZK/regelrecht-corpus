  - number: 5a
    text: |-
      1 De opgave van de verworven pensioenaanspraken die op grond van
      [artikel 38, eerste lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 49, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] wordt verstrekt
      betreft, voor zover het de opgebouwde aanspraak op ouderdomspensioen op grond van een premieovereenkomst dan wel
      premieregeling betreft, het voor pensioenuitkeringen aan te wenden vermogen of kapitaal.

      2 De opgave van de opgebouwde pensioenaanspraken op grond van een premieovereenkomst dan wel
      premieregeling die op grond van [artikel 40, eerste lid, onderdeel a, van de Pensioenwet][ref3] dan wel
      [artikel 51, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref4] wordt verstrekt betreft
      onder meer het voor pensioenuitkeringen aan te wenden vermogen of kapitaal en een indicatie van de hoogte van de
      periodieke uitkeringen op de pensioendatum. Bij de indicatie worden de op dat moment bij de uitvoerder geldende
      tarieven gehanteerd.

      3 De opgave van de reglementair te bereiken pensioenaanspraken die op grond
      van [artikel 38, eerste lid, onderdeel g, van de Pensioenwet][ref5] dan wel
      [artikel 49, eerste lid, onderdeel g, van de Wet verplichte beroepspensioenregeling][ref6] wordt verstrekt bevat
      onder meer een indicatie van het te bereiken voor pensioenuitkeringen aan te wenden vermogen of kapitaal op de
      pensioendatum en een indicatie van de hoogte van de periodieke uitkeringen op de pensioendatum. Bij de indicatie
      worden de op dat moment bij de uitvoerder geldende tarieven gehanteerd.

      4 Bij de in het derde lid bedoelde informatie wordt ten aanzien van nabestaandenpensioen aangegeven wat de
      consequenties zijn van de wijze van financieren.


