        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '54'
    text: |-
      [Artikel 28d][ref1] is van toepassing vanaf de opdrachtaanvaarding die betrekking heeft
      op de overgang op uitvoering van een gewijzigde pensioenovereenkomst als bedoeld in
      [artikel 220i van de Pensioenwet][ref2] dan wel een gewijzigde beroepspensioenregeling
      als bedoeld in [artikel 214g, van de Wet verplichte beroepspensioenregeling][ref3].
      [Artikel 1a van het Besluit financieel toetsingskader pensioenfondsen][ref4], zoals dat luidde voor het
      tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref5], blijft van toepassing op een eerdere
      opdrachtaanvaarding.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel28d
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
