  - number: 46f
    text: |-
      1 Een fonds dient een aanvraag voor een ontheffing als bedoeld
      in [artikel 150oa, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 145na, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2],
      tegelijk in met het doen van de melding aan de toezichthouder van het voornemen tot
      waardeoverdracht, bedoeld in [artikel 150m, tweede lid, van de Pensioenwet][ref3] dan wel
      [artikel 145l, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4].

      2 De toezichthouder neemt een besluit over de aanvraag tot ontheffing tegelijk met het besluit of het een
      verbod tot waardeoverdracht zal opleggen. De toezichthouder verleent geen ontheffing indien een verbod tot
      waardeoverdracht wordt opgelegd.

      3 Van redelijkerwijs niet kunnen voldoen als bedoeld in [artikel 150oa, eerste lid, van de Pensioenwet][ref5] dan
      wel [artikel 145na, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6] is sprake indien het fonds aan
      de toezichthouder aantoont dat:

      a. sprake is van specifiek voor het fonds geldende bijzondere omstandigheden of fondskarakteristieken;

      b. uitsluitend deze bijzondere omstandigheden of fondskarakteristieken ertoe leiden
      dat toepassing van een of meer van de in [artikel 150n, achtste lid][ref7], of
      [artikel 150o van de Pensioenwet][ref8] dan wel [artikel 145m, achtste lid][ref9], of
      [artikel 145n van de Wet verplichte beroepspensioenregeling][ref10] genoemde voorwaarden leidt tot
      onevenwichtig nadeel als bedoeld in [artikel 150l, vierde lid, onderdeel b, van de Pensioenwet][ref11] of
      [artikel 145k, vierde lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref12]; en

      c. het fonds redelijkerwijs op geen andere wijze kan voldoen aan de betreffende voorwaarden zonder dat toepassing
      daarvan leidt tot onevenwichtig nadeel.

      4 Bij de aanvraag voor ontheffing toont het fonds aan dat:

      a. de werkgever dan wel de beroepspensioenvereniging in het transitieplan het fonds heeft verzocht
      af te wijken van de [artikelen 150n, achtste lid][ref13], of [150o Pensioenwet][ref14] dan wel de
      [artikelen 145m, achtste lid][ref15] of [145n Wet verplichte beroepspensioenregeling][ref16];

      b. het fonds het verantwoordingsorgaan, het belanghebbendenorgaan of de raad
      van toezicht, ten behoeve van de advisering, dan wel goedkeuring, als bedoeld in
      [artikel 150m, vierde, zesde en zevende lid, van de Pensioenwet][ref17] dan wel
      [artikel 145l, vierde en zesde lid, van de Wet verplichte beroepspensioenregeling][ref18] uitdrukkelijk heeft
      verzocht om te adviseren of goedkeuring te verlenen aan het doen van een aanvraag van een in het eerste lid
      bedoelde ontheffing bij de toezichthouder;

      c. het fonds aan het verantwoordingsorgaan of het belanghebbendenorgaan, in aanvulling op [artikel 46b][ref19],
      de transitie-effecten van de totale transitie inzichtelijk heeft gemaakt, waarbij ten minste het netto
      profijt en de pensioenverwachting als bedoeld in [artikel 150e van de Pensioenwet][ref20] dan wel
      [artikel 145d van de Wet verplichte beroepspensioenregeling][ref21], per leeftijdscohort in hele geboortejaren zijn
      opgenomen en waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en pensioengerechtigden en het
      verschil inzichtelijk wordt gemaakt voor de situatie dat de toezichthouder wel of geen ontheffing geeft;

      d. het fonds indien van toepassing aan de raad van toezicht of de visitatiecommissie de gegevens, bedoeld in
      onderdeel c, alsmede het advies van het verantwoordingsorgaan of de reactie op het verzoek tot goedkeuring van het
      belanghebbendenorgaan heeft verstrekt;

      e. het fonds aan de hand van de in onderdeel c opgenomen berekeningen de transitie-effecten van het aanvragen van
      een ontheffing nadrukkelijk heeft meegewogen en deze weging inzichtelijk maakt in de onderbouwing van de aanvraag
      voor de ontheffing en in het implementatieplan; en

      f. het fonds onderbouwt dat door de gevraagde ontheffing het fonds met het besluit tot collectieve
      waardeoverdracht in overeenstemming met [artikel 105, tweede lid, van de Pensioenwet][ref22] dan wel
      [artikel 110b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref23] handelt.


