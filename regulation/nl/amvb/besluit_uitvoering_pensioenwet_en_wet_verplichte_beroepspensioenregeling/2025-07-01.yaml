  - number: 14v
    text: |-
      1 Het risicopreferentie-onderzoek onderzoekt de mate waarin een groep deelnemers, gewezen deelnemers of
      pensioengerechtigden bereid is beleggingsrisico’s te lopen met het oog op hun doelstellingen. Hierbij zal
      tenminste de mate van relatieve risicoaversie van deze groep worden afgeleid uit het onderzoek. Bij de vaststelling
      van de uitvraag voor het risicopreferentie-onderzoek wordt rekening gehouden met de mate waarin deze groep
      beleggingsrisico’s kan dragen gegeven de kenmerken van de groep, op basis van onder meer deelnemerskenmerken
      en wetenschappelijke inzichten. De uitkomsten van het onderzoek zijn bruikbaar voor het vaststellen van de
      risicohouding op cohortniveau.

      2 Het risicopreferentie-onderzoek sluit aan bij de pensioencontext en de persoonlijke situatie van deelnemers,
      gewezen deelnemers en pensioengerechtigden en geeft in de uitvraag een realistisch beeld van de hoogte van de te
      verwachte pensioenuitkering en de te verwachten zekerheid van de pensioenuitkering. Hiervoor wordt een realistische
      inschatting van de hoogte van de pensioenpremie gebruikt.

      3 De inrichting van het risicopreferentie-onderzoek is zodanig dat naar verwachting voor ieder cohort voldoende
      representatieve individuele uitkomsten opgehaald worden. De grootte van ieder cohort moet onderbouwd worden op
      grond van de uitkomsten van het onderzoek.

      4 De uitvoerder streeft ernaar dat de respons per cohort een adequate weerspiegeling is van de cohortpopulatie. De
      cohortpopulaties samen zijn een weerspiegeling van de deelnemerspopulatie. De uitvoerder onderbouwt dat sprake is
      van een adequate weerspiegeling en dat de vertaling van individuele uitkomsten naar cohortniveau zo representatief
      als mogelijk zijn.

      5 Het risicopreferentie-onderzoek levert een zo objectief mogelijk, controleerbaar, systematisch, reproduceerbaar
      en kwantitatief interpreteerbare uitkomst op.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14v
  - number: '15'
    text: |-
      1 Per geboden keuzemogelijkheid als bedoeld in [artikel 60][ref1], [61][ref2], [61a][ref3]
      of [62 van de Pensioenwet][ref4] dan wel [artikel 72][ref5], [73][ref6], [73a][ref7], of
      [74 van de Wet verplichte beroepspensioenregeling][ref8], wordt door de pensioenuitvoerder voor een door hem te
      bepalen periode voor alle deelnemers en gewezen deelnemers dezelfde ruilvoet of opbouwkeuzevoet vastgesteld.

      2 De ruilvoet en opbouwkeuzevoet worden zodanig vastgesteld dat sprake is van collectieve actuariële
      gelijkwaardigheid als bedoeld in de [artikelen 60, vijfde lid][ref9], [61, vierde lid][ref10], en
      [62, eerste lid, van de Pensioenwet][ref11] dan wel [artikel 72, vijfde lid][ref12], [73, vierde lid][ref13] en
      [74, eerste lid, van de Wet verplichte beroepspensioenregeling][ref14].

      3 In afwijking van het eerste lid kan aan een gewezen deelnemer de ruilvoet worden toegekend, die geldt op de dag
      van beëindiging van de deelneming.


