  - number: 1cc
    text: |-
      1 Indien de toedelingsregels met gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] van
      toepassing zijn, geldt bij pensioeningang het volgende:

      a. de verdeling, bedoeld in [artikel 1ca, eerste lid][ref2], wordt bepaald op basis van de op dat moment geldende
      verhouding tussen de uitkeringsvermogens en de spreidingsvermogens voor alle pensioengerechtigden;

      b. de wijze van verdeling, bedoeld in onderdeel a, kan aangepast worden op basis van een nauwkeurigere methode
      indien die verdeling beter aansluit bij te verwachten pensioenuitkeringen.

      2 Het op de pensioendatum door verdeling ontstane spreidingsvermogen wordt op basis van de spreidingsmethodiek,
      genoemd in [artikel 1cb, eerste lid][ref3], verwerkt in het uitkeringsvermogen, de pensioenuitkeringen en
      pensioenaanspraken van de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
