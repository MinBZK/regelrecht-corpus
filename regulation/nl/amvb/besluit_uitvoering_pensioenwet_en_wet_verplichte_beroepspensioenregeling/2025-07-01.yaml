  - number: 1c
    text: |-
      1 De uitvoerder berekent met een scenario-analyse de kans dat met de premie de beoogde
      pensioendoelstelling wordt gehaald, bedoeld in [artikel 10a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 28a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2].

      2 De uitvoerder legt vast of bescherming voor het renterisico in de solidaire premieovereenkomst dan wel solidaire
      premieregeling gebeurt door middel van beschermingsrendement gekoppeld aan:

      a. de rentetermijnstructuur, bedoeld in
      [artikel 2, tweede lid, van het Besluit financieel toetsingskader pensioenfondsen][ref3]; of

      b. een directe beschermingsportefeuille voor renterisico.

      3 Bij de keuze voor koppeling aan de rentetermijnstructuur:

      a. onderbouwt de uitvoerder kwantitatief op basis van een stochastische ALM-analyse de maximaal gewenste mate
      van afwijking tussen het feitelijke beleggingsrisico en renterisico dat alle leeftijdscohorten lopen en de
      toedelingsregels door:

      1°. de situatie met en zonder deling renterisico te vergelijken door middel van een stochastische analyse op basis
      van het vastgestelde strategische beleggingsbeleid; en

      2°. per leeftijdscohort een begrenzing te bepalen voor de toegestane afwijking tussen de feitelijke toedeling van
      rendementen op basis van de collectieve beleggingsportefeuille en de toedelingsregels; en

      b. maakt de uitvoerder de daadwerkelijke deling van renterisico per leeftijdscohort inzichtelijk en neemt
      maatregelen als deze de eigen begrenzing overschrijdt.

      4 Bij de keuze voor koppeling aan een directe beschermingsportefeuille:

      a. onderbouwt de uitvoerder in het kader van de vaststelling van het strategische beleggingsbeleid de mate van de
      renteafdekking op basis van die portefeuille kwantitatief met een stochastische ALM-analyse;

      b. legt de uitvoerder ex ante vast wat wordt verstaan onder nominaal renterisico waarbij de gehanteerde
      rentemaatstaf geen kredietrisico bevat; en

      c. onderbouwt de uitvoerder per beleggingscategorie kwantitatief in welke mate de categorie bijdraagt aan de
      bescherming van het nominale renterisico per leeftijdscohort.

      5 Indien een uitvoerder bij koppeling aan een directe beschermingsportefeuille reële bescherming wil bieden
      door ook voor inflatie gerelateerde instrumenten te kiezen in de directe portefeuille, is het vierde lid van
      overeenkomstige toepassing.

      6 De uitvoerder toetst jaarlijks of het derde of vierde lid de gewenste mate van bescherming tegen renterisico per
      leeftijdscohort biedt en neemt maatregelen als dat niet het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
