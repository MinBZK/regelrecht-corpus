  - number: 17b
    text: |-
      1 De risicovrije rente, bedoeld in [artikel 63a, tweede, derde, zesde en zevende lid, van de Pensioenwet][ref1],
      [artikel 75a, tweede, derde, zesde en zevende lid, van de Wet verplichte beroepspensioenregeling][ref2], en de
      [artikelen 1ca][ref3], [1d][ref4] en [17a, eerste en vierde lid][ref5], is de risicovrije rente voor fondsen.

      2 De parameter voor aandelenrendement, bedoeld in [artikel 63a, tweede en derde lid, van de Pensioenwet][ref6],
      [artikel 75a, tweede en derde lid, van de Wet verplichte beroepspensioenregeling][ref7],
      en [artikel 17a, eerste en vierde lid][ref8], is gelijk aan de parameter, bedoeld in
      [artikel 23a, eerste lid, onderdeel b, van het Besluit financieel toetsingskader pensioenfondsen][ref9].

      3 De prijsinflatie, bedoeld in [artikel 17a, vierde lid][ref10], is gebaseerd op zoveel mogelijk objectieve
      marktinformatie.


