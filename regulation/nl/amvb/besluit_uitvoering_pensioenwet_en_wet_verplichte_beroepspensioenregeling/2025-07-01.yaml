  - number: 1ca
    text: |-
      1 Bij pensioeningang verdeelt de uitvoerder het voor pensioenuitkering bestemd
      vermogen, bedoeld in [artikel 10a, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 28a, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], in een uitkeringsvermogen en een
      spreidingsvermogen, indien sprake is van toepassing van de toedelingsregels om gelijke aanpassingen als bedoeld in
      de artikelen 10a, vijfde lid, en [63a, achtste lid, van de Pensioenwet][ref3] dan wel de artikelen 28a, vijfde lid,
      en [75a, achtste lid, van de Wet verplichte beroepspensioenregeling][ref4], met spreiden te realiseren.

      2 De hoogte van de variabele uitkering wordt vastgesteld op basis van het uitkeringsvermogen en het
      projectierendement. Voor het projectierendement wordt ten hoogste uitgegaan van de risicovrije rente.

      3 De pensioenuitvoerder bepaalt het financiële resultaat als gevolg van het behaalde beschermingsrendement
      en overrendement als bedoeld in [artikel 10a, vierde lid, van de Pensioenwet][ref5] dan wel
      [artikel 28a, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6], voor alle pensioengerechtigden. Uit
      dit financiële resultaat van het collectief van pensioengerechtigden wordt het beschermingsrendement, dat volledige
      bescherming biedt voor het renterisico, ontwikkeling van de levensverwachting en het sterfteresultaat, toebedeeld
      aan het uitkeringsvermogen van iedere pensioengerechtigde.

      4 Na toedeling van het beschermingsrendement, bedoeld in het derde lid, wordt het resterende financiële resultaat
      op het moment van vaststelling volledig en onvoorwaardelijk verwerkt in het spreidingsvermogen en op basis van de
      spreidingsmethodiek, bedoeld in [artikel 1cb, eerste lid][ref7], onvoorwaardelijk vastgesteld en verwerkt in het
      uitkeringsvermogen, de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden.

      5 De wijze waarop financiële resultaten, bedoeld in het vierde lid, worden verwerkt in het uitkeringsvermogen en
      de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden, houdt in dat over de vastgestelde duur van
      de spreidingsperiode de pensioenuitkeringen en pensioenaanspraken onvoorwaardelijk in gelijke stappen dan wel in
      afnemende mate worden aangepast.

      6 Een uitvoerder kan bij het vaststellen en onvoorwaardelijk verwerken van het financiële resultaat in het
      uitkeringsvermogen, bedoeld in het vijfde lid, in een betreffend jaar rekening houden met de reeds eerder
      onvoorwaardelijk vastgestelde en verwerkte aanpassingen als gevolg van financiële resultaten. Hierbij geldt het
      volgende:

      a. de eerder vastgestelde en onvoorwaardelijk verwerkte aanpassingen en de onvoorwaardelijke aanpassing in het
      betreffende jaar bij elkaar opgeteld leiden tot een patroon waarbij de pensioenuitkeringen en pensioenaanspraken in
      gelijke stappen dan wel in afnemende mate worden aangepast; en

      b. de al onvoorwaardelijke vastgestelde en verwerkte aanpassingen worden niet gewijzigd.

      7 Indien de uitvoerder heeft gekozen voor toepassing in afnemende mate als bedoeld in het vijfde lid, kan de
      uitvoerder een afwijkende verwerking doorvoeren om het financiële resultaat binnen de duur van de spreidingsperiode
      volledig te verwerken in de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden, mits:

      a. de contante waarde van de nog totaal in de uitkering te verwerken financiële resultaten voor meer dan zestig
      procent in de eerste helft van de spreidingsperiode ligt; en

      b. de onvoorwaardelijke aanpassing in het betreffende jaar er niet toe leidt dat sprake is van zowel positieve als
      negatieve onvoorwaardelijke aanpassingen in de hoogte van de pensioenuitkeringen.


