  - number: '27'
    text: |-
      1 Onze Minister stelt regels voor de berekening van de inkoop van pensioenaanspraken op grond van de
      overdrachtswaarde in de pensioenregeling van de ontvangende uitvoerder.

      2 In geval van waardeoverdracht naar een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      wordt de overdrachtswaarde binnen een week na ontvangst van de overdrachtswaarde aangewend voor de aankoop van
      beleggingseenheden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel27
  - number: '28'
    text: |-
      1 De na waardeoverdracht verkregen aanspraken in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder,
      worden behandeld alsof zij in die regeling zelf zijn opgebouwd, waarbij zij ook ten aanzien van de toeslagverlening
      op dezelfde manier behandeld worden.

      2 Indien de ontvangende uitvoerder een beroepspensioenregeling uitvoert, kan worden afgeweken van het eerste lid
      ten aanzien van de toeslagverlening indien toepassing van het eerste lid op dat punt zou leiden tot een kennelijk
      onredelijk resultaat.

      3 Indien in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder, pensioenopbouw plaatsvindt op basis
      van dienstjaren, wordt de overdrachtswaarde omgezet in voor de pensioenopbouw meetellende dienstjaren.

      4 In een pensioenregeling die voor de pensioenopbouw rekent met een maximaal te bereiken aantal dienstjaren, geldt
      dat, indien toepassing van het derde lid leidt tot meer dan het maximale aantal dienstjaren, het meerdere wordt
      behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel28
  - number: 28a
    text: |-
      1 De voorzitter van een omgekeerd gemengd bestuur als bedoeld in [artikel 99 van de Pensioenwet][ref1] bepaalt de
      agenda van de overleggen van het bestuur en het niet uitvoerend deel van het bestuur.

      2 De voorzitter van een omgekeerd gemengd bestuur ziet toe op een goede samenstelling en het functioneren van het
      bestuur en is namens het bestuur eerste aanspreekpunt voor het verantwoordingsorgaan over het functioneren van
      het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28b
    text: |-
      1 De niet uitvoerende bestuurders bij een omgekeerd gemengd bestuur als bedoeld in
      [artikel 99 van de Pensioenwet][ref1] stellen een auditcommissie bedrijfseconomische aspecten en risicobeheer in.
      Deze auditcommissie is in ieder geval belast met toezicht op:

      a. de risicobeheersing;

      b. het beleggingsbeleid;

      c. de financiële informatieverschaffing door het fonds.

      2 De Nederlandsche Bank kan ontheffing verlenen van het eerste lid indien op andere wijze wordt voorzien in
      adequaat toezicht op het in het vorige lid genoemde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28c
    text: |-
      1 De raad van toezicht van een fonds kan de bestuurders van het fonds schorsen of ontslaan wegens disfunctioneren.

      2 Van disfunctioneren als bedoeld in het eerste lid is in ieder geval sprake indien het bestuur een
      besluit heeft genomen zonder de op grond van [artikel 104, derde lid, van de Pensioenwet][ref1] of
      [artikel 110a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] benodigde goedkeuring van de raad
      van toezicht en het bestuur niet aannemelijk maakt dat dit nodig was in het belang van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden dan wel voortvloeit uit een aanwijzing van de
      toezichthouder, een last onder dwangsom of rechtstreeks voortvloeit uit een wettelijk voorschrift.

      3 Het bestuur van een fonds legt de benoeming van een kandidaat bestuurder voor aan de raad van toezicht. De raad
      van toezicht kan de benoeming van deze kandidaat bestuurder beletten indien deze niet voldoet aan de profielschets.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110a
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110a
  - number: 28d
    text: |-
      1 Uiterlijk bij de opdrachtaanvaarding, bedoeld in [artikel 102a, derde lid, van de Pensioenwet][ref1] dan
      wel [artikel 109a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2], en bij elke ingrijpende
      wijziging, informeert het fonds de vertegenwoordigers van werkgevers of werkgeversverenigingen, werknemers of
      werknemersverenigingen of beroepspensioenverenigingen die de pensioenregeling zijn overeengekomen ten minste en
      voor zover van toepassing over:

      a. de risicohouding;

      b. de regels ten aanzien van de solidariteitsreserve of de risicodelingsreserve;

      c. de toedelingsregels;

      d. het projectierendement of de vaste daling; en

      e. de spreidingssystematiek dan wel de spreidingsmethodiek, genoemd in [artikel 1cb][ref3].

      2 Het fonds licht toe welke overwegingen aan de vormgeving van de pensioenregeling, waaronder de in het eerste
      lid genoemde onderdelen ten grondslag liggen. Gezien de samenhang tussen de verschillende onderdelen, beoordeelt
      het fonds de afwegingen bij de verschillende onderdelen ook in samenhang met elkaar. Hierbij wordt ten minste
      toegelicht:

      a. hoe de vormgeving van de pensioenregeling aansluit op de opdracht en doelstellingen;

      b. wat de effecten van de vormgeving van de pensioenregeling zijn op de verwachte pensioenen voor de verschillende
      leeftijdscohorten;

      c. hoe het fonds de resultaten van het risicopreferentie-onderzoek, de wetenschappelijke inzichten en de
      deelnemerskenmerken heeft gewogen en op basis daarvan de risicohouding heeft vastgesteld per leeftijdscohort;

      d. hoe de vormgeving van de pensioenregeling verband houdt met de vastgestelde risicohouding per leeftijdscohort;
      en

      e. de onderbouwing in welke mate de gevolgen van de voorgenomen pensioenregeling, zowel op de onderdelen als
      de gezamenlijke werking van de verschillende onderdelen, passen bij deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden, gegeven de samenstelling van de populatie van het fonds.

      3 Het fonds informeert de vertegenwoordigers, bedoeld in het eerste lid, aanhef, bij de opdrachtbevestiging over de
      consequenties van arbeidsvoorwaardelijke keuzes, waaronder ten minste de gevolgen voor:

      a. de uitvoerbaarheid en uitvoeringskosten; en

      b. in geval van een solidaire premieovereenkomst dan wel solidaire premieregeling de kans dat de beoogde
      pensioendoelstelling, gegeven de premie wordt behaald aan de hand van een uniforme scenario-analyse

      4 De toezichthouder kan regels stellen ten aanzien van de wijze waarop de informatie wordt gegeven.


