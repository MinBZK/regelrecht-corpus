  - number: '24'
    text: |-
      Overschrijding van de in dit hoofdstuk gestelde termijnen door de overdragende of ontvangende uitvoerder wordt de
      deelnemer niet tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel24
  - number: '25'
    text: |-
      1 De overdrachtswaarde van pensioenaanspraken die voortvloeien uit een premieovereenkomst of premieregeling,
      voor zover de premie wordt belegd, is het op de overdrachtsdatum voor pensioenuitkering bestemd vermogen of
      kapitaal, met inachtneming van het bepaalde in [artikel 55, eerste of tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 66, eerste of tweede lid, van de Wet verplichte beroepspensioenregeling][ref2].

      2 In afwijking van het eerste lid wordt de overdrachtswaarde van pensioenaanspraken berekend op basis van het
      standaardtarief indien sprake is van:

      a. aanspraken voortvloeiend uit een uitkeringsovereenkomst, zoals gedefinieerd in
      [artikel 1 van de Pensioenwet][ref3] dan wel een uitkeringsregeling, zoals gedefinieerd in
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4], zoals deze artikelen luidden op de
      dag voor het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref5]; en

      b. aanspraken op een vastgestelde uitkering in een premie-uitkeringsovereenkomst dan wel premie-uitkeringsregeling.

      3 De overdrachtswaarde van pensioenaanspraken als bedoeld in het tweede lid is ten minste gelijk aan de contante
      waarde van de over te dragen pensioenaanspraken op de overdrachtsdatum. Het standaardtarief wordt berekend op basis
      van marktwaardering.

      4 Indien de overdrachtswaarde niet op basis van het standaardtarief berekend kan worden, worden de
      pensioenaanspraken met behoud van de actuariële gelijkwaardigheid eerst omgezet in pensioenaanspraken waarop het
      standaardtarief wel toegepast kan worden.

      5 In afwijking van het eerste lid wordt de overdrachtswaarde van pensioenaanspraken die voortvloeien uit een
      kapitaalovereenkomst, zoals gedefinieerd in [artikel 1 van de Pensioenwet][ref6] dan wel een kapitaalregeling,
      zoals gedefinieerd in [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref7], zoals deze
      artikelen luidden op de dag voor het tijdstip van inwerkingtreding van de [Wet toekomst pensioenen][ref8] of uit
      een premieovereenkomst dan wel premieregeling waarbij de premie is aangewend voor de aankoop van een verzekerd
      kapitaal berekend op basis van de actuariële grondslagen van de overdragende uitvoerder. Onder actuariële
      grondslagen worden de grondslagen verstaan die de uitvoerder hanteert voor de vaststelling van de technische
      voorziening bij waardeoverdracht.

      6 Bij de berekening van de overdrachtswaarde mogen buiten beschouwing blijven:

      a. partnerpensioen dat is verzekerd op risicobasis, wezenpensioen en arbeidsongeschiktheidspensioen; en

      b. aanspraken op partnerpensioen of nettopensioen die achterblijven bij de overdragende uitvoerder.

      7 Onze Minister stelt regels voor de berekening van de overdrachtswaarde, bedoeld in het eerste lid en voor het
      standaardtarief.


