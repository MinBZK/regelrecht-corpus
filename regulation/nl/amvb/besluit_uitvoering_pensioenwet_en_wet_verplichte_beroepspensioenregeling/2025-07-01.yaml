      betrekking op de vermindering van pensioenaanspraken en pensioenrechten die in de laatste vijf jaar is doorgevoerd.

      3 De informatie over vermindering van pensioenaanspraken en pensioenrechten die
      op grond van [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref18] en
      [artikel 57a, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref19], wordt verstrekt of
