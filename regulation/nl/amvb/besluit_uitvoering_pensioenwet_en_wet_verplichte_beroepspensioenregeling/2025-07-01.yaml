  - number: 17g
    text: |-
      1 De deelnemer wiens verwerving van pensioenaanspraken in de door de ontvangende uitvoerder
      uitgevoerde pensioenregeling voor 1 januari 2015 een aanvang heeft genomen, vraagt
      een opgave als bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 82, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] binnen zes maanden na aanvang van
      de verwerving.

      2 Indien op grond van [artikel 74, eerste lid, van de Pensioenwet][ref3] dan wel
      [artikel 85, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4], de plichten van de
      overdragende en de ontvangende uitvoerder, bedoeld in [artikel 71 van de Pensioenwet][ref5] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref6], herleven, wordt de in het eerste lid omschreven
      verplichting van de deelnemer om binnen zes maanden een opgave te vragen verlengd tot zes maanden na die herleving.


