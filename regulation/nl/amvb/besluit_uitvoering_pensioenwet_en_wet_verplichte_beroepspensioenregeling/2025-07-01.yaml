  - number: 10b
    text: |-
      1 De administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1], worden in het bestuursverslag
      opgenomen als totaalbedrag en als bedrag per deelnemer of pensioengerechtigde.

      2 De kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref2], en de transactiekosten, bedoeld in
      artikel 10a, derde lid, worden in het bestuursverslag opgenomen als totaal bedrag en als percentage van het in het
      verslagjaar gemiddeld belegde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
