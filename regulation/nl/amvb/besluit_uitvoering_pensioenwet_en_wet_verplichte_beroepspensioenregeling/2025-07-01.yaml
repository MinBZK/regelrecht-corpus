  - number: 47a
    text: |-
      1 De vaststelling door fondsen of de plicht tot waardeoverdracht, bedoeld in de [artikelen 71][ref1] en
      [76 van de Pensioenwet][ref2] of [artikel 82 van de Wet verplichte beroepspensioenregeling][ref3], wordt
      opgeschort vanwege een van de omschreven situaties van opschorting in [artikel 150r van de Pensioenwet][ref4]
      of [artikel 145q van de Wet verplichte beroepspensioenregeling][ref5], vindt plaats per de eerste dag van iedere
      kalendermaand aan de hand van de situatie op de laatste dag van de voorafgaande kalendermaand.

      2 Het ontvangende fonds informeert de deelnemer over de opschorting van de plicht tot
      waardeoverdracht en de gevolgen daarvan als de plicht tot waardeoverdracht is opgeschort vanwege
      een van de omschreven situaties van opschorting in [artikel 150r van de Pensioenwet][ref6] of
      [artikel 145q van de Wet verplichte beroepspensioenregeling][ref7], na de datum dat het ontvangende fonds de
      gegevens, bedoeld in [artikel 20][ref8], aan de deelnemer heeft verstrekt of zodra de deelnemer een opgave heeft
      gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref9].

      3 De plicht tot waardeoverdracht herleeft zodra niet langer sprake is van een van de in
      [artikel 150r van de Pensioenwet][ref10] of [artikel 145q van de Wet verplichte beroepspensioenregeling][ref11]
      omschreven situaties van opschorting. Het eerste lid is van overeenkomstige toepassing.

      4 Als de plicht tot waardeoverdracht na een periode van opschorting herleeft, geldt het volgende:

      a. indien de opschorting plaatsvond na de datum waarop de deelnemer een opgave heeft gevraagd van zijn
      pensioenaanspraken als bedoeld in [artikel 18][ref12] is, in afwijking van de definitie, bedoeld in
      [artikel 1][ref13], de overdrachtsdatum de datum waarop de plicht tot waardeoverdracht is herleefd; en

      b. indien de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref14]
      of de ontvangende uitvoerder de gegevens, bedoeld in [artikel 20][ref15], aan de deelnemer heeft verstrekt voor de
      herleving van de plicht tot waardeoverdracht, vraagt het ontvangende fonds binnen drie maanden na herleving van de
      plicht tot waardeoverdracht aan het overdragende fonds een opgave als bedoeld in [artikel 18][ref16].


