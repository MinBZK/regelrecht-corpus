  - number: 19b
    text: |-
      1 De in [artikel 71 van de Pensioenwet][ref1] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref2] genoemde plicht tot waardeoverdracht geldt niet
      indien een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is en de aanvullende bijdrage meer
      bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde.

      2 Indien de overdragende uitvoerder bij vaststelling van de opgave of voorlopige opgave, bedoeld in
      [artikel 18][ref3], of de ontvangende uitvoerder na ontvangst van de opgave of voorlopige opgave, bedoeld in
      artikel 18, vaststelt dat een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is die meer
      bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde, wordt de betreffende werkgever gevraagd binnen
      een maand na ontvangst van het verzoek aan te geven of hij bereid is de aanvullende bijdrage te betalen. De
      overdragende uitvoerder informeert de ontvangende uitvoerder terstond na afloop van de gegeven termijn over hetgeen
      van de oude werkgever is vernomen.

      3 Indien de werkgever niet binnen de gegeven termijn aangeeft bereid te zijn de aanvullende bijdragen te betalen,
      wordt aangenomen dat hij hiertoe niet bereid is.

      4 Indien op grond van de voorgaande leden de plicht tot waardeoverdracht niet geldt en de werkgever niet bereid is
      de aanvullende bijdragen te betalen, informeert de ontvangende uitvoerder de deelnemer hierover schriftelijk.

      5 Dit artikel is uitsluitend van toepassing indien de verwerving van pensioenaanspraken door de deelnemer in de
      door de ontvangende uitvoerder uitgevoerde pensioenregeling vanaf 1 januari 2015 een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel18
