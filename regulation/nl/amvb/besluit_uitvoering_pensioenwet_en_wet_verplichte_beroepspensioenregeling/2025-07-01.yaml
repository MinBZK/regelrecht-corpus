  - number: 40c
    text: |-
      1 De gegevens, bedoeld in [artikel 112a, derde lid, van de Pensioenwet][ref1] zijn:

      a. een opgave van de naam, het adres, het telefoon- en faxnummer, het e-mailadres en de internetpagina van het
      algemeen pensioenfonds;

      b. een opgave van de statutaire zetel en de statutaire naam;

      c. een opgave van het nummer van inschrijving in het handelsregister;

      d. een gewaarmerkt afschrift van de statuten;

      e. gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106 van de Pensioenwet][ref2] is bepaald met betrekking tot de geschiktheid van de personen die het beleid
      bepalen of mede bepalen;

      f. gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106 van de Pensioenwet][ref3] is bepaald met betrekking tot de betrouwbaarheid van de personen die het
      beleid bepalen of mede bepalen;

      g. gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106a van de Pensioenwet][ref4] met betrekking tot bestuurders en leden van de raad van toezicht is bepaald
      over het tijdsbeslag;

      h. een beschrijving van besturing en toezicht in de organisatie, mede in relatie tot de voorziene
      collectiviteitkringen;

      i. een beschrijving van de wijze waarop, in overeenstemming met de rangregeling, de scheiding wordt
      gewaarborgd tussen de afgescheiden vermogens die per collectiviteitkring worden aangehouden, overeenkomstig
      [artikel 123 van de Pensioenwet][ref5];

      j. een programma van werkzaamheden die het algemeen pensioenfonds voornemens is te verrichten;

      k. bescheiden waaruit het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref6]
      blijkt, inclusief bescheiden waaruit blijkt dat het algemeen pensioenfonds gedurende de eerste drie jaren
      doorlopend kan beschikken over het wettelijk vereiste weerstandsvermogen;

      l. een beschrijving van de werkzaamheden die worden uitbesteed, voorzien van een op een risicoanalyse gebaseerde
      onderbouwing;

      m. een beschrijving van de inrichting van de organisatie met betrekking tot de beheerste en integere
      bedrijfsvoering, bedoeld in [artikel 143 van de Pensioenwet][ref7], inclusief een eigen risicobeoordeling;

      n. de uitvoeringsovereenkomst of uitvoeringsovereenkomsten die het algemeen pensioenfonds voornemens is te sluiten,
      of indien hiervan nog geen sprake is, een modeluitvoeringsovereenkomst;

      o. het pensioenreglement of de pensioenreglementen die het algemeen pensioenfonds op grond van
      [artikel 35 van de Pensioenwet][ref8] heeft opgesteld ten behoeve van de collectiviteitkring of
      collectiviteitkringen of indien hiervan nog geen sprake is een modelpensioenreglement; en

      p. een beschrijving van de doelstellingen en beleidsuitgangspunten als bedoeld in
      [artikel 102a, eerste lid, van de Pensioenwet][ref9].

      2 De gegevens, bedoeld in het eerste lid, onderdeel e, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;

      b. een curriculum vitae;

      c. een opgave van de relevante diploma’s;

      d. een kopie van een geldig identiteitsbewijs; en

      e. een opgave van referenten.

      3 De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:

      a. een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;

      b. een kopie van een geldig identiteitsbewijs;

      c. gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en

      d. een opgave van referenten.

      4 Het programma van werkzaamheden, bedoeld in het eerste lid, onderdeel j, bevat ten minste:

      a. een beschrijving van het bedrijfsmodel en verdienmodel;

      b. een raming voor de eerste drie boekjaren van de kosten; en

      c. een raming voor de eerste drie kalenderjaren van de liquiditeitspositie.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel106a
