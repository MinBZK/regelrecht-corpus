  - number: 17f
    text: |-
      1 De voorwaarden, bedoeld in [artikel 220b, vierde lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 214a, vierde lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] zijn als volgt:

      a. de uitvoerder die gebruik wil maken van het recht op waardeoverdracht vraagt binnen zes maanden na 1 januari
      2020 bij het pensioenregister een opgave van de uitvoerders bij wie de aanspraakgerechtigden, waarvoor de
      uitvoerder gebruik wil maken van het recht op waardeoverdracht, pensioenaanspraken verwerven;

      b. de uitvoerder handelt bij de waardeoverdracht conform het plan, bedoeld in het tweede lid; en

      c. de uitvoerder informeert de betreffende aanspraakgerechtigden over de voorgenomen waardeoverdracht.

      2 De uitvoerders maken, in overleg met de Stichting Pensioenregister, een plan voor een gefaseerde uitvoering van
      de waardeoverdracht voor de in het eerste lid, onderdeel a, bedoelde gevallen, waarbij rekening wordt gehouden met
      de capaciteit van het pensioenregister en de belangen van de overdragende en ontvangende uitvoerders. Op voordracht
      van de uitvoerders en de Stichting Pensioenregister, en na advies van de toezichthouders, stelt Onze Minister het
      plan vast. Het plan wordt bekend gemaakt in de Staatscourant.

      3 De overdragende uitvoerder die de opgave, bedoeld in het eerste lid, onderdeel a, heeft
      gevraagd, vraagt op het moment dat dit is opgenomen in het plan, bedoeld in het tweede lid, bij het
      pensioenregister een opgave van de uitvoerder bij wie de aanspraakgerechtigde pensioenaanspraken verwerft.
      [Artikel 17e, derde tot en met zevende lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel214a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel17e
