  - number: 17a
    text: |-
      1 Bij toepassing van een periodieke vaste daling van de uitkering als
      bedoeld in [artikel 63a, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 75a, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt de uitkeringshoogte
      vastgesteld door te rekenen met een periodieke vaste daling van de uitkering die niet meer bedraagt dan 35% van
      het verschil tussen de risicovrije rente en de parameter voor aandelenrendement en niet meer dan consistent is met
      de risicohouding en het beleggingsbeleid. De waarde van de met de risicovrije rente contant gemaakte kasstromen is
      gelijk aan het pensioenkapitaal op pensioendatum.

      2 Voor het vaststellen van de maximale hoogte van de periodieke vaste daling als bedoeld in het eerste lid kan de
      risicovrije rentecurve worden omgerekend tot één rentepercentage door middel van een duratie benadering.

      3 De uitvoerder legt vast of en zo ja op welke wijze een periodieke vaste daling wordt toegepast.

      4 Het projectierendement, bedoeld in [artikel 63a, derde lid, van de Pensioenwet][ref3] dan wel
      [artikel 75a, derde lid, van de Wet verplichte beroepspensioenregeling][ref4] kan na de ingangsdatum van het
      pensioen wijzigen indien dit het gevolg is van wijziging van de parameter voor aandelenrendement, de risicovrije
      rente, de prijsinflatie of de risicohouding.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
