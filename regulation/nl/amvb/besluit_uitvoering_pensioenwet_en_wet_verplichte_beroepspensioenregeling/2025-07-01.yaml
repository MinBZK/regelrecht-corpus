  - number: '29'
    text: |-
      1 De Nederlandsche Bank toetst de geschiktheid en de betrouwbaarheid van een persoon die het beleid
      van een fonds bepaalt of mede bepaalt, bedoeld in [artikel 106 van de Pensioenwet][ref1] dan wel
      [artikel 110c van de Wet verplichte beroepspensioenregeling][ref2], voorafgaand aan de benoeming van deze persoon
      en op ieder ander moment, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding toe bestaat.

      2 De Nederlandsche Bank toetst de betrouwbaarheid van een persoon die houder is van de risicobeheerfunctie,
      interne auditfunctie of actuariële functie voorafgaand aan de benoeming van deze persoon en op ieder ander moment,
      indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding toe bestaat. De Nederlandsche Bank toetst de
      geschiktheid van de houders van deze functies, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding
      toe bestaat.

      3 De Nederlandsche Bank toetst de geschiktheid en betrouwbaarheid van een persoon die het intern toezicht van een
      fonds door een visitatiecommissie, de risicobeheerfunctie, interne auditfunctie of actuariële functie, niet zijnde
      het houderschap van deze functie, uitoefent, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding
      toe bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
