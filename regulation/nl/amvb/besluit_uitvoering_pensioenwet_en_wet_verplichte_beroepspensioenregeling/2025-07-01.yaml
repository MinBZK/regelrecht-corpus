  - number: 46d
    text: |-
      1 Bij de standaardmethode, bedoeld in [artikel 150n van de Pensioenwet][ref1] dan wel
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2], wordt gebruik gemaakt van een standaardregel.

      2 Bij de vba-methode, bedoeld in [artikel 150n van de Pensioenwet][ref3] en
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref4], wordt gebruik gemaakt van de rekenmethodiek
      in [artikel 46c][ref5].

      3 Bij dekkingsgraden, na de initiële vulling van een solidariteitsreserve, een risicodelingsreserve of een
      compensatiedepot, tussen 105% en 110% als bedoeld in [artikel 150n, zesde lid, van de Pensioenwet][ref6] dan wel
      [artikel 145m, zesde lid, van de Wet verplichte beroepspensioenregeling][ref7] kan 5% van het vermogen verschoven
      worden om evenwichtiger uitkomsten te bereiken.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot de voorgeschreven standaardregel.


