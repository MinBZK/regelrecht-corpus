  - number: '3'
    text: |-
      De Stichting Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het informeren van de
      deelnemer over de risico’s, bedoeld in [artikel 2, onderdeel e][ref1], voor zover het gaat om premieovereenkomsten
      dan wel premieregelingen met beleggingsvrijheid voor de deelnemer.


