  - number: '8'
    text: |-
      1 De uitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling over
      de inhoud van de vrijwillige pensioenregeling, waarbij de [artikelen 2][ref1] en [3][ref2] van overeenkomstige
      toepassing zijn.

      2 De informatie over de reglementair te bereiken pensioenaanspraken wordt overeenkomstig de [artikelen 5a][ref3] en
      [9, eerste en tweede lid][ref4], vastgesteld.

      3 De informatie over de beleggingsresultaten wordt verstrekt indien sprake is van een premieovereenkomst of
      premieregeling en heeft betrekking op de resultaten van de afgelopen vijf jaar of, indien de pensioenregeling
      minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is uitgevoerd door de
      pensioenuitvoerder.

      4 De informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en pensioengerechtigden
      worden gedragen wordt verstrekt indien sprake is van een premieovereenkomst of premieregeling en heeft betrekking
      op de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref5], de kosten van vermogensbeheer,
      bedoeld in artikel 10a, tweede lid, en de transactiekosten, bedoeld in artikel 10a, derde lid, indien deze kosten
      van invloed zijn op de pensioenaanspraak of het pensioenrecht.


