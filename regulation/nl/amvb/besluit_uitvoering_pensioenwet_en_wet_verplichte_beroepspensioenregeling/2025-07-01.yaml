  - number: 14e
    text: |-
      1 De informatie, bedoeld in de [artikelen 52, zesde lid][ref1], en [52a, vijfde lid, van de Pensioenwet][ref2] dan
      wel de [artikelen 63, zesde lid][ref3], en [63a, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref4]
      stelt de uitvoerder in staat om vast te kunnen stellen dat het advies of het beleggingsprofiel:

      a. voldoet aan de doelstellingen van de deelnemer, gewezen deelnemer of pensioengerechtigde ten aanzien van het
      pensioen; en

      b. inhoudt dat de deelnemer, gewezen deelnemer of pensioengerechtigde de met deze doelstellingen samenhangende
      beleggingsrisico’s financieel kan en wil dragen.

      2 De uitvoerder legt vast op welke wijze wordt vastgesteld of het advies of het beleggingsprofiel past bij het
      risicoprofiel van de deelnemer, gewezen deelnemer of pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
