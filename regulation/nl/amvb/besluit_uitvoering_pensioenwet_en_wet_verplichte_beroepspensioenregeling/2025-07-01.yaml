    text: |-
      In een overeenkomst als bedoeld in [artikel 124a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 120a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt in ieder geval geregeld dat:

      a. de pensioenbewaarder in het belang van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden optreedt;

      b. over het in bewaring gegeven pensioenvermogen slechts kan worden beschikt door het fonds en de pensioenbewaarder
      tezamen;

      c. de pensioenbewaarder het in bewaring gegeven pensioenvermogen slechts afgeeft tegen ontvangst van een verklaring
      van het fonds waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van het bedrijf
      van pensioenfonds;

      d. de pensioenbewaarder jegens het fonds, de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden
      en pensioengerechtigden aansprakelijk is voor door hen geleden schade voor zover de schade het gevolg is van
      verwijtbare niet-nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de pensioenbewaarder het bij
      hem in bewaring gegeven pensioenvermogen geheel of gedeeltelijk aan een derde heeft toevertrouwd; en

      e. de pensioenbewaarder van het fonds de informatie ontvangt die noodzakelijk is voor de uitoefening van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel120a
