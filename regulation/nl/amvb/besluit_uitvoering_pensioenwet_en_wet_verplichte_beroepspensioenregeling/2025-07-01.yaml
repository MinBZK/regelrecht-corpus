  - number: 40d
    text: |-
      1 De Nederlandsche Bank kan een verleende vergunning wijzigen, geheel of gedeeltelijk intrekken of beperken, dan
      wel daaraan nadere voorschriften verbinden, indien:

      a. de vergunninghouder daartoe een aanvraag heeft ingediend;

      b. de vergunninghouder, naar later blijkt, bij de aanvraag van de vergunning onjuiste of onvolledige gegevens heeft
      verstrekt, en kennis omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;

      c. de vergunninghouder omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop
      de vergunning werd verleend zich hadden voorgedaan of bekend waren geweest, de vergunning zou zijn geweigerd;

      d. de vergunninghouder niet meer voldoet aan de bij of krachtens de Pensioenwet gestelde regels dan wel niet meer
      voldoet aan de aan de vergunning verbonden voorschriften of gestelde beperkingen;

      e. de vergunninghouder geen gebruik van de vergunning heeft gemaakt binnen een termijn van twaalf maanden na
      vergunningverlening;

      f. de vergunninghouder de vergunningplichtige activiteit gedurende meer dan zes maanden heeft beëindigd;

      g. de vergunninghouder het bedrijf ten behoeve waarvan de vergunning is verleend, geheel of gedeeltelijk
      overdraagt;

      h. de vergunninghouder wordt ontbonden;

      i. niet blijkt dat de jaarrekening of de staten een getrouw beeld geeft of geven van de grootte en de samenstelling
      van het vermogen van het algemeen pensioenfonds en van het resultaat over het desbetreffende boekjaar;

      j. de vergunninghouder in staat van faillissement is komen te verkeren.

      2 De Nederlandsche Bank kan bij het besluit tot intrekking van een vergunning tevens bepalen dat het algemeen
      pensioenfonds binnen een door De Nederlandsche Bank te stellen termijn het bedrijf geheel of gedeeltelijk
      afwikkelt. Bij een afwikkeling, al dan niet bepaald door De Nederlandsche Bank, wordt het algemeen pensioenfonds of
      de curator in faillissement van het algemeen pensioenfonds aangemerkt als vergunninghoudende onderneming.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel40d
  - number: 40e
    text: |-
      1 Het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref1] bedraagt ten minste 0,2%
      van de waarde van het beheerd pensioenvermogen met een minimum van € 500.000 en een maximum van € 20 miljoen.

      2 Voor de dekking van aansprakelijkheidsrisico’s wordt het weerstandsvermogen, bedoeld in het eerste lid,
      verhoogd met 0,1% van de waarde van het beheerd pensioenvermogen, tenzij het algemeen pensioenfonds een
      beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening heeft die zijn aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van zijn bedrijf en voor gevallen op
      het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een
      bedrag van ten minste 0,75% van de waarde van het beheerde pensioenvermogen, met een minimum van € 2 miljoen
      en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde van het beheerde
      pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor alle
      schadegevallen gezamenlijk.

      3 In afwijking van het eerste en tweede lid bedraagt het weerstandsvermogen meer dan het resultaat van de
      berekeningswijze overeenkomstig dit artikel, indien de risicoanalyse van het algemeen pensioenfonds daartoe
      aanleiding geeft.

      4 Het weerstandsvermogen van het algemeen pensioenfonds wordt gevormd door de vermogensbestanddelen, bedoeld in de
      [artikelen 5 tot en met 8 van het Besluit financieel toetsingskader pensioenfondsen][ref2].

      5 Het algemeen pensioenfonds toetst ten minste een keer per jaar of de beroepsaansprakelijkheidsverzekering nog in
      overeenstemming is met de eisen, bedoeld in het tweede lid, dan wel vaker wanneer sprake is van een wijziging van
      omstandigheden die hierop van invloed zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel5
