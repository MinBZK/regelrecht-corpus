  - number: 46e
    text: |-
      1 Bij de netto profijt berekening, bedoeld in de [artikelen 150e][ref1], [150p, vierde lid][ref2], en
      [220e, vierde lid, van de Pensioenwet][ref3] dan wel de [artikelen 145d][ref4], [145o, vierde lid][ref5], en
      [214d, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6], wordt de vba- rekenmethodiek, bedoeld in
      [artikel 46c][ref7] gehanteerd met dien verstande dat de berekening wordt uitgevoerd met minimaal 10.000 risico-
      neutrale scenario’s als bedoeld in [artikel 43][ref8].

      2 Het netto profijt effect van het financieel toetsingskader tijdens de transitie,
      bedoeld in [artikel 150p, vierde lid, van de Pensioenwet][ref9] dan wel in
      [artikel 145o, vierde lid, van de Wet verplichte beroepspensioenregeling][ref10], wordt berekend door het netto
      profijt van het ongewijzigd voortzetten van de pensioenovereenkomst dan wel beroepspensioenregeling af te zetten
      tegen het netto profijt dat ontstaat door het indienen van een overbruggingsplan.

      3 Het netto profijt effect wanneer gebruik is gemaakt van de mogelijkheid in het jaar 2022 en 2023 toeslag
      te verlenen bij een beleidsdekkingsgraad vanaf 105% wordt berekend door het netto profijt van het ongewijzigd
      voortzetten van de pensioenovereenkomst dan wel beroepspensioenregeling af te zetten tegen het netto profijt dat
      ontstaat door het gebruik maken van deze mogelijkheid.

      4 Het resultaat van de netto profijt berekening in de [artikelen 150e][ref11], [150p, vierde lid][ref12],
      en [220e, vierde lid, van de Pensioenwet][ref13] en de [artikelen 145d][ref14], [145o, vierde lid][ref15] en
      [214d, vierde lid, van de Wet verplichte beroepspensioenregeling][ref16] wordt uitgedrukt als percentage van de
      marktwaarde van te verwachte pensioenuitkeringen bij het ongewijzigd voortzetten van de pensioenovereenkomst dan
      wel beroepspensioenregeling.

      5 De pensioenverwachting, bedoeld in de [artikelen 150e, eerste lid, onderdeel b][ref17],
      en [220e, vierde lid, onderdeel b, en vijfde lid, onderdeel b, van de Pensioenwet][ref18]
      dan wel de [artikelen 145d, eerste lid, onderdeel b][ref19], en
      [214d, vierde lid, onderdeel b, en vijfde lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref20],
      wordt berekend aan de hand van een scenario-analyse, waarbij:

      a. het pessimistisch scenario het 5e percentiel is;

      b. het verwacht scenario het 50e percentiel is; en

      c. het optimistisch scenario het 95e percentiel is.

      6 Bij de bruto profijt berekening, bedoeld in de [artikelen 150e, derde lid][ref21], en
      [220e, vijfde lid, van de Pensioenwet][ref22] en de [artikelen 145d, derde lid][ref23], en
      [214d, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref24], wordt op moment van berekening het
      volgende gehanteerd:

      a. de meest recente door De Nederlandsche Bank gepubliceerde nominale rentetermijnstructuur, bedoeld in
      [artikel 2, tweede lid, van het Besluit financieel toetsingskader pensioenfondsen][ref25];

      b. voor de prijs- en loonontwikkeling wordt aangesloten bij de prijs- en looninflatie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____; en

      c. voor de individuele loonontwikkeling van deelnemers en gewezen deelnemers wordt aangesloten bij voor de
      uitvoerder specifieke uitgangspunten.

      7 Het resultaat van de bruto profijt berekening in de [artikelen 150e, derde lid][ref27], en
      [220e, vijfde lid, van de Pensioenwet][ref28] en de [artikelen 145d, derde lid][ref29], en
      [214d, vierde lid, van de Wet verplichte beroepspensioenregeling][ref30] wordt uitgedrukt als percentage van de
      marktwaarde van te verwachte pensioenuitkeringen bij het ongewijzigd voortzetten van de pensioenovereenkomst dan
      wel beroepspensioenregeling.

      8 De uitvoerder onderbouwt de voor de uitvoerder specifieke uitgangspunten, bedoeld in het zesde lid, onderdeel c,
      op adequate wijze en neemt dit op in het implementatieplan.

      9 De transitie-effecten netto profijt, pensioenverwachting en bruto profijt worden berekend in ieder geval per
      leeftijdscohort in hele geboortejaren waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en
      pensioengerechtigden.


