  - number: 17e
    text: |-
      1 De overdragende uitvoerder die gebruikmaakt van het recht op waardeoverdracht van
      een kleine pensioenaanspraak, bedoeld in [artikel 70a van de Pensioenwet][ref1] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2], vraagt binnen een jaar nadat de deelneming van
      de deelnemer is beëindigd bij het pensioenregister een opgave van de uitvoerder bij wie de aanspraakgerechtigde
      pensioenaanspraken verwerft, tenzij de uitvoerder aantoont dat aan uitvraag binnen deze termijn redelijkerwijs niet
      kan worden voldaan.

      2 De overdragende uitvoerder herhaalt het verzoek om een opgave ten minste jaarlijks zolang de waardeoverdracht
      van de kleine pensioenaanspraak niet heeft plaatsgevonden. De uitvoerder registreert de verzoeken en registreert of
      deze tot een waardeoverdracht hebben geleid.

      3 Het pensioenregister meldt de overdragende uitvoerder zo spoedig mogelijk of, en zo ja bij welke uitvoerder, de
      aanspraakgerechtigde pensioenaanspraken verwerft en wat zijn klantherkenningsnummer bij deze uitvoerder is.

      4 De overdragende uitvoerder betaalt binnen tien werkdagen na de melding dat de aanspraakgerechtigde bij een
      uitvoerder pensioenaanspraken verwerft, de overdrachtswaarde aan de ontvangende uitvoerder. De overdragende
      uitvoerder verstrekt daarbij het klantherkenningsnummer en de geboortedatum van de aanspraakgerechtigde en andere
      relevante gegevens aan de ontvangende uitvoerder.

      5 De ontvangende uitvoerder wendt de overdrachtswaarde binnen een maand aan voor pensioenaanspraken en informeert
      de deelnemer daarna binnen tien werkdagen over de waardeoverdracht en de verworven pensioenaanspraken.

      6 De [artikelen 25 tot en met 28][ref3] zijn van overeenkomstige toepassing op de waardeoverdracht van een kleine
      pensioenaanspraak met dien verstande dat als overdrachtsdatum wordt aangemerkt de datum waarop de overdragende
      uitvoerder de overdrachtswaarde aan de ontvangende uitvoerder betaalt.

      7 De overdragende uitvoerder verstrekt de aanspraakgerechtigde op verzoek binnen twee weken een opgave van de
      berekening van de overdrachtswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel25
