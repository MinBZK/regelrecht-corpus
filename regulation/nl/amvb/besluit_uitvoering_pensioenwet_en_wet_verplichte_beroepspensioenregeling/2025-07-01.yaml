      Aan de mijlpalen, bedoeld in [artikel 150c van de Pensioenwet][ref1] dan wel
      [artikel 145b van de Wet verplichte beroepspensioenregeling][ref2] wordt uiterlijk voldaan op de volgende
      tijdstippen:

      a. voor de mijlpaal, bedoeld in [artikel 150c, eerste lid, onderdeel a, van de Pensioenwet][ref3] dan wel
      [artikel 145b, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref4]: 1 januari 2025;

      b. voor de mijlpaal, bedoeld in [artikel 150c, eerste lid, onderdeel b, van de Pensioenwet][ref5] dan wel
      [artikel 145b, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref6]: 1 juli 2025 voor
      pensioenfondsen die uiterlijk op 1 juli 2026 overgaan op uitvoering van een gewijzigde pensioenovereenkomst
      of beroepspensioenregeling als bedoeld in [artikel 220i, tweede lid, van de Pensioenwet][ref7] of
      [artikel 214g, tweede lid, van de Wet verplichte beroepspensioenregeling][ref8] en uiterlijk 12 maanden voor
      de beoogde overgang op uitvoering van een gewijzigde pensioenovereenkomst of beroepspensioenregeling als
      bedoeld in artikel 220i, tweede lid, van de Pensioenwet, of artikel 214g, tweede lid, van de Wet verplichte
      beroepspensioenregeling, indien deze beoogde overgang na 1 juli 2026 plaatsvindt; en

      c. voor de mijlpalen, bedoeld in [artikel 150c, tweede lid, onderdelen a en b, van de Pensioenwet][ref9] dan wel
      [artikel 145b, tweede lid, onderdelen a en b, van de Wet verplichte beroepspensioenregeling][ref10]: 1 oktober
      2026.


