  - number: 10ba
    text: |-
      1 De verzekeraar die bereid is op te treden als ontvangend uitvoerder verstrekt een betrokkene die het uit een
      flexibele premieovereenkomst dan wel flexibele premieregeling of een premie-uitkeringsovereenkomst dan wel premie-
      uitkeringsregeling voortvloeiende kapitaal op de pensioendatum wenst aan te wenden voor een pensioenuitkering,
      voorafgaand aan de totstandkoming van een overeenkomst inzake een pensioenuitkering ten minste de volgende
      informatie:

      a. haar statutaire naam, handelsnaam en adres;

      b. het feit dat zij een verzekeraar is;

      c. of zij advies verstrekt over pensioenuitkeringen;

      d. haar interne klachtenprocedure en de erkende geschilleninstantie waarbij zij is aangesloten; en

      e. de aard van de vergoeding die haar werknemers ontvangen voor het sluiten van de overeenkomst.

      2 De verzekeraar verstrekt de informatie in de Nederlandse taal of in elke andere taal die door partijen is
      overeengekomen.

      3 De verzekeraar verstrekt de informatie schriftelijk en kosteloos. De verzekeraar kan na toestemming van de
      betrokkene, de informatie elektronisch verstrekken, indien dat past in de context waarin zij met de betrokkene
      zaken doet. De elektronische verstrekking van informatie door de verzekeraar past in de context waarin de
      verzekeraar met de betrokkene zaken doet, indien is bewezen dat de betrokkene regelmatig toegang heeft tot
      internet. Het gegeven dat de betrokkene een e-mailadres opgeeft geldt in ieder geval als bewijs hiervan.

      4 Indien de informatie elektronisch wordt verstrekt, krijgt de betrokkene op zijn verzoek kosteloos een papieren
      afschrift.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel10ba
  - number: 10bb
    text: |-
      1 De uitvoerder verstrekt de gewezen deelnemer van wie de dekking voor nabestaandenpensioen
      is voortgezet op grond van [artikel 55, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 66, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] informatie over het
      keuzerecht om in plaats van ouderdomspensioen te kiezen voor het voortzetten van het partnerpensioen
      op risicobasis als bedoeld in [artikel 61a, eerste lid, van de Pensioenwet][ref3] dan wel
      [artikel 73a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref4].

      2 De informatie, bedoeld in het eerste lid, betreft in ieder geval:

      a. indien van toepassing: dat de gewezen deelnemer geen gebruik kan maken van het keuzerecht omdat zijn
      aanspraak op ouderdomspensioen na de uitruil voor het eerste jaar minder zou bedragen dan het op basis van
      [artikel 66 van de Pensioenwet][ref5] dan wel [artikel 78 van de Wet verplichte beroepspensioenregeling][ref6]
      bepaalde bedrag; of

      b. hoeveel pensioenvermogen of kapitaal wordt uitgeruild bij voortzetting in het eerste jaar en hoeveel
      pensioenvermogen of kapitaal resteert;

      c. in voorkomend geval, dat de dekking van het wezenpensioen niet kan worden voortgezet;

      d. wat de gevolgen zijn als de gewezen deelnemer wel of niet kiest voor voortzetting; en

      e. de gronden voor beëindiging van de voortzetting, bedoeld in [artikel 61a, tweede lid, van de Pensioenwet][ref7]
      dan wel [artikel 73a, tweede lid, Wet verplichte beroepspensioenregeling][ref8].

      3 De uitvoerder verstrekt de gewezen deelnemer die gebruik maakt van de mogelijkheid tot voortzetting jaarlijks de
      volgende informatie:

      a. indien van toepassing: dat sprake is van beëindiging van de voortzetting
      op grond van [artikel 61a, tweede lid, van de Pensioenwet][ref9] dan wel
      [artikel 73a, tweede lid, Wet verplichte beroepspensioenregeling][ref10]; of

      b. hoeveel pensioenvermogen of kapitaal wordt uitgeruild bij voortzetting in het volgende jaar en hoeveel
      pensioenvermogen of kapitaal resteert;

      c. dat de voortzetting wordt gecontinueerd tenzij de gewezen deelnemer meldt de voortzetting te willen beëindigen;
      en

      d. wat de gevolgen zijn van voortzetten respectievelijk beëindigen van de voortzetting.

      4 Bij de informatie die wordt verstrekt wordt uitgegaan van de situatie op de dag van aanvang van de voortzetting
      van de dekking dan wel de dag waarop de voortzetting zou worden gecontinueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
