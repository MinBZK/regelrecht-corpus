  - number: 7b
    text: |-
      1 De opgave van zijn pensioenrecht, bedoeld in [artikel 44, eerste lid, onderdeel a, van de Pensioenwet][ref1]
      dan wel [artikel 55, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] heeft bij een
      variabele uitkering betrekking op:

      a. de uitkering over het afgelopen jaar; en

      b. de uitkering voor het komende jaar.

      2 Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref3] geldt het volgende:

      a. de uitvoerder geeft informatie over gelijke aanpassingen met spreiden;

      b. de uitvoerder geeft concrete en persoonlijke informatie over het verloop van de pensioenuitkeringen en geeft
      daarbij aan of het pensioen waarschijnlijk zal dalen, stijgen of gelijk zal blijven; en

      c. de uitvoerder verstrekt informatie over de mogelijkheid om informatie, bedoeld in
      [artikel 9, zevende lid][ref4], bij de uitvoerder op te vragen.


