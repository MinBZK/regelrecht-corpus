  - number: '45'
    text: |-
      1 De transitiecommissie bestaat uit vijf onafhankelijke leden waaronder een voorzitter.

      2 Onze Minister benoemt de leden van de transitiecommissie. Alvorens een kandidaat-lid te benoemen vraagt Onze
      Minister het oordeel van de Stichting van de Arbeid over de kandidaat.

      3 De leden van de transitiecommissie zijn deskundig ten aanzien van pensioen en hebben ruime werkervaring op
      pensioenterrein als bestuurder, wetenschapper of bestuursadviseur.

      4 In de transitiecommissie als geheel is deskundigheid op het gebied van pensioen en arbeidsvoorwaarden,
      actuariële deskundigheid, kennis van en ervaring met mediation-trajecten en kennis van en ervaring met
      onderhandelingsprocessen vertegenwoordigd.

      5 De leden van de transitiecommissie:

      a. functioneren onafhankelijk en bevestigen dit voorafgaand aan hun aanstelling schriftelijk;

      b. leggen vast welke andere werkzaamheden zij verrichten; en

      c. zijn niet betrokken bij bemiddeling of bindend advies voor partijen of sectoren waarbij zij uit hoofde van hun
      andere werkzaamheden betrokken zijn.

      6 De transitiecommissie voorkomt belangenverstrengeling of de schijn van belangenverstrengeling en stelt hiervoor
      nadere regels in het reglement.

      7 De voorzitter en commissieleden kunnen op eigen verzoek door Onze Minister worden ontslagen. Zij kunnen verder
      door Onze Minister worden geschorst of ontslagen wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende
      gronden.

      8 De transitiecommissie wordt bekostigd door Onze Minister. De leden van de transitiecommissie kunnen een
      vergoeding ontvangen volgens de regels van de [Wet vergoedingen adviescolleges en commissies][ref1].

      9 De transitiecommissie wordt uiterlijk vier weken nadat het jaarverslag over 2026, bedoeld in [artikel 45b][ref2],
      is uitgebracht opgeheven, tenzij naar het oordeel van Onze Minister onvoorziene omstandigheden het opheffen van de
      transitiecommissie in de weg staan.


      [ref1]: https://wetten.overheid.nl/BWBR0024775
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel45b
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel45
    references:
