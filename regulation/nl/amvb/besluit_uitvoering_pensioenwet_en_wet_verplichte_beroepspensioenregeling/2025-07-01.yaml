        artikel: '63'
  - number: 14d
    text: |-
      1 De uitvoerder die verantwoordelijk is voor de beleggingen baseert het strategisch beleggingsbeleid op de
      risicohouding en toetst jaarlijks op basis van een scenarioanalyse of het beleggingsbeleid of de toedelingsregels
      passend zijn bij de vastgestelde risicohouding en past het beleggingsbeleid aan indien dat niet het geval is.

      2 Het beleggingsbeleid in de opbouwfase van een flexibele premieovereenkomst of premie-uitkeringsovereenkomst
      dan wel een flexibele premieregeling of premie-uitkeringsregeling wordt door de uitvoerder gebaseerd op
      een vastgestelde of een variabele uitkering, naar gelang welke uitkeringsvorm in de pensioenovereenkomst of
      beroepspensioenregeling als standaard is opgenomen. Indien geen standaard uitkeringsvorm is opgenomen wordt het
      beleggingsbeleid gebaseerd op een vastgestelde uitkering.

      3 Zo nodig in afwijking van het tweede lid wordt de uitvoering van het beleggingsbeleid afgestemd op de
      uitkeringsvorm waarvan is gebleken dat de deelnemer of gewezen deelnemer daarvoor een voorkeur heeft. De uitvoerder
      vraagt de deelnemer of gewezen deelnemer naar diens voorkeur voor een vastgestelde of variabele uitkering, zodra
      dit voor de beleggingen relevant is. De uitvoerder verstrekt daarbij de voor de deelnemer of gewezen deelnemer
      relevante informatie over de gevolgen en risico’s.

      4 Bij de uitvoering van het beleggingsbeleid in de uitkeringsfase vergroot de uitvoerder het beleggingsrisico niet
      tenzij sprake is van een wijziging van de risicohouding of een gewijzigd risicoprofiel dat aanleiding is voor een
      wijziging van het beleggingsprofiel.

      5 Het risicoprofiel van de deelnemer, gewezen deelnemer of pensioengerechtigde geeft de mate weer waarin hij
      beleggingsrisico kan en wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar en indien een
      belangrijke gebeurtenis daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14d
  - number: 14da
    text: |-
      1 De verplichting om de voorkeur van een gewezen deelnemer voor een vaste of variabele uitkering uit
      te vragen, bedoeld in [artikel 14d, derde lid][ref1], geldt niet indien op basis van de opgebouwde
      aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere
      ingangsdatum minder zal bedragen dan het op basis van [artikel 66 van de Pensioenwet][ref2] dan wel
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref3] bepaalde bedrag, en voldaan is aan het tweede,
      derde, vierde of vijfde lid.

      2 Indien de deelneming is geëindigd vanaf 1 januari 2018 geldt de verplichting niet,
      indien de uitvoerder op grond van [artikel 70a van de Pensioenwet][ref4] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref5] probeert over te gaan tot waardeoverdracht van de
      aanspraken van de gewezen deelnemer of dit tenminste vijf maal jaarlijks tevergeefs heeft geprobeerd.

      3 Indien de deelneming is geëindigd voor 1 januari 2018 geldt de verplichting niet tot de start van de uitvoering
      van het plan, bedoeld in [artikel 17f, tweede lid][ref6], indien de uitvoerder voornemens is voor de aanspraken van
      de gewezen deelnemer een opgave te vragen als bedoeld in artikel 17f, eerste lid, onderdeel a.

      4 Indien de deelneming is geëindigd voor 1 januari 2018 geldt de verplichting niet vanaf de start van de uitvoering
      van het plan, indien waardeoverdracht van de aanspraken van de gewezen deelnemer is opgenomen in het plan.

      5 Het tweede, derde en vierde lid zijn van overeenkomstige toepassing indien de verwerving van pensioen is
      geëindigd om andere redenen dan beëindiging van de deelneming.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel14d
