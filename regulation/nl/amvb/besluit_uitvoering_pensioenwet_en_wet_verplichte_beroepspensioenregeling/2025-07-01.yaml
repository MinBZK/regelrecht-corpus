  - number: '38'
    text: |-
      1 De Stichting Autoriteit Financiële Markten en De Nederlandsche Bank maken afspraken over:

      a. de uitwisseling van gegevens en inlichtingen, bedoeld in [artikel 205 van de Pensioenwet][ref1] en
      [artikel 199 van de Wet verplichte beroepspensioenregeling][ref2];

      b. de afstemming van beleidsregels, met name over de inzet van handhavinginstrumenten;

      c. de wijze waarop en het moment wanneer informatie over de toepassing van een handhavinginstrument wordt
      uitgewisseld;

      d. het overnemen van elkaars oordeel.

      2 De afspraken, bedoeld in het eerste lid, worden schriftelijk vastgelegd en zijn openbaar. De afspraken worden ter
      kennisneming gezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel205
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel199
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '205'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '199'
  - number: '39'
    text: |-
      1 De toezichthouder deelt Onze Minister schriftelijk mee welk bestuurslid dan wel directielid fungeert als
      aanspreekpunt voor Onze Minister.

      2 De toezichthouder stelt Onze Minister schriftelijk in kennis van wijzigingen in de samenstelling en taakverdeling
      binnen het bestuur of de directie.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel39
  - number: '40'
    text: |-
      1 De toezichthouder richt zijn organisatie zodanig in dat de uitvoering van het toezicht onafhankelijk kan
      plaatsvinden.

      2 De toezichthouder beschikt over een beleid met betrekking tot het vervullen van nevenbetrekkingen. Dit beleid
      richt zich op het voorkomen van nevenbetrekkingen die ongewenst zijn met het oog op een goede vervulling van de
      functie of de handhaving van de onafhankelijkheid.

      3 De toezichthouder besteedt de oordeelsvorming en de toepassing van handhavinginstrumenten niet uit.

      4 De toezichthouder beschikt over een beschrijving van de administratieve organisatie en over een systeem van
      periodieke interne controle.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel40
  - number: 40a
    text: |-
      1 De gegevens van fondsen die door de Nederlandsche Bank op grond
      van [artikel 204, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 198, derde lid, van de Wet verplichte beroepspensioenregeling][ref2], kunnen worden gepubliceerd, hebben
      betrekking op

      a. de beleidsdekkingsgraad;

      b. de reële dekkingsgraad;

      c. het vereist eigen vermogen;

      d. het belegd vermogen;

      e. kwartaalrendementen, waarbij is aangegeven wat het aandeel daarin is van de renteafdekking;

      f. de premie;

      g. het aantal deelnemers, gewezen deelnemers en pensioengerechtigden;

      h. de toeslagverlening;

      i. de vermindering van pensioenaanspraken en pensioenrechten;

      j. de uitvoeringskosten, bedoeld in [artikel 9b, eerste lid, onderdeel a][ref3];

      k. de technische voorzieningen;

      l. het percentage renteafdekking; en

      m. het percentage zakelijke waarden.

      2 De publicatie van de gegevens, bedoeld in het eerste lid, geschiedt niet eerder dan nadat tien werkdagen zijn
      verstreken na de dag waarop aan het fonds het besluit tot publicatie bekend is gemaakt.

      3 Bij periodieke publicatie van de gegevens, bedoeld in het eerste lid, wordt jaarlijks aan het fonds, voorafgaand
      aan de eerste publicatie in dat jaar, het besluit tot publicatie bekend gemaakt, waarbij vermeld wordt op welke
      data de gegevens in dat jaar gepubliceerd zullen worden.

      4 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref4], wordt de publicatie opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel204
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel881
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel40a
