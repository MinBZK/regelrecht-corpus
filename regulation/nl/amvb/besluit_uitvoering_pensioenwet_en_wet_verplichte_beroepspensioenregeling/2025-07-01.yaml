  - number: '23'
    text: |-
      1 De ontvangende uitvoerder stelt de overdragende uitvoerder terstond in kennis van de ontvangst van het verzoek
      tot waardeoverdracht.

      2 Het risico dat betrekking heeft op de over te dragen aanspraken, komt met ingang van de datum van het verzoek van
      de rechthebbende, bedoeld in [artikel 21, eerste lid][ref1], voor rekening van de ontvangende uitvoerder.

      3 De overdrachtswaarde wordt binnen tien werkdagen na ontvangst van het verzoek tot waardeoverdracht door de
      overdragende uitvoerder aan de ontvangende uitvoerder betaald.

      4 De overdragende uitvoerder is rente verschuldigd aan de ontvangende uitvoerder over de overdrachtswaarde
      over de periode tussen de overdrachtsdatum en de datum waarop de overdrachtswaarde wordt betaald, tenzij
      het de waardeoverdracht betreft van een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      naar een andere premieovereenkomst of premieregeling waarbij de premie wordt belegd. Bij overdracht van een
      premieovereenkomst of premieregeling waarbij de premie wordt belegd naar een kapitaal- of uitkeringsovereenkomst of
      een kapitaal- of uitkeringsregeling wordt de rente geacht in de overdrachtswaarde begrepen te zijn. Onze Minister
      stelt regels over de berekening van de rente.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel23
