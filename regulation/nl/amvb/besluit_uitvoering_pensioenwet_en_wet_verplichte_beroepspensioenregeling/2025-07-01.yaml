  - number: '30'
    text: |-
      1 De personen die het beleid van het fonds bepalen of mede bepalen voldoen aan de vereiste geschiktheid indien
      hun kwalificaties, kennis en ervaring, waaronder vaardigheden en professioneel gedrag, volstaan om een gezond en
      prudent bestuur van het fonds mogelijk te maken, met inachtneming van de samenstelling en het functioneren van
      het collectief.

      2 De personen die de interne auditfunctie of actuariële functie vervullen voldoen aan de vereiste geschiktheid
      indien hun beroepskwalificaties, beroepskennis en beroepservaring volstaan om de functie naar behoren te vervullen.

      3 De personen die de risicobeheerfunctie vervullen voldoen aan de vereiste geschiktheid, indien hun kwalificaties,
      kennis en ervaring volstaan om de functie naar behoren te vervullen.
