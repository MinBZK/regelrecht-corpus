      1 De uitvoering van het nettopensioen door een fonds voldoet aan de volgende voorwaarden:

      a. het beleggingsbeleid en de verwerking van financiële mee- of tegenvallers in de netto pensioenregeling is
      administratief gescheiden van de bruto basispensioenregeling, waarbij geen vermenging van geldstromen optreedt;

      b. in de solidariteitsreserve of risicodelingsreserve is geen vermenging van middelen voor het nettopensioen met de
      andere middelen in de reserve;

      c. indien bij ouderdomspensioen of nabestaandenpensioen op opbouwbasis het kapitaal voortvloeiend uit de premies
      vanaf de pensioendatum wordt gebruikt voor financiering van een variabele uitkering varieert deze door verwerking
      van de ontwikkeling van het sterfteresultaat en de ontwikkeling van de levensverwachting waarvoor uitsluitend
      rekening wordt gehouden met het sterfteresultaat en de levensverwachting van de groep deelnemers aan het
      nettopensioen;

      d. indien bij ouderdomspensioen of nabestaandenpensioen op opbouwbasis het kapitaal voortvloeiend uit de premies
      vanaf de pensioendatum wordt gebruikt voor financiering van een vaste uitkering:

      1°. wordt een tarief gehanteerd dat tenminste dekkingsgraad neutraal is;

      2°. wordt uitsluitend rekening gehouden met de levensverwachting van de groep deelnemers aan het nettopensioen; en

      3°. is voor het nettopensioen sprake van voorwaardelijke toeslagverlening;

      e. indien sprake is van voorwaardelijke toeslagverlening bij nettopensioen en:

      1°. de verplichtingen van het fonds ten aanzien van het nettopensioen toenemen als gevolg van een verschil
      in de stijging van de levensverwachting tussen de deelnemers aan het nettopensioen en de deelnemers aan de
      basispensioenregeling, vermindert het fonds de voorwaardelijke toeslagverlening bij het nettopensioen totdat deze
      toename van de verplichtingen bij het nettopensioen is gecompenseerd; of

      2°. het fonds een incidentele bijstorting ontvangt van de werkgever vermindert het fonds de voorwaardelijke
      toeslagverlening bij het nettopensioen, voor zover deze storting ten goede is gekomen aan het nettopensioen;

      f. in geval van een nabestaandenpensioen op risicobasis of een premievrijstelling in verband met
      arbeidsongeschiktheid stelt het fonds de hierop betrekking hebbende premie vast rekening houdend met de kenmerken
      van de groep deelnemers aan het nettopensioen;

      g. het fonds rekent de kosten behorend bij het nettopensioen apart toe;

      h. het fonds houdt voor het nettopensioen een gescheiden administratie bij, waaruit ten minste blijken:

      1°. de voor het nettopensioen ingelegde premies;

      2°. de met de beschikbaar gestelde premies behaalde rendementen;

      3°. de waarde van de pensioenverplichtingen;

      4°. de middelen voor nettopensioen in de solidariteitsreserve of risicodelingsreserve;

      5°. de actuariële gegevens over de groep deelnemers aan het nettopensioen die ten grondslag liggen aan de premie
      en aan de waardering van de pensioenverplichtingen, waaronder de geschatte levensverwachting en risico’s op
      arbeidsongeschiktheid en vooroverlijden; en

      6°. de toeslagverlening en de toepassing van onderdeel e.

      2 Voor de toepassing van het eerste lid, onderdeel d, onder 1° wordt het dekkingsgraadneutraal tarief gebaseerd
      op de dekkingsgraad van het fonds, wordt de risicovrije rente gehanteerd en wordt rekening gehouden met
      tariefgrondslagen passend bij de groep deelnemers aan het nettopensioen.

      3 Het eerste lid is niet van toepassing voor zover het ouderdomspensioen, nabestaandenpensioen of
      premievrijstelling bij arbeidsongeschiktheid is verzekerd bij een verzekeraar.
