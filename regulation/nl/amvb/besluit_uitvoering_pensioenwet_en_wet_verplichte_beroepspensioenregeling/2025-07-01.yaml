  - number: '48'
    text: |-
      1 De toezichthouder stelt een bestuurlijke boete in de tweede of derde categorie vast
      op het basisbedrag, bedoeld in [artikel 179, tweede lid, van de Pensioenwet][ref1] en
      [artikel 174, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2].

      2 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de ernst of duur van de
      overtreding een dergelijke verlaging of verhoging rechtvaardigt.

      3 De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de mate van
      verwijtbaarheid van de overtreder een dergelijke verlaging of verhoging rechtvaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel174
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel48
    references:
