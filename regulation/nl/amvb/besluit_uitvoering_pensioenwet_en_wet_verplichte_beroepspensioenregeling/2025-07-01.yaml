  - number: 46b
    text: |-
      1 De toezichthouder beoordeelt het voornemen tot waardeoverdracht,
      bedoeld in [artikel 150m, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 145l, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] op de volgende aspecten:

      a. het besluitvormingsproces;

      b. financiële en andere risico’s;

      c. de financiële effecten;

      d. de collectieve actuariële gelijkwaardigheid; en

      e. de evenwichtige belangenafweging door het fonds.

      2 Het fonds verstrekt het verantwoordingsorgaan of het belanghebbendenorgaan ten behoeve van de advisering,
      dan wel goedkeuring, bedoeld in [artikel 150m, vierde en zesde lid, van de Pensioenwet][ref3] dan wel
      [artikel 145l, vierde en zesde lid, van de Wet verplichte beroepspensioenregeling][ref4], in ieder geval de
      volgende gegevens:

      a. het voorgenomen besluit tot collectieve waardeoverdracht, waarbij ten minste wordt ingegaan op de volgende
      onderwerpen:

      1°. indien van toepassing, de onderbouwing van het toepassen van de vba-methode voor de waardering van de
      pensioenaanspraken en pensioenrechten en het aanwenden van het vermogen;

      2°. hoe invulling wordt gegeven aan de keuzes die een fonds op grond van [artikel 150n van de Pensioenwet][ref5]
      dan wel [artikel 145m van de Wet verplichte beroepspensioenregeling][ref6] kan maken;

      3°. indien van toepassing: de hoogte van de initiële vulling van het compensatiedepot; en

      4°. indien van toepassing: de hoogte van de initiële vulling van de solidariteitsreserve of risicodelingsreserve;

      b. hoe zal worden omgegaan met arbeidsongeschiktheidspensioen, premievrije voortzetting en nabestaandenpensioen;

      c. informatie over het besluitvormingsproces;

      d. de kwantitatieve effecten van de collectieve waardeoverdracht;

      e. de overwegingen en afwegingen van het fonds bij het voorgenomen besluit en een motivering waarom de effecten
      evenwichtig worden geacht;

      f. de gewijzigde pensioenovereenkomst dan wel beroepspensioenregeling;

      g. de afspraken met betrekking tot compensatie; en

      h. de transitie-effecten van de totale transitie in termen van netto profijt per leeftijdscohort in hele
      geboortejaren en in termen van de pensioenverwachting per leeftijdscohort in hele geboortejaren die, voor zover
      het ouderdomspensioen betreft, wordt weergegeven op basis van een pessimistisch, verwacht en optimistisch scenario,
      waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en pensioengerechtigden.

      3 Indien van toepassing verstrekt het fonds aan de raad van toezicht of de visitatiecommissie de gegevens, bedoeld
      in het tweede lid, alsmede het advies van het verantwoordingsorgaan of de reactie op het verzoek tot goedkeuring
      van het belanghebbendenorgaan.


