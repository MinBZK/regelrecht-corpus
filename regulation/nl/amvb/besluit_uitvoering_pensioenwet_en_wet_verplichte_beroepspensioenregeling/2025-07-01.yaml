  - number: 14f
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *geschil:* een geschil ontstaan na de gehele of gedeeltelijke afwijzing van een klacht over de uitvoering van het
      pensioenreglement door de uitvoerder of een klacht als bedoeld in [artikel 14j, derde lid][ref1];
        - *klacht:* iedere uiting van ontevredenheid die door een deelnemer, gewezen deelnemer, andere aanspraakgerechtigde
      of pensioengerechtigde wordt gericht aan een uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel14j
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 14j
        hoofdstuk: 4b
  - number: 14g
    text: |-
      1 De uitvoerder stelt een algemene beschrijving van de klachtenprocedure beschikbaar aan de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden.

      2 De uitvoerder stelt aan alle personen die binnen de organisatie betrokken zijn bij de afhandeling van klachten
      een beschrijving beschikbaar van de te volgen procedure voor de afhandeling van die klachten.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14g
  - number: 14h
    text: |-
      1 De uitvoerder beschikt met het oog op een adequate behandeling van klachten over een behoorlijke administratie
      van klachten, waarin ten minste wordt vastgelegd:

      a. de naam en het adres van de klager;

      b. de klacht, met daarbij behorende dagtekening van ontvangst;

      c. een omschrijving van de klacht;

      d. een beschrijving van de wijze waarop zij de klacht heeft behandeld; en

      e. de datum waarop de klacht is afgesloten.

      2 De uitvoerder bewaart de gegevens, bedoeld in het eerste lid, gedurende een periode van ten minste zeven jaren na
      het boekjaar waarin de klacht door haar is afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14h
  - number: 14i
    text: |-
      De uitvoerder informeert de klager bij een gehele of een gedeeltelijke afwijzing van diens klacht over de
      uitvoering van het pensioenreglement over de mogelijkheid om dit geschil voor te leggen aan de op grond van
      [artikel 48c van de Pensioenwet][ref1] dan wel [artikel 59c van de Wet verplichte beroepspensioenregeling][ref2]
      aangewezen geschilleninstantie waarbij zij is aangesloten, onder vermelding van de adresgegevens en de geldende
      termijnen. Daarbij wordt tevens vermeld dat een geschil ook direct bij een burgerlijke rechter aanhangig kan worden
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel59c
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14i
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 48c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 59c
  - number: 14j
    text: |-
      1 De uitvoerder draagt er zorg voor dat klachten binnen een redelijke termijn worden afgehandeld.

      2 De uitvoerder bevestigt de ontvangst van de klacht en bericht de klager binnen twee weken na ontvangst van de
      klacht binnen welke termijn de klacht zal worden afgehandeld.

      3 De klager kan vanaf tien weken na ontvangst van de ontvangstbevestiging, bedoeld in het tweede lid, of twaalf
      weken na het indienen van de klacht, de klacht die betrekking heeft op de uitvoering van het pensioenreglement
      rechtstreeks voorleggen aan de geschilleninstantie waarbij de uitvoerder is aangesloten.

      4 Indien de uitvoerder voor de afwikkeling van de klacht nadere informatie nodig heeft van de klager, verzoekt zij
      deze informatie van de klager en geeft een termijn voor de beantwoording. De termijnen, bedoeld in het derde lid,
      worden verlengd met de termijn voor beantwoording, of met de termijn waarin de verzochte informatie is ontvangen
      door de uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14j
  - number: 14k
    text: |-
      De uitvoerder voorziet in procedures en maatregelen die waarborgen dat klachten zorgvuldig, verifieerbaar,
      consistent en binnen de gestelde termijnen worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14k
  - number: 14l
    text: |-
      1 De geschilleninstantie voldoet, in aanvulling op de uit de
      [Implementatiewet buitengerechtelijke geschillenbeslechting consumenten][ref1] voortvloeiende vereisten, aan de
      volgende vereisten:

      a. de bij die geschilleninstantie aangesloten uitvoerders vormen een groep van voldoende betekenis en
      veelsoortigheid of er kan aannemelijk gemaakt worden dat dit op korte termijn na erkenning het geval zal zijn;

      b. de geschilleninstantie draagt in voldoende mate bij tot het oplossen van geschillen die hun oorsprong vinden in
      klachten over uitvoering van pensioenregelingen; en

      c. de geschilleninstantie beschikt over een adequate financieringssystematiek en realiseert een adequate
      bezettingsgraad.

      2 Aan de aanwijzing van een geschilleninstantie kunnen door Onze Minister voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0036550
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14l
    references:
      - id: ref1
        bwb_id: BWBR0036550
  - number: 14m
    text: |-
      1 De geschilleninstantie heeft een onafhankelijk en naar behoren samengesteld bestuur.

      2 De onafhankelijkheid van het bestuur vereist ten minste dat de leden vanaf de aanvaarding van hun functie en
      gedurende een jaar voorafgaande aan de aanvaarding van hun functie niet werkzaam zijn of zijn geweest voor of enige
      functie bekleden of bekleed hebben bij een uitvoerder of een belangenvereniging voor uitvoerders.

      3 De bij de benoeming van bestuursleden te volgen procedure is schriftelijk vastgelegd. De procedure wordt ter
      goedkeuring aan Onze Minister voorgelegd.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14m
  - number: 14n
    text: |-
      1 De geschilleninstantie draagt er zorg voor dat de met buitengerechtelijke geschillenbeslechting belaste
      personen vanaf de aanvaarding van hun functie en gedurende een jaar voorafgaande aan de aanvaarding van hun
      functie niet werkzaam zijn of zijn geweest voor of enige functie bekleden of bekleed hebben bij een uitvoerder of
      belangenvereniging voor uitvoerders.

      2 De bij de benoeming van een persoon, bedoeld in het eerste lid, te volgen procedure is schriftelijk vastgelegd.
      De procedure behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14n
  - number: 14o
    text: |-
      1 De geschilleninstantie beschikt over en handelt in overeenstemming met een reglement voor de behandeling van
      geschillen dat ten minste omvat:

      a. een duidelijke omschrijving van de geschillen die ter behandeling aan de geschilleninstantie kunnen worden
      voorgelegd;

      b. regels met betrekking tot het aanhangig maken van een geschil en een duidelijke omschrijving van de partijen die
      een geschil aanhangig kunnen maken;

      c. regels met betrekking tot wraking van een met buitengerechtelijke geschillenbeslechting belaste persoon,
      op grond van feiten of omstandigheden die een onpartijdig of onafhankelijk oordeel van die persoon zouden
      bemoeilijken;

      d. regels met betrekking tot de behandeling van een geschil door de geschilleninstantie waaronder de toepasselijke
      behandeltermijnen;

      e. regels met betrekking tot het op voet van gelijkheid bieden van gelegenheid aan partijen om mondeling en
      schriftelijk, desgewenst met bijstand van derden, hun mening aan de geschilleninstantie kenbaar te maken;

      f. regels met betrekking tot de voorwaarden waaronder een deskundige kan worden verzocht een advies uit te brengen;

      g. regels met betrekking tot de voorwaarden waaronder getuigen en deskundigen kunnen worden gehoord, dan wel
      inlichtingen van hen kunnen worden ingewonnen;

      h. regels met betrekking tot de mogelijkheid voor partijen om van alle door hen naar voren gebrachte feiten
      en stellingen, alsmede van verklaringen van getuigen en deskundigen, over en weer kennis te nemen en daarop te
      reageren;

      i. regels met betrekking tot de voorwaarden waaronder een geschil door middel van een verkorte schriftelijke
      procedure of een voorlopig oordeel kan worden afgedaan;

      j. regels op grond waarvan de geschilleninstantie haar beslissingen baseert;

      k. regels met betrekking tot de mogelijkheid dat de beslechting van een geschil resulteert in een niet-bindend
      advies;

      l. regels met betrekking tot een bindend advies, waarbij een uitvoerder bij de aansluiting bij de
      geschilleninstantie instemt met bindend advies en waarbij de beslechting van een geschil resulteert in een
      bindend advies, tenzij de deelnemer, gewezen deelnemer, andere aanspraakgerechtigde of pensioengerechtigde bij het
      aanhangig maken van het geschil daar uitdrukkelijk niet mee instemt;

      m. regels met betrekking tot de vaststelling van de hoogte van het bedrag dat, zo dit verschuldigd is, bij het
      aanhangig maken van het geschil dient te worden voldaan;

      n. regels met betrekking tot de mogelijkheid om partijen in de kosten van de behandeling van een geschil te
      veroordelen en vaststelling van een hierbij geldend maximumbedrag;

      o. regels met betrekking tot de vorm, inhoud en bekendmaking van de uitkomst van het advies, bedoeld in de
      onderdelen k en l, waarbij in ieder geval is bepaald dat deze uitkomst, met redenen omkleed, ondertekend en
      schriftelijk of elektronisch aan partijen wordt medegedeeld; en

      p. indien beroep tegen een uitspraak mogelijk is: regels met betrekking tot het mededelen van de mogelijkheid van
      beroep, de wijze en termijn van het instellen, alsmede de behandeling van dit beroep.

      2 De geschilleninstantie houdt het reglement, bedoeld in het eerste lid, beschikbaar en verstrekt het kosteloos op
      verzoek aan iedere belanghebbende.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14o
  - number: 14p
    text: |-
      Het reglement, de samenstelling van het bestuur en de voorzitters van organen belast met buitengerechtelijke
      geschillenbeslechting behoeven de goedkeuring van Onze Minister. Een geschilleninstantie kan voorgenomen
      wijzigingen in de samenstelling van het bestuur, de voorzitters van organen belast met buitengerechtelijke
      geschillenbeslechting of het reglement, bedoeld in [artikel 14o][ref1], niet doorvoeren dan na instemming van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel14o
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14p
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 14o
        hoofdstuk: 4c
  - number: 14q
    text: |-
      Een erkende geschilleninstantie stelt aan een uitvoerder die zich bij haar wil aansluiten niet als voorwaarde voor
      aansluiting dat de uitvoerder andere regels naleeft dan die welke betrekking hebben op het aanhangig maken van een
      geschil bij de geschilleninstantie of de verdere behandeling van een geschil door de geschilleninstantie.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14q
  - number: 14r
    text: |-
      Een geschilleninstantie publiceert de bindende adviezen, bedoeld in [artikel 14o, eerste lid, onderdeel l][ref1],
      en houdt deze elektronisch beschikbaar en algemeen toegankelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel14o
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14r
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 14o
        hoofdstuk: 4c
  - number: 14s
    text: |-
      1 Een geschilleninstantie verstrekt aan Onze Minister jaarlijks voor 1 juli een opgave van de in het afgelopen
      kalenderjaar bij de geschilleninstantie aangesloten uitvoerders.

      2 Een geschilleninstantie verstrekt aan Onze Minister op diens verzoek de gegevens en inlichtingen die Onze
      Minister nodig heeft voor de uitoefening van diens in dit hoofdstuk omschreven taken.

      3 Een geschilleninstantie verstrekt de toezichthouders de gegevens en inlichtingen die zij nodig hebben voor de
      uitoefening van hun taken.

      4 Een geschilleninstantie stelt jaarlijks een begroting op en zendt deze voor 1 december van het aan het
      begrotingsjaar voorafgaande jaar ter instemming aan Onze Minister.

      5 Een geschilleninstantie stelt jaarlijks een bestuursverslag en een jaarrekening op. De jaarrekening gaat
      vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door de geschilleninstantie aangewezen
      accountant.

      6 Een geschilleninstantie zendt de jaarrekening voor 1 mei van het op het boekjaar volgende jaar ter instemming aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14s
  - number: 14t
    text: |-
      1 De uitvoerder die verantwoordelijk is voor de beleggingen legt de risicohouding vast waarop het beleggingsbeleid
      of de toedelingsregels zijn gebaseerd. De risicohouding wordt per leeftijdscohort vastgelegd.

      2 Een fonds stelt de risicohouding vast na overleg met de organen van het fonds. Een verzekeraar of
      premiepensioeninstelling streeft ernaar van de deelnemers, gewezen deelnemers, pensioengerechtigden of hun
      vertegenwoordigers zo veel mogelijk duidelijkheid te krijgen over hun doelstellingen en risicohouding.

      3 Het vaststellen van de risicohouding wordt gebaseerd op in ieder geval de uitkomsten van het risicopreferentie-
      onderzoek, deelnemerskenmerken en wetenschappelijke inzichten. De uitvoerder onderbouwt hoe en in welke mate deze
      elementen hebben bijgedragen aan de risicohouding.

      4 Bij het vaststellen van de risicohouding en het beleggingsbeleid voor deelnemers of gewezen deelnemers wordt
      voor ieder leeftijdscohort rekening gehouden met de duur van de periode tot aan de pensioendatum, waarbij het
      beleggingsrisico kleiner wordt naarmate de pensioendatum nadert.

      5 Een leeftijdscohort heeft een maximale omvang van vijf geboortejaren. In afwijking hiervan kan een
      leeftijdscohort betrekking hebben op een groter aantal geboortejaren indien de uitvoerder op basis van het
      risicopreferentie-onderzoek, de deelnemerskenmerken en wetenschappelijke inzichten onderbouwt dat dit in het belang
      is van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden of pensioengerechtigden.

      6 De vaststelling en toetsing van de risicohouding vindt plaats in vier fasen:

      a. het risicopreferentie-onderzoek;

      b. de weging van de informatie uit de bronnen risicopreferentie-onderzoek, deelnemerskenmerken en wetenschappelijke
      inzichten om tot vaststelling van de risicohouding te komen;

      c. de vormgeving van het beleggingsbeleid of toedelingsregels op basis van de vastgestelde risicohouding door een
      ALM analyse; en

      d. jaarlijkse toetsing op basis van een scenario-analyse of het beleggingsbeleid of de toedelingsregels passend
      zijn bij de vastgestelde risicohouding en aanpassing van het beleggingsbeleid of de toedelingsregels indien dat
      niet het geval is.
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14t
  - number: 14u
    text: |-
      1 De vastgestelde risicohouding per leeftijdscohort wordt vertaald naar de volgende maatstaven waarvoor gebruik
      wordt gemaakt van een scenario-analyse:

      a. de risicomaatstaf: de maximaal aanvaardbare afwijking van de, naar overlevingskans gewogen, gemiddelde over de
      uitkeringsjaren reële pensioenuitkeringen in een pessimistisch scenario ten opzichte van de, naar overlevingskans
      gewogen, gemiddelde reële pensioenuitkeringen in een mediaan scenario waarbij het in de opbouwfase gaat om een
      gewogen gemiddelde van alle ouderdomspensioenuitkeringen in de uitkeringsfase en in de uitkeringsfase om de
      afwijking van ouderdomspensioenuitkeringen van jaar op jaar;

      b. de verwachtingsmaatstaf: de minimale verwachting voor de, naar overlevingskans gewogen, gemiddelde
      over de uitkeringsjaren reële pensioenuitkeringen in een mediaan scenario ten opzichte van de, naar
      overlevingskans gewogen, gemiddelde reële pensioenuitkeringen in een mediaan scenario op basis van
      een hypothetisch geheel risicomijdend beleggingsbeleid waarbij de verwachte uitkeringsstroom het
      inflatierisico door middel van reële obligaties afdekt binnen de uniforme scenariosets, bedoeld in
      [artikel 23b van het Besluit financieel toetsingskader pensioenfondsen][ref1]; en

      c. de lange termijn risicomaatstaf in de uitkeringsfase: bij mechanismen die risico naar de toekomst verplaatsen,
      zoals een aangepast projectierendement of spreiding van schokken, de maximaal aanvaardbare afwijking van de, naar
      overlevingskans gewogen, gemiddelde over de uitkeringsjaren reële pensioenuitkeringen in een pessimistisch scenario
      ten opzichte van de, naar overlevingskans gewogen, gemiddelde reële pensioenuitkeringen in een mediaan scenario,
      waarbij het in de teller en de noemer van de maatstaf gaat om een gewogen gemiddelde van alle resterende reële
      ouderdomspensioenuitkeringen in de uitkeringsfase.

      2 Voor zover fondsen een beëindigde uitkeringsovereenkomst, zoals gedefinieerd in
      [artikel 1 van de Pensioenwet][ref2] dan wel een beëindigde uitkeringsregeling, zoals gedefinieerd in
      [artikel 1, eerste lid, van de Wet verplichte beroepspensioenregeling][ref3], zoals die artikelen luidden op de dag
      voor de datum van inwerkingtreding van de [Wet toekomst pensioenen][ref4], of vastgestelde uitkeringen uitvoeren
      voldoet de risicohouding aan de prudent person regel en komt deze voor de lange termijn tot uitdrukking in de door
      het fonds gekozen ondergrenzen in het kader van de haalbaarheidstoets en voor de korte termijn in de hoogte van het
      vereist eigen vermogen of een bandbreedte hiervoor.

      3 Onze Minister stelt regels voor de vaststelling van de maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23b
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020892/2025-07-01#Artikel14u
