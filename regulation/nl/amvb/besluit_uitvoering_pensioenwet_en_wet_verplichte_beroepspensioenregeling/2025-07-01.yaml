      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon
      als bedoeld in [artikel 106, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 110c, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] buiten twijfel staat op basis van
      diens voornemens, handelingen en antecedenten.


