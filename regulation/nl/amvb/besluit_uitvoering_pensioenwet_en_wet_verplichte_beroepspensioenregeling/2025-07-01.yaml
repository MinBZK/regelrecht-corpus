  - number: 46c
    text: |-
      1 Bij de vba-methode, bedoeld in de [artikelen 150n van de Pensioenwet][ref1] dan wel
      [145m van de Wet verplichte beroepspensioenregeling][ref2] en bij het berekenen van transitie-effecten als bedoeld
      in [150e van de Pensioenwet][ref3] dan wel [145d van de Wet verplichte beroepspensioenregeling][ref4], wordt
      gebruik gemaakt van de value based ALM-rekenmethodiek.

      2 Bij de vba-rekenmethodiek geldt voor de berekeningen het volgende:

      a. bij de analyse wordt gebruik gemaakt van minimaal 20.000 risico-neutrale scenario’s als bedoeld in
      [artikel 43][ref5];

      b. de duur van de gehele prognosehorizon is zoals vastgesteld in de risico-neutrale scenario’s, bedoeld in
      [artikel 43][ref6]; en

      c. voor de demografische ontwikkeling binnen de uitvoerder wordt over de gehele prognosehorizon een realistische
      aanname gehanteerd.

      3 Bij de vba-rekenmethodiek geldt voor de berekeningen door een fonds het vastgestelde fondsbeleid. Bij de
      vaststelling van het fondsbeleid geldt het volgende:

      a. bij de waardering van de opgebouwde pensioenaanspraken en pensioenrechten sluit het fonds aan bij het op
      30 juni 2022 in de actuariële en bedrijfstechnische nota, bedoeld in [artikel 145 van de Pensioenwet][ref7] dan
      wel [artikel 140 van de Wet verplichte beroepspensioenregeling][ref8], vastgelegde beleidskader en vastgelegde
      financiële toezichtskaderbeleid;

      b. bij de waardering van de pensioenaanspraken en pensioenrechten voor de solidaire premieovereenkomst dan wel
      solidaire premieregeling, of flexibele premieovereenkomst dan wel flexibele premieregeling sluit het fonds aan bij
      de onderdelen zoals in de opdrachtbevestiging, bedoeld in [artikel 28d][ref9], is vastgelegd of het fonds van plan
      is vast te leggen;

      c. voor zover sprake is van incomplete beleidsonderdelen voor de uitvoering van de volledige prognosehorizon worden
      realistische aannames gehanteerd;

      d. een fonds kan voor de uitvoering van de volledige prognosehorizon afwijken van het fondsbeleid, zoals vastgelegd
      in de actuariële en bedrijfstechnische nota of in de opdrachtbevestiging, waarbij dit uitsluitend mogelijk is
      indien dit leidt tot een realistischere invulling op langere termijn;

      e. bij de volledige prognosehorizon wordt verondersteld dat de status van deelnemer of gewezen deelnemer niet
      wijzigt tot aan de pensioendatum voor zover de toeslagverlening voor deelnemers en gewezen deelnemers verschillend
      is; en

      f. te allen tijde wordt voldaan aan de huidige wet- en regelgeving.

      4 Voor zover een uitvoerder bij de berekening gebruik maakt van maatmensen leidt deze vereenvoudiging niet tot
      materiële afwijkingen in de berekening van de marktwaarden van de te verwachte pensioenuitkeringen van deelnemers,
      gewezen deelnemers en andere aanspraakgerechtigden.

      5 De uitvoerder onderbouwt de aannames, vereenvoudigingen en, voor zover van toepassing, de afwijking van het
      fondsbeleid op adequate wijze en neemt dit op in het implementatieplan.


