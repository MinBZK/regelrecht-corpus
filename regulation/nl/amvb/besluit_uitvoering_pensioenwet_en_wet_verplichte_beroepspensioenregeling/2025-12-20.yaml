        artikel: 55a
  - number: 7d.1
    text: |-
      Bij de informatieverstrekking, bedoeld in de [artikelen 44a][ref1] en [63b van de Pensioenwet][ref2] dan wel de
      [artikelen 55a][ref3] en [75b van de Wet verplichte beroepspensioenregeling][ref4], wordt gebruikt gemaakt van
