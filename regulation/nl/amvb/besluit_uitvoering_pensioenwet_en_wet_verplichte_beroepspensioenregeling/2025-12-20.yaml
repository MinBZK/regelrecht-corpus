  - number: 7c.1.a
    text: een uitvoerder die één uniform beleggingsprofiel hanteert, vermeldt dit;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7c
  - number: 7c.1.b
    text: |-
      een uitvoerder die meerdere beleggingsprofielen hanteert of die een uitkering aanbiedt bestaande uit een
      vastgesteld en een variabel gedeelte, baseert de opgave van de hoogte van de variabele uitkering of de verhouding
      tussen het vastgestelde en variabele gedeelte op het beleggingsprofiel dat passend is gezien het risicoprofiel van
      de deelnemer of gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7c
  - number: 7c.2
    text: |-
      De uitvoerder die een spreidingsperiode hanteert van meer dan vijf jaar neemt in de informatie
      die wordt verstrekt over een variabele uitkering, bedoeld in [artikel 44a, eerste lid][ref1], of
      [artikel 63b, tweede lid, van de Pensioenwet][ref2] dan wel [artikel 55a, eerste lid][ref3], of
      [artikel 75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4], de volgende tekst op: De
      ontwikkeling van uw pensioen hangt onder meer af van economische omstandigheden. Uw pensioen kan hierdoor omhoog
      of omlaag gaan. Wij spreiden financiële meevallers en tegenvallers over <x> jaar om grote schokken in de hoogte van
      uw pensioen te voorkomen. Bij langdurige tegenvallers en bij een spreidingsperiode van meer dan vijf jaar kan uw
      pensioen na verloop van tijd flink lager uitvallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel55a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel75b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7c
    references:
