      zijn van overeenkomstige toepassing op de individuele waardeoverdracht bij het shoprecht,
      bedoeld in [artikel 150l, zesde lid][ref6], en [artikel 80, van de Pensioenwet][ref7], dan wel
      [artikel 145k, zesde lid][ref8], en [artikel 88, van de Wet verplichte beroepspensioenregeling][ref9], met dien
      verstande dat:


