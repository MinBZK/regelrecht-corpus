  - number: '36.2'
    text: |-
      De Nederlandsche Bank houdt toezicht op de naleving van de regels, gesteld bij of krachtens de Pensioenwet en
      de Wet verplichte beroepspensioenregeling, met uitzondering van de regels genoemd in het eerste lid en de regels
      gesteld bij of krachtens de artikelen 48c van de Pensioenwet en 59c van de Wet verplichte beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel36
  - number: '37'
    text: |-
      De Stichting Autoriteit Financiële Markten beschikt niet over de bevoegdheden, bedoeld in de
      [artikelen 172][ref1], [173][ref2] en [174 van de Pensioenwet][ref3] en de [artikelen 167][ref4], [168][ref5] en
      [169 van de Wet verplichte beroepspensioenregeling][ref6].


