  - number: 46e.2
    text: |-
      Het netto profijt effect van het financieel toetsingskader tijdens de transitie,
      bedoeld in [artikel 150p, vierde lid, van de Pensioenwet][ref1] dan wel in
      [artikel 145o, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2], wordt berekend door het netto
      profijt van het ongewijzigd voortzetten van de pensioenovereenkomst dan wel beroepspensioenregeling af te zetten
      tegen het netto profijt dat ontstaat door het indienen van een overbruggingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46e
    references:
