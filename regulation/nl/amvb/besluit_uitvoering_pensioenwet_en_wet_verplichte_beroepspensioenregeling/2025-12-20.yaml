        bwb_id: BWBR0020809
        artikel: 150l
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145k
  - number: 46g.2
    text: Het fonds stelt de informatie, bedoeld in het eerste lid, op zijn website voor een ieder beschikbaar.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46g
  - number: '47.1'
    text: |-
      Het overbruggingsplan, bedoeld in [artikel 150p van de Pensioenwet][ref1] dan wel
      [artikel 145o van de Wet verplichte beroepspensioenregeling][ref2], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
