  - number: 47aa.2
    text: |-
      De overdragende uitvoerder keert de pensioenuitkeringen voortvloeiend uit de pensioenregeling van de overdragende
      uitvoerder tot de overdrachtsdatum aan de gepensioneerde uit. Het risico dat betrekking heeft op de over te
      dragen pensioenrechten, komt met ingang van de overdrachtsdatum, bedoeld in het eerste lid, voor rekening van de
      ontvangende uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47aa
  - number: 47b.1
    text: |-
      De [artikelen 1ca][ref1], [1cb][ref2] en [1cc][ref3] zijn van overeenkomstige toepassing voor personen
      die pensioengerechtigden zijn op het tijdstip dat de uitvoerder overgaat op uitvoering van een gewijzigde
      pensioenovereenkomst dat een solidaire premieovereenkomst dan wel solidaire premieregeling inhoudt
      waarbij de toedelingsregels om gelijke aanpassingen als bedoeld in de [artikelen 10a, vijfde lid][ref4],
      en [63a, achtste lid, van de Pensioenwet][ref5] dan wel de [artikelen 28a, vijfde lid][ref6], en
      [75a, achtste lid, van de Wet verplichte beroepspensioenregeling][ref7], met spreiden te realiseren
      van toepassing zijn en waarbij sprake is van een collectieve waardeoverdracht als bedoeld in
      [artikel 150m van de Pensioenwet][ref8] dan wel [artikel 145l van de Wet verplichte beroepspensioenregeling][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1cb
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel1cc
