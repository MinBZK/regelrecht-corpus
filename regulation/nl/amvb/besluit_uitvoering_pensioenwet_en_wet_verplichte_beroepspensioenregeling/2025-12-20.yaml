        artikel: 1ca
        hoofdstuk: 1a
  - number: 7a.2
    text: |-
      Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] verstrekt de uitvoerder degene die
      pensioengerechtigde wordt voorafgaand aan of bij de pensioeningang informatie. Hierbij geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 7a.2.a
    text: |-
      de uitvoerder vermeldt dat het voor pensioenuitkering bestemd vermogen vanaf pensioendatum bestaat uit een
      uitkeringsvermogen en een spreidingsvermogen en geeft daarbij informatie over gelijke aanpassingen met spreiden;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
  - number: 7a.2.b
    text: |-
      de uitvoerder vermeldt de gevolgen voor de hoogte van de pensioenuitkering op moment van ingang, waarbij deze
      informatie persoonlijk en concreet is;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
  - number: 7a.2.c
    text: |-
      de uitvoerder geeft concrete en persoonlijke informatie over het verloop van de pensioenuitkeringen en geeft
      daarbij aan of het pensioen waarschijnlijk zal dalen, stijgen of gelijk zal blijven; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
  - number: 7a.2.d
    text: |-
      de uitvoerder verstrekt informatie over de mogelijkheid om informatie, bedoeld in [artikel 9, zevende lid][ref1],
      bij de uitvoerder op te vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel9
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '9'
        hoofdstuk: '2'
  - number: 7b.1
    text: |-
      De opgave van zijn pensioenrecht, bedoeld in [artikel 44, eerste lid, onderdeel a, van de Pensioenwet][ref1]
      dan wel [artikel 55, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] heeft bij een
      variabele uitkering betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel55
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '55'
  - number: 7b.1.a
    text: de uitkering over het afgelopen jaar; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7b
  - number: 7b.1.b
    text: de uitkering voor het komende jaar.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7b
  - number: 7b.2
    text: |-
      Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
