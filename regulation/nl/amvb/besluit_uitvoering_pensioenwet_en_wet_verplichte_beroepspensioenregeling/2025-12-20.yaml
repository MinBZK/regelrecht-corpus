        artikel: 150r
      - id: ref5
        bwb_id: BWBR0018831
        artikel: 145q
  - number: 47a.2
    text: |-
      Het ontvangende fonds informeert de deelnemer over de opschorting van de plicht tot waardeoverdracht en de gevolgen
      daarvan als de plicht tot waardeoverdracht is opgeschort vanwege een van de omschreven situaties van opschorting in
      [artikel 150r van de Pensioenwet][ref1] of [artikel 145q van de Wet verplichte beroepspensioenregeling][ref2], na
      de datum dat het ontvangende fonds de gegevens, bedoeld in [artikel 20][ref3], aan de deelnemer heeft verstrekt of
      zodra de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150r
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145q
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150r
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145q
      - id: ref3
