        artikel: '1'
        hoofdstuk: '1'
  - number: 47a.4.b
    text: |-
      indien de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref1] of
      de ontvangende uitvoerder de gegevens, bedoeld in [artikel 20][ref2], aan de deelnemer heeft verstrekt voor de
      herleving van de plicht tot waardeoverdracht, vraagt het ontvangende fonds binnen drie maanden na herleving van de
      plicht tot waardeoverdracht aan het overdragende fonds een opgave als bedoeld in [artikel 18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
