        bwb_id: BWBR0020809
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110b
  - number: 46g.1
    text: |-
      Het fonds maakt uiterlijk voorafgaand aan de collectieve waardeoverdracht,
      bedoeld in [artikel 150l, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 145k, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2], inzichtelijk waarom het fonds het
      verzoek tot collectieve waardeoverdracht van de werkgever of de beroepspensioenvereniging niet afwijst door middel
      van een kwalitatieve duiding van het niet overgaan op een dergelijke collectieve waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150l
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145k
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46g
    references:
