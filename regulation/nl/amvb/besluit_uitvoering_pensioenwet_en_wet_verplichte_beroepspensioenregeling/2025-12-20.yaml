      de uitvoerder vermeldt dat het voor pensioenuitkering aan te wenden vermogen, genoemd in
      [artikel 5a, eerste, tweede en derde lid][ref1], vanaf pensioendatum bestaat uit een spreidingsvermogen en
      uitkeringsvermogen en geeft daarbij informatie over gelijke aanpassingen met spreiden; en


