      [artikel 78 tot en met 80a van de Wet verplichte beroepspensioenregeling][ref2], voor zover sprake is van een
      pensioenaanspraak onder de afkoopgrens of een fiscaal bovenmatige pensioenaanspraak;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel78
