        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      De informatie over de reglementair te bereiken pensioenaanspraken wordt overeenkomstig de [artikelen 5a][ref1] en
      [9, eerste en tweede lid][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel9
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 5a
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '9'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      De informatie over de beleggingsresultaten wordt verstrekt indien sprake is van een premieovereenkomst of
      premieregeling en heeft betrekking op de resultaten van de afgelopen vijf jaar of, indien de pensioenregeling
      minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is uitgevoerd door de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel8
  - number: '8.4'
    text: |-
      De informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en pensioengerechtigden
      worden gedragen wordt verstrekt indien sprake is van een premieovereenkomst of premieregeling en heeft betrekking
      op de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1], de kosten van vermogensbeheer,
      bedoeld in artikel 10a, tweede lid, en de transactiekosten, bedoeld in artikel 10a, derde lid, indien deze kosten
      van invloed zijn op de pensioenaanspraak of het pensioenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      De uitvoerder verstrekt de deelnemer, gewezen deelnemer of gewezen partner op verzoek in geval van een
      flexibele premieovereenkomst of premie-uitkeringsovereenkomst dan wel een flexibele premieregeling of premie-
      uitkeringsregeling een indicatie van het te bereiken voor periodieke uitkeringen aan te wenden kapitaal op de
      pensioendatum met de daarbij gehanteerde veronderstellingen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: '9.2'
    text: |-
      Bij de in het eerste lid bedoelde opgave wordt ten aanzien van nabestaandenpensioen aangegeven wat de consequenties
      zijn van de gekozen wijze van financieren.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: '9.3'
    text: |-
      Indien sprake is van een premieovereenkomst dan wel premieregeling waarbij de deelnemer of gewezen deelnemer
      tijdens de opbouwperiode de verantwoordelijkheid voor de beleggingen heeft overgenomen verstrekt de uitvoerder
      op verzoek van de deelnemer of gewezen deelnemer informatie over alle beleggingsmogelijkheden, de feitelijke
      beleggingsportefeuille, de risicopositie en de kosten in verband met de beleggingen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: '9.4'
    text: |-
      De uitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde op
      verzoek:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: 9.4.a
    text: |-
      informatie over het van toepassing zijn van een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref1]
      dan wel [artikel 166 van de Wet verplichte beroepspensioenregeling][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '166'
  - number: 9.4.b
    text: |-
      informatie over de aanstelling van een bewindvoerder als bedoeld in [artikel 173 van de Pensioenwet][ref1] dan wel
      [artikel 168 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '168'
  - number: '9.5'
    text: |-
      De uitvoerder verstrekt de deelnemer of gewezen deelnemer op verzoek informatie over de consequenties van
      uitruil als bedoeld in [artikel 60][ref1], [61][ref2], [61a][ref3] of [62 van de Pensioenwet][ref4] dan wel de
      [artikelen 72][ref5], [73][ref6], [73a][ref7], of [74 van de Wet verplichte beroepspensioenregeling][ref8] voor de
      deelnemer of gewezen deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61a
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel73a
      [ref8]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 61a
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '62'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '72'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '73'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: 73a
      - id: ref8
        bwb_id: BWBR0018831
        artikel: '74'
  - number: '9.6'
    text: |-
      De uitvoerder verstrekt op verzoek van de deelnemer, gewezen deelnemer of pensioengerechtigde informatie over
      de resultaten die de beleggingen van de pensioenregeling ten minste de afgelopen vijf jaar hebben behaald of,
      indien de pensioenregeling minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is
      uitgevoerd door de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: '9.7'
    text: |-
      Voor zover sprake is van gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] verstrekt de
      uitvoerder op verzoek van de pensioengerechtigde in ieder geval informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 9.7.a
    text: |-
      de reeds verwerkte en toebedeelde financiële resultaten in het voor pensioenuitkering bestemd vermogen in de
      afgelopen vijf jaar tenzij de spreidingsperiode langer is dan geldt die periode;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: 9.7.b
    text: |-
      hoe de pensioenuitkeringen als gevolg van het verwerkte en toebedeelde financiële resultaten zijn aangepast in de
      afgelopen vijf jaar tenzij de spreidingsperiode langer is, dan geldt die periode;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: 9.7.c
    text: de hoogte van het uitkeringsvermogen en spreidingsvermogen in het jaar van het verzoek; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: 9.7.d
    text: het verloop van de toekomstige pensioenuitkeringen gedurende de spreidingsperiode.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9
  - number: 9a.1
    text: De titel van het uniform pensioenoverzicht bevat het woord «pensioenoverzicht».
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9a.2
    text: |-
      Het uniform pensioenoverzicht bevat naast de informatie, bedoeld in de [artikelen 38, eerste lid][ref1],
      [40, eerste lid][ref2], [42, eerste lid][ref3], [44, eerste lid][ref4], en
      [48, vijfde lid, tweede zin, van de Pensioenwet][ref5] dan wel de [artikelen 49, eerste lid][ref6],
      [51, eerste lid][ref7], [53, eerste lid][ref8], [55, eerste lid][ref9], en
      [59, vijfde lid, tweede zin, van de Wet verplichte beroepspensioenregeling][ref10] in ieder geval het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel51
      [ref8]: https://wetten.overheid.nl/BWBR0018831#Artikel53
      [ref9]: https://wetten.overheid.nl/BWBR0018831#Artikel55
      [ref10]: https://wetten.overheid.nl/BWBR0018831#Artikel59
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '44'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '49'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: '51'
      - id: ref8
        bwb_id: BWBR0018831
        artikel: '53'
      - id: ref9
        bwb_id: BWBR0018831
        artikel: '55'
      - id: ref10
        bwb_id: BWBR0018831
        artikel: '59'
  - number: 9a.2.a
    text: de persoonsgegevens van de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9a.2.b
    text: de naam en het contactadres van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9a.2.c
    text: het soort pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9a.2.d
    text: de datum waarop de informatie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9a.3
    text: |-
      Op het uniform pensioenoverzicht wordt elke wezenlijke wijziging ten opzichte van het uniform pensioenoverzicht van
      het voorgaande jaar duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9a
  - number: 9b.1
    text: |-
      De verdere informatie over de pensioenregeling, bedoeld in
      [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 57a, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2], betreft in ieder geval
      informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.1.a
    text: |-
      het vervallen van een pensioenaanspraak als bedoeld in [artikel 55, vijfde lid, van de Pensioenwet][ref1] dan wel
      [artikel 66, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '66'
  - number: 9b.1.b
    text: |-
      het beleid van de uitvoerder ten aanzien van waardeoverdracht als bedoeld in [artikel 70a van de Pensioenwet][ref1]
      dan wel [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2], en de daarbij toe te passen procedure;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 81a
  - number: 9b.1.c
    text: |-
      de geldende spreidingsmethodiek, bedoeld in [artikel 1cb][ref1], indien sprake is van gelijke aanpassingen met
      spreiden als bedoeld in [artikel 1ca][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1cb
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1cb
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 9b.2
    text: |-
      De informatie over uitvoeringskosten, bedoeld in [artikel 46a, eerste lid, onderdeel c, van de Pensioenwet][ref1]
      dan wel [artikel 57a, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref2], betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.2.a
    text: |-
      de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.2.b
    text: |-
      de kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.2.c
    text: |-
      de transactiekosten, bedoeld in [artikel 10a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.3
    text: 'De informatie over uitvoeringskosten die op de website wordt geplaatst betreft:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.3.a
    text: |-
      voor fondsen en premiepensioeninstellingen: de administratieve uitvoeringskosten als bedrag per deelnemer of
      pensioengerechtigde en de kosten van vermogensbeheer en de transactiekosten als percentage van het gemiddeld belegd
      vermogen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.3.b
    text: |-
      voor verzekeraars: de administratieve uitvoeringskosten als bedrag per deelnemer of pensioengerechtigde en de
      kosten van vermogensbeheer en de transactiekosten:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.3.b.1°
    text: |-
      indien de kosten van invloed zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld
      belegd vermogen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.3.b.2°
    text: |-
      indien de kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht met vermelding dat deze kosten
      niet zijn opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het pensioenrecht.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.4
    text: |-
      De informatie over de beleggingen en het beleggingsbeleid, bedoeld in
      [artikel 46a, tweede lid, onderdeel d, van de Pensioenwet][ref1] dan wel
      [artikel 57a, tweede lid, onderdeel d, van de Wet verplichte beroepspensioenregeling][ref2], betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.4.a
    text: |-
      beleggingsresultaten van het collectieve vermogen, met onderscheid tussen de verschillende beleggingscategorieën;
      en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.4.b
    text: de verhouding van deze resultaten tot het strategisch beleggingsbeleid.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9b.5
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9b
  - number: 9c.1
    text: |-
      Op voordracht van de uitvoerders en na advies van de Autoriteit Financiële Markten stelt Onze Minister de modellen
      voor het uniform pensioenoverzicht vast.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
  - number: 9c.2
    text: |-
      De modellen voor het uniform pensioenoverzicht worden beschikbaar gesteld op de website van de Pensioenfederatie en
      het Verbond van Verzekeraars.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
  - number: 9c.3
    text: |-
      Een uitvoerder verstrekt een uniform pensioenoverzicht voor deelnemers aan een ieder die in de gehele of in een
      deel van de voor het uniform pensioenoverzicht relevante periode deelnemer bij die pensioenuitvoerder was.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
  - number: 9c.4
    text: |-
      In afwijking van het derde lid kan de pensioenuitvoerder afzien van verstrekking van een uniform pensioenoverzicht
      voor deelnemers aan degene die op het eind van de, voor dit pensioenoverzicht, relevante periode geen deelnemer bij
      de pensioenuitvoerder meer is, indien:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
  - number: 9c.4.a
    text: |-
      in de informatie die wordt verstrekt bij beëindiging van de deelneming of bij de pensioeningang een opgave
      van de aan het lopende kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen is opgenomen, alsmede
      informatie over de werkgeverspremie en werknemerspremie die in het lopende kalenderjaar in rekening is gebracht dan
      wel de premie die in het lopende kalenderjaar in rekening is gebracht bij de beroepsgenoot; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9c.4.b
    text: |-
      in het uniform pensioenoverzicht voor gewezen deelnemers verstrekt in het kalenderjaar na het jaar waarin de
      deelneming is beëindigd een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van
      pensioenaanspraken overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende
      bepalingen is opgenomen, alsmede informatie over de werkgeverspremie en werknemerspremie die in het voorgaande
      kalenderjaar in rekening is gebracht dan wel de premie die in het voorgaande kalenderjaar in rekening is gebracht
      bij de beroepsgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9d.1
    text: |-
      Voor de elektronische verstrekking van informatie door middel van een externe berichtenbox wordt MijnOverheid.nl
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9d
  - number: 9d.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de elektronische informatieverstrekking.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9d
  - number: 9e.1
    text: |-
      Een vermindering van de pensioenaanspraken en pensioenrechten wordt door de uitvoerders binnen vier maanden
      verwerkt in de gegevens die door middel van het pensioenregister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.2
    text: |-
      Een andere wijziging van de pensioenaanspraken en pensioenrechten dan bedoeld in het eerste lid wordt door de
      uitvoerders binnen vier maanden nadat de wijziging in de administratie van de uitvoerders is doorgevoerd verwerkt
      in de gegevens die door middel van het pensioenregister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.3
    text: 'Het pensioenregister geeft in ieder geval inzicht in de hoogte van het te bereiken pensioen door:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.3.a
    text: weergave in netto bedragen per maand en in bruto bedragen per jaar;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.3.b
    text: de mogelijkheid om ter vergelijking het huidige netto inkomen per maand in te voeren.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.4
    text: |-
      Met betrekking tot de keuzes ten aanzien van ouderdomspensioen worden in ieder geval de indicatieve gevolgen op het
      pensioeninkomen getoond van het vervroegen of uitstellen van de pensioeningangsdatum.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.5
    text: |-
      Met betrekking tot belangrijke gebeurtenissen worden in ieder geval bij nabestaandenpensioen de gevolgen getoond
      van overlijden op het moment van de uitvraag, na beëindiging van de deelneming en na pensionering.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.6
    text: |-
      Voor weergave van ouderdomspensioen in scenario’s wordt gebruik gemaakt van een navigatiemetafoor die op een
      herkenbare plek in het pensioenregister is weergegeven. Een navigatiemetafoor bevat ten minste drie pijlen en de
      volgende bedragen en teksten:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.6.a
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een pessimistisch scenario, met gebruik van de tekst
      «Als het tegenzit, ontvangt u minder: € <bedrag>»;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.6.b
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een verwacht scenario, met gebruik van de tekst
      «Verwacht eindresultaat: € <bedrag>»; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9e.6.c
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een optimistisch scenario, met gebruik van de tekst
      «Als het meezit, ontvangt u meer <bedrag>».
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9e
  - number: 9f.1
    text: |-
      Bij toepassing van [artikel 51, tweede lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 62, tweede lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2] verstrekt het
      pensioenregister ten behoeve van de keuzebegeleiding aan de aangewezen uitvoerder:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel62
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '62'
  - number: 9f.1.a
    text: gegevens over pensioenaanspraken en pensioenrechten, inclusief de verwachte hoogte van het te bereiken pensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
  - number: 9f.1.b
    text: |-
      voor zover het ouderdomspensioen betreft, de gegevens over een pessimistisch scenario, een verwacht scenario en een
      optimistisch scenario;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
  - number: 9f.1.c
    text: gegevens over uitvoerders waarbij pensioen wordt opgebouwd of is opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
  - number: 9f.1.d
    text: |-
      gegevens over aanspraken op ouderdomspensioen en rechten op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 9f.2
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen tevens gegevens over een derde zijn, indien dat voor een adequate
      keuzebegeleiding nodig is en indien die derde daar toestemming voor heeft verleend.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9f
  - number: 9g
    text: 'Voor de gegevensverwerking in het kader van keuzebegeleiding:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9g
  - number: 9g.a
    text: |-
      zijn de Sociale verzekeringsbank en de uitvoerders die via het pensioenregister gegevens verstrekken, gezamenlijke
      verwerkingsverantwoordelijken voor de verwerking van de door hen verstrekte gegevens via het pensioenregister;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9g
  - number: 9g.b
    text: |-
      is de aangewezen uitvoerder, bedoeld in [artikel 51, tweede lid, van de Pensioenwet][ref1],
      verwerkingsverantwoordelijke voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel51
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '51'
  - number: 9g.b.1°
    text: de verwerking van gegevens die plaatsvindt na verstrekking van de gegevens uit het pensioenregister;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9g
  - number: 9g.b.2°
    text: |-
      de verwerking van gegevens voor zover het gegevens betreft over pensioenaanspraken en pensioenrechten bij die
      uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9g
  - number: 9h
    text: |-
      Bij de toepassing van [artikel 9g, onderdeel a][ref1], dragen de volgende organisaties zorg voor de toepassing van
      de artikelen 12 tot en met 22, 33 en 34 van de Algemene verordening gegevensbescherming:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel9g
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 9g
        hoofdstuk: '2'
  - number: 9h.a
    text: |-
      de Sociale verzekeringsbank voor zover het gegevens betreft over aanspraken op ouderdomspensioen en rechten op
      ouderdomspensioen op grond van de [Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 9h.b
    text: |-
      de uitvoerder voor zover het gegevens betreft met betrekking tot pensioenaanspraken en pensioenrechten die zijn
      opgebouwd bij die uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel9h
  - number: '10'
    text: |-
      De informatie op grond van de [artikelen 10c, vierde lid][ref1], [21][ref2], [38 tot en met 44][ref3],
      [45][ref4], [46, eerste en tweede lid][ref5], [46a, eerste en tweede lid][ref6], [52][ref7], [52a][ref8],
