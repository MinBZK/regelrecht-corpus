        bwb_id: BWBR0020892
        artikel: 5a
        hoofdstuk: '2'
  - number: 5c.b
    text: |-
      de uitvoerder geeft bij de opgave, bedoeld in [artikel 5a][ref1], een kwalitatieve toelichting over het verloop
      van de pensioenuitkeringen en geeft daarbij aan of het pensioen waarschijnlijk zal dalen, stijgen of gelijk zal
