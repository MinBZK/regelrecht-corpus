      het vervallen van de dekking tegen het risico op overlijden indien nabestaandenpensioen werd verworven op basis van
      risicofinanciering; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel6
  - number: 6.i
    text: de website waarop het pensioenregister te raadplegen is.
