  - number: '38.1'
    text: 'De Stichting Autoriteit Financiële Markten en De Nederlandsche Bank maken afspraken over:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
  - number: 38.1.a
    text: |-
      de uitwisseling van gegevens en inlichtingen, bedoeld in [artikel 205 van de Pensioenwet][ref1] en
      [artikel 199 van de Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel205
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel199
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
