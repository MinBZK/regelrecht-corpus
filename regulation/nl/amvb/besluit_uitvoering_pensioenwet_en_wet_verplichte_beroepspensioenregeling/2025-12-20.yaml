        artikel: 150e
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 145d
  - number: 46f.4.d
    text: |-
      het fonds indien van toepassing aan de raad van toezicht of de visitatiecommissie de gegevens, bedoeld in
      onderdeel c, alsmede het advies van het verantwoordingsorgaan of de reactie op het verzoek tot goedkeuring van het
      belanghebbendenorgaan heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.4.e
    text: |-
      het fonds aan de hand van de in onderdeel c opgenomen berekeningen de transitie-effecten van het aanvragen van een
      ontheffing nadrukkelijk heeft meegewogen en deze weging inzichtelijk maakt in de onderbouwing van de aanvraag voor
      de ontheffing en in het implementatieplan; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.4.f
    text: |-
      het fonds onderbouwt dat door de gevraagde ontheffing het fonds met het besluit tot collectieve
      waardeoverdracht in overeenstemming met [artikel 105, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 110b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
