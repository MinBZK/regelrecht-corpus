  - number: 7a.1
    text: |-
      De uitvoerder verstrekt degene die pensioengerechtigde wordt voorafgaand aan of bij de pensioeningang in ieder
      geval informatie over:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
  - number: 7a.1.a
    text: |-
      het recht te kiezen voor een hoger of eerder ingaand ouderdomspensioen, bedoeld in
      [artikel 60 van de Pensioenwet][ref1] dan wel [artikel 72 van de Wet verplichte beroepspensioenregeling][ref2],
      voor zover sprake is van opbouw van ouderdomspensioen en partnerpensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel72
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
