  - number: 46f.4.c
    text: |-
      het fonds aan het verantwoordingsorgaan of het belanghebbendenorgaan, in aanvulling op [artikel 46b][ref1],
      de transitie-effecten van de totale transitie inzichtelijk heeft gemaakt, waarbij ten minste het
      netto profijt en de pensioenverwachting als bedoeld in [artikel 150e van de Pensioenwet][ref2] dan wel
      [artikel 145d van de Wet verplichte beroepspensioenregeling][ref3], per leeftijdscohort in hele geboortejaren zijn
      opgenomen en waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en pensioengerechtigden en het
      verschil inzichtelijk wordt gemaakt voor de situatie dat de toezichthouder wel of geen ontheffing geeft;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel145d
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
    references:
