    text: |-
      de in [artikel 150p, derde en vierde lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 145o, derde en vierde lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] genoemde
      onderwerpen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
