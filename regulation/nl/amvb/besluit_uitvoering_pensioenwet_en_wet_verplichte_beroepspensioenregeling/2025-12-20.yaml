        bwb_id: BWBR0020809
        artikel: 150p
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145o
  - number: 46e.3
    text: |-
      Het netto profijt effect wanneer gebruik is gemaakt van de mogelijkheid in het jaar 2022 en 2023 toeslag te
      verlenen bij een beleidsdekkingsgraad vanaf 105% wordt berekend door het netto profijt van het ongewijzigd
      voortzetten van de pensioenovereenkomst dan wel beroepspensioenregeling af te zetten tegen het netto profijt dat
      ontstaat door het gebruik maken van deze mogelijkheid.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46e
  - number: 46e.4
    text: |-
      Het resultaat van de netto profijt berekening in de [artikelen 150e][ref1], [150p, vierde lid][ref2], en
      [220e, vierde lid, van de Pensioenwet][ref3] en de [artikelen 145d][ref4], [145o, vierde lid][ref5] en
      [214d, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6] wordt uitgedrukt als percentage van de
      marktwaarde van te verwachte pensioenuitkeringen bij het ongewijzigd voortzetten van de pensioenovereenkomst dan
      wel beroepspensioenregeling.


