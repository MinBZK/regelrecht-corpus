      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
      [ref8]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref9]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
