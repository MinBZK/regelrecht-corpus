  - number: 47aa.1.a
    text: |-
      als overdrachtsdatum wordt aangemerkt de datum waarop de overdragende uitvoerder de overdrachtswaarde, bedoeld in
      [artikel 25][ref1], aan de ontvangende uitvoerder betaalt; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel25
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47aa
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 47aa.1.b
    text: |-
      de overdragende uitvoerder de overdrachtswaarde kan vermeerderen met de vulling van de
      risicodelingsreserve uit het kapitaal van de gepensioneerde bij toetreding tot het collectief
      toedelingsmechanisme, bedoeld in [artikel 10e, tweede lid, van de Pensioenwet][ref1], dan wel
      [artikel 28e, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], aangepast aan de procentuele
      waardeverandering van de risicodelingsreserve in de periode tussen de toetreding tot het collectief
      toedelingsmechanisme en de overdrachtsdatum, voor zover deze waardeverandering is opgetreden als gevolg van deling
      van de financiële mee- of tegenvallers.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10e
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel28e
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47aa
