  - number: 5a.1
    text: |-
      De opgave van de verworven pensioenaanspraken die op grond van
      [artikel 38, eerste lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 49, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] wordt verstrekt
      betreft, voor zover het de opgebouwde aanspraak op ouderdomspensioen op grond van een premieovereenkomst dan wel
      premieregeling betreft, het voor pensioenuitkeringen aan te wenden vermogen of kapitaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel49
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '49'
  - number: 5a.2
    text: |-
      De opgave van de opgebouwde pensioenaanspraken op grond van een premieovereenkomst dan wel
      premieregeling die op grond van [artikel 40, eerste lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 51, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] wordt verstrekt betreft
      onder meer het voor pensioenuitkeringen aan te wenden vermogen of kapitaal en een indicatie van de hoogte van de
      periodieke uitkeringen op de pensioendatum. Bij de indicatie worden de op dat moment bij de uitvoerder geldende
      tarieven gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel51
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '51'
  - number: 5a.3
    text: |-
      De opgave van de reglementair te bereiken pensioenaanspraken die op grond
      van [artikel 38, eerste lid, onderdeel g, van de Pensioenwet][ref1] dan wel
      [artikel 49, eerste lid, onderdeel g, van de Wet verplichte beroepspensioenregeling][ref2] wordt verstrekt bevat
      onder meer een indicatie van het te bereiken voor pensioenuitkeringen aan te wenden vermogen of kapitaal op de
      pensioendatum en een indicatie van de hoogte van de periodieke uitkeringen op de pensioendatum. Bij de indicatie
      worden de op dat moment bij de uitvoerder geldende tarieven gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel49
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel5a
    references:
