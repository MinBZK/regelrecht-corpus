        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 47a.3
    text: |-
      De plicht tot waardeoverdracht herleeft zodra niet langer sprake is van een van de in
      [artikel 150r van de Pensioenwet][ref1] of [artikel 145q van de Wet verplichte beroepspensioenregeling][ref2]
      omschreven situaties van opschorting. Het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150r
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145q
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150r
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145q
  - number: 47a.4
    text: 'Als de plicht tot waardeoverdracht na een periode van opschorting herleeft, geldt het volgende:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
  - number: 47a.4.a
    text: |-
      indien de opschorting plaatsvond na de datum waarop de deelnemer een opgave heeft gevraagd van zijn
      pensioenaanspraken als bedoeld in [artikel 18][ref1] is, in afwijking van de definitie, bedoeld in
      [artikel 1][ref2], de overdrachtsdatum de datum waarop de plicht tot waardeoverdracht is herleefd; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
    references:
