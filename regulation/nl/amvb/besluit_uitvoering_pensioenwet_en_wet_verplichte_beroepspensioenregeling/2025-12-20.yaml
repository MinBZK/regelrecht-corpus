  - number: 7c.1
    text: |-
      Bij de informatie die wordt verstrekt over een variabele uitkering, bedoeld in de
      [artikelen 44a, eerste lid][ref1], of [63b, tweede lid, van de Pensioenwet][ref2] dan wel de
      [artikelen 55a, eerste lid][ref3], of [75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4], geldt
      het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel55a
