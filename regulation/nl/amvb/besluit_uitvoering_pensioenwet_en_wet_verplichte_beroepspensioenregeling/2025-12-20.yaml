  - number: 7d.2
    text: |-
      Op voordracht van de uitvoerders en na advies van de Autoriteit Financiële Markten stelt Onze Minister de
      standaardmodellen vast. De modellen worden beschikbaar gesteld op de website van de Pensioenfederatie en het
      Verbond van Verzekeraars.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7d
  - number: 7e.1
    text: |-
