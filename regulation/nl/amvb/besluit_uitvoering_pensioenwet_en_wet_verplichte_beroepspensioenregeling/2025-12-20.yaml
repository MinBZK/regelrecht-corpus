  - number: 7a.1.d
    text: andere keuzemogelijkheden die de pensioenregeling biedt; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
  - number: 7a.1.e
    text: |-
      de gehanteerde spreidingsperiode bij de uitkering waarbij de uitvoerder die een spreidingperiode hanteert van meer
      dan vijf jaar dan wel gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] toepast, de volgende
      tekst opneemt: De ontwikkeling van uw pensioen hangt onder meer af van economische omstandigheden. Uw pensioen kan
      hierdoor omhoog of omlaag gaan. Wij spreiden financiële meevallers en tegenvallers over <x> jaar om grote schokken
      in de hoogte van uw pensioen te voorkomen. Bij langdurige tegenvallers en bij een spreidingsperiode van meer dan
      vijf jaar kan uw pensioen na verloop van tijd flink lager uitvallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel7a
    references:
