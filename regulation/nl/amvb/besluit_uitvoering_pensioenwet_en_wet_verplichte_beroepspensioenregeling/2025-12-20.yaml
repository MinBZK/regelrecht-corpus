    text: |-
      het fonds redelijkerwijs op geen andere wijze kan voldoen aan de betreffende voorwaarden zonder dat toepassing
      daarvan leidt tot onevenwichtig nadeel.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.4
    text: 'Bij de aanvraag voor ontheffing toont het fonds aan dat:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.4.a
    text: |-
      de werkgever dan wel de beroepspensioenvereniging in het transitieplan het fonds heeft verzocht af te wijken van de
      [artikelen 150n, achtste lid][ref1], of [150o Pensioenwet][ref2] dan wel de [artikelen 145m, achtste lid][ref3] of
      [145n Wet verplichte beroepspensioenregeling][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150o
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145na
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
