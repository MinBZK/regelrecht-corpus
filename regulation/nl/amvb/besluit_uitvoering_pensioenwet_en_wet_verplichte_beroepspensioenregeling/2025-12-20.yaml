        artikel: '123'
  - number: 40c.1.j
    text: een programma van werkzaamheden die het algemeen pensioenfonds voornemens is te verrichten;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.k
    text: |-
      bescheiden waaruit het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref1] blijkt,
      inclusief bescheiden waaruit blijkt dat het algemeen pensioenfonds gedurende de eerste drie jaren doorlopend kan
      beschikken over het wettelijk vereiste weerstandsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40c.1.l
    text: |-
      een beschrijving van de werkzaamheden die worden uitbesteed, voorzien van een op een risicoanalyse gebaseerde
      onderbouwing;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.m
    text: |-
      een beschrijving van de inrichting van de organisatie met betrekking tot de beheerste en integere bedrijfsvoering,
      bedoeld in [artikel 143 van de Pensioenwet][ref1], inclusief een eigen risicobeoordeling;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '143'
  - number: 40c.1.n
    text: |-
      de uitvoeringsovereenkomst of uitvoeringsovereenkomsten die het algemeen pensioenfonds voornemens is te sluiten, of
      indien hiervan nog geen sprake is, een modeluitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.o
    text: |-
      het pensioenreglement of de pensioenreglementen die het algemeen pensioenfonds op grond van
      [artikel 35 van de Pensioenwet][ref1] heeft opgesteld ten behoeve van de collectiviteitkring of
      collectiviteitkringen of indien hiervan nog geen sprake is een modelpensioenreglement; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel35
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '35'
  - number: 40c.1.p
    text: |-
      een beschrijving van de doelstellingen en beleidsuitgangspunten als bedoeld in
      [artikel 102a, eerste lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 102a
  - number: 40c.2
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel e, zijn:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.2.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.2.c
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.2.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.2.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.3
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.4
    text: 'Het programma van werkzaamheden, bedoeld in het eerste lid, onderdeel j, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.4.a
    text: een beschrijving van het bedrijfsmodel en verdienmodel;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.4.b
    text: een raming voor de eerste drie boekjaren van de kosten; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.4.c
    text: een raming voor de eerste drie kalenderjaren van de liquiditeitspositie.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40d.1
    text: |-
      De Nederlandsche Bank kan een verleende vergunning wijzigen, geheel of gedeeltelijk intrekken of beperken, dan wel
      daaraan nadere voorschriften verbinden, indien:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.a
    text: de vergunninghouder daartoe een aanvraag heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.b
    text: |-
      de vergunninghouder, naar later blijkt, bij de aanvraag van de vergunning onjuiste of onvolledige gegevens heeft
      verstrekt, en kennis omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.c
    text: |-
      de vergunninghouder omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.d
    text: |-
      de vergunninghouder niet meer voldoet aan de bij of krachtens de Pensioenwet gestelde regels dan wel niet meer
      voldoet aan de aan de vergunning verbonden voorschriften of gestelde beperkingen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.e
    text: |-
      de vergunninghouder geen gebruik van de vergunning heeft gemaakt binnen een termijn van twaalf maanden na
      vergunningverlening;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.f
    text: de vergunninghouder de vergunningplichtige activiteit gedurende meer dan zes maanden heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.g
    text: de vergunninghouder het bedrijf ten behoeve waarvan de vergunning is verleend, geheel of gedeeltelijk overdraagt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.h
    text: de vergunninghouder wordt ontbonden;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.i
    text: |-
      niet blijkt dat de jaarrekening of de staten een getrouw beeld geeft of geven van de grootte en de samenstelling
      van het vermogen van het algemeen pensioenfonds en van het resultaat over het desbetreffende boekjaar;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.1.j
    text: de vergunninghouder in staat van faillissement is komen te verkeren.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40d.2
    text: |-
      De Nederlandsche Bank kan bij het besluit tot intrekking van een vergunning tevens bepalen dat het algemeen
      pensioenfonds binnen een door De Nederlandsche Bank te stellen termijn het bedrijf geheel of gedeeltelijk
      afwikkelt. Bij een afwikkeling, al dan niet bepaald door De Nederlandsche Bank, wordt het algemeen pensioenfonds of
      de curator in faillissement van het algemeen pensioenfonds aangemerkt als vergunninghoudende onderneming.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40d
  - number: 40e.1
    text: |-
      Het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref1] bedraagt ten minste 0,2%
      van de waarde van het beheerd pensioenvermogen met een minimum van € 500.000 en een maximum van € 20 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40e.2
    text: |-
      Voor de dekking van aansprakelijkheidsrisico’s wordt het weerstandsvermogen, bedoeld in het eerste lid,
      verhoogd met 0,1% van de waarde van het beheerd pensioenvermogen, tenzij het algemeen pensioenfonds een
      beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening heeft die zijn aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van zijn bedrijf en voor gevallen op
      het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een
      bedrag van ten minste 0,75% van de waarde van het beheerde pensioenvermogen, met een minimum van € 2 miljoen
      en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde van het beheerde
      pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor alle
      schadegevallen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40e
  - number: 40e.3
    text: |-
      In afwijking van het eerste en tweede lid bedraagt het weerstandsvermogen meer dan het resultaat van de
      berekeningswijze overeenkomstig dit artikel, indien de risicoanalyse van het algemeen pensioenfonds daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40e
  - number: 40e.4
    text: |-
      Het weerstandsvermogen van het algemeen pensioenfonds wordt gevormd door de vermogensbestanddelen, bedoeld in de
      [artikelen 5 tot en met 8 van het Besluit financieel toetsingskader pensioenfondsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel5
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '5'
  - number: 40e.5
    text: |-
      Het algemeen pensioenfonds toetst ten minste een keer per jaar of de beroepsaansprakelijkheidsverzekering nog in
      overeenstemming is met de eisen, bedoeld in het tweede lid, dan wel vaker wanneer sprake is van een wijziging van
      omstandigheden die hierop van invloed zijn.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40e
  - number: '41.1'
    text: 'De uitvoering van het nettopensioen door een fonds voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.a
    text: |-
      het beleggingsbeleid en de verwerking van financiële mee- of tegenvallers in de netto pensioenregeling is
      administratief gescheiden van de bruto basispensioenregeling, waarbij geen vermenging van geldstromen optreedt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.b
    text: |-
      in de solidariteitsreserve of risicodelingsreserve is geen vermenging van middelen voor het nettopensioen met de
      andere middelen in de reserve;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.c
    text: |-
      indien bij ouderdomspensioen of nabestaandenpensioen op opbouwbasis het kapitaal voortvloeiend uit de premies vanaf
      de pensioendatum wordt gebruikt voor financiering van een variabele uitkering varieert deze door verwerking van
      de ontwikkeling van het sterfteresultaat en de ontwikkeling van de levensverwachting waarvoor uitsluitend rekening
      wordt gehouden met het sterfteresultaat en de levensverwachting van de groep deelnemers aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.d
    text: |-
      indien bij ouderdomspensioen of nabestaandenpensioen op opbouwbasis het kapitaal voortvloeiend uit de premies vanaf
      de pensioendatum wordt gebruikt voor financiering van een vaste uitkering:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.d.1°
    text: wordt een tarief gehanteerd dat tenminste dekkingsgraad neutraal is;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.d.2°
    text: wordt uitsluitend rekening gehouden met de levensverwachting van de groep deelnemers aan het nettopensioen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.d.3°
    text: is voor het nettopensioen sprake van voorwaardelijke toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.e
    text: 'indien sprake is van voorwaardelijke toeslagverlening bij nettopensioen en:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.e.1°
    text: |-
      de verplichtingen van het fonds ten aanzien van het nettopensioen toenemen als gevolg van een verschil in
      de stijging van de levensverwachting tussen de deelnemers aan het nettopensioen en de deelnemers aan de
      basispensioenregeling, vermindert het fonds de voorwaardelijke toeslagverlening bij het nettopensioen totdat deze
      toename van de verplichtingen bij het nettopensioen is gecompenseerd; of
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.e.2°
    text: |-
      het fonds een incidentele bijstorting ontvangt van de werkgever vermindert het fonds de voorwaardelijke
      toeslagverlening bij het nettopensioen, voor zover deze storting ten goede is gekomen aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.f
    text: |-
      in geval van een nabestaandenpensioen op risicobasis of een premievrijstelling in verband met arbeidsongeschiktheid
      stelt het fonds de hierop betrekking hebbende premie vast rekening houdend met de kenmerken van de groep deelnemers
      aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.g
    text: het fonds rekent de kosten behorend bij het nettopensioen apart toe;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h
    text: 'het fonds houdt voor het nettopensioen een gescheiden administratie bij, waaruit ten minste blijken:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.1°
    text: de voor het nettopensioen ingelegde premies;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.2°
    text: de met de beschikbaar gestelde premies behaalde rendementen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.3°
    text: de waarde van de pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.4°
    text: de middelen voor nettopensioen in de solidariteitsreserve of risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.5°
    text: |-
      de actuariële gegevens over de groep deelnemers aan het nettopensioen die ten grondslag liggen aan de premie
      en aan de waardering van de pensioenverplichtingen, waaronder de geschatte levensverwachting en risico’s op
      arbeidsongeschiktheid en vooroverlijden; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: 41.1.h.6°
    text: de toeslagverlening en de toepassing van onderdeel e.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: '41.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel d, onder 1° wordt het dekkingsgraadneutraal tarief gebaseerd op de
      dekkingsgraad van het fonds, wordt de risicovrije rente gehanteerd en wordt rekening gehouden met tariefgrondslagen
      passend bij de groep deelnemers aan het nettopensioen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: '41.3'
    text: |-
      Het eerste lid is niet van toepassing voor zover het ouderdomspensioen, nabestaandenpensioen of premievrijstelling
      bij arbeidsongeschiktheid is verzekerd bij een verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel41
  - number: '42'
    text: |-
      In een overeenkomst als bedoeld in [artikel 124a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 120a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt in ieder geval geregeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel120a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 124a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 120a
  - number: 42.a
    text: |-
      de pensioenbewaarder in het belang van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden optreedt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
  - number: 42.b
    text: |-
      over het in bewaring gegeven pensioenvermogen slechts kan worden beschikt door het fonds en de pensioenbewaarder
      tezamen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
  - number: 42.c
    text: |-
      de pensioenbewaarder het in bewaring gegeven pensioenvermogen slechts afgeeft tegen ontvangst van een verklaring
      van het fonds waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van het bedrijf
      van pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
  - number: 42.d
    text: |-
      de pensioenbewaarder jegens het fonds, de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden aansprakelijk is voor door hen geleden schade voor zover de schade het gevolg is van
      verwijtbare niet-nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de pensioenbewaarder het bij
      hem in bewaring gegeven pensioenvermogen geheel of gedeeltelijk aan een derde heeft toevertrouwd; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
  - number: 42.e
    text: de pensioenbewaarder van het fonds de informatie ontvangt die noodzakelijk is voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel42
  - number: '43'
    text: |-
      De risico-neutrale scenario’s die door uitvoerders worden gebruikt bij berekening
      van het netto profijt, bedoeld in de [artikelen 150e, eerste lid, onderdeel a][ref1],
      [150p, vierde lid, onderdeel a, sub 5°][ref2] en [220e, vierde lid, onderdeel a, van de Pensioenwet][ref3]
      dan wel de [artikelen 145d, eerste lid, onderdeel a][ref4], [145o, vierde lid, onderdeel a, sub 5°][ref5]
      en [214d, vierde lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref6]
      en bij de collectieve waardeoverdracht indien gebruik wordt gemaakt van de vba-
      methode, bedoeld in [artikel 150n, tweede lid, van de Pensioenwet][ref7] dan wel
      [artikel 145m, tweede lid, van de Wet verplichte beroepspensioenregeling][ref8] worden door De Nederlandsche Bank
      beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel220e
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145d
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel214d
      [ref7]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref8]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150e
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150p
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 220e
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 145d
      - id: ref5
        bwb_id: BWBR0018831
        artikel: 145o
      - id: ref6
        bwb_id: BWBR0018831
        artikel: 214d
      - id: ref7
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref8
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 43a
    text: |-
      Aan de mijlpalen, bedoeld in [artikel 150c van de Pensioenwet][ref1] dan wel
      [artikel 145b van de Wet verplichte beroepspensioenregeling][ref2] wordt uiterlijk voldaan op de volgende
      tijdstippen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145b
  - number: 43a.a
    text: |-
      voor de mijlpaal, bedoeld in [artikel 150c, eerste lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 145b, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2]: 1 januari 2025;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145b
  - number: 43a.b
    text: |-
      voor de mijlpaal, bedoeld in [artikel 150c, eerste lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 145b, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2]: 1 juli 2025 voor
      pensioenfondsen die uiterlijk op 1 juli 2026 overgaan op uitvoering van een gewijzigde pensioenovereenkomst
      of beroepspensioenregeling als bedoeld in [artikel 220i, tweede lid, van de Pensioenwet][ref3] of
      [artikel 214g, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4] en uiterlijk 12 maanden voor
      de beoogde overgang op uitvoering van een gewijzigde pensioenovereenkomst of beroepspensioenregeling als
      bedoeld in artikel 220i, tweede lid, van de Pensioenwet, of artikel 214g, tweede lid, van de Wet verplichte
      beroepspensioenregeling, indien deze beoogde overgang na 1 juli 2026 plaatsvindt; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145b
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel214g
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145b
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 220i
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 214g
  - number: 43a.c
    text: |-
      voor de mijlpalen, bedoeld in [artikel 150c, tweede lid, onderdelen a en b, van de Pensioenwet][ref1] dan wel
      [artikel 145b, tweede lid, onderdelen a en b, van de Wet verplichte beroepspensioenregeling][ref2]: 1 oktober 2026.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145b
  - number: '44.1'
    text: |-
      Bij de uitwerking van het transitieplan, bedoeld in [artikel 150d, eerste lid, van de Pensioenwet][ref1] dan
      wel [artikel 145c, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt, naast de informatie,
      bedoeld in artikel 150d, tweede lid, van de Pensioenwet dan wel artikel 145c, tweede lid, van de Wet verplichte
      beroepspensioenregeling, in ieder geval opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150d
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145c
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150d
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145c
  - number: 44.1.a
    text: de doelstellingen van de transitie;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: 44.1.b
    text: |-
      de kwantitatieve maatstaven voor de beoordeling van de doelstellingen, waartoe in ieder geval netto en bruto
      profijt en de pensioenverwachting horen, en de uitkomsten daarvan die aanvaardbaar zijn;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: 44.1.c
    text: welke voorrangsregels gelden voor de doelstellingen bij de uitvoering van de opdracht;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: 44.1.d
    text: |-
      bij uitvoering door fondsen: in hoeverre verschillende, positieve en negatieve, financiële en economische
      omstandigheden zijn verkend en in welke situaties de afgesproken doelstellingen, voorrangsregels en maatstaven
      zonder meer gelden en geen nadere besluitvorming nodig is; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: 44.1.e
    text: |-
      bij uitvoering door fondsen: het niveau van de dekkingsgraad vanaf wanneer de financiële positie van een fonds
      dusdanig is dat de gemaakte afspraken uit het transitieplan niet meer toereikend zijn, een onderbouwing van
      de berekening van deze dekkingsgraad, de alternatieve afspraken die van toepassing zijn indien het fonds een
      dergelijke dekkingsgraad heeft en, indien van toepassing, de procedure die voor deze situatie is afgesproken.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: '44.2'
    text: |-
      Indien de financiële positie van een fonds dusdanig is dat de gemaakte afspraken uit het transitieplan niet
      meer toereikend zijn als bedoeld in het eerste lid, onderdeel e, en nieuwe afspraken zijn gemaakt, zendt
      de werkgever het gewijzigde transitieplan binnen twee weken na afronding aan het fonds. Het fonds stelt het
      gewijzigde transitieplan op zijn website beschikbaar voor de deelnemer, gewezen deelnemer, gewezen partner en
      pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44
  - number: 44a
    text: |-
      Een vereniging van gewezen deelnemers respectievelijk van pensioengerechtigden, vertegenwoordigt een
      substantieel gedeelte van de gewezen deelnemers respectievelijk van de pensioengerechtigden als bedoeld in
      [artikel 150g van de Pensioenwet][ref1] dan wel [artikel 145f van de Wet verplichte beroepspensioenregeling][ref2],
      indien aan de volgende voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150g
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145f
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150g
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145f
  - number: 44a.a
    text: |-
      de vereniging bezit volledige rechtsbevoegdheid als bedoeld in [Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 44a.b
    text: |-
      haar statutaire doel omvat in elk geval de belangenbehartiging van gewezen deelnemers respectievelijk van
      pensioengerechtigden bij het fonds;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
  - number: 44a.c
    text: 'de vereniging vertegenwoordigt ten minste:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
  - number: 44a.c.1°
    text: duizend gewezen deelnemers of 10% van alle gewezen deelnemers bij het fonds; of
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
  - number: 44a.c.2°
    text: duizend pensioengerechtigden of 10% van alle pensioengerechtigden bij het fonds; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
  - number: 44a.d
    text: |-
      de vereniging maakt haar bestaan tijdig kenbaar aan de partijen die betrokken zijn bij de vaststelling, wijziging
      of intrekking van de pensioenovereenkomst dan wel de beroepspensioenregeling waarbij de vereniging de melding
      rechtstreeks kan doen of via het fonds.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel44a
  - number: '45.1'
    text: De transitiecommissie bestaat uit vijf onafhankelijke leden waaronder een voorzitter.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.2'
    text: |-
      Onze Minister benoemt de leden van de transitiecommissie. Alvorens een kandidaat-lid te benoemen vraagt Onze
      Minister het oordeel van de Stichting van de Arbeid over de kandidaat.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.3'
    text: |-
      De leden van de transitiecommissie zijn deskundig ten aanzien van pensioen en hebben ruime werkervaring op
      pensioenterrein als bestuurder, wetenschapper of bestuursadviseur.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.4'
    text: |-
      In de transitiecommissie als geheel is deskundigheid op het gebied van pensioen en arbeidsvoorwaarden,
      actuariële deskundigheid, kennis van en ervaring met mediation-trajecten en kennis van en ervaring met
      onderhandelingsprocessen vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.5'
    text: 'De leden van de transitiecommissie:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: 45.5.a
    text: functioneren onafhankelijk en bevestigen dit voorafgaand aan hun aanstelling schriftelijk;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: 45.5.b
    text: leggen vast welke andere werkzaamheden zij verrichten; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: 45.5.c
    text: |-
      zijn niet betrokken bij bemiddeling of bindend advies voor partijen of sectoren waarbij zij uit hoofde van hun
      andere werkzaamheden betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.6'
    text: |-
      De transitiecommissie voorkomt belangenverstrengeling of de schijn van belangenverstrengeling en stelt hiervoor
      nadere regels in het reglement.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.7'
    text: |-
      De voorzitter en commissieleden kunnen op eigen verzoek door Onze Minister worden ontslagen. Zij kunnen verder door
      Onze Minister worden geschorst of ontslagen wegens ongeschiktheid, onbekwaamheid of op andere zwaarwegende gronden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
  - number: '45.8'
    text: |-
      De transitiecommissie wordt bekostigd door Onze Minister. De leden van de transitiecommissie kunnen een vergoeding
      ontvangen volgens de regels van de [Wet vergoedingen adviescolleges en commissies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024775
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0024775
  - number: '45.9'
    text: |-
      De transitiecommissie wordt uiterlijk vier weken nadat het jaarverslag over 2026, bedoeld in [artikel 45b][ref1],
      is uitgebracht opgeheven, tenzij naar het oordeel van Onze Minister onvoorziene omstandigheden het opheffen van de
      transitiecommissie in de weg staan.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel45b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 45b
        hoofdstuk: 9b
        paragraaf: 9b.3
  - number: 45a.1
    text: |-
      De transitiecommissie wordt ondersteund door een secretariaat. Het secretariaat is ondergebracht bij de Sociaal-
      Economische Raad, bedoeld in de [Wet op de Sociaal-Economische Raad][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: 45a.2
    text: |-
      De werkzaamheden en huisvesting van het secretariaat van de transitiecommissie worden, voor zover goedgekeurd,
      gefinancierd door Onze Minister. Hieronder worden in ieder geval verstaan:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45a
  - number: 45a.2.a
    text: de kosten voor de faciliteiten van vergaderingen en voor secretariële ondersteuning;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45a
  - number: 45a.2.b
    text: de kosten voor het inschakelen van externe deskundigheid; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45a
  - number: 45a.2.c
    text: de kosten voor publicaties van jaarverslagen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45a
  - number: 45b.1
    text: |-
      De transitiecommissie maakt een jaarverslag van haar werkzaamheden dat bestaat uit een financieel jaarverslag en
      een verslag van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45b
  - number: 45b.2
    text: |-
      De transitiecommissie maakt het jaarverslag over het afgelopen jaar steeds openbaar voor 1 april. Het jaarverslag
      over 2026 dient uiterlijk voor 1 juli 2026 openbaar gemaakt te worden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45b
  - number: 45c.1
    text: 'De transitiecommissie stelt een reglement vast waarin in ieder geval is vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.1.a
    text: de procedure voor het aanvragen van bemiddeling dan wel bindend advies;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.1.b
    text: de termijnen die gelden voor het in behandeling nemen van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.1.c
    text: |-
      in welke gevallen een aanvraag niet dan wel niet langer in behandeling wordt genomen en hoe de aanvragers daarover
      worden geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.1.d
    text: de procedure voor het openbaar maken van een bindend advies; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.1.e
    text: de wijze waarop besluitvorming plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45c.2
    text: |-
      De transitiecommissie kan in het reglement nadere regels opnemen met betrekking tot de informatie en opgaven,
      bedoeld in [artikel 45d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel45d
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 45d
        hoofdstuk: 9b
        paragraaf: 9b.3
  - number: 45c.3
    text: Het reglement wordt door de transitiecommissie vastgesteld na overleg met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45c
  - number: 45d.1
    text: 'Indien de aanvraag een verzoek tot bindend advies betreft overleggen de aanvragers bij de aanvraag:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.1.a
    text: informatie over de onderwerpen waarover overeenstemming is bereikt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.1.b
    text: informatie over de onderwerpen waarover geen overeenstemming is bereikt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.1.c
    text: |-
      informatie over de onderhandelingsinzet van de beide aanvragers bij de onderwerpen waarover geen overeenstemming
      is bereikt;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.1.d
    text: |-
      de berekeningen van de effecten voor de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde van de
      verschillende opties; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.1.e
    text: een oordeel over de uitvoerbaarheid van de beoogde uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45d.2
    text: De transitiecommissie maakt een bindend advies openbaar binnen vier weken na bekendmaking aan de aanvragers.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45d
  - number: 45e.1
    text: |-
      Een verzoek tot bemiddeling door de transitiecommissie dient voor 1 januari 2024 te worden ingediend bij de
      transitiecommissie als partijen de pensioenovereenkomst dan wel de beroepspensioenregeling willen laten uitvoeren
      door een pensioenfonds en voor 1 januari 2025 als partijen deze willen laten uitvoeren door een verzekeraar of
      premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45e
  - number: 45e.2
    text: |-
      Een verzoek tot het bindend adviseren door de transitiecommissie dient voor 1 juli 2024 dan wel in de periode
      van 1 juli 2025 tot en met 31 maart 2026 te worden ingediend bij de transitiecommissie als partijen de
      pensioenovereenkomst dan wel de beroepspensioenregeling willen laten uitvoeren door een pensioenfonds en voor
      1 januari 2026 als partijen deze willen laten uitvoeren door een verzekeraar of premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel45e
  - number: '46.1'
    text: |-
      In het kader van de wijze waarop voorbereidingen worden getroffen voor de uitvoering van de gewijzigde
      pensioenovereenkomst dan wel de gewijzigde beroepspensioenregeling en de besluiten op grond van
      de [artikelen 150m][ref1] en [150n van de Pensioenwet][ref2] dan wel de [artikelen 145l][ref3] en
      [145m van de Wet verplichte beroepspensioenregeling][ref4] wordt in het implementatieplan van fondsen ten minste
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 145l
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 46.1.a
    text: informatie over het doorlopen en te doorlopen besluitvormingsproces;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.1.b
    text: |-
      de genomen en te nemen stappen in de implementatiefase en uitvoeringsfase en het beoogde tijdpad hiervoor
      en welke stappen gezet moeten worden ingeval financiële, economische en andere schokken optreden tijdens de
      transitieperiode; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.1.c
    text: |-
      de onderwerpen, bedoeld in [artikel 44, onderdelen d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel44
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '44'
        hoofdstuk: 9b
        paragraaf: 9b.3
  - number: '46.2'
    text: |-
      Een fonds onderbouwt hoe zal worden omgegaan met de opgebouwde pensioenaanspraken en pensioenrechten,
      alsmede de berekeningen daarbij en de overwegingen daartoe. Indien een fonds zal overgaan tot
      een collectieve waardeoverdracht als bedoeld in [artikel 150m van de Pensioenwet][ref1] dan wel
      [artikel 145l van de Wet verplichte beroepspensioenregeling][ref2] betreft dit in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145l
  - number: 46.2.a
    text: |-
      welk gedeelte van het vermogen wordt gebruikt om te voldoen aan de vereisten ten aanzien van het minimaal vereist
      eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.b
    text: |-
      indien van toepassing, de onderbouwing van het toepassen van de vba-methode voor de waardering van de
      pensioenaanspraken en pensioenrechten en het aanwenden van het vermogen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.c
    text: |-
      hoe invulling wordt gegeven aan de keuzes die een fonds op grond van [artikel 150n van de Pensioenwet][ref1] dan
      wel [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2] kan maken;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 46.2.d
    text: indien van toepassing, de hoogte van de initiële vulling van het compensatiedepot;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.e
    text: indien van toepassing, de hoogte van de initiële vulling van de solidariteitsreserve of risicodelingsreserve;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.f
    text: |-
      hoe het rekening heeft gehouden met de gevolgen voor deelnemers, gewezen deelnemers, gewezen
      partners en pensioengerechtigden van gebruikmaking van overbruggingsplannen als bedoeld in
      [artikel 150p van de Pensioenwet][ref1] dan wel [artikel 145o van de Wet verplichte beroepspensioenregeling][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150p
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145o
  - number: 46.2.g
    text: |-
      hoe het rekening heeft gehouden of zal houden met de gevolgen voor deelnemers, gewezen deelnemers, gewezen partners
      of pensioengerechtigden wanneer gebruik is of zal worden gemaakt van de mogelijkheid toeslag te verlenen bij een
      beleidsdekkingsgraad vanaf 105%;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.h
    text: hoe zal worden omgegaan met arbeidsongeschiktheidspensioen, premievrije voortzetting en nabestaandenpensioen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.2.i
    text: |-
      indien van toepassing, de onderbouwing van het toepassen van een andere spreidingstermijn dan
      tien jaar bij de standaardregel, bedoeld in [artikel 150n van de Pensioenwet][ref1] dan wel
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
  - number: '46.3'
    text: 'Een fonds neemt een analyse op ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.3.a
    text: |-
      operationele en IT-risico’s waaronder de continuïteit en betrouwbaarheid van de dienstverlening voor, tijdens en na
      de transitie en de beheersing van deze risico’s;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.3.b
    text: de beschikbaarheid van data voor, tijdens en na de transitie en de beheersing van de risico’s hierbij;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.3.c
    text: de datakwaliteit voor, tijdens en na de transitie en de beheersing van de risico’s hierbij;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.3.d
    text: |-
      de procesbeheersing en de beheersing van de risico’s hierbij waarbij tevens de onderbouwing van de risicoanalyse
      die na de inwerkingtreding van de [Wet toekomst pensioenen][ref1] is uitgevoerd wordt opgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0048328
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0048328
  - number: 46.3.e
    text: de risico’s die samenhangen met de uitbesteding van werkzaamheden en de beheersing van deze risico’s; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.3.f
    text: de financiële risico’s en de beheersing van deze risico’s.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: '46.4'
    text: |-
      Een fonds moet kunnen aantonen dat de datakwaliteit voor, tijdens en na de transitie geborgd is. Dit doet zij
      door het uitvoeren van een risicoanalyse als bedoeld in het derde lid, onderdeel c. Een fonds dat besluit tot een
      collectieve waardeoverdracht van de opgebouwde pensioenaanspraken en pensioenrechten geeft tevens aan hoe zij de
      kwaliteit van de data zekerstelt voor, tijdens en na de transitie. Dat doet zij door:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.4.a
    text: |-
      voorafgaand aan het indienen van het implementatieplan een externe accountant of een externe IT-auditor opdracht
      te geven werkzaamheden te verrichten waarmee het fondsbestuur in staat wordt gesteld een oordeel te vormen over
      de juistheid en volledigheid van de relevante pensioendata benodigd voor de transitie waarbij de resultaten van
      de bevindingen van de accountant of de IT-auditor, de wijze waarop de eventuele bevindingen zijn opgevolgd en de
      oordeelsvorming van het fonds dienen opgenomen te worden in het implementatieplan of meegestuurd te worden bij
      indiening van het implementatieplan bij De Nederlandsche Bank; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: 46.4.b
    text: |-
      na de transitie een externe accountant opdracht te geven een oordeel te vellen over de juistheid en volledigheid
      van de transitie, waaronder tenminste de berekeningen die ten grondslag liggen aan de verdeling van vermogens en,
      indien van toepassing, het compensatiedepot, de solidariteitsreserve of de risicodelingsreserve bij invaren.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: '46.5'
    text: |-
      Op verzekeraars en premiepensioeninstellingen is het eerste lid, onderdelen a en b, het tweede lid, eerste zin, en
      het derde lid, aanhef en onderdelen a, b, c en d, van overeenkomstige toepassing. Daar waar de onderdelen in het
      implementatieplan overeenkomen met het reeds doorlopen productontwikkelingsproces kan daarnaar verwezen worden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
  - number: '46.6'
    text: |-
      De uitvoerder dient het implementatieplan, zonder het communicatieplan, in bij De Nederlandsche Bank
      en informeert de deelnemers, gewezen deelnemers, gewezen partners of pensioengerechtigden over de
      indiening en over de inhoud van het implementatieplan waaronder de voorgenomen wijzigingen in de
      pensioenregeling, de gemaakte keuzes en het verdere proces. De verzekeraar of premiepensioeninstelling
      die gebruikt maakt van [artikel 150i, vierde lid, onderdeel b, van de Pensioenwet][ref1], of
      [artikel 145h, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2], informeert de deelnemers,
      gewezen deelnemers, gewezen partners of pensioengerechtigden tijdig maar uiterlijk wanneer de gewijzigde
      pensioenovereenkomst of gewijzigde beroepspensioenregeling bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150i
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145h
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150i
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145h
  - number: 46a.1
    text: |-
      De uitvoerder neemt in het communicatieplan op dat bij het informeren van de
      deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden, naast de
      informatie, bedoeld in [artikel 150j, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 145i, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], in ieder geval ook het volgende
      wordt opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150j
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145i
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150j
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145i
  - number: 46a.1.a
    text: de persoonsgegevens van de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.b
    text: de naam en het contactadres van de uitvoerder;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.c
    text: de peildatum waarop de informatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.d
    text: het karakter van de pensioenovereenkomst dan wel beroepspensioenregeling voor en na de peildatum;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.e
    text: |-
      de pensioensoorten voor en na de peildatum, waarbij bij partnerpensioen onderscheid wordt gemaakt tussen
      partnerpensioen op opbouwbasis en partnerpensioen op risicobasis;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.f
    text: de hoogte van de dekking van het nabestaandenpensioen voor en na de peildatum;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.g
    text: uitleg over verschillen in bedragen voor en na de peildatum; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.1.h
    text: |-
      de doelgroepen, doelstellingen en de planning van de informatieverstrekking, waarbij in ieder geval de
      belangrijkste communicatiemomenten zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.2
    text: |-
      De uitvoerder geeft verder informatie over het stellen van vragen aan de uitvoerder, over de interne
      klachtenprocedure van de uitvoerder en neemt een verwijzing op naar het pensioenregister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.3
    text: |-
      De uitvoerder legt de wijze waarop de pensioenuitvoerder omgaat met inkomende waarden in het kader van de
      collectieve waardeoverdracht, waaronder begrepen de wijze waarop wordt omgegaan met opgebouwde pensioenaanspraken
      en pensioenrechten, vast in het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.4
    text: |-
      In geval de gewijzigde pensioenovereenkomst dan wel beroepspensioenregeling is ondergebracht bij een nieuwe
      uitvoerder, is de oude uitvoerder verplicht op verzoek van de nieuwe uitvoerder de relevante informatie tijdig
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46a.5
    text: |-
      De uitvoerder dient het communicatieplan in bij de Stichting Autoriteit Financiële Markten en informeert
      de deelnemers, gewezen deelnemers, gewezen partners of pensioengerechtigden over de indiening en de
      inhoud van het communicatieplan en over het verdere proces. De verzekeraar of premiepensioeninstelling
      die gebruikt maakt van [artikel 150i, vierde lid, onderdeel b, van de Pensioenwet][ref1], of
      [artikel 145h, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2], informeert de deelnemers,
      gewezen deelnemers, gewezen partners of pensioengerechtigden tijdig maar uiterlijk wanneer de gewijzigde
      pensioenovereenkomst of gewijzigde beroepspensioenregeling bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150i
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145h
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150i
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145h
  - number: 46a.6
    text: |-
      Het door de uitvoerder verstrekken van informatie aan deelnemers, gewezen deelnemers, gewezen
      partners en pensioengerechtigden, bedoeld in [artikel 150j, derde lid, van de Pensioenwet][ref1]
      of [artikel 145i, derde lid, van de Wet verplichte beroepspensioenregeling][ref2], vindt uiterlijk
      plaats één maand voor het tijdstip van overgang op uitvoering van een gewijzigde pensioenovereenkomst
      of beroepspensioenregeling, bedoeld in [artikel 220i, tweede lid, van de Pensioenwet][ref3] of
      [artikel 214g, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150j
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145i
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel220i
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel214g
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150j
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145i
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 220i
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 214g
  - number: 46a.7
    text: |-
      De Stichting Autoriteit Financiële Markten kan nadere regels stellen over de vormgeving en wijze van leveren van
      het communicatieplan.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46a
  - number: 46b.1
    text: |-
      De toezichthouder beoordeelt het voornemen tot waardeoverdracht,
      bedoeld in [artikel 150m, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 145l, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] op de volgende aspecten:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145l
  - number: 46b.1.a
    text: het besluitvormingsproces;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.1.b
    text: financiële en andere risico’s;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.1.c
    text: de financiële effecten;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.1.d
    text: de collectieve actuariële gelijkwaardigheid; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.1.e
    text: de evenwichtige belangenafweging door het fonds.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2
    text: |-
      Het fonds verstrekt het verantwoordingsorgaan of het belanghebbendenorgaan ten behoeve van de advisering,
      dan wel goedkeuring, bedoeld in [artikel 150m, vierde en zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 145l, vierde en zesde lid, van de Wet verplichte beroepspensioenregeling][ref2], in ieder geval de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145l
  - number: 46b.2.a
    text: |-
      het voorgenomen besluit tot collectieve waardeoverdracht, waarbij ten minste wordt ingegaan op de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.a.1°
    text: |-
      indien van toepassing, de onderbouwing van het toepassen van de vba-methode voor de waardering van de
      pensioenaanspraken en pensioenrechten en het aanwenden van het vermogen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.a.2°
    text: |-
      hoe invulling wordt gegeven aan de keuzes die een fonds op grond van [artikel 150n van de Pensioenwet][ref1] dan
      wel [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2] kan maken;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 46b.2.a.3°
    text: 'indien van toepassing: de hoogte van de initiële vulling van het compensatiedepot; en'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.a.4°
    text: 'indien van toepassing: de hoogte van de initiële vulling van de solidariteitsreserve of risicodelingsreserve;'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.b
    text: hoe zal worden omgegaan met arbeidsongeschiktheidspensioen, premievrije voortzetting en nabestaandenpensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.c
    text: informatie over het besluitvormingsproces;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.d
    text: de kwantitatieve effecten van de collectieve waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.e
    text: |-
      de overwegingen en afwegingen van het fonds bij het voorgenomen besluit en een motivering waarom de effecten
      evenwichtig worden geacht;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.f
    text: de gewijzigde pensioenovereenkomst dan wel beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.g
    text: de afspraken met betrekking tot compensatie; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.2.h
    text: |-
      de transitie-effecten van de totale transitie in termen van netto profijt per leeftijdscohort in hele
      geboortejaren en in termen van de pensioenverwachting per leeftijdscohort in hele geboortejaren die, voor zover
      het ouderdomspensioen betreft, wordt weergegeven op basis van een pessimistisch, verwacht en optimistisch scenario,
      waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46b.3
    text: |-
      Indien van toepassing verstrekt het fonds aan de raad van toezicht of de visitatiecommissie de gegevens, bedoeld in
      het tweede lid, alsmede het advies van het verantwoordingsorgaan of de reactie op het verzoek tot goedkeuring van
      het belanghebbendenorgaan.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46b
  - number: 46c.1
    text: |-
      Bij de vba-methode, bedoeld in de [artikelen 150n van de Pensioenwet][ref1] dan wel
      [145m van de Wet verplichte beroepspensioenregeling][ref2] en bij het berekenen van transitie-
      effecten als bedoeld in [150e, eerste lid, onderdeel a, van de Pensioenwet][ref3] dan wel
      [145d, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref4], wordt gebruik gemaakt van de
      value based ALM-rekenmethodiek.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145d
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 150e
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 145d
  - number: 46c.2
    text: 'Bij de vba-rekenmethodiek geldt voor de berekeningen het volgende:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.2.a
    text: |-
      bij de analyse wordt gebruik gemaakt van minimaal 20.000 risico-neutrale scenario’s als bedoeld in
      [artikel 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel43
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '43'
        hoofdstuk: 9b
        paragraaf: 9b.1
  - number: 46c.2.b
    text: |-
      de duur van de gehele prognosehorizon is zoals vastgesteld in de risico-neutrale scenario’s, bedoeld in
      [artikel 43][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel43
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '43'
        hoofdstuk: 9b
        paragraaf: 9b.1
  - number: 46c.2.c
    text: |-
      voor de demografische ontwikkeling binnen de uitvoerder wordt over de gehele prognosehorizon een realistische
      aanname gehanteerd.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.3
    text: |-
      Bij de vba-rekenmethodiek geldt voor de berekeningen door een fonds het vastgestelde fondsbeleid. Bij de
      vaststelling van het fondsbeleid geldt het volgende:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.3.a
    text: |-
      bij de waardering van de opgebouwde pensioenaanspraken en pensioenrechten sluit het fonds aan bij het op 30 juni
      2022 in de actuariële en bedrijfstechnische nota, bedoeld in [artikel 145 van de Pensioenwet][ref1] dan wel
      [artikel 140 van de Wet verplichte beroepspensioenregeling][ref2], vastgelegde beleidskader en vastgelegde
      financiële toezichtskaderbeleid;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '140'
  - number: 46c.3.b
    text: |-
      bij de waardering van de pensioenaanspraken en pensioenrechten voor de solidaire premieovereenkomst dan wel
      solidaire premieregeling, of flexibele premieovereenkomst dan wel flexibele premieregeling sluit het fonds aan bij
      de onderdelen zoals in de opdrachtbevestiging, bedoeld in [artikel 28d][ref1], is vastgelegd of het fonds van plan
      is vast te leggen;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel28d
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 28d
        hoofdstuk: 6b
  - number: 46c.3.c
    text: |-
      voor zover sprake is van incomplete beleidsonderdelen voor de uitvoering van de volledige prognosehorizon worden
      realistische aannames gehanteerd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.3.d
    text: |-
      een fonds kan voor de uitvoering van de volledige prognosehorizon afwijken van het fondsbeleid, zoals vastgelegd in
      de actuariële en bedrijfstechnische nota of in de opdrachtbevestiging, waarbij dit uitsluitend mogelijk is indien
      dit leidt tot een realistischere invulling op langere termijn;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.3.e
    text: |-
      bij de volledige prognosehorizon wordt verondersteld dat de status van deelnemer of gewezen deelnemer niet wijzigt
      tot aan de pensioendatum voor zover de toeslagverlening voor deelnemers en gewezen deelnemers verschillend is; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.3.f
    text: te allen tijde wordt voldaan aan de huidige wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.4
    text: |-
      Voor zover een uitvoerder bij de berekening gebruik maakt van maatmensen leidt deze vereenvoudiging niet tot
      materiële afwijkingen in de berekening van de marktwaarden van de te verwachte pensioenuitkeringen van deelnemers,
      gewezen deelnemers en andere aanspraakgerechtigden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46c.5
    text: |-
      De uitvoerder onderbouwt de aannames, vereenvoudigingen en, voor zover van toepassing, de afwijking van het
      fondsbeleid op adequate wijze en neemt dit op in het implementatieplan.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46c
  - number: 46d.1
    text: |-
      Bij de standaardmethode, bedoeld in [artikel 150n van de Pensioenwet][ref1] dan wel
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2], wordt gebruik gemaakt van een standaardregel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 46d.2
    text: |-
      Bij de vba-methode, bedoeld in [artikel 150n van de Pensioenwet][ref1] en
      [artikel 145m van de Wet verplichte beroepspensioenregeling][ref2], wordt gebruik gemaakt van de rekenmethodiek
      in [artikel 46c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel46c
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
      - id: ref3
        bwb_id: BWBR0020892
        artikel: 46c
        hoofdstuk: 9b
        paragraaf: 9b.5
  - number: 46d.3
    text: |-
      Bij dekkingsgraden, na de initiële vulling van een solidariteitsreserve, een risicodelingsreserve of een
      compensatiedepot, tussen 105% en 110% als bedoeld in [artikel 150n, zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 145m, zesde lid, van de Wet verplichte beroepspensioenregeling][ref2] kan 5% van het vermogen verschoven
      worden om evenwichtiger uitkomsten te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150n
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145m
  - number: 46d.4
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de voorgeschreven standaardregel.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46d
  - number: 46e.1
    text: |-
      Bij de netto profijt berekening, bedoeld in de [artikelen 150e][ref1], [150p, vierde lid][ref2], en
      [220e, vierde lid, van de Pensioenwet][ref3] dan wel de [artikelen 145d][ref4], [145o, vierde lid][ref5], en
      [214d, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6], wordt de vba- rekenmethodiek, bedoeld in
      [artikel 46c][ref7] gehanteerd met dien verstande dat de berekening wordt uitgevoerd met minimaal 10.000 risico-
      neutrale scenario’s als bedoeld in [artikel 43][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150e
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150p
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel220e
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145d
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel145o
