        artikel: 7e
        hoofdstuk: '2'
  - number: 46f.1
    text: |-
      Een fonds dient een aanvraag voor een ontheffing als bedoeld in [artikel 150oa, eerste lid, van de Pensioenwet][ref1]
      dan wel [artikel 145na, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2],
      tegelijk in met het doen van de melding aan de toezichthouder van het voornemen tot
      waardeoverdracht, bedoeld in [artikel 150m, tweede lid, van de Pensioenwet][ref3] dan wel
      [artikel 145l, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150oa
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145na
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150oa
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145na
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 145l
  - number: 46f.2
    text: |-
      De toezichthouder neemt een besluit over de aanvraag tot ontheffing tegelijk met het besluit of het een verbod tot
      waardeoverdracht zal opleggen. De toezichthouder verleent geen ontheffing indien een verbod tot waardeoverdracht
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.3
    text: |-
      Van redelijkerwijs niet kunnen voldoen als bedoeld in [artikel 150oa, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 145na, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] is sprake indien het fonds aan de
      toezichthouder aantoont dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150oa
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145na
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150oa
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145na
  - number: 46f.3.a
    text: sprake is van specifiek voor het fonds geldende bijzondere omstandigheden of fondskarakteristieken;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
  - number: 46f.3.b
    text: |-
      uitsluitend deze bijzondere omstandigheden of fondskarakteristieken ertoe leiden
      dat toepassing van een of meer van de in [artikel 150n, achtste lid][ref1], of
      [artikel 150o van de Pensioenwet][ref2] dan wel [artikel 145m, achtste lid][ref3], of
      [artikel 145n van de Wet verplichte beroepspensioenregeling][ref4] genoemde voorwaarden leidt tot
      onevenwichtig nadeel als bedoeld in [artikel 150l, vierde lid, onderdeel b, van de Pensioenwet][ref5] of
      [artikel 145k, vierde lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref6]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150n
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel150o
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel145m
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel145na
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel150l
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel145k
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
