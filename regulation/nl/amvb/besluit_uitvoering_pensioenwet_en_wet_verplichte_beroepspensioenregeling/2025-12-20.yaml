        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40c.1.a
    text: |-
      een opgave van de naam, het adres, het telefoon- en faxnummer, het e-mailadres en de internetpagina van het
      algemeen pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.b
    text: een opgave van de statutaire zetel en de statutaire naam;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.c
    text: een opgave van het nummer van inschrijving in het handelsregister;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.d
    text: een gewaarmerkt afschrift van de statuten;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.e
    text: |-
      gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106 van de Pensioenwet][ref1] is bepaald met betrekking tot de geschiktheid van de personen die het beleid
      bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '106'
  - number: 40c.1.f
    text: |-
      gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106 van de Pensioenwet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de personen die het
      beleid bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '106'
  - number: 40c.1.g
    text: |-
      gegevens op basis waarvan De Nederlandsche Bank kan beoordelen of voldaan wordt aan hetgeen ingevolge
      [artikel 106a van de Pensioenwet][ref1] met betrekking tot bestuurders en leden van de raad van toezicht is bepaald
      over het tijdsbeslag;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
