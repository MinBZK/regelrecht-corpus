  - number: 46e.8
    text: |-
      De uitvoerder onderbouwt de voor de uitvoerder specifieke uitgangspunten, bedoeld in het zesde lid, onderdeel c, op
      adequate wijze en neemt dit op in het implementatieplan.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46e
  - number: 46e.9
    text: |-
      De transitie-effecten netto profijt, pensioenverwachting en bruto profijt worden berekend in ieder geval per
      leeftijdscohort in hele geboortejaren waarbij onderscheid gemaakt wordt tussen deelnemers, gewezen deelnemers en
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46e
  - number: 46e.10
    text: |-
      De uitvoerder verstrekt deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden een uitleg over
      en redenen voor verschillen in bedragen voor en na de peildatum, waaronder indien van toepassing het effect van het
      vervallen van de maximering van de toeslagverlening op de scenario’s, bedoeld in [artikel 7e, eerste lid][ref1],
      voor en na de peildatum.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel7e
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46e
    references:
