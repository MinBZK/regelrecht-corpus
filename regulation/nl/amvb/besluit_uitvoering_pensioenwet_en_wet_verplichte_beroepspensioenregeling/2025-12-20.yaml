        bwb_id: BWBR0018831
        artikel: 145o
  - number: 47.1.b
    text: een beschrijving van de voorziene ontwikkeling van de technische voorzieningen en de waarden; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: 47.1.c
    text: |-
      een beschrijving van de concrete maatregelen waardoor het eigen vermogen binnen de looptijd van het
      overbruggingsplan op de invaardekkingsgraad komt, waarbij rekening wordt gehouden met de toeslagverlening en de
      overige verplichtingen van het fonds.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: '47.2'
    text: |-
      Een fonds dat een overbruggingsplan indient en nog geen implementatieplan heeft ingediend,
      onderbouwt in het overbruggingsplan de verwachting dat het zal overgaan tot een collectieve
      waardeoverdracht als bedoeld in [artikel 150m, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 145l, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 150m
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 145l
  - number: '47.3'
    text: |-
      Het overbruggingsplan is ten aanzien van het eerste lid, onderdelen b en c, gebaseerd op een deterministische
      analyse op basis van een dekkingsgraadsjabloon.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: '47.4'
    text: 'Voor toeslagverlening in de looptijd van het overbruggingsplan geldt dat geen toeslag wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: 47.4.a
    text: bij een beleidsdekkingsgraad onder 105%;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: 47.4.b
    text: |-
      bij een dekkingsgraad onder 105% of, nadat het fonds het implementatieplan heeft ingediend, onder de
      invaardekkingsgraad; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: 47.4.c
    text: |-
      voor zover de dekkingsgraad van het fonds door de toeslagverlening lager zou worden dan 105% of lager dan de
      invaardekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: '47.5'
    text: |-
      De in het eerste lid, onderdeel c, genoemde maatregelen mogen er niet toe leiden dat het risico dat niet wordt
      voldaan aan de vereisten ten aanzien van het eigen vermogen doelbewust worden vergroot. In afwijking hiervan
      kan een fonds eenmalig, na dit in het implementatieplan te hebben onderbouwd, het strategisch beleggingsbeleid
      aanpassen mits dit past bij de risicohoudingen per cohort die voor het implementatieplan zijn vastgesteld. Als
      het fonds besluit niet over te gaan tot collectieve waardeoverdracht, dan brengt het fonds het risico van het
      strategische beleggingsbeleid zo snel mogelijk terug naar het eerdere niveau.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47
  - number: 47a.1
    text: |-
      De vaststelling door fondsen of de plicht tot waardeoverdracht, bedoeld in de [artikelen 71][ref1] en
      [76 van de Pensioenwet][ref2] of [artikel 82 van de Wet verplichte beroepspensioenregeling][ref3], wordt
      opgeschort vanwege een van de omschreven situaties van opschorting in [artikel 150r van de Pensioenwet][ref4]
      of [artikel 145q van de Wet verplichte beroepspensioenregeling][ref5], vindt plaats per de eerste dag van iedere
      kalendermaand aan de hand van de situatie op de laatste dag van de voorafgaande kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel150r
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel145q
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '76'
