  - number: 46f.4.b
    text: |-
      het fonds het verantwoordingsorgaan, het belanghebbendenorgaan of de raad van
      toezicht, ten behoeve van de advisering, dan wel goedkeuring, als bedoeld in
      [artikel 150m, vierde, zesde en zevende lid, van de Pensioenwet][ref1] dan wel
      [artikel 145l, vierde en zesde lid, van de Wet verplichte beroepspensioenregeling][ref2] uitdrukkelijk heeft
      verzocht om te adviseren of goedkeuring te verlenen aan het doen van een aanvraag van een in het eerste lid
      bedoelde ontheffing bij de toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel150m
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel145l
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel46f
    references:
