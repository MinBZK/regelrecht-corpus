  - number: 40c.1.h
    text: |-
      een beschrijving van besturing en toezicht in de organisatie, mede in relatie tot de voorziene
      collectiviteitkringen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
  - number: 40c.1.i
    text: |-
      een beschrijving van de wijze waarop, in overeenstemming met de rangregeling, de scheiding wordt
      gewaarborgd tussen de afgescheiden vermogens die per collectiviteitkring worden aangehouden, overeenkomstig
      [artikel 123 van de Pensioenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel123
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40c
    references:
