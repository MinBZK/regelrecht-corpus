      het voortzetten van de dekking voor het nabestaandenpensioen,
      bedoeld in [artikel 55, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 66, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] en het recht op uitruil van
      ouderdomspensioen in partnerpensioen op risicobasis, bedoeld in [artikel 61a van de Pensioenwet][ref3] dan wel
      [artikel 73a van de Wet verplichte beroepspensioenregeling][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel61a
