  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 26 oktober 2006, Directie
    Arbeidsverhoudingen, nr. AV/PB/2006/88128;

    Gelet op de artikelen 21, 33, 34, 38 tot en met 46, 60, 66, 69, 71, 76, 83, 84, 105, 151, 160 en 176 van de
    Pensioenwet, de artikelen 42, 43, 48 tot en met 57, 72, 78, 82, 91, 110, 146, 155 en 171 van de Wet verplichte
    beroepspensioenregeling, artikel 12c, vijfde lid, van de Wet gelijke behandeling van mannen en vrouwen, artikel
    13, derde lid en 23, tweede lid, van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000, artikel 65
    en 67 van de Invoerings- en aanpassingswet Pensioenwet, artikel 1a, eerste lid, onderdeel d, en tweede lid, van de
    Wet openbaarheid van bestuur, artikel 1a, eerste lid, onderdeel e, en tweede lid, van de Wet Nationale ombudsman,
    artikel 99, eerste lid, van de Wet gemeentelijke basisadministratie persoonsgegevens, artikel 33 en 34 van de Wet
    op de loonbelasting 1964, artikel 1, tweede lid, van de Wet toezicht accountantsorganisaties, artikel 24, tweede
    lid en artikel 55, zesde lid, van de Wet op de huurtoeslag;

    De Raad van State gehoord (advies van 16 november 2006, no. W12.06.0459/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 13 december 2006, Directie
    Arbeidsverhoudingen, nr. AV/PB/2006/101170 B;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - afkoopvoet: verhouding tussen het af te
      kopen pensioen en de daarvoor in de plaats uit te keren afkoopwaarde;
        - balanstotaal: het balanstotaal zoals dat blijkt uit de jaarrekening;
        - De Nederlandsche Bank: De Nederlandsche Bank N.V.;
        - FVP-bijdrage: bijdrage, verstrekt op grond van de [Wet privatisering FVP][ref1], zoals deze wet luidde op de dag
      voor het tijdstip van inwerkingtreding van [artikel IIA van de Verzamelwet pensioenen 2017][ref2], om te voorzien
      in aanvullende pensioenvoorzieningen ten behoeve van een werknemer of zijn nagelaten betrekkingen;
        - fonds: 1°. pensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref3]; 2°. beroepspensioenfonds als
      bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4];
        - geschilleninstantie: de geschilleninstantie, bedoeld in [artikel 48c van de Pensioenwet][ref5] en
      [artikel 59c van de Wet verplichte beroepspensioenregeling][ref6];
        - loonaanvullingsuitkering: een uitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref7];
        - opbouwkeuzevoet: verhouding tussen het pensioen waarvan kan worden afgezien en het pensioen dat daarvoor in de
      plaats kan worden opgebouwd;
        - overdrachtsdatum: datum waarop de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken aan de
      ontvangende uitvoerder;
        - pensioenregeling: 1°. pensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref8]; 2°.
      beroepspensioenregeling als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref9];
        - rechthebbende: degene die in aanmerking komt voor waardeoverdracht;
        - ruilvoet: verhouding tussen het in te ruilen pensioen en het daarvoor in te kopen pensioen;
        - scenario-analyse: een scenario-analyse waarbij gebruik wordt gemaakt van de uniforme set met 10.000 economische
      scenario’s, bedoeld in [artikel 23b van het Besluit financieel toetsingskader pensioenfondsen][ref10];
        - uitbesteding door een uitvoerder: het door een uitvoerder verlenen van een opdracht aan een derde tot het
      ten behoeve van die uitvoerder verrichten van werkzaamheden die deel uitmaken van: 1°. of voortvloeien uit het
      uitoefenen van het bedrijf; of 2°. de wezenlijke bedrijfsprocessen ter ondersteuning daarvan;
        - uitvoerder: 1°. pensioenuitvoerder als bedoeld in [artikel 1 van de Pensioenwet][ref11]; 2°. pensioenuitvoerder
      als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref12].
        - vervolguitkering: een uitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0009756
