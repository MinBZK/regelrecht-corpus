        bwb_id: BWBR0020809
        artikel: '205'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '199'
  - number: 38.1.b
    text: de afstemming van beleidsregels, met name over de inzet van handhavinginstrumenten;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
  - number: 38.1.c
    text: |-
      de wijze waarop en het moment wanneer informatie over de toepassing van een handhavinginstrument wordt
      uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
  - number: 38.1.d
    text: het overnemen van elkaars oordeel.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
  - number: '38.2'
    text: |-
      De afspraken, bedoeld in het eerste lid, worden schriftelijk vastgelegd en zijn openbaar. De afspraken worden ter
      kennisneming gezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel38
  - number: '39.1'
    text: |-
      De toezichthouder deelt Onze Minister schriftelijk mee welk bestuurslid dan wel directielid fungeert als
      aanspreekpunt voor Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel39
  - number: '39.2'
    text: |-
      De toezichthouder stelt Onze Minister schriftelijk in kennis van wijzigingen in de samenstelling en taakverdeling
      binnen het bestuur of de directie.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel39
  - number: '40.1'
    text: |-
      De toezichthouder richt zijn organisatie zodanig in dat de uitvoering van het toezicht onafhankelijk kan
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40
  - number: '40.2'
    text: |-
      De toezichthouder beschikt over een beleid met betrekking tot het vervullen van nevenbetrekkingen. Dit beleid richt
      zich op het voorkomen van nevenbetrekkingen die ongewenst zijn met het oog op een goede vervulling van de functie
      of de handhaving van de onafhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40
  - number: '40.3'
    text: De toezichthouder besteedt de oordeelsvorming en de toepassing van handhavinginstrumenten niet uit.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40
  - number: '40.4'
    text: |-
      De toezichthouder beschikt over een beschrijving van de administratieve organisatie en over een systeem van
      periodieke interne controle.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel40
  - number: 40a.1
    text: |-
      De gegevens van fondsen die door de Nederlandsche Bank op grond
      van [artikel 204, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 198, derde lid, van de Wet verplichte beroepspensioenregeling][ref2], kunnen worden gepubliceerd, hebben
      betrekking op


