      De overdragende uitvoerder die gebruikmaakt van het recht op waardeoverdracht van een kleine
      pensioenaanspraak, bedoeld in [artikel 70a, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 81a, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], voor de aanspraken van
      aanspraakgerechtigden van wie de verwerving is beëindigd, anders dan door individuele beëindiging van de
      dienstbetrekking dan wel individuele beëindiging van de deelneming, tussen 1 januari 2018 tot en met 31 december
      2022, doet in afwijking van [artikel 17e, eerste lid][ref3], binnen een jaar vanaf 1 januari 2023, bij het
      pensioenregister een opgave van de uitvoerder bij wie de aanspraakgerechtigde pensioenaanspraken verwerft, tenzij
      de uitvoerder aantoont dat aan uitvraag binnen deze termijn redelijkerwijs niet kan worden voldaan.


