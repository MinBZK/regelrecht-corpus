  - number: 51b.1
    text: |-
      De tijdstippen, bedoeld in de hierna genoemde artikelen uit de Pensioenwet, luiden als volgt:









                    *Artikel van de Pensioenwet*


                    *Onderwerp*


                    *Transitiedatum*






                    a.


                    150c


                    Mijlpalen in transitieperiode


                    Aan de mijlpalen, bedoeld in artikel 150c van de Pensioenwet, wordt uiterlijk voldaan op de volgende
      tijdstippen:
                    a. voor de mijlpaal, bedoeld in artikel 150c, eerste lid, onderdeel a, van de Pensioenwet: *1 januari
      2025*;
                    b. voor de mijlpaal, bedoeld in artikel 150c, eerste lid, onderdeel b, van de Pensioenwet:
      *1 juli 2025* voor pensioenfondsen die uiterlijk op 1 juli 2026 overgaan op uitvoering van een gewijzigde
      pensioenovereenkomst als bedoeld in artikel 220i, tweede lid, van de Pensioenwet en *uiterlijk 12 maanden voor de
      beoogde overgang op uitvoering van een gewijzigde pensioenovereenkomst* als bedoeld in artikel 220i, tweede lid,
      van de Pensioenwet, indien deze beoogde overgang na 1 juli 2026 plaatsvindt; en
                    c. voor de mijlpalen, bedoeld in artikel 150c, tweede lid, onderdelen a en b, van de Pensioenwet:
      *1 oktober 2027*.




                    b.


                    150f, eerste lid, onderdeel b


                    Compensatieperiode


                    De compensatieperiode, bedoeld in artikel 150f, eerste lid, onderdeel b, van de Pensioenwet, eindigt
      uiterlijk op *31 december 2036*.




                    c.


                    150n, negende lid


                    Maximale omvang solidariteitsreserve of risicodelingsreserve na afwijking van de artikelen 10d of 10e
      van de Pensioenwet


                    De eis van de maximale omvang van de solidariteitsreserve of risicodelingsreserve van 15%, bedoeld in
      artikel 150n, negende lid, van de Pensioenwet, geldt, na afwijking van de artikelen 10d of 10e, van de Pensioenwet,
      op *1 januari 2037* of zoveel eerder als de omvang van de reserve maximaal 15% is gaan bedragen.




                    d.


                    150p, tweede lid


                    Indienen overbruggingsplan


                    Een pensioenfonds als bedoeld in artikel 150p, tweede lid, van de Pensioenwet, dat uiterlijk op
      1 juli 2026 overgaat op uitvoering van een gewijzigde pensioenovereenkomst als bedoeld in artikel 220i, tweede
      lid, van de Pensioenwet en dat op *1 juli 2025* geen implementatieplan heeft ingediend bij de toezichthouder,
      kan voor dat jaar en de daaropvolgende jaren gedurende de transitieperiode geen overbruggingsplan indienen.
      Een pensioenfonds als bedoeld in artikel 150p, tweede lid, van de Pensioenwet, dat na 1 juli 2026 overgaat op
      uitvoering van een gewijzigde pensioenovereenkomst als bedoeld in artikel 220i, tweede lid, van de Pensioenwet en
      dat *uiterlijk 12 maanden voor deze beoogde overgang* geen implementatieplan heeft ingediend bij de toezichthouder,
      kan voor dat jaar en de daaropvolgende jaren gedurende de transitieperiode geen overbruggingsplan indienen.




                    e.


                    150p, derde lid


                    Beschrijving financiële situatie pensioenfonds


                    In het overbruggingsplan beschrijft het pensioenfonds, als bedoeld in artikel 150p, derde lid, van
      de Pensioenwet, de financiële situatie van het pensioenfonds in de periode tot het pensioenfonds overgaat tot
      collectieve waardeoverdracht maar uiterlijk op *1 januari 2028*.




                    f.


                    150q, eerste lid


                    Indienen herstelplan


                    Een pensioenfonds dient het herstelplan, bedoeld in artikel 150q, eerste lid, van de Pensioenwet, in
      binnen drie maanden na de in onderdeel g genoemde tijdstippen.




                    g.


                    150q, tweede lid


                    Indienen overbruggingsplan


                    Het pensioenfonds dient het overbruggingsplan, bedoeld in artikel 150q, tweede lid, van de
      Pensioenwet, in:
                    1°. in het jaar 2023: uiterlijk *1 september 2023*;
                    2°. in het jaar 2024: uiterlijk *1 juli 2024*;
                    3°. in het jaar 2025: uiterlijk *1 juli 2025*;
                    4°. in het jaar 2026: uiterlijk *1 april 2026*;
                    5°. in het jaar 2027: uiterlijk *1 april 2027*.




                    h.


                    150q, derde lid


                    Looptijd overbruggingsplan


                    Het overbruggingsplan, als bedoeld in artikel 150q, derde lid, van de Pensioenwet, heeft steeds een
      looptijd tot het tijdstip waarop het pensioenfonds verwacht over te gaan tot collectieve waardeoverdracht maar
      eindigt niet later dan op *1 januari 2028*.




                    i.


                    220e, eerste lid


                    Start deelneming deelnemer (overgangsrecht progressieve premie)


                    De deelneming van de deelnemer, als bedoeld in artikel 220e, eerste lid, onderdeel b, van de
      Pensioenwet, vangt uiterlijk aan op *31 december 2027*.




                    j.


                    220e, derde lid


                    Wijziging pensioenovereenkomst (overgangsrecht progressieve premie)


                    Artikel 220e, derde lid, van de Pensioenwet, is van toepassing indien op of na *1 januari 2028* de
      pensioenovereenkomst zodanig wordt gewijzigd dat de door of voor een deelnemer verschuldigde premie niet langer een
      met de leeftijd oplopend premiepercentage bedraagt, maar een voor alle deelnemers gelijk premiepercentage.




                    k.


                    220g, eerste lid


                    Uiterste overgangstijdstip nabestaandenpensioen


                    Het uiterste overgangstijdstip voor het nabestaandenpensioen, als bedoeld in artikel 220g, eerste
      lid, van de Pensioenwet, is *1 januari 2028*.




                    l.


                    220ha, tweede lid, onderdeel b, subonderdeel 2°


                    Recht op premievrije voortzetting vanwege arbeidsongeschiktheid


                    Het recht op premievrije voorzetting vanwege arbeidsongeschiktheid, als bedoeld in artikel 220ha,
      tweede lid, onderdeel b, subonderdeel 2°, van de Pensioenwet, is uiterlijk op *31 december 2029*ontstaan.




                    m.


                    220i, eerste lid, aanhef, eerste zin


                    Overgangsrecht gewijzigde pensioenovereenkomst


                    De uiterste datum waarop de Pensioenwet, zoals die luidde op de dag voor het tijdstip van
      inwerkingtreding van de Wet toekomst pensioenen, nog van toepassing is op pensioenuitvoerders die nog niet zijn
      overgegaan op een gewijzigde pensioenovereenkomst, zoals bedoeld in artikel 220i, eerste lid, aanhef, eerste zin,
      van de Pensioenwet, is *31 december 2027*.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel51b
  - number: 51b.2
    text: |-
      De tijdstippen, bedoeld in de hierna genoemde artikelen uit de Wet verplichte beroepspensioenregeling, luiden als
      volgt:









                    *Artikel van de Wet verplichte beroepspensioenregeling*


                    *Onderwerp*


                    *Transitiedatum*






                    a.


                    145b


                    Mijlpalen in transitieperiode


                    Aan de mijlpalen, bedoeld in artikel 145b van de Wet verplichte beroepspensioenregeling, wordt
      uiterlijk voldaan op de volgende tijdstippen:
                    a. voor de mijlpaal, bedoeld in artikel 145b, eerste lid, onderdeel a, van de Wet verplichte
      beroepspensioenregeling: '*1 januari 2025*;'
                    b. voor de mijlpaal, bedoeld in artikel 145b, eerste lid, onderdeel b, van de Wet verplichte
      beroepspensioenregeling: '*1 juli 2025*voor beroepspensioenfondsen die uiterlijk op 1 juli 2026 overgaan'
      op uitvoering van een gewijzigde beroepspensioenregeling als bedoeld in artikel 214g, tweede lid, van de
      Wet verplichte beroepspensioenregeling en *uiterlijk 12 maanden voor de beoogde overgang op uitvoering
      van een gewijzigde beroepspensioenregeling* als bedoeld in artikel 214g, tweede lid, van de Wet verplichte
      beroepspensioenregeling, indien deze beoogde overgang na 1 juli 2026 plaatsvindt; en
                    c. voor de mijlpalen, bedoeld in artikel 145b, tweede lid, onderdelen a en b, van de Wet verplichte
      beroepspensioenregeling: '*1 oktober 2027*.'




                    b.


                    145e, eerste lid, onderdeel b


                    Compensatieperiode


                    De compensatieperiode, bedoeld in artikel 145e, eerste lid, onderdeel b, van de Wet verplichte
      beroepspensioenregeling, eindigt uiterlijk op *31 december 2036.*




                    c.


                    145m, negende lid


                    Maximale omvang solidariteitsreserve of risicodelingsreserve na afwijking van de artikelen 28d of 28e
      van de Wet verplichte beroepspensioenregeling


                    De eis van de maximale omvang van de solidariteitsreserve of risicodelingsreserve van 15%, bedoeld in
      artikel 145m, negende lid, van de Wet verplichte beroepspensioenregeling, geldt, na afwijking van de artikelen 28d
      of 28e, van de Wet verplichte beroepspensioenregeling, op *1 januari 2037* of zoveel eerder als de omvang van de
      reserve maximaal 15% is gaan bedragen.




                    d.


                    145o, tweede lid


                    Indienen overbruggingsplan


                    Een beroepspensioenfonds als bedoeld in artikel 145o, tweede lid, van de Wet verplichte
      beroepspensioenregeling, dat uiterlijk op 1 juli 2026 overgaat op uitvoering van een gewijzigde
      beroepspensioenregeling als bedoeld in artikel 214g, tweede lid, van de Wet verplichte beroepspensioenregeling
      en dat op *1 juli 2025* geen implementatieplan heeft ingediend bij de toezichthouder, kan voor dat jaar en de
      daaropvolgende jaren gedurende de transitieperiode geen overbruggingsplan indienen. Een beroepspensioenfonds als
      bedoeld in artikel 145o, tweede lid, van de Wet verplichte beroepspensioenregeling, dat na 1 juli 2026 overgaat
      op uitvoering van een gewijzigde beroepspensioenregeling als bedoeld in artikel 214g, tweede lid, van de Wet
      verplichte beroepspensioenregeling en dat *uiterlijk 12 maanden voor deze beoogde overgang* geen implementatieplan
      heeft ingediend bij de toezichthouder, kan voor dat jaar en de daaropvolgende jaren gedurende de transitieperiode
      geen overbruggingsplan indienen.




                    e.


                    145o, derde lid


                    Beschrijving financiële situatie beroepspensioenfonds


                    In het overbruggingsplan beschrijft het beroepspensioenfonds, als bedoeld in artikel 145o, derde lid,
      van de Wet verplichte beroepspensioenregeling, de financiële situatie van het beroepspensioenfonds in de periode
      tot het beroepspensioenfonds overgaat tot collectieve waardeoverdracht maar uiterlijk op *1 januari 2028.*




                    f.


                    145p, eerste lid


                    Indienen herstelplan


                    Een beroepspensioenfonds dient het herstelplan, bedoeld in artikel 145p, eerste lid, van de Wet
      verplichte beroepspensioenregeling, in binnen drie maanden na de in onderdeel g genoemde tijdstippen.




                    g.


                    145p, tweede lid


                    Indienen overbruggingsplan


                    Het beroepspensioenfonds dient het overbruggingsplan, als bedoeld in artikel 145p, tweede lid, van de
      Wet verplichte beroepspensioenregeling, in:
                    1°. in het jaar 2023: uiterlijk *1 september 2023*;
                    2°. in het jaar 2024: uiterlijk *1 juli 2024*;
                    3°. in het jaar 2025: uiterlijk *1 juli 2025*;
                    4°. in het jaar 2026: uiterlijk *1 april 2026*;
                    5°. in het jaar 2027: uiterlijk *1 april 2027*.




                    h.


                    145p, derde lid


                    Looptijd overbruggingsplan


                    Het overbruggingsplan, als bedoeld in artikel 145p, derde lid, van de Wet verplichte
      beroepspensioenregeling, heeft steeds een looptijd tot het tijdstip waarop het beroepspensioenfonds verwacht over
      te gaan tot collectieve waardeoverdracht maar eindigt niet later dan op *1 januari 2028*.




                    i.


                    214d, eerste lid


                    Start deelneming deelnemer (overgangsrecht progressieve premie)


                    De deelneming van de deelnemer, als bedoeld in artikel 214d, eerste lid, onderdeel b, van de Wet
      verplichte beroepspensioenregeling, vangt uiterlijk aan op *31 december 2027*.




                    j.


                    214d, derde lid


                    Wijziging beroepspensioenregeling (overgangsrecht progressieve premie)


                    Artikel 214d, derde lid, van de Wet verplichte beroepspensioenregeling, is van toepassing indien
      op of na *1 januari 2028* de beroepspensioenregeling zodanig wordt gewijzigd dat de door of voor een deelnemer
      verschuldigde premie niet langer een met de leeftijd oplopend premiepercentage bedraagt, maar een voor alle
      deelnemers gelijk premiepercentage.




                    k.


                    214e, eerste lid


                    Uiterste overgangstijdstip nabestaandenpensioen


                    Het uiterste overgangstijdstip voor het nabestaandenpensioen, als bedoeld in artikel 214e, eerste
      lid, van de Wet verplichte beroepspensioenregeling, is *1 januari 2028*.




                    l.


                    214fa, tweede lid, onderdeel b, subonderdeel 2°


                    Recht op premievrije voortzetting vanwege arbeidsongeschiktheid


                    Het recht op premievrije voorzetting vanwege arbeidsongeschiktheid, als bedoeld in artikel
      214fa, tweede lid, onderdeel b, subonderdeel 2°, van de Wet verplichte beroepspensioenregeling, is uiterlijk op
      *31 december 2029* ontstaan.




                    m.


                    214g, eerste lid, aanhef, eerste zin


                    Overgangsrecht gewijzigde beroepspensioenregeling


                    De uiterste datum waarop de Wet verplichte beroepspensioenregeling, zoals die luidde op de dag voor
      het tijdstip van inwerkingtreding van de Wet toekomst pensioenen, nog van toepassing is op pensioenuitvoerders
      die nog niet zijn overgegaan op een gewijzigde beroepspensioenregeling, zoals bedoeld in artikel 214g, eerste lid,
      aanhef, eerste zin, van de Wet verplichte beroepspensioenregeling, is *31 december 2027*.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel51b
