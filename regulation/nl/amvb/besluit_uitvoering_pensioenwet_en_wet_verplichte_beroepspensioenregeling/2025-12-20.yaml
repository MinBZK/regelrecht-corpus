  - number: 1a.1
    text: |-
      Voor zover een aanvulling op een vervolguitkering of een loonaanvullingsuitkering geen
      arbeidsongeschiktheidspensioen is als bedoeld in [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], wordt deze aanvulling als
      arbeidsongeschiktheidspensioen in de zin van een van die artikelen aangemerkt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 1a.1.a
    text: |-
      de aanvulling op de vervolguitkering niet varieert met inkomsten uit arbeid, tenzij de aanvulling hoger wordt
      vastgesteld indien de inkomsten uit arbeid toenemen;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1a
  - number: 1a.1.b
    text: |-
      de aanvulling op de loonaanvullingsuitkering niet varieert met inkomsten uit arbeid, tenzij de aanvulling hoger
      wordt vastgesteld indien de inkomsten uit arbeid toenemen; of
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1a
  - number: 1a.1.c
    text: het een eenmalige aanvulling is die wordt verstrekt in verband met werkhervatting of werkuitbreiding.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1a
  - number: 1a.2
    text: |-
      Het eerste lid is niet van toepassing op algemeen verbindend verklaarde bepalingen van collectieve
      arbeidsovereenkomsten die betrekking hebben op aanvullingen op een vervolguitkering of op een
      loonaanvullingsuitkering, indien het verzoek tot algemeen verbindend verklaring is ingediend voor de datum van
      inwerkingtreding van de Wet van 15 juli 2008 houdende enige wijzigingen van de Pensioenwet, de Wet verplichte
      beroepspensioenregeling en enige andere wetten.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1a
  - number: 1b
    text: |-
      Indien een samenlevingsverklaring als bedoeld in
      [artikel 2a, tweede lid, of derde lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 2a, tweede lid, of derde lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2], wordt
      ingetrokken, informeert de uitvoerder de deelnemer, gewezen deelnemer, pensioengerechtigde, partner of gewezen
      partner die de samenlevingsverklaring heeft ondertekend hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel2a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 2a
  - number: 1c.1
    text: |-
      De uitvoerder berekent met een scenario-analyse de kans dat met de premie de beoogde pensioendoelstelling
      wordt gehaald, bedoeld in [artikel 10a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 28a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel28a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 28a
  - number: 1c.2
    text: |-
      De uitvoerder legt vast of bescherming voor het renterisico in de solidaire premieovereenkomst dan wel solidaire
      premieregeling gebeurt door middel van beschermingsrendement gekoppeld aan:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.2.a
    text: |-
      de rentetermijnstructuur, bedoeld in
      [artikel 2, tweede lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel2
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '2'
  - number: 1c.2.b
    text: een directe beschermingsportefeuille voor renterisico.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.3
    text: 'Bij de keuze voor koppeling aan de rentetermijnstructuur:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.3.a
    text: |-
      onderbouwt de uitvoerder kwantitatief op basis van een stochastische ALM-analyse de maximaal gewenste mate
      van afwijking tussen het feitelijke beleggingsrisico en renterisico dat alle leeftijdscohorten lopen en de
      toedelingsregels door:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.3.a.1°
    text: |-
      de situatie met en zonder deling renterisico te vergelijken door middel van een stochastische analyse op basis van
      het vastgestelde strategische beleggingsbeleid; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.3.a.2°
    text: |-
      per leeftijdscohort een begrenzing te bepalen voor de toegestane afwijking tussen de feitelijke toedeling van
      rendementen op basis van de collectieve beleggingsportefeuille en de toedelingsregels; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.3.b
    text: |-
      maakt de uitvoerder de daadwerkelijke deling van renterisico per leeftijdscohort inzichtelijk en neemt maatregelen
      als deze de eigen begrenzing overschrijdt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.4
    text: 'Bij de keuze voor koppeling aan een directe beschermingsportefeuille:'
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.4.a
    text: |-
      onderbouwt de uitvoerder in het kader van de vaststelling van het strategische beleggingsbeleid de mate van de
      renteafdekking op basis van die portefeuille kwantitatief met een stochastische ALM-analyse;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.4.b
    text: |-
      legt de uitvoerder ex ante vast wat wordt verstaan onder nominaal renterisico waarbij de gehanteerde rentemaatstaf
      geen kredietrisico bevat; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.4.c
    text: |-
      onderbouwt de uitvoerder per beleggingscategorie kwantitatief in welke mate de categorie bijdraagt aan de
      bescherming van het nominale renterisico per leeftijdscohort.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.5
    text: |-
      De uitvoerder kan bij zowel de koppeling aan de rentetermijnstructuur als de koppeling aan een directe
      beschermingsportefeuille de kosten van vermogensbeheer voor de bescherming tegen renterisico per leeftijdscohort
      aftrekken van het bijgeschreven beschermingsrendement. Hierbij onderbouwt de uitvoerder op basis van objectieve
      gegevens hoe de kosten per leeftijdscohort worden berekend.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.6
    text: |-
      Indien een uitvoerder bij koppeling aan een directe beschermingsportefeuille reële bescherming wil bieden door ook
      voor inflatie gerelateerde instrumenten te kiezen in de directe portefeuille, is het vierde lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1c.7
    text: |-
      De uitvoerder toetst jaarlijks of het derde of vierde lid de gewenste mate van bescherming tegen renterisico per
      leeftijdscohort biedt en neemt maatregelen als dat niet het geval is.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1c
  - number: 1ca.1
    text: |-
      Bij pensioeningang verdeelt de uitvoerder het voor pensioenuitkering bestemd
      vermogen, bedoeld in [artikel 10a, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 28a, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2], in een uitkeringsvermogen en een
      spreidingsvermogen, indien sprake is van toepassing van de toedelingsregels om gelijke aanpassingen als bedoeld in
      de artikelen 10a, vijfde lid, en [63a, achtste lid, van de Pensioenwet][ref3] dan wel de artikelen 28a, vijfde lid,
      en [75a, achtste lid, van de Wet verplichte beroepspensioenregeling][ref4], met spreiden te realiseren.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 28a
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 75a
  - number: 1ca.2
    text: |-
      De hoogte van de variabele uitkering wordt vastgesteld op basis van het uitkeringsvermogen en het
      projectierendement. Voor het projectierendement wordt ten hoogste uitgegaan van de risicovrije rente.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.3
    text: |-
      De pensioenuitvoerder bepaalt het financiële resultaat als gevolg van het behaalde beschermingsrendement
      en overrendement als bedoeld in [artikel 10a, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 28a, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2], voor alle pensioengerechtigden. Uit
      dit financiële resultaat van het collectief van pensioengerechtigden wordt het beschermingsrendement, dat volledige
      bescherming biedt voor het renterisico, ontwikkeling van de levensverwachting en het sterfteresultaat, toebedeeld
      aan het uitkeringsvermogen van iedere pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel28a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 28a
  - number: 1ca.4
    text: |-
      Na toedeling van het beschermingsrendement, bedoeld in het derde lid, wordt het resterende financiële resultaat
      op het moment van vaststelling volledig en onvoorwaardelijk verwerkt in het spreidingsvermogen en op basis van de
      spreidingsmethodiek, bedoeld in [artikel 1cb, eerste lid][ref1], onvoorwaardelijk vastgesteld en verwerkt in het
      uitkeringsvermogen, de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1cb
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1cb
        hoofdstuk: 1a
  - number: 1ca.5
    text: |-
      De wijze waarop financiële resultaten, bedoeld in het vierde lid, worden verwerkt in het uitkeringsvermogen en
      de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden, houdt in dat over de vastgestelde duur van
      de spreidingsperiode de pensioenuitkeringen en pensioenaanspraken onvoorwaardelijk in gelijke stappen dan wel in
      afnemende mate worden aangepast.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.6
    text: |-
      Een uitvoerder kan bij het vaststellen en onvoorwaardelijk verwerken van het financiële resultaat in het
      uitkeringsvermogen, bedoeld in het vijfde lid, in een betreffend jaar rekening houden met de reeds eerder
      onvoorwaardelijk vastgestelde en verwerkte aanpassingen als gevolg van financiële resultaten. Hierbij geldt het
      volgende:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.6.a
    text: |-
      de eerder vastgestelde en onvoorwaardelijk verwerkte aanpassingen en de onvoorwaardelijke aanpassing in het
      betreffende jaar bij elkaar opgeteld leiden tot een patroon waarbij de pensioenuitkeringen en pensioenaanspraken in
      gelijke stappen dan wel in afnemende mate worden aangepast; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.6.b
    text: de al onvoorwaardelijke vastgestelde en verwerkte aanpassingen worden niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.7
    text: |-
      Indien de uitvoerder heeft gekozen voor toepassing in afnemende mate als bedoeld in het vijfde lid, kan de
      uitvoerder een afwijkende verwerking doorvoeren om het financiële resultaat binnen de duur van de spreidingsperiode
      volledig te verwerken in de pensioenuitkeringen en pensioenaanspraken van pensioengerechtigden, mits:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.7.a
    text: |-
      de contante waarde van de nog totaal in de uitkering te verwerken financiële resultaten voor meer dan zestig
      procent in de eerste helft van de spreidingsperiode ligt; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1ca.7.b
    text: |-
      de onvoorwaardelijke aanpassing in het betreffende jaar er niet toe leidt dat sprake is van zowel positieve als
      negatieve onvoorwaardelijke aanpassingen in de hoogte van de pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1ca
  - number: 1cb.1
    text: |-
      Voor toepassing van de [artikelen 1ca][ref1] en [1cc][ref2] stelt de uitvoerder een spreidingsmethodiek vast. Een
      spreidingsmethodiek is de wijze waarop de uitvoerder de pensioenuitkeringen bij gelijke aanpassingen met spreiden
      vaststelt, waarbij onder de spreidingsmethodiek wordt begrepen:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1cc
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
      - id: ref2
        bwb_id: BWBR0020892
        artikel: 1cc
        hoofdstuk: 1a
  - number: 1cb.1.a
    text: de duur van de spreidingsperiode;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cb.1.b
    text: |-
      de wijze waarop het bepaalde in [artikel 1ca, tweede tot en met het zevende lid][ref1], wordt verwerkt, waarbij een
      positief en negatief financieel resultaat op gelijke wijze worden verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 1cb.1.c
    text: de grenzen aan de positieve en negatieve omvang van het spreidingsvermogen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cb.1.d
    text: |-
      de wijze waarop [artikel 1cc][ref1] wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1cc
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1cc
        hoofdstuk: 1a
  - number: 1cb.2
    text: |-
      De spreidingsmethodiek is evenwichtig, transparant en consistent. De uitvoerder maakt de uitkomsten van de
      spreidingsmethodiek inzichtelijk aan de hand van een stochastische ALM-analyse en onderbouwt de gemaakte keuzes en
      vormgeving aan de hand van deze analyse.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cb.3
    text: |-
      De uitvoerder legt de spreidingsmethodiek vast voor minimaal vijf jaar. Onder omstandigheden kan hiervan afgeweken
      worden. De uitvoerder onderbouwt waarom deze keuze is gemaakt.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cb.4
    text: |-
      Een wijziging van de spreidingsmethodiek heeft geen gevolgen voor de al onvoorwaardelijk verwerkte en toebedeelde
      financiële resultaten in het spreidingsvermogen, het uitkeringsvermogen en de pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cb.5
    text: |-
      De uitvoerder legt de spreidingsmethodiek vast in de opdrachtbevestiging, het pensioenreglement en de
      uitvoeringsovereenkomst dan wel het uitvoeringsreglement.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cb
  - number: 1cc.1
    text: |-
      Indien de toedelingsregels met gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] van toepassing
      zijn, geldt bij pensioeningang het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cc
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 1cc.1.a
    text: |-
      de verdeling, bedoeld in [artikel 1ca, eerste lid][ref1], wordt bepaald op basis van de op dat moment geldende
      verhouding tussen de uitkeringsvermogens en de spreidingsvermogens voor alle pensioengerechtigden;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cc
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 1cc.1.b
    text: |-
      de wijze van verdeling, bedoeld in onderdeel a, kan aangepast worden op basis van een nauwkeurigere methode indien
      die verdeling beter aansluit bij te verwachten pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cc
  - number: 1cc.2
    text: |-
      Het op de pensioendatum door verdeling ontstane spreidingsvermogen wordt op basis van de spreidingsmethodiek,
      genoemd in [artikel 1cb, eerste lid][ref1], verwerkt in het uitkeringsvermogen, de pensioenuitkeringen en
      pensioenaanspraken van de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1cb
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1cc
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1cb
        hoofdstuk: 1a
  - number: 1d.1
    text: |-
      In de [artikelen 10a, vijfde lid][ref1], [10b, vierde lid][ref2], en [63a, vierde lid, van de Pensioenwet][ref3],
      dan wel de [artikelen 28a, vijfde lid][ref4], [28b, vierde lid][ref5], en
      [75a, vierde lid, van de Wet verplichte beroepspensioenregeling][ref6] is bepaald dat er op voorhand geen
      herverdelingseffecten plaatsvinden. Hieronder wordt verstaan dat het niet is toegestaan om het risico van
      een belegging toe te delen aan een deelnemer, gewezen deelnemer of pensioengerechtigde en de bijbehorende
      risicobeloning van deze belegging toe te delen aan een andere deelnemer, gewezen deelnemer of pensioengerechtigde.
      De toedeling van het risico en de bijbehorende risicobeloning is consistent met prijzen, zoals geobserveerd op
      financiële markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel28a
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel28b
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 63a
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 28a
      - id: ref5
        bwb_id: BWBR0018831
        artikel: 28b
      - id: ref6
        bwb_id: BWBR0018831
        artikel: 75a
  - number: 1d.2
    text: |-
      Indien van toepassing onderbouwt de uitvoerder kwantitatief dat herverdelingseffecten plaatsvinden voor
      zover dat nodig is om gelijke aanpassingen van ingegane uitkeringen en van de opgebouwde aanspraak op
      nabestaandenpensioen van pensioengerechtigden te realiseren en daarbij alleen herverdelingseffecten
      optreden tussen pensioengerechtigden onderling als bedoeld in de [artikelen 10a, vijfde lid][ref1],
      en [10b, vierde lid, van de Pensioenwet][ref2], dan wel de [artikelen 28a, vijfde lid][ref3], en
      [28b, vierde lid, van de Wet verplichte beroepspensioenregeling][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel28a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel28b
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 10b
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 28a
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 28b
  - number: 1d.3
    text: |-
      Bij gelijke aanpassingen met spreiden als bedoeld in [artikel 1ca][ref1] leidt een projectierendement lager dan een
      risicovrije rente op voorhand niet tot herverdelingseffecten.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1ca
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 1ca
        hoofdstuk: 1a
  - number: 1e.1
    text: |-
      Een uitvoerder die voor bepaalde leeftijdscohorten de leenrestrictie opheft en deze daarmee effectief blootstelt
      aan meer dan 100% beleggingsrisico, voor zover dit passend is bij de risicohouding van deze cohorten, onderbouwt
      waarom dit in het belang van de deelnemers is.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1e
  - number: 1e.2
    text: |-
      Onder blootstelling aan meer dan 100% beleggingsrisico wordt verstaan: de
      effectieve blootstelling aan meer dan 100% zakelijke waardenrisico als bedoeld in
      [artikel 13, achtste lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]. Effectieve
      blootstelling houdt in dat wordt getoetst aan hoeveel beleggingsrisico’s deelnemers worden blootgesteld, inclusief
      toepassing van toedeelregels.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel13
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '13'
  - number: 1e.3
    text: |-
      De uitvoerder legt regels vast waarin wordt beschreven op welke wijze negatieve pensioenvermogens of kapitalen
      worden voorkomen waarbij verdeelregels worden vastgesteld voor de verschillende bronnen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1e
  - number: 1e.4
    text: |-
      Voor de onderbouwing, bedoeld in het eerste lid, en de regels, bedoeld in het derde lid, maakt de uitvoerder
      gebruik van een stochastische ALM-analyse.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1e
  - number: 1e.5
    text: |-
      De uitvoerder draagt er zorg voor dat de pensioenvermogens of kapitalen niet negatief zijn op 31 december van ieder
      jaar en bij beëindiging van de verwerving door de deelnemer op een ander tijdstip dan 31 december.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1e
  - number: 1f.1
    text: |-
      De uitvoerder legt de toedelingskring vast en informeert de deelnemer, gewezen deelnemer of pensioengerechtigde
      hierover voorafgaand aan zijn toetreding tot de toedelingskring.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1f.2
    text: |-
      De uitvoerder legt de vormgeving van het toedelingsmechanisme voor het beleggingsrisico vast en onderbouwt dat
      daarbij op voorhand geen sprake is van herverdelingseffecten tussen leeftijdsgroepen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1f.3
    text: |-
      Bij een fonds gelden voor de omzetting van het kapitaal voortvloeiend uit de premies in een vastgestelde uitkering
      op de pensioendatum de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1f.3.a
    text: de omzetting vindt plaats op basis van een dekkingsgraadneutraal tarief;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1f.3.b
    text: voor de vaststelling van het tarief hanteert het fonds de risicovrije rente voor fondsen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1f.3.c
    text: er wordt rekening gehouden met tariefgrondslagen passend bij de groep deelnemers of gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1f
  - number: 1g
    text: |-
      De verzekeraar of premiepensioeninstelling informeert de deelnemer of gewezen deelnemer over de mogelijkheid
      te kiezen voor een vastgestelde uitkering in ieder geval voorafgaand aan het moment dat de deelnemer of gewezen
      deelnemer voor het eerst deze keuze kan maken.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1g
  - number: 1h.1
    text: |-
      De uitvoerder heeft een solidariteitsreserve of, indien van toepassing, risicodelingsreserve voor iedere
      afzonderlijke pensioenregeling of kan, indien kruissubsidiëring tussen de pensioenregelingen niet kan voorkomen,
      een reserve hebben voor meerdere pensioenregelingen.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.2
    text: |-
      De uitvoerder berekent voor de solidariteitsreserve of risicodelingsreserve in het kader van de toetsing van
      evenwichtigheid de baten en lasten voor alle cohorten die worden onderscheiden voor de risicohouding en onderbouwt
      dat deze baten en lasten in lijn zijn met de doelstellingen van de reserve. Het inzichtelijk maken van deze
      kwantitatieve effecten wordt toegelicht, waarbij de baten en lasten voor de cohorten met en zonder de reserve
      worden vergeleken. Voor de kwantitatieve onderbouwing wordt gebruik gemaakt van een scenario-analyse of een
      stochastische ALM-analyse.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.3
    text: |-
      De evenwichtigheid van afspraken rond de solidariteitsreserve of risicodelingsreserve wordt door de uitvoerder
      beoordeeld en in de besluitvorming onderbouwd. Onder evenwichtigheid wordt onder meer verstaan dat bij de
      inrichting van de reserve op voorhand wordt voorkomen dat een bepaalde generatie binnen een pensioenregeling
      uitsluitend baten of lasten heeft van de reserve. Voor de kwantitatieve onderbouwing wordt gebruik gemaakt van een
      scenario-analyse of een stochastische ALM-analyse.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.4
    text: |-
      De uitvoerder legt de regels voor de solidariteitsreserve of risicodelingsreserve in beginsel vast voor een periode
      van minimaal vijf jaar. Bij bijzondere omstandigheden kan van deze minimale termijn afgeweken worden. De uitvoerder
      onderbouwt dat deze afwijking van de minimale termijn in het belang van alle deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden is.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.5
    text: |-
      De uitvoerder past het tweede en derde lid toe bij vaststelling van de regels voor de solidariteitsreserve of
      risicodelingsreserve, bij wijziging van de inrichting van de reserve of bij een wijziging van het beleid of het
      deelnemersbestand indien de wijziging relevant is voor de doelstellingen of regels voor het vullen van en uitdelen
      uit de reserve.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.6
    text: |-
      Indien van toepassing legt de uitvoerder van tevoren vast bij welk inflatieniveau sprake is van afdekking
      van onverwachte inflatie via de solidariteitsreserve of risicodelingsreserve. De uitvoerder onderbouwt dit
      inflatieniveau op basis van objectief te verifiëren informatie.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.7
    text: |-
      De vaststelling of de omvang van de solidariteitsreserve of risicodelingsreserve blijft binnen de maximale omvang
      van 15% van het geheel voor pensioen gereserveerde vermogen inclusief de reserve, vindt plaats op 31 december van
      enig jaar.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.8
    text: |-
      Als bij een risicodelingsreserve wordt ingelegd uit vermogen bij toetreding tot het collectief toedelingsmechanisme
      voor de collectieve uitkeringsfase, bedraagt de inleg uit vermogen niet meer dan het verschil tussen het percentage
      dat op grond van het pensioenreglement het voorgaande jaar uit premie is ingelegd en 10%.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: 1h.9
    text: |-
      Ter voorkoming van het verminderen van verworven pensioenaanspraken en
      pensioenrechten, bedoeld in [artikel 134, eerste lid, van de Pensioenwet][ref1] of
      [artikel 129, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], kan een fonds
      het eigen vermogen aanvullen door de solidariteitsreserve of risicodelingsreserve te verminderen
      tot het bedrag waarop het fonds beschikt over het minimaal vereist eigen vermogen, bedoeld in
      [artikel 11, eerste lid, van het Besluit financieel toetsingskader pensioenfondsen][ref3]. Een fonds kan dit
      in ieder geval doen voor zover het niet beschikt over het minimaal vereist eigen vermogen als gevolg van de
      hoogte van de operationele kosten. Het eigen vermogen kan enkel worden aangevuld door de solidariteitsreserve of
      risicodelingsreserve, indien aan de volgende voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel11
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '134'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '129'
      - id: ref3
        bwb_id: BWBR0020871
        artikel: '11'
  - number: 1h.9.a
    text: |-
      het fonds is overeenkomstig [artikel 11a, derde lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]
      gehouden om maatregelen te nemen; of


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel11a
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 11a
  - number: 1h.9.b
    text: |-
      het fonds is overeenkomstig [artikel 140, eerste lid, eerste zin, van de Pensioenwet][ref1] of
      [artikel 135, eerste lid, eerste zin, van de Wet verplichte beroepspensioenregeling][ref2] gehouden om maatregelen
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '140'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
  - number: 1h.10
    text: |-
      De Nederlandsche Bank kan nadere regels stellen over de wijze waarop de berekeningen, bedoeld in het tweede en
      derde lid, worden gemaakt en toegelicht.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel1h
  - number: '2'
    text: |-
      De informatie over de kenmerken van de pensioenregeling en de uitvoering van de pensioenregeling, bedoeld in
      [artikel 21 van de Pensioenwet][ref1] dan wel [artikel 48 van de Wet verplichte beroepspensioenregeling][ref2],
      bevat in ieder geval het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '48'
  - number: 2.a
    text: de pensioensoorten waarin de basispensioenregeling voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.b
    text: de pensioensoorten waarin de basispensioenregeling niet voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.c
    text: de wijze waarop pensioen wordt opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.d
    text: de keuzemogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.e
    text: de risico’s;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.f
    text: de soorten uitvoeringskosten;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.g
    text: de beleidsdekkingsgraad met een omschrijving van de gevolgen ervan;
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.h
    text: |-
      op welke wijze in het beleggingsbeleid rekening wordt gehouden met milieu en klimaat, mensenrechten en sociale
      verhoudingen; en
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: 2.i
    text: |-
      indien van toepassing, de beleggingsmogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling
      voorziet.
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel2
  - number: '3'
    text: |-
      De Stichting Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het informeren van de
      deelnemer over de risico’s, bedoeld in [artikel 2, onderdeel e][ref1], voor zover het gaat om premieovereenkomsten
      dan wel premieregelingen met beleggingsvrijheid voor de deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel2
    url: https://wetten.overheid.nl/BWBR0020892/2025-12-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
