articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - afkoopvoet: verhouding tussen het af te kopen pensioen en de daarvoor in de plaats uit te keren afkoopwaarde;
        - balanstotaal: het balanstotaal zoals dat blijkt uit de jaarrekening;
        - De Nederlandsche Bank: De Nederlandsche Bank N.V.;
        - FVP-bijdrage: bijdrage, verstrekt op grond van de Wet privatisering FVP, om te voorzien in aanvullende
      pensioenvoorzieningen ten behoeve van een werknemer of zijn nagelaten betrekkingen;
        - fonds: 1°. pensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref1]; 2°. beroepspensioenfonds als
      bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2];
        - loonaanvullingsuitkering: een uitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref3];
        - opbouwkeuzevoet: verhouding tussen het pensioen waarvan kan worden afgezien en het pensioen dat daarvoor in de
      plaats kan worden opgebouwd;
        - overdrachtsdatum: datum waarop de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken aan de
      ontvangende uitvoerder;
        - pensioenregeling: 1°. pensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref4]; 2°.
      beroepspensioenregeling als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref5];
        - rechthebbende: degene die in aanmerking komt voor waardeoverdracht;
        - ruilvoet: verhouding tussen het in te ruilen pensioen en het daarvoor in te kopen pensioen;
        - uitbesteding door een uitvoerder: het door een uitvoerder verlenen van een opdracht aan een derde tot het
      ten behoeve van die uitvoerder verrichten van werkzaamheden die deel uitmaken van: 1°. of voortvloeien uit het
      uitoefenen van het bedrijf; of 2°. de wezenlijke bedrijfsprocessen ter ondersteuning daarvan;
        - uitvoerder: 1°. pensioenuitvoerder als bedoeld in [artikel 1 van de Pensioenwet][ref6]; 2°. pensioenuitvoerder
      als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref7].
        - vervolguitkering: een uitkering als bedoeld in
      [artikel 60, eerste lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref8].


