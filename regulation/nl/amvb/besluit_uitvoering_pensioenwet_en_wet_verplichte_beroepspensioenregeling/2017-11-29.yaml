      1 De informatie over toeslagverlening die op grond van de [artikelen 38, eerste lid, onderdeel c][ref1], en
      [44, eerste lid, onderdeel c, van de Pensioenwet][ref2], de [artikelen 49, eerste lid, onderdeel c][ref3],
      en [55, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref4] en
      [artikel 2, eerste lid, onderdeel e, en derde lid][ref5], wordt verstrekt heeft betrekking op de toeslagverlening
      over de afgelopen drie jaar waarbij wordt aangegeven in hoeverre de prijsinflatie hiermee is gecompenseerd.

      2 De informatie over toeslagverlening die op grond van de [artikelen 39, eerste lid, onderdeel b][ref6],
      [40, eerste lid, onderdeel b][ref7], [41, eerste lid, onderdeel b][ref8], [42, eerste lid, onderdeel b][ref9],
      [43, eerste lid, onderdeel c][ref10], en [45, eerste lid, onderdeel c, van de Pensioenwet][ref11]
      en de [artikelen 50, eerste lid, onderdeel b][ref12], [51, eerste lid, onderdeel b][ref13],
      [52, eerste lid, onderdeel b][ref14], [53, eerste lid, onderdeel b][ref15], [54, eerste lid, onderdeel c][ref16],
      en [56, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref17] wordt verstrekt heeft
      betrekking op de toeslagverlening over de afgelopen vijf jaar waarbij wordt aangegeven in hoeverre de prijsinflatie
      hiermee is gecompenseerd.

      3 De informatie over toeslagverlening die op grond van
      [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref18] en
      [artikel 57a, eerste lid, onderdeel b van de Wet verplichte beroepspensioenregeling][ref19] wordt verstrekt of
      beschikbaar gesteld heeft betrekking op de toeslagverlening over de afgelopen tien jaar waarbij wordt aangegeven in
      hoeverre de prijsinflatie hiermee is gecompenseerd en of dit in overeenstemming met het toeslagenbeleid is geweest.


