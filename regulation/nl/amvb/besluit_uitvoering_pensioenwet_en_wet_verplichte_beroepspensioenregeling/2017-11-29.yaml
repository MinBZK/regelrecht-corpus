  - number: '31'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon
      als bedoeld in [artikel 106, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 110c, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] buiten twijfel staat op basis van
      diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel31
    references:
