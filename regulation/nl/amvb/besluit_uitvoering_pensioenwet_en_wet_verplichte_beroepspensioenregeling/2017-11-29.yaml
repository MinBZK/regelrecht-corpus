        artikel: '63'
  - number: 14b
    text: |-
      1 Fondsen stellen voor de langere termijn een strategisch beleggingsbeleid vast dat aansluit op de doelstellingen
      en beleidsuitgangspunten, waaronder de risicohouding, van het fonds. Verzekeraars en premiepensioeninstellingen
      stellen voor de langere termijn een strategisch beleggingsbeleid vast dat past bij de doelstellingen van
      de pensioenregeling of beroepspensioenregeling en de voor de toedelingskring vastgelegde risicohouding. Het
      strategisch beleggingsbeleid is gebaseerd op gedegen onderzoek.

      2 [Artikel 13a, tweede tot en met vijfde lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1] is
      van overeenkomstige toepassing voor verzekeraars en premiepensioeninstellingen.

      3 De uitvoerder die werkt met beleggingsprofielen geeft binnen het strategisch beleggingsbeleid en het
      beleggingsplan invulling aan die beleggingsprofielen en onderbouwt voor ieder profiel dat het past binnen de
      prudent person regel.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel13a
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 13a
  - number: 14c
    text: |-
      1 Indien de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen stelt
      de uitvoerder op basis van de informatie, bedoeld in [artikel 52, zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, zesde lid, van de Wet verplichte beroepspensioenregeling][ref2], het risicoprofiel van de deelnemer of
      gewezen deelnemer vast en baseert het advies, bedoeld in artikel 52, derde lid, van de Pensioenwet dan wel artikel
      63, derde lid, van de Wet verplichte beroepspensioenregeling, op dit risicoprofiel.

      2 Het risicoprofiel van de deelnemer of gewezen deelnemer geeft de mate weer waarin hij beleggingsrisico kan en
      wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar, indien een belangrijke gebeurtenis
      daartoe aanleiding geeft en als de deelnemer of gewezen deelnemer om toetsing vraagt. Indien het nieuwe
      risicoprofiel daartoe aanleiding geeft adviseert de uitvoerder de deelnemer of gewezen deelnemer over een ander
      passend beleggingsprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '63'
  - number: 14d
    text: |-
      1 De uitvoerder die verantwoordelijk is voor de beleggingen legt de risicohouding vast waarop het beleggingsbeleid
      is gebaseerd. [Artikel 1a, eerste en derde lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]
      is van overeenkomstige toepassing voor verzekeraars en premiepensioeninstellingen met dien verstande dat deze
      uitvoerders in plaats van overleg met de in het eerste lid van dit artikel genoemde partijen ernaar streven van de
      deelnemers, gewezen deelnemers, pensioengerechtigden of hun vertegenwoordigers zo veel mogelijk duidelijkheid te
      krijgen over hun doelstellingen en risicohouding. De risicohouding wordt per toedelingskring vastgelegd.

      2 De uitvoerder toetst periodiek op basis van een scenarioanalyse of het beleggingsbeleid passend
      is bij de vastgestelde risicohouding en past het beleggingsbeleid aan indien dat niet het geval is.
      [Artikel 23a van het Besluit financieel toetsingskader pensioenfondsen][ref2] is van toepassing bij de
      scenarioanalyse.

      3 Bij de uitvoering van het beleggingsbeleid in de opbouwfase biedt de uitvoerder de deelnemer of gewezen deelnemer
      effectieve bescherming tegen de gevolgen van negatieve beleggingsresultaten voorafgaand aan de pensioendatum.
      De uitvoerder kan hiertoe het beleggingsrisico afbouwen naarmate de deelnemer ouder wordt of kan op andere wijze
      bescherming bieden. De uitvoerder die een andere methode dan leeftijdsgerelateerde afbouw van beleggingsrisico
      toepast, onderbouwt dat op deze wijze de deelnemer of gewezen deelnemer beschermd wordt, zonder dat anderen worden
      benadeeld. Indien de door de uitvoerder toegepaste methode naar het oordeel van De Nederlandsche Bank niet aan de
      doelstellingen voldoet, kan De Nederlandsche Bank de uitvoerder verplichten over te gaan op leeftijdsgerelateerde
      afbouw van beleggingsrisico.

      4 De uitvoering van het beleggingsbeleid in de opbouwfase wordt door de uitvoerder gebaseerd op een
      vastgestelde uitkering, tenzij is gebleken dat de deelnemer of gewezen deelnemer een voorkeur heeft voor een
      variabele uitkering of toetreedt tot een toedelingskring waarop een collectief toedelingsmechanisme voor het
      beleggingsrisico wordt toegepast als bedoeld in [artikel 63b, vijfde lid, van de Pensioenwet][ref3] dan wel
      [artikel 75b, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref4]. In die situaties wordt de
      uitvoering van het beleggingsbeleid afgestemd op een variabele uitkering.

      5 Voor de uitvoering van het vierde lid vraagt de uitvoerder de deelnemer of gewezen deelnemer naar diens voorkeur
      voor een vastgestelde of variabele uitkering, zodra dit voor de beleggingen relevant is. De uitvoerder verstrekt
      daarbij de voor de deelnemer of gewezen deelnemer relevante informatie over de gevolgen en risico’s.

      6 Bij de uitvoering van het beleggingsbeleid in de uitkeringsfase vergroot de uitvoerder het beleggingsrisico niet
      tenzij sprake is van een wijziging van de risicohouding of een gewijzigd risicoprofiel dat aanleiding is voor een
      wijziging van het beleggingsprofiel.

      7 Het risicoprofiel van de deelnemer, gewezen deelnemer of pensioengerechtigde geeft de mate weer waarin hij
      beleggingsrisico kan en wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar en indien een
      belangrijke gebeurtenis daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel75b
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel14d
