  - number: '2'
    text: |-
      1 De informatie over de kenmerken van de pensioenregeling en de uitvoering van de pensioenregeling, bedoeld in
      [artikel 21 van de Pensioenwet][ref1] dan wel [artikel 48 van de Wet verplichte beroepspensioenregeling][ref2],
      bevat in ieder geval het volgende:

      a. de pensioensoorten waarin de basispensioenregeling voorziet;

      b. de pensioensoorten waarin de basispensioenregeling niet voorziet;

      c. de wijze waarop pensioen wordt opgebouwd;

      d. de keuzemogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling voorziet;

      e. de risico’s;

      f. de soorten uitvoeringskosten; en

      g. de beleidsdekkingsgraad met een omschrijving van de gevolgen ervan.

      2 De uitvoerder maakt bij het verstrekken van de informatie, bedoeld in het eerste lid, gebruik van de opschriften
      en iconen in de volgorde waarin ze staan in laag 1 van de Pensioen1-2-3, zoals deze op de website van de
      Pensioenfederatie en het Verbond van Verzekeraars is opgenomen.

      3 Ten behoeve van de vergelijkbaarheid van de pensioenregeling wordt de informatie, bedoeld in het eerste lid,
      onderdelen a en b, en informatie over de jaarlijkse pensioenopbouw, de risico’s en de beleidsdekkingsgraad
      tevens verstrekt met gebruikmaking van sjablonen die op de website van de Pensioenfederatie en het Verbond van
      Verzekeraars zijn opgenomen.

      4 Bij ministeriële regeling worden regels gesteld over de opschriften, iconen en sjablonen, bedoeld in het tweede
      en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel2
