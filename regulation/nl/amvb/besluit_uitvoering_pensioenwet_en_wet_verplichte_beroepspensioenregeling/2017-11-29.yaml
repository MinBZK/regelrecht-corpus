  - number: '55'
    text: |-
      1 De standaardmodellen, bedoeld in [artikel 7d][ref1], worden gebruikt vanaf 1 januari 2018.

      2 Een verzekeraar of premiepensioeninstelling voldoet uiterlijk 1 januari 2018 aan [artikel 14b][ref2] en
      [artikel 14d, eerste en tweede lid][ref3].

      3 De bevoegdheid van De Nederlandsche Bank, bedoeld in [artikel 14d, derde lid, vierde zin][ref4], is tot 1 januari
      2018 niet van toepassing ten aanzien van op het tijdstip van inwerkingtreding van de Wet verbeterde premieregeling
      bestaande pensioenregelingen.

      4 Een uitvoerder voldoet uiterlijk 1 januari 2018 aan [artikel 14d, vierde en vijfde lid][ref5].


