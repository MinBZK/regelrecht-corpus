  - number: '22'
    text: |-
      De deelnemer kan voor het einde van de termijn genoemd in [artikel 21, eerste lid][ref1], verzoeken om een
      aanvullende opgave voor het geval de waarde van het partnerpensioen niet wordt overgedragen. De termijnen, genoemd
      in de [artikelen 18 tot en met 21, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel22
