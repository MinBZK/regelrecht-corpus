  - number: '35'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 31][ref1], in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de [Pensioenwet][ref2] en de [Wet verplichte beroepspensioenregeling][ref3] beogen te
      beschermen; en

      c. de overige belangen van het fonds en de betrokkene.


