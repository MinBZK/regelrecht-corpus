  - number: 7c
    text: |-
      1 Bij de informatie die wordt verstrekt over een variabele uitkering, bedoeld in de
      [artikelen 44a, eerste lid][ref1], of [63b, tweede lid, van de Pensioenwet][ref2] dan wel de
      [artikelen 55a, eerste lid][ref3], of [75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref4], geldt
      het volgende:

      a. een uitvoerder die één uniform beleggingsprofiel hanteert, vermeldt dit;

      b. een uitvoerder die meerdere beleggingsprofielen hanteert, baseert de opgave van de hoogte van de variabele
      uitkeringen op het beleggingsprofiel dat passend is gezien het risicoprofiel van de deelnemer of gewezen deelnemer.

      2 De uitvoerder die geen vastgestelde uitkeringen uitvoert, geeft bij de opgave van de hoogte van
      de vastgestelde uitkeringen, bedoeld in [artikel 44a, eerste lid, van de Pensioenwet][ref5] dan wel
      [artikel 55a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6], aan dat een vastgestelde uitkering
      naar verwachting lager is dan een variabele uitkering maar met minder of geen kans op afwijking.

      3 Bij de opgave van de hoogte van de variabele uitkeringen voorafgaand aan de eerste toetreding
      tot de toedelingskring, bedoeld in [artikel 63b, vijfde lid, van de Pensioenwet][ref7] dan wel
      [artikel 75b, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref8] is [artikel 9][ref9] van toepassing.


