        artikel: 75a
  - number: 17b
    text: |-
      De risicovrije rente, bedoeld in [artikel 63a, derde, zevende en achtste lid, van de Pensioenwet][ref1],
      [artikel 75a, derde, zevende en achtste lid, van de Wet verplichte beroepspensioenregeling][ref2], en artikel 17a,
      eerste lid, is de risicovrije rente voor fondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel17b
