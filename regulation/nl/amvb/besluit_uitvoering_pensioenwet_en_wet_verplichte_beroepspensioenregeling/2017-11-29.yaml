  - number: 40b
    text: |-
      1 De Nederlandsche Bank verleent op aanvraag een vergunning als bedoeld in
      [artikel 112a, tweede lid, van de Pensioenwet][ref1]. Deze aanvraag wordt gedaan met gebruikmaking van een daartoe
      door De Nederlandsche Bank beschikbaar gesteld formulier.

      2 De Nederlandsche Bank bericht de aanvrager onverwijld van de ontvangst van de aanvraag.

      3 De Nederlandsche Bank beslist binnen dertien weken na ontvangst op de aanvraag.

      4 De Nederlandsche Bank stelt de Autoriteit Financiële Markten in de gelegenheid te adviseren over
      gedragstoezichtaspecten van de vergunningaanvraag.

      5 De gegevens, bedoeld in [artikel 40c][ref2], worden in zodanige vorm verstrekt dat een goede beoordeling door De
      Nederlandsche Bank mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel40c
