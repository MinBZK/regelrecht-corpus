  - number: '24'
    text: |-
      Overschrijding van de in dit hoofdstuk gestelde termijnen door de overdragende of ontvangende uitvoerder wordt de
      deelnemer niet tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel24
  - number: '25'
    text: |-
      1 De overdrachtswaarde van pensioenaanspraken is ten minste gelijk aan de contante waarde van de over te dragen
      pensioenaanspraken op de overdrachtsdatum en wordt berekend op basis van het standaardtarief. Onze Minister stelt
      regels inzake het standaardtarief. Het standaardtarief wordt berekend op basis van marktwaardering.

      2 Indien de overdrachtswaarde niet op basis van het standaardtarief berekend kan worden, worden de
      pensioenaanspraken met behoud van de actuariële gelijkwaardigheid eerst omgezet in pensioenaanspraken waarop het
      standaardtarief wel toegepast kan worden.

      3 Bij de berekening van de overdrachtswaarde mogen buiten beschouwing blijven:

      a. partnerpensioen dat is verzekerd op risicobasis, wezenpensioen en arbeidsongeschiktheidspensioen; en

      b. aanspraken op partnerpensioen of nettopensioen die achterblijven bij de overdragende uitvoerder.

      4 De overdrachtswaarde wordt, in afwijking van het eerste lid, niet berekend op basis van het standaardtarief
      indien de pensioenaanspraken voortvloeien uit:

      a. een kapitaalovereenkomst of kapitaalregeling;

      b. een premieovereenkomst of premieregeling, waarbij de premie wordt belegd; of

      c. een premieovereenkomst of premieregeling waarbij de premie wordt aangewend voor de aankoop van een verzekerd
      kapitaal.

      5 Onze Minister stelt regels voor de berekening van de overdrachtswaarde in de in het vierde lid genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel25
  - number: '26'
    text: |-
      Indien bij een uitkeringsovereenkomst, een uitkeringsregeling of een premieovereenkomst of premieregeling
      waarbij de premie onmiddellijk na het beschikbaar stellen wordt omgezet in een aanspraak op een uitkering de
      overdrachtswaarde niet gelijk is aan de waarde van het gefinancierde deel van de aanspraken, komt het verschil ten
      gunste, respectievelijk ten laste, van de oude werkgever of van het fonds waar de regeling was ondergebracht.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel26
  - number: '27'
    text: |-
      1 Onze Minister stelt regels voor de berekening van de inkoop van pensioenaanspraken op grond van de
      overdrachtswaarde in de pensioenregeling van de ontvangende uitvoerder.

      2 In geval van waardeoverdracht naar een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      wordt de overdrachtswaarde binnen een week na ontvangst van de overdrachtswaarde aangewend voor de aankoop van
      beleggingseenheden.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel27
  - number: '28'
    text: |-
      1 De na waardeoverdracht verkregen aanspraken in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder,
      worden behandeld alsof zij in die regeling zelf zijn opgebouwd, waarbij zij ook ten aanzien van de toeslagverlening
      op dezelfde manier behandeld worden.

      2 Indien de ontvangende uitvoerder een beroepspensioenregeling uitvoert, kan worden afgeweken van het eerste lid
      ten aanzien van de toeslagverlening indien toepassing van het eerste lid op dat punt zou leiden tot een kennelijk
      onredelijk resultaat.

      3 Indien in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder, pensioenopbouw plaatsvindt op basis
      van dienstjaren, wordt de overdrachtswaarde omgezet in voor de pensioenopbouw meetellende dienstjaren.

      4 In een pensioenregeling die voor de pensioenopbouw rekent met een maximaal te bereiken aantal dienstjaren, geldt
      dat, indien toepassing van het tweede lid leidt tot meer dan het maximale aantal dienstjaren, het meerdere wordt
      behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel28
  - number: 28a
    text: |-
      1 De voorzitter van een omgekeerd gemengd bestuur als bedoeld in [artikel 99 van de Pensioenwet][ref1] bepaalt de
      agenda van de overleggen van het bestuur en het niet uitvoerend deel van het bestuur.

      2 De voorzitter van een omgekeerd gemengd bestuur ziet toe op een goede samenstelling en het functioneren van het
      bestuur en is namens het bestuur eerste aanspreekpunt voor het verantwoordingsorgaan over het functioneren van
      het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28b
    text: |-
      1 De niet uitvoerende bestuurders bij een omgekeerd gemengd bestuur als bedoeld in
      [artikel 99 van de Pensioenwet][ref1] stellen een auditcommissie bedrijfseconomische aspecten en risicobeheer in.
      Deze auditcommissie is in ieder geval belast met toezicht op:

      a. de risicobeheersing;

      b. het beleggingsbeleid;

      c. de financiële informatieverschaffing door het fonds.

      2 De Nederlandsche Bank kan ontheffing verlenen van het eerste lid indien op andere wijze wordt voorzien in
      adequaat toezicht op het in het vorige lid genoemde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28c
    text: |-
      1 De raad van toezicht van een fonds kan de bestuurders van het fonds schorsen of ontslaan wegens disfunctioneren.

      2 Van disfunctioneren als bedoeld in het eerste lid is in ieder geval sprake indien het bestuur een
      besluit heeft genomen zonder de op grond van [artikel 104, derde lid, van de Pensioenwet][ref1] of
      [artikel 110a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] benodigde goedkeuring van de raad
      van toezicht en het bestuur niet aannemelijk maakt dat dit nodig was in het belang van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden dan wel voortvloeit uit een aanwijzing van de
      toezichthouder, een last onder dwangsom of rechtstreeks voortvloeit uit een wettelijk voorschrift.

      3 Het bestuur van een fonds legt de benoeming van een kandidaat bestuurder voor aan de raad van toezicht. De raad
      van toezicht kan de benoeming van deze kandidaat bestuurder beletten indien deze niet voldoet aan de profielschets.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110a
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110a
  - number: '29'
    text: |-
      1 De Nederlandsche Bank toetst de geschiktheid en de betrouwbaarheid van een persoon die het beleid
      van een fonds bepaalt of mede bepaalt, bedoeld in [artikel 106 van de Pensioenwet][ref1] dan wel
      [artikel 110c van de Wet verplichte beroepspensioenregeling][ref2], voorafgaand aan de benoeming van deze persoon
      en op ieder ander moment, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding toe bestaat.

      2 De Nederlandsche Bank toetst de geschiktheid en betrouwbaarheid van een persoon die het intern toezicht
      van een fonds door een visitatiecommissie uitoefent, bedoeld in [artikel 106 van de Pensioenwet][ref3] dan
      wel [artikel 110c van de Wet verplichte beroepspensioenregeling][ref4], indien daar, naar het oordeel van de
      Nederlandsche Bank, aanleiding toe bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel29
    references:
