  - number: '54'
    text: |-
      1 Tot het tijdstip, bedoeld in [artikel IV van de Wet verbeterde premieregeling][ref1], wordt bij de informatie,
      die op grond van de [artikelen 44a][ref2] en [63b van de Pensioenwet][ref3] dan wel de [artikelen 55a][ref4] en
      [75b van de Wet verplichte beroepspensioenregeling][ref5] wordt verstrekt, tevens het risico ten aanzien van de
      hoogte van de variabele uitkering weergegeven op basis van drie rendementen.

      2 De opgave van de hoogte van de variabele uitkeringen en het risico heeft betrekking op de pensioendatum en tien
      jaar na de pensioendatum.

      3 De Nederlandsche Bank stelt de scenario’s voor de vaststelling van de drie rendementen beschikbaar.


