  - number: 9c
    text: |-
      1 Op voordracht van de uitvoerders en na advies van de Autoriteit Financiële Markten stelt Onze Minister de
      modellen voor het uniform pensioenoverzicht vast.

      2 De modellen voor het uniform pensioenoverzicht worden beschikbaar gesteld op de website van de Pensioenfederatie
      en het Verbond van Verzekeraars.

      3 Een uitvoerder verstrekt een uniform pensioenoverzicht voor deelnemers aan een ieder die in de gehele of in een
      deel van de voor het uniform pensioenoverzicht relevante periode deelnemer bij die pensioenuitvoerder was.

      4 In afwijking van het derde lid kan de pensioenuitvoerder afzien van verstrekking van een uniform
      pensioenoverzicht voor deelnemers aan degene die op het eind van de, voor dit pensioenoverzicht, relevante periode
      geen deelnemer bij de pensioenuitvoerder meer is, indien:

      a. in de informatie die wordt verstrekt bij beëindiging van de deelneming of bij de pensioeningang een opgave
      van de aan het lopende kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen is opgenomen; of

      b. in het uniform pensioenoverzicht voor gewezen deelnemers verstrekt in het kalenderjaar na het jaar waarin de
      deelneming is beëindigd een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van
      pensioenaanspraken overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref2] en de daarop berustende
      bepalingen is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel9c
