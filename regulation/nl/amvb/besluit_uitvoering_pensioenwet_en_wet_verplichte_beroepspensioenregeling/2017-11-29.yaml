  - number: 9b
    text: |-
      1 De informatie over uitvoeringskosten, bedoeld in [artikel 46a, eerste lid, onderdeel c, van de Pensioenwet][ref1]
      dan wel [artikel 57a, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref2], betreft:

      a. de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref3];

      b. de kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref4]; en

      c. de transactiekosten, bedoeld in [artikel 10a, derde lid][ref5].

      2 De informatie over uitvoeringskosten die op de website wordt geplaatst betreft:

      a. voor fondsen en premiepensioeninstellingen: de administratieve uitvoeringskosten als bedrag per deelnemer of
      pensioengerechtigde en de kosten van vermogensbeheer en de transactiekosten als percentage van het gemiddeld belegd
      vermogen;

      b. voor verzekeraars: de administratieve uitvoeringskosten als bedrag per deelnemer of pensioengerechtigde en de
      kosten van vermogensbeheer en de transactiekosten:

      1°. bij uitkeringsovereenkomsten en kapitaalovereenkomsten dan wel uitkeringsregelingen en kapitaalregelingen,
      indien de kosten van invloed zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld
      belegd vermogen, en indien de kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht, met
      vermelding dat deze kosten niet zijn opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het
      pensioenrecht;

      2°. bij premieovereenkomsten of premieregelingen waarbij de premie wordt belegd tot de pensioendatum als percentage
      van het gemiddeld belegd vermogen en bij overige premieovereenkomsten of premieregelingen, indien de kosten van
      invloed zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld belegd vermogen, en
      indien de kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht, met vermelding dat deze kosten
      niet zijn opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het pensioenrecht;

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.


