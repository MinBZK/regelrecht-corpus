  - number: '5'
    text: |-
      1 De informatie over vermindering van pensioenaanspraken en pensioenrechten
      die op grond van de [artikelen 38, eerste lid, onderdeel d][ref1], en
      [44, eerste lid, onderdeel d, van de Pensioenwet][ref2], de [artikelen 49, eerste lid, onderdeel d][ref3],
      en [55, eerste lid, onderdeel d, van de Wet verplichte beroepspensioenregeling][ref4] en
      [artikel 2, eerste lid, onderdeel e, en derde lid][ref5], wordt verstrekt heeft betrekking op de vermindering van
      pensioenaanspraken en pensioenrechten die in de laatste drie jaar is doorgevoerd.

      2 De informatie over vermindering van pensioenaanspraken en pensioenrechten die op grond
      van de [artikelen 39, eerste lid, onderdeel e][ref6], [40, eerste lid, onderdeel c][ref7],
      [41, eerste lid, onderdeel d][ref8], [42, eerste lid, onderdeel c][ref9],
      [43, eerste lid, onderdeel d][ref10], en [45, eerste lid, onderdeel d, van de Pensioenwet][ref11]
      en de [artikelen 50, eerste lid, onderdeel e][ref12], [51, eerste lid, onderdeel c][ref13],
      [52, eerste lid, onderdeel d][ref14], [53, eerste lid, onderdeel c][ref15], [54, eerste lid, onderdeel d][ref16],
      en [56, eerste lid, onderdeel d, van de Wet verplichte beroepspensioenregeling][ref17] wordt verstrekt heeft
      betrekking op de vermindering van pensioenaanspraken en pensioenrechten die in de laatste vijf jaar is doorgevoerd.

      3 De informatie over vermindering van pensioenaanspraken en pensioenrechten die
      op grond van [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref18] en
      [artikel 57a, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref19], wordt verstrekt of
      beschikbaar gesteld heeft betrekking op de vermindering van pensioenaanspraken en pensioenrechten die in de laatste
      tien jaar is doorgevoerd.


