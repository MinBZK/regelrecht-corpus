  - number: 10c
    text: |-
      1 Bij de regeling over de kosten die verband houden met de uitvoering van de pensioenregeling die volgens de
      uitvoeringsovereenkomst of het uitvoeringsreglement in mindering kunnen worden gebracht of kunnen worden verhaald
      op een afgescheiden vermogen van een algemeen pensioenfonds of ten laste kunnen worden gebracht van de premie,
      wordt onderscheid gemaakt tussen:

      a. administratieve uitvoeringskosten als bedoeld in [artikel 10a, eerste lid][ref1];

      b. vermogensbeheerskosten als bedoeld in [artikel 10a, tweede lid][ref2];

      c. transactiekosten als bedoeld in [artikel 10a, derde lid][ref3]; en

      d. kosten, met inbegrip van schulden aan derden, die voortvloeien uit het beheer van het vermogen van de
      desbetreffende collectiviteitkring.

      2 Overige kosten die verband houden met de uitvoering van de pensioenregeling en niet als kosten in de zin van een
      van de categorieën, bedoeld in het eerste lid, kunnen worden toebedeeld worden volgens een vaste verdeelsleutel
      over de categorieën, bedoeld in het eerste lid, onderdeel a en b verdeeld. Daarbij worden deze kosten nader
      gespecificeerd.

      3 De wijze waarop de kosten, bedoeld in het eerste en tweede lid, worden bepaald is volledig en duidelijk
      gespecificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
