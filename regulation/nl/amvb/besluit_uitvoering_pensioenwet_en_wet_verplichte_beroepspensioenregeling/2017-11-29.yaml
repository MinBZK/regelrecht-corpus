    text: |-
      1 Per geboden keuzemogelijkheid als bedoeld in [artikel 60][ref1], [61][ref2] of [62 van de Pensioenwet][ref3]
      dan wel [artikel 72][ref4], [73][ref5], [74 van de Wet verplichte beroepspensioenregeling][ref6], wordt door
      de pensioenuitvoerder voor een door hem te bepalen periode voor alle deelnemers en gewezen deelnemers dezelfde
      ruilvoet of opbouwkeuzevoet vastgesteld.

      2 De ruilvoet en opbouwkeuzevoet worden zodanig vastgesteld dat sprake is van collectieve actuariële
      gelijkwaardigheid als bedoeld in de [artikelen 60, vijfde lid][ref7], [61, vierde lid][ref8], en
      [62, eerste lid, van de Pensioenwet][ref9] dan wel [artikel 72, vijfde lid][ref10], [73, vierde lid][ref11] en
      [74, eerste lid, van de Wet verplichte beroepspensioenregeling][ref12].

      3 In afwijking van het eerste lid kan aan een gewezen deelnemer de ruilvoet worden toegekend, die geldt op de dag
      van beëindiging van de deelneming.


