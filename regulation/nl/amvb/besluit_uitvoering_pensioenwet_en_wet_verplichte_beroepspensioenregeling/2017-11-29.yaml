        artikel: 19b
        hoofdstuk: '6'
  - number: 19a
    text: |-
      1 De in [artikel 71 van de Pensioenwet][ref1] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref2] genoemde plicht tot waardeoverdracht geldt niet
      indien een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is en voldaan is aan de volgende
      voorwaarden:

      a. de aanvullende bijdrage bedraagt meer dan € 15.000,– en meer dan 10% van de overdrachtswaarde; en

      b. de betreffende werkgever is een kleine werkgever.

      2 Een kleine werkgever als bedoeld in het eerste lid, onderdeel b, is een werkgever te wiens laste, in het tweede
      kalenderjaar dat aan het kalenderjaar waarin de in het derde lid bedoelde situatie wordt vastgesteld vooraf is
      gegaan, een premieplichtig loon als bedoeld in [artikel 2.5, eerste lid, onderdeel a, van het Besluit Wfsv][ref3],
      is gekomen dat gelijk is aan of minder bedraagt dan 25 maal het door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde gemiddelde premieplichtige loon per werknemer in dat kalenderjaar.

      3 Indien de overdragende pensioenuitvoerder bij vaststelling van de opgave of voorlopige opgave, bedoeld in
      [artikel 18][ref4] of de ontvangende pensioenuitvoerder na ontvangst van de opgave of voorlopige opgave, bedoeld
      in artikel 18, vaststelt dat een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is die meer
      bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde, stelt hij de betreffende werkgever in de
      gelegenheid om binnen een maand na ontvangst van het daartoe strekkende verzoek aan te tonen dat de werkgever een
      kleine werkgever is als bedoeld in het eerste lid, onderdeel b. Tevens wordt de betreffende werkgever gevraagd
      of hij, indien hij een kleine werkgever is, bereid is de aanvullende bijdrage te betalen. De overdragende
      pensioenuitvoerder informeert de ontvangende pensioenuitvoerder terstond na afloop van de gegeven termijn over
      hetgeen van de oude werkgever is vernomen.

      4 Indien de werkgever niet binnen de gegeven termijn aantoont een kleine werkgever te zijn als bedoeld in het
      eerste lid, onderdeel b, wordt aangenomen dat hij geen kleine werkgever is.

      5 Indien op grond van de voorgaande leden de plicht tot waardeoverdracht niet geldt en de werkgever niet bereid
      is de aanvullende bijdragen te betalen, informeert de ontvangende pensioenuitvoerder de deelnemer hierover
      schriftelijk.

      6 Dit artikel is uitsluitend van toepassing indien de verwerving van pensioenaanspraken door de deelnemer in de
      door de ontvangende uitvoerder uitgevoerde pensioenregeling voor 1 januari 2015 een aanvang heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2.5
      [ref4]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel19a
    references:
