  - number: 9e
    text: |-
      1 Een vermindering van de pensioenaanspraken en pensioenrechten wordt door de uitvoerders binnen vier maanden
      verwerkt in de gegevens die door middel van het pensioenregister worden verstrekt.

      2 Een andere wijziging van de pensioenaanspraken en pensioenrechten dan bedoeld in het eerste lid wordt door de
      uitvoerders binnen vier maanden nadat de wijziging in de administratie van de uitvoerders is doorgevoerd verwerkt
      in de gegevens die door middel van het pensioenregister worden verstrekt.

      3 Het pensioenregister geeft in ieder geval inzicht in de hoogte van het te bereiken pensioen door:

      a. weergave in netto bedragen per maand en in bruto bedragen per jaar;

      b. de mogelijkheid om ter vergelijking het huidige netto inkomen per maand in te voeren.

      4 Met betrekking tot de keuzes ten aanzien van ouderdomspensioen worden in ieder geval de indicatieve gevolgen op
      het pensioeninkomen getoond van het vervroegen of uitstellen van de pensioeningangsdatum.

      5 Met betrekking tot belangrijke gebeurtenissen worden in ieder geval bij nabestaandenpensioen de gevolgen getoond
      van overlijden op het moment van de uitvraag, na beëindiging van de deelneming en na pensionering.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel9e
  - number: 9f
    text: |-
      1 [Artikel 9e, derde lid, onderdeel b][ref1], wordt gerealiseerd met ingang van 1 januari 2016.

      2 [Artikel 9e, eerste lid, en tweede lid][ref2], voor zover het betreft een collectieve wijziging, worden
      gerealiseerd met ingang van 1 maart 2016.

      3 [Artikel 9e, vierde en vijfde lid][ref3], worden gerealiseerd met ingang van 1 juli 2016.

      4 [Artikel 9e, tweede lid][ref4], voor zover het betreft een individuele wijziging, wordt gerealiseerd met ingang
      van 1 juli 2017.


