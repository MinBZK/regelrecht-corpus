  - number: '7'
    text: |-
      De uitvoerder verstrekt de gewezen partner bij scheiding informatie over de mogelijkheid van afkoop, bedoeld in
      [artikel 68 van de Pensioenwet][ref1] dan wel [artikel 80 van de Wet verplichte beroepspensioenregeling][ref2],
      voor zover sprake is van een pensioenaanspraak onder de afkoopgrens.


