  - number: '21'
    text: |-
      1 Indien de deelnemer gebruik wil maken van zijn recht op waardeoverdracht, dient hij binnen twee maanden
      na ontvangst van de opgave of voorlopige opgave, bedoeld in [artikel 18][ref1], en, indien van toepassing,
      [artikel 22][ref2], een verzoek tot waardeoverdracht in bij de ontvangende uitvoerder.

      2 Pensioenaanspraken die door de rechthebbende zijn of worden verkregen op grond van de FVP-bijdrage worden geacht
      inbegrepen te zijn in het verzoek, bedoeld in het eerste lid.

      3 Indien de partner die begunstigde is voor het partnerpensioen niet instemt met het verzoek tot
      waardeoverdracht met betrekking tot het partnerpensioen, is [artikel 58 van de Pensioenwet][ref3] dan wel
      [artikel 69 van de Wet verplichte beroepspensioenregeling][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel69
