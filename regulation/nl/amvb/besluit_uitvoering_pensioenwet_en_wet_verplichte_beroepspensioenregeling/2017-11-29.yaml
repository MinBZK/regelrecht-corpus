  - number: '9'
    text: |-
      1 De opgave van de reglementair te bereiken pensioenaanspraken bevat:

      a. in geval van een uitkeringsovereenkomst dan wel uitkeringsregeling een opgave van de hoogte van het periodiek
      uit te keren pensioen vanaf de ingangsdatum van het pensioen;

      b. in geval van een kapitaalovereenkomst dan wel kapitaalregeling een opgave van de hoogte van het voor periodieke
      uitkeringen aan te wenden kapitaal op de ingangsdatum van het pensioen en een indicatie van de hoogte van de
      periodieke uitkeringen op de pensioendatum wanneer het kapitaal daarvoor wordt aangewend; of

      c. in geval van een premieovereenkomst dan wel premieregeling:

      1°. wanneer de premie wordt belegd, een indicatie van het te bereiken voor periodieke uitkeringen aan te wenden
      kapitaal op de pensioendatum met de daarbij gehanteerde veronderstellingen en een indicatie van de hoogte van de
      periodieke uitkeringen op de pensioendatum wanneer het kapitaal daarvoor wordt aangewend;

      2°. de hoogte van de periodieke uitkering wanneer de premie voor de ingangsdatum van het pensioen reeds daarvoor
      wordt aangewend; of

      3°. de hoogte van het voor periodieke uitkeringen aan te wenden verzekerd kapitaal wanneer de premie voor de
      ingangsdatum van het pensioen reeds daarvoor wordt aangewend en een indicatie van de hoogte van de periodieke
      uitkeringen op de pensioendatum wanneer het kapitaal daarvoor wordt aangewend.

      2 Bij de indicatie van de hoogte van de periodieke uitkeringen, bedoeld in het eerste lid, onderdeel b, en
      onderdeel c, onder 1° en 3°, worden de op het moment van het verzoek bij de pensioenuitvoerder geldende tarieven
      gehanteerd. De periodieke uitkeringen worden gecorrigeerd voor te verwachten prijsinflatie. Bij regeling van
      Onze Minister wordt bepaald met welke te verwachten prijsinflatie gecorrigeerd wordt. Bij het verstrekken van de
      indicatie wijst de pensioenuitvoerder er op dat het risico dat de definitieve pensioenuitkering afwijkt van de
      indicatie bij de betrokkene ligt.

      3 Bij de in het eerste lid bedoelde opgave wordt ten aanzien van nabestaandenpensioen aangegeven wat de
      consequenties zijn van de gekozen wijze van financieren.
    url: https://wetten.overheid.nl/BWBR0020892/2017-11-29#Artikel9
  - number: 9a
    text: |-
      1 Indien sprake is van een premieovereenkomst dan wel premieregeling waarbij de deelnemer tijdens de opbouwperiode
      de verantwoordelijkheid voor de beleggingen heeft overgenomen verstrekt de uitvoerder op verzoek van de deelnemer
      en de gewezen deelnemer informatie over alle beleggingsmogelijkheden, de feitelijke beleggingsportefeuille, de
      risicopositie en de kosten in verband met de beleggingen.

      2 De uitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde op
      verzoek:

      a. informatie over het van toepassing zijn van een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref1]
      dan wel [artikel 166 van de Wet verplichte beroepspensioenregeling][ref2]; en

      b. informatie over de aanstelling van een bewindvoerder als bedoeld in [artikel 173 van de Pensioenwet][ref3] dan
      wel [artikel 168 van de Wet verplichte beroepspensioenregeling][ref4].

      3 De uitvoerder verstrekt de deelnemer of gewezen deelnemer op verzoek informatie over de consequenties van uitruil
      als bedoeld in [artikel 60][ref5], [61][ref6] of [62 van de Pensioenwet][ref7] dan wel de [artikelen 72][ref8],
      [73][ref9] of [74 van de Wet verplichte beroepspensioenregeling][ref10] voor de deelnemer.


