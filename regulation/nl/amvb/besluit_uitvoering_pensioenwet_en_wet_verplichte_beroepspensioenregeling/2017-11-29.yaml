    text: |-
      1 De uitvoering van het nettopensioen door een fonds voldoet aan de volgende voorwaarden:

      a. ouderdomspensioen of nabestaandenpensioen op opbouwbasis heeft het karakter van een premieovereenkomst of
      premieregeling waarbij het fonds het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de
      daarop behaalde rendementen belegt tot een onder b genoemd moment van omzetting;

      b. omzetting van het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde
      rendementen in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering kan plaatsvinden op
      het moment dat de deelnemer overlijdt, gepensioneerde of gewezen deelnemer wordt of in de tien jaren voorafgaand
      aan de pensioendatum op basis van een kostendekkend tarief;

      c. de omzetting van het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop
      behaalde rendementen in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering vindt plaats
      door inkoop in de basispensioenregeling waarbij:

      1°. uitsluitend rekening wordt gehouden met de levensverwachting van de groep deelnemers aan het nettopensioen; en

      2°. het nettopensioen een voorwaardelijke toeslagverlening kent;

      d. ingeval de verplichtingen van het fonds ten aanzien van het nettopensioen toenemen als gevolg van een verschil
      in de stijging van de levensverwachting tussen de deelnemers aan het nettopensioen en de deelnemers aan de
      basispensioenregeling, vermindert het fonds de voorwaardelijke toeslagverlening bij het nettopensioen totdat deze
      toename van de verplichtingen bij het nettopensioen is gecompenseerd;

      e. ingeval het fonds een incidentele bijstorting ontvangt van de werkgever vermindert het fonds de voorwaardelijke
      toeslagverlening bij het nettopensioen, voor zover deze storting ten goede is gekomen aan het nettopensioen;

      f. in geval van een nabestaandenpensioen op risicobasis of een premievrijstelling in verband met
      arbeidsongeschiktheid stelt het fonds de hierop betrekking hebbende premie vast rekening houdend met de kenmerken
      van de groep deelnemers aan het nettopensioen;

      g. het fonds rekent de kosten behorend bij het nettopensioen apart toe;

      h. het fonds houdt voor het nettopensioen een gescheiden administratie bij, waaruit ten minste blijken:

      1°. de voor het nettopensioen ingelegde premies;

      2°. de met de beschikbaar gestelde premies behaalde rendementen;

      3°. de waarde van de pensioenverplichtingen;

      4°. de actuariële gegevens over de groep deelnemers aan het nettopensioen die ten grondslag liggen aan de premie
      en aan de waardering van de pensioenverplichtingen, waaronder de geschatte levensverwachting en risico’s op
      arbeidsongeschiktheid en vooroverlijden;

      5°. de toeslagverlening en de toepassing van de onderdelen d en e.

      2 Voor de toepassing van het eerste lid, onderdeel b, zijn de [artikelen 128, eerste lid, van de Pensioenwet][ref1]
      en [123, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] van toepassing op het nettopensioen
      rekening houdend met tariefgrondslagen passend bij de groep deelnemers aan het nettopensioen.

      3 Het eerste lid is niet van toepassing voor zover het ouderdomspensioen, nabestaandenpensioen of
      premievrijstelling bij arbeidsongeschiktheid is verzekerd bij een verzekeraar.

      4 Het eerste lid, onderdelen a, b, c, d, e, h, onder 5, en het tweede lid, zijn niet van toepassing indien en voor
      zover voldaan wordt aan de volgende voorwaarden:

      a. ouderdomspensioen of nabestaandenpensioen op opbouwbasis heeft het karakter van een premieovereenkomst of
      premieregeling waarbij het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop
      behaalde rendementen wordt gebruikt voor financiering van een variabele uitkering die kan variëren door de
      verwerking van financiële mee – of tegenvallers als gevolg van het beleggingsrisico en die varieert door de
      verwerking van financiële mee – of tegenvallers als gevolg van de ontwikkeling van het sterfteresultaat en de
      ontwikkeling van de levensverwachting;

      b. voor de ontwikkeling van het sterfteresultaat en de ontwikkeling van de levensverwachting wordt uitsluitend
      rekening gehouden met het sterfteresultaat en de levensverwachting van de groep deelnemers aan het nettopensioen;

      c. de waarde van de met de risicovrije rente contant gemaakte verwachte kasstromen is gelijk aan het
      pensioenkapitaal op pensioendatum.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel123
