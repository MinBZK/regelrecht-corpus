  - number: 35a
    text: |-
      1 Tot bestuurder of lid van de raad van toezicht van een fonds kunnen in ieder geval niet worden benoemd personen
      die door deze benoeming meer dan 1 voltijd equivalent aan werkzaamheden als bestuurder of in een toezichthoudend
      orgaan zouden verrichten.

      2 Voor de toepassing van het eerste lid telt als voltijd equivalent bij rechtspersonen een functie als:

      a. bestuursvoorzitter of bestuurder ten minste als 0,6;

      b. voorzitter van een toezichthoudend orgaan ten minste als 0,4; en

      c. lid van een toezichthoudend orgaan ten minste als 0,2.

      3 Voor de toepassing van het eerste lid telt als voltijd equivalent bij grote fondsen een functie als:

      a. bestuursvoorzitter ten minste als 0,6;

      b. bestuurder ten minste als 0,4;

      c. voorzitter van een raad van toezicht ten minste als 0,2; en

      d. lid van een raad van toezicht ten minste als 0,1.

      4 Voor de toepassing van het eerste lid telt als voltijd equivalent bij kleine fondsen een functie als:

      a. bestuursvoorzitter ten minste als 0,3;

      b. bestuurder ten minste als 0,2;

      c. voorzitter van een raad van toezicht ten minste als 0,2; en

      d. lid van een raad van toezicht ten minste als 0,1.

      5 Voor de toepassing van dit artikel:

      a. wordt verstaan onder een klein fonds: een fonds met een beheerd vermogen van niet meer dan € 10 miljard;

      b. wordt verstaan onder een groot fonds: een fonds met meer dan € 10 miljard beheerd vermogen;

      c. betreft de verwijzing naar rechtspersonen de rechtsvorm van de naamloze vennootschap en de besloten
      vennootschap met beperkte aansprakelijkheid die op twee opeenvolgende balansdata, zonder onderbreking
      nadien op twee opeenvolgende balansdata, niet heeft voldaan aan ten minste twee van de vereisten, bedoeld in
      [artikel 397, eerste en tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1], onderscheidenlijk de stichting,
      bedoeld in [artikel 297a, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], niet zijnde een fonds;

      d. telt de benoeming bij verschillende rechtspersonen die met elkaar in een groep zijn verbonden, als één
      benoeming;

      e. wordt verstaan onder toezichthoudend orgaan: een raad van toezicht, een raad van commissarissen of indien bij
      een rechtspersoon de bestuurstaken zijn verdeeld over uitvoerende en niet-uitvoerende bestuurders, niet uitvoerende
      bestuurders;

      f. geldt een tijdelijke aanstelling overeenkomstig [artikel 349a, tweede lid][ref3], of
      [artikel 356, onder c, van Boek 2 van het Burgerlijk wetboek][ref4], niet als benoeming.

      6 De nietigheid van de benoeming op grond van de vorige leden heeft geen gevolgen voor de rechtsgeldigheid van de
      besluitvorming waaraan is deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel397
