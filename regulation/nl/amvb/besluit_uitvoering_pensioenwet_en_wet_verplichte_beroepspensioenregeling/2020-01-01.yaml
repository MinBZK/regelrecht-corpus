      [76, derde en negende lid][ref13], voor zover het de opgave van pensioenaanspraken betreft,
      [83, tweede, lid, onderdeel a][ref14], voor zover het betrekking heeft op het informeren van de daarin genoemde
      personen en [134, tweede lid van de Pensioenwet][ref15].


