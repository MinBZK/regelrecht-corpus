  - number: '52.2'
    text: |-
      In aanvulling op [artikel 22, eerste lid, van de Invoerings- en aanpassingswet Pensioenwet][ref1]
      blijft, tot de datum van inwerkingtreding van de [artikelen 38 tot en met 45 van de Pensioenwet][ref2],
      [artikel 8a, vierde lid, van de Pensioen- en spaarfondsenwet][ref3] van toepassing.


