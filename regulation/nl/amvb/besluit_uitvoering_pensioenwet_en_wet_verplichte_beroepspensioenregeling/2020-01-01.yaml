  - number: 40a.2
    text: |-
      De publicatie van de gegevens, bedoeld in het eerste lid, geschiedt niet eerder dan nadat tien werkdagen zijn
      verstreken na de dag waarop aan het fonds het besluit tot publicatie bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40a
  - number: 40a.3
    text: |-
      Bij periodieke publicatie van de gegevens, bedoeld in het eerste lid, wordt jaarlijks aan het fonds, voorafgaand
      aan de eerste publicatie in dat jaar, het besluit tot publicatie bekend gemaakt, waarbij vermeld wordt op welke
      data de gegevens in dat jaar gepubliceerd zullen worden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40a
  - number: 40a.4
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de publicatie opgeschort totdat de
      voorzieningenrechter een uitspraak heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 40b.1
    text: |-
      De Nederlandsche Bank verleent op aanvraag een vergunning als bedoeld in
      [artikel 112a, tweede lid, van de Pensioenwet][ref1]. Deze aanvraag wordt gedaan met gebruikmaking van een daartoe
      door De Nederlandsche Bank beschikbaar gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40b.2
    text: De Nederlandsche Bank bericht de aanvrager onverwijld van de ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40b
  - number: 40b.3
    text: De Nederlandsche Bank beslist binnen dertien weken na ontvangst op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40b
  - number: 40b.4
    text: |-
      De Nederlandsche Bank stelt de Autoriteit Financiële Markten in de gelegenheid te adviseren over
      gedragstoezichtaspecten van de vergunningaanvraag.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40b
  - number: 40b.5
    text: |-
      De gegevens, bedoeld in [artikel 40c][ref1], worden in zodanige vorm verstrekt dat een goede beoordeling door De
      Nederlandsche Bank mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel40c
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40b
