    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.1.k
    text: |-
      bescheiden waaruit het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref1] blijkt,
      inclusief bescheiden waaruit blijkt dat het algemeen pensioenfonds gedurende de eerste drie jaren doorlopend kan
      beschikken over het wettelijk vereiste weerstandsvermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40c.1.l
    text: |-
      een beschrijving van de werkzaamheden die worden uitbesteed, voorzien van een op een risicoanalyse gebaseerde
      onderbouwing;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.1.m
    text: |-
      een beschrijving van de inrichting van de organisatie met betrekking tot de beheerste en integere bedrijfsvoering,
      bedoeld in [artikel 143 van de Pensioenwet][ref1], inclusief een eigen risicobeoordeling;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '143'
  - number: 40c.1.n
    text: |-
      de uitvoeringsovereenkomst of uitvoeringsovereenkomsten die het algemeen pensioenfonds voornemens is te sluiten, of
      indien hiervan nog geen sprake is, een modeluitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.1.o
    text: |-
      het pensioenreglement of de pensioenreglementen die het algemeen pensioenfonds op grond van
      [artikel 35 van de Pensioenwet][ref1] heeft opgesteld ten behoeve van de collectiviteitkring of
      collectiviteitkringen of indien hiervan nog geen sprake is een modelpensioenreglement; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel35
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '35'
  - number: 40c.1.p
    text: |-
      een beschrijving van de doelstellingen en beleidsuitgangspunten als bedoeld in
      [artikel 102a, eerste lid, van de Pensioenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel102a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 102a
  - number: 40c.2
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel e, zijn:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.2.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.2.b
    text: een curriculum vitae;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.2.c
    text: een opgave van de relevante diploma’s;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.2.d
    text: een kopie van een geldig identiteitsbewijs; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.2.e
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.3
    text: 'De gegevens, bedoeld in het eerste lid, onderdeel f, zijn:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.3.a
    text: |-
      een opgave van de naam, de geboortedatum, de geboorteplaats, nationaliteit, het privé-adres, het telefoon- en
      faxnummer, het e-mailadres en de functie;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.3.b
    text: een kopie van een geldig identiteitsbewijs;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.3.c
    text: gegevens met betrekking tot de antecedenten, bedoeld in de bijlage bij dit besluit; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.3.d
    text: een opgave van referenten.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.4
    text: 'Het programma van werkzaamheden, bedoeld in het eerste lid, onderdeel j, bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.4.a
    text: een beschrijving van het bedrijfsmodel en verdienmodel;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.4.b
    text: een raming voor de eerste drie boekjaren van de kosten; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.4.c
    text: een raming voor de eerste drie kalenderjaren van de liquiditeitspositie.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40d.1
    text: |-
      De Nederlandsche Bank kan een verleende vergunning wijzigen, geheel of gedeeltelijk intrekken of beperken, dan wel
      daaraan nadere voorschriften verbinden, indien:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.a
    text: de vergunninghouder daartoe een aanvraag heeft ingediend;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.b
    text: |-
      de vergunninghouder, naar later blijkt, bij de aanvraag van de vergunning onjuiste of onvolledige gegevens heeft
      verstrekt, en kennis omtrent de juiste en volledige gegevens tot een andere beslissing zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.c
    text: |-
      de vergunninghouder omstandigheden of feiten heeft verzwegen op grond waarvan, zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.d
    text: |-
      de vergunninghouder niet meer voldoet aan de bij of krachtens de Pensioenwet gestelde regels dan wel niet meer
      voldoet aan de aan de vergunning verbonden voorschriften of gestelde beperkingen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.e
    text: |-
      de vergunninghouder geen gebruik van de vergunning heeft gemaakt binnen een termijn van twaalf maanden na
      vergunningverlening;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.f
    text: de vergunninghouder de vergunningplichtige activiteit gedurende meer dan zes maanden heeft beëindigd;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.g
    text: de vergunninghouder het bedrijf ten behoeve waarvan de vergunning is verleend, geheel of gedeeltelijk overdraagt;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.h
    text: de vergunninghouder wordt ontbonden;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.i
    text: |-
      niet blijkt dat de jaarrekening of de staten een getrouw beeld geeft of geven van de grootte en de samenstelling
      van het vermogen van het algemeen pensioenfonds en van het resultaat over het desbetreffende boekjaar;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.1.j
    text: de vergunninghouder in staat van faillissement is komen te verkeren.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40d.2
    text: |-
      De Nederlandsche Bank kan bij het besluit tot intrekking van een vergunning tevens bepalen dat het algemeen
      pensioenfonds binnen een door De Nederlandsche Bank te stellen termijn het bedrijf geheel of gedeeltelijk
      afwikkelt. Bij een afwikkeling, al dan niet bepaald door De Nederlandsche Bank, wordt het algemeen pensioenfonds of
      de curator in faillissement van het algemeen pensioenfonds aangemerkt als vergunninghoudende onderneming.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40d
  - number: 40e.1
    text: |-
      Het weerstandsvermogen, bedoeld in [artikel 112a, achtste lid, van de Pensioenwet][ref1] bedraagt ten minste 0,2%
      van de waarde van het beheerd pensioenvermogen met een minimum van € 500.000 en een maximum van € 20 miljoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel112a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 112a
  - number: 40e.2
    text: |-
      Voor de dekking van aansprakelijkheidsrisico’s wordt het weerstandsvermogen, bedoeld in het eerste lid,
      verhoogd met 0,1% van de waarde van het beheerd pensioenvermogen, tenzij het algemeen pensioenfonds een
      beroepsaansprakelijkheidsverzekering of een daarmee vergelijkbare voorziening heeft die zijn aansprakelijkheid
      dekt wegens fouten, verzuimen of nalatigheden begaan in de uitoefening van zijn bedrijf en voor gevallen op
      het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, voor een
      bedrag van ten minste 0,75% van de waarde van het beheerde pensioenvermogen, met een minimum van € 2 miljoen
      en een maximum van € 20 miljoen per schadegeval, en ten minste een procent van de waarde van het beheerde
      pensioenvermogen, met een minimum van € 2,5 miljoen en een maximum van € 25 miljoen per jaar, voor alle
      schadegevallen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40e
  - number: 40e.3
    text: |-
      In afwijking van het eerste en tweede lid bedraagt het weerstandsvermogen meer dan het resultaat van de
      berekeningswijze overeenkomstig dit artikel, indien de risicoanalyse van het algemeen pensioenfonds daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40e
  - number: 40e.4
    text: |-
      Het weerstandsvermogen van het algemeen pensioenfonds wordt gevormd door de vermogensbestanddelen, bedoeld in de
      [artikelen 5 tot en met 8 van het Besluit financieel toetsingskader pensioenfondsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel5
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '5'
  - number: 40e.5
    text: |-
      Het algemeen pensioenfonds toetst ten minste een keer per jaar of de beroepsaansprakelijkheidsverzekering nog in
      overeenstemming is met de eisen, bedoeld in het tweede lid, dan wel vaker wanneer sprake is van een wijziging van
      omstandigheden die hierop van invloed zijn.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40e
  - number: '41.1'
    text: 'De uitvoering van het nettopensioen door een fonds voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.a
    text: |-
      ouderdomspensioen of nabestaandenpensioen op opbouwbasis heeft het karakter van een premieovereenkomst of
      premieregeling waarbij het fonds het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de
      daarop behaalde rendementen belegt tot een onder b genoemd moment van omzetting;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.b
    text: |-
      omzetting van het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde
      rendementen in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering kan plaatsvinden op
      het moment dat de deelnemer overlijdt, gepensioneerde of gewezen deelnemer wordt of in de tien jaren voorafgaand
      aan de pensioendatum op basis van een dekkingsgraadneutraal tarief;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.c
    text: |-
      de omzetting van het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde
      rendementen in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering vindt plaats door
      inkoop in de basispensioenregeling waarbij:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.c.1°
    text: uitsluitend rekening wordt gehouden met de levensverwachting van de groep deelnemers aan het nettopensioen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.c.2°
    text: het nettopensioen een voorwaardelijke toeslagverlening kent;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.d
    text: |-
      ingeval de verplichtingen van het fonds ten aanzien van het nettopensioen toenemen als gevolg van een verschil
      in de stijging van de levensverwachting tussen de deelnemers aan het nettopensioen en de deelnemers aan de
      basispensioenregeling, vermindert het fonds de voorwaardelijke toeslagverlening bij het nettopensioen totdat deze
      toename van de verplichtingen bij het nettopensioen is gecompenseerd;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.e
    text: |-
      ingeval het fonds een incidentele bijstorting ontvangt van de werkgever vermindert het fonds de voorwaardelijke
      toeslagverlening bij het nettopensioen, voor zover deze storting ten goede is gekomen aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.f
    text: |-
      in geval van een nabestaandenpensioen op risicobasis of een premievrijstelling in verband met arbeidsongeschiktheid
      stelt het fonds de hierop betrekking hebbende premie vast rekening houdend met de kenmerken van de groep deelnemers
      aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.g
    text: het fonds rekent de kosten behorend bij het nettopensioen apart toe;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h
    text: 'het fonds houdt voor het nettopensioen een gescheiden administratie bij, waaruit ten minste blijken:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h.1°
    text: de voor het nettopensioen ingelegde premies;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h.2°
    text: de met de beschikbaar gestelde premies behaalde rendementen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h.3°
    text: de waarde van de pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h.4°
    text: |-
      de actuariële gegevens over de groep deelnemers aan het nettopensioen die ten grondslag liggen aan de premie
      en aan de waardering van de pensioenverplichtingen, waaronder de geschatte levensverwachting en risico’s op
      arbeidsongeschiktheid en vooroverlijden;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.1.h.5°
    text: de toeslagverlening en de toepassing van de onderdelen d en e.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: '41.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt het dekkingsgraadneutraal tarief gebaseerd op
      de dekkingsgraad van het fonds met als minimum de dekkingsgraad benodigd om te voldoen aan de vereisten
      van het minimaal vereist eigen vermogen, bedoeld in [artikel 131 van de Pensioenwet][ref1] dan wel
      [artikel 126 van de Wet verplichte beroepspensioenregeling][ref2], wordt de risicovrije rente gehanteerd en wordt
      rekening gehouden met tariefgrondslagen passend bij de groep deelnemers aan het nettopensioen. Indien de feitelijke
      premie voor de basispensioenregeling van het fonds gedeeld door de daarmee ingekochte jaarlijkse pensioenaanspraken
      leidt tot een hoger tarief dan bedoeld in de eerste zin, wordt dit hogere tarief gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '131'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '126'
  - number: '41.3'
    text: |-
      Het eerste lid is niet van toepassing voor zover het ouderdomspensioen, nabestaandenpensioen of premievrijstelling
      bij arbeidsongeschiktheid is verzekerd bij een verzekeraar.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: '41.4'
    text: |-
      Het eerste lid, onderdelen a, b, c, d, e, h, onder 5, en het tweede lid, zijn niet van toepassing indien en voor
      zover voldaan wordt aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.4.a
    text: |-
      ouderdomspensioen of nabestaandenpensioen op opbouwbasis heeft het karakter van een premieovereenkomst of
      premieregeling waarbij het kapitaal dat is ontstaan uit de som van de beschikbaar gestelde premies en de daarop
      behaalde rendementen wordt gebruikt voor financiering van een variabele uitkering die kan variëren door de
      verwerking van financiële mee – of tegenvallers als gevolg van het beleggingsrisico en die varieert door de
      verwerking van financiële mee – of tegenvallers als gevolg van de ontwikkeling van het sterfteresultaat en de
      ontwikkeling van de levensverwachting;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.4.b
    text: |-
      voor de ontwikkeling van het sterfteresultaat en de ontwikkeling van de levensverwachting wordt uitsluitend
      rekening gehouden met het sterfteresultaat en de levensverwachting van de groep deelnemers aan het nettopensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: 41.4.c
    text: |-
      de waarde van de met de risicovrije rente contant gemaakte verwachte kasstromen is gelijk aan het pensioenkapitaal
      op pensioendatum.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel41
  - number: '42'
    text: |-
      In een overeenkomst als bedoeld in [artikel 124a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 120a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt in ieder geval geregeld dat:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel124a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel120a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 124a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 120a
  - number: 42.a
    text: |-
      de pensioenbewaarder in het belang van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden optreedt;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
  - number: 42.b
    text: |-
      over het in bewaring gegeven pensioenvermogen slechts kan worden beschikt door het fonds en de pensioenbewaarder
      tezamen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
  - number: 42.c
    text: |-
      de pensioenbewaarder het in bewaring gegeven pensioenvermogen slechts afgeeft tegen ontvangst van een verklaring
      van het fonds waaruit blijkt dat afgifte wordt verlangd in verband met de regelmatige uitoefening van het bedrijf
      van pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
  - number: 42.d
    text: |-
      de pensioenbewaarder jegens het fonds, de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden aansprakelijk is voor door hen geleden schade voor zover de schade het gevolg is van
      verwijtbare niet-nakoming of gebrekkige nakoming van zijn verplichtingen, ook indien de pensioenbewaarder het bij
      hem in bewaring gegeven pensioenvermogen geheel of gedeeltelijk aan een derde heeft toevertrouwd; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
  - number: 42.e
    text: de pensioenbewaarder van het fonds de informatie ontvangt die noodzakelijk is voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel42
  - number: '48.1'
    text: |-
      De toezichthouder stelt een bestuurlijke boete in de tweede of derde categorie vast
      op het basisbedrag, bedoeld in [artikel 179, tweede lid, van de Pensioenwet][ref1] en
      [artikel 174, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel174
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '174'
  - number: '48.2'
    text: |-
      De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de ernst of duur van de
      overtreding een dergelijke verlaging of verhoging rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel48
  - number: '48.3'
    text: |-
      De toezichthouder verlaagt of verhoogt het basisbedrag met ten hoogste 50 procent indien de mate van
      verwijtbaarheid van de overtreder een dergelijke verlaging of verhoging rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel48
  - number: '49'
    text: |-
      De door de toezichthouder met toepassing van [artikel 48][ref1] vast te stellen bestuurlijke boete wordt verdubbeld
      indien tijdens het plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een
      bestuurlijke boete aan de overtreder ter zake van eenzelfde overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '48'
        hoofdstuk: '10'
  - number: '50.1'
    text: |-
      De toezichthouder houdt bij het vaststellen van een bestuurlijke boete rekening met de draagkracht van de
      overtreder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel50
  - number: '50.2'
    text: |-
      De toezichthouder kan op basis van het eerste lid de op te leggen bestuurlijke boete verlagen met maximaal 100
      procent.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel50
  - number: '51.1'
    text: |-
      De toezichthouder houdt bij het vaststellen van een bestuurlijke boete voor pensioenuitvoerders rekening met schade
      voor derden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel51
  - number: '51.2'
    text: |-
      De toezichthouder kan de op te leggen bestuurlijke boete, na inachtneming van de bepalingen, bedoeld in de
      [artikelen 48][ref1], [49][ref2] en [50][ref3] verlagen met maximaal 75 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel50
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '48'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '49'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0020892
        artikel: '50'
        hoofdstuk: '10'
