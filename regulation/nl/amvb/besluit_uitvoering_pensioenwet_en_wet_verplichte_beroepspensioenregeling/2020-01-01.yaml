  - number: 10.0a
    text: De informatie die de pensioenuitvoerder verstrekt of beschikbaar stelt is beschikbaar in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10.0a
  - number: 10a.1
    text: |-
      De administratieve uitvoeringskosten, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref1] dan
      wel [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], zijn de kosten voor het
      pensioenbeheer. Hieronder wordt onder meer begrepen de kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 56a
  - number: 10a.1.a
    text: het vaststellen en innen van de premie;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.1.b
    text: registratie van pensioenaanspraken en pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.1.c
    text: |-
      informatieverstrekking aan en communicatie met deelnemers, andere aanspraakgerechtigden, pensioengerechtigden en
      de werkgever;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.1.d
    text: het bestuur; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.1.e
    text: het toezicht door de toezichthouders.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.2
    text: |-
      De kosten van vermogensbeheer, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], zijn de kosten voor het beheer van
      het belegde vermogen, met uitzondering van de transactiekosten. Onder de kosten van vermogensbeheer wordt onder
      meer begrepen de kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 56a
  - number: 10a.2.a
    text: fiduciair vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.2.b
    text: bewaarloon; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.2.c
    text: advieskosten.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.3
    text: |-
      De transactiekosten, bedoeld in [artikel 45a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 56a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], zijn de kosten voor de transacties
      in vermogenstitels. Hieronder wordt onder meer begrepen de kosten voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 56a
  - number: 10a.3.a
    text: aankoop en verkoop van vermogensbestanddelen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.3.b
    text: acquisitie van beleggingen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.3.c
    text: deelname aan beleggingsfondsen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Kosten die niet kunnen worden toebedeeld aan een van de drie categorieën, bedoeld in het eerste tot en met derde
      lid, worden over de categorieën, bedoeld in het eerste en tweede lid, verdeeld.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10a
  - number: 10b.1
    text: |-
      De administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1], worden in het bestuursverslag
      opgenomen als totaalbedrag en als bedrag per deelnemer of pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 10b.2
    text: |-
      De kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref1], en de transactiekosten, bedoeld in
      artikel 10a, derde lid, worden in het bestuursverslag opgenomen als totaal bedrag en als percentage van het in het
      verslagjaar gemiddeld belegde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 10ba.1
    text: |-
      De verzekeraar die bereid is op te treden als ontvangend uitvoerder verstrekt een betrokkene die het uit een
      kapitaalovereenkomst dan wel kapitaalregeling of een premieovereenkomst dan wel premieregeling voortvloeiende
      kapitaal op de pensioendatum wenst aan te wenden voor een pensioenuitkering, voorafgaand aan de totstandkoming van
      een overeenkomst inzake een pensioenuitkering ten minste de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.1.a
    text: haar statutaire naam, handelsnaam en adres;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.1.b
    text: het feit dat zij een verzekeraar is;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.1.c
    text: of zij advies verstrekt over pensioenuitkeringen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.1.d
    text: |-
      haar interne klachtenprocedure, bedoeld in
      [artikel 4:17, eerste lid, onderdeel a, van de Wet op het financieel toezicht][ref1] en de erkende
      geschilleninstantie waarbij zij is aangesloten; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 10ba.1.e
    text: de aard van de vergoeding die haar werknemers ontvangen voor het sluiten van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.2
    text: |-
      De verzekeraar verstrekt de informatie in de Nederlandse taal of in elke andere taal die door partijen is
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.3
    text: |-
      De verzekeraar verstrekt de informatie schriftelijk en kosteloos. De verzekeraar kan na toestemming van de
      betrokkene, de informatie elektronisch verstrekken, indien dat past in de context waarin zij met de betrokkene
      zaken doet. De elektronische verstrekking van informatie door de verzekeraar past in de context waarin de
      verzekeraar met de betrokkene zaken doet, indien is bewezen dat de betrokkene regelmatig toegang heeft tot
      internet. Het gegeven dat de betrokkene een e-mailadres opgeeft geldt in ieder geval als bewijs hiervan.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10ba.4
    text: |-
      Indien de informatie elektronisch wordt verstrekt, krijgt de betrokkene op zijn verzoek kosteloos een papieren
      afschrift.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10ba
  - number: 10c.1
    text: |-
      Bij de regeling over de kosten die verband houden met de uitvoering van de pensioenregeling die volgens de
      uitvoeringsovereenkomst of het uitvoeringsreglement in mindering kunnen worden gebracht of kunnen worden verhaald
      op een afgescheiden vermogen van een algemeen pensioenfonds of ten laste kunnen worden gebracht van de premie,
      wordt onderscheid gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
  - number: 10c.1.a
    text: |-
      administratieve uitvoeringskosten als bedoeld in [artikel 10a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 10c.1.b
    text: |-
      vermogensbeheerskosten als bedoeld in [artikel 10a, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 10c.1.c
    text: |-
      transactiekosten als bedoeld in [artikel 10a, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 10c.1.d
    text: |-
      kosten, met inbegrip van schulden aan derden, die voortvloeien uit het beheer van het vermogen van de
      desbetreffende collectiviteitkring.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
  - number: 10c.2
    text: |-
      Overige kosten die verband houden met de uitvoering van de pensioenregeling en niet als kosten in de zin van een
      van de categorieën, bedoeld in het eerste lid, kunnen worden toebedeeld worden volgens een vaste verdeelsleutel
      over de categorieën, bedoeld in het eerste lid, onderdeel a en b verdeeld. Daarbij worden deze kosten nader
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
  - number: 10c.3
    text: |-
      De wijze waarop de kosten, bedoeld in het eerste en tweede lid, worden bepaald is volledig en duidelijk
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10c
  - number: 10d
    text: |-
      In de uitvoeringsovereenkomst met een algemeen pensioenfonds wordt een regeling opgenomen waaruit blijkt welke
      diensten worden uitgevoerd, onder welke voorwaarden dat gebeurt en waarbij in ieder geval afspraken worden
      opgenomen over indicatoren met betrekking tot de kwaliteit van dienstverlening.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel10d
  - number: '11.1'
    text: |-
      Als principes voor goed pensioenfondsbestuur als bedoeld in [artikel 33, tweede lid, van de Pensioenwet][ref1]
      dan wel [artikel 42, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] worden aangewezen voor
      fondsen de Code Pensioenfondsen, zoals geformuleerd door de Stichting van de Arbeid en de Pensioenfederatie en voor
      verzekeraars de Code Rechtstreeks verzekerde regelingen, zoals geformuleerd door de Stichting van de Arbeid en het
      Verbond van Verzekeraars. Deze laatste code is van overeenkomstige toepassing op premiepensioeninstellingen. De
      codes, en iedere wijziging daarvan, behoeven de goedkeuring van Onze Minister


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '42'
  - number: '11.2'
    text: |-
      Een uitvoerder doet in het bestuursverslag mededeling over de naleving van de principes, bedoeld in het eerste
      lid. Indien een uitvoerder de principes niet heeft nageleefd of niet voornemens is deze in het lopende en daarop
      volgende boekjaar na te leven, doet hij daarvan in het bestuursverslag gemotiveerd opgave.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel11
  - number: '12'
    text: |-
      In aanvulling op [artikel 34, tweede lid, van de Pensioenwet][ref1] en
      [artikel 43, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] besteedt een uitvoerder niet uit,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel43
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '43'
  - number: 12.a
    text: door de uitbesteding het operationele risico onnodig toeneemt;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel12
  - number: 12.b
    text: |-
      door de uitbesteding de continuïteit en de toereikendheid van de dienstverlening aan deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden wordt ondermijnd.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel12
  - number: '13.1'
    text: Een fonds legt de overeenkomst met de derde waaraan de werkzaamheden worden uitbesteed schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: '13.2'
    text: 'In de overeenkomst wordt in ieder geval het volgende geregeld:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.a
    text: |-
      welke werkzaamheden worden uitbesteed onder verwijzing, indien mogelijk, naar de administratieve
      organisatiebeschrijving van het fonds, alsmede de voorwaarden waaronder de uitbesteding plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.b
    text: sluitende afspraken in beleggingsmandaten bij uitbesteding van vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.c
    text: de informatie-uitwisseling tussen het fonds en de derde;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.d
    text: |-
      de verplichting voor de derde om informatie waar de toezichthouder ter uitvoering van zijn wettelijke taak om
      vraagt rechtstreeks aan de toezichthouder ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.e
    text: |-
      de mogelijkheid voor het fonds om te allen tijde wijzigingen aan te brengen in de wijze waarop de uitvoering van de
      werkzaamheden door de derde geschiedt;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.f
    text: |-
      de verplichting voor de derde om het fonds in staat te stellen blijvend te voldoen aan het bij of krachtens de
      [Pensioenwet][ref1] dan wel de [Wet verplichte beroepspensioenregeling][ref2] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: 13.2.g
    text: de mogelijkheid voor de toezichthouder om onderzoek ter plaatse te doen of te laten doen bij de derde;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.h
    text: |-
      de wijze waarop de overeenkomst wordt beëindigd, en de wijze waarop wordt gewaarborgd dat het fonds de
      werkzaamheden na beëindiging van de overeenkomst weer zelf kan uitvoeren of door een andere derde kan laten
      uitvoeren; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: 13.2.i
    text: de toepasselijkheid van de algemene beginselen van het beloningsbeleid van het fonds op de derde.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Een fonds draagt zorg voor een systematische analyse van de risico’s die samenhangen met de uitbesteding van
      werkzaamheden en legt deze vast. Het fonds maakt de analyse op het niveau van zijn eigen organisatie in zijn geheel
      en op het niveau van de onderscheiden bedrijfsonderdelen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Een fonds voert een adequaat beleid en beschikt over procedures en maatregelen met betrekking tot de
      uitbesteding van werkzaamheden, als onderdeel van een beheerste en integere bedrijfsvoering als bedoeld in
      [artikel 143 van de Pensioenwet][ref1] dan wel [artikel 138 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel138
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '143'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '138'
  - number: '14.3'
    text: |-
      Een fonds legt het beleid met betrekking tot de uitbesteding van werkzaamheden schriftelijk vast en draagt zorg
      voor de uitvoering van dat beleid. Het fonds evalueert het beleid ten minste driejaarlijks en past het beleid na
      een belangrijke wijziging zo spoedig mogelijk aan.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
  - number: '14.4'
    text: |-
      Een fonds hanteert een adequate selectieprocedure voor derden aan wie werkzaamheden worden uitbesteed. Het fonds
      legt vast op grond van welke afwegingen zij tot de keuze voor een bepaalde derde is gekomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
  - number: '14.5'
    text: |-
      Een fonds beschikt over toereikende procedures, maatregelen, deskundigheid en informatie om de uitvoering van de
      uitbestede werkzaamheden te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
  - number: '14.6'
    text: |-
      Een fonds draagt er zorg voor dat de algemene beginselen van het beloningsbeleid van het fonds worden toegepast
      bij derden waaraan werkzaamheden van het fonds zijn uitbesteed, tenzij de derde valt onder een richtlijn, genoemd
      in artikel 2, tweede lid, onderdeel b, van [richtlijn 2016/2341](32016L2341)/EU. Indien de derde valt onder
      een richtlijn, genoemd in artikel 2, tweede lid, onderdeel b, van [richtlijn 2016/2341](32016L2341)/EU heeft
      het fonds zicht op het beloningsbeleid van de derde aan wie werkzaamheden worden besteed, betrekt het fonds
      het beloningsbeleid bij de keuze voor de derde waaraan de werkzaamheden worden uitbesteed en maakt zijn beleid
      dienaangaande openbaar.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14
  - number: 14.0a.1
    text: |-
      Een fonds stelt De Nederlandsche Bank tijdig in kennis van het uitbesteden van werkzaamheden aan een derde.
      Indien de uitbesteding de risicobeheerfunctie, interne auditfunctie, actuariële functie of het beheer van het
      pensioenfonds betreft, wordt De Nederlandsche Bank daarvan in kennis gesteld voordat de overeenkomst met de derde
      waaraan de werkzaamheden worden uitbesteed in werking treedt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14.0a
  - number: 14.0a.2
    text: |-
      Een fonds stelt de Nederlandsche Bank in kennis van belangrijke ontwikkelingen met betrekking tot de uitbestede
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14.0a
  - number: 14a.1
    text: |-
      Bij uitvoering van een premieovereenkomst of premieregeling in de opbouwfase of een variabele uitkering is
      __REF000___________________________________________________________________________________________________________
      _______ van overeenkomstige toepassing voor verzekeraars en premiepensioeninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel13
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: '13'
  - number: 14a.2
    text: |-
      De waarden worden door de uitvoerder belegd op een wijze die past bij de aard en duur van de verwachte toekomstige
      pensioenuitkeringen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Indien de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen
      heeft overgenomen, neemt de uitvoerder het eerste en tweede lid in acht bij het
      advies, bedoeld in [artikel 52, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, derde lid, van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '63'
  - number: 14b.1
    text: |-
      Fondsen stellen voor de langere termijn een strategisch beleggingsbeleid vast dat aansluit op de doelstellingen
      en beleidsuitgangspunten, waaronder de risicohouding, van het fonds. Verzekeraars en premiepensioeninstellingen
      stellen voor de langere termijn een strategisch beleggingsbeleid vast dat past bij de doelstellingen van
      de pensioenregeling of beroepspensioenregeling en de voor de toedelingskring vastgelegde risicohouding. Het
      strategisch beleggingsbeleid is gebaseerd op gedegen onderzoek.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14b
  - number: 14b.2
    text: |-
      [Artikel 13a, tweede tot en met vijfde lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1] is van
      overeenkomstige toepassing voor verzekeraars en premiepensioeninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel13a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 13a
  - number: 14b.3
    text: |-
      De uitvoerder die werkt met beleggingsprofielen geeft binnen het strategisch beleggingsbeleid en het beleggingsplan
      invulling aan die beleggingsprofielen en onderbouwt voor ieder profiel dat het past binnen de prudent person regel.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14b
  - number: 14ba
    text: |-
      Bij het op grond van [artikel 52, tweede lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, tweede lid, van de Wet verplichte beroepspensioenregeling][ref2] aan een deelnemer of
      gewezen deelnemer bieden van de mogelijkheid om de verantwoordelijkheid voor de beleggingen over te nemen
      informeert de pensioenuitvoerder de deelnemer of gewezen deelnemer dat, indien de deelnemer of gewezen
      deelnemer hier niet voor kiest of geen keuze kenbaar maakt, de pensioenuitvoerder verantwoordelijk blijft
      voor de beleggingen en daarbij handelt overeenkomstig [artikel 135 van de Pensioenwet][ref3] dan wel
      [artikel 130 van de Wet verplichte beroepspensioenregeling][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel135
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel130
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14ba
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '135'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '130'
  - number: 14c.1
    text: |-
      Indien de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen stelt
      de uitvoerder op basis van de informatie, bedoeld in [artikel 52, zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 63, zesde lid, van de Wet verplichte beroepspensioenregeling][ref2], het risicoprofiel van de deelnemer of
      gewezen deelnemer vast en baseert het advies, bedoeld in artikel 52, derde lid, van de Pensioenwet dan wel artikel
      63, derde lid, van de Wet verplichte beroepspensioenregeling, op dit risicoprofiel.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '63'
  - number: 14c.2
    text: |-
      Het risicoprofiel van de deelnemer of gewezen deelnemer geeft de mate weer waarin hij beleggingsrisico kan en
      wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar, indien een belangrijke gebeurtenis
      daartoe aanleiding geeft en als de deelnemer of gewezen deelnemer om toetsing vraagt. Indien het nieuwe
      risicoprofiel daartoe aanleiding geeft adviseert de uitvoerder de deelnemer of gewezen deelnemer over een ander
      passend beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14c
  - number: 14c.3
    text: |-
      De pensioenuitvoerder informeert de deelnemer of gewezen deelnemer over de voorwaarden die aan de beschikbare
      beleggingsmogelijkheden zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14c
  - number: 14d.1
    text: |-
      De uitvoerder die verantwoordelijk is voor de beleggingen legt de risicohouding vast waarop het beleggingsbeleid
      is gebaseerd. [Artikel 1a, eerste en derde lid, van het Besluit financieel toetsingskader pensioenfondsen][ref1]
      is van overeenkomstige toepassing voor verzekeraars en premiepensioeninstellingen met dien verstande dat deze
      uitvoerders in plaats van overleg met de in het eerste lid van dit artikel genoemde partijen ernaar streven van de
      deelnemers, gewezen deelnemers, pensioengerechtigden of hun vertegenwoordigers zo veel mogelijk duidelijkheid te
      krijgen over hun doelstellingen en risicohouding. De risicohouding wordt per toedelingskring vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel1a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 1a
  - number: 14d.2
    text: |-
      De uitvoerder toetst periodiek op basis van een scenarioanalyse of het beleggingsbeleid passend is
      bij de vastgestelde risicohouding en past het beleggingsbeleid aan indien dat niet het geval is.
      [Artikel 23a van het Besluit financieel toetsingskader pensioenfondsen][ref1] is van toepassing bij de
      scenarioanalyse.


      [ref1]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0020871
        artikel: 23a
  - number: 14d.3
    text: |-
      Bij de uitvoering van het beleggingsbeleid in de opbouwfase biedt de uitvoerder de deelnemer of gewezen deelnemer
      effectieve bescherming tegen de gevolgen van negatieve beleggingsresultaten voorafgaand aan de pensioendatum.
      De uitvoerder kan hiertoe het beleggingsrisico afbouwen naarmate de deelnemer ouder wordt of kan op andere wijze
      bescherming bieden. De uitvoerder die een andere methode dan leeftijdsgerelateerde afbouw van beleggingsrisico
      toepast, onderbouwt dat op deze wijze de deelnemer of gewezen deelnemer beschermd wordt, zonder dat anderen worden
      benadeeld. Indien de door de uitvoerder toegepaste methode naar het oordeel van De Nederlandsche Bank niet aan de
      doelstellingen voldoet, kan De Nederlandsche Bank de uitvoerder verplichten over te gaan op leeftijdsgerelateerde
      afbouw van beleggingsrisico.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
  - number: 14d.4
    text: |-
      De uitvoering van het beleggingsbeleid in de opbouwfase wordt door de uitvoerder gebaseerd op een vastgestelde
      uitkering, tenzij is gebleken dat de deelnemer of gewezen deelnemer een voorkeur heeft voor een variabele
      uitkering of toetreedt tot een toedelingskring waarop een collectief toedelingsmechanisme voor het
      beleggingsrisico wordt toegepast als bedoeld in [artikel 63b, vijfde lid, van de Pensioenwet][ref1] dan wel
      [artikel 75b, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref2]. In die situaties wordt de
      uitvoering van het beleggingsbeleid afgestemd op een variabele uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75b
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 63b
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 75b
  - number: 14d.5
    text: |-
      Voor de uitvoering van het vierde lid vraagt de uitvoerder de deelnemer of gewezen deelnemer naar diens voorkeur
      voor een vastgestelde of variabele uitkering, zodra dit voor de beleggingen relevant is. De uitvoerder verstrekt
      daarbij de voor de deelnemer of gewezen deelnemer relevante informatie over de gevolgen en risico’s.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
  - number: 14d.6
    text: |-
      Bij de uitvoering van het beleggingsbeleid in de uitkeringsfase vergroot de uitvoerder het beleggingsrisico niet
      tenzij sprake is van een wijziging van de risicohouding of een gewijzigd risicoprofiel dat aanleiding is voor een
      wijziging van het beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
  - number: 14d.7
    text: |-
      Het risicoprofiel van de deelnemer, gewezen deelnemer of pensioengerechtigde geeft de mate weer waarin hij
      beleggingsrisico kan en wil nemen. De uitvoerder toetst het risicoprofiel tenminste iedere vijf jaar en indien een
      belangrijke gebeurtenis daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14d
  - number: 14da.1
    text: |-
      De verplichting om de voorkeur van een gewezen deelnemer voor een vaste of variabele uitkering uit
      te vragen, bedoeld in [artikel 14d, vijfde lid][ref1], geldt niet indien op basis van de opgebouwde
      aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere
      ingangsdatum minder zal bedragen dan het op basis van [artikel 66 van de Pensioenwet][ref2] dan wel
      [artikel 78 van de Wet verplichte beroepspensioenregeling][ref3] bepaalde bedrag, en voldaan is aan het tweede,
      derde of vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel14d
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14da
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 14d
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '78'
  - number: 14da.2
    text: |-
      Indien de deelneming is geëindigd vanaf 1 januari 2018 geldt de verplichting niet,
      indien de uitvoerder op grond van [artikel 70a van de Pensioenwet][ref1] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2] probeert over te gaan tot waardeoverdracht van de
      aanspraken van de gewezen deelnemer of dit tenminste vijf maal jaarlijks tevergeefs heeft geprobeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14da
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 81a
  - number: 14da.3
    text: |-
      Indien de deelneming is geëindigd voor 1 januari 2018 geldt de verplichting niet tot de start van de uitvoering van
      het plan, bedoeld in [artikel 17f, tweede lid][ref1], indien de uitvoerder voornemens is voor de aanspraken van de
      gewezen deelnemer een opgave te vragen als bedoeld in artikel 17f, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel17f
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14da
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 17f
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 14da.4
    text: |-
      Indien de deelneming is geëindigd voor 1 januari 2018 geldt de verplichting niet vanaf de start van de uitvoering
      van het plan, indien waardeoverdracht van de aanspraken van de gewezen deelnemer is opgenomen in het plan.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14da
  - number: 14e.1
    text: |-
      De informatie, bedoeld in de [artikelen 52, zesde lid][ref1], en [52a, vijfde lid, van de Pensioenwet][ref2] dan
      wel de [artikelen 63, zesde lid][ref3], en [63a, vijfde lid, van de Wet verplichte beroepspensioenregeling][ref4]
      stelt de uitvoerder in staat om vast te kunnen stellen dat het advies of het beleggingsprofiel:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel52a
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel63a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 52a
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '63'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 63a
  - number: 14e.1.a
    text: |-
      voldoet aan de doelstellingen van de deelnemer, gewezen deelnemer of pensioengerechtigde ten aanzien van het
      pensioen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14e
  - number: 14e.1.b
    text: |-
      inhoudt dat de deelnemer, gewezen deelnemer of pensioengerechtigde de met deze doelstellingen samenhangende
      beleggingsrisico’s financieel kan en wil dragen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14e
  - number: 14e.2
    text: |-
      De uitvoerder legt vast op welke wijze wordt vastgesteld of het advies of het beleggingsprofiel past bij het
      risicoprofiel van de deelnemer, gewezen deelnemer of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel14e
  - number: '15.1'
    text: |-
      Per geboden keuzemogelijkheid als bedoeld in [artikel 60][ref1], [61][ref2] of [62 van de Pensioenwet][ref3]
      dan wel [artikel 72][ref4], [73][ref5], [74 van de Wet verplichte beroepspensioenregeling][ref6], wordt door
      de pensioenuitvoerder voor een door hem te bepalen periode voor alle deelnemers en gewezen deelnemers dezelfde
      ruilvoet of opbouwkeuzevoet vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '62'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '72'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '73'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '74'
  - number: '15.2'
    text: |-
      De ruilvoet en opbouwkeuzevoet worden zodanig vastgesteld dat sprake is van collectieve actuariële
      gelijkwaardigheid als bedoeld in de [artikelen 60, vijfde lid][ref1], [61, vierde lid][ref2], en
      [62, eerste lid, van de Pensioenwet][ref3] dan wel [artikel 72, vijfde lid][ref4], [73, vierde lid][ref5] en
      [74, eerste lid, van de Wet verplichte beroepspensioenregeling][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '62'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '72'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '73'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '74'
  - number: '15.3'
    text: |-
      In afwijking van het eerste lid kan aan een gewezen deelnemer de ruilvoet worden toegekend, die geldt op de dag van
      beëindiging van de deelneming.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      De afkoopwaarde, bedoeld in de [artikelen 66][ref1] en [69 van de Pensioenwet][ref2] dan wel bedoeld in de
      [artikelen 78][ref3] en [80a van de Wet verplichte beroepspensioenregeling][ref4], wordt door de pensioenuitvoerder
      vastgesteld door middel van een afkoopvoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel80a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '78'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 80a
  - number: '16.2'
    text: |-
      Er wordt dezelfde afkoopvoet vastgesteld voor een door de pensioenuitvoerder vast te stellen periode voor alle
      deelnemers en gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel16
  - number: '16.3'
    text: De afkoopvoet wordt zodanig vastgesteld dat er sprake is van collectieve actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel16
  - number: '17'
    text: |-
      Indien met de werkgever niet uitdrukkelijk een bepaalde verhouding tussen verschillende pensioensoorten
      is overeengekomen wordt de beschikbaar gestelde premie of de aanspraak op kapitaal, bedoeld in
      [artikel 12c, tweede lid, van de Wet gelijke behandeling van mannen en vrouwen][ref1] zodanig vastgesteld dat,
      ervan uitgaande dat slechts ouderdomspensioen is toegezegd, het in te kopen pensioen naar het inzicht op het
      tijdstip van vaststelling van die bijdrage voor mannen en vrouwen gelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel12c
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: 12c
  - number: 17a.1
    text: |-
      Bij toepassing van een periodieke vaste daling van de uitkering als
      bedoeld in [artikel 63a, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 75a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] wordt de uitkeringshoogte
      vastgesteld door te rekenen met een periodieke vaste daling van de uitkering die niet meer bedraagt dan 35% van
      het verschil tussen de risicovrije rente en de parameter voor aandelenrendement en niet meer dan consistent is
      met het beleggingsbeleid. De waarde van de met de risicovrije rente contant gemaakte kasstromen is gelijk aan het
      pensioenkapitaal op pensioendatum.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 75a
  - number: 17a.2
    text: |-
      Voor het vaststellen van de maximale hoogte van de periodieke vaste daling als bedoeld in het eerste lid kan de
      risicovrije rentecurve worden omgerekend tot één rentepercentage door middel van een duratie benadering.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17a
  - number: 17a.3
    text: De uitvoerder legt vast of en zo ja op welke wijze een periodieke vaste daling wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17a
  - number: 17b
    text: |-
      De risicovrije rente, bedoeld in [artikel 63a, derde, zevende en achtste lid, van de Pensioenwet][ref1],
      [artikel 75a, derde, zevende en achtste lid, van de Wet verplichte beroepspensioenregeling][ref2], en artikel 17a,
      eerste lid, is de risicovrije rente voor fondsen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 75a
  - number: 17c.1
    text: |-
      De uitvoerder legt de toedelingskring vast en informeert de deelnemer, gewezen deelnemer of pensioengerechtigde
      hierover voorafgaand aan zijn toetreding tot de toedelingskring.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17c
  - number: 17c.2
    text: |-
      De uitvoerder legt de vormgeving van het toedelingsmechanisme voor het beleggingsrisico vast en onderbouwt dat
      daarbij op voorhand geen sprake is van herverdelingseffecten tussen leeftijdsgroepen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17c
  - number: 17d
    text: |-
      De parameter voor aandelenrendement, bedoeld in [artikel 63a, derde lid, van de Pensioenwet][ref1],
      [artikel 75a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2]
      en artikel 17a, eerste lid, is gelijk aan de parameter, bedoeld in
      [artikel 23a, eerste lid, onderdeel b, van het Besluit financieel toetsingskader pensioenfondsen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75a
      [ref3]: https://wetten.overheid.nl/BWBR0020871#Artikel23a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 75a
      - id: ref3
        bwb_id: BWBR0020871
        artikel: 23a
  - number: 17e.1
    text: |-
      De overdragende uitvoerder die gebruikmaakt van het recht op waardeoverdracht van een
      kleine pensioenaanspraak, bedoeld in [artikel 70a van de Pensioenwet][ref1] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2], vraagt binnen een jaar nadat de deelneming
      van de deelnemer is geëindigd bij het pensioenregister een opgave van de uitvoerder bij wie de gewezen deelnemer
      pensioenaanspraken verwerft, tenzij de uitvoerder aantoont dat aan uitvraag binnen deze termijn redelijkerwijs niet
      kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 81a
  - number: 17e.2
    text: |-
      De overdragende uitvoerder herhaalt het verzoek om een opgave ten minste jaarlijks zolang de waardeoverdracht van
      de kleine pensioenaanspraak niet heeft plaatsgevonden. De uitvoerder registreert de verzoeken en registreert of
      deze tot een waardeoverdracht hebben geleid.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
  - number: 17e.3
    text: |-
      Het pensioenregister meldt de overdragende uitvoerder zo spoedig mogelijk of, en zo ja bij welke uitvoerder, de
      gewezen deelnemer pensioenaanspraken verwerft en wat zijn klantherkenningsnummer bij deze uitvoerder is.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
  - number: 17e.4
    text: |-
      De overdragende uitvoerder betaalt binnen tien werkdagen na de melding dat de gewezen deelnemer bij een uitvoerder
      pensioenaanspraken verwerft, de overdrachtswaarde aan de ontvangende uitvoerder. De overdragende uitvoerder
      verstrekt daarbij het klantherkenningsnummer en de geboortedatum van de gewezen deelnemer en andere relevante
      gegevens aan de ontvangende uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
  - number: 17e.5
    text: |-
      De ontvangende uitvoerder wendt de overdrachtswaarde binnen een maand aan voor pensioenaanspraken en informeert de
      deelnemer daarna binnen tien werkdagen over de waardeoverdracht en de verworven pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
  - number: 17e.6
    text: |-
      De [artikelen 25 tot en met 28][ref1] zijn van overeenkomstige toepassing op de waardeoverdracht van een kleine
      pensioenaanspraak met dien verstande dat als overdrachtsdatum wordt aangemerkt de datum waarop de overdragende
      uitvoerder de overdrachtswaarde aan de ontvangende uitvoerder betaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel25
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 17e.7
    text: |-
      De overdragende uitvoerder verstrekt de gewezen deelnemer op verzoek binnen twee weken een opgave van de berekening
      van de overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17e
  - number: 17f.1
    text: |-
      De voorwaarden, bedoeld in [artikel 220b, vierde lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 214a, vierde lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2] zijn als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel220b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel214a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 220b
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 214a
  - number: 17f.1.a
    text: |-
      de uitvoerder die gebruik wil maken van het recht op waardeoverdracht vraagt binnen zes maanden na 1 januari
      2020 bij het pensioenregister een opgave van de uitvoerders bij wie de gewezen deelnemers, waarvoor de uitvoerder
      gebruik wil maken van het recht op waardeoverdracht, pensioenaanspraken verwerven;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
  - number: 17f.1.b
    text: de uitvoerder handelt bij de waardeoverdracht conform het plan, bedoeld in het tweede lid; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
  - number: 17f.1.c
    text: de uitvoerder informeert de betreffende gewezen deelnemers over de voorgenomen waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
  - number: 17f.2
    text: |-
      De uitvoerders maken, in overleg met de Stichting Pensioenregister, een plan voor een gefaseerde uitvoering van de
      waardeoverdracht voor de in het eerste lid, onderdeel a, bedoelde gevallen, waarbij rekening wordt gehouden met de
      capaciteit van het pensioenregister en de belangen van de overdragende en ontvangende uitvoerders. Op voordracht
      van de uitvoerders en de Stichting Pensioenregister, en na advies van de toezichthouders, stelt Onze Minister het
      plan vast. Het plan wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
  - number: 17f.3
    text: |-
      De overdragende uitvoerder die de opgave, bedoeld in het eerste lid, onderdeel a, heeft gevraagd,
      vraagt op het moment dat dit is opgenomen in het plan, bedoeld in het tweede lid, bij het
      pensioenregister een opgave van de uitvoerder bij wie de gewezen deelnemer pensioenaanspraken verwerft.
      [Artikel 17e, derde tot en met zevende lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel17e
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 17e
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 17g.1
    text: |-
      De deelnemer wiens verwerving van pensioenaanspraken in de door de ontvangende uitvoerder
      uitgevoerde pensioenregeling voor 1 januari 2015 een aanvang heeft genomen, vraagt
      een opgave als bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 82, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] binnen zes maanden na aanvang van
      de verwerving.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
  - number: 17g.2
    text: |-
      Indien op grond van [artikel 74, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 85, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], de plichten van de
      overdragende en de ontvangende uitvoerder, bedoeld in [artikel 71 van de Pensioenwet][ref3] dan wel
      [artikel 82 van de Wet verplichte beroepspensioenregeling][ref4], herleven, wordt de in het eerste lid omschreven
      verplichting van de deelnemer om binnen zes maanden een opgave te vragen verlengd tot zes maanden na die herleving.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '85'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '82'
  - number: '18.1'
    text: |-
      De ontvangende uitvoerder vraagt binnen één maand nadat de deelnemer een opgave heeft
      gevraagd als bedoeld in [artikel 71, derde lid, van de Pensioenwet][ref1] dan wel
      [artikel 82, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] van zijn pensioenaanspraken, aan de
      overdragende uitvoerder een opgave per de overdrachtsdatum van de overdrachtswaarde en de daaraan ten grondslag
      liggende gegevens, waaronder:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
  - number: 18.1.a
    text: de pensioenaanspraken waarop de overdrachtswaarde is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
  - number: 18.1.b
    text: de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
  - number: 18.1.c
    text: geslacht, geboortedatum en pensioendatum; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
  - number: 18.1.d
    text: alle overige informatie die van belang is voor de uitvoering van de waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien de overdragende uitvoerder een premieovereenkomst of premieregeling uitvoert waarbij de premie wordt belegd,
      geldt de opgave als een voorlopige opgave en is het eerste lid, onderdelen a en b, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel18
  - number: '19'
    text: |-
      De overdragende uitvoerder verstrekt de opgave of de voorlopige opgave, bedoeld in [artikel 18][ref1], binnen twee
      maanden na ontvangst van het daartoe strekkende verzoek aan de ontvangende uitvoerder. Indien toepassing is gegeven
      aan [artikel 19a][ref2] of [artikel 19b][ref3] wordt de termijn, bedoeld in dit artikel, met twee maanden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel19b
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: 19a
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020892
        artikel: 19b
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 19a.1
    text: |-
      De in [artikel 71 van de Pensioenwet][ref1] dan wel [artikel 82 van de Wet verplichte beroepspensioenregeling][ref2]
      genoemde plicht tot waardeoverdracht geldt niet indien een aanvullende bijdrage van de oude of nieuwe werkgever
      noodzakelijk is en voldaan is aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
  - number: 19a.1.a
    text: de aanvullende bijdrage bedraagt meer dan € 15.000,– en meer dan 10% van de overdrachtswaarde; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
  - number: 19a.1.b
    text: de betreffende werkgever is een kleine werkgever.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
  - number: 19a.2
    text: |-
      Een kleine werkgever als bedoeld in het eerste lid, onderdeel b, is een werkgever te wiens laste, in het tweede
      kalenderjaar dat aan het kalenderjaar waarin de in het derde lid bedoelde situatie wordt vastgesteld vooraf is
      gegaan, een premieplichtig loon als bedoeld in [artikel 2.5, eerste lid, onderdeel a, van het Besluit Wfsv][ref1],
      is gekomen dat gelijk is aan of minder bedraagt dan 25 maal het door het Uitvoeringsinstituut
      werknemersverzekeringen vastgestelde gemiddelde premieplichtige loon per werknemer in dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 19a.3
    text: |-
      Indien de overdragende pensioenuitvoerder bij vaststelling van de opgave of voorlopige opgave, bedoeld in
      [artikel 18][ref1] of de ontvangende pensioenuitvoerder na ontvangst van de opgave of voorlopige opgave, bedoeld
      in artikel 18, vaststelt dat een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is die meer
      bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde, stelt hij de betreffende werkgever in de
      gelegenheid om binnen een maand na ontvangst van het daartoe strekkende verzoek aan te tonen dat de werkgever een
      kleine werkgever is als bedoeld in het eerste lid, onderdeel b. Tevens wordt de betreffende werkgever gevraagd
      of hij, indien hij een kleine werkgever is, bereid is de aanvullende bijdrage te betalen. De overdragende
      pensioenuitvoerder informeert de ontvangende pensioenuitvoerder terstond na afloop van de gegeven termijn over
      hetgeen van de oude werkgever is vernomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 19a.4
    text: |-
      Indien de werkgever niet binnen de gegeven termijn aantoont een kleine werkgever te zijn als bedoeld in het eerste
      lid, onderdeel b, wordt aangenomen dat hij geen kleine werkgever is.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
  - number: 19a.5
    text: |-
      Indien op grond van de voorgaande leden de plicht tot waardeoverdracht niet geldt en de werkgever niet bereid is de
      aanvullende bijdragen te betalen, informeert de ontvangende pensioenuitvoerder de deelnemer hierover schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
  - number: 19a.6
    text: |-
      Dit artikel is uitsluitend van toepassing indien de verwerving van pensioenaanspraken door de deelnemer in de door
      de ontvangende uitvoerder uitgevoerde pensioenregeling voor 1 januari 2015 een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19a
  - number: 19b.1
    text: |-
      De in [artikel 71 van de Pensioenwet][ref1] dan wel [artikel 82 van de Wet verplichte beroepspensioenregeling][ref2]
      genoemde plicht tot waardeoverdracht geldt niet indien een aanvullende bijdrage van de oude of nieuwe werkgever
      noodzakelijk is en de aanvullende bijdrage meer bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
  - number: 19b.2
    text: |-
      Indien de overdragende uitvoerder bij vaststelling van de opgave of voorlopige opgave, bedoeld in
      [artikel 18][ref1], of de ontvangende uitvoerder na ontvangst van de opgave of voorlopige opgave, bedoeld in
      artikel 18, vaststelt dat een aanvullende bijdrage van de oude of nieuwe werkgever noodzakelijk is die meer
      bedraagt dan € 15.000,– en meer dan 10% van de overdrachtswaarde, wordt de betreffende werkgever gevraagd binnen
      een maand na ontvangst van het verzoek aan te geven of hij bereid is de aanvullende bijdrage te betalen. De
      overdragende uitvoerder informeert de ontvangende uitvoerder terstond na afloop van de gegeven termijn over hetgeen
      van de oude werkgever is vernomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 19b.3
    text: |-
      Indien de werkgever niet binnen de gegeven termijn aangeeft bereid te zijn de aanvullende bijdragen te betalen,
      wordt aangenomen dat hij hiertoe niet bereid is.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19b
  - number: 19b.4
    text: |-
      Indien op grond van de voorgaande leden de plicht tot waardeoverdracht niet geldt en de werkgever niet bereid is de
      aanvullende bijdragen te betalen, informeert de ontvangende uitvoerder de deelnemer hierover schriftelijk.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19b
  - number: 19b.5
    text: |-
      Dit artikel is uitsluitend van toepassing indien de verwerving van pensioenaanspraken door de deelnemer in de door
      de ontvangende uitvoerder uitgevoerde pensioenregeling vanaf 1 januari 2015 een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel19b
  - number: '20'
    text: |-
      De ontvangende uitvoerder verstrekt de opgave of voorlopige opgave, bedoeld in [artikel 18][ref1], binnen
      twee maanden na ontvangst aan de deelnemer onder vermelding van de aanspraken die zullen voortvloeien uit de
      waardeoverdracht en de wijze waarop de aanspraken in de pensioenregeling, ondergebracht bij de ontvangende
      uitvoerder, zullen worden behandeld. Bij de informatie over toeslagverlening is [artikel 4, tweede lid][ref2] van
      overeenkomstige toepassing. Indien toepassing is gegeven aan [artikel 19a][ref3] of [artikel 19b][ref4] wordt de
      termijn, bedoeld in dit artikel, met twee maanden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0020892#Artikel19b
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0020892
        artikel: 19a
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0020892
        artikel: 19b
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '21.1'
    text: |-
      Indien de deelnemer gebruik wil maken van zijn recht op waardeoverdracht, dient hij binnen twee maanden
      na ontvangst van de opgave of voorlopige opgave, bedoeld in [artikel 18][ref1], en, indien van toepassing,
      [artikel 22][ref2], een verzoek tot waardeoverdracht in bij de ontvangende uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel22
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '22'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '21.2'
    text: |-
      Pensioenaanspraken die door de rechthebbende zijn verkregen op grond van de FVP-bijdrage worden geacht inbegrepen
      te zijn in het verzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de partner die begunstigde is voor het partnerpensioen niet instemt met het verzoek tot
      waardeoverdracht met betrekking tot het partnerpensioen, is [artikel 58 van de Pensioenwet][ref1] dan wel
      [artikel 69 van de Wet verplichte beroepspensioenregeling][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel69
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '69'
  - number: '22'
    text: |-
      De deelnemer kan voor het einde van de termijn genoemd in [artikel 21, eerste lid][ref1], verzoeken om een
      aanvullende opgave voor het geval de waarde van het partnerpensioen niet wordt overgedragen. De termijnen, genoemd
      in de [artikelen 18 tot en met 21, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '23.1'
    text: |-
      De ontvangende uitvoerder stelt de overdragende uitvoerder terstond in kennis van de ontvangst van het verzoek
      tot waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het risico dat betrekking heeft op de over te dragen aanspraken, komt met ingang van de datum van het verzoek van
      de rechthebbende, bedoeld in [artikel 21, eerste lid][ref1], voor rekening van de ontvangende uitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '23.3'
    text: |-
      De overdrachtswaarde wordt binnen tien werkdagen na ontvangst van het verzoek tot waardeoverdracht door de
      overdragende uitvoerder aan de ontvangende uitvoerder betaald.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23
  - number: '23.4'
    text: |-
      De overdragende uitvoerder is rente verschuldigd aan de ontvangende uitvoerder over de overdrachtswaarde
      over de periode tussen de overdrachtsdatum en de datum waarop de overdrachtswaarde wordt betaald, tenzij
      het de waardeoverdracht betreft van een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      naar een andere premieovereenkomst of premieregeling waarbij de premie wordt belegd. Bij overdracht van een
      premieovereenkomst of premieregeling waarbij de premie wordt belegd naar een kapitaal- of uitkeringsovereenkomst of
      een kapitaal- of uitkeringsregeling wordt de rente geacht in de overdrachtswaarde begrepen te zijn. Onze Minister
      stelt regels over de berekening van de rente.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23
  - number: 23a.1
    text: |-
      De vaststelling door fondsen of de plicht tot waardeoverdracht, bedoeld in de [artikelen 71][ref1]
      en [76 van de Pensioenwet][ref2] of [artikel 82 van de Wet verplichte beroepspensioenregeling][ref3],
      wordt opgeschort vanwege de in [artikel 72, onderdeel a, van de Pensioenwet][ref4] of
      [artikel 83, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref5] omschreven situatie, vindt plaats
      per de eerste dag van iedere kalendermaand aan de hand van de beleidsdekkingsgraad op de laatste dag van de
      voorafgaande kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '82'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '83'
  - number: 23a.2
    text: |-
      Indien de plicht tot waardeoverdracht is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref1] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref2] omschreven situatie na de datum waarop de
      ontvangende uitvoerder de gegevens, bedoeld in [artikel 20][ref3], aan de deelnemer heeft verstrekt, verhindert de
      opschorting de verdere afhandeling van deze waardeoverdracht niet.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel20
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0020892
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 23a.3
    text: |-
      Indien de plicht tot waardeoverdracht is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref1] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref2] omschreven situatie informeert de ontvangende
      uitvoerder de deelnemer die een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref3]
      schriftelijk over de opschorting van de plicht tot waardeoverdracht en de gevolgen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel18
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 23a.4
    text: |-
      De plicht tot waardeoverdracht herleeft zodra de ontvangende en de overdragende uitvoerder niet langer in de
      in [artikel 72 van de Pensioenwet][ref1] of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref2]
      omschreven situatie verkeren. Het eerste lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '83'
  - number: 23a.5
    text: |-
      Als de plicht tot waardeoverdracht na een periode van opschorting vanwege de in
      [artikel 72 van de Pensioenwet][ref1] of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref2]
      omschreven situatie herleeft, geldt het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '83'
  - number: 23a.5.a
    text: |-
      indien de datum waarop de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in
      artikel 18, ligt voor de datum waarop de plicht tot waardeoverdracht herleeft en de gegevens, bedoeld in
      [artikel 20][ref1], niet aan de deelnemer zijn verstrekt voor de datum waarop de plicht tot waardeoverdracht is
      opgeschort, is, in afwijking van de definitie, bedoeld in [artikel 1][ref2], de overdrachtsdatum de datum waarop de
      plicht tot waardeoverdracht is herleefd;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel1
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '1'
        hoofdstuk: '1'
  - number: 23a.5.b
    text: |-
      indien de deelnemer een opgave heeft gevraagd van zijn pensioenaanspraken als bedoeld in [artikel 18][ref1]
      voor de herleving van de plicht tot waardeoverdracht, vraagt de ontvangende uitvoerder binnen drie maanden na
      herleving van de plicht tot waardeoverdracht aan de overdragende uitvoerder een opgave als bedoeld in artikel 18,
      tenzij de plicht tot waardeoverdracht weer is opgeschort vanwege de in [artikel 72 van de Pensioenwet][ref2] of
      [artikel 83 van de Wet verplichte beroepspensioenregeling][ref3] beschreven situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '18'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '83'
  - number: 23a.6
    text: |-
      Indien in de in het tweede lid beschreven situatie de deelnemer voor de datum van inwerkingtreding van het Besluit
      van 12 november 2009 tot wijziging van het Besluit uitvoering Pensioenwet en Wet verplichte beroepspensioenregeling
      in verband met aanpassing van de regeling voor waardeoverdracht en de kostenregeling (Stb. 2009, 598), een
      verzoek tot waardeoverdracht als bedoeld in [artikel 21][ref1] heeft gedaan dat niet is afgehandeld vanwege de
      in [artikel 72 van de Pensioenwet][ref2] of [artikel 83 van de Wet verplichte beroepspensioenregeling][ref3]
      omschreven situatie, stelt de ontvangende uitvoerder de deelnemer in de gelegenheid zijn verzoek in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '21'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '72'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '83'
  - number: '24'
    text: |-
      Overschrijding van de in dit hoofdstuk gestelde termijnen door de overdragende of ontvangende uitvoerder wordt de
      deelnemer niet tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      De overdrachtswaarde van pensioenaanspraken is ten minste gelijk aan de contante waarde van de over te dragen
      pensioenaanspraken op de overdrachtsdatum en wordt berekend op basis van het standaardtarief. Onze Minister stelt
      regels inzake het standaardtarief. Het standaardtarief wordt berekend op basis van marktwaardering.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de overdrachtswaarde niet op basis van het standaardtarief berekend kan worden, worden de pensioenaanspraken
      met behoud van de actuariële gelijkwaardigheid eerst omgezet in pensioenaanspraken waarop het standaardtarief wel
      toegepast kan worden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: '25.3'
    text: 'Bij de berekening van de overdrachtswaarde mogen buiten beschouwing blijven:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: 25.3.a
    text: partnerpensioen dat is verzekerd op risicobasis, wezenpensioen en arbeidsongeschiktheidspensioen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: 25.3.b
    text: aanspraken op partnerpensioen of nettopensioen die achterblijven bij de overdragende uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: '25.4'
    text: |-
      De overdrachtswaarde wordt, in afwijking van het eerste lid, niet berekend op basis van het standaardtarief indien
      de pensioenaanspraken voortvloeien uit:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: 25.4.a
    text: een kapitaalovereenkomst of kapitaalregeling;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: 25.4.b
    text: een premieovereenkomst of premieregeling, waarbij de premie wordt belegd; of
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: 25.4.c
    text: |-
      een premieovereenkomst of premieregeling waarbij de premie wordt aangewend voor de aankoop van een verzekerd
      kapitaal.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: '25.5'
    text: Onze Minister stelt regels voor de berekening van de overdrachtswaarde in de in het vierde lid genoemde gevallen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel25
  - number: '26'
    text: |-
      Indien bij een uitkeringsovereenkomst, een uitkeringsregeling of een premieovereenkomst of premieregeling
      waarbij de premie onmiddellijk na het beschikbaar stellen wordt omgezet in een aanspraak op een uitkering de
      overdrachtswaarde niet gelijk is aan de waarde van het gefinancierde deel van de aanspraken, komt het verschil ten
      gunste, respectievelijk ten laste, van de oude werkgever of van het fonds waar de regeling was ondergebracht.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister stelt regels voor de berekening van de inkoop van pensioenaanspraken op grond van de
      overdrachtswaarde in de pensioenregeling van de ontvangende uitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel27
  - number: '27.2'
    text: |-
      In geval van waardeoverdracht naar een premieovereenkomst of premieregeling waarbij de premie wordt belegd
      wordt de overdrachtswaarde binnen een week na ontvangst van de overdrachtswaarde aangewend voor de aankoop van
      beleggingseenheden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      De na waardeoverdracht verkregen aanspraken in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder,
      worden behandeld alsof zij in die regeling zelf zijn opgebouwd, waarbij zij ook ten aanzien van de toeslagverlening
      op dezelfde manier behandeld worden.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      Indien de ontvangende uitvoerder een beroepspensioenregeling uitvoert, kan worden afgeweken van het eerste lid
      ten aanzien van de toeslagverlening indien toepassing van het eerste lid op dat punt zou leiden tot een kennelijk
      onredelijk resultaat.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Indien in de pensioenregeling, ondergebracht bij de ontvangende uitvoerder, pensioenopbouw plaatsvindt op basis van
      dienstjaren, wordt de overdrachtswaarde omgezet in voor de pensioenopbouw meetellende dienstjaren.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28
  - number: '28.4'
    text: |-
      In een pensioenregeling die voor de pensioenopbouw rekent met een maximaal te bereiken aantal dienstjaren, geldt
      dat, indien toepassing van het tweede lid leidt tot meer dan het maximale aantal dienstjaren, het meerdere wordt
      behandeld als een bij ontslag verkregen pensioenaanspraak in die regeling.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28
  - number: 28a.1
    text: |-
      De voorzitter van een omgekeerd gemengd bestuur als bedoeld in [artikel 99 van de Pensioenwet][ref1] bepaalt de
      agenda van de overleggen van het bestuur en het niet uitvoerend deel van het bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28a.2
    text: |-
      De voorzitter van een omgekeerd gemengd bestuur ziet toe op een goede samenstelling en het functioneren van het
      bestuur en is namens het bestuur eerste aanspreekpunt voor het verantwoordingsorgaan over het functioneren van
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28a
  - number: 28b.1
    text: |-
      De niet uitvoerende bestuurders bij een omgekeerd gemengd bestuur als bedoeld in
      [artikel 99 van de Pensioenwet][ref1] stellen een auditcommissie bedrijfseconomische aspecten en risicobeheer in.
      Deze auditcommissie is in ieder geval belast met toezicht op:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel99
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '99'
  - number: 28b.1.a
    text: de risicobeheersing;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28b
  - number: 28b.1.b
    text: het beleggingsbeleid;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28b
  - number: 28b.1.c
    text: de financiële informatieverschaffing door het fonds.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28b
  - number: 28b.2
    text: |-
      De Nederlandsche Bank kan ontheffing verlenen van het eerste lid indien op andere wijze wordt voorzien in adequaat
      toezicht op het in het vorige lid genoemde.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28b
  - number: 28c.1
    text: De raad van toezicht van een fonds kan de bestuurders van het fonds schorsen of ontslaan wegens disfunctioneren.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28c
  - number: 28c.2
    text: |-
      Van disfunctioneren als bedoeld in het eerste lid is in ieder geval sprake indien het bestuur een
      besluit heeft genomen zonder de op grond van [artikel 104, derde lid, van de Pensioenwet][ref1] of
      [artikel 110a, derde lid, van de Wet verplichte beroepspensioenregeling][ref2] benodigde goedkeuring van de raad
      van toezicht en het bestuur niet aannemelijk maakt dat dit nodig was in het belang van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden dan wel voortvloeit uit een aanwijzing van de
      toezichthouder, een last onder dwangsom of rechtstreeks voortvloeit uit een wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110a
  - number: 28c.3
    text: |-
      Het bestuur van een fonds legt de benoeming van een kandidaat bestuurder voor aan de raad van toezicht. De raad van
      toezicht kan de benoeming van deze kandidaat bestuurder beletten indien deze niet voldoet aan de profielschets.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel28c
  - number: '29.1'
    text: |-
      De Nederlandsche Bank toetst de geschiktheid en de betrouwbaarheid van een persoon die het beleid
      van een fonds bepaalt of mede bepaalt, bedoeld in [artikel 106 van de Pensioenwet][ref1] dan wel
      [artikel 110c van de Wet verplichte beroepspensioenregeling][ref2], voorafgaand aan de benoeming van deze persoon
      en op ieder ander moment, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding toe bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110c
  - number: '29.2'
    text: |-
      De Nederlandsche Bank toetst de betrouwbaarheid van een persoon die houder is van de risicobeheerfunctie, interne
      auditfunctie of actuariële functie voorafgaand aan de benoeming van deze persoon en op ieder ander moment,
      indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding toe bestaat. De Nederlandsche Bank toetst de
      geschiktheid van de houders van deze functies, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding
      toe bestaat.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel29
  - number: '29.3'
    text: |-
      De Nederlandsche Bank toetst de geschiktheid en betrouwbaarheid van een persoon die het intern toezicht van een
      fonds door een visitatiecommissie, de risicobeheerfunctie, interne auditfunctie of actuariële functie, niet zijnde
      het houderschap van deze functie, uitoefent, indien daar, naar het oordeel van de Nederlandsche Bank, aanleiding
      toe bestaat.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel29
  - number: '30.1'
    text: |-
      De personen die het beleid van het fonds bepalen of mede bepalen voldoen aan de vereiste geschiktheid indien
      hun kwalificaties, kennis en ervaring, waaronder vaardigheden en professioneel gedrag, volstaan om een gezond en
      prudent bestuur van het fonds mogelijk te maken, met inachtneming van de samenstelling en het functioneren van
      het collectief.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel30
  - number: '30.2'
    text: |-
      De personen die de interne auditfunctie of actuariële functie vervullen voldoen aan de vereiste geschiktheid indien
      hun beroepskwalificaties, beroepskennis en beroepservaring volstaan om de functie naar behoren te vervullen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel30
  - number: '30.3'
    text: |-
      De personen die de risicobeheerfunctie vervullen voldoen aan de vereiste geschiktheid, indien hun kwalificaties,
      kennis en ervaring volstaan om de functie naar behoren te vervullen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel30
  - number: '31'
    text: |-
      De Nederlandsche Bank stelt vast of de betrouwbaarheid van een persoon
      als bedoeld in [artikel 106, vierde lid, van de Pensioenwet][ref1] dan wel
      [artikel 110c, vierde lid, van de Wet verplichte beroepspensioenregeling][ref2] buiten twijfel staat op basis van
      diens voornemens, handelingen en antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '106'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110c
  - number: '32'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 31][ref1], in ieder geval in aanmerking de in
      de bijlage bij dit besluit genoemde antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '31'
        hoofdstuk: '7'
  - number: '33.1'
    text: |-
      De Nederlandsche Bank verkrijgt inzicht in de in [artikel 31][ref1] bedoelde voornemens, handelingen en
      antecedenten op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '31'
        hoofdstuk: '7'
  - number: 33.1.a
    text: door betrokkene verstrekte gegevens en inlichtingen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.b
    text: van de Landelijke Officier van Justitie verkregen gegevens uit de politieregisters;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.c
    text: |-
      gegevens uit de registratie, bedoeld in [artikel 1, onderdeel b, van de Wet controle op rechtspersonen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015049#Artikel1
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015049
        artikel: '1'
  - number: 33.1.d
    text: gegevens en inlichtingen, verkregen van de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.e
    text: |-
      gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.f
    text: ambtsberichten van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.g
    text: inlichtingen, verkregen van door betrokkene opgegeven referenties;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.h
    text: gegevens uit openbare bronnen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.i
    text: |-
      inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 31][ref1] bedoelde persoon betrokken
      is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '31'
        hoofdstuk: '7'
  - number: 33.1.j
    text: inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene; of
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.1.k
    text: gegevens en inlichtingen, verkregen uit andere bij ministeriële regeling aan te wijzen bronnen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de Nederlandsche Bank aanleiding geven
      tot nader onderzoek, kan de Nederlandsche Bank ook inlichtingen inwinnen en gegevens opvragen bij andere personen
      of instanties dan genoemd in dat lid. De Nederlandsche Bank stelt de betrokkene in dat geval vooraf schriftelijk in
      kennis van:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.2.a
    text: de reden van het nadere onderzoek;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.2.b
    text: de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: 33.2.c
    text: de aard van de nadere gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel33
  - number: '34.1'
    text: |-
      De betrouwbaarheid van een persoon als bedoeld in [artikel 31][ref1] staat niet buiten twijfel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '31'
        hoofdstuk: '7'
  - number: 34.1.a
    text: |-
      deze onherroepelijk veroordeeld is ter zake van een misdrijf, genoemd in onderdeel 1 van de bijlage bij dit
      besluit, waarbij sinds het onherroepelijk worden van de uitspraak minder dan acht jaren zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
  - number: 34.1.b
    text: |-
      deze veroordeeld is ter zake van een misdrijf, genoemd in onderdeel 1 van de bijlage bij dit besluit, waarbij de
      uitspraak nog niet onherroepelijk is of waarbij sinds het onherroepelijk worden van de uitspraak acht of meer jaren
      zijn verstreken;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
  - number: 34.1.c
    text: |-
      deze veroordeeld is ter zake van een overtreding van
      [artikel 69 van de Algemene wet inzake de rijksbelastingen][ref1] of [artikel 65 van de Invorderingswet 1990][ref2],
      waarbij betrokkene veroordeeld is tot een gevangenisstraf of boete; of


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel65
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '65'
  - number: 34.1.d
    text: |-
      deze een vergrijpboete van meer dan € 62.500 opgelegd heeft gekregen ter zake van een feit, genoemd in onderdeel 5
      van de bijlage bij dit besluit, en het besluit waarbij de vergrijpboete is opgelegd onherroepelijk is geworden of
      waarbij ten minste de rechter in eerste aanleg uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      De Nederlandsche Bank kan op grond van de omstandigheden of belangen, genoemd in [artikel 35][ref1], afwijken van
      het eerste lid, ten aanzien van de onderdelen b, c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel35
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '35'
        hoofdstuk: '7'
  - number: '35'
    text: |-
      De Nederlandsche Bank neemt bij de vaststelling, bedoeld in [artikel 31][ref1], in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel31
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '31'
        hoofdstuk: '7'
  - number: 35.a
    text: |-
      het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de overige
      omstandigheden van het geval;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35
  - number: 35.b
    text: |-
      de belangen die de [Pensioenwet][ref1] en de [Wet verplichte beroepspensioenregeling][ref2] beogen te beschermen;
      en


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: 35.c
    text: de overige belangen van het fonds en de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35
  - number: 35a.1
    text: |-
      Tot bestuurder of lid van de raad van toezicht van een fonds kunnen in ieder geval niet worden benoemd personen die
      door deze benoeming meer dan 1 voltijd equivalent aan werkzaamheden als bestuurder of in een toezichthoudend orgaan
      zouden verrichten.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.2
    text: 'Voor de toepassing van het eerste lid telt als voltijd equivalent bij rechtspersonen een functie als:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.2.a
    text: bestuursvoorzitter of bestuurder ten minste als 0,6;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.2.b
    text: voorzitter van een toezichthoudend orgaan ten minste als 0,4; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.2.c
    text: lid van een toezichthoudend orgaan ten minste als 0,2.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.3
    text: 'Voor de toepassing van het eerste lid telt als voltijd equivalent bij grote fondsen een functie als:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.3.a
    text: bestuursvoorzitter ten minste als 0,6;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.3.b
    text: bestuurder ten minste als 0,4;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.3.c
    text: voorzitter van een raad van toezicht ten minste als 0,2; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.3.d
    text: lid van een raad van toezicht ten minste als 0,1.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.4
    text: 'Voor de toepassing van het eerste lid telt als voltijd equivalent bij kleine fondsen een functie als:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.4.a
    text: bestuursvoorzitter ten minste als 0,3;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.4.b
    text: bestuurder ten minste als 0,2;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.4.c
    text: voorzitter van een raad van toezicht ten minste als 0,2; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.4.d
    text: lid van een raad van toezicht ten minste als 0,1.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5.a
    text: 'wordt verstaan onder een klein fonds: een fonds met een beheerd vermogen van niet meer dan € 10 miljard;'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5.b
    text: 'wordt verstaan onder een groot fonds: een fonds met meer dan € 10 miljard beheerd vermogen;'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5.c
    text: |-
      betreft de verwijzing naar rechtspersonen de rechtsvorm van de naamloze vennootschap en de besloten
      vennootschap met beperkte aansprakelijkheid die op twee opeenvolgende balansdata, zonder onderbreking
      nadien op twee opeenvolgende balansdata, niet heeft voldaan aan ten minste twee van de vereisten, bedoeld in
      [artikel 397, eerste en tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1], onderscheidenlijk de stichting,
      bedoeld in [artikel 297a, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2], niet zijnde een fonds;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel397
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel297a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '397'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 297a
  - number: 35a.5.d
    text: telt de benoeming bij verschillende rechtspersonen die met elkaar in een groep zijn verbonden, als één benoeming;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5.e
    text: |-
      wordt verstaan onder toezichthoudend orgaan: een raad van toezicht, een raad van commissarissen of indien bij een
      rechtspersoon de bestuurstaken zijn verdeeld over uitvoerende en niet-uitvoerende bestuurders, niet uitvoerende
      bestuurders;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35a.5.f
    text: |-
      geldt een tijdelijke aanstelling overeenkomstig [artikel 349a, tweede lid][ref1], of
      [artikel 356, onder c, van Boek 2 van het Burgerlijk wetboek][ref2], niet als benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel349
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel356
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '349'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '356'
  - number: 35a.6
    text: |-
      De nietigheid van de benoeming op grond van de vorige leden heeft geen gevolgen voor de rechtsgeldigheid van de
      besluitvorming waaraan is deelgenomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35a
  - number: 35b.1
    text: |-
      De Nederlandsche Bank verleent de verklaring van geen bezwaar, bedoeld in [artikel 114 van de Pensioenwet][ref1] en
      [artikel 113a van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel113a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '114'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 113a
  - number: 35b.2
    text: 'Bij de aanvraag van de verklaring van geen bezwaar, bedoeld in het eerste lid, worden in ieder geval verstrekt:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35b
  - number: 35b.2.a
    text: |-
      een door een accountant gecontroleerde en gewaarmerkte balans van het fonds met als peildatum de datum van
      omzetting van het fonds in een andere rechtsvorm; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35b
  - number: 35b.2.b
    text: |-
      de schriftelijk vastgelegde afspraken over de besteding van het vermogen van het fonds en de vruchten daarvan na
      de omzetting.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel35b
  - number: '36.1'
    text: |-
      De Stichting Autoriteit Financiële Markten houdt toezicht op de naleving van de regels, gesteld bij of krachtens
      de [artikelen 21, eerste lid, tweede lid, tweede zin, vierde lid][ref1], [29, eerste lid][ref2], 29, zevende
