        artikel: 55a
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 75b
  - number: 7c.3
    text: |-
      De uitvoerder die geen vastgestelde uitkeringen uitvoert, geeft bij de opgave van de hoogte van de
      vastgestelde uitkeringen, bedoeld in [artikel 44a, eerste lid, van de Pensioenwet][ref1] dan wel
      [artikel 55a, eerste lid, van de Wet verplichte beroepspensioenregeling][ref2], aan dat een vastgestelde uitkering
      naar verwachting lager is dan een variabele uitkering maar met minder of geen kans op afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel55a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel7c
    references:
