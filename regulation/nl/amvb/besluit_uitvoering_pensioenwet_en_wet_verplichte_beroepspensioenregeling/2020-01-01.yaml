  - number: 1a.1
    text: |-
      Voor zover een aanvulling op een vervolguitkering of een loonaanvullingsuitkering geen
      arbeidsongeschiktheidspensioen is als bedoeld in [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], wordt deze aanvulling als
      arbeidsongeschiktheidspensioen in de zin van een van die artikelen aangemerkt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 1a.1.a
    text: |-
      de aanvulling op de vervolguitkering niet varieert met inkomsten uit arbeid, tenzij de aanvulling hoger wordt
      vastgesteld indien de inkomsten uit arbeid toenemen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      de aanvulling op de loonaanvullingsuitkering niet varieert met inkomsten uit arbeid, tenzij de aanvulling hoger
      wordt vastgesteld indien de inkomsten uit arbeid toenemen; of
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel1a
  - number: 1a.1.c
    text: het een eenmalige aanvulling is die wordt verstrekt in verband met werkhervatting of werkuitbreiding.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Het eerste lid is niet van toepassing op algemeen verbindend verklaarde bepalingen van collectieve
      arbeidsovereenkomsten die betrekking hebben op aanvullingen op een vervolguitkering of op een
      loonaanvullingsuitkering, indien het verzoek tot algemeen verbindend verklaring is ingediend voor de datum van
      inwerkingtreding van de Wet van 15 juli 2008 houdende enige wijzigingen van de Pensioenwet, de Wet verplichte
      beroepspensioenregeling en enige andere wetten.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel1a
  - number: '2.1'
    text: |-
      De informatie over de kenmerken van de pensioenregeling en de uitvoering van de pensioenregeling, bedoeld in
      [artikel 21 van de Pensioenwet][ref1] dan wel [artikel 48 van de Wet verplichte beroepspensioenregeling][ref2],
      bevat in ieder geval het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '48'
  - number: 2.1.a
    text: de pensioensoorten waarin de basispensioenregeling voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.b
    text: de pensioensoorten waarin de basispensioenregeling niet voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.c
    text: de wijze waarop pensioen wordt opgebouwd;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.d
    text: de keuzemogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling voorziet;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.e
    text: de risico’s;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.f
    text: de soorten uitvoeringskosten;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.g
    text: de beleidsdekkingsgraad met een omschrijving van de gevolgen ervan;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.h
    text: |-
      op welke wijze in het beleggingsbeleid rekening wordt gehouden met milieu en klimaat, mensenrechten en sociale
      verhoudingen; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: 2.1.i
    text: |-
      indien van toepassing, de beleggingsmogelijkheden van de deelnemer of gewezen deelnemer waarin de pensioenregeling
      voorziet.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      De uitvoerder maakt bij het verstrekken van de informatie, bedoeld in het eerste lid, gebruik van de opschriften
      en iconen in de volgorde waarin ze staan in laag 1 van de Pensioen1-2-3, zoals deze op de website van de
      Pensioenfederatie en het Verbond van Verzekeraars is opgenomen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: '2.3'
    text: Bij ministeriële regeling worden regels gesteld over de opschriften en iconen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel2
  - number: '3'
    text: |-
      De Stichting Autoriteit Financiële Markten kan nadere regels stellen met betrekking tot het informeren van
      de deelnemer over de risico’s, bedoeld in [artikel 2, eerste lid, onderdeel e][ref1], voor zover het gaat om
      premieovereenkomsten dan wel premieregelingen met beleggingsvrijheid voor de deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel2
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '2'
        hoofdstuk: '2'
  - number: '4.1'
