  - number: 7d.2
    text: |-
      Op voordracht van de uitvoerders en na advies van de Autoriteit Financiële Markten stelt Onze Minister de
      standaardmodellen vast. De modellen worden beschikbaar gesteld op de website van de Pensioenfederatie en het
      Verbond van Verzekeraars.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel7d
  - number: 7e.1
    text: |-
      Voor de weergave op basis van een pessimistisch scenario, een verwacht scenario en een
      optimistisch scenario, bedoeld in de [artikelen 38, eerste lid, onderdeel g][ref1],
      [40, eerste lid, onderdeel a][ref2], [44a, eerste lid][ref3], [45, tweede lid][ref4],
      [46, derde en vijfde lid][ref5], [51, eerste lid][ref6], en [63b, tweede lid, van de Pensioenwet][ref7],
      de [artikelen 49, eerste lid, onderdeel g][ref8], [51, eerste lid, onderdeel b][ref9],
      [55a, eerste lid][ref10], [56, tweede lid][ref11], [57, derde en vijfde lid][ref12],
      [62, eerste lid][ref13] en [75b, tweede lid, van de Wet verplichte beroepspensioenregeling][ref14]
      en, voor zover het betreft weergave op basis van een pessimistisch en verwacht scenario,
      [artikel 1a van het Besluit financieel toetsingskader pensioenfondsen][ref15], wordt gebruik gemaakt van de
      scenariosets, bedoeld in [artikel 23b van het Besluit financieel toetsingskader pensioenfondsen][ref16] en een
      voorgeschreven rekenmethodiek.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
