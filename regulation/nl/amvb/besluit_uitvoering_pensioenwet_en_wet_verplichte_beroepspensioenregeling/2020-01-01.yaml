        artikel: '15'
        hoofdstuk: '5'
  - number: '63.2'
    text: |-
      De [artikelen 2 tot en met 10][ref1] treden in werking met ingang van 1 januari 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel2
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '2'
        hoofdstuk: '2'
  - number: '63.3'
    text: |-
      [Artikel 15][ref1] geldt ten aanzien van de keuzemogelijkheid, bedoeld in
