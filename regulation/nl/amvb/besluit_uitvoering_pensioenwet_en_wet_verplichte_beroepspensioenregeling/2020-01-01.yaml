        artikel: 81a
      - id: ref3
        bwb_id: BWBR0020892
        artikel: 17e
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '63.1'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2007, met uitzondering van de
      [artikelen 2 tot en met 10][ref1] en [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel15
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel63
