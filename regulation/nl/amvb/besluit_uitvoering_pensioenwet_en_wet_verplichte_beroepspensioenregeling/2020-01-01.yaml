  - number: 7e.2
    text: Bij ministeriële regeling worden regels gesteld met betrekking tot de rekenmethodiek.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel7e
  - number: '8.1'
    text: |-
      De uitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling over
      de inhoud van de vrijwillige pensioenregeling, waarbij de [artikelen 2][ref1] en [3][ref2] van overeenkomstige
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel3
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      De informatie over de reglementair te bereiken pensioenaanspraken wordt overeenkomstig de [artikelen 5a][ref1] en
      [9, eerste en tweede lid][ref2], vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel9
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 5a
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '9'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      De informatie over de beleggingsresultaten wordt verstrekt indien sprake is van een premieovereenkomst of
      premieregeling en heeft betrekking op de resultaten van de afgelopen vijf jaar of, indien de pensioenregeling
      minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is uitgevoerd door de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel8
  - number: '8.4'
    text: |-
      De informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en pensioengerechtigden
      worden gedragen wordt verstrekt indien sprake is van een premieovereenkomst of premieregeling en heeft betrekking
      op de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1], de kosten van vermogensbeheer,
      bedoeld in artikel 10a, tweede lid, en de transactiekosten, bedoeld in artikel 10a, derde lid, indien deze kosten
      van invloed zijn op de pensioenaanspraak of het pensioenrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: '9.1'
    text: 'De uitvoerder verstrekt de deelnemer, gewezen deelnemer of gewezen partner op verzoek:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9.1.a
    text: |-
      in geval van een kapitaalovereenkomst dan wel kapitaalregeling een opgave van de hoogte van het voor periodieke
      uitkeringen aan te wenden kapitaal op de ingangsdatum van het pensioen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9.1.b
    text: 'in geval van een premieovereenkomst dan wel premieregeling:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9.1.b.1°
    text: |-
      wanneer de premie wordt belegd, een indicatie van het te bereiken voor periodieke uitkeringen aan te wenden
      kapitaal op de pensioendatum met de daarbij gehanteerde veronderstellingen; of
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9.1.b.2°
    text: |-
      de hoogte van het voor periodieke uitkeringen aan te wenden verzekerd kapitaal wanneer de premie voor de
      ingangsdatum van het pensioen reeds daarvoor wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de in het eerste lid bedoelde opgave wordt ten aanzien van nabestaandenpensioen aangegeven wat de consequenties
      zijn van de gekozen wijze van financieren.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien sprake is van een premieovereenkomst dan wel premieregeling waarbij de deelnemer of gewezen deelnemer
      tijdens de opbouwperiode de verantwoordelijkheid voor de beleggingen heeft overgenomen verstrekt de uitvoerder
      op verzoek van de deelnemer of gewezen deelnemer informatie over alle beleggingsmogelijkheden, de feitelijke
      beleggingsportefeuille, de risicopositie en de kosten in verband met de beleggingen.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      De uitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde op
      verzoek:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9.4.a
    text: |-
      informatie over het van toepassing zijn van een aanwijzing als bedoeld in [artikel 171 van de Pensioenwet][ref1]
      dan wel [artikel 166 van de Wet verplichte beroepspensioenregeling][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '171'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '166'
  - number: 9.4.b
    text: |-
      informatie over de aanstelling van een bewindvoerder als bedoeld in [artikel 173 van de Pensioenwet][ref1] dan wel
      [artikel 168 van de Wet verplichte beroepspensioenregeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel173
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '173'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '168'
  - number: '9.5'
    text: |-
      De uitvoerder verstrekt de deelnemer of gewezen deelnemer op verzoek informatie over de consequenties van uitruil
      als bedoeld in [artikel 60][ref1], [61][ref2] of [62][ref3] van de Pensioenwet dan wel de [artikelen 72][ref4],
      [73][ref5] of [74 van de Wet verplichte beroepspensioenregeling][ref6] voor de deelnemer of gewezen deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '62'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '72'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '73'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '74'
  - number: '9.6'
    text: |-
      Indien sprake is van een premieovereenkomst of premieregeling in de opbouwfase of een variabele uitkering verstrekt
      de uitvoerder op verzoek van de deelnemer, gewezen deelnemer of pensioengerechtigde informatie over de resultaten
      die de beleggingen van de pensioenregeling ten minste de afgelopen vijf jaar hebben behaald of, indien de
      pensioenregeling minder dan vijf jaar is uitgevoerd, alle jaren gedurende welke de pensioenregeling is uitgevoerd
      door de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9
  - number: 9a.1
    text: De titel van het uniform pensioenoverzicht bevat het woord «pensioenoverzicht».
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Het uniform pensioenoverzicht bevat naast de informatie, bedoeld in de [artikelen 38, eerste lid][ref1],
      [40, eerste lid][ref2], [42, eerste lid][ref3], [44, eerste lid][ref4], en
      [48, vierde lid, tweede zin, van de Pensioenwet][ref5] dan wel de [artikelen 49, eerste lid][ref6],
      [51, eerste lid][ref7], [53, eerste lid][ref8], [55, eerste lid][ref9], en
      [59, vierde lid, tweede zin, van de Wet verplichte beroepspensioenregeling][ref10] in ieder geval het volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0020809#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0020809#Artikel48
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel51
      [ref8]: https://wetten.overheid.nl/BWBR0018831#Artikel53
      [ref9]: https://wetten.overheid.nl/BWBR0018831#Artikel55
      [ref10]: https://wetten.overheid.nl/BWBR0018831#Artikel59
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '40'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '42'
      - id: ref4
        bwb_id: BWBR0020809
        artikel: '44'
      - id: ref5
        bwb_id: BWBR0020809
        artikel: '48'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '49'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: '51'
      - id: ref8
        bwb_id: BWBR0018831
        artikel: '53'
      - id: ref9
        bwb_id: BWBR0018831
        artikel: '55'
      - id: ref10
        bwb_id: BWBR0018831
        artikel: '59'
  - number: 9a.2.a
    text: de persoonsgegevens van de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9a.2.b
    text: de naam en het contactadres van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9a.2.c
    text: het soort pensioenregeling; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9a.2.d
    text: de datum waarop de informatie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9a.3
    text: |-
      Op het uniform pensioenoverzicht wordt elke wezenlijke wijziging ten opzichte van het uniform pensioenoverzicht van
      het voorgaande jaar duidelijk aangegeven.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9a
  - number: 9b.1
    text: |-
      Ten behoeve van de vergelijkbaarheid van de pensioenregeling wordt de informatie,
      bedoeld in [artikel 46a, eerste lid, onderdeel a, van de Pensioenwet][ref1] dan wel
      [artikel 57a, eerste lid, onderdeel a, van de Wet verplichte beroepspensioenregeling][ref2], voor zover het
      betreft informatie over de pensioensoorten waarin de basispensioenregeling wel dan wel niet voorziet, de jaarlijkse
      pensioenopbouw, de risico’s en de beleidsdekkingsgraad tevens verstrekt met gebruikmaking van sjablonen die op de
      website van de Pensioenfederatie en het Verbond van Verzekeraars zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.2
    text: |-
      De verdere informatie over de pensioenregeling, bedoeld in
      [artikel 46a, eerste lid, onderdeel b, van de Pensioenwet][ref1] dan wel
      [artikel 57a, eerste lid, onderdeel b, van de Wet verplichte beroepspensioenregeling][ref2], betreft in ieder geval
      informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.2.a
    text: |-
      het vervallen van een pensioenaanspraak als bedoeld in [artikel 55, zesde lid, van de Pensioenwet][ref1] dan wel
      [artikel 66, zesde lid, van de Wet verplichte beroepspensioenregeling][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '55'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '66'
  - number: 9b.2.b
    text: |-
      het beleid van de uitvoerder ten aanzien van waardeoverdracht als bedoeld in [artikel 70a van de Pensioenwet][ref1]
      dan wel [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2], en de daarbij toe te passen procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 81a
  - number: 9b.3
    text: |-
      De informatie over uitvoeringskosten, bedoeld in [artikel 46a, eerste lid, onderdeel c, van de Pensioenwet][ref1]
      dan wel [artikel 57a, eerste lid, onderdeel c, van de Wet verplichte beroepspensioenregeling][ref2], betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
  - number: 9b.3.a
    text: |-
      de administratieve uitvoeringskosten, bedoeld in [artikel 10a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.3.b
    text: |-
      de kosten van vermogensbeheer, bedoeld in [artikel 10a, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.3.c
    text: |-
      de transactiekosten, bedoeld in [artikel 10a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel10a
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: 10a
        hoofdstuk: '2'
  - number: 9b.4
    text: 'De informatie over uitvoeringskosten die op de website wordt geplaatst betreft:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9b.4.a
    text: |-
      voor fondsen en premiepensioeninstellingen: de administratieve uitvoeringskosten als bedrag per deelnemer of
      pensioengerechtigde en de kosten van vermogensbeheer en de transactiekosten als percentage van het gemiddeld belegd
      vermogen;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9b.4.b
    text: |-
      voor verzekeraars: de administratieve uitvoeringskosten als bedrag per deelnemer of pensioengerechtigde en de
      kosten van vermogensbeheer en de transactiekosten:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9b.4.b.1°
    text: |-
      bij uitkeringsovereenkomsten en kapitaalovereenkomsten dan wel uitkeringsregelingen en kapitaalregelingen, indien
      de kosten van invloed zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld belegd
      vermogen, en indien de kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht, met vermelding
      dat deze kosten niet zijn opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9b.4.b.2°
    text: |-
      bij premieovereenkomsten of premieregelingen waarbij de premie wordt belegd tot de pensioendatum als percentage van
      het gemiddeld belegd vermogen en bij overige premieovereenkomsten of premieregelingen, indien de kosten van invloed
      zijn op de pensioenaanspraak of het pensioenrecht als percentage van het gemiddeld belegd vermogen, en indien de
      kosten niet van invloed zijn op de pensioenaanspraak of het pensioenrecht, met vermelding dat deze kosten niet zijn
      opgenomen omdat zij niet van invloed zijn op de pensioenaanspraak of het pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9b.5
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9b
  - number: 9c.1
    text: |-
      Op voordracht van de uitvoerders en na advies van de Autoriteit Financiële Markten stelt Onze Minister de modellen
      voor het uniform pensioenoverzicht vast.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
  - number: 9c.2
    text: |-
      De modellen voor het uniform pensioenoverzicht worden beschikbaar gesteld op de website van de Pensioenfederatie en
      het Verbond van Verzekeraars.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
  - number: 9c.3
    text: |-
      Een uitvoerder verstrekt een uniform pensioenoverzicht voor deelnemers aan een ieder die in de gehele of in een
      deel van de voor het uniform pensioenoverzicht relevante periode deelnemer bij die pensioenuitvoerder was.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
  - number: 9c.4
    text: |-
      In afwijking van het derde lid kan de pensioenuitvoerder afzien van verstrekking van een uniform pensioenoverzicht
      voor deelnemers aan degene die op het eind van de, voor dit pensioenoverzicht, relevante periode geen deelnemer bij
      de pensioenuitvoerder meer is, indien:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
  - number: 9c.4.a
    text: |-
      in de informatie die wordt verstrekt bij beëindiging van de deelneming of bij de pensioeningang een opgave
      van de aan het lopende kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen is opgenomen, alsmede
      informatie over de werkgeverspremie en werknemerspremie die in het lopende kalenderjaar in rekening is gebracht dan
      wel de premie die in het lopende kalenderjaar in rekening is gebracht bij de beroepsgenoot; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9c.4.b
    text: |-
      in het uniform pensioenoverzicht voor gewezen deelnemers verstrekt in het kalenderjaar na het jaar waarin de
      deelneming is beëindigd een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van
      pensioenaanspraken overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende
      bepalingen is opgenomen, alsmede informatie over de werkgeverspremie en werknemerspremie die in het voorgaande
      kalenderjaar in rekening is gebracht dan wel de premie die in het voorgaande kalenderjaar in rekening is gebracht
      bij de beroepsgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9d.1
    text: |-
      Voor de elektronische verstrekking van informatie door middel van een externe berichtenbox wordt MijnOverheid.nl
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9d
  - number: 9d.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de elektronische informatieverstrekking.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9d
  - number: 9e.1
    text: |-
      Een vermindering van de pensioenaanspraken en pensioenrechten wordt door de uitvoerders binnen vier maanden
      verwerkt in de gegevens die door middel van het pensioenregister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.2
    text: |-
      Een andere wijziging van de pensioenaanspraken en pensioenrechten dan bedoeld in het eerste lid wordt door de
      uitvoerders binnen vier maanden nadat de wijziging in de administratie van de uitvoerders is doorgevoerd verwerkt
      in de gegevens die door middel van het pensioenregister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.3
    text: 'Het pensioenregister geeft in ieder geval inzicht in de hoogte van het te bereiken pensioen door:'
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.3.a
    text: weergave in netto bedragen per maand en in bruto bedragen per jaar;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.3.b
    text: de mogelijkheid om ter vergelijking het huidige netto inkomen per maand in te voeren.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.4
    text: |-
      Met betrekking tot de keuzes ten aanzien van ouderdomspensioen worden in ieder geval de indicatieve gevolgen op het
      pensioeninkomen getoond van het vervroegen of uitstellen van de pensioeningangsdatum.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.5
    text: |-
      Met betrekking tot belangrijke gebeurtenissen worden in ieder geval bij nabestaandenpensioen de gevolgen getoond
      van overlijden op het moment van de uitvraag, na beëindiging van de deelneming en na pensionering.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.6
    text: |-
      Voor weergave van ouderdomspensioen in scenario’s wordt gebruik gemaakt van een navigatiemetafoor die op een
      herkenbare plek in het pensioenregister is weergegeven. Een navigatiemetafoor bevat ten minste drie pijlen en de
      volgende bedragen en teksten:
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.6.a
    text: de opgebouwde pensioenaanspraken en de pensioenrechten;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.6.b
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een pessimistisch scenario, met gebruik van de tekst
      «Als het tegenzit, ontvangt u minder: € <bedrag>»;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.6.c
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een verwacht scenario, met gebruik van de tekst
      «Verwacht eindresultaat: € <bedrag>»; en
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: 9e.6.d
    text: |-
      de op te bouwen pensioenaanspraken en de pensioenrechten bij een optimistisch scenario, met gebruik van de tekst
      «Als het meezit, ontvangt u meer <bedrag>».
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel9e
  - number: '10'
    text: |-
      De informatie op grond van de [artikelen 21][ref1], [38 tot en met 44][ref2], [45][ref3],
      [46, eerste en tweede lid][ref4], [46a, eerste en tweede lid][ref5], [52][ref6], [52a][ref7], [63b][ref8]
      en [134, tweede lid, van de Pensioenwet][ref9] dan wel [de artikelen 48 tot en met 55][ref10], [56][ref11],
      [57, eerste en tweede lid][ref12], [57a, eerste en tweede lid][ref13], [63][ref14], [63a][ref15], [75b][ref16] en
      [129, tweede lid, van de Wet verplichte beroepspensioenregeling][ref17] wordt kosteloos verstrekt.


