    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.1.d
    text: een gewaarmerkt afschrift van de statuten;
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
  - number: 40c.1.e
    text: |-
