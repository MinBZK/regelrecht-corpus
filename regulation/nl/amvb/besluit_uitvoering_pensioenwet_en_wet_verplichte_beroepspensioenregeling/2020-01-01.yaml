    text: |-
      [Artikel 35a][ref1] is niet van toepassing op benoemingen tot bestuurder of lid van de raad van toezicht van een
      fonds voor 1 juli 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel35a
