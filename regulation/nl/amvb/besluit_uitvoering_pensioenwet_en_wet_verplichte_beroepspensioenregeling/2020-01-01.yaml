  - number: '53'
    text: |-
      De definitie van overdrachtsdatum, bedoeld in [artikel 1][ref1], zoals deze luidde voor het tijdstip van
      inwerkingtreding van het Besluit van 2 december 2015 tot wijziging van het Besluit uitvoering Pensioenwet en Wet
      verplichte beroepspensioenregeling in verband met aanpassing van de regels bij waardeoverdracht (Stb. 469) blijft
      van toepassing indien de ontvangende uitvoerder de gegevens, bedoeld in [artikel 20][ref2], voor dat tijdstip aan
      de deelnemer heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020892#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020892#Artikel20
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020892
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020892
        artikel: '20'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '54.1'
    text: |-
      Tot het tijdstip, bedoeld in [artikel IV van de Wet verbeterde premieregeling][ref1], wordt bij de informatie,
      die op grond van de [artikelen 44a][ref2] en [63b van de Pensioenwet][ref3] dan wel de [artikelen 55a][ref4] en
      [75b van de Wet verplichte beroepspensioenregeling][ref5] wordt verstrekt, tevens het risico ten aanzien van de
      hoogte van de variabele uitkering weergegeven op basis van drie rendementen.


      [ref1]: https://wetten.overheid.nl/BWBR0038177#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel44a
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel63b
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel55a
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel75b
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0038177
        artikel: IV
      - id: ref2
        bwb_id: BWBR0020809
        artikel: 44a
      - id: ref3
        bwb_id: BWBR0020809
        artikel: 63b
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 55a
      - id: ref5
        bwb_id: BWBR0018831
        artikel: 75b
  - number: '54.2'
    text: |-
      De opgave van de hoogte van de variabele uitkeringen en het risico heeft betrekking op de pensioendatum en tien
      jaar na de pensioendatum.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel54
  - number: '54.3'
    text: De Nederlandsche Bank stelt de scenario’s voor de vaststelling van de drie rendementen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel54
  - number: '56'
    text: |-
      De overdragende uitvoerder die gebruik maakt van het recht op waardeoverdracht van een
      kleine pensioenaanspraak, bedoeld in [artikel 70a van de Pensioenwet][ref1] dan wel
      [artikel 81a van de Wet verplichte beroepspensioenregeling][ref2], voor de aanspraken van gewezen deelnemers van
      wie de deelneming is geëindigd in het jaar 2018, vraagt, in afwijking van [artikel 17e, eerste lid][ref3], binnen
      een jaar vanaf 1 januari 2019, bij het pensioenregister een opgave van de uitvoerder bij wie de gewezen deelnemer
      pensioenaanspraken verwerft, tenzij de uitvoerder aantoont dat aan uitvraag binnen deze termijn redelijkerwijs niet
      kan worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel70a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
      [ref3]: https://wetten.overheid.nl/BWBR0020892#Artikel17e
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: 70a
      - id: ref2
