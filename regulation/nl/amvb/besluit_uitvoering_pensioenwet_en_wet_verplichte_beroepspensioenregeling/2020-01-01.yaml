      [artikel 106 van de Pensioenwet][ref1] is bepaald met betrekking tot de betrouwbaarheid van de personen die het
      beleid bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel106
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel40c
    references:
      - id: ref1
