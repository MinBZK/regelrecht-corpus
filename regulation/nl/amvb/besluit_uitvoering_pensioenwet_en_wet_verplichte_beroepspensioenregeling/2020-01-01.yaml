  - number: '36.3'
    text: |-
      De Nederlandsche Bank houdt toezicht op de naleving van de regels, gesteld bij of krachtens de [Pensioenwet][ref1]
      en de [Wet verplichte beroepspensioenregeling][ref2], met uitzondering van de regels genoemd in het eerste en
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
      [ref2]: https://wetten.overheid.nl/BWBR0018831
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020809
      - id: ref2
        bwb_id: BWBR0018831
  - number: '37'
    text: |-
      De Stichting Autoriteit Financiële Markten beschikt niet over de bevoegdheden, bedoeld in de
      [artikelen 172][ref1], [173][ref2] en [174 van de Pensioenwet][ref3] en de [artikelen 167][ref4], [168][ref5] en
      [169 van de Wet verplichte beroepspensioenregeling][ref6].


