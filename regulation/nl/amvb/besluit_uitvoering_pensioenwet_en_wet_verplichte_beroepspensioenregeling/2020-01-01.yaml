  - number: '52.1'
    text: |-
      Ten aanzien van de in [artikel 18, derde lid, van de Invoerings- en aanpassingwet Pensioenwet][ref1]
      bedoelde pensioentoezeggingen, welke op grond van
      [artikel 2, eerste lid, onderdeel c en vierde lid, onderdeel c, van de Pensioen- en spaarfondsenwet][ref2]
      al zijn ondergebracht bij een verzekeraar en waarbij na de datum van inwerkingtreding
      van [artikel 1 van de Pensioenwet][ref3] geen verwerving van pensioen meer plaats
      vindt, blijft de [Pensioen- en spaarfondsenwet][ref4] en [hoofdstuk I][ref5] en
      [III van de Regelen verzekeringsovereenkomsten Pensioen- en spaarfondsenwet][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020828#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002089
      [ref5]: https://wetten.overheid.nl/BWBR0004195#HoofdstukI
      [ref6]: https://wetten.overheid.nl/BWBR0004195#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0020892/2020-01-01#Artikel52
