      het betreft communicatie en de klachtenregeling van verzekeraars en premiepensioeninstellingen, [36][ref4],
      [38 tot en met 51][ref5], met uitzondering van de berekeningen ten behoeve van de weergave op basis van
      scenario’s, [52, tweede tot en met vierde lid][ref6], 52, vijfde lid, met uitzondering van de zorgplicht voor
      zover het betreft het beleggingsbeleid, 52, zesde lid, 52, zevende lid, met uitzondering van de regels over de
      beleggingen en het beleggingsbeleid, [52a, tweede lid][ref7], met uitzondering van de zorgplicht voor zover het
      betreft het beleggingsbeleid, 52a, derde tot en met vijfde lid, 52a, zesde lid, met uitzondering van de regels
      over de beleggingen en het beleggingsbeleid, [63b][ref8], met uitzondering van de berekeningen ten behoeve van
