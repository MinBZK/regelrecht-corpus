      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd tot het onder een permanente opstand
      van glas of van kunststof telen van gewassen, met uitzondering van een zodanige inrichting die uitsluitend of in
      hoofdzaak is bestemd tot het onder een zodanige opstand telen van eetbare paddestoelen of witlof;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.b
    text: |-
      glastuinbouwbedrijf type A: glastuinbouwbedrijf waarvoor de verboden bedoeld in
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1] blijven bestaan, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.b.1°
    text: gedeputeerde staten het Wm-bevoegd gezag zijn;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.2°
    text: |-
      een andere brandstof dan aardgas, propaan, butaan, gasolie of petroleum wordt gebruikt in een ketelinstallatie ten
      behoeve van ruimteverwarming of warmwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.3°
    text: |-
      een andere brandstof dan aardgas, propaangas of butaangas dan wel een combinatie van deze brandstoffen wordt
      gestookt in een zuigermotor ten behoeve van een warmtepompinstallatie, onderscheidenlijk een installatie voor
      warmtekrachtkoppeling;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.4°
    text: |-
      een zuigermotor als bedoeld [onder 3°][ref1] of een ketelinstallatie als bedoeld [onder 2°][ref2] wordt gebruikt
      voor het onderzoeken, beproeven of demonstreren van experimentele verbrandingstechnieken of van technieken ter
      bestrijding van de uitworp van zwaveldioxiden, stikstofoxiden of stof;


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel2
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '2'
        paragraaf: '1'
  - number: 2.b.5°
    text: |-
      een warmtekrachtinstallatie danwel warmtepompinstallatie als bedoeld [onder 3°][ref1] wordt gebruikt met een
      groter thermisch vermogen dan 7500 kW;


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel2
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '2'
        paragraaf: '1'
  - number: 2.b.6°
    text: |-
      een ketelinstallatie als bedoeld [onder 2°][ref1] wordt gebruikt met een groter thermisch vermogen dan 7500 kW;


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel2
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '2'
        paragraaf: '1'
  - number: 2.b.7°
    text: |-
      activiteiten of handelingen plaatsvinden, als bedoeld in categorie 21,
      [bijlage I, behorende bij het Inrichtingen- en vergunningenbesluit milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005829
  - number: 2.b.8°
    text: |-
      in een specifieke daartoe ingerichte ruimte behandeling voor derden van bloembollen of knollen met
      gewasbeschermingsmiddelen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.9°
    text: nitraathoudende kunstmeststoffen worden bewaard anders dan die van type C als bedoeld in CPR 1;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.10°
    text: bewaring van meer dan 10 000 kg gevaarlijke stoffen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.11°
    text: windenergie in elektrische energie wordt omgezet met een of meer windturbines;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.12°
    text: |-
      opslag van vloeibare gevaarlijke stoffen of vloeibare gevaarlijke afvalstoffen in tanks plaatsvindt, tenzij sprake
      is van opslag in een of meer ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van
      toepassing is, dan wel sprake is van opslag van brandbare vloeistoffen in bovengrondse tanks, dan wel sprake is van
      opslag van petroleum in een of meer bovengrondse tanks met een gezamenlijke inhoud van ten hoogste 15 000 liter;


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 2.b.13°
    text: |-
      op het bewaren van butaan of propaan, anders dan in spuitbussen of gasflessen, het
      [Besluit voorzieningen en installaties milieubeheer][ref1] niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 2.b.14°
    text: meer dan 1000 kg bestrijdingsmiddelen aanwezig is;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.15°
    text: aflevering van brandstoffen ten behoeve van tractiedoeleinden plaatsvindt aan motorvoertuigen van derden;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.16°
    text: per transportmiddel meer dan één wisselreservoir met een waterinhoud van ten hoogste 150 liter aanwezig is;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.17°
    text: verven van bloemen en siergewassen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.18°
    text: vee bedrijfsmatig wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.19°
    text: |-
      koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer dan
      200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.20°
    text: 'het glastuinbouwbedrijf is opgericht:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.20°.aa
    text: |-
      na 30 april 1996 en is gelegen op een afstand van minder dan 50 meter van een object categorie I, dan wel op een
      afstand van minder dan 25 meter van een object categorie II of
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.b.20°.bb
    text: |-
      voor 1 mei 1996 en, met inbegrip van eventuele uitbreidingen na dat tijdstip, is gelegen op een afstand van minder
      dan 25 meter van een object categorie I, dan wel op een afstand van minder dan 10 meter van een object categorie
      II, voor de bepaling van afstanden wordt gemeten vanaf het onderdeel van het glastuinbouwbedrijf dat het dichtst
      bij het genoemde object is gelegen, waarbij een waterbassin, een watersilo, een warmwateropslagtank en het open erf
      niet als een zodanig onderdeel worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.c
    text: 'glastuinbouwbedrijf type B: glastuinbouwbedrijf, niet zijnde glastuinbouwbedrijf type A;'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.d
    text: |-
      glastuinbouwactiviteiten: het bedrijfsmatig of in een omvang alsof het bedrijfsmatig was onder een permanente
      opstand van glas of van kunststof telen van gewassen, met uitzondering van eetbare paddestoelen of witlof;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e
    text: |-
      lozen type I: het ten gevolge van glastuinbouwactiviteiten of activiteiten die daar direct mee verband houden,
      lozen op:
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°
    text: 'oppervlaktewater van:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.aa
    text: |-
      spuiwater, drainwater, onderscheidenlijk drainagewater, vanaf een perceel dat vóór 1 november 1994 nog niet voor
      glastuinbouwactiviteiten werd gebruikt, of
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.bb
    text: |-
      bedrijfsafvalwater als bedoeld in [artikel 1, eerste lid, van de Wet milieubeheer](onbekend), van huishoudelijke
      aard van meer dan 10 inwonerequivalenten, tenzij de afstand tot de dichtstbijzijnde riolering waarop kan worden
      aangesloten, gemeten vanaf de plaats waar dat afvalwater ontstaat, minder bedraagt dan:
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.bb.1°
    text: 100 meter bij 11 tot 25 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.bb.2°
    text: 600 meter bij 25 tot 50 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.bb.3°
    text: 1500 meter bij 50 tot 100 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.1°.bb.4°
    text: 3000 meter bij 100 inwonerequivalenten of meer doch niet meer dan 200 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: 2.e.2°
    text: |-
      een werk, niet zijnde een voorziening als bedoeld in [artikel 10.15, eerste lid, van de Wet milieubeheer][ref1],
      dat is aangesloten op een inrichting, in gebruik bij een provincie, een gemeente, een waterschap of een ander
      openbaar lichaam voor het zuiveren van afvalwater;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.f
    text: |-
      lozen type II: het lozen ten gevolge van glastuinbouwactiviteiten of daarmee direct verband houdende activiteiten,
      niet zijnde lozen type I.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel2
  - number: '3.1'
    text: |-
      Bedrijven of gedeelten van bedrijven, waar vanuit lozen type I of II plaatsvindt, worden
      aangewezen als soort van inrichtingen in de zin van [artikel 1, tweede lid][ref1], en
      [artikel 31, vierde lid, van de Wet verontreiniging oppervlaktewateren][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel31
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '31'
  - number: '3.2'
    text: |-
      De verboden, bedoeld in [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref1], gelden niet ten aanzien
      van lozen type II.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '4.1'
    text: |-
      De voorschriften, opgenomen in [bijlagen 1][ref1] en [2][ref2], gelden voor een ieder die een glastuinbouwbedrijf
      type B drijft.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
  - number: '4.2'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II vanuit een
      glastuinbouwbedrijf type B.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '4.3'
    text: |-
      De voorschriften, opgenomen in [bijlage 2][ref1], zijn niet van toepassing op drukapparatuur, samenstellen en
      druksystemen waarop het [Warenwetbesluit drukapparatuur](onbekend) van toepassing is, voorzover de voorschriften
      betrekking hebben op het ontwerp, de vervaardiging, de overeenstemmingsbeoordeling, de ingebruikneming en het
      gebruik bedoeld in dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '5.1'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft, draagt er zorg voor dat de voor het betrokken glastuinbouwbedrijf
      geldende artikelen en voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel5
  - number: '5.2'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 2][ref1], hoofdstukken 1 tot en met 3, inhoudt dat daarbij
      aangegeven middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft
      en die voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere
      middelen wil toepassen aan het Wm-bevoegd gezag, onder overlegging van de in [artikel 7, achtste lid][ref2],
      bedoelde gegevens. Het Wm-bevoegd gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 3][ref1], inhoudt dat daarbij aangegeven middelen
      ter bescherming van het oppervlaktewater of ter bescherming van de doelmatige werking van de betrokken
      zuiveringstechnische werken moeten worden toegepast, meldt degene die loost type II en die voornemens is andere
      middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen wil toepassen aan het
      Wvo-bevoegd gezag, onder overlegging van de in [artikel 8, zesde lid][ref2], bedoelde gegevens. Het Wvo-bevoegd
      gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '6.1'
    text: 'Het Wm-bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: 6.1.a
    text: |-
      de in bijlage 2 opgenomen voorschriften ten aanzien van geluid, afvalstoffen, afvalwater, waterbesparing,
      assimilatiebelichting, bestrijdingsmiddelen, bodembescherming, lucht, opslag vloeibare kooldioxide, opslag vaste
      mest en gebruikt substraatmateriaal en het composteren en de opslag van afgedragen gewas, voor zover dat in
      hoofdstuk 4 van die bijlage is aangegeven, of
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: 6.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop paragraaf 1.9 van [bijlage 2][ref1] betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '6.2'
    text: |-
      Het Wvo-bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 3][ref1] opgenomen voorschriften
      ten aanzien van het volume van lozen, buffervoorzieningen, voorzieningen voor de gespreide afvoer van afvalwater,
      voorzieningen voor de individuele behandeling van afvalwater, controlevoorzieningen, samenstelling en hergebruik
      van afvalwater, toediening van meststoffen alsmede metingen en analyses, voor zover dat in die bijlage is
      aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '6.3'
    text: |-
      De nadere eisen gelden voor een ieder die het glastuinbouwbedrijf type B drijft. Deze draagt er zorg voor dat de
      nadere eisen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: '6.4'
    text: |-
      De nadere eisen, bedoeld in het eerste lid, kunnen worden gewijzigd of ingetrokken, indien het belang van de
      bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: '6.5'
    text: |-
      De nadere eisen, bedoeld in het tweede lid, kunnen worden gewijzigd of ingetrokken, indien het belang van de
      bescherming van het oppervlaktewater en de doelmatige werking van de betrokken zuiveringstechnische werken zich
      daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: '6.6'
    text: |-
      Van de beschikking waarbij een nadere eis wordt gesteld krachtens dit besluit, wordt kennisgegeven in één of meer
      dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel6
  - number: '7.1'
    text: |-
      Degene die een glastuinbouwbedrijf type B opricht, meldt dit ten minste acht weken voor de oprichting aan het Wm-
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een glastuinbouwbedrijf
      type B en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding
      overeenkomstig [dit artikel][ref1] is gedaan en door dit uitbreiden, wijzigen of veranderen van de werking van het
      glastuinbouwbedrijf geen afwijking ontstaat van de bij die melding eerder verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '7.3'
    text: 'Bij een melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.a
    text: het adres van het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.b
    text: |-
      de naam en het adres van degene die het glastuinbouwbedrijf opricht dan wel verandert of de werking daarvan
      verandert, en, indien dat iemand anders is, van degene die het glastuinbouwbedrijf drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.c
    text: de aard en omvang van de activiteiten of processen in het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.d
    text: de indeling en de uitvoering van het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.e
    text: |-
      het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking verwezenlijkt zal zijn;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.f
    text: de aard, omvang en frequentie van de transportactiviteiten en
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.g
    text: de plaats waar wordt geladen en gelost en
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.3.h
    text: 'indien een glastuinbouwbedrijf wordt opgericht: een teeltplan.'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.4'
    text: Bij de melding worden voorts gevoegd
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.4.a
    text: |-
      een rapport van een onderzoek naar de nulsituatie van de bodem, gericht op het in beeld brengen van de toestand van
      de bodem voor het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking is gebracht, dan wel
      de verandering van de verwerking is verwezenlijkt. Het onderzoek naar de nulsituatie richt zich uitsluitend op de
      stoffen die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen, en op de plaatsen waar
      bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: 7.4.b
    text: een rapportage van een vooronderzoek. Het vooronderzoek richt zich op de gehele inrichting.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.5'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.6'
    text: |-
      De in het derde en vierde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die het
      glastuinbouwbedrijf type B drijft, deze gegevens reeds aan het Wm-bevoegd gezag heeft verschaft en het Wm-bevoegd
      gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.7'
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het Wm-
      bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
  - number: '7.8'
    text: |-
      Bij de melding overeenkomstig [artikel 5, tweede lid][ref1], worden aan het Wm-bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor het milieu
      wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Degene die voornemens is vanuit een glastuinbouwbedrijf type B te lozen type II, meldt dit ten minste acht weken
      voordat met dat lozen wordt aangevangen aan het Wvo-bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van het lozen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: '8.3'
    text: 'Bij een melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.a
    text: de naam en het adres van degene die loost;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.b
    text: de aard en omvang van de glastuinbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.c
    text: de indeling en de uitvoering van de gebouwen waar vanuit het lozen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.d
    text: de plaats van in de gebouwen aanwezige lozingspunten;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.e
    text: het volume en de samenstelling van het te lozen afvalwater;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.f
    text: |-
      een opgave van de afstand tussen de plaats waar het afvalwater ontstaat en de dichtstbijzijnde voorziening voor de
      inzameling en het transport van afvalwater, bedoeld in [artikel 10.15, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 8.3.g
    text: een opgave van het aantal inwonerequivalenten van bedrijfsafvalwater van huishoudelijke aard, dat wordt geloosd;
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: 8.3.h
    text: |-
      een opgave van de voorzieningen, bedoeld in de voorschriften 4, eerste en zesde lid, 5, tweede lid, 6, tweede lid,
      7, derde lid, 8, derde lid, 9, tweede en vierde lid , 10, tweede lid, 11, tweede en vierde lid, 12, tweede lid, en
      14, achtste lid opgenomen in [bijlage 3][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: 8.3.i
    text: 'in geval van een voornemen te lozen type II als bedoeld in het eerste lid: een teeltplan.'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: '8.4'
    text: |-
      De in het derde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die loost, deze gegevens
      reeds aan het Wvo-bevoegd gezag heeft verschaft en het Wvo-bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: '8.5'
    text: |-
      Degene die een melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het Wvo-
      bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
  - number: '8.6'
    text: |-
      Bij de melding overeenkomstig [artikel 5, derde lid][ref1], worden aan het Wvo-bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor het
      oppervlaktewater of de doelmatige werking van de betrokken zuiveringtechnische werken wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      De meldingen bedoeld in [de artikelen 7][ref1] en [8][ref2] worden gedaan op een formulier waarvan het model wordt
      vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met
      Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De voorschriften opgenomen in [bijlage 1][ref1] gelden voor een ieder die een glastuinbouwbedrijf type A
      drijft of een akkerbouwbedrijf, waarop het [Besluit akkerbouwbedrijven milieubeheer][ref2] in verband met
      [artikel 1, onder a, onder 11°, van dat besluit][ref3], niet van toepassing is. Artikel 5, eerste lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0006449
      [ref3]: https://wetten.overheid.nl/BWBR0006449#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0006449
      - id: ref3
        bwb_id: BWBR0006449
        artikel: '1'
  - number: '10.2'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II vanuit een bedrijf als
      bedoeld in het eerste lid. De artikelen 5, eerste en derde lid, 6, tweede, derde, vijfde en zesde lid, en 8 zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '11.1'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II anders dan vanuit een
      glastuinbouwbedrijf of een akkerbouwbedrijf als bedoeld in [artikel 10, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '10'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Op lozen type II als bedoeld in het eerste lid zijn [de artikelen 5, eerste en derde lid][ref1],
      [6, tweede, derde, vijfde en zesde lid][ref2], en [8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      Bij een melding als bedoeld in [artikel 8][ref1], wordt voorts een opgave van de teelt of teelten en teeltwijze of
      teeltwijzen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Voor een glastuinbouwbedrijf type B dat op het tijdstip van inwerkingtreding van dit besluit was opgericht
      en waarvoor onmiddellijk daaraan voorafgaand een Wm-vergunning in werking en onherroepelijk was, blijven
      de voorschriften van die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de
      aanvraag voor zover die deel uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of
      omzetting in voorschriften, gelden als nadere eis, bedoeld in [artikel 6, eerste lid][ref1], behoudens eerdere
      wijziging of intrekking van die voorschriften, gedurende drie jaar na het tijdstip van toepassing worden
      van dit besluit op die inrichting, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 6, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wm-
      vergunning dan wel krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, blijven gelden als
      nadere eis, bedoeld in [artikel 6, eerste lid][ref1], na het tijdstip van inwerkingtreding van dit besluit, mits
      het voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft waarop het eerste lid van toepassing is, legt de gegevens, bedoeld
      in [artikel 7, derde lid, onderdelen a tot en met g en vierde lid][ref1], over aan het Wm-bevoegd gezag. Artikel
      7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing. Voor zover de gegevens nog niet eerder in het
      kader van de Wm-vergunning behoefden te worden overgelegd, legt degene die het glastuinbouwbedrijf drijft, die
      gegevens over aan het Wm-bevoegd gezag, ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft waarop onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer van toepassing was,
      legt de gegevens bedoeld in [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref1], over aan het Wm-bevoegd
      gezag. Artikel 7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Voor lozen type II, dat op het tijdstip van inwerkingtreding van dit besluit reeds plaatsvond en waarvoor
      onmiddellijk daaraan voorafgaand een Wvo-vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag die deel uitmaakt
      van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van toepassing worden van dit besluit op dat lozen, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wvo-
      vergunning dan wel krachtens het Lozingenbesluit Wvo glastuinbouw voor lozen type II, blijven gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref1], na het tijdstip van inwerkingtreding van dit besluit mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Degene die loost type II waarop het eerste lid van toepassing is, legt de gegevens, bedoeld in
      [artikel 8, derde lid][ref1], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '15.4'
    text: |-
      Degene die loost type II waarop onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      dit besluit het Lozingenbesluit Wvo glastuinbouw van toepassing was, legt de gegevens bedoeld in
      [artikel 8, derde lid, onderdeel h][ref1], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds is opgericht en
      voor dat bedrijf onmiddellijk voor dat tijdstip geen Wm-vergunning in werking en onherroepelijk was of geen melding
      was gedaan krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, meldt degene die de inrichting
      drijft, aan het Wm-bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel16
  - number: '16.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in
      werking treedt. Artikel 7, derde tot en met zesde lid, is van overeenkomstige toepassing op een melding als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel16
  - number: '16.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds is
      opgericht en voor dat bedrijf onmiddellijk voor dat tijdstip een melding was gedaan krachtens het Besluit
      tuinbouwbedrijven met bedekte teelt milieubeheer, legt degene die het glastuinbouwbedrijf drijft, ten
      hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens, bedoeld in
      [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref1], over aan het Wm-bevoegd gezag. Artikel 7, vijfde en
      zesde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '16.4'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten van
      een glastuinbouwbedrijf type B is ingediend en dit besluit op de inrichting van toepassing is of zal zijn, zijn het
      eerste en tweede lid, niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip geen Wvo-vergunning gold of geen melding was gedaan krachtens het Lozingenbesluit
      Wvo glastuinbouw, meldt degene die loost, aan het Wvo-bevoegd gezag dat hij loost.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel17
  - number: '17.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit
      in werking treedt. Artikel 8, derde tot en met vijfde lid, is van overeenkomstige toepassing op een melding als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel17
  - number: '17.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip een melding was gedaan krachtens het Lozingenbesluit Wvo glastuinbouw, legt degene
      die loost type II, ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens,
      bedoeld in [artikel 8, derde lid, onderdelen f en h][ref1], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en
      vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '18'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met
      Onze Ministers van Verkeer en Waterstaat en van Landbouw, Natuurbeheer en Visserij binnen vijf jaar na de
      inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit
      besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel18
  - number: '19.1'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel19
  - number: 19.1.a
    text: het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer en
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel19
  - number: 19.1.b
    text: het Lozingenbesluit Wvo glastuinbouw.
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel19
  - number: '19.2'
    text: |-
      Hetgeen direct voorafgaand aan het tijdstip van inwerkingtreding van dit besluit gold bij of
      krachtens het besluit, bedoeld in het eerste lid, onder a, voor een inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen categorie behoort en die uitsluitend of in
      hoofdzaak is bestemd tot het onder een permanente opstand van glas of van kunststof telen van eetbare paddestoelen
      of witlof, blijft van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '19.3'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      [bijlage 2][ref1] opgenomen voorschrift 1.3.6, onder b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '20'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst, met uitzondering van voorschrift 1.1.6, opgenomen in [bijlage 1][ref1]
      en voorschrift 2.5.1 opgenomen in [bijlage 2][ref2], die op een bij koninklijk besluit te bepalen tijdstip in
      werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
  - number: '21'
    text: 'Dit besluit wordt aangehaald als: Besluit glastuinbouw.'
    url: https://wetten.overheid.nl/BWBR0013430/2005-11-15#Artikel21
