preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 juni 2001,
    nr. MJZ 2001064015 Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris
    van Verkeer en Waterstaat, de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, Onze Minister van
    Volksgezondheid, Welzijn en Sport en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;

    Gelet op richtlijn nr. 76/464/EEG van de Raad van de Europese Gemeenschappen van 4 mei 1976 betreffende de
    verontreiniging veroorzaakt door bepaalde gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden
    geloosd (PbEG L 129), richtlijn nr. 91/271/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1991 inzake
    de behandeling van stedelijk afvalwater (PbEG L 135), richtlijn nr. 91/676/EEG van de Raad van 12 december 1991
    inzake de bescherming van water tegen verontreiniging door nitraat uit agrarische bronnen (PbEG L 375) en richtlijn
    nr. 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 betreffende gevaarlijke afvalstoffen
    (PbEG L 377), de artikelen 8.19, 8.40, 8.41, 8.42, 8.44 en 21.8 van de Wet milieubeheer, de artikelen 1, 1a, 2a,
    2b, 2c en 31, vierde lid, van de Wet verontreiniging oppervlaktewateren, artikel 13 van de Bestrijdingsmiddelenwet
    1962 en de artikelen 72 en 93 van de Wet bodembescherming;

    De Raad van State gehoord (advies van 3 december 2001, nr. W01.01.0291/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van 15
    januari 2002, nr. MJZ 2002013892, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens
    de Staatssecretaris van Verkeer en Waterstaat, de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, Onze
    Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F.
    Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *ADR:* op 30 september 1957 te Genève
      tot stand gekomen Europese Overeenkomst betreffende het internationale vervoer voor gevaarlijke stoffen over de weg
      (Trb. 1959, 171);
        - *bedrijfsriolering:* voorziening voor de afvoer van bedrijfsafvalwater vanuit de inrichting naar een openbaar
      riool of naar een andere voorziening voor de inzameling en het transport van afvalwater;
        - *bestrijdingsmiddel:* gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen of biociden][ref1];
        - *bijlage 1:* de bij dit besluit behorende [bijlage 1][ref2];
        - *bijlage 2:* de bij dit besluit behorende [bijlage 2][ref3];
        - *bijlage 3:* de bij dit besluit behorende [bijlage 3][ref4];
        - *drainagewater:* water dat wordt afgevoerd via een stelsel van geperforeerde buizen die in de grond zijn
      aangebracht;
        - *drainwater:* voedingswater dat bij substraatteelt niet wordt opgenomen door het gewas;
        - *gasfles:* verplaatsbare drukhouder met een waterinhoud van niet meer dan 150 liter;
        - *gasolie:* gasolie in de zin van de [Wet op de accijns][ref5];
        - *gevaarlijke stoffen:* stoffen, preparaten en voorwerpen, waarvan het vervoer volgens ADR is verboden of slechts
      onder daarin opgenomen waarden is toegestaan;
        - *gewas:* een in lijst 1 behorende bij [bijlage 1][ref6] opgenomen gewas of een in lijst 2 behorende bij
      [die bijlage][ref7] bij een gewasgroep ingedeeld gewas;
        - *gewasbeschermingsmiddel:* gewasbeschermingsmiddel als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref8];
        - *gewasgroep:* een groep waarvan in lijst 2 behorende bij [bijlage 1][ref9] is aangegeven welke gewassen erbij
      zijn ingedeeld;
        - *inrichting-bevoegd gezag:* bestuursorgaan dat bevoegd is, onderscheidenlijk zou zijn, een omgevingsvergunning
      te verlenen voor een glastuinbouwbedrijf of een akkerbouw- of tuinbouwbedrijf met open grondteelt
      waarop het [Besluit akkerbouwbedrijven milieubeheer][ref10] niet van toepassing is in verband met
      [artikel 1, onder a, onder 11°, van dat besluit][ref11];
        - *kunstmeststoffen:* meststoffen van niet organische oorsprong;
        - *lozen:* lozen op een oppervlaktewaterlichaam of lozen op een riolering;
        - *lozen op een oppervlaktewaterlichaam:*brengen van afvalstoffen, verontreinigende of schadelijke stoffen in een
      oppervlaktewaterlichaam;
        - *lozen op een riolering:* al dan niet door middel van een bedrijfsriolering brengen van afvalstoffen,
      verontreinigende of schadelijke stoffen in een openbaar riool of een andere voorziening voor de inzameling en het
      transport van afvalwater die is aangesloten op een zuiveringstechnisch werk;
        - *maatwerkvoorschrift:* voorschrift als bedoeld in [artikel 8.42, eerste lid, van de Wet milieubeheer][ref12],
      inhoudende: a. een beschikking waarbij het Wtw- of het inrichting- bevoegd gezag aanvullende eisen stelt; dan
      wel b. een ontheffing waarbij het Wtw- of het inrichting- bevoegd gezag de daarbij aangewezen bepalingen niet van
      toepassing verklaart al dan niet onder het stellen van beperkingen of voorwaarden;
        - *meststoffen:* dierlijke meststoffen, overige organische meststoffen en andere meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, f, onderscheidenlijk g, van de Meststoffenwet][ref13], voor zover zij stikstof
      of fosfor bevatten;
        - *NEN:* een door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;
        - *NVN:* een door het Nederlands Normalisatie Instituut (NNI) uitgegeven voornorm;
        - *object categorie I:* 1°. aaneengesloten woonbebouwing, bestaande uit drie of meer woningen die op telkens minder
      dan 5 meter afstand van elkaar zijn gelegen, gerekend van gevel tot gevel; 2°. een gebouw of een gedeelte van
      een gebouw, dat bestemd is voor het verblijf van personen of een object of terrein dat bestemd is voor verblijfs-
      of dagrecreatie, niet zijnde een van een agrarisch bedrijf deel uitmakend kleinschalig object of terrein dat
      ter beschikking wordt gesteld voor het plaatsen van enkele kampeermiddelen, waarbij onder kampeermiddelen worden
      verstaan onderkomens of voertuigen die bestemd of geschikt zijn voor recreatief nachtverblijf en die geen bouwwerk
      zijn in de zin van de [Woningwet][ref14];
        - *object categorie II:* 1°. woningen van derden; 2°. restaurants;
        - *omgevingsvergunning:* omgevingsvergunning voor een inrichting;
        - *openbaar riool:* gemeentelijke voorziening voor de inzameling en het transport van afvalwater;
        - *PGS 7:* publicatie nr. 7 van de «Publicatiereeks Gevaarlijke stoffen», getiteld «Opslag van vaste minerale
      anorganische meststoffen», uitgave oktober 2007;
        - *riolering:* bedrijfsriolering of een voorziening voor de inzameling en het transport van afvalwater;
        - *spuiwater:* water dat vanuit het recirculatiesysteem geloosd wordt, omdat het niet meer geschikt is om als
      voedingswater te worden toegepast;
        - *stookinstallatie:* stookinstallatie als bedoeld in het
      [Besluit emissie-eisen middelgrote stookinstallaties milieubeheer][ref15];
        - *substraatteelt:* wijze van telen waarbij gewassen groeien op een bodem die los van de ondergrond is;
        - *vloeibare brandstof:* lichte olie, halfzware olie of gasolie als bedoeld in
      [artikel 26 van de Wet op de accijns][ref16];
        - *voedingswater:* water dat aan het gewas wordt toegediend en waar eventueel meststoffen aan zijn toegevoegd;
        - *vooronderzoek:* onderzoek uit te voeren op een wijze als aangegeven in NVN 5725 «Bodem – leidraad voor het
      uitvoeren van vooronderzoek bij verkennend, oriënterend en nader onderzoek», uitgave 1999, dan wel een door de
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen norm;
        - *warmtekrachtinstallatie:* stookinstallatie, bestemd voor het gelijktijdig opwekken van warmte en kracht waarbij
      de warmte nuttig wordt aangewend;
        - *woning:* een gebouw of gedeelte van een gebouw, dat voor bewoning wordt gebruikt of daartoe is
      bestemd, met uitzondering van een dienst- of bedrijfswoning behorende bij een inrichting als bedoeld in
      [artikel 2 onder a][ref17];
        - *watervergunning:* vergunning als bedoeld in [artikel 6.2 van de Waterwet][ref18];
        - *Wtw-bevoegd gezag:* bestuursorgaan dat bevoegd is tot vergunningverlening ingevolge
      [artikel 6.2 van de Waterwet][ref19].


