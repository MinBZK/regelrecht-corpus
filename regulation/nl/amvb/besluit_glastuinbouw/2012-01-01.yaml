      - id: ref2
        bwb_id: BWBR0013430
        artikel: '10'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Op lozen type II als bedoeld in het eerste lid zijn [de artikelen 5, eerste en derde lid][ref1],
      [6, tweede, derde, vijfde en zesde lid][ref2], en [8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013430#Artikel8
