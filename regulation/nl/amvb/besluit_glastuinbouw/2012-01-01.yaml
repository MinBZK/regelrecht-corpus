        artikel: '5'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II
      vanuit een bedrijf als bedoeld in het eerste lid. De [artikelen 5, eerste en derde lid][ref2],
      [6, tweede, derde, vijfde en zesde lid][ref3], en [8][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
