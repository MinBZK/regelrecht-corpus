  - number: '11.1'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II anders dan
      vanuit een glastuinbouwbedrijf of een akkerbouw- of tuinbouwbedrijf met open grondteelt als bedoeld in
      [artikel 10, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel11
