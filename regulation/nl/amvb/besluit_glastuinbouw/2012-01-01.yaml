  - number: '2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt voorts verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.a
    text: |-
      glastuinbouwbedrijf: een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd tot het onder een permanente opstand
      van glas of van kunststof telen van gewassen, met uitzondering van een zodanige inrichting die uitsluitend of in
      hoofdzaak is bestemd tot het onder een zodanige opstand telen van eetbare paddestoelen of witlof;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.b
    text: 'glastuinbouwbedrijf type A: glastuinbouwbedrijf, waar:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
