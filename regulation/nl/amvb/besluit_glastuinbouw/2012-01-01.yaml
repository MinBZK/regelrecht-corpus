  - number: 2.b.18°.bb
    text: |-
      voor 1 mei 1996 en het glastuinbouwbedrijf, met inbegrip van eventuele uitbreidingen na dat tijdstip, is gelegen op
      een afstand van minder dan 25 meter van een object categorie I, dan wel op een afstand van minder dan 10 meter van
      een object categorie II, of het glastuinbouwbedrijf, met inbegrip van eventuele uitbreidingen na dat tijdstip, na
      1 oktober 2009 komt te liggen op een afstand van minder dan 50 meter van enig object categorie I dan wel tot minder
      dan 25 meter van enig object categorie II,
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.c
    text: 'glastuinbouwbedrijf type B: glastuinbouwbedrijf, niet zijnde glastuinbouwbedrijf type A;'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.d
    text: |-
      glastuinbouwactiviteiten: het bedrijfsmatig of in een omvang alsof het bedrijfsmatig was onder een permanente
      opstand van glas of van kunststof telen van gewassen, met uitzondering van eetbare paddestoelen of witlof;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e
    text: |-
      lozen type I: het ten gevolge van glastuinbouwactiviteiten of activiteiten die daar direct mee verband houden,
      lozen op:
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°
    text: 'een oppervlaktewaterlichaam van:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°.aa
    text: |-
      spuiwater, drainwater, onderscheidenlijk drainagewater, vanaf een perceel dat vóór 1 november 1994 nog niet voor
      glastuinbouwactiviteiten werd gebruikt, of
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°.bb
    text: |-
      huishoudelijk afvalwater als bedoeld in [artikel 1, eerste lid, van de Wet milieubeheer][ref1], van meer dan 10
      inwonerequivalenten, tenzij de afstand tot de dichtstbijzijnde riolering waarop kan worden aangesloten, gemeten
      vanaf de plaats waar dat afvalwater ontstaat, minder bedraagt dan:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 2.e.1°.bb.1°
    text: 100 meter bij 11 tot 25 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°.bb.2°
    text: 600 meter bij 25 tot 50 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°.bb.3°
    text: 1500 meter bij 50 tot 100 inwonerequivalenten,
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.1°.bb.4°
    text: 3000 meter bij 100 inwonerequivalenten of meer doch niet meer dan 200 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2.e.2°
    text: |-
      een werk, niet zijnde een voorziening als bedoeld in [artikel 10.30, eerste lid, van de Wet milieubeheer][ref1],
      dat is aangesloten op een inrichting, in gebruik bij een provincie, een gemeente, een waterschap of een ander
      openbaar lichaam voor het zuiveren van afvalwater;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.f
    text: |-
      lozen type II: het lozen ten gevolge van glastuinbouwactiviteiten of daarmee direct verband houdende activiteiten,
      niet zijnde lozen type I.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2
  - number: 2a
    text: |-
      Dit besluit berust mede op de [artikelen 6.2, eerste lid, onderdeel b, en tweede lid, onderdeel b][ref1],
      [6.6][ref2] en [6.7 van de Waterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '3'
    text: |-
      De verboden, bedoeld in [artikel 6.2 van de Waterwet][ref1], gelden niet ten aanzien van lozen type II.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '4.1'
    text: |-
      De voorschriften, opgenomen in [bijlagen 1][ref1] en [2][ref2], gelden voor een ieder die een glastuinbouwbedrijf
      type B drijft.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
  - number: '4.2'
    text: |-
      De voorschriften, opgenomen in [bijlage 3][ref1], gelden voor een ieder die loost type II vanuit een
      glastuinbouwbedrijf type B.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '4.3'
    text: |-
      De voorschriften, opgenomen in [bijlage 2][ref1], zijn niet van toepassing op drukapparatuur, samenstellen en
      druksystemen waarop het [Warenwetbesluit drukapparatuur](onbekend) van toepassing is, voorzover de voorschriften
      betrekking hebben op het ontwerp, de vervaardiging, de overeenstemmingsbeoordeling, de ingebruikneming en het
      gebruik bedoeld in dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '4.4'
    text: |-
      De voorschriften opgenomen in [bijlage 1][ref1], voor zover zij betrekking hebben op meststoffen, gelden niet
      indien geen emissie van meststoffen naar bodem, lucht of een oppervlaktewaterlichaam plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '4.5'
    text: |-
      De verbruiksdoelstellingen genoemd in [bijlage 1][ref1], lijst 1, onderdelen C en D, gelden niet voor
      substraatteelt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '4.6'
    text: |-
      Vanaf 1 januari 2011 gelden de voorschriften 3.1.1, onderdelen b en c, 3.1.2, onderdelen b en c, en 3.1.3,
      onderdelen b en c, van [bijlage 1][ref1] niet voor substraatteelt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '5.1'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft, draagt er zorg voor dat de voor het betrokken glastuinbouwbedrijf
      geldende artikelen en voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 2][ref1], hoofdstukken 1 tot en met 3, inhoudt dat
      daarbij aangegeven middelen ter bescherming van het milieu moeten worden toegepast, meldt degene die de
      inrichting drijft en die voornemens is andere middelen toe te passen, dit voornemen ten minste vier weken
      voordat hij die andere middelen wil toepassen aan het inrichting-bevoegd gezag, onder overlegging van de in
      [artikel 7, achtste lid][ref2], bedoelde gegevens. Het inrichting-bevoegd gezag beslist over de juistheid van een
      gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 3][ref1], inhoudt dat daarbij aangegeven middelen ter
      bescherming van een oppervlaktewaterlichaam of ter bescherming van de doelmatige werking van de betrokken
      zuiveringstechnische werken moeten worden toegepast, meldt degene die loost type II en die voornemens is andere
      middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen wil toepassen aan het
      Wtw-bevoegd gezag, onder overlegging van de in [artikel 8, zesde lid][ref2], bedoelde gegevens. Het Wtw-bevoegd
      gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '6.1'
    text: 'Het inrichting-bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
  - number: 6.1.a
    text: |-
      de in [bijlage 2][ref1] opgenomen voorschriften ten aanzien van geluid, afvalstoffen, afvalwater, waterbesparing,
      assimilatiebelichting, bestrijdingsmiddelen, bodembescherming, lucht, opslag vloeibare kooldioxide, opslag vaste
      mest en gebruikt substraatmateriaal en het composteren en de opslag van afgedragen gewas, voor zover dat in
      hoofdstuk 4 van [die bijlage][ref2] is aangegeven, of


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
  - number: 6.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop paragraaf 1.9 van [bijlage 2][ref1] betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '6.2'
    text: |-
      Het Wtw-bevoegd gezag kan maatwerkvoorschriften stellen met betrekking tot de in [bijlage 3][ref1] opgenomen
      voorschriften ten aanzien van het volume van lozen, buffervoorzieningen, voorzieningen voor de gespreide afvoer
      van afvalwater, voorzieningen voor de individuele behandeling van afvalwater, controlevoorzieningen, samenstelling
      en hergebruik van afvalwater, toediening van meststoffen alsmede metingen en analyses, voor zover dat in
      [die bijlage][ref2] is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013430
      - id: ref2
        bwb_id: BWBR0013430
  - number: '6.3'
    text: |-
      De maatwerkvoorschriften gelden voor een ieder die het glastuinbouwbedrijf type B drijft. Deze draagt er zorg voor
      dat de maatwerkvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
  - number: '6.4'
    text: |-
      De maatwerkvoorschriften, bedoeld in het eerste lid, kunnen worden gewijzigd of ingetrokken, indien het belang van
      de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
  - number: '6.5'
    text: |-
      De maatwerkvoorschriften, bedoeld in het tweede lid, kunnen worden gewijzigd of ingetrokken, indien het belang
      van de bescherming van een oppervlaktewaterlichaam en de doelmatige werking van de betrokken zuiveringstechnische
      werken zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
  - number: '6.6'
    text: |-
      Van de beschikking waarbij een maatwerkvoorschrift wordt gesteld krachtens dit besluit, wordt kennisgegeven in één
      of meer dag-, nieuws- of huis-aan-huisbladen.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Degene die een glastuinbouwbedrijf type B opricht, meldt dit ten minste acht weken voor de oprichting aan het
      inrichting-bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een glastuinbouwbedrijf type
      B en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig
      dit artikel is gedaan en door dit uitbreiden, wijzigen of veranderen van de werking van het glastuinbouwbedrijf
      geen afwijking ontstaat van de bij die melding eerder verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.3'
    text: 'Bij een melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.a
    text: het adres van het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.b
    text: |-
      de naam en het adres van degene die het glastuinbouwbedrijf opricht dan wel verandert of de werking daarvan
      verandert, en, indien dat iemand anders is, van degene die het glastuinbouwbedrijf drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.c
    text: de aard en omvang van de activiteiten of processen in het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.d
    text: de indeling en de uitvoering van het glastuinbouwbedrijf;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.e
    text: |-
      het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking verwezenlijkt zal zijn;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.f
    text: de aard, omvang en frequentie van de transportactiviteiten en
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.3.g
    text: de plaats waar wordt geladen en gelost en
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.4'
    text: Bij de melding worden voorts gevoegd
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.4.a
    text: |-
      een rapport van een onderzoek naar de nulsituatie van de bodem, gericht op het in beeld brengen van de toestand van
      de bodem voor het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking is gebracht, dan wel
      de verandering van de verwerking is verwezenlijkt. Het onderzoek naar de nulsituatie richt zich uitsluitend op de
      stoffen die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen, en op de plaatsen waar
      bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.4.b
    text: een rapportage van een vooronderzoek. Het vooronderzoek richt zich op de gehele inrichting;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: 7.4.c
    text: |-
      indien assimilatiebelichting wordt toegepast: de verlichtingssterkte, uitgedrukt in lux, alsmede het type lamp, het
      aantal Watt per vierkante meter en het totale vermogen van de geïnstalleerde lampen in Watt.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.6'
    text: |-
      Indien aannemelijk is dat het langtijdgemiddeld beoordelingsniveau of het piekniveau veroorzaakt door de in
      de inrichting aanwezige installaties en toestellen, alsmede door de in de inrichting verrichte werkzaamheden
      en activiteiten hoger zal zijn dan de waarden, bedoeld in voorschrift 1.1.1, 1.1.2, 1.1.3 of 4.1.1 van
      [bijlage 2][ref1], kan het bevoegd gezag binnen vier weken na ontvangst van de melding besluiten dat een rapport
      van een onderzoek naar de akoestische situatie moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '7.7'
    text: |-
      Het onderzoek richt zich met gebruikmaking van geluidmetingen of geluidberekeningen op de bestaande en te
      verwachten geluidniveaus en op maatregelen en voorzieningen die ertoe kunnen leiden dat de geluidniveaus de waarden
      bedoeld in voorschrift 1.1.1, 1.1.2, 1.1.3 of 4.1.1 van [bijlage 2][ref1] niet zullen overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '7.8'
    text: |-
      De in het derde en vierde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die het
      glastuinbouwbedrijf type B drijft, deze gegevens reeds aan het inrichting-bevoegd gezag heeft verschaft en het
      inrichting-bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.9'
    text: |-
      Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het
      inrichting-bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
  - number: '7.10'
    text: |-
      Bij de melding overeenkomstig [artikel 5, tweede lid][ref1], worden aan het inrichting-bevoegd gezag gegevens
      verstrekt waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor
      het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '5'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Degene die voornemens is vanuit een glastuinbouwbedrijf type B te lozen type II, meldt dit ten minste acht weken
      voordat met dat lozen wordt aangevangen aan het Wtw-bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van het lozen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: '8.3'
    text: 'Bij een melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.a
    text: de naam en het adres van degene die loost;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.b
    text: de aard en omvang van de glastuinbouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.c
    text: de indeling en de uitvoering van de gebouwen waar vanuit het lozen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.d
    text: de plaats van in de gebouwen aanwezige lozingspunten;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.e
    text: het volume en de samenstelling van het te lozen afvalwater;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.f
    text: |-
      een opgave van de afstand tussen de plaats waar het afvalwater ontstaat en de dichtstbijzijnde voorziening voor de
      inzameling en het transport van afvalwater, bedoeld in [artikel 10.30, eerste lid, van de Wet milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 8.3.g
    text: een opgave van het aantal inwonerequivalenten van huishoudelijk afvalwater, dat wordt geloosd;
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: 8.3.h
    text: |-
      een opgave van de voorzieningen, bedoeld in de voorschriften 4, eerste en zesde lid, 5, tweede lid, 6, tweede lid,
      7, derde lid, 8, derde lid, 9, tweede en vierde lid , 10, tweede lid, 11, tweede en vierde lid, 12, tweede lid, en
      14, achtste lid opgenomen in [bijlage 3][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013430
  - number: '8.4'
    text: |-
      De in het derde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die loost, deze gegevens
      reeds aan het Wtw-bevoegd gezag heeft verschaft en het Wtw-bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: '8.5'
    text: |-
      Degene die een melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het Wtw-
      bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij de melding overeenkomstig [artikel 5, derde lid][ref1], worden aan het Wtw-bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor een
      oppervlaktewaterlichaam of de doelmatige werking van de betrokken zuiveringtechnische werken wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      De meldingen bedoeld in [de artikelen 7][ref1] en [8][ref2] worden gedaan op een formulier waarvan het model wordt
      vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in overeenstemming met
      Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel9
