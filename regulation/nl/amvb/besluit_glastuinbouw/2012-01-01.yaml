        bwb_id: BWBR0013430
  - number: '20'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het Staatsblad waarin het wordt geplaatst, met uitzondering van voorschrift 1.1.6, opgenomen in [bijlage 1][ref1]
      en voorschrift 2.5.1 opgenomen in [bijlage 2][ref2], die op een bij koninklijk besluit te bepalen tijdstip in
      werking treden.


