        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '11.3'
    text: |-
      Bij een melding als bedoeld in [artikel 8][ref1], wordt voorts een opgave van de teelt of teelten en teeltwijze of
      teeltwijzen overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel11
