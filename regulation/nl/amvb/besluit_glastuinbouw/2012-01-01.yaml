        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De voorschriften opgenomen in [bijlage 1][ref1] gelden voor een ieder die een glastuinbouwbedrijf type A drijft of
      een akkerbouw- of tuinbouwbedrijf met open grondteelt, waarop het [Besluit landbouw milieubeheer][ref2] in verband
      met [artikel 3, eerste lid, onder i, van dat besluit][ref3], niet van toepassing is. [Artikel 5, eerste lid][ref4],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0020112
      [ref3]: https://wetten.overheid.nl/BWBR0020112#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013430#Artikel5
