  - number: 1.2.b
    text: het aantal mandagen per 365 dagen te vermenigvuldigen met de factor 0,001.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel1
  - number: '1.3'
    text: |-
      Dit besluit berust mede op de [artikelen 78 tot en met 80 van de Wet gewasbeschermingsmiddelen en biociden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel78
