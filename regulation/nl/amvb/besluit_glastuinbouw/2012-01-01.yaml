        artikel: '8'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Voor een glastuinbouwbedrijf type B dat op het tijdstip van inwerkingtreding van dit besluit was opgericht
      en waarvoor onmiddellijk daaraan voorafgaand een Wm-vergunning in werking en onherroepelijk was, blijven
      de voorschriften van die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de
      aanvraag voor zover die deel uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of
      omzetting in voorschriften, gelden als nadere eis, bedoeld in [artikel 6, eerste lid][ref1], behoudens eerdere
      wijziging of intrekking van die voorschriften, gedurende drie jaar na het tijdstip van toepassing worden
      van dit besluit op die inrichting, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 6, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wm-
      vergunning dan wel krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, blijven gelden als
      nadere eis, bedoeld in [artikel 6, eerste lid][ref1], na het tijdstip van inwerkingtreding van dit besluit, mits
      het voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft waarop het eerste lid van toepassing is, legt de gegevens, bedoeld
      in [artikel 7, derde lid, onderdelen a tot en met g en vierde lid][ref1], over aan het inrichting-bevoegd gezag.
      Artikel 7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing. Voor zover de gegevens nog niet eerder
      in het kader van de Wm-vergunning behoefden te worden overgelegd, legt degene die het glastuinbouwbedrijf drijft,
      die gegevens over aan het inrichting-bevoegd gezag, ten hoogste twaalf weken na het tijdstip waarop dit besluit in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '14.4'
    text: |-
      Degene die een glastuinbouwbedrijf type B drijft waarop onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer van toepassing
      was, legt de gegevens bedoeld in [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref1], over aan het
      inrichting-bevoegd gezag. Artikel 7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Voor lozen type II, dat op het tijdstip van inwerkingtreding van dit besluit reeds plaatsvond en waarvoor
      onmiddellijk daaraan voorafgaand een Wvo-vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag die deel uitmaakt
      van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van toepassing worden van dit besluit op dat lozen, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wvo-
      vergunning dan wel krachtens het Lozingenbesluit Wvo glastuinbouw voor lozen type II, blijven gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref1], na het tijdstip van inwerkingtreding van dit besluit mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel6
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013430
        artikel: '6'
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Degene die loost type II waarop het eerste lid van toepassing is, legt de gegevens, bedoeld in
      [artikel 8, derde lid][ref1], over aan het Wtw-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '15.4'
    text: |-
      Degene die loost type II waarop onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      dit besluit het Lozingenbesluit Wvo glastuinbouw van toepassing was, legt de gegevens bedoeld in
      [artikel 8, derde lid, onderdeel h][ref1], over aan het Wtw-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds is opgericht en
      voor dat bedrijf onmiddellijk voor dat tijdstip geen Wm-vergunning in werking en onherroepelijk was of geen melding
      was gedaan krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, meldt degene die de inrichting
      drijft, aan het Wm-bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel16
  - number: '16.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in
      werking treedt. Artikel 7, derde tot en met zesde lid, is van overeenkomstige toepassing op een melding als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds is
      opgericht en voor dat bedrijf onmiddellijk voor dat tijdstip een melding was gedaan krachtens het Besluit
      tuinbouwbedrijven met bedekte teelt milieubeheer, legt degene die het glastuinbouwbedrijf drijft, ten
      hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens, bedoeld in
      [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref1], over aan het Wm-bevoegd gezag. Artikel 7, vijfde en
      zesde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '16.4'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten van
      een glastuinbouwbedrijf type B is ingediend en dit besluit op de inrichting van toepassing is of zal zijn, zijn het
      eerste en tweede lid, niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '7'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip geen Wvo-vergunning gold of geen melding was gedaan krachtens het Lozingenbesluit
      Wvo glastuinbouw, meldt degene die loost, aan het Wtw-bevoegd gezag dat hij loost.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17
  - number: '17.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit
      in werking treedt. Artikel 8, derde tot en met vijfde lid, is van overeenkomstige toepassing op een melding als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17
  - number: '17.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip een melding was gedaan krachtens het Lozingenbesluit Wvo glastuinbouw, legt degene
      die loost type II, ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens,
      bedoeld in [artikel 8, derde lid, onderdelen f en h][ref1], over aan het Wtw-bevoegd gezag. Artikel 8, vierde en
      vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013430
        artikel: '8'
        paragraaf: '2'
  - number: 17a.1
    text: |-
      Met voorzieningen, toestellen en installaties genoemd in dit besluit of de bijlagen worden gelijkgesteld
      voorzieningen, toestellen en installaties die rechtmatig zijn vervaardigd of in de handel zijn gebracht in
      een andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel gebracht in een
      staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17a
  - number: 17a.2
    text: |-
      Met een verklaring, keuring of erkenning als bedoeld in dit besluit of de bijlagen wordt gelijkgesteld een
      verklaring van goedkeuring, afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van
      de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een
      daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis
      van onderzoekingen die een beschermingsniveau bieden dan ten minste gelijkwaardig is aan het niveau dat met de
      nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17a
  - number: 17a.3
    text: |-
      Met de beroepseisen ter zake van controle, beoordeling, inspectie, onderhoud of afstelling als bedoeld in dit
      besluitof de bijlagen worden gelijkgesteld beroepseisen die worden gesteld in een andere lidstaat van de Europese
      Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend
      of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgen dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel17a
  - number: '18'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met
      Onze Ministers van Verkeer en Waterstaat en van Landbouw, Natuurbeheer en Visserij binnen vijf jaar na de
      inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit
      besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel18
  - number: '19.1'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel19
  - number: 19.1.a
    text: het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer en
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel19
  - number: 19.1.b
    text: het Lozingenbesluit Wvo glastuinbouw.
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel19
  - number: '19.3'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling slibvangputten en vet- of olie-afscheiders mede op het in
      [bijlage 2][ref1] opgenomen voorschrift 1.3.6, onder b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2012-01-01#Artikel19
    references:
