  - number: '8'
    text: |-
      1 Degene die voornemens is vanuit een glastuinbouwbedrijf type B te lozen type II, meldt dit ten minste acht weken
      voordat met dat lozen wordt aangevangen aan het Wvo-bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van het lozen, bedoeld in het
      eerste lid.

      3 Bij een melding wordt vermeld:

      a. de naam en het adres van degene die loost;

      b. de aard en omvang van de glastuinbouwactiviteiten;

      c. de indeling en de uitvoering van de gebouwen waar vanuit het lozen plaatsvindt;

      d. de plaats van in de gebouwen aanwezige lozingspunten;

      e. het volume en de samenstelling van het te lozen afvalwater;

      f. een opgave van de afstand tussen de plaats waar het afvalwater ontstaat en de
      dichtstbijzijnde voorziening voor de inzameling en het transport van afvalwater, bedoeld in
      [artikel 10.30, eerste lid, van de Wet milieubeheer][ref1];

      g. een opgave van het aantal inwonerequivalenten van huishoudelijk afvalwater, dat wordt geloosd;

      h. een opgave van de voorzieningen, bedoeld in de voorschriften 4, eerste en zesde lid, 5, tweede lid, 6, tweede
      lid, 7, derde lid, 8, derde lid, 9, tweede en vierde lid , 10, tweede lid, 11, tweede en vierde lid, 12, tweede
      lid, en 14, achtste lid opgenomen in [bijlage 3][ref2] en

      i.

      4 De in het derde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die loost, deze gegevens
      reeds aan het Wvo-bevoegd gezag heeft verschaft en het Wvo-bevoegd gezag over die gegevens beschikt.

      5 Degene die een melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het Wvo-
      bevoegd gezag heeft verschaft.

      6 Bij de melding overeenkomstig [artikel 5, derde lid][ref3], worden aan het Wvo-bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor het
      oppervlaktewater of de doelmatige werking van de betrokken zuiveringtechnische werken wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.30
      [ref2]: https://wetten.overheid.nl/BWBR0013430
      [ref3]: https://wetten.overheid.nl/BWBR0013430#Artikel5
