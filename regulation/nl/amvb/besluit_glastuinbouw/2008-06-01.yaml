  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 juni 2001,
    nr. MJZ 2001064015 Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris
    van Verkeer en Waterstaat, de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, Onze Minister van
    Volksgezondheid, Welzijn en Sport en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst;

    Gelet op richtlijn nr. 76/464/EEG van de Raad van de Europese Gemeenschappen van 4 mei 1976 betreffende de
    verontreiniging veroorzaakt door bepaalde gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden
    geloosd (PbEG L 129), richtlijn nr. 91/271/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1991 inzake
    de behandeling van stedelijk afvalwater (PbEG L 135), richtlijn nr. 91/676/EEG van de Raad van 12 december 1991
    inzake de bescherming van water tegen verontreiniging door nitraat uit agrarische bronnen (PbEG L 375) en richtlijn
    nr. 91/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 betreffende gevaarlijke afvalstoffen
    (PbEG L 377), de artikelen 8.19, 8.40, 8.41, 8.42, 8.44 en 21.8 van de Wet milieubeheer, de artikelen 1, 1a, 2a,
    2b, 2c en 31, vierde lid, van de Wet verontreiniging oppervlaktewateren, artikel 13 van de Bestrijdingsmiddelenwet
    1962 en de artikelen 72 en 93 van de Wet bodembescherming;

    De Raad van State gehoord (advies van 3 december 2001, nr. W01.01.0291/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van 15
    januari 2002, nr. MJZ 2002013892, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens
    de Staatssecretaris van Verkeer en Waterstaat, de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, Onze
    Minister van Volksgezondheid, Welzijn en Sport en de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F.
    Hoogervorst;

    Hebben goedgevonden en verstaan:
