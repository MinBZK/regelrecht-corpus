  - number: '6'
    text: |-
      1 Het Wm-bevoegd gezag kan nadere eisen stellen met betrekking tot:

      a. de in bijlage 2 opgenomen voorschriften ten aanzien van geluid, afvalstoffen, afvalwater, waterbesparing,
      assimilatiebelichting, bestrijdingsmiddelen, bodembescherming, lucht, opslag vloeibare kooldioxide, opslag vaste
      mest en gebruikt substraatmateriaal en het composteren en de opslag van afgedragen gewas, voor zover dat in
      hoofdstuk 4 van die bijlage is aangegeven, of

      b. de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop paragraaf 1.9 van [bijlage 2][ref1] betrekking heeft, indien dat bijzonder is aangewezen in het
      belang van de bescherming van het milieu.

      2 Het Wvo-bevoegd gezag kan nadere eisen stellen met betrekking tot de in [bijlage 3][ref2] opgenomen voorschriften
      ten aanzien van het volume van lozen, buffervoorzieningen, voorzieningen voor de gespreide afvoer van afvalwater,
      voorzieningen voor de individuele behandeling van afvalwater, controlevoorzieningen, samenstelling en hergebruik
      van afvalwater, toediening van meststoffen alsmede metingen en analyses, voor zover dat in die bijlage is
      aangegeven.

      3 De nadere eisen gelden voor een ieder die het glastuinbouwbedrijf type B drijft. Deze draagt er zorg voor dat de
      nadere eisen worden nageleefd.

      4 De nadere eisen, bedoeld in het eerste lid, kunnen worden gewijzigd of ingetrokken, indien het belang van de
      bescherming van het milieu zich daartegen niet verzet.

      5 De nadere eisen, bedoeld in het tweede lid, kunnen worden gewijzigd of ingetrokken, indien het belang van de
      bescherming van het oppervlaktewater en de doelmatige werking van de betrokken zuiveringstechnische werken zich
      daartegen niet verzetten.

      6 Van de beschikking waarbij een nadere eis wordt gesteld krachtens dit besluit, wordt kennisgegeven in één of meer
      dag-, nieuws- of huis-aan-huisbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
    url: https://wetten.overheid.nl/BWBR0013430/2008-06-01#Artikel6
