    text: |-
      1 Voor een glastuinbouwbedrijf type B dat op het tijdstip van inwerkingtreding van dit besluit was opgericht
      en waarvoor onmiddellijk daaraan voorafgaand een Wm-vergunning in werking en onherroepelijk was, blijven
      de voorschriften van die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de
      aanvraag voor zover die deel uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of
      omzetting in voorschriften, gelden als nadere eis, bedoeld in [artikel 6, eerste lid][ref1], behoudens eerdere
      wijziging of intrekking van die voorschriften, gedurende drie jaar na het tijdstip van toepassing worden
      van dit besluit op die inrichting, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 6, eerste lid, onder a][ref2].

      2 De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wm-
      vergunning dan wel krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, blijven gelden als
      nadere eis, bedoeld in [artikel 6, eerste lid][ref3], na het tijdstip van inwerkingtreding van dit besluit, mits
      het voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, eerste lid, onder a][ref4].

      3 Degene die een glastuinbouwbedrijf type B drijft waarop het eerste lid van toepassing is, legt de gegevens,
      bedoeld in [artikel 7, derde lid, onderdelen a tot en met g en vierde lid][ref5], over aan het Wm-bevoegd gezag.
      Artikel 7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.

      Voor zover de gegevens nog niet eerder in het kader van de Wm-vergunning behoefden te worden overgelegd, legt
      degene die het glastuinbouwbedrijf drijft, die gegevens over aan het Wm-bevoegd gezag, ten hoogste twaalf weken na
      het tijdstip waarop dit besluit in werking treedt.

      4 Degene die een glastuinbouwbedrijf type B drijft waarop onmiddellijk voorafgaand aan het tijdstip van
      inwerkingtreding van dit besluit het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer van toepassing was,
      legt de gegevens bedoeld in [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref6], over aan het Wm-bevoegd
      gezag. Artikel 7, vijfde, zesde en zevende lid, is van overeenkomstige toepassing.


