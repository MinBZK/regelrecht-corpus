  - number: '15'
    text: |-
      1 Voor lozen type II, dat op het tijdstip van inwerkingtreding van dit besluit reeds plaatsvond en waarvoor
      onmiddellijk daaraan voorafgaand een Wvo-vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag die deel uitmaakt
      van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van toepassing worden van dit besluit op dat lozen, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref2].

      2 De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de Wvo-
      vergunning dan wel krachtens het Lozingenbesluit Wvo glastuinbouw voor lozen type II, blijven gelden als nadere
      eis, bedoeld in [artikel 6, tweede lid][ref3], na het tijdstip van inwerkingtreding van dit besluit mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 6, tweede lid][ref4].

      3 Degene die loost type II waarop het eerste lid van toepassing is, legt de gegevens, bedoeld in
      [artikel 8, derde lid][ref5], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.

      4 Degene die loost type II waarop onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding
      van dit besluit het Lozingenbesluit Wvo glastuinbouw van toepassing was, legt de gegevens bedoeld in
      [artikel 8, derde lid, onderdeel h][ref6], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en vijfde lid, is van
      overeenkomstige toepassing.


