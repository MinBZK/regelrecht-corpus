    text: |-
      In dit besluit en de daarop berustende bepalingen wordt voorts verstaan onder:

      a. glastuinbouwbedrijf: een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd tot het onder een permanente opstand
      van glas of van kunststof telen van gewassen, met uitzondering van een zodanige inrichting die uitsluitend of in
      hoofdzaak is bestemd tot het onder een zodanige opstand telen van eetbare paddestoelen of witlof;

      b. glastuinbouwbedrijf type A: glastuinbouwbedrijf waarvoor de verboden bedoeld in
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref2] blijven bestaan, omdat:

      1°. gedeputeerde staten het Wm-bevoegd gezag zijn;

      2°. een andere brandstof dan aardgas, propaan, butaan, gasolie of petroleum wordt gebruikt in een ketelinstallatie
      ten behoeve van ruimteverwarming of warmwatervoorziening;

      3°. een andere brandstof dan aardgas, propaangas of butaangas dan wel een combinatie van deze brandstoffen wordt
      gestookt in een zuigermotor ten behoeve van een warmtepompinstallatie, onderscheidenlijk een installatie voor
      warmtekrachtkoppeling;

      4°. een zuigermotor als bedoeld onder 3° of een ketelinstallatie als bedoeld onder 2° wordt gebruikt voor het
      onderzoeken, beproeven of demonstreren van experimentele verbrandingstechnieken of van technieken ter bestrijding
      van de uitworp van zwaveldioxiden, stikstofoxiden of stof;

      5°. een warmtekrachtinstallatie danwel warmtepompinstallatie als bedoeld onder 3° wordt gebruikt met een groter
      gezamenlijk nominaal elektrisch vermogen dan 10 MW;

      6°. een ketelinstallatie als bedoeld onder 2° wordt gebruikt met een groter thermisch vermogen dan 7500 kW per
      toestel;

      7°. activiteiten of handelingen plaatsvinden, als bedoeld in
      [categorie 21, bijlage I, behorende bij het Inrichtingen- en vergunningenbesluit milieubeheer][ref3];

      8°. in een specifieke daartoe ingerichte ruimte behandeling voor derden van bloembollen of knollen met
      gewasbeschermingsmiddelen plaatsvindt;

      9°. nitraathoudende kunstmeststoffen worden bewaard anders dan die van type C als bedoeld in CPR 1;

      10°. bewaring van meer dan 10 000 kg gevaarlijke stoffen in emballage plaatsvindt;

      11°. windenergie in elektrische energie wordt omgezet met één of meer windturbines, tenzij:

      aa. windturbines elk afzonderlijk een vaste verbinding hebben met de bodem of waterbodem in de vorm van een mast,

      bb. windturbines zijn voorzien van een horizontale draaias van de rotor,

      cc. de afstand tussen een afzonderlijke windturbine en de dichtstbijzijnde woning of andere geluidgevoelige
      bestemming, ten minste viermaal de ashoogte bedraagt, en

      dd. de windturbine of het samenstel van windturbines een gezamenlijk elektrisch vermogen heeft, kleiner dan 15 MW;

      12°. opslag van vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in
      tanks plaatsvindt, tenzij sprake is van:

      a. opslag in een of meer ondergrondse tanks, waarop het
      [Besluit algemene regels voor inrichtingen milieubeheer][ref4] van toepassing is,

      b. opslag van brandbare vloeistoffen in een of meer bovengrondse tanks,

      c. opslag van petroleum in een of meer bovengrondse tanks met een gezamenlijke inhoud van ten hoogste 15.000 liter,
      of

      d. opslag van vloeibare kunstmeststoffen in bovengrondse tanks;

      13°. op het bewaren van butaan of propaan, anders dan in spuitbussen of gasflessen, het
      [Besluit algemene regels voor inrichtingen milieubeheer][ref5] niet van toepassing is;

      14°. meer dan 1000 kg bestrijdingsmiddelen aanwezig is;

      15°. aflevering van brandstoffen ten behoeve van tractiedoeleinden plaatsvindt aan motorvoertuigen van derden;

      16°. per transportmiddel meer dan één wisselreservoir met een waterinhoud van ten hoogste 150 liter aanwezig is;

      17°. verven van bloemen en siergewassen plaatsvindt;

      18°. vee bedrijfsmatig wordt gehouden;

      19°. koel- en vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer
      dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan;

      20°. het glastuinbouwbedrijf is opgericht:

      aa. na 30 april 1996 en is gelegen op een afstand van minder dan 50 meter van een object categorie I, dan wel op
      een afstand van minder dan 25 meter van een object categorie II of

      bb. voor 1 mei 1996 en, met inbegrip van eventuele uitbreidingen na dat tijdstip, is gelegen op een afstand van
      minder dan 25 meter van een object categorie I, dan wel op een afstand van minder dan 10 meter van een object
      categorie II, voor de bepaling van afstanden wordt gemeten vanaf het onderdeel van het glastuinbouwbedrijf dat het
      dichtst bij het genoemde object is gelegen, waarbij een waterbassin, een watersilo, een warmwateropslagtank en het
      open erf niet als een zodanig onderdeel worden beschouwd;

      c. glastuinbouwbedrijf type B: glastuinbouwbedrijf, niet zijnde glastuinbouwbedrijf type A;

      d. glastuinbouwactiviteiten: het bedrijfsmatig of in een omvang alsof het bedrijfsmatig was onder een permanente
      opstand van glas of van kunststof telen van gewassen, met uitzondering van eetbare paddestoelen of witlof;

      e. lozen type I: het ten gevolge van glastuinbouwactiviteiten of activiteiten die daar direct mee verband houden,
      lozen op:

      1°. oppervlaktewater van:

      aa. spuiwater, drainwater, onderscheidenlijk drainagewater, vanaf een perceel dat vóór 1 november 1994 nog niet
      voor glastuinbouwactiviteiten werd gebruikt, of

      bb. huishoudelijk afvalwater als bedoeld in [artikel 1, eerste lid, van de Wet milieubeheer][ref6], van meer dan
      10 inwonerequivalenten, tenzij de afstand tot de dichtstbijzijnde riolering waarop kan worden aangesloten, gemeten
      vanaf de plaats waar dat afvalwater ontstaat, minder bedraagt dan:

      1°. 100 meter bij 11 tot 25 inwonerequivalenten,

      2°. 600 meter bij 25 tot 50 inwonerequivalenten,

      3°. 1500 meter bij 50 tot 100 inwonerequivalenten,

      4°. 3000 meter bij 100 inwonerequivalenten of meer doch niet meer dan 200 inwonerequivalenten;

      2°. een werk, niet zijnde een voorziening als bedoeld in [artikel 10.30, eerste lid, van de Wet milieubeheer][ref7],
      dat is aangesloten op een inrichting, in gebruik bij een provincie, een gemeente, een waterschap of een ander
      openbaar lichaam voor het zuiveren van afvalwater;

      f. lozen type II: het lozen ten gevolge van glastuinbouwactiviteiten of daarmee direct verband houdende
      activiteiten, niet zijnde lozen type I.


