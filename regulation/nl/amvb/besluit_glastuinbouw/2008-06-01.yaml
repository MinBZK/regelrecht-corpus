  - number: '17'
    text: |-
      1 Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip geen Wvo-vergunning gold of geen melding was gedaan krachtens het Lozingenbesluit
      Wvo glastuinbouw, meldt degene die loost, aan het Wvo-bevoegd gezag dat hij loost.

      2 De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit
      in werking treedt. Artikel 8, derde tot en met vijfde lid, is van overeenkomstige toepassing op een melding als
      bedoeld in het eerste lid.

      3 Indien op het tijdstip waarop dit besluit in werking treedt lozen type II reeds plaatsvond en voor dat lozen
      onmiddellijk voor dat tijdstip een melding was gedaan krachtens het Lozingenbesluit Wvo glastuinbouw, legt degene
      die loost type II, ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens,
      bedoeld in [artikel 8, derde lid, onderdelen f en h][ref1], over aan het Wvo-bevoegd gezag. Artikel 8, vierde en
      vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel8
