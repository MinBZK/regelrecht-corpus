  - number: '18'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt in overeenstemming met
      Onze Ministers van Verkeer en Waterstaat en van Landbouw, Natuurbeheer en Visserij binnen vijf jaar na de
      inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit
      besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013430/2008-06-01#Artikel18
  - number: '19'
    text: |-
      1 Ingetrokken worden:

      a. het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer en

      b. het Lozingenbesluit Wvo glastuinbouw.

