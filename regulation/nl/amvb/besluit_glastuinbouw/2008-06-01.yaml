      1 Bedrijven of gedeelten van bedrijven, waar vanuit lozen type I of II plaatsvindt, worden
      aangewezen als soort van inrichtingen in de zin van [artikel 1, tweede lid][ref1], en
      [artikel 31, vierde lid, van de Wet verontreiniging oppervlaktewateren][ref2].

      2 De verboden, bedoeld in [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref3], gelden niet ten aanzien
      van lozen type II.


