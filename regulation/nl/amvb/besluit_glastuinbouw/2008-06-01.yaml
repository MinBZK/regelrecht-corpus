articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. aaneengesloten woonbebouwing: drie of meer woningen die op telkens minder dan 5 meter afstand van elkaar zijn
      gelegen, gerekend van gevel tot gevel;

      b. bedrijfsriolering: voorziening voor de afvoer van afvalwater vanuit de inrichting naar een openbaar riool of
      naar een andere voorziening voor de inzameling en het transport van afvalwater;

      c. bestrijdingsmiddel: gewasbeschermingsmiddel of biocide als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen of biociden][ref1];

      d. brandbare vloeistof: stof in vloeibare toestand die een vlampunt heeft dat hoger ligt dan 55°C;

      e. bijlage 1: de bij dit besluit behorende [bijlage 1][ref2];

      f. bijlage 2: de bij dit besluit behorende [bijlage 2][ref3];

      g. bijlage 3: de bij dit besluit behorende [bijlage 3][ref4];

      h. CPR: Commissie Preventie van Rampen en Gevaarlijke Stoffen;

      i. CPR 1: Richtlijn 1 van de CPR, getiteld «Nitraathoudende meststoffen, vervoer en opslag», derde druk, uitgave
      1991;

      j. CPR 15-1: Richtlijn 15-1 van de CPR, getiteld «Opslag gevaarlijke stoffen in emballage; Opslag van vloeistoffen
      en vaste stoffen (0 tot 10 ton)», tweede druk, uitgave 1994;

      k. drainagewater: water dat wordt afgevoerd via een stelsel van geperforeerde buizen die in de grond zijn
      aangebracht;

      l. drainwater: voedingswater dat bij substraatteelt niet wordt opgenomen door het gewas;

      m. gasfles: cilindrische drukhouder, voorzien van een aansluiting met klep- of naaldafsluiter, die bedoeld is voor
      meermalig gebruik en een waterinhoud heeft van ten hoogste 150 liter;

      n. gasolie: gasolie in de zin van de [Wet op de accijns][ref5];

      o. gasturbine: werktuig bestaande uit een compressor, één of meer verbrandingskamers en een turbine waarin
      brandstof met behulp van door de compressor gecomprimeerde lucht wordt verstookt, zodanig dat het geproduceerde
      verbrandingsgas in de turbine tot een lagere druk expandeert en daarbij arbeid afgeeft aan een roterende as;

      p. gasturbine-installatie: installatie bestaande uit een of meer gasturbines waarin brandstof wordt verstookt, met
      een of meer bijbehorende ketelinstallaties waar de verbrandingsgassen afkomstig van de gasturbine of gasturbines,
      doorheen worden gevoerd teneinde warmte over te dragen aan een medium dat niet in direct contact treedt met die
      gassen en waarbij geen dan wel nagenoeg geen extra lucht voor de verbranding wordt toegevoerd;

      q. gevaarlijke stof: stof die of preparaat dat bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref6] is ingedeeld in een categorie als
      bedoeld in [artikel 9.2.3.1, tweede lid, van de Wet milieubeheer][ref7];

      r. gevoelig object: een gebouw of een gedeelte van een gebouw, dat bestemd is voor het verblijf
      van personen of een object, gebouw of terrein dat bestemd is voor verblijfs- of dagrecreatie,
      niet zijnde een kampeerterrein als bedoeld in [artikel 8, tweede lid, onder a][ref8], dan wel
      [artikel 8, derde lid, van de Wet op de openluchtrecreatie][ref9];

      s. gewas: een in lijst 1 behorende bij [bijlage 1][ref10] opgenomen gewas of een in lijst 2 behorende bij die
      bijlage bij een gewasgroep ingedeeld gewas;

      t. gewasbeschermingsmiddel: hetgeen daaronder in de [Bestrijdingsmiddelenwet 1962][ref11] wordt verstaan;

      u. gewasgroep: een groep waarvan in lijst 2 behorende bij [bijlage 1][ref12] is aangegeven welke gewassen erbij
      zijn ingedeeld;

      v. ketelinstallatie: installatie bestaande uit één ketel, waarin brandstof wordt verbruikt, daaronder begrepen de
      bij de installatie behorende voorzieningen voor de reiniging van rookgas, die in hoofdzaak bedoeld zijn om warmte
      over te dragen aan water, stoom of thermische olie, waarbij het water, de stoom of de thermische olie niet in
      direct contact treedt met de rookgassen;

      w. kunstmeststoffen: meststoffen van niet organische oorsprong;

      x. licht ontvlambare stof: stof die of preparaat dat:

      1°. bij normale temperatuur aan de lucht blootgesteld, zonder toevoer van energie in temperatuur kan stijgen en
      tenslotte ontbranden;

      2°. in vaste toestand, door kortstondige inwerking van een ontstekingsbron, gemakkelijk kan worden ontstoken en na
      verwijdering van de ontstekingsbron blijft branden of gloeien;

      3°. in vloeibare toestand een vlampunt van minder dan 21°C heeft (K1-vloeistof);

      4°. in gasvormige toestand, bij normale druk, met lucht ontvlambaar is of

      5°. bij aanraking met water of vochtige lucht, licht ontvlambare gassen in een gevaarlijke hoeveelheid ontwikkelt;

      y. lozen: lozen op oppervlaktewater of lozen op een riolering;

      z. lozen op oppervlaktewater: in oppervlaktewater brengen van afvalstoffen, verontreinigende of schadelijke stoffen
      met behulp van een werk of op een andere wijze dan met behulp van een werk;

      aa. lozen op een riolering: al dan niet door middel van een bedrijfsriolering brengen van afvalstoffen,
      verontreinigende of schadelijke stoffen in een openbaar riool of een andere voorziening voor de inzameling en het
      transport van afvalwater die is aangesloten op een zuiveringstechnisch werk;

      bb. meststoffen: dierlijke meststoffen, overige organische meststoffen en andere meststoffen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, f, onderscheidenlijk g, van de Meststoffenwet][ref13], voor zover zij stikstof
      of fosfor bevatten;

      cc. NEN: een door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;

      dd. NVN: een door het Nederlands Normalisatie Instituut (NNI) uitgegeven voornorm;

      ee. object categorie I:

      1°. aaneengesloten woonbebouwing;

      2°. gevoelig object;

      ff. object categorie II:

      1°. woningen van derden;

      2°. restaurants;

      gg. ontvlambare stof: stof of preparaat in vloeibare toestand (K2-vloeistof) met een vlampunt van ten minste 21°C
      en ten hoogste 55°C;

      hh. openbaar riool: voorziening voor de inzameling en het transport van afvalwater, in beheer bij een gemeente of
      een rechtspersoon die door een gemeente met het beheer is belast;

      ii. riolering: bedrijfsriolering of een voorziening voor de inzameling en het transport van afvalwater;

      jj. spuiwater: water dat vanuit het recirculatiesysteem geloosd wordt, omdat het niet meer geschikt is om als
      voedingswater te worden toegepast;

      kk. substraatteelt: wijze van telen waarbij gewassen groeien op een bodem die los van de ondergrond is;

      ll. teeltplan: plan voor een glastuinbouwbedrijf dat ingevolge voorschrift 1.1.1 opgenomen in [bijlage 1][ref14],
      wordt overgelegd;

      mm. voedingswater: water dat aan het gewas wordt toegediend en waar eventueel meststoffen aan zijn toegevoegd;

      nn. vooronderzoek: onderzoek uit te voeren op een wijze als aangegeven in NVN 5725 «Bodem – leidraad voor het
      uitvoeren van vooronderzoek bij verkennend, oriënterend en nader onderzoek», uitgave 1999, dan wel een door de
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer aangewezen norm;

      oo. warmtekrachtinstallatie: installatie toegerust voor het gelijktijdig opwekken van warmte en kracht waarbij de
      warmte nuttig wordt aangewend;

      pp. Wm-bevoegd gezag: bestuursorgaan dat bevoegd is, onderscheidenlijk zou zijn, een Wm-vergunning
      te verlenen voor een glastuinbouwbedrijf of een akkerbouw- of tuinbouwbedrijf met open grondteelt
      waarop het [Besluit akkerbouwbedrijven milieubeheer][ref15] niet van toepassing is in verband met
      [artikel 1, onder a, onder 11°, van dat besluit][ref16];

      qq. Wm-vergunning: vergunning als bedoeld in [artikel 8.1, eerste lid, van de Wet milieubeheer][ref17];

      rr. woning: een gebouw of gedeelte van een gebouw, dat voor bewoning wordt gebruikt of daartoe is
      bestemd, met uitzondering van een dienst- of bedrijfswoning behorende bij een inrichting als bedoeld in
      [artikel 2 onder a][ref18];

      ss. Wvo-vergunning: vergunning als bedoeld in
      [artikel 1, eerste of derde lid, van de Wet verontreiniging oppervlaktewateren][ref19];

      tt. Wvo-bevoegd gezag: bestuursorgaan dat bevoegd is, onderscheidenlijk zou zijn, een Wvo-vergunning te verlenen
      voor het lozen ten gevolge van glastuinbouwactiviteiten;

      uu. zeer licht ontvlambare stof: stof die of preparaat dat in vloeibare toestand (K0-vloeistof) met een vlampunt
      van minder dan 0°C en een kookpunt van 35°C of minder, alsmede gasvormige stof die of gasvormig preparaat dat, bij
      normale temperatuur en druk aan de lucht blootgesteld, kan ontbranden.

      2 Voor de toepassing van [artikel 2, onder e][ref20], en [bijlage 3][ref21], wordt het aantal inwonerequivalenten
      van een lozing van huishoudelijk afvalwater berekend door:

      a. het aantal kubieke meters gebruikt water per 365 dagen te vermenigvuldigen met de factor 0,023 of

      b. het aantal mandagen per 365 dagen te vermenigvuldigen met de factor 0,001.

      3 Dit besluit berust mede op de [artikelen 78 tot en met 80 van de Wet gewasbeschermingsmiddelen en biociden][ref22].


