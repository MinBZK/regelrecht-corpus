  - number: '4'
    text: |-
      1 De voorschriften, opgenomen in [bijlagen 1][ref1] en [2][ref2], gelden voor een ieder die een
      glastuinbouwbedrijf type B drijft.

      2 De voorschriften, opgenomen in [bijlage 3][ref3], gelden voor een ieder die loost type II vanuit een
      glastuinbouwbedrijf type B.

      3 De voorschriften, opgenomen in [bijlage 2][ref4], zijn niet van toepassing op drukapparatuur, samenstellen en
      druksystemen waarop het [Warenwetbesluit drukapparatuur](onbekend) van toepassing is, voorzover de voorschriften
      betrekking hebben op het ontwerp, de vervaardiging, de overeenstemmingsbeoordeling, de ingebruikneming en het
      gebruik bedoeld in dat besluit.

      3 De voorschriften opgenomen in [bijlage 1][ref5], voor zover zij betrekking hebben op meststoffen, gelden niet
      indien geen emissie van meststoffen naar bodem, lucht of oppervlaktewater plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430
      [ref2]: https://wetten.overheid.nl/BWBR0013430
