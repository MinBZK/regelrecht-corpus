  - number: '7'
    text: |-
      1 Degene die een glastuinbouwbedrijf type B opricht, meldt dit ten minste acht weken voor de oprichting aan het Wm-
      bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een glastuinbouwbedrijf
      type B en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding
      overeenkomstig dit artikel is gedaan en door dit uitbreiden, wijzigen of veranderen van de werking van het
      glastuinbouwbedrijf geen afwijking ontstaat van de bij die melding eerder verstrekte gegevens.

      3 Bij een melding wordt vermeld:

      a. het adres van het glastuinbouwbedrijf;

      b. de naam en het adres van degene die het glastuinbouwbedrijf opricht dan wel verandert of de werking daarvan
      verandert, en, indien dat iemand anders is, van degene die het glastuinbouwbedrijf drijft of zal drijven;

      c. de aard en omvang van de activiteiten of processen in het glastuinbouwbedrijf;

      d. de indeling en de uitvoering van het glastuinbouwbedrijf;

      e. het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking verwezenlijkt zal zijn;

      f. de aard, omvang en frequentie van de transportactiviteiten en

      g. de plaats waar wordt geladen en gelost en

      h.

      4 Bij de melding worden voorts gevoegd

      a. een rapport van een onderzoek naar de nulsituatie van de bodem, gericht op het in beeld brengen van de toestand
      van de bodem voor het tijdstip waarop het glastuinbouwbedrijf of de verandering daarvan in werking is gebracht, dan
      wel de verandering van de verwerking is verwezenlijkt. Het onderzoek naar de nulsituatie richt zich uitsluitend op
      de stoffen die door de werkzaamheden ter plaatse een bedreiging voor de bodemkwaliteit vormen, en op de plaatsen
      waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden;

      b. een rapportage van een vooronderzoek. Het vooronderzoek richt zich op de gehele inrichting.

      5 Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het
      bevoegd gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.

      6 De in het derde en vierde lid vermelde gegevens behoeven niet te worden verstrekt, indien degene die het
      glastuinbouwbedrijf type B drijft, deze gegevens reeds aan het Wm-bevoegd gezag heeft verschaft en het Wm-bevoegd
      gezag over die gegevens beschikt.

      7 Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het Wm-
      bevoegd gezag heeft verschaft.

      8 Bij de melding overeenkomstig [artikel 5, tweede lid][ref1], worden aan het Wm-bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de toe te passen andere middelen een ten minste gelijkwaardige bescherming voor het milieu
      wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel5
    url: https://wetten.overheid.nl/BWBR0013430/2008-06-01#Artikel7
