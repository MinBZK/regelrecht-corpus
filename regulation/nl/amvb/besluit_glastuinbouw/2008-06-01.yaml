  - number: '16'
    text: |-
      1 Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds is opgericht en
      voor dat bedrijf onmiddellijk voor dat tijdstip geen Wm-vergunning in werking en onherroepelijk was of geen melding
      was gedaan krachtens het Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, meldt degene die de inrichting
      drijft, aan het Wm-bevoegd gezag dat hij de inrichting in werking heeft.

      2 De melding, bedoeld in het eerste lid, geschiedt ten hoogste twaalf weken na het tijdstip waarop dit besluit in
      werking treedt. Artikel 7, derde tot en met zesde lid, is van overeenkomstige toepassing op een melding als bedoeld
      in het eerste lid.

      3 Indien op het tijdstip waarop dit besluit in werking treedt, een glastuinbouwbedrijf type B reeds
      is opgericht en voor dat bedrijf onmiddellijk voor dat tijdstip een melding was gedaan krachtens het
      Besluit tuinbouwbedrijven met bedekte teelt milieubeheer, legt degene die het glastuinbouwbedrijf drijft,
      ten hoogste twaalf weken na het tijdstip waarop dit besluit in werking treedt, de gegevens, bedoeld in
      [artikel 7, derde lid, onderdelen f en g, en vierde lid][ref1], over aan het Wm-bevoegd gezag. Artikel 7, vijfde en
      zesde lid, is van overeenkomstige toepassing.

      4 Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten
      van een glastuinbouwbedrijf type B is ingediend en dit besluit op de inrichting van toepassing is of zal zijn,
      zijn het eerste en tweede lid, niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding
      overeenkomstig [artikel 7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013430#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013430#Artikel7
