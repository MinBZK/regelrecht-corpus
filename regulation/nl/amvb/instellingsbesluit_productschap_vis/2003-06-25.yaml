preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 28 maart 2003, Directie
    Arbeidsverhoudingen, Nr. AV/CAM/2003/14891, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij
    en Onze Minister van Economische Zaken;

    Gelet op artikel 67, 70, 70A, 73, 76, eerste lid, 102, tweede lid en 126, derde lid van de Wet op de
    Bedrijfsorganisatie;

    De Raad van State gehoord (advies van 24 april 2003, nr. W12.03.0122/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 22 mei 2003, Directie
    Arbeidsverhoudingen, nr. AV/CAM/2003/35026 uitgebracht mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet op de bedrijfsorganisatie][ref1];

      b. het productschap: het Productschap Vis;


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: '2'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. vis: vissen, schaal- en schelpdieren, delen van vissen alsmede van schaal- en schelpdieren en puf en nest, een
      en ander met uitzondering van sier- en aquariumdieren;

      b. visserij: het bedrijf van het vangen of kweken van vissen, schaal- en schelpdieren en puf en nest, een en ander
      met uitzondering van sier- en aquariumdieren.

      2 In dit besluit wordt onder handel mede de werkzaamheid van tussenpersonen verstaan.

      3 In dit besluit wordt onder handel niet de doorvoer- en driehoekshandel verstaan.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel2
  - number: '3'
    text: |-
      1 Er is een Productschap Vis.

      2 Het productschap is ingesteld voor de ondernemingen waarin:

      a. de visserij wordt uitgeoefend;

      b. vis wordt be- of verwerkt tot producten, welke, al dan niet na verdere be- of verwerking, tot menselijk of
      dierlijk voedsel kunnen dienen;

      c. de handel wordt uitgeoefend in vis of uit vis verkregen producten, welke, al dan niet na verdere be- of
      verwerking, tot menselijk voedsel kunnen dienen.

      3 Als ondernemingen, bedoeld in het tweede lid van dit artikel, worden mede aangemerkt de veilingen van de in dat
      lid bedoelde producten.

      4 Het productschap is gevestigd te Rijswijk.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel3
  - number: '4'
    text: |-
      Het bestuur van het productschap bestaat uit 26 leden. Hiervan worden benoemd:

      a. voor ondernemingen op het gebied van de visserij: acht leden door organisaties van ondernemers;

      b. voor ondernemingen op het gebied van de visafslagen: een lid door organisaties van ondernemers;

      c. voor ondernemingen op het gebied van de be- of verwerking van en de groothandel in vis en met die handel
      verwante bedrijven, alsmede de groothandel en de werkzaamheid van tussenpersonen in visconserven: zeven leden door
      organisaties van ondernemers;

      d. voor organisaties op het gebied van de detailhandel in vis en visproducten: twee leden door organisaties van
      ondernemers; en

      e. voor elk van de in dit artikel bedoelde ondernemingen: acht leden door organisaties van werknemers.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel4
  - number: '5'
    text: |-
      Het productschap is bevoegd tot regeling of nadere regeling van de in [artikel 93, tweede lid, van de wet][ref1]
      vermelde onderwerpen of onderdelen daarvan, met uitzondering van onderdeel d: lonen en andere arbeidsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
  - number: '6'
    text: |-
      Bij een op grond van [artikel 93, tweede lid, van de wet][ref1] vastgestelde verordening kan worden bepaald dat
      deze mede andere dan de in [artikel 102, eerste lid, van de wet][ref2] bedoelde natuurlijke en rechtspersonen
      bindt, voorzover deze handelingen verrichten die bedrijfsmatig in de ondernemingen waarvoor het productschap is
      ingesteld, plegen te worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '102'
  - number: '7'
    text: |-
      1 Het productschap legt een heffing als bedoeld in [artikel 126, eerste lid van de wet][ref1] op, gebaseerd op
      een grondslag die het bestuur van het productschap passend acht, waarbij het tarief voor verschillende in de
      heffingsverordening aangewezen groepen van ondernemingen verschillend kan zijn. Boven of in de plaats van een
      zodanige heffing kan een bedrag worden geheven dat voor alle ondernemingen of groepen daarvan gelijk is.

      2 Heffingen waarvan de opbrengst een bijzondere bestemming heeft, kunnen worden opgelegd gebaseerd op een grondslag
      die het bestuur van het productschap in verband met die bestemming passend acht.

      3 Bij de heffingsverordening kan worden bepaald dat voor daarbij aan te wijzen groepen van ondernemingen, ten
      aanzien waarvan zich bijzondere omstandigheden voordoen, de heffing op andere wijze wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
  - number: '8'
    text: |-
      1 Het bij verordening van de Sociaal-Economische Raad van 19 mei 1995 ingestelde Productschap Vis wordt opgeheven.

      2 Verordeningen en andere besluiten die zijn vastgesteld door het bij verordening van de Sociaal-Economische
      Raad van 19 mei 1995 ingestelde Productschap Vis blijven van kracht tot de datum waarop de door het productschap
      vastgestelde verordeningen en andere besluiten terzake in werking zullen treden.

      3 Het personeel, de rechten, de verplichtingen, de vermogensbestanddelen en de archiefbescheiden van het bij
      verordening van de Sociaal-Economische Raad van 19 mei 1995 ingestelde Productschap Vis, gaan over naar het
      productschap.

      4 Wettelijke procedures en rechtsgedingen, ingesteld door of tegen het bij verordening van de Sociaal-Economische
      Raad van 19 mei 1995 ingestelde Productschap Vis worden geacht te zijn ingesteld door of tegen het productschap.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel8
  - number: '9'
    text: |-
      De bestuursleden en hun plaatsvervangers van wie de zittingsperiode ingaat op de datum van inwerkingtreding van dit
      besluit, treden af op 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel9
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Productschap Vis.'
    url: https://wetten.overheid.nl/BWBR0015163/2003-06-25#Artikel11
