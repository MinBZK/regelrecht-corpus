---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: inkomstenbesluit_burgerlijke_ambtenaren_defensie
regulatory_layer: AMVB
publication_date: '2025-01-16'
valid_from: '2021-01-01'
bwb_id: BWBR0018191
url: https://wetten.overheid.nl/BWBR0018191/2021-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 19 januari 2005, nr. P/2004013819;

    Gelet op artikel 12 van de Militaire Ambtenarenwet 1931 en de artikelen 125, 125c en 134, eerste lid, van de
    Ambtenarenwet;

    De Raad van State gehoord (advies van 17 maart 2005, nr. W07.05.0014/II);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 5 april 2005, nr. P/2005005542;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.a
    text: '*ambtenaar:* degene die bij het Ministerie van Defensie in burgerlijke openbare dienst is aangesteld;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.b
    text: '*Onze Minister:* Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.c
    text: '*hoofd defensieonderdeel:*'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.c.1°
    text: de secretaris-generaal, voor zover het betreft de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.c.2°
    text: |-
      de Commandant Zeestrijdkrachten, de Commandant Landstrijdkrachten, de Commandant Luchtstrijdkrachten, de Commandant
      Koninklijke Marechaussee, voor het desbetreffende commando;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.c.3°
    text: |-
      de directeur Defensie Materieel Organisatie, voor zover het betreft de Defensie Materieel Organisatie, met
      uitzondering van het deel ondergebracht in de Bestuursstaf;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.c.4°
    text: de commandant Commando DienstenCentra, voor zover het betreft het Commando DienstenCentra;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.d
    text: '*commandant:* een bij ministeriële regeling aangewezen autoriteit;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.e
    text: |-
      *salaris:* het bedrag, dat in de [bijlage A][ref1] wordt gevonden in de voor de ambtenaar geldende
      salarisschaal en salarisnummer, in voorkomend geval verhoogd met de aanvulling op het salaris, bedoeld in
      [artikel 4 van het Besluit personenchauffeurs defensie][ref2], of het bedrag, dat wordt gevonden met toepassing
      van [bijlage B][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018191
      [ref2]: https://wetten.overheid.nl/BWBR0010280#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018191
      - id: ref2
        bwb_id: BWBR0010280
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0018191
  - number: 1.f
    text: '*salaris per uur:* 1/165 deel van het salaris bij een voltijdaanstelling;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.g
    text: |-
      *salarisschaal:* een als zodanig in de [bijlage A][ref1] vermelde reeks van genummerde salarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: 1.h
    text: |-
      *salarisnummer:* een aanduiding, bestaande uit een getal of uit een letter en een getal, dat in een salarisschaal
      voor een salaris is vermeld;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.i
    text: '*maximumsalaris:* het hoogste bedrag van een salarisschaal;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.j
    text: |-
      *bezoldiging:* de som van het salaris en de toelagen waarop de ambtenaar ingevolge [hoofdstuk 3][ref1] van dit
      besluit aanspraak heeft, in voorkomend geval vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '3'
  - number: 1.j.1°
    text: |-
      aanspraken op grond van [artikel 62][ref1], indien en voor zover de minister dit bepaalt,


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel62
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '62'
        hoofdstuk: '9'
  - number: 1.j.2°
    text: |-
      aanspraken op grond van [artikel 51][ref1] voor zover deze tot de bezoldiging worden gerekend, en


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel51
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '51'
        hoofdstuk: '6'
  - number: 1.j.3°
    text: |-
      de vaste toelage onregelmatige dienst en de consignatietoelage, bedoeld in de [artikelen 5][ref1] en
      [6 van het Besluit personenchauffeurs defensie][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010280#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010280#Artikel6
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010280
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010280
        artikel: '6'
  - number: 1.k
    text: '*inkomsten:* alle bedragen waarop de ambtenaar aanspraak maakt bij of krachtens dit besluit;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.l
    text: |-
      *functie:* het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen hem
      door de autoriteit, bedoeld in [artikel 8 van het Burgerlijk ambtenarenreglement defensie][ref1], is opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '8'
  - number: 1.m
    text: '*voltijdaanstelling:* een aanstelling met een arbeidsduur van achtendertig uur per week;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.n
    text: '*deeltijdaanstelling:* een aanstelling met een arbeidsduur van minder dan achtendertig uur per week;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
  - number: 1.o
    text: |-
      *arbeidsduur:* de arbeidsduur, bedoeld in
      [artikel 30a, onderdeel d, van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30a
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30a
  - number: 1.p
    text: |-
      *rooster:* het rooster, bedoeld in [artikel 30a, onderdeel c, van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30a
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30a
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op de ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
  - number: 2.1.a
    text: |-
      wiens bezoldiging is geregeld bij wet of bij een algemene maatregel van bestuur tot regeling van de bezoldiging van
      leden van raden, besturen en commissies;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
  - number: 2.1.b
    text: die in burgerlijke openbare dienst is aangesteld om als geestelijk verzorger bij de krijgsmacht werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
  - number: 2.1.c
    text: |-
      die ingevolge [artikel 12c, eerste lid, van de Wet ambtenaren defensie][ref1] in verband met de werkzaamheden die
      voortvloeien uit een functie in een publiekrechtelijk college, waarin hij is benoemd of verkozen, tijdelijk is
      ontheven van de waarneming van zijn ambt, met uitzondering van [artikel 32][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel32
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '32'
        hoofdstuk: '5'
  - number: 2.1.d
    text: |-
      die op grond van [artikel 7, tweede lid, onderdeel g, van het Burgerlijk ambtenarenreglement defensie][ref1] is
      aangesteld voor het verrichten van enkele diensten, met uitzondering van [artikel 34][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel34
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '34'
        hoofdstuk: '5'
  - number: 2.1.e
    text: indien hem buitengewoon verlof zonder behoud van bezoldiging is verleend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      Op de ambtenaar die is aangesteld in de functie van tandarts en die hoofdzakelijk is belast met de curatieve
      tandheelkundige zorg, zijn uitsluitend van toepassing:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
  - number: 2.2.a
    text: |-
      de [hoofdstukken 1][ref1], [4][ref2], [5][ref3], [7][ref4], [8][ref5] en [9][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk8
      [ref6]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018191
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0018191
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0018191
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0018191
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0018191
        hoofdstuk: '9'
  - number: 2.2.b
    text: |-
      uit [hoofdstuk 2][ref1]: het salaris burgertandarts, bedoeld in [artikel 13][ref2], [14][ref3] en [15][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0018191#Artikel15
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '13'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '14'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0018191
        artikel: '15'
        hoofdstuk: '2'
  - number: 2.2.c
    text: |-
      uit [hoofdstuk 3][ref1]: de toelage hoofd tandheelkundig centrum, bedoeld in [artikel 19][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel19
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '19'
        hoofdstuk: '3'
  - number: 2.2.d
    text: |-
      [hoofdstuk 6][ref1], met uitzondering van [artikel 49][ref2] en [50][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel50
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018191
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '49'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '50'
        hoofdstuk: '6'
  - number: '3'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden, als bedoeld in
      [artikel 1, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], tijdelijk afwijken van hetgeen
      bij of krachtens dit besluit is bepaald, indien en voor zolang dit met het oog op de goede uitvoering van de
      operationele taken van de krijgsmacht noodzakelijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel1
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '1'
  - number: '4.1'
    text: Tenzij anders bepaald, berust de bevoegdheid tot het toekennen van een aanspraak bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de bevoegdheid tot het toekennen van een aanspraak berust bij de commandant, worden aanspraken die de
      commandant betreffen, toegekend door het hoofd defensieonderdeel.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel4
  - number: '4.3'
    text: |-
      De bevoegdheid tot het toekennen van aanspraken op grond van de [artikelen 10][ref1], [11][ref2], [45][ref3],
      [46][ref4] en [47][ref5] aan ambtenaren bezoldigd volgens salarisschaal 14 en hoger berust bij de Secretaris-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0018191#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0018191#Artikel47
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '45'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0018191
        artikel: '46'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0018191
        artikel: '47'
        hoofdstuk: '6'
  - number: '5.1'
    text: De aanspraak op bezoldiging vervalt met ingang van de dag na het ontslag of het overlijden van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel5
  - number: '5.2'
    text: Een toegekende aanspraak wordt beëindigd, zodra de gronden, waarop deze werd toegekend niet meer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien het salaris, een maandelijkse toelage, toeslag of vergoeding dan wel een maandelijks verschuldigd bedrag
      moet worden berekend over een gedeelte van een kalendermaand, wordt het bedrag per dag vastgesteld door een
      maandbedrag te delen door dertig.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel6
  - number: '6.2'
    text: Tenzij anders vermeld, worden de inkomsten maandelijks uitbetaald.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Voor de berekening van het pensioengevend inkomen worden aanspraken op grond van dit besluit vermenigvuldigd met
      een factor 1/1,019 met inachtneming van een maximale vermindering van het pensioengevend inkomen van € 65,92 per
      maand.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister bepaalt de salarisschaal die voor de ambtenaar van toepassing is, welke, tenzij zijn wijze van
      functioneren zich nog daartegen verzet, wordt bepaald met in achtneming van de zwaarte van zijn functie en van
      bijzondere regelingen als bedoeld in [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel18
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '18'
  - number: '8.2'
    text: |-
      De zwaarte van de functie wordt gewaardeerd binnen de in [bijlage A][ref1] van dit besluit aangegeven
      indelingsstructuur, met inachtneming van het door Onze Minister vastgestelde normeringstelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '8.3'
    text: |-
      Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie vervult, blijft de voordien voor hem
      geldende salarisschaal van toepassing.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
  - number: '8.4'
    text: |-
      Anders dan bij wijze van disciplinaire straf als bedoeld in het [Burgerlijk ambtenarenreglement defensie][ref1] kan
      zonder voorafgaand ontslag voor een ambtenaar geen lagere salarisschaal van toepassing worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: '8.5'
    text: 'Het vierde lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
  - number: 8.5.a
    text: |-
      bij de bepaling van de salarisschaal, bedoeld in het eerste lid, tevens is bepaald dat de functie van de ambtenaar
      een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
  - number: 8.5.b
    text: |-
      de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst in een
      andere functie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
  - number: '8.6'
    text: |-
      In afwijking van het eerste lid geschiedt het aan de ambtenaar toekennen van salarisschaal 15 of hoger bij
      Koninklijk Besluit.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het hoofd defensieonderdeel stelt de ambtenaar in kennis van de voorgenomen functiewaardering als bedoeld in
      [artikel 8, tweede lid][ref1]. De ambtenaar die bedenkingen heeft tegen de functiewaardering kan die bedenkingen
      aan het hoofd defensieonderdeel kenbaar maken. Na een heroverweging stelt het hoofd defensieonderdeel de
      functiewaardering al dan niet gewijzigd vast. De ambtenaar kan tegen deze heroverweging bezwaar maken. In een
      dergelijk geval wint het hoofd defensieonderdeel, naar regels bij ministeriële regeling te stellen, het advies in
      van de Commissie van advies bezwaren functiewaardering.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '8'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      Het eerste lid is niet van toepassing indien voor de ambtenaar een bijzondere regeling geldt als bedoeld in
      [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel18
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '18'
  - number: '10.1'
    text: |-
      De commandant kent de in [artikel 8][ref1] bedoelde ambtenaar bij aanstelling het salaris toe, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '8'
        hoofdstuk: '2'
  - number: 10.1.a
    text: |-
      wanneer hij 22 jaar of ouder is, in de voor hem van toepassing zijnde salarisschaal is vermeld achter het
      salarisnummer 0;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel10
  - number: 10.1.b
    text: |-
      wanneer hij jonger dan 22 jaar is, in de voor hem van toepassing zijnde salarisschaal is vermeld achter het
      salarisnummer, bestaande uit de letter J en het getal, dat overeenkomt met zijn leeftijd. Indien het salarisnummer
      niet voorkomt, wordt de ambtenaar het laagste salaris in de schaal toegekend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel10
  - number: '10.2'
    text: |-
      De commandant kan, ingeval daartoe naar zijn oordeel aanleiding bestaat, afwijken van het eerste lid door het
      toekennen van een hoger salaris.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het salaris van de ambtenaar wordt verhoogd tot het in de schaal naasthogere bedrag, indien hij naar het oordeel
      van de commandant zijn functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het salaris van de ambtenaar kan worden verhoogd tot een in de schaal hoger vermeld bedrag, indien hij naar het
      oordeel van de commandant zijn functie zeer goed of uitstekend vervult.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de ambtenaar zijn functie naar het oordeel van de commandant niet naar behoren vervult, blijft
      salarisverhoging achterwege.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '11.4'
    text: 'De in het eerste en tweede lid bedoelde salarisverhoging wordt toegekend:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: 11.4.a
    text: |-
      wanneer de ambtenaar 22 jaar of ouder is en het maximumsalaris van de voor hem van toepassing zijnde salarisschaal
      nog niet heeft bereikt, voor de eerste maal met ingang van de eerste dag van de maand, waarin sinds zijn
      aanstelling een jaar is verstreken en nadien telkens na één jaar;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: 11.4.b
    text: wanneer de ambtenaar jonger dan 22 jaar is, met ingang van de eerste dag van de maand, waarop zijn verjaardag valt.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '11.5'
    text: |-
      Het tijdstip waarop ingevolge het vierde lid, onderdeel a, een salarisverhoging wordt toegekend kan worden
      vervroegd indien daartoe naar het oordeel van de commandant aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '11.6'
    text: |-
      Indien de in het vierde lid, onderdeel a, bedoelde ambtenaar reeds voor zijn 22e verjaardag was aangesteld, wordt,
      onverlet het in het vijfde lid bepaalde, de salarisverhoging toegekend met ingang van de eerste dag van de maand
      waarin zijn verjaardag valt.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het salaris van de ambtenaar met een deeltijdaanstelling wordt vastgesteld op een evenredig deel van het salaris
      bij een voltijdaanstelling.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel12
  - number: '12.2'
    text: |-
      Het salaris van de ambtenaar die is aangesteld op grond van
      [artikel 7, tweede lid, onderdeel f, van het Burgerlijk ambtenarenreglement defensie][ref1], wordt, met
      inachtneming van het bepaalde in [artikel 8, derde lid][ref2], vastgesteld op een bedrag per uur dat daadwerkelijk
      dienst wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '8'
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      In dit artikel en in de [artikelen 14][ref1], [15][ref2] en [19][ref3] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel19
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '14'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '15'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '19'
        hoofdstuk: '3'
  - number: 13.1.a
    text: |-
      *tandarts:* de ambtenaar bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel2
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '2'
        hoofdstuk: '1'
  - number: 13.1.b
    text: |-
      *hoofd tandheelkundige dienst:* het hoofd tandheelkundige dienst zeemacht, de tandheelkundige autoriteit landmacht
      en de staf tandarts luchtmacht;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: 13.1.c
    text: |-
      *werkdag en werkuur:* een dag respectievelijk een uur waarop de tandarts dienst moet verrichten volgens het voor
      hem vastgestelde rooster;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: 13.1.d
    text: |-
      *tandheelkundig centrum:* een onderdeel of afdeling, voornamelijk belast met de curatieve tandheelkundige zorg
      voor militairen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '13.2'
    text: |-
      De tandarts draagt zorg voor de registratie van iedere tandheelkundige verrichting in het voorgeschreven
      geautomatiseerde tandheelkundig informatiesysteem, na voltooiing van de desbetreffende verrichting. Deze
      verrichtingen worden gewaardeerd op een aantal punten conform de uniforme particuliere tarieven als vastgesteld
      door de Nederlandse Zorgautoriteit. Het totaal van de aldus geregistreerde punten exclusief tandtechniek gedurende
      een kalenderjaar vormt de gerealiseerde omzet in dat jaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      De maximaal in een jaar te behalen omzet wordt als volgt bepaald: bij een voltijdaanstelling van 254 roosterdagen
      per jaar worden 190 werkdagen berekend. Per werkdag worden zeven werkuren aan verrichtingen en één werkuur aan niet
      declareerbare patiëntgebonden administratieve werkzaamheden besteed. Een werkuur wordt gewaardeerd op gemiddeld 20
      punten, waardoor een maximale jaaromzet wordt vastgesteld op 26.600 punten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '13.4'
    text: |-
      Door het hoofd tandheelkundige dienst wordt in overleg met de tandarts een raming van de omzet over een
      kalenderjaar vastgesteld, te bepalen in een aantal te behalen punten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '13.5'
    text: |-
      De tandarts met een voltijdaanstelling dient zodanig te presteren dat de krachtens het tweede lid bepaalde
      jaaromzet per kalenderjaar ten minste 11.818 punten bedraagt. Bij een deeltijdaanstelling wordt deze jaaromzet
      teruggerekend in verhouding naar het aantal uren van de deeltijdaanstelling.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '13.6'
    text: |-
      Het hoofd defensieonderdeel kent aan de tandarts het maandsalaris toe, dat bij een voltijdaanstelling van
      254 roosterdagen per jaar wordt bepaald aan de hand van de geraamde jaaromzet, met toepassing van de in
      [bijlage B][ref1] opgenomen tabel. Het maandsalaris wordt tot de definitieve afrekening beschouwd als een
      voorschotbetaling.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '13.7'
    text: |-
      Bij een deeltijdaanstelling wordt de te behalen omzet herleid tot de omzet behorende bij een voltijdaanstelling.
      Aan de hand van deze gecorrigeerde omzet wordt het maandsalaris bepaald, met toepassing van de in
      [bijlage B][ref1] opgenomen tabel. Dit maandsalaris wordt teruggerekend in verhouding naar het aantal uren van
      de deeltijdaanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '13.8'
    text: |-
      Mede op grond van de realisatie van de omzet in enig kalenderjaar wordt uiterlijk in de maand december van dat jaar
      door het hoofd tandheelkundige dienst in overleg met de tandarts voor het aankomende kalenderjaar een nieuwe raming
      van de omzet en het daarbij behorende maandsalaris vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel13
  - number: '14.1'
    text: |-
      Na afloop van het kalenderjaar wordt de totale realisatie van de omzet van de tandarts door zorg van het hoofd
      tandheelkundige dienst getoetst aan de raming van de omzet. Het vaststellen van het bijbehorende salaris geschiedt
      aan de hand van de in [bijlage C][ref1] opgenomen tabel.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018191
  - number: '14.2'
    text: |-
      Indien de maximale omzet werd geraamd en er meer dan het maximum werd gerealiseerd vindt geen nabetaling van
      salaris plaats.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.3'
    text: |-
      Indien een omzet werd geraamd, die lager is dan de maximale omzet, en er vervolgens meer is gerealiseerd dan
      geraamd, volgt suppletie van het te weinig betaalde salaris tot ten hoogste het maximum salarisbedrag.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.4'
    text: |-
      Indien er minder omzet is gerealiseerd dan geraamd wordt na toepassing van het zesde lid het te veel betaalde
      salaris teruggevorderd. De terugvordering vindt plaats in het volgende kalenderjaar in twaalf gelijke
      maandtermijnen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.5'
    text: |-
      Het bedrag van de terugvordering dan wel van de suppletie behoort tot de grondslag voor de berekening van de
      vakantie-uitkering en de eindejaarsuitkering.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.6'
    text: |-
      Het aantal werkdagen van het afgesloten kalenderjaar wordt vastgesteld door het aantal van 254 roosterdagen te
      verminderen met het daadwerkelijke aantal dagen van afwezigheid. Indien het aantal werkdagen op jaarbasis minder
      bedraagt dan 190 dan wel het deeltijdaantal daarvan, kan de gerealiseerde jaaromzet lager uitvallen dan geraamd.
      Indien het verminderde aantal werkdagen aantoonbaar is en bovendien buiten de schuld van de tandarts is ontstaan,
      stelt het hoofd tandheelkundige dienst de gerealiseerde jaaromzet opwaarts bij.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.7'
    text: |-
      Door het hoofd tandheelkundige dienst wordt onder meer in de volgende gevallen het verminderd aantal werkdagen
      opwaarts bijgesteld:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.a
    text: langdurige ziekte;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.b
    text: buitengewoon verlofdagen;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.c
    text: |-
      het werken zonder assistentie ondanks inspanning om in vervanging te voorzien, waardoor de tandarts een geringere
      dagomzet realiseert;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.d
    text: |-
      meer dan gemiddeld aantal niet verschenen patiënten, mits de tandarts aantoonbare actie heeft ondernomen ter
      voorkoming van het niet op de afspraak verschijnen van patiënten;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.e
    text: meer dan gemiddeld aantal onderhoud- en reparatiewerkzaamheden aan de tandheelkundige installatie;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.f
    text: tijdelijke afname van het patiëntenbestand, bijvoorbeeld ten gevolge van uitzending;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: 14.7.g
    text: deelname aan overleg- of projectgroepen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '14.8'
    text: |-
      In afwijking van de vorige leden geldt voor de tandarts, die de leeftijd van 60 jaar heeft bereikt, dat
      terugbetaling in geval van het niet realiseren van de geraamde omzet achterwege blijft indien de gerealiseerde
      omzet minder dan 5% lager is dan de geraamde omzet. Indien het verschil tussen de geraamde en de gerealiseerde
      omzet meer bedraagt dan 5%, vindt terugbetaling uitsluitend over het meerdere plaats.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel14
  - number: '15.1'
    text: |-
      Bij aanstelling van een tandarts vindt op grond van zijn werkervaring door het hoofd tandheelkundige dienst
      inschaling plaats door het vaststellen van een geraamde omzet en het bijbehorende maandsalaris. In het eerste jaar
      van de aanstelling wordt telkens na een periode van drie maanden de realisatie aan de geraamde omzet getoetst.
      Op grond van deze toetsing wordt indien nodig opnieuw de raming van de omzet en het bijbehorende maandsalaris
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel15
  - number: '15.2'
    text: |-
      De [artikelen 30da tot en met 30dd van het Burgerlijk ambtenarenreglement defensie][ref1] met betrekking tot de
      flexibilisering van de arbeidsduur zijn van toepassing op de tandarts. Voor de tandarts die niet de maximaal te
      realiseren omzet behaalt, wordt de met de verkorting of verlenging behaalde omzet herleid tot de normaal te behalen
      omzet. Op het bijbehorende maandsalaris wordt dan de korting of de toeslag toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30da
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30da
  - number: '16.1'
    text: |-
      Het hoofd defensieonderdeel kent een toelage minimumloon toe aan de ambtenaar, wiens salaris minder is dan
      het maandbedrag van het minimumloon, dat krachtens de [artikelen 7][ref1], [8, eerste en derde lid][ref2], en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref3], geldt voor werknemers van dezelfde leeftijd als de
      ambtenaar. Het bedrag van de toelage per maand is gelijk aan het verschil tussen het bedoelde minimumloon en het
      salaris van de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '16.2'
    text: |-
      Voor de ambtenaar met een deeltijdaanstelling is het bedrag van de toelage gelijk aan het verschil tussen het naar
      evenredigheid van de deeltijd berekende minimumloon en het salaris van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel16
  - number: '17.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: 17.1.a
    text: |-
      *waarneming:* het krachtens een daartoe strekkende opdracht van de commandant, tijdelijk verrichten van een
      samenstel van werkzaamheden dat een andere functie vormt dan die van de ambtenaar zelf;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: 17.1.b
    text: |-
      *volledige waarneming:* een zodanige waarneming dat in de plaats van de eigen functie het volledige samenstel van
      werkzaamheden van de waargenomen functie, met de daarmee gepaard gaande verantwoordelijkheden, wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: '17.2'
    text: |-
      De commandant kent, voor de duur van de waarneming, een waarnemingstoelage toe aan de ambtenaar, die bij wijze van
      volledige waarneming tijdelijk een functie vervult, die bij toepassing van [artikel 8, tweede en derde lid][ref1],
      zou leiden tot een hogere salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '8'
        hoofdstuk: '2'
  - number: '17.3'
    text: |-
      De commandant kan, voor de duur van de waarneming, een waarnemingstoelage toekennen aan de ambtenaar,
      die bij wijze van onvolledige waarneming tijdelijk een functie vervult, die bij toepassing van
      [artikel 8, tweede en derde lid][ref1], zou leiden tot een hogere salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel8
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '8'
        hoofdstuk: '2'
  - number: '17.4'
    text: |-
      De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming ten
      minste een tijdvak van dertig dagen beslaat.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: '17.5'
    text: |-
      De ambtenaar voor wie het een onderdeel is van de eigen functie om als plaatsvervanger op te treden van degene
      wiens functie moet worden waargenomen, komt bij onvolledige waarneming van die functie niet in aanmerking voor
      een waarnemingstoelage.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: '17.6'
    text: |-
      Bij volledige waarneming van de functie is het bedrag van de toelage per maand gelijk aan het verschil tussen
      het salaris waarop de ambtenaar aanspraak maakt en het salaris waarop hij aanspraak zou maken, indien de hogere
      salarisschaal met ingang van de dag waarop de waarneming is begonnen voor hem zou hebben gegolden, terwijl het voor
      hem geldende tijdstip waarop regulier een in de schaal naasthoger bedrag wordt toegekend, niet wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: '17.7'
    text: |-
      Bij onvolledige waarneming wordt de toelage door de commandant vastgesteld op 50% van de toelage bij volledige
      waarneming in het desbetreffende geval.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het hoofd defensieonderdeel kan aan de ambtenaar om redenen van werving een maandelijkse wervingstoelage toekennen
      voor de duur van één jaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien naar het oordeel van het hoofd defensieonderdeel sprake is van bijzondere omstandigheden kan de toelage voor
      een bepaalde duur langer dan één jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel18
  - number: '19'
    text: |-
      Het hoofd defensieonderdeel kent een toelage hoofd tandheelkundig centrum toe aan de tandarts die de functie van
      hoofd van één of meer tandheelkundige centra vervult en hierdoor extra werkzaamheden verricht. De toelage bedraagt
      voor iedere maand dat hij deze functie vervult 37,5% van het maximale jaarsalaris, bedoeld in [bijlage C][ref1],
      gedeeld door het aantal roosterdagen van 254, bedoeld in [artikel 13, derde lid][ref2]. Voor de tandarts met een
      deeltijdaanstelling wordt de toelage op een evenredig deel vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018191
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel13
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018191
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '13'
        hoofdstuk: '2'
  - number: '20.1'
    text: |-
      De commandant kent een toelage onregelmatige dienst toe aan de ambtenaar, die anders dan bij wijze van overwerk,
      regelmatig of vrij regelmatig arbeid verricht op andere tijden dan op de dagen maandag tot en met vrijdag tussen
      08.00 uur en 18.00 uur.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      De toelage onregelmatige dienst bedraagt per gewerkt uur een percentage van het voor de ambtenaar geldende salaris
      per uur en wel:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: 20.2.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 06.00 uur en 08.00 uur en tussen 18.00 uur en 22.00 uur;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: 20.2.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 00.00 uur en 06.00 uur en tussen 22.00 uur en 24.00 uur;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: 20.2.c
    text: 45% voor de uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: 20.2.d
    text: 70% voor de uren op zondag;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: 20.2.e
    text: |-
      100% voor de uren op de feestdagen genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1], met dien verstande dat genoemde
      percentages worden berekend over ten hoogste het salaris per uur, dat is afgeleid van het maximumsalaris van
      salarisschaal 7.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '20.3'
    text: |-
      Voor de in het tweede lid, onder a, genoemde morgen- en avonduren wordt de toelage slechts toegekend, indien de
      arbeid is aangevangen vóór 07.00 uur, respectievelijk is beëindigd na 19.00 uur.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: '20.4'
    text: |-
      In afwijking van het bepaalde in het eerste en het tweede lid ontvangt de ambtenaar met ingang van de maand waarin
      hij de leeftijd van 55 jaar bereikt een vaste toelage onregelmatige dienst, mits hij op dat moment gedurende
      ten minste 5 jaar zonder een onderbreking van langer dan twee maanden aanspraak had op een toelage onregelmatige
      dienst.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: '20.5'
    text: |-
      De vaste toelage onregelmatige dienst, bedoeld in het vierde lid, wordt vastgesteld op het bedrag dat de ambtenaar
      over de twaalf kalendermaanden voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per
      maand aanspraak op een toelage onregelmatige dienst had en wordt aangepast aan een algemene salarismaatregel.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel20
  - number: '21.1'
    text: |-
      De commandant kent gedurende een uitkeringsperiode een aflopende toelage onregelmatige dienst toe aan de
      ambtenaar wiens bezoldiging een blijvende verlaging ondergaat als gevolg van het buiten zijn toedoen beëindigen of
      verminderen van de toelage onregelmatige dienst, indien de verlaging tenminste 3% bedraagt van het salaris.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.2'
    text: |-
      De aflopende toelage onregelmatige dienst wordt uitsluitend toegekend, indien de ambtenaar de toelage onregelmatige
      dienst direct voorafgaande aan het tijdstip van de blijvende verlaging van de bezoldiging gedurende tenminste twee
      jaar zonder een onderbreking van langer dan twee maanden heeft genoten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.3'
    text: |-
      De berekeningsbasis voor de aflopende toelage onregelmatige dienst is het bedrag waarop de ambtenaar over de twaalf
      kalendermaanden, voorafgaande aan de datum waarop de blijvende verlaging van zijn bezoldiging intreedt, gemiddeld
      per maand aan toelage onregelmatige dienst aanspraak had, verminderd met het bedrag dat hij daarna in totaal per
      maand aanspraak heeft aan toelage onregelmatige dienst en aan verhogingen van het salaris, anders dan die wegens
      een algemene salarismaatregel.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.4'
    text: |-
      De uitkeringsperiode voor de aflopende toelage onregelmatige dienst is gelijk aan het naar boven op een maand
      afgeronde één vierde gedeelte van de tijd gedurende welke de ambtenaar direct voorafgaande aan het tijdstip van
      de blijvende verlaging van de bezoldiging zonder wezenlijke onderbreking de toelage onregelmatige dienst heeft
      genoten. De uitkeringsperiode is maximaal drie jaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.5'
    text: |-
      De hoogte van de aflopende toelage onregelmatige dienst wordt bepaald door de uitkeringsperiode in drie gelijke
      delen te splitsen, waarbij te beginnen met het eerste deel, afronding naar boven plaatsvindt op een hele maand, met
      dien verstande dat hierdoor de maximale uitkeringsperiode niet wordt overschreden. Gedurende deze drie deelperioden
      bedraagt de toelage achtereenvolgens 75%, 50% en 25% van de voor de desbetreffende maand van toepassing zijnde
      berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.6'
    text: |-
      Indien de blijvende verlaging van de bezoldiging intreedt op de eerste dag van een maand, vangt de toelage op die
      datum aan. Treedt deze verlaging in op een andere dag van de maand, dan gaat de toelage in op de eerste dag van de
      erop volgende maand. In het laatste geval wordt aan de ambtenaar over de maand waarin de blijvende verlaging van
      de bezoldiging intreedt, een aanvulling toegekend op het over die maand toegekende bedrag aan toelage onregelmatige
      dienst, tot het gemiddelde maandbedrag waarop hij hieraan over de twaalf maanden, voorafgaande aan de blijvende
      verlaging van de bezoldiging, aanspraak had.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.7'
    text: Op aanvraag van de ambtenaar kan de aflopende toelage worden uitbetaald als eenmalige uitkering.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '21.8'
    text: |-
      De hoogte van de eenmalige uitkering is gelijk aan het totale bedrag van de aflopende toelage onregelmatige
      dienst die de ambtenaar gedurende de uitkeringsperiode, bedoeld in het vierde lid, zou hebben ontvangen. Voor het
      vaststellen van de berekeningsbasis wordt geen rekening gehouden met verhogingen van het salaris.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel21
  - number: '22.1'
    text: |-
      De commandant kent een verschuivingstoelage toe aan de ambtenaar die krachtens een rooster, anders dan bij wijze
      van overwerk, regelmatig of vrij regelmatig arbeid verricht op andere tijden dan op de dagen van maandag tot
      en met vrijdag tussen 08.00 uur en 18.00 uur, indien hij in opdracht van de commandant arbeid verricht op uren
      die afwijken van dat rooster, voor zover met die uren het totaal van het per werkperiode vastgestelde aantal
      arbeidsuren niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel22
  - number: '22.2'
    text: |-
      Op de verschuivingstoelage bestaat geen aanspraak indien tussen het geven van de opdracht en het verrichten van de
      arbeid meer dan 72 uren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel22
  - number: '22.3'
    text: |-
      De verschuivingstoelage bedraagt voor elk vol uur waarop in afwijking van het rooster arbeid is verricht 40% van
      het voor de ambtenaar geldende salaris per uur, met dien verstande dat dit percentage wordt berekend over ten
      hoogste het salaris per uur, dat is afgeleid van het maximumsalaris van salarisschaal 7.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel22
  - number: '23.1'
    text: |-
      De commandant kent een consignatietoelage toe aan de ambtenaar die buiten de werktijden die voor hem gelden
      krachtens een rooster, ingevolge een schriftelijke opdracht van de commandant zich regelmatig of vrij regelmatig
      bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel23
  - number: '23.2'
    text: |-
      De consignatietoelage bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de ambtenaar
      geldende salaris per uur en wel:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel23
  - number: 23.2.a
    text: 5% voor de uren op maandag tot en met vrijdag;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel23
  - number: 23.2.b
    text: |-
      10% voor de uren op zaterdag en zondag en op de feestdagen genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '23.3'
    text: |-
      Het bedrag van de toelage wordt verdubbeld over de uren waarop aan de opgedragen bereikbaarheid en beschikbaarheid
      een extra plaatsgebondenheid op of rond de plaats van tewerkstelling is verbonden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel23
  - number: '24.1'
    text: |-
      In afwijking van [artikel 20 tot en met 23][ref1] en [artikel 49][ref2] kent de commandant een toelage
      brandweerdiensten defensie toe, wegens extra beslaglegging binnen het voor betrokkene geldende rooster, aan de
      ambtenaar die werkzaam is bij een door Onze Minister aangewezen brandweerdienst van het Ministerie van Defensie
      anders dan in het kader van bedrijfszelfbeschermingsactiviteiten, indien hij gekazerneerd is ten behoeve van
      repressieve brandweertaken en uitrukdiensten en hij 24-uursdiensten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel49
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '20'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '49'
        hoofdstuk: '6'
  - number: '24.2'
    text: |-
      De toelage brandweerdiensten defensie bedraagt per maand 17,05% van het voor de ambtenaar geldende salaris, met
      dien verstande dat genoemd percentage wordt berekend over ten hoogste het maximumsalaris van salarisschaal 7.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien het aantal 24-uursdiensten volgens het rooster bij een brandweerdienst kleiner is dan 122 per jaar, wordt
      de toelage berekend door dat aantal 24-uursdiensten te delen door 122 en de uitkomst te vermenigvuldigen met de
      uitkomst van de in het tweede lid aangegeven berekening.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.4'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde ambtenaar wordt wegens dienstverrichting in het kader van een 24-
      uursdienst buiten het rooster een toeslag extra beslaglegging toegekend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.5'
    text: |-
      De toeslag extra beslaglegging in het kader van een 24-uursdienst buiten het rooster bedraagt voor een 24-
      uursdienst: het salaris per uur, vermenigvuldigd voor de diensten op maandag tot en met vrijdag met een factor
      14, voor de diensten op zaterdag met een factor 16 en voor de diensten op zondag en op feestdagen als bedoeld in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1] met een factor 18.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '24.6'
    text: |-
      In de toeslag extra beslaglegging in het kader van een 24-uursdienst buiten het rooster is een vergoeding voor
      vier uren arbeid, verricht tijdens de periode dat de betrokken ambtenaar zich bereikbaar en beschikbaar moet houden
      teneinde bij oproep arbeid te verrichten, begrepen. Indien het aantal uren actief verrichte arbeid tijdens die
      periode groter is dan vier, wordt het meerdere vergoed op basis van het voor de ambtenaar geldende salaris per uur.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.7'
    text: |-
      De toeslag extra beslaglegging in het kader van een 24-uursdienst buiten het rooster voor een gedeeltelijke 24-
      uursdienst wordt naar rato van het in het vijfde lid bepaalde berekend, waarbij als een halve 24-uursdienst worden
      aangemerkt:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: 24.7.a
    text: acht uren waarop arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: 24.7.b
    text: |-
      zestien uren waarop de ambtenaar zich bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.8'
    text: |-
      Aan de in het eerste lid bedoelde ambtenaar van wie de som van het salaris en de toelage brandweerdiensten defensie
      een blijvende verlaging ondergaat als gevolg van het buiten zijn toedoen beëindigen van die toelage, wordt een
      aflopende toelage toegekend, mits direct voorafgaande aan het tijdstip van de beëindiging gedurende ten minste twee
      jaren zonder onderbreking van langer dan twee maanden aanspraak bestond op de toelage brandweerdiensten defensie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.9'
    text: |-
      De aflopende toelage bedraagt gedurende de eerste drie maanden 100% van het in het tweede lid bedoelde bedrag, en
      vervolgens één maand 75%, één maand 50% en één maand 25% van dat bedrag.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.10'
    text: |-
      In afwijking van het bepaalde in het achtste en negende lid wordt aan de in het eerste lid bedoelde ambtenaar van
      50 jaar of ouder, van wie de som van het salaris en de toelage brandweerdiensten defensie een verlaging ondergaat,
      als gevolg van het buiten diens toedoen beëindigen van die toelage, een vaste toelage toegekend ter hoogte van het
      oorspronkelijke bedrag, mits hij de toelage brandweerdiensten defensie direct voorafgaande aan het tijdstip van
      vorenbedoelde beëindiging gedurende ten minste tien jaren zonder onderbreking van langer dan twee maanden heeft
      genoten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.11'
    text: |-
      De aflopende toelage wordt, wanneer de ambtenaar de leeftijd van 50 jaar bereikt en hij, onmiddellijk voor de
      aanvang van de aflopende toelage, gedurende ten minste tien jaren zonder onderbreking van langer dan twee maanden
      een toelage brandweerdiensten defensie heeft genoten, omgezet in een vaste toelage ter hoogte van het bedrag van de
      aflopende toelage op dat moment.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '24.12'
    text: |-
      Voor de toepassing van het tiende en elfde lid wordt een toelage op grond van de Regeling vergoeding Korps
      Marinebrandweer van 29 november 1985 of van de Regeling vergoeding Korps Marinebrandweer van 12 december 1983
      beschouwd als een toelage als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel24
  - number: '25'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
  - number: 25.a
    text: |-
      *WAO:* [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 25.b
    text: |-
      *ZW:* [Ziektewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 25.c
    text: |-
      *WW:* [Werkloosheidswet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 25.d
    text: |-
      *Werknemersverzekering:* [WAO][ref1], [ZW][ref2], dan wel [WW][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0004045
  - number: 25.e
    text: |-
      *arbeidsongeschiktheid:* arbeidsongeschiktheid in de zin van [artikel 18, eerste lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 25.f
    text: |-
      *bedrijfsgeneeskundige dienst:* een door of vanwege Onze Minister aangewezen uitvoeringsorgaan
      bedrijfsgezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
  - number: 25.g
    text: |-
      *Stichting Pensioenfonds ABP:* de Stichting Pensioenfonds ABP, bedoeld in
      [artikel 6 van de Wet privatisering ABP][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel6
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '6'
  - number: 25.h
    text: '*pensioenreglement:* het pensioenreglement Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
  - number: 25.i
    text: '*herplaatsingstoelage:* een herplaatsingstoelage als bedoeld in paragraaf 9 van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
  - number: 25.j
    text: |-
      *passende arbeid:* arbeid als bedoeld in [artikel 30 van de Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel30
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '30'
  - number: 25.k
    text: |-
      *gangbare arbeid:* arbeid als bedoeld in [artikel 18, vijfde lid, van de WAO][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel18
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '18'
  - number: 25.l
    text: '*loonvormende arbeid:* arbeid gericht op het leveren van productie.'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel25
  - number: '26.1'
    text: |-
      De ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte heeft vanaf de dag waarop deze
      ongeschiktheid aanvangt, gedurende een termijn van twaalf maanden aanspraak op zijn volledige bezoldiging.
      Vervolgens heeft hij tot het einde van zijn betrekking aanspraak op 70% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid gedurende een bepaalde tijd zwangerschaps- of bevallingsverlof op
      basis van [artikel 3:1 van de Wet arbeid en zorg][ref1] geniet wordt het betreffende tijdvak van twaalf maanden met
      dat verlof verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '26.3'
    text: |-
      Voor het vaststellen van het tijdstip waarop de in het eerste lid genoemde termijn van twaalf maanden
      verstreken is, worden perioden van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte samengeteld,
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij vaststelling van de periode
      van vier weken blijven periode waarin zwangerschaps- of bevallingsverlof wordt genoten op basis van
      [artikel 3:1 van de Wet arbeid en zorg][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '26.4'
    text: |-
      De ambtenaar heeft ook na afloop van de in het eerste lid genoemde termijn van twaalf maanden aanspraak op zijn
      volledige bezoldiging:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
  - number: 26.4.a
    text: |-
      indien de ziekte, uit hoofde waarvan hij ongeschikt is zijn arbeid te verrichten, in overwegende mate zijn oorzaak
      vindt in de aard van de hem opgedragen arbeid of in de bijzondere omstandigheden, waaronder deze moesten worden
      verricht, en niet aan zijn schuld of onvoorzichtigheid is te wijten;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
  - number: 26.4.b
    text: |-
      gedurende de periode dat zwangerschaps- of bevallingsverlof wordt genoten op basis van
      [artikel 3:1 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '26.5'
    text: |-
      In afwijking van het eerste lid heeft de ambtenaar ook na het eerste tijdvak van twaalf maanden recht op
      doorbetaling van zijn bezoldiging over het aantal uren dat hij loonvormende arbeid heeft verricht, niet zijnde
      reïntegratieactiviteiten, waaronder therapeutische arbeid, onderwijs of scholing.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
  - number: '26.6'
    text: |-
      In afwijking van het vijfde lid wordt onderwijs of scholing beschouwd als loonvormende arbeid indien dit onderwijs
      of deze scholing is gekoppeld aan de functievervulling van een voor de ambtenaar beschikbare functie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel26
  - number: '27.1'
    text: |-
      Indien de ambtenaar, bedoeld in [artikel 26][ref1], ter zake van de betrekking waaruit de aanspraak op
      bezoldiging voortvloeit, recht heeft op een of meerdere uitkeringen op grond van een werknemersverzekering, de
      [Wet arbeid en zorg][ref2] of een bovenwettelijke WW-uitkering, wordt het bedrag van die uitkering of uitkeringen
      in mindering gebracht op het bedrag waarop hij ingevolge [artikel 26][ref3] recht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0013008
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel26
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013008
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.2'
    text: |-
      Indien de in het eerste lid bedoelde ambtenaar uit hoofde van twee of meer betrekkingen recht heeft op één
      uitkering op grond van een werknemersverzekering, de [Wet arbeid en zorg][ref1] of een bovenwettelijke WW-
      uitkering, wordt die uitkering voor de toepassing van het eerste lid toegerekend aan de betrekking ter zake waarvan
      hij aanspraak heeft op bezoldiging naar rato van de bezoldiging uit hoofde van de desbetreffende betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '27.3'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de ambtenaar de uitkering ingevolge een
      werknemersverzekering, de [Wet arbeid en zorg][ref1], dan wel de bovenwettelijke WW-uitkering een vermindering
      ondergaat, dan wel de aanspraak daarop geheel of gedeeltelijk niet wordt toegekend, wordt die uitkering voor de
      toepassing van het eerste lid steeds aangemerkt als een uitkering die onverminderd is genoten. Indien het een
      uitkering betreft op grond van de [WAO][ref2] die in het geheel niet wordt toegekend, wordt voor de toepassing van
      dit artikel rekening gehouden met de uitkering op grond van de [WAO][ref3] zoals die zou zijn toegekend bij een
      arbeidsongeschiktheid van 80% of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002524
  - number: '27.4'
    text: |-
      In de gevallen, bedoeld in het derde lid, kan Onze Minister op grond van bijzondere omstandigheden
      bepalen, dat het bedrag van de niet uitbetaalde bezoldiging geheel of ten dele aan anderen dan aan
      de ambtenaar zal worden uitbetaald. Ingeval Onze Minister van deze bevoegdheid geen gebruik heeft
      gemaakt, wordt de niet uitbetaalde bezoldiging alsnog aan de ambtenaar uitbetaald, indien de in
      [artikel 57, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1] bedoelde commissie van artsen te
      zijnen gunste heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '57'
  - number: '28.1'
    text: |-
      De in [artikel 26][ref1] bedoelde aanspraak op volledige of gedeeltelijke bezoldiging eindigt indien de ambtenaar
      op grond van [artikel 58a van het Burgerlijk ambtenarenreglement defensie][ref2] wordt herplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel58a
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: 58a
  - number: '28.2'
    text: |-
      Indien de herplaatsing, bedoeld in het eerste lid, plaatsvindt voordat de termijn van twee jaar, bedoeld in
      [artikel 121, derde lid, onderdeel a, van het Burgerlijk ambtenarenreglement defensie][ref1] is verstreken en de
      bezoldiging van de ambtenaar als gevolg van de herplaatsing vermindering ondergaat, heeft hij tot het eind van de
      genoemde termijn recht op een aanvullende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '121'
  - number: '28.3'
    text: |-
      De aanvullende uitkering, bedoeld in het tweede lid, bedraagt het verschil tussen het bedrag waarop de ambtenaar
      op grond van [artikel 26][ref1] recht zou hebben gehad indien hij niet zou zijn herplaatst en zijn bezoldiging
      na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke betrekking voortvloeiend recht op
      uitkering op grond van de [WAO][ref2] en herplaatsingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '29.1'
    text: |-
      Geen aanspraak op bezoldiging als bedoeld in [artikel 26][ref1] bestaat:


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
  - number: 29.1.a
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van zijn arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.1.b
    text: |-
      indien de ambtenaar de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft
      veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.1.c
    text: |-
      indien de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte
      zich voordoet binnen een half jaar na een medisch onderzoek als bedoeld in
      [artikel 9, vierde lid, onderdeel b, van het Burgerlijk ambtenarenreglement defensie][ref1], en tevens blijkt,
      dat de ambtenaar onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen
      ten gevolge waarvan de verklaring van geschiktheid tot het verrichten van zijn arbeid ten onrechte heeft
      plaatsgevonden, tenzij de ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel9
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '9'
  - number: '29.2'
    text: |-
      De ambtenaar heeft geen aanspraak op bezoldiging, als bedoeld in [artikel 26][ref1], indien en gedurende de tijd
      dat hij:


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
  - number: 29.2.a
    text: |-
      weigert zich te onderwerpen aan een onderzoek vanwege de bedrijfsgeneeskundige dienst of, na voor zulk een
      onderzoek te zijn opgeroepen, zonder geldige reden niet verschijnt;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.2.b
    text: |-
      zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen, dan wel
      zich niet houdt aan de voorschriften die hem door de behandelende arts gegeven zijn, met dien verstande dat
      voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard hierbij zijn uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.2.c
    text: zich zodanig gedraagt, dat zijn genezing wordt belemmerd of vertraagd;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.2.d
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de bedrijfsgeneeskundige dienst in het belang van zijn genezing wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.2.e
    text: |-
      in gebreke blijft op het door de bedrijfsgeneeskundige dienst bepaalde tijdstip en in de door deze dienst bepaalde
      mate zijn arbeid te hervatten, tenzij hij daarvoor een door deze dienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: 29.2.f
    text: |-
      zonder deugdelijke grond weigert hem aangeboden passende arbeid, dan wel gangbare arbeid, waartoe de
      bedrijfsgeneeskundige dienst hem in staat acht, te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het hoofd defensieonderdeel kan bepalen, dat de aanspraak op bezoldiging, bedoeld in [artikel 26][ref1], vervalt,
      indien de ambtenaar de voorschriften overtreedt die ter zake van afwezigheid wegens ziekte zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
  - number: '29.4'
    text: |-
      De ambtenaar kan aan een onderzoek vanwege de bedrijfsgeneeskundige dienst worden onderworpen ter beantwoording
      van de vraag of zich een omstandigheid voordoet als bedoeld in het eerste of tweede lid, onderdeel b of c, van dit
      artikel. De ambtenaar is gehouden aan een zodanig onderzoek zijn medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: '29.5'
    text: |-
      Het in het eerste lid bedoelde verplichtingen- en sanctieregime is van overeenkomstige toepassing indien de
      ambtenaar bij doorbetaling van bezoldiging tijdens ziekte of arbeidsongeschiktheid de in dat lid bedoelde aanspraak
      niet had kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
  - number: '29.6'
    text: |-
      In de gevallen, bedoeld in het eerste, tweede of derde lid, kan Onze Minister op grond van bijzondere
      omstandigheden bepalen, dat het bedrag van de niet uitbetaalde bezoldiging geheel of ten dele aan anderen
      dan aan de ambtenaar zal worden uitbetaald. Ingeval Onze Minister van deze bevoegdheid geen gebruik
      heeft gemaakt, wordt de niet uitbetaalde bezoldiging alsnog aan de ambtenaar uitbetaald, indien de in
      [artikel 57, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1] bedoelde commissie van artsen te
      zijnen gunste heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '57'
  - number: '29.7'
    text: |-
      Indien de ambtenaar recht heeft op een uitkering op grond van een werknemersverzekering of de
      [Wet arbeid en zorg][ref1], is in plaats van het eerste tot en met vierde lid het verplichtingen- en sanctieregime
      van de desbetreffende wet op hem van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '29.8'
    text: |-
      Indien ten aanzien van de uitkering die de ambtenaar geniet op grond van een werknemersverzekering of de
      [Wet arbeid en zorg][ref1] een verplichting wordt opgelegd of een sanctie wordt toegepast, wordt door het hoofd
      defensieonderdeel zoveel mogelijk dezelfde verplichting opgelegd, dan wel een overeenkomende sanctie toegepast,
      op het bedrag waarop de ambtenaar recht heeft ingevolge [artikel 26, eerste lid][ref2], na toepassing van
      [artikel 27, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013008
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel27
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0013008
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '27'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      Ingeval de ambtenaar aanspraak heeft op een toelage onregelmatige dienst, als bedoeld in [artikel 20][ref1],
      wordt voor de toepassing van dit hoofdstuk deze toelage vastgesteld op het bedrag dat hem ingevolge het voor
      hem geldende rooster zou zijn toegekend, indien hij niet aan zijn arbeid zou zijn onttrokken. Is de vaststelling
      van het bedrag op deze wijze niet mogelijk, dan wordt dit, met inachtneming van de percentages zoals genoemd in
      [artikel 20][ref2], berekend over het voor de ambtenaar geldende salaris, zulks naar aantallen uren als bedoeld in
      dat artikel waarop door hem gedurende de drie kalendermaanden voorafgaande aan het tijdstip met ingang waarvan hij
      aan zijn arbeid werd onttrokken, ingevolge het voor hem geldende rooster gemiddeld per maand is gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel20
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '20'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '20'
        hoofdstuk: '3'
  - number: '30.2'
    text: |-
      In geval de ambtenaar aanspraak heeft op een consignatietoelage, als bedoeld in [artikel 23][ref1], wordt deze
      toelage vastgesteld op het bedrag dat hem ingevolge het voor hem geldende consignatierooster zou zijn toegekend,
      indien hij niet aan zijn arbeid zou zijn onttrokken. Is de vaststelling van het bedrag op deze wijze niet mogelijk,
      wordt dit bedrag berekend naar de berekeningsgrondslag en de percentages zoals genoemd in [artikel 23][ref2], zulks
      naar de aantallen uren als bedoeld in dat artikel waarop door hem gedurende de drie kalendermaanden voorafgaande
      aan het tijdstip met ingang waarvan hij aan zijn arbeid werd onttrokken, gemiddeld per maand consignatiediensten
      zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel23
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '23'
        hoofdstuk: '3'
  - number: '30.3'
    text: |-
      Indien ook voor het overige de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt gerekend
      met het bedrag dat gemiddeld per maand is toegekend in de drie kalendermaanden voorafgaande aan het tijdstip waarop
      de verhindering tot dienstverrichting is ontstaan. Voor zover de ambtenaar op evenbedoeld tijdstip nog geen drie
      kalendermaanden in dienst is geweest, wordt gerekend met het bedrag dat hem gemiddeld aan bezoldiging per maand is
      toegekend over het tijdvak waarin hij voor het ontstaan van de verhindering in dienst is geweest.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel30
  - number: '31'
    text: |-
      Dit hoofdstuk is niet van toepassing op de ambtenaar die geen deelnemer is in de zin van het Pensioenreglement
      ABP. In geval van ziekte ontvangt hij tijdens de duur van zijn dienstverband op een hem op grond van de
      [Ziektewet][ref1] of de [Wet werk en inkomen naar arbeidsvermogen][ref2] toegekende uitkering een aanvulling tot
      zijn bezoldiging. Indien de ambtenaar wegens ziekte ongeschikt is voor de uitoefening van zijn dienstbetrekking,
      ontvangt hij gedurende de eerste twaalf maanden van die ongeschiktheid 100% en daarna tot aan het einde van
      zijn betrekking 70% van zijn bezoldiging, nadat daarop de uitkering ingevolge de [Ziektewet][ref3] of de
      de [Wet werk en inkomen naar arbeidsvermogen][ref4] in mindering is gebracht. Op die vermindering zijn de
      [artikelen 27][ref5] en [29][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0018191#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0018191#Artikel29
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0018191
        artikel: '27'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0018191
        artikel: '29'
        hoofdstuk: '4'
  - number: '32.1'
    text: |-
      Het hoofd defensieonderdeel kent een non-activiteitswedde toe aan de ambtenaar die, ingevolge
      [artikel 12c, eerste lid, van de Wet ambtenaren defensie][ref1], tijdelijk is ontheven van de waarneming van zijn
      ambt in verband met de werkzaamheden die voortvloeien uit een functie in een publiekrechtelijk college, waarin hij
      is benoemd of verkozen. De non-activiteitswedde is het bedrag waarmee de laatstelijk door hem in zijn ambt genoten
      bezoldiging het bedrag van de inkomsten die de ambtenaar in verband met zijn werkzaamheden in dat publiekrechtelijk
      college geniet, overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '32.2'
    text: 'Voor de toepassing van het eerste lid geldt voorts dat:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
  - number: 32.2.a
    text: |-
      toekenning van de non-activiteitswedde plaatsvindt op de voet van het
      bepaalde in de [artikelen 4, tweede tot en met vijfde lid][ref1], en
      [5 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006612#Artikel5
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006612
        artikel: '5'
  - number: 32.2.b
    text: |-
      onder inkomsten die in verband met zijn werkzaamheden in dat publiekrechtelijk college worden genoten wordt
      verstaan: alle inkomsten die aan die werkzaamheden zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
  - number: '32.3'
    text: |-
      Voor de toepassing van dit artikel wordt de functie van substituut-ombudsman met de in het eerste lid bedoelde
      functie gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
  - number: '32.4'
    text: |-
      Dit artikel is niet van toepassing op degene die een non-activiteitswedde geniet uit hoofde van
      [artikel 4, eerste lid, van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel4
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '4'
  - number: '33.1'
    text: |-
      Het hoofd defensieonderdeel past een vermindering toe op de bezoldiging van de ambtenaar die een vaste vergoeding
      ontvangt uit de functie waarvoor hem ingevolge [artikel 12c, tweede lid, lid, van de Wet ambtenaren defensie][ref1]
      verlof is verleend. De bezoldiging wordt verminderd in evenredigheid met het aantal uren dat de ambtenaar verlof
      is verleend. De vermindering bedraagt maximaal de vaste vergoeding die de ambtenaar in de bedoelde functie zou
      ontvangen voor de uren die overeenkomen met een hierna vastgestelde taakduur.


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel12c
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: 12c
  - number: '33.2'
    text: |-
      De in het eerste lid bedoelde taakduur wordt voor een lid van de Provinciale Staten vastgesteld op een taakduur van
      11 uur per week.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: '33.3'
    text: 'De in het eerste lid bedoelde taakduur wordt voor een lid van de raad van een gemeente vastgesteld op:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.3.a
    text: 7 uur per week voor een gemeente met ten hoogste 30.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.3.b
    text: 12 uur per week voor gemeente met ten hoogste 100.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.3.c
    text: 24 uur per week voor een gemeente met meer dan 100.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: '33.4'
    text: 'De in het eerste lid bedoelde taakduur wordt voor een wethouder vastgesteld op een taakduur van:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.4.a
    text: 16 uur per week voor een gemeente tot 2.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.4.b
    text: 20 uur per week voor een gemeente tot 4.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.4.c
    text: 24 uur per week voor een gemeente tot 8.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.4.d
    text: 28 uur per week voor een gemeente tot 14.000 inwoners;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: 33.4.e
    text: 32 uur per week voor een gemeente tot 18.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel33
  - number: '34'
    text: |-
      De bezoldiging van de ambtenaar die is aangesteld op grond van
      [artikel 7, tweede lid, onderdeel g, van het Burgerlijk ambtenarenreglement defensie][ref1] wordt bepaald op een
      bedrag voor elk geval of voor elke te verrichten dienst afzonderlijk vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel7
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '7'
  - number: '35'
    text: |-
      De ambtenaar ontvangt geen bezoldiging over de tijd, gedurende welke hij in strijd met zijn verplichtingen
      opzettelijk nalaat zijn dienst te verrichten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel35
  - number: '36.1'
    text: |-
      Bij de ambtenaar die ingevolge [artikel 109, eerste lid][ref1], dan wel ingevolge
      [artikel 109, tweede lid, onderdeel a of b, van het Burgerlijk ambtenarenreglement defensie][ref2] is geschorst,
      wordt door de commandant voor de duur van die schorsing eenderde gedeelte ingehouden van de bezoldiging, tenzij het
      hoofd defensieonderdeel bepaalt dat geen inhouding zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel109
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '109'
  - number: '36.2'
    text: |-
      In geval een schorsing als bedoeld in het eerste lid, langer duurt dan zes weken, kan het hoofd defensieonderdeel
      bepalen dat gedurende die verdere duur van die schorsing een verdere inhouding plaatsvindt tot het volle bedrag der
      bezoldiging. Bij de afweging omtrent de hoogte van de inhouding wordt de financiële positie van de ambtenaar in de
      beschouwing betrokken.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel36
  - number: '36.3'
    text: |-
      Bij de ambtenaar die ingevolge
      [artikel 109, tweede lid, onderdeel c, van het Burgerlijk ambtenarenreglement defensie][ref1] is geschorst, vindt
      geen inhouding van bezoldiging plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
  - number: '36.4'
    text: |-
      De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan de ambtenaar worden uitbetaald, indien een schorsing
      als bedoeld in [artikel 109, tweede lid, onderdeel a of b, van het Burgerlijk ambtenarenreglement defensie][ref1]
      niet wordt gevolgd door een veroordeling tot een onvoorwaardelijke vrijheidsstraf, een vrijheidsbenemende maatregel,
      ontslag op grond van [artikel 121, eerste lid, onderdeel e, van het Burgerlijk ambtenarenreglement defensie][ref2]
      of een onvoorwaardelijk ontslag bij wijze van straf. Op de aldus uit te keren bezoldiging worden in mindering
      gebracht de inkomsten, welke de ambtenaar sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de
      schorsing heeft kunnen verrichten, tenzij zulks, naar het oordeel van het hoofd defensieonderdeel, onredelijk of
      onbillijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel121
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '109'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '121'
  - number: '36.5'
    text: |-
      In geval van schorsing tijdens ziekte van de ambtenaar is voor de berekening van de bezoldiging [artikel 30][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel30
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '30'
        hoofdstuk: '4'
  - number: '37.1'
    text: |-
      In dit artikel wordt verstaan onder nevenwerkzaamheden: activiteiten, geen deel uitmakend van die welke in het
      kader van de functievervulling aan de ambtenaar zijn opgedragen, die de ambtenaar al of niet tegen vergoeding
      verricht, waaronder nevenbetrekkingen, het drijven van nering of handel, het middellijk of onmiddellijk deelnemen
      aan aannemingen en leveringen en het zijn van commissaris, bestuurder of vennoot van een vennootschap, stichting
      of vereniging.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel37
  - number: '37.2'
    text: |-
      De ambtenaar aan wie buitengewoon verlof is verleend voor het verrichten van nevenwerkzaamheden, heeft over de
      verlofuren geen aanspraak op bezoldiging.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel37
  - number: '37.3'
    text: |-
      Indien de commandant van oordeel is dat de nevenwerkzaamheden overwegend in het algemeen belang worden verricht,
      wordt, in afwijking van het tweede lid, de bezoldiging van de ambtenaar verminderd met de inkomsten die hij
      uit hoofde van zijn nevenwerkzaamheden ontvangt. De vermindering bedraagt ten hoogste de bezoldiging waarop de
      ambtenaar over zijn verlofuren aanspraak zou hebben.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel37
  - number: '37.4'
    text: |-
      Geen vermindering van de bezoldiging vindt plaats indien het aantal verleende verlofuren is beperkt tot maximaal
      10% van de voor de ambtenaar geldende gemiddelde arbeidsduur per week.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel37
  - number: '38.1'
    text: |-
      Gedurende het zwangerschaps- en bevallingsverlof op grond van [artikel 3:1 van de Wet arbeid en zorg][ref1] behoudt
      de vrouwelijke ambtenaar haar aanspraak op bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '38.2'
    text: |-
      De commandant draagt ervoor zorg dat de vrouwelijke ambtenaar door zijn tussenkomsteen uitkering op basis van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt. Deze uitkering moet uiterlijk twee weken voor de datum van
      ingang van het zwangerschaps- en bevallingsverlof onderscheidenlijk de datum waarop de vrouwelijke ambtenaar het
      recht op de uitkering wil laten ingaan, worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: '38.3'
    text: |-
      Indien de vrouwelijke ambtenaar aan wie zwangerschaps- en bevallingsverlof is verleend gedurende dat
      verlof of gedurende een bepaalde periode van dat verlof tevens recht heeft op een uitkering op basis van de
      [Wet arbeid en zorg][ref1], wordt door de commandant betreffende de periode waarin sprake is van een samenloop een
      inhouding op de bezoldiging, als bedoeld in het eerste lid, toegepast die overeenkomt met het bedrag van bedoelde
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '38.4'
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering als bedoeld in het derde lid, is voldaan, maar geen
      uitkering is toegekend omdat de vrouwelijke ambtenaar geen aanvraag heeft ingediend, past de commandant het derde
      lid op overeenkomstige wijze toe.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel38
  - number: '39.1'
    text: |-
      Gedurende het adoptieverlof op grond van [artikel 3:2, eerste tot en met derde lid, van de Wet arbeid en zorg][ref1],
      behoudt de ambtenaar zijn aanspraak op bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '39.2'
    text: |-
      De commandant draagt ervoor zorg dat de ambtenaar door zijn tussenkomst een uitkering op basis van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref1] aanvraagt bij het Landelijk instituut sociale verzekeringen. Deze
      uitkering moet uiterlijk twee weken voor de datum van ingang van het adoptieverlof onderscheidenlijk de datum
      waarop de ambtenaar het recht op de uitkering wil laten ingaan, worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: '39.3'
    text: |-
      Indien de ambtenaar aan wie adoptieverlof is verleend gedurende dat verlof of gedurende een bepaalde periode van
      dat verlof tevens recht heeft op een uitkering op basis van de [Wet arbeid en zorg][ref1], wordt door de commandant
      betreffende de periode waarin sprake is van een samenloop een inhouding op de bezoldiging, bedoeld in het eerste
      lid, toegepast die overeenkomt met het bedrag van bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '39.4'
    text: |-
      Indien aan de voorwaarden voor het toekennen van een uitkering, als bedoeld in het derde lid, is voldaan, maar
      geen uitkering is toegekend omdat de ambtenaar geen aanvraag heeft ingediend, past de commandant het derde lid op
      overeenkomstige wijze toe.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel39
  - number: '41.1'
    text: |-
      De ambtenaar, die als militair in werkelijke dienst is, heeft geen aanspraak op bezoldiging, tenzij de werkelijke
      dienst wordt vervuld tijdens door hem opgenomen vakantie of buiten de voor hem geldende werktijd, bedoeld in
      [artikel 30a van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30a
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30a
  - number: '41.2'
    text: |-
      In afwijking van het eerste lid behoudt de ambtenaar, die als militair in werkelijke dienst is, aanspraak op
      zijn bezoldiging voor zoveel deze meer bedraagt dan zijn militaire inkomsten, indien hij door Onze Minister is
      tewerkgesteld:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.2.a
    text: onder leiding of toezicht van een orgaan van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.2.b
    text: bij of ten behoeve van een bondgenootschappelijk orgaan of bondgenootschappelijke strijdkrachten;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.2.c
    text: |-
      ten behoeve van operaties in het kader van internationale overeenkomsten of andere verplichtingen door Nederland
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: '41.3'
    text: |-
      Ingeval de ambtenaar, bedoeld in het tweede lid, aanspraak heeft op een toelage onregelmatige dienst dan wel een
      consignatietoelage is voor de berekening van de bezoldiging [artikel 30][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel30
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '30'
        hoofdstuk: '4'
  - number: '41.4'
    text: |-
      Voor de toepassing van het tweede lid wordt onder militaire inkomsten verstaan, hetgeen bij of krachtens het
      [Inkomstenbesluit militairen][ref1] of het [Algemeen militair ambtenarenreglement][ref2] wordt aangemerkt als:


      [ref1]: https://wetten.overheid.nl/BWBR0007816
      [ref2]: https://wetten.overheid.nl/BWBR0003482
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007816
      - id: ref2
        bwb_id: BWBR0003482
  - number: 41.4.a
    text: militaire bezoldiging;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.b
    text: vaste vergoeding voor extra beslaglegging;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.c
    text: vliegtoelage;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.d
    text: garantievliegtoelage;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.e
    text: toelage officieren-arts, -tandarts en -apotheker;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.f
    text: toelage officieren-medisch specialist;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.g
    text: brevettoelage;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: 41.4.h
    text: vergoeding extra werkdruk bij vredes- en humanitaire operaties.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: '41.5'
    text: |-
      Op de ambtenaar, die in tijdelijke dienst is aangesteld, zijn de bepalingen van dit artikel slechts van toepassing
      tot en met de dag, waarop de burgerlijke betrekking zou zijn beëindigd, indien hij niet als militair in werkelijke
      dienst zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel41
  - number: '42.1'
    text: |-
      Het bepaalde in [artikel 41, eerste lid][ref1], is van overeenkomstige toepassing ten aanzien van de ambtenaar, die
      is tewerkgesteld in de zin van [artikel 9 van de Wet gewetensbezwaren militaire dienst][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002386#Artikel9
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '41'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002386
        artikel: '9'
  - number: '42.2'
    text: |-
      De ambtenaar die bij de politie in werkelijke dienst is als vrijwillige ambtenaar, als bedoeld in
      [artikel 2, onderdeel c, van de Politiewet 2012][ref1], behoudt aanspraak op zijn bezoldiging, met dien verstande,
      dat deze bezoldiging, indien de werkelijke dienst langer dan twee weken duurt, voor de verdere duur wordt
      verminderd met de inkomsten, waarop de ambtenaar als vrijwillige ambtenaar van politie aanspraak heeft. Het
      bepaalde in [artikel 41][ref2] is verder voor zoveel mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel41
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '41'
        hoofdstuk: '5'
  - number: '43.1'
    text: |-
      Het hoofd defensieonderdeel kent aan de ambtenaar per maand een vakantie-uitkering toe ten bedrage van 8% van de
      bezoldiging van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
  - number: '43.2'
    text: |-
      Voor de ambtenaar die 22 jaar of ouder is bedraagt de vakantie-uitkering bij een voltijdaanstelling per maand
      tenminste € 164,41. Bij een deeltijdaanstelling wordt dit bedrag naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
  - number: '43.3'
    text: |-
      Voor de ambtenaar die jonger is dan 22 jaar bedraagt de vakantie-uitkering ten minste het in het tweede lid
      berekende bedrag verminderd met 10% voor elk leeftijdsjaar of gedeelte van een leeftijdsjaar dat hij jonger is dan
      22 jaar. De vermindering bedraagt maximaal 30%.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
  - number: '43.4'
    text: |-
      Indien de ambtenaar aanspraak heeft op een gedeelte van de bezoldiging wordt de vakantie-uitkering naar
      evenredigheid van de bezoldiging berekend, tenzij anders vermeld. Indien de ambtenaar geen aanspraak heeft op
      bezoldiging heeft de ambtenaar geen aanspraak op vakantie-uitkering, tenzij anders vermeld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
  - number: '43.5'
    text: |-
      In afwijking van het vierde lid heeft de ambtenaar, die op grond van [artikel 26][ref1] aanspraak heeft op een
      gedeelte van de bezoldiging, aanspraak op de vakantie-uitkering berekend over de volledige bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel26
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '26'
        hoofdstuk: '4'
  - number: '43.6'
    text: |-
      In afwijking van het vierde lid, heeft de ambtenaar, die aanspraak heeft op militaire inkomsten als bedoeld in
      [artikel 41][ref1], aanspraak op een vakantie-uitkering, voor zo veel de vakantie-uitkering, berekend over de
      volledige bezoldiging, meer bedraagt dan de vakantie-uitkering waarop hij als militair aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel41
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '41'
        hoofdstuk: '5'
  - number: '43.7'
    text: |-
      In afwijking van [artikel 6][ref1] wordt de vakantie-uitkering eenmaal per jaar in de maand mei uitbetaald over de
      periode van 12 maanden, die is aangevangen met de maand juni van het voorafgaande kalenderjaar. Bij ontslag van de
      ambtenaar vindt de uitbetaling plaats zo snel mogelijk na zijn ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel6
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '6'
        hoofdstuk: '1'
  - number: '44.1'
    text: |-
      Het hoofd defensieonderdeel kent een eindejaarsuitkering per maand toe aan de ambtenaar ten bedrage van 6,4% van
      het salaris van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel44
  - number: '44.2'
    text: |-
      Indien ingevolge [artikel 27][ref1] op het salaris van de ambtenaar een uitkering op grond van de [Ziektewet][ref2]
      of de [Wet op de arbeidsongeschiktheidsverzekering][ref3] in mindering is gebracht, wordt voor de toepassing van
      het eerste lid geen rekening gehouden met deze vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0002524
  - number: '44.3'
    text: |-
      Voor de toepassing van het eerste lid zijn het vierde tot en met het zesde lid van [artikel 43][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel43
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '43'
        hoofdstuk: '6'
  - number: '44.4'
    text: |-
      In afwijking van [artikel 6][ref1] wordt de eindejaarsuitkering over de periode december van het voorgaande jaar
      tot en met november van het lopende jaar uitbetaald in de maand november. Bij ontslag van de ambtenaar vindt de
      uitbetaling van de tot de datum van het ontslag opgebouwde uitkering zo snel mogelijk na het ontslag plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel6
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '6'
        hoofdstuk: '1'
  - number: 44a
    text: |-
      De burgerambtenaar heeft aanspraak op een inkomenstoeslag ter hoogte van € 136,89 per maand. Deze inkomenstoeslag
      wordt voor de ambtenaar met een deeltijdaanstelling vastgesteld op een evenredig deel van de uitkering behorend bij
      een voltijdaanstelling.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel44a
  - number: '45.1'
    text: |-
      De commandant kan aan de ambtenaar die zich bijzonder heeft onderscheiden door optreden of gedragingen dan wel door
      buitengewone toewijding of bijzonder loffelijke dienstverrichtingen, één of meer van de onderstaande beloningen
      toekennen:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
  - number: 45.1.a
    text: geschenk;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
  - number: 45.1.b
    text: geldelijke beloning;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
  - number: 45.1.c
    text: functioneringsgratificatie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
  - number: '45.2'
    text: |-
      De totale waarde van één of meer van de beloningen bedraagt maximaal 20% van het tot een jaarbedrag herleide
      salaris in de maand van toekenning. Bij de berekening van de totale waarde van de beloningen wordt geen rekening
      gehouden met de verschuldigde loonheffing en inhoudingen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
  - number: '45.3'
    text: |-
      De in voorkomend geval over één of meer van die beloningen verschuldigde loonheffing en de inhoudingen, bedoeld in
      [paragraaf 5 van de Wet financiële voorzieningen privatisering ABP][ref1], komen voor rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007211
        paragraaf: '5'
  - number: '46.1'
    text: |-
      De commandant kan aan de ambtenaar die het voor hem geldende maximumsalaris heeft bereikt een functioneringstoelage
      toekennen, indien de wijze van functioneren van de ambtenaar daartoe naar het oordeel van de commandant aanleiding
      geeft.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.2'
    text: De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.3'
    text: De functioneringstoelage bedraagt ten hoogste 10 procent van het salaris van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.4'
    text: |-
      Indien een ambtenaar, die in het genot is van een functioneringstoelage, een andere functie krijgt opgedragen
      waaraan een hogere salarisschaal is verbonden, vervalt de functioneringstoelage met ingang van de datum waarop die
      hogere salarisschaal van toepassing wordt.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.5'
    text: |-
      Indien een ambtenaar, die in het genot is van een functioneringstoelage, tijdelijk wordt bezoldigd conform een
      hogere salarisschaal, wordt het bedrag van de functioneringstoelage gedurende de tijd dat de ambtenaar dat hogere
      salaris ontvangt, op nul gesteld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.6'
    text: |-
      Indien een ambtenaar na het opdragen van de andere functie bedoeld in het vierde lid dan wel gedurende de periode
      dat hij tijdelijk aanspraak heeft op bezoldiging conform een hogere salarisschaal, aanspraak heeft op een salaris
      dat lager is dan het salaris vermeerderd met de functioneringstoelage waarop hij direct voorafgaand aan het
      opdragen van de andere functie dan wel de periode waarover hij de tijdelijke hogere bezoldiging geniet aanspraak
      had, heeft hij aanspraak op een overbruggingstoelage.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.7'
    text: |-
      De overbruggingstoelage bedoeld in het zesde lid is gelijk aan het verschil tussen het salaris zoals de ambtenaar
      dat wegens het opdragen van de andere functie of gedurende de periode waarin hij de tijdelijke hogere bezoldiging
      geniet en het salaris vermeerderd met de functioneringstoelage zoals hij dat voorafgaand daaraan genoot.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.8'
    text: |-
      De aanspraak op de in het zesde lid bedoelde overbruggingstoelage vervalt indien de ambtenaar na de periode waarin
      hij tijdelijk conform een hogere salarisschaal werd bezoldigd weer aanspraak heeft op de functioneringstoelage.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '46.9'
    text: |-
      De aanspraak op de in het zesde lid bedoelde overbruggingstoelage eindigt op de datum waarop de toegekende
      functioneringstoelage volgens de toekenningsbeschikking zou eindigen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel46
  - number: '47.1'
    text: |-
      Het hoofd defensieonderdeel kan aan een ambtenaar die in vaste dienst is aangesteld en die zich verbindt om
      gedurende een bepaalde periode onafgebroken deel uit te maken van het burgerpersoneel, een bindingspremie
      toekennen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel47
  - number: '47.2'
    text: Bij ministeriële regeling worden regels gesteld omtrent de toekenning van een bindingspremie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel47
  - number: '49.1'
    text: |-
      De commandant kent aan de ambtenaar met een salarisschaal tot en met 10 een vergoeding voor overwerk toe, indien de
      ambtenaar in opdracht van de commandant overwerk verricht.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.2'
    text: |-
      Onder overwerk wordt verstaan: arbeid die wordt verricht buiten de werktijden, die voor de ambtenaar gelden
      krachtens een rooster, voor zover daardoor het per werkperiode vastgestelde aantal arbeidsuren wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.3'
    text: |-
      In afwijking van het eerste lid wordt voor overwerk dat gedurende korter dan een half uur aansluitend aan de
      dagelijkse werktijd wordt verricht, geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.4'
    text: 'De werkperiode bedoeld in het tweede lid wordt gesteld op:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.4.a
    text: één dag, indien aanvang en einde van de werktijd in de regel niet aan wisselingen onderhevig zijn;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.4.b
    text: |-
      een tijdvak van tenminste zeven dagen, indien de tijdstippen van aanvang en einde van de werktijd volgens een
      tevoren vastgesteld rooster wisselen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.5'
    text: 'De vergoeding voor overwerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.5.a
    text: verlof, gelijk aan het aantal uren overschrijding van het per werkperiode vastgestelde aantal arbeidsuren, en
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.5.b
    text: |-
      een overwerktoelage in geld, die voor elk uur van die overschrijding een percentage van het voor de ambtenaar
      geldende salaris per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.6'
    text: |-
      De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.7'
    text: |-
      Indien naar het oordeel van de commandant het dienstbelang zich verzet tegen het toekennen van verlof, wordt in
      plaats van verlof voor ieder uur een additionele overwerktoelage in geld toegekend gelijk aan het voor de ambtenaar
      geldende salaris per uur.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '49.8'
    text: 'Indien de werkperiode één dag omvat, bedraagt het in het vijfde lid, onderdeel b, bedoelde percentage:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.8.a
    text: |-
      behoudens het gestelde onder b en c, het getal, vermeld in de onderstaande tabel:









                        Overwerk verricht


                        op zondag


                        op maandag


                        op dinsdag, woensdag, donderdag of vrijdag


                        op zaterdag






                        tussen 0 en 6 uur


                        100


                        100


                        50


                        50




                        tussen 6 en 18 uur


                        100


                        25


                        25


                        50




                        tussen 18 en 20 uur


                        100


                        25


                        25


                        75




                        tussen 20 en 24 uur


                        100


                        50


                        50


                        75
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.8.b
    text: |-
      50, indien gedurende langer dan twee uur overwerk is verricht, voor zover het overwerk betreft, dat na de eerste
      twee uur is verricht op maandag, dinsdag, woensdag, donderdag of vrijdag tussen 06.00 uur en 20.00 uur, behoudens
      het gestelde onder c;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.8.c
    text: |-
      100, indien het overwerk is verricht op een der feestdagen, genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1] dan wel op de daarop volgende dag
      tussen 00.00 uur en 06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '49.9'
    text: |-
      Indien de werkperiode een tijdvak van tenminste zeven dagen omvat, bedraagt het in het vijfde lid, onderdeel b,
      bedoelde percentage:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.9.a
    text: 50, behoudens het gestelde onder b;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: 49.9.b
    text: |-
      100, indien het overwerk is verricht op zondag, op maandag tussen 00.00 uur en 06.00 uur, op een der feestdagen,
      genoemd in [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1], dan wel op de dag,
      volgende op de laatstgenoemde dag tussen 00.00 uur en 06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '49.10'
    text: |-
      Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vijfde lid onder a,
      of krachtens het [Burgerlijk ambtenarenreglement defensie][ref1] dan wel een overeenkomstige regeling vakantie of
      verlof is genoten, als uren waarop is gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: '49.11'
    text: |-
      Aan ambtenaren voor wie verschillende salarisschalen gelden, die ingevolge een opdracht als bedoeld in het eerste
      lid gelijke werkzaamheden verrichten kan, in afwijking van het in dit artikel bepaalde, naar billijkheid een voor
      alle betrokken ambtenaren gelijke vergoeding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel49
  - number: '50.1'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: 50.1.a
    text: '*etmaal:* een tijdsbestek van 24 uur aaneengesloten;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: 50.1.b
    text: |-
      *oefening:* een oefening, als bedoeld in
      [artikel 30a, onderdeel k, van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30a
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30a
  - number: 50.1.c
    text: |-
      *ZZF-dag:* een zaterdag, zondag of feest- en gedenkdag, als bedoeld in
      [artikel 31g, eerste of tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '50.2'
    text: |-
      De commandant kent, in afwijking van de [artikelen 23][ref1] en [49][ref2], aan de ambtenaar met een salarisschaal
      tot en met 10 een oefentoelage toe voor een oefening, die een etmaal of langer duurt en waarbij sprake is van
      consignatie in de zin van [artikel 23][ref3] of overwerk in de zin van [artikel 49][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0018191#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0018191#Artikel49
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '49'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0018191
        artikel: '23'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0018191
        artikel: '49'
        hoofdstuk: '6'
  - number: '50.3'
    text: |-
      De oefentoelage wordt niet toegekend, indien de oefening korter dan een etmaal duurt. De [artikelen 23][ref1] en
      [49][ref2] zijn in dit geval van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018191#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018191#Artikel49
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018191
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0018191
        artikel: '49'
        hoofdstuk: '6'
  - number: '50.4'
    text: 'De oefentoelage bedraagt per etmaal 3% van:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: 50.4.a
    text: het maximumsalaris per maand van salarisschaal 3 voor de ambtenaar met salarisschaal 1 tot en met 6;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: 50.4.b
    text: het maximumsalaris per maand van salarisschaal 8 voor de ambtenaar met salarisschaal 7 tot en met 10.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: '50.5'
    text: |-
      Indien bij een oefening langer dan een etmaal sprake is van een niet volledig etmaal, wordt de oefentoelage over
      het niet volledige etmaal berekend per half etmaal. Een tijdvak van minder dan 12 uren telt hierbij voor een half
      etmaal en van 12 uren of meer voor een heel etmaal.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: '50.6'
    text: |-
      Onverminderd het bepaalde in het tweede lid wordt aan de ambtenaar voor een oefening per etmaal 8 uur vrije tijd
      verleend, indien dit plaatsvindt op een ZZF-dag. Hierbij telt een periode van 8 uur of langer voor een etmaal. Bij
      een periode korter dan 8 uur wordt geen vergoeding in vrije tijd verleend.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: '50.7'
    text: |-
      Indien naar het oordeel van de commandant het dienstbelang zich verzet tegen het toekennen van de vergoeding in
      vrije tijd, bedoeld in het zesde lid, wordt in plaats van deze vergoeding voor ieder uur een compensatie in geld
      toegekend dat gelijk is aan het voor de ambtenaar geldende salaris per uur.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: '50.8'
    text: |-
      De ambtenaar die aanspraak heeft op een toelage of vergoeding ingevolge dit artikel heeft uit anderen hoofde geen
      aanspraak op een toelage wegens beschikbaarheid of bereikbaarheid, vergoeding in geld of tijd voor overwerk of
      beloning voor bezwarende werkomstandigheden.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel50
  - number: '51.1'
    text: |-
      Voor de ambtenaar die op 30 juni 2003 aanspraak heeft op een toelage op grond van de
      [Toelageregeling afschaffing tariefbeloning Defensie][ref1], wordt die aanspraak met ingang van 1 juli 2003 omgezet
      in een vervangingstoelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003574
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003574
  - number: '51.2'
    text: |-
      Het bedrag van de vervangingstoelage is op 1 juli 2003 gelijk aan het bedrag van de toelage waarop de ambtenaar op
      30 juni 2003 aanspraak heeft op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003574
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003574
  - number: '51.3'
    text: |-
      Voor zover de toelage op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref1] op 30 juni 2003
      deel uitmaakt van de bezoldiging onderscheidenlijk de grondslag voor de vakantie-uitkering onderscheidenlijk het
      pensioengevend inkomen, maakt de vervangingstoelage vanaf 1 juli 2003 op overeenkomstige wijze deel uit van de
      bezoldiging onderscheidenlijk de grondslag voor de vakantie-uitkering onderscheidenlijk het pensioengevend inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003574
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003574
  - number: '51.4'
    text: |-
      Voor zover de toelage op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref1] vóór 30 juni 2003
      wordt aangepast met het percentage van een algemene salarismaatregel, wordt de vervangingstoelage vanaf 1 juli 2003
      op overeenkomstige wijze aangepast met het percentage van een algemene salarismaatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003574
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003574
  - number: '52.1'
    text: 'Bij ministeriële regeling kan de ambtenaar een aanspraak worden toegekend op:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.a
    text: |-
      een toelage voor het verrichten van werkzaamheden waaraan naar het oordeel van Onze Minister bijzondere risico’s of
      inconveniënten zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.b
    text: |-
      een toelage in verband met het vervullen van een door Onze Minister aangewezen functie of het bezit van een door
      Onze Minister aangewezen bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.c
    text: |-
      een diensttijdgratificatie bij een – naar het oordeel van Onze Minister – eervolle diensttijd van twaalfeneenhalf,
      vijfentwintig, veertig of vijftig jaren;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.d
    text: |-
      een vergoeding of een tegemoetkoming in de kosten of – in de plaats daarvan – voorzieningen in natura ter zake van
      het verblijf van de ambtenaar buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.e
    text: een vergoeding of een tegemoetkoming in de kosten van recepties en representatie;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.f
    text: een vergoeding of een tegemoetkoming in de kosten van maaltijden bij overwerk;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.g
    text: een vergoeding of een tegemoetkoming in de kosten van communicatie;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.h
    text: een vergoeding of een tegemoetkoming in de extra kosten voor zorg voor jonge kinderen bij inzet;
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: 52.1.i
    text: eventuele overige inkomsten.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: '52.2'
    text: |-
      Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in het eerste lid, onderdeel d tot
      en met h, wordt mandaat verleend aan de hoofddirecteur personeel van het Ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel52
  - number: '59'
    text: |-
      In dit hoofdstuk wordt verstaan onder: *berekeningsbasis*: de bezoldiging met uitzondering van een toelage
      onregelmatige dienst, een aflopende toelage onregelmatige dienst en een consignatietoelage, met dien verstande dat
      de bezoldiging bij deeltijdaanstelling herleid wordt tot de bezoldiging, die geldt bij een voltijdaanstelling.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel59
  - number: '60.1'
    text: |-
      De ambtenaar is voor het verstrekken van kost en van inwoning door Defensie, anders dan bij een dienstreis
      als bedoeld in [artikel 1 van het Besluit dienstreizen defensie][ref1], per maand een bedrag verschuldigd van
      onderscheidenlijk 12% en 8% van zijn berekeningsbasis, met inachtneming van bij ministeriële regeling te bepalen
      maxima.


      [ref1]: https://wetten.overheid.nl/BWBR0007956#Artikel1
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007956
        artikel: '1'
  - number: '60.2'
    text: |-
      In afwijking van het eerste lid wordt voor de ambtenaar, wiens berekeningsbasis gelijk aan of lager is dan
      het maandbedrag van het minimumloon dat krachtens de [artikelen 7][ref1], [8, eerste en derde lid][ref2], en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref3], geldt voor werknemers in de leeftijd van 21 jaar of
      ouder, het verschuldigde bedrag bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '61.1'
    text: |-
      De ambtenaar is voor het gebruik van een woning die door Defensie beschikbaar is gesteld en voor verdere
      verstrekkingen in die woning waarvan de kosten niet afzonderlijk kunnen worden vastgesteld, per maand een bedrag
      verschuldigd aan Defensie, overeenkomende met de hierna genoemde percentages van zijn berekeningsbasis:
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.a
    text: 'voor het gebruik van de woning:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.a.1°
    text: 'die in Nederland is gelegen: 12%;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.a.2°
    text: 'die buiten Nederland is gelegen: 17%;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.b
    text: 'voor verwarming van de woning: 2,4%;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.c
    text: 'voor energie voor kookdoeleinden: 0,9%;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.d
    text: 'voor elektrische energie, anders dan voor verwarming van de woning en voor kookdoeleinden: 0,9%;'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: 61.1.e
    text: 'voor leidingwater: 0,4%,'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: '61.2'
    text: |-
      Indien de ambtenaar aantoont dat de huurwaarde van de woning voor de heffing van de inkomsten- en loonbelasting
      minder bedraagt dan het op grond van het bepaalde in het eerste lid geldende bedrag wegens het gebruik van de
      woning, wordt het verschuldigde bedrag op dat van die huurwaarde gesteld.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: '61.3'
    text: |-
      Voor het gebruik van de verstrekkingen genoemd in het eerste lid, onderdeel b tot en met e, is geen bedrag
      verschuldigd in het geval, bedoeld in het tweede lid, en in de gevallen waarin tevens kost en inwoning wordt
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel61
  - number: '62'
    text: |-
      Indien de billijkheid dat vordert, kan Onze Minister de ambtenaar schadeloos stellen, kosten vergoeden of overigens
      een geldelijke tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel62
  - number: '75'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
  - number: 75.a
    text: |-
      het [Besluit betaling emolumenten burgerlijke ambtenaren defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006037
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006037
  - number: 75.b
    text: |-
      het [Besluit maaltijdvergoeding bij overwerk burgerlijke ambtenaren defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006036
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006036
  - number: 75.c
    text: |-
      het [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: 75.d
    text: |-
      het [Interimbesluit ziektekosten burgerlijke ambtenaren defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006034
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006034
  - number: 75.e
    text: |-
      het [Telefoonkostenbesluit burgerlijke ambtenaren defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006035
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006035
  - number: 75a
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op
      [artikel 12o van de Wet ambtenaren defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0018191/2021-01-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '76'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het besluit
      wordt geplaatst, met dien verstande dat de [artikelen 63, onderdeel A][ref1], [64][ref2], [65][ref3], [66][ref4],
      [68][ref5], [69][ref6], [70, onderdeel W][ref7], [71, onderdeel C][ref8], [72, onderdeel C][ref9], en [73][ref10]
      terugwerken tot en met 1 augustus 2004.


