  - number: '9'
    text: |-
      1 Totdat het hoofd of de bestuurder van een inrichting ingevolge
      [artikel 28 van het Besluit risico's zware ongevallen 1999][ref1] voor de eerste keer een veiligheidsrapport heeft
      ingediend, kunnen burgemeester en wethouders hem in afwijking van [artikel 3, tweede lid][ref2], verzoeken een
      rapport over te leggen.

      2 In een geval als bedoeld in [artikel 5, eerste lid][ref3], dient het hoofd of de bestuurder, bedoeld in het
      eerste lid, in afwijking van [artikel 5, tweede lid][ref4], een gewijzigd rapport over te leggen.


