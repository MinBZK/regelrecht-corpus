        artikel: 2.2b
  - number: '8'
    text: |-
      Op een inrichting die is gelegen op of deel uitmaakt van een bij de krijgsmacht in gebruik zijnd terrein, voor
      zover er gegevens in het geding zijn waarvan de geheimhouding door het belang van de veiligheid van de staat is
      geboden, zijn de [artikelen 1 tot en met 7][ref1] van toepassing met dien verstande dat:

      a. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in plaats van burgemeester en wethouders
      optreedt in de [artikelen 3, eerste, en vierde lid, aanhef en onderdeel c, en vijfde lid][ref2], [4][ref3],
      [5, eerste, vierde en vijfde lid][ref4], [6, eerste en tweede lid][ref5], en [9][ref6];

      b. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een exemplaar van het rapport, naast de in
      [artikel 3, vierde lid][ref7], genoemde functionarissen en bestuursorganen, zendt aan burgemeester en wethouders
      van de gemeente waarin een inrichting als bedoeld in de aanhef van dit artikel is gelegen.


