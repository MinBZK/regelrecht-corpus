  - number: '4'
    text: |-
      1 Indien burgemeester en wethouders van oordeel zijn dat de inrichting waarvoor zij ingevolge
      [artikel 3, eerste lid][ref1], een rapport of ingevolge [artikel 3, tweede lid][ref2], een veiligheidsrapport
      hebben ontvangen in geval van brand of ongevallen bijzonder gevaar kan opleveren voor de openbare veiligheid,
      wijzen zij, met inachtneming van de bij dit besluit behorende bijlage, de inrichting aan die binnen een door hen te
      stellen termijn over een bedrijfsbrandweer dient te beschikken.

      2 Burgemeester en wethouders gaan niet over tot het aanwijzen van een inrichting dan nadat de in
      [artikel 3, vierde lid][ref3], bedoelde functionarissen door hen in de gelegenheid zijn gesteld advies ter zake uit
      te brengen en nadat het hoofd of de bestuurder van de inrichting door hen is gehoord.

      3 Burgemeester en wethouders kunnen inrichtingen aanwijzen die gezamenlijk over een bedrijfsbrandweer dienen te
      beschikken. Het tweede lid is van overeenkomstige toepassing.

      4 Burgemeester en wethouders maken de aanwijzing, bedoeld in het eerste en derde lid, bekend aan de in
      [artikel 3, vierde lid][ref4], bedoelde functionarissen.

      5 Burgemeester en wethouders kunnen in de aanwijzing, bedoeld in het eerste en derde lid, slechts eisen stellen
      aan:

      a. het opleidingsniveau en de geoefendheid van het personeel van de bedrijfsbrandweer;

      b. de voorzieningen inzake bluswater, melding, alarmering en verbindingen;

      c. het blusmaterieel;

      d. de beschermende middelen;

      e. de alarmering van en samenwerking met de gemeentelijke brandweer en andere hulpverleningsorganisaties;

      f. de omvang van het personeel en het materieel van de bedrijfsbrandweer.

      Het tweede lid is van overeenkomstige toepassing.

      6 Burgemeester en wethouders houden bij het vaststellen van de eisen, bedoeld in het vijfde lid, rekening met de
      eisen die ter zake aan de inrichting worden gesteld bij of krachtens de [Brandweerwet 1985][ref5] en andere wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004694#Artikel3
