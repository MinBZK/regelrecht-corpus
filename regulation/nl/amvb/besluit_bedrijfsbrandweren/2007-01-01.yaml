  - number: '3'
    text: |-
      1 Alvorens tot aanwijzing over te gaan, verzoeken burgemeester en wethouders het hoofd of de bestuurder van de
      inrichting, waarvan zij redelijkerwijs kunnen vermoeden dat deze in geval van brand of ongevallen een bijzonder
      gevaar voor de openbare veiligheid kan vormen, binnen drie maanden na ontvangst van het verzoek aan hen een rapport
      inzake de bedrijfsbrandweer over te leggen, dat de volgende gegevens bevat:

      a. een algemene beschrijving van de inrichting, van de daarin voorkomende stoffen en de eigenschappen van deze
      stoffen;

      b. een algemene beschrijving van de processen die in de inrichting plaatsvinden;

      c. de geloofwaardige incidentscenario’s dat wil zeggen een beschrijving van de aard, de omvang, het verloop in de
      tijd en de bestrijding of de beheersing van een brand of een ongeval op het terrein van de inrichting,

      1°. die gegeven de aard van een installatie of de inrichting, rekening houdend met de daarin aangebrachte
      preventieve voorzieningen, als zeer reëel en typerend wordt geacht,

      2°. waarbij schade aan gebouwen of personen in de omgeving van de inrichting kan ontstaan, en

      3°. waarbij van preventieve of repressieve maatregelen duidelijk effect verwacht mag worden, waardoor escalatie
      daarvan wordt voorkomen;

      d. de maatgevende incidentscenario’s dat wil zeggen de geloofwaardige incidentscenario's, bedoeld in onderdeel *c*,
      die bepalend zijn voor de omvang en de uitrusting van de bedrijfsbrandweer;

      e. een beschrijving van de organisatie van de nodig geachte bedrijfsbrandweer, waaronder de omvang van het
      personeel en het materieel.

      2 Het eerste lid is niet van toepassing indien voor de inrichting een veiligheidsrapport moet worden ingediend.

      3 Indien gegevens als bedoeld in het eerste lid reeds zijn opgenomen in een of meer arbeidsveiligheidsrapporten
      als bedoeld in [artikel 2.2b van het Arbeidsomstandighedenbesluit][ref1] of een veiligheidsrapport als bedoeld in
      [artikel 10 van het Besluit risico’s zware ongevallen 1999][ref2], kan in het rapport worden volstaan met een
      verwijzing naar de desbetreffende gegevens.

      4 Burgemeester en wethouders zenden een exemplaar van het rapport aan:

      a. de daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen toezichthouder, bedoeld in
      [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref3];

      b. het bestuur van de regionale brandweer in wier grondgebied de inrichting is gelegen;

      c. het bestuursorgaan dat overeenkomstig [artikel 8.2 van de Wet milieubeheer][ref4] bevoegd is een vergunning voor
      de desbetreffende inrichting te verlenen, tenzij burgemeester en wethouders dat bestuursorgaan zijn;

      d. Onze Minister van Verkeer en Waterstaat, indien de inrichting is gelegen op of deel uitmaakt van een
      luchtvaartterrein als bedoeld in [artikel 1, onderdeel g, van de Luchtvaartwet][ref5];

      e. Onze Minister van Defensie, indien de inrichting is gelegen op of deel uitmaakt van een bij de krijgsmacht
      ingebruik zijnd terrein.

      5 Burgemeester en wethouders kunnen het hoofd of de bestuurder van de inrichting verzoeken hen aanvullende gegevens
      te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.2b
