  - number: '6'
    text: |-
      1 Na wijziging van de omgeving van een aangewezen inrichting die in betekenende mate consequenties
      heeft voor de maatgevende incidentscenario's, bedoeld in [artikel 3, eerste lid, onderdeel d][ref1],
      dan wel voor de scenario's voor een mogelijk zwaar ongeval op het terrein van de inrichting, bedoeld in
      [bijlage III, onder 1. l, van het Besluit risico's zware ongevallen 1999][ref2], kunnen burgemeester en wethouders
      de aanwijzing, bedoeld in [artikel 4][ref3], eerste dan wel derde lid, intrekken dan wel met inachtneming van de
      bij dit besluit behorende bijlage de eisen, bedoeld in [artikel 4, vijfde lid][ref4], wijzigen.

      2 Burgemeester en wethouders bepalen bij het vaststellen van de gewijzigde eisen, bedoeld in het eerste lid, een
      termijn waarbinnen aan die eisen moet zijn voldaan.

      3 [Artikel 4, tweede, vierde en zesde lid][ref5], is van overeenkomstige toepassing.


