  - number: '5'
    text: |-
      1 Na wijziging of uitbreiding van een aangewezen inrichting dan wel verandering van de daarin gebezigde processen
      die in betekenende mate consequenties hebben voor de inhoud van het rapport, dient het hoofd of de bestuurder van
      die inrichting zo spoedig mogelijk een dienovereenkomstig gewijzigd rapport aan burgemeester en wethouders over
      te leggen.

      2 Het eerste lid is niet van toepassing indien voor de inrichting een veiligheidsrapport dan wel een met die
      wijziging of uitbreiding verband houdende wijziging of bijwerking van dat rapport moet worden ingediend.

      3 [Artikel 3, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.

      4 Indien het gewijzigde rapport, het veiligheidsrapport of de wijziging daarvan daartoe aanleiding geven, kunnen
      burgemeester en wethouders de aanwijzing, bedoeld in [artikel 4][ref2], eerste dan wel derde lid, intrekken dan
      wel met inachtneming van de bij dit besluit behorende bijlage de eisen, bedoeld in [artikel 4, vijfde lid][ref3],
      wijzigen.

      5 Burgemeester en wethouders bepalen bij het vaststellen van de gewijzigde eisen, bedoeld in het vierde lid, een
      termijn waarbinnen aan die eisen moet zijn voldaan.

      6 [Artikel 4, tweede, vierde en zesde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004694#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004694#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004694#Artikel4
