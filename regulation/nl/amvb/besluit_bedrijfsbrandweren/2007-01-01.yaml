  - number: '2'
    text: |-
      Voor een aanwijzing als inrichting die over een bedrijfsbrandweer moeten beschikken, komen slechts in aanmerking:

      a. inrichtingen waarop [paragraaf 2 van het Besluit risico's zware ongevallen 1999][ref1] van toepassing is;

      b. inrichtingen met installaties waarop [Hoofdstuk 2, Afdeling 2, van het Arbeidsomstandighedenbesluit][ref2] van
      toepassing is voor zover het betreft:

      1°. inrichtingen die geheel of nagenoeg geheel zijn bestemd voor de opslag in verband met vervoer van in die
      afdeling genoemde stoffen, al dan niet in combinatie met andere stoffen en producten;

      2°. spoorwegemplacementen voor zover zij geen onderdeel zijn van een inrichting waarop het
      [Besluit risico's zware ongevallen 1999][ref3] van toepassing is;

      c. inrichtingen, bedoeld in [artikel 15, onderdeel ][ref4], behoudens in de gevallen dat
      [artikel 44 van het Besluit kerninstallaties, splijtstoffen en ertsen][ref5] van toepassing is;

      d. inrichtingen, waarin radioactieve stoffen voorhanden zijn, worden bereid dan wel toegepast, bedoeld in
      [artikel 29, eerste lid, van de Kernenergiewet][ref6], niet zijnde inrichtingen als bedoeld in de onderdelen *a* en
      *b* van dit artikel;

      e. inrichtingen, waarin vaste stoffen of vloeistoffen voorhanden zijn, die bij verhitting tot brandgevaarlijke
      situaties kunnen leiden en waarvan de totale verbrandingsenergie meer bedraagt dan 46.1011 kJ.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0010475
