  - number: '7'
    text: |-
      Indien met betrekking tot een zelfde inrichting naast een rapport tevens een of meer arbeidsveiligheidsrapporten
      als bedoeld in [artikel 2.2b van het Arbeidsomstandighedenbesluit][ref1], moeten worden ingediend, dienen de
      onderscheidene bestuursorganen bij wie de betrokken rapporten moeten worden ingediend, hun activiteiten met
      betrekking tot de beoordeling van die rapporten zoveel mogelijk op elkaar af te stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2.2b
    url: https://wetten.overheid.nl/BWBR0004694/2007-01-01#Artikel7
