articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de bedrijfsbrandweer: de organisatie van mensen en middelen die tot doel heeft het bestrijden van branden en
      ongevallen op het terrein van de inrichting;

      b. het rapport: het rapport inzake de bedrijfsbrandweer, bedoeld in [artikel 3, eerste lid][ref1].

      c. het veiligheidsrapport: het rapport, bedoeld in [artikel 10 van het Besluit risico's zware ongevallen 1999][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004694#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel10
    url: https://wetten.overheid.nl/BWBR0004694/2007-01-01#Artikel1
