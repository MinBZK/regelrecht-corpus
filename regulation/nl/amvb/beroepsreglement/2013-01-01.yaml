preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Justitie van 20 juni 1956, Afdeling Wetgeving, No. 241/656;

    Gelet op de artikelen 10, 24, 28-30, 54, 55, 104-106, 130, 132 en 144 der Beroepswet (Stb. 1955, 47);

    De Raad van State gehoord (advies van 3 juli 1956, no. 19);

    Gezien het nader rapport van Onze voornoemde minister van 31 juli 1956, Afdeling Wetgeving, no. 285/656;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#ArtikelAanhef
articles:
  - number: 28a
    text: |-
      1 De rang van ouderdom van dienst tussen hen die eenzelfde ambt bekleden, wordt geregeld naar de dagtekening en zo
      nodig naar het nummer van de besluiten van benoeming.

      2 Zijn verscheidene personen tot éénzelfde ambt benoemd bij één besluit, dan wordt de rang van ouderdom geregeld
      naar de volgorde waarin zij in het besluit worden genoemd.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel28a
  - number: '30'
    text: |-
      Zij die de Centrale Raad van Beroep als griffier bijstaan, dragen hetzelfde costuum als de overeenkomstige
      ambtenaren van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel30
  - number: '31'
    text: |-
      De president roept, zo dikwijls hij zulks nodig acht, de Centrale Raad van Beroep in algemene vergadering bijeen.
      Zoveel mogelijk wonen alle senior raadsheren en raadsheren de vergadering bij.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel31
  - number: '32'
    text: |-
      In de gevallen waarin van Onzentwege bij de Centrale Raad van Beroep bericht of advies wordt ingewonnen, zal het
      antwoord worden vastgesteld in een algemene vergadering.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel32
  - number: '38'
    text: |-
      De griffier is hoofd van de griffie. Voor zover hij niet optreedt tot bijstand van de rechter in diens
      verrichtingen, is hij verplicht de voorschriften te volgen, welke hem door Onze Minister van Veiligheid en Justitie
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel38
  - number: '39'
    text: De griffier regelt de inrichting der administratie. Hij beheert het archief.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel39
  - number: '41'
    text: |-
      De griffier heeft de zorg voor de huisvesting van het college, voor de inboedel, de boekerij, de huishoudelijke
      dienst en de bij het college in behandeling zijnde stukken. Hij pleegt daaromtrent geregeld overleg met de
      president.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel41
  - number: '43'
    text: |-
      De griffie is op de dagen waarop terechtzittingen worden gehouden ten behoeve van de bij die zittingen betrokken
      procespartijen en hun advocaten en gemachtigden tenminste een kwartier voor de aanvang van een zitting en een
      kwartier na afloop daarvan geopend.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel43
  - number: '44'
    text: |-
      1 De terechtzittingen, andere bijeenkomsten en verhoren worden bijgewoond door de griffier. Deze maakt zodanige
      aantekeningen als door de wet of de rechter worden gevorderd.

      2 De griffier geeft ook overigens aan de rechter in al diens ambtsverrichtingen alle door deze gewenste bijstand.

      3 De werkzaamheden, bedoeld in dit artikel, worden tussen de griffier, de substituut-griffiers en de
      plaatsvervangende griffiers verdeeld bij een rooster, vastgesteld door de griffier in overleg met de president. Bij
      ontstentenis van degene, die ingevolge de rooster met enige werkzaamheid is belast, wijst de griffier een vervanger
      aan.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel44
  - number: '46'
    text: |-
      Bij ontstentenis van de griffier treedt als hoofd van de griffie op een substituut-griffier, dan wel bij
      ontstentenis van dien een plaatsvervangende griffier, een en ander volgens een rooster door de griffier opgemaakt
      in overleg met de president. Bij gebreke van een zodanige voorziening wijst Onze Minister van Veiligheid en
      Justitie de substituut- of plaatsvervangende griffier aan, die optreedt als hoofd van de griffie.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel46
  - number: '97'
    text: Dit besluit kan worden aangehaald als Beroepsreglement.
    url: https://wetten.overheid.nl/BWBR0002228/2013-01-01#Artikel97
