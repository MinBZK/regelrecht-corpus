    text: |-
      1 Als besluiten als bedoeld in [artikel 9d, eerste lid, van de Elektriciteitswet 1998][ref1] worden aangewezen
      besluiten als bedoeld in:

      a. de [artikelen 2.1, eerste lid][ref2], en [2.2 van de Wet algemene bepalingen omgevingsrecht][ref3],
      met inbegrip van een eventueel benodigde verklaring van geen bedenkingen, voor zover de desbetreffende
      omgevingsvergunning in elk geval betrekking heeft op een van de activiteiten, bedoeld in
      [artikel 2.1, eerste lid, onder a, b, c, e, f en g, van die wet][ref4], of op projecten of handelingen als bedoeld
      in [artikel 2.2aa van het Besluit omgevingsrecht][ref5];

      b. de [artikelen 2.7, tweede lid][ref6], [3.3, eerste en derde lid][ref7], [3.8, eerste en derde lid][ref8], en
      [3.10, tweede lid][ref9] in samenhang met [3.8, eerste of derde lid, van de Wet natuurbescherming][ref10];

      c. [artikel 16.5, eerste lid, van de Wet milieubeheer][ref11];

      d. de [artikelen 6.2][ref12], [6.4][ref13] en [6.5, onderdelen a en b, van de Waterwet][ref14];

      e.

      f. [artikel 11, tweede lid, van de Monumentenwet 1988][ref15], zoals die [wet][ref16] luidde voor de
      inwerkingtreding van de [Erfgoedwet][ref17];

      g. [artikel 15 van de Kernenergiewet][ref18].

      2 Als besluiten als bedoeld in [artikel 9d, eerste lid, van de Elektriciteitswet 1998][ref19] worden voorts
      aangewezen besluiten op grond van een bepaling in een verordening van een waterschap met betrekking tot het
      verrichten of doen verrichten van handelingen aan of nabij een watergang of waterkering.


