  - number: '5.11'
    text: |-
      1 Een te bouwen bouwwerk is voldoende energiezuinig.

      2 Voorzover voor een gebruiksfunctie in tabel 5.11 voorschriften zijn aangewezen, wordt voor die gebruiksfunctie
      aan de in het eerste lid gestelde eis voldaan door toepassing van die voorschriften.

      3 Het eerste lid is niet van toepassing op de gebruiksfuncties waarvoor in tabel 5.11 geen voorschrift is
      aangewezen.

















