  - number: '5.14'
    text: |-
      1 Het bevoegd gezag wijkt bij een omgevingsvergunning die betrekking heeft op het geheel vernieuwen van een
      bouwwerk niet af van de [artikelen 5.12][ref1] en [5.13][ref2].

      2 Bij het gedeeltelijk vernieuwen of veranderen of het vergroten van een bouwwerk zijn de [artikelen 5.12][ref3] en
      [5.13][ref4] niet van toepassing.


