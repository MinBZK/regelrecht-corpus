  - number: '5.12'
    text: >-
      1 Een gebruiksfunctie heeft een energieprestatiecoëfficiënt van ten hoogste de in tabel 5.11 aangegeven
      grenswaarde.


      2 Indien in een gebouw of een gedeelte van een gebouw uitsluitend gebruiksfuncties van dezelfde soort liggen, die
      zijn aangewezen op een gemeenschappelijke verkeersruimte waarop geen andere gebruiksfuncties zijn aangewezen, heeft
      dat gebouw of gedeelte van het gebouw een energieprestatiecoëfficiënt van ten hoogste de in tabel 5.11 aangegeven
      grenswaarde.


      3 Indien in een gebouw of een gedeelte van een gebouw meerdere gebruiksfuncties of gedeelten liggen, waarvoor
      volgens het eerste of tweede lid een energieprestatiecoëfficiënt geldt, en dit gebouw of gedeelte van een
      gebouw op niet meer dan een perceel ligt, geldt, in afwijking van het eerste en het tweede lid, dat het totale
      volgens NEN 2916 bepaalde karakteristieke energiegebruik niet hoger is dan het totale volgens NEN 2916 bepaalde
      toelaatbare energiegebruik. Bij het bepalen van het totale toelaatbare energiegebruik zijn de grenswaarden voor de
      energieprestatiecoëfficiënten volgens het eerste en tweede lid aangehouden.
    url: https://wetten.overheid.nl/BWBR0012727/2012-04-01#Artikel5.12
  - number: '5.13'
    text: |-
      1 Een energieprestatiecoëfficiënt als bedoeld in [artikel 5.12][ref1], wordt bepaald volgens NEN 5128. Bij
      het bepalen van de energieprestatiecoëfficiënt van een woonfunctie mogen een toiletruimte, een badruimte,
      een meterruimte, een opstelplaats voor een warmwatertoestel en een opstelplaats voor een stooktoestel buiten
      beschouwing blijven.

      2 Een energieprestatiecoëfficiënt als bedoeld in [artikel 5.12][ref2], wordt bepaald volgens NEN 2916. Bij
      het bepalen van de energieprestatiecoëfficiënt van de gebruiksfunctie is voor de coëfficiënt voor koeling de
      waarde 4 aangehouden en voor de factor waarmee compensatie voor toelaatbaar energiegebruik voor ventilatie wordt
      gerealiseerd, de waarde 135. Bij het bepalen van de energieprestatiecoëfficiënt mogen een toiletruimte, een
      badruimte, een meterruimte, een opstelplaats voor een warmwatertoestel en een opstelplaats voor een stooktoestel
      buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0012727#Artikel5.12
      [ref2]: https://wetten.overheid.nl/BWBR0012727#Artikel5.12
