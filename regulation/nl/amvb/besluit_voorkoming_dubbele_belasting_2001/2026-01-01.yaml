        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 14a
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0012095
        artikel: '20'
