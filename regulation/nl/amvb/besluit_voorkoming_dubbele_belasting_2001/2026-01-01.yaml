  - number: '14.1'
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting, bedoeld in [artikel 13][ref1], dat
      door de toepassing van het [tweede lid, onderdeel b, of het vierde lid van dat artikel][ref2], niet leidt tot
      een vermindering van inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege andere Mogendheden geheven
      belasting van het daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar
      over te brengen bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


