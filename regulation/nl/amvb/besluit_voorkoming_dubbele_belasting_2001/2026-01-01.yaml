        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '15.6'
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere regelen ter
      voorkoming van dubbele belasting en volgens de [artikelen 10][ref1], [13][ref2] en [13a][ref3], ten hoogste het
      bedrag aan berekende belasting over het belastbare inkomen uit werk en woning.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel13a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
