  - number: '16.1'
    text: |-
      Bij de toepassing van [artikel 15][ref1] wordt geen vermindering verleend indien de belastingplichtige niet de
      uiteindelijk gerechtigde is tot de dividenden, interest of royalty's waarop door een andere Mogendheid belasting is
      geheven. Niet als uiteindelijk gerechtigde wordt beschouwd de belastingplichtige die in samenhang met de ontvangen
      opbrengst een tegenprestatie heeft verricht als onderdeel van een samenstel van transacties waarbij aannemelijk
      is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel15
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 16.1.a
    text: |-
      de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan een natuurlijk persoon die of
      lichaam dat in mindere mate gerechtigd is tot vermindering van Nederlandse belasting dan de belastingplichtige die
      de tegenprestatie heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
  - number: 16.1.b
    text: |-
      deze natuurlijk persoon, onderscheidenlijk dit lichaam, een positie in rechten waaruit de opbrengst is genoten
      op directe of indirecte wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke rechten
      voorafgaand aan het moment waarop het samenstel van transacties een aanvang heeft genomen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
  - number: '16.2'
    text: 'Voor de toepassing van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
  - number: 16.2.a
    text: |-
      kan van een samenstel van transacties eveneens sprake zijn ingeval transacties zijn aangegaan op een
      gereglementeerde effectenbeurs of markt;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
  - number: 16.2.b
    text: |-
      wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele verwerving
      van een of meer dividendbewijzen of rentetermijnen, of op de vestiging van kortlopende genotsrechten op rechten.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting, bedoeld in [artikel 15][ref1], dat door
      de toepassing van het tweede lid, onderdeel b, of het zesde lid, van dat artikel niet leidt tot een vermindering
      van inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege andere Mogendheden geheven belasting van het
      daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar over te brengen
      bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel15
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '18'
    text: |-
      Op schriftelijk verzoek van de belastingplichtige blijft [artikel 15][ref1] buiten toepassing voor de in een jaar
      genoten dividenden, interest en royalty's, bedoeld in dat artikel en voor de daarover vanwege ontwikkelingslanden
      geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel15
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '19.1'
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting,
      een vermindering van inkomstenbelasting verleend voor in het inkomen uit aanmerkelijk belang begrepen dividenden,
      indien:
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: 19.1.a
    text: de vennootschap die de dividenden uitdeelt in een ontwikkelingsland is gevestigd, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: 19.1.b
    text: |-
      de dividenden zijn onderworpen aan een belasting naar het inkomen die vanwege dat ontwikkelingsland, al dan niet
      aan de bron, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: '19.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: 19.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: 19.2.b
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar zonder de toepassing van dit besluit volgens de
      [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit aanmerkelijk belang verschuldigd zou zijn,
      in dezelfde verhouding staat als het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen
      dividenden staat tot het noemerinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '19.3'
    text: |-
      [Artikel 15, derde en vierde lid][ref1], en [artikel 16][ref2] vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '19.4'
    text: |-
      Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1]
      verschuldigd zou zijn over het belastbare inkomen uit aanmerkelijk belang wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit aanmerkelijk belang, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel b, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '19.5'
    text: 'Onder noemerinkomen wordt verstaan: het belastbare inkomen uit aanmerkelijk belang.'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: '19.6'
    text: |-
      In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is de persoonlijke- en gezinssituatie volledig in aanmerking te nemen,
      het noemerinkomen vermeerderd met de op het inkomen uit aanmerkelijk belang in het jaar in mindering gebrachte
      persoonsgebonden aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een Mogendheid,
      niet zijnde een lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden zou zijn om op
      grond van het Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie volledig in
      aanmerking te nemen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel19
  - number: '20'
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting, bedoeld in [artikel 19][ref1],
      dat door de toepassing van het tweede lid, onderdeel b, van dat artikel niet leidt tot een vermindering van
      inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege andere Mogendheden geheven belasting van het
      daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar over te brengen
      bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel19
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '21'
    text: |-
      Op schriftelijk verzoek van de belastingplichtige blijft [artikel 19][ref1] buiten toepassing voor de in een jaar
      genoten dividenden als bedoeld in dat artikel en voor de daarover vanwege ontwikkelingslanden geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel19
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '22'
    text: |-
      Een binnenlandse belastingplichtige is vrijgesteld van de inkomstenbelasting die betrekking heeft op buitenlands
      voordeel uit sparen en beleggen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel22
  - number: '23.1'
    text: |-
      Het buitenlandse voordeel uit sparen en beleggen bestaat uit het gezamenlijke bedrag van hetgeen de
      belastingplichtige als bestanddeel van het voordeel uit sparen en beleggen geniet als voordeel uit de
      rendementsgrondslag in het buitenland.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      De rendementsgrondslag in het buitenland bestaat enerzijds uit de waarde aan het begin van het kalenderjaar
      (peildatum) van de bezittingen in het buitenland en anderzijds uit de waarde op de peildatum van de met die
      bezittingen verband houdende schulden. Bezittingen in het buitenland zijn:
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: 23.2.a
    text: binnen het gebied van een andere Mogendheid gelegen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: 23.2.b
    text: |-
      rechten die direct of indirect betrekking hebben op binnen het gebied van een andere Mogendheid gelegen onroerende
      zaken, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: 23.2.c
    text: |-
      rechten op aandelen in de winst van een onderneming waarvan de leiding binnen het gebied van een andere Mogendheid
      is gelegen, voorzover zij niet voortkomen uit effectenbezit of dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: '23.3'
    text: |-
      Bezittingen als bedoeld in het tweede lid behoren alleen tot de rendementsgrondslag in het buitenland voorzover de
      daaruit genoten opbrengsten zijn onderworpen aan een belasting naar het inkomen die vanwege de andere Mogendheid
      waarin de bezittingen zijn gelegen, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien de in het tweede lid genoemde bezittingen en schulden niet het gehele jaar tot de rendementsgrondslag van de
      belastingplichtige behoren, wordt de naar tijdsgelang herleide waarde op de peildatum hiervan voor de vaststelling
      van de rendementsgrondslag in het buitenland in aanmerking genomen, waarbij gedeelten van kalendermaanden als volle
      maand worden beschouwd. Behoort de bezitting of de schuld op de peildatum niet tot de rendementsgrondslag, dan
      wordt voor de toepassing van de eerste volzin uitgegaan van de waarde op het tijdstip waarop de bezitting of de
      schuld tot de rendementsgrondslag gaat behoren.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel23
  - number: '24.1'
    text: |-
      De in [artikel 22][ref1] bedoelde vrijstelling voor buitenlands voordeel uit sparen en beleggen wordt toegepast
      door een vermindering te verlenen op de verschuldigde inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel22
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '22'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: '24.2'
    text: |-
      De in het eerste lid bedoelde vermindering is gelijk aan het bedrag dat tot de belasting die zonder de toepassing
      van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit sparen en beleggen
      verschuldigd zou zijn, in dezelfde verhouding staat als het rendement van de rendementsgrondslag in het buitenland
      staat tot het noemerinkomen. De vermindering kan, met inachtneming van de verminderingen volgens andere regelen
      ter voorkoming van dubbele belasting, niet meer bedragen dan de belasting die zonder de toepassing van dit besluit
      volgens de Wet inkomstenbelasting 2001 over het belastbare inkomen uit sparen en beleggen verschuldigd zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '24.3'
    text: |-
      Indien de belastingplichtige niet het gehele jaar binnenlands belastingplichtige is, wordt voor
      de in het tweede lid bedoelde vermindering het naar tijdsgelang herleide rendement, bedoeld in
      [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref1], van de rendementsgrondslag in het buitenland
      over de periode dat hij in Nederland woonde in aanmerking genomen. Gedeelten van kalendermaanden worden hierbij
      verwaarloosd. Als noemerinkomen geldt de som van het naar tijdsgelang herleide noemerinkomen over de periode dat de
      belastingplichtige in Nederland woonde en het naar tijdsgelang herleide belastbare inkomen uit sparen en beleggen
      in Nederland over de periode dat hij niet in Nederland woonde.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '24.4'
    text: |-
      Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1]
      verschuldigd zou zijn over het belastbare inkomen uit sparen en beleggen wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit sparen en beleggen, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel c, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '24.5'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
  - number: 24.5.a
    text: |-
      het rendement van de rendementsgrondslag in het buitenland: het bedrag dat tot het voordeel uit sparen
      en beleggen, bedoeld in [artikel 5.2, eerste lid, van de Wet inkomstenbelasting 2001][ref1], in dezelfde
      verhouding staat als het op de voet van artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001 bepaalde
      rendement van de bezittingen in het buitenland na vermindering met het op de voet van dat lid bepaalde
      rendement van de schulden in verband met die bezittingen staat tot het op de voet van artikel 5.2, tweede
      lid, van de Wet inkomstenbelasting 2001 bepaalde rendement berekend over de rendementsgrondslag, bedoeld in
      [artikel 5.3, eerste lid, van de Wet inkomstenbelasting 2001][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 24.5.b
    text: 'het noemerinkomen: het belastbare inkomen uit sparen en beleggen.'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
  - number: '24.6'
    text: |-
      In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is de persoonlijke- en gezinssituatie volledig in aanmerking te nemen,
      het noemerinkomen vermeerderd met de op het belastbaar inkomen uit sparen en beleggen in het jaar in mindering
      gebrachte persoonsgebonden aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een
      Mogendheid, niet zijnde een lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden
      zou zijn om op grond van het Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie
      volledig in aanmerking te nemen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24
  - number: 24a.1
    text: |-
      Een bedrag aan in een jaar vrij te stellen buitenlands voordeel uit sparen en beleggen dat als gevolg van het in
      aanmerking nemen van de persoonsgebonden aftrek en de toepassing van [artikel 24, tweede lid, tweede volzin][ref1],
      niet leidt tot een vermindering van belasting over dat jaar, wordt overgebracht naar het volgend jaar. Deze
      overbrenging bedraagt niet meer dan het bedrag van de persoonsgebonden aftrek waarmee het voordeel uit sparen
      en beleggen is verminderd. De overbrenging vindt alleen plaats indien het naar het volgend jaar over te brengen
      buitenlands voordeel uit sparen en beleggen door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel24
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: 24a.2
    text: |-
      In het jaar waarnaar de overbrenging plaatsvindt, wordt voor de berekening van de vermindering van
      [artikel 24][ref1] het buitenlands voordeel uit sparen en beleggen verhoogd met het over te brengen bedrag aan
      buitenlands voordeel uit sparen en beleggen. Het noemerinkomen wordt niet verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel24
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: '25.1'
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting,
      een vermindering van inkomstenbelasting verleend in verband met ontvangen dividenden, interest en royalty's indien:
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
  - number: 25.1.a
    text: |-
      de rechten waaruit de opbrengst is genoten behoren tot de bezittingen als bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 25.1.b
    text: |-
      de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland is
      gevestigd of woont, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
  - number: 25.1.c
    text: |-
      de dividenden, interest en royalty's zijn onderworpen aan een belasting naar het inkomen die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het desbetreffende
      jaar vanwege andere Mogendheden geheven belasting. De belasting die vanwege andere Mogendheden is geheven
      over dividenden, interest en royalty's wordt tot geen hoger bedrag in aanmerking genomen dan tot 15% van de
      desbetreffende dividenden, interest en royalty's.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
  - number: '25.3'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '25.4'
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere regelen ter
      voorkoming van dubbele belasting en volgens de [artikelen 24][ref1] of [25ad][ref2], ten hoogste het bedrag aan
      berekende belasting op het belastbaar inkomen uit sparen en beleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel25ad
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 25ad
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 25a
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting, bedoeld in [artikel 25][ref1], dat
      door de toepassing van het vierde lid van dat artikel niet leidt tot een vermindering van inkomstenbelasting over
      dat jaar, wordt aangemerkt als vanwege andere Mogendheden geheven belasting van het daaropvolgende jaar. Deze
      voortwenteling vindt alleen plaats indien het naar het volgend jaar over te brengen bedrag door de inspecteur is
      vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 25aa
    text: |-
      Indien in een jaar het belastbare inkomen uit sparen en beleggen wordt bepaald met inachtneming van
      [afdeling 5.6 van de Wet inkomstenbelasting 2001][ref1], vindt [hoofdstuk 2, afdeling 4, paragraaf 1][ref2], in
      dat jaar geen toepassing en wordt de vermindering van belasting bij buitenlands voordeel uit sparen en beleggen
      vastgesteld met inachtneming van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.6
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25aa
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '5.6'
      - id: ref2
        bwb_id: BWBR0012095
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: 25ab
    text: |-
      Een binnenlandse belastingplichtige is vrijgesteld van de inkomstenbelasting die betrekking heeft op buitenlands
      voordeel uit sparen en beleggen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ab
  - number: 25ac.1
    text: |-
      Het buitenlandse voordeel uit sparen en beleggen bestaat uit het gezamenlijke bedrag van het werkelijke rendement
      van de bezittingen in het buitenland en van de schulden in verband met die bezittingen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
  - number: 25ac.2
    text: |-
      Het werkelijke rendement van de bezittingen in het buitenland en de schulden in verband met die bezittingen wordt
      bepaald met toepassing van [afdeling 5.6 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.6
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '5.6'
  - number: 25ac.3
    text: 'Bezittingen in het buitenland zijn:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
  - number: 25ac.3.a
    text: binnen het gebied van een andere Mogendheid gelegen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
  - number: 25ac.3.b
    text: |-
      rechten die direct of indirect betrekking hebben op binnen het gebied van een andere Mogendheid gelegen onroerende
      zaken; en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
  - number: 25ac.3.c
    text: |-
      rechten op aandelen in de winst van een onderneming waarvan de leiding binnen het gebied van een andere Mogendheid
      is gelegen, voor zover zij niet voortkomen uit effectenbezit of dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ac
  - number: 25ad.1
    text: |-
      De vrijstelling voor buitenlands voordeel uit sparen en beleggen, bedoeld in [artikel 25ab][ref1], wordt toegepast
      door een vermindering te verlenen op de verschuldigde inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25ab
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ad
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 25ab
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 25ad.2
    text: |-
      De vermindering, bedoeld in het eerste lid, is gelijk aan het bedrag dat tot de belasting die zonder de
      toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit sparen
      en beleggen verschuldigd zou zijn, in dezelfde verhouding staat als het werkelijke rendement van de bezittingen
      in het buitenland en de schulden in verband met die bezittingen staat tot het belastbare inkomen uit sparen en
      beleggen. De vermindering kan, met inachtneming van de verminderingen volgens andere regelingen ter voorkoming
      van dubbele belasting, niet meer bedragen dan de belasting die zonder de toepassing van dit besluit volgens de Wet
      inkomstenbelasting 2001 over het belastbare inkomen uit sparen en beleggen verschuldigd zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ad
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 25ad.3
    text: |-
      Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1]
      verschuldigd zou zijn over het belastbare inkomen uit sparen en beleggen wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit sparen en beleggen, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel c, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ad
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 25ad.4
    text: |-
      In afwijking van het tweede lid wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende de
      werking van de Europese Unie gehouden is de persoonlijke- en gezinssituatie volledig in aanmerking te nemen, het
      belastbare inkomen uit sparen en beleggen vermeerderd met de in het jaar in mindering gebrachte persoonsgebonden
      aftrek. De vorige zin is van overeenkomstige toepassing met betrekking tot een Mogendheid, niet zijnde een lidstaat
      van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden zou zijn om op grond van het Verdrag
      betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie volledig in aanmerking te nemen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ad
  - number: 25ae.1
    text: |-
      Een bedrag aan in een jaar vrij te stellen buitenlands voordeel uit sparen en beleggen dat als gevolg van het in
      aanmerking nemen van de persoonsgebonden aftrek en de toepassing van [artikel 25ad, tweede lid, tweede zin][ref1],
      niet leidt tot een vermindering van belasting over dat jaar, wordt overgebracht naar het volgende jaar. Deze
      overbrenging bedraagt niet meer dan het bedrag van de persoonsgebonden aftrek waarmee het voordeel uit sparen
      en beleggen is verminderd. De overbrenging vindt alleen plaats indien het naar het volgende jaar over te brengen
      buitenlands voordeel uit sparen en beleggen door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25ad
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ae
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 25ad
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 25ae.2
    text: |-
      In het jaar waarnaar de overbrenging plaatsvindt, wordt voor de berekening van de vermindering van
      [artikel 25ad][ref1] het buitenlands voordeel uit sparen en beleggen verhoogd met het over te brengen bedrag aan
      buitenlands voordeel uit sparen en beleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25ad
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ae
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 25ad
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 25b.1
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van inkomstenbelasting verleend voor in het inkomen uit werk en woning, het inkomen
      uit aanmerkelijk belang of het voordeel uit sparen en beleggen begrepen inkomsten die bij deze belastingplichtige
      opkomen als gevolg van de toerekening op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1] van de
      bezittingen en schulden alsmede opbrengsten en uitgaven van een afgezonderd particulier vermogen, voor zover deze
      bezittingen en schulden alsmede opbrengsten en uitgaven zijn onderworpen aan een belasting naar het inkomen of de
      winst die vanwege de Mogendheid waarin het afgezonderd particulier vermogen is gevestigd wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 25b.2
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
  - number: 25b.2.a
    text: |-
      het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting als bedoeld in het eerste
      lid over de aan de belastingplichtige toegerekende bezittingen en schulden alsmede opbrengsten en uitgaven; en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
  - number: 25b.2.b
    text: |-
      het bedrag van de in het desbetreffende jaar, zonder de toepassing van dit besluit, volgens de
      [Wet inkomstenbelasting 2001][ref1] verschuldigde inkomstenbelasting dat betrekking heeft op de inkomsten, bedoeld
      in het eerste lid, die bij de belastingplichtige opkomen, waarbij dit bedrag wordt verminderd met de verminderingen
      van de verschuldigde inkomstenbelasting die voor die inkomsten worden verleend op grond van de aan dit artikel
      voorafgaande artikelen of andere regelingen ter voorkoming van dubbele belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 25b.3
    text: |-
      Het bedrag van de in het desbetreffende jaar volgens de [Wet inkomstenbelasting 2001][ref1] verschuldigde
      inkomstenbelasting dat betrekking heeft op de inkomsten, bedoeld in het eerste lid, die bij de belastingplichtige
      opkomen, wordt voor de toepassing van het tweede lid, onderdeel b, gesteld op de som van de volgende bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 25b.3.a
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen uit werk en woning
      verschuldigd is, in dezelfde verhouding staat als het in het inkomen uit werk en woning begrepen inkomen dat in dat
      jaar bij de belastingplichtige opkomt op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1] staat
      tot het noemerinkomen, bedoeld in [artikel 10, vijfde en zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 25b.3.b
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen uit aanmerkelijk belang
      verschuldigd is, in dezelfde verhouding staat als het in het inkomen uit aanmerkelijk belang begrepen inkomen dat
      in dat jaar bij de belastingplichtige opkomt op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1]
      staat tot het noemerinkomen, bedoeld in [artikel 19, vijfde en zesde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel19
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '19'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 25b.3.c
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen uit sparen en beleggen
      verschuldigd is, in dezelfde verhouding staat als het in het voordeel uit sparen en beleggen begrepen inkomen dat
      in dat jaar bij de belastingplichtige opkomt op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1]
      staat tot het noemerinkomen, bedoeld in [artikel 24, vijfde en zesde lid][ref2], onderscheidenlijk het belastbare
      inkomen uit sparen en beleggen, bedoeld in [artikel 25ad, tweede en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel25ad
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 25ad
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 25b.4
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens de aan dit artikel
      voorafgaande artikelen en volgens andere regelingen ter voorkoming van dubbele belasting, ten hoogste het bedrag
      aan verschuldigde inkomstenbelasting over het belastbare inkomen uit werk en woning, het belastbare inkomen uit
      aanmerkelijk belang en het belastbare inkomen uit sparen en beleggen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25b
  - number: 25ba
    text: |-
      Het bedrag van de in een jaar vanwege een andere Mogendheid geheven belasting, bedoeld in [artikel 25b][ref1], dat
      door toepassing van het tweede lid, onderdeel b, of het vierde lid van dat artikel niet leidt tot een vermindering
      van inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege die andere Mogendheid geheven belasting van
      het daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar over te brengen
      bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25b
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel25ba
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 25b
        hoofdstuk: '2'
        afdeling: 4a
  - number: '26.1'
    text: |-
      De inspecteur stelt het bedrag van het volgens [artikel 11][ref1] naar een volgend jaar over te brengen buitenlands
      inkomen uit werk en woning per Mogendheid en het bedrag van het volgens de [artikelen 24a][ref2] of [25ae][ref3]
      naar een volgend jaar over te brengen buitenlands voordeel uit sparen en beleggen vast bij voor bezwaar vatbare
      beschikking. Deze vaststelling gebeurt gelijktijdig met het vaststellen van de aanslag over dat jaar. Het bedrag
      van het naar het volgend jaar over te brengen buitenlands inkomen uit werk en woning en het bedrag van het naar het
      volgend jaar over te brengen buitenlands voordeel uit sparen en beleggen worden op het aanslagbiljet afzonderlijk
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel25ae
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 24a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 25ae
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: '26.2'
    text: 'Rechtsmiddelen tegen een beschikking als bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de grootte van het over te brengen bedrag aan buitenlands inkomen uit werk en woning en van het over te brengen
      bedrag aan buitenlands voordeel uit sparen en beleggen, voorzover niet eerder vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.2.b
    text: |-
      de toepassing van [artikel 28a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel28a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 28a
        hoofdstuk: '2'
        afdeling: '5'
  - number: '26.3'
    text: |-
      Het bedrag aan buitenlands inkomen uit werk en woning dat volgens [artikel 11, eerste lid][ref1], naar het
      volgend jaar wordt overgebracht en het bedrag aan buitenlands voordeel uit sparen en beleggen dat volgens de
      [artikelen 24a, eerste lid][ref2], of [25ae, eerste lid][ref3], naar het volgend jaar wordt overgebracht, kunnen
      worden herzien of alsnog worden vastgesteld, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel25ae
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 24a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 25ae
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: 26.3.a
    text: een aanslag wordt verminderd wegens de verrekening van verliezen uit andere jaren;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.3.b
    text: de inspecteur een navorderingsaanslag vaststelt;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.3.c
    text: de inspecteur een beschikking herziet waarin het bedrag van een verlies wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.3.d
    text: |-
      enig feit grond oplevert voor het vermoeden dat het bedrag van het over te brengen buitenlands inkomen uit werk
      en woning te hoog is vastgesteld, waarbij de herziening alleen kan plaatsvinden voor in de beschikking opgenomen
      buitenlands inkomen uit werk en woning dat is genoten in een van de twaalf voorafgaande jaren;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: 26.3.e
    text: |-
      enig feit grond oplevert voor het vermoeden dat het bedrag van het over te brengen buitenlands voordeel uit sparen
      en beleggen te hoog is vastgesteld, waarbij de herziening alleen kan plaatsvinden voor in de beschikking opgenomen
      buitenlands voordeel uit sparen en beleggen dat is genoten in een van de twaalf voorafgaande jaren.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
  - number: '26.4'
    text: |-
      In afwijking in zoverre van [artikel 11, eerste lid, tweede volzin][ref1], onderscheidenlijk de
      [artikelen 24a, eerste lid, derde zin][ref2], of [25ae, eerste lid, derde zin][ref3], wordt, indien het derde
      lid toepassing vindt, het herziene of het alsnog vastgestelde bedrag aan buitenlands inkomen uit werk en
      woning, onderscheidenlijk het herziene of het alsnog vastgestelde bedrag aan buitenlands voordeel uit sparen en
      beleggen dat naar het volgend jaar wordt overgebracht, in het volgend jaar in aanmerking genomen zonder dat dit
      bedrag vooraf door de inspecteur bij voor bezwaar vatbare beschikking is vastgesteld. De vorige volzin vindt
      overeenkomstige toepassing voorzover de herziening gevolgen heeft voor bedragen die worden overgebracht naar jaren
      waarvoor al een aanslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel25ae
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 24a
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 25ae
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '4'
  - number: '27.1'
    text: |-
      De inspecteur stelt het bedrag van het volgens [artikel 12][ref1] naar een volgend jaar over te brengen negatieve
      buitenlands inkomen uit werk en woning per Mogendheid vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel12
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '27.2'
    text: |-
      [Artikel 26, eerste lid, tweede en derde volzin, tweede lid, derde lid en vierde lid][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel26
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '5'
  - number: '27.3'
    text: |-
      Indien het negatieve buitenlands inkomen uit werk en woning niet bij voor bezwaar vatbare beschikking is
      vastgesteld, wordt het bedrag in het volgende jaar toch in aanmerking genomen als negatief bestanddeel van
      het buitenlands inkomen uit werk en woning. Het bedrag wordt niet meer in aanmerking genomen indien de termijn
      waarbinnen de inspecteur bevoegd is om een aanslag vast te stellen over het eerste jaar waarin een lager naar het
      volgend jaar over te brengen bedrag aan negatief buitenlands inkomen uit werk en woning bij voor bezwaar vatbare
      beschikking had moeten worden vastgesteld, met meer dan twee jaar is overschreden.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel27
  - number: '28.1'
    text: |-
      De inspecteur stelt de volgens de [artikelen 14][ref1], [14a][ref2], [17][ref3], [20][ref4] en [25a][ref5] over
      te brengen bedragen aan vanwege andere Mogendheden geheven belasting per artikel vast bij voor bezwaar vatbare
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0012095#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0012095#Artikel25a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '14'
