  - number: 13a.1
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting
      naar het inkomen, een vermindering van inkomstenbelasting verleend voor het in het inkomen uit werk en woning
      begrepen belastbare loon ter zake van een dienstbetrekking uitgeoefend aan boord van een zee- of luchtvaartuig in
      het internationale verkeer dat wordt geëxploiteerd door een onderneming waarvan de werkelijke leiding is gevestigd
      in een andere Mogendheid.
