  - number: '15.1'
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting,
      een vermindering van inkomstenbelasting verleend voor in het inkomen uit werk en woning, maar niet in enig in
      [artikel 9][ref1] bedoeld buitenlands inkomen uit werk en woning, begrepen dividenden, interest en royalty's,
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel9
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 15.1.a
    text: |-
      de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland is
      gevestigd of woont, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: 15.1.b
    text: |-
      de dividenden, interest en royalty's zijn onderworpen aan een belasting naar het inkomen die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: '15.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: 15.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: 15.2.b
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar zonder de toepassing van dit besluit volgens
      de [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit werk en woning verschuldigd zou zijn,
      in dezelfde verhouding staat als het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen
      dividenden, interest en royalty's staat tot het noemerinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '15.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt de belasting die vanwege andere Mogendheden is geheven
      over dividenden tot geen hoger bedrag in aanmerking genomen dan tot 15% van die dividenden.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: '15.4'
    text: |-
      Bij de toepassing van het tweede lid, onderdeel b, worden dividenden, interest en royalty’s verminderd met de
      daarmee verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
  - number: '15.5'
    text: |-
      [Artikel 10, vierde, vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel15
    references:
