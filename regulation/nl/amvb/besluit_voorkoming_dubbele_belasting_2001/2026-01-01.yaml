        paragraaf: '2'
        afdeling: '4'
  - number: '28.2'
    text: |-
      [Artikel 26, eerste lid, tweede en derde volzin, tweede lid, derde lid en vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel26
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '5'
  - number: 28a
    text: |-
      Indien een belastingplichtige op grond van enige bepaling in dit besluit in aanmerking komt voor een vermindering
      in verband met uit meer dan een Mogendheid genoten buitenlands inkomen of vanwege meer dan een Mogendheid geheven
      belasting en het gezamenlijke bedrag van de verminderingen ingevolge enig artikel in dit besluit is beperkt tot
      het bedrag van de inkomstenbelasting dat zonder toepassing van dit besluit verschuldigd zou zijn, worden deze
      verminderingen in aanmerking genomen met inachtneming van het volgende. Verminderingen die voortvloeien uit een
      andere regeling ter voorkoming van dubbele belasting gaan voor op de verminderingen die uitsluitend voortvloeien
      uit dit besluit. Vervolgens worden de verminderingen in aanmerking genomen in de volgorde die blijkt uit de overige
      bepalingen van dit besluit. Ten slotte worden de verminderingen in aanmerking genomen in volgorde van toenemende
      grootte. Ingeval de verminderingen even groot zijn, wordt van elk een evenredig gedeelte in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel28a
  - number: '29'
    text: |-
      Ingeval de belastingplichtige in een jaar anders dan door overlijden ophoudt binnenlands belastingplichtige te
      zijn, en binnen een termijn van acht jaren na afloop van dit jaar wederom binnenlands belastingplichtige wordt,
      worden de over het jaar voorafgaande aan het jaar waarin de binnenlandse belastingplicht is geëindigd volgens de
      [artikelen 26][ref1], [27][ref2] en [28][ref3] vastgestelde bedragen aan over te brengen buitenlands inkomen uit
      werk en woning, negatief buitenlands inkomen uit werk en woning en vanwege andere Mogendheden geheven belasting,
      aangemerkt als bedragen die in het jaar voorafgaande aan het opnieuw binnenlands belastingplichtig worden, zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel28
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '26'
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '27'
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: '28'
        hoofdstuk: '2'
        afdeling: '5'
  - number: '30'
    text: |-
      Een in Nederland wonende werknemer is vrijgesteld van de loonbelasting die betrekking heeft op door hem genoten
      loon waarop [artikel 9, eerste lid, onderdeel b][ref1], van toepassing is, en dat is onderworpen aan een belasting
      naar het inkomen die vanwege de andere Mogendheid als in dat artikel bedoeld wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel9
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '34'
    text: |-
      Op een volgens [artikel 34][ref1], zoals dat luidde op 31 december 2011, naar een jaar dat aanvangt op of na
      1 januari 2012 over te brengen bedrag aan vrij te stellen buitenlandse winst uit een Mogendheid, blijven de
      regels van dit besluit, zoals die luidden op 31 december 2011, van toepassing. Het naar een later jaar over te
      brengen bedrag aan buitenlandse winst wordt hierbij, in afwijking van artikel 34, eerste lid, zoals dat luidde
      op 31 december 2011, niet verminderd met negatieve buitenlandse winst uit die Mogendheid over een boekjaar dat
      aanvangt op of na 1 januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel34
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '34'
        hoofdstuk: IV
        afdeling: '1'
  - number: '36.1'
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting,
      een vermindering van vennootschapsbelasting verleend voor in de winst, maar niet in de winst uit een andere staat,
      bedoeld in [artikel 15e, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1], begrepen dividenden,
      interest en royalty's, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
  - number: 36.1.a
    text: |-
      de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland
      woont of gevestigd is, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
  - number: 36.1.b
    text: |-
      de dividenden, interest en royalty's zijn onderworpen aan een belasting naar de winst die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
  - number: '36.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
  - number: 36.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
  - number: 36.2.b
    text: |-
      Het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen dividenden,
      interest en royalty’s, vermenigvuldigd met het percentage van het hoogste tarief, bedoeld in
      [artikel 22 van de Wet op de vennootschapsbelasting 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
  - number: '36.3'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel a, wordt de belasting die vanwege andere Mogendheden is geheven
      over dividenden tot geen hoger bedrag in aanmerking genomen dan tot 15% van die dividenden.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
  - number: '36.4'
    text: |-
      Bij de toepassing van het tweede lid, onderdeel b, worden dividenden, royalty’s en interest
      verminderd met de daarmee verband houdende kosten. Tot de kosten, bedoeld in de eerste volzin,
      behoren ook de kosten die een met de belastingplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1] of een met de belastingplichtige
      verbonden natuurlijk persoon als bedoeld in artikel 10a, vijfde lid, van de Wet op de vennootschapsbelasting 1969,
      heeft gemaakt en die bij het bepalen van de in Nederland belastbare winst of het in Nederland belastbare inkomen
      van dat verbonden lichaam, onderscheidenlijk die natuurlijk persoon, in aftrek zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: '36.5'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: '36.6'
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere
      regelen ter voorkoming van dubbele belasting, ten hoogste het bedrag aan belasting dat volgens de
      [Wet op de vennootschapsbelasting 1969][ref1] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: 36a.1
    text: |-
      In afwijking in zoverre van [artikel 36, eerste lid][ref1], wordt aan een binnenlandse belastingplichtige, ter
      verrekening van vanwege een andere Mogendheid geheven belasting, een vermindering van vennootschapsbelasting
      verleend voor royalty’s waarop [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref2] van toepassing
      is, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel12b
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 12b
  - number: 36a.1.a
    text: de schuldenaar van de royalty’s in een ontwikkelingsland woont of gevestigd is, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.1.b
    text: |-
      de royalty’s zijn onderworpen aan een belasting naar de winst die vanwege dat ontwikkelingsland, al dan niet aan de
      bron, wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.2
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.2.b
    text: het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen royalty’s, vermenigvuldigd met 9/100.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Bij de toepassing van het tweede lid, onderdeel b, worden royalty’s verminderd met de daarmee verband houdende
      kosten.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
  - number: 36a.4
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 36a.5
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de vermindering volgens andere regelen ter
      voorkoming van dubbele belasting en volgens de [artikelen 36][ref1] en [36c][ref2], ten hoogste het bedrag aan
      verschuldigde vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel36c
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 36c
        hoofdstuk: IV
        afdeling: '2'
  - number: 36b
    text: |-
      [Artikel 36a][ref1] is van overeenkomstige toepassing op royalty’s waarop
      [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref2], zoals dat luidde op 31 december 2016, toepassing
      vindt.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36a
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel12b
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 36a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: 12b
  - number: 36c.1
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting,
      een vermindering van vennootschapsbelasting verleend voor in de winst, maar niet in de winst uit een andere staat,
      bedoeld in [artikel 15e, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1], begrepen voordelen en
      inkomsten uit persoonlijke werkzaamheden verricht door een artiest of sportbeoefenaar binnen het gebied van de
      andere Mogendheid, mits die voordelen en inkomsten zijn onderworpen aan een belasting naar de winst die vanwege de
      andere Mogendheid, al dan niet aan de bron, wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15e
  - number: 36c.2
    text: 'Het bedrag van de vermindering, bedoeld in het eerste lid, is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
  - number: 36c.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
  - number: 36c.2.b
    text: |-
      het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen voordelen
      en inkomsten, vermenigvuldigd met het percentage van het hoogste tarief, bedoeld in
      [artikel 22 van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel22
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '22'
  - number: 36c.3
    text: |-
      Bij de toepassing van het tweede lid, onderdeel b, worden de voordelen en inkomsten
      verminderd met de daarmee verband houdende kosten. Tot de kosten, bedoeld in de eerste zin,
      behoren ook de kosten die een met de belastingplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref1] of een met de belastingplichtige
      verbonden natuurlijk persoon als bedoeld in artikel 10a, vijfde lid, van de Wet op de vennootschapsbelasting 1969
      heeft gemaakt en die bij het bepalen van de in Nederland belastbare winst of het in Nederland belastbare inkomen
      van dat verbonden lichaam, onderscheidenlijk die natuurlijk persoon, in aftrek zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 10a
  - number: 36c.4
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing, met dien verstande dat daarbij voor dividenden, interest
      of royalty’s wordt gelezen: voordelen en inkomsten uit persoonlijke werkzaamheden verricht door een artiest of
      sportbeoefenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 36c.5
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere
      regelen ter voorkoming van dubbele belasting, ten hoogste het bedrag aan belasting dat volgens de
      [Wet op de vennootschapsbelasting 1969][ref1] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel36c
    references:
      - id: ref1
        bwb_id: BWBR0002672
  - number: '37'
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting als bedoeld in de [artikelen 36][ref1],
      [36a][ref2] en [36c][ref3] dat door de toepassing van [artikel 36, tweede lid, onderdeel b, of zesde lid][ref4],
      artikel 36a, tweede lid, onderdeel b, of vijfde lid, onderscheidenlijk door de toepassing van artikel 36c, tweede
      lid, onderdeel b, of vijfde lid, niet leidt tot een vermindering van vennootschapsbelasting over dat jaar, wordt
      aangemerkt als vanwege andere Mogendheden geheven belasting van het daaropvolgende jaar. Deze voortwenteling vindt
      alleen plaats indien het naar het volgende jaar over te brengen bedrag door de inspecteur is vastgesteld bij voor
      bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel36c
      [ref4]: https://wetten.overheid.nl/BWBR0012095#Artikel36
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 36a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 36c
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
  - number: '38'
    text: |-
      Op schriftelijk verzoek van de belastingplichtige blijft [artikel 36][ref1] of [artikel 36c][ref2] buiten
      toepassing voor de in een jaar genoten dividenden, interest en royalty's als bedoeld in artikel 36 en voor de
      daarover vanwege ontwikkelingslanden geheven belasting, onderscheidenlijk de in een jaar genoten voordelen en
      inkomsten uit persoonlijke werkzaamheden verricht door een artiest of sportbeoefenaar als bedoeld in artikel 36c en
      voor de daarover vanwege andere Mogendheden geheven belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel36c
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: 36c
        hoofdstuk: IV
        afdeling: '2'
  - number: '44.1'
    text: |-
      De inspecteur stelt het volgens [artikel 37][ref1] over te brengen bedrag aan vanwege andere Mogendheden geheven
      belasting vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel37
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '37'
        hoofdstuk: IV
        afdeling: '2'
  - number: '44.2'
    text: |-
      De in het eerste lid bedoelde vaststelling gebeurt gelijktijdig met het vaststellen van de aanslag over dat jaar.
      Het bedrag van de naar het volgende jaar over te brengen belasting wordt op het aanslagbiljet afzonderlijk vermeld.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: '44.3'
    text: 'Rechtsmiddelen tegen een beschikking als bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.3.a
    text: de grootte van het over te brengen bedrag aan belasting voor zover dat niet eerder is vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.3.b
    text: |-
      de toepassing van [artikel 44a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel44a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: 44a
        hoofdstuk: IV
        afdeling: '3'
  - number: '44.4'
    text: 'Het bedrag aan over te brengen belasting kan worden herzien of alsnog worden vastgesteld, indien:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.4.a
    text: een aanslag wordt verminderd wegens de verrekening van verliezen uit andere jaren;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.4.b
    text: de inspecteur een navorderingsaanslag vaststelt;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.4.c
    text: de inspecteur een beschikking herziet waarin het bedrag van een verlies wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: 44.4.d
    text: |-
      enig feit grond oplevert voor het vermoeden dat het bedrag van de over te brengen belasting te hoog is vastgesteld,
      waarbij de herziening alleen kan plaatsvinden voor in de beschikking opgenomen vanwege een buitenlandse Mogendheid
      geheven belasting in een van de twaalf voorafgaande jaren.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
  - number: '44.5'
    text: |-
      In afwijking in zoverre van [artikel 37, eerste lid, tweede volzin][ref1], wordt, indien het vierde lid toepassing
      vindt, het herziene of het alsnog vastgestelde bedrag aan belasting dat naar het volgende jaar wordt overgebracht,
      in het volgend jaar in aanmerking genomen zonder dat dit bedrag vooraf door de inspecteur bij voor bezwaar vatbare
      beschikking is vastgesteld. De vorige volzin vindt overeenkomstige toepassing voor zover de herziening gevolgen
      heeft voor bedragen die worden overgebracht naar jaren waarvoor al een aanslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel37
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '37'
        hoofdstuk: IV
        afdeling: '2'
  - number: 44a
    text: |-
      Indien een belastingplichtige op grond van enige bepaling in dit besluit in aanmerking komt voor een vermindering
      in verband met vanwege meer dan een Mogendheid geheven belasting en het gezamenlijke bedrag van de verminderingen
      ingevolge enig artikel in dit besluit is beperkt tot het bedrag van de vennootschapsbelasting dat zonder toepassing
      van dit besluit verschuldigd zou zijn, worden deze verminderingen in aanmerking genomen met inachtneming van het
      volgende. Verminderingen die voortvloeien uit een andere regeling ter voorkoming van dubbele belasting gaan voor op
      de verminderingen die uitsluitend voortvloeien uit dit besluit. Vervolgens worden de verminderingen in aanmerking
      genomen in de volgorde die blijkt uit de overige bepalingen van dit besluit. Ten slotte worden de verminderingen in
      aanmerking genomen in volgorde van toenemende grootte. Ingeval de verminderingen even groot zijn, wordt van elk een
      evenredig gedeelte in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel44a
  - number: '45'
    text: |-
      Ingeval de belastingplichtige in een jaar anders dan door liquidatie ophoudt binnenlands belastingplichtige te
      zijn, en binnen een termijn van acht jaren na afloop van dit jaar wederom binnenlands belastingplichtige wordt,
      worden de over het jaar voorafgaande aan het jaar waarin de binnenlandse belastingplicht is geëindigd volgens
      [artikel 44][ref1] vastgestelde bedrag aan over te brengen vanwege andere Mogendheden geheven belasting, aangemerkt
      als bedragen die in het jaar voorafgaande aan het opnieuw binnenlands belastingplichtig worden, zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel44
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '44'
        hoofdstuk: IV
        afdeling: '3'
  - number: '46.1'
    text: |-
      Indien aannemelijk is dat in vergelijking met het begin van het oudste jaar waarvan een naar het volgende
      jaar voort te wentelen bedrag aan niet verrekende vanwege andere Mogendheden geheven belasting bedoeld in
      [artikel 37][ref1] in een later jaar nog niet volledig tot een vermindering heeft geleid, het uiteindelijke belang
      in de belastingplichtige in belangrijke mate is gewijzigd, wordt met ingang van het jaar waarin de wijziging heeft
      plaatsgevonden, het voort te wentelen bedrag aan niet verrekende vanwege andere Mogendheden geheven belasting
      van het daaraan voorafgaande jaar niet meer bij de berekening van de vermindering, bedoeld in [artikel 36][ref2],
      [artikel 36a][ref3], onderscheidenlijk [artikel 36c][ref4], in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0012095#Artikel36c
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '37'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '36'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: 36a
        hoofdstuk: IV
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0012095
        artikel: 36c
        hoofdstuk: IV
        afdeling: '2'
  - number: '46.2'
    text: |-
      __REF000___________________________________________________________________________________________________________
      _____________________________________ is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel20a
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 20a
  - number: '46.3'
    text: |-
      [Artikel 15ae van de Wet op de vennootschapsbelasting 1969][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15ae
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 15ae
  - number: '47.1'
    text: |-
      Bij een verkrijging krachtens erfrecht door het overlijden van iemand die ten tijde van dat overlijden in
      Nederland woonde, wordt ter verrekening van vanwege een andere Mogendheid geheven belasting een vermindering
      verleend van de erfbelasting voor de in de verkrijging begrepen bezittingen behorende tot een door hem
      gedreven buitenlandse onderneming als bedoeld in [artikel 9, eerste lid, onderdeel a][ref1], en voor de
      in de verkrijging begrepen onroerende zaken die binnen het gebied van een andere Mogendheid zijn gelegen
      en rechten waaraan deze zijn onderworpen, voorzover de verkrijging van vorenbedoelde bezittingen aan een
      gelijksoortige belasting is onderworpen die vanwege een andere Mogendheid als daar bedoeld wordt geheven. Deze
      bepaling geldt niet bij een verkrijging krachtens erfrecht door het overlijden van iemand die op grond van
      [artikel 3, eerste lid, van de Successiewet 1956][ref2] geacht wordt ten tijde van het overlijden in Nederland te
      hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '3'
  - number: '47.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: 47.2.a
    text: het bedrag van de vanwege de andere Mogendheid geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: 47.2.b
    text: |-
      het bedrag dat tot de erfbelasting die volgens de [Successiewet 1956](onbekend) verschuldigd zou zijn zonder
      toepassing van dit besluit, in dezelfde verhouding staat als de gezamenlijke waarde van de in de verkrijging
      begrepen, in het eerste lid bedoelde, bezittingen in de andere Mogendheid staat tot de waarde van alle verkregen
      bezittingen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: '47.3'
    text: 'Voor de toepassing van het tweede lid wordt:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: 47.3.a
    text: |-
      de waarde van de in het eerste lid bedoelde bezittingen verminderd met de waarde van de schulden in verband met
      die bezittingen;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: 47.3.b
    text: |-
      de waarde van alle verkregen bezittingen verminderd met de waarde van alle schulden die op grond
      van de [Successiewet 1956](onbekend) in aftrek komen en verminderd met de vrijstellingen, bedoeld in
      [artikel 32 van de Successiewet 1956][ref1], voorzover belastingplichtige daarvoor in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel32
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '32'
  - number: '47.4'
    text: |-
      De vermindering volgens dit artikel bedraagt ten hoogste het bedrag aan erfbelasting dat volgens de [Successiewet
      1956](onbekend) verschuldigd zou zijn zonder de toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: '47.5'
    text: 'Met onroerende zaken als bedoeld in het eerste lid worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
  - number: 47.5.a
    text: |-
      de – niet tot een buitenlandse onderneming, als bedoeld in artikel 9, eerste lid, onderdeel a, behorende –
      economische eigendom, bedoeld in [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1], van de
      binnen het gebied van een andere Mogendheid gelegen onroerende zaken of rechten waaraan deze zijn onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: 47.5.b
    text: |-
      aandelen in lichamen en lidmaatschapsrechten als bedoeld in
      [artikel 4 van de Wet op belastingen van rechtsverkeer][ref1], welke onroerende zaken en in dit artikel daarmee
      gelijkgestelde goederen binnen het gebied van een andere Mogendheid vertegenwoordigen. De waarde van de aandelen en
      lidmaatschapsrechten is gelijk aan de waarde van de onroerende zaken en daarmee gelijkgestelde goederen die door de
      aandelen en lidmaatschapsrechten middellijk of onmiddellijk worden vertegenwoordigd, verminderd met de waarde van
      de schulden in verband met die zaken en goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel4
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '4'
  - number: '47.6'
    text: |-
      Indien [artikel 12, eerste lid, tweede volzin, van de Successiewet 1956][ref1] van toepassing is op een schenking
      en deze toepassing tot dubbele belasting leidt, wordt voor de toepassing van dit artikel de vanwege een andere
      Mogendheid geheven belasting ter zake van die schenking geacht gelijksoortig te zijn aan de erfbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel12
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '12'
  - number: '47.7'
    text: |-
      Indien [artikel 16 van de Successiewet 1956][ref1] van toepassing is op de aldaar bedoelde bezittingen en schulden
      en deze toepassing tot dubbele belasting leidt met betrekking tot die bezittingen en schulden, wordt voor de
      toepassing van dit artikel de vanwege een andere Mogendheid geheven, vervangende erfbelasting ter zake van die
      bezittingen en schulden toegerekend aan de erfgenamen van de erflater op basis van dezelfde verdeling als die in
      artikel 16 van de Successiewet 1956 en geacht gelijksoortig te zijn aan de erfbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '16'
  - number: '48.1'
    text: |-
      Bij een verkrijging krachtens erfrecht door het overlijden van iemand die op grond van
      [artikel 3, eerste lid, van de Successiewet 1956][ref1] geacht wordt ten tijde van het overlijden in Nederland te
      hebben gewoond, wordt ter verrekening van vanwege een andere Mogendheid geheven belasting, een vermindering van
      de erfbelasting verleend voor in die verkrijging begrepen bezittingen, voorzover ter zake van de verkrijging van
      die bezittingen vanwege een andere Mogendheid, waarin de erflater ten tijde van het overlijden zijn daadwerkelijke
      woonplaats had, een gelijksoortige belasting is geheven. Voorts wordt een vermindering van de erfbelasting verleend
      voor in die verkrijging begrepen bezittingen, behorende tot een door hem gedreven buitenlandse onderneming als
      bedoeld in [artikel 9, eerste lid, onderdeel a][ref2], en voor in de verkrijging begrepen onroerende zaken als
      bedoeld in [artikel 47][ref3] die binnen het gebied van een andere Mogendheid zijn gelegen en rechten waaraan
      deze zijn onderworpen, voorzover de verkrijging van vorenbedoelde bezittingen aan een gelijksoortige belasting is
      onderworpen die vanwege een andere Mogendheid als daar bedoeld wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel47
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
  - number: '48.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: 48.2.a
    text: het bedrag van de vanwege de andere Mogendheid geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: 48.2.b
    text: |-
      het bedrag dat tot de erfbelasting die volgens de [Successiewet 1956](onbekend) verschuldigd zou zijn zonder
      toepassing van dit besluit, in dezelfde verhouding staat als de gezamenlijke waarde van de in de verkrijging
      begrepen, in het eerste lid van dit artikel bedoelde, bezittingen staat tot de waarde van alle verkregen
      bezittingen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: '48.3'
    text: 'Voor de toepassing van het tweede lid wordt:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: 48.3.a
    text: de waarde van de in het eerste lid bedoelde bezittingen verminderd met de waarde van alle schulden;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: 48.3.b
    text: |-
      de waarde van alle verkregen bezittingen verminderd met de waarde van alle verkregen schulden en verminderd met de
      vrijstellingen, bedoeld in [artikel 32 van de Successiewet 1956][ref1], voorzover belastingplichtige daarvoor in
      aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel32
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '32'
  - number: '48.4'
    text: |-
      De vermindering volgens dit artikel bedraagt ten hoogste het bedrag aan erfbelasting dat volgens de [Successiewet
      1956](onbekend) verschuldigd zou zijn zonder de toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
  - number: '48.5'
    text: |-
      Indien [artikel 12, eerste lid, tweede volzin, van de Successiewet 1956][ref1] van toepassing is op een schenking
      en deze toepassing tot dubbele belasting leidt, wordt voor de toepassing van dit artikel de vanwege een andere
      Mogendheid geheven belasting ter zake van die schenking geacht gelijksoortig te zijn aan de erfbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel12
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '12'
  - number: '48.6'
    text: |-
      Indien [artikel 16 van de Successiewet 1956][ref1] van toepassing is op de aldaar bedoelde bezittingen en schulden
      en deze toepassing tot dubbele belasting leidt met betrekking tot die bezittingen en schulden, wordt voor de
      toepassing van dit artikel de vanwege een andere Mogendheid geheven, vervangende erfbelasting ter zake van die
      bezittingen en schulden toegerekend aan de erfgenamen van de erflater op basis van dezelfde verdeling als die in
      artikel 16 van de Successiewet 1956 en geacht gelijksoortig te zijn aan de erfbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel16
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '16'
  - number: '49'
    text: |-
      Indien een verkrijging van een erflater die ten tijde van het overlijden in Nederland woonde, bezittingen omvat
      welke zich binnen het gebied van een andere Mogendheid bevinden en niet op grond van de [artikelen 47][ref1] en
      [48][ref2] aanspraak bestaat op een vermindering ter voorkoming van dubbele belasting, wordt bij het bepalen van de
      waarde van die verkrijging een vanwege die andere Mogendheid over deze bezittingen geheven gelijksoortige belasting
      in mindering gebracht op die verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel48
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '48'
        hoofdstuk: V
  - number: '50'
    text: |-
      De verminderingen bedoeld in de [artikelen 47 tot en met 49][ref1] worden per verkrijger berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
  - number: '51.1'
    text: |-
      De [artikelen 47 tot en met 50][ref1] vinden overeenkomstige toepassing met betrekking tot de schenkbelasting, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
  - number: 51.1.a
    text: |-
      voor de overeenkomstige toepassing van [artikel 47, tweede lid, onderdeel b][ref1], en
      [artikel 48, tweede lid, onderdeel b][ref2], de waarde van alle verkregen bezittingen tevens wordt verminderd met
      de vrijstellingen, bedoeld in [artikel 33 van de Successiewet 1956][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel33
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '48'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '33'
  - number: 51.1.b
    text: |-
      [artikel 47, zevende lid][ref1], en [artikel 48, zesde lid][ref2], van overeenkomstige toepassing zijn, indien
      [artikel 17 van de Successiewet 1956][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0002226#Artikel17
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '47'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '48'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0002226
        artikel: '17'
  - number: '51.2'
    text: |-
      [Artikel 48][ref1] is van overeenkomstige toepassing op schenkingen door een schenker die op grond van
      [artikel 3, tweede lid, van de Successiewet 1956][ref2] geacht wordt ten tijde van de schenking in Nederland te
      hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002226#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '48'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002226
        artikel: '3'
  - number: '52.1'
    text: |-
      Een in Nederland wonende of gevestigde gerechtigde tot een prijs van een buitenlands kansspel is vrijgesteld van de
      daarop betrekking hebbende kansspelbelasting, indien die prijs is onderworpen aan een gelijksoortige belasting, die
      vanwege een andere Mogendheid wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel52
  - number: '52.2'
    text: Het eerste lid vindt geen toepassing, indien de prijs als winst uit onderneming moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel52
  - number: '53.1'
    text: |-
      Aan een belastingplichtige waarvan de financiële gegevens zijn opgenomen in een geconsolideerde jaarrekening die
      is opgesteld door een in een andere Mogendheid gevestigd lichaam wordt, ter verrekening van vanwege die andere
      Mogendheid geheven belasting, een vermindering van bankenbelasting verleend indien de activa of passiva van de
      belastingplichtige in aanmerking zijn genomen bij de vanwege die andere Mogendheid geheven, aan de bankenbelasting
      soortgelijke, belasting.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel53
  - number: '53.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het kalenderjaar
      vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting dat toerekenbaar is aan de
      bij die heffing in aanmerking genomen activa of passiva van de belastingplichtige. De vermindering volgens dit
      artikel bedraagt ten hoogste het bedrag aan belasting dat volgens de [Wet bankenbelasting][ref1] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0031796
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031796
  - number: '53.3'
    text: |-
      Het eerste lid vindt alleen toepassing indien de aldaar bedoelde andere Mogendheid een overeenkomstige verrekening
      van Nederlandse bankenbelasting geeft aan een in die Mogendheid gevestigd lichaam dat aldaar is onderworpen aan een
      soortgelijke belasting en waarvan de financiële gegevens zijn opgenomen in een geconsolideerde jaarrekening die is
      opgesteld door een in Nederland gevestigd lichaam dat belastingplichtig is voor de bankenbelasting.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel53
  - number: '53.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de bepaling van het gedeelte van de door een andere Mogendheid
      geheven soortgelijke belasting dat toerekenbaar is aan de bij die heffing in aanmerking genomen activa of passiva
      van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel53
  - number: '54.1'
    text: |-
      Aan een belastingplichtige met zetel in een andere Mogendheid en met een bijkantoor in Nederland wordt, ter
      verrekening van vanwege die andere Mogendheid geheven belasting, een vermindering van bankenbelasting verleend
      indien de aan het bijkantoor toe te rekenen activa of passiva van de belastingplichtige in aanmerking zijn genomen
      bij de vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel54
  - number: '54.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het kalenderjaar
      vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting dat toerekenbaar is aan
      de bij die heffing in aanmerking genomen aan het bijkantoor in Nederland toe te rekenen activa of passiva van de
      belastingplichtige. De vermindering volgens dit artikel bedraagt ten hoogste het bedrag aan belasting dat volgens
      de [Wet bankenbelasting][ref1] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0031796
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0031796
  - number: '54.3'
    text: |-
      Het eerste lid vindt alleen toepassing indien de aldaar bedoelde andere Mogendheid een overeenkomstige verrekening
      van Nederlandse bankenbelasting geeft aan een in Nederland gevestigde belastingplichtige met een bijkantoor in die
      Mogendheid die aldaar is onderworpen aan een soortgelijke belasting.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel54
  - number: '54.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de bepaling van het gedeelte van de door een andere Mogendheid
      geheven soortgelijke belasting dat toerekenbaar is aan de bij die heffing in aanmerking genomen aan het bijkantoor
      in Nederland toe te rekenen activa of passiva van de belastingplichtige.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel54
  - number: '55'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen aan de in [artikel 53, derde lid][ref1],
      onderscheidenlijk [artikel 54, derde lid][ref2], gestelde voorwaarden in ieder geval wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel54
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '53'
        hoofdstuk: VIa
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '54'
        hoofdstuk: VIa
  - number: '59.1'
    text: Het Besluit voorkoming dubbele belasting 1989 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel59
  - number: '59.2'
    text: |-
      Het in het eerste lid genoemde besluit vindt voor de toepassing van de vennootschapsbelasting nog toepassing op het
      jaar dat is aangevangen voor 1 januari 2001 en dat na die datum eindigt.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel59
  - number: '60.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel60
  - number: '60.2'
    text: |-
      Voor de heffing van de vennootschapsbelasting vindt dit besluit voor het eerst toepassing met ingang van het jaar
      dat met of in 2001 aanvangt.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel60
  - number: '60.3'
    text: |-
      Voor de heffing van de schenk- en erfbelasting vindt dit besluit toepassing, indien het overlijden, de schenking
      of de in [artikel 45, tweede lid, tweede zin, of de in artikel 53, eerste lid, van de Successiewet 1956][ref1]
      bedoelde gebeurtenis plaatsvindt op of na het tijdstip van de inwerkingtreding van dit besluit, zomede indien op of
      na dat tijdstip krachtens schenking wordt verkregen ten gevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002226
        artikel: '45'
  - number: '61'
    text: 'Dit besluit wordt aangehaald als: Besluit voorkoming dubbele belasting 2001.'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel61
