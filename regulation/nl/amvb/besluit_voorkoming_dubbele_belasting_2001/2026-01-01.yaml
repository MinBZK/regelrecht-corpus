preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën 20 november 2000, nr. IFZ2000/1293M, Directoraat-Generaal
    voor Fiscale Zaken, Directie Internationale Fiscale Zaken;

    Gelet op artikel 38, eerste lid, van de Algemene wet inzake rijksbelastingen;

    De Raad van State gehoord (advies van 13 december 2000, nr. W06.000541/IV);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 19 december 2000, nr. IFZ2000/1397U,
    Directoraat-Generaal voor Fiscale Zaken, Directie Internationale Fiscale Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Dit besluit is van toepassing voor de heffing van de navolgende belastingen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.a
    text: inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.b
    text: loonbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.c
    text: vennootschapsbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.d
    text: erfbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.e
    text: schenkbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.f
    text: kansspelbelasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: 1.1.g
    text: bankenbelasting.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit vindt slechts toepassing voorzover niet op andere wijze in het voorkomen van dubbele belasting is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel1
  - number: '2'
    text: |-
      In dit besluit wordt onder vaste inrichting verstaan een vaste inrichting als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______9.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '3'
  - number: '3.1'
    text: 'In dit besluit wordt onder Mogendheid mede verstaan: een bestuurlijke eenheid.'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen worden de landen van het Koninkrijk der
      Nederlanden aangemerkt als afzonderlijke Mogendheden.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel3
  - number: '4'
    text: |-
      In dit besluit wordt onder gebied van een andere Mogendheid verstaan: het grondgebied van die Mogendheid,
      daaronder begrepen het gebied buiten de territoriale zee van die Mogendheid waar deze in overeenstemming met het
      internationale recht soevereine rechten kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel4
  - number: '5'
    text: 'In dit besluit wordt:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.a
    text: |-
      onder dividenden verstaan: voordelen uit aandelen, winstbewijzen of andere rechten, met uitzondering van
      schuldvorderingen, die aanspraak geven op een aandeel in de winst van vennootschappen waarvan het kapitaal geheel
      of ten dele in aandelen is verdeeld;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.b
    text: |-
      onder interest verstaan: voordelen uit overheidsleningen, obligaties of schuldbewijzen en andere schuldvorderingen
      van welke aard ook, al dan niet aanspraak gevende op een aandeel in de winst;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.c
    text: 'onder royalty''s verstaan: vergoedingen van welke aard ook voor:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.c.1°
    text: |-
      het gebruik van, of het recht op gebruik van, een auteursrecht op een werk op het gebied van de wetenschap, een
      octrooi, een fabrieks- of handelsmerk, een tekening of model, een plan, een geheim recept of werkwijze;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.c.2°
    text: het gebruik van, of het recht van gebruik van, nijverheids- en handelsuitrusting of wetenschappelijke uitrusting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.c.3°
    text: inlichtingen omtrent ervaringen op het gebied van nijverheid, handel of wetenschap, of
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: 5.c.4°
    text: het verlenen van technische diensten in een ontwikkelingsland.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      Voor de toepassing van dit besluit worden als ontwikkelingslanden aangewezen de Mogendheden die zijn opgenomen in
      de door het «Development Assistance Committee» van de Organisatie voor Economische Samenwerking en Ontwikkeling
      meest recent vastgestelde «List of Recipients of Official Development Assistance», met uitzondering van de daarin
      opgenomen hoge middeninkomenslanden. Deze aanwijzing is voor Mogendheden die in de loop van een kalenderjaar worden
      aangewezen, van kracht met ingang van het kalenderjaar volgend op het kalenderjaar van bekendmaking van genoemde
      lijst.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: '6.2'
    text: 'In afwijking van het eerste lid worden eveneens als ontwikkelingsland aangewezen de Mogendheden die:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: 6.2.a
    text: als hoge middeninkomenslanden zijn opgenomen op de lijst, bedoeld in het eerste lid; en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: 6.2.b
    text: als ontwikkelingsland waren aangewezen bij dit artikel zoals dat luidde op 31 december 2016; en
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: 6.2.c
    text: |-
      worden aangewezen als landen waarop een door Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking
      krachtens [artikel 3 van de Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref1] genomen besluit met het oog
      op het financieren van activiteiten van het midden- en kleinbedrijf dat ontwikkelingsrelevante investeringen wil
      doen, van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010178#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010178
        artikel: '3'
  - number: '6.3'
    text: |-
      Een Mogendheid die ingevolge het eerste en tweede lid in de loop van een kalenderjaar, ten opzichte van het daaraan
      voorgaande kalenderjaar ingevolge het eerste of tweede lid niet meer als ontwikkelingsland is aangewezen, wordt
      voor de toepassing van dit besluit nog als ontwikkelingsland aangemerkt gedurende dat jaar en de daaropvolgende
      twee kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: '6.4'
    text: |-
      Voorts worden voor de jaren 2017 en 2018 als ontwikkelingsland aangewezen: Belize, Botswana, Costa Rica, Cuba,
      Dominica, de Dominicaanse Republiek, Ecuador, Fiji, Grenada, Iran, Irak, Jamaica, de Malediven, de Marshall
      eilanden, Namibië, de Palau-eilanden, St. Vincent and the Grenadines en Tonga.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: '6.5'
    text: |-
      De termijn, bedoeld in het derde of vierde lid, kan met betrekking tot een Mogendheid bij regeling van Onze
      Minister van Financiën, na overleg met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking, worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Voor de toepassing van dit hoofdstuk blijft te conserveren inkomen en de daarover verschuldigde belasting buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een binnenlandse belastingplichtige is vrijgesteld van de inkomstenbelasting die betrekking heeft op buitenlands
      inkomen uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vrijstelling vindt geen toepassing voor het inkomen dat betrekking
      heeft op een buiten beschouwing blijvende vaste inrichting als bedoeld in
      [artikel 12ac, eerste lid, onderdeel b, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel12ac
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 12ac
  - number: '9.1'
    text: |-
      Het buitenlandse inkomen uit werk en woning uit een andere Mogendheid bestaat uit het gezamenlijke bedrag van
      hetgeen de belastingplichtige als bestanddeel van het inkomen uit werk en woning uit die Mogendheid geniet als:
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9.1.a
    text: |-
      belastbare winst uit buitenlandse onderneming, zijnde een onderneming die, of het gedeelte van een onderneming dat,
      wordt gedreven met behulp van een vaste inrichting binnen het gebied van de andere Mogendheid;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9.1.b
    text: |-
      belastbaar loon ter zake van het binnen het gebied van de andere Mogendheid in privaatrechtelijke dienstbetrekking
      verrichten of hebben verricht van arbeid;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9.1.c
    text: |-
      belastbaar loon ter zake van het in publiekrechtelijke dienstbetrekking tot een binnen het gebied van de andere
      Mogendheid gevestigde publiekrechtelijke rechtspersoon verrichten of hebben verricht van arbeid, waarbij het loon
      ten laste komt van die rechtspersoon of van een door zulk een rechtspersoon in het leven geroepen fonds;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9.1.d
    text: |-
      opbrengsten, verminderd met de in aftrek te brengen kosten, van onroerende zaken die binnen het gebied van de
      andere Mogendheid zijn gelegen of van rechten waaraan deze zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9.1.e
    text: |-
      belastbare periodieke uitkeringen en verstrekkingen op grond van een publiekrechtelijke regeling ten laste van een
      binnen het gebied van de andere Mogendheid gevestigde publiekrechtelijke rechtspersoon of van een door een zodanige
      rechtspersoon in het leven geroepen fonds, voorzover deze inkomensbestanddelen zijn onderworpen aan een belasting
      naar het inkomen die vanwege die andere Mogendheid wordt geheven.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Werkzaamheden die in het kader van een onderneming worden verricht gedurende een aaneengesloten periode van ten
      minste 30 dagen in, op of boven het winningsgebied van de andere Mogendheid, vormen een buitenlandse onderneming.
      Het winningsgebied van de andere Mogendheid bestaat uit de territoriale zee van die Mogendheid alsmede het buiten
      de territoriale zee gelegen deel van de zeebodem en de ondergrond daarvan, voorzover die andere Mogendheid daar
      op grond van het internationale recht rechten mag uitoefenen op het gebied van de exploratie en exploitatie van
      natuurlijke rijkdommen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij het bepalen van de winst uit een buitenlandse onderneming worden aan die buitenlandse onderneming de voordelen
      toegerekend die deze geacht zou worden te behalen – in het bijzonder bij haar handelen met andere onderdelen van
      de onderneming –, indien zij een zelfstandige en onafhankelijke onderneming zou zijn, die dezelfde of soortgelijke
      werkzaamheden zou uitoefenen onder dezelfde of soortgelijke omstandigheden, hierbij in aanmerking nemende de door
      de belastingplichtige door middel van de buitenlandse onderneming en andere delen van de onderneming uitgeoefende
      functies, gebruikte activa en gelopen risico’s.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.4'
    text: |-
      Het in het eerste lid, onderdeel b, bedoelde loon wordt bij arbeid die korter dan dertig dagen aaneengesloten
      binnen het gebied van de andere Mogendheid is verricht, alleen beschouwd te zijn onderworpen aan een belasting
      naar het inkomen die vanwege die Mogendheid wordt geheven indien blijkt dat ter zake hiervan aan die Mogendheid
      belasting is betaald.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.5'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel c, is, indien het aldaar bedoelde loon wordt genoten ter zake
      van het verrichten of verricht hebben van arbeid ten behoeve van een onderneming, op dit loon het bepaalde in het
      eerste lid, onderdeel b, van toepassing.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.6'
    text: |-
      In afwijking in zoverre van het eerste lid behoren door een belastingplichtige verkregen voordelen en inkomsten
      uit het door de belastingplichtige of een ander als artiest of sportbeoefenaar verrichten van persoonlijke
      werkzaamheden binnen het gebied van de andere Mogendheid, niet tot het buitenlandse inkomen uit werk en woning uit
      die Mogendheid.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: '9.7'
    text: |-
      Indien de belastingplichtige de onderneming van een vennootschap waarvan hij aandelen of
      winstbewijzen houdt, in het kader van de ontbinding van die vennootschap met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1], voortzet of mede voortzet, wordt op het tijdstip
      van voortzetting mede als winst uit buitenlandse onderneming uit een Mogendheid aangemerkt 20/45 deel van het aan
      het aandeel van de belastingplichtige in de vennootschap toe te rekenen deel van het volgens [artikel 34][ref2]
      zoals dat luidde op 31 december 2011, vastgestelde bedrag aan winst uit buitenlandse onderneming uit die Mogendheid
      van de vennootschap na toepassing van genoemd artikel 14c, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel34
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: 14c
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '34'
        hoofdstuk: IV
        afdeling: '1'
  - number: '9.8'
    text: |-
      In afwijking in zoverre van het eerste lid wordt tot het buitenlandse inkomen uit werk en woning uit een andere
      Mogendheid niet gerekend, het door een belastingplichtige genoten belastbare loon ter zake van een dienstbetrekking
      uitgeoefend aan boord van een zee- of luchtvaartuig in het internationale verkeer dat wordt geëxploiteerd door een
      onderneming waarvan de werkelijke leiding is gevestigd in een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9
  - number: 9a.1
    text: |-
      Bij het bepalen van de belastbare winst uit buitenlandse onderneming, bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref1], wordt de ondernemersaftrek, bedoeld in
      [artikel 3.74 van de Wet inkomstenbelasting 2001][ref2], in aanmerking genomen voor een bedrag dat tot de
      ondernemersaftrek waarop de belastingplichtige in dat jaar recht heeft, in dezelfde verhouding staat als
      de winst uit buitenlandse onderneming, voor aftrek van de ondernemersaftrek, staat tot de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9a.2
    text: |-
      Indien de winst, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1], positief is en de buitenlandse
      winst negatief, wordt deze laatste voor de toepassing van het eerste lid op nihil gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9a.3
    text: |-
      Indien de buitenlandse winst groter is dan de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1], wordt de ondernemersaftrek bij de bepaling van de
      belastbare winst uit buitenlandse onderneming in zijn geheel in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9a.4
    text: |-
      Indien de buitenlandse winst negatief is en de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1], lager is dan de buitenlandse winst wordt de
      ondernemersaftrek bij de bepaling van de belastbare winst uit buitenlandse onderneming voor de helft in aanmerking
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '10.1'
    text: |-
      De in [artikel 8][ref1] bedoelde vrijstelling voor buitenlands inkomen uit werk en woning wordt voor elke
      Mogendheid waaruit de belastingplichtige zodanig inkomen geniet afzonderlijk toegepast door een vermindering te
      verlenen op de verschuldigde inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel8
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde vermindering is gelijk aan het bedrag dat tot de belasting die zonder de toepassing
      van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit werk en woning
      verschuldigd zou zijn, in dezelfde verhouding staat als het buitenlands inkomen uit werk en woning uit een
      Mogendheid staat tot het noemerinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '10.3'
    text: |-
      De vermindering, dan wel, ingeval de belastingplichtige uit meer dan een Mogendheid buitenlands inkomen uit werk
      en woning geniet, het gezamenlijke bedrag van de verminderingen, kan, met inachtneming van de verminderingen
      volgens andere regelen ter voorkoming van dubbele belasting, niet meer bedragen dan het bedrag van de belasting dat
      zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1] verschuldigd zou zijn over het
      belastbare inkomen uit werk en woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '10.4'
    text: |-
      Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref1]
      verschuldigd zou zijn over het belastbare inkomen uit werk en woning wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit werk en woning, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel a, van de Wet inkomstenbelasting 2001][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '10.5'
    text: |-
      Onder noemerinkomen wordt verstaan: het inkomen uit werk en woning verminderd met de – met overeenkomstige
      toepassing van [afdeling 3.13, van de Wet inkomstenbelasting 2001][ref1] – te verrekenen negatieve bedragen aan
      noemerinkomen uit andere jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling3.13
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '3.13'
  - number: '10.6'
    text: |-
      In afwijking van het vijfde lid wordt het noemerinkomen per Mogendheid vermeerderd met de op het inkomen uit
      werk en woning in het jaar in mindering gebrachte uitgaven voor inkomensvoorzieningen en persoonsgebonden aftrek
      voorzover deze bij de belastingheffing in die Mogendheid in aanmerking zijn genomen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
  - number: '10.7'
    text: |-
      In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is deze volledig in aanmerking te nemen, het noemerinkomen, ook voor de
      bepaling van de vermindering wegens buitenlands inkomen uit andere Mogendheden, vermeerderd met de op het inkomen
      uit werk en woning in het jaar in mindering gebrachte uitgaven voor inkomensvoorzieningen en persoonsgebonden
      aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een Mogendheid, niet zijnde een
      lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden zou zijn om op grond van het
      Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie volledig in aanmerking te
      nemen.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een bedrag aan in een jaar vrij te stellen buitenlands inkomen uit werk en woning – per Mogendheid
      berekend met inachtneming van de verrekening volgens [artikel 12][ref1] – dat door de toepassing van
      [artikel 10, derde lid][ref2], niet leidt tot een vermindering van belasting over dat jaar, wordt overgebracht
      naar het volgend jaar. Deze overbrenging vindt alleen plaats indien het naar het volgend jaar over te brengen
      buitenlands inkomen uit werk en woning door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '11.2'
    text: |-
      In het jaar waarnaar de overbrenging plaatsvindt, wordt voor de berekening van de vermindering van
      [artikel 10][ref1] het buitenlands inkomen uit werk en woning verhoogd met het over te brengen bedrag aan
      buitenlands inkomen uit werk en woning. Het noemerinkomen wordt niet verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '11.4'
    text: |-
      Indien een binnenlandse belastingplichtige beloningen geniet als bedoeld in een compensatieregeling voor
      grensarbeiders in een andere regeling ter voorkoming van dubbele belasting, zijn het eerste en tweede lid niet
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling kan onder daarbij te stellen voorwaarden worden bepaald dat het vierde lid geheel of
      gedeeltelijk niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel11
  - number: '12'
    text: |-
      Indien het buitenlands inkomen uit werk en woning uit een Mogendheid – berekend met inachtneming van de
      overbrenging per Mogendheid volgens [artikel 11][ref1] – negatief is, wordt het voor de toepassing van de
      vermindering van [artikel 10][ref2] aangemerkt als negatief bestanddeel van het buitenlandse inkomen uit werk
      en woning van het volgend jaar uit die Mogendheid. De inspecteur stelt het naar het volgend jaar over te brengen
      negatieve buitenlands inkomen uit werk en woning vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0012095
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '13.1'
    text: |-
      Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven belasting
      naar het inkomen, een vermindering van inkomstenbelasting verleend voor in het inkomen uit werk en woning begrepen
      voordelen en inkomsten uit het door de belastingplichtige of een ander als artiest of sportbeoefenaar verrichten
      van persoonlijke werkzaamheden binnen het gebied van die andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel13
  - number: '13.2'
    text: 'Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel13
  - number: 13.2.a
    text: het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel13
  - number: 13.2.b
    text: |-
      het bedrag dat tot de belasting die in het desbetreffende jaar zonder de toepassing van dit besluit volgens de
      [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit werk en woning verschuldigd zou zijn, in
      dezelfde verhouding staat als het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen voordelen
      en inkomsten, verminderd met de daarmee verband houdende kosten, staat tot het noemerinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: '13.3'
    text: |-
      [Artikel 10, vierde, vijfde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel10
    url: https://wetten.overheid.nl/BWBR0012095/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012095
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: '13.4'
    text: |-
      De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere regelen ter
      voorkoming van dubbele belasting en volgens [artikel 10][ref1], ten hoogste het bedrag aan berekende belasting over
      het belastbare inkomen uit werk en woning.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel10
