  - number: '7'
    text: |-
      Voor de toepassing van dit hoofdstuk blijft te conserveren inkomen en de daarover verschuldigde belasting buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel7
  - number: '8'
    text: |-
      Een binnenlandse belastingplichtige is vrijgesteld van de inkomstenbelasting die betrekking heeft op buitenlands
      inkomen uit werk en woning.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel8
  - number: '9'
    text: |-
      1 Het buitenlandse inkomen uit werk en woning uit een andere Mogendheid bestaat uit het gezamenlijke bedrag van
      hetgeen de belastingplichtige als bestanddeel van het inkomen uit werk en woning uit die Mogendheid geniet als:

      a. belastbare winst uit buitenlandse onderneming, zijnde een onderneming die, of het gedeelte van een onderneming
      dat, wordt gedreven met behulp van een vaste inrichting binnen het gebied van de andere Mogendheid;

      b. belastbaar loon ter zake van het binnen het gebied van de andere Mogendheid in privaatrechtelijke
      dienstbetrekking verrichten of hebben verricht van arbeid;

      c. belastbaar loon ter zake van het in publiekrechtelijke dienstbetrekking tot een binnen het gebied van de andere
      Mogendheid gevestigde publiekrechtelijke rechtspersoon verrichten of hebben verricht van arbeid, waarbij het loon
      ten laste komt van die rechtspersoon of van een door zulk een rechtspersoon in het leven geroepen fonds;

      d. opbrengsten, verminderd met de in aftrek te brengen kosten, van onroerende zaken die binnen het gebied van de
      andere Mogendheid zijn gelegen of van rechten waaraan deze zijn onderworpen;

      e. belastbare periodieke uitkeringen en verstrekkingen op grond van een publiekrechtelijke regeling ten laste van
      een binnen het gebied van de andere Mogendheid gevestigde publiekrechtelijke rechtspersoon of van een door een
      zodanige rechtspersoon in het leven geroepen fonds, voorzover deze inkomensbestanddelen zijn onderworpen aan een
      belasting naar het inkomen die vanwege die andere Mogendheid wordt geheven.

      2 Werkzaamheden die in het kader van een onderneming worden verricht gedurende een aaneengesloten periode van ten
      minste 30 dagen in, op of boven het winningsgebied van de andere Mogendheid, vormen een buitenlandse onderneming.
      Het winningsgebied van de andere Mogendheid bestaat uit de territoriale zee van die Mogendheid alsmede het buiten
      de territoriale zee gelegen deel van de zeebodem en de ondergrond daarvan, voorzover die andere Mogendheid daar
      op grond van het internationale recht rechten mag uitoefenen op het gebied van de exploratie en exploitatie van
      natuurlijke rijkdommen.

      3 Bij het bepalen van de winst uit een buitenlandse onderneming worden aan die buitenlandse onderneming de
      voordelen toegerekend die deze geacht zou worden te behalen – in het bijzonder bij haar handelen met andere
      onderdelen van de onderneming –, indien zij een zelfstandige en onafhankelijke onderneming zou zijn, die dezelfde
      of soortgelijke werkzaamheden zou uitoefenen onder dezelfde of soortgelijke omstandigheden, hierbij in aanmerking
      nemende de door de belastingplichtige door middel van de buitenlandse onderneming en andere delen van de
      onderneming uitgeoefende functies, gebruikte activa en gelopen risico’s.

      4 Het in het eerste lid, onderdeel b, bedoelde loon wordt bij arbeid die korter dan dertig dagen aaneengesloten
      binnen het gebied van de andere Mogendheid is verricht, alleen beschouwd te zijn onderworpen aan een belasting
      naar het inkomen die vanwege die Mogendheid wordt geheven indien blijkt dat ter zake hiervan aan die Mogendheid
      belasting is betaald.

      5 In afwijking in zoverre van het eerste lid, onderdeel c, is, indien het aldaar bedoelde loon wordt genoten ter
      zake van het verrichten of verricht hebben van arbeid ten behoeve van een onderneming, op dit loon het bepaalde in
      het eerste lid, onderdeel b, van toepassing.

      6 In afwijking in zoverre van het eerste lid behoren door een belastingplichtige verkregen voordelen en inkomsten
      uit het door de belastingplichtige of een ander als artiest of sportbeoefenaar verrichten van persoonlijke
      werkzaamheden binnen het gebied van de andere Mogendheid, niet tot het buitenlandse inkomen uit werk en woning uit
      die Mogendheid.

      7 Indien de belastingplichtige de onderneming van een vennootschap waarvan hij aandelen of
      winstbewijzen houdt, in het kader van de ontbinding van die vennootschap met toepassing van
      [artikel 14c van de Wet op de vennootschapsbelasting 1969][ref1], voortzet of mede voortzet, wordt op het tijdstip
      van voortzetting mede als winst uit buitenlandse onderneming uit een Mogendheid aangemerkt 20/45 deel van het aan
      het aandeel van de belastingplichtige in de vennootschap toe te rekenen deel van het volgens [artikel 34][ref2]
      zoals dat luidde op 31 december 2011, vastgestelde bedrag aan winst uit buitenlandse onderneming uit die Mogendheid
      van de vennootschap na toepassing van genoemd artikel 14c, tweede lid.

      8 In afwijking in zoverre van het eerste lid wordt tot het buitenlandse inkomen uit werk en woning uit een andere
      Mogendheid niet gerekend, het door een belastingplichtige genoten belastbare loon ter zake van een dienstbetrekking
      uitgeoefend aan boord van een zee- of luchtvaartuig in het internationale verkeer dat wordt geëxploiteerd door een
      onderneming waarvan de werkelijke leiding is gevestigd in een andere Mogendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel14c
