  - number: 36a
    text: |-
      1 In afwijking in zoverre van [artikel 36, eerste lid][ref1], wordt aan een binnenlandse belastingplichtige,
      ter verrekening van vanwege een andere Mogendheid geheven belasting, een vermindering van vennootschapsbelasting
      verleend voor royalty’s waarop [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref2] van toepassing
      is, indien:

      a. de schuldenaar van de royalty’s in een ontwikkelingsland woont of gevestigd is, en

      b. de royalty’s zijn onderworpen aan een belasting naar de winst die vanwege dat ontwikkelingsland, al dan niet aan
      de bron, wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:

      a. het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;

      b. het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen royalty’s, vermenigvuldigd met
      5/100;

      3 Bij de toepassing van het tweede lid, onderdeel b, worden royalty’s verminderd met de daarmee verband houdende
      kosten.

      4 [Artikel 16][ref3] is van overeenkomstige toepassing.

      5 De vermindering volgens dit artikel bedraagt, met inachtneming van de vermindering volgens andere regelen
      ter voorkoming van dubbele belasting en volgens [artikel 36][ref4], ten hoogste het bedrag aan verschuldigde
      vennootschapsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel36
