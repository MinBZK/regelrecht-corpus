  - number: '25'
    text: |-
      1 Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van inkomstenbelasting verleend in verband met ontvangen dividenden, interest en
      royalty's indien:

      a. de rechten waaruit de opbrengst is genoten behoren tot de bezittingen als bedoeld in
      [artikel 5.3 van de Wet inkomstenbelasting 2001][ref1];

      b. de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland
      is gevestigd of woont, en

      c. de dividenden, interest en royalty's zijn onderworpen aan een belasting naar het inkomen die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het desbetreffende
      jaar vanwege andere Mogendheden geheven belasting. De belasting die vanwege andere Mogendheden is geheven
      over dividenden, interest en royalty's wordt tot geen hoger bedrag in aanmerking genomen dan tot 15% van de
      desbetreffende dividenden, interest en royalty's.

      3 [Artikel 16][ref2] is van overeenkomstige toepassing.

      4 De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere regelen ter
      voorkoming van dubbele belasting en volgens [artikel 24][ref3], ten hoogste het bedrag aan berekende belasting op
      het belastbaar inkomen uit sparen en beleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel24
