  - number: '34'
    text: |-
      Op een volgens [artikel 34][ref1], zoals dat luidde op 31 december 2011, naar een jaar dat aanvangt op of na
      1 januari 2012 over te brengen bedrag aan vrij te stellen buitenlandse winst uit een Mogendheid, blijven de
      regels van dit besluit, zoals die luidden op 31 december 2011, van toepassing. Het naar een later jaar over te
      brengen bedrag aan buitenlandse winst wordt hierbij, in afwijking van artikel 34, eerste lid, zoals dat luidde
      op 31 december 2011, niet verminderd met negatieve buitenlandse winst uit die Mogendheid over een boekjaar dat
      aanvangt op of na 1 januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel34
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel34
