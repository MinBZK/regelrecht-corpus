  - number: 9a
    text: |-
      1 Bij het bepalen van de belastbare winst uit buitenlandse onderneming, bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref1], wordt de ondernemersaftrek, bedoeld in
      [artikel 3.74 van de Wet inkomstenbelasting 2001][ref2], in aanmerking genomen voor een bedrag dat tot de
      ondernemersaftrek waarop de belastingplichtige in dat jaar recht heeft, in dezelfde verhouding staat als
      de winst uit buitenlandse onderneming, voor aftrek van de ondernemersaftrek, staat tot de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref3].

      2 Indien de winst, bedoeld in [artikel 3.8 van de Wet inkomstenbelasting 2001][ref4], positief is en de
      buitenlandse winst negatief, wordt deze laatste voor de toepassing van het eerste lid op nihil gesteld.

      3 Indien de buitenlandse winst groter is dan de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref5], wordt de ondernemersaftrek bij de bepaling van de
      belastbare winst uit buitenlandse onderneming in zijn geheel in aanmerking genomen.

      4 Indien de buitenlandse winst negatief is en de winst, bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref6], lager is dan de buitenlandse winst wordt de
      ondernemersaftrek bij de bepaling van de belastbare winst uit buitenlandse onderneming voor de helft in aanmerking
      genomen.


