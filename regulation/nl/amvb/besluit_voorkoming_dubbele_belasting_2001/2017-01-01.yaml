  - number: '52'
    text: |-
      1 Een in Nederland wonende of gevestigde gerechtigde tot een prijs van een buitenlands kansspel is vrijgesteld van
      de daarop betrekking hebbende kansspelbelasting, indien die prijs is onderworpen aan een gelijksoortige belasting,
      die vanwege een andere Mogendheid wordt geheven.

      2 Het eerste lid vindt geen toepassing, indien de prijs als winst uit onderneming moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel52
  - number: '53'
    text: |-
      1 Aan een belastingplichtige waarvan de financiële gegevens zijn opgenomen in een geconsolideerde jaarrekening
      die is opgesteld door een in een andere Mogendheid gevestigd lichaam wordt, ter verrekening van vanwege die andere
      Mogendheid geheven belasting, een vermindering van bankenbelasting verleend indien de activa of passiva van de
      belastingplichtige in aanmerking zijn genomen bij de vanwege die andere Mogendheid geheven, aan de bankenbelasting
      soortgelijke, belasting.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het kalenderjaar
      vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting dat toerekenbaar is aan de
      bij die heffing in aanmerking genomen activa of passiva van de belastingplichtige. De vermindering volgens dit
      artikel bedraagt ten hoogste het bedrag aan belasting dat volgens de [Wet bankenbelasting][ref1] verschuldigd is.

      3 Het eerste lid vindt alleen toepassing indien de aldaar bedoelde andere Mogendheid een overeenkomstige
      verrekening van Nederlandse bankenbelasting geeft aan een in die Mogendheid gevestigd lichaam dat aldaar is
      onderworpen aan een soortgelijke belasting en waarvan de financiële gegevens zijn opgenomen in een geconsolideerde
      jaarrekening die is opgesteld door een in Nederland gevestigd lichaam dat belastingplichtig is voor de
      bankenbelasting.

      4 Bij ministeriële regeling worden regels gesteld voor de bepaling van het gedeelte van de door een andere
      Mogendheid geheven soortgelijke belasting dat toerekenbaar is aan de bij die heffing in aanmerking genomen activa
      of passiva van de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0031796
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031796
  - number: '54'
    text: |-
      1 Aan een belastingplichtige met zetel in een andere Mogendheid en met een bijkantoor in Nederland wordt, ter
      verrekening van vanwege die andere Mogendheid geheven belasting, een vermindering van bankenbelasting verleend
      indien de aan het bijkantoor toe te rekenen activa of passiva van de belastingplichtige in aanmerking zijn genomen
      bij de vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is gelijk aan het bedrag van de in het kalenderjaar
      vanwege die andere Mogendheid geheven, aan de bankenbelasting soortgelijke, belasting dat toerekenbaar is aan
      de bij die heffing in aanmerking genomen aan het bijkantoor in Nederland toe te rekenen activa of passiva van de
      belastingplichtige. De vermindering volgens dit artikel bedraagt ten hoogste het bedrag aan belasting dat volgens
      de [Wet bankenbelasting][ref1] verschuldigd is.

      3 Het eerste lid vindt alleen toepassing indien de aldaar bedoelde andere Mogendheid een overeenkomstige
      verrekening van Nederlandse bankenbelasting geeft aan een in Nederland gevestigde belastingplichtige met een
      bijkantoor in die Mogendheid die aldaar is onderworpen aan een soortgelijke belasting.

      4 Bij ministeriële regeling worden regels gesteld voor de bepaling van het gedeelte van de door een andere
      Mogendheid geheven soortgelijke belasting dat toerekenbaar is aan de bij die heffing in aanmerking genomen aan het
      bijkantoor in Nederland toe te rekenen activa of passiva van de belastingplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0031796
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0031796
  - number: '55'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen aan de in [artikel 53, derde lid][ref1],
      onderscheidenlijk [artikel 54, derde lid][ref2], gestelde voorwaarden in ieder geval wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel54
