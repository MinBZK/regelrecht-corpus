  - number: '37'
    text: |-
      Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting als bedoeld in [artikel 36][ref1]
      en [artikel 36a][ref2] dat door de toepassing van [artikel 36, tweede lid, onderdeel b, of zesde lid][ref3],
      onderscheidenlijk door de toepassing van [artikel 36a, tweede lid, onderdeel b, of vijfde lid][ref4], niet leidt
      tot een vermindering van vennootschapsbelasting over dat jaar, wordt aangemerkt als vanwege andere Mogendheden
      geheven belasting van het daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgende
      jaar over te brengen bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


