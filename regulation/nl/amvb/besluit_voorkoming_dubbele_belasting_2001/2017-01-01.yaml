  - number: 25b
    text: |-
      1 Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van inkomstenbelasting verleend voor in het inkomen uit werk en woning, het inkomen
      uit aanmerkelijk belang of het voordeel uit sparen en beleggen begrepen inkomsten die bij deze belastingplichtige
      opkomen als gevolg van de toerekening op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref1] van de
      bezittingen en schulden alsmede opbrengsten en uitgaven van een afgezonderd particulier vermogen, voor zover deze
      bezittingen en schulden alsmede opbrengsten en uitgaven zijn onderworpen aan een belasting naar het inkomen of de
      winst die vanwege de Mogendheid waarin het afgezonderd particulier vermogen is gevestigd wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:

      a. het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting als bedoeld in het
      eerste lid over de aan de belastingplichtige toegerekende bezittingen en schulden alsmede opbrengsten en uitgaven;
      en

      b. het bedrag van de in het desbetreffende jaar, zonder de toepassing van dit besluit, volgens de
      [Wet inkomstenbelasting 2001][ref2] verschuldigde inkomstenbelasting dat betrekking heeft op de inkomsten, bedoeld
      in het eerste lid, die bij de belastingplichtige opkomen, waarbij dit bedrag wordt verminderd met de verminderingen
      van de verschuldigde inkomstenbelasting die voor die inkomsten worden verleend op grond van de aan dit artikel
      voorafgaande artikelen of andere regelingen ter voorkoming van dubbele belasting.

      3 Het bedrag van de in het desbetreffende jaar volgens de [Wet inkomstenbelasting 2001][ref3] verschuldigde
      inkomstenbelasting dat betrekking heeft op de inkomsten, bedoeld in het eerste lid, die bij de belastingplichtige
      opkomen, wordt voor de toepassing van het tweede lid, onderdeel b, gesteld op de som van de volgende bedragen:

      a. het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen uit werk en woning
      verschuldigd is, in dezelfde verhouding staat als het in het inkomen uit werk en woning begrepen inkomen dat in dat
      jaar bij de belastingplichtige opkomt op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref4] staat
      tot het noemerinkomen, bedoeld in [artikel 10, vijfde en zevende lid][ref5];

      b. het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen
      uit aanmerkelijk belang verschuldigd is, in dezelfde verhouding staat als het in het inkomen uit
      aanmerkelijk belang begrepen inkomen dat in dat jaar bij de belastingplichtige opkomt op grond van
      [artikel 2.14a van de Wet inkomstenbelasting 2001][ref6] staat tot het noemerinkomen, bedoeld in
      [artikel 19, vijfde en zesde lid][ref7];

      c. het bedrag dat tot de belasting die in het desbetreffende jaar over het belastbare inkomen uit sparen en beleggen
      verschuldigd is, in dezelfde verhouding staat als het in het voordeel uit sparen en beleggen begrepen inkomen dat
      in dat jaar bij de belastingplichtige opkomt op grond van [artikel 2.14a van de Wet inkomstenbelasting 2001][ref8]
      staat tot het noemerinkomen, bedoeld in [artikel 24, vijfde en zesde lid][ref9].

      4 De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens de aan dit artikel
      voorafgaande artikelen en volgens andere regelingen ter voorkoming van dubbele belasting, ten hoogste het bedrag
      aan verschuldigde inkomstenbelasting over het belastbare inkomen uit werk en woning, het belastbare inkomen uit
      aanmerkelijk belang en het belastbare inkomen uit sparen en beleggen.


