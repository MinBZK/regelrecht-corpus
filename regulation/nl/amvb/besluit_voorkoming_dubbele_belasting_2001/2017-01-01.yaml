  - number: '49'
    text: |-
      Indien een verkrijging van een erflater die ten tijde van het overlijden in Nederland woonde, bezittingen omvat
      welke zich binnen het gebied van een andere Mogendheid bevinden en niet op grond van de [artikelen 47][ref1] en
      [48][ref2] aanspraak bestaat op een vermindering ter voorkoming van dubbele belasting, wordt bij het bepalen van de
      waarde van die verkrijging een vanwege die andere Mogendheid over deze bezittingen geheven gelijksoortige belasting
      in mindering gebracht op die verkrijging.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel48
