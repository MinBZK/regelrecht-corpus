  - number: '15'
    text: |-
      1 Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van inkomstenbelasting verleend voor in het inkomen uit werk en woning, maar niet
      in enig in [artikel 9][ref1] bedoeld buitenlands inkomen uit werk en woning, begrepen dividenden, interest en
      royalty's, indien:

      a. de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland
      is gevestigd of woont, en

      b. de dividenden, interest en royalty's zijn onderworpen aan een belasting naar het inkomen die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:

      a. het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;

      b. het bedrag dat tot de belasting die in het desbetreffende jaar zonder de toepassing van dit besluit volgens
      de [Wet inkomstenbelasting 2001][ref2] over het belastbare inkomen uit werk en woning verschuldigd zou zijn,
      in dezelfde verhouding staat als het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen
      dividenden, interest en royalty's staat tot het noemerinkomen.

      3 Voor de toepassing van het tweede lid, onderdeel a, wordt de belasting die vanwege andere Mogendheden is geheven
      over dividenden tot geen hoger bedrag in aanmerking genomen dan tot 15% van die dividenden.

      4 Bij de toepassing van het tweede lid, onderdeel b, worden dividenden, interest en royalty’s verminderd met de
      daarmee verband houdende kosten.

      5 [Artikel 10, vierde, vijfde en zevende lid][ref3], is van overeenkomstige toepassing.

      6 De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere regelen ter
      voorkoming van dubbele belasting en volgens de [artikelen 10][ref4], [13][ref5] en [13a][ref6], ten hoogste het
      bedrag aan berekende belasting over het belastbare inkomen uit werk en woning.


