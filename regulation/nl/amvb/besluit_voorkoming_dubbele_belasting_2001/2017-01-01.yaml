  - number: '19'
    text: |-
      1 Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van inkomstenbelasting verleend voor in het inkomen uit aanmerkelijk belang begrepen
      dividenden, indien:

      a. de vennootschap die de dividenden uitdeelt in een ontwikkelingsland is gevestigd, en

      b. de dividenden zijn onderworpen aan een belasting naar het inkomen die vanwege dat ontwikkelingsland, al dan niet
      aan de bron, wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:

      a. het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;

      b. het bedrag dat tot de belasting die in het desbetreffende jaar zonder de toepassing van dit besluit volgens
      de [Wet inkomstenbelasting 2001][ref1] over het belastbare inkomen uit aanmerkelijk belang verschuldigd zou zijn,
      in dezelfde verhouding staat als het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen
      dividenden staat tot het noemerinkomen.

      3 [Artikel 15, derde en vierde lid][ref2], en [artikel 16][ref3] vinden overeenkomstige toepassing.

      4 Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref4]
      verschuldigd zou zijn over het belastbare inkomen uit aanmerkelijk belang wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit aanmerkelijk belang, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel b, van de Wet inkomstenbelasting 2001][ref5].

      5 Onder noemerinkomen wordt verstaan: het belastbare inkomen uit aanmerkelijk belang.

      6 In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is de persoonlijke- en gezinssituatie volledig in aanmerking te nemen,
      het noemerinkomen vermeerderd met de op het inkomen uit aanmerkelijk belang in het jaar in mindering gebrachte
      persoonsgebonden aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een Mogendheid,
      niet zijnde een lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden zou zijn om op
      grond van het Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie volledig in
      aanmerking te nemen.


