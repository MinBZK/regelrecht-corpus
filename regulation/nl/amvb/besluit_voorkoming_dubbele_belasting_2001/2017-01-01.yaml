  - number: '12'
    text: |-
      Indien het buitenlands inkomen uit werk en woning uit een Mogendheid – berekend met inachtneming van de
      overbrenging per Mogendheid volgens [artikel 11][ref1] – negatief is, wordt het voor de toepassing van de
      vermindering van [artikel 10][ref2] aangemerkt als negatief bestanddeel van het buitenlandse inkomen uit werk
      en woning van het volgend jaar uit die Mogendheid. De inspecteur stelt het naar het volgend jaar over te brengen
      negatieve buitenlands inkomen uit werk en woning vast bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel10
