preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën 20 november 2000, nr. IFZ2000/1293M, Directoraat-Generaal
    voor Fiscale Zaken, Directie Internationale Fiscale Zaken;

    Gelet op artikel 38, eerste lid, van de Algemene wet inzake rijksbelastingen;

    De Raad van State gehoord (advies van 13 december 2000, nr. W06.000541/IV);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 19 december 2000, nr. IFZ2000/1397U,
    Directoraat-Generaal voor Fiscale Zaken, Directie Internationale Fiscale Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Dit besluit is van toepassing voor de heffing van de navolgende belastingen:

      a. inkomstenbelasting;

      b. loonbelasting;

      c. vennootschapsbelasting;

      d. erfbelasting;

      e. schenkbelasting;

      f. kansspelbelasting;

      g. bankenbelasting.

      2 Dit besluit vindt slechts toepassing voorzover niet op andere wijze in het voorkomen van dubbele belasting is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel1
  - number: '2'
    text: |-
      1 In dit besluit wordt onder vaste inrichting verstaan een vaste bedrijfsinrichting met behulp waarvan de
      werkzaamheden van een onderneming geheel of gedeeltelijk worden uitgeoefend. De plaats van uitvoering van een
      bouwwerk of van constructie- of installatiewerkzaamheden vormt alleen een vaste inrichting indien de duur ervan
      twaalf maanden overschrijdt.

      2 In afwijking in zoverre van het eerste lid, wordt niet als een vaste inrichting beschouwd:

      a. het gebruikmaken van inrichtingen, uitsluitend voor opslag, uitstalling of aflevering van aan de
      belastingplichtige toebehorende goederen of koopwaar;

      b. het aanhouden van een voorraad van aan de belastingplichtige toebehorende goederen of koopwaar, uitsluitend voor
      opslag, uitstalling of aflevering;

      c. het aanhouden van een voorraad van aan de belastingplichtige toebehorende goederen of koopwaar, uitsluitend voor
      bewerking of verwerking door een ander;

      d. het aanhouden van een vaste bedrijfsinrichting, uitsluitend om voor de onderneming goederen of koopwaar aan te
      kopen of inlichtingen in te winnen;

      e. het aanhouden van een vaste bedrijfsinrichting uitsluitend om voor de onderneming enige andere werkzaamheid uit
      te oefenen die van voorbereidende aard is of het karakter van hulpwerkzaamheid heeft;

      f. het aanhouden van een vaste bedrijfsinrichting uitsluitend voor een combinatie van de in de onderdelen a tot
      en met e genoemde werkzaamheden, mits het totaal van de werkzaamheden van de vaste bedrijfsinrichting dat uit deze
      combinatie voortvloeit van voorbereidende aard is of het karakter van hulpwerkzaamheid heeft.

      3 Indien een persoon, niet zijnde een onafhankelijke vertegenwoordiger in de zin van het vierde lid, voor een
      belastingplichtige werkzaam is, en een machtiging bezit om namens de belastingplichtige overeenkomsten af te
      sluiten en dit recht in een andere Mogendheid gewoonlijk uitoefent, heeft die belastingplichtige voor de toepassing
      van dit besluit een vaste inrichting in die andere Mogendheid met betrekking tot de werkzaamheden die de persoon
      voor die belastingplichtige verricht. De vorige volzin is niet van toepassing indien de werkzaamheden van de
      persoon beperkt blijven tot werkzaamheden als bedoeld in het tweede lid die, indien zij worden uitgeoefend met
      behulp van een vaste bedrijfsinrichting, deze vaste bedrijfsinrichting op grond van de bepalingen van dat lid niet
      tot een vaste inrichting zouden maken.

      4 Een belastingplichtige heeft geen vaste inrichting in een andere Mogendheid alleen op grond van de omstandigheid
      dat hij in die Mogendheid zaken doet door bemiddeling van een makelaar, commissionair of enige andere
      onafhankelijke vertegenwoordiger, mits deze personen in de normale uitoefening van hun bedrijf handelen.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 In dit besluit wordt onder Mogendheid mede verstaan: een bestuurlijke eenheid.

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen worden de landen van het Koninkrijk der
      Nederlanden aangemerkt als afzonderlijke Mogendheden.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel3
  - number: '4'
    text: |-
      In dit besluit wordt onder gebied van een andere Mogendheid verstaan: het grondgebied van die Mogendheid,
      daaronder begrepen het gebied buiten de territoriale zee van die Mogendheid waar deze in overeenstemming met het
      internationale recht soevereine rechten kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel4
  - number: '5'
    text: |-
      In dit besluit wordt:

      a. onder dividenden verstaan: voordelen uit aandelen, winstbewijzen of andere rechten, met uitzondering van
      schuldvorderingen, die aanspraak geven op een aandeel in de winst van vennootschappen waarvan het kapitaal geheel
      of ten dele in aandelen is verdeeld;

      b. onder interest verstaan: voordelen uit overheidsleningen, obligaties of schuldbewijzen en andere
      schuldvorderingen van welke aard ook, al dan niet aanspraak gevende op een aandeel in de winst;

      c. onder royalty's verstaan: vergoedingen van welke aard ook voor:

      1°. het gebruik van, of het recht op gebruik van, een auteursrecht op een werk op het gebied van de wetenschap, een
      octrooi, een fabrieks- of handelsmerk, een tekening of model, een plan, een geheim recept of werkwijze;

      2°. het gebruik van, of het recht van gebruik van, nijverheids- en handelsuitrusting of wetenschappelijke
      uitrusting;

      3°. inlichtingen omtrent ervaringen op het gebied van nijverheid, handel of wetenschap, of

      4°. het verlenen van technische diensten in een ontwikkelingsland.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel5
  - number: '6'
    text: |-
      1 Voor de toepassing van dit besluit worden als ontwikkelingslanden aangewezen de Mogendheden die zijn opgenomen
      in de door het «Development Assistance Committee» van de Organisatie voor Economische Samenwerking en Ontwikkeling
      meest recent vastgestelde «List of Recipients of Official Development Assistance», met uitzondering van de daarin
      opgenomen hoge middeninkomenslanden. Deze aanwijzing is voor Mogendheden die in de loop van een kalenderjaar worden
      aangewezen, van kracht met ingang van het kalenderjaar volgend op het kalenderjaar van bekendmaking van genoemde
      lijst.

      2 In afwijking van het eerste lid worden eveneens als ontwikkelingsland aangewezen de Mogendheden die:

      a. als hoge middeninkomenslanden zijn opgenomen op de lijst, bedoeld in het eerste lid; en

      b. als ontwikkelingsland waren aangewezen bij dit artikel zoals dat luidde op 31 december 2016; en

      c. worden aangewezen als landen waarop een door Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking
      krachtens [artikel 3 van de Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref1] genomen besluit met het oog
      op het financieren van activiteiten van het midden- en kleinbedrijf dat ontwikkelingsrelevante investeringen wil
      doen, van toepassing is.

      De aanwijzing is voor de toepassing van dit besluit voor Mogendheden die in de loop van een kalenderjaar gaan
      voldoen aan de voorwaarden, genoemd in de onderdelen a, b en c, van kracht met ingang van het kalenderjaar volgend
      op het kalenderjaar waarin aan de voorwaarden wordt voldaan.

      3 Een Mogendheid die ingevolge het eerste en tweede lid in de loop van een kalenderjaar, ten opzichte van
      het daaraan voorgaande kalenderjaar ingevolge het eerste of tweede lid niet meer als ontwikkelingsland is
      aangewezen, wordt voor de toepassing van dit besluit nog als ontwikkelingsland aangemerkt gedurende dat jaar en de
      daaropvolgende twee kalenderjaren.

      4 Voorts worden voor de jaren 2017 en 2018 als ontwikkelingsland aangewezen: Belize, Botswana, Costa Rica, Cuba,
      Dominica, de Dominicaanse Republiek, Ecuador, Fiji, Grenada, Iran, Irak, Jamaica, de Malediven, de Marshall
      eilanden, Namibië, de Palau-eilanden, St. Vincent and the Grenadines en Tonga.

      5 De termijn, bedoeld in het derde of vierde lid, kan met betrekking tot een Mogendheid bij regeling van Onze
      Minister van Financiën, na overleg met Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking, worden
      verlengd.


