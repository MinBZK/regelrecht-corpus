  - number: '14'
    text: |-
      1 Het bedrag van de in een jaar vanwege andere Mogendheden geheven belasting, bedoeld in [artikel 13][ref1], dat
      door de toepassing van het [tweede lid, onderdeel b, of het vierde lid van dat artikel][ref2], niet leidt tot
      een vermindering van inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege andere Mogendheden geheven
      belasting van het daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar
      over te brengen bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.

      2 Indien een binnenlandse belastingplichtige beloningen geniet als bedoeld in een compensatieregeling voor
      grensarbeiders in een andere regeling ter voorkoming van dubbele belasting, is het eerste lid niet van toepassing.

      3 Bij ministeriële regeling kan onder daarbij te stellen voorwaarden worden bepaald dat het tweede lid geheel of
      gedeeltelijk niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel13
