        afdeling: '1'
  - number: '36'
    text: |-
      1 Aan een binnenlandse belastingplichtige wordt, ter verrekening van vanwege een andere Mogendheid geheven
      belasting, een vermindering van vennootschapsbelasting verleend voor in de winst, maar niet in de winst uit een
      andere staat, bedoeld in [artikel 15e, tweede lid, van de Wet op de vennootschapsbelasting 1969][ref1], begrepen
      dividenden, interest en royalty's, indien:

      a. de vennootschap die de dividenden uitdeelt of de schuldenaar van de rente en royalty's in een ontwikkelingsland
      woont of gevestigd is, en

      b. de dividenden, interest en royalty's zijn onderworpen aan een belasting naar de winst die vanwege dat
      ontwikkelingsland, al dan niet aan de bron, wordt geheven.

      2 Het bedrag van de in het eerste lid bedoelde vermindering is het laagste van de volgende bedragen:

      a. het bedrag van de in het desbetreffende jaar vanwege andere Mogendheden geheven belasting;

      b. Het bedrag van de in dat jaar volgens het eerste lid in aanmerking te nemen dividenden,
      interest en royalty’s, vermenigvuldigd met het percentage van het hoogste tarief, bedoeld in
      [artikel 22 van de Wet op de vennootschapsbelasting 1969][ref2];

      3 Voor de toepassing van het tweede lid, onderdeel a, wordt de belasting die vanwege andere Mogendheden is geheven
      over dividenden tot geen hoger bedrag in aanmerking genomen dan tot 15% van die dividenden.

      4 Bij de toepassing van het tweede lid, onderdeel b, worden dividenden, royalty’s en interest
      verminderd met de daarmee verband houdende kosten. Tot de kosten, bedoeld in de eerste volzin,
      behoren ook de kosten die een met de belastingplichtige verbonden lichaam als bedoeld in
      [artikel 10a, vierde lid, van de Wet op de vennootschapsbelasting 1969][ref3] of een met de belastingplichtige
      verbonden natuurlijk persoon als bedoeld in artikel 10a, vijfde lid, van de Wet op de vennootschapsbelasting 1969,
      heeft gemaakt en die bij het bepalen van de in Nederland belastbare winst of het in Nederland belastbare inkomen
      van dat verbonden lichaam of van die natuurlijke persoon in aftrek zijn gekomen.

      5 [Artikel 16][ref4] is van overeenkomstige toepassing.

      6 De vermindering volgens dit artikel bedraagt, met inachtneming van de verminderingen volgens andere
      regelen ter voorkoming van dubbele belasting, ten hoogste het bedrag aan belasting dat volgens de
      [Wet op de vennootschapsbelasting 1969][ref5] verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002672#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0012095#Artikel16
