  - number: '22'
    text: |-
      Een binnenlandse belastingplichtige is vrijgesteld van de inkomstenbelasting die betrekking heeft op buitenlands
      voordeel uit sparen en beleggen.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het buitenlandse voordeel uit sparen en beleggen bestaat uit het gezamenlijke bedrag van hetgeen de
      belastingplichtige als bestanddeel van het voordeel uit sparen en beleggen geniet als voordeel uit de
      rendementsgrondslag in het buitenland.

      2 De rendementsgrondslag in het buitenland is de waarde aan het begin van het kalenderjaar (peildatum) van
      de bezittingen in het buitenland verminderd met de waarde op de peildatum van de schulden in verband met die
      bezittingen. Bezittingen in het buitenland zijn:

      a. binnen het gebied van een andere Mogendheid gelegen onroerende zaken;

      b. rechten die direct of indirect betrekking hebben op binnen het gebied van een andere Mogendheid gelegen
      onroerende zaken, en

      c. rechten op aandelen in de winst van een onderneming waarvan de leiding binnen het gebied van een andere
      Mogendheid is gelegen, voorzover zij niet voortkomen uit effectenbezit of dienstbetrekking.

      3 Bezittingen als bedoeld in het tweede lid behoren alleen tot de rendementsgrondslag in het buitenland voorzover
      de daaruit genoten opbrengsten zijn onderworpen aan een belasting naar het inkomen die vanwege de andere Mogendheid
      waarin de bezittingen zijn gelegen, wordt geheven.

      4 Indien de in het tweede lid genoemde bezittingen en schulden niet het gehele jaar tot de rendementsgrondslag
      van de belastingplichtige behoren, wordt de naar tijdsgelang herleide waarde op de peildatum hiervan voor
      de vaststelling van de rendementsgrondslag in het buitenland in aanmerking genomen, waarbij gedeelten van
      kalendermaanden als volle maand worden beschouwd. Behoort de bezitting of de schuld op de peildatum niet tot de
      rendementsgrondslag, dan wordt voor de toepassing van de eerste volzin uitgegaan van de waarde op het tijdstip
      waarop de bezitting of de schuld tot de rendementsgrondslag gaat behoren.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel23
  - number: '24'
    text: |-
      1 De in [artikel 22][ref1] bedoelde vrijstelling voor buitenlands voordeel uit sparen en beleggen wordt toegepast
      door een vermindering te verlenen op de verschuldigde inkomstenbelasting.

      2 De in het eerste lid bedoelde vermindering is gelijk aan het bedrag dat tot de belasting die zonder de toepassing
      van dit besluit volgens de [Wet inkomstenbelasting 2001][ref2] over het belastbare inkomen uit sparen en beleggen
      verschuldigd zou zijn, in dezelfde verhouding staat als het forfaitaire rendement van de rendementsgrondslag in het
      buitenland staat tot het noemerinkomen. De vermindering kan, met inachtneming van de verminderingen volgens andere
      regelen ter voorkoming van dubbele belasting, niet meer bedragen dan de belasting die zonder de toepassing van
      dit besluit volgens de Wet inkomstenbelasting 2001 over het belastbare inkomen uit sparen en beleggen verschuldigd
      zou zijn.

      3 Indien de belastingplichtige niet het gehele jaar binnenlands belastingplichtige is, wordt voor de
      in het tweede lid bedoelde vermindering het naar tijdsgelang herleide forfaitaire rendement, bedoeld in
      [artikel 5.2 van de Wet inkomstenbelasting 2001][ref3], van de rendementsgrondslag in het buitenland over
      de periode dat hij in Nederland woonde in aanmerking genomen. Gedeelten van kalendermaanden worden hierbij
      verwaarloosd. Als noemerinkomen geldt de som van het naar tijdsgelang herleide noemerinkomen over de periode dat de
      belastingplichtige in Nederland woonde en het naar tijdsgelang herleide belastbare inkomen uit sparen en beleggen
      in Nederland over de periode dat hij niet in Nederland woonde.

      4 Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref4]
      verschuldigd zou zijn over het belastbare inkomen uit sparen en beleggen wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit sparen en beleggen, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel c, van de Wet inkomstenbelasting 2001][ref5].

      5 Voor de toepassing van dit artikel wordt verstaan onder:

      a. het forfaitaire rendement van de rendementsgrondslag in het buitenland: het bedrag dat tot het forfaitaire
      rendement, bedoeld in [artikel 5.2 van de Wet inkomstenbelasting 2001][ref6], berekend over de grondslag sparen en
      beleggen, in dezelfde verhouding staat als de rendementsgrondslag in het buitenland staat tot de grondslag sparen
      en beleggen;

      b. het noemerinkomen: het belastbare inkomen uit sparen en beleggen.

      6 In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is de persoonlijke- en gezinssituatie volledig in aanmerking te nemen,
      het noemerinkomen vermeerderd met de op het belastbaar inkomen uit sparen en beleggen in het jaar in mindering
      gebrachte persoonsgebonden aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een
      Mogendheid, niet zijnde een lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden
      zou zijn om op grond van het Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie
      volledig in aanmerking te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5.2
      [ref4]: https://wetten.overheid.nl/BWBR0011353
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel2.7
      [ref6]: https://wetten.overheid.nl/BWBR0011353#Artikel5.2
