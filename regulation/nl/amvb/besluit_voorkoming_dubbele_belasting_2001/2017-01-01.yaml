  - number: '16'
    text: |-
      1 Bij de toepassing van [artikel 15][ref1] wordt geen vermindering verleend indien de belastingplichtige niet de
      uiteindelijk gerechtigde is tot de dividenden, interest of royalty's waarop door een andere Mogendheid belasting is
      geheven. Niet als uiteindelijk gerechtigde wordt beschouwd de belastingplichtige die in samenhang met de ontvangen
      opbrengst een tegenprestatie heeft verricht als onderdeel van een samenstel van transacties waarbij aannemelijk
      is dat:

      a. de opbrengst geheel of gedeeltelijk direct of indirect ten goede is gekomen aan een natuurlijk persoon
      of rechtspersoon die in mindere mate gerechtigd is tot vermindering van Nederlandse belasting dan de
      belastingplichtige die de tegenprestatie heeft verricht; en

      b. deze natuurlijke persoon of rechtspersoon een positie in rechten waaruit de opbrengst is genoten op directe of
      indirecte wijze behoudt of verkrijgt die vergelijkbaar is met zijn positie in soortgelijke rechten voorafgaand aan
      het moment waarop het samenstel van transacties een aanvang heeft genomen.

      2 Voor de toepassing van het eerste lid:

      a. kan van een samenstel van transacties eveneens sprake zijn ingeval transacties zijn aangegaan op een
      gereglementeerde effectenbeurs of markt;

      b. wordt met een samenstel van transacties gelijkgesteld een transactie die betrekking heeft op de enkele
      verwerving van een of meer dividendbewijzen of rentetermijnen, of op de vestiging van kortlopende genotsrechten
      op rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel15
