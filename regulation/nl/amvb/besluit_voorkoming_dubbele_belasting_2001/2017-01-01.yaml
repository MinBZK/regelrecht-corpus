      1 Het Besluit voorkoming dubbele belasting 1989 wordt ingetrokken.

      2 Het in het eerste lid genoemde besluit vindt voor de toepassing van de vennootschapsbelasting nog toepassing op
      het jaar dat is aangevangen voor 1 januari 2001 en dat na die datum eindigt.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel59
  - number: '60'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 januari 2001.

      2 Voor de heffing van de vennootschapsbelasting vindt dit besluit voor het eerst toepassing met ingang van het jaar
      dat met of in 2001 aanvangt.

      3 Voor de heffing van de schenk- en erfbelasting vindt dit besluit toepassing, indien het overlijden, de schenking
      of de in [artikel 45, derde lid, tweede zin, of de in artikel 53, eerste lid, van de Successiewet 1956][ref1]
      bedoelde gebeurtenis plaatsvindt op of na het tijdstip van de inwerkingtreding van dit besluit, zomede indien op of
      na dat tijdstip krachtens schenking wordt verkregen ten gevolge van de vervulling van een voorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel45
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel60
