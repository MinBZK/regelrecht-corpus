  - number: 25ba
    text: |-
      Het bedrag van de in een jaar vanwege een andere Mogendheid geheven belasting, bedoeld in [artikel 25b][ref1], dat
      door toepassing van het tweede lid, onderdeel b, of het vierde lid van dat artikel niet leidt tot een vermindering
      van inkomstenbelasting over dat jaar, wordt aangemerkt als vanwege die andere Mogendheid geheven belasting van
      het daaropvolgende jaar. Deze voortwenteling vindt alleen plaats indien het naar het volgend jaar over te brengen
      bedrag door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel25b
