  - number: 28a
    text: |-
      Indien een belastingplichtige op grond van enige bepaling in dit besluit in aanmerking komt voor een vermindering
      in verband met uit meer dan een Mogendheid genoten buitenlands inkomen of vanwege meer dan een Mogendheid geheven
      belasting en het gezamenlijke bedrag van de verminderingen ingevolge enig artikel in dit besluit is beperkt tot
      het bedrag van de inkomstenbelasting dat zonder toepassing van dit besluit verschuldigd zou zijn, worden deze
      verminderingen in aanmerking genomen met inachtneming van het volgende. Verminderingen die voortvloeien uit een
      andere regeling ter voorkoming van dubbele belasting gaan voor op de verminderingen die uitsluitend voortvloeien
      uit dit besluit. Vervolgens worden de verminderingen in aanmerking genomen in de volgorde die blijkt uit de overige
      bepalingen van dit besluit. Ten slotte worden de verminderingen in aanmerking genomen in volgorde van toenemende
      grootte.

      Ingeval de verminderingen even groot zijn, wordt van elk een evenredig gedeelte in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012095/2017-01-01#Artikel28a
  - number: '29'
    text: |-
      Ingeval de belastingplichtige in een jaar anders dan door overlijden ophoudt binnenlands belastingplichtige te
      zijn, en binnen een termijn van acht jaren na afloop van dit jaar wederom binnenlands belastingplichtige wordt,
      worden de over het jaar voorafgaande aan het jaar waarin de binnenlandse belastingplicht is geëindigd volgens de
      [artikelen 26][ref1], [27][ref2] en [28][ref3] vastgestelde bedragen aan over te brengen buitenlands inkomen uit
      werk en woning, negatief buitenlands inkomen uit werk en woning en vanwege andere Mogendheden geheven belasting,
      aangemerkt als bedragen die in het jaar voorafgaande aan het opnieuw binnenlands belastingplichtig worden, zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel26
