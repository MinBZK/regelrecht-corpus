  - number: '26'
    text: |-
      1 De inspecteur stelt het bedrag van het volgens [artikel 11][ref1] naar een volgend jaar over te brengen
      buitenlands inkomen uit werk en woning per Mogendheid en het bedrag van het volgens [artikel 24a][ref2] naar een
      volgend jaar over te brengen buitenlands voordeel uit sparen en beleggen vast bij voor bezwaar vatbare beschikking.
      Deze vaststelling gebeurt gelijktijdig met het vaststellen van de aanslag over dat jaar. Het bedrag van het naar
      het volgend jaar over te brengen buitenlands inkomen uit werk en woning en het bedrag van het naar het volgend jaar
      over te brengen buitenlands voordeel uit sparen en beleggen worden op het aanslagbiljet afzonderlijk vermeld.

      2 Rechtsmiddelen tegen een beschikking als bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op:

      a. de grootte van het over te brengen bedrag aan buitenlands inkomen uit werk en woning en van het over te brengen
      bedrag aan buitenlands voordeel uit sparen en beleggen, voorzover niet eerder vastgesteld, en

      b. de toepassing van [artikel 28a][ref3].

      3 Het bedrag aan buitenlands inkomen uit werk en woning dat volgens [artikel 11, eerste lid][ref4], naar het
      volgend jaar wordt overgebracht en het bedrag aan buitenlands voordeel uit sparen en beleggen dat volgens
      [artikel 24a, eerste lid][ref5], naar het volgend jaar wordt overgebracht, kunnen worden herzien of alsnog worden
      vastgesteld, indien:

      a. een aanslag wordt verminderd wegens de verrekening van verliezen uit andere jaren;

      b. de inspecteur een navorderingsaanslag vaststelt;

      c. de inspecteur een beschikking herziet waarin het bedrag van een verlies wordt vastgesteld;

      d. enig feit grond oplevert voor het vermoeden dat het bedrag van het over te brengen buitenlands inkomen uit werk
      en woning te hoog is vastgesteld, waarbij de herziening alleen kan plaatsvinden voor in de beschikking opgenomen
      buitenlands inkomen uit werk en woning dat is genoten in een van de twaalf voorafgaande jaren;

      e. enig feit grond oplevert voor het vermoeden dat het bedrag van het over te brengen buitenlands voordeel uit
      sparen en beleggen te hoog is vastgesteld, waarbij de herziening alleen kan plaatsvinden voor in de beschikking
      opgenomen buitenlands voordeel uit sparen en beleggen dat is genoten in een van de twaalf voorafgaande jaren.

      4 In afwijking in zoverre van [artikel 11, eerste lid, tweede volzin][ref6], onderscheidenlijk
      [artikel 24a, eerste lid, derde volzin][ref7], wordt, indien het derde lid toepassing vindt, het herziene of het
      alsnog vastgestelde bedrag aan buitenlands inkomen uit werk en woning, onderscheidenlijk het herziene of het alsnog
      vastgestelde bedrag aan buitenlands voordeel uit sparen en beleggen dat naar het volgend jaar wordt overgebracht,
      in het volgend jaar in aanmerking genomen zonder dat dit bedrag vooraf door de inspecteur bij voor bezwaar vatbare
      beschikking is vastgesteld. De vorige volzin vindt overeenkomstige toepassing voorzover de herziening gevolgen
      heeft voor bedragen die worden overgebracht naar jaren waarvoor al een aanslag is vastgesteld.


