  - number: '51'
    text: |-
      1 De [artikelen 47 tot en met 50][ref1] vinden overeenkomstige toepassing met betrekking tot de schenkbelasting,
      met dien verstande dat:

      a. voor de overeenkomstige toepassing van [artikel 47, tweede lid, onderdeel b][ref2], en
      [artikel 48, tweede lid, onderdeel b][ref3], de waarde van alle verkregen bezittingen tevens wordt verminderd met
      de vrijstellingen, bedoeld in [artikel 33 van de Successiewet 1956][ref4];

      b. [artikel 47, zevende lid][ref5], en [artikel 48, zesde lid][ref6], van overeenkomstige toepassing zijn, indien
      [artikel 17 van de Successiewet 1956][ref7] van toepassing is.

      2 [Artikel 48][ref8] is van overeenkomstige toepassing op schenkingen door een schenker die op grond van
      [artikel 3, tweede lid, van de Successiewet 1956][ref9] geacht wordt ten tijde van de schenking in Nederland te
      hebben gewoond.


