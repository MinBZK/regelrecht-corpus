  - number: '10'
    text: |-
      1 De in [artikel 8][ref1] bedoelde vrijstelling voor buitenlands inkomen uit werk en woning wordt voor elke
      Mogendheid waaruit de belastingplichtige zodanig inkomen geniet afzonderlijk toegepast door een vermindering te
      verlenen op de verschuldigde inkomstenbelasting.

      2 De in het eerste lid bedoelde vermindering is gelijk aan het bedrag dat tot de belasting die zonder de toepassing
      van dit besluit volgens de [Wet inkomstenbelasting 2001][ref2] over het belastbare inkomen uit werk en woning
      verschuldigd zou zijn, in dezelfde verhouding staat als het buitenlands inkomen uit werk en woning uit een
      Mogendheid staat tot het noemerinkomen.

      3 De vermindering, dan wel, ingeval de belastingplichtige uit meer dan een Mogendheid buitenlands inkomen uit
      werk en woning geniet, het gezamenlijke bedrag van de verminderingen, kan, met inachtneming van de verminderingen
      volgens andere regelen ter voorkoming van dubbele belasting, niet meer bedragen dan het bedrag van de belasting dat
      zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref3] verschuldigd zou zijn over het
      belastbare inkomen uit werk en woning.

      4 Onder de belasting die zonder de toepassing van dit besluit volgens de [Wet inkomstenbelasting 2001][ref4]
      verschuldigd zou zijn over het belastbare inkomen uit werk en woning wordt verstaan: de over
      het kalenderjaar berekende belasting op het belastbare inkomen uit werk en woning, bedoeld in
      [artikel 2.7, eerste lid, aanhef en onderdeel a, van de Wet inkomstenbelasting 2001][ref5].

      5 Onder noemerinkomen wordt verstaan: het inkomen uit werk en woning verminderd met de – met overeenkomstige
      toepassing van [afdeling 3.13, van de Wet inkomstenbelasting 2001][ref6] – te verrekenen negatieve bedragen aan
      noemerinkomen uit andere jaren.

      6 In afwijking van het vijfde lid wordt het noemerinkomen per Mogendheid vermeerderd met de op het inkomen uit
      werk en woning in het jaar in mindering gebrachte uitgaven voor inkomensvoorzieningen en persoonsgebonden aftrek
      voorzover deze bij de belastingheffing in die Mogendheid in aanmerking zijn genomen.

      7 In afwijking van het vijfde lid, wordt, indien het inkomen van een belastingplichtige hoofdzakelijk uit
      een Mogendheid afkomstig is en die Mogendheid bij de belastingheffing van het inkomen de persoonlijke- en
      gezinssituatie van de belastingplichtige volledig in aanmerking neemt, of op grond van het Verdrag betreffende
      de werking van de Europese Unie gehouden is deze volledig in aanmerking te nemen, het noemerinkomen, ook voor de
      bepaling van de vermindering wegens buitenlands inkomen uit andere Mogendheden, vermeerderd met de op het inkomen
      uit werk en woning in het jaar in mindering gebrachte uitgaven voor inkomensvoorzieningen en persoonsgebonden
      aftrek. De vorige volzin is van overeenkomstige toepassing met betrekking tot een Mogendheid, niet zijnde een
      lidstaat van de Europese Unie, die als zij een zodanige lidstaat zou zijn, gehouden zou zijn om op grond van het
      Verdrag betreffende de werking van de Europese Unie de persoonlijke- en gezinssituatie volledig in aanmerking te
      nemen.


