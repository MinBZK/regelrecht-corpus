  - number: 24a
    text: |-
      1 Een bedrag aan in een jaar vrij te stellen buitenlands voordeel uit sparen en beleggen dat als gevolg van het in
      aanmerking nemen van de persoonsgebonden aftrek en de toepassing van [artikel 24, tweede lid, tweede volzin][ref1],
      niet leidt tot een vermindering van belasting over dat jaar, wordt overgebracht naar het volgend jaar. Deze
      overbrenging bedraagt niet meer dan het bedrag van de persoonsgebonden aftrek waarmee het voordeel uit sparen
      en beleggen is verminderd. De overbrenging vindt alleen plaats indien het naar het volgend jaar over te brengen
      buitenlands voordeel uit sparen en beleggen door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.

      2 In het jaar waarnaar de overbrenging plaatsvindt, wordt voor de berekening van de vermindering van
      [artikel 24][ref2] het buitenlands voordeel uit sparen en beleggen verhoogd met het over te brengen bedrag aan
      buitenlands voordeel uit sparen en beleggen. Het noemerinkomen wordt niet verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel24
