  - number: '11'
    text: |-
      1 Een bedrag aan in een jaar vrij te stellen buitenlands inkomen uit werk en woning – per Mogendheid
      berekend met inachtneming van de verrekening volgens [artikel 12][ref1] – dat door de toepassing van
      [artikel 10, derde lid][ref2], niet leidt tot een vermindering van belasting over dat jaar, wordt overgebracht
      naar het volgend jaar. Deze overbrenging vindt alleen plaats indien het naar het volgend jaar over te brengen
      buitenlands inkomen uit werk en woning door de inspecteur is vastgesteld bij voor bezwaar vatbare beschikking.

      2 In het jaar waarnaar de overbrenging plaatsvindt, wordt voor de berekening van de vermindering van
      [artikel 10][ref3] het buitenlands inkomen uit werk en woning verhoogd met het over te brengen bedrag aan
      buitenlands inkomen uit werk en woning. Het noemerinkomen wordt niet verhoogd.

      3

      4 Indien een binnenlandse belastingplichtige beloningen geniet als bedoeld in een compensatieregeling voor
      grensarbeiders in een andere regeling ter voorkoming van dubbele belasting, zijn het eerste en tweede lid niet
      van toepassing.

      5 Bij ministeriële regeling kan onder daarbij te stellen voorwaarden worden bepaald dat het vierde lid geheel of
      gedeeltelijk niet van toepassing is.


