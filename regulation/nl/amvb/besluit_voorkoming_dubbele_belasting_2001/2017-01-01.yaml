  - number: '44'
    text: |-
      1 De inspecteur stelt het volgens [artikel 37][ref1] over te brengen bedrag aan vanwege andere Mogendheden geheven
      belasting vast bij voor bezwaar vatbare beschikking.

      2 De in het eerste lid bedoelde vaststelling gebeurt gelijktijdig met het vaststellen van de aanslag over dat jaar.
      Het bedrag van de naar het volgende jaar over te brengen belasting wordt op het aanslagbiljet afzonderlijk vermeld.

      3 Rechtsmiddelen tegen een beschikking als bedoeld in het eerste lid kunnen uitsluitend betrekking hebben op:

      a. de grootte van het over te brengen bedrag aan belasting voor zover dat niet eerder is vastgesteld, en

      b. de toepassing van [artikel 44a][ref2].

      4 Het bedrag aan over te brengen belasting kan worden herzien of alsnog worden vastgesteld, indien:

      a. een aanslag wordt verminderd wegens de verrekening van verliezen uit andere jaren;

      b. de inspecteur een navorderingsaanslag vaststelt;

      c. de inspecteur een beschikking herziet waarin het bedrag van een verlies wordt vastgesteld;

      d. enig feit grond oplevert voor het vermoeden dat het bedrag van de over te brengen belasting te hoog is
      vastgesteld, waarbij de herziening alleen kan plaatsvinden voor in de beschikking opgenomen vanwege een
      buitenlandse Mogendheid geheven belasting in een van de twaalf voorafgaande jaren.

      5 In afwijking in zoverre van [artikel 37, eerste lid, tweede volzin][ref3], wordt, indien het vierde lid
      toepassing vindt, het herziene of het alsnog vastgestelde bedrag aan belasting dat naar het volgende jaar wordt
      overgebracht, in het volgend jaar in aanmerking genomen zonder dat dit bedrag vooraf door de inspecteur bij
      voor bezwaar vatbare beschikking is vastgesteld. De vorige volzin vindt overeenkomstige toepassing voor zover de
      herziening gevolgen heeft voor bedragen die worden overgebracht naar jaren waarvoor al een aanslag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012095#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012095#Artikel44a
      [ref3]: https://wetten.overheid.nl/BWBR0012095#Artikel37
