  - number: '15'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 juni 2024.

      2 Dit besluit vervalt met ingang van 1 januari 2027.

      3 In afwijking van het tweede lid blijft dit besluit, zoals het luidde op de dag voorafgaand aan de datum met
      ingang waarvan dit besluit vervalt, van toepassing op de afwikkeling van het eenmalige bedrag op grond van dit
      besluit.
