  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Armoedebeleid, Participatie en Pensioenen van 7 juli 2023, nr. 2023-
    0000513605,

    Gelet op de artikelen 3 en 9 van de Kaderwet SZW-subsidies en artikel 54, elfde lid, van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 september 2023 nr. W12.23.00174/III);

    Gezien het nader rapport van Onze Minister voor Armoedebeleid, Participatie en Pensioenen van 4 oktober 2023,
    nr. 2023-0000526908,

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *SVB:* Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];
        - *Toescheidingsovereenkomst:* de op 25 november 1975 te Paramaribo ondertekende Toescheidingsovereenkomst inzake
      nationaliteiten tussen het Koninkrijk der Nederlanden en de Republiek Suriname.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '2'
    text: |-
      Met dit besluit wordt als gebaar van erkenning een eenmalig bedrag toegekend aan ouderen van Surinaamse herkomst,
      dat ziet op de unieke samenloop van omstandigheden van deze groep, gevormd door de verwachtingen die zijn
      ontstaan rondom het onafhankelijkheidsproces van Suriname, in verband met de komst van deze groep naar Nederland
      met het oog op de inwerkingtreding van de Toescheidingsovereenkomst, het onrecht dat deze groep ervaart, omdat
      zij veronderstelden door de komst naar Nederland ook recht op een volledige ouderdomsuitkering op grond van de
      [Algemene Ouderdomswet][ref1] te krijgen, terwijl soms over een lange periode geen recht op grond van de Algemene
      Ouderdomswet is opgebouwd, en de politiek-bestuurlijke wens om de pijn van deze groep vanwege deze samenloop van
      omstandigheden te erkennen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '3'
    text: |-
      Een persoon heeft recht op een eenmalig bedrag, indien deze:

      a. uiterlijk op 25 november 1975 in Nederland is gaan wonen, met het oog op de inwerkingtreding van de
      Toescheidingsovereenkomst;

      b. voorafgaand aan het tijdstip waarop deze persoon in Nederland ging wonen in Suriname woonde;

      c. ten minste de leeftijd van 18 jaar had bereikt op het tijdstip, waarop deze persoon in Nederland ging wonen; en

      d. op 1 juli 2024 ten minste 20 jaar in Nederland heeft gewoond.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel3
  - number: '4'
    text: |-
      Het bedrag waarop de persoon, bedoeld in [artikel 3][ref1], recht heeft bedraagt € 5.000.


      [ref1]: https://wetten.overheid.nl/BWBR0048840#Artikel3
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0048840
        artikel: '3'
  - number: '5'
    text: Het recht op het eenmalige bedrag wordt ambtshalve of op aanvraag toegekend.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister stelt de persoon ten aanzien waarvan het voornemen bestaat om het recht op het eenmalige bedrag
      ambtshalve toe te kennen, gedurende een door Onze Minister gestelde termijn in de gelegenheid om te kennen te geven
      niet in aanmerking te willen komen voor de ambtshalve toekenning van het eenmalige bedrag.

      2 Het recht op het eenmalige bedrag wordt vanaf 1 juli 2024 ambtshalve toegekend, nadat de termijn, bedoeld in het
      eerste lid, is verstreken.

      3 Onze Minister kent het recht op het eenmalige bedrag niet ambtshalve toe ten aanzien van de persoon die te kennen
      heeft gegeven niet in aanmerking te willen komen voor het eenmalige bedrag.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel6
  - number: '7'
    text: |-
      1 Een aanvraag kan in de periode van 1 juli 2024 tot en met 30 juni 2026 bij de SVB worden ingediend, door middel
      van een door de SVB verstrekt aanvraagformulier.

      2 Onze Minister beslist binnen twaalf weken na ontvangst van de volledige aanvraag over de toekenning van het
      eenmalige bedrag.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel7
  - number: '8'
    text: Onze Minister betaalt het eenmalige bedrag binnen zes weken na de toekenning daarvan uit.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel8
  - number: '9'
    text: |-
      De persoon die een aanvraag heeft gedaan, of aan wie het recht op het eenmalige bedrag is toegekend, verstrekt op
      verzoek of uit eigen beweging de inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van dit besluit en
      verleent ook de medewerking die redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel9
  - number: '10'
    text: |-
      1 Een besluit tot toekenning van het eenmalige bedrag wordt ingetrokken, indien de verplichtingen, bedoeld in
      [artikel 9][ref1] niet of niet behoorlijk zijn nagekomen en dit heeft geleid tot het ten onrechte toekennen van het
      eenmalige bedrag, of het eenmalige bedrag anderszins ten onrechte is toegekend.

      2 Het eenmalige bedrag dat als gevolg van een besluit als bedoeld in het eerste lid ten onrechte is toegekend,
      alsmede hetgeen anderszins onverschuldigd is betaald, wordt teruggevorderd.

      3 Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister besluiten geheel of gedeeltelijk van
      intrekking of terugvordering af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0048840#Artikel9
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0048840
        artikel: '9'
  - number: '11'
    text: |-
      Onze Minister kan de voorzitter van de raad van bestuur van de SVB mandaat verlenen betreffende de in dit besluit
      toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel11
  - number: '12'
    text: |-
      1 De SVB wordt aangewezen als instantie waarvoor de verplichtingen, bedoeld in
      [artikel 54, derde, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      gelden ten aanzien van alle gegevens en inlichtingen die noodzakelijk zijn voor de uitvoering van dit besluit.

      2 Ten behoeve van de uitvoering van dit besluit worden in ieder geval de volgende gegevens verwerkt:

      a. gegevens over naam, adres en woonplaats;

      b. gegevens over geboortedatum en geboorteplaats;

      c. gegevens over ingezetenschap;

      d. gegevens over het rekeningnummer van een bankrekening.

      3 Onze Minister is de verwerkingsverantwoordelijke, bedoeld in artikel 4 van de Algemene verordening
      gegevensbescherming, voor de verwerking van persoonsgegevens op basis van dit besluit.

      4 De SVB is de verwerker, bedoeld in artikel 28 van de Algemene verordening gegevensbescherming voor de verwerking
      van persoonsgegevens ter uitvoering van de aan hem ten behoeve van de uitvoering van dit besluit gemandateerde
      taken.

      5 De persoonsgegevens die worden verwerkt ter uitvoering van dit besluit worden niet verder verwerkt voor andere
      doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '54'
  - number: '13'
    text: |-
      1 De gegevens, bedoeld in [artikel 12][ref1], worden vernietigd na een periode van maximaal 7 jaar, te rekenen
      vanaf de datum van ontvangst van het gegeven.

      2 De gegevens die niet meer noodzakelijk zijn, gelet op het doel waarvoor zij worden verwerkt, worden verwijderd.

      3 De verwijderde gegevens worden vernietigd, tenzij wettelijke regels omtrent bewaring daaraan in de weg staan.


      [ref1]: https://wetten.overheid.nl/BWBR0048840#Artikel12
    url: https://wetten.overheid.nl/BWBR0048840/2024-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0048840
        artikel: '12'
  - number: '14'
    text: |-
      1 Het Rijk voorziet in de middelen tot dekking van de uitgaven verbonden aan dit besluit.

      2 De SVB beheert afzonderlijk de middelen, bedoeld in het eerste lid.

      3 Onze Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1]
      voorschotten op de rijksbijdrage op basis van de door de SVB geraamde kosten van:

      a. de eenmalige bedragen, met als valutadatum de tweeëntwintigste dag van de maand; en

      b. de uitvoering, met als valutadatum de vijftiende dag van de maand.

      4 Onze Minister kan, na overleg met de SVB, van de in het derde lid bedoelde bedragen afwijken.

      5 De SVB brengt aan Onze Minister inhoudelijk en financieel
      verslag uit over de uitvoering van dit besluit overeenkomstig
      __REF000___________________________________________________________________________________________________________
      ___ en de krachtens die bepaling geldende regels.

      6 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3], rekent Onze Minister de baten en
      lasten, alsmede de ontvangen voorschotten met betrekking tot het betreffende kalenderjaar af, met als valutadatum
      1 juni van het hierop volgende kalenderjaar.


