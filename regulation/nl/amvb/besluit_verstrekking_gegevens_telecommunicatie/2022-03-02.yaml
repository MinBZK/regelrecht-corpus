---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_verstrekking_gegevens_telecommunicatie
regulatory_layer: AMVB
publication_date: '2022-03-01'
valid_from: '2022-03-02'
bwb_id: BWBR0011123
url: https://wetten.overheid.nl/BWBR0011123/2022-03-02
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van

    20 mei 1998, nr. HDTP/98/1553/HW, Hoofddirectie Telecommunicatie en Post in overeenstemming met Onze Ministers van
    Justitie en van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 13.1, tweede lid, 13.2, derde lid, 13.4, derde lid, en 20.18 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 19 augustus 1998, nr. W09.98.0215);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 januari 2000, nr. DGTP/99/3602/JdJ,
    Directoraat-Generaal Telecommunicatie en Post uitgebracht in overeenstemming met Onze Ministers van Justitie en van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      informatiepunt: het Centraal informatiepunt onderzoek telecommunicatie, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel2
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '2'
  - number: 1.c
    text: 'aanbieder: de aanbieder van een openbaar telecommunicatienetwerk of een openbare telecommunicatiedienst;'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.d
    text: 'bevoegde autoriteit:'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.d.1°
    text: |-
      de rechter-commissaris in strafzaken, de officier van justitie, de korpschef, bedoeld in
      [artikel 27 van de Politiewet 2012][ref1], of het hoofd van een opsporingsdienst, dan wel de door de korpschef voor
      zijn korps of door het hoofd voor zijn dienst aangewezen opsporingsambtenaar,


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 1.d.2°
    text: het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst, of de door hem aangewezen ambtenaar,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.d.3°
    text: het hoofd van de Militaire Inlichtingen- en Veiligheidsdienst, of de door hem aangewezen ambtenaar;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.e
    text: |-
      informatie: de informatie, bedoeld in [artikel 13.4, tweede lid, van de wet][ref1], voor zover deze
      informatie geen betrekking heeft op een ander nummer dan het aansluitnummer voor vaste of mobiele openbare
      telefoonnetwerken, en geen betrekking heeft op een ander nummer dan de inlognaam of gebruikersnaam, een e-
      mail adres, identificatienummers van eindapparaten of een toegewezen Internet-protocol-nummer voor openbare
      telecommunicatienetwerken en openbare telecommunicatiediensten die uitsluitend bestaan in de verlening van toegang
      tot Internet of de door middel van Internet te leveren of te verrichten diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel13
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '13'
  - number: 1.f
    text: |-
      gebruiker: de natuurlijke of rechtspersoon die met de aanbieder een overeenkomst is aangegaan met betrekking
      tot het gebruik van een netwerk of de levering van een openbare telecommunicatiedienst, alsmede de natuurlijke
      of rechtspersoon die daadwerkelijk gebruik maakt van een openbaar telecommunicatienetwerk of een openbare
      telecommunicatiedienst;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.g
    text: 'aansluitnummer:'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.g.1°
    text: 'bij vaste openbare telefoonnetwerken: het bij een netwerkaansluitpunt behorende nummer;'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.g.2°
    text: 'bij mobiele openbare telefoonnetwerken: het Mobile Station Integrated Systems Digital Network Number;'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: 1.g.3°
    text: |-
      bij spraakcommunicatiediensten: het bij een netwerkaansluitpunt behorende nummer dan wel het Mobile Station
      Integrated Systems Digital Netwerk Number.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel1
  - number: '2'
    text: |-
      Onze Minister van Justitie en Veiligheid is belast met het langs geautomatiseerde weg doorgeleiden van verzoeken
      om en verstrekkingen van informatie. Hij voert deze taak uit door middel van het Centraal informatiepunt onderzoek
      telecommunicatie.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel2
  - number: '3.1'
    text: |-
      Het informatiepunt, de bevoegde autoriteit en de aanbieder treffen ieder de technische voorzieningen die nodig
      zijn teneinde uitvoering te geven aan het tweede, derde en vierde lid. De technische voorzieningen voldoen aan
      de voorwaarden bedoeld in de [artikelen 4][ref1] en [5][ref2] en aan de specificaties die zijn opgenomen in de
      bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011123#Artikel5
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011123
        artikel: '5'
  - number: '3.2'
    text: |-
      De bevoegde autoriteit verzoekt om verstrekking van informatie die is opgenomen in het bestand, bedoeld in
      [artikel 4][ref1], door tussenkomst van het informatiepunt. De bevoegde autoriteit doet het verzoek langs
      geautomatiseerde weg.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
  - number: '3.3'
    text: |-
      De aanbieder verstrekt de informatie door tussenkomst van het informatiepunt. Daartoe verleent de aanbieder het
      informatiepunt langs geautomatiseerde weg gedurende 24 uur per dag rechtstreekse toegang tot de bestanden, bedoeld
      in [artikel 4, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
  - number: '3.4'
    text: |-
      Het informatiepunt vergelijkt langs geautomatiseerde weg de gegevens waarop het verzoek betrekking heeft met
      de gegevens in de bestanden, bedoeld in artikel 4, eerste en tweede lid. Wanneer de gegevens waarop het verzoek
      betrekking heeft aanwezig zijn in de bestanden, worden deze langs geautomatiseerde weg door het informatiepunt
      doorgeleid aan de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
  - number: '3.5'
    text: |-
      Op verzoek van de bevoegde autoriteit voorziet de aanbieder zonder tussenkomst van het informatiepunt in correctie
      van of toelichting op de gegevens, bedoeld in het vierde lid, tweede volzin.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
  - number: '3.6'
    text: |-
      Een aanbieder en het informatiepunt komen overeen dat het informatiepunt optreedt als verwerker van de bestanden,
      bedoeld in [artikel 4][ref1], indien de apparatuur waarin de bestanden zijn opgeslagen in beheer is bij het
      informatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
  - number: '4.1'
    text: |-
      De aanbieder van vaste openbare telefoonnetwerken dan wel van mobiele openbare telefoonnetwerken of van
      spraakcommunicatiediensten, beschikt over een bestand waarin de volgende gegevens zijn opgenomen van de personen
      die gebruik maken van een dienst of netwerk van de aanbieder:
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.1.a
    text: de naam, het adres met nummer en eventuele toevoegingen, de postcode en de woonplaats;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.1.b
    text: de telecommunicatiedienst die wordt afgenomen en,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.1.c
    text: het aansluitnummer dat, onderscheidenlijk de aansluitnummers die, aan een gebruiker zijn verleend;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.1.d
    text: |-
      de naam van de aanbieder van het vaste openbare telefoonnetwerk of het mobiele openbare telefoonnetwerk met behulp
      waarvan de aanbieder van spraakcommunicatiediensten de diensten aan de gebruiker heeft verleend.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: '4.2'
    text: |-
      De aanbieder van openbare telecommunicatienetwerken of van openbare telecommunicatiediensten die uitsluitend
      bestaan in de verlening van toegang tot Internet en de door middel van Internet te leveren of te verrichten
      diensten beschikt over een bestand waarin de volgende gegevens zijn opgenomen van de gebruikers van een netwerk of
      dienst van de aanbieder:
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.2.a
    text: de naam, het adres met nummer en eventuele toevoegingen, de postcode en de woonplaats,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.2.b
    text: de telecommunicatiedienst die wordt afgenomen, waaronder mede wordt verstaan de soort verbinding,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.2.c
    text: |-
      de gebruikersnaam, de inlognaam en de e-mail adressen van een gebruiker, de identificatienummers van randapparaten
      van een gebruiker, en de Internet-protocol-nummers die op het tijdstip, waarop de gegevens van het bestand worden
      geactualiseerd, aan een gebruiker zijn toegekend voor de verlening van toegang tot Internet of de door middel van
      Internet te leveren of te verrichten diensten, en
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: 4.2.d
    text: |-
      de naam van de aanbieder van het openbare telecommunicatienetwerk met behulp waarvan de aanbieder van de openbare
      telecommunicatiedienst de diensten aan de gebruiker heeft verleend.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: '4.3'
    text: |-
      De aanbieder actualiseert de gegevens in het bestand, bedoeld in het eerste respectievelijk het tweede lid, ten
      minste iedere 24 uur, door een aanpassing van de gegevens aan de meest actuele gegevens die hij gebruikt voor zijn
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel4
  - number: '5.1'
    text: |-
      Een verzoek van de bevoegde autoriteit, bedoeld in [artikel 3, tweede lid][ref1], kan slechts in het systeem worden
      ingevoerd door een door Onze Minister van Justitie en Veiligheid geautoriseerde ambtenaar die daartoe gebruik maakt
      van een hem toegekende toegangscode.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '5.2'
    text: |-
      De technische voorzieningen, bedoeld in [artikel 3, eerste lid][ref1], zijn alleen toegankelijk voor personen die
      door Onze Minister van Justitie en Veiligheid zijn geautoriseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '5.3'
    text: |-
      De vergelijking en doorgeleiding, bedoeld in [artikel 3, vierde lid][ref1], kan 24 uur per dag plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '5.4'
    text: |-
      Bij de toegang, bedoeld in [artikel 3, derde lid][ref1], tot de bestanden, bedoeld in
      [artikel 4, eerste en tweede lid][ref2], en de vergelijking en doorgeleiding, bedoeld in
      [artikel 3, vierde lid][ref3], worden:


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011123#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011123
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0011123
        artikel: '3'
  - number: 5.4.a
    text: |-
      geen gegevens betreffende de bevoegde autoriteit, de inhoud van het verzoek en de beantwoording van het verzoek aan
      de aanbieder bekend,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
  - number: 5.4.b
    text: geen gegevens van de aanbieder bekend aan anderen dan het informatiepunt of de bevoegde autoriteit,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
  - number: 5.4.c
    text: |-
      aan het informatiepunt of de bevoegde autoriteit geen andere gegevens bekend dan die welke ingevolge
      [artikel 4, eerste en tweede lid][ref1], zijn opgenomen in de in die artikelleden bedoelde bestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
  - number: '5.5'
    text: |-
      De vergelijking, bedoeld in [artikel 3, vierde lid][ref1], vindt slechts plaats aan de hand van een in het verzoek
      opgenomen gegeven betreffende naam, adres, postcode, huisnummer, nummertoevoeging of nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '5.6'
    text: |-
      De doorgeleiding, bedoeld in [artikel 3, vierde lid][ref1], betreft slechts de gegevens waarop het verzoek zich
      richt.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '6'
    text: |-
      Bij regeling van Onze Minister van Justitie en Veiligheid kunnen regels worden gesteld met betrekking tot de
      werkwijze van het informatiepunt.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister van Justitie en Veiligheid draagt er zorg voor dat het informatiepunt voor elke
      informatieverstrekking een kenmerk vastlegt aan de hand waarvan kan worden herleid door welke aanbieder, aan welke
      bevoegde autoriteit en op welke rechtsgrondslag informatie is verstrekt. De vastlegging wordt gedurende drie jaren
      bewaard.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister van Justitie en Veiligheid draagt er zorg voor dat het informatiepunt geen gegevens opslaat als
      bedoeld in [artikel 4, eerste en tweede lid][ref1], tenzij de gegevens worden opgeslagen onder verantwoordelijkheid
      van de aanbieder op basis van een overeenkomst als bedoeld in [artikel 3, zesde lid][ref2]. De vastlegging, bedoeld
      in het eerste lid, vindt op zodanige wijze plaats dat daarin geen gegevens worden opgenomen die herleidbaar zijn
      tot personen op wie een verzoek om informatie betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '8.1'
    text: |-
      Onze Minister van Justitie en Veiligheid stelt jaarlijks een verslag op waarin voor wat betreft de opsporing van
      strafbare feiten melding wordt gemaakt van het aantal malen waarin door tussenkomst van het informatiepunt aan een
      bevoegde autoriteit informatie is verstrekt. Deze vermelding is in ieder geval uitgesplitst naar:
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: 8.1.a
    text: de rechtsgrondslag van het verzoek van de bevoegde autoriteit,
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: 8.1.b
    text: de arrondissementsparketten en de politie, of andere opsporingsdiensten.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister van Justitie en Veiligheid stelt jaarlijks een verslag op van een audit naar de goede uitvoering van
      dit besluit door de aanbieders van openbare telecommunicatiediensten of van openbare telecommunicatienetwerken, het
      informatiepunt, de arrondissementsparketten en de politie, of andere opsporingsdiensten. Daarbij worden ten minste
      de volgende onderwerpen behandeld:
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: 8.2.a
    text: de werking van het systeem;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: 8.2.b
    text: de kwaliteit van de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: 8.2.c
    text: de bevraging van gegevens.
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel8
  - number: '9'
    text: |-
      Met de in [artikel 3, eerste lid][ref1], bedoelde technische voorzieningen worden gelijkgesteld technische
      voorzieningen die rechtmatig zijn geproduceerd of in de handel zijn gebracht in een andere lid-staat van de
      Europese Unie dan wel rechtmatig zijn geproduceerd in een staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte, en die ten minste aan gelijkwaardige eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011123#Artikel3
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011123
        artikel: '3'
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit verstrekking gegevens telecommunicatie.'
    url: https://wetten.overheid.nl/BWBR0011123/2022-03-02#Artikel13
