preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 juni 1998, nr. HDTP/98/1681/MD Hoofddirectie
    Telecommunicatie en Post;

    Gelet op de artikelen 3 tot en met 7 van richtlijn nr. 98/10/EG van het Europees Parlement en de Raad van de
    Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision (ONP) op spraaktelefonie en
    inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat (PbEG L 101) en op artikel
    9.1 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 13 augustus 1998, nr. W09.98.0235);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 3 november 1998, nr. HDTP/98/3281/
    JWD, Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. openbare betaaltelefoon: voor het publiek toegankelijk telefoontoestel, voor het gebruik waarvan met munten,
      krediet- of debetkaart of met een vooruit betaalde telefoonkaart wordt betaald;

      c. woonkern: aaneengesloten bebouwing binnen één gemeente;

      d. abonnee: natuurlijke persoon of rechtspersoon die partij is bij een overeenkomst met een aanbieder van openbare
      telecommunicatiediensten voor de levering van dergelijke diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '2'
    text: |-
      Als openbare telecommunicatiediensten of daarmee samenhangende voorzieningen als bedoeld in
      [artikel 9.1, eerste lid, van de wet][ref1] worden aangewezen:

      a. het naar aanleiding van een redelijk verzoek aansluiten op het vaste openbare telefoonnetwerk op een vaste
      locatie en het bieden van toegang tot de vaste openbare telefoondienst;

      b. het beschikbaar stellen van openbare betaaltelefoons;

      c. het beschikbaar stellen van telefoongidsen;

      d. het beschikbaar stellen van een abonnee-informatiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel9.1
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '9.1'
  - number: '3'
    text: |-
      Het vaste openbare telefoonnetwerk, bedoeld in [artikel 2, onderdeel a][ref1], voldoet aan deel 1 van bijlage I
      van [richtlijn nr. 97/33/EG](31997L0033) van het Europees Parlement en de Raad van de Europese Unie van 30 juni
      1997 inzake interconnectie op telecommunicatiegebied, wat betreft de waarborging van de universele dienst en van de
      interoperabiliteit door toepassing van de beginselen van Open Network Provision (ONP) (PbEG L 199).


      [ref1]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '4'
    text: |-
      In een woonkern met meer dan 5000 inwoners wordt zorg gedragen voor het plaatsen en instandhouden van ten minste
      een openbare betaaltelefoon per 5000 inwoners.
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel4
  - number: '5'
    text: |-
      1 Onverminderd [artikel 11.6, eerste lid, van de wet][ref1] bevatten de telefoongidsen, bedoeld in
      [artikel 2, onderdeel c][ref2], de gegevens van de abonnees van aanbieders van vaste en mobiele openbare
      telefoondiensten met inbegrip van hun vaste, mobiele en persoonlijke nummers.

      2 De telefoongidsen zijn beschikbaar in een door het college goedgekeurde gedrukte of elektronische vorm.

      3 De telefoongidsen worden ten minste eenmaal per jaar bijgewerkt.

      4 Een aanbieder van de in dit artikel bedoelde telefoongidsen is gehouden bij de behandeling en de presentatie van
      de hem verstrekte informatie non-discriminatoir te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11.6
      [ref2]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11.6'
      - id: ref2
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '6'
    text: |-
      1 Onverminderd [artikel 11.6, eerste lid, van de wet ][ref1]bevat de abonnee-informatiedienst, bedoeld in
      [artikel 2, onderdeel d][ref2], de vaste, mobiele en persoonlijke nummers van de abonnees van aanbieders van vaste
      en mobiele openbare telefoondiensten.

      2 Een aanbieder van de in dit artikel bedoelde abonnee-informatiedienst is gehouden bij de behandeling en de
      presentatie van de hem verstrekte informatie non-discriminatoir te handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel11.6
      [ref2]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '11.6'
      - id: ref2
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '7'
    text: |-
      1 Voor een natuurlijk persoon die uitsluitend of hoofdzakelijk anders dan in de uitoefening van een beroep of
      bedrijf handelt, dient in ieder geval een aanbod beschikbaar te zijn bestaande uit een enkelvoudige en analoge
      aansluiting en toegang als bedoeld in [artikel 2, onderdeel a][ref1], tegen ten hoogste bij ministeriële regeling
      vast te stellen tarieven. Deze tarieven hebben betrekking op de periodieke vergoedingen voor het abonnement en op
      de verkeersafhankelijke vergoedingen in verband met het regionale en overige nationale telefoonverkeer.

      2 Bij het vaststellen van de tarieven, bedoeld in het eerste lid, worden in acht genomen de ramingen van het
      Centraal Planbureau voor de ontwikkeling van de consumptieprijs, blijkend uit de laatst bekende formele publicatie
      van het Centraal Planbureau.


      [ref1]: https://wetten.overheid.nl/BWBR0009996#Artikel2
    url: https://wetten.overheid.nl/BWBR0009996/1998-12-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009996
        artikel: '2'
  - number: '8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de maximale hoogte van de tarieven
      van de openbare telecommunicatiediensten en voorzieningen, bedoeld in [artikel 2, onderdelen b, c, d][ref1],
      alsmede met betrekking tot de uitvoering van de [artikelen 3][ref2] tot en met [7][ref3].
      [Artikel 7, tweede lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009996#Artikel2
