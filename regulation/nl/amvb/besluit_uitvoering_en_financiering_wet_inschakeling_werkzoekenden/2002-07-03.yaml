    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet inschakeling werkzoekenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
