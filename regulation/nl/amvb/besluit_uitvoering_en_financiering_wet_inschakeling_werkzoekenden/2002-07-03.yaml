  - number: 1.b
    text: |-
      basisbedrag: het bedrag, bedoeld in [artikel 14, tweede lid, onderdeel a][ref1], van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel14
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
    references:
      - id: ref1
