        artikel: '14'
        hoofdstuk: '6'
  - number: 1.e
    text: |-
      normbedragen: de vaste bedragen, die aan de gemeente worden verleend voor de kosten die samenhangen met het tot
      stand brengen van dienstbetrekkingen;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
  - number: 1.f
    text: |-
      werkervaringsplaats: een arbeidsovereenkomst als bedoeld in [artikel 5, eerste lid][ref1], van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel5
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '5'
        hoofdstuk: '3'
  - number: 1.g
    text: 'subsidiejaar: het jaar (t) waarover de subsidie wordt verleend;'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
  - number: 1.h
    text: 'arbeidskosten: de kosten van een werkgever, die voortvloeien uit het aangaan van arbeidsovereenkomsten;'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
  - number: 1.i
    text: |-
      werknemer: degene, die een dienstbetrekking heeft als bedoeld in [artikel 1, eerste lid, onderdeel g][ref1], van
      de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel1
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.j
    text: |-
      overheidsbijdragen: vergoedingen en bijdragen ten laste van ’s Rijks kas, financiering uit gemeentelijke middelen,
      subsidies, dan wel financiering door toepassing van de sociale verzekeringswetten.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel1
  - number: '2.1'
    text: |-
      Het aantal werknemers, dat aan een onderneming ter beschikking kan worden gesteld voor het verrichten van
      werkzaamheden in die onderneming, bedraagt maximaal 10% van het aantal in die onderneming werkzame personen, met
      dien verstande dat aan die onderneming in ieder geval één werknemer ter beschikking kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het percentage, bedoeld in het eerste lid, bedraagt het aantal werknemers, dat ter beschikking
      kan worden gesteld aan een onderneming in een sector, waarin de behartiging van een algemeen maatschappelijk
      belang op de voorgrond staat en het streven naar winst, hetzij geheel ontbreekt, hetzij van bijkomende betekenis
      is, dan wel de arbeidskosten nagenoeg geheel bekostigd worden met overheidsbijdragen, maximaal 20% van het aantal
      in die onderneming werkzame personen, met dien verstande dat dit percentage kan worden overschreden, indien de
      terbeschikkingstelling aan die onderneming in het belang van vermindering van de afstand tot de arbeidsmarkt van de
      werknemer naar het oordeel van de Centrale organisatie werk en inkomen aangewezen is.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel2
  - number: '2.3'
    text: |-
      In een collectieve arbeidsovereenkomst, geldend voor andere sectoren dan bedoeld in het tweede lid, kan worden
      bepaald dat het percentage, bedoeld in het eerste lid, hoger is dan 10%.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het eerste en tweede lid kan het aantal werknemers, dat ter beschikking is gesteld om arbeid te
      verrichten, die bijdraagt aan bestrijding van de achterstand op de arbeidsmarkt, de bevordering van de kwaliteit
      van de woon- en leefomgeving en aan opvang, hulpverlening en onderwijs en met gemeentelijke middelen wordt
      gefinancierd uit de bijdrage uit ’s Rijks kas op grond van de Tijdelijke wet stimulering sociale vernieuwing, zoals
      die wet luidde tot de datum van inwerkingtreding van de wet, maximaal het aantal werknemers bedragen, dat op de
      datum van inwerkingtreding van de wet als zodanig werkzaam was.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel2
  - number: '6.1'
    text: |-
      Het loon, dat op grond van [artikel 15, derde lid][ref1], van de wet aan de werknemer wordt betaald
      om de dienstbetrekking voor subsidie in aanmerking te laten komen, is het loon in de zin van de
      [Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0002471
  - number: '6.2'
    text: |-
      Het loon, bedoeld in het eerste lid, bedraagt niet meer dan 120% van het
      minimumloon en van de minimumvakantiebijslag, bedoeld in [artikel 8][ref1] en
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '6.3'
    text: |-
      Het bedrag, bedoeld in het tweede lid, wordt naar evenredigheid verminderd, indien
      de overeengekomen arbeidsduur korter is dan de normale arbeidsduur, bedoeld in
      [artikel 12 van de Wet minimumloon en minimumvakantiebijslag][ref1], die voor de toepassing van dit artikel 36 uur
      per week bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel12
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '12'
  - number: '7'
    text: |-
      De gemeente verstrekt slechts subsidie aan een werkgever voor een werkervaringsplaats, indien de
      arbeidsovereenkomst van de werkgever met de langdurig werkloze of met de jongere wordt aangegaan voor ten minste
      zes maanden.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel7
  - number: '8'
    text: |-
      Het scholings- en activeringsbudget wordt mede verleend voor activiteiten die bijdragen tot sociale activering.
      Deze activiteiten betreffen voorzover zij betrekking hebben op het verstrekken van subsidies, bedoeld in
      [artikel 3, eerste lid, van de wet][ref1], aan en ten behoeve van de in dat artikel genoemde personen, hetzij
      onbeloonde dienstverlenende activiteiten die kwaliteiten die noodzakelijk zijn om te kunnen deelnemen aan het
      arbeidsproces in stand houden of verhogen, hetzij onbeloonde activiteiten die anderszins dienstverlenend en
      maatschappelijk zinvol zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel3
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '3'
  - number: '9.1'
    text: Bij ministeriële regeling wordt de hoogte van het basisbedrag voor een dienstbetrekking per jaar vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister verleent het basisbedrag aan de gemeente voor iedere door de gemeente aangegane dienstbetrekking.
      Het basisbedrag wordt verminderd naar rato van de overeengekomen arbeidsduur voorzover deze minder bedraagt dan 32
      uur per week en afwijking van de arbeidsduur van 32 uur per week gerechtvaardigd is op grond van bij de werknemer
      gelegen factoren.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: '9.3'
    text: |-
      Afwijking van de arbeidsduur van een dienstbetrekking beneden 32 uur per week is in ieder geval gerechtvaardigd,
      indien voor de werknemer een kortere arbeidsduur aangewezen is, omdat de werknemer:
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: 9.3.a
    text: |-
      alleenstaande ouder is en de zorg heeft over één of meer ten zijne laste komende kinderen, dan wel pleegkinderen,
      in de leeftijd van 0 tot met de leeftijd van het einde van de basisschool;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: 9.3.b
    text: |-
      arbeidsgehandicapte is als bedoeld in de [Wet op de (re)integratie arbeidsgehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009565
  - number: 9.3.c
    text: |-
      buiten het kader van de dienstbetrekking deelneemt aan scholing die bijdraagt aan het vergroten van de kans op
      arbeid anders dan op grond van de wet, of
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: 9.3.d
    text: anders dan in de dienstbetrekking arbeid verricht voor meer dan 4 uur per week.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
  - number: '9.4'
    text: |-
      Afwijking van de arbeidsduur van een dienstbetrekking is verder in ieder geval gerechtvaardigd
      indien de werknemer alleen met een andere arbeidsduur dan 32 uur een zodanig loon verdient dat hij
      niet meer is aangewezen op een algemene uitkering op grond van de [Algemene bijstandswet][ref1],
      de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werknemers of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0004163
  - number: '10.1'
    text: Bij ministeriële regeling wordt de hoogte van het basisbedrag voor een werkervaringsplaats vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister verleent het basisbedrag aan de gemeente voor een werkervaringsplaats met een langdurig werkloze of
      jongere**voor maximaal 12 maanden en naar rato van het aantal maanden dat de arbeidsovereenkomst duurt, indien de
      arbeidsovereenkomst minder dan 12 maanden duurt.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: '10.3'
    text: 'Onze Minister verleent het basisbedrag aan de gemeente voor een werkervaringsplaats slechts:'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: 10.3.a
    text: indien voor de arbeidskosten door de werkgever geen andere subsidie wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: 10.3.b
    text: |-
      indien de langdurig werkloze of jongere op de werkervaringsplaats geen algemene uitkering ontvangt op grond van
      de [Algemene bijstandswet][ref1], de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werknemers
      of de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2], tenzij met
      inachtneming van het vierde lid een aanvullende uitkering op grond van voornoemde wetten gerechtvaardigd is, en


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0004163
  - number: 10.3.c
    text: de arbeidsduur ten minste 19 uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: '10.4'
    text: |-
      Een aanvullende uitkering als bedoeld in het derde lid, onderdeel b, is voor een werkervaringsplaats in ieder geval
      gerechtvaardigd, indien voor de werknemer een kortere arbeidsduur aangewezen is, omdat de werknemer:
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: 10.4.a
    text: |-
      alleenstaande ouder is en de zorg heeft over één of meer ten zijne laste komende kinderen, dan wel pleegkinderen,
      in de leeftijd van 0 tot met de leeftijd van het einde van de basisschool, of
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
  - number: 10.4.b
    text: |-
      arbeidsgehandicapte is als bedoeld in de [Wet op de (re)integratie arbeidsgehandicapten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009565
  - number: '11'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, voor het verstrekken van het basisbedrag
      voor een werkervaringsplaats een subsidieplafond vaststellen en voor de wijze van verlening van het basisbedrag bij
      vaststelling van een subsidieplafond nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel11
  - number: '12.1'
    text: |-
      Voor de door de gemeente te realiseren dienstbetrekkingen gelden normbedragen. De normbedragen verschillen naar
      categorieën jongeren en langdurig werklozen met wie een dienstbetrekking is aangegaan, naar een werkweek van 32 en
      36 uur, en naar de duur van de werkloosheid.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van het eerste lid en worden de
      normbedragen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel12
  - number: '13.1'
    text: 'Het beschikbare vast budget wordt voor 1998 over de gemeenten verdeeld volgens de volgende verdeelsleutel:'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: 13.1.a
    text: 1% van het beschikbare vast budget wordt gelijkelijk over de gemeenten verdeeld;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: 13.1.b
    text: |-
      99% van het beschikbare vast budget, verminderd met de bedragen, die beschikbaar zijn voor de aanvullende
      budgetten, bedoeld in het vierde en vijfde lid, wordt over de gemeenten verdeeld op basis van de door
      de gemeente aan Onze Minister verstrekte jaaropgaven [Algemene bijstandswet][ref1], Jeugdwerkgarantiewet
      en banenpools 1996, die zijn voorzien van een verklaring van een accountant als bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref2], waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 13.1.b.1°
    text: |-
      15% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen op grond van de Jeugdwerkgarantiewet,
      zoals deze wet luidde tot de datum van inwerkingtreding van de wet;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: 13.1.b.2°
    text: |-
      50% wordt verdeeld naar rato van het opgegeven aantal arbeidsovereenkomsten met de banenpool op grond van de
      Rijksbijdrageregeling banenpools, zoals deze regeling luidde tot de datum van inwerkingtreding van de wet;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: 13.1.b.3°
    text: |-
      35% wordt verdeeld naar rato van het opgegeven aantal personen aan wie algemene bijstand op grond
      van de [Algemene bijstandswet][ref1] is verleend, volgens code 101 en 102 van de onder de jaaropgave
      [Algemene bijstandswet][ref2] ressorterende declaratie sociale zekerheid, ultimo 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0007333
  - number: '13.2'
    text: |-
      Het vast budget, dat aan de gemeente wordt verleend voor ieder subsidiejaar (t), volgend op 1998, is het percentage
      van het beschikbare vast budget over het subsidiejaar (t), dat gelijk is aan het aandeel van de gemeente in het
      beschikbare vast budget van het voorafgaande subsidiejaar (t-1).
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: '13.3'
    text: 'In afwijking van het eerste en tweede lid kan bij ministeriële regeling worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: 13.3.a
    text: |-
      dat een deel van het beschikbare vast budget wordt verdeeld op basis van de aandelen van de gemeenten in het
      beschikbare vast budget over het voorafgaande jaar en dat het overige deel van het beschikbare vast budget over de
      gemeenten kan worden verdeeld op basis van de aantallen dienstbetrekkingen voor jongeren en personen van 23 jaar en
      ouder en personen jonger dan 65 jaar aan wie bijstand op grond van de [Algemene bijstandswet][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 13.3.b
    text: |-
      de wijze waarop de voor de verdeling van belang zijnde aantallen dienstbetrekkingen en verleende uitkeringen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel13
  - number: '14.1'
    text: |-
      Het scholings- en activeringsbudget wordt voor ieder subsidiejaar (t) over de gemeenten verdeeld volgens de
      volgende verdeelsleutel:
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: 14.1.a
    text: 2% van dit beschikbare scholings- en activeringsbudget wordt gelijkelijk over de gemeenten verdeeld;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: 14.1.b
    text: |-
      98% van dit beschikbare scholings- en activeringsbudget wordt over de gemeenten verdeeld op grond van door
      de gemeente verstrekte jaaropgaven, die zijn voorzien van een verklaring van een accountant als bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref1] over het jaar dat ligt drie jaar voorafgaande aan het
      subsidiejaar (t-3), waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 14.1.b.1°
    text: 10% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen met jongeren;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: 14.1.b.2°
    text: 15% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen met personen van 23 jaar en ouder;
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: 14.1.b.3°
    text: |-
      10% wordt verdeeld naar rato van het opgegeven aantal personen, jonger dan 21 jaar aan wie algemene bijstand op
      grond van de [Algemene bijstandswet][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: 14.1.b.4°
    text: |-
      65% wordt verdeeld naar rato van het opgegeven aantal personen van 21 jaar en ouder doch jonger dan 65 jaar, aan
      wie algemene bijstand op grond van de [Algemene bijstandswet][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007333
  - number: '14.2'
    text: |-
      In aanvulling op het bedrag van het scholings- en activeringsbudget bedoeld in het eerste lid, kan Onze Minister
      aan bij ministeriële regeling te bepalen gemeenten met een groot aantal bijstandsgerechtigden een bij die regeling
      te bepalen extra subsidiebedrag verlenen.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: '14.3'
    text: |-
      In aanvulling op het bedrag van het scholings- en activeringsbudget, bedoeld in het eerste lid, kan Onze Minister
      aan de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht een bij ministeriële regeling te bepalen subsidiebedrag
      verlenen.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: '14.4'
    text: |-
      In aanvulling op het bedrag van het scholings- en activeringsbudget, bedoeld in het eerste lid, verleent Onze
      Minister aan de gemeenten een bij ministeriële regeling te bepalen extra subsidiebedrag, dat voor de helft wordt
      verdeeld naar rato van het aantal personen dat woonachtig is in de gemeente met een uitkering op grond van de
      [Algemene nabestaandenwet][ref1] op een bij ministeriële regeling te bepalen peildatum, en voor de andere helft
      wordt verdeeld naar rato van het aantal personen dat op 31 december 2000 in de gemeente woonachtig was en als niet
      werkende werkzoekende bij de Arbeidsvoorzieningsorganisatie, bedoeld in de [Arbeidsvoorzieningswet 1996][ref2],
      zoals die wet op dat tijdstip luidde, geregistreerd stond. De aanvulling wordt uitsluitend besteed aan personen die
      als werkzoekende zijn geregistreerd bij de Centrale organisatie werk en inkomen en die geen uitkeringsgerechtigde
      zijn dan wel uitsluitend een uitkering genieten op grond van de [Algemene nabestaandenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0008367
      [ref3]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0008367
      - id: ref3
        bwb_id: BWBR0007795
  - number: '14.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop de aantallen bedoeld in
      het eerste lid worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14
  - number: 14a.1
    text: |-
      Bij ministeriële regeling kunnen tot het tijdstip van inwerkingtreding van
      [artikel 81, onderdeel Bb, van de Invoeringswet wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      gemeenten worden aangewezen die uit het scholings- en activeringsbudget, bedoeld in [artikel 14][ref2], in
      plaats van de voorzieningen, bedoeld in [artikel 3 van de wet][ref3], een subsidie kunnen verstrekken aan een
      arbeidsgehandicapte als bedoeld in [artikel 12 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] in
      de vorm van een op de arbeidsinschakeling gericht persoonsgebonden reïntegratiebudget. In deze regeling kunnen
      regels worden gesteld omtrent de aard en omvang van de activiteiten, het maximale bedrag dat uit het scholings- en
      activeringsbudget voor dit doel kan worden besteed en de aan het persoonsgebonden reïntegratiebudget te verbinden
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0009199#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009083#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel12
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '81'
      - id: ref2
        bwb_id: BWBR0009199
        artikel: '14'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0009083
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '12'
  - number: 14a.2
    text: |-
      Het zesde lid van [artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] is op deze ministeriële
      regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '33'
  - number: '15.1'
    text: |-
      Het basisbedrag voor de dienstbetrekkingen en de werkervaringsplaatsen wordt aan de hand van een opgave van het
      gemeentebestuur op of omstreeks de 15e dag van de eerste maand van het daaropvolgende kwartaal betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel15
  - number: '15.2'
    text: |-
      Het gemeentebestuur draagt er zorg voor dat de opgave, bedoeld in het eerste lid, door Onze Minister is ontvangen
      telkens uiterlijk op de 20e dag van de tweede maand volgend op het kwartaal waarop die opgave betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel15
  - number: '15.3'
    text: |-
      Voor het in het eerste lid bedoelde basisbedrag wordt op of omstreeks de 15e dag van iedere maand van dat kwartaal
      een voorschot betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel15
  - number: '15.4'
    text: |-
      Het vast budget en het scholings- en activeringsbudget worden per maand bij wijze van voorschot op of omstreeks de
      15e dag van iedere maand betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel15
  - number: '15.5'
    text: |-
      Bij ministeriële regeling wordt het model van de opgave, bedoeld in het eerste lid, vastgesteld en worden nadere
      regels gesteld met betrekking tot de verlening, de berekening, de betaling en de verrekening van de in het derde en
      vierde lid bedoelde voorschotten.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel15
  - number: '16.1'
    text: |-
      Indien de opgave, bedoeld in [artikel 15, eerste lid][ref1], [artikel 17, eerste lid][ref2], dan wel andere bij
      ministeriële regeling vastgestelde bescheiden, niet of niet volledig binnen de daarvoor gestelde termijnen zijn
      ontvangen, kan de betaling van de subsidie door Onze Minister worden opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009199#Artikel17
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '15'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009199
        artikel: '17'
        hoofdstuk: '8'
  - number: '16.2'
    text: |-
      Hervatting van de betaling vindt zo spoedig mogelijk plaats na ontvangst van de in het eerste lid bedoelde opgave
      of andere bescheiden, doch uiterlijk op of omstreeks de vijftiende dag van de maand volgend op de maand waarin die
      opgave of die andere bescheiden zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel16
  - number: '16.3'
    text: |-
      Indien op de twintigste dag van de zesde maand volgende op een kwartaal geen opgave als bedoeld in
      [artikel 15, eerste lid][ref1], over een kwartaal is ontvangen, dan worden omstreeks de vijftiende van
      de daaropvolgende maand de nog niet verrekende maandvoorschotten met betrekking tot het desbetreffende
      kalenderkwartaal teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel15
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '15'
        hoofdstuk: '7'
  - number: '17.1'
    text: Onze Minister stelt de subsidie aan de gemeente vast binnen een jaar na ontvangst van de jaaropgave.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister hanteert bij de vaststelling van het vast budget de normbedragen, bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel12
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '12'
        hoofdstuk: '5'
  - number: '17.3'
    text: |-
      Indien op grond van de wet of dit besluit een arbeidsduur van minder dan 32 uur gerechtvaardigd is, wordt het
      normbedrag verminderd naar rato van de overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
  - number: '17.4'
    text: |-
      Indien op grond van de wet of dit besluit een arbeidsduur van meer dan 32 uur gerechtvaardigd is, stelt
      Onze Minister de subsidie vast op basis van het normbedrag dat geldt voor 32 uur en het verschil tussen het
      normbedrag dat geldt voor 32 uur en het normbedrag dat geldt voor 36 uur, voor iedere door de gemeente aangegane
      dienstbetrekking naar rato van het aantal uren dat meer dan 32 uur per week wordt gewerkt.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
  - number: '17.5'
    text: |-
      De vaststelling van de basisbedragen vindt plaats overeenkomstig [de artikelen 9][ref1] en [10][ref2]. Op de
      basisbedragen worden in mindering gebracht gelden die door of vanwege de werknemer worden ontvangen op grond
      van de [Ziektewet][ref3], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend), de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsvoorziening zelfstandigen][ref5],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6] of op grond van een regeling die met deze wetten
      naar aard en strekking overeenstemt.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009199#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '9'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009199
        artikel: '10'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0008657
  - number: '17.6'
    text: |-
      Het gemeentebestuur draagt er zorg voor dat de jaaropgave door Onze Minister is ontvangen telkens uiterlijk op 20
      september van het jaar volgend op het jaar waarop de jaaropgave betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
  - number: '17.7'
    text: |-
      Indien de jaaropgave niet is ontvangen binnen 18 maanden na het kalenderjaar waarop deze betrekking heeft, wordt de
      subsidie ambtshalve vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel17
  - number: '18.1'
    text: |-
      Indien de subsidie aan de gemeente met toepassing van [artikel 18][ref1] van de wet lager wordt vastgesteld dan de
      over enig subsidiejaar verleende subsidie, wordt het verschil teruggevorderd dan wel verrekend met de beschikbare
      subsidie over het lopende subsidiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel18
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '18'
        hoofdstuk: '8'
  - number: '18.2'
    text: |-
      Indien het bedrag van het vast budget waarop de gemeente gelet op de daarvoor geldende normbedragen,
      bedoeld in [artikel 12, eerste lid][ref1], aanspraak kan maken voor de gerealiseerde dienstbetrekkingen
      het bedrag dat de gemeente feitelijk van dat vast budget daarvoor heeft besteed, overstijgt, wordt het
      meerdere door het gemeentebestuur in het daarop volgende subsidiejaar bestemd in het kader van de wet of de
      [Wet sociale werkvoorziening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '12'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0008903
  - number: '18.3'
    text: |-
      Door de gemeente wordt het deel van het verleende vast budget waarop in enige subsidiejaar geen aanspraak
      wordt gemaakt, omdat minder dienstbetrekkingen zijn gerealiseerd dan op grond van het verleende vast budget was
      toegestaan, toegevoegd aan het scholings- en activeringsbudget van het daarop volgende subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
  - number: '18.4'
    text: |-
      Voorzover de gemeente de op grond van [artikel 14, vierde lid][ref1], verleende aanvullende subsidie in een
      subsidiejaar niet heeft besteed, wordt het niet bestede subsidiebedrag teruggevorderd. Bij ministeriële regeling
      kan, onder bij die regeling vast te stellen voorwaarden, worden bepaald dat de niet of niet overeenkomstig
      [artikel 14, vierde lid][ref2], bestede subsidie geheel of gedeeltelijk wordt toegevoegd aan de op grond van
      genoemd artikellid verleende aanvullende subsidie van het daarop volgende subsidiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009199#Artikel14
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009199
        artikel: '14'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0009199
        artikel: '14'
        hoofdstuk: '6'
  - number: '18.5'
    text: |-
      Door de gemeente wordt het deel van het beschikbare scholings- en activeringsbudget dat niet of niet overeenkomstig
      de [artikelen 3][ref1] of [3a van de wet][ref2] is besteed toegevoegd aan het scholings- en activeringsbudget van
      het daarop volgende subsidiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009083
        artikel: 3a
  - number: '18.6'
    text: |-
      Voor zover de gemeente in een subsidiejaar meer scholings- en activeringsbudget heeft besteed dan het voor dat
      jaar beschikbare scholings- en activeringsbudget, wordt dat meerdere ten laste gebracht van het scholings- en
      activeringsbudget van het daarop volgende subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
  - number: '18.7'
    text: |-
      Bij ministeriële regeling kan de in het derde of vijfde lid, bedoelde toevoeging, of hetgeen overeenkomstig het
      zesde lid ten laste wordt gebracht van het scholings- en activeringsbudget van het daarop volgende subsidiejaar,
      worden beperkt tot een bepaald percentage van het toegekende vast budget of scholings- en activeringsbudget, een
      bepaald bedrag of bepaalde gemeenten.
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel18
  - number: '25'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet inschakeling werkzoekenden][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009083
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009083
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering en financiering Wet inschakeling werkzoekenden.'
    url: https://wetten.overheid.nl/BWBR0009199/2002-07-03#Artikel26
