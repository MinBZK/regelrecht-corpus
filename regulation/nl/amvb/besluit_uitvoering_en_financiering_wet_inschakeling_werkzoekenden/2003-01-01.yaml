      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0009565
  - number: '11'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, voor het verstrekken van het basisbedrag
      voor een werkervaringsplaats een subsidieplafond vaststellen en voor de wijze van verlening van het basisbedrag bij
      vaststelling van een subsidieplafond nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0009199/2003-01-01#Artikel11
  - number: '12'
    text: |-
      1 Voor de door de gemeente te realiseren dienstbetrekkingen gelden normbedragen. De normbedragen verschillen naar
      categorieën jongeren en langdurig werklozen met wie een dienstbetrekking is aangegaan, naar een werkweek van 32 en
      36 uur, en naar de duur van de werkloosheid.

      2 Bij ministeriële regeling worden nadere regels gesteld voor de toepassing van het eerste lid en worden de
      normbedragen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009199/2003-01-01#Artikel12
  - number: '13'
    text: |-
      1 Het beschikbare vast budget wordt voor 1998 over de gemeenten verdeeld volgens de volgende verdeelsleutel:

      a. 1% van het beschikbare vast budget wordt gelijkelijk over de gemeenten verdeeld;

      b. 99% van het beschikbare vast budget, verminderd met de bedragen, die beschikbaar zijn voor de
      aanvullende budgetten, bedoeld in het vierde en vijfde lid, wordt over de gemeenten verdeeld op
      basis van de door de gemeente aan Onze Minister verstrekte jaaropgaven [Algemene bijstandswet][ref1],
      Jeugdwerkgarantiewet en banenpools 1996, die zijn voorzien van een verklaring van een accountant als bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref2], waarbij:

      1°. 15% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen op grond van de Jeugdwerkgarantiewet,
      zoals deze wet luidde tot de datum van inwerkingtreding van de wet;

      2°. 50% wordt verdeeld naar rato van het opgegeven aantal arbeidsovereenkomsten met de banenpool op grond van de
      Rijksbijdrageregeling banenpools, zoals deze regeling luidde tot de datum van inwerkingtreding van de wet;

      3°. 35% wordt verdeeld naar rato van het opgegeven aantal personen aan wie algemene bijstand op grond
      van de [Algemene bijstandswet][ref3] is verleend, volgens code 101 en 102 van de onder de jaaropgave
      [Algemene bijstandswet][ref4] ressorterende declaratie sociale zekerheid, ultimo 1996.

      2 Het vast budget, dat aan de gemeente wordt verleend voor ieder subsidiejaar (t), volgend op 1998, is het
      percentage van het beschikbare vast budget over het subsidiejaar (t), dat gelijk is aan het aandeel van de gemeente
      in het beschikbare vast budget van het voorafgaande subsidiejaar (t-1).

      3 In afwijking van het eerste en tweede lid kan bij ministeriële regeling worden bepaald:

      a. dat een deel van het beschikbare vast budget wordt verdeeld op basis van de aandelen van de gemeenten in het
      beschikbare vast budget over het voorafgaande jaar en dat het overige deel van het beschikbare vast budget over de
      gemeenten kan worden verdeeld op basis van de aantallen dienstbetrekkingen voor jongeren en personen van 23 jaar en
      ouder en personen jonger dan 65 jaar aan wie bijstand op grond van de [Algemene bijstandswet][ref5] is verleend;

      b. de wijze waarop de voor de verdeling van belang zijnde aantallen dienstbetrekkingen en verleende uitkeringen
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref3]: https://wetten.overheid.nl/BWBR0007333
      [ref4]: https://wetten.overheid.nl/BWBR0007333
      [ref5]: https://wetten.overheid.nl/BWBR0007333
