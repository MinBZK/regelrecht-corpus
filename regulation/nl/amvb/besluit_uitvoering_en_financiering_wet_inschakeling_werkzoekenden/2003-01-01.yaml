  - number: '14'
    text: |-
      1 Het scholings- en activeringsbudget wordt voor ieder subsidiejaar (t) over de gemeenten verdeeld volgens de
      volgende verdeelsleutel:

      a. 2% van dit beschikbare scholings- en activeringsbudget wordt gelijkelijk over de gemeenten verdeeld;

      b. 98% van dit beschikbare scholings- en activeringsbudget wordt over de gemeenten verdeeld op grond van door
      de gemeente verstrekte jaaropgaven, die zijn voorzien van een verklaring van een accountant als bedoeld in
      [artikel 213, tweede lid, van de Gemeentewet][ref1] over het jaar dat ligt drie jaar voorafgaande aan het
      subsidiejaar (t-3), waarbij:

      1°. 10% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen met jongeren;

      2°. 15% wordt verdeeld naar rato van het opgegeven aantal dienstbetrekkingen met personen van 23 jaar en ouder;

      3°. 10% wordt verdeeld naar rato van het opgegeven aantal personen, jonger dan 21 jaar aan wie algemene bijstand op
      grond van de [Algemene bijstandswet][ref2] is verleend;

      4°. 65% wordt verdeeld naar rato van het opgegeven aantal personen van 21 jaar en ouder doch jonger dan 65 jaar,
      aan wie algemene bijstand op grond van de [Algemene bijstandswet][ref3] is verleend.

      2 In aanvulling op het bedrag van het scholings- en activeringsbudget bedoeld in het eerste lid, kan Onze Minister
      aan bij ministeriële regeling te bepalen gemeenten met een groot aantal bijstandsgerechtigden een bij die regeling
      te bepalen extra subsidiebedrag verlenen.

      3 In aanvulling op het bedrag van het scholings- en activeringsbudget, bedoeld in het eerste lid, kan Onze Minister
      aan de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht een bij ministeriële regeling te bepalen subsidiebedrag
      verlenen.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze waarop de aantallen bedoeld in
      het eerste lid worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0007333
