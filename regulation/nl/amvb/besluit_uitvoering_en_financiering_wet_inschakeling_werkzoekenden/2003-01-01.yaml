  - number: '18'
    text: |-
      1 Indien de subsidie aan de gemeente met toepassing van [artikel 18][ref1] van de wet lager wordt vastgesteld
      dan de over enig subsidiejaar verleende subsidie, wordt het verschil teruggevorderd dan wel verrekend met de
      beschikbare subsidie over het lopende subsidiejaar.

      2 Indien het bedrag van het vast budget waarop de gemeente gelet op de daarvoor geldende normbedragen,
      bedoeld in [artikel 12, eerste lid][ref2], aanspraak kan maken voor de gerealiseerde dienstbetrekkingen
      het bedrag dat de gemeente feitelijk van dat vast budget daarvoor heeft besteed, overstijgt, wordt het
      meerdere door het gemeentebestuur in het daarop volgende subsidiejaar bestemd in het kader van de wet of de
      [Wet sociale werkvoorziening][ref3].

      3 Door de gemeente wordt het deel van het verleende vast budget waarop in enige subsidiejaar geen aanspraak
      wordt gemaakt, omdat minder dienstbetrekkingen zijn gerealiseerd dan op grond van het verleende vast budget was
      toegestaan, toegevoegd aan het scholings- en activeringsbudget van het daarop volgende subsidiejaar.

      4 Voorzover de gemeente de op grond van [artikel 14, vierde lid][ref4], verleende aanvullende subsidie in een
      subsidiejaar niet heeft besteed, wordt het niet bestede subsidiebedrag teruggevorderd. Bij ministeriële regeling
      kan, onder bij die regeling vast te stellen voorwaarden, worden bepaald dat de niet of niet overeenkomstig
      [artikel 14, vierde lid][ref5], bestede subsidie geheel of gedeeltelijk wordt toegevoegd aan de op grond van
      genoemd artikellid verleende aanvullende subsidie van het daarop volgende subsidiejaar.

      5 Door de gemeente wordt het deel van het beschikbare scholings- en activeringsbudget dat niet of niet
      overeenkomstig de [artikelen 3][ref6] of [3a van de wet][ref7] is besteed toegevoegd aan het scholings- en
      activeringsbudget van het daarop volgende subsidiejaar.

      6 Voor zover de gemeente in een subsidiejaar meer scholings- en activeringsbudget heeft besteed dan het voor dat
      jaar beschikbare scholings- en activeringsbudget, wordt dat meerdere ten laste gebracht van het scholings- en
      activeringsbudget van het daarop volgende subsidiejaar.

      7 Bij ministeriële regeling kan de in het derde of vijfde lid, bedoelde toevoeging, of hetgeen overeenkomstig het
      zesde lid ten laste wordt gebracht van het scholings- en activeringsbudget van het daarop volgende subsidiejaar,
      worden beperkt tot een bepaald percentage van het toegekende vast budget of scholings- en activeringsbudget, een
      bepaald bedrag of bepaalde gemeenten. Terugvordering dan wel verrekening van subsidie die op grond van de eerste
      volzin niet aan het scholings- en activeringsbudget van het volgende subsidiejaar wordt toegevoegd, vindt voorlopig
      plaats bij de ontvangst van het verslag over de uitvoering, bedoeld in artikel 17, zesde lid


