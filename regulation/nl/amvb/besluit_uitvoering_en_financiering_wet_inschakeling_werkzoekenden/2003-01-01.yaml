articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet inschakeling werkzoekenden][ref1];

      b. basisbedrag: het bedrag, bedoeld in [artikel 14, tweede lid, onderdeel a][ref2], van de wet;

      c. vast budget: het bedrag, bedoeld in [artikel 14, tweede lid, onderdeel b][ref3], van de wet;

      d. scholings- en activeringsbudget: het bedrag, bedoeld in [artikel 14, tweede lid, onderdeel c][ref4], van de wet;

      e. normbedragen: de vaste bedragen, die aan de gemeente worden verleend voor de kosten die samenhangen met het tot
      stand brengen van dienstbetrekkingen;

      f. werkervaringsplaats: een arbeidsovereenkomst als bedoeld in [artikel 5, eerste lid][ref5], van de wet;

      g. subsidiejaar: het jaar (t) waarover de subsidie wordt verleend;

      h. arbeidskosten: de kosten van een werkgever, die voortvloeien uit het aangaan van arbeidsovereenkomsten;

      i. werknemer: degene, die een dienstbetrekking heeft als bedoeld in [artikel 1, eerste lid, onderdeel g][ref6], van
      de wet;

      j. overheidsbijdragen: vergoedingen en bijdragen ten laste van ’s Rijks kas, financiering uit gemeentelijke
      middelen, subsidies, dan wel financiering door toepassing van de sociale verzekeringswetten.


