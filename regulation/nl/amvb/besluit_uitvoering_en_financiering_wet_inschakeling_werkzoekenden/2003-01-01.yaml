    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 9 oktober 1997 (Directie Arbeidsmarkt,
    nr. AM/RAW/97/2033), gedaan in overeenstemming met de Staatssecretaris van Financiën;

    Gelet op de artikelen 5, derde lid, 6, eerste lid, onderdeel a, 7, tweede lid, 14, derde lid, 15, derde lid, 16,
    tweede lid, , 17, tweede en derde lid, en 18, vierde lid, van de Wet inschakeling werkzoekenden;

