  - number: '10'
    text: |-
      1 Bij ministeriële regeling wordt de hoogte van het basisbedrag voor een werkervaringsplaats vastgesteld.

      2 Onze Minister verleent het basisbedrag aan de gemeente voor een werkervaringsplaats met een langdurig werkloze of
      jongere**voor maximaal 12 maanden en naar rato van het aantal maanden dat de arbeidsovereenkomst duurt, indien de
      arbeidsovereenkomst minder dan 12 maanden duurt.

      3 Onze Minister verleent het basisbedrag aan de gemeente voor een werkervaringsplaats slechts:

      a. indien voor de arbeidskosten door de werkgever, met uitzondering van subsidie op grond van het [Besluit in- en
      doorstroombanen](onbekend), geen andere subsidie wordt ontvangen;

      b. indien de langdurig werkloze of jongere op de werkervaringsplaats geen algemene uitkering ontvangt op grond van
      de [Algemene bijstandswet][ref1], de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werknemers
      of de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2], tenzij met
      inachtneming van het vierde lid een aanvullende uitkering op grond van voornoemde wetten gerechtvaardigd is, en

      c. de arbeidsduur ten minste 19 uur bedraagt.

      4 Een aanvullende uitkering als bedoeld in het derde lid, onderdeel b, is voor een werkervaringsplaats in ieder
      geval gerechtvaardigd, indien voor de werknemer een kortere arbeidsduur aangewezen is, omdat de werknemer:

      a. alleenstaande ouder is en de zorg heeft over één of meer ten zijne laste komende kinderen, dan wel
      pleegkinderen, in de leeftijd van 0 tot met de leeftijd van het einde van de basisschool, of

      b. arbeidsgehandicapte is als bedoeld in de [Wet op de (re)integratie arbeidsgehandicapten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0009199/2003-01-01#Artikel10
    references:
