  - number: '17'
    text: |-
      1 Onze Minister stelt de subsidie aan de gemeente vast binnen een jaar na ontvangst van het verslag en de daarop
      betrekking hebbende verklaring, bedoeld in [artikel 20, vierde lid, van de wet](onbekend).

      2 Onze Minister hanteert bij de vaststelling van het vast budget de normbedragen, bedoeld in
      [artikel 12, eerste lid][ref1].

      3 Indien op grond van de wet of dit besluit een arbeidsduur van minder dan 32 uur gerechtvaardigd is, wordt het
      normbedrag verminderd naar rato van de overeengekomen arbeidsduur.

      4 Indien op grond van de wet of dit besluit een arbeidsduur van meer dan 32 uur gerechtvaardigd is, stelt
      Onze Minister de subsidie vast op basis van het normbedrag dat geldt voor 32 uur en het verschil tussen het
      normbedrag dat geldt voor 32 uur en het normbedrag dat geldt voor 36 uur, voor iedere door de gemeente aangegane
      dienstbetrekking naar rato van het aantal uren dat meer dan 32 uur per week wordt gewerkt.

      5 De vaststelling van de basisbedragen vindt plaats overeenkomstig [de artikelen 9][ref2] en [10][ref3]. Op de
      basisbedragen worden in mindering gebracht gelden die door of vanwege de werknemer worden ontvangen op grond
      van de [Ziektewet][ref4], [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg](onbekend), de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5], de [Wet arbeidsongeschiktheidsvoorziening zelfstandigen][ref6],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7] of op grond van een regeling die met deze wetten
      naar aard en strekking overeenstemt.

      6 Burgemeester en wethouders dragen er zorg voor dat Onze Minister het verslag en de verklaring, bedoeld in
      het eerste lid, uiterlijk op 20 september van het jaar volgend op het jaar waarop zij betrekking hebben, heeft
      ontvangen.

      7 Indien het verslag niet is ontvangen binnen 18 maanden na het kalenderjaar waarop het betrekking heeft of niet is
      voorzien van een daarop betrekking hebbende verklaring, wordt de subsidie ambtshalve vastgesteld.


