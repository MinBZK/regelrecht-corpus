  - number: '2'
    text: |-
      1 Het aantal werknemers, dat aan een onderneming ter beschikking kan worden gesteld voor het verrichten van
      werkzaamheden in die onderneming, bedraagt maximaal 10% van het aantal in die onderneming werkzame personen, met
      dien verstande dat aan die onderneming in ieder geval één werknemer ter beschikking kan worden gesteld.

      2 In afwijking van het percentage, bedoeld in het eerste lid, bedraagt het aantal werknemers, dat ter beschikking
      kan worden gesteld aan een onderneming in een sector, waarin de behartiging van een algemeen maatschappelijk
      belang op de voorgrond staat en het streven naar winst, hetzij geheel ontbreekt, hetzij van bijkomende betekenis
      is, dan wel de arbeidskosten nagenoeg geheel bekostigd worden met overheidsbijdragen, maximaal 20% van het aantal
      in die onderneming werkzame personen, met dien verstande dat dit percentage kan worden overschreden, indien de
      terbeschikkingstelling aan die onderneming in het belang van vermindering van de afstand tot de arbeidsmarkt van de
      werknemer naar het oordeel van de Centrale organisatie werk en inkomen aangewezen is.

      3 In een collectieve arbeidsovereenkomst, geldend voor andere sectoren dan bedoeld in het tweede lid, kan worden
      bepaald dat het percentage, bedoeld in het eerste lid, hoger is dan 10%.

      4 In afwijking van het eerste en tweede lid kan het aantal werknemers, dat ter beschikking is gesteld om arbeid te
      verrichten, die bijdraagt aan bestrijding van de achterstand op de arbeidsmarkt, de bevordering van de kwaliteit
      van de woon- en leefomgeving en aan opvang, hulpverlening en onderwijs en met gemeentelijke middelen wordt
      gefinancierd uit de bijdrage uit ’s Rijks kas op grond van de Tijdelijke wet stimulering sociale vernieuwing, zoals
      die wet luidde tot de datum van inwerkingtreding van de wet, maximaal het aantal werknemers bedragen, dat op de
      datum van inwerkingtreding van de wet als zodanig werkzaam was.
    url: https://wetten.overheid.nl/BWBR0009199/2003-01-01#Artikel2
  - number: '6'
    text: |-
      1 Het loon, dat op grond van [artikel 15, derde lid][ref1], van de wet aan de werknemer wordt betaald
      om de dienstbetrekking voor subsidie in aanmerking te laten komen, is het loon in de zin van de
      [Wet op de loonbelasting 1964][ref2].

      2 Het loon, bedoeld in het eerste lid, bedraagt niet meer dan 120% van het
      minimumloon en van de minimumvakantiebijslag, bedoeld in [artikel 8][ref3] en
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref4].

      3 Het bedrag, bedoeld in het tweede lid, wordt naar evenredigheid verminderd, indien
      de overeengekomen arbeidsduur korter is dan de normale arbeidsduur, bedoeld in
      [artikel 12 van de Wet minimumloon en minimumvakantiebijslag][ref5], die voor de toepassing van dit artikel 36 uur
      per week bedraagt.


