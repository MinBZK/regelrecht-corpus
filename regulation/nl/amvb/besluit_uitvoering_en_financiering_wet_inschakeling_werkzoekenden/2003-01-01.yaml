  - number: 14a
    text: |-
      1 Bij ministeriële regeling kunnen tot het tijdstip van inwerkingtreding van
      [artikel 81, onderdeel Bb, van de Invoeringswet wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      gemeenten worden aangewezen die uit het scholings- en activeringsbudget, bedoeld in [artikel 14][ref2], in
      plaats van de voorzieningen, bedoeld in [artikel 3 van de wet][ref3], een subsidie kunnen verstrekken aan een
      arbeidsgehandicapte als bedoeld in [artikel 12 van de Wet op de (re)integratie arbeidsgehandicapten][ref4] in
      de vorm van een op de arbeidsinschakeling gericht persoonsgebonden reïntegratiebudget. In deze regeling kunnen
      regels worden gesteld omtrent de aard en omvang van de activiteiten, het maximale bedrag dat uit het scholings- en
      activeringsbudget voor dit doel kan worden besteed en de aan het persoonsgebonden reïntegratiebudget te verbinden
      verplichtingen.

      2 Het zesde lid van [artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten][ref5] is op deze ministeriële
      regeling van toepassing.


