  - number: '15'
    text: |-
      1 Het basisbedrag voor de dienstbetrekkingen en de werkervaringsplaatsen wordt aan de hand van een opgave van het
      gemeentebestuur op of omstreeks de 15e dag van de eerste maand van het daaropvolgende kwartaal betaalbaar gesteld.

      2 Het gemeentebestuur draagt er zorg voor dat de opgave, bedoeld in het eerste lid, door Onze Minister is ontvangen
      telkens uiterlijk op de 20e dag van de tweede maand volgend op het kwartaal waarop die opgave betrekking heeft.

      3 Voor het in het eerste lid bedoelde basisbedrag wordt op of omstreeks de 15e dag van iedere maand van dat
      kwartaal een voorschot betaalbaar gesteld.

      4 Het vast budget en het scholings- en activeringsbudget worden per maand bij wijze van voorschot op of omstreeks
      de 15e dag van iedere maand betaalbaar gesteld.

      5 Bij ministeriële regeling wordt het model van de opgave, bedoeld in het eerste lid, vastgesteld en worden nadere
      regels gesteld met betrekking tot de verlening, de berekening, de betaling en de verrekening van de in het derde en
      vierde lid bedoelde voorschotten.
    url: https://wetten.overheid.nl/BWBR0009199/2003-01-01#Artikel15
  - number: '16'
    text: |-
      1 Indien de opgave, bedoeld in [artikel 15, eerste lid][ref1], [artikel 17, eerste lid][ref2], dan wel andere bij
      ministeriële regeling vastgestelde bescheiden, niet of niet volledig binnen de daarvoor gestelde termijnen zijn
      ontvangen, kan de betaling van de subsidie door Onze Minister worden opgeschort.

      2 Hervatting van de betaling vindt zo spoedig mogelijk plaats na ontvangst van de in het eerste lid bedoelde opgave
      of andere bescheiden, doch uiterlijk op of omstreeks de vijftiende dag van de maand volgend op de maand waarin die
      opgave of die andere bescheiden zijn ontvangen.

      3 Indien op de twintigste dag van de zesde maand volgende op een kwartaal geen opgave als bedoeld in
      [artikel 15, eerste lid][ref3], over een kwartaal is ontvangen, dan worden omstreeks de vijftiende van
      de daaropvolgende maand de nog niet verrekende maandvoorschotten met betrekking tot het desbetreffende
      kalenderkwartaal teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009199#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009199#Artikel17
