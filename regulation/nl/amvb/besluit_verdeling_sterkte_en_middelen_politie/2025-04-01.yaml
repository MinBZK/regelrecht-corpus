---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_verdeling_sterkte_en_middelen_politie
regulatory_layer: AMVB
publication_date: '2024-11-07'
valid_from: '2025-04-01'
bwb_id: BWBR0032333
url: https://wetten.overheid.nl/BWBR0032333/2025-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Veiligheid en Justitie van 18 oktober 2012, nummer 312645;

    Gelet op artikel 36 van de Politiewet 2012;

    De Raad van State gehoord (advies van 2 november 2012, nr. W03.12.0431/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 22 november 2012, nummer 324461;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel1
  - number: 1.a
    text: |-
      *de wet:* de [Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
  - number: 1.b
    text: |-
      *operationele sterkte:* het aantal fulltime-equivalent werkzaam in een operationele
      functie bij de politie en de bij de politie aangestelde aspiranten, bedoeld in
      [artikel 1, onder b, van het Besluit algemene rechtspositie politie][ref1], en de bij de politie aangestelde
      ambtenaren in opleiding, bedoeld in artikel 1, eerste lid, onder c, van het Besluit algemene rechtspositie politie;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 1.c
    text: |-
      *begroting:* de begroting, bedoeld in [artikel 34 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel34
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '34'
  - number: 1.d
    text: '*begrotingsjaar:* het kalenderjaar waarvoor de begroting dient.'
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel1
  - number: '2'
    text: |-
      Bij ministeriële regeling worden de krachtens [artikel 6, tweede lid, van het Besluit bezoldiging politie][ref1]
      vastgestelde functies bij de politie aangewezen die onderdeel uitmaken van de operationele sterkte.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
  - number: '3.1'
    text: |-
      Onze Minister bepaalt jaarlijks de door de korpschef in het begrotingsjaar te realiseren operationele sterkte van
      de politie.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister bepaalt op basis van de in het eerste lid bedoelde operationele sterkte van de politie
      de omvang van de in het betreffende begrotingsjaar te realiseren operationele sterkte voor de
      landelijke eenheden, bedoeld in [artikel 3, eerste lid, van het Besluit beheer politie][ref1], en de
      ondersteunende diensten, bedoeld in de [artikelen 28, eerste lid][ref2], [36, eerste lid][ref3], en
      [artikel 43a, eerste lid, van het Besluit beheer politie][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0036705#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036705#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0036705#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0036705#Artikel43a
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036705
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0036705
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0036705
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0036705
        artikel: 43a
  - number: '3.3'
    text: |-
      De omvang van de te realiseren operationele sterkte van de regionale eenheden is zo groot als de omvang van de te
      realiseren operationele sterkte, bedoeld in het eerste lid, verminderd met de operationele sterkte, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel3
  - number: '3.4'
    text: |-
      Het aandeel van een regionale eenheid in de in het derde lid bedoelde operationele sterkte bedraagt het in de bij
      dit besluit behorende bijlage bedoelde percentage.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister geeft jaarlijks een raming van de door de korpschef te realiseren operationele sterkte voor de
      vier op het begrotingsjaar volgende jaren en, met inachtneming van het in [artikel 3, vierde lid][ref1], bedoelde
      aandeel, een raming van de verdeling van deze sterkte over de eenheden en ondersteunende diensten en een raming van
      het in artikel 3, vijfde lid, bedoelde percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel3
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '3'
  - number: 4a.1
    text: |-
      In afwijking van de [artikelen 3, tweede en vierde lid][ref1], en [4][ref2] kan de korpschef bepalen dat een
      percentage van de te realiseren operationele sterkte van een eenheid in een begrotingsjaar en maximaal twee
      daaropvolgende jaren niet wordt gerealiseerd. Ten aanzien van een regionale eenheid geschiedt deze beslissing in
      overeenstemming met de burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak
      uitvoert en de hoofdofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0032333#Artikel4
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0032333
        artikel: '4'
  - number: 4a.2
    text: |-
      Voor de toepassing van het eerste lid worden aspiranten als bedoeld in
      [artikel 1, onder b, van het Besluit algemene rechtspositie politie][ref1] niet meegerekend bij de operationele
      sterkte.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel1
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '1'
  - number: 4a.3
    text: Het percentage, bedoeld in het eerste lid, bedraagt maximaal twee procent per begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4a
  - number: 4a.4
    text: |-
      De uitkomst van de vermenigvuldiging van het met toepassing van het eerste lid niet te realiseren deel van de
      operationele sterkte van een eenheid per begrotingsjaar met de daarbij behorende loonsom wordt door de korpschef in
      hetzelfde begrotingsjaar uitsluitend binnen deze eenheid besteed aan andere uitgaven. Ten aanzien van een regionale
      eenheid geschiedt deze beslissing in overeenstemming met de burgemeesters van de gemeenten in het gebied waarin de
      regionale eenheid de politietaak uitvoert en de hoofdofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4a
  - number: 4a.5
    text: |-
      Onder de loonsom, bedoeld in het vierde lid, wordt verstaan de loonsom, vastgesteld in de begroting voor het
      begrotingsjaar waarin toepassing wordt gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel4a
  - number: '5.1'
    text: |-
      Indien de begroting tijdens het begrotingsjaar wordt gewijzigd, kan Onze Minister de door de korpschef te
      realiseren operationele sterkte, bedoeld in [artikel 3, eerste lid][ref1], wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel3
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '3'
  - number: '5.2'
    text: |-
      Indien de meerjarenraming, bedoeld in [artikel 34 van de wet][ref1], wordt gewijzigd, is het eerste lid van
      overeenkomstige toepassing op de raming van de operationele sterkte, bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0032333#Artikel4
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0032333
        artikel: '4'
  - number: '6.1'
    text: |-
      Indien werkzaamheden worden overgeheveld van een eenheid of ondersteunende dienst naar een andere eenheid of
      ondersteunende dienst, als bedoeld in [artikel 25, eerste lid, van de wet][ref1] wordt de op die werkzaamheden
      betrekking hebbende operationele sterkte eveneens overgeheveld.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: '6.2'
    text: |-
      In afwijking van [artikel 3, tweede of vierde lid][ref1], kan een eenheid of ondersteunende dienst over extra
      operationele sterkte beschikken indien deze voor een specifiek onderdeel van de politietaak aan de eenheid of
      ondersteunende dienst is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0032333#Artikel3
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0032333
        artikel: '3'
  - number: '7.1'
    text: |-
      In de begroting worden de middelen over de onderdelen van de politie verdeeld, waarbij wordt aangegeven welk deel
      daarvan ter beschikking wordt gesteld aan de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel7
  - number: '7.2'
    text: |-
      In het beheersplan, bedoeld in [artikel 37, eerste lid van de wet][ref1], wordt een verdeling gemaakt van de niet-
      operationele sterkte over de onderdelen van de politie, waarbij wordt aangegeven welk deel daarvan ter beschikking
      wordt gesteld aan de Politieacademie en aan de Politieonderwijsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel37
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '37'
  - number: '8'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit verdeling sterkte en middelen politie.'
    url: https://wetten.overheid.nl/BWBR0032333/2025-04-01#Artikel9
