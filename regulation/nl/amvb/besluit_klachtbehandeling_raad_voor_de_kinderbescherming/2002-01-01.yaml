preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Justitie van 7 februari 1996, nr. 538873/96/6;


    Gelet op artikel 239, vijfde lid, van Boek l van het Burgerlijk Wetboek;


    De Raad van State gehoord (advies van 20 maart 1996, nr. W03.96.0058);


    Gezien het nader rapport van de Staatssecretaris van Justitie van 14 juni 1996, nr. 551665/96/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit Besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Justitie;

      directeur: ressortsdirecteur of namens deze de door hem tot de klachtbehandeling aangewezen persoon;

      algemeen directeur: de algemeen directeur, bedoeld in
      [artikel 1, tweede lid, van het Organisatiebesluit raad voor de kinderbescherming][ref1];

      gedraging: enig handelen of nalaten alsmede het nemen van een beslissing die gevolgen heeft voor de belanghebbende
      of informant.


      [ref1]: https://wetten.overheid.nl/BWBR0008125#Artikel1
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008125
        artikel: '1'
  - number: '2'
    text: >-
      1 Een ieder, die als belanghebbende of als informant betrokken is bij een bij de raad voor de kinderbescherming
      in behandeling zijnde of geweest zijnde aangelegenheid kan zich bij de directeur beklagen over gedragingen jegens
      hem in die aangelegenheid van een medewerker in het desbetreffende ressort. Over een gedraging van een medewerker
      van het landelijk bureau van de raad kan beklag worden gedaan bij de algemeen directeur van de raad. De bepalingen
      omtrent de behandeling van de klacht door de directeur zijn alsdan van toepassing op de algemeen directeur.


      2 De klacht wordt mondeling of schriftelijk ingediend uiterlijk binnen twee maanden na de dag waarop de klager
      kennis heeft gekregen van de gedraging. Een na afloop van deze termijn ingediende klacht is niettemin ontvankelijk,
      indien blijkt dat de klacht is ingediend zo spoedig als redelijkerwijs van de klager kon worden verlangd.


      3 De ontvangst van de klacht wordt onverwijld schriftelijk door de directeur bevestigd. Bij deze bevestiging
      wordt tevens medegedeeld dat de klager zich bij de behandeling van de klacht kan doen bijstaan door een raadsman
      of vertrouwenspersoon.


      4 Indien de klacht verband houdt met een aangelegenheid waarover de raad een verzoek of een advies tot de rechter
      heeft gericht en de rechter over die aangelegenheid nog geen beslissing heeft genomen, stelt de directeur de
      rechter onverwijld in kennis van het indienen van de klacht.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel2
  - number: '3'
    text: |-
      1 De directeur onderzoekt de klacht en tracht tot een voor de klager aanvaardbare oplossing te komen.

      2 Indien de directeur er niet in slaagt een voor de klager aanvaardbare oplossing te bereiken, neemt de directeur
      schriftelijk een beslissing.

      3 De directeur neemt een dergelijke beslissing niet dan na klager en degene over wiens gedraging is geklaagd te
      hebben gehoord.

      4 De beslissing wordt binnen acht weken genomen na de bevestiging van de ontvangst van de klacht, bedoeld in
      [artikel 2, derde lid][ref1].

      Zij is met redenen omkleed en wordt in afschrift toegezonden aan de klager en degene over wiens gedraging is
      geklaagd. Indien de klacht geheel of gedeeltelijk gegrond is bevonden, wordt tevens medegedeeld of en zo ja, welke
      gevolgen binnen de organisatie daaraan worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008127#Artikel2
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008127
        artikel: '2'
  - number: '4'
    text: |-
      1 De klager kan binnen zes weken na ontvangst van de beslissing van de directeur dan wel binnen zes weken nadat de
      directeur de beslissing had behoren te nemen zijn klacht schriftelijk voorleggen aan de klachtencommissie, bedoeld
      in [artikel 7][ref1].

      2 Indien de klacht betrekking heeft op een gedraging van de directeur zelf dan wel op een gedraging van de algemeen
      directeur van de raad, kan de klager zich direct tot deze klachtencommissie wenden. [Artikel 2, tweede lid][ref2],
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008127#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008127#Artikel2
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008127
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008127
        artikel: '2'
  - number: '5'
    text: |-
      1 De klachtencommissie beoordeelt de klacht. Indien zij de klacht van eenvoudige aard, dan wel kennelijk niet-
      ontvankelijk acht, kan zij beslissen dat de klacht door de voorzitter zelfstandig wordt afgedaan.

      2 Indien de voorzitter van de klachtencommissie de zaak zelfstandig afdoet, is [artikel 6][ref1] van
      overeenkomstige toepassing.

      3 De voorzitter kan de zaak te allen tijde verwijzen naar de klachtencommissie. Van die verwijzing wordt
      schriftelijk mededeling gedaan aan de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0008127#Artikel6
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008127
        artikel: '6'
  - number: '6'
    text: |-
      1 Indien de klachtencommissie de klacht ontvankelijk acht, hoort zij de klager alsmede degene over wiens gedraging
      wordt geklaagd.

      De klachtencommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen.

      2 Aan de klachtencommissie worden op haar schriftelijk verzoek ten behoeve van de beoordeling van de klacht de
      bescheiden, gebezigd in de zaak waarop de klacht betrekking heeft, al dan niet in afschrift overgelegd. Inzage
      of afgifte van een stuk als bedoeld in de eerste volzin kan de klager door de voorzitter van de klachtencommissie
      worden geweigerd op een van de onder [artikel 10, tweede lid, onder ][ref1] genoemde gronden.

      3 De klachtencommissie beslist uiterlijk zes weken nadat de zaak bij haar aanhangig is gemaakt. De beslissing
      is met redenen omkleed en wordt schriftelijk ter kennis gebracht van de klager en degene over wiens gedraging
      werd geklaagd. De in de eerste volzin genoemde termijn kan met ten hoogste vier weken worden verlengd, indien de
      commissie het inwinnen van nadere informatie wenselijk acht.

      4 Een afschrift van de beslissing zendt de klachtencommissie aan Onze Minister en aan de directeur die de
      beslissing, bedoeld in [artikel 3][ref2], heeft genomen dan wel had behoren te nemen.

      5 Indien de klacht geheel of gedeeltelijk gegrond is bevonden, deelt de directeur binnen drie weken na ontvangst
      van de beslissing van de klachtencommissie aan de klager mee of en zo ja, welke gevolgen binnen de organisatie
      daaraan worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008127#Artikel3
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0008127
        artikel: '3'
  - number: '7'
    text: >-
      1 Er zijn vijf klachtencommissies. Elke commissie behandelt de klachten omtrent gedragingen van de algemeen
      directeur, directeur of de medewerker, werkzaam in het ressort waarvoor zij bevoegd is.


      Deze ressorten komen overeen met die van een hof.


      2 De leden van de klachtencommissies kunnen niet werkzaam zijn bij de raad voor de kinderbescherming.


      3 De klachtencommissie bestaat uit de volgende leden:


      a. Een voorzitter en een of meer plaatsvervangende voorzitters, bij voorkeur rechterlijke ambtenaren met
      rechtspraak belast, door Onze Minister benoemd op gemeenschappelijke voordracht van op voordracht van de Raad voor
      de rechtspraak daartoe geadviseerd door de besturen van de rechtbanken;


      b. een lid en een of meer plaatsvervangende leden, deskundig op het terrein van het jeugdwelzijn en betrokken
      bij de maatschappelijke ontwikkelingen binnen de jeugdbescherming, door Onze Minister benoemd op voordracht van
      het provinciaal bestuur of op gemeenschappelijke voordracht van de provinciale besturen van de provincie of de
      provincies waarin het desbetreffende ressort is gelegen;


      c. een lid en een of meer plaatsvervangende leden, deskundig op het terrein van het jeugdwelzijn en betrokken bij
      de maatschappelijke ontwikkelingen binnen de jeugdbescherming, benoemd door Onze Minister.


      4 De voorzitter en de leden van de klachtencommissie worden benoemd voor de tijd van zes jaren. Zij kunnen in
      aansluiting op die termijn één maal voor een gelijke termijn worden herbenoemd.


      5 Aan de voorzitter en aan een lid wordt op eigen verzoek tussentijds ontslag verleend.


      6 Een lid kan door Onze Minister worden ontslagen bij gebleken voortdurende achteloosheid in de uitoefening van
      het lidmaatschap.


      Omtrent het voornemen tot ontslag wordt de betrokkene door Onze Minister gehoord.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 De klachtencommissie houdt zitting en beslist met drie leden in een zodanige samenstelling dat uit elk der in
      [artikel 7, derde lid, onder ][ref1] omschreven groeperingen een persoon aan de zitting deelneemt. De voorzitter
      wijst de leden aan.

      2 Onze Minister voegt aan elke klachtencommissie een secretaris toe.


      [ref1]: https://wetten.overheid.nl/BWBR0008127#Artikel7
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008127
        artikel: '7'
  - number: '9'
    text: >-
      1 De voorzitter van de klachtencommissie bepaalt in overleg met de secretaris plaats, dag en uur van de zittingen.


      2 De voor de klachtencommissie bestemde stukken worden ingediend bij haar secretaris.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel9
  - number: '10'
    text: >-
      Bij de behandeling van de zaak door de klachtencommissie kan zowel de klager als degene over wiens gedraging wordt
      geklaagd zich door een raadsman of vertrouwenspersoon doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel10
  - number: '11'
    text: >-
      1 De leden van de klachtencommissie genieten een vergoeding voor reis- en verblijfkosten. Voor het deelnemen aan
      een zitting ter behandeling van klachten genieten zij een vacatiegeld overeenkomstig de door Onze Minister te
      stellen regelen.


      2 Aan de secretaris wordt voor zijn werkzaamheden een afzonderlijke vergoeding toegekend tot een nader door Onze
      Minister te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel11
  - number: '12'
    text: >-
      1 In klachtzaken, waarin tot het tijdstip van inwerkingtreding van dit besluit, de directeur van een raad voor de
      kinderbescherming optreedt, treedt de ressortsdirecteur of de door hem tot de klachtbehandeling aangewezen persoon,
      in zijn plaats.


      2 Klachtzaken, die op het tijdstip van inwerkingtreding van dit besluit in behandeling zijn bij één van de zes tot
      dit tijdstip bestaande klachtencommissies, worden door deze commissies afgehandeld met toepassing van het voor het
      tijdstip van de inwerkingtreding van dit besluit geldende recht.


      Deze klachtencommissies blijven in stand totdat alle zaken die vóór de inwerkingtreding van dit besluit aanhangig
      zijn gemaakt, zijn afgedaan.


      3 De op het moment van inwerkingtreding van dit besluit in de in het tweede lid bedoelde klachtencommissies zitting
      hebbende leden, blijven in afwijking van het vervallen artikel 39, vierde lid, van het Organisatiebesluit raden
      voor de kinderbescherming 1982 daarin zitting houden totdat deze klachtencommissies zijn ontbonden.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel12
  - number: '13'
    text: >-
      Dit besluit treedt in werking met ingang van de dag waarop de wet houdende wijziging van Boek 1 van het Burgerlijk
      Wetboek en van enige andere wetten in verband met reorganisatie van de raden voor de kinderbescherming in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit klachtbehandeling raad voor de kinderbescherming.'
    url: https://wetten.overheid.nl/BWBR0008127/2002-01-01#Artikel14
