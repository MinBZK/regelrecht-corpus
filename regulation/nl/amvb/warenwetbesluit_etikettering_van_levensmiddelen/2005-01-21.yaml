  - number: '8'
    text: |-
      1 In afwijking van [artikel 6, eerste lid][ref1], mogen voor waren die zijn geconcentreerd of gedroogd en waaraan
      water moet worden toegevoegd om deze voor gebruik gereed te maken, in plaats van het woord "ingrediënten" worden
      gebezigd de woorden "ingrediënten van de waar na toebereiding" of woorden van gelijke strekking, gevolgd door een
      lijst van de in de waar aanwezige ingrediënten met een opsomming in de volgorde van de hoeveelheden na de bedoelde
      toevoeging.

      2 In afwijking van [artikel 6, eerste lid][ref2], mag een mengsel van vruchten, groenten of paddestoelen:

      a. die waarschijnlijk in wisselende verhouding als ingrediënten in een eet- of drinkwaar worden gebruikt; en

      b. waarvan geen enkele aanmerkelijk in gewicht overheerst;

      in de lijst van ingrediënten worden opgenomen onder de benaming *vruchten*, *groenten* of *paddestoelen*, gevolgd
      door de woorden «in wisselende verhouding», onmiddellijk gevolgd door de opsomming van de aanwezige vruchten,
      groenten of paddestoelen. In dat geval geldt als gewicht, bedoeld in [artikel 6, eerste lid][ref3], het gewicht van
      het geheel van de in het mengsel aanwezige vruchten, groenten of paddestoelen.

      3 In afwijking van [artikel 6, eerste lid][ref4], mogen ingrediënten die minder dan 2% van het eindproduct
      uitmaken, in een andere volgorde worden opgesomd, na de andere ingrediënten.

      4 In afwijking van [artikel 6, eerste lid][ref5], mogen soortgelijke of onderling verwisselbare ingrediënten die:

      a. voor de bereiding van een eet- of drinkwaar kunnen worden gebruikt zonder de samenstelling of smaak van die waar
      te wijzigen;

      b. minder dan 2% van het eindproduct uitmaken;

      c. geen levensmiddelenadditief zijn; en

      d. niet worden genoemd in [bijlage III][ref6];

      in de lijst van ingrediënten worden opgenomen met de vermelding «bevat … en/of …» in het geval waarin ten minste
      één van ten hoogste twee ingrediënten in het eindproduct aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel6
