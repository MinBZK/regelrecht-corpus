  - number: '9'
    text: |-
      De in [artikel 5, eerste lid, onderdeel a][ref1], bedoelde lijst van ingrediënten behoeft niet te worden vermeld
      ten aanzien van

      a. verse groenten, vers fruit en aardappelen, tenzij deze produkten zijn geschild, gesneden of een andere
      soortgelijke behandeling hebben ondergaan;

      b. water met koolzuur indien het water met een benaming is aangeduid waaruit die hoedanigheid blijkt;

      c. gistingsazijn, uitsluitend indien deze afkomstig is van één basisprodukt en mits daaraan geen ander ingrediënt
      is toegevoegd;

      d. kaas, boter, gezuurde melk en gezuurde room, indien er geen andere ingrediënten zijn gebruikt dan
      melkbestanddelen, enzymen en culturen van micro-organismen, of andere ingrediënten dan keukenzout, die noodzakelijk
      zijn voor de bereiding van kaas, niet zijnde verse kaas of smeltkaas;

      e. dranken verkregen door alcoholische gisting - likeurwijn daaronder begrepen - met een gehalte van 1,2 of meer
      volumeprocenten alcohol bepaald bij 20° C, en gedistilleerde dranken;

      f. gerectificeerde alcohol waarvan het alcoholgehalte al dan niet zodanig is verlaagd dat deze geschikt wordt voor
      menselijke consumptie;

      g. een eet- of drinkwaar welke bestaat uit één ingrediënt, voor zover:

      1°. de aanduiding van de eet- of drinkwaar en de naam van het ingrediënt identiek zijn; of

      2° uit de aanduiding van de eet- of drinkwaar de aard van het ingrediënt duidelijk kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
