        paragraaf: '1'
  - number: '26'
    text: |-
      Voor wat betreft een verpakte eet- of drinkwaar moeten de aanduiding alsmede de vermelding van de produktiepartij
      zijn aangebracht op de verpakking of op de recipiënt, of, indien zulks niet mogelijk is, op het handelsdocument dat
      de betrokken waar vergezelt.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel26
  - number: '27'
    text: |-
      Voor wat betreft een onverpakte eet- of drinkwaar moet de aanduiding voor het publiek duidelijk zichtbaar zijn
      aangebracht op het voorwerp waarin of waarop de betrokken waar zich bevindt, of op een onmiddellijk boven bedoeld
      voorwerp geplaatst(e) bord of kaart.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel27
  - number: '28'
    text: |-
      1 Indien zich in een verpakking een in afzonderlijk verpakte eenheden verdeelde hoeveelheid van een
      zelfde eet- of drinkwaar bevindt, wordt eerstbedoelde verpakking aangemerkt als de verpakking, bedoeld in
      [artikel 24, eerste lid][ref1].

      2 Indien zich in een verpakking een voorverpakte eet- of drinkwaar, dan wel een in afzonderlijk verpakte of
      onverpakte eenheden verdeelde hoeveelheid van verschillende eet- of drinkwaren, al dan niet met andere waren
      bevindt, wordt eerstbedoelde verpakking aangemerkt als de verpakking, bedoeld in [artikel 24, eerste lid][ref2]. Op
      bedoelde verpakking behoeven slechts de aanduiding en de vermelding van de netto-hoeveelheid van elke afzonderlijke
      eet- of drinkwaar te worden vermeld, mits op de verpakking van de afzonderlijke eenheden de voor de betrokken eet-
      of drinkwaren voorgeschreven aanduiding en vermeldingen zijn aangebracht.

      3 In afwijking van het eerste en tweede lid behoeven de in die leden voorgeschreven aanduiding en vermeldingen niet
      op de buitenzijde van de volgens die leden aangemerkte verpakking of op een op die verpakking aangebracht etiket
      te zijn aangebracht, indien die verpakking helder doorzichtig is, en de zich in bedoelde verpakking bevindende
      eenheden de volgens dit besluit voorgeschreven aanduiding en vermeldingen dragen en deze voldoende zichtbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel24
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel28
    references:
