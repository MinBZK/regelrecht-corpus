  - number: '17'
    text: |-
      1 De uiterste consumptiedatum, bedoeld in [artikel 5, eerste lid, onderdeel d][ref1], moet worden gebezigd voor
      eet- of drinkwaren die uit microbiologisch oogpunt zeer bederfelijk zijn en derhalve na korte tijd een onmiddellijk
      gevaar voor de volksgezondheid kunnen opleveren.

      2 De in het eerste lid bedoelde vermelding moet bestaan uit de woorden "te gebruiken tot" gevolgd door de uiterste
      datum waarop de waar moet worden geconsumeerd teneinde bedoeld gevaar te voorkomen.

      3 Indien het eerste lid van toepassing is, moet tevens een aanwijzing omtrent de bewaring en het gebruik als
      bedoeld in [artikel 5, eerste lid, onderdeel e][ref2], worden gebezigd.

      4 [Artikel 16, vierde en zevende lid][ref3], is van overeenkomstige toepassing op de in dit artikel bedoelde
      vermelding.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005310#Artikel16
