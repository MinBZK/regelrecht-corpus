  - number: '25'
    text: |-
      1 Voor wat betreft een niet voorverpakte eet- of drinkwaar als bedoeld in
      [artikel 1, vierde lid, onderdelen b, c en e][ref1], moeten de aanduiding alsmede de vermelding van de netto-
      hoeveelheid voor het publiek in ieder geval duidelijk zichtbaar zijn aangebracht op het voorwerp waarin of waarop
      de betrokken waar zich bevindt, of op een onmiddellijk boven bedoeld voorwerp geplaatst(e) bord of kaart.

      2 Voor wat betreft een niet voorverpakte eet- of drinkwaar als bedoeld in
      [artikel 1, vierde lid, onderdeel e][ref2], moet bovendien de vermelding van de produktiepartij voorkomen op de
      verpakking of op een daaraan gehecht etiket, of, indien zulks niet mogelijk is, op het handelsdocument dat de
      betrokken waar vergezelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel1
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel25
    references:
