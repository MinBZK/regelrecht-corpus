  - number: '11'
    text: |-
      1 Onder netto-hoeveelheid, bedoeld in [artikel 5, eerste lid, onderdeel c][ref1], wordt verstaan de hoeveelheid van
      een eet- of drinkwaar die in elk geval in de verpakking aanwezig is. Zij moet worden uitgedrukt

        - in volume-eenheden bij drinkwaren en vloeibare eetwaren, en
        - in massa-eenheden bij andere eetwaren,

      waarbij gebruik wordt gemaakt van liters, centiliters of milliliters, respectievelijk kilogrammen of grammen.

      2 De netto-hoeveelheid uitgedrukt in volume-eenheden wordt bepaald

      a. bij de temperatuur waarbij de waar ten verkoop voorhanden pleegt te worden gehouden, in geval van diepgevroren
      of bevroren drinkwaren en vloeibare eetwaren;

      b. bij een temperatuur van 20° C, indien het betreft een in een andere toestand verkerende drinkwaar of vloeibare
      eetwaar dan in onderdeel *a* bedoeld.

      3 Indien op grond van wettelijke bepalingen een bepaalde soort hoeveelheid, zoals nominale hoeveelheid of
      gemiddelde hoeveelheid moet worden vermeld, is in afwijking van het bepaalde in het eerste lid, die hoeveelheid de
      netto-hoeveelheid in de zin van [artikel 5, eerste lid, onderdeel c][ref2].

      4 In afwijking van het bepaalde in het eerste lid mag de hoeveelheid van een voorverpakte eetwaar behorende tot een
      der hierna genoemde categorieën, zijn uitgedrukt in een aantal stuks:

      a. beschuit;

      b. bakkerswaren, die in de regel per stuk of aantal stuks worden verkocht, voor zover zij door Onze Minister zijn
      aangewezen;

      c. verse groenten of verse vruchten die ook onverpakt per stuk of aantal stuks plegen te worden verkocht;

      d. eende- of ganzeëieren;

      e. suikerwerk dat ook onverpakt per stuk of aantal stuks pleegt te worden verkocht;

      f. maatjesharing.

      5 In afwijking van het eerste lid mag voor een voorverpakte eet- of drinkwaar waarvan de hoeveelheid ingevolge het
      vierde lid in een aantal stuks mag zijn uitgedrukt, een zodanige hoeveelheidsvermelding achterwege worden gelaten,
      indien het aantal stuks van die eet- of drinkwaar zonder opening van de verpakking van buitenaf duidelijk kan
      worden gezien en gemakkelijk kan worden geteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel5
