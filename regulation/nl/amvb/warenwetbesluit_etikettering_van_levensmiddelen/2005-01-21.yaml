  - number: '16'
    text: |-
      1 De datum van minimale houdbaarheid, bedoeld in [artikel 5, eerste lid, onderdeel d][ref1], moet worden gebezigd
      voor andere eet- of drinkwaren dan die bedoeld in [artikel 17][ref2].

      2 De in het eerste lid bedoelde vermelding moet bestaan uit de de woorden "ten minste houdbaar tot" gevolgd door
      de datum waarop de waar bij een passende wijze van bewaren nog in het bezit is van de voor die waar kenmerkende
      eigenschappen.

      3 Indien het tijdstip van minimale houdbaarheid afhankelijk is van een bijzondere wijze van bewaren, moet behalve
      de in het tweede lid bedoelde vermelding tevens een vermelding houdende aanwijzingen omtrent het bewaren worden
      gebezigd.

      4 De datum bedoeld in het tweede lid moet worden aangegeven in de volgorde dag, maand en jaar, met dien verstande
      dat

      a. de dag moet worden aangegeven met een getal bestaande uit twee cijfers;

      b. de maand moet worden aangegeven hetzij met de naam, hetzij met de gebruikelijke afkorting, hetzij met een getal
      bestaande uit twee cijfers; en

      c. het jaar moet worden aangegeven hetzij met een jaartal, hetzij met een getal bestaande uit de laatste twee
      cijfers ervan.

      5 Indien de in het tweede lid bedoelde datum ligt binnen drie maanden na de datum van het verpakken, mag worden
      volstaan met de vermelding van de dag en de maand.

      6 Indien de in het tweede lid bedoelde datum ligt

      a. tussen drie en achttien maanden na de datum van het verpakken, mag worden volstaan met de vermelding van de
      maand en het jaar;

      b. na achttien maanden na de datum van het verpakken, mag worden volstaan met de vermelding van het jaar;

      een en ander met dien verstande dat in afwijking van het in het tweede lid bepaalde, de datum moet worden
      voorafgegaan door de woorden "ten minste houdbaar tot einde".

      7 Het vierde lid, onderdeel *b*, is niet van toepassing voor zover de vermelding van de desbetreffende maand wordt
      bereikt door middel van inkerving van de rand van het etiket, onder de volgende voorwaarden:

      a. aan de rand van het etiket moet ten minste de beginletter van de naam van iedere maand worden vermeld; en

      b. de vermelding van de maanden moet geschieden in de gebruikelijke volgorde.

      8 De in het eerste lid bedoelde vermelding behoeft niet te worden gebezigd ten aanzien van:

      a. verse groenten - andere dan gekiemde zaden en soortgelijke produkten zoals scheuten van peulvruchten -, vers
      fruit en aardappelen, tenzij deze produkten zijn geschild, gesneden of een andere soortgelijke behandeling hebben
      ondergaan;

      b. wijn, likeurwijn, mousserende wijn, gearomatiseerde wijn en soortgelijke uit andere vruchten dan druiven
      verkregen produkten;

      c. andere alcoholhoudende dranken dan onder *b* bedoeld, met een gehalte van 10 of meer volumeprocenten alcohol,
      bepaald bij 20° C;

      d. alcoholvrije dranken, vruchtesappen, vruchtennectars en alcoholhoudende dranken in afzonderlijke recipiënten van
      meer dan 5 liter, bestemd voor levering aan instellingen;

      e. brood- of banketbakkerijprodukten welke naar hun aard bestemd zijn om binnen vierentwintig uur na de bereiding
      te worden geconsumeerd;

      f. azijn;

      g. keukenzout;

      h. suikers in vaste vorm;

      i. suikerwerk, bijna uitsluitend bestaande uit gearomatiseerde of gekleurde suiker(s);

      j. kauwpreparaten andere dan van tabak;

      k. afzonderlijke porties consumptie-ijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel17
