    text: |-
      De vermelding betreffende een verpakkingsgas, bedoeld in [artikel 5, eerste lid, onder j][ref1], bestaat uit de
      woorden «verpakt onder beschermende atmosfeer» en wordt gebezigd voor eet- of drinkwaren waarvan de houdbaarheid
      is verlengd met behulp van de bij of krachtens het [Warenwetbesluit Levensmiddelenadditieven][ref2] toegelaten
      verpakkingsgassen.


