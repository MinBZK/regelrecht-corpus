        artikel: '24'
        paragraaf: '4'
  - number: '29'
    text: |-
      1 Aanduidingen, vermeldingen of voorstellingen die doordat zij onjuist of onvolledig zijn of een onjuiste indruk
      wekken, misleidend zijn met betrekking tot de kenmerken van de betrokken eet- of drinkwaar, en met name tot
      de aard, identiteit, hoedanigheden samenstelling, hoeveelheid, houdbaarheid, oorsprong of herkomst, wijze van
      vervaardiging of verkrijging, mogen bij het verhandelen van eet- en drinkwaren, en bij de aanprijzing ervan, niet
      worden gebezigd.

      2 In de zin van het eerste lid worden in elk geval als misleidend beschouwd aanduidingen, vermeldingen of
      voorstellingen

      a. die aan de betrokken eet- of drinkwaar effecten of eigenschappen toeschrijven die deze niet bezit; of

      b. die suggereren dat de betrokken eet- of drinkwaar bijzondere kenmerken vertoont, hoewel alle soortgelijke eet-
      of drinkwaren dezelfde kenmerken bezitten.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel29
  - number: '30'
    text: |-
      1 Indien in enig wettelijk voorschrift is bepaald dat ten aanzien van een bepaalde eet- of drinkwaar of een
      bepaalde categorie van eet- of drinkwaren, de aanduiding, bedoeld in [artikel 3][ref1], of één of meer der
      vermeldingen, bedoeld in [artikel 5, eerste, onderscheidenlijk tweede lid][ref2], niet mogen, dan wel niet
      behoeven te worden gebezigd, is met betrekking tot die eet- of drinkwaar of die categorie van eet- of drinkwaren
      het in genoemde artikelen bepaalde, voor zover die aanduiding of de betrokken vermelding betreffende, niet van
      toepassing, behoudens indien dat wettelijk voorschrift in strijd is met de Richtlijn van de Raad van 18 december
      1978 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake etikettering en presentatie van
      levensmiddelen alsmede de daarvoor gemaakte reclame (79/112/EEG) (*PbEG* L 33).

      2 Indien ten aanzien van een bepaalde eet- of drinkwaar of een bepaalde categorie van eet- of drinkwaren, met
      betrekking tot een aanduiding, bedoeld in [artikel 3][ref3], of één of meer der vermeldingen als bedoeld in
      [artikel 5, eerste, onderscheidenlijk tweede lid][ref4], een vrijstelling of ontheffing is verleend van een ander
      wettelijk voorschrift dan het onderhavige besluit, is het in genoemde artikelen bepaalde, voor zover die aanduiding
      of betrokken vermeldingen betreffende, niet van toepassing, behoudens indien die vrijstelling, onderscheidenlijk
      ontheffing, in strijd is met de Richtlijn van de Raad van 18 december 1978 betreffende de onderlinge aanpassing van
      de wetgevingen der Lid-Staten inzake etikettering en presentatie van levensmiddelen alsmede de daarvoor gemaakte
      reclame (79/112/EEG) (*PbEG* L 33).


