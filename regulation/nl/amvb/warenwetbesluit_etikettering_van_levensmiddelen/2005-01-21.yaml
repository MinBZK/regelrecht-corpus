        bwb_id: BWBR0005310
        artikel: '5'
        paragraaf: '3'
  - number: '21'
    text: |-
      1 Het alcoholgehalte, bedoeld in [artikel 5, eerste lid, onderdeel h][ref1], moet worden gebezigd voor dranken
      met een effectief alcoholgehalte van meer dan 1,2 volumeprocenten, en moet bestaan uit het symbool "% vol",
      voorafgegaan door het werkelijke gehalte, bepaald bij 20 °C, en weergegeven met ten hoogste een decimaal. Deze
      vermelding wordt al dan niet voorafgegaan door "alcohol" of "alc.".

      2 Indien het absolute verschil tussen het vermelde alcoholgehalte en het werkelijke gehalte van de hieronder
      genoemde dranken minder bedraagt dan het achter de betrokken drank aangegeven percentage, voldoet een zodanige
      vermelding aan het in het eerste lid bepaalde:

      a. voor bier met een alcoholgehalte van ten hoogste 5,5% vol: 0,5% vol;

      b. voor bier met een alcoholgehalte van meer dan 5,5% vol: 1% vol;

      c. voor niet-mousserende gegiste dranken op basis van druiven, andere dan die bedoeld in de Verordening Akk
      Etikettering wijn 1986: 0,5% vol;

      d. voor mousserende gegiste dranken op basis van druiven, andere dan die bedoeld in de Verordening Akk Etikettering
      wijn 1986, alsmede voor gegiste dranken op basis van

      andere vruchten dan druiven, eventueel parelend of mousserend: 1% vol;

      e. voor dranken op basis van gegiste honing: 1% vol;

      f. voor dranken met gemacereerde vruchten of plantedelen: 1,5% vol;

      g. voor overige dranken, andere dan die bedoeld in de Verordening Akk. Etikettering wijn 1986: 0,3% vol..


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '5'
        paragraaf: '3'
  - number: 21a
    text: |-
      1 Het cafeïnegehalte, bedoeld in artikel 5, eerste lid, onderdeel k, wordt gebezigd bij een drinkwaar die in
      ongewijzigde staat, of na herstel van de geconcentreerde of gedehydrateerde waar in oude staat, meer dan 150 mg/l
      cafeïne bevat, ongeacht de herkomst ervan.

      2 Het gebezigde cafeïnegehalte wordt tussen haakjes geplaatst en weergegeven in mg/100ml. Het wordt voorafgegaan
      door de term «hoog cafeïnegehalte».

      3 Het eerste en tweede lid zijn niet van toepassing op:

      a. drinkwaren op basis van koffie of thee; en

      b. drinkwaren met koffie- of thee-extract; waarvan de aanduiding de term «koffie» of «thee» bevat.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel21a
  - number: '22'
    text: |-
      1 De vermelding betreffende de produktiepartij, bedoeld in
      [artikel 5, eerste lid, onderdeel i, en tweede lid][ref1], mag in een herleidbare code worden aangebracht.

      2 In afwijking van [artikel 5, eerste lid, onder h][ref2], mag de vermelding betreffende de produktiepartij van
      voorverpakt consumptie-ijs worden gebezigd op de verzamelverpakking van individuele porties van die waar.

      3 De in [artikel 5, tweede lid][ref3], bedoelde vermelding behoeft niet te worden gebezigd voor eet- of drinkwaren,
      zijnde landbouwgrondstoffen, welke van de producent

      a. aan opslag-, behandelings- of verpakkingsbedrijven worden verkocht of afgeleverd,

      b. naar producentenorganisaties zoals veilingen worden overgebracht, of

      c. voor onmiddellijke opneming in een operationeel bereidings- of verwerkingssysteem worden opgehaald.

      4 De datum van minimale houdbaarheid onderscheidenlijk de uiterste consumptiedatum, voor zover deze een
      dagaanduiding inhoudt, geldt als een vermelding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
