    text: |-
      De vermelding inzake in de waar aanwezig zoethout, bedoeld in [artikel 5, eerste lid, onder m][ref1], wordt
      gebezigd met inachtneming van het volgende:








                  type of categorie eet- of drinkwaar


                  vermelding






                  zoetwaren en drinkwaren die glycyrrizinezuur of het ammoniumzout daarvan bevatten als gevolg van de
      toevoeging van die stof(fen) als zodanig of van de zoethoutplant Glycyrrhiza glabra, in een concentratie van 100
      mg/kg of 10 mg/l of meer


                  onmiddellijk na de lijst van ingrediënten, bedoeld in [artikel 5, eerste lid, onder a][ref2], worden
      de woorden «bevat zoethout» toegevoegd, tenzij het woord zoethout al voorkomt in de lijst van ingrediënten of in
      aanduiding van de waar.




                  zoetwaren die glycyrrizinezuur of het ammoniumzout daarvan bevatten als gevolg van de toevoeging van
      die stof(fen) als zodanig of van de zoethoutplant Glycyrrhiza glabra, in een concentratie van 4 g/kg of meer


                  onmiddellijk na de lijst van ingrediënten, bedoeld in [artikel 5, eerste lid, onder a][ref3], wordt
      de volgende vermelding aangebracht: «bevat zoethout - mensen met hoge bloeddruk dienen overmatig gebruik te
      vermijden».




                  drinkwaren die glycyrrizinezuur of het ammoniumzout daarvan bevatten als gevolg van de toevoeging van
      die stof(fen) als zodanig of van de zoethoutplant Glycyrrhiza glabra, in een concentratie van 50 mg/l of meer, dan
      wel 300 mg/l of meer in geval van dranken met een alcoholgehalte van meer dan 1,2 volumeprocent


                  onmiddellijk na de lijst van ingrediënten, bedoeld in [artikel 5, eerste lid, onder a][ref4], wordt
      de volgende vermelding aangebracht: «bevat zoethout - mensen met hoge bloeddruk dienen overmatig gebruik te
      vermijden».






      Indien er geen lijst van ingrediënten is, wordt de desbetreffende vermelding aangebracht in de nabijheid van de
      aanduiding van de waar.


