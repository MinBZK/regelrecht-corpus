  - number: '6'
    text: |-
      1 De vermelding van de lijst van ingrediënten, bedoeld in [artikel 5, eerste lid, onderdeel a][ref1], moet zonder
      onderbreking geschieden in de volgorde van afnemend gewicht waarin de ingrediënten bij de bereiding zijn gebruikt,
      voorafgegaan door het woord "ingrediënten". Een gewichtstolerantie van 10% relatief is daarbij toegestaan.

      2 Als gewicht in de zin van het eerste lid mag worden aangemerkt bij geconcentreerde of gedroogde ingrediënten
      die in gedehydrateerde toestand in de waar aanwezig zijn: het gewicht vóór het concentreren of drogen, indien deze
      ingrediënten worden aangeduid met de naam van het ingrediënt vóór het concentreren of drogen.

      3 Als gewicht in de zin van het eerste lid moet worden aangemerkt bij het ingrediënt water en bij vluchtige
      ingrediënten: het gewicht van de hoeveelheid waarin zij in de waar aanwezig zijn, met dien verstande dat de
      hoeveelheid water wordt bepaald door de hoeveelheid van de waar te verminderen met de som van de hoeveelheden van
      andere ingrediënten dan water.

      4 Het ingrediënt water mag worden aangemerkt als niet in de waar aanwezig, indien de uitkomst, bedoeld in het derde
      lid, 5% of minder van de totale hoeveelheid van de waar bedraagt.

      5 Het ingrediënt water mag tevens worden aangemerkt als niet in de waar aanwezig,

      a. indien dit tijdens de bereiding alleen is gebruikt om een geconcentreerd of gedehydrateerd ingrediënt in zijn
      oorspronkelijke toestand terug te brengen;

      b. indien dit water deel uitmaakt van een opgietvloeistof, zoals nader omschreven in
      [artikel 14, tweede lid][ref2], welke gewoonlijk niet wordt geconsumeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel14
