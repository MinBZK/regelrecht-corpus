preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 4 juni 1991, nr. DGVgz/VVP/
    L/U-690751, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;

    Overwegende, dat uitvoering moet worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen van
    14 juni 1989 (89/395/EEG) (PbEG L 186) tot wijziging van de Richtlijn van de Raad van de Europese Gemeenschappen
    van 18 december 1987 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake etikettering en
    presentatie van levensmiddelen bestemd voor de eindverbruiker alsmede inzake de daarvoor gemaakte reclame (79/112/
    EEG) (PbEG L 33)

    Overwegende, dat door de wijziging van laatstgenoemde richtlijn, de algemene etiketteringsvoorschriften voor
    levensmiddelen, zoals die reeds golden voor voorverpakte, voor de eindverbruiker bestemde eet- en drinkwaren, met
    ingang van 20 juni 1992 ook van toepassing zijn op voor instellingen bestemde eet- en drinkwaren;

    Overwegende, dat tevens uitvoering moet worden gegeven aan de Richtlijn van de Commissie van 16 januari 1991 tot
    wijziging van Richtlijn 79/112/EEG van de Raad met betrekking tot de vermelding van de aroma’s in de lijst van
    ingrediënten die op het etiket van levensmiddelen wordt vermeld (91/72/EEG) (PbEG L 42);

    Overwegende, dat voorts uitvoering moet worden gegeven aan de Richtlijn van de Raad van de Europese Gemeenschappen
    van 14 juni 1989 betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake vermeldingen of
    merktekens die het mogelijk maken de partij waartoe een levensmiddel behoort te identificeren (89/396/EEG) (PbEG
    L 186);

    Overwegende, dat de ter uitvoering van die richtlijnen gestelde regels, neergelegd in het Algemeen
    Aanduidingenbesluit (Warenwet) (Stb. 1981, 621) en paragraaf 3 van het Hoeveelheidsaanduidingenbesluit (Warenwet)
    ( Stb. 1980, 223) voor zover betrekking hebbend op eet- en drinkwaren, derhalve moeten worden herzien.

    Overwegende, dat het uit oogpunt van goede voorlichting omtrent waren gewenst is dat de algemene regels met
    betrekking tot aanduidingen en vermeldingen, zoveel mogelijk ook van toepassing zijn op alle niet-voorverpakte eet-
    en drinkwaren;

    Gelet op de artikelen 1, vierde en vijfde lid, 8, onderdelen a en c, 14 en 22 van de Warenwet (Stb. 1988, 360),
    en op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet ( Stb. 358), jo artikel 14 van de Warenwet (Stb.
    1935, 973);

    Gehoord de Adviescommissie Warenwet (advies van 22 augustus 1990, nr. 14 179/(2)5);

    De Raad van State gehoord (advies van 11 september 1991, nr. W13.91 0297);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 26 november 1991,
    VVP/L-692378, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van
    Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en in de daarop berustende bepalingen wordt verstaan onder:

      a. *instellingen:* restaurants, ziekenhuizen, kantines en andere soortgelijke instellingen;

      b. *verpakking:* het verpakkingsmateriaal waarin een waar wordt verpakt alvorens die waar ten verkoop wordt
      aangeboden, waarbij dat verpakkingsmateriaal de waar geheel of ten dele bedekt of kan bedekken, maar zodanig dat de
      inhoud niet kan worden veranderd zonder dat het verpakkingsmateriaal wordt geopend of aangetast;

      c. *voorverpakte eet- of drinkwaar:* de verkoopeenheid die bestemd is als zodanig aan de eindverbruiker of aan een
      instelling te worden afgeleverd en bestaat uit een eet- of drinkwaar en haar verpakking;

      d. *verpakte eet- of drinkwaar:* de verkoopeenheid die niet bestemd is als zodanig aan de eindverbruiker of aan
      instellingen te worden afgeleverd en bestaat uit een eet- of drinkwaar en haar verpakking of haar recipiënt;

      e. *ingrediënt:* iedere grondstof die bij de bereiding van een eet- of drinkwaar is gebruikt en die als zodanig of
      als omzettingsprodukt in de waar aanwezig is;

      f. *technologische hulpmiddelen:* stoffen die op zichzelf niet als voedsel-ingrediënt worden geconsumeerd, die bij
      de verwerking van grondstoffen, eet- en drinkwaren of voedsel-ingrediënten bewust worden gebruikt om tijdens de
      bewerking of verwerking aan een bepaald technisch doel te beantwoorden en die kunnen leiden tot de onbedoelde maar
      technisch onvermijdelijke aanwezigheid van residuen van deze stoffen of derivaten ervan in het eindprodukt, mits
      deze residuen geen gevaar voor de gezondheid opleveren en geen technologische gevolgen voor het eindprodukt hebben;

      g. *opgietvloeistof:* een al dan niet bevroren of diepgevroren vloeistof, voor zover deze slechts van ondergeschikt
      belang is ten opzichte van de essentiële bestanddelen van de betrokken waar en derhalve niet doorslaggevend is voor
      de aankoop;

      h. *produktiepartij:* een verzameling verkoopeenheden van een eet- of drinkwaar die onder vrijwel identieke
      omstandigheden zijn geproduceerd, vervaardigd of verpakt, en waarvan de grootte is vastgesteld door de betrokken
      verhandelaar;

      i. *verordening (EG) 178/2002*: [verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement en de
      Raad van de Europese Unie van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de
      levensmiddelenwetgeving, tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van
      procedures voor voedselveiligheidsaangelegenheden (PbEG L 31).

      2 Voor de toepassing van dit besluit, behoudens [artikel 29][ref1], worden de als verhandelen aan te merken
      handelingen, voor wat betreft het te koop aanbieden, beperkt tot het te koop aanbieden op de plaats van verkoop.

      3 Voor de toepassing van dit besluit worden eet- of drinkwaren die van onderling verschillende samenstelling zijn
      en waarvoor een zelfde aanduiding pleegt te worden gebezigd, aangemerkt als een zelfde eet- of drinkwaar.

      4 In afwijking van het bepaalde in het eerste lid, onderdeel *c*, wordt onder een voorverpakte eet- of drinkwaar
      niet verstaan:

      a. eet- en drinkwaren die op de plaats van verkoop aan particulieren op verzoek van de koper zijn verpakt;

      b. eet- en drinkwaren die op de plaats van verkoop aan particulieren met het oog op de onmiddellijke verkoop zijn
      verpakt;

      c. eet- en drinkwaren die in het kader van markt- of straathandel, handel te water, dan wel verkoop aan huizen van
      particulieren, in de onderneming van de verkoper met het oog op de onmiddellijke verkoop aan particulieren zijn
      verpakt;

      d. eet- en drinkwaren die in opdracht van de koper zijn voorverpakt teneinde door de koper in het kader van een
      maaltijdverstrekking te worden afgeleverd; alsmede

      e. eet- en drinkwaren die in een fantasie-verpakking, zoals figuurtjes of souvenir-artikelen, worden verhandeld.

      5 Indien een grondstof van een eet- of drinkwaar bestaat uit meerdere bestanddelen, worden deze als afzonderlijke
      grondstoffen van de eet- of drinkwaar beschouwd.

      6 Bestanddelen van een grondstof, die tijdens de bereiding tijdelijk daaraan worden onttrokken en er vervolgens
      weer in worden verwerkt in een hoeveelheid die het aanvankelijk gehalte niet overschrijdt, worden, in afwijking van
      het bepaalde in het vijfde lid, niet als afzonderlijke grondstof beschouwd.

      7 Als ingrediënten worden niet aangemerkt grondstoffen die worden gebruikt als technologische hulpmiddelen.

      8 Als ingrediënten worden niet aangemerkt grondstoffen die worden gebruikt als levensmiddelenadditieven, vermeld
      in [bijlage II][ref2], en die in de eet- of drinkwaar waarvan zij deel uitmaken, geen technologische functie
      vervullen.

      9 Als ingrediënten worden niet aangemerkt stoffen die geen levensmiddelenadditief zijn, maar die op dezelfde wijze
      en voor hetzelfde doel worden gebruikt als technologische hulpstof en in al dan niet gewijzigde vorm nog aanwezig
      zijn in het eindproduct.

      10 Dit besluit is niet van toepassing op door liefdadigheidsinstellingen uit te delen eet- of drinkwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005310
