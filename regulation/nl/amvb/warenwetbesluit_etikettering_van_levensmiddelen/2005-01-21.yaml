  - number: '18'
    text: |-
      De aanwijzing omtrent de bewaring en het gebruik, bedoeld in [artikel 5, eerste lid, onderdeel e][ref1], moet
      worden gebezigd

      a. indien de eet- of drinkwaar op een bijzondere wijze moet worden bewaard; onderscheidenlijk

      b. indien zonder de aanwijzing omtrent het gebruik of het gebruiksklaar maken de eet- of drinkwaar niet op de
      juiste wijze kan worden gebruikt of gebruiksklaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '5'
        paragraaf: '3'
  - number: '19'
    text: |-
      De vermelding van de gegevens omtrent de producent, verpakker of verkoper, bedoeld in
      [artikel 5, eerste lid, onderdeel f][ref1], moet bestaan uit de naam of de handelsnaam en het adres van de
      fabrikant, van de verpakker of van een in het gebied waarop het Verdrag tot oprichting van de Europese Economische
      Gemeenschap dan wel de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, gevestigde
      verkoper, met dien verstande dat voor rechtspersonen de vermelding van het adres mag worden vervangen door de
      vermelding van de plaats van vestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '5'
        paragraaf: '3'
  - number: '20'
    text: |-
      De vermelding van de plaats van oorsprong of herkomst, bedoeld in [artikel 5, eerste lid, onderdeel g][ref1] moet
      bestaan uit een regionale, territoriale of topografische vermelding, en moet worden gebezigd indien weglating ervan
      de koper zou kunnen misleiden ten aanzien van de werkelijke oorsprong of herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel20
    references:
