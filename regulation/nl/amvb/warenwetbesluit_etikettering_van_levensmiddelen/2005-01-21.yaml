  - number: '10'
    text: |-
      1 De hoeveelheid van een ingrediënt of categorie ingrediënten die bij de bereiding van een eet- of drinkwaar is
      gebruikt, wordt vermeld indien het desbetreffende ingrediënt of de desbetreffende categorie ingrediënten:

      a. voorkomt in de aanduiding of door de koper gewoonlijk met de aanduiding wordt geassocieerd;

      b. opvallend in woord of beeld of als grafische voorstelling is aangegeven op de etikettering; of

      c. van wezenlijk belang is om de eet- of drinkwaar te karakteriseren en het te onderscheiden van de eet- of
      drinkwaren waarmee het vanwege zijn benaming of aanblik zou kunnen worden verward.

      2 Het eerste lid is niet van toepassing op een ingrediënt of een categorie ingrediënten

      a. waarvan het uitlekgewicht is aangegeven overeenkomstig [artikel 14][ref1];

      b. waarvan de hoeveelheid reeds bij of krachtens de [Warenwet][ref2] danwel een door de Europese Unie vastgestelde
      verordening op de eet- of drinkwaar moet worden vermeld;

      c. die in kleine hoeveelheid is toegevoegd voor aromatisering danwel smaakbepaling;

      d. die voorkomt in de aanduiding, maar niet van dien aard is dat zij de keuze van de koper bepaalt, omdat de
      variërende hoeveelheid niet van wezenlijk belang is om de eet- of drinkwaar te karakteriseren of het niet van
      soortgelijke eet- of drinkwaren onderscheidt;

      e. of bedoeld in [artikel 8, tweede lid][ref3].

      3 Het eerste lid is evenmin van toepassing op:

      a. zoetstoffen voor zover een vermelding, als bedoeld in [artikel 9 Warenwetbesluit Zoetstoffen][ref4], is
      gebezigd.

      b. vitamines en mineralen voor zover een vermelding inzake de toevoeging daarvan is gebezigd overeenkomstig het
      [Warenwetbesluit Voedingswaarde-informatie levensmiddelen][ref5].

      4 De in het eerste lid bedoelde hoeveelheid wordt uitgedrukt in procenten en wordt bepaald op het ogenblik dat het
      ingrediënt of de categorie van ingrediënten wordt gebruikt bij de bereiding van de eet- of drinkwaar.

      5 In afwijking van het vierde lid:

      a. wordt bij eet- en drinkwaren die tijdens de bereiding vocht verliezen als gevolg van een thermische of andere
      behandeling, de in het vierde lid bedoelde hoeveelheid als volgt vermeld:

        - als percentage van het eindproduct, of
        - indien dit percentage groter dan 100 is, als het gewicht van de hoeveelheid ingrediënt, vermeld in grammen, dat
      voor de bereiding van 100 gram eindproduct is gebruikt;

      b. wordt de hoeveelheid van vluchtige ingrediënten vermeld als het percentage in het eindproduct;

      c. kan de hoeveelheid van ingrediënten die in geconcentreerde of gedroogde vorm worden gebruikt en tijdens de
      bereiding worden gereconstitueerd, worden vermeld als het percentage voordat ze werden geconcentreerd of gedroogd;

      d. kan in het geval van geconcentreerde of gedroogde eet- en drinkwaren waaraan voor consumptie water of een
      andere vloeistof moet worden toegevoegd, de hoeveelheid van de ingrediënten worden uitgedrukt als percentage in het
      gereconstitueerde product.

      6 De in het vijfde lid bedoelde vermelding van de hoeveelheid wordt gebezigd:

        - in de aanduiding van de eet- of drinkwaar;
        - in de onmiddellijke nabijheid van de aanduiding; of
        - in de lijst van ingrediënten in samenhang met het betreffende ingrediënt of de categorie van ingrediënten.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001969
