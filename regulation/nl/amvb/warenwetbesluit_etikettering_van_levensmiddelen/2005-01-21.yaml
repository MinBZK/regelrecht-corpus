  - number: '2'
    text: |-
      1 Het is verboden eet- of drinkwaren te verhandelen anders dan met inachtneming van de voorschriften in dit besluit
      gesteld met betrekking tot hun aanduiding en tot het bezigen van vermeldingen of voorstellingen.

      2 Het is verboden ten aanzien van eet- en drinkwaren te handelen in strijd met artikel 16 van [verordening (EG)
      178/2002](32002R0178).

      3 Het is verboden te handelen in strijd met artikel 2 van [verordening (EG) nr. 608/2004](32004R0608) van
      de Commissie van de Europese Gemeenschappen van 31 maart 2004 inzake de etikettering van voedingsmiddelen en
      voedselingrediënten met toegevoegde fytosterolen, fytosterolesters, fytostanolen of fytostanolesters (PbEU L 97).
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel2
  - number: '3'
    text: |-
      Bij de verhandeling van voorverpakte, verpakte of onverpakte eet- of drinkwaren moet, met inachtneming van de bij
      of krachtens dit besluit terzake gestelde regels, de van toepassing zijnde aanduiding worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel3
  - number: '4'
    text: |-
      1 De aanduiding, bedoeld in [artikel 3][ref1], is de aanduiding voorgeschreven in de wettelijke bepalingen die op
      de betrokken eet- of drinkwaar van toepassing zijn. Bij het ontbreken van dergelijke bepalingen is de aanduiding:

      a. de benaming die uitsluitend mag worden gebezigd voor de eet- of drinkwaar waaraan die benaming in een wettelijk
      voorschrift is voorbehouden; dan wel

      b. de algemeen gebruikelijke benaming van de betrokken waar; dan wel

      c. een omschrijving van de betrokken waar en zonodig van de wijze waarop die waar kan worden gebruikt, welke
      zo duidelijk is gesteld dat de koper de ware aard van de waar kan begrijpen en haar kan onderscheiden van waren
      waarmede zij zou kunnen worden verward.

      2 In afwijking van het eerste lid mag de aanduiding worden gebezigd waaronder de desbetreffende eet- of drinkwaar
      rechtmatig in het verkeer is gebracht in een andere lidstaat van de Europese Unie of in een andere staat die partij
      is bij de overeenkomst betreffende de Europese Economische Ruimte, voor zover:

      a. deze aanduiding de koper in staat stelt die eet- of drinkwaar te onderscheiden van waren waarmee zij verward zou
      kunnen worden; of

      b. in de nabijheid van die aanduiding een vermelding wordt gebezigd inhoudende een beschrijving van de eet- of
      drinkwaar;

      zodat de koper geïnformeerd wordt over de ware aard en samenstelling van de waar.

      3 Het tweede lid is niet van toepassing indien een aldus geëtiketteerde eet- of drinkwaar wat betreft samenstelling
      of bereidingswijze zo sterk afwijkt van een onder die aanduiding bekende waar dat daarmee geen correcte
      voorlichting van de koper is gewaarborgd.

      4 Een fabrieks- of handelsmerk of een fantasienaam mag niet in de plaats treden van de aanduiding van de betrokken
      eet- of drinkwaar.

      5 De aanduiding moet een aanwijzing omvatten of vergezeld zijn van een aanwijzing inzake de fysische toestand
      waarin de eet- of drinkwaar zich bevindt of de specifieke behandeling die zij heeft ondergaan, indien zonder een
      dergelijke aanwijzing voor de koper met betrekking tot de waar een verkeerde indruk wordt gewekt of kan worden
      gewekt.

      6 In het geval van een eet- of drinkwaar die met ioniserende stralen is behandeld, is de in het vijfde lid bedoelde
      aanduiding inzake de specifieke behandeling die zij heeft ondergaan, een van de volgende:

        - "doorstraald";
        - "door straling behandeld";
        - "met ioniserende straling behandeld".


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel3
