  - number: '23'
    text: |-
      De in dit besluit bedoelde aanduiding en vermeldingen moeten duidelijk zichtbaar en gemakkelijk leesbaar zijn
      aangebracht en mogen niet door vegen kunnen worden uitgewist.

      Zij moeten, behoudens de vermelding, bedoeld in [artikel 5, eerste lid, onderdeel i][ref1], in elk geval in de
      Nederlandse taal zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '5'
        paragraaf: '3'
  - number: '24'
    text: |-
      1 Voor wat betreft voorverpakte eet- of drinkwaren moeten de in dit besluit bedoelde aanduiding en vermeldingen
      voorkomen op de verpakking of op een daaraan gehecht etiket.

      2 In afwijking van het eerste lid, behoeven de aanduiding en vermeldingen, behoudens de vermelding, bedoeld in
      [artikel 5, eerste lid, onderdeel i][ref1], slechts op de handelsdocumenten voor te komen die de desbetreffende
      voorverpakte eet- of drinkwaren vergezellen of die tegelijkertijd met of voor de aflevering worden verzonden,
      indien

      a. de desbetreffende waar, hoewel als zodanig bestemd voor de eindverbruiker niet zijnde een instelling, wordt
      verhandeld in een stadium voor de uiteindelijke aflevering;

      b. de desbetreffende waar is bestemd om aan instellingen te worden afgeleverd om daar te worden toebereid,
      verwerkt, in porties verdeeld, of om daar in het kader van een maaltijdverstrekking te worden afgeleverd;

      mits op de buitenste verpakking waarin de waar wordt verhandeld, worden gebezigd:

        - de aanduiding; en de volgende vermeldingen:
        - de gegevens omtrent de producent, verpakker of verkoper; en
        - de datum van minimale houdbaarheid, onderscheidenlijk de uiterste consumptiedatum.

      3 Voor wat betreft voorverpakte eet- en drinkwaren moeten de volgende vermeldingen zodanig zijn aangebracht dat zij
      zich bevinden in het zelfde gezichtsveld als de aanduiding:

      a. de netto-hoeveelheid;

      b. de datum van minimale houdbaarheid, onderscheidenlijk de uiterste consumptiedatum, met dien verstande dat mag
      worden volstaan met de woorden "ten minste houdbaar tot", of "ten minste houdbaar tot einde", onderscheidenlijk "te
      gebruiken tot", mits deze vermelding wordt gevolgd door een verwijzing naar de plaats op of aan de verpakking waar
      de datum voorkomt;

      c. het alcoholgehalte;

      d. het cafeïnegehalte.

      4 In afwijking van [artikel 5, eerste lid][ref2], mag op de verpakking van voorverpakte eet- of drinkwaren waarvan
      het grootste vlak kleiner is dan 10 cm2, worden volstaan met de vermelding van de netto-hoeveelheid en de datum van
      minimale houdbaarheid, onderscheidenlijk de uiterste consumptiedatum.

      5 In afwijking van de [artikelen 3][ref3] en [5, eerste lid][ref4], behoeven op gestandaardiseerde tapmaatflessen,
      waarin melk of melkprodukten zijn verpakt, slechts de datum van minimale houdbaarheid of de uiterste
      consumptiedatum, alsmede gegevens omtrent de producent, verpakker of verkoper te worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005310#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005310#Artikel5
