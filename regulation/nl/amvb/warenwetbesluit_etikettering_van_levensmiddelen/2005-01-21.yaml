  - number: '12'
    text: |-
      1 Indien een voorverpakte eet- of drinkwaar bestaat uit een aantal verpakte eenheden die ook als afzonderlijke
      verkoopeenheden aan eindverbruikers plegen te worden verhandeld, en die elk een zelfde hoeveelheid van die eet- of
      drinkwaar bevatten, moet:

      a. de vermelding van de hoeveelheid van die voorverpakte eet- of drinkwaar aangeven het totale aantal van
      vorenbedoelde verpakte eenheden, gevolgd door de netto-hoeveelheid van de eet- of drinkwaar, die één verpakte
      eenheid bevat;

      b. voor zover het betreft een voorverpakte eetwaar als bedoeld in [artikel 14][ref1], tevens een vermelding van
      het uitlekgewicht van het vaste hoofdbestanddeel van de betrokken eetwaar in één verpakte eenheid worden gebezigd,
      overeenkomstig het bepaalde in dat artikel.

      2 In afwijking van het eerste lid behoeven de aldaar bedoelde vermeldingen niet te worden gebezigd, indien het
      totale aantal afzonderlijke verpakte eenheden duidelijk kan worden gezien en van buitenaf gemakkelijk kan worden
      geteld, en de vermelding van de netto-hoeveelheid van elke afzonderlijke verpakte eenheid van buitenaf duidelijk
      kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel14
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '14'
        paragraaf: '3.2'
  - number: '13'
    text: |-
      1 Voor een voorverpakte eet- of drinkwaar die bestaat uit een aantal verpakte eenheden die afzonderlijk niet
      als een verkoopeenheid aan eindverbruikers plegen te worden verhandeld, moet behalve de vermelding van de netto-
      hoeveelheid, tevens een vermelding worden gebezigd, die het totale aantal van vorenbedoelde eenheden aangeeft.

      2 In afwijking van het eerste lid behoeft de aldaar bedoelde vermelding van het aantal eenheden niet te worden
      gebezigd ten aanzien van suikerwerk waarvan de hoeveelheid in elke verpakte eenheid ten hoogste 15 gram is.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel13
  - number: '14'
    text: |-
      1 Voor een voorverpakte eetwaar die bestaat uit vaste bestanddelen en een opgietvloeistof, moet tevens een
      vermelding worden gebezigd die het uitlekgewicht van het vaste hoofdbestanddeel aangeeft. Die vermelding moet
      inhouden het woord "uitlekgewicht", gevolgd door de waarde van dat gewicht, met dien verstande dat het woord
      "uitlekgewicht" mag worden vervangen door de benaming van het vaste hoofdbestanddeel, indien een aanduiding is
      gebezigd waarvan de benaming van dat hoofdbestanddeel en van de opgietvloeistof deel uitmaakt.

      2 Opgietvloeistof moet bestaan uit een of meer van de hierna genoemde vloeistoffen:

        - water, waterige oplossingen van zouten, voedingszuren, suikers, zoetstoffen, pekel of azijn;
        - het sap van de betrokken groente of van het betrokken fruit, indien het hoofdbestanddeel van de waar
      verduurzaamde groente of verduurzaamd fruit is.

      3 Het bestuur van het Produktschap voor Groenten en Fruit, van het Produktschap voor Pluimvee en Eieren, van het
      Produktschap Vee en Vlees, onderscheidenlijk van het Produktschap voor Vis en Visprodukten, kan nadere regels
      stellen ten aanzien van het bepalen van het uitlekgewicht voor die eetwaren waarvoor een uitlekgewicht moet worden
      gebezigd en welke ressorteren onder het desbetreffende produktschap.

      4 De op grond van de in het derde lid bedoelde verordening vastgestelde nadere voorschriften behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005310/2005-01-21#Artikel14
  - number: '15'
    text: |-
      De [artikelen 11][ref1], [12][ref2] en [13][ref3] zijn niet van toepassing ten aanzien van:

      a. voorverpakte eet- en drinkwaren die naar hun aard aanzienlijk aan volume of gewicht verliezen en

        - hetzij per stuk worden verkocht,
        - hetzij in aanwezigheid van de koper worden gewogen; of

      b. voorverpakte eet- en drinkwaren waarvan de netto-hoeveelheid in totaal

        - hetzij minder dan 25 gram bedraagt in het geval van suikerwerk;
        - hetzij minder dan 5 gram of 5 milliliter bedraagt in het geval van andere eet- of drinkwaren dan kruiden of
      specerijen.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel11
