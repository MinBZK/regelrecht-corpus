  - number: '7'
    text: |-
      1 Ingrediënten moeten worden vermeld met hun specifieke naam; [artikel 4][ref1] is van overeenkomstige toepassing.

      2 In afwijking van het eerste lid:

      a. mogen ingrediënten, omschreven in [bijlage I][ref2], worden vermeld met de daar vermelde groepsnaam, met
      inachtneming van de voorschriften voor zover daarbij aangegeven;

      b. worden ingrediënten, behorende tot een van de in [bijlage II][ref3] vermelde categorieën
      levensmiddelenadditieven, vermeld met de in die bijlage aangegeven naam van de betrokken categorie, gevolgd door,
      voor zover geen sprake is van gemodificeerd zetmeel:

      1°. de voor het ingrediënt gebruikelijke naam; of

      2°. het voor dat ingrediënt vastgestelde EG-nummer;

      c. moet, indien een ingrediënt dat behoort tot meer categorieën van de in [bijlage II][ref4] vermelde
      levensmiddelenadditieven, die categorie worden vermeld welke overeenkomt met de voornaamste functie van dit
      ingrediënt in de waar;

      d. mag, indien in de eet- of drinkwaar aanwezig zijn verschillende ingrediënten welke behoren tot één categorie
      levensmiddelenadditief als bedoeld in [bijlage II][ref5], de naam van die categorie in het meervoud worden vermeld.

      3 In afwijking van het eerste lid, moeten aroma’s worden vermeld met inachtneming van het volgende:

      a. aroma’s moeten worden vermeld met hetzij de term "aroma"(s)", hetzij een meer specifieke vermelding of een
      beschrijving van het aroma;

      b. de term "natuurlijk" of elke andere uitdrukking die in wezen dezelfde betekenis heeft, mag alleen
      worden gebruikt voor aroma’s waarvan de aromatiserende component uitsluitend aromastoffen bevat als
      omschreven in [artikel 1, eerste lid, onderdeel b, 1°][ref6] of aromatiserende preparaten als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van het Warenwetbesluit Aroma's][ref7];

      c. indien de vermelding van het aroma een verwijzing bevat naar de dierlijke of plantaardige oorsprong of aard van
      de gebruikte stoffen, mag de term "natuurlijk" of elke andere uitdrukking die in wezen dezelfde betekenis heeft,
      alleen worden gebruikt wanneer de aromatiserende component werd geïsoleerd door fysische dan wel enzymatische of
      microbiologische procédé’s of door traditionele levensmiddelenbereidingswijzen, uitsluitend of vrijwel uitsluitend
      uitgaande van de betrokken eet- of drinkwaar of het betrokken uitgangsmateriaal voor de bereiding van aroma's;

      d. voor zover het betreft kinine of cafeïne die wordt gebruikt als aroma bij de vervaardiging of de bereiding van
      een eet- of drinkwaar, wordt na de term «aroma» onmiddellijk de specifieke naam van het aroma vermeld.

      4 In afwijking van het eerste lid mag een grondstof, van een eet- of drinkwaar, die:

      1°. bestaat uit meerdere bestanddelen; en

      2°. een benaming heeft die wettelijk erkend of algemeen erkend is;

      naar zijn totale gewichtspercentage in de lijst van ingrediënten worden vermeld, mits direct achter de benaming
      van die grondstof de bestanddelen van die grondstof worden vermeld. De bestanddelen van die grondstof hoeven echter
      niet vermeld te worden indien:

      a. de samenstelling van die grondstof bij of krachtens wettelijk voorschrift is voorgeschreven en die grondstof
      minder dan 2% van de eet- of drinkwaar uitmaakt;

      b. de bestanddelen van die grondstof bestaan uit mengsels van kruiden of specerijen en die bestanddelen minder dan
      2% van de eet- of drinkwaar uitmaken; of

      c. de grondstof een eet- of drinkwaar is waarvoor geen lijst van ingrediënten hoeft te worden
      gebezigd.[Artikel 1, achtste lid][ref8], is van overeenkomstige toepassing.

      5 In afwijking van het eerste lid, moet de vermelding van de afzonderlijke bestanddelen van een grondstof die:

      a. bestanddelen zijn van een grondstof die voor minder dan 25% in de eet- of drinkwaar aanwezig is; en

      b. met ioniserende stralen zijn behandeld;

      plaatsvinden onmiddellijk achter de in dat lid bedoelde vermelding van de naam van de grondstof.

      6 De in [bijlage II][ref9] opgenomen vermelding gemodificeerd zetmeel wordt aangevuld met een omschrijving van de
      specifieke plantaardige oorsprong indien dat ingrediënt gluten kan bevatten.


