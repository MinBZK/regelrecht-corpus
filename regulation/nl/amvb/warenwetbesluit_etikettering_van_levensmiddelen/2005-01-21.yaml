    text: |-
      1 De vermelding, bedoeld in [artikel 5, eerste lid, onder l][ref1], bestaat uit het woord «bevat», gevolgd door de
      namen van de in de drank aanwezige:

      a. in [bijlage III][ref2] genoemde ingrediënten en stoffen; en

      b. overige ingrediënten.

      2 De in [artikel 5, eerste lid, onder l][ref3], bedoelde vermelding is niet vereist ten aanzien van een ingrediënt
      dat reeds onder eigen naam voorkomt in:

      a. een lijst van ingrediënten; of

      b. de verkoopbenaming van de desbetreffende drank.


