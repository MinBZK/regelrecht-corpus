  - number: 9a
    text: |-
      1 In afwijking van [artikel 7, tweede en vierde lid][ref1], en [artikel 9][ref2], worden de ingrediënten en stoffen
      die:

      a. gebruikt worden bij de bereiding van een eet- of drinkwaar;

      b. in al dan niet gewijzigde vorm nog aanwezig zijn in het eindproduct; en

      c. genoemd zijn in [bijlage III][ref3] of afkomstig zijn van een in die bijlage genoemd ingrediënt;

      in de lijst van ingrediënten vermeld, met een duidelijke verwijzing naar de benaming van het desbetreffende
      ingrediënt.

      2 De in het eerste lid bedoelde vermelding is niet vereist ten aanzien van een ingrediënt of stof waarnaar
      duidelijk wordt verwezen in de verkoopbenaming van de desbetreffende eet- of drinkwaar.

      3 In afwijking van [artikel 1, zesde tot en met negende lid][ref4], worden alle stoffen die:

      a. gebruikt worden bij de bereiding van een eet- of drinkwaar;

      b. in al dan niet gewijzigde vorm nog aanwezig zijn in het eindproduct; en

      c. afkomstig zijn van een in [bijlage III][ref5] genoemd ingrediënt;

      voor de toepassing van dit artikel aangemerkt als ingrediënt.


