  - number: '34'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 In afwijking van het eerste lid treedt dit besluit ten aanzien van onverpakte eet- of drinkwaren in werking met
      ingang van de vierde kalendermaand na de in dat lid bedoelde datum.

      3 In afwijking van het eerste lid treden de [artikelen 4, vierde lid][ref1], en
      [11, vierde lid, onderdeel b][ref2], in werking met ingang van de vierde kalendermaand na de in het eerste lid
      bedoelde datum.

      4 In afwijking van het bepaalde in het eerste lid treedt:

      a. [artikel 7, derde lid][ref3];

      b. [artikel 9, onderdeel e][ref4], voor zover het betreft dranken met een alcoholgehalte van minder dan 1,2% vol;

      c. [artikel 14][ref5], voor zover het betreft een bevroren of diepgevroren opgietvloeistof;

      d. [artikel 17][ref6];

      e. [artikel 24, eerste lid][ref7], in het in het tweede lid, onderdeel *a*, van dat artikel bedoelde geval;

      in werking met ingang van de negentiende kalendermaand na de in het eerste lid bedoelde datum.

      5 In afwijking van het bepaalde in het eerste lid treedt het bepaalde in dit besluit, voor zover van toepassing op:

      a. eet- of drinkwaren, kennelijk bestemd voor instellingen;

      b. eet- en drinkwaren die langer houdbaar zijn dan achttien maanden;

      c. eet- en drinkwaren aangeduid als "cacaofantasie" of als "imitatiechocolade";

      in werking met ingang van de negentiende kalendermaand na de in het eerste lid bedoelde datum.

      6 In afwijking van het eerste lid mogen eet- of drinkwaren die niet voldoen aan het bepaalde in
      [artikel 5, tweede lid][ref8], slechts worden verhandeld na het tijdstip waarop dit besluit in werking treedt,
      indien zij voor dat tijdstip in het verkeer zijn gebracht of zijn geëtiketteerd.


