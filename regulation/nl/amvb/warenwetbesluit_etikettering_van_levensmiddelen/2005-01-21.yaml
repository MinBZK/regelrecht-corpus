  - number: '5'
    text: |-
      1 Bij de verhandeling van voorverpakte eet- of drinkwaren moeten, met inachtneming van de bij of krachtens dit
      besluit gestelde regels, de volgende vermeldingen worden gebezigd:

      a. een lijst van ingrediënten;

      b. de hoeveelheid van een ingrediënt of van een categorie van ingrediënten;

      c. de netto-hoeveelheid;

      d. de datum van minimale houdbaarheid, onderscheidenlijk de uiterste consumptiedatum;

      e. een aanwijzing omtrent bewaring en gebruik;

      f. gegevens omtrent de producent, verpakker of verkoper;

      g. de plaats van oorsprong of herkomst;

      h. het alcoholgehalte;

      i. de produktiepartij;

      j. een vermelding inzake het gebruik van een verpakkingsgas;

      k. het cafeïnegehalte;

      l. voor zover het alcoholhoudende dranken betreft, bedoeld in [artikel 9, onder e][ref1], een vermelding van de
      ingrediënten of andere stoffen die bij de mens allergieën of intoleranties kunnen veroorzaken;

      m. een vermelding inzake in de waar aanwezig zoethout.

      2 Bij de verhandeling van niet-voorverpakte eet- of drinkwaren als bedoeld in
      [artikel 1, vierde lid, onderdeel e][ref2], moet, met inachtneming van de bij of krachtens dit besluit gestelde
      regels, in ieder geval de vermelding van de netto-hoeveelheid en van de produktiepartij worden gebezigd.

      3 Bij de verhandeling van niet-voorverpakte eet- of drinkwaren als bedoeld in
      [artikel 1, vierde lid, onderdelen b en c][ref3], moet, met inachtneming van de bij of krachtens dit besluit
      gestelde regels, in ieder geval de vermelding van de netto-hoeveelheid worden gebezigd.

      4 Bij de verhandeling van verpakte eet- of drinkwaren moet, met inachtneming van de bij of krachtens dit besluit
      gestelde regels, een vermelding betreffende de produktiepartij worden gebezigd.

      5 Bij de verhandeling van een eet- of drinkwaar die is behandeld met ioniserende stralen, wordt de doorstraling
      vermeld in de documenten welke die eet- of drinkwaar vergezellen of daarop betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel9
