  - number: '11.1'
    text: 'Dit besluit kan worden aangehaald als: Besluit kwaliteitseisen en monitoring water.'
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel11
  - number: '11.2'
    text: |-
      Het treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel11
