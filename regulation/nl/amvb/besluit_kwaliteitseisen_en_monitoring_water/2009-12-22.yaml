$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_kwaliteitseisen_en_monitoring_water
regulatory_layer: AMVB
publication_date: '2010-01-19'
valid_from: '2009-12-22'
bwb_id: BWBR0003633
url: https://wetten.overheid.nl/BWBR0003633/2009-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Onze Minister van
    Verkeer en Waterstaat van 24 januari 1983, DGMH/BWS/W, nr. 176814;

    Overwegende dat uitvoering moet worden gegeven aan de richtlijnen van de Raad van de Europese Gemeenschappen:

    van 16 juni 1975, 75/440/EEG, betreffende de vereiste kwaliteit van het oppervlaktewater dat is bestemd voor de
    produktie van drinkwater in de Lid-staten;

    van 8 december 1975, 76/160/EEG, betreffende de kwaliteit van zwemwater;

    van 18 juli 1978, 78/659/EEG, betreffende de kwaliteit van zoet water dat bescherming of verbetering behoeft
    teneinde geschikt te zijn voor het leven van vissen;

    van 9 oktober 1979, 79/869/EEG, inzake de meetmethoden en de frequentie van de bemonstering en de analyse van het
    oppervlaktewater dat is bestemd voor de produktie van drinkwater in de Lid-staten;

    van 30 oktober 1979, 79/923/EEG, inzake de vereiste kwaliteit van schelpdierwater;

    Gelet op de artikelen 13 en 15 van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Gezien het advies van de Raad van de Waterstaat van 14 mei 1982;

    De Centrale raad voor de Milieuhygiëne gehoord;

    De Raad van State gehoord (advies van 18 mei 1983, no. W08.83.0114/11.3.19.);

    Gezien het nader rapport van Onze Minister van Volkhuisvesting, Ruimtelijke Ordening en Milieubeheer en van Onze
    Minister van Verkeer en Waterstaat van 30 september 1983, DGMH/BWS, nr. 2053202;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - Onze Ministers: Onze Minister tezamen
      met Onze Ministers van Verkeer en Waterstaat en van Landbouw, Natuur en Voedselkwaliteit, ieder voor zover het
      onderdelen van het milieubeleid betreft, die tot zijn verantwoordelijkheid behoren;
        - stroomgebieddistrict: stroomgebieddistrict als bedoeld in [artikel 1.2, eerste lid, van de Waterwet][ref1];
        - monitoringsprogramma: programma als bedoeld in [artikel 5.3, vijfde lid, van de Wet milieubeheer][ref2];
        - stroomgebiedsbeheersplan: stroomgebiedsbeheersplan als bedoeld in artikel 13 van de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder de begrippen oppervlaktewatertoestand en
      grondwatertoestand datgene verstaan wat daaronder wordt verstaan in de kaderrichtlijn water.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel1
  - number: 1a.1
    text: |-
      De kwaliteitsdoelstelling oppervlaktewater voor de bereiding van drinkwater is het geheel van normen zoals
      aangegeven in de bij dit besluit behorende [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003633
  - number: 1a.2
    text: Aan de in het eerste lid bedoelde kwaliteitsdoelstelling is de datum van 1 januari 1985 verbonden.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel1a
  - number: 1a.3
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder oppervlaktewater niet verstaan
      zout en brak water.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel1a
  - number: '2.1'
    text: |-
      Een oppervlaktewaterlichaam waaraan de in [artikel 1a][ref1] bedoelde kwaliteitsdoelstelling is verbonden, dient te
      worden onderzocht met een minimumfrequentie als aangegeven in [bijlage I][ref2] ten aanzien van de in die bijlage
      aangegeven parameters en op de wijze als aangegeven in de bij dit besluit behorende [bijlage V][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0003633
      [ref3]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: 1a
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0003633
      - id: ref3
        bwb_id: BWBR0003633
  - number: '2.2'
    text: |-
      De gegevens die uit het in het eerste lid bedoelde onderzoek zijn verkregen, dienen zo spoedig mogelijk te worden
      gezonden aan de betrokken waterleidingbedrijven.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel2
  - number: '3.1'
    text: |-
      De kwaliteitsdoelstelling zwemwater is het geheel van normen zoals aangegeven in de bij dit besluit behorende
      [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003633
  - number: '3.2'
    text: Aan de in het eerste lid bedoelde kwaliteitsdoelstelling is de datum van 1 januari 1986 verbonden.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel3
  - number: '3.3'
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder badseizoen verstaan de periode
      van 1 mei tot en met 30 september.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel3
  - number: '4.1'
    text: |-
      Een oppervlaktewaterlichaam waaraan de in [artikel 3][ref1] bedoelde kwaliteitsdoelstelling is verbonden, dient te
      worden onderzocht met een minimumfrequentie als aangegeven in [bijlage II][ref2] ten aanzien van de in die bijlage
      aangegeven parameters en op de wijze als aangegeven in [bijlage V][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003633
      [ref3]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003633
      - id: ref3
        bwb_id: BWBR0003633
  - number: '4.2'
    text: |-
      De gegevens die uit het in het eerste lid bedoelde onderzoek zijn verkregen, dienen zo spoedig mogelijk te
      worden gezonden aan: - ingeval het onderzoek betrekking heeft op het water van een badinrichting als bedoeld
      in [artikel 1 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1]: de houder van de
      badinrichting;
        - ingeval het onderzoek betrekking heeft op een oppervlaktewaterlichaam in beheer bij het Rijk: gedeputeerde staten
      van de provincie waarin dat water is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '1'
  - number: '4.3'
    text: |-
      Eenmaal per badseizoen dient voorts onderzoek te worden verricht naar de omstandigheden in de omgeving van de
      plaats waar het zwemwater zich bevindt en die van invloed zijn of kunnen zijn op de kwaliteit van het zwemwater.
      Het in de eerste volzin bedoelde onderzoek dient in ieder geval het aantal, de aard en de omvang van de lozingen
      die van invloed zijn of kunnen zijn op de kwaliteit van het zwemwater te betreffen.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel4
  - number: '5.1'
    text: |-
      De kwaliteitsdoelstelling water voor zalmachtigen onderscheidenlijk water voor karperachtigen is het geheel
      van daarop onderscheidenlijk betrekking hebbende normen zoals aangegeven in de bij dit besluit behorende
      [bijlage III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003633
  - number: '5.2'
    text: |-
      Aan de in het eerste lid bedoelde kwaliteitsdoelstellingen is een termijn verbonden van vijf jaar, beginnende op
      het tijdstip waarop in een plan als bedoeld in de [artikelen 4.1][ref1], [4.4][ref2] en [4.6 van de Waterwet][ref3]
      voor de in het plan aangewezen oppervlaktewaterlichamen die kwaliteitsdoelstellingen zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '4'
  - number: '5.3'
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder water als bedoeld in het
      eerste lid niet verstaan zout en brak water.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Een oppervlaktewaterlichaam waaraan één van de in [artikel 5][ref1] bedoelde kwaliteitsdoelstellingen is verbonden,
      dient te worden onderzocht met een minimumfrequentie als aangegeven in [bijlage III][ref2] ten aanzien van de in
      die bijlage aangegeven parameters en op de wijze als aangegeven in [bijlage V][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003633
      [ref3]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003633
      - id: ref3
        bwb_id: BWBR0003633
  - number: '7.1'
    text: |-
      De kwaliteitsdoelstelling schelpdierwater is het geheel van normen zoals aangegeven in de bij dit besluit behorende
      [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003633
  - number: '7.2'
    text: |-
      Aan de in het eerste lid bedoelde kwaliteitsdoelstelling is een termijn verbonden van zes jaar, beginnende op het
      tijdstip waarop in een plan als bedoeld in de [artikelen 4.1][ref1], [4.4][ref2] en [4.6 van de Waterwet][ref3]
      voor de in het plan aangewezen oppervlaktewaterlichamen de kwaliteitsdoelstelling is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel4
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '4'
  - number: '7.3'
    text: |-
      Voor de toepassing van deze paragraaf en de daarop berustende bepalingen wordt onder schelpdierwater verstaan zout
      en brak schelpdierwater.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel7
  - number: '8.1'
    text: |-
      Een oppervlaktewaterlichaam waaraan de in [artikel 7][ref1] bedoelde kwaliteitsdoelstelling is verbonden, dient te
      worden onderzocht met een minimumfrequentie als aangegeven in [bijlage IV][ref2] ten aanzien van de in die bijlage
      aangegeven parameters en op de wijze als aangegeven in [bijlage V][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003633
      [ref3]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003633
      - id: ref3
        bwb_id: BWBR0003633
  - number: '8.2'
    text: |-
      De gegevens die uit het in het eerste lid bedoelde onderzoek zijn verkregen, dienen zo spoedig mogelijk te worden
      gezonden aan het Produktschap voor Vis en Visprodukten.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8
  - number: 8a.1
    text: |-
      Onze Ministers stellen met inachtneming van het daaromtrent bepaalde in de kaderrichtlijn water voor elk
      stroomgebieddistrict een monitoringsprogramma op.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8a
  - number: 8a.2
    text: |-
      Het monitoringsprogramma wordt getoetst en bijgesteld in gevallen waarin dat vereist wordt door de kaderrichtlijn
      water.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8a
  - number: 8a.3
    text: |-
      In afwijking van het eerste lid wordt een onderdeel van het monitoringsprogramma dat betrekking heeft op
      monitoring voor nader onderzoek, in gevallen als bedoeld in bijlage V, onder 1.3.3, bij de kaderrichtlijn water,
      met inachtneming van het daaromtrent bepaalde in de kaderrichtlijn water opgesteld door het bestuursorgaan dat
      krachtens [artikel 8b, tweede lid][ref1], verantwoordelijk is voor het meten of berekenen van de toestand van het
      waterlichaam ten aanzien waarvan de monitoring zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel8b
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: 8b
        paragraaf: 4a
  - number: 8a.4
    text: |-
      Van een monitoringsprogramma of een bijstelling daarvan wordt openbaar kennis gegeven door Onze Minister van
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8a
  - number: 8b.1
    text: |-
      Bij ministeriële regeling worden met het oog op de uitvoering van het monitoringsprogramma overeenkomstig het
      daaromtrent in de kaderrichtlijn water bepaalde regels gesteld met betrekking tot de wijze waarop en de frequentie
      waarmee de toestand van een waterlichaam wordt gemeten en berekend.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8b
  - number: 8b.2
    text: |-
      De bestuursorganen die bevoegd zijn een vergunning krachtens [artikel 6.2 van de Waterwet][ref1] te verlenen,
      zijn verantwoordelijk voor het meten en berekenen van de oppervlaktewatertoestand, ieder voor zover het de
      oppervlaktewaterlichamen of gedeelten daarvan betreft waarvoor hij bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 8b.3
    text: |-
      Gedeputeerde staten zijn verantwoordelijk voor het meten en berekenen van de grondwatertoestand, ieder voor
      zover het de grondwaterlichamen of gedeelten daarvan betreft die zijn gelegen in de provincie waarvan zij het
      bestuursorgaan zijn.
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8b
  - number: 8c
    text: |-
      De in [artikel 8b][ref1] bedoelde bestuursorganen doen van de metingen en berekeningen, waarvoor zij
      verantwoordelijk zijn, verslag aan Onze Minister van Verkeer en Waterstaat ten behoeve van de opstelling of de
      bijstelling van een stroomgebiedsbeheersplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel8b
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel8c
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: 8b
        paragraaf: 4a
  - number: '9.1'
    text: |-
      Binnen drie maanden na afloop van elk kalenderjaar dienen de gegevens die zijn verkregen uit het in het
      kalenderjaar verrichte onderzoek als bedoeld in [artikelen 2][ref1], [4, eerste lid][ref2], [6][ref3] en
      [8][ref4] te worden getoetst aan de desbetreffende kwaliteitsdoelstelling met inachtneming van de terzake gestelde
      voorschriften in [de bijlagen I][ref5] tot en met [IV][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003633#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003633#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003633#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003633
      [ref6]: https://wetten.overheid.nl/BWBR0003633
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0003633
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003633
        artikel: '6'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003633
        artikel: '8'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0003633
      - id: ref6
        bwb_id: BWBR0003633
  - number: '9.2'
    text: |-
      Van de resultaten van de in het eerste lid bedoelde toetsing alsmede van de resultaten van het in
      [artikel 4, derde lid][ref1], bedoelde onderzoek dient een overzicht te worden opgesteld, dat in afschrift aan Onze
      Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Verkeer en Waterstaat wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel4
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003633
        artikel: '4'
        paragraaf: '2'
  - number: '10'
    text: |-
      De verplichtingen, bedoeld in [de artikelen 2][ref1], [4][ref2], [6][ref3], [8][ref4] en [9][ref5] rusten op
      het overheidsorgaan dat ingevolge de [Waterwet][ref6] bevoegd is tot het verlenen van vergunningen als bedoeld in
      [artikel 6.2 van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003633#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003633#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003633#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003633#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003633#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0025458
      [ref7]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0003633/2009-12-22#Artikel10
    references:
