  - number: '3'
    text: |-
      1 De termijn voor het indienen van een aanvraag om een oordeel bedraagt zes weken.

      2 De termijn vangt aan met ingang van de dag na die waarop

      a. de beslissing waarover een oordeel wordt gevraagd bij aanvrager bekend is, dan wel

      b. de schade is ontstaan dan wel redelijkerwijs bij aanvrager bekend kon zijn.

      3 De [artikelen 6:9][ref1] en [6:11 van de Algemene wet bestuursrecht](onbekend) zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel69
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:9
  - number: '4'
    text: |-
      De aanvraag om een oordeel bevat de in [artikel 4:2 van de Algemene wet bestuursrecht][ref1] bedoelde gegevens en
      vermeldt tevens

      a. over welke beslissing van de betreffende aanbieder een oordeel wordt gevraagd, dan wel

      b. over welk handelen dan wel nalaten van de betreffende aanbieder ten gevolge waarvan de aanvrager schade heeft
      geleden dan wel schade kan lijden een oordeel wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
  - number: '5'
    text: |-
      1 Voor het vragen van een oordeel, bedoeld in [artikel 2][ref1], is een vergoeding verschuldigd van

      a. € 102 indien een oordeel gevraagd wordt door een natuurlijk persoon;

      b. € 204 indien een oordeel gevraagd wordt anders dan door een natuurlijk persoon.

      2 Het college wijst de aanvrager op het verschuldigd zijn van het bedrag en deelt hem mee dat het verschuldigde
      bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn gestort. Indien het bedrag
      niet binnen deze termijn is bijgeschreven of gestort, wordt de aanvraag niet in behandeling genomen, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.

      3 De in het eerste lid genoemde bedragen kunnen bij ministeriële regeling worden gewijzigd voorzover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.

      4 Het oordeel van het college kan inhouden dat de betaalde vergoeding aan de belanghebbende die een oordeel vraagt,
      door de door het college aangewezen aanbieder van huurlijnen, aanbieder van een vast openbaar telefoonnetwerk
      onderscheidenlijk aanbieder van een vaste openbare telefoondienst geheel of gedeeltelijk wordt vergoed.


