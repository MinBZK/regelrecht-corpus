---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_onp_geschillenbeslechting
regulatory_layer: AMVB
publication_date: '2004-05-18'
valid_from: '2002-01-01'
bwb_id: BWBR0009993
url: https://wetten.overheid.nl/BWBR0009993/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 juni 1998, nr HDTP/1631/MD, Hoofddirectie
    Telecommunicatie en Post;

    Gelet op richtlijn nr. 92/44/EEG van de Raad van de Europese Gemeenschappen van 5 juni 1992 betreffende de
    toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L165), richtlijn nr. 98/10/EG van het Europees
    Parlement en de Raad van de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision
    (ONP) op spraaktelefonie en inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat
    (PbEG L 101) en op de artikelen 7.1, 7.7 en 16.1 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 13 augustus 1998, no. W09.98.0233);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 3 november 1998, nr HDTP/98/3222/MD,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      [richtlijn 92/44/EEG](31992L0044): [richtlijn nr. 92/44/EEG](31992L0044) van de Raad van de Europese Gemeenschappen
      van 5 juni 1992 betreffende de toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L 165), zoals
      deze laatstelijk is gewijzigd bij [richtlijn nr. 97/51/EG](31997L0051) van het Europees Parlement en de Raad
      van de Europese Unie van 6 oktober 1997 tot wijziging van de [Richtlijnen 90/387/EEG](31990L0387) en [92/44/
      EEG](31992L0044) van de Raad met het oog op de aanpassing aan een door concurrentie gekenmerkte context in de
      telecommunicatie (PbEG L 295);
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      [richtlijn 98/10/EG](31998L0010): [richtlijn nr. 98/10/EG](31998L0010) van het Europees Parlement en de Raad van
      de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision (ONP) op spraaktelefonie en
      inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat (PbEG L 101), naar de tekst
      zoals deze bij die richtlijn is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een belanghebbende die de beëindiging van een aanbod van huurlijnen door een aanbieder van huurlijnen die krachtens
      [artikel 7.2 van de wet][ref1] door het college is aangewezen niet aanvaardt, kan hierover aan het college een
      oordeel vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '7'
  - number: '2.2'
    text: |-
      Een belanghebbende die zegt schade te hebben geleden dan wel schade te kunnen lijden ten gevolge van een schending
      door een aanbieder van huurlijnen, bedoeld in het eerste lid, van het bij of krachtens de [wet][ref1] bepaalde
      ter uitvoering van [richtlijn 92/44/EEG](31992L0044), kan over het betreffende handelen dan wel nalaten door die
      aanbieder aan het college een oordeel vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '2.3'
    text: |-
      Een belanghebbende die zegt schade te hebben geleden dan wel schade te kunnen lijden ten gevolge van een schending
      door een aanbieder van een vast openbaar telefoonnetwerk dan wel van een vaste openbare telefoondienst van het bij
      of krachtens de [wet][ref1] bepaalde ter uitvoering van [richtlijn 98/10/EG](31998L0010), kan over het betreffende
      handelen dan wel nalaten door die aanbieder aan het college een oordeel vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '3.1'
    text: De termijn voor het indienen van een aanvraag om een oordeel bedraagt zes weken.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
  - number: '3.2'
    text: De termijn vangt aan met ingang van de dag na die waarop
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
  - number: 3.2.a
    text: de beslissing waarover een oordeel wordt gevraagd bij aanvrager bekend is, dan wel
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
  - number: 3.2.b
    text: de schade is ontstaan dan wel redelijkerwijs bij aanvrager bekend kon zijn.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      De [artikelen 6:9][ref1] en [6:11 van de Algemene wet bestuursrecht](onbekend) zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '4'
    text: |-
      De aanvraag om een oordeel bevat de in [artikel 4:2 van de Algemene wet bestuursrecht][ref1] bedoelde gegevens en
      vermeldt tevens


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.a
    text: over welke beslissing van de betreffende aanbieder een oordeel wordt gevraagd, dan wel
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel4
  - number: 4.b
    text: |-
      over welk handelen dan wel nalaten van de betreffende aanbieder ten gevolge waarvan de aanvrager schade heeft
      geleden dan wel schade kan lijden een oordeel wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor het vragen van een oordeel, bedoeld in [artikel 2][ref1], is een vergoeding verschuldigd van


      [ref1]: https://wetten.overheid.nl/BWBR0009993#Artikel2
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009993
        artikel: '2'
  - number: 5.1.a
    text: € 102 indien een oordeel gevraagd wordt door een natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
  - number: 5.1.b
    text: € 204 indien een oordeel gevraagd wordt anders dan door een natuurlijk persoon.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het college wijst de aanvrager op het verschuldigd zijn van het bedrag en deelt hem mee dat het verschuldigde
      bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn gestort. Indien het bedrag
      niet binnen deze termijn is bijgeschreven of gestort, wordt de aanvraag niet in behandeling genomen, tenzij
      redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid genoemde bedragen kunnen bij ministeriële regeling worden gewijzigd voorzover het
      prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het oordeel van het college kan inhouden dat de betaalde vergoeding aan de belanghebbende die een oordeel vraagt,
      door de door het college aangewezen aanbieder van huurlijnen, aanbieder van een vast openbaar telefoonnetwerk
      onderscheidenlijk aanbieder van een vaste openbare telefoondienst geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel5
  - number: '6'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit ONP-geschillenbeslechting.'
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel7
