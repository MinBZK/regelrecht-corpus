  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 4 juni 1998, nr HDTP/1631/MD, Hoofddirectie
    Telecommunicatie en Post;

    Gelet op richtlijn nr. 92/44/EEG van de Raad van de Europese Gemeenschappen van 5 juni 1992 betreffende de
    toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L165), richtlijn nr. 98/10/EG van het Europees
    Parlement en de Raad van de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision
    (ONP) op spraaktelefonie en inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat
    (PbEG L 101) en op de artikelen 7.1, 7.7 en 16.1 van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 13 augustus 1998, no. W09.98.0233);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 3 november 1998, nr HDTP/98/3222/MD,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. [richtlijn 92/44/EEG](31992L0044): [richtlijn nr. 92/44/EEG](31992L0044) van de Raad van de Europese
      Gemeenschappen van 5 juni 1992 betreffende de toepassing van Open Network Provision (ONP) op huurlijnen (PbEG L
      165), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 97/51/EG](31997L0051) van het Europees Parlement en de
      Raad van de Europese Unie van 6 oktober 1997 tot wijziging van de [Richtlijnen 90/387/EEG](31990L0387) en [92/44/
      EEG](31992L0044) van de Raad met het oog op de aanpassing aan een door concurrentie gekenmerkte context in de
      telecommunicatie (PbEG L 295);

      c. [richtlijn 98/10/EG](31998L0010): [richtlijn nr. 98/10/EG](31998L0010) van het Europees Parlement en de Raad van
      de Europese Unie van 26 februari 1998 inzake de toepassing van Open Network Provision (ONP) op spraaktelefonie en
      inzake de universele telecommunicatiedienst in een door concurrentie gekenmerkt klimaat (PbEG L 101), naar de tekst
      zoals deze bij die richtlijn is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: '2'
    text: |-
      1 Een belanghebbende die de beëindiging van een aanbod van huurlijnen door een aanbieder van huurlijnen die
      krachtens [artikel 7.2 van de wet][ref1] door het college is aangewezen niet aanvaardt, kan hierover aan het
      college een oordeel vragen.

      2 Een belanghebbende die zegt schade te hebben geleden dan wel schade te kunnen lijden ten gevolge van een
      schending door een aanbieder van huurlijnen, bedoeld in het eerste lid, van het bij of krachtens de [wet][ref2]
      bepaalde ter uitvoering van [richtlijn 92/44/EEG](31992L0044), kan over het betreffende handelen dan wel nalaten
      door die aanbieder aan het college een oordeel vragen.

      3 Een belanghebbende die zegt schade te hebben geleden dan wel schade te kunnen lijden ten gevolge van een
      schending door een aanbieder van een vast openbaar telefoonnetwerk dan wel van een vaste openbare telefoondienst
      van het bij of krachtens de [wet][ref3] bepaalde ter uitvoering van [richtlijn 98/10/EG](31998L0010), kan over het
      betreffende handelen dan wel nalaten door die aanbieder aan het college een oordeel vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0009950
      [ref3]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009993/2002-01-01#Artikel2
