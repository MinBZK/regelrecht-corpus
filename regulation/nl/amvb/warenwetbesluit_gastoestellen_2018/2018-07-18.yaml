preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van voor Medische Zorg van 29 maart 2018, kenmerk 1313167-174480-VGP, in overeenstemming met Onze
    Minister van Economische Zaken en Klimaat en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Gelet op Verordening (EU) 2016/426 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
    gasverbrandingstoestellen en tot intrekking van Richtlijn 2009/142/EG van het Europees Parlement en de Raad (PbEU.
    2016, L 81/99), alsmede op de artikelen 4, eerste en tweede lid, 5, tweede lid, 6, 7, 11, eerste en tweede lid, 12,
    13, 13a, 14 en 32b van de Warenwet en artikel 16, eerste en tweede lid, van de Arbeidsomstandighedenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 25 april 2018, no. W13.18.0079/III);

    Gezien het nader rapport van Onze Minister voor Medische Zorg van 17 mei 2018, kenmerk 1335991-175040-VGP;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *verordening (EU) 2016/426:* verordening (EU) 2016/426 van het Europees Parlement en de Raad van 9 maart 2016
      betreffende gasverbrandingstoestellen en tot intrekking van [Richtlijn 2009/142/EG](32009L0142) van het Europees
      Parlement en de Raad (PbEU 2016, L 81);

      b. *EU-conformiteitsverklaring:* hetgeen artikel 15 van verordening (EU) 2016/426 daaronder verstaat;

      c. *gastoestellen:* hetgeen artikel 2 van verordening (EU) 2016/426 daaronder verstaat;

      d. *G+-gas:* gas met de samenstelling en kenmerken als vermeld in de tweede gasfamilie in de bijlage bij dit
      besluit;

      e. *H-gas:* gas met de samenstelling en kenmerken t als vermeld in groep E vermeld in de bijlage bij dit besluit;
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 3, eerste en tweede lid, 5, 6, derde lid, 11, 12, 37,
      derde lid, en 39, tweede lid, van verordening (EU) 2016/426.

      2 Het is verboden om een gastoestel te koop aan te bieden dat niet aantoonbaar geschikt is voor G+-gas en H-gas,
      dan wel niet aantoonbaar geschikt is voor G+-gas en aantoonbaar geschikt is te maken voor H-gas.

      3 Een EU-conformiteitsverklaring als bedoeld in artikel 15, tweede lid, van verordening (EU) 2016/426 is in ieder
      geval gesteld in het Nederlands of Engels.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel2
  - number: '3'
    text: |-
      1 De bevoegde autoriteit als bedoeld in artikel 23, tiende lid, van verordening (EU) 2016/426 is Onze Minister.

      2 De markttoezichtautoriteit als bedoeld in de artikelen 7, zesde lid, 8, tweede lid, onderdeel a, 9, tweede,
      derde en achtste lid, 10, tweede lid, 12, 15, derde lid, 29, tweede lid, 33, eerste lid, onderdeel c, en 37 van
      verordening (EU) 2016/426 is de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden te handelen in strijd met de artikelen 7, 14, eerste en vierde lid, 15, 16, 17, eerste tot en met
      het vierde lid, en 18 van verordening (EU) 2016/426.

      2 De instructies en gegevens aangaande de veiligheid alsmede de eventuele etikettering, bedoeld in artikel 7,
      zevende lid, eerste alinea, van verordening (EU) 2016/426 zijn in ieder geval gesteld in het Nederlands en de
      gegevens, bedoeld in artikel 7, zevende lid, tweede alinea en het negende lid, van verordening (EU) 2016/426, zijn
      in ieder geval gesteld in het Nederlands of het Engels.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden te handelen in strijd met artikel 9 van verordening (EU) 2016/426.

      2 De instructies en gegevens aangaande de veiligheid, bedoeld in artikel 9, derde en vierde lid, eerste alinea, van
      verordening (EU) 2016/426 zijn in ieder geval gesteld in het Nederlands en de gegevens bedoeld in artikel 9, vierde
      lid, tweede alinea en negende lid, van verordening (EU) 2016/426, zijn in ieder geval gesteld in het Nederlands of
      het Engels.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden te handelen in strijd met artikel 10 van verordening (EU) 2016/426.

      2 De instructies en gegevens aangaande de veiligheid, bedoeld in artikel 10, tweede lid, eerste alinea van
      verordening (EU) 2016/426, zijn in ieder geval gesteld in het Nederlands en de gegevens, bedoeld in artikel 10,
      tweede lid, tweede alinea van verordening (EU) 2016/426 zijn in ieder geval gesteld in het Nederlands of het
      Engels.

      3 De informatie en documentatie, bedoeld in artikel 10, vijfde lid, van verordening (EU) 2016/426 is in ieder geval
      gesteld in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel6
  - number: '7'
    text: Het is verboden te handelen in strijd met artikel 8, tweede lid, van verordening (EU) 2016/426.
    url: https://wetten.overheid.nl/BWBR0041162/2018-07-18#Artikel7
