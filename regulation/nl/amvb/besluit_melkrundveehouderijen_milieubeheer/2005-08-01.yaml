---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_melkrundveehouderijen_milieubeheer
regulatory_layer: AMVB
publication_date: '2006-09-05'
valid_from: '2005-08-01'
bwb_id: BWBR0005158
url: https://wetten.overheid.nl/BWBR0005158/2005-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 9 maart 1988,
    Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ0438025, gedaan in overeenstemming met Onze Minister
    van Landbouw en Visserij en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 2a en 30e van de Hinderwet (Stb. 1981, 410);

    De Raad van State gehoord (advies van 19 mei 1988, No.W08.88. 0119);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 17 juni
    1991, Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ17691036, uitgebracht in overeenstemming met
    Onze Minister van Landbouw, Natuurbeheer en Visserij en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a
    text: |-
      melkrundveehouderij: een inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort en die uitsluitend of in hoofdzaak is bestemd voor het bedrijfsmatig houden van
      melkrundvee, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.a.1°
    text: |-
      niet meer dan 50 mestvarkeneenheden worden gehouden, daarbij niet meegerekend ten hoogste 50 schapen die gedurende
      de aflamperiode in de inrichting worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.2°
    text: niet meer dan 50 geiten worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.3°
    text: geen pelsdieren bedrijfsmatig worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.4°
    text: aan konijnen niet meer dan 50 voedsters worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.5°
    text: niet meer dan 100 stuks melkrundvee worden gehouden;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.6°
    text: |-
      geen bassins voor de opslag van dunne mest aanwezig zijn met een gezamenlijke oppervlakte van meer dan 750 m², of
      een gezamenlijke inhoud van meer dan 2500 m3 en voor zover in de bassins geen beluchting, geforceerde vergisting of
      andere be- of verwerking van dunne mest plaatsvindt, behoudens mengen of roeren;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.7°
    text: |-
      geen andere nitraathoudende kunstmeststoffen aanwezig zijn dan die van de klasse C als gedefinieerd in richtlijn
      no 1 van de Commissie Preventie van Rampen door Gevaarlijke Stoffen (CPR), getiteld Nitraathoudende meststoffen,
      vervoer en opslag, derde druk 1982;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.8°
    text: |-
      ten hoogste 400 kg bestrijdingsmiddelen in de zin van de [Bestrijdingsmiddelenwet 1962][ref1] (*Stb.* 1962, 288)
      aanwezig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 1.1.a.9°
    text: |-
      elektriciteit voor elektrische installaties uitsluitend wordt betrokken van openbare elektriciteitsbedrijven,
      behoudens indien gebruik wordt gemaakt van noodstroomvoorzieningsinstallaties;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.10°
    text: |-
      uitsluitend gas, gasolie of lichte stookolie wordt gebruikt als brandstof ten behoeve van ruimteverwarming of
      warmwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.11°
    text: |-
      op het bewaren van butaan of propaan, anders dan in spuitbussen of gasflessen, het
      [Besluit voorzieningen en installaties milieubeheer][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: 1.1.a.12°
    text: 'ondergrondse bewaring van gasolie, dieselolie of lichte stookolie:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.12°.a
    text: niet plaatsvindt in een andere dan een stalen tank, en
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.12°.b
    text: niet plaatsvindt in een tank die onder een gebouw is gelegen, en
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.12°.c
    text: niet meer bedraagt dan 20 000 liter;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.13°
    text: geen onder- of bovengrondse tank voor de bewaring van K1- of K2-vloeistoffen aanwezig is;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.14°
    text: bovengrondse bewaring van gasolie, dieselolie of lichte stookolie niet meer bedraagt dan 5 000 liter;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.a.15°
    text: geen aflevering van motorbrandstoffen aan derden plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.b
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de melkrundveehouderij te verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.1.c
    text: |-
      dunne mest: mest die verpompbaar is en die bestaat uit faeces of urine van landbouwhuisdieren, al dan niet vermengd
      met mors-, spoel-, reinigings- of regenwater;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.d
    text: |-
      bassin: een reservoir bestemd en geschikt voor het bewaren van dunne mest, dat niet geheel of gedeeltelijk is
      gelegen onder een stal;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.e
    text: 'woning: een gebouw of een deel van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd;'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.f
    text: |-
      gevoelig object: een gebouw of deel van een gebouw dat tot het verblijf van personen is bestemd, een gebouw
      of terrein dat is bestemd voor verblijfs- of dagrecreatie, niet zijnde een kampeerterrein als bedoeld in
      [artikel 8][ref1], tweede lid, onder *a*, of [artikel 8, derde lid, van de Wet op de openluchtrecreatie][ref2], een
      gebouw dat deel uitmaakt van een agrarisch bedrijf en ter beschikking wordt gesteld voor het houden van recreatief
      nachtverblijf, of een als kamphuis of blokhut aan te merken bouwwerk, dat ter beschikking wordt gesteld voor het
      houden van recreatief nachtverblijf;


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
  - number: 1.1.g
    text: |-
      voor verzuring gevoelig gebied: een voor verzuring gevoelig gebied in de zin van de Interimwet ammoniak en
      veehouderij;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.h
    text: 'ammoniakemissie: emissie van potentieel zuur, afkomstig van ammoniak, gemeten in kg per jaar;'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.i
    text: 'ammoniakdepositie: depositie van potentieel zuur, afkomstig van ammoniak, gemeten in mol per hectare per jaar;'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.j
    text: 'melkrundvee:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.j.1°
    text: |-
      melkvee (exclusief bijbehorend vrouwelijk jongvee) dat overwegend wordt gehouden voor de melkproduktie met inbegrip
      van de dieren die in de mestperiode worden gemolken, tijdens de lactatie worden gemest dan wel zijn drooggezet en
      worden afgemest;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.1.j.2°
    text: |-
      vrouwelijk vleesvee ouder dan 2 jaar (exclusief bijbehorend vrouwelijk jongvee) dat op een met melkvee
      vergelijkbare manier wordt gehouden voor de vleesproduktie en het voortbrengen en zogen van kalveren.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.2'
    text: 'Dit besluit is niet van toepassing op een melkrundveehouderij die is opgericht:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.2.a
    text: |-
      na de datum van inwerkingtreding van dit besluit en die is gelegen op minder dan 50 m afstand van een woning van
      derden of een gevoelig object;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.2.b
    text: 'vóór de datum van inwerkingtreding van dit besluit en:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.2.b.1°
    text: die is gelegen op minder dan 25 m afstand van een woning van derden of een gevoelig object;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.2.b.2°
    text: |-
      waarin meer dan 50 stuks melkrundvee worden gehouden en die is gelegen op minder dan 50 m afstand van een woning
      van derden of een gevoelig object.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.3'
    text: |-
      Dit besluit is eveneens niet van toepassing op een melkrundveehouderij waar dunne mest wordt opgeslagen in een
      bassin dat tot stand is gebracht na 1 juni 1987 en dat is gelegen:
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.3.a
    text: |-
      op minder dan 50 m van een woning van derden, die behoort tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen inrichting voor het kweken, fokken, mesten,
      houden, verhandelen, verladen of wegen van dieren;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.3.b
    text: |-
      op minder dan 100 m afstand van een gevoelig object of een woning van derden, niet zijnde een woning als bedoeld
      onder *a*.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.4'
    text: |-
      Indien de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins minder bedraagt dan 350 m², bedragen
      de in het derde lid bedoelde afstanden respectievelijk 25 en 50 m.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.5'
    text: 'Dit besluit is voorts niet van toepassing op een melkrundveehouderij die is opgericht:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.a
    text: 'op of na 1 november 1997 en die:'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.a.1°
    text: op het dichtstbijgelegen voor verzuring gevoelige gebied een ammoniakdepositie van meer dan 15 mol veroorzaakt,
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.a.2°
    text: |-
      ligt in een gemeente, die is gelegen in een gebied als aangegeven in de bij de
      [Wet verplaatsing mestproduktie][ref1] behorende bijlage, of


      [ref1]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006285
  - number: 1.5.a.3°
    text: |-
      ligt in een gemeente waarin een ammoniakreductieplan geldt, als bedoeld in artikel 8 van de Interimwet ammoniak
      en veehouderij;
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.b
    text: |-
      voor 1 november 1997 en die op het dichtstbijgelegen voor verzuring gevoelige gebied een ammoniakdepositie
      veroorzaakt van:
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.b.1°
    text: meer dan 15 mol,
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.b.2°
    text: |-
      meer dan de hoogste, door degene die de melkrundveehouderij drijft, aan te tonen waarde van de ammoniakdepositie
      die de melkrundveehouderij voor 1 november 1997 heeft veroorzaakt en overeenkomstig dit besluit, zoals dit voor die
      datum luidde, mocht veroorzaken, indien die waarde hoger is dan 15 mol,
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.5.b.3°
    text: |-
      meer dan de hoogste waarde die de melkrundveehouderij mocht veroorzaken op grond van een vergunning krachtens de
      Hinderwet of [artikel 8.1 van de Wet milieubeheer][ref1] die voor de inrichting gold onmiddellijk voorafgaand aan
      het meest recente tijdstip waarop dit besluit op de inrichting van toepassing werd, indien die waarde hoger is dan
      15 mol en de onder 2° bedoelde waarde, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 1.5.b.4°
    text: |-
      meer dan de hoogste, door degene die de melkrundveehouderij drijft, aan te tonen waarde van de ammoniakdepositie,
      die de melkrundveehouderij voor 1 november 1997 heeft veroorzaakt en overeenkomstig dit besluit, zoals dit voor die
      datum luidde, mocht veroorzaken, indien de melkrundveehouderij ligt in een gemeente die is gelegen in een gebied
      als aangegeven in de bij de [Wet verplaatsing mestproduktie][ref1] behorende bijlage;


      [ref1]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006285
  - number: 1.5.c
    text: |-
      voor 1 november 1997 en die een hogere ammoniakemissie veroorzaakt dan de hoogste, door degene die de
      melkrundveehouderij drijft, aan te tonen waarde van de ammoniakemissie die de melkrundveehouderij voor 1 november
      1997 heeft veroorzaakt en overeenkomstig dit besluit, zoals dit voor die datum luidde, mocht veroorzaken, indien
      de melkrundveehouderij ligt in een gemeente waarin een ammoniakreductieplan geldt als bedoeld in artikel 8 van de
      Interimwet ammoniak en veehouderij.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.6'
    text: |-
      Het vijfde lid is op een melkrundveehouderij niet van toepassing, indien de hoogste, door degene die de
      melkrundveehouderij drijft, aan te tonen waarde van de ammoniakemissie, onderscheidenlijk van de ammoniakdepositie
      op het dichtstbijgelegen voor verzuring gevoelige gebied, die de melkrundveehouderij in de periode vanaf 1 november
      1997 tot 1 november 1998 heeft veroorzaakt, hoger is dan de in het vijfde lid aangegeven waarde, indien:
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.6.a
    text: |-
      voor de melkrundveehouderij ten behoeve van de oprichting dan wel een verandering of een verandering van de werking
      van de inrichting voor 1 november 1997 een bouwvergunning op grond van de [Woningwet][ref1] is verleend, dan wel,
      indien het een verandering of een verandering van de werking van de inrichting betreft, ten behoeve waarvan geen
      bouwvergunning is vereist, met het oog op die verandering voor 1 november 1997 investeringsverplichtingen zijn
      aangegaan ten bedrage van ten minste f 10 000,–,


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: 1.6.b
    text: de oprichting, verandering of verandering van de werking voor 1 november 1998 heeft plaatsgevonden en
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: 1.6.c
    text: |-
      de waarde die de melkrundveehouderij na de oprichting, verandering of verandering van de werking veroorzaakt,
      niet hoger is dan de waarde die de melkrundveehouderij voor 1 november 1997 mocht veroorzaken overeenkomstig dit
      besluit, zoals het voor die datum luidde.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.7'
    text: |-
      In afwijking van het vijfde en zesde lid is dit besluit niet van toepassing op een melkrundveehouderij indien
      met het oog op de toepassing van artikel 8, vierde lid, van de Interimwet ammoniak en veehouderij de voor een
      melkrundveehouderij geldende vergunning krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1], op
      of na 1 november 1997 geheel of gedeeltelijk is ingetrokken of is gewijzigd, en de melkrundveehouderij op het
      dichtstbijgelegen voor verzuring gevoelige gebied een ammoniakdepositie veroorzaakt van meer dan de hoogste
      waarde die de melkrundveehouderij na de intrekking of wijziging van de vergunning op grond van de vergunning mocht
      veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '1.8'
    text: |-
      De berekening van het aantal mestvarkeneenheden, bedoeld in het eerste lid, onder *a*, 1°, vindt plaats met
      toepassing van de door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer vastgestelde
      richtlijn Veehouderij en stankhinder, nr. DWL/96057153.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.9'
    text: |-
      Voor het bepalen van de afstanden genoemd in het tweede lid, onder *a* en *b*, dient te worden gemeten vanaf het
      bedrijfsmatig onderdeel van de melkrundveehouderij, dat het dichtst bij een woning van derden of een gevoelig
      object is gelegen.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '1.10'
    text: |-
      Bij de toepassing van het vijfde tot en met zevende lid, worden de ammoniakemissie en de ammoniakdepositie bepaald
      op de wijze waarop de ammoniakemissie en de ammoniakdepositie bij de toepassing van de Interimwet ammoniak en
      veehouderij worden bepaald.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel1
  - number: '2'
    text: |-
      Degene die een melkrundveehouderij drijft, dient te voldoen aan de voorschriften die zijn opgenomen in de bij dit
      besluit behorende [bijlage I][ref1], alsmede aan de krachtens deze voorschriften door het bevoegd gezag gestelde
      nadere eisen. De voorschriften, opgenomen in [bijlage I][ref2], zijn niet van toepassing op drukapparatuur,
      samenstellen en druksystemen waarop het [Warenwetbesluit drukapparatuur](onbekend) van toepassing is, voorzover de
      voorschriften betrekking hebben op het ontwerp, de vervaardiging, de overeenstemmingsbeoordeling, de keuring voor
      ingebruikneming en de herkeuring bedoeld in dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0005158
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0005158
  - number: '4.1'
    text: |-
      Degene die voornemens is een melkrundveehouderij op te richten, meldt dit ten minste vier weken voor het oprichten
      aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het uitbreiden of wijzigen van een
      melkrundveehouderij, dan wel met betrekking tot het veranderen van de werking daarvan. Deze melding is niet
      vereist, indien eerder een melding overeenkomstig het bepaalde in dit artikel is gedaan en door dit uitbreiden,
      wijzigen of veranderen van de werking van de inrichting geen afwijking ontstaat van de bij die melding verstrekte
      gegevens.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel4
  - number: '4.3'
    text: |-
      Bij een melding als bedoeld in het eerste of tweede lid, wordt in ieder geval het tijdstip vermeld, waarop de
      melkrundveehouderij of de uitbreiding of wijziging daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn, en worden de gegevens verstrekt, die in de bij dit besluit behorende
      [bijlage II][ref1] zijn aangegeven. De melding dient te worden gedaan op een formulier waarvan het model wordt
      vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. Onze Minister kan
      daarbij nadere regels stellen met betrekking tot de in [bijlage II][ref2] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
      [ref2]: https://wetten.overheid.nl/BWBR0005158
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005158
      - id: ref2
        bwb_id: BWBR0005158
  - number: '4.4'
    text: |-
      Degene die een melding heeft gedaan als bedoeld in het eerste of het tweede lid, dient het bevoegd gezag zo tijdig
      in kennis te stellen van een wijziging van het in het derde lid bedoelde tijdstip dat het bevoegd gezag in staat is
      voorafgaand aan dat tijdstip te controleren of aan de in [bijlage I][ref1] opgenomen voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005158
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005158
  - number: '5.1'
    text: |-
      Gedurende één jaar vanaf het tijdstip waarop dit besluit van toepassing wordt op een reeds opgerichte
      melkrundveehouderij, is [artikel 2][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005158#Artikel2
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005158
        artikel: '2'
  - number: '5.2'
    text: |-
      In een geval als bedoeld in het eerste lid, meldt degene die een melkrundveehouderij drijft, ten hoogste zes
      maanden na het in dat lid bedoelde tijdstip aan het bevoegd gezag dat hij de melkrundveehouderij in werking heeft.
      De melding geschiedt overeenkomstig [artikel 4, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005158#Artikel4
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005158
        artikel: '4'
  - number: '5.3'
    text: |-
      Deze melding is niet vereist, indien voor de melkrundveehouderij een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] of krachtens de Hinderwet is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel6
  - number: '7'
    text: 'Dit besluit kan worden aangehaald als: Besluit melkrundveehouderijen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0005158/2005-08-01#Artikel7
