  - number: 8.1.4
    text: |-
      1 Voor de periode die aanvangt op 1 juli 2009 en eindigt op 31 december 2009, kunnen, onverminderd het bepaalde
      bij of krachtens de wet, burgemeester en wethouders, gedeputeerde staten en Onze Minister of Onze Minister wie het
      aangaat de volgende ruimtelijke visies, besluiten, verordeningen of algemene maatregelen van bestuur, op zodanige
      wijze beschikbaar stellen dat deze langs elektronische weg door een ieder kunnen worden verkregen:

      a. structuurvisie;

      b. voorbereidingsbesluit;

      c. tijdelijke ontheffing;

      d. beheersverordening;

      e. provinciale verordening als bedoeld in [artikel 4.1 van de wet][ref1];

      f. algemene maatregel van bestuur als bedoeld in [artikel 4.3 van de wet][ref2];

      g. aanwijzing als bedoeld in [artikel 4.2][ref3] of [4.4 van de wet][ref4].

      [Artikel 1.2.1, tweede tot en met vierde lid][ref5], is van overeenkomstige toepassing.

      2 Voor de periode, bedoeld in het eerste lid, kunnen de in het eerste lid en de in
      [artikel 1.2.1, eerste lid][ref6], bedoelde visies, plannen, besluiten en verordeningen, met de daarbij behorende
      toelichting of onderbouwing langs elektronische weg worden vastgelegd en in die vorm vastgesteld. Een volledige
      verbeelding daarvan op papier wordt gelijktijdig vastgesteld. Bij de vaststelling van de in dit lid bedoelde
      visies, plannen, besluiten en verordeningen, wordt aangegeven dat toepassing is gegeven aan dit artikel.

      3 Indien na vaststelling de inhoud van de langs elektronische weg vastgelegde visies, plannen, besluiten en
      verordeningen als bedoeld in het tweede lid, en die van de verbeelding daarvan op papier tot een verschillende
      uitleg aanleiding geeft, is de eerstbedoelde inhoud beslissend.

      4 Er is een landelijke voorziening waar in elektronische vorm de visies, plannen, besluiten en verordeningen als
      bedoeld in het tweede lid, en de algemene maatregelen van bestuur als bedoeld in het eerste lid, voor een ieder
      volledig toegankelijk en raadpleegbaar zijn.

      5 Burgemeester en wethouders, gedeputeerde staten en Onze Minister of Onze Minister wie het aangaat, melden aan
      de landelijke voorziening de vindplaats van de visies, plannen, besluiten, en verordeningen, bedoeld in het tweede
      lid, en de algemene maatregelen van bestuur, bedoeld in het eerste lid.

      6 De in het tweede lid bedoelde visies, plannen, besluiten en verordeningen alsmede hun aansluiting op het
      aangrenzende gebied, worden vastgesteld met gebruikmaking van een duidelijke ondergrond. Bij het besluit tot
      vaststelling wordt aangegeven welke ondergrond is gebruikt. Het betrokken bestuursorgaan toont op verzoek de visie,
      het plan, het besluit of de verordening op deze ondergrond.

      7 De in het tweede lid bedoelde visies, plannen, besluiten en verordeningen en de in het eerste lid bedoelde
      algemene maatregelen van bestuur, bevatten een geometrische plaatsbepaling van het werkingsgebied en de eventueel
      daarin aangebrachte onderscheidingen.

      8 Op de in het tweede lid bedoelde visies, plannen, besluiten en verordeningen, is de
      [Regeling standaarden ruimtelijke ordening 2008][ref7] van toepassing, welke regeling voor de periode, bedoeld in
      het eerste lid, zijn grondslag vindt in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel4.3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4.2
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4.4
      [ref5]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref6]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref7]: https://wetten.overheid.nl/BWBR0024656
