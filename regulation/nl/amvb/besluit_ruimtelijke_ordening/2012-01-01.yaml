        artikel: 4:5
  - number: 6.3.3.3
    text: |-
      De subsidieverlening wordt geweigerd indien de aanvrager van de subsidie niet heeft voldaan aan het bepaalde in
      [artikel 6.3.2.1, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.2.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.3.2.1
        hoofdstuk: '6'
        paragraaf: 6.3.2
        afdeling: '6.3'
  - number: 6.3.4.1
    text: |-
      1 De subsidie-ontvanger voert de activiteiten uit overeenkomstig de door hem verstrekte gegevens, tenzij Onze
      Minister voorafgaand toestemming heeft gegeven daarvan af te wijken.

      2 De subsidie-ontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige
      wijze de kosten en de financieringswijze van de activiteit waarvoor een subsidie is verleend, kan worden afgelezen.

      3 Voor zover de activiteit zich over meer dan één kalenderjaar uitstrekt legt de subsidie-ontvanger tevens eenmaal
      per kalenderjaar een verslag omtrent de voortgang van de activiteit over aan Onze Minister.

      4 Onze Minister kan de subsidie-ontvanger bij de subsidieverlening ook andere verplichtingen opleggen die strekken
      tot verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.4.1
  - number: 6.3.5.1
    text: |-
      1 De subsidie-ontvanger dient binnen dertien weken na voltooiing van de activiteit bij Onze Minister een aanvraag
      tot subsidievaststelling in.

      3 De aanvraag tot subsidievaststelling gaat vergezeld van een activiteitenverslag, waarbij de subsidie-ontvanger
      aantoont dat de activiteit overeenkomstig de aan de subsidie verbonden verplichtingen heeft plaatsgevonden, en een
      financieel verslag.

      3 Indien de subsidie meer bedraagt dan € 50.000, gaat het financieel verslag
      vergezeld van een verklaring van getrouwheid van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die wordt afgegeven na toetsing van de
      wijze van besteding van de subsidie aan de [wet][ref2] en dit besluit.

      4 Het derde lid is niet van toepassing op subsidieverstrekking aan gemeenten of provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0020449
  - number: 6.3.5.2
    text: |-
      1 Indien de subsidie-ontvanger een gemeente, provincie of een regionaal openbaar lichaam op grond van
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] is, wordt een subsidievaststelling aangevraagd in het
      jaar na de voltooiing van de activiteit, door de verantwoordingsinformatie aan Onze Minister te verstrekken, op de
      wijze, bedoeld in [artikel 27 van het Besluit financiële verhouding 2001][ref2].

      2 [Artikel 58a van het Besluit begroting en verantwoording provincies en gemeenten][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0012216#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0014606#Artikel58a
