  - number: 1.2.4
    text: |-
      1 De in [artikel 1.2.1, eerste lid][ref1], bedoelde visies, plannen, besluiten en verordeningen alsmede hun
      aansluiting op het aangrenzende gebied, worden vastgesteld met gebruikmaking van een duidelijke ondergrond. Bij
      het besluit tot vaststelling wordt aangegeven welke ondergrond is gebruikt. Het betrokken bestuursorgaan toont op
      verzoek de visie, het plan, het besluit of de verordening op deze ondergrond.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de aard van de ondergrond en de schaal van de
      weergave van de ruimtelijke ontwikkelingen, bestemmingen, doeleinden, onderscheidingen of het betrokken gebied en
      het aangrenzende gebied. Daarbij kan tevens worden bepaald of en op welke wijze andere gegevens in de visie, het
      plan, het besluit of de verordening worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel1.2.4
    references:
