  - number: 1.2.3
    text: |-
      1 De in [artikel 1.2.1, eerste lid][ref1], bedoelde visies, plannen, besluiten en verordeningen in voorkomend
      geval met de daarbij behorende toelichting of onderbouwing worden langs elektronische weg vastgelegd en in die vorm
      vastgesteld. Een volledige verbeelding daarvan op papier wordt gelijktijdig vastgesteld.

      2 Indien na vaststelling de inhoud van de langs elektronische weg vastgelegde visies, plannen, besluiten en
      verordeningen als bedoeld in het eerste lid, en die van de verbeelding daarvan op papier tot een verschillende
      uitleg aanleiding geeft, is de eerstbedoelde inhoud beslissend.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel1.2.3
