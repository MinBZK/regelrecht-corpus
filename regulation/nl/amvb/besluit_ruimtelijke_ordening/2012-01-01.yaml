  - number: 1.2.1
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [wet][ref1] stellen burgemeester en wethouders, gedeputeerde staten
      en Onze Minister of Onze Minister wie het aangaat de volgende ruimtelijke visies, plannen, besluiten, verordeningen
      of algemene maatregelen van bestuur, op zodanige wijze beschikbaar dat deze langs elektronische weg door een ieder
      kunnen worden verkregen:

      a. structuurvisie;

      b. bestemmingsplan;

      c. wijzigings- of uitwerkingsplan;

      d. voorbereidingsbesluit;

      e. beheersverordening;

      f. provinciale verordening als bedoeld in [artikel 4.1 van de wet][ref2];

      g. algemene maatregel van bestuur als bedoeld in [artikel 4.3 van de wet][ref3];

      h. aanwijzing als bedoeld in [artikel 4.2][ref4] of [4.4 van de wet][ref5];

      i. rijksbestemmingsplan.

      2 De beschikbaarstelling, bedoeld in het eerste lid, omvat een volledige, toegankelijke en begrijpelijke
      verbeelding van de visie, het plan, het besluit, de verordening of de algemene maatregel van bestuur met de daarbij
      behorende toelichting of onderbouwing.

      3 Een ieder wordt in de gelegenheid gesteld een visie, plan, besluit, verordening of algemene maatregel van bestuur
      als bedoeld in het eerste lid, op het gemeentehuis en in voorkomend geval tevens op het provinciehuis of in de
      hoofdzetel van het ministerie van Onze Minister of van Onze Minister wie het aangaat, langs elektronische weg te
      raadplegen.

      4 Een visie, plan, besluit, verordening of algemene maatregel van bestuur als bedoeld in het eerste lid, wordt met
      de daarbij behorende stukken op het gemeentehuis van de betrokken gemeente en in voorkomend geval tevens op het
      provinciehuis of in de hoofdzetel van het ministerie van Onze Minister of van Onze Minister wie het aangaat, ter
      inzage gelegd. Op verzoek wordt tegen kostprijs afschrift daarvan verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
