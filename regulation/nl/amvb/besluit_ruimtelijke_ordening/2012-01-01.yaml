  - number: 1.2.6
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld omtrent de vormgeving en inrichting van de in
      [artikel 1.2.1, eerste lid][ref1], bedoelde visies, plannen, besluiten en verordeningen.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent het waarborgen van de authenticiteit van de
      documenten deel uitmakend van een in [artikel 1.2.1, eerste lid][ref2], bedoelde visie, plan, besluit, verordening
      of algemene maatregel van bestuur.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de methoden en technieken voor het langs
      elektronische weg aan een ieder beschikbaar stellen van een in [artikel 1.2.1, eerste lid][ref3], bedoelde visie,
      plan, besluit, verordening of algemene maatregel van bestuur.

      4 Bij ministeriële regeling kunnen voorts nadere regels worden gesteld omtrent het langs elektronische weg aan
      een ieder beschikbaar stellen door het verantwoordelijke bestuursorgaan van ter inzage gelegde, vastgestelde of
      onherroepelijk vastgestelde structuurvisies, bestemmingsplannen, voorbereidingsbesluiten, beheersverordeningen en
      aanwijzingen van provincies of Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
