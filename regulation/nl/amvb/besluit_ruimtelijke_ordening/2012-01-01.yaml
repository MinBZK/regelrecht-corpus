  - number: 1.1.2
    text: |-
      Bij het stellen van regels in een bestemmingsplan, wijzigings- of uitwerkingsplan als bedoeld
      in [artikel 3.6, eerste lid, onder a of b, van de wet][ref1], rijkbestemmingsplan als bedoeld in
      [artikel 10.3 van de wet][ref2] of beheersverordening, bij de beslissing op een aanvraag om een omgevingsvergunning
      waarbij met toepassing van [artikel 2.12 de Wet algemene bepalingen omgevingsrecht][ref3] van het bestemmingsplan
      of de beheersverordening wordt afgeweken wordt voorkomen dat strijdigheid ontstaat met artikel 14, aanhef en
      onder 5, van richtlijn nr. 2006/123/EG van het Europees Parlement en de Raad van de Europese Unie van 12 december
      2006 betreffende de diensten op de interne markt (PbEU L 376). Een wijziging van de richtlijn, bedoeld in de
      eerste volzin, gaat voor de toepassing van die volzin gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel10.3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
