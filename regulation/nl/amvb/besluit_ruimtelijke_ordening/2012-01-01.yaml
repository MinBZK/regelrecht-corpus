  - number: 6.2.5
    text: |-
      Tot de voorzieningen, bedoeld in [artikel 6.2.4, onder c][ref1], worden gerekend:

      a. nutsvoorzieningen met bijbehorende werken en bouwwerken, voor zover de aanlegkosten bij of door de gemeente in
      rekening worden gebracht en niet via de verbruikstarieven kunnen worden gedekt;

      b. riolering met inbegrip van bijbehorende werken en bouwwerken;

      c. wegen, ongebouwde openbare parkeergelegenheden, pleinen, trottoirs, voet- en rijwielpaden, waterpartijen,
      watergangen, voorzieningen ten behoeve van de waterhuishouding, bruggen, tunnels, duikers, kades, steigers, en
      andere rechtstreeks met de aanleg van deze voorzieningen verband houdende werken en bouwwerken;

      d. infrastructuur voor openbaar vervoervoorzieningen met bijbehorende werken en bouwwerken, voor zover de
      aanlegkosten bij of door de gemeente in rekening worden gebracht en niet via de gebruikstarieven kunnen worden
      gedekt;

      e. groenvoorzieningen, waaronder begrepen openbare parken, plantsoenen, speelplaatsen, trapvelden en speelweiden,
      natuurvoorzieningen en openbare niet-commerciële sportvoorzieningen;

      f. openbare verlichting en brandkranen met aansluitingen;

      g. straatmeubilair, speeltoestellen, sierende elementen, kunstobjecten en afrasteringen in de openbare ruimte;

      h. gebouwde parkeervoorzieningen, voor zover deze leiden tot optimalisering van het grondgebruik en verbetering
      van de kwaliteit van de openbare ruimte, openbaar toegankelijk zijn en voornamelijk worden gebruikt door bewoners
      en gebruikers van het exploitatiegebied, voor zover de aanlegkosten bij of door de gemeente in rekening worden
      gebracht en niet via de gebruikstarieven kunnen worden gedekt;

      i. uit een oogpunt van milieuhygiëne, archeologie of volksgezondheid noodzakelijke voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.2.4
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.2.6
    text: |-
      Met betrekking tot de kostensoorten, bedoeld in [artikel 6.2.4, onder a en g tot en met j][ref1], kunnen
      bij ministeriële regeling regels worden gesteld met betrekking tot de hoogte en de begrenzing van de via het
      exploitatieplan verhaalbare kosten. Bij deze regels kan een onderscheid worden gemaakt naar type locatie en de aard
      en omvang van een project.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.6
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.2.4
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.2.7
    text: |-
      Tot de opbrengsten van de exploitatie, bedoeld in [artikel 6.13, eerste lid, onder c, ten derde, van de wet][ref1],
      worden gerekend de ramingen van de opbrengsten:

      a. van uitgifte van de gronden in het exploitatiegebied;

      b. van bijdragen en subsidies van derden;

      c. welke worden verkregen of toegekend in verband met het in exploitatie brengen van gronden die in de naaste
      toekomst voor bebouwing in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.7
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.13'
  - number: 6.2.8
    text: |-
      In de in [artikel 6.13, eerste lid, onder c, van de wet][ref1] bedoelde exploitatieopzet wordt vermeld welk
      percentage van de totale kosten, met uitzondering van de kosten bedoeld in [artikel 6.2.4, onder f][ref2],
      gerealiseerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.13'
      - id: ref2
        bwb_id: BWBR0023798
        artikel: 6.2.4
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.2.9
    text: |-
      De in [artikel 6.13, tweede lid, onder c, van de wet][ref1] bedoelde regels kunnen mede betrekking hebben op het
      in overeenstemming met de geldende aanbestedingsregels aanbesteden van de in het exploitatieplan voorziene werken
      en werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.13'
  - number: 6.2.10
    text: |-
      De in [artikel 6.13, tweede lid, onder d, van de wet][ref1] bedoelde regels kunnen mede betrekking hebben op:

      a. het aantal en de situering van sociale huurwoningen, sociale koopwoningen en percelen voor particulier
      opdrachtgeverschap;

      b. de categorieën woningzoekenden, die voor een kavel voor particulier opdrachtgeverschap in aanmerking komen;

      c. de methode van toewijzing van kavels voor particulier opdrachtgeverschap;

      d. de prijsvorming van kavels voor particulier opdrachtgeverschap, waarbij voor kavels in de vrije sector wordt
      uitgegaan van een door een onafhankelijke taxateur vastgestelde prijs die is aanvaard door de gemeente en de
      verkoper, of van een veiling onder toezicht van een notaris;

      e. het sluiten van een overeenkomst tot vervreemding van een kavel voor particulier opdrachtgeverschap en de
      overdracht van de voor de kavel verstrekte bouwvergunning, tot aan het moment van voltooiing van de bouw van de
      woning;

      f. regels betreffende het tegengaan van speculatie met betrekking tot sociale huur- en koopwoningen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.10
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.13'
  - number: 6.2.11
    text: |-
      Een exploitatieplan gaat vergezeld van een toelichting, welke tenminste bevat:

      a. een aanduiding van het ruimtelijk besluit, waarmee het exploitatieplan verbonden is;

      b. een toelichting op de functie van het exploitatieplan, en

      c. een toelichting bij de begrenzing van het exploitatiegebied;

      alsmede, voor zover van toepassing, een toelichting bij:

      d. de locatie-eisen;

      e. de regels voor woningbouwcategorieën;

      f. de overige regels in het exploitatieplan;

      g. de exploitatieopzet;

      h. de kosten per soort;

      i. de bovenwijkse kosten;

      j. de kosten voor toekomstige ontwikkelingen;

      k. de opbrengstcategorieën en prijzen;

      l. de wijze van toerekening, en

      m. indien de exploitatieopzet een tekort vertoont, een omschrijving van de wijze waarop het tekort wordt gedekt.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.11
  - number: 6.2.12
    text: |-
      Binnen twee weken na het sluiten van een overeenkomst als bedoeld in [artikel 6.24 van de wet][ref1] leggen
      burgemeester en wethouders een zakelijke beschrijving van de inhoud van de overeenkomst ter inzage.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.24
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.12
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.24'
  - number: 6.3.1.1
    text: |-
      In deze afdeling en in een ministeriële regeling krachtens [artikel 6.10, tweede lid][ref1], of
      [artikel 6.11, eerste lid, van de wet][ref2] wordt verstaan onder

      programma: geheel van aangewezen taken, activiteiten of maatregelen op het gebied van de ruimtelijke ordening, in
      de kosten waarvan door Onze Minister een subsidie kan worden verleend voor het bereiken van de bij die aanwijzing
      opgenomen doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.10
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.11
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.10'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.11'
  - number: 6.3.1.2
    text: |-
      1 Deze afdeling is van toepassing op elke krachtens de [wet][ref1] of de daarop berustende bepalingen door Onze
      Minister te verlenen of verleende subsidie.

      2 Terzake van een subsidie waaraan geen programma ten grondslag ligt, wordt in
      [artikel 6.3.1.4, eerste en tweede lid][ref2], in plaats van «een programma» telkens gelezen: «een beschikking
      tot subsidieverlening» en wordt in [artikel 6.3.1.4, tweede lid][ref3], in plaats van «dat programma» of «het
      programma» gelezen: «de beschikking tot subsidieverlening».


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.1.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0020449
      - id: ref2
        bwb_id: BWBR0023798
        artikel: 6.3.1.4
        hoofdstuk: '6'
        paragraaf: 6.3.1
        afdeling: '6.3'
      - id: ref3
        bwb_id: BWBR0023798
        artikel: 6.3.1.4
        hoofdstuk: '6'
        paragraaf: 6.3.1
        afdeling: '6.3'
  - number: 6.3.1.3
    text: |-
      Bij een ministeriële regeling als bedoeld in de aanhef van [artikel 6.3.1.1][ref1] worden in elk geval regels
      gegeven omtrent:

      a. de geldingsduur;

      b. de hoogte van het jaarlijkse totale bedrag voor alle in die regeling opgenomen categorieën van subsidies
      tezamen, onderverdeeld naar de in de regeling onderscheiden categorieën van subsidies;

      c. de eisen waaraan moet worden voldaan om in aanmerking te komen voor een subsidie;

      d. het maximumbedrag van de subsidie of de maatstaven voor het vaststellen van de hoogte van de subsidie;

      e. de weigering en aanhouding van de aanvraag van een subsidie vanwege de overschrijding of dreigende
      overschrijding van een bedrag als bedoeld onder b of d.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.1.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.3.1.1
        hoofdstuk: '6'
        paragraaf: 6.3.1
        afdeling: '6.3'
  - number: 6.3.1.4
    text: |-
      1 In een programma worden ten minste opgenomen het doel van de subsidie, een aanduiding van de in aanmerking
      komende subsidieontvangers en van de subsidiabele kosten en, indien van toepassing, het subsidieplafond, het
      maximale subsidiepercentage en het maximale subsidiebedrag.

      2 Indien voor een programma een subsidieplafond wordt vastgesteld, wordt in dat programma in verband met de
      besluitvorming over de aanvraag van de subsidie bepaald of bij de subsidieverlening:

      a. op de aanvragen in volgorde van ontvangst wordt beslist, met dien verstande dat wanneer de aanvrager krachtens
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag is aangevuld voor die beslissing als datum van ontvangst van de aanvraag geldt, of

      b. aanvragen met betrekking tot soortgelijke activiteiten gelijktijdig worden beoordeeld op basis van hun
      geschiktheid om bij te dragen aan de doelstellingen van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 6.3.1.5
    text: |-
      1 Onze Minister maakt een door hem vastgesteld subsidieplafond voor het daaropvolgende kalenderjaar en de wijze van
      verdeling van het beschikbare bedrag vóór 1 november in de Staatscourant bekend.

      2 Indien het subsidieplafond van een programma is bereikt, waarvoor de in [artikel 6.3.1.4, tweede lid][ref1],
      bedoelde wijze van verdeling geldt, maakt Onze Minister dit onverwijld in de Staatscourant bekend.

      3 De [artikelen 4:27, tweede lid][ref2], en [4:28 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel427
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel428
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.3.1.4
        hoofdstuk: '6'
        paragraaf: 6.3.1
        afdeling: '6.3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:27
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 4:28
  - number: 6.3.1.6
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt geen subsidie verleend voor:

      a. de in [artikel 6.10, eerste lid, onder a, van de wet][ref2] genoemde activiteiten voor zover het reguliere
      kosten voor het opstellen en herzien van ruimtelijke plannen betreft;

      b. de in [artikel 6.10, eerste lid, onder b, van de wet][ref3] genoemde activiteiten voor zover de kosten daarvoor
      uit hoofde van een andere regeling voor vergoeding in aanmerking kunnen komen;

      c. de in [artikel 6.10, eerste lid, onder c, van de wet][ref4] genoemde activiteiten voor zover niet is aangetoond
      dat de activiteiten in financiële en in bestuurlijke zin haalbaar zijn of voor zover de kosten uit hoofde van een
      andere regeling voor vergoeding in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.10
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.10
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel6.10
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:35
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.10'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6.10'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '6.10'
  - number: 6.3.1.7
    text: |-
      Onze Minister kan ter uitvoering van een structuurvisie over de Waddenzee subsidie verstrekken ten behoeve van het
      bestuurlijk overleg over het Waddengebied.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.1.7
  - number: 6.3.2.1
    text: |-
      1 De aanvraag van de subsidie wordt voorafgaand aan de activiteiten bij Onze Minister ingediend.

      2 De activiteit vangt aan in het jaar waarop de aanvraag van de subsidie betrekking heeft.

      3 De aanvraag van de subsidie gaat in elk geval vergezeld van:

      a. een sluitende begroting van de kosten of de wijze van bekostiging van de activiteit waarop de aanvraag
      betrekking heeft, en

      b. een beschrijving van de activiteit en een tijdsplanning.

      4 Onze Minister kan nadere regels geven omtrent de gegevens die bij de aanvraag van de subsidie dienen te worden
      verstrekt.

      5 Aan de aanvrager van de subsidie wordt onverwijld een bericht van ontvangst gezonden, waarin de datum van
      ontvangst wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.2.1
  - number: 6.3.3.1
    text: |-
      Onze Minister neemt bij de verdeling van het beschikbare bedrag in aanmerking:

      a. het belang van de activiteit waarvoor een aanvraag om subsidie is ingediend voor de uitvoering van het nationaal
      ruimtelijk beleid, en

      b. de bijdrage van die activiteit aan de verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.3.1
  - number: 6.3.3.2
    text: |-
      1 Tenzij een aanvraag om subsidie wordt beoordeeld met toepassing van [artikel 6.3.1.4, tweede lid, onder b][ref1],
      beslist Onze Minister binnen acht weken na de ontvangst van de aanvraag, met dien verstande dat wanneer de
      aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de aanvraag
      aan te vullen, de dag waarop de aanvraag is aangevuld voor die beslissing geldt als datum van ontvangst van de
      aanvraag.

      2 Onze Minister kan de beslissing voor ten hoogste acht weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.3.2
