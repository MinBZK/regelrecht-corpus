  - number: 8.1.2
    text: |-
      Tenzij toepassing is gegeven aan [artikel 8.1.4][ref1], zijn de [artikelen 1.2.2][ref2], [1.2.3][ref3] en
      [1.2.4][ref4] niet van toepassing op:

      a. een wijziging of uitwerking van een bestemmingsplan, mits dat bestemmingsplan in ontwerp ter inzage is gelegd
      voor 1 januari 2010, en

      b. een herziening van een bestemmingsplan, mits dat bestemmingsplan in ontwerp ter inzage is gelegd voor 1 januari
      2010 en de herziening niet betrekking heeft op het vervangen van een in dat plan voorkomende bestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel8.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel8.1.2
