  - number: 8.1.1
    text: |-
      1 In afwijking van [artikel 1.2.3, eerste en tweede lid][ref1], mogen de in [artikel 1.2.1, eerste lid][ref2],
      bedoelde visies, plannen, besluiten en verordeningen in voorkomend geval met de daarbij behorende toelichting of
      onderbouwing die voor 1 januari 2010 in papieren vorm zijn vastgelegd en in ontwerp ter inzage zijn gelegd, na dat
      tijdstip in die vorm worden vastgesteld. In zodanig geval wordt tevens een verbeelding daarvan in elektronische
      vorm vastgesteld.

      2 Indien de inhoud van de visies, plannen, besluiten en verordeningen op papier, bedoeld in het eerste lid, en de
      inhoud van de verbeelding daarvan in elektronische vorm tot verschillende uitleg aanleiding geeft, is in afwijking
      van [artikel 1.2.3, tweede lid][ref3], de inhoud van de papieren vorm beslissend.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.3
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel8.1.1
