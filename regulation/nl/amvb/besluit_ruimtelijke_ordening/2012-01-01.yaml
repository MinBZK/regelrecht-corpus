  - number: 8.1.3
    text: |-
      Voor zover na het tijdstip van inwerkingtreding van de [wet][ref1] aan een bestemmingsplan gedeeltelijk
      goedkeuring is onthouden en voor het betrokken gedeelte een nieuw plan wordt vastgesteld, mag, in afwijking van
      de [artikelen 1.2.3][ref2] en [1.2.4][ref3] van dit besluit, binnen een jaar na het besluit omtrent goedkeuring
      het nieuwe plan worden vormgegeven, ingericht en beschikbaar gesteld op de wijze waarop het bestemmingsplan, ter
      reparatie waarvan het nieuwe plan strekt, is vormgegeven, ingericht en beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel8.1.3
    references:
