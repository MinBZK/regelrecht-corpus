  - number: 3.1.7
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de voorbereiding van bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.7
  - number: 3.2.1
    text: |-
      In een bestemmingsplan worden de volgende regels van overgangsrecht ten aanzien van bouwwerken opgenomen, met dien
      verstande dat het percentage genoemd in het tweede lid van die regeling lager kan worden vastgesteld:

      *Overgangsrecht bouwwerken*

      1. Een bouwwerk dat op het tijdstip van inwerkingtreding van het bestemmingsplan aanwezig of in uitvoering is, dan
      wel gebouwd kan worden krachtens een omgevingsvergunning voor het bouwen, en afwijkt van het plan, mag, mits deze
      afwijking naar aard en omvang niet wordt vergroot,

      a. gedeeltelijk worden vernieuwd of veranderd;

      b. na het teniet gaan ten gevolge van een calamiteit geheel worden vernieuwd of veranderd, mits de aanvraag van de
      omgevingsvergunning voor het bouwen wordt gedaan binnen twee jaar na de dag waarop het bouwwerk is teniet gegaan.

      2. Het bevoegd gezag kan eenmalig in afwijking van het eerste lid een omgevingsvergunning verlenen voor het
      vergroten van de inhoud van een bouwwerk als bedoeld in het eerste lid met maximaal 10%.

      3. Het eerste lid is niet van toepassing op bouwwerken die weliswaar bestaan op het tijdstip van inwerkingtreding
      van het plan, maar zijn gebouwd zonder vergunning en in strijd met het daarvoor geldende plan, daaronder begrepen
      de overgangsbepaling van dat plan.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.2.1
  - number: 3.2.2
    text: |-
      Behoudens voor zover uit de [Richtlijnen 79/409/EEG](31979L0409) en [92/43/EEG](31992L0043) van de Raad van
      de Europese Gemeenschappen van 2 april 1979 inzake het behoud van de vogelstand onderscheidenlijk van 21 mei
      1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna beperkingen voortvloeien
      ten aanzien van ten tijde van de inwerkingtreding van een bestemmingsplan bestaand gebruik, worden in een
      bestemmingsplan de volgende regels van overgangsrecht ten aanzien van gebruik opgenomen:

      *Overgangsrecht gebruik*

      1. Het gebruik van grond en bouwwerken dat bestond op het tijdstip van inwerkingtreding van het bestemmingsplan en
      hiermee in strijd is, mag worden voortgezet.

      2. Het is verboden het met het bestemmingsplan strijdige gebruik, bedoeld in het eerste lid, te veranderen of te
      laten veranderen in een ander met dat plan strijdig gebruik, tenzij door deze verandering de afwijking naar aard en
      omvang wordt verkleind.

      3. Indien het gebruik, bedoeld in het eerste lid, na het tijdstip van inwerkingtreding van het plan voor een
      periode langer dan een jaar wordt onderbroken, is het verboden dit gebruik daarna te hervatten of te laten
      hervatten.

      4. Het eerste lid is niet van toepassing op het gebruik dat reeds in strijd was met het voorheen geldende
      bestemmingsplan, daaronder begrepen de overgangsbepalingen van dat plan.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.2.2
  - number: 3.2.3
    text: |-
      Indien toepassing van het overeenkomstig [artikel 3.2.2][ref1] in het plan opgenomen overgangsrecht gebruik zou
      kunnen leiden tot een onbillijkheid van overwegende aard voor een of meer natuurlijke personen die op het tijdstip
      van de inwerkingtreding van het bestemmingsplan grond en opstallen gebruikten in strijd met het voordien geldende
      bestemmingsplan, kan de gemeenteraad met het oog op beëindiging op termijn van die met het bestemmingsplan
      strijdige situatie, in het plan persoonsgebonden overgangsrecht opnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel3.2.2
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.2.3
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 3.2.2
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.4
    text: |-
      In een bestemmingsplan wordt de volgende anti-dubbeltelbepaling opgenomen:

      Grond die eenmaal in aanmerking is genomen bij het toestaan van een bouwplan waaraan uitvoering is gegeven of
      alsnog kan worden gegeven, blijft bij de beoordeling van latere bouwplannen buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.2.4
  - number: 3.3.1
    text: |-
      1 Voor zover de uitvoering van de [Wet geluidhinder][ref1] zulks vereist, geeft het bestemmingsplan aan:

      a. de ligging en de afmetingen van woningen en andere geluidsgevoelige gebouwen en van geluidsgevoelige
      terreinen, die gelegen zijn binnen de zone van een weg, spoorweg of industrieterrein als bedoeld in de
      [Wet geluidhinder][ref2];

      b. de functie van de voornaamste wegen, alsmede het dwarsprofiel of het aantal rijstroken daarvan dan wel de as van
      de weg waarmee gerekend is, bedoeld in [artikel 74 van de Wet geluidhinder][ref3].

      2 Voor zover een bestemmingsplan op grond van [artikel 3.6 van de wet][ref4] moet worden uitgewerkt dan wel kan
      worden gewijzigd, kan in afwijking van het bepaalde in het eerste lid worden volstaan met het aangeven van de voor
      woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen ten hoogste toelaatbare geluidsbelasting,
      welke bij de uitwerking dan wel de wijziging van het plan in acht moet worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0003227
      - id: ref2
        bwb_id: BWBR0003227
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '74'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3.6'
  - number: 5.1.1
    text: |-
      Indien bij een beheersverordening onder het beheer van het in de verordening begrepen gebied overeenkomstig het
      bestaande gebruik mede wordt begrepen het beheer van het in de verordening begrepen gebied overeenkomstig het onder
      het voorafgaande bestemmingsplan toegestane gebruik, wordt in de beheersverordening voorzien in overgangsrecht voor
      feitelijk bestaand gebruik dat in strijd is met de verordening.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel5.1.1
  - number: 6.1.1.1
    text: |-
      In deze afdeling en de hierop berustende bepalingen wordt verstaan onder:

      a. aanvraag: aanvraag om een tegemoetkoming in de schade als bedoeld in [artikel 6.1 van de wet][ref1];

      b. bestuursorgaan: burgemeester en wethouders, of, indien toepassing is gegeven aan
      [artikel 6.6, eerste lid van de wet][ref2], gedeputeerde staten, of, indien toepassing is gegeven aan
      [artikel 6.6, tweede lid van de wet][ref3], Onze Minister dan wel Onze aangewezen Minister;

      c. adviseur: een persoon of commissie, die geen deel uitmaakt van of werkzaam is onder verantwoordelijkheid van
      het bestuursorgaan waaraan wordt geadviseerd, en die belast is met de advisering over de op de aanvraag te nemen
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.6
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.6
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.6'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6.6'
  - number: 6.1.2.1
    text: |-
      1 Burgemeester en wethouders tekenen de datum van ontvangst onverwijld aan op het geschrift waarbij de aanvraag
      is ingediend.

      2 Zij zenden de aanvrager onverwijld een bewijs van ontvangst, waarin die datum is vermeld.

      3 Zij delen de aanvrager zo spoedig mogelijk mee door welk bestuursorgaan op de aanvraag zal worden beslist.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.2.1
  - number: 6.1.2.2
    text: |-
      1 Onverminderd [artikel 4:2, eerste lid, van de Algemene wet bestuursrecht][ref1] en [artikel 6.1 van de wet][ref2]
      bevat de aanvraag:

      a. een aanduiding van de oorzaak, bedoeld in [artikel 6.1, tweede lid, van de wet][ref3], ter zake waarvan een
      tegemoetkoming in de schade wordt gevraagd;

      b. een aanduiding van de aard van de schade;

      c. een omschrijving van de wijze waarop aan de schade naar het oordeel van de aanvrager tegemoet dient te worden
      gekomen indien hij geen vergoeding in geld wenst.

      2 Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:2
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.1'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6.1'
  - number: 6.1.3.1
    text: |-
      1 Het bestuursorgaan is bevoegd de aanvraag binnen vier weken na ontvangst, onderscheidenlijk binnen acht weken
      nadat de termijn verstreken is gedurende welke de aanvrager de aanvraag kon aanvullen, af te wijzen, indien de
      aanvraag kennelijk ongegrond is.

      2 Een besluit om een onvolledige aanvraag niet, onderscheidenlijk niet verder in behandeling te nemen, wordt aan de
      aanvrager bekendgemaakt binnen vier weken na ontvangst van de aanvraag, onderscheidenlijk binnen acht weken nadat
      de termijn is verstreken gedurende welke de aanvrager de aanvraag kon aanvullen.

      3 Het bestuursorgaan kan de laatste in het tweede lid genoemde termijn eenmaal met ten hoogste vier weken
      verlengen.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.1
  - number: 6.1.3.2
    text: |-
      Het bestuursorgaan wijst een adviseur aan die een advies uitbrengt over de op de aanvraag
      te nemen beslissing, tenzij toepassing wordt gegeven aan [artikel 6.1.3.1][ref1] of aan
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel6.1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0023798
        artikel: 6.1.3.1
        hoofdstuk: '6'
        paragraaf: 6.1.3
        afdeling: '6.1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: 6.1.3.3
    text: |-
      1 Bij gemeentelijke verordening, provinciale verordening en bij regeling van Onze Minister worden regels gegeven
      over de aanwijzing van een adviseur en de wijze waarop deze tot een advies komt.

      2 De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op:

      a. de deskundigheid en onafhankelijkheid van de adviseur;

      b. de gevallen waarin een commissie als adviseur wordt ingeschakeld;

      c. het tijdstip waarop de adviseur wordt ingeschakeld;

      d. de wijze waarop de aanvrager en eventuele andere betrokken bestuursorganen of andere belanghebbenden als bedoeld
      in [artikel 6.4a, tweede en derde lid, van de wet][ref1] vooraf in de aanwijzing van de adviseur worden gekend, dan
      wel deze na aanwijzing kunnen wraken;

      e. de wijze waarop de aanvrager, de betrokken bestuursorganen en in voorkomend geval de belanghebbenden als bedoeld
      in [artikel 6.4a, tweede en derde lid, van de wet][ref2] door de adviseur, onder verslaglegging, worden gehoord en
      bij de opstelling van het advies worden betrokken, en de dienaangaande geldende termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.4a
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.4a
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: 6.4a
      - id: ref2
        bwb_id: BWBR0020449
        artikel: 6.4a
  - number: 6.1.3.4
    text: |-
      1 De adviseur betrekt in zijn onderzoek in ieder geval:

      a. de vraag of de door de aanvrager in zijn aanvraag gestelde schade een gevolg is of zal zijn van de in de
      aanvraag aangeduide schadeoorzaak;

      b. de omvang van de schade, bedoeld onder a;

      c. de vraag of deze schade redelijkerwijs geheel of gedeeltelijk ten laste van de benadeelde behoort te blijven,
      zulks met inachtneming van de [artikelen 6.1, eerste lid][ref1], [6.2][ref2] en [6.3 van de wet][ref3].

      2 De adviseur adviseert het bestuursorgaan over de hoogte van de toe te kennen tegemoetkoming en doet, indien
      het bestuursorgaan een daartoe strekkend verzoek heeft gedaan, voorstellen voor maatregelen of voorzieningen
      waardoor de schade, anders dan door een tegemoetkoming in geld, kan worden beperkt of ongedaan gemaakt. Heeft een
      schadeoorzaak als bedoeld in [artikel 6.1, tweede lid, van de wet][ref4] voor de benadeelde naast schade tevens
      voordeel opgeleverd, dan wordt dit voordeel bij het advies over de te vergoeden schade in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.1'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '6.3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '6.1'
  - number: 6.1.3.5
    text: |-
      1 De adviseur kan inlichtingen en adviezen inwinnen bij derden. Indien met het verstrekken van inlichtingen of het
      verlenen van adviezen door derden kosten gemoeid zijn, oefent de adviseur deze bevoegdheid eerst uit na instemming
      van het bestuursorgaan.

      2 De adviseur stelt zich ter plaatse op de hoogte van de situatie, tenzij naar zijn mening uit de inhoud van de
      aanvraag aanstonds blijkt dat deze behoort te worden afgewezen.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.5
  - number: 6.1.3.6
    text: |-
      1 Het bestuursorgaan beslist binnen acht weken na ontvangst van het advies op het verzoek en maakt dit besluit
      binnen deze termijn bekend aan de aanvrager.

      2 Het bestuursorgaan kan de in het eerste lid bedoelde beslissing, onder opgaaf van redenen, eenmaal voor ten
      hoogste vier weken verdagen.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.6
  - number: 6.1.3.7
    text: |-
      1 Het bestuursorgaan kent de aanvrager op diens schriftelijke aanvraag een voorschot toe indien hij naar redelijke
      verwachting in aanmerking komt voor een tegemoetkoming en zijn belang naar het oordeel van het bestuursorgaan
      zodanig voorschot vordert. Het bestuursorgaan beslist op de aanvraag, gehoord de adviseur.

      2 Een besluit tot het verlenen van een voorschot is geen erkenning van een aanspraak op een tegemoetkoming.

      3 Het voorschot kan uitsluitend worden verleend indien de aanvrager van het voorschot schriftelijk de verplichting
      aanvaardt tot gehele en onvoorwaardelijke terugbetaling van hetgeen ten onrechte als voorschot is uitbetaald, zulks
      te vermeerderen met de wettelijke rente over het teveel betaalde, te rekenen vanaf de datum van betaling van het
      voorschot. Het bestuursorgaan kan daarvoor zekerheidstelling verlangen.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.7
  - number: 6.1.3.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gegeven omtrent de behandeling en beoordeling van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.1.3.8
  - number: 6.2.1
    text: |-
      Als bouwplan als bedoeld in [artikel 6.12, eerste lid, van de wet][ref1], wordt aangewezen een bouwplan voor:

      a. de bouw van een of meer woningen;

      b. de bouw van een of meer andere hoofdgebouwen;

      c. de uitbreiding van een gebouw met ten minste 1000 m² bruto-vloeroppervlakte of met een of meer woningen;

      d. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor woondoeleinden, mits ten minste 10 woningen worden gerealiseerd;

      e. de verbouwing van een of meer aaneengesloten gebouwen die voor andere doeleinden in gebruik of ingericht waren,
      voor detailhandel, dienstverlening, kantoor of horecadoeleinden, mits de cumulatieve oppervlakte van de nieuwe
      functies ten minste 1500 m² bruto-vloeroppervlakte bedraagt;

      f. de bouw van kassen met een oppervlakte van ten minste 1000 m² bruto-vloeroppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.12
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.12'
  - number: 6.2.1a
    text: |-
      Als gevallen als bedoeld in [artikel 6.12, tweede lid, van de wet][ref1] worden aangewezen de gevallen waarin:

      a. het totaal der exploitatiebijdragen dat met toepassing van [artikel 6.19, van de wet][ref2] kan worden verhaald,
      minder bedraagt dan € 10.000,–;

      b. er geen verhaalbare kosten zijn als bedoeld in [artikel 6.2.4, onderdelen b tot en met f][ref3];

      c. de verhaalbare kosten, bedoeld in [artikel 6.2.4, onderdelen b tot en met f][ref4], uitsluitend de aansluiting
      van een bouwperceel op de openbare ruimte of de aansluiting op nutsvoorzieningen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.12
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.19
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.4
      [ref4]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.4
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.1a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.12'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6.19'
      - id: ref3
        bwb_id: BWBR0023798
        artikel: 6.2.4
        hoofdstuk: '6'
        afdeling: '6.2'
      - id: ref4
        bwb_id: BWBR0023798
        artikel: 6.2.4
        hoofdstuk: '6'
        afdeling: '6.2'
  - number: 6.2.3
    text: |-
      Tot de kosten, bedoeld in [artikel 6.13, eerste lid, onder c, ten eerste, van de wet][ref1], worden, voor zover
      deze redelijkerwijs zijn toe te rekenen aan de inbrengwaarde van de gronden, gerekend de ramingen van:

      a. de waarde van de gronden in het exploitatiegebied;

      b. de waarde van de opstallen die in verband met de exploitatie van de gronden moeten worden gesloopt;

      c. de kosten van het vrijmaken van de gronden in het exploitatiegebied van persoonlijke rechten en lasten,
      eigendom, bezit of beperkt recht en zakelijke lasten;

      d. de kosten van sloop, verwijdering en verplaatsing van opstallen, obstakels, funderingen, kabels en leidingen in
      het exploitatiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '6.13'
  - number: 6.2.4
    text: |-
      Tot de kosten, bedoeld in [artikel 6.13, eerste lid, onder c, ten tweede, van de wet][ref1], worden gerekend de
      ramingen van:

      a. de kosten van het verrichten van onderzoek, waaronder in ieder geval begrepen grondmechanisch en milieukundig
      bodemonderzoek, akoestisch onderzoek, ander milieukundig onderzoek, archeologisch en cultuurhistorisch onderzoek;

      b. de kosten van bodemsanering, het dempen van oppervlaktewateren, het verrichten van grondwerken, met inbegrip van
      het egaliseren, ophogen en afgraven;

      c. de kosten van de aanleg van voorzieningen in een exploitatiegebied;

      d. de kosten van maatregelen, plannen, besluiten en rechtshandelingen met betrekking tot gronden, opstallen,
      activiteiten en rechten in het exploitatiegebied, waaronder mede begrepen het beperken van milieuhygiënische
      contouren en externe veiligheidscontouren;

      e. de in [artikel 6.2.3][ref2] en de onder a tot en met d en g tot en met n bedoelde kosten met betrekking tot
      gronden buiten het exploitatiegebied, waaronder mede begrepen de kosten van de noodzakelijke compensatie van in het
      exploitatiegebied verloren gegane natuurwaarden, groenvoorzieningen en watervoorzieningen;

      f. de in [artikel 6.2.3][ref3] en de onder a tot en met d bedoelde kosten, voor zover deze noodzakelijk zijn in
      verband met het in exploitatie brengen van gronden die in de naaste toekomst voor bebouwing in aanmerking komen;

      g. de kosten van voorbereiding en toezicht op de uitvoering, verband houdende met de aanleg van de voorzieningen en
      werken, bedoeld onder a tot en met f, en in [artikel 6.2.3, onder c en d][ref4];

      h. de kosten van het opstellen van gemeentelijke ruimtelijke plannen ten behoeve van het exploitatiegebied;

      i. de kosten van het opzetten en begeleiden van gemeentelijke ontwerpcompetities en prijsvragen voor het
      stedenbouwkundig ontwerp van de locatie, en de kosten van vergoedingen voor deelname aan de prijsvraag;

      j. de kosten van andere door het gemeentelijk apparaat of in opdracht van de gemeente te verrichten werkzaamheden,
      voor zover deze werkzaamheden rechtstreeks verband houden met de in dit besluit bedoelde voorzieningen, werken,
      maatregelen en werkzaamheden;

      k. de kosten van tijdelijk beheer van de door of vanwege de gemeente verworven gronden, verminderd met de uit het
      tijdelijk beheer te verwachten opbrengsten;

      l. de kosten van tegemoetkoming van schade, bedoeld in [artikel 6.1 van de wet][ref5];

      m. niet-terugvorderbare BTW, niet-gecompenseerde compensabele BTW, of andere niet-terugvorderbare belastingen, over
      de kostenelementen, genoemd onder a tot en met l;

      n. rente van geïnvesteerde kapitalen en overige lasten, verminderd met renteopbrengsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.13
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.3
      [ref4]: https://wetten.overheid.nl/BWBR0023798#Artikel6.2.3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel6.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.2.4
    references:
