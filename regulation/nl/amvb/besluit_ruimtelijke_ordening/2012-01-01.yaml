articles:
  - number: 1.1.1
    text: |-
      1 In dit besluit en de hierop berustende bepalingen wordt verstaan onder:

      a. wet: [Wet ruimtelijke ordening][ref1];

      b. andere geluidsgevoelige gebouwen: andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref2];

      c. geluidsgevoelige terreinen: geluidsgevoelige terreinen als bedoeld in [artikel 1 van de Wet geluidhinder][ref3];

      d. sociale huurwoning: huurwoning met een aanvangshuurprijs onder de grens als bedoeld in
      [artikel 13, eerste lid, onder a, van de Wet op de huurtoeslag][ref4], waarbij de instandhouding voor de in een
      gemeentelijke verordening omschreven doelgroep voor ten minste tien jaar na ingebruikname is verzekerd;

      e. sociale koopwoning: koopwoning met een koopprijs vrij op naam van ten hoogste het bedrag genoemd in
      [artikel 26, tweede lid, onder g, van het Besluit beheer sociale huursector][ref5], waarbij de instandhouding voor
      de in een gemeentelijke verordening omschreven doelgroep voor een in de verordening vastgesteld tijdvak van ten
      minste een jaar en ten hoogste tien jaar na ingebruikname is verzekerd;

      f. particulier opdrachtgeverschap: situatie dat de burger of een groep van burgers – in dat laatste geval
      georganiseerd als rechtspersoon zonder winstoogmerk of krachtens een overeenkomst – tenminste de economische
      eigendom verkrijgt en volledige zeggenschap heeft over en verantwoordelijkheid draagt voor het gebruik van de
      grond, het ontwerp en de bouw van de eigen woning;

      g. geometrische plaatsbepaling: locatie van een ruimtelijk object, vastgelegd in een ruimtelijk referentiesysteem.

      2 In dit besluit en de hierop berustende bepalingen wordt onder een bestemmingsplan mede begrepen een
      inpassingsplan als bedoeld in [afdeling 3.5 van de wet][ref6].

      3 In [hoofdstuk 3][ref7] van dit besluit en de hierop berustende bepalingen wordt onder een bestemmingsplan mede
      begrepen een wijzigings- of uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de wet][ref8]
      alsmede een rijksbestemmingsplan als bedoeld in [artikel 10.3 van de wet][ref9].

      4 In dit besluit en de hierop berustende bepalingen wordt onder verbeelding op papier begrepen een verbeelding op
      duurzaam materiaal dat goed vermenigvuldigbaar is.


