  - number: 1.2.2
    text: |-
      1 Er is een landelijke voorziening waar in elektronische vorm de ruimtelijke visies, plannen, besluiten,
      verordeningen of algemene maatregelen van bestuur, genoemd in [artikel 1.2.1, eerste lid][ref1], van gemeenten,
      provincies en Rijk, voor een ieder volledig toegankelijk en raadpleegbaar zijn.

      2 Burgemeester en wethouders, gedeputeerde staten en Onze Minister of Onze Minister wie het aangaat melden aan
      de landelijke voorziening de vindplaats van de ruimtelijke visies, plannen, besluiten, verordeningen of algemene
      maatregelen van bestuur, genoemd in [artikel 1.2.1, eerste lid][ref2].

      3 Onze Minister draagt aan een of meer door hem aan te wijzen instanties het beheer op van de landelijke
      voorziening en kan daarvoor regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel1.2.2
