  - number: 6.3.6.1
    text: |-
      1 Het totale bedrag aan door Onze Minister verleende voorschotten kan niet meer bedragen dan 80 procent van het
      bedrag van de verleende subsidie.

      2 In afwijking van het eerste lid kan in naar het oordeel van Onze Minister in aanmerking komende gevallen het
      totale bedrag van de verleende voorschotten 100 procent bedragen van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.6.1
  - number: 6.3.6.2
    text: |-
      Indien de subsidieaanvrager een gemeente, een provincie of een regionaal openbaar lichaam op grond van
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] is, geldt in afwijking van [artikel 6.3.6.1][ref2]
      dat:

      a. Onze Minister in het jaar waarin de uitvoeringswerkzaamheden van het project aanvangen, een uit te keren
      jaartermijn tot maximaal 100 procent kan bevoorschotten, zo mogelijk in aansluiting op de subsidieverlening en
      vervolgens aan het begin van een jaar;

      b. de bevoorschotte bedragen in rekening-courant, bedoeld in
      [artikel 24, zesde lid, van de Comptabiliteitswet 2001][ref3] worden aangehouden bij het Ministerie van Financiën,
      tenzij dat, gelet op de omvang van de bedragen, naar het oordeel van Onze Minister van Financiën niet doelmatig is;

      c. voor het aanhouden in rekening-courant van de bevoorschotte bedragen de door Onze Minister van Financiën
      gestelde regels, bedoeld in [artikel 49a van de Comptabiliteitswet 2001][ref4], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel6.3.6.1
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0013891#Artikel49a
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel6.3.6.2
