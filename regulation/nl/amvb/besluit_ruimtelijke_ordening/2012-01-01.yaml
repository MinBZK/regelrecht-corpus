  - number: 1.3.1
    text: |-
      1 Voor zover bij de voorbereiding van een structuurvisie of een bestemmingsplan geen milieueffectrapport
      als bedoeld in [hoofdstuk 7 van de Wet milieubeheer][ref1] wordt opgesteld, geeft een bestuursorgaan dat
      voornemens is op verzoek of uit eigen beweging een structuurvisie of een bestemmingsplan, waarbij sprake is
      van ruimtelijke ontwikkelingen, voor te bereiden, kennis van dat voornemen met overeenkomstige toepassing van
      [artikel 3:12, eerste en tweede lid, van de Algemene wet bestuursrecht][ref2]. De kennisgeving geschiedt tevens
      langs elektronische weg.

      2 In de kennisgeving wordt vermeld, of:

      a. stukken betreffende het voornemen ter inzage zullen worden gelegd en waar en wanneer,

      b. er gelegenheid wordt geboden zienswijzen omtrent het voornemen naar voren te brengen, aan wie, op welke wijze en
      binnen welke termijn en

      c. een onafhankelijke instantie in de gelegenheid wordt gesteld advies uit te brengen over het voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel312
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:12
  - number: 2.1.1
    text: |-
      Bij een structuurvisie wordt aangegeven op welke wijze burgers en maatschappelijke organisaties bij de
      voorbereiding daarvan zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel2.1.1
  - number: 2.1.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorbereiding van structuurvisies.
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel2.1.2
  - number: 3.1.1
    text: |-
      1 Het bestuursorgaan dat belast is met de voorbereiding van een bestemmingsplan pleegt daarbij overleg met de
      besturen van betrokken gemeenten en waterschappen en met die diensten van provincie en Rijk die betrokken zijn bij
      de zorg voor de ruimtelijke ordening of belast zijn met de behartiging van belangen welke in het plan in het geding
      zijn. [Artikel 3:6 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.

      2 Gedeputeerde staten onderscheidenlijk Onze Minister kunnen bepalen dat onder bepaalde omstandigheden of in
      bepaalde gevallen geen overleg is vereist met de diensten van provincie onderscheidenlijk Rijk die betrokken zijn
      bij de zorg voor de ruimtelijke ordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel36
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:6
  - number: 3.1.2
    text: |-
      1 Ten behoeve van de uitvoerbaarheid kan een bestemmingsplan regels bevatten met betrekking tot sociale
      huurwoningen, sociale koopwoningen of particulier opdrachtgeverschap.

      2 Ten behoeve van een goede ruimtelijke ordening kan een bestemmingsplan regels bevatten met betrekking tot
      branches van detailhandel en horeca.

      3 Een bestemmingsplan kan voorts regels bevatten ter wering van dreigende en tot stuiting van reeds ingetreden
      achteruitgang van de woon- of werkomstandigheden in en het uiterlijk aanzien van het in het plan begrepen gebied.

      4 Indien een bestemmingsplan regels bevat ten aanzien van sociale koopwoningen kan de gemeenteraad
      na regionale afstemming een lagere koopprijsgrens vaststellen dan het bedrag, genoemd in
      [artikel 26, tweede lid, onder g, van het Besluit beheer sociale huursector][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
  - number: 3.1.3
    text: |-
      Een bestemmingsplan bevat naast de bij of krachtens de [wet][ref1] voorgeschreven bestemmingen en regels, in elk
      geval een beschrijving van die bestemmingen, waarbij per bestemming het doel of de doeleinden worden aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 3.1.4
    text: |-
      Een bestemmingsplan geeft voor een op grond van [artikel 3.6, eerste lid, onder b, van de wet][ref1] uit te
      werken deel van het plan op een zodanige wijze de doelstellingen aan, dat voldoende inzicht wordt verkregen in de
      toekomstige ontwikkeling van het desbetreffende gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.6'
  - number: 3.1.5
    text: |-
      Voorlopige bestemmingen en voorlopige regels als bedoeld in [artikel 3.2 van de wet][ref1] kunnen slechts in
      samenhang met bestemmingen en gebruiksregels als bedoeld in de [artikelen 3.1][ref2] en [3.6 van de wet][ref3]
      worden aangewezen onderscheidenlijk gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3.1'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3.6'
  - number: 3.1.6
    text: |-
      1 Een bestemmingsplan alsmede een ontwerp hiervoor gaan vergezeld van een toelichting, waarin zijn neergelegd:

      a. een verantwoording van de in het plan gemaakte keuze van bestemmingen;

      b. een beschrijving van de wijze waarop in het plan rekening is gehouden met de gevolgen voor de waterhuishouding;

      c. de uitkomsten van het in [artikel 3.1.1][ref1] bedoelde overleg;

      d. de uitkomsten van het met toepassing van [artikel 3:2 van de Algemene wet bestuursrecht][ref2] verrichte
      onderzoek;

      e. een beschrijving van de wijze waarop burgers en maatschappelijke organisaties bij de voorbereiding van het
      bestemmingsplan zijn betrokken;

      f. de inzichten over de uitvoerbaarheid van het plan.

      2 Voor zover bij de voorbereiding van het bestemmingsplan geen milieueffectrapport als bedoeld in
      [hoofdstuk 7 van de Wet milieubeheer][ref3] wordt opgesteld, waarin de hierna volgende onderdelen zijn beschreven,
      worden in de toelichting ten minste neergelegd:

      a. een beschrijving van de wijze waarop met de in het gebied aanwezige cultuurhistorische waarden en in de grond
      aanwezige of te verwachten monumenten rekening is gehouden;

      b. voor zover nodig een beschrijving van de wijze waarop rekening is gehouden met overige waarden van de in het
      plan begrepen gronden en de verhouding tot het aangrenzende gebied;

      c. een beschrijving van de wijze waarop krachtens [hoofdstuk 5 van de Wet milieubeheer][ref4] vastgestelde
      milieukwaliteitseisen bij het plan zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel3.1.6
