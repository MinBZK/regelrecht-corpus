  - number: 1.2.5
    text: |-
      1 De in [artikel 1.2.1, eerste lid][ref1], bedoelde visies, plannen, besluiten en verordeningen bevatten een
      geometrische plaatsbepaling van het werkingsgebied en de eventueel daarin aangebrachte onderscheidingen.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de bij de opstelling van de in
      [artikel 1.2.1, eerste lid][ref2], bedoelde visies, plannen, besluiten en verordeningen te hanteren standaard voor
      de geometrische plaatsbepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
    url: https://wetten.overheid.nl/BWBR0023798/2012-01-01#Artikel1.2.5
