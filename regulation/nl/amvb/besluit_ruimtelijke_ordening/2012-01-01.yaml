  - number: 8.2.1
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de visies, plannen, besluiten of
      verordeningen, bedoeld in [artikel 1.2.1, eerste lid][ref1], worden vervat in een kaart met bijbehorende verklaring
      waarop het gebied en in voorkomend geval de voorgenomen ontwikkelingen, de bestemmingen of het gebruik waarop de
      visie, het plan, het besluit of de verordening betrekking heeft, worden aangewezen.

      2 Dit artikel vervalt op het tijdstip waarop de bij ministeriële regeling, bedoeld in [artikel 1.2.5][ref2],
      gestelde regels omtrent de standaard voor de geometrische plaatsbepaling in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0023798#Artikel1.2.5
