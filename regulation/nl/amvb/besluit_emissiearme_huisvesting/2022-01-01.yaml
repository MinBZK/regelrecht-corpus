  - number: '6.2'
    text: |-
      Indien naar het oordeel van het bevoegd gezag in redelijkheid niet aan de maximale emissiewaarde kan worden
      voldaan, kan dat gezag in afwijking van de [artikelen 3][ref1] en [5][ref2] bepalen dat bij het uitbreiden van een
      emissiearm dierenverblijf in plaats van de maximale emissiewaarde uit kolom B of kolom C de maximale emissiewaarde
      uit kolom A respectievelijk kolom B van toepassing is. Dit kan uitsluitend indien bij die uitbreiding hetzelfde
      huisvestingssysteem wordt toegepast en de uitbreiding niet meer dan 50% van het bebouwde oppervlak bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0036748#Artikel3
