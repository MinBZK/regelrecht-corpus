  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op huisvestingssystemen voor landbouwhuisdieren die behoren tot een diercategorie
      die is vermeld in [bijlage 1][ref1] of [bijlage 2][ref2], en worden gehouden voor de productie van vlees, melk
      of eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0036748
      [ref2]: https://wetten.overheid.nl/BWBR0036748
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel2
    references:
