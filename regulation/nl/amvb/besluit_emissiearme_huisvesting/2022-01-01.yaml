      diercategorie vleeskalveren tot de leeftijd van circa 8 maanden dat wordt opgericht op of na 1 januari 2020 geen
      huisvestingssystemen toe met een emissiefactor voor ammoniak die hoger is dan de maximale emissiewaarde voor
      ammoniak die is vermeld in [bijlage 1][ref1], kolom C.


