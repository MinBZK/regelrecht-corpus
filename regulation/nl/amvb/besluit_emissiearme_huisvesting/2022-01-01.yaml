      Het eerste lid is niet van toepassing voor een dierenverblijf dat is opgericht op of na
      1 juli 2015 waarvoor op uiterlijk 30 juni 2015 een aanvraag omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet algemene bepalingen omgevingsrecht][ref1] is ingediend die
      voldoet aan de indieningsvereisten als bedoeld in [hoofdstuk 2 van de Regeling omgevingsrecht][ref2] waarbij
      die vergunning niet onherroepelijk is en dat is opgericht binnen 15 maanden nadat die omgevingsvergunning
      onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027471#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0027471
        hoofdstuk: '2'
  - number: '7.4'
    text: |-
      Indien naar het oordeel van het bevoegd gezag in redelijkheid niet aan de maximale emissiewaarde kan worden
      voldaan, kan dat gezag bepalen dat bij het uitbreiden van een dierenverblijf het eerste lid niet van toepassing is.
      Dit kan uitsluitend indien bij die uitbreiding hetzelfde huisvestingssysteem wordt toegepast en de uitbreiding niet
      meer dan 50% van het bebouwde oppervlak bedraagt.
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel7
  - number: '8.1'
    text: |-
      Tot 1 januari 2020 geldt voor een huisvestingssysteem dat deel uitmaakt van een dierenverblijf dat op 1 juli 2015
      aanwezig was en voldeed aan [artikel 2, eerste lid, van het Besluit ammoniakemissie huisvesting veehouderij][ref1]
      zoals dat gold op 30 juni 2015, waarvan de emissiefactor hoger is dan de maximale emissiewaarde voor ammoniak,
      bedoeld in [artikel 5, eerste lid][ref2], die emissiefactor als maximale emissiewaarde voor ammoniak.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036748#Artikel5
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel8
