      Het eerste lid, onderdeel a, geldt niet voor huisvestingssystemen die deel uitmaken van een dierenverblijf
      dat voor 1 januari 2007 is opgericht, indien de totale ammoniakemissie van de tot de inrichting behorende
      huisvestingssystemen niet hoger is dan de totale ammoniakemissie die de huisvestingssystemen op grond van het
      eerste lid, berekend op basis van de maximale emissiewaarden per afzonderlijk huisvestingssysteem, zouden mogen
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel5
