      Tot 1 januari 2020 geldt voor een op 30 juni 2015 aanwezig Groen-Labelstalsysteem, waarvan de emissiefactor voor
      ammoniak hoger is dan de maximale emissiewaarde voor ammoniak, bedoeld in [artikel 5, eerste lid][ref1], die hogere
      emissiefactor als maximale emissiewaarde voor ammoniak, voor zover voor dat huisvestingssysteem voor 8 mei 2002 een
      milieuvergunning op grond van [artikel 8.1 van de Wet milieubeheer][ref2] of, indien geen milieuvergunning vereist
      was, een bouwvergunning op grond van [artikel 40, eerste lid, van de Woningwet][ref3] is verleend.


