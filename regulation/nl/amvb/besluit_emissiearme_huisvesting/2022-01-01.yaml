        bwb_id: BWBR0036748
      - id: ref2
        bwb_id: BWBR0036748
  - number: '2.2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel2
  - number: 2.2.a
    text: vrijloopstallen voor landbouwhuisdieren van de diercategorie melk- en kalfkoeien ouder dan 2 jaar;
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel2
  - number: 2.2.b
    text: |-
      huisvestingssystemen voor landbouwhuisdieren die worden gehouden overeenkomstig de biologische productiemethode,
      met uitzondering van huisvestingssystemen voor landbouwhuisdieren van de diercategorie melk- en kalfkoeien ouder
      dan 2 jaar;
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel2
  - number: 2.2.c
    text: |-
      huisvestingssystemen waarbij landbouwhuisdieren van de diercategorieën legkippen en (groot-)ouderdieren
      van legrassen worden gehouden in aangepaste kooien als bedoeld in [artikel 2.71][ref1] of
      [artikel 2.72 van het Besluit houders van dieren][ref2];


