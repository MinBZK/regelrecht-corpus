  - number: '8.2'
    text: |-
      Tot 1 januari 2020 geldt voor huisvestingssystemen die deel uitmaken van op 30 juni 2015 binnen de
      inrichting aanwezige dierenverblijven die niet voldoen aan [artikel 5, tweede lid][ref1], en wel voldeden
      aan [artikel 2, tweede lid, van het Besluit ammoniakemissie huisvesting veehouderij][ref2] zoals dat gold op
      30 juni 2015, artikel 2, tweede lid, van voornoemd besluit, voor zover er geen oprichting van een dierenverblijf
      plaatsvindt.


