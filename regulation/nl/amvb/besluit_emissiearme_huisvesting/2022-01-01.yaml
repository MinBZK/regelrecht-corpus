      bouwvergunning op grond van [artikel 40, eerste lid, van de Woningwet][ref2], is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel40
