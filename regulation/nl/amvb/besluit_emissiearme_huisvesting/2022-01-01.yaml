articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *ammoniakemissie:* emissie van ammoniak, uitgedrukt in kg NH per jaar;
        - *bijlage:* bij dit besluit behorende bijlage;
        - *diercategorie:* in de [bijlagen][ref1] gehanteerde aanduiding, binnen hoofdcategorieën, van landbouwhuisdieren;
        - *biologische productiemethode:* biologische productiemethode als bedoeld in Verordening (EG) nr. 834/2007 van
      de Raad van 28 juni 2007 inzake de biologische productie en de etikettering van biologische producten en tot
      intrekking van Verordening (EEG) nr. 2092/91 (PbEU L 189);
        - *dierenverblijf:* al dan niet overdekte ruimte voor het houden van landbouwhuisdieren;
        - *dierplaats:* deel van een huisvestingssysteem, bestemd voor het houden van één landbouwhuisdier;
        - *emissiearm dierenverblijf:* dierenverblijf met een huisvestingssysteem waarvoor in [bijlage 1][ref2] een
      maximale emissiewaarde voor ammoniak is opgenomen en waarvan de emissiefactor voor ammoniak lager is dan de
      emissiefactor voor ammoniak voor overige huisvestingssystemen;
        - *emissie van zwevende deeltjes (PM):* emissie van zwevende deeltjes (PM), uitgedrukt in gram PM per jaar;
        - *emissiefactor voor ammoniak:* emissiefactor als bedoeld in [artikel 1 van de Wet ammoniak en veehouderij][ref3];
        - *emissiefactor voor zwevende deeltjes (PM):* emissie van zwevende deeltjes (PM), uitgedrukt in gram per
      dierplaats per jaar, vastgesteld op grond van [artikel 5.20, eerste lid, van de Wet milieubeheer][ref4];
        - *Groen-Labelstalsysteem:* huisvestingssysteem dat voldoet aan de omschrijving van een stalsysteem waarvoor een
      Groen label als bedoeld in artikel 1, eerste lid, onder a, van het Convenant Groen Label (Stcrt. 1993, 21) is
      verleend;
        - *huisvestingssysteem:* gedeelte van een dierenverblijf, waarin landbouwhuisdieren van één diercategorie op
      dezelfde wijze worden gehouden;
        - *IPPC-installatie:* IPPC-installatie als bedoeld in
      [artikel 1.1 van de Wet algemene bepalingen omgevingsrecht][ref5];
        - *maximale emissiewaarde voor ammoniak:* waarde van de ammoniakemissie per dierplaats, uitgedrukt in kg NH per
      jaar, die voor een huisvestingssysteem is opgenomen in [bijlage 1][ref6];
        - *maximale emissiewaarde voor zwevende deeltjes (PM):* waarde van de emissie van zwevende deeltjes (PM10) per
      dierplaats, uitgedrukt in PM per jaar, die voor een huisvestingssysteem is opgenomen in [bijlage 2][ref7];
        - *oprichting van een dierenverblijf:* oprichting, vervanging of uitbreiding van een dierenverblijf;
        - *vrijloopstal:* huisvestingssysteem voor melk- en kalfkoeien ouder dan 2 jaar zonder ligboxen en voorzien van een
      zachte, vochtdoorlatende of absorberende bodem, waarbij het totale oppervlak ten minste het aantal dieren maal 10
      vierkante meter bedraagt;
        - *zwevende deeltjes (PM):* zwevende deeltjes (PM) als bedoeld in
      [artikel 5.7, eerste lid, van de Wet milieubeheer][ref8].


