      gehouden volgens de biologische productiemethode;
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel3
  - number: 3.1.a.2
    text: een dierenverblijf dat is opgericht op uiterlijk 1 april 2008;
    url: https://wetten.overheid.nl/BWBR0036748/2022-01-01#Artikel3
  - number: 3.1.a.3
    text: |-
      een dierenverblijf dat is opgericht na 1 april 2008 en waarvoor op uiterlijk 31 maart 2008 een milieuvergunning
