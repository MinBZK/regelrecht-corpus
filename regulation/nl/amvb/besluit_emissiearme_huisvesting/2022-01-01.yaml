      de diercategorie melk- en kalfkoeien ouder dan 2 jaar geen huisvestingssystemen toe met een emissiefactor voor
      ammoniak die hoger is dan de maximale emissiewaarde voor ammoniak die is vermeld in [bijlage 1][ref1], waarbij de
      maximale emissiewaarde in:


      [ref1]: https://wetten.overheid.nl/BWBR0036748
