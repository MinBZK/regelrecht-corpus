$id: besluit_bestrijding_schadelijke_organismen
regulatory_layer: AMVB
publication_date: '2020-02-19'
valid_from: '2015-01-01'
bwb_id: BWBR0005206
url: https://wetten.overheid.nl/BWBR0005206/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 7 januari 1991, No. J. 9017757,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op artikel 3, eerste lid, van de Plantenziektenwet (Stb. 1951, 96);

    Gehoord het Landbouwschap, het Hoofdproduktschap voor Akkerbouwprodukten, het Produktschap voor Siergewassen, het
    Produktschap voor Groenten en Fruit, de Stichting Bloembollenkeuringsdienst en de Pootaardappel Contactcommissie;

    De Raad van State gehoord (advies van 10 juni 1991, No. W11.91.0020);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 12 augustus 1991, No.
    J. 9110143, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: 1.a
    text: |-
      partij: hoeveelheid planten of plantaardige produkten, al dan niet met aanhangende grond of andere cultuurmedia, of
      resten daarvan of afval van deze planten of plantaardige produkten;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      behandelen: toepassen van middelen of methoden ter voorkoming van het optreden of van de verbreiding van
      schadelijke organismen of ter bestrijding daarvan;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      een door schadelijk organisme aangetaste partij: een partij waarop of waarin op enigerlei wijze een schadelijk
      organisme voorkomt;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: 1.d
    text: |-
      *aardappelcysteaaltje:* Globodera pallida (Stone) Behrens (Europese populaties) of Globodera rostochiensis
      (Wollenweber) Behrens (Europese populaties);
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: 1.e
    text: |-
      *perceel:* ononderbroken grondoppervlak, waarvan de locatie en de grootte op basis van de uitkomsten van onderzoek
      naar de aanwezigheid van het aardappelcysteaaltje door Onze Minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel1
  - number: '2'
    text: |-
      Het is de eigenaar of houder van een partij aan wie door Onze Minister is medegedeeld, dat een nader onderzoek
      naar de aanwezigheid van schadelijke organismen in of op die partij zal plaatsvinden, tot de uitslag van het nader
      onderzoek aan hem is medegedeeld, verboden:
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel2
  - number: 2.a
    text: planten van deze partij te oogsten of te rooien, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel2
  - number: 2.b
    text: |-
      deze partij geheel of gedeeltelijk te verhandelen, te verplaatsen, te vervoeren, te bewerken, te behandelen dan wel
      te vernietigen of anderszins onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel2
  - number: 2.c
    text: |-
      het voor deze partij gebruikte verpakkingsmateriaal te verplaatsen, te vervoeren, te bewerken, te behandelen dan
      wel te vernietigen of anderszins onschadelijk te maken,
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      De eigenaar of houder van een partij, aan wie door Onze Minister is medegedeeld, dat die partij geheel of
      gedeeltelijk door een schadelijk organisme is aangetast of verdacht wordt daardoor te zijn aangetast, is verplicht
      overeenkomstig de hem door Onze Minister gedane aanzegging, op de daarbij voorgeschreven wijze en binnen dan wel
      gedurende de daarbij gestelde termijn:
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel3
  - number: 3.1.a
    text: de planten van deze partij te oogsten of te rooien;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel3
  - number: 3.1.b
    text: de planten of plantaardige produkten van deze partij een door Onze Minister bepaalde bestemming te geven, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel3
  - number: 3.1.c
    text: |-
      deze partij, het daarvoor gebruikte verpakkingsmateriaal of de schadelijke organismen afkomstig van deze partij
      te bewaren, te verplaatsen, te vervoeren, te bewerken, te behandelen of te vernietigen of anderszins onschadelijk
      te maken.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      De eigenaar of houder van de partij, bedoeld in het eerste lid, is verplicht de partij, voor zover deze niet te
      velde staat, alsmede het daarvoor gebruikte verpakkingsmateriaal, als één geheel en duidelijk afgescheiden van
      andere partijen opgeslagen te houden, totdat aan de aanzegging gevolg wordt gegeven of een toestemming als bedoeld
      in [artikel 4, tweede lid][ref1], is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel4
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '4'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Het is de eigenaar of houder van de partij, bedoeld in [artikel 3][ref1], totdat gevolg is gegeven aan een
      aanzegging als bedoeld in [artikel 3][ref2], verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel3
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.a
    text: planten van de partij te oogsten of te rooien;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de partij geheel of gedeeltelijk dan wel het voor deze partij gebruikte verpakkingsmateriaal te verhandelen, te
      verplaatsen, te vervoeren, te bewerken, te behandelen, te vernietigen of anderszins onschadelijk te maken of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: 4.1.c
    text: planten te gaan telen in de ruimte waar de partij zich bevindt.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: '4.2'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: 4.2.a
    text: |-
      door Onze Minister toestemming tot de in het eerste lid genoemde handelingen is verleend en de daarbij gegeven
      aanwijzingen worden opgevolgd of,
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: 4.2.b
    text: de in het eerste lid genoemde handelingen verplicht zijn gesteld ingevolge een aanzegging als bedoeld in artikel 3.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel4
  - number: '5'
    text: |-
      De eigenaar of houder van ruimten, installaties, transportmiddelen, werktuigen, gereedschappen, materialen of
      andere voorwerpen die kunnen zijn of worden gebruikt voor de partij, bedoeld in [artikel 3][ref1], is verplicht,
      overeenkomstig de hem door Onze Minister gedane aanzegging, op de daarbij voorgeschreven wijze en binnen de daarbij
      gestelde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel3
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
  - number: 5.a
    text: |-
      de ruimten te reinigen, te ontsmetten of daarin of daaraan door Onze Minister voorgeschreven voorzieningen te
      treffen;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel5
  - number: 5.b
    text: de installaties, transportmiddelen, werktuigen of gereedschappen te reinigen of te ontsmetten, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel5
  - number: 5.c
    text: de gebruikte materialen of andere voorwerpen te reinigen, te ontsmetten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het is de eigenaar of houder van de ruimten, installaties, transportmiddelen, werktuigen, gereedschappen,
      materialen of andere voorwerpen, bedoeld in [artikel 5][ref1], totdat gevolg is gegeven aan een aanzegging als
      bedoeld in [artikel 5][ref2] verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel5
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '5'
        paragraaf: '2'
  - number: 6.1.a
    text: voor zover het betreft ruimten, planten te gaan telen in de ruimte, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de betreffende ruimten, installaties, transportmiddelen, werktuigen, gereedschappen, materialen of andere
      voorwerpen te gebruiken ten behoeve van een andere partij dan de partij, bedoeld in artikel 5.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet indien door Onze Minister toestemming tot de in het eerste lid
      genoemde handelingen is verleend en de daarbij gegeven aanwijzingen worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel6
  - number: '7'
    text: |-
      Het is de eigenaar of houder van door Onze Minister aangewezen planten verboden bloemen van de betrokken planten
      te verwijderen, tenzij daartoe door Onze Minister toestemming is verleend en de daarbij gegeven aanwijzingen worden
      opgevolgd.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel7
  - number: '8'
    text: |-
      Het is de eigenaar of houder van een terrein, perceel of ruimte aan wie door Onze Minister is medegedeeld, dat een
      nader onderzoek naar de aanwezigheid van schadelijke organismen op of in grond of andere cultuurmedia en resten
      daarvan op diens terrein, perceel of in diens ruimte zal plaatsvinden, totdat de uitslag van het nader onderzoek
      aan hem is medegedeeld, verboden:
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel8
  - number: 8.a
    text: |-
      deze grond of andere cultuurmedia en resten daarvan te verhandelen, te verplaatsen, te vervoeren, te bewerken, te
      behandelen, te vernietigen of anderszins onschadelijk te maken.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel8
  - number: 8.b
    text: materialen waarin deze zijn verpakt of zijn verpakt geweest te reinigen, te ontsmetten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel8
  - number: '9'
    text: |-
      De eigenaar of houder van een terrein, perceel of ruimte, aan wie door Onze Minister is medegedeeld dat zich op
      diens terrein, perceel of in diens ruimte grond of andere cultuurmedia en resten daarvan of materialen bevinden die
      zijn besmet door een schadelijk organisme of verdacht worden daarvoor te zijn besmet, is verplicht overeenkomstig
      de hem door Onze Minister gedane aanzegging, op de daarbij voorgeschreven wijze en binnen dan wel gedurende de
      daarbij gestelde termijn:
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel9
  - number: 9.a
    text: |-
      de grond of andere cultuurmedia en resten daarvan te verplaatsen, te vervoeren, te bewerken, te behandelen, te
      vernietigen of anderszins onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel9
  - number: 9.b
    text: |-
      de planten op of in de grond of andere cultuurmedia te oogsten, te rooien, te bewaren, te verplaatsen, te
      vervoeren, te bewerken, te behandelen, te vernietigen of anderszins onschadelijk te maken;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel9
  - number: 9.c
    text: |-
      de ruimte te reinigen, te ontsmetten of daarin of daaraan de door Onze Minister voorgeschreven voorzieningen te
      treffen, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel9
  - number: 9.d
    text: |-
      de voor de grond of andere cultuurmedia en resten daarvan gebruikte materialen te reinigen, te ontsmetten of te
      vernietigen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het is de eigenaar of houder van het terrein, perceel of de ruimte, bedoeld in [artikel 9][ref1], totdat gevolg is
      gegeven aan een aanzegging als bedoeld in [artikel 9][ref2] verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel9
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '9'
        paragraaf: '3'
  - number: 10.1.a
    text: |-
      grond of andere cultuurmedia en resten daarvan, bedoeld in artikel 9, te verhandelen, te verplaatsen, te vervoeren,
      te bewerken of te behandelen, te vernietigen of anderszins onschadelijk te maken, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
  - number: 10.1.b
    text: planten te gaan telen in de ruimte waar de besmette grond of cultuurmedia en resten daarvan zich bevinden.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
  - number: '10.2'
    text: 'Het in het eerste lid genoemde verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
  - number: 10.2.a
    text: |-
      door Onze Minister toestemming tot de in het eerste lid genoemde handelingen is verleend en de daarbij gegeven
      aanwijzingen worden opgevolgd, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
  - number: 10.2.b
    text: |-
      de in het eerste lid genoemde handelingen verplicht zijn gesteld ingevolge een aanzegging als bedoeld
      in[ artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel9
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel10
    references:
      - id: ref1
