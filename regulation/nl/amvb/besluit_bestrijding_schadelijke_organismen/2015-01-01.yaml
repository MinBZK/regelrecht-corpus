  - number: '11'
    text: |-
      De eigenaar of houder van ruimten, installaties, transportmiddelen, werktuigen, gereedschappen, materialen of
      andere voorwerpen die kunnen zijn of worden gebruikt ten behoeve van de grond of andere cultuurmedia, bedoeld
      in [artikel 9][ref1], is verplicht, overeenkomstig de hem door Onze Minister gedane aanzegging, op de daarbij
      voorgeschreven wijze en binnen de daarbij gestelde termijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel9
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel11
    references:
      - id: ref1
