        artikel: '9'
        paragraaf: '3'
  - number: 11.a
    text: |-
      de ruimte te reinigen, te ontsmetten of daarin of daaraan de door Onze Minister voorgeschreven voorzieningen te
      treffen;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel11
  - number: 11.b
    text: de installaties, transportmiddelen, werktuigen of gereedschappen te reinigen of te ontsmetten, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel11
  - number: 11.c
    text: de gebruikte materialen of andere voorwerpen te reinigen, te ontsmetten of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het is de eigenaar of houder van de ruimten, installaties, transportmiddelen, werktuigen, gereedschappen,
      materialen of andere voorwerpen, bedoeld in [artikel 11][ref1], totdat gevolg is gegeven aan een aanzegging als
