  - number: 12.1.a
    text: voor zover het betreft ruimten, planten te gaan telen in de ruimte of,
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12
  - number: 12.1.b
    text: |-
      de betreffende ruimten, installaties, transportmiddelen, werktuigen, gereedschappen, materialen of andere
      voorwerpen te gebruiken voor andere grond of andere cultuurmedia dan de grond of andere cultuurmedia, bedoeld in
      [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel11
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '11'
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet indien door Onze Minister toestemming tot de in het eerste lid
      genoemde handelingen is verleend en de daarbij gegeven aanwijzingen worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12
  - number: 12a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de omstandigheden die van belang zijn voor en
      criteria die worden gehanteerd bij de vaststelling, bedoeld in [artikel 1, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel1
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '1'
        paragraaf: '1'
  - number: 12b.1
    text: |-
      Het is verboden door Onze Minister aangewezen planten te telen of te bewaren op grond waarvoor de
      gebruiksgerechtigde niet in het bezit is van een door Onze Minister, na officieel onderzoek overeenkomstig
      Richtlijn 2007/33/EG van de Raad van de Europese Unie van 11 juni 2007 betreffende de bestrijding van het
      aardappelcysteaaltje en houdende intrekking van Richtlijn 69/465/EEG (PbEU L 156), afgegeven verklaring, waaruit
      blijkt dat het perceel vrij is of wordt geacht te zijn van besmetting met het aardappelcysteaaltje.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12b
  - number: 12b.2
    text: |-
      Het eerste lid is niet van toepassing in bij ministeriële regeling te bepalen gevallen en onder bij ministeriële
      regeling te bepalen voorwaarden, indien geen aanwijsbaar risico bestaat op de aanwezigheid of verspreiding van
      het aardappelcysteaaltje.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12b
  - number: 12b.3
    text: De verklaring kan onder beperkende voorwaarden worden verleend en te allen tijde worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12b
  - number: '13'
    text: |-
      De eigenaar of houder van een ruimte, aan wie door Onze Minister is medegedeeld dat zich in diens ruimte een
      schadelijk organisme bevindt, is verplicht overeenkomstig de hem door Onze Minister gedane aanzegging, op de
      daarbij voorgeschreven wijze en binnen de daarvoor gestelde termijn de ruimte te reinigen, te ontsmetten of daarin
      of daaraan de door Onze Minister voorgeschreven voorzieningen te treffen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister kan, ter voorkoming van het optreden en de verbreiding van schadelijke organismen en ter bestrijding
      daarvan regels stellen omtrent:
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.a
    text: het toepassen van ontsmettingsmaatregelen door personen die terreinen of ruimten betreden of verlaten;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.b
    text: het voor de teelt van planten te gebruiken of gebruikt water;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.c
    text: het treffen van voorzieningen in of aan ruimten;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.d
    text: |-
      het oogsten of rooien, bewaren, voorhanden of in voorraad hebben, verhandelen, verplaatsen, vervoeren, zich ontdoen
      van of vernietigen, bewerken en behandelen van een partij;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.e
    text: het telen van planten;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.f
    text: |-
      het verschaffen van informatie aan derden omtrent de aanwezigheid van een schadelijk organisme op een terrein of
      perceel;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.g
    text: |-
      het verschaffen van informatie aan Onze Minister omtrent de overdracht van de eigendom dan wel het gebruik van een
      terrein of perceel waar zich een schadelijk organisme bevindt;
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: 14.h
    text: het houden en bewaren van een administratie door degene die een terrein of perceel in gebruik heeft.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel14
  - number: '15.1'
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel15
  - number: 15.1.a
    text: |-
      een partij als bedoeld in de [artikelen 2][ref1] en [3][ref2] kenmerken of onder verzegeling brengen, of


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel3
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
  - number: 15.1.b
    text: |-
      verpakkingsmateriaal als bedoeld in de [artikelen 3][ref1] en[ 4 ][ref2]kenmerken of onder verzegeling brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel4
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '4'
        paragraaf: '2'
  - number: 15.1.c
    text: |-
      materialen als bedoeld in de artikelen [8][ref1], [9][ref2], [10][ref3] en [11][ref4] kenmerken of onder
      verzegeling brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005206#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005206#Artikel11
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005206
        artikel: '10'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005206
        artikel: '11'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      Het is anderen dan de ambtenaren, bedoeld in [artikel 10 van de Plantenziektenwet][ref1], verboden de kenmerken en
      zegels, bedoeld in het eerste lid, te verwijderen, behoudens toestemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel10
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '10'
  - number: '16'
    text: |-
      Een ieder die verschijnselen van aantasting van planten of plantaardige produkten door schadelijke
      organismen, aangewezen door Onze Minister, waarneemt is verplicht deze verschijnselen onverwijld te
      melden bij een door Onze Minister aangewezen ambtenaar, dan wel een door Onze Minister, op grond van
      [artikel 9 van de Plantenziektenwet][ref1] (*Stb.* 1951, 96) aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel9
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '9'
  - number: '17.1'
    text: |-
      Indien in een gebied, op een terrein, perceel of in een ruimte de aanwezigheid van een door
      Onze Minister aangewezen schadelijk organisme is aangetoond of wordt vermoed, kan Onze Minister
      met betrekking tot dat gebied, dat terrein, perceel of die ruimte regels stellen als bedoeld in
      [artikel 3, eerste lid, van de Plantenziektenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002075#Artikel3
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002075
        artikel: '3'
  - number: '17.2'
    text: 'Krachtens het eerste lid kunnen worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel17
  - number: 17.2.a
    text: schadelijke organismen die de teelt en afzet van planten nadelig kunnen beïnvloeden, of
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel17
  - number: 17.2.b
    text: |-
      planten die gevaar kunnen opleveren voor de vermeerdering of de verspreiding van de krachtens het eerste lid
      aangewezen schadelijke organismen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel17
  - number: '18.1'
    text: |-
      Het is verboden om door Onze Minister aangewezen schadelijke organismen, die een ernstig gevaar kunnen opleveren
      voor de teelt van planten, opzettelijk voorhanden of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het bepaalde in het eerste lid geldt niet voor die instellingen die in het bezit zijn van een door Onze Minister
      verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel18
  - number: '18.3'
    text: |-
      Een vergunning als bedoeld in het tweede lid, wordt verleend indien in een instelling de noodzakelijke
      voorzieningen zijn getroffen ter voorkoming van de verbreiding van schadelijke organismen, bedoeld in het eerste
      lid. Een vergunning dient te worden aangevraagd bij Onze Minister. Aan een vergunning kunnen voorschriften worden
      verbonden. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel18
  - number: '19.1'
    text: Onze Minister kan van het bij of krachtens dit besluit bepaalde vrijstelling of ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel19
  - number: '19.2'
    text: |-
      Aan een vrijstelling of ontheffing kunnen voorschriften worden verbonden. Zij kan onder beperkingen worden
      verleend. Zij kan te allen tijde geheel of gedeeltelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel19
  - number: '20.1'
    text: |-
      Aanzeggingen gedaan krachtens het bepaalde in de artikelen 3, 5 en 8 van het Besluit bestrijding schadelijke
      organismen 1959 (*Stb.* 368), worden geacht te zijn gegeven op grond van het bepaalde onderscheidenlijk in
      [de artikelen 3][ref1] en [9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel9
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '9'
        paragraaf: '3'
  - number: '20.2'
    text: |-
      Toestemmingen verleend krachtens het bepaalde in de artikelen 4, 6 en 8, tweede lid, van het Besluit bestrijding
      schadelijke organismen 1959, worden geacht te zijn gegeven op grond van het bepaalde onderscheidenlijk in
      [de artikelen 4, tweede lid][ref1], [9][ref2] en [10, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005206#Artikel10
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005206
        artikel: '10'
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Aanwijzingen gedaan op grond van artikel 9 van het Besluit bestrijding schadelijke organismen 1959 en nog van
      kracht bij het in werking treden van dit besluit, worden geacht te zijn gegeven op grond van [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel17
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '17'
        paragraaf: '4'
  - number: '20.4'
    text: |-
      Na de inwerkingtreding van dit besluit worden de teeltverboden vastgesteld op grond van artikel 9 van het Besluit
      bestrijding schadelijke organismen 1959 en nog van kracht bij de inwerkingtreding van dit besluit geacht te zijn
      gegeven op grond van [artikel 17][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel17
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '17'
        paragraaf: '4'
  - number: '20.5'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de regeling teeltverboden knolcyperus (*Stcrt.* 1985, 79) en de
      Regeling teeltverboden stengelaaltje (*Stcrt.* 1989, 95) op [artikel 17][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel17
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '17'
        paragraaf: '4'
  - number: '20.6'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling aanwijzing schadelijke organismen 1984 (*Stcrt.* 248) op
      [artikel 18][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel18
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '18'
        paragraaf: '4'
  - number: '20.7'
    text: |-
      Vrijstellingen en ontheffingen verleend op grond van artikel 10 van het Besluit bestrijding schadelijke organismen
      1959 en nog van kracht bij het in werking treden van dit besluit, worden geacht te zijn gegeven op grond van
      [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel19
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '19'
        paragraaf: '4'
  - number: '20.8'
    text: |-
      Verklaringen afgegeven krachtens [artikel 5 van het Besluit bestrijding aardappelmoeheid 1991][ref1], die nog
      van kracht zijn op het tijdstip van inwerkingtreding van het Besluit van 17 juni 2010, houdende wijziging van het
      Besluit bestrijding schadelijke organismen en intrekking van het Besluit bestrijding aardappelmoeheid 1991, in
      verband met de implementatie van Richtlijn 2007/33/EG van de Raad van de Europese Unie van 11 juni 2007 betreffende
      de bestrijding van het aardappelcysteaaltje en houdende intrekking van Richtlijn 69/465/EEG (PbEU L 156), worden
      geacht te zijn afgegeven op grond van [artikel 12b][ref2] en zijn, tenzij ze voortijdig worden ingetrokken of de
      geldigheid verstrijkt, geldig tot en met het moment dat op het voor de verklaring relevante perceel voor de eerste
      maal door Onze Minister op grond van artikel 12b aangewezen planten worden geteeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005234
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: 12b
        paragraaf: 3a
  - number: '20.9'
    text: |-
      Aanwijzingen van terreinen gedaan krachtens [artikel 6 van het Besluit bestrijding aardappelmoeheid 1991][ref1],
      die nog van kracht zijn op het tijdstip van inwerkingtreding van het Besluit van 17 juni 2010, houdende wijziging
      van het Besluit bestrijding schadelijke organismen en intrekking van het Besluit bestrijding aardappelmoeheid
      1991 in verband met de implementatie van Richtlijn 2007/33/EG van de Raad van de Europese Unie van 11 juni 2007
      betreffende de bestrijding van het aardappelcysteaaltje en houdende intrekking van Richtlijn 69/465/EEG (PbEU L
      156), worden geacht te zijn gedaan op grond van het bepaalde bij of krachtens [artikel 17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005234#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel17
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005234
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '17'
        paragraaf: '4'
  - number: '21.1'
    text: 'De volgende besluiten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: 21.1.a
    text: Het Besluit bestrijding schadelijke organismen 1959 (*Stb.* 1959, 368);
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: 21.1.b
    text: Het Kersenvliegbesluit (*Stb.* 1955, 243);
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: 21.1.c
    text: Het Besluit bestrijding Aspergevlieg (*Stb.* 1958, 224);
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: 21.1.d
    text: Het Besluit wering schadelijke organismen bij invoer van planten 1971 (*Stb.* 346);
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: 21.1.e
    text: Het Besluit bestrijding iepeziekte (*Stb.* 1977, 445).
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: '21.2'
    text: .
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel21
  - number: '22'
    text: |-
      Dit besluit treedt in werking met ingang van de datum van inwerkingtreding van de wet van 23 februari 1987 houdende
      wijziging van de Planten[ziektewet][ref1] (*Stb.* 1951, 96).


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '23'
    text: Dit besluit kan worden aangehaald als Besluit bestrijding schadelijke organismen.
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel23
