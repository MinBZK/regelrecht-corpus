      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel11
    url: https://wetten.overheid.nl/BWBR0005206/2015-01-01#Artikel12
    references:
