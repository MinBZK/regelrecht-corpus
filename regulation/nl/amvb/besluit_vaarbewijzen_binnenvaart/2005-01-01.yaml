        bwb_id: BWBR0003443
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0003443
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0003443
        artikel: '49'
      - id: ref6
        bwb_id: BWBR0003443
        artikel: '51'
      - id: ref7
        bwb_id: BWBR0003443
        artikel: '52'
      - id: ref8
        bwb_id: BWBR0003443
        artikel: '55'
      - id: ref9
        bwb_id: BWBR0003443
        artikel: '56'
  - number: '2'
    text: 'De door Onze Minister af te geven vaarbewijzen zijn:'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel2
  - number: 2.a
    text: het klein vaarbewijs voor de vaart op de rivieren, kanalen en meren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel2
  - number: 2.b
    text: het klein vaarbewijs voor de vaart op alle binnenwateren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel2
  - number: 2.c
    text: het groot vaarbewijs voor de vaart op de rivieren, kanalen en meren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel2
  - number: 2.d
    text: het groot vaarbewijs voor de vaart op alle binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel2
  - number: '3.1'
    text: Een aanvraag tot afgifte van een vaarbewijs wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: '3.2'
    text: 'Bij de aanvraag worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de geneeskundige verklaring, niet ouder dan drie maanden, of een eigen verklaring op grond van [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
        paragraaf: '3'
  - number: 3.2.b
    text: |-
      het getuigschrift dat betrekking heeft op het examen voor het verlangde vaarbewijs of een bewijs van bekwaamheid
      voor de binnenvaart dat door Onze Minister is erkend;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: 3.2.c
    text: |-
      een een gewaarmerkt afschrift van gegevens uit de basisadministratie persoonsgegevens, of enig ander bewijsstuk
      betreffende naam en geboortedatum van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: 3.2.d
    text: |-
      twee goedgelijkende pasfoto’s van de aanvrager, aan de achterkant voorzien van zijn naam, voorletters en
      geboortedatum;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: 3.2.e
    text: een bewijs van betaling van het bedrag dat verschuldigd is voor de behandeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: '3.3'
    text: |-
      In geval van ongeldigheid van het vaarbewijs mag geen gebruik worden gemaakt van een eerder overgelegd
      getuigschrift of erkend bewijs van vaarbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel3
  - number: '4'
    text: |-
      In plaats van een document als bedoeld in [artikel 3, tweede lid, onderdeel b][ref1], kan worden overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel3
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '3'
        paragraaf: '2'
  - number: 4.a
    text: een gelijkwaardig geldig vaarbewijs, of
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel4
  - number: 4.b
    text: een gelijkwaardig vaarbewijs dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel4
  - number: '5.1'
    text: |-
      De aanvrager die op grond van omstandigheden, bedoeld in [artikel 55, eerste lid, van de Binnenschepenwet][ref1],
      om afgifte van een vaarbewijs verzoekt, dient die omstandigheden aannemelijk te hebben gemaakt ter beoordeling van
      de Directeur-Generaal Scheepvaart en Maritieme Zaken van het Ministerie van Verkeer en Waterstaat en zijn aanvraag
      uiterlijk 1 oktober 1983 te hebben ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel55
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '55'
  - number: '5.2'
    text: |-
      Hij dient tevens de bescheiden te hebben overgelegd, bedoeld in [artikel 3, tweede lid, onder c, d en e][ref1], en
      een eigen verklaring indien hij op het moment van de aanvraag 65 jaar of ouder was.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel3
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '3'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Het geneeskundig onderzoek ter afgifte van de geneeskundige verklaring heeft betrekking op de lichamelijke en
      geestelijke toestand van de aanvrager in het algemeen en in het bijzonder op:
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: 6.1.a
    text: de gezichtsscherpte en het kleuronderscheidingsvermogen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: 6.1.b
    text: de gehoorscherpte;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: 6.1.c
    text: de toestand van het hart en de longen, de bloeddruk;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: 6.1.d
    text: het functioneren van armen en benen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: 6.1.e
    text: de neurologische en psychische gesteldheid.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: '6.2'
    text: Tevens wordt onderzocht of zich afwijkingen voordoen die het veilig varen nadelig kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het geneeskundig onderzoek en de afgifte van de geneeskundige verklaring geschieden met inachtneming van de bij
      regeling van Onze Minister vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel6
  - number: '7.1'
    text: 'In plaats van de geneeskundige verklaring kan een eigen verklaring worden overgelegd door:'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: 7.1.a
    text: de aanvrager van het klein vaarbewijs;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: 7.1.b
    text: |-
      de aanvrager van het groot vaarbewijs voor de vaart op alle binnenwateren, die de 50-jarige leeftijd nog niet heeft
      bereikt en reeds in het bezit is van een geldig groot vaarbewijs voor de vaart op de rivieren, kanalen en meren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de aanvrager die niet langer niet langer dan drie maanden voor het indienen van de aanvraag met gunstig gevolg
      een onderzoek heeft ondergaan omtrent het voldoen aan geneeskundige eisen, welke gelden voor schippers van
      rijksvaartuigen, voor loodsen, voor Rijnschippers of voor personen aan wie aan boord van zeeschepen de wacht of het
      houden van uitkijk kan worden opgedragen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: 7.1.d
    text: |-
      de aanvrager die niet langer dan drie maanden voor het indienen van de aanvraag met gunstig gevolg een onderzoek
      heeft ondergaan omtrent het voldoen aan geneeskundige eisen in andere gevallen dan [onder ][ref1] bedoeld, welke
      eisen naar het oordeel van Onze Minister - gehoord een in [artikel 21, tweede lid, van de Binnenschepenwet][ref2]
      bedoelde deskundige - in voldoende mate betrekking hebben op de in [artikel 6, eerste lid][ref3], genoemde
      onderwerpen;


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003526#Artikel6
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0003526
        artikel: '6'
        paragraaf: '3'
  - number: 7.1.e
    text: |-
      de aanvrager die bij toepassing van [artikel 55, vierde lid, van de Binnenschepenwet][ref1] 65 jaar of ouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel55
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '55'
  - number: '7.2'
    text: |-
      De eigen verklaring heeft betrekking op de onderwerpen, bedoeld in [artikel 6, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel6
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '6'
        paragraaf: '3'
  - number: '7.3'
    text: |-
      De aanvrager, bedoeld in het eerste lid, onder *b, c* en *d,* legt bescheiden over ten bewijze van het feit dat hij
      voldoet aan de aldaar gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: '7.4'
    text: De eigen verklaring mag niet ouder zijn dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien de eigen verklaring op enige afwijking wijst kan door een deskundige, bedoeld in
      [artikel 21, tweede lid, van de Binnenschepenwet][ref1], een geneeskundige verklaring worden afgegeven indien hij
      van oordeel is dat de afwijking het veilig varen niet nadelig zal beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
  - number: '7.6'
    text: |-
      Het opmaken en het beoordelen van de eigen verklaring geschiedt met inachtneming van de bij regeling van Onze
      Minister vast te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het getuigschrift wordt afgegeven nadat het examen ter verkrijging van het vaarbewijs met gunstig gevolg is
      afgelegd.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      In het getuigschrift wordt vermeld voor welk van de in [artikel 2][ref1] bedoelde vaarbewijzen het examen is
      afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel2
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Het examen ter verkrijging van het klein vaarbewijs voor de vaart op de rivieren, kanalen en meren heeft betrekking
      op de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.1.a
    text: de wettelijke bepalingen, voor zover deze van belang zijn voor de veiligheid van de vaart op die wateren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.1.b
    text: de behandeling van de voortstuwingswerktuigen; de veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.1.c
    text: de waterwegen, de omstandigheden van het vaarwater, elementaire meteorologie;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.1.d
    text: het varen en manoeuvreren, de onder bijzondere omstandigheden te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het examen ter verkrijging van het klein vaarbewijs voor de vaart op alle binnenwateren heeft betrekking op de in
      het eerste lid genoemde onderwerpen en bovendien op:
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.2.a
    text: |-
      de wettelijke bepalingen, voor zover deze van belang zijn voor de veiligheid van de vaart op de Westerschelde, de
      Eems en de Dollard;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.2.b
    text: het gebruik van nautische bescheiden;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.2.c
    text: de koers- en plaatsbepaling;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: 9.2.d
    text: meteorologie.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      Het examen ter verkrijging van het groot vaarbewijs voor de vaart op de rivieren, kanalen en meren, heeft
      betrekking op de onderwerpen, genoemd in deel 2 van hoofdstuk A en hoofdstuk C van bijlage II van [richtlijn
      nr. 96/50/EG](31996L0050) van de Raad van de Europese Unie van 23 juli 1996 betreffende de harmonisatie van
      de voorwaarden voor de afgifte van nationale vaarbewijzen voor binnenvaartuigen welke bij het goederen- en
      personenvervoer in de Gemeenschap gebruikt worden (PbEG L 235).
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het examen ter verkrijging van het groot vaarbewijs voor alle binnenwateren heeft betrekking op de onderwerpen,
      genoemd in deel 1 van hoofdstuk A en hoofdstuk C van bijlage II van de richtlijn, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel10
  - number: '11'
    text: |-
      Indien de aanvrager met goed gevolg een examen, bedoeld in de [Wet op de Zeevischvaartdiploma’s 1935](onbekend)
      (*Stb.* 455) of de [Wet op de Zeevaartdiploma’s 1935](onbekend) (*Stb.* 456) dan wel een examen als bedoeld in
      [artikel 19, tweede lid][ref1], onderscheidenlijk [artikel 68 van de Zeevaartbemanningswet][ref2], heeft afgelegd,
      dan wel aan een school, bedoeld in [artikel 14, eerste lid, van de Wet op het Voortgezet Onderwijs][ref3] (*Stb.*
      1963, 40) het eindexamen, bestemd voor een diploma of het bewijs, genoemd in de [Wet op de Zeevischvaartdiploma’s
      1935](onbekend) of de [Zeevaartdiploma’s 1935](onbekend), met goed gevolg heeft afgelegd, wordt volstaan met een
      beperkt examen ten aanzien van de onderwerpen die door Onze Minister worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel14
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '68'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '14'
  - number: '12.1'
    text: |-
      Om voor de afgifte van een groot vaarbewijs in aanmerking te komen beschikt de aanvrager over het getuigschrift,
      bedoeld in [artikel 8][ref1], en toont hij daarnaast aan, dat hij een vaartijd heeft doorlopen van vier jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel8
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '8'
        paragraaf: '4'
  - number: '12.2'
    text: |-
      Als vaartijd, bedoeld in het eerste lid, komt in aanmerking de ervaring die de aanvrager na het bereiken van de
      16-jarige leeftijd heeft opgedaan als lid van de dekbemanning van een binnenschip, bestemd voor de bedrijfsmatige
      vaart, of van een binnenschip met een lengte van 15 meter of meer, bestemd voor de niet-bedrijfsmatige vaart, op de
      binnenwateren van de Europese Gemeenschap of op binnenwateren die de buitengrens van de Gemeenschap overschrijden.
      180 Effectieve vaardagen in de binnenvaart gelden als een jaar vaartijd als bedoeld in het eerste lid. Binnen een
      periode van 365 opeenvolgende dagen kunnen maximaal 180 dagen als vaartijd worden meegerekend.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.3'
    text: |-
      Indien de aanvrager aantoont ervaring te hebben opgedaan als lid van de dekbemanning van een schip, bestemd voor
      de bedrijfsmatige vaart ter zee, of van een schip met een lengte van 15 meter of meer, bestemd voor de niet-
      bedrijfsmatige vaart ter zee, wordt voor elk geheel jaar van deze ervaring de periode, bedoeld in het eerste
      lid, verminderd met een jaar, doch met ten hoogste een vaartijd van twee jaren, waarbij 250 zeedagen als een jaar
      vaartijd als bedoeld in het eerste lid gelden.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien de aanvrager houder is van een diploma van een opleiding voor de binnenvaart, waarvan praktijkstages deel
      uitmaken, wordt de periode, bedoeld in het eerste lid, verminderd met de duur van deze opleiding, doch met ten
      hoogste een vaartijd van drie jaren.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien de aanvrager een praktijkexamen heeft afgelegd voor het besturen van een schip waarvan de vaareigenschappen
      vergelijkbaar zijn met die van een schip waarvan de schipper bij het varen op de binnenwateren voorzien moet zijn
      van een groot vaarbewijs, wordt de periode, bedoeld in het eerste lid, verminderd met ten hoogste twee jaren. Onder
      een praktijkexamen wordt voor de toepassing van dit lid verstaan: - een praktijkexamen dat door Onze Minister is
      erkend;
        - een praktijkexamen dat bij internationale regeling of door een bevoegde autoriteit in het buitenland en door Onze
      Minister is erkend.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.6'
    text: |-
      Als vaartijd als bedoeld in het eerste lid, komt voor degene die dienst doet of heeft gedaan als registerloods
      tevens in aanmerking het in een periode van 48 maanden op binnenwateren tenminste gedurende 64 dagreizen besturen
      van een binnenschip, bestemd voor de bedrijfsmatige vaart.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.7'
    text: |-
      Indien de aanvrager die dienst doet of heeft gedaan als registerloods aantoont ervaring te hebben opgedaan
      als lid van de dekbemanning van een schip, bestemd voor de bedrijfsmatige vaart ter zee, wordt voor elk geheel
      jaar van deze ervaring de periode, bedoeld in het vierde lid, verminderd met 9 maanden en wordt het vereiste
      aantal dagreizen waarop een binnenschip, bestemd voor de bedrijfsmatige vaart, bestuurd wordt, verminderd met
      12 dagreizen, doch tot niet minder dan een vaartijd van 12 maanden waarin tenminste gedurende 16 dagreizen een
      binnenschip, bestemd voor de bedrijfsmatige vaart, is bestuurd.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '12.8'
    text: De beoordeling van de vaartijd geschiedt door de examinator.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel12
  - number: '13'
    text: |-
      De examinator opent ten minste eenmaal per jaar de mogelijkheid examens bij hem af te leggen. Hij deelt tijdig mee
      voor welk tijdstip en bij wie aanmelding voor een examen dient te geschieden. Hij vermeldt tevens welk bedrag voor
      het afleggen van het examen aan hem verschuldigd is en hoe dat bedrag dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel13
  - number: '14'
    text: |-
      De examinator zorgt dat de examens worden afgenomen in daartoe geschikte lokalen. Hij zorgt voor toezicht en een
      goede gang van zaken bij het examen. Onder meer dienen maatregelen te worden getroffen om bedrog te voorkomen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel14
  - number: '15'
    text: |-
      De examinator houdt een examenstaat bij. Een afschrift daarvan zendt hij aan Onze Minister na afloop van het
      kalenderkwartaal, waarin het examen heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Indien zich tijdens het examen onregelmatigheden hebben voorgedaan stelt de examinator zo spoedig mogelijk een
      verslag op omtrent het voorgevallene.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel16
  - number: '17'
    text: De examinator bewaart het verslag en de examenbescheiden gedurende een jaar na afloop van het examen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel17
  - number: '18.1'
    text: |-
      De examinator biedt de gecommitteerde gelegenheid om het examen bij te wonen. Hij verschaft de gecommitteerde
      inzage van het verslag en de examenbescheiden en verstrekt alle inlichtingen die de gecommitteerde nodig acht om
      zich een oordeel over het examen te kunnen vormen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      De gecommitteerde stelt, indien hij daartoe aanleiding aanwezig acht, Onze Minister schriftelijk in kennis van zijn
      bevindingen omtrent het examen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien daartoe naar zijn oordeel aanleiding bestaat kan Onze Minister een gecommitteerde belasten met het inwinnen
      van inlichtingen omtrent een reeds gehouden examen. De examinator verleent hierbij alle medewerking en verschaft
      inzage van de examenbescheiden.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel19
  - number: '19.2'
    text: De gecommitteerde stelt Onze Minister schriftelijk in kennis van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel19
  - number: '20'
    text: |-
      De examens ter verkrijging van een klein vaarbewijs worden afgenomen met inachtneming van een examenregeling en een
      examenprogramma, die door Onze Minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel20
  - number: '21.1'
    text: |-
      De examens ter verkrijging van een groot vaarbewijs worden afgenomen met inachtneming van de examenregeling en het
      examenprogramma van de examinator, mits deze zijn goedgekeurd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel21
  - number: '21.2'
    text: |-
      Onze Minister keurt de examenregeling en het examenprogramma slechts goed indien deze naar zijn oordeel voldoende
      waarborgen bevatten dat de vereiste kennis en bekwaamheid van de kandidaat naar behoren worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de examinator geen examenregeling en examenprogramma heeft die door Onze Minister zijn goedgekeurd, worden
      de in het eerste lid bedoelde examens afgenomen met inachtneming van een examenregeling en een examenprogramma, die
      door Onze Minister worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel21
  - number: '21.4'
    text: |-
      De vorige leden zijn van toepassing op wijzigingen van de examenregeling en van het examenprogramma van de
      examinator.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel21
  - number: '22.1'
    text: |-
      De in de [artikelen 20][ref1] en [21][ref2] bedoelde examenregelingen dienen bepalingen te bevatten met betrekking
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003526#Artikel21
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003526
        artikel: '21'
        paragraaf: '4'
  - number: 22.1.a
    text: het aanmelden en oproepen voor het examen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.b
    text: de wijze van examineren;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.c
    text: de duur van het examen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.d
    text: de mogelijkheid van een beperkt examen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.e
    text: het slagen en afwijzen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.f
    text: het toezicht, het voorkomen van bedrog en de goede gang van zaken tijdens het examen;
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: 22.1.g
    text: het beroep bij uitsluiting van deelneming of verdere deelneming aan het examen.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: '22.2'
    text: Het beroep, bedoeld in het eerste lid, onder *g* wordt ingesteld bij een in de examenregeling aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
  - number: '22.3'
    text: |-
      De examenregeling, bedoeld in [artikel 21][ref1], dient tevens bepalingen te bevatten ten aanzien van herexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel21
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '21'
        paragraaf: '4'
  - number: '22.4'
    text: |-
      De in de[artikelen 20][ref1] en [21][ref2] bedoelde examenprogramma’s dienen een nadere aanduiding te bevatten van
      de onderwerpen van het examen, bedoeld in de [ artikelen 9][ref3] en [10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003526#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003526#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003526#Artikel10
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '20'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003526
        artikel: '21'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0003526
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0003526
        artikel: '10'
        paragraaf: '4'
  - number: '22.5'
    text: |-
      De examenregeling, bedoeld in [artikel 21][ref1], bevat nadere bepalingen ten aanzien van de diploma's, bedoeld in
      [artikel 12, vierde lid][ref2], en de hiermee samenhangende vermindering van vaartijd.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003526#Artikel12
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '21'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003526
        artikel: '12'
        paragraaf: '4'
  - number: '24.1'
    text: |-
      Erkenning van een bewijs van vaarbekwaamheid voor de binnenvaart vindt plaats indien naar het oordeel van Onze
      Minister het bewijs voldoende waarborg biedt voor het veilig voeren van een schip op binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan ter vorming van zijn oordeel verlangen dat bescheiden worden overgelegd en inlichtingen worden
      verschaft met betrekking tot de kennis en bekwaamheid die ten grondslag liggen aan de afgifte van het bewijs van
      vaarbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een bewijs van vaarbekwaamheid wordt erkend voor de vaart op rivieren, kanalen en meren of voor de vaart op alle
      binnenwateren, dan wel voor de bedrijfsmatige vaart of voor de niet-bedrijfsmatige vaart, naar gelang het bewijs
      naar het oordeel van Onze Minister voldoende waarborg biedt voor het veilig voeren van een schip op de betrokken
      wateren ter uitoefening van de bedrijfsmatige vaart of van de niet-bedrijfsmatige vaart.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel25
  - number: '25.2'
    text: |-
      Voor de toepassing van artikel 55, eerste lid, aanhef en onder *c* en *d*, van de [Binnenschepenwet][ref1] wordt
      het bewijs van vaarbekwaamheid erkend voor de vaart op alle binnenwateren.


      [ref1]: https://wetten.overheid.nl/BWBR0003443
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003443
  - number: '27'
    text: |-
      Een wijziging van bijlage II van [richtlijn nr. 96/50/EG](31996L0050) van de Raad van de Europese Unie van
      23 juli 1996 betreffende de harmonisatie van de voorwaarden voor de afgifte van nationale vaarbewijzen voor
      binnenvaartuigen welke bij het goederen- en personenvervoer in de Gemeenschap gebruikt worden (PbEG L 235), gaat
      voor de toepassing van [artikel 10][ref1] gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel10
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '10'
        paragraaf: '4'
  - number: '28'
    text: Onze Minister kan bij ministeriële regeling nadere regelen geven ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel28
  - number: '29.1'
    text: Dit besluit kan worden aangehaald als "Besluit vaarbewijzen binnenvaart".
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel29
