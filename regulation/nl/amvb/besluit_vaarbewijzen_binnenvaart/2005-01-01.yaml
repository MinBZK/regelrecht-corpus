preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Minister van Verkeer en Waterstaat van 21 juli 1982, nr. PJ/S 24489, Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;

    Na overleg met Onze Ministers van Onderwijs en Wetenschappen, van Landbouw en Visserij en van Cultuur, Recreatie en
    Maatschappelijk Werk;

    Gelet op de artikelen 1, derde lid, 19, 22, tweede lid, 23, vierde lid, en 58, eerste lid, in samenhang met de
    artikelen 17, eerste lid, onder g,18, eerste en tweede lid, 21 en 55, eerste en vierde lid, van de Binnenschepenwet
    (Stb. 1981, 678);

    De Raad van State gehoord (advies van 31 augustus 1982, nr. 2385/11/8233);

    Gezien het nader rapport van de voornoemde Ministe van 12 oktober 1982, nr. PJ/S 26419, Directoraat-Generaal
    Scheepvaart en Maritieme Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
  - number: 1.1.a
    text: |-
      "vaarbewijs": het vaarbewijs, bedoeld in [artikel 16 van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
  - number: 1.1.b
    text: |-
      "klein vaarbewijs": het klein vaarbewijs, bedoeld in [artikel 16, tweede lid, van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
  - number: 1.1.c
    text: |-
      "groot vaarbewijs": het groot vaarbewijs, bedoeld in [artikel 16, eerste lid, van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '16'
  - number: 1.1.d
    text: '"de aanvrager": degene die in aanmerking wenst te komen voor de afgifte van een vaarbewijs;'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
  - number: 1.1.e
    text: |-
      "geneeskundig onderzoek": het onderzoek, bedoeld in [artikel 21 van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
  - number: 1.1.f
    text: |-
      "geneeskundige verklaring": de verklaring, bedoeld in 21, eerste lid, van de [Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
  - number: 1.1.g
    text: |-
      "eigen verklaring": de eigen verklaring, bedoeld in [artikel 23, tweede lid, van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '23'
  - number: 1.1.h
    text: |-
      "examen": het onderzoek, bedoeld in [artikel 22 van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '22'
  - number: 1.1.i
    text: |-
      "examinator": de instelling of persoon, aangewezen op grond van
      [artikel 22, eerste lid, van de binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '22'
  - number: 1.1.j
    text: |-
      "gecommitteerde": de gecommitteerde, aangewezen op grond van
      [artikel 22, vierde lid, van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '22'
  - number: 1.1.k
    text: |-
      "getuigschrift": de verklaring, bedoeld in [artikel 22, eerste lid, van de Binnenschepenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel22
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '22'
  - number: 1.1.l
    text: 'dagreis: reis gedurende een kalenderdag of gedeelte daarvan, waarop gedurende tenminste 6 uur dienst is gedaan.'
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
  - number: '1.2'
    text: |-
      Luchtkussenvoertuigen worden voor de toepassing van de [artikelen 16][ref1], [17][ref2], [19][ref3], [29][ref4],
      [49][ref5], [51][ref6], [52][ref7], [55][ref8] en [56 van de Binnenschepenwet][ref9] en voor de toepassing van dit
      besluit met schepen gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003443#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003443#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0003443#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0003443#Artikel49
      [ref6]: https://wetten.overheid.nl/BWBR0003443#Artikel51
      [ref7]: https://wetten.overheid.nl/BWBR0003443#Artikel52
      [ref8]: https://wetten.overheid.nl/BWBR0003443#Artikel55
      [ref9]: https://wetten.overheid.nl/BWBR0003443#Artikel56
    url: https://wetten.overheid.nl/BWBR0003526/2005-01-01#Artikel1
    references:
      - id: ref1
