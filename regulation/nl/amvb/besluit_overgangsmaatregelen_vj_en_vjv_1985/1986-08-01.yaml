  - number: C4
    text: |-
      1 De belanghebbende bedoeld in [artikel B1, tweede lid][ref1], behoudt uitzicht op bezoldiging volgens het bepaalde
      in [artikel C1][ref2], berekend volgens de schaal of de garantieschaal die voor hem op 31 maart 1985 gold.

      2 Indien de directeur of de directeur/coördinator op 31 maart 1985 tevens was benoemd in de functie van
      vormingsleider en hij op 1 april 1985 wordt benoemd in een functie waarvoor op grond van het bepaalde in
      [artikel I-P3, derde lid, van het Rechtspositiebesluit onderwijspersoneel][ref3] een functieniveau wordt
      vastgesteld, behoudt hij naast het uitzicht berekend op grond van [artikel C2][ref4] een uitzicht op bezoldiging
      volgens het salaris dat voor hem gegolden zou hebben volgens het [Rechtspositiebesluit onderwijspersoneel][ref5]
      zoals dat op 31 maart 1985 luidde, voorzover dat uitzicht hoger is dan het maximumsalarisbedrag dat bij zijn
      functieniveau behoort.


