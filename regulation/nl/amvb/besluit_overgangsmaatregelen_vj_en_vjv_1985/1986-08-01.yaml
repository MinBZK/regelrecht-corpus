        hoofdstuk: B
  - number: B7
    text: |-
      Met ingang van 1 april 1985 worden geen roosterwijzigingen ingevoerd welke uitsluitend zouden zijn
      veroorzaakt door de inwerkingtreding van dit besluit en de invoering van de salarishoofdstukken in het
      [Rechtspositiebesluit onderwijspersoneel][ref1] op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB7
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: C1
    text: |-
      1 Met inachtneming van het bepaalde in de [artikelen C2 tot en met C5][ref1] en de [artikelen V-P1][ref2],
      [V-Q701][ref3], [V-Q702][ref4] en [V-R702 van het Rechtspositiebesluit onderwijspersoneel][ref5] wordt voor de
      belanghebbende een uitzicht op salarisvaststelling na 31 maart 1985 vastgesteld volgens het schaalsalaris dat voor
      hem op 1 april 2000 zou hebben gegolden in de functie die hij op 31 maart 1985 vervulde volgens de bepalingen van
      het [Rechtspositiebesluit onderwijspersoneel][ref6] zoals dat op die datum luidde, voor zover dat schaalsalaris
      hoger zou zijn dan het maximumsalaris in de bij zijn functie behorende maximumschaal.

      2 Met de belanghebbende bedoeld in het eerste lid wordt, voorzover het bepaalde in [artikel C7][ref7] zulks
      aangeeft, gelijkgesteld degene die op 31 maart 1985 een ontslaguitkering genoot.

      3 Het in het eerste lid bedoelde uitzicht wordt uitgedrukt in het nummer van de schaal en het salarisnummer binnen
      die schaal waarbij het bedrag, waarop uitzicht wordt gegeven, is vermeld.

      4 Het in het derde lid bedoelde bedrag is een schaalsalaris, dat zo dicht mogelijk ligt bij het ingevolge dit
      hoofdstuk vast te stellen bedrag bij een normbetrekking, in de laagste schaal waarvan het maximum gelijk is aan of
      hoger dan het bedrag waarop uitzicht wordt gegeven; indien het laatstbedoelde bedrag op gelijke afstand ligt tot
      twee bedragen in die laagste schaal, wordt het schaalsalaris vastgesteld op het naast-hogere bedrag.


