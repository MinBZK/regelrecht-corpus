  - number: B1
    text: |-
      1 Aan de belanghebbende wordt per 1 april 1985 een functie toebedeeld volgens het bepaalde in de volgende leden.

      2 Als directeur of directeur/coördinator blijft benoemd degene die op 31 maart 1985 reeds als zodanig aan het
      vormingsinstituut was verbonden.

      3 Tot adjunct-directeur wordt benoemd de vormingsleider die op 31 maart 1985 reeds als adjunct-directeur was
      benoemd of aangewezen en die in het genot was van de adjunct-toelage als bedoeld in [artikel I-S26 van het
      Rechtspositiebesluit onderwijspersoneel](onbekend) zoals dat op 31 maart 1985 luidde.

      4 Tot vormingsleider wordt benoemd de belanghebbende die op 31 maart 1985 reeds als vormingsleider in dienst was,
      volgens de bepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1].

      5 Dit artikel is niet van toepassing op de belanghebbende voorzover hij op 31 maart 1985 is belast met de
      waarneming van een afwezige belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB1
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: B2
    text: |-
      Voor de belanghebbende wordt met ingang van 1 april 1985 een taakomvang vastgesteld gelijk aan de taakomvang die
      voor hem op 31 maart 1985 gold, een en ander met inachtneming van de overige bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB2
  - number: B3
    text: |-
      1 Ten behoeve van de vormingsleider, directeur of directeur/coördinator bedoeld in artikel BI,
      tweede en vierde lid, wordt op 1 april 1985 een schaalsalaris vastgesteld in het carrièrepatroon
      van de functie waarin hij wordt benoemd volgens het bepaalde in [hoofdstuk I-Q][ref1] dan wel
      [I-R van het Rechtspositiebesluit onderwijspersoneel][ref2] dat zo dicht mogelijk ligt bij en tenminste gelijk is
      aan het salaris bij een normbetrekking dat voor hem op 31 maart 1985 gold.

      2 Voor de toepassing van het bepaalde in
      [artikel I-R106, tweede lid van het Rechtspositiebesluit onderwijspersoneel][ref3] wordt de vormingsleider
      wiens schaalsalaris aan de hand van dit hoofdstuk wordt vastgesteld in de laagste bij zijn functie behorende
      aanloopschaal, geacht op 1 april 1985 in dienst te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-Q
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-R
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-R106
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB3
    references:
