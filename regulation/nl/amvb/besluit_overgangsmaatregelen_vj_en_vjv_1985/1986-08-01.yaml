    text: |-
      Voor de belanghebbende voor wie volgens het bepaalde in de [artikelen C1][ref1], [C2][ref2], [C3][ref3] en
      [C4][ref4] een uitzicht zou moeten worden vastgesteld dat lager is dan het schaalsalaris dat voor hem per 1 april
      1985 met toepassing van het bepaalde in [hoofdstuk B][ref5] is berekend, wordt het uitzicht vastgesteld op het
      laatstbedoelde niveau.


