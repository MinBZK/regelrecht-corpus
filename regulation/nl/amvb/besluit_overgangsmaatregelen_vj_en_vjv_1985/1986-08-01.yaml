  - number: C3
    text: |-
      Naast het bepaalde in [artikel C2][ref1] wordt ten behoeve van de vormingsleider bedoeld in artikel BI, derde
      lid, die op 31 maart 1985 was benoemd of aangewezen als adjunct-directeur en die op die datum in het genot was van
      de adjunct-toelage op grond van het bepaalde in [artikel I-S26 van het Rechtspositiebesluit onderwijspersoneel]
      (onbekend) zoals dat op 31 maart 1985 luidde, en die op 1 april 1985 wordt benoemd tot adjunct-directeur, wordt een
      uitzicht bepaald op het salaris dat volgens het bepaalde in [artikel C1][ref2] zou worden vastgesteld volgens de
      schaal of de garantieschaal die op 31 maart 1985 voor de vaststelling van zijn salaris in aanmerking werd genomen,
      verhoogd met het bedrag van de vorenbedoelde adjunct-toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelC2
      [ref2]: https://wetten.overheid.nl/BWBR0003778#ArtikelC1
