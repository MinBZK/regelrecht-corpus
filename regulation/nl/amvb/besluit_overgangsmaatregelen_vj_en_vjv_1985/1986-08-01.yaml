        artikel: B4
        hoofdstuk: B
  - number: B6
    text: |-
      Indien het salaris van de belanghebbende bij een normbetrekking op 31 maart 1985, berekend volgens het bepaalde
      in [artikel B3][ref1] of [B4][ref2] hoger is dan het maximum van de bij zijn functie behorende maximumschaal,
      geschiedt de inpassing op een schaalsalaris dat zo dicht mogelijk ligt bij en tenminste gelijk is aan zijn salaris
      bij een normbetrekking op 31 maart 1985 en wel in de laagste schaal waarvan het maximum gelijk is aan of hoger is
      dan dat salaris bij een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelB3
      [ref2]: https://wetten.overheid.nl/BWBR0003778#ArtikelB4
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB6
