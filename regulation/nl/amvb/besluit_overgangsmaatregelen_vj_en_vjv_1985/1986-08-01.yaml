  - number: A3
    text: |-
      De aan de hand van dit besluit uit te voeren berekeningen geschieden op basis van het loonpeil dat geldt op 31
      maart 1985.
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelA3
  - number: A4
    text: |-
      Indien de belanghebbende op 31 maart 1985 verlof genoot volgens het bepaalde in een of meer van de
      [hoofdstukken I-C][ref1], [I-D][ref2] of [I-E][ref3] dan wel een taakvermindering als bedoeld in
      [hoofdstuk I-V van het Rechtspositiebesluit onderwijspersoneel][ref4] worden uitsluitend voor de toepassing van
      dit besluit dit verlof of deze taakvermindering alsmede de daarmee eventueel samenhangende vermindering van de
      bezoldiging buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-C
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-D
      [ref3]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-E
      [ref4]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-V
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelA4
    references:
      - id: ref1
