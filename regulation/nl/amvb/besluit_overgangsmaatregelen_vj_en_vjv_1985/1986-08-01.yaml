        artikel: I-R106
  - number: B4
    text: |-
      Voor de vormingsleider bedoeld in artikel BI, derde lid, die op 31 maart 1985 in dienst was van een
      vormingsinstituut als bedoeld in [artikel A1, tweede lid, onder ][ref1], en die:

      a. op die datum was benoemd of aangewezen als adjunct-directeur en

      b. op die datum in het genot was van de adjunct-toelage als bedoeld in [artikel I-S26 van het Rechtspositiebesluit
      onderwijspersoneel](onbekend) zoals dat op 31 maart 1985 luidde en

      c. op 1 april 1985 als zodanig benoemd wordt, is het bepaalde in [artikel B3][ref2] van overeenkomstige toepassing,
      met dien verstande dat tevens rekening wordt gehouden met het bedrag van de hem op 31 maart 1985 toekomende
      adjunct-toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelA1
      [ref2]: https://wetten.overheid.nl/BWBR0003778#ArtikelB3
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB4
