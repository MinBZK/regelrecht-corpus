  - number: C6
    text: |-
      De belanghebbende ontvangt binnen twee jaar na 1 april 1985, doch uiterlijk op de datum waarop hij wordt ontslagen,
      een door het bevoegd gezag bij de inpassing opgestelde en door of namens Onze minister gewaarmerkte verklaring
      waarin het volgens dit hoofdstuk vastgestelde uitzicht gedetailleerd is aangegeven. De hier bedoelde verklaring
      wordt slechts eenmaal verstrekt.
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelC6
  - number: C7
    text: |-
      1 Voor degene die op 31 maart 1985 in het genot was van een ontslaguitkering als bedoeld in
      [hoofdstuk I-H van het Rechtspositiebesluit onderwijspersoneel][ref1] dan wel een uitkering ingevolge het
      Besluit van 4 december 1979, houdende vaststelling van een algemene maatregel van bestuur als bedoeld in
      [artikel 6, derde lid, van de Werkloosheidswet][ref2] (*Stb.* 1979, 769), wordt een uitzicht vastgesteld indien hij
      voldoet aan de volgende voorwaarden:

      a). het ontslag terzake waarvan hij een ontslaguitkering geniet is hem verleend op of na 1 augustus 1983;

      b). het ontslag is verleend uit een betrekking als directeur, directeur/coördinator, adjunct-directeur of
      vormingsleider bij een vormingsinstituut als bedoeld in artikel AI, tweede lid, onder a;

      c). de desbetreffende aanspraak op een ontslaguitkering is na de dag waarop het recht daarop is ingegaan zonder
      wezenlijke onderbreking blijven bestaan, waarbij een onderbreking van twee maanden of minder niet als een
      wezenlijke onderbreking wordt aangemerkt.

      Het uitzicht wordt vastgesteld op de wijze als in [artikel C2 eerste lid][ref3] is aangegeven waarbij in plaats van
      het in kolom A van dat artikellid vermelde salaris op 31 maart 1985 wordt gelezen: het salaris volgens de schaal en
      de salarisleeftijd op basis waarvan de desbetreffende ontslaguitkering is berekend.

      2 Ten aanzien van degene die op 31 maart 1985 als directeur, directeur/coördinator, adjunct-directeur of
      vormingsleider in dienst was bij een vormingsinsituut en aan wie met ingang van 1 april 1985 terzake van ontslag uit
      die betrekking een uitkering als bedoeld in [hoofdstuk I-H van het Rechtspositiebesluit onderwijspersoneel][ref4]
      dan wel een uitkering ingevolge het Besluit van 4 december 1979, houdende vaststelling van een algemene maatregel
      van bestuur als bedoeld in [artikel 6, derde lid, van de Werkloosheidswet][ref5] (*Stb.* 1979, 769) is toegekend,
      is het bepaalde in het eerste lid van overeenkomstige toepassing.

      3 In afwijking van het bepaalde in [artikel C6][ref6] wordt de verklaring, bedoeld in dit hoofdstuk afgegeven door
      Onze minister.


