  - number: B5
    text: |-
      Voor de belanghebbende, bedoeld in [artikel B1][ref1], die op 31 maart 1985 en op 1 april 1985 belast is met de
      waarmening van een wegens ziekte of anderszins afwezige belanghebbende en wiens ambtelijk inkomen op 31 maart 1985
      anders dan uitsluitend door wijziging van zijn taakomvang hoger was dan het ambtelijk inkomen zonder de waarneming,
      wordt tevens een inpassing toegepast als bedoeld in [artikel B3][ref2] dan wel [B4][ref3] met inbegrip van de hem
      op 31 maart 1985 toekomende beloning voor de waarneming.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelB1
      [ref2]: https://wetten.overheid.nl/BWBR0003778#ArtikelB3
      [ref3]: https://wetten.overheid.nl/BWBR0003778#ArtikelB4
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelB5
