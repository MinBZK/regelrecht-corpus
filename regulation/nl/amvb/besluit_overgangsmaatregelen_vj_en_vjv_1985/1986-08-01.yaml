preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 6 februari 1985, nr. 149.397, Directie
    Arbeidsvoorwaardenbeleid, gedaan mede namens Onze Minister van Binnenlandse Zaken;

    Gelet op de artikelen 61 en 63 van de Wet op het voortgezet onderwijs (Stb. 1967, 387) en op artikel 6 van de
    beschikking van 3 december 1981, kenmerk VO/OV/J-513.013, Nadere regeling VJV;

    De Raad van State gehoord, advies van 21 maart 1985, nr. W.05.85.0084/11.5.11;

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 22 maart 1985, nr. 149.606, Directie
    Arbeidsvoorwaardenbeleid, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelAanhef
articles:
  - number: A1
    text: |-
      1 In dit besluit zijn de begripsbepalingen van het [Rechtspositiebesluit onderwijspersoneel][ref1] (*Stb.* 1985,
      110) van toepassing.

      2 In dit besluit wordt verstaan onder:

      a. "een vormingsinstituut":

      1. een instituut voor vormingswerk voor jeugdigen, als bedoeld in het Besluit vormingswerk voor jeugdigen (*Stb.*
      1970, 357);

      2. een instituut voor vormingswerk voor jonge volwassenen dat gesubsidieerd wordt volgens de Rijksregeling
      subsidiëring vormingswerk leerplichtvrije jeugd 1964;

      b. "belanghebbende": de directeur, de directeur/coördinator, de adjunct-directeur en de vormingsleider die op
      31 maart 1985 aan een vormingsinstituut is verbonden en op 1 april 1985 als zodanig aan een vormingsinstituut
      verbonden blijft;

      c. "schaalsalaris": een bedrag in een schaal dat behoort bij een normbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelA1
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: A2
    text: |-
      Het bepaalde in de overige artikelen van dit besluit is niet van toepassing ten aanzien van de belanghebbende wiens
      betrekking op zijn verzoek op 31 maart 1985 wordt beëindigd en die aansluitend wordt belast met een functie waarbij
      een maximumsalaris behoort, dat lager is dan het maximumsalaris dat behoort bij de functie die hem op grond van
      het bepaalde in [artikel B1][ref1] is toebedeeld. De belanghebbende wordt in dat geval voor de toepassing van het
      bepaalde in de [hoofdstukken I-P][ref2], [I-Q][ref3] of [I-R van het Rechtspositiebesluit onderwijspersoneel][ref4]
      aangemerkt als belanghebbende die met ingang van 1 april 1985 in dienst treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003778#ArtikelB1
      [ref2]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-P
      [ref3]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-Q
      [ref4]: https://wetten.overheid.nl/BWBR0003771#HoofdstukI-R
    url: https://wetten.overheid.nl/BWBR0003778/1986-08-01#ArtikelA2
