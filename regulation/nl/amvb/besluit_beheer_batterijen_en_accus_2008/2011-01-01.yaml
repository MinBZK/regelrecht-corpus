articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *batterij:* bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande
      uit een of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;

      b. *accu:* bron van door rechtstreekse omzetting van chemische energie verkregen elektrische energie, bestaande uit
      een of meer primaire batterijcellen of uit een of meer secundaire batterijcellen;

      c. *op de markt brengen:* het leveren of ter beschikking stellen, al dan niet tegen betaling, aan een derde in
      Nederland;

      d. *fabrikant:* degene die een batterij of accu vervaardigt;

      e. *producent:* degene die beroepsmatig, ongeacht de verkooptechniek, batterijen of accu's, met inbegrip van die
      welke in apparatuur of voertuigen zijn ingebouwd, voor het eerst op de markt brengt.

      2 Dit besluit is niet van toepassing op batterijen en accu’s die worden gebruikt in:

      a. apparatuur die wordt aangewend in samenhang met de bescherming van de wezenlijke belangen van de veiligheid
      van Nederland of een van de andere lidstaten van de Europese Unie, wapens, munitie en oorlogsmateriaal, met
      uitzondering van producten die niet voor specifieke militaire doeleinden zijn bestemd;

      b. apparatuur bestemd om de ruimte ingestuurd te worden.
    url: https://wetten.overheid.nl/BWBR0024491/2011-01-01#Artikel1
  - number: '2'
    text: |-
      1 De producent of de fabrikant van batterijen en accu’s doet binnen dertien weken nadat de
      [Regeling beheer batterijen en accu’s 2008][ref1] op hem van toepassing is geworden, aan Onze Minister door
      middel van een daartoe door hem vast te stellen formulier, mededeling over de wijze waarop uitvoering zal worden
      gegeven aan de in dat formulier genoemde artikelen van die regeling, voor zover die artikelen op hem van toepassing
      zijn.

      2 De mededeling behoeft de instemming van Onze Minister.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing op het verzoek tot instemming.

      4 Onze Minister kan voorschriften of beperkingen verbinden aan de instemming met de mededeling.

      5 Onze Minister kan de voorschriften of beperkingen, bedoeld in het derde lid, ambtshalve of op een daartoe
      strekkend verzoek wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0024492
