  - number: '6'
    text: |-
      1 Het totaalbedrag wordt uitbetaald binnen zes weken na vaststelling van de beschikking, bedoeld in
      [artikel 3][ref1].

      2 Indien wordt uitbetaald na de afkoopdatum, wordt het uit te betalen bedrag vermeerderd met een rente van 4,00%
      over een periode van zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0024444#Artikel3
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024444
        artikel: '3'
  - number: '7'
    text: |-
      Na vaststelling van de beschikking, bedoeld in [artikel 3][ref1], vervallen de aanspraken die een gemeente of
      een budgetbeherend samenwerkingsverband had op de verschuldigde jaarbedragen die krachtens die beschikking worden
      afgekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0024444#Artikel3
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024444
        artikel: '3'
  - number: '9'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit verplichte afkoop woninggebonden subsidies.'
