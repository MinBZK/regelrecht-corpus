  - number: '3'
    text: |-
      Onze Minister neemt binnen vier weken na de inwerkingtreding van een lid van [artikel 2][ref1] ten aanzien van
      elke gemeente of elk budgetbeherend samenwerkingsverband op wie de in dat lid bedoelde afkoop betrekking heeft een
      beschikking, waarbij overeenkomstig dit besluit het totaalbedrag wordt vastgesteld, waartegen de nog verschuldigde
      jaarbedragen worden afgekocht.


      [ref1]: https://wetten.overheid.nl/BWBR0024444#Artikel2
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024444
        artikel: '2'
  - number: '4'
    text: |-
      1 Elk resterend jaarbedrag van het toegekende budget wordt contant gemaakt door middel van deling van dat bedrag
      door (1 + i)n. Hierbij is «i» de disconteringsvoet en «n» het aantal jaren vanaf de eerste vervaldatum van een
      resterend jaarbedrag op of na de afkoopdatum tot aan de vervaldatum van het contant te maken jaarbedrag.

      2 De overeenkomstig het eerste lid berekende bedragen worden gesommeerd. Het resultaat wordt contant gemaakt naar
      de dag voorafgaand aan de afkoopdatum door deling door (1 + i*m), waarbij «i» de disconteringsvoet is en «m» de
      periode vanaf de dag voorafgaande aan de afkoopdatum tot aan de eerste vervaldatum van een jaarbedrag, herleid tot
      een gedeelte van een heel jaar.
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel4
  - number: '5'
    text: |-
      1 Voor de toepassing van [artikel 4][ref1] wordt:

      a. uitgegaan van maanden van dertig dagen en van een jaar van 360 dagen;

      b. de disconteringsvoet (i) gesteld op 0,0400 (4,00%), en

      c. uitgegaan van een rendement van 4,00% voor alle rentevaste tijdvakken die volgen op het lopende rentevaste
      tijdvak.

      2 Indien voor het lopende rentevaste tijdvak een rente is vastgesteld die lager is dan 4,00%, wordt vanaf de dag na
      de afkoopdatum uitgegaan van een rendement van 4,00% voor het resterende deel van dat tijdvak.

      3 Indien 31 december van enig jaar de afkoopdatum is en tevens het einde van een rentevast tijdvak, wordt voor het
      eerste daaropvolgende rentevaste tijdvak de rente vastgesteld op de lange rente, die in het Centraal Economisch
      Plan wordt genoemd voor het eerste jaar van dat rentevaste tijdvak, verhoogd met 0,6%.

      4 Indien een jaarbedrag op grond van [artikel 14, tweede lid, van het Besluit woninggebonden subsidies][ref2] in
      twaalf maandelijkse termijnen wordt uitbetaald, wordt voor de toepassing van [artikel 4][ref3] de vervaldatum van
      dat jaarbedrag gesteld op 1 juli.

      5 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, kunnen de disconteringsvoet en het
      percentage, bedoeld in het eerste lid, onderdelen b en c, en het tweede lid, voor een daarbij te bepalen periode
      worden gewijzigd, indien, gelet op de dan geldende rente, het percentage voor de disconteringsvoet voor die periode
      voor de gemeenten of de samenwerkingsverbanden, bedoeld in [artikel 2][ref4], nadelig uitvalt.


      [ref1]: https://wetten.overheid.nl/BWBR0024444#Artikel4
