articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *afkoopdatum:* het tijdstip van inwerkingtreding van het [eerste, tweede, derde of vierde lid van artikel 2][ref1]
      of, ingeval het tijdstip van inwerkingtreding van het betreffende lid valt na 1 oktober van het kalenderjaar, 31
      december van dat kalenderjaar;
        - *Onze Minister:* Onze Minister voor Wonen, Wijken en Integratie.


      [ref1]: https://wetten.overheid.nl/BWBR0024444#Artikel2
    url: https://wetten.overheid.nl/BWBR0024444/2009-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024444
        artikel: '2'
  - number: '2'
    text: |-
      1 De op grond van [artikel 10 van het Besluit woninggebonden subsidies][ref1] aan een budgetbeherende gemeente
      toegekende budgetten, waarvan het eerste jaarbedrag, bedoeld in [artikel 14 van dat besluit][ref2], in 1994 is
      uitbetaald, worden verplicht afgekocht voor zover er nog jaarbedragen aan die gemeente verschuldigd zijn op de
      afkoopdatum.

      2 De op grond van [artikel 10 van het Besluit woninggebonden subsidies][ref3] aan een budgetbeherende gemeente
      of een budgetbeherend samenwerkingsverband toegekende budgetten, waarvan het eerste jaarbedrag, bedoeld
      in [artikel 14 van dat besluit][ref4], in 1995 is uitbetaald, worden verplicht afgekocht voor zover er nog
      jaarbedragen aan die gemeente of aan dat samenwerkingsverband verschuldigd zijn op de afkoopdatum.

      3 De op grond van [artikel 10 van het Besluit woninggebonden subsidies][ref5] aan een budgetbeherende gemeente
      of aan een budgetbeherend samenwerkingsverband toegekende budgetten, waarvan het eerste jaarbedrag, bedoeld
      in [artikel 14 van dat besluit][ref6], in 1996 is uitbetaald, worden verplicht afgekocht voor zover er nog
      jaarbedragen aan die gemeente of aan dat samenwerkingsverband verschuldigd zijn op de afkoopdatum.

      4 De op grond van [artikel 24 van het Besluit woninggebonden subsidies][ref7] aan een niet-budgetbeherende gemeente
      in 1993 of 1994 toegekende budgetten, worden verplicht afgekocht voor zover er nog jaarbedragen aan die gemeente
      verschuldigd zijn op de afkoopdatum.


