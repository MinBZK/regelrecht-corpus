articles:
  - number: '1'
    text: |-
      De kerndoelen, bedoeld in [artikel 9, vijfde lid, van de Wet op het primair onderwijs][ref1] worden vastgesteld als
      aangegeven in de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0018844/2006-03-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: '2'
    text: |-
      1 Het [Besluit kerndoelen primair onderwijs 1998][ref1] wordt ingetrokken.

      2 De kerndoelen die in de [bijlage bij het Besluit kerndoelen primair onderwijs 1998](onbekend) zijn opgenomen,
      kunnen door het bevoegd gezag van een basisschool of een speciale school voor basisonderwijs uiterlijk tot
      1 augustus 2009 worden gehanteerd voor het onderwijs aan leerlingen die op 1 augustus 2005 reeds basisonderwijs
      volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0009666
    url: https://wetten.overheid.nl/BWBR0018844/2006-03-22#Artikel2
