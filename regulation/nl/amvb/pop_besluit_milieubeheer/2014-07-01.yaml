articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder verordening: [verordening (EG) nr. 850/2004](32004R0850) van het Europees
      Parlement en de Raad van de Europese Unie van 29 april 2004 betreffende persistente organische verontreinigende
      stoffen en tot wijziging van [Richtlijn 79/117/EEG](31979L0117) (PbEU L 158, zoals gerectificeerd in PbEU L 229).
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel1
  - number: 1a
    text: >-
      Dit besluit en de daarop berustende bepalingen zijn mede van toepassing op handelingen verricht binnen de
      exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel1a
  - number: '2'
    text: Als instantie als bedoeld in artikel 15 van de verordening wordt Onze Minister aangewezen.
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel2
  - number: '3'
    text: >-
      1 Het is verboden te handelen in strijd met de artikelen 3, eerste en tweede lid, 5, eerste en tweede lid, en 7,
      eerste tot en met derde en vijfde lid, onder b, van de verordening.


      2 Het is verboden te handelen in strijd met de voorschriften, gesteld krachtens artikel 7, zesde lid, van de
      verordening.
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel3
  - number: '4'
    text: >-
      1 Het is verboden chemische stoffen die op het tijdstip van inwerkingtreding van dit besluit nog niet werden
      vervaardigd en volgens de criteria, genoemd in punt 1 van Bijlage D bij het Verdrag van Stockholm van 22 mei
      2001 inzake persistente organische verontreinigende stoffen (Trb. 2001, 171), kenmerken vertonen van persistente
      organische verontreinigende stoffen, in Nederland in te voeren, te vervaardigen, aan een ander ter beschikking te
      stellen, in handelsvoorraden voorhanden te hebben of toe te passen.


      2 Het eerste lid is niet van toepassing op:


      a. een stof die voor laboratoriumonderzoek of als referentiestandaard wordt gebruikt;


      b. een stof die als onopzettelijke sporenverontreiniging in stoffen, preparaten of producten voorkomt.
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel4
  - number: '5'
    text: |-
      Op de voorbereiding van het nationale uitvoeringsplan, bedoeld in artikel 8 van de verordening is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naarvoren worden gebracht
      door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 5a
    text: |-
      Dit besluit berust mede op de [artikelen 9.1.1][ref1] en [9.2.2.1 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.2.1
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: 9.1.1
      - id: ref2
        bwb_id: BWBR0003245
        artikel: 9.2.2.1
  - number: '6'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: POP-besluit milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0018138/2014-07-01#Artikel7
