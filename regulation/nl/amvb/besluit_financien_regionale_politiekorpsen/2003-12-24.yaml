preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 december 1993, nummer EA93/U3433, gedaan in
    overeenstemming met Onze Ministers van Justitie en van Financiën;

    Gelet op de artikelen 44 en 45 van de Politiewet 1993;

    De Raad van State gehoord (advies van 15 februari 1994, nummer W04.93.0811);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 24 maart 1994, nummer EA94/U871, uitgebracht
    in overeenstemming met Onze Ministers van Justitie en van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. rijksbijdragen: de algemene bijdragen, de bijzondere bijdragen en de aanvullende bijdragen;

      c. budgetverdeeleenheid: rekeneenheid die, vermenigvuldigd met een vast bedrag, de algemene bijdrage per regio
      bepaalt;

      d. normbedrag: vast bedrag dat, vermenigvuldigd met het aantal budgetverdeeleenheden per regio, de algemene
      bijdrage per regio bepaalt.

      2 Onder kosten als bedoeld in [artikel 44, eerste lid, van de Politiewet 1993][ref1] wordt verstaan: het saldo
      van de lasten en baten van de regio voor personele en materiële middelen en investeringen, reserveringen en
      desinvesteringen daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel44
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '44'
  - number: '2'
    text: |-
      1 De algemene bijdrage aan een regio bestaat uit het aantal budgetverdeeleenheden van die regio vermenigvuldigd met
      het normbedrag.

      2 Onze Minister stelt jaarlijks voor 1 juli het aantal budgetverdeeleenheden per regio voorlopig vast voor het
      eerstvolgende jaar en geeft daarbij een indicatie van het aantal budgetverdeeleenheden voor de daarop volgende
      drie jaren.

      3 Onze Minister stelt jaarlijks voor 1 juli het normbedrag per budgetverdeeleenheid en de algemene bijdrage
      per regio voorlopig vast voor het eerstvolgende jaar onder voorbehoud van goedkeuring van Hoofdstuk VII van de
      rijksbegroting. Hij geeft daarbij een indicatie van het normbedrag voor de daarop volgende drie jaren.

      4 De voorlopig vastgestelde algemene bijdrage wordt betaalbaar gesteld in vier termijnen respectievelijk 15
      januari, 15 april, 15 juli, 15 oktober.

      5 Onze Minister kan de voorlopig vastgestelde bijdrage wijzigen.

      6 Onze Minister kan de voorlopig vastgestelde bijdrage verminderen indien niet wordt voldaan aan het gestelde bij
      of krachtens [artikel 13a, tweede lid, van het Besluit comptabele regelgeving regionale politiekorpsen](onbekend).

      7 Onze Minister stelt de korpsbeheerder zo spoedig mogelijk op de hoogte van een besluit tot bijstelling als
      bedoeld in het vijfde en zesde lid.

      8 Verrekening van bijstellingen in de voorlopig vastgestelde algemene bijdrage vindt uiterlijk plaats op 1 december
      van het jaar waarop de voorlopige vaststelling betrekking heeft.

      9 Onze Minister kan bij de voorlopige vaststelling van de algemene bijdrage voorwaarden verbinden aan de besteding
      van deze bijdrage.
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan aan een regio een bijzondere bijdrage verlenen.

      2 Een bijzondere bijdrage kan onder voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel3
  - number: '4'
    text: |-
      1 Op aanvraag van het regionale college kan Onze Minister een aanvullende bijdrage verlenen, indien in het jaar
      waarvoor de algemene bijdrage voorlopig is vastgesteld en in een of meer daaropvolgende jaren een begrotingstekort
      wordt verwacht voor zoveel groter dan een bij ministeriële regeling vastgesteld percentage van de voor het
      eerstbedoelde jaar voorlopig vastgestelde algemene bijdrage vermeerderd met de bijzondere bijdrage. De aanvullende
      bijdrage wordt voor ten hoogste vier achtereenvolgende jaren verleend en wordt jaarlijks door Onze Minister
      aangepast aan het voor dat jaar verwachte begrotingstekort.

      2 De aanvraag wordt door de korpsbeheerder namens het regionale college bij Onze Minister ingediend voor het begin
      van het jaar waarvoor de aanvullende bijdrage wordt aangevraagd. Onze Minister beslist omtrent de aanvraag binnen
      een half jaar na indiening daarvan. Indien de beschikking niet binnen dat half jaar kan worden gegeven, stelt
      Onze Minister de korpsbeheerder daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien. Deze termijn is niet langer dan drie maanden.

      3 Onze Minister kan aan een regio waaraan een aanvullende bijdrage wordt verleend, bijzondere voorschriften geven
      met betrekking tot het door die regio te voeren financiële beleid. Deze voorschriften zijn van toepassing op het
      begrotingsjaar of de begrotingsjaren waarvoor de bijdrage wordt verleend.

      4 Onverminderd [artikel 7][ref1] kan Onze Minister de aanvullende bijdrage verminderen, intrekken, dan wel geheel
      of gedeeltelijk terugvorderen indien:

      a. de financiële positie van de regio zodanig wijzigt, dat daarmee niet langer aan de in het eerste lid, eerste
      volzin, bedoelde voorwaarde wordt voldaan,

      b. de door of namens het regionale college ten behoeve van de aanvraag verstrekte informatie onjuist of onvolledig
      blijkt te zijn en de verstrekking van juiste en volledige gegevens tot een andere beslissing zou hebben geleid, of

      c. de regio in strijd handelt met de voorschriften, bedoeld in het derde lid.

      5 Onze Minister kan de in het eerste lid, eerste volzin, bedoelde voorwaarde geheel of gedeeltelijk buiten
      toepassing laten gelet op het belang dat deze regeling beoogt te beschermen, voor zover toepassing zal leiden tot
      een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel7
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel4
