  - number: 4a
    text: |-
      1 Onze Minister kan, gelet op het gestelde bij of krachtens
      [artikel 13a van het Besluit comptabele regelgeving regionale politiekorpsen][ref1], ten behoeve van een
      verbetering van de financiële positie aan een regio een aanvullende bijdrage verlenen.

      2 Onze Minister kan aan een regio waaraan een bijdrage, bedoeld in het eerste lid, wordt verleend, met betrekking
      tot het door die regio te voeren financiële beleid bijzondere voorschriften geven. Deze voorschriften zijn van
      toepassing op het begrotingsjaar of de begrotingsjaren waarvoor de bijdrage wordt verleend.

      3 Onverminderd [artikel 7][ref2] kan Onze Minister de bijdrage, bedoeld in het eerste lid verminderen, intrekken,
      dan wel geheel of gedeeltelijk terugvorderen indien:

      a. de financiële positie van de regio zodanig wijzigt, dat aan het krachtens
      [artikel 13a, tweede lid, van het Besluit comptabele regelgeving regionale politiekorpsen][ref3] gestelde wordt
      voldaan.

      b. de regio in strijd handelt met de voorschriften, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006563#Artikel13a
