  - number: '6'
    text: Uitbetaling van een rijksbijdrage vindt plaats door middel van voorschotten.
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister stelt de omvang van de rijksbijdragen over het voorafgaande begrotingsjaar definitief vast binnen
      drie maanden nadat de regio de in [artikel 5, eerste lid][ref1], bedoelde bescheiden heeft overgelegd.

      2 Onze Minister kan besluiten tot gehele of gedeeltelijke terugvordering van verleende rijksbijdragen indien uit
      de in [artikel 5, eerste en derde lid][ref2], bedoelde bescheiden blijkt dat de bijdragen niet overeenkomstig
      de gestelde regels zijn besteed of niet is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de
      rijksbijdragen.

      3 Onze Minister kan de betaling van voorschotten geheel of gedeeltelijk opschorten indien niet is
      voldaan aan de bij of krachtens [artikel 5][ref3] gestelde regels of aan het bepaalde op grond van
      [artikel 45, derde lid, van de Politiewet 1993][ref4].

      4 Onze Minister stelt de korpsbeheerder zo spoedig mogelijk op de hoogte van een besluit als bedoeld in het tweede
      en derde lid.


