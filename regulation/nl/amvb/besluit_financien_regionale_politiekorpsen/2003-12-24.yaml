  - number: '8'
    text: |-
      1 De korpsbeheerder verstrekt jaarlijks voor 15 november aan Onze Minister de vastgestelde organisatie en de
      formatie voor het volgende jaar en eveneens de vastgestelde begroting en het beleidsplan die betrekking hebben op
      het volgende jaar en de daarop volgende drie jaren. De op deze documenten betrekking hebbende wijzigingen worden,
      zodra deze door het regionale college zijn vastgesteld, aan Onze Minister gezonden.

      2 Onze Minister kan nadere regels stellen over de inrichting van de documenten, bedoeld in het eerste lid, alsmede
      over de wijze waarop deze aan hem worden verstrekt. Voor zover deze regels betrekking hebben op de strafrechtelijke
      handhaving van de rechtsorde dan wel op taken ten dienste van de justitie, worden zij gesteld in overeenstemming
      met Onze Minister van Justitie.

      3 Onze Minister doet jaarlijks verslag van de verkregen informatie aan Onze Minister van Justitie en aan de
      korpsbeheerders.
    url: https://wetten.overheid.nl/BWBR0006562/2003-12-24#Artikel8
  - number: '9'
    text: |-
      1 Bij de toepassing van de [artikelen 203][ref1] en [205 tot en met 211 van de Gemeentewet][ref2], bedoeld in
      [artikel 45, vierde lid, van de Politiewet 1993][ref3], wordt gelezen voor:

      a. het gemeentebestuur: de korpsbeheerder;

      b. het college van burgemeester en wethouders: de korpsbeheerder;

      c. de gemeenteraad: het regionale college;

      d. de raad: het regionale college;

      e. de gemeente: de politieregio;

      f. gedeputeerde staten: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      g. de commissaris van de Koning: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 In aanvulling op [artikel 203 van de Gemeentewet][ref4] kan Onze Minister bepalen dat de begroting voor het
      regionale politiekorps alsmede de daarop betrekking hebbende wijzigingen tevens zijn goedkeuring behoeven indien
      niet is voldaan aan de bij of krachtens [artikel 8, eerste en tweede lid][ref5], gestelde regels, of indien blijkt
      dat niet is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de rijksbijdragen.

      3 In afwijking van [artikel 206 van de Gemeentewet][ref6] kan de goedkeuring tevens worden onthouden indien niet is
      voldaan aan de bij of krachtens [artikel 8, eerste en tweede lid][ref7], gestelde regels, of indien blijkt dat niet
      is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de rijksbijdragen.


