  - number: '5'
    text: |-
      1 De korpsbeheerder verstrekt jaarlijks uiterlijk 31 maart aan Onze Minister het vastgestelde jaarverslag en de
      jaarrekening waarin verantwoording wordt afgelegd over de besteding van de rijksbijdragen en overige baten over het
      voorafgaande jaar.

      2 Onze Minister kan nadere regels stellen over de inhoud en inrichting van het jaarverslag en de jaarrekening,
      alsmede over de wijze waarop deze aan hem worden verstrekt.

      3 De jaarrekening is voorzien van een verklaring en een verslag van een deskundige als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      4 Onze Minister kan nadere regels stellen aan de inhoud en inrichting van het verslag, de reikwijdte van de
      controle en de inhoud van de verklaring, bedoeld in het derde lid.

      5 Aan ambtenaren van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties wordt op verzoek alle informatie
      verstrekt die zij noodzakelijk achten. Deze ambtenaren kunnen ook op eigen initiatief informatie inwinnen bij de
      deskundige die met de controle is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
