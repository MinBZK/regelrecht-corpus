    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.4
    text: |-
      Bij het invullen van de waarde van de omgevingskenmerken GG, HRC, INW, OAD, OPP, NWA, NWA1530 en RKP, wordt gebruik
      gemaakt van CBS-gegevens met als peildatum 1 januari 2008. Voor de omgevingskenmerken GZ en MOB wordt gebruik
      gemaakt van CBS-gegevens over het jaar 2007.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.5
    text: |-
      In afwijking van het vierde lid wordt voor INW in de formule voor «handhaving wijkagenten» het gemiddelde genomen
      over de periode 2005–2008, met als peildatum 1 januari. Het aantal inwoners 2005 kent daarbij een gewicht van 1/10,
      2006 kent een gewicht van 2/10, 2007 kent een gewicht van 3/10 en 2008 kent een gewicht van 4/10.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2e.1
    text: |-
      Indien het op grond van [artikel 2, derde lid, onderdeel a][ref1], voor de algemene budgetten beschikbare
      bedrag voor het eerstvolgende jaar gelijk is aan dat van het lopende jaar en het algemene budget van een regio
      in het eerstvolgende jaar ten opzichte van het lopende jaar daalt als gevolg van de met toepassing van de
      [artikelen 2b][ref2], [2c][ref3] en [2d][ref4] uitgevoerde berekeningen en deze daling meer dan 1% bedraagt,
      ontvangt de regio in het eerstvolgende jaar een compensatie ter hoogte van het percentage waarmee de daling de
      1% overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0006562#Artikel2c
      [ref4]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 2b
      - id: ref3
        bwb_id: BWBR0006562
        artikel: 2c
      - id: ref4
        bwb_id: BWBR0006562
        artikel: 2d
  - number: 2e.2
    text: |-
      Indien de in het eerste lid bedoelde daling meer bedraagt dan 2% wordt in het jaar volgende op het eerstvolgende
      jaar de helft gecompenseerd van het percentage waarmee de 1% wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2e
  - number: 2e.3
    text: |-
      Een stijging van het algemene budget ten opzichte van het lopende jaar als gevolg van de loon- en prijsindex, wordt
      in de berekeningen van het eerste en tweede lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2e
  - number: '3.1'
    text: Onze Minister kan aan een regio een bijzondere bijdrage verlenen.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel3
  - number: '3.2'
    text: Een bijzondere bijdrage kan onder voorwaarden worden verleend.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel3
  - number: '4.1'
    text: |-
      Op aanvraag van het regionale college kan Onze Minister een aanvullende bijdrage verlenen, indien in het jaar
      waarvoor de algemene bijdrage voorlopig is vastgesteld en in een of meer daaropvolgende jaren een begrotingstekort
      wordt verwacht voor zoveel groter dan een bij ministeriële regeling vastgesteld percentage van de voor het
      eerstbedoelde jaar voorlopig vastgestelde algemene bijdrage vermeerderd met de bijzondere bijdrage. De aanvullende
      bijdrage wordt voor ten hoogste vier achtereenvolgende jaren verleend en wordt jaarlijks door Onze Minister
      aangepast aan het voor dat jaar verwachte begrotingstekort.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: '4.2'
    text: |-
      De aanvraag wordt door de korpsbeheerder namens het regionale college bij Onze Minister ingediend voor het begin
      van het jaar waarvoor de aanvullende bijdrage wordt aangevraagd. Onze Minister beslist omtrent de aanvraag binnen
      een half jaar na indiening daarvan. Indien de beschikking niet binnen dat half jaar kan worden gegeven, stelt
      Onze Minister de korpsbeheerder daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien. Deze termijn is niet langer dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan aan een regio waaraan een aanvullende bijdrage wordt verleend, bijzondere voorschriften geven
      met betrekking tot het door die regio te voeren financiële beleid. Deze voorschriften zijn van toepassing op het
      begrotingsjaar of de begrotingsjaren waarvoor de bijdrage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: '4.4'
    text: |-
      Onverminderd [artikel 7][ref1] kan Onze Minister de aanvullende bijdrage verminderen, intrekken, dan wel geheel of
      gedeeltelijk terugvorderen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel7
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '7'
  - number: 4.4.a
    text: |-
      de financiële positie van de regio zodanig wijzigt, dat daarmee niet langer aan de in het eerste lid, eerste
      volzin, bedoelde voorwaarde wordt voldaan,
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: 4.4.b
    text: |-
      de door of namens het regionale college ten behoeve van de aanvraag verstrekte informatie onjuist of onvolledig
      blijkt te zijn en de verstrekking van juiste en volledige gegevens tot een andere beslissing zou hebben geleid, of
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: 4.4.c
    text: de regio in strijd handelt met de voorschriften, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: '4.5'
    text: |-
      Onze Minister kan de in het eerste lid, eerste volzin, bedoelde voorwaarde geheel of gedeeltelijk buiten toepassing
      laten gelet op het belang dat deze regeling beoogt te beschermen, voor zover toepassing zal leiden tot een
      onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4
  - number: 4a.1
    text: |-
      Onze Minister kan, gelet op het gestelde bij of krachtens
      [artikel 13a van het Besluit comptabele regelgeving regionale politiekorpsen][ref1], ten behoeve van een
      verbetering van de financiële positie aan een regio een aanvullende bijdrage verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: 13a
  - number: 4a.2
    text: |-
      Onze Minister kan aan een regio waaraan een bijdrage, bedoeld in het eerste lid, wordt verleend, met betrekking
      tot het door die regio te voeren financiële beleid bijzondere voorschriften geven. Deze voorschriften zijn van
      toepassing op het begrotingsjaar of de begrotingsjaren waarvoor de bijdrage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Onverminderd [artikel 7][ref1] kan Onze Minister de bijdrage, bedoeld in het eerste lid verminderen, intrekken, dan
      wel geheel of gedeeltelijk terugvorderen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel7
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '7'
  - number: 4a.3.a
    text: |-
      de financiële positie van de regio zodanig wijzigt, dat aan het krachtens
      [artikel 13a, tweede lid, van het Besluit comptabele regelgeving regionale politiekorpsen][ref1] gestelde wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: 13a
  - number: 4a.3.b
    text: de regio in strijd handelt met de voorschriften, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4a
  - number: 4b.1
    text: |-
      Het algemene budget van een regio wordt verminderd met een voor alle regio’s gelijk percentage van hun budget ter
      dekking van de aanvullende bijdragen aan regio’s op grond van de [artikelen 4][ref1] en [4a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel4a
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 4a
  - number: 4b.2
    text: |-
      De rijksbijdrage aan een regio kan worden verminderd ter vergoeding van kosten in verband met samenwerking met
      andere regio’s of in verband met voorzieningen waarvan de regio gebruikmaakt.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4b
  - number: 4b.3
    text: |-
      Onze Minister stelt jaarlijks voor 31 december de hoogte vast van de vermindering bedoeld in het eerste en tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel4b
  - number: '5.1'
    text: |-
      De korpsbeheerder verstrekt jaarlijks uiterlijk 31 maart aan Onze Minister het vastgestelde jaarverslag en de
      jaarrekening waarin verantwoording wordt afgelegd over de besteding van de rijksbijdragen en overige baten over het
      voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan nadere regels stellen over de inhoud en inrichting van het jaarverslag en de jaarrekening,
      alsmede over de wijze waarop deze aan hem worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel5
  - number: '5.3'
    text: |-
      De jaarrekening is voorzien van een verklaring en een verslag van een deskundige als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '5.4'
    text: |-
      Onze Minister kan nadere regels stellen aan de inhoud en inrichting van het verslag, de reikwijdte van de controle
      en de inhoud van de verklaring, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel5
  - number: '5.5'
    text: |-
      Aan ambtenaren van het ministerie van Veiligheid en Justitie wordt op verzoek alle informatie verstrekt die zij
      noodzakelijk achten. Deze ambtenaren kunnen ook op eigen initiatief informatie inwinnen bij de deskundige die met
      de controle is belast.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel5
  - number: '6'
    text: Uitbetaling van een rijksbijdrage vindt plaats door middel van voorschotten.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister stelt de omvang van de rijksbijdragen over het voorafgaande begrotingsjaar definitief vast binnen
      drie maanden nadat de regio de in [artikel 5, eerste lid][ref1], bedoelde bescheiden heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel5
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '5'
  - number: '7.2'
    text: |-
      Onze Minister kan besluiten tot gehele of gedeeltelijke terugvordering van verleende rijksbijdragen indien uit
      de in [artikel 5, eerste en derde lid][ref1], bedoelde bescheiden blijkt dat de bijdragen niet overeenkomstig
      de gestelde regels zijn besteed of niet is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de
      rijksbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel5
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '5'
  - number: '7.3'
    text: |-
      Onze Minister kan de betaling van voorschotten geheel of gedeeltelijk opschorten indien niet is
      voldaan aan de bij of krachtens [artikel 5][ref1] gestelde regels of aan het bepaalde op grond van
      [artikel 45, derde lid, van de Politiewet 1993][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel45
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '45'
  - number: '7.4'
    text: |-
      Onze Minister stelt de korpsbeheerder zo spoedig mogelijk op de hoogte van een besluit als bedoeld in het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel7
  - number: '8.1'
    text: |-
      De korpsbeheerder verstrekt jaarlijks voor 15 november aan Onze Minister de vastgestelde organisatie en de formatie
      voor het volgende jaar en eveneens de vastgestelde begroting en het beleidsplan die betrekking hebben op het
      volgende jaar en de daarop volgende drie jaren. De op deze documenten betrekking hebbende wijzigingen worden, zodra
      deze door het regionale college zijn vastgesteld, aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister kan nadere regels stellen over de inrichting van de documenten, bedoeld in het eerste lid, alsmede
      over de wijze waarop deze aan hem worden verstrekt. Voor zover deze regels betrekking hebben op de strafrechtelijke
      handhaving van de rechtsorde dan wel op taken ten dienste van de justitie, worden zij gesteld in overeenstemming
      met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister doet jaarlijks verslag van de verkregen informatie aan Onze Minister van Justitie en aan de
      korpsbeheerders.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij de toepassing van de [artikelen 203][ref1] en [205 tot en met 211 van de Gemeentewet][ref2], bedoeld in
      [artikel 45, vierde lid, van de Politiewet 1993][ref3], wordt gelezen voor:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel205
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel45
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '205'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '45'
  - number: 9.1.a
    text: 'het gemeentebestuur: de korpsbeheerder;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.b
    text: 'het college van burgemeester en wethouders: de korpsbeheerder;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.c
    text: 'de gemeenteraad: het regionale college;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.d
    text: 'de raad: het regionale college;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.e
    text: 'de gemeente: de politieregio;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.f
    text: 'gedeputeerde staten: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.1.g
    text: 'de commissaris van de Koning: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: '9.2'
    text: |-
      In aanvulling op [artikel 203 van de Gemeentewet][ref1] kan Onze Minister bepalen dat de begroting voor het
      regionale politiekorps alsmede de daarop betrekking hebbende wijzigingen tevens zijn goedkeuring behoeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
  - number: 9.2.a
    text: |-
      niet is voldaan aan de bij of krachtens [artikel 8, eerste en tweede lid][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel8
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '8'
  - number: 9.2.b
    text: blijkt dat niet is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de rijksbijdragen;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.2.c
    text: |-
      de verhouding tussen het eigen vermogen en het balanstotaal in de jaarrekening van het tweede aan het
      begrotingsjaar voorafgaande jaar kleiner is dan een bij ministeriële regeling vast te stellen normwaarde; of
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: 9.2.d
    text: |-
      de verhouding tussen het eigen vermogen en het balanstotaal in de begroting kleiner is dan een bij ministeriële
      regeling vast te stellen normwaarde en blijkens de meerjarenraming niet aannemelijk is dat de normwaarde in de
      eerstvolgende jaren zal worden bereikt.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
  - number: '9.3'
    text: |-
      In afwijking van [artikel 206 van de Gemeentewet][ref1] kan de goedkeuring tevens worden onthouden indien niet is
      voldaan aan de bij of krachtens [artikel 8, eerste en tweede lid][ref2], gestelde regels, of indien blijkt dat niet
      is voldaan aan de voorwaarden die zijn gesteld aan de besteding van de rijksbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel8
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '206'
      - id: ref2
        bwb_id: BWBR0006562
        artikel: '8'
  - number: '10.1'
    text: |-
      Voor de toepassing van de [artikelen 10 tot en met 12][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel10
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '10'
  - number: 10.1.a
    text: |-
      jaarbijdrage: bijdrage op grond van de [artikelen 2a][ref1], [2b][ref2], [2c][ref3], [2d][ref4] en [3][ref5]
      verminderd met bij ministeriële regeling bepaalde onderdelen hiervan;


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0006562#Artikel2c
      [ref4]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
      [ref5]: https://wetten.overheid.nl/BWBR0006562#Artikel3
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 2b
      - id: ref3
        bwb_id: BWBR0006562
        artikel: 2c
      - id: ref4
        bwb_id: BWBR0006562
        artikel: 2d
      - id: ref5
        bwb_id: BWBR0006562
        artikel: '3'
  - number: 10.1.b
    text: |-
      referentiebijdrage 2007: som van de algemene bijdrage en de bijzondere bijdragen die een regio op grond van dit
      besluit zoals het gold op 31 december 2006 in 2007 zou hebben ontvangen, verminderd met bij ministeriële regeling
      bepaalde onderdelen hiervan.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel10
  - number: '10.2'
    text: Onze Minister stelt uiterlijk 31 december 2007 de referentiebijdrage 2007 per regio vast.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de referentiebijdrage 2007 voor een regio hoger is dan de jaarbijdrage in 2007, ontvangt de regio met ingang
      van 2007 een compensatie te berekenen met toepassing van [artikel 11][ref1]. Indien de referentiebijdrage 2007
      lager is dan de jaarbijdrage die voor 2007 is berekend, wordt de stijging van de jaarbijdrage met ingang van 2007
      gemaximeerd met toepassing van [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel12
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006562
        artikel: '12'
  - number: '12.1'
    text: De regio ontvangt in 2007 een jaarbijdrage die maximaal 2% hoger is dan de referentiebijdrage 2007.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '12.2'
    text: |-
      De regio ontvangt in 2008 en de daarop volgende jaren een jaarbijdrage die maximaal 4% hoger is dan de jaarbijdrage
      van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '12.3'
    text: |-
      Bij ministeriële regeling kunnen onderdelen van de jaarbijdrage worden vastgesteld die bij de berekeningen bedoeld
      in het eerste en tweede lid buiten beschouwing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '12.4'
    text: |-
      De verhogingen van onderdelen van de jaarbijdrage ten gevolge van de stijging van de loon- en prijsindex worden bij
      de berekeningen bedoeld in het eerste en tweede lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien de jaarbijdrage in het eerstvolgende jaar lager is dan in het lopende jaar, wordt het maximale
      stijgingspercentage verminderd met een percentage dat overeenkomt met de lagere vaststelling van de jaarbijdrage.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '12.6'
    text: |-
      In afwijking van het eerste lid, wordt bij besluit van Onze Minister de rijksbijdrage in 2007 voor de regio’s
      Flevoland en Limburg-Zuid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel12
  - number: '13'
    text: |-
      Bij het invullen van de waarde van de omgevingskenmerken ten behoeve van de verdeling van de deelbudgetten voor het
      jaar 2011:
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13
  - number: 13.a
    text: |-
      worden in afwijking van [artikel 2d, vierde lid][ref1], de op 1 april 2009 bekende gegevens van het CBS gebruikt,


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2d
  - number: 13.b
    text: |-
      wordt in afwijking van [artikel 2d, vijfde lid][ref1], voor INW het gemiddelde genomen van de waarde van de jaren
      2009, 2010 en 2011, en de prognose ten aanzien van het jaar 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2d
  - number: 13a
    text: |-
      Voor de toepassing van de [artikelen 13b][ref1] en [13c][ref2] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel13c
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 13c
  - number: 13a.a
    text: |-
      *het algemeen budget voor het jaar 2011:* het algemeen budget per korps voor het jaar 2011, berekend op grond van
      dit besluit zoals dat gold op 31 december 2011, uitgaande van de som van de algemene budgetten overeenkomstig de
      bij dit besluit behorende [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13a.b
    text: |-
      *het herijkte budget voor het jaar 2011:* het algemeen budget per korps voor het jaar 2011, berekend op grond
      van dit besluit zoals dat geldt met ingang van 1 januari 2012, uitgaande van de som van de algemene budgetten
      overeenkomstig de bij dit besluit behorende [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13a.c
    text: |-
      *krimpregio:* een regio waarbij het herijkte budget voor het jaar 2011 kleiner is dan het algemeen budget voor het
      jaar 2011 overeenkomstig de bij dit besluit behorende [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13a.d
    text: |-
      *groeiregio:* een regio waarbij het herijkte budget voor het jaar 2011 groter is dan het algemeen budget voor het
      jaar 2011 overeenkomstig de bij dit besluit behorende [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13b.1
    text: |-
      Het budget van een krimpregio wordt voor de jaren 2012 tot en met 2015 verhoogd met het verschil tussen het
      budget overeenkomstig [bijlage I][ref1] bij dit besluit en het herijkte budget voor het jaar 2011, verminderd met
      respectievelijk 1,5 procent, 3 procent, 4,5 procent en 6 procent van het budget overeenkomstig bijlage I.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13b.2
    text: |-
      Het budget van een krimpregio wordt verhoogd tot en met het jaar waarin het verschil tussen het budget
      overeenkomstig [bijlage I][ref1] bij dit besluit en het herijkte budget voor het jaar 2011 en de vermindering
      overeenkomstig het eerste lid nihil is.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13b.3
    text: |-
      Voor een groeiregio wordt voor de jaren 2012 tot en met 2015 het verschil berekend tussen het budget overeenkomstig
      [bijlage I][ref1] bij dit besluit en het herijkte budget voor het jaar 2011. Het budget voor de groeiregio wordt
      verminderd met het saldo van het verschil overeenkomstig de eerste zin en de uitkomst van de formule a/b x c,
      waarin a staat voor het verschil bedoeld in de eerste volzin, b staat voor de som van de verschilbedragen voor alle
      groeibedragen bedoeld in de eerste volzin voor alle groeiregio’s en c staat voor de vermindering overeenkomstig het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13b.4
    text: |-
      Het budget van een groeiregio wordt verlaagd tot en met het jaar waarin het verschil tussen het budget
      overeenkomstig [bijlage I][ref1] bij dit besluit en het herijkte budget voor het jaar 2011 en de uitkomst van de
      formule a/b x c nihil is.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006562
  - number: 13c.1
    text: |-
      Indien voor een regio het relatieve verschil tussen het herijkte budget voor 2011 aangevuld met de bedragen
      op grond van artikel 13b, eerste of derde lid voor de jaren 2012 tot en met 2015 en de uitkomst van de
      werklastmeting, overeenkomstig de bij dit besluit behorende [bijlage II][ref1] voor een jaar groter is dan 6,62
      procent, wordt het budget van de regio verminderd door het verschil te verminderen met 6,62 procentpunt en de
      uitkomst daarvan te vermenigvuldigen met het herijkt budget voor 2011 aangevuld met de bedragen op grond van
      [artikel 13b, eerste of derde lid][ref2] voor de jaren 2012 tot en met 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006562
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 13b
  - number: 13c.2
    text: |-
      Indien voor een regio het relatieve verschil tussen het herijkte budget voor 2011 aangevuld met de bedragen op
      grond van artikel 13b, eerste of derde lid voor de jaren 2012 tot en met 2015 en de uitkomst van de werklastmeting,
      overeenkomstig de bij dit besluit behorende [bijlage II][ref1] voor een jaar kleiner is dan –6,62 procent, wordt
      het budget van de regio vermeerderd door het verschil te vermeerderen met 6,62 procentpunt en de absolute waarde
      van de uitkomst daarvan te vermenigvuldigen met het herijkt budget voor 2011 aangevuld met de bedragen op grond van
      [artikel 13b, eerste of derde lid][ref2], voor de jaren 2012 tot en met 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0006562
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006562
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 13b
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit financiën regionale politiekorpsen.'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel14
