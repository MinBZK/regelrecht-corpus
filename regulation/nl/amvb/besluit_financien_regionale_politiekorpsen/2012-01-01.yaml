preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 december 1993, nummer EA93/U3433, gedaan in
    overeenstemming met Onze Ministers van Justitie en van Financiën;

    Gelet op de artikelen 44 en 45 van de Politiewet 1993;

    De Raad van State gehoord (advies van 15 februari 1994, nummer W04.93.0811);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 24 maart 1994, nummer EA94/U871, uitgebracht
    in overeenstemming met Onze Ministers van Justitie en van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
  - number: 1.1.b
    text: |-
      werksoort: een verzameling van met elkaar samenhangende werkzaamheden van de Nederlandse politie met een specifieke
      kostenstructuur, die bestaat uit personele en materiële kosten;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
  - number: 1.1.c
    text: |-
      telefoonmeting: onderzoek in opdracht van Onze Minister naar de kwalitatieve en kwantitatieve telefonische
      bereikbaarheid van de regio’s in het kader van het Landelijk Telefoonnummer Politie;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
  - number: 1.1.d
    text: 'werklastmeting: de in 2009 verrichte meting in opdracht van Onze Minister naar de werklast van de regio’s.'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder kosten als bedoeld in [artikel 44, eerste lid, van de Politiewet 1993][ref1] wordt verstaan: het saldo
      van de lasten en baten van de regio voor personele en materiële middelen en investeringen, reserveringen en
      desinvesteringen daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel44
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '44'
  - number: '2.1'
    text: De rijksbijdrage aan een regio bestaat uit een algemene bijdrage en eventuele bijzondere en aanvullende bijdragen.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: '2.2'
    text: 'De algemene bijdrage bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.2.a
    text: |-
      een algemeen budget dat is opgebouwd uit de met toepassing van de in de [artikelen 2b][ref1], [2c][ref2] en
      [2d][ref3] te berekenen aanspraken op deelbudgetten voor de werksoorten intake en service, noodhulp, opsporing
      en handhaving;


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2b
      - id: ref2
        bwb_id: BWBR0006562
        artikel: 2c
      - id: ref3
        bwb_id: BWBR0006562
        artikel: 2d
  - number: 2.2.b
    text: |-
      specifieke budgetten die Onze Minister kan toekennen indien specifieke kenmerken in een regio of een specifieke
      taak binnen een regio extra werklast meebrengen;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.2.c
    text: |-
      compensaties indien de [artikelen 2e][ref1], respectievelijk [10][ref2], [11][ref3], [12][ref4], [13b][ref5] of
      [13c][ref6] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2e
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0006562#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0006562#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0006562#Artikel13b
      [ref6]: https://wetten.overheid.nl/BWBR0006562#Artikel13c
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2e
      - id: ref2
        bwb_id: BWBR0006562
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0006562
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0006562
        artikel: '12'
      - id: ref5
        bwb_id: BWBR0006562
        artikel: 13b
      - id: ref6
        bwb_id: BWBR0006562
        artikel: 13c
  - number: '2.3'
    text: |-
      Onze Minister stelt jaarlijks onder voorbehoud van goedkeuring van de begroting van het ministerie van Veiligheid
      en Justitie voor 1 juli voor het eerstvolgende jaar voorlopig vast welk deel van de begroting bestemd is voor:
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.3.a
    text: |-
      algemene budgetten en verdeling van dit bedrag in deelbudgetten voor de in het tweede lid, onder a, genoemde
      werksoorten;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.3.b
    text: specifieke budgetten;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.3.c
    text: compensaties;
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2.3.d
    text: bijzondere bijdragen.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister geeft bij de voorlopige vaststelling bedoeld in het derde lid een indicatie van de omvang van de
      genoemde bestemmingen in de daarop volgende drie jaren.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2
  - number: 2a.1
    text: |-
      Onze Minister stelt onder voorbehoud van goedkeuring van de begroting van het ministerie van Veiligheid en Justitie
      voor 1 juli de algemene bijdrage aan een regio voor het eerstvolgende jaar voorlopig vast en geeft daarbij een
      indicatie van de algemene bijdrage aan de regio in de daaropvolgende drie jaren.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2a.2
    text: |-
      De voorlopig vastgestelde algemene bijdrage wordt betaalbaar gesteld in vier termijnen respectievelijk 15 januari,
      15 april, 15 juli en 15 oktober.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2a.3
    text: Onze Minister kan de voorlopig vastgestelde bijdrage wijzigen.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2a.4
    text: |-
      Onze Minister kan de voorlopig vastgestelde bijdrage verminderen indien niet wordt voldaan aan het gestelde bij of
      krachtens [artikel 13a, tweede lid, van het Besluit comptabele regelgeving regionale politiekorpsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006563#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006563
        artikel: 13a
  - number: 2a.5
    text: |-
      Onze Minister stelt de korpsbeheerder zo spoedig mogelijk op de hoogte van een besluit tot bijstelling als bedoeld
      in het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2a.6
    text: |-
      Verrekening van bijstellingen in de voorlopig vastgestelde algemene bijdrage vindt uiterlijk plaats op 1 december
      van het jaar waarop de voorlopige vaststelling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2a.7
    text: |-
      Onze Minister kan bij de voorlopige vaststelling van de algemene bijdrage voorwaarden verbinden aan de besteding
      van deze bijdrage.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2a
  - number: 2b.1
    text: 'Het algemene budget dat een regio ontvangt is de som van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2b
  - number: 2b.1.a
    text: |-
      het bedrag dat de regio ingevolge [artikel 2c][ref1] ontvangt als onderdeel van het deelbudget van intake en
      service in verband met de op grond van de telefoonmeting voor 2007 en 2008 vastgestelde werklast van de regio;


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2c
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2c
  - number: 2b.1.b
    text: |-
      de bedragen die de uitkomst vormen van de met toepassing van de in [artikel 2d, eerste lid][ref1],
      opgenomen formules berekende procentuele aandelen in de door Onze Minister krachtens
      [artikel 2, derde lid, onderdeel a][ref2], vastgestelde deelbudgetten per werksoort.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2d
      [ref2]: https://wetten.overheid.nl/BWBR0006562#Artikel2
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: 2d
      - id: ref2
        bwb_id: BWBR0006562
        artikel: '2'
  - number: 2b.2
    text: |-
      Voor het vaststellen van de in het eerste lid, onderdeel b, bedoelde percentages worden de uitkomsten van de
      formules van de afzonderlijke gemeenten in een regio bij elkaar opgeteld en wordt het procentuele aandeel daarvan
      berekend in het totaal van de uitkomst voor alle regio’s.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Ten aanzien van de werksoort intake en service wordt bij de berekening van het bedrag dat een regio ontvangt het
      door Onze Minister krachtens [artikel 2, derde lid][ref1], voor die werksoort vastgestelde deelbudget verminderd
      met de bedragen die de regio’s ontvangen op grond van het eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '2'
  - number: 2c.1
    text: |-
      Op basis van de telefoonmeting voor 2007 en 2008 wordt de werklast van de regio bepaald als het gemiddelde van
      de uitkomst van de formule 31,0 Ln (y) – 348,0, waarbij y het aantal met 0900-8844 gevoerde gesprekken per jaar
      weergeeft.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2c
  - number: 2c.2
    text: |-
      De regio ontvangt een bedrag ter hoogte van de uitkomst van de in het eerste lid genoemde formule, vermenigvuldigd
      met het normbedrag voor de werksoort intake en service dat door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2c
  - number: 2d.1
    text: |-
      Voor de verdeling van de door Onze Minister krachtens [artikel 2, derde lid][ref1], vastgestelde deelbudgetten
      worden de volgende formules gehanteerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006562#Artikel2
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0006562
        artikel: '2'
  - number: 2d.1.a
    text: 'voor opsporing: (a + f x GG) x (INW : 1000) + b x OAD + c x HRC + d x NWA + e x RKP;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.1.b
    text: 'voor handhaving wijkagenten: g x INW;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.1.c
    text: 'voor handhaving overig: h x GEZ + i x OAD + j x NWA1530 + k x RKP;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.1.d
    text: 'voor intake en service overig: l x INW + m x MOB + n x GEZ + o x KRW;'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.1.e
    text: 'voor noodhulp: p x INW + q x OPP.'
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.2
    text: |-
      De afkortingen die deel uitmaken van de formules hebben betrekking op de volgende omgevingskenmerken van een
      gemeente: '- *GEZ:* gezinnen met laag inkomen, zijnde het aantal gezinnen in het tweede, derde en vierde deciel van'
      de inkomensverdeling;
        - *GG:* grensgemeente, zijnde een variabele die de waarde 1 heeft indien de betreffende gemeente (over land) aan
      België of Duitsland grenst. (gemeentelijke indeling van Nederland op 1 januari 2008, CBS);
        - *HRC:* het aantal bedrijfsvestigingen met de economische activiteit «horeca»;
        - *INW:* de geregistreerde bevolking;
        - *KRW:* krachtwijken, zijnde de wijken als bedoeld in de definitieve selectie van wijken, bedoeld in de brief van
      de Minister voor Wonen, Wijken en Integratie van 31 mei 2007 (Kamerstukken II 2006/07, 30 995, nr. 5);
        - *MOB:* de som van het aantal personen dat verhuisd is binnen de gemeente en het aantal personen dat verhuisd is
      naar een andere gemeente;
        - *NWA:* niet-westerse allochtonen: een inwoner van een gemeente met als herkomstgroepering een van de landen in
      Afrika, Latijns Amerika, Azië (exclusief Indonesië en Japan) of Turkije;
        - *NWA1530:* niet-westerse allochtonen in de leeftijdsgroep van 15 tot 30 jarigen die een inwoner zijn van een
      gemeente met als herkomstgroepering een van de landen in Afrika, Latijns Amerika, Azië (exclusief Indonesië en
      Japan) of Turkije;
        - *OAD:* het gemiddelde aantal adressen per km2 dat een adres binnen zijn omgeving heeft;
        - *OPP:* de oppervlakte land in hectare volgens regionale indelingen;
        - *RKP:* regionaal klantenpotentieel, zijnde het aantal potentiële regionale klanten dat aangetrokken wordt binnen
      een straal van 60 kilometer.
    url: https://wetten.overheid.nl/BWBR0006562/2012-01-01#Artikel2d
  - number: 2d.3
    text: |-
      De constanten en coëfficiënten die deel uitmaken van de formules hebben betrekking op de waarden, genoemd in de
      onderstaande tabel:






