preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 20 maart 2015, nr. WJZ/742619(10333),
    directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van Economische Zaken;

    Gelet op de artikelen 2.4.1 en 2.5.10 van de Wet educatie en beroepsonderwijs, artikel 10b5, tweede lid, van de
    Wet op het voortgezet onderwijs, artikel 45, derde lid, van de Comptabiliteitswet 2001 en artikel VIII van de
    Wet van 16 april 2015 tot wijziging van onder meer de Wet educatie en beroepsonderwijs inzake overgang van de
    wettelijke taken van kenniscentra beroepsonderwijs bedrijfsleven naar de Samenwerkingsorganisatie beroepsonderwijs
    bedrijfsleven (Stb. 2015, 170);

    De Afdeling advisering van de Raad van State gehoord (advies van 8 april 2015, nr. W05.15.0084/l);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap van 21 mei 2015,
    nr.WJZ/758106(10333), directie Wetgeving en Juridische Zaken, uitgebracht mede namens de Staatssecretaris van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036682/2015-08-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Indien op de dag waarop de [artikelen I][ref1], [II][ref2] en
      [III][ref3] in werking treden nog geen rechtspersoon als bedoeld in
      __REF003___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________________________ (Stb. 2015, 170), is aangewezen, blijven tot
      een bij koninklijk besluit te bepalen datum [hoofdstuk 4][ref5], de [artikelen 5.1.1][ref6],
      [5.1.2][ref7], [5.2.1][ref8], [5.2.2][ref9], [5.2.4][ref10], [5.2.5][ref11], [5a.1][ref12],
      [5a.1a][ref13], [5a, 2][ref14], [5a.3][ref15], [6.3.1][ref16] en [6.3.2][ref17], [bijlage 3][ref18] en
      [bijlage 6 van het Uitvoeringsbesluit WEB][ref19], [hoofdstuk 2a van het Bekostigingsbesluit WVO][ref20] en
      het tweede gedachtestreepje met de daarbij horende tekst onder het kopje «Ministerie van Onderwijs, Cultuur
      en Wetenschap en Ministerie van Economische zaken Landbouw en Innovatie», opgenomen in de A3-lijst van
      [bijlage A bij het Aanwijzingsbesluit rechtspersonen met een beperkte kasbeheerfunctie][ref21], zoals luidend op 31
      juli 2015, van toepassing.


