  - number: '2'
    text: |-
      1 Het is verboden zich te gedragen in strijd met de volgende bepalingen van de verordening:

      a. artikel 4;

      b. artikel 5;

      c. artikel 13;

      d. artikel 15;

      e. artikel 16;

      f. artikel 17, eerste tot en met vierde lid;

      g. artikel 38, eerste lid, eerste alinea, tweede volzin, en derde lid;

      h. artikel 40, tweede lid;

      i. artikel 41, eerste lid; en

      j. bijlage II.

      2 Het is verboden een persoonlijk beschermingsmiddel dat niet is voorzien van de CE-markering, bedoeld in artikel
      3 van de verordening, of anderszins niet aan het bepaalde bij of krachtens dit besluit voldoet, op beurzen en
      exposities en bij demonstraties ten toon te stellen tenzij met inachtneming van artikel 7, tweede lid, van de
      verordening.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel2
  - number: '3'
    text: |-
      1 Het is verboden zich te gedragen in strijd met artikel 8 van de verordening.

      2 De EU-conformiteitsverklaring, bedoeld in de artikelen 8, tweede lid, en 15, tweede lid, van de verordening, is
      in ieder geval gesteld in het Nederlands of Engels.

      3 De instructies en gegevens aangaande de veiligheid alsmede de eventuele etikettering, bedoeld in artikel 8,
      zevende lid, van de verordening, zijn in ieder geval gesteld in het Nederlands.

      4 De merktekens, indicatoren en woorden en zinnen, bedoeld in artikel 2.12 van bijlage II bij de verordening, zijn
      in ieder geval gesteld in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel3
  - number: '4'
    text: Het is verboden zich te gedragen in strijd met artikel 9, tweede lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden zich te gedragen in strijd met de volgende bepalingen van de verordening:

      a. artikel 10; en

      b. artikel 12.

      2 De instructies en gegevens aangaande de veiligheid, bedoeld in artikel 10, vierde lid, van de verordening, zijn
      in ieder geval gesteld in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel5
  - number: '6'
    text: |-
      1 Het is verboden zich te gedragen in strijd met de volgende bepalingen van de verordening:

      a. artikel 11; en

      b. artikel 12.

      2 De instructies en gegevens aangaande de veiligheid, bedoeld in artikel 11, tweede lid, van de verordening, zijn
      in ieder geval gesteld in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel6
  - number: '7'
    text: |-
      1 Fabrikanten vragen de beoordeling van de conformiteit van een persoonlijk beschermingsmiddel, bedoeld in artikel
      19 van de verordening, aan bij de EU-conformiteitsbeoordelingsinstantie, bedoeld in [artikel 8][ref1].

      2 De EU-conformiteitsbeoordelingsinstantie verricht overeenkomstig de artikelen 18 en 19 van de verordening en de
      in die artikelen vermelde bijlagen de beoordeling van de conformiteit van een persoonlijk beschermingsmiddel en
      verstrekt de verklaring van EU-typeonderzoek dan wel de goedkeuring van een kwaliteitssysteem als bedoeld in de
      bijlagen IV tot en met VIII bij de verordening.

      3 De EU-conformiteitsbeoordelingsinstantie trekt een door haar verstrekte verklaring van EU-typeonderzoek of
      goedkeuring van een kwaliteitssysteem als bedoeld in de bijlagen IV tot en met VIII bij de verordening, in zodra
      de essentiële veiligheidseisen of voorgeschreven gebruiksomstandigheden, bedoeld in bijlage II bij de verordening,
      zodanig zijn gewijzigd dat het type, ontwerp of kwaliteitssysteem niet meer voldoet aan de gewijzigde eisen of
      voorgeschreven gebruiksomstandigheden op het tijdstip waarop deze volgens de verordening van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0040828#Artikel8
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0040828
        artikel: '8'
  - number: '8'
    text: |-
      1 Een verzoek als bedoeld in [artikel 7a van de wet][ref1], wordt door de aanvrager overeenkomstig artikel 27,
      eerste en tweede lid, van de verordening ingediend.

      2 Een EU-conformiteitsbeoordelingsinstantie toont aan dat zij voldoet aan de volgende bepalingen van de
      verordening:

      a. artikel 24, tweede tot en met elfde lid;

      b. artikel 32; en

      c. artikel 34.

      3 Een EU-conformiteitsbeoordelingsinstantie die taken uitbesteedt of door ondergeschikte instanties laat uitvoeren,
      toont aan dat zij voldoet aan artikel 26 van de verordening.

      4 Een EU-conformiteitsbeoordelingsinstantie toont aan dat zij voldoet aan het eerste, tweede en derde lid door
      middel van een accreditatie tegen de van toepassing zijnde geharmoniseerde normen of delen daarvan, mits die normen
      de eisen, zoals opgenomen in de in het eerste, tweede en derde lid vermelde artikelen van en bijlagen behorende
      bij de verordening dekken en de referentienummers van die normen in het Publicatieblad van de Europese Unie zijn
      bekendgemaakt.

      5 Indien de EU-conformiteitsbeoordelingsinstantie geen bewijs van accreditatie kan overleggen, verschaft zij Onze
      Minister alle bewijsstukken die nodig zijn om aan te tonen dat zij voldoet aan het eerste, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel8
    references:
      - id: ref1
