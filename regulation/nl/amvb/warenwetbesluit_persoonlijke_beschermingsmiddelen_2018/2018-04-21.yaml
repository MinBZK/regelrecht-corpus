        artikel: 7a
  - number: '9'
    text: |-
      1 Onze Minister weigert een aanwijzing als EU-conformiteitsbeoordelingsinstantie indien de aanvrager niet heeft
      voldaan aan [artikel 8][ref1].

      2 Een aanwijzing kan worden geschorst, ten nadele van de EU-conformiteitsbeoordelingsinstantie worden gewijzigd
      of ingetrokken:

      a. op grond van door de EU-conformiteitsbeoordelingsinstantie verstrekte onjuiste inlichtingen over feiten of
      omstandigheden, mits de onjuistheid daarvan aan deze instantie bekend was of kon zijn;

      b. indien de EU-conformiteitsbeoordelingsinstantie niet voldoet aan [artikel 8][ref2]; of

      c. indien de EU-conformiteitsbeoordelingsinstantie haar wettelijke verplichtingen niet naar behoren nakomt of de
      taken waarvoor zij is aangewezen, niet naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0040828#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0040828#Artikel8
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0040828
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0040828
        artikel: '8'
  - number: '10'
    text: Onze Minister verricht de taken, bedoeld in artikel 21, tweede lid, van de verordening.
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel10
  - number: '11'
    text: |-
      1 Tijdens de looptijd van de aanwijzing stelt Onze Minister periodiek vast of de EU-
      conformiteitsbeoordelingsinstantie:

      a. nog voldoet aan [artikel 8][ref1]; en

      b. haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren
      uitvoert.

      2 Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos verstrekken van
      gegevens en inlichtingen door de EU-conformiteitsbeoordelingsinstantie aan Onze Minister of de nationale
      accreditatie-instantie respectievelijk door Onze Minister of de nationale accreditatie-instantie aan de EU-
      conformiteitsbeoordelingsinstantie, die zijn verkregen door de uitvoering of het toezicht op de naleving van het
      bepaalde bij of krachtens de [wet][ref2], welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.

      3 De EU-conformiteitsbeoordelingsinstantie die haar taken waarvoor zij is aangewezen, beëindigt, of waarvan
      de aanwijzing door Onze Minister wordt ingetrokken, is verplicht tijdig voorafgaand aan de beëindiging van de
      werkzaamheden respectievelijk de datum, waarop de aanwijzing eindigt, haar dossiers over te dragen aan een andere
      EU-conformiteitsbeoordelingsinstantie waarmee een marktdeelnemer als bedoeld in artikel 3 van de verordening
      een overeenkomst is aangegaan. Indien er geen andere EU-conformiteitsbeoordelingsinstantie is, draagt de EU-
      conformiteitsbeoordelingsinstantie de dossiers over aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0040828#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel11
