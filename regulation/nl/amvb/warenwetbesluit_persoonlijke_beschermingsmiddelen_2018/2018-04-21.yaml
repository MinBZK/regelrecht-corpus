  - number: '15'
    text: |-
      1 Een persoonlijk beschermingsmiddel dat voldoet aan het [Warenwetbesluit persoonlijke beschermingsmiddelen][ref1],
      zoals dat op 20 april 2018 luidde, en vóór 21 april 2019 in de handel is gebracht, mag te allen tijde op de markt
      worden aangeboden.

      2 Een certificaat afgegeven op grond van de [wet][ref2], en geldend op 20 april 2018 wordt geacht te
      zijn afgegeven met inachtneming van de bij of krachtens dit besluit gestelde bepalingen, onverminderd
      [artikel 7, tweede en derde lid][ref3].


