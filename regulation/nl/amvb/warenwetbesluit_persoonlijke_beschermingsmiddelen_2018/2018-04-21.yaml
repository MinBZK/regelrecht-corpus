  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 maart 2018, nr. 2018-
    0000029571;

    Gelet op Verordening (EU) 2016/425 van het Europees Parlement en de Raad van 9 maart 2016 betreffende persoonlijke
    beschermingsmiddelen en tot intrekking van Richtlijn 89/686/EEG van de Raad (PbEU 2016, L 81), alsmede op artikel
    16, eerste en tweede lid, van de Arbeidsomstandighedenwet en de artikelen 4, eerste lid, 5, tweede lid, 7, 7a,
    derde lid, 11, 12, 14 en 32b van de Warenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 4 april 2018, no. W12.18.0052/III);

