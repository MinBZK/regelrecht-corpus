articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *verordening:* verordening (EU) 2016/425 van het Europees Parlement en de Raad van 9 maart 2016 betreffende
      persoonlijke beschermingsmiddelen en tot intrekking van [Richtlijn 89/686/EEG](31989L0686) van de Raad (PbEU 2016,
      L 81);

      b. *accreditatie:* hetgeen artikel 3 van de verordening daaronder verstaat;

      c. *conformiteitsbeoordeling:* hetgeen artikel 3 van de verordening daaronder verstaat;

      d. *EU-conformiteitsbeoordelingsinstantie:* conformiteitsbeoordelingsinstantie, genoemd in artikel 3 van de
      verordening;

      e. *geharmoniseerde norm:* hetgeen artikel 3 van de verordening daaronder verstaat;

      f. *nationale accreditatie-instantie:* nationale accreditatie-instantie als bedoeld in
      [artikel 3 van de Wet aanwijzing nationale accreditatie-instantie][ref1];

      g. *persoonlijk beschermingsmiddel:* hetgeen artikel 3 van de verordening daaronder verstaat; en

      h. *wet:* [Warenwet][ref2].

      2 Dit besluit en de daarop berustende bepalingen is van toepassing op een persoonlijk beschermingsmiddel waarop de
      verordening van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0026591#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0040828/2018-04-21#Artikel1
    references:
