      Een persoon die een beroep uitoefent als bedoeld in de [artikelen 3.1][ref1], [3.6][ref2],
      [7.4][ref3] of [7.5][ref4], past een diergeneesmiddel of diervoeder met medicinale werking
      in de uitoefening van dat beroep slechts toe in de gevallen die zijn aangewezen krachtens
      [artikel 5.8, eerste lid, onderdelen a en c, van het Besluit diergeneesmiddelen][ref5].


