      Als lichamelijke ingrepen als bedoeld in [artikel 2.8, tweede lid, onderdeel b, van de wet][ref1] worden
      aangewezen:

      a.

      b. het verwijderen van een deel van de achterste teen bij mannelijke kippen, mits:

      1°. het dier niet ouder is dan twee dagen, en

      2°. het dier bestemd is voor de fokkerij waarbij nakomelingen gewoonlijk worden gehouden voor menselijke
      consumptie;

      c.

      d.

      e.

      f. het aanbrengen van een neuskapje bij fazanten, mits het dier gehouden wordt of aantoonbaar bestemd is om te
      worden gehouden in een huisvestingssysteem waarvan de gebruiker kan aantonen dat het op 1 september 2001 reeds
      bestond en nadien niet is herbouwd of verbouwd.


