  - number: '5.1'
    text: |-
      1 Een dierenarts kan bij wijze van uitzondering in afwijking van de vergunning voor het in de handel brengen van
      een diergeneesmiddel, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] bij dieren waarvoor de dierenarts de
      verantwoording heeft en die niet voor de productie van levensmiddelen zijn bestemd, met name teneinde deze dieren
      onaanvaardbaar lijden te besparen, voor een aandoening waarvoor in Nederland geen diergeneesmiddel in de handel is
      gebracht, een dier behandelen met een diergeneesmiddel:

      a. waarvoor een vergunning als bedoeld in [artikel 2.1 van het Besluit diergeneesmiddelen][ref2] is verstrekt voor
      toepassing bij andere diersoorten of voor een andere aandoening bij dezelfde diersoort,

      b. waarvoor een handelsvergunning als bedoeld in [artikel 40, eerste lid, van de Geneesmiddelenwet][ref3] is
      verleend,

      c. waarvoor overeenkomstig [Richtlijn 2001/82/EG](32001L0082) in een andere EER-lidstaat een vergunning voor het in
      de handel brengen van een diergeneesmiddel voor toepassing bij dezelfde diersoort of een andere diersoort voor de
      betrokken aandoening of voor een andere aandoening is verleend, of

      d. dat ex tempore als bedoeld in [artikel 1.1 van het Besluit diergeneesmiddelen][ref4] is bereid.

      2 Een diergeneesmiddel als bedoeld in het eerste lid, onderdeel b of onderdeel c, kan slechts worden toegepast
      indien een diergeneesmiddel als bedoeld in het eerste lid, onderdeel a, niet toepasbaar of beschikbaar is.

      3 Een bereiding ex tempore als bedoeld in het eerste lid, onderdeel d, kan slechts worden toegepast, indien een
      diergeneesmiddel als bedoeld in het eerste lid, onderdeel a, onderdeel b, of onderdeel c, niet toepasbaar of
      beschikbaar is.

      4 In afwijking van het eerste lid kan de dierenarts het diergeneesmiddel onder zijn verantwoordelijkheid door
      iemand anders laten toepassen.

      5 Het eerste tot en met vierde lid is slechts van toepassing op paardachtigen indien deze paardachtigen en de
      producten daarvan niet voor menselijke consumptie bestemd zijn ingevolge een registratie in overeenstemming met bij
      ministeriële regeling voor de uitvoering van een EU-rechtshandeling voor paardachtigen vastgestelde regels.

      6 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op een diervoeder met medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel5.1
