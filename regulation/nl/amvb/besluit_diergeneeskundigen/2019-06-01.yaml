  - number: '5.3'
    text: |-
      1 In afwijking van [artikel 5.2, vijfde lid][ref1], bedraagt de wachttermijn na toepassing van een homeopathisch
      diergeneesmiddel als bedoeld in de [artikelen 3.4][ref2] en [3.5 van het Besluit diergeneesmiddelen][ref3] nul
      dagen, indien de toepassing van de farmacologisch werkzame stof in het diergeneesmiddel bij het betrokken dier
      in overeenstemming is met een krachtens artikel 27, eerste lid, van Verordening (EU) 470/2009 vastgestelde EU-
      verordening.

      2 Bij ministeriële regeling worden in het belang van de volksgezondheid, diergezondheid, dierenwelzijn of het
      milieu regels gesteld voor de toepassing van homeopathische diergeneesmiddelen als bedoeld in het eerste lid,
      waarvoor overeenkomstig artikel 16, eerste lid, van [Richtlijn 2001/82/EG](32001L0082) vóór 31 december 1993 of met
      toepassing van artikel 19, tweede lid, van [Richtlijn 2001/82/EG](32001L0082), met betrekking tot gezelschapsdieren
      of exotische dieren, een vergunning voor het in de handel brengen is verstrekt.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een diervoeder met medicinale werking.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel3.4
