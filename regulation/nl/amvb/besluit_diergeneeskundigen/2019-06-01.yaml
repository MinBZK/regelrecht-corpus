  - number: '3.9'
    text: |-
      1 Onze Minister kan voor zover dat voor de wering en de bestrijding van besmettelijke dierziekten noodzakelijk
      is voor een periode van ten hoogste één jaar personen of categorieën van personen toelaten tot het beroepsmatig
      verrichten van door Onze Minister daarbij aan te wijzen diergeneeskundige handelingen.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de opleiding die is gevolgd alsmede het examen of de
      onderdelen daarvan die met goed gevolg zijn afgelegd door de personen of categorieën van personen, bedoeld in het
      eerste lid.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de gevallen waarin, de wijze waarop en de
      periode waarin de diergeneeskundige handelingen, bedoeld in het eerste lid, kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.9
  - number: '3.10'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de betrokkenheid van de dierenarts bij het verrichten
      van de diergeneeskundige handelingen, bedoeld in [artikel 3.9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.10
