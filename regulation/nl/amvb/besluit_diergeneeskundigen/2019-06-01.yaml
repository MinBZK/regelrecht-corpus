  - number: '5.2'
    text: |-
      1 Een dierenarts kan bij wijze van uitzondering in afwijking van de vergunning voor het in de handel brengen
      van een diergeneesmiddel, bedoeld in [artikel 2.19, eerste lid, van de wet][ref1] bij dieren van een bepaald
      bedrijf waarvoor de dierenarts de verantwoording heeft en die voor de productie van levensmiddelen zijn bestemd,
      met name teneinde deze dieren onaanvaardbaar lijden te besparen, voor een aandoening waarvoor in Nederland geen
      diergeneesmiddel in de handel is gebracht, een dier behandelen met een diergeneesmiddel:

      a. waarvoor een vergunning als bedoeld in [artikel 2.1 van het Besluit diergeneesmiddelen][ref2] is verstrekt voor
      toepassing bij een andere diersoort of voor een andere aandoening bij dezelfde diersoort,

      b. waarvoor een handelsvergunning als bedoeld in [artikel 40, eerste lid, van de Geneesmiddelenwet][ref3] is
      verleend,

      c. waarvoor overeenkomstig [Richtlijn 2001/82/EG](32001L0082) in een andere EER-lidstaat een vergunning voor het
      in de handel brengen voor toepassing bij dezelfde of een andere voor de productie van levensmiddelen bestemde
      diersoort, voor de betrokken aandoening of voor een andere aandoening is verleend, of

      d. dat ex tempore als bedoeld in [artikel 1.1 van het Besluit diergeneesmiddelen][ref4] is bereid.

      2 Een diergeneesmiddel als bedoeld in het eerste lid, onderdeel b of onderdeel c, kan slechts worden toegepast
      indien een diergeneesmiddel als bedoeld in het eerste lid, onderdeel a, niet toepasbaar of beschikbaar is.

      3 Een bereiding ex tempore als bedoeld in het eerste lid, onderdeel d, kan slechts worden toegepast, indien een
      diergeneesmiddel als bedoeld in het eerste lid, onderdeel a, onderdeel b, of onderdeel c, niet toepasbaar of
      beschikbaar is.

      4 In afwijking van het eerste lid kan de dierenarts het diergeneesmiddel onder zijn verantwoordelijkheid door
      iemand anders laten toepassen.

      5 Bij de toepassing van het eerste lid worden uitsluitend diergeneesmiddelen gebruikt waarvan de farmacologisch
      werkzame stoffen zijn opgenomen in een krachtens artikel 27, eerste lid, van Verordening (EU) 470/2009 vastgestelde
      EU-verordening en de dierenarts, indien er geen informatie over de wachttermijn voor de betrokken diersoort op de
      verpakking van het diergeneesmiddel of diervoeder met medicinale werking is aangebracht of bij deze verpakking is
      gevoegd, een passende wachttermijn vaststelt die niet minder bedraagt dan:

      a. 7 dagen voor eieren,

      b. 7 dagen voor melk,

      c. vier weken voor vlees van pluimvee en zoogdieren, met inbegrip van vet en afval, en

      d. 500 graaddagen voor visvlees.

      6 Bij ministeriële regeling worden regels gesteld omtrent een door de dierenarts bij te houden administratie
      van gegevens over toepassing van diergeneesmiddelen als bedoeld in het eerste lid, waaronder inrichting van de
      administratie en bewaartermijnen.

      7 In afwijking van het vijfde lid kunnen diergeneesmiddelen waarvan de werkzame stof is vermeld op een lijst als
      bedoeld in artikel 10, derde lid, van [richtlijn 2001/82/EG](32001L0082) toegepast worden bij paardachtigen indien
      deze paardachtigen en de producten daarvan voor menselijke consumptie bestemd zijn ingevolge een registratie in
      overeenstemming met bij ministeriële regeling voor de uitvoering van een EU-rechtshandeling voor paardachtigen
      vastgestelde regels en de wachttermijn op ten minste zes maanden wordt bepaald.

      8 Het eerste tot en met zevende lid zijn van overeenkomstige toepassing op een diervoeder met medicinale werking.

      9 Het eerste tot en met zesde en achtste lid zijn niet van toepassing bij het toepassen van diergeneesmiddelen die
      substanties met hormonale werking of thyreostatische werking dan wel ß-agonisten bevatten als bedoeld in bijlagen
      II en III bij [Richtlijn 96/22/EG](31996L0022).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0032386#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0032386#Artikel1.1
