    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken, Landbouw en Innovatie van 17 september 2012, no.
    291504, directie Wetgeving en Juridische Zaken, en van de Staatssecretaris van Economische Zaken van 20 december
    2013, nr. WJZ / 13213190;

    Gelet op Richtlijn 90/167/EG van de Raad van 26 maart 1990 tot vaststelling van de voorwaarden voor de bereiding,
    het in de handel brengen en het gebruik van diervoeders met medicinale werking (PbEG 1990, L 92), Richtlijn 96/22/
    EG van de Raad van 29 april 1996 betreffende het verbod op het gebruik, in de veehouderij, van bepaalde stoffen
    met hormonale werking en van bepaalde stoffen met thyreostatische werking, alsmede van bèta-agonisten en tot
    intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG (PbEG 1996, L 125), Richtlijn 96/23/EG van de
    Raad van 29 april 1996 inzake controlemaatregelen ten aanzien van bepaalde stoffen en residuen daarvan in levende
    dieren en in produkten daarvan en tot intrekking van de Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen
    89/187/EEG en 91/664/EEG (PbEG 1996, L 125), Richtlijn 1999/74/EG van de Raad van 19 juli 1999 tot vaststelling
    van minimumnormen voor de bescherming van legkippen (PbEG 1999, L 203), Richtlijn 2001/82/EG van het Europees
    Parlement en de Raad van 6 november 2001 tot vaststelling van een communautair wetboek betreffende geneesmiddelen
    voor diergeneeskundig gebruik (PbEG 2001, L 82), Richtlijn 2005/36/EG van het Europees Parlement en de Raad van 7
    september 2005 betreffende de erkenning van beroepskwalificaties (PbEU 2005, L 255), Richtlijn 2007/43/EG van de
    Raad van 28 juni 2007 tot vaststelling van minimumvoorschriften voor de bescherming van vleeskuikens (PbEU 2007, L
    182), Richtlijn 2008/120/EG van de Raad van 18 december 2008 tot vaststelling van minimumnormen ter bescherming van
    varkens (PbEU 2009, L 47), Verordening (EU) nr. 470/2009 van het Europees Parlement en de Raad van 6 mei 2009 tot
    vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van farmacologisch
    werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG) nr. 2377/90 van
    de Raad en tot wijziging van Richtlijn 2001/82/EG van het Europees Parlement en de Raad en van Verordening (EG)
    nr. 726/2004 van het Europees Parlement en de Raad (PbEU 2009, L 152), artikel 10 van de Wet algemene bepalingen
    burgerservicenummer en de artikelen 2.8, tweede lid, onderdeel b, c en d, derde, vierde, zesde en zevende lid, 2.9,
    derde en vijfde lid, 2.20, 4.1, tweede, derde en vijfde lid, 4.3, derde lid, 7.1, 8.24, derde lid, en 8.37, tweede
    lid, van de Wet dieren;

    De Afdeling advisering van de Raad van State gehoord (advies van 2 november 2012, nr. W15.12.0381/IV, en advies van
    3 februari 2014, nr. W15.13.0473/IV);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 11 april 2014, nr. WJZ / 13006570.

    Hebben goedgevonden en verstaan:
