        artikel: '4.1'
  - number: '4.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop een aanvraag als bedoeld
      in [artikel 4.1][ref1], of een wijziging als bedoeld in [artikel 4.3][ref2], wordt ingediend en de gegevens en
      bescheiden die in het kader van de aanvraag of wijziging worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel4.4
