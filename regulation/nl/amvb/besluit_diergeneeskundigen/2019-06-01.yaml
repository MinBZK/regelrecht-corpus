  - number: '5.5'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de administratie van de ontvangst, aflevering en toepassing
      van diergeneesmiddelen, voormengsels voor diervoeder met medicinale werking en diervoeders met medicinale werking
      door dierenartsen en andere personen, die bevoegd zijn tot het verrichten van diergeneeskundige handelingen.
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel5.5
  - number: '5.6'
    text: |-
      Dierenartsen en andere personen die bevoegd zijn tot het verrichten van diergeneeskundige handelingen
      verstrekken, onverminderd [artikel 8.4, tweede lid, van de wet][ref1], aan de door Onze Minister krachtens
      [artikel 8.1, eerste lid][ref2], en [artikel 8.14, eerste lid, van de wet][ref3] aangewezen ambtenaren en aan
      de dierenarts verbonden aan de Nederlandse Voedsel- en Warenautoriteit desgevraagd alle inlichtingen over het
      voorschrijven van diergeneesmiddelen en het uitvoeren van behandelingen met diergeneesmiddelen bij dieren die voor
      de productie van levensmiddelen bestemd zijn en aan laatstgenoemde meer bepaald de inlichtingen betreffende de
      naleving door een bepaald bedrijf van krachtens [artikel 8.5, tweede lid, van het Besluit diergeneesmiddelen][ref4]
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel8.4
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel8.14
