  - number: '7.4'
    text: |-
      1 Degenen die op het tijdstip van inwerkingtreding van dit artikel in het bezit zijn van een geldige, hun
      ingevolge [artikel 5, tweede lid, van de Wet op de Uitoefening van de Diergeneeskunst][ref1] verleende vergunning
      tot uitoefening van de verloskunde, zijn toegelaten tot het verlenen van hulp met betrekking tot de geboorte of
      verwijdering van een vrucht van dieren van in die vergunning genoemde soorten, voor zover deze hulp bestaat uit het
      beroepsmatig verrichten van de in het tweede lid bedoelde diergeneeskundige handelingen.

      2 De handelingen, bedoeld in het eerste lid zijn:

      a. het zonder operatie of verdoving van het moederdier mogelijk maken van de geboorte van de vrucht, dan wel het
      verkleinen van de vrucht en het verwijderen ervan in gedeelten zonder operatie of verdoving, niet zijnde epiduraal
      anesthesie, van het moederdier;

      b. het door hem die de onder a bedoelde hulp verleent, op het moederdier vóór of onmiddellijk na de geboorte of
      verwijdering van de vrucht toepassen van de volgende handelingen welke direct met die geboorte of verwijdering
      verband houden:

      1°. het verrichten van episiotomie bij schapen, geiten, paarden en runderen alsmede het hechten van de ten gevolge
      van die handeling ontstane wond;

      2°. het stoppen van een bloeding in de geboorteweg;

      3°. het behandelen van een uterusprolaps indien deze tijdens de geboorte van de vrucht ontstaat;

      4°. het afbinden van een bloedende navelstreng van een pasgeboren vrucht;

      c. het toepassen van een diergeneesmiddel in het kader van de onder a en b genoemde ingrepen, waarvan toepassing
      krachtens een voorschrift als bedoeld in [artikel 2.19, derde lid, onderdeel a, van de wet][ref2] is toegestaan,
      waaronder begrepen het verrichten van een lichamelijke ingreep, indien die ingreep onderdeel uitmaakt van de voor
      dat diergeneesmiddel voorgeschreven toedieningswijze, voor zover deze handeling niet krachtens een ander wettelijk
      voorschrift aan anderen is voorbehouden.

      3 Degene aan wie een vergunning tot uitoefening van de verloskunde als bedoeld in het eerste lid is verleend, stelt
      Onze Minister binnen een maand in kennis van:

      a. wijzigingen ten aanzien van de bij de registratie verstrekte gegevens;

      b. de datum waarop de werkzaamheden, bedoeld in het eerste lid, zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
