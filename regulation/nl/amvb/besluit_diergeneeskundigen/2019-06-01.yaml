        artikel: '2.9'
      - id: ref2
        bwb_id: BWBR0035091
        artikel: '3.1'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.4'
    text: |-
      1 Onze Minister laat tot het beroepsmatig verrichten van de in het tweede lid bedoelde diergeneeskundige handeling,
      toe, degene die:

      a. in het bezit is van een getuigschrift als bedoeld in
      [artikel 28 van de Wet op de beroepen in de individuele gezondheidszorg][ref1],

      b. een opleiding heeft gevolgd ter verkrijging van de noodzakelijke theoretische kennis en praktische vaardigheid
      om dierfysiotherapie uit te kunnen oefenen, en

      c. met goed gevolg een examen heeft afgelegd na de opleiding, bedoeld in onderdeel b, waaruit blijkt van voldoende
      theoretische kennis en praktische vaardigheden om dierfysiotherapie te kunnen uitoefenen.

      2 De in het eerste lid bedoelde handeling is het uitoefenen van dierfysiotherapie.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de eisen waaraan een opleiding als bedoeld in het eerste lid, onderdeel b, dient te voldoen;

      b. de inrichting van een examen als bedoeld in het eerste lid, onderdeel c, en

      c. de voorwaarden waaraan is voldaan teneinde een examen als bedoeld in het eerste lid, onderdeel c, te mogen
      afleggen.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop het uitoefenen van dierfysiotherapie
      wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel28
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '28'
  - number: '3.5'
    text: |-
      Het uitoefenen van dierfysiotherapie wordt uitsluitend toegepast bij een dier na een verwijzing door een
      dierenarts.
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Onze Minister laat tot het beroepsmatig verrichten van de in het tweede lid bedoelde diergeneeskundige
      handelingen toe, degene die beschikt over een krachtens de [Wet educatie en beroepsonderwijs][ref1] vastgestelde
      kwalificatie van embryotransplanteur of embryotransplanteur/-winner, dan wel onderdelen van de kwalificatie waaraan
      een certificaat is verbonden.

      2 De handelingen, bedoeld in het eerste lid zijn:

      a. handelingen met betrekking tot het winnen en overzetten van embryo’s of eicellen bij dieren;

      b. het toepassen van een diergeneesmiddel waarvan toepassing krachtens een voorschrift als bedoeld in
      [artikel 2.19, derde lid, onderdeel a, van de wet][ref2] is toegestaan, waaronder begrepen het verrichten van
      een lichamelijke ingreep, indien die ingreep onderdeel uitmaakt van de voor dat diergeneesmiddel voorgeschreven
      toedieningswijze, voor zover deze handeling niet krachtens een ander wettelijk voorschrift aan anderen is
      voorbehouden.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de onderwerpen waarop de kwalificatie, bedoeld in het eerste lid, ten minste betrekking heeft;

      b. de onderdelen van de kwalificatie, bedoeld in het eerste lid, die ten minste zijn behaald teneinde te worden
      toegelaten;

      c. voorwaarden waaraan is voldaan teneinde de kwalificatie of onderdelen van de kwalificatie, bedoeld in het eerste
      lid, te kunnen behalen.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop handelingen als bedoeld in het
      tweede lid worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel2.19
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.6
