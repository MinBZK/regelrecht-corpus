  - number: '2.8'
    text: |-
      1 Als diergeneeskundige handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1] worden aangewezen:

      a. het beroepsmatig verrichten van ingrepen als bedoeld in de [artikelen 2.2, onderdelen b, c en e][ref2],
      [2.5, onderdeel e][ref3], [2.6, onderdelen a, b, c, d, f, j, k, l, m en n][ref4];

      b. het beroepsmatig verrichten van de ingreep, bedoeld in [artikel 2.1, onderdeel b][ref5], bij vissen;

      c. het beroepsmatig verrichten van de ingreep, bedoeld in [artikel 2.2, onderdeel d][ref6], mits de ingreep bij een
      legkip als bedoeld in artikel 2, tweede lid, onderdeel a, van [Richtlijn 1999/74/EG](31999L0074), wordt uitgevoerd
      door gekwalificeerd personeel;

      d. het beroepsmatig verrichten van de ingreep, bedoeld in [artikel 2.6, onderdeel e][ref7], mits het dier niet
      ouder is dan twee dagen;

      e. het beroepsmatig openleggen van zoolzweren bij runderen, schapen en geiten;

      f. het beroepsmatig injecteren van een mineralenoplossing bij gevogelte, mits:

      1°. het dier niet ouder is dan twee dagen, en

      2°. de handeling dient ter voorkoming van uitdroging;

      g. het beroepsmatig in opdracht van een houder afnemen van bloed bij pluimvee, voor zover deze handeling niet
      krachtens een ander wettelijk voorschrift aan anderen is voorbehouden;

      h. het beroepsmatig toepassen van een diergeneesmiddel waarvan toepassing krachtens een voorschrift als bedoeld
      in [artikel 2.19, derde lid, onderdeel a, van de wet][ref8] is toegestaan, waaronder begrepen het verrichten van
      een lichamelijke ingreep, indien die ingreep onderdeel uitmaakt van de voor dat diergeneesmiddel voorgeschreven
      toedieningswijze, voor zover de toediening subcutaan of intramusculair plaatsvindt en de handeling niet krachtens
      een ander wettelijk voorschrift aan anderen is voorbehouden.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder het afnemen van bloed bij
      pluimvee, bedoeld in het eerste lid, onderdeel g, en het toepassen van een diergeneesmiddel, bedoeld in het eerste
      lid, onderdeel h, is toegestaan.


