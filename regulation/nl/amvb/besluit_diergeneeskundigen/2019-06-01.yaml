  - number: '4.1'
    text: |-
      Een registratie als bedoeld in [artikel 4.3, eerste lid, van de wet][ref1] van een persoon die met goed gevolg een
      opleiding op het gebied van de diergeneeskunde in haar volle omvang heeft voltooid, vindt op aanvraag plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel4.1
