        artikel: '3.1'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.3'
    text: |-
      Als diergeneeskundige handelingen als bedoeld in [artikel 2.9, derde lid, van de wet][ref1], worden aangewezen het
      uitvoeren van de handelingen, bedoeld in [artikel 3.1, tweede lid][ref2], onder de leiding van een dierenarts door
      personen die een opleiding volgen ten behoeve van het behalen van een kwalificatie als bedoeld in artikel 3.1,
      eerste lid, gedurende de periode waarbinnen de opleiding wordt gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0035091/2019-06-01#Artikel3.3
