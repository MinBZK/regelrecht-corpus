      [artikel 20 van de Regeling paraveterinairen][ref12], zijn van rechtswege ingeschreven in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref13].

      3 [Artikel 4.6, eerste lid, aanhef en onderdeel a][ref14], is van overeenkomstige toepassing op de personen,
      bedoeld in het eerste lid.


