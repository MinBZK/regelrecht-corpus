  - number: '2.6'
    text: |-
      Voor zover zij dienen ter identificatie van een dier worden als lichamelijke ingrepen als bedoeld in
      [artikel 2.8, tweede lid, onderdeel b, van de wet][ref1] aangewezen:

      a. het aanbrengen van een tatoeage;

      b. het subcutaan of intramusculair aanbrengen van micro-elektronica;

      c. het aanbrengen van een oormerk in één oor bij varkens, runderen, schapen en geiten;

      d. het vriesbranden bij paarden en vissen;

      e. het aanbrengen van een merkteken aan een vleugel bij kippen;

      f. het inknippen van teenvliezen bij kippen en eenden, mits het dier niet ouder is dan twee dagen;

      g. het verwijderen van een deel van de oorschelp bij knaagdieren, onvruchtbaar gemaakte verwilderde zwerfkatten en
      dieren die in een dierentuin in groepen worden gehouden;

      h. het verwijderen van een teen bij pasgeboren knaagdieren;

      i. het nemen van ten hoogste vijf schubben bij reptielen;

      j. het verwijderen of perforeren van delen van vinnen, vetvinnen of vinstralen bij vissen;

      k. het aanbrengen bij vissen van een uitwendig merkteken, mits dit geschiedt door middel van het met een draad in
      de huid, in onderliggend spierweefsel of in een bekhoek te bevestigen genummerd metalen of kunststof plaatje of
      genummerd kunststof pijpje of slangetje;

      l.

      m.

      n. het verwijderen van de kammen bij wit bevederde mannelijke kippen, mits:

      1°. het dier jonger is dan twee dagen, en

      2°. nakomelingen van het dier gewoonlijk worden gehouden voor het leggen van eieren voor de menselijke consumptie
      of voor de productie van vaccineieren.


