        artikel: '4.3'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.5'
    text: |-
      Onze Minister draagt er zorg voor dat degene die krachtens de [artikelen 3.1, eerste lid][ref1],
      [3.4, eerste lid][ref2], [3.6, eerste lid][ref3], of [3.11, eerste lid][ref4], is toegelaten tot het
      beroepsmatig verrichten van diergeneeskundige handelingen wordt ingeschreven in het openbaar register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3.4
