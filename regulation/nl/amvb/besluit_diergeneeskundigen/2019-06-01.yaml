  - number: '4.6'
    text: |-
      Onze Minister draagt er zorg voor dat een inschrijving als bedoeld in [artikel 4.5][ref1] wordt doorgehaald indien:

      a. een persoon het beroepsmatig verrichten van diergeneeskundige handelingen, bedoeld in
      [artikel 4.1, eerste lid, van de wet][ref2], heeft beëindigd;

      b. de toelating tot het beroepsmatig verrichten van diergeneeskundige handelingen als bedoeld in
      [artikel 4.1, eerste lid, van de wet][ref3], op grond van [artikel 3.15][ref4] is ingetrokken.


