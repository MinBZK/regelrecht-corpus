  - number: '7.6'
    text: |-
      1 Dierverloskundigen en castreurs die onmiddellijk voor het tijdstip van inwerkingtreding van
      dit artikel zijn ingeschreven in het register van dierverloskundigen en castreurs, bedoeld in
      [artikel 10, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref1], zijn van rechtswege
      ingeschreven in het register, bedoeld in [artikel 4.3, eerste lid, van de wet][ref2].

      2 [Artikel 4.6, eerste lid, aanhef en onderdeel a][ref3], is van overeenkomstige toepassing op dierverloskundigen
      en castreurs.


