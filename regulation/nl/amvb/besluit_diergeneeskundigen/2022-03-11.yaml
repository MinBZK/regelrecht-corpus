      1 Tot 1 januari 2018 laat Onze Minister tot het beroepsmatig verrichten van de in
      [artikel 3.1, tweede lid][ref1] bedoelde diergeneeskundige handelingen toe, degene die beschikt
      over een krachtens de [Wet educatie en beroepsonderwijs][ref2] vastgestelde combinatie van
      deelkwalificaties die recht geeft op de erkenning dierenartsassistent paraveterinair als bedoeld in
      [artikel 9, eerste lid, van het Besluit paraveterinairen][ref3], zoals dit luidde onmiddellijk voor
      inwerkingtreding van dit besluit.

      2 Tot 1 januari 2018 laat Onze Minister tot het beroepsmatig verrichten van de in
      [artikel 3.6, tweede lid][ref4] bedoelde diergeneeskundige handelingen toe, degene die beschikt over
      een krachtens de [Wet educatie en beroepsonderwijs][ref5] vastgestelde combinatie van deelkwalificaties
      die recht geeft op de erkenning embryotransplanteur of embryotransplanteur/-winner als bedoeld in
      [artikel 6 van het Besluit paraveterinairen][ref6], zoals dit luidde onmiddellijk voor inwerkingtreding van dit
      besluit.

      3 De [artikelen 3.13 tot en met 3.16][ref7], [4.5][ref8] en [4.6][ref9] zijn van overeenkomstige toepassing op een
      toelating als bedoeld in het eerst en tweede lid.


