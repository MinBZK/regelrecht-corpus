  - number: 4.6a
    text: |-
      1 Onze Minister draagt er zorg voor dat een inschrijving als bedoeld in [artikel 2.9, derde lid][ref1], wordt
      doorgehaald indien een persoon het beroepsmatig inbrengen van injecteerbare transponders heeft beëindigd.

      2 Onze Minister kan een inschrijving als bedoeld in [artikel 2.9, derde lid][ref2], doorhalen indien de
      desbetreffende persoon in de uitoefening van zijn beroep een voorschrift heeft overtreden dat betrekking heeft op
      het welzijn of de gezondheid van dieren.

      3 [Artikel 4.3][ref3] is van overeenkomstige toepassing op degene die is ingeschreven krachtens
      [artikel 2.9, derde lid][ref4].


