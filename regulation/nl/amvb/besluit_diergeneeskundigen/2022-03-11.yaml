  - number: '5.7'
    text: |-
      1 Bij ministeriële regeling kunnen diergeneesmiddelen aangewezen worden die niet zonder voorafgaande
      kiemisolatie en gevoeligheidsbepaling door een dierenarts of andere persoon als bedoeld in
      [artikel 4.1, eerste lid, van de wet][ref1] mogen worden toegepast.

      2 Bij ministeriële regeling kunnen regels gesteld worden ten aanzien van de kwaliteit, betrouwbaarheid en
      controleerbaarheid met betrekking tot de uitvoering van de kiemisolatie en gevoeligheidsbepaling.

      3 Het is dierenartsen en andere personen als bedoeld in [artikel 4.1, eerste lid, van de wet][ref2] verboden de
      diergeneesmiddelen, bedoeld in het eerste lid, toe te passen, indien uit de gevoeligheidsbepaling blijkt dat andere
      diergeneesmiddelen toepasbaar zijn.

      4 Een dierenarts of andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref3], kan van het eerste
      tot en met het derde lid afwijken indien vanwege diergeneeskundige noodzaak een gevoeligheidsbepaling onmogelijk is
      of onmiddellijke toepassing van het diergeneesmiddel noodzakelijk is.

      5 Bij onmiddellijke toepassing van het diergeneesmiddel wordt een gevoeligheidsbepaling zo snel mogelijk alsnog
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
