    text: |-
      1 De diergeneeskundige handelingen, bedoeld in [artikel 3.6, tweede lid][ref1], worden uitsluitend uitgevoerd op
      aanwijzing van en onder controle van een dierenarts.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de dierenarts wordt geïnformeerd
      over de verrichte diergeneeskundige handelingen, bedoeld in [artikel 3.6, tweede lid][ref2], alsmede over de
      omstandigheden waaronder deze plaatsvinden.


