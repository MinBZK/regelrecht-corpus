  - number: '2.5'
    text: |-
      Als lichamelijke ingrepen als bedoeld in [artikel 2.8, tweede lid, onderdeel b, van de wet][ref1] worden
      aangewezen:

      a. het verwijderen van een deel van de staart bij ooien van de rassen Suffolk, Hampshire Down en Clun Forest, mits:

      1°. het dier niet ouder is dan zeven dagen, en

      2°. documenten kunnen worden overlegd waaruit blijkt dat de ouderdieren van de ooien zijn ingeschreven bij:

      I. een organisatie die het stamboek van genoemde rassen bijhoudt;

      II. een organisatie die niet zelf het stamboek voor genoemde rassen bijhoudt, maar die aantoont dat zij de
      beginselen die zijn vastgelegd door de organisatie of vereniging die het oorspronkelijke stamboek voor genoemde
      rassen bijhoudt, in acht neemt;

      b. het onthoornen van geiten die worden gehouden met het oog op de melkproductie of die worden gehouden op
      kinderboerderijen, van schapen en van dieren die in een dierentuin worden gehouden;

      c. het verwijderen van het gewei bij herten;

      d. het verrichten van lichamelijke ingrepen bij ongewervelden;

      e. het nemen van schubben bij vissen, mits dit geschiedt met het oog op leeftijdsonderzoek of visstandbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.8
