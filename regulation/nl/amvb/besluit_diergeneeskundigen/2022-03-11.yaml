  - number: '2.9'
    text: |-
      1 Degene die een injecteerbare transponder bij een dier aanbrengt doet hiervan een registratie bij Onze Minister
      via een daartoe door Onze Minister op grond van [artikel 3.32 van het Besluit houders van dieren][ref1] aangewezen
      elektronisch portaal.

      2 Indien een aanwijzing als bedoeld in het eerste lid ontbreekt, wordt de registratie rechtstreeks bij Onze
      Minister gedaan.

      3 Degene die een injecteerbare transponder bij een dier aanbrengt, is ingeschreven in een door Onze Minister
      bijgehouden register.

      4 Onverminderd [artikel 4.6a][ref2] wordt de registratie van een persoon in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref3] wordt overgenomen in het register, genoemd in het derde lid.

      5 Indien een houder een hond overgedragen heeft gekregen zonder injecteerbare transponder of identificatiedocument,
      wordt de hond uitsluitend geïdentificeerd door een dierenarts.

      6 Bij ministeriële regeling worden nadere regels gesteld over de registraties, bedoeld in het eerste, tweede en
      derde lid.


