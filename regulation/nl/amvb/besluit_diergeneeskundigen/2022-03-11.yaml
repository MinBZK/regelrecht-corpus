  - number: '4.8'
    text: |-
      1 Aan de betrokkene wordt op diens verzoek medegedeeld wat te zijnen aanzien in het register vermeld staat.

      2 Aan een ieder die zulks verlangt, wordt medegedeeld:

      a. of een persoon in het register, bedoeld in [artikel 4.1, eerste lid, van de wet][ref1], ingeschreven staat;

      b. indien een persoon in het register, bedoeld in [artikel 4.1, eerste lid, van de wet][ref2], ingeschreven staat:

      1°. achternaam en initialen;

      2°. geslacht;

      3°. beroepsgroep;

      4°. adres, onderscheidenlijk adressen waar de praktijk wordt uitgeoefend, met inbegrip van postcode en plaatsnaam
      onderscheidenlijk postcodes en plaatsnamen;

      5°. aantekeningen als bedoeld in [artikel 4.7, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.1
