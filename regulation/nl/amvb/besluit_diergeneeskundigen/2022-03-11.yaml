  - number: '4.2'
    text: |-
      1 Onze Minister draagt er zorg voor dat een registratie als bedoeld in [artikel 4.1][ref1], wordt doorgehaald
      indien de desbetreffende persoon het beroepsmatig verrichten van diergeneeskundige handelingen, bedoeld in
      [artikel 4.1, eerste lid, van de wet][ref2], heeft beëindigd.

      2 Onze Minister kan een registratie als bedoeld in [artikel 4.1][ref3] doorhalen indien de bij de aanvraag
      verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken dat op de aanvraag een andere beslissing
      zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden bekend waren geweest.


