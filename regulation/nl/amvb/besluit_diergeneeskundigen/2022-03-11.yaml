  - number: '5.9'
    text: |-
      1 Het bedrijfsgezondheidsplan en het bedrijfsbehandelplan, bedoeld in
      [artikel 1.28, eerste lid, van het Besluit houders van dieren][ref1], worden opgesteld door een dierenarts in
      overleg met de houder van dieren, bedoeld in artikel 1.28, eerste lid, van dat besluit.

      2 Een dierenarts handelt overeenkomstig het bedrijfsgezondheidsplan en het bedrijfsbehandelplan, bedoeld in het
      eerste lid, tenzij een diergeneeskundige noodzaak vereist dat hiervan wordt afgeweken.

      3 Bij ministeriële regeling worden regels gesteld over:

      a. de termijn waarbinnen een bedrijfsgezondheidsplan of een bedrijfsbehandelplan wordt opgesteld;

      b. de onderdelen die een bedrijfsgezondheidsplan of een bedrijfsbehandelplan ten minste bevatten;

      c. het aantal bedrijfsgezondheidsplannen of bedrijfsbehandelplannen dat kan worden opgesteld;

      d. evaluatie en aanpassing van een bedrijfsgezondheidsplan of een bedrijfsbehandelplan;

      e. administratie van een bedrijfsgezondheidsplan of een bedrijfsbehandelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.28
