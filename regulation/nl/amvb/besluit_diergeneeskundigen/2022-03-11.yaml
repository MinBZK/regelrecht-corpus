  - number: '2.1'
    text: |-
      Als lichamelijke ingrepen als bedoeld in [artikel 2.8, tweede lid, onderdeel b, van de wet][ref1] worden
      aangewezen:

      a. het verrichten van lichamelijke ingrepen betreffende het onvruchtbaar maken van dieren, met uitzondering van
      mannelijke varkens;

      b. het inbrengen van een injectienaald;

      c. het aanbrengen van een oormerk ter bestrijding van vliegen, tenzij reeds een oormerk als bedoeld in
      [artikel 2.6, onderdeel c][ref2], of een bij of krachtens enig ander wettelijk voorschrift verplicht of toegestaan
      oormerk is aangebracht;

      d. het verwijderen van bijspenen;

      e. het verrichten van een endoscopische geslachtsbepaling bij diersoorten zonder geslachtsdimorfisme;

      f. het verrichten van een keizersnede ter verkrijging van specific pathogen free dieren of gnotobionten;

      g. het verrichten van lichamelijke ingrepen betreffende een transvaginale follikelpunctie ten behoeve van het
      winnen van eicellen bij een zoogdier.


