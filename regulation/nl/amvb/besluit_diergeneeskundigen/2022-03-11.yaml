  - number: '7.5'
    text: |-
      1 Degenen die op het tijdstip van inwerkingtreding van dit artikel in het bezit zijn van een geldige, hun ingevolge
      [artikel 5, tweede lid, van de Wet op de Uitoefening van de Diergeneeskunst][ref1] verleende vergunning tot het
      castreren, zijn toegelaten tot het beroepsmatig verrichten van de in het tweede lid bedoelde diergeneeskundige
      handelingen.

      2 De handelingen, bedoeld in het eerste lid zijn:

      a. het onvruchtbaar maken van mannelijke biggen en ramlammeren en, voor zover de in de aanhef genoemde vergunning
      zich hiertoe uitstrekt, van andere mannelijke varkens en mannelijke schapen en hengsten, stieren, bokken, reuen en
      katers, een en ander mits de primaire geslachtsklieren bij deze dieren op de normale plaats aanwezig zijn en geen
      afwijkingen vertonen;

      b. het door middel van een operatie behandelen van scrotaalbreuken bij varkens, voor zover deze ingreep
      tegelijkertijd met het onvruchtbaar maken plaatsvindt;

      c. het toepassen van een diergeneesmiddel in het kader van de onder a en b genoemde ingrepen, waarvan toepassing
      krachtens verordening (EU) nr. 2019/6 is toegestaan, waaronder begrepen het verrichten van een lichamelijke
      ingreep, indien die ingreep onderdeel uitmaakt van de voor dat diergeneesmiddel voorgeschreven toedieningswijze,
      voor zover deze handeling niet krachtens een ander wettelijk voorschrift aan anderen is voorbehouden.

      3 Degene aan wie een vergunning tot het castreren als bedoeld in het eerste lid is verleend, stelt Onze Minister
      binnen een maand in kennis van:

      a. wijzigingen ten aanzien van de bij de registratie verstrekte gegevens;

      b. de datum waarop de werkzaamheden, bedoeld in het eerste lid, zijn beëindigd.


