  - number: '4.7'
    text: |-
      1 In het register, bedoeld in [artikel 4.3, eerste lid, van de wet][ref1], worden de volgende gegevens opgenomen:

      a. naam en voornamen;

      b. geslacht;

      c. geboortedatum en geboorteplaats;

      d. nationaliteit;

      e. burgerservicenummer;

      f. adres onderscheidenlijk adressen waar de praktijk wordt uitgeoefend, met inbegrip van postcode en plaatsnaam
      onderscheidenlijk postcodes en plaatsnamen;

      g. woonadres, met inbegrip van postcode en woonplaats;

      h. voor zover beschikbaar, een e-mailadres;

      i. beroepsgroep;

      j. registratienummer en datum van inschrijving.

      2 In het register, bedoeld in [artikel 4.3, eerste lid, van de wet][ref2], wordt een aantekening geplaatst van:

      a. een gedeeltelijke ontzegging van de bevoegdheid tot het beroepsmatig verrichten van diergeneeskundige
      handelingen indien een beperking is opgelegd krachtens een onherroepelijk geworden rechterlijke of tuchtrechtelijke
      uitspraak;

      b. voorwaarden of beperkingen waaronder een toelating is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0035091/2022-03-11#Artikel4.7
