  - number: '3.1'
    text: |-
      1 Onze Minister laat tot het beroepsmatig verrichten van de in het tweede lid bedoelde diergeneeskundige
      handelingen toe, degene die beschikt over een krachtens de [Wet educatie en beroepsonderwijs][ref1] vastgestelde
      kwalificatie van dierenartsassistent paraveterinair.

      2 De handelingen, bedoeld in het eerste lid, zijn:

      a. het uitvoeren van een behandeling of het onderzoeken van een dier met het oog op het voorkomen, genezen,
      verzachten, onderkennen of opheffen van een aandoening, dierziekte, zoönose, ziekteverschijnsel, gebrek, of van in-
      of uitwendig letsel of pijn, daaronder niet begrepen een operatie;

      b. het verrichten van een lichamelijke ingreep bij het toepassen van een diergeneesmiddel, indien die ingreep
      onderdeel uitmaakt van de voor dat diergeneesmiddel voorgeschreven toedieningswijze, voor zover deze handeling niet
      krachtens een ander wettelijk voorschrift aan anderen is voorbehouden;

      c. het verlenen van hulp met betrekking tot de geboorte van een vrucht van een dier, daaronder niet begrepen een
      operatie;

      d. het verrichten van handelingen ter ondersteuning van een dierenarts tijdens door de dierenarts uit te voeren
      handelingen met betrekking tot het verwijderen van een vrucht van een dier, respectievelijk onvruchtbaar maken van
      een dier;

      e. inbrengen van een injectienaald ten behoeve van het afnemen van bloed.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de onderwerpen waarop de kwalificatie, bedoeld in
      het eerste lid ten minste betrekking heeft.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop handelingen als bedoeld in het
      tweede lid worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0035091/2022-03-11#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: '3.2'
    text: |-
      1 De diergeneeskundige handelingen, bedoeld in [artikel 3.1, tweede lid, onderdelen a, b en e][ref1], worden
      uitsluitend uitgevoerd op aanwijzing van en onder controle van een dierenarts.

      2 De diergeneeskundige handelingen, bedoeld in [artikel 3.1, tweede lid, onderdelen b][ref2], voor zover het
      betreft de toepassing van een diergeneesmiddel teneinde een dier te verdoven of bedwelmen, c en d, worden
      uitsluitend uitgevoerd onder leiding van en in directe aanwezigheid van een dierenarts.


      [ref1]: https://wetten.overheid.nl/BWBR0035091#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0035091#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0035091/2022-03-11#Artikel3.2
