      Zwitserland de bevoegdheid tot uitoefening van de diergeneeskunde hebben verkregen.

      2 Voor de toepassing van de [wet][ref2] en de daarop berustende bepalingen worden personen die buiten de Europees
      Economische Ruimte of Zwitserland de bevoegdheid tot uitoefening van de diergeneeskunde in haar volle omvang hebben
      verkregen en op grond van het eerste lid zijn toegelaten, gelijk gesteld met dierenartsen.


