articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *analgesie:* behandeling om pijn weg te nemen of te bestrijden;
      - *dierfysiotherapie:* een of meer van de volgende vormen van therapie bij dieren; a. bewegingstherapie, waaronder
      wordt verstaan het uitvoeren van bewegingen op dieren; b. massagetherapie, waaronder wordt verstaan het toepassen
      van massagetechnieken op dieren; c. fysische therapie in engere zin, waaronder wordt verstaan het op dieren
      toepassen van fysische prikkels, niet zijnde ioniserende stralen, door middel van: 1°. elektrotherapie, bestaande
      uit middenfrequente en hoogfrequente stromen alsmede magneetveldtherapie; 2°. ultrageluidtherapie, bestaande uit
      behandeling met ultrageluid, al of niet in combinatie met chemische middelen of shockwave; 3°. lichttherapie,
      bestaande uit behandeling met laser, ultraviolet of infrarood licht; 4°. thermotherapie, bestaande uit behandeling
      met warmte- en koude-applicaties; 5°. hydrotherapie, bestaande uit behandeling met water, gebruik makend van
      hydrokinetische, hydrostatische en thermodynamische eigenschappen van water; 6°. balneotherapie, bestaande uit
      behandeling met baden waaraan een chemisch middel is toegevoegd; d. dry needling, waaronder wordt verstaan het
      inbrengen van naalden, niet zijnde holle naalden, in het spierweefsel van dieren;
      - *gevoeligheidsbepaling:* test die de gevoeligheid van een bacterie voor antibiotica vaststelt;
      - *gnotobiont:* dier waarvan de microflora of microfauna volledig bekend is;
      - *geslachtsdimorfisme:* het uiterlijke verschil tussen mannelijke en vrouwelijke dieren van dezelfde diersoort;
      - *identificatiecode:* code als bedoeld in artikel 2, onderdeel 18, van verordening (EU) nr. 2019/2035;
      - *infraroodmethode:* methode waarbij de snavel van een dier wordt verkort door middel van het gebruik van
      infraroodstraling;
      - *injecteerbare transponder:* injecteerbare transponder als bedoeld in bijlage III, onderdeel e, van verordening
      (EU) nr. 2019/2035 die is voorzien van een identificatiecode van het dier;
      - *jonge moederdieren:* moederdieren met een leeftijd van: a. maximaal 32 weken wanneer het dieren van
      vleeskuikenrassen betreft, of b. maximaal 30 weken wanneer het dieren van legkippenrassen betreft;
      - *kiemisolatie:* verkrijging van een zuivere kweek van bacteriën;
      - *ongewervelden:* halfgewervelde en ongewervelde dieren;
      - *operatie:* instrumentele ingreep bij dieren, gepaard gaande met verbreking van de natuurlijke samenhang van
      levende weefsels;
      - *overzetten van een embryo of eicel:* inbrengen in de gastmoeder van een embryo of eicel;
      - *pluimvee:* hoenderachtigen, eenden of ganzen;
      - *Richtlijn 1996/22/EG:* [Richtlijn 96/22/EG](31996L0022) van de Raad van 29 april 1996 betreffende het verbod
      op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking en van bepaalde stoffen met
      thyreostatische werking, alsmede van bèta-agonisten en tot intrekking van de [Richtlijnen 81/602/EEG](31981L0602),
      [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG 1996, L 125);
      - *Richtlijn 1999/74/EG:* [Richtlijn 1999/74/EG](31999L0074) van de Raad van 19 juli 1999 tot vaststelling van
      minimumnormen voor de bescherming van legkippen (PbEG 1999, L 203);
      - *Richtlijn 2007/43/EG:* [Richtlijn 2007/43/EG](32007L0043) van de Raad van 28 juni 2007 tot vaststelling van
      minimumvoorschriften voor de bescherming van vleeskuikens (PbEU 2007, L182);
      - *specific pathogen free dier:* dier dat gegarandeerd vrij is van vooraf bepaalde specifieke micro-organismen;
      - *transvaginale follikelpunctie:* met een holle naald door de vaginawand aanprikken van een eiblaasje van de
      eierstok met als doel het verkrijgen van een of meerdere eicellen;
      - *Verordening (EU) nr. 470/2009:* Verordening (EU) nr. 270/2009 van het Europees Parlement en de Raad van
      6 mei 2009 tot vaststelling van communautaire procedures voor het vaststellen van grenswaarden voor residuen van
      farmacologisch werkzame stoffen in levensmiddelen van dierlijke oorsprong, tot intrekking van Verordening (EEG)
      nr. 2377/90 van de Raad en tot wijziging van [Richtlijn 2001/82/EG](32001L0082) van het Europees Parlement en de
      Raad en van Verordening (EG) nr. 726/2004 van het Europees Parlement en de Raad (PbEU 2009, L 152);
      - *verordening (EU) nr. 2019/2035:* [verordening (EU) 2019/2035](32035R2019) van de Commissie van 28 juni 2019 tot
      aanvulling van [Verordening (EU) 2016/429](32329R2016) van het Europees Parlement en de Raad wat betreft regels
      voor inrichtingen waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde
      gehouden landdieren en broedeieren (PbEU 2019, L 314);
      - *verzamelcentrum:* plaats in Nederland ten behoeve van de verzameling van dieren;
      - *wet:* [Wet dieren][ref1];
      - *winnen van een embryo of eicel:* verkrijgen van een embryo of eicel uit een dier.


