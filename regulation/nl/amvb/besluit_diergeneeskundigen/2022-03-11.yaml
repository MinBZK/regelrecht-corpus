  - number: '2.3'
    text: |-
      Als lichamelijke ingrepen als bedoeld in [artikel 2.8, tweede lid, onderdeel b, van de wet][ref1] worden
      aangewezen:

      a. het verrichten van lichamelijke ingrepen betreffende het onvruchtbaar maken van mannelijke varkens mits:

      1°. de ingreep op andere wijze dan door het scheuren van weefsel plaatsvindt, en

      2°. indien het dier ouder is dan zeven dagen de ingreep onder anesthesie en met aanvullende langdurige analgesie
      wordt uitgevoerd;

      b. het verwijderen van een deel van de staart bij biggen, mits:

      1°. het dier niet ouder is dan vier dagen;

      2°. kwetsuren van spenen bij zeugen of van oren en staarten bij andere varkens zijn geconstateerd, en

      3°. getroffen maatregelen, waaronder het aanpassen van omgevingsfactoren of beheerssystemen, waarbij de omgeving
      en de varkensdichtheid in aanmerking worden genomen en die dienen ter voorkoming van staartbijten en andere
      gedragsstoornissen, niet werkzaam zijn gebleken;

      c. het door vijlen uniform verkleinen van hoektanden van biggen, mits:

      1°. het dier niet ouder is dan zeven dagen;

      2°. de tanden glad en intact blijven;

      3°. kwetsuren van spenen bij zeugen of van oren en staarten bij andere varkens zijn geconstateerd, en

      4°. getroffen maatregelen, waaronder het aanpassen van omgevingsfactoren of beheerssystemen, waarbij de omgeving
      en de varkensdichtheid in aanmerking worden genomen en die dienen ter voorkoming van staartbijten en andere
      gedragsstoornissen niet werkzaam zijn gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0035091/2022-03-11#Artikel2.3
