  - number: '3.18'
    text: >-
      Bij ministeriële regeling worden, ter uitvoering van EU-rechtshandelingen, regels gesteld over het beroepsmatig
      verrichten van diergeneeskundige handelingen en de toelating daartoe, die betrekking hebben op beroepskwalificaties
      en diensten.
