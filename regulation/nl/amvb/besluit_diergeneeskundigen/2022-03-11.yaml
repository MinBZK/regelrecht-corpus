  - number: '2.7'
    text: |-
      1 De ingrepen, bedoeld in de [artikelen 2.1 tot en met 2.6][ref1], worden uitgevoerd op zodanige wijze dat bij
      het dier geen onnodige pijn of onnodig letsel wordt veroorzaakt en dat het dier niet meer dan nodig is in zijn
      functioneren wordt belemmerd.

      2 Bij een dier worden ten hoogste twee lichamelijke ingrepen ter identificatie als bedoeld in [artikel 2.6][ref2]
      verricht.


