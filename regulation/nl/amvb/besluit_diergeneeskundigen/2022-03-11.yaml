  - number: '5.8'
    text: |-
      1 Een dierenarts of een andere persoon als bedoeld in [artikel 4.1, eerste lid, van de wet][ref1], doet van
      het voorschrijven of van de toepassing van bij ministeriële regeling aan te wijzen diergeneesmiddelen in bij
      ministeriële regeling aan te wijzen gevallen melding in het register waarin de houder van dieren ten behoeve van
      wiens dieren de diergeneesmiddelen zijn afgeleverd of bij wiens dieren de diergeneesmiddelen zijn toegepast, de
      melding, bedoeld in [artikel 1.27, eerste lid, van het Besluit houders van dieren][ref2] heeft gedaan.

      2 [Artikel 1.27, derde lid, van het Besluit houders van dieren][ref3] is van toepassing.

      3 [Artikel 1.27, tweede, vierde en vijfde lid, onderdeel b, van het Besluit houders van dieren][ref4] zijn van
      overeenkomstige toepassing.


