  - number: '6.1'
    text: >-
      Bij ontstentenis van benoemde leden van dezelfde beroepsgroep als de beklaagde, kunnen dierenartsen zitting nemen
      in het veterinair tuchtcollege, dan wel het veterinair beroepscollege.
    url: https://wetten.overheid.nl/BWBR0035091/2022-03-11#Artikel6.1
  - number: '7.2'
    text: |-
      1 Tot het beroepsmatig verrichten van de handelingen, bedoeld in de [artikelen 3.1, tweede lid][ref1],
      [3.4, tweede lid][ref2], [3.6, tweede lid][ref3], [3.9, eerste lid][ref4] en [3.11, eerste lid][ref5],
      zijn toegelaten personen aan wie het verrichten van die handelingen tot het tijdstip van
      inwerkingtreding van [artikel 2.9, eerste lid, van de wet][ref6] ingevolge de [artikelen 5][ref7] en
      [6 van de Wet op de uitoefening van de diergeneeskunde][ref8] en de [artikelen 2][ref9], [6][ref10] en
      [9, eerste lid, van het Besluit paraveterinairen][ref11] is toegestaan.

      2 Dierenartsassistenten paraveterinair, dierenfysiotherapeuten en embryotransplanteurs die op het
      tijdstip van inwerkingtreding van dit besluit zijn ingeschreven in het register van praktiserende
      dierenfysiotherapeuten, embryotransplanteurs, onderscheidenlijk dierenartsassistenten paraveterinair, bedoeld in
      [artikel 20 van de Regeling paraveterinairen][ref12], zijn van rechtswege ingeschreven in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref13].

      3 [Artikel 4.6, eerste lid, aanhef en onderdeel a][ref14], is van overeenkomstige toepassing op de personen,
      bedoeld in het eerste lid.


