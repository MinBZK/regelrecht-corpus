preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 23 december 1993, nr. EB93/3035, directoraat-generaal
    voor Openbare Orde en Veiligheid, directie Brandweer en Rampenbestrijding, gedaan in overeenstemming met Onze
    Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op richtlijn nr. 82/501/EEG van de Raad van de Europese Gemeenschappen van 24 juni 1982 inzake de risico's
    van zware ongevallen bij bepaalde industriële activiteiten (PbEG L 230), richtlijn nr. 89/618/Euratom van de
    Raad van de Europese Gemeenschappen van 27 november 1989 betreffende de informatie van de bevolking over de bij
    stralingsgevaar toepasselijke maatregelen ter bescherming van de gezondheid en over de alsdan te volgen gedragslijn
    (PbEG L 357) en richtlijn nr. 90/219/EEG van de Raad van de Europese Gemeenschappen van 23 april 1990 inzake het
    ingeperkte gebruik van genetisch gemodificeerde micro-organismen (PbEG L 117);

    Gelet op de artikelen 2a, vierde lid, 2c, tweede lid, 11a vierde lid, en 11b, derde lid, van de Rampenwet en de
    artikelen 8.40, eerste lid , en 8.44, eerste lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 22 maart 1994, nr. W04.94.0023);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 6 juni 1994, nr. EB 94/1029, directoraat-
    generaal voor Openbare Orde en Veiligheid, directie Brandweer en Rampenbestrijding, uitgebracht in overeenstemming
    met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.a
    text: |-
      Seveso-inrichting: Seveso-inrichting als bedoeld in [bijlage I bij het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041330
  - number: 1.1.b
    text: |-
      hogedrempelinrichting: hogedrempelinrichting als bedoeld in
      [bijlage I bij het Besluit activiteiten leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041330
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041330
  - number: 1.1.c
    text: |-
      gevaarlijke micro-organismen: niet genetisch gemodificeerde cellulaire en niet-cellulaire micro-biologische
      entiteiten met het vermogen tot vermenigvuldiging of tot overbrenging van genetisch materiaal, daaronder mede
      begrepen virussen en viroïden, die:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.c.1°
    text: |-
      voor wat betreft humane pathogenen worden ingedeeld in categorie 3 of 4 als bedoeld in
      [artikel 4.84, derde lid, onder c en d, en vierde lid, van het Arbeidsomstandighedenbesluit][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 1.1.c.2°
    text: |-
      voor wat betreft dier- en plantpathogenen een ernstige ziekte kunnen veroorzaken, en waarbij het waarschijnlijk is
      dat deze organismen zich in het milieu verspreiden, of die een toxine produceren met een LD50 voor vertebraten van
      minder dan 100 microgram per kilogram lichaamsgewicht.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.d
    text: |-
      genetisch gemodificeerde organismen: genetisch gemodificeerde organismen als bedoeld in
      [artikel 1.1 van het Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel1
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '1'
  - number: 1.1.e
    text: |-
      activiteit met genetisch gemodificeerde organismen: vervaardiging van of handeling met genetisch gemodificeerde
      organismen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.f
    text: 'toepassing op grote schaal: handelingen met kweekculturen van gevaarlijke micro-organismen van meer dan 10 liter;'
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.g
    text: |-
      gebruiker: natuurlijke persoon of rechtspersoon die op grote schaal gevaarlijke micro-organismen toepast dan wel
      een activiteit verricht met genetisch gemodificeerde organismen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.1.h
    text: |-
      ramp met stralingsgevaar: een ongeval als bedoeld in [artikel 38, onder b, van de Kernenergiewet][ref1] met een
      categorie B-object als bedoeld in [artikel 38, onder d, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel38
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '38'
  - number: '1.2'
    text: |-
      In dit besluit wordt onder bevolking tevens de beheerders van voor publiek opengestelde instellingen, waaronder
      scholen en ziekenhuizen, verstaan.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: '1.3'
    text: |-
      Dit besluit is uitsluitend van toepassing op activiteiten met genetisch
      gemodificeerde organismen op inperkingsniveau III of IV, als bedoeld in het
      [Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref1], in:


      [ref1]: https://wetten.overheid.nl/BWBR0035090
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035090
  - number: 1.3.a
    text: laboratoria voor de vervaardiging van en handelingen met genetisch gemodificeerde micro-organismen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.3.b
    text: plantenkweekcellen waarin genetisch gemodificeerde micro-organismen worden toegepast;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.3.c
    text: plantenkassen waarin genetisch gemodificeerde micro-organismen worden toegepast;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.3.d
    text: dierverblijven waarin genetisch gemodificeerde micro-organismen worden toegepast;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: 1.3.e
    text: procesinstallaties waarin genetisch gemodificeerde micro-organismen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
  - number: '1.4'
    text: |-
      In afwijking van het derde lid is dit besluit niet van toepassing op ingeperkt gebruik als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2'
  - number: '2.1'
    text: |-
      De gebruiker verstrekt voordat hij overgaat tot een toepassing op grote schaal van gevaarlijke micro-organismen
      dan wel een activiteit met genetisch gemodificeerde organismen, aan het bestuur van de veiligheidsregio waarin
      die toepassing plaats heeft, over de mogelijke rampen die zich tijdens die toepassing kunnen voordoen, de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: 2.1.a
    text: de risicobronnen en omstandigheden waaronder de rampen zich kunnen voordoen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: 2.1.b
    text: |-
      de getroffen preventieve voorzieningen, zoals de veiligheidsuitrusting, alarmsystemen, inperkingsmethoden en
      -procedures en de beschikbare hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: 2.1.c
    text: een beschrijving van de aan de werknemers verstrekte informatie;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: 2.1.d
    text: |-
      de informatie die naar het oordeel van het bestuur van de veiligheidsregio overigens nodig is om plannen ter
      bestrijding van een ramp op te stellen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onverminderd het eerste lid, verschaft de gebruiker die een activiteit verricht met genetisch gemodificeerde
      organismen aan het bestuur van de veiligheidsregio waarin een activiteit plaatsheeft, tevens de procedures en
      plannen ter verificatie van de onverminderde doeltreffendheid van de inperkingsmaatregelen. Dit geldt niet voor
      zover deze informatie reeds op grond van andere voorschriften is verschaft of kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de gebruiker de beschikking krijgt over nieuwe relevante veiligheidstechnische gegevens die een ander
      inzicht kunnen geven in de risico's voor de bevolking of het milieu die aan een toepassing op grote schaal van
      gevaarlijke micro-organismen dan wel een activiteit met genetisch gemodificeerde organismen zijn verbonden, stelt
      hij het bestuur van de veiligheidsregio hiervan zo spoedig mogelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      De gebruiker zendt de ingevolge het eerste, tweede en derde lid verstrekte informatie onmiddellijk tevens aan Onze
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      De gebruiker kan het bestuur van de veiligheidsregio verzoeken bepaalde informatie vertrouwelijk te behandelen,
      indien de openbaarmaking van deze gegevens nadelige invloed kan hebben op zijn concurrentiepositie. In dit geval
      moeten aantoonbare redenen worden aangevoerd.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het bestuur van de veiligheidsregio bepaalt na overleg met de gebruiker welke informatie, bedoeld in het eerste
      lid, vertrouwelijk zal worden behandeld, en brengt de gebruiker op de hoogte van zijn besluit.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: '3.3'
    text: 'De volgende informatie wordt in geen geval vertrouwelijk behandeld:'
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: 3.3.a
    text: de beschrijving van de toegepaste gevaarlijke micro-organismen dan wel genetisch gemodificeerde organismen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: 3.3.b
    text: de naam en het adres van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: 3.3.c
    text: de plaats en het doel van de toepassing;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: 3.3.d
    text: |-
      de methoden en plannen met betrekking tot het toezicht op de gevaarlijke micro-organismen dan wel genetisch
      gemodificeerde organismen, en de noodmaatregelen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: 3.3.e
    text: de conclusies met betrekking tot de te verwachten effecten, met name de pathogene effecten en milieuschade.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een ramp plaatsvindt verschaft een ieder die over relevante veiligheidstechnische kennis beschikt aan de
      burgemeester van de gemeente waar de ramp plaatsvindt, onmiddellijk de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.1.a
    text: de locatie waar de ramp plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.1.b
    text: de omstandigheden waaronder de ramp plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.1.c
    text: |-
      alle beschikbare gegevens aan de hand waarvan de gevolgen van de ramp voor de bevolking of het milieu kunnen worden
      beoordeeld.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een ramp plaatsvindt in een Seveso-inrichting of tijdens een toepassing op grote schaal van gevaarlijke
      micro-organismen dan wel tijdens een activiteit met genetisch gemodificeerde organismen, verstrekt degene die de
      Seveso-inrichting exploiteert respectievelijk de gebruiker de burgemeester van de gemeente waar de ramp plaatsvindt
      eigener beweging onmiddellijk behalve de in het eerste lid bedoelde gegevens tevens de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.2.a
    text: |-
      de aard en de hoeveelheid van de betrokken gevaarlijke stoffen respectievelijk de identiteit en hoeveelheid van de
      gevaarlijke micro-organismen dan wel genetisch gemodificeerde organismen die kunnen vrijkomen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.2.b
    text: de getroffen noodmaatregelen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Degene die de informatie, bedoeld in het eerste en tweede lid, heeft verschaft werkt deze informatie bij en
      verschaft de bijgewerkte informatie aan de burgemeester, indien uit nader onderzoek nieuwe gegevens naar voren
      komen die in de informatie of de daaruit getrokken conclusies wijziging brengen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien in een Seveso-inrichting of tijdens een toepassing op grote schaal van gevaarlijke micro-organismen dan wel
      tijdens een activiteit met genetisch gemodificeerde organismen een ramp heeft plaatsgevonden, stelt degene die de
      Seveso-inrichting exploiteert respectievelijk de gebruiker het bestuur van de veiligheidsregio waarin de ramp zich
      heeft voorgedaan, op zijn verzoek dan wel eigener beweging op de hoogte van:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.4.a
    text: de maatregelen die worden overwogen om de gevolgen van de ramp op middellange en lange termijn te ondervangen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: 4.4.b
    text: |-
      de maatregelen die worden overwogen om een herhaling van een dergelijke ramp te voorkomen en de gevolgen ervan
      te ondervangen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: '4.5'
    text: |-
      De gebruiker zendt de ingevolge het eerste tot en met vierde lid verschafte informatie onmiddellijk tevens aan Onze
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
  - number: '4.6'
    text: |-
      Voor zover de informatie, bedoeld in het eerste tot en met vierde lid, betrekking heeft op toepassing
      van gevaarlijke micro-organismen dan wel op een activiteit met genetisch gemodificeerde organismen, is
      [artikel 3][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel3
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.1'
    text: |-
      De informatie die het bestuur van de veiligheidsregio over mogelijke rampen en crises aan de bevolking verschaft,
      omvat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5.1.a
    text: |-
      gegevens die inzicht verschaffen in de oorsprong, de omvang en de te verwachten gevolgen voor de bevolking of het
      milieu van een dergelijke ramp of crisis;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      gegevens over de wijze waarop de bevolking bij een ramp of crisis wordt gewaarschuwd, op de hoogte gehouden en
      beschermd;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5.1.c
    text: |-
      een beschrijving van de maatregelen die de bevolking bij een ramp of crisis dient te treffen om de schadelijke
      gevolgen ervan zoveel mogelijk te beperken en gegevens omtrent de te volgen gedragslijn;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5.1.d
    text: |-
      een verwijzing naar en een globale toelichting op het beleidsplan, bedoeld in
      [artikel 14, eerste lid, van de Wet veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel14
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '14'
  - number: 5.1.e
    text: |-
      een verwijzing naar en een globale toelichting op het crisisplan, bedoeld in
      [artikel 16 van de Wet veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: 5.1.f
    text: de identiteit van de persoon die de informatie verschaft onder vermelding van zijn functie;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5.1.g
    text: gegevens over de wijze waarop, waar en bij wie aanvullende ter zake dienende informatie kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: '5.2'
    text: De informatie wordt door het bestuur van de veiligheidsregio in de meest passende vorm verschaft.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5
  - number: 5a
    text: |-
      De informatie die het bestuur van de veiligheidsregio over mogelijke rampen aan de bevolking verschaft omvat, voor
      zover deze betrekking heeft op een mogelijke ramp in een Seveso-inrichting, in aanvulling op de informatie, bedoeld
      in [artikel 5][ref1], in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 5a.a
    text: de naam of de handelsnaam van de exploitant en het volledige adres van de betreffende inrichting;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
  - number: 5a.b
    text: |-
      een bevestiging dat [paragraaf 4.2 van het Besluit activiteiten leefomgeving][ref1] en dit besluit op de inrichting
      van toepassing zijn, alsmede een bevestiging dat voldaan is aan de verplichtingen, bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Paragraaf4.2
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        paragraaf: '4.2'
  - number: 5a.b.1°
    text: |-
      [artikel 4.5 van het Besluit activiteiten leefomgeving][ref1] tot het verstrekken van gegevens en bescheiden; en


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
  - number: 5a.b.2°
    text: |-
      [artikel 4.20 van het Besluit activiteiten leefomgeving][ref1] tot het verstrekken van een veiligheidsrapport, als
      het gaat om een hogedrempelinrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
  - number: 5a.c
    text: |-
      een aanduiding van het bestuursorgaan dat bevoegd is of zou zijn een omgevingsvergunning voor de inrichting te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
  - number: 5a.d
    text: |-
      een aanduiding van de in [artikel 50, eerste lid, van de Wet veiligheidsregio’s][ref1] bedoelde verplichting om
      een ramp in een inrichting onmiddellijk aan de burgemeester te melden;


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel50
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '50'
  - number: 5a.e
    text: een begrijpelijke toelichting op de activiteit of activiteiten van de inrichting;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
  - number: 5a.f
    text: |-
      de algemene naam of, in geval van gevaarlijke stoffen uit de categorieën, bedoeld in deel I, bijlage I bij
      Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de beheersing van de gevaren
      van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en vervolgens intrekking van
      Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197), de algemene naam, onderscheidenlijk, de gevarenklasse van de
      relevante gevaarlijke stoffen in de inrichting die een zwaar ongeval kunnen veroorzaken, onder vermelding van de
      belangrijkste gevaarlijke eigenschappen in eenvoudige bewoordingen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel5a
  - number: '6'
    text: |-
      De informatie die het bestuur van de veiligheidsregio over mogelijke rampen aan de bevolking verschaft omvat, voor
      zover deze betrekking heeft op een mogelijke ramp in een hogedrempelinrichting, in aanvulling op de informatie,
      bedoeld in [artikel 5][ref1], in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 6.a
    text: 'een bevestiging dat:'
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
  - number: 6.a.1°
    text: |-
      voldaan is aan [artikel 4.22 van het Besluit activiteiten leefomgeving][ref1] over het opstellen en invoeren van
      een intern noodplan; en


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
  - number: 6.a.2°
    text: |-
      degene die de hogedrempelinrichting exploiteert, gehouden is de nodige afspraken te maken met hulpdiensten om zware
      ongevallen het hoofd te bieden en de gevolgen daarvan tot een minimum te beperken;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
  - number: 6.b
    text: |-
      algemene gegevens inzake de aard van rampen en zware ongevallen, waaronder de mogelijke gevolgen voor de menselijke
      gezondheid en het milieu en beknopte gegevens van de voornaamste soorten scenario’s voor rampen en zware ongevallen
      en de bestrijdingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
  - number: 6.c
    text: |-
      passende gegevens uit het rampbestrijdingsplan dat opgesteld is om te kunnen omgaan met eventuele effecten die een
      ramp of zwaar ongeval buiten de hogedrempelinrichting kan hebben, waaronder het advies om ten tijde van een ramp of
      zwaar ongeval gehoor te geven aan de instructies of verzoeken van de hulpdiensten;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
  - number: 6.d
    text: |-
      een indicatie, waar van toepassing, dat de inrichting zich nabij het grondgebied van een andere lidstaat bevindt,
      waardoor een zwaar ongeval grensoverschrijdende gevolgen kan hebben, krachtens het Verdrag van de Economische
      Commissie voor Europa van de Verenigde Naties inzake grensoverschrijdende gevolgen van industriële rampen en zware
      ongevallen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
  - number: 6.e
    text: |-
      specifiek op de rampenbestrijding gerichte informatie die is gebaseerd op gegevens die zijn ontleend aan het
      veiligheidsrapport, bedoeld in [artikel 4.14 van het Besluit activiteiten leefomgeving][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
  - number: 6a
    text: |-
      De informatie die het bestuur van de veiligheidsregio over mogelijke rampen aan de bevolking verschaft omvat,
      voor zover deze betrekking heeft op een mogelijke ramp in een winningsafvalvoorziening categorie A als bedoeld
      in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1], in aanvulling op de informatie, bedoeld in
      [artikel 5][ref2], in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 6a.a
    text: 'een bevestiging dat:'
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: 6a.a.1°
    text: |-
      een intern noodplan als bedoeld in [artikel 8.70 van het Besluit kwaliteit leefomgeving][ref1] is opgesteld en
      ingevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel8
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0041313
        artikel: '8'
  - number: 6a.a.2°
    text: |-
      degene die de winningsafvalvoorziening categorie A exploiteert, gehouden is de nodige afspraken te maken met
      hulpdiensten om zware ongevallen het hoofd te bieden en de gevolgen daarvan tot een minimum te beperken;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: 6a.b
    text: |-
      algemene gegevens inzake de aard van rampen en zware ongevallen, waaronder de mogelijke gevolgen voor de menselijke
      gezondheid en het milieu en beknopte gegevens van de voornaamste soorten scenario’s voor rampen en zware ongevallen
      en de bestrijdingsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: 6a.c
    text: |-
      passende gegevens uit het rampbestrijdingsplan dat opgesteld is om te kunnen omgaan met eventuele effecten die
      een ramp of zwaar ongeval buiten de locatie waarop de winningsafvalvoorziening categorie A wordt geëxploiteerd,
      kan hebben, waaronder het advies om ten tijde van een ramp of zwaar ongeval gehoor te geven aan de instructies of
      verzoeken van de hulpdiensten;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: 6a.d
    text: |-
      een indicatie, waar van toepassing, dat de winningsafvalvoorziening categorie A zich nabij het grondgebied van
      een andere lidstaat bevindt, waardoor een zwaar ongeval grensoverschrijdende gevolgen kan hebben, krachtens het
      Verdrag van de Economische Commissie voor Europa van de Verenigde Naties inzake grensoverschrijdende gevolgen van
      industriële rampen en zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: 6a.e
    text: |-
      specifiek op de rampenbestrijding gerichte informatie die is gebaseerd op gegevens die zijn ontleend aan het
      winningsafvalbeheersplan, bedoeld in artikel 5 van [Richtlijn 2006/21/EG](32006L0021) van het Europees Parlement
      en de Raad van 15 maart 2006 betreffende het beheer van afval van de winningsindustrieën en houdende wijziging van
      [Richtlijn nr. 2004/35/EG](32004L0035) (PbEU 2006, L 102).
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel6a
  - number: '7'
    text: |-
      De informatie die het bestuur van de veiligheidsregio over mogelijke rampen aan de bevolking verschaft omvat,
      voor zover deze betrekking heeft op een mogelijke ramp met stralingsgevaar en waarvan de gevolgen in beginsel
      beperkt zullen blijven tot de gemeente waar de ramp zich voordoet, in aanvulling op de informatie, bedoeld in
      [artikel 5][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 7.a
    text: basiskennis over radioactiviteit en de gevolgen daarvan voor de bevolking of het milieu;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel7
  - number: 7.b
    text: |-
      de verschillende in aanmerking genomen gevallen van stralingsgevaar en hun gevolgen voor de bevolking of het
      milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Het bestuur van de veiligheidsregio draagt er zorg voor dat de informatie, bedoeld in de
      [artikelen 5, eerste lid, onderdelen b, c en g][ref1], [5a, tweede lid][ref2], [6][ref3], [6a][ref4] en
      [7][ref5], permanent toegankelijk is voor het publiek, onder meer elektronisch.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0006755#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006755#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0006755#Artikel7
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: 5a
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006755
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006755
        artikel: 6a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref5
        bwb_id: BWBR0006755
        artikel: '7'
        hoofdstuk: III
        paragraaf: '3'
  - number: '9.1'
    text: |-
      De informatie, bedoeld in [artikel 5, onder b en c][ref1], wordt ten minste één maal per jaar verschaft en voorts
      telkens wanneer de informatie is bijgewerkt. Bijwerking vindt in ieder geval plaats wanneer in de beschreven
      maatregelen significante wijzigingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De informatie als bedoeld in het eerste lid die betrekking of mede betrekking heeft op een hogedrempelinrichting of
      winningsafvalvoorziening categorie A wordt ten minste één maal per drie jaar opnieuw bezien en zo nodig bijgewerkt.
      Bijwerking vindt voorts in ieder geval plaats wanneer in de beschreven maatregelen significante wijzigingen worden
      aangebracht en wanneer wijzigingen in de hogedrempelinrichting of winningsafvalvoorziening categorie A worden
      aangebracht die voor de gevaren van rampen belangrijke gevolgen kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel9
  - number: '9.3'
    text: |-
      De informatie, bedoeld in de [artikelen 5, onder a en d tot en met g, en 7][ref1], wordt ten minste één maal per
      vijf jaar verschaft en voorts telkens wanneer de informatie is bijgewerkt. Bijwerking vindt in ieder geval plaats
      wanneer in de beschreven maatregelen significante wijzigingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.4'
    text: |-
      De verschaffing van informatie als bedoeld in [artikel 5, onder a en d tot en met g][ref1], die betrekking of mede
      betrekking heeft op een hogedrempelinrichting of winningsafvalvoorziening categorie A alsmede van de informatie,
      bedoeld in de [artikelen 6][ref2] en [6a][ref3], geschiedt ten minste één maal in de vijf jaar en voorts telkens
      wanneer de informatie is bijgewerkt. Ten minste één maal per drie jaar wordt bezien of bijwerking nodig is.
      Bijwerking vindt in ieder geval plaats wanneer in de beschreven maatregelen significante wijzigingen worden
      aangebracht en wanneer wijzigingen in de hogedrempelinrichting of winningsafvalvoorziening categorie A worden
      aangebracht die voor de gevaren van rampen belangrijke gevolgen kunnen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006755#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006755
        artikel: 6a
        hoofdstuk: III
        paragraaf: 2a
  - number: '9.5'
    text: |-
      Het bestuur van de veiligheidsregio verschaft de informatie, bedoeld in het derde en vierde lid, eerder en werkt
      deze eerder bij, indien naar zijn oordeel ontwikkelingen in de kennis over de veiligheid en over de beoordeling van
      risico’s en over een doelmatige rampenbestrijding hiertoe nopen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de gemeente dreigt te worden getroffen door een ramp of crisis, wordt de bevolking door de
      burgemeester, dan wel door de voorzitter van de veiligheidsregio in een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], onmiddellijk gewaarschuwd, geïnformeerd en geïnstrueerd. De
      burgemeester, dan wel de voorzitter van de veiligheidsregio, kan daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: 10.1.a
    text: een verzoek aan de bevolking doen naar de radio te luisteren of naar de televisie te kijken;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel10
  - number: 10.1.b
    text: voorbereidende instructies geven aan instellingen met bijzondere collectieve taken;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel10
  - number: 10.1.c
    text: aanbevelingen doen aan bijzonder betrokken beroepen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien daartoe voldoende tijd beschikbaar is, worden de informatie en instructies, bedoeld in het eerste lid,
      aangevuld met een herhaling van de basiskennis over de aard van het dreigende gevaar en de gevolgen daarvan voor de
      bevolking of het milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      De informatie die de burgemeester, dan wel de voorzitter van de veiligheidsregio’s in een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], ten tijde van een ramp of crisis aan de bevolking verschaft,
      omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: 11.1.a
    text: |-
      specifieke gegevens over de ramp of crisis, met name over de oorsprong, de omvang en de te verwachten gevolgen voor
      de bevolking of het milieu, alsmede over het te verwachten verloop van de ramp of crisis;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.b
    text: gegevens over de wijze waarop de bevolking op de hoogte wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c
    text: |-
      een beschrijving van de maatregelen die de bevolking dient te treffen om de schadelijke gevolgen van de ramp of
      crisis zoveel mogelijk te beperken, en de te volgen gedragslijn, waarbij de maatregelen onder meer betrekking
      kunnen hebben op de volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c.1°
    text: beperken van het gebruik van bepaalde levensmiddelen die besmet kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c.2°
    text: eenvoudige hygiëne- en ontsmettingsregels;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c.3°
    text: binnenshuis blijven;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c.4°
    text: distributie en gebruik van beschermende stoffen;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.c.5°
    text: evacuatie;
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11.1.d
    text: speciale instructies voor bepaalde bevolkingsgroepen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: '11.2'
    text: De informatie, bedoeld in het eerste lid, wordt zo spoedig mogelijk en bij herhaling verschaft.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11
  - number: 11a
    text: |-
      De artikelen van dit hoofdstuk worden ten aanzien van informatie die betrekking heeft op een calamiteit in een
      hogedrempelinrichting die in een andere staat is gelegen, welke calamiteit tot een ramp in Nederland kan leiden,
      voor zover mogelijk toegepast.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel11a
  - number: '12.1'
    text: |-
      Het verschaffen van informatie, bedoeld in [artikel 46, derde lid, van de Wet veiligheidsregio’s][ref1], door
      het bestuur van de veiligheidsregio aan de bij rampenbestrijding en crisisbeheersing betrokken personen geschiedt
      schriftelijk. Deze informatie wordt geregeld bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel46
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '46'
  - number: '12.2'
    text: |-
      Het verschaffen van informatie geschiedt zodanig, dat de bij de rampenbestrijding en crisisbeheersing betrokken
      personen beseffen welke risico's hun inzet kan hebben voor hun gezondheid en dat zij in staat zijn op adequate
      wijze uitvoering te geven aan hun taken.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel12
  - number: '12.3'
    text: |-
      De informatie, bedoeld in [artikel 46, derde lid, van de Wet veiligheidsregio’s][ref1], wordt ten tijde van een
      ramp of crisis met relevante informatie aangevuld, rekening houdend met de omstandigheden van het specifieke geval.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel46
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '46'
  - number: '12.4'
    text: |-
      Indien zich een ramp met stralingsgevaar voordoet of dreigt voor te doen, wordt bij de informatie, bedoeld in
      het derde lid, in ieder geval rekening gehouden met de verschillende gevallen van stralingsgevaar die zich kunnen
      voordoen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien daartoe voldoende tijd beschikbaar is, wordt de informatie die ten tijde van een ramp of crisis wordt
      verschaft, aangevuld met een herhaling van de basiskennis over de aard van het dreigende gevaar en de gevolgen
      daarvan voor de bevolking of het milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het bestuur van de veiligheidsregio waarin een hogedrempelinrichting geheel of in hoofdzaak is gelegen,
      verschaft de informatie, bedoeld in de [artikelen 5][ref1] en [6][ref2], die betrekking heeft op die inrichting,
      tevens aan Onze Minister. Indien de bevolking of het milieu van een andere staat kan worden getroffen door
      een ramp in die inrichting, verstrekt het bestuur van de veiligheidsregio tevens de informatie, bedoeld in
      [artikel 12, eerste en tweede lid][ref3], aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006755#Artikel12
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: '6'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006755
        artikel: '12'
        hoofdstuk: IV
  - number: '13.2'
    text: |-
      Indien de bevolking of het milieu van een andere staat kan worden getroffen door een ramp tijdens een toepassing
      op grote schaal van gevaarlijke micro-organismen dan wel tijdens een activiteit met genetisch gemodificeerde
      organismen of met stralingsgevaar, verschaft het bestuur van de veiligheidsregio waarin die toepassing plaatsvindt
      of waar zich stralingsgevaar kan voordoen de informatie, bedoeld in de [artikelen 5][ref1], [7][ref2] en
      [12, eerste en tweede lid][ref3], tevens aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006755#Artikel12
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: '7'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006755
        artikel: '12'
        hoofdstuk: IV
  - number: '13.3'
    text: |-
      De verschaffing van informatie over een toepassing op grote schaal van gevaarlijke micro-organismen dan wel een
      activiteit met genetisch gemodificeerde organismen, bedoeld in het tweede lid, geschiedt voordat die toepassing
      begint.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister verstrekt de hem door het bestuur van de veiligheidsregio overeenkomstig het eerste, tweede en derde
      lid verschafte informatie na overleg met Onze Minister van Infrastructuur en Milieu aan de betrokken staat, voor
      zover de bevolking of het milieu van die andere staat kan worden getroffen.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien de bevolking of het milieu van een andere staat wordt getroffen of dreigt te worden getroffen door een ramp
      of crisis, verschaft de voorzitter van de veiligheidsregio de informatie, bedoeld in de [artikelen 11][ref1] en
      [12, derde en vierde lid][ref2], tevens aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006755#Artikel12
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006755
        artikel: '11'
        hoofdstuk: III
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006755
        artikel: '12'
        hoofdstuk: IV
  - number: '14.2'
    text: Onze Minister verstrekt de informatie, bedoeld in het eerste lid, aan de betrokken staat.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      Voor zover het betreft een ramp in een hogedrempelinrichting, tijdens een toepassing op grote schaal van
      gevaarlijke micro-organismen dan wel tijdens een activiteit met genetisch gemodificeerde organismen of met
      stralingsgevaar, verstrekt Onze Minister de informatie, bedoeld in het tweede lid, na overleg met Onze Minister van
      Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0006755/2024-01-01#Artikel14
  - number: '16'
    text: |-
      Handelen in strijd met de [artikelen 2][ref1] en [4, eerste tot en met vierde lid][ref2], is een strafbaar feit als
      bedoeld in [artikel 1a, onder 1°, van de Wet op de economische delicten][ref3].


