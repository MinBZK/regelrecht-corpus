  - number: '3'
    text: |-
      1 De spoorwegonderneming treft zodanige maatregelen, dat gedurende het gebruik van een hoofdspoorweg in haar
      opdracht geen gevaar ontstaat dat de aandacht van de bestuurder van het verkeer aldaar wordt afgeleid.

      2 Het is verboden zich in de bestuurderscabine van een trein te bevinden zonder voorafgaande toestemming van de
      betrokken spoorwegonderneming.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel3
  - number: '4'
    text: |-
      1 Het is de bestuurder verboden om gedeelten van de hoofdspoorweg, waar het verkeer niet wordt geregeld door
      lichtseinen, te gebruiken zonder voorafgaande melding daarvan aan de beheerder.

      2 De beheerder kan naar aanleiding van de melding in het belang van een veilig en ongestoord verkeer op de
      hoofdspoorweg aanwijzingen geven.

      3 De bestuurder is verplicht deze aanwijzingen op te volgen.

      4 Het eerste lid is niet van toepassing indien de hoofdspoorweginfrastructuur van het betreffende gedeelte van de
      hoofdspoorweg en het betrokken spoorvoertuig zijn voorzien van een op elkaar afgestemd en goed functionerend ERTMS.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel4
  - number: '5'
    text: |-
      1 Het is de bestuurder verboden over een hoofdspoorweg gezien de rijrichting van de trein achteruit te rijden.

      2 Het eerste lid is niet van toepassing:

      a. indien zich op of nabij de trein een rangeerder bevindt, die een onbelemmerd uitzicht heeft op de te berijden
      hoofdspoorweg en de daarbij behorende seinen en die bij voortduring in verbinding staat met de bestuurder;

      b. indien zich op, nabij of aan de trein een installatie bevindt, die de bestuurder tijdens het achteruitrijden bij
      voortduring een onbelemmerd inzicht op de veilige berijdbaarheid van de hoofdspoorweg biedt;

      c. bij het achteruitrijden met een treinstel over korte afstand uitsluitend in verband met het koppelen of
      ontkoppelen daarvan.

      3 De bestuurder is verplicht de aanwijzingen van de rangeerder onverwijld op te volgen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel5
  - number: '6'
    text: |-
      1 Het is de bestuurder verboden een trein op een hoofdspoorweg terug te zetten zonder voorafgaande melding daarvan
      aan de beheerder.

      2 De beheerder kan naar aanleiding van de melding in het belang van een veilig en ongestoord verkeer op de
      hoofdspoorweg aanwijzingen geven.

      3 De bestuurder is verplicht deze aanwijzingen op te volgen.

      4 Voor de toepassing van dit artikel wordt onder terugzetten verstaan het achteruitrijden waarbij een reeds
      gepasseerd sein, wissel, spoorwegovergang of andere verkeersbeïnvloedende installatie wederom wordt gepasseerd.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel6
  - number: '8'
    text: |-
      De bestuurder die een trein onbeheerd op een hoofdspoorweg achterlaat, zorgt ervoor dat die trein niet uit zichzelf
      in beweging kan komen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel8
  - number: '9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over het veilig en ongestoord gebruik van
      hoofdspoorwegen en spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel9
  - number: '10'
    text: |-
      1 Het is verboden met een spoorvoertuig van een hoofdspoorweg gebruik te maken dan wel gebruik te laten maken
      indien de lading daarvan buiten het bij ministeriële regeling vastgestelde omgrenzingprofiel voor spoorvoertuigen
      uitsteekt.

      2 Onverminderd [artikel 38][ref1] is het eerste lid niet van toepassing indien:

      a. de afmetingen van de lading blijven binnen het bij ministeriële regeling vastgestelde profiel;

      b. aan de beheerder voorafgaande aan dat gebruik daarvan melding is gedaan; en

      c. de door de beheerder in het belang van een veilig en ongestoord verkeer op de hoofdspoorweg gegeven aanwijzingen
      worden opgevolgd.

      3 Degene aan wie de aanwijzingen zijn gegeven is verplicht deze op te volgen.

      4 Het is verboden met een spoorvoertuig van een hoofdspoorweg gebruik te maken dan wel te laten gebruiken tenzij de
      lading daarvan zodanig is vastgezet of afgedekt, dat deze tijdens het rijden de veiligheid van het spoorverkeer op
      de hoofdspoorweg, van de betrokken trein of van de omgeving niet in gevaar brengt of kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel38
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '38'
        paragraaf: '8'
  - number: '12'
    text: |-
      Het is verboden door Onze Minister aan te wijzen spoorvoertuigen in een trein op een hoofdspoorweg te gebruiken of
      te laten gebruiken op een andere dan door Onze Minister bepaalde plaats in die trein.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel12
  - number: '13'
    text: |-
      In afwijking van de geldende paragrafen van de TSI Exploitatie en verkeersleiding mag de stralende
      verlichting geel zijn bij een trein ten aanzien waarvan een ontheffing is afgegeven op grond van
      [artikel 26k, vijfde lid, van de wet][ref1] of [artikel 26q, zesde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26q
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: 26k
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 26q
  - number: '15'
    text: |-
      Het is de spoorwegonderneming verboden een trein te laten vertrekken als de procedures genoemd in de geldende
      paragrafen van de TSI Exploitatie en verkeersleiding niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel15
  - number: '17'
    text: |-
      Het is verboden met een spoorvoertuig over een hoofdspoorweg te rijden of te doen of laten rijden indien het
      gewicht van de lading daarvan het voor dat voertuig vastgestelde maximum laadvermogen overschrijdt.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel17
  - number: '18'
    text: |-
      Op hoofdspoorwegen als bedoeld in [bijlage 2 bij het Besluit aanwijzing hoofdspoorwegen][ref1] bedraagt de
      maximumsnelheid 30 kilometer per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0017794#Artikel2
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017794
        artikel: '2'
  - number: '19'
    text: |-
      1 Onverminderd [artikel 18][ref1] en de door seinen aangegeven maximumsnelheid is het de bestuurder verboden over
      een hoofdspoorweg te rijden met een hogere dan door de betrokken spoorwegonderneming voor de trein vastgestelde
      maximum snelheid.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over het vaststellen van de maximum snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel18
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '18'
        paragraaf: '4'
  - number: '20'
    text: |-
      1 Onverminderd [artikel 18][ref1] is het de bestuurder verboden over een hoofdspoorweg te rijden met een zodanige
      snelheid, dat hij niet in staat is de trein tot stilstand te brengen binnen de afstand waarover hij de spoorweg kan
      overzien en waarover deze vrij is, indien:

      a. hij rijdt op een gedeelte van de hoofdspoorweg waar het verkeer niet wordt geregeld door lichtseinen,

      b. hij op aanwijzing van de beheerder een lichtsein voorzien van een onderbord met het opschrift P als bedoeld in
      [bijlage 4 van de Regeling spoorverkeer][ref2] passeert dat een rood licht uitstraalt,

      c. hij rijdt op een gedeelte van de hoofdspoorweg dat buiten dienst is gesteld,

      d. hij via de voorgeschreven communicatiemiddelen een alarmsignaal heeft ontvangen, met dien verstande dat de
      snelheid ten hoogste 40 km/h mag bedragen.

      2 Onze Minister kan gedeelten van de hoofdspoorweg als bedoeld in het eerste lid, onderdeel a, aanwijzen waarop het
      verbod, bedoeld in dat lid, niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '18'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0017707
  - number: '21'
    text: |-
      1 De bestuurder die over hoofdspoorwegen als bedoeld in [bijlage 2 bij het Besluit aanwijzing hoofdspoorwegen][ref1]
      rijdt, die gelegen zijn in een kruising of een samenloop met een voor het openbaar verkeer openstaande weg als
      bedoeld in de [Wegenverkeerswet 1994][ref2] en die niet worden aangeduid als een overweg door middel van de borden
      J12 en J13 van [bijlage 1 bij RVV 1990][ref3] is verplicht:

      a. de snelheid te verminderen en zo nodig te stoppen als de veiligheid van het verkeer dat verlangt;

      b. de weggebruikers voor te laten gaan;

      c. de aanwijzingen 1 tot en met 7 van [bijlage 2, behorende bij RVV 1990][ref4], op te volgen;

      d. aan de weggebruikers de voor het rijden van de trein en voor de veiligheid van het verkeer benodigde stoptekens,
      bedoeld in [artikel 82, vierde lid, van RVV 1990][ref5], en andere aanwijzingen te geven.

      2 Wanneer de bestuurder de stoptekens en aanwijzingen in het eerste lid, onder d, niet kan geven, worden deze
      gegeven door de rangeerder die de trein begeleidt.


      [ref1]: https://wetten.overheid.nl/BWBR0017794
      [ref2]: https://wetten.overheid.nl/BWBR0006622
      [ref3]: https://wetten.overheid.nl/BWBR0004825
      [ref4]: https://wetten.overheid.nl/BWBR0004825
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017794
      - id: ref2
        bwb_id: BWBR0006622
      - id: ref3
        bwb_id: BWBR0004825
      - id: ref4
        bwb_id: BWBR0004825
      - id: ref5
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '22'
    text: |-
      1 Op kruisingen van hoofdspoorwegen met niet voor het openbaar verkeer openstaande wegen verlenen weggebruikers
      voorrang aan spoorvoertuigen.

      2 Het is weggebruikers verboden een kruising als bedoeld in het eerste lid op te rijden of te betreden:

      a. indien zij deze niet terstond geheel kunnen passeren en deze niet geheel vrij kunnen maken;

      b. indien aldaar door een begeleider van een trein een stopteken overeenkomstig model F 10 van
      [bijlage I van het RVV 1990][ref1], een rode vlag of een rode lamp wordt getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '26'
    text: |-
      1 De beheerder kan bij gestoord bedrijf, incidenten of noodsituaties aan de bestuurder of andere personen die
      deelnemen aan het spoorverkeer, aanwijzingen geven inzake het veilig en ongestoord gebruik van de hoofdspoorweg.
      Deze personen zijn verplicht deze aanwijzingen op te volgen.

      2 De maatregelen die worden gehanteerd bij gestoord bedrijf, incidenten, noodsituaties en bij het herstel van het
      veilige en ongestoorde treinverkeer houden in elk geval in dat de beheerder een noodplan opstelt dat voldoet aan
      artikel 54, eerste lid, van [richtlijn 2012/34/EU](32012L0034).

      3 De spoorwegonderneming doet onverwijld melding aan Onze Minister van storingen of andere onregelmatigheden die
      een veilig en ongestoord gebruik van de hoofdspoorweg in gevaar brengen of kunnen brengen, voor zover deze een
      trein betreffen waarmee in haar opdracht gebruik wordt gemaakt van de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel26
  - number: '27'
    text: Het is verboden zonder noodzaak de noodreminrichting van een trein in werking te stellen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel27
  - number: '28'
    text: |-
      Het is de bestuurder verboden tijdens het vertrek van de trein een remming als gevolg van het gebruik van de
      noodreminrichting te onderbreken.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel28
  - number: '29'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

        - parkeren: op een spoorwegemplacement laten stilstaan van een trein anders dan gedurende de tijd die nodig is voor
      en gebruikt wordt tot het onmiddellijk in- of uitstappen van reizigers of voor het onmiddellijk laden of lossen
      van goederen;
        - rangeren: op een spoorwegemplacement splitsen of opnieuw samenvoegen van treinen, dan wel in een bepaalde
      volgorde op een spoor of naar andere sporen manoeuvreren;
        - spoorwegemplacement: op grond van [artikel 30][ref1] aangewezen deel van de hoofdspoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel30
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '30'
        paragraaf: '7'
  - number: '30'
    text: Bij ministeriële regeling worden delen van hoofdspoorwegen aangewezen als spoorwegemplacementen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel30
  - number: '31'
    text: |-
      Bij rangeren en parkeren kunnen de regels met betrekking tot geluidsinstallaties, verlichting en sluitseinen uit de
      TSI Exploitatie en verkeersleiding buiten toepassing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel31
  - number: '32'
    text: Het is de bestuurder verboden om bij het rangeren te rijden met een hogere snelheid dan 40 kilometer per uur.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel32
  - number: '33'
    text: |-
      De spoorwegonderneming verstrekt voordat in haar opdracht wordt gerangeerd, aan de bestuurder en de rangeerder een
      rangeeropdracht en aan de beheerder een rangeerplan.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel33
  - number: '34'
    text: |-
      1 Een trein is tijdens het gebruik van een hoofdspoorweg uitsluitend binnen een spoorwegemplacement aan de voor- en
      aan de achterzijde voorzien van tenminste een brandend wit licht.

      2 Het eerste lid is niet van toepassing gedurende de periode dat een trein is geparkeerd.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel34
  - number: '35'
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden over aanwijzingen als bedoeld in de
      [artikelen 4, tweede lid][ref1], [6, tweede lid][ref2], en [10, tweede lid, onderdeel c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017624#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017624#Artikel10
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017624
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017624
        artikel: '10'
        paragraaf: '3'
  - number: '36'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de aard, uitvoering, plaatsing, bediening en betekenis
      van seinen.
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel36
  - number: '37'
    text: |-
      De beheerder draagt er zorg voor:

      a. dat gedeelten van de hoofdspoorweg, die buiten dienst zijn gesteld worden aangeduid met de daartoe door de
      beheerder aangewezen seinen overeenkomstig het krachtens [artikel 36][ref1] bepaalde;

      b. dat de hoofdspoorweg ter plaatse waar werkzaamheden aan of nabij die hoofdspoorweg worden uitgevoerd, in de bij
      ministeriële regeling bepaalde gevallen buiten dienst wordt gesteld of doelmatig wordt afgeschermd;

      c. dat tijdens de uitvoering van werkzaamheden aan of nabij de hoofdspoorweg gebruik wordt gemaakt van goed
      functionerende automatische waarschuwingsapparatuur als bedoeld in normblad nummer 730-3 van de Internationale
      Spoorweg Unie op de wijze als in dat normblad bepaald, of van goed functionerende andere bij ministeriële regeling
      voorgeschreven apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel36
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '36'
        paragraaf: '8'
  - number: '38'
    text: |-
      1 Onze Minister kan, gehoord de beheerder, ontheffing of vrijstelling verlenen van het bepaalde in
      [artikel 12][ref1].

      2 Aan de ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden in het belang van een
      veilig en ongestoord gebruik van de hoofdspoorwegen.

      3 Onze Minister kan, de beheerder gehoord indien het de toepassing van [artikel 12][ref2] betreft, de ontheffing of
      vrijstelling wijzigen of intrekken:

      a. indien de door de aanvrager verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn, dat op de
      aanvraag anders zou zijn beslist indien de juiste gegevens bij de beoordeling van de aanvraag bekend zouden zijn
      geweest;

      b. in het belang van een veilig en ongestoord gebruik van de hoofdspoorwegen.

      4 Het is verboden te handelen in strijd met de voorschriften of beperkingen, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0017624#Artikel12
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '12'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0017624
        artikel: '12'
        paragraaf: '3'
  - number: '39'
    text: |-
      Overtreding van de [artikelen 22][ref1] en [27][ref2] vormt een strafbaar feit in de zin van
      [artikel 87, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0017624#Artikel27
