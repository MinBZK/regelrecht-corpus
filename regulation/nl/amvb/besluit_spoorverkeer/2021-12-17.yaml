preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 16 september 2003, Hoofddirectie Juridische
    Zaken, nr. HDJZ/S&W/2003-1877;

    Gelet op richtlijn 2001/14/EG en op de artikelen 23, 64, 65 en 87, eerste lid, van de Spoorwegwet;

    De Raad van State gehoord (advies van 19 december 2003, nr. W09.03.0393/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/S&W/2004-2899,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - bestuurder: bestuurder van een trein;
        - gebruik van een hoofdspoorweg: met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - gevaarlijke stoffen: gevaarlijke stoffen als bedoeld in de [Wet vervoer gevaarlijke stoffen][ref1];
        - hoofdspoorweg: hoofdspoorweg als bedoeld in [artikel 2, tweede lid][ref2], of
      [artikel 124, tweede lid, van de wet][ref3];
        - rangeerder: persoon die een trein begeleidt;
        - sein: verkeersteken inhoudende een ge- of verbod, een waarschuwing of een aanduiding;
        - trein: spoorvoertuig of samenstel van spoorvoertuigen;
        - treinstel: spoorvoertuig met eigen voortbeweginginrichting, bestemd voor het vervoer van personen en goederen,
      niet zijnde een spoorvoertuig met eigen voortbeweginginrichting, hoofdzakelijk bestemd en ingericht om andere
      spoorvoertuigen voort te bewegen;
        - *TSI Exploitatie en verkeersleiding:* Uitvoerings[verordening (EU) 2019/773](32673R2019) van de Commissie van
      16 mei 2019 betreffende de technische specificaties inzake interoperabiliteit van het subsysteem exploitatie en
      verkeersleiding van het spoorwegsysteem in de Europese Unie en tot intrekking van Besluit 2012/757/EU (PbEU 2019,
      L 139I);
        - wet: de [Spoorwegwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0017624/2021-12-17#Artikel1
