preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 16 september 2003, Hoofddirectie Juridische
    Zaken, nr. HDJZ/S&W/2003-1877;

    Gelet op richtlijn 2001/14/EG en op de artikelen 23, 64, 65 en 87, eerste lid, van de Spoorwegwet;

    De Raad van State gehoord (advies van 19 december 2003, nr. W09.03.0393/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 november 2004, nr. HDJZ/S&W/2004-2899,
    Hoofddirectie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - bestuurder: bestuurder van een trein;
        - gebruik van een hoofdspoorweg: met een spoorvoertuig rijden over of stilstaan op een hoofdspoorweg;
        - gevaarlijke stoffen: gevaarlijke stoffen als bedoeld in de [Wet vervoer gevaarlijke stoffen][ref1];
        - hoofdspoorweg: hoofdspoorweg als bedoeld in [artikel 2, tweede lid][ref2], of
      [artikel 124, tweede lid, van de wet][ref3];
        - rangeerder: persoon die een trein begeleidt;
        - sein: verkeersteken inhoudende een ge- of verbod, een waarschuwing of een aanduiding;
        - *TSI Exploitatie en verkeersleiding:* Uitvoerings[verordening (EU) 2019/773](32673R2019) van de Commissie van
      16 mei 2019 betreffende de technische specificaties inzake interoperabiliteit van het subsysteem exploitatie en
      verkeersleiding van het spoorwegsysteem in de Europese Unie en tot intrekking van Besluit 2012/757/EU (PbEU 2019,
      L 139I);
        - wet: de [Spoorwegwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0015007#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0015007
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0015007
        artikel: '124'
      - id: ref4
        bwb_id: BWBR0015007
  - number: '4.1'
    text: |-
      Het is verboden om gedeelten van de hoofdspoorweg, waar het verkeer niet wordt geregeld door lichtseinen, te
      gebruiken zonder voorafgaande toestemming daarvoor van de beheerder.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel4
  - number: '4.2'
    text: |-
      In het belang van een veilig en ongestoord verkeer op de hoofdspoorweg kan de beheerder aanwijzingen verbinden aan
      de toestemming.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel4
  - number: '4.3'
    text: De aanwijzingen, bedoeld in het tweede lid, worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste lid is niet van toepassing indien de hoofdspoorweginfrastructuur van het betreffende gedeelte van de
      hoofdspoorweg en het betrokken spoorvoertuig zijn voorzien van een op elkaar afgestemd en goed functionerend ERTMS.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel4
  - number: '5.1'
    text: Het is verboden over een hoofdspoorweg gezien de rijrichting van de trein achteruit te rijden.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: 5.2.a
    text: |-
      indien zich op of nabij de trein een rangeerder bevindt, die een onbelemmerd uitzicht heeft op de te berijden
      hoofdspoorweg en de daarbij behorende seinen en die bij voortduring in verbinding staat met de bestuurder;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: 5.2.b
    text: |-
      indien zich op, nabij of aan de trein een installatie bevindt, die de bestuurder tijdens het achteruitrijden bij
      voortduring een onbelemmerd inzicht op de veilige berijdbaarheid van de hoofdspoorweg biedt;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: 5.2.c
    text: |-
      bij het achteruitrijden met een treinstel over korte afstand uitsluitend in verband met het koppelen of ontkoppelen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: '5.3'
    text: De aanwijzingen van de rangeerder worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel5
  - number: '6.1'
    text: |-
      Het is verboden een trein op een hoofdspoorweg terug te zetten zonder voorafgaande toestemming daarvoor van de
      beheerder.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel6
  - number: '6.2'
    text: |-
      In het belang van een veilig en ongestoord verkeer op de hoofdspoorweg kan de beheerder aanwijzingen verbinden aan
      de toestemming.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel6
  - number: '6.3'
    text: De aanwijzingen, bedoeld in het tweede lid, worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel6
  - number: '6.4'
    text: |-
      Voor de toepassing van dit artikel wordt onder terugzetten verstaan het achteruitrijden waarbij een reeds
      gepasseerd sein, wissel, spoorwegovergang of andere verkeersbeïnvloedende installatie wederom wordt gepasseerd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel6
  - number: '9'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over het veilig en ongestoord gebruik van
      hoofdspoorwegen en spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel9
  - number: '10.1'
    text: |-
      Het is verboden met een spoorvoertuig van een hoofdspoorweg gebruik te maken dan wel gebruik te laten maken
      indien de lading daarvan buiten het in het infrastructuurregister vermelde referentieprofiel voor spoorvoertuigen
      uitsteekt.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: '10.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: 10.2.a
    text: de afmetingen van de lading blijven binnen het in de netverklaring vastgestelde profiel; en
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: 10.2.b
    text: de beheerder voorafgaand aan het gebruik daarvoor toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: '10.3'
    text: |-
      In het belang van een veilig en ongestoord verkeer op de hoofdspoorweg kan de beheerder aanwijzingen verbinden aan
      de toestemming.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: '10.4'
    text: De aanwijzingen, bedoeld in het derde lid, worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel10
  - number: '13'
    text: |-
      In afwijking van de geldende paragrafen van de TSI Exploitatie en verkeersleiding mag de stralende
      verlichting geel zijn bij een trein ten aanzien waarvan een ontheffing is afgegeven op grond van
      [artikel 26k, vijfde lid, van de wet][ref1] of [artikel 26q, zesde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel26k
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel26q
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015007
        artikel: 26k
      - id: ref2
        bwb_id: BWBR0015007
        artikel: 26q
  - number: '18'
    text: |-
      Op hoofdspoorwegen als bedoeld in [bijlage 2 bij het Besluit aanwijzing hoofdspoorwegen][ref1] bedraagt de
      maximumsnelheid 30 kilometer per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0017794#Artikel2
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0017794
        artikel: '2'
  - number: '19.1'
    text: |-
      Onverminderd [artikel 18][ref1] en de door de seinen aangegeven maximumsnelheid is de snelheid op de hoofdspoorweg
      niet hoger dan de door de betrokken spoorwegonderneming voor de trein vastgestelde maximumsnelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel18
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '18'
        paragraaf: '4'
  - number: '19.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over het vaststellen van de maximum snelheid.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel19
  - number: '20.1'
    text: |-
      Onverminderd [artikel 18][ref1] is de snelheid op de hoofdspoorweg niet hoger dan de snelheid waarmee de trein tot
      stilstand kan worden gebracht binnen de afstand waarover de spoorweg te overzien en vrij is, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel18
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '18'
        paragraaf: '4'
  - number: 20.1.a
    text: wordt gereden op een gedeelte van de hoofdspoorweg waar het verkeer niet wordt geregeld door lichtseinen;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
  - number: 20.1.b
    text: |-
      op aanwijzing van de beheerder een hoofdsein dat een rood licht uitstraalt en is voorzien van een onderbord met het
      opschrift P als bedoeld in [bijlage 4 van de Regeling spoorverkeer][ref1] wordt gepasseerd;


      [ref1]: https://wetten.overheid.nl/BWBR0017707
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0017707
  - number: 20.1.c
    text: wordt gereden op een gedeelte van de hoofdspoorweg dat buiten dienst is gesteld; of
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
  - number: 20.1.d
    text: |-
      via de voorgeschreven communicatiemiddelen een alarmsignaal is ontvangen, met dien verstande dat de snelheid ten
      hoogste 40 kilometer per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister kan gedeelten van de hoofdspoorweg als bedoeld in het eerste lid, onderdeel a, aanwijzen waarop het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel20
  - number: '21.1'
    text: |-
      Indien gereden wordt over hoofdspoorwegen als bedoeld in
      [bijlage 2 bij het Besluit aanwijzing hoofdspoorwegen][ref1], die gelegen zijn in een kruising of een samenloop
      met een voor het openbaar verkeer openstaande weg als bedoeld in de [Wegenverkeerswet 1994](onbekend), en die niet
      worden aangeduid als een overweg door middel van de borden J12 en J13 van [bijlage 1 bij RVV 1990][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0017794
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017794
      - id: ref2
        bwb_id: BWBR0004825
  - number: 21.1.a
    text: wordt de snelheid verminderd en wordt zo nodig gestopt als de veiligheid van het verkeer dat verlangt;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
  - number: 21.1.b
    text: wordt de weggebruikers voorrang verleend;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
  - number: 21.1.c
    text: |-
      worden de aanwijzingen 1 tot en met 7 van [bijlage 2, behorende bij RVV 1990][ref1], opgevolgd;


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 21.1.d
    text: |-
      worden aan de weggebruikers de voor het rijden van de trein en voor de veiligheid van het verkeer benodigde
      stoptekens, bedoeld in [artikel 82, vierde lid, van RVV 1990][ref1], en andere aanwijzingen gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '21.2'
    text: |-
      Wanneer de stoptekens en aanwijzingen, bedoeld in het eerste lid, onderdeel d, niet door de bestuurder kunnen
      worden gegeven, worden deze gegeven door de begeleider van de trein.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel21
  - number: '22.1'
    text: |-
      Op kruisingen van hoofdspoorwegen met niet voor het openbaar verkeer openstaande wegen verlenen weggebruikers
      voorrang aan spoorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel22
  - number: '22.2'
    text: 'Het is weggebruikers verboden een kruising als bedoeld in het eerste lid op te rijden of te betreden:'
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel22
  - number: 22.2.a
    text: indien zij deze niet terstond geheel kunnen passeren en deze niet geheel vrij kunnen maken;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel22
  - number: 22.2.b
    text: |-
      indien aldaar door een begeleider van een trein een stopteken overeenkomstig model F 10 van
      [bijlage I van het RVV 1990][ref1], een rode vlag of een rode lamp wordt getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '26.1'
    text: |-
      De beheerder kan bij gestoord bedrijf, incidenten of noodsituaties aan de bestuurder of andere personen die
      deelnemen aan het spoorverkeer, aanwijzingen geven inzake het veilig en ongestoord gebruik van de hoofdspoorweg.
      Deze personen zijn verplicht deze aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel26
  - number: '26.2'
    text: |-
      De maatregelen die worden gehanteerd bij gestoord bedrijf, incidenten, noodsituaties en bij het herstel van het
      veilige en ongestoorde treinverkeer houden in elk geval in dat de beheerder een noodplan opstelt dat voldoet aan
      artikel 54, eerste lid, van [richtlijn 2012/34/EU](32012L0034).
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel26
  - number: '26.3'
    text: |-
      De spoorwegonderneming doet onverwijld melding aan Onze Minister van storingen of andere onregelmatigheden die een
      veilig en ongestoord gebruik van de hoofdspoorweg in gevaar brengen of kunnen brengen, voor zover deze een trein
      betreffen waarmee in haar opdracht gebruik wordt gemaakt van de hoofdspoorweg.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel26
  - number: '29'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder: - parkeren: op een spoorwegemplacement laten stilstaan
      van een trein anders dan gedurende de tijd die nodig is voor en gebruikt wordt tot het onmiddellijk in- of
      uitstappen van reizigers of voor het onmiddellijk laden of lossen van goederen;
        - rangeren: op een spoorwegemplacement splitsen of opnieuw samenvoegen van treinen, dan wel in een bepaalde
      volgorde op een spoor of naar andere sporen manoeuvreren;
        - spoorwegemplacement: op grond van [artikel 30][ref1] aangewezen deel van de hoofdspoorweg.


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel30
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '30'
        paragraaf: '7'
  - number: '30'
    text: Bij ministeriële regeling worden delen van hoofdspoorwegen aangewezen als spoorwegemplacementen.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel30
  - number: '31'
    text: |-
      Bij rangeren en parkeren kunnen de regels met betrekking tot geluidsinstallaties, verlichting en sluitseinen uit de
      TSI Exploitatie en verkeersleiding buiten toepassing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel31
  - number: '32'
    text: Het is verboden om bij het rangeren te rijden met een hogere snelheid dan 40 kilometer per uur.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel32
  - number: '33'
    text: |-
      De spoorwegonderneming verstrekt voordat in haar opdracht wordt gerangeerd, aan de bestuurder en de rangeerder een
      rangeeropdracht en aan de beheerder een rangeerplan.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel33
  - number: '34.1'
    text: |-
      Een trein is tijdens het gebruik van een hoofdspoorweg uitsluitend binnen een spoorwegemplacement aan de voor- en
      aan de achterzijde voorzien van tenminste een brandend wit licht.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel34
  - number: '34.2'
    text: Het eerste lid is niet van toepassing gedurende de periode dat een trein is geparkeerd.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel34
  - number: '35'
    text: |-
      Bij ministeriële regeling kunnen nadere regels gesteld worden over aanwijzingen als bedoeld in de
      [artikelen 4, tweede lid][ref1], [6, tweede lid][ref2] en [10, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017624#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0017624#Artikel10
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017624
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017624
        artikel: '10'
        paragraaf: '3'
  - number: '36'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de aard, uitvoering, plaatsing, bediening en betekenis
      van seinen.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel36
  - number: '37'
    text: 'De beheerder draagt er zorg voor:'
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel37
  - number: 37.a
    text: |-
      dat gedeelten van de hoofdspoorweg, die buiten dienst zijn gesteld worden aangeduid met de daartoe door de
      beheerder aangewezen seinen overeenkomstig het krachtens [artikel 36][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel36
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017624
        artikel: '36'
        paragraaf: '8'
  - number: 37.b
    text: |-
      dat de hoofdspoorweg ter plaatse waar werkzaamheden aan of nabij die hoofdspoorweg worden uitgevoerd, in de bij
      ministeriële regeling bepaalde gevallen buiten dienst wordt gesteld of doelmatig wordt afgeschermd;
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel37
  - number: 37.c
    text: |-
      dat tijdens de uitvoering van werkzaamheden aan of nabij de hoofdspoorweg gebruik wordt gemaakt van goed
      functionerende automatische waarschuwingsapparatuur als bedoeld in normblad nummer 730-3 van de Internationale
      Spoorweg Unie op de wijze als in dat normblad bepaald, of van goed functionerende andere bij ministeriële regeling
      voorgeschreven apparatuur.
    url: https://wetten.overheid.nl/BWBR0017624/2023-09-01#Artikel37
  - number: '39'
    text: |-
      Overtreding van [artikel 22][ref1] vormt een strafbaar feit in de zin van
      [artikel 87, eerste lid, van de wet][ref2].


