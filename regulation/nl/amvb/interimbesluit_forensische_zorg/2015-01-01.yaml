---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: interimbesluit_forensische_zorg
regulatory_layer: AMVB
publication_date: '2010-12-29'
valid_from: '2015-01-01'
bwb_id: BWBR0029333
url: https://wetten.overheid.nl/BWBR0029333/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Veiligheid en Justitie, mede namens Onze Minister van Volksgezondheid,
    Welzijn en Sport van 9 november 2010, 5668790/10/6;

    Gelet op de artikelen 6, tweede en vierde lid, 9b, derde lid, 40, eerste lid, 52, negende lid, en 77 van de
    Algemene wet bijzondere ziektekosten, artikel 91, eerste lid, van de Wet financiering sociale verzekeringen,
    artikel 11, derde lid, van de Zorgverzekeringswet, artikel 1, tweede lid, van de Wet toelating zorginstellingen,
    artikel 2, tweede lid, van de Wet marktordening gezondheidszorg, artikel 24, tweede lid, van de Wet bescherming
    persoonsgegevens, en artikelen 2, tweede lid, 9, eerste lid, en 52 van de Wet justitiële en strafvorderlijke
    gegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 3 december 2010, W03.10.0522/II);

    Gezien het nader rapport van de Staatssecretaris van Veiligheid en Justitie, mede namens Onze Minister van
    Volksgezondheid Welzijn en Sport van 17 december 2010, 5678838/10/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: 1.1.a
    text: |-
      *wet:* de [Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 1.1.b
    text: '*Onze Minister:* de Minister van Veiligheid en Justitie;'
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: 1.1.c
    text: '*Onze Ministers:* de Minister van Veiligheid en Justitie en de Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: 1.1.d
    text: |-
      *forensische zorg:* zorg als bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel2
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '2'
  - number: 1.1.e
    text: |-
      *strafrechtelijke titel:* een uitspraak van de rechter of een beslissing van de officier van justitie, rechter-
      commissaris, advocaat-generaal, dan wel van Onze Minister, gedaan in het kader van een strafzaak, op grond waarvan
      het verlenen van forensische zorg noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: 1.1.f
    text: |-
      *forensische patiënt:* een verzekerde als bedoeld in de wet, voor wie forensische zorg noodzakelijk is op basis van
      een strafrechtelijke titel;
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: 1.1.g
    text: |-
      *sepot:* een beslissing van het openbaar ministerie tot het afzien van verdere vervolging, als bedoeld in
      [artikel 167, tweede lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel167
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '167'
  - number: 1.1.h
    text: |-
      *indicatiestellingsadvies:* een met redenen omklede aanduiding van de forensische zorgbehoefte en het noodzakelijke
      beveiligingsniveau, als bedoeld in [artikel 5, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel5
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '5'
  - number: 1.1.i
    text: |-
      *zorginstelling forensische zorg:* een instelling als bedoeld in
      [artikel 1, eerste lid, onder f van de Wet toelating zorginstellingen][ref1], een justitiële inrichting voor
      verpleging van ter beschikking gestelden of een penitentiaire inrichting waar geestelijke gezondheidszorg wordt
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
  - number: 1.1.j
    text: |-
      *zorgaanbieder forensische zorg:* een rechtspersoon die een zorginstelling forensische zorg in stand houdt of
      een natuurlijke persoon die forensische zorg verleent, dan wel de natuurlijke personen of rechtspersonen, die
      gezamenlijk een zorginstelling forensische zorg vormen, en die krachtens een overeenkomst forensische zorg
      verlenen.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      [Artikel 1:6, onder a, van de Algemene wet bestuursrecht][ref1] is van toepassing op forensische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '2.1'
    text: |-
      Forensische zorg is zorg als bedoeld bij en krachtens [artikel 3.1.1 van de wet][ref1] of als bedoeld in
      [artikel 2.1 van het Besluit zorgverzekering][ref2], voor zover het geestelijke gezondheidszorg of verslavingszorg
      betreft, die wordt verleend aan een justitiabele met een psychogeriatrische of psychiatrische aandoening of
      beperking, verslaving daaronder begrepen, of een verstandelijke handicap, en die al dan niet als een voorwaarde,
      onderdeel uitmaakt van een straf of een maatregel, of van de ten uitvoerlegging van een straf of maatregel, of als
      voorwaarde onderdeel uitmaakt van een sepot, een schorsing van de voorlopige hechtenis, of een gratieverlening op
      grond van de [Gratiewet][ref3], dan wel onderdeel uitmaakt van een strafbeschikking waarbij een gedragsmaatregel
      wordt opgelegd. Beveiliging kan onderdeel uitmaken van forensische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004257
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004257
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing op zorg die al dan niet als voorwaarde onderdeel uitmaakt van een straf of
      maatregel als bedoeld in het [Eerste boek, Titel VIII A, van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '3.1'
    text: |-
      Tenzij bij of krachtens dit besluit anders is bepaald, is het bij en krachtens de [artikelen 3.1.1][ref1],
      [3.2.5][ref2] of [11.1.4 van de wet][ref3] bepaalde ter zake van aard, inhoud en omvang van zorg, de daarbij
      gestelde voorwaarden en de bijdrage van de verzekerde in de kosten daarvan, van toepassing op forensische
      zorg, voor zover die zorg wordt verleend aan een forensische patiënt in verband met zijn psychogeriatrische of
      psychiatrische aandoening of beperking, verslaving daaronder begrepen, dan wel een verstandelijke handicap en uit
      een strafrechtelijke titel blijkt dat die patiënt aangewezen is op forensische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel11
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '11'
  - number: '3.2'
    text: |-
      Tenzij bij of krachtens dit besluit anders is bepaald, is het krachtens
      [artikel 11, derde en vierde lid, van de Zorgverzekeringswet][ref1] bepaalde ter zake van inhoud en omvang van
      prestaties, alsmede hetgeen is bepaald ten aanzien van de kosten die voor rekening van de verzekerde komen, waar
      mogelijk van overeenkomstige toepassing op prestaties die als forensische zorg worden geleverd, indien het betreft
      zorg die wordt verleend aan een forensische patiënt in verband met zijn psychogeriatrische of psychiatrische
      aandoening of beperking, verslaving daaronder begrepen, dan wel een verstandelijke handicap en uit een
      strafrechtelijke titel blijkt dat een forensische patiënt is aangewezen op forensische zorg, met dien verstande dat
      voor verzekerde wordt gelezen: forensische patiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: '3.3'
    text: |-
      Indien de strafrechtelijke titel noodzaakt tot zorg in een zorgtraject dat reeds voor de strafrechtelijke
      vervolging op grond van een zorgverzekering als bedoeld in de [Zorgverzekeringswet][ref1] of op grond van de wet
      in gang is gezet, komt voor vergoeding als forensische zorg in aanmerking het meerdere waartoe de strafrechtelijke
      titel noodzaakt, tenzij [artikel 24 van de Zorgverzekeringswet][ref2] van toepassing is. Indien het zorgtraject
      dat voor de strafrechtelijke vervolging is aangevangen uitsluitend betrekking heeft op ambulante zorg die op
      grond van een zorgverzekering als bedoeld in de Zorgverzekeringswet in gang is gezet, komt de zorg waartoe de
      strafrechtelijke titel noodzaakt, geheel voor vergoeding als forensische zorg in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel24
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '24'
  - number: '3.4'
    text: |-
      Onze Ministers kunnen bij ministeriële regeling nadere en zonodig afwijkende regels stellen over de toepassing van
      dit artikel, dan wel, in aanvulling op of in afwijking van [artikel 2][ref1] andere vormen van zorg aanmerken als
      forensische zorg, dan wel nadere regels stellen over de aard, inhoud en omvang van forensische zorg en de daaraan
      te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel2
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '2'
  - number: '4.1'
    text: |-
      Onze Minister voorziet in het doen ten uitvoer leggen van forensische zorg. Voor wat betreft de inkoop
      van forensische zorg wordt Onze Minister aangemerkt als een Wlz-uitvoerder die zich overeenkomstig
      [artikel 4.1.1 van de wet][ref1] heeft aangemeld voor de uitvoering van de [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035917
  - number: '4.2'
    text: |-
      Onze Minister sluit schriftelijke overeenkomsten met zorgaanbieders die forensische zorg kunnen verlenen, waarop
      ingevolge [artikel 5, eerste lid][ref1], aanspraak bestaat. Met een justitiële inrichting voor verpleging van ter
      beschikking gestelden of een penitentiaire inrichting waar geestelijke gezondheidszorg wordt verleend, die onder
      beheer staan van Onze Minister, worden geen schriftelijke overeenkomsten gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel5
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '5'
  - number: '4.3'
    text: |-
      Onze Minister verricht de administratieve taak van landelijk kantoor voor de betaling van bedragen ten laste
      van de Justitiebegroting, welke uit hoofde van de wet verschuldigd zijn aan zorgaanbieders voor het verlenen van
      forensische zorg, die krachtens [artikel 5, eerste lid][ref1], aan de forensische patiënt is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel5
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '5'
  - number: '4.4'
    text: |-
      Onze Minister is belast met het innen van de bijdrage van de forensische patiënt in de kosten van de forensische
      zorg, met dien verstande dat uitsluitend een bijdrage in de kosten kan worden gevraagd voor verblijf in een
      instelling. Hij kan een organisatie aanwijzen die namens hem belast wordt met het innen van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      Aan de forensische patiënt wordt de forensische zorg verleend, waarop hij blijkens de strafrechtelijke titel is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      Ten behoeve van de besluitvorming inzake de strafrechtelijke titel, de forensische zorgtoeleiding dan wel
      anderszins in verband met de uitvoering van dit besluit, adviseren
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: 5.2.a
    text: |-
      het Nederlands Instituut voor Forensische Psychiatrie en Psychologie, indien het forensische zorg betreft waarbij
      sprake is van verblijf in een zorginstelling forensische zorg, met uitzondering van het verblijf in een instelling
      voor begeleid wonen of maatschappelijke opvang, of
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: 5.2.b
    text: de reclassering, indien het betreft de andere vormen van forensische zorg,
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien Onze Minister vermoedt dat een gedetineerde, bedoeld in
      [artikel 1, onder e, van de Penitentiaire beginselenwet][ref1], forensische zorg behoeft, kan hij ten behoeve van
      de besluitvorming daaromtrent een indicatiestellingsadvies gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
  - number: '5.4'
    text: |-
      Onze Ministers kunnen bij ministeriële regeling regels stellen met betrekking tot de uitvoering van het tweede
      en derde lid, de deskundigheid van de personen die het onderzoek verrichten, de procedure en het toezicht. Zij
      kunnen daarbij bepalen dat voor bepaalde vormen van forensische zorg de beoordeling plaatsvindt door een andere
      organisatie dan de in het tweede lid bedoelde organisaties.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: '5.5'
    text: |-
      Onze Minister is bevoegd een nieuw indicatiestellingsadvies te gelasten, indien het indicatiestellingsadvies naar
      zijn oordeel of naar het oordeel van de zorgaanbieder forensische zorg niet meer voorziet in de noodzakelijke
      forensische zorg. Alvorens een nieuw indicatiestellingsadvies te gelasten, worden de zorgaanbieder forensische zorg
      en de forensische patiënt hierover gehoord.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: '5.6'
    text: |-
      Onze Ministers kunnen bij ministeriële regeling bepalen in welke gevallen en onder welke voorwaarden vooruitlopend
      op het verlenen van een strafrechtelijke titel, dan wel het onderzoek als bedoeld in het tweede lid, forensische
      zorg kan worden verleend, dan wel in welke gevallen een onderzoek als bedoeld in het tweede lid achterwege kan
      blijven.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel5
  - number: '6.1'
    text: |-
      De zorgtoeleiding van forensische patiënten naar een zorgaanbieder forensische zorg geschiedt op grond
      van een daartoe strekkende beslissing die bij of krachtens de [Penitentiaire beginselenwet][ref1]
      of de [Beginselenwet verpleging ter beschikking gestelden][ref2] is genomen. Indien de forensische
      patiënt geen gedetineerde, bedoeld in [artikel 1, onder e, van de Penitentiaire beginselenwet][ref3]
      of geen ter beschikking gestelde of verpleegde, bedoeld in
      [artikel 1, onder i en j, van de Beginselenwet verpleging ter beschikking gestelden][ref4] is, geschiedt de
      zorgtoeleiding naar een zorgaanbieder forensische zorg door of vanwege Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009709
      [ref2]: https://wetten.overheid.nl/BWBR0008765
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008765#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009709
      - id: ref2
        bwb_id: BWBR0008765
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008765
        artikel: '1'
  - number: '6.2'
    text: |-
      Onze Minister informeert de zorgaanbieder forensische zorg schriftelijk en onverwijld over de beslissing, bedoeld
      in het eerste lid. Onze Minister verstrekt daarbij aan de zorgaanbieder, ten behoeve van de zorgtoeleiding en
      zorgverlening aan de forensische patiënt, de volgende gegevens: de strafrechtelijke titel, de duur daarvan,
      de eventuele gestelde voorwaarden die betrekking hebben op de forensische zorg, het indicatiestellingsadvies
      en de wijze waarop het toezicht op de tenuitvoerlegging wordt vormgegeven. Onze Minister verstrekt daarbij
      aan de zorgaanbieder ten behoeve van de declaratie en de betaling van de forensische zorg voorts het
      strafrechtsketennummer van de forensische patiënt of bij het ontbreken hiervan zijn VIP-nummer.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      Onze Minister kan bij ministeriële regeling regels stellen over de zorgtoeleiding als bedoeld in het eerste lid,
      tweede volzin, over degenen die namens Onze Minister bevoegd zijn tot zorgtoeleiding en over het verstrekken van
      persoonsgegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      Ten behoeve van het opstellen van een indicatiestellingsadvies, de zorgtoeleiding van forensische patiënten aan
      zorgaanbieders forensische zorg, de verlening van forensische zorg, de declaratie en de betaling van de forensische
      zorg worden persoonsgegevens van forensische patiënten, met inbegrip van bijzondere persoonsgegevens in de zin
      van de [Wet bescherming persoonsgegevens][ref1], verwerkt. Onze Minister, de reclasseringsinstelling, als bedoeld
      in [artikel 1, onder b, van de Reclasseringsregeling 1995][ref2], en de zorgaanbieder forensische zorg zijn
      verantwoordelijke voor deze verwerking in de zin van de Wet bescherming persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0007120
        artikel: '1'
  - number: '7.2'
    text: |-
      De zorgaanbieder forensische zorg neemt ten behoeve van de zorgtoeleiding van forensische patiënt aan die
      zorgaanbieder, de zorgverlening aan deze patiënt, de declaratie en de betaling van de forensische zorg het
      strafrechtsketennummer van de forensische patiënt of bij het ontbreken van dit nummer, zijn VIP-nummer, alsmede de
      strafrechtelijke titel en de duur daarvan op in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
  - number: '7.3'
    text: |-
      De zorgaanbieder registreert welke forensische zorg is verleend in een diagnose behandel en beveiligingscombinatie,
      een zorgzwaartepakket of in een andere beschrijving van zorg die in een ministeriële regeling als bedoeld
      [artikel 3, vierde lid][ref1], als forensische zorg wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel3
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '3'
  - number: '7.4'
    text: |-
      Bij de verwerking van gegevens ten behoeve van de declaratie wordt het strafrechtsketennummer van de forensische
      patiënt of bij het ontbreken van dit nummer, zijn VIP-nummer gebruikt, wordt de strafrechtelijke titel en de duur
      daarvan verwerkt en de diagnose behandel en beveiligingscombinatie op hoofdproduktenniveau, het zorgzwaartepakket
      of de andere beschrijving van zorg die in een ministeriële regeling als bedoeld [artikel 3, vierde lid][ref1],
      als forensische zorg wordt aangemerkt. Ten behoeve van de declaratie en de betaling van de forensische zorg is de
      zorgaanbieder bevoegd de in de voorgaande volzin genoemde gegevens te verstrekken aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel3
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '3'
  - number: '7.5'
    text: |-
      Bij besluit van Onze Minister worden de ambtenaren van de Dienst Justitiële Inrichtingen aangewezen die
      bij uitsluiting van andere ambtenaren en andere personen belast zijn met de verwerking van persoonsgegevens
      die krachtens het derde lid zijn verkregen. Deze ambtenaren verrichten deze werkzaamheden, onverminderd de
      verantwoordelijkheid van Onze Minister, onder verantwoordelijkheid van de medisch adviseur van de Dienst Justitiële
      Inrichtingen. Dit besluit wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
  - number: '7.6'
    text: |-
      Voor de toepassing van [hoofdstuk 9 van de wet][ref1], wordt in de [artikelen 9.1.1][ref2], [9.1.2][ref3] en
      [9.1.3][ref4] voor «Wlz-uitvoerder» gelezen: Wlz-uitvoerder, waaronder Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035917#Artikel9
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035917
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0035917
        artikel: '9'
  - number: '7.7'
    text: |-
      Bij ministeriële regeling van Onze Ministers worden regels gesteld over de omvang van de gegevensverstrekking, de
      wijze waarop de reclasseringsinstelling en de zorgaanbieder forensische zorg de gegevens van forensische patiënten
      verwerkt in hun administratie en over de gegevensverstrekking ten behoeve van statistiek en wetenschappelijk
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7
  - number: 7a.1
    text: |-
      Indien Onze Minister van Volksgezondheid, Welzijn en Sport, een aanwijzing als bedoeld in
      [artikel 7, eerste lid, van de Wet marktordening gezondheidszorg][ref1] geeft over de beveiligingsaspecten van
      forensische zorg, wordt deze gegeven in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel7
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '7'
  - number: 7a.2
    text: |-
      Toepassing van [artikel 22 van de Wet marktordening gezondheidszorg][ref1] door Onze Minister van Volksgezondheid,
      Welzijn en Sport vindt plaats in overeenstemming met Onze Minister, indien dit betrekking heeft op de forensische
      zorg. Bij de toepassing van het artikel als bedoeld in de eerste volzin worden geen gegevens en inlichtingen
      verstrekt die betrekking hebben op de bedrijfsvoering van zorgaanbieders die forensische zorg leveren of kunnen
      leveren en die een onevenredige inbreuk maken op hun onderhandelingspositie bij het overeenkomen van de levering
      van die zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel22
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '22'
  - number: 7a.3
    text: |-
      De zorgautoriteit bedoeld in [artikel 1, onder l, van de Wet marktordening gezondheidszorg][ref1] volgt het oordeel
      van de Inspectie voor de sanctietoepassing over de beveiligingsaspecten van de forensische zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: '17'
    text: |-
      De kapitaallasten van zorginstellingen forensische zorg als bedoeld in het eerste subonderdeel van het begrip
      «instelling» zoals omschreven in [artikel 1.1.1 van de wet][ref1] komen voor zover zij forensische zorg
      aanbieden en voor zover zij voor de inwerkingtreding van dit besluit op grond van het bij en krachtens de
      [Wet marktordening gezondheidszorg][ref2] bepaalde door AWBZ-verzekeraars of zorgverzekeraars als bedoeld in die
      wet, werden betaald, ten laste van de begroting van het ministerie van Justitie vanaf het moment dat het budget
      daarvoor is overgeheveld bij een begrotingswet. Onze Ministers doen in de Staatscourant mededeling van de datum met
      ingang waarop de kapitaallasten overgaan en kunnen bij ministeriële regeling regels stellen over de wijze waarop de
      kapitaallasten in de vergoeding voor forensische zorg worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020078
  - number: '18'
    text: 'Dit besluit treedt in werking met ingang van 1 januari 2011, met dien verstande dat het:'
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel18
  - number: 18.a
    text: |-
      met betrekking tot [artikel 8][ref1] terugwerkt tot en met 1 januari 2007,


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel8
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '8'
  - number: 18.b
    text: |-
      met betrekking tot de [artikelen 12][ref1] en [14][ref2] terugwerkt tot en met 1 januari 2008, met dien verstande
      dat door de Nederlandse Zorgautoriteit op grond van de [Wet marktordening gezondheidszorg][ref3] voor het
      verlenen van forensische zorg vastgestelde kapitaallasten blijven gelden tot en met de datum met ingang waarop de
      kapitaallasten overgaan, bedoeld in [artikel 17][ref4], en


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0029333#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0020078
      [ref4]: https://wetten.overheid.nl/BWBR0029333#Artikel17
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0029333
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0020078
      - id: ref4
        bwb_id: BWBR0029333
        artikel: '17'
  - number: 18.c
    text: |-
      met betrekking tot [artikel 13][ref1] terugwerkt tot en met 1 juli 2010, met dien verstande dat op de behandeling
      van bezwaar- en beroepschriften ingediend voor die datum het oude recht van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel13
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0029333
        artikel: '13'
  - number: '19.1'
    text: Dit besluit vervalt met ingang van de dag waarop de Wet Forensische zorg in werking treedt.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien het wetsvoorstel dat de vaststelling van een Wet Forensische zorg regelt door de Staten-Generaal wordt
      verworpen, vervalt dit besluit op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel19
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Interimbesluit forensische zorg.'
    url: https://wetten.overheid.nl/BWBR0029333/2015-01-01#Artikel20
