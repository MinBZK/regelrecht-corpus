  - number: '5'
    text: |-
      1 Aan de forensische patiënt wordt de forensische zorg verleend, waarop hij blijkens de strafrechtelijke titel
      is aangewezen.

      2 Ten behoeve van de besluitvorming inzake de strafrechtelijke titel, de forensische zorgtoeleiding dan wel
      anderszins in verband met de uitvoering van dit besluit, adviseren

      a. het Nederlands Instituut voor Forensische Psychiatrie en Psychologie, indien het forensische zorg betreft
      waarbij sprake is van verblijf in een zorginstelling forensische zorg, met uitzondering van het verblijf in een
      instelling voor begeleid wonen of maatschappelijke opvang, of

      b. de reclassering, indien het betreft de andere vormen van forensische zorg,

      op welke vorm of vormen van forensische zorg de forensische patiënt is aangewezen, op basis van onderzoek, waarbij
      een met redenen omklede aanduiding van de forensische zorgbehoefte en het noodzakelijke beveiligingsniveau wordt
      gegeven.

      3 Indien Onze Minister vermoedt dat een gedetineerde, bedoeld in
      [artikel 1, onder e, van de Penitentiaire beginselenwet][ref1], forensische zorg behoeft, kan hij ten behoeve van
      de besluitvorming daaromtrent een indicatiestellingsadvies gelasten.

      4 Onze Ministers kunnen bij ministeriële regeling regels stellen met betrekking tot de uitvoering van het tweede
      en derde lid, de deskundigheid van de personen die het onderzoek verrichten, de procedure en het toezicht. Zij
      kunnen daarbij bepalen dat voor bepaalde vormen van forensische zorg de beoordeling plaatsvindt door een andere
      organisatie dan de in het tweede lid bedoelde organisaties.

      5 Onze Minister is bevoegd een nieuw indicatiestellingsadvies te gelasten, indien het indicatiestellingsadvies
      naar zijn oordeel of naar het oordeel van de zorgaanbieder forensische zorg niet meer voorziet in de noodzakelijke
      forensische zorg. Alvorens een nieuw indicatiestellingsadvies te gelasten, worden de zorgaanbieder forensische zorg
      en de forensische patiënt hierover gehoord.

      6 Onze Ministers kunnen bij ministeriële regeling bepalen in welke gevallen en onder welke voorwaarden
      vooruitlopend op het verlenen van een strafrechtelijke titel, dan wel het onderzoek als bedoeld in het tweede
      lid, forensische zorg kan worden verleend, dan wel in welke gevallen een onderzoek als bedoeld in het tweede lid
      achterwege kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
