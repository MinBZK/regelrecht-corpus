  - number: '4'
    text: |-
      1 Onze Minister voorziet in het doen ten uitvoer leggen van forensische zorg.

      2 Onze Minister sluit schriftelijke overeenkomsten met zorgaanbieders die forensische zorg kunnen verlenen, waarop
      ingevolge [artikel 5, eerste lid][ref1], aanspraak bestaat. Met een justitiële inrichting voor verpleging van ter
      beschikking gestelden of een penitentiaire inrichting waar geestelijke gezondheidszorg wordt verleend, die onder
      beheer staan van Onze Minister, worden geen schriftelijke overeenkomsten gesloten.

      3 Onze Minister verricht de administratieve taak van landelijk kantoor voor de betaling van bedragen ten laste
      van de Justitiebegroting, welke uit hoofde van de wet verschuldigd zijn aan zorgaanbieders voor het verlenen van
      forensische zorg, die krachtens [artikel 5, eerste lid][ref2], aan de forensische patiënt is verleend.

      4 Onze Minister is belast met het innen van de bijdrage van de forensische patiënt in de kosten van de
      forensische zorg, met dien verstande dat uitsluitend een bijdrage in de kosten kan worden gevraagd voor
      verblijf in een instelling. Hij kan een organisatie aanwijzen die namens hem belast wordt met het innen van de
      bijdrage. [Artikel 5, tweede lid, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029333#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029333#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003585#Artikel5
