      1 Tenzij bij of krachtens dit besluit anders is bepaald, is het krachtens
      [artikel 6, tweede en vierde lid, van de Algemene Wet bijzondere Ziektekosten][ref1] bepaalde ter zake van aard,
      inhoud en omvang van zorg, de daarbij gestelde voorwaarden en de bijdrage van de verzekerde in de kosten daarvan,
      van toepassing op forensische zorg, voor zover die zorg wordt verleend aan een forensische patiënt in verband
      met zijn psychogeriatrische of psychiatrische aandoening of beperking, verslaving daaronder begrepen, dan wel een
      verstandelijke handicap en uit een strafrechtelijke titel blijkt dat die patiënt aangewezen is op forensische zorg.

      2 Tenzij bij of krachtens dit besluit anders is bepaald, is het krachtens
      [artikel 11, derde en vierde lid, van de Zorgverzekeringswet][ref2] bepaalde ter zake van inhoud en omvang van
      prestaties, alsmede hetgeen is bepaald ten aanzien van de kosten die voor rekening van de verzekerde komen, waar
      mogelijk van overeenkomstige toepassing op prestaties die als forensische zorg worden geleverd, indien het betreft
      zorg die wordt verleend aan een forensische patiënt in verband met zijn psychogeriatrische of psychiatrische
      aandoening of beperking, verslaving daaronder begrepen, dan wel een verstandelijke handicap en uit een
      strafrechtelijke titel blijkt dat een forensische patiënt is aangewezen op forensische zorg, met dien verstande dat
      voor verzekerde wordt gelezen: forensische patiënt.

      3 Indien de strafrechtelijke titel noodzaakt tot zorg in een zorgtraject dat reeds voor de strafrechtelijke
      vervolging op grond van een zorgverzekering als bedoeld in de [Zorgverzekeringswet][ref3] of op grond van de wet
      in gang is gezet, komt voor vergoeding als forensische zorg in aanmerking het meerdere waartoe de strafrechtelijke
      titel noodzaakt, tenzij [artikel 24 van de Zorgverzekeringswet][ref4] van toepassing is. Indien het zorgtraject
      dat voor de strafrechtelijke vervolging is aangevangen uitsluitend betrekking heeft op ambulante zorg die op
      grond van een zorgverzekering als bedoeld in de Zorgverzekeringswet in gang is gezet, komt de zorg waartoe de
      strafrechtelijke titel noodzaakt, geheel voor vergoeding als forensische zorg in aanmerking.

      4 Onze Ministers kunnen bij ministeriële regeling nadere en zonodig afwijkende regels stellen over de toepassing
      van dit artikel, dan wel, in aanvulling op of in afwijking van [artikel 2][ref5] andere vormen van zorg aanmerken
      als forensische zorg, dan wel nadere regels stellen over de aard, inhoud en omvang van forensische zorg en de
      daaraan te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
