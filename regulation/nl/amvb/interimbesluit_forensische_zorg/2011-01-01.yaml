    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Veiligheid en Justitie, mede namens Onze Minister van Volksgezondheid,
    Welzijn en Sport van 9 november 2010, 5668790/10/6;

    Gelet op de artikelen 6, tweede en vierde lid, 9b, derde lid, 40, eerste lid, 52, negende lid, en 77 van de
    Algemene wet bijzondere ziektekosten, artikel 91, eerste lid, van de Wet financiering sociale verzekeringen,
    artikel 11, derde lid, van de Zorgverzekeringswet, artikel 1, tweede lid, van de Wet toelating zorginstellingen,
    artikel 2, tweede lid, van de Wet marktordening gezondheidszorg, artikel 24, tweede lid, van de Wet bescherming
    persoonsgegevens, en artikelen 2, tweede lid, 9, eerste lid, en 52 van de Wet justitiële en strafvorderlijke
    gegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 3 december 2010, W03.10.0522/II);

    Gezien het nader rapport van de Staatssecretaris van Veiligheid en Justitie, mede namens Onze Minister van
    Volksgezondheid Welzijn en Sport van 17 december 2010, 5678838/10/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029333/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *wet:* de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. *Onze Minister:* de Minister van Veiligheid en Justitie;

      c. *Onze Ministers:* de Minister van Veiligheid en Justitie en de Minister van Volksgezondheid, Welzijn en Sport;

      d. *forensische zorg:* zorg als bedoeld in [artikel 2][ref2];

      e. *strafrechtelijke titel:* een uitspraak van de rechter of een beslissing van de officier van justitie, rechter-
      commissaris, advocaat-generaal, dan wel van Onze Minister, gedaan in het kader van een strafzaak, op grond waarvan
      het verlenen van forensische zorg noodzakelijk is;

      f. *forensische patiënt:* een verzekerde als bedoeld in de wet, voor wie forensische zorg noodzakelijk is op basis
      van een strafrechtelijke titel;

      g. *sepot:* een beslissing van het openbaar ministerie tot het afzien van verdere vervolging, als bedoeld in
      [artikel 167, tweede lid, van het Wetboek van Strafvordering][ref3];

      h. *indicatiestellingsadvies:* een met redenen omklede aanduiding van de forensische zorgbehoefte en het
      noodzakelijke beveiligingsniveau, als bedoeld in [artikel 5, tweede lid][ref4];

      i. *zorginstelling forensische zorg:* een instelling als bedoeld in
      [artikel 1, eerste lid, onder f van de Wet toelating zorginstellingen][ref5], een justitiële inrichting voor
      verpleging van ter beschikking gestelden of een penitentiaire inrichting waar geestelijke gezondheidszorg wordt
      verleend;

      j. *zorgaanbieder forensische zorg:* een rechtspersoon die een zorginstelling forensische zorg in stand houdt
      of een natuurlijke persoon die forensische zorg verleent, dan wel de natuurlijke personen of rechtspersonen,
      die gezamenlijk een zorginstelling forensische zorg vormen, en die krachtens een overeenkomst forensische zorg
      verlenen.

      2 [Artikel 1:6, onder a, van de Algemene wet bestuursrecht][ref6] is van toepassing op forensische zorg.


