  - number: '18'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2011, met dien verstande dat het:

      a. met betrekking tot [artikel 8][ref1] terugwerkt tot en met 1 januari 2007,

      b. met betrekking tot de [artikelen 12][ref2] en [14][ref3] terugwerkt tot en met 1 januari 2008, met dien
      verstande dat door de Nederlandse Zorgautoriteit op grond van de [Wet marktordening gezondheidszorg][ref4] voor het
      verlenen van forensische zorg vastgestelde kapitaallasten blijven gelden tot en met de datum met ingang waarop de
      kapitaallasten overgaan, bedoeld in [artikel 17][ref5], en

      c. met betrekking tot [artikel 13][ref6] terugwerkt tot en met 1 juli 2010, met dien verstande dat op de
      behandeling van bezwaar- en beroepschriften ingediend voor die datum het oude recht van toepassing is.


