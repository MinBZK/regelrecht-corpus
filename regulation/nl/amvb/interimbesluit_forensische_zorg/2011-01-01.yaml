  - number: '2'
    text: |-
      1 Forensische zorg is zorg als omschreven in de [artikelen 4 tot en met 10][ref1],
      [13][ref2] en [15 van het Besluit zorgaanspraken AWBZ][ref3] of als bedoeld in
      [artikel 2.1 van het Besluit zorgverzekering][ref4], voor zover het geestelijke gezondheidszorg of verslavingszorg
      betreft, die wordt verleend aan een justitiabele met een psychogeriatrische of psychiatrische aandoening of
      beperking, verslaving daaronder begrepen, of een verstandelijke handicap, en die al dan niet als een voorwaarde,
      onderdeel uitmaakt van een straf of een maatregel, of van de ten uitvoerlegging van een straf of maatregel, of als
      voorwaarde onderdeel uitmaakt van een sepot, een schorsing van de voorlopige hechtenis, of een gratieverlening op
      grond van de [Gratiewet][ref5], dan wel onderdeel uitmaakt van een strafbeschikking waarbij een gedragsmaatregel
      wordt opgelegd. Beveiliging kan onderdeel uitmaken van forensische zorg.

      2 Het eerste lid is niet van toepassing op zorg die al dan niet als voorwaarde onderdeel uitmaakt van een straf of
      maatregel als bedoeld in het [Eerste boek, Titel VIII A, van het Wetboek van Strafrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
