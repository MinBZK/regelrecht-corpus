      NSI-nummer: door Onze Minister van Infrastructuur en Waterstaat aan een zeeschip toegekend nationaal
      scheepsidentificatienummer;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel1
  - number: 1.g
    text: |-
