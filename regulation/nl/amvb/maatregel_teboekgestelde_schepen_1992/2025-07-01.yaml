        bwb_id: BWBR0048148
  - number: 1a
    text: |-
      Dit besluit is mede gebaseerd op [artikel 7g van de Kadasterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7g
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: 7g
  - number: '2'
    text: |-
      De verplichtingen welke krachtens dit besluit rusten op de eigenaar van een schip of van een schip in aanbouw,
      rusten, indien het schip, onderscheidenlijk het schip in aanbouw toebehoort aan meer personen, aan een vennootschap
      onder firma, aan een commanditaire vennootschap of aan een rechtspersoon, mede op iedere deelgenoot, beherende
      vennoot of bestuurder en, indien toepassing is gegeven aan artikel 163 van Boek 8 van het Burgerlijk Wetboek, op de
      boekhouder, bedoeld in dat artikel.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel2
  - number: '3.1'
    text: |-
      De rubrieken, bedoeld in [artikel 21, tweede lid, van de wet][ref1], waarin schepen worden onderscheiden zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
  - number: 3.1.a
    text: Nederlandse zeeschepen;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel3
  - number: 3.1.b
    text: zeevissersschepen;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel3
  - number: 3.1.c
    text: binnenschepen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel3
  - number: '3.2'
    text: Deze rubrieken worden aangeduid met een hoofdletter, onderscheidenlijk Z, V of B.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel3
  - number: '4'
    text: |-
      Indien een schip tot een andere rubriek dan die waarin het te boek staat gaat behoren, is de eigenaar verplicht een
      nieuwe teboekstelling te verzoeken met inachtneming van de [artikelen 14][ref1] en [16 tot en met 19][ref2], met
      dien verstande dat de overlegging van de stukken, genoemd in [artikel 16, eerste lid, onder b en c][ref3], niet is
      vereist. In het verzoek tot een nieuwe teboekstelling moet de bestaande worden vermeld. De bestaande teboekstelling
      wordt doorgehaald met inachtneming van de [artikelen 28 tot en met 33][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0005260#Artikel28
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '16'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '16'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005260
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '6.1'
    text: |-
      Wanneer de bewaarder blijkt dat een schip onder verschillende brandmerken te boek staat, beslist hij welke
      teboekstelling gehandhaafd blijft. Hij maakt van zijn bevinding zo nodig proces-verbaal op en zendt dit aan het
      Openbaar Ministerie.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel6
  - number: '6.2'
    text: |-
      Wanneer blijkt dat op het schip brandmerken voorkomen die al dan niet in verband met de beslissing, bedoeld in
      het eerste lid, daarop niet behoren voor te komen, laat de bewaarder deze door een ambtenaar van de Dienst of een
      andere door de bewaarder daarmee belast persoon vernietigen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel6
  - number: '7.1'
    text: |-
      De bewaarder is bevoegd ter zake van het verzoek tot teboekstelling van een binnenschip en ter zake van het verzoek
      of de aangifte tot doorhaling van de teboekstelling van een binnenschip rechtstreeks in briefwisseling te treden
      met de houder van het desbetreffende verdragsregister. De briefwisseling kan door de bewaarder in de Nederlandse
      taal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel7
  - number: '7.2'
    text: |-
      De eerste zin van het eerste lid is van overeenkomstige toepassing ter zake van verzoeken tot teboekstelling van
      een zeeschip of zeevissersschip en ter zake van het verzoek of de aangifte tot doorhaling van de teboekstelling
      van een zeeschip of zeevissersschip, met dien verstande dat voor «verdragsregister» wordt gelezen: buitenlandse
      register.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel7
  - number: '8.1'
    text: De teboekstelling vindt plaats door de inschrijving van het verzoek tot teboekstelling in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel8
  - number: '8.2'
    text: De teboekstelling van schepen geschiedt voor ieder schip onder een eigen nummer.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel8
  - number: 8a
    text: |-
      Stukken ter verkrijging van inschrijving van feiten die betrekking hebben op schepen of op rechten waaraan
      die schepen zijn onderworpen, worden, voor zover in papieren vorm, aangeboden op een plaats als bedoeld in
      [artikel 4, onderdeel b, van de wet][ref1] en, voor zover in elektronische vorm, aan een elektronisch postadres als
      bedoeld in [artikel 10 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel10
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '10'
  - number: '9.1'
    text: |-
      De bewaarder geeft voor een te boek staand binnenschip aan de eigenaar
      een certificaat af waarop staan vermeld de gegevens, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '9.2'
    text: |-
      Indien het schip in een verdragsregister te boek staat, wordt geen certificaat afgegeven dan nadat voldaan is aan
      de in [artikel 18][ref1] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel18
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '18'
        hoofdstuk: '3'
  - number: '9.3'
    text: |-
      Indien er wijzigingen optreden in de op het certificaat vermelde gegevens betreffende het te boek staande
      binnenschip, levert de eigenaar het certificaat bij de bewaarder in. Aan hem wordt door de bewaarder een nieuw
      certificaat afgegeven, waarop de wijzigingen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel9
  - number: '9.4'
    text: |-
      Op verzoek van de eigenaar wordt hem een duplicaat verstrekt, dat wordt gelijkgesteld met het certificaat. Het
      duplicaat moet als zodanig herkenbaar zijn en de afgifte ervan wordt door de bewaarder op het certificaat vermeld.
      De eigenaar stelt daartoe het certificaat aan de bewaarder ter hand.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel9
  - number: '10.1'
    text: |-
      Voor een verloren geraakt, versleten, geheel of ten dele onleesbaar of te niet gegaan afgegeven certificaat
      kan door de bewaarder een vervangend certificaat worden uitgereikt. Het certificaat, waarvoor het vervangende
      certificaat in de plaats komt, verliest zijn geldigheid, evenals een duplicaat hetwelk is afgegeven overeenkomstig
      [artikel 9, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel9
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '9'
        hoofdstuk: '2'
  - number: '10.2'
    text: De bewaarder tekent op het vervangende certificaat de reden van de vervanging aan.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel10
  - number: '10.3'
    text: |-
      Voor zover het certificaat, waarvan de vervanging wordt verzocht nog aanwezig is, wordt dit bij het verzoek tot
      afgifte van het vervangende certificaat bij de bewaarder ingeleverd. Hetzelfde geldt ten aanzien van een afgegeven
      duplicaat.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister stelt de vorm vast van de in de[ artikel 9][ref1] bedoelde certificaten en duplicaten van
      certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel9
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '9'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      De eigenaar van een in Nederland in aanbouw zijnd schip die daarvan de teboekstelling wenst
      te verkrijgen, biedt de Dienst een daartoe strekkend verzoek ter inschrijving aan, dat tevens
      een bewijs dat het schip in Nederland in aanbouw is en een verklaring van eigendom dient in te
      houden, alsmede de verklaring, bedoeld in [artikel 194, vierde lid, tweede volzin][ref1], dan wel
      [artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '784'
  - number: '12.2'
    text: |-
      Een schip in aanbouw kan worden te boek gesteld, zodra de bewaarder aannemelijk is gemaakt dat met de bouw van het
      schip is begonnen en dat het schip in Nederland in aanbouw is.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel12
  - number: '12.3'
    text: |-
      [artikel 14, vijfde lid][ref1], is van toepassing. Indien het verzoek een binnenschip in aanbouw betreft, zijn
      bovendien de [artikelen 17][ref2] en [18][ref3] van toepassing. Indien het verzoek een zeeschip in aanbouw of een
      zeevissersschip in aanbouw betreft, is bovendien [artikel 19][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005260#Artikel19
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '17'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '18'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005260
        artikel: '19'
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Hij, te wiens name een zeeschip in aanbouw of een zeevissersschip in aanbouw te boek staat, is verplicht na
      de afbouw en voordat hij het schip aan een ander levert een verzoek ter inschrijving aan te bieden inhoudende
      de teboekstelling als afgebouwd schip. Op dit verzoek zijn de [artikelen 24][ref1] en [26][ref2] van
      toepassing. Betreft het verzoek een zeeschip, dan wordt het verzoek vergezeld van de verklaring, bedoeld in
      [artikel 15, eerste lid][ref3]. De [artikelen 14][ref4] en [16][ref5] zijn niet van toepassing, met dien verstande
      dat bij het verzoek wordt overgelegd de meetbrief, afgegeven volgens de bestaande wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0005260#Artikel16
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '24'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '26'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '15'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005260
        artikel: '14'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0005260
        artikel: '16'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      Hij, te wiens name een zeeschip in aanbouw of een zeevissersschip in aanbouw te boek staat, is verplicht om,
      indien hij het schip zelf in de vaart brengt, na de afbouw en voordat hij het schip in de vaart brengt, een
      verzoek ter inschrijving aan te bieden inhoudende de teboekstelling als afgebouwd schip. Op dit verzoek zijn de
      [artikelen 16][ref1], [24][ref2] en [26][ref3] van toepassing. Het verzoek dient tevens in te houden de verklaring,
      bedoeld in [artikel 194, vierde lid, tweede volzin, van Boek 8 van het Burgerlijk Wetboek][ref4]. Betreft het
      verzoek een zeeschip, dan wordt het verzoek vergezeld van de verklaring, bedoeld in [artikel 15, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref5]: https://wetten.overheid.nl/BWBR0005260#Artikel15
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '16'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '24'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '26'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref5
        bwb_id: BWBR0005260
        artikel: '15'
        hoofdstuk: '3'
  - number: '13.3'
    text: |-
      Hij, te wiens name een binnenschip in aanbouw te boek staat, is verplicht binnen drie maanden na
      de afbouw aan de bewaarder, mede te delen of het afgebouwde schip voldoet aan ten minste één der in
      [artikel 784, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1] te dien aanzien gestelde voorwaarden. Indien
      het schip aan ten minste één van deze voorwaarden voldoet, is hij verplicht om een verzoek ter inschrijving aan te
      bieden inhoudende de teboekstelling als afgebouwd schip. Op dit verzoek zijn de [artikelen 16][ref2], [17][ref3],
      [18][ref4], [24][ref5] en [26][ref6] van toepassing. Het verzoek dient tevens in te houden de verklaring, bedoeld
      in [artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref7]. Wanneer één of meer van de over te
      leggen stukken ontbreken, onvolledig zijn of niet met elkaar of met de aangeboden verklaring overeenstemmen, of
      wanneer hij mededeelt dat het afgebouwde binnenschip niet aan ten minste één der bovengenoemde voorwaarden voldoet,
      wordt de teboekstelling met inachtneming van de [artikelen 30 tot en met 33][ref8] doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005260#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0005260#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0005260#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref8]: https://wetten.overheid.nl/BWBR0005260#Artikel30
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel13
    references:
      - id: ref1
