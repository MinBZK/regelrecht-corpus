      [artikel 785, tweede lid, onder a, van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel785
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel1
    references:
