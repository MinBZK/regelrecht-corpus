        bwb_id: BWBR0005260
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '14.1'
    text: |-
      Hij die van een schip de teboekstelling wenst te verkrijgen, biedt de Dienst een daartoe strekkend
      verzoek ter inschrijving aan, dat tevens een verklaring van eigendom dient in te houden, alsmede de
      verklaring, bedoeld in [artikel 194, vierde lid, tweede volzin][ref1], dan wel de verklaring, bedoeld in
      [artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref2] indien het een verzoek tot teboekstelling
      van een zeeschip, niet zijnde een zeevissersschip betreft. Betreft het verzoek een zeeschip, dan wordt tevens de in
      [artikel 15, eerste lid][ref3], bedoelde verklaring aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel15
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '784'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '15'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      In het verzoek tot teboekstelling wordt vermeld of het schip reeds, als schip in aanbouw of als afgebouwd schip, in
      de openbare registers dan wel in enig soortgelijk buitenlands register te boek staat of te boek gestaan heeft.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel14
  - number: '14.3'
    text: |-
      In geval van vroegere teboekstellingen in de openbare registers wordt in het verzoek elke teboekstelling en het
      desbetreffende brandmerk vermeld.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel14
  - number: '14.4'
    text: |-
      In geval van vroegere teboekstellingen in een buitenlands register wordt in het verzoek vermeld een
      identificatiekenmerk, soortgelijk aan het brandmerk, alsmede het land of de staat en de plaats van de
      teboekstelling. Indien vorenbedoeld identificatiekenmerk met betrekking tot het schip niet bestaat, wordt in
      het verzoek vermeld het land of de staat, de plaats en de dagtekening van de teboekstelling van het schip en het
      register waarin en het volgnummer waaronder in dat register de vroegere teboekstelling is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel14
  - number: '14.5'
    text: |-
      Behoudens het bepaalde in [artikel 18, eerste lid][ref1], en [artikel 19, eerste lid][ref2], wordt, indien
      het schip reeds in een buitenlands register te boek gestaan heeft, bij het in het eerste lid genoemde verzoek
      overgelegd een door de bevoegde autoriteit afgegeven verklaring, waaruit blijkt dat de teboekstelling is
      doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel19
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '18'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '19'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      Voorafgaand aan het verzoek tot inschrijving, bedoeld in de [artikelen 13, eerste en tweede lid][ref1], of
      [14][ref2], ten aanzien van een zeeschip, wordt door de eigenaar bij de Dienst een aanvraag ingediend voor een
      verklaring dat voldaan wordt aan de in [artikel 194a van Boek 8 van het Burgerlijk Wetboek][ref3] van toepassing
      zijnde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel194a
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: 194a
  - number: '15.2'
    text: De verklaring wordt afgegeven door de bewaarder.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
  - number: '15.3'
    text: |-
      Bij het verzoek tot inschrijving verklaart de eigenaar dat de op grond van het eerste lid vereiste bewijsstukken en
      gegevens op het moment van aanbieden ter inschrijving actueel en ongewijzigd zijn.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
  - number: '15.4'
    text: |-
      De kosten voor de behandeling van de aanvraag en afgifte van de verklaring, bedoeld in het eerste lid, komen ten
      laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
  - number: '15.5'
    text: Het bestuur van de Dienst kan de vorm van de aanvraag en de verklaring, bedoeld in het eerste lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
  - number: '15.6'
    text: |-
      Het bestuur van de Dienst stelt eisen ten aanzien van de bij een aanvraag voor een verklaring, bedoeld in het
      eerste lid, te overleggen bewijsstukken en gegevens.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel15
  - number: '16.1'
    text: |-
      Betreft een verzoek tot teboekstelling een zeevissersschip of een binnenschip, dan wordt bij het verzoek
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.1.a
    text: de meetbrief, afgegeven volgens de bestaande wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.1.b
    text: indien het schip direct van de bouwer is verkregen, de door deze afgegeven bijlbrief;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.1.c
    text: indien het schip niet direct van de bouwer is verkregen, de koopbrief dan wel enig ander bewijsstuk van eigendom;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.1.d
    text: |-
      indien het een zeevissersschip betreft, een bewijs dat het schip is ingeschreven in een krachtens
      [artikel 3 der Visserijwet 1963][ref1] aangehouden register.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '3'
  - number: '16.2'
    text: |-
      Indien aan de bewaarder aannemelijk wordt gemaakt dat geen meetbrief kan worden overgelegd, omdat het schip niet
      gemeten is, kan in de plaats daarvan worden volstaan met:
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.2.a
    text: voor zover het een zeevissersschip betreft, in het verzoek te vermelden dat geen meetbrief kan worden overgelegd;
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: 16.2.b
    text: |-
      voor zover het een binnenschip betreft, het verstrekken van gegevens op grond waarvan volgens de in Nederland
      gangbare methode van berekening het laadvermogen in tonnen van 1000 kilogram of de verplaatsing kan worden
      berekend.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: '16.3'
    text: |-
      Indien geen bijlbrief kan worden overgelegd, moet in het verzoek worden verklaard dat deze niet bestaat met opgaaf
      van de reden.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      Bij het verzoek tot teboekstelling van een binnenschip worden de bewijsstukken overgelegd dat het schip voldoet
      aan ten minste één der in artikel 784, eerste lid, van Boek 8 van het Burgerlijk Wetboek te dien aanzien gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      Wanneer één of meer van de in het eerste lid genoemde stukken ontbreken, onvolledig zijn, of niet met elkaar of met
      de in artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek bedoelde verklaring in overeenstemming zijn,
      wordt de inschrijving geweigerd.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel17
  - number: '18.1'
    text: |-
      Indien een binnenschip, waarvan de teboekstelling verzocht wordt, reeds in een verdragsregister te boek staat,
      wordt in de registratie voor schepen vermeld dat deze teboekstelling slechts rechtsgevolg heeft nadat de
      teboekstelling van het schip in het verdragsregister is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel18
  - number: '18.2'
    text: |-
      De bewaarder verstrekt aan de eigenaar van het binnenschip een uittreksel uit de registratie voor schepen,
      als bedoeld in [artikel 101, eerste lid, van de wet][ref1], vermeldende ten minste de gegevens, bedoeld in
      [artikel 85, tweede lid, onderdelen a, c tot en met g, i en l, van de wet][ref2], alsmede de gegevens omtrent niet
      doorgehaalde voorlopige aantekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '18.3'
    text: |-
      De in het eerste lid genoemde vermelding wordt doorgehaald na inschrijving van een bewijs waaruit blijkt dat de
      teboekstelling in het verdragsregister waar het binnenschip te boek stond, is doorgehaald. De bewaarder geeft aan
      de eigenaar van het binnenschip het in [artikel 9][ref1] genoemde certificaat af.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel9
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '9'
        hoofdstuk: '2'
  - number: '18.4'
    text: |-
      Indien het geval, genoemd in [artikel 784, vierde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], zich
      voordoet, wordt zulks in de registratie voor schepen vermeld na inschrijving van een bewijs van weigering
      door de bewaarder van het verdragsregister. De bewaarder geeft aan de eigenaar van het binnenschip het in
      [artikel 9][ref2] genoemde certificaat af en tekent op het certificaat eveneens aan dat het geval, genoemd in
      [artikel 784, vierde lid, van Boek 8 van het Burgerlijk Wetboek][ref3], zich heeft voorgedaan. Hij haalt de in het
      eerste lid genoemde vermelding door.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel784
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel784
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '784'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '9'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '784'
  - number: '19.1'
    text: |-
      Indien een zeeschip of een zeevissersschip, waarvan de teboekstelling wordt verzocht, reeds
      in een buitenlands register te boek staat, wordt in de registratie voor schepen vermeld
      dat deze teboekstelling slechts rechtsgevolg heeft indien zich één der gevallen, bedoeld in
      [artikel 194, derde lid, van Boek 8 van het Burgerlijk Wetboek][ref1], voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '194'
  - number: '19.2'
    text: |-
      [Artikel 18, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel18
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '18'
        hoofdstuk: '3'
  - number: '19.3'
    text: |-
      De in het eerste lid genoemde vermelding wordt doorgehaald indien binnen 30 dagen na de teboekstelling een bewijs
      wordt ingeschreven waaruit blijkt dat de teboekstelling in het buitenlandse register waarin het schip te boek
      stond, is doorgehaald.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel19
  - number: '19.4'
    text: |-
      Ingeval de bewaarder van het buitenlandse register doorhaling weigert, wordt zulks in de registratie voor schepen
      vermeld na inschrijving van een afschrift van het verzoek tot doorhaling en een bewijs van weigering door de
      bewaarder van het buitenlandse register. Hij haalt de in het eerste lid genoemde vermelding door.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel19
  - number: '22.1'
    text: |-
      Zodra een verzoek tot teboekstelling van een schip of van een schip in aanbouw is ingeschreven, laat de bewaarder
      het brandmerk door een ambtenaar van de Dienst of een andere door de bewaarder daarmee belaste persoon op het schip
      aanbrengen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.2'
    text: |-
      Het brandmerk, bedoeld in het eerste lid, wordt aangebracht op het achterschip, tenzij dit, ingeval het verzoek
      tot teboekstelling betreft een schip in aanbouw, niet mogelijk is. In dat geval wordt het brandmerk dat dient ter
      aanduiding van een schip in aanbouw, aangebracht op een scheepsdeel van het schip in aanbouw.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.3'
    text: |-
      De bewaarder vermeldt de branding in de registratie voor schepen, onder aantekening van de plaats van het brandmerk
      op het schip, de aangetroffen oude brandmerken alsmede de ongeldigmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.4'
    text: |-
      Indien de branding in het buitenland heeft plaatsgevonden en de bevoegde buitenlandse autoriteit de bewaarder
      daarvan schriftelijk kennis heeft gegeven, is het derde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.5'
    text: |-
      Indien het schip reeds is gebrand, worden bij de branding van de nieuwe merken de bestaande merken voorzien van een
      staand kruis voor het jaartal van teboekstelling of, ingeval bij de bestaande merken het kantoor van teboekstelling
      en het jaartal van teboekstelling zijn vermeld, tussen de aanduiding van dat kantoor en dat jaartal.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.6'
    text: |-
      Met inachtneming van het eerste tot en met vijfde lid worden wijze en plaats van aanbrengen van een brandmerk
      in elk voorkomend geval bepaald door de ambtenaar van de Dienst of een andere door de bewaarder daarmee belaste
      persoon.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
  - number: '22.7'
    text: |-
      Zolang na de teboekstelling van een schip het brandmerk daar nog niet op is aangebracht, wordt dat feit door de
      bewaarder aangetekend in de registratie voor schepen en tevens op de stukken die hij met betrekking tot een zodanig
      schip afgeeft of toezendt ingevolge de [artikelen 99][ref1] en [101 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel101
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '101'
  - number: '24'
    text: |-
      Het brandmerk dat dient ter aanduiding van een schip in aanbouw, wordt ook gebruikt voor het afgebouwde
      schip. Na inschrijving van het in [artikel 13][ref1] bedoelde verzoek wordt in de gevallen, bedoeld in
      [artikel 22, tweede lid, tweede volzin][ref2], het brandmerk alsnog aangebracht op het achterschip, waarbij
      [artikel 22][ref3] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel22
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '13'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '22'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005260
        artikel: '22'
        hoofdstuk: '3'
  - number: '25.1'
    text: |-
      Onverminderd de [artikelen 22][ref1] en [24][ref2] brengt de eigenaar van een te boek staand binnenschip de naam
      en het brandmerk van het schip duidelijk zichtbaar in olieverf aan op een vast deel van het schip aan beide zijden
      of op het achterschip en wel in latijnse letters en arabische cijfers van ten minste vijftien centimeter hoogte in
      lichte kleur op een donkere ondergrond of in donkere kleur op een lichte ondergrond.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel24
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '22'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '24'
        hoofdstuk: '3'
  - number: '25.2'
    text: |-
      De in het eerste lid bedoelde vermelding van het brandmerk wordt aangebracht achter de naam van het schip. Indien
      het schip ook buitenslands wordt gebruikt, moet de genoemde vermelding worden gevolgd door de letter N, aan te
      brengen op dezelfde wijze als is bepaald in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel25
  - number: '25.3'
    text: |-
      De eigenaar moet voorts, op dezelfde wijze als is bepaald in het eerste lid, vóór de naam van het schip een cirkel
      aanbrengen met daarin de hoofdletter die hem daartoe door of vanwege Onze Minister van Verkeer en Waterstaat wordt
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel25
  - number: '25.4'
    text: |-
      Voor binnenschepen met een verplaatsing van minder dan twintig kubieke meter en voor pleziervaartuigen mogen
      letters en cijfers van geringere hoogte dan is bepaald in het eerste lid worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel25
  - number: '26.1'
    text: |-
      De eigenaar van een schip draagt zorg dat het brandmerk en de ingevolge artikel 25 op het schip aangebrachte naam
      en kentekens niet worden verwijderd, veranderd, dan wel onduidelijk of onzichtbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel26
  - number: '26.2'
    text: |-
      Ingeval het voornemen bestaat om een scheepsdeel waarop een brandmerk voorkomt geheel of gedeeltelijk te
      verwijderen, geeft de eigenaar van het schip hiervan kennis aan de bewaarder onder opgaaf van de reden van
      verwijdering en met een omschrijving van het bestaande brandmerk. De kennisgeving gaat vergezeld van een verzoek om
      het schip opnieuw te branden.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel26
  - number: '26.3'
    text: |-
      Indien een brandmerk is verdwenen of geheel of gedeeltelijk onleesbaar is geworden, verzoekt de eigenaar onverwijld
      schriftelijk de bewaarder het schip opnieuw te doen branden.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel26
  - number: '26.4'
    text: |-
      [Artikel 22][ref1] is van overeenkomstige toepassing in de gevallen, bedoeld in het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel22
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '22'
        hoofdstuk: '3'
  - number: '26.5'
    text: |-
      Indien bij reparatie of verbouwing van een schip het brandmerk of de ingevolge [artikel 25][ref1] aangebrachte naam
      en kentekens zijn verwijderd of beschadigd, draagt degene die de reparatie of verbouwing heeft uitgevoerd zorg, dat
      het schip niet wordt afgegeven voordat deze weer volledig zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel25
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '25'
        hoofdstuk: '3'
  - number: '28.1'
    text: |-
      De aangifte tot doorhaling van de teboekstelling van een zeeschip of zeevissersschip wordt ingediend bij
      de rechtbank. Bij het verzoekschrift, waarbij tevens de machtiging van de rechtbank tot doorhaling van de
      teboekstelling wordt gevraagd en dat het brandmerk van het schip moet bevatten, wordt een uittreksel overgelegd
      uit de registratie voor schepen, als bedoeld in [artikel 101, eerste lid, van de wet][ref1], vermeldende ten minste
      de gegevens, bedoeld in [artikel 85, tweede lid, onderdelen a, c tot en met g, i en l, van de wet][ref2], en de
      gegevens omtrent niet doorgehaalde voorlopige aantekeningen, alsmede de stukken waaruit de gestelde reden van de
      doorhaling blijkt. Indien de aangifte gedaan wordt op grond van het feit dat het schip vergaan is, gesloopt is of
      blijvend ongeschikt voor drijven is geworden, worden tevens stukken ter staving van de gegrondheid van de aangifte
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '28.2'
    text: |-
      De bewaarder haalt de teboekstelling van het schip slechts door, indien het verzoekschrift is voorzien van de
      desbetreffende machtiging van de rechtbank. Het verzoekschrift wordt ter inschrijving aangeboden.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel28
  - number: '28.3'
    text: |-
      Wanneer de bewaarder blijkt van enige omstandigheid die doorhaling van de teboekstelling van een zeeschip of
      zeevissersschip wettigt, dient hij bij de rechtbank een verzoek in hem tot ambtshalve doorhaling te machtigen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel28
  - number: '28.4'
    text: |-
      De bewaarder voegt bij het verzoekschrift een uittreksel uit de registratie voor schepen als bedoeld in het
      eerste lid, tweede zin, en alle andere bescheiden die tot staving van zijn verzoek kunnen dienen en die tot zijn
      beschikking staan. Het verzoekschrift, voorzien van de machtiging van de rechtbank, wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel28
  - number: '28.5'
    text: |-
      De eigenaar van een te boek staand zeeschip of zeevissersschip is bevoegd een verzoek tot doorhaling van de
      teboekstelling van het schip in te dienen. Het eerste en tweede lid zijn op dit verzoek van toepassing, met dien
      verstande dat de overlegging van stukken waaruit de reden van doorhaling blijkt, niet is vereist.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel28
  - number: '29'
    text: |-
      Wanneer een verzoek of aangifte is gedaan met het oog op doorhaling van de teboekstelling van een zeeschip of een
      zeevissersschip, geeft de bewaarder hieraan slechts gevolg, indien geen inschrijvingen of voorlopige aantekeningen
      ten gunste van derden betreffende het schip bestaan of, indien zodanige inschrijvingen of voorlopige aantekeningen
      wel bestaan, geen dezer derden zich tegen doorhaling verzet.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel29
  - number: '30.1'
    text: |-
      Het verzoek of de aangifte tot doorhaling van de teboekstelling van een binnenschip wordt ingediend bij de
      rechtbank. [Artikel 28, eerste lid, tweede en derde zin][ref1], is van toepassing. Indien het verzoek is gegrond
      op [artikel 786, eerste lid, onder a , ten eerste, van Boek 8 van het Burgerlijk Wetboek][ref2], worden tevens
      de stukken overgelegd waaruit blijkt dat de teboekstelling niet of niet meer verplicht is. Indien het verzoek is
      gegrond op [artikel 786, eerste lid, onder a , ten tweede, van Boek 8 van het Burgerlijk Wetboek][ref3], wordt
      tevens overgelegd een uittreksel uit het verdragsregister waarin wordt vermeld dat het schip onder voorwaarde van
      doorhaling in de openbare registers aldaar te boek gesteld is.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel786
      [ref3]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '786'
      - id: ref3
        bwb_id: BWBR0005034
        artikel: '786'
  - number: '30.2'
    text: |-
      [Artikel 28, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel28
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '30.3'
    text: |-
      Indien de teboekstelling wordt doorgehaald op de grond, genoemd in
      [artikel 786, eerste lid, onder a , ten tweede, van Boek 8 van het Burgerlijk Wetboek][ref1], geeft de bewaarder
      een bewijs van doorhaling af, waarin de datum van de doorhaling wordt vermeld en waarin, indien inschrijvingen
      of voorlopige aantekeningen ten gunste van derden op het schip bestaan, wordt vermeld dat hij zich ervan heeft
      vergewist, dat deze derden zich niet tegen doorhaling hebben verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '786'
  - number: '30.4'
    text: |-
      Indien de teboekstelling wordt doorgehaald op de grond, genoemd in
      [artikel 786, eerste lid, onder a , ten derde, van Boek 8 van het Burgerlijk Wetboek][ref1], vindt doorhaling
      plaats onder vermelding in de registratie voor schepen dat deze doorhaling slechts rechtsgevolg heeft, wanneer
      binnen 30 dagen daarna door de eigenaar ter inschrijving wordt aangeboden de door hem ondertekende verklaring,
      genoemd in het eerste lid, onder a, ten derde, van dat artikel. De verklaring moet melding maken van de plaats, de
      datum en het nummer van teboekstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '786'
  - number: '30.5'
    text: |-
      Indien een certificaat is afgegeven, wordt dit, tezamen met een eventueel duplicaat, onverwijld bij de bewaarder
      ingeleverd.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel30
  - number: '31.1'
    text: |-
      De eigenaar van een te boek staand binnenschip waarop
      [artikel 786, eerste lid, onder b , ten vijfde, van Boek 8 van het Burgerlijk Wetboek][ref1] van toepassing
      is en waarvan de teboekstelling in het buitenlandse register heeft plaatsgevonden voordat de op 25 januari
      1965 te Genève gesloten Overeenkomst inzake inschrijving van binnenschepen, met Protocollen (Trb. 1966, 228)
      voor de staat van dat register van kracht is geworden, is verplicht van de teboekstelling van het schip in het
      verdragsregister mededeling te doen aan de bewaarder, en daarbij tevens mede te delen of hij de teboekstelling
      in het verdragsregister zal handhaven. De in de eerste zin bedoelde mededelingen moeten worden gedaan binnen drie
      maanden nadat het buitenlandse register waarin het schip te boek staat de hoedanigheid van verdragsregister heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel786
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '786'
  - number: '31.2'
    text: |-
      Indien de eigenaar de in het eerste lid bedoelde mededelingen niet binnen de aldaar gestelde termijn heeft gedaan
      of indien hij heeft medegedeeld dat hij de teboekstelling in het verdragsregister wenst te handhaven, dient hij
      onverwijld een aangifte tot doorhaling van de teboekstelling overeenkomstig [artikel 30][ref1] in.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel30
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '31.3'
    text: |-
      Indien de eigenaar heeft medegedeeld dat hij de teboekstelling van het schip in het verdragsregister niet wenst
      te handhaven, draagt hij er zorg voor dat de teboekstelling in het verdragsregister wordt doorgehaald. Vindt geen
      doorhaling in het verdragsregister plaats binnen negen maanden nadat de in het eerste lid bedoelde mededelingen
      zijn gedaan, dan dient de eigenaar onverwijld een aangifte tot doorhaling van de teboekstelling overeenkomstig
      [artikel 30][ref1] in.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel30
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '30'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '31.4'
    text: Van de in het eerste lid bedoelde mededelingen wordt melding gemaakt in de registratie voor schepen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel31
  - number: '32'
    text: |-
      Wanneer de bewaarder blijkt van enige omstandigheid die doorhaling van de teboekstelling van een binnenschip
      wettigt, is [artikel 28, derde en vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel28
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '28'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '33'
    text: |-
      Wanneer een verzoek of aangifte is gedaan met het oog op doorhaling van de teboekstelling van een binnenschip, is
      [artikel 29][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel29
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '29'
        hoofdstuk: '3'
        afdeling: '1'
  - number: '34.1'
    text: |-
      Ingeval een schip is te boek gesteld dan wel de teboekstelling van een schip is doorgehaald, zendt de bewaarder
      daaromtrent per brief een kennisgeving aan de personen die dienaangaande volgens de bij de Dienst bekende gegevens
      belanghebbenden zijn.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel34
  - number: '34.2'
    text: Het bestuur van de Dienst stelt de vorm vast van de kennisgeving, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel34
  - number: '34.3'
    text: |-
      Indien de eigenaar bij de aanvraag van de teboekstelling daarom heeft verzocht en toestemming heeft gegeven,
      zendt de bewaarder na de teboekstelling van een zeeschip een bericht van de teboekstelling onder vermelding van
      specifieke kenmerken van het schip, waaronder het NSI-nummer, de tonnage van het schip en een omschrijving van het
      schip, aan Onze Minister van Infrastructuur en Waterstaat als beheerder van het vlagregister.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel34
  - number: '34.4'
    text: |-
      Bij het bericht, bedoeld in het derde lid, vermeldt de bewaarder tevens het registratienummer van het ingeschreven
      document en het brandmerk van het schip.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel34
  - number: '34.5'
    text: |-
      In geval van overdracht of doorhaling van de teboekstelling van een zeeschip of van overdracht van aandelen in een
      zeeschip, zendt de bewaarder daaromtrent een bericht onder vermelding van het brandmerk en het NSI-nummer, aan Onze
      Minister van Infrastructuur en Waterstaat als beheerder van het vlagregister.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel34
  - number: '35.1'
    text: |-
      Indien van een te boek staand schip de naam, bedoeld in [artikel 85, tweede lid, onder d, van de wet][ref1], of
      een gegeven als bedoeld in [artikel 85, tweede lid, onder f en g, van de wet][ref2] is gewijzigd, dan wel het schip
      enige andere wijziging heeft ondergaan waardoor de beschrijving van het schip in de registratie voor schepen niet
      meer aan de werkelijkheid beantwoordt, biedt de eigenaar een aangifte ter inschrijving aan waarin de wijziging
      wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '35.2'
    text: |-
      Indien de aangifte, bedoeld in het eerste lid, leidt tot bijwerking van de registratie voor schepen, zendt
      de bewaarder daarvan een bericht onder vermelding van het brandmerk en het NSI-nummer aan Onze Minister van
      Infrastructuur en Waterstaat als beheerder van het vlagregister.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35
  - number: '35.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing in geval van een wijziging door de bewaarder in de registratie
      voor schepen van informatie als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35
  - number: 35a.1
    text: |-
      Indien de Dienst een bericht ontvangt van Onze Minister van Infrastructuur en Waterstaat als beheerder van het
      vlagregister, inzake een wijziging als bedoeld in [artikel 11, eerste lid, van de rijkswet][ref1], neemt de Dienst
      een beslissing omtrent wijziging van het betreffende gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0048148#Artikel11
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0048148
        artikel: '11'
  - number: 35a.2
    text: |-
      Indien de Dienst de beslissing, bedoeld in het eerste lid, niet binnen één dag na ontvangst van die melding heeft
      genomen, tekent de Dienst in de registratie voor schepen aan dat het betreffende gegeven «in onderzoek» is.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
  - number: 35a.3
    text: |-
      De Dienst verwijdert de aantekening dat een gegeven «in onderzoek» is uit de registratie voor schepen tegelijk met
      de verwerking van de wijziging in die registratie of, indien een bericht als bedoeld in het eerste lid niet tot
      wijziging leidt, met de beslissing om het gegeven niet te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
  - number: 35a.4
    text: |-
      De beslissing, bedoeld in het tweede en derde lid, is een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 35a.5
    text: |-
      De Dienst zendt Onze Minister, genoemd in het eerste lid, onverwijld een bericht over een handeling of beslissing
      als bedoeld in het tweede of derde lid.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
  - number: 35a.6
    text: |-
      De Dienst doet onverwijld schriftelijk mededeling aan de belanghebbende van zijn beslissing op grond van het tweede
      of derde lid, indien die beslissing heeft geleid tot een wijziging van het betreffende gegeven.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel35a
  - number: '36'
    text: |-
      Onze Minister stelt de vorm vast van de in dit hoofdstuk voorziene verzoeken, verklaringen, evenwel met
      uitzondering van de in [artikel 14, vijfde lid][ref1], bedoelde verklaring van de bevoegde autoriteit, en aangiften
      met dien verstande, dat het bestuur van de Dienst de vorm van de in [artikel 35][ref2] bedoelde aangifte vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel35
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005260
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005260
        artikel: '35'
        hoofdstuk: '3'
  - number: 36a
    text: |-
      Het NSI-nummer wordt opgenomen in de registratie voor schepen, bedoeld in
      [artikel 85, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '85'
  - number: '37.1'
    text: |-
      Voorafgaand aan de inschrijving van een akte van levering van een te boek staand zeeschip of van aandelen daarin,
      wordt door de verkrijger bij de Dienst een aanvraag ingediend voor een verklaring dat voldaan wordt aan de in
      [artikel 194a van Boek 8 van het Burgerlijk Wetboek][ref1] van toepassing zijnde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194a
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: 194a
  - number: '37.2'
    text: De verklaring, bedoeld in het eerste lid, wordt afgegeven door de bewaarder.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
  - number: '37.3'
    text: |-
      Bij de inschrijving van een akte van levering van een te boek staand zeeschip of van aandelen daarin wordt,
      onverminderd het bepaalde in [artikel 24 van de wet][ref1], tevens de verklaring, bedoeld in het eerste lid, ter
      inschrijving aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel24
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '24'
  - number: '37.4'
    text: |-
      In de akte van levering verklaart de notaris dat de op grond van het eerste lid vereiste bewijsstukken en gegevens
      op het moment van aanbieden ter inschrijving actueel en ongewijzigd zijn.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
  - number: '37.5'
    text: De kosten van aanvraag en afgifte van de verklaring, bedoeld in het eerste lid, komen ten laste van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
  - number: '37.6'
    text: Het bestuur van de Dienst kan de vorm van de aanvraag en de verklaring, bedoeld in het eerste lid, vaststellen.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
  - number: '37.7'
    text: |-
      Het bestuur van de Dienst stelt eisen ten aanzien van de bij een aanvraag voor de verklaring, bedoeld in het eerste
      lid, te overleggen bewijsstukken en gegevens.
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel37
  - number: '38'
    text: |-
      Onverminderd het bepaalde in [artikel 24 van de wet][ref1] wordt ter inschrijving van een akte van levering,
      ingeval het de levering van een te boek staand zeevissersschip of van aandelen daarin betreft, overgelegd bij
      het daartoe ter inschrijving aangeboden stuk het bewijs, genoemd in [artikel 16, eerste lid, onder d. ][ref2] Dit
      bewijs wordt na vergelijking met het stuk waarvan de inschrijving verlangd wordt, aan de aanbieder teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel16
    url: https://wetten.overheid.nl/BWBR0005260/2025-07-01#Artikel38
