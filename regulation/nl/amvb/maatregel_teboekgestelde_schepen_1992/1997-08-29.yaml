  - number: '24'
    text: |-
      Het brandmerk dat dient ter aanduiding van een schip in aanbouw, wordt ook gebruikt voor het afgebouwde
      schip. Na inschrijving van het in [artikel 13][ref1] bedoelde verzoek wordt in de gevallen, bedoeld in
      [artikel 22, tweede lid, tweede volzin][ref2], het brandmerk alsnog aangebracht op het achterschip, waarbij
      [artikel 22][ref3] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel22
