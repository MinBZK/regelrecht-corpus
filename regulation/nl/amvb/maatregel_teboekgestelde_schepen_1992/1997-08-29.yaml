  - number: '16'
    text: |-
      1 Betreft een verzoek tot teboekstelling een zeevissersschip of een binnenschip, dan wordt bij het verzoek
      overgelegd:

      a. de meetbrief, afgegeven volgens de bestaande wettelijke voorschriften;

      b. indien het schip direct van de bouwer is verkregen, de door deze afgegeven bijlbrief;

      c. indien het schip niet direct van de bouwer is verkregen, de koopbrief dan wel enig ander bewijsstuk van
      eigendom;

      d. indien het een zeevissersschip betreft, een bewijs dat het schip is ingeschreven in een krachtens
      [artikel 3 der Visserijwet 1963][ref1] aangehouden register.

      2 Indien aan de bewaarder aannemelijk wordt gemaakt dat geen meetbrief kan worden overgelegd, omdat het schip niet
      gemeten is, kan in de plaats daarvan worden volstaan met:

      a. voor zover het een zeevissersschip betreft, in het verzoek te vermelden dat geen meetbrief kan worden
      overgelegd;

      b. voor zover het een binnenschip betreft, het verstrekken van gegevens op grond waarvan volgens de in Nederland
      gangbare methode van berekening het laadvermogen in tonnen van 1000 kilogram of de verplaatsing kan worden
      berekend.

      3 Indien geen bijlbrief kan worden overgelegd, moet in het verzoek worden verklaard dat deze niet bestaat met
      opgaaf van de reden.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel3
