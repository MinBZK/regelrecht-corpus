  - number: '10'
    text: |-
      1 Voor een verloren geraakt, versleten, geheel of ten dele onleesbaar of te niet gegaan afgegeven certificaat
      kan door de bewaarder een vervangend certificaat worden uitgereikt. Het certificaat, waarvoor het vervangende
      certificaat in de plaats komt, verliest zijn geldigheid, evenals een duplicaat hetwelk is afgegeven overeenkomstig
      [artikel 9, vierde lid][ref1].

      2 De bewaarder tekent op het vervangende certificaat de reden van de vervanging aan.

      3 Voor zover het certificaat, waarvan de vervanging wordt verzocht nog aanwezig is, wordt dit bij het verzoek tot
      afgifte van het vervangende certificaat bij de bewaarder ingeleverd. Hetzelfde geldt ten aanzien van een afgegeven
      duplicaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel9
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel10
