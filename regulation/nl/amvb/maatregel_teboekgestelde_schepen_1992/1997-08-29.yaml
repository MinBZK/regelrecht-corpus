  - number: '2'
    text: |-
      De verplichtingen welke krachtens dit besluit rusten op de eigenaar van een schip of van een schip in aanbouw,
      rusten, indien het schip, onderscheidenlijk het schip in aanbouw toebehoort aan meer personen, aan een vennootschap
      onder firma, aan een commanditaire vennootschap of aan een rechtspersoon, mede op iedere deelgenoot, beherende
      vennoot of bestuurder en, indien toepassing is gegeven aan artikel 163 van Boek 8 van het Burgerlijk Wetboek, op de
      boekhouder, bedoeld in dat artikel.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel2
  - number: '3'
    text: |-
      1 De rubrieken, bedoeld in [artikel 21, tweede lid, van de Kadasterwet][ref1], waarin schepen worden onderscheiden
      zijn:

      a. Nederlandse zeeschepen;

      b. zeevissersschepen;

      c. binnenschepen.

      2 Deze rubrieken worden aangeduid met een hoofdletter, onderscheidenlijk Z, V of B.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel21
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '21'
  - number: '4'
    text: |-
      Indien een schip tot een andere rubriek dan die waarin het teboekstaat gaat behoren, is de eigenaar verplicht
      een nieuwe teboekstelling te verzoeken met inachtneming van de [artikelen 14 en 16 tot en met 19][ref1], met dien
      verstande dat de overlegging van de stukken genoemd in [artikel 16, eerste lid, onder ][ref2], niet is vereist.
      In het verzoek tot een nieuwe teboekstelling moet de bestaande worden vermeld. De bestaande teboekstelling wordt
      doorgehaald met inachtneming van de [artikelen 28 tot en met 33][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel28
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel4
