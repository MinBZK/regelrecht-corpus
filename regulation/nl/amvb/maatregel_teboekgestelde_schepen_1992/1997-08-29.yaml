        afdeling: '1'
  - number: '31'
    text: |-
      1 De eigenaar van een teboekstaand binnenschip waarop artikel 786, eerste lid, onder , ten vijfde, van Boek 8
      van het Burgerlijk Wetboek van toepassing is en waarvan de teboekstelling in het buitenlandse register heeft
      plaatsgevonden voordat de op 25 januari 1965 te Genève gesloten Overeenkomst inzake inschrijving van binnenschepen,
      met Protocollen (*Trb.* 1966, 228) voor de staat van dat register van kracht is geworden, is verplicht van de
      teboekstelling van het schip in het verdragsregister mededeling te doen aan het kantoor waar het schip teboekstaat,
      en daarbij tevens mede te delen of hij de teboekstelling in het verdragsregister zal handhaven. De in de eerste
      zin bedoelde mededelingen moeten worden gedaan binnen drie maanden nadat het buitenlandse register waarin het schip
      teboekstaat de hoedanigheid van verdragsregister heeft verkregen.

      2 Indien de eigenaar de in het eerste lid bedoelde mededelingen niet binnen de aldaar gestelde termijn heeft gedaan
      of indien hij heeft medegedeeld dat hij de teboekstelling in het verdragsregister wenst te handhaven, dient hij
      onverwijld een aangifte tot doorhaling van de teboekstelling overeenkomstig [artikel 30][ref1] in.

      3 Indien de eigenaar heeft medegedeeld dat hij de teboekstelling van het schip in het verdragsregister niet wenst
      te handhaven, draagt hij er zorg voor dat de teboekstelling in het verdragsregister wordt doorgehaald. Vindt geen
      doorhaling in het verdragsregister plaats binnen negen maanden nadat de in het eerste lid bedoelde mededelingen
      zijn gedaan, dan dient de eigenaar onverwijld een aangifte tot doorhaling van de teboekstelling overeenkomstig
      [artikel 30][ref2] in.

      4 Van de in het eerste lid bedoelde mededelingen wordt melding gemaakt in de registratie voor schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel30
