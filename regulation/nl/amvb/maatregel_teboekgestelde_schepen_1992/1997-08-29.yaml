  - number: '34'
    text: |-
      1 Ingeval een schip is teboekgesteld dan wel de teboekstelling van een schip is doorgehaald, zendt de Dienst
      daaromtrent per brief een kennisgeving aan de personen die dienaangaande volgens de bij de Dienst bekende gegevens
      belanghebbenden zijn.

      2 Het bestuur van de Dienst stelt de vorm vast van de in het eerste lid bedoelde kennisgevingen.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel34
  - number: '35'
    text: |-
      Indien van een teboekstaand schip enig in [artikel 85, tweede lid, onder ][ref1] genoemd gegeven is gewijzigd, dan
      wel het schip enige andere wijziging heeft ondergaan waardoor de beschrijving van het schip in de registratie voor
      schepen niet meer aan de werkelijkheid beantwoordt, biedt de eigenaar een aangifte ter inschrijving aan waarin de
      wijziging wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel85
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel35
