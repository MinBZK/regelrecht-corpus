  - number: '22'
    text: |-
      1 Zodra een verzoek tot teboekstelling van een schip of van een schip in aanbouw is ingeschreven, laat de bewaarder
      het brandmerk door een ambtenaar van de Dienst of een andere door de bewaarder daarmee belaste persoon op het schip
      aanbrengen.

      2 Het brandmerk, bedoeld in het eerste lid, wordt aangebracht op het achterschip, tenzij dit, ingeval het verzoek
      tot teboekstelling betreft een schip in aanbouw, niet mogelijk is. In dat geval wordt het brandmerk dat dient ter
      aanduiding van een schip in aanbouw, aangebracht op een scheepsdeel van het schip in aanbouw.

      3 De bewaarder vermeldt de branding in de registratie voor schepen, onder aantekening van de plaats van het
      brandmerk op het schip, de aangetroffen oude brandmerken alsmede de ongeldigmaking daarvan.

      4 Indien de branding in het buitenland heeft plaatsgevonden en de bevoegde buitenlandse autoriteit de bewaarder
      daarvan schriftelijk kennis heeft gegeven, is het derde lid van toepassing.

      5 Indien het schip reeds is gebrand, worden bij de branding van de nieuwe merken de bestaande voorzien van een
      staand kruis tussen de aanduiding van het kantoor en van het jaartal.

      6 Met inachtneming van het eerste tot en met vijfde lid worden wijze en plaats van aanbrengen van een brandmerk
      geval bepaald door de ambtenaar van de Dienst of een andere door de bewaarder daarmee belaste persoon.

      7 Zolang na de teboekstelling van een schip het brandmerk daar nog niet op is aangebracht, wordt dat feit door de
      bewaarder aangetekend in de registratie voor schepen en tevens op de stukken die hij met betrekking tot een zodanig
      schip afgeeft of toezendt ingevolge de [artikelen 99][ref1] en [106 van de Kadasterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel106
