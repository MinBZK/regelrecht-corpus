    text: |-
      1 Onverminderd het bepaalde in [artikel 24 van de Kadasterwet][ref1] wordt ter inschrijving van een akte van
      levering van een teboekstaand zeeschip of van aandelen daarin, tenzij het de levering van een zeevissersschip
      of van aandelen daarin betreft, bij die akte tevens ter inschrijving aangeboden een verklaring afgegeven door of
      namens Onze Minister van Verkeer en Waterstaat dat met betrekking tot het schip voldaan blijft worden aan de in
      [artikel 311 van het Wetboek van Koophandel][ref2] genoemde vereisten. De in de eerste zin bedoelde verklaring
      bevat de in [artikel 21, eerste lid, onder ][ref3] bedoelde gegevens.

      2 De in het eerste lid bedoelde verklaring wordt door of namens Onze Minister van Verkeer en
      Waterstaat afgegeven op aanvraag van de verkrijger, indien voldaan blijft worden aan de in
      [artikel 311 van het Wetboek van Koophandel][ref4] genoemde vereisten.

      3 De kosten van aanvraag en afgifte van een verklaring als bedoeld in het eerste lid, komen ten laste van de
      aanvrager. Het tarief voor deze kosten wordt vastgesteld bij regeling van Onze Minister van Verkeer en Waterstaat.


