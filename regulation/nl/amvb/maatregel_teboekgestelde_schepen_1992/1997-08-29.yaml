  - number: '5'
    text: |-
      1 Het hoofdkantoor houdt het verband met en tussen de gezamenlijke kantoren in stand en het oefent toezicht uit op
      de werkzaamheden, bedoeld in [artikel 7, eerste lid, onder ][ref1], voor zover het schepen betreft.

      2 Aan het hoofdkantoor wordt een registratie voor schepen gehouden en bijgehouden betreffende alle teboekgestelde
      schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel7
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '7'
  - number: '6'
    text: |-
      1 Wanneer blijkt dat een zelfde schip op verschillende kantoren teboekstaat, doet de bewaarder van het hoofdkantoor
      daarvan opgaaf aan de bewaarders wie dit aangaat.

      2 De bewaarder van het hoofdkantoor beslist welke teboekstelling gehandhaafd blijft. Hij maakt van zijn bevinding
      zo nodig proces-verbaal op en zendt dit aan het Openbaar Ministerie.

      3 Wanneer blijkt dat op het schip brandmerken voorkomen die daarop, al dan niet in verband met de genomen
      beslissing, niet behoren voor te komen, laat de bewaarder van het hoofdkantoor deze door een ambtenaar van de
      Dienst of een andere door de bewaarder daarmee belaste persoon vernietigen.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel6
  - number: '7'
    text: |-
      De bewaarder is bevoegd ter zake van het verzoek tot teboekstelling van een binnenschip en ter zake van het verzoek
      of de aangifte tot doorhaling van de teboekstelling van een binnenschip rechtstreeks in briefwisseling te treden
      met de houder van het desbetreffende verdragsregister. De briefwisseling kan door de bewaarder in de Nederlandse
      taal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel7
  - number: '8'
    text: |-
      1 De teboekstelling vindt plaats door de inschrijving van het verzoek tot teboekstelling in het register, genoemd
      in artikel 193 dan wel artikel 783 van Boek 8 van het Burgerlijk Wetboek.

      2 De teboekstelling van schepen geschiedt voor ieder schip onder een eigen nummer. De gebruikte nummers van de
      rubriek binnenschepen vormen per kantoor een ononderbroken reeks.

      3 De inschrijvingen van verzoeken tot teboekstelling van zeeschepen en zeevissersschepen in het desbetreffende
      register geschieden onder een per kantoor doorlopend nummer.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel8
  - number: 8a
    text: |-
      Stukken ter verkrijging van inschrijving van feiten die betrekking hebben op schepen of op de rechten waaraan deze
      onderworpen zijn, worden aangeboden aan het kantoor waar het desbetreffende schip te boek staat.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel8a
  - number: '9'
    text: |-
      1 De bewaarder geeft voor een teboekstaand binnenschip aan de eigenaar een certificaat af waarop staan vermeld:

      a. de naam van het kantoor van afgifte, onder vermelding dat het in Nederland is gevestigd;

      b. de gegevens, bedoeld in artikel 85, tweede lid, onder , met uitzondering evenwel van gegevens met betrekking tot
      beperkt gerechtigden, [onder ][ref1], sub 2°, onder *d* tot en met *g*, en onder *j*, van de [Kadasterwet][ref2].

      2 Indien het schip in een verdragsregister teboekstaat, wordt geen certificaat afgegeven dan nadat voldaan is aan
      de in [artikel 18][ref3] gestelde voorwaarden.

      3 Indien er wijzigingen optreden in de op het certificaat vermelde gegevens betreffende het teboekstaande
      binnenschip, levert de eigenaar het certificaat bij de bewaarder in. Aan hem wordt door de bewaarder een nieuw
      certificaat afgegeven, waarop de wijzigingen zijn aangebracht.

      4 Op verzoek van de eigenaar wordt hem een duplicaat verstrekt, dat wordt gelijkgesteld met het certificaat. Het
      duplicaat moet als zodanig herkenbaar zijn en de afgifte ervan wordt door de bewaarder op het certificaat vermeld.
      De eigenaar stelt daartoe het certificaat aan de bewaarder ter hand.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004541
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel18
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel9
