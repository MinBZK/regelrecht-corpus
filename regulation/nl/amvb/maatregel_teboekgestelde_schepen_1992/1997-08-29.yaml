  - number: '28'
    text: |-
      1 De aangifte tot doorhaling van de teboekstelling van een zeeschip of zeevissersschip wordt ingediend bij
      de rechtbank. Bij het verzoekschrift, waarbij tevens de machtiging van de rechtbank tot doorhaling van de
      teboekstelling wordt gevraagd en dat het brandmerk van het schip moet bevatten, wordt een uittreksel overgelegd
      uit de registratie voor schepen, als bedoeld in [artikel 106, eerste lid, van de Kadasterwet][ref1], vermeldende
      ten minste de gegevens, bedoeld in artikel 85, tweede lid, onder *a, c, d, e, f, g* en *j*, van die wet, en de
      gegevens omtrent niet doorgehaalde voorlopige aantekeningen, alsmede de stukken waaruit de gestelde reden van de
      doorhaling blijkt. Indien de aangifte gedaan wordt op grond van het feit dat het schip vergaan is, gesloopt is of
      blijvend ongeschikt voor drijven is geworden, worden tevens stukken ter staving van de gegrondheid van de aangifte
      overgelegd.

      2 De bewaarder haalt de teboekstelling van het schip slechts door, indien het verzoekschrift is voorzien van de
      desbetreffende machtiging van de rechtbank. Het verzoekschrift wordt ter inschrijving aangeboden.

      3 Wanneer de bewaarder blijkt van enige omstandigheid die doorhaling van de teboekstelling van een zeeschip of
      zeevissersschip wettigt, dient hij bij de rechtbank een verzoek in hem tot ambtshalve doorhaling te machtigen.

      4 De bewaarder voegt bij het verzoekschrift een uittreksel uit de registratie voor schepen, als bedoeld in het
      eerste lid, tweede zin, en alle andere bescheiden die tot staving van zijn verzoek kunnen dienen en die tot zijn
      beschikking staan. Het verzoekschrift, voorzien van de machtiging van de rechtbank, wordt ingeschreven.

      5 De eigenaar van een teboekstaand zeeschip of zeevissersschip is bevoegd een verzoek tot doorhaling van de
      teboekstelling van het schip in te dienen. Het eerste en tweede lid zijn op dit verzoek van toepassing, met dien
      verstande dat de overlegging van stukken waaruit de reden van doorhaling blijkt, niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel106
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '106'
  - number: '29'
    text: |-
      Wanneer een verzoek of aangifte is gedaan met het oog op doorhaling van de teboekstelling van een zeeschip of een
      zeevissersschip, geeft de bewaarder hieraan slechts gevolg, indien geen inschrijvingen of voorlopige aantekeningen
      ten gunste van derden betreffende het schip bestaan of, indien zodanige inschrijvingen of voorlopige aantekeningen
      wel bestaan, geen dezer derden zich tegen doorhaling verzet.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel29
  - number: '30'
    text: |-
      1 Het verzoek of de aangifte tot doorhaling van de teboekstelling van een binnenschip wordt ingediend bij de
      rechtbank. Artikel 28, eerste lid, tweede en derde zin, is van toepassing. Indien het verzoek is gegrond op artikel
      786, eerste lid, onder , ten eerste, van Boek 8 van het Burgerlijk Wetboek, worden tevens de stukken overgelegd
      waaruit blijkt dat de teboekstelling niet of niet meer verplicht is. Indien het verzoek is gegrond op artikel 786,
      eerste lid, onder , ten tweede, van Boek 8 van het Burgerlijk Wetboek, wordt tevens overgelegd een uittreksel uit
      het verdragsregister waarin wordt vermeld dat het schip onder voorwaarde van doorhaling in het Nederlandse register
      aldaar teboekgesteld is.

      2 [Artikel 28, tweede lid][ref1], is van overeenkomstige toepassing.

      3 Indien de teboekstelling wordt doorgehaald op de grond, genoemd in artikel 786, eerste lid, onder , ten tweede,
      van Boek 8 van het Burgerlijk Wetboek, geeft de bewaarder een bewijs van doorhaling af, waarin de datum van de
      doorhaling wordt vermeld en waarin, indien inschrijvingen of voorlopige aantekeningen ten gunste van derden op het
      schip bestaan, wordt vermeld dat hij zich ervan heeft vergewist, dat deze derden zich niet tegen doorhaling hebben
      verzet.

      4 Indien de teboekstelling wordt doorgehaald op de grond, genoemd in artikel 786, eerste lid, onder , ten derde,
      van Boek 8 van het Burgerlijk Wetboek, vindt doorhaling plaats onder vermelding in de registratie voor schepen dat
      deze doorhaling slechts rechtsgevolg heeft, wanneer binnen 30 dagen daarna door de eigenaar ter inschrijving wordt
      aangeboden de door hem ondertekende verklaring, genoemd in het eerste lid, onder *a*, ten derde, van dat artikel.
      De verklaring moet melding maken van de plaats, de datum en het nummer van teboekstelling.

      5 Indien een certificaat is afgegeven, wordt dit, tezamen met een eventueel duplicaat, onverwijld bij de bewaarder
      ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel28
