  - number: '25'
    text: |-
      1 Onverminderd de [artikelen 22][ref1] en [24][ref2] brengt de eigenaar van een teboekstaand binnenschip de naam
      en het brandmerk van het schip duidelijk zichtbaar in olieverf aan op een vast deel van het schip aan beide zijden
      of op het achterschip en wel in latijnse letters en arabische cijfers van ten minste vijftien centimeter hoogte in
      lichte kleur op een donkere ondergrond of in donkere kleur op een lichte ondergrond.

      2 De in het eerste lid bedoelde vermelding van het brandmerk wordt aangebracht achter de naam van het schip. Indien
      het schip ook buitenslands wordt gebruikt, moet de genoemde vermelding worden gevolgd door de [letter N][ref3], aan
      te brengen op dezelfde wijze als is bepaald in het eerste lid.

      3 De eigenaar moet voorts, op dezelfde wijze als is bepaald in het eerste lid, vóór de naam van het schip een
      cirkel aanbrengen met daarin de hoofdletter die hem daartoe door of vanwege Onze Minister van Verkeer en Waterstaat
      wordt medegedeeld.

      4 Voor binnenschepen met een verplaatsing van minder dan twintig kubieke meter en voor pleziervaartuigen mogen
      letters en cijfers van geringere hoogte dan is bepaald in het eerste lid worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel25
