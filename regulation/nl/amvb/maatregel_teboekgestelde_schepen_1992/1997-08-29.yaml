  - number: '12'
    text: |-
      1 De eigenaar van een in Nederland in aanbouw zijnd schip die daarvan de teboekstelling wenst te
      verkrijgen, biedt op het kantoor van zijn keuze een daartoe strekkend verzoek ter inschrijving aan,
      dat tevens een bewijs dat het schip in Nederland in aanbouw is en een verklaring van eigendom dient in
      te houden, alsmede de verklaring, bedoeld in [artikel 194, vierde lid, tweede volzin][ref1], dan wel
      [artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek][ref2].

      2 Een schip in aanbouw kan worden teboekgesteld, zodra de bewaarder aannemelijk is gemaakt dat met de bouw van het
      schip is begonnen en dat het schip in Nederland in aanbouw is.

      3 [Artikel 14, derde lid][ref3], is van toepassing. Indien het verzoek een binnenschip in aanbouw betreft, zijn
      bovendien de [artikelen 17][ref4] en [18][ref5] van toepassing. Indien het verzoek een zeeschip in aanbouw of een
      zeevissersschip in aanbouw betreft, is bovendien [artikel 19][ref6] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel194
