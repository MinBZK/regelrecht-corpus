  - number: '36'
    text: |-
      Onze Minister stelt de vorm vast van de in dit hoofdstuk voorziene verzoeken, verklaringen, evenwel met
      uitzondering van de in [artikel 14, eerste onderscheidenlijk derde lid][ref1], bedoelde verklaring van Onze
      Minister van Verkeer en Waterstaat onderscheidenlijk van de bevoegde autoriteit, en aangiften met dien verstande,
      dat het bestuur van de Dienst de vorm van de in [artikel 35][ref2] bedoelde aangifte vaststelt.


