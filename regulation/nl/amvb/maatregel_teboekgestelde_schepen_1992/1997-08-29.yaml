  - number: '26'
    text: |-
      1 De eigenaar van een schip draagt zorg dat het brandmerk en de ingevolge artikel 25 op het schip aangebrachte naam
      en kentekens niet worden verwijderd, veranderd, dan wel onduidelijk of onzichtbaar worden gemaakt.

      2 Ingeval het voornemen bestaat om een scheepsdeel waarop een brandmerk voorkomt geheel of gedeeltelijk te
      verwijderen, geeft de eigenaar van het schip hiervan kennis aan de bewaarder onder opgaaf van de reden van
      verwijdering en met een omschrijving van het bestaande brandmerk. De kennisgeving gaat vergezeld van een verzoek om
      het schip opnieuw te branden.

      3 Indien een brandmerk is verdwenen of geheel of gedeeltelijk onleesbaar is geworden, verzoekt de eigenaar
      onverwijld schriftelijk de bewaarder het schip opnieuw te doen branden.

      4 [Artikel 22][ref1] is van overeenkomstige toepassing in de gevallen, bedoeld in het tweede en derde lid.

      5 Indien bij reparatie of verbouwing van een schip het brandmerk of de ingevolge [artikel 25][ref2] aangebrachte
      naam en kentekens zijn verwijderd of beschadigd, draagt degene die de reparatie of verbouwing heeft uitgevoerd
      zorg, dat het schip niet wordt afgegeven voordat deze weer volledig zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel25
