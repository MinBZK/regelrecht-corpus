  - number: '13'
    text: |-
      1 Hij, te wiens name een zeeschip in aanbouw of een zeevissersschip in aanbouw teboekstaat, is verplicht na de
      afbouw en voordat hij het schip aan een ander levert een verzoek ter inschrijving aan te bieden inhoudende de
      teboekstelling als afgebouwd schip. Op dit verzoek zijn de [artikelen 24][ref1] en [26][ref2] van toepassing. De
      artikelen 14 en 16 zijn niet van toepassing, met dien verstande dat bij het verzoek wordt overgelegd de meetbrief,
      afgegeven volgens de bestaande wettelijke voorschriften.

      2 Hij, te wiens name een zeeschip in aanbouw of een zeevissersschip in aanbouw teboekstaat, is verplicht om,
      indien hij het schip zelf in de vaart brengt, na de afbouw en voordat hij het schip in de vaart brengt, een
      verzoek ter inschrijving aan te bieden inhoudende de teboekstelling als afgebouwd schip. Op dit verzoek zijn de
      [artikelen 16][ref3], [24][ref4] en [26][ref5] van toepassing. Het verzoek dient tevens in te houden de verklaring,
      bedoeld in artikel 194, vierde lid, tweede volzin, van Boek 8 van het Burgerlijk Wetboek en vergezeld te gaan van
      de verklaring van Onze Minister van Verkeer en Waterstaat, bedoeld in de vierde volzin van dat lid.

      3 Hij, te wiens name een binnenschip in aanbouw teboekstaat, is verplicht binnen drie maanden na de afbouw aan
      het kantoor waar het schip teboekstaat, mede te delen of het afgebouwde schip voldoet aan ten minste één der in
      artikel 784, eerste lid, van Boek 8 van het Burgerlijk Wetboek te dien aanzien gestelde voorwaarden. Indien het
      schip aan ten minste één van deze voorwaarden voldoet, is hij verplicht om een verzoek ter inschrijving aan te
      bieden inhoudende de teboekstelling als afgebouwd schip. Op dit verzoek zijn de [artikelen 16][ref6], [17][ref7],
      [18][ref8], [24][ref9] en [26][ref10] van toepassing. Het verzoek dient tevens in te houden de verklaring, bedoeld
      in artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek. Wanneer één of meer van de over te leggen
      stukken ontbreken, onvolledig zijn of niet met elkaar of met de aangeboden verklaring overeenstemmen, of wanneer
      hij mededeelt dat het afgebouwde binnenschip niet aan ten minste één der bovengenoemde voorwaarden voldoet, wordt
      de teboekstelling met inachtneming van de [artikelen 30 tot en met 33][ref11] doorgehaald.


