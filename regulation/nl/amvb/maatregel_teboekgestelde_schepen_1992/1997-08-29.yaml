preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 24 januari
    1991, nr. MJZ24191043, Centrale Directie Juridische Zaken, afdeling Wetgeving, gedaan mede namens Onze Ministers
    van Justitie en van Verkeer en Waterstaat;

    Overwegende, dat het, in verband met de inwerkingtreding van de Kadasterwet (Stb. 1991, 570) en de Aanpassingswet
    Boek 8, noodzakelijk is om de Maatregel teboekgestelde schepen 1990 (Stb. 500) te vervangen door een nieuwe
    regeling, mede strekkend tot uitvoering van de te Genève gesloten Overeenkomst van 25 januari 1965 inzake
    inschrijving van binnenschepen, met Protocollen (Trb. 1966, 228);

    Gelet op de artikelen 231 en 841 van Boek 8 van het Burgerlijk Wetboek en de artikelen 4, eerste lid, 10, derde
    lid, en 21, tweede lid, van de Kadasterwet;

    De Raad van State gehoord, advies van 13 augustus 1991, no. W08.91.0047;

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 29
    oktober 1991, nr. MJZ29o91013, Centrale Directie Juridische Zaken, afdeling Wetgeving, uitgebracht mede namens Onze
    Ministers van Justitie en van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      b. de Dienst: de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref1];

      c. kantoor: een kantoor van de Dienst waar openbare registers als bedoeld in [artikel 8, eerste lid, onder ][ref2]
      en een registratie voor schepen als bedoeld in artikel 85 van die wet worden gehouden;

      d. hoofdkantoor: het ingevolge artikel 4, eerste lid, tweede zin, van de [Kadasterwet][ref3] door het bestuur van
      de Dienst als hoofdkantoor van de openbare registers en registratie voor schepen aangewezen kantoor van de Dienst;

      e. bewaarder: de bewaarder, bedoeld in [artikel 6 van de Kadasterwet][ref4];

      f. verdragsregister: een verdragsregister als bedoeld in artikel 781, onder *d*, van Boek 8 van het Burgerlijk
      Wetboek;

      g. brandmerk: het in [artikel 21, eerste lid, onder ][ref5] bedoelde brandmerk, aangebracht op het schip
      overeenkomstig [artikel 22][ref6];

      h. verplaatsing van een binnenschip: hetgeen daaronder wordt verstaan in artikel 785, tweede lid, onder *a*, van
      Boek 8 van het Burgerlijk Wetboek;

      i. branden: het duurzaam aanbrengen van een brandmerk.


