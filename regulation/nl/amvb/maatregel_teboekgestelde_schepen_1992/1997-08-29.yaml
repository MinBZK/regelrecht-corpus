  - number: '19'
    text: |-
      1 Indien een zeeschip of een zeevissersschip, waarvan de teboekstelling wordt verzocht, reeds in een buitenlands
      register teboekstaat, wordt in de registratie voor schepen vermeld dat deze teboekstelling slechts rechtsgevolg
      heeft indien zich één der gevallen, bedoeld in artikel 194, derde lid, van Boek 8 van het Burgerlijk Wetboek
      voordoet.

      2 [Artikel 18, tweede lid][ref1], is van overeenkomstige toepassing.

      3 De in het eerste lid genoemde vermelding wordt doorgehaald indien binnen 30 dagen na de teboekstelling een bewijs
      wordt ingeschreven waaruit blijkt dat de teboekstelling in het buitenlandse register waarin het schip teboekstond,
      is doorgehaald.

      4 Ingeval de bewaarder van het buitenlandse register doorhaling weigert, wordt zulks in de registratie voor schepen
      vermeld na inschrijving van een afschrift van het verzoek tot doorhaling en een bewijs van weigering door de
      bewaarder van het buitenlandse register. Hij haalt de in het eerste lid genoemde vermelding door.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel18
