  - number: '17'
    text: |-
      1 Bij het verzoek tot teboekstelling van een binnenschip worden de bewijsstukken overgelegd dat het schip voldoet
      aan ten minste één der in artikel 784, eerste lid, van Boek 8 van het Burgerlijk Wetboek te dien aanzien gestelde
      voorwaarden.

      2 Wanneer één of meer van de in het eerste lid genoemde stukken ontbreken, onvolledig zijn, of niet met elkaar of
      met de in artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek bedoelde verklaring in overeenstemming
      zijn, wordt de inschrijving geweigerd.
    url: https://wetten.overheid.nl/BWBR0005260/1997-08-29#Artikel17
  - number: '18'
    text: |-
      1 Indien een binnenschip, waarvan de teboekstelling verzocht wordt, reeds in een verdragsregister teboekstaat,
      wordt in de registratie voor schepen vermeld dat deze teboekstelling slechts rechtsgevolg heeft nadat de
      teboekstelling van het schip in het verdragsregister is doorgehaald.

      2 De bewaarder verstrekt aan de eigenaar van het binnenschip een uittreksel uit de registratie voor schepen, als
      bedoeld in [artikel 106, eerste lid, van de Kadasterwet][ref1], vermeldende ten minste de gegevens, bedoeld in
      artikel 85, tweede lid, onder *a*, *c*, *d*, *e*, *f*, *g* en *j*, van die wet, alsmede de gegevens omtrent niet
      doorgehaalde voorlopige aantekeningen.

      3 De in het eerste lid genoemde vermelding wordt doorgehaald na inschrijving van een bewijs waaruit blijkt dat de
      teboekstelling in het verdragsregister waar het binnenschip teboekstond, is doorgehaald. De bewaarder geeft aan de
      eigenaar van het binnenschip het in [artikel 9][ref2] genoemde certificaat af.

      4 Indien het geval, genoemd in artikel 784, vierde lid, van Boek 8 van het Burgerlijk Wetboek zich voordoet, wordt
      zulks in de registratie voor schepen vermeld na inschrijving van een bewijs van weigering door de bewaarder van
      het verdragsregister. De bewaarder geeft aan de eigenaar van het binnenschip het in [artikel 9][ref3] genoemde
      certificaat af en tekent op het certificaat eveneens aan dat het geval genoemd in artikel 784, vierde lid, van Boek
      8 van het Burgerlijk Wetboek zich heeft voorgedaan. Hij haalt de in het eerste lid genoemde vermelding door.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005260#Artikel9
