  - number: '38'
    text: |-
      Onverminderd het bepaalde in [artikel 24 van de Kadasterwet][ref1] wordt ter inschrijving van een akte van
      levering, ingeval het de levering van een teboekstaand zeevissersschip of van aandelen daarin betreft, overgelegd
      bij het daartoe ter inschrijving aangeboden stuk het bewijs, genoemd in [artikel 16, eerste lid, onder ][ref2] Dit
      bewijs wordt na vergelijking met het stuk waarvan de inschrijving verlangd wordt, aan de aanbieder teruggegeven.


