  - number: '14'
    text: |-
      1 Hij die van een schip de teboekstelling wenst te verkrijgen, biedt op het kantoor van zijn keuze een daartoe
      strekkend verzoek ter inschrijving aan, dat tevens een verklaring van eigendom dient in te houden, alsmede de
      verklaring, bedoeld in artikel 194, vierde lid, tweede volzin, die, indien het een verzoek tot teboekstelling van
      een zeeschip, niet zijnde een zeevissersschip betreft, vergezeld dient te gaan van de verklaring afgegeven door
      of namens Onze Minister van Verkeer en Waterstaat, bedoeld in artikel 194, vierde lid, vierde volzin, dan wel de
      verklaring, bedoeld in artikel 784, vijfde lid, van Boek 8 van het Burgerlijk Wetboek.

      2 Bij het verzoek tot teboekstelling wordt vermeld elk Nederlands en buitenlands register, waar het schip, in
      aanbouw dan wel afgebouwd, reeds teboekstaat of teboekgestaan heeft. Ingeval het schip in geen enkel ander register
      teboekstaat of teboekgestaan heeft, wordt zulks in het verzoek vermeld.

      3 Behoudens het bepaalde in [artikel 18, eerste lid][ref1], en [artikel 19, eerste lid][ref2], wordt, indien het
      schip reeds in een buitenlands register teboekgestaan heeft, bij het in het eerste lid genoemde verzoek overgelegd
      een door de bevoegde autoriteit afgegeven verklaring, waaruit blijkt dat de teboekstelling is doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005260#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005260#Artikel19
