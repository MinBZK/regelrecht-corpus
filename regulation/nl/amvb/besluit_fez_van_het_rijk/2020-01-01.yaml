  - number: '6'
    text: |-
      1 Nadat overleg met de secretaris-generaal van het betrokken ministerie is gevoerd kan de directeur FEZ Onze
      Minister die het aangaat rechtstreeks informeren, indien de taken, bedoeld in [artikel 4][ref1], daartoe aanleiding
      geven.

      2 De dienstonderdelen van het betrokken ministerie verstrekken de directeur FEZ op zijn verzoek de informatie die
      naar zijn oordeel noodzakelijk voor de uitoefening van zijn taken, bedoeld in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041910#Artikel4
