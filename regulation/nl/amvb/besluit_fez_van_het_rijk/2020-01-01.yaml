        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '1'
  - number: '2'
    text: >-
      Onze Minister die belast is met de leiding van een ministerie draagt er zorg voor dat de directie FEZ rechtstreeks
      ressorteert onder de secretaris-generaal van het ministerie, tenzij in overeenstemming met Onze Minister van
      Financiën anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0041910/2020-01-01#Artikel2
  - number: '3'
    text: >-
      1 Het aangaan van de arbeidsovereenkomst met de directeur FEZ van een ministerie geschiedt in overeenstemming met
      Onze Minister van Financiën.


      2 Het beëindigen van de arbeidsovereenkomst met de directeur FEZ van een ministerie geschiedt in overeenstemming
      met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0041910/2020-01-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister die belast is met de leiding van een ministerie draagt aan de directie FEZ met betrekking tot het
      ministerie de taak op tot:

      a. het opstellen van de begroting, de wijzigingen van de begroting en de slotverschillen, bedoeld in de
      [artikelen 2.1, tweede lid][ref1], [2.26][ref2] en [2.30 van de Comptabiliteitswet 2016][ref3];

      b. het opstellen van het jaarverslag, bedoeld in [artikel 2.31 van de Comptabiliteitswet 2016][ref4];

      c. de deelname aan het interdepartementale overleg over financieel-economische aangelegenheden en de relevante
      departementale overleggen met Onze Minister die het aangaat, de secretaris-generaal en directeuren-generaal van het
      betreffende ministerie;

      d. het houden van toezicht op:

      1°. de onderzoeken naar de doeltreffendheid en de doelmatigheid van het beleid en de bedrijfsvoering;

      2°. de voorstellen, voornemens en toezeggingen met financiële gevolgen voor het Rijk die aan de ministerraad of de
      Kamers der Staten-Generaal worden voorgelegd;

      3°. de uitvoering van departementale risicoanalyses;

      4°. de uitvoering van het begrotingsbeheer, het financieel beheer, de materiële bedrijfsvoering en de daartoe
      gevoerde administraties;

      e. de ondersteuning van het departementale audit committee en

      f. het op verzoek en uit eigen beweging in elk geval adviseren over:

      1°. de financiële gevolgen van het beleid en de bedrijfsvoering;

      2°. de onderzoeken, voorstellen, voornemens, toezeggingen en risicoanalyses, bedoeld in het eerste lid, onderdeel
      d, subonderdelen 1 tot en met 3;

      3°. het begrotingsbeheer, het financieel beheer, de materiële bedrijfsvoering en de daartoe gevoerde
      administraties;

      4°. het begrotingsbeheer, het financieel beheer, de materiële bedrijfsvoering en de daartoe gevoerde
      administraties van de zelfstandige bestuursorganen en de rechtspersonen met een wettelijke taak voor
      zover dat betrekking heeft op de financiële middelen die ten laste van de rijksbegroting, bedoeld in
      [artikel 2.1 van de Comptabiliteitswet 2016][ref5], zijn ontvangen.

      2 Onverminderd het eerste lid kan Onze Minister die belast is met de leiding van een ministerie andere taken aan de
      directeur FEZ opdragen.


