  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Financiën van 10 december 2018, nr. 2018-0000183116;


    Gelet op artikel 4.20, vierde lid, aanhef en onderdeel a, van de Comptabiliteitswet 2016;


    De Afdeling advisering van de Raad van State gehoord (advies van 9 januari 2019, no.WO6.18.0382/III);


    Gezien het nader rapport van Onze Minister van Financiën van 28 januari 2019, 2019-0000008884);


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041910/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De begrippen van [artikel 1.1 van de Comptabiliteitswet 2016][ref1] zijn van overeenkomstige toepassing op dit
      besluit.

      2 In dit besluit wordt verstaan onder:

      - *directeur FEZ:* de persoon die belast is met de dagelijkse leiding van de directie Financieel-Economische Zaken;
      - *directie FEZ:* het dienstonderdeel van een ministerie dat belast is met de financieel-economische
      aangelegenheden van het ministerie;
      - *zelfstandig bestuursorgaan:* een bestuursorgaan als bedoeld in
      [artikel 1, onder a, van de Kaderwet zelfstandige bestuursorganen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel1
    url: https://wetten.overheid.nl/BWBR0041910/2020-01-01#Artikel1
    references:
