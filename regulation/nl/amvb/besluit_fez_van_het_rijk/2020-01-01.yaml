    text: |-
      Het toezicht, bedoeld in [artikel 4, eerste lid, onderdeel d][ref1], is gericht op de naleving van:

      de voorschriften, bedoeld in de [artikelen 3.1 tot en met 3.10, van de Comptabiliteitswet 2016][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041910#Artikel4
