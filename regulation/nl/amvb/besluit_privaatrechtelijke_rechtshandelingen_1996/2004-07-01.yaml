  - number: '8'
    text: |-
      Onze Minister van Financiën kan nadere voorschriften geven met betrekking tot het verrichten van privaatrechtelijke
      rechtshandelingen namens de Staat.
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel8
  - number: 8a
    text: |-
      Dit besluit berust op [artikel 39 van de Comptabiliteitswet 2001][ref1] en op de [artikelen 35a, tweede lid][ref2],
      en [104, tweede lid, van de Wet op de rechterlijke organisatie][ref3].


