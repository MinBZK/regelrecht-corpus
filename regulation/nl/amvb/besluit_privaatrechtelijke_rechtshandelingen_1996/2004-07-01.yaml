    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 18 september 1995, nr. B95/186U, Directoraat-Generaal van de
    Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke Zaken;

    Gelet op artikel 34, eerste lid, van de Comptabiliteitswet;

    Gezien het advies van de Algemene Rekenkamer van 12 juni 1995, nr. 625R;

    De Raad van State gehoord (advies van 1 december 1995, no. W06.95.0505);

    Gezien het nader rapport van Onze Minister van Financiën van 20 december 1995, nr. B95/426U, Directoraat-Generaal
    van de Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Een algemene volmacht als bedoeld in [artikel 32, vierde lid, van de Comptabiliteitswet 2001][ref1], alsmede
      bedoeld in [artikel 35a, tweede lid][ref2], en [104a, tweede lid, van de Wet op de rechterlijke organisatie][ref3]
      kan slechts worden verleend aan:

      a. ambtenaren in de zin van de [Ambtenarenwet][ref4];

      b. degenen met wie een arbeidsovereenkomst naar burgerlijk recht is gesloten.

      2 Een bijzondere volmacht als bedoeld in [artikel 32, vierde lid, van de Comptabiliteitswet 2001][ref5], alsmede
      bedoeld in [artikel 35a, tweede lid][ref6], en [104a, tweede lid, van de Wet op de rechterlijke organisatie][ref7]
      kan worden verleend aan:

      a. de personen, bedoeld in het eerste lid;

      b. andere natuurlijke personen, indien daartoe dwingende redenen zijn;

      c. rechtspersonen, indien daarin bij of krachtens de wet is voorzien.

      3 Algemene en bijzondere volmachten worden schriftelijk verleend. In spoedeisende gevallen kan een bijzondere
      volmacht mondeling worden verleend aan een persoon, bedoeld in het eerste lid, onder *a*. Een mondelinge bijzondere
      volmacht wordt zo spoedig mogelijk schriftelijk bevestigd.

      4 Onze ministers, alsmede de hoge colleges van staat en het Kabinet van de Koning, de rechtbanken, de
      gerechtshoven, de Centrale Raad van Beroep, het College van Beroep voor het bedrijfsleven en de Raad voor de
      rechtspraak ieder voor zover het hem aangaat, houden een of meer openbare registers bij, waaruit blijkt aan welke
      personen - in naam of in functie - en aan welke rechtspersonen een volmacht als bedoeld in het eerste of tweede
      lid is verleend. Daarbij worden duidelijk de privaatrechtelijke rechtshandelingen omschreven, waarover die volmacht
      zich uitstrekt.


