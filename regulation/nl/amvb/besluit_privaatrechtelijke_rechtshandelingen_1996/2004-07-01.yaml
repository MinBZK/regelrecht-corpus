  - number: '6'
    text: |-
      Het sluiten van huur-, huurkoop- en lease-overeenkomsten namens de Staat met een waarde gelijk aan of meer dan
      een door Onze Minister van Financiën vast te stellen bedrag dan wel voor een periode van langer dan tien jaar,
      geschiedt door Onze minister wie het aangaat in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel6
  - number: 6a
    text: |-
      1 Wisselkoersrisico's die samenhangen met de financiële verplichtingen die namens de Staat worden aangegaan in een
      andere valuta dan euro, worden niet door middel van valutatermijncontracten afgedekt.

      2 In afwijking van het eerste lid en met inachtneming van door Onze Minister van Financiën te stellen regels,
      kunnen Onze ministers omvangrijke budgettaire risico's afdekken.

      3 Valutatermijncontracten worden gesloten met en uitgevoerd door een door Onze Minister van Financiën aan te wijzen
      bankinstelling.
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel6a
  - number: '7'
    text: |-
      1 De schriftelijke mededeling, bedoeld in [artikel 34, vijfde en zesde lid, van de Comptabiliteitswet 2001][ref1]
      wordt gedaan door Onze minister wie het aangaat in overeenstemming met Onze Minister van Financiën.

      2 Andere deelnemingen en verstrekkingen door de Staat dan bedoeld in
      [artikel 34, vijfde, zesde en zevende lid, van de Comptabiliteitswet 2001][ref2] worden verricht door Onze minister
      wie het aangaat in overeenstemming met Onze Minister van Financiën.

      3 Rechtshandelingen tot het geheel of gedeeltelijk vervreemden door de Staat van in zijn bezit zijnde deelnemingen
      in naamloze vennootschappen of in besloten vennootschappen met beperkte aansprakelijkheid en van in aandelen
      converteerbare leningen verstrekt door de Staat aan dergelijke vennootschappen, geschieden door of met machtiging
      van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel7
