  - number: '2'
    text: |-
      Gehele of gedeeltelijke kwijtschelding van een aan de Staat toekomende privaatrechtelijke vordering geschiedt,
      indien het kwijt te schelden bedrag gelijk is aan of meer bedraagt dan een door Onze Minister van Financiën vast te
      stellen bedrag en het kwijtschelden niet bij of krachtens de wet is geregeld, door Onze daarbij betrokken minister
      in overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel2
  - number: '3'
    text: |-
      1 Schenking aan een derde van een aan de Staat toebehorende niet-geldelijke roerende zaak met een waarde gelijk aan
      of meer dan het in [artikel 2][ref1] bedoelde bedrag, wordt, voor zover deze zaak niet als overtollig kan worden
      aangemerkt, verricht door Onze daarbij betrokken minister in overeenstemming met Onze Minister van Financiën.

      2 Het eerste lid is niet van toepassing:

      a. indien het schenken bij of krachtens [de wet][ref2] is geregeld;

      b. indien de schenking voortvloeit uit een beleid gericht op de aanschaf van zaken met het oog op schenking aan
      derden.


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel3
    references:
