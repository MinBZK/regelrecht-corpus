  - number: '4'
    text: |-
      Een vaststellingsovereenkomst namens de Staat die betrekking heeft op een recht op een geldelijke roerende zaak,
      wordt gesloten door Onze minister wie het aangaat. Indien de vaststellingsovereenkomst betrekking heeft op een
      niet-geldelijke roerende zaak met een waarde gelijk aan of hoger dan het in [artikel 2][ref1] bedoelde bedrag,
      wordt zij gesloten door Onze minister wie het aangaat in overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel2
    url: https://wetten.overheid.nl/BWBR0007804/2004-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007804
        artikel: '2'
  - number: '5'
    text: |-
      Onze betrokken ministers doen aan de Algemene Rekenkamer schriftelijk mededeling van de kwijtscheldingen, de
      schenkingen en de vaststellingsovereenkomsten, bedoeld in de [artikelen 2][ref1], onderscheidenlijk [3][ref2] en
      [4][ref3], tenzij de waarde minder bedraagt dan het in [artikel 2][ref4] bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007804#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007804#Artikel4
