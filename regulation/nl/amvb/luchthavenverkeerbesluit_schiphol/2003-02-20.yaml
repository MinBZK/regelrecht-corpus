  - number: '5.1'
    text: |-
      Bij de toepassing van [artikel 4.3.1, derde lid][ref1], in het eerste gebruiksjaar wordt de in dat lid bedoelde
      hoeveelheid gevonden door deze te bepalen alsof de in de eerste kolom van de tabel bij het eerste lid van dat
      artikel genoemde grenswaarden in het jaar voorafgaande aan het eerste gebruiksjaar van toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel4
