    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.4.c
    text: van deze som de logaritme te nemen en die te vermenigvuldigen met – 10;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.4.d
    text: |-
      de in de [artikelen 4.2.1][ref1] en [4.2.2][ref2] bedoelde grenswaarden te verminderen met dat produkt.


