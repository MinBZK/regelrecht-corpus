    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.3
  - number: 3.1.4
    text: |-
      De exploitant van de luchthaven draagt zorg voor de beschikbaarstelling van het in het luchthavenindelingbesluit
      beschreven banenstelsel voor luchthavenluchtverkeer. De exploitant kan de beschikbaarstelling beperken indien dit
      noodzakelijk is voor het uitvoeren van werkzaamheden aan of in verband met het banenstelsel.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.4
  - number: 3.1.5.1
    text: |-
      De gezagvoerder draagt er zorg voor dat het vliegtuig gebruik maakt van het banenstelsel met inachtneming van het
      vierde tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.1.5.2
    text: De gezagvoerder kan afwijken van het eerste lid op grond van de gegeven luchtverkeersleiding.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.1.5.3
    text: |-
      De LVNL geeft luchtverkeersleiding die ertoe strekt dat het vliegtuig gebruik maakt van het banenstelsel met
      inachtneming van het vierde tot en met zesde lid.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.1.5.4
    text: |-
      Het gebruik van het banenstelsel is gebonden aan de beperkingen die zijn beschreven in de navolgende tabel.
      **Beperkingen banenstelsel**








                    Baan


                    Starts


                    Landingen


                    Verboden in periode






