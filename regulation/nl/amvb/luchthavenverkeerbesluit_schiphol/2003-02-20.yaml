  - number: 4.3.1.2
    text: |-
      Het aantal gecorrigeerde vliegtuigbewegingen is gelijk aan het gesommeerde maximum startgewicht van de
      vliegtuigbewegingen in het gebruiksjaar.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.3.1
  - number: 4.3.1.3
    text: |-
      Indien op grond van het eerste lid voor een stof in enig gebruiksjaar een maximum voor de uitstoot als gevolg
      van alle vliegtuigbewegingen tezamen geldt dat lager is dan de hoeveelheid van die stof die in het voorgaande
      gebruiksjaar als gevolg van alle vliegtuigbewegingen tezamen mocht worden uitgestoten, treedt deze hoeveelheid in
      de plaats van dat maximum.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.3.1
  - number: 4.3.2
    text: |-
      De uitstoot wordt bepaald overeenkomstig de emissieberekeningsmethodiek zoals beschreven in het rapport van het
      TNO-MEP – R2002/326. Het maximum startgewicht wordt bepaald overeenkomstig het in [artikel 4.1.2][ref1] genoemde
      rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel4
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.3.2
