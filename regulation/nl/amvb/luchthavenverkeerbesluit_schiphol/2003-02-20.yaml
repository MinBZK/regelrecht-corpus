        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.2.4
    text: 'De grenswaarden voor de geluidbelasting in het eerste gebruiksjaar worden gevonden door:'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.4.a
    text: |-
