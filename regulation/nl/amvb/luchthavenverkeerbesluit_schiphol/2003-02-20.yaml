preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 juli 2002, kenmerk HDJZ/LUV/2002-1857, gedaan
    mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 8.15 van de Wet luchtvaart;

    De Raad van State gehoord (advies van 12 september 2002, kenmerk W09.02.0303/V en W09.02.0305/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 21 november 2002, kenmerk HDJZ/
    LUV/2002-2735, uitgebracht mede namens de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.a
    text: '*gebruiksjaar*: de periode van een jaar die loopt van 1 november tot en met 31 oktober;'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.b
    text: |-
      *vliegtuig*: het begrip zoals dat is bepaald in [artikel 1, onderdeel ak, van het Luchtverkeersreglement][ref1],
      met uitzondering van draagschroefvliegtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
  - number: 1.1.c
    text: '*straalvliegtuig*: een vliegtuig waarbij de voortstuwing direct door ten minste één straalmotor wordt verzorgd;'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.d
    text: '*vliegtuigbeweging*: de aankomst of het vertrek van een vliegtuig op of van de luchthaven;'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.e
    text: |-
      *taxiën*: het begrip zoals dat is bepaald in [artikel 1, onderdeel af, van het Luchtverkeersreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
  - number: 1.1.f
    text: |-
      *vlieghoogte en vliegniveau*: de begrippen zoals deze zijn bepaald in
      [artikel 1, onderdelen ai en aj, van het Luchtverkeersreglement][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
  - number: 1.1.f.1
    text: een vlieghoogte die is uitgedrukt in voeten altijd bepaald wordt ten opzichte van het gemiddeld zeeniveau;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.f.2
    text: |-
      een vlieghoogte niet van toepassing is in het luchtruim boven de Nederlandse territoriale zee en boven de Noordzee
      buiten de territoriale zee;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
  - number: 1.1.g
    text: |-
      *Schiphol TMA en Schiphol CTR*: de begrippen zoals deze zijn bepaald op grond van de [artikelen 2][ref1] en
      [5 van de Regeling luchtverkeersdienstverlening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009899#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009899#Artikel5
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009899
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009899
        artikel: '5'
  - number: '2.1'
    text: |-
      De luchtverkeerwegen zijn de in [bijlage 1][ref1] bij dit besluit als zodanig afgebakende delen van het luchtruim.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 3.1.1.1
    text: |-
      Bij het vertrek van een straalvliegtuig van de luchthaven draagt de gezagvoerder er zorg voor dat het vliegtuig
      blijft binnen één van de luchtverkeerwegen die voor het desbetreffende tijdvak, voor een vertrek van de
      desbetreffende baan, zijn aangewezen in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 3.1.1.2
    text: |-
      Bij het vertrek van een straalvliegtuig van de luchthaven en na het verlaten van de Schiphol TMA draagt de
      gezagvoerder er zorg voor dat de vlieghoogte van het vliegtuig blijft op of boven vliegniveau 60.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.1
  - number: 3.1.1.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing bij het vertrek van een straalvliegtuig van de luchthaven met als
      bestemming de luchthaven Lelystad, Valkenburg of Rotterdam.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.1
  - number: 3.1.1.4
    text: De gezagvoerder kan afwijken van het eerste lid op grond van de gegeven luchtverkeersleiding.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.1
  - number: 3.1.2.1
    text: |-
      Bij de nadering van een straalvliegtuig van de luchthaven draagt de gezagvoerder er zorg voor dat het vliegtuig
      blijft binnen één van de luchtverkeerwegen voor zover voor het desbetreffende tijdvak, voor een nadering van de
      desbetreffende baan luchtverkeerwegen zijn aangewezen in [bijlage 1][ref1] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.2
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 3.1.2.2
    text: |-
      Het eerste lid is niet van toepassing bij de nadering van de luchthaven van een straalvliegtuig dat afkomstig is
      van de luchthaven Lelystad, Valkenburg of Rotterdam.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.2
  - number: 3.1.2.3
    text: |-
      Bij de nadering van een straalvliegtuig van de luchthaven buiten de in het eerste lid bedoelde gevallen, draagt
      de gezagvoerder er zorg voor dat de vlieghoogte van het vliegtuig blijft op of boven de in de navolgende tabel
      beschreven waarden. **Minimum vlieghoogten**







                    Positie


                    Periode


                    Vlieghoogte






                    Tot grens Schiphol TMA


                    Gehele etmaal


                    Vliegniveau 70




                    Van grens Schiphol TMA tot eindnadering


                    Van 6 tot 23 uur


                    2000 voet




                    Van 23 tot 6 uur


                    3000 voet
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.2
  - number: 3.1.2.4
    text: De gezagvoerder kan afwijken van het eerste en derde lid op grond van de gegeven luchtverkeersleiding.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.2
  - number: 3.1.2.5
    text: |-
      De gezagvoerder kan afwijken van het eerste lid voor zover de technische voorzieningen van het vliegtuig
      onvoldoende zijn om aan dat lid gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.2
  - number: 3.1.3.1
    text: |-
      De LVNL geeft luchtverkeersleiding die ertoe strekt dat het straalvliegtuig blijft binnen een luchtverkeerweg dan
      wel op of boven een hoogte als bedoeld in de [artikelen 3.1.1][ref1] en [3.1.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014330#Artikel3
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0014330
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0014330
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.3.2
    text: |-
      De LVNL kan indien dit naar haar oordeel noodzakelijk is in verband met een veilige en doelmatige afwikkeling van
      het luchthavenluchtverkeer, luchtverkeersleiding geven die leidt tot afwijking van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.3
  - number: 3.1.3.3
    text: |-
      De LVNL draagt er zorg voor dat het aantal afwijkingen als bedoeld in het tweede lid in een gebruiksjaar beneden
      de in de navolgende tabel vermelde percentages blijft. Het aantal afwijkingen wordt bepaald als percentage
      van het aantal vliegtuigbewegingen in het gebruiksjaar dat valt binnen de desbetreffende regel van de tabel.
      **Afwijkingen**









