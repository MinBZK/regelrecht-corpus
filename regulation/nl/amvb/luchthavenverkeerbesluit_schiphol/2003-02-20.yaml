  - number: 5.2.1
    text: |-
      Dit artikel is van toepassing in het geval dat de inwerkingtreding van dit besluit niet samenvalt met het begin van
      een gebruiksjaar.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.2
    text: Als eerste gebruiksjaar geldt het tijdvak vanaf de inwerkingtreding van dit besluit tot 1 november daarop volgend.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.3
    text: 'De grenswaarde voor het externe-veiligheidsrisico in het eerste gebruiksjaar wordt gevonden door:'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.3.a
    text: |-
      voor iedere dag in het eerste gebruiksjaar de waarde te nemen die voortvloeit uit de na dit artikel opgenomen
      tabel;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.3.b
    text: deze waarden bij elkaar op te tellen;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
  - number: 5.2.3.c
    text: |-
      de in [artikel 4.1.1][ref1] genoemde grenswaarde met deze som te vermenigvuldigen.


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel4
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel5.2
