    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.1.5.5
    text: |-
      Van de beperkingen kan afgeweken worden bij landingen op de Zwanenburgbaan, de Aalsmeerbaan, de Buitenveldertbaan
      of de Kaagbaan, voor zover geen van de andere banen beschikbaar of bruikbaar is.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.1.5.6
    text: |-
      Van de beperkingen kan afgeweken worden voor zover dit noodzakelijk is in verband met reddingsacties of
      hulpverlening.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.1.5
  - number: 3.2.1.1
    text: |-
      Na de landing van een driemotorig of een viermotorig straalvliegtuig op de luchthaven draagt de gezagvoerder er
      zorg voor dat het vliegtuig met één uitgeschakelde motor van de landingsbaan naar de afhandelingsplaats taxiet.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.2.1
  - number: 3.2.1.2
    text: |-
      De gezagvoerder kan afwijken van het eerste lid indien naleving van dat lid naar het oordeel van de gezagvoerder
      onveilig is of aan de normale operatie van het vliegtuig in de weg staat.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.2.1
  - number: 3.2.2.1
    text: |-
      Bij de afhandeling van een vliegtuig aan de afhandelingsplaats draagt de gezagvoerder er zorg voor dat de in het
      vliegtuig aanwezige Auxiliary Power Unit niet gebruikt wordt voor de stroomvoorziening voor zover een vervangende
      stroomvoorziening beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.2.2
  - number: 3.2.2.2
    text: |-
      De gezagvoerder kan afwijken van het eerste lid indien naleving van dat lid naar het oordeel van de gezagvoerder
      onveilig is of aan de normale operatie van het vliegtuig in de weg staat.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel3.2.2
  - number: 4.1.1.1
    text: Het totale risicogewicht van het luchthavenluchtverkeer bedraagt per gebruiksjaar niet meer dan 9,724 ton.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.1.1
  - number: 4.1.1.2
    text: 'Het totale risicogewicht is het product van:'
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.1.1
  - number: 4.1.1.2.a
    text: de gemiddelde ongevalskans per vliegtuigbeweging per gebruiksjaar en
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.1.1
  - number: 4.1.1.2.b
    text: het gesommeerde maximum startgewicht van de vliegtuigbewegingen in het gebruiksjaar.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.1.1
  - number: 4.1.2
    text: |-
      De gemiddelde ongevalskans per vliegtuigbeweging per gebruiksjaar en het maximum startgewicht per vliegtuigbeweging
      worden bepaald overeenkomstig het rapport van het Nationaal Lucht- en Ruimtevaartlaboratorium NLR-CR-2001-399.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.1.2
  - number: 4.2.1.1
    text: |-
      De L wordt gebruikt als indicator voor de geluidbelasting gedurende het gehele etmaal ten gevolge van het
      luchthavenluchtverkeer. De geluidbelasting wordt berekend over een gebruiksjaar.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
  - number: 4.2.1.2
    text: Het totale volume van de geluidbelasting bedraagt niet meer dan 63,71 dB(A).
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      De geluidbelasting in een punt dat is aangewezen in [bijlage 2][ref1] bij dit besluit bedraagt niet meer dan de bij
      dat punt aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 4.2.1.4
    text: |-
      Indien in een gebruiksjaar de geluidbelasting in een punt meer bedraagt dan de in het derde lid bedoelde waarde,
      wordt een nieuwe waarde berekend op basis van de meteorologische omstandigheden zoals die zich in het gebruiksjaar
      hebben voorgedaan. In dat geval treedt voor dat gebruiksjaar voor de in het derde lid bedoelde waarde in de plaats
      de laagste van de volgende waarden:
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
  - number: 4.2.1.4.a
    text: de berekende nieuwe waarde;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
  - number: 4.2.1.4.b
    text: |-
      de waarde die bij het punt in [bijlage 2][ref1] bij dit besluit tussen haken is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 4.2.2.1
    text: |-
      De L wordt gebruikt als indicator voor de geluidbelasting gedurende de periode van 23 uur tot 7 uur ten gevolge van
      het luchthavenluchtverkeer. De geluidbelasting wordt berekend over een gebruiksjaar.
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
  - number: 4.2.2.2
    text: Het totale volume van de geluidbelasting bedraagt niet meer dan 54,44 dB(A).
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      De geluidbelasting in een punt dat is aangewezen in [bijlage 3][ref1] bij dit besluit bedraagt niet meer dan de bij
      dat punt aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 4.2.2.4
    text: |-
      Indien in een gebruiksjaar de geluidbelasting in een punt meer bedraagt dan de in het derde lid bedoelde waarde,
      wordt een nieuwe waarde berekend op basis van de meteorologische omstandigheden zoals die zich in het gebruiksjaar
      hebben voorgedaan. In dat geval treedt voor dat gebruiksjaar voor de in het derde lid bedoelde waarde in de plaats
      de laagste van de volgende waarden:
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
  - number: 4.2.2.4.a
    text: de berekende nieuwe waarde;
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
  - number: 4.2.2.4.b
    text: |-
      de waarde die bij het punt in [bijlage 3][ref1] bij dit besluit tussen haken is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: 4.2.3.1
    text: |-
      De geluidbelasting uitgedrukt in L of L, wordt bepaald overeenkomstig de definitie van deze begrippen in bijlage
      I van [Richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van 25 juni 2002 inzake de
      evaluatie en de beheersing van omgevingslawaai (Pb L 189 van 18 juli 2002).
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.3
  - number: 4.2.3.2
    text: |-
      De in de [artikelen 4.2.1][ref1] en [4.2.2][ref2] bedoelde geluidbelastingen worden bepaald overeenkomstig het
      rapport van het Nationaal Lucht- en Ruimtevaartlaboratorium NLR-CR-2001-372.


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014330#Artikel4
    url: https://wetten.overheid.nl/BWBR0014330/2003-02-20#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0014330
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
