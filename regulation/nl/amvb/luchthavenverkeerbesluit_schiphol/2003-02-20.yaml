  - number: 4.2.3.3
    text: |-
      De in de [artikelen 4.2.1, vierde lid][ref1], en [4.2.2, vierde lid][ref2], bedoelde nieuwe waarden worden berekend
      overeenkomstig het rapport van het Nationaal Lucht- en Ruimtevaartlaboratorium NLR-CR-2001-371, met dien verstande
      dat een herberekening plaatsvindt overeenkomstig hoofdstuk 9 van het rapport, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014330#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014330#Artikel4
