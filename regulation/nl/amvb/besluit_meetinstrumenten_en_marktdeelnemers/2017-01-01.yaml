  - number: '18'
    text: |-
      1 De conformiteit van een in de handel te brengen of in gebruik te nemen meetinstrument als bedoeld in
      [artikel 5][ref1] of [artikel 7, eerste lid][ref2], of van een niet-automatisch weegwerktuig als bedoeld
      in [artikel 6][ref3] met de bij of krachtens [de wet][ref4] gestelde eisen blijkt uit de CE-markering en de
      aanvullende metrologische markering, zoals beschreven in artikel 21, tweede lid, van de richtlijn meetinstrumenten
      onderscheidenlijk artikel 16, tweede lid, van de richtlijn niet-automatische weegwerktuigen.

      2 De in het eerste lid bedoelde markeringen alsmede andere opschriften worden aangebracht overeenkomstig de
      toepasselijke conformiteitsbeoordelingsprocedure en de artikelen 21 en 22 van de richtlijn meetinstrumenten,
      onderscheidenlijk de artikelen 16 en 17 van de richtlijn niet-automatische weegwerktuigen.

      3 Indien [artikel 6, tweede lid][ref5], van toepassing is, moet op elk van die inrichtingen die niet aan
      een conformiteitsbeoordeling als bedoeld in [artikel 12, derde lid][ref6], is onderworpen het beperkend
      gebruikssymbool, als omschreven in bijlage III, punt 3, van de richtlijn niet-automatische weegwerktuigen,
      duidelijk zichtbaar en onuitwisbaar zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel5
