  - number: '14'
    text: |-
      1 Voor een geregeld meetinstrument als bedoeld in [artikel 5][ref1], [artikel 6][ref2] of [artikel 8][ref3] dat in
      gebruik is genomen, bestaat de conformiteitsbeoordeling uit een keuring.

      2 De keuring wordt verricht door een voor het betrokken meetinstrument aangewezen instantie of door
      een persoon die beschikt over een voor het betrokken meetinstrument verleende erkenning als bedoeld in
      [artikel 11 van de wet][ref4].

      3 Bij ministeriële regeling kunnen nadere regels ten aanzien van de keuring worden gesteld.


