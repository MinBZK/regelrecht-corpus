      1 De fabrikant van een meetinstrument als bedoeld in [artikel 5][ref1] of [artikel 7, eerste lid][ref2], mag
      elke technische oplossing kiezen die voldoet aan de in bijlage I van de richtlijn meetinstrumenten en in de
      instrumentspecifieke bijlage opgenomen essentiële eisen.

      2 De fabrikant hoeft de conformiteit van het instrument met de in het eerste lid bedoelde eisen niet aan te
      tonen wanneer hij op juiste wijze de oplossingen toepast die in de in [artikel 9, eerste lid][ref3], bedoelde
      geharmoniseerde normen of normatieve documenten zijn weergegeven.


