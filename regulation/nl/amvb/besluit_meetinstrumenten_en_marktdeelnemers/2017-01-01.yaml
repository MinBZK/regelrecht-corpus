  - number: '26'
    text: |-
      De fabrikant van een tapmaatfles verricht de werkzaamheden en voldoet aan de verplichtingen die in de richtlijn
      inzake tapmaatflessen aan hem zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel26
  - number: '27'
    text: |-
      1 De fabrikant van een meetinstrument als bedoeld in de [artikelen 5][ref1] of [7, eerste lid][ref2], of van een
      niet-automatisch weegwerktuig kan schriftelijk een gemachtigde aanwijzen die namens hem optreedt ten aanzien van
      bepaalde verplichtingen en werkzaamheden. De aanwijzing omvat niet de verplichtingen op grond van artikel 8, eerste
      lid, van de richtlijn meetinstrumenten en artikel 6, eerste lid, van de richtlijn niet-automatische weegwerktuigen
      en evenmin de in artikel 8, tweede lid, van de richtlijn meetinstrumenten en artikel 6, tweede lid, van de
      richtlijn niet-automatische weegwerktuigen vervatte verplichting om technische documentatie op te stellen.

      2 Een gemachtigde als bedoeld in het eerste lid voert de taken uit die zijn opgenomen in de aanwijzing. De
      aanwijzing omvat ten minste de volgende taken:

      a. het ter beschikking van Onze Minister en andere betrokken toezichthoudende instanties houden van de EU-
      conformiteitsverklaring en de technische documentatie gedurende tien jaar nadat het meetinstrument in de handel
      is gebracht;

      b. het op met redenen omkleed verzoek van Onze Minister verstrekken van alle benodigde informatie en documentatie
      om de conformiteit van het meetinstrument aan te tonen;

      c. het op verzoek van Onze Minister verlenen van medewerking aan eventueel genomen maatregelen ter uitschakeling
      van de risico’s van de meetinstrumenten waarvoor hij als gemachtigde is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel7
