  - number: '3'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het:

      a. bij het drijven van handel,

      b. bij het berekenen van een recht, heffing, belasting, premie, boete, vergoeding of soortgelijke verschuldigde
      bedragen,

      c. bij de toepassing van wettelijke regelingen of andere besluiten van bestuursorganen of voor gerechtelijke
      expertise,

      d. bij het bepalen van de prijs op grond van de massa voor rechtstreekse verkoop aan het publiek en voor
      voorverpakte artikelen,

      e. bij het bepalen van de massa in de medische praktijk voor het wegen van patiënten voor observatie, diagnose en
      medische behandelingen,

      f. bij het bepalen van de massa voor de vervaardiging van medicijnen op voorschrift in de apotheek en het bepalen
      van de massa tijdens analyses die in medische en farmaceutische laboratoria worden uitgevoerd,

      bepalen van de massa van een lichaam met gebruikmaking van de werking van de zwaartekracht op dat lichaam, waarbij
      voor het wegen tussenkomst van een bedienaar noodzakelijk is, al dan niet vergezeld gaand van het bepalen van met
      de massa verband houdende grootheden, hoeveelheden, parameters of kenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
