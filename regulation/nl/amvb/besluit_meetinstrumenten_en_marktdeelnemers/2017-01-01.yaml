  - number: '32'
    text: |-
      Een wijziging van de richtlijn meetinstrumenten, van de richtlijn niet-automatische weegwerktuigen, van de
      richtlijn meetmiddelen en controlemethoden of van de richtlijn inzake tapmaatflessen gaat voor de toepassing van
      dit besluit gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel32
  - number: '33'
    text: |-
      1 Een meetinstrument als bedoeld in [artikel 5][ref1] of [artikel 7, eerste lid][ref2], of een niet- automatisch
      weegwerktuig dat voldoet aan de toepasselijke eisen uit het [Meetinstrumentenbesluit I][ref3] en dat vóór 20 april
      2016 in de handel is gebracht, mag op de markt worden aangeboden of in gebruik worden genomen.

      2 Een certificaat voor een meetinstrument als bedoeld in [artikel 5][ref4] of [artikel 7, eerste lid][ref5],
      of voor een niet-automatisch weegwerktuig, dat vóór 20 april 2016 is verstrekt op grond van het
      [Meetinstrumentenbesluit I][ref6] wordt beschouwd als een certificaat dat is verstrekt op grond van dit besluit.


