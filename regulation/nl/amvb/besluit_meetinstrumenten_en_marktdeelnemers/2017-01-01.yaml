    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 29 januari 2016, nr. WJZ / 16006109;

    Gelet op richtlijn 2014/31/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende de
    harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden van niet-automatische
    weegwerktuigen (PbEU L 96), richtlijn 2014/32/EU van het Europees Parlement en de Raad van 26 februari
    2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden van
    meetinstrumenten (PbEU L 96), richtlijn 2009/34/EG van het Europees Parlement en de Europese Unie van 23 april 2009
    betreffende voor meetmiddelen en metrologische controlemethoden geldende algemene bepalingen, richtlijn 75/107/
    EEG van de Raad van de Europese Gemeenschappen van 19 december 1974 betreffende de onderlinge aanpassing van de
    wetgeving der Lid-Staten inzake flessen gebruikt als tapmaat (PbEG L 96) en de artikelen 5, 9, 26 en 36 van de
    Metrologiewet, artikel 3, eerste lid, van de Wet op de medische hulpmiddelen, en artikel 66, eerste lid, van de
    Geneesmiddelenwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 9 maart 2016, nr. W15.16.0021/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 11 april 2016, nr. WJZ / 16042206;

    Hebben goedgevonden en verstaan:
