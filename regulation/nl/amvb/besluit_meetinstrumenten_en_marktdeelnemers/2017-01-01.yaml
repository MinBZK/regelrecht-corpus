    text: |-
      1 Voor het uitvoeren van een controle als bedoeld in [artikel 15][ref1] wordt Onze Minister aangemerkt als bevoegde
      dienst.

      2 Onze Minister draagt met inachtneming van de toepasselijke bepalingen uit de richtlijn meetmiddelen en
      metrologische controlemiddelen en de richtlijn inzake tapmaatflessen zorg voor de werkzaamheden die voortvloeien
      uit zijn taak bij de controle.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel15
