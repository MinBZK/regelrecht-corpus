  - number: '20'
    text: |-
      De conformiteit van een in de handel te brengen of in gebruik te nemen tapmaatfles met de bij of krachtens
      [de wet][ref1] gestelde eisen blijkt uit het in [artikel 7, tweede lid][ref2], bedoelde E.E.G-teken. Het teken
      wordt door de fabrikant aangebracht overeenkomstig de voorschriften van de richtlijn meetmiddelen en metrologische
      meetmethoden en de richtlijn inzake tapmaatflessen.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
