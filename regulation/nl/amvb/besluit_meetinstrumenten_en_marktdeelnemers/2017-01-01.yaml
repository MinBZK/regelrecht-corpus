  - number: '2'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het bij het drijven van handel, bij levering uit hoofde van beroep of bedrijf en bij het vaststellen van
      belastingen of van andere heffingen:

      a. meten van een stromende hoeveelheid gasvormige brandstof, al dan niet onder herleiding van de onder
      meetomstandigheden gemeten hoeveelheid naar een hoeveelheid onder basisomstandigheden, voor huishoudelijk gebruik,
      handelsgebruik of licht industrieel gebruik;

      b. meten van binnen een stroomkring verbruikte actieve elektrische energie voor huishoudelijk gebruik,
      handelsgebruik of licht industrieel gebruik;

      c. meten van thermische energie die door een vloeistof in een thermische-energiemeter wordt afgegeven, voor
      huishoudelijk gebruik, handelsgebruik of licht industrieel gebruik;

      d. continu en dynamisch meten in volume of massa van stromende vloeistoffen met uitzondering van water, al
      dan niet onder herleiding van de onder meetomstandigheden gemeten hoeveelheid naar een hoeveelheid onder
      basisomstandigheden, binnen een gesloten leiding, ten behoeve van

      1°. het vaststellen van een hoeveelheid brandstof, al dan niet in de vorm van een vloeibaar gas, bij het tanken van
      motorvoertuigen, kleine schepen en kleine vliegtuigen;

      2°. het vaststellen van een hoeveelheid cryogene vloeistoffen;

      3°. het vaststellen van een hoeveelheid vloeistoffen bij het laden van schepen; of

      4°. het in andere gevallen vaststellen van een hoeveelheid vloeistoffen;

      e. bepalen van de massa van een lichaam op grond van de werking van de zwaartekracht op dat lichaam, zonder
      tussenkomst van een bedienaar en volgens een vooraf bepaald programma van automatische processen, en in het
      bijzonder

      1°. het bepalen van de massa van vooraf samengevoegde afzonderlijke lasten of enkelvoudige lasten los materiaal, al
      dan niet met onderverdeling van artikelen met een verschillende massa of ter controle van voorverpakkingen;

      2°. het bepalen van de massa bij het vullen van houders met een vooraf bepaalde en vrijwel constante hoeveelheid
      bulkgoed;

      3°. het bepalen van de massa van bulkgoed door het in afzonderlijke lasten te verdelen, vervolgens de massa van de
      afzonderlijke last te bepalen en tenslotte de massa van de afzonderlijke lasten bij elkaar op te tellen;

      4°. het ononderbroken bepalen van de massa van bulkgoed op een continue bewegende transportband;

      5°. het bepalen van de massa van treinen en spoorwegwagons;

      f. op basis van een door een afstandssignaalgenerator afgegeven signaal berekenen van afstand en het meten van
      tijdsduur in verband met het vaststellen van vergoedingen voor taxivervoer;

      g. bepalen van de lengte van de randen van het kleinste omhullende rechthoekige parallellepipedum van een product.


