  - number: '34'
    text: |-
      De verklaring van toelating die voor de inwerkingtreding van dit besluit is afgegeven voor een
      conformiteitsbeoordeling als bedoeld in [artikel 13][ref1] is geldig tot tien jaar na de dag van inwerkingtreding
      van dit besluit.


