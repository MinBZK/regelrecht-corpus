  - number: '15'
    text: |-
      Tapmaatflessen worden gecontroleerd op conformiteit met de eisen uit de richtlijn inzake tapmaatflessen door middel
      van steekproeven overeenkomstig de toepasselijke voorschriften van de richtlijn inzake tapmaatflessen.
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel15
  - number: '16'
    text: |-
      1 De aangewezen instantie die toetsende werkzaamheden verricht in het kader van een conformiteitsbeoordeling
      als bedoeld in [artikel 12, eerste of derde lid][ref1], draagt daarbij zorg voor de uitvoering van haar met die
      toetsende werkzaamheden samenhangende verplichtingen die in de conformiteitsbeoordelingsprocedure zijn voorzien.

      2 De aangewezen instantie die de toetsende werkzaamheden verricht in het kader van een conformiteitsbeoordeling
      als bedoeld in [artikel 13, eerste lid][ref2], draagt daarbij zorg voor de uitvoering van de verplichtingen die
      in een conformiteitsbeoordelingsprocedure als bedoeld in artikel 13, eerste lid, en in de bijlage bij dit besluit
      opgenomen voorschriften aan haar zijn opgedragen.

      3 Voor zover een conformiteitsbeoordelingsprocedure voorziet in de verplichting tot het verstrekken van gegevens
      aan de lidstaat door wie de aangewezen instantie is aangewezen, dan wel aan andere lidstaten, geldt dat in
      Nederland de gegevens worden verstrekt aan Onze Minister.

      4 Voor zover een conformiteitsbeoordelingsprocedure voorziet in het verstrekken van gegevens aan de lidstaten
      van de Europese Unie of de Europese Commissie, geldt dat deze verstrekking geschiedt door tussenkomst van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel13
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel16
