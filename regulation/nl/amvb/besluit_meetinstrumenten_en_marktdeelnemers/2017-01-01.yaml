    text: |-
      1 Een niet-automatisch weegwerktuig met een meettaak ten behoeve van een specifieke toepassing als bedoeld in
      [artikel 3][ref1] voldoet voordat het in de handel wordt gebracht, in gebruik wordt genomen, voor ingebruikneming
      op de markt wordt aangeboden of wordt gebruikt aan de essentiële eisen van bijlage I van de richtlijn niet-
      automatische weegwerktuigen.

      2 Indien het niet-automatische weegwerktuig inrichtingen bevat of is aangesloten op inrichtingen die niet voor de
      meettaak in een specifiek toepassingsgebied als bedoeld in [artikel 3][ref2] bestemd zijn, gelden de in het eerste
      lid bedoelde eisen niet voor die inrichtingen.


