  - number: '40'
    text: |-
      Dit besluit treedt in werking met ingang van 20 april 2016, met uitzondering van:

      a. de [artikelen 7, tweede en derde lid][ref1], [15][ref2], [17][ref3], [20][ref4], [36, onderdeel A][ref5], en
      [37][ref6], die in werking treden met ingang van de dag na de datum van uitgifte van het Staatsblad waarin dit
      besluit wordt geplaatst;

      b. de [artikelen 4][ref7], [8][ref8], [13][ref9], [21][ref10], [25][ref11] en [39][ref12] en de bijlage, bedoeld
      in [artikel 13][ref13], die inwerking treden op een bij koninklijk besluit te bepalen tijdstip;

      c. [artikel 36, onderdeel B][ref14], dat in werking treedt met ingang van het tijdstip waarop de
      [IJkwet BES 2014][ref15] in werking treedt.


