  - number: '22'
    text: |-
      1 De conformiteit van een in gebruik genomen geregeld meetinstrument dat ingevolge [artikel 7 van de wet][ref1] een
      keuring heeft ondergaan, blijkt uit een merkteken waarvan het model bij ministeriële regeling wordt vastgesteld.
      Bij ministeriële regeling kunnen tevens regels worden gesteld omtrent de plaats en de wijze van aanbrengen van
      het merkteken.

      2 Het in het eerste lid bedoelde merkteken wordt aangebracht door een voor het betrokken meetinstrument aangewezen
      instantie of een persoon die beschikt over een voor dat specifieke meetinstrument verleende erkenning als bedoeld
      in [artikel 11 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel11
