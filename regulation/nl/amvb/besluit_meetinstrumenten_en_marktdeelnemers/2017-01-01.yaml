  - number: '9'
    text: |-
      1 Een meetinstrument als bedoeld in [artikel 5][ref1] of [artikel 7, eerste lid][ref2], dat voldoet aan:

      a. de geharmoniseerde normen of delen daarvan waarvan de referentienummers in het Publicatieblad van de Europese
      Unie zijn bekendgemaakt, of

      b. delen van normatieve documenten waarvan de lijst in Publicatieblad van de Europese Unie is bekendgemaakt,

      wordt geacht overeen te stemmen met de in bijlage I van de richtlijn meetinstrumenten en in de toepasselijke
      instrumentspecifieke bijlage opgenomen essentiële eisen die door de onder a bedoelde normen of delen daarvan,
      onderscheidenlijk door de onder b bedoelde delen van normatieve documenten, worden bestreken.

      2 Een niet-automatisch weegwerktuig als bedoeld in [artikel 6][ref3] dat voldoet aan de geharmoniseerde normen
      of delen daarvan waarvan de referentienummers in het Publicatieblad van de Europese Unie zijn bekendgemaakt,
      wordt geacht overeen te stemmen met de in bijlage I van de richtlijn niet-automatische weegwerktuigen opgenomen
      essentiële eisen die door die normen of delen daarvan worden bestreken.


