articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *conformiteitsbeoordelingsprocedure:* module A, A2, B, C, C2, D, D1, E, E1, F, F1, G, H of H1 van bijlage II bij
      de richtlijn meetinstrumenten of module B, D, D1, F, F1, of G bij de richtlijn niet-automatische weegwerktuigen;
        - *CE-markering:* markering, overeenkomstig het model van bijlage II bij verordening (EG) nr. 765/2008 van het
      Europees Parlement en de Raad van 9 juli 2008 tot vaststelling van de eisen inzake accreditatie en markttoezicht
      betreffende het verhandelen van producten en tot intrekking van Verordening (EEG) nr. 339/93 (PbEU L 218);
        - *instrumentspecifieke bijlage:* bijlage III, IV, V, VI, VII, VIII, IX, X, XI of XII bij de richtlijn
      meetinstrumenten;
        - *niet-automatisch weegwerktuig:* werktuig voor het bepalen van de massa van een lichaam met gebruikmaking van
      de werking van de zwaartekracht op dat lichaam, waarbij voor het wegen tussenkomst van een bedienaar noodzakelijk
      is, alsmede zodanige werktuigen die bovendien worden gebruikt voor het bepalen van met de massa verband houdende
      grootheden, hoeveelheden, parameters of kenmerken;
        - *richtlijn inzake tapmaatflessen:* [richtlijn 75/107/EEG](onbekend) van de Raad van de Europese Gemeenschappen
      van 19 december 1974 betreffende de onderlinge aanpassing van de wetgeving der Lid-Staten inzake flessen, gebruikt
      als tapmaten (PbEG L 42);
        - *richtlijn meetinstrumenten:* [richtlijn 2014/32](onbekend)/EU van het Europees Parlement en de Raad van 26
      februari 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden van
      meetinstrumenten (PbEU L 96);
        - *richtlijn meetmiddelen en metrologische controlemethoden:* [richtlijn 2009/34/EG](onbekend) van het Europees
      Parlement en de Raad van 23 april 2009 betreffende voor meetmiddelen en metrologische controlemethoden geldende
      algemene bepalingen (PbEU L 106);
        - *richtlijn niet-automatische weegwerktuigen:* [richtlijn 2014/31](onbekend)/EU van het Europees Parlement en de
      Raad van 26 februari 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt
      aanbieden van niet-automatische weegwerktuigen (PbEU L 96);
        - *tapmaatfles:* een tapmaatfles als bedoeld in artikel 1 van de richtlijn inzake tapmaatflessen;
        - *wet:* [Metrologiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517
