      1 Een meetinstrument als bedoeld in [artikel 8][ref1] ondergaat naar keuze van de fabrikant een
      conformiteitsbeoordeling overeenkomstig de conformiteitsbeoordelingsprocedure B+D, B+E, B+F of
      conformiteitsbeoordelingsprocedure G van de richtlijn meetinstrumenten en de voorschriften die voor de toepassing
      van die conformiteitsbeoordelingsprocedures in de bijlage bij dit besluit zijn opgenomen.

      2 De bescheiden en briefwisseling met betrekking tot de in het eerste lid bedoelde conformiteitsbeoordeling zijn
      gesteld in de Nederlandse taal of in een andere taal die door de bij de procedure betrokken aangewezen instantie
      is aanvaard.


