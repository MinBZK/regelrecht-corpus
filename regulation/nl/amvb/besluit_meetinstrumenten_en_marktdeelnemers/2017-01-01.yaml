        artikel: '11'
  - number: '23'
    text: |-
      De bevoegde nationale autoriteit in de artikelen 8, achtste en negende lid, 9, tweede lid, onder b en c, 10,
      zevende en negende lid, 11, vierde en vijfde lid, van de richtlijn meetinstrumenten en de artikelen 6, achtste
      en negende lid, 7, tweede lid, onder b en c, 8, zevende en negende lid, 9, vierde en vijfde lid, van de richtlijn
      niet-automatische weegwerktuigen is Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel23
  - number: '24'
    text: |-
      1 De fabrikant van een meetinstrument als bedoeld in [artikel 5][ref1] of [artikel 7, eerste lid][ref2], voldoet
      aan de verplichtingen, bedoeld in de artikelen 8, 18 en 19 van de richtlijn meetinstrumenten.

      2 De fabrikant van een niet-automatisch weegwerktuig voldoet aan de verplichtingen bedoeld in de artikelen 6 en 14
      en bijlage II van de richtlijn niet-automatische weegwerktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel5
