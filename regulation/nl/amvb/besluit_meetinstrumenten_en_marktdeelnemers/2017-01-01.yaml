    text: |-
      De fabrikant van een meetinstrument als bedoeld in [artikel 8][ref1] verricht de werkzaamheden en voldoet aan
      de verplichtingen die in verband met de conformiteitsbeoordeling volgens de in [artikel 13][ref2] bedoelde
      conformiteitsbeoordelingsprocedure en de in de bijlage bij dit besluit opgenomen voorschriften aan hem zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel13
