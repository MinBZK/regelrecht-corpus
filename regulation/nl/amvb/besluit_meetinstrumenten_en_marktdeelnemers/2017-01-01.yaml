  - number: '5'
    text: |-
      Meetinstrumenten en onderdelen als bedoeld in de onderdelen a tot en met g voldoen voordat zij in de handel worden
      gebracht, in gebruik worden genomen of voor ingebruikneming op de markt worden aangeboden, aan de in bijlage I van
      de richtlijn meetinstrumenten opgenomen essentiële eisen en aan de toepasselijke essentiële eisen in de hierna bij
      het meetinstrument vermelde instrumentspecifieke bijlage:

      a. gasmeters en volumeherleidingsinstrumenten met een in [artikel 2, onderdeel a][ref1], bedoelde taak: bijlage IV;

      b. kilowattuurmeters met een in [artikel 2, onderdeel b][ref2], bedoelde taak: bijlage V;

      c. thermische-energiemeters met een in [artikel 2, onderdeel c][ref3], bedoelde taak: bijlage VI;

      d. vloeistofmeetinstallaties met een in [artikel 2, onderdeel d][ref4], bedoelde taak: bijlage VII;

      e. automatische weeginstrumenten met een in [artikel 2, onderdeel e][ref5], bedoelde taak: bijlage VIII;

      f. taxameters met een in [artikel 2, onderdeel f][ref6], bedoelde taak: bijlage IX;

      g. multidimensionale meetinstrumenten met een in [artikel 2, onderdeel g][ref7], bedoelde taak: bijlage XI,
      hoofdstukken I en IV.


