      De importeur of distributeur van een meetinstrument als bedoeld in de [artikelen 5][ref1] of [7, eerste lid][ref2],
      of van een niet-automatisch weegwerktuig wordt als fabrikant in de zin van de richtlijn meetinstrumenten
      of de richtlijn niet-automatische weegwerktuigen beschouwd en voldoet aan de in [artikel 24][ref3] genoemde
      verplichtingen van de fabrikant, wanneer hij een meetinstrument of niet-automatisch weegwerktuig onder zijn eigen
      naam of merknaam in de handel brengt of een reeds in de handel gebracht meetinstrument zodanig wijzigt dat de
      conformiteit met de desbetreffende richtlijnen in het gedrang kan komen.


