  - number: '19'
    text: |-
      1 Een niet-automatisch weegwerktuig dat niet bestemd is voor een specifieke toepassing als bedoeld in
      [artikel 3][ref1] wordt voorzien van de in bijlage III, punt 2, van de richtlijn niet-automatische weegwerktuigen
      bedoelde opschriften.

      2 De in het eerste lid bedoelde opschriften worden duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar
      aangebracht.

      3 Het is marktdeelnemers verboden niet-automatische weegwerktuigen als bedoeld in het eerste lid in de handel te
      brengen indien zij niet voldoen aan de in het eerste lid bedoelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel3
