  - number: '7'
    text: |-
      1 Meetinstrumenten als bedoeld in de onderdelen a tot en met f en in voorkomend geval nader geduid in de hierna
      bij het meetinstrument vermelde instrumentspecifieke bijlage, voldoen ten behoeve van verkrijging van een CE-
      markering en de aanvullende metrologische markering aan de in bijlage I van de richtlijn meetinstrumenten opgenomen
      essentiële eisen en aan de toepasselijke essentiële eisen in de desbetreffende instrumentspecifieke bijlage:

      a. watermeters bestemd voor huishoudelijk, handels- en licht industrieel gebruik: bijlage III;

      b. lengtematen: bijlage X, hoofdstuk I;

      c. inhoudsmaten: bijlage X, hoofdstuk II;

      d. lengtemeetinstrumenten: bijlage XI, hoofdstukken I en II;

      e. oppervlaktemeetinstrumenten: bijlage XI, hoofdstukken I en III;

      f. uitlaatgasanalysatoren bestemd voor inspectie en professioneel onderhoud van in gebruik zijnde motorvoertuigen:
      bijlage XII.

      2 Een tapmaatfles voldoet ten behoeve van het aanbrengen van een E.E.G.-teken als bedoeld in bijlage I, punt 5, van
      de richtlijn inzake tapmaatflessen aan de bij die richtlijn gestelde toepasselijke eisen.

      3 Het is de marktdeelnemer verboden een meetinstrument als bedoeld in het eerste lid, voorzien van een CE-
      markering en de aanvullende metrologische markering, of een tapmaatfles, voorzien van een E.E.G-teken als bedoeld
      in het tweede lid, in de handel te brengen of op de markt aan te bieden, indien deze niet aan de in het eerste
      onderscheidenlijk tweede lid bedoelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel7
