  - number: '4'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het bij het drijven van handel, bij levering uit hoofde van beroep of bedrijf en bij het vaststellen van
      belastingen of van andere heffingen:

      a. meten van een hoeveelheid vloeistof in een meetreservoir, anders dan een scheepstank;

      b. meten van een hoeveelheid gecomprimeerd gas bij het tanken van motorvoertuigen en kleine vaartuigen;

      c. bepalen van de massa van een bewegend motorvoertuig op grond van de werking van de zwaartekracht op dat
      motorvoertuig, zonder tussenkomst van een bedienaar en volgens een vooraf bepaald programma van automatische
      processen;

      d. discontinu meten van een hoeveelheid uit een mengsel van benzine en olie bestaande brandstof, ten behoeve van
      het tanken van voertuigen met een tweetaktmotor.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
