  - number: '31'
    text: |-
      Een bij een meetinstrument als bedoeld in de [artikelen 5][ref1], [6][ref2] of [7, eerste lid][ref3], betrokken
      marktdeelnemer verstrekt tot tien jaar nadat het meetinstrument aan hem geleverd is en tot tien jaar nadat hij het
      werktuig heeft geleverd de informatie, bedoeld in artikel 13 van de richtlijn meetinstrumenten en artikel 11 van de
      richtlijn niet-automatische weegwerktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel6
