    text: |-
      Meetinstrumenten als bedoeld in de onderdelen a tot en met f voldoen voordat zij in de handel worden gebracht, in
      gebruik worden genomen of voor ingebruikneming op de markt worden aangeboden, aan de bij ministeriële regeling voor
      het instrument gestelde eisen:

      a. statische vloeistofhoeveelheidsmeters met een in [artikel 4, onderdeel a][ref1], bedoelde taak;

      b. vloeistofhoogtemeters, bestaande uit een meetwaarde opnemer en ten minste één aanwijsinrichting, met een in
      [artikel 4, onderdeel a][ref2], bedoelde taak;

      c. massameters met een in [artikel 4, onderdeel a][ref3], bedoelde taak;

      d. CG-dispensers met een in [artikel 4, onderdeel b][ref4], bedoelde taak;

      e. dynamische weegbruggen met een in [artikel 4, onderdeel c][ref5], bedoelde taak;

      f. discontinue brandstofmeters met een in [artikel 4, onderdeel d][ref6], bedoelde taak.


