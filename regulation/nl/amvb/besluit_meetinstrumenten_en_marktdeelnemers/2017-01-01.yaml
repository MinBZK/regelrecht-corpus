  - number: '12'
    text: |-
      1 Een meetinstrument als bedoeld in [artikel 5][ref1] of [artikel 7, eerste lid][ref2], ondergaat, naar
      keuze van de fabrikant, één van de in de instrumentspecifieke bijlage voor dat instrument aangegeven
      conformiteitsbeoordelingsprocedures van de richtlijn meetinstrumenten.

      2 Indien de conformiteitsbeoordelingsprocedure van een meetinstrument als bedoeld in het eerste lid voorziet in een
      test, wordt vermoed dat voldaan is aan die test wanneer het met die test overeenkomende testprogramma is uitgevoerd
      overeenkomstig de in [artikel 9, eerste lid][ref3], bedoelde geharmoniseerde normen of normatieve documenten
      en de testresultaten garanderen dat aan de essentiële eisen die zijn opgenomen in bijlage I van de richtlijn
      meetinstrumenten en in de toepasselijke instrumentspecifieke bijlage, is voldaan.

      3 Een niet-automatisch weegwerktuig als bedoeld in [artikel 6][ref4] ondergaat naar keuze van de fabrikant een
      conformiteitsbeoordeling volgens één van de in artikel 13, eerste lid, onder a en b, van de richtlijn niet-
      automatische weegwerktuigen bedoelde procedures.

      4 De bescheiden en briefwisseling met betrekking tot de in het eerste lid en derde lid bedoelde procedures zijn
      gesteld in één van de officiële talen van de lidstaat waarin de bij de procedure betrokken aangewezen instantie is
      gevestigd of in een andere taal die door die instantie is aanvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037835#Artikel7
