  - number: '21'
    text: |-
      1 De conformiteit van een in de handel te brengen of in gebruik te nemen meetinstrument als bedoeld in
      [artikel 8][ref1] met de bij of krachtens [de wet][ref2] gestelde eisen blijkt uit de bij ministeriële regeling
      vast te stellen Nederlandse metrologische markering.

      2 De in het eerste lid bedoelde markering wordt duidelijk zichtbaar, gemakkelijk leesbaar en onuitwisbaar op het
      meetinstrument aangebracht. Wanneer een meetinstrument te klein of te gevoelig is om de markering daar op aan te
      brengen, wordt de markering aangebracht op de eventuele verpakking en op de documenten die bij het meetinstrument
      worden gevoegd.

      3 Op de meetinstrumenten mogen andere markeringen worden aangebracht mits de zichtbaarheid en leesbaarheid van de
      Nederlandse metrologische markering, bedoeld in het eerste lid, niet wordt verminderd.

      4 De in het eerste lid bedoelde markering wordt aangebracht door de fabrikant of onder zijn verantwoordelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037835#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0037835/2017-01-01#Artikel21
