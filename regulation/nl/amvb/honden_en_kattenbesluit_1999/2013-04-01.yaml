    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 17 juli 1998, no. J. 986550, Directie
    Juridische Zaken;

    Gelet op de artikelen 3, eerste lid, onderdeel f, 38, 45, 55, 56, 65 en 96 van de Gezondheids- en welzijnswet voor
    dieren;

    De Raad van State gehoord (advies van 5 oktober 1998, no. W11.98.0346);

