  - number: '18'
    text: |-
      1 Een inrichting wordt dagelijks gereinigd en regelmatig en deugdelijk ontsmet.

      2 In ruimten waarin honden en katten zijn ondergebracht worden geen kadavers bewaard.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel18
  - number: '19'
    text: |-
      1 Een kat krijgt binnen een aaneengesloten periode van 12 maanden ten hoogste twee nesten, met dien verstande dat
      een kat binnen een aaneengesloten periode van 24 maanden ten hoogste 3 nesten krijgt.

      2 Een hond krijgt binnen een aaneengesloten periode van 12 maanden ten hoogste één nest.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel19
  - number: '21'
    text: |-
      1 Binnen 5 werkdagen na ontvangst van een hond of kat in een bedrijfsinrichting of asiel wordt, voorzover dat
      nog niet is geschied, de hond ingeënt tegen parvovirusinfectie en hondenziekte (ziekte van Carré) en de kat tegen
      kattenziekte (infectieuze gastro-enteritis) en niesziekte.

      2 Binnen zeven weken na de geboorte van een hond of kat in een bedrijfsinrichting of asiel, doch in ieder geval 7
      dagen vóór aflevering, wordt een hond of kat ingeënt tegen de in het eerste lid genoemde ziekten.

      3 In een asiel wordt een hond of kat waarvan het aannemelijk is dat deze niet tegen één of meerdere van de in het
      eerste lid genoemde ziekten is ingeënt, onmiddellijk na ontvangst in de quarantaineruimte geplaatst tot tenminste
      zeven dagen nadat de in het eerste lid bedoelde inentingen of ontbrekende inentingen hebben plaatsgevonden. De hond
      of kat mag het asiel gedurende die periode niet verlaten tenzij het de teruggave aan de eigenaar betreft.

      4 Het eerste lid is van overeenkomstige toepassing op honden of katten die op het tijdstip van inwerkingtreding
      van dit besluit in een bedrijfsinrichting of asiel worden gehouden en niet tegen één of meerdere van de in dat lid
      genoemde ziekten zijn ingeënt.

      5 Een door een dierenarts opgemaakt en afgegeven schriftelijk bewijs van inenting dat betrekking heeft op de
      inentingen die overeenkomstig het eerste of tweede lid zijn aangebracht en waarop diens naam en praktijkadres en
      de inentingsdatum staan vermeld, wordt gedurende de periode dat desbetreffende hond of kat in de bedrijfsinrichting
      of in het asiel verblijft in de inrichting bewaard; op dit bewijs worden tevens het registratienummer van de
      inrichting en het identificatienummer van de hond of kat vermeld.

      6 Met het in het vijfde lid bedoelde bewijs van inenting wordt gelijkgesteld een dierenpaspoort dat ingevolge het
      Honden- en Kattenbesluit 1981 voor desbetreffende hond of kat is afgegeven en dat is aangevuld met de gegevens die
      ingevolge dat lid op het bewijs van inenting moeten worden vermeld, voorzover die gegevens geen deel uitmaken van
      het dierenpaspoort.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel21
  - number: '22'
    text: |-
      Bij de aflevering van een hond of kat vanuit een bedrijfsinrichting of asiel wordt aan de koper of de verwerver van
      de hond of kat het in [artikel 21, vijfde lid][ref1], bedoelde bewijs van inenting verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel21
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010200
        artikel: '21'
        paragraaf: '6'
  - number: '24'
    text: |-
      1 Een hond of kat wordt slechts in een pension in bewaring genomen indien bij de afgifte van de hond of kat een
      door een dierenarts afgegeven schriftelijk bewijs van inenting wordt verstrekt, waarop diens naam en praktijkadres
      staan vermeld en waaruit blijkt dat tenminste 7 dagen vóór de inontvangstname:

      a. de hond is ingeënt tegen parvovirusinfectie en hondenziekte (ziekte van Carré);

      b. de kat is ingeënt tegen kattenziekte (infectieuze gastro-enteritis) en niesziekte.

      2 In afwijking van het eerste lid is het toegestaan een hond of kat in bewaring te nemen zonder dat daarbij het in
      dat lid bedoelde bewijs wordt verstrekt indien:

      a. de hond of kat binnen 5 werkdagen na ontvangst, wordt ingeënt tegen de in het eerste lid genoemde ziekten, en

      b. de hond of kat onmiddellijk na ontvangst in de quarantaineruimte wordt geplaatst tot tenminste zeven dagen nadat
      inenting heeft plaatsgevonden.

      3 Met het in het eerste lid bedoelde schriftelijke bewijs wordt gelijkgesteld een dierenpaspoort dat ingevolge het
      Honden- en Kattenbesluit 1981 voor desbetreffende hond of kat is afgegeven en dat is aangevuld met de gegevens die
      ingevolge dat lid op het bewijs van inenting moeten worden vermeld, voorzover die gegevens geen deel uitmaken van
      het dierenpaspoort.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel24
  - number: '25'
    text: |-
      1 De gegevensverstrekking aan Onze Minister ingevolge de [artikelen 4, tweede lid][ref1], [6, eerste lid][ref2],
      [7, tweede lid][ref3], en [23][ref4] geschiedt door gebruik van door Onze Minister daartoe vastgestelde
      formulieren.

      2 De onderscheiden formulieren, bedoeld in het eerste lid, worden door Onze Minister op aanvraag verstrekt.

      3 Onze Minister kan ter uitvoering van het eerste lid bij ministeriële regeling nadere regels stellen, waarbij
      onder meer kan worden bepaald dat het verstrekken van gegevens op een andere wijze geschiedt.


