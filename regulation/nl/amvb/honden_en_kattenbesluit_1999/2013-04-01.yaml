  - number: '2'
    text: |-
      1 Het is verboden honden of katten te verkopen, ten verkoop in voorraad te hebben, af te leveren of in bewaring te
      nemen, of te fokken ten behoeve van de verkoop of aflevering van de nakomelingen, tenzij daarbij wordt voldaan aan
      dit besluit.

      2 Het eerste lid is niet van toepassing indien degene onder wiens verantwoordelijkheid de in het eerste lid
      bedoelde activiteiten worden verricht, aannemelijk maakt dat er bij de uitoefening van die activiteiten geen sprake
      is van bedrijfsmatig handelen.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel2
  - number: '3'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], genoemde activiteiten worden verricht in een bij Onze Minister als zodanig
      aangemelde bedrijfsinrichting, asiel of pension.

      2 De honden of katten die worden gehouden ten behoeve van de in [artikel 2, eerste lid][ref2], genoemde
      activiteiten worden in een inrichting als bedoeld in het eerste lid:

      a. gehuisvest, voorzover van toepassing, overeenkomstig de [artikelen 8 tot en met 16][ref3], en

      b . verzorgd overeenkomstig de [artikelen 17][ref4] en [18][ref5].


