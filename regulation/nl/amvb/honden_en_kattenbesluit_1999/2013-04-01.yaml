articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. inrichting: bedrijfsinrichting, asiel of pension;

      b. bedrijfsinrichting: een perceelsgebonden ruimte of ruimtes bestemd of gebruikt voor het houden van honden of
      katten ten behoeve van fokdoeleinden of voor het houden van honden of katten ten behoeve van verkoop of aflevering;

      c. asiel: een perceelsgebonden ruimte of ruimtes bestemd of gebruikt voor het in bewaring houden van honden of
      katten die zwervend zijn aangetroffen, dan wel waarvan door de eigenaar permanent afstand is gedaan;

      d. pension: een perceelsgebonden ruimte of ruimtes, niet zijnde een asiel, bestemd of gebruikt voor het in bewaring
      houden van honden of katten;

      e. quarantaineruimte: een volledig afgescheiden onderdeel van een inrichting, bestemd voor het onderbrengen van
      dieren die mogelijk met een besmettelijke ziekte of parasiet zijn besmet, dat zodanig luchtdicht afsluitbaar is dat
      gasontsmetting kan worden uitgevoerd, dan wel op andere wijze deugdelijk gedesinfecteerd kan worden;

      f. ziekenboeg: een onderdeel van een inrichting dat bestemd kan worden voor het onderbrengen van zieke dieren;

      g. beheerder: degene die onmiddellijk leiding geeft aan de in [artikel 2, eerste lid][ref1], bedoelde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel2
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel1
