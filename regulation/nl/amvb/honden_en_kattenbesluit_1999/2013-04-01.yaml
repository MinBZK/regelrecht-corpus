  - number: '17'
    text: |-
      Een hond wordt in de gelegenheid gesteld om tenminste twee uur per dag in een buitenverblijf of op een speelweide
      als bedoeld in [artikel 8, tweede lid][ref1], te vertoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel8
