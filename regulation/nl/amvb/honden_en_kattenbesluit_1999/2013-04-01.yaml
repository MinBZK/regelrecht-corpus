      1 Onze Minister registreert binnen 4 weken na ontvangst van het in [artikel 4, tweede lid][ref1], bedoelde
      aanmeldingsformulier de inrichting als bedrijfsinrichting, asiel of pension. Bij de registratie wordt aan de
      inrichting een uniek nummer toegekend.

      2 De in het eerste lid bedoelde registratie alsmede de in [artikel 4, tweede lid][ref2], bedoelde gegevens, worden
      door Onze Minister opgeslagen en beheerd in een centraal register.

      3 Binnen 4 weken nadat de in het tweede lid bedoelde registratie heeft plaatsgevonden, verstrekt Onze Minister aan
      degene die de inrichting heeft aangemeld een aanmeldingsbewijs, dat de volgende gegevens bevat:

      a. naam, geboortedatum en adres van degene die de inrichting heeft aangemeld, dan wel, indien de aanmelding is
      gedaan door of namens het bestuur van een rechtspersoon, de naam en het adres van vestiging van de rechtspersoon;

      b. tijdstip van aanmelding van de bedrijfsinrichting, het asiel of pension, en

      c. het registratienummer van de inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0010200#Artikel4
