    text: |-
      [Artikel 7, eerste lid][ref1], is voor een tijdvak van 3 jaar vanaf de inwerkingtreding van dit besluit niet op
      een inrichting van toepassing, indien degene onder wiens verantwoordelijkheid de in [artikel 2, eerste lid][ref2],
      bedoelde activiteiten op die inrichting worden verricht, aantoont dat:

      a. de inrichting vóór het tijdstip van inwerkingtreding van dit besluit in gebruik is genomen;

      b. hij op de inrichting als beheerder werkzaam is en een opleiding volgt op grond waarvan deze in aanmerking kan
      komen voor de verkrijging van een bewijs van vakbekwaamheid als bedoeld in [artikel 7, eerste lid][ref3], en

      c. voorzover hij binnen het vermelde tijdvak verantwoordelijk blijft voor de in [artikel 2, eerste lid][ref4],
      bedoelde activiteiten die op de inrichting worden verricht.


