  - number: '13'
    text: |-
      1 De voor de katten beschikbare ruimte in het binnen- of buitenverblijf is tenminste:

      a. 0,85 m2 aan vloeroppervlakte indien twee katten bij elkaar worden gehuisvest, waarbij de kortste zijde tenminste
      0,65 meter en de hoogte van het binnen- of buitenverblijf tenminste 0,6 meter is;

      b. 3 m2 aan vloeroppervlakte bij huisvesting van meer dan twee katten bij elkaar, vermeerderd met 0,6 m2 voor
      iedere kat die het aantal van 5 in het verblijf te boven gaat, waarbij de kortste zijde tenminste 1 meter en de
      hoogte van het binnen- of buitenverblijf tenminste 1,8 meter is.

      2 In de binnenverblijven zijn vanaf 0,15 meter boven vloerniveau per kat afzonderlijke rustplanken met een lengte
      van tenminste 0,35 meter en een breedte van tenminste 0,20 meter aanbracht.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel13
  - number: '14'
    text: |-
      1 In afwijking van [artikel 11, tweede en derde lid][ref1], wordt:

      a. een in een quarantaineruimte ondergebrachte hond of kat solitair gehuisvest;

      b. een hond of kat solitair gehuisvest indien de gezondheid of het welzijn van de hond of kat of van de andere
      honden of katten dit vereist.

      2 In afwijking van [artikel 12, tweede lid][ref2], is bij solitaire huisvesting de beschikbare ruimte voor een
      hond:

      a. met een schofthoogte tot 0,3 meter tenminste 2 m2 aan vloeroppervlakte, waarbij de kortste zijde tenminste 1
      meter en de hoogte van het binnen- of buitenverblijf tenminste 1,8 meter is;

      b. met een schofthoogte vanaf 0,3 meter tot 0,5 meter tenminste 2,4 m2 aan vloeroppervlakte, waarbij de kortste
      zijde tenminste 1,2 meter en de hoogte van het binnen- of buitenverblijf tenminste 1,8 meter is;

      c. met een schofthoogte vanaf 0,5 meter tenminste 3 m2 aan vloeroppervlakte, waarbij de kortste zijde tenminste 1,2
      meter en de hoogte van het binnen- of buitenverblijf tenminste 1,8 meter is.

      3 Bij solitaire huisvesting is de beschikbare ruimte voor een kat tenminste 0,47 m2 aan vloeroppervlakte, waarbij
      de kortste zijde tenminste 0,65 meter en de hoogte van het binnen- of buitenverblijf tenminste 0,6 meter is.

      4 Bij solitaire huisvesting is de beschikbare ruimte voor een kater die voor fokdoeleinden gehouden wordt tenminste
      6 m2, waarbij de kortste zijde tenminste 1 meter en de hoogte van het binnen- of buitenverblijf tenminste 1,8 meter
      is.


