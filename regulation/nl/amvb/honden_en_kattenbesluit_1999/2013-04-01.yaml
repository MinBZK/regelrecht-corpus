      1 De aanmelding van een inrichting, bedoeld in [artikel 3, eerste lid][ref1], geschiedt door degene onder wiens
      verantwoordelijkheid in die inrichting de in [artikel 2, eerste lid][ref2], bedoelde activiteiten worden verricht.

      2 De aanmelding geschiedt door middel van indiening bij Onze Minister van een volledig en naar waarheid ingevuld
      aanmeldingsformulier en bevat de volgende gegevens:

      a. naam, geboortedatum en adres van degene onder wiens verantwoordelijkheid de in [artikel 2, eerste lid][ref3],
      bedoelde activiteiten worden verricht, dan wel, indien die activiteiten worden verricht onder de
      verantwoordelijkheid van een rechtspersoon, naam, geboortedatum en adres van de leden van het bestuur van de
      rechtspersoon alsmede de naam en het adres van vestiging van de rechtspersoon;

      b. adres van de bedrijfsinrichting, het asiel of pension;

      c. naam, geboortedatum en adres van de beheerder, bedoeld in [artikel 7][ref4], en het tijdstip waarop met de
      uitoefening van de activiteiten wordt gestart.


