  - number: '8'
    text: |-
      1 De inrichting beschikt over binnenverblijven.

      2 Indien in de inrichting honden worden gehouden beschikt de inrichting over één of meerdere buitenverblijven of
      over een speelweide.

      3 Een binnen- of buitenverblijf voldoet aan de volgende eisen:

      a. de vloer, de wanden, de hekken of de afrasteringen zijn vervaardigd van zodanige materialen dat de honden of
      katten zich er niet aan kunnen verwonden en zich er niet door kunnen vergiftigen;

      b. de vloer is van vloeistofdicht en stroef materiaal;

      c. het heeft rechtopstaande wanden, waarvan tenminste één zodanig is geconstrueerd dat de honden of katten buiten
      het verblijf kunnen kijken, en het kan worden afgesloten.

      4 een binnenverblijf voldoet voorts aan de volgende eisen:

      a. het is vorstvrij, tochtvrij alsmede droog;

      b. het kan op afdoende wijze worden geventileerd;

      c. het kan door middel van een elektrische lichtinstallatie worden verlicht;

      d. het is gedurende de periode dat daglicht beschikbaar is voldoende verlicht door middel van daglicht, en de
      temperatuur in het verblijf bedraagt ten hoogste 30 graden Celsius.

      5 Tenzij een buitenverblijf in een open verbinding staat met een binnenverblijf, is een buitenverblijf gedeeltelijk
      overdekt met een overkapping, die afdoende schuilmogelijkheid biedt tegen neerslag en voldoende schaduw biedt.

      6 Een speelweide voldoet aan de volgende eisen:

      a. zij maakt deel uit van de inrichting;

      b. de omheining daarvan is van zodanig materiaal dat de honden zich er niet aan kunnen verwonden en zich er niet
      door kunnen vergiftigen, en zij kan worden afgesloten.

      7 Indien de inrichting beschikt over één of meer buitenverblijven waarin katten worden gehuisvest, is het vijfde
      lid op het buitenverblijf van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel8
  - number: '9'
    text: |-
      1 Een inrichting beschikt over één of meer ziekenboegen waarin één of meer binnenverblijven zijn aangebracht, die
      in totaal tenminste ruimte kunnen bieden aan een tiende van het aantal honden of katten dat in die inrichting is
      gehuisvest.

      2 Een ziekenboeg kan, ter voorkoming van besmetting, worden afgescheiden van overige binnenverblijven.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel9
  - number: '10'
    text: |-
      1 Een asiel beschikt over één of meer quarantaineruimten waarin binnenverblijven zijn aangebracht, die in totaal
      tenminste ruimte kunnen bieden aan een tiende van het aantal honden of katten dat in die inrichting is gehuisvest.

      2 De quarantaineruimte is zodanig ingericht dat onderlinge besmetting van de daarin gehuisveste honden of katten
      worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel10
  - number: '11'
    text: |-
      1 Honden en katten worden niet bij elkaar in één binnen- of buitenverblijf gehuisvest.

      2 Indien meer dan één hond in de inrichting aanwezig is, worden tenminste twee en ten hoogste 20 honden bij elkaar
      in één binnen- of buitenverblijf gehuisvest.

      3 Het tweede lid is van overeenkomstige toepassing op de huisvesting van katten.

      4 Iedere hond of kat heeft in het binnen- of buitenverblijf, tenzij dit om gezondheidsredenen van de hond of
      kat niet verantwoord is, direct en voortdurend toegang tot een zindelijke drinkgelegenheid waar vers drinkwater
      voorradig is.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel11
  - number: '12'
    text: |-
      1 Een binnen- of buitenverblijf waarin honden worden gehuisvest heeft een hoogte van tenminste 1,8 meter.

      2 De voor de honden beschikbare vloeroppervlakte in vierkante meters in het binnen- of buitenverblijf is voor
      honden met een schofthoogte:

      a. tot 0,3 meter, tenminste gelijk aan het product van (1+n) en 1,0;

      b. vanaf 0,3 meter tot 0,5 meter, tenminste gelijk aan het product van (1+n) en 1,2;

      c. vanaf 0,5 meter, tenminste gelijk aan het product van (1+n) en 1,5,

      d. waarbij de kortste zijde tenminste 1,0 meter is, voorzover het de honden als bedoeld in onderdeel a betreft,
      en tenminste 1,2 meter voorzover het de honden als bedoeld in de onderdelen b en c betreft en waarbij de letter n
      staat voor het aantal honden met de desbetreffende schofthoogte dat bij elkaar in het binnen- of buitenverblijf is
      gehuisvest. Indien honden van verschillende grootte bij elkaar worden gehuisvest, wordt voor de berekening van de
      beschikbare vloeroppervlakte de schofthoogte van de grootste hond gehanteerd.

      3 Het tweede lid is van overeenkomstige toepassing op:

      a. de totale voor honden beschikbare vloeroppervlakte in een aan elkaar gekoppeld binnen- en buitenverblijf van
      een asiel of pension, indien er voor de honden een open verbinding is tussen het binnen- en buitengedeelte van het
      verblijf en de beschikbare vloeroppervlakte in het binnengedeelte van het verblijf tenminste 2,25 m2 is;

      b. de voor de honden beschikbare oppervlakte van de speelweide, bedoeld in [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel8
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel12
    references:
