  - number: '15'
    text: |-
      1 Iedere drachtige of zogende hond of kat heeft in een binnenverblijf de beschikking over een nestruimte.

      2 De kortste zijde van de nestruimte, bedoeld in het eerste lid, heeft een lengte van tenminste 2 maal de
      schofthoogte van de hond of kat waarvoor de nestruimte bestemd is.

      3 Iedere hond heeft in een binnen- of buitenverblijf de beschikking over een schone en droge ligplaats die vanuit
      de bodem van het verblijf optrekkende kou isoleert.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel15
  - number: '16'
    text: |-
      Voor de berekening van de beschikbare vloeroppervlakte voor de honden of katten, bedoeld in de [artikelen 12][ref1]
      en [13][ref2], worden de niet gespeende honden of katten die zich bij hun moeder bevinden niet meegerekend.


