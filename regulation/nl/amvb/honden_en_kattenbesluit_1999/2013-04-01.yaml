  - number: '7'
    text: |-
      1 Op de inrichting is een beheerder werkzaam die in bezit is van een, in het kader van het onderhavige besluit,
      door Onze Minister bij ministeriële regeling erkend bewijs van vakbekwaamheid.

      2 In afwijking van het eerste lid is het vanaf het tijdstip dat de beheerder, bedoeld in het eerste lid, niet
      meer of niet meer als zodanig op de inrichting werkzaam is, voor een periode van één jaar toegestaan dat op de
      inrichting geen beheerder als bedoeld in het eerste lid werkzaam is, mits daarvan binnen 4 weken na eerstgenoemd
      tijdstip aan Onze Minister melding wordt gemaakt door degene die op de inrichting verantwoordelijk is voor de in
      [artikel 2, eerste lid][ref1], bedoelde activiteiten.

      3 Bij overlijden van de in het eerste lid bedoelde beheerder is het tweede lid van overeenkomstige toepassing
      met dien verstande dat, indien de overleden beheerder tevens verantwoordelijk was voor de ingevolge
      [artikel 2, eerste lid][ref2], bij Onze Minister aangemelde activiteiten die op de inrichting worden verricht, en
      die activiteiten onder verantwoordelijkheid van de erfgenaam of de erfgenamen van die beheerder op de inrichting
      worden voortgezet, in dat lid in plaats van «één jaar» wordt gelezen: drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010200#Artikel2
