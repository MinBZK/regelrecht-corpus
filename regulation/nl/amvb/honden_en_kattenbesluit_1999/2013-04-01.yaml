  - number: '29'
    text: |-
      1 Mits vanaf de inwerkingtreding van dit besluit de honden of katten in binnenverblijven met passende afmetingen
      zijn gehuisvest, zijn de [artikelen 8, tweede en derde lid, onderdeel c, vierde lid, onderdeel d, vijfde lid][ref1],
      [9][ref2], [11, tweede en derde lid][ref3], [12][ref4], [13][ref5], [14, tweede lid][ref6],
      [15, eerste en tweede lid][ref7], en [17][ref8] voor een tijdvak van 10 jaar vanaf de inwerkingtreding van
      dit besluit niet van toepassing op een inrichting, indien degene onder wiens verantwoordelijkheid de in
      [artikel 2, eerste lid][ref9], bedoelde activiteiten op die inrichting worden verricht, aantoont dat:

      a. de inrichting vóór het tijdstip van inwerkingtreding van dit besluit in gebruik is genomen en nadien niet is
      verbouwd of herbouwd, en

      b. bij de aanmelding overeenkomstig [artikel 28][ref10] tevens een ingevolge het Honden- en Kattenbesluit 1981
      verleende vergunning is overgelegd, waarvan de geldigheid op het tijdstip van inwerkingtreding van dit besluit niet
      is verstreken en die betrekking heeft op de activiteiten die in de inrichting vanaf de inwerkingtreding van dit
      besluit worden verricht.

      2 De in het eerste lid bedoelde artikelen zijn voor een tijdvak van 3 jaar vanaf de inwerkingtreding van dit
      besluit niet van toepassing op een in het eerste lid bedoelde inrichting, indien bij de aanmelding overeenkomstig
      [artikel 28][ref11] geen vergunning als bedoeld in het eerste lid is overgelegd.

      3 Onze Minister vermeldt op het aanmeldingsbewijs, bedoeld in [artikel 5, derde lid][ref12], of bij de aanmelding
      overeenkomstig [artikel 28][ref13] een vergunning als bedoeld in het eerste lid is overgelegd.


