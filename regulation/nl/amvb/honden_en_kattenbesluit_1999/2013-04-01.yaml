      1 Binnen 8 weken nadat aanmelding van de inrichting overeenkomstig dit besluit heeft plaatsgevonden, wordt door
      of namens degene die op de inrichting verantwoordelijk is voor de in [artikel 2, eerste lid][ref1], genoemde
      activiteiten een register bijgehouden waarin de inentingsbewijzen van de in de inrichting aanwezige honden
      of katten, het aanmeldingsbewijs, bedoeld in [artikel 5, derde lid][ref2], en een kopie van het bewijs van
      vakbekwaamheid van de beheerder van de inrichting worden opgenomen.

      2 Vanaf het tijdstip dat een hond of kat niet meer in de inrichting aanwezig is omdat de hond of kat is verkocht,
      afgeleverd, overleden of aan de eigenaar is teruggeven, wordt gedurende drie jaar na dat tijdstip een kopie van
      het inentingsbewijs van desbetreffende hond of kat in een afgescheiden onderdeel van het in het eerste lid bedoelde
      register bewaard.


