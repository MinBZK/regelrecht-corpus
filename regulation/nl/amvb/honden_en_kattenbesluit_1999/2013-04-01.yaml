  - number: '31'
    text: Het Honden- en Kattenbesluit 1981 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel31
  - number: '32'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Laatstbedoeld besluit wordt niet
      genomen voordat 30 dagen zijn verstreken nadat het onderhavige besluit is overgelegd aan beide kamers der Staten-
      Generaal, en evenmin indien binnen die termijn door of namens een der kamers of door tenminste een vijfde van het
      grondwettelijk aantal leden van een der kamers de wens ter kennen wordt gegeven dat de inwerkingtreding van dit
      besluit bij wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel32
  - number: '33'
    text: |-
      Dit besluit wordt aangehaald als: Honden- en kattenbesluit met vermelding van het jaartal van het Staatsblad waarin
      het zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0010200/2013-04-01#Artikel33
