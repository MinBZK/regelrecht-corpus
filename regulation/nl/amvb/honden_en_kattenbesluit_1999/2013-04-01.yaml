      1 Bij wijziging van één of meerdere van de in [artikel 4, tweede lid][ref1], bedoelde gegevens, wordt binnen
      4 weken na het optreden daarvan aan Onze Minister melding gemaakt door de degene die na het intreden van die
      wijziging of wijzigingen op de inrichting verantwoordelijk is voor de in [artikel 2, eerste lid][ref2], genoemde
      activiteiten.

      2 De in het eerste lid bedoelde wijziging of wijzigingen worden binnen 4 weken na de aanmelding daarvan door
      Onze Minister in het in [artikel 5, tweede lid][ref3], bedoelde register verwerkt. Slechts indien een wijziging
      betrekking heeft op gegevens als bedoeld in [artikel 5, derde lid][ref4], verstrekt Onze Minister binnen 4
      weken nadat de registratie van de wijziging of de wijzigingen heeft plaatsgevonden aan betrokkene een aangepast
      aanmeldingsbewijs.


