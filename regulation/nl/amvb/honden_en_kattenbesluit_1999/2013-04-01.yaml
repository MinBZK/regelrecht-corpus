    text: |-
      Het is vanaf de inwerkingtreding van dit besluit voor een tijdvak van 2 maanden toegestaan de in
      [artikel 2, eerste lid][ref1], bedoelde activiteiten te verrichten op een op het tijdstip van inwerkingtreding van
      dit besluit bestaande inrichting, mits degene die binnen dat tijdvak op de inrichting verantwoordelijk is voor de
      in [artikel 2, eerste lid][ref2], bedoelde activiteiten binnen 2 maanden na de inwerkingtreding van dit besluit de
      inrichting overeenkomstig dit besluit aanmeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0010200#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010200#Artikel2
