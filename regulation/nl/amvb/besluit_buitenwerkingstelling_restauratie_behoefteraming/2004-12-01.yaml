articles:
  - number: '1'
    text: |-
      1 Met het oog op de invoering van een nieuw regime voor het herstel en de instandhouding van beschermde
      monumenten als bedoeld in [artikel 34 van de Monumentenwet 1988][ref1], blijven de [artikelen 4][ref2] en
      [8 van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref3] buiten werking voor de restauratie-
      behoefteraming die burgemeester en wethouders vóór 1 mei 2005 kunnen indienen.

      2 De budgetten, bedoeld in [artikel 5 van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref4], worden
      voor de jaren 2011 tot en met 2014 vastgesteld op basis van de restauratie-behoefteramingen die zijn opgesteld voor
      de periode die loopt van 1 mei 2001 tot 1 mei 2005.


