        bwb_id: BWBR0006622
        artikel: '181'
  - number: 7a
    text: |-
      1 Het Centraal Justitieel Incassobureau heeft tot taak de ambtenaren, bedoeld in [artikel 2][ref1], te
      ondersteunen bij hun taken met betrekking tot de inning van de gelden, voortvloeiend uit het gebruik van de
      transactiebevoegdheid.

      2 Het Centraal Justitieel Incassobureau verricht de werkzaamheden die Onze Minister of het openbaar ministerie van
      hem in verband met de uitoefening van hun taken verlangen.

      3 De bevoegde ambtenaren verstrekken het Centraal Justitieel Incassobureau de gegevens die het behoeft in verband
      met de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel2
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel7a
    references:
