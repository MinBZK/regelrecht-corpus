        artikel: '11'
        paragraaf: '5'
  - number: '13'
    text: |-
      De met de inning belaste ambtenaren en al degenen die verder bij de uitvoering van de in
      [artikel 12, vierde lid][ref1], bedoelde voorschriften zijn betrokken, verstrekken desgevraagd alle inlichtingen
      hieromtrent aan de hoofdofficier van justitie, alsmede aan de directeur van het Centraal Justitieel Incassobureau.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel12
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006664
        artikel: '12'
        paragraaf: '5'
  - number: '14'
    text: |-
      1 Wat het Korps landelijke politiediensten en de regionale politiekorpsen betreft doen de korpsbeheerders op de
      door Onze Minister te bepalen wijze jaarlijks opgave van de uitvoering van de in [artikel 12, vierde lid][ref1],
      bedoelde voorschriften en van de met het oog op de toepassing van dit besluit verrichte accountantscontrole.

      2 Wat de Koninklijke marechaussee en de buitengewoon opsporingsambtenaren betreft doen de betrokken korpschefs op
      de door Onze Minister te bepalen wijze jaarlijks opgave van de uitvoering van de in [artikel 12, vierde lid][ref2],
      bedoelde voorschriften en van de met het oog op de toepassing van dit besluit verrichte accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006664#Artikel12
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel14
    references:
