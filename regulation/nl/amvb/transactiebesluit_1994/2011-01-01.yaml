    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Justitie van 7 maart 1994, Stafafdeling Wetgeving Publiekrecht, nr.
    429054/94/6,

    Gelet op artikel 74c van het Wetboek van Strafrecht;

    De Raad van State gehoord (advies van 19 april 1994, nr. WO3.94.0132);

    Gezien het nader rapport van Onze Minister van Justitie van 28 april 1994, Stafafdeling Wetgeving Publiekrecht
    nr. 436870/94/6;

    Hebben goedgevonden en verstaan:
