  - number: '4'
    text: |-
      1 De hoofdofficier van justitie kan bepalen dat naar zijn oordeel de taakvervulling van een bevoegde ambtenaar
      vordert dat tot nader bericht die ambtenaar geen gebruik zal maken van de verleende transactiebevoegdheid.
      Alvorens een beschikking als bedoeld in de eerste volzin te geven, hoort de hoofdofficier van justitie de betrokken
      korpschef.

      2 De korpschef draagt zorg voor de uitvoering van de beschikking. De hoofdofficier van justitie geeft zijn nader
      bericht slechts na hernieuwd overleg.

      3 Van de beschikking, bedoeld in het eerste lid, die betrekking heeft op een buitengewoon opsporingsambtenaar,
      wordt een afschrift gezonden aan de direct toezichthouder van de ambtenaar. Indien de hoofdofficier van justitie
      niet de toezichthouder van de ambtenaar is, wordt tevens een afschrift gezonden aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel4
  - number: '5'
    text: |-
      1 De hoofdofficier van justitie kan bepalen dat naar zijn oordeel het belang van een goede rechtsbedeling vordert
      dat in bepaalde gebieden of op bepaalde openbare wegen binnen het arrondissement of in bepaalde zaken door de
      bevoegde ambtenaren geen gebruik wordt gemaakt van de transactiebevoegdheid.

      2 Alvorens een besluit als in het eerste lid bedoeld te nemen, hoort de hoofdofficier van justitie de betrokken
      korpschef. Dit horen kan achterwege blijven, indien de hoofdofficier van justitie het nodig oordeelt dat in
      het gehele arrondissement in bepaalde zaken door de bevoegde ambtenaren geen gebruik wordt gemaakt van de
      transactiebevoegdheid.

      3 De betrokken korpschefs dragen zorg voor de uitvoering van het besluit.

      4 Indien een besluit als bedoeld in het eerste lid, betrekking heeft op buitengewoon opsporingsambtenaren wordt
      een afschrift gezonden aan de betrokken direct toezichthouder. Indien de hoofdofficier van justitie niet de
      toezichthouder van de ambtenaren is, wordt tevens een afschrift gezonden aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel5
  - number: '6'
    text: |-
      1 De betaling van een geldsom ter voorkoming van strafvervolging geschiedt door storting of overschrijving op een
      daartoe bestemde bankrekening van het Centraal Justitieel Incassobureau.

      2 In bijzondere gevallen kan de betaling eveneens plaatsvinden op een door de bevoegde ambtenaar aan te wijzen
      plaats.

      3 Als plaats van betaling als bedoeld in het tweede lid, wordt slechts aangewezen een politiebureau of - indien
      de bevoegde ambtenaar een militair van de koninklijke marechaussee is - een brigadebureau of de betrokken
      doorlaatpost, dan wel een tijdelijke plaats van betaling, ingesteld door of vanwege de betrokken korpschef.

      4 Degene die betaalt, maakt daarbij op een door de bevoegde ambtenaar aan te geven wijze melding van de zaak waarop
      de betaling betrekking heeft.

      5 Indien de zaak waarop betaling van een geldsom ter voorkoming van strafvervolging betrekking heeft, niet is
      vermeld op de wijze, bedoeld in het vierde lid, kan het Centraal Justitieel Incassobureau het aan hem betaalde
      bedrag terugstorten op de rekening waarvan het bedrag afkomstig is, of anderszins het bedrag terugbetalen aan de
      persoon die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel6
  - number: '7'
    text: |-
      1 De betaling van de geldsom geschiedt binnen twee weken na de dag waarop het strafbare feit is ontdekt, dan wel,
      bij storting of overschrijving op een daartoe bestemde bankrekening van het Centraal Justitieel Incassobureau,
      uiterlijk zes weken na die dag.

      2 In het geval bedoeld in [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref1] worden de in het eerste lid
      bedoelde termijnen bepaald vanaf de dag waarop de voorwaarde ter voorkoming van strafvervolging is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel181
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel7
