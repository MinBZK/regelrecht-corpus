        artikel: '12'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0006664
        artikel: '12'
        paragraaf: '5'
  - number: '15'
    text: |-
      In het geval de transactiebevoegdheid wordt uitgeoefend gedurende de periode dat ingevolge
      [Hoofdstuk IX van de Politiewet 1993][ref1] bijstand wordt verleend, geschieden de betaling van de transactie op
      de wijze van, en de afrekening, verantwoording en controle van de ontvangen gelden door het politiekorps waaraan
      bijstand wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006299
        hoofdstuk: IX
  - number: 15a
    text: |-
      1 Het Centraal Justitieel Incassobureau heeft tot taak het openbaar ministerie te ondersteunen bij zijn taken
      met betrekking tot de inning van de gelden, voortvloeiend uit het gebruik van de bevoegdheid, bedoeld in
      [artikel 74 van het Wetboek van Strafrecht][ref1].

      2 Het Centraal Justitieel Incassobureau verricht de werkzaamheden die Onze Minister of het openbaar ministerie van
      hem in verband met de uitoefening van hun taken verlangen.

      3 De amtenaren van het openbaar ministerie verstrekken het Centraal Justitieel Incassobureau de gegevens die het
      behoeft in verband met de uitvoering van dit artikel.

      4 De betaling van de geldsom geschiedt binnen zes weken vanaf de dagtekening van de acceptgiro die de betrokkene
      van het CJIB ontvangt, dan wel binnen een door het openbaar ministerie bepaalde andere termijn.

      5 De [artikelen 6, eerste, tweede, vierde en vijfde lid][ref2], en [11][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0006664#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006664#Artikel11
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel15a
