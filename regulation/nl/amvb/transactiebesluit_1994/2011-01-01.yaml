articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. transactiebevoegdheid: de bevoegdheid tot het stellen van de voorwaarde ter voorkoming van strafvervolging,
      bestaande in de betaling van een bepaalde geldsom, bedoeld in [artikel 74c van het Wetboek van Strafrecht][ref1];

      b. Onze Minister: Onze Minister van Justitie;

      c. bevoegde ambtenaar: de opsporingsambtenaar, bedoeld in [artikel 2][ref2];

      d. hoofdofficier van justitie: officier van justitie, hoofd van het arrondissementsparket;

      e. buitengewoon opsporingsambtenaar: de ambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref3];

      f. toezichthouder: de toezichthouder, bedoeld in [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref4].

      g. direct toezichthouder: de direct toezichthouder, bedoeld in
      [artikel 1 van het Besluit buitengewoon opsporingsambtenaar][ref5];

      h. Centraal Justitieel Incassobureau: het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref6].

      2 Als korpschef in de zin van dit besluit wordt aangemerkt met betrekking tot

      a. de ambtenaren, bedoeld in [artikel 2, eerste en tweede lid][ref7]: de korpschef van het politiekorps waarbij zij
      in dienst zijn, dan wel hun praktijkstage vervullen;

      b. de ambtenaren werkzaam bij de Koninklijke marechaussee, bedoeld in [artikel 2, eerste en derde lid][ref8]:

      1. voor de toepassing van [artikel 4][ref9]: de betrokken districtscommandant,

      2. voor de toepassing van de overige artikelen: de commandant van de Koninklijke marechaussee;

      c. de ambtenaren, bedoeld in [artikel 2, vierde lid en vijfde lid][ref10]: het hoofd van de organisatie, waarbij
      zij werkzaam zijn.


