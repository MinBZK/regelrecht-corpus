        artikel: 74c
  - number: '12'
    text: |-
      1 Door of vanwege de korpschef worden ambtenaren aangewezen die zijn belast met de inning van gelden die anders dan
      door storting of overschrijving op een in [artikel 11, eerste lid][ref1], bedoelde rekening worden betaald.

      2 Onze Minister stelt het formulier vast van het door deze ambtenaren uit te reiken betalingsbewijs, dan wel de
      eisen waaraan het betalingsbewijs moet voldoen.

      3 De ontvangen gelden worden regelmatig op de voorgeschreven wijze overgemaakt op de daartoe bestemde bankrekening
      van het Centraal Justitieel Incassobureau.

      4 Onze Minister stelt nadere voorschriften vast omtrent de verstrekking en het beheer van de betalingsbewijzen, de
      afrekening en verantwoording van de ontvangen gelden en de in verband daarmee te voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel11
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel12
    references:
