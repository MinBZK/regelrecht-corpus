        bwb_id: BWBR0006664
        artikel: '2'
        paragraaf: '2'
  - number: '8'
    text: |-
      1 In het belang van een juist gebruik van de transactiebevoegdheid wordt er op toegezien, dat de bevoegde ambtenaar
      die besluit een voorwaarde ter voorkoming van strafvervolging te stellen, aan de betrokken persoon een kennisgeving
      doet toekomen waarin de voorwaarde is vermeld.

      2 Indien de verdachte wordt staande gehouden, wordt de kennisgeving aanstonds aan hem uitgereikt.
      In andere gevallen wordt de kennisgeving achtergelaten op het voertuig waarmee het feit werd
      begaan, dan wel zo spoedig mogelijk aan de betrokken persoon toegezonden. In het geval bedoeld in
      [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref1] vindt de toezending niet later plaats dan drie
      maanden na de dag waarop het strafbare feit werd begaan.

      3 Onze Minister stelt het formulier van de kennisgeving vast, dan wel de eisen waaraan een formulier van
      kennisgeving moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel181
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '181'
  - number: '9'
    text: |-
      1 Mede in het belang van een juiste verantwoording der ontvangen geldsommen wordt er op toegezien, dat de bevoegde
      ambtenaar ter voorkoming van strafvervolging geen andere voorwaarde stelt dan de betaling van een door het openbaar
      ministerie vastgestelde en door Onze Minister in de *Staatscourant* bekend gemaakte geldsom.

      2 Er wordt voorts op toegezien, dat aan degene die anders dan door storting of overschrijving op een daartoe
      bestemde bankrekening van het Centraal Justitieel Incassobureau aan de gestelde voorwaarde voldoet, onverwijld een
      betalingsbewijs wordt uitgereikt dat door de met de inning belaste ambtenaar is gedagtekend en ondertekend.

      3 De bevoegde ambtenaar en de met de inning belaste ambtenaar worden in het bezit gesteld van een lijst met voor
      transactie vatbare feiten en daarvoor vastgestelde geldsommen. Aan de betrokken persoon verlenen zij desgevraagd
      inzage in deze lijst.
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel9
  - number: '10'
    text: |-
      1 De bevoegde ambtenaar houdt aantekening van elke zaak waarin hij een voorwaarde ter voorkoming van
      strafvervolging heeft gesteld. Tevens wordt in de gevallen, bedoeld in [artikel 6, tweede lid][ref1], aantekening
      gehouden van de voldoening aan de gestelde voorwaarde.

      2 De in het eerste lid bedoelde aantekeningen worden, uiterlijk binnen een jaar nadat zij zijn opgemaakt,
      desverlangd getoond aan de ambtenaren van het openbaar ministerie in het arrondissement waar de
      opsporingsambtenaren hun dienst hebben uitgeoefend.

      3 De hoofdofficier van justitie wint periodiek rapport in van de korpschefs van de regionale politiekorpsen over
      de wijze waarop de onder hen ressorterende in het arrondissement hun dienst uitoefenende ambtenaren gebruik hebben
      gemaakt van de verleende transactiebevoegdheid. De korpschefs zenden hun rapporten in door tussenkomst van de
      betrokken korpsbeheerder.

      4 Het hoofd van het landelijk parket, bedoeld in
      [artikel 137, tweede lid, van de Wet op de rechterlijke organisatie][ref2], wint periodiek rapport in van de
      korpschef van het Korps landelijke politiediensten over de wijze waarop de onder deze ressorterende ambtenaren
      gebruik hebben gemaakt van de verleende transactiebevoegdheid. De korpschef zendt zijn rapport in door tussenkomst
      van de korpsbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0006664#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel137
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel10
