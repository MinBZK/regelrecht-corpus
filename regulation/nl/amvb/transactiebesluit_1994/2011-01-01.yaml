    text: |-
      1 Voor de in [artikel 3, onder a][ref1], aangewezen zaken wordt de transactiebevoegdheid toegekend aan de
      hulpofficieren van justitie, bedoeld in [artikel 154, onder a en b, van het Wetboek van Strafvordering][ref2],
      alsmede aan de hulpofficieren van justitie, bedoeld in [artikel 154, onder c, van die wet][ref3], voor zover het
      betreft de brigadecommandanten en de afdelingscommandanten en de adjudant-onderofficier en de opperwachtmeesters
      die als hun vervanger zijn aangewezen, voor zolang zij als zodanig optreden, alsmede de adjudant-onderofficier en
      de opperwachtmeesters, ingedeeld bij de centrale recherche Koninklijke marechaussee en de recherchegroepen.

      2 Voor de in [artikel 3, onder b][ref4], aangewezen zaken wordt de transactiebevoegdheid toegekend aan de
      ambtenaren van politie, bedoeld in [artikel 141, aanhef en onder b, van het Wetboek van Strafvordering][ref5],
      alsmede aan de ambtenaren die een basisopleiding volgen aan een onderwijsinstelling, ressorterend onder het
      Landelijk selectie- en opleidingsinstituut politie, uitsluitend gedurende hun praktijkstage bij een politiekorps.

      3 Voor de in [artikel 3, onder b en c][ref6], aangewezen zaken wordt transactiebevoegdheid
      toegekend aan de militairen van de Koninklijke marechaussee, bedoeld in
      [artikel 141, aanhef en onder c, van het Wetboek van Strafvordering][ref7], voor de gevallen
      waarin deze militairen zijn belast met de uitvoering van de politietaken, bedoeld in
      [artikel 6, eerste lid, onder b, c, d, e en f, van de Politiewet 1993][ref8].

      4 Voor de in [artikel 3, onder b][ref9], aangewezen zaken wordt transactiebevoegdheid toegekend aan buitengewoon
      opsporingsambtenaren, voor zover deze ambtenaren bevoegd zijn tot de opsporing van die zaken.

      5 In afwijking van het vierde lid, wordt voor de in het vierde lid aangewezen zaken geen
      transactiebevoegdheid toegekend aan buitengewoon opsporingsambtenaren in dienst van een gemeente,
      voor zover voor die zaken in de desbetreffende gemeente krachtens een verordening als bedoeld in
      [artikel 154b, eerste lid, van de Gemeentewet][ref10] een bestuurlijke boete kan worden opgelegd.


