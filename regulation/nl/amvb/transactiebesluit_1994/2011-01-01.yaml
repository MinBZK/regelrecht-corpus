  - number: '3'
    text: |-
      Als zaken waarin de transactiebevoegdheid kan worden uitgeoefend worden aangewezen:

      a. de zaken, aangeduid in de bijlage van dit besluit en zoals nader omschreven in de richtlijnen, gesteld door
      het openbaar ministerie, die de ontdekking betreffen van een misdrijf, omschreven in [artikel 310][ref1] of
      [artikel 321 van het Wetboek van Strafrecht][ref2], voor zover het feit de toeëigening betreft van goederen met een
      waarde van ten hoogste € 120 uit een winkel, voor zover de verdachte de leeftijd van achttien jaren heeft bereikt;

      b. de zaken welke betreffen de op heterdaad of met een technisch hulpmiddel door de bevoegde ambtenaar ontdekte
      overtredingen, aangeduid in de bijlage van dit besluit, voor zover de verdachte de leeftijd van twaalf jaren
      bereikt heeft en hetzij behoort tot een categorie die met betrekking tot die feiten in de bijlage van dit besluit
      is vermeld, hetzij, in het geval bedoeld in [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref3], de
      eigenaar of houder is van het motorrijtuig waarmee het feit is begaan;

      c. de op heterdaad of met een technisch hulpmiddel ontdekte verkeersovertredingen, aangeduid in de bijlage
      van dit besluit en strafbaar gesteld bij [artikel 169 van het Wetboek van Militair Strafrecht][ref4] juncto
      de Verkeersregeling defensie voor zover de verdachte militair is en hetzij behoort tot een categorie die
      met betrekking tot die feiten in de bijlage van dit besluit is vermeld, hetzij, in het geval bedoeld in
      [artikel 181, eerste lid, van de Wegenverkeerswet 1994][ref5], de eigenaar of houder is van het motorrijtuig
      waarmee het feit is begaan en de overtreding is begaan op een militair terrein met een voertuig dat niet bij de
      krijgsmacht in gebruik is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel310
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel321
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel181
      [ref4]: https://wetten.overheid.nl/BWBR0001869#Artikel169
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel181
