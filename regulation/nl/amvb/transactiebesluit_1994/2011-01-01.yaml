  - number: '16'
    text: |-
      Het Besluit politietransactie, het Besluit transactie Koninklijke Marechaussee en het Besluit transactie
      Rijksdienst voor het Wegverkeer worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Transactiebesluit 1994.'
    url: https://wetten.overheid.nl/BWBR0006664/2011-01-01#Artikel17
  - number: '18'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [Politiewet 1993][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
