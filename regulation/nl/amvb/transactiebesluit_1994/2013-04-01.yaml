    429054/94/6,


    Gelet op artikel 74c van het Wetboek van Strafrecht;


    De Raad van State gehoord (advies van 19 april 1994, nr. WO3.94.0132);


    Gezien het nader rapport van Onze Minister van Justitie van 28 april 1994, Stafafdeling Wetgeving Publiekrecht
    nr. 436870/94/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: het [Wetboek van Strafrecht][ref1];

      b. Onze Minister: Onze Minister van Justitie;

      c. Centraal Justitieel Incassobureau: het Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0006713
        artikel: '1'
  - number: '2'
    text: |-
      1 Het Centraal Justitieel Incassobureau heeft tot taak het openbaar ministerie te ondersteunen bij zijn taken
      met betrekking tot de inning van de gelden, voortvloeiend uit het gebruik van de bevoegdheid, bedoeld in
      [artikel 74 van de wet][ref1].

      2 Het Centraal Justitieel Incassobureau verricht de werkzaamheden die Onze Minister of het openbaar ministerie van
      hem in verband met de uitoefening van hun taken verlangen.

      3 De ambtenaren van het openbaar ministerie verstrekken het Centraal Justitieel Incassobureau de gegevens die het
      behoeft in verband met de uitvoering van dit artikel.

      4 De betaling van de geldsom geschiedt binnen zes weken vanaf de dagtekening van de acceptgiro die de betrokkene
      van het CJIB ontvangt, dan wel binnen een door het openbaar ministerie bepaalde andere termijn. In bijzondere
      gevallen kan de betaling geschieden op een door het openbaar ministerie aan te wijzen plaats, dan wel aan een door
      het openbaar ministerie aan te wijzen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '3'
    text: >-
      1 Degene die betaalt, maakt daarbij op een door het Centraal Justitieel Incassobureau aan te geven wijze melding
      van de zaak waarop de betaling betrekking heeft.


      2 Indien de zaak waarop betaling van een geldsom ter voorkoming van strafvervolging betrekking heeft, niet is
      vermeld op de wijze, bedoeld in het eerste lid, kan het Centraal Justitieel Incassobureau het aan hem betaalde
      bedrag terugstorten op de rekening waarvan het bedrag afkomstig is, of anderszins het bedrag terugbetalen aan de
      persoon die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel3
  - number: '4'
    text: |-
      1 Het hoofd van de Directie Financieel-Economische Zaken van het Ministerie van Justitie draagt zorg voor de
      opening van een of meer bankrekeningen van het Centraal Justitieel Incassobureau die uitsluitend zijn bestemd voor
      de betaling van gelden, voortvloeiend uit het gebruik van de bevoegdheid, bedoeld in [artikel 74 van de wet][ref1].

      2 De directeur van het Centraal Justitieel Incassobureau is belast met het beheer van de rekeningen. Hij draagt
      er zorg voor dat de ontvangen gelden periodiek worden overgemaakt op een daartoe bestemde bankrekening van het
      Ministerie van Justitie.

      3 Onze Minister stelt nadere voorschriften vast omtrent het beheer van de in het eerste lid bedoelde bankrekeningen
      en de in verband daarmee te voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 4a
    text: >-
      De geldsom ter voorkoming van strafvervolging wordt vermeerderd met de administratiekosten. De omvang van deze
      kosten wordt bepaald bij ministeriële regeling. Op de betaling van de administratiekosten zijn de artikelen
      van dit besluit betreffende de betaling van de geldsom, het toezicht en de verantwoording van de gelden, van
      overeenkomstige toepassing. De administratiekosten worden samen met de geldsom in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel4a
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Transactiebesluit 1994.'
    url: https://wetten.overheid.nl/BWBR0006664/2013-04-01#Artikel5
