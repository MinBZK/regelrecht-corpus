preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, Sharon A.M. Dijksma, van 6 oktober
    2008, nr. WJZ/57270 (2658), directie Wetgeving en Juridische Zaken; gedaan in overeenstemming met Onze Minister van
    Sociale Zaken en Werkgelegenheid en mede namens Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Gelet op artikel 19a, zevende lid, van de Wet overige OCW-subsidies;

    De Raad van State gehoord (advies van 22 oktober 2008, nr. W05.08.0425/I);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, Sharon A.M. Dijksma, van
