      een kalenderjaar zijn aangevraagd, een bedrag ter hoogte van 1,85 maal het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref2], gedeeld door 21,75,
      overtreft, kan het UWV voorzieningen verstrekken ter hoogte van die gezamenlijke waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
