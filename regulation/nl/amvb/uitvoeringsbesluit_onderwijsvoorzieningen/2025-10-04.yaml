    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel2
  - number: '2.2'
    text: |-
      Bij de toepassing van dit besluit en de daarop berustende bepalingen wordt bij de beoordeling en berekening van
      de kosten en de verlening van een voorziening als bedoeld in het eerste lid uitgegaan van de goedkoopste adequate
      voorziening.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel2
  - number: '3.1'
    text: |-
      Een voorziening als bedoeld in [artikel 19a van de wet][ref1] wordt niet verstrekt indien de
      kosten, bedoeld in [dat artikel][ref2], minder bedragen dan 1,85 maal het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref3], gedeeld door 21,75,
      zoals [laatstgenoemd artikel][ref4] luidde op 1 januari van het kalenderjaar waarin de kosten zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel3
    references:
