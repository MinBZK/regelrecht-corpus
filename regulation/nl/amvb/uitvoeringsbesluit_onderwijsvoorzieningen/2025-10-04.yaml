    text: |-
      Een voorziening als bedoeld in [artikel 19a van de wet][ref1] wordt niet verstrekt respectievelijk verleend indien
      het kosten van een voorziening of een voorziening betreft


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
