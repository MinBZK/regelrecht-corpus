  - number: '6.1'
    text: |-
      Vervoersvoorzieningen als bedoeld in [artikel 19a, derde lid, van de wet][ref1], worden niet verleend
      of worden beëindigd, indien het inkomen van de persoon die de voorziening aanvraagt of aan wie de
      voorziening is verleend, in het kalenderjaar waarin de voorziening is aangevraagd of voortzetting van
      een verleende voorziening wordt overwogen, meer bedraagt dan 261 maal 70% van het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2] met betrekking tot een loontijdvak
      van een dag.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '6.2'
    text: |-
      Indien het inkomen van de persoon, bedoeld in het eerste lid, in betekenende mate aan fluctuaties onderhevig is,
      wordt voor de toepassing van het eerste lid de som van het inkomen over het in het eerste lid bedoelde kalenderjaar
      en het inkomen over de twee daaraan voorafgaande kalenderjaren gedeeld door drie.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: '6.3'
    text: |-
      Onder vervoersvoorzieningen als bedoeld in het eerste lid worden in elk geval verstaan een bruikleenauto, een
      taxikostenvergoeding en een kilometervergoeding voor het gebruik van een eigen auto of van een bruikleenauto.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: '6.4'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: 6.4.a
    text: |-
      worden regels gesteld over de wijze van vaststelling van het inkomen, bedoeld in het eerste lid, waarbij kan worden
      bepaald dat bij de vaststelling van het inkomen mede in aanmerking wordt genomen het inkomen van de ouders, de
      echtgenoot, de partner of een ander gezinslid van de in het eerste lid bedoelde persoon;
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: 6.4.b
    text: kan het in het eerste lid bedoelde percentage voor categorieën van personen worden verhoogd; en
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: 6.4.c
    text: |-
      kan worden bepaald dat het eerste lid geen toepassing vindt bij de verlening van nader te bepalen
      vervoersvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: '6.5'
    text: |-
      Beëindiging van de vervoersvoorzieningen wegens overschrijding van de inkomensgrens, bedoeld in het eerste lid,
      vindt plaats met ingang van de datum die is gelegen zes maanden nadat de persoon aan wie de voorziening is verleend
      van de voorgenomen beëindiging in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel6
  - number: '7.1'
    text: |-
      Een leefvervoersvoorziening als bedoeld in [artikel 19a, derde lid, van de wet][ref1] wordt slechts verleend indien
      daarmee de uit ziekte of gebrek voortvloeiende beperkingen worden opgeheven of verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '7.2'
    text: |-
      Een leefvervoersvoorziening als bedoeld in [artikel 19a, derde lid, van de wet][ref1] wordt slechts verleend indien
      op grond van [artikel 19a, tweede lid, van de wet][ref2] een vervoersvoorziening is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '7.3'
    text: |-
      Na beëindiging van de vervoersvoorziening, verleend op grond van [artikel 19a, tweede lid, van de wet][ref1], wordt
      de leefvervoersvoorziening voortgezet gedurende de termijn die is voorzien in de beschikking van UWV waarbij de
      voorziening is toegekend, doch ten hoogste voor de duur van twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '8.1'
    text: |-
      De verlening van een intermediaire activiteit vindt plaats door vergoeding van de kosten voor bemiddeling bij het
      vinden van en voor het gebruik van een intermediaire activiteit.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel8
  - number: '8.2'
    text: |-
      Een intermediaire activiteit, bedoeld in het eerste lid, worden verleend indien er een verklaring is van
      de huisarts of de behandelend medisch specialist, waaruit blijkt dat deze persoon op het gebruik van een
      intermediaire activiteit is aangewezen. Deze verklaring wordt eenmalig gevraagd, tenzij het UWV op grond
      van [artikel 73a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] deze al heeft verkregen
      voor de uitvoering van aan het UWV opgedragen taken. Bij de uitvoering van dit artikel is het UWV bevoegd
      de verklaring te gebruiken, die het UWV heeft verkregen voor de uitvoering van aanspraken op intermediaire
      activiteiten op grond van de [Wet arbeidsongeschiktheidsvoorzieningen jonggehandicapten][ref2], de
      [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet maatschappelijke ondersteuning 2015][ref4] en de
      [Participatiewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0035362
      [ref5]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0035362
      - id: ref5
        bwb_id: BWBR0015703
  - number: '9.1'
    text: |-
      Het UWV kan, indien een of meer feiten op grond waarvan een voorziening als bedoeld in
      [artikel 19a, tweede lid, van de wet][ref1] is verleend, zodanig wijzigen dat de verlening niet langer
      is aangewezen, of indien een met betrekking tot een voorziening afgesloten bruikleencontract afloopt, de
      desbetreffende persoon de niet in de vorm van een financiële tegemoetkoming verleende voorziening doen behouden of
      doen kopen, voor een prijs die de op dat moment in het maatschappelijk verkeer geldende waarde van een dergelijke
      voorziening niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '9.2'
    text: |-
      Indien de voorziening, bedoeld in het eerste lid, een vervoermiddel betreft, wordt bij het bepalen van de waarde,
      bedoeld in het eerste lid, uitgegaan van de voorziening zonder specifieke aanpassingen.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister vergoedt aan het UWV de kosten van de voorzieningen die op grond van [artikel 19a van de wet][ref1]
      door het UWV zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '10.2'
    text: |-
      Onze Minister vergoedt aan het UWV de kosten die door het UWV bij de uitvoering van zijn taak, bedoeld in
      [artikel 19a van de wet][ref1], worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '10.3'
    text: |-
      Onze Minister vergoedt aan het UWV de kosten die verband houden met het beëindigen door het UWV van de
      werkzaamheden ter uitvoering van zijn taak bedoeld in [artikel 19a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '10.4'
    text: |-
      Op de kosten komen in mindering de voorzieningen die zijn terugbetaald en de baten die voortvloeien uit de
      uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel10
  - number: '11.1'
    text: |-
      Het UWV biedt jaarlijks vóór 15 maart het gedeelte van het bestuursverslag dat betrekking heeft op de uitvoering
      van dit besluit met het gedeelte van de jaarrekening dat daarop betrekking heeft aan Onze Minister aan. De
      verklaring omtrent de getrouwheid, bedoeld in [artikel 35 van de Kaderwet zelfstandige bestuursorganen][ref1],
      bevat een afzonderlijke verklaring over het gedeelte dat betrekking heeft op de uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '35'
  - number: '11.2'
    text: |-
      De tussentijdse verslagen die het UWV opstelt op grond van
      [artikel 49, achtste lid, van de Wet structuur uitvoeringsorganisatie][ref1] bevatten tevens een gedeelte over de
      uitvoering van dit besluit, welk gedeelte door het UWV wordt aangeboden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
  - number: '11.3'
    text: UWV biedt het gedeelte van de verslagen, bedoeld in het tweede lid, vóór 15 juni en 15 oktober aan.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel11
  - number: '11.4'
    text: |-
      Het UWV neemt in het gedeelte van het bestuursverslag met jaarrekening, bedoeld in het eerste lid, ten minste
      een verslag van de werkzaamheden en het gevoerde beleid met betrekking tot de voorzieningen, bedoeld in
      [artikel 19a van de wet][ref1], op en tevens een toelichting op het gedeelte van de jaarrekening en de balans dat
      betrekking heeft op de uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '11.5'
    text: |-
      De gedeelten van de tussentijdse verslagen, bedoeld in het tweede lid, geven, uitgesplitst naar de voorzieningen,
      bedoeld in [artikel 5, eerste lid][ref1], ten minste inzicht in de gerealiseerde uitgaven en ontvangsten, op grond
      van [artikel 19a van de wet][ref2], ten opzichte van de voor deze doeleinden verstrekte voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0024869#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0024869
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '12.1'
    text: |-
      Het UWV dient jaarlijks vóór 1 december van het jaar voorafgaand aan het begrotingsjaar waarin de kosten zullen
      worden gemaakt de aanvraag om een voorschot aan Onze Minister in.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel12
  - number: '12.2'
    text: |-
      De aanvraag om een voorschot heeft betrekking op de kosten, bedoeld in [artikel 10][ref1], en de ontvangsten
      op grond van [artikel 19a van de wet][ref2] en is ten minste uitgesplitst naar de voorzieningen, bedoeld in
      [artikel 5, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024869#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
      [ref3]: https://wetten.overheid.nl/BWBR0024869#Artikel5
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024869
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0009458
        artikel: 19a
      - id: ref3
        bwb_id: BWBR0024869
        artikel: '5'
        paragraaf: '2'
  - number: '12.3'
    text: |-
      Onze Minister stelt de hoogte van het voorschot vast en verstrekt met ingang van het begrotingsjaar waarop het
      voorschot betrekking heeft maandelijks voor de 11e van de maand een twaalfde deel van het vastgestelde voorschot.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel12
  - number: '12.4'
    text: Onze Minister kan, op verzoek van het UWV, de bevoorschotting aanpassen in de loop van een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel12
  - number: '12.5'
    text: |-
      Onze Minister stelt binnen acht weken na ontvangst van het gedeelte van het bestuursverslag en de jaarrekening dat
      betrekking heeft op de uitvoering van dit besluit de eindafrekening vast.
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel12
  - number: '13'
    text: |-
      Bij ministeriële regeling kan Onze Minister van Onderwijs, Cultuur en Wetenschap in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid nadere regels stellen over de wijze waarop het bestuursverslag, de
      jaarrekening en de tussentijdse verslagen, bedoeld in [artikel 12][ref1], worden ingericht en aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0024869#Artikel12
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024869
        artikel: '12'
        paragraaf: '3'
  - number: '14'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop [artikel 19a van de wet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009458#Artikel19a
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009458
        artikel: 19a
  - number: '15'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit onderwijsvoorzieningen.'
    url: https://wetten.overheid.nl/BWBR0024869/2025-10-04#Artikel15
