preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 9 januari 1996, PAV2210/96000202;

    Gelet op de artikelen 125, eerste lid, van de Ambtenarenwet en artikel 12 van de Militaire Ambtenarenwet;

    De Raad van State gehoord (advies van 6 mei 1996, nr. WO7.96.0015);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 17 juni 1996, nr. P/96001789 ;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.b
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.b.1e
    text: |-
      de ambtenaar die op basis van het [Burgerlijk ambtenarenreglement defensie][ref1] in vaste of in tijdelijke
      dienst werkzaam is geweest en ten gevolge van een ontslag, met uitzondering van een ontslag op eigen aanvraag, een
      disciplinair strafontslag, een functioneel leeftijdsontslag en een ontslag wegens flexibel pensioen en uittreden,
      gegeven op grond van evengenoemd reglement werkloos is geworden in de zin van de [Werkloosheidswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
      - id: ref2
        bwb_id: BWBR0004045
  - number: 1.b.2e
    text: |-
      de militair die op basis van het [Algemeen militair ambtenarenreglement][ref1] voor onbepaalde tijd in militaire
      dienst werkzaam is geweest en ten gevolge van een ontslag, met uitzondering van een ontslag op eigen verzoek,
      een disciplinair strafontslag danwel een leeftijdsontslag, gegeven op grond van evengenoemd reglement werkloos is
      geworden in de zin van de [Werkloosheidswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003482
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003482
      - id: ref2
        bwb_id: BWBR0004045
  - number: 1.c
    text: |-
      de WW: de [Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 1.d
    text: |-
      dagloon: het dagloon, bedoeld in de [artikelen 44 tot en met 46 van de WW][ref1] met toepassing van de maximum
      dagloongrens van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref2], verminderd met de tegemoetkoming van
      de werkgever in de ziektekostenverzekering van betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 1.e
    text: |-
      ongemaximeerd dagloon: het dagloon, bedoeld in [de artikelen 44 tot en met 46 van de WW][ref1] zonder toepassing
      van de maximum dagloongrens van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref2], verminderd met de
      tegemoetkoming van de werkgever in de ziektekostenverzekering van betrokkene;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 1.f
    text: |-
      loongerelateerde WW-conforme uitkering: de loongerelateerde uitkering, bedoeld in [Hoofdstuk IIA, afdeling II van
      de WW](onbekend);
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.g
    text: 'WW-conforme vervolguitkering: de vervolguitkering, bedoeld in [Hoofdstuk IIA, afdeling III van de WW](onbekend);'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.h
    text: 'kortdurende WW-conforme uitkering: de kortdurende uitkering, bedoeld in [Hoofdstuk IIB van de WW](onbekend);'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.i
    text: 'WW-conforme uitkeringen: de uitkeringen, genoemd onder *f*, *g*, en *h*;'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.j
    text: |-
      Aanvullende uitkeringen: de verlengde en de verhoogde loongerelateerde WW-conforme uitkering, bedoeld in
      [hoofdstuk 3][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008113
        hoofdstuk: '3'
  - number: 1.k
    text: |-
      diensttijd: de tijd welke betrokkene in dienst dan wel aangesteld is geweest bij het Ministerie van Defensie en in
      voorkomend geval vermeerderd met de tijd welke betrokkene voordien in dienst is geweest bij de rijksoverheid dan
      wel bij een sector van de rijksoverheid;
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
  - number: 1.l
    text: |-
      suppletie: een suppletie krachtens de [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008977
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008977
  - number: 1.m
    text: |-
      arbeidsongeschiktheidsuitkering: een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1]
      dan wel een pensioen ter zake van arbeidsongeschiktheid krachtens de Algemene militaire pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '2'
    text: |-
      Betrokkene heeft met ingang van de dag waarop het ontslag ingaat recht op een uitkering overeenkomstig de normen en
      voorwaarden welke bij of krachtens de [WW][ref1] zijn vastgesteld, voor zover hierna niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '3.1'
    text: |-
      Indien betrokkene op of na de datum van zijn ontslag uit hoofde van ziekte aanspraak heeft of krijgt op
      doorbetaling van zijn laatstgenoten bezoldiging, wordt de uitvoering van [artikel 2][ref1] opgeschort tot het einde
      van het tijdvak waarover die aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Betrokkene die in het genot is van een WW-conforme uitkering ingevolge [artikel 2][ref1] en die wegens ziekte
      verhinderd wordt arbeid te verrichten, ontvangt gedurende de tijd van bedoelde verhindering, doch ten hoogste
      gedurende een tijdvak van 52 weken een uitkering overeenkomstig het bepaalde bij of krachtens de [Ziektewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0001888
  - number: '4'
    text: |-
      De loongerelateerde WW-conforme uitkering ingevolge [artikel 2][ref1], danwel de uitkering bij ziekte
      ingevolge [artikel 3, tweede lid][ref2], bedraagt 70% van het voor betrokkene geldende dagloon, met
      dien verstande dat het bedrag van de uitkering niet daalt beneden het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid onderdeel ][ref3], of indien betrokkene jonger is dan 23 jaar, het voor zijn leeftijd
      geldende minimumloon per maand, bedoeld in [artikel 7, derde lid, van genoemde wet][ref4], beide vermeerderd met
      de daarover berekende vakantietoeslag, bedoeld in [artikel 15 van die wet][ref5] en vervolgens gedeeld door 21,75.
      Hetzelfde minimum geldt als niveau voor de WW-conforme vervolguitkering en de kortdurende WW-conforme uitkering
      ingevolge [artikel 2][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      Indien betrokkene tijdens het genot van een WW-conforme uitkering, bedoeld in [artikel 2][ref1], danwel tijdens
      het genot van de uitkering bij ziekte ingevolge [artikel 3, tweede lid][ref2], overlijdt, bestaat aanspraak op een
      eenmalige uitkering overeenkomstig [artikel 35][ref3], danwel [artikel 36 van de Ziektewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel36
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '36'
  - number: '6.1'
    text: |-
      Betrokkene, die ingevolge [artikel 2][ref1] recht heeft op een loongerelateerde WW-conforme uitkering en die op de
      dag voor het intreden van zijn werkloosheid een aaneengesloten diensttijd heeft van tenminste 6 jaar en 40 jaar of
      ouder is heeft recht op een verlenging van de duur van de loongerelateerde WW-conforme uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      De verlenging van de duur van de loongerelateerde WW-conforme uitkering, bedoeld in het eerste lid, bedraagt voor
      een betrokkene van:





                    40 jaar – 5 jaar;




                    41 jaar – 5,5 jaar;




                    42 jaar – 6 jaar;




                    43 jaar – 6,5 jaar;




                    44 jaar – 7 jaar.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel6
  - number: '6.3'
    text: |-
      Betrokkene, die ingevolge [artikel 2][ref1] recht heeft op een loongerelateerde WW-conforme uitkering en die op de
      dag voor het intreden van zijn werkloosheid een aaneengesloten diensttijd heeft van tenminste 10 jaar en 45 jaar of
      ouder is heeft recht op een verlenging van de duur van de loongerelateerde WW-conforme uitkering tot de eerste dag
      van de kalendermaand waarin hij de leeftijd van 65 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.4'
    text: |-
      Betrokkene, die ingevolge [artikel 2][ref1] recht heeft op een loongerelateerde WW-conforme uitkering en die op
      de dag voor het intreden van zijn werkloosheid 45 jaar of ouder is maar geen aaneengesloten diensttijd heeft van
      tenminste 10 jaar, maar wel van tenminste 6 jaar, heeft recht op een verlenging van de loongerelateerde WW-conforme
      uitkering van 7 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.5'
    text: |-
      Onze Minister kan voor de berekening van de diensttijd, bedoeld in het eerste, derde en vierde lid, de tijd
      meetellen, die betrokkene bij een andere overheidswerkgever heeft doorgebracht, indien die betrokkene in het kader
      van een reorganisatie bij die andere overheidswerkgever bij het Ministerie van Defensie te werk is gesteld.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel6
  - number: '7'
    text: |-
      Betrokkene, die recht heeft op een loongerelateerde WW-conforme uitkering ingevolge [artikel 2][ref1], danwel een
      verlenging van de duur van de loongerelateerde WW-conforme uitkering ingevolge [artikel 6][ref2], heeft recht op
      een verhoging van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel6
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '6'
        hoofdstuk: '3'
  - number: '8.1'
    text: |-
      De loongerelateerde WW-conforme uitkering ingevolge [artikel 2][ref1] wordt gedurende de eerste zes maanden
      verhoogd tot 80%, gedurende de daarop volgende zes maanden tot 75% en gedurende de resterende periode tot 70% van
      het voor betrokkene geldende ongemaximeerd dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Gedurende de verlenging van de loongerelateerde WW-conforme uitkering, bedoeld in [artikel 6][ref1], wordt de
      uitkering verhoogd tot 70% van het voor betrokkene geldende ongemaximeerd dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel6
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '6'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      De som van de loongerelateerde WW-conforme uitkering, dan wel de verlengde loongerelateerde WW-conforme uitkering
      en de verhoging daalt niet beneden het minimumloon per maand, bedoeld in [artikel 8, eerste lid onderdeel ][ref1],
      of indien betrokkene jonger is dan 23 jaar, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid, van genoemde wet][ref2], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref3] en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '8.4'
    text: |-
      De eerste twee jaar van de verlenging van de duur van de loongerelateerde WW-conforme uitkering wordt de WW-
      conforme vervolguitkering ingevolge [artikel 2][ref1] verhoogd ingevolge het bepaalde in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Betrokkene, die binnen de termijn waarin hij recht heeft op een verhoging van de uitkering ingevolge
      [artikel 7][ref1], wegens ziekte verhinderd wordt arbeid te verrichten, heeft recht op een verhoging van de
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel7
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.2'
    text: |-
      De uitkering ingevolge [artikel 3, tweede lid][ref1], wordt verhoogd tot het percentage van het voor betrokkene
      geldende ongemaximeerd dagloon, bedoeld in [artikel 8][ref2], dat van toepassing zou zijn indien betrokkene niet
      ziek zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel8
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '8'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      De overlijdensuitkering bedoeld in [artikel 5][ref1] wordt indien betrokkene overlijdt binnen de termijn waarin hij
      recht heeft op een verhoging van de uitkering ingevolge [artikel 7][ref2] verhoogd tot 100% van het voor betrokkene
      geldende ongemaximeerd dagloon over een tijdvak van 3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel7
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '7'
        hoofdstuk: '3'
  - number: '11.1'
    text: |-
      Een sanctie opgelegd ingevolge [artikel 2][ref1] werkt door naar de aanvullende uitkeringen ingevolge
      [dit hoofdstuk][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Gedurende de verlenging van de loongerelateerde WW-conforme uitkering zijn de artikelen van [Hoofdstuk IIA]
      (onbekend), [afdeling I](onbekend), [artikel 46][ref1] en [de artikelen 75 t/m 78 van de WW][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel75
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '75'
  - number: '12'
    text: |-
      Onze Minister beslist over de toekenning van een WW-conforme uitkering als bedoeld in [hoofdstuk 2][ref1] van dit
      besluit en een aanvullende uitkering als bedoeld in [hoofdstuk 3][ref2] van dit besluit op aanvraag van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008113
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        hoofdstuk: '3'
  - number: '13.1'
    text: |-
      Betrokkene, die aansluitend aan zijn ontslag een nieuwe betrekking aanvaardt ontvangt op zijn aanvraag een
      loonaanvulling, indien het dagloon in de nieuwe betrekking minder bedraagt dan het voor hem geldende ongemaximeerd
      dagloon.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel13
  - number: '13.2'
    text: |-
      Betrokkene, wiens recht op uitkering geheel of gedeeltelijk wordt beëindigd wegens het aanvaarden van een nieuwe
      betrekking ontvangt op zijn aanvraag een loonaanvulling, indien het dagloon in de nieuwe betrekking minder bedraagt
      dan het voor hem geldende ongemaximeerd dagloon.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel13
  - number: '13.3'
    text: |-
      De hoogte van de loonaanvulling is gelijk aan het verschil tussen het dagloon in de nieuwe betrekking en het voor
      hem geldende ongemaximeerd dagloon.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel13
  - number: '13.4'
    text: |-
      De duur van de loonaanvulling is gelijk aan de duur waarop recht op een uitkering bestaat of zou hebben bestaan
      indien betrokkene werkloos zou zijn gebleven.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel13
  - number: '13.5'
    text: |-
      De loonaanvulling vervalt met ingang van de dag, waarop betrokkene opnieuw werkloos wordt of niet meer voldoet aan
      de voorwaarde, bedoeld in het eerste danwel tweede lid, of de duur van de uitkering is verstreken.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het recht op de aanvullende uitkering herleeft indien betrokkene na aanvaarding van arbeid wederom werkloos is
      geworden en recht heeft op een uitkering krachtens de [WW][ref1], krachtens dit besluit, danwel krachtens een
      andere regeling die voorziet in een financiële uitkering bij werkloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '14.2'
    text: |-
      De duur en de hoogte van de aanvullende uitkering zijn gelijk aan de duur en hoogte van de aanvullende uitkering
      waarop betrokkene nog recht gehad zou hebben indien hij onafgebroken werkloos zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel14
  - number: '15.1'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
  - number: 15.1.a
    text: |-
      betrokkene: de betrokkene in de zin van [artikel 1, onder ][ref1], aan wie een privatiseringsontslag is verleend en
      die onmiddellijk aansluitend aan dat ontslag in dienst is getreden van de privaatrechtelijke organisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel1
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '1'
        hoofdstuk: '1'
  - number: 15.1.b
    text: |-
      privatiseringsoperatie: een operatie die ten doel heeft werkzaamheden van het Ministerie van Defensie uit te
      besteden of over te dragen aan een bestaande of voor dat doel opgerichte privaatrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
  - number: 15.1.c
    text: |-
      privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door het Ministerie van Defensie zijn uitbesteed of overgedragen;
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
  - number: 15.1.d
    text: 'privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
  - number: 15.1.e
    text: 'ontslag als werknemer: het ontslag uit de betrekking bij de privaatrechtelijke organisatie.'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
  - number: '15.2'
    text: |-
      Indien binnen twee jaar na het privatiseringsontslag blijkt dat de betrekking die betrokkene bij de
      privaatrechtelijke organisatie vervult niet passend is en hij in verband daarmee al dan niet op eigen verzoek is
      ontslagen, heeft hij recht op de aanvullende uitkering uit hoofde van zijn ontslag als werknemer met ingang van de
      dag op welke hij aanspraak krijgt op een uitkering krachtens de [WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '15.3'
    text: |-
      Indien betrokkene binnen twee jaar na het privatiseringsontslag als werknemer is ontslagen ten gevolge van
      opheffing van zijn betrekking bij de privaatrechtelijke organisatie of overtolligheid van personeel door
      verandering of inkrimping van die organisatie heeft hij recht op de aanvullende uitkering uit hoofde van zijn
      ontslag als werknemer met ingang van de dag op welke hij aanspraak krijgt op een uitkering krachtens de [WW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '15.4'
    text: |-
      Betrokkene die als werknemer is ontslagen en op wie het bepaalde in het tweede of derde lid niet van toepassing is,
      heeft uit hoofde van zijn ontslag als werknemer recht op de aanvullende uitkering met ingang van de dag op welke
      hij aanspraak krijgt op een uitkering krachtens de [WW][ref1], met dien verstande dat de duur van de aanvullende
      uitkering ingaat op de dag van het privatiseringsontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '16.1'
    text: |-
      Betrokkene die ter zake van eenzelfde ontslag recht heeft op een suppletie heeft gedurende de termijn dat hij recht
      heeft op die suppletie geen recht op een uitkering krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel16
  - number: '16.2'
    text: |-
      Betrokkene als bedoeld in het eerste lid, heeft met ingang van de eerste dag volgende op die waarop de duur van
      de suppletie is geëindigd, recht op een uitkering krachtens dit besluit, indien de duur van de uitkering, waarop
      betrokkene krachtens dit besluit recht zou hebben gehad indien hij geen recht op suppletie zou hebben gehad, langer
      is dan de duur van de suppletie.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel16
  - number: '16.3'
    text: |-
      Op de hoogte van de uitkering is [artikel 4][ref1], danwel [artikel 8][ref2] van toepassing in die zin dat gerekend
      wordt vanaf het tijdstip waarop het ontslag is ingegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel8
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '8'
        hoofdstuk: '3'
  - number: '16.4'
    text: |-
      Het recht op een uitkering krachtens dit besluit eindigt met ingang van de dag waarop betrokkene recht verkrijgt op
      een arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel16
  - number: '17.1'
    text: |-
      Betrokkene die ter zake van een ontslag wegens arbeidsongeschiktheid recht heeft op een
      arbeidsongeschiktheidsuitkering, berekend naar een arbeidsongeschiktheid van 80% of meer heeft recht op een
      uitkering krachtens dit besluit met ingang van de dag waarop de mate van arbeidsongeschiktheid op een lager
      percentage wordt gesteld dan 80%.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel17
  - number: '17.2'
    text: |-
      Ter bepaling van de duur en de hoogte van de uitkering krachtens dit besluit wordt uitgegaan van de datum op grond
      waarvan het recht op de arbeidsongeschiktheidsuitkering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel17
  - number: '18'
    text: |-
      Aan betrokkene, die elders arbeid of bedrijf ter hand gaat nemen, kan ter zake van de kosten, die
      voor hem aan een daartoe nodige verhuizing zijn verbonden, op zijn aanvraag een tegemoetkoming
      worden toegekend tot ten hoogste het bedrag van een vergoeding volgens de normen van het
      [Verplaatsingskostenbesluit burgerlijke ambtenaren defensie][ref1], onder verrekening van een tegemoetkoming in
      verhuiskosten uit andere hoofde.


      [ref1]: https://wetten.overheid.nl/BWBR0006039
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006039
  - number: '19'
    text: |-
      Op aanvraag van betrokkene kan het recht op de uitkering, al of niet direct aansluitend aan zijn ontslag, geheel of
      ten dele worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel19
  - number: '20'
    text: |-
      Indien het niveau van de uitkering van de [WW][ref1] een algemene neerwaartse wijziging ondergaat, wordt deze
      neerwaartse wijziging, behoudens indien in het sector overleg Defensie sociale partners anders overeenkomen binnen
      6 maanden na de datum van uitgifte van het *Staatsblad* waarin de maatregel is gepubliceerd, op overeenkomstige
      wijze ten aanzien van de WW-conforme uitkeringen en aanvullende uitkeringen doorgevoerd vanaf de in het
      *Staatsblad* vermelde datum van inwerkingtreding van bedoelde maatregel, doch niet eerder dan 6 maanden na de datum
      van uitgifte van het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '21'
    text: |-
      Onze Minister kan ter uitvoering van [de artikelen 2][ref1], [13][ref2], [14][ref3] en [19][ref4] nadere regels
      stellen. Van de bevoegdheid tot het vaststellen van ministeriële regelingen als bedoeld in de eerste volzin kan
      mandaat worden verleend aan de directeur-generaal personeel van het Ministerie van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0008113#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008113#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008113#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008113#Artikel19
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008113
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008113
        artikel: '13'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0008113
        artikel: '14'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0008113
        artikel: '19'
        hoofdstuk: '6'
  - number: '22.1'
    text: |-
      Het Wachtgeldbesluit burgerlijke ambtenaren defensie, het Uitkeringsbesluit burgerlijke ambtenaren defensie, het
      Wachtgeld- en uitkeringsbesluit burgerlijke ambtenaren defensie bij privatisering en de Militaire wachtgeldregeling
      1961 worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel22
  - number: '22.2'
    text: |-
      De in het eerste lid genoemde besluiten blijven van kracht ten aanzien van degenen, van wie de ontslagdatum is
      gelegen voor 1 juli 1996 en ten aanzien van degenen die zijn of worden ontslagen in het kader van het Sociaal
      Beleidskader Defensie.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel22
  - number: '22.3'
    text: |-
      Voor degene die wordt ontslagen in het kader van het Sociaal Beleidskader Defensie en die een wachtgeld gaat
      genieten ingevolge het Wachtgeldbesluit burgerlijke ambtenaren defensie bedraagt het bedrag van het wachtgeld
      tenminste 75% van de bezoldiging, vanaf het moment dat de VUT-uitkering in zou gaan, indien de wachtgeld-VUT-
      maatregel nog van kracht geweest zou zijn.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel22
  - number: '23'
    text: Dit besluit treedt in werking met ingang van 1 juli 1996.
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Werkloosheidsbesluit defensiepersoneel.'
    url: https://wetten.overheid.nl/BWBR0008113/1998-01-01#Artikel24
