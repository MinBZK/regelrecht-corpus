  - number: '6'
    text: |-
      1 Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig dit
      artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.

      3 Bij de melding wordt vermeld:

      a. het adres van de inrichting;

      b. de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien degene die de inrichting drijft of zal drijven, een andere persoon is, de naam en het adres van die persoon;

      c. de aard van en de activiteiten of processen in de inrichting;

      d. de indeling en de uitvoering van de inrichting en

      e. het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn.

      4 De in het derde lid vermelde gegevens behoeven niet te worden verstrekt, indien het bevoegd gezag reeds over die
      gegevens beschikt.

      5 Degene die de melding doet, geeft in voorkomend geval bij de melding aan welke gegevens hij reeds aan het bevoegd
      gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0009935/2007-10-17#Artikel6
  - number: '7'
    text: |-
      1 Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning gold, blijven de voorschriften van die vergunning gelden als nadere
      eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften, gedurende
      drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het voorschrift
      betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid][ref2].

      2 De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens het
      Besluit detailhandel milieubeheer, het Besluit brood- of banketbakkerijen milieubeheer, het Besluit doe-het-
      zelf-bedrijven milieubeheer of het Besluit slagerijen milieubeheer, blijven gelden als nadere eis, bedoeld in
      [artikel 5][ref3], na het tijdstip van de inwerkingtreding van dit besluit, mits het voorschrift betrekking heeft
      op een onderwerp dat is genoemd in [artikel 5, eerste lid][ref4].


