    text: |-
      1 Dit besluit is van toepassing op een inrichting die uitsluitend of in hoofdzaak bestemd is voor:

      a. het verkopen of verhuren aan particulieren van roerende zaken, met uitzondering van binnenlandse en buitenlandse
      wettige betaalmiddelen;

      b. het verrichten van ambachtelijke of dienstverlenende activiteiten voorzover deze, gelet op hun aard, geschieden
      in rechtstreeks verband met activiteiten als bedoeld onder a, of

      c. het uitoefenen van een of meer vormen van een ambachtsbedrijf, als bedoeld in [bijlage 1][ref1].

      2 Dit besluit is eveneens van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor een
      samenstel van activiteiten als bedoeld in het eerste lid, onder a tot en met c.


      [ref1]: https://wetten.overheid.nl/BWBR0009935
