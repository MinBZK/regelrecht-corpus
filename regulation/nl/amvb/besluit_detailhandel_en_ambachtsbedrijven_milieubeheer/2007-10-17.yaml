  - number: '5'
    text: |-
      1 Het bevoegd gezag kan nadere eisen stellen met betrekking tot:

      a. de in [bijlage 2][ref1] opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen,
      afvalwater, lucht en verlichting, voorzover dat in hoofdstuk 4 van die bijlage is aangegeven, of

      b. de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, onderzoek naar bodemverontreiniging, voorzover dat in
      [hoofdstuk 4][ref2] van [bijlage 2][ref3] is aangegeven, de gevolgen van het verkeer van personen of goederen van
      en naar de inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan veroorzaken waarop paragraaf
      1.7 van de bijlage betrekking heeft, indien dat bijzonder is aangewezen in het belang van de bescherming van het
      milieu.

      2 De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen
      worden nageleefd.

      3 Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0009935
