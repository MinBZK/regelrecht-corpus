  - number: '3'
    text: |-
      1 Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien in de inrichting:

      a. een of meer stookinstallaties voor verwarming of warmtekrachtopwekking aanwezig zijn met een thermisch vermogen
      per toestel van 2500 kW of meer;

      b. een of meer installaties of voorzieningen aanwezig zijn die kunnen worden gebruikt voor het verstoken of
      verbranden van andere brandstoffen dan aardgas, propaangas, butaangas of gasolie, tenzij sprake is van een open
      haard voor het verbranden van hout, die alleen is bedoeld voor bij- of sfeerverwarming;

      c. koel- of vriesinstallaties of warmtepompen aanwezig zijn met een capaciteit of een totale capaciteit van meer
      dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels van propaan en butaan;

      d. afvalstoffen worden op- of overgeslagen die van buiten de inrichting afkomstig zijn, voorzover de inrichting
      beschikt over een opslagcapaciteit:

      1°. van meer dan 35 m3 voor de opslag van afvalstoffen;

      2°. voor de opslag van gevaarlijke afvalstoffen, tenzij het betreft opslag met een capaciteit van 35 m3 of
      minder van afgedankte apparatuur, in de bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese
      Gemeenschappen van 3 mei 2000 houdende vaststelling van een lijst van afvalstoffen overeenkomstig artikel 1, onder
      a), van [Richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende afvalstoffen en
      Beschikking 94/904/EG van de Raad van de Europese Unie tot vaststelling van een lijst van gevaarlijke afvalstoffen
      overeenkomstig artikel 1, lid 4, van [Richtlijn 91/689/EEG](31991L0689) van de Raad van de Europese Gemeenschappen
      betreffende gevaarlijke afvalstoffen (PbEG L 226/3) aangeduid met een van de afvalstoffencodes 16 02 11*,
      16 02 12*, 16 02 13*, 20 01 23* of 20 01 35* of 21 01 21*, of

      3°. van meer dan 1000 m3 per jaar voor de overslag van afvalstoffen;

      e. voorzieningen of installaties aanwezig zijn voor het:

      1°. opslaan van gevaarlijke stoffen met een capaciteit van 10 000 kg of meer;

      2°. afleveren van brandstoffen aan andere transportmiddelen dan die welke voor eigen gebruik binnen de inrichting
      worden gebruikt;

      3°. opslaan van vloeibare gevaarlijke stoffen of vloeibare gevaarlijke afvalstoffen in tanks, tenzij opslag
      plaatsvindt in ondergrondse tanks, waarop het [Besluit opslaan in ondergrondse tanks 1998][ref2] van toepassing is,
      dan wel van brandbare vloeistoffen in bovengrondse tanks;

      4°. opslaan van gassen of gasmengsels in tanks, tenzij opslag plaatsvindt waarop het
      [Besluit voorzieningen en installaties milieubeheer][ref3] van toepassing is, of

      5°. opslaan van gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref4] met een capaciteit van 400 kg of
      meer;

      2 Dit besluit is evenmin van toepassing op een inrichting die bestemd is voor:

      a. het onderhouden, herstellen, verkopen of verhuren van voertuigen met een verbrandingsmotor met een
      cilinderinhoud van meer dan 50 cc;

      b. het slachten van vee;

      c. het toepassen van zeefdruktechnieken;

      d. het vullen van gasflessen of spuitbussen, of

      e. het opslaan van vuurwerk, tenzij met inachtneming van [artikel 2.2.1, eerste lid, van het Vuurwerkbesluit][ref5]
      ten hoogste 1000 kilogram consumentenvuurwerk wordt opgeslagen.

      3 Een wijziging van de bijlage bij beschikking nr. 2000/532/EG gaat voor de toepassing van het eerste lid,
      onderdeel d, onder 2°, gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij
      bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


