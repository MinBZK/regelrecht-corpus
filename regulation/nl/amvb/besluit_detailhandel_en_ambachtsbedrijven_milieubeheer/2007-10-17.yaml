  - number: '8'
    text: |-
      1 Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning gold of, voorzover dat met betrekking tot die inrichting
      verplicht was, geen melding was gedaan krachtens het Besluit detailhandel milieubeheer, het Besluit brood-
      of banketbakkerijen milieubeheer, het Besluit doe-het-zelf-bedrijven milieubeheer of het Besluit slagerijen
      milieubeheer, meldt degene die de inrichting drijft aan het bevoegd gezag dat hij de inrichting in werking heeft.

      2 De melding geschiedt binnen twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.

      3 Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het
      oprichten van een inrichting waarop dit besluit van toepassing is of zal zijn, zijn het eerste en tweede lid
      niet van toepassing. De aanvraag om de vergunning wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009935#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009935#Artikel6
    url: https://wetten.overheid.nl/BWBR0009935/2007-10-17#Artikel8
