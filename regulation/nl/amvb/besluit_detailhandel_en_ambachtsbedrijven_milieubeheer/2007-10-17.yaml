articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. andere geluidsgevoelige gebouwen: andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 1 van de Wet geluidhinder][ref1];

      b. bevoegd gezag: bestuursorgaan dat bevoegd zou zijn een vergunning te verlenen voor een inrichting als bedoeld
      in [artikel 2][ref2];

      c. particulier: degene die een goed koopt of huurt anders dan in de uitoefening van een beroep of bedrijf;

      d. vergunning: vergunning die is verleend krachtens [artikel 8.1 van de Wet milieubeheer][ref3];

      e. [bijlage 1][ref4]: bij dit besluit behorende [bijlage 1][ref5];

      f. [bijlage 2][ref6]: bij dit besluit behorende [bijlage 2][ref7];

      g. ambachtsbedrijf: inrichting waar uitsluitend of in hoofdzaak op ambachtelijke wijze bedrijfsmatige activiteiten
      worden verricht als omschreven in [bijlage 1][ref8];

      h. brandbare vloeistof: vloeistof of verfproduct waarvan het vlampunt gelegen is op 55°C of hoger (K3-vloeistof);

      i. gevaarlijke stof: stof die of preparaat dat bij of krachtens het Besluit verpakking en
      aanduiding milieugevaarlijke stoffen en preparaten is ingedeeld in een categorie als bedoeld in
      [artikel 34, tweede lid, van de Wet milieugevaarlijke stoffen][ref9];

      j. geluidniveau: niveau van het ter plaatse optredende geluid, uitgedrukt in dB(A), overeenkomstig de door de
      Internationale Electrotechnische Commissie (IEC) opgestelde regels, zoals neergelegd in de IEC-publicatie nr. 651,
      uitgave 1979;

      k. equivalent geluidniveau: gemiddelde van de afwisselende niveaus van het ter plaatse optredende geluid, gemeten
      in de loop van een bepaalde periode en vastgesteld en beoordeeld overeenkomstig de «Handleiding meten en rekenen
      industrielawaai, IL-HR-13–01», uitgave 1981;

      l. woning: gebouw of gedeelte van een gebouw dat voor bewoning wordt gebruikt of daartoe is bestemd, met
      uitzondering van een zodanig gebouw of gedeelte van een gebouw dat deel uitmaakt van een inrichting en van een
      dienst- of bedrijfswoning;

      m. geluidsgevoelige terreinen: geluidsgevoelige terreinen als bedoeld in [artikel 1 van de Wet geluidhinder][ref10];

      n. piekniveau Lmax: maximaal geluidniveau gemeten in de meterstand «F» of «fast»;

      o. vuurwerk: vuurwerk in de zin van het [Vuurwerkbesluit][ref11].


