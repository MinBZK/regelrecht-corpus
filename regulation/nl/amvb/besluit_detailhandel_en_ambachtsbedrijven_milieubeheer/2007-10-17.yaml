  - number: '4'
    text: |-
      1 De voorschriften die zijn opgenomen in [bijlage 2][ref1], gelden voor een ieder die de inrichting drijft. Deze
      draagt er zorg voor dat de voorschriften worden nageleefd.

      2 Het eerste lid is van overeenkomstige toepassing op de voorschriften van [paragraaf 1.1][ref2] van
      [hoofdstuk 1][ref3], van [bijlage 2][ref4], die betrekking hebben op een concentratiegebied voor detailhandel en
      ambachtsbedrijven, dat bij of krachtens een gemeentelijke verordening is aangewezen.

      3 Indien een voorschrift dat is opgenomen in [bijlage 2][ref5], [hoofdstukken 1][ref6] tot en met [3][ref7],
      inhoudt dat daarbij aangegeven middelen ter bescherming van het milieu moeten worden toegepast, kan degene die de
      inrichting drijft, andere middelen toepassen, mits hij, voordat hij die andere middelen toepast, aan het bevoegd
      gezag aantoont dat met de door hem gekozen middelen een ten minste gelijkwaardige bescherming voor het milieu wordt
      bereikt.


