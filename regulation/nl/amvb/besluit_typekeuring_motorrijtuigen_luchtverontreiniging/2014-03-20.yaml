preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 29 maart 1973, Directoraat-Generaal
    voor de Milieuhygiëne, Sector Lucht, Nr. 101549, gedaan in overeenstemming met Onze Minister van Verkeer en
    Waterstaat;


    Gelet op de artikelen 13, 15, 17, 73, eerste lid, en 88, eerste lid, van de Wet inzake de luchtverontreiniging
    (Stb. 1970, 580);


    Gezien Reglement no. 15, behorende bij de Overeenkomst van 20 maart 1958 betreffende het aannemen van eenvormige
    goedkeuringsvoorwaarden en de wederzijdse erkenning van goedkeuring van uitrustingsstukken en onderdelen van
    motorrijtuigen (Trb. 1959, 83) en de Richtlijn van de Raad van de Europese Gemeenschappen van 20 maart 1970
    inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten met betrekking tot de maatregelen die moeten
    worden genomen tegen de luchtverontreiniging door gassen afkomstig van motoren met elektrische ontsteking in
    motorvoertuigen, nr. 70/220/EEG (Pb. E.G. L 76);


    Gezien het advies van de Raad inzake de luchtverontreiniging van 6 december 1972, nr. RvL 306;


    De Raad van State gehoord (advies van 16 mei 1973, no. 28);


    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 12 juli 1973, DG MH/SL, nr.
    105300, uitgebracht in overeenstemming met Onze Minister van Verkeer en Waterstaat;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002890/2014-03-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *Verordening (EG) 595/2009:* Verordening (EG) nr.595/2009 van het Europees Parlement en de Raad van 18
      juni 2009 betreffende de typegoedkeuring van motorvoertuigen en motoren met betrekking tot emissies van zware
      bedrijfsvoertuigen (Euro VI) en de toegang tot reparatie- en onderhoudsinformatie, tot wijziging van Verordening
      (EG) nr. 715/2007 en Richtlijn 2007/46/EG en tot intrekking van de Richtlijnen 80/1269/EEG, 2005/55/EG en 2005/78/
      EG (PbEU 2009, L 188);
      - *Verordening (EG) 715/2007:* Verordening (EG) nr. 715/2007 van het Europees Parlement en de Raad van 20
      juni 2007 betreffende de goedkeuring van motorvoertuigen met betrekking tot emissies van lichte personen- en
      bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie- en onderhoudsinformatie (PbEU 2007, L 171).
    url: https://wetten.overheid.nl/BWBR0002890/2014-03-20#Artikel1
  - number: '2'
    text: >-
      1 Het is met betrekking tot voertuigen als bedoeld in artikel 2 van Verordening (EG) 715/2007 verboden:


      a. te handelen in strijd met artikel 4, eerste, tweede of derde lid, van verordening (EG) 715/2007;


      b. te handelen in strijd met artikel 5, eerste of tweede lid, van verordening (EG) 715/2007;


      c. te handelen in strijd met artikel 6, eerste, vierde, vijfde, zesde, of zevende lid, van verordening (EG)
      715/2007;


      d. te handelen in strijd met artikel 7, tweede lid, van verordening (EG) 715/2007.


      2 Het eerste lid is niet van toepassing op voertuigen die zijn ontworpen en gebouwd voor gebruik door de
      strijdkrachten.
    url: https://wetten.overheid.nl/BWBR0002890/2014-03-20#Artikel2
  - number: '3'
    text: >-
      1 Het is met betrekking tot voertuigen als bedoeld in artikel 2 van Verordening (EG) 595/2009 verboden:


      a. te handelen in strijd met artikel 4, eerste of tweede lid, van verordening (EG) 595/2009;


      b. te handelen in strijd met artikel 5, eerste, tweede of derde lid, van verordening (EG) 595/2009;


      c. te handelen in strijd met artikel 6, eerste lid, van verordening (EG) 595/2009 in samenhang met artikel 6 en 7
      van verordening (EG) 715/2007;


      d. te handelen in strijd met artikel 7, eerste of tweede lid, van verordening (EG) 595/2009;


      e. te handelen in strijd met artikel 9 van verordening (EG) 595/2009.


      2 Het eerste lid is niet van toepassing op voertuigen die zijn ontworpen en gebouwd voor gebruik door de
      strijdkrachten.
    url: https://wetten.overheid.nl/BWBR0002890/2014-03-20#Artikel3
  - number: '15'
    text: >-
      1 Dit besluit kan worden aangehaald als: Besluit typekeuring motorrijtuigen luchtverontreiniging.


      2 Het treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002890/2014-03-20#Artikel15
