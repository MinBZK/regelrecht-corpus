        artikel: '4.1'
  - number: '2'
    text: |-
      Een aanbieder van openbare telefoondiensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, neemt de nodige maatregelen voor het
      tot stand brengen en waarborgen van eind- tot eindverbindingen in Nederland.
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel2
  - number: '3'
    text: |-
      1 Een aanbieder van openbare telefoondiensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, behandelt oproepen van zijn
      eindgebruikers naar eindgebruikers die binnen de Europese Unie gebruik maken van:

      a. nummers die behoren tot de Europese telefoonnummeringsruimte, en

      b. Universal International Freephone Numbers,

      op zodanige wijze dat de oproepen die eindgebruikers bereiken.

      2 Het college maakt jaarlijks op genoegzame wijze bekend welke hem bekende openbare telefoonnetwerken binnen de
      Europese Unie een serving netwerk betreffen als bedoeld in NEN-EN 301160.
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel3
  - number: '4'
    text: |-
      1 Een aanbieder van openbare telefoondiensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, neemt alle maatregelen die ertoe
      bijdragen dat:

      a. een zich in Nederland bevindende abonnee die gebruik maakt van een door het college toegekend nummer op dat
      nummer kan worden opgeroepen door zich in andere lidstaten van de Europese Unie bevindende eindgebruikers, en

      b. een zich in een andere lidstaat van de Europese Unie bevindende abonnee die gebruik maakt van een nummer,
      toegekend door een nationale regelgevende instantie, op dat nummer kan worden opgeroepen door zich in Nederland
      bevindende eindgebruikers.

      2 Het eerste lid, onderdeel a, is van overeenkomstige toepassing op aanbieders van andere openbare elektronische
      communicatiediensten dan de openbare telefoondienst die abonnees die gebruik maken van een door het college
      toegekend niet-geografisch nummer de mogelijkheid bieden om binnenkomende oproepen te ontvangen en aanbieders van
      openbare elektronische communicatienetwerken wier medewerking noodzakelijk is om die dienst aan te bieden.

      3 De verplichting, bedoeld in het eerste en tweede lid, geldt niet:

      a. voor zover het voor de desbetreffende aanbieder technisch niet uitvoerbaar dan wel economisch niet haalbaar is
      de maatregelen te nemen;

      b. voor oproepen afkomstig uit specifieke gedeelten van het grondgebied van de Europese Unie waarvan de op te
      roepen abonnee heeft aangegeven dat hij deze om commerciële redenen niet wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van het tijdstip waarop de
      [Wet implementatie Europees regelgevingskader voor de elektronische communicatiesector 2002][ref1] in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0016635
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016635
  - number: 5a
    text: |-
      Een aanbieder van openbare telefoondiensten waarmee internationale oproepen mogelijk zijn hanteert voor oproepen
      van zijn eindgebruikers naar en van eindgebruikers die gebruik maken van nummers die behoren tot de Europese
      telefoonnummeringsruimte tarieven die vergelijkbaar zijn met de tarieven voor oproepen van en naar andere lidstaten
      van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel5a
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit interoperabiliteit.'
    url: https://wetten.overheid.nl/BWBR0016700/2012-06-05#Artikel6
