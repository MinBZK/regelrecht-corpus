    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 10 juli 2003, nr. WJZ 3025200;

    Gelet op artikel 5 van richtlijn nr. 2002/19/EG van het Europees Parlement en de Raad van de Europese Unie van
    7 maart 2002 inzake de toegang tot en interconnectie van elektronische communicatienetwerken en bijbehorende
    faciliteiten (PbEG L108) en de artikelen 27 en 28 van richtlijn nr. 2002/22/EG van het Europees Parlement en de
    Raad van de Europese Unie van 7 maart 2002 inzake de universele dienst en gebruikersrechten met betrekking tot
    elektronische-communicatienetwerken en -diensten (PbEG L108), alsmede de artikelen 6.3, eerste lid, 6.5 en 18.2 van
