  - number: '2'
    text: |-
      Een aanbieder van spraakcommunicatiediensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, neemt de nodige maatregelen voor het
      tot stand brengen en waarborgen van eind- tot eindverbindingen in Nederland.
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel2
  - number: '3'
    text: |-
      1 Een aanbieder van spraakcommunicatiediensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, behandelt oproepen van zijn
      eindgebruikers naar eindgebruikers die binnen de Europese Unie gebruik maken van:

      a. nummers die behoren tot de Europese telefoonnummeringsruimte, en

      b. Universal International Freephone Numbers,

      op zodanige wijze dat de oproepen die eindgebruikers bereiken.

      2 De Autoriteit Consument en Markt maakt jaarlijks op genoegzame wijze bekend welke haar bekende openbare
      telefoonnetwerken binnen de Europese Unie een serving netwerk betreffen als bedoeld in NEN-EN 301160.
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel3
  - number: '4'
    text: |-
      1 Een aanbieder van spraakcommunicatiediensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, neemt alle maatregelen die ertoe
      bijdragen dat:

      a. een zich in Nederland bevindende abonnee die gebruik maakt van een door de Autoriteit Consument en Markt
      toegekend nummer op dat nummer kan worden opgeroepen door zich in andere lidstaten van de Europese Unie bevindende
      eindgebruikers, en

      b. een zich in een andere lidstaat van de Europese Unie bevindende abonnee die gebruik maakt van een nummer,
      toegekend door een nationale regelgevende instantie, op dat nummer kan worden opgeroepen door zich in Nederland
      bevindende eindgebruikers.

      2 Het eerste lid, onderdeel a, is van overeenkomstige toepassing op aanbieders van andere openbare elektronische
      communicatiediensten dan de spraakcommunicatiedienst die abonnees die gebruik maken van een door de Autoriteit
      Consument en Markt toegekend niet-geografisch nummer de mogelijkheid bieden om binnenkomende oproepen te ontvangen
      en aanbieders van openbare elektronische communicatienetwerken wier medewerking noodzakelijk is om die dienst aan
      te bieden.

      3 De verplichting, bedoeld in het eerste en tweede lid, geldt niet:

      a. voor zover het voor de desbetreffende aanbieder technisch niet uitvoerbaar dan wel economisch niet haalbaar is
      de maatregelen te nemen;

      b. voor oproepen afkomstig uit specifieke gedeelten van het grondgebied van de Europese Unie waarvan de op te
      roepen abonnee heeft aangegeven dat hij deze om commerciële redenen niet wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel4
  - number: '5'
    text: |-
      1 Een aanbieder van spraakcommunicatiediensten of een daarbij betrokken aanbieder van openbare elektronische
      communicatienetwerken die daarbij de toegang tot eindgebruikers controleert, waarborgt dat eindgebruikers gebruik
      kunnen maken van diensten met gebruikmaking van niet-geografische nummers binnen de Europese Unie.

      2 De verplichting, bedoeld in het eerste lid, houdt in ieder geval in dat de in het eerste lid bedoelde aanbieders
      van spraakcommunicatiediensten en van openbare elektronische communicatienetwerken voor oproepen naar een nummer
      uit de reeks 0800, 084, 085, 087, 088, 0900, 0906, 0909, 116, 14 of 18 tarieven of andere vergoedingen hanteren
      die vergelijkbaar zijn met de tarieven of andere vergoedingen die deze aanbieders hanteren voor oproepen naar
      geografische nummers, en zij uitsluitend een afwijkend tarief of afwijkende vergoeding hanteren indien dit
      noodzakelijk is om de extra kosten te dekken die gemoeid zijn met de oproepen naar deze niet-geografische nummers.
      Bij ministeriële regeling kan worden bepaald dat deze verplichting van toepassing is op andere categorieën
      aanbieders of op andere categorieën niet-geografische nummers.

      3 Bij ministeriële regeling kunnen ten aanzien van de in het eerste lid bedoelde verplichting nadere regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel5
  - number: 5a
    text: |-
      Een aanbieder van spraakcommunicatiediensten waarmee internationale oproepen mogelijk zijn hanteert voor oproepen
      van zijn eindgebruikers naar en van eindgebruikers die gebruik maken van nummers die behoren tot de Europese
      telefoonnummeringsruimte tarieven die vergelijkbaar zijn met de tarieven voor oproepen van en naar andere lidstaten
      van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel5a
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit interoperabiliteit.'
    url: https://wetten.overheid.nl/BWBR0016700/2022-03-02#Artikel6
