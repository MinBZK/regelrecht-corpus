articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. NEN-EN 301160: norm inzake het routeren van oproepen naar de Europese telefoonnummeringsruimte, uitgegeven door
      het Nederlands Normalisatie-Instituut;

      c. niet-geografisch nummer: nummer uit een door Onze Minister krachtens [artikel 4.1, eerste lid, van de wet][ref2]
      vastgesteld nummerplan of uit een nationaal nummerplan van een andere lidstaat van de Europese Unie, anders dan een
      nummer waarvan een deel van de cijferstructuur een geografische betekenis heeft en dat krachtens zijn bestemming
      gebruikt mag worden voor het routeren van gesprekken naar de fysieke locatie van het netwerkaansluitpunt;

      d. geografisch nummer: nummer uit een door Onze Minister krachtens [artikel 4.1, eerste lid, van de wet][ref3]
      vastgesteld nummerplan of uit een nationaal nummerplan van een andere lidstaat van de Europese Unie waarvan een
      deel van de cijferstructuur een geografische betekenis heeft en dat krachtens zijn bestemming gebruikt mag worden
      voor het routeren van gesprekken naar de fysieke locatie van het netwerkaansluitpunt;

      e. Universal International Freephone Numbers: een door de ITU geregistreerd uniek nummer dat wereldwijd bestemd is
      om gratis gebeld te worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel4.1
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel4.1
