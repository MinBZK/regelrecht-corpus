  - number: '15.1'
    text: Door Onze Minister van Binnenlandse Zaken wordt een landelijke vacaturebank ingesteld.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel15
  - number: '15.2'
    text: |-
      De burgemeester en Onze Minister van Justitie melden bij de vacaturebank de ambtenaren aan die bij de vaststelling
      van het personeelsplan niet in een vaste functie binnen de politieregio respectievelijk het Korps landelijke
      politiediensten kunnen worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel15
  - number: '15.3'
    text: |-
      De burgemeester en Onze Minister van Justitie zijn verplicht vacatures die niet binnen de eigen politieregio
      respectievelijk het Korps landelijke politiediensten kunnen worden vervuld en na de inwerkingtreding van het
      personeelsplan zijn ontstaan, aan te melden bij de landelijke vacaturebank.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel15
  - number: '15.4'
    text: |-
      Openstelling van vacatures door de burgemeester of Onze Minister van Justitie buiten de eigen politieregio
      respectievelijk het Korps landelijke politiediensten kan eerst plaatsvinden nadat door Onze Minister van
      Binnenlandse Zaken daarvoor toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel15
  - number: '15.5'
    text: Onze Minister van Binnenlandse Zaken kan nadere regels ter uitvoering van dit artikel geven.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel15
  - number: '16.1'
    text: |-
      Aan de vereniging van ambtenaren die vertegenwoordigd zijn in de Commissie, bedoeld in artikel 3 van het Besluit
      overleg en medezeggenschap reorganisatie politiebestel, wordt door Onze Ministers gezamenlijk voor een termijn van
      drie jaren per vereniging per jaar een bedrag van f 15,- per lid toegekend naar de stand van zaken aan het begin
      van elk kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel16
  - number: '16.2'
    text: Met inachtneming van het eerste lid wordt aan elke vereniging van ambtenaren ten minste f 74.000,- toegekend.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel16
  - number: '17'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel17
  - number: '18'
    text: Dit besluit kan worden aangehaald als Besluit sociaal beleidskader reorganisatie politiebestel.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel18
