preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Ministers van Justitie en van Binnenlandse Zaken van 4 oktober 1991, nr. PRP91/U319;

    Gelet op artikel 15 van de Wet tijdelijke voorzieningen reorganisatie politiebestel (Stb. 1991, 674);

    De Raad van State gehoord (advies van 8 mei 1992, nummer WO3.91.566);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken a.i., mede namens Onze Minister van Justitie van
    16 juli 1992, PRP92/338;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.a
    text: 'Onze Ministers: Onze Ministers van Justitie en van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b
    text: 'ambtenaar:'
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.1°
    text: |-
      degene die als ambtenaar is genoemd in artikel 1 van het Ambtenarenreglement voor de rijkspolitie 1975 (*Stb.*
      1977, 172);
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.2°
    text: |-
      degene die als ambtenaar is genoemd in artikel 1 van het Ambtenarenreglement voor de gemeentepolitie 1958 (*Stb.*
      1957, 547);
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.3°
    text: |-
      degene die als ambtenaar is genoemd in [artikel 1 van het Algemeen Rijksambtenarenreglement][ref1] (*Stb.* 1931,
      248) en die werkzaam is binnen het Korps Rijkspolitie;


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel1
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '1'
  - number: 1.b.4°
    text: |-
      degene die door of vanwege een gemeente als ambtenaar is aangesteld om binnen een gemeentelijk politiekorps
      werkzaam te zijn en wiens loonkosten worden bestreden uit de op basis van het Besluit Vergoeding politiekosten 1986
      (*Stb.* 610) verstrekte doeluitkering;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.5°
    text: |-
      degene die op arbeidsovereenkomst naar burgerlijk recht voor onbepaalde tijd in dienst is van het Rijk en die
      werkzaam is binnen het Korps Rijkspolitie;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.6°
    text: |-
      degene die op arbeidsovereenkomst naar burgerlijk recht voor onbepaalde tijd in dienst is van een gemeente en die
      werkzaam is binnen een gemeentelijk politiekorps;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.7°
    text: |-
      degene die krachtens een ambtelijke aanstelling dan wel een arbeidsovereenkomst naar burgerlijk recht voor
      onbepaalde tijd werkzaam is bij de diensten en instellingen ressorterende onder de directie Politie van het
      Ministerie van Justitie, met uitzondering van het Gerechtelijk Laboratorium, het Laboratorium voor Gerechtelijke
      Pathologie en de rijksrecherche van de Procureurs-Generaal, fungerend directeuren van politie;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.8°
    text: |-
      degene die als zodanig door Onze Ministers wordt aangewezen, voor zover hij krachtens een ambtelijke aanstelling
      dan wel een arbeidsovereenkomst naar burgerlijk recht bij het Ministerie van Justitie of het Ministerie van
      Binnenlandse Zaken werkzaam is ten behoeve van de politie;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.b.9°
    text: |-
      degene die als zodanig door de burgemeester in overeenstemming met de Regionale Commissie, bedoeld in artikel 1 van
      het Besluit overleg en medezeggenschap reorganisatie politiebestel (*Stb.* 1991, 675), wordt aangewezen, voor zover
      hij krachtens een ambtelijke aanstelling dan wel een arbeidsovereenkomst naar burgerlijk recht werkzaam is ten
      behoeve van de politie;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.c
    text: |-
      reorganisatie: de reorganisatie van het politiebestel, bedoeld in de Wet tijdelijke voorzieningen reorganisatie
      politiebestel (*Stb.* 1991, 674);
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.d
    text: |-
      [Rijkswachtgeldbesluit][ref1]: het [Rijkswachtgeldbesluit][ref2] 1958 (*Stb.* 1986, 489);


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002326
  - number: 1.e
    text: |-
      [Uitkeringsregeling][ref1]: de [Uitkeringsregeling 1966][ref2] (*Stb.* 1986, 490);


      [ref1]: https://wetten.overheid.nl/BWBR0002537
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002537
      - id: ref2
        bwb_id: BWBR0002537
  - number: 1.f
    text: |-
      personeelsplan: het plan als bedoeld in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005607#Artikel2
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005607
        artikel: '2'
        hoofdstuk: I
  - number: 1.g
    text: |-
      politieregio: een politieregio als bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.h
    text: |-
      burgemeester: de burgemeester, bedoeld in artikel 2 van de Wet tijdelijke voorzieningen reorganisatie
      politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.i
    text: |-
      korpschef: de commissaris of hoofdcommissaris van gemeentepolitie dan wel de districtscommandant van het Korps
      Rijkspolitie, bedoeld in artikel 7 van de Wet tijdelijke voorzieningen reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.j
    text: |-
      Regionale Commissie: de regionale Commissie, bedoeld in artikel 1 van het Besluit overleg en medezeggenschap
      reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.k
    text: |-
      Korps landelijke politiediensten: het Korps landelijke diensten, bedoeld in artikel 14 van de Wet tijdelijke
      voorzieningen reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.l
    text: |-
      chef Korps landelijke politiediensten: de ambtenaar van gemeentepolitie dan wel van rijkspolitie, bedoeld in
      artikel 14 van de Wet tijdelijke voorzieningen reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: 1.m
    text: |-
      Commissie Korps landelijke politiediensten: de Commissie Korps landelijke diensten, bedoeld in artikel 1 van het
      Besluit overleg en medezeggenschap reorganisatie politiebestel;
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel1
  - number: '2.1'
    text: |-
      Ten behoeve van de reorganisatie van het politiebestel wordt per politieregio en voor het Korps landelijke
      politiediensten door de burgemeester, na overleg met het regionaal overlegorgaan, bedoeld in artikel 12 van
      de Wet tijdelijke voorzieningen reorganisatie politiebestel, respectievelijk Onze Ministers van Justitie een
      personeelsplan vastgesteld inzake de inrichting en formatie van de politieregio respectievelijk het Korps
      landelijke politiediensten. In verband met boventalligheid van een politieregio, respectievelijk het Korps
      landelijke politiediensten kan een voorziening van tijdelijke aard worden getroffen, inhoudende dat in het
      desbetreffende formatieplan tot uiterlijk 1 januari 1996 functies van tijdelijke aard kunnen worden gecreëerd.
      In het personeelsplan zijn tevens opgenomen de plaatsing van ambtenaren in een vaste of tijdelijke functie,
      alsmede het al of niet van toepassing zijn van om-, her- of bijscholing of van voorwaarden bij de plaatsing. Het
      personeelsplan wordt aan de ambtenaren bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel2
  - number: '2.2'
    text: |-
      Het personeelsplan van een politieregio treedt niet eerder in werking dan nadat dit door Onze Minister van
      Binnenlandse zaken, in overeenstemming met Onze Minister van Justitie is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel2
  - number: '2.3'
    text: |-
      Het personeelsplan van het Korps landelijke politiediensten treedt niet eerder in werking dan nadat dit door Onze
      Minister van Binnenlandse Zaken is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel2
  - number: '3.1'
    text: |-
      Ambtenaren worden, voor zover zij niet direct in een politieregio zijn ingedeeld, voor het opstellen van
      een personeelsplan door Onze Minister van Justitie ingedeeld bij een politieregio of het Korps landelijke
      politiediensten. Voor zover het betreft indeling bij een politieregio geschiedt dit in overeenstemming met de
      desbetreffende burgemeester.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel3
  - number: '3.2'
    text: |-
      Na indeling bij een politieregio of het Korps landelijke politiediensten is de desbetreffende burgemeester
      respectievelijk Onze Minister van Justitie verantwoordelijk voor de herplaatsing van een ambtenaar.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel3
  - number: '3.3'
    text: |-
      De ambtenaar behoudt bij plaatsing binnen een politieregio, het Korps landelijke politiediensten, het ministerie
      van Justitie of het ministerie van Binnenlandse Zaken de voor hem vóór de reorganisatie bestaande vooruitzichten op
      de salarisschaal volgens welke hij op de datum van inwerkingtreding van het personeelsplan wordt bezoldigd.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel3
  - number: '3.4'
    text: |-
      Door Onze Minister kunnen nadere regels gesteld worden ter zake van de plaatsing van ambtenaren en de daarbij
      behorende procedure.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel3
  - number: '4.1'
    text: |-
      De ambtenaar wordt als gevolg van de reorganisatie, behoudens de uitzondering bedoeld in het derde lid, geen
      ontslag verleend of de met hem bestaande arbeidsovereenkomst wordt niet beëindigd, anders dan met zijn instemming.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel4
  - number: '4.2'
    text: Op de ambtenaar rust de plicht mee te werken aan het vinden van een passende functie.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel4
  - number: '4.3'
    text: |-
      Ten aanzien van de ambtenaar die niet in een van hem redelijkerwijs te vergen mate heeft voldaan aan de in
      het tweede lid genoemde verplichting, kan, indien hem in verband daarmee ontslag wordt verleend of de met
      hem bestaande arbeidsovereenkomst wordt beëindigd, het recht op wachtgeld ingevolge of op de voet van het
      [Rijkswachtgeldbesluit][ref1] dan wel uitkering ingevolge of op de voet van de [Uitkeringsregeling][ref2] vervallen
      worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '4.4'
    text: De bevoegdheid, bedoeld in het derde lid, komt toe aan het gezag dat bevoegd is tot ontslag.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel4
  - number: '5.1'
    text: |-
      De ambtenaar kan, behoudens de uitzondering bedoeld in het tweede lid, niet anders dan met zijn instemming worden
      verplaatst van de ene politieregio naar de andere politieregio of naar het Korps landelijke politiediensten.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel5
  - number: '5.2'
    text: |-
      Een ambtenaar die niet, als bedoeld in [artikel 3, eerste lid][ref1], in het Korps landelijke politiediensten kan
      worden ingedeeld, kan anders dan met zijn instemming worden verplaatst naar een politieregio. Een ambtenaar die
      niet, als bedoeld in [artikel 3, eerste lid][ref2], in een politieregio kan worden ingedeeld, kan anders dan met
      zijn instemming worden verplaatst naar het Korps landelijke politiediensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005607#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005607#Artikel3
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005607
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005607
        artikel: '3'
        hoofdstuk: I
  - number: '6'
    text: |-
      Ten behoeve van de reorganisatie kunnen door de desbetreffende burgemeester of Onze Minister van Justitie voor
      de eigen politieregio respectievelijk het Korps landelijke politiediensten nadere regels worden vastgesteld ter
      uitvoering van de in dit besluit opgenomen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel6
  - number: '7'
    text: |-
      De gelden voor om-, her- en bijscholing ten behoeve van individuele ambtenaren worden toegekend overeenkomstig de
      door de desbetreffende burgemeester in overeenstemming met de Regionale Commissie respectievelijk Onze Minister van
      Justitie in overeenstemming met de Commissie Korps landelijke politiediensten vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel7
  - number: '8.1'
    text: |-
      De ambtenaar die blijkens het personeelsplan in een tijdelijke functie is geplaatst binnen de politieregio of
      het Korps landelijke politiediensten en die slechts in een voor hem passend te achten vaste functie kan worden
      geplaatst na om-, her- en bijscholing, kan worden verplicht zich om-, her- en bij te scholen mits dit hem in
      verband met zijn persoonlijkheid en zijn omstandigheden redelijkerwijs kan worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel8
  - number: '8.2'
    text: |-
      De aan de om-, her- of bijscholing verbonden kosten komen ten laste van de politieregio of het Korps landelijke
      politiediensten waartoe de ambtenaar behoort.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel8
  - number: '8.3'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde ambtenaar die heeft geweigerd aan een hem met toepassing van het
      eerste lid opgelegde verplichting te voldoen in een van hem redelijkerwijs te vergen mate, kan, indien hem in
      verband daarmee ontslag wordt verleend of de met hem bestaande overeenkomst wordt beëindigd, het recht op wachtgeld
      ingevolge of op de voet van het [Rijkswachtgeldbesluit][ref1] dan wel uitkering ingevolge of op de voet van de
      [Uitkeringsregeling][ref2] vervallen worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '8.4'
    text: De bevoegdheid, bedoeld in het derde lid, komt toe aan het gezag dat bevoegd is tot ontslag.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel8
  - number: '9.1'
    text: |-
      Eervol ontslag kan worden verleend aan de ambtenaar die zulks wenst, indien in diens functie een ambtenaar wordt
      geplaatst die blijkens het personeelsplan in een tijdelijke functie is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel9
  - number: '9.2'
    text: Onder ontslag als bedoeld in het eerste lid wordt mede verstaan de beëindiging van de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel9
  - number: '9.3'
    text: |-
      De op de voet van het eerste lid ontslagen ambtenaar, heeft recht op wachtgeld op de voet van het
      [Rijkswachtgeldbesluit][ref1], dan wel op een uitkering op de voet van de [Uitkeringsregeling][ref2] indien
      overigens is voldaan aan de in genoemde regelingen gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '10.1'
    text: |-
      De ambtenaar aan wie in verband met de reorganisatie ontslag is verleend met recht op wachtgeld, heeft recht op
      wachtgeld ingevolge dan wel op de voet van het [Rijkswachtgeldbesluit][ref1] zoals dat luidde op 1 januari 1991.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002326
  - number: '10.2'
    text: |-
      De ambtenaar wiens arbeidsovereenkomst in verband met de reorganisatie is beëindigd met recht op een uitkering,
      heeft recht op een uitkering ingevolge dan wel op de voet van de [Uitkeringsregeling][ref1] zoals die luidde op 1
      januari 1991.


      [ref1]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002537
  - number: '10.3'
    text: |-
      Terstond na ontslagverlening als bedoeld in het eerste lid, dan wel na beëindiging als bedoeld in het tweede lid
      doet de burgemeester of Onze Minister van Justitie hiervan mededeling aan Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel10
  - number: '11.1'
    text: |-
      Aan de ambtenaar aan wie in verband met de reorganisatie eervol ontslag is verleend dan wel wiens
      arbeidsovereenkomst in verband met de reorganisatie is beëindigd, kan een diensttijd-gratificatie worden toegekend
      ter grootte van een in verhouding tot de doorgebrachte diensttijd evenredig gedeelte van de voor hem geldende
      ambtsjubileumgratificatie.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid vindt geen toepassing indien de aanspraak op de ambtsjubileumgratificatie niet binnen een termijn
      van vijf jaren na de datum van ingang van het ontslag dan wel de beëindiging van de arbeidsovereenkomst zou zijn
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel11
  - number: '12.1'
    text: |-
      De ambtenaar aan wie in de periode 1 januari 1993 tot en met 31 december 1994 met recht op wachtgeld in verband
      met de reorganisatie eervol ontslag is verleend en die uiterlijk op 31 december 1993 de leeftijd van 55 jaar heeft
      bereikt, ontvangt een uitkering ingevolge de Regeling uitkering wegens functioneel leeftijdsontslag vanaf het
      moment dat hij de leeftijd bereikt waarop hij hiervoor in aanmerking zou zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel12
  - number: '12.2'
    text: |-
      Het recht op wachtgeld eindigt met ingang van de eerste dag van de maand waarin de ambtenaar een uitkering ontvangt
      ingevolge de Regeling uitkering wegens functioneel leeftijdsontslag.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel12
  - number: '13.1'
    text: |-
      De ambtenaar aan wie in de periode 1 januari 1993 tot en met 31 december 1994 met recht op wachtgeld in verband
      met de reorganisatie eervol ontslag is verleend en die uiterlijk op 31 december 1993 de leeftijd van 55 jaar heeft
      bereikt ontvangt een uitkering ingevolge de Wet uitkering wegens vrijwillig vervroegd uittreden 1984, voor zover
      hij op grond van bij of krachtens de [Wet uitkering wegens vrijwillig vervroegd uittreden 1984](onbekend) gestelde
      voorwaarden hiervoor in aanmerking zou zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel13
  - number: '13.2'
    text: |-
      Het recht op wachtgeld eindigt met ingang van de eerste dag van de maand waarin de ambtenaar een uitkering ontvangt
      ingevolge de Wet uitkering wegens vrijwillig vervroegd uittreden 1984.
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel13
  - number: '13.3'
    text: |-
      Het recht op een uitkering ingevolge de Regeling uitkering wegens functioneel leeftijdsontslag eindigt met ingang
      van de eerste dag van de maand waarin de ambtenaar een uitkering ontvangt ingevolge de Wet uitkering wegens
      vrijwillig vervroegd uittreden 1984. Vanaf het moment dat de ambtenaar de leeftijd heeft bereikt waarop hij,
      krachtens [artikel 12, eerste lid][ref1], in aanmerking zou zijn gekomen voor een uitkering ingevolge de Regeling
      uitkering wegens functioneel leeftijdsontslag indien hij niet reeds een uitkering zou ontvangen ingevolge de
      [Wet uitkering wegens vrijwillig vervroegd uittreden 1984](onbekend), wordt het uitkeringspercentage waarop hij
      ingevolge laatstgenoemde wet recht heeft, verhoogd tot het percentage waarop hij recht zou hebben gehad indien de
      Regeling uitkering wegens functioneel leeftijdsontslag van toepassing zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005607#Artikel12
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005607
        artikel: '12'
        hoofdstuk: I
  - number: '14.1'
    text: |-
      Ten aanzien van de ambtenaar, bedoeld in [artikel 10, eerste lid][ref1], die op het tijdstip van ingang
      van zijn ontslag de leeftijd van 55 jaar heeft bereikt, wordt in [artikel 5, vierde lid][ref2], en
      [artikel 9, vijfde lid, van het Rijkswachtgeldbesluit][ref3] in plaats van "60 jaar" gelezen: 55 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005607#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002326#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002326#Artikel9
    url: https://wetten.overheid.nl/BWBR0005607/1994-12-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005607
        artikel: '10'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002326
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002326
        artikel: '9'
  - number: '14.2'
    text: |-
      Ten aanzien van de ambtenaar, bedoeld in [artikel 10, tweede lid][ref1], die op het tijdstip van
      ingang van beëindiging van zijn arbeidsovereenkomst de leeftijd van 55 jaar heeft bereikt, wordt in
      [artikel 6, eerste lid][ref2], en [artikel 17, vijfde lid, van de Uitkeringsregeling][ref3] in plaats van "60 jaar"
      gelezen: 55 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005607#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002537#Artikel17
