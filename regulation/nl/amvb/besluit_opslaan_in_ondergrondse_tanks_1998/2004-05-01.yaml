  - number: '16'
    text: |-
      1 Op verzoek van degene die op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid
      ontbreekt, een onderzoek naar de aanwezigheid van verontreiniging van de bodem dient te verrichten ingevolge enig
      artikel van dit besluit, kan het bevoegd gezag de rechthebbenden ten aanzien van dat gedeelte van de bodem een
      verplichting opleggen als bedoeld in [artikel 70 van de Wet bodembescherming][ref1].

      2 Degene die een verzoek doet als bedoeld in het eerste lid, verstrekt bij het verzoek de volgende gegevens:

      a. de naam en het adres van de verzoeker en de rechthebbenden;

      b. de kadastrale gegevens van de plaats waar het onderzoek dient te worden verricht;

      c. een omschrijving van de aard en de omvang van het onderzoek;

      d. het tijdstip waarop het onderzoek dient te worden verricht;

      e. een omschrijving van de handelingen die de rechthebbenden in het belang van het onderzoek dienen na te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel70
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '70'
  - number: '17'
    text: |-
      1 Degene die op 1 maart 1993 een vloeistof opslaat in een bestaande ondergrondse tank, meldt dit uiterlijk
      1 september 1993 aan het bevoegd gezag en, indien wordt opgeslagen in een ondergrondse tank binnen een
      inrichting, aan de inspecteur en de door Onze Minister van Sociale Zaken en Werkgelegenheid krachtens
      [artikel 24 van de Arbeidsomstandighedenwet 1998][ref1] aangewezen bevoegde ambtenaar.

      2 De in het eerste lid bedoelde melding is niet vereist, indien de vloeistof wordt opgeslagen in een
      ondergrondse tank binnen een inrichting en voor die inrichting een vergunning is verleend krachtens
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref2], voor zover de desbetreffende vergunning mede betrekking
      heeft op het opslaan van die vloeistof in een ondergrondse tank.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.1'
  - number: '18'
    text: |-
      1 Indien het opslaan van een vloeistof in een bestaande ondergrondse tank voor 1 maart 1993 is beëindigd en na die
      beëindiging in de desbetreffende tank niet een andere vloeistof werd opgeslagen, wordt dit door de eigenaar van die
      tank, uiterlijk 1 september 1993 gemeld aan het bevoegd gezag.

      2 De in het eerste lid bedoelde melding is niet vereist, indien werd opgeslagen in een
      ondergrondse tank binnen een inrichting en voor de inrichting een vergunning is verleend krachtens
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref1], voor zover de desbetreffende vergunning mede betrekking
      heeft op het opslaan in die tank van vloeibare brandstof of afgewerkte olie.

      3 In een geval als bedoeld in het eerste lid verwijdert de eigenaar van de desbetreffende tank de tank of maakt
      die onklaar uiterlijk 31 december 1998. Het verwijderen of onklaar maken geschiedt overeenkomstig de voorschriften,
      opgenomen in [bijlage VI][ref2].

      4 Indien de tank op 1 januari 1999 nog niet is verwijderd of onklaar is gemaakt wordt deze zo spoedig mogelijk doch
      in ieder geval binnen acht weken nadat de eigenaar met de aanwezigheid van de tank bekend is, verwijderd tenzij
      verwijdering als gevolg van de ligging van de tank redelijkerwijs niet kan worden gevergd. In dat geval moet de
      tank onklaar gemaakt worden. Het verwijderen of onklaar maken geschiedt overeenkomstig de voorschriften, opgenomen
      in [bijlage VI][ref3].

      5 De in het derde en vierde lid, eerste volzin, bedoelde verplichtingen gelden niet, indien werd opgeslagen in een
      ondergrondse tank binnen een inrichting en de eigenaar van de betrokken tank op grond van een vergunning, verleend
      krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref4] bevoegd is in die tank een andere vloeistof op
      te slaan.

      6 De in het derde lid bedoelde verplichting om de tank te verwijderen geldt ook niet, indien uit de desbetreffende
      tank de vloeistof is verwijderd en de tank onklaar is gemaakt voor 1 maart 1993; in dat geval kan het bevoegd gezag
      in het belang van de bescherming van de bodem aanvullende maatregelen verlangen overeenkomstig [bijlage VI][ref5].

      7 In afwijking van [artikel 13, vierde lid][ref6], mag tot en met 31 december 1998 een tank, waarvan het beëindigen
      van het gebruik overeenkomstig [artikel 13, eerste lid][ref7], is gemeld, onklaar worden gemaakt, onafhankelijk van
      de ligging van die tank.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
