  - number: '10'
    text: |-
      1 Degene die afgewerkte olie opslaat in een ondergrondse tank van staal, dient te voldoen aan de voorschriften,
      opgenomen in [bijlage III, de hoofdstukken I en II][ref1].

      2 Degene die afgewerkte olie opslaat in een ondergrondse tank van kunststof, dient te voldoen aan de voorschriften,
      opgenomen in [bijlage IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009747
      [ref2]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel10
