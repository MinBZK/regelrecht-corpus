  - number: '19'
    text: |-
      1 Indien een bestaande ondergrondse tank is gelegen in in erfpacht uitgegeven grond, het opslaan in die tank
      is beëindigd voor 1 maart 1993, en op het tijdstip van inwerkingtreding van dit besluit is nog niet de in
      [artikel 18, eerste lid][ref1], bedoelde melding gedaan, doet de erfpachter deze melding alsnog uiterlijk vóór 1
      oktober 1998. [Artikel 18, tweede lid][ref2], is van toepassing.

      2 De erfpachter verwijdert de tank of maakt deze onklaar uiterlijk 31 december 1998.
      [Artikel 18, derde lid, tweede volzin, en vierde, vijfde, zesde en zevende lid][ref3], zijn van overeenkomstige
      toepassing.


