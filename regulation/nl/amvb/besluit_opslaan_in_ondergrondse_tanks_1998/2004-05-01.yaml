        artikel: '8.1'
  - number: '9'
    text: |-
      1 Degene die een vloeibare brandstof opslaat in een ondergrondse tank van staal, dient te voldoen aan de
      voorschriften, opgenomen in [bijlage I, de hoofdstukken I en II][ref1], en aan de krachtens de voorschriften 2.8 en
      2.25 van die bijlage door het bevoegd gezag gestelde nadere eisen.

      2 Degene die een vloeibare brandstof opslaat in een ondergrondse tank van kunststof, dient te voldoen aan de
      voorschriften, opgenomen in [bijlage II][ref2], en aan de krachtens de voorschriften 2.6 en 2.20 van die bijlage
      door het bevoegd gezag gestelde nadere eisen.

      3 Indien krachtens het eerste of het tweede lid, nadere eisen worden gesteld, die mede de arbeidsomstandigheden
      raken, stelt het bevoegd gezag voorafgaand daaraan de door Onze Minister van Sociale Zaken en Werkgelegenheid
      krachtens [artikel 24 van de Arbeidsomstandighedenwet 1998][ref3] aangewezen bevoegde ambtenaar schriftelijk in de
      gelegenheid opmerkingen te maken.

      4 Een beschikking waarin nadere eisen worden gesteld, wordt gezonden aan de inspecteur en de door Onze Minister
      van Sociale Zaken en Werkgelegenheid krachtens [artikel 24 van de Arbeidsomstandighedenwet 1998][ref4] aangewezen
      bevoegde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009747
      [ref2]: https://wetten.overheid.nl/BWBR0009747
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0010346#Artikel24
