  - number: '21'
    text: |-
      1 Op het opslaan van gasolie in een bestaande ondergrondse tank binnen een inrichting waarvoor voor 1 maart 1993
      geen vergunningplicht op grond van de Hinderwet gold, is [hoofdstuk II, de paragrafen 2][ref1] en [3][ref2], met
      uitzondering van de [artikelen 11, eerste lid][ref3], en [16][ref4], niet van toepassing tot en met 1 maart 1996.

      2 Op het opslaan van vloeibare brandstof of afgewerkte olie in een bestaande ondergrondse tank binnen
      een inrichting, waarvoor voor 1 maart 1993 een vergunningplicht op grond van de Hinderwet gold, is
      [hoofdstuk II, de paragrafen 2][ref5] en [3][ref6], met uitzondering van de [artikelen 13][ref7] en [16][ref8],
      niet van toepassing tot en met 1 maart 1995.

      3 Na afloop van de in het eerste onderscheidenlijk tweede lid bedoelde periodes zijn ten aanzien van bestaande
      ondergrondse tanks:

      a. in plaats van de voorschriften, opgenomen in [bijlage I, hoofdstuk II, paragraaf 1][ref9], en in
      [bijlage III, hoofdstuk II, paragraaf 1][ref10], de voorschriften, opgenomen in [bijlage I, hoofdstuk III][ref11],
      onderscheidenlijk in [bijlage III, hoofdstuk III][ref12], van toepassing;

      b. de voorschriften, opgenomen in [bijlage II, hoofdstuk II, paragraaf 1][ref13], en
      [bijlage IV, hoofdstuk II, paragraaf 1][ref14], niet van toepassing.


