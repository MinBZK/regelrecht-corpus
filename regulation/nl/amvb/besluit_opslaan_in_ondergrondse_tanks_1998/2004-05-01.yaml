        bwb_id: BWBR0009747
  - number: '11'
    text: |-
      1 Degene die een inrichting drijft, die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort, uitsluitend door:

      a. het opslaan van vloeibare brandstof in een ondergrondse tank,

      b. het opslaan van afgewerkte olie in een ondergrondse tank, of

      c. het opslaan van huishoudelijk afvalwater in een ondergrondse tank, dient voor dat opslaan uitsluitend te voldoen
      aan de bij of krachtens dit besluit gestelde regels.

      2 Degene die een andere dan de in het eerste lid bedoelde inrichting drijft, dient behalve aan de voorschriften die
      aan de vergunning zijn verbonden of zijn neergelegd in een andere terzake geldende algemene maatregel van bestuur
      krachtens [artikel 8.40][ref2] of [8.44 van de Wet milieubeheer][ref3] voorzover die voorschriften geen betrekking
      hebben op het opslaan van vloeibare brandstof, afgewerkte olie of huishoudelijk afvalwater, te voldoen aan de
      bij of krachtens dit besluit gestelde regels. Een voor een dergelijke inrichting verleende vergunning krachtens
      [artikel 8.1, eerste lid, van de Wet milieubeheer][ref4] geldt ook voor het oprichten, in werking hebben of
      veranderen van de inrichting, dan wel het veranderen van de werking daarvan, voor zover dit oprichten, in werking
      hebben of veranderen, dan wel veranderen van de werking daarvan betrekking heeft op het opslaan van vloeibare
      brandstof, afgewerkte olie of huishoudelijk afvalwater in een ondergrondse tank.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.44
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel11
