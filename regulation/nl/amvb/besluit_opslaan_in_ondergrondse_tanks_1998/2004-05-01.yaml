  - number: '20'
    text: |-
      Indien op 1 maart 1993 een vloeistof is opgeslagen in een bestaande ondergrondse tank buiten een inrichting,
      zijn de [artikelen 5][ref1] en [6][ref2] niet van toepassing tot en met 1 maart 1996. [Artikel 8][ref3] is bij
      beëindiging van de opslag van andere vloeistoffen dan huishoudelijk afvalwater van overeenkomstige toepassing tot
      en met 1 maart 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0009747#Artikel5
