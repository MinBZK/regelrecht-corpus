  - number: '12'
    text: |-
      1 Degene die voornemens is een vloeibare brandstof of afgewerkte olie op te slaan in een ondergrondse tank, dient:

      a. een verkennend onderzoek te verrichten naar de aanwezigheid van de desbetreffende vloeibare brandstof
      onderscheidenlijk afgewerkte olie in de bodem op de plaats waar de ondergrondse tank zal worden geïnstalleerd, of
      indien het een al geïnstalleerde ondergrondse tank betreft, in de onmiddellijke nabijheid ervan, en

      b. van het voornemen om de tank te installeren, of indien het een reeds geïnstalleerde tank betreft, van het
      voornemen om op te slaan, alsmede van de resultaten van het verkennend onderzoek, kennis te geven aan het bevoegd
      gezag, ten minste vier weken voordat de tank zal worden geïnstalleerd, onderscheidenlijk de vloeistof daarin zal
      worden opgeslagen.

      2 De analyse van de grond en grondwatermonsters op minerale oliecomponenten in het kader van het verkennend
      onderzoek, bedoeld in het eerste lid, vindt plaats door een laboratorium dat een kwaliteitsborgingssysteem hanteert
      en dat gebaseerd is op de Europese Normalisatienorm NEN.EN 45 001 (Algemene criteria voor de beoordeling van
      beproevingslaboratoria).
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel12
  - number: '13'
    text: |-
      1 Degene die voornemens is het opslaan van een vloeibare brandstof of het opslaan van afgewerkte olie in een
      ondergrondse tank te beëindigen, meldt dit voornemen vóór het beëindigen aan het bevoegd gezag.

      2 Degene die het opslaan van een vloeibare brandstof of het opslaan van afgewerkte olie heeft beëindigd,
      verricht binnen acht weken na die beëindiging een verkennend onderzoek naar de aanwezigheid van de vloeibare
      brandstof onderscheidenlijk afgewerkte olie in de bodem op de plaats waar die tank was geïnstalleerd.
      [Artikel 12, tweede lid][ref1], is van overeenkomstige toepassing. Indien ingevolge het vierde lid volstaan
      kan worden met het onklaar maken van de tank, wordt het onderzoek verricht in de onmiddellijke nabijheid van de
      desbetreffende tank.

      3 Van de resultaten van een verkennend onderzoek als bedoeld in het tweede lid geeft degene die het opslaan heeft
      beëindigd, zo spoedig mogelijk kennis aan het bevoegd gezag.

      4 Degene die het opslaan van een vloeibare brandstof of het opslaan van afgewerkte olie heeft beëindigd,
      verwijdert de betrokken ondergrondse tank of, indien verwijdering ervan als gevolg van de ligging van de tank
      redelijkerwijs niet kan worden gevergd, maakt die onklaar binnen acht weken na de beëindiging overeenkomstig
      [bijlage VI, hoofdstuk II, de voorschriften 1 en 4, en de hoofdstukken III en IV][ref2].

      5 De in het vierde lid bedoelde verplichting geldt niet indien degene die het opslaan van een vloeibare brandstof
      of van afgewerkte olie heeft beëindigd:

      a. binnen acht weken na die beëindiging de desbetreffende ondergrondse tank weer in gebruik heeft genomen voor het
      opslaan van huishoudelijk afvalwater, vloeibare brandstof of afgewerkte olie, of

      b. op grond van een vergunning, verleend krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref3],
      bevoegd is in de desbetreffende ondergrondse tank een andere vloeistof op te slaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009747#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009747
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
