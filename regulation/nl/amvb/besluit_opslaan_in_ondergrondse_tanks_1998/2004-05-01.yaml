  - number: '14'
    text: |-
      Op het opslaan van huishoudelijk afvalwater in een ondergrondse tank binnen een inrichting, zijn de
      [artikelen 6 tot en met 8][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009747#Artikel6
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009747
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '15'
    text: |-
      1 Degene die een vloeibare brandstof of afgewerkte olie opslaat in een ondergrondse tank, stelt door verzekering
      of anderszins financiële zekerheid ter dekking van de aansprakelijkheid die voortvloeit uit verontreiniging van de
      bodem als gevolg van dat opslaan. Deze verplichting geldt niet voor het Rijk.

      2 De zekerheid bedraagt € 226 890,11 per ondergrondse tank. Bij meer dan tien ondergrondse tanks bedraagt de
      zekerheid in totaal € 2 268 901,08.

      3 De zekerheid wordt in stand gehouden vanaf het tijdstip waarop het opslaan een aanvang neemt tot vier weken nadat
      een kennisgeving is gedaan als bedoeld in [artikel 13, derde lid][ref1].

      4 Indien bij een kennisgeving als bedoeld in [artikel 13, derde lid][ref2], blijkt dat de bodem met vloeibare
      brandstof of met afgewerkte olie is verontreinigd, wordt, in afwijking van het bepaalde in het derde lid, de
      financiële zekerheid in stand gehouden tot het tijdstip waarop gedeputeerde staten aan degene die opslaat,
      schriftelijk hebben verklaard dat de sanering van de bodem voltooid is. Degene die opslaat, kan gedeputeerde
      staten schriftelijk verzoeken om een verklaring als bedoeld in de eerste volzin. Gedeputeerde staten beslist op het
      verzoek uiterlijk vier weken nadat het is verzonden.

      5 Tegen een beschikking inzake een verklaring als bedoeld in het vierde lid, kan beroep worden ingesteld.
      [Paragraaf 20.4 van de Wet milieubeheer][ref3] is op een zodanig beroep van toepassing.

      6 Burgemeester en wethouders van de gemeenten Amsterdam, 's-Gravenhage, Rotterdam en Utrecht, van gemeenten die
      zijn aangewezen krachtens [artikel 88, negende lid, van de Wet bodembescherming][ref4], en een regionaal openbaar
      bestuur als bedoeld in de [Kaderwet bestuur in verandering][ref5], treden voor de toepassing van dit artikel in de
      plaats van gedeputeerde staten. Een regionaal openbaar lichaam als bedoeld in de vorige volzin treedt slechts in de
      plaats van gedeputeerde staten, indien de in dit artikel bedoelde bevoegdheden bij algemene maatregel van bestuur
      zijn overgedragen.

      7 Degene die een vloeibare brandstof of afgewerkte olie opslaat in een ondergrondse tank legt binnen een termijn
      van 4 weken nadat hij met dit opslaan is aangevangen aan het bevoegd gezag een schriftelijk bewijsstuk over,
      waaruit blijkt dat voldaan wordt aan het eerste en tweede lid.

      8 Degene die een vloeibare brandstof of afgewerkte olie opslaat in een ondergrondse tank draagt er zorg voor dat de
      vorm van financiële zekerheid en de hoedanigheid van de garant niet wordt gewijzigd dan nadat aan het bevoegd gezag
      een schriftelijk bewijsstuk is overgelegd, waaruit blijkt dat voldaan wordt aan het eerste en tweede lid.


