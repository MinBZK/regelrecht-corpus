  - number: '24'
    text: |-
      Indien op 1 maart 1993 een ondergrondse tank is geïnstalleerd, doch nog niet in gebruik is genomen, is voor het
      opslaan van vloeibare brandstof of afgewerkte olie in die ondergrondse tank [hoofdstuk II, paragraaf 2][ref1], in
      afwijking van [artikel 21][ref2] onmiddellijk van toepassing, met dien verstande dat:

      a. in plaats van de voorschriften, opgenomen in [bijlage I, hoofdstuk II, paragraaf 1][ref3], en in
      [bijlage III, hoofdstuk II, paragraaf 1][ref4], de voorschriften, opgenomen in [bijlage I, hoofdstuk III][ref5],
      onderscheidenlijk in [bijlage III, hoofdstuk III][ref6], van toepassing zijn;

      b. de voorschriften, opgenomen in [bijlage II, hoofdstuk II, paragraaf 1][ref7], en
      [bijlage IV, hoofdstuk II, paragraaf 1][ref8], niet van toepassing zijn.


