        bwb_id: BWBR0003245
        artikel: '8.2'
  - number: '4'
    text: |-
      Indien ingevolge dit besluit een melding aan het bevoegd gezag dient te geschieden, worden op een formulier waarvan
      het model door Onze Minister wordt vastgesteld, de gegevens verstrekt, aangegeven in [bijlage VII][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: '5'
    text: |-
      Het is verboden buiten een inrichting in een ondergrondse tank een vloeistof op te slaan, met uitzondering van
      huishoudelijk afvalwater.
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel5
  - number: '6'
    text: |-
      Degene die buiten een inrichting huishoudelijk afvalwater opslaat in een ondergrondse tank, dient te voldoen aan de
      voorschriften, opgenomen in [bijlage V][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: '7'
    text: |-
      Degene die voornemens is buiten een inrichting huishoudelijk afvalwater op te slaan in een ondergrondse tank, meldt
      dit voornemen aan het bevoegd gezag:

      a. indien het een nog te installeren ondergrondse tank betreft, ten minste vier weken voor de tank zal worden
      geïnstalleerd;

      b. indien het een reeds geïnstalleerde ondergrondse tank betreft, ten minste vier weken voordat huishoudelijk
      afvalwater zal worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel7
  - number: '8'
    text: |-
      1 Degene die het opslaan van huishoudelijk afvalwater buiten een inrichting heeft beëindigd, verwijdert de
      betrokken ondergrondse tank of, indien verwijdering ervan als gevolg van de ligging van de tank redelijkerwijs
      niet kan worden gevergd, maakt deze onklaar binnen acht weken na die beëindiging overeenkomstig [bijlage VI][ref1].
      Zodra hij de tank heeft verwijderd of onklaar gemaakt, meldt hij dit aan het bevoegd gezag.

      2 De in het eerste lid bedoelde verplichting geldt niet indien degene die het opslaan heeft beëindigd:

      a. binnen acht weken na die beëindiging de desbetreffende ondergrondse tank weer in gebruik heeft genomen voor het
      opslaan van huishoudelijk afvalwater, vloeibare brandstof of afgewerkte olie, of

      b. op grond van een vergunning, verleend krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref2],
      bevoegd is in de desbetreffende ondergrondse tank een andere vloeistof op te slaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009747
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel8
