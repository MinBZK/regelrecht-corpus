        artikel: '1.1'
  - number: '2'
    text: |-
      1 Dit besluit is niet van toepassing op het opslaan van een vloeistof in een ondergrondse tank binnen een
      inrichting:

      a. indien voor dat opslaan in een ander besluit op grond van [artikel 8.40][ref1] of
      [8.44 van de Wet milieubeheer][ref2] voorschriften zijn gesteld, tenzij die inrichting uitsluitend dient voor het
      opslaan van vloeibare brandstof in een ondergrondse tank;

      b. indien de betrokken ondergrondse tank een inhoud heeft van meer dan 150 m3 en deze inrichting behoort tot de
      categorieën 1, 2 of 4 van [bijlage II van het Inrichtingen- en vergunningenbesluit milieubeheer][ref3].

      2 Dit besluit is niet van toepassing op het opslaan van een vloeibare brandstof in een ondergrondse tank binnen een
      inrichting, indien die tank onderdeel van een procesinstallatie is.

      3 Dit besluit is niet van toepassing op het opslaan in een ondergrondse tank van oppervlaktewater, grondwater,
      hemelwater of drinkwater, waarin geen stoffen aanwezig zijn die de bodem kunnen verontreinigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.44
      [ref3]: https://wetten.overheid.nl/BWBR0005829
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel2
