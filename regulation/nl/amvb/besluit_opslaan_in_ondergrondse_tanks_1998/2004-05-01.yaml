  - number: '23'
    text: |-
      1 Degene die op 1 maart 1993 gasolie opslaat in een ondergrondse tank als bedoeld in
      [artikel 21, eerste lid][ref1], maakt, indien hij het opslaan uiterlijk op 1 maart 1996 beëindigt, binnen acht
      weken na die beëindiging de tank onklaar of verwijdert deze overeenkomstig [bijlage VI][ref2].

      2 De in het eerste lid bedoelde verplichting geldt niet, indien degene die het opslaan van gasolie heeft beëindigd:

      a. binnen acht weken na die beëindiging de desbetreffende ondergrondse tank weer in gebruik heeft genomen voor het
      opslaan van huishoudelijk afvalwater, vloeibare brandstof of afgewerkte olie, of

      b. op grond van een vergunning, verleend krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref3],
      bevoegd is in de desbetreffende ondergrondse tank een andere vloeistof op te slaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009747#Artikel21
