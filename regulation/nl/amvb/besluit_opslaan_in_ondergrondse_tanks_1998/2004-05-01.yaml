  - number: '3'
    text: |-
      1 Voor de toepassing van dit besluit en de daarop berustende bepalingen zijn, behoudens in gevallen als bedoeld
      in het tweede lid, burgemeester en wethouders van de gemeente waarin het opslaan geheel of in hoofdzaak heeft
      plaatsgevonden of plaatsvindt, het bevoegd gezag.

      2 In het geval op grond van [artikel 8.2 van de Wet milieubeheer][ref1] een ander orgaan bevoegd is of, indien de
      vergunningplicht niet was opgeheven, bevoegd zou zijn een vergunning voor de inrichting te verlenen, is dat orgaan
      ook in het kader van dit besluit het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#Artikel3
    references:
