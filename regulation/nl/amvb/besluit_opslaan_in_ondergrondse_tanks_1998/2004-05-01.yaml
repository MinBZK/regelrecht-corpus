preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 13 november 1998,
    nr. MJZ97570261 Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 6, 8, 10, 15, 16, eerste en tweede lid, 16a, 17, eerste en tweede lid, 70 en 71 van de Wet
    bodembescherming en, voor zover het betreft de artikelen 9 tot en met 14 en 21 tot en met 24 van dit besluit, gelet
    op de artikelen 8.40, 8.42, eerste lid, en 8.44 van de Wet milieubeheer;

    Gezien het advies van de Technische commissie bodembescherming (advies van 24 januari 1996);

    De Raad van State gehoord (advies van 16 maart 1998, nr. W08.97.0731);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 juni
    1998, nr. MJZ 98059352, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009747/2004-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *ondergrondse tank:*tank, daaronder niet begrepen een septic tank, van staal of van kunststof, die geheel of
      gedeeltelijk in de bodem is gelegen of is ingeterpt, met de daarbij behorende leidingen en appendages;

      *bestaande ondergrondse tank:*ondergrondse tank die is geïnstalleerd voor 1 maart 1993;

      *opslaan van een vloeistof in een ondergrondse tank:*bewaren van een vloeistof in een ondergrondse tank, vullen
      van een ondergrondse tank met vloeistof, uit een ondergrondse tank betrekken van vloeistof alsmede alle handelingen
      die met dat bewaren, vullen of betrekken in onmiddellijk verband staan, met dien verstande dat daaronder niet wordt
      begrepen de aflevering van motorbrandstoffen;

      *vloeibare brandstof:*lichte olie, halfzware olie of gasolie, als bedoeld in de [artikelen 26][ref1] en
      [28 van de Wet op de accijns][ref2], met dien verstande dat daaronder niet wordt begrepen LPG;

      *afgewerkte olie:*afgewerkte olie als bedoeld in het [Besluit inzamelen afvalstoffen][ref3];

      *procesvloeistof:*vloeistof die gebruikt wordt in een fysisch of chemisch proces waarbij geen verbranding van de
      vloeistof plaatsvindt;

      *huishoudelijk afvalwater:*vloeibare huishoudelijke afvalstoffen of vloeistoffen van daarmee vergelijkbare aard,
      waarvan het Biochemische Zuurstof Verbruik gedurende een aaneengesloten tijdvak van vijf dagen bij 20° C gemiddeld
      niet hoger is dan 1500 mg/liter;

      *inrichting:*inrichting die behoort tot een categorie van inrichtingen, die is aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4];

      *verkennend onderzoek:*onderzoek ter vaststelling van de kwaliteit van de bodem op een wijze als aangegeven:

        - in het protocol nulsituatie-bodemonderzoek Besluit opslaan in ondergrondse tanks, uitgave SDU uitgeverij, Den
      Haag 1995, dan wel
        - in een door Onze Minister aangewezen ander protocol of normalisatienorm van het Nederlands Normalisatie-instituut
      met betrekking tot dat onderwerp.

      *bijlage:*bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0016530
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
