  - number: '22'
    text: |-
      Degene die na 1 maart 1993 vloeibare brandstof of afgewerkte olie opslaat in een bestaande ondergrondse tank,
      voert, indien het een tank betreft als bedoeld in [artikel 21, eerste lid][ref1], uiterlijk 1 maart 1996, of,
      indien het een tank als bedoeld in [artikel 21, tweede lid][ref2], betreft, uiterlijk 1 maart 1995, een verkennend
      onderzoek uit naar de aanwezigheid van de opgeslagen vloeibare brandstof of afgewerkte olie in de bodem in
      de onmiddellijke nabijheid van de desbetreffende tank. [Artikel 12, tweede lid][ref3], is van overeenkomstige
      toepassing. Binnen vier weken nadat het onderzoek is verricht, wordt van de resultaten daarvan kennis gegeven aan
      het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0009747#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009747#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0009747#Artikel12
