        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
        paragraaf: '2'
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Coördinatiewet uitzonderingstoestanden.'
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel12
