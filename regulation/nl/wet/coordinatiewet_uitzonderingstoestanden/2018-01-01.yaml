preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ingevolge artikel 103 van de Grondwet bij de wet
    regels te stellen met betrekking tot uitzonderingstoestanden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan ter handhaving van de uitwendige of inwendige
      veiligheid, bij koninklijk besluit, op voordracht van Onze Minister-President, de beperkte noodtoestand of de
      algemene noodtoestand worden afgekondigd.

      2 Het begin van de beperkte noodtoestand en van de algemene noodtoestand wordt niet op een vroeger tijdstip gesteld
      dan dat waarop het koninklijk besluit, bedoeld in het eerste lid, op de daarin te bepalen wijze is bekendgemaakt.

      3 Het koninklijk besluit, bedoeld in het eerste lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel1
  - number: '2'
    text: |-
      Het koninklijk besluit waarbij hetzij de beperkte noodtoestand hetzij de algemene noodtoestand wordt afgekondigd,
      wordt terstond medegedeeld aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel2
  - number: '3'
    text: |-
      De beperkte noodtoestand en de algemene noodtoestand worden opgeheven:

      a. bij besluit van de Staten-Generaal in verenigde vergadering indien zij van oordeel zijn dat de beperkte
      noodtoestand of de algemene noodtoestand niet, of niet langer dan een bepaalde termijn, mag voortduren;

      b. bij koninklijk besluit op voordracht van Onze Minister-President, zodra de omstandigheden dit naar Ons oordeel
      toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel3
  - number: '4'
    text: |-
      De beperkte noodtoestand en de algemene noodtoestand eindigen van rechtswege bij de aanvang van de algemene
      noodtoestand, respectievelijk de beperkte noodtoestand.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het besluit, bedoeld in [artikel 3, onder a][ref1], wordt op de daarin te bepalen wijze bekendgemaakt op last van
      de voorzitter der verenigde vergadering en treedt terstond in werking.

      2 Door de zorg van Onze Minister van Justitie wordt het besluit, bedoeld in het eerste lid, in ieder geval
      geplaatst in het *Staatsblad*.

      3 Het koninklijk besluit, bedoeld in [artikel 3, onder b][ref2], wordt op de daarin te bepalen wijze bekendgemaakt
      en treedt terstond in werking.

      4 Het koninklijk besluit, bedoeld in het derde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel3
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '3'
        paragraaf: '1'
  - number: '6'
    text: |-
      Door opheffing of einde van de beperkte noodtoestand, respectievelijk de algemene noodtoestand eindigt van
      rechtswege de werking van de bepalingen die in werking zijn gesteld ingevolge het koninklijk besluit bedoeld in
      [artikel 7, eerste lid][ref1], respectievelijk [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 Indien de beperkte noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst A.

      2 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel7
  - number: '8'
    text: |-
      1 Indien de algemene noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst B.

      2 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel8
  - number: '9'
    text: |-
      Het koninklijk besluit waarbij gedurende een noodtoestand voor Nederland of een gedeelte daarvan bepalingen die
      voorkomen op de bij deze wet behorende lijsten A en B in werking dan wel buiten werking worden gesteld, wordt
      terstond medegedeeld aan de Staten-Generaal. Het treedt niet in werking dan nadat het op de daarin te bepalen wijze
      is bekendgemaakt. Het wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel9
  - number: 9a
    text: 'In deze paragraaf wordt verstaan onder openbare lichamen: de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel9a
  - number: 9b
    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen met inachtneming van het in deze paragraaf bepaalde.

      2 De bepalingen die voorkomen op de bij deze wet behorende [lijsten A][ref1] en [B][ref2] zijn van overeenkomstige
      toepassing in de openbare lichamen, voor zover deze bepalingen niet reeds van toepassing zijn in de openbare
      lichamen met dien verstande dat telkens in die bepalingen wordt gelezen voor:

      a. «burgemeester»: gezaghebber;

      b. «Onze Commissaris van de Koning», «Onze Commissaris in de provincie» en «Onze commissaris in de provincie»: de
      Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0007981
      [ref2]: https://wetten.overheid.nl/BWBR0007981
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007981
      - id: ref2
        bwb_id: BWBR0007981
  - number: 9c
    text: |-
      Indien ingevolge een koninklijk besluit als bedoeld in de [artikelen 7, eerste lis][ref1], of
      [8, eerste lid][ref2], voor de openbare lichamen gezamenlijk of ieder afzonderlijk één of meerdere bepalingen in
      werking worden gesteld, kunnen hiermee samenhangende in een koninklijk besluit aan te wijzen bepalingen bij dat
      besluit van overeenkomstige toepassing worden verklaard in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
        paragraaf: '2'
  - number: 9d
    text: |-
      Onze Minister wie het aangaat kan aan de gezaghebber of de Rijksvertegenwoordiger voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba mandaat verlenen tot het uitoefenen in de openbare lichamen van de bevoegdheden die
      zijn opgenomen in op grond van de [artikelen 7, eerste lid][ref1], of [8, eerste lid][ref2], in werking gestelde
      artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0007981/2018-01-01#Artikel9d
    references:
