$id: coordinatiewet_uitzonderingstoestanden
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2010-10-01'
bwb_id: BWBR0007981
url: https://wetten.overheid.nl/BWBR0007981/2010-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is ingevolge artikel 103 van de Grondwet bij de wet
    regels te stellen met betrekking tot uitzonderingstoestanden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Ingeval buitengewone omstandigheden dit noodzakelijk maken, kan ter handhaving van de uitwendige of inwendige
      veiligheid, bij koninklijk besluit, op voordracht van Onze Minister-President, de beperkte noodtoestand of de
      algemene noodtoestand worden afgekondigd.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel1
  - number: '1.2'
    text: |-
      Het begin van de beperkte noodtoestand en van de algemene noodtoestand wordt niet op een vroeger tijdstip gesteld
      dan dat waarop het koninklijk besluit, bedoeld in het eerste lid, op de daarin te bepalen wijze is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel1
  - number: '1.3'
    text: Het koninklijk besluit, bedoeld in het eerste lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel1
  - number: '2'
    text: |-
      Het koninklijk besluit waarbij hetzij de beperkte noodtoestand hetzij de algemene noodtoestand wordt afgekondigd,
      wordt terstond medegedeeld aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel2
  - number: '3'
    text: 'De beperkte noodtoestand en de algemene noodtoestand worden opgeheven:'
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel3
  - number: 3.a
    text: |-
      bij besluit van de Staten-Generaal in verenigde vergadering indien zij van oordeel zijn dat de beperkte
      noodtoestand of de algemene noodtoestand niet, of niet langer dan een bepaalde termijn, mag voortduren;
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel3
  - number: 3.b
    text: |-
      bij koninklijk besluit op voordracht van Onze Minister-President, zodra de omstandigheden dit naar Ons oordeel
      toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel3
  - number: '4'
    text: |-
      De beperkte noodtoestand en de algemene noodtoestand eindigen van rechtswege bij de aanvang van de algemene
      noodtoestand, respectievelijk de beperkte noodtoestand.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel4
  - number: '5.1'
    text: |-
      Het besluit, bedoeld in [artikel 3, onder a][ref1], wordt op de daarin te bepalen wijze bekendgemaakt op last van
      de voorzitter der verenigde vergadering en treedt terstond in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel3
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '3'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Door de zorg van Onze Minister van Justitie wordt het besluit, bedoeld in het eerste lid, in ieder geval geplaatst
      in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel5
  - number: '5.3'
    text: |-
      Het koninklijk besluit, bedoeld in [artikel 3, onder b][ref1], wordt op de daarin te bepalen wijze bekendgemaakt en
      treedt terstond in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel3
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '3'
        paragraaf: '1'
  - number: '5.4'
    text: Het koninklijk besluit, bedoeld in het derde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel5
  - number: '6'
    text: |-
      Door opheffing of einde van de beperkte noodtoestand, respectievelijk de algemene noodtoestand eindigt van
      rechtswege de werking van de bepalingen die in werking zijn gesteld ingevolge het koninklijk besluit bedoeld in
      [artikel 7, eerste lid][ref1], respectievelijk [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Indien de beperkte noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst A.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel7
  - number: '7.2'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de algemene noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst B.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel8
  - number: '8.2'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel8
  - number: '9'
    text: |-
      Het koninklijk besluit waarbij gedurende een noodtoestand voor Nederland of een gedeelte daarvan bepalingen die
      voorkomen op de bij deze wet behorende lijsten A en B in werking dan wel buiten werking worden gesteld, wordt
      terstond medegedeeld aan de Staten-Generaal. Het treedt niet in werking dan nadat het op de daarin te bepalen wijze
      is bekendgemaakt. Het wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel9
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Coördinatiewet uitzonderingstoestanden.'
    url: https://wetten.overheid.nl/BWBR0007981/2010-10-01#Artikel12
