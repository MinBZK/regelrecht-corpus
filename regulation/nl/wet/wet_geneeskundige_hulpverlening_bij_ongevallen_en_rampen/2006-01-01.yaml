        paragraaf: '2'
  - number: '2'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de geneeskundige hulpverlening en de voorbereiding
      daarop. Het college draagt in het bijzonder zorg voor de totstandkoming van afspraken, die nodig zijn voor een
      doelmatige geneeskundige hulpverlening.
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel2
  - number: '3'
    text: |-
      De colleges van burgemeester en wethouders van de gemeenten die op grond van de verdeling, bedoeld in
      [artikel 3, eerste lid, van de Brandweerwet 1985][ref1], behoren tot één regio, treffen een gemeenschappelijke
      regeling inzake de geneeskundige hulpverlening en de voorbereiding daarop teneinde een doelmatige en gecoördineerde
      geneeskundige hulpverlening te bewerkstelligen.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel3
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '3'
  - number: '4'
    text: |-
      1 Bij de regeling, bedoeld in [artikel 3][ref1], wordt een openbaar lichaam ingesteld. Het openbaar lichaam is
      rechtspersoon. Bij deze regeling worden door de deelnemende gemeenten aan het bestuur van het openbaar lichaam in
      elk geval de volgende taken opgedragen:

      a. het instellen en in stand houden van een centrale post voor het ambulancevervoer;

      b. het vaststellen van de taken van de binnen het grondgebied van de aan de regeling deelnemende gemeenten werkzame
      gezondheidsdiensten in het kader van de geneeskundige hulpverlening en de realisering daarvan;

      c. het instellen en in stand houden van een organisatorisch samenwerkingsverband gericht op geneeskundige
      hulpverlening;

      d. het zorgdragen voor onderlinge bijstand bij de uitvoering van de geneeskundige hulpverlening;

      e. het benoemen, schorsen en ontslaan van de regionaal geneeskundig functionaris;

      f. het vaststellen van een organisatieplan als bedoeld in [artikel 6][ref2].

      2 De regeling bevat bepalingen omtrent de inzet van het samenwerkingsverband, bedoeld in het vorige lid, onder c.

      3 De besturen van de ziekenhuizen, de vergunninghouders voor ambulancevervoer, de
      gemeentelijke gezondheidsdiensten, de regionale brandweer en het regionale college, bedoeld in
      [artikel 22 van de Politiewet 1993][ref3], die werkzaam zijn binnen het grondgebied van de aan een regeling
      deelnemende gemeenten, worden omtrent het ontwerp van de regeling gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel22
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005276
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '22'
  - number: '5'
    text: |-
      1 De regionaal geneeskundig functionaris, bedoeld in [artikel 4, eerste lid, onderdeel e][ref1], is belast met de
      operationele leiding over de geneeskundige hulpverlening.

      2 De regionaal geneeskundig functionaris coördineert de voorbereiding van de spoedeisende medische hulpverlening op
      de geneeskundige hulpverlening en stemt de maatregelen ter voorbereiding van de geneeskundige hulpverlening af op
      de maatregelen van de andere bij de rampenbestrijding betrokken disciplines.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 Het openbaar lichaam, bedoeld in [artikel 3][ref1], stelt ingevolge [artikel 4, eerste lid, onderdeel f][ref2],
      in overeenstemming met de besturen van de ziekenhuizen en van de vergunninghouders voor ambulancevervoer, ten
      minste één maal per vier jaren een organisatieplan vast. Het organisatieplan bevat de operationele prestaties
      van de bij de geneeskundige hulpverlening betrokken diensten, instellingen en organisaties, die nodig zijn om
      uitvoering te geven aan het beheersplan, bedoeld in [artikel 5 van de Wet rampen en zware ongevallen][ref3]

      2 Het organisatieplan wordt tussentijds geactualiseerd, indien gewijzigde omstandigheden daartoe aanleiding geven.

      3 Het plan bevat in ieder geval:

      a. de taken van de geneeskundige hulpverleningsdiensten en de maatregelen gericht op realisering daarvan;

      b. de werkwijzen van de geneeskundige hulpverleningsdiensten en de maatregelen gericht op realisering daarvan;

      c. de personeels- en materieelsterkte van de geneeskundige hulpverleningsdiensten en de maatregelen gericht op de
      realisering daarvan;

      d. het opleidingsniveau en de geoefendheid van het personeel van de geneeskundige hulpverleningsdiensten en de
      maatregelen gericht op de realisering daarvan.

      4 Het organisatieplan en de wijzigingen daarop worden toegezonden aan het regionale college, bedoeld
      in [artikel 22 van de Politiewet 1993][ref4], aan het bestuur van de regionale brandweer, bedoeld in
      [artikel 4 van de Brandweerwet 1985][ref5], en aan de commissaris van de Koning.

      5 Bij algemene maatregel van bestuur kunnen nadere eisen worden gesteld ten aanzien van de inhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003765#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006299#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0003764#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel6
