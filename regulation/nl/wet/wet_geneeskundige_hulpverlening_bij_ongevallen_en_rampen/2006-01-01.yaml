        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005276
        artikel: '12'
        paragraaf: '3'
  - number: '25'
    text: |-
      Met het toezicht op de naleving van de eisen, bedoeld in de [artikelen 8][ref1] en [9][ref2], zijn belast
      de hoofdinspecteur, de inspecteurs en de onder hun bevelen werkzame ambtenaren van de Inspectie voor de
      Gezondheidszorg.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel9
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel25
