  - number: '7'
    text: |-
      De op grond van [artikel 8 van de Wet op bijzondere medische verrichtingen][ref1] aangewezen traumacentra, de
      overige ziekenhuizen en de centrale posten voor het ambulancevervoer treffen de nodige maatregelen met het oog op
      de voorbereiding van hun optreden in het kader van de geneeskundige hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel8
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '8'
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een doelmatige geneeskundige hulpverlening eisen worden
      gesteld waaraan het in [artikel 4, eerste lid, onder c][ref1], bedoelde organisatorische samenwerkingsverband moet
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
        paragraaf: '2'
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen uit
      een oogpunt van volksgezondheid noodzakelijke eisen worden vastgesteld, waaraan gemeentelijke gezondheidsdiensten,
      ziekenhuizen en centrale posten voor het ambulancevervoer bij de voorbereiding en de uitvoering van de
      geneeskundige hulpverlening moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel9
  - number: '17'
    text: |-
      1 Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees
      voor het ontstaan daarvan bijstand van een organisatorisch samenwerkingsverband als bedoeld in
      [artikel 4, eerste lid, onder c][ref1], waarin niet kan worden voorzien door de gemeenschappelijke regeling waaraan
      de gemeente deelneemt, dan richt hij een verzoek daartoe aan de commissaris van de Koning.

      2 De commissaris van de Koning beslist op het verzoek en treft de nodige voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
        paragraaf: '2'
  - number: '18'
    text: |-
      1 Behoeft een burgemeester in geval van een ramp of een zwaar ongeval of van ernstige vrees voor het ontstaan
      daarvan bijstand van een organisatorisch samenwerkingsverband als bedoeld in [artikel 4, eerste lid, onder c][ref1]
      van buiten de provincie, dan richt hij een verzoek daartoe aan de commissaris van de Koning die zich ter zake wendt
      tot Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties beslist op het verzoek. De betrokken commissarissen
      van de Koning treffen de nodige voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Tot vergoeding van de kosten die voor gemeentelijke gezondheidsdiensten, organisatorische verbanden als bedoeld
      in [artikel 4, eerste lid, onder c][ref1], ziekenhuizen en centrale posten voor het ambulancevervoer voortvloeien
      uit de organisatie en uitvoering van de geneeskundige hulpverlening in geval van buitengewone omstandigheden
      alsmede uit de voorbereiding daarop, wordt door het Rijk aan de besturen van de gemeenschappelijke regelingen,
      bedoeld in [artikel 3][ref2], een bijdrage verstrekt.

      2 Bij algemene maatregel van bestuur op voordracht van Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties
      en van Volksgezondheid, Welzijn en Sport worden regels gesteld over het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel3
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005276
        artikel: '3'
        paragraaf: '2'
  - number: '24'
    text: |-
      De voordracht tot een algemene maatregel van bestuur, bedoeld in de [artikelen 9][ref1] en [12, eerste lid][ref2],
      wordt gedaan na overleg met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel12
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel24
    references:
