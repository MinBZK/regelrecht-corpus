        artikel: '9'
        paragraaf: '2'
  - number: '27'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel27
  - number: '28'
    text: 'Deze wet kan worden aangehaald als: Wet geneeskundige hulpverlening bij ongevallen en rampen.'
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel28
