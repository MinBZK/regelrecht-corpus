preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de totstandkoming van de nieuwe
    rampenbestrijdingsorganisatie wenselijk is een regeling te treffen met betrekking tot de organisatie en uitvoering
    van de geneeskundige hulpverlening bij rampen alsmede de voorbereiding daarop;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Ministers: Onze Ministers van Binnenlandse Zaken en Koninkrijksrelaties en van Volksgezondheid, Welzijn
      en Sport;

      b. geneeskundige hulpverlening: het organiseren van de hulpverleningsactiviteiten op het gebied van de somatische
      en psychosociale zorg en de preventieve en openbare gezondheidszorg naar aanleiding van een zwaar ongeval of een
      ramp als bedoeld in [artikel 1, onderdeel b, van de Wet rampen en zware ongevallen][ref1], de gewondenzorg door
      militairen daaronder niet begrepen;

      c. spoedeisende medische hulpverlening: de medische hulpverlening naar aanleiding van een gebeurtenis, letsel ten
      gevolge hebbend, waarvoor de centrale post voor het ambulancevervoer opdracht heeft gegeven tot ambulancevervoer en
      waarvoor een gecoördineerde inzet van diensten en organisaties van verschillende disciplines is vereist;

      d. centrale post voor het ambulancevervoer: een centrale post als bedoeld in [artikel 4, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0005276/2006-01-01#Artikel1
    references:
      - id: ref1
