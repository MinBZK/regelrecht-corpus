preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot het toezicht op de
    naleving van Europese regelgeving door publieke entiteiten en deze in één wet op te nemen met bestaande bepalingen
    over het toezicht op de besteding van subsidies die ten laste komen van de begroting van de Europese Unie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt, tenzij anders bepaald, verstaan onder: - *nutsrichtlijn:* richtlijn 2014/25/EU van het Europees
      Parlement en de Raad van 26 februari 2014 betreffende het plaatsen van opdrachten in de sectoren water- en
      energievoorziening, vervoer en postdiensten en houdende intrekking van Richtlijn 2004/17/EG (PbEU 2014, L 94);
        - *aanbestedingsrichtlijn:* richtlijn 2014/24/EU van het Europees Parlement en de Raad van 26 februari 2014
      betreffende het plaatsen van overheidsopdrachten en tot intrekking van Richtlijn 2004/18/EG (PbEU 2014, L 94);
        - *concessierichtlijn:* richtlijn 2014/23/EU van het Europees Parlement en de Raad van 26 februari 2014 betreffende
      het plaatsen van concessieovereenkomsten (PbEU 2014, L 94);
        - *publieke entiteit:* 1°. een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref1], niet zijnde een van Onze Ministers; 2°. een
      overige aanbestedende dienst als bedoeld in artikel 2, eerste lid, van de aanbestedingsrichtlijn, niet zijnde
      de staat; 3°. een overige aanbestedende instantie als bedoeld in artikel 4, eerste lid, van de nutsrichtlijn en
      artikel 7, eerste lid, van de concessierichtlijn, niet zijnde de staat; 4°. een instantie die een opdracht als
      bedoeld in artikel 13 van de aanbestedingsrichtlijn plaatst;
        - *Onze Minister:* Onze Minister wie het aangaat;
        - *Europese verdragen:* het Verdrag betreffende de werking van de Europese Unie, het Verdrag tot oprichting van de
      Europese Gemeenschap voor Atoomenergie of het Verdrag betreffende de Europese Unie;
        - *Europese subsidie:* een aanspraak op financiële middelen van de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Europese Commissie die rechtstreeks of middellijk bestaat op grond van
      een vastgesteld programma, een verordening, een richtlijn, een beschikking of een besluit, voor zover uit deze
      aanspraak verplichtingen voortvloeien welke bij of krachtens de Europese verdragen op Nederland rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '2.1'
    text: |-
      Indien een publieke entiteit niet of niet naar behoren voldoet aan een voor haar geldende rechtsplicht die
      voortvloeit uit een bij of krachtens de Europese verdragen op Nederland rustende verplichting, niet zijnde een
      rechtsplicht die behoort tot de in [artikel 3][ref1] bedoelde verplichtingen, dan kan Onze Minister de publieke
      entiteit een aanwijzing geven om, binnen een in die aanwijzing te vermelden termijn, alsnog aan die rechtsplicht
      te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '2.2'
    text: 'Een aanwijzing wordt gegeven:'
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel2
  - number: 2.2.a
    text: |-
      in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten aanzien van provincies,
      gemeenten en gemeenschappelijke regelingen waaraan zij deelnemen;
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel2
  - number: 2.2.b
    text: |-
      in overeenstemming met Onze Minister van Verkeer en Waterstaat ten aanzien van waterschappen en gemeenschappelijke
      regelingen waaraan uitsluitend waterschappen deelnemen.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel2
  - number: '2.3'
    text: Een aanwijzing wordt niet gegeven ten aanzien van de uitoefening van rechtspraak.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel2
  - number: '2.4'
    text: |-
      Dit artikel is niet van toepassing op bestuursorganen van provincies, gemeenten en
      gemeenschappelijke regelingen waaraan zij deelnemen, indien de bevoegdheden van [artikel 121][ref1]
      en [hoofdstuk XVIII van de Provinciewet][ref2], van de [artikelen 124][ref3] en [124a][ref4] en
      [hoofdstuk XVII van de Gemeentewet][ref5] en van de [artikelen 32b][ref6], [32c][ref7], [36 tot en met 39f][ref8],
      [45a][ref9], [49][ref10], [56a][ref11], [60][ref12], [65a, eerste lid][ref13], [69, eerste lid][ref14],
      [78a, eerste en tweede lid][ref15], [82, eerste en tweede lid][ref16], [88a, eerste lid][ref17] en
      [92, eerste lid van de Wet gemeenschappelijke regelingen][ref18] toereikend zijn om het niet of niet naar behoren
      voldoen als bedoeld in het eerste lid te herstellen.


