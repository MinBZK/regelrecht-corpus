  - number: '3'
    text: |-
      Indien een publieke entiteit verzuimt te voldoen aan een voor haar geldende rechtsplicht die voortvloeit uit
      een bij of krachtens de Europese verdragen op Nederland rustende verplichting ten aanzien van de rechtmatige en
      doelmatige besteding van een Europese subsidie of ten aanzien van de wijze van beheer, controle of toezicht met
      betrekking tot een Europese subsidie, of indien een dergelijk verzuim dreigt te ontstaan, kan Onze Minister die
      verantwoordelijk is voor het beleidsterrein ten aanzien waarvan de subsidie is verstrekt de publieke entiteit
      een aanwijzing geven omtrent de rechtmatige en doelmatige aanwending van een door die publieke entiteit ontvangen
      Europese subsidie of de wijze van beheer, controle of toezicht met betrekking tot die subsidie. In de aanwijzing
      wordt de termijn vermeld waarbinnen de aanwijzing moet worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel3
  - number: '4.1'
    text: Een aanwijzing wordt niet gegeven dan nadat aan de publieke entiteit gelegenheid tot overleg is geboden.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel4
  - number: '4.2'
    text: |-
      Een aanwijzing wordt, behoudens in spoedeisende gevallen, niet eerder gegeven dan nadat de publieke entiteit in
      de gelegenheid is gesteld om binnen een door Onze Minister in overeenstemming met Onze andere betrokken Minister
      gestelde termijn de verplichting, bedoeld in [artikel 2][ref1] of [3][ref2], alsnog na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '4.3'
    text: De motivering van de aanwijzing verwijst naar hetgeen in het overleg aan de orde is gekomen.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel4
  - number: '4.4'
    text: Van de aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel4
  - number: '5'
    text: |-
      Indien de in de aanwijzing vermelde termijn verstrijkt zonder dat de aanwijzing is opgevolgd, kan Onze Minister
      die de aanwijzing heeft gegeven er, namens en op kosten van de publieke entiteit, zowel door het verrichten van
      publiekrechtelijke of privaatrechtelijke rechtshandelingen als door het verrichten van feitelijke handelingen
      in voorzien dat alsnog wordt voldaan aan de rechtsplicht in verband waarmee de aanwijzing, bedoeld in
      [artikel 2][ref1], is gegeven of dat alsnog het verzuim, bedoeld in [artikel 3][ref2], wordt hersteld of voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '7.1'
    text: |-
      Als Nederland door een instelling van de Europese Unie, de Europese Investeringsbank of een andere lidstaat van
      de Europese Unie aansprakelijk wordt gesteld voor het niet nakomen van bij of krachtens de Europese verdragen
      opgelegde verplichtingen en als dit leidt tot een vordering op de staat in de vorm van een verplichting tot een of
      meer van de navolgende betalingen, kan Onze Minister besluiten deze bedragen te verhalen op een publieke entiteit,
      voor zover de aansprakelijkheid van Nederland het gevolg is van een verzuim van de betreffende publieke entiteit:
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: 7.1.a
    text: de betaling van een forfaitaire som;
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: 7.1.b
    text: de betaling van een dwangsom;
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: 7.1.c
    text: |-
      de terugbetaling van een aan de betrokken publieke entiteit verstrekte Europese subsidie vermeerderd met de
      eventueel daarover berekende rente.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een besluit tot verhaal wordt niet genomen dan nadat aan de betreffende publieke entiteit gelegenheid tot overleg
      is geboden.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: '7.3'
    text: Onze Minister kan het bedrag van het verhaal invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: '7.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing als de aansprakelijkstelling, bedoeld in het eerste lid, leidt tot
      het niet vergoeden van door Nederland gedane uitgaven die mede worden gefinancierd uit Europese middelen of leidt
      tot verlaging van die middelen.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel7
  - number: '8'
    text: |-
      Een wijziging van de nutsrichtlijn, de aanbestedingsrichtlijn of de concessierichtlijn gaat voor de toepassing van
      deze wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel8
  - number: '11'
    text: |-
      De [Wet toezicht Europese subsidies][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013352
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013352
  - number: '12'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet Naleving Europese regelgeving publieke entiteiten.'
    url: https://wetten.overheid.nl/BWBR0031640/2016-07-01#Artikel13
