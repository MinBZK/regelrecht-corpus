preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen met betrekking tot het toezicht op de
    naleving van Europese regelgeving door publieke entiteiten en deze in één wet op te nemen met bestaande bepalingen
    over het toezicht op de besteding van subsidies die ten laste komen van de begroting van de Europese Unie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt, tenzij anders bepaald, verstaan onder: - *nutsrichtlijn:* [richtlijn nr. 2004/17/EG](32004L0017)
      van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004 houdende coördinatie van de procedures
      voor het plaatsen van opdrachten in de sectoren water- en energievoorziening, vervoer en postdiensten (PbEG L 134);
        - *aanbestedingsrichtlijn:* [richtlijn nr. 2004/18/EG](32004L0018) van het Europees Parlement en de Raad
      van de Europese Unie van 31 maart 2004 betreffende de coördinatie van de procedures voor het plaatsen van
      overheidsopdrachten voor werken, leveringen en diensten (PbEG L 134);
        - *publieke entiteit:* 1°. een bestuursorgaan als bedoeld in
      [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref1], niet zijnde een van Onze Ministers; 2°. een
      overige aanbestedende dienst als bedoeld in artikel 1, negende lid, van de aanbestedingsrichtlijn en artikel
      2, eerste lid, onderdeel a, van de nutsrichtlijn, niet zijnde de staat; 3°. een overheidsbedrijf als bedoeld in
      artikel 2, eerste lid, onderdeel b, van de nutsrichtlijn; 4°. een bedrijf of instelling waaraan een bijzonder of
      uitsluitend recht verleend is als bedoeld in artikel 2, tweede lid, onderdeel b, van de nutsrichtlijn; 5°. een
      instantie die een opdracht als bedoeld in artikel 8 van de aanbestedingsrichtlijn plaatst; 6°. een overige houder
      van een concessie als bedoeld in artikel 63, eerste lid, van de aanbestedingsrichtlijn;
        - *Onze Minister:* Onze Minister wie het aangaat;
        - *Europese verdragen:* het Verdrag betreffende de werking van de Europese Unie, het Verdrag tot oprichting van de
      Europese Gemeenschap voor Atoomenergie of het Verdrag betreffende de Europese Unie;
        - *Europese subsidie:* een aanspraak op financiële middelen van de Raad van de Europese Unie, het Europees
      Parlement en de Raad gezamenlijk of de Europese Commissie die rechtstreeks of middellijk bestaat op grond van
      een vastgesteld programma, een verordening, een richtlijn, een beschikking of een besluit, voor zover uit deze
      aanspraak verplichtingen voortvloeien welke bij of krachtens de Europese verdragen op Nederland rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '2.1'
    text: |-
      Indien een publieke entiteit niet of niet naar behoren voldoet aan een voor haar geldende rechtsplicht die
      voortvloeit uit een bij of krachtens de Europese verdragen op Nederland rustende verplichting, niet zijnde een
      rechtsplicht die behoort tot de in [artikel 3][ref1] bedoelde verplichtingen, dan kan Onze Minister de publieke
      entiteit een aanwijzing geven om, binnen een in die aanwijzing te vermelden termijn, alsnog aan die rechtsplicht
      te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '2.2'
    text: 'Een aanwijzing wordt gegeven:'
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
  - number: 2.2.a
    text: |-
      in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ten aanzien van provincies,
      gemeenten en gemeenschappelijke regelingen waaraan zij deelnemen;
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
  - number: 2.2.b
    text: |-
      in overeenstemming met Onze Minister van Verkeer en Waterstaat ten aanzien van waterschappen en gemeenschappelijke
      regelingen waaraan uitsluitend waterschappen deelnemen.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
  - number: '2.3'
    text: Een aanwijzing wordt niet gegeven ten aanzien van de uitoefening van rechtspraak.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      Dit artikel is niet van toepassing op bestuursorganen van provincies, gemeenten en gemeenschappelijke regelingen
      waaraan zij deelnemen, indien de bevoegdheden van [artikel 121][ref1] en [hoofdstuk XVIII van de Provinciewet][ref2]
      en van de [artikelen 124][ref3] en [124a][ref4] en [hoofdstuk XVII van de Gemeentewet][ref5] toereikend zijn om het
      niet of niet naar behoren voldoen als bedoeld in het eerste lid te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0005645#HoofdstukXVIII
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel124a
      [ref5]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXVII
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '121'
      - id: ref2
        bwb_id: BWBR0005645
        hoofdstuk: XVIII
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: 124a
      - id: ref5
        bwb_id: BWBR0005416
        hoofdstuk: XVII
  - number: '3'
    text: |-
      Indien een publieke entiteit verzuimt te voldoen aan een voor haar geldende rechtsplicht die voortvloeit uit
      een bij of krachtens de Europese verdragen op Nederland rustende verplichting ten aanzien van de rechtmatige en
      doelmatige besteding van een Europese subsidie of ten aanzien van de wijze van beheer, controle of toezicht met
      betrekking tot een Europese subsidie, of indien een dergelijk verzuim dreigt te ontstaan, kan Onze Minister die
      verantwoordelijk is voor het beleidsterrein ten aanzien waarvan de subsidie is verstrekt de publieke entiteit
      een aanwijzing geven omtrent de rechtmatige en doelmatige aanwending van een door die publieke entiteit ontvangen
      Europese subsidie of de wijze van beheer, controle of toezicht met betrekking tot die subsidie. In de aanwijzing
      wordt de termijn vermeld waarbinnen de aanwijzing moet worden opgevolgd.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel3
  - number: '4.1'
    text: Een aanwijzing wordt niet gegeven dan nadat aan de publieke entiteit gelegenheid tot overleg is geboden.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een aanwijzing wordt, behoudens in spoedeisende gevallen, niet eerder gegeven dan nadat de publieke entiteit in
      de gelegenheid is gesteld om binnen een door Onze Minister in overeenstemming met Onze andere betrokken Minister
      gestelde termijn de verplichting, bedoeld in [artikel 2][ref1] of [3][ref2], alsnog na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '4.3'
    text: De motivering van de aanwijzing verwijst naar hetgeen in het overleg aan de orde is gekomen.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel4
  - number: '4.4'
    text: Van de aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel4
  - number: '5'
    text: |-
      Indien de in de aanwijzing vermelde termijn verstrijkt zonder dat de aanwijzing is opgevolgd, kan Onze Minister
      die de aanwijzing heeft gegeven er, namens en op kosten van de publieke entiteit, zowel door het verrichten van
      publiekrechtelijke of privaatrechtelijke rechtshandelingen als door het verrichten van feitelijke handelingen
      in voorzien dat alsnog wordt voldaan aan de rechtsplicht in verband waarmee de aanwijzing, bedoeld in
      [artikel 2][ref1], is gegeven of dat alsnog het verzuim, bedoeld in [artikel 3][ref2], wordt hersteld of voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031640#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031640#Artikel3
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0031640
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0031640
        artikel: '3'
  - number: '7.1'
    text: |-
      Als Nederland door een instelling van de Europese Unie, de Europese Investeringsbank of een andere lidstaat van
      de Europese Unie aansprakelijk wordt gesteld voor het niet nakomen van bij of krachtens de Europese verdragen
      opgelegde verplichtingen en als dit leidt tot een vordering op de staat in de vorm van een verplichting tot een of
      meer van de navolgende betalingen, kan Onze Minister besluiten deze bedragen te verhalen op een publieke entiteit,
      voor zover de aansprakelijkheid van Nederland het gevolg is van een verzuim van de betreffende publieke entiteit:
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: 7.1.a
    text: de betaling van een forfaitaire som;
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: 7.1.b
    text: de betaling van een dwangsom;
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de terugbetaling van een aan de betrokken publieke entiteit verstrekte Europese subsidie vermeerderd met de
      eventueel daarover berekende rente.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een besluit tot verhaal wordt niet genomen dan nadat aan de betreffende publieke entiteit gelegenheid tot overleg
      is geboden.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: '7.3'
    text: Onze Minister kan het bedrag van het verhaal invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: '7.4'
    text: |-
      Dit artikel is van overeenkomstige toepassing als de aansprakelijkstelling, bedoeld in het eerste lid, leidt tot
      het niet vergoeden van door Nederland gedane uitgaven die mede worden gefinancierd uit Europese middelen of leidt
      tot verlaging van die middelen.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel7
  - number: '8'
    text: |-
      Een wijziging van de nutsrichtlijn of de aanbestedingsrichtlijn gaat voor de toepassing van deze wet gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel8
  - number: '11'
    text: |-
      De [Wet toezicht Europese subsidies][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013352
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013352
  - number: '12'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Wet Naleving Europese regelgeving publieke entiteiten.'
    url: https://wetten.overheid.nl/BWBR0031640/2013-01-01#Artikel13
