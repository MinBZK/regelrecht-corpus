  - number: '2'
    text: |-
      1 De ondernemer meldt onverwijld elke verhoogde sterfte van AI-gevoelige dieren van meer dan 3% per week aan het
      Landelijk LNV dierziekten meldnummer.

      2 De ondernemer consulteert een dierenarts indien bij AI-gevoelige dieren een klinisch probleem zichtbaar is of
      indien er een reductie van voer- of drinkwateropname is van meer dan 20%.

      3 Indien er geen sprake is van aviaire influenza of new castle disease doet de dierenarts binnen acht uur melding
      van de klacht en het klinische probleem van de desbetreffende dieren en van de naam- en adresgegevens van het
      bedrijf aan de Gezondheidsdienst voor Dieren.
    url: https://wetten.overheid.nl/BWBR0014789/2004-02-15#Artikel2
  - number: '3'
    text: |-
      1 In het kader van het Monitoringsprogramma Aviaire Influenza 2003 nemen de personen die bedrijfsmatig kippen,
      kalkoenen en eenden houden, op instructie van de Gezondheidsdienst voor dieren, bloed af bij deze dieren, ten einde
      dat in laboratoria te laten onderzoeken op Aviaire Influenza.

      2 Van het verbod tot het verrichten van operaties, bedoeld in
      [artikel 7, eerste lid, van de Wet op de uitoefening van de diergeneeskunde 1990][ref1], wordt vrijstelling
      verleend aan personen die bedrijfsmatig kalkoenen en eenden houden met betrekking tot het afnemen van bloed bij
      deze dieren in het kader van het Monitoringsprogramma Aviaire Influenza 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel7
    url: https://wetten.overheid.nl/BWBR0014789/2004-02-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '7'
  - number: 3a
    text: |-
      1 Ter uitvoering van de [artikelen 17][ref1], [18][ref2] en [30 van de Gezondheids- en welzijnwet voor dieren][ref3]
      wordt medewerking gevorderd van het bestuur van het Productschap Pluimvee en Eieren.

      2 De in het eerste lid bedoelde medewerking bestaat uit het verrichten van de noodzakelijke werkzaamheden, het
      aanwijzen van laboratoria en het bij verordening stellen van regels, inzake het laten afnemen van bloed bij
      pluimvee teneinde dit te laten onderzoeken op de aanwezigheid van AI.

      3 De minister kan met betrekking tot het verlenen van de in het eerste lid bedoelde medewerking beleidsregels
      stellen.


