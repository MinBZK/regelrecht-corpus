preamble:
  text: |-
    Gelet op Richtlijn 92/40/EEG van de Raad van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van
    communautaire maatregelen voor de bestrijding van aviaire influenza (PbEG L 167);

    Gelet op artikel 10, eerste lid, van Richtlijn nr. 90/425/EEG van de Raad van de Europese Gemeenschappen van 28
    juni 1990 inzake veterinaire en zoötechnische controles in het intracommunautair handelsverkeer in bepaalde levende
    dieren en producten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224);

    Gelet op de artikelen 17, eerste lid, 18, eerste lid 30, eerste lid, artikel 31 en 107, eerste lid, van de
    Gezondheids- en welzijnswet voor dieren;

    Gelet op artikel 7, tweede en derde lid, Wet op de uitoefening van de diergeneeskunde 1990;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014789/2004-02-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. AI: Aviaire Influenza;

      b. AI-gevoelige dieren: gehouden dieren van een soort behorende tot de orde van de hoenderachtigen (*Galliformes*),
      tot de familie van de eenden, ganzen en zwanen (*Anatidae*), tot de families van de struisvogels (*Struthionidae*),
      emoes (*Dromaiidae*) en nandoes (*Rheidae*) en voor consumptie gehouden duiven (*Columbia livia*);

      c. minister: Minister van Landbouw, Natuur en Voedselkwaliteit.

      2 Het is verboden, onverminderd de [artikelen 19][ref1] en
      [100 van de Gezondheids- en welzijnswet voor dieren][ref2], AI-gevoelige dieren op een bedrijf te houden, tenzij
      wordt voldaan aan [artikel 2][ref3] en [artikel 3, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0014789#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0014789#Artikel3
    url: https://wetten.overheid.nl/BWBR0014789/2004-02-15#Artikel1
