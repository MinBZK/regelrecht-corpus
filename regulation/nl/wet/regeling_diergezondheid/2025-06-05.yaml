  - number: '2.3'
    text: |-
      Als regio als bedoeld in artikel 21 van verordening (EU) nr. 2020/990 wordt aangewezen het grondgebied van
      Nederland.
    url: https://wetten.overheid.nl/BWBR0045053/2025-06-05#Artikel2.3
  - number: '2.4'
    text: |-
      1 Als dierziekte als bedoeld in [artikel 1.30, eerste lid, onderdeel b, van het Besluit houders van dieren][ref1]
      wordt aangewezen hoog pathogene aviaire influenza bij gehouden of in het wild levende zoogdieren met uitzondering
      van runderen en varkens.

      2 Aan eenieder wordt vrijstelling verleend van de verplichting van melding, bedoeld in
      [artikel 1.30, eerste lid, aanhef en onderdeel b, van het Besluit houders van dieren][ref2] van de in het eerste
      lid aangewezen dierziekte voor zover sprake is van een vermoeden van besmetting.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.30
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1.30
