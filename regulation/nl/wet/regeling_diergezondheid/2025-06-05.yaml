articles:
  - number: 1.1.1
    text: |-
      In deze regeling wordt verstaan onder: - *besluit:* [Besluit diergezondheid][ref1];
        - *verordening (EU) nr. 999/2001:* [verordening (EG) nr. 999/2001](32001R0999) van het Europees parlement en
      de Raad van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van
      bepaalde overdraagbare spongiforme encefalopathieën (PbEU 2001, L 147);
        - *verordening (EU) nr. 2018/1882:* uitvoeringsverordening (EU) 2018/1882 van de Commissie van 3 december 2018
      betreffende de toepassing, op de categorieën in de lijst opgenomen ziekten, van bepaalde regels voor de preventie
      en bestrijding van ziekten en tot vaststelling van een lijst van soorten en groepen soorten die een aanzienlijk
      risico vormen in verband met de verspreiding van die ziekten (PbEU 2018, L 308);
        - *verordening (EU) nr. 2019/2035:* gedelegeerde verordening (EU) 2019/2035 van de Commissie van 28 juni 2019 tot
      aanvulling van Verordening (EU) 2016/429 van het Europees parlement en de Raad wat betreft regels voor inrichtingen
      waar landdieren worden gehouden en broederijen, alsmede voor de traceerbaarheid van bepaalde gehouden landdieren en
      broedeieren (PbEU 2019, L 314);
        - *verordening (EU) nr. 2020/990:* gedelegeerde verordening (EU) 2020/990 van de commissie van 28 april 2020 tot
      aanvulling van Verordening (EU) 2016/429 van het Europees parlement en de Raad wat betreft de diergezondheids- en
      certificeringsvoorschriften voor verplaatsingen binnen de Unie van waterdieren en producten van dierlijke oorsprong
      van waterdieren (PbEU 2020, L 221).


      [ref1]: https://wetten.overheid.nl/BWBR0045039
    url: https://wetten.overheid.nl/BWBR0045053/2025-06-05#Artikel1.1
