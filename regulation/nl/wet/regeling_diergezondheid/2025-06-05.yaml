        artikel: '9.18'
  - number: '4.2'
    text: |-
      1 De vergoeding, bedoeld in [artikel 9.12, eerste lid, van de wet][ref1], omvat, voor zover deze kosten niet uit
      andere hoofde worden vergoed, de kosten voor:

      a. diervoeders;

      b. bodembedekking;

      c. diergeneesmiddelen;

      d. de diensten van een dierenarts, voor zover die kosten betrekking hebben op het verlenen van zorg die volgens de
      dierenarts noodzakelijk wordt geacht; of

      e. de diensten van een ander dan een dierenarts, voor zover die kosten betrekking hebben op diensten die volgens de
      dierenarts noodzakelijk zijn met het oog op het dierenwelzijn.

      2 Ingeval toepassing wordt gegeven aan het bepaalde in [artikel 9.12, eerste lid, van de wet][ref2], kan de houder,
      bedoeld in dat artikel, binnen de periode van een maand nadat de mededeling dat een maatregel als bedoeld in
      [hoofdstuk 5, paragraaf 2, van de wet][ref3] wordt toegepast, een aanvraag indienen voor de vergoeding, bedoeld in
      het eerste lid, met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.

      3 De aanvraag voor de vergoeding, bedoeld in het eerste lid, bevat in ieder geval:

      a. de volgende gegevens ter identificatie van de houder van de dieren en zijn inrichting:

      1°. naam;

      2°. adres;

      3°. het unieke registratienummer, bedoeld in artikel 93, slot, van verordening (EU) nr. 2016/429, het unieke
      erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van verordening (EU) nr. 2019/2035, dan wel het unieke
      subregistratienummer, bedoeld in [artikel 5a.1, derde lid, van de Regeling houders van dieren][ref4];

      4˚. het relatienummer, bedoeld in [artikel 1.1 Regeling houders van dieren][ref5];

      b. facturen en betaalbewijzen waaruit blijkt dat kosten als bedoeld in het eerste lid zijn gemaakt;

      c. indien van toepassing, een verklaring van een dierenarts dat de diensten, bedoeld in het eerste lid, onderdelen
      d of e, noodzakelijk zijn geacht;

      d. andere gegevens ter onderbouwing van de noodzaak van de gemaakte kosten voor verzorging, bedoeld in het eerste
      lid, onderdeel c;

      e. andere gegevens ter onderbouwing van de hoogte van gemaakte kosten voor verzorging, bedoeld in het eerste lid,
      onderdelen a, b en c;

      f. indien van toepassing, gegevens waaruit blijkt dat gemaakte kosten als bedoeld in het eerste lid uit andere
      hoofde is of zal worden vergoed.

      4 De periode waarop de vergoeding, bedoeld in [artikel 9.12, eerste lid, van de wet][ref6], betrekking heeft, vangt
      aan op de dag nadat de mededeling dat een maatregel als bedoeld in [hoofdstuk 5, paragraaf 2, van de wet][ref7]
      wordt toegepast en eindigt de dag voorafgaand aan de toepassing van die maatregel.


