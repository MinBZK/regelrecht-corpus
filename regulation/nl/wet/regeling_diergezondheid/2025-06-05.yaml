        artikel: '4.2'
  - number: '4.1'
    text: |-
      Het aantal:

      a. schapen;

      b. geiten; of

      c. runderen die één jaar oud of ouder zijn;

      dat in een kalenderjaar wordt gehouden, bedoeld in [artikel 9.18, eerste lid, van de wet][ref1], wordt berekend
      door het aantal aanwezige dieren op 1 februari, 1 mei, 1 augustus en 1 november van dat kalenderjaar op te tellen
      en te delen door vier.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel9.18
    url: https://wetten.overheid.nl/BWBR0045053/2025-06-05#Artikel4.1
