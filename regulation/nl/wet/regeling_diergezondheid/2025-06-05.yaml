      is of zal worden vergoed.
    url: https://wetten.overheid.nl/BWBR0045053/2025-06-05#Artikel4.2
  - number: 4.2.4
    text: |-
      De periode waarop de vergoeding, bedoeld in [artikel 9.12, eerste lid, van de wet][ref1], betrekking heeft, vangt
      aan op de dag nadat de mededeling dat een maatregel als bedoeld in [hoofdstuk 5, paragraaf 2, van de wet][ref2]
      wordt toegepast en eindigt de dag voorafgaand aan de toepassing van die maatregel.


