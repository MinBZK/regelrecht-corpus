      a. de [Regeling aanwijzing ambtenaar ex artikel 19 Gezondheids- en welzijnswet voor dieren][ref1];

      b. de [Regeling aanwijzing ambtenaren Gezondheids- en welzijnswet voor dieren][ref2];

