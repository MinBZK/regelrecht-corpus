  - number: '2.1'
    text: |-
      Als dierziekten als bedoeld in [artikel 5.3 van de wet][ref1] worden aangewezen:

      a. de in de onderstaande tabel genoemde ziekten bij de daarbij genoemde soorten:








                      apenpokken


                      zoogdieren (Mammalia), met uitzondering van herkauwers (Ruminantia), paarden (equidae) en varkens
      (Suidae)




                      aviaire chlamydiose


                      Vogels (Aves) met uitzondering van papegaaiachtigen (Psittaciformes)




                      hoogpathogene aviaire influenza


                      runderen (Bovinae) en varkens (Suidae)




                      Infectie met Echinoccus spp.


                      Zoogdieren (Mammalia), met uitzondering van infecties met Echinoccus multilocularis bij vleeseters
      (canidae)




                      infectie met het nodulaire-dermatosevirus


                      schapen (Ovis) en geiten (Capra)




                      infectie met Mycoplasma mycoides subsp. mycoides SC (besmettelijke runderpleuropneumonie)


                      schapen (Ovis) en geiten (Capra)




                      infectie met het rabiësvirus


                      zoogdieren (Mammalia) met uitzondering van roofdieren (Carnivora), holhoornigen (Bovidae), varkens
      (Suidae), paardachtigen (Equidae), hertachtigen (Cervidae) en kameelachtigen (Camelidae)




                      infectie met het virus van de ziekte van Aujeszky


                      zoogdieren (Mammalia) met uitzondering van varkens (Suidae)




                      infecties met virussen van de familie Filoviridae, met uitzondering van Ebola


                      zoogdieren (Mammalia), met uitzondering van herkauwers (Ruminantia), paarden (equidae) en varkens
      (Suidae)




                      Japanse encefalitis


                      varkens (Suidae)




                      miltvuur


                      zoogdieren (Mammalia), met uitzondering van onevenhoevigen (Perissodactyla), evenhoevigen
      (Artiodactyla) en olifantachtigen (Proboscidea)




                      mond- en klauwzeer


                      zoogdieren (Mammalia), met uitzondering van evenhoevigen (Artiodactyla)




                      simian immunodeficiency virusinfecties


                      zoogdieren (Mammalia), met uitzondering van herkauwers (Ruminantia), paarden (equidae) en varkens
      (Suidae)




                      trichinellose


                      herkauwers (Ruminantia), paarden (equidae) en varkens (Suidae)




                      tularemie


                      zoogdieren (Mammalia), met uitzondering van herkauwers (Ruminantia), paarden (equidae) en varkens
      (Suidae)




                      Venezolaanse, oosterse of westerse paardenencefalomyelitis


                      herkauwers (Ruminantia) en varkens (Suidae)




                      brucellose, met uitzondering van infecties met *Brucella abortus*, *Brucella melitensis* en
      *Brucella suis*


                      zoogdieren (Mammalia)




                      Q-koorts


                      hertachtigen (Cervidae) en kameelachtigen (Camelidae)






      b. de ziekten, genoemd in artikel 5, eerste lid, onder a, van verordening (EU) 2016/429 en in bijlage II bij die
      verordening, bij de in de tabel in de bijlage bij verordening (EU) nr. 2018/1882, bij de desbetreffende dierziekte
      genoemde soorten of groepen van soorten;

      c. overdraagbare spongiforme encefalopathieën (TSE’s) als bedoeld in verordening in [verordening (EG) nr. 999/2001]
      (32001R0999) bij zoogdieren (Mammalia).


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5.3
