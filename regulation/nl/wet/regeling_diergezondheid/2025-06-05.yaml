  - number: '2.5'
    text: |-
      Aan eenieder wordt vrijstelling verleend van de verplichting van melding, bedoeld in
      [artikel 1.30, eerste lid, aanhef en onderdeel a, van het Besluit houders van dieren][ref1] van hoogpathogene
      aviaire influenza bij runderen en varkens voor zover sprake is van een vermoeden van besmetting.


