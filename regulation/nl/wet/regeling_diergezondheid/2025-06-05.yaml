  - number: '2.2'
    text: |-
      Als zoönosen als bedoeld in [artikel 5.3 van de wet][ref1] worden aangewezen de in de onderstaande tabel genoemde
      ziekten bij de daarbij genoemde soorten:








                  Infecties met Salmonella spp


                  Kippen die worden gehouden voor de productie van consumptie-eieren




                  Infecties met Salmonella enteritidis, Salmonella hadar, Salmonella infantis, Salmonella typhimurium,
      Salmonella virchow en Salmonella enterica serovar Paratyphi B var. Java


                  Vogels die worden gehouden voor de productie van vlees, broedeieren en consumptie-eieren, met
      uitzondering van kippen die worden gehouden voor de productie van consumptie-eieren




                  Infectie met Sars-CoV-2


                  Marterachtigen (Mustelidae) en wasbeerhonden (Nyctereutes)


