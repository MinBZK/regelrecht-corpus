preamble:
  text: |-
    Handelende in overeenstemming met de Minister voor Medische Zorg en Sport en na overleg met de Minister van Sociale
    Zaken en Werkgelegenheid;

    Gelet op verordening (EU) nr. 2016/429 van het Europees parlement en de Raad van 9 maart 2016 betreffende
    overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid
    (diergezondheidsverordening) (PbEU 2016, L 84), verordening (EG) nr. 2160/2003 van het Europees parlement en de
    Raad van 17 november 2003 inzake de bestrijding van salmonella en andere specifieke door voedsel overgedragen
    zoönoseverwekkers (PbEU 2003 L 325), verordening (EU) 2020/688 van de Commissie van 17 december 2019 tot aanvulling
    van Verordening (EU) 2016/429 van het Europees parlement en de Raad wat betreft de diergezondheidsvoorschriften
    voor verplaatsing binnen de Unie van landdieren en broedeieren (PbEU 2020, L 174), verordening (EU) 2020/689 van
    de commissie van 17 december 2020 tot aanvulling van Verordening (EU) 2016/429 van het Europees parlement en de
    Raad wat betreft regels voor bewaking, uitroeiingsprogramma’s en de ziektevrij status voor bepaalde in de lijst
    opgenomen ziekten en nieuwe ziekten (PbEU 2020, L 174), verordening (EU) 2020/999 van de Commissie van 9 juli
    2020 tot vaststelling van bepalingen ter uitvoering van Verordening (EU) 2016/429 van het Europees parlement en de
    Raad wat betreft de erkenning van inrichtingen voor levende producten en de traceerbaarheid van levende producten
    van runderen, varkens, schapen, geiten en paardachtigen (PbEU 2020, L 221), verordening (EG) nr. 152/2009 van de
    Commissie van 27 januari 2009 tot vaststelling van de bemonsterings- en analysemethode voor de officiële controle
    van diervoeders (PbEU 2009, L54), verordening (EG) nr. 999/2001 van het Europees parlement en de Raad van 22 mei
    2001 houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare
    spongiforme encefalopathieën (PbEU 2001, L147) en de artikelen 2.12, eerste en derde lid, 5.3, artikel 5.10,
    eerste lid, onder a, en tweede lid, onder d, in samenhang met artikel 5.1, eerste en derde lid, 6.2, 6.4, eerste
    lid, 7.1, 7.2, tweede lid, tweede volzin, 9.12, tweede lid, en 9.18, tweede lid, van de Wet dieren, de artikelen
    2.3, eerste lid, en4.2, tweede lid, van het Besluit diergezondheid, de artikelen 7a.1 en 7a.2 van het Besluit
    diergeneesmiddelen, de artikelen 1A.1, derde lid, en 3.6 van het Besluit dierlijke producten, de artikelen 1.37,
    tweede lid, 1.39, 1.40, 1.41, 1.48, 1.51, 1.52, 1.53, 1.54, 1.55, 1.56, 1.57, 1.58, 1.59, 1.61, 2.10a, derde lid,
    2.10f, vijfde lid, 2.27b, eerste en derde lid, 2.27h, tweede lid2.27p, derde lid, 2.27q, tweede lid, 2.46a, tweede
    lid, 1.61, 2.76ib, tweede lid, 2.76ic, 2.76id, eerste en tweede lid, 2.76ie, 3.24, derde en vierde lid, 4.16 en
    4.18, derde lid, van het Besluit houders van dieren, de artikelen 4.9 en 4.11 van het Besluit handhaving en overige
    zaken Wet dieren en artikel 2.1 van het Besluit diervoeders 2012;

