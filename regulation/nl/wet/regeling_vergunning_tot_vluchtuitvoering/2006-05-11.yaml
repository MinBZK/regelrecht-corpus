---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vergunning_tot_vluchtuitvoering
regulatory_layer: WET
publication_date: '2006-08-22'
valid_from: '2006-05-11'
bwb_id: BWBR0008374
url: https://wetten.overheid.nl/BWBR0008374/2006-05-11
preamble:
  text: |-
    Gelet op de artikelen 97, 98, 102, 104, vijfde lid, 105, 108, 109, en 110 van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *vergunning:*


              vergunning tot vluchtuitvoering als bedoeld in
      [artikel 104, tweede lid, van de Regeling Toezicht Luchtvaart][ref1];



            b

              *JAR-OPS:*


              JAR-OPS 1 en JAR-OPS 3;



            c

              *JAR-OPS 1:*


              Joint Aviation Requirements, Commercial Air Transportation (Aeroplanes), met inbegrip van de wijzigingen
      hierop zoals vastgesteld door de Joint Aviation Authorities Committee;



            d

              *JAR-OPS 3:*


              Joint Aviation Requirements, Commercial Air Transportation (Helicopters), met inbegrip van de wijzigingen
      hierop zoals vastgesteld door de Joint Aviation Authorities Committee.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel104
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '104'
  - number: '2.1'
    text: 'De aanvraag voor initiële afgifte, wijziging en verlenging van een vergunning bevat:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.b
    text: gegevens over de aard van het te verrichten vervoer;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.c
    text: een aanduiding van de gebieden, waarin vluchten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.d
    text: een aanduiding van het type of de typen luchtvaartuigen, waarmee vluchten zullen worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.e
    text: |-
      de datum, waarop met de vluchten zal worden aangevangen of de datum waarop een gewenste wijziging van kracht moet
      worden;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: 2.1.f
    text: |-
      in voorkomende gevallen aanduiding van de voorschriften van JAR-OPS, bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '2.2'
    text: |-
      Bij een aanvraag voor wijziging of verlenging kan ten aanzien van de gegevens, genoemd in het eerste lid, onder b,
      c, d en f, volstaan worden met aanduiding van gewenste wijzigingen.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
  - number: '2.3'
    text: |-
      Indien een aanvraag geheel of gedeeltelijk gebaseerd is op het voldoen aan bepaalde voorschriften van JAR-OPS in
      overeenstemming met [artikel 3, eerste lid][ref1], bevat de aanvraag eveneens de gegevens, bedoeld in artikel JAR-
      OPS 1.185 danwel artikel JAR-OPS 3.185, voor zover die vereist zijn voor de beoordeling of aan de voorschriften van
      JAR-OPS wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '3.1'
    text: |-
      Voor de beoordeling of het luchtvervoer op veilige wijze zal worden verricht toont de aanvrager aan dat hij voldoet
      aan:
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: 3.1.a
    text: de bepalingen van JAR-OPS overeenkomstig de bij deze regeling behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: 3.1.b
    text: |-
      de overige aan hem in of krachtens [Hoofdstuk V van de Regeling Toezicht Luchtvaart][ref1] opgelegde
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002309
        hoofdstuk: V
  - number: '3.2'
    text: 'De aanvrager toont aan op zodanige wijze te voldoen aan de verplichtingen, bedoeld in het eerste lid, dat:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: 3.2.a
    text: bekwaamheid van de bemanningen is verzekerd;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: 3.2.b
    text: |-
      een stelsel van aanwijzingen en gegevens beschikbaar is dat bij toepassing door de bemanning leidt tot een veilige
      vluchtuitvoering; en
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: 3.2.c
    text: de luchtwaardigheid van de te gebruiken luchtvaartuigen is verzekerd.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel3
  - number: '4.1'
    text: |-
      Voor de beoordeling of het luchtvervoer op veilige wijze zal worden verricht, wordt door de
      aanvrager tevens aangetoond dat bemanningsleden als bedoeld in: a. JAR-OPS 3 Appendix 1 bij 3.005(d)
      Helicopter Emergency Medical Service (HEMS) welke de functie van HEMS Crew Member uitvoeren,
      en b. JAR-OPS 3 Appendix 1 bij 3.005(h) Helicopter Hoist Operations (HHO) welke de functie
      van HHO Crew Member uitvoeren, voldoen aan de medische keuringseisen klasse 2, bedoeld in de
      [Regeling geneeskundige instanties, geneeskundigen en medische verklaringen voor de luchtvaar][ref1]t met dien
      verstande dat: 1. JAR-FCL 3.105 sub (a)(2) van toepassing is; 2. in plaats van JAR-FCL 3.340 sub (a), JAR-FCL
      3.220 sub (a) van toepassing is; 3. JAR-FCL 3.345 sub (d) niet van toepassing is; en 4. de initiële en periodieke
      gehoortest, bedoeld in JAR-FCL 3.355 sub (b) vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0010686
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010686
  - number: '4.2'
    text: |-
      De [artikelen 11, tweede lid][ref1], en [12, onderdelen a, b en c, van de in het eerste lid genoemde regeling][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010686#Artikel12
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0010686
        artikel: '12'
  - number: '4.3'
    text: |-
      Om aan te tonen dat de in het eerste lid bedoelde bemanningsleden voldoen aan de gestelde medische eisen, wordt
      bij een initiële afgifte, wijziging of verlenging van een vergunning voor het verrichten van luchtvervoer,
      waarbij de in het eerste lid bedoelde bemanningsleden werkzaamheden uitvoeren, door de aanvrager een verklaring
      overgelegd die is afgegeven door een geautoriseerde medische instantie respectievelijk geneeskundige als bedoeld in
      [artikel 2][ref1] respectievelijk [artikel 5 van de in het eerste lid genoemde regeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010686#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010686#Artikel5
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010686
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0010686
        artikel: '5'
  - number: '5'
    text: 'In de vergunning of in de daarbij behorende bijlagen worden de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel5
  - number: 5.a
    text: de datum waarop de geldigheid van de vergunning afloopt;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel5
  - number: 5.b
    text: bijzondere beperkingen; en
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel5
  - number: 5.c
    text: |-
      de gegevens, bedoeld in [artikel 2, eerste lid][ref1], met uitzondering van het adres van de aanvrager en de
      gegevens, bedoeld onder e.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel2
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '2'
  - number: '6.1'
    text: De vergunning wordt verleend voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van de periode, bedoeld in het eerste lid, vervalt de vergunning gelijktijdig met het vervallen van de
      geldigheid of de intrekking van de vergunning, bedoeld in [artikel 16 van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 6a.1
    text: |-
      De Minister van Verkeer en Waterstaat kan, in het belang van een veilige vluchtuitvoering, door de vergunninghouder
      op te volgen operationele aanwijzingen geven die een bepaalde vluchtuitvoering verbieden, beperken dan wel
      onderwerpen aan bepaalde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel6a
  - number: 6a.2
    text: |-
      Een operationele aanwijzing bevat ten minste: - de reden voor het geven van de aanwijzing,
        - de toepassing en duur, en
        - de door de vergunninghouder vereiste actie.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel6a
  - number: 6a.3
    text: De operationele aanwijzingen zijn aanvullend op de voorschriften van JAR-OPS.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel6a
  - number: '7.1'
    text: 'De vergunningverlener kan de vergunning en de vergunningvoorwaar-den wijzigen:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
  - number: 7.1.a
    text: |-
      op aanvraag van de vergunninghouder, met inachtneming van [artikel 11][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel11
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '11'
  - number: 7.1.b
    text: 'ambtshalve, indien:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
  - number: 7.1.b.1º
    text: de vergunning geheel of gedeeltelijk verleend blijkt te zijn op basis van onjuiste informatie;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
  - number: 7.1.b.2º
    text: |-
      redenen voor schorsing of intrekking, bedoeld in [artikel 8][ref1] respectievelijk [artikel 9][ref2], aanwezig
      zijn, maar algehele schorsing of intrekking naar het oordeel van de vergunningverlener niet noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel9
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '9'
  - number: '7.2'
    text: |-
      [Artikel 3, eerste lid][ref1], is van overeenkomstige toepassing op wijziging van de vergunning op aanvraag van
      de vergunninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '7.3'
    text: Van ambtshalve wijziging wordt bij aangetekende brief mededeling gedaan aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel7
  - number: '8.1'
    text: |-
      De vergunningverlener kan de vergunning geheel of gedeeltelijk schorsen indien wordt betwijfeld of nog wordt
      voldaan aan de toepasselijke voorschriften en verplichtingen, bedoeld in [artikel 3, eerste lid][ref1], met
      inachtneming van [artikel 3, derde lid][ref2], of aan de overige vergunningvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '8.2'
    text: Van schorsing wordt onder opgaaf van redenen bij aangetekende brief mededeling gedaan aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel8
  - number: '8.3'
    text: |-
      De schorsing wordt opgeheven indien de vergunninghouder aantoont wel of wel weer aan de voorwaarden, voorschriften
      en verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel8
  - number: '9.1'
    text: 'De vergunningverlener kan de vergunning intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel9
  - number: 9.1.a
    text: is gebleken dat de vergunning geheel of gedeeltelijk verleend is op basis van onjuiste informatie; of
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel9
  - number: 9.1.b
    text: |-
      is gebleken, dat niet meer wordt voldaan aan de toepasselijke voorschriften en verplichtingen, bedoeld
      in [artikel 3, eerste lid][ref1], met inachtneming van [artikel 3, derde lid][ref2], of aan de overige
      vergunningvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '9.2'
    text: Van intrekking wordt bij aangetekende brief mededeling gedaan aan de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel9
  - number: '9.3'
    text: De vergunninghouder zendt de vergunning binnen 14 dagen na de datum van intrekking aan de vergunningverlener.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel9
  - number: '10.1'
    text: De vergunning wordt op aanvraag telkens verlengd voor ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel10
  - number: '10.2'
    text: |-
      Een aanvraag voor verlenging wordt uiterlijk een maand, doch niet eerder dan 6 maanden voor het verstrijken van de
      termijn van geldigheid van de vergunning, door de vergunninghouder ingediend bij de vergunningverlener.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel10
  - number: '10.3'
    text: 'Verlenging wordt verleend indien geen twijfel bestaat of:'
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel10
  - number: 10.3.a
    text: |-
      nog voldaan wordt aan de toepasselijke voorschriften en verplichtingen, bedoeld in [artikel 3, eerste lid][ref1],
      met inachtneming van [artikel 3, derde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: 10.3.b
    text: nog wordt voldaan aan de overige vergunningvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel10
  - number: '11.1'
    text: |-
      De vergunninghouder die vanaf 1 oktober 2000 verkeersvluchten met vliegtuigen wenst uit te voeren die vallen onder
      een of meer van de volgende criteria dient uiterlijk 1 mei 2000 een aanvraag in voor wijziging van de vergunning:
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.1.a
    text: IFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.1.b
    text: VFR-vluchten bij nacht;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.1.c
    text: |-
      vluchten met vliegtuigen met een maximum toegelaten startmassa tussen 5.700 kg en 10 ton dan wel met meer dan 9
      zitplaatsen voor passagiers, of
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.1.d
    text: |-
      vluchten met vliegtuigen niet zijnde propellervliegtuigen met ten hoogste 9 zitplaatsen voor passagiers dan wel met
      een maximum toegelaten startmassa van 5.700 kg of minder.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: '11.2'
    text: |-
      De vergunninghouder die vanaf 1 augustus 2000 verkeersvluchten met helikopters wenst uit te voeren die vallen onder
      een of meer van de volgende criteria dient uiterlijk 1 maart 2000 een aanvraag in voor wijziging van de vergunning:
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.a
    text: IFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.b
    text: |-
      VFR-vluchten bij dag met helikopters met een maximaal toegelaten startmassa van meer dan 2.730 kg dan wel met meer
      dan 9 zitplaatsen voor passagiers;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.c
    text: VFR-rondvluchten buiten een afstand van 20 zeemijlen van het vertrekpunt;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.d
    text: vluchten over routes niet genavigeerd aan de hand van visuele landkenmerken;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.e
    text: VFR-vluchten bij nacht;
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.f
    text: HEMS-vluchten, of
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.2.g
    text: vluchten over gebieden waar geen veilige noodlanding gemaakt kan worden.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: '11.3'
    text: |-
      De vergunninghouder die vanaf 1 juli 2001 verkeersvluchten met helikopters wenst uit te voeren anders dan bedoeld
      in het tweede lid, dient uiterlijk 1 april 2001 een aanvraag in voor wijziging van de vergunning.
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: '11.4'
    text: |-
      Bij de aanvraag bedoeld in de voorgaande leden toont de aanvrager in afwijking op [artikel 7, tweede lid][ref1],
      aan voor zover het betreft vluchten met vliegtuigen respectievelijk helikopters:


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel7
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '7'
  - number: 11.4.a
    text: te zullen voldoen aan alle op hem toepasselijke voorschriften van JAR-OPS 1 respectievelijk JAR-OPS 3; en
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
  - number: 11.4.b
    text: |-
      de hem opgelegde verplichtingen bij of krachtens [Hoofdstuk V van de Regeling Toezicht Luchtvaart][ref1] te
      zullen nakomen voor zover hier niet in overeenstemming met het schema van de bijlage voorschriften van JAR-OPS 1
      respectievelijk JAR-OPS 3 in de plaats zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002309
        hoofdstuk: V
  - number: '11.5'
    text: |-
      De wijziging van de vergunning laat de termijn van geldigheid, bedoeld in [artikel 6, eerste lid][ref1], en
      [artikel 10, eerste lid][ref2], onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel10
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel11
    references:
