        artikel: '10'
  - number: '12'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], toont de ondernemer die eerste afgifte van een vergunning aanvraagt
      voor het uitvoeren van vluchten met vliegtuigen respectievelijk helikopters, bedoeld in [artikel 11][ref2], aan:


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel11
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '11'
  - number: 12.a
    text: te zullen voldoen aan alle op hem toepasselijke voorschriften van JAR-OPS 1 respectievelijk JAR-OPS 3; en
    url: https://wetten.overheid.nl/BWBR0008374/2006-05-11#Artikel12
  - number: 12.b
    text: |-
      de hem opgelegde verplichtingen bij of krachtens [Hoofdstuk V van de Regeling Toezicht Luchtvaart][ref1] te
      zullen nakomen voor zover hier niet in overeenstemming met het schema van de bijlage voorschriften van JAR-OPS 1
      respectievelijk JAR-OPS 3 in de plaats zijn gekomen.


