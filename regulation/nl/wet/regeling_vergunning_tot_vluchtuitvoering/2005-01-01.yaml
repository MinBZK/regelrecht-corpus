  - number: '13'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 4 januari 1990, nr. LI/17, houdende een
      [regeling vergunning tot vluchtuitvoering][ref1] (Stcrt. 1990, 7) en de regeling van de Minister van Verkeer en
      Waterstaat van 29 mei 1990, nr. 4094, houdende een regeling ten aanzien van vergunningen voor het uitvoeren van
      vluchten (Stcrt. 1990, 111) worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008374
