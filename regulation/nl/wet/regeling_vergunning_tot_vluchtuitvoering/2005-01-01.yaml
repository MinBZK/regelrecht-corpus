        artikel: '9'
      - id: ref4
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '8'
    text: |-
      1 De vergunningverlener kan de vergunning geheel of gedeeltelijk schorsen indien wordt betwijfeld of nog wordt
      voldaan aan de toepasselijke voorschriften en verplichtingen, bedoeld in [artikel 3, eerste lid][ref1], met
      inachtneming van [artikel 3, derde lid][ref2], of aan de overige vergunningvoorwaarden.

      2 Van schorsing wordt onder opgaaf van redenen bij aangetekende brief mededeling gedaan aan de vergunninghouder.

      3 De schorsing wordt opgeheven indien de vergunninghouder aantoont wel of wel weer aan de voorwaarden,
      voorschriften en verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '9'
    text: |-
      1 De vergunningverlener kan de vergunning intrekken indien:

      a. is gebleken dat de vergunning geheel of gedeeltelijk verleend is op basis van onjuiste informatie; of

      b. is gebleken, dat niet meer wordt voldaan aan de toepasselijke voorschriften en verplichtingen, bedoeld
      in [artikel 3, eerste lid][ref1], met inachtneming van [artikel 3, derde lid][ref2], of aan de overige
      vergunningvoorwaarden.

      2 Van intrekking wordt bij aangetekende brief mededeling gedaan aan de vergunninghouder.

      3 De vergunninghouder zendt de vergunning binnen 14 dagen na de datum van intrekking aan de vergunningverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '10'
    text: |-
      1 De vergunning wordt op aanvraag telkens verlengd voor ten hoogste twee jaren.

      2 Een aanvraag voor verlenging wordt uiterlijk een maand, doch niet eerder dan 6 maanden voor het verstrijken van
      de termijn van geldigheid van de vergunning, door de vergunninghouder ingediend bij de vergunningverlener.

      3 Verlenging wordt verleend indien geen twijfel bestaat of:

      a. nog voldaan wordt aan de toepasselijke voorschriften en verplichtingen, bedoeld in
      [artikel 3, eerste lid][ref1], met inachtneming van [artikel 3, derde lid][ref2]; en

      b. nog wordt voldaan aan de overige vergunningvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '11'
    text: |-
      1 De vergunninghouder die vanaf 1 oktober 2000 verkeersvluchten met vliegtuigen wenst uit te voeren die vallen
      onder een of meer van de volgende criteria dient uiterlijk 1 mei 2000 een aanvraag in voor wijziging van de
      vergunning:

      a. IFR-vluchten;

      b. VFR-vluchten bij nacht;

      c. vluchten met vliegtuigen met een maximum toegelaten startmassa tussen 5.700 kg en 10 ton dan wel met meer dan 9
      zitplaatsen voor passagiers, of

      d. vluchten met vliegtuigen niet zijnde propellervliegtuigen met ten hoogste 9 zitplaatsen voor passagiers dan wel
      met een maximum toegelaten startmassa van 5.700 kg of minder.

      2 De vergunninghouder die vanaf 1 augustus 2000 verkeersvluchten met helikopters wenst uit te voeren die vallen
      onder een of meer van de volgende criteria dient uiterlijk 1 maart 2000 een aanvraag in voor wijziging van de
      vergunning:

      a. IFR-vluchten;

      b. VFR-vluchten bij dag met helikopters met een maximaal toegelaten startmassa van meer dan 2.730 kg dan wel met
      meer dan 9 zitplaatsen voor passagiers;

      c. VFR-rondvluchten buiten een afstand van 20 zeemijlen van het vertrekpunt;

      d. vluchten over routes niet genavigeerd aan de hand van visuele landkenmerken;

      e. VFR-vluchten bij nacht;

      f. HEMS-vluchten, of

      g. vluchten over gebieden waar geen veilige noodlanding gemaakt kan worden.

      3 De vergunninghouder die vanaf 1 juli 2001 verkeersvluchten met helikopters wenst uit te voeren anders dan bedoeld
      in het tweede lid, dient uiterlijk 1 april 2001 een aanvraag in voor wijziging van de vergunning.

      4 Bij de aanvraag bedoeld in de voorgaande leden toont de aanvrager in afwijking op [artikel 7, tweede lid][ref1],
      aan voor zover het betreft vluchten met vliegtuigen respectievelijk helikopters:

      a. te zullen voldoen aan alle op hem toepasselijke voorschriften van JAR-OPS 1 respectievelijk JAR-OPS 3; en

      b. de hem opgelegde verplichtingen bij of krachtens [Hoofdstuk V van de Regeling Toezicht Luchtvaart][ref2] te
      zullen nakomen voor zover hier niet in overeenstemming met het schema van de bijlage voorschriften van JAR-OPS 1
      respectievelijk JAR-OPS 3 in de plaats zijn gekomen.

      5 De wijziging van de vergunning laat de termijn van geldigheid, bedoeld in [artikel 6, eerste lid][ref3], en
      [artikel 10, eerste lid][ref4], onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002309#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0008374#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008374#Artikel10
