  text: |-
    Gelet op de artikelen 97, 98, 102, 104, vijfde lid, 105, 108, 109, en 110 van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *vergunning:*


              vergunning tot vluchtuitvoering als bedoeld in
      [artikel 104, tweede lid, van de Regeling Toezicht Luchtvaart][ref1];



            b

              *JAR-OPS:*


              JAR-OPS 1 en JAR-OPS 3;



            c

              *JAR-OPS 1:*


              Joint Aviation Requirements, Commercial Air Transportation (Aeroplanes), met inbegrip van de wijzigingen
      hierop zoals vastgesteld door de Joint Aviation Authorities Committee;



            d

              *JAR-OPS 3:*


              Joint Aviation Requirements, Commercial Air Transportation (Helicopters), met inbegrip van de wijzigingen
      hierop zoals vastgesteld door de Joint Aviation Authorities Committee.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel104
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '104'
  - number: '2'
    text: |-
      1 De aanvraag voor initiële afgifte, wijziging en verlenging van een vergunning bevat:

      a. naam en adres van de aanvrager;

      b. gegevens over de aard van het te verrichten vervoer;

      c. een aanduiding van de gebieden, waarin vluchten zullen worden uitgevoerd;

      d. een aanduiding van het type of de typen luchtvaartuigen, waarmee vluchten zullen worden uitgevoerd;

      e. de datum, waarop met de vluchten zal worden aangevangen of de datum waarop een gewenste wijziging van kracht
      moet worden;

      f. in voorkomende gevallen aanduiding van de voorschriften van JAR-OPS, bedoeld in [artikel 3, eerste lid][ref1].

      2 Bij een aanvraag voor wijziging of verlenging kan ten aanzien van de gegevens, genoemd in het eerste lid, onder
      b, c, d en f, volstaan worden met aanduiding van gewenste wijzigingen.

      3 Indien een aanvraag geheel of gedeeltelijk gebaseerd is op het voldoen aan bepaalde voorschriften van JAR-OPS in
      overeenstemming met [artikel 3, eerste lid][ref2], bevat de aanvraag eveneens de gegevens, bedoeld in artikel JAR-
      OPS 1.185 danwel artikel JAR-OPS 3.185, voor zover die vereist zijn voor de beoordeling of aan de voorschriften van
      JAR-OPS wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008374
        artikel: '3'
  - number: '3'
    text: |-
      1 Voor de beoordeling of het luchtvervoer op veilige wijze zal worden verricht toont de aanvrager aan dat hij
      voldoet aan:

      a. de bepalingen van JAR-OPS overeenkomstig de bij deze regeling behorende bijlage;

      b. de overige aan hem in of krachtens [Hoofdstuk V van de Regeling Toezicht Luchtvaart][ref1] opgelegde
      verplichtingen.

      2 De aanvrager toont aan op zodanige wijze te voldoen aan de verplichtingen, bedoeld in het eerste lid, dat:

      a. bekwaamheid van de bemanningen is verzekerd;

      b. een stelsel van aanwijzingen en gegevens beschikbaar is dat bij toepassing door de bemanning leidt tot een
      veilige vluchtuitvoering; en

      c. de luchtwaardigheid van de te gebruiken luchtvaartuigen is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002309
        hoofdstuk: V
  - number: '5'
    text: |-
      In de vergunning of in de daarbij behorende bijlagen worden de volgende gegevens vermeld:

      a. de datum waarop de geldigheid van de vergunning afloopt;

      b. bijzondere beperkingen; en

      c. de gegevens, bedoeld in [artikel 2, eerste lid][ref1], met uitzondering van het adres van de aanvrager en de
      gegevens, bedoeld onder e.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel2
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008374
        artikel: '2'
  - number: '6'
    text: |-
      1 De vergunning wordt verleend voor ten hoogste twee jaren.

      2 In afwijking van de periode, bedoeld in het eerste lid, vervalt de vergunning gelijktijdig met het vervallen van
      de geldigheid of de intrekking van de vergunning, bedoeld in [artikel 16 van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 6a
    text: |-
      1 De Minister van Verkeer en Waterstaat kan, in het belang van een veilige vluchtuitvoering, door de
      vergunninghouder op te volgen operationele aanwijzingen geven die een bepaalde vluchtuitvoering verbieden, beperken
      dan wel onderwerpen aan bepaalde voorwaarden.

      2 Een operationele aanwijzing bevat ten minste:

        - de reden voor het geven van de aanwijzing,
        - de toepassing en duur, en
        - de door de vergunninghouder vereiste actie.

      3 De operationele aanwijzingen zijn aanvullend op de voorschriften van JAR-OPS.
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel6a
  - number: '7'
    text: |-
      1 De vergunningverlener kan de vergunning en de vergunningvoorwaar-den wijzigen:

      a. op aanvraag van de vergunninghouder, met inachtneming van [artikel 11][ref1]; of

      b. ambtshalve, indien:

      1º de vergunning geheel of gedeeltelijk verleend blijkt te zijn op basis van onjuiste informatie;

      2º redenen voor schorsing of intrekking, bedoeld in [artikel 8][ref2] respectievelijk [artikel 9][ref3], aanwezig
      zijn, maar algehele schorsing of intrekking naar het oordeel van de vergunningverlener niet noodzakelijk is.

      2 [Artikel 3, eerste lid][ref4], is van overeenkomstige toepassing op wijziging van de vergunning op aanvraag van
      de vergunninghouder.

      3 Van ambtshalve wijziging wordt bij aangetekende brief mededeling gedaan aan de vergunninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0008374#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008374#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008374#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0008374#Artikel3
    url: https://wetten.overheid.nl/BWBR0008374/2005-01-01#Artikel7
    references:
      - id: ref1
