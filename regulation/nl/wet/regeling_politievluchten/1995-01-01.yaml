$id: regeling_politievluchten
regulatory_layer: WET
publication_date: '2014-12-11'
valid_from: '1995-01-01'
bwb_id: BWBR0007095
url: https://wetten.overheid.nl/BWBR0007095/1995-01-01
preamble:
  text: |-
    Handelend in overeenstemming met de Staatssecretaris van Defensie,

    Gelet op artikel 56 van het Luchtverkeersreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Ten aanzien van vluchten met luchtvaartuigen die in gebruik zijn bij de Nederlandse politie waarbij door het doel
      van de vlucht niet kan worden voldaan aan het bij of krachtens [artikel 28 van het Luchtverkeersreglement][ref1]
      gestelde regels, gelden de volgende nadere regels:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel28
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '28'
  - number: 1.a
    text: de noodzaak van het uitvoeren van een vlucht met gedoofde lichten blijkt uit een dienstopdracht;
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel1
  - number: 1.b
    text: |-
      de vlucht wordt vooraf afgestemd met de betrokken luchtverkeersdienst of -diensten, die voorwaarden kan of kunnen
      stellen ten aanzien van te volgen procedures;
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel1
  - number: 1.c
    text: |-
      in het vliegplan wordt melding gemaakt van het voornemen om tijdens de vlucht of een deel daarvan de verplichte
      lichten niet te tonen;
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel1
  - number: 1.d
    text: |-
      het luchtvaartuig is uitgerust met een goed functionerend radar beantwoordingssysteem (SSR-transponder) met 4096
      code mogelijkheden in mode A en automatische hoogterapportering in mode C.
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel1
  - number: '2'
    text: |-
      De beschikking van de directeur-generaal van de Rijksluchtvaartdienst, nr LVB/L 24153 van 1 september 1982 wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling wordt aangehaald als: Regeling politievluchten. Deze regeling zal met de toelichting in de
      Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007095/1995-01-01#Artikel4
