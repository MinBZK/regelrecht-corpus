  - number: '6'
    text: |-
      Aansluiting op CORV vindt uitsluitend plaats indien de infrastructuur voor gegevensuitwisseling van de justitiële
      ketenpartner aansluiting op CORV mogelijk maakt en deze aansluiting voldoende verantwoord is.
    url: https://wetten.overheid.nl/BWBR0035936/2021-01-30#Artikel6
  - number: '7'
    text: |-
      Bij aansluiting van een justitiële ketenpartner op CORV stelt de Minister in ieder geval nadere eisen omtrent:

      a. het aantal aansluitingen van de justitiële ketenpartner;

      b. de actualiteit van de bij de aansluiting te gebruiken programmatuur;

      c. het vervallen van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0035936/2021-01-30#Artikel7
  - number: '8'
    text: |-
      Onverminderd [artikel 3, vierde lid][ref1], en [artikel 5, vijfde lid][ref2], kan de Minister deze regeling
      wijzigen, voor zover hij dit afstemt met de Minister van Volksgezondheid, Welzijn en Sport.


