articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *CORV:* collectieve opdracht routeervoorziening als bedoeld in [artikel 2, eerste lid][ref1];
        - *foutmelding:* melding dat een bericht in CORV niet is gerouteerd of door de ontvanger niet goed kan worden
      verwerkt;
        - *justitiële ketenpartner:* a. Veilig Thuis: Veilig Thuis-organisatie als bedoeld in
      [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2]; b. college: college als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref3]; c. gecertificeerde instelling: gecertificeerde instelling als bedoeld in
      [artikel 1.1 Jeugdwet][ref4]; d. raad voor de kinderbescherming: raad voor de kinderbescherming als bedoeld in
      [artikel 238, eerste lid, Boek 1 van het Burgerlijk Wetboek][ref5];
        - *Minister:* Minister van Justitie en Veiligheid;
        - *verkeersgegevens:* gegevens over de aard en status van berichten die via CORV zijn verzonden en ontvangen,
      inclusief gegevens over foutmeldingen.


