  - number: '2'
    text: |-
      1 Er is een collectieve opdracht routeervoorziening waarmee justitiële ketenpartners op veilige en zorgvuldige
      wijze berichten verzenden en ontvangen zonder dat deze berichten bij verzending of voor ontvangst inhoudelijk
      worden bewerkt.

      2 De Minister draagt zorg voor de inrichting en het beheer van CORV.

      3 De Minister is de verwerkingsverantwoordelijke in de zin van artikel 4 van de Verordening (EU) 2016/679 van het
      Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke personen in verband met
      verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn
      95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU 2016, L 119), met betrekking tot het
      verwerken van persoonsgegevens in CORV.
    url: https://wetten.overheid.nl/BWBR0035936/2021-01-30#Artikel2
  - number: '3'
    text: |-
      1 Behoudens gevallen van onverwijlde spoed verzenden de justitiële ketenpartners uitsluitend via CORV de berichten
      vermeld in [Bijlage 1][ref1] bij deze regeling overeenkomstig de daarbij vermelde aanwijzingen.

      2 De justitiële ketenpartners dragen er zorg voor dat zij in staat zijn om via CORV berichten te ontvangen op grond
      van:

      a. [artikel 4:2, eerste lid, onderdelen i en j, van het Besluit politiegegevens][ref2];

      b. [artikel 11c, eerste lid][ref3], en
      [artikel 17, eerste lid, aanhef en onder c, van het Besluit justitiële en strafvorderlijke gegevens][ref4];

      voor zover voornoemde artikelen betrekking hebben op de taken en werkzaamheden van de justitiële ketenpartners.

      3 De berichten, bedoeld in het eerste en tweede lid, voor zover deze niet via CORV door of aan gecertificeerde
      instellingen kunnen worden verzonden, worden uiterlijk tot 1 april 2015 op een andere veilige en zorgvuldige wijze
      verzonden.

      4 De Minister kan [Bijlage 1][ref5] van deze regeling wijzigen of vervangen.


