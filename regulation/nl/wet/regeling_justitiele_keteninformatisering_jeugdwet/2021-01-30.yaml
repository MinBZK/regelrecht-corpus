  - number: '4'
    text: |-
      1 De Minister vernietigt een bericht dat met CORV is verzonden, uiterlijk binnen 72 uur vanaf het tijdstip dat in
      CORV een bevestiging is ontvangen dat het verzonden bericht juist is gerouteerd.

      2 De Minister bewaart verkeersgegevens maximaal twaalf maanden na het ontstaan van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0035936/2021-01-30#Artikel4
  - number: '5'
    text: |-
      1 Een Veilig Thuis-organisatie wendt zich voor aansluiting op CORV tot de Minister met gebruikmaking van het
      formulier in [Bijlage 2][ref1] van deze regeling. Daarbij verklaart de Veilig Thuis-organisatie dat zij voldoet aan
      de aansluitingsvoorwaarden voor CORV.

      2 Een college wendt zich voor aansluiting op CORV tot de Minister met gebruikmaking van het formulier in
      [Bijlage 3][ref2] van deze regeling. Daarbij verklaart het college dat het voldoet aan de aansluitingsvoorwaarden
      voor CORV.

      3 Een gecertificeerde instelling wendt zich voor aansluiting op CORV tot de Minister met gebruikmaking van het
      formulier in [Bijlage 4][ref3] van deze regeling. Daarbij verklaart de gecertificeerde instelling dat het voldoet
      aan de aansluitingsvoorwaarden voor CORV.

      4 De aansluitingsvoorwaarden voor CORV, bedoeld in het eerste tot en met het derde lid, worden vastgesteld
      overeenkomstig [Bijlage 5][ref4] van deze regeling.

      5 De Minister kan [Bijlagen 2 tot en met 5][ref5] van deze regeling wijzigen of vervangen.


