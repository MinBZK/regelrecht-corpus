---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_groenprojecten_2010
regulatory_layer: WET
publication_date: '2016-03-31'
valid_from: '2010-08-04'
bwb_id: BWBR0027439
url: https://wetten.overheid.nl/BWBR0027439/2010-08-04
preamble:
  text: |-
    Gelet op artikel 5.14, derde lid, onderdeel a, en zevende lid, van de Wet inkomstenbelasting 2001;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.a
    text: |-
      *accountantsverklaring:* verklaring, afgegeven door een registeraccountant of een accountant-
      administratieconsulent;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.b
    text: |-
      *bedrijventerrein:* ruimtelijk aaneengesloten of functioneel verbonden terrein dat bestemd en geschikt is voor
      gebruik door vestigingen ten behoeve van handel, nijverheid, commerciële dienstverlening en industrie, daaronder
      niet begrepen een terrein in overwegende mate bestemd voor kantoren, detailhandel of horeca;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.c
    text: '*bestaand project:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.c.1°
    text: |-
      project als bedoeld in
      [artikel 2, onderdeel a, onder 1°, 2°, 3°,4°, 8° en 9°, b, c, d, e, f, g, h onder 7°, i, j, en k][ref1],
      waarvoor ten minste zes maanden voor de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend een
      aanvang met de uitvoering van de werkzaamheden is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 1.c.2°
    text: |-
      project als bedoeld in [artikel 2, onderdeel h, onder 1°, 2°, 5° en 6°][ref1], waarvoor op de dag van indiening
      van een aanvraag tot afgifte van een verklaring een aanvang met de uitvoering van de werkzaamheden is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 1.c.3°
    text: |-
      project als bedoeld in [artikel 2, onderdeel a, onder 5°, 6° en 7°][ref1], dat ten minste zes maanden
      voor de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend, reeds voldeed aan een van de
      projectomschrijvingen in het betreffende onderdeel;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 1.c.4°
    text: |-
      projecten als bedoeld in [artikel 2, onderdeel h, onder 3° en 4°][ref1], waarvoor meer dan acht maanden voor de
      dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend, de hypotheekakte werd gepasseerd dan wel de
      leenovereenkomst werd gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 1.d
    text: '*Bouwbesluit:* Bouwbesluit 2003;'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.e
    text: |-
      *bruto vloeroppervlak:* oppervlakte conform NEN 2580 gemeten op vloerniveau langs de buitenomtrek van opgaande
      scheidingsconstructies die de desbetreffende ruimte of groep van ruimten omsluiten;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.f
    text: |-
      *duurzaam geproduceerd hout:* hout waarvoor een door het Ministerie van Volkshuisvesting, Ruimtelijke Ordening
      en Milieu erkend certificaat is afgegeven waaruit blijkt dat het voldoet aan de Nederlandse eisen en waarvan het
      gebruik is aangetoond door middel van certificaten en afleverbewijzen of facturen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.g
    text: |-
      *duurzame melkveehouderij:* het bedrijfsmatig houden van melkkoeien op een duurzame wijze met een integraal
      duurzaam veehouderijsysteem dat in uitvoering overeenstemt met een Duurzame melkveestal die op grond van
      [artikel 3.31][ref1] of [artikel 3.42a, tweede lid van de Wet inkomstenbelasting 2001][ref2] door de Minister is
      aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1.h
    text: |-
      *eigenaar-bewoner:* natuurlijk persoon die een woning als bedoeld in onderdeel z in eigendom heeft danwel verkrijgt
      en daarin zijn hoofdverblijf heeft of zal hebben, danwel de erfpachter, vruchtgebruiker of gerechtigde tot een
      appartementsrecht als bedoeld in [artikel 106 van Boek 5 van het Burgerlijk Wetboek][ref1], voorzover deze rechten
      betrekking hebben op een woning zoals hiervoor bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel106
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '106'
  - number: 1.i
    text: |-
      *Energie-index:* maat voor de energieprestatie van bestaande woningen aan de hand van een berekeningsmethode die
      voldoet aan de BRL 9501 zoals vastgesteld op 6 december 2006;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.j
    text: |-
      *energieklasse:* gestandaardiseerde omzetting van de Energie-index in een als onderdeel van het
      energieprestatiecertificaat opgenomen energieklasse;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.k
    text: '*energielabel:* gestandaardiseerde omzetting van de energieklasse in een label met de waardes A tot en met G;'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.l
    text: |-
      *Energieprestatiecoëfficiënt:* coëfficiënt die de energieprestatie van een nieuwbouwwoning of -utiliteitsgebouw
      aangeeft aan de hand van een genormeerde berekening;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.m
    text: |-
      *energieprestatiecertificaat:* een op een gebouw toegesneden certificaat dat niet ouder is dan tien jaar
      waarin het resultaat is vermeld van de berekening van de hoeveelheid energie die nodig wordt geacht voor de
      verschillende behoeften die verband houden met een gestandaardiseerd gebruik van dat gebouw, waaronder verwarming,
      warmwatervoorziening, koeling, ventilatie en verlichting, waarin referentiewaarden zijn vermeld waarmee de
      energieprestatie van het gebouw kan worden vergeleken en beoordeeld, en dat vergezeld gaat van aanbevelingen voor
      kosteneffectieve verbetering van de energieprestatie;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.n
    text: '*gemeenschappelijk visserijbeleid:* het geheel van Europese regels voor de visserij en de aquacultuur;'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.o
    text: |-
      *Groen Label Kas:* tuinbouwkas als teeltruimte die wordt gebruikt voor het bedrijfsmatig telen van tuinbouwgewassen
      met een lagere milieubelasting, en die in technische uitvoering overeenstemt met een Groen Label Kas die op grond
      van [artikel 3.31][ref1] of [artikel 3.42a lid 2 van de Wet inkomstenbelasting 2001][ref2] door de Minister is
      aangewezen als bedrijfsmiddel dat in het belang is van het Nederlandse milieu;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1.p
    text: |-
      *labelstap:* verandering van de Energie-index van een gebouw, waardoor het gebouw in een andere energieklasse valt
      en zodoende een ander energielabel krijgt;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.q
    text: |-
      *landbouwgrondstoffen:* producten van de bodem, van de veefokkerij en van de visserij, met uitzondering van
      producten die een eerste be- of verwerking hebben ondergaan;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.r
    text: |-
      *natuur- en milieueducatie:* het organiseren van leersituaties om inzicht in en betrokkenheid bij het milieu en
      ecologische verbanden en processen te vergroten, en waarbij aandacht wordt geschonken aan mogelijkheden om de
      opgedane kennis in het dagelijkse leven toe te passen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.s
    text: |-
      *project:* in Nederland gelegen technisch, functioneel en in de tijd samenhangend geheel van activa en
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.t
    text: '*projectbeheerder:* degene voor wiens rekening en risico het project wordt ontwikkeld en in stand wordt gehouden;'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.u
    text: |-
      *projectvermogen:* vermogen dat nodig is voor de financiering van vaste activa en de werkzaamheden om de vaste
      activa te plaatsen, voor zover noodzakelijk voor en uitsluitend dienstbaar aan de totstandbrenging van een project;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.v
    text: |-
      *projectvermogen eigen woning:* projectvermogen als bedoeld in [artikel 6, lid 9 en lid 11][ref1] voor projecten
      als bedoeld in [artikel 2, onderdeel h, onder 1° en 3°][ref2] voor zover uitgevoerd door een eigenaar-bewoner;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 1.w
    text: |-
      *utiliteitsgebouw:* gebouw waarvoor in het Bouwbesluit een energieprestatie-eis is vastgelegd, met uitzondering
      van woningen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.x
    text: |-
      *verbeterproject:* project gericht op een wezenlijke verandering van een bestaand project, waardoor dit naar
      inrichting, aard of omvang een wijziging ondergaat welke het aanmerkelijk waardevoller maakt voor het milieu,
      waaronder natuur en bos;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: 1.y
    text: |-
      *verklaring:* schriftelijk besluit van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer als
      bedoeld in [artikel 5.14, derde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1], waarin wordt verklaard
      dat een project in het belang is van de bescherming van het milieu, waaronder natuur en bos;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 1.z
    text: |-
      *woning:* gebouw, bedoeld voor bewoning, dat voortdurend als hoofdverblijf ter beschikking zal staan aan een of
      meer natuurlijke personen en per wooneenheid ten minste is voorzien van een eigen toegang, een eigen toilet, een
      eigen bad- of douchevoorziening, alsmede van een energieaansluiting, bedoeld voor een kooktoestel om een maaltijd
      te kunnen bereiden.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel1
  - number: '2'
    text: |-
      De Minister van Volkshuisvesting Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister van
      Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, een verklaring afgeven voor:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a
    text: '*projecten in de categorie natuur, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.1°
    text: |-
      de ontwikkeling en instandhouding van bos, met uitzondering van vruchtbomen, windsingels, wegbeplantingen, bomen
      die bestemd zijn om te dienen als kerstbomen en kweekgoed of voor de opwekking van energie en commercieel gebruik
      van bos. De projecten bestaan uit aaneengesloten gebieden met een oppervlakte van ten minste vijf hectare;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.2°
    text: |-
      de ontwikkeling van additioneel stedelijk groen, mits er een toename is van het oppervlak aan groen en dat groen
      ten minste gedeeltelijk een opgaand karakter heeft. Het betreft de aanleg van stedelijk groen gelegen binnen de
      bebouwde kom of binnen een zone van 500 meter om de bebouwde kom. Indien het project wegbeplantingen betreft, kan
      dit alleen nieuw te realiseren wegbeplanting zijn bij bestaande wegen. Tevens mag de aanleg van openbaar groen niet
      het uitvoeren van achterstallig onderhoud betreffen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.3°
    text: |-
      de ontwikkeling en instandhouding van natuur- en landschappelijke waarden in gebieden die als Natura 2000-
      gebied, Beschermd Natuurmonument of Wetland zijn aangewezen op grond van de [Natuurbeschermingswet 1998][ref1],
      of in Nationale Parken of gebieden die onderdeel zijn van de Nationale of Provinciale Ecologische Hoofdstructuur
      inclusief robuuste ecologische verbindingszones;


      [ref1]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009641
  - number: 2.a.4°
    text: |-
      de ontwikkeling en instandhouding van natuur- en natuurlijke gebiedseigen landschappelijke en cultuurhistorische
      waarden binnen de begrenzing van de Nationale Landschappen, zoals uitgewerkt in de Nota Ruimte (Kamerstukken II
      2003−2004, 29 435, nrs.1−2), met uitzondering van opstallen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.5°
    text: |-
      de ontwikkeling en instandhouding van nieuwe natuur- en landschappelijke waarden van opengestelde landgoederen als
      bedoeld in [artikel 7, eerste lid, van de Natuurschoonwet 1928][ref1], met uitzondering van opstallen;


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
  - number: 2.a.6°
    text: |-
      de ontwikkeling en instandhouding van nieuwe natuur- en landschappelijke waarden en in aanmerking zijn gekomen
      voor subsidie op grond van de Provinciale Subsidieregeling natuurbeheer, en in geval van projecten met bos en
      houtopstanden bestaan uit aaneengesloten gebieden met een oppervlakte van ten minste vijf hectare;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.7°
    text: |-
      de ontwikkeling en instandhouding van nieuwe natuur en landschappelijke waarden en in aanmerking zijn gekomen
      voor subsidie op grond van de Provinciale Subsidieregeling agrarisch natuurbeheer of hoofdstuk 4 dan wel afdeling
      5.1.3 van de provinciale Subsidieverordening Natuur en Landschapsbeheer, en in geval van projecten met bos en
      houtopstanden bestaan uit aaneengesloten gebieden met een oppervlakte van ten minste vijf hectare;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.8°
    text: 'het bevorderen en in stand houden van biodiversiteit door de aanleg van:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.8°.a
    text: visgeleidingssystemen voor het opheffen van kunstmatige barrières;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.8°.b
    text: landdiergeleidingssystemen voor het opheffen van kunstmatige barrières;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.8°.c
    text: |-
      vogelwaarschuwingssystemen of alarmeringsystemen ter voorkoming dat vogels zich doodvliegen tegen niet natuurlijke
      obstakels;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.a.9°
    text: |-
      natuur- en milieueducatie gericht op inheemse natuur, mits educatie een primair en aantoonbaar doel is van de
      projecten en deze educatie geen onderdeel uitmaakt van het reguliere onderwijs curriculum.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.b
    text: '*projecten in de categorie biologische landbouw, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.b.1°
    text: |-
      het produceren of door kleine en middelgrote ondernemingen in de zin van Bijlage 1 [Verordening (EG) Nr. 800/2008]
      (32008R0800) van de Commissie van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen
      87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (Pb L 214) verwerken van
      biologische plantaardige landbouwproducten overeenkomstig het Landbouwkwaliteitsbesluit 2007;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.b.2°
    text: |-
      het produceren of door kleine en middelgrote ondernemingen in de zin van Bijlage 1 [Verordening (EG) Nr. 800/2008]
      (32008R0800) van de Commissie van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de artikelen
      87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard (Pb L 214) verwerken van
      biologische dierlijke landbouwproducten overeenkomstig het Landbouwkwaliteitsbesluit 2007.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.c
    text: '*projecten in de categorie landbouw, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.c.1°
    text: |-
      het bedrijfsmatig telen van gewassen in een Groen label kas, die voldoet aan de volgende basiseisen: - er zijn geen
      voorzieningen aanwezig voor het wegkoelen van opgewekte warmte, en
        - ten minste 10% van het totale energiegebruik van de kas bestaat uit zelf opgewekte/gewonnen duurzame energie als
      omschreven in categorie f.2°, f.3°, f.4°, f.5°, f.6° en g.1°, of
        - ten minste 50% minder energie gebruikt wordt dan in een referentiekas. Indien een kas wordt gerealiseerd in een
      landbouwontwikkelingsgebied glastuinbouw of in een greenport krijgt deze 10 punten als keuzemaatregel binnen het
      vigerende Certificatiesysteem Groen Label Kas;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.c.2°.a
    text: |-
      het door kleine, middelgrote en micro-ondernemingen in de zin van Aanbeveling 2003/361/EG van de Commissie van 6
      mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen (PbEU L 124) volgens de beginselen
      van het gemeenschappelijk visserijbeleid diervriendelijk kweken van zeevis of zoetwatervis, bestemd voor menselijke
      consumptie, in een nagenoeg gesloten waterrecirculatiesysteem met een verversing van ten hoogste 0,5 kubieke meter
      water per kilogram verstrekt voer per dag, waarbij de juveniele vis verkregen wordt van gekweekte oudervissen en
      waarbij het verstrekte voer duurzaam gekweekt wordt of geheel van plantaardige oorsprong is of afkomstig is van
      reststromen uit de levensmiddelenindustrie, of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.c.2°.b
    text: |-
      het door kleine, middelgrote en micro-ondernemingen in de zin van Aanbeveling 2003/361/EG van de Commissie van 6
      mei 2003 betreffende de definitie van kleine, middelgrote en micro-ondernemingen (PbEU L 124) volgens de beginselen
      van het gemeenschappelijk visserijbeleid diervriendelijk broeden en opkweken en/of diervriendelijk kweken van
      gebiedseigen schaal- en schelpdieren uit gekweekte ouderdieren en/of gekweekte juveniele dieren, bestemd voor
      menselijke consumptie, in een nagenoeg gesloten waterrecirculatiesysteem met een maximum verversingsgraad van 0,5%
      van het dagelijks debiet, waarbij het verstrekte voer duurzaam gekweekt wordt;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.c.3°
    text: |-
      duurzame melkveehouderij overeenkomstig de eisen van het certificatiesysteem van de vigerende Maatlat Duurzame
      Veehouderij en Aquacultuur, onderdeel MDV – melkveestallen, certificaat A.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.d
    text: |-
      *projecten in de categorie duurzame grondstoffen*, die zijn gericht op de industriële verwerking van
      landbouwgrondstoffen, of reststoffen van natuurbeheer tot producten die niet geschikt zijn voor menselijke of
      dierlijke consumptie, met uitzondering van de verwerking van genoemde stoffen tot energie of energiedragers.
      Voorwaarde daarbij is dat die producten in Nederland nog niet gangbaar zijn en dat deze leiden tot een vermindering
      van de aantasting van het milieu.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e
    text: '*projecten in de categorie terugwinning en hergebruik, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.1°
    text: 'vermindering van milieudruk en op vermindering van de inzet van primaire grondstoffen voor producten door:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.1°.a
    text: |-
      nog niet gangbare processen voor terugwinning van materialen of producten of grondstoffen (anders dan energie of
      energiedragers), uit stromen waarvoor een laagwaardigere verwerking gangbaar is, waardoor de inzet van primaire
      grondstoffen beperkt kan worden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.1°.b
    text: |-
      processen gericht op de verwerking van baggerspecie, die gestort zou mogen worden, tot grondstoffen waardoor de
      inzet van primaire grondstoffen beperkt kan worden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.2°
    text: |-
      een inrichting voor het detoxificeren van te ontmantelen schepen en het ontmantelen van schepen, met een
      aantoonbaar en gegarandeerd sociaal en milieuverantwoord proces in een gesloten systeem. In dit systeem treden
      geen emissies naar bodem, lucht en water op en worden afvalstoffen gedetoxificeerd en op een gecontroleerde wijze
      beheerd. Tevens wordt bescherming van medewerkers gerealiseerd en zal hergebruik van de materialen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.3°.a
    text: |-
      het in ondergrondse lagen opslaan van koolstofdioxide, afkomstig van verbrandingsinstallaties voor het opwekken van
      energie of afkomstig van industriële processen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.e.3°.b
    text: |-
      het realiseren van infrastructuur voor ondergronds transport, ten behoeve van aanwending in kassen of in andere
      inrichtingen, van koolstofdioxide afkomstig van verbrandingsinstallaties met een minimaal vermogen van 20 MW voor
      het opwekken van energie of afkomstig van industriële processen en bestaande uit investeringen voor het afvangen,
      het voorbehandelen en transport van deze gassen.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f
    text: '*projecten in de categorie duurzame energie, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.1°.a
    text: |-
      het realiseren van een biogasopwaardeerinstallatie, bestemd voor het produceren van gas van aardgasnetkwaliteit,
      waarbij uitsluitend uit biomassa of uit mest verkregen gassen als energie-input mogen dienen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.1°.b
    text: |-
      het realiseren van een biobrandstofproductie-installatie, bestemd voor het produceren van vloeibare of gasvormige
      duurzame brandstoffen uit houtachtige of cellulose-achtige verbindingen in biomassa door hoge druk of hoge
      temperatuur thermische ontleding of Fischer-Tropsch proces (of een vergelijkbaar proces) of cellulose fermentatie,
      met uitzondering van mesofiele en thermofiele mestvergisting;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.2°
    text: |-
      het opwekken van elektrische energie door middel van een windturbine die is gecertificeerd volgens de Europese
      veiligheidsnormen ‘IEC 61400-1, Ed. 3’ en ‘IEC WT01’, voorzover deze normen daarop van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.3°
    text: het opwekken van elektrische energie met behulp van fotovoltaïsche cellen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.4°
    text: |-
      het gebruik van thermische zonne-energie door middel van zonnecollectoren, eventueel in combinatie met een van de
      volgende warmtepompen:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.4°.a
    text: |-
      een warmtepomp met voor water/water-systemen een coëfficiënt of performance van ten minste 4,0, bij een conditie
      van W10/W45 bepaald conform NEN-EN 14511, of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.4°.b
    text: |-
      een warmtepomp met voor brine/water-systemen een coëfficiënt of performance van ten minste 3,2, bij een conditie
      van B0/W45 bepaald conform NEN-EN 14511;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.5°
    text: het winnen van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.f.6°
    text: |-
      het opwekken van elektrische energie uit water of waterkracht, mits voorzien van maatregelen ter bescherming van de
      biodiversiteit, en uitgezonderd het opwekken van energie met behulp van stoomturbines.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g
    text: '*projecten in de categorie energiebesparing, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.1°
    text: |-
      het met behulp van warmtepompen en een gesloten bodemwarmtewisselaar of aquifer opwaarderen van laagwaardige warmte
      naar hoogwaardige warmte op een zodanige wijze dat de hoogwaardige warmte nuttig wordt aangewend, door middel van:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.1°.a
    text: |-
      een warmtepomp met voor water/water systemen een coëfficiënt of performance van ten minste 4,0, bij een conditie
      van W10/W45 bepaald conform NEN-EN 14511, of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.1°.b
    text: |-
      een warmtepomp met voor brine/water systemen een coëfficiënt of performance van ten minste 3,2, bij een conditie
      van B0/W45 bepaald conform NEN-EN 14511;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.2..a
    text: |-
      het aanleggen van energie-arme buitenverlichting bestemd voor het verlichten van openbare wegen, openbare
      pleinen, openbare gebouwen, bruggen, openbare parken, parkeerterreinen of verharde bedrijfsterreinen,
      exclusief het verlichten van tuinen, planten en sportaccommodaties, en bestaande uit masten, led-lampen en
      specifiek voor die lampen geschikte armaturen, eventuele elektronische voorschakelapparaten en bijbehorende
      verlichtingsmanagementsystemen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.2..b
    text: |-
      het aanleggen van energie-arme buitenverlichting bestemd voor het verlichten van openbare wegen, openbare pleinen,
      openbare gebouwen, bruggen, openbare parken, parkeerterreinen of verharde bedrijfsterreinen, exclusief het
      verlichten van tuinen, planten en sportaccommodaties, waarbij aantoonbaar een energiebesparing wordt gerealiseerd
      door een toename van het systeemrendement in lumen/Watt van ten minste 30% ten opzichte van het gemiddeld
      energiegebruik bij soortgelijke gangbare installaties, en bestaande uit masten, lampen en armaturen, eventuele
      elektronische voorschakelapparaten en bijbehorende verlichtingsmanagementsystemen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.3°
    text: |-
      het aanleggen van warmtedistributienetten en het bouwen van bijstookketels en warmtebuffers, waarbij het
      distributieverlies van de warmte minder is dan 20% en de hulpenergie bijstook minder is dan 20% van het
      jaargemiddelde, ten behoeve van de benutting van restwarmte van:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.3°.a
    text: |-
      afvalverbrandingsinstallaties voor stedelijk afval en installaties in de industrie waarbij geen elektriciteit wordt
      opgewekt;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.3°.b
    text: |-
      elektriciteitsopwekkingsinstallaties met een elektrisch rendement van ten minste 30% en een minimaal vermogen van
      20 MW;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.4°
    text: |-
      het door een eigenaar-bewoner uit één gasvormige energiebron gelijktijdig opwekken van warmte en elektriciteit
      in een micro-warmtekrachtkoppeling, met een geproduceerd elektrisch vermogen van minimaal 0,8 kWe en maximaal 5
      kWe, bestemd voor ruimteverwarming van een woning, waarbij een bivalent rendement voor ruimteverwarming geldt van
      minimaal 107% op onderwaarde, gemeten volgens NEN-EN 677 op enig moment van de rendementscurve;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.g.5°
    text: |-
      het door een eigenaar-bewoner plaatsen van een warmtepomp die bestemd is voor ruimteverwarming van een woning met
      water als distributiemedium, eventueel gecombineerd met een hoogrendementsketel voor naverwarming met een rendement
      voor ruimteverwarming van minimaal 107% op onderwaarde gemeten volgens NEN-EN 677.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h
    text: '*projecten in de categorie duurzaam bouwen, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.1°
    text: |-
      het realiseren van nieuw te bouwen woningen, die voldoen aan de volgende criteria: - de Energieprestatiecoëfficiënt
      van de woningen is niet hoger dan 65% van de eis die geldt in het Bouwbesluit; én
        - regenwaterafvoer is afgekoppeld van het rioleringsstelsel, én
        - indien hout wordt toegepast is dat duurzaam geproduceerd hout;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.2°
    text: |-
      het door herbestemming van kantoorpanden realiseren van nieuwe woningen, die voldoen aan de volgende criteria: - de
      Energie-index van de gerealiseerde woningen moet ten minste gelijk zijn aan het niveau dat voor nieuwbouwwoningen
      wordt geëist, én
        - indien hout wordt toegepast is dat duurzaam geproduceerd hout;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.3°
    text: |-
      het renoveren van bestaande woningen door de eigenaar-bewoner, die voldoen aan de volgende criteria: - indien hout
      wordt toegepast is dat duurzaam geproduceerd hout;
        - er worden energiebesparende maatregelen doorgevoerd, en die voldoen aan één van de volgende niveau’s: a. de
      Energie-index van de woning is na renovatie ten minste vier labelstappen lager dan ervoor en de woning verkrijgt
      na renovatie minimaal een B-label; b. de Energie-index van de woning is na renovatie ten minste vijf labelstappen
      lager dan ervoor en de woning verkrijgt na renovatie minimaal een A-label;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.4°
    text: |-
      het renoveren van bestaande woningen door tussenkomst van een onderneming. j indien er hout wordt toegepast dit
      duurzaam geproduceerd hout is, en waarbij voldaan wordt aan één van de volgende niveau’s:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.4°.a
    text: |-
      de Energie-index van de woning is na renovatie ten minste twee labelstappen lager dan ervoor of de woning verkrijgt
      na renovatie minimaal een B-label;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.4°.b
    text: |-
      de Energie-index van de woning is na renovatie ten minste vier labelstappen lager dan ervoor en de woning verkrijgt
      na renovatie minimaal een B-label;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.4°.c
    text: |-
      de Energie-index van de woning is na renovatie ten minste vijf labelstappen dan ervoor en de woning verkrijgt na
      renovatie minimaal een A-label;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.5°
    text: |-
      het realiseren van zeer duurzame utiliteitsgebouwen, die voldoen aan [bijlage 1][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027439
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027439
  - number: 2.h.6°
    text: |-
      het renoveren van bestaande utiliteitsgebouwen, en die voldoen aan [bijlage 2][ref1] van deze regeling en aan één
      van de volgende niveaus:


      [ref1]: https://wetten.overheid.nl/BWBR0027439
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027439
  - number: 2.h.6°.I
    text: de Energie-index van het utiliteitsgebouw is na renovatie ten minste 0,6 lager dan ervoor;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.6°.II
    text: de Energie-index van het utiliteitsgebouw is na renovatie ten minste 1,2 lager dan ervoor;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.6°.III
    text: de Energie-index van het utiliteitsgebouw is na renovatie ten minste 1,8 lager dan ervoor;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.h.7°
    text: |-
      de herstructurering van verouderde bedrijventerreinen door overheden of kleine en middelgrote ondernemingen in de
      zin van Bijlage 1 [Verordening (EG) Nr. 800/2008](32008R0800) van de Commissie van 6 augustus 2008 waarbij bepaalde
      categorieën steun op grond van de artikelen 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar
      worden verklaard (Pb L 214) die de totale kwaliteit van het bedrijventerrein ten goede komen en bestaan uit de
      renovatie van bestaande gebouwen, opknappen van private buitenruimte van bedrijven en verbeteren van de openbare
      ruimte.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i
    text: '*Projecten in de categorie duurzame mobiliteit, die zijn gericht op:*'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.1°
    text: 'de realisatie van:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.1°.a
    text: |-
      vrijliggende of verhoogde fietspaden die verhard zijn met asfalt en die woon- of verblijfsgebieden verbinden met
      werkgebieden of woonkernen met meer dan 50 000 inwoners, of die de bereikbaarheid per fiets van Transferia, P&R
      terreinen, OV-stations of OV-halteplaatsen, kantoren- of bedrijventerreinen, scholen, medische- en zorginstellingen
      of toeristische attracties vergroten, of die onderdeel uitmaken van het landelijk fietsroutenetwerk (zoals
      aangegeven in de Nota Ruimte, Kamerstukken II 2004-2005, 29435, nrs.1-2), of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.1°.b
    text: overdekte fietsenstallingen of de aanschaf van fietsen voor niet-commercieel gemeenschappelijk gebruik;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.2°
    text: 'de aanschaf van:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.2°.a
    text: |-
      niet-railgebonden duurzame voertuigen voor goederenvervoer over de openbare weg en voor openbaar personenvervoer
      voor meer dan 8 passagiers, die voorzien zijn van een hybride of elektrisch systeem of een brandstofcelsysteem voor
      aandrijving, of uitsluitend rijden op waterstof of een waterstof/aardgas mengsel (met meer dan 10% waterstof);
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.2°.b
    text: |-
      duurzame vaartuigen voor openbaar personenvervoer voor meer dan 8 personenop binnenwateren, die voorzien zijn van
      een hybride of elektrisch systeem of een brandstofcelsysteem voor aandrijving of uitsluitend varen op waterstof of
      een waterstof/aardgas mengsel (met meer dan 10% waterstof);
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.3°
    text: |-
      investeringen in geluid- en emissiearme mobiele werktuigen die voorzien zijn van hydraulische systemen met
      biologisch afbreekbare, niet-toxische olie, en bestaande uit:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.3°.a
    text: |-
      geluid- en emissiearme mobiele machines zoals omschreven in de categorie A5000 van de vigerende Milieulijst, en met
      een geluidsvermogen van ten minste 1dB(A)/1pW lager dan gesteld in de Milieulijst; of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.3°.b
    text: |-
      vuilniswagens, met een hybride aandrijving, of voldoende aan de luchtemissie-eisen voor emissiearme mobiele
      machines zoals gesteld in de vigerende Milieulijst en, met in beide gevallen een geluidsvermogen van maximaal
      96 dB(A)/1 pW; of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.3°.c
    text: |-
      kolkenzuigers waarvan de pomp wordt aangedreven door de aftakas, met een hybride aandrijving, of voldoende aan
      de luchtemissie-eisen voor emissiearme mobiele machines zoals gesteld in de vigerende Milieulijst en, in beide
      gevallen met een geluidsvermogen van maximaal 98 dB(A) /1 pW; of
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.3°.d
    text: |-
      zelfrijdende straatveegmachines, met een hybride aandrijving, of indien het voertuig een dieselmotor heeft, deze is
      voorzien van een roetfilter en, met in beide gevallen een geluidsvermogen van maximaal 83+11logP;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.4°
    text: |-
      het realiseren van vulstations voor alternatieve milieuvriendelijke brandstoffen, te weten aardgas, biogas,
      waterstof en een waterstof/aardgas mengsel, met meer dan 10% waterstof, voor de afgifte aan voertuigen en
      vaartuigen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.i.5°
    text: |-
      nieuwe binnenvaartschepen die bestemd zijn voor het vervoer van goederen of personen en die voldoen aan de eisen
      die gesteld zijn in de [bijlage 3][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0027439
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0027439
  - number: 2.j
    text: 'projecten in de categorie duurzame waterketens:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.1°
    text: 'die gericht zijn op het:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.1°.a
    text: |-
      gescheiden afvoeren en infiltreren, met uitzondering van diepte-infiltratie, van regenwater, gevallen op verharde
      oppervlakken binnen de bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.1°.b
    text: |-
      gescheiden afvoeren en opslaan voor gebruik als proceswater, met uitzondering van gebruik in de land- en tuinbouw,
      van regenwater, gevallen op verharde oppervlakken;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.1°.c
    text: |-
      gescheiden afvoeren voor lozing op oppervlaktewater van regenwater, gevallen op verharde oppervlakken binnen de
      bebouwde kom;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°
    text: 'die zijn gericht op waterbehandeling op innovatieve en duurzame wijze en bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.a
    text: de bereiding van drinkwater uitgaande van afvalwaterstromen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.b
    text: de bereiding van drinkwater;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.c
    text: |-
      de behandeling van afvalwater ter realisatie van een gesloten watersysteem binnen de inrichting, met uitzondering
      van de gangbare technieken voor voedingswater in de tuinbouw ter vervanging van niet gesloten systemen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.d
    text: |-
      de behandeling van afvalwater gericht op het terugwinnen en hergebruik van de in het afvalwater aanwezige stoffen,
      ter vervanging van een bestaand systeem dat werkt zonder een dergelijke terugwinning en hergebruik;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.e
    text: |-
      de behandeling van afvalwater, dan wel bereiding van drinkwater waarbij een reductie van ten minste 50% in het
      energiegebruik wordt gerealiseerd ten opzichte van de bestaande of te vervangen installatie, bij gelijkblijvende of
      verbeterde zuiveringsresultaten;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.j.2°.f
    text: |-
      de behandeling van afvalwater verontreinigd met prioritaire stoffen waarbij een reductie van ten minste 50% van
      de effluentwaarde van deze stoffen wordt gerealiseerd ten opzichte van de effluentwaarde van deze stoffen van de
      bestaande of te vervangen installatie.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: 2.k
    text: |-
      andere innovatieve en hoogwaardige projecten die naar zijn oordeel in het belang zijn van de bescherming van het
      milieu, waaronder natuur en bos.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel2
  - number: '3.1'
    text: |-
      Een verklaring kan slechts worden aangevraagd door en afgegeven worden aan een kredietinstelling of een
      beleggingsinstelling als bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], die
      voornemens is in belangrijke mate bij te dragen aan het verstrekken van kredieten ten behoeve van het project dan
      wel het direct of indirect beleggen van vermogen in het project.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '3.2'
    text: |-
      Een aanvraag voor projecten als bedoeld in [artikel 2, onderdelen a tot en met d][ref1], wordt ingediend bij
      de Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit en voor andere projecten bij
      Agentschap NL.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '3.3'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier, en in overeenstemming met de procedurele
      voorwaarden vermeld bij dit formulier, dat door de Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer op aanvraag beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel3
  - number: '3.4'
    text: |-
      Aan een aanvrager kan worden verzocht een accountantsverklaring over te leggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel3
  - number: '4.1'
    text: 'Een verklaring wordt niet afgegeven op aanvragen voor:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: 4.1.a
    text: een bestaand project;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: 4.1.b
    text: een project, waarvan het projectvermogen minder bedraagt dan € 25.000;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: 4.1.c
    text: |-
      een project, indien dit tot gevolg zou hebben dat op een woning gelijktijdig een verklaring op grond van
      [artikel 2, onderdeel h, onder 3°][ref1] en een verklaring op grond van artikel 2, onderdeel h, onder 4° van
      toepassing zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 4.1.d
    text: |-
      een project, indien dit tot gevolg zou hebben dat op een bouwwerk gelijktijdig een verklaring op grond van
      [artikel 2, onderdeel h, onder 5][ref1]° en een verklaring op grond van artikel 2, onderdeel g of k, van toepassing
      zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 4.1.e
    text: |-
      een project in [artikel 2, onderdeel h, onder 7°][ref1] met een investeringsomvang van minder dan € 100 000;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 4.1.f
    text: |-
      een project waarvoor, vanwege toekenning van een financieel of ander voordeel door de overheid of de Commissie van
      de Europese Gemeenschappen uit andere hoofde dan op grond van deze regeling, een zodanig voordeel ontstaat dat het
      totale toegestane voordeel op grond van communautaire regelgeving zou overschrijden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: 4.1.g
    text: |-
      een project waarvan het niet aannemelijk is dat het enig eigen rendement heeft, subsidies van overheden en
      convenantsmiddelen daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: 4.1.h
    text: |-
      een project waarvan het te verwachten economisch rendement van het project in verhouding tot het risico zodanig is
      dat het zonder toepassing van de regeling tot stand kan komen.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: '4.2'
    text: |-
      Geen verklaring wordt afgegeven indien de aanvrager, na daartoe een verzoek ontvangen te hebben, niet binnen de
      gestelde termijn de gegevens verstrekt die van belang kunnen zijn voor de beoordeling van een project.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
  - number: '4.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op projecten als bedoeld in
      [artikel 2, onderdeel b, onder 1° en 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '4.4'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op projecten als bedoeld in
      [artikel 2, onderdeel f.3°, f.4°, g.1°, g4° of g5°][ref1], die worden uitgevoerd op of aan een woning en die
      worden uitgevoerd voor rekening en risico van de eigenaar-bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '5.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslist, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, op een volledige aanvraag binnen acht weken na de indiening ervan.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel5
  - number: '5.2'
    text: |-
      Een volledige aanvraag is een aanvraag waarbij geen aanvullende informatie nodig is voor de beoordeling van het
      project.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel5
  - number: '5.3'
    text: Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel5
  - number: '6.1'
    text: 'De verklaring geldt ten hoogste voor de levensduur van een project en heeft een duur van ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: 6.1.a
    text: |-
      dertig jaren, indien het een project betreft als bedoeld in
      [artikel 2, onderdeel a, onder 1° tot en met 7°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.1.b
    text: tien jaren voor alle andere projecten;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: 6.1.c
    text: |-
      vijftien jaren, indien het een project betreft als bedoeld in
      [artikel 2, onderdeel f, onder 3° of 4°, of onderdeel g, onder 1°, 4° of 5°][ref1], die worden uitgevoerd op
      of aan een woning en die worden uitgevoerd voor rekening en risico van de eigenaar-bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.2'
    text: De verklaring kan maximaal negen maanden na de afgifte van de verklaring in werking treden.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: '6.3'
    text: |-
      De verklaring vermeldt de aard van het project, het projectvermogen, de datum waarop de verklaring in werking
      treedt en de periode waarvoor de verklaring geldt.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: '6.4'
    text: |-
      De verklaring voor een project als bedoeld in
      [artikel 2, met uitzondering van onderdeel a onder 6° en onder 7°][ref1] vervalt indien binnen twee jaar na de
      dag van afgifte van een verklaring geen aanvang is gemaakt met de uitvoering van de werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.5'
    text: In de verklaring kunnen nadere voorwaarden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: '6.6'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel a, onder 7°][ref1], komt voor een verklaring in
      aanmerking een bedrag van:


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.6.a
    text: |-
      ten hoogste € 4.538 per hectare voor projecten als bedoeld in de bijlagen 15 tot en met 17, 24a tot en met 30,
      32 en 45 bij de Provinciale Subsidieregeling agrarisch natuurbeheer, onderscheidenlijk in de pakketten A01.01.01a
      tot en met A01.01.01g, A01.01.02a, A01.01.02b, A01.01.03a tot en met A01.01.03d, A01.01.04a1 tot en met A01.01.4b,
      A01.01.05, A01.01.06, A01.02.01a1 tot en met A01.02.01c2, A01.02.02a, A01.02.02b, A01.02.03a, A01.02.03b,
      A01.03.01a tot en met A01.03.01d, A01.03.02a Lb tot en met A01.03.02d Lb, A02.01.01, A02.02.01a tot en met
      A02.02.01c, A02.02.02a tot en met A02.02.02c, A02.02.03, L01.02.01, L01.14.01a en L01.14.01b van de provinciale
      Subsidieverordening Natuur- en Landschapsbeheer;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: 6.6.b
    text: |-
      ten hoogste € 6.808 per hectare voor projecten als bedoeld in de bijlagen 6 tot en met 14, 18, 23 en 41 tot en
      met 43 bij de Provinciale Subsidieregeling agrarisch natuurbeheer, onderscheidenlijk in de pakketten A02.01.01,
      A02.01.02, A02.01.03a, A02.01.03b, L01.02.03 en L01.09.01 van de provinciale Subsidieverordening Natuur- en
      Landschapsbeheer;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: '6.7'
    text: |-
      Het projectvermogen met betrekking tot een project als bedoeld in [artikel 2, onderdeel c, onder 1°][ref1], is
      gemaximeerd op € 100 per vierkante meter kasoppervlak, exclusief de kosten voor gelijktijdig opwekken van warmte/
      kracht of de kosten van een warmtepomp en/of warmte en koudeopslag.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.8'
    text: |-
      Het projectvermogen met betrekking tot een project als bedoeld in [artikel 2, onderdeel c, onder 3°][ref1] van de
      duurzame melkveehouderij is gemaximeerd tot € 1 000 000 per stal.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.9'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel h, onder 1°][ref1] komt voor een verklaring in
      aanmerking een bedrag van € 100 000 indien het een grondgebonden woning betreft, en een bedrag van €  65 000 indien
      het een niet grondgebonden woning betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.10'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel h, onder 2°][ref1], komt voor een verklaring in
      aanmerking een bedrag van € 1 000 per vierkante meter bruto vloeroppervlak van het gedeelte van een pand met
      woonbestemming, tot een maximum van € 100 000 per gerealiseerde woning.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.11'
    text: |-
      Voor een woning als bedoeld in [artikel 2, onderdeel h, onder 3°][ref1], komt voor een verklaring in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.11.a
    text: |-
      een bedrag van maximaal € 50 000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 3°, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.11.b
    text: |-
      een bedrag van maximaal € 100 000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 3°, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.12'
    text: |-
      Voor een woning als bedoeld in [artikel 2, onderdeel h, onder 4°][ref1], komt voor een verklaring in aanmerking
      een bedrag dat niet hoger is dan het voorgefinancierde vermogen voor de renovatie van de betreffende woning:


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.12.a
    text: |-
      maximaal € 25 000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 4°, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.12.b
    text: |-
      maximaal € 50 000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 4°, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.12.c
    text: |-
      maximaal € 100 000 voor projecten die voldoen aan de eisen zoals bedoeld in
      [artikel 2, onderdeel h, onder 4°, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.13'
    text: |-
      Ter zake van een project als bedoeld in [artikel 2, onderdeel h, onder 5°][ref1], komt voor een verklaring in
      aanmerking een bedrag van ten hoogste € 600 per vierkante meter bruto vloeroppervlak.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.14'
    text: |-
      Ter zake van een project met betrekking tot een utiliteitsgebouw als bedoeld in
      [artikel 2, onderdeel h, onder 6°][ref1], komt voor een groenverklaring in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 6.14.a
    text: maximaal € 300 per vierkante meter bruto vloeroppervlak indien het project voldoet aan niveau I;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: 6.14.b
    text: maximaal € 450 per vierkante meter bruto vloeroppervlak indien het project voldoet aan niveau II;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: 6.14.c
    text: maximaal € 600 per vierkante meter bruto vloeroppervlak indien het project voldoet aan niveau III.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
  - number: '6.15'
    text: |-
      Voor projecten als bedoeld in [artikel 2, onderdeel i, onder 2°][ref1], geldt voor alle voer- en vaartuigen in
      deze categorie dat een verklaring wordt beperkt tot 50% van het projectvermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.16'
    text: |-
      Het projectvermogen van een project onder [artikel 2, onderdeel a tot en met j][ref1], kan, indien het meer
      bedraagt dan €  35 000 000, tot dat bedrag worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '6.17'
    text: |-
      Het projectvermogen van een project onder [artikel 2, onderdeel k][ref1], wordt, indien het meer bedraagt dan €  25
      000 000, beperkt tot dat bedrag, tenzij bij besluit van de Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer in overeenstemming met de Minister van Financiën anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '7.1'
    text: |-
      Indien het bedrag dat met de verklaring, bedoeld in [artikel 2][ref1], mogelijk als een financieel of
      ander voordeel kan worden verworven, meer bedraagt dan € 7 500 000 per onderneming meldt de Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer het project overeenkomstig artikel 88, derde lid, van het
      EG-verdrag aan bij de Commissie van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '7.2'
    text: |-
      Indien het projecten betreft als bedoeld in [artikel 2, onder e, onder 2° en 3°, en onder k][ref1], meldt de
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer het project overeenkomstig artikel 88, derde
      lid, van het EG-verdrag aan bij de Commissie van de Europese Gemeenschappen, tenzij het project op grond van een
      verordening van de Commissie van de Europese Gemeenschappen is vrijgesteld van deze aanmeldingsverplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '8.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan, in overeenstemming met de Minister
      van Financiën en na overleg met de Minister van Landbouw, Natuur en Voedselkwaliteit en de Minister van Verkeer en
      Waterstaat, de verklaring intrekken indien:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: 8.1.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: 8.1.b
    text: |-
      blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van het project op grond waarvan de
      verklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: 8.1.c
    text: blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: 8.1.d
    text: niet wordt voldaan aan de voorwaarden die in de verklaring zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: 8.1.e
    text: |-
      de melding, bedoeld in [artikel 9][ref1], niet onverwijld is geschied;


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel9
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '9'
  - number: 8.1.f
    text: |-
      bij projecten als bedoeld in [artikel 2, onder h, onder 3°][ref1], de werkzaamheden niet zijn beëindigd binnen
      twee jaar na de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '8.2'
    text: Het besluit tot intrekking kan terugwerkende kracht hebben.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: '8.3'
    text: Het besluit tot intrekking wordt gezonden aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: '8.4'
    text: Een afschrift van het besluit wordt gezonden aan de projectbeheerder en aan de inspecteur van de Belastingdienst.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel8
  - number: '9'
    text: |-
      Indien de uitvoering van een project wordt gewijzigd, doet de instelling die kapitaal verschaft ten behoeve van
      een project waarvoor een verklaring is afgegeven, daarvan onverwijld melding aan de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel9
  - number: '10'
    text: |-
      Ten behoeve van de vaststelling van een verklaring is ten aanzien van de krediet- of beleggingsinstelling,
      bedoeld in [artikel 5.14, tweede lid, van de Wet inkomstenbelasting 2001][ref1], en de projectbeheerder,
      [hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2], van overeenkomstige toepassing
      inzake de verstrekking van de van belang zijnde gegevens en de daaraan verbonden rechten en plichten. Hierbij
      gelden de aan de inspecteur opgelegde verplichtingen eveneens voor de door de minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '11'
    text: |-
      Aan de in deze regeling bedoelde normen, meetvoorschriften, tests, verklaringen en certificaten worden
      gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel11
  - number: 11.a
    text: normen, meetvoorschriften en tests welke ten minste een gelijkwaardig beschermingsniveau bieden;
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel11
  - number: 11.b
    text: |-
      verklaringen en certificaten welke zijn afgegeven op basis van onderzoekingen en een beschermingsniveau bieden dat
      ten minste gelijkwaardig is aan het niveau dat met de nationale onderzoekingen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel11
  - number: '12.1'
    text: |-
      De [Regeling groenprojecten 2005][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018466
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018466
  - number: '12.2'
    text: |-
      De regeling, genoemd in het eerste lid, blijft van toepassing op projecten waarvoor voor de datum van
      inwerkingtreding van deze regeling een aanvraag voor een verklaring is ingediend.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel12
  - number: '12.3'
    text: |-
      Een verklaring, afgegeven op grond van de regeling genoemd in het eerste lid, voor een project als bedoeld in
      [artikel 2, onderdeel a, onder 7°][ref1], waarvoor


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: 12.3.a
    text: |-
      subsidie is verstrekt op grond van de Provinciale Subsidieregeling agrarisch natuurbeheer voor een tijdvak dat
      eindigt op 31 december 2009, en
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel12
  - number: 12.3.b
    text: |-
      voor bovengenoemde datum een aanvraag tot subsidieverlening is ingediend voor de in
      [artikel 2, onderdeel a, onder 7][ref1]°, bedoelde onderdelen van de provinciale Subsidieverordening Natuur
      en Landschapsbeheer, behoudt voor de toepassing van deze regeling en de regeling genoemd in het eerste lid
      zijn gelding tot de datum waarop op de aanvraag tot subsidieverlening wordt beslist. Indien de aanvraag tot
      subsidieverlening wordt afgewezen trekt de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      in overeenstemming met de Minister van Financiën en na overleg met de Minister van Landbouw, Natuur en
      Voedselkwaliteit en de Minister van Verkeer en Waterstaat, de verklaring in met terugwerkende kracht tot en met
      1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0027439#Artikel2
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0027439
        artikel: '2'
  - number: '13'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de dagtekening van de Staatscourant, waarin zij wordt
      gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel13
  - number: '14'
    text: 'Deze regeling wordt aangehaald als: Regeling groenprojecten 2010.'
    url: https://wetten.overheid.nl/BWBR0027439/2010-08-04#Artikel14
