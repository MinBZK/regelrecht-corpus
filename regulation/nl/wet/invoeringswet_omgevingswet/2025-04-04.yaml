  - number: 4.32.2
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor de aanleg of uitbreiding van een installatie als
      bedoeld in [artikel 9e, eerste lid, van de Elektriciteitswet 1998][ref2] ter voorbereiding van een inpassingsplan
      als bedoeld in [artikel 3.26 van de Wet ruimtelijke ordening][ref3] een voorbereidingsbesluit is bekendgemaakt,
      kan voor die aanleg of uitbreiding binnen een periode van een jaar en zes maanden na die inwerkingtreding een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref4] worden bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel9e
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
