        artikel: '35'
      - id: ref2
        bwb_id: BWBR0037521
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 4.35.2
    text: 'Tot het omgevingsplan onherroepelijk voorziet in:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.35
  - number: 4.35.2.a
    text: |-
      een verbod op het slopen van in ieder geval de bouwwerken van een stads- of dorpsgezicht die maken dat de groep van
      onroerende zaken van algemeen belang is wegens hun schoonheid, hun onderlinge ruimtelijke of structurele samenhang
      dan wel hun wetenschappelijke of cultuurhistorische waarde, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.35
  - number: 4.35.2.b
    text: |-
      op de karakteristieken van het beschermde stads- of dorpsgezicht afgestemde beoordelingsregels voor een
      omgevingsvergunning voor een omgevingsplanactiviteit,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.35
  - number: 4.35.3
    text: |-
      Als een aanwijzing of intrekking als bedoeld in [artikel 35, eerste lid, van de Monumentenwet 1988][ref1] zoals
      die wet luidde voor de inwerkingtreding van de [Erfgoedwet][ref2], niet van kracht is, blijft het oude recht van
      toepassing als voor de inwerkingtreding van [afdeling 2.5 van de Omgevingswet][ref3] een voorstel als bedoeld in
      [artikel 35, tweede lid, van de Monumentenwet 1988][ref4] zoals die wet luidde voor de inwerkingtreding van de
      Erfgoedwet, is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0037521
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Afdeling2.5
      [ref4]: https://wetten.overheid.nl/BWBR0004471#Artikel35
