      op grond van [artikel 5.45, eerste lid, van de Omgevingswet][ref1] is bepaald dat [artikel 16.7 van die wet][ref2]
      van toepassing is op de coördinatie van de te nemen besluiten, en


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16
