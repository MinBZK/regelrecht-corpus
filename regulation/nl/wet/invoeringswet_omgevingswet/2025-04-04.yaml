      gegeven, geldt als een ontwerp van een voorkeursbeslissing als bedoeld in [artikel 5.49 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
