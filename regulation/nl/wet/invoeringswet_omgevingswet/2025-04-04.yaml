        artikel: '19'
  - number: 4.69.3
    text: |-
      Als een aanwijzing als bedoeld in het eerste of tweede lid niet onherroepelijk is, blijft het oude recht daarop van
      toepassing tot zij onherroepelijk wordt als voor de inwerkingtreding van de [Omgevingswet][ref1] het bestuur van
      het waterschap van het voornemen tot het geven van de aanwijzing in kennis is gesteld.


