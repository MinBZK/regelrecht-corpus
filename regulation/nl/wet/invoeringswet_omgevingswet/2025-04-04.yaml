  - number: 4.105.3
    text: |-
      Het eerste lid is van toepassing tot tien jaar na de vaststelling van het inpassingsplan,
      of korter, als in het inpassingsplan een termijn is gesteld als bedoeld in
      [artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening][ref1].


