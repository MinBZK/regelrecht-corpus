    text: |-
      Een aanwijzing als bedoeld in [artikel 4.2 van de Wet ruimtelijke ordening][ref1] die voor de inwerkingtreding
      van de [Omgevingswet][ref2] van kracht is en ter uitvoering waarvan op de dag van inwerkingtreding van
      die wet nog geen ontwerpbestemmingsplan ter inzage is gelegd, geldt als een instructie als bedoeld in
      [artikel 2.33, eerste lid, en tweede lid, onder a, van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
