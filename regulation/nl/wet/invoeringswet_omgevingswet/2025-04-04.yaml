    text: |-
      Het oude recht blijft van toepassing op een overeenkomst als bedoeld in
      [artikel 6.24 van de Wet ruimtelijke ordening][ref1] als die voor de inwerkingtreding van de [Omgevingswet][ref2]
      is gesloten.


