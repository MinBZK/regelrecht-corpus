  - number: 4.103.2
    text: |-
      Als het ontwerp van een bestemmingsplan niet voor de inwerkingtreding van de [Omgevingswet][ref1] ter inzage
      is gelegd, geldt een voorbereidingsbesluit dat op grond van [artikel 3.1 van de Wet ruimtelijke ordening][ref2]
      is vastgesteld door de gemeenteraad als een voorbereidingsbesluit als bedoeld in
      [artikel 4.14, eerste lid, van de Omgevingswet][ref3]. In dat geval loopt de termijn, bedoeld in het vierde lid van
      dat artikel, vanaf de datum van inwerkingtreding van de [Omgevingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.103
    references:
