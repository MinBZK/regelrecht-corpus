    text: |-
      Als een aanwijzing niet onherroepelijk is, blijft het oude recht daarop van toepassing tot zij onherroepelijk wordt
      als voor de inwerkingtreding van [afdeling 19.4 van de Omgevingswet][ref1] het bestuur van het waterschap van het
      voornemen tot het geven van de aanwijzing in kennis is gesteld.


