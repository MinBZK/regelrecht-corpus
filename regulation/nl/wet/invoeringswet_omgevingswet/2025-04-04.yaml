  - number: 4.23.1
    text: |-
      Als voor de inwerkingtreding van [afdeling 18.1 van de Omgevingswet][ref1] een overtreding heeft plaatsgevonden,
      een overtreding is aangevangen of het gevaar voor een overtreding klaarblijkelijk dreigde, en voor de
      inwerkingtreding van die afdeling een bestuurlijke sanctie is opgelegd voor die overtreding of dreigende
      overtreding, blijft het oude recht op die bestuurlijke sanctie van toepassing tot het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling18.1
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '18.1'
  - number: 4.23.1.a
    text: de beschikking onherroepelijk is geworden en volledig is uitgevoerd of ten uitvoer is gelegd,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.1.b
    text: de beschikking is ingetrokken of is komen te vervallen, of
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.1.c
    text: 'als de beschikking gaat om de oplegging van een last onder dwangsom:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.1.c.1°
    text: de last volledig is uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.1.c.2°
    text: de dwangsom volledig is verbeurd en betaald, of
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.1.c.3°
    text: de last is opgeheven.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
  - number: 4.23.2
    text: |-
      [Afdeling 4.1][ref1] is in die gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.23
