  - number: '4.33'
    text: |-
      Tot het moment van inschrijving in het rijksmonumentenregister, bedoeld in [artikel 3.3 van de Erfgoedwet][ref1],
      of tot het moment dat vaststaat dat het monument of archeologisch monument niet in dit register wordt ingeschreven,
      wordt voor de toepassing van de Omgevingswet onder voorbeschermd rijksmonument ook verstaan een monument of
      archeologisch monument waarop [artikel 9.3, eerste lid, onder a, van de Erfgoedwet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel9
