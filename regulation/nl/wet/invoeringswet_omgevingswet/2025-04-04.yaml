        artikel: '2'
  - number: 4.70.2
    text: |-
      Als een aanwijzing niet onherroepelijk is, blijft het oude recht daarop van toepassing tot zij onherroepelijk wordt
      als voor de inwerkingtreding van [paragraaf 2.5.2 van de Omgevingswet][ref1] gedeputeerde staten of de commissaris
      van de Koning in de provincie van het voornemen tot het geven van de aanwijzing in kennis zijn of is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Paragraaf2.5.2
