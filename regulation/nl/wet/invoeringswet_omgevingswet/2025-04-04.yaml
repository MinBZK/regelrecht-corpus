  - number: 4.70.1
    text: |-
      Een aanwijzing als bedoeld in [artikel 3.13 van de Waterwet][ref1] die met toepassing van
      [artikel 5.31, derde lid, van die wet][ref2] aan gedeputeerde staten in de provincie is gegeven en onherroepelijk
      is, en waaraan nog niet uitvoering is gegeven op de wijze aangegeven in die aanwijzing, geldt als een instructie
      aan het provinciebestuur als bedoeld in [2.34, derde lid, van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel2
