        artikel: '5'
  - number: 4.44.1
    text: |-
      Als voor de inwerkingtreding van [afdeling 5.2 van de Omgevingswet][ref1] een ontwerptracébesluit ter inzage is
      gelegd, blijft het oude recht van toepassing tot het tracébesluit onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.44
    references:
      - id: ref1
        bwb_id: BWBR0037885
        afdeling: '5.2'
  - number: 4.44.2
    text: |-
      Als het tracébesluit wordt vastgesteld na de inwerkingtreding van [afdeling 5.2 van de Omgevingswet][ref1], hoeft
      geen toepassing te worden gegeven aan [artikelen 10, eerste lid, onder f, van de Tracéwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel10
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.44
