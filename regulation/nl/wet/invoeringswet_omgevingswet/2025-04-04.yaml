  - number: 4.107.2
    text: |-
      Als de voorbereiding van een inpassingsplan voor de inwerkingtreding van de [Omgevingswet][ref1] in
      een vergevorderd stadium is, geen ontwerp van het inpassingsplan ter inzage is gelegd en is voldaan aan
      [artikel 5.48, eerste lid, van de Omgevingswet][ref2], kan binnen een periode van een jaar en zes maanden na
      dat tijdstip een projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref3] worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5
