      Experimenten die op grond van [artikel 2.4 van de Crisis- en herstelwet][ref1] zijn aangewezen en
      waarvan de tijdsduur niet is verstreken, berusten na de inwerkingtreding van de [Omgevingswet][ref2] op
      [artikel 23.3 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel23
