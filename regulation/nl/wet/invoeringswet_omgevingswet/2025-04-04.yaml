    text: |-
      Een aanwijzing als bedoeld in [artikel 4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref1]
      die voor de inwerkingtreding van de [Omgevingswet][ref2] van kracht is en ter uitvoering waarvan
