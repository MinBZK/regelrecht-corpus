  - number: 4.24.1
    text: |-
      De landelijke voorziening, bedoeld in [artikel 7.6 van de Wet algemene bepalingen omgevingsrecht][ref1], blijft tot
      een bij koninklijk besluit te bepalen tijdstip in stand om de ingediende aanvragen, bedoeld in [artikel 4.3][ref2],
      te kunnen verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.24
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 4.24.2
    text: Het oude recht blijft tot dat tijdstip op die voorziening van toepassing.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.24
  - number: 4.25.1
    text: |-
      De landelijke voorziening, die krachtens de [Wet ruimtelijke ordening][ref1] is ingesteld, blijft tot een bij
      koninklijk besluit te bepalen tijdstip in stand om de daarin opgenomen visies, plannen, besluiten en verordeningen:


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: 4.25.1.a
    text: te raadplegen,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
  - number: 4.25.1.b
    text: |-
      te wijzigen op grond van [artikel 4.4][ref1] of [4.6, tweede lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
    references:
