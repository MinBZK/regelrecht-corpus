        artikel: '3'
  - number: 4.105.2
    text: |-
      Het eerste lid is niet van toepassing voor zover een instructieregel als bedoeld in [artikel 2.22 ][ref1]of
      [2.24 van de Omgevingswet][ref2] of een instructie als bedoeld in [artikel 2.33][ref3] of
      [2.34 van de Omgevingswet][ref4] het stellen van dergelijke regels vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2
