        artikel: '2'
  - number: 4.73.1
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] een aanvraag om een vergunning of tot wijziging van een
      vergunning is ingediend waarop [artikel 6.27, eerste lid, van de Waterwet][ref2] van toepassing is en de aanvraag
      voor de betrokken andere benodigde vergunning, bedoeld in die bepaling, binnen zes weken na de indiening van de
      eerstbedoelde aanvraag, maar na de inwerkingtreding van de [Omgevingswet][ref3] is ingediend, is op beide aanvragen
      de Omgevingswet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.73
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0037885
  - number: 4.73.2
    text: |-
      [Artikel 4.3][ref1] is in dat geval niet van toepassing op de eerstbedoelde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.73
    references:
