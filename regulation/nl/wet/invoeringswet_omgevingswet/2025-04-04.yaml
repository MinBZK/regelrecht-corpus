  - number: 4.69.2
    text: |-
      Een aanwijzing van de commissaris van de Koning in de provincie als bedoeld in [artikel 3.12 van de Waterwet][ref1]
      die met toepassing van [artikel 5.31, tweede lid, van die wet][ref2], aan het bestuur van een waterschap is gegeven
      en onherroepelijk is, en waaraan nog niet uitvoering is gegeven op de wijze aangegeven in die aanwijzing, geldt als
      een instructie aan het waterschapsbestuur als bedoeld in [artikel 19.16, tweede lid, van de Omgevingswet][ref3].


