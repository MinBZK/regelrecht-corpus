  - number: '4.42'
    text: |-
      Een startbeslissing als bedoeld in [artikel 2, eerste lid, van de Tracéwet][ref1] waarvan kennis is gegeven, geldt
      als een voornemen als bedoeld in [artikel 5.47, eerste lid, van de Omgevingswet][ref2]. De artikelen 5.47, derde en
      vierde lid, en [5.48, tweede en derde lid, van de Omgevingswet][ref3] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5
