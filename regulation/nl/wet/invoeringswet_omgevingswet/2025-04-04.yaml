        paragraaf: 4.2.1
        afdeling: '4.2'
  - number: 4.25.1.c
    text: |-
      voor zover daarin regels voor een locatie zijn opgenomen, gedeeltelijk te laten vervallen op grond van artikel
      22.6, tweede lid, van de Omgevingswet, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
  - number: 4.25.1.d
    text: beschikbaar en toegankelijk te houden via www.ruimtelijkeplannen.nl en het unieke identificatienummer.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
  - number: 4.25.2
    text: Het oude recht blijft tot dat tijdstip op die voorziening van toepassing.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.25
  - number: 4.26.1
    text: |-
      Een erkenning van het openbaar belang van een openbaar werk als bedoeld in
      [artikel 1 van de Belemmeringenwet Privaatrecht][ref1] die onherroepelijk is, geldt als grondslag voor het opleggen
      van een gedoogplichtbeschikking als bedoeld in [artikel 10.21, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001936#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel10
