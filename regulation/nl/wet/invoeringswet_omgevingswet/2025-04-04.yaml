  - number: 4.104a.2
    text: |-
      Als het ontwerp van het bestemmingsplan, bedoeld in het eerste lid, niet voor de inwerkingtreding van de
      [Omgevingswet][ref1] ter inzage is gelegd, geldt het luchthavenindelingbesluit, het luchthavenbesluit of
      het besluit beperkingengebied buitenlandse luchthaven, bedoeld in dat lid, als een voorbereidingsbesluit als
      bedoeld in [artikel 4.16, tweede lid, van de Omgevingswet][ref2] respectievelijk als een voorbereidingsbesluit
      als bedoeld in artikel 4.16, eerste lid, van die wet als het gaat om een luchthavenbesluit als bedoeld in
      [artikel 8.43, eerste lid, van de Wet luchtvaart][ref3]. In afwijking van artikel 4.16, vijfde lid, van de
      Omgevingswet eindigt de gelding als voorbereidingsbesluit alleen op het tijdstip waarop het overeenkomstig
      het luchthavenindelingbesluit, het luchthavenbesluit of het besluit beperkingengebied buitenlandse luchthaven
      gewijzigde omgevingsplan in werking treedt of is vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
