  - number: '4.113'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] kosten zijn gemaakt als bedoeld in [artikel 6.8][ref2] of
      [6.9 van de Wet ruimtelijke ordening][ref3], blijft het oude recht van toepassing tot het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.113
