  - number: 4.69.1
    text: |-
      Een aanwijzing als bedoeld in a[rtikel 3.12 van de Waterwet][ref1] die met toepassing van
      [artikel 5.31, eerste lid, van die wet][ref2], aan het bestuur van een waterschap is gegeven en onherroepelijk is,
      en waaraan nog niet uitvoering is gegeven op de wijze aangegeven in die aanwijzing, geldt als een instructie aan
      het waterschapsbestuur als bedoeld in [artikel 19.16, eerste lid, van de Omgevingswet][ref3].


