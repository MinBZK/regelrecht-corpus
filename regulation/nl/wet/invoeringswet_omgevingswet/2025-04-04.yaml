  - number: 4.72.1
    text: |-
      Een verbod als bedoeld in [artikel 6.10, eerste lid, van de Waterwet][ref1] dat onherroepelijk is, geldt als een
      verbod als bedoeld in [artikel 2.40, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
