    text: 'Een gemeentelijk plan met maatregelen:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.100
  - number: 4.100.a
    text: |-
      dat is gericht op het bereiken van een in [bijlage 2 bij de Wet milieubeheer][ref1], zoals die wet luidde voor de
      inwerkingtreding van de [Omgevingswet][ref2], opgenomen grenswaarde op een bij dat plan aangewezen locatie,


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.100
