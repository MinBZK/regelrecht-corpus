  - number: 4.27.1
    text: |-
      Als voor de inwerkingtreding van [afdeling 10.3 van de Omgevingswet][ref1] mededeling is gedaan en kennis is gegeven
      van de terinzagelegging in overeenstemming met [artikel 2, tweede lid, van de Belemmeringenwet Privaatrecht][ref2],
      blijft het oude recht van toepassing tot een besluit als bedoeld in [artikel 1][ref3], [2, vijfde lid][ref4], of
      [3, tweede lid, van die wet][ref5] onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling10.3
      [ref2]: https://wetten.overheid.nl/BWBR0001936#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001936#Artikel1
