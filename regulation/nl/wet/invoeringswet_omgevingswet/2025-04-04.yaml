  - number: 4.105.1
    text: |-
      In het omgevingsplan worden door de gemeenteraad en het dagelijks bestuur van het waterschap geen regels gesteld
      die in strijd zijn met het inpassingsplan, bedoeld in [artikel 3.26 van de Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.105
