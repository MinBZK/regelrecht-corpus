        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: '4.74'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 7.7][ref1] en
      [7.8, tweede lid en derde lid, tweede zin, van de Waterwet][ref2], blijft van toepassing op de belastingtijdvakken
      die voor de inwerkingtreding van de [Omgevingswet][ref3] zijn aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.74
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0037885
  - number: '4.75'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] kosten zijn gemaakt als bedoeld in
      [artikel 7.17, tweede lid, van de Waterwet][ref2], blijft het oude recht van toepassing tot het tijdstip waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.75
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 4.75.a
    text: |-
      het besluit tot oplegging van een verplichting tot vergoeding van die kosten of het besluit tot invordering van die
      kosten onherroepelijk wordt, of
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.75
  - number: 4.75.b
    text: de verschuldigde kosten volledig zijn betaald.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.75
  - number: 4.76.1
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] schade aan een onroerende zaak als bedoeld in
      [artikel 7.18 van de Waterwet][ref2] is ontstaan, blijft het oude recht van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 4.76.2
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] een vordering:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 4.76.2.a
    text: |-
      op grond van [artikel 7.18, tweede lid, van de Waterwet][ref1] is ingediend, blijft het oude recht van toepassing
      tot het tijdstip waarop het vonnis in kracht van gewijsde is gegaan en, bij toewijzing van die vordering, de
      toegewezen schadevergoeding volledig is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 4.76.2.b
    text: |-
      op grond van[ artikel 7.18, derde lid, van de Waterwet][ref1] is ingediend, blijft het oude recht van toepassing
      tot het tijdstip waarop het vonnis in kracht van gewijsde is gegaan en, bij toewijzing van die vordering:


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 4.76.2.b.1°
    text: de eigendom van de onroerende zaak is overgenomen, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
  - number: 4.76.2.b.2°
    text: de overnemingssom volledig is betaald.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
  - number: 4.76.3
    text: |-
      Als het tijdstip waarop de schade aan een onroerende zaak is ontstaan niet of niet binnen een redelijke termijn kan
      worden vastgesteld, is op de vordering op grond van [artikel 7.18, tweede of derde lid, van de Waterwet][ref1], de
      Omgevingswet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.76
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7'
  - number: '4.77'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] schade aan waterstaatswerken als bedoeld in
      [artikel 7.21, eerste lid, van de Waterwet][ref2] is ontstaan, blijft het oude recht van toepassing op het verhalen
      van de kosten voor die schade.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.77
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
  - number: '4.78'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] verontreiniging of aantasting van de bodem of oever
      van een oppervlaktewaterlichaam als bedoeld in [artikel 7.22 van de Waterwet][ref2] is ontstaan en een vordering
      daarvoor is ingesteld, blijft het oude recht van toepassing op het verhalen van de kosten van die verontreiniging
      of aantasting.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.78
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '7'
  - number: 4.79.1
    text: |-
      Op de voorbereiding en vaststelling van de beschikking op een aanvraag met betrekking tot de eerste fase van
      een omgevingsvergunning als bedoeld in [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref1] zijn
      de artikelen 2.5, vijfde, zesde en achtste lid, en [6.3 van die wet][ref2] niet van toepassing, als die aanvraag
      voor de inwerkingtreding van de [Omgevingswet][ref3] is ingediend en de beschikking op die aanvraag nog niet
      onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0037885
  - number: 4.79.2
    text: |-
      Een beschikking waarbij voor de inwerkingtreding van de [Omgevingswet][ref1] positief en onherroepelijk
      is beslist op de aanvraag met betrekking tot de eerste fase van een omgevingsvergunning als bedoeld in
      [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref2] treedt in werking als op dat tijdstip geen
      aanvraag is ingediend voor de beschikking met betrekking tot de tweede fase, en geldt die beschikking met
      betrekking tot de eerste fase als een omgevingsvergunning voor de betrokken activiteit voor zover voor die
      activiteit een omgevingsvergunning als bedoeld in [afdeling 5.1 van de Omgevingswet][ref3] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.1
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037885
        afdeling: '5.1'
  - number: 4.79.3
    text: |-
      Als de aanvraag met betrekking tot de tweede fase van een omgevingsvergunning voor de inwerkingtreding
      van de [Omgevingswet][ref1] is ingediend en een beschikking op die aanvraag nog niet onherroepelijk
      is, blijft het oude recht van toepassing op de voorbereiding en vaststelling van de beschikking
      op een aanvraag met betrekking tot de tweede fase van een omgevingsvergunning als bedoeld in
      [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.79
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
