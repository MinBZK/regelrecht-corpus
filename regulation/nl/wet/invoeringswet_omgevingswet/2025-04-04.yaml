      uitvoer is gelegd, geldt als een maatregel als bedoeld in [artikel 19.15 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel19
