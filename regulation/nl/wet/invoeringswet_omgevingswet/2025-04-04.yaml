  - number: 4.107.1
    text: |-
      Als de voorbereiding van een inpassingsplan als bedoeld in [artikel 3.26][ref1] of
      [3.28 van de Wet ruimtelijke ordening][ref2] voor de inwerkingtreding van de [Omgevingswet][ref3] is
      aangevangen, geen ontwerp van het inpassingsplan ter inzage is gelegd en is voldaan aan de bij of krachtens
      de [artikelen 5.47][ref4] en [5.48 van de Omgevingswet][ref5] gestelde vereisten, kan een ontwerp van een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref6] ter inzage worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037885
