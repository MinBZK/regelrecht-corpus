      Voor de op grond van het tweede lid aangewezen projecten kan na het in dat lid bedoelde tijdstip een ontwerp van
      een projectbesluit ter inzage worden gelegd. De [artikelen 5.47 tot en met 5.49 van de Omgevingswet][ref1] zijn
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.45
