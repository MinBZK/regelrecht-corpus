  - number: 4.103.1
    text: |-
      Als het ontwerp van een bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref1]
      waarvoor op grond van [artikel 3.7 van de Wet ruimtelijke ordening][ref2] of [artikel 4.2, derde lid][ref3], of
      [4.4, derde lid van die wet][ref4], in samenhang met artikel 3.7 van die wet, een voorbereidingsbesluit is genomen,
      voor de inwerkingtreding van de [Omgevingswet][ref5] ter inzage is gelegd, blijft op dat voorbereidingsbesluit het
      oude recht van toepassing tot het plan van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.103
