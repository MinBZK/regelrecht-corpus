      die voor de inwerkingtreding van de [Omgevingswet][ref2] van kracht is en ter uitvoering
      waarvan nog geen ontwerpbesluit tot vaststelling of wijziging van een verordening als bedoeld in
      [artikel 4.1 van de Wet ruimtelijke ordening][ref3] ter inzage is gelegd, geldt als een instructie als bedoeld in
