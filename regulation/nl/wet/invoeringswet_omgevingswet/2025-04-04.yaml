    text: |-
      Een melding als bedoeld in [artikel 5.30, tweede of derde lid, van de Waterwet][ref1] die voor
      de inwerkingtreding van de [Omgevingswet][ref2] is gedaan, geldt als een melding als bedoeld in
      [artikel 19.15, tweede lid, van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel19
