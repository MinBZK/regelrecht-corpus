    text: |-
      het besluit op het verzoek om vergoeding van die kosten, het besluit tot oplegging van een verplichting tot
      vergoeding van die kosten of het besluit tot invordering van die kosten onherroepelijk wordt, of
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.113
  - number: 4.113.b
    text: de verschuldigde kosten volledig zijn betaald.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.113
  - number: 4.114.1
    text: |-
      Een welstandsnota als bedoeld in [artikel 12a, eerste lid, van de Woningwet][ref1] die van kracht is, geldt als een
      beleidsregel als bedoeld in [artikel 4.19 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
