      wijziging van de vergunning krachtens [artikel 6.2 van de Waterwet][ref3] is ingediend binnen de in
      [artikel 3.18, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref4] genoemde termijn van zes weken na
      de indiening van de eerstbedoelde aanvraag, maar na de inwerkingtreding van de Omgevingswet, is op beide aanvragen
