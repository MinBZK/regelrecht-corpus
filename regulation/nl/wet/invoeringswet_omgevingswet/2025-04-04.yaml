      Een projectuitvoeringsbesluit als bedoeld in [artikel 2.10, eerste lid][ref1], of
      [2.10a van de Crisis- en herstelwet][ref2] dat onherroepelijk is, geldt als een omgevingsvergunning voor een tot
      het project behorende activiteit als bedoeld in [afdeling 5.1 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.1
