  - number: 4.72.2
    text: |-
      Een beperking als bedoeld in [artikel 6.10, eerste lid, van de Waterwet][ref1] die onherroepelijk is, geldt als een
      beperking als bedoeld in [artikel 2.40, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.72
