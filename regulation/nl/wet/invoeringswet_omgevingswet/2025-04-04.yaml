      bedoeld in [artikel 9 van de Planwet verkeer en vervoer][ref2] en een structuurvisie als bedoeld in
      [artikel 2.1, eerste lid, van de Wet ruimtelijke ordening][ref3], blijven gelden totdat een gemeentelijke
      omgevingsvisie van kracht wordt.


