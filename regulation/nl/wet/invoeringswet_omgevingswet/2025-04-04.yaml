        artikel: '6'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '5'
  - number: 4.43.2
    text: |-
      Een structuurvisie als bedoeld in [artikel 2, vierde lid, van de Tracéwet][ref1] waarvan kennis is gegeven, geldt
      als een voorkeursbeslissing als bedoeld in [artikel 5.49 van de Omgevingswet][ref2].


