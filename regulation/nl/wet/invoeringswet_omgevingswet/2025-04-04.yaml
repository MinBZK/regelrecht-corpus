  - number: 4.67.1
    text: |-
      Een calamiteitenplan als bedoeld in [artikel 5.29 van de Waterwet][ref1], dat van kracht is, geldt als een
      calamiteitenplan als bedoeld in [artikel 19.14 van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel19
