        bwb_id: BWBR0006147
        artikel: '10'
  - number: 4.45.1
    text: |-
      [Artikel 4.44][ref1] is van overeenkomstige toepassing op door Onze Minister van Infrastructuur
      en Waterstaat bij ministeriële regeling aan te wijzen projecten waarvan van de beslissing
      als bedoeld in [artikel 2, eerste lid, van de Tracéwet][ref2] voor de inwerkingtreding van
      [afdeling 5.2 van de Omgevingswet][ref3] kennis is gegeven en waarvan de verkenning in een vergevorderd stadium is,
      als voor het project binnen een jaar na de inwerkingtreding van de [Omgevingswet][ref4] een ontwerptracébesluit ter
      inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Afdeling5.2
      [ref4]: https://wetten.overheid.nl/BWBR0037885
