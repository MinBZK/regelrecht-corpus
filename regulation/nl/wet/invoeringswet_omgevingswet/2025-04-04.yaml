  - number: 4.66.3
    text: |-
      Een maatregel of voorziening als bedoeld in [artikel 5.17, eerste lid, van de Waterwet][ref1] die
      van kracht is en die nog niet volledig ten uitvoer is gelegd, geldt als een maatregel als bedoeld in
      [artikel 19.4, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel19
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.66
