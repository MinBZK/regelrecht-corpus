        bwb_id: BWBR0037885
        artikel: '19'
  - number: 4.67.2
    text: |-
      Als een ontwerp van een calamiteitenplan voor de inwerkingtreding van de [Omgevingswet][ref1] voor commentaar is
      gezonden aan de besturen van de veiligheidsregio als bedoeld in [artikel 5.29, derde lid, van de Waterwet][ref2],
      blijft het oude recht van toepassing tot het calamiteitenplan van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel5
