  - number: 4.28.1
    text: |-
      Als de in [artikel 2.3, zevende lid, van de Crisis- en herstelwet][ref1] bedoelde termijn van tien jaar is
      verstreken en op dat moment niet wordt voldaan aan een wettelijk voorschrift gesteld bij of krachtens een in
      [artikel 23.3, eerste lid, van de Omgevingswet][ref2] genoemde wet:


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0027431
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '23'
  - number: 4.28.1.a
    text: |-
      neemt degene die het experiment uitvoert de nodige maatregelen om zo spoedig mogelijk alsnog aan dat voorschrift te
      voldoen, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.28
  - number: 4.28.1.b
    text: |-
      kan het college van burgemeester en wethouders een aanwijzing geven tot het treffen van maatregelen als bedoeld
      onder a.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.28
  - number: 4.28.2
    text: |-
      Als de te nemen maatregelen niet toereikend zijn, kan Onze Minister besluiten om het experiment te beëindigen. Aan
      dat besluit kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.28
  - number: '4.29'
    text: |-
      Op een provinciaal inpassingsplan als bedoeld in [artikel 2.3a van de Crisis- en herstelwet][ref1] zijn de
      [artikelen 4.28][ref2], [4.104][ref3] en [4.105][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043660#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.29
