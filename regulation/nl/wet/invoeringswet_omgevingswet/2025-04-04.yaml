        bwb_id: BWBR0037885
        artikel: '5'
  - number: '4.46'
    text: |-
      Op de tracébesluiten voor de Blankenburgverbinding en de ViA15, bedoeld in
      [artikel 3 van de Wet tijdelijke tolheffing Blankenburgverbinding en ViA15][ref1], die onherroepelijk zijn, blijft
      die wet van toepassing voor zover de besluiten betrekking hebben op tolheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0037517
        artikel: '3'
  - number: 4.47.1
    text: 'Een tracébesluit geldt als een projectbesluit waarin uitdrukkelijk is bepaald dat het geldt als:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
  - number: 4.47.1.a
    text: |-
      een omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit, voor zover het in strijd is met het
      omgevingsplan,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
  - number: 4.47.1.b
    text: |-
      een omgevingsvergunning voor een omgevingsplanactiviteit, voor zover voor de uitvoering van werken of werkzaamheden
      op grond van het omgevingsplan een omgevingsvergunning kan worden verleend,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
  - number: 4.47.1.c
    text: |-
      een verkeersbesluit als bedoeld in [artikel 15 van de Wegenverkeerswet 1994][ref1], voor zover ter uitvoering van
      het besluit handelingen worden verricht waarvoor krachtens dat artikel een verkeersbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 4.47.2
    text: |-
      Voor zover een aanvraag om een omgevingsvergunning voor een omgevingsplanactiviteit betrekking heeft op het gebied
      dat is begrepen in een tracébesluit wordt de omgevingsvergunning geweigerd als de activiteit in strijd is met het
      projectbesluit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
  - number: 4.47.3
    text: |-
      Voor zover een tracébesluit niet in strijd is met het omgevingsplan, wordt het tracébesluit voor de toepassing van
      [artikel 11.6 van de Omgevingswet][ref1] als een onteigeningsbelang aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel11
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.47
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '11'
  - number: 4.48.1
    text: |-
      Als handelingen waarop het tracébesluit betrekking heeft de kwaliteit van de natuurlijke habitats en de habitats
      van soorten in een Natura 2000-gebied als bedoeld in de [Wet natuurbescherming][ref1] kunnen verslechteren of
      een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen, gelet op de
      instandhoudingsdoelstelling voor dat gebied, geldt het tracébesluit als een projectbesluit dat geldt als een
      vergunning als bedoeld in [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.48
    references:
      - id: ref1
        bwb_id: BWBR0037552
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 4.48.2
    text: |-
      Het eerste lid is niet van toepassing als ten aanzien van het project of de
      andere handeling waarop het tracébesluit betrekking heeft, is voldaan aan
      [artikel 2.9, eerste, tweede, derde of vijfde lid, van de Wet natuurbescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.48
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 4.49.1
    text: |-
      Voor het gebied dat is begrepen in een tracébesluit geldt het tracébesluit als een voorbereidingsbesluit als
      bedoeld in [artikel 4.14, eerste lid, van de Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 4.49.2
    text: |-
      In afwijking van [artikel 4.14, vierde lid, van de Omgevingswet][ref1] vervallen de voorbeschermingsregels in
      het omgevingsplan op het tijdstip waarop een omgevingsplan in overeenstemming met het tracébesluit van kracht is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 4.50.1
    text: |-
      In afwijking van [artikel 13, tiende lid, van de Tracéwet][ref1], wordt het omgevingsplan, nadat het
      tracébesluit onherroepelijk is geworden, met het tracébesluit in overeenstemming gebracht uiterlijk op het in
      artikel 22.5 van de Omgevingswet bedoelde tijdstip, of uiterlijk vijf jaar na het onherroepelijk worden van
      het tracébesluit, als het tracébesluit korter dan vijf jaar voor bedoeld tijdstip onherroepelijk is geworden.
      [Artikel 2.8 van de Omgevingswet][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.50
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 4.50.2
    text: |-
      Voor zover een ontwerp van een omgevingsplan zijn grondslag vindt in het tracébesluit kunnen zienswijzen geen
      betrekking hebben op dat deel van het ontwerpplan.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.50
  - number: 4.50.3
    text: |-
      Zolang het omgevingsplan nog niet in overeenstemming is met het tracébesluit verleent het college van burgemeester
      en wethouders aan degenen die inzage verlangen in dat plan ook inzage in het tracébesluit.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.50
  - number: '4.51'
    text: |-
      Op de coördinatie van besluiten ter uitvoering van een tracébesluit is [artikel 16.7 van de Omgevingswet ][ref1]van
      toepassing, tenzij het gaat om besluiten waarvoor al toepassing is gegeven aan [artikel 20 van de Tracéwet][ref2].
      [Artikel 16.87, derde lid, van de Omgevingswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel16
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '16'
  - number: '4.52'
    text: |-
      Een leidraad als bedoeld in [artikel 2.6 van de Waterwet][ref1] die van kracht is, geldt als een leidraad als
      bedoeld in [artikel 2.19, tweede lid, onder d, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '4.53'
    text: |-
      Een kaart als bedoeld in [artikel 2.7, tweede lid, van de Waterwet][ref1] die van kracht is, geldt als een kaart
      als bedoeld in [artikel 20.17, eerste lid, onder b, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel20
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '20'
  - number: 4.54.1
    text: |-
      Een aanwijzing als bedoeld in [artikel 3.12 van de Waterwet][ref1] die onherroepelijk is en waaraan nog niet
      uitvoering is gegeven op de wijze aangegeven in die aanwijzing, geldt als een instructie aan het waterschapsbestuur
      als bedoeld in [artikel 2.33, tweede lid, onder b, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 4.54.2
    text: |-
      Een aanwijzing als bedoeld in [artikel 3.12 van de Waterwet][ref1] die onherroepelijk is en die betrekking heeft
      op een projectplan vastgesteld in overeenstemming met paragraaf 5.2 van de Waterwet, en waaraan nog niet uitvoering
      is gegeven op de wijze aangegeven in die aanwijzing, geldt als een instructie aan het dagelijks bestuur van een
      waterschap als bedoeld in [artikel 2.33, tweede lid, onder c, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 4.54.3
    text: |-
      Als een aanwijzing als bedoeld in het eerste of tweede lid niet onherroepelijk is, blijft het oude recht daarop van
      toepassing als voor de inwerkingtreding van de [Omgevingswet][ref1] het waterschapsbestuur of het dagelijks bestuur
      van het waterschap van het voornemen tot het geven van de aanwijzing in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.54
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 4.55.1
    text: |-
      Een aanwijzing als bedoeld in [artikel 3.13 van de Waterwet][ref1] die onherroepelijk is en waaraan nog niet
      uitvoering is gegeven op de wijze aangegeven in die aanwijzing, geldt als een instructie aan het provinciebestuur
      of het waterschapsbestuur als bedoeld in [artikel 2.34, derde lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: 4.55.2
    text: |-
      Als een aanwijzing niet onherroepelijk is, blijft het oude recht daarop van toepassing als voor de inwerkingtreding
      van de [Omgevingswet][ref1] het waterschapsbestuur of het provinciebestuur van het voornemen tot het geven van de
      aanwijzing in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 4.56.1
    text: |-
      Een stroomgebiedbeheerplan als bedoeld in [artikel 4.1, derde lid, onder a, van de Waterwet][ref1], dat strekt ter
      uitvoering van artikel 13 van de kaderrichtlijn water, en van kracht is, geldt als een stroomgebiedsbeheerplan voor
      het betreffende stroomgebiedsdistrict als bedoeld in [artikel 3.9, tweede lid, onder a, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.56.2
    text: |-
      Het deel van het nationale waterplan, bedoeld in [artikel 4.1, tweede lid, onder d, van de Waterwet][ref1], dat
      strekt ter uitvoering van de artikelen 7 en 8 van de richtlijn overstromingsrisico's, en van kracht is, geldt als
      een overstromingsrisicobeheerplan als bedoeld in [artikel 3.9, tweede lid, onder b, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.56.3
    text: |-
      Het deel van het nationale waterplan, bedoeld in [artikel 4.1, derde lid, onder b, van de Waterwet][ref1],
      dat strekt ter uitvoering van de artikelen 13 en 14 van de kaderrichtlijn mariene strategie,
      en van kracht is, geldt als een programma van maatregelen mariene strategie als bedoeld in
      [artikel 3.9, tweede lid, onder c, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.56.4
    text: |-
      Het deel van het nationale waterplan, bedoeld in [artikel 4.1, derde lid, onder b, van de Waterwet][ref1], dat
      strekt ter uitvoering van artikel 4 van de kaderrichtlijn maritieme ruimtelijke planning, en van kracht is, geldt
      als een maritiem ruimtelijk plan als bedoeld in [artikel 3.9, tweede lid, onder d, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.56.5
    text: |-
      De delen van het nationale waterplan, bedoeld in [artikel 4.1 van de Waterwet][ref1], die niet in de voorgaande
      leden zijn genoemd, die een uitwerking zijn van het te voeren waterbeleid en van kracht zijn, gelden als het
      nationaal waterprogramma, bedoeld in [artikel 3.9, tweede lid, onder e, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.56.6
    text: |-
      Als een plan of een deel ervan als bedoeld in het eerste tot en met vijfde lid niet van kracht is, blijft het oude
      recht daarop van toepassing als voor de inwerkingtreding van [artikel 3.9 van de Omgevingswet][ref1] een ontwerp
      daarvan ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.57.1
    text: |-
      Het deel van een regionaal waterplan als bedoeld in [artikel 4.4, eerste lid, van de Waterwet][ref1], dat een
      uitwerking is van het te voeren waterbeleid, en van kracht is, geldt als een regionaal waterprogramma als bedoeld
      in [artikel 3.8, tweede lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.57
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.57.2
    text: |-
      Als een regionaal waterplan niet van kracht is, blijft het oude recht van toepassing als voor de inwerkingtreding
      van [artikel 3.8 van de Omgevingswet ][ref1]een ontwerp daarvan ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.57
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.58.1
    text: |-
      Een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref1] dat betrekking heeft op regionale wateren, en van
      kracht is, geldt als een waterbeheerprogramma als bedoeld in [artikel 3.7 van de Omgevingswet.][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.58
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.58.2
    text: |-
      Een beheerplan als bedoeld in [artikel 4.6 van de Waterwet][ref1] dat betrekking heeft op
      rijkswateren, en van kracht is, geldt als een deel van het nationale waterprogramma als bedoeld in
      [artikel 3.9, tweede lid, onder e, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.58
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: 4.58.3
    text: |-
      Als een beheerplan niet van kracht is, blijft het oude recht van toepassing als voor de inwerkingtreding van
      [artikel 3.7][ref1] respectievelijk [3.9 van de Omgevingswet][ref2] een ontwerp daarvan ter inzage is gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.58
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '3'
  - number: '4.59'
    text: |-
      Een legger als bedoeld in [artikel 5.1, eerste lid, eerste zin, van de Waterwet][ref1] die van kracht is,
      geldt, voor zover daarin niet de ligging van een beschermingszone is aangegeven, als een legger als bedoeld in
      [artikel 2.39, eerste lid, van de Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.59
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '2'
  - number: '4.60'
    text: |-
      Een bij provinciale verordening gegeven vrijstelling van de verplichting tot vaststelling van een legger
      als bedoeld in [artikel 5.1, derde lid, tweede zin, van de Waterwet][ref1] die van kracht is, geldt tot
      de inwerkingtreding van een vrijstelling van de verplichting tot vaststelling van een legger voor deze
      waterstaatswerken als bedoeld in [artikel 2.39, vierde lid, van de Omgevingswet][ref2] of tot het tijdstip waarop
      blijkt dat daarvoor geen vrijstelling wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.60
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5'
