  - number: 5.1.1
    text: |-
      Als een bepaling, opgenomen in de wet, genoemd in [artikel 3.1][ref1] of [artikel 4.1][ref2], wordt vervangen door
      een bepaling in een algemene maatregel van bestuur, kan de overgangsbepaling die daarvoor nodig is, in een algemene
      maatregel van bestuur worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0043660
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
        hoofdstuk: '4'
        afdeling: '4.1'
  - number: 5.1.2
    text: |-
      Als in verband met de invoering van de [Omgevingswet][ref1] een wet, algemene maatregel van bestuur of ministeriële
      regeling wordt ingetrokken waarin een overgangsrechtelijke bepaling is opgenomen, blijft die overgangsrechtelijke
      bepaling van toepassing tot die is uitgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 5.1.3
    text: |-
      Als deze wet, [hoofdstuk 22 van de Omgevingswet][ref1], [hoofdstuk 3 van de Aanvullingswet bodem Omgevingswet][ref2],
      [hoofdstuk 3 van de Aanvullingswet geluid Omgevingswet][ref3],
      [hoofdstuk 4 van de Aanvullingswet grondeigendom Omgevingswet][ref4] of
      [hoofdstuk 2 van de Aanvullingswet natuur Omgevingswet][ref5] daarin niet voorziet of strikte toepassing van
      deze wet of die bepalingen in specifieke situaties onredelijk is of leidt tot ernstige nadelige gevolgen voor
      de fysieke leefomgeving, kunnen, zo nodig in afwijking van deze wet of die bepalingen, bij regeling van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties regels worden vastgesteld voor een goede invoering
      van de [Omgevingswet][ref6]. Een regeling die afwijkt van de genoemde aanvullingswetten wordt vastgesteld in
      overeenstemming met Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Hoofdstuk22
      [ref2]: https://wetten.overheid.nl/BWBR0043277#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0043247#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0043371#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0044063#Hoofdstuk2
      [ref6]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
        hoofdstuk: '22'
      - id: ref2
        bwb_id: BWBR0043277
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0043247
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0043371
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0044063
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0037885
  - number: 5.1.4
    text: |-
      Na de plaatsing in de Staatscourant van een krachtens het derde lid vastgestelde ministeriële regeling die afwijkt
      van deze wet of die bepalingen, wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig
      mogelijk bij de Staten-Generaal ingediend. Als het voorstel wordt ingetrokken of een van de beide kamers der
      Staten-Generaal besluit het voorstel niet aan te nemen, wordt de ministeriële regeling onverwijld ingetrokken.
      Als het voorstel tot wet wordt verheven, wordt de ministeriële regeling ingetrokken op het tijdstip van
      inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.1
  - number: 5.2.1
    text: |-
      Op de voorbereiding van een algemene maatregel van bestuur in verband met de invoering van de [Omgevingswet][ref1]
      zijn de [artikelen 23.4][ref2] en [23.5 van de Omgevingswet][ref3] van overeenkomstige toepassing. Op de
      voorbereiding van een ministeriële regeling in verband met de invoering van de Omgevingswet is artikel 23.4 van de
      Omgevingswet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel23
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '23'
  - number: 5.2.2
    text: 'De artikelen, bedoeld in het eerste lid, treden in de plaats van wettelijke voorschriften waarin is bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.a
    text: |-
      over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd of
      extern overleg moet worden gevoerd,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.b
    text: van het ontwerp van een regeling kennis moet worden gegeven,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.c
    text: |-
      de voordracht niet eerder wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.d
    text: |-
      de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.e
    text: |-
      door of namens een van de kamers der Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.2.f
    text: |-
      een regeling niet eerder in werking kan treden dan nadat sinds haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.3
    text: |-
      Het tweede lid, onder a, is niet van toepassing op het vragen van advies aan de Afdeling advisering van de Raad
      van State.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
  - number: 5.2.4
    text: |-
      Het eerste lid is niet van toepassing op de voorbereiding van een algemene maatregel
      van bestuur als bedoeld in [artikel 10.12, eerste en tweede lid][ref1], respectievelijk
      [artikel 10.15, eerste lid, van de Wet luchtvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
  - number: '5.3'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.3
  - number: '5.4'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.4
  - number: 5.5.1
    text: 'Na de inwerkingtreding van hoofdstuk 1 van:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
  - number: 5.5.1.a
    text: deze wet,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
  - number: 5.5.1.b
    text: |-
      de [Aanvullingswet geluid Omgevingswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0043247
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0043247
  - number: 5.5.1.c
    text: |-
      de [Aanvullingswet bodem Omgevingswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0043277
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0043277
  - number: 5.5.1.d
    text: de Aanvullingswet natuur Omgevingswet,
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
  - number: 5.5.1.e
    text: |-
      de [Aanvullingswet grondeigendom Omgevingswet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0043371
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0043371
  - number: 5.5.2
    text: 'Als toepassing is gegeven aan het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
  - number: 5.5.2.a
    text: |-
      wordt de tekst van de [Omgevingswet][ref1] in het Staatsblad geplaatst,


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 5.5.2.b
    text: |-
      brengt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de aanhaling van de hoofdstukken, afdelingen,
      paragrafen en artikelen van de [Omgevingswet][ref1] in de overige hoofdstukken van de wetten, genoemd in het eerste
      lid, onder a tot en met e, met de nieuwe nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 5.5.3
    text: |-
      Als toepassing is gegeven aan het tweede lid, aanhef en onder b, wordt de tekst van de betrokken hoofdstukken in
      het Staatsblad geplaatst.
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel5.5
