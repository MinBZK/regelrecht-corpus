    text: |-
      Nadere eisen als bedoeld in [artikel 3.6, eerste lid, onder d, van de Wet ruimtelijke ordening][ref1] die voor
      de inwerkingtreding van de [Omgevingswet][ref2] van kracht zijn, gelden als maatwerkvoorschriften als bedoeld in
      [artikel 4.5, eerste lid, van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
