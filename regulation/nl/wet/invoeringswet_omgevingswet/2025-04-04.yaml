      - id: ref2
        bwb_id: BWBR0037885
  - number: 4.100.b
    text: |-
      dat de gegevens, bedoeld in bijlage XV, deel A, bij [Richtlijn 2008/50/EG](32008L0050) van het Europees Parlement
      en de Raad van 21 mei 2008 betreffende de luchtkwaliteit en schonere lucht voor Europa (PbEU 2008, L 152) bevat, en
    url: https://wetten.overheid.nl/BWBR0043660/2025-04-04#Artikel4.100
  - number: 4.100.c
    text: |-
      dat na de inwerkingtreding van [artikel 3.10, eerste lid, van de Omgevingswet][ref1] van kracht is, geldt als een
      programma als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3
