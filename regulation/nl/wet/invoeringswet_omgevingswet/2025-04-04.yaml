    text: |-
      Als het ontwerp van een bestemmingsplan niet voor de inwerkingtreding van de
      [Omgevingswet][ref1] ter inzage is gelegd, geldt een voorbereidingsbesluit dat op grond van
      [artikel 4.4, derde lid, van de Wet ruimtelijke ordening][ref2] is vastgesteld door Onze Minister die het aangaat,
      in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, als een voorbereidingsbesluit
      als bedoeld in [artikel 4.16, tweede lid, van de Omgevingswet][ref3]. In dat geval loopt de termijn, bedoeld in het
      vijfde lid van dat artikel, af op het moment dat het omgevingsplan in werking treedt of is vernietigd.


