      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] een aanvraag om een vergunning of tot wijziging van een
      vergunning is ingediend waarop [artikel 6.27, eerste lid, van de Waterwet][ref2] van toepassing is en de aanvraag
      voor de betrokken andere benodigde vergunning, bedoeld in die bepaling, binnen zes weken na de indiening van de
      eerstbedoelde aanvraag, maar na de inwerkingtreding van de [Omgevingswet][ref3] is ingediend, is op beide aanvragen
