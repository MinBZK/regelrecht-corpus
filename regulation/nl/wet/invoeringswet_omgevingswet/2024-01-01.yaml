  - number: '4.79'
    text: |-
      1 Op de voorbereiding en vaststelling van de beschikking op een aanvraag met betrekking tot de eerste fase van
      een omgevingsvergunning als bedoeld in [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref1] zijn
      de artikelen 2.5, vijfde, zesde en achtste lid, en [6.3 van die wet][ref2] niet van toepassing, als die aanvraag
      voor de inwerkingtreding van de [Omgevingswet][ref3] is ingediend en de beschikking op die aanvraag nog niet
      onherroepelijk is.

      2 Een beschikking waarbij voor de inwerkingtreding van de [Omgevingswet][ref4] positief en onherroepelijk
      is beslist op de aanvraag met betrekking tot de eerste fase van een omgevingsvergunning als bedoeld in
      [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref5] treedt in werking als op dat tijdstip geen
      aanvraag is ingediend voor de beschikking met betrekking tot de tweede fase, en geldt die beschikking met
      betrekking tot de eerste fase als een omgevingsvergunning voor de betrokken activiteit voor zover voor die
      activiteit een omgevingsvergunning als bedoeld in [afdeling 5.1 van de Omgevingswet][ref6] is vereist.

      3 Als de aanvraag met betrekking tot de tweede fase van een omgevingsvergunning voor de inwerkingtreding
      van de [Omgevingswet][ref7] is ingediend en een beschikking op die aanvraag nog niet onherroepelijk
      is, blijft het oude recht van toepassing op de voorbereiding en vaststelling van de beschikking
      op een aanvraag met betrekking tot de tweede fase van een omgevingsvergunning als bedoeld in
      [artikel 2.5 van de Wet algemene bepalingen omgevingsrecht][ref8].

      4 Als voor de inwerkingtreding van de [Omgevingswet][ref9] een ontwerpbesluit ter inzage is gelegd, blijft het
      oude recht van toepassing op de voorbereiding en vaststelling van een beschikking tot intrekking als bedoeld in
      [artikel 2.5, vijfde lid, van de Wet algemene bepalingen omgevingsrecht][ref10].

      5 [Afdeling 4.1][ref11] is in die gevallen niet van toepassing.


