preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het voor een goede invoering van de Omgevingswet wenselijk is de
    Omgevingswet aan te vullen en te wijzigen, enkele wetten in te trekken, andere wetten te wijzigen en waar nodig in
    overgangsrecht te voorzien;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij dezen:
  url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#ArtikelAanhef
