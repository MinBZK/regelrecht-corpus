      3 Een gedoogplichtbeschikking als bedoeld in [artikel 10, tweede lid, van de Belemmeringenwet Privaatrecht][ref5]
      die onherroepelijk is, geldt als een gedoogplicht als bedoeld in[ artikel 10.24 van de Omgevingswet][ref6].

      4 Een gedoogplicht als bedoeld in [artikel 11 van de Belemmeringenwet Privaatrecht ][ref7]die onherroepelijk is,
