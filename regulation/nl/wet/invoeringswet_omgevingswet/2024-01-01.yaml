  - number: '4.19'
    text: |-
      1 Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt ingediend
      binnen vijf jaar na de inwerkingtreding van de [Omgevingswet][ref1], als voor de inwerkingtreding
      van die wet schade is veroorzaakt door het van kracht worden van een besluit als bedoeld
      in[ artikel 6.1, tweede lid, onder a, b, e of f, van de Wet ruimtelijke ordening][ref2].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref3]:

      a. een aanvraag om een besluit als bedoeld in het eerste lid is ingediend, of

      b. een ontwerp van een ambtshalve te nemen besluit als bedoeld in het eerste lid ter inzage is gelegd,

      en het besluit van kracht wordt na de inwerkingtreding van de [Omgevingswet][ref4], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding, veroorzaakt door dat besluit, als dat is ingediend binnen vijf jaar
      nadat het besluit van kracht is geworden.

      3 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit onherroepelijk wordt en,
      bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      4 [Afdeling 4.1][ref5] is in die gevallen niet van toepassing.


