      is gelast dat een werk voor bepaalde of onbepaalde tijd geheel of gedeeltelijk wordt stilgelegd als bedoeld
      in [artikel 56 van de Monumentenwet 1988][ref2], zoals die wet luidde voor de inwerkingtreding van de
      [Erfgoedwet][ref3], blijft het oude recht van toepassing.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref4] schade is veroorzaakt door een maatregel als bedoeld in
