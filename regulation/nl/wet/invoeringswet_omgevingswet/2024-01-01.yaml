  - number: '4.103'
    text: |-
      1 Als het ontwerp van een bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref1]
      waarvoor op grond van [artikel 3.7 van de Wet ruimtelijke ordening][ref2] of [artikel 4.2, derde lid][ref3], of
      [4.4, derde lid van die wet][ref4], in samenhang met artikel 3.7 van die wet, een voorbereidingsbesluit is genomen,
      voor de inwerkingtreding van de [Omgevingswet][ref5] ter inzage is gelegd, blijft op dat voorbereidingsbesluit het
      oude recht van toepassing tot het plan van kracht is.

      2 Als het ontwerp van een bestemmingsplan niet voor de inwerkingtreding van de [Omgevingswet][ref6] ter inzage
      is gelegd, geldt een voorbereidingsbesluit dat op grond van [artikel 3.1 van de Wet ruimtelijke ordening][ref7]
      is vastgesteld door de gemeenteraad als een voorbereidingsbesluit als bedoeld in
      [artikel 4.14, eerste lid, van de Omgevingswet][ref8]. In dat geval loopt de termijn, bedoeld in het vierde lid van
      dat artikel, vanaf de datum van inwerkingtreding van de [Omgevingswet][ref9].

      3 Als het ontwerp van een bestemmingsplan niet voor de inwerkingtreding van de
      [Omgevingswet][ref10] ter inzage is gelegd, geldt een voorbereidingsbesluit dat op grond van
      [artikel 4.2, derde lid, van de Wet ruimtelijke ordening][ref11] is vastgesteld door gedeputeerde staten als
      een voorbereidingsbesluit als bedoeld in artikel 4.16, eerste lid, van de Omgevingswet. In dat geval loopt de
      termijn, bedoeld in het vijfde lid van dat artikel, af op het moment dat het omgevingsplan in werking treedt of
      is vernietigd.

      4 Als het ontwerp van een bestemmingsplan niet voor de inwerkingtreding van de
      [Omgevingswet][ref12] ter inzage is gelegd, geldt een voorbereidingsbesluit dat op grond van
      [artikel 4.4, derde lid, van de Wet ruimtelijke ordening][ref13] is vastgesteld door Onze Minister die het aangaat,
      in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, als een voorbereidingsbesluit
      als bedoeld in [artikel 4.16, tweede lid, van de Omgevingswet][ref14]. In dat geval loopt de termijn, bedoeld in
      het vijfde lid van dat artikel, af op het moment dat het omgevingsplan in werking treedt of is vernietigd.


