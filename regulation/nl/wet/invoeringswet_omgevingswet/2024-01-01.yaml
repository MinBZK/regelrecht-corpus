      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor de aanleg of uitbreiding van een installatie
      als bedoeld in [artikel 9b, eerste lid, van de Elektriciteitswet 1998][ref2], voor de uitbreiding van een
      installatie als bedoeld in het tweede lid van dat artikel of voor de uitbreiding van het net, bedoeld in
      [artikel 20a, eerste lid, van de Elektriciteitswet 1998][ref3] ter voorbereiding van een inpassingsplan als bedoeld
      in [artikel 3.28 van de Wet ruimtelijke ordening][ref4] een voorbereidingsbesluit is bekendgemaakt, kan voor die
      aanleg of uitbreiding binnen een periode van een jaar en zes maanden na die inwerkingtreding een projectbesluit als
      bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref5] worden bekendgemaakt.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref6] voor de aanleg of uitbreiding van een installatie als
      bedoeld in [artikel 9e, eerste lid, van de Elektriciteitswet 1998][ref7] ter voorbereiding van een inpassingsplan
      als bedoeld in [artikel 3.26 van de Wet ruimtelijke ordening][ref8] een voorbereidingsbesluit is bekendgemaakt,
      kan voor die aanleg of uitbreiding binnen een periode van een jaar en zes maanden na die inwerkingtreding een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref9] worden bekendgemaakt.


