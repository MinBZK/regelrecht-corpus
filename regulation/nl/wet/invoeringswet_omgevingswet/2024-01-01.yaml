      Een ontheffing als bedoeld in [artikel 4.3a, eerste lid, van de Wet ruimtelijke ordening][ref1] van de bij
      algemene maatregel van bestuur, bedoeld in [artikel 4.3, eerste lid, van die wet][ref2], gestelde regels die
      door Onze Minister van Infrastructuur en Waterstaat of door Onze Minister die het aangaat, in overeenstemming
      met Onze Minister van Infrastructuur en Waterstaat, is verleend, geldt als een ontheffing als bedoeld in
      [artikel 2.32, tweede lid, van de Omgevingswet][ref3], voor zover de inhoud van die regels is overgenomen in de
      algemene maatregel van bestuur op grond van [artikel 2.24 van de Omgevingswet][ref4] en van die regels in het
      omgevingsplan, bedoeld in [artikel 2.4 van de Omgevingswet][ref5], of in de omgevingsverordening, bedoeld in
      [artikel 2.6 van de Omgevingswet][ref6], ontheffing kan worden verleend.


