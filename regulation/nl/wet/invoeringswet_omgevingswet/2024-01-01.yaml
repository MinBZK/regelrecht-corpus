  - number: '4.3'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] een aanvraag
      om een besluit is ingediend, blijft het oude recht, met uitzondering van
      [artikel 3.9, derde lid, eerste zin, van de Wet algemene bepalingen omgevingsrecht][ref2], van toepassing:

      a. als tegen het besluit beroep openstaat: tot het besluit onherroepelijk wordt,

      b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3.9'
  - number: '4.4'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor een ambtshalve te nemen besluit een ontwerp ter
      inzage is gelegd van een besluit op de voorbereiding waarvan [afdeling 3.4 van de Algemene wet bestuursrecht][ref2]
      van toepassing is, blijft het oude recht van toepassing:

      a. als tegen het besluit beroep openstaat: tot het besluit onherroepelijk wordt,

      b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.5'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor een ambtshalve te nemen besluit toepassing is gegeven
      aan [artikel 4:8 van de Algemene wet bestuursrecht][ref2] of het besluit is bekendgemaakt, blijft het oude recht
      van toepassing:

      a. als tegen het besluit beroep openstaat: tot het besluit onherroepelijk wordt,

      b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel48
