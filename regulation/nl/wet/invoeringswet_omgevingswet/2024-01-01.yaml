      Een ontheffing als bedoeld in [artikel 4.1a van de Wet ruimtelijke ordening][ref1] van bij de verordening, bedoeld
      in [artikel 4.1, eerste lid, van die wet][ref2] gestelde regels die door gedeputeerde staten is verleend, geldt als
      een ontheffing als bedoeld in [artikel 2.32, eerste lid, van de Omgevingswet][ref3], voor zover de inhoud van die
      regels is overgenomen in de omgevingsverordening, bedoeld in [artikel 2.6 van de Omgevingswet][ref4], en van die
      regels in de omgevingsverordening met toepassing van artikel 2.32, vierde lid, van de Omgevingswet ontheffing kan
      worden verleend.


