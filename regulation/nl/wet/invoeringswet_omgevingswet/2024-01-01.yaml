  - number: '4.15'
    text: |-
      Als bij de inwerkingtreding van de [Omgevingswet][ref1] de bevoegdheid te beslissen op een aanvraag overgaat
      naar een ander bestuursorgaan en de ontheffing of vergunning nog niet is verleend, kan het bestuursorgaan dat op
      grond van [afdeling 4.1][ref2] bevoegd blijft om op die aanvraag te beslissen, die bevoegdheid overdragen aan het
      bestuursorgaan dat bij de inwerkingtreding van de Omgevingswet bevoegd wordt te beslissen op die aanvraag, mits dat
      bestuursorgaan daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Hoofdstuk4
