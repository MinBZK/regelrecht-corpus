  - number: '4.6'
    text: |-
      1 Als deel van het omgevingsplan, bedoeld in [artikel 2.4 van de Omgevingswet][ref1], gelden:

      a. een bestemmingsplan als bedoeld in [artikel 2.3 van de Crisis- en herstelwet][ref2],

      b. een provinciaal inpassingsplan als bedoeld in [art. 2.3a van de Crisis- en herstelwet][ref3],

      c. een bestemmingsplan of inpassingsplan waarin met toepassing van
      [artikel 2.4, eerste lid, onder o, van de Crisis- en herstelwet][ref4] bij wijze van experiment wordt afgeweken van
      het bepaalde bij of krachtens de [Wet ruimtelijke ordening][ref5],

      d. een regel als bedoeld in [artikel 38, eerste lid, van de Monumentenwet 1988][ref6], zoals die wet luidde voor de
      inwerkingtreding van de [Erfgoedwet][ref7],

      e. een verordening als bedoeld in [artikel 6 van de Wet geurhinder en veehouderij][ref8],

      f. een verordening als bedoeld in [artikel 10.32a van de Wet milieubeheer][ref9] en een besluit tot aanwijzing van
      een gebied op grond van die verordening,

      g. een bestemmingsplan als bedoeld in [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref10],

      h. een wijzigingsplan als bedoeld in [artikel 3.6, eerste lid, onder a, van de Wet ruimtelijke ordening][ref11],

      i. een uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder b, van de Wet ruimtelijke ordening][ref12],

      j. een inpassingsplan als bedoeld in [artikel 3.26, eerste lid, van de Wet ruimtelijke ordening][ref13],

      k. een inpassingsplan als bedoeld in [artikel 3.28, eerste lid, van de Wet ruimtelijke ordening][ref14],

      l. een beheersverordening als bedoeld in [artikel 3.38, eerste lid, van de Wet ruimtelijke ordening][ref15],

      m. een exploitatieplan als bedoeld in [artikel 6.12, eerste lid, van de Wet ruimtelijke ordening][ref16], dat
      betrekking heeft op een bestemmingsplan of een wijzigingsplan als bedoeld in die wet,

      n. een besluit op grond van [artikel 12, tweede lid, van de Woningwet][ref17],

      o. een warmteplan voor zover het gaat om een warmteplan vastgesteld op grond van de [Woningwet][ref18],

      p. een voorbereidingsbesluit als bedoeld in de [artikelen 4.103, eerste lid][ref19], [4.104, eerste lid][ref20],
      en [4.104a, eerste lid][ref21].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref22]:

      a. een ontwerp ter inzage is gelegd van:

      1°. een besluit tot aanwijzing van een gebied op grond van een verordening als bedoeld in
      [artikel 10.32a van de Wet milieubeheer][ref23], of

      2°. een bestemmingsplan, wijzigingsplan, uitwerkingsplan, inpassingsplan of exploitatieplan, of

      b. een beheersverordening is vastgesteld, maar nog niet in werking getreden, blijft het oude recht van toepassing
      tot dit besluit van kracht is.

      3 Het oude recht blijft, tot het besluit onherroepelijk is, van toepassing op een beroep tegen:

      a. een besluit tot aanwijzing van een gebied op grond van een verordening als bedoeld in
      [artikel 10.32a van de Wet milieubeheer][ref24], of

      b. een bestemmingsplan, wijzigingsplan, uitwerkingsplan, inpassingsplan of exploitatieplan.

      4 [Artikel 4.3][ref25] is niet van toepassing op een aanvraag om een bestemmingsplan, beheersverordening,
      wijzigingsplan, uitwerkingsplan, inpassingsplan of exploitatieplan vast te stellen of te wijzigen.

      5 [Artikel 4.4][ref26] is niet van toepassing in gevallen als bedoeld in het tweede lid.


