  - number: '4.16'
    text: |-
      1 Een gedoogplichtbeschikking die onherroepelijk is, geldt als een gedoogplichtbeschikking als bedoeld
      in [afdeling 10.3 van de Omgevingswet][ref1] als de grondslag ervan ligt in de artikelen, bedoeld in
      [artikel 4.2, onder a tot en met f en h tot en met r][ref2].

      2 Een concessie als bedoeld in [artikel 71][ref3] in samenhang met
      [artikel 15, onder b, van de Kernenergiewet][ref4] die onherroepelijk is, geldt als een gedoogplichtbeschikking als
      bedoeld in [artikel 10.14, aanhef en onder e, van de Omgevingswet][ref5].

      3 Als voor de inwerkingtreding van de [Omgevingswet][ref6] schade is ontstaan als gevolg van de te gedogen
      handeling als bedoeld in:

      a. de [artikelen 9][ref7] en[ 10 van de Waterstaatswet 1900][ref8],

      b. de [artikelen 8.51][ref9] en [17.11 van de Wet milieubeheer][ref10],

      c. [artikel 8a.6 van de Wet luchtvaart][ref11],

      d. de [artikelen 24][ref12] en [25 van de Spoorwegwet][ref13],

      e. [artikel 8 van de Wet lokaal spoor][ref14],

      f. [artikel 4 van de Mijnbouwwet][ref15],

      g. [artikel 24 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref16], en

      h. [artikel 4.2][ref17], met uitzondering van onderdeel o,

      blijft het oude recht van toepassing op een vordering tot schadevergoeding die is ingesteld binnen vijf jaar na de
      inwerkingtreding van de [Omgevingswet][ref18] en bij toewijzing van die vordering, de toegewezen schadevergoeding
      volledig is betaald.


