      2 Een bevel tot verplaatsing als bedoeld in [artikel 5, eerste lid, van de Belemmeringenwet Privaatrecht][ref3]
      dat onherroepelijk is, geldt als een wijziging van de gedoogplichtbeschikking als bedoeld in
