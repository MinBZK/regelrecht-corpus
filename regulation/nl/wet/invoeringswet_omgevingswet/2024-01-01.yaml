      in[ artikel 11, tweede lid, van de Monumentenwet 1988][ref1] zoals die wet luidde voor de
      inwerkingtreding van de [Erfgoedwet][ref2], niet onherroepelijk is, blijft het oude recht met uitzondering
      van[ artikel 17, tweede lid, van de Monumentenwet 1988][ref3] zoals die wet luidde voor de inwerkingtreding
      van de Erfgoedwet, van toepassing tot het besluit onherroepelijk wordt, als de aanvraag is ingediend voor de
      inwerkingtreding van [afdeling 5.1 van de Omgevingswet][ref4].


