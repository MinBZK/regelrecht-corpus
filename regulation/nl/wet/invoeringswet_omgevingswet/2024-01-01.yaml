  - number: '4.18'
    text: |-
      1 Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt ingediend binnen vijf jaar na
      de inwerkingtreding van de [Omgevingswet][ref1], als voor de inwerkingtreding van die wet schade is veroorzaakt
      door:

      a. een onherroepelijk besluit of plan als bedoeld in [artikel 17, eerste lid, van de Spoedwet wegverbreding][ref2],

      b. een onherroepelijk besluit als bedoeld in [artikel 8.4][ref3], [8.15][ref4], [8.43, eerste lid][ref5],
      [8.70, eerste lid][ref6], of [10.15, eerste lid, van de Wet luchtvaart][ref7] in samenhang met
      [artikel 8.31 van die wet][ref8],

      c. een onherroepelijk besluit als bedoeld in
      [artikel 6.1, tweede lid, onder c, van de Wet ruimtelijke ordening][ref9].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref10]:

      a. een aanvraag om een besluit als bedoeld in het eerste lid is ingediend,

      b. een ontwerp van een ambtshalve te nemen besluit als bedoeld in het eerste lid ter inzage is gelegd, of

      c. voor een ambtshalve te nemen besluit als bedoeld in het eerste lid toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref11] of een ambtshalve te nemen besluit is bekendgemaakt,

      en het besluit onherroepelijk wordt na de inwerkingtreding van de [Omgevingswet][ref12], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding, veroorzaakt door dat besluit, als dat is ingediend binnen vijf jaar
      nadat het besluit is vastgesteld.

      3 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit onherroepelijk wordt en,
      bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      4 [Afdeling 4.1][ref13] is in die gevallen niet van toepassing.


