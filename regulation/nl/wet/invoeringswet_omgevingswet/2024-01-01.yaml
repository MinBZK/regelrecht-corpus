  - number: '4.23'
    text: |-
      1 Als voor de inwerkingtreding van [afdeling 18.1 van de Omgevingswet][ref1] een overtreding heeft plaatsgevonden,
      een overtreding is aangevangen of het gevaar voor een overtreding klaarblijkelijk dreigde, en voor de
      inwerkingtreding van die afdeling een bestuurlijke sanctie is opgelegd voor die overtreding of dreigende
      overtreding, blijft het oude recht op die bestuurlijke sanctie van toepassing tot het tijdstip waarop:

      a. de beschikking onherroepelijk is geworden en volledig is uitgevoerd of ten uitvoer is gelegd,

      b. de beschikking is ingetrokken of is komen te vervallen, of

      c. als de beschikking gaat om de oplegging van een last onder dwangsom:

      1°. de last volledig is uitgevoerd,

      2°. de dwangsom volledig is verbeurd en betaald, of

      3°. de last is opgeheven.

      2 [Afdeling 4.1][ref2] is in die gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Afdeling18.1
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.23
