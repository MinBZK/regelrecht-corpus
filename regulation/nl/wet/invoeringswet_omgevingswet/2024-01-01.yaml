  - number: '4.76'
    text: |-
      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] schade aan een onroerende zaak als bedoeld in
      [artikel 7.18 van de Waterwet][ref2] is ontstaan, blijft het oude recht van toepassing.

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref3] een vordering:

      a. op grond van [artikel 7.18, tweede lid, van de Waterwet][ref4] is ingediend, blijft het oude recht van
      toepassing tot het tijdstip waarop het vonnis in kracht van gewijsde is gegaan en, bij toewijzing van die
      vordering, de toegewezen schadevergoeding volledig is betaald.

      b. op grond van[ artikel 7.18, derde lid, van de Waterwet][ref5] is ingediend, blijft het oude recht van toepassing
      tot het tijdstip waarop het vonnis in kracht van gewijsde is gegaan en, bij toewijzing van die vordering:

      1°. de eigendom van de onroerende zaak is overgenomen, en

      2°. de overnemingssom volledig is betaald.

      3 Als het tijdstip waarop de schade aan een onroerende zaak is ontstaan niet of niet binnen een redelijke termijn
      kan worden vastgesteld, is op de vordering op grond van [artikel 7.18, tweede of derde lid, van de Waterwet][ref6],
      de Omgevingswet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.18
      [ref3]: https://wetten.overheid.nl/BWBR0037885
