      1 De landelijke voorziening, die krachtens de [Wet ruimtelijke ordening][ref1] is ingesteld, blijft tot een bij
      koninklijk besluit te bepalen tijdstip in stand om de daarin opgenomen visies, plannen, besluiten en verordeningen:

      a. te raadplegen,

      b. te wijzigen op grond van [artikel 4.4][ref2] of [4.6, tweede lid][ref3],

      c. voor zover daarin regels voor een locatie zijn opgenomen, gedeeltelijk te laten vervallen op grond van artikel
      22.6, tweede lid, van de Omgevingswet, en

      d. beschikbaar en toegankelijk te houden via www.ruimtelijkeplannen.nl en het unieke identificatienummer.

      2 Het oude recht blijft tot dat tijdstip op die voorziening van toepassing.


