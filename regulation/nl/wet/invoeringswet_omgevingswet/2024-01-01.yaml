      1 Een stroomgebiedbeheerplan als bedoeld in [artikel 4.1, derde lid, onder a, van de Waterwet][ref1],
      dat strekt ter uitvoering van artikel 13 van de kaderrichtlijn water, en van kracht is, geldt
      als een stroomgebiedsbeheerplan voor het betreffende stroomgebiedsdistrict als bedoeld in
      [artikel 3.9, tweede lid, onder a, van de Omgevingswet][ref2].

      2 Het deel van het nationale waterplan, bedoeld in [artikel 4.1, tweede lid, onder d, van de Waterwet][ref3], dat
      strekt ter uitvoering van de artikelen 7 en 8 van de richtlijn overstromingsrisico's, en van kracht is, geldt als
      een overstromingsrisicobeheerplan als bedoeld in [artikel 3.9, tweede lid, onder b, van de Omgevingswet][ref4].

      3 Het deel van het nationale waterplan, bedoeld in [artikel 4.1, derde lid, onder b, van de Waterwet][ref5],
      dat strekt ter uitvoering van de artikelen 13 en 14 van de kaderrichtlijn mariene strategie,
      en van kracht is, geldt als een programma van maatregelen mariene strategie als bedoeld in
      [artikel 3.9, tweede lid, onder c, van de Omgevingswet][ref6].

      4 Het deel van het nationale waterplan, bedoeld in [artikel 4.1, derde lid, onder b, van de Waterwet][ref7], dat
      strekt ter uitvoering van artikel 4 van de kaderrichtlijn maritieme ruimtelijke planning, en van kracht is, geldt
      als een maritiem ruimtelijk plan als bedoeld in [artikel 3.9, tweede lid, onder d, van de Omgevingswet][ref8].

      5 De delen van het nationale waterplan, bedoeld in [artikel 4.1 van de Waterwet][ref9], die niet in de voorgaande
      leden zijn genoemd, die een uitwerking zijn van het te voeren waterbeleid en van kracht zijn, gelden als het
      nationaal waterprogramma, bedoeld in [artikel 3.9, tweede lid, onder e, van de Omgevingswet][ref10].

      6 Als een plan of een deel ervan als bedoeld in het eerste tot en met vijfde lid niet van kracht is, blijft het
      oude recht daarop van toepassing als voor de inwerkingtreding van [artikel 3.9 van de Omgevingswet][ref11] een
      ontwerp daarvan ter inzage is gelegd.


