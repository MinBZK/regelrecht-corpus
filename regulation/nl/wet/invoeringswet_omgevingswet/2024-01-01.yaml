  - number: '4.1'
    text: |-
      Deze afdeling is, tenzij bij of krachtens dit hoofdstuk anders is bepaald, van toepassing op besluiten op grond
      van:

      a. of met toepassing van de [Crisis- en herstelwet][ref1],

      b. de [artikelen 41][ref2] en [41a van de Monumentenwet 1988][ref3], zoals die wet luidde voor de inwerkingtreding
      van de [Erfgoedwet][ref4],

      c. de [artikelen 7a][ref5], [40][ref6] en [43 van de Mijnbouwwet][ref7],

      d. de [Ontgrondingenwet][ref8],

      e. [artikel 19 van de Spoorwegwet][ref9],

      f. of met toepassing van de [artikelen 5.1][ref10], [5.2][ref11], [6.2][ref12], [6.3][ref13], [6.4][ref14],
      [6.5][ref15] en [6.10 van de Waterwet][ref16],

      g. [artikel 78, eerste lid][ref17], voor zover het gaat om een verordening als bedoeld in
      [artikel 4.7, onder a][ref18], van deze wet en [artikel 83, van de Waterschapswet][ref19], voor zover het gaat om
      een nadere regel als bedoeld in [artikel 4.7, onder b][ref20], van deze wet,

      h. of met toepassing van de [Wet algemene bepalingen omgevingsrecht][ref21],

      i. de [Wet ammoniak en veehouderij][ref22],

      j. de [artikelen 2][ref23] en [6 van de Wet beheer rijkswaterstaatswerken][ref24],

      k. de [Wet geurhinder en veehouderij][ref25],

      l. de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref26],

      m. de [artikelen 7][ref27] en [12 van de Wet lokaal spoor][ref28],

      n. [paragraaf 1.2][ref29], [hoofdstuk 7][ref30], de [artikelen 11.11][ref31] en [11.12][ref32],
      [hoofdstuk 14][ref33] en de [artikelen 17.3][ref34] en [20.17 van de Wet milieubeheer][ref35],

      o. de [Wet ruimtelijke ordening][ref36],

      p. de [artikelen 6, tweede lid][ref37], [7][ref38], [7a][ref39], [12, tweede en vierde lid][ref40],
      [13, aanhef en onder b][ref41], [13a][ref42], [92][ref43], voor zover het gaat om de bestuursrechtelijke handhaving
      van het bepaalde bij of krachtens [hoofdstuk II][ref44], en [92a van de Woningwet][ref45].


