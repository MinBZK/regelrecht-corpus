  - number: '4.13'
    text: |-
      1 Een ontheffing of vergunning voor een activiteit waarop een verbodsbepaling van toepassing is als bedoeld in
      [paragraaf 5.1.1 van de Omgevingswet][ref1] en die onherroepelijk is, geldt als een omgevingsvergunning voor die
      activiteit.

      2 Als aan een omgevingsvergunning verbonden voorschriften als bedoeld in
      [paragraaf 5.1.4 van de Omgevingswet][ref2] gelden:

      a. beperkingen of voorwaarden waaronder een ontheffing of vergunning is verleend,

      b. nadere eisen als bedoeld in
      [artikel 2.22, derde lid, onder b en c, van de Wet algemene bepalingen omgevingsrecht][ref3], en

      c. een exploitatieplan als bedoeld in [artikel 6.12, eerste lid, van de Wet ruimtelijke ordening][ref4], dat
      betrekking heeft op een omgevingsvergunning.

      3 Als op een activiteit na de inwerkingtreding van de [Omgevingswet][ref5] geen verbodsbepaling als
      bedoeld in [paragraaf 5.1.1 van de Omgevingswet][ref6] van toepassing is, geldt een aan een onherroepelijke
      omgevingsvergunning voor die activiteit verbonden voorschrift als een maatwerkvoorschrift, voor zover het
      voorschrift gaat over een onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in
      [artikel 4.5, eerste lid, van de Omgevingswet][ref7].

      4 Als een aan een onherroepelijke omgevingsvergunning voor een activiteit verbonden voorschrift ook geldt voor het
      deel van die activiteit waarop een verbodsbepaling als bedoeld in [paragraaf 5.1.1 van de Omgevingswet][ref8]niet
      van toepassing is, geldt dat voorschrift als een maatwerkvoorschrift, voor zover het voorschrift
      gaat over een onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in
      [artikel 4.5, eerste lid, van de Omgevingswet][ref9].


