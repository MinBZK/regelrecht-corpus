      4 Als de voorbereiding van een projectplan dat wordt voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref7] voor de inwerkingtreding van de [Omgevingswet][ref8]
      is aangevangen, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan de bij of krachtens
      de [artikelen 5.47][ref9] en [5.48 van de Omgevingswet][ref10] gestelde vereisten, kan een ontwerp van een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet ][ref11]ter inzage worden gelegd.

      5 Als de voorbereiding van een projectplan dat wordt voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref12] voor de inwerkingtreding van de [Omgevingswet][ref13]
      in een vergevorderd stadium is, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan
      [artikel 5.48, eerste lid, van de Omgevingswet][ref14], kan binnen een periode van een jaar en zes maanden na
      dat tijdstip een projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref15] worden
      vastgesteld.


