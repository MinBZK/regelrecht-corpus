      1 [Artikel 4.44][ref1] is van overeenkomstige toepassing op door Onze Minister van Infrastructuur
      en Waterstaat bij ministeriële regeling aan te wijzen projecten waarvan van de beslissing
      als bedoeld in [artikel 2, eerste lid, van de Tracéwet][ref2] voor de inwerkingtreding van
      [afdeling 5.2 van de Omgevingswet][ref3] kennis is gegeven en waarvan de verkenning in een vergevorderd stadium is,
      als voor het project binnen een jaar na de inwerkingtreding van de [Omgevingswet][ref4] een ontwerptracébesluit ter
      inzage is gelegd.

      2 [Artikel 4.44][ref5] is van overeenkomstige toepassing op door Onze Minister van
      Infrastructuur en Waterstaat bij ministeriële regeling aan te wijzen projecten die op grond van
      __REF001___________________________________________________________________________________________________________
      _______________________________________________________________________________________________ zijn aangewezen en
      waarvan de verkenning in een vergevorderd stadium is, als voor het project binnen een jaar na de inwerkingtreding
      van de [Omgevingswet][ref7] een ontwerptracébesluit ter inzage is gelegd.

      3 Voor de op grond van het tweede lid aangewezen projecten kan na het in dat lid bedoelde tijdstip een ontwerp van
      een projectbesluit ter inzage worden gelegd. De [artikelen 5.47 tot en met 5.49 van de Omgevingswet][ref8] zijn
      niet van toepassing.


