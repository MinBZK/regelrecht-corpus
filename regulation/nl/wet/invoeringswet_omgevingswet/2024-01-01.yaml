      1 In het omgevingsplan worden door de gemeenteraad, het dagelijks bestuur van het waterschap en
      gedeputeerde staten geen regels gesteld die in strijd zijn met het inpassingsplan, bedoeld in
      [artikel 3.28 van de Wet ruimtelijke ordening][ref1].

      2 Het eerste lid is niet van toepassing voor zover een instructieregel als bedoeld in
      [artikel 2.24 van de Omgevingswet][ref2] of een instructie als bedoeld in [artikel 2.34 van de Omgevingswet][ref3]
      het stellen van dergelijke regels vergt.

      3 Het eerste lid is van toepassing tot tien jaar na de vaststelling van het
      inpassingsplan, of korter, als in het inpassingsplan een termijn is gesteld als bedoeld in
      a[rtikel 3.28, vijfde lid, van de Wet ruimtelijke ordening][ref4].

      4 Bepalingen van een omgevingsverordening blijven buiten toepassing voor zover ze in strijd zijn met het
      inpassingsplan.


