  - number: '4.20'
    text: |-
      1 Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt ingediend
      binnen vijf jaar na de inwerkingtreding van de [Omgevingswet][ref1], als voor de inwerkingtreding
      van die wet schade is veroorzaakt door de aanhouding van een besluit als bedoeld in
      [artikel 6.1, tweede lid, onder d, van de Wet ruimtelijke ordening][ref2].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref3] een aanvraag om een besluit als bedoeld in het eerste
      lid is ingediend en dat besluit wordt na de inwerkingtreding van de [Omgevingswet][ref4] aangehouden, blijft het
      oude recht van toepassing op een verzoek om schadevergoeding, veroorzaakt door de aanhouding van dat besluit, als
      dat is ingediend binnen vijf jaar na de terinzagelegging van het vastgestelde bestemmingsplan.

      3 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit onherroepelijk wordt en,
      bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      4 [Afdeling 4.1][ref5] is in die gevallen niet van toepassing.


