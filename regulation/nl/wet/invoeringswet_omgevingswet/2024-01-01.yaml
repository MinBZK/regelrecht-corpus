    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] kosten zijn gemaakt als bedoeld in
      [artikel 7.17, tweede lid, van de Waterwet][ref2], blijft het oude recht van toepassing tot het tijdstip waarop:

      a. het besluit tot oplegging van een verplichting tot vergoeding van die kosten of het besluit tot invordering van
      die kosten onherroepelijk wordt, of

      b. de verschuldigde kosten volledig zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel7.17
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.75
