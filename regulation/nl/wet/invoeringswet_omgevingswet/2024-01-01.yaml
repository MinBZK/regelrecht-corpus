  - number: '4.7'
    text: |-
      Als deel van een waterschapsverordening als bedoeld in [artikel 2.5 van de Omgevingswet][ref1], gelden:

      a. een verordening als bedoeld in [artikel 78, eerste lid, van de Waterschapswet][ref2]:

      1°. zijnde een keur, met uitzondering van de daarin opgenomen regels over onderhoudsverplichtingen,

      2°. die gaat over wegen of vaarwegen die in beheer zijn bij het waterschap, of

      3°. die gaat over de aansluiting van een openbaar riool op een zuiveringtechnisch werk of het brengen van
      afvalwater vanuit een openbaar riool in een zuiveringtechnisch werk,

      b. een nadere regel als bedoeld in [artikel 83, derde lid, van de Waterschapswet][ref3], voor zover die regel niet
      gaat over onderhoudsverplichtingen,

      c. een legger als bedoeld in [artikel 5.1, eerste lid, eerste zin, van de Waterwet][ref4] die onherroepelijk is,
      voor zover daarin de ligging van een waterstaatswerk en een daaraan grenzende beschermingszone is aangegeven.


