      1 Een aanwijzing als beschermd stads- of dorpsgezicht als bedoeld in
      [artikel 35, eerste lid, van de Monumentenwet 1988][ref1] zoals die wet luidde voor de inwerkingtreding van de
      [Erfgoedwet][ref2], geldt als een instructie als bedoeld in [artikel 2.34, vierde lid, van de Omgevingswet][ref3],
      waardoor in het omgevingsplan blijvend wordt voorzien in een beschermingsregime voor het stads- of dorpsgezicht dat
      is omschreven in die aanwijzing.

      2 Tot het omgevingsplan onherroepelijk voorziet in:

      a. een verbod op het slopen van in ieder geval de bouwwerken van een stads- of dorpsgezicht die maken dat de
      groep van onroerende zaken van algemeen belang is wegens hun schoonheid, hun onderlinge ruimtelijke of structurele
      samenhang dan wel hun wetenschappelijke of cultuurhistorische waarde, en

      b. op de karakteristieken van het beschermde stads- of dorpsgezicht afgestemde beoordelingsregels voor een
      omgevingsvergunning voor een omgevingsplanactiviteit,

      is voor het slopen een vergunning vereist voor een activiteit als bedoeld in
      [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref4] en is de weigeringsgrond, bedoeld
      in [artikel 2.16 van de Wet algemene bepalingen omgevingsrecht][ref5] zoals dat artikel luidde voor de
      inwerkingtreding van de [Omgevingswet][ref6], van overeenkomstige toepassing.

      3 Als een aanwijzing of intrekking als bedoeld in [artikel 35, eerste lid, van de Monumentenwet 1988][ref7] zoals
      die wet luidde voor de inwerkingtreding van de [Erfgoedwet][ref8], niet van kracht is, blijft het oude recht van
      toepassing als voor de inwerkingtreding van [afdeling 2.5 van de Omgevingswet][ref9] een voorstel als bedoeld in
      [artikel 35, tweede lid, van de Monumentenwet 1988][ref10] zoals die wet luidde voor de inwerkingtreding van de
      Erfgoedwet, is verzonden.


