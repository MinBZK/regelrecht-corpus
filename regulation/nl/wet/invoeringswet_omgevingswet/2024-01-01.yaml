      1 Voor het gebied dat is begrepen in een tracébesluit geldt het tracébesluit als een voorbereidingsbesluit als
      bedoeld in [artikel 4.14, eerste lid, van de Omgevingswet][ref1].

      2 In afwijking van [artikel 4.14, vierde lid, van de Omgevingswet][ref2] vervallen de voorbeschermingsregels in
      het omgevingsplan op het tijdstip waarop een omgevingsplan in overeenstemming met het tracébesluit van kracht is
