  - number: 4.80a
    text: |-
      1 Als voor een aanvraag om een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b, van de Wet algemene bepalingen omgevingsrecht][ref1] voor
      de inwerkingtreding van de [Omgevingswet][ref2] een aanhoudingsplicht is ontstaan op grond van
      [artikel 3.3 van de Wet algemene bepalingen omgevingsrecht][ref3] en voor de inwerkingtreding van de
      [Omgevingswet][ref4] nog geen bestemmingsplan of inpassingsplan in ontwerp ter inzage is gelegd, duurt die
      aanhoudingsplicht totdat:

      a. voor een voorbereidingsbesluit als bedoeld in [artikel 4.49, eerste lid][ref5]: de termijn, bedoeld in het
      tweede lid van dat artikel, is verstreken,

      b. voor een voorbereidingsbesluit als bedoeld in [artikel 4.103][ref6], tweede lid: de termijn, bedoeld in
      [artikel 4.14, vierde lid, van de Omgevingswet][ref7] is verstreken,

      c. voor een voorbereidingsbesluit als bedoeld in [artikel 4.103, derde of vierde lid][ref8], of
      [4.104, tweede lid][ref9]: de termijn, bedoeld in [artikel 4.16, vijfde lid, van de Omgevingswet][ref10] is
      verstreken,

      d. voor een voorbereidingsbesluit als bedoeld in [artikel 4.104a, tweede lid][ref11]: de termijn, bedoeld in de
      tweede zin van dat artikellid, is verstreken,

      e. voor een aanwijzing als beschermd stads- of dorpsgezicht: het omgevingsplan dat voorziet in de bescherming van
      het stads- of dorpsgezicht in werking is getreden.

      2 In de gevallen, bedoeld in het [eerste lid, is artikel 4.3][ref12]
      als het gaat om de regeling van de duur van de aanhoudingsplicht in
      [artikel 3.3, tweede lid, aanhef en onder a, en vijfde lid, van de Wet algemene bepalingen omgevingsrecht][ref13]
      en in [artikel 8.9, tweede lid, van de Wet luchtvaart][ref14] niet van toepassing.


