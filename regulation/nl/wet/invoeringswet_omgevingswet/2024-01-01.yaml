      1 Als voor de inwerkingtreding van de [Omgevingswet][ref1] schade is veroorzaakt door de uitoefening van een
      taak of bevoegdheid als bedoeld in [artikel 7.14, eerste lid, van de Waterwet][ref2], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding dat wordt ingediend binnen vijf jaar nadat de schade zich heeft
      geopenbaard of de benadeelde redelijkerwijs op de hoogte had kunnen zijn van de schade, maar in ieder geval binnen
      twintig jaar na de schadeveroorzakende gebeurtenis.

      2 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit onherroepelijk wordt en,
      bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      3 [Afdeling 4.1][ref3] is in die gevallen niet van toepassing.


