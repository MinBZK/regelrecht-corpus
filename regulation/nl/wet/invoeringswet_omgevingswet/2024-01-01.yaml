    text: |-
      1 Een projectplan van een waterschap als bedoeld in [artikel 5.4 van de Waterwet][ref1], waarop de procedure van
      paragraaf 5.2 van die wet van toepassing is, en dat onherroepelijk is, geldt voor zover de in het projectplan
      omschreven activiteit onder de [Omgevingswet][ref2] vergunningplichtig is, ook als een omgevingsvergunning
      als bedoeld in [artikel 5.3 van de Omgevingswet][ref3] voor die activiteit. In dat geval blijven de
      [artikelen 5.8 tot en met 5.14 van de Waterwet][ref4] gelden tot de activiteit, genoemd in de omgevingsvergunning,
      ten uitvoer is gelegd.

      2 Als een projectplan niet onherroepelijk is, blijft het oude recht daarop van toepassing als het ontwerp daarvan
      voor de inwerkingtreding van [afdeling 5.2 van de Omgevingswet][ref5] ter inzage is gelegd.

      3 Een vastgesteld projectplan wordt, voor zover na de inwerkingtreding van de [Omgevingswet][ref6] onteigening
      plaatsvindt ten behoeve van de tenuitvoerlegging van de in het projectplan omschreven activiteit, voor de
      toepassing van [artikel 11.6 van de Omgevingswet][ref7] als een onteigeningsbelang aangemerkt.

      4 Als de voorbereiding van een projectplan voor de inwerkingtreding van de [Omgevingswet][ref8] is
      aangevangen, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan de bij of krachtens
      de [artikelen 5.47][ref9] en [5.48 van de Omgevingswet][ref10] gestelde vereisten, kan een ontwerp van een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref11] ter inzage worden gelegd.

      5 Als de voorbereiding van een projectplan voor de inwerkingtreding van de [Omgevingswet][ref12] in
      een vergevorderd stadium is, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan
      [artikel 5.48, eerste lid, van de Omgevingswet][ref13], kan binnen een periode van een jaar en zes maanden na
      dat tijdstip een projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref14] worden
      vastgesteld.


