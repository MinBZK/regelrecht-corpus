      Op de tracébesluiten voor de Blankenburgverbinding en de ViA15, bedoeld in
      [artikel 3 van de Wet tijdelijke tolheffing Blankenburgverbinding en ViA15][ref1], die onherroepelijk zijn, blijft
      die wet van toepassing voor zover de besluiten betrekking hebben op tolheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0037517#Artikel3
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0037517
        artikel: '3'
  - number: '4.47'
    text: |-
      1 Een tracébesluit geldt als een projectbesluit waarin uitdrukkelijk is bepaald dat het geldt als:

      a. een omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit, voor zover het in strijd is met het
      omgevingsplan,

      b. een omgevingsvergunning voor een omgevingsplanactiviteit, voor zover voor de uitvoering van werken of
      werkzaamheden op grond van het omgevingsplan een omgevingsvergunning kan worden verleend,

      c. een verkeersbesluit als bedoeld in [artikel 15 van de Wegenverkeerswet 1994][ref1], voor zover ter uitvoering
      van het besluit handelingen worden verricht waarvoor krachtens dat artikel een verkeersbesluit is vereist.

      2 Voor zover een aanvraag om een omgevingsvergunning voor een omgevingsplanactiviteit betrekking heeft op het
      gebied dat is begrepen in een tracébesluit wordt de omgevingsvergunning geweigerd als de activiteit in strijd is
      met het projectbesluit, bedoeld in het eerste lid.

      3 Voor zover een tracébesluit niet in strijd is met het omgevingsplan, wordt het tracébesluit voor de toepassing
      van [artikel 11.6 van de Omgevingswet][ref2] als een onteigeningsbelang aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel11.6
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.47
    references:
