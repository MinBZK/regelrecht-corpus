  - number: '5.2'
    text: |-
      1 Op de voorbereiding van een algemene maatregel van bestuur in verband met de invoering van de
      [Omgevingswet][ref1] zijn de [artikelen 23.4][ref2] en [23.5 van de Omgevingswet][ref3] van overeenkomstige
      toepassing. Op de voorbereiding van een ministeriële regeling in verband met de invoering van de Omgevingswet is
      artikel 23.4 van de Omgevingswet van overeenkomstige toepassing.

      2 De artikelen, bedoeld in het eerste lid, treden in de plaats van wettelijke voorschriften waarin is bepaald dat:

      a. over het ontwerp van een regeling of het voornemen tot het treffen van een regeling advies moet worden gevraagd
      of extern overleg moet worden gevoerd,

      b. van het ontwerp van een regeling kennis moet worden gegeven,

      c. de voordracht niet eerder wordt gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd,

      d. de voordracht voor een algemene maatregel van bestuur moet worden gedaan door een andere Minister dan Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties,

      e. door of namens een van de kamers der Staten-Generaal of een aantal leden daarvan kan worden verlangd dat het
      onderwerp of de inwerkingtreding van de regeling bij de wet wordt geregeld, en

      f. een regeling niet eerder in werking kan treden dan nadat sinds haar vaststelling of bekendmaking een bepaalde
      termijn is verstreken.

      3 Het tweede lid, onder a, is niet van toepassing op het vragen van advies aan de Afdeling advisering van de Raad
      van State.

      4 Het eerste lid is niet van toepassing op de voorbereiding van een algemene maatregel
      van bestuur als bedoeld in [artikel 10.12, eerste en tweede lid][ref4], respectievelijk
      [artikel 10.15, eerste lid, van de Wet luchtvaart][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel23.4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel23.5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel10.12
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel10.15
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel5.2
