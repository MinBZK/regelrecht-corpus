      1 Een projectplan van een waterschap als bedoeld in [artikel 5.4, eerste lid, van de Waterwet][ref1] dat
      onherroepelijk is, geldt voor zover de in het projectplan omschreven activiteit onder de [Omgevingswet][ref2]
      vergunningplichtig is, als een omgevingsvergunning als bedoeld in [artikel 5.3 van de Omgevingswet][ref3] voor
      die activiteit.

      2 Als een projectplan niet onherroepelijk is, blijft het oude recht daarop van toepassing als een ontwerp daarvan
      voor de inwerkingtreding van [afdeling 5.1 van de Omgevingswet][ref4] ter inzage is gelegd.

      3 Een vastgesteld projectplan wordt, voor zover na de inwerkingtreding van de Omgevingswet onteigening plaatsvindt
      ten behoeve van de tenuitvoerlegging van de in het projectplan omschreven activiteit, voor de toepassing van
      [artikel 11.6 van de Omgevingswet][ref5] als een onteigeningsbelang aangemerkt.

      4 Als de voorbereiding van een projectplan dat wordt voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] voor de inwerkingtreding van de [Omgevingswet][ref7]
      is aangevangen, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan de bij of krachtens
      de [artikelen 5.47][ref8] en [5.48 van de Omgevingswet][ref9] gestelde vereisten, kan een ontwerp van een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref10] ter inzage worden gelegd.

      5 Als de voorbereiding van een projectplan dat wordt voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref11] voor de inwerkingtreding van de [Omgevingswet][ref12]
      in een vergevorderd stadium is, geen ontwerp van het projectplan ter inzage is gelegd en is voldaan aan
      [artikel 5.48, eerste lid, van de Omgevingswet][ref13], kan binnen een periode van een jaar en zes maanden na
      dat tijdstip een projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref14] worden
      vastgesteld.


