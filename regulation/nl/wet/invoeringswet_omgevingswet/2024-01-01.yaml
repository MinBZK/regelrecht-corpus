  - number: 4.106a
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] toepassing is gegeven aan een procedure als bedoeld in
      [artikel 3.33, eerste lid][ref2], of [3.35, eerste lid, van de Wet ruimtelijke ordening][ref3] en die procedure
      bij de inwerkingtreding van de Omgevingswet nog niet is afgerond, geldt voor de te nemen besluiten anders dan een
      inpassingsplan dat:

      a. op grond van [artikel 5.45, eerste lid, van de Omgevingswet][ref4] is bepaald dat
      [artikel 16.7 van die wet][ref5] van toepassing is op de coördinatie van de te nemen besluiten, en

      b. het besluiten zijn ter uitvoering van een projectbesluit als bedoeld in
      [artikel 5.45, eerste lid, van de Omgevingswet][ref6].


