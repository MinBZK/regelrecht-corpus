  - number: 4.104a
    text: |-
      1 Voor zover voor de inwerkingtreding van de [Omgevingswet][ref1] het luchthavenindelingbesluit, bedoeld in
      [artikel 8.4 van de Wet luchtvaart][ref2], een luchthavenbesluit als bedoeld in [artikel 8.43, eerste lid][ref3],
      [8.70, eerste lid][ref4], of [10.15, eerste lid, van die wet][ref5], of een besluit beperkingengebied
      buitenlandse luchthaven als bedoeld in [artikel 8a.54, eerste of tweede lid, van die wet][ref6] geldt als een
      voorbereidingsbesluit als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref7] en het ontwerp van het
      bestemmingsplan dat voorziet in het in overeenstemming brengen van dat plan met het luchthavenindelingbesluit,
      het luchthavenbesluit of het besluit beperkingengebied buitenlandse luchthaven voor de inwerkingtreding van de
      [Omgevingswet][ref8] ter inzage is gelegd, blijft op dat voorbereidingsbesluit het oude recht van toepassing tot
      het plan van kracht is.

      2 Als het ontwerp van het bestemmingsplan, bedoeld in het eerste lid, niet voor de inwerkingtreding van de
      [Omgevingswet][ref9] ter inzage is gelegd, geldt het luchthavenindelingbesluit, het luchthavenbesluit of
      het besluit beperkingengebied buitenlandse luchthaven, bedoeld in dat lid, als een voorbereidingsbesluit als
      bedoeld in [artikel 4.16, tweede lid, van de Omgevingswet][ref10] respectievelijk als een voorbereidingsbesluit
      als bedoeld in artikel 4.16, eerste lid, van die wet als het gaat om een luchthavenbesluit als bedoeld in
      [artikel 8.43, eerste lid, van de Wet luchtvaart][ref11]. In afwijking van artikel 4.16, vijfde lid, van de
      Omgevingswet eindigt de gelding als voorbereidingsbesluit alleen op het tijdstip waarop het overeenkomstig
      het luchthavenindelingbesluit, het luchthavenbesluit of het besluit beperkingengebied buitenlandse luchthaven
      gewijzigde omgevingsplan in werking treedt of is vernietigd.


