      1 Als het ontwerp van een inpassingsplan als bedoeld in [artikel 3.26, eerste lid][ref1], respectievelijk in
      [artikel 3.28, eerste lid, van de Wet ruimtelijke ordening][ref2] waarvoor op grond van artikel 3.26, tweede
      lid, respectievelijk 3.28, tweede lid, van die wet, in samenhang met [artikel 3.7 van die wet][ref3], een
      voorbereidingsbesluit is genomen, voor de inwerkingtreding van de [Omgevingswet][ref4] ter inzage is gelegd, blijft
      op dat voorbereidingsbesluit het oude recht van toepassing tot het plan van kracht is.

      2 Als het ontwerp van een inpassingsplan niet voor de inwerkingtreding van de [Omgevingswet][ref5]
      ter inzage is gelegd, geldt dat voorbereidingsbesluit als een voorbereidingsbesluit als bedoeld in
      [artikel 4.16, eerste respectievelijk tweede lid, van de Omgevingswet][ref6]. In dat geval loopt de termijn,
      bedoeld in het vijfde lid van dat artikel, vanaf de inwerkingtreding van de [Omgevingswet][ref7].


