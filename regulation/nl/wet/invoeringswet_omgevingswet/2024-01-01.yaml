  - number: '4.14'
    text: |-
      Als een activiteit voor de inwerkingtreding van de [Omgevingswet][ref1] zonder ontheffing of vergunning
      onafgebroken rechtmatig is verricht en bij de inwerkingtreding van die wet voor die activiteit een verbod als
      bedoeld in [artikel 5.1][ref2], [5.3][ref3] of [5.4 van de Omgevingswet][ref4] van toepassing wordt, geldt voor
      die activiteit bij de inwerkingtreding van die wet een omgevingsvergunning van rechtswege voor een termijn van twee
      jaar, mits die activiteit naar aard en omvang niet verschilt van de activiteit zoals deze werd verricht voor de
      inwerkingtreding van die wet. Bij algemene maatregel van bestuur kan voor daarbij aangegeven activiteiten worden
      bepaald dat:

      a. een omgevingsvergunning van rechtswege geldt voor een andere daarbij aangegeven termijn,

      b. aan de geldigheid van een omgevingsvergunning van rechtswege geen termijn is verbonden.


