  - number: '5.1'
    text: |-
      1 Als een bepaling, opgenomen in de wet, genoemd in [artikel 3.1][ref1] of [artikel 4.1][ref2], wordt vervangen
      door een bepaling in een algemene maatregel van bestuur, kan de overgangsbepaling die daarvoor nodig is, in een
      algemene maatregel van bestuur worden opgenomen.

      2 Als in verband met de invoering van de [Omgevingswet][ref3] een wet, algemene maatregel van bestuur of
      ministeriële regeling wordt ingetrokken waarin een overgangsrechtelijke bepaling is opgenomen, blijft die
      overgangsrechtelijke bepaling van toepassing tot die is uitgewerkt.

      3 Als deze wet, [hoofdstuk 22 van de Omgevingswet][ref4],
      [hoofdstuk 3 van de Aanvullingswet bodem Omgevingswet][ref5],
      [hoofdstuk 3 van de Aanvullingswet geluid Omgevingswet][ref6],
      [hoofdstuk 4 van de Aanvullingswet grondeigendom Omgevingswet][ref7] of
      [hoofdstuk 2 van de Aanvullingswet natuur Omgevingswet][ref8] daarin niet voorziet of strikte toepassing van
      deze wet of die bepalingen in specifieke situaties onredelijk is of leidt tot ernstige nadelige gevolgen voor
      de fysieke leefomgeving, kunnen, zo nodig in afwijking van deze wet of die bepalingen, bij regeling van Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties regels worden vastgesteld voor een goede invoering
      van de [Omgevingswet][ref9]. Een regeling die afwijkt van de genoemde aanvullingswetten wordt vastgesteld in
      overeenstemming met Onze Minister die het aangaat.

      4 Na de plaatsing in de Staatscourant van een krachtens het derde lid vastgestelde ministeriële regeling die
      afwijkt van deze wet of die bepalingen, wordt een voorstel van wet tot regeling van het betrokken onderwerp
      zo spoedig mogelijk bij de Staten-Generaal ingediend. Als het voorstel wordt ingetrokken of een van de beide
      kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de ministeriële regeling onverwijld
      ingetrokken. Als het voorstel tot wet wordt verheven, wordt de ministeriële regeling ingetrokken op het tijdstip
      van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Artikel3.1
