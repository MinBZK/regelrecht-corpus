        artikel: '6.24'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '12.4'
  - number: '4.113'
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] kosten zijn gemaakt als bedoeld in [artikel 6.8][ref2] of
      [6.9 van de Wet ruimtelijke ordening][ref3], blijft het oude recht van toepassing tot het tijdstip waarop:

      a. het besluit op het verzoek om vergoeding van die kosten, het besluit tot oplegging van een verplichting tot
      vergoeding van die kosten of het besluit tot invordering van die kosten onherroepelijk wordt, of

      b. de verschuldigde kosten volledig zijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6.8
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel6.9
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.113
