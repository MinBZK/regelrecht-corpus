  - number: '4.22'
    text: |-
      Deze paragraaf is van toepassing op de handhaving van:

      a. het bepaalde bij of krachtens de [Wet algemene bepalingen omgevingsrecht][ref1],

      b. het bepaalde bij of krachtens de

      1°. [Waterwet][ref2]

      2°. [Kernenergiewet][ref3],

      3°. [Monumentenwet 1988][ref4], voor zover van kracht overeenkomstig [artikel 9.1 van de Erfgoedwet][ref5],

      4°. [Ontgrondingenwet][ref6],

      5°. [Wet bescherming Antarctica][ref7],

      6°. [Wet bodembescherming][ref8],

      7°. [Wet geluidhinder][ref9],

      8°. [Wet inzake de luchtverontreiniging][ref10],

      9°. [Wet milieubeheer][ref11],

      10°. [Wet natuurbescherming][ref12],

      11°. [Wet ruimtelijke ordening][ref13],

      12°. [Woningwet][ref14],

      voor zover bij of krachtens die wetten is bepaald dat
      [hoofdstuk 5 van de Wet algemene bepalingen omgevingsrecht][ref15] van toepassing is,

      c. de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref16],

      d. artikel [92a][ref17] en [artikel 120 van de Woningwet][ref18], voor zover dit laatstgenoemde artikel gaat om
      regels die voortvloeien uit [richtlijn 2010/31](32010L0031)/EU van het Europees Parlement en de Raad van 19 mei
      2010 betreffende de energieprestatie van gebouwen van de [Woningwet][ref19],

      e. het bepaalde bij of krachtens de als gevolg van deze wet vervallen gedeelten van:

      1°. de [Wet beheer rijkswaterstaatswerken][ref20],

      2°. de [Spoorwegwet][ref21],

      3°. de [Wet lokaal spoor][ref22],

      4°. de [Wet luchtvaart][ref23],

      5°. de [Mijnbouwwet][ref24],

      f. een gedoogplicht bij of krachtens:

