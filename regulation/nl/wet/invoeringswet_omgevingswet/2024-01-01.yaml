      [Erfgoedwet][ref10], is ingediend, blijft het oude recht van toepassing tot het tijdstip waarop het vonnis in
      kracht van gewijsde is gegaan, en bij toewijzing van die vordering, de toegewezen schadevergoeding volledig is
      betaald.


