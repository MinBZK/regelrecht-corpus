  - number: '4.17'
    text: |-
      1 Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt ingediend binnen vijf jaar na
      de inwerkingtreding van de [Omgevingswet][ref1], als voor de inwerkingtreding van die wet schade is veroorzaakt
      door:

      a. een beschikking als bedoeld in [artikel 40, elfde lid, onder a, van de Mijnbouwwet][ref2],

      b. een vergunning als bedoeld in [artikel 11, tweede lid, van de Monumentenwet 1988][ref3] zoals die wet luidde
      voor de inwerkingtreding van de [Erfgoedwet][ref4] of een weigering van die vergunning,

      c. een beschikking als bedoeld in [artikel 8 van de Ontgrondingenwet][ref5],

      d. een tracébesluit als bedoeld in [artikel 22, eerste lid, van de Tracéwet][ref6],

      e. een beschikking als bedoeld in [artikel 4.2, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref7],

      f. een beschikking als bedoeld in [artikel 15.20, eerste lid, onder b, van de Wet milieubeheer][ref8]
      voor zover het gaat om artikel 10.52 van die wet, een beschikking als bedoeld in
      [artikel 15.20, eerste lid, onder c, van de Wet milieubeheer][ref9] of een bepaling als bedoeld
      in[ artikel 15.21, eerste lid, aanhef en onder a, van die wet][ref10], of

      g. een koninklijk besluit als bedoeld in [artikel 6.1, tweede lid, onder g, van de Wet ruimtelijke ordening][ref11].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref12]:

      a. een aanvraag om een besluit als bedoeld in het eerste lid is ingediend,

      b. een ontwerp van een ambtshalve te nemen besluit als bedoeld in het eerste lid ter inzage is gelegd, of

      c. voor een ambtshalve te nemen besluit als bedoeld in het eerste lid toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref13],

      en het besluit wordt vastgesteld na de inwerkingtreding van de [Omgevingswet][ref14], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding, veroorzaakt door dat besluit, als dat is ingediend binnen vijf jaar
      nadat het besluit is vastgesteld.

      3 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit onherroepelijk wordt en,
      bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      4 [Afdeling 4.1][ref15] is in die gevallen niet van toepassing.


