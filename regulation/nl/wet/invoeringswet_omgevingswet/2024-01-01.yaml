  - number: '4.112'
    text: |-
      Het oude recht blijft van toepassing op een overeenkomst als bedoeld in
      [artikel 6.24 van de Wet ruimtelijke ordening][ref1] als die voor de inwerkingtreding van de [Omgevingswet][ref2]
      is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel6.24
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel12.4
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel4.112
    references:
