      1 Aan de verplichting tot het vaststellen van een gemeentelijke omgevingsvisie als bedoeld in
      [artikel 3.1, eerste lid, van de Omgevingswet][ref1] wordt uiterlijk op een bij koninklijk besluit te bepalen
      tijdstip voldaan.

      2 In afwijking van [artikel 34, eerste lid, tweede zin, van de Wet algemene regels herindeling][ref2] verloopt de
      termijn voor het vaststellen van de omgevingsvisie, bedoeld in die zin, niet eerder dan het bij koninklijk besluit
      te bepalen tijdstip, bedoeld in het eerste lid.

      3 De hoofdzaken van het te voeren beleid in een gemeentelijk milieubeleidsplan als bedoeld in
      [artikel 4.16 van de Wet milieubeheer][ref3], een gemeentelijk verkeers- en vervoersplan als
      bedoeld in [artikel 9 van de Planwet verkeer en vervoer][ref4] en een structuurvisie als bedoeld in
      [artikel 2.1, eerste lid, van de Wet ruimtelijke ordening][ref5], blijven gelden totdat een gemeentelijke
      omgevingsvisie van kracht wordt.

      4 Als een plan of structuurvisie als bedoeld in het derde lid niet van kracht is, blijft het oude recht daarop
      van toepassing als voor de inwerkingtreding van [artikel 3.1, eerste lid, van de Omgevingswet][ref6] een ontwerp
      daarvan ter inzage is gelegd.


