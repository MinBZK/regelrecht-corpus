  - number: '5.3'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      verschillende hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel5.3
  - number: '5.4'
    text: 'Deze wet wordt aangehaald als: Invoeringswet Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0043660/2024-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 Na de inwerkingtreding van hoofdstuk 1 van:

      a. deze wet,

      b. de [Aanvullingswet geluid Omgevingswet][ref1],

      c. de [Aanvullingswet bodem Omgevingswet][ref2],

      d. de Aanvullingswet natuur Omgevingswet,

      e. de [Aanvullingswet grondeigendom Omgevingswet][ref3],

      kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nummering van een of meer hoofdstukken,
      afdelingen, paragrafen en artikelen van de [Omgevingswet][ref4] opnieuw vaststellen en brengt hij de aanhaling
      daarvan binnen die wet met de nieuwe nummering in overeenstemming.

      2 Als toepassing is gegeven aan het eerste lid:

      a. wordt de tekst van de [Omgevingswet][ref5] in het Staatsblad geplaatst,

      b. brengt Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de aanhaling van de hoofdstukken, afdelingen,
      paragrafen en artikelen van de [Omgevingswet][ref6] in de overige hoofdstukken van de wetten, genoemd in het eerste
      lid, onder a tot en met e, met de nieuwe nummering in overeenstemming.

      3 Als toepassing is gegeven aan het tweede lid, aanhef en onder b, wordt de tekst van de betrokken hoofdstukken in
      het Staatsblad geplaatst.


