      1 In het omgevingsplan worden door de gemeenteraad en het dagelijks bestuur van het waterschap geen regels gesteld
      die in strijd zijn met het inpassingsplan, bedoeld in [artikel 3.26 van de Wet ruimtelijke ordening][ref1].

      2 Het eerste lid is niet van toepassing voor zover een instructieregel als bedoeld in [artikel 2.22 ][ref2]of
      [2.24 van de Omgevingswet][ref3] of een instructie als bedoeld in [artikel 2.33][ref4] of
      [2.34 van de Omgevingswet][ref5] het stellen van dergelijke regels vergt.

      3 Het eerste lid is van toepassing tot tien jaar na de vaststelling van het
      inpassingsplan, of korter, als in het inpassingsplan een termijn is gesteld als bedoeld in
      [artikel 3.26, vijfde lid, van de Wet ruimtelijke ordening][ref6].


