  - number: '4.114'
    text: |-
      1 Een welstandsnota als bedoeld in [artikel 12a, eerste lid, van de Woningwet][ref1] die van kracht is, geldt als
      een beleidsregel als bedoeld in [artikel 4.19 van de Omgevingswet][ref2].

      2 Als een ontwerp van een welstandsnota voor de inwerkingtreding van de [Omgevingswet][ref3] ter inzage is gelegd,
      blijft het oude recht daarop van toepassing tot de welstandsnota is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4.19
