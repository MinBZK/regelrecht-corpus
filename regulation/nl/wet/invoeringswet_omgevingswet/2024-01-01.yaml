  - number: '4.111'
    text: |-
      1 Een aanwijzing als bedoeld in [artikel 4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref1]
      die voor de inwerkingtreding van de [Omgevingswet][ref2] van kracht is en ter uitvoering waarvan
      nog geen ontwerpbestemmingsplan ter inzage is gelegd, geldt als een instructie als bedoeld in
      [artikel 2.34, eerste lid, en tweede lid, onder c, van de Omgevingswet][ref3].

      2 Een aanwijzing als bedoeld in [artikel 4.4, eerste lid, onder b, van de Wet ruimtelijke ordening][ref4]
      die voor de inwerkingtreding van de [Omgevingswet][ref5] van kracht is en ter uitvoering
      waarvan nog geen ontwerpbesluit tot vaststelling of wijziging van een verordening als bedoeld in
      [artikel 4.1 van de Wet ruimtelijke ordening][ref6] ter inzage is gelegd, geldt als een instructie als bedoeld in
      [artikel 2.34, eerste lid, en tweede lid, onder a, van de Omgevingswet][ref7].


