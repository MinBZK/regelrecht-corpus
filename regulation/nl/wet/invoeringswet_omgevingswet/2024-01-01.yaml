      1 Als de voorbereiding van een inpassingsplan als bedoeld in [artikel 3.26][ref1] of
      [3.28 van de Wet ruimtelijke ordening][ref2] voor de inwerkingtreding van de [Omgevingswet][ref3] is
      aangevangen, geen ontwerp van het inpassingsplan ter inzage is gelegd en is voldaan aan de bij of krachtens
      de [artikelen 5.47][ref4] en [5.48 van de Omgevingswet][ref5] gestelde vereisten, kan een ontwerp van een
      projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref6] ter inzage worden gelegd.

      2 Als de voorbereiding van een inpassingsplan voor de inwerkingtreding van de [Omgevingswet][ref7] in
      een vergevorderd stadium is, geen ontwerp van het inpassingsplan ter inzage is gelegd en is voldaan aan
      [artikel 5.48, eerste lid, van de Omgevingswet][ref8], kan binnen een periode van een jaar en zes maanden na
      dat tijdstip een projectbesluit als bedoeld in [artikel 5.44, eerste lid, van de Omgevingswet][ref9] worden
      vastgesteld.


