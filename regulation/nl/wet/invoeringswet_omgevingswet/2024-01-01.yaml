  - number: '3.1'
    text: |-
      De volgende wetten worden ingetrokken:

      a. de[ Belemmeringenwet Landsverdediging][ref1],

      b. de [Belemmeringenwet Privaatrecht][ref2],

      c. de [Crisis- en herstelwet][ref3],

      d. de [Interimwet stad-en-milieubenadering][ref4],

      e. de [Ontgrondingenwet][ref5],

      f. de [Planwet verkeer en vervoer][ref6],

      g. de [Spoedwet wegverbreding][ref7],

      h. de [Tracéwet][ref8],

      i. de [Wet algemene bepalingen omgevingsrecht][ref9],

      j. de [Wet ammoniak en veehouderij][ref10],

      k. de [Wet geurhinder en veehouderij][ref11],

      l. de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref12],

      m. de [Wet inzake de luchtverontreiniging][ref13],

      n. de [Wet ruimtelijke ordening][ref14].


