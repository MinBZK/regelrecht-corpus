      1 Als de in [artikel 2.3, zevende lid, van de Crisis- en herstelwet][ref1] bedoelde termijn van tien jaar is
      verstreken en op dat moment niet wordt voldaan aan een wettelijk voorschrift gesteld bij of krachtens een in
      [artikel 23.3, eerste lid, van de Omgevingswet][ref2] genoemde wet:

      a. neemt degene die het experiment uitvoert de nodige maatregelen om zo spoedig mogelijk alsnog aan dat voorschrift
      te voldoen, en

      b. kan het college van burgemeester en wethouders een aanwijzing geven tot het treffen van maatregelen als bedoeld
      onder a.

      2 Als de te nemen maatregelen niet toereikend zijn, kan Onze Minister besluiten om het experiment te beëindigen.
      Aan dat besluit kunnen voorschriften worden verbonden.


