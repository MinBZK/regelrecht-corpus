      Een gemeentelijk plan met maatregelen:

      a. dat is gericht op het bereiken van een in [bijlage 2 bij de Wet milieubeheer][ref1], zoals die wet luidde voor
      de inwerkingtreding van de [Omgevingswet][ref2], opgenomen grenswaarde op een bij dat plan aangewezen locatie,

      b. dat de gegevens, bedoeld in bijlage XV, deel A, bij [Richtlijn 2008/50/EG](32008L0050) van het Europees
      Parlement en de Raad van 21 mei 2008 betreffende de luchtkwaliteit en schonere lucht voor Europa (PbEU 2008, L 152)
      bevat, en

      c. dat na de inwerkingtreding van [artikel 3.10, eerste lid, van de Omgevingswet][ref3] van kracht is, geldt als
      een programma als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
