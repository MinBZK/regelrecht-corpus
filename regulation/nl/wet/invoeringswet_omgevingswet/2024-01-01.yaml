  - number: 4.114a
    text: |-
      Een besluit tot het opleggen van een verplichting om aan een bouwwerk voorzieningen te treffen als bedoeld in
      [artikel 13, aanhef en onder b][ref1], of [13a van de Woningwet][ref2] dat onherroepelijk is, geldt als een besluit
      tot het stellen van maatwerkvoorschriften als bedoeld in [artikel 4.5 van de Omgevingswet][ref3], voor zover dat
      besluit gaat over een onderwerp waarvoor het bevoegd gezag maatwerkvoorschriften kan stellen als bedoeld in dat
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4.5
