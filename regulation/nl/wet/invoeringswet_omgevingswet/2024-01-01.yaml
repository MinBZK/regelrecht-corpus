      1 Een gemeentelijke omgevingsvisie die:

      a. voldoet aan de [artikelen 3.2][ref1] en [3.3 van de Omgevingswet][ref2], en

      b. voor de inwerkingtreding van [artikel 3.1, eerste lid, van de Omgevingswet][ref3] van kracht is of onmiddellijk
      na de inwerkingtreding van die bepaling van kracht wordt,

      geldt als een gemeentelijke omgevingsvisie als bedoeld in [artikel 3.1, eerste lid, van de Omgevingswet][ref4].

      2 Een provinciale omgevingsvisie die:

      a. voldoet aan de [artikelen 3.2][ref5] en [3.3 van de Omgevingswet][ref6], en

      b. voor de inwerkingtreding van [artikel 3.1, tweede lid, van de Omgevingswet][ref7] van kracht is of onmiddellijk
      na de inwerkingtreding van die bepaling van kracht wordt,

      geldt als een provinciale omgevingsvisie als bedoeld in [artikel 3.1, tweede lid, van de Omgevingswet][ref8].

      3 De nationale omgevingsvisie die:

      a. voldoet aan de [artikelen 3.2][ref9] en [3.3 van de Omgevingswet][ref10], en

      b. voor de inwerkingtreding van [artikel 3.1, derde lid, van de Omgevingswet][ref11] van kracht is of onmiddellijk
      na de inwerkingtreding van die bepaling van kracht wordt, geldt als een nationale omgevingsvisie als bedoeld in
      artikel 3.1, derde lid, van de Omgevingswet.


