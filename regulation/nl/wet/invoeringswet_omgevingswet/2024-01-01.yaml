    text: |-
      1 Als handelingen waarop het tracébesluit betrekking heeft de kwaliteit van de natuurlijke habitats en de habitats
      van soorten in een Natura 2000-gebied als bedoeld in de [Wet natuurbescherming][ref1] kunnen verslechteren of
      een significant verstorend effect kunnen hebben op de soorten waarvoor het gebied is aangewezen, gelet op de
      instandhoudingsdoelstelling voor dat gebied, geldt het tracébesluit als een projectbesluit dat geldt als een
      vergunning als bedoeld in [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref2].

      2 Het eerste lid is niet van toepassing als ten aanzien van het project of
      de andere handeling waarop het tracébesluit betrekking heeft, is voldaan aan
      [artikel 2.9, eerste, tweede, derde of vijfde lid, van de Wet natuurbescherming][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2.9
