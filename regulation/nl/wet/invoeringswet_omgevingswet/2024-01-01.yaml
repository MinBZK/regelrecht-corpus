  - number: '4.2'
    text: |-
      Deze afdeling is van toepassing op besluiten tot oplegging van een gedoogplicht op grond van of met toepassing van:

      a. [artikel 5 van de Belemmeringenwet Landsverdediging][ref1],

      b. de [Belemmeringenwet Privaatrecht][ref2],

      c. [artikel 2.3, elfde lid, van de Crisis- en herstelwet][ref3],

      d. [artikel 7 van de Drinkwaterwet][ref4],

      e. de[ artikelen 9g][ref5] en [20 van de Elektriciteitswet 1998][ref6],

      f. [artikel 39a van de Gaswet][ref7],

      g. [artikel 71][ref8] in samenhang met [artikel 15, onder b, van de Kernenergiewet][ref9],

      h. [artikel 57, eerste en tweede lid, van de Monumentenwet 1988][ref10] zoals die wet luidde voor de
      inwerkingtreding van de [Erfgoedwet][ref11],

      i. [artikel 5 van de Mijnbouwwet][ref12],

      j. de [artikelen 21g, eerste lid, eerste en tweede zin][ref13], en
      [21h, eerste lid, van de Ontgrondingenwet][ref14],

      k. [artikel 24, derde lid, van de Spoorwegwet][ref15],

      l. [artikel 21 van de Tracéwet][ref16],

      m. [artikel 23, eerste lid, van de Uitvoeringswet Nederlands-Duits Grensverdrag][ref17],

      n. [artikel 38 van de Warmtewet][ref18],

      o. de [artikelen 5.21, eerste lid][ref19], [5.22, eerste lid][ref20], en [5.24, eerste lid, van de Waterwet][ref21],

      p. [artikel 70 van de Wet bodembescherming][ref22],

      q. [artikel 7, eerste lid, van de Wet lokaal spoor][ref23],

      r. [artikel 60, eerste lid, van de Wet inzake de luchtverontreiniging][ref24],

      s. [artikel 3.36a van de Wet ruimtelijke ordening][ref25].


