preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels met betrekking tot meeteenheden en
    meetinstrumenten op een aan de eisen van deze tijd aangepaste en overzichtelijke wijze vast te stellen voor
    Bonaire, Sint Eustatius en Saba.

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *meetinstrument:* apparaat of systeem met een meetfunctie;
        - *ijk:* keuring van een meetinstrument als bedoeld in [artikel 3][ref1] door de bevoegde instantie aan de bij of
      krachtens artikel 3 gestelde eisen;
        - *herijk:* herhaalde keuring van een in gebruik genomen meetinstrument als bedoeld in [artikel 3][ref2] door de
      bevoegde instantie aan de bij of krachtens artikel 3 gestelde eisen;
        - *in gebruik nemen:* eerste gebruik van een voor een eindgebruiker bestemd meetinstrument voor het doel waarvoor
      het is bestemd;
        - *bevoegde instantie:* op grond van [artikel 11][ref3] aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035310#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035310#Artikel11
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel1
