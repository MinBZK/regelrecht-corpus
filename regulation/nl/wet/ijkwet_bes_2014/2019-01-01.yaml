        artikel: '10'
        hoofdstuk: '4'
  - number: '16'
    text: |-
      De in [artikel 15][ref1] strafbaar gestelde feiten worden beschouwd als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel15
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '15'
        hoofdstuk: '6'
  - number: '17'
    text: |-
      Het bestuurscollege kan de bevoegde instantie opdragen gebruik te maken van haar bevoegdheden om de naleving van
      deze wet af te dwingen.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel17
  - number: '18'
    text: |-
      1 De bevoegde instantie verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van alle gegevens en bescheiden, voor zover dat voor de vervulling
      van zijn taak redelijkerwijs noodzakelijk is.

      2 De instantie is verplicht Onze Minister of een door hem daartoe aangezochte deskundige of instelling gelegenheid
      te geven, na te gaan of de toezichthoudende instantie voldoet aan de gestelde eisen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel18
  - number: '19'
    text: |-
      De [IJkwet BES][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028247
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028247
  - number: '22'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: IJkwet BES 2014.'
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel23
