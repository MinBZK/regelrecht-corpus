  - number: '2'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor grootheden meeteenheden worden vastgesteld en kunnen tevens regels
      worden gesteld betreffende:

      a. het symbool, de aanduiding, de omschrijving en het gebruik van een meeteenheid;

      b. de benaming en de meetstandaard van een grootheid.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel2
  - number: '3'
    text: |-
      1 Aan ijk en herijk zijn bij ministeriële regeling aangewezen meetinstrumenten onderworpen die worden gebruikt voor
      of zich bevinden op plaatsen bestemd voor:

      a. het drijven van handel;

      b. het doen van leveringen;

      c. het vaststellen van heffingen of arbeidsloon naar grondslag van maat of gewicht;

      d. observatie, diagnose en behandeling in de medische praktijk;

      e. het vervaardigen van medicijnen op voorschrift in de apotheek en het verrichten van analyses in medische en
      farmaceutische laboratoria;

      f. het vaststellen van overtredingen in het kader van de verkeershandhaving of de handhaving van de
      milieuregelgeving.

      2 Meetinstrumenten als bedoeld in het eerste lid ondergaan de ijk voordat ze in gebruik worden genomen.

      3 Bij ministeriële regeling worden de eisen vastgesteld waaraan meetinstrumenten, bedoeld in het eerste lid, moeten
      voldoen. Daarbij kan onderscheid worden gemaakt naar het gebruiksdoel van een meetinstrument.

      4 In de regels, bedoeld in het derde lid, kan onderscheid worden gemaakt tussen het in gebruik nemen en het gebruik
      van meetinstrumenten.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel3
  - number: '4'
    text: |-
      1 Een meetinstrument ondergaat een herijk op grond van de in [artikel 3][ref1] voor dat meetinstrument
      voorgeschreven eisen:

      a. voordat het meetinstrument weer wordt gebruikt na een reparatie of een verandering die van invloed kan zijn op
      de meetfunctie,

      b. na schending van het ijkmerk, of

      c. op verzoek van de eigenaar of gebruiker.

      2 Bij ministeriële regeling kan voor een meetinstrument als bedoeld in [artikel 3, eerste lid][ref2], een termijn
      worden vastgesteld waarbinnen het herijkt moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035310#Artikel3
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
