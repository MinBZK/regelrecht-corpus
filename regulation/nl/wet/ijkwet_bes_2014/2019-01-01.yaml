        artikel: '3'
        hoofdstuk: '3'
  - number: '5'
    text: |-
      1 Meetinstrumenten als bedoeld in [artikel 3][ref1] worden voorzien van een ijkmerk.

      2 De ijkmerken, bedoeld in het eerste lid, worden onderscheiden in:

      a. goedkeuringsmerken

      b. afkeuringsmerken

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent de vorm van de ijkmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
  - number: '6'
    text: |-
      1 Bij ijk of herijk goedgekeurde meetinstrumenten krijgen een goedkeuringsmerk.

      2 Het hoofd van de bevoegde instantie kan in bijzondere gevallen bepalen dat het goedkeuringsmerk wordt vervangen
      door een schriftelijke verklaring.

      3 Bij ijk of herijk afgekeurde meetinstrumenten krijgen een afkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden:

      a. een grootheid uit te drukken in een andere meeteenheid dan de meeteenheid die krachtens [artikel 2][ref1] voor
      die grootheid is vastgesteld;

      b. voor een grootheid een benaming te bezigen in strijd met de krachtens [artikel 2][ref2] gestelde regels.

      2 Bij ministeriële regeling kunnen gevallen of omstandigheden worden bepaald waarin het verbod, bedoeld in het
      eerste lid, niet geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035310#Artikel2
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035310
        artikel: '2'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 Het is enkel toegestaan een meetinstrument als bedoeld in [artikel 3][ref1] in gebruik te nemen of te gebruiken
      wanneer deze voldoet aan de voor dit meetinstrument vastgestelde eisen en is voorzien van een goedkeuringsmerk
      of vergezeld gaat van een voor dit meetinstrument afgegeven schriftelijke verklaring als bedoeld in
      [artikel 6, tweede lid][ref2].

      2 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen of omstandigheden een
      vrijstelling geldt van het gebod, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035310#Artikel6
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0035310
        artikel: '6'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Het is enkel toegestaan een meetinstrument als bedoeld in [artikel 3][ref1] te gebruiken indien het meetinstrument:

      a. in een goede staat van onderhoud verkeert,

      b. overeenkomstig de instructies van de fabrikant geïnstalleerd en dienovereenkomstig gebruikt wordt,

      c. gebruikt wordt voor metingen overeenkomstig de bestemming en

      d. zodanig gejusteerd en gecorrigeerd wordt dat de aanwijzingsfouten zo dicht mogelijk bij nul liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Meetinstrumenten welke worden gebruikt voor de verkoop aan particulieren van goederen die bij de maat of het
      gewicht worden verkocht, moeten zodanig zijn opgesteld, dat de koper de aanwijzing van het betrokken meetinstrument
      onbelemmerd kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel10
  - number: '11'
    text: |-
      1 Het bestuurscollege wijst één instantie aan die tot taak heeft met inachtneming van het bij of krachtens deze
      wet bepaalde:

      a. ten aanzien van meetinstrumenten, waarvoor bij of krachtens [artikel 3][ref1] voorschriften zijn gegeven, de ijk
      en herijk te verrichten;

      b. zorg te dragen voor de uitoefening van het toezicht op de naleving van hetgeen bij of krachtens deze wet is
      bepaald.

      2 Bij eilandsverordening, houdende algemene maatregelen, kan de inrichting, samenstelling en werkwijze van de in
      het eerste lid bedoelde instantie worden geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
  - number: '12'
    text: |-
      1 De bevoegde instantie kan de eigenaar of houder van een meetinstrument kosten in rekening brengen voor zover deze
      redelijkerwijs kunnen worden toegerekend aan de voor de ijk en herijk noodzakelijke handelingen.

      2 Bij eilandsverordening, houdende algemene maatregelen, kunnen tarieven worden vastgesteld die de bevoegde
      instantie ten hoogste mag berekenen voor de verrichte werkzaamheden in het kader van ijk en herijk.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel12
  - number: '13'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe door het
      bestuurscollege aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.

      2 De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijs noodzakelijk is, bevoegd:

      a. alle inlichtingen te vragen;

      b. inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of
      deze daartoe tijdelijk mee te nemen;

      c. meetinstrumenten als bedoeld in [artikel 3][ref1] te allen tijde te onderzoeken en deze daartoe tijdelijk
      mee te nemen en, indien zij niet voldoen aan de bij of krachtens deze wet voor herijk gestelde eisen, van een
      afkeuringsmerk te voorzien;

      d. met medeneming van de benodigde apparatuur elke plaats te betreden met uitzondering van een woning zonder
      toestemming van de bewoner waarbij zij bevoegd zijn zich te doen vergezellen door personen die daartoe door hen
      zijn aangewezen.

      3 Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.

      4 Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.

      5 De krachtens het eerste lid aangewezen personen staan onder het gezag van de door het bestuurscollege aangewezen
      bevoegde instantie en leggen over werkzaamheden uitsluitend aan die instantie verantwoording af.


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel3
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0035310
        artikel: '3'
        hoofdstuk: '3'
  - number: '14'
    text: |-
      In beslag genomen meetinstrumenten worden niet aan de rechthebbende teruggegeven alvorens te zijn geijkt of
      herijkt.
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel14
  - number: '15'
    text: |-
      Met hechtenis van ten hoogste een week of een geldboete van ten hoogste USD 500 wordt gestraft hij, die
      handelt in strijd met dan wel niet voldoet aan de vereisten gesteld in de [artikelen 7, eerste lid][ref1],
      [8, eerste lid][ref2], [9][ref3] en [10][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035310#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0035310#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0035310#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0035310#Artikel10
    url: https://wetten.overheid.nl/BWBR0035310/2019-01-01#Artikel15
    references:
