  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke van de algemene gegevens, bedoeld in de
      [artikelen 2.7][ref1] en [2.69][ref2], worden aangemerkt als authentieke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.6
    references:
