  - number: 2.81.4
    text: |-
      Een verzoek als bedoeld in [artikel 2.55][ref1] kan ook worden gericht aan het college van burgemeester en
      wethouders van enige gemeente in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel2.81
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.81.5
    text: |-
      Op een verzoek als bedoeld in [artikel 2.53, derde lid][ref1], is [artikel 2.79, derde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel2.81
    references:
