    text: |-
      overige aspecten inzake de bijhouding en verstrekking van gegevens, voor zover de afwijking noodzakelijk is in
      verband met een goede bijhouding en verstrekking van de gegevens in de basisregistratie gedurende de overgang van
      de oude naar de nieuwe voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.15
  - number: 4.16.1
    text: |-
      Een overheidsorgaan waaraan of een derde aan wie systematisch gegevens worden verstrekt wisselt berichten
      uit met de centrale voorzieningen op de wijze waarop de berichtuitwisseling plaats vond onder de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] (de oude berichtuitwisseling) of op de wijze die is
      toegesneden op de basisregistratie personen (de nieuwe berichtuitwisseling).


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 4.16.2
    text: |-
      De overgang van de in het eerste lid bedoelde overheidsorganen of derden van de oude naar de nieuwe
      berichtuitwisseling geschiedt per overheidsorgaan of derde, of per groep van organen of derden. De overgang kan
      betrekking hebben op delen van de organisatie van het overheidsorgaan of de derde en op verschillende wijzen van
      systematische verstrekking.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16
  - number: 4.16.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld in verband met de overgang, waaronder regels
      omtrent het tijdstip van de overgang.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16
  - number: 4.16a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen bij wege van experiment regels worden gesteld waarmee voor de periode van
      ten hoogste vier jaren wordt afgeweken van bepalingen van deze wet met het oogmerk om:
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.a
    text: de rechten van burgers uit te breiden ten aanzien van de bijhouding van of de verstrekking uit de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.b
    text: de bijhouding van gegevens in of de verstrekking uit de basisregistratie te beperken;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.c
    text: de administratieve lasten voor de burger ten aanzien van diens verplichtingen onder deze wet te verlichten;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.d
    text: de bijhouding van gegevens over niet-ingezetenen in de basisregistratie uit te breiden;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.e
    text: contactgegevens of een tweede adresgegeven in de basisregistratie bij te houden; of
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.1.f
    text: de ingeschrevene op het woonadres te informeren over de inschrijvingen op het betreffende adres.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.2
    text: |-
      De bepalingen, bedoeld in het eerste lid, zijn die in [hoofdstuk 1, paragraaf 4][ref1],
      [hoofdstuk 2, afdeling 1][ref2], [paragrafen 2 tot en met 6][ref3], en [afdeling 2][ref4], alsmede die in
      [hoofdstuk 3][ref5]. Indien wordt afgeweken van de bij die bepalingen geboden waarborgen, wordt een gelijkwaardig
      alternatief opgenomen waarbij rekenschap wordt gegeven van de wijze waarop ten minste worden gewaarborgd:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
    references:
