        paragraaf: '3'
        afdeling: '2'
  - number: 1.7.2.b
    text: |-
      het bestuursorgaan ten aanzien van het gegeven een mededeling als bedoeld in [artikel 2.34, eerste lid][ref1], of
      [2.37b, eerste lid][ref2] doet;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
