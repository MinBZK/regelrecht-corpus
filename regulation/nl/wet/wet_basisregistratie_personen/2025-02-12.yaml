preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van de doelmatige voorziening van
    persoonsgegevens, in het bijzonder bij de vervulling van overheidstaken, de gemeentelijke basisadministratie
    persoonsgegevens te moderniseren, de regelgeving te vereenvoudigen en de mogelijkheid te verruimen om gegevens op
    te nemen over niet-ingezetenen ten aanzien van wie de Nederlandse overheid taken vervult en derhalve nieuwe regels
    te stellen ter zake van de basisregistratie personen, daarbij in aanmerking nemend dat uitvoering wordt gegeven aan
    richtlijn nr. 95/46/EG van het Europees Parlement en de Raad van de Europese Unie van 24 oktober 1995 betreffende
    de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en betreffende het vrije
    verkeer van die gegevens (PbEG L 281) en dat ter bescherming van de persoonlijke levenssfeer uitvoering dient te
    worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties;
        - *de basisregistratie:* de basisregistratie personen, bedoeld in [artikel 1.2][ref1];
        - *de persoonslijst:* het geheel van gegevens, bedoeld in [artikel 2.7, eerste lid][ref2], en
      [2.69, eerste lid][ref3], over één persoon in de basisregistratie;
        - *de inschrijving:* de opneming van een persoonslijst in de basisregistratie;
        - *de ingeschrevene:* degene ten aanzien van wie een persoonslijst in de basisregistratie is opgenomen;
        - *de ingezetene:* de ingeschrevene die zijn adres heeft in een gemeente in Nederland en op wiens persoonslijst
      niet het gegeven van zijn overlijden of van vertrek uit Nederland als actueel gegeven is opgenomen;
        - *de systematische verstrekking van gegevens of het systematisch verstrekken van gegevens:* de verstrekking of het
      verstrekken van gegevens uit de basisregistratie, bedoeld in [artikel 3.1, tweede lid][ref4];
        - *de bijhoudingsgemeente:* de gemeente waarvan het college van burgemeester en wethouders op grond van
      [artikel 1.4][ref5] verantwoordelijk is voor de bijhouding van de persoonslijst;
        - *een vreemdeling:* degene die de Nederlandse nationaliteit niet bezit en niet op grond van een wettelijke
      bepaling als Nederlander wordt behandeld;
        - *de aangifte van verblijf en adres:* de aangifte, bedoeld in [artikel 2.38][ref6];
        - *een beëdigde vertaler:* een vertaler als bedoeld in
      [artikel 1, onder d, van de Wet beëdigde tolken en vertalers][ref7];
        - *de aangifte van adreswijziging:* de aangifte, bedoeld in [artikel 2.39][ref8];
        - *de aangifte van vertrek:* de aangifte, bedoeld in [artikel 2.43][ref9];
        - *een authentiek gegeven:* een in de basisregistratie opgenomen gegeven dat op grond van [artikel 1.6][ref10] als
      authentiek wordt aangemerkt;
        - *het woonadres:*
        - 1° het adres waar betrokkene woont, waaronder begrepen het adres van een woning die zich in een voertuig of
      vaartuig bevindt, indien het voertuig of vaartuig een vaste stand- of ligplaats heeft, of, indien betrokkene op
      meer dan één adres woont, het adres waar hij naar redelijke verwachting gedurende een half jaar de meeste malen
      zal overnachten; 2° het adres waar, bij het ontbreken van een adres als bedoeld onder 1, betrokkene naar redelijke
      verwachting gedurende drie maanden ten minste twee derde van de tijd zal overnachten;
        - *het briefadres:* het adres waar voor betrokkene bestemde geschriften in ontvangst worden genomen;
        - *het adres:* het woonadres, dan wel bij het ontbreken hiervan of bij toepassing van [artikel 2.40][ref11] of
      [2.41][ref12], het briefadres;
        - *de briefadresgever:* de natuurlijke persoon of rechtspersoon, bedoeld in [artikel 2.42][ref13], die een
      briefadres ter beschikking stelt;
        - *het burgerservicenummer:* het nummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref14];
        - *een overheidsorgaan:*
        - 1° een orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld, of 2° een ander persoon of college,
      met enig openbaar gezag bekleed;
        - *een derde:* elke natuurlijke persoon, niet zijnde een overheidsorgaan of de ingeschrevene, en elke rechtspersoon
      die niet krachtens publiekrecht is ingesteld, noch met enig openbaar gezag is bekleed;
        - *de openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *een inschrijfvoorziening:* een voorziening als bedoeld in [artikel 2.64][ref15];
        - *het Besluit bevolkingsboekhouding:* het Besluit bevolkingsboekhouding zoals dat gold op de laatste dag voor de
      intrekking van de Wet bevolkings- en verblijfsregisters;
        - *de verordening:* Verordening (EU) nr. 2016/679 van het Europees Parlement en de Raad van 27 april 2016
      betreffende de bescherming van natuurlijke personen in verband met de verwerking van persoonsgegevens en
      betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (Algemene
      verordening gegevensbescherming) (PbEU 2016, L 119);
        - *het tijdelijk verblijfsadres:* het adres in Nederland, niet zijnde het woonadres of het briefadres, waar
      betrokkene naar redelijke verwachting gedurende een maand meestentijds en gedurende een half jaar minder dan twee
      derde van de tijd zal overnachten;
        - *contactgegevens:* telefoonnummer en e-mailadres van de niet-ingezetene.


