    text: |-
      Het college van burgemeester en wethouders is verantwoordelijk voor de verstrekking van gegevens uit de
      basisregistratie die hij doet bij of krachtens [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.5
