        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.13.2
    text: |-
      De voormalige bijhoudingsgemeente doet aan Onze Minister een opgave van de gegevens die in de basisregistratie
      moeten worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.13
  - number: 4.13.3
    text: Onze Minister neemt de gegevens op door deze te ontlenen aan de in het tweede lid bedoelde opgave.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.13
  - number: 4.13.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop een
      opgave wordt gedaan en de informatie die daarbij wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.13
  - number: 4.13.5
    text: Dit artikel is van toepassing tot een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.13
  - number: 4.15.1
    text: |-
      Een college van burgemeester en wethouders geeft uitvoering aan deze wet met behulp van de gemeentelijke
      voorziening waarmee uitvoering werd gegeven aan de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1]
      (de oude gemeentelijke voorziening) of met de gemeentelijke voorziening die is toegesneden op de basisregistratie
      personen (de nieuwe gemeentelijke voorziening).


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: 4.15.2
    text: De overgang van gemeenten van de oude naar de nieuwe voorzieningen geschiedt per gemeente of groep van gemeenten.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.15
  - number: 4.15.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld in verband met de overgang, waaronder
      regels omtrent het tijdstip van de overgang. Bij deze regels kan worden afgeweken van de [hoofdstukken 2][ref1] en
      [3][ref2] van deze wet, voor zover het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0033715
        hoofdstuk: '3'
  - number: 4.15.3.a
    text: de conversie van gegevens, indien een gemeente met een oude voorziening de bijhoudingsgemeente wordt;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.15
  - number: 4.15.3.b
    text: |-
      het doen van verzoeken als bedoeld in [artikel 2.53][ref1] aan een ander dan de bijhoudingsgemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
