  - number: 4.13.1
    text: |-
      Dit artikel is van toepassing op gevallen als bedoeld in [artikel 2.1, derde lid][ref1], met uitzondering van het
      geval dat de betrokkene op het moment van zijn overlijden ingezetene was.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.13
    references:
