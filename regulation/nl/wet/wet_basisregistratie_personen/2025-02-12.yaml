  - number: '1.2'
    text: |-
      Er is een basisregistratie personen. De basisregistratie bevat persoonsgegevens over de ingezetenen van Nederland.
      De basisregistratie bevat persoonsgegevens over niet-ingezetenen voor zover deze wet daarin voorziet.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.2
  - number: 1.3.1
    text: |-
      De basisregistratie heeft tot doel overheidsorganen te voorzien van de in de registratie opgenomen gegevens, voor
      zover deze gegevens noodzakelijk zijn voor de vervulling van hun taak.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.3
  - number: 1.3.2
    text: |-
      De basisregistratie heeft mede tot doel derden te voorzien van de in de registratie opgenomen gegevens, in bij of
      krachtens deze wet aangewezen gevallen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.3
  - number: 1.4.1
    text: |-
      Het college van burgemeester en wethouders is verantwoordelijk voor het bijhouden van persoonsgegevens in de
      basisregistratie overeenkomstig [afdeling 1 van hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.4
