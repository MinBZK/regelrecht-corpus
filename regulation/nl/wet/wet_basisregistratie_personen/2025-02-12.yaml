  - number: 4.16a.3
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.4
    text: |-
      Onze Minister zendt ten minste drie maanden voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk. Uit het verslag blijkt ten minste in hoeverre het experiment heeft bijgedragen
      aan het betreffende oogmerk, bedoeld in het eerste lid. [Artikel 1.15][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: 4.16a.5
    text: |-
      Het vierde lid is niet van toepassing, indien voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid een voordracht plaatsvindt van een voorstel van wet waarmee in het onderwerp
      van de maatregel wordt voorzien. In dat geval kan bij besluit van Onze Minister de werkingsduur, zo nodig in
      afwijking van de periode, genoemd in het eerste lid, aanhef, worden verlengd tot het tijdstip waarop het voorstel
      tot wet is verheven en de wet in werking treedt, dan wel het voorstel is verworpen of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.6
    text: 'Bij algemene maatregel van bestuur als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.6.a
    text: |-
      wordt bepaald voor welke periode, bedoeld in het eerste lid, aanhef, van welke bepalingen, bedoeld in het tweede
      lid, eerste zin, op welke wijze en door welke instanties wordt afgeweken; en
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
  - number: 4.16a.6.b
    text: |-
      worden nadere regels gesteld over de wijze waarop en de criteria aan de hand waarvan de doeltreffendheid en de
      effecten van het experiment worden bepaald.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.16a
