  - number: '3.24'
    text: |-
      Een beslissing op een verzoek als bedoeld in deze afdeling wordt gelijkgesteld met een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4.1.1
    text: |-
      De [artikelen 14 tot en met 21][ref1] en [38 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2]
      zijn van overeenkomstige toepassing op de uitoefening van de taken en bevoegdheden van de Autoriteit
      persoonsgegevens in het kader van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel38
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0040940
        artikel: '38'
  - number: 4.1.2
    text: |-
      De [artikelen 124][ref1] en [268 van de Gemeentewet][ref2] blijven buiten toepassing ten aanzien van het toezicht
      op het college van burgemeester en wethouders inzake de uitvoering van de [hoofdstukken 2][ref3] en [3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '268'
      - id: ref3
        bwb_id: BWBR0033715
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0033715
        hoofdstuk: '3'
  - number: '4.2'
    text: |-
      Het college van burgemeester en wethouders wijst ambtenaren aan die zijn belast met het toezicht op de naleving van
      de verplichtingen van de burger ingevolge [hoofdstuk 2, afdeling 1, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.3.1
    text: |-
      Het college van burgemeester en wethouders verricht periodiek een onderzoek naar de inrichting, de werking en de
      beveiliging van de basisregistratie, alsmede naar de verwerking van gegevens in de basisregistratie, voor zover het
      de gemeentelijke voorziening betreft of het college verantwoordelijk is voor de bijhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.3
  - number: 4.3.2
    text: |-
      Het college van burgemeester en wethouders zendt periodiek een uittreksel van de resultaten van het onderzoek aan
      de Autoriteit persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.3
  - number: 4.3.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op Onze Minister met dien verstande dat het onderzoek
      betrekking heeft op de centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.3
  - number: 4.3.4
    text: |-
      Het college van burgemeester en wethouders zendt periodiek een uittreksel van de resultaten van het onderzoek aan
      Onze Minister ten behoeve van een landelijk beeld van de in het eerste lid bedoelde aspecten.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.3
  - number: 4.3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de periodiciteit en
      de uitvoering van de onderzoeken, bedoeld in het eerste lid, en de periodiciteit van de in het tweede en vierde lid
      bedoelde verzendingen en de inhoud van de in die leden bedoelde uittreksels.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.3
  - number: 4.4.1
    text: |-
      Het college van burgemeester en wethouders is ten behoeve van de uitvoering van deze wet tot een bij koninklijk
      besluit te bepalen datum verantwoordelijk voor de verwerking van persoonsgegevens in het persoonsregister, bedoeld
      in het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
  - number: 4.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de in het eerste lid bedoelde
      verwerking van persoonsgegevens. Daarbij kan worden bepaald dat het persoonsregister op een andere wijze dan
      in de vorm van persoonskaarten, bedoeld in het Besluit bevolkingsboekhouding, kan worden aangehouden en kan de
      vernietiging van de persoonskaarten worden geregeld.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
  - number: 4.4.3
    text: 'Uit het persoonsregister worden geen andere gegevens verstrekt dan:'
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
  - number: 4.4.3.a
    text: |-
      gegevens als bedoeld in [artikel 2.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.4.3.b
    text: gegevens uit vak 23 van de persoonskaart.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
  - number: 4.4.4
    text: |-
      Op de verstrekking, bedoeld in het derde lid, is [hoofdstuk 3][ref1], met uitzondering van de
      [artikelen 3.1 tot en met 3.3][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.4.5
    text: |-
      De [artikelen 2.53, eerste lid][ref1], [2.55][ref2] en [2.57 tot en met 2.61][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 4.5.1
    text: |-
      Onze Minister is ten behoeve van de uitvoering van deze wet tot een bij koninklijk besluit te bepalen datum
      verantwoordelijk voor de verwerking van persoonsgegevens in het persoonskaartenarchief en het schakelregister,
      bedoeld in het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.5
  - number: 4.5.2
    text: |-
      Onze Minister kan de verantwoordelijkheid voor de verwerking, bedoeld in het eerste lid, overdragen aan het college
      van burgemeester en wethouders van een gemeente. De overdracht geschiedt slechts na instemming van dat college.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.5
  - number: 4.5.3
    text: |-
      Ten aanzien van het persoonskaartenarchief is [artikel 4.4, tweede tot en met vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.5.4
    text: |-
      Ten aanzien van het schakelregister is [artikel 4.4, tweede, vierde en vijfde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '4.6'
    text: |-
      Onze Minister, of het in [artikel 4.5, tweede lid][ref1], bedoelde college van burgemeester en wethouders,
      verstrekt op verzoek van het college dat een persoon inschrijft van wie in het persoonskaartenarchief een
      persoonskaart is opgenomen, de gegevens die zijn vermeld op de desbetreffende persoonskaart. Deze gegevens blijven
      berusten bij het college waaraan ze zijn verstrekt, waarbij [artikel 4.4][ref2] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.7.1
    text: |-
      Er is een centraal archief van overledenen, bestaande uit de persoonskaarten, bedoeld in artikel 69, tweede lid,
      van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.7
  - number: 4.7.2
    text: |-
      Onze Minister is verantwoordelijk voor de verwerking van persoonsgegevens in het centraal archief van overledenen,
      bedoeld in het eerste lid. Hij treft een regeling ter bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.7
  - number: 4.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent heffingen in verband met de
      verstrekking van gegevens uit de hierna genoemde registraties, voor zover Onze Minister verantwoordelijk is voor de
      verwerking van persoonsgegevens in deze registraties:
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.8
  - number: 4.8.1.a
    text: het persoonskaartenarchief;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.8
  - number: 4.8.1.b
    text: het schakelregister;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.8
  - number: 4.8.1.c
    text: het centraal archief van overledenen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.8
  - number: 4.8.2
    text: |-
      Op grond van de in het eerste lid bedoelde regels kunnen uitsluitend heffingen ingesteld worden in verband met de
      verstrekking van gegevens aan derden, anders dan de verstrekking overeenkomstig [artikel 3.3][ref1], en in verband
      met de verstrekking aan de betrokkene van hem betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.9.1
    text: |-
      Naast de in [artikel 2.7][ref1] bedoelde algemene gegevens worden tot een bij koninklijk besluit te bepalen datum
      over de op grond van [hoofdstuk 1, afdeling 1, paragraaf 2][ref2] ingeschreven personen de volgende algemene
      gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 4.9.1.a
    text: het administratienummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.1.b
    text: |-
      de administratienummers van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde partner, de eerdere
      geregistreerde partners en de kinderen;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.1.c
    text: de data waarop de onder a en b bedoelde nummers van kracht zijn geworden of beëindigd.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.2
    text: |-
      Naast de in [artikel 2.69][ref1] bedoelde algemene gegevens worden tot een bij koninklijk besluit te bepalen
      datum over de op grond van [hoofdstuk 1, afdeling 2, paragraaf 2][ref2] ingeschreven personen de volgende algemene
      gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 4.9.2.a
    text: het administratienummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.2.b
    text: de datum waarop het nummer van kracht is geworden of beëindigd.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.3
    text: |-
      Tot de laatste van de in de aanhef van het eerste en tweede lid bedoelde data blijft
      [artikel 50 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] zoals dat luidde voor de
      inwerkingtreding van deze wet, van toepassing. Tot dat moment wordt aan een niet-ingezetene die wordt ingeschreven
      in de basisregistratie een administratienummer toegekend. Daarbij is het hiervoor bedoelde artikel 50, eerste,
      tweede, derde en zesde lid, van overeenkomstige toepassing, met dien verstande dat het nummer wordt toegekend door
      Onze Minister. Onze Minister neemt de gegevens, bedoeld in het tweede lid, op in de basisregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel50
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '50'
  - number: 4.9.4
    text: |-
      Een overheidsorgaan kan tot de in het derde lid bedoelde datum bij het verwerken van persoonsgegevens in het kader
      van de uitvoering van zijn taak gebruikmaken van het administratienummer.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.5
    text: |-
      Een derde kan tot de in het derde lid bedoelde datum bij het verwerken van persoonsgegevens gebruikmaken van het
      administratienummer voor zover dit noodzakelijk is in verband met de juiste verstrekking aan hem van gegevens uit
      de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.9.6
    text: Na de in het derde lid bedoelde datum wordt het administratienummer niet meer gebruikt.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.9
  - number: 4.10.1
    text: |-
      Een besluit als bedoeld in
      [artikel 91, eerste lid, van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] geldt na de
      inwerkingtreding van deze wet als een besluit als bedoeld in [artikel 3.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '91'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.10.2
    text: |-
      Een besluit als bedoeld in
      [artikel 99, zevende lid, van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] geldt na de
      inwerkingtreding van deze wet als een besluit als bedoeld in [artikel 3.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: '4.11'
    text: |-
      Een persoonslijst als bedoeld in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1]
      geldt na de inwerkingtreding van deze wet als een persoonslijst als bedoeld in [artikel 1.1, onderdeel c][ref2],
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '4.12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het verwijderen en vernietigen van
      gegevens over een vreemde nationaliteit naast gegevens over het Nederlanderschap of het feit dat de betrokkene als
      Nederlander wordt behandeld. Daarbij kan worden afgeweken van de [artikelen 2.7][ref1] en [2.69][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel4.12
    references:
