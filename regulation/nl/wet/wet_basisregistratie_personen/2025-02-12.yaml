        afdeling: '2'
  - number: 1.7.1
    text: |-
      Het bestuursorgaan dat bij de vervulling van zijn taak informatie over een ingeschrevene nodig heeft die in de vorm
      van een authentiek gegeven beschikbaar is in de basisregistratie, gebruikt voor die informatie dat gegeven.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
  - number: 1.7.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
  - number: 1.7.2.a
    text: |-
      bij het gegeven een aantekening als bedoeld in [artikel 2.26][ref1] of [2.76][ref2] is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
    references:
