        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.13.1.a
    text: de verstrekking plaatsvindt voor historische, statistische of wetenschappelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.13
  - number: 3.13.1.b
    text: de persoonlijke levenssfeer niet onevenredig wordt geschaad;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.13
  - number: 3.13.1.c
    text: |-
      door de ontvanger van de gegevens de nodige voorzieningen zijn getroffen ten einde te verzekeren dat de verdere
      verwerking uitsluitend geschiedt ten behoeve van de onder a genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.13
  - number: 3.13.2
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kunnen nadere regels worden gesteld omtrent de
      verstrekking en de wijze waarop deze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.13
  - number: 3.14.1
    text: |-
      Onze Minister kan aan een overheidsorgaan of aan een derde informatie ter beschikking stellen die is verkregen
      door bewerking van gegevens uit de basisregistratie. Het betreft uitsluitend informatie die niet herleidbaar is tot
      gegevens betreffende een geïdentificeerde of identificeerbare ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.14
  - number: 3.14.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het ter beschikking
      stellen van informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.14
  - number: '3.15'
    text: |-
      Indien op grond van artikel 15, derde lid, van de verordening in samenhang met [artikel 2.55, derde lid][ref1], dan
      wel [artikel 3.5, derde lid][ref2], [3.6, derde lid][ref3], of [3.9, vijfde lid][ref4], een gewaarmerkt afschrift
      wordt verstrekt van gegevens ten aanzien van een vreemdeling op wiens persoonslijst geen actuele gegevens zijn
      opgenomen in verband met het verblijfsrecht, wordt hiervan mededeling gedaan op dat afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: '3.16'
    text: |-
      Een derde kan bij het verwerken van persoonsgegevens gebruikmaken van het burgerservicenummer voor zover dit
      noodzakelijk is in verband met de juiste verstrekking van gegevens aan hem uit de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.16
  - number: 3.17.1
    text: |-
      De verstrekking van gegevens op grond van de [artikelen 3.2][ref1], [3.3][ref2] en [3.13][ref3] geschiedt
      kosteloos, onverminderd het bepaalde in [artikel 1.14][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 3.17.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het ter beschikking stellen van informatie, bedoeld in
      [artikel 3.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.17.3
    text: |-
      Andere verstrekkingen aan een overheidsorgaan en verstrekkingen op grond van [artikel 3.12][ref1] geschieden
      kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: '3.18'
    text: |-
      Een beslissing op grond van deze afdeling omtrent het verstrekken van gegevens of het ter beschikking stellen van
      informatie wordt gelijkgesteld met een besluit in de zin van de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 3.19.1
    text: |-
      Een verzoek als bedoeld in de [artikelen 3.22][ref1] en [3.23][ref2] kan worden gericht aan het college van
      burgemeester en wethouders van enige gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.19.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, kan ook worden gericht aan Onze Minister. In dat geval treedt Onze Minister
      voor de toepassing van de [artikelen 3.22][ref1] en [3.23][ref2] in de plaats van het college en wordt het verzoek
      gedaan door tussenkomst van een inschrijfvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.19.3
    text: |-
      Een verzoek als bedoeld in [artikel 3.22a, eerste lid][ref1], wordt elektronisch gericht aan Onze Minister zonder
      tussenkomst van een inschrijfvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '3.20'
    text: |-
      De verstrekking aan de betrokkene van hem betreffende gegevens geschiedt ingevolge artikel 15 van de verordening,
      in samenhang met [artikel 2.55][ref1] of in samenhang met de [artikelen 2.81][ref2] en 2.55.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.20a
    text: |-
      Artikel 18 van de verordening is met betrekking tot de verstrekking van gegevens uit de basisregistratie niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.20a
  - number: 3.21.1
    text: |-
      Indien op de persoonslijst een aantekening omtrent beperking van de verstrekking van gegevens aan derden is
      vermeld, worden geen gegevens van de persoonslijst verstrekt op grond van:
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
  - number: 3.21.1.a
    text: |-
      de [artikelen 3.3][ref1] en [3.6][ref2], voor zover de beperking van de verstrekking van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.21.1.b
    text: |-
      [artikel 3.9][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.21.2
    text: |-
      In afwijking van het eerste lid verstrekt het college van burgemeester en wethouders gegevens op grond van
      [artikel 3.6, eerste lid, onderdelen a en c][ref1], indien de persoonlijke levenssfeer daardoor niet onevenredig
      wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.21.3
    text: |-
      Het college maakt een beschikking, waarmee het toepassing geeft aan het tweede lid, terstond bekend aan de
      betrokkene. Het geeft geen uitvoering aan de beschikking binnen een bij die beschikking gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
  - number: 3.21.4
    text: |-
      [Artikel 2.55, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.21.5
    text: |-
      Het college neemt passende maatregelen om ten minste eens per jaar aan de ingezetenen het recht, bedoeld in het
      eerste lid, bekend te maken. De bekendmaking vindt plaats via één of meer dag-, nieuws-, of huis-aan-huisbladen of
      op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.21
  - number: 3.22.1
    text: |-
      Het college van burgemeester en wethouders deelt binnen vier weken aan de betrokkene in verband met de uitoefening
      van het recht van inzage, bedoeld in artikel 15 van de verordening, op diens verzoek mede of gegevens die de
      betrokkene betreffen gedurende de periode van twintig jaren voorafgaande aan het verzoek zijn verstrekt uit de
      basisregistratie aan een overheidsorgaan of derde.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
  - number: 3.22.2
    text: 'Het college voldoet niet aan het verzoek, bedoeld in het eerste lid, voor zover:'
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
  - number: 3.22.2.a
    text: |-
      van de verstrekking geen aantekening is gehouden krachtens [artikel 3.11, tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.22.2.b
    text: |-
      dit noodzakelijk is in het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van
      strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
  - number: 3.22.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan nader worden geregeld in welke gevallen toepassing wordt
      gegeven aan het tweede lid, aanhef en onderdeel b.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
  - number: 3.22.4
    text: |-
      [Artikel 2.55, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.22a.1
    text: |-
      Onverminderd [artikel 3.22, eerste lid][ref1], deelt Onze Minister elektronisch aan de betrokkene in verband met de
      uitoefening van het recht van inzage, bedoeld in artikel 15 van de verordening, op diens verzoek mede of gegevens
      die de betrokkene betreffen gedurende de periode van twintig jaren voorafgaande aan het verzoek door Onze Minister
      uit de basisregistratie zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.22a.2
    text: |-
      Onze Minister voldoet niet aan een verzoek als bedoeld in het eerste lid, indien het verzoek betrekking heeft op
      een minderjarige jonger dan 16 jaar.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22a
  - number: 3.22a.3
    text: |-
      [Artikel 3.22, tweede en derde lid][ref1], alsmede [artikel 2.55, vierde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.1
    text: |-
      Het college van burgemeester en wethouders doet op schriftelijk verzoek van de betrokkene, indien op grond van het
      verzoek, bedoeld in de [artikelen 2.57][ref1] en [2.58][ref2], een besluit als bedoeld in [artikel 2.60][ref3],
      dan wel de uitspraak van de rechter, bedoeld in [artikel 2.61][ref4], ten aanzien van hem gegevens zijn verbeterd,
      aangevuld of verwijderd, van de wijziging mededeling aan overheidsorganen en derden aan wie gedurende twintig jaren
      voorafgaand aan het verzoek en in de sedert dat verzoek verstreken tijd, de desbetreffende gegevens zijn verstrekt,
      tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, kan de betrokkene aan het college richten tot uiterlijk acht weken nadat
      hij van de wijziging kennis heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.23
  - number: 3.23.3
    text: |-
      Het college doet aan de verzoeker desgevraagd opgave van degenen aan wie de mededeling, bedoeld in het eerste lid,
      is gedaan. [Artikel 3.22, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.23.4
    text: |-
      [Artikel 2.55, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.5
    text: |-
      Dit artikel is van overeenkomstige toepassing indien gegevens ten aanzien van de betrokkene zijn verbeterd,
      aangevuld of verwijderd op grond van een verzoek als bedoeld in [artikel 2.81][ref1] in samenhang met de
      [artikelen 2.57][ref2], [2.58][ref3], [2.60][ref4] en [2.61][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel3.23
