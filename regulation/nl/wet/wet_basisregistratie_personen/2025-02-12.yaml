  - number: 1.7.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
  - number: 1.7.2.d
    text: |-
      een goede vervulling van de taak van het bestuursorgaan door de onverkorte toepassing van het eerste lid wordt
      belet.
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.7
  - number: '1.8'
    text: |-
      Een ingeschrevene aan wie door een bestuursorgaan een gegeven wordt gevraagd, waarop
      [artikel 1.7, eerste lid][ref1], van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover
      het gegeven naar het oordeel van het bestuursorgaan noodzakelijk is voor een deugdelijke vaststelling van de
      identiteit van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2025-02-12#Artikel1.8
    references:
