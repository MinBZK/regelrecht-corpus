    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.9
  - number: 4.9.3
    text: |-
      Tot de laatste van de in de aanhef van het eerste en tweede lid bedoelde data blijft
      [artikel 50 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] zoals dat luidde voor de
      inwerkingtreding van deze wet, van toepassing. Tot dat moment wordt aan een niet-ingezetene die wordt ingeschreven
      in de basisregistratie een administratienummer toegekend. Daarbij is het hiervoor bedoelde artikel 50, eerste,
      tweede, derde en zesde lid, van overeenkomstige toepassing, met dien verstande dat het nummer wordt toegekend door
      Onze Minister. Onze Minister neemt de gegevens, bedoeld in het tweede lid, op in de basisregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel50
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '50'
  - number: 4.9.4
    text: |-
      Een overheidsorgaan kan tot de in het derde lid bedoelde datum bij het verwerken van persoonsgegevens in het kader
      van de uitvoering van zijn taak gebruik maken van het administratienummer.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.9
  - number: 4.9.5
    text: |-
      Een derde kan tot de in het derde lid bedoelde datum bij het verwerken van persoonsgegevens gebruik maken van het
      administratienummer voor zover dit noodzakelijk is in verband met de juiste verstrekking aan hem van gegevens uit
      de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.9
  - number: 4.9.6
    text: Na de in het derde lid bedoelde datum wordt het administratienummer niet meer gebruikt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.9
  - number: 4.10.1
    text: |-
      Een besluit als bedoeld in
      [artikel 91, eerste lid, van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] geldt na de
      inwerkingtreding van deze wet als een besluit als bedoeld in [artikel 3.2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.10
