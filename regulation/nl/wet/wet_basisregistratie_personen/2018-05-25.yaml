      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het verwijderen en vernietigen van
      gegevens over een vreemde nationaliteit naast gegevens over het Nederlanderschap of het feit dat de betrokkene als
      Nederlander wordt behandeld. Daarbij kan worden afgeweken van de [artikelen 2.7][ref1] en [2.69][ref2].


