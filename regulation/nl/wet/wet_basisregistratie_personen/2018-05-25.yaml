  - number: 4.17.b
    text: |-
      aan degene met een woonadres in de gemeente die bewust toelaat dat een andere persoon met datzelfde woonadres is
      ingeschreven, terwijl hij weet dat dit onjuist is.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.17
  - number: '4.18'
    text: |-
      De termijn, bedoeld in [artikel 12, eerste lid, van de Archiefwet 1995][ref1] vangt aan bij degene die op de
      dag van zijn overlijden ingezetene is, op die dag, en bij degene die na vertrek uit Nederland op de dag vallende
      honderd jaar na de geboorte niet ingezetene is, op die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
