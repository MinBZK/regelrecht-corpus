  - number: 4.13.2
    text: |-
      De voormalige bijhoudingsgemeente doet aan Onze Minister een opgave van de gegevens die in de basisregistratie
      moeten worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.13
  - number: 4.13.3
    text: Onze Minister neemt de gegevens op door deze te ontlenen aan de in het tweede lid bedoelde opgave.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.13
  - number: 4.13.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze waarop een
      opgave wordt gedaan en de informatie die daarbij wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.13
  - number: 4.13.5
    text: Dit artikel is van toepassing tot een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.13
  - number: '4.14'
    text: |-
      De verplichting, bedoeld in [artikel 2.81, eerste lid][ref1], is niet van toepassing na een inschrijving als
      bedoeld in [artikel 2.66][ref2], indien de inschrijving geschiedt op grond van een verzoek als bedoeld in
      [artikel 2.68][ref3] en wordt gedaan ten aanzien van op het moment van inwerkingtreding van deze wet bij de
      aangewezen bestuursorganen bekende personen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
