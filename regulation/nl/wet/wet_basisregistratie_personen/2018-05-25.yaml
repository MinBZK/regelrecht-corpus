        afdeling: '2'
  - number: 1.5.1
    text: |-
      Onze Minister is verantwoordelijk voor de verstrekking van gegevens uit de basisregistratie die hij doet bij of
      krachtens [hoofdstuk 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
