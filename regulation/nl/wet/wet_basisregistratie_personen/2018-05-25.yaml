      overige aspecten inzake de bijhouding en verstrekking van gegevens, voor zover de afwijking noodzakelijk is in
      verband met een goede bijhouding en verstrekking van de gegevens in de basisregistratie gedurende de overgang van
      de oude naar de nieuwe voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.15
  - number: 4.16.1
    text: |-
      Een overheidsorgaan waaraan of een derde aan wie systematisch gegevens worden verstrekt wisselt berichten
      uit met de centrale voorzieningen op de wijze waarop de berichtuitwisseling plaats vond onder de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] (de oude berichtuitwisseling) of op de wijze die is
      toegesneden op de basisregistratie personen (de nieuwe berichtuitwisseling).


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 4.16.2
    text: |-
      De overgang van de in het eerste lid bedoelde overheidsorganen of derden van de oude naar de nieuwe
      berichtuitwisseling geschiedt per overheidsorgaan of derde, of per groep van organen of derden. De overgang kan
      betrekking hebben op delen van de organisatie van het overheidsorgaan of de derde en op verschillende wijzen van
      systematische verstrekking.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.16
  - number: 4.16.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld in verband met de overgang, waaronder regels
      omtrent het tijdstip van de overgang.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.16
  - number: '4.17'
    text: 'Het college van burgemeester en wethouders kan een bestuurlijke boete van ten hoogste 325 euro opleggen:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.17
  - number: 4.17.a
    text: |-
