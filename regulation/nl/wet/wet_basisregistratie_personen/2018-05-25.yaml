        afdeling: '1'
  - number: 1.15.2
    text: |-
      Alle onderwerpen die bij of krachtens deze wet worden geregeld, lenen zich voor overleg. In ieder geval wordt
      overleg gepleegd over:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.15
  - number: 1.15.2.a
    text: wijzigingen in het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.15
  - number: 1.15.2.b
    text: de uitgangspunten van het te voeren kwaliteitsbeleid;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.15
  - number: 1.15.2.c
    text: |-
      de uitgangspunten van het uitvoeren van [artikel 1.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.15
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 1.15.3
    text: Onze Minister kan met betrekking tot het overleg nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.15
  - number: 2.1.1
    text: |-
      Deze afdeling is van toepassing op personen die als ingezetene in de basisregistratie zijn of worden ingeschreven
      en op ingeschrevenen die op het moment van hun overlijden ingezetene waren.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.1
  - number: 2.1.2
    text: |-
      Met betrekking tot de ingeschrevene die geen ingezetene meer is, worden krachtens deze afdeling geen nieuwe
      algemene gegevens opgenomen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.1
  - number: 2.1.3
    text: 'In afwijking van het eerste of tweede lid worden gegevens opgenomen krachtens deze afdeling, voor zover:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.1
  - number: 2.1.3.a
    text: het feiten betreft die zich hebben voorgedaan in de tijd dat de ingeschrevene nog ingezetene was, of
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.1
  - number: 2.1.3.b
    text: dit bij algemene maatregel van bestuur is bepaald.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.1
  - number: '2.2'
    text: |-
      De inschrijving in de basisregistratie geschiedt op grond van de geboorteakte, de aangifte van de betrokkene of
      ambtshalve.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.2
  - number: '2.3'
    text: |-
      Op grond van de geboorteakte, opgemaakt door een ambtenaar van de burgerlijke stand in Nederland, waarop als
      geboorteplaats een plaats in Nederland is vermeld, geschiedt de inschrijving van het kind dat niet reeds is
      ingeschreven en waarvan de moeder uit wie het kind is geboren op de geboortedatum van het kind als ingezetene is
      ingeschreven. De inschrijving geschiedt door het college van burgemeester en wethouders van de gemeente waar die
      moeder als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.3
  - number: 2.4.1
    text: |-
      Op grond van zijn aangifte van verblijf en adres wordt degene die rechtmatig verblijf geniet, niet in de
      basisregistratie is ingeschreven en naar redelijke verwachting gedurende een half jaar ten minste twee derde van
      de tijd in Nederland verblijf zal houden, ingeschreven in de basisregistratie door het college van burgemeester en
      wethouders van de gemeente waar hij zijn adres heeft.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.4
  - number: 2.4.2
    text: |-
      Indien een persoon als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college
      ambtshalve zorg voor de inschrijving. Het college van burgemeester en wethouders is bevoegd de betrokkene alsnog op
      grond van zijn aangifte in te schrijven, indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.4
  - number: 2.4.3
    text: Inschrijving geschiedt niet dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.4
  - number: 2.5.1
    text: |-
      Inschrijving op grond van [artikel 2.4][ref1] van een persoon die komt vanuit Aruba, Curaçao, Sint Maarten, of een
      van de openbare lichamen, vindt niet plaats, dan nadat hij een hem betreffend verhuisbericht, verstrekt door de
      verantwoordelijke voor de verwerking van gegevens in de basisadministratie in Aruba, Curaçao, Sint Maarten of een
      van de openbare lichamen waar hij laatstelijk als ingezetene was ingeschreven, heeft overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.5.2
    text: |-
      In het geval dat anderszins blijkt dat het vertrek van de betrokken persoon is verwerkt in de basisadministratie in
      Aruba, Curaçao, Sint Maarten of een van de openbare lichamen waar hij laatstelijk als ingezetene was ingeschreven,
      of blijkt dat betrokkene daarin niet als ingezetene was ingeschreven, kan het college van burgemeester en
      wethouders afwijken van het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.5
  - number: 2.6.1
    text: |-
      Bij algemene maatregel van bestuur worden categorieën bepaald van personen, die in verband met hun bijzondere
      verblijfsrechtelijke positie niet in aanmerking komen voor inschrijving.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.6
  - number: 2.6.2
    text: |-
      Bij of krachtens de maatregel kunnen regels worden gesteld ten aanzien van een persoon die behoort tot een
      categorie als bedoeld in het eerste lid, omtrent:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.6
  - number: 2.6.2.a
    text: het niet-inschrijven van de persoon;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.6
  - number: 2.6.2.b
    text: |-
      het aanmerken van de persoon die reeds is ingeschreven als een ingeschrevene die wegens zijn vertrek uit Nederland
      niet als ingezetene is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.6
  - number: 2.7.1
    text: 'In de basisregistratie worden over de ingeschrevene uitsluitend de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a
    text: 'algemene gegevens:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.1
    text: |-
      gegevens over de burgerlijke staat waar het betreft de naam, de geboorte, het geslacht, de ouders, het huwelijk,
      dan wel geregistreerd partnerschap en eerdere huwelijken of eerder geregistreerde partnerschappen, de echtgenoot
      dan wel geregistreerd partner en eerdere echtgenoten of geregistreerde partners, de kinderen en het overlijden;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.2
    text: gegevens over curatele;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.3
    text: gegevens over het gezag dat over de minderjarige wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.4
    text: |-
      gegevens over de nationaliteit, met dien verstande dat geen gegevens over een vreemde nationaliteit worden
      opgenomen naast gegevens over het Nederlanderschap of het feit dat de betrokkene als Nederlander wordt behandeld;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.5
    text: gegevens in verband met het verblijfsrecht van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.6
    text: |-
      gegevens over de bijhoudingsgemeente en het adres in die gemeente, alsmede over het verblijf in Nederland en het
      vorige verblijf buiten Nederland en over het vertrek uit Nederland en het volgende verblijf buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.7
    text: gegevens over het burgerservicenummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.8
    text: |-
      gegevens over de burgerservicenummers van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde
      partner, de eerdere geregistreerde partners en de kinderen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.9
    text: |-
      gegevens over het gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de
      geregistreerde partner of de eerdere geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.a.10
    text: |-
      gegevens, noodzakelijk in verband met de uitvoering van de [Kieswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 2.7.1.a.11
    text: |-
      gegevens, noodzakelijk in verband met de uitvoering van de [Paspoortwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 2.7.1.b
    text: 'administratieve gegevens:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.b.1
    text: gegevens in verband met de inschrijving en de wijziging van de bijhoudingsgemeente;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.b.2
    text: |-
      gegevens ter aanduiding van akten en andere geschriften waaruit algemene gegevens zijn verkregen, dan wel van de
      rechtsgrond krachtens welke gegevens over het Nederlanderschap zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.b.3
    text: |-
      gegevens ter aanduiding van de onjuistheid van een opgenomen algemeen gegeven of van strijd met de Nederlandse
      openbare orde van een opgenomen gegeven over de burgerlijke staat dan wel over een onderzoek naar die onjuistheid
      of strijdigheid, alsmede andere gegevens, noodzakelijk in verband met de bijhouding van de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.1.b.4
    text: gegevens over de beperking van de verstrekking van gegevens aan derden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.2
    text: De algemene en administratieve gegevens worden nader bepaald bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.7.3
    text: |-
      Een algemeen gegeven dat is opgenomen, blijft opgenomen, behoudens het bepaalde in [artikel 2.57][ref1] en
      behoudens de gegevens, bedoeld in het eerste lid, onder a, onderdelen 10° en 11°.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.7.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de verwijdering en de vernietiging van de algemene gegevens,
      bedoeld in het eerste lid, onder a, onderdelen 10° en 11°, en de administratieve gegevens, bedoeld in het eerste
      lid, onder b, geregeld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.7
  - number: 2.8.1
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich in Nederland hebben voorgedaan,
      ontleend aan een geschrift als bedoeld onder a en bij gebreke hiervan aan een geschrift als bedoeld onder b:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.1.a
    text: een akte over het desbetreffende feit, die is opgenomen in de registers van de burgerlijke stand in Nederland;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.1.b
    text: |-
      een door de ambtenaar van de burgerlijke stand opgemaakte akte, een besluit, een in kracht van gewijsde gegane
      rechterlijke uitspraak of een notariële akte, over het desbetreffende feit.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.2
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich buiten Nederland hebben
      voorgedaan, ontleend aan een geschrift als bedoeld onder a, bij gebreke hiervan aan een geschrift als bedoeld onder
      b of c, bij gebreke ook hiervan aan een geschrift als bedoeld onder d en bij gebreke ten slotte ook hiervan aan een
      geschrift als bedoeld onder e:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.2.a
    text: een akte over het desbetreffende feit, die is opgenomen in de registers van de Nederlandse burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.2.b
    text: een in Nederland gedane rechterlijke uitspraak over het desbetreffende feit die in kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.2.c
    text: |-
      een buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie
      opgemaakte akte die ten doel heeft tot bewijs te dienen van het desbetreffende feit, of een over
      dat feit gedane rechterlijke uitspraak, of bij gebreke daarvan een beëdigde verklaring, bedoeld in
      [artikel 45 van Boek 1 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel45
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '45'
  - number: 2.8.2.d
    text: |-
      een geschrift dat overeenkomstig de plaatselijke voorschriften is opgemaakt door een bevoegde instantie, waarin het
      desbetreffende feit is vermeld;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.2.e
    text: |-
      een verklaring over het desbetreffende feit die betrokkene ten overstaan van een door het college van burgemeester
      en wethouders aangewezen ambtenaar onder eed of belofte heeft afgelegd, die op schrift is gesteld en door
      betrokkene is ondertekend.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.8.3
    text: |-
      De gegevens over de burgerlijke staat worden, indien zij feiten betreffen die zich in Nederland hebben voorgedaan
      en waarvan een in Nederland geaccrediteerde consulaire ambtenaar van een ander land bevoegd een akte heeft
      opgemaakt die ten doel heeft tot bewijs te dienen van het desbetreffende feit, ontleend aan die akte.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.8
  - number: 2.9.1
    text: |-
      Aan een geschrift als bedoeld in [artikel 2.8, tweede lid, onder c, d of e][ref1], dan wel artikel 2.8, derde
      lid, worden geen gegevens ontleend over het huwelijk dat is gesloten tussen echtgenoten van wie er ten minste één
      vreemdeling is, dan nadat de echtgenoten een verklaring hebben afgelegd dat hun huwelijk niet is aangegaan met het
      oogmerk om verblijfsrecht in Nederland te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.9.2
    text: 'De verklaring is niet vereist indien:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
  - number: 2.9.2.a
    text: |-
      sedert de voltrekking van het huwelijk ten minste tien jaren zijn verstreken of het huwelijk inmiddels is
      geëindigd,
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
  - number: 2.9.2.b
    text: de gegevens ambtshalve worden opgenomen, of
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
  - number: 2.9.2.c
    text: |-
      de vreemdeling rechtmatig in Nederland verblijft als bedoeld in
      [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.9.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van een geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.9
  - number: 2.10.1
    text: |-
      Indien aannemelijk is dat omtrent een gegeven over de familierechtelijke betrekkingen tot de ouders of de kinderen,
      over het huwelijk en de eerdere huwelijken, over de echtgenoot en de eerdere echtgenoten, over het geregistreerd
      partnerschap en de eerdere geregistreerde partnerschappen of over de geregistreerde partner en de eerdere
      geregistreerde partners een geschrift als bedoeld in [artikel 2.8, tweede lid, onder c of d][ref1], kan worden
      verschaft, mogen deze gegevens niet worden ontleend aan een geschrift als bedoeld in artikel 2.8, tweede lid, onder
      e.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.10.2
    text: |-
      Aan een geschrift als bedoeld in [artikel 2.8, tweede lid, onder c, d of e][ref1], alsmede artikel 2.8, derde
      lid, worden geen gegevens ontleend, voor zover de Nederlandse openbare orde zich verzet tegen de erkenning van de
      rechtsgeldigheid van de in deze geschriften vermelde feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.10.3
    text: |-
      Aan een geschrift als bedoeld in [artikel 2.8, tweede lid, onder d en e][ref1], worden geen gegevens ontleend,
      indien aannemelijk is dat de gegevens onjuist zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.10.4
    text: |-
      Aan een geschrift als bedoeld in [artikel 2.8, tweede lid, onder e][ref1], worden geen gegevens ontleend, dan nadat
      de gegevens voor zover mogelijk zijn geverifieerd door raadpleging van de basisregistratie en zo nodig van andere
      registers of van geschriften die door de betrokkene zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.11'
    text: |-
      Op de persoonslijst van een persoon worden geen gegevens over zijn kind opgenomen indien het kind ten tijde van de
      inschrijving van de persoon reeds is overleden en het kind zelf geen ingeschrevene is.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.11
  - number: 2.12.1
    text: |-
      Bij gerede twijfel over de toepassing van [artikel 2.8, tweede en derde lid][ref1], en
      [artikel 2.10, eerste en tweede lid][ref2], wordt advies ingewonnen van de ambtenaar van de burgerlijke stand in
      de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.12.2
    text: |-
      Indien na het advies, bedoeld in het eerste lid, gerede twijfel blijft bestaan of het voornemen bestaat van het
      advies af te wijken, wordt het advies van de Commissie van advies voor de zaken betreffende de burgerlijke staat en
      de nationaliteit ingewonnen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.12
  - number: 2.13.1
    text: De gegevens over curatele worden ontleend aan het curatele- en bewindregister.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.13
  - number: 2.13.2
    text: De gegevens over het gezag dat over de minderjarige wordt uitgeoefend, worden ontleend aan het gezagsregister.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.13
  - number: 2.14.1
    text: |-
      Gegevens over het Nederlanderschap worden opgenomen met toepassing van de [Rijkswet op het Nederlanderschap][ref1],
      van andere op het Nederlanderschap betrekking hebbende wettelijke bepalingen en van verdragen waaruit het
      Nederlanderschap voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 2.14.2
    text: |-
      Indien omtrent een ingeschrevene akten als bedoeld in
      [artikel 22, eerste lid, onder b, c en d, van de Rijkswet op het Nederlanderschap][ref1] zijn opgenomen in het in
      dat lid bedoelde register, wordt aan deze akten het gegeven over het Nederlanderschap ontleend. Indien omtrent een
      ingeschrevene een afschrift wordt overgelegd van de in de eerste volzin bedoelde akten uit het register, bedoeld
      in artikel 22, tweede lid, van de genoemde wet, wordt het gegeven over het Nederlanderschap aan dit afschrift
      ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '22'
  - number: 2.14.3
    text: |-
      Een gegeven over het Nederlanderschap wordt ontleend aan de bevestiging van de verklaring tot verkrijging
      van het Nederlanderschap of het uittreksel van het besluit tot verlening van het Nederlanderschap, waarvan
      de uitreiking of bekendmaking op andere wijze heeft plaatsgevonden in de gemeente waar de betrokkene is
      ingeschreven, onderscheidenlijk aan de door de betrokkene in die gemeente afgelegde verklaring van afstand van het
      Nederlanderschap, dan wel aan de mededeling van de burgemeester van een andere gemeente omtrent de verkrijging, de
      verlening of de afstand van het Nederlanderschap die betrekking heeft op de ingeschrevene, indien de uitreiking of
      bekendmaking van de bevestiging van de verklaring tot verkrijging van het Nederlanderschap of van het uittreksel
      van het besluit tot verlening van het Nederlanderschap op andere wijze, heeft plaatsgevonden, onderscheidenlijk de
      verklaring van afstand is afgelegd, in een andere gemeente dan de gemeente waar de betrokkene is ingeschreven. Voor
      zover het in deze gevallen gaat om verkrijging of verlening van het Nederlanderschap wordt daarbij afgeweken van
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
  - number: 2.14.4
    text: |-
      In de gevallen bedoeld in [artikel 17 van de Rijkswet op het Nederlanderschap][ref1], worden de gegevens over het
      Nederlanderschap ontleend aan een afschrift van een in kracht van gewijsde gegane uitspraak van een rechterlijke
      instantie in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: 2.14.5
    text: |-
      Indien een afschrift wordt overgelegd van een uitspraak van het Gemeenschappelijk Hof van
      Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint Eustatius en Saba krachtens
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref1], worden de gegevens over het Nederlanderschap aan dit
      afschrift ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: 2.14.6
    text: |-
      Gegevens over de behandeling als Nederlander van een persoon die niet het Nederlanderschap bezit, worden opgenomen
      met toepassing van de [Wet betreffende de positie van Molukkers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: 2.15.1
    text: |-
      Gegevens over een vreemde nationaliteit worden ontleend aan een beschikking of uitspraak van een daartoe volgens
      het ter plaatse geldend recht bevoegde administratieve of rechterlijke instantie, die tot doel heeft tot bewijs te
      dienen van de betreffende nationaliteit, dan wel opgenomen met toepassing van het betreffende nationaliteitsrecht.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.15
  - number: 2.15.2
    text: |-
      Indien gegevens over een vreemde nationaliteit niet overeenkomstig het eerste lid kunnen worden verkregen, kunnen
      deze gegevens worden ontleend aan een geschrift van een volgens het ter plaatse geldend recht bevoegde autoriteit,
      dat gegevens vermeldt over die nationaliteit.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.15
  - number: 2.15.3
    text: |-
      Indien de betrokkene geen nationaliteit bezit of de nationaliteit niet kan worden
      vastgesteld, wordt dit gegeven opgenomen. Indien een rechterlijke uitspraak op grond van
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref1] is gedaan, waarbij is vastgesteld dat de betrokkene niet
      de Nederlandse nationaliteit bezit, wordt daarvan melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '2.16'
    text: |-
      Gegevens in verband met het verblijfsrecht van de vreemdeling worden ontleend aan mededelingen daarover van Onze
      Minister van Veiligheid en Justitie aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.16
  - number: '2.17'
    text: |-
      Bij de inschrijving van een vreemdeling op grond van [artikel 2.4][ref1], worden gegevens inzake de geboortedatum
      en de nationaliteit die niet als zodanig kunnen worden opgenomen overeenkomstig de [artikelen 2.8][ref2] en
      [2.15][ref3], ontleend aan een mededeling daarover van Onze Minister van Veiligheid en Justitie voor zover deze
      gegevens door hem zijn vastgesteld in het kader van de toelating van de betrokkene tot Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.18'
    text: |-
      Bij de inschrijving op grond van [artikel 2.3][ref1] worden de gegevens omtrent het adres ontleend aan de
      persoonslijst van de moeder uit wie het kind is geboren. Als datum van inschrijving wordt de geboortedatum
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.19.1
    text: |-
      Aan de aangifte van verblijf en adres van degene die rechtmatig verblijf geniet, naar redelijke verwachting
      gedurende een half jaar ten minste twee derde van de tijd in Nederland verblijf zal houden en die zijn adres heeft
      in de betrokken gemeente, worden gegevens betreffende het verblijf in Nederland, het adres en het vorige verblijf
      buiten Nederland ontleend.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
  - number: 2.19.2
    text: |-
      Indien aannemelijk is dat een gegeven betreffende het vorige verblijf buiten Nederland onjuist is, wordt dit
      gegeven niet opgenomen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
  - number: 2.19.3
    text: |-
      Indien een persoon als bedoeld in het eerste lid in gebreke is met het doen van aangifte, draagt het college van
      burgemeester en wethouders van de gemeente waar betrokkene zijn adres heeft, ambtshalve zorg voor opneming van
      gegevens betreffende het verblijf, het adres en het vorige verblijf buiten Nederland. Het college van burgemeester
      en wethouders is bevoegd de gegevens alsnog aan de aangifte van de betrokkene te ontlenen, indien de aangifte na
      afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
  - number: 2.19.4
    text: |-
      Als datum van aanvang van het verblijf in Nederland en van vestiging van het adres in de gemeente wordt de dag
      opgenomen waarop de aangifte is ontvangen, dan wel de dag waarop van het voornemen tot ambtshalve opneming van
      gegevens over het verblijf en adres aan betrokkene schriftelijk mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
  - number: 2.19.5
    text: De gegevens worden niet opgenomen dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
  - number: 2.19.6
    text: |-
      Indien de betrokkene komt vanuit Aruba, Curaçao, Sint Maarten, of een van de openbare lichamen, is
      [artikel 2.5][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.20.1
    text: |-
      Aan de aangifte van een ingezetene die zijn adres heeft gewijzigd, worden gegevens betreffende het adres ontleend,
      tenzij aannemelijk is dat de gegevens onjuist zijn.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.2
    text: |-
      Indien een ingezetene die zijn adres heeft gewijzigd, in gebreke is met het doen van aangifte, draagt het college
      van burgemeester en wethouders van de gemeente waar betrokkene zijn adres heeft, ambtshalve zorg voor opneming van
      gegevens betreffende het adres. Het college van burgemeester en wethouders is bevoegd de gegevens alsnog aan de
      aangifte van de betrokkene te ontlenen, indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.3
    text: 'Als datum van adreswijziging wordt opgenomen:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.3.a
    text: de in de aangifte vermelde datum van adreswijziging, als tijdig aangifte is gedaan;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.3.b
    text: |-
      de dag waarop de aangifte is ontvangen, in de overige gevallen waarin de gegevens aan de aangifte van de betrokkene
      worden ontleend;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.3.c
    text: |-
      de dag waarop van het voornemen tot opneming aan betrokkene schriftelijk mededeling is gedaan, bij ambtshalve
      opneming van de gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.20.4
    text: De gewijzigde gegevens worden niet opgenomen dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.20
  - number: 2.21.1
    text: |-
      Aan de aangifte van vertrek van de ingezetene die naar redelijke verwachting gedurende een jaar ten minste twee
      derde van de tijd buiten Nederland zal verblijven, worden gegevens betreffende het vertrek uit Nederland en het
      volgende verblijf buiten Nederland ontleend.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.21
  - number: 2.21.2
    text: |-
      Indien de ingezetene in gebreke is met het doen van aangifte, draagt het college van burgemeester en wethouders van
      de bijhoudingsgemeente ambtshalve zorg voor opneming van gegevens betreffende het vertrek en het volgende verblijf
      buiten Nederland. Het college van burgemeester en wethouders is bevoegd de gegevens alsnog aan de aangifte van de
      ingezetene te ontlenen, indien de aangifte na afloop van de aangiftetermijn geschiedt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.21
  - number: 2.21.3
    text: |-
      Als datum van vertrek uit Nederland en van opheffing van het adres wordt de dag opgenomen waarop de aangifte is
      ontvangen, dan wel de dag waarop van het voornemen tot ambtshalve opneming van gegevens over het vertrek aan de
      ingeschrevene schriftelijk mededeling is gedaan.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.21
  - number: 2.21.4
    text: De gegevens worden niet opgenomen dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.21
  - number: 2.21.5
    text: |-
      Indien de ingezetene in de aangifte van vertrek meldt te gaan verblijven in Aruba, Curaçao, Sint Maarten of een van
      de openbare lichamen, verstrekt het college van burgemeester en wethouders aan hem kosteloos een verhuisbericht,
      volgens een door Onze Minister vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.21
  - number: 2.22.1
    text: |-
      Indien een ingezetene niet kan worden bereikt, van hem geen aangifte van wijziging van zijn adres of van
      vertrek is ontvangen als bedoeld in [artikel 2.20, eerste lid][ref1], of [2.21, eerste lid][ref2], en na gedegen
      onderzoek geen gegevens over hem kunnen worden achterhaald betreffende het verblijf in Nederland, het vertrek
      uit Nederland noch het volgende verblijf buiten Nederland, draagt het college van burgemeester en wethouders van
      de bijhoudingsgemeente ambtshalve zorg voor de opneming van het gegeven van het vertrek van de ingezetene uit
      Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.22.2
    text: |-
      Als datum van vertrek uit Nederland en van opheffing van het adres wordt de dag opgenomen waarop het voornemen tot
      ambtshalve opneming van gegevens over het vertrek is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.22
  - number: 2.23.1
    text: |-
      Indien het woonadres ontbreekt dan wel [artikel 2.40][ref1] of [artikel 2.41][ref2] van toepassing is, wordt op
      aangifte een briefadres opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.23.2
    text: |-
      Het college van burgemeester en wethouders is bevoegd ambtshalve een briefadres op te nemen indien het woonadres
      ontbreekt en geen aangifte wordt gedaan van een briefadres. Het college neemt ambtshalve geen briefadres op dan met
      instemming van de briefadresgever.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.23
  - number: 2.24.1
    text: |-
      Het burgerservicenummer dat aan een persoon is toegekend overeenkomstig
      [artikel 8 van de Wet algemene bepalingen burgerservicenummer][ref1] wordt opgenomen op zijn persoonslijst, voordat
      over de betrokken persoon voor de eerste keer gegevens worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel8
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '8'
  - number: 2.24.2
    text: |-
      De gegevens over het burgerservicenummer van de ouders, de echtgenoot, de eerdere echtgenoten, de geregistreerde
      partner, de eerdere geregistreerde partners en de kinderen worden ontleend aan de desbetreffende persoonslijsten.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.24
  - number: '2.25'
    text: |-
      De gegevens over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde
      partner of de eerdere geregistreerde partner worden opgenomen op schriftelijk verzoek van de daartoe krachtens
      [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref1] bevoegde ingeschrevene, dan wel op grond van een
      rechterlijke uitspraak als bedoeld in artikel 9 van Boek 1 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
  - number: '2.26'
    text: |-
      Omtrent de beslissing dat een opgenomen algemeen gegeven onjuist is of, indien het een gegeven over de burgerlijke
      staat betreft, in strijd is met de Nederlandse openbare orde, omtrent een onderzoek naar die onjuistheid of
      strijdigheid, alsmede omtrent de omstandigheid dat de ingeschrevene geen ingezetene meer is, wordt een aantekening
      geplaatst bij de desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.26
  - number: 2.27.1
    text: |-
      De ambtenaar van de burgerlijke stand die in een van de onder hem berustende registers melding heeft gemaakt van
      een feit dat van belang is voor de bijhouding van de basisregistratie, brengt de gegevens ter zake terstond ter
      kennis van zijn college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.27
  - number: 2.27.2
    text: |-
      Een hem ingevolge een verdrag inzake de internationale uitwisseling van gegevens op het gebied van de burgerlijke
      stand toegezonden kennisgeving doet hij terstond toekomen aan zijn college.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.27
  - number: 2.27.3
    text: |-
      Hij verstrekt aan het college van burgemeester en wethouders dat daarom vraagt, zo spoedig mogelijk alle
      inlichtingen die dat college nodig heeft voor de bijhouding van de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.27
  - number: 2.27.4
    text: |-
      De ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage, die wegens het ontbreken
      van een akte in de onder hem berustende registers geen latere vermelding als bedoeld in
      [artikel 20 van Boek 1 van het Burgerlijk Wetboek][ref1] toevoegt van een hem op grond van
      [artikel 20e van Boek 1 van het Burgerlijk Wetboek][ref2] toegezonden besluit, rechterlijke uitspraak of notariële
      akte, brengt een afschrift van dat besluit, die uitspraak of die akte ter kennis van zijn college van burgemeester
      en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20e
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 20e
  - number: 2.28.1
    text: |-
      De griffier van de rechtbank die in het curatele- en bewindregister melding heeft gemaakt van een rechterlijke
      uitspraak waarbij met betrekking tot een persoon een voorziening in de curatele is getroffen, doet daarvan
      mededeling aan het college van burgemeester en wethouders van de bijhoudingsgemeente, onder vermelding van de
      persoon die het betreft en de datum waarop de rechtsgeldigheid van de voorziening ingaat.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.28
  - number: 2.28.2
    text: |-
      De griffier doet overeenkomstige mededeling van elke beslissing, houdende vernietiging van een rechterlijke
      uitspraak als bedoeld in het eerste lid, en van beëindiging van de curatele.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.28
  - number: 2.28.3
    text: |-
      De griffier van de rechtbank die in het gezagsregister aantekening heeft gehouden van een wijziging in het gezag
      dat over een minderjarige wordt uitgeoefend, welke van belang is voor de bijhouding van de basisregistratie, met
      betrekking tot de in [artikel 2.7, eerste lid, onder a, onder 3°][ref1], bedoelde gegevens, doet van de wijziging
      mededeling aan het college van burgemeester en wethouders van de bijhoudingsgemeente van de minderjarige.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.28.4
    text: |-
      De in het derde lid bedoelde mededeling geeft uitsluitend aan welke minderjarige het betreft, welke wijziging in
      het gezag heeft plaatsgevonden alsmede de datum waarop de wijziging ingaat.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.28
  - number: 2.29.1
    text: |-
      Indien Onze Minister van Veiligheid en Justitie in het openbaar register, bedoeld in
      [artikel 22, eerste lid, van de Rijkswet op het Nederlanderschap][ref1], melding heeft gemaakt van het feit
      dat een persoon een verklaring tot verkrijging van het Nederlanderschap of een verklaring van afstand van het
      Nederlanderschap heeft afgelegd, dan wel dat een persoon door verlening het Nederlanderschap heeft verkregen of
      door intrekking het Nederlanderschap heeft verloren, doet hij daarvan mededeling aan het college van burgemeester
      en wethouders van de bijhoudingsgemeente. De mededeling bevat de datum waarop de verklaring in ontvangst is genomen
      of de datum waarop het Nederlanderschap is verkregen of verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel22
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '22'
  - number: 2.29.2
    text: |-
      Een mededeling als bedoeld in het eerste lid blijft achterwege indien [artikel 2.14, derde lid][ref1], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.29.3
    text: |-
      De griffier van de rechtbank Den Haag dan wel de griffier van de Hoge Raad zendt een afschrift van een in
      kracht van gewijsde gegane rechterlijke uitspraak houdende de vaststelling van het Nederlanderschap of de
      vaststelling van het niet-bezitten van het Nederlanderschap, aan het college van burgemeester en wethouders van
      de bijhoudingsgemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.29
  - number: '2.30'
    text: |-
      Onze Minister van Veiligheid en Justitie doet van de gegevens in verband met het verblijfsrecht van de vreemdeling
      die voor de bijhouding van de basisregistratie van belang zijn, mededeling aan het college van burgemeester en
      wethouders van de bijhoudingsgemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.30
  - number: '2.31'
    text: |-
      Bij algemene maatregel van bestuur worden gevallen bepaald waarin het college van burgemeester en wethouders aan
      een korpschef als bedoeld in de [Vreemdelingenwet 2000][ref1] een afschrift toezendt van een beslissing als bedoeld
      in [artikel 2.60][ref2] om op grond van [artikel 2.10, tweede lid][ref3], een gegeven betreffende een vreemdeling
      niet in de basisregistratie op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.32'
    text: |-
      De griffier van het betrokken gerecht zendt een afschrift van een in kracht van gewijsde gegane uitspraak als
      bedoeld in [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref1] aan het college van burgemeester en wethouders
      van de bijhoudingsgemeente van de onbevoegd verklaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
  - number: '2.33'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan overheidsorganen verplichtingen worden opgelegd tot het doen van
      mededeling aan het college van burgemeester en wethouders van de betrokken gemeente inzake het van toepassing zijn
      van [artikel 2.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.34.1
    text: |-
      Een bestuursorgaan dat in verband met de verstrekking van een authentiek gegeven uit de basisregistratie gerede
      twijfel heeft over de juistheid van dat gegeven, doet hiervan mededeling aan het college van burgemeester en
      wethouders van de bijhoudingsgemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.34
  - number: 2.34.2
    text: |-
      Onze Minister wijst de bestuursorganen aan die tevens mededeling doen in verband met de verstrekking van andere dan
      authentieke gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.34
  - number: 2.34.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de gevallen waarin en de wijze waarop de mededeling
      wordt gedaan, alsmede de kennisgeving van het college van burgemeester en wethouders aan het bestuursorgaan naar
      aanleiding van een mededeling, geregeld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.34
  - number: 2.34.4
    text: |-
      Het college van burgemeester en wethouders kan nadere regels stellen omtrent het doen van mededeling door en de
      kennisgeving aan bestuursorganen die een orgaan zijn van de desbetreffende gemeente en kan een of meer van deze
      bestuursorganen aanwijzen om tevens mededeling te doen in verband met de verstrekking van andere dan authentieke
      gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.34
  - number: 2.34.5
    text: |-
      Voor zover een mededeling als bedoeld in het eerste lid betrekking heeft op een gegeven dat op grond van een andere
      wet is overgenomen uit een andere registratie, zendt het college van burgemeester en wethouders die mededeling door
      aan de verantwoordelijke voor de verwerking van dat gegeven in die andere registratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.34
  - number: 2.35.1
    text: |-
      Een college van burgemeester en wethouders dat van de ambtenaar van de burgerlijke stand in zijn gemeente gegevens
      heeft ontvangen die van belang zijn voor de bijhouding van de basisregistratie door een andere gemeente, doet
      terstond mededeling van die gegevens aan het college van burgemeester en wethouders van de andere gemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.35
  - number: 2.35.2
    text: |-
      Een college dat van de ambtenaar van de burgerlijke stand in zijn gemeente een ingevolge een verdrag inzake
      de internationale uitwisseling van gegevens op het gebied van de burgerlijke stand toegezonden kennisgeving
      heeft ontvangen die van belang is voor de bijhouding van de basisregistratie door een andere gemeente, doet die
      kennisgeving terstond toekomen aan het college van burgemeester en wethouders van de andere gemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.35
  - number: 2.35.3
    text: |-
      Onze Minister, dan wel een college van burgemeester en wethouders, verstrekt aan een college van burgemeester en
      wethouders dat daar belang bij heeft spontaan of op verzoek zo spoedig mogelijk alle inlichtingen die van belang
      zijn voor een goede uitvoering van de taak met betrekking tot de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.35
  - number: '2.36'
    text: |-
      Bij algemene maatregel van bestuur kunnen aan overheidsorganen verplichtingen worden opgelegd
      tot het verschaffen aan het college van burgemeester en wethouders van de gegevens, bedoeld in
      [artikel 2.7, eerste lid, onder a, onderdelen 10° en 11°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.36
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.37'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop aan
      de verplichtingen bedoeld in deze paragraaf moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.37
  - number: 2.38.1
    text: |-
      Degene die naar redelijke verwachting gedurende een half jaar ten minste twee derde van de tijd in Nederland
      verblijf zal houden, meldt zich uiterlijk op de vijfde dag na de aanvang van zijn verblijf in persoon bij het
      college van burgemeester en wethouders van de gemeente waar hij zijn woonadres heeft om daarbij schriftelijk
      aangifte van verblijf en adres te doen. Indien hij geen woonadres heeft, kiest hij een briefadres en meldt hij zich
      binnen de gestelde termijn bij het college van burgemeester en wethouders van de gemeente waar hij zijn briefadres
      heeft om de bedoelde aangifte te doen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.2
    text: |-
      Hij doet in de aangifte mededeling van de gegevens over zijn toekomstig verblijf in Nederland, over zijn adres in
      de gemeente en over het vorige verblijf buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.3
    text: |-
      Hij geeft bij de aangifte de inlichtingen en legt de geschriften over ter zake van feiten betreffende zijn
      burgerlijke staat, zijn nationaliteit en zijn eerder verblijf in Nederland, die noodzakelijk zijn voor de
      bijhouding met betrekking tot hem van de basisregistratie. Op verzoek van het college van burgemeester en
      wethouders legt hij van een geschrift een door een beëdigde vertaler vervaardigde Nederlandse vertaling over.
      Indien hij zich in Nederland vestigt, komende vanuit Aruba, Curaçao, Sint Maarten of een van de openbare lichamen,
      legt hij een hem betreffend verhuisbericht over, verstrekt door de verantwoordelijke voor de verwerking van
      gegevens in de basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare lichamen, waar hij
      laatstelijk als ingezetene was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.4
    text: |-
      Degene die naar redelijke verwachting gedurende een half jaar ten minste twee derde van de tijd in Nederland
      verblijf zal houden, doet aangifte van verblijf en adres overeenkomstig het eerste tot en met het derde lid, op het
      moment dat hij ophoudt te behoren tot een categorie als bedoeld in [artikel 2.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.38.5
    text: |-
      In een geval als bedoeld in het vierde lid vangt de in het eerste lid bedoelde termijn van vijf dagen aan met
      ingang van de dag na die waarop een in dat lid bedoelde situatie is ingetreden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.6
    text: 'Aangifte van verblijf en adres blijft achterwege indien:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.6.a
    text: het verblijf aanvangt door geboorte en inschrijving plaatsvindt op grond van de geboorteakte,
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.38.6.b
    text: |-
      de betrokkene behoort tot een categorie van personen als bedoeld in [artikel 2.6][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.38.6.c
    text: de betrokkene een vreemdeling is die geen rechtmatig verblijf geniet.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.38
  - number: 2.39.1
    text: |-
      De ingezetene die zijn adres wijzigt doet hiervan schriftelijk aangifte bij het college van burgemeester en
      wethouders van de gemeente waar hij zijn nieuwe adres heeft.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.39
  - number: 2.39.2
    text: |-
      Hij doet niet eerder aangifte dan vier weken vóór de beoogde datum van adreswijziging en niet later dan de vijfde
      dag na de adreswijziging. Hij doet in de aangifte mededeling van de datum van adreswijziging en van de gegevens
      over het nieuwe en het vorige adres.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.39
  - number: 2.39.3
    text: |-
      Indien een ingezetene geen woonadres heeft, kiest hij een briefadres. Het eerste en tweede lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.39
  - number: 2.40.1
    text: |-
      Degene die zijn woonadres heeft in een instelling die is aangewezen op grond van het derde of het vierde lid kan,
      in afwijking van de [artikelen 2.38, eerste lid][ref1], en [2.39, eerste lid][ref2], in plaats van zijn woonadres
      een briefadres kiezen en daarvan overeenkomstig de genoemde bepalingen aangifte doen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.40.2
    text: |-
      Een instelling wordt slechts aangewezen indien de aard van de instelling meebrengt, dat door opneming van het
      adres daarvan in de basisregistratie de persoonlijke levenssfeer van de betrokkenen onevenredig zou kunnen worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.40.3
    text: 'Onze Minister kan categorieën van instellingen dan wel instellingen afzonderlijk aanwijzen, voor zover het betreft:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.40.3.a
    text: instellingen voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.40.3.b
    text: instellingen op het gebied van de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.40.3.c
    text: penitentiaire instellingen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.40.4
    text: |-
      Het college van burgemeester en wethouders kan een in de gemeente gevestigde instelling aanwijzen waarin beschermd
      wonen of opvang wordt verstrekt als bedoeld in [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 2.40.5
    text: |-
      Het hoofd van een aangewezen instelling doet aan de betrokken personen tijdig schriftelijk mededeling van de
      mogelijkheid tot aangifte van een briefadres.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.40
  - number: 2.41.1
    text: |-
      Voor zover het opnemen van een woonadres naar het oordeel van de burgemeester om veiligheidsredenen niet wenselijk
      is, kan de betrokkene in afwijking van [artikel 2.38, eerste lid][ref1], en [2.39, eerste lid][ref2], in plaats van
      zijn woonadres een briefadres kiezen en daarvan overeenkomstig de genoemde bepalingen aangifte doen.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.41.2
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.41
  - number: '2.42'
    text: 'Als briefadresgever kan worden gekozen:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.42
  - number: 2.42.a
    text: een natuurlijke persoon die als ingezetene is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.42
  - number: 2.42.b
    text: |-
      een rechtspersoon die zijn zetel heeft in Nederland en die door het college van burgemeester en wethouders is
      aangewezen om als briefadresgever in zijn gemeente op te treden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.42
  - number: 2.43.1
    text: |-
      De ingezetene die naar redelijke verwachting gedurende een jaar ten minste twee derde van de tijd buiten Nederland
      zal verblijven, doet bij het college van burgemeester en wethouders van de bijhoudingsgemeente voor zijn vertrek
      uit Nederland schriftelijk aangifte van vertrek. De aangiftetermijn vangt aan op de vijfde dag voor de dag van
      vertrek.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.2
    text: |-
      De ingezetene doet in die aangifte mededeling van de gegevens over zijn vertrek en het volgende verblijf buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.3
    text: 'Ter uitvoering van het eerste lid verschijnt de ingezetene in persoon bij het college, indien:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.3.a
    text: niet alle ingezetenen met hetzelfde woonadres de verplichting, bedoeld in het eerste lid, vervullen, of
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.3.b
    text: niet voor alle ingezetenen met hetzelfde woonadres de verplichting, bedoeld in het eerste lid, wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.4
    text: |-
      Een minderjarige verschijnt in persoon, tenzij alle ingezetenen met hetzelfde woonadres aangifte van vertrek doen
      of aangifte van vertrek voor hen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: 2.43.5
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent bijzondere gevallen waarin het eerste lid
      niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.43
  - number: '2.44'
    text: |-
      De ingezetene brengt alle feiten betreffende zijn burgerlijke staat en nationaliteit die zich buiten Nederland
      hebben voorgedaan, zo spoedig mogelijk ter kennis aan het college van burgemeester en wethouders. Hij verstrekt
      aan het college, desgevraagd in persoon, de inlichtingen en legt de geschriften over die noodzakelijk zijn voor de
      bijhouding met betrekking tot hem van de basisregistratie. Op verzoek van het college legt hij van een geschrift
      een door een beëdigde vertaler vervaardigde Nederlandse vertaling over.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.44
  - number: 2.45.1
    text: |-
      Degene die aangifte heeft gedaan als bedoeld in de [artikelen 2.38 tot en met 2.40][ref1] en [artikel 2.43][ref2],
      geeft op verzoek van het college van burgemeester en wethouders de inlichtingen ter zake van zijn aangifte die
      van belang zijn voor de bijhouding met betrekking tot hem van de basisregistratie. Deze verplichting is van
      overeenkomstige toepassing ten aanzien van het overleggen van geschriften. De betrokkene verschijnt hierbij
      desgevraagd in persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.45.2
    text: |-
      In de aangifte van een briefadres worden de redenen voor de aangifte van een briefadres medegedeeld. Bij de
      aangifte wordt een schriftelijke verklaring van instemming gevoegd van de briefadresgever.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.45
  - number: 2.45.3
    text: |-
      De briefadresgever draagt zorg dat voor de houder van het briefadres bestemde geschriften of inlichtingen daarover,
      aan hem worden doorgegeven of medegedeeld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.45
  - number: 2.45.4
    text: |-
      De briefadresgever verstrekt op verzoek van het college van burgemeester en wethouders, desgevraagd in persoon, ter
      zake van dat briefadres de inlichtingen en legt de geschriften over die noodzakelijk zijn voor de bijhouding van
      de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.45
  - number: 2.45.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de toepassing van het eerste tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.45
  - number: '2.46'
    text: |-
      De ingezetene verstrekt op verzoek van het college van burgemeester en wethouders over feiten betreffende zijn
      burgerlijke staat en nationaliteit, desgevraagd in persoon, de inlichtingen en legt de geschriften over die
      noodzakelijk zijn voor de bijhouding van de basisregistratie. Op verzoek van het college van burgemeester en
      wethouders legt hij van een geschrift een door een beëdigde vertaler vervaardigde Nederlandse vertaling over.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.46
  - number: '2.47'
    text: |-
      Degene ten aanzien van wie het college van burgemeester en wethouders het redelijke vermoeden heeft dat hij in
      gebreke is met het doen van een aangifte als bedoeld in de [artikelen 2.38 tot en met 2.43][ref1], verstrekt op
      verzoek van het college van burgemeester en wethouders, desgevraagd in persoon, binnen een door het college in
      het verzoek te noemen termijn, ter zake de inlichtingen en legt de geschriften over die noodzakelijk zijn voor de
      bijhouding met betrekking tot hem van de basisregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: '2.48'
    text: |-
      De verplichtingen, vermeld in de [artikelen 2.38][ref1], [2.39][ref2] en [2.43 tot en met 2.47][ref3], rusten op:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.48.a
    text: ouders, voogden en verzorgers voor minderjarigen jonger dan 16 jaar;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.48
  - number: 2.48.b
    text: |-
      ouders, voogden en verzorgers voor inwonende minderjarigen van 16 jaar of ouder, tenzij de minderjarige zelf de
      verplichting vervult;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.48
  - number: 2.48.c
    text: curatoren voor onder curatele gestelden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.48
  - number: 2.49.1
    text: |-
      De verplichtingen, vermeld in de [artikelen 2.39][ref1] en [2.44 tot en met 2.46][ref2], kunnen worden vervuld
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.49.1.a
    text: de ouder en zijn meerderjarige kind, indien beiden hetzelfde woonadres hebben, voor elkaar;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.1.b
    text: echtgenoten dan wel geregistreerde partners die hetzelfde woonadres hebben, voor elkaar;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.1.c
    text: elke meerderjarige voor een persoon die hem daartoe schriftelijk gemachtigd heeft;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.1.d
    text: |-
      het hoofd van een instelling voor gezondheidszorg voor een in die instelling verblijvende persoon die wegens de
      toestand van zijn gezondheid niet in staat kan worden geacht aan zijn verplichtingen te voldoen of een machtiging
      daartoe te geven, dan wel de echtgenoot, de geregistreerde partner of andere levensgezel of de bloed- of
      aanverwanten tot en met de tweede graad van een zodanig persoon, onder overlegging van een schriftelijke verklaring
      ter zake van het hoofd van de desbetreffende instelling.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, kan het college van burgemeester en wethouders de vertegenwoordigde
      overeenkomstig de genoemde artikelen oproepen om in persoon te verschijnen tot het verstrekken van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de in [artikel 2.38][ref1] vermelde verplichtingen
      voor zover het bij algemene maatregel van bestuur bepaalde gevallen betreft. De maatregel bepaalt tevens de
      gevallen waarin kan worden afgeweken van de in dat artikel vermelde verplichting om zich in persoon te melden bij
      het college van burgemeester en wethouders. De maatregel bepaalt slechts gevallen waarin er om zwaarwegende redenen
      van kan worden afgezien dat de betrokkene zelf de verplichtingen vervult en zich daartoe in persoon meldt bij het
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.49.4
    text: |-
      Het eerste lid, onderdelen a, b en d, en het tweede lid zijn van overeenkomstige toepassing op de in
      [artikel 2.43][ref1] vermelde verplichting, met dien verstande dat, behoudens bij algemene maatregel van bestuur te
      bepalen gevallen, een ouder en zijn meerderjarige kind en echtgenoten dan wel geregistreerde partners voor elkaar
      slechts de aangifteplicht kunnen vervullen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.49.4.a
    text: zij die verplichting ook voor zichzelf vervullen, en
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.4.b
    text: |-
      alle andere ingezetenen met hetzelfde woonadres die verplichting vervullen of die verplichting voor hen wordt
      vervuld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
  - number: 2.49.5
    text: |-
      Voor de toepassing van het eerste lid wordt met betrekking tot de verplichtingen, vermeld in [artikel 2.39][ref1],
      onder woonadres het nieuwe woonadres verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.49
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: '2.50'
    text: |-
      Het hoofd van een instelling of bedrijf waar personen verblijf plegen te houden, de instellingen, bedoeld in
      [artikel 2.40][ref1] daaronder begrepen, verstrekt, indien de instelling of het bedrijf ter zake door het college
      van burgemeester en wethouders is aangewezen, op door het college te bepalen tijdstippen aan het college de door
      het college gevraagde inlichtingen over de personen die naar redelijke verwachting in de instelling of het bedrijf
      voor onbepaalde tijd verblijf zullen houden dan wel gedurende drie maanden ten minste twee derde van de tijd zullen
      overnachten.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: '2.51'
    text: |-
      De echtgenoot, de geregistreerde partner en andere nabestaanden tot en met de tweede graad van een ingezetene
      die in het buitenland is overleden, verstrekken op verzoek van het college van burgemeester en wethouders van de
      gemeente waar betrokkene is ingeschreven, aan het college, voor zover mogelijk, de inlichtingen over dat overlijden
      en leggen de geschriften over die noodzakelijk zijn voor de bijhouding van de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.51
  - number: 2.52.1
    text: |-
      Degene die ter uitvoering van ingevolge deze paragraaf op hem rustende verplichtingen in persoon bij het college
      van burgemeester en wethouders verschijnt, legt desgevraagd met het oog op de vaststelling van zijn identiteit een
      op hem betrekking hebbend document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] over.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2.52.2
    text: |-
      De in [artikel 2.48][ref1] bedoelde ouders, voogden, verzorgers en curatoren van minderjarigen of onder curatele
      gestelden, laten desgevraagd de minderjarige of de onder curatele gestelde met het oog op de vaststelling van de
      identiteit verschijnen bij het college van burgemeester en wethouders en leggen desgevraagd een op hem betrekking
      hebbend document als bedoeld in het eerste lid over.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 2.53.1
    text: |-
      Een verzoek als bedoeld in deze paragraaf wordt gericht aan het college van burgemeester en wethouders van de
      bijhoudingsgemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.53
  - number: 2.53.2
    text: |-
      Een verzoek als bedoeld in [artikel 2.55][ref1] kan ook worden gericht aan het college van enige andere gemeente
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.53.3
    text: |-
      Een verzoek als bedoeld in [artikel 2.55][ref1] kan ook worden gericht aan Onze Minister. In dat geval treedt Onze
      Minister voor de toepassing van artikel 2.55 in de plaats van het college van burgemeester en wethouders en wordt
      het verzoek gedaan door tussenkomst van een inschrijfvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.53
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.54.1
    text: |-
      Het college van burgemeester en wethouders zendt binnen vier weken na een inschrijving als bedoeld in de
      [artikelen 2.3][ref1] en [2.4][ref2], alsmede binnen vier weken nadat een ingeschrevene die geen ingezetene was
      ingezetene is geworden, aan de ingeschrevene in begrijpelijke vorm een volledig overzicht van zijn persoonslijst.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: 2.54.2
    text: |-
      Bij minderjarigen jonger dan 16 jaar en bij onder curatele gestelden geschiedt de toezending aan de ouders, voogden
      of verzorgers, onderscheidenlijk aan de curator.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.54
  - number: 2.54.3
    text: |-
      Bij de toezending wordt schriftelijk mededeling gedaan van de hoofdlijnen van de ter zake van de basisregistratie
      geldende regels, waaronder ten minste de hoofdlijnen van de regels betreffende de identiteit van de voor de
      verwerking verantwoordelijke, de doeleinden van de basisregistratie, de opgenomen gegevenscategorieën, de
      categorieën van ontvangers van gegevens en de rechten van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.54
  - number: 2.54.4
    text: |-
      Degene die aangifte van verblijf en adres doet, wordt bij die gelegenheid schriftelijk op de hoogte gesteld van het
      recht, bedoeld in [artikel 2.59][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.54
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.55.1
    text: |-
      Het college van burgemeester en wethouders deelt een ieder op diens verzoek schriftelijk binnen vier weken
      kosteloos mede of hem betreffende persoonsgegevens in de basisregistratie worden verwerkt. Indien zodanige gegevens
      worden verwerkt, wordt de verzoeker met betrekking tot de basisregistratie de in [artikel 2.54, derde lid][ref1],
      bedoelde schriftelijke mededeling gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.55.2
    text: |-
      Het college verleent een ieder op diens verzoek binnen vier weken kosteloos inzage in hem betreffende gegevens in
      de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.3
    text: |-
      Het college verstrekt een ieder op diens verzoek binnen vier weken een, desgevraagd gewaarmerkt, afschrift in
      begrijpelijke vorm van de hem betreffende persoonsgegevens die in de basisregistratie worden verwerkt, alsmede de
      beschikbare informatie over de oorsprong van die gegevens voor zover die niet van de verzoeker zelf afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.4
    text: Het college draagt zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.5
    text: 'De verzoeken, bedoeld in het eerste tot en met derde lid, worden gedaan door:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.5.a
    text: ouders, voogden of verzorgers voor minderjarigen jonger dan 16 jaar;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.5.b
    text: curatoren voor onder curatele gestelden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.55.6
    text: |-
      Aan het verzoek wordt geen gevolg gegeven indien dat niet met een redelijke tussenpoos is gedaan ten opzichte van
      een eerder verzoek.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.55
  - number: 2.56.1
    text: |-
      Het college van burgemeester en wethouders neemt op schriftelijk verzoek van de daartoe krachtens
      [artikel 9 van Boek 1 van het Burgerlijk Wetboek][ref1] bevoegde ingeschrevene binnen vier weken kosteloos op zijn
      persoonslijst de gegevens op over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de
      geregistreerde partner of de eerdere geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel9
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '9'
  - number: 2.56.2
    text: Het college doet van de opneming van de gegevens terstond schriftelijk mededeling aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.56
  - number: 2.57.1
    text: |-
      Het college van burgemeester en wethouders verwijdert op schriftelijk verzoek van de adoptiefouders van een
      minderjarige jonger dan 16 jaar, of op schriftelijk verzoek van een adoptiefkind van 16 jaar of ouder, binnen vier
      weken kosteloos van de persoonslijst van het adoptiefkind, de vóór de adoptie geldende algemene gegevens voor zover
      het betreft:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.1.a
    text: gegevens over de naam;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.1.b
    text: gegevens over één of beide ouders;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.1.c
    text: gegevens over de bij de adoptie verloren nationaliteit;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.1.d
    text: |-
      gegevens over de bijhoudingsgemeente en het adres in die gemeente alsmede over het verblijf in Nederland en het
      vertrek uit Nederland.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.2
    text: |-
      Het college verwijdert op schriftelijk verzoek van de ouder met wie door een uitspraak van adoptie de
      familierechtelijke betrekkingen tot een kind zijn verbroken, binnen vier weken kosteloos van de persoonslijst van
      die ouder de algemene gegevens over dat kind.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.3
    text: |-
      Het college verwijdert op schriftelijk verzoek van de ingeschrevene binnen vier weken kosteloos van zijn
      persoonslijst de algemene gegevens die zijn gewijzigd in verband met een wijziging van de vermelding van het
      geslacht in de geboorteakte van de ingeschrevene, voor zover deze gegevens golden vóór de wijziging en het betreft:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.3.a
    text: gegevens over de naam;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.3.b
    text: gegevens over het geslacht;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.3.c
    text: |-
      gegevens over het gebruik van de geslachtsnaam van de echtgenoot, de eerdere echtgenoot, de geregistreerde partner
      of de eerdere geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.4
    text: |-
      Het college verwijdert op schriftelijk verzoek van de ingeschrevene die de leeftijd van 16 jaar heeft bereikt,
      binnen vier weken kosteloos van zijn persoonslijst de algemene gegevens over de naam en het geslacht van een ouder,
      een eerdere echtgenoot of een eerdere geregistreerde partner of het algemeen gegeven over de naam van het kind
      van de ingeschrevene, die zijn gewijzigd in verband met een wijziging van de vermelding van het geslacht in de
      geboorteakte van de ouder, eerdere echtgenoot, eerdere geregistreerde partner of het kind.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.57.5
    text: |-
      [Artikel 2.55, vierde lid][ref1], is van toepassing op een verzoek als bedoeld in het eerste tot en met vierde lid.
      Op een verzoek als bedoeld in het derde of vierde lid is bovendien artikel 2.55, vijfde lid, van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.57.6
    text: Het college doet van de verwijdering terstond schriftelijk mededeling aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.57
  - number: 2.58.1
    text: |-
      Het college van burgemeester en wethouders voldoet binnen vier weken kosteloos aan het verzoek van betrokkene hem
      betreffende gegevens in de basisregistratie te verbeteren, aan te vullen of te verwijderen, indien deze feitelijk
      onjuist dan wel onvolledig zijn of in strijd met een wettelijk voorschrift worden verwerkt. Het verzoek bevat de
      aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.58
  - number: 2.58.2
    text: Het college geeft aan het verzoek uitvoering met inachtneming van het bepaalde bij of krachtens deze afdeling.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.58
  - number: 2.58.3
    text: |-
      Het college kan de termijn, bedoeld in het eerste lid, voor zover noodzakelijk, met telkens acht weken verlengen,
      indien het verzoek gegevens over de burgerlijke staat of de nationaliteit betreft. Het college doet terstond
      schriftelijk mededeling van de verlening aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.58
  - number: 2.58.4
    text: |-
      [Artikel 2.55, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.58
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.58.5
    text: |-
      Het college van burgemeester en wethouders doet van de uitvoering van het verzoek terstond schriftelijk mededeling
      aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.58
  - number: '2.59'
    text: |-
      Het college van burgemeester en wethouders vermeldt op schriftelijk verzoek van de betrokkene kosteloos
      op zijn persoonslijst een aantekening omtrent beperking van de verstrekking van gegevens aan derden. Het
      college geeft binnen vier weken gevolg aan het verzoek en doet daarvan terstond schriftelijk mededeling
      aan de verzoeker, onder vermelding van de geldende regels ter zake. Indien het verzoek bij gelegenheid van
      een aangifte van verblijf en adres wordt gedaan, wordt aan dat verzoek bij die gelegenheid gevolg gegeven.
      [Artikel 2.55, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.59
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: '2.60'
    text: 'Een beslissing van het college van burgemeester en wethouders om:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.a
    text: aan een aangifte geen of slechts ten dele gevolg te geven;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.b
    text: |-
      een gegeven over de burgerlijke staat niet op te nemen, dan wel een geschrift daarover dat als akte is aangeboden
      niet als zodanig aan te merken;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.c
    text: een gegeven over de nationaliteit niet op te nemen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.d
    text: |-
      ambtshalve over te gaan tot inschrijving, of tot opneming van gegevens in het geval dat inschrijving of opneming op
      grond van een aangifte had moeten geschieden;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.e
    text: ambtshalve over te gaan tot verbetering, aanvulling of verwijdering van een algemeen gegeven;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.f
    text: |-
      bij een opgenomen algemeen gegeven een aantekening over de onjuistheid van dat gegeven of over de strijdigheid
      daarvan met de Nederlandse openbare orde te plaatsen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
  - number: 2.60.g
    text: |-
      niet te voldoen aan een verzoek als bedoeld in de [artikelen 2.55 tot en met 2.59][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.60
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.61.1
    text: |-
      Indien de rechter het beroep, ingesteld tegen een besluit als bedoeld in [artikel 2.60][ref1], gegrond verklaart
      met toepassing van [artikel 8:72, derde lid, onderdeel b, of vierde lid, van de Algemene wet bestuursrecht][ref2],
      doet hij dat met inachtneming van het bepaalde bij of krachtens deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 2.61.2
    text: |-
      Voor zover een besluit als bedoeld in [artikel 2.60][ref1] het Nederlanderschap betreft, kan
      de betrokkene zich uitsluitend wenden tot de rechtbank Den Haag met een verzoek als bedoeld in
      [artikel 17 van de Rijkswet op het Nederlanderschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel17
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '17'
  - number: '2.62'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder een aangewezen bestuursorgaan: een
      bestuursorgaan als bedoeld in [artikel 2.65][ref1], voor zover het betreft de taken en gevallen waar de in dat
      artikel bedoelde aanwijzing betrekking op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.62
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '2'
  - number: 2.63.1
    text: |-
      Deze afdeling is van toepassing op personen die niet als ingezetene in de basisregistratie zijn ingeschreven, met
      uitzondering van personen die op het moment van hun overlijden ingezetene waren.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.63
  - number: 2.63.2
    text: |-
      In afwijking van het eerste lid worden geen gegevens opgenomen krachtens deze afdeling in een geval als bedoeld in
      [artikel 2.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: 2.63.3
    text: |-
      De krachtens deze afdeling over een ingeschrevene opgenomen gegevens worden zodra hij ingezetene wordt opnieuw
      vastgesteld met inachtneming van de [eerste afdeling van dit hoofdstuk][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.63
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '2'
        afdeling: '1'
  - number: '2.64'
    text: 'Onze Minister houdt in Nederland voorzieningen in stand ten behoeve van de uitvoering van deze wet inzake:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.64
  - number: 2.64.a
    text: het inschrijven van niet-ingezetenen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.64
  - number: 2.64.b
    text: het indienen van verzoeken van niet-ingezetenen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.64
  - number: '2.65'
    text: |-
      Bij algemene maatregel van bestuur kunnen bestuursorganen worden aangewezen die bevoegd zijn om Onze
      Minister een verzoek te doen als bedoeld in [artikel 2.68, eerste lid][ref1], of een opgave als bedoeld in
      [artikel 2.70, derde lid, onderdeel a][ref2]. Bij de maatregel wordt bepaald op welke taken van het bestuursorgaan
      de aanwijzing betrekking heeft. Daarbij kan tevens bepaald worden op welke gevallen de aanwijzing betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.65
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.66.1
    text: |-
      Onze Minister schrijft een persoon in de basisregistratie in op grond van een verzoek als bedoeld in
      [artikel 2.67][ref1] of [artikel 2.68][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.66
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.66.2
    text: Inschrijving geschiedt niet als de betrokkene reeds in de basisregistratie is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.66
  - number: 2.67.1
    text: Eenieder kan Onze Minister verzoeken hem in te schrijven in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.67
  - number: 2.67.2
    text: |-
      Bij zijn verzoek legt de betrokkene ten minste de bij of krachtens algemene maatregel van bestuur aangewezen
      bescheiden ten behoeve van een juiste inschrijving over.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.67
  - number: 2.67.3
    text: |-
      Onze Minister gaat niet over tot inschrijving dan nadat de betrokkene ten behoeve van de vaststelling van zijn
      identiteit in persoon bij de inschrijfvoorziening is verschenen. Bij of krachtens algemene maatregel van bestuur
      kan worden bepaald in welke gevallen van de verschijning in persoon kan worden afgezien.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.67
  - number: 2.67.4
    text: Onze Minister gaat niet over tot inschrijving dan nadat de identiteit van de betrokkene deugdelijk is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.67
  - number: 2.67.5
    text: |-
      Onze Minister gaat niet over tot inschrijving als de betrokkene op grond van de eerste afdeling van dit hoofdstuk
      voor inschrijving in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.67
  - number: 2.68.1
    text: Een aangewezen bestuursorgaan kan Onze Minister verzoeken om een persoon in te schrijven in de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.68
  - number: 2.68.2
    text: |-
      Het bestuursorgaan verzoekt alleen om inschrijving als het zelf gegevens over de betrokkene verwerkt in verband met
      de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.68
  - number: 2.68.3
    text: |-
      Het bestuursorgaan verzoekt niet om inschrijving dan nadat de identiteit van de betrokkene deugdelijk is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.68
  - number: 2.68.4
    text: |-
      Het bestuursorgaan verzoekt niet om inschrijving als de betrokkene op grond van de eerste afdeling van dit
      hoofdstuk voor inschrijving in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.68
  - number: 2.69.1
    text: 'In de basisregistratie worden over de ingeschrevene uitsluitend de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a
    text: 'algemene gegevens:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a.1
    text: gegevens over de burgerlijke staat waar het betreft de naam, de geboorte, het geslacht en het overlijden;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a.2
    text: |-
      gegevens over de nationaliteit, met dien verstande dat geen gegevens over een vreemde nationaliteit worden
      opgenomen naast gegevens over het Nederlanderschap of het feit dat de betrokkene als Nederlander wordt behandeld;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a.3
    text: gegevens in verband met het verblijfsrecht van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a.4
    text: gegevens over het woonadres;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.a.5
    text: gegevens over het burgerservicenummer van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b
    text: 'administratieve gegevens:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.1
    text: gegevens in verband met de inschrijving;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.2
    text: gegevens over het niet-ingezetenschap;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.3
    text: |-
      gegevens over de opgave van algemene gegevens die het aangewezen bestuursorgaan heeft gedaan of over het verzoek
      van de ingeschrevene om opneming van algemene gegevens;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.4
    text: |-
      gegevens ter aanduiding van de bron waaruit algemene gegevens zijn verkregen, dan wel van de rechtsgrond krachtens
      welke algemene gegevens zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.5
    text: |-
      gegevens ter aanduiding van de onjuistheid van een opgenomen algemeen gegeven of van strijd met de Nederlandse
      openbare orde van een opgenomen gegeven over de burgerlijke staat dan wel over een onderzoek naar die onjuistheid
      of strijdigheid, alsmede andere gegevens, noodzakelijk in verband met de bijhouding van de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.1.b.6
    text: gegevens over de beperking van de verstrekking van gegevens aan derden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
  - number: 2.69.2
    text: |-
      [Artikel 2.7, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.69
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.70.1
    text: |-
      Onze Minister neemt de gegevens over de burgerservicenummers op, overeenkomstig [artikel 2.24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 2.70.2
    text: |-
      Onze Minister neemt bij een inschrijving als bedoeld in [artikel 2.67][ref1] de bij algemene maatregel van bestuur
      aangewezen algemene gegevens op.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.70.3
    text: 'Onze Minister neemt in de overige gevallen algemene gegevens op:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
  - number: 2.70.3.a
    text: door ontlening aan een opgave van een aangewezen bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
  - number: 2.70.3.b
    text: op verzoek van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
  - number: 2.70.4
    text: |-
      Onze Minister draagt zorg voor het opnemen van de administratieve gegevens die betrekking hebben op de algemene
      gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.70
  - number: 2.71.1
    text: |-
      Het aangewezen bestuursorgaan dat een opgave doet als bedoeld in [artikel 2.70, derde lid, onder a][ref1], geeft
      daarbij toepassing aan de [artikelen 2.72 tot en met 2.75][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.71.2
    text: |-
      Indien het bestuursorgaan op grond van een wet, een verdrag of een besluit van een volkenrechtelijke organisatie
      gehouden is de desbetreffende gegevens te ontlenen aan een opgave van een buitenlands orgaan, ontleent het
      bestuursorgaan deze gegevens aan die opgave.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.71
  - number: 2.71.3
    text: |-
      Indien Onze Minister gegevens opneemt, anders dan door ontlening aan een opgave van een aangewezen bestuursorgaan,
      geeft hij daarbij toepassing aan de [artikelen 2.72 tot en met 2.75][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.71
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: '2.72'
    text: |-
      De gegevens over de burgerlijke staat worden vastgesteld overeenkomstig de [artikelen 2.8][ref1] en [2.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.72
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.73'
    text: |-
      De gegevens over de nationaliteit worden vastgesteld overeenkomstig de [artikelen 2.14][ref1] en [2.15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.73
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '2.74'
    text: |-
      De gegevens in verband met het verblijfsrecht van de vreemdeling worden ontleend aan de gegevens die Onze Minister
      van Veiligheid en Justitie daarover tot zijn beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.74
  - number: 2.75.1
    text: De gegevens over het woonadres worden ontleend aan een opgave van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.75
  - number: 2.75.2
    text: Indien aannemelijk is dat een gegeven in de opgave onjuist is, wordt het gegeven niet aan de opgave ontleend.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.75
  - number: 2.75.3
    text: |-
      Als de ingeschrevene geen opgave heeft gedaan of aannemelijk is dat de opgave onjuiste gegevens bevat, kunnen de
      gegevens ambtshalve worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.75
  - number: '2.76'
    text: |-
      Omtrent de vaststelling dat een opgenomen algemeen gegeven onjuist is of, indien het een gegeven over de
      burgerlijke staat betreft, in strijd is met de Nederlandse openbare orde, omtrent een onderzoek naar die
      onjuistheid of strijdigheid, alsmede omtrent de omstandigheid dat de ingeschrevene geen ingezetene is, wordt een
      aantekening geplaatst bij de desbetreffende gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.76
  - number: '2.77'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de wijze waarop een verzoek als
      bedoeld in [artikel 2.68][ref1] en een opgave als bedoeld in [artikel 2.70, derde lid][ref2], worden gedaan en
      omtrent de informatie die daarbij wordt overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.77
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.78.1
    text: |-
      Een aangewezen bestuursorgaan doet alleen een opgave als bedoeld in [artikel 2.70, derde lid, onder a][ref1],
      voor zover het zelf de desbetreffende gegevens verwerkt in verband met de uitoefening van zijn taak. Als het
      bestuursorgaan bij die uitoefening de beschikking krijgt over gegevens over een ingeschrevene, die door middel
      van een dergelijke opgave kunnen leiden tot bijhouding van de basisregistratie, doet het bestuursorgaan opgave aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.78
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 2.78.2
    text: |-
      Indien bij een algemeen gegeven een aantekening is geplaatst omtrent een onderzoek naar de onjuistheid of
      strijdigheid met de openbare orde, bevordert een aangewezen bestuursorgaan de goede vaststelling van het gegeven,
      voor zover het bestuursorgaan zelf het gegeven verwerkt in verband met de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.78
  - number: 2.78.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de uitvoering van het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.78
  - number: 2.79.1
    text: |-
      De persoon die aan Onze Minister een verzoek als bedoeld in deze afdeling richt, doet dit door tussenkomst van
      een inschrijfvoorziening.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.79
  - number: 2.79.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening van een
      verzoek als bedoeld in het eerste lid en de informatie die daarbij wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.79
  - number: 2.79.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de door de verzoeker verschuldigde rechten wegens
      handelingen ter uitvoering van het verzoek. Rechten kunnen slechts worden geheven voor zover de handelingen niet
      kosteloos moeten worden verricht.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.79
  - number: '2.80'
    text: |-
      Indien Onze Minister in verband met het opnemen van gegevens in de basisregistratie over een persoon aan de
      betrokkene verzoekt om een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] met het
      oog op de vaststelling van diens identiteit, is de betrokkene verplicht een dergelijk op hem betrekking hebbend
      document over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.80
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 2.81.1
    text: |-
      Onze Minister stelt binnen vier weken na een inschrijving als bedoeld in [artikel 2.66][ref1] aan de ingeschrevene
      in begrijpelijke vorm een volledig overzicht ter beschikking van zijn persoonslijst.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.81
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '2'
  - number: 2.81.2
    text: |-
      Onze Minister vermeldt op schriftelijk verzoek van de betrokkene op zijn persoonslijst kosteloos een aantekening
      omtrent beperking van de verstrekking van gegevens aan derden. Onze Minister geeft binnen vier weken gevolg aan het
      verzoek en doet daarvan terstond schriftelijk mededeling aan de verzoeker, onder vermelding van de geldende regels
      ter zake.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.81
  - number: 2.81.3
    text: |-
      De [artikelen 2.54, tweede en derde lid][ref1], [2.55][ref2], [2.57][ref3], [2.58][ref4], [2.60][ref5] en
      [2.61][ref6] zijn van overeenkomstige toepassing ten aanzien van niet-ingezetenen met dien verstande dat Onze
      Minister in de plaats treedt van het college van burgemeester en wethouders en dat voor de toepassing van artikel
      2.60, onderdeel a, voor «aangifte» wordt gelezen: verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.81
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 2.81.4
    text: |-
      Een verzoek als bedoeld in [artikel 2.55][ref1] kan ook worden gericht aan het college van burgemeester en
      wethouders van enige gemeente in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel2.81
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.1.1
    text: Deze paragraaf is van toepassing op de systematische verstrekking van gegevens uit de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt geregeld welke verstrekkingen systematische verstrekkingen
      zijn en worden nadere regels gesteld over deze verstrekkingen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.1
  - number: 3.2.1
    text: |-
      Onze Minister verstrekt gegevens aan een overheidsorgaan, voor zover dit is bepaald in een besluit van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.2
    text: |-
      Onze Minister neemt het besluit op verzoek van het overheidsorgaan. Het verzoek bevat de gronden voor de
      verstrekking en de gegevens waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.3
    text: |-
      Bij de bepaling van de gegevens die worden verstrekt, worden de gegevens opgenomen die in het verzoek zijn vermeld
      voor zover het overheidsorgaan aantoont dat deze gegevens noodzakelijk zijn voor de goede vervulling van zijn taak.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.4
    text: |-
      Bij het besluit wordt in ieder geval bepaald over welke categorieën van personen gegevens worden verstrekt, welke
      gegevens het betreft en in welke gevallen gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.5
    text: |-
      Aan het besluit kunnen voorschriften en beperkingen worden verbonden in het belang van een zorgvuldige en
      doelmatige gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.6
    text: Onze Minister draagt zorg voor onverwijlde publicatie van het besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de indiening van het
      verzoek en de bekendmaking van het besluit.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.2.8
    text: |-
      Onze Minister kan een besluit als bedoeld in het eerste lid weigeren te nemen of het besluit intrekken, indien de
      gevraagde gegevensverstrekking zodanig is dat verstrekking op grond van [paragraaf 2][ref1] aangewezen is.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.2.9
    text: |-
      Indien een overheidsorgaan verschillende taken uitoefent waarvoor gegevens worden gevraagd, kan Onze Minister bij
      het besluit de verschillende taken in aanmerking nemen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.2
  - number: 3.3.1
    text: |-
      Bij algemene maatregel van bestuur worden door derden verrichte werkzaamheden met een gewichtig maatschappelijk
      belang aangewezen, ten behoeve waarvan gegevens uit de basisregistratie kunnen worden verstrekt. De
      maatregel bepaalt tevens de categorieën van derden die voor de verstrekking in aanmerking komen en bepaalt of
      [artikel 3.21][ref1] op de verstrekking van toepassing is. De maatregel kan beperkingen bevatten ten aanzien van de
      gegevens die kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.3.2
    text: |-
      Bij de maatregel worden slechts werkzaamheden aangewezen die samenhangen met een overheidstaak, strekken tot het in
      stand houden van een voorziening voor burgers die onderwerp is van overheidszorg, of waarbij anderszins gelet op de
      overheidsbemoeienis met die werkzaamheden, ondersteuning daarvan door gegevensverstrekking uit de basisregistratie
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.3
  - number: 3.3.3
    text: |-
      [Artikel 3.2][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.3.4
    text: |-
      Op een verstrekking als bedoeld in het eerste lid is [artikel 76 van de Wet bescherming persoonsgegevens][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel76
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '76'
  - number: 3.3.5
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.3
  - number: 3.4.1
    text: |-
      Deze paragraaf is van toepassing op de verstrekking van gegevens uit de basisregistratie, anders dan de
      systematische verstrekking, bedoeld in [paragraaf 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.4.2
    text: Krachtens deze paragraaf kunnen gegevens worden verstrekt over alle ingeschrevenen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.4
  - number: 3.5.1
    text: |-
      Het college van burgemeester en wethouders verstrekt op verzoek van een overheidsorgaan aan hem gegevens, voor
      zover deze gegevens noodzakelijk zijn voor de goede vervulling van zijn taak.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.5
  - number: 3.5.2
    text: Het verzoek bevat de gronden voor de verstrekking.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.5
  - number: 3.5.3
    text: |-
      Voor zover krachtens het bepaalde in deze paragraaf gegevens kunnen worden verstrekt, wordt op verzoek een
      gewaarmerkt afschrift van de in het verzoek aangewezen gegevens verstrekt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.5
  - number: 3.5.4
    text: |-
      Het college weigert het verzoek indien de gevraagde gegevensverstrekking zodanig is dat verstrekking op grond van
      [paragraaf 1][ref1] aangewezen is. Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent gevallen
      waarin het college het verzoek moet weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 3.6.1
    text: 'Het college van burgemeester en wethouders verstrekt op verzoek van een derde aan hem gegevens voor zover:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
  - number: 3.6.1.a
    text: het gebruik van die gegevens is voorgeschreven in een algemeen verbindend voorschrift,
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
  - number: 3.6.1.b
    text: de derde voorafgaande schriftelijke toestemming heeft van de ingeschrevene over wie gegevens worden verstrekt, of
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
  - number: 3.6.1.c
    text: de verstrekking in overeenstemming is met het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
  - number: 3.6.2
    text: |-
      Bij algemene maatregel van bestuur worden door derden verrichte werkzaamheden met een gewichtig maatschappelijk
      belang aangewezen, ten behoeve waarvan gegevens uit de basisregistratie kunnen worden verstrekt. De
      maatregel bepaalt tevens de categorieën van derden die voor de verstrekking in aanmerking komen en bepaalt of
      [artikel 3.21][ref1] op de verstrekking van toepassing is. De maatregel kan beperkingen bevatten ten aanzien van de
      gegevens die kunnen worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.6.3
    text: |-
      [Artikel 3.3, tweede en vierde lid][ref1], en [artikel 3.5, tweede, derde en vierde lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.6.4
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.6
  - number: 3.7.1
    text: |-
      Deze paragraaf is van toepassing op de verstrekking van gegevens uit de basisregistratie door het college van
      burgemeester en wethouders, anders dan de verstrekking, bedoeld in [paragraaf 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.7.2
    text: |-
      Krachtens deze paragraaf worden uitsluitend gegevens verstrekt over ingeschrevenen ten aanzien van wie het college
      op grond van [artikel 1.4][ref1] verantwoordelijk is voor de bijhouding van de persoonslijst.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 3.8.1
    text: |-
      Bij of krachtens gemeentelijke verordening kunnen regels gesteld worden omtrent de verstrekking van gegevens aan
      overheidsorganen die een orgaan zijn van de gemeente.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.8
  - number: 3.8.2
    text: |-
      Aan een overheidsorgaan worden slechts gegevens verstrekt voor zover deze gegevens noodzakelijk zijn voor de goede
      vervulling van zijn taak.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.8
  - number: 3.9.1
    text: |-
      Op verzoek van een derde kunnen aan hem gegevens worden verstrekt voor zover daarin is voorzien bij gemeentelijke
      verordening en voor zover:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.1.a
    text: de derde voorafgaande schriftelijke toestemming heeft van de ingeschrevene over wie gegevens worden verstrekt, of
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.1.b
    text: de verstrekking in overeenstemming is met het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.2
    text: |-
      Bij gemeentelijke verordening kunnen door derden verrichte werkzaamheden met een gewichtig maatschappelijk
      belang voor de gemeente worden aangewezen, ten behoeve waarvan gegevens uit de basisregistratie kunnen worden
      verstrekt. De verordening bepaalt tevens de categorieën van derden die voor de verstrekking in aanmerking
      komen. De verordening staat slechts verstrekking toe voor zover deze noodzakelijk is voor de behartiging van het
      gerechtvaardigde belang van de derde en het belang of de fundamentele rechten en vrijheden van de ingeschrevene
      niet aan de verstrekking in de weg staan.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.3
    text: |-
      Aan een overheidsorgaan van, dan wel een persoon of organisatie gevestigd in een land buiten de Europese Unie
      worden slechts gegevens verstrekt overeenkomstig het eerste lid, onderdeel b, indien een verdrag of een besluit van
      een volkenrechtelijke organisatie in de verstrekking van die gegevens voorziet.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.4
    text: |-
      De verstrekking kan uitsluitend betrekking hebben op algemene gegevens over de naam, het geslacht, de geslachtsnaam
      van de echtgenoot dan wel geregistreerde partner, de eerdere echtgenoot of eerdere geregistreerde partner, het
      gebruik door de ingeschrevene van de geslachtsnaam van de echtgenoot dan wel geregistreerde partner, de eerdere
      echtgenoot of eerdere geregistreerde partner, het adres, de bijhoudingsgemeente, de geboortedatum en de datum van
      overlijden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
  - number: 3.9.5
    text: |-
      [Artikel 3.3, tweede en vierde lid][ref1], en [artikel 3.5, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.10.1
    text: |-
      Voor zover een algemeen gegeven wordt verstrekt waarbij een aantekening is geplaatst als bedoeld in
      [artikel 2.26][ref1], [2.59][ref2], [2.76][ref3] of [2.81, tweede lid][ref4], wordt dat gegeven uitsluitend
      verstrekt onder mededeling van die aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.10.2
    text: |-
      De verstrekking van algemene gegevens die zijn opgenomen krachtens [artikel 2.70, tweede of derde lid][ref1],
      geschiedt met de mededeling van de bron waaruit de gegevens zijn verkregen, dan wel van de rechtsgrond krachtens
      welke de gegevens zijn opgenomen. Indien de gegevens zijn opgenomen krachtens artikel 2.70, derde lid, onder a,
      wordt tevens medegedeeld welk bestuursorgaan de opgave heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 3.11.1
    text: |-
      Het bestuursorgaan dat verantwoordelijk is voor de verstrekking van gegevens houdt gedurende twintig jaren volgend
      op de verstrekking aantekening van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.11
  - number: 3.11.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald van welke verstrekkingen geen aantekening wordt
      gehouden in verband met de veiligheid van de staat of de voorkoming, opsporing of vervolging van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.11
  - number: '3.12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan een regeling worden getroffen omtrent de verstrekking
      van algemene en administratieve gegevens aan een verantwoordelijke voor de verwerking van gegevens in een
      basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.12
  - number: 3.13.1
    text: |-
      Een andere verstrekking uit de basisregistratie dan die bedoeld in de [paragrafen 1][ref1], [2][ref2] of
      [3][ref3] of in [artikel 3.12][ref4] is slechts toegestaan voor zover daarin is voorzien bij algemene maatregel
      van bestuur en voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.13.1.a
    text: de verstrekking plaats vindt voor historische, statistische of wetenschappelijke doeleinden;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.13
  - number: 3.13.1.b
    text: de persoonlijke levenssfeer niet onevenredig wordt geschaad;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.13
  - number: 3.13.1.c
    text: |-
      door de ontvanger van de gegevens de nodige voorzieningen zijn getroffen ten einde te verzekeren dat de verdere
      verwerking uitsluitend geschiedt ten behoeve van de onder a genoemde doeleinden.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.13
  - number: 3.13.2
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kunnen nadere regels worden gesteld omtrent de
      verstrekking en de wijze waarop deze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.13
  - number: 3.14.1
    text: |-
      Onze Minister kan aan een overheidsorgaan of aan een derde informatie ter beschikking stellen die is verkregen
      door bewerking van gegevens uit de basisregistratie. Het betreft uitsluitend informatie die niet herleidbaar is tot
      gegevens betreffende een geïdentificeerde of identificeerbare ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.14
  - number: 3.14.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het ter beschikking
      stellen van informatie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.14
  - number: '3.15'
    text: |-
      Indien op grond van de [artikelen 2.55, derde lid][ref1], [3.5, derde lid][ref2], [3.6, derde lid][ref3], of
      [3.9, vijfde lid][ref4], een gewaarmerkt afschrift wordt verstrekt van gegevens ten aanzien van een vreemdeling
      op wiens persoonslijst geen actuele gegevens zijn opgenomen in verband met het verblijfsrecht, wordt hiervan
      mededeling gedaan op dat afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: '3.16'
    text: |-
      Een derde kan bij het verwerken van persoonsgegevens gebruik maken van het burgerservicenummer voor zover dit
      noodzakelijk is in verband met de juiste verstrekking van gegevens aan hem uit de basisregistratie.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.16
  - number: 3.17.1
    text: |-
      De verstrekking van gegevens op grond van de [artikelen 3.2][ref1], [3.3][ref2] en [3.13][ref3] geschiedt
      kosteloos, onverminderd het bepaalde in [artikel 1.14][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 3.17.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op het ter beschikking stellen van informatie, bedoeld in
      [artikel 3.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.17.3
    text: |-
      Andere verstrekkingen aan een overheidsorgaan en verstrekkingen op grond van [artikel 3.12][ref1] geschieden
      kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: '3.18'
    text: |-
      Een beslissing op grond van deze afdeling omtrent het verstrekken van gegevens of het ter beschikking stellen van
      informatie wordt gelijkgesteld met een besluit in de zin van de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 3.19.1
    text: |-
      Een verzoek als bedoeld in de [artikelen 3.22][ref1] en [3.23][ref2] kan worden gericht aan het college van
      burgemeester en wethouders van enige gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.19.2
    text: |-
      Het verzoek kan ook worden gericht aan Onze Minister. In dat geval treedt Onze Minister voor de toepassing van de
      [artikelen 3.22][ref1] en [3.23][ref2] in de plaats van het college en wordt het verzoek gedaan door tussenkomst
      van een inschrijfvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: '3.20'
    text: |-
      De verstrekking aan de betrokkene van hem betreffende gegevens geschiedt ingevolge [artikel 2.55][ref1] of
      ingevolge [artikel 2.81][ref2] in samenhang met artikel 2.55.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '2'
  - number: 3.21.1
    text: |-
      Indien op de persoonslijst een aantekening omtrent beperking van de verstrekking van gegevens aan derden is
      vermeld, worden geen gegevens van de persoonslijst verstrekt op grond van:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
  - number: 3.21.1.a
    text: |-
      de [artikelen 3.3][ref1] en [3.6][ref2], voor zover de beperking van de verstrekking van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.21.1.b
    text: |-
      [artikel 3.9][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '1'
  - number: 3.21.2
    text: |-
      In afwijking van het eerste lid verstrekt het college van burgemeester en wethouders gegevens op grond van
      [artikel 3.6, eerste lid, onderdelen a en c][ref1], indien de persoonlijke levenssfeer daardoor niet onevenredig
      wordt geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '1'
  - number: 3.21.3
    text: |-
      Het college maakt een beschikking, waarmee het toepassing geeft aan het tweede lid, terstond bekend aan de
      betrokkene. Het geeft geen uitvoering aan de beschikking binnen een bij die beschikking gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
  - number: 3.21.4
    text: |-
      [Artikel 2.55, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.21.5
    text: |-
      Het college neemt passende maatregelen om ten minste eens per jaar aan de ingezetenen het recht, bedoeld in het
      eerste lid, bekend te maken. De bekendmaking vindt plaats via één of meer dag-, nieuws-, of huis-aan-huisbladen of
      op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.21
  - number: 3.22.1
    text: |-
      Het college van burgemeester en wethouders deelt aan de betrokkene op diens verzoek kosteloos en schriftelijk
      binnen vier weken mede of hem betreffende gegevens gedurende twintig jaren voorafgaande aan het verzoek uit de
      basisregistratie zijn verstrekt aan een overheidsorgaan of een derde.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
  - number: 3.22.2
    text: |-
      Indien zodanige verstrekking is geschied, doet het college daarvan desgevraagd binnen vier weken na ontvangst
      van het verzoek kosteloos en schriftelijk mededeling aan verzoeker. Het college kan volstaan met een in algemene
      termen gestelde mededeling omtrent de verstrekking, tenzij het belang van de verzoeker daardoor onevenredig wordt
      geschaad.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
  - number: 3.22.3
    text: 'Het college voldoet niet aan het in het eerste en tweede lid bedoelde verzoek voor zover:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
  - number: 3.22.3.a
    text: |-
      van de verstrekking geen aantekening is gehouden krachtens [artikel 3.11, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '1'
  - number: 3.22.3.b
    text: |-
      dit noodzakelijk is in het belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van
      strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
  - number: 3.22.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan nader geregeld worden in welke gevallen toepassing gegeven moet
      worden aan het derde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
  - number: 3.22.5
    text: |-
      [Artikel 2.55, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.1
    text: |-
      Het college van burgemeester en wethouders doet op schriftelijk verzoek van de betrokkene, indien op grond van het
      verzoek, bedoeld in de [artikelen 2.57][ref1] en [2.58][ref2], een besluit als bedoeld in [artikel 2.60][ref3],
      dan wel de uitspraak van de rechter, bedoeld in [artikel 2.61][ref4], ten aanzien van hem gegevens zijn verbeterd,
      aangevuld of verwijderd, van de wijziging mededeling aan overheidsorganen en derden aan wie gedurende twintig jaren
      voorafgaand aan het verzoek en in de sedert dat verzoek verstreken tijd, de desbetreffende gegevens zijn verstrekt,
      tenzij dit onmogelijk blijkt of een onevenredige inspanning kost.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.2
    text: |-
      Het verzoek, bedoeld in het eerste lid, kan de betrokkene aan het college richten tot uiterlijk acht weken nadat
      hij van de wijziging kennis heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.23
  - number: 3.23.3
    text: |-
      Het college doet aan de verzoeker desgevraagd opgave van degenen aan wie de mededeling, bedoeld in het eerste lid,
      is gedaan. [Artikel 3.22, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        afdeling: '2'
  - number: 3.23.4
    text: |-
      [Artikel 2.55, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 3.23.5
    text: |-
      Dit artikel is van overeenkomstige toepassing indien gegevens ten aanzien van de betrokkene zijn verbeterd,
      aangevuld of verwijderd op grond van een verzoek ingevolge [artikel 2.81][ref1] in samenhang met de
      [artikelen 2.57][ref2], [2.58,][ref3][2.60][ref4] en [2.61][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: '3.24'
    text: |-
      Een beslissing op een verzoek als bedoeld in deze afdeling wordt gelijkgesteld met een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4.1.1
    text: |-
      Het College bescherming persoonsgegevens ziet in het belang van de bescherming van de persoonlijke levenssfeer toe
      op de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.1
  - number: 4.1.2
    text: |-
      De [artikelen 60][ref1], [61][ref2] en [65 van de Wet bescherming persoonsgegevens][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel65
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '65'
  - number: 4.1.3
    text: |-
      De [artikelen 124][ref1] en [268 van de Gemeentewet][ref2] blijven buiten toepassing ten aanzien van het toezicht
      op het college van burgemeester en wethouders inzake de uitvoering van de [hoofdstukken 2][ref3] en [3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '268'
      - id: ref3
        bwb_id: BWBR0033715
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0033715
        hoofdstuk: '3'
  - number: 4.1.4
    text: |-
      Het College wordt om advies gevraagd over voorstellen van wet tot wijziging van deze wet en ontwerpen van algemene
      maatregelen van bestuur op grond van deze wet die geheel of voor een belangrijk deel betrekking hebben op de
      verwerking van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.1
  - number: '4.2'
    text: |-
      Het college van burgemeester en wethouders wijst ambtenaren aan die zijn belast met het toezicht op de naleving van
      de verplichtingen van de burger ingevolge [hoofdstuk 2, afdeling 1, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '2'
        paragraaf: '5'
        afdeling: '1'
  - number: 4.3.1
    text: |-
      Het college van burgemeester en wethouders verricht periodiek een onderzoek naar de inrichting, de werking en de
      beveiliging van de basisregistratie, alsmede naar de verwerking van gegevens in de basisregistratie, voor zover het
      de gemeentelijke voorziening betreft of het college verantwoordelijk is voor de bijhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.3
  - number: 4.3.2
    text: |-
      Het college van burgemeester en wethouders zendt periodiek een uittreksel van de resultaten van het onderzoek aan
      het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.3
  - number: 4.3.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op Onze Minister met dien verstande dat het onderzoek
      betrekking heeft op de centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.3
  - number: 4.3.4
    text: |-
      Het college van burgemeester en wethouders zendt periodiek een uittreksel van de resultaten van het onderzoek aan
      Onze Minister ten behoeve van een landelijk beeld van de in het eerste lid bedoelde aspecten.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.3
  - number: 4.3.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de periodiciteit en
      de uitvoering van de onderzoeken, bedoeld in het eerste lid, en de periodiciteit van de in het tweede en vierde lid
      bedoelde verzendingen en de inhoud van de in die leden bedoelde uittreksels.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.3
  - number: 4.4.1
    text: |-
      Het college van burgemeester en wethouders is ten behoeve van de uitvoering van deze wet tot een bij koninklijk
      besluit te bepalen datum verantwoordelijk voor de verwerking van persoonsgegevens in het persoonsregister, bedoeld
      in het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
  - number: 4.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de in het eerste lid bedoelde
      verwerking van persoonsgegevens. Daarbij kan worden bepaald dat het persoonsregister op een andere wijze dan
      in de vorm van persoonskaarten, bedoeld in het Besluit bevolkingsboekhouding, kan worden aangehouden en kan de
      vernietiging van de persoonskaarten worden geregeld.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
  - number: 4.4.3
    text: 'Uit het persoonsregister worden geen andere gegevens verstrekt dan:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
  - number: 4.4.3.a
    text: |-
      gegevens als bedoeld in [artikel 2.7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: 4.4.3.b
    text: gegevens uit vak 23 van de persoonskaart.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
  - number: 4.4.4
    text: |-
      Op de verstrekking, bedoeld in het derde lid, is [hoofdstuk 3][ref1], met uitzondering van de
      [artikelen 3.1 tot en met 3.3][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.4.5
    text: |-
      De [artikelen 2.53, eerste lid][ref1], [2.55][ref2] en [2.57 tot en met 2.61][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
        afdeling: '1'
  - number: 4.5.1
    text: |-
      Onze Minister is ten behoeve van de uitvoering van deze wet tot een bij koninklijk besluit te bepalen datum
      verantwoordelijk voor de verwerking van persoonsgegevens in het persoonskaartenarchief en het schakelregister,
      bedoeld in het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.5
  - number: 4.5.2
    text: |-
      Onze Minister kan de verantwoordelijkheid voor de verwerking, bedoeld in het eerste lid, overdragen aan het college
      van burgemeester en wethouders van een gemeente. De overdracht geschiedt slechts na instemming van dat college.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.5
  - number: 4.5.3
    text: |-
      Ten aanzien van het persoonskaartenarchief is [artikel 4.4, tweede tot en met vijfde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.5.4
    text: |-
      Ten aanzien van het schakelregister is [artikel 4.4, tweede, vierde en vijfde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: '4.6'
    text: |-
      Onze Minister, of het in [artikel 4.5, tweede lid][ref1], bedoelde college van burgemeester en wethouders,
      verstrekt op verzoek van het college dat een persoon inschrijft van wie in het persoonskaartenarchief een
      persoonskaart is opgenomen, de gegevens die zijn vermeld op de desbetreffende persoonskaart. Deze gegevens blijven
      berusten bij het college waaraan ze zijn verstrekt, waarbij [artikel 4.4][ref2] van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
        afdeling: '2'
  - number: 4.7.1
    text: |-
      Er is een centraal archief van overledenen, bestaande uit de persoonskaarten, bedoeld in artikel 69, tweede lid,
      van het Besluit bevolkingsboekhouding.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.7
  - number: 4.7.2
    text: |-
      Onze Minister is verantwoordelijk voor de verwerking van persoonsgegevens in het centraal archief van overledenen,
      bedoeld in het eerste lid. Hij treft een regeling ter bescherming van de persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.7
  - number: 4.8.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent heffingen in verband met de
      verstrekking van gegevens uit de hierna genoemde registraties, voor zover Onze Minister verantwoordelijk is voor de
      verwerking van persoonsgegevens in deze registraties:
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.8
  - number: 4.8.1.a
    text: het persoonskaartenarchief;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.8
  - number: 4.8.1.b
    text: het schakelregister;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.8
  - number: 4.8.1.c
    text: het centraal archief van overledenen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.8
  - number: 4.8.2
    text: |-
      Op grond van de in het eerste lid bedoelde regels kunnen uitsluitend heffingen ingesteld worden in verband met de
      verstrekking van gegevens aan derden, anders dan de verstrekking overeenkomstig [artikel 3.3][ref1], en in verband
      met de verstrekking aan de betrokkene van hem betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '1'
  - number: 4.9.1
    text: |-
