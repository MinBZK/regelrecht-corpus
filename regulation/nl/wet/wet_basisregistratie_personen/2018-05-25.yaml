        bwb_id: BWBR0033715
        hoofdstuk: '3'
  - number: '1.6'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke van de algemene gegevens, bedoeld in de
      [artikelen 2.7][ref1] en [2.69][ref2], worden aangemerkt als authentieke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 1.7.1
    text: |-
      Het bestuursorgaan dat bij de vervulling van zijn taak informatie over een ingeschrevene nodig heeft die in de vorm
      van een authentiek gegeven beschikbaar is in de basisregistratie, gebruikt voor die informatie dat gegeven.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
  - number: 1.7.2
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
  - number: 1.7.2.a
    text: |-
      bij het gegeven een aantekening als bedoeld in [artikel 2.26][ref1] of [2.76][ref2] is geplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '2'
  - number: 1.7.2.b
    text: |-
      het bestuursorgaan ten aanzien van het gegeven een mededeling als bedoeld in [artikel 2.34, eerste lid][ref1],
      doet;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel2
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
        afdeling: '1'
  - number: 1.7.2.c
    text: bij wettelijk voorschrift anders is bepaald;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
  - number: 1.7.2.d
    text: |-
      een goede vervulling van de taak van het bestuursorgaan door de onverkorte toepassing van het eerste lid wordt
      belet.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.7
  - number: '1.8'
    text: |-
      Een ingeschrevene aan wie door een bestuursorgaan een gegeven wordt gevraagd, waarop
      [artikel 1.7, eerste lid][ref1], van toepassing is, behoeft dat gegeven niet mede te delen, behoudens voor zover
      het gegeven naar het oordeel van het bestuursorgaan noodzakelijk is voor een deugdelijke vaststelling van de
      identiteit van betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.9.1
    text: De basisregistratie bestaat uit gemeentelijke en centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.9
  - number: 1.9.2
    text: Het college van burgemeester en wethouders is verantwoordelijk voor de gemeentelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.9
  - number: 1.9.3
    text: Onze Minister is verantwoordelijk voor de centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.9
  - number: 1.9.4
    text: |-
      Onze Minister draagt zorg voor een stelsel van berichtuitwisseling ten behoeve van de bijhouding en de raadpleging
      van de basisregistratie en de systematische verstrekking van gegevens.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.9
  - number: 1.10.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.10
  - number: 1.10.1.a
    text: de technische en administratieve inrichting en werking en de beveiliging van de basisregistratie;
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.10
  - number: 1.10.1.b
    text: |-
      de uitwisseling van berichten tussen de centrale voorzieningen en de gemeentelijke voorzieningen en tussen de
      centrale voorzieningen en de overheidsorganen waaraan en derden aan wie systematisch gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.10
  - number: 1.10.2
    text: |-
      De in het eerste lid bedoelde regels omvatten mede eisen omtrent de deugdelijke uitvoering van werkzaamheden, de
      beveiliging van gegevens en de bescherming van de persoonlijke levenssfeer, die een bewerker in acht moet nemen
      als hij in opdracht van het college van burgemeester en wethouders technische of administratieve werkzaamheden
      verricht.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.10
  - number: 1.11.1
    text: |-
      Het college van burgemeester en wethouders draagt zorg dat de gemeentelijke voorziening functioneert overeenkomstig
      de regels, bedoeld in [artikel 1.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.11.2
    text: |-
      Onze Minister draagt zorg dat de centrale voorzieningen functioneren overeenkomstig de regels, bedoeld in
      [artikel 1.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.11.3
    text: |-
      Het overheidsorgaan waaraan of de derde aan wie systematisch gegevens worden verstrekt draagt zorg dat de
      uitwisseling van berichten in verband met de systematische verstrekking van gegevens van zijn kant geschiedt
      overeenkomstig de regels, bedoeld in [artikel 1.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.12.1
    text: |-
      Onze Minister kan een onderzoek verrichten om vast te stellen of een overheidsorgaan waaraan systematisch gegevens
      worden verstrekt, voldoet aan de regels, bedoeld in [artikel 1.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: 1.12.2
    text: |-
      Het eerste lid is niet van toepassing op organen van gemeenten, provincies of gemeenschappelijke regelingen waaraan
      zij deelnemen.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.12
  - number: 1.12.3
    text: |-
      Bij regeling van Onze Minister kan worden bepaald op welke wijze het overheidsorgaan medewerking verleent aan het
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.12
  - number: 1.12.4
    text: |-
      Het eerste en derde lid zijn van overeenkomstige toepassing op een derde aan wie systematisch gegevens worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.12
  - number: '1.13'
    text: |-
      De [artikelen 49][ref1] en [50 van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel50
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel1.13
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '50'
  - number: 1.14.1
    text: |-
      De gemeenten en de overheidsorganen waaraan en derden aan wie op grond van [artikel 3.2][ref1], [3.3][ref2],
      [3.13][ref3] of [3.14][ref4] gegevens worden verstrekt of informatie ter beschikking wordt gesteld, dragen bij in
      de kosten in verband met de uitvoering van deze wet. Indien een van deze betrokkenen geen rechtspersoonlijkheid
      bezit, komt de bijdrage ten laste van de rechtspersoon waartoe de betrokkene behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0033715#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0033715#Artikel3
