        bwb_id: BWBR0033715
        hoofdstuk: '2'
        afdeling: '1'
  - number: 1.4.2
    text: |-
      Onze Minister is verantwoordelijk voor het bijhouden van persoonsgegevens in de basisregistratie overeenkomstig
      [afdeling 2 van hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Hoofdstuk2
