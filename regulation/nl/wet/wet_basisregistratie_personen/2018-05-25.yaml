  - number: 4.15.1
    text: |-
      Een college van burgemeester en wethouders geeft uitvoering aan deze wet met behulp van de gemeentelijke
      voorziening waarmee uitvoering werd gegeven aan de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1]
      (de oude gemeentelijke voorziening) of met de gemeentelijke voorziening die is toegesneden op de basisregistratie
      personen (de nieuwe gemeentelijke voorziening).


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0033715/2018-05-25#Artikel4.15
    references:
