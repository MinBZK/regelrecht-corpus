preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de eigen verantwoordelijkheid ten behoeve van deelname
    aan het arbeidsproces en maatschappelijke activiteiten aan te scherpen, om het belang van scholing als essentieel
    element voor een goede uitgangspositie op de arbeidsmarkt te benadrukken en bij te dragen aan een versterking van
    de balans tussen rechten en plichten;

    Zo is het, dat Wij, de Afdeling advisering Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0030997/2012-07-01#ArtikelAanhef
