  - number: '20'
    text: |-
      1 De minister draagt er zorg voor dat dierfysiotherapeuten, embryotransplanteurs en dierenartsassistenten
      die werkzaam zijn op het gebied van de diergeneeskunde worden ingeschreven in een register van praktiserende
      dierfysiotherapeuten, embryotransplanteurs, onderscheidenlijk dierenartsassistenten.

      2 Inschrijving vindt niet plaats zolang de betrokkene krachtens een onherroepelijk geworden rechterlijke
      of tuchtrechtelijke beslissing de bevoegdheid tot de uitoefening van het beroep dierfysiotherapeut,
      embryotransplanteur dan wel dierenartsassistent mist.

      3 Een inschrijving wordt doorgehaald indien de betrokkene in de in het tweede lid genoemde omstandigheid is komen
      te verkeren dan wel anderszins is opgehouden werkzaam te zijn als dierfysiotherapeut, embryotransplaneur dan wel
      dierenartsassistent.

      4 Aan een ieder die zulks verlangt, wordt medegedeeld:

      a. of een persoon in het register, bedoeld in het eerste lid, ingeschreven staat;

      b. indien een persoon in het register, bedoeld in het eerste lid, ingeschreven staat:

      (i) achternaam en initialen;

      (ii) geslacht;

      (iii) beroepsgroep;

      (iv) adres onderscheidenlijk adressen waar de praktijk wordt uitgeoefend, met inbegrip van postcode en plaatsnaam
      onderscheidenlijk postcodes en plaatsnamen.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel20
  - number: '21'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant, waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel21
  - number: '22'
    text: |-
      Deze regeling kan worden aangehaald als: Regeling paraveterinairen.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel22
