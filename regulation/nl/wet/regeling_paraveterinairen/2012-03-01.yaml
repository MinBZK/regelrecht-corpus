preamble:
  text: |-
    Gelet op de artikelen 4, 8 en 11 van het Besluit paraveterinairen;

    Gezien de adviezen van het Landbouwschap en de Nederlandse Vereniging voor Fysiotherapie bij Dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *besluit:* [Besluit paraveterinairen][ref1];

      b. *aangewezen opleiding:* op grond van [artikel 2, onderdeel b, van het besluit][ref2] aangewezen opleiding;

      c. *examen:* examen bedoeld in [artikel 2, onderdeel c, van het besluit][ref3];

      d. *kandidaat:* degene die een examen gaat afleggen, aflegt of heeft afgelegd;

      e. *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;

      f. *bevoegd gezag:* bestuur van de onderwijsinstelling;

      g. *leerplan fysiotherapie bij dieren:* leerplan, neergelegd in [bijlage I][ref4] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005210
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005210#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0006492
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005210
      - id: ref2
        bwb_id: BWBR0005210
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005210
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0006492
  - number: '2'
    text: |-
      Als opleiding bedoeld in [artikel 2, onderdeel b, van het besluit][ref1] wordt aangewezen iedere opleiding die
      tenminste uitvoering geeft aan het leerplan fysiotherapie bij dieren bedoeld in de bij dit besluit behorende
      [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006492
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006492
  - number: '3'
    text: |-
      1 Het bevoegd gezag van de aangewezen opleiding stelt een examencommissie in die is belast met het afnemen van het
      examen, bedoeld in [artikel 2, onderdeel c, van het besluit][ref1], en het vaststellen van de uitslag daarvan.

      2 De examencommissie draagt zorg voor de organisatie van het examen en voor de goede gang van zaken tijdens het
      examen. De examencommissie bepaalt de data en tijdstippen voor het afleggen van de examenonderdelen, en maakt deze
      aan de kandidaten bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel2
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '2'
  - number: '4'
    text: |-
      1 De examencommissie bestaat uit:

      a. de directeur van de aangewezen opleiding;

      b. de door het bevoegd gezag, na overleg met de directie, aan te wijzen docenten, die belast zijn met de verzorging
      van het onderwijs in de dierfysiotherapeutische vakken, en

      c. een stagebegeleider.

      2 Het bevoegd gezag van de aangewezen opleiding benoemt de voorzitter van de examencommissie.

      3 De examencommissie wijst examinatoren aan die zijn belast met het afnemen van de examenonderdelen.

      4 De examencommissie besluit bij meerderheid van stemmen. Bij het staken der stemmen geeft de stem van de
      voorzitter de doorslag.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag kan één of meer niet aan de school verbonden deskundigen benoemen, die mede het examen afnemen.

      2 De benoeming, bedoeld in het eerste lid, geldt voor een bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel5
  - number: '6'
    text: |-
      1 Ten behoeve van het examen kan de minister gecommitteerden aanwijzen.

      2 Gecommitteerden hebben tot taak zich een oordeel te vormen over het niveau van het examen, de gang van zaken
      tijdens het examen en de naleving van de bij deze regeling gegeven voorschriften.

      3 Gecommitteerden zijn bevoegd het afnemen van examenonderdelen bij te wonen en kennis te nemen van het
      schriftelijk werk van de kandidaten

      4 De leden van de examencommissie, het bevoegd gezag van de aangewezen opleiding en de deskundigen, bedoeld in
      [artikel 5][ref1], verschaffen de gecommitteerden de inlichtingen die zij voor het uitoefenen van hun taak nodig
      hebben.

      5 De gecommitteerden brengen de minister verslag uit van hun bevindingen. Een afschrift van het verslag wordt
      toegezonden aan het bevoegd gezag van de aangewezen opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006492#Artikel5
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006492
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7'
    text: |-
      Het examen, bedoeld in [artikel 2, onderdeel c, van het besluit][ref1], omvat de volgende onderdelen:

      a. onderzoek en behandeling van pathologische afwijkingen bij een paard, en

      b. onderzoek en behandeling van pathologische afwijkingen bij een hond.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel2
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '2'
  - number: '8'
    text: |-
      Tot het examen, genoemd in [artikel 7][ref1], wordt toegelaten hij die voldaan heeft aan de eisen gesteld in het
      leerplan fysiotherapie bij dieren van de aangewezen opleiding voor fysiotyherapie bij dieren en wiens stage op
      grond van [artikel 9][ref2] met goed of voldoende is beoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006492#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006492#Artikel9
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006492
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006492
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De stage wordt beoordeeld door de stagebegeleider van de kandidaat. De stagebegeleider drukt zijn beoordeling van
      kennis, vaardigheid, beroepshouding en inzicht van de kandidaat uit in een van de volgende predikaten:

        - goed;
        - voldoende;
        - onvoldoende.

      2 Ieder examenonderdeel wordt door tenminste twee examinatoren beoordeeld. Deze examinatoren drukken hun
      beoordeling van kennis, vaardigheid, beroepshouding en inzicht van de kandidaat in het examenonderdeel
      onafhankelijk van elkaar uit in een cijfer van 1 tot en met 10, uitgedrukt in gehele cijfers.

      3 Aan de cijfers, bedoeld in het tweede lid, dient de volgende betekenis te worden toegekend:




                1:

              zeer slecht;



                2:

              slecht;



                3:

              zeer onvoldoende;



                4:

              onvoldoende;



                5:

              bijna voldoende;



                6:

              voldoende;



                7:

              ruim voldoende;



                8:

              goed;



                9:

              zeer goed;



                10:

              uitmuntend.



      4 De eindcijfers van de examenonderdelen worden door de examinatoren in onderling overleg vastgesteld. Indien de
      examinatoren niet tot overeenstemming kunnen komen, beslist de voorzitter van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel9
  - number: '10'
    text: |-
      Nadat de uitslag van alle examenonderdelen is vastgesteld, wordt de uitslag van het examen vastgesteld door de
      examencommissie.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel10
  - number: '11'
    text: |-
      1 Een kandidaat is geslaagd indien:

      a. de stage met het predikaat ‘goed’ of ‘voldoende’ is beoordeeld, en,

      b. de examenonderdelen, genoemd in [artikel 7][ref1], met het cijfer 6 of een hoger cijfer zijn beoordeeld.

      2 Een kandidaat heeft recht op een herexamen indien één van de examenonderdelen, genoemd in [artikel 7][ref2], met
      een vijf en het andere examenonderdeel met het cijfer 6 of hoger is beoordeeld.

      3 In alle andere gevallen is de kandidaat gezakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006492#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006492#Artikel7
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006492
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006492
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12'
    text: |-
      De examencommissie deelt de kandidaat zo spoedig mogelijk, doch uiterlijk binnen vier weken nadat het laatste
      examenonderdeel is afgelegd, de uitslag van het examen mee.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel12
  - number: '13'
    text: |-
      1 Het schriftelijk werk wordt gedurende een jaar na afloop van het laatste examenonderdeel ter inzage voor de
      kandidaat door de examencommissie bewaard.

      2 Na afloop van de in het eerste lid genoemde termijn kan het schriftelijk werk worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel13
  - number: '14'
    text: |-
      De [artikelen 7.60 tot en met 7.63 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.60
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.60'
  - number: '15'
    text: |-
      De kwalificaties, dan wel de combinatie van deelkwalificaties als genoemd in [artikel 6 van het besluit][ref1],
      omvatten tenminste:

      1. voor zover het betreft het overzetten van embryo's, de volgende deelkwalificaties:

      a. Verzorgen kunstmatige inseminatie;

      b. Verzorgen spermawinning;

      c. Adviseren vruchtbaarheid en voortplanting, en

      d. Verzorgen embryotransplantatie.

      2. voor zover het betreft het winnen van embryo's, de volgende deelkwalificaties:

      a. Verzorgen kunstmatige inseminatie;

      b. Verzorgen spermawinning;

      c. Adviseren vruchtbaarheid en voortplanting;

      d. Verzorgen embryotransplantatie, en

      e. Verzorgen embryo-/ eicelwinning.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel6
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '6'
  - number: '16'
    text: |-
      Tot het examen voor het transplanteren van embryo's, genoemd in [artikel 15][ref1], wordt toegelaten hij die ten
      genoege van de examencommissie, bedoeld in [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref2], aantoont
      tenminste 3000 eerste inseminaties bij runderen te hebben uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006492#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.5
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006492
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 7.4.5
  - number: '17'
    text: |-
      1 Tot het examen voor het winnen van embryo's, genoemd in [artikel 15][ref1], wordt toegelaten hij die ten genoege
      van de examencommissie, bedoeld in [artikel 7.4.5 van de Wet educatie en beroepsonderwijs][ref2], aantoont dat hij:

      a. geslaagd is voor het examen voor het transplanteren van embryo's, genoemd in [artikel 16][ref3];

      b. tenminste een jaar als embryotransplanteur heeft gewerkt, en

      c. tenminste 1000 embryo's heeft getransplanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006492#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.5
      [ref3]: https://wetten.overheid.nl/BWBR0006492#Artikel16
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006492
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 7.4.5
      - id: ref3
        bwb_id: BWBR0006492
        artikel: '16'
        hoofdstuk: III
  - number: '18'
    text: |-
      De kwalificatie, dan wel de combinatie van deelkwalificaties als genoemd in
      [artikel 9, eerste lid, van het besluit][ref1], omvat tenminste:

      a. Voeren (gezelschaps)dieren;

      b. Verzorgen (gezelschaps)dieren;

      c. Begeleiden voortplanting (gezelschaps)dieren;

      d. Nemen van hygiënische maatregelen;

      e. Anatomie/Fysiologie/Pathologie;

      f. Instrumentenleer/Desinfectie/Pathologie;

      g. Algemene assistentie en ziekenverzorging;

      h. Zoötechniek en gezondheidsleer;

      i. Laboratoriumwerkzaamheden;

      j Radiologie;

      k. Eerste hulp (paraveterinair);

      l. Algemene en plaatselijke verdoving, en

      m. Beheren medicijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel9
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005210
        artikel: '9'
  - number: '19'
    text: |-
      1 Een verzoek om toelating als bedoeld in [artikel 14, eerste lid, van het besluit][ref1], wordt gedaan door het
      indienen van een volledig en naar waarheid ingevuld formulier dat daartoe door het CIBG beschikbaar gesteld wordt.

      2 De aanvraag wordt ingediend bij het Centraal Informatiepunt Beroepen Gezondheidszorg.

      3 Het formulier dient vergezeld te gaan van bewijsstukken waaruit blijkt dat degene die om toelating verzoekt,
      is toegelaten tot de uitoefening der diergeneeskunde, bedoeld in de [artikelen 2][ref2], [5][ref3], [9][ref4],
      [13][ref5] en [13a van het besluit][ref6].

      4 Door middel van het in het eerste lid bedoelde formulier worden in ieder geval de volgende gegevens verstrekt:

      a. naam en voornamen;

      b. geslacht;

      c. geboortedatum en geboorteplaats;

      d. nationaliteit;

      e. burgerservicenummer;

      f. adres onderscheidenlijk adressen waar de praktijk wordt uitgeoefend, met inbegrip van postcode en plaatsnaam
      onderscheidenlijk postcodes en plaatsnamen;

      g. woonadres, met inbegrip van postcode en woonplaats;

      h. e-mailadres;

      i. beroepsgroep;

      j. gegevens betreffende de bevoegdheid;

      k. gegevens betreffende de beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0005210#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005210#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005210#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005210#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005210#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0005210#Artikel13a
    url: https://wetten.overheid.nl/BWBR0006492/2012-03-01#Artikel19
