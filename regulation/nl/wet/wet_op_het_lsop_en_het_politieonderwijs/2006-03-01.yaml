---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_lsop_en_het_politieonderwijs
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2006-03-01'
bwb_id: BWBR0014623
url: https://wetten.overheid.nl/BWBR0014623/2006-03-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een Wet op het LSOP en het politieonderwijs vast
    te stellen ter vervanging van de LSOP-wet in verband met de evaluatie van de LSOP-wet, de aanpassing aan de
    Aanwijzingen voor de regelgeving inzake de zelfstandige bestuursorganen, de concentratie van beheersbevoegdheden
    op rijksniveau met betrekking tot de regionale politiekorpsen bij Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties, de wijziging van de bestuursstructuur en het financieringsstelsel van het LSOP, alsmede de
    vernieuwing van het politieonderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: 1.a
    text: 'LSOP: het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum;'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: 1.c
    text: |-
      initiële opleidingen: de door Onze Minister in overeenstemming met Onze Minister van Justitie aangewezen
      opleidingen voor ambtenaren van politie, gericht op de voorbereiding van de uitoefening van algemene politietaken,
      waarvoor in het kader van de landelijke kwalificatiestructuur, bedoeld in [artikel 14][ref1], competentiegerichte
      eindtermen zijn vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel14
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '14'
        hoofdstuk: V
  - number: 1.d
    text: |-
      postinitiële opleidingen: de door Onze Minister, en voor zover het vervolgopleidingen betreft op het terrein van
      de strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van justitie de door Onze Minister
      in overeenstemming met Onze Minister van Justitie, aangewezen opleidingen voor ambtenaren van politie of andere
      door Onze Minister in overeenstemming met Onze Minister van Justitie aan te wijzen categorieën van personen,
      gericht op de voorbereiding van de uitoefening van specialistische en leidinggevende politietaken, waarvoor in het
      kader van de landelijke kwalificatiestructuur, bedoeld in [artikel 14][ref1], competentiegerichte eindtermen zijn
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel14
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '14'
        hoofdstuk: V
  - number: 1.e
    text: |-
      college van bestuur: het college van bestuur, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel5
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '5'
        hoofdstuk: III
  - number: 1.f
    text: |-
      raad van toezicht: de raad van toezicht, bedoeld in [artikel 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel7
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '7'
        hoofdstuk: III
  - number: 1.g
    text: |-
      praktisch opleidingsdeel: de periode of perioden waarin de studenten de politietaak bij een regionaal politiekorps
      of bij het Korps landelijke politiediensten uitoefenen in het kader van de initiële en postinitiële opleidingen;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: 1.h
    text: |-
      politieonderwijsraad: het advies- en afstemmingsorgaan, bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel19
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '19'
        hoofdstuk: V
  - number: 1.i
    text: |-
      competentiegerichte eindtermen: als zodanig omschreven kwaliteiten op het gebied van kennis, inzicht, vaardigheden,
      houding en ervaring waarover degene die de opleiding voltooit, met het oog op het maatschappelijk en beroepsmatig
      functioneren dient te beschikken, en die in voorkomende gevallen betekenis hebben voor de doorstroming naar
      vervolgonderwijs;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: 1.j
    text: |-
      deelkwalificatie: een combinatie van competentiegerichte eindtermen, vastgesteld voor een initiële of postinitiële
      opleiding, die in het licht van de uitoefening van de politietaak waarop de opleiding is gericht een zelfstandige
      betekenis heeft.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum, belast met de in
      [artikel 3, eerste lid][ref1], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '2.2'
    text: Het LSOP bezit rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel2
  - number: '3.1'
    text: 'Het LSOP heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.a
    text: |-
      het ondersteunen van de landelijke werving en het uitvoeren van de selectie van de studenten voor de initiële
      opleidingen;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.b
    text: het ontwikkelen en het verzorgen van de initiële opleidingen;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.c
    text: het ontwikkelen en het verzorgen van de postinitiële opleidingen;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.d
    text: het examineren van de studenten die de initiële en postinitiële opleidingen hebben gevolgd;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.e
    text: |-
      het overdragen van kennis aan de Nederlandse politie en het bijdragen aan de ontwikkeling van de uitoefening van de
      politietaak waarop het onderwijs is gericht, onder meer door het verrichten van onderzoek, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.1.f
    text: |-
      het ontwikkelen of het verzorgen van andere dan de in het eerste lid, onderdelen b en c, bedoelde opleidingen van
      een door Onze Minister of Onze Minister van Justitie na overleg met Onze andere Minister aan te wijzen categorie
      van personen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: '3.2'
    text: |-
      Het LSOP kan andere werkzaamheden uitvoeren, dan die welke rechtstreeks voortvloeien uit de in het eerste lid
      bedoelde taken, mits die werkzaamheden:
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.2.a
    text: samenhangen met de in het eerste lid bedoelde taken;
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.2.b
    text: niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: 3.2.c
    text: tegen ten minste kostendekkende prijzen worden verricht.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: '3.3'
    text: |-
      Bij regeling van Onze Minister worden nadere regels over de uit te voeren andere werkzaamheden, bedoeld in het
      tweede lid, gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel3
  - number: '4'
    text: De organen van het LSOP zijn het college van bestuur en de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel4
  - number: '5.1'
    text: |-
      Het college van bestuur is belast met het bestuur en het beheer van het LSOP. Daartoe oefent het college van
      bestuur de taken en bevoegdheden uit die niet zijn voorbehouden aan de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '5.2'
    text: Het college van bestuur vertegenwoordigt het LSOP in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '5.3'
    text: 'Het college van bestuur stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: 5.3.a
    text: de werkwijze van het college van bestuur,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: 5.3.b
    text: de samenstelling en de werkwijze van de leiding van de instellingen en vestigingen van het LSOP,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: 5.3.c
    text: |-
      de wijze waarop het college van bestuur de uitoefening van zijn taken en bevoegdheden afstemt met die van de raad
      van toezicht, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: 5.3.d
    text: |-
      de wijze waarop de leden van het college van bestuur en van de raad van toezicht het voornemen tot het aanvaarden
      van een nevenfunctie anders dan uit hoofde van hun functie aan Onze Minister melden.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '5.4'
    text: |-
      Het bestuursreglement, alsmede de wijzigingen daarvan behoeven de instemming van Onze Minister. Het college van
      bestuur legt daartoe het bestuursreglement en een document waaruit de opvatting van de raad van toezicht hierover
      blijkt, voor aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '5.5'
    text: Het bestuursreglement, alsmede de wijzigingen daarvan worden bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '5.6'
    text: |-
      Het college van bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde
      inlichtingen en andere gegevens.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel5
  - number: '6.1'
    text: Het college van bestuur bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel6
  - number: '6.2'
    text: |-
      De leden worden benoemd, herbenoemd, geschorst en ontslagen bij koninklijk besluit, op voordracht van Onze Minister
      in overeenstemming met Onze Minister van Justitie. Een voordracht wordt niet gedaan dan nadat de raad van toezicht
      in de gelegenheid is gesteld zijn zienswijze hierover kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel6
  - number: '6.3'
    text: |-
      Bij de samenstelling van het college van bestuur wordt ervoor zorg gedragen dat ten minste één lid ambtenaar is als
      bedoeld in [artikel 3, eerste lid, onderdeel a, van de Politiewet 1993][ref1], en dat onderwijskundige expertise
      wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '3'
  - number: '6.4'
    text: De leden worden benoemd voor een periode van zes jaar. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel6
  - number: '6.5'
    text: |-
      Zolang in een vacature van het college van bestuur niet is voorzien, vormen de overblijvende leden het college,
      met de bevoegdheid van het voltallige college, met dien verstande dat rechtsgeldige besluiten slechts kunnen worden
      genomen door ten minste twee leden.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel6
  - number: '7.1'
    text: 'De raad van toezicht is belast met:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: 7.1.a
    text: het bewaken van de doelstelling en de strategie van het LSOP, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: 7.1.b
    text: het toezien op de taakuitoefening door het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: '7.2'
    text: |-
      Onverminderd [artikel 26][ref1], behoeven de volgende besluiten van het college van bestuur de instemming van de
      raad van toezicht:


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel26
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '26'
        hoofdstuk: VI
  - number: 7.2.a
    text: |-
      besluiten inzake fusie, splitsing, reorganisatie, sluiting of opheffing van instellingen of vestigingen van het
      LSOP, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: 7.2.b
    text: besluiten inzake het aankopen, bezwaren of vervreemden van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: '7.3'
    text: |-
      De raad van toezicht geeft gevraagd en ongevraagd het college van bestuur zijn zienswijze over de taakuitoefening
      door het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel7
  - number: '8.1'
    text: De raad van toezicht bestaat uit ten minste vijf en ten hoogste zeven leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '8.2'
    text: De functie van lid van de raad van toezicht is niet verenigbaar met de functie van lid van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '8.3'
    text: |-
      In de raad van toezicht worden geen ambtenaren benoemd voor wie Onze Minister of Onze Minister van Justitie het
      bevoegd gezag is.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '8.4'
    text: |-
      De raad van toezicht stelt regels vast omtrent zijn werkwijze. Deze regels behoeven de instemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '8.5'
    text: Het college van bestuur draagt zorg voor de ondersteuning van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister kent de leden van de raad van toezicht, ten laste van het LSOP, een vergoeding toe voor hun
      werkzaamheden. De leden hebben aanspraak op vergoeding door het LSOP van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel8
  - number: '9.1'
    text: |-
      De leden van de raad van toezicht worden benoemd, herbenoemd, geschorst en ontslagen bij koninklijk besluit, op
      voordracht van Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel9
  - number: '9.2'
    text: De leden worden benoemd voor een periode van vier jaar. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel9
  - number: '9.3'
    text: |-
      Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad, met de
      bevoegdheid van de voltallige raad.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel9
  - number: '10.1'
    text: 'Tot het personeel van het LSOP worden in ieder geval gerekend:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: 10.1.a
    text: de leden van het college van bestuur,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: 10.1.b
    text: de ambtenaren in dienst van het LSOP, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: 10.1.c
    text: de bij het LSOP anders dan met het oog op het ontvangen van onderwijs gedetacheerde ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: '10.2'
    text: |-
      Het personeel van het LSOP, bedoeld in het eerste lid, onderdeel b, wordt benoemd, geschorst en ontslagen door het
      college van bestuur, voor zover bij of krachtens deze wet niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: '10.3'
    text: |-
      Bij algemene maatregel van bestuur op voordracht van Onze Minister kunnen ambtenaren, bedoeld in het eerste lid,
      onderdeel b, worden aangewezen, die worden benoemd, geschorst en ontslagen bij koninklijk besluit op voordracht van
      Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: '10.4'
    text: |-
      Ambtenaren van politie, bedoeld in het eerste lid, onderdeel c, worden door de korpsbeheerder van het regionale
      politiekorps of van het Korps landelijke politiediensten op verzoek van het college van bestuur bij het LSOP
      gedetacheerd. Bijzondere ambtenaren van politie worden door Onze Minister van Justitie op verzoek van het college
      van bestuur bij het LSOP gedetacheerd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
  - number: '10.5'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, zijn de bij of krachtens artikel
      [50, eerste lid, van de Politiewet 1993][ref1] gestelde regels van overeenkomstige toepassing op het personeel
      van het LSOP. Bij of krachtens algemene maatregel van bestuur kunnen op voordracht van Onze Minister nadere
      regels worden gegeven, indien dit in verband met enige andere bepaling uit deze wet is vereist. De Wet
      veiligheidsonderzoeken is van overeenkomstige toepassing op het personeel van het LSOP.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
  - number: '10.6'
    text: |-
      [Artikel 50, derde lid, van de Politiewet 1993][ref1] is van overeenkomstige toepassing op het personeel van het
      LSOP.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
  - number: '10.7'
    text: |-
      [Artikel 50, vierde lid, van de Politiewet 1993][ref1] is van overeenkomstige toepassing op het LSOP.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel50
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '50'
  - number: '11'
    text: |-
      Het politieonderwijs is gericht op de verwerving van kennis, inzicht, vaardigheden, houding en ervaring, nodig voor
      de uitoefening van de politietaak. Het politieonderwijs bevordert tevens de algemene vorming en de persoonlijke
      ontplooiing van de studenten en draagt bij tot hun maatschappelijk functioneren.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel11
  - number: '12'
    text: |-
      Het politieonderwijs draagt bij aan de ontwikkeling van de studenten met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel12
  - number: '13.1'
    text: |-
      Het LSOP biedt in samenwerking met de politiekorpsen, met de regionale opleidingencentra, bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1], en met de instellingen voor hoger onderwijs, bedoeld
      in [artikel 1.1 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], het onderwijs aan in de
      vorm van initiële en postinitiële opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '13.2'
    text: |-
      De niveaus waarop de initiële opleidingen, genoemd in de onderdelen a tot en met c van het derde
      lid, zich richten, komen overeen met de opeenvolgende niveaus van beroepsuitoefening, als bedoeld in
      [artikel 7.2.2. van de Wet educatie en beroepsonderwijs][ref1]. De niveaus waarop de initiële opleidingen, genoemd
      in de onderdelen d en e van het derde lid, zich richten, komen overeen met de niveaus van de opleidingen die op
      grond van [artikel 7:21 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] recht geven op het
      voeren van de titels bachelor respectievelijk master.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '13.3'
    text: 'De initiële opleidingen richten zich op de volgende niveaus waarop de politietaak kan worden uitgeoefend:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.3.a
    text: assistent politiemedewerker (niveau 2),
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.3.b
    text: politiemedewerker (niveau 3),
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.3.c
    text: allround politiemedewerker (niveau 4),
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.3.d
    text: politiekundige (niveau 5),
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.3.e
    text: politiekundige (niveau 6).
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.4'
    text: |-
      Aan de initiële opleidingen kunnen ten behoeve van individuele studenten voorbereidende of ondersteunende
      activiteiten worden toegevoegd ter bevordering van de toelating tot en het met gunstig gevolg voltooien van de
      opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en ondersteunende activiteiten
      zijn bestemd voor studenten wier vooropleiding naar het oordeel van het college van bestuur zonder deze
      activiteiten onvoldoende uitzicht biedt op het voldoen aan de competentiegerichte eindtermen binnen redelijke tijd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.5'
    text: |-
      Het college van bestuur is belast met de beoordeling van eerder verworven kwaliteiten op het gebied van kennis,
      inzicht, vaardigheden, houding en ervaring, al dan niet blijkend uit eerder behaalde kwalificaties, met het oog op
      het verlenen van vrijstellingen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.6'
    text: |-
      De studielast van de initiële opleidingen bedraagt voor de onderscheiden in het derde lid, onderdelen a tot en met
      e, bedoelde initiële opleidingen ten minste:
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.6.a
    text: 2400 studiebelastinguren,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.6.b
    text: 4800 studiebelastinguren,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.6.c
    text: 6400 studiebelastinguren,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.6.d
    text: 6720 studiebelastinguren, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: 13.6.e
    text: 6720 studiebelastinguren.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.7'
    text: Van elke opleiding maakt een praktisch opleidingsdeel deel uit.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.8'
    text: |-
      Het praktische opleidingsdeel bedraagt voor de initiële opleidingen ten minste 40 % van de studielast, bedoeld in
      het zesde lid.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '13.9'
    text: |-
      Het praktische opleidingsdeel wordt verzorgd op grondslag van een standaard onderwijsovereenkomst, gesloten door
      het college van bestuur en de korpsbeheerder van het regionale politiekorps waarbij de student is aangesteld,
      of door het college van bestuur en de korpsbeheerder van het Korps landelijke politiediensten. De afspraken
      in de onderwijsovereenkomst betreffen: de precieze omvang van de periode van het praktische opleidingsdeel, de
      begeleiding van de student, dat deel van de competentiegerichte eindtermen dat de student tijdens het praktische
      opleidingsdeel dient te realiseren, en de beoordeling van de student tijdens het praktische opleidingsdeel.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister, en voor zover het opleidingen betreft op het terrein van de strafrechtelijke handhaving van de
      rechtsorde dan wel de taken ten dienste van de justitie Onze Minister in overeenstemming met Onze Minister van
      Justitie, wijst de initiële en postinitiële opleidingen aan die voor bekostiging ingevolge [artikel 27][ref1] in
      aanmerking komen, en draagt met het oog op de totstandkoming van een landelijke kwalificatiestructuur zorg voor
      het vaststellen en onderhouden van een samenhangend en gedifferentieerd geheel van competentiegerichte eindtermen,
      indien mogelijk onderverdeeld in deelkwalificaties, voor de initiële en postinitiële opleidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel27
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '27'
        hoofdstuk: VI
  - number: '14.2'
    text: |-
      Op voorstel van de politieonderwijsraad, worden daartoe, indien noodzakelijk, jaarlijks voor 1 september bij
      ministeriële regeling per aangewezen opleiding de beroepsprofielen, de competentiegerichte eindtermen en indien
      mogelijk de indeling daarvan in deelkwalificaties alsmede de examenverplichting vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
  - number: '14.3'
    text: |-
      Uit het voorstel dient te blijken dat de politieonderwijsraad voldoende acht heeft geslagen op de aansluiting
      van door het LSOP verzorgde opleidingen bij de opleidingen voorbereidend middelbaar beroepsonderwijs, de
      beroepsopleidingen, de opleidingen voor hoger beroepsonderwijs en het wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
  - number: '14.4'
    text: |-
      Indien ten aanzien van bepaalde uitvoerende functies of taken bij of krachtens de wet vereisten zijn vastgesteld
      met betrekking tot de kwaliteiten op het gebied van kennis, inzicht, vaardigheden, houding, ervaring of
      persoonlijke eigenschappen waarover degenen die die functie of taak gaan vervullen, moeten beschikken, neemt Onze
      Minister, en voor zover het opleidingen betreft op het terrein van de strafrechtelijke handhaving van de rechtsorde
      dan wel de taken ten dienste van de justitie Onze Minister in overeenstemming met Onze Minister van Justitie, deze
      vereisten in acht bij de vaststelling van de competentiegerichte eindtermen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
  - number: '14.5'
    text: |-
      Op voorstel van de politieonderwijsraad stelt Onze Minister, en voor zover het opleidingen betreft op het terrein
      van de strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie Onze Minister in
      overeenstemming met Onze Minister van Justitie, met inachtneming van [artikel 13, zesde lid][ref1], per opleiding
      de studieduur en de studielast vast. De studieduur of de studielast kan verschillen voor onderscheiden studenten
      of groepen van studenten, zo nodig in afwijking van de in [artikel 13, zesde lid][ref2], genoemde studieduur of
      studielast.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014623#Artikel13
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '13'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014623
        artikel: '13'
        hoofdstuk: V
  - number: '14.6'
    text: |-
      Het college van bestuur draagt er zorg voor dat de opleidingen zodanig zijn ingericht dat de studenten de
      competentiegerichte eindtermen binnen de vastgestelde studielast kunnen bereiken. Het college van bestuur
      draagt zorg voor de aanleg, het beheer en de bekendmaking van een centraal register politieopleidingen waarin de
      competentiegerichte eindtermen van de onderscheiden opleidingen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel14
  - number: '15.1'
    text: |-
      Het college van bestuur stelt tijdig, ten behoeve van de studenten, voor elke door Onze Minister respectievelijk
      Onze Minister in overeenstemming met Onze Minister van Justitie aangewezen opleiding een onderwijs- en
      examenregeling vast. De onderwijs- en examenregeling omvat ten minste:
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.a
    text: de competentiegerichte eindtermen,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.b
    text: |-
      de uitwerking van de competentiegerichte eindtermen in de inhoud en inrichting van de opleiding, met inbegrip van
      de inhoud en inrichting van het praktische opleidingsdeel,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.c
    text: de inhoud, en in voorkomende gevallen, de indeling in onderdelen van het examen,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.d
    text: |-
      de overeenkomstig [artikel 14, vijfde lid][ref1], vastgestelde studieduur en studielast van de opleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel14
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '14'
        hoofdstuk: V
  - number: 15.1.e
    text: |-
      de volgorde waarin, de tijdvakken waarbinnen en het aantal malen dat gelegenheid wordt geboden tot het afleggen van
      het examen of onderdelen daarvan,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.f
    text: de wijze waarop het examen of onderdelen daarvan worden afgenomen,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: 15.1.g
    text: |-
      de termijn waarbinnen de uitslag van een examen of examenonderdeel wordt bekendgemaakt en de wijze waarop en de
      termijn waarbinnen de student inzage verkrijgt in zijn beoordeelde examen of examenonderdeel.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: '15.2'
    text: |-
      De onderwijs- en examenregeling wordt door het college van bestuur tijdig voor de aanvang van het studiejaar
      bekendgemaakt, zodanig dat de aanstaande student zich een adequaat beeld kan vormen van de inhoud en inrichting van
      het onderwijs en de examens.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel15
  - number: '16'
    text: |-
      Elke opleiding wordt afgesloten met een examen dat door het LSOP wordt afgenomen. Het examen omvat een
      onafhankelijk onderzoek naar de competenties waarover de student bij voltooiing van de opleiding dient te
      beschikken.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel16
  - number: '17.1'
    text: |-
      Het college van bestuur geeft de studenten de gelegenheid een examen af te leggen en draagt zorg voor de uitvoering
      van het examen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel17
  - number: '17.2'
    text: |-
      Ten bewijze dat een examenonderdeel met goed gevolg is afgelegd, wordt een bewijsstuk uitgereikt. Indien het
      examenonderdeel een deelkwalificatie betreft, wordt een certificaat uitgereikt. Ten bewijze dat een examen met
      goed gevolg is afgelegd wordt een diploma uitgereikt. Het examen van een opleiding is eerst dan met goed gevolg
      afgesloten indien zowel het duale opleidingsdeel als het overige deel van het onderricht met goed gevolg is
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel17
  - number: '17.3'
    text: |-
      Het college van bestuur stelt ten minste een examencommissie in ten behoeve van de organisatie en het afnemen van
      de examens voor elke door het LSOP verzorgde opleiding of groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel17
  - number: '17.4'
    text: Het college van bestuur benoemt de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel17
  - number: '17.5'
    text: |-
      Ten behoeve van het afnemen van het examen wijst de examencommissie examinatoren aan. Het college van bestuur kan
      in afwijking van de eerste volzin bepalen dat een of meer examens worden afgenomen door andere examinatoren dan
      bedoeld in die volzin.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel17
  - number: '18.1'
    text: Het college van bestuur stelt ten minste een commissie van beroep voor de examens in.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
  - number: '18.2'
    text: |-
      Beslissingen van het college van bestuur ter uitvoering van de [artikelen 13, zevende lid juncto negende lid][ref1],
      of [17][ref2], of beslissingen van de degenen die het examenonderdeel of het examen hebben samengesteld of
      afgenomen, kunnen worden onderworpen aan het oordeel van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014623#Artikel17
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '13'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0014623
        artikel: '17'
        hoofdstuk: V
  - number: '18.3'
    text: |-
      De commissie bestaat uit een oneven aantal leden, onder wie de voorzitter. De leden worden benoemd, herbenoemd,
      geschorst en ontslagen door het college van bestuur. De leden maken geen deel uit van het college van bestuur,
      en hebben niet het examenonderdeel of het examen samengesteld of afgenomen dat aan het oordeel van de commissie
      is onderworpen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
  - number: '18.4'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het beroepschrift zes dagen. In afwijking van [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref2]
      beslist de commissie binnen vier weken na ontvangst van het beroepschrift tenzij zij deze termijn heeft verlengd
      met ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '18.5'
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de student in de gelegenheid zal worden gesteld het examen of het examenonderdeel alsnog of opnieuw af
      te leggen. De beslissing van de commissie wordt bekendgemaakt aan de student, de leiding van de desbetreffende
      instelling van het LSOP alsmede aan de korpsbeheerder in wiens regio door de student het praktische opleidingsdeel
      wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
  - number: '18.6'
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. In afwijking van
      [artikel 7:25 van de Algemene wet bestuursrecht][ref1], is de commissie niet bevoegd in de plaats van het geheel of
      gedeeltelijk vernietigde besluit een nieuw besluit te nemen. Zij kan bepalen dat opnieuw of, indien de beslissing
      is geweigerd, alsnog in de zaak wordt beslist, dan wel dat het examenonderdeel of het examen opnieuw wordt
      afgenomen onder door de commissie te stellen voorwaarden. Het college van bestuur of degene die het examenonderdeel
      of het examen heeft samengesteld of afgenomen, van wie de beslissing is vernietigd, voorziet voor zover nodig
      opnieuw in de zaak met inachtneming van de uitspraak van de commissie. De commissie kan daarvoor in haar uitspraak
      een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '18.7'
    text: |-
      In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek na de
      desbetreffende examinator te hebben gehoord, althans te hebben opgeroepen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
  - number: '18.8'
    text: |-
      Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel18
  - number: '19.1'
    text: Er is een politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.2'
    text: De politieonderwijsraad bestaat uit dertien leden, onder wie de onafhankelijke voorzitter.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.3'
    text: De leden van de politieonderwijsraad wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.4'
    text: |-
      De leden van de politieonderwijsraad worden bij koninklijk besluit, op voordracht van Onze Minister in
      overeenstemming met Onze Minister van Justitie, benoemd, herbenoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.5'
    text: |-
      De leden van de politieonderwijsraad worden benoemd voor een periode van vier jaren. Zij kunnen ten hoogste eenmaal
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.6'
    text: 'In de politieonderwijsraad hebben, naast de voorzitter, als lid zitting:'
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.a
    text: een korpsbeheerder,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.b
    text: drie hoofdcommissarissen,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.c
    text: een lid van het openbaar ministerie,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.d
    text: twee vertegenwoordigers vanuit de politievakorganisaties,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.e
    text: een vertegenwoordiger van het beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.f
    text: een vertegenwoordiger van het hoger onderwijs,
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.g
    text: twee leden vanuit het LSOP, en
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: 19.6.h
    text: een onafhankelijk lid dat deskundig is op het terrein van het beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '19.7'
    text: |-
      Tevens kunnen zoveel adviserende leden of waarnemers worden benoemd als Onze Minister in overeenstemming met Onze
      Minister van Justitie dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel19
  - number: '20.1'
    text: |-
      De politieonderwijsraad draagt bij aan het ontwikkelen en onderhouden van een landelijke kwalificatiestructuur,
      gericht op de aansluiting en afstemming tussen het aanbod van politieonderwijs en de behoefte daaraan, mede in het
      licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede gelet op van belang zijnde ontwikkelingen in
      internationaal verband.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel20
  - number: '20.2'
    text: |-
      De politieonderwijsraad draagt zorg voor het ontwikkelen van voorstellen welke opleidingen voor bekostiging
      door het ministerie van Binnenlandse Zaken en Koninkrijksrelaties in aanmerking komen mede in het licht van een
      doelmatige en doelgerichte inzet van overheidsmiddelen.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel20
  - number: '20.3'
    text: |-
      De politieonderwijsraad adviseert Onze Minister, en voor zover het opleidingen betreft op het terrein van de
      strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie Onze Minister en
      Onze Minister van Justitie, omtrent de eisen die moeten worden gesteld aan de plaatsen waar het praktische
      opleidingsdeel wordt uitgevoerd, en omtrent het aantal plaatsen in de regionale politiekorpsen en het Korps
      landelijke politiediensten waar het praktische opleidingsdeel wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel20
  - number: '20.4'
    text: |-
      De politieonderwijsraad heeft tot taak toe te zien op de aansluiting van het politieonderwijs op de
      kwalificatiestructuur van het beroepsonderwijs zoals neergelegd in de [Wet educatie en beroepsonderwijs][ref1] en
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: '20.5'
    text: |-
      De politieonderwijsraad geeft Onze Minister, en voor zover het opleidingen betreft op het terrein van de
      strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie Onze Minister en Onze
      Minister van Justitie, desgevraagd of uit eigen beweging zijn zienswijze.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel20
  - number: '21'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de organisatie, de werkwijze
      en de bekostiging van de politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel21
  - number: '22.1'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gegeven over het beheer van het LSOP.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister houdt toezicht op het financiële beheer van het LSOP. De [artikelen 203][ref1],
      [205 tot en met 211 van de Gemeentewet][ref2] zijn daarbij van overeenkomstige toepassing. Bij de algemene
      maatregel van bestuur, bedoeld in het eerste lid, worden over deze toepassing nadere, zo nodig afwijkende regels
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel205
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '205'
  - number: '22.3'
    text: |-
      Het college van bestuur draagt zorg voor de archiefbescheiden van het LSOP, voor zover deze niet zijn overgebracht
      naar het Algemeen Rijksarchief. Onze Minister kan bij de algemene maatregel van bestuur, bedoeld in het eerste lid,
      regels geven over de zorg voor en de bewaring van de archiefbescheiden van het LSOP.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel22
  - number: '22.4'
    text: |-
      Het oprichten of mede-oprichten van privaatrechtelijke rechtspersonen door het LSOP is slechts toegestaan met
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel22
  - number: '23'
    text: |-
      Bij ministeriële regeling van Onze Minister, en voor zover het opleidingen betreft op het terrein van de
      strafrechtelijke handhaving van de rechtsorde dan wel de taken ten dienste van de justitie van Onze Minister in
      overeenstemming met Onze Minister van Justitie, worden criteria vastgesteld aan de hand waarvan het college van
      bestuur na overleg met de politiekorpsen de studenten verdeelt over de instellingen en de vestigingen van het LSOP.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel23
  - number: '24'
    text: |-
      In het beleidsplan, bedoeld in [artikel 43a van de Politiewet 1993][ref1], worden door Onze Minister in
      overeenstemming met Onze Minister van Justitie tevens de hoofdzaken van het beleid op rijksniveau met betrekking
      tot de werving, selectie en opleiding van ambtenaren van politie en van andere door Onze Minister of door Onze
      Minister van Justitie aan te wijzen categorieën van personen aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43a
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 43a
  - number: '25'
    text: |-
      Onze Minister en Onze Minister van Justitie voeren jaarlijks overleg met het college van bestuur over de taken,
      bedoeld in [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '26.1'
    text: |-
      Het college van bestuur stelt, met inachtneming van het in [artikel 24][ref1] bedoelde beleidsplan, ten minste
      eenmaal in de vier jaar een beleidsplan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel24
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '24'
        hoofdstuk: VI
  - number: '26.2'
    text: |-
      Het college van bestuur stelt jaarlijks een begroting voor het volgende kalenderjaar en een meerjarenraming
      voor de daarop volgende drie jaren vast, alsmede een jaarplan, de organisatie en de formatie voor het volgende
      kalenderjaar. Het jaarplan en de begroting bevatten een nadere uitwerking van het beleidsplan, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel26
  - number: '26.3'
    text: |-
      De door het college van bestuur vastgestelde stukken, bedoeld in het eerste en tweede lid, behoeven de instemming
      van de raad van toezicht. Indien de raad van toezicht zijn instemming aan een of meer van deze stukken onthoudt,
      legt het college van bestuur deze stukken en een document waaruit de zienswijze van de raad van toezicht hierover
      blijkt, voor aan Onze Minister die alsdan een besluit neemt.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel26
  - number: '26.4'
    text: |-
      De stukken, bedoeld in het eerste en tweede lid, worden na de vaststelling ervan door het college van bestuur vóór
      15 november aan Onze Minister en in afschrift aan Onze Minister van Justitie gezonden. De stukken worden algemeen
      verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister stelt jaarlijks ten laste van de begroting van het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties aan het LSOP bijdragen ter beschikking.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.2'
    text: |-
      Onverminderd het eerste lid, kan het LSOP geldmiddelen verwerven door het aanvaarden van geldmiddelen van derden
      in de vorm van schenkingen en legaten, door het aangaan van geldleningen, door inkomsten uit eigen beheer, en uit
      andere hoofde.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister en Onze Minister van Justitie kunnen regels stellen omtrent de doorberekening van een deel van
      de opleidingskosten door het LSOP aan de politiekorpsen waarbij de studenten die de initiële opleidingen of de
      aangewezen postinitiële opleidingen volgen, zijn aangesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.4'
    text: |-
      Het LSOP gebruikt de geldmiddelen, bedoeld in het eerste tot en met het derde lid, uitsluitend ter vervulling van
      de taken, voortvloeiend uit [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '27.5'
    text: |-
      Indien blijkt dat de geldmiddelen voor het LSOP aanmerkelijk tekort zullen schieten om in de noodzakelijke
      behoeften te voorzien, kan door Onze Minister aan het LSOP een aanvullende bijdrage beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister worden regels gegeven betreffende
      de omvang en de bestemming van het vermogen van het LSOP. Indien het LSOP niet voldoet aan deze regels kan Onze
      Minister besluiten tot aanpassing van de hoogte van de bijdragen die aan het LSOP beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën kunnen regels worden gegeven over de wijze waarop dit artikel wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.8'
    text: |-
      Het sluiten van geldleningen, bedoeld in het tweede lid, kan onder voorwaarden geschieden bij Onze Minister van
      Financiën ten laste van de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.9'
    text: Het LSOP houdt zijn liquide middelen rentedragend aan in 's Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
  - number: '27.10'
    text: |-
      Het sluiten van huur-, verkoop- en lease-overeenkomsten door het LSOP met een waarde gelijk aan of meer dan het
      bedrag zoals vastgesteld in de nadere voorschriften gesteld krachtens [artikel 34 van de Comptabiliteitswet][ref1],
      dan wel voor een periode langer dan tien jaar, geschiedt na verkregen instemming van Onze Minister in
      overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '34'
  - number: '28'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, stelt jaarlijks, nadat de korpsbeheerders, de
      korpschefs en de hoofdofficieren van justitie in de gelegenheid zijn gesteld hun zienswijze kenbaar te maken,
      en gelet op het advies terzake van de politieonderwijsraad, de voor de taakuitvoering van het LSOP benodigde
      bijdragen, als bedoeld in [artikel 27, eerste lid][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel27
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '27'
        hoofdstuk: VI
  - number: '29.1'
    text: |-
      Het college van bestuur stelt jaarlijks een jaarverslag vast van de werkzaamheden van het LSOP, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen
      kalenderjaar, alsmede een jaarrekening. Het college van bestuur stelt de raad van toezicht in de gelegenheid zijn
      zienswijze over het jaarverslag en de jaarrekening kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel29
  - number: '29.2'
    text: De jaarrekening behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel29
  - number: '29.3'
    text: |-
      De stukken, bedoeld in het eerste lid, worden, vergezeld van een document waaruit de zienswijze van de raad van
      toezicht over de stukken blijkt, na de vaststelling ervan door het college van bestuur vóór 1 april aan Onze
      Minister en in afschrift aan Onze Minister van Justitie gezonden. De stukken worden algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel29
  - number: '29.4'
    text: |-
      Onverminderd het eerste lid, zijn de [artikelen 361 tot en met 391][ref1] en
      [405 tot en met 414 van Boek 2 van het Burgerlijk Wetboek][ref2] van overeenkomstige toepassing, met uitzondering
      van de bepalingen die betrekking hebben op het in aandelen verdeeld zijn van het kapitaal van een vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel405
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '405'
  - number: '29.5'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 27, zevende lid][ref1], kunnen regels
      worden gegeven over het te voeren financieel beheer en de verantwoording daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel27
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '27'
        hoofdstuk: VI
  - number: '30.1'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid en een beoordeling van de
      rechtmatigheid, afgegeven door een door de raad van toezicht aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '30.2'
    text: |-
      De verklaring, bedoeld in het eerste lid, heeft mede betrekking op de rechtmatige besteding van de middelen van het
      LSOP. De accountant voegt bij de verklaring tevens een verslag van zijn bevindingen of het beheer en de organisatie
      van het LSOP voldoen aan eisen van doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel30
  - number: '30.3'
    text: |-
      [Artikel 393, derde tot en met zevende lid, van Boek 2 van het Burgerlijk Wetboek][ref1] is op het in te stellen
      onderzoek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '30.4'
    text: |-
      Onze Minister kan de accountantsdienst van zijn ministerie belasten met een onderzoek naar controlewerkzaamheden
      van de accountant, bedoeld in het eerste lid. Onze Minister kan de departementale accountantsdienst tevens
      belasten met een onderzoek naar de doelmatigheid van het beheer, de organisatie en het beleid van het LSOP. Aan
      de departementale accountantsdienst wordt desgevraagd inzage gegeven in de boeken en bescheiden en worden alle
      inlichtingen verstrekt die hij voor de uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel30
  - number: '31'
    text: |-
      Onze Minister heeft de bevoegdheid tot het toetsen van de wijze waarop het college van bestuur voorziet in de
      kwaliteit van de taakuitvoering, de resultaten en het beheer van het LSOP. Onze Minister kan aan het college van
      bestuur aanwijzingen van algemene aard geven met het oog op de goede uitoefening van zijn taak. De werkzaamheden
      die in het kader van het toetsen bedoeld in de eerste volzin worden uitgevoerd, worden jaarlijks door Onze
      Minister, en voor zover het werkzaamheden betreft op het terrein van de strafrechtelijke handhaving van de
      rechtsorde dan wel de taken ten dienste van de justitie door Onze Minister in overeenstemming met Onze Minister van
      Justitie, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel31
  - number: '32.1'
    text: |-
      Het toezicht op de kwaliteit van de opleidingen, met uitzondering van de opleidingen van de politie ten behoeve
      van de strafrechtelijke handhaving van de rechtsorde en de taken ten dienste van de justitie, alsmede op de
      examinering, is opgedragen aan Onze Minister. Het wordt onder zijn gezag uitgeoefend door of namens de Inspectie
      voor de politie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel32
  - number: '32.2'
    text: |-
      Het toezicht op de kwaliteit van de opleidingen van de politie ten behoeve van de strafrechtelijke handhaving van
      de rechtsorde en de taken ten dienste van de justitie alsmede op de examinering, is opgedragen aan Onze Minister
      die het toezicht uitoefent in overeenstemming met Onze Minister van Justitie. Het wordt onder hun gezag uitgeoefend
      door of namens de Inspectie voor de politie.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel32
  - number: '33'
    text: |-
      De [artikelen 53a tot en met 53c van de Politiewet 1993][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
  - number: '34'
    text: |-
      Het college van bestuur verstrekt desgevraagd of uit eigen beweging aan Onze Minister of aan Onze Minister van
      Justitie de voor de uitoefening van diens taak benodigde inlichtingen. Onze in de eerste volzin bedoelde Minister
      kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel34
  - number: '35'
    text: |-
      Indien de taken van het LSOP, voortvloeiend uit [artikel 3][ref1], naar het oordeel van Onze Minister worden
      verwaarloosd, kan deze al die maatregelen nemen die hij met het oog op de continuïteit van de werkzaamheden of
      beperking van de schade noodzakelijk acht. Onze Minister doet hiervan terstond mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '37'
    text: |-
      Degenen die op het tijdstip voorafgaand aan de inwerkingtreding van deze wet de leden zijn van de bestuursraad en
      de directie van het LSOP, bedoeld in de [artikelen 5, tweede lid][ref1], en [6, tweede lid, van de LSOP-wet][ref2],
      zijn voor de resterende duur van hun benoeming als zodanig met ingang van het tijdstip van inwerkingtreding van
      deze wet de leden van de raad van toezicht onderscheidenlijk het college van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006942#Artikel6
    url: https://wetten.overheid.nl/BWBR0014623/2006-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006942
        artikel: '6'
  - number: '38'
    text: |-
      De [LSOP-wet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
