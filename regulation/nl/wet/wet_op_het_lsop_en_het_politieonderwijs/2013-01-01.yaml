  - number: '15'
    text: |-
      1 Het college van bestuur stelt tijdig, ten behoeve van de studenten, voor elke door Onze Minister aangewezen
      opleiding een onderwijs- en examenregeling vast. De onderwijs- en examenregeling omvat ten minste:

      a. de competentiegerichte eindtermen,

      b. de uitwerking van de competentiegerichte eindtermen in de inhoud en inrichting van de opleiding, met inbegrip
      van de inhoud en inrichting van het praktische opleidingsdeel,

      c. de inhoud, en in voorkomende gevallen, de indeling in onderdelen van het examen,

      d. de overeenkomstig [artikel 14, vijfde lid][ref1], vastgestelde studieduur en studielast van de opleiding,

      e. de volgorde waarin, de tijdvakken waarbinnen en het aantal malen dat gelegenheid wordt geboden tot het afleggen
      van het examen of onderdelen daarvan,

      f. de wijze waarop het examen of onderdelen daarvan worden afgenomen,

      g. de termijn waarbinnen de uitslag van een examen of examenonderdeel wordt bekendgemaakt en de wijze waarop en de
      termijn waarbinnen de student inzage verkrijgt in zijn beoordeelde examen of examenonderdeel.

      2 De onderwijs- en examenregeling wordt door het college van bestuur tijdig voor de aanvang van het studiejaar
      bekendgemaakt, zodanig dat de aanstaande student zich een adequaat beeld kan vormen van de inhoud en inrichting van
      het onderwijs en de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel14
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel15
