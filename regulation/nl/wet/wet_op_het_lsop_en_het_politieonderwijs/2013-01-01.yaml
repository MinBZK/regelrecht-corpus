preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een Wet op het LSOP en het politieonderwijs vast
    te stellen ter vervanging van de LSOP-wet in verband met de evaluatie van de LSOP-wet, de aanpassing aan de
    Aanwijzingen voor de regelgeving inzake de zelfstandige bestuursorganen, de concentratie van beheersbevoegdheden
    op rijksniveau met betrekking tot de regionale politiekorpsen bij Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties, de wijziging van de bestuursstructuur en het financieringsstelsel van het LSOP, alsmede de
    vernieuwing van het politieonderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. LSOP: het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum;

      b. Onze Minister: Onze Minister van Veiligheid en Justitie;

      c. initiële opleidingen: de door Onze Minister aangewezen opleidingen voor ambtenaren van politie, gericht
      op de voorbereiding van de uitoefening van algemene politietaken, waarvoor in het kader van de landelijke
      kwalificatiestructuur, bedoeld in [artikel 14][ref1], competentiegerichte eindtermen zijn vastgesteld;

      d. postinitiële opleidingen: de door Onze Minister aangewezen opleidingen voor ambtenaren van politie of andere
      door Onze Minister aan te wijzen categorieën van personen, gericht op de voorbereiding van de uitoefening van
      specialistische en leidinggevende politietaken, waarvoor in het kader van de landelijke kwalificatiestructuur,
      bedoeld in [artikel 14][ref2], competentiegerichte eindtermen zijn vastgesteld;

      e. college van bestuur: het college van bestuur, bedoeld in [artikel 5][ref3];

      f. raad van toezicht: de raad van toezicht, bedoeld in [artikel 7][ref4];

      g. praktisch opleidingsdeel: de periode of perioden waarin de studenten de politietaak bij de politie uitoefenen in
      het kader van de initiële en postinitiële opleidingen;

      h. politieonderwijsraad: het advies- en afstemmingsorgaan, bedoeld in [artikel 19][ref5];

      i. competentiegerichte eindtermen: als zodanig omschreven kwaliteiten op het gebied van kennis, inzicht,
      vaardigheden, houding en ervaring waarover degene die de opleiding voltooit, met het oog op het maatschappelijk en
      beroepsmatig functioneren dient te beschikken, en die in voorkomende gevallen betekenis hebben voor de doorstroming
      naar vervolgonderwijs;

      j. deelkwalificatie: een combinatie van competentiegerichte eindtermen, vastgesteld voor een initiële of
      postinitiële opleiding, die in het licht van de uitoefening van de politietaak waarop de opleiding is gericht een
      zelfstandige betekenis heeft.


