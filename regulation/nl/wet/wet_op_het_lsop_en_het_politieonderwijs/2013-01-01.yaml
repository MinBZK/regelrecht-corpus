  - number: '19'
    text: |-
      1 Er is een politieonderwijsraad.

      2 De politieonderwijsraad bestaat uit dertien leden, onder wie de onafhankelijke voorzitter.

      3 De leden van de politieonderwijsraad wijzen uit hun midden een plaatsvervangend voorzitter aan.

      4 De leden van de politieonderwijsraad worden bij koninklijk besluit benoemd, herbenoemd, geschorst en ontslagen.

      5 De leden van de politieonderwijsraad worden benoemd voor een periode van vier jaren. Zij kunnen ten hoogste
      eenmaal worden herbenoemd.

      6 In de politieonderwijsraad hebben, naast de voorzitter, als lid zitting:

      a. een burgemeester,

      b. drie strategisch leidinggevenden van het politiekorps,

      c. een lid van het openbaar ministerie,

      d. twee vertegenwoordigers vanuit de politievakorganisaties,

      e. een vertegenwoordiger van het beroepsonderwijs,

      f. een vertegenwoordiger van het hoger onderwijs,

      g. twee leden vanuit het LSOP, en

      h. een onafhankelijk lid dat deskundig is op het terrein van het beroepsonderwijs.

      7 Tevens kunnen zoveel adviserende leden of waarnemers worden benoemd als Onze Minister dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel19
  - number: '20'
    text: |-
      1 De politieonderwijsraad draagt bij aan het ontwikkelen en onderhouden van een landelijke kwalificatiestructuur,
      gericht op de aansluiting en afstemming tussen het aanbod van politieonderwijs en de behoefte daaraan, mede in het
      licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede gelet op van belang zijnde ontwikkelingen in
      internationaal verband.

      2 De politieonderwijsraad draagt zorg voor het ontwikkelen van voorstellen welke opleidingen voor bekostiging door
      het Ministerie van Veiligheid en Justitie in aanmerking komen mede in het licht van een doelmatige en doelgerichte
      inzet van overheidsmiddelen.

      3 De politieonderwijsraad adviseert Onze Minister omtrent de eisen die moeten worden gesteld aan de plaatsen
      waar het praktische opleidingsdeel wordt uitgevoerd, en omtrent het aantal plaatsen in de regionale en landelijke
      eenheden van de politie waar het praktische opleidingsdeel wordt uitgevoerd.

      4 De politieonderwijsraad heeft tot taak toe te zien op de aansluiting van het politieonderwijs op de
      kwalificatiestructuur van het beroepsonderwijs zoals neergelegd in de [Wet educatie en beroepsonderwijs][ref1] en
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].

      5 De politieonderwijsraad geeft Onze Minister desgevraagd of uit eigen beweging zijn zienswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel20
