  - number: '30'
    text: |-
      1 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid en een beoordeling van
      de rechtmatigheid, afgegeven door een door de raad van toezicht aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De verklaring, bedoeld in het eerste lid, heeft mede betrekking op de rechtmatige besteding van de middelen
      van het LSOP. De accountant voegt bij de verklaring tevens een verslag van zijn bevindingen of het beheer en de
      organisatie van het LSOP voldoen aan eisen van doelmatigheid.

      3 [Artikel 393, derde tot en met zevende lid, van Boek 2 van het Burgerlijk Wetboek][ref2] is op het in te stellen
      onderzoek van overeenkomstige toepassing.

      4 Onze Minister kan de accountantsdienst van zijn ministerie belasten met een onderzoek naar controlewerkzaamheden
      van de accountant, bedoeld in het eerste lid. Onze Minister kan de departementale accountantsdienst tevens
      belasten met een onderzoek naar de doelmatigheid van het beheer, de organisatie en het beleid van het LSOP. Aan
      de departementale accountantsdienst wordt desgevraagd inzage gegeven in de boeken en bescheiden en worden alle
      inlichtingen verstrekt die hij voor de uitvoering van zijn taak nodig oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel30
