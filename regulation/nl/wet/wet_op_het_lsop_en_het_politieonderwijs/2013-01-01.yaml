  - number: '28'
    text: |-
      Onze Minister stelt jaarlijks, nadat de regioburgemeesters, de korpschef en de hoofdofficieren van
      justitie in de gelegenheid zijn gesteld hun zienswijze kenbaar te maken, en gelet op het advies terzake
      van de politieonderwijsraad, de voor de taakuitvoering van het LSOP benodigde bijdragen, als bedoeld in
      [artikel 27, eerste lid][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel27
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '27'
        hoofdstuk: VI
  - number: '29'
    text: |-
      1 Het college van bestuur stelt jaarlijks een jaarverslag vast van de werkzaamheden van het LSOP, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder in het afgelopen
      kalenderjaar, alsmede een jaarrekening. Het college van bestuur stelt de raad van toezicht in de gelegenheid zijn
      zienswijze over het jaarverslag en de jaarrekening kenbaar te maken.

      2 De jaarrekening behoeft de instemming van Onze Minister.

      3 De stukken, bedoeld in het eerste lid, worden, vergezeld van een document waaruit de zienswijze van de raad
      van toezicht over de stukken blijkt, na de vaststelling ervan door het college van bestuur vóór 1 april aan Onze
      Minister gezonden. De stukken worden algemeen verkrijgbaar gesteld.

      4 Onverminderd het eerste lid, zijn de [artikelen 361 tot en met 391][ref1] en
      [405 tot en met 414 van Boek 2 van het Burgerlijk Wetboek][ref2] van overeenkomstige toepassing, met uitzondering
      van de bepalingen die betrekking hebben op het in aandelen verdeeld zijn van het kapitaal van een vennootschap.

      5 Bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 27, zevende lid][ref3], kunnen regels
      worden gegeven over het te voeren financieel beheer en de verantwoording daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel405
      [ref3]: https://wetten.overheid.nl/BWBR0014623#Artikel27
