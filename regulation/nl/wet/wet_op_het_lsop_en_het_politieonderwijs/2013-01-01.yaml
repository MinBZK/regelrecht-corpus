  - number: '11'
    text: |-
      Het politieonderwijs is gericht op de verwerving van kennis, inzicht, vaardigheden, houding en ervaring, nodig voor
      de uitoefening van de politietaak. Het politieonderwijs bevordert tevens de algemene vorming en de persoonlijke
      ontplooiing van de studenten en draagt bij tot hun maatschappelijk functioneren.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel11
  - number: '12'
    text: |-
      Het politieonderwijs draagt bij aan de ontwikkeling van de studenten met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel12
  - number: '13'
    text: |-
      1 Het LSOP biedt in samenwerking met de politie, met de regionale opleidingencentra, bedoeld in
      [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref1], en met de instellingen voor hoger onderwijs, bedoeld
      in [artikel 1.1 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], het onderwijs aan in de
      vorm van initiële en postinitiële opleidingen.

      2 De niveaus waarop de initiële opleidingen, genoemd in de onderdelen a tot en met c van het derde
      lid, zich richten, komen overeen met de opeenvolgende niveaus van beroepsuitoefening, als bedoeld in
      [artikel 7.2.2. van de Wet educatie en beroepsonderwijs][ref3]. De niveaus waarop de initiële opleidingen, genoemd
      in de onderdelen d en e van het derde lid, zich richten, komen overeen met de niveaus van de opleidingen die op
      grond van [artikel 7:21 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] recht geven op het
      voeren van de titels bachelor respectievelijk master.

      3 De initiële opleidingen richten zich op de volgende niveaus waarop de politietaak kan worden uitgeoefend:

      a. assistent politiemedewerker (niveau 2),

      b. politiemedewerker (niveau 3),

      c. allround politiemedewerker (niveau 4),

      d. politiekundige (niveau 5),

      e. politiekundige (niveau 6).

      4 Aan de initiële opleidingen kunnen ten behoeve van individuele studenten voorbereidende of ondersteunende
      activiteiten worden toegevoegd ter bevordering van de toelating tot en het met gunstig gevolg voltooien van de
      opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en ondersteunende activiteiten
      zijn bestemd voor studenten wier vooropleiding naar het oordeel van het college van bestuur zonder deze
      activiteiten onvoldoende uitzicht biedt op het voldoen aan de competentiegerichte eindtermen binnen redelijke tijd.

      5 Het college van bestuur is belast met de beoordeling van eerder verworven kwaliteiten op het gebied van kennis,
      inzicht, vaardigheden, houding en ervaring, al dan niet blijkend uit eerder behaalde kwalificaties, met het oog op
      het verlenen van vrijstellingen.

      6 De studielast van de initiële opleidingen bedraagt voor de onderscheiden in het derde lid, onderdelen a tot en
      met e, bedoelde initiële opleidingen ten minste:

      a. 2400 studiebelastinguren,

      b. 4800 studiebelastinguren,

      c. 6400 studiebelastinguren,

      d. 6720 studiebelastinguren, en

      e. 6720 studiebelastinguren.

      Van de studielast kan overeenkomstig [artikel 14, vijfde lid][ref5], worden afgeweken.

      7 Van elke opleiding maakt een praktisch opleidingsdeel deel uit.

      8 Het praktische opleidingsdeel bedraagt voor de initiële opleidingen ten minste 40 % van de studielast, bedoeld in
      het zesde lid.

      9 Het praktische opleidingsdeel wordt verzorgd op grondslag van een standaard onderwijsovereenkomst, gesloten door
      het college van bestuur en de korpschef. De afspraken in de onderwijsovereenkomst betreffen: de precieze omvang van
      de periode van het praktische opleidingsdeel, de begeleiding van de student, dat deel van de competentiegerichte
      eindtermen dat de student tijdens het praktische opleidingsdeel dient te realiseren, en de beoordeling van de
      student tijdens het praktische opleidingsdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7.21
      [ref5]: https://wetten.overheid.nl/BWBR0014623#Artikel14
