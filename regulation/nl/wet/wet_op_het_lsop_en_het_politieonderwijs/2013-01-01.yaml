      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: '33'
    text: |-
      1 De [artikelen 65][ref1], [66][ref2] en [67 van de Politiewet 2012][ref3] zijn van overeenkomstige toepassing.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het college van
      bestuur zorg draagt voor de kwaliteit van de taakuitvoering, de resultaten en het beheer van het LSOP, alsmede over
      verstrekking van informatie hierover aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel67
