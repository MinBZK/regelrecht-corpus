      - id: ref2
        bwb_id: BWBR0031788
        artikel: '66'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '67'
  - number: '34'
    text: |-
      Het college van bestuur verstrekt desgevraagd of uit eigen beweging aan Onze Minister de voor de uitoefening van
      diens taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor
      zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel34
  - number: '35'
    text: |-
      Indien de taken van het LSOP, voortvloeiend uit [artikel 3][ref1], naar het oordeel van Onze Minister worden
      verwaarloosd, kan deze al die maatregelen nemen die hij met het oog op de continuïteit van de werkzaamheden of
      beperking van de schade noodzakelijk acht. Onze Minister doet hiervan terstond mededeling aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '37'
    text: |-
      Degenen die op het tijdstip voorafgaand aan de inwerkingtreding van deze wet de leden zijn van de bestuursraad en
      de directie van het LSOP, bedoeld in de [artikelen 5, tweede lid][ref1], en [6, tweede lid, van de LSOP-wet][ref2],
      zijn voor de resterende duur van hun benoeming als zodanig met ingang van het tijdstip van inwerkingtreding van
      deze wet de leden van de raad van toezicht onderscheidenlijk het college van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006942#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006942#Artikel6
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006942
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006942
        artikel: '6'
  - number: '38'
    text: |-
      De [LSOP-wet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006942
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006942
  - number: '39'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel39
  - number: '40'
    text: 'Deze wet wordt aangehaald als: Wet op het LSOP en het politieonderwijs.'
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel40
