  - number: '14'
    text: |-
      1 Onze Minister wijst de initiële en postinitiële opleidingen aan die voor bekostiging ingevolge [artikel 27][ref1]
      in aanmerking komen, en draagt met het oog op de totstandkoming van een landelijke kwalificatiestructuur zorg voor
      het vaststellen en onderhouden van een samenhangend en gedifferentieerd geheel van competentiegerichte eindtermen,
      indien mogelijk onderverdeeld in deelkwalificaties, voor de initiële en postinitiële opleidingen.

      2 Op voorstel van de politieonderwijsraad, worden daartoe, indien noodzakelijk, jaarlijks voor 1 september bij
      ministeriële regeling per aangewezen opleiding de beroepsprofielen, de competentiegerichte eindtermen en indien
      mogelijk de indeling daarvan in deelkwalificaties alsmede de examenverplichting vastgesteld.

      3 Uit het voorstel dient te blijken dat de politieonderwijsraad voldoende acht heeft geslagen op de aansluiting
      van door het LSOP verzorgde opleidingen bij de opleidingen voorbereidend middelbaar beroepsonderwijs, de
      beroepsopleidingen, de opleidingen voor hoger beroepsonderwijs en het wetenschappelijk onderwijs.

      4 Indien ten aanzien van bepaalde uitvoerende functies of taken bij of krachtens de wet vereisten zijn vastgesteld
      met betrekking tot de kwaliteiten op het gebied van kennis, inzicht, vaardigheden, houding, ervaring of
      persoonlijke eigenschappen waarover degenen die die functie of taak gaan vervullen, moeten beschikken, neemt Onze
      Minister deze vereisten in acht bij de vaststelling van de competentiegerichte eindtermen.

      5 Op voorstel van de politieonderwijsraad stelt Onze Minister met inachtneming van [artikel 13, zesde lid][ref2],
      per opleiding de studieduur en de studielast vast. De studieduur of de studielast kan verschillen voor
      onderscheiden studenten of groepen van studenten, zo nodig in afwijking van de in [artikel 13, zesde lid][ref3],
      genoemde studieduur of studielast.

      6 Het college van bestuur draagt er zorg voor dat de opleidingen zodanig zijn ingericht dat de studenten de
      competentiegerichte eindtermen binnen de vastgestelde studielast kunnen bereiken. Het college van bestuur
      draagt zorg voor de aanleg, het beheer en de bekendmaking van een centraal register politieopleidingen waarin de
      competentiegerichte eindtermen van de onderscheiden opleidingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0014623#Artikel13
