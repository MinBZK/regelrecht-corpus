  - number: '31'
    text: |-
      Onze Minister heeft de bevoegdheid tot het toetsen van de wijze waarop het college van bestuur voorziet in de
      kwaliteit van de taakuitvoering, de resultaten en het beheer van het LSOP. Onze Minister kan aan het college van
      bestuur aanwijzingen van algemene aard geven met het oog op de goede uitoefening van zijn taak. De werkzaamheden
      die in het kader van het toetsen bedoeld in de eerste volzin worden uitgevoerd, worden jaarlijks door Onze Minister
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel31
  - number: '32'
    text: |-
      1 Het toezicht op de kwaliteit van de opleidingen en de examinering is opgedragen aan Onze Minister.

      2 De Inspectie Openbare Orde en Veiligheid, bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1], is
      belast met de werkzaamheden die in het kader van het eerste lid worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel32
