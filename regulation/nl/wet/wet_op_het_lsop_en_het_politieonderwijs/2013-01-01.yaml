  - number: '2'
    text: |-
      1 Er is een Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum, belast met de
      in [artikel 3, eerste lid][ref1], bedoelde taak.

      2 Het LSOP bezit rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '3'
    text: |-
      1 Het LSOP heeft tot taak:

      a. het ondersteunen van de landelijke werving en het uitvoeren van de selectie van de studenten voor de initiële
      opleidingen;

      b. het ontwikkelen en het verzorgen van de initiële opleidingen;

      c. het ontwikkelen en het verzorgen van de postinitiële opleidingen;

      d. het examineren van de studenten die de initiële en postinitiële opleidingen hebben gevolgd;

      e. het overdragen van kennis aan de Nederlandse politie en het bijdragen aan de ontwikkeling van de uitoefening van
      de politietaak waarop het onderwijs is gericht, onder meer door het verrichten van onderzoek, en

      f. het ontwikkelen of het verzorgen van andere dan de in het eerste lid, onderdelen b en c, bedoelde opleidingen
      van een door Onze Minister aan te wijzen categorie van personen.

      2 Het LSOP kan andere werkzaamheden uitvoeren, dan die welke rechtstreeks voortvloeien uit de in het eerste lid
      bedoelde taken, mits die werkzaamheden:

      a. samenhangen met de in het eerste lid bedoelde taken;

      b. niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van vergelijkbare diensten, en

      c. tegen ten minste kostendekkende prijzen worden verricht.

      3 Bij ministeriële regeling worden nadere regels over de uit te voeren andere werkzaamheden, bedoeld in het tweede
      lid, gesteld.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel3
  - number: '4'
    text: De organen van het LSOP zijn het college van bestuur en de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het college van bestuur is belast met het bestuur en het beheer van het LSOP. Daartoe oefent het college van
      bestuur de taken en bevoegdheden uit die niet zijn voorbehouden aan de raad van toezicht.

      2 Het college van bestuur vertegenwoordigt het LSOP in en buiten rechte.

      3 Het college van bestuur stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:

      a. de werkwijze van het college van bestuur,

      b. de samenstelling en de werkwijze van de leiding van de instellingen en vestigingen van het LSOP,

      c. de wijze waarop het college van bestuur de uitoefening van zijn taken en bevoegdheden afstemt met die van de
      raad van toezicht, en

      d. de wijze waarop de leden van het college van bestuur en van de raad van toezicht het voornemen tot het
      aanvaarden van een nevenfunctie anders dan uit hoofde van hun functie aan Onze Minister melden.

      4 Het bestuursreglement, alsmede de wijzigingen daarvan behoeven de instemming van Onze Minister. Het college van
      bestuur legt daartoe het bestuursreglement en een document waaruit de opvatting van de raad van toezicht hierover
      blijkt, voor aan Onze Minister.

      5 Het bestuursreglement, alsmede de wijzigingen daarvan worden bekendgemaakt in de Staatscourant.

      6 Het college van bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde
      inlichtingen en andere gegevens.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het college van bestuur bestaat uit drie leden, onder wie de voorzitter.

      2 De leden worden benoemd, herbenoemd, geschorst en ontslagen bij koninklijk besluit. Een voordracht wordt niet
      gedaan dan nadat de raad van toezicht in de gelegenheid is gesteld zijn zienswijze hierover kenbaar te maken.

      3 Bij de samenstelling van het college van bestuur wordt ervoor zorg gedragen dat ten minste één lid ambtenaar
      is als bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1], en dat onderwijskundige expertise wordt
      gewaarborgd.

      4 De leden worden benoemd voor een periode van zes jaar. Zij kunnen eenmaal worden herbenoemd.

      5 Zolang in een vacature van het college van bestuur niet is voorzien, vormen de overblijvende leden het college,
      met de bevoegdheid van het voltallige college, met dien verstande dat rechtsgeldige besluiten slechts kunnen worden
      genomen door ten minste twee leden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '7'
    text: |-
      1 De raad van toezicht is belast met:

      a. het bewaken van de doelstelling en de strategie van het LSOP, en

      b. het toezien op de taakuitoefening door het college van bestuur.

      2 Onverminderd [artikel 26][ref1], behoeven de volgende besluiten van het college van bestuur de instemming van de
      raad van toezicht:

      a. besluiten inzake fusie, splitsing, reorganisatie, sluiting of opheffing van instellingen of vestigingen van het
      LSOP, en

      b. besluiten inzake het aankopen, bezwaren of vervreemden van onroerende zaken.

      3 De raad van toezicht geeft gevraagd en ongevraagd het college van bestuur zijn zienswijze over de taakuitoefening
      door het college van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel26
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '26'
        hoofdstuk: VI
  - number: '8'
    text: |-
      1 De raad van toezicht bestaat uit ten minste vijf en ten hoogste zeven leden, onder wie de voorzitter.

      2 De functie van lid van de raad van toezicht is niet verenigbaar met de functie van lid van het college van
      bestuur.

      3 In de raad van toezicht worden geen ambtenaren benoemd voor wie Onze Minister het bevoegd gezag is.

      4 De raad van toezicht stelt regels vast omtrent zijn werkwijze. Deze regels behoeven de instemming van Onze
      Minister.

      5 Het college van bestuur draagt zorg voor de ondersteuning van de raad van toezicht.

      6 Onze Minister kent de leden van de raad van toezicht, ten laste van het LSOP, een vergoeding toe voor hun
      werkzaamheden. De leden hebben aanspraak op vergoeding door het LSOP van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 De leden van de raad van toezicht worden benoemd, herbenoemd, geschorst en ontslagen bij koninklijk besluit.

      2 De leden worden benoemd voor een periode van vier jaar. Zij kunnen eenmaal worden herbenoemd.

      3 Zolang in een vacature van de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad, met de
      bevoegdheid van de voltallige raad.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel9
  - number: '10'
    text: |-
      1 Tot het personeel van het LSOP worden in ieder geval gerekend:

      a. de leden van het college van bestuur,

      b. de ambtenaren in dienst van het LSOP, en

      c. de bij het LSOP anders dan met het oog op het ontvangen van onderwijs gedetacheerde ambtenaren van politie.

      2 Het personeel van het LSOP, bedoeld in het eerste lid, onderdeel b, wordt benoemd, geschorst en ontslagen door
      het college van bestuur, voor zover bij of krachtens deze wet niet anders is bepaald.

      3 Bij algemene maatregel van bestuur kunnen ambtenaren, bedoeld in het eerste lid, onderdeel b, worden aangewezen,
      die worden benoemd, geschorst en ontslagen bij koninklijk besluit.

      4 Ambtenaren van politie, bedoeld in het eerste lid, onderdeel c, worden door de korpschef op verzoek van het
      college van bestuur bij het LSOP gedetacheerd.

      5 Voor zover bij of krachtens deze wet niet anders is bepaald, zijn de bij of krachtens
      [artikel 47, eerste lid, van de Politiewet 2012][ref1] gestelde regels van overeenkomstige toepassing op het
      personeel van het LSOP. Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven,
      indien dit in verband met enige andere bepaling uit deze wet is vereist. De Wet veiligheidsonderzoeken is van
      overeenkomstige toepassing op het personeel van het LSOP.

      6 [Artikel 47, derde lid, van de Politiewet 2012][ref2] is van overeenkomstige toepassing op het personeel van
      het LSOP.

      7 [Artikel 47, vierde lid, van de Politiewet 2012][ref3] is van overeenkomstige toepassing op het LSOP.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel47
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel10
