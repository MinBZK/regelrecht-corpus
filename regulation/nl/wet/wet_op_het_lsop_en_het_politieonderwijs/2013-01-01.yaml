        artikel: '14'
        hoofdstuk: V
  - number: '16'
    text: |-
      Elke opleiding wordt afgesloten met een examen dat door het LSOP wordt afgenomen. Het examen omvat een
      onafhankelijk onderzoek naar de competenties waarover de student bij voltooiing van de opleiding dient te
      beschikken.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het college van bestuur geeft de studenten de gelegenheid een examen af te leggen en draagt zorg voor de
      uitvoering van het examen.

      2 Ten bewijze dat een examenonderdeel met goed gevolg is afgelegd, wordt een bewijsstuk uitgereikt. Indien het
      examenonderdeel een deelkwalificatie betreft, wordt een certificaat uitgereikt. Ten bewijze dat een examen met
      goed gevolg is afgelegd wordt een diploma uitgereikt. Het examen van een opleiding is eerst dan met goed gevolg
      afgesloten indien zowel het duale opleidingsdeel als het overige deel van het onderricht met goed gevolg is
      afgesloten.

      3 Het college van bestuur stelt ten minste een examencommissie in ten behoeve van de organisatie en het afnemen van
      de examens voor elke door het LSOP verzorgde opleiding of groepen van opleidingen.

      4 Het college van bestuur benoemt de leden van de examencommissie.

      5 Ten behoeve van het afnemen van het examen wijst de examencommissie examinatoren aan. Het college van bestuur
      kan in afwijking van de eerste volzin bepalen dat een of meer examens worden afgenomen door andere examinatoren dan
      bedoeld in die volzin.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel17
  - number: '18'
    text: |-
      1 Het college van bestuur stelt ten minste een commissie van beroep voor de examens in.

      2 Beslissingen van het college van bestuur ter uitvoering van de
      [artikelen 13, zevende lid juncto negende lid][ref1], of [17][ref2], of beslissingen van de degenen die het
      examenonderdeel of het examen hebben samengesteld of afgenomen, kunnen worden onderworpen aan het oordeel van de
      commissie.

      3 De commissie bestaat uit een oneven aantal leden, onder wie de voorzitter. De leden worden benoemd, herbenoemd,
      geschorst en ontslagen door het college van bestuur. De leden maken geen deel uit van het college van bestuur,
      en hebben niet het examenonderdeel of het examen samengesteld of afgenomen dat aan het oordeel van de commissie
      is onderworpen.

      4 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref3] bedraagt de termijn voor het indienen van
      het beroepschrift zes dagen. In afwijking van [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref4]
      beslist de commissie binnen vier weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      beroepschrift is verstreken tenzij zij deze termijn heeft verlengd met ten hoogste twee weken.

      5 De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de student in de gelegenheid zal worden gesteld het examen of het examenonderdeel alsnog of opnieuw af
      te leggen. De beslissing van de commissie wordt bekendgemaakt aan de student, de leiding van de desbetreffende
      instelling van het LSOP alsmede aan de korpschef.

      6 Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. In afwijking
      van [artikel 7:25 van de Algemene wet bestuursrecht][ref5], is de commissie niet bevoegd in de plaats van het
      geheel of gedeeltelijk vernietigde besluit een nieuw besluit te nemen. Zij kan bepalen dat opnieuw of, indien
      de beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat het examenonderdeel of het examen
      opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. Het college van bestuur of degene die het
      examenonderdeel of het examen heeft samengesteld of afgenomen, van wie de beslissing is vernietigd, voorziet voor
      zover nodig opnieuw in de zaak met inachtneming van de uitspraak van de commissie. De commissie kan daarvoor in
      haar uitspraak een termijn stellen.

      7 In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek na de
      desbetreffende examinator te hebben gehoord, althans te hebben opgeroepen.

      8 Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0014623#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel724
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel725
