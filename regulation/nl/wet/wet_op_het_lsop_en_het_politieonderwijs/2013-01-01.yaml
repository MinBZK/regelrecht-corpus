      - id: ref2
        bwb_id: BWBR0005682
  - number: '21'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de organisatie, de werkwijze
      en de bekostiging van de politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel21
  - number: '22'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gegeven over het beheer van het LSOP.

      2 Onze Minister houdt toezicht op het financiële beheer van het LSOP. De [artikelen 203][ref1],
      [205 tot en met 211 van de Gemeentewet][ref2] zijn daarbij van overeenkomstige toepassing. Bij de algemene
      maatregel van bestuur, bedoeld in het eerste lid, worden over deze toepassing nadere regels gegeven.

      3 Het college van bestuur draagt zorg voor de archiefbescheiden van het LSOP, voor zover deze niet zijn
      overgebracht naar het Algemeen Rijksarchief. Onze Minister kan bij de algemene maatregel van bestuur, bedoeld in
      het eerste lid, regels geven over de zorg voor en de bewaring van de archiefbescheiden van het LSOP.

      4 Het oprichten of mede-oprichten van privaatrechtelijke rechtspersonen door het LSOP is slechts toegestaan met
      instemming van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel205
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '203'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '205'
  - number: '23'
    text: |-
      Bij ministeriële regeling worden criteria vastgesteld aan de hand waarvan het college van bestuur na overleg met de
      politiekorpsen de studenten verdeelt over de instellingen en de vestigingen van het LSOP.
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel23
  - number: '24'
    text: |-
      In het beleidsplan, bedoeld in [artikel 18, eerste lid, van de Politiewet 2012][ref1], worden door Onze Minister
      tevens de hoofdzaken van het beleid op rijksniveau met betrekking tot de werving, selectie en opleiding van
      ambtenaren van politie en van andere door Onze Minister aan te wijzen categorieën van personen aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
  - number: '25'
    text: |-
      Onze Minister voert jaarlijks overleg met het college van bestuur over de taken, bedoeld in
      [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '3'
        hoofdstuk: II
  - number: '26'
    text: |-
      1 Het college van bestuur stelt, met inachtneming van het in [artikel 24][ref1] bedoelde beleidsplan, ten minste
      eenmaal in de vier jaar een beleidsplan vast.

      2 Het college van bestuur stelt jaarlijks een begroting voor het volgende kalenderjaar en een meerjarenraming
      voor de daarop volgende drie jaren vast, alsmede een jaarplan, de organisatie en de formatie voor het volgende
      kalenderjaar. Het jaarplan en de begroting bevatten een nadere uitwerking van het beleidsplan, bedoeld in het
      eerste lid.

      3 De door het college van bestuur vastgestelde stukken, bedoeld in het eerste en tweede lid, behoeven de instemming
      van de raad van toezicht. Indien de raad van toezicht zijn instemming aan een of meer van deze stukken onthoudt,
      legt het college van bestuur deze stukken en een document waaruit de zienswijze van de raad van toezicht hierover
      blijkt, voor aan Onze Minister die alsdan een besluit neemt.

      4 De stukken, bedoeld in het eerste en tweede lid, worden na de vaststelling ervan door het college van bestuur
      vóór 15 november aan Onze Minister gezonden. De stukken worden algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel24
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '24'
        hoofdstuk: VI
  - number: '27'
    text: |-
      1 Onze Minister stelt jaarlijks ten laste van de begroting van het Ministerie van Veiligheid en Justitie aan het
      LSOP bijdragen ter beschikking.

      2 Onverminderd het eerste lid, kan het LSOP geldmiddelen verwerven door het aanvaarden van geldmiddelen van derden
      in de vorm van schenkingen en legaten, door het aangaan van geldleningen, door inkomsten uit eigen beheer, en uit
      andere hoofde.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de doorberekening van een deel van de
      opleidingskosten door het LSOP aan de politie.

      4 Het LSOP gebruikt de geldmiddelen, bedoeld in het eerste tot en met het derde lid, uitsluitend ter vervulling van
      de taken, voortvloeiend uit [artikel 3][ref1].

      5 Indien blijkt dat de geldmiddelen voor het LSOP aanmerkelijk tekort zullen schieten om in de noodzakelijke
      behoeften te voorzien, kan door Onze Minister aan het LSOP een aanvullende bijdrage beschikbaar worden gesteld.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gegeven betreffende de omvang en de bestemming van
      het vermogen van het LSOP. Indien het LSOP niet voldoet aan deze regels kan Onze Minister besluiten tot aanpassing
      van de hoogte van de bijdragen die aan het LSOP beschikbaar worden gesteld.

      7 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën kunnen regels worden gegeven over de wijze waarop dit artikel wordt uitgevoerd.

      8 Het sluiten van geldleningen, bedoeld in het tweede lid, kan onder voorwaarden geschieden bij Onze Minister van
      Financiën ten laste van de begroting van Nationale Schuld.

      9 Het LSOP houdt zijn liquide middelen rentedragend aan in 's Rijks schatkist.

      10 Het sluiten van huur-, verkoop- en lease-overeenkomsten door het LSOP met een waarde gelijk aan of meer dan het
      bedrag zoals vastgesteld in de nadere voorschriften gesteld krachtens [artikel 34 van de Comptabiliteitswet][ref2],
      dan wel voor een periode langer dan tien jaar, geschiedt na verkregen instemming van Onze Minister in
      overeenstemming met Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel34
    url: https://wetten.overheid.nl/BWBR0014623/2013-01-01#Artikel27
