  - number: 26c
    text: |-
      Voor de behandeling van een verzoek om een ingevolge deze wet door de Dienst Wegverkeer, bedoeld in
      [artikel 4][ref1], te verrichten keuring van een vervoermiddel is een vergoeding verschuldigd. De Dienst Wegverkeer
      stelt de hoogte van de vergoeding alsmede de wijze van betaling vast. [Artikel 4][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4q
  - number: '27'
    text: |-
      1 Invoer van vlees heeft plaats langs de door Onze Minister van Volksgezondheid, Welzijn en Sport aan te wijzen
      grensinspectieposten, waar het door een door Onze Minister van Volksgezondheid, Welzijn en Sport aan te wijzen
      ambtenaar wordt gekeurd.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan de invoer toestaan van vlees dat zich bevindt in of
      op een middel van vervoer en uitsluitend is bestemd voor het persoonlijk gebruik van hen die daarin of daarop
      verblijven.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel27
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald, onder welke voorwaarden de invoer van vlees
      geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel28
  - number: '29'
    text: |-
      1 Ingevoerd vlees wordt goedgekeurd of afgekeurd en als zodanig gemerkt overeenkomstig bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften.

      2 Afgekeurd vlees wordt door de zorg van de ambtenaar, bedoeld in [artikel 27, eerste lid][ref1], onbruikbaar
      gemaakt voor voedsel voor mens en dier, tenzij het bij algemene maatregel van bestuur te stellen voorwaarden door
      de belanghebbenden wordt teruggezonden naar het land van verzending of toestemming wordt gegeven voor gebruik voor
      andere doeleinden dan menselijke consumptie.

      3 Onbruikbaarmaking voor voedsel voor mens en dier geschiedt onverwijld, indien het vlees dreigt in ontbinding over
      te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel27
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '27'
  - number: '30'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald:

      a. welke vleeswaren ingevoerd mogen worden;

      b. onder welke voorwaarden de invoer van die vleeswaren geoorloofd is.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan de invoer toestaan van vleeswaren, die niet in de
      algemene maatregel van bestuur of de daarop berustende besluiten zijn genoemd, indien zij zich bevinden in of
      op middelen van vervoer en bestemd zijn uitsluitend voor het persoonlijk gebruik van hen, die daarin of daarop
      verblijven.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel30
  - number: 30a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld ter uitvoering van een
      bindend besluit inzake slachtdieren, vlees, vleeswaren of andere producten van dierlijke oorsprong, van de Raad
      van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese
      Gemeenschappen, dat betreft:

      a. de bescherming van de volksgezondheid; of

      b. het heffen van een retributie voor de kosten die verbonden zijn aan krachtens het desbetreffende besluit
      voorgeschreven keuringen.

      2 Bij een in het eerste lid bedoelde algemene maatregel van bestuur kunnen een of meer van de voorgaande bepalingen
      buiten werking worden gesteld, voor zover het desbetreffende bindend besluit binnen twaalf maanden na bekendmaking
      uitgevoerd dient te zijn.

      3 Een krachtens het tweede lid vastgestelde bepaling vervalt een jaar na inwerkingtreding. Deze termijn kan eenmaal
      met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel30a
  - number: 30c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen omtrent de monsterneming, bedoeld in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1], nadere regels worden gesteld. Deze kunnen onder meer
      betrekking hebben op:

      a. hetgeen als partij wordt aangemerkt;

      b. het aantal eenheden of de hoeveelheid, waaruit het uit de partij te nemen monster moet bestaan;

      c. de wijze waarop uit de uitkomsten, verkregen uit het onderzoek van het monster, de uitslag voor de gehele partij
      wordt afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: 30d
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan voor het vaststellen dat met betrekking tot vlees of
      vleeswaren aan bij of krachtens deze wet gestelde regels, bij of krachtens de maatregel aangegeven, al dan niet is
      of wordt voldaan, een bij of krachtens de maatregel omschreven methode van onderzoek worden aangewezen.

      2 In gevallen waarin toepassing is gegeven aan het eerste lid, kan bij of krachtens algemene maatregel van
      bestuur tevens worden bepaald dat voor de vaststelling of aan bedoelde regels al dan niet is of wordt voldaan, de
      aangewezen methode van onderzoek bij uitsluiting beslissend is.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel30d
  - number: '31'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij besluit van Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren van het
      Staatstoezicht op de volksgezondheid;

      b. de aan de keuringsdienst verbonden dierenartsen en keurmeesters van slachtdieren en van vlees;

      c. de bij besluit van Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid, onder *a* en *c*, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.

      3 Onze Minister van Volksgezondheid, Welzijn en Sport kan, in gevallen waarin zulks naar zijn oordeel in het belang
      van een doelmatig toezicht geboden is, aan het hoofd van de keuringsdienst met betrekking tot de uitoefening van
      het toezicht door de in het eerste lid bedoelde ambtenaren van zijn dienst een bindende aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel31
  - number: 31a
    text: |-
      Van elke krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzochte zaak, wordt aan de
      belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee haar verkoopwaarde ten
      gevolge van het onderzoek is verminderd. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld omtrent de wijze waarop de vergoeding wordt vastgesteld en uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: 31d
    text: |-
      De in [artikel 31][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover deze bevoegdheid strekt tot het zich begeven naar en
      het betreden van in de woning aanwezige bedrijfsruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel31
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '31'
  - number: 31g
    text: |-
      1 Voor zover het in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] bedoelde onderzoek niet geschiedt
      ter plaatse waar de zaak is aangetroffen, wordt het uitgevoerd in het laboratorium van de ter plaatse bevoegde
      keuringsdienst, met dien verstande dat het hoofd van deze dienst bevoegd is in gevallen waarin hij zulks in het
      belang van een doelmatige uitvoering van het onderzoek raadzaam acht, het onderzoek geheel of voor een deel te
      laten uitvoeren in het laboratorium van een andere keuringsdienst.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan, zo nodig onder het stellen van nadere regels,
      categorieën van gevallen aanwijzen, waarin het onderzoek, in afwijking van het eerste lid, geheel of voor een deel
      wordt uitgevoerd in een daartoe in het bijzonder uitgerust ander laboratorium, door hem te dien einde aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '34'
    text: |-
      Het is verboden:

      a. een aan keuring onderworpen slachtdier zonder vergunning te slachten;

      b. een aan keuring onderworpen slachtdier te slachten zonder inachtneming van de voorwaarden, waaronder vergunning
      tot slachten is verleend, of van de krachtens [artikel 18, tweede lid][ref1], vastgestelde voorschriften met
      betrekking tot de wijzen, waarop slachtdieren mogen worden geslacht;

      c. een geslacht dier, dat niet verkeert in de toestand, beschreven in de krachtens
      [artikel 18, eerste lid, letter ][ref2], vastgestelde voorschriften, ter keuring aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel18
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '18'
  - number: '35'
    text: |-
      Het is verboden vlees, dat aan keuring is onderworpen, doch niet overeenkomstig deze wet of de te harer uitvoering
      gegeven voorschriften is gekeurd, of dat na keuring niet van het voorgeschreven merk is voorzien, te verkopen,
      te koop aan te bieden, af te leveren, ten geschenke te geven, te vervoeren of te doen vervoeren, anders dan ter
      naleving van enig wettelijk voorschrift, of ter aflevering voorhanden te hebben, of, tenzij in afwachting van
      keuring, in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel35
  - number: '37'
    text: |-
      Het is verboden zonder inachtneming van de ten aanzien van de invoer van vleeswaren gegeven voorschriften
      vleeswaren in te voeren, of deze ingevoerde vleeswaren te verkopen, te koop aan te bieden, af te leveren, ten
      geschenke te geven, tot vervoer of aflevering voorhanden te hebben, in voorraad te hebben, te vervoeren of te doen
      vervoeren.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel37
  - number: '38'
    text: |-
      Het hoofd of de bestuurder van een onderneming, die een inrichting exploiteert, als genoemd in [artikel 19][ref1],
      dan wel degene, die de feitelijke leiding heeft in zodanige inrichting, neemt alle maatregelen, nodig
      om te verzekeren, dat daarin geen der voorschriften van de algemene maatregel van bestuur, bedoeld in
      [artikel 2, tweede lid][ref2], en van die, bedoeld in [artikel 19][ref3], worden overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '19'
  - number: '39'
    text: |-
      Het is verboden:

      a. vlees wederrechtelijk te onttrekken aan keuring, herkeuring of aan bruikbaarmaking voor voedsel voor mens en
      dier;

      b. vleeswaren, die bereid zijn in strijd met de voorschriften, gesteld bij of krachtens de algemene maatregel van
      bestuur, bedoeld in [artikel 2, tweede lid][ref1], te verkopen, te koop aan te bieden, af te leveren, ten geschenke
      te geven, tot vervoer of aflevering voorhanden te hebben, in voorraad te hebben, of, tenzij ter naleving van enig
      wettelijk voorschrift, te vervoeren of te doen vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '2'
  - number: 46a
    text: |-
      1 In gevallen waarin een spoedige voorziening krachtens deze wet in het belang van de volksgezondheid of ter
      uitvoering van een bindend besluit als bedoeld in [artikel 30a, eerste lid][ref1], zo dringend geboden is dat
      de totstandkoming van een daartoe strekkende algemene maatregel van bestuur niet kan worden afgewacht, kan Onze
      Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en
      Visserij, ter zake bij ministeriële regeling voorlopig geldende regels stellen.

      2 Een in het eerste lid bedoelde ministeriële regeling vervalt een jaar na inwerkingtreding of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop die maatregel in werking treedt. Deze termijn kan door Onze Minister van Volksgezondheid, Welzijn en Sport,
      in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, eenmaal met ten hoogste een jaar
      worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel30a
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: 30a
  - number: '47'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur krachtens deze wet
      wordt Ons gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Ministers
      wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel47
  - number: '49'
    text: Alle stukken, uit deze wet voortvloeiende, zijn vrij van kosten.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel49
  - number: '50'
    text: |-
      1 Deze wet is niet van toepassing op:

      a. slachtdieren, welke krachtens de bepalingen van de [Veewet][ref1] ter keuring worden aangeboden;

      b. vlees, hetwelk is goedgekeurd krachtens de [Veewet][ref2] en naar het buitenland wordt uitgevoerd;

      c. slachtdieren en vlees, welke aan wetenschappelijk onderzoek worden onderworpen in door Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen inrichtingen, met inachtneming van door hem gegeven voorschriften.

      2 Zodra bij keuring krachtens de [Veewet][ref3] vlees niet voor uitvoer naar het buitenland wordt geschikt
      bevonden, wordt het verder onderworpen aan keuring volgens de voorschriften van deze wet, welke dan op dit vlees
      van toepassing is.

      3 Indien vlees voorzien is van een merk als bedoeld in [artikel 68 van de Veewet][ref4] en niet naar het buitenland
      wordt uitgevoerd, wordt het geacht te zijn goedgekeurd krachtens [artikel 12 van de Vleeskeuringswet][ref5] ten
      bewijze waarvan een merk als bedoeld in [artikel 16][ref6] van die wet wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001900
      [ref2]: https://wetten.overheid.nl/BWBR0001900
      [ref3]: https://wetten.overheid.nl/BWBR0001900
      [ref4]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref5]: https://wetten.overheid.nl/BWBR0001896#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0001896#Artikel16
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel50
    references:
