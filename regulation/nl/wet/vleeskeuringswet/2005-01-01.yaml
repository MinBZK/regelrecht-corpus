  - number: '19'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter wering van voor de volksgezondheid schadelijke
      producten eisen worden gesteld, waaraan slachterijen, uitsnijderijen, vleeswinkels, bewaarplaatsen van vlees,
      vleeswarenfabrieken, vetsmelterijen, inrichtingen tot bewaring van bloed en bloedplasma en tot verwerking van
      bloed tot bloedplasma of bloedplasmapoeder en andere inrichtingen, bestemd tot of gebruikt voor het bewerken,
      voorverpakken of verduurzamen van vlees of het bereiden, bewerken of voorverpakken van vleeswaren moeten voldoen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen

      a. regels worden gesteld ter zake van het gebruik van inrichtingen als bedoeld in het eerste lid en de daarin
      aanwezige toestellen en gereedschappen;

      b. eisen worden gesteld waaraan

      1°. personen die in een inrichting als bedoeld in het eerste lid werkzaam zijn, moeten voldoen voor wat betreft hun
      gezondheidstoestand en hun persoonlijke hygiëne en

      2°. het vlees en de vleeswaren welke in een inrichting als bedoeld in het eerste lid aanwezig zijn, moeten voldoen.

      3 Het is verboden bij wege van bedrijf:

      a. te slachten,

      b. vlees te bewaren, te bewerken, voor te verpakken, te verduurzamen of te verkopen,

      c. vleeswaren te bewaren, te bereiden, te bewerken of voor te verpakken,

      elders dan in inrichtingen, bedoeld in het eerste lid, die aan de daaraan krachtens dat lid gestelde eisen voldoen,
      die overeenkomstig de krachtens het tweede lid, onder *a*, gestelde regels worden gebruikt, waar ten aanzien van
      het gebruik van daarin aanwezige toestellen en gereedschappen aan de krachtens laatstgenoemde bepaling gestelde
      regels wordt voldaan of waar de daarin werkzame personen, het daarin aanwezige vlees of de daarin aanwezige
      vleeswaren aan de krachtens het tweede lid, onder *b* 1° onderscheidenlijk 2°, gestelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel19
  - number: 19a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ter wering van voor de volksgezondheid schadelijke produkten
      worden bepaald, dat de oprichting, het hebben of het gebruiken van bepaalde soorten van inrichtingen, als in
      [artikel 19][ref1] bedoeld, slechts mag plaatsvinden met tot wederopzegging te verlenen vergunning van Onze
      Minister van Volksgezondheid, Welzijn en Sport en onder inachtneming van door deze tot hetzelfde doel aan de
      vergunning zo nodig te verbinden voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
  - number: 20a
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit stelt in overeenstemming met Onze Minister van
      Volksgezondheid, Welzijn en Sport regels vast met betrekking tot de door de keuringsdienst uit te voeren
      werkzaamheden. Deze regels hebben in ieder geval betrekking op:

      a. de plaats voor de kennisgeving, bedoeld in de [artikelen 6][ref1] en [7][ref2];

      b. de plaats en de tijd voor de keuring vóór en ná het slachten;

      c. de termijn binnen welke de kennisgeving, bedoeld in [artikel 7][ref3] en de termijn binnen welke na de
      kennisgeving, bedoeld in de [artikelen 6][ref4] en [7][ref5], de keuring moet geschieden;

      d. de ambtenaren die met de keuring, zomede degenen die met de herkeuring zijn belast;

      e. het kennis geven van de ingebruikneming van een inrichting als bedoeld in [artikel 19][ref6];

      f. al hetgeen voorts voor een goede regeling van de keuringsdienst nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel7
