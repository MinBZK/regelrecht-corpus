  - number: '18'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald:

      a. de vorm voor de kennisgeving, bedoeld in de [artikelen 6][ref1] en [7][ref2];

      b. wat bij de keuring onderzocht moet worden;

      c. in welke gevallen moet worden afgekeurd of voorwaardelijk goedgekeurd;

      d. in welke toestand een geslacht dier moet verkeren, totdat met de keuring wordt begonnen;

      e. de modellen voor de vergunning en de voorwaardelijke vergunning tot slachten, bedoeld in [artikel 11][ref3];

      f. op welke wijze voorwaardelijk goedgekeurd vlees bruikbaar mag worden gemaakt voor voedsel;

      g. op welke wijze slachtdieren bij de keuring vóór het slachten en vlees bij keuring of herkeuring worden gemerkt;

      h. de termijn, binnen welke herkeuring moet worden aangevraagd en de wijze, waarop de herkeuring moet worden
      geregeld;

      i. aan welke voorschriften bij het vervoeren van vlees anders dan met bestemming voor huishoudelijk gebruik door de
      vervoerder of de ontvanger moet worden voldaan, het laden en lossen daaronder begrepen.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijzen,
      waarop slachtdieren mogen worden geslacht.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorts in het belang van de volksgezondheid voorschriften
      worden gegeven met betrekking tot

      a. de kenmerken, waarvan ter slachting aangeboden slachtdieren dienen te zijn voorzien, of

      b. de bescheiden, waarvan ter slachting aangeboden slachtdieren dienen te zijn vergezeld,

      bij gebreke van welke kenmerken of bescheiden voorwaardelijke vergunning tot slachten, bedoeld in
      [artikel 11][ref4], wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001896#Artikel11
