  - number: '25'
    text: |-
      Met keuring van slachtdieren en met de keuring en herkeuring van vlees worden alleen belast personen, die krachtens
      de wet de bevoegdheid hebben verworven de diergeneeskunst in haar volle omvang uit te oefenen; met de keuring van
      slachtdieren en van vlees, onder toezicht en verantwoordelijkheid van deze personen, kunnen in de bij algemene
      maatregel van bestuur aan te wijzen gevallen mede worden belast personen, die volgens regels, bij of krachtens
      algemene maatregel van bestuur te stellen, bevoegd zijn als keurmeester van slachtdieren en van vlees op te treden.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel25
  - number: 26a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat overeenkomstig daarbij te stellen regels
      een retributie kan worden geheven voor de kosten van:

      a. bij of krachtens deze wet voorgeschreven keuringen van:

      1°. slachtdieren waarop deze wet van toepassing is; of

      2°. vlees, vleeswaren, of andere producten van dierlijke oorsprong;

      b. de behandeling door de keuringsdienst van een aanvraag om een vergunning, om een erkenning van een inrichting,
      of van een aanvraag tot inschrijving van een inrichting in een register;

      c. de behandeling door de keuringsdienst van een aanvraag tot verlenging van een vergunning, tot verlenging van
      een erkenning van een inrichting of van een aanvraag tot herinschrijving van een inrichting in een register, of van
      vooraf aangekondigde en vastgelegde controles of nog steeds aan de toelatingseisen van de vergunning, erkenning of
      registratie wordt voldaan.

      2 Een in het eerste lid bedoelde retributie wordt zodanig vastgesteld dat de baten niet uitgaan boven de kosten die
      in een rechtstreeks verband staan met de werkzaamheden waarvoor de retributie wordt geheven.

      3 Bij een in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat Onze Minister van
      Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Ministers wie het mede aangaat, met het oog op de
      goede uitvoering van in die maatregel geregelde onderwerpen bij ministeriële regeling nadere regels stelt of kan
      stellen.

      4 Onder keuring in dit artikel wordt mede begrepen de controle van daarbij voorgeschreven documenten, en van
      overeenstemming tussen deze documenten en de slachtdieren, vleeswaren, producten van dierlijke oorsprong, of het
      vlees waarop die documenten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel26a
  - number: 26b
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de kosten, bedoeld in de
      [artikelen 13][ref1] en [17][ref2], alsmede omtrent de bij of krachtens algemene maatregel van bestuur aan te
      wijzen kosten verbonden aan de uitvoering van verordeningen, richtlijnen of beschikkingen als bedoeld in artikel
      249 van het Verdrag tot oprichting van de Europese Gemeenschap.

      2 [Artikel 26a, tweede, derde en vierde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel13
