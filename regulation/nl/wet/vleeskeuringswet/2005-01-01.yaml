preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is bepalingen vast te stellen tot wering van vleesch-
    en vleeschwaren, die voor de volksgezondheid schadelijk zijn;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder slachtdieren: eenhoevige dieren, runderen, schapen, geiten, varkens, buffels, rendieren
      en kangoeroes.

      2. Bij algemene maatregel van bestuur kan deze wet geheel of ten dele op andere dieren dan in het eerste lid
      bedoelde van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel1
  - number: '2'
    text: |-
      1 Deze wet verstaat onder:

      a. vlees: gestorven of gedode slachtdieren, of delen van deze, daaronder begrepen ongeboren vruchten, mits die
      dieren of die delen noch verduurzaamd, tenzij door afkoeling, noch toebereid zijn.

      Van de voorgaande bepaling zijn uitgezonderd hoornen, hoeven, klauwen, borstels, wol, huiden, voor zover deze
      laatste niet afkomstig zijn van varkens, en andere bij of krachtens algemene maatregel van bestuur aan te geven,
      voor technische doeleinden of voor voedering van dieren bestemde, delen;

      b. vleeswaren: verduurzaamd, tenzij door afkoeling, of toebereid vlees, ook indien het met andere stoffen vermengd
      is, met uitzondering van bij of krachtens algemene maatregel van bestuur aangewezen vleesproducten.

      2 Bij algemene maatregel van bestuur worden in het belang van de volksgezondheid voorschriften gegeven betreffende
      het verduurzamen en toebereiden van vlees en wordt bepaald, welke stoffen bij het bereiden van vleeswaren niet
      mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Deze wet verstaat onder doden in nood: het doden van een slachtdier,

      a. dat door een ongeval ernstig is getroffen;

      b. dat door ziekte in onmiddellijk dreigend levensgevaar verkeert;

      c. dat onmiddellijk gevaar oplevert voor de veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel3
  - number: '4'
    text: |-
      1 Slachtdieren zijn vóór en ná het slachten aan keuring onderworpen.

      2 In nood gedode slachtdieren zijn aan de keuring ná het slachten onderworpen.

      3 Gestorven of doodgeboren slachtdieren en vruchten welke bij het slachten worden aangetroffen, worden onbruikbaar
      gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel4
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald waar in nood gedode en zieke of van ziekte verdachte
      slachtdieren worden gekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Hij, die een slachtdier wil slachten of doen slachten, geeft daarvan vooraf kennis overeenkomstig de voorschriften,
      vastgesteld krachtens [artikel 18][ref1], alsmede de krachtens [artikel 20][ref2], vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel20a
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: 20a
  - number: '7'
    text: |-
      De eigenaar of houder van een slachtdier, dat in nood gedood is, geeft daarvan kennis overeenkomstig de
      voorschriften, vastgesteld krachtens [artikel 18][ref1], alsmede de krachtens [artikel 20a, derde lid][ref2],
      vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel20a
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: 20a
  - number: '11'
    text: |-
      1 De keuring vóór het slachten vindt plaats binnen vierentwintig uren na aankomst in het slachthuis. Bij de keuring
      vóór het slachten wordt vergunning of voorwaardelijke vergunning tot slachten gegeven.

      2 De vergunning vervalt, indien het dier niet is geslacht binnen vierentwintig uren na de keuring.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel11
  - number: '12'
    text: Bij de keuring na het slachten wordt het vlees goedgekeurd, voorwaardelijk goedgekeurd of afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel12
  - number: '13'
    text: |-
      1 De eigenaar van het vlees, dan wel degene, die ter zake in diens rechten treedt, kan, indien hij zich met een
      keuringsbeslissing niet kan verenigen, herkeuring vorderen op kosten van ongelijk.

      2 Bij de herkeuring wordt het vlees goedgekeurd, voorwaardelijk goedgekeurd of afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel13
  - number: '14'
    text: |-
      1 Indien bij de keuring vlees voorwaardelijk is goedgekeurd, niet binnen de, bij deze goedkeuring gestelde, termijn
      aan de voorwaarden is voldaan en herkeuring niet is gevorderd, wordt het vlees onbruikbaar gemaakt voor voedsel
      voor mens en dier.

      2 Indien bij de herkeuring het vlees voorwaardelijk is goedgekeurd en niet binnen de daarbij gestelde termijn aan
      de voorwaarden is voldaan, wordt het vlees onbruikbaar gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Indien bij de keuring het vlees is afgekeurd en herkeuring niet is gevorderd, of indien bij de herkeuring het vlees
      wordt afgekeurd, wordt het onbruikbaar gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel15
  - number: '16'
    text: |-
      Bij de keuring vóór het slachten wordt het slachtdier en bij de keuring of de herkeuring ná het slachten wordt het
      vlees voorzien van één of meer merken.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel16
  - number: '17'
    text: |-
      1 Indien een overtreding van het bepaalde bij of krachtens [artikel 18, eerste lid, onder ][ref1],
      [artikel 35][ref2] of [artikel 39, onder a][ref3], is opgespoord, wordt het vlees, waarmede dat feit is gepleegd,
      in beslag genomen en op kosten van de overtreder, voor zoveel mogelijk, gekeurd en herkeurd.

      2 Indien het vlees wordt goedgekeurd of voorwaardelijk goedgekeurd, wordt het, met goedkeuring van de betrokken
      officier van justitie, aan de belanghebbende teruggegeven, nadat deze de kosten der keuring zal hebben voldaan.

      3 Indien het vlees wordt afgekeurd of indien, in geval van voorwaardelijke goedkeuring, niet binnen de, bij de
      keuring gestelde, termijn aan de voorwaarden is voldaan, wordt het vlees, in het laatste geval, na andermaal in
      beslag te zijn genomen, evenwel tijdens de loop der strafzaak niet dan na verkregen goedkeuring van de betrokken
      officier van justitie, onbruikbaar gemaakt voor voedsel voor mens en dier.

      4 Indien een overtreding van het bepaalde bij of krachtens [artikel 27][ref4], [28][ref5], [30a][ref6], [37][ref7]
      of [39, onder b][ref8], is opgespoord, worden de vleeswaren en het vlees, waarmede het feit is gepleegd, in beslag
      genomen en onbruikbaar gemaakt voor voedsel voor mens en dier, welke onbruikbaarmaking evenwel tijdens de loop van
      de procedure niet kan geschieden dan na verkregen goedkeuring van de betrokken officier van justitie.

      5 In afwijking van het bepaalde in het vierde lid kunnen vleeswaren, die bereid zijn in strijd
      met de voorschriften, gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 2, tweede lid][ref9], indien zij op grond van de uitslag van het bacteriologisch onderzoek geacht
      worden vrij te zijn van kiemen, die voor de gezondheid van de mens schadelijk kunnen zijn, indien zij voorts
      niet bedorven of anderszins ondeugdelijk zijn, en voorzover het belang van de strafvordering zich hiertegen niet
      verzet, bruikbaar worden gemaakt voor voedsel voor mens en dier door sterilisatie, dan wel, ter beoordeling van
      de keuringsdierenarts, onvoorwaardelijk geschikt verklaard voor voedsel voor mens en dier. Dit laatste kan evenwel
      slechts geschieden, indien het geldt een overtreding van [artikel 3][ref10] van bovengenoemde algemene maatregel
      van bestuur ter uitvoering van [artikel 2, tweede lid][ref11]. De gesteriliseerde vleeswaren worden niet aan de
      rechthebbende teruggegeven, dan nadat deze de kosten van bruikbaarmaking heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
