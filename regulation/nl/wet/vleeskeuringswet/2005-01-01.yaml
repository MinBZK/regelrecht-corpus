  - number: '51'
    text: Deze wet kan worden aangehaald onder de titel "Vleeskeuringswet".
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel51
  - number: '52'
    text: |-
      Deze wet treedt in werking met ingang van een, nader door Ons te bepalen, dag. Voor, met name aan te wijzen,
      artikelen kan de inwerkingtreding vroeger worden bepaald dan voor het overige gedeelte der wet.
    url: https://wetten.overheid.nl/BWBR0001896/2005-01-01#Artikel52
