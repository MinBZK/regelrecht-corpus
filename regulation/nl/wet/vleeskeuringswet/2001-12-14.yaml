---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vleeskeuringswet
regulatory_layer: WET
publication_date: '2005-11-01'
valid_from: '2001-12-14'
bwb_id: BWBR0001896
url: https://wetten.overheid.nl/BWBR0001896/2001-12-14
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is bepalingen vast te stellen tot wering van vleesch-
    en vleeschwaren, die voor de volksgezondheid schadelijk zijn;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze wet verstaat onder slachtdieren: eenhoevige dieren, runderen, schapen, geiten, varkens, buffels, rendieren
      en kangoeroes. 2. Bij algemene maatregel van bestuur kan deze wet geheel of ten dele op andere dieren dan in het
      eerste lid bedoelde van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel1
  - number: '2.1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel2
  - number: 2.1.a
    text: |-
      vlees: gestorven of gedode slachtdieren, of delen van deze, daaronder begrepen ongeboren vruchten, mits die
      dieren of die delen noch verduurzaamd, tenzij door afkoeling, noch toebereid zijn. Van de voorgaande bepaling
      zijn uitgezonderd hoornen, hoeven, klauwen, borstels, wol, huiden, voor zover deze laatste niet afkomstig zijn van
      varkens, en andere bij of krachtens algemene maatregel van bestuur aan te geven, voor technische doeleinden of voor
      voedering van dieren bestemde, delen;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel2
  - number: 2.1.b
    text: |-
      vleeswaren: verduurzaamd, tenzij door afkoeling, of toebereid vlees, ook indien het met andere stoffen vermengd is,
      met uitzondering van bij of krachtens algemene maatregel van bestuur aangewezen vleesproducten.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van de volksgezondheid voorschriften gegeven betreffende
      het verduurzamen en toebereiden van vlees en wordt bepaald, welke stoffen bij het bereiden van vleeswaren niet
      mogen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel2
  - number: '3'
    text: 'Deze wet verstaat onder doden in nood: het doden van een slachtdier,'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel3
  - number: 3.a
    text: dat door een ongeval ernstig is getroffen;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel3
  - number: 3.b
    text: dat door ziekte in onmiddellijk dreigend levensgevaar verkeert;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel3
  - number: 3.c
    text: dat onmiddellijk gevaar oplevert voor de veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel3
  - number: '4.1'
    text: Slachtdieren zijn vóór en ná het slachten aan keuring onderworpen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel4
  - number: '4.2'
    text: In nood gedode slachtdieren zijn aan de keuring ná het slachten onderworpen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel4
  - number: '4.3'
    text: |-
      Gestorven of doodgeboren slachtdieren en vruchten welke bij het slachten worden aangetroffen, worden onbruikbaar
      gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel4
  - number: '5.1'
    text: Een slachtdier wordt geslacht en ná het slachten gekeurd in de gemeente, waar het vóór het slachten gekeurd is.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel5
  - number: '5.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald waar in nood gedode en zieke of van ziekte verdachte
      slachtdieren worden gekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel5
  - number: '6'
    text: |-
      Hij, die een slachtdier wil slachten of doen slachten, geeft daarvan vooraf kennis overeenkomstig de voorschriften,
      vastgesteld krachtens [artikel 18][ref1], alsmede de krachtens [artikel 20][ref2], of [artikel 21][ref3]
      vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel21
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: 20a
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '21'
  - number: '7'
    text: |-
      De eigenaar of houder van een slachtdier, dat in nood gedood is, geeft daarvan kennis overeenkomstig de
      voorschriften, vastgesteld krachtens [artikel 18][ref1], alsmede de krachtens [artikel 20a, derde lid][ref2], of
      artikel 21 vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel20a
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: 20a
  - number: '10.1'
    text: |-
      Indien in een gemeente de voorschriften van deze wet of te harer uitvoering gegeven onvoldoende worden nageleefd,
      kunnen Gedeputeerde Staten een of meer bepaalde voorzieningen, daaronder begrepen wijziging of aanvulling van
      verordeningen, voorschrijven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel10
  - number: '10.2'
    text: |-
      Alvorens een besluit te nemen, winnen Gedeputeerde Staten het advies in van de door Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen, ter plaatse bevoegde inspecteur van het Staatstoezicht op de
      volksgezondheid. Van het besluit wordt mededeling gedaan aan de inspecteur door toezending van een afschrift.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel10
  - number: '10.3'
    text: |-
      De werking van het besluit, bedoeld in het eerste lid, wordt opgeschort totdat de beroepstermijn is verstreken of,
      indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel10
  - number: '10.4'
    text: |-
      Het daartoe bevoegde college voert het besluit van Gedeputeerde Staten uit binnen de termijn, bij het besluit
      bepaald.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel10
  - number: '11.1'
    text: Bij de keuring vóór het slachten wordt vergunning of voorwaardelijke vergunning tot slachten gegeven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel11
  - number: '11.2'
    text: |-
      De vergunning vervalt, indien het dier niet geslacht is binnen tweemaal vierentwintig uren na de dag, waarop de
      keuring plaatsvond. Deze termijn kan tweemaal telkens met ten hoogste tweemaal vierentwintig uren verlengd worden.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel11
  - number: '12'
    text: Bij de keuring na het slachten wordt het vlees goedgekeurd, voorwaardelijk goedgekeurd of afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel12
  - number: '13.1'
    text: |-
      De eigenaar van het vlees, dan wel degene, die ter zake in diens rechten treedt, kan, indien hij zich met een
      keuringsbeslissing niet kan verenigen, herkeuring vorderen op kosten van ongelijk.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel13
  - number: '13.2'
    text: Bij de herkeuring wordt het vlees goedgekeurd, voorwaardelijk goedgekeurd of afgekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel13
  - number: '14.1'
    text: |-
      Indien bij de keuring vlees voorwaardelijk is goedgekeurd, niet binnen de, bij deze goedkeuring gestelde, termijn
      aan de voorwaarden is voldaan en herkeuring niet is gevorderd, wordt het vlees onbruikbaar gemaakt voor voedsel
      voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel14
  - number: '14.2'
    text: |-
      Indien bij de herkeuring het vlees voorwaardelijk is goedgekeurd en niet binnen de daarbij gestelde termijn aan de
      voorwaarden is voldaan, wordt het vlees onbruikbaar gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel14
  - number: '15'
    text: |-
      Indien bij de keuring het vlees is afgekeurd en herkeuring niet is gevorderd, of indien bij de herkeuring het vlees
      wordt afgekeurd, wordt het onbruikbaar gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel15
  - number: '16'
    text: |-
      Bij de keuring vóór het slachten wordt het slachtdier en bij de keuring of de herkeuring ná het slachten wordt het
      vlees voorzien van één of meer merken.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel16
  - number: '17.1'
    text: |-
      Indien een overtreding van het bepaalde bij of krachtens [artikel 18, eerste lid, sub i][ref1], [artikel 35][ref2]
      of [artikel 39, sub a][ref3], is opgespoord, wordt het vlees, waarmede dat feit is gepleegd, in beslag genomen en
      op kosten van de overtreder, voor zoveel mogelijk, gekeurd en herkeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel39
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '39'
  - number: '17.2'
    text: |-
      Indien het vlees wordt goedgekeurd of voorwaardelijk goedgekeurd, wordt het, met goedkeuring van de betrokken
      officier van justitie, aan de belanghebbende teruggegeven, nadat deze de kosten der keuring zal hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel17
  - number: '17.3'
    text: |-
      Indien het vlees wordt afgekeurd of indien, in geval van voorwaardelijke goedkeuring, niet binnen de, bij de
      keuring gestelde, termijn aan de voorwaarden is voldaan, wordt het vlees, in het laatste geval, na andermaal in
      beslag te zijn genomen, evenwel tijdens de loop der strafzaak niet dan na verkregen goedkeuring van de betrokken
      officier van justitie, onbruikbaar gemaakt voor voedsel voor mens en dier.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel17
  - number: '17.4'
    text: |-
      Indien een overtreding van het bepaalde bij of krachtens [artikel 27][ref1], [28][ref2], [30a][ref3], [37][ref4]
      of [39, sub b][ref5], is opgespoord, worden de vleeswaren en het vlees, waarmede het feit is gepleegd, in beslag
      genomen en onbruikbaar gemaakt voor voedsel voor mens en dier, welke onbruikbaarmaking evenwel tijdens de loop van
      de procedure niet kan geschieden dan na verkregen goedkeuring van de betrokken officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0001896#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001896#Artikel39
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: 30a
      - id: ref4
        bwb_id: BWBR0001896
        artikel: '37'
      - id: ref5
        bwb_id: BWBR0001896
        artikel: '39'
  - number: '17.5'
    text: |-
      In afwijking van het bepaalde in het vierde lid kunnen vleeswaren, die bereid zijn in strijd met de voorschriften,
      gesteld bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 2, tweede lid][ref1], indien
      zij op grond van de uitslag van het bacteriologisch onderzoek geacht worden vrij te zijn van kiemen, die voor
      de gezondheid van de mens schadelijk kunnen zijn, indien zij voorts niet bedorven of anderszins ondeugdelijk
      zijn, en voorzover het belang van de strafvordering zich hiertegen niet verzet, bruikbaar worden gemaakt voor
      voedsel voor mens en dier door sterilisatie, dan wel, ter beoordeling van de keuringsdierenarts, onvoorwaardelijk
      geschikt verklaard voor voedsel voor mens en dier. Dit laatste kan evenwel slechts geschieden, indien het
      geldt een overtreding van [artikel 3][ref2] van bovengenoemde algemene maatregel van bestuur ter uitvoering van
      [artikel 2, tweede lid][ref3]. De gesteriliseerde vleeswaren worden niet aan de rechthebbende teruggegeven, dan
      nadat deze de kosten van bruikbaarmaking heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '2'
  - number: '18.1'
    text: 'Bij of krachtens algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.a
    text: |-
      de vorm voor de kennisgeving, bedoeld in de [artikelen 6][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel7
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '7'
  - number: 18.1.b
    text: wat bij de keuring onderzocht moet worden;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.c
    text: in welke gevallen moet worden afgekeurd of voorwaardelijk goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.d
    text: in welke toestand een geslacht dier moet verkeren, totdat met de keuring wordt begonnen;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.e
    text: |-
      de modellen voor de vergunning en de voorwaardelijke vergunning tot slachten, bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel11
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '11'
  - number: 18.1.f
    text: op welke wijze voorwaardelijk goedgekeurd vlees bruikbaar mag worden gemaakt voor voedsel;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.g
    text: op welke wijze slachtdieren bij de keuring vóór het slachten en vlees bij keuring of herkeuring worden gemerkt;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.h
    text: de termijn, binnen welke herkeuring moet worden aangevraagd en de wijze, waarop de herkeuring moet worden geregeld;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.1.i
    text: |-
      aan welke voorschriften bij het vervoeren van vlees anders dan met bestemming voor huishoudelijk gebruik door de
      vervoerder of de ontvanger moet worden voldaan, het laden en lossen daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: '18.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven met betrekking tot de wijzen,
      waarop slachtdieren mogen worden geslacht.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: '18.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorts in het belang van de volksgezondheid voorschriften
      worden gegeven met betrekking tot
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.3.a
    text: de kenmerken, waarvan ter slachting aangeboden slachtdieren dienen te zijn voorzien, of
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: 18.3.b
    text: de bescheiden, waarvan ter slachting aangeboden slachtdieren dienen te zijn vergezeld,
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel18
  - number: '19.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter wering van voor de volksgezondheid schadelijke producten
      eisen gesteld, waaraan slachterijen, uitsnijderijen, vleeswinkels, bewaarplaatsen van vlees, vleeswarenfabrieken,
      vetsmelterijen, inrichtingen tot bewaring van bloed en bloedplasma en tot verwerking van bloed tot bloedplasma of
      bloedplasmapoeder en andere inrichtingen, bestemd tot of gebruikt voor het bewerken, voorverpakken of verduurzamen
      van vlees of het bereiden, bewerken of voorverpakken van vleeswaren moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: '19.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.2.a
    text: |-
      regels worden gesteld ter zake van het gebruik van inrichtingen als bedoeld in het eerste lid en de daarin
      aanwezige toestellen en gereedschappen;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.2.b
    text: eisen worden gesteld waaraan
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.2.b.1°
    text: |-
      personen die in een inrichting als bedoeld in het eerste lid werkzaam zijn, moeten voldoen voor wat betreft hun
      gezondheidstoestand en hun persoonlijke hygiëne en
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.2.b.2°
    text: het vlees en de vleeswaren welke in een inrichting als bedoeld in het eerste lid aanwezig zijn, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: '19.3'
    text: 'Het is verboden bij wege van bedrijf:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.3.a
    text: te slachten,
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.3.b
    text: vlees te bewaren, te bewerken, voor te verpakken, te verduurzamen of te verkopen,
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19.3.c
    text: vleeswaren te bewaren, te bereiden, te bewerken of voor te verpakken,
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19
  - number: 19a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ter wering van voor de volksgezondheid schadelijke produkten
      worden bepaald, dat de oprichting, het hebben of het gebruiken van bepaalde soorten van inrichtingen, als in
      [artikel 19][ref1] bedoeld, slechts mag plaatsvinden met tot wederopzegging te verlenen vergunning van Onze
      Minister van Volksgezondheid, Welzijn en Sport en onder inachtneming van door deze tot hetzelfde doel aan de
      vergunning zo nodig te verbinden voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
  - number: '20.1'
    text: De gemeenteraad regelt de keuringsdienst bij verordening.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20
  - number: '20.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de keuringsdienst regels worden gesteld
      betreffende de inrichting en technische uitrusting, de personeelsbezetting en de taken van het personeel alsmede
      het inroepen van bijstand voor het verrichten van bepaalde onderzoeken; voorts kunnen regels worden gesteld ter
      zake van de wijze en de mate van uitoefenen van toezicht op vlees en vleeswaren en de plaatsen waar dit geschiedt.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20
  - number: '20.3'
    text: De kosten van de keuringsdienst worden gedragen door de gemeente.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20
  - number: 20a.1
    text: |-
      In afwijking van het bepaalde in [artikel 20, eerste lid][ref1], wordt op verzoek van een gemeente dan wel van
      gemeenten die de keuringsdienst gezamenlijk hebben geregeld, de keuringsdienst geregeld door Onze Minister van
      Landbouw en Visserij, met inachtneming van het in het derde lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel20
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '20'
  - number: 20a.2
    text: |-
      De [artikelen 10][ref1], [20, derde lid][ref2], [21][ref3]-[23][ref4], [26][ref5], [26][ref6] en [46][ref7] zijn
      alsdan niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0001896#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0001896#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0001896#Artikel26b
      [ref7]: https://wetten.overheid.nl/BWBR0001896#Artikel46
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0001896
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0001896
        artikel: '26'
      - id: ref6
        bwb_id: BWBR0001896
        artikel: 26b
      - id: ref7
        bwb_id: BWBR0001896
        artikel: '46'
  - number: 20a.3
    text: |-
      Onze Minister van Landbouw en Visserij stelt in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en
      Sport regelen vast met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
  - number: 20a.3.a
    text: |-
      de plaats voor de kennisgeving, bedoeld in de [artikelen 6][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel7
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '7'
  - number: 20a.3.b
    text: de plaats en de tijd voor de keuring vóór en ná het slachten;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
  - number: 20a.3.c
    text: |-
      de termijn, binnen welke de kennisgeving, bedoeld in [artikel 7][ref1], en de termijn binnen welke na de
      kennisgeving, bedoeld in de [artikelen 6][ref2] en [7][ref3], de keuring moet geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel7
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '7'
  - number: 20a.3.d
    text: de ambtenaren die met de keuring, zomede degenen die met de herkeuring zijn belast;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
  - number: 20a.3.e
    text: |-
      het kennisgeven van de ingebruikneming van een inrichting als bedoeld in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
  - number: 20a.3.f
    text: al hetgeen voorts voor een goede regeling van de keuringsdienst nodig is.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
  - number: 20a.4
    text: |-
      De archiefbescheiden als bedoeld in [artikel 1 van de Archiefwet 1995][ref1] (*Stb.* 276) van de gemeenten die een
      verzoek als bedoeld in het eerste lid hebben gedaan, gaan, voorzover betrekking hebbende op de vleeskeuringsdienst,
      over naar het Rijk met ingang van het tijdstip waarop de in het derde lid bedoelde regelen van kracht worden. Van
      de overgang wordt een verklaring opgemaakt volgens de krachtens [artikel 2, tweede lid][ref2], van genoemde wet
      voor vervreemding van archiefbescheiden gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0007376
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '2'
  - number: '21'
    text: |-
      De verordening op de keuringsdienst bevat, behalve andere bepalingen, die de raad te dien aanzien wil maken,
      voorschriften met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
  - number: 21.a
    text: |-
      de plaats voor de kennisgeving, bedoeld in de [artikelen 6][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel7
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '7'
  - number: 21.b
    text: de plaats en de tijd voor de keuring vóór en ná het slachten;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
  - number: 21.c
    text: |-
      de termijn, binnen welke de kennisgeving, bedoeld in [artikel 7][ref1], en de termijn, binnen welke na de
      kennisgeving, bedoeld in de [artikelen 6][ref2] en [7][ref3], de keuring moet geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel7
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '7'
  - number: 21.d
    text: de ambtenaren, die met de keuring, zomede degenen, die met de herkeuring zijn belast;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
  - number: 21.e
    text: |-
      het kennisgeven aan het gemeentebestuur van de ingebruikneming van een inrichting, als bedoeld in
      [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
  - number: 21.f
    text: het in voorraad hebben en de verkoop van vleeswaren op markten.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel21
  - number: '22.1'
    text: |-
      De besluiten tot vaststelling, aanvulling, wijziging of intrekking van de verordening op de keuringsdienst behoeven
      de goedkeuring van Gedeputeerde Staten.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel22
  - number: '22.2'
    text: |-
      Alvorens te beslissen winnen Gedeputeerde Staten het advies in van de door Onze Minister van Volksgezondheid,
      Welzijn en Sport aangewezen, ter plaatse bevoegde inspecteur van het Staatstoezicht op de volksgezondheid. Zij
      zenden de inspecteur afschrift van hun besluit.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel22
  - number: '22.3'
    text: |-
      De [artikelen 261][ref1], [267][ref2] en [270 tot en met 272 van de Provinciewet][ref3] en de
      [artikelen 140 tot en met 145 van de Gemeentewet][ref4] zijn van toepassing, met dien verstande, dat de afkondiging
      geschiedt binnen twee weken, nadat het besluit, waarbij de goedkeuring is verleend, onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel267
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel270
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel140
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '261'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '267'
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '270'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '140'
  - number: '23.1'
    text: |-
      Indien de goedkeuring is geweigerd, onderwerpt de gemeenteraad binnen drie maanden na de dagtekening van het
      besluit van Gedeputeerde Staten met inachtneming van de beslissing een nieuw besluit aan de goedkeuring van
      Gedeputeerde Staten.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel23
  - number: '23.2'
    text: |-
      Indien hieraan niet voldaan is of indien bij dat nieuwe besluit de beslissing van Gedeputeerde Staten naar
      het oordeel van Gedeputeerde Staten niet of niet voldoende in acht is genomen, wordt de gemeenteraad geacht
      weigerachtig te zijn mede te werken tot de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel23
  - number: '23.3'
    text: Gedeputeerde Staten, de inspecteur gehoord, stellen alsdan de verordeningen vast.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel23
  - number: '23.4'
    text: |-
      In afwijking van [artikel 8:2, onderdeel ][ref1] kan een belanghebbende tegen een besluit als bedoeld in het derde
      lid beroep instellen bij de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '25'
    text: |-
      Met keuring van slachtdieren en met de keuring en herkeuring van vlees worden alleen belast personen, die krachtens
      de wet de bevoegdheid hebben verworven de diergeneeskunst in haar volle omvang uit te oefenen; met de keuring van
      slachtdieren en van vlees, onder toezicht en verantwoordelijkheid van deze personen, kunnen in de bij algemene
      maatregel van bestuur aan te wijzen gevallen mede worden belast personen, die volgens regels, bij of krachtens
      algemene maatregel van bestuur te stellen, bevoegd zijn als keurmeester van slachtdieren en van vlees op te treden.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel25
  - number: '26.1'
    text: |-
      Een gemeenteraad kan bij verordening bepalen, dat slachtingen, waarvan het vlees is bestemd voor huishoudelijk
      gebruik door degene aan wie het slachtdier toebehoort, moeten geschieden in één of meer slachterijen bij die
      verordening aangewezen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26
  - number: '26.2'
    text: |-
      Het bepaalde in de [artikelen 22][ref1] en [23][ref2] is op de verordening, bedoeld in het eerste lid, van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel23
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '23'
  - number: 26a.1
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat overeenkomstig daarbij te stellen regels een retributie
      kan worden geheven voor de kosten van:
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.1.a
    text: 'bij of krachtens deze wet voorgeschreven keuringen van:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.1.a.1°
    text: slachtdieren waarop deze wet van toepassing is; of
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.1.a.2°
    text: vlees, vleeswaren, of andere producten van dierlijke oorsprong;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.1.b
    text: |-
      de behandeling door de keuringsdienst van een aanvraag om een vergunning, om een erkenning van een inrichting, of
      van een aanvraag tot inschrijving van een inrichting in een register;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.1.c
    text: |-
      de behandeling door de keuringsdienst van een aanvraag tot verlenging van een vergunning, tot verlenging van een
      erkenning van een inrichting of van een aanvraag tot herinschrijving van een inrichting in een register, of van
      vooraf aangekondigde en vastgelegde controles of nog steeds aan de toelatingseisen van de vergunning, erkenning of
      registratie wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.2
    text: |-
      Een in het eerste lid bedoelde retributie wordt zodanig vastgesteld dat de baten niet uitgaan boven de kosten die
      in een rechtstreeks verband staan met de werkzaamheden waarvoor de retributie wordt geheven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.3
    text: |-
      Bij een in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat Onze Minister van
      Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Ministers wie het mede aangaat, met het oog op de
      goede uitvoering van in die maatregel geregelde onderwerpen bij ministeriële regeling nadere regels stelt of kan
      stellen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26a.4
    text: |-
      Onder keuring in dit artikel wordt mede begrepen de controle van daarbij voorgeschreven documenten, en van
      overeenstemming tussen deze documenten en de slachtdieren, vleeswaren, producten van dierlijke oorsprong, of het
      vlees waarop die documenten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26a
  - number: 26b.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de kosten, bedoeld in de [artikelen 13][ref1] en
      [17][ref2], alsmede omtrent de bij algemene maatregel van bestuur aan te wijzen kosten verbonden aan de uitvoering
      van verordeningen, richtlijnen of beschikkingen als bedoeld in [artikel 249 van het Verdrag tot oprichting van de
      Europese Gemeenschap](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel17
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '17'
  - number: 26b.2
    text: |-
      [Artikel 26, tweede, derde en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel26
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '26'
  - number: 26c
    text: |-
      Voor de behandeling van een verzoek om een ingevolge deze wet door de Dienst Wegverkeer, bedoeld in
      [artikel 4][ref1], te verrichten keuring van een vervoermiddel is een vergoeding verschuldigd. De Dienst Wegverkeer
      stelt de hoogte van de vergoeding alsmede de wijze van betaling vast. [Artikel 4][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 4q
  - number: '27.1'
    text: |-
      Invoer van vlees heeft plaats langs de, door Onze Minister van Volksgezondheid, Welzijn en Sport in overleg met
      Onze Minister van Financiën aan te wijzen, eerste kantoren, waar het door een, door Ons aan te wijzen, ambtenaar
      wordt gekeurd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is in de, bij algemene maatregel van bestuur aan te wijzen, gevallen niet van toepassing op kleine
      hoeveelheden vlees, bestemd uitsluitend voor huishoudelijk gebruik van, aan de grenzen wonende, personen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan de invoer toestaan van vlees, dat zich bevindt in of op een
      middel van vervoer en bestemd is uitsluitend voor het persoonlijk gebruik van hen, die daarin of daarop verblijven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel27
  - number: '28'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald, onder welke voorwaarden de invoer van vlees
      geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel28
  - number: '29.1'
    text: |-
      Ingevoerd vlees wordt goedgekeurd of afgekeurd en als zodanig gemerkt overeenkomstig bij of krachtens algemene
      maatregel van bestuur gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel29
  - number: '29.2'
    text: |-
      Afgekeurd vlees wordt door de zorg van de ambtenaar, bedoeld in [artikel 27, eerste lid][ref1], onbruikbaar
      gemaakt voor voedsel voor mens en dier, tenzij het binnen tweemaal vierentwintig uur door de belanghebbenden wordt
      teruggevoerd naar het land van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel27
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '27'
  - number: '29.3'
    text: |-
      Onbruikbaarmaking voor voedsel voor mens en dier geschiedt onverwijld, indien het vlees dreigt in ontbinding over
      te gaan.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel29
  - number: '30.1'
    text: 'Bij of krachtens algemene maatregel van bestuur wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30
  - number: 30.1.a
    text: welke vleeswaren ingevoerd mogen worden;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30
  - number: 30.1.b
    text: onder welke voorwaarden de invoer van die vleeswaren geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan de invoer toestaan van vleeswaren, die niet in de algemene
      maatregel van bestuur of de daarop berustende besluiten zijn genoemd, indien zij zich bevinden in of op middelen
      van vervoer en bestemd zijn uitsluitend voor het persoonlijk gebruik van hen, die daarin of daarop verblijven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30
  - number: 30a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voorts regels worden gesteld ter uitvoering van een bindend besluit
      inzake slachtdieren, vlees, vleeswaren of andere producten van dierlijke oorsprong, van de Raad van de Europese
      Unie, van het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen, dat
      betreft:
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30a
  - number: 30a.1.a
    text: de bescherming van de volksgezondheid; of
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30a
  - number: 30a.1.b
    text: |-
      het heffen van een retributie voor de kosten die verbonden zijn aan krachtens het desbetreffende besluit
      voorgeschreven keuringen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30a
  - number: 30a.2
    text: |-
      Bij een in het eerste lid bedoelde algemene maatregel van bestuur kunnen een of meer van de voorgaande bepalingen
      buiten werking worden gesteld, voor zover het desbetreffende bindend besluit binnen twaalf maanden na bekendmaking
      uitgevoerd dient te zijn.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30a
  - number: 30a.3
    text: |-
      Een krachtens het tweede lid vastgestelde bepaling vervalt een jaar na inwerkingtreding. Deze termijn kan eenmaal
      met ten hoogste een jaar worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30a
  - number: 30c
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen omtrent de monsterneming, bedoeld in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1], nadere regels worden gesteld. Deze kunnen onder meer
      betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 30c.a
    text: hetgeen als partij wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30c
  - number: 30c.b
    text: het aantal eenheden of de hoeveelheid, waaruit het uit de partij te nemen monster moet bestaan;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30c
  - number: 30c.c
    text: |-
      de wijze waarop uit de uitkomsten, verkregen uit het onderzoek van het monster, de uitslag voor de gehele partij
      wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30c
  - number: 30d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan voor het vaststellen dat met betrekking tot vlees of vleeswaren
      aan bij of krachtens deze wet gestelde regels, bij of krachtens de maatregel aangegeven, al dan niet is of wordt
      voldaan, een bij of krachtens de maatregel omschreven methode van onderzoek worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30d
  - number: 30d.2
    text: |-
      In gevallen waarin toepassing is gegeven aan het eerste lid, kan bij of krachtens algemene maatregel van bestuur
      tevens worden bepaald dat voor de vaststelling of aan bedoelde regels al dan niet is of wordt voldaan, de
      aangewezen methode van onderzoek bij uitsluiting beslissend is.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel30d
  - number: '31.1'
    text: 'Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: 31.1.a
    text: |-
      de bij besluit van Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren van het Staatstoezicht
      op de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: 31.1.b
    text: de aan de keuringsdienst verbonden dierenartsen en keurmeesters van slachtdieren en van vlees;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: 31.1.c
    text: de bij besluit van Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: '31.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onder *a* en *c*, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: '31.3'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan, in gevallen waarin zulks naar zijn oordeel in het belang
      van een doelmatig toezicht geboden is, aan het hoofd van de keuringsdienst met betrekking tot de uitoefening van
      het toezicht door de in het eerste lid bedoelde ambtenaren van zijn dienst een bindende aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31
  - number: 31a
    text: |-
      Van elke krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzochte zaak, wordt aan de
      belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee haar verkoopwaarde ten
      gevolge van het onderzoek is verminderd. Bij of krachtens algemene maatregel van bestuur kunnen regels worden
      gesteld omtrent de wijze waarop de vergoeding wordt vastgesteld en uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 31d
    text: |-
      De in [artikel 31][ref1] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover deze bevoegdheid strekt tot het zich begeven naar en
      het betreden van in de woning aanwezige bedrijfsruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel31
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '31'
  - number: 31g.1
    text: |-
      Voor zover het in [artikel 5:18 van de Algemene wet bestuursrecht][ref1] bedoelde onderzoek niet geschiedt
      ter plaatse waar de zaak is aangetroffen, wordt het uitgevoerd in het laboratorium van de ter plaatse bevoegde
      keuringsdienst, met dien verstande dat het hoofd van deze dienst bevoegd is in gevallen waarin hij zulks in het
      belang van een doelmatige uitvoering van het onderzoek raadzaam acht, het onderzoek geheel of voor een deel te
      laten uitvoeren in het laboratorium van een andere keuringsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 31g.2
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan, zo nodig onder het stellen van nadere regels, categorieën
      van gevallen aanwijzen, waarin het onderzoek, in afwijking van het eerste lid, geheel of voor een deel wordt
      uitgevoerd in een daartoe in het bijzonder uitgerust ander laboratorium, door hem te dien einde aangewezen.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel31g
  - number: '34'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel34
  - number: 34.a
    text: een aan keuring onderworpen slachtdier zonder vergunning te slachten;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel34
  - number: 34.b
    text: |-
      een aan keuring onderworpen slachtdier te slachten zonder inachtneming van de voorwaarden, waaronder vergunning tot
      slachten is verleend, of van de krachtens [artikel 18, tweede lid][ref1], vastgestelde voorschriften met betrekking
      tot de wijzen, waarop slachtdieren mogen worden geslacht;


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
  - number: 34.c
    text: |-
      een geslacht dier, dat niet verkeert in de toestand, beschreven in de krachtens
      [artikel 18, eerste lid, letter ][ref1], vastgestelde voorschriften, ter keuring aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel18
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '18'
  - number: '35'
    text: |-
      Het is verboden vlees, dat aan keuring is onderworpen, doch niet overeenkomstig deze wet of de te harer uitvoering
      gegeven voorschriften is gekeurd, of dat na keuring niet van het voorgeschreven merk is voorzien, te verkopen,
      te koop aan te bieden, af te leveren, ten geschenke te geven, te vervoeren of te doen vervoeren, anders dan ter
      naleving van enig wettelijk voorschrift, of ter aflevering voorhanden te hebben, of, tenzij in afwachting van
      keuring, in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel35
  - number: '37'
    text: |-
      Het is verboden zonder inachtneming van de ten aanzien van de invoer van vleeswaren gegeven voorschriften
      vleeswaren in te voeren, of deze ingevoerde vleeswaren te verkopen, te koop aan te bieden, af te leveren, ten
      geschenke te geven, tot vervoer of aflevering voorhanden te hebben, in voorraad te hebben, te vervoeren of te doen
      vervoeren.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel37
  - number: '38'
    text: |-
      Het hoofd of de bestuurder van een onderneming, die een inrichting exploiteert, als genoemd in [artikel 19][ref1],
      dan wel degene, die de feitelijke leiding heeft in zodanige inrichting, neemt alle maatregelen, nodig
      om te verzekeren, dat daarin geen der voorschriften van de algemene maatregel van bestuur, bedoeld in
      [artikel 2, tweede lid][ref2], en van die, bedoeld in [artikel 19][ref3], worden overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel19
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '19'
  - number: '39'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel39
  - number: 39.a
    text: vlees wederrechtelijk te onttrekken aan keuring, herkeuring of aan bruikbaarmaking voor voedsel voor mens en dier;
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel39
  - number: 39.b
    text: |-
      vleeswaren, die bereid zijn in strijd met de voorschriften, gesteld bij of krachtens de algemene maatregel van
      bestuur, bedoeld in [artikel 2, tweede lid][ref1], te verkopen, te koop aan te bieden, af te leveren, ten geschenke
      te geven, tot vervoer of aflevering voorhanden te hebben, in voorraad te hebben, of, tenzij ter naleving van enig
      wettelijk voorschrift, te vervoeren of te doen vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '2'
  - number: '46'
    text: |-
      De bevoegdheid, aan de gemeenteraad krachtens [artikel 149 van de Gemeentewet][ref1] toekomende, blijft ten aanzien
      van het onderwerp, waarin deze wet voorziet, gehandhaafd, voor zover de door hem te maken verordeningen niet met
      deze wet of de daarop steunende voorschriften in strijd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel149
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '149'
  - number: 46a.1
    text: |-
      In gevallen waarin een spoedige voorziening krachtens deze wet in het belang van de volksgezondheid of ter
      uitvoering van een bindend besluit als bedoeld in [artikel 30a, eerste lid][ref1], zo dringend geboden is dat
      de totstandkoming van een daartoe strekkende algemene maatregel van bestuur niet kan worden afgewacht, kan Onze
      Minister van Volksgezondheid, Welzijn en Sport in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en
      Visserij, ter zake bij ministeriële regeling voorlopig geldende regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel30a
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel46a
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: 30a
  - number: 46a.2
    text: |-
      Een in het eerste lid bedoelde ministeriële regeling vervalt een jaar na inwerkingtreding of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop die maatregel in werking treedt. Deze termijn kan door Onze Minister van Volksgezondheid, Welzijn en Sport,
      in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij, eenmaal met ten hoogste een jaar
      worden verlengd.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel46a
  - number: '47'
    text: |-
      De voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur krachtens deze wet
      wordt Ons gedaan door Onze Minister van Volksgezondheid, Welzijn en Sport, in overeenstemming met Onze Ministers
      wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel47
  - number: '49'
    text: Alle stukken, uit deze wet voortvloeiende, zijn vrij van kosten.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel49
  - number: '50.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
  - number: 50.1.a
    text: |-
      slachtdieren, welke krachtens de bepalingen van de [Veewet][ref1] ter keuring worden aangeboden;


      [ref1]: https://wetten.overheid.nl/BWBR0001900
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001900
  - number: 50.1.b
    text: |-
      vlees, hetwelk is goedgekeurd krachtens de [Veewet][ref1] en naar het buitenland wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0001900
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001900
  - number: 50.1.c
    text: |-
      slachtdieren en vlees, welke aan wetenschappelijk onderzoek worden onderworpen in door Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen inrichtingen, met inachtneming van door hem gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
  - number: '50.2'
    text: |-
      Zodra bij keuring krachtens de [Veewet][ref1] vlees niet voor uitvoer naar het buitenland wordt geschikt bevonden,
      wordt het verder onderworpen aan keuring volgens de voorschriften van deze wet, welke dan op dit vlees van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001900
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001900
  - number: '50.3'
    text: |-
      Indien vlees voorzien is van een merk als bedoeld in [artikel 68 van de Veewet][ref1] en niet naar het buitenland
      wordt uitgevoerd, wordt het geacht te zijn goedgekeurd krachtens [artikel 12 van de Vleeskeuringswet][ref2] ten
      bewijze waarvan een merk als bedoeld in [artikel 16][ref3] van die wet wordt aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001896#Artikel16
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0001896
        artikel: '16'
  - number: '51'
    text: Deze wet kan worden aangehaald onder de titel "Vleeskeuringswet".
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel51
  - number: '52'
    text: |-
      Deze wet treedt in werking met ingang van een, nader door Ons te bepalen, dag. Voor, met name aan te wijzen,
      artikelen kan de inwerkingtreding vroeger worden bepaald dan voor het overige gedeelte der wet.
    url: https://wetten.overheid.nl/BWBR0001896/2001-12-14#Artikel52
