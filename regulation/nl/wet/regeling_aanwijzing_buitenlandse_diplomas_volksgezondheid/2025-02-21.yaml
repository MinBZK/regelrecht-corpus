      1 Als bewijs van een verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de krachtens
      [artikel 30 van de wet][ref1] gestelde opleidingseisen met betrekking tot de verloskundige, gelden de
      getuigschriften die in bijlage V, onder 5.5.2. van de richtlijn worden genoemd en de getuigschriften die in de
      [bijlage 5][ref2] van deze regeling worden genoemd, voor zover de getuigschriften zijn behaald als gevolg van een
      opleiding die is begonnen ná de desbetreffende daarbij genoemde referentiedatum en indien zij zijn afgegeven door
      de bevoegde opleidings-instelling en voldoen aan de voorwaarden gesteld in artikel 41 van de richtlijn.

      2 Indien het in het eerste lid bedoelde getuigschrift is behaald als gevolg van een opleiding die vóór de in de
      bijlage genoemde referentiedatum is begonnen, geldt dit getuigschrift als bewijs van een verworven vakbekwaamheid
      indien het vergezeld gaat van een verklaring van de daartoe bevoegde autoriteit van de desbetreffende lidstaat of
      andere overeenkomstsluitende staat waarin wordt bevestigd dat de bezitter van het getuigschrift de werkzaamheden
      van verloskundige gedurende tenminste drie jaren achtereen tijdens de vijf jaren voorafgaande aan de afgifte van de
      verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend.

      3 Indien het getuigschrift niet betrekking heeft op een titel die in een van de bijlagen als aangegeven in het
      eerste lid, genoemd wordt, is met betrekking tot dit getuigschrift het eerste lid onverminderd van toepassing,
      indien dit getuigschrift vergezeld gaat van een verklaring van de daartoe bevoegde autoriteit waarin staat dat het
      wordt gelijkgesteld met het getuigschrift waarvan de benaming wel voorkomt in de desbetreffende bijlage.

      4 In afwijking van het tweede en derde lid geldt voor Roemenië als bewijs van een verworven vakbekwaamheid als
      bedoeld in het eerste lid het diploma van ‘asistent medical obstetrică-ginecologie’, indien dat is afgegeven door
      de daartoe bevoegde Roemeense autoriteit voor 1 januari 2007 of indien de opleiding daartoe is gestart voor die
      datum, mits het diploma vergezeld gaat van een verklaring van de daartoe bevoegde Roemeense autoriteit waarin wordt
      bevestigd dat de bezitter van een zodanig diploma de werkzaamheden van verloskundige ten minste vijf opeenvolgende
      jaren gedurende de zeven jaren voorafgaand aan de afgifte van de verklaring, daadwerkelijk en op wettige wijze
      heeft uitgeoefend.

      5 In afwijking van het tweede en derde lid gelden voor Polen als bewijs van verworven vakbekwaamheid als bedoeld in
      het eerste lid de opleidingstitels in de verloskunde die in Polen zijn afgegeven en waarvan de opleiding vóór 1 mei
      2004 voltooid is, indien deze titels worden gestaafd met het diploma ‘bachelor’ dat is verkregen op basis van een,
      door de Poolse autoriteit opgezet, speciaal voortgezet programma.

      6 In afwijking van het tweede lid gelden de volgende diploma’s die in Kroatië zijn behaald op het gebied van
      verloskunde vóór 1 juli 2013, niet als bewijs van verworven vakbekwaamheid, als bedoeld in artikel 23, eerste lid:

      - ‘visa medicinska sestra ginekoloko-opstetriëkog smjera’,
      - ‘medicinska sestra ginekoloiko-opstetriëkog smjera’, ‘viia medicinska sestra primaljskog
      - smjera’, ‘medicinska sestra primaljskog smjera’,
      - ‘ginekoloko-opstetriëka primalja’,
      - ‘primalja’.


