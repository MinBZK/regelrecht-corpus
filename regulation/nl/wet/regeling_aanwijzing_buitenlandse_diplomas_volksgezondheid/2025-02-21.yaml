        bwb_id: BWBR0022606
  - number: '4'
    text: |-
      Als bewijs van een verworven vakbekwaamheid als bedoeld in [artikel 3][ref1] gelden tevens diploma’s, certificaten
      en andere titels van arts die voor 3 oktober 1990 zijn afgegeven door de voormalige Duitse Democratische Republiek,
      of ter verwerving waarvan de opleiding vóór die datum in dat land is begonnen, indien:

      - de betreffende autoriteiten een verklaring afgeven waaruit blijkt dat die onderdanen tijdens de vijf aan de
      afgifte van de verklaring voorafgaande jaren de bedoelde werkzaamheden gedurende ten minste drie opeenvolgende
      jaren daadwerkelijk en op rechtmatige wijze op hun grondgebied hebben verricht.


