      Als bewijs van een verworven vakbekwaamheid als bedoeld in [artikel 3][ref1] gelden tevens diploma’s, certificaten
      en andere titels van arts die voor 25 juni 1991 zijn afgegeven door Joegoslavië voor onderdanen van Slovenië, of
      zijn afgegeven vóór 8 oktober 1991 voor onderdanen van Kroatië, of ter verwerving waarvan de opleiding vóór deze
      respectievelijke data in deze landen is begonnen, indien:

      - de Sloveense of de Kroatische autoriteiten verklaren, dat die titels, wat betreft de toegang tot en de
      uitoefening van het beroep van arts, op Sloveens respectievelijk Kroatisch grondgebied dezelfde rechtsgeldigheid
      hebben als respectievelijk de Sloveense en Kroatische titels van arts, en
      - de Sloveense of de Kroatische autoriteiten een verklaring afgeven waaruit blijkt dat die onderdanen tijdens
      de vijf aan de afgifte van de verklaring voorafgaande jaren de bedoelde werkzaamheden gedurende tenminste drie
      opeenvolgende jaren daadwerkelijk en op rechtmatige wijze op het grondgebied van respectievelijk Slovenië of
      Kroatië hebben verricht.


