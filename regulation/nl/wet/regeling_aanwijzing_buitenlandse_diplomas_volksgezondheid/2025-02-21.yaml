    text: |-
      1 Als bewijs van een verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de krachtens
      [artikel 32 van de wet][ref1] gestelde opleidingseisen met betrekking tot de verpleegkundige, gelden de
      getuigschriften die in bijlage V, onder 5.2.2. van de richtlijn worden genoemd en de getuigschriften die in de
      [bijlage 3][ref2] van deze regeling worden genoemd, voor zover de getuigschriften zijn behaald als gevolg van een
      opleiding die is begonnen ná de desbetreffende daarbij genoemde referentiedatum en indien zij zijn afgegeven door
      de bevoegde opleidings-instelling.

      2 Indien het in het eerste lid bedoelde getuigschrift is behaald als gevolg van een opleiding die vóór de in de
      bijlage genoemde referentiedatum is begonnen, geldt dit getuigschrift als bewijs van een verworven vakbekwaamheid
      indien het vergezeld gaat van een verklaring van de daartoe bevoegde autoriteit van de desbetreffende lidstaat of
      andere overeenkomstsluitende staat waarin wordt bevestigd dat de bezitter van het getuigschrift de werkzaamheden
      van verpleegkundige gedurende tenminste drie jaren achtereen tijdens de vijf jaren voorafgaande aan de afgifte
      van de verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend. De werkzaamheden hebben in ieder geval
      de volledige verantwoordelijkheid voor de planning, de organisatie en de administratie van de verpleging van de
      patiënt omvat.

      3 Indien het getuigschrift niet betrekking heeft op een titel die in een van de bijlagen als aangegeven in het
      eerste lid, genoemd wordt, is met betrekking tot dit getuigschrift het eerste lid onverminderd van toepassing,
      indien dit getuigschrift vergezeld gaat van een verklaring van de daartoe bevoegde autoriteit waarin staat dat het
      wordt gelijkgesteld met het getuigschrift waarvan de benaming wel voorkomt in de desbetreffende bijlage.

      4 In afwijking van het tweede en derde lid geldt voor Roemenië als bewijs van verworven vakbekwaamheid als bedoeld
      in het eerste lid:

      a. elk van de volgende opleidingstitels van verantwoordelijk algemeen ziekenverpleger, mits deze titels zijn
      behaald door onderdanen van lidstaten en vergezeld gaan van een certificaat waarin wordt bevestigd dat die
      onderdanen van lidstaten daadwerkelijk en rechtmatig de werkzaamheden van verantwoordelijk algemeen ziekenverpleger
      in Roemenië hebben uitgeoefend, waaronder de volledige verantwoordelijkheid voor de planning, organisatie en
      uitvoering van de verpleging van patiënten, gedurende een periode van minstens drie opeenvolgende jaren tijdens de
      vijf jaar voorafgaand aan de datum van afgifte van het certificaat:

      i) certificat de competențe profesionale de asistent medical generalist met postsecundaire opleiding verkregen aan
      een școală postliceală, waaruit blijkt dat vóór 1 januari 2007 met de opleiding is begonnen;

      ii) diplomă de absolvire de asistent medical generalist met een hogere opleiding van korte duur, waaruit blijkt dat
      vóór 1 oktober 2003 met de opleiding is begonnen, of

      iii) diplomă de licență de asistent medical generalist met een hogere opleiding van lange duur, waaruit blijkt dat
      vóór 1 oktober 2003 met de opleiding is begonnen;

      b. elk van de in onderdeel a, subonderdelen ii en iii, vermelde opleidingstitels, mits die titels vergezeld gaan
      van de volgende opleidingstitel die is verkregen op grond van een speciaal moderniseringsprogramma:

      - diplomă de licență zoals bedoeld in artikel 3, tweede lid, van het Gezamenlijk Besluit van de Minister van
      Onderwijs en de Minister van Volksgezondheid nr. 4317/943/2014 van 11 augustus 2014 betreffende de goedkeuring
      van het speciale moderniseringsprogramma voor afgestudeerden van het postsecundair en hoger onderwijs die vóór
      1 januari 2007 de basisopleiding tot verantwoordelijk algemeen ziekenverpleger hebben voltooid (Roemeens Staatsblad
      nr. 624 van 26 augustus 2014), vergezeld van een diplomasupplement waarin wordt verklaard dat de student het
      speciale moderniseringsprogramma heeft voltooid; of

      c. elk van de opleidingstitels van postsecundair niveau die zijn vermeld in artikel 4 van het Besluit nr. 5114/2014
      van de Minister van Onderwijs betreffende de goedkeuring van de methode voor de organisatie, uitvoering en
      voltooiing van het speciale moderniseringsprogramma voor afgestudeerden van het postsecundair onderwijs die vóór
      1 januari 2007 de basisopleiding tot verantwoordelijk algemeen ziekenverpleger hebben voltooid (Roemeens Staatsblad
      nr. 5 van 6 januari 2015), mits die titels vergezeld gaan van de volgende opleidingstitel die is verkregen op basis
      van een speciaal moderniseringsprogramma:

      - certificat de revalorizare a competenţelor profesionale zoals bedoeld in artikel 3, lid 1, van het Gezamenlijk
      Besluit van de Minister van Onderwijs en de Minister van Volksgezondheid nr. 4317/943/2014 en bijlage 3 daarbij, en
      in artikel 16 van Besluit nr. 5114/2014 van de Minister van Onderwijs.

      5 In afwijking van het tweede en derde lid gelden voor Polen als bewijs van verworven vakbekwaamheid als bedoeld
      in het eerste lid de opleidingstitels in de verpleegkunde die in Polen zijn afgegeven en waarvan de opleiding vóór
      1 mei 2004 voltooid is, indien deze titels worden gestaafd met het diploma ‘bachelor’ dat is verkregen op basis
      van een, door de Poolse autoriteit opgezet speciaal voortgezet programma, als bedoeld in artikel 33, derde lid van
      de richtlijn.


