  - number: 27a
    text: |-
      Als bewijs van verworven vakbekwaamheid als bedoeld in de [artikelen 3, eerste lid][ref1], [8, eerste lid][ref2],
      [13, eerste lid][ref3], [18, eerste lid][ref4], en [23, eerste lid][ref5], geldt tevens een in het land van
      oorsprong afgegeven verklaring van de opleidingsinstelling waar de betreffende opleiding met goed gevolg is
      afgerond, waaruit blijkt dat de aanvrager heeft voldaan aan de in die artikelen bedoelde opleidingseisen en waaruit
      blijkt wanneer de betreffende opleiding is afgerond.


