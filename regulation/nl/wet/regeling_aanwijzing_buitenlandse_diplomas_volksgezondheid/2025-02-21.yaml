        hoofdstuk: '2'
  - number: '5'
    text: |-
      Als bewijs van een verworven vakbekwaamheid als bedoeld in [artikel 3][ref1] gelden tevens diploma’s, certificaten
      en andere titels van arts die voor 1 januari 1993 zijn afgegeven door het voormalige Tsjecho-Slowakije, of ter
      verwerving waarvan de opleiding vóór die datum in dat land is begonnen, indien:

      - de betreffende autoriteiten verklaren, dat die titels, wat betreft de toegang tot en de uitoefening van het
      betreffende beroep, op Tsjechisch, respectievelijk Slowaaks grondgebied dezelfde rechtsgeldigheid hebben als de
      Tsjechische respectievelijk Slowaakse titels van arts;
      - de betreffende autoriteiten een verklaring afgeven waaruit blijkt dat die onderdanen tijdens de vijf aan de
      afgifte van de verklaring voorafgaande jaren de bedoelde werkzaamheden gedurende ten minste drie opeenvolgende
      jaren daadwerkelijk en op rechtmatige wijze op hun grondgebied hebben verricht.


