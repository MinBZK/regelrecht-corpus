preamble:
  text: >-
    Gelet op:


    Richtlijn nr. 2005/36/EG van 7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU, L 255);


    Overeenkomst van Oporto van 2 mei 1992 betreffende de Europese Economische Ruimte (Trb. 1993,132);


    Overeenkomst van 21 juni 1999 tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Zwitserse
    Bondsstaat anderzijds, betreffende het vrije verkeer van personen (PbEU, L 114)


    Artikel 32, eerste lid, Algemene Wet erkenning EG-beroepskwalificaties


    en de artikelen 41, eerste lid, onderdeel a, en tweede lid, 44 en 46 van de Wet op de beroepen in de individuele
    gezondheidszorg.


    Besluit:
  url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: de [Wet op de beroepen in de individuele gezondheidszorg][ref1];

      b. richtlijn: de [Richtlijn nr. 2005/36/EG](32005L0036) betreffende de erkenning van beroepskwalificaties;

      c. EER-overeenkomst: de Overeenkomst van Oporto van 2 mei 1992 betreffende de Europese Economische Ruimte

      d. lidstaat: een lidstaat van de Europese Unie;

      e. andere overeenkomstsluitende staat: een staat niet zijnde een lidstaat van de Europese Unie, die partij is bij
      de EER-overeenkomst of bij de overeenkomst tussen de Europese Unie en haar lidstaten, enerzijds, en de Zwitserse
      Bondsstaat anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel1
