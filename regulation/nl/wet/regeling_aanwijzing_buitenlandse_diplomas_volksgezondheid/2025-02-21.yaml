        bwb_id: BWBR0006251
  - number: '2'
    text: >-
      Bij het gebruik maken van een academische titel verleend in de lidstaat van oorsprong dient deze titel gevolgd te
      worden door de naam en de plaats van de instelling of van de examencommissie die de titel heeft verleend.
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel2
  - number: '3'
    text: |-
      1 Als bewijs van een verworven vakbekwaamheid die geacht kan worden gelijkwaardig te zijn aan de krachtens
      [artikel 18 van de wet][ref1] gestelde opleidingseisen met betrekking tot de arts, gelden de getuigschriften
      die in bijlage V, onder 5.1.1. van de richtlijn worden genoemd en de getuigschriften die in [bijlage 1][ref2]
      van deze regeling worden genoemd, voor zover de getuigschriften zijn behaald als gevolg van een opleiding die
      is begonnen ná de desbetreffende daarbij genoemde referentiedatum en indien zij zijn afgegeven door de bevoegde
      opleidingsinstelling.

      2 Indien het in het eerste lid bedoelde getuigschrift is behaald als gevolg van een opleiding die vóór de in de
      bijlagen genoemde referentiedatum is begonnen, geldt dit getuigschrift als bewijs van een verworven vakbekwaamheid
      indien het vergezeld gaat van een verklaring van de daartoe bevoegde autoriteit van de desbetreffende lidstaat of
      andere overeenkomstsluitende staat waarin wordt bevestigd dat de bezitter van het getuigschrift de werkzaamheden
      van arts gedurende ten minste drie opeenvolgende jaren tijdens de vijf jaren voorafgaande aan de afgifte van de
      verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend.

      3 Indien het getuigschrift niet betrekking heeft op een titel die in een van de bijlagen als aangegeven in het
      eerste lid, genoemd wordt, is met betrekking tot dit getuigschrift het eerste lid onverminderd van toepassing,
      indien dit getuigschrift vergezeld gaat van een certificaat van de daartoe bevoegde autoriteit waarin staat dat het
      wordt gelijkgesteld met het getuigschrift waarvan de benaming wel voorkomt in de desbetreffende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022606
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel3
