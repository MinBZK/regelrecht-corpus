  - number: '28'
    text: >-
      Een wijziging in de artikelen 33, lid 3 en 41 en in de bijlage V van de richtlijn gaan voor de toepassing van
      de Regeling buitenlands gediplomeerden volksgezondheid gelden met ingang van de dag waarop aan de betrokken
      wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel28
  - number: '29'
    text: >-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel29
  - number: '30'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing buitenlandse diploma’s volksgezondheid.'
    url: https://wetten.overheid.nl/BWBR0022606/2025-02-21#Artikel30
  - number: '31'
    text: |-
      De [Regeling aanwijzing buitenlandse diploma’s gezondheidszorg][ref1] wordt ingetrokken.


