      1 Als bewijs van verworven vakbekwaamheid als bedoeld in [artikel 8][ref1] gelden tevens de diploma’s, certificaten
      en andere titels van arts die zijn afgegeven door de Roemeense, Spaanse, Italiaanse, Oostenrijkse, Tsjechische of
      Slowaakse bevoegde autoriteit aan personen die uiterlijk op de in de bijlage V vermelde datum een begin gemaakt
      hebben met hun universitaire opleiding tot arts en die vergezeld gaan van een door de desbetreffende bevoegde
      autoriteit afgegeven verklaring, waaruit blijkt dat betrokkene gedurende tenminste drie opeenvolgende jaren
      tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring, in die lidstaat daadwerkelijk, wettig en als
      hoofdbezigheid de werkzaamheden van tandarts heeft verricht en tevens bevoegd is deze werkzaamheden onder gelijke
      voorwaarden als die welke gelden voor de houders van het in bijlage V, 5.3.2. voor de betrokken lidstaat opgenomen
      getuigschrift te verrichten.

      2 Van de in het eerste lid gestelde eis van drie jaar praktijkervaring zijn vrijgesteld personen die met goed
      gevolg studies van ten minste drie jaar hebben gevolgd welke door de bevoegde autoriteiten zijn erkend als
      gelijkwaardig aan de opleiding die leidt tot vakbekwaamheid als bedoeld in [artikel 8][ref2].

      3 Met betrekking tot Tsjechië en Slowakije zijn het eerste en tweede lid van gelijke toepassing op de in het
      voormalige Tsjecho-Slowakije verkregen opleidingstitels.

      4 Voor opleidingstitels van arts welke in Italië zijn afgegeven aan personen die na 28 januari 1980 en niet later
      dan 31 december 1984 met hun opleiding begonnen zijn is naast de verklaring als bedoeld in het eerste lid een
      verklaring vereist, waaruit blijkt dat betrokkene met goed gevolg de proef van bekwaamheid heeft afgelegd die door
      de bevoegde Italiaanse autoriteiten is georganiseerd of studies van tenminste drie jaar heeft gevolgd welke door
      de bevoegde autoriteiten zijn erkend als gelijkwaardig aan de opleiding die leidt tot vakbekwaamheid als bedoeld
      in [artikel 8][ref3].

      5 Voor opleidingstitels van arts welke in Italië zijn afgegeven aan personen die na 31 december 1984 met hun
      opleiding begonnen zijn, is het vierde lid onverkort van toepassing, indien de bovengenoemde drie studiejaren voor
      31 december 1994 zijn begonnen.

      6 Voor opleidingstitels van arts welke in Spanje zijn afgegeven aan personen die na 1 januari 1986 en niet later
      dan 31 december 1997 met hun opleiding zijn begonnen is naast de verklaring als bedoeld in het eerste lid een
      verklaring vereist, waaruit blijkt dat betrokkene een studie van ten minste drie jaar heeft gevolgd welke door de
      bevoegde autoriteiten is erkend als gelijkwaardig aan de opleiding die leidt tot een vakbekwaamheid als bedoeld
      in [artikel 8][ref4].


