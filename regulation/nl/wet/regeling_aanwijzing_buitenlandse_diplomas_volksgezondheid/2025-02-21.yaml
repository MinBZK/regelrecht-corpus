      - de Sloveense of Kroatische autoriteiten verklaren, dat die titels, wat betreft de toegang tot en de uitoefening
      van het betreffende beroep, op Sloveens respectievelijk Kroatisch grondgebied dezelfde rechtsgeldigheid hebben als
      de Sloveense of Kroatische titels van verloskundige en
      - de Sloveense of Kroatische autoriteiten een verklaring afgeven waaruit blijkt dat die onderdanen tijdens de
      vijf aan de afgifte van de verklaring voorafgaande jaren de bedoelde werkzaamheden gedurende tenminste drie
      opeenvolgende jaren daadwerkelijk en op rechtmatige wijze op het grondgebied van respectievelijk Slovenië of
      Kroatië hebben verricht.


