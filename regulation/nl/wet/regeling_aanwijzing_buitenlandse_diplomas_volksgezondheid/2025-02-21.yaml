  - number: 17a
    text: |-
      De erkenning van beroepskwalificaties van Roemeense opleidingstitels van verantwoordelijk
      algemeen ziekenverpleger die vóór 3 maart 2024 overeenkomstig het bepaalde in
      [artikel 9 tot en met 11 van de Algemene Wet erkenning beroepskwalificaties][ref1] is toegekend aan onderdanen van
      een lidstaat die in Roemenië een opleiding tot verantwoordelijk algemeen ziekenverpleger hebben gevolgd en welke
      beroepskwalificaties niet voldeden aan het bepaalde in:

      - artikel 33 bis van de richtlijn in de versie die van kracht was op 1 januari 2007, of
      - artikel 33 bis van de richtlijn zoals gewijzigd bij [Richtlijn 2013/55/EU](32013L0055) van het Europese Parlement
      en de Raad;

      blijven van kracht.


