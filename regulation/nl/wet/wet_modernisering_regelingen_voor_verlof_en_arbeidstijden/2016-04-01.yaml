preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verlofregelingen van de Wet arbeid en zorg en de
    bepalingen inzake aanpassing van de arbeidsduur in de Wet aanpassing arbeidsduur te wijzigen opdat daardoor de
    gebruiksmogelijkheden van deze wetten worden vergroot, alsmede om technische aanpassingen door te voeren in de
    Arbeidstijdenwet en om het overgangsrecht met betrekking tot de Wet arbeid en zorg te actualiseren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036012/2016-04-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      De [Invoeringswet arbeid en zorg][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0013009
    url: https://wetten.overheid.nl/BWBR0036012/2016-04-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0013009
  - number: VIIA
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen drie jaar na de inwerkingtreding van
      [artikel I, onderdeel C][ref1], van deze wet een verslag over de doeltreffendheid en de effecten van
      [artikel 3:1, zesde, zevende, achtste en negende lid, van de Wet arbeid en zorg][ref2] in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0036012#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel31
    url: https://wetten.overheid.nl/BWBR0036012/2016-04-01#ArtikelVIIA
