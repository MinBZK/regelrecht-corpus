$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_windenergie_op_zee
regulatory_layer: WET
publication_date: '2025-11-13'
valid_from: '2020-01-01'
bwb_id: BWBR0036752
url: https://wetten.overheid.nl/BWBR0036752/2020-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het realiseren van meer windenergie op zee bijdraagt aan het
    verwezenlijken van de hernieuwbare energiedoelstellingen, dat op zee meerdere activiteiten plaatsvinden waar
    windparken op zee ingepast moeten worden, dat het aansluiten van windparken op het elektriciteitsnet tegen
    de laagst mogelijke maatschappelijke kosten moet plaatsvinden waardoor het wenselijk is om coördinatie van de
    ruimtelijke inpassing van windenergie op zee te versterken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *kavel:* locatie voor een windpark;
        - *kavelbesluit:* besluit waarin een kavel en een tracé voor een aansluitverbinding zijn aangewezen;
        - *net:* een net als bedoeld in [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref1];
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *vergunning:* vergunning als bedoeld in [artikel 12][ref2];
        - *windpark:* een samenstel van voorzieningen waarmee elektriciteit met behulp van wind wordt geproduceerd,
      waarbij onder een samenstel van voorzieningen wordt verstaan alle aanwezige middelen die onderling met elkaar zijn
      verbonden voor de productie van elektriciteit met behulp van wind.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel12
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '2'
    text: Deze wet is mede van toepassing in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel2
  - number: '3.1'
    text: Onze Minister kan, in overeenstemming met Onze Minister van Infrastructuur en Milieu, een kavelbesluit nemen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Een kavel kan slechts worden aangewezen binnen gebieden die in het nationaal waterplan, bedoeld
      in [artikel 4.1 van de Waterwet][ref1], zijn aangewezen als voor windenergie geschikte gebieden.
      Het tracé voor de aansluitverbinding tussen het windpark en het aansluitpunt op een net wordt niet
      verder aangewezen dan tot de laagwaterlijn, bedoeld in de [artikelen 1, tweede lid][ref2], en
      [2, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003748#Artikel2
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003748
        artikel: '2'
  - number: '3.3'
    text: 'Onze Minister betrekt bij de afweging tot het nemen van een kavelbesluit:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: 3.3.a
    text: |-
      de vervulling van maatschappelijke functies van de zee, waaronder het belang van een doelmatig ruimtegebruik van
      de zee;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: 3.3.b
    text: de gevolgen van een aanwijzing voor derden;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: 3.3.c
    text: |-
      het milieu belang, waaronder het ecologisch belang met inachtneming van het bepaalde bij of krachtens de
      [artikelen 5][ref1] en [7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel7
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '7'
        hoofdstuk: '2'
  - number: 3.3.d
    text: de kosten om een windpark in het gebied te realiseren;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: 3.3.e
    text: het belang van een doelmatige aansluiting van een windpark op een net.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
  - number: '3.4'
    text: |-
      Op de voorbereiding van een kavelbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      met dien verstande dat zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.1'
    text: 'Onze Minister verbindt aan een kavelbesluit regels en voorschriften die in ieder geval betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.1.a
    text: de rechten en andere belangen van derden met betrekking tot de kavel;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.1.b
    text: de voorwaarden waaronder het milieu wordt beschermd;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de voorwaarden en beperkingen waaronder is verzekerd dat de natuurlijke kenmerken van Natura 2000-gebieden
      niet zullen worden aangetast en, in voorkomend geval, het voorschrift inhoudende de verplichting compenserende
      maatregelen te treffen als bedoeld in [artikel 2.8, zevende lid, van de Wet natuurbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 4.1.d
    text: |-
      de voorwaarden en beperkingen waaronder Onze Minister een vrijstelling als bedoeld in [artikel 7][ref1] verleent;


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel7
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '7'
        hoofdstuk: '2'
  - number: 4.1.e
    text: het belang van een doelmatig ruimtegebruik van een windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.1.f
    text: de termijn waarvoor de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.1.g
    text: |-
      financiële voorwaarden als bedoeld in de [artikelen 10][ref1] en [28][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel28
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '28'
        hoofdstuk: '4'
  - number: '4.2'
    text: 'Onze Minister neemt in een kavelbesluit de volgende onderdelen op:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.2.a
    text: |-
      een beschrijving van de te treffen voorzieningen, gericht op het ongedaan maken, beperken of compenseren van de
      gevolgen van de bouw en exploitatie van een windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.2.b
    text: |-
      een beschrijving van de tijdelijke maatregelen en de tijdelijk te treffen voorzieningen die nodig zijn voor de
      verwezenlijking van het windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.2.c
    text: |-
      de aanduiding op een of meer topografische of geografische kaarten van de geografische omvang van het kavel en de
      ligging van het tracé van de aansluitverbinding;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.2.d
    text: |-
      de uitkomsten van het onderzoek naar meteorologische omstandigheden, bodemgesteldheid, stromingen en golfhoogtes,
      milieukundig bodemonderzoek, archeologisch onderzoek en overig milieukundig onderzoek;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: 4.2.e
    text: |-
      de termijn waarbinnen Onze Minister de gevolgen van de ingebruikneming van een kavel onderzoekt en een opgave van
      de daarbij te onderzoeken milieuaspecten.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij kavelbesluit kan worden afgeweken van de op grond van [artikel 6.6 van de Waterwet][ref1] gestelde regels met
      betrekking tot het gebruik van het waterstaatswerk Noordzee door het plaatsen van installaties of kabels.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '4.4'
    text: Het is verboden te handelen in strijd met het kavelbesluit en de daaraan verbonden regels en voorschriften.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 2.7, tweede lid, van de Wet natuurbescherming][ref1] is niet van toepassing op projecten waarop het
      kavelbesluit betrekking heeft. Indien die projecten de kwaliteit van de natuurlijke habitats en de habitats van
      soorten in een Natura 2000-gebied als bedoeld in die wet kunnen verslechteren of een significant verstorend effect
      kunnen hebben op de soorten waarvoor het gebied is aangewezen, gelet op de instandhoudingsdoelstellingen voor dat
      gebied, is [artikel 2.8 van die wet][ref2] en het krachtens [artikel 2.9, vierde lid, van die wet][ref3] bepaalde,
      van overeenkomstige toepassing op het vaststellen van een kavelbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '2'
  - number: '7.1'
    text: |-
      Onze Minister kan in het kavelbesluit vrijstelling verlenen van de verboden, bedoeld in de
      [artikelen 3.1, eerste, tweede, derde en vierde lid][ref1], [3.2, eerste en zesde lid][ref2],
      [3.5, eerste, tweede, derde, vierde en vijfde lid][ref3], [3.6, eerste en tweede lid][ref4], en
      [3.10, eerste lid, van de Wet natuurbescherming][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
  - number: '7.2'
    text: |-
      Een vrijstelling van de verboden, bedoeld in de [artikelen 3.1, eerste, tweede, derde of vierde lid][ref1], of
      [3.2, eerste of zesde lid, van de Wet natuurbescherming][ref2] wordt slechts verleend indien is voldaan aan de
      voorwaarden, bedoeld in [artikel 3.3, vierde lid, van die wet][ref3] en aan het kavelbesluit de voorschriften,
      bedoeld in artikel 3.3, vijfde lid, van die wet, worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: '7.3'
    text: |-
      Een vrijstelling van de verboden, bedoeld in de [artikelen 3.5, eerste, tweede, derde, vierde of vijfde lid][ref1],
      of [3.6, eerste of tweede lid, van de Wet natuurbescherming][ref2] wordt slechts verleend indien is voldaan aan de
      voorwaarden, bedoeld in [artikel 3.8, vijfde lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
  - number: '7.4'
    text: |-
      Een vrijstelling van de verboden, bedoeld in de [artikelen 3.10, eerste lid, van de Wet natuurbescherming][ref1]
      wordt slechts verleend indien is voldaan aan de voorwaarden, bedoeld in artikel 3.10, tweede lid, in samenhang met
      [artikel 3.8, vijfde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: '7.5'
    text: |-
      Aan een vrijstelling als bedoeld in het eerste lid kunnen in het kavelbesluit voorschriften worden
      verbonden, onverminderd het tweede lid. Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel7
  - number: '8'
    text: |-
      [Hoofdstuk 1, afdeling 2, van de Crisis- en herstelwet][ref1] is van overeenkomstige toepassing op een
      kavelbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0027431#Afdeling2
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027431
        afdeling: '2'
  - number: '9.1'
    text: |-
      Om te voorkomen dat een locatie, waarvoor een kavelbesluit wordt voorbereid, minder geschikt wordt voor de
      verwezenlijking van windparken kan Onze Minister, in overeenstemming met Onze Minister van Infrastructuur en
      Milieu, voor die locatie een voorbereidingsbesluit nemen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: '9.2'
    text: 'Bij het voorbereidingsbesluit kan worden bepaald dat het in daarbij aangewezen gevallen verboden is:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: 9.2.a
    text: werken of werkzaamheden uit te voeren of
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: 9.2.b
    text: het gebruik van werken te wijzigen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het voorbereidingsbesluit vervalt indien niet binnen een jaar na de inwerkingtreding daarvan een ontwerp voor een
      kavelbesluit ter inzage is gelegd.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: '9.4'
    text: Het is verboden te handelen in strijd met een voorbereidingsbesluit.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      Kosten die samenhangen met het verrichten van werkzaamheden als bedoeld in de [artikelen 3][ref1], [4][ref2],
      [5][ref3], en [7][ref4] kunnen ten laste komen van degene aan wie de vergunning wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0036752#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0036752#Artikel7
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0036752
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0036752
        artikel: '7'
        hoofdstuk: '2'
  - number: '10.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de verhaalbare kostensoorten.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel10
  - number: '10.3'
    text: De bedragen ter vergoeding van de kosten worden vastgesteld in het kavelbesluit.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Infrastructuur en Milieu, kan een kavelbesluit wijzigen of
      geheel of gedeeltelijk intrekken indien:
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
  - number: 11.1.a
    text: |-
      gedurende drie achtereenvolgende jaren na het onherroepelijk worden van een kavelbesluit geen vergunning voor de
      kavel wordt verleend;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
  - number: 11.1.b
    text: |-
      indien zich omstandigheden of feiten voordoen waardoor de handeling of handelingen waarvoor het kavelbesluit is
      genomen niet langer toelaatbaar worden geacht met het oog op de in [artikel 3][ref1] bedoelde doelstellingen en
      belangen;


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '3'
        hoofdstuk: '2'
  - number: 11.1.c
    text: |-
      indien een voor Nederland verbindend verdrag of besluit van een volkenrechtelijke organisatie dan wel een wettelijk
      voorschrift ter uitvoering daarvan daartoe verplicht.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      De [artikelen 3, vierde lid][ref1], [4, eerste lid][ref2], [5][ref3] en [7][ref4] zijn van overeenkomstige
      toepassing op een wijziging van een kavelbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0036752#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0036752#Artikel7
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0036752
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0036752
        artikel: '7'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Tot intrekking van een kavelbesluit wordt niet overgegaan voor zover kan worden volstaan met wijziging of
      aanvulling van de aan het kavelbesluit verbonden regels en voorschriften.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel11
  - number: '12'
    text: |-
      Het is verboden zonder vergunning van Onze Minister een windpark te bouwen of te exploiteren in de Nederlandse
      territoriale zee of de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel12
  - number: '13'
    text: 'Onze Minister verleent geen vergunning voor:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel13
  - number: 13.a
    text: |-
      een gebied dat is gelegen buiten een kavel en het tracé voor de aansluitverbinding dat is aangewezen op grond van
      [artikel 3, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '3'
        hoofdstuk: '2'
  - number: 13.b
    text: een kavel waarvoor reeds een vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Een vergunning kan slechts worden verleend indien op grond van de aanvraag voldoende aannemelijk is dat de bouw en
      exploitatie van het windpark:
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.a
    text: uitvoerbaar is;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.b
    text: technisch haalbaar is;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.c
    text: financieel haalbaar is;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.d
    text: gestart kan worden binnen vier jaar na de datum waarop de vergunning onherroepelijk is geworden;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.e
    text: economisch haalbaar is binnen het in de vergunning bepaalde tijdvak;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: 14.1.f
    text: voldoet aan het kavelbesluit.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de beoordelingscriteria, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel14
  - number: '15.1'
    text: 'In een vergunning wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: 15.1.a
    text: voor welk tijdvak de vergunning geldt;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: 15.1.b
    text: voor welk kavel de vergunning geldt;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: 15.1.c
    text: |-
      binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven activiteiten
      dienen te worden verricht.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      Het tijdvak, bedoeld in het eerste lid, onderdeel a, is passend bij de te verwachten levensduur van een windpark en
      het specifieke gebied waarop de vergunning betrekking heeft, maar ten hoogste 30 jaar.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: '15.3'
    text: Onze Minister kan aan een vergunning voorwaarden en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid, onderdeel c. Aan de ontheffing kunnen voorschriften
      worden verbonden en de ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: '15.5'
    text: |-
      Het is verboden te handelen in strijd met de vergunning, de daaraan verbonden voorwaarden en voorschriften, alsmede
      de ontheffing, bedoeld in het vierde lid, en de daaraan verbonden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      De houder van een vergunning kan de vergunning met schriftelijke toestemming van Onze Minister op een ander doen
      overgaan.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel16
  - number: '16.2'
    text: Aan een toestemming kunnen voorschriften worden verbonden en een toestemming kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel16
  - number: '16.3'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op een aanvraag om een besluit
      houdende toestemming tot de overdracht van de vergunning, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '17.1'
    text: 'Onze Minister kan een vergunning wijzigen of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.1.a
    text: |-
      de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest,
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.1.b
    text: de activiteiten waarvoor de vergunning geldt niet langer worden uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.1.c
    text: |-
      de subsidie die op grond van [artikel 3 van de Kaderwet EZ-subsidies][ref1] is verleend, is ingetrokken of


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: 17.1.d
    text: dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de houder.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: '17.2'
    text: Onze Minister kan een vergunning intrekken, indien
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.2.a
    text: niet overeenkomstig het kavelbesluit is of wordt gehandeld,
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.2.b
    text: niet overeenkomstig de vergunning is of wordt gehandeld of
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.2.c
    text: |-
      de regels op grond van deze wet of de [Waterwet][ref1] voor de activiteiten waarvoor de vergunning geldt niet
      worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: '17.3'
    text: |-
      Onze Minister gaat niet over tot intrekking op grond van het tweede lid, dan nadat hij de houder schriftelijk heeft
      gewaarschuwd en de situatie die aanleiding geeft tot intrekking zich blijft voordoen of opnieuw voordoet.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: '17.4'
    text: Onze Minister kan een vergunning op aanvraag van de houder wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: '17.5'
    text: 'De vergunning vervalt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.5.a
    text: als de houder een natuurlijke persoon is, met ingang van de dag na die waarop die persoon is overleden;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: 17.5.b
    text: |-
      als de houder een rechtspersoon is, met ingang van de dag na die waarop de rechtspersoon heeft opgehouden te
      bestaan.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Dit artikel is van toepassing op het houden van een vergunning door meer dan één natuurlijke persoon of
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bij de aanvraag om een vergunning worden de personen gezamenlijk als aanvrager van de vergunning beschouwd. Na
      verlening worden zij gezamenlijk als houder van de vergunning beschouwd.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel18
  - number: '18.3'
    text: |-
      [Artikel 16][ref1] is van overeenkomstige toepassing als een van de personen zijn aandeel in de vergunning op een
      ander wil doen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel16
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18.4'
    text: |-
      In afwijking van [artikel 17, vijfde lid][ref1], vervalt de vergunning niet als één van de houders die een
      natuurlijke persoon is, overlijdt dan wel één van de houders die een rechtspersoon is, ophoudt te bestaan, maar
      wordt de vergunning gehouden door de overblijvende medehouders.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel17
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '19'
    text: |-
      Deze paragraaf is van toepassing indien subsidie op grond van een algemene maatregel van bestuur als bedoeld in
      [artikel 3 van de Kaderwet EZ-subsidies][ref1] kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '20.1'
    text: Aanvragen om een vergunning worden ingediend in de periode waarin een aanvraag voor subsidie kan worden ingediend.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      De aanvraag voldoet aan de eisen van [artikel 14][ref1] en aan de eisen die aan het aanvragen van de subsidie
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel14
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '20.3'
    text: |-
      Voor de behandeling van aanvragen om een vergunning worden kosten in rekening gebracht bij de aanvrager. Onze
      Minister stelt bij ministeriële regeling de hoogte van de kosten vast.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien meerdere aanvragen voldoen aan de [artikelen 14][ref1] en [20][ref2], verleent Onze Minister de vergunning
      aan de aanvrager aan wie subsidie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel20
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '21.2'
    text: Onze Minister beslist op aanvragen gelijktijdig met de beslissing op de aanvragen voor subsidie.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel21
  - number: '22'
    text: |-
      Deze paragraaf is van toepassing indien geen subsidie op grond van een algemene maatregel van bestuur als bedoeld
      in [artikel 3 van de Kaderwet EZ-subsidies][ref1] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '23.1'
    text: Aanvragen om een vergunning worden ingediend binnen de bij ministeriële regeling vastgestelde aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: '23.2'
    text: 'Een aanvraag bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.a
    text: een ontwerp voor het windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.b
    text: een tijdschema voor de bouw en exploitatie van het windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.c
    text: een raming van de kosten en opbrengsten;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.d
    text: een raming van de maatschappelijke kosten;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.e
    text: een inventarisatie en analyse van de risico’s;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.f
    text: een beschrijving van de maatregelen ter borging van de kostenefficiëntie;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.g
    text: een lijst met de bij de bouw en exploitatie van het windpark betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: 23.2.h
    text: een beschrijving van de kennis en ervaring van de betrokken partijen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: '23.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop een aanvraag wordt ingediend en
      over de gegevens en bescheiden welke bij de aanvraag worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: '23.4'
    text: |-
      Voor de behandeling van aanvragen om een vergunning worden kosten in rekening gebracht bij de aanvrager. Onze
      Minister stelt bij ministeriële regeling de hoogte van de kosten vast.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel23
  - number: '24.1'
    text: |-
      Indien meerdere aanvragen voldoen aan de [artikelen 14][ref1] en [23][ref2], verleent Onze Minister de vergunning
      aan de aanvrager van wie de aanvraag het hoogst is gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel23
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '24.2'
    text: 'Onze Minister betrekt bij de rangschikking:'
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.a
    text: de kennis en ervaring van de betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.b
    text: de kwaliteit van het ontwerp voor het windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.c
    text: de capaciteit van het windpark;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.d
    text: de maatschappelijke kosten;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.e
    text: de kwaliteit van de inventarisatie en analyse van de risico’s;
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: 24.2.f
    text: de kwaliteit van de maatregelen ter borging van kostenefficiëntie.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: '24.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de onderlinge weging van de rangschikkingscriteria.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel24
  - number: '25'
    text: |-
      Onze Minister beslist op de aanvragen binnen 13 weken na afloop van de aanvraagperiode, bedoeld in
      [artikel 23, eerste lid][ref1], en kan deze termijn eenmaal met ten hoogste 13 weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel23
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '26.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister daartoe aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft, ressorterende onder een ander
      ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met Onze Minister
      wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel26
  - number: '26.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel26
  - number: '27'
    text: |-
      Onze Minister kan ingeval van overtreding van het bepaalde bij of krachtens deze wet de overtreder een last onder
      bestuursdwang opleggen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister kan bepalen dat zekerheid gesteld wordt voor de nakoming van hetgeen verschuldigd zal worden, ingeval
      hij een last onder bestuursdwang oplegt ter handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel28
  - number: '28.2'
    text: |-
      De verplichting, bedoeld in het eerste lid, rust op de houder van de vergunning, dan wel, indien de vergunning haar
      geldigheid heeft verloren, op de laatste houder van de vergunning.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Het bedrag en de termijnen waarvoor en de tijdstippen en de wijze waarop de zekerheid wordt gesteld ten aanzien
      van het verwijderen, dan wel het na verwijdering slopen of hergebruiken van niet meer in gebruik zijnde windparken,
      worden vastgesteld in het kavelbesluit en dienen in de overige gevallen ten genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel28
  - number: '34.1'
    text: |-
      [Artikel 12][ref1] is niet van toepassing op windparken waarvoor voor de datum waarop deze wet in
      werking treedt een vergunning op grond van de [Wet beheer rijkswaterstaatswerken][ref2] of op grond van
      [artikel 6.5 van de Waterwet][ref3] en subsidie op grond een algemene maatregel van bestuur op grond van
      [artikel 3 van de Kaderwet EZ-subsidie][ref4] of op grond van [artikel 72m van de Elektriciteitswet 1998][ref5]
      zoals dat luidde op 31 december 2008, is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008331
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
    url: https://wetten.overheid.nl/BWBR0036752/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0008331
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0007919
