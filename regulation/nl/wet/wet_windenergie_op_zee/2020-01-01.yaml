  - number: '34.2'
    text: |-
      Een vergunning voor een windpark die is verleend op grond van de [Wet beheer rijkswaterstaatswerken][ref1]
      of op grond van [artikel 6.5 van de Waterwet][ref2], vervalt op de datum waarop deze wet in werking
      treedt indien voor het windpark geen subsidie op grond van een algemene maatregel van bestuur op grond van
      [artikel 3 van de Kaderwet EZ-subsidies][ref3] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008331
