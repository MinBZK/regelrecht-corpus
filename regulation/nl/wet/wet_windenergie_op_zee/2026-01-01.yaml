  - number: '9'
    text: |-
      1 Om te voorkomen dat een locatie, waarvoor een kavelbesluit wordt voorbereid, minder geschikt wordt voor de
      verwezenlijking van windparken kan Onze Minister, in overeenstemming met Onze Minister van Infrastructuur en
      Waterstaat, voor die locatie een voorbereidingsbesluit nemen.

      2 Bij het voorbereidingsbesluit kan worden bepaald dat het in daarbij aangewezen gevallen verboden is:

      a. werken of werkzaamheden uit te voeren of

      b. het gebruik van werken te wijzigen.

      3 Het voorbereidingsbesluit vervalt indien niet binnen een jaar na de inwerkingtreding daarvan een ontwerp voor een
      kavelbesluit ter inzage is gelegd.

      4 Het is verboden te handelen in strijd met een voorbereidingsbesluit.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel9
  - number: '10'
    text: |-
      1 Kosten die samenhangen met het verrichten van werkzaamheden als bedoeld in de [artikelen 3][ref1], [4][ref2],
      [5][ref3], en [7][ref4] kunnen ten laste komen van degene aan wie de vergunning wordt verleend.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de verhaalbare kostensoorten.

      3 De bedragen ter vergoeding van de kosten worden vastgesteld bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel4
