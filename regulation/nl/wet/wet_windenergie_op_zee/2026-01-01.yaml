  - number: '17'
    text: |-
      1 Onze Minister kan een vergunning wijzigen of intrekken, indien:

      a. de bij de aanvraag verstrekte gegevens of bescheiden zodanig onjuist of onvolledig blijken, dat op de aanvraag
      een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de juiste omstandigheden volledig bekend
      waren geweest,

      b. de activiteiten waarvoor de vergunning geldt niet langer worden uitgevoerd,

      c. de subsidie die op grond van [artikel 3 van de Kaderwet EZ-subsidies][ref1] is verleend, is ingetrokken of

      d. dit wordt gerechtvaardigd door een wijziging in de technische of financiële mogelijkheden van de houder.

      2 Onze Minister kan een vergunning intrekken, indien

      a. niet overeenkomstig het kavelbesluit is of wordt gehandeld,

      b. niet overeenkomstig de vergunning is of wordt gehandeld of

      c. de regels op grond van deze wet of de [Omgevingswet][ref2] voor de activiteiten waarvoor de vergunning geldt
      niet worden nageleefd.

      3 Onze Minister gaat niet over tot intrekking op grond van het tweede lid, dan nadat hij de houder schriftelijk
      heeft gewaarschuwd en de situatie die aanleiding geeft tot intrekking zich blijft voordoen of opnieuw voordoet.

      4 Onze Minister kan een vergunning op aanvraag van de houder wijzigen of intrekken.

      5 De vergunning vervalt van rechtswege:

      a. als de houder een natuurlijke persoon is, met ingang van de dag na die waarop die persoon is overleden;

      b. als de houder een rechtspersoon is, met ingang van de dag na die waarop de rechtspersoon heeft opgehouden te
      bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel17
