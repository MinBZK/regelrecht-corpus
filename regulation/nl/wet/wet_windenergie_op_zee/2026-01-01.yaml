  - number: '4'
    text: |-
      1 Onze Minister verbindt aan een kavelbesluit regels en voorschriften die in ieder geval betrekking hebben op:

      a. de rechten en andere belangen van derden met betrekking tot de kavel;

      b. de voorwaarden waaronder het milieu wordt beschermd;

      c. de voorwaarden en beperkingen waaronder is verzekerd dat de natuurlijke kenmerken van Natura 2000-gebieden
      niet zullen worden aangetast en, in voorkomend geval, het voorschrift inhoudende de verplichting compenserende
      maatregelen te treffen overeenkomstig de op grond van [artikel 5.18 van de Omgevingswet][ref1] gestelde regels over
      Natura 2000-activiteiten;

      d. de voorwaarden en beperkingen waaronder Onze Minister een vrijstelling als bedoeld in [artikel 7][ref2]
      verleent;

      e. het belang van een doelmatig ruimtegebruik van een windpark;

      f. de termijn waarvoor de vergunning wordt verleend;

      g. financiële voorwaarden als bedoeld in artikel [28][ref3].

      2 Onze Minister neemt in een kavelbesluit de volgende onderdelen op:

      a. een beschrijving van de te treffen voorzieningen, gericht op het ongedaan maken, beperken of compenseren van de
      gevolgen van de bouw en exploitatie van een windpark;

      b. een beschrijving van de tijdelijke maatregelen en de tijdelijk te treffen voorzieningen die nodig zijn voor de
      verwezenlijking van het windpark;

      c. de aanduiding op een of meer topografische of geografische kaarten van de geografische omvang van het kavel en
      de ligging van het tracé van de aansluitverbinding;

      d. de uitkomsten van het onderzoek naar meteorologische omstandigheden, bodemgesteldheid, stromingen en
      golfhoogtes, milieukundig bodemonderzoek, archeologisch onderzoek en overig milieukundig onderzoek;

      e. de termijn waarbinnen Onze Minister de gevolgen van de ingebruikneming van een kavel onderzoekt en een opgave
      van de daarbij te onderzoeken milieuaspecten.

      3 Bij kavelbesluit kan worden afgeweken van de op grond van
      [artikel 4.3, eerste lid, aanhef en onder f, onder 2°en 3°, en vierde lid, van de Omgevingswet][ref4] gestelde
      regels met betrekking tot het gebruik van het waterstaatswerk Noordzee door het plaatsen van installaties of
      kabels.

      4 Het is verboden te handelen in strijd met het kavelbesluit en de daaraan verbonden regels en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.18
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0036752#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel4.3
