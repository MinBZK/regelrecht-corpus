  - number: 25e
    text: |-
      1 Bij ministeriële regeling worden, na overleg met Onze Minister van Financiën, regels gesteld over de toepassing
      en uitvoering van de procedure van veiling.

      2 De in het eerste lid bedoelde regels hebben in elk geval betrekking op:

      a. de wijze waarop een bod wordt uitgebracht;

      b. de eisen die aan een geldig bod worden gesteld;

      c. de gevallen waarin biedingen ongeldig kunnen worden verklaard;

      d. maatregelen ten behoeve van een ongestoord en eerlijk verloop van de veiling;

      e. de zekerheidstelling dat een bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;

      f. de bij veiling toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking komt voor
      verlening van de vergunning;

      g. de eisen die gesteld worden met betrekking tot de wijze van betaling en het tijdstip waarop degene aan wie de
      vergunning wordt verleend deze betaling moet hebben verricht.

      3 Een aanvrager verstrekt als zekerheid voor de betaling van het bod een waarborgsom of een bankgarantie ter
      grootte van een bij ministeriële regeling vast te stellen bedrag.

      4 De zekerheid wordt verstrekt voor de periode tot:

      a. in geval van afwijzing van de aanvraag, het tijdstip van de afwijzing;

      b. in geval van niet in behandeling nemen van de aanvraag, het tijdstip van het besluit om de aanvraag niet te
      behandelen;

      c. in geval van toewijzing van de aanvraag, het tijdstip waarop het bod volledig is betaald.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel25e
  - number: 25f
    text: |-
      1 Onze Minister verleent de vergunning aan de aanvrager met het hoogste bod.

      2 Onze Minister beslist op de aanvragen binnen 13 weken na afloop van de procedure van veiling, bedoeld in
      [artikel 25e][ref1], en kan deze termijn eenmaal met ten hoogste 13 weken verlengen.


