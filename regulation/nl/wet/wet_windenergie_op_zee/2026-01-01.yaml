  - number: '7'
    text: |-
      1 Onze Minister kan in het kavelbesluit afwijken van het verbod, bedoeld in
      [artikel 5.1, tweede lid, aanhef en onder g, van de Omgevingswet][ref1].

      2 Een afwijking als bedoeld in het eerste lid is uitsluitend toegestaan indien is voldaan aan de op
      grond van [artikel 5.18 van de Omgevingswet][ref2] gestelde regels over de desbetreffende flora- en
      fauna-activiteit en indien aan het kavelbesluit de voorschriften worden verbonden die op grond van
      [artikel 5.34, tweede lid, van die wet][ref3] zijn vereist voor de desbetreffende flora- en fauna-activiteit.

      3 Aan een afwijking als bedoeld in het eerste lid kunnen in het kavelbesluit voorschriften worden verbonden,
      onverminderd het tweede lid. Een afwijking kan onder beperkingen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel5.18
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5.34
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel7
