  - number: '11'
    text: |-
      1 Onze Minister, in overeenstemming met Onze Minister van Infrastructuur en Waterstaat en Onze Minister van
      Landbouw, Visserij, Voedselzekerheid en Natuur, kan een kavelbesluit wijzigen of geheel of gedeeltelijk intrekken
      indien:

      a. gedurende drie achtereenvolgende jaren na het onherroepelijk worden van een kavelbesluit geen vergunning voor de
      kavel wordt verleend;

      b. zich omstandigheden of feiten voordoen waardoor de handeling of handelingen waarvoor het kavelbesluit is genomen
      niet langer toelaatbaar worden geacht met het oog op de in [artikel 3][ref1] bedoelde doelstellingen en belangen;

      c. een voor Nederland verbindend verdrag of besluit van een volkenrechtelijke organisatie dan wel een wettelijk
      voorschrift ter uitvoering daarvan daartoe verplicht;

      d. nog geen vergunning voor de kavel is aangevraagd en de wijziging van ondergeschikte aard is;

      e. het tijdvak, bedoeld in [artikel 15, eerste lid][ref2], wordt verlengd.

      2 De [artikelen 3, derde en vierde lid][ref3][4, eerste lid][ref4], [5][ref5] en [7][ref6] zijn van
      overeenkomstige toepassing op een wijziging van een kavelbesluit.

      3 Tot intrekking van een kavelbesluit wordt niet overgegaan voor zover kan worden volstaan met wijziging of
      aanvulling van de aan het kavelbesluit verbonden regels en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
