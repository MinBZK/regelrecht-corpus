  - number: '21'
    text: |-
      1 Onze Minister verleent de vergunning aan de aanvrager aan wie subsidie wordt verleend.

      2 Onze Minister beslist op aanvragen gelijktijdig met de beslissing op de aanvragen voor subsidie.
