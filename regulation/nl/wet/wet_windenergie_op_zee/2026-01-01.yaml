  - number: '5'
    text: |-
      [Artikel 5.1, eerste lid, aanhef en onder e, van de Omgevingswet][ref1] is niet van toepassing op Natura 2000-
      activiteiten als bedoeld in die wet waarop het kavelbesluit van toepassing is. Indien die Natura 2000-activiteiten
      afzonderlijk of in combinatie met andere plannen of projecten significante gevolgen kan hebben voor een Natura
      2000-gebied, zijn [artikel 16.53c van de Omgevingswet][ref2] en de op grond van de [artikelen 5.18][ref3] en
      [artikel 16.6 van die wet][ref4] gestelde regels over Natura 2000-activiteiten van overeenkomstige toepassing op
      het vaststellen van een kavelbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel16.53c
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5.18
      [ref4]: https://wetten.overheid.nl/BWBR0037885#Artikel16.6
