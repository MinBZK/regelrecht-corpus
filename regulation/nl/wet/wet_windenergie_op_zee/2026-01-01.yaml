  - number: '2'
    text: Deze wet is mede van toepassing in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan, in overeenstemming met Onze Minister van Infrastructuur en Waterstaat en Onze Minister van
      Landbouw, Visserij, Voedselzekerheid en Natuur, een kavelbesluit nemen.

      2 Een kavel kan slechts worden aangewezen binnen gebieden die in het nationaal waterprogramma, bedoeld
      in [artikel 3.9, tweede lid, onder e, van de Omgevingswet][ref1], zijn aangewezen als voor windenergie
      geschikte gebieden. Het tracé voor de aansluitverbinding tussen het windpark en het aansluitpunt wordt
      niet verder aangewezen dan tot de laagwaterlijn, bedoeld in de [artikelen 1, tweede lid][ref2], en
      [2, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref3].

      3 Onze Minister betrekt bij de afweging tot het nemen van een kavelbesluit:

      a. de vervulling van maatschappelijke functies van de zee, waaronder het belang van een doelmatig ruimtegebruik van
      de zee;

      b. de gevolgen van een aanwijzing voor derden;

      c. het milieu belang, waaronder het ecologisch belang met inachtneming van het bepaalde bij of krachtens de
      [artikelen 5][ref4] en [7][ref5];

      d. de kosten om een windpark in het gebied te realiseren;

      e. het belang van een doelmatige aansluiting van een windpark op een aansluitpunt.

      4 Op de voorbereiding van een kavelbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref6] van
      toepassing, met dien verstande dat zienswijzen naar voren kunnen worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel3.9
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003748#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0036752#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0036752#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
