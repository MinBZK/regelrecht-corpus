  - number: '26'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister daartoe aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft, ressorterende onder een ander
      ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met Onze Minister
      wie het mede aangaat.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel26
  - number: '27'
    text: |-
      Onze Minister kan ingeval van overtreding van het bepaalde bij of krachtens deze wet de overtreder een last onder
      bestuursdwang opleggen.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel27
  - number: '28'
    text: |-
      1 Onze Minister kan bepalen dat zekerheid gesteld wordt voor de nakoming van hetgeen verschuldigd zal worden,
      ingeval hij een last onder bestuursdwang oplegt ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.

      2 De verplichting, bedoeld in het eerste lid, rust op de houder van de vergunning, dan wel, indien de vergunning
      haar geldigheid heeft verloren, op de laatste houder van de vergunning.

      3 Het bedrag en de termijnen waarvoor en de tijdstippen en de wijze waarop de zekerheid wordt gesteld ten aanzien
      van het verwijderen, dan wel het na verwijdering slopen of hergebruiken van niet meer in gebruik zijnde windparken,
      worden vastgesteld in het kavelbesluit en dienen in de overige gevallen ten genoegen van Onze Minister te zijn.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel28
  - number: '34'
    text: |-
      1 [Artikel 12][ref1] is niet van toepassing op windparken waarvoor voor de datum waarop deze wet in
      werking treedt een vergunning op grond van de [Wet beheer rijkswaterstaatswerken][ref2] of op grond van
      [artikel 6.5 van de Waterwet][ref3] en subsidie op grond een algemene maatregel van bestuur op grond van
      [artikel 3 van de Kaderwet EZ-subsidie][ref4] of op grond van [artikel 72m van de Elektriciteitswet 1998][ref5]
      zoals dat luidde op 31 december 2008, is verleend.

      2 Een vergunning voor een windpark die is verleend op grond van de [Wet beheer rijkswaterstaatswerken][ref6]
      of op grond van [artikel 6.5 van de Waterwet][ref7], vervalt op de datum waarop deze wet in werking
      treedt indien voor het windpark geen subsidie op grond van een algemene maatregel van bestuur op grond van
      [artikel 3 van de Kaderwet EZ-subsidies][ref8] is verleend.


