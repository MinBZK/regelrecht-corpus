  - number: '24'
    text: |-
      1 Onze Minister verleent de vergunning aan de aanvrager van wie de aanvraag het hoogst is gerangschikt.

      2 Onze Minister betrekt bij de rangschikking in ieder geval:

      a. de zekerheid van realisatie van het windpark;

      b. de bijdrage van het windpark aan de energievoorziening.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld aan de criteria, bedoeld in het tweede lid, en
      kunnen aanvullende criteria worden vastgesteld die bij de rangschikking worden betrokken.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de onderlinge weging van de rangschikkingscriteria.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel24
  - number: '25'
    text: |-
      Onze Minister beslist op de aanvragen binnen 13 weken na afloop van de aanvraagperiode, bedoeld in
      [artikel 12a, eerste lid][ref1], en kan deze termijn eenmaal met ten hoogste 13 weken verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel12a
