  - number: '12'
    text: |-
      Het is verboden zonder vergunning van Onze Minister een windpark te bouwen of te exploiteren in de Nederlandse
      territoriale zee of de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel12
  - number: 12a
    text: |-
      1 Een aanvraag om een vergunning wordt ingediend met gebruikmaking van een middel, dat door Onze Minister
      beschikbaar wordt gesteld.

      2 Een aanvraag om een vergunning wordt ingediend binnen de bij ministeriële regeling vastgestelde aanvraagperiode.

      3 Bij ministeriële regeling kunnen twee of meer kavels worden aangewezen waarvoor een gebundelde aanvraag kan
      worden ingediend.

      4 Een aanvraag bevat in ieder geval:

      a. een ontwerp voor het windpark;

      b. een tijdschema voor de bouw en exploitatie van het windpark;

      c. een raming van de kosten en opbrengsten;

      d. een lijst met de bij de bouw en exploitatie van het windpark betrokken partijen;

      e. een beschrijving van de kennis en ervaring van de betrokken partijen.

      5 Bij ministeriële regeling worden regels gesteld over de wijze waarop een aanvraag wordt ingediend en over de
      gegevens en bescheiden die bij de aanvraag worden overgelegd.

      6 Voor de behandeling van aanvragen om een vergunning worden kosten in rekening gebracht bij de aanvrager. Onze
      Minister stelt bij ministeriële regeling de hoogte van de kosten vast.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel12a
  - number: '13'
    text: |-
      Onze Minister verleent geen vergunning voor:

      a. een gebied dat is gelegen buiten een kavel en het tracé voor de aansluitverbinding dat is aangewezen op grond
      van [artikel 3, eerste lid][ref1], of

      b. een kavel waarvoor reeds een vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel3
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: '3'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 Een vergunning kan slechts worden verleend indien op grond van de aanvraag voldoende aannemelijk is dat de bouw
      en exploitatie van het windpark:

      a. uitvoerbaar is;

      b. technisch haalbaar is;

      c. financieel haalbaar is;

      d. gestart kan worden binnen de bij ministeriële regeling te bepalen perioden;

      e. economisch haalbaar is binnen het in de vergunning bepaalde tijdvak;

      f. voldoet aan het kavelbesluit.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de beoordelingscriteria, bedoeld in het
      eerste lid.

      3 Onze Minister beslist tevens afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan het bepaalde bij of krachtens de
      [artikelen 12a, eerste, tweede, vierde, vijfde en zesde lid][ref1] en [14a, derde en vierde lid][ref2];

      b. aan de middellijke of onmiddellijke zeggenschap over de aanvrager onaanvaardbare risico’s verbonden zijn voor de
      openbare veiligheid, de voorzieningszekerheid of de leveringszekerheid van elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel14a
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0036752
        artikel: 12a
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: 14a
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 14a
    text: |-
      1 De verlening van een vergunning geschiedt met de toepassing van de:

      a. procedure met subsidieverlening,

      b. procedure van een vergelijkende toets,

      c. procedure van een vergelijkende toets met financieel bod, of

      d. procedure van een veiling.

      2 Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, bepaald welke procedure of
      procedures worden toegepast. Voorafgaand aan de keuze welke procedure of procedures worden toegepast, onderzoekt
      Onze Minister de marktcondities.

      3 Indien aanvragen voor een vergunning voor meerdere procedures kunnen worden ingediend, wordt bij ministeriële
      regeling, na overleg met Onze Minister van Financiën, bepaald in welke volgorde de behandeling van de aanvragen
      plaatsvindt. Bij ministeriële regeling kan, na overleg met Onze Minister van Financiën, worden bepaald dat een
      aanvrager uitsluitend voor één procedure een aanvraag kan indienen.

      4 Bij ministeriële regeling kan worden bepaald wanneer sprake is van één aanvraag.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel14a
  - number: '15'
    text: |-
      1 In een vergunning wordt bepaald:

      a. voor welk tijdvak de vergunning geldt;

      b. voor welk kavel de vergunning geldt;

      c. binnen welke tijdvakken nadat de vergunning onherroepelijk is geworden, de in de vergunning aangegeven
      activiteiten dienen te worden verricht.

      2 Het tijdvak, bedoeld in het eerste lid, onderdeel a, is passend bij de te verwachten levensduur van een windpark
      en het specifieke gebied waarop de vergunning betrekking heeft, maar ten hoogste 40 jaar.

      3 Onze Minister kan aan een vergunning voorwaarden en voorschriften verbinden.

      4 Onze Minister kan ontheffing verlenen van het eerste lid, onderdeel c. Aan de ontheffing kunnen voorschriften
      worden verbonden en de ontheffing kan onder beperkingen worden verleend.

      5 Het is verboden te handelen in strijd met de vergunning, de daaraan verbonden voorwaarden en voorschriften,
      alsmede de ontheffing, bedoeld in het vierde lid, en de daaraan verbonden voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel15
  - number: 15a
    text: |-
      1 De vergunning wordt onder de opschortende voorwaarde verleend dat de houder van een vergunning als zekerheid voor
      de bouw van een windpark op zee een waarborgsom of een bankgarantie heeft verstrekt.

      2 Bij ministeriële regeling worden nadere regels gesteld over:

      a. de hoogte van de waarborgsom of de bankgarantie;

      b. de termijn waarbinnen de waarborgsom of de bankgarantie moet zijn verstrekt;

      c. de periode waarvoor de waarborgsom of de bankgarantie moet worden verstrekt.

      3 Indien niet tijdig aan de krachtens het tweede lid gestelde voorwaarden is voldaan, wordt de vergunning voor de
      desbetreffende kavel verleend aan de aanvrager die als eerstvolgende voor verlening van de vergunning in aanmerking
      komt.

      4 De waarborgsom of de bankgarantie wordt tot een bij ministeriële regeling te bepalen hoogte verbeurd indien een
      houder van een vergunning de in de vergunning aangegeven activiteiten niet binnen de desbetreffende tijdvakken
      heeft verricht.
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel15a
  - number: '16'
    text: |-
      1 De houder van een vergunning kan de vergunning met schriftelijke toestemming van Onze Minister op een ander doen
      overgaan.

      2 Aan een toestemming kunnen voorschriften worden verbonden en een toestemming kan onder beperkingen worden
      verleend.

      3 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op een aanvraag om een besluit
      houdende toestemming tot de overdracht van de vergunning, bedoeld in het eerste lid.

      4 Indien de termijn voor het stellen van een zekerheid als bedoeld in [artikel 15a][ref2] nog niet is verstreken,
      verleent Onze Minister geen toestemming indien de beoogde vergunninghouder geen zekerheid heeft gesteld die voldoet
      aan het bepaalde bij of krachtens artikel 15a.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel15a
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel16
