  - number: '18'
    text: |-
      1 Dit artikel is van toepassing op het houden van een vergunning door meer dan één natuurlijke persoon of
      rechtspersoon.

      2 Bij de aanvraag om een vergunning worden de personen gezamenlijk als aanvrager van de vergunning beschouwd. Na
      verlening worden zij gezamenlijk als houder van de vergunning beschouwd.

      3 [Artikel 16][ref1] is van overeenkomstige toepassing als een van de personen zijn aandeel in de vergunning op een
      ander wil doen overgaan.

      4 In afwijking van [artikel 17, vijfde lid][ref2], vervalt de vergunning niet als één van de houders die een
      natuurlijke persoon is, overlijdt dan wel één van de houders die een rechtspersoon is, ophoudt te bestaan, maar
      wordt de vergunning gehouden door de overblijvende medehouders.


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel17
