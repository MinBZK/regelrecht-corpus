preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het realiseren van meer windenergie op zee bijdraagt aan het
    verwezenlijken van de hernieuwbare energiedoelstellingen, dat op zee meerdere activiteiten plaatsvinden waar
    windparken op zee ingepast moeten worden, dat het aansluiten van windparken op het elektriciteitsnet tegen
    de laagst mogelijke maatschappelijke kosten moet plaatsvinden waardoor het wenselijk is om coördinatie van de
    ruimtelijke inpassing van windenergie op zee te versterken;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *aansluitpunt:* punt waarop een aansluitverbinding wordt aangesloten op een net of op een installatie;
        - *kavel:* locatie voor een windpark;
        - *kavelbesluit:* besluit waarin een kavel en een tracé voor een aansluitverbinding zijn aangewezen;
        - *net:* systeem als bedoeld in [artikel 1.1 van de Energiewet][ref1], voor elektriciteit;
        - *Onze Minister:* Onze Minister van Klimaat en Groene Groei;
        - *vergunning:* vergunning als bedoeld in [artikel 12][ref2];
        - *windenergie:* energiedrager die ontstaat na omzetting van wind;
        - *windpark:* een samenstel van voorzieningen waarmee windenergie wordt geproduceerd, waarbij onder een samenstel
      van voorzieningen wordt verstaan alle aanwezige middelen, waaronder ten minste drie windturbines die op of in
      de bodem van de zee zijn geplaatst of eraan zijn bevestigd, en die onderling met elkaar zijn verbonden voor de
      productie van windenergie, alsmede – in voorkomend geval – voor de omzetting van deze windenergie.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel12
    url: https://wetten.overheid.nl/BWBR0036752/2026-01-01#Artikel1
