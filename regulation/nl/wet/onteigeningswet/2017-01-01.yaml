$id: onteigeningswet
regulatory_layer: WET
publication_date: '2024-03-22'
valid_from: '2017-01-01'
bwb_id: BWBR0001842
url: https://wetten.overheid.nl/BWBR0001842/2017-01-01
preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten;

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de onteigening ten algemeenen nutte, in
    overeenstemming met art. 147 der Grondwet, bij de wet te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Onteigening ten algemeenen nutte kan in het publiek belang van den Staat, van eene of meer provinciën, van eene of
      meer gemeenten, en van een of meer waterschappen plaats hebben.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel1
  - number: '1.2'
    text: |-
      In dat publiek belang kan ook ten name van natuurlijke personen of privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid, aan wie de uitvoering van het werk, dat onteigening vordert, is toegestaan, worden onteigend.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel1
  - number: '2'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Regtsvordering][ref1] zijn op het geding tot onteigening
      toepasselijk, voor zooveel daarvan bij deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '3.1'
    text: |-
      Als eigenaar van een onroerende zaak, en als rechthebbende op een recht als in [artikel 4, eerste lid][ref1],
      omschreven, worden zij beschouwd, die als zodanig in de basisregistratie kadaster staan vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '3.2'
    text: |-
      Desniettemin kan een ieder die beweert eigenaar te zijn, of rechthebbende op een recht als in
      [artikel 4, eerste lid][ref1], omschreven, en niet is gedagvaard, aan de rechter verzoeken in het
      geding van onteigening te mogen tussenkomen, zolang de eindconclusies door partijen niet genomen
      zijn. Hetzelfde recht hebben derde belanghebbenden, waaronder zijn te verstaan beperkt gerechtigden,
      huurders, onderhuurders, pachters, onderpachters, bezitters, eigenaren in geval van mandeligheid volgens
      [artikel 60, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref2], schuldeisers als bedoeld in
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref3], en zij die op het te onteigenen goed of op een recht
      waaraan dat is onderworpen, beslag hebben gelegd. Deze laatsten kunnen in hun verzoek alleen worden ontvangen,
      indien zij daarbij een notaris of deurwaarder aanwijzen aan wie kan worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '3.3'
    text: |-
      Bij tegenspraak der hoedanigheid van eigenaar, rechthebbende of derde belanghebbende, wordt de onteigening met de
      overigen voortgezet, en zal hij, die beweert gerechtigde te zijn, zijn recht alleen op de schadevergoeding kunnen
      uitoefenen, die in dat geval wordt geconsigneerd overeenkomstig de [Wet op de consignatie van gelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003338
  - number: '4.1'
    text: |-
      Wanneer op een onroerende zaak, die toebehoort aan de onteigenende partij, een recht van opstal, erfpacht,
      vruchtgebruik, gebruik, bewoning, beklemming of huurkoop rust, kan dat recht afzonderlijk worden onteigend.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      Overigens kan door toepassing van deze wet een zaak slechts worden bevrijd van de met betrekking tot de zaak
      bestaande lasten en rechten door onteigening van die zaak.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel4
  - number: '4.3'
    text: Een aandeel in een zaak of een recht kan niet afzonderlijk worden onteigend.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel4
  - number: '17'
    text: De onteigenende partij tracht hetgeen onteigend moet worden bij minnelijke overeenkomst te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel17
  - number: '18.1'
    text: |-
      Is hetgeen onteigend moet worden niet bij minnelijke overeenkomst verkregen, dan dagvaardt de onteigenende partij
      de bij koninklijk besluit aangewezen eigenaar voor de rechtbank in welker rechtsgebied de te onteigenen onroerende
      zaak is gelegen, teneinde de onteigening te horen uitspreken en het bedrag der schadeloosstelling te horen bepalen.
      Betreft de onteigening een recht, dan wordt zij ingesteld tegen de bij koninklijk besluit aangewezen rechthebbende;
      van deze vordering wordt kennisgenomen door de rechtbank binnen welker rechtsgebied de onroerende zaak is gelegen
      waarop het recht rust.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
  - number: '18.2'
    text: |-
      Wanneer de rechtbank op grond van het voorgaande bevoegd is van een deel van de vordering kennis te nemen, is zij
      bevoegd van de geheele vordering kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij onteigening van een onroerende zaak waarop blijkens de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], een eeuwigdurende erfpacht, een beklemrecht
      of een recht uit huurkoop rust, worden ook de erfpachter, de beklemde meijer of de huurkoper gedagvaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '18.4'
    text: |-
      De dagvaarding wordt betekend aan degenen die als houder van op het te onteigenen goed rustende hypotheken
      in de openbare registers bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] zijn
      ingeschreven en aan de in die registers ingeschreven beslagleggers op het te onteigenen goed.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '18.5'
    text: |-
      Aan de derde belanghebbenden, als bedoeld in [artikel 3, tweede lid][ref1], voor zover deze aan de onteigenende
      partij bekend zijn of behoren te zijn, wordt de dagvaarding betekend dan wel wordt een afschrift van de dagvaarding
      gezonden bij aangetekende brief, waarvoor een bericht van ontvangst wordt verlangd. Ten aanzien van een huurder van
      woonruimte, als bedoeld in [artikel 233 van Boek 7 van het Burgerlijk Wetboek][ref2], kan in de aangetekende brief
      worden volstaan met de mededeling van de uitgebrachte dagvaarding en van het daarin vervatte aanbod, voor zover dit
      op hem betrekking heeft. Voorts wordt mededeling gedaan van voorzieningen die de onteigenende partij voornemens is
      jegens hem te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel233
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '233'
  - number: '18.6'
    text: |-
      De betekening of de verzending van de aangetekende brief geschiedt binnen een week na het uitbrengen van de
      dagvaarding.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
  - number: '18.7'
    text: |-
      Betekening of toezending bij aangetekende brief vindt niet plaats aan degenen die op grond van het derde lid van
      dit artikel zijn gedagvaard.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
  - number: '18.8'
    text: |-
      In het exploit van betekening van de dagvaarding aan de derde belanghebbende of in de aangetekende brief wordt
      vermeld op welke wijze zij, desgewenst, in het geding van onteigening kunnen tussenkomen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel18
  - number: '20.1'
    text: |-
      Wanneer de verweerder buiten het Koningrijk woont, of zijne woonplaats onbekend is, wordt het geding gevoerd tegen
      den gevolmagtigde of bewindvoerder, indien een zoodanige binnen het Koningrijk bekend is, en, zoo ook deze onbekend
      is, tegen een derde, binnen het rechtsgebied van de rechtbank wonende, en door deze op verzoek en ten koste der
      onteigenende partij, te dien einde te benoemen. De alzoo benoemde kan, bij het ophouden zijner betrekking, het loon
      van den bewindvoerder eens afwezige, en daarenboven de gemaakte onkosten in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel20
  - number: '20.2'
    text: |-
      Desniettemin is de verweerder geregtigd ten dage, in [art. 23][ref1] genoemd, op de dagvaarding, aan den
      gevolmagtigde, bewindvoerder of door den regter benoemde gedaan, te verschijnen, in welk geval de dagvaarding als
      aan hem geschied wordt beschouwd en het geding tegen hem wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: '20.3'
    text: Is de verweerder overleden, dan vinden de bepalingen van dit artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel20
  - number: '22.1'
    text: De dagvaarding moet, op straffe van nietigheid, de som, welke als schadeloosstelling aangeboden wordt, vermelden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien er derde belanghebbenden zijn, moet uit het in de dagvaarding te vermelden aanbod blijken, welk aandeel
      daarvan voor de verweerder onderscheidenlijk ieder der derde belanghebbenden, voor zover dezen aan de onteigenende
      partij bekend zijn of behoren te zijn, als schadeloosstelling is bestemd, op straffe van veroordeling in de kosten
      overeenkomstig [artikel 50, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel50
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '50'
        hoofdstuk: III
  - number: '23'
    text: |-
      Ten minste drie dagen vóór de verschijning legt de onteigenende partij, tot staving van haren eisch, ter griffie
      van de regtbank over:
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel23
  - number: 23.1°
    text: |-
      een exemplaar van de *Staatscourant*, waarin is openbaar gemaakt Ons besluit, waarbij de te onteigenen onroerende
      zaken en rechten worden aangewezen;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel23
  - number: 23.2°
    text: |-
      en door de burgemeester van de gemeente, waar de betrokken onroerende zaken zijn gelegen, afgegeven bewijs dat de
      uitgewerkte plannen met de daarbij behorende kaarten en grondtekeningen binnen de betrokken gemeente ter inzage
      gelegen hebben.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel23
  - number: '24'
    text: |-
      De rechtbank behandelt zaken aangaande onteigening ten algemenen nutte, vóór elke andere. Op de eerste roldatum,
      of uiterlijk twee weken daarna concluderen de verweerders voor antwoord. Indien de verweerders alsdan niet
      voor antwoord concluderen, worden zij geacht het aanbod te hebben verworpen. Het laatste is van overeenkomstige
      toepassing ten aanzien van derde belanghebbenden aan wie bij dagvaarding of aangetekende brief een aanbod is
      gedaan. Oproeping tot vrijwaring wordt niet toegelaten. Indien van twee of meer gedaagden de een verschijnt, de
      ander niet, wordt met de verschijnende onmiddellijk voortgeprocedeerd. De uitspraak geschiedt tussen al de partijen
      bij een en hetzelfde vonnis, dat als een vonnis op tegenspraak gewezen wordt beschouwd, en waartegen geen verzet
      is toegelaten. Uiterlijk een maand na de eerste roldatum doet de rechtbank uitspraak. Het voorschrift vervat in het
      vorige lid geldt niet, indien de eigenaar de vordering als bedoeld in artikel 38 doet of indien een der partijen
      pleidooi vraagt; alsdan verwijst de enkelvoudige kamer op ter zitting gedaan verzoek de zaak naar de meervoudige
      kamer der rechtbank.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel24
  - number: '25'
    text: 'De rechtbank wijst aan de onteigenende partij haar eis niet toe indien:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel25
  - number: 25.a
    text: |-
      het in [artikel 23, onder 1°][ref1], bedoelde exemplaar van de Staatscourant niet is overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: 25.b
    text: |-
      de in [artikel 23, onder 2°][ref1], bedoelde terinzagelegging niet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: '26'
    text: |-
      Tegen de uitspraak des regters, houdende nietigverklaring van de dagvaarding of ontzegging van den eisch om eenige
      andere reden, wordt hooger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      Behoudens ingeval van nietigverklaring van de dagvaarding of niet-ontvankelijkheidverklaring dan wel ontzegging
      van de eis, benoemt de rechtbank een of meer deskundigen in oneven getale. Zij geeft aan hen opdracht om de
      schadeloosstellingen te begroten van de verweerder en derde belanghebbenden, doch slechts voor zover zij het aan
      hen ten processe gedane aanbod niet hebben aanvaard.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel27
  - number: '27.2'
    text: |-
      Zij benoemt voorts een harer leden, om vergezeld van de griffier, als commissaris bij de opneming door deskundigen
      van de ligging en gesteldheid der onroerende zaken waarop de onteigening betrekking heeft, tegenwoordig te zijn
      en wijst een of meer nieuws- of advertentiebladen aan, waarin de aankondiging door de griffier, in het volgende
      artikel vermeld, moet geschieden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel27
  - number: '27.3'
    text: |-
      Deze benoeming en aanwijzing vinden ook plaats, indien er verstek mocht zijn verleend of indien de gedaagde het
      voor hem bestemde gedeelte van het aanbod heeft aanvaard en niet blijkt, dat de derde belanghebbenden het voor hen
      bestemde gedeelte van het aanbod genoegzaam achten. Tegen de verlening van verstek wordt geen verzet toegelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel27
  - number: '27.4'
    text: |-
      Ingeval de verweerder of een derde belanghebbende het aan hem ten processe gedane aanbod heeft aanvaard, bepaalt de
      rechtbank in haar vonnis de schadeloosstelling voor de betrokkene op de som van dat aanvaarde aanbod.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel27
  - number: '28.1'
    text: |-
      De tijd en plaats van de opneming door deskundigen van de ligging en gesteldheid der onroerende zaken waarop de
      onteigening betrekking heeft, worden door de rechtercommissaris met inachtneming van de meest mogelijke spoed
      bepaald en medegedeeld aan de griffier. Zij worden door de griffier bekend gemaakt door een aankondiging in een of
      meer daartoe in het vonnis aangewezen nieuws- of advertentiebladen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel28
  - number: '28.2'
    text: |-
      De griffier geeft binnen acht dagen, nadat het vonnis is gewezen, aan de deskundigen kennis van hunne benoeming.
      Ten minste acht dagen voor den dag, waarop de opneming zal plaats hebben, zendt hij aan ieder der deskundigen een
      afschrift van het vonnis en roept hij partijen en deskundigen op om bij de opneming tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel28
  - number: '28.3'
    text: Bij afwezigheid van de wederpartij gaat de opneming door.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel28
  - number: '28.4'
    text: Derde belanghebbenden kunnen bij de opneming tegenwoordig zijn om ook hunne schade te doen begrooten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel28
  - number: '29.1'
    text: |-
      In de plaats der deskundigen, die niet opgekomen zijn of weigeren aan hun verplichtingen te voldoen, benoemt
      de rechter-commissaris anderen. Indien ten gevolge hiervan de opneming moet worden uitgesteld, bepaalt de
      rechtercommissaris daarvoor een nadere tijd waarvan de griffier mededeling doet aan partijen, derde belanghebbenden
      en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel29
  - number: '29.2'
    text: |-
      De rechtercommissaris brengt de bepalingen dezer wet omtrent de begroting der schadeloosstelling, voor zoveel ter
      zake vereist wordt, onder de aandacht der deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel29
  - number: '29.3'
    text: |-
      De deskundigen nemen bij de opneming de toestand van de onroerende zaak waarop de onteigening betrekking heeft, op
      door foto's en tekeningen en andere daartoe geschikte middelen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel29
  - number: '30'
    text: |-
      Partijen en derde belanghebbenden delen aan de rechtercommissaris alle feiten en omstandigheden mede, die van
      belang zijn voor een juiste begroting van de schade en leggen daartoe de nodige stukken over.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel30
  - number: '31.1'
    text: |-
      Ook ambtshalve kan de regtercommissaris ten allen tijde die personen voor zich en voor de deskundigen doen
      verschijnen, wier inlichtingen hij tot betere beoordeeling der zaak nuttig mogt achten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel31
  - number: '31.2'
    text: |-
      Indien deze personen schadeloosstelling vorderen, wordt die door den regtercommissaris begroot en daarvan melding
      gemaakt in het procesverbaal.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel31
  - number: '32'
    text: |-
      De formaliteiten, bij het [Wetboek van Burgerlijke Regtsvordering][ref1] voorgeschreven omtrent het getuigenverhoor
      en het berigt van deskundigen, zijn ten deze niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '33.1'
    text: |-
      Wanneer de deskundigen of de personen, wier verschijning de regtercommissaris gelast heeft, op den bepaalden tijd,
      schoon behoorlijk geroepen, niet opkomen, of, zonder wettige redenen, weigeren de van hen gevraagde inlichtingen
      te geven, worden zij door den regtercommissaris veroordeeld tot vergoeding der te vergeefs gedane onkosten; alles
      onverminderd hunne gehoudenheid jegens de partijen tot schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel33
  - number: '33.2'
    text: |-
      Hij kan hen echter op hun verzet bij verzoekschrift, om billijke redenen, van de tegen hen uitgesprokene
      veroordeeling vrijstellen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel33
  - number: '34.1'
    text: De griffier maakt van de opneming een door de rechtercommissaris en hem te ondertekenen proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '34.2'
    text: |-
      Hij neemt daarin de verklaringen van de bij de opneming gehoorde personen op, nadat deze verklaringen hun zijn
      voorgelezen en door hen zijn ondertekend.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '34.3'
    text: |-
      Voorts neemt hij daarin op de punten, waarover partijen of derde belanghebbenden hebben toegezegd nadere
      inlichtingen te zullen geven of waaromtrent hun door de rechtercommissaris is opgedragen nadere inlichtingen te
      verschaffen. De rechtercommissaris bepaalt de termijn, waarbinnen die inlichtingen moeten zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '34.4'
    text: |-
      De rechtercommissaris stelt tevens na overleg met de deskundigen de dag vast, waarop de nederlegging ter griffie
      van het deskundigenrapport zal plaats vinden, met dien verstande, dat die dag niet later wordt bepaald dan
      uiterlijk zes maanden na de dag van de opneming. Ingeval de rechtercommissaris een termijn heeft bepaald als
      bedoeld in het vorige lid, wordt die dag niet later bepaald dan uiterlijk zes maanden na afloop van die termijn. In
      het proces-verbaal wordt de dag van de nederlegging vermeld.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '34.5'
    text: |-
      De griffier zendt een afschrift van het proces-verbaal van de opneming aan partijen, in het proces-verbaal vermelde
      derde belanghebbenden en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '34.6'
    text: |-
      De rechtercommissaris kan één maal op met redenen omkleed verzoek van de deskundigen uitstel van de nederlegging
      toestaan. Hij stelt alsdan een nieuwe dag daarvoor vast, waarvan de griffier bericht zendt aan partijen, derde
      belanghebbenden en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel34
  - number: '35.1'
    text: |-
      De deskundigen begroten de schadeloosstellingen overeenkomstig de hun krachtens [artikel 27, eerste lid][ref1],
      verstrekte opdracht. Zij verklaren daarbij de gronden waarop hun begroting rust.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel27
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
  - number: '35.2'
    text: |-
      Het rapport van de deskundigen wordt tot aan de in [artikel 37, eerste lid][ref1], bedoelde terechtzitting ter
      inzage van partijen en van derde belanghebbenden ter griffie nedergelegd. Van de nederlegging doet de griffier
      mededeling aan partijen en derde belanghebbenden. Hij geeft daarvan tevens kennis in een of meer door de
      rechtercommissaris aan te wijzen nieuws- of advertentiebladen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
  - number: '36.1'
    text: |-
      Gedurende vier weken na de dag van de nederlegging, bedoeld in [artikel 35, tweede lid][ref1], kunnen partijen en
      derde belanghebbenden een bezwaarschrift bij de rechtercommissaris indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel35
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '35'
        hoofdstuk: III
  - number: '36.2'
    text: |-
      De griffier zendt onverwijld een afschrift van de bezwaarschriften aan de wederpartij, derde belanghebbenden en
      de deskundigen, die gedurende vier weken na de dag van de toezending een verweerschrift bij de rechtercommissaris
      kunnen indienen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel36
  - number: '36.3'
    text: |-
      Indien de rechtercommissaris, na overleg met de deskundigen, zulks in het belang van een goede behandeling van de
      zaak gewenst acht, vindt zo spoedig mogelijk na het verstrijken van de in het voorgaande lid bedoelde termijn de
      behandeling van de ingediende bezwaarschriften en verweerschriften te zijnen overstaan plaats. De griffier roept
      partijen, derde belanghebbenden en de deskundigen op.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel36
  - number: '36.4'
    text: |-
      De griffier maakt van de behandeling van de bezwaarschriften en de verweerschriften een door de rechtercommissaris
      en hem te ondertekenen proces-verbaal op. De griffier zendt onverwijld een afschrift van het proces-verbaal aan
      partijen, derde belanghebbenden en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel36
  - number: 36a
    text: |-
      Indien geen bezwaarschrift is ingediend of indien later blijkt van feitelijke bezwaren, die in het ingediende
      bezwaarschrift niet waren vermeld, dan kan de rechtbank aan later opgekomen bezwaren de betekenis hechten, die zij
      geraden zal achten. Indien haar blijkt dat deze bezwaren berusten op feiten of omstandigheden, die ten tijde van de
      in [artikel 36, eerste lid][ref1], bedoelde termijn niet bekend waren of redelijkerwijs bekend konden zijn, neemt
      zij deze in ieder geval in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel36
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '36'
        hoofdstuk: III
  - number: '37.1'
    text: |-
      In de eerste voor de behandeling van burgerlijke zaken bestemde terechtzitting, welke plaats heeft na verloop van
      vier weken na de dag van de in [artikel 36][ref1] bedoelde zitting, kunnen derde belanghebbenden een conclusie
      nemen en, zowel als partijen, bezwaarschriften, verweerschriften en conclusies nader bij pleidooi ontwikkelen.
      Ingeval geen bezwaarschriften zijn ingediend, zullen de pleidooien plaats vinden uiterlijk zes weken na de dag
      van de nederlegging van het rapport van deskundigen. De griffier roept partijen, derde belanghebbenden zomede
      de deskundigen op om ter terechtzitting aanwezig te zijn, opdat dezen desgevraagd mondelinge toelichting op het
      uitgebrachte advies verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel36
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '36'
        hoofdstuk: III
  - number: '37.2'
    text: |-
      Uiterlijk binnen vier weken na de in dit artikel bedoelde terechtzitting doet de rechtbank, indien zij geen gebruik
      heeft gemaakt van de haar in [artikel 194, vijfde lid van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      toegekende bevoegdheid, uitspraak over de onteigening, stelt zij in haar vonnis de schadeloosstellingen vast voor
      de verweerder en de derde belanghebbenden en vermeldt zij tevens de schadeloosstellingen die reeds zijn bepaald
      ingevolge [artikel 27, laatste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel27
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '194'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
  - number: '38.1'
    text: |-
      Gebouwen, van welke een gedeelte onteigend wordt, moeten, op de vordering des eigenaars bij zijne conclusie, in
      [art. 24][ref1] genoemd, door de onteigenende partij geheel worden overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel24
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '24'
        hoofdstuk: III
  - number: '38.2'
    text: |-
      Ditzelfde zal met erven moeten geschieden, wanneer deze door de onteigening tot een vierde hunner uitgestrektheid
      verminderen of kleiner dan tien aren worden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel38
  - number: '38.3'
    text: |-
      Deze overneming kan echter niet gevorderd worden, wanneer het overgebleven stuk gronds onmiddellijk aan een ander
      erf van denzelfden eigenaar grenst.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel38
  - number: '39'
    text: |-
      Bij de berekening der schadevergoeding wordt niet gelet op veranderingen, welke kennelijk zijn tot stand gebracht
      om de schadevergoeding te verhogen; evenmin wordt gelet op veranderingen, tot stand gebracht na terinzagelegging
      als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1], tenzij het normale of noodzakelijke
      veranderingen betreft die aansluiten bij de aard en de wijze van gebruik van de onroerende zaak ten tijde van die
      nederlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '40'
    text: |-
      De schadeloosstelling vormt een volledige vergoeding voor alle schade, die de eigenaar rechtstreeks en noodzakelijk
      door het verlies van zijn zaak lijdt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40
  - number: 40a
    text: |-
      Bij het bepalen van de schadeloosstelling wordt uitgegaan van de dag, waarop het vonnis van onteigening, bedoeld
      in [artikel 37, tweede lid][ref1], of [artikel 54][ref2], wordt uitgesproken, met dien verstande, dat ingeval het
      vonnis, bedoeld in [artikel 54][ref3], binnen de in [artikel 54][ref4] bedoelde termijn wordt ingeschreven in de
      openbare registers, wordt uitgegaan van de dag, waarop dit vonnis wordt ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 40b.1
    text: |-
      De werkelijke waarde van de onteigende zaak, niet de denkbeeldige, die de zaak uitsluitend voor de persoon van de
      rechthebbende heeft, wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40b
  - number: 40b.2
    text: |-
      Bij het bepalen van de werkelijke waarde wordt uitgegaan van de prijs, tot stand gekomen bij een onderstelde
      koop in het vrije commerciële verkeer tussen de onteigende als redelijk handelende verkoper en de onteigenaar als
      redelijk handelende koper.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40b
  - number: 40b.3
    text: In bijzondere gevallen wordt de werkelijke waarde naar andere maatstaf bepaald.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40b
  - number: 40c
    text: |-
      Bij het bepalen van de schadeloosstelling wegens verlies van een onroerende zaak wordt geen rekening gehouden met
      voordelen of nadelen, teweeggebracht door
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40c
  - number: 40c.1°
    text: het werk waarvoor onteigend wordt;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40c
  - number: 40c.2°
    text: overheidswerken die in verband staan met het werk waarvoor onteigend wordt;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40c
  - number: 40c.3°
    text: de plannen voor de werken onder 1° en 2° bedoeld.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40c
  - number: 40d.1
    text: 'Bij het bepalen van de prijs van een onroerende zaak wordt rekening gehouden:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40d
  - number: 40d.1.a
    text: |-
      met ter plaatse geldende voorschriften en gebruiken betreffende lasten en baten, welke uit de exploitatie van de
      zaak of van een complex, waarvan zij deel uitmaakt, naar verwachting zullen voortvloeien en betreffende de omslag
      daarvan, voor zover een redelijk handelend verkoper en koper hiermee rekening plegen te houden;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40d
  - number: 40d.1.b
    text: |-
      met alle bestemmingen die gelden voor zaken, die deel uitmaken van het complex, in dier voege dat elke bestemming
      van een zaak de waardering van alle zaken binnen het complex beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40d
  - number: 40d.2
    text: Onder een complex wordt verstaan de als één geheel in exploitatie gebrachte of te brengen zaken.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40d
  - number: 40e
    text: |-
      Bij het bepalen van de werkelijke waarde van een zaak wordt de prijs verminderd of vermeerderd met voordelen of
      nadelen tengevolge van
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40e
  - number: 40e.1°
    text: bestemmingen die door het werk waarvoor onteigend wordt, tot uitvoering komen;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40e
  - number: 40e.2°
    text: bestemmingen, voor de feitelijke handhaving waarvan onteigend wordt,
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40e
  - number: 40f
    text: |-
      Op de prijsvermeerdering bedoeld in [artikel 40e][ref1] komt in mindering de vergoeding welke te dier zake op grond
      van [artikel 6.1 van de Wet ruimtelijke ordening][ref2] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40e
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel6
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40e
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '6'
  - number: '41'
    text: |-
      Bij het bepalen van de schadeloosstelling wordt rekening gehouden met de mindere waarde, welke voor niet onteigende
      goederen van de onteigende het rechtstreeks en noodzakelijk gevolg van het verlies van zijn goed is.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel41
  - number: 41a
    text: |-
      Voor zover de volgende artikelen niet anders meebrengen, zijn de [artikelen 40-41][ref1] van overeenkomstige
      toepassing op rechten die door de onteigening geheel of gedeeltelijk vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '40'
        hoofdstuk: III
  - number: '42.1'
    text: |-
      Bij de onteigening van verhuurde bedrijfsruimte, als omschreven in
      [artikel 309 lid 5 van Boek 7 van het Burgerlijk Wetboek][ref1], wordt door de onteigenende partij aan de
      huurder en de onderhuurder aan wie bevoegdelijk is onderverhuurd schadeloosstelling betaald. Bij de bepaling
      van de schadeloosstelling wordt rekening gehouden met de kans dat de huurverhouding bij het verstrijken van de
      geldigheidsduur der overeenkomst zou hebben voortgeduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel309
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '309'
  - number: '42.2'
    text: |-
      Bij de onteigening van een anderszins verhuurde onroerende zaak wordt door de onteigenende partij aan den huurder,
      wiens huurtijd nog één of meer jaren moet duren, tot schadeloosstelling eene som betaald, gelijkstaande aan den
      huurprijs van twee jaren.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42
  - number: '42.3'
    text: |-
      Indien nogtans de te velde staande vruchten, of de onkosten welke de huurder aantoont gedurende de laatste
      twee jaren aan de onroerende zaak te hebben besteed, meer beloopen dan de in het vorige lid bedoelde tweejarige
      huurprijs, wordt de waarde dier vruchten of het bedrag dier onkosten als schadeloosstelling betaald. Indien de
      huurder minder dan een jaar huur had, wordt hem de huurprijs van een vol jaar, of de waarde der te velde staande
      vruchten, zoo die meer beloopt, vergoed.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42
  - number: '42.4'
    text: |-
      Indien de verhuring na terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1],
      heeft plaats gehad, wordt door de onteigenende partij aan den huurder geene schadeloosstelling betaald, maar heeft
      deze eene vordering tot schadevergoeding tegen den verhuurder, ten ware anders mogt zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 42a.1
    text: |-
      Bij de onteigening van een verpachte onroerende zaak wordt door de onteigenende partij aan de pachter
      schadeloosstelling betaald.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
  - number: 42a.2
    text: |-
      Indien de pachtovereenkomst voor de in
      [artikel 325, eerste of tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1] bedoelde duur is aangegaan of
      geldt, dan wel voor een kortere duur is aangegaan en nadien met zes jaren is verlengd, wordt bij de bepaling
      van de schadeloosstelling rekening gehouden met de mogelijkheid, dat de pachtovereenkomst ingevolge de
      [artikelen 325, vijfde lid][ref2], en [367 tot en met 374 van Boek 7 van het Burgerlijk Wetboek][ref3] zou zijn
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel367
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '367'
  - number: 42a.3
    text: |-
      Het bepaalde in het tweede lid vindt geen toepassing, indien de pachtverhouding is aangevangen, nadat aan het
      verpachte bij een goedgekeurd bestemmingsplan een niet tot de landbouw betrekkelijke bestemming is gegeven. In
      dat geval wordt de pachtovereenkomst met betrekking tot een hoeve of los land, welke is aangegaan voor langer
      dan twaalf, onderscheidenlijk zes jaren, voor de bepaling van de schadeloosstelling geacht te zijn aangegaan voor
      twaalf, onderscheidenlijk zes jaren, met dien verstande, dat, indien de onteigening plaats vindt na die termijn, de
      overeenkomst geacht wordt telkens voor zes jaren te zijn verlengd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
  - number: 42a.4
    text: |-
      Indien evenwel het verpachte sinds een tijdstip, liggend voor de goedkeuring bedoeld in het vorige lid,
      achtereenvolgens bij personen die ten tijde van de opvolging in het gebruik tot de voorgaande gebruiker in enige
      in [artikel 363, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] genoemde betrekking stonden persoonlijk
      in gebruik is geweest voor een tot de landbouw betrekkelijk doel, blijft het bepaalde in het tweede lid van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel363
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '363'
  - number: 42a.5
    text: |-
      Indien op het tijdstip van terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1]
      de pachtovereenkomst ingevolge [artikel 322 van Boek 7 van het Burgerlijk Wetboek][ref2] voor onbepaalde
      tijd geldt, wordt voor de berekening van de schadeloosstelling uitgegaan van de overeengekomen duur,
      doch ingeval de overeenkomst voor onbepaalde tijd is aangegaan, nimmer van een langere dan de in
      [artikel 325, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3] bedoelde duur. Voor de berekening
      van de schadeloosstelling wordt op gelijke wijze als ten aanzien van pachtovereenkomsten, waarop
      [artikel 9 van de Pachtwet][ref4] niet van toepassing is, aangenomen, dat de pachtovereenkomst zou kunnen worden
      verlengd; het derde en vierde lid vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel322
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref4]: https://wetten.overheid.nl/BWBR0002269#Artikel9
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '322'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref4
        bwb_id: BWBR0002269
        artikel: '9'
  - number: 42a.6
    text: |-
      Indien de verpachting na terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1],
      heeft plaats gehad, wordt door de onteigenende partij aan de pachter geen schadeloosstelling betaald, maar heeft
      deze een vordering tot schadevergoeding tegen de verpachter, ten ware anders mocht zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '43.1'
    text: |-
      De hypotheekhouder en de ingeschreven beslaglegger hebben geen recht op afzonderlijke
      schadevergoeding. Slechts indien zij zijn tussengekomen, kunnen zij zich jegens de onteigenaar
      beroepen op hun rechten uit [artikel 229 van Boek 3 van het Burgerlijk Wetboek][ref1] en
      [artikel 507a van het Wetboek van Burgerlijke Rechtsvordering][ref2]. Zij oefenen die rechten uit op het
      bedrag van de werkelijke waarde en de waardevermindering van het overblijvende, zoals dat bedrag toekomt aan de
      hypotheekgever, de beslagene en de beperkt gerechtigde, wiens recht niet tegen hen kan worden ingeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel507a
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 507a
  - number: '43.2'
    text: |-
      Indien alle in het vorige lid vermelde belanghebbenden tot overeenstemming omtrent de verdeling zijn gekomen,
      bepaalt de rechter wat aan ieder van hen moet worden betaald. Is geen overeenstemming bereikt, dan worden
      de bedragen in hun geheel toegewezen aan de tussengekomen hypotheekhouder, hoogste in rang, dan wel, zo geen
      hypotheekhouder is tussengekomen, aan de daartoe door de eerst ingeschreven beslaglegger aangewezen notaris of
      deurwaarder, en vindt verdeling plaats met toepassing van de regels betreffende de verdeling van een zodanige
      opbrengst in het [Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '43.3'
    text: |-
      Een beslaglegger behoeft voor de toepassing van het vorige lid niet tussen te komen, indien hij aan de onteigenaar
      bij exploit meedeelt zijn rechten uit [artikel 507a van het Wetboek van Burgerlijke Rechtsvordering][ref1] te
      bepalen tot het deel van de in het eerste lid bedoelde bedragen, dat voor de beslagene bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel507a
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 507a
  - number: '43.4'
    text: |-
      Ten aanzien van het voorschot op de schadeloosstelling en de verhogingen daarvan zijn de vorige leden van
      overeenkomstige toepassing, met dien verstande dat bij de verdeling tussen de belanghebbenden onderling de
      hypotheekhouder en beslagleggers hun recht op deze bedragen uitoefenen voor zover zij kunnen worden beschouwd
      als een voorschot op het in het eerste lid, derde zin, bedoelde bedrag. Op verlangen van elk der partijen kan
      de rechtercommissaris in een rangregeling bepalen dat deze niet zal worden gesloten, voordat het vonnis waarbij
      de schadeloosstelling is vastgesteld in kracht van gewijsde is gegaan. In het geval van [artikel 54][ref1], kan
      binnen een jaar nadat het vonnis bedoeld in [artikel 54][ref2], kracht van gewijsde heeft verkregen, door elk van
      de belanghebbenden heropening van een gesloten rangregeling worden gevraagd en kan de rechtercommissaris hen die
      teveel hebben ontvangen bij bevelschrift gelasten dit terug te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '44'
    text: |-
      Bij de bepaling van de schadeloosstelling wegens het vervallen van een erfdienstbaarheid of een recht als bedoeld
      in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref1] wordt rekening gehouden met hetgeen te verwachten
      is omtrent de wijziging of de opheffing krachtens de [artikelen 78][ref2] en [79 van Boek 5][ref3], dan wel
      de [artikelen 258][ref4] en [259 van Boek 6 van dat wetboek][ref5] en de daaraan te verbinden voorwaarden.
      [Artikel 40][ref6] mist in zoverre toepassing. Overigens wordt rekening gehouden met de mogelijkheid de
      erfdienstbaarheid of het recht als bedoeld in [artikel 252 van Boek 6 van dat wetboek][ref7] door een andere
      erfdienstbaarheid of een ander recht te vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005288#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0005288#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel258
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel259
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel40c
      [ref7]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
      - id: ref2
        bwb_id: BWBR0005288
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0005288
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '258'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '259'
      - id: ref6
        bwb_id: BWBR0001842
        artikel: 40c
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0005289
        artikel: '252'
  - number: '45.1'
    text: |-
      De vruchtgebruiker kan zich jegens de onteigenaar slechts op verkrijging van een vruchtgebruik op de vordering tot
      schadeloosstelling voor de hoofdgerechtigde krachtens [artikel 213 van Boek 3 van het Burgerlijk Wetboek][ref1]
      beroepen, indien hij is tussengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel213
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '213'
  - number: '45.2'
    text: |-
      Bij onteigening van goederen die zijn vermaakt onder een ontbindende voorwaarde en een daarbij aansluitende
      opschortende voorwaarde doet de bezwaarde erfgenaam de schadeloosstelling in een der schuldregisters voor
      geldleningen ten laste van het Rijk inschrijven.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel45
  - number: '46'
    text: |-
      Bij onteigening van een krachtens huurkoop verkochte onroerende zaak wordt uit het bedrag van de werkelijke waarde
      van de zaak aan de huurverkoper een schadeloosstelling toegekend wegens de aanspraken uit de huurkoopovereenkomst
      die hij verliest; hetgeen overblijft, komt aan de huurkoper toe.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel46
  - number: '50.1'
    text: |-
      De kosten van het proces komen ten laste van de onteigenende partij, met dien verstande echter dat ingeval aan
      de verweerder onderscheidenlijk een derde belanghebbende, die het aan hem ten processe gedane aanbod niet heeft
      aanvaard, niet meer wordt toegewezen dan hem werd aangeboden, de rechtbank de betrokkene kan veroordelen tot
      betaling van de kosten van het geding of van een door haar naar billijkheid te bepalen gedeelte van die kosten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel50
  - number: '50.2'
    text: |-
      In afwijking van het bepaalde in het vorige lid komen de kosten van het proces steeds ten laste van de onteigenende
      partij, indien in de dagvaarding niet is vermeld welke som aan de verweerder onderscheidenlijk aan ieder der
      belanghebbenden, die aan de onteigenende partij bekend konden zijn, als schadeloosstelling wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de rechtbank evenwel van oordeel is, dat de onteigenende partij tengevolge van gebrek aan medewerking aan
      de zijde van de verweerder of een derde belanghebbende voor de aanvang van het geding tot onteigening, onvoldoende
      gegevens ter beschikking heeft gehad tot het doen van een redelijk aanbod bij dagvaarding of aangetekende brief,
      of wanneer zij daartoe aanleiding vindt in de omstandigheden van het geding, kan zij de verweerder veroordelen
      in de kosten van het proces of, overeenkomstig het eerste lid van dit artikel, de betrokkene veroordelen tot
      betaling van een gedeelte van die kosten. Ingeval de som der kosten waarin een verweerder of derde belanghebbende
      is veroordeeld, hoger is dan die van de aan hem toegekende schadeloosstelling, kan de rechtbank de betrokkene
      veroordelen tot betaling van het verschil dier sommen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel50
  - number: '50.4'
    text: |-
      Onder de kosten van het geding zijn mede begrepen kosten van rechtsbijstand of andere deskundige bijstand, die naar
      het oordeel van de rechtbank redelijkerwijs door verweerders of derde belanghebbenden zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel50
  - number: '50.5'
    text: |-
      De kosten van de bekendmakingen, bedoeld in de [artikelen 28][ref1], [35][ref2], [54][ref3] en [54d][ref4], komen
      steeds voor rekening van de onteigenende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54d
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '28'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '35'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '54'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 54d
        hoofdstuk: IIIa
        afdeling: '1'
  - number: '51'
    text: |-
      Wanneer het vonnis bij verstek is gewezen, kan men daartegen binnen acht dagen na de beteekening, op de wijze, in
      het [Wetboek van Burgerlijke Regtsvordering][ref1] voorgeschreven, in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '52.1'
    text: Tegen het vonnis wordt geen hooger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel52
  - number: '52.2'
    text: De voorziening in cassatie moet binnen twee weken na de uitspraak plaats hebben.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel52
  - number: '52.3'
    text: Zij geschiedt door eene verklaring ter griffie der regtbank, die het vonnis heeft gewezen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel52
  - number: '53.1'
    text: |-
      Deze verklaring wordt binnen zes weken na afloop van de in het vorige artikel genoemde termijn van twee weken met
      een ontwikkeling van de gronden der cassatie aan de tegenpartij betekend en gaat vergezeld van een dagvaarding
      tegen de eerste terechtzitting, welke na verloop van twee weken na de betekening plaats vindt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel53
  - number: '53.2'
    text: |-
      De conclusie van de eiser, bedoeld in
      [artikel 412, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], wordt genomen ten pleitdage.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel412
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '412'
  - number: '54.1'
    text: |-
      Binnen acht dagen nadat het in [artikel 37][ref1] bedoelde vonnis gezag van gewijsde heeft verkregen, doet de
      griffier het bij uittreksel in een of meer bij vonnis aangewezen nieuws- of advertentiebladen plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
  - number: '54.2'
    text: |-
      Hetzelfde heeft, met inachtneming van denzelfden termijn, op last van de griffier bij den Hoogen Raad plaats,
      wanneer de voorziening in cassatie tegen het vonnis, waarbij de onteigening werd uitgesproken, verworpen is, of
      wanneer de Hooge Raad, het vonnis des eersten regters vernietigende, de onteigening uitspreekt, in welk geval zijn
      arrest het nieuws- of advertentieblad aanwijst.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54
  - number: 54a.1
    text: |-
      De onteigenende partij, die voornemens is de procedure van [Afdeling 2][ref1] van dit Hoofdstuk te volgen,
      kan zodra de ingevolge [artikel 63, eerste lid][ref2], dan wel [artikel 78, tweede lid][ref3], vereiste
      terinzagelegging, heeft plaats gevonden, aan de rechtbank voor wie de onteigening zal moeten worden gevorderd,
      verzoeken om de benoeming van een rechtercommissaris en van een of meer deskundigen in oneven getale, alsmede tot
      bepaling van de dag, waarop de opneming door de deskundigen van de ligging en gesteldheid der onroerende zaken,
      waarop de onteigening betrekking heeft, zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel63
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel78
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '63'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '78'
  - number: 54a.2
    text: 'Bij het verzoekschrift moeten worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.2.a
    text: |-
      een uitgewerkt plan met uitvoerige kaarten van het werk en met grondtekeningen, waarop de te onteigenen onroerende
      zaken en de onroerende zaken waarop te onteigenen rechten rusten, met vermelding van hun kadastrale aanduiding
      zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.2.b
    text: 'een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.2.b.1°
    text: |-
      de grootte volgens de basisregistratie kadaster van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.2.b.2°
    text: de namen van de eigenaars van elk dier zaken, volgens de basisregistratie kadaster;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.2.c
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], een lijst van de te onteigenen rechten
      met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de rechthebbenden op
      die rechten volgens de basisregistratie kadaster;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 54a.2.d
    text: |-
      het bewijs, bedoeld in [artikel 23, onder 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: 54a.2.e
    text: |-
      een opgave van de hypotheekhouders of van hen, die beslag hebben gelegd met betrekking tot hetgeen onteigend moet
      worden, voor zover zij zijn vermeld in de openbare registers.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
  - number: 54a.3
    text: |-
      Het verzoekschrift bevat een opgave van de kadastrale aanduiding alsmede een omschrijving van de aard van hetgeen
      onteigend moet worden, benevens een opsomming van de namen en adressen van degenen die volgens de basisregistratie
      kadaster daarop enig recht hebben, alsmede van ieder, die aan de onteigenende partij op het tijdstip van de
      indiening van het verzoekschrift als derde belanghebbende, als bedoeld in [artikel 3, tweede lid][ref1], bekend is,
      onder vermelding van de bedragen, welke de onteigenende partij aan ieder van hen voornemens is bij dagvaarding aan
      te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '3'
  - number: 54a.4
    text: |-
      Het verzoekschrift bevat tevens indien daartoe termen zijn een verzoek tot benoeming van een derde, bedoeld in
      [artikel 20][ref1]. Tevens kan de onteigenende partij in het verzoekschrift een voorkeur uitspreken met betrekking
      tot het tijdvak, waarin de hiervoor bedoelde opneming zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel20
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '20'
        hoofdstuk: III
  - number: 54b.1
    text: |-
      De onteigenende partij doet binnen een week een afschrift van het verzoekschrift betekenen of zendt een afschrift
      van het verzoekschrift bij aangetekende brief, waarvoor een bericht van ontvangst wordt verlangd, aan degenen die
      in het verzoekschrift zijn vermeld. Ingeval van betekening wordt een gewaarmerkt afschrift van het exploit van
      betekening aan de griffier gezonden. In geval van een aangetekende brief bevestigt de onteigenende partij aan de
      griffier dat de aangetekende brief is verzonden en daarvoor een bericht van ontvangst is verkregen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54b
  - number: 54b.2
    text: |-
      Ten aanzien van een huurder van woonruimte, als bedoeld in
      [artikel 233 van Boek 7 van het Burgerlijk Wetboek][ref1], kan in de aangetekende brief worden volstaan met de
      mededeling van het ingediende verzoekschrift en van het daarin vermelde, voor zover dit op hem betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel233
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '233'
  - number: 54c.1
    text: |-
      De rechtbank beschikt binnen een maand op het verzoek. Indien de in [artikel 54][ref1] en [54][ref2] vereiste
      stukken niet volledig zijn overgelegd of niet ingezonden, stelt de rechtbank een termijn van ten hoogste twee weken
      vast, waarbinnen de onteigenende partij alsnog tot aanvulling van die stukken kan overgaan, bij gebreke waarvan
      afwijzend op het verzoek wordt beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54b
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54a
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54b
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 54c.2
    text: |-
      Bij toewijzing van het verzoek benoemt de rechtbank een harer leden tot rechtercommissaris alsmede een of
      meer deskundigen in oneven getale. Zonodig benoemt zij tevens een derde, bedoeld in [artikel 20][ref1]. De
      rechtercommissaris bepaalt met de meest mogelijke spoed de tijd en de plaats waarop de opneming door deskundigen
      zal plaats vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel20
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '20'
        hoofdstuk: III
  - number: 54c.3
    text: Tegen de beschikking staan alleen aan de verzoeker de rechtsmiddelen van hoger beroep en beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54c
  - number: 54d
    text: |-
      De griffier zendt aan degenen, die in het verzoekschrift zijn vermeld en tevens aan de deskundigen onverwijld een
      afschrift toe van de in het vorige artikel bedoelde beschikking; voorts deelt hij hun de tijd en de plaats van
      de opneming door deskundigen mede. Ook draagt hij zorg, dat de tijd en de plaats van de opneming door deskundigen
      worden aangekondigd in een of meer nieuws- of advertentiebladen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54d
  - number: 54e.1
    text: |-
      De [artikelen 28, derde lid, tot en met 34, derde lid][ref1], alsmede [artikel 34, vijfde lid][ref2], zijn op de
      opneming door deskundigen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel34
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54e
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '28'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '34'
        hoofdstuk: III
  - number: 54e.2
    text: |-
      Op verzoek van de meest gerede partij, geven de deskundigen zo mogelijk hun voorlopig oordeel over de
      schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54e
  - number: 54f
    text: |-
      De onteigenende partij kan, overeenkomstig de bepalingen van deze Afdeling, in de dagvaarding tot onteigening
      een vervroegde uitspraak over de onteigening vorderen. Ingeval de opneming door de deskundigen heeft plaats
      gehad overeenkomstig Afdeling 1 van dit Hoofdstuk, is de onteigenende partij op straffe van niet-ontvankelijkheid
      gehouden tot het doen van die vordering. Zodra het vonnis van onteigening kracht van gewijsde heeft verkregen, kan
      het in de openbare registers worden ingeschreven, voordat over de schadeloosstelling uitspraak is gedaan.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54f
  - number: 54g
    text: |-
      Onverminderd de [artikelen 64a, vierde lid][ref1], [78, achtste lid][ref2], en [79][ref3], moet de dagvaarding
      waarbij de vervroegde uitspraak tot onteigening wordt gevorderd, indien de opneming door de deskundigen
      overeenkomstig [Afdeling 1 van dit Hoofdstuk][ref4] heeft plaats gevonden, worden uitgebracht binnen twee maanden
      na de opneming ter plaatse door de deskundigen. Indien de plaatsing in de Staatscourant, bedoeld in artikel 64a,
      derde lid, dan wel 78, zevende lid, nog niet is geschied op de dag van de opneming, vangt de termijn van twee
      maanden aan op de tweede dag na de datum van dagtekening van de Staatscourant waarin die plaatsing geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel64a
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54g
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 64a
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 54h
    text: |-
      De [artikelen 17][ref1], [18][ref2], [20][ref3], [22-26][ref4] zijn van overeenkomstige toepassing, met
      dien verstande, dat, wanneer een vervroegde opneming door deskundigen overeenkomstig de bepalingen van
      [Afdeling 1 van dit Hoofdstuk][ref5] heeft plaats gehad, de in [artikel 23][ref6] voorgeschreven terinzagelegging
      alleen zal betreffen het onder 1° van dat artikel bedoelde exemplaar van de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54h
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '18'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '20'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '22'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: 54i.1
    text: |-
      Behoudens ingeval van nietigverklaring van de dagvaarding of niet-ontvankelijkheidverklaring dan wel ontzegging
      van de eis, spreekt de rechtbank de onteigening uit met bepaling van een voorschot op de schadeloosstelling voor
      de verweerders en bekende, niet betwiste derde belanghebbenden en van de door de onteigenende partij te treffen
      bijkomende voorzieningen, indien deze in het aanbod zijn opgenomen. Het voorschot wordt bepaald op het bedrag,
      waarover terzake tussen hen en de onteigenende partij overeenstemming bestaat blijkens gewisselde conclusies of
      door de verweerders of derde belanghebbenden ondertekende bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54i
  - number: 54i.2
    text: |-
      Indien niet blijkt, dat overeenstemming is bereikt, bepaalt de rechtbank voor ieder het bedrag van het voorschot op
      90 ten honderd van de aan ieder aangeboden schadeloosstelling, tenzij zij, na desgewenst de deskundigen mondeling
      gehoord te hebben, aanleiding vindt het voorschot op een ander bedrag vast te stellen. Indien de rechtbank daartoe
      termen aanwezig acht, kan zij de uitspraak omtrent het voorschot ten hoogste veertien dagen aanhouden. Ingeval een
      verweerder of derde belanghebbende het aan hem ten processe gerichte aanbod heeft aanvaard, bepaalt de rechtbank
      voor de betrokkene geen voorschot en bepaalt zij in haar vonnis de schadeloosstelling voor de betrokkene op de som
      van dat aanvaarde aanbod.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54i
  - number: 54i.3
    text: |-
      Ingeval alle betrokkenen het aan hen ten processe gerichte aanbod hebben aanvaard, geldt het vonnis als een vonnis
      bedoeld in [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54i
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
  - number: 54i.4
    text: |-
      De rechtbank bepaalt voor de onteigende partij en bekende derde belanghebbenden een som als zekerheid voor de
      voldoening van de aan ieder van hen verschuldigde schadeloosstelling. Deze som wordt bepaald op het bedrag,
      waarover overeenstemming is bereikt. Blijkt niet, dat overeenstemming is bereikt, dan wordt die som bepaald
      tenminste op het bedrag dat ieder is aangeboden, verminderd met het voorschot.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54i
  - number: 54i.5
    text: |-
      Indien blijkens het proces-verbaal van de opneming door de deskundigen, die plaats heeft gevonden volgens
      [Afdeling 1 van dit Hoofdstuk][ref1], de betrokkene afstand heeft gedaan van het recht op zekerheidstelling
      stelt de rechtbank voor hem de som als hier bedoeld niet vast. Evenmin doet zij zulks ingeval haar uit gewisselde
      conclusies of door de verweerders of derde belanghebbenden ondertekende bewijsstukken blijkt, dat afstand van het
      recht op zekerheidstelling is gedaan. De rechtbank bepaalt tevens op welke wijze de zekerheidstelling zal plaats
      vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54i
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 54j.1
    text: |-
      Bij het vonnis, waarbij overeenkomstig [artikel 54i][ref1] de onteigening is uitgesproken, benoemt de rechtbank
      een of meer deskundigen in oneven getale. Zij geeft aan hen opdracht om de schadeloosstellingen te begroten voor
      de verweerders en de derde belanghebbenden, doch slechts voor zover zij het aan hen ten processe gedane aanbod niet
      hebben aanvaard. Zij benoemt voorts een harer leden, om vergezeld van de griffier, als commissaris bij de opneming
      door de deskundigen tegenwoordig te zijn en wijst een of meer nieuws- of advertentiebladen aan, een en ander
      overeenkomstig [artikel 27, tweede en derde lid][ref2]. [Artikel 28][ref3] is van overeenkomstige toepassing. Op de
      opneming door de deskundigen zijn de [artikelen 29-34][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel29
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54j
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '28'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '29'
        hoofdstuk: III
  - number: 54j.2
    text: |-
      Ingeval de opneming door de deskundigen reeds heeft plaats gehad overeenkomstig
      [Afdeling 1 van dit Hoofdstuk][ref1], stelt de rechtbank een datum vast waarop de nederlegging van het
      deskundigenrapport zal moeten plaats vinden. De griffier draagt zorg, dat partijen, de in het proces-verbaal
      vermelde derde belanghebbenden en de deskundigen een afschrift van dit vonnis ontvangen. De rechtercommissaris en
      de deskundigen, aangewezen krachtens [artikel 54c][ref2], treden in het geding als zodanig op, tenzij de rechtbank
      anderen in hun plaats aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54c
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54j
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54c
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 54j.3
    text: |-
      Tevens onderzoekt de rechtbank in het in het vorige lid bedoelde geval ambtshalve, of het in de dagvaarding
      aangeduide ter onteigening aangewezen goed hetzelfde is als dat, waarop de opneming door de deskundigen betrekking
      heeft gehad. Indien blijkt, dat zulks niet het geval is, beveelt de rechtbank een nieuwe opneming door de
      deskundigen. Alsdan zijn de [artikelen 27-34][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel27
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54j
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
  - number: 54k.1
    text: |-
      Indien bij de opneming door de deskundigen, die plaats vindt volgens [artikel 54j, eerste of derde lid][ref1],
      blijkt van het bestaan van derde belanghebbenden, die niet in de dagvaarding waren vermeld, draagt de
      rechtercommissaris op hun verzoek aan de onteigenende partij op om binnen een maand, op een door de
      rechtercommissaris aan te wijzen terechtzitting, alsnog een aanbod terzake van de schadeloosstelling aan die derde
      belanghebbenden te doen, mits hun hoedanigheid niet wordt betwist.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54j
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54k
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54j
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54k.2
    text: |-
      Dit aanbod geschiedt bij akte ter rolle. De rechtbank doet bij vonnis uitspraak over het toe te kennen voorschot,
      in elk geval binnen een maand na afloop van de termijn, bedoeld in [artikel 54m][ref1]. Het bedrag van het
      voorschot wordt bepaald op het bedrag, waarover overeenstemming blijkt te bestaan blijkens door de betrokkenen
      ondertekende bewijsstukken. Indien niet blijkt van deze overeenstemming bepaalt de rechtbank het voorschot
      op 90 ten honderd van het bij akte gedane aanbod. Zonodig stelt de rechtbank een nieuwe datum vast, waarop de
      nederlegging van het deskundigenrapport zal moeten plaatsvinden. De griffier draagt zorg, dat deze nieuwe datum ter
      kennis wordt gebracht van partijen, derde belanghebbenden en deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54k
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54k.3
    text: |-
      Ingeval de derde belanghebbende, in het geding tussengekomen, een akte heeft genomen, houdende aanvaarding van het
      aanbod, bepaalt de rechtbank geen voorschot en stelt zij de schadeloosstelling voor de betrokkene vast op de som
      van dat aanvaarde aanbod.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54k
  - number: 54k.4
    text: |-
      De rechtbank kent slechts een voorschot, als bedoeld in het tweede lid, toe, indien de betrokken belanghebbende
      heeft aangetoond, dat het vonnis, waarbij overeenkomstig [artikel 54i][ref1] de onteigening is uitgesproken,
      in de openbare registers is ingeschreven. Is dit vonnis niet binnen de in [artikel 54m][ref2] bedoelde termijn
      ingeschreven, dan wijst de rechtbank het verzoek af. Tenzij blijkt uit het proces-verbaal van de opneming door
      de deskundigen, dat de betrokkene afstand heeft gedaan van het recht op zekerheidstelling, bepaalt de rechtbank
      overeenkomstig [artikel 54i][ref3] de som als zekerheid voor de voldoening der schadeloosstelling. Tevens stelt zij
      de wijze vast waarop de zekerheidstelling zal plaats vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54k
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54k.5
    text: |-
      Ingeval echter de rechtercommissaris de zaak daarvoor vatbaar acht en de onteigenende partij of derde
      belanghebbende daartegen geen bezwaar heeft, bepaalt de rechtercommissaris zelf het bedrag van het voorschot
      tijdens de opneming door de deskundigen, na dezen mondeling te hebben gehoord. Eveneens stelt hij in dat geval
      na de deskundigen mondeling te hebben gehoord voor de betrokkene de som vast als zekerheid voor de voldoening der
      schadeloosstelling, tenzij de betrokkene afstand van het recht op zekerheidstelling doet. Indien geen afstand van
      het recht op zekerheidstelling is gedaan, bepaalt hij tevens de wijze waarop de zekerheidstelling zal plaatsvinden.
      De onteigenende partij is slechts gehouden tot betaling van het ingevolge dit lid toegekende voorschot, nadat
      het vonnis, bedoeld in [artikel 54i][ref1], binnen de in [artikel 54m, eerste lid][ref2], bedoelde termijn is
      ingeschreven in de openbare registers. Het proces-verbaal van de opneming levert een voor tenuitvoerlegging
      vatbare titel op; tot tenuitvoerlegging kan slechts gedurende een tijdvak van een maand na afloop van de in
      [artikel 54m, eerste lid][ref3], genoemde termijn worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54k
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54l.1
    text: |-
      Tegen het vonnis, waarbij overeenkomstig [artikel 54i][ref1] de onteigening is uitgesproken of waarbij nadien een
      voorschot is vastgesteld, staat het rechtsmiddel open van beroep in cassatie. De [artikelen 52][ref2] en [53][ref3]
      zijn van overeenkomstige toepassing, met dien verstande, dat de in [artikel 53, eerste lid][ref4], genoemde termijn
      slechts twee weken bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel53
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54l
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '52'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '53'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '53'
        hoofdstuk: III
  - number: 54l.2
    text: |-
      Tegen het vonnis, of de beschikking, bedoeld in [artikel 54k][ref1], staat geen andere voorziening open dan beroep
      in cassatie in het belang der wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54k
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54l
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54k
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54m.1
    text: |-
      Ingeval de opneming door de deskundigen volgens [artikel 54j, eerste of derde lid][ref1], plaats vindt, kan het
      vonnis, waarbij overeenkomstig [artikel 54 i][ref2] de onteigening is uitgesproken, slechts worden ingeschreven in
      de openbare registers binnen een tijdvak van twee maanden na de opneming door de deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54j
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54m
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54j
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54m.2
    text: |-
      Ingeval de opneming door de deskundigen reeds heeft plaats gevonden overeenkomstig
      [Afdeling 1 van dit Hoofdstuk][ref1], vangt de termijn van twee maanden aan op de dag, dat het vonnis, bedoeld in
      [artikel 54i][ref2], gezag van gewijsde heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54m
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54m.3
    text: |-
      Wanneer na het vonnis van onteigening een voorschot krachtens [artikel 54i][ref1] is bepaald, vangt de termijn aan
      op het tijdstip waarop dat latere vonnis gezag van gewijsde heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54m
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54m.4
    text: |-
      Vindt geen inschrijving plaats binnen de termijn, bedoeld in de vorige leden, dan geldt het bepaalde in de
      [artikelen 55, tweede lid][ref1], of [59][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54m
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '55'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '59'
        hoofdstuk: IV
  - number: 54n.1
    text: |-
      Ter inschrijving van het vonnis waarbij de onteigening overeenkomstig [artikel 54][ref1] is uitgesproken, wordt
      overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54n
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54n.1.1
    text: |-
      indien bij een later vonnis krachtens [artikel 54][ref1] een voorschot is bepaald, dat vonnis vergezeld van een
      verklaring van de griffier houdende dat het in kracht van gewijsde is gegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54n
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54n.1.2
    text: |-
      een afschrift van het proces-verbaal van de opneming door de deskundigen, tenzij
      [Afdeling 1 van dit Hoofdstuk][ref1] toepassing heeft gevonden;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54n
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '1'
  - number: 54n.1.3
    text: |-
      bewijzen van betaling van de bij vonnis, bedoeld in [artikel 54][ref1] aan de in de dagvaarding genoemde
      rechthebbenden, of indien overeenkomstig [artikel 20][ref2] een derde is benoemd, aan die derde, toegekende
      voorschotten en tevens, indien geen afstand van het recht op zekerheidstelling is gedaan, de akten, strekkende tot
      bewijs dat de zekerheidstelling heeft plaats gehad, of de bewijzen van betaling der schadeloosstellingen, bepaald
      ingevolge [artikel 54][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54n
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '20'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54n.2
    text: |-
      Ten aanzien van de gevolgen van de in het vorige artikel bedoelde inschrijving gelden de
      [artikelen 59, derde lid][ref1], en [60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel60
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54n
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '60'
        hoofdstuk: IV
  - number: 54o.1
    text: |-
      Een partij of derde belanghebbende, aan wie door de rechtbank een voorschot is toegekend, kan verhoging verzoeken
      van het bedrag van het voorschot of van de zekerheid of van beide. De griffier zendt bericht van het verzoek aan
      de deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
  - number: 54o.2
    text: |-
      Het verzoek kan slechts eenmaal worden gedaan tot uiterlijk een maand voor de dag waarop de nederlegging ter
      griffie van het deskundigenrapport zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
  - number: 54o.3
    text: |-
      Omtrent de verhoging van het voorschot doet de rechtbank bij vonnis uitspraak, mits de betrokken belanghebbende
      doet blijken, dat het vonnis, waarbij overeenkomstig [artikel 54][ref1] de onteigening is uitgesproken, in
      de openbare registers is ingeschreven. Ingeval deze inschrijving niet heeft plaats gevonden binnen de in
      [artikel 54][ref2] bedoelde termijn, wijst de rechtbank het verzoek af.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54o.4
    text: |-
      Zij wijst het verzoek tot verhoging slechts toe, wanneer de reeds vastgestelde som kennelijk onvoldoende is, na
      desgewenst de deskundigen mondeling te hebben gehoord, met dien verstande, dat het verzoek kan worden afgewezen,
      indien de rechtbank blijkt, dat de nederlegging van het rapport van deskundigen binnen korte tijd zal plaats
      vinden. Zij wijst het verzoek af, indien haar blijkt, dat de nederlegging van het rapport van deskundigen reeds
      heeft plaatsgevonden. Zonodig stelt de rechtbank bij toewijzing van het verhogingsverzoek een nieuwe datum vast,
      waarop de nederlegging van het deskundigenrapport zal moeten plaats vinden. De griffier draagt zorg, dat deze
      nieuwe datum ter kennis wordt gebracht van partijen, derde belanghebbenden en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
  - number: 54o.5
    text: |-
      Tegen het vonnis in dit artikel bedoeld staat geen andere voorziening open dan beroep in cassatie in het belang
      der wet.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
  - number: 54o.6
    text: |-
      De onteigenende partij geeft van de betaling van het bedrag van een krachtens dit artikel vastgestelde verhoging
      kennis aan de deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54o
  - number: 54p.1
    text: |-
      Het voorschot op de schadeloosstelling of verhogingen daarvan worden geconsigneerd in alle gevallen, waarin volgens
      deze wet de schadeloosstelling zelf wordt geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54p
  - number: 54p.2
    text: |-
      Treedt iemand wiens tussenkomst in het geding is toegelaten in de plaats van degeen, aan wie reeds een voorschot
      op de schadeloosstelling was betaald, dan is deze laatste gehouden het bedrag van dit voorschot aan de onteigenende
      partij terug te betalen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54p
  - number: 54q.1
    text: |-
      Indien de onteigenende partij het vonnis, bedoeld in [artikel 54i][ref1], niet heeft doen inschrijven in de
      openbare registers binnen de in [artikel 54m][ref2] genoemde termijn, is de onteigenende partij schadeplichtig
      en hebben de wederpartij en de derde belanghebbenden de keuze een vaste schadeloosstelling of volledige
      schadevergoeding te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54q
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54q.2
    text: |-
      De vaste schadeloosstelling, bedoeld in het voorgaande lid, is gelijk aan tien ten honderd van het voorschot,
      bedoeld in [artikel 54i][ref1] of van de schadeloosstelling bedoeld in [artikel 54i, tweede lid, tweede zin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54q
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54q.3
    text: |-
      Wordt volledige schadevergoeding gevorderd, dan worden onder de schade mede begrepen de redelijkerwijs gemaakte
      kosten van rechtsbijstand en andere deskundige bijstand, alsmede de wettelijke rente van het bedrag der
      schadevergoeding, te rekenen van de dag, na afloop van de termijn, bedoeld in [artikel 54m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54q
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54q.4
    text: |-
      Deze vordering kan slechts worden ingesteld binnen zes maanden na afloop van de termijn bedoeld in
      [artikel 54m][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54q
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54q.5
    text: Tot kennisneming der vordering is de rechtbank bevoegd, bij welke het geding van onteigening aanhangig is gemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54q
  - number: 54r.1
    text: |-
      De gestelde zekerheid vervalt, wanneer de in [artikel 54][ref1] bedoelde termijn is verstreken, zonder dat de
      onteigenende partij van de haar toekomende bevoegdheid tot inschrijving gebruik heeft gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54r
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54r.2
    text: |-
      Zij vervalt voorts, wanneer de bij onherroepelijk vonnis vastgestelde som der schadeloosstelling is betaald of
      aangeboden en geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54r
  - number: 54s.1
    text: |-
      Ingeval een voorschot of een som als zekerheid is vastgesteld overeenkomstig [artikel 54k][ref1] of een verhoging
      daarvan is vastgesteld overeenkomstig [artikel 54o][ref2], kan het vonnis waarbij zulks is geschied, slechts ten
      uitvoer worden gelegd binnen een tijdvak van twee maanden, te rekenen van de dag, waarop het vonnis kracht van
      gewijsde heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54k
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54o
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54s
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54k
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54o
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54s.2
    text: |-
      Ingeval een schadeloosstelling is bepaald overeenkomstig [artikel 54k][ref1] kan het vonnis, waarbij zulks is
      geschied, ten uitvoer worden gelegd, doch niet eerder dan nadat de inschrijving, bedoeld in [artikel 54m][ref2],
      heeft plaats gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54k
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54s
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54k
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54t.1
    text: |-
      Op de procesgang, bedoeld in deze Afdeling, zijn, nadat het rapport van deskundigen ter inzage is nedergelegd,
      de [artikelen 35][ref1], [36][ref2], [36a][ref3], [37, eerste lid][ref4], [38-54][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel36a
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel38
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54t
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '36'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 36a
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '38'
        hoofdstuk: III
  - number: 54t.2
    text: |-
      [Artikel 37, tweede lid][ref1], is van overeenkomstige toepassing, met dien verstande, dat de rechtbank haar
      uitspraak beperkt tot de aan de verweerders en derde belanghebbenden uit te keren schadeloosstellingen, met dien
      verstande, dat zij tevens in haar vonnis de schadeloosstellingen vermeldt, die reeds zijn bepaald ingevolge de
      [artikelen 54i, tweede lid, laatste zin][ref2], en [54k, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54k
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54t
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54k
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 54t.3
    text: |-
      Voor zover de rechtbank bij het vonnis, bedoeld in het vorige lid, van oordeel mocht zijn, dat iemand ten
      gevolge van de betaling van voorschotten, meer heeft ontvangen dan hem als schadeloosstelling toekomt, zal zij de
      betrokkene veroordelen tot terugbetaling van het te veel ontvangen bedrag aan de onteigenende partij.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel54t
  - number: '55.1'
    text: |-
      Een vonnis van onteigening, bedoeld in [artikel 37][ref1], vervalt, wanneer niet binnen drie maanden, nadat het
      kracht van gewijsde heeft verkregen, de schadeloosstellingen zijn betaald, of, in de gevallen waarin dit volgens
      deze wet kan geschieden, zijn geconsigneerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
  - number: '55.2'
    text: |-
      Een vonnis van onteigening, bedoeld in [artikel 54i][ref1], dat niet is ingeschreven binnen de in
      [artikel 54m][ref2] genoemde termijn, vervalt, wanneer niet binnen drie maanden, nadat het vonnis, als bedoeld
      in [artikel 54t, tweede lid][ref3], houdende uitspraak over de schadeloosstellingen kracht van gewijsde heeft
      verkregen, die schadeloosstellingen zijn betaald, of, in de gevallen waarin dit volgens deze wet kan geschieden,
      zijn geconsigneerd. Bij verval van dit vonnis van onteigening vervalt tevens het vonnis waarbij overeenkomstig
      [artikel 54i][ref4] uitsluitend voorschotten zijn bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '55.3'
    text: |-
      Onder een schadeloosstelling is de wettelijke rente daarvan begrepen. De wettelijke rente loopt te rekenen van
      de dag van het vonnis van onteigening, bedoeld in [artikel 37][ref1] of van de dag van het vonnis, bedoeld in
      [artikel 54t][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '55.4'
    text: |-
      Indien het vonnis van onteigening niet wordt ingeschreven in de openbare registers, is de onteigenende partij
      schadeplichtig en hebben de wederpartij en de derde belanghebbenden de keuze een vaste schadeloosstelling of
      volledige schadevergoeding te vorderen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
  - number: '55.5'
    text: |-
      De vaste schadeloosstelling, bedoeld in het voorgaande lid, is gelijk aan tien ten honderd van de voor ieder door
      de rechtbank bij het vonnis van onteigening overeenkomstig [artikel 37][ref1] of [artikel 54t][ref2] vastgestelde
      of vermelde schadeloosstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '55.6'
    text: |-
      Wordt volledige schadevergoeding gevorderd, dan worden onder de schade mede begrepen de redelijkerwijs gemaakte
      kosten van rechtsbijstand en andere deskundige bijstand, alsmede de wettelijke rente van het bedrag der
      schadevergoeding van de dag, waarop het vonnis van onteigening is gewezen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
  - number: '55.7'
    text: Tot kennisneming der vordering is de rechtbank bevoegd, bij welke het geding van onteigening aanhangig is gemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel55
  - number: '56'
    text: |-
      Wanneer hij aan wie de schadeloosstelling is toegewezen, weigert haar te ontvangen, en bij deurwaardersexploit
      deswege in gebreke is gesteld, kan de onteigenaar zodra tien dagen zijn verstreken overgaan tot consignatie
      overeenkomstig de [Wet op de consignatie van gelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003338
  - number: '57.1'
    text: |-
      Wanneer de schadeloosstelling of het voorschot, bedoeld in [artikel 54i][ref1], is betaald dan wel consignatie
      overeenkomstig de [Tweede Afdeling van de Vierde Titel van het Vierde Boek van het Burgerlijk Wetboek][ref2]
      daarvan heeft plaats gevonden, wordt de onteigenende partij, op bevelschrift van de voorzitter van de rechtbank,
      desnoods door middel van de sterke arm, in het bezit van het onteigende gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '2'
  - number: '57.2'
    text: |-
      Bij haar verzoekschrift moet de onteigenende partij aan die voorzitter overleggen een afschrift van het vonnis
      tot onteigening, een verklaring van de griffier, dat het vonnis gezag van gewijsde heeft verkregen, alsmede een
      afschrift van het proces-verbaal van de opneming door de deskundigen, indien deze opneming heeft plaats gevonden
      overeenkomstig [artikel 54j, eerste of derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54j
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54j
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '57.3'
    text: |-
      Ook het bewijs, dat de schadeloosstelling of het voorschot, bedoeld in [artikel 54i][ref1], is betaald dan wel het
      bewijs van consignatie in de gevallen van de [artikelen 3][ref2], [58][ref3] en [59][ref4], moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '58'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '59'
        hoofdstuk: IV
  - number: '58'
    text: |-
      Wanneer onder de onteigenende partij beslag op de schadeloosstelling of het voorschot is gelegd, doet zij
      het bedrag dat zij zonder het beslag aan de beslagene had moeten uitbetalen consigneren overeenkomstig de
      [Wet op de consignatie van gelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003338
  - number: '59.1'
    text: |-
      Het vonnis van onteigening, bedoeld in [artikel 37][ref1], kan slechts worden ingeschreven nadat het in kracht
      van gewijsde is gegaan. Ter inschrijving van het in de vorige zin bedoelde vonnis worden de bewijzen van betaling
      van de schadeloosstelling overgelegd. Ter inschrijving van het vonnis, bedoeld in [artikel 54i][ref2], dat
      niet is ingeschreven binnen de in [artikel 54m][ref3] bedoelde termijn, worden overgelegd het vonnis bedoeld in
      [artikel 54t, tweede lid][ref4], een verklaring van de griffier houdende dat laatstgenoemd vonnis in kracht van
      gewijsde is gegaan en de bewijzen van betaling der schadeloosstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
  - number: '59.2'
    text: |-
      Voor de toepassing van deze wet wordt met een bewijs van betaling gelijkgesteld een bewijs, dat de som
      der schadeloosstelling – of ingeval [Afdeling 2 van Hoofdstuk IIIa][ref1] toepassing heeft gevonden,
      de som van het voorschot – ten laste van de onteigenende partij is overgeschreven op een rekening van
      de tot ontvangst gerechtigde bij een financiële onderneming die in Nederland het bedrijf van bank mag
      uitoefenen ingevolge de [Wet op het financieel toezicht][ref2]. Tevens geldt als bewijs van betaling -
      indien niet genoegzaam bekend is aan wie moet worden betaald, of consignatie heeft plaatsgevonden ten
      gevolge van de [artikelen 3][ref3], [56][ref4] of [58][ref5] - een bewijs van consignatie als bedoeld in
      [artikel 6, eerste lid, van de Wet op de consignatie van gelden][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0020368
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel56
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel58
      [ref6]: https://wetten.overheid.nl/BWBR0003338#Artikel6
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001842
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0020368
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '56'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '58'
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0003338
        artikel: '6'
  - number: '59.3'
    text: |-
      In geval van onteigening van een onroerende zaak gaat door inschrijving van het vonnis de eigendom op de
      onteigenaar over, vrij van alle met betrekking tot de zaak bestaande lasten en rechten. In geval van onteigening
      als bedoeld in [artikel 4, eerste lid][ref1], vervallen door de inschrijving de lasten en rechten welke bestaan met
      betrekking tot de zaak, waarop het onteigende recht rust. Aldus waardeloos geworden inschrijvingen van hypotheken
      en beslagen worden ambtshalve doorgehaald. Alleen erfdienstbaarheden kunnen op de zaak gevestigd blijven.
      Zij dienen daartoe in het vonnis te worden opgenomen; indien zij niet door vestiging zijn ontstaan, worden de
      kadastrale aanduiding van het heersende erf en een omschrijving van de inhoud van de erfdienstbaarheid opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '60'
    text: |-
      Waterschaps- en soortgelijke lasten en alle belastingen, hoe ook genaamd, waarmede het onteigende goed is bezwaard
      of die daarvan worden betaald, gaan van de dag, waarop de in [artikel 59][ref1] bedoelde inschrijving heeft plaats
      gehad, op de onteigenende partij over.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
        hoofdstuk: IV
  - number: '61.1'
    text: |-
      Indien tengevolge van oorzaken die de onteigenende partij in staat was uit de weg te ruimen, met het werk waartoe
      werd onteigend niet binnen drie jaar nadat het vonnis van onteigening kracht van gewijsde heeft gekregen, een
      aanvang is gemaakt, of de arbeid meer dan drie jaren mocht zijn gestaakt, of indien uit andere omstandigheden
      is aan te tonen dat het werk blijkbaar niet tot stand zal worden gebracht, biedt de onteigenende partij aan de
      onteigende partij de mogelijkheid om het onteigende teruggeleverd te krijgen in de toestand waarin het zich alsdan
      bevindt, onder gehoudenheid om in evenredigheid tot de terugontvangen waarde de schadeloosstelling terug te geven.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel61
  - number: '61.2'
    text: |-
      Indien de onteigende te kennen geeft geen gebruik te maken van de ingevolge het eerste lid aangeboden mogelijkheid,
      kan hij een vordering indienen tot uitkering van een door de rechter naar billijkheid te bepalen schadeloosstelling
      boven de reeds ontvangen schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel61
  - number: '61.3'
    text: |-
      Indien de onteigenende partij niet binnen drie maanden na verloop van de in het eerste lid bedoelde termijn
      een aanbod tot teruglevering heeft gedaan, kan de onteigende partij, naar haar keuze, hetzij bij de rechter het
      afgestane terugvorderen in de toestand waarin het zich alsdan bevindt, onder gehoudenheid om in evenredigheid tot
      de terugontvangen waarde de schadeloosstelling terug te geven, hetzij een vordering indienen tot uitkering van een
      door de rechter naar billijkheid te bepalen schadeloosstelling boven de reeds ontvangen schadeloosstelling.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel61
  - number: '61.4'
    text: |-
      Onder werk waartoe werd onteigend als bedoeld in het eerste lid worden mede verstaan: niet ingrijpende aanpassingen
      of aanpassingen van geringe omvang van het werk ten behoeve waarvan onteigend wordt dan wel aanpassingen van het
      werk die passen binnen het kader ter uitvoering waarvan tot onteigening wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel61
  - number: '62.1'
    text: |-
      Onteigening van onroerende zaken of rechten ten behoeve van aanleg, het herstel, versterking of onderhoud van
      waterkeringen of bouw van militaire verdedigingswerken, heeft plaats uit kracht van een koninklijk besluit, de Raad
      van State gehoord.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel62
  - number: '62.2'
    text: |-
      Onder de onteigening van onroerende zaken of rechten ten behoeve van waterkeringen, bedoeld in het eerste lid,
      wordt mede begrepen de onteigening voor de aanleg en verbetering van de in dat lid bedoelde werken en rechtstreeks
      daaruit voortvloeiende bijkomende voorzieningen ter uitvoering van:
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel62
  - number: 62.2.a
    text: |-
      een bestemmingsplan als bedoeld in [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 62.2.b
    text: |-
      een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening is afgeweken;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 62.2.c
    text: |-
      een inpassingsplan als bedoeld in [artikel 3.26][ref1] of [3.28 van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '63.1'
    text: |-
      Op de voorbereiding van de beslissing tot onteigening is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '63.2'
    text: |-
      Terinzagelegging geschiedt tevens binnen de gemeente waar de betrokken onroerende zaken zijn gelegen. In ieder
      geval worden ter inzage gelegd:
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
  - number: 63.2.1°
    text: |-
      een uitgewerkt plan met uitvoerige kaarten en met grondtekeningen waarop de te onteigenen onroerende zaken, en bij
      afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], de onroerende zaken waarop de te onteigenen
      rechten rusten, met vermelding van hun kadastrale aanduiding zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 63.2.2°
    text: 'een lijst van te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
  - number: 63.2.2°.a
    text: |-
      de grootte volgens de basisregistratie kadaster van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
  - number: 63.2.2°.b
    text: de namen van de eigenaars van elk dier zaken, volgens de basisregistratie kadaster;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
  - number: 63.2.3°
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], een lijst van de te onteigenen rechten
      met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de rechthebbenden op
      die rechten volgens de basisregistratie kadaster.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '63.3'
    text: Mondelinge zienswijzen kunnen naar voren worden gebracht bij Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
  - number: '63.4'
    text: |-
      Alvorens omtrent het verzoek tot onteigening wordt beslist, worden degenen, die tijdig ingevolge
      [artikel 3:15, eerste of tweede lid, van de Algemene wet bestuursrecht][ref1] een zienswijze naar voren hebben
      gebracht, door Onze Minister in de gelegenheid gesteld zich te doen horen. Zo nodig kan Onze Minister ook andere
      belanghebbenden in de gelegenheid stellen zich te doen horen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '64'
    text: |-
      Bij het koninklijk besluit worden de te onteigenen onroerende zaken en rechten aangewezen door aanhaling van de in
      [artikel 63, tweede lid, onder 1°][ref1] bedoelde grondtekeningen en vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
  - number: 64.1°
    text: |-
      de kadastrale aanduiding van de onroerende zaken met vermelding van de grootte volgens de basisregistratie kadaster
      van elk der desbetreffende percelen en, indien een te onteigenen onroerende zaak een gedeelte van een perceel
      uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64
  - number: 64.2°
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], de kadastrale aanduiding van de
      onroerende zaken waarop de te onteigenen rechten rusten;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 64.3°
    text: |-
      de namen volgens de basisregistratie kadaster van de eigenaars van de te onteigenen onroerende zaken en, bij
      afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], van de rechthebbenden op de te onteigenen
      rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 64a.1
    text: |-
      Het koninklijk besluit wordt genomen binnen zes maanden na afloop van de termijn gedurende welke de stukken
      ingevolge [artikel 3:11, vierde lid, van de Algemene wet bestuursrecht][ref1] ter inzage hebben gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 64a.2
    text: |-
      Het besluit wordt in ieder geval bekendgemaakt aan de onteigenende partij en, zo mogelijk, aan de in
      [artikel 64][ref1] bedoelde eigenaren en andere rechthebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel64
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '64'
  - number: 64a.3
    text: |-
      Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant. Terinzagelegging ingevolge
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] vindt tevens plaats binnen de
      betrokken gemeente. De kennisgeving van het besluit vindt tevens plaats in een of meer dag-, nieuws-, of huis-aan-
      huisbladen die in de gemeente verspreid worden, onder vermelding van datum en nummer van het koninklijk besluit en
      van de Staatscourant waarin het besluit is geplaatst. Een en ander geschiedt op kosten van hen, te wier name het
      werk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 64a.4
    text: |-
      Het koninklijk besluit tot onteigening vervalt, indien de onteigenende partij niet binnen twee jaar na
      dagtekening van het koninklijk besluit de eigendom bij minnelijke overeenkomst heeft verkregen overeenkomstig
      [artikel 17][ref1], of de eigenaren, in het onteigeningsbesluit aangewezen, voor de rechtbank, in welker
      rechtsgebied de onroerende zaken waarop de onteigening betrekking heeft zijn gelegen, heeft doen dagvaarden
      overeenkomstig [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '18'
        hoofdstuk: III
  - number: 64b.1
    text: |-
      De [artikelen 2][ref1], [3][ref2], [4][ref3], [17 tot en met 20][ref4], en [22 tot en met 61][ref5] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel22
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '22'
        hoofdstuk: III
  - number: 64b.2
    text: |-
      Wanneer gravingen, opmetingen of het stellen van tekeningen op iemands grond nodig geacht worden, moeten de
      gebruikers van de grond dit gedogen, mits hun dit tweemaal vierentwintig uren te voren door het gemeentebestuur
      schriftelijk is aangezegd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64b
  - number: 64b.3
    text: |-
      De schade, daardoor veroorzaakt, wordt door de kantonrechter begroot, en door de Staat vergoed. Deze verhaalt die
      kosten op hen, te wier name het werk wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel64b
  - number: '65.1'
    text: |-
      Wanneer niet de grond zelf onteigend wordt, maar slechts tot het verrichten van in deze titel vermelde werken
      zekere bodemmaterialen nodig geacht worden, mag dit ook geschieden op grond van een besluit van gedeputeerde staten
      of van het dagelijks bestuur van het waterschap, dat tot onteigening overgaat.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel65
  - number: '65.2'
    text: |-
      Het besluit, door Ons of door de zooeven genoemde collegien of besturen genomen, wijst zoo nauwkeurig mogelijk de
      oppervlakte aan, waarover en de diepte, tot welke de uitgraving zal plaats hebben. Het bepaalt tevens den termijn,
      waarbinnen het verzoekschrift, bedoeld in [artikel 66][ref1], moet zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel66
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '66'
  - number: '65.3'
    text: |-
      Het besluit, bedoeld in het vorige lid, wordt in de *Staatscourant* en in een in de streek verspreid wordend
      nieuws- of advertentieblad openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel65
  - number: '65.4'
    text: |-
      De schadeloosstelling bepaalt zich in dat geval tot de waarde der weggenomen speciën en de schade, door die
      wegneming aan den grond toegebragt, met inachtneming der bepaling van [art. 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel41
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '41'
        hoofdstuk: III
  - number: '66.1'
    text: |-
      Bij gebreke van minnelijke schikking benoemt de rechtbank, in het geval van het voorgaande artikel, op het
      verzoekschrift hetzij van hem, die onteigent, of van den eigenaar van den grond, een of meer deskundigen, in
      oneffen getale, om een berigt over de schadeloosstelling te geven.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.2'
    text: |-
      Het verzoekschrift moet, op straffe van verval, worden ingediend binnen den termijn, bepaald bij het in
      [artikel 65][ref1] bedoelde besluit. Bij het verzoekschrift moet worden overgelegd een exemplaar van de
      *Staatscourant* en van het nieuws- of advertentieblad, waarin Ons besluit, dan wel dat van Gedeputeerde Staten of
      van een der andere collegien of besturen is openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel65
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '65'
  - number: '66.3'
    text: |-
      De regtbank benoemt één harer leden, om als commissaris, vergezeld van den griffier, bij de opneming door de
      deskundigen tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.4'
    text: |-
      Zij bepaalt tevens den dag en de plaats, waar en wanneer die opneming zal geschieden. Ten minste twee maal vier
      en twintig uren te voren wordt dit aan de wederpartij beteekend en afschrift van het exploit ter griffie van de
      regtbank nedergelegd. Bij gebreke dier beteekening vervalt het vonnis.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.5'
    text: Het vonnis wordt aan het gebouw der regtbank aangeplakt, en de griffier roept de deskundigen op.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.6'
    text: Derde belanghebbenden kunnen bij die opneming tegenwoordig zijn, ten einde ook hunne schade te doen begrooten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.7'
    text: |-
      De regtercommissaris bepaalt bij de opneming door de deskundigen, den dag, waarop hij zijn rapport aan de regtbank
      zal uitbrengen. Deze dag wordt aan de wederpartij beteekend, zoo zij niet is verschenen bij de opneming door
      de deskundigen en afschrift van het exploit ter griffie nedergelegd. Inmiddels liggen het procesverbaal van den
      regtercommissaris en het advies der deskundigen op de griffie ter lezing.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.8'
    text: |-
      Op den bepaalden dag nemen, na het rapport van den regtercommissaris, partijen en derde belanghebbenden hunne
      conclusien, welke zij, mits op dezelfde teregtzitting, bij pleidooi breeder kunnen ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.9'
    text: De regtbank beslist terstond of op de eerstvolgende teregtzitting.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.10'
    text: Geenerlei andere formaliteiten behoeven hier in acht te worden genomen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.11'
    text: |-
      Tegen het vonnis, waarbij de onteigening is uitgesproken, wordt noch verzet, noch hooger beroep, noch beroep in
      cassatie toegelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
  - number: '66.12'
    text: |-
      De [artikelen 20][ref1], [24, laatste lid][ref2], [29][ref3], [33][ref4], [34, eerste en tweede lid][ref5], en
      [35, eerste lid][ref6], vinden op de rechtsvordering, in dit artikel omschreven, overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel35
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '20'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '24'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '29'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '33'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '34'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0001842
        artikel: '35'
        hoofdstuk: III
  - number: '67.1'
    text: |-
      De wegneming der speciën heeft niet plaats dan nadat de onteigenende partij de schadeloosstelling heeft betaald
      of geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel67
  - number: '67.2'
    text: |-
      De [artt. 55 tot 58][ref1] zijn ook hier van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel55
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '55'
        hoofdstuk: IV
  - number: 72a.1
    text: |-
      Onteigening van wegen, bruggen, bermen, bermslooten en kanalen, alsmede daarop rustende zakelijke rechten als in
      [artikel 4][ref1] bedoeld, en onteigening voor aanleg en verbetering van wegen, bruggen, spoorwegwerken, kanalen,
      – waaronder begrepen onteigening voor aanleg en verbetering van werken ter uitvoering van een tracébesluit als
      bedoeld in [artikel 9, eerste lid, van de Tracéwet][ref2] – havenwerken, werken ten behoeve van de bestrijding
      van de verontreiniging van oppervlaktewateren en terreinen en werken ten behoeve van verbetering of verruiming van
      rivieren kan geschieden uit kracht van een door Ons, den Raad van State gehoord, genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel9
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '9'
  - number: 72a.2
    text: |-
      Onder de onteigening, bedoeld in het eerste lid, wordt mede begrepen de onteigening voor de aanleg en verbetering
      van de in dat lid bedoelde werken en rechtstreeks daaruit voortvloeiende bijkomende voorzieningen ter uitvoering
      van:
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
  - number: 72a.2.a
    text: |-
      een bestemmingsplan als bedoeld in [artikel 3.1, eerste lid, van de Wet ruimtelijke ordening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 72a.2.b
    text: |-
      een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan of de beheersverordening is afgeweken;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 72a.2.c
    text: |-
      een inpassingsplan als bedoeld in [artikel 3.26][ref1] of [3.28 van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 72a.3
    text: |-
      De bepalingen van de [artikelen 63 tot en met 64b][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
  - number: 72b.1
    text: |-
      Onteigening van gronden en van zakelijke rechten, als bedoeld in [artikel 4][ref1], waarvan de verkrijging is
      vereist ten behoeve van een drinkwaterbedrijf als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref2]
      of van een inrichting waarin afvalstoffen die van buiten de inrichting afkomstig zijn, worden verwijderd, kan
      geschieden uit kracht van een door Ons, de Raad van State gehoord, genomen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '1'
  - number: 72b.2
    text: |-
      De bepalingen van de [artikelen 63 tot en met 64b][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72b
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
  - number: 72c.1
    text: |-
      Onteigening van zaken en rechten als bedoeld in [artikel 4][ref1] kan in het belang van de winning van
      oppervlaktedelfstoffen plaatshebben ten name van het Rijk of van de provincie:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 72c.1.a
    text: overeenkomstig een onherroepelijk geworden besluit tot vaststelling van een winplaats in een inpassingsplan;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72c
  - number: 72c.1.b
    text: |-
      indien ter zake een vergunning tot ontgronding krachtens de [Ontgrondingenwet][ref1] is verleend en onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002505
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72c
    references:
      - id: ref1
        bwb_id: BWBR0002505
  - number: 72c.2
    text: De onteigening heeft plaats uit kracht van een door Ons, de Raad van State gehoord, genomen besluit.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72c
  - number: 72c.3
    text: |-
      De bepalingen van de [artikelen 63 tot en met 64b][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
  - number: 72d.1
    text: |-
      Het Rijk of de provincie of degene, die van het Rijk of van de provincie ten behoeve van een ontgronding de
      eigendom heeft verkregen, mag deze binnen zes jaren na beëindiging van de ontgronding, of - indien met betrekking
      tot de staat, waarin de zaak na ontgronding moet worden gebracht, voorwaarden aan de vergunning tot het ontgronden
      zijn verbonden - na oplevering in de staat als bij die vergunning voorgeschreven, niet vervreemden, alvorens
      de onroerende zaken aan degene, die deze als gevolg van de toepassing van deze Titel heeft verloren, te koop te
      hebben aangeboden tegen een prijs te bepalen in onderling overleg, dan wel bij gebreke van overeenstemming door de
      rechtbank van het arrondissement, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72d
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '18'
        hoofdstuk: III
  - number: 72d.2
    text: |-
      Het niet in acht nemen van het in het eerste lid bepaalde heeft geen gevolg ten aanzien van de geldigheid van de
      vervreemding.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel72d
  - number: '73.1'
    text: |-
      Wanneer in geval van brand of watersnood, ogenblikkelijke inbezitneming volstrekt noodzakelijk geacht wordt, kan
      deze op last van de hoogste burgerlijke overheid, ter plaatse aanwezig, geschieden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel73
  - number: '73.2'
    text: |-
      Ingeval van watersnood kan ook het dagelijks bestuur van het waterschap, dat met de zorg voor de waterkering is
      belast, de voorzitter van dat waterschap en ieder daartoe door dat dagelijks bestuur van het waterschap aangewezen
      lid van dat bestuur, ter vervulling van die taak die last geven.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel73
  - number: '73.3'
    text: |-
      Door watersnood wordt niet enkel het geval verstaan dat dijken zijn doorgebroken of overstroomingen hebben plaats
      gehad, maar ook dat van dringend of dreigend gevaar voor doorbraak of overstrooming.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel73
  - number: '73.4'
    text: |-
      De eigendom gaat onmiddellijk op dengene over, in wiens naam de inbezitneming is geschied, vrij van alle met
      betrekking tot de zaak bestaande lasten en rechten. Alle in [art. 60][ref1] genoemde lasten of belastingen,
      waarmede het onteigende is bezwaard, gaan van den dag der inbezitneming op hem over.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel60
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '60'
        hoofdstuk: IV
  - number: '73.5'
    text: |-
      Het besluit tot inbezitneming wordt zo spoedig mogelijk in de openbare registers ingeschreven. Door het
      besluit waardeloos geworden inschrijvingen van hypotheken en beslagen worden ambtshalve doorgehaald.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '74.1'
    text: |-
      Zoodra mogelijk na de onteigening, moet degene, die haar bevolen heeft, aan de onteigenden geregtelijk eene
      schadevergoeding doen aanbieden, of in de gevallen, in [art. 58, eerste lid][ref1], genoemd, consigneren.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel58
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '58'
        hoofdstuk: IV
  - number: '74.2'
    text: |-
      Indien dit aanbod of die consignatie niet binnen drie maanden is geschied, alsmede wanneer met het aangebodene of
      geconsigneerde geen genoegen wordt genomen, kan de schadevergoeding in regten door de onteigenden worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel74
  - number: '74.3'
    text: |-
      In het eerste geval kan de Staat, de provincie, de gemeenten of het waterschap de bedoelde schadeloosstelling van
      hen, die de onteigening gelast hebben, persoonlijk terugvorderen, ten ware het verzuim buiten hunne schuld mogt
      hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel74
  - number: '75'
    text: |-
      De wettelijke interessen der verschuldigde schadevergoeding moeten van den dag der inbezitneming aan de onteigenden
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel75
  - number: '76'
    text: |-
      Wanneer hij, in wiens naam de onteigening gelast is, den eigendom van de zaak niet langer voor het beoogde doel
      noodig acht, en er nog geene drie jaren sedert de onteigening verloopen zijn, is de onteigende bij voorkeur boven
      alle anderen tegen betaling van den prijs, door deskundigen te begrooten, tot de verkrijging daarvan geregtigd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76
  - number: 76a.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de [artikelen 76][ref2] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76b
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 76b
  - number: 76a.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
  - number: 76a.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
  - number: 76a.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
  - number: 76a.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
  - number: 76a.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a
  - number: 76a bis.1
    text: |-
      Wanneer ogenblikkelijke inbezitneming volstrekt noodzakelijk geacht wordt, kan deze op last van de hoogste
      militaire autoriteit, ter plaatse aanwezig, geschieden onder zo spoedig mogelijke afgifte van een schriftelijk
      bewijsstuk van de inbezitneming.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_bis
  - number: 76a bis.2
    text: |-
      Op de in het eerste lid bedoelde inbezitneming is het bepaalde in [artikel 73][ref1], ten aanzien van de
      eigendomsovergang en de overschrijving in de openbare registers, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel73
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_bis
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '73'
  - number: 76a ter.1
    text: |-
      Door of op last van de burgemeesters kunnen, na bijzondere of algemene machtiging van Onze Minister van Economische
      Zaken, levensmiddelen, grondstoffen van levensmiddelen, huishoudelijke artikelen en brandstoffen onmiddellijk in
      bezit worden genomen onder zo spoedig mogelijke afgifte van een schriftelijk bewijsstuk van de inbezitneming.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
  - number: 76a ter.2
    text: |-
      De op grond van het eerste lid in bezit genomen waren worden onverwijld, op door de burgemeester te bepalen wijze,
      ter beschikking gesteld ten behoeve van de bevolking van de gemeente of van aldaar bestaande bedrijven, tegen
      prijzen, die niet te boven gaan de daarvoor door Onze voornoemde Minister bepaalde bedragen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
  - number: 76a ter.3
    text: |-
      De schadeloosstelling, voor de in bezit genomen waren door de gemeente te bepalen, wordt door twee schatters, elk
      afzonderlijk, geschat, en een bon voor het gemiddelde van die twee schattingen wordt aan de vroegere houder van de
      waren gegeven.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
  - number: 76a ter.4
    text: |-
      Het bedrag van deze bonnen wordt als verplichte uitgave van de gemeente aangemerkt en zo spoedig mogelijk
      uitbetaald.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
  - number: 76a ter.5
    text: |-
      De schatters worden door Onze voornoemde Minister of, ingevolge diens bijzondere of algemene machtiging, door de
      burgemeester benoemd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
  - number: 76a ter.6
    text: |-
      [Artikel 75][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel75
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76a_ter
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '75'
  - number: 76b
    text: |-
      Indien degene, onder wien de burgemeester in het vorig artikel genoemde waren in bezit wil nemen, onmiddellijk
      ten genoegen van den burgemeester aanbiedt zelf op door dezen goedgekeurde wijze die waren ter beschikking te
      stellen tegen prijzen, die niet te boven gaan de daarvoor door Onzen voornoemden Minister bepaalde bedragen, kan de
      burgemeester de inbezitneming opschorten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76b
  - number: 76c.1
    text: |-
      Onze voornoemde Minister kan bepalen, dat de burgemeester bepaalde soorten of hoeveelheden van genoemde waren
      in bezit zal nemen, alsmede dat van in bezit genomen waren gedeelten ter beschikking worden gesteld van den
      burgemeester eener andere gemeente tegen den prijs en op de wijze, door dien Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76c
  - number: 76c.2
    text: |-
      Voldoet de burgemeester niet onmiddellijk hieraan, dan geschiedt de inbezitneming en de terbeschikkingstelling van
      burgemeesters van andere gemeenten door dien Minister.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76c
  - number: 76c.3
    text: |-
      Alsdan wordt de schadeloosstelling bepaald op de wijze, bij [artikel 76a ter][ref1] geregeld, met dien verstande,
      dat de benoeming der schatters dan steeds geschiedt door dien Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 76a_ter
  - number: 76c.4
    text: |-
      Het vierde en het laatste lid van [artikel 76a ter][ref1] zijn ook in dit geval van toepassing, met dien verstande,
      dat de uitgave komt ten laste van de gemeente, te welker behoeve de waren zijn beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 76a_ter
  - number: 76e.1
    text: |-
      De burgemeester zoomede de door hem aan te wijzen ambtenaren zijn te allen tijde bevoegd de uitlevering te vorderen
      van de in bezit te nemen waren. Zij, alsmede de hen op hun last vergezellende personen hebben te allen tijde vrijen
      toegang tot alle plaatsen, waar redelijkerwijs vermoed kan worden, dat zich de waren bevinden. Wordt hun de toegang
      geweigerd, dan verschaffen zij zich dien desnoods met inroeping van den sterken arm.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76e
  - number: 76e.2
    text: |-
      Is de plaats tevens eene woning of alleen door eene woning toegankelijk, dan treden zij deze tegen den wil des
      bewoners niet binnen dan op bijzonderen of algemeenen schriftelijken last van den burgemeester.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76e
  - number: 76e.3
    text: Van dit binnentreden wordt door hen procesverbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76e
  - number: 76f
    text: |-
      In geval, op grond van
      [artikel 7, eerste lid, of 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], bepalingen
      uit de [Oorlogswet voor Nederland][ref2] in werking zijn gesteld, geschieden de machtigingen, bedoeld in
      [artikel 76a ter, eerste lid][ref3], niet dan na overleg met het militair gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007983
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76f
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007983
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 76a_ter
  - number: 76fbis.1
    text: |-
      Door of op last van de burgemeesters kunnen, na algemene of bijzondere machtiging van Onze Minister van
      Binnenlandse Zaken, in de gemeente aanwezige verbruiksartikelen, bestemd voor bescherming en ontsmetting in het
      belang van de bestrijding van rampen en zware ongevallen, van de beperking van de onmiddellijke gevolgen daarvan
      alsmede van de voorbereiding op deze bestrijding en beperking, onmiddellijk in bezit worden genomen onder zo
      spoedig mogelijke afgifte van een schriftelijk bewijsstuk van de inbezitneming.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76fbis
  - number: 76fbis.2
    text: |-
      De [artikelen 76a ter, derde lid tot en met zesde lid][ref1], [76b][ref2], [76c][ref3], [76e][ref4] en [76f][ref5]
      vinden overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76b
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel76c
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel76e
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel76f
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel76fbis
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 76a_ter
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 76b
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 76c
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 76e
      - id: ref5
        bwb_id: BWBR0001842
        artikel: 76f
  - number: '77.1'
    text: 'Onteigening, bedoeld in deze titel kan plaatsvinden:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.1.1°
    text: |-
      ten behoeve van de uitvoering van of ter handhaving van de feitelijke toestand overeenkomstig een bestemmingsplan
      of een inpassingsplan als bedoeld in [artikel 3.26][ref1] of [3.28 van de Wet ruimtelijke ordening][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 77.1.2°
    text: |-
      ten behoeve van de uitvoering van een bouwplan, dan wel een plan van werken, geen bouwwerken zijnde, of een plan
      van werkzaamheden voor het opheffen van ernstig achterstallig onderhoud in het belang van de volkshuisvesting,
      mits een hierop betrekking hebbend besluit op grond van [artikel 13 van de Woningwet][ref1] dan wel een besluit tot
      toepassing van bestuursdwang of oplegging van een last onder dwangsom wegens overtreding van het bepaalde bij of
      krachtens [artikel 1a][ref2], [1b][ref3], [7b][ref4] of [13 van de Woningwet][ref5] onherroepelijk is geworden;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel13
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 1b
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 7b
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '13'
  - number: 77.1.3°
    text: |-
      ten behoeve van de uitvoering van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      geldende bestemmingsplan is afgeweken;


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 77.1.4°
    text: ten behoeve van de ontruiming van oppervlakten in het belang van de volkshuisvesting;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.1.5°
    text: |-
      ten behoeve van de verwijdering van een of meer ontruimde, onbewoonbaar verklaarde woningen of van een of meer
      niet meer in gebruik zijnde andere gebouwen, indien deze woningen of gebouwen dermate in verval zijn geraakt of
      verminkt, dat zij de omgeving in ernstige mate ontsieren;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.1.6°
    text: |-
      ten behoeve van de uitvoering van een besluit als bedoeld in [artikel 3.30][ref1], [3.33][ref2] of
      [3.35 van de Wet ruimtelijke ordening][ref3], alsmede met voorzieningen die met de uitvoering van zodanig besluit
      rechtstreeks verband houden;


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 77.1.7°
    text: |-
      van een gebouw als bedoeld in [artikel 13b, tweede lid, van de Woningwet][ref1] ten behoeve van de handhaving van
      de openbare orde rond dat gebouw of van de [artikelen 2][ref2] en [3 van de Opiumwet][ref3] in zodanig gebouw,
      indien de uitoefening van de bevoegdheden, bedoeld in artikel 13b, tweede lid, van de Woningwet, geen uitzicht
      heeft geboden op een duurzaam herstel van de openbare orde rond dat gebouw welke is verstoord door gedragingen
      in het gebouw, onderscheidenlijk het duurzaam achterwege blijven van een overtreding van artikel 2 of 3 van de
      Opiumwet in dat gebouw;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13b
      [ref2]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001941#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 13b
      - id: ref2
        bwb_id: BWBR0001941
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001941
        artikel: '3'
  - number: 77.1.8°
    text: |-
      van een gebouw, een open erf of een terrein als bedoeld in [artikel 17 van de Woningwet][ref1] ten behoeve van
      het opheffen van een overtreding als bedoeld in dat artikel, indien de toepassing van de bevoegdheden, bedoeld in
      [artikel 14, eerste lid, van de Woningwet][ref2], geen uitzicht heeft geboden op het duurzaam achterwege blijven
      van een zodanige overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel14
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: '14'
  - number: '77.2'
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.2.1°
    text: |-
      bouwplan: een project tot het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen alsmede het
      vergroten van een of meer bouwwerken;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.2.2°
    text: |-
      plan van werken, geen bouwwerken zijnde: een project tot het aanleggen, het geheel of gedeeltelijk vernieuwen of
      veranderen alsmede het vergroten van een of meer werken, geen bouwwerken zijnde;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: 77.2.3°
    text: 'plan van werkzaamheden: een project tot het verrichten van een of meer werkzaamheden.'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: '77.3'
    text: |-
      Een bouwplan kan mede een plan van werken, geen bouwwerken zijnde, of een plan van werkzaamheden omvatten. Een plan
      van werken, geen bouwwerken zijnde, kan mede een plan van werkzaamheden omvatten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: '77.4'
    text: In de in het eerste lid genoemde gevallen geschiedt de onteigening overeenkomstig de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel77
  - number: '78.1'
    text: |-
      Onteigening ten name van een publiekrechtelijk lichaam of van een rechtspersoon met volledige rechtsbevoegdheid,
      toegelaten ingevolge [artikel 19 van de Woningwet][ref1], heeft op verzoek van het algemeen bestuur van dat
      lichaam, Onze Minister wie het aangaat of die rechtspersoon, plaats uit kracht van een koninklijk besluit. Alvorens
      omtrent het verzoek tot onteigening wordt beslist, wordt de Raad van State gehoord. Bij de indiening van het
      verzoek legt de verzoeker de stukken en gegevens, bedoeld in [artikel 79][ref2], over aan Onze Minister wie het
      aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel79
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '79'
  - number: '78.2'
    text: |-
      Op de voorbereiding van het besluit tot onteigening is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. De in [artikel 3:12 van de Algemene wet bestuursrecht][ref2] bedoelde kennisgeving wordt gedaan door
      de burgemeester van de gemeente waar de betrokken onroerende zaken zijn gelegen. Terinzagelegging geschiedt tevens
      binnen de gemeente waar de betrokken onroerende zaken zijn gelegen. In ieder geval worden ter inzage gelegd de in
      [artikel 79][ref3] bedoelde stukken en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel79
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '79'
  - number: '78.3'
    text: Mondelinge zienswijzen kunnen naar voren worden gebracht bij Onze Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
  - number: '78.4'
    text: |-
      Alvorens op het verzoek tot onteigening wordt beslist, stelt Onze Minister wie het aangaat degenen die tijdig
      ingevolge [artikel 3:15, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] een zienswijze naar voren
      hebben gebracht, in de gelegenheid gehoord te worden. Zo nodig kan Onze Minister ook andere belanghebbenden daartoe
      in de gelegenheid stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '78.5'
    text: |-
      Bij een koninklijk besluit tot onteigening worden de te onteigenen onroerende zaken en rechten aangewezen door
      aanhaling van de in [artikel 79][ref1] bedoelde grondtekeningen en vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel79
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '79'
  - number: 78.5.1°
    text: |-
      de kadastrale aanduiding van de onroerende zaken met vermelding van de grootte volgens de basisregistratie kadaster
      van elk van de desbetreffende percelen en, indien een te onteigenen onroerende zaak een gedeelte van een perceel
      uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
  - number: 78.5.2°
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], de kadastrale aanduiding van de
      onroerende zaken waarop de te onteigenen rechten rusten;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 78.5.3°
    text: |-
      de namen volgens de basisregistratie kadaster van de eigenaren van de te onteigenen onroerende zaken en, bij
      afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], van de rechthebbenden op de te onteigenen
      rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '78.6'
    text: |-
      Het koninklijk besluit wordt genomen binnen zes maanden na afloop van de termijn gedurende welke het ontwerpbesluit
      met de bijbehorende stukken ingevolge [artikel 3:11, vierde lid, van de Algemene wet bestuursrecht][ref1] ter
      inzage heeft gelegen. Het besluit wordt bekend gemaakt aan de verzoeker en aan de in het vijfde lid, onder 3°,
      bedoelde eigenaren en andere rechthebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '78.7'
    text: |-
      Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant. Terinzagelegging ingevolge
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] vindt tevens plaats binnen de
      gemeente, bedoeld in het tweede lid. De burgemeester geeft tevens kennis van de zakelijke inhoud van het besluit
      in een of meer dag-, nieuws-, of huis-aan-huisbladen die in de gemeente verspreid worden, onder vermelding van
      datum en nummer van het koninklijk besluit en van de Staatscourant waarin het besluit is geplaatst. Een en ander
      geschiedt op kosten van hen ten name van wie het werk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '78.8'
    text: |-
      Het koninklijk besluit tot onteigening vervalt, indien de onteigenende partij niet binnen twee jaar na
      dagtekening van het koninklijk besluit de eigendom bij minnelijke overeenkomst heeft verkregen overeenkomstig
      [artikel 17][ref1], of de in het onteigeningsbesluit aangewezen eigenaren voor de rechtbank in het arrondissement
      waar de betrokken onroerende zaken zijn gelegen, heeft doen dagvaarden overeenkomstig [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel18
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '18'
        hoofdstuk: III
  - number: '79'
    text: |-
      Het besluit tot indiening van een verzoek tot onteigening vervalt indien het niet uiterlijk drie maanden na het
      nemen van dat besluit aan Ons is voorgedragen, vergezeld van:
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.1°
    text: |-
      een uitgewerkt plan met uitvoerige kaarten en met grondtekeningen waarop de te onteigenen onroerende zaken, en bij
      afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], de onroerende zaken waarop de te onteigenen
      rechten rusten, met vermelding van hun kadastrale aanduiding zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 79.2°
    text: 'een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.2°.a
    text: |-
      de grootte volgens de basisregistratie kadaster van elk van de desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.2°.b
    text: de namen van de eigenaren van deze zaken, volgens de basisregistratie kadaster;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.2°.c
    text: de kadastrale uittreksels ten tijde van het verzoek;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.3°
    text: |-
      bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref1], een lijst van de te onteigenen rechten
      met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de rechthebbenden op
      die rechten volgens de basisregistratie kadaster;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: 79.4°
    text: een zakelijke beschrijving ter onderbouwing van het verzoek;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.5°
    text: een overzicht van het gevoerde minnelijk overleg met bewijsstukken;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.6°
    text: een lijst van de belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.7°
    text: |-
      de kaart of de kaarten behorend bij het bestemmingsplan, het inpassingsplan, of de wijziging of uitwerking
      daarvan, dan wel van de omgevingsvergunning ter uitvoering waarvan onteigend wordt, met daarop geprojecteerd de
      grondplantekening;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: 79.8°
    text: andere documenten waaruit kan blijken welke wijze van uitvoering de verzoeker voor ogen staat.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel79
  - number: '80'
    text: |-
      De [artikelen 2][ref1], [3][ref2], [4][ref3], [17 tot en met 20][ref4], [22 tot en met 61][ref5], en
      [64b, tweede en derde lid][ref6], zijn op onteigeningen als bedoeld in deze titel van overeenkomstige toepassing,
      met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel64b
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '22'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0001842
        artikel: 64b
  - number: 80.a
    text: |-
      wanneer de onteigening geschiedt ten name van een publiekrechtelijk lichaam of een rechtspersoon als bedoeld in
      [artikel 78, eerste lid][ref1], dat lichaam of die rechtspersoon als eisende partij optreedt;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel78
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '78'
  - number: 80.b
    text: |-
      het verzoek, bedoeld in [artikel 54a][ref1], kan worden gedaan, zodra de terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref2] heeft plaats gehad en bij het
      verzoekschrift, in plaats van de in [artikel 54a, tweede lid, onder a tot en met d][ref3], genoemde stukken en
      gegevens een afschrift van het koninklijk besluit moet worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54a
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 54a
        hoofdstuk: IIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54a
        hoofdstuk: IIIa
        afdeling: '1'
  - number: '81.1'
    text: |-
      Indien het te onteigenen gebouw onbewoonbaar is verklaard, wordt de waarde vergoed van de grond en van de
      bouwmaterialen, ingeval het gebouw voor geen enkel doeleinde kan worden gebruikt. Indien het gebouw voor een
      ander doeleinde dan bewoning kan worden gebruikt, wordt de waarde vergoed van de grond en van de bouwmaterialen,
      vermeerderd met zodanig bedrag als billijk kan worden geacht in verband met het voordeel dat de eigenaar uit dat
      andere gebruik zou kunnen trekken.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel81
  - number: '81.2'
    text: |-
      Indien slechts een gedeelte van het te onteigenen gebouw onbewoonbaar is verklaard, wordt daarmee rekening gehouden
      bij de bepaling van de waarde van het geheel. Daarbij wordt gelet op de geschiktheid of ongeschiktheid van het
      onbewoonbaar verklaarde deel voor andere doeleinden dan bewoning.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel81
  - number: '82.1'
    text: |-
      Indien aan een besluit als bedoeld in [artikel 13 van de Woningwet][ref1], strekkende tot het treffen van bepaalde
      voorzieningen aan een gebouw of een daartoe strekkend besluit tot toepassing van bestuursdwang of oplegging van
      een last onder dwangsom wegens niet-naleving van het bepaalde bij of krachtens [artikel 1a][ref2], [1b][ref3],
      [7b][ref4] of 13 van de Woningwet geen gevolg wordt gegeven, wordt vergoed de waarde die het gebouw zou hebben in
      het geval zodanige voorzieningen waren getroffen, met aftrek van de kosten van het treffen van die voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel7b
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0005181
        artikel: 1b
      - id: ref4
        bwb_id: BWBR0005181
        artikel: 7b
  - number: '82.2'
    text: |-
      Indien het gebouw door een groter aantal personen wordt bewoond dan volgens plaatselijke verordening geoorloofd is,
      wordt bij het bepalen van de werkelijke waarde geen rekening gehouden met de vermeerdering van huurprijs die uit
      die overschrijding voortvloeit.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel82
  - number: '97'
    text: 'Onteigening van octrooien kan ten name van den Staat plaats vinden:'
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel97
  - number: 97.1°
    text: wanneer het belang van leger of vloot vordert, dat de Staat een uitsluitend recht op eene uitvinding verkrijge;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel97
  - number: 97.2°
    text: wanneer het algemeen nut vordert, dat iedereen in de gelegenheid worde gesteld de uitvinding toe te passen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel97
  - number: '98.1'
    text: |-
      De onteigening heeft plaats krachtens eene wet, waarin het te onteigenen octrooi wordt aangeduid onder vermelding
      of het geval van het vorige artikel sub 1°., dan wel het geval sub 2°. aanwezig is.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel98
  - number: '98.2'
    text: |-
      Zodra het voorstel van wet is ingediend, wordt het aan het Bureau voor de industriële eigendom, bedoeld in [artikel
      4 van de wet van 25 april 1963](onbekend) (Stb. 221), toegezonden. Het bureau maakt in het eerstvolgende nummer van
      het blad, bedoeld in [artikel 20, eerste lid, van de Rijksoctrooiwet 1995][ref1], die indiening bekend met beknopte
      aanduiding van het te onteigenen octrooi en met vermelding van het nummer waaronder de desbetreffende Kamerstukken
      zijn verschenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
  - number: '99'
    text: |-
      Onverwijld roept het in [artikel 98, tweede lid][ref1], bedoelde bureau allen, die volgens zijne registers belang
      bij het octrooi hebben, op, om binnen een bekwamen termijn mondeling of schriftelijk, opgave te doen van de schade,
      welke zij van de onteigening verwachten, en hij brengt Ons van de opgaven van belanghebbenden, verslag uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
  - number: '100'
    text: |-
      De [artikelen 2][ref1], [3][ref2], [17-20][ref3], [22][ref4], [24][ref5], [26-37][ref6], [43][ref7], [45][ref8] en
      [50-54][ref9] zijn ten deze toepasselijk, behoudens:


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0001842#Artikel43
      [ref8]: https://wetten.overheid.nl/BWBR0001842#Artikel45
      [ref9]: https://wetten.overheid.nl/BWBR0001842#Artikel50
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '17'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0001842
        artikel: '22'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0001842
        artikel: '24'
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0001842
        artikel: '26'
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0001842
        artikel: '43'
        hoofdstuk: III
      - id: ref8
        bwb_id: BWBR0001842
        artikel: '45'
        hoofdstuk: III
      - id: ref9
        bwb_id: BWBR0001842
        artikel: '50'
        hoofdstuk: III
  - number: 100.a
    text: |-
      dat de poging om den eigendom van het octrooi in der minne, vrij van alle lasten en regten, te verkrijgen, eerst
      geschiedt nadat het in het vorige artikel gemelde verslag is ingekomen;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel100
  - number: 100.b
    text: dat het geding in eersten aanleg gevoerd wordt voor de rechtbank Den Haag;
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel100
  - number: 100.c
    text: |-
      dat het octrooi de plaats inneemt van de te onteigenen onroerende zaak; de registers van het in
      [artikel 98, tweede lid][ref1], bedoelde bureau, die van de basisregistratie kadaster; de licentiehouders, die van
      de huurders; de pandcrediteuren, die van de hypotheekhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
  - number: '101'
    text: |-
      Ten minste drie dagen vóór de verschijning, wordt door den Staat aan de regtbank het verslag, bedoeld bij
      [art. 99][ref1] overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel99
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '99'
  - number: '102.1'
    text: |-
      Bij de berekening der schadevergoeding wordt niet gelet op licenties, verkregen nadat het wetsvoorstel tot
      onteigening is ingediend.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel102
  - number: '102.2'
    text: |-
      Het deel der schadevergoeding, dat den licentiehouders toegewezen is, wordt door den Staat te hunner beschikking
      gehouden.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel102
  - number: '103.1'
    text: |-
      Het vonnis van onteigening vervalt indien niet, binnen zes maanden nadat het in kracht van gewijsde is gegaan, de
      schadeloosstelling is betaald of geconsigneerd.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel103
  - number: '103.2'
    text: |-
      Op vertoon van duplicaten der quitantiën of der bewijzen van consignatie, tijdig opgemaakt, wordt het vonnis
      ingeschreven in de openbare registers van het in [artikel 98, tweede lid][ref1], bedoelde bureau en vermeld in het
      in [art. 98][ref2] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '98'
  - number: '103.3'
    text: |-
      Door de inschrijving gaat het octrooi over op den Staat, vrij van alle met betrekking tot het octrooi bestaande
      lasten en rechten. Voor zoover het octrooi niet ten dienste van vloot of leger is onteigend om eigendom van den
      Staat te worden, vervalt het.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel103
  - number: 104A.1
    text: |-
      Door Ons kan de wenschelijkheid van onteigening worden uitgesproken van de rechten, uit eene octrooi-aanvrage
      voortvloeiende. Afschrift van Ons desbetreffend besluit wordt aan het in [artikel 98, tweede lid][ref1], bedoelde
      bureau toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel104A
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
  - number: 104A.2
    text: |-
      Het in [artikel 98, tweede lid][ref1], bedoelde bureau wijst onverwijld na ontvangst van het afschrift, in
      het 1ste lid bedoeld, drie deskundigen aan die, bij gemotiveerd rapport, zoo spoedig mogelijk het bedrag der
      schadeloosstelling zullen vaststellen, dat den aanvrager bij onteigening zal worden uitgekeerd. Alvorens hun
      onderzoek aan te vangen leggen de deskundigen bij het in [artikel 98, tweede lid][ref2], bedoelde bureau eene
      belofte tot volledige geheimhouding af. Het rapport wordt bij het in [artikel 98, tweede lid][ref3], bedoelde
      bureau ingediend en door dezen onverwijld aan Ons aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel104A
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '98'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '98'
  - number: 104A.3
    text: |-
      Binnen één maand na ontvangst van het rapport, in het voorgaande lid bedoeld, zal door Ons, òf de onteigening
      ten behoeve van den Staat worden uitgesproken, nadat de aldus vastgestelde schadeloosstelling aan den aanvrager
      zal zijn betaald of geconsigneerd, òf worden besloten, dat er, gelet op het in het 2de lid bedoelde rapport, tot
      onteigening geen aanleiding bestaat; van het besluit zal het in [artikel 98, tweede lid][ref1], bedoelde bureau ten
      spoedigste afschrift worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel104A
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
  - number: 104B
    text: |-
      Bijaldien door Ons wordt besloten, dat er geen aanleiding bestaat tot onteigening der rechten, uit de octrooi-
      aanvrage voortvloeiende, zal de Staat den aanvrager, op zijn verzoek, de schade vergoeden, welke hij daardoor
      mocht hebben geleden; het bedrag van het te dezer zake verschuldigde wordt, tenzij dit bij minnelijke schikking kan
      worden bepaald, vastgesteld door de commissie van deskundigen, bedoeld in [artikel 104A, 2de lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel104A
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel104B
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 104A
  - number: '122.1'
    text: |-
      Onteigening kan plaatsvinden van onroerende zaken en rechten, waarover de beschikking
      moet worden verkregen ter verwezenlijking van een inrichtingsplan als bedoeld in
      [artikel 17, eerste lid, van de Wet inrichting landelijk gebied][ref1] of ter verwezenlijking van een
      reconstructieplan als bedoeld in [hoofdstuk 2 van de Reconstructiewet concentratiegebieden][ref2]. Onteigening
      geschiedt ten name van de provincie waarvan gedeputeerde staten het inrichtingsplan of reconstructieplan hebben
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020748#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013399#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0020748
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0013399
        hoofdstuk: '2'
  - number: '122.2'
    text: |-
      Onteigening geschiedt op verzoek van gedeputeerde staten, uit kracht van een koninklijk besluit. Alvorens omtrent
      het verzoek tot onteigening wordt beslist, wordt de Raad van State gehoord. Gedeputeerde staten sturen het verzoek
      tot onteigening in bij Onze Minister van Economische Zaken en leggen daarbij de stukken en gegevens, bedoeld in
      [artikel 63, tweede lid][ref1], over.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
  - number: '122.3'
    text: |-
      Gedeputeerde staten kunnen verzoeken dat de onteigening niet geschiedt ten name van de provincie maar ten name van
      het bureau beheer landbouwgronden, bedoeld in [artikel 28 van de Wet agrarisch grondverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003386#Artikel28
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003386
        artikel: '28'
  - number: '123'
    text: |-
      De [artikelen 63, eerste, tweede en vierde lid][ref1], [64][ref2], [64a][ref3] en [64b][ref4] zijn van toepassing,
      met dien verstande dat gedeputeerde staten van de provincie die het inrichtingsplan hebben vastgesteld, toepassing
      geven aan [afdeling 3.4 van de Algemene wet bestuursrecht][ref5], en dat in [artikel 63, vierde lid][ref6],
      telkens in plaats van «Onze Minister» wordt gelezen «gedeputeerde staten», terwijl in de slotzin van
      [artikel 63, vierde lid][ref7], in plaats van «kan» wordt gelezen «kunnen».


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel64a
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel64b
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel63
      [ref7]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '63'
      - id: ref2
