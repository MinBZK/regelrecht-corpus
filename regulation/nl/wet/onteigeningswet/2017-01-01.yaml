        artikel: '3'
  - number: '125.2'
    text: |-
      Binnen vijf jaar na de inwerkingtreding van de [Crisis- en herstelwet][ref1] wordt een voorstel van wet tot
      regeling van de in het eerste lid bedoelde onderwerpen ingediend bij de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0027431
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0027431
  - number: '155'
    text: |-
      Op de gevallen, waarin volgens art. 186 der [Grondwet][ref1] moet worden voorzien, is deze wet niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '156.1'
    text: De wet van 29 Mei 1841 (*Staatsblad* nr. 19) is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel156
  - number: '156.2'
    text: Zij blijft intusschen toepasselijk op regtsvorderingen tot onteigening vóór de afkondiging dezer wet aangevangen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel156
  - number: '156.3'
    text: |-
      Het zal desniettemin aan de onteigenende partij vrijstaan, van hare volgens de vorige wet aangevangen
      regtsvordering, zoolang nog geen vonnis in de zaak is gewezen, afstand te doen en eene nieuwe volgens deze wet
      in te stellen. In dat geval moet zij alle kosten, door de wederpartij tot op het doen van dien afstand gemaakt,
      betalen.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel156
  - number: '156.4'
    text: |-
      Zij kan tot die betaling genoodzaakt worden op het enkel bevelschrift van den voorzitter der rechtbank, gesteld aan
      den voet van den door de wederpartij opgemaakten staat van kosten.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel156
  - number: '156.5'
    text: Dit bevelschrift is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel156
  - number: '157'
    text: Deze wet kan worden aangehaald onder den titel van "onteigeningswet".
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel157
