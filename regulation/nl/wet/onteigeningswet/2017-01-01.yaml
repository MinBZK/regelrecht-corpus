        artikel: '63'
      - id: ref7
        bwb_id: BWBR0001842
        artikel: '63'
  - number: '124'
    text: |-
      Gedeputeerde staten zenden het verslag bedoeld in [artikel 3:17, van de Algemene wet bestuursrecht][ref1], de
      schriftelijk naar voren gebrachte zienswijzen als bedoeld in [artikel 63, vierde lid][ref2], alsmede hun mening
      daaromtrent aan Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel63
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '63'
  - number: '125.1'
    text: |-
      Onze Minister van Veiligheid en Justitie en Onze Minister van Infrastructuur en Milieu zenden binnen drie
      jaar na de inwerkingtreding van de [Crisis- en herstelwet][ref1] aan de Staten-Generaal een verslag over
      de doeltreffendheid en effecten in de praktijk van de [artikelen 3.9][ref2], [3.10, onderdeel D][ref3],
      [3.12, onderdeel C][ref4], [3.13][ref5], [3.14][ref6], [3.23][ref7] en [3.24, onderdeel D, van die wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0027431
      [ref2]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0027431#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0027431#Artikel3
    url: https://wetten.overheid.nl/BWBR0001842/2017-01-01#Artikel125
    references:
      - id: ref1
