  - number: '55'
    text: |-
      1 Een vonnis van onteigening, bedoeld in [artikel 37][ref1], vervalt, wanneer niet binnen drie maanden, nadat het
      kracht van gewijsde heeft verkregen, de schadeloosstellingen zijn betaald, of, in de gevallen waarin dit volgens
      deze wet kan geschieden, zijn geconsigneerd.

      2 Een vonnis van onteigening, bedoeld in [artikel 54i][ref2], dat niet is ingeschreven binnen de in
      [artikel 54m][ref3] genoemde termijn, vervalt, wanneer niet binnen drie maanden, nadat het vonnis, als bedoeld
      in [artikel 54t, tweede lid][ref4], houdende uitspraak over de schadeloosstellingen kracht van gewijsde heeft
      verkregen, die schadeloosstellingen zijn betaald, of, in de gevallen waarin dit volgens deze wet kan geschieden,
      zijn geconsigneerd. Bij verval van dit vonnis van onteigening vervalt tevens het vonnis waarbij overeenkomstig
      [artikel 54i][ref5] uitsluitend voorschotten zijn bepaald.

      3 Onder een schadeloosstelling is de wettelijke rente daarvan begrepen. De wettelijke rente loopt te rekenen van
      de dag van het vonnis van onteigening, bedoeld in [artikel 37][ref6] of van de dag van het vonnis, bedoeld in
      [artikel 54t][ref7].

      4 Indien het vonnis van onteigening niet wordt ingeschreven in de openbare registers, is de onteigenende partij
      schadeplichtig en hebben de wederpartij en de derde belanghebbenden de keuze een vaste schadeloosstelling of
      volledige schadevergoeding te vorderen.

      5 De vaste schadeloosstelling, bedoeld in het voorgaande lid, is gelijk aan tien ten honderd van de voor ieder door
      de rechtbank bij het vonnis van onteigening overeenkomstig [artikel 37][ref8] of [artikel 54t][ref9] vastgestelde
      of vermelde schadeloosstellingen.

      6 Wordt volledige schadevergoeding gevorderd, dan worden onder de schade mede begrepen de redelijkerwijs
      gemaakte kosten van rechtsbijstand en andere deskundige bijstand, alsmede de wettelijke rente van het bedrag der
      schadevergoeding van de dag, waarop het vonnis van onteigening is gewezen.

      7 Tot kennisneming der vordering is de rechtbank bevoegd, bij welke het geding van onteigening aanhangig is
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
