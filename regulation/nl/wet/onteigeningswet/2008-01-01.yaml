        artikel: '252'
  - number: '45'
    text: |-
      1 De vruchtgebruiker kan zich jegens de onteigenaar slechts op verkrijging van een vruchtgebruik op de vordering
      tot schadeloosstelling voor de hoofdgerechtigde krachtens [artikel 213 van Boek 3 van het Burgerlijk Wetboek][ref1]
      beroepen, indien hij is tussengekomen.

      2 Bij onteigening van goederen die zijn vermaakt onder een ontbindende voorwaarde en een daarbij aansluitende
      opschortende voorwaarde doet de bezwaarde erfgenaam de schadeloosstelling in een der schuldregisters voor
      geldleningen ten laste van het Rijk inschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel213
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '213'
  - number: '50'
    text: |-
      1 De kosten van het proces komen ten laste van de onteigenende partij, met dien verstande echter dat ingeval aan
      de verweerder onderscheidenlijk een derde belanghebbende, die het aan hem ten processe gedane aanbod niet heeft
      aanvaard, niet meer wordt toegewezen dan hem werd aangeboden, de rechtbank de betrokkene kan veroordelen tot
      betaling van de kosten van het geding of van een door haar naar billijkheid te bepalen gedeelte van die kosten.

      2 In afwijking van het bepaalde in het vorige lid komen de kosten van het proces steeds ten laste van de
      onteigenende partij, indien in de dagvaarding niet is vermeld welke som aan de verweerder onderscheidenlijk
      aan ieder der belanghebbenden, die aan de onteigenende partij bekend konden zijn, als schadeloosstelling wordt
      aangeboden.

      3 Indien de rechtbank evenwel van oordeel is, dat de onteigenende partij tengevolge van gebrek aan medewerking aan
      de zijde van de verweerder of een derde belanghebbende voor de aanvang van het geding tot onteigening, onvoldoende
      gegevens ter beschikking heeft gehad tot het doen van een redelijk aanbod bij dagvaarding of aangetekende brief,
      of wanneer zij daartoe aanleiding vindt in de omstandigheden van het geding, kan zij de verweerder veroordelen
      in de kosten van het proces of, overeenkomstig het eerste lid van dit artikel, de betrokkene veroordelen tot
      betaling van een gedeelte van die kosten. Ingeval de som der kosten waarin een verweerder of derde belanghebbende
      is veroordeeld, hoger is dan die van de aan hem toegekende schadeloosstelling, kan de rechtbank de betrokkene
      veroordelen tot betaling van het verschil dier sommen.

      4 Onder de kosten van het geding zijn mede begrepen kosten van rechtsbijstand of andere deskundige bijstand, die
      naar het oordeel van de rechtbank redelijkerwijs door verweerders of derde belanghebbenden zijn gemaakt.

      5 De kosten van de bekendmakingen, bedoeld in de [artikelen 28][ref1], [35][ref2], [54][ref3] en [54d][ref4], komen
      steeds voor rekening van de onteigenende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54d
