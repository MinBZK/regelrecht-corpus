  - number: '51'
    text: |-
      Wanneer het vonnis bij verstek is gewezen, kan men daartegen binnen acht dagen na de beteekening, op de wijze, in
      het [Wetboek van Burgerlijke Regtsvordering][ref1] voorgeschreven, in verzet komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '52'
    text: |-
      1 Tegen het vonnis wordt geen hooger beroep toegelaten.

      2 De voorziening in cassatie moet binnen twee weken na de uitspraak plaats hebben.

      3 Zij geschiedt door eene verklaring ter griffie der regtbank, die het vonnis heeft gewezen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel52
  - number: '53'
    text: |-
      1 Deze verklaring wordt binnen zes weken na afloop van de in het vorige artikel genoemde termijn van twee weken
      met een ontwikkeling van de gronden der cassatie aan de tegenpartij betekend en gaat vergezeld van een dagvaarding
      tegen de eerste terechtzitting, welke na verloop van twee weken na de betekening plaats vindt.

      2 De conclusie van de eiser, bedoeld in
      [artikel 412, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], wordt genomen ten pleitdage.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel412
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '412'
  - number: '54'
    text: |-
      1 Binnen acht dagen nadat het in [artikel 37][ref1] bedoelde vonnis gezag van gewijsde heeft verkregen, doet de
      griffier het bij uittreksel in een of meer bij vonnis aangewezen nieuws- of advertentiebladen plaatsen.

      2 Hetzelfde heeft, met inachtneming van denzelfden termijn, op last van de griffier bij den Hoogen Raad plaats,
      wanneer de voorziening in cassatie tegen het vonnis, waarbij de onteigening werd uitgesproken, verworpen is, of
      wanneer de Hooge Raad, het vonnis des eersten regters vernietigende, de onteigening uitspreekt, in welk geval zijn
      arrest het nieuws- of advertentieblad aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
