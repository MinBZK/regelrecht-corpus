  - number: 64b
    text: |-
      1 De [artikelen 17 tot en met 20][ref1] en [22 tot en met 61][ref2], met uitzondering van
      [artikel 23, onderdeel 2°][ref3], zijn van toepassing.

      2 Wanneer gravingen, opmetingen of het stellen van tekeningen op iemands grond nodig geacht worden, moeten de
      gebruikers van de grond dit gedogen, mits hun dit tweemaal vierentwintig uren te voren door het gemeentebestuur
      schriftelijk is aangezegd.

      3 De schade, daardoor veroorzaakt, wordt door de kantonrechter begroot, en door de Staat vergoed. Deze verhaalt die
      kosten op hen, te wier name het werk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel17
