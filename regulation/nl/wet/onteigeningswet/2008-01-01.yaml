  - number: '87'
    text: |-
      1 Onteigening ten name van een ander publiekrechtelijk lichaam dan de gemeente of van een rechtspersoon als bedoeld
      in [artikel 77, eerste lid, aanhef][ref1], heeft op verzoek van dat lichaam of die rechtspersoon plaats uit kracht
      van een koninklijk besluit. Alvorens omtrent het verzoek tot onteigening wordt beslist, wordt de Raad van State
      gehoord. Bij de indiening van het verzoek legt de verzoeker de stukken bedoeld in [artikel 80, tweede lid][ref2],
      over aan Onze Minister die het aangaat.

      2 Op de voorbereiding van de beslissing tot onteigening is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3]
      van toepassing. De in [artikel 3:12 van de Algemene wet bestuursrecht][ref4] bedoelde kennisgeving wordt gedaan
      door de burgemeester. Deze kennisgeving vermeldt zo mogelijk de aard en de strekking van de feitelijke werken of
      werkzaamheden. Terinzagelegging geschiedt tevens ter secretarie van de gemeente waar de betrokken onroerende zaken
      zijn gelegen. In ieder geval worden ter inzage gelegd de in [artikel 80, tweede lid][ref5], bedoelde stukken.

      3 Mondelinge zienswijzen kunnen naar voren worden gebracht bij Onze Minister wie het aangaat.

      4 Alvorens omtrent het verzoek tot onteigening wordt beslist, worden degenen, die tijdig ingevolge
      [artikel 3:15 van de Algemene wet bestuursrecht][ref6] een zienswijze naar voren hebben gebracht, door Onze
      Minister die het aangaat, in de gelegenheid gesteld zich te doen horen. Zo nodig kan Onze Minister ook andere
      belanghebbenden in de gelegenheid stellen zich te doen horen.

      5 Op een koninklijk besluit tot onteigening is [artikel 83, eerste lid][ref7], van overeenkomstige toepassing.

      6 Het koninklijk besluit wordt bekendgemaakt binnen negen maanden na afloop van de termijn gedurende welke
      de stukken ingevolge [artikel 3:11, vierde lid, van de Algemene wet bestuursrecht][ref8] ter inzage hebben
      gelegen. Het besluit wordt in ieder geval bekendgemaakt aan de onteigenende partij en, zo mogelijk, aan de in
      [artikel 83, eerste lid, onder 3°][ref9], bedoelde eigenaren en andere rechthebbenden.

      7 Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant. Terinzagelegging ingevolge
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref10] vindt tevens plaats op de
      secretarie van de betrokken gemeente. De burgemeester geeft tevens kennis van de zakelijke inhoud van het besluit
      in een of meer dag-, nieuws-, of huis-aan-huisbladen die in de gemeente verspreid worden, onder vermelding van
      datum en nummer van het koninklijk besluit en van de Staatscourant waarin het besluit is geplaatst.

      8 Het koninklijk besluit tot onteigening vervalt, indien de onteigenende partij niet binnen twee jaar na
      dagtekening van het koninklijk besluit de eigendom bij minnelijke overeenkomst heeft verkregen overeenkomstig
      [artikel 17][ref11], of de eigenaren, in het onteigeningsbesluit aangewezen, voor de rechtbank, in welker
      rechtsgebied de onroerende zaken gelegen zijn, waarop de onteigening betrekking heeft, heeft doen dagvaarden
      overeenkomstig [artikel 18][ref12].


