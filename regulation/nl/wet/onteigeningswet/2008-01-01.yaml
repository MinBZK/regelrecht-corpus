  - number: '155'
    text: |-
      Op de gevallen, waarin volgens art. 186 der [Grondwet][ref1] moet worden voorzien, is deze wet niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '156'
    text: |-
      1 De wet van 29 Mei 1841 (*Staatsblad* nr. 19) is ingetrokken.

      2 Zij blijft intusschen toepasselijk op regtsvorderingen tot onteigening vóór de afkondiging dezer wet aangevangen.

      3 Het zal desniettemin aan de onteigenende partij vrijstaan, van hare volgens de vorige wet aangevangen
      regtsvordering, zoolang nog geen vonnis in de zaak is gewezen, afstand te doen en eene nieuwe volgens deze wet
      in te stellen. In dat geval moet zij alle kosten, door de wederpartij tot op het doen van dien afstand gemaakt,
      betalen.

      4 Zij kan tot die betaling genoodzaakt worden op het enkel bevelschrift van den voorzitter der
      arrondissementsregtbank, gesteld aan den voet van den door de wederpartij opgemaakten staat van kosten.

      5 Dit bevelschrift is uitvoerbaar bij voorraad.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel156
  - number: '157'
    text: Deze wet kan worden aangehaald onder den titel van "onteigeningswet".
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel157
