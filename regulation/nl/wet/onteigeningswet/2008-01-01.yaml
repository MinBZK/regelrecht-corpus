  - number: 95a
    text: |-
      Indien de verpachting na het tijdstip van de nederlegging, bedoeld in [artikel 91][ref1], heeft plaats gehad,
      wordt door de onteigenende partij aan de pachter geen schadeloosstelling betaald, maar heeft deze een vordering tot
      schadevergoeding tegen de verpachter, ten ware anders mocht zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel91
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel95a
