  - number: 54i
    text: |-
      1 Behoudens ingeval van nietigverklaring van de dagvaarding of niet-ontvankelijkheidverklaring dan wel ontzegging
      van de eis, spreekt de rechtbank de onteigening uit met bepaling van een voorschot op de schadeloosstelling voor
      de verweerders en bekende, niet betwiste derde belanghebbenden en van de door de onteigenende partij te treffen
      bijkomende voorzieningen, indien deze in het aanbod zijn opgenomen. Het voorschot wordt bepaald op het bedrag,
      waarover terzake tussen hen en de onteigenende partij overeenstemming bestaat blijkens gewisselde conclusies of
      door de verweerders of derde belanghebbenden ondertekende bewijsstukken.

      2 Indien niet blijkt, dat overeenstemming is bereikt, bepaalt de rechtbank voor ieder het bedrag van het voorschot
      op 90 ten honderd van de aan ieder aangeboden schadeloosstelling, tenzij zij, na desgewenst de deskundigen
      mondeling gehoord te hebben, aanleiding vindt het voorschot op een ander bedrag vast te stellen. Indien de
      rechtbank daartoe termen aanwezig acht, kan zij de uitspraak omtrent het voorschot ten hoogste veertien dagen
      aanhouden. Ingeval een verweerder of derde belanghebbende het aan hem ten processe gerichte aanbod heeft aanvaard,
      bepaalt de rechtbank voor de betrokkene geen voorschot en bepaalt zij in haar vonnis de schadeloosstelling voor de
      betrokkene op de som van dat aanvaarde aanbod.

      3 Ingeval alle betrokkenen het aan hen ten processe gerichte aanbod hebben aanvaard, geldt het vonnis als een
      vonnis bedoeld in [artikel 37][ref1].

      4 De rechtbank bepaalt voor de onteigende partij en bekende derde belanghebbenden een som als zekerheid voor
      de voldoening van de aan ieder van hen verschuldigde schadeloosstelling. Deze som wordt bepaald op het bedrag,
      waarover overeenstemming is bereikt. Blijkt niet, dat overeenstemming is bereikt, dan wordt die som bepaald
      tenminste op het bedrag dat ieder is aangeboden, verminderd met het voorschot.

      5 Indien blijkens het proces-verbaal van de opneming door de deskundigen, die plaats heeft gevonden volgens
      [Afdeling 1 van dit Hoofdstuk][ref2], de betrokkene afstand heeft gedaan van het recht op zekerheidstelling
      stelt de rechtbank voor hem de som als hier bedoeld niet vast. Evenmin doet zij zulks ingeval haar uit gewisselde
      conclusies of door de verweerders of derde belanghebbenden ondertekende bewijsstukken blijkt, dat afstand van het
      recht op zekerheidstelling is gedaan. De rechtbank bepaalt tevens op welke wijze de zekerheidstelling zal plaats
      vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel54i
