  - number: '97'
    text: |-
      Onteigening van octrooien kan ten name van den Staat plaats vinden:

      1°. wanneer het belang van leger of vloot vordert, dat de Staat een uitsluitend recht op eene uitvinding verkrijge;

      2°. wanneer het algemeen nut vordert, dat iedereen in de gelegenheid worde gesteld de uitvinding toe te passen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel97
  - number: '98'
    text: |-
      1 De onteigening heeft plaats krachtens eene wet, waarin het te onteigenen octrooi wordt aangeduid onder vermelding
      of het geval van het vorige artikel sub 1°., dan wel het geval sub 2°. aanwezig is.

      2 Zodra het voorstel van wet is ingediend, wordt het aan het Bureau voor de industriële eigendom, bedoeld in
      [artikel 4 van de wet van 25 april 1963](onbekend) (Stb. 221), toegezonden. Het bureau maakt in het eerstvolgende
      nummer van het blad, bedoeld in [artikel 20, eerste lid, van de Rijksoctrooiwet 1995][ref1], die indiening bekend
      met beknopte aanduiding van het te onteigenen octrooi en met vermelding van het nummer waaronder de desbetreffende
      Kamerstukken zijn verschenen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
  - number: '99'
    text: |-
      Onverwijld roept het in [artikel 98, tweede lid][ref1], bedoelde bureau allen, die volgens zijne registers belang
      bij het octrooi hebben, op, om binnen een bekwamen termijn mondeling of schriftelijk, opgave te doen van de schade,
      welke zij van de onteigening verwachten, en hij brengt Ons van de opgaven van belanghebbenden, verslag uit.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
  - number: '100'
    text: |-
      De [artikelen 2][ref1], [3][ref2], [17-20][ref3], [22][ref4], [24][ref5], [26-37][ref6], [43][ref7], [45][ref8] en
      [50-54][ref9] zijn ten deze toepasselijk, behoudens:

      a. dat de poging om den eigendom van het octrooi in der minne, vrij van alle lasten en regten, te verkrijgen, eerst
      geschiedt nadat het in het vorige artikel gemelde verslag is ingekomen;

      b. dat het geding in eersten aanleg gevoerd wordt voor de arrondissementsregtbank te 's-Gravenhage;

      c. dat het octrooi de plaats inneemt van de te onteigenen onroerende zaak; de registers van het in
      [artikel 98, tweede lid][ref10], bedoelde bureau, die van de basisregistratie kadaster; de licentiehouders, die van
      de huurders; de pandcrediteuren, die van de hypotheekhouders.


