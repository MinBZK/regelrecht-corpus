  - number: '74'
    text: |-
      1 Zoodra mogelijk na de onteigening, moet degene, die haar bevolen heeft, aan de onteigenden geregtelijk eene
      schadevergoeding doen aanbieden, of in de gevallen, in [art. 58, eerste lid][ref1], genoemd, consigneren.

      2 Indien dit aanbod of die consignatie niet binnen drie maanden is geschied, alsmede wanneer met het aangebodene of
      geconsigneerde geen genoegen wordt genomen, kan de schadevergoeding in regten door de onteigenden worden gevorderd.

      3 In het eerste geval kan de Staat, de provincie, de gemeenten of het waterschap de bedoelde schadeloosstelling
      van hen, die de onteigening gelast hebben, persoonlijk terugvorderen, ten ware het verzuim buiten hunne schuld mogt
      hebben plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel58
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '58'
        hoofdstuk: IV
  - number: '75'
    text: |-
      De wettelijke interessen der verschuldigde schadevergoeding moeten van den dag der inbezitneming aan de onteigenden
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel75
  - number: '76'
    text: |-
      Wanneer hij, in wiens naam de onteigening gelast is, den eigendom van de zaak niet langer voor het beoogde doel
      noodig acht, en er nog geene drie jaren sedert de onteigening verloopen zijn, is de onteigende bij voorkeur boven
      alle anderen tegen betaling van den prijs, door deskundigen te begrooten, tot de verkrijging daarvan geregtigd.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76
  - number: 76a
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de [artikelen 76][ref2] in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76b
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 76b
  - number: 76a bis
    text: |-
      1 Wanneer ogenblikkelijke inbezitneming volstrekt noodzakelijk geacht wordt, kan deze op last van de hoogste
      militaire autoriteit, ter plaatse aanwezig, geschieden onder zo spoedig mogelijke afgifte van een schriftelijk
      bewijsstuk van de inbezitneming.

      2 Op de in het eerste lid bedoelde inbezitneming is het bepaalde in [artikel 73][ref1], ten aanzien van de
      eigendomsovergang en de overschrijving in de openbare registers, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel73
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76a_bis
