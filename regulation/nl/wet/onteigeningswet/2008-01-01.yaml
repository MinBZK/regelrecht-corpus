  - number: '88'
    text: |-
      De [artikelen 2][ref1], [3][ref2] en [4][ref3], alsmede de [artikelen 17-20][ref4], [22][ref5], [24][ref6],
      [26-38][ref7], [40-41][ref8], [42, 1ste en 3de lid][ref9], [42][ref10], [43-47][ref11], [49-54t][ref12] zijn ten
      deze van toepassing behoudens dat

      1. indien de gemeenteraad tot onteigening heeft besloten, hetgeen van Ons besluit gezegd wordt, van toepassing
      wordt op het besluit van de gemeenteraad;

      2. wanneer de onteigening geschiedt ten name van een ander publiekrechtelijk lichaam of een instelling, dat lichaam
      of deze instelling als eisende partij optreedt;

      3. het verzoek, bedoeld in [artikel 54a][ref13], kan worden gedaan, zodra de terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref14] heeft plaats gehad en bij het
      verzoekschrift in plaats van de in het tweede lid van eerstgenoemd artikel onder 1 en 2 genoemde stukken moet
      worden overgelegd afschrift van het besluit van de gemeenteraad of van het koninklijk besluit.


