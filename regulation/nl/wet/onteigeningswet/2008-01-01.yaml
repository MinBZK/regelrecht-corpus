  - number: '65'
    text: |-
      1 Wanneer niet de grond zelf onteigend wordt, maar slechts tot het verrichten van in deze titel vermelde werken
      zekere bodemmaterialen nodig geacht worden, mag dit ook geschieden op grond van een besluit van gedeputeerde staten
      of van het dagelijks bestuur van het waterschap, dat tot onteigening overgaat.

      2 Het besluit, door Ons of door de zooeven genoemde collegien of besturen genomen, wijst zoo nauwkeurig mogelijk de
      oppervlakte aan, waarover en de diepte, tot welke de uitgraving zal plaats hebben. Het bepaalt tevens den termijn,
      waarbinnen het verzoekschrift, bedoeld in [artikel 66][ref1], moet zijn ingediend.

      3 Het besluit, bedoeld in het vorige lid, wordt in de *Staatscourant* en in een in de streek verspreid wordend
      nieuws- of advertentieblad openbaar gemaakt.

      4 De schadeloosstelling bepaalt zich in dat geval tot de waarde der weggenomen speciën en de schade, door die
      wegneming aan den grond toegebragt, met inachtneming der bepaling van [art. 41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel41
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel65
