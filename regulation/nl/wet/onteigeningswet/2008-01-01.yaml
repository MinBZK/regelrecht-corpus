      1 Onteigening van wegen, bruggen, bermen, bermslooten en kanalen, alsmede daarop rustende zakelijke rechten als in
      [artikel 4][ref1] bedoeld, en onteigening voor aanleg en verbetering van wegen, bruggen, spoorwegwerken, kanalen,
      – waaronder begrepen onteigening voor aanleg en verbetering van werken ter uitvoering van een tracébesluit als
      bedoeld in [artikel 15, eerste lid, van de Tracéwet][ref2] – havenwerken, werken ten behoeve van de bestrijding
      van de verontreiniging van oppervlaktewateren en terreinen en werken voor de luchtvaart, alsmede ten behoeve van
      verbetering of verruiming van rivieren kan geschieden uit kracht van een door Ons, den Raad van State gehoord,
      genomen besluit.

      2 De bepalingen van de [artikelen 63 tot en met 64b][ref3] zijn van toepassing.

      3 Ingeval ter aanwijzing van een luchtvaartterrein toepassing is gegeven aan de
      [artikelen 19 tot en met 24 van de Luchtvaartwet][ref4]:

      1°. wordt een bewijs overgelegd dat [artikel 20 van die wet][ref5] is nageleefd;

      2°. is [artikel 63][ref6] niet van toepassing;

      3°. wordt in de plaats van grondtekening bedoeld in [artikel 63, tweede lid, onder 1°][ref7], gelezen de kaart
      bedoeld in [artikel 20, eerste lid, onderdeel a, van die wet][ref8];

      4°. neemt de in [artikel 64a, eerste lid][ref9], bedoelde termijn van zes maanden een aanvang vanaf de datum waarop
      het besluit bedoeld in [artikel 18 van die wet][ref10] onherroepelijk is geworden;

      5°. vindt de in [artikel 64a, derde lid][ref11], bedoelde terinzagelegging plaats op de secretarieën der gemeenten,
      bedoeld in [artikel 19, derde lid, van die wet][ref12].


