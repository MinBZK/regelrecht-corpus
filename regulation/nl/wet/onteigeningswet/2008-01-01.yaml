preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten;

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de onteigening ten algemeenen nutte, in
    overeenstemming met art. 147 der Grondwet, bij de wet te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onteigening ten algemeenen nutte kan in het publiek belang van den Staat, van eene of meer provinciën, van eene
      of meer gemeenten, en van een of meer waterschappen plaats hebben.

      2 In dat publiek belang kan ook ten name van natuurlijke personen of privaatrechtelijke rechtspersonen met
      volledige rechtsbevoegdheid, aan wie de uitvoering van het werk, dat onteigening vordert, is toegestaan, worden
      onteigend.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel1
  - number: '2'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Regtsvordering][ref1] zijn op het geding tot onteigening
      toepasselijk, voor zooveel daarvan bij deze wet niet is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '3'
    text: |-
      1 Als eigenaar van een onroerende zaak, en als rechthebbende op een recht als in [artikel 4, eerste lid][ref1],
      omschreven, worden zij beschouwd, die als zodanig in de basisregistratie kadaster staan vermeld.

      2 Desniettemin kan een ieder die beweert eigenaar te zijn, of rechthebbende op een recht als in
      [artikel 4, eerste lid][ref2], omschreven, en niet is gedagvaard, aan de rechter verzoeken in het
      geding van onteigening te mogen tussenkomen, zolang de eindconclusies door partijen niet genomen
      zijn. Hetzelfde recht hebben derde belanghebbenden, waaronder zijn te verstaan beperkt gerechtigden,
      huurders, onderhuurders, pachters, onderpachters, bezitters, eigenaren in geval van mandeligheid volgens
      [artikel 60, tweede lid, van Boek 5 van het Burgerlijk Wetboek][ref3], schuldeisers als bedoeld in
      [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref4], en zij die op het te onteigenen goed of op een recht
      waaraan dat is onderworpen, beslag hebben gelegd. Deze laatsten kunnen in hun verzoek alleen worden ontvangen,
      indien zij daarbij een notaris of deurwaarder aanwijzen aan wie kan worden betaald.

      3 Bij tegenspraak der hoedanigheid van eigenaar, rechthebbende of derde belanghebbende, wordt de onteigening met de
      overigen voortgezet, en zal hij, die beweert gerechtigde te zijn, zijn recht alleen op de schadevergoeding kunnen
      uitoefenen, die in dat geval wordt geconsigneerd overeenkomstig de [Wet op de consignatie van gelden][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
