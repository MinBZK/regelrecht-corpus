  - number: '20'
    text: |-
      1 Wanneer de verweerder buiten het Koningrijk woont, of zijne woonplaats onbekend is, wordt het geding gevoerd
      tegen den gevolmagtigde of bewindvoerder, indien een zoodanige binnen het Koningrijk bekend is, en, zoo ook deze
      onbekend is, tegen een derde, binnen het ressort der regtbank wonende, en door deze op verzoek en ten koste der
      onteigenende partij, te dien einde te benoemen. De alzoo benoemde kan, bij het ophouden zijner betrekking, het loon
      van den bewindvoerder eens afwezige, en daarenboven de gemaakte onkosten in rekening brengen.

      2 Desniettemin is de verweerder geregtigd ten dage, in [art. 23][ref1] genoemd, op de dagvaarding, aan den
      gevolmagtigde, bewindvoerder of door den regter benoemde gedaan, te verschijnen, in welk geval de dagvaarding als
      aan hem geschied wordt beschouwd en het geding tegen hem wordt gevoerd.

      3 Is de verweerder overleden, dan vinden de bepalingen van dit artikel overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
        hoofdstuk: III
  - number: '22'
    text: |-
      1 De dagvaarding moet, op straffe van nietigheid, de som, welke als schadeloosstelling aangeboden wordt, vermelden.

      2 Indien er derde belanghebbenden zijn, moet uit het in de dagvaarding te vermelden aanbod blijken, welk aandeel
      daarvan voor de verweerder onderscheidenlijk ieder der derde belanghebbenden, voor zover dezen aan de onteigenende
      partij bekend zijn of behoren te zijn, als schadeloosstelling is bestemd, op straffe van veroordeling in de kosten
      overeenkomstig [artikel 50, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel50
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '50'
        hoofdstuk: III
  - number: '23'
    text: |-
      Ten minste drie dagen vóór de verschijning legt de onteigenende partij, tot staving van haren eisch, ter griffie
      van de regtbank over:

      1°. een exemplaar van de *Staatscourant*, waarin is openbaar gemaakt Ons besluit, waarbij de te onteigenen
      onroerende zaken en rechten worden aangewezen;

      2°. een door burgemeester afgegeven bewijs, dat de commissie tot aanhooring van de bezwaren der belanghebbenden
      zitting gehouden heeft in de gemeente, binnen welker kring de te onteigenen onroerende zaak of de onroerende zaak
      waarop het te onteigenen recht rust, gelegen is; in dat bewijs wordt vermeld, in welk nieuws- of advertentieblad
      dan wel nieuws- of advertentiebladen en op welk tijdstip vorenbedoelde zitting is aangekondigd;

      3°. een mede door burgemeester afgegeven bewijs, dat de uitgewerkte plans met de daarbij behoorende kaarten en
      grondteekeningen op de secretarie der gemeente ter inzage gelegen hebben; en, zoo het plan, in het laatste lid van
      dat artikel genoemd, ter griffie van de provincie was nedergelegd, een daarvan door den secretaris van de provincie
      afgegeven bewijs.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel23
  - number: '24'
    text: |-
      De rechtbank behandelt zaken aangaande onteigening ten algemenen nutte, vóór elke andere.

      Op de eerste roldatum, of uiterlijk twee weken daarna concluderen de verweerders voor antwoord. Indien de
      verweerders alsdan niet voor antwoord concluderen, worden zij geacht het aanbod te hebben verworpen. Het laatste is
      van overeenkomstige toepassing ten aanzien van derde belanghebbenden aan wie bij dagvaarding of aangetekende brief
      een aanbod is gedaan.

      Oproeping tot vrijwaring wordt niet toegelaten.

      Indien van twee of meer gedaagden de een verschijnt, de ander niet, wordt met de verschijnende onmiddellijk
      voortgeprocedeerd. De uitspraak geschiedt tussen al de partijen bij een en hetzelfde vonnis, dat als een vonnis op
      tegenspraak gewezen wordt beschouwd, en waartegen geen verzet is toegelaten.

      Uiterlijk een maand na de eerste roldatum doet de rechtbank uitspraak.

      Het voorschrift vervat in het vorige lid geldt niet, indien de eigenaar de vordering als bedoeld in artikel 38 doet
      of indien een der partijen pleidooi vraagt; alsdan verwijst de enkelvoudige kamer op ter zitting gedaan verzoek de
      zaak naar de meervoudige kamer der rechtbank.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel24
  - number: '25'
    text: |-
      De regtbank kan aan de onteigenende partij haren eisch niet toewijzen:

      1°

      2°. wanneer niet wordt overgelegd een exemplaar van de *Staatscourant*, waarin is openbaar gemaakt Ons besluit,
      waarbij de aanwijzing ter onteigening der in de dagvaarding vermelde onroerende zaken of rechten is geschied;

      3°

      4°. wanneer de uitgewerkte plans met de daarbij behoorende kaarten en grondteekeningen niet op de secretariën der
      gemeenten ter inzage gelegen hebben.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel25
  - number: '26'
    text: |-
      Tegen de uitspraak des regters, houdende nietigverklaring van de dagvaarding of ontzegging van den eisch om eenige
      andere reden, wordt hooger beroep toegelaten.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel26
  - number: '27'
    text: |-
      1 Behoudens ingeval van nietigverklaring van de dagvaarding of niet-ontvankelijkheidverklaring dan wel ontzegging
      van de eis, benoemt de rechtbank een of meer deskundigen in oneven getale. Zij geeft aan hen opdracht om de
      schadeloosstellingen te begroten van de verweerder en derde belanghebbenden, doch slechts voor zover zij het aan
      hen ten processe gedane aanbod niet hebben aanvaard.

      2 Zij benoemt voorts een harer leden, om vergezeld van de griffier, als commissaris bij de opneming door
      deskundigen van de ligging en gesteldheid der onroerende zaken waarop de onteigening betrekking heeft, tegenwoordig
      te zijn en wijst een of meer nieuws- of advertentiebladen aan, waarin de aankondiging door de griffier, in het
      volgende artikel vermeld, moet geschieden.

      3 Deze benoeming en aanwijzing vinden ook plaats, indien er verstek mocht zijn verleend of indien de gedaagde het
      voor hem bestemde gedeelte van het aanbod heeft aanvaard en niet blijkt, dat de derde belanghebbenden het voor hen
      bestemde gedeelte van het aanbod genoegzaam achten. Tegen de verlening van verstek wordt geen verzet toegelaten.

      4 Ingeval de verweerder of een derde belanghebbende het aan hem ten processe gedane aanbod heeft aanvaard, bepaalt
      de rechtbank in haar vonnis de schadeloosstelling voor de betrokkene op de som van dat aanvaarde aanbod.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel27
  - number: '28'
    text: |-
      1 De tijd en plaats van de opneming door deskundigen van de ligging en gesteldheid der onroerende zaken waarop
      de onteigening betrekking heeft, worden door de rechtercommissaris met inachtneming van de meest mogelijke spoed
      bepaald en medegedeeld aan de griffier. Zij worden door de griffier bekend gemaakt door een aankondiging in een of
      meer daartoe in het vonnis aangewezen nieuws- of advertentiebladen.

      2 De griffier geeft binnen acht dagen, nadat het vonnis is gewezen, aan de deskundigen kennis van hunne benoeming.
      Ten minste acht dagen voor den dag, waarop de opneming zal plaats hebben, zendt hij aan ieder der deskundigen een
      afschrift van het vonnis en roept hij partijen en deskundigen op om bij de opneming tegenwoordig te zijn.

      3 Bij afwezigheid van de wederpartij gaat de opneming door.

      4 Derde belanghebbenden kunnen bij de opneming tegenwoordig zijn om ook hunne schade te doen begrooten.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel28
  - number: '29'
    text: |-
      1 In de plaats der deskundigen, die niet opgekomen zijn of weigeren aan hun verplichtingen te voldoen, benoemt
      de rechter-commissaris anderen. Indien ten gevolge hiervan de opneming moet worden uitgesteld, bepaalt de
      rechtercommissaris daarvoor een nadere tijd waarvan de griffier mededeling doet aan partijen, derde belanghebbenden
      en deskundigen.

      2 De rechtercommissaris brengt de bepalingen dezer wet omtrent de begroting der schadeloosstelling, voor zoveel ter
      zake vereist wordt, onder de aandacht der deskundigen.

      3 De deskundigen nemen bij de opneming de toestand van de onroerende zaak waarop de onteigening betrekking heeft,
      op door foto's en tekeningen en andere daartoe geschikte middelen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel29
  - number: '30'
    text: |-
      Partijen en derde belanghebbenden delen aan de rechtercommissaris alle feiten en omstandigheden mede, die van
      belang zijn voor een juiste begroting van de schade en leggen daartoe de nodige stukken over.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel30
  - number: '31'
    text: |-
      1 Ook ambtshalve kan de regtercommissaris ten allen tijde die personen voor zich en voor de deskundigen doen
      verschijnen, wier inlichtingen hij tot betere beoordeeling der zaak nuttig mogt achten.

      2 Indien deze personen schadeloosstelling vorderen, wordt die door den regtercommissaris begroot en daarvan melding
      gemaakt in het procesverbaal.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel31
  - number: '32'
    text: |-
      De formaliteiten, bij het [Wetboek van Burgerlijke Regtsvordering][ref1] voorgeschreven omtrent het getuigenverhoor
      en het berigt van deskundigen, zijn ten deze niet toepasselijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '33'
    text: |-
      1 Wanneer de deskundigen of de personen, wier verschijning de regtercommissaris gelast heeft, op den bepaalden
      tijd, schoon behoorlijk geroepen, niet opkomen, of, zonder wettige redenen, weigeren de van hen gevraagde
      inlichtingen te geven, worden zij door den regtercommissaris veroordeeld tot vergoeding der te vergeefs gedane
      onkosten; alles onverminderd hunne gehoudenheid jegens de partijen tot schadevergoeding.

      2 Hij kan hen echter op hun verzet bij verzoekschrift, om billijke redenen, van de tegen hen uitgesprokene
      veroordeeling vrijstellen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel33
  - number: '34'
    text: |-
      1 De griffier maakt van de opneming een door de rechtercommissaris en hem te ondertekenen proces-verbaal op.

      2 Hij neemt daarin de verklaringen van de bij de opneming gehoorde personen op, nadat deze verklaringen hun zijn
      voorgelezen en door hen zijn ondertekend.

      3 Voorts neemt hij daarin op de punten, waarover partijen of derde belanghebbenden hebben toegezegd nadere
      inlichtingen te zullen geven of waaromtrent hun door de rechtercommissaris is opgedragen nadere inlichtingen te
      verschaffen. De rechtercommissaris bepaalt de termijn, waarbinnen die inlichtingen moeten zijn verstrekt.

      4 De rechtercommissaris stelt tevens na overleg met de deskundigen de dag vast, waarop de nederlegging ter
      griffie van het deskundigenrapport zal plaats vinden, met dien verstande, dat die dag niet later wordt bepaald
      dan uiterlijk zes maanden na de dag van de opneming. Ingeval de rechtercommissaris een termijn heeft bepaald als
      bedoeld in het vorige lid, wordt die dag niet later bepaald dan uiterlijk zes maanden na afloop van die termijn. In
      het proces-verbaal wordt de dag van de nederlegging vermeld.

      5 De griffier zendt een afschrift van het proces-verbaal van de opneming aan partijen, in het proces-verbaal
      vermelde derde belanghebbenden en deskundigen.

      6 De rechtercommissaris kan één maal op met redenen omkleed verzoek van de deskundigen uitstel van de nederlegging
      toestaan. Hij stelt alsdan een nieuwe dag daarvoor vast, waarvan de griffier bericht zendt aan partijen, derde
      belanghebbenden en deskundigen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel34
  - number: '35'
    text: |-
      1 De deskundigen begroten de schadeloosstellingen overeenkomstig de hun krachtens [artikel 27, eerste lid][ref1],
      verstrekte opdracht. Zij verklaren daarbij de gronden waarop hun begroting rust.

      2 Het rapport van de deskundigen wordt tot aan de in [artikel 37, eerste lid][ref2], bedoelde terechtzitting
      ter inzage van partijen en van derde belanghebbenden ter griffie nedergelegd. Van de nederlegging doet de
      griffier mededeling aan partijen en derde belanghebbenden. Hij geeft daarvan tevens kennis in een of meer door de
      rechtercommissaris aan te wijzen nieuws- of advertentiebladen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel37
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
  - number: '36'
    text: |-
      1 Gedurende vier weken na de dag van de nederlegging, bedoeld in [artikel 35, tweede lid][ref1], kunnen partijen en
      derde belanghebbenden een bezwaarschrift bij de rechtercommissaris indienen.

      2 De griffier zendt onverwijld een afschrift van de bezwaarschriften aan de wederpartij, derde belanghebbenden en
      de deskundigen, die gedurende vier weken na de dag van de toezending een verweerschrift bij de rechtercommissaris
      kunnen indienen.

      3 Indien de rechtercommissaris, na overleg met de deskundigen, zulks in het belang van een goede behandeling van
      de zaak gewenst acht, vindt zo spoedig mogelijk na het verstrijken van de in het voorgaande lid bedoelde termijn
      de behandeling van de ingediende bezwaarschriften en verweerschriften te zijnen overstaan plaats. De griffier roept
      partijen, derde belanghebbenden en de deskundigen op.

      4 De griffier maakt van de behandeling van de bezwaarschriften en de verweerschriften een door de
      rechtercommissaris en hem te ondertekenen proces-verbaal op. De griffier zendt onverwijld een afschrift van het
      proces-verbaal aan partijen, derde belanghebbenden en deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel35
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '35'
        hoofdstuk: III
  - number: 36a
    text: |-
      Indien geen bezwaarschrift is ingediend of indien later blijkt van feitelijke bezwaren, die in het ingediende
      bezwaarschrift niet waren vermeld, dan kan de rechtbank aan later opgekomen bezwaren de betekenis hechten, die zij
      geraden zal achten. Indien haar blijkt dat deze bezwaren berusten op feiten of omstandigheden, die ten tijde van de
      in [artikel 36, eerste lid][ref1], bedoelde termijn niet bekend waren of redelijkerwijs bekend konden zijn, neemt
      zij deze in ieder geval in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel36
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '36'
        hoofdstuk: III
  - number: '37'
    text: |-
      1 In de eerste voor de behandeling van burgerlijke zaken bestemde terechtzitting, welke plaats heeft na verloop
      van vier weken na de dag van de in [artikel 36][ref1] bedoelde zitting, kunnen derde belanghebbenden een conclusie
      nemen en, zowel als partijen, bezwaarschriften, verweerschriften en conclusies nader bij pleidooi ontwikkelen.
      Ingeval geen bezwaarschriften zijn ingediend, zullen de pleidooien plaats vinden uiterlijk zes weken na de dag
      van de nederlegging van het rapport van deskundigen. De griffier roept partijen, derde belanghebbenden zomede
      de deskundigen op om ter terechtzitting aanwezig te zijn, opdat dezen desgevraagd mondelinge toelichting op het
      uitgebrachte advies verstrekken.

      2 Uiterlijk binnen vier weken na de in dit artikel bedoelde terechtzitting doet de rechtbank, indien zij geen
      gebruik heeft gemaakt van de haar in [artikel 194, vijfde lid van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      toegekende bevoegdheid, uitspraak over de onteigening, stelt zij in haar vonnis de schadeloosstellingen vast voor
      de verweerder en de derde belanghebbenden en vermeldt zij tevens de schadeloosstellingen die reeds zijn bepaald
      ingevolge [artikel 27, laatste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel194
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel27
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '36'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '194'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '27'
        hoofdstuk: III
  - number: '38'
    text: |-
      1 Gebouwen, van welke een gedeelte onteigend wordt, moeten, op de vordering des eigenaars bij zijne conclusie, in
      [art. 24][ref1] genoemd, door de onteigenende partij geheel worden overgenomen.

      2 Ditzelfde zal met erven moeten geschieden, wanneer deze door de onteigening tot een vierde hunner uitgestrektheid
      verminderen of kleiner dan tien aren worden.

      3 Deze overneming kan echter niet gevorderd worden, wanneer het overgebleven stuk gronds onmiddellijk aan een ander
      erf van denzelfden eigenaar grenst.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel24
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '24'
        hoofdstuk: III
  - number: '39'
    text: |-
      Bij de berekening der schadevergoeding wordt niet gelet op veranderingen, welke kennelijk zijn tot stand gebracht
      om de schadevergoeding te verhogen; evenmin wordt gelet op veranderingen, tot stand gebracht na terinzagelegging
      als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref1], tenzij het normale of noodzakelijke
      veranderingen betreft die aansluiten bij de aard en de wijze van gebruik van de onroerende zaak ten tijde van die
      nederlegging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:11
  - number: '40'
    text: |-
      De schadeloosstelling vormt een volledige vergoeding voor alle schade, die de eigenaar rechtstreeks en noodzakelijk
      door het verlies van zijn zaak lijdt.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40
  - number: 40a
    text: |-
      Bij het bepalen van de schadeloosstelling wordt uitgegaan van de dag, waarop het vonnis van onteigening, bedoeld
      in [artikel 37, tweede lid][ref1], of [artikel 54][ref2], wordt uitgesproken, met dien verstande, dat ingeval het
      vonnis, bedoeld in [artikel 54][ref3], binnen de in [artikel 54][ref4] bedoelde termijn wordt ingeschreven in de
      openbare registers, wordt uitgegaan van de dag, waarop dit vonnis wordt ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel54t
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel54m
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 54t
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: 54i
        hoofdstuk: IIIa
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0001842
        artikel: 54m
        hoofdstuk: IIIa
        afdeling: '2'
  - number: 40b
    text: |-
      1 De werkelijke waarde van de onteigende zaak, niet de denkbeeldige, die de zaak uitsluitend voor de persoon van de
      rechthebbende heeft, wordt vergoed.

      2 Bij het bepalen van de werkelijke waarde wordt uitgegaan van de prijs, tot stand gekomen bij een onderstelde
      koop in het vrije commerciële verkeer tussen de onteigende als redelijk handelende verkoper en de onteigenaar als
      redelijk handelende koper.

      3 In bijzondere gevallen wordt de werkelijke waarde naar andere maatstaf bepaald.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40b
  - number: 40c
    text: |-
      Bij het bepalen van de schadeloosstelling wegens verlies van een onroerende zaak wordt geen rekening gehouden met
      voordelen of nadelen, teweeggebracht door

      1°. het werk waarvoor onteigend wordt;

      2°. overheidswerken die in verband staan met het werk waarvoor onteigend wordt;

      3°. de plannen voor de werken onder 1° en 2° bedoeld.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40c
  - number: 40d
    text: |-
      1 Bij het bepalen van de prijs van een onroerende zaak wordt rekening gehouden:

      a. met ter plaatse geldende voorschriften en gebruiken betreffende lasten en baten, welke uit de exploitatie van de
      zaak of van een complex, waarvan zij deel uitmaakt, naar verwachting zullen voortvloeien en betreffende de omslag
      daarvan, voor zover een redelijk handelend verkoper en koper hiermee rekening plegen te houden;

      b. met alle bestemmingen die gelden voor zaken, die deel uitmaken van het complex, in dier voege dat elke
      bestemming van een zaak de waardering van alle zaken binnen het complex beïnvloedt.

      2 Onder een complex wordt verstaan de als één geheel in exploitatie gebrachte of te brengen zaken.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40d
  - number: 40e
    text: |-
      Bij het bepalen van de werkelijke waarde van een zaak wordt de prijs verminderd of vermeerderd met voordelen of
      nadelen tengevolge van

      1°. bestemmingen die door het werk waarvoor onteigend wordt, tot uitvoering komen;

      2°. bestemmingen, voor de feitelijke handhaving waarvan onteigend wordt,

      voor zover deze voordelen of nadelen ook na toepassing van [artikel 40][ref1] redelijkerwijze niet of niet geheel
      ten bate of ten laste van de onteigende behoren te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40d
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40e
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 40d
        hoofdstuk: III
  - number: 40f
    text: |-
      Op de prijsvermeerdering bedoeld in artikel 40*e* komt in mindering de vergoeding welke te dier zake op grond van
      [artikel 49 van de Wet op de Ruimtelijke Ordening][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel49
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel40f
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '49'
  - number: '41'
    text: |-
      Bij het bepalen van de schadeloosstelling wordt rekening gehouden met de mindere waarde, welke voor niet onteigende
      goederen van de onteigende het rechtstreeks en noodzakelijk gevolg van het verlies van zijn goed is.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel41
  - number: 41a
    text: |-
      Voor zover de volgende artikelen niet anders meebrengen, zijn de [artikelen 40-41][ref1] van overeenkomstige
      toepassing op rechten die door de onteigening geheel of gedeeltelijk vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel40
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '40'
        hoofdstuk: III
  - number: '42'
    text: |-
      1 Bij de onteigening van verhuurde bedrijfsruimte, als omschreven in
      [artikel 309 lid 5 van Boek 7 van het Burgerlijk Wetboek][ref1], wordt door de onteigenende partij aan de
      huurder en de onderhuurder aan wie bevoegdelijk is onderverhuurd schadeloosstelling betaald. Bij de bepaling
      van de schadeloosstelling wordt rekening gehouden met de kans dat de huurverhouding bij het verstrijken van de
      geldigheidsduur der overeenkomst zou hebben voortgeduurd.

      2 Bij de onteigening van een anderszins verhuurde onroerende zaak wordt door de onteigenende partij aan den
      huurder, wiens huurtijd nog één of meer jaren moet duren, tot schadeloosstelling eene som betaald, gelijkstaande
      aan den huurprijs van twee jaren.

      3 Indien nogtans de te velde staande vruchten, of de onkosten welke de huurder aantoont gedurende de laatste
      twee jaren aan de onroerende zaak te hebben besteed, meer beloopen dan de in het vorige lid bedoelde tweejarige
      huurprijs, wordt de waarde dier vruchten of het bedrag dier onkosten als schadeloosstelling betaald. Indien de
      huurder minder dan een jaar huur had, wordt hem de huurprijs van een vol jaar, of de waarde der te velde staande
      vruchten, zoo die meer beloopt, vergoed.

      4 Indien de verhuring na terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref2],
      heeft plaats gehad, wordt door de onteigenende partij aan den huurder geene schadeloosstelling betaald, maar heeft
      deze eene vordering tot schadevergoeding tegen den verhuurder, ten ware anders mogt zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel311
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 3:11
  - number: 42a
    text: |-
      1 Bij de onteigening van een verpachte onroerende zaak wordt door de onteigenende partij aan de pachter
      schadeloosstelling betaald.

      2 Indien de pachtovereenkomst voor de in
      [artikel 325, eerste of tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1] bedoelde duur is aangegaan of
      geldt, dan wel voor een kortere duur is aangegaan en nadien met zes jaren is verlengd, wordt bij de bepaling
      van de schadeloosstelling rekening gehouden met de mogelijkheid, dat de pachtovereenkomst ingevolge de
      [artikelen 325, vijfde lid][ref2], en [367 tot en met 374 van Boek 7 van het Burgerlijk Wetboek][ref3] zou zijn
      verlengd.

      3 Het bepaalde in het tweede lid vindt geen toepassing, indien de pachtverhouding is aangevangen, nadat aan het
      verpachte bij een goedgekeurd bestemmingsplan een niet tot de landbouw betrekkelijke bestemming is gegeven. In
      dat geval wordt de pachtovereenkomst met betrekking tot een hoeve of los land, welke is aangegaan voor langer
      dan twaalf, onderscheidenlijk zes jaren, voor de bepaling van de schadeloosstelling geacht te zijn aangegaan voor
      twaalf, onderscheidenlijk zes jaren, met dien verstande, dat, indien de onteigening plaats vindt na die termijn, de
      overeenkomst geacht wordt telkens voor zes jaren te zijn verlengd.

      4 Indien evenwel het verpachte sinds een tijdstip, liggend voor de goedkeuring bedoeld in het vorige lid,
      achtereenvolgens bij personen die ten tijde van de opvolging in het gebruik tot de voorgaande gebruiker in enige
      in [artikel 363, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref4] genoemde betrekking stonden persoonlijk
      in gebruik is geweest voor een tot de landbouw betrekkelijk doel, blijft het bepaalde in het tweede lid van
      toepassing.

      5 Indien op het tijdstip van terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref5]
      dan wel de terinzagelegging, bedoeld in [artikel 91][ref6], de pachtovereenkomst ingevolge
      [artikel 322 van Boek 7 van het Burgerlijk Wetboek][ref7] voor onbepaalde tijd geldt, wordt voor de berekening van
      de schadeloosstelling uitgegaan van de overeengekomen duur, doch ingeval de overeenkomst voor onbepaalde tijd is
      aangegaan, nimmer van een langere dan de in [artikel 325, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref8]
      bedoelde duur. Voor de berekening van de schadeloosstelling wordt op gelijke wijze als ten aanzien van
      pachtovereenkomsten, waarop [artikel 9 van de Pachtwet][ref9] niet van toepassing is, aangenomen, dat de
      pachtovereenkomst zou kunnen worden verlengd; het derde en vierde lid vinden overeenkomstige toepassing.

      6 Indien de verpachting na terinzagelegging als bedoeld in [artikel 3:11 van de Algemene wet bestuursrecht][ref10],
      heeft plaats gehad, wordt door de onteigenende partij aan de pachter geen schadeloosstelling betaald, maar heeft
      deze een vordering tot schadevergoeding tegen de verpachter, ten ware anders mocht zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel367
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel363
