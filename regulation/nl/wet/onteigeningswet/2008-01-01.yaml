  - number: '85'
    text: |-
      1 In afwijking in zoverre van het bepaalde in [artikel 80][ref1] kan de gemeenteraad,
      in geval van onteigening ten behoeve van de uitvoering van één of meer ingevolge
      [artikel 13, eerste lid, van de Wet op de Ruimtelijke Ordening][ref2] aangewezen onderdelen van een
      bestemmingsplan, aanstonds tot onteigening besluiten. De [artikelen 83][ref3] en [84, eerste en tweede lid][ref4],
      zijn van overeenkomstige toepassing. Belanghebbenden kunnen gedurende de in [artikel 84, eerste lid][ref5],
      genoemde termijn schriftelijk bij Ons bedenkingen naar voren brengen tegen het raadsbesluit tot onteigening. De in
      [artikel 84, tweede lid][ref6], bedoelde kennisgeving houdt mededeling in van deze bevoegdheid. Het raadsbesluit
      tot onteigening vervalt, indien het niet binnen vier weken na het nemen van dat besluit met de plannen, kaarten en
      grondtekeningen aan Ons is voorgedragen.

      2 De in het voorgaande lid bedoelde bevoegdheid van de gemeenteraad vervalt drie jaar na de dag waarop het
      desbetreffende onderdeel van het bestemmingsplan rechtskracht heeft verkregen.


