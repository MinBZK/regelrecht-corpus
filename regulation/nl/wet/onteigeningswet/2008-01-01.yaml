    text: |-
      1 Ingeval een voorschot of een som als zekerheid is vastgesteld overeenkomstig [artikel 54k][ref1] of een verhoging
      daarvan is vastgesteld overeenkomstig [artikel 54o][ref2], kan het vonnis waarbij zulks is geschied, slechts ten
      uitvoer worden gelegd binnen een tijdvak van twee maanden, te rekenen van de dag, waarop het vonnis kracht van
      gewijsde heeft verkregen.

      2 Ingeval een schadeloosstelling is bepaald overeenkomstig [artikel 54k][ref3] kan het vonnis, waarbij zulks is
      geschied, ten uitvoer worden gelegd, doch niet eerder dan nadat de inschrijving, bedoeld in [artikel 54m][ref4],
      heeft plaats gevonden.


