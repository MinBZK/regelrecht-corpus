        artikel: '73'
  - number: 76b
    text: |-
      Indien degene, onder wien de burgemeester in het vorig artikel genoemde waren in bezit wil nemen, onmiddellijk
      ten genoegen van den burgemeester aanbiedt zelf op door dezen goedgekeurde wijze die waren ter beschikking te
      stellen tegen prijzen, die niet te boven gaan de daarvoor door Onzen voornoemden Minister bepaalde bedragen, kan de
      burgemeester de inbezitneming opschorten.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76b
  - number: 76c
    text: |-
      1 Onze voornoemde Minister kan bepalen, dat de burgemeester bepaalde soorten of hoeveelheden van genoemde waren
      in bezit zal nemen, alsmede dat van in bezit genomen waren gedeelten ter beschikking worden gesteld van den
      burgemeester eener andere gemeente tegen den prijs en op de wijze, door dien Minister te bepalen.

      2 Voldoet de burgemeester niet onmiddellijk hieraan, dan geschiedt de inbezitneming en de terbeschikkingstelling
      van burgemeesters van andere gemeenten door dien Minister.

      3 Alsdan wordt de schadeloosstelling bepaald op de wijze, bij [artikel 76a ter][ref1] geregeld, met dien verstande,
      dat de benoeming der schatters dan steeds geschiedt door dien Minister.

      4 Het vierde en het laatste lid van [artikel 76a ter][ref2] zijn ook in dit geval van toepassing, met dien
      verstande, dat de uitgave komt ten laste van de gemeente, te welker behoeve de waren zijn beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76c
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: 76a_ter
      - id: ref2
        bwb_id: BWBR0001842
        artikel: 76a_ter
  - number: 76e
    text: |-
      1 De burgemeester zoomede de door hem aan te wijzen ambtenaren zijn te allen tijde bevoegd de uitlevering te
      vorderen van de in bezit te nemen waren. Zij, alsmede de hen op hun last vergezellende personen hebben te allen
      tijde vrijen toegang tot alle plaatsen, waar redelijkerwijs vermoed kan worden, dat zich de waren bevinden. Wordt
      hun de toegang geweigerd, dan verschaffen zij zich dien desnoods met inroeping van den sterken arm.

      2 Is de plaats tevens eene woning of alleen door eene woning toegankelijk, dan treden zij deze tegen den wil des
      bewoners niet binnen dan op bijzonderen of algemeenen schriftelijken last van den burgemeester.

      3 Van dit binnentreden wordt door hen procesverbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel76e
  - number: 76f
    text: |-
      In geval, op grond van
      [artikel 7, eerste lid, of 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], bepalingen
      uit de [Oorlogswet voor Nederland][ref2] in werking zijn gesteld, geschieden de machtigingen, bedoeld in
      [artikel 76a ter, eerste lid][ref3], niet dan na overleg met het militair gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
