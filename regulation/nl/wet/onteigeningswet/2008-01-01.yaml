    text: |-
      Indien de verhuring na het tijdstip van de nederlegging, bedoeld in [artikel 91][ref1], heeft plaats gehad, wordt
      door de onteigenende partij aan den huurder geene schadeloosstelling betaald, maar heeft deze eene vordering tot
      schadevergoeding tegen den verhuurder, ten ware anders mogt zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel91
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel95
