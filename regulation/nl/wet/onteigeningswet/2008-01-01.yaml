  - number: 54f
    text: |-
      De onteigenende partij kan, overeenkomstig de bepalingen van deze Afdeling, in de dagvaarding tot onteigening
      een vervroegde uitspraak over de onteigening vorderen. Ingeval de opneming door de deskundigen heeft plaats
      gehad overeenkomstig Afdeling 1 van dit Hoofdstuk, is de onteigenende partij op straffe van niet-ontvankelijkheid
      gehouden tot het doen van die vordering. Zodra het vonnis van onteigening kracht van gewijsde heeft verkregen, kan
      het in de openbare registers worden ingeschreven, voordat over de schadeloosstelling uitspraak is gedaan.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel54f
  - number: 54g
    text: |-
      Onverminderd het bepaalde in de artikelen [62, tweede lid][ref1], [80, laatste lid][ref2], en
      [141 tweede lid][ref3], moet de dagvaarding waarbij de vervroegde uitspraak tot onteigening wordt gevorderd, indien
      de opneming door de deskundigen overeenkomstig [Afdeling 1 van dit Hoofdstuk][ref4] heeft plaats gevonden, worden
      uitgebracht binnen twee maanden na de opneming ter plaatse door de deskundigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel141
      [ref4]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
