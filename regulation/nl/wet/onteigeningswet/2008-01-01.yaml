  - number: 54t
    text: |-
      1 Op de procesgang, bedoeld in deze Afdeling, zijn, nadat het rapport van deskundigen ter inzage is nedergelegd,
      de [artikelen 35][ref1], [36][ref2], [36a][ref3], [37, eerste lid][ref4], [38-54][ref5] van overeenkomstige
      toepassing.

      2 [Artikel 37, tweede lid][ref6], is van overeenkomstige toepassing, met dien verstande, dat de rechtbank haar
      uitspraak beperkt tot de aan de verweerders en derde belanghebbenden uit te keren schadeloosstellingen, met dien
      verstande, dat zij tevens in haar vonnis de schadeloosstellingen vermeldt, die reeds zijn bepaald ingevolge de
      [artikelen 54i, tweede lid, laatste zin][ref7], en [54k, derde lid][ref8].

      3 Voor zover de rechtbank bij het vonnis, bedoeld in het vorige lid, van oordeel mocht zijn, dat iemand ten
      gevolge van de betaling van voorschotten, meer heeft ontvangen dan hem als schadeloosstelling toekomt, zal zij de
      betrokkene veroordelen tot terugbetaling van het te veel ontvangen bedrag aan de onteigenende partij.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel35
