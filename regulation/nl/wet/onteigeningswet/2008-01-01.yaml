  - number: 54m
    text: |-
      1 Ingeval de opneming door de deskundigen volgens [artikel 54j, eerste of derde lid][ref1], plaats vindt, kan het
      vonnis, waarbij overeenkomstig [artikel 54 i][ref2] de onteigening is uitgesproken, slechts worden ingeschreven in
      de openbare registers binnen een tijdvak van twee maanden na de opneming door de deskundigen.

      2 Ingeval de opneming door de deskundigen reeds heeft plaats gevonden overeenkomstig
      [Afdeling 1 van dit Hoofdstuk][ref3], vangt de termijn van twee maanden aan op de dag, dat het vonnis, bedoeld in
      [artikel 54i][ref4], gezag van gewijsde heeft verkregen.

      3 Wanneer na het vonnis van onteigening een voorschot krachtens [artikel 54i][ref5] is bepaald, vangt de termijn
      aan op het tijdstip waarop dat latere vonnis gezag van gewijsde heeft verkregen.

      4 Vindt geen inschrijving plaats binnen de termijn, bedoeld in de vorige leden, dan geldt het bepaalde in de
      [artikelen 55, tweede lid][ref6], of [59][ref7].


