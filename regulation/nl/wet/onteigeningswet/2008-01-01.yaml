    text: |-
      1 De terinzagelegging van het raadsbesluit overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] geschiedt gelijktijdig met de
      voordracht aan Ons.

      2 De ingevolge [artikel 3:44 van de Algemene wet bestuursrecht][ref2] verplichte kennisgeving houdt mededeling in
      van de in het derde lid bedoelde bevoegdheid.

      3 Gedurende zes weken vanaf het tijdstip van terinzagelegging kunnen belanghebbenden, die tijdig hun zienswijze
      bij de gemeenteraad naar voren hebben gebracht, schriftelijk bij Ons bedenkingen naar voren brengen tegen het
      raadsbesluit tot onteigening.


