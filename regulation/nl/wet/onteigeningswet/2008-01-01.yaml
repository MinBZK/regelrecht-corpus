  - number: 54c
    text: |-
      1 De rechtbank beschikt binnen een maand op het verzoek. Indien de in [artikel 54][ref1] en [54][ref2] vereiste
      stukken niet volledig zijn overgelegd of niet ingezonden, stelt de rechtbank een termijn van ten hoogste twee weken
      vast, waarbinnen de onteigenende partij alsnog tot aanvulling van die stukken kan overgaan, bij gebreke waarvan
      afwijzend op het verzoek wordt beschikt.

      2 Bij toewijzing van het verzoek benoemt de rechtbank een harer leden tot rechtercommissaris alsmede een of
      meer deskundigen in oneven getale. Zonodig benoemt zij tevens een derde, bedoeld in [artikel 20][ref3]. De
      rechtercommissaris bepaalt met de meest mogelijke spoed de tijd en de plaats waarop de opneming door deskundigen
      zal plaats vinden.

      3 Tegen de beschikking staan alleen aan de verzoeker de rechtsmiddelen van hoger beroep en beroep in cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54a
