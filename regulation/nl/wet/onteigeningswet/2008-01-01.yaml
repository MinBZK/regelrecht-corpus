  - number: 54l
    text: |-
      1 Tegen het vonnis, waarbij overeenkomstig [artikel 54i][ref1] de onteigening is uitgesproken of waarbij nadien een
      voorschot is vastgesteld, staat het rechtsmiddel open van beroep in cassatie. De [artikelen 52][ref2] en [53][ref3]
      zijn van overeenkomstige toepassing, met dien verstande, dat de in [artikel 53, eerste lid][ref4], genoemde termijn
      slechts twee weken bedraagt.

      2 Tegen het vonnis, of de beschikking, bedoeld in [artikel 54k][ref5], staat geen andere voorziening open dan
      beroep in cassatie in het belang der wet.


