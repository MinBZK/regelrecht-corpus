  - number: 54n
    text: |-
      1 Ter inschrijving van het vonnis waarbij de onteigening overeenkomstig [artikel 54][ref1] is uitgesproken, wordt
      overgelegd:

      1. indien bij een later vonnis krachtens [artikel 54][ref2] een voorschot is bepaald, dat vonnis vergezeld van een
      verklaring van de griffier houdende dat het in kracht van gewijsde is gegaan;

      2. een afschrift van het proces-verbaal van de opneming door de deskundigen, tenzij
      [Afdeling 1 van dit Hoofdstuk][ref3] toepassing heeft gevonden;

      3. bewijzen van betaling van de bij vonnis, bedoeld in [artikel 54][ref4] aan de in de dagvaarding genoemde
      rechthebbenden, of indien overeenkomstig [artikel 20][ref5] een derde is benoemd, aan die derde, toegekende
      voorschotten en tevens, indien geen afstand van het recht op zekerheidstelling is gedaan, de akten, strekkende tot
      bewijs dat de zekerheidstelling heeft plaats gehad, of de bewijzen van betaling der schadeloosstellingen, bepaald
      ingevolge [artikel 54][ref6].

      2 Ten aanzien van de gevolgen van de in het vorige artikel bedoelde inschrijving gelden de
      [artikelen 59, derde lid][ref7], en [60][ref8].


