  - number: '123'
    text: |-
      De [artikelen 63, eerste, tweede en vierde lid][ref1], [64][ref2], [64a][ref3] en [64b][ref4] zijn van toepassing,
      met dien verstande dat gedeputeerde staten van de provincie die het inrichtingsplan hebben vastgesteld, toepassing
      geven aan [afdeling 3.4 van de Algemene wet bestuursrecht][ref5], en dat in [artikel 63, vierde lid][ref6],
      telkens in plaats van «Onze Minister» wordt gelezen «gedeputeerde staten», terwijl in de slotzin van
      [artikel 63, vierde lid][ref7], in plaats van «kan» wordt gelezen «kunnen».


