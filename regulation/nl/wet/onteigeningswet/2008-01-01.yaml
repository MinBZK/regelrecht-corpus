  - number: '66'
    text: |-
      1 Bij gebreke van minnelijke schikking benoemt de arrondissementsregtbank, in het geval van het voorgaande artikel,
      op het verzoekschrift hetzij van hem, die onteigent, of van den eigenaar van den grond, een of meer deskundigen, in
      oneffen getale, om een berigt over de schadeloosstelling te geven.

      2 Het verzoekschrift moet, op straffe van verval, worden ingediend binnen den termijn, bepaald bij het in
      [artikel 65][ref1] bedoelde besluit. Bij het verzoekschrift moet worden overgelegd een exemplaar van de
      *Staatscourant* en van het nieuws- of advertentieblad, waarin Ons besluit, dan wel dat van Gedeputeerde Staten of
      van een der andere collegien of besturen is openbaar gemaakt.

      3 De regtbank benoemt één harer leden, om als commissaris, vergezeld van den griffier, bij de opneming door de
      deskundigen tegenwoordig te zijn.

      4 Zij bepaalt tevens den dag en de plaats, waar en wanneer die opneming zal geschieden. Ten minste twee maal vier
      en twintig uren te voren wordt dit aan de wederpartij beteekend en afschrift van het exploit ter griffie van de
      regtbank nedergelegd. Bij gebreke dier beteekening vervalt het vonnis.

      5 Het vonnis wordt aan het gebouw der regtbank aangeplakt, en de griffier roept de deskundigen op.

      6 Derde belanghebbenden kunnen bij die opneming tegenwoordig zijn, ten einde ook hunne schade te doen begrooten.

      7 De regtercommissaris bepaalt bij de opneming door de deskundigen, den dag, waarop hij zijn rapport aan de
      regtbank zal uitbrengen. Deze dag wordt aan de wederpartij beteekend, zoo zij niet is verschenen bij de opneming
      door de deskundigen en afschrift van het exploit ter griffie nedergelegd. Inmiddels liggen het procesverbaal van
      den regtercommissaris en het advies der deskundigen op de griffie ter lezing.

      8 Op den bepaalden dag nemen, na het rapport van den regtercommissaris, partijen en derde belanghebbenden hunne
      conclusien, welke zij, mits op dezelfde teregtzitting, bij pleidooi breeder kunnen ontwikkelen.

      9 De regtbank beslist terstond of op de eerstvolgende teregtzitting.

      10 Geenerlei andere formaliteiten behoeven hier in acht te worden genomen.

      11 Tegen het vonnis, waarbij de onteigening is uitgesproken, wordt noch verzet, noch hooger beroep, noch beroep in
      cassatie toegelaten.

      12 De [artikelen 20][ref2], [24, laatste lid][ref3], [29][ref4], [33][ref5], [34, eerste en tweede lid][ref6], en
      [35, eerste lid][ref7], vinden op de rechtsvordering, in dit artikel omschreven, overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel24
