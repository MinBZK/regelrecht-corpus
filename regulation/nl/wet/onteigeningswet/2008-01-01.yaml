  - number: '4'
    text: |-
      1 Wanneer op een onroerende zaak, die toebehoort aan de onteigenende partij, een recht van opstal, erfpacht,
      vruchtgebruik, gebruik, bewoning of beklemming rust, kan dat recht afzonderlijk worden onteigend.

      2 Overigens kan door toepassing van deze wet een zaak slechts worden bevrijd van de met betrekking tot de zaak
      bestaande lasten en rechten door onteigening van die zaak.

      3 Een aandeel in een zaak of een recht kan niet afzonderlijk worden onteigend.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel4
  - number: '17'
    text: De onteigenende partij tracht hetgeen onteigend moet worden bij minnelijke overeenkomst te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel17
  - number: '18'
    text: |-
      1 Is hetgeen onteigend moet worden niet bij minnelijke overeenkomst verkregen, dan dagvaardt de onteigenende partij
      de bij koninklijk besluit aangewezen eigenaar voor de rechtbank in welker rechtsgebied de te onteigenen onroerende
      zaak is gelegen, teneinde de onteigening te horen uitspreken en het bedrag der schadeloosstelling te horen bepalen.
      Betreft de onteigening een recht, dan wordt zij ingesteld tegen de bij koninklijk besluit aangewezen rechthebbende;
      van deze vordering wordt kennisgenomen door de rechtbank binnen welker rechtsgebied de onroerende zaak is gelegen
      waarop het recht rust.

      2 Wanneer de arrondissementsregtbank op grond van het voorgaande bevoegd is van een deel van de vordering kennis te
      nemen, is zij bevoegd van de geheele vordering kennis te nemen.

      3 Bij onteigening van een onroerende zaak waarop blijkens de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], een eeuwigdurende erfpacht of een beklemrecht
      rust, worden ook de erfpachter of de beklemde meier gedagvaard.

      4 De dagvaarding wordt betekend aan degenen die als houder van op het te onteigenen goed rustende hypotheken
      in de openbare registers bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2] zijn
      ingeschreven en aan de in die registers ingeschreven beslagleggers op het te onteigenen goed.

      5 Aan de derde belanghebbenden, als bedoeld in [artikel 3, tweede lid][ref3], voor zover deze aan de onteigenende
      partij bekend zijn of behoren te zijn, wordt de dagvaarding betekend dan wel wordt een afschrift van de dagvaarding
      gezonden bij aangetekende brief, waarvoor een bericht van ontvangst wordt verlangd. Ten aanzien van een huurder van
      woonruimte, als bedoeld in [artikel 233 van Boek 7 van het Burgerlijk Wetboek][ref4], kan in de aangetekende brief
      worden volstaan met de mededeling van de uitgebrachte dagvaarding en van het daarin vervatte aanbod, voor zover dit
      op hem betrekking heeft. Voorts wordt mededeling gedaan van voorzieningen die de onteigenende partij voornemens is
      jegens hem te treffen.

      6 De betekening of de verzending van de aangetekende brief geschiedt binnen een week na het uitbrengen van de
      dagvaarding.

      7 Betekening of toezending bij aangetekende brief vindt niet plaats aan degenen die op grond van het derde lid van
      dit artikel zijn gedagvaard.

      8 In het exploit van betekening van de dagvaarding aan de derde belanghebbende of in de aangetekende brief wordt
      vermeld op welke wijze zij, desgewenst, in het geding van onteigening kunnen tussenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel3
