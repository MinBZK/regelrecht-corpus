  - number: 64a
    text: |-
      1 Het koninklijk besluit wordt genomen binnen zes maanden na afloop van de termijn gedurende welke de stukken
      ingevolge [artikel 3:11, vierde lid, van de Algemene wet bestuursrecht][ref1] ter inzage hebben gelegen.

      2 Het besluit wordt in ieder geval bekendgemaakt aan de onteigenende partij en, zo mogelijk, aan de in
      [artikel 64][ref2] bedoelde eigenaren en andere rechthebbenden.

      3 Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant. Terinzagelegging ingevolge
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref3] vindt tevens plaats op de
      secretarie van de betrokken gemeente. De kennisgeving van het besluit vindt tevens plaats in een of meer dag-,
      nieuws-, of huis-aan-huisbladen die in de gemeente verspreid worden, onder vermelding van datum en nummer van het
      koninklijk besluit en van de Staatscourant waarin het besluit is geplaatst. Een en ander geschiedt op kosten van
      hen, te wier name het werk wordt uitgevoerd.

      4 Het koninklijk besluit tot onteigening vervalt, indien de onteigenende partij niet binnen twee jaar na
      dagtekening van het koninklijk besluit de eigendom bij minnelijke overeenkomst heeft verkregen overeenkomstig
      [artikel 17][ref4], of de eigenaren, in het onteigeningsbesluit aangewezen, voor de rechtbank, in welker
      rechtsgebied de onroerende zaken waarop de onteigening betrekking heeft zijn gelegen, heeft doen dagvaarden
      overeenkomstig [artikel 18][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel311
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel344
