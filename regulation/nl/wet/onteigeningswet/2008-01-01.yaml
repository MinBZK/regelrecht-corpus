  - number: 54a
    text: |-
      1 De onteigenende partij, die voornemens is de procedure van [Afdeling 2][ref1] van dit Hoofdstuk te volgen,
      kan zodra de nederlegging, bedoeld in [artikel 12][ref2], heeft plaats gevonden, aan de rechtbank voor wie de
      onteigening zal moeten worden gevorderd, verzoeken om de benoeming van een rechtercommissaris en van een of meer
      deskundigen in oneven getale, alsmede tot bepaling van de dag, waarop de opneming door de deskundigen van de
      ligging en gesteldheid der onroerende zaken, waarop de onteigening betrekking heeft, zal plaatsvinden.

      2 Bij het verzoekschrift moeten worden overgelegd:

      a. een uitgewerkt plan met uitvoerige kaarten van het werk en met grondtekeningen, waarop de te onteigenen
      onroerende zaken en de onroerende zaken waarop te onteigenen rechten rusten, met vermelding van hun kadastrale
      aanduiding zijn aangewezen;

      b. een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:

      1°. de grootte volgens de basisregistratie kadaster van elk der desbetreffende percelen en, indien een te
      onteigenen onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;

      2°. de namen van de eigenaars van elk dier zaken, volgens de basisregistratie kadaster;

      c. bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref3], een lijst van de te onteigenen
      rechten met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de
      rechthebbenden op die rechten volgens de basisregistratie kadaster;

      d. de bewijzen, bedoeld in [artikel 23, onder 2° en 3°][ref4];

      e. een opgave van de hypotheekhouders of van hen, die beslag hebben gelegd met betrekking tot hetgeen onteigend
      moet worden, voor zover zij zijn vermeld in de openbare registers.

      3 Het verzoekschrift bevat een opgave van de kadastrale aanduiding alsmede een omschrijving van de aard van hetgeen
      onteigend moet worden, benevens een opsomming van de namen en adressen van degenen die volgens de basisregistratie
      kadaster daarop enig recht hebben, alsmede van ieder, die aan de onteigenende partij op het tijdstip van de
      indiening van het verzoekschrift als derde belanghebbende, als bedoeld in [artikel 3, tweede lid][ref5], bekend is,
      onder vermelding van de bedragen, welke de onteigenende partij aan ieder van hen voornemens is bij dagvaarding aan
      te bieden.

      4 Het verzoekschrift bevat tevens indien daartoe termen zijn een verzoek tot benoeming van een derde, bedoeld in
      [artikel 20][ref6]. Tevens kan de onteigenende partij in het verzoekschrift een voorkeur uitspreken met betrekking
      tot het tijdvak, waarin de hiervoor bedoelde opneming zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#HoofdstukIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0001842#Artikel20
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel54a
