  - number: '77'
    text: |-
      1 Onteigening ten name van de gemeente, van een ander publiekrechtelijk lichaam of van een rechtspersoon met
      volledige rechtsbevoegdheid, toegelaten ingevolge [artikel 70][ref1] of [70j van de Woningwet][ref2], kan
      plaatsvinden:

      1°. ten behoeve van de uitvoering van of ter handhaving van de feitelijke toestand overeenkomstig een
      bestemmingsplan;

      2°. ten behoeve van de uitvoering

      a. van een bouwplan in het belang van de volkshuisvesting of van een bouwplan voor het stichten van gebouwen en
      openbaar nut in het belang van de ruimtelijke ontwikkeling of

      b. van een bouwplan, dan wel een plan van werken, geen bouwwerken zijnde, of een plan van werkzaamheden in het
      belang van de vernieuwing van een bebouwde kom of

      c. van een bouwplan, dan wel een plan van werken, geen bouwwerken zijnde, of een plan van werkzaamheden
      voor het opheffen van ernstig achterstallig onderhoud in het belang van de volkshuisvesting, mits een hierop
      betrekking hebbend besluit op grond van [artikel 13 van de Woningwet][ref3] dan wel een besluit tot toepassing
      van bestuursdwang of oplegging van een last onder dwangsom wegens overtreding van het bepaalde bij of krachtens
      [artikel 1a][ref4], [1b][ref5], [7b][ref6] of [13 van de Woningwet][ref7] onherroepelijk is geworden, een en ander
      mits gedeputeerde staten vooraf hebben verklaard tegen dat plan geen bezwaar te hebben;

      3°. ten behoeve van de uitvoering van een bouwwerk, indien met die uitvoering niet binnen een ingevolge
      [artikel 27, eerste lid, van de Wet op de stads- en dorpsvernieuwing][ref8] gestelde of verlengde termijn een begin
      is gemaakt, dan wel indien voor dat bouwwerk niet binnen de in [artikel 28 van die wet][ref9] gestelde termijn een
      bouwvergunning is aangevraagd;

      4°. ten behoeve van de ontruiming van oppervlakten in het belang van de volkshuisvesting;

      5°. ten behoeve van de verwijdering van een of meer ontruimde, onbewoonbaar verklaarde woningen of van een of meer
      niet meer in gebruik zijnde andere gebouwen, indien deze woningen of gebouwen dermate in verval zijn geraakt of
      verminkt, dat zij de omgeving in ernstige mate ontsieren;

      6°. ten behoeve van de uitvoering van een project of een categorie van projecten als bedoeld in
      [artikel 39a, eerste lid, van de Wet op de Ruimtelijke Ordening][ref10], alsmede van voorzieningen die met de
      uitvoering van een zodanig project of een zodanige categorie van projecten rechtstreeks verband houden;

      7°. van een gebouw als bedoeld in [artikel 14 van de Woningwet][ref11] ten behoeve van de handhaving van de
      openbare orde rond dat gebouw of van de [artikelen 2][ref12] en [3 van de Opiumwet][ref13] in zodanig gebouw,
      indien de uitoefening van de bevoegdheden, bedoeld in [artikel 14, eerste lid, van de Woningwet][ref14],
      geen uitzicht heeft geboden op een duurzaam herstel van de openbare orde rond dat gebouw welke is verstoord
      door gedragingen in het gebouw, onderscheidenlijk het duurzaam achterwege blijven van een overtreding van
      [artikel 2][ref15] of [3 van de Opiumwet][ref16] in dat gebouw;

      8°. van een gebouw, een open erf of een terrein als bedoeld in [artikel 97 van de Woningwet][ref17] ten behoeve van
      het opheffen van een overtreding als bedoeld in dat artikel, indien de toepassing van de bevoegdheden, bedoeld in
      [artikel 14, eerste lid, van de Woningwet][ref18], geen uitzicht heeft geboden op het duurzaam achterwege blijven
      van een zodanige overtreding.

      2 In dit artikel wordt verstaan onder

      bouwplan: een project tot het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen alsmede het
      vergroten van een of meer bouwwerken;

      plan van werken, geen bouwwerken zijnde: een project tot het aanleggen, het geheel of gedeeltelijk vernieuwen of
      veranderen alsmede het vergroten van een of meer werken, geen bouwwerken zijnde;

      plan van werkzaamheden: een project tot het verrichten van een of meer werkzaamheden.

      Een bouwplan kan mede een plan van werken, geen bouwwerken zijnde, of een plan van werkzaamheden omvatten; een plan
      van werken, geen bouwwerken zijnde, kan mede een plan van werkzaamheden omvatten.

      3 Op de voorbereiding van de in het eerste lid, onder 2*o*, bedoelde verklaring van geen bezwaar van gedeputeerde
      staten is [afdeling 3.4 van de Algemene wet bestuursrecht][ref19] van toepassing.

      4 Burgemeester en wethouders geven toepassing aan de
      [artikelen 3:11 tot en met 3:18 van de Algemene wet bestuursrecht][ref20].

      5 Het plan wordt met de schriftelijk naar voren gebrachte zienswijzen en het verslag, bedoeld in
      [artikel 3:17 van de Algemene wet bestuursrecht][ref21], aan gedeputeerde staten toegezonden. Gedeputeerde staten
      beslissen, de bij besluit van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer daartoe
      aangewezen ambtenaar gehoord, binnen drie maanden na de dag waarop zij het plan hebben ontvangen, omtrent de
      verklaring van geen bezwaar. Gedeputeerde staten kunnen de verklaring van geen bezwaar weigeren wegens strijd met
      het belang van een goede ruimtelijke ontwikkeling.

      6 In de in het eerste lid genoemde gevallen geschiedt de onteigening overeenkomstig de volgende artikelen.


