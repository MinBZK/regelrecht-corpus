  - number: '102'
    text: |-
      1 Bij de berekening der schadevergoeding wordt niet gelet op licenties, verkregen nadat het wetsvoorstel tot
      onteigening is ingediend.

      2 Het deel der schadevergoeding, dat den licentiehouders toegewezen is, wordt door den Staat te hunner beschikking
      gehouden.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel102
  - number: '103'
    text: |-
      1 Het vonnis van onteigening vervalt indien niet, binnen zes maanden nadat het in kracht van gewijsde is gegaan, de
      schadeloosstelling is betaald of geconsigneerd.

      2 Op vertoon van duplicaten der quitantiën of der bewijzen van consignatie, tijdig opgemaakt, wordt het vonnis
      ingeschreven in de openbare registers van het in [artikel 98, tweede lid][ref1], bedoelde bureau en vermeld in het
      in [art. 98][ref2] bedoelde blad.

      3 Door de inschrijving gaat het octrooi over op den Staat, vrij van alle met betrekking tot het octrooi bestaande
      lasten en rechten. Voor zoover het octrooi niet ten dienste van vloot of leger is onteigend om eigendom van den
      Staat te worden, vervalt het.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '98'
  - number: 104A
    text: |-
      1 Door Ons kan de wenschelijkheid van onteigening worden uitgesproken van de rechten, uit eene octrooi-aanvrage
      voortvloeiende. Afschrift van Ons desbetreffend besluit wordt aan het in [artikel 98, tweede lid][ref1], bedoelde
      bureau toegezonden.

      2 Het in [artikel 98, tweede lid][ref2], bedoelde bureau wijst onverwijld na ontvangst van het afschrift, in
      het 1ste lid bedoeld, drie deskundigen aan die, bij gemotiveerd rapport, zoo spoedig mogelijk het bedrag der
      schadeloosstelling zullen vaststellen, dat den aanvrager bij onteigening zal worden uitgekeerd. Alvorens hun
      onderzoek aan te vangen leggen de deskundigen bij het in [artikel 98, tweede lid][ref3], bedoelde bureau eene
      belofte tot volledige geheimhouding af. Het rapport wordt bij het in [artikel 98, tweede lid][ref4], bedoelde
      bureau ingediend en door dezen onverwijld aan Ons aangeboden.

      3 Binnen één maand na ontvangst van het rapport, in het voorgaande lid bedoeld, zal door Ons, òf de onteigening
      ten behoeve van den Staat worden uitgesproken, nadat de aldus vastgestelde schadeloosstelling aan den aanvrager
      zal zijn betaald of geconsigneerd, òf worden besloten, dat er, gelet op het in het 2de lid bedoelde rapport, tot
      onteigening geen aanleiding bestaat; van het besluit zal het in [artikel 98, tweede lid][ref5], bedoelde bureau ten
      spoedigste afschrift worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel98
      [ref5]: https://wetten.overheid.nl/BWBR0001842#Artikel98
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel104A
