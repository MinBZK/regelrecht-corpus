  - number: '60'
    text: |-
      Waterschaps- en soortgelijke lasten en alle belastingen, hoe ook genaamd, waarmede het onteigende goed is bezwaard
      of die daarvan worden betaald, gaan van de dag, waarop de in [artikel 59][ref1] bedoelde inschrijving heeft plaats
      gehad, op de onteigenende partij over.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel59
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '59'
        hoofdstuk: IV
  - number: '61'
    text: |-
      Indien, tengevolge van oorzaken, welke de onteigenende partij in staat was uit de weg te ruimen, met het werk
      waartoe werd onteigend, niet binnen drie jaar nadat het vonnis van onteigening kracht van gewijsde heeft verkregen,
      een aanvang is gemaakt, of de arbeid meer dan drie jaren mocht zijn gestaakt, of indien uit andere omstandigheden
      is aan te tonen, dat het werk blijkbaar niet tot stand zal worden gebracht, kan de onteigende partij, te harer
      keuze, hetzij bij de rechter het afgestane terugvorderen in de toestand, waarin het zich alsdan bevindt, onder
      gehoudenheid om, in evenredigheid tot de terugontvangen waarde, de schadeloosstelling terug te geven hetzij een
      vordering indienen tot uitkering van een door de rechter naar billijkheid te bepalen schadeloosstelling boven de
      reeds genotene.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel61
  - number: '62'
    text: |-
      Onteigening van onroerende zaken of rechten ten behoeve van aanleg, het herstel, versterking of onderhoud van
      waterkeringen of bouw van militaire verdedigingswerken, heeft plaats uit kracht van een koninklijk besluit, de Raad
      van State gehoord.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel62
  - number: '63'
    text: |-
      1 Op de voorbereiding van de beslissing tot onteigening is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]
      van toepassing.

      2 Terinzagelegging geschiedt tevens ter secretarie van de gemeente waar de betrokken onroerende zaken zijn gelegen.
      In ieder geval worden ter inzage gelegd:

      1°. een uitgewerkt plan met uitvoerige kaarten en met grondtekeningen waarop de te onteigenen onroerende zaken,
      en bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref2], de onroerende zaken waarop de te
      onteigenen rechten rusten, met vermelding van hun kadastrale aanduiding zijn aangewezen;

      2°. een lijst van te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van:

      a. de grootte volgens de basisregistratie kadaster van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;

      b. de namen van de eigenaars van elk dier zaken, volgens de basisregistratie kadaster;

      3°. bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref3], een lijst van de te onteigenen
      rechten met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de
      rechthebbenden op die rechten volgens de basisregistratie kadaster.

      3 Mondelinge zienswijzen kunnen naar voren worden gebracht bij Onze Minister wie het aangaat.

      4 Alvorens omtrent het verzoek tot onteigening wordt beslist, worden degenen, die tijdig ingevolge
      [artikel 3:15, eerste of tweede lid, van de Algemene wet bestuursrecht][ref4] een zienswijze naar voren hebben
      gebracht, door Onze Minister in de gelegenheid gesteld zich te doen horen. Zo nodig kan Onze Minister ook andere
      belanghebbenden in de gelegenheid stellen zich te doen horen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel315
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel63
