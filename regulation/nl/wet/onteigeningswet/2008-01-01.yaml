  - number: '89'
    text: |-
      Ten minste drie dagen vóór de verschijning legt de onteigenende partij tot staving van haren eisch ter griffie van
      de regtbank over:

      a. indien de gemeenteraad tot onteigening heeft besloten:

      1°. een exemplaar van de *Staatscourant*, waarin Ons besluit met het daarbij goedgekeurd raadsbesluit ingevolge
      [artikel 86, derde lid][ref1], is geplaatst;

      2°. een door de burgemeester afgegeven bewijs, dat de [artikelen 80][ref2] en [84][ref3] zijn of, indien de
      gemeenteraad tot onteigening heeft besloten overeenkomstig [artikel 85][ref4], [artikel 84][ref5] is nageleefd;

      b. indien tot onteigening is besloten overeenkomstig het bepaalde in [artikel 87][ref6]:

      een exemplaar van de Staatscourant, waarin is geplaatst Ons besluit, waarbij de te onteigenen onroerende zaken en
      rechten worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel86
