  - number: 54k
    text: |-
      1 Indien bij de opneming door de deskundigen, die plaats vindt volgens [artikel 54j, eerste of derde lid][ref1],
      blijkt van het bestaan van derde belanghebbenden, die niet in de dagvaarding waren vermeld, draagt de
      rechtercommissaris op hun verzoek aan de onteigenende partij op om binnen een maand, op een door de
      rechtercommissaris aan te wijzen terechtzitting, alsnog een aanbod terzake van de schadeloosstelling aan die derde
      belanghebbenden te doen, mits hun hoedanigheid niet wordt betwist.

      2 Dit aanbod geschiedt bij akte ter rolle. De rechtbank doet bij vonnis uitspraak over het toe te kennen voorschot,
      in elk geval binnen een maand na afloop van de termijn, bedoeld in [artikel 54m][ref2]. Het bedrag van het
      voorschot wordt bepaald op het bedrag, waarover overeenstemming blijkt te bestaan blijkens door de betrokkenen
      ondertekende bewijsstukken. Indien niet blijkt van deze overeenstemming bepaalt de rechtbank het voorschot
      op 90 ten honderd van het bij akte gedane aanbod. Zonodig stelt de rechtbank een nieuwe datum vast, waarop de
      nederlegging van het deskundigenrapport zal moeten plaatsvinden. De griffier draagt zorg, dat deze nieuwe datum ter
      kennis wordt gebracht van partijen, derde belanghebbenden en deskundigen.

      3 Ingeval de derde belanghebbende, in het geding tussengekomen, een akte heeft genomen, houdende aanvaarding van
      het aanbod, bepaalt de rechtbank geen voorschot en stelt zij de schadeloosstelling voor de betrokkene vast op de
      som van dat aanvaarde aanbod.

      4 De rechtbank kent slechts een voorschot, als bedoeld in het tweede lid, toe, indien de betrokken belanghebbende
      heeft aangetoond, dat het vonnis, waarbij overeenkomstig [artikel 54i][ref3] de onteigening is uitgesproken,
      in de openbare registers is ingeschreven. Is dit vonnis niet binnen de in [artikel 54m][ref4] bedoelde termijn
      ingeschreven, dan wijst de rechtbank het verzoek af. Tenzij blijkt uit het proces-verbaal van de opneming door
      de deskundigen, dat de betrokkene afstand heeft gedaan van het recht op zekerheidstelling, bepaalt de rechtbank
      overeenkomstig [artikel 54i][ref5] de som als zekerheid voor de voldoening der schadeloosstelling. Tevens stelt zij
      de wijze vast waarop de zekerheidstelling zal plaats vinden.

      5 Ingeval echter de rechtercommissaris de zaak daarvoor vatbaar acht en de onteigenende partij of derde
      belanghebbende daartegen geen bezwaar heeft, bepaalt de rechtercommissaris zelf het bedrag van het voorschot
      tijdens de opneming door de deskundigen, na dezen mondeling te hebben gehoord. Eveneens stelt hij in dat geval
      na de deskundigen mondeling te hebben gehoord voor de betrokkene de som vast als zekerheid voor de voldoening der
      schadeloosstelling, tenzij de betrokkene afstand van het recht op zekerheidstelling doet. Indien geen afstand van
      het recht op zekerheidstelling is gedaan, bepaalt hij tevens de wijze waarop de zekerheidstelling zal plaatsvinden.
      De onteigenende partij is slechts gehouden tot betaling van het ingevolge dit lid toegekende voorschot, nadat
      het vonnis, bedoeld in [artikel 54i][ref6], binnen de in [artikel 54m, eerste lid][ref7], bedoelde termijn is
      ingeschreven in de openbare registers. Het proces-verbaal van de opneming levert een voor tenuitvoerlegging
      vatbare titel op; tot tenuitvoerlegging kan slechts gedurende een tijdvak van een maand na afloop van de in
      [artikel 54m, eerste lid][ref8], genoemde termijn worden overgegaan.


