  - number: '91'
    text: |-
      Bij de berekening der schadevergoeding wordt niet gelet op veranderingen, welke kennelijk zijn tot stand
      gebracht om de schadevergoeding te verhogen; evenmin wordt gelet op veranderingen, tot stand gebracht na de
      terinzagelegging van de in [artikel 80][ref1] juncto [artikel 3:11 van de Algemene wet bestuursrecht][ref2]
      of de in [artikel 87][ref3] bedoelde bescheiden dan wel, indien de gemeenteraad tot onteigening heeft besloten
      overeenkomstig [artikel 85][ref4], na de terinzagelegging, bedoeld in [artikel 84][ref5], tenzij het normale of
      noodzakelijke veranderingen betreft die aansluiten bij de aard en de wijze van gebruik van de onroerende zaak ten
      tijde van die terinzagelegging.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel80
