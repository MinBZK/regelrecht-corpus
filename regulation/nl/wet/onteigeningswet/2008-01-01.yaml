      1 De gestelde zekerheid vervalt, wanneer de in [artikel 54][ref1] bedoelde termijn is verstreken, zonder dat de
      onteigenende partij van de haar toekomende bevoegdheid tot inschrijving gebruik heeft gemaakt.

      2 Zij vervalt voorts, wanneer de bij onherroepelijk vonnis vastgestelde som der schadeloosstelling is betaald of
      aangeboden en geconsigneerd.


