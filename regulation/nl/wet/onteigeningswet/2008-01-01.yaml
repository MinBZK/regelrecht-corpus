  - number: 54j
    text: |-
      1 Bij het vonnis, waarbij overeenkomstig [artikel 54i][ref1] de onteigening is uitgesproken, benoemt de rechtbank
      een of meer deskundigen in oneven getale. Zij geeft aan hen opdracht om de schadeloosstellingen te begroten voor
      de verweerders en de derde belanghebbenden, doch slechts voor zover zij het aan hen ten processe gedane aanbod niet
      hebben aanvaard. Zij benoemt voorts een harer leden, om vergezeld van de griffier, als commissaris bij de opneming
      door de deskundigen tegenwoordig te zijn en wijst een of meer nieuws- of advertentiebladen aan, een en ander
      overeenkomstig [artikel 27, tweede en derde lid][ref2]. [Artikel 28][ref3] is van overeenkomstige toepassing. Op de
      opneming door de deskundigen zijn de [artikelen 29-34][ref4] van overeenkomstige toepassing.

      2 Ingeval de opneming door de deskundigen reeds heeft plaats gehad overeenkomstig
      [Afdeling 1 van dit Hoofdstuk][ref5], stelt de rechtbank een datum vast waarop de nederlegging van het
      deskundigenrapport zal moeten plaats vinden. De griffier draagt zorg, dat partijen, de in het proces-verbaal
      vermelde derde belanghebbenden en de deskundigen een afschrift van dit vonnis ontvangen. De rechtercommissaris en
      de deskundigen, aangewezen krachtens [artikel 54c][ref6], treden in het geding als zodanig op, tenzij de rechtbank
      anderen in hun plaats aanwijst.

      3 Tevens onderzoekt de rechtbank in het in het vorige lid bedoelde geval ambtshalve, of het in de dagvaarding
      aangeduide ter onteigening aangewezen goed hetzelfde is als dat, waarop de opneming door de deskundigen betrekking
      heeft gehad. Indien blijkt, dat zulks niet het geval is, beveelt de rechtbank een nieuwe opneming door de
      deskundigen. Alsdan zijn de [artikelen 27-34][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel54i
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel27
