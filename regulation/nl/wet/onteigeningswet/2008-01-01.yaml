  - number: '86'
    text: |-
      1 Het koninklijk besluit omtrent goedkeuring van het raadsbesluit wordt binnen negen maanden na afloop
      van de termijn, bedoeld in [artikel 84, eerste lid][ref1], of [85, eerste lid][ref2], bekendgemaakt.
      [Artikel 10:31, tweede, derde en vierde lid, van de Algemene wet bestuursrecht ][ref3]is niet van toepassing.
      Van het koninklijk besluit wordt mededeling gedaan aan gedeputeerde staten en, zo mogelijk, aan de in
      [artikel 83, eerste lid, onder 3°][ref4], bedoelde eigenaren en andere rechthebbenden.

      2 Alvorens te beslissen omtrent het raadsbesluit tot onteigening worden degenen, die tijdig ingevolge
      [artikel 84, derde lid][ref5], dan wel [artikel 85, eerste lid][ref6], bedenkingen naar voren hebben gebracht, door
      Onze Minister die het aangaat, in de gelegenheid gesteld zich te doen horen. Zonodig kan Onze Minister ook andere
      belanghebbenden in de gelegenheid stellen zich te doen horen.

      3 Het koninklijk besluit wordt met het raadsbesluit tot onteigening in de Staatscourant geplaatst.


