  - number: '79'
    text: |-
      De onteigening ten name van de gemeente heeft plaats uit kracht van een besluit van de gemeenteraad. Dit besluit
      behoeft Onze goedkeuring. Alvorens te beslissen omtrent goedkeuring horen Wij de Raad van State. De goedkeuring
      kan worden onthouden indien de naar voren gebrachte bedenkingen daartoe aanleiding geven, wegens het niet of
      onvoldoende gediend zijn van het volkshuisvestingsbelang, het ruimtelijke ontwikkelingsbelang of het publiek
      belang, of het onvoldoende aanwezig zijn van de noodzaak of de urgentie.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel79
  - number: '80'
    text: |-
      1 Op de voorbereiding van de beslissing tot onteigening van de gemeenteraad is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 In ieder geval worden ter inzage gelegd:

      1°. een uitgewerkt plan met uitvoerige kaarten en met grondtekeningen waarop de te onteigenen onroerende zaken,
      en bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref2], de onroerende zaken waarop de te
      onteigenen rechten rusten, met vermelding van hun kadastrale aanduiding zijn aangewezen;

      2°. een lijst van de te onteigenen onroerende zaken aangeduid met hun kadastrale aanduiding met vermelding van

      a. de grootte volgens de basisregistratie kadaster van elk der desbetreffende percelen en, indien een te onteigenen
      onroerende zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte;

      b. de namen van de eigenaars van elk dier zaken, volgens de basisregistratie kadaster;

      3°. bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref3], een lijst van de te onteigenen
      rechten met vermelding van de kadastrale aanduiding van de zaken waarop zij rusten, en de namen van de
      rechthebbenden op die rechten volgens de basisregistratie kadaster.

      3 Het raadsbesluit tot onteigening vervalt, indien het niet uiterlijk zes maanden na afloop van de termijn bedoeld
      in [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref4] met de plannen, kaarten, grondtekeningen
      schriftelijke zienswijzen en het verslag, bedoeld in [artikel 3:17 van de Algemene wet bestuursrecht][ref5], aan
      Ons is voorgedragen. Een door Ons goedgekeurd raadsbesluit tot onteigening vervalt, indien de onteigenende partij
      niet binnen twee jaar na de dagteekening van Ons besluit den eigendom bij minnelijke overeenkomst heeft verkregen
      overeenkomstig het bepaalde in [artikel 17][ref6] of de eigenaren, in het onteigeningsbesluit aangewezen, voor de
      rechtbank, in welker rechtsgebied de onroerende zaken gelegen zijn, waarop de onteigening betrekking heeft, heeft
      doen dagvaarden overeenkomstig het bepaalde in [artikel 18][ref7].


