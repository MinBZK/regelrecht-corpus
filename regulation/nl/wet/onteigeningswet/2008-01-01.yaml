  - number: '93'
    text: |-
      1 Indien het te onteigenen gebouw onbewoonbaar is verklaard, wordt vergoed de waarde van den grond en van
      de bouwmaterialen, ingeval het gebouw voor geen enkel doeleinde kan worden gebruikt. Ingeval het gebouw tot
      eenig ander doeleinde dan bewoning zoude kunnen worden gebruikt, wordt vergoed de waarde van den grond en van
      de bouwmaterialen, vermeerderd met zoodanig bedrag, als billijk kan worden geacht in verband met de meerdere
      voordeelen, welke de eigenaar uit bedoeld gebruik zou kunnen trekken.

      2 Indien slechts een gedeelte van het te onteigenen gebouw onbewoonbaar is verklaard, wordt bij de bepaling der
      waarde van het geheel daarmede rekening gehouden. Daarbij wordt gelet op de geschiktheid of ongeschiktheid van het
      onbewoonbaar verklaarde deel voor andere doeleinden dan bewoning.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel93
  - number: '94'
    text: |-
      1 Indien aan een besluit als bedoeld in [artikel 13 van de Woningwet][ref1], strekkende tot het treffen van
      bepaalde voorzieningen aan een gebouw of een daartoe strekkend besluit tot toepassing van bestuursdwang of
      oplegging van een last onder dwangsom wegens niet-naleving van het bepaalde bij of krachtens [artikel 1a][ref2],
      [1b][ref3], [7b][ref4] of [13 van de Woningwet][ref5] geen gevolg wordt gegeven, wordt vergoed de waarde die het
      gebouw zou hebben in het geval zodanige voorzieningen waren getroffen, met aftrek van de kosten van het treffen van
      die voorzieningen.

      2 Indien het gebouw door een grooter aantal personen wordt bewoond dan volgens plaatselijke verordening geoorloofd
      is, wordt bij het bepalen van de werkelijke waarde geene rekening gehouden met de vermeerdering van huurprijs,
      welke uit die overschrijding voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel13
