  - number: '64'
    text: |-
      Bij het koninklijk besluit worden de te onteigenen onroerende zaken en rechten aangewezen door aanhaling van de in
      [artikel 63, tweede lid, onder 1°][ref1] bedoelde grondtekeningen en vermelding van:

      1°. de kadastrale aanduiding van de onroerende zaken met vermelding van de grootte volgens de basisregistratie
      kadaster van elk der desbetreffende percelen en, indien een te onteigenen onroerende zaak een gedeelte van een
      perceel uitmaakt, bovendien de grootte van dat gedeelte;

      2°. bij afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref2], de kadastrale aanduiding van de
      onroerende zaken waarop de te onteigenen rechten rusten;

      3°. de namen volgens de basisregistratie kadaster van de eigenaars van de te onteigenen onroerende zaken en, bij
      afzonderlijke onteigening als bedoeld in [artikel 4, eerste lid][ref3], van de rechthebbenden op de te onteigenen
      rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel64
