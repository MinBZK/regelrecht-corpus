  - number: '58'
    text: |-
      Wanneer onder de onteigenende partij beslag op de schadeloosstelling of het voorschot is gelegd, doet zij
      het bedrag dat zij zonder het beslag aan de beslagene had moeten uitbetalen consigneren overeenkomstig de
      [Wet op de consignatie van gelden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003338
  - number: '59'
    text: |-
      1 Het vonnis van onteigening, bedoeld in [artikel 37][ref1], kan slechts worden ingeschreven nadat het in kracht
      van gewijsde is gegaan. Ter inschrijving van het in de vorige zin bedoelde vonnis worden de bewijzen van betaling
      van de schadeloosstelling overgelegd. Ter inschrijving van het vonnis, bedoeld in [artikel 54i][ref2], dat
      niet is ingeschreven binnen de in [artikel 54m][ref3] bedoelde termijn, worden overgelegd het vonnis bedoeld in
      [artikel 54t, tweede lid][ref4], een verklaring van de griffier houdende dat laatstgenoemd vonnis in kracht van
      gewijsde is gegaan en de bewijzen van betaling der schadeloosstelling.

      2 Voor de toepassing van deze wet wordt met een bewijs van betaling gelijkgesteld een bewijs, dat de
      som der schadeloosstelling – of ingeval [Afdeling 2 van Hoofdstuk IIIa][ref5] toepassing heeft gevonden,
      de som van het voorschot – ten laste van de onteigenende partij is overgeschreven op een rekening van
      de tot ontvangst gerechtigde bij een financiële onderneming die in Nederland het bedrijf van bank mag
      uitoefenen ingevolge de [Wet op het financieel toezicht][ref6]. Tevens geldt als bewijs van betaling -
      indien niet genoegzaam bekend is aan wie moet worden betaald, of consignatie heeft plaatsgevonden ten
      gevolge van de [artikelen 3][ref7], [56][ref8] of [58][ref9] - een bewijs van consignatie als bedoeld in
      [artikel 6, eerste lid, van de Wet op de consignatie van gelden][ref10].

      3 In geval van onteigening van een onroerende zaak gaat door inschrijving van het vonnis de eigendom op de
      onteigenaar over, vrij van alle met betrekking tot de zaak bestaande lasten en rechten. In geval van onteigening
      als bedoeld in [artikel 4, eerste lid][ref11], vervallen door de inschrijving de lasten en rechten welke bestaan
      met betrekking tot de zaak, waarop het onteigende recht rust. Aldus waardeloos geworden inschrijvingen van
      hypotheken en beslagen worden ambtshalve doorgehaald. Alleen erfdienstbaarheden kunnen op de zaak gevestigd
      blijven. Zij dienen daartoe in het vonnis te worden opgenomen; indien zij niet door vestiging zijn ontstaan,
      worden de kadastrale aanduiding van het heersende erf en een omschrijving van de inhoud van de erfdienstbaarheid
      opgenomen.


