  - number: 54p
    text: |-
      1 Het voorschot op de schadeloosstelling of verhogingen daarvan worden geconsigneerd in alle gevallen, waarin
      volgens deze wet de schadeloosstelling zelf wordt geconsigneerd.

      2 Treedt iemand wiens tussenkomst in het geding is toegelaten in de plaats van degeen, aan wie reeds een voorschot
      op de schadeloosstelling was betaald, dan is deze laatste gehouden het bedrag van dit voorschot aan de onteigenende
      partij terug te betalen.
    url: https://wetten.overheid.nl/BWBR0001842/2008-01-01#Artikel54p
  - number: 54q
    text: |-
      1 Indien de onteigenende partij het vonnis, bedoeld in [artikel 54i][ref1], niet heeft doen inschrijven in de
      openbare registers binnen de in [artikel 54m][ref2] genoemde termijn, is de onteigenende partij schadeplichtig
      en hebben de wederpartij en de derde belanghebbenden de keuze een vaste schadeloosstelling of volledige
      schadevergoeding te vorderen.

      2 De vaste schadeloosstelling, bedoeld in het voorgaande lid, is gelijk aan tien ten honderd van het voorschot,
      bedoeld in [artikel 54i][ref3] of van de schadeloosstelling bedoeld in [artikel 54i, tweede lid, tweede zin][ref4].

      3 Wordt volledige schadevergoeding gevorderd, dan worden onder de schade mede begrepen de redelijkerwijs
      gemaakte kosten van rechtsbijstand en andere deskundige bijstand, alsmede de wettelijke rente van het bedrag der
      schadevergoeding, te rekenen van de dag, na afloop van de termijn, bedoeld in [artikel 54m][ref5].

      4 Deze vordering kan slechts worden ingesteld binnen zes maanden na afloop van de termijn bedoeld in
      [artikel 54m][ref6].

      5 Tot kennisneming der vordering is de rechtbank bevoegd, bij welke het geding van onteigening aanhangig is
      gemaakt.


