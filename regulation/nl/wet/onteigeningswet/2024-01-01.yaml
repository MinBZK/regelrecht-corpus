        artikel: '73'
  - number: 76a ter
    text: |-
      1 Door of op last van de burgemeesters kunnen, na bijzondere of algemene machtiging van Onze Minister van
      Economische Zaken, levensmiddelen, grondstoffen van levensmiddelen, huishoudelijke artikelen en brandstoffen
      onmiddellijk in bezit worden genomen onder zo spoedig mogelijke afgifte van een schriftelijk bewijsstuk van de
      inbezitneming.

      2 De op grond van het eerste lid in bezit genomen waren worden onverwijld, op door de burgemeester te bepalen
      wijze, ter beschikking gesteld ten behoeve van de bevolking van de gemeente of van aldaar bestaande bedrijven,
      tegen prijzen, die niet te boven gaan de daarvoor door Onze voornoemde Minister bepaalde bedragen.

      3 De schadeloosstelling, voor de in bezit genomen waren door de gemeente te bepalen, wordt door twee schatters, elk
      afzonderlijk, geschat, en een bon voor het gemiddelde van die twee schattingen wordt aan de vroegere houder van de
      waren gegeven.

      4 Het bedrag van deze bonnen wordt als verplichte uitgave van de gemeente aangemerkt en zo spoedig mogelijk
      uitbetaald.

      5 De schatters worden door Onze voornoemde Minister of, ingevolge diens bijzondere of algemene machtiging, door de
      burgemeester benoemd.

      6 [Artikel 75][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel75
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76a_ter
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '75'
  - number: 76b
    text: |-
      Indien degene, onder wien de burgemeester in het vorig artikel genoemde waren in bezit wil nemen, onmiddellijk
      ten genoegen van den burgemeester aanbiedt zelf op door dezen goedgekeurde wijze die waren ter beschikking te
      stellen tegen prijzen, die niet te boven gaan de daarvoor door Onzen voornoemden Minister bepaalde bedragen, kan de
      burgemeester de inbezitneming opschorten.
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76b
  - number: 76c
    text: |-
      1 Onze voornoemde Minister kan bepalen, dat de burgemeester bepaalde soorten of hoeveelheden van genoemde waren
      in bezit zal nemen, alsmede dat van in bezit genomen waren gedeelten ter beschikking worden gesteld van den
      burgemeester eener andere gemeente tegen den prijs en op de wijze, door dien Minister te bepalen.

      2 Voldoet de burgemeester niet onmiddellijk hieraan, dan geschiedt de inbezitneming en de terbeschikkingstelling
      van burgemeesters van andere gemeenten door dien Minister.

      3 Alsdan wordt de schadeloosstelling bepaald op de wijze, bij [artikel 76a ter][ref1] geregeld, met dien verstande,
      dat de benoeming der schatters dan steeds geschiedt door dien Minister.

      4 Het vierde en het laatste lid van [artikel 76a ter][ref2] zijn ook in dit geval van toepassing, met dien
      verstande, dat de uitgave komt ten laste van de gemeente, te welker behoeve de waren zijn beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76a_ter
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76c
