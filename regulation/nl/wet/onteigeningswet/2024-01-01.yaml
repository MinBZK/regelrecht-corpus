preamble:
  text: |-
    Wij WILLEM III, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, Groot-Hertog van Luxemburg,
    enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten;

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is, de onteigening ten algemeenen nutte, in
    overeenstemming met art. 147 der Grondwet, bij de wet te regelen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#ArtikelAanhef
articles:
  - number: '73'
    text: |-
      1 Wanneer in geval van brand of watersnood, ogenblikkelijke inbezitneming volstrekt noodzakelijk geacht wordt, kan
      deze op last van de hoogste burgerlijke overheid, ter plaatse aanwezig, geschieden.

      2 Ingeval van watersnood kan ook het dagelijks bestuur van het waterschap, dat met de zorg voor de waterkering is
      belast, de voorzitter van dat waterschap en ieder daartoe door dat dagelijks bestuur van het waterschap aangewezen
      lid van dat bestuur, ter vervulling van die taak die last geven.

      3 Door watersnood wordt niet enkel het geval verstaan dat dijken zijn doorgebroken of overstroomingen hebben plaats
      gehad, maar ook dat van dringend of dreigend gevaar voor doorbraak of overstrooming.

      4 De eigendom gaat onmiddellijk op dengene over, in wiens naam de inbezitneming is geschied, vrij van alle met
      betrekking tot de zaak bestaande lasten en rechten. Waterschaps- en soortgelijke lasten en alle belastingen waarmee
      het onteigende is bezwaard, gaan met ingang van de dag van de inbezitneming op hem over.

      5 Het besluit tot inbezitneming wordt zo spoedig mogelijk in de openbare registers ingeschreven. Door
      het besluit waardeloos geworden inschrijvingen van hypotheken en beslagen worden ambtshalve doorgehaald.
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '74'
    text: |-
      1 Zodra mogelijk na de onteigening, biedt degene die de onteigening bevolen heeft aan de onteigende gerechtelijk
      een schadevergoeding aan, of, als onder degene die de onteigening bevolen heeft, beslag op de schadeloosstelling is
      gelegd, consigneert die het bedrag dat zonder het beslag aan de beslagene had moeten worden uitbetaald volgens de
      [Wet op de consignatie van gelden][ref1].

      2 Indien dit aanbod of die consignatie niet binnen drie maanden is geschied, alsmede wanneer met het aangebodene of
      geconsigneerde geen genoegen wordt genomen, kan de schadevergoeding in regten door de onteigenden worden gevorderd.

      3 In het eerste geval kan de Staat, de provincie, de gemeenten of het waterschap de bedoelde schadeloosstelling
      van hen, die de onteigening gelast hebben, persoonlijk terugvorderen, ten ware het verzuim buiten hunne schuld mogt
      hebben plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003338
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003338
  - number: '75'
    text: |-
      De wettelijke interessen der verschuldigde schadevergoeding moeten van den dag der inbezitneming aan de onteigenden
      worden betaald.
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel75
  - number: '76'
    text: |-
      Wanneer hij, in wiens naam de onteigening gelast is, den eigendom van de zaak niet langer voor het beoogde doel
      noodig acht, en er nog geene drie jaren sedert de onteigening verloopen zijn, is de onteigende bij voorkeur boven
      alle anderen tegen betaling van den prijs, door deskundigen te begrooten, tot de verkrijging daarvan geregtigd.
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76
  - number: 76a
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, de [artikelen 76][ref2] in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het eerste lid
      in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel76b
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76a
