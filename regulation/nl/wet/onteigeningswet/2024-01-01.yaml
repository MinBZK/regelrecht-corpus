  - number: 76e
    text: |-
      1 De burgemeester zoomede de door hem aan te wijzen ambtenaren zijn te allen tijde bevoegd de uitlevering te
      vorderen van de in bezit te nemen waren. Zij, alsmede de hen op hun last vergezellende personen hebben te allen
      tijde vrijen toegang tot alle plaatsen, waar redelijkerwijs vermoed kan worden, dat zich de waren bevinden. Wordt
      hun de toegang geweigerd, dan verschaffen zij zich dien desnoods met inroeping van den sterken arm.

      2 Is de plaats tevens eene woning of alleen door eene woning toegankelijk, dan treden zij deze tegen den wil des
      bewoners niet binnen dan op bijzonderen of algemeenen schriftelijken last van den burgemeester.

      3 Van dit binnentreden wordt door hen procesverbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001842/2024-01-01#Artikel76e
  - number: 76f
    text: |-
      In geval, op grond van
      [artikel 7, eerste lid, of 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1], bepalingen
      uit de [Oorlogswet voor Nederland][ref2] in werking zijn gesteld, geschieden de machtigingen, bedoeld in
      [artikel 76a ter, eerste lid][ref3], niet dan na overleg met het militair gezag.


