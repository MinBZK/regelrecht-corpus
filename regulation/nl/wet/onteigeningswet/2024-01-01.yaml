  - number: 76fbis
    text: |-
      1 Door of op last van de burgemeesters kunnen, na algemene of bijzondere machtiging van Onze Minister van
      Binnenlandse Zaken, in de gemeente aanwezige verbruiksartikelen, bestemd voor bescherming en ontsmetting in het
      belang van de bestrijding van rampen en zware ongevallen, van de beperking van de onmiddellijke gevolgen daarvan
      alsmede van de voorbereiding op deze bestrijding en beperking, onmiddellijk in bezit worden genomen onder zo
      spoedig mogelijke afgifte van een schriftelijk bewijsstuk van de inbezitneming.

      2 De [artikelen 76a ter, derde lid tot en met zesde lid][ref1], [76b][ref2], [76c][ref3], [76e][ref4] en
      [76f][ref5] vinden overeenkomstige toepassing.


