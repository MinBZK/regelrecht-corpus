  - number: '7.3'
    text: |-
      Het procentuele aandeel van de gemeente in de middelen voor de inburgering van nieuwkomers, bedoeld in
      [artikel 4, eerste lid, van het Besluit][ref1], wordt voor het jaar 2006 bepaald volgens de formule (C/D) ×
      (Midverkl/Midinbnk) + (E/F) × (Midbeschl/Midinbnk)). In deze formule is - C: het aantal verklaringen van de
      gemeente in 2006, welke betrekking hebben op in dit jaar aangevangen inburgeringsprogramma’s;
        - D: het aantal verklaringen van de G30 in 2006, welke betrekking hebben op in dit jaar aangevangen
      inburgeringsprogramma’s;
        - E: het aantal beschikkingen omtrent een inburgeringsprogramma van de gemeente in 2006;
        - F: het aantal beschikkingen omtrent een inburgeringsprogramma van de G30 in 2006;
        - Midverkl: het bedrag dat voor de G30 voor de maatstaf verklaringen beschikbaar is;
        - Midbesch: het bedrag dat voor de G30 voor maatstaf beschikkingen beschikbaar is;
        - Midinbnk: de middelen voor de inburgering van nieuwkomers in het jaar 2006.


