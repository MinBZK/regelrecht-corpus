  - number: '12.1'
    text: |-
      De uitkering aan de gemeente Heerlen wordt verhoogd met ten hoogste € 1.500.000,– ten laste van de middelen die
      vanuit hoofdstuk VII van de Rijksbegroting voor het jaar 2005 ter beschikking worden gesteld ten behoeve van het
      project Hartslag, gericht op het verminderen van de aan harddrugs gerelateerde overlast in die gemeente.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12
  - number: '12.2'
    text: |-
      Voor 1 augustus 2005 dient het college van burgemeester en wethouders van Heerlen bij de minister een aanvraag
      in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een wijziging van het meerjaren
      ontwikkelingsprogramma. Daarin worden vastgelegd de in de GSB III periode te bereiken resultaten die bijdragen aan
      het verminderen van de aan harddrugs gerelateerde overlast, met de daarbij behorende indicatoren.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12
  - number: '12.3'
    text: |-
      De minister neemt een beschikking tot verlening van de in het eerste lid bedoelde verhoging binnen acht weken
      na het tijdstip waarop de in het tweede lid bedoelde aanvraag is ontvangen. De verhoging wordt in zijn geheel
      toegedeeld aan de in het tweede lid bedoelde indicatoren.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12
  - number: '12.4'
    text: |-
      De minister kan de verhoging op een lager bedrag dan € 1.500.000,– vaststellen indien de in het
      ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12
  - number: '12.5'
    text: |-
      De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van Heerlen heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het college
      binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van het
      ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12
  - number: 12a.1
    text: |-
      De uitkeringen aan de gemeenten Den Haag, Rotterdam en Utrecht en Amsterdam worden ten laste van de middelen die
      vanuit hoofdstuk VI van de Rijksbegroting ter beschikking worden gesteld voor het voorkomen van een criminele
      loopbaan van allochtone jongeren, op de volgende wijze verhoogd:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.1.a
    text: 'voor Den Haag: met € 750.000,– voor 2006 en 2007 en € 900.000,– voor 2008 en 2009;'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.1.b
    text: 'voor Rotterdam: met € 1.080.000,– voor 2006 en 2007 en € 1.296.000,– voor 2008 en 2009;'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.1.c
    text: 'voor Utrecht: met € 690.000,– voor 2006 en 2007 en € 828.000,– voor 2008 en 2009;'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.1.d
    text: 'voor Amsterdam: met € 1.980.000,– voor 2006 en 2007 en € 2.376.000,– voor 2008 en 2009.'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.2
    text: |-
      Binnen vier weken na publicatie van deze regeling dienen de colleges van burgemeester en wethouders van de vier in
      het eerste lid genoemde gemeenten bij de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De
      aanvraag gaat vergezeld van een wijziging van het meerjaren-ontwikkelingsprogramma. Daarin worden vastgelegd de in
      de GSB III periode te bereiken resultaten die bijdragen aan het voorkomen van een criminele loopbaan van allochtone
      jongeren.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3
    text: 'In de wijziging van het meerjarenprogramma worden de te bereiken resultaten geformuleerd met:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.a
    text: 'voor Den Haag:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.a.1°
    text: het aantal trajecten ‘Individuele ondersteuning van jongeren en gezinnen’;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.a.2°
    text: het aantal trajecten ‘Voorkomen van schooluitval’;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.a.3°
    text: het aantal trajecten ‘Werktoeleiding’;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.b
    text: 'voor Rotterdam:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.b.1°
    text: |-
      de daling van het percentage Nederlandse jongeren van Marokkaanse afkomst dat één jaar na ‘nazorg interventie’
      nieuwe Justitiecontacten heeft;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.b.2°
    text: |-
      het percentage van de betreffende jongeren dat na een half jaar geen bemiddeling of bemoeienis anderzijds meer
      nodig heeft van de regisseur van de deelgemeentelijke organisatie ‘Sluitende aanpak’;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.b.3°
    text: het aantal stageplekken waarmee het tekort wordt verminderd;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.c
    text: |-
      voor Utrecht: het aantal hulptrajecten per jaar voor Marokkaanse risicojongeren, beginners, meerplegers en
      risicogezinnen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.3.d
    text: |-
      voor Amsterdam: een of meer door het college van burgemeester en wethouders te bepalen indicatoren op het gebied
      van het voorkomen van een criminele loopbaan van allochtone jongeren.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4
    text: |-
      De minister neemt een beschikking tot verlening van een in het eerste lid bedoelde verhoging binnen acht weken na
      het tijdstip waarop de in het tweede lid bedoelde aanvraag is ontvangen. De verhoging wordt toegedeeld aan de in
      het derde lid genoemde indicatoren, volgens de navolgende percentsgewijze procentuele verdeling:.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.a
    text: 'voor Den Haag:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.a.1°
    text: 75% aan de indicator, genoemd in het derde lid, onder a, onderdeel 1°;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.a.2°
    text: 11% aan de indicator, genoemd in het derde lid, onder a, onderdeel 2°;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.a.3°
    text: 14% aan de indicator, genoemd in het derde lid, onder a, onderdeel 3°;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.b
    text: 'voor Rotterdam:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.b.1°
    text: 56% aan de indicator, genoemd in het derde lid, onder b, onderdeel 1°;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.b.2°
    text: 36% aan de indicator, genoemd in het derde lid, onder b, onderdeel 2°;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.b.3°
    text: 8% aan de indicator, genoemd in het derde lid, onder b, onderdeel 3°, en
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.c
    text: 'voor Utrecht: 100% aan de indicator, genoemd in het derde lid, onder c.'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.4.d
    text: |-
      voor Amsterdam: 100% aan de indicator of indicatoren, bedoeld in het derde lid, onder d; in de beschikking tot
      verlening van een in het eerste lid bedoelde verhoging wordt de percentsgewijze toedeling aan de indicator of
      indicatoren vastgelegd.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.5
    text: |-
      De Minister kan de verhoging lager vaststellen dan de bedragen genoemd in het eerste lid, indien de in het
      ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12a.6
    text: |-
      De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12a
  - number: 12b.1
    text: |-
      De uitkeringen aan gemeenten waar de som van de schoolgewichten 11 of meer bedraagt worden met ingang van 2006
      verhoogd ten laste van de middelen die vanuit hoofdstuk VIII van de Rijksbegroting ter beschikking worden gesteld
      voor de bestrijding van onderwijsachterstanden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.2
    text: |-
      Het procentuele aandeel van de betreffende gemeenten wordt voor het jaar 2006 vastgesteld volgens de formule: 5/12
      × s × v, en met ingang van 2007 jaarlijks volgens de formule: 7/12 × s × (v-1) + 5/12 × s × v. In die formules is:
      s: de som van de schoolgewichten volgens de definitie van het schoolgewicht, zoals die luidde op 31 juli 2006 en
      berekend aan de hand van het totaal aantal leerlingen op 1 oktober 2004 van de hoofdvestigingen en nevenvestigingen
      van basisscholen voor zover deze zich bevinden op het grondgebied van de betreffende gemeente; (v-1): het
      vermenigvuldigingsbedrag zoals dat van toepassing was in het voorgaande jaar, en v: het vermenigvuldigingsbedrag
      van het jaar van vaststelling.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.3
    text: |-
      Het vermenigvuldigingsbedrag bedraagt op 1 augustus 2006 € 1.368,–. De Minister van Onderwijs, Cultuur
      en Wetenschap stelt met ingang van 2007 jaarlijks per 1 augustus het voor het komende schooljaar geldende
      vermenigvuldigingsbedrag vast door het vermenigvuldigingsbedrag van het voorgaande jaar aan te passen op basis
      van de ontwikkeling van de genormeerde gemiddelde personeelslasten van leraren van basisscholen, als bedoeld in
      [artikel 120, zesde lid, van de Wet op het primair onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel120
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '120'
  - number: 12b.4
    text: |-
      Het vermenigvuldigingsbedrag zoals dat op grond van het vorige lid jaarlijks wordt vastgesteld, wordt jaarlijks
      bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.5
    text: |-
      Uiterlijk 15 augustus 2007 dienen de colleges van burgemeester en wethouders van de betreffende gemeenten bij
      de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een
      wijziging van het meerjarenontwikkelingsprogramma. In de wijziging van het meerjarenontwikkelingsprogramma
      worden de te bereiken resultaten geformuleerd met inachtneming van de indicatoren, bedoeld in
      [artikel 10, onderdelen a en b dan wel onderdelen a, b en ba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12b.6
    text: 'Voorschoolse educatie geschiedt onder de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.6.a
    text: |-
      het college van burgemeester en wethouders van een gemeente geeft aan op grond van welke criteria een doelgroepkind
      in aanmerking komt voor het volgen van voorschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.6.b
    text: de voorschoolse educatie wordt tenminste drie dagdelen per week gedurende tenminste een jaar gegeven;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.6.c
    text: |-
      in afwijking van het onder b. gestelde kan gedurende het schooljaar 2006–2007 tenminste twee dagdelen per week
      voorschoolse educatie gedurende een jaar worden gegeven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.7
    text: 'Voor schakelklassen gelden de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.7.a
    text: |-
      indien het onderwijs in de schakelklas plaatsvindt in combinatie met onderwijs in de reguliere groep, als
      bedoeld in [artikel 166 van de Wet op het primair onderwijs][ref1], bedraagt het aantal uren onderwijs dat in de
      schakelklas wordt gegeven minimaal 8 uren per week;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '166'
  - number: 12b.7.b
    text: |-
      indien het onderwijs in de schakelklas plaatsvindt na de reguliere schooltijd, bedoeld in
      [artikel 166a van de Wet op het primair onderwijs][ref1], bedraagt het aantal uren onderwijs dat in de schakelklas
      wordt gegeven minimaal 100 uren per schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel166a
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 166a
  - number: 12b.8
    text: |-
      De Minister neemt een beschikking tot de in het eerste lid bedoelde verhoging binnen acht weken na het tijdstip
      waarop de in het vijfde lid bedoelde aanvraag is ontvangen. Indien de wijziging van het meerjarenprogramma
      uitsluitend voorziet in het gebruik van de indicatoren, bedoeld in [artikel 10, onderdelen a en b][ref1], wordt
      de verhoging voor 80% toebedeeld aan de indicator, bedoeld in [artikel 10, onderdeel a][ref2], en voor 20% aan de
      indicator, bedoeld in [artikel 10, onderdeel b][ref3]. Indien de wijziging van het meerjarenontwikkelingsprogramma
      voorziet in het gebruik van de indicatoren, bedoeld in [artikel 10, onderdelen a, b en ba][ref4], wordt de
      verhoging voor 70 procent toegekend aan de indicator, bedoeld in [artikel 10, onderdeel a][ref5], voor 10 procent
      aan de indicator, bedoeld in [artikel 10, onderdeel b][ref6], en voor 20 procent aan de indicator, bedoeld in
      [artikel 10, onderdeel ba][ref7]. Als bij de indicator, bedoeld in [artikel 10, onderdeel ba][ref8], gekozen
      is voor een uitsplitsing in subindicatoren, wordt de 20 procent toegedeeld aan die subindicatoren met gelijke
      percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
