      de formule [ A × B ] + [ C × D ] + [ E × F ] + G indien het meerjaren ontwikkelingsprogramma van een gemeente
      met betrekking tot de in [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref1] genoemde
      onderdelen niet tot gevolg heeft dat de voor die gemeente gegeven indicatieve rijksbijdrage moet worden verhoogd;


