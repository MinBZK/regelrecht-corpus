      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
  - number: 14b.2
    text: |-
      In de formules, genoemd in het eerste lid, is A: het in het meerjaren ontwikkelingsprogramma opgenomen aantal
      door het college van burgemeester en wethouders vast te stellen inburgerings-voorzieningen ten behoeve van
      inburgeringsplichtigen en inburgeraars; B: de voorschotvergoeding ten aanzien van de in de letter A bedoelde
      inburgeringsvoorziening; C: het in het meerjaren ontwikkelingsprogramma opgenomen aantal door het college
      van burgemeester en wethouders vast te stellen gecombineerde inburgeringsvoorzieningen ten behoeve van
      inburgeringsplichtigen en inburgeraars; D: de voorschotvergoeding ten aanzien van de in letter C bedoelde
      gecombineerde inburgeringsvoorziening; E: het in het meerjaren ontwikkelingsprogramma opgenomen aantal door het
      college van burgemeester en wethouders bekend te maken handhavings-beschikkingen en te verstrekken kennisgevingen;
      F: 'de voorschotvergoeding ten aanzien van de in letter E bedoelde handhavingsbeschikking en kennisgeving; G: het'
      bedrag, bedoeld in [artikel 9, vierde lid, onderdeel a, onder 2°, van het Besluit][ref1]; H: het na toepassing van
      de in het eerste lid, onderdelen a en b, weergegeven formules resterende deel van de jaarlijks vanuit hoofdstuk VI
      van de Rijksbegroting ten behoeve van de G30 te verstrekken middelen voor inburgering; I: het relatieve aandeel in
      de overtekening van de jaarlijks vanuit hoofdstuk VI van de Rijksbegroting te verstrekken middelen voor inburgering
      van de gemeente die op de in [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref2] genoemde
      onderdelen een hoger meerjaren ontwikkelingsprogramma heeft ingediend dan de voor de gemeente gegeven indicatieve
      rijksbijdrage toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel7
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0018238
        artikel: '7'
  - number: 14b.3
    text: |-
      Het bedrag dat aan voorschotten op het aandeel in de middelen voor inburgering, bedoeld in artikel 4, eerste
      lid, onderdeel R, van het Besluit, voor de jaren 2008 en 2009 wordt verleend, wordt ambtshalve door de minister
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14b
  - number: 14b.4
    text: |-
      Indien het eerste lid, aanhef en onderdeel c, van toepassing is, is het voorschot
      voor een gemeente niet hoger dan het met het door die gemeente op de onderdelen van
      [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref1] ingediende meerjaren
      ontwikkelingsprogramma corresponderende indicatieve rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
  - number: 14b.5
    text: |-
      Onverminderd het eerste, tweede en vierde lid kan de Minister het voorschot voor een gemeente verhogen dan wel
      verlagen indien de vaststelling van de prijs, bedoeld in [artikel 14c, tweede lid][ref1], daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel14c
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 14c
        hoofdstuk: '5'
  - number: 14c.1
    text: |-
      De Minister stelt jaarlijks de voorschotvergoedingen, bedoeld in [artikel 14b][ref1], respectievelijk de
      bijdragevergoedingen, bedoeld in [artikel 9a][ref2], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel14b
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel9a
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 14b
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: 9a
        hoofdstuk: '2'
        afdeling: '2'
  - number: 14c.2
    text: |-
      De Minister voor Vreemdelingenzaken en Integratie stelt jaarlijks de landelijke gemiddelde prijs van een
      inburgeringscursus vast.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
  - number: 14c.3
    text: |-
      De Minister stelt de voorschotvergoedingen vast aan de hand van de prijs, bedoeld in het tweede lid, en de hoogte
      van de eigen bijdrage, bedoeld in [artikel 23, tweede lid, van de Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '23'
  - number: 14c.4
    text: |-
      De Minister stelt ten behoeve van de vast te stellen hoogte van de bijdragevergoedingen de onderlinge
      verhouding vast tussen de onderdelen, bedoeld in [artikel 9a, eerste lid, letters A, C en G][ref1] enerzijds
      en de onderdelen, bedoeld in [artikel 9a, eerste lid, letters I, K, M en O][ref2] anderzijds, respectievelijk
      het onderdeel, bedoeld in [artikel 9a, tweede lid, letter A][ref3] enerzijds en het onderdeel, bedoeld in
      [artikel 9a, tweede lid, letter C][ref4] anderzijds.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0018516#Artikel9a
      [ref4]: https://wetten.overheid.nl/BWBR0018516#Artikel9a
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 9a
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: 9a
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0018516
        artikel: 9a
        hoofdstuk: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0018516
        artikel: 9a
        hoofdstuk: '2'
        afdeling: '2'
  - number: 14c.5
    text: |-
      De Minister stelt de bijdragevergoedingen vast aan de hand van de prijs, bedoeld in het tweede lid, de verhouding,
      bedoeld in het vierde lid, en een uitvalpercentage ter hoogte van 10%.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
  - number: 14c.6
    text: De Minister maakt de hoogte van de voorschotvergoedingen, alsmede de verhouding jaarlijks voor 15 september bekend.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14c
  - number: 14d.1
    text: |-
      De Minister voor Vreemdelingenzaken en Integratie stelt de landelijke gemiddelde prijs, bedoeld in
      [artikel 14c, tweede lid][ref1], vast aan de hand van de door gemeenten met aanbieders overeengekomen inkoopprijzen
      van inburgeringscursussen.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel14c
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 14c
        hoofdstuk: '5'
  - number: 14d.2
    text: |-
      Indien de Minister voor Vreemdelingenzaken en Integratie daarom verzoekt, verstrekt het college van burgemeester en
      wethouders voor 1 mei een opgave van:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.2.a
    text: |-
      het gemiddelde van alle door de gemeente in de voorafgaande maanden januari, februari en maart met aanbieders
      overeengekomen inkoopprijzen van inburgeringscursussen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.2.b
    text: |-
      het aantal inburgeringsplichtigen en inburgeraars aan wie de gemeente de in onderdeel a bedoelde
      inburgeringscursussen zal aanbieden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.3
    text: |-
      In afwijking van het tweede lid, verstrekt het college van burgemeester en wethouders de Minister voor
      Vreemdelingenzaken en Integratie voor 1 juni 2007 een opgave van:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.3.a
    text: |-
      het gemiddelde van alle door de gemeente in de voorafgaande maanden februari, maart en april met aanbieders
      overeengekomen inkoopprijzen van inburgeringscursussen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.3.b
    text: |-
      het aantal inburgeringsplichtigen en inburgeraars aan wie de gemeente de in onderdeel a bedoelde
      inburgeringscursussen zal aanbieden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.4
    text: |-
      De Minister voor Vreemdelingenzaken en Integratie stelt een model vast voor de verstrekking van de opgave, bedoeld
      in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
  - number: 14d.5
    text: |-
      Indien de Minister voor Vreemdelingenzaken en Integratie daarom verzoekt, is de opgave, bedoeld in het tweede
      en derde lid, voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Ten behoeve van de verklaring omtrent de
      getrouwheid stelt de Minister voor Vreemdelingenzaken en Integratie een controleprotocol vast. Aan de Minister
      voor Vreemdelingenzaken en Integratie wordt op diens verzoek inzicht gegeven in de gegevens die bij de controle op
      enigerlei wijze een rol spelen en in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '15.1'
    text: |-
      Het bedrag dat in 2005 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend is de uitkomst van de
      formule ((O/P) × Midverkl + (Q:R) × Midbesch) – ½S + (T × € 6400). In deze formule is - O: het aantal verklaringen
      van de gemeente in 2003;
        - P: het aantal verklaringen van de G30 in 2003;
        - Midverkl: het bedrag dat voor de G30 voor de maatstaf verklaringen beschikbaar is;
        - Q: het aantal beschikkingen van de gemeente in 2003;
        - R: het aantal beschikkingen van de G30 in 2003;
        - Midbesch: het bedrag dat voor de G30 voor de maatstaf beschikkingen beschikbaar is;
        - S: de door de Minister voor Vreemdelingenzaken en Integratie geraamde door
      een gemeente opgebouwde reserve aan niet bestede rijksbijdragen als bedoeld in
      [artikel 1, onderdeel g, van het Bekostigingsbesluit inburgering nieuwkomers][ref1], per 31 december 2004;
        - T: het door de Minister voor Vreemdelingenzaken en Integratie vastgestelde aantal oudkomers dat bij de verlening
      van de voorschotten wordt betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '1'
  - number: '15.2'
    text: Als de reserve, bedoeld in onderdeel S van de formule, genoemd in het eerste lid, negatief is wordt S gesteld op 0.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15
  - number: '15.3'
    text: |-
      Het bedrag dat in 2005 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend bedraagt in afwijking van
      het eerste lid ten minste T × € 6400.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15
  - number: 15a
    text: |-
      Onverminderd [artikel 15][ref1] wordt in november 2005 een additioneel voorschot verstrekt op het inburgeringsdeel,
      ter hoogte van het verschil tussen enerzijds de helft van de door de Minister voor Vreemdelingenzaken en
      Integratie geraamde door een gemeente opgebouwde reserve aan niet bestede rijksbijdragen als bedoeld in
      [artikel 1, onderdeel g, van het Bekostigingsbesluit inburgering nieuwkomers][ref2], per 31 december 2004, en
      anderzijds de helft van de verantwoorde reserve van een gemeente per 31 december 2004, mits dat verschil groter is
      dan € 0.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '15'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '1'
  - number: 15b.1
    text: |-
      Het bedrag dat aan de gemeenten in 2006 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend is de
      uitkomst van de formule ((O/P) × Midverkl + (Q:R) × Midbesch) + (T × € 6400). In deze formule is O: het aantal
      verklaringen van de gemeente in 2004; P: het aantal verklaringen van de G30 in 2004; Midverkl: het bedrag dat
      voor de G30 voor de maatstaf verklaringen beschikbaar is; Q: het aantal beschikkingen van de gemeente in 2004; R:
      het aantal beschikkingen van de G30 in 2004; Midbesch: het bedrag dat voor de G30 voor de maatstaf beschikkingen
      beschikbaar is; T: het door de Minister voor Vreemdelingenzaken en Integratie vastgestelde aantal oudkomers dat bij
      de verlening van de voorschotten wordt betrokken.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15b
  - number: 15b.2
    text: |-
      Het bedrag dat in 2006 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend bedraagt in afwijking van
      het eerste lid ten minste T × € 6400.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15b
  - number: 15c
    text: |-
      Onverminderd [artikel 15b][ref1] kan in 2006 en 2007 een additioneel voorschot worden verstrekt op
      het inburgeringsdeel, maximaal ter hoogte van het verschil tussen enerzijds de op de grondslag van
      [artikel 7, eerste en tweede lid][ref2], vast te stellen middelen voor de inburgering van nieuwkomers en
      anderzijds het op grond van [artikel 15, eerste en tweede lid][ref3], verstrekte voorschot voor de inburgering van
      nieuwkomers, mits dat verschil groter is dan nul.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018516#Artikel15
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 15b
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '7'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0018516
        artikel: '15'
        hoofdstuk: '5'
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juni 2005.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling brede doeluitkering sociaal, integratie en veiligheid.'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel18
