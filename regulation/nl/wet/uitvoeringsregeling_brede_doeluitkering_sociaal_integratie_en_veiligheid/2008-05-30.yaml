        afdeling: '5'
  - number: '14.5'
    text: |-
      Aan Sittard-Geleen wordt vanaf 2006 ambtshalve jaarlijks een voorschot verleend van € 1.494.327,–, met
      in 2006 een extra bedrag voor inburgering van € 870.420,–. De te verlenen voorschotten worden in de
      jaren 2007, 2008 en 2009 steeds verhoogd met de bedragen die de Minister heeft verleend op grond van
      [artikel 9, derde lid van het Besluit][ref1], alsmede op grond van [artikel 12b, achtste en negende lid][ref2],
      [artikel 12ba, derde lid][ref3], en [artikel 12c, vijfde en zesde lid][ref4], van de Uitvoeringsregeling brede
      doeluitkering sociaal, integratie en veiligheid.


