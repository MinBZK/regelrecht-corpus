        hoofdstuk: '2'
        afdeling: '5'
  - number: 14.10.b
    text: |-
      Het aan de gemeente Leeuwarden te verlenen voorschot wordt verhoogd met € 50.000,– voor het jaar 2008, onverminderd
      de verhoging bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: '14.11'
    text: |-
      De aan gemeenten te verlenen voorschotten ten behoeve van ‘Aanval op de Uitval’ worden op de volgende wijze
      verleend:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.11.a
    text: |-
      De aan de gemeenten, die op basis van [artikel 12e, zesde lid][ref1], in aanmerking komen voor een bijdrage
      in het kader van het initiatief ‘Aanval op de Uitval’, te verlenen voorschotten worden verhoogd met €
      100.000 per toegekend project voor het jaar 2006. Het aan Hengelo te verlenen voorschot wordt ten gevolge van
      [artikel 12e, achtste lid][ref2], voor het jaar 2006 verhoogd met € 120.000;


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12e
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel12e
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
