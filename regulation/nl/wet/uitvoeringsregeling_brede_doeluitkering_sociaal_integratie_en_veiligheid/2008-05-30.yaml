    text: |-
      De aan de in het eerste lid van [artikel 12b][ref1] bedoelde gemeenten te verlenen voorschotten worden verhoogd
      met de bedragen die de minister op grond van [artikel 12b, achtste en negende lid][ref2], heeft verleend. Het
      procentuele aandeel voor het jaar 2006, als bedoeld in [artikel 12b, tweede lid][ref3], wordt door de minister als
      voorschot vóór 1 oktober 2006 beschikbaar gesteld. Dit voorschot wordt verstrekt, vooruitlopend op de beschikking
      tot verlening, als bedoeld in [artikel 12b, achtste en negende lid][ref4].


