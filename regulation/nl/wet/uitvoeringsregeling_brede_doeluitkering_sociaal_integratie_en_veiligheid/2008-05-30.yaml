  - number: '14.2'
    text: 'Het bedrag van de gemeente voor de extra veiligheidsmiddelen bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.2.a
    text: het kalenderjaar 2005, 8,17% van het aandeel van de gemeente in de extra veiligheidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.2.b
    text: het kalenderjaar 2006, 25,67% van het aandeel van de gemeente in de extra veiligheidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.2.c
    text: het kalenderjaar 2007, 27,33% van het aandeel van de gemeente in de extra veiligheidsmiddelen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.2.d
    text: het kalenderjaar 2008, 21,50% van het aandeel van de gemeente in de extra veiligheidsmiddelen, en
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.2.e
    text: het kalenderjaar 2009, 17,33% van het aandeel van de gemeente in de extra veiligheidsmiddelen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: '14.3'
    text: Het verleende voorschot voor een kalenderjaar wordt in twee termijnen betaald.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: '14.4'
    text: |-
      Het in 2005 aan de gemeente Heerlen te verlenen voorschot wordt verhoogd met het bedrag dat de minister op grond
      van [artikel 12, derde lid][ref1], heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
