  - number: '3'
    text: |-
      Het procentuele aandeel van de gemeente in de middelen voor het terugdringen van voortijdig schoolverlaten,
      bedoeld in [artikel 4, eerste lid, van het Besluit][ref1], wordt bepaald volgens de formule 0,3333 × (NWAl2004gem/
      NWAl2004G30) + 0,3333 × (ABW2003gem/ABW2003G30) + 0,3333 × (Loplgem/LoplG30). In deze formule is - NWAl2004gem:
      aantal niet westerse allochtonen in de gemeente op 1 januari 2004;
        - NWAl2004G30: aantal niet westerse allochtonen in de G30 op 1 januari 2004;
        - ABW2003gem: totaal aantal uitkeringen ingevolge de [Algemene bijstandswet][ref2] in 2003 in de gemeente;
        - ABW2003G30: totaal aantal uitkeringen ingevolge de [Algemene bijstandswet][ref3] in 2003 in de G30;
        - Loplgem: gemiddeld aantal inwoners in de gemeente van 18 jaar tot en met 64 jaar over de jaren 1997–2002 met ten
      hoogste een diploma op het niveau van het Voorbereidend Beroepsonderwijs;
        - LoplG30: gemiddeld aantal inwoners in de G30 van 18 jaar tot en met 64 jaar over de jaren 1997–2002 met ten
      hoogste een diploma op het niveau van het Voorbereidend Beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007333
      - id: ref3
        bwb_id: BWBR0007333
  - number: '4'
    text: |-
      Het procentuele aandeel van de gemeente in de middelen voor de bestrijding van gezondheidsachterstanden wordt
      bepaald volgens de formule Schgw2003gem/Schgw2003G30. In deze formule is - Schgw2003gem: het aantal van de
      schoolgewichten op 1 oktober 2003 in de gemeente op basis van [artikel 15b van het Formatiebesluit WPO][ref1],
      zoals dat luidde op die datum;
        - Schgw2003G30: het aantal van de schoolgewichten op 1 oktober 2003 in de G30-gemeenten op basis van
      [artikel 15b van het Formatiebesluit WPO][ref2], zoals dat luidde op die datum.


