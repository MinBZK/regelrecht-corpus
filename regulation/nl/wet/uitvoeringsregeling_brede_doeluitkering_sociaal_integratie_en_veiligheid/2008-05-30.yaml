        hoofdstuk: '2'
        afdeling: '5'
  - number: 14.11.b
    text: |-
      Het aan de gemeente Leeuwarden te verlenen voorschot wordt verhoogd met € 150.000,– voor het jaar 2008,
      onverminderd de verhoging bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: '14.12'
    text: |-
      De aan de elf gemeenten, genoemd in [artikel 12f, eerste lid][ref1], te verlenen voorschotten worden in de jaren
      2006, 2007, 2008 en 2009 steeds verhoogd met respectievelijk 17,69%, 17,69%, 43,08% en 21,54% van het bedrag dat de
      minister op grond van [artikel 12f, vierde en vijfde lid][ref2], heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12f
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel12f
