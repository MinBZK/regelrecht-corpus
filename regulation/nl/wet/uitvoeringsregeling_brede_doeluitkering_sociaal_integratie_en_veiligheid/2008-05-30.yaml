  - number: 9a.1
    text: |-
      Het aandeel van de gemeente in de middelen voor inburgering, bedoeld in
      [artikel 4, eerste lid, onderdeel Q, van het Besluit][ref1], voor de jaren 2007, 2008 en 2009 wordt bepaald volgens
      de formule { ( [ A × B ] + [ C × D ] + [ E × F ] + [ G × H ] + [ I × J ] + [ K × L ] + [ M × N ] + [ O × P ] +
      [ Q × R ] + [ S x T ] ) × U } + V + W. In deze formule is A: het aantal inburgeringsplichtigen en inburgeraars
      ten behoeve van wie het college van burgemeester en wethouders voor de eerste keer een inburgeringsvoorziening
      heeft vastgesteld; B: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening,
      bedoeld in letter A; C: het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van
      burgemeester en wethouders voor de eerste keer een gecombineerde inburgeringsvoorziening heeft vastgesteld;
      D: de bijdragevergoeding ten aanzien van de vaststelling van de gecombineerde inburgeringsvoorziening, bedoeld
      in letter C; E: het aantal inburgeringsplichtigen aan wie het college van burgemeester en wethouders een
      handhavingsbeschikking bekend heeft gemaakt, dan wel een kennisgeving heeft verstrekt; F: de bijdragevergoeding
      ten aanzien van de bekendmaking van een handhavingsbeschikking en de verstrekking van een kennisgeving;
      G: het aantal geestelijke bedienaren ten behoeve van wie het college van burgemeester en wethouders voor
      de eerste keer een inburgeringsvoorziening heeft vastgesteld; H: de bijdragevergoeding ten aanzien van de
      vaststelling van de inburgeringsvoorziening voor geestelijke bedienaren; I: het aantal in de letter A bedoelde
      inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van burgemeester en wethouders een
      inburgeringsvoorziening heeft vastgesteld en dat heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;
      J: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld
      in letter I; K: het aantal in de letter C bedoelde inburgeringsplichtigen en inburgeraars ten behoeve van wie
      het college van burgemeester en wethouders een gecombineerde inburgeringsvoorziening heeft vastgesteld en dat
      heeft deelgenomen aan het inburgeringsexamen of het staatsexamen; L: de bijdragevergoeding ten aanzien van
      de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld in letter K; M: het aantal geestelijke
      bedienaren dat heeft deelgenomen aan het inburgeringsexamen of het staatsexamen; N: de bijdragevergoeding ten
      aanzien van de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld in letter M; O: het aantal
      geestelijke bedienaren dat heeft deelgenomen aan het aanvullende praktijkdeel van het inburgeringsexamen of het
      staatsexamen, bedoeld in [artikel 3.8 van het Besluit inburgering][ref2]; P: de bijdragevergoeding ten aanzien
      van de deelname aan het aanvullende praktijkdeel van het inburgeringsexamen of het staatsexamen, bedoeld in
      [artikel 3.8 van het Besluit inburgering][ref3]; Q: het aantal door het college van burgemeester en wethouders
      in 2007 op grond van de [Wet inburgering nieuwkomers][ref4], zoals die luidde op 31 december 2006, genomen
      beschikkingen omtrent een inburgeringsprogramma; R: de bijdragevergoeding ten aanzien van een beschikking
      omtrent een inburgeringsprogramma als bedoeld in letter Q; S: het aantal door het college van burgemeester
      en wethouders in 2007 en 2008 ontvangen afschriften van door het bevoegd gezag van een instelling ingevolge
      de [Wet inburgering nieuwkomers][ref5], zoals die luidde op 31 december 2006, uitgereikte verklaringen als
      bedoeld in [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref6], zoals dat artikel
      luidde op 31 december 2006, die betrekking hebben op in 2006 en 2007 aangevangen inburgeringsprogramma’s; T: de
      bijdragevergoeding ten aanzien van een verklaring als bedoeld in letter S; U: de door de Minister vast te stellen
      correctiefactor; V: het bedrag, bedoeld in [artikel 9, vierde lid, onderdeel a, onder 2° van het Besluit][ref7];
      W: het bedrag, bedoeld in [artikel 7, eerste lid, onderdeel o, onder 4°, van het Besluit][ref8].


