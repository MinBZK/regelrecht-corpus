  - number: '7.1'
    text: |-
      Het procentuele aandeel van de gemeente in de middelen voor de inburgering van nieuwkomers, bedoeld in
      [artikel 4, eerste lid, van het Besluit][ref1], voor het jaar 2005 wordt bepaald volgens de formule (C/D) ×
      (Midverkl/Midinbnk) + (E/F) × (Midbeschl/Midinbnk)). In deze formule is - C: het aantal verklaringen van de
      gemeente in 2005;
        - D: het aantal verklaringen van de G30 in 2005;
        - E: het aantal beschikkingen omtrent een inburgeringsprogramma van de gemeente in 2005;
        - F: het aantal beschikkingen omtrent een inburgeringsprogramma van de G30 in 2005;
        - Midverkl: het bedrag dat voor de G30 voor de maatstaf verklaringen beschikbaar is;
        - Midbesch: het bedrag dat voor de G30 voor maatstaf beschikkingen beschikbaar is;
        - Midinbnk: de middelen voor de inburgering van nieuwkomers in 2005.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '4'
  - number: '7.2'
    text: |-
      Op het met het procentuele aandeel, bedoeld in het eerste lid, corresponderende bedrag, wordt de helft van de
      per 31 december 2004 door de gemeente op grondslag van de [Wet inburgering nieuwkomers][ref1] gevormde reserve in
      mindering gebracht, mits die reserve groter is dan € 0.


