  - number: 12b.9
    text: |-
      De minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien de
      in het ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.10
    text: |-
      De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.11
    text: |-
      Een landelijke evaluatie vindt plaats na het schooljaar 2007–2008. Desgevraagd werken gemeenten en bevoegde
      gezagsorganen hieraan mee. De evaluatie heeft betrekking op:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.11.a
    text: de samenwerking tussen gemeenten en bevoegde gezagsorganen van scholen in die gemeente;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.11.b
    text: de wijze waarop gemeenten uitvoering hebben gegeven aan de voorschoolse educatie;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12b.11.c
    text: de wijze waarop gemeenten schakelklassen onderwijs hebben ingericht.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12b
  - number: 12ba.1
    text: |-
      De uitkeringen aan de gemeenten, bedoeld in [artikel 12b, eerste lid][ref1], worden voor de schooljaren 2007–
      2008 tot en met 2008–2009 verhoogd ten laste van de middelen die vanuit hoofdstuk VIII van de Rijksbegroting voor
      2007, 2008 en 2009 ter beschikking worden gesteld voor een extra impuls op het terrein van voorschoolse educatie,
      teneinde de in het meerjarenontwikkelingsprogramma vastgelegde resultaten, met inachtneming van de indicator,
      bedoeld in [artikel 10, onderdeel a][ref2], eerder dan ultimo 2009 te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ba
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12ba.2
    text: |-
      Het procentuele aandeel van de betreffende gemeenten in de middelen, bedoeld in het eerste lid, wordt vastgesteld
      door de som van de schoolgewichten, volgens de definitie van het schoolgewicht zoals die luidde op 31 juli 2006 en
      berekend aan de hand van het totaal aantal leerlingen op 1 oktober 2004 van de hoofdvestigingen en nevenvestigingen
      van basisscholen voor zover deze zich bevinden op het grondgebied van de betreffende gemeente, te vermenigvuldigen
      met een bedrag van € 176,45.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ba
  - number: 12ba.3
    text: |-
      De Minister neemt een beschikking tot verlening van een in het eerste lid bedoelde verhoging binnen acht
      weken na het tijdstip waarop de in [artikel 12b, vijfde lid][ref1], bedoelde aanvraag is ontvangen, maar
      niet later dan 15 oktober 2007. De verhoging wordt in zijn geheel toegedeeld aan de indicator, bedoeld in
      [artikel 10, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ba
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 12b
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12c.1
    text: |-
      Indien het bij koninklijke boodschap van 21 september 2005 ingediende voorstel van Wet houdende regels inzake
      inburgering in de Nederlandse samenleving (Wet inburgering, Kamerstukken I 2005/06, 30 308, nr. A) nadat het
      tot wet is verheven, in werking treedt, worden de uitkeringen aan alle gemeenten met ingang van de datum van
      inwerkingtreding van die Wet verhoogd ten laste van de middelen die vanuit hoofdstuk VIII van de Rijksbegroting ter
      beschikking worden gesteld voor educatie.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.2
    text: |-
      Het procentuele aandeel van elke gemeente wordt berekend op basis van de
      [artikelen 3.2.1. tot en met 3.2.3 van het Uitvoeringsbesluit Web][ref1] en wordt aan elke gemeente bekendgemaakt
      in het verleningsbesluit, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel3
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '3'
  - number: 12c.3
    text: |-
      Uiterlijk op 15 november 2006 dienen de colleges van burgemeester en wethouders van de betreffende gemeenten bij
      Onze Minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een
      wijziging van het meerjarenontwikkelingsprogramma.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.4
    text: 'De wijziging van het meerjarenontwikkelingsprogramma voldoet aan de volgende aanvullende eisen:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.4.a
    text: |-
      zij bevat een doelgroepenanalyse, waarin wordt aangegeven met welke doelgroepen van de educatie de gemeente te
      maken heeft, wat de omvang is van de onderscheiden doelgroepen en op welke doelgroep(en) het gemeentelijk beleid
      wordt gericht, alsmede een overzicht van het aantal deelnemers in de onderscheiden opleidingen educatie;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.4.b
    text: |-
      aangegeven wordt welk deel van het budget wordt besteed aan educatie. Indien de gemeente voornemens is tien
      procent of meer van de voor educatie beschikbaar gestelde middelen niet in te zetten voor educatie, bevat
      de wijziging van het meerjarenprogramma een motivatie daarvoor, alsmede een gezamenlijke verklaring van
      het college van burgemeester en wethouders en het betrokken roc, of de betrokken roc’s, waaruit blijkt dat
      [artikel 4.1.3, eerste en tweede lid, van de Uitvoeringsregeling Web][ref1] in acht is genomen en waaruit tevens
      blijkt op welke wijze deelnemers in staat worden gesteld hun opleiding af te maken;


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel4
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '4'
  - number: 12c.4.c
    text: |-
      het te bereiken resultaat wordt geformuleerd op een van de indicatoren, bedoeld in
      [artikel 10, onderdelen d tot en met g][ref1]. Als de gemeente in de wijziging van het
      meerjarenontwikkelingsprogramma heeft gekozen voor de indicator, bedoeld in [artikel 10, onderdeel g][ref2], en
      daarbij heeft gekozen voor een uitsplitsing in subindicatoren, geeft de wijziging van het meerjarenontwikkelings-
      programma tevens aan in welke mate de beschikbare middelen worden toegerekend aan elk van die subindicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12c.5
    text: |-
      De minister neemt een beschikking tot verlening van een in het eerste lid respectievelijk in het negende lid
      bedoelde verhoging binnen acht weken na het tijdstip waarop de in het tweede lid respectievelijk in het negende
      lid bedoelde aanvraag is ontvangen. De verhoging wordt in zijn geheel toegerekend aan de gekozen indicator.
      Als is gekozen voor de indicator, bedoeld in [artikel 10, onderdeel g][ref1], met daarbij een uitsplitsing in
      subindicatoren, wordt de verhoging toegerekend aan die subindicatoren op de wijze als aangegeven in de wijziging
      van het meerjarenontwikkelingsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12c.6
    text: |-
      De minister kan minder dan 100% verlenen van het in het tweede lid bedoelde procentuele aandeel respectievelijk
      de in het negende lid bedoelde verhoging, indien de in het ontwikkelingsprogramma opgenomen resultaten naar zijn
      oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.7
    text: |-
      De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12c.8
    text: |-
      Indien activiteiten als bedoeld in [artikel 2.3.4, derde lid, onder a van de Wet educatie en beroepsonderwijs][ref1],
      waarvoor het college van burgemeester en wethouders van de betreffende gemeente zich heeft verplicht, niet of
      niet volledig zijn verricht en het college van burgemeester en wethouders uit dien hoofde in 2006 aanspraken heeft
      jegens de instelling, besteedt het college van burgemeester en wethouders de uit die aanspraken voortvloeiende en
      terugontvangen middelen die afkomstig zijn uit de rijksbijdrage 2006 in de resterende GSB III periode opnieuw voor
      volwasseneneducatie, en verantwoordt het college van burgemeester en wethouders die middelen bij de verantwoording
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
  - number: 12c.9
    text: |-
      Indien er sprake is van een verhoging van de uitkering met de in het achtste lid bedoelde middelen, kan dit voor
      de Minister aanleiding zijn het college van burgemeester en wethouders van de betreffende gemeente te verzoeken
      hiervoor een aanvraag in te dienen, vergezeld van een wijziging van het meerjarenontwikkelingsprogramma, binnen
      een door hem te bepalen termijn. In deze wijziging van het ontwikkelingsprogramma wordt het te bereiken resultaat
      opnieuw geformuleerd met inachtneming van de in het derde lid bedoelde aanvraag en met inachtneming van de in het
      vierde lid, onderdelen a en c, gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12c
  - number: 12d.1
    text: |-
      De uitkering aan de gemeenten Almelo, Amsterdam, Arnhem, Den Haag, Dordrecht, Eindhoven, Heerlen, Leeuwarden,
      Nijmegen, Rotterdam, Schiedam en Utrecht wordt verhoogd met € 2.000.000,– per gemeente ten laste van de middelen
      die vanuit hoofdstuk VII van de Rijksbegroting voor het jaar 2006 en 2007 ter beschikking worden gesteld,
      ten behoeve van de impuls ‘Sociale Herovering’. De verhoging is bestemd voor het uitvoeren van wijkgerichte
      activiteiten die bijdragen aan de doelstellingen, genoemd in [artikel 7, eerste lid, van het Besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel7
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '7'
  - number: 12d.2
    text: |-
      Onverminderd het eerste lid wordt de uitkering aan de gemeente Leeuwarden verhoogd met € 50.000,– ten laste van de
      middelen die vanuit hoofdstuk XVIII van de Rijksbegroting voor het jaar 2008 ter beschikking worden gesteld voor de
      organisatie van een landelijke conferentie ‘Sociale Herovering’.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12d
  - number: 12e.1
    text: |-
      De uitkering kan ten laste van de middelen die vanuit hoofdstuk VII van de Rijksbegroting voor het jaar 2006 ter
      beschikking worden gesteld ten behoeve van het initiatief ‘Aanval op de Uitval’ van de G27, verhoogd worden ten
      behoeve van experimentele projecten, gericht op het tegengaan van uitval van jeugd of van kansarmen, of op de
      uitval van wijken in relatie tot de zorg van bewoners voor hun eigen buurt.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.2
    text: |-
      Voor 15 november 2006 kunnen de colleges van burgemeester en wethouders bij de bestuurlijke kern van de G27 een
      aanvraag indienen voor een verhoging als bedoeld in het eerste lid. Aanvragen die voor de inwerkingtreding van deze
      regeling zijn ingediend worden mede aangemerkt als een aanvraag als bedoeld in dit lid.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.3
    text: |-
      De bestuurlijke kern van de G27 toetst de aanvragen aan de criteria, genoemd in het eerste en vierde lid en zendt
      deze, vergezeld van een advies, voor 20 november 2006 door naar de minister. Het advies is vormgegeven volgens het
      model in [bijlage C][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018516
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0018516
  - number: 12e.4
    text: |-
      De aanvraag gaat vergezeld van een wijziging van het meerjaren-ontwikkelingsprogramma. Deze wijziging voldoet aan
      de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.4.a
    text: 'het project:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.4.a.1°
    text: |-
      maakt de omslag van aanbodsgericht naar vraaggericht beleid zichtbaar en richt zich op concrete vragen en problemen
      van burgers;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.4.a.2°
    text: experimenteert met succesvol gebleken methoden met het oog op verdere verfijning daarvan;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.4.a.3°
    text: |-
      is gericht op verbetering van de samenwerking tussen overheden, maatschappelijke instellingen of andere private
      partijen en
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.4.b
    text: |-
      de resultaten van het project zijn in principe bruikbaar voor de andere G27 gemeenten en de aanvrager is bereid
      deze bekend te maken.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.5
    text: |-
      Voor de verhoging, bedoeld in het eerste lid, is een bedrag van € 1.400.000,– beschikbaar. Per project wordt een
      bedrag van € 100.000,– toegekend.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.6
    text: |-
      De minister neemt uiterlijk 1 december 2006 een beslissing over verlening van de verhogingen bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.7
    text: |-
      De bestuurlijke kern van de G27 informeert de minister voor BVK uiterlijk 31 december 2007 over de behaalde
      resultaten van de projecten waarvoor een verhoging als bedoeld in het eerste lid is verleend. Daarbij wordt in
      ieder geval ingegaan op de volgende vragen:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.7.a
    text: welke knelpunten zijn in de projecten aangepakt;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.7.b
    text: |-
      welke oplossingsrichtingen zijn voorgesteld en in hoeverre hebben die oplossingsrichtingen bij de uitvoering
      gewerkt;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.7.c
    text: |-
      is een verdere verspreiding van de voorgestelde oplossingsrichtingen aan te bevelen en zo ja, hoe kan dat het beste
      gebeuren.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12e.8
    text: |-
      Onverminderd het eerste lid wordt de uitkering aan de gemeente Hengelo verhoogd met een bedrag van € 120.000,– ten
      behoeve van de projectmanagementkosten van het initiatief ‘Aanval op de Uitval’ van de G27.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12e
  - number: 12ea.1
    text: |-
      De uitkering aan de gemeente Leeuwarden kan worden verhoogd met € 300.000,– ten laste van de middelen die vanuit
      hoofdstuk XVIII van de Rijksbegroting voor de jaren 2008 en 2009 ter beschikking worden gesteld ten behoeve van de
      uitvoering door het Nicis Institute van het tweejarige programma ‘Aanval op de Uitval II’ van de G27, ten behoeve
      van activiteiten in de G31, gericht op het opleiden en coachen van gemeenten in de complexiteit van de stedelijke
      regie.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ea
  - number: 12ea.2
    text: |-
      Binnen vier weken na inwerkingtreding van deze regeling dient het college van burgemeester en wethouders van de
      gemeente Leeuwarden, namens het dagelijks bestuur van de G27, bij de minister een aanvraag in tot de verhoging,
      bedoeld in het eerste lid. Een aanvraag die is ingediend voor de inwerkingtreding van dit artikel worden aangemerkt
      als aanvraag als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ea
  - number: 12ea.3
    text: |-
      De minister neemt een beschikking over verlening van de verhoging, bedoeld in het eerste lid, binnen vier weken na
      de inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ea
  - number: 12ea.4
    text: Aan de verlening van de verhoging, bedoeld in het eerste lid, kunnen door de minister voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ea
  - number: 12f.1
    text: |-
      De uitkeringen aan de gemeenten Amsterdam, Rotterdam, Den Haag, Utrecht, Eindhoven, Tilburg, Arnhem, Enschede,
      Zaanstad, Dordrecht en Nijmegen kunnen ten laste van de middelen die vanuit hoofdstuk XVI van de Rijksbegroting
      ter beschikking worden gesteld voor het vergroten van de sportdeelname onder allochtone jeugd op de volgende wijze
      worden verhoogd:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.a
    text: voor Amsterdam met ten hoogste € 3.571.598,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.b
    text: voor Rotterdam met ten hoogste € 2.942.561,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.c
    text: voor Den Haag met ten hoogste € 2.108.468,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.d
    text: voor Utrecht met ten hoogste € 799.779,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.e
    text: voor Eindhoven met ten hoogste € 428.098,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.f
    text: voor Tilburg met ten hoogste € 370.978,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.g
    text: voor Arnhem met ten hoogste € 336.383,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.h
    text: voor Enschede met ten hoogste € 302.729,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.i
    text: voor Zaanstad met ten hoogste € 295.324,–;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.j
    text: voor Dordrecht met ten hoogste € 276.186,–, en
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.1.k
    text: voor Nijmegen met ten hoogste € 267.895,–.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.2
    text: |-
      Binnen vier weken na inwerkingtreding van deze regeling dienen de colleges van burgemeester en wethouders van de
      in het eerste lid genoemde gemeenten bij de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid.
      De aanvraag gaat vergezeld van een wijziging van het meerjaren-ontwikkelingsprogramma. Daarin wordt vastgelegd de
      in de GSB III periode te bereiken resultaten die bijdragen aan het vergroten van de sportdeelname onder allochtone
      jeugd. Aanvragen die zijn ingediend voor de inwerkingtreding van dit artikel worden aangemerkt als aanvragen als
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.3
    text: |-
      In de wijziging van het meerjarenprogramma worden de te bereiken resultaten geformuleerd met inachtneming van
      een of meer door de gemeente te bepalen indicatoren op het gebied van het vergroten van de sportdeelname onder
      allochtone jeugd.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.4
    text: |-
      De minister neemt een beschikking over verlening van een in het eerste lid bedoelde verhoging binnen acht weken
      na de inwerkingtreding van dit artikel. De in het derde lid bedoelde indicator of indicatoren, met bijbehorende
      overeengekomen resultaten, worden voor elk van de elf in het eerste lid genoemde gemeenten afzonderlijk in de
      beschikking tot verlening van de verhoging van de uitkering vastgelegd. De verhoging wordt voor 100% aan de
      indicator of indicatoren toegedeeld met gelijke percentages.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.5
    text: |-
      De Minister kan de verhoging lager vaststellen dan de bedragen genoemd in het eerste lid, indien de in het
      ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12f.6
    text: |-
      De minister geeft niet eerder toepassing aan het vijfde lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12f
  - number: 12g.1
    text: |-
      De uitkeringen aan de centrumgemeenten voor vrouwenopvang, worden verhoogd ten laste van de middelen die
      vanuit hoofdstuk XVI van de Rijksbegroting voor 2008 en 2009 ter beschikking worden gesteld ten behoeve van de
      aanwezigheid van een advies- en steunpunt huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12g
  - number: 12g.2
    text: |-
      Het procentuele aandeel van de betreffende centrumgemeenten wordt voor het jaar 2008 en voor het jaar 2009
      vastgesteld volgens de Tijdelijke stimuleringsregeling advies- en steunpunten huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12g
  - number: 12g.3
    text: |-
      De Minister neemt begin 2008 een beschikking tot verlening van de in het eerste lid bedoelde verhoging, met
      inachtneming van de in het meerjarenontwikkelingsprogramma vastgelegde te bereiken resultaten, bedoeld in
      [artikel 5, tweede lid, van het Besluit][ref1]. De verhoging wordt in zijn geheel toegedeeld aan de indicator,
      bedoeld in [artikel 10, onderdeel r][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12g
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12h.1
    text: |-
      De uitkeringen aan de maatschappelijke centrumgemeenten worden verhoogd ten laste van de middelen die vanuit
      hoofdstuk XVI van de Rijksbegroting voor 2007 en 2008 ter beschikking worden gesteld voor activiteiten op het
      terrein van de openbare geestelijke gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.2
    text: |-
      Het procentuele aandeel van de betreffende maatschappelijke centrumgemeenten in de middelen, bedoeld in het eerste
      lid, wordt voor 2007 en 2008 vastgesteld volgens de volgende verdeelmaatstaven: - 30% via het aantal inwoners van
      de gemeente;
        - 40% via de gewogen maatstaf aantal inwoners met een laag inkomen;
        - 12,5% via het aantal uitkeringsgerechtigden;
        - 12,5% via het aantal 15–30-jarige jongeren (speciaal ontwikkelde maatstaf);
        - 5,0% via het aantal minderheden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.3
    text: |-
      Uiterlijk 1 april 2008 dienen de colleges van burgemeester en wethouders van de betreffende gemeenten bij
      de Minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een
      wijziging van het meerjarenontwikkelingsprogramma, waarin als te bereiken resultaat is vastgelegd dat er een
      Plan van aanpak maatschappelijke opvang is opgesteld, dat door de Minister van Volksgezondheid, Welzijn en Sport
      is goedgekeurd. Als bijlage bij de aanvraag dient tevens dit Plan van aanpak zelf te zijn bijgevoegd. Een Plan
      van aanpak maatschappelijke opvang dat door het college van burgemeester en wethouders van een maatschappelijke
      centrumgemeente is ingediend voor de inwerkingtreding van dit artikel, wordt aangemerkt als een aanvraag als
      bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.4
    text: |-
      De Minister neemt een beschikking tot verlening van een in het eerste lid bedoelde verhoging binnen acht weken na
      het tijdstip waarop de in het derde lid bedoelde aanvraag is ontvangen. Indien het Plan van aanpak maatschappelijke
      opvang van een maatschappelijke centrumgemeente reeds voor de inwerkingtreding van deze regeling door de Minister
      van Volksgezondheid, Welzijn en Sport is goedgekeurd, neemt de Minister een beschikking tot verlening van de in
      het eerste lid bedoelde verhoging binnen acht weken na het tijdstip van de inwerkingtreding van deze regeling. De
      verhoging wordt in zijn geheel toegedeeld aan het in het derde lid bedoelde Plan van aanpak als indicator.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.5
    text: |-
      De Minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien het
      ingediende Plan van aanpak maatschappelijke opvang naar het oordeel van de Minister van Volksgezondheid, Welzijn en
      Sport daartoe aanleiding geeft en niet door laatstgenoemde wordt goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.6
    text: |-
      De Minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij
      het college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van het Plan van
      aanpak maatschappelijke opvang in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.7
    text: |-
      Indien een college van burgemeester en wethouders van een maatschappelijke centrumgemeente geen aanvraag indient
      als bedoeld in het derde lid, dan dient het betreffende college uiterlijk 1 april 2008 bij de Minister een
      aanvraag in tot de verhoging, bedoeld in het eerste lid, waarbij de aanvraag vergezeld gaat van een wijziging
      van het meerjarenontwikkelingsprogramma. In deze wijziging van het meerjarenontwikkelingsprogramma worden de te
      bereiken resultaten opnieuw geformuleerd met inachtneming van de in het meerjarenontwikkelingsprogramma vastgelegde
      te bereiken resultaten, bedoeld in [artikel 5, tweede lid, van het Besluit][ref1], en met inachtneming van de
      indicatoren, bedoeld in [artikel 10, onderdelen h, j en k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12h.8
    text: |-
      De Minister neemt een beschikking tot verlening van een in het eerste lid bedoelde verhoging binnen acht
      weken na het tijdstip waarop de in het zevende lid bedoelde aanvraag is ontvangen. De verhoging wordt in zijn
      geheel toegedeeld aan de indicatoren, bedoeld in [artikel 10, onderdelen h, j en k][ref1], naar rato van de in
      [artikel 11, vierde lid, onderdelen a, c en d][ref2], genoemde percentages.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel11
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '11'
        hoofdstuk: '2'
        afdeling: '4'
  - number: 12h.9
    text: |-
      De Minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien
      de in het ontwikkelingsprogramma opgenomen resultaten, bedoeld in het zevende lid, naar zijn oordeel daartoe
      aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12h.10
    text: |-
      De Minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende maatschappelijke centrumgemeente heeft geïnformeerd waarom hij voornemens is
      daartoe over te gaan en hij het college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een
      aanpassing van de wijziging van het meerjarenontwikkelingsprogramma, bedoeld in het zevende lid, in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12h
  - number: 12ha.1
    text: |-
      Onverminderd de [artikelen 5][ref1] en [12h, eerste lid][ref2], worden de uitkeringen aan de maatschappelijke
      centrumgemeenten Amsterdam, Rotterdam, Den Haag en Utrecht verhoogd ten laste van de middelen die vanuit hoofdstuk
      XVI van de Rijksbegroting voor 2007 en 2008 ter beschikking worden gesteld ten behoeve van de voorfinanciering van
      een eventuele herverdeling van de verdeelsleutel maatschappelijke opvang en voor de voortgang in de uitvoering van
      het Plan van aanpak maatschappelijk opvang, bedoeld in [artikel 12h, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel12h
      [ref3]: https://wetten.overheid.nl/BWBR0018516#Artikel12h
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ha
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '5'
        hoofdstuk: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: 12h
        hoofdstuk: '2'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0018516
        artikel: 12h
        hoofdstuk: '2'
        afdeling: '5'
  - number: 12ha.2
    text: |-
      Het procentuele aandeel van de betreffende maatschappelijke centrumgemeenten in de middelen, bedoeld in het eerste
      lid, wordt voor 2007 en 2008 vastgesteld volgens de verdeling die is gebaseerd op de kostenraming zoals opgenomen
      in het Plan van aanpak maatschappelijke opvang van de betrokken centrumgemeenten.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ha
  - number: 12ha.3
    text: |-
      De in het eerste lid bedoelde verhoging wordt in zijn geheel toegedeeld aan de indicator, bedoeld
      in [artikel 10, onderdeel k][ref1], of aan elk van de subindicatoren op de wijze als aangegeven in
      [artikel 10, onderdeel k][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel10
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel12ha
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0018516
        artikel: '10'
        hoofdstuk: '2'
        afdeling: '4'
  - number: '13.1'
    text: |-
      Ten behoeve van het meten van de maatschappelijke effecten die zijn bereikt met de uitvoering van het
      ontwikkelingsprogramma worden periodiek gegevens verzameld op basis van de volgende indicatoren:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.a
    text: 'slachtofferschap:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.a.i
    text: |-
      vermogensdelicten: het aantal respondenten dat in het voorafgaande jaar binnen het grondgebied van de gemeente
      te maken heeft gehad met poging tot inbraak, inbraak, fietsendiefstal, diefstal uit auto’s, diefstal van auto’s,
      diefstal of vernieling aan de buitenkant van auto’s en zakkenrollerij;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.a.ii
    text: |-
      geweldsdelicten: het aantal respondenten dat in het voorafgaande jaar binnen het grondgebied van de gemeente te
      maken heeft gehad met diefstal met geweld, mishandeling en bedreiging;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.b
    text: een meting van de onveiligheidsgevoelens in de buurt;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.c
    text: 'verloedering: een schaalscore, gebaseerd op de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.c.i
    text: bekladding van muren en gebouwen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.c.ii
    text: vernieling van telefooncellen, bus- en tramhokjes;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.c.iii
    text: rommel op straat;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.c.iv
    text: hondenpoep op straat;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.d
    text: 'sociale kwaliteit: een schaalscore, gebaseerd op de reacties op de volgende stellingen:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.d.i
    text: de mensen in de buurt kennen elkaar nauwelijks;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.d.ii
    text: de mensen gaan op een prettige manier met elkaar om;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.d.iii
    text: ik woon in een buurt waar veel saamhorigheid is;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13.1.d.iv
    text: ik voel mij thuis bij de mensen die hier wonen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: '13.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden zowel op het niveau van de wijk als op het niveau van de gemeente
      verzameld.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: '13.3'
    text: |-
      Het college van burgemeester en wethouders verstrekt de in het eerste lid bedoelde gegevens uiterlijk op 30 juni
      2005, 31 mei 2007 en 15 juli 2010 aan de minister.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: '13.4'
    text: |-
      De uiterlijk per 30 juni 2005 te verstrekken gegevens hebben zoveel mogelijk betrekking op de stand per 31 december
      2004, voorzover in het eerste lid niet anders is aangegeven.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: '13.5'
    text: |-
      De in 2007 en 2010 te verstrekken gegevens die voortkomen uit registratiesystemen hebben zoveel mogelijk betrekking
      op de stand per 31 december 2006, respectievelijk 31 december 2009. Voorzover het college van burgemeester
      en wethouders gebruik maakt van enquêtes, worden deze uitgevoerd in de periode oktober 2006–maart 2007,
      respectievelijk 15 september–31 december 2009 en hebben deze betrekking op 2006, respectievelijk 2009.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13
  - number: 13a
    text: |-
      Besteding van de middelen, bestemd voor de inburgering van inburgeraars, voldoet aan de eisen, gesteld in dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13a
  - number: 13b.1
    text: |-
      Het college van burgemeester en wethouders kan aan een inburgeraar een inburgeringsvoorziening of een gecombineerde
      inburgeringsvoorziening aanbieden die op de persoonlijke situatie van de inburgeraar is afgestemd. Indien de
      inburgeraar daarom verzoekt, kan de inburgeringsvoorziening of de inburgeringscomponent van de gecombineerde
      inburgeringsvoorziening worden aangeboden in de vorm van een persoonlijk inburgeringsbudget.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13b
  - number: 13b.2
    text: |-
      Zowel een inburgeringsvoorziening als een gecombineerde inburgeringsvoorziening bereidt voor op en leidt toe naar
      het inburgeringsexamen of het staatsexamen en omvat het eenmaal kosteloos afleggen van het desbetreffende examen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13b
  - number: 13b.3
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat de inburgeringsvoorziening, dan wel de
      gecombineerde inburgeringsvoorziening, uiterlijk 31 december van het tweede kalenderjaar na het jaar waarin
      de voorziening is vastgesteld, wordt afgesloten door middel van deelname aan het inburgeringsexamen of het
      staatsexamen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13b
  - number: 13b.4
    text: |-
      De inburgeraar is de in [artikel 23, tweede lid, van de wet][ref1] bedoelde eigen bijdrage verschuldigd,
      tenzij hij op last van het college van burgemeester en wethouders, dan wel een andere instantie, genoemd in
      [artikel 21, tweede lid, van de wet][ref2], een gecombineerde inburgeringsvoorziening dient te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel21
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '21'
  - number: 13c.1
    text: |-
      Indien een inburgeraar in aanmerking wordt gebracht voor een inburgeringsvoorziening of een gecombineerde
      inburgeringsvoorziening doet het college van burgemeester en wethouders de inburgeraar terzake een aanbod.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13c
  - number: 13c.2
    text: |-
      Indien het aanbod, bedoeld in het eerste lid, geheel of gedeeltelijk bestaat uit een persoonlijk inburgeringsbudget
      begeleidt het college van burgemeester en wethouders de inburgeraar op diens verzoek bij de vormgeving van
      zijn inburgeringsprogramma en de keuze van een inburgeringsbedrijf. Het college van burgemeester en wethouders
      beoordeelt het voorstel van de inburgeraar en sluit vervolgens een overeenkomst met het inburgeringsbedrijf.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13c
  - number: 13c.3
    text: |-
      Indien een inburgeraar tevens geestelijke bedienaar is, wordt hem onverminderd het bepaalde in het eerste en tweede
      lid, de cursus, bedoeld in [artikel 4.25 van de Regeling inburgering][ref1] aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0020657#Artikel4
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0020657
        artikel: '4'
  - number: 13c.4
    text: |-
      Het college van burgemeester en wethouders doet geen aanbod aan een inburgeraar met wie eerder een overeenkomst als
      bedoeld in [artikel 13d][ref1] is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13d
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 13d
        hoofdstuk: '4'
  - number: 13d.1
    text: |-
      Tegelijkertijd met het doen van het aanbod, bedoeld in [artikel 13c, eerste lid][ref1], informeert het college van
      burgemeester en wethouders de inburgeraar omtrent de hoofdlijnen van de met hem te sluiten overeenkomst terzake van
      de vaststelling van zijn inburgeringsvoorziening, dan wel gecombineerde inburgeringsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13c
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 13c
        hoofdstuk: '4'
  - number: 13d.2
    text: |-
      Indien de inburgeraar het aanbod, bedoeld in [artikel 13c, eerste lid][ref1], aanvaardt, sluit het college van
      burgemeester en wethouders de in het eerste lid bedoelde overeenkomst met de inburgeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13c
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 13c
        hoofdstuk: '4'
  - number: 13d.3
    text: |-
      De overeenkomst bevat ten minste een omschrijving van de rechten en verplichtingen van de inburgeraar ten aanzien
      van:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13d.3.a
    text: de termijn waarbinnen de inburgeraar moet hebben deelgenomen aan het inburgeringsexamen dan wel het staatsexamen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13d.3.b
    text: de verschuldigdheid van de eigen bijdrage en de mogelijkheid van betaling in termijnen;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13d.3.c
    text: |-
      de verlening van toestemming om de in de [bijlage bij artikel 6.1, tweede lid, van het Besluit inburgering]
      (onbekend) bedoelde (persoons)gegevens welke betrekking hebben op de inburgeraar, op te nemen in het
      Informatiesysteem Inburgering;
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13d.3.d
    text: de gevolgen van niet-nakoming van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13d.4
    text: De overeenkomst wordt door partijen niet later ondertekend dan 31 december 2009.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13d
  - number: 13e.1
    text: Indien de inburgeraar het inburgeringsexamen heeft behaald, ontvangt hij het inburgeringsdiploma.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13e
  - number: 13e.2
    text: Het inburgeringsdiploma wordt uitgereikt door de IB-Groep.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13e
  - number: 13f.1
    text: |-
      Het college van burgemeester en wethouders, de exameninstellingen, de IB-Groep en de Minister voor
      Vreemdelingenzaken en Integratie verstrekken aan de beheerder van het Informatiesysteem Inburgering uit eigen
      beweging of op verzoek kosteloos alle gegevens die noodzakelijk zijn voor de uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: 13f.2
    text: |-
      De IB-Groep verstrekt aan de Minister voor Vreemdelingenzaken en Integratie, alsmede het college van burgemeester
      en wethouders, uit eigen beweging of op verzoek alle gegevens die noodzakelijk zijn voor de uitvoering van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: 13f.3
    text: 'In het Informatiesysteem Inburgering met betrekking tot inburgeraars opgenomen persoonsgegevens worden verwijderd:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: 13f.3.a
    text: na verloop van twintig jaren, of
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: 13f.3.b
    text: indien de betrokken persoon is overleden.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: 13f.4
    text: |-
      De termijn, bedoeld in het derde lid, onderdeel a, vangt aan op de dag waarop de gegevens in het Informatiesysteem
      Inburgering zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel13f
  - number: '14.1'
    text: |-
      Het bedrag dat jaarlijks ambtshalve aan voorschotten op het programmadeel wordt verleend, is de uitkomst van de
      formule 0,20 × M + ((0,40 × Inwgemmo/Inwcgmo) + 0,50 × ((Linkgemmo × Kpreggemmo)/(Linkcgmo × Kpregcgmo)) + 0.10 ×
      (Ugemmo/Ucgmo)) × (Midmocgmo –Basismocgmo)+Basismogem + (0,90 × (Inwgemvo/Inwcgvo) + 0,10 × (Mingemvo/Mincgvo)) ×
      ((Midvo – Basisvocgvo))+Basisvogem + N + Q + R. In deze formule is - M: het bedrag van de aandelen van de gemeente
      in de middelen voor veiligheid en leefbaarheid, voor het terugdringen van voortijdig schoolverlaten en voor de
      bestrijding van gezondheidsachterstanden;
        - Inwgemmo: het aantal inwoners in het maatschappelijke zorggebied van de gemeente, op 1 januari van het
      voorafgaande kalenderjaar;
        - Inwcgmo: het aantal inwoners in de maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten op 1
      januari van het voorafgaande kalenderjaar;
        - Linkgemmo: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref1], in het maatschappelijke zorggebied van de gemeente
      volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek van het CBS;
        - Linkcgmo: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref2], in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek
      van het CBS;
        - Kpreggemmo: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref3] op 1 januari van het voorafgaande kalenderjaar in
      het maatschappelijke zorggebied van de gemeente;
        - Kpregcgmo: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref4] op 1 januari van het voorafgaande kalenderjaar in de
      maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten;
        - Ugemmo: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref5] in het maatschappelijke zorggebied
      van de gemeente, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref6] in dat gebied, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Ucgmo: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref7] in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref8] in die gebieden, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Midmocgmo: het deel van de middelen voor maatschappelijke opvang en verslavingsbeleid dat aan het kalenderjaar is
      toe te rekenen;
        - Basismocgmo: het deel van de basisbedragen voor maatschappelijke opvang en verslavingsbeleid van de
      maatschappelijke centrumgemeenten dat aan het kalenderjaar is toe te rekenen;
        - Basismogem: het deel van het basisbedrag voor maatschappelijke opvang en verslavingsbeleid van de gemeente dat
      aan het kalenderjaar is toe te rekenen;
        - Inw: het aantal inwoners;
        - Inwgemvo: het aantal inwoners van het zorggebied voor vrouwenopvang van de gemeente;
        - Inwcgvo: het aantal inwoners van de centrumgemeenten voor vrouwenopvang en de regiogemeenten op 1 januari van het
      voorafgaande kalenderjaar;
        - Mingemvo: Het totaal van het aantal inwoners op 1 januari van het voorafgaande kalenderjaar
      in het zorggebied voor vrouwenopvang van de gemeente volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref9];
        - Mincgvo: Het totaal van het aantal inwoners op 1 januari van het voorafgaande kalenderjaar in de zorggebieden
      voor vrouwenopvang van de centrumgemeenten voor vrouwenopvang volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref10];
        - Midvo: het deel van de middelen voor vrouwenopvang dat aan het kalenderjaar is toe te rekenen;
        - Basisvocgvo: het deel van de basisbedragen voor vrouwenopvang van de centrumgemeenten voor vrouwenopvang dat aan
      het kalenderjaar is toe te rekenen;
        - Basisvogem: het deel van het basisbedrag voor vrouwenopvang van de gemeente dat aan het kalenderjaar is toe
      rekenen;
        - N: het aan het kalenderjaar op basis van het tweede lid toe te rekenen bedrag van de gemeente voor de extra
      veiligheidsmiddelen;
        - Q: de op basis van de [artikelen 14b, eerste lid][ref11], en [14c][ref12] vast te stellen voorschotten voor
      inburgering;
        - R: de op basis van de [artikelen 14b, derde lid][ref13], en [14c][ref14] vast te stellen voorschotten voor
      inburgering.


