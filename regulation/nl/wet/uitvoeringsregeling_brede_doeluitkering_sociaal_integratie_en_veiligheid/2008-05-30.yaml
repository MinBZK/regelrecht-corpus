        artikel: 12h
        hoofdstuk: '2'
        afdeling: '5'
  - number: 14.14.b
    text: |-
      Het procentuele aandeel aan de maatschappelijke centrumgemeenten Amsterdam, Rotterdam, Den Haag en Utrecht,
      bedoeld in [artikel 12ha, tweede lid][ref1], wordt door de minister voor de jaren 2007 en 2008 beschikbaar gesteld,
      onverminderd de verhoging bedoeld in onderdeel a. Het voorschot betreft een vooruitbetaling, vooruitlopend op
      de beschikking tot verlening, bedoeld als voorfinanciering van een eventuele herverdeling van de verdeelsleutel
      maatschappelijke opvang en voor de voortgang in de uitvoering van het Plan van aanpak maatschappelijk opvang van de
      betrokken centrumgemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12ha
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
    references:
