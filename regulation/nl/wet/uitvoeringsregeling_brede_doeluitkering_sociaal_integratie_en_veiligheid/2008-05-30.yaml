    text: |-
      De aan gemeenten te verlenen voorschotten ten behoeve van de impuls ‘Sociale Herovering’ worden op de volgende
      wijze verleend:
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.10.a
    text: |-
      De aan de gemeenten, genoemd in [artikel 12d][ref1], te verlenen voorschotten worden verhoogd met € 808.333,– voor
      het jaar 2006 en met € 1.191.667,– voor het jaar 2007;


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12d
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
