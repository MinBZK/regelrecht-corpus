  - number: '14.14'
    text: 'De aan de maatschappelijke centrumgemeenten te verlenen voorschotten worden op de volgende wijze verleend:'
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
  - number: 14.14.a
    text: |-
      De aan de maatschappelijke centrumgemeenten te verlenen voorschotten worden voor de jaren 2007 en
      2008 verhoogd met het bedrag dat de minister op grond van [artikel 12h, vierde en vijfde lid][ref1]
      respectievelijk achtste en negende lid, heeft verleend. Indien een maatschappelijke centrumgemeente bij
      de inwerkingtreding van deze regeling niet beschikt over een door de minister van Volksgezondheid, Welzijn
      en Sport goedgekeurd Plan van aanpak maatschappelijke opvang, wordt het procentuele aandeel, bedoeld
      in [artikel 12h, tweede lid][ref2], door de minister als voorschot vóór 1 augustus 2007 respectievelijk
      1 augustus 2008 beschikbaar gesteld, vooruitlopend op de beschikking tot verlening, als bedoeld in
      [artikel 12h, vierde en vijfde lid respectievelijk achtste en negende lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel12h
      [ref2]: https://wetten.overheid.nl/BWBR0018516#Artikel12h
      [ref3]: https://wetten.overheid.nl/BWBR0018516#Artikel12h
    url: https://wetten.overheid.nl/BWBR0018516/2008-05-30#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018516
        artikel: 12h
        hoofdstuk: '2'
