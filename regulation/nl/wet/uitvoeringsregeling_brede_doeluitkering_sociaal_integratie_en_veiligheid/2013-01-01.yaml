      Besteding van de middelen, bestemd voor de inburgering van inburgeraars, voldoet aan de eisen, gesteld in dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel13a
  - number: 13b
    text: |-
      1 Het college van burgemeester en wethouders kan aan een inburgeraar een inburgeringsvoorziening, een
      gecombineerde inburgeringsvoorziening of, indien de inburgeraar een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a en b, van de Wet educatie en beroepsonderwijs][ref1] volgt of zal
      volgen, een taalkennisvoorziening aanbieden die op de persoonlijke situatie van de inburgeraar is afgestemd.
      Indien de inburgeraar daarom verzoekt, kan de inburgeringsvoorziening, de inburgeringscomponent van de
      gecombineerde inburgeringsvoorziening of de taalkennisvoorziening worden aangeboden in de vorm van een persoonlijk
      inburgeringsbudget.

      2 Zowel een inburgeringsvoorziening als een gecombineerde inburgeringsvoorziening bereidt voor op en leidt toe naar
      het inburgeringsexamen of het staatsexamen en omvat het eenmaal kosteloos afleggen van het desbetreffende examen.

      3 Het college van burgemeester en wethouders draagt er zorg voor dat de inburgeringsvoorziening, dan wel de
      gecombineerde inburgeringsvoorziening, uiterlijk 31 december van het tweede kalenderjaar na het jaar waarin
      de voorziening is vastgesteld, wordt afgesloten door middel van deelname aan het inburgeringsexamen of het
      staatsexamen.

      4 De inburgeraar is de in [artikel 23, tweede lid, van de wet][ref2] bedoelde eigen bijdrage verschuldigd,
      tenzij hij op last van het college van burgemeester en wethouders, dan wel een andere instantie, genoemd in
      [artikel 21, tweede lid, van de wet][ref3], een gecombineerde inburgeringsvoorziening dient te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0020611#Artikel21
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel13b
