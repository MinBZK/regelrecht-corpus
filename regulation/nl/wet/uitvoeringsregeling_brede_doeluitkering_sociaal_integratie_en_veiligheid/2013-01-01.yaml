  - number: 9a
    text: |-
      1 Het aandeel van de gemeente in de middelen voor inburgering, bedoeld in
      [artikel 4, eerste lid, onderdeel Q, van het Besluit][ref1], voor de jaren 2007, 2008 en 2009 wordt bepaald volgens
      de formule { ( [ A × B ] + [ C × D ] + [ E × F ] + [ G × H ] + [ I × J ] + [ K × L ] + [ M × N ] + [ O × P ] + [ Q
      × R ] + [ S x T ] ) × U } + V + W.

      In deze formule is

      A: het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van burgemeester en wethouders
      voor de eerste keer een inburgeringsvoorziening heeft vastgesteld;

      B: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening, bedoeld in letter A;

      C: het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van burgemeester en wethouders
      voor de eerste keer een gecombineerde inburgeringsvoorziening heeft vastgesteld;

      D: de bijdragevergoeding ten aanzien van de vaststelling van de gecombineerde inburgeringsvoorziening, bedoeld in
      letter C;

      E: het aantal inburgeringsplichtigen aan wie het college van burgemeester en wethouders een handhavingsbeschikking
      bekend heeft gemaakt, dan wel een kennisgeving heeft verstrekt;

      F: de bijdragevergoeding ten aanzien van de bekendmaking van een handhavingsbeschikking en de verstrekking van
      een kennisgeving;

      G: het aantal geestelijke bedienaren ten behoeve van wie het college van burgemeester en wethouders voor de eerste
      keer een inburgeringsvoorziening heeft vastgesteld;

      H: de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening voor geestelijke
      bedienaren;

      I: het aantal in de letter A bedoelde inburgeringsplichtigen en inburgeraars ten behoeve van wie het college
      van burgemeester en wethouders een inburgeringsvoorziening heeft vastgesteld en dat heeft deelgenomen aan het
      inburgeringsexamen of het staatsexamen;

      J: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld in
      letter I;

      K: het aantal in de letter C bedoelde inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van
      burgemeester en wethouders een gecombineerde inburgeringsvoorziening heeft vastgesteld en dat heeft deelgenomen aan
      het inburgeringsexamen of het staatsexamen;

      L: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld in
      letter K;

      M: het aantal geestelijke bedienaren dat heeft deelgenomen aan het inburgeringsexamen of het staatsexamen;

      N: de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen of het staatsexamen, bedoeld in
      letter M;

      O: het aantal geestelijke bedienaren dat heeft deelgenomen aan het aanvullende praktijkdeel van het
      inburgeringsexamen of het staatsexamen, bedoeld in [artikel 3.8 van het Besluit inburgering][ref2] zoals dit luidde
      op 31 december 2012;

      P: de bijdragevergoeding ten aanzien van de deelname aan het aanvullende praktijkdeel van het inburgeringsexamen of
      het staatsexamen, bedoeld in [artikel 3.8 van het Besluit inburgering][ref3] zoals dit luidde op 31 december 2012;

      Q: het aantal door het college van burgemeester en wethouders in 2007 op grond van de
      [Wet inburgering nieuwkomers][ref4], zoals die luidde op 31 december 2006, genomen beschikkingen omtrent een
      inburgeringsprogramma;

      R: de bijdragevergoeding ten aanzien van een beschikking omtrent een inburgeringsprogramma als bedoeld in letter Q;

      S: het aantal door het college van burgemeester en wethouders in 2007 en 2008 ontvangen afschriften
      van door het bevoegd gezag van een instelling ingevolge de [Wet inburgering nieuwkomers][ref5],
      zoals die luidde op 31 december 2006, uitgereikte verklaringen als bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref6], zoals dat artikel luidde op 31
      december 2006, die betrekking hebben op in 2006 en 2007 aangevangen inburgeringsprogramma’s;

      T: de bijdragevergoeding ten aanzien van een verklaring als bedoeld in letter S;

      U: de door de Minister vast te stellen correctiefactor;

      V: het bedrag, bedoeld in [artikel 9, vierde lid, onderdeel a, onder 2° van het Besluit][ref7];

      W: het bedrag, bedoeld in [artikel 7, eerste lid, onderdeel o, onder 4°, van het Besluit][ref8].

      2 Het aandeel van de gemeente in de middelen voor inburgering, bedoeld in het eerste lid, aanhef, wordt voor de
      jaren 2008 en 2009 verhoogd met de uitkomst van de formule [X x Y]+ [Z x AA], in welke formule voorstelt:

      a. X: het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van burgemeester en
      wethouders voor de eerste keer een duale inburgeringsvoorziening heeft vastgesteld;

      b. Y: de bijdragevergoeding ten aanzien van de vaststelling van de duale inburgeringsvoorziening, bedoeld in letter
      X;

      c. Z:het aantal inburgeringsplichtigen en inburgeraars ten behoeve van wie het college van burgemeester en
      wethouders na 1 september 2008 voor de eerste keer een taalkennisvoorziening heeft vastgesteld, en

      d. AA: de bijdragevergoeding ten aanzien van de vaststelling van de taalkennisvoorziening, bedoeld in letter Z.

      3 Het aandeel van de gemeente in de middelen voor inburgering, bedoeld in
      [artikel 4, eerste lid, onderdeel R, van het Besluit][ref9], voor de jaren 2008 en 2009 wordt bepaald volgens de
      formule ( A × B) + ( C × D)+ (E x F)+ (G x H).

      In deze formule is

      A. het aantal inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12
      juni 2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend
      budget is verstrekt, ten behoeve van wie het college van burgemeester en wethouders voor de eerste keer een
      inburgeringsvoorziening heeft vastgesteld;

      B. de bijdragevergoeding ten aanzien van de vaststelling van de inburgeringsvoorziening, bedoeld in letter A;

      C. het aantal in de letter A bedoelde inburgeringsplichtigen dat binnen drie kalenderjaren nadat voor hen de
      inburgeringsvoorziening is vastgesteld, heeft deelgenomen aan het inburgeringsexamen;

      D. de bijdragevergoeding ten aanzien van de deelname aan het inburgeringsexamen;

      E. het aantal inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni
      2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend budget
      is verstrekt, ten behoeve van wie het college van burgemeester en wethouders voor de eerste keer een duale
      inburgeringsvoorziening heeft vastgesteld;

      F. de bijdragevergoeding ten aanzien van de vaststelling van de duale inburgeringsvoorziening, bedoeld in letter E;

      G. het aantal inburgeringsplichtigen, bedoeld in het besluit van de Staatssecretaris van Justitie van 12 juni
      2007, nr. 2007/11, houdende wijziging van de Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend budget is
      verstrekt, ten behoeve van wie het college van burgemeester en wethouders na 1 september 2008 voor de eerste keer
      een taalkennisvoorziening heeft vastgesteld, en

      H. de bijdragevergoeding ten aanzien van de vaststelling van de taalkennisvoorziening, bedoeld in letter G.

      4 Bij het vaststellen van het programmadeel als bedoeld in [artikel 27, eerste lid, van het Besluit][ref10], wordt
      bij de berekening van het aandeel, bedoeld in het eerste en tweede lid van dit artikel, uitgegaan van de door de
      gemeente gerealiseerde aantallen, bedoeld in de letters A, C, E, G, I, K, M, O, Q en S van het eerste lid, X en Z
      van het tweede lid, respectievelijk de letters A, C, E en G van het derde lid.


