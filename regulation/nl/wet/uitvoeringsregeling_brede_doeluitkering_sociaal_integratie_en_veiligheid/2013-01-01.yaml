  - number: 14b
    text: |-
      1 Het bedrag dat aan voorschotten op het aandeel in de middelen voor inburgering, bedoeld in
      [artikel 4, eerste lid, onderdeel Q, van het Besluit][ref1], voor de jaren 2007, 2008 en 2009 wordt verleend is de
      uitkomst van:

      a. de formule [ A × B ] + [ C × D ] + [ E × F ] + G indien het meerjaren ontwikkelingsprogramma van een gemeente
      met betrekking tot de in [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref2] genoemde
      onderdelen niet tot gevolg heeft dat de voor die gemeente gegeven indicatieve rijksbijdrage moet worden verhoogd;

      b. de formule [ A × B ] + [ C × D ] + [ E × F ] + G indien het meerjaren ontwikkelingsprogramma van een gemeente
      met betrekking tot de in [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref3] genoemde
      onderdelen tot gevolg heeft dat de voor die gemeente gegeven indicatieve rijksbijdrage moet worden verhoogd en de
      jaarlijks vanuit hoofdstuk VI van de Rijksbegroting ten behoeve van de G30 te verstrekken middelen voor inburgering
      daartoe toereikend zijn;

      c. de formule [ A × B ] + [ C × D ] + [ E × F ] + [ H × I ] + G indien het meerjaren ontwikkelingsprogramma van
      een gemeente met betrekking tot de in [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref4]
      genoemde onderdelen tot gevolg heeft dat de voor die gemeente gegeven indicatieve rijksbijdrage moet worden
      verhoogd en de jaarlijks vanuit hoofdstuk VI van de Rijksbegroting ten behoeve van de G30 te verstrekken middelen
      voor inburgering daartoe niet toereikend zijn.

      2 In de formules, genoemd in het eerste lid, is

      A: het in het meerjaren ontwikkelingsprogramma opgenomen aantal door het college van burgemeester en wethouders
      vast te stellen inburgerings-voorzieningen ten behoeve van inburgeringsplichtigen en inburgeraars;

      B: de voorschotvergoeding ten aanzien van de in de letter A bedoelde inburgeringsvoorziening;

      C: het in het meerjaren ontwikkelingsprogramma opgenomen aantal door het college van burgemeester en wethouders
      vast te stellen gecombineerde inburgeringsvoorzieningen ten behoeve van inburgeringsplichtigen en inburgeraars;

      D: de voorschotvergoeding ten aanzien van de in letter C bedoelde gecombineerde inburgeringsvoorziening;

      E: het in het meerjaren ontwikkelingsprogramma opgenomen aantal door het college van burgemeester en wethouders
      bekend te maken handhavings-beschikkingen en te verstrekken kennisgevingen;

      F: de voorschotvergoeding ten aanzien van de in letter E bedoelde handhavingsbeschikking en kennisgeving;

      G: het bedrag, bedoeld in [artikel 9, vierde lid, onderdeel a, onder 2°, van het Besluit][ref5];

      H: het na toepassing van de in het eerste lid, onderdelen a en b, weergegeven formules resterende deel van
      de jaarlijks vanuit hoofdstuk VI van de Rijksbegroting ten behoeve van de G30 te verstrekken middelen voor
      inburgering;

      I: het relatieve aandeel in de overtekening van de jaarlijks vanuit hoofdstuk VI van
      de Rijksbegroting te verstrekken middelen voor inburgering van de gemeente die op de in
      [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref6] genoemde onderdelen een hoger
      meerjaren ontwikkelingsprogramma heeft ingediend dan de voor de gemeente gegeven indicatieve rijksbijdrage toelaat.

      3 Het bedrag, bedoeld in het eerste lid, wordt ten behoeve van het aanbieden van duale inburgeringsvoorzieningen
      voor de jaren 2008 en 2009 verhoogd met een bedrag dat wordt vastgesteld naar evenredigheid van het aandeel van
      de gemeente in het aantal in Nederland woonachtige leden van etnische minderheidsgroepen uit de eerste generatie
      die behoren tot de groep niet-westerse allochtonen, alsmede allochtonen afkomstig uit voormalig Joegoslavië en de
      voormalige Sovjet-Unie in de leeftijdscategorie 15 tot en met 65 jaar.

      4 Het bedrag dat aan voorschotten op het aandeel in de middelen voor inburgering, bedoeld in
      [artikel 4, eerste lid, onderdeel R, van het Besluit][ref7], voor de jaren 2008 en 2009 wordt verleend, wordt
      ambtshalve door de minister vastgesteld.

      5 Indien het eerste lid, aanhef en onderdeel c, van toepassing is, is het voorschot
      voor een gemeente niet hoger dan het met het door die gemeente op de onderdelen van
      [artikel 7, eerste lid, onderdeel o, onder 1° en 2°, van het Besluit][ref8] ingediende meerjaren
      ontwikkelingsprogramma corresponderende indicatieve rijksbijdrage.


