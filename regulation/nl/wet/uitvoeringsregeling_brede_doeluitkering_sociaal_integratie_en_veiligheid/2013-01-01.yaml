  - number: 13d
    text: |-
      1 Tegelijkertijd met het doen van het aanbod, bedoeld in [artikel 13c, eerste lid][ref1], informeert het college
      van burgemeester en wethouders de inburgeraar omtrent de hoofdlijnen van de met hem te sluiten overeenkomst
      terzake van de vaststelling van zijn inburgeringsvoorziening, gecombineerde inburgeringsvoorziening of
      taalkennisvoorziening.

      2 Indien de inburgeraar het aanbod, bedoeld in [artikel 13c, eerste lid][ref2], aanvaardt, sluit het college van
      burgemeester en wethouders de in het eerste lid bedoelde overeenkomst met de inburgeraar.

      3 De overeenkomst bevat ten minste een omschrijving van de inburgeringsvoorziening, de gecombineerde
      inburgeringsvoorziening of de taalkennisvoorziening, alsmede een omschrijving van de rechten en verplichtingen van
      de inburgeraar ten aanzien van:

      a. de termijn waarbinnen de inburgeraar moet hebben deelgenomen aan het inburgeringsexamen dan wel het
      staatsexamen;

      b. de verschuldigdheid van de eigen bijdrage en de mogelijkheid van betaling in termijnen;

      c. de verlening van toestemming om de in de [bijlage bij artikel 6.1, tweede lid, van het Besluit inburgering]
      (onbekend) zoals dit luidde op 31 december 2012 bedoelde (persoons)gegevens welke betrekking hebben op de
      inburgeraar, op te nemen in het Informatiesysteem Inburgering;

      d. de gevolgen van niet-nakoming van de overeenkomst.

      4 De overeenkomst wordt door partijen niet later ondertekend dan 31 december 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel13c
