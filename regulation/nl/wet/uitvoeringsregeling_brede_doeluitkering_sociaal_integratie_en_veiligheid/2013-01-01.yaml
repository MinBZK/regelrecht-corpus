    text: |-
      1 Het college van burgemeester en wethouders, de exameninstellingen en de minister verstrekken aan de beheerder van
      het Informatiesysteem Inburgering uit eigen beweging of op verzoek kosteloos alle gegevens die noodzakelijk zijn
      voor de uitvoering van dit hoofdstuk.

      2 De Minister verstrekt aan het college van burgemeester en wethouders, uit eigen beweging of op verzoek alle
      gegevens die noodzakelijk zijn voor de uitvoering van dit hoofdstuk.

      3 In het Informatiesysteem Inburgering met betrekking tot inburgeraars opgenomen persoonsgegevens worden
      verwijderd:

      a. na verloop van twintig jaren, of

      b. indien de betrokken persoon is overleden.

      4 De termijn, bedoeld in het derde lid, onderdeel a, vangt aan op de dag waarop de gegevens in het
      Informatiesysteem Inburgering zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel13f
  - number: '14'
    text: |-
      1 Het bedrag dat jaarlijks ambtshalve aan voorschotten op het programmadeel wordt verleend, is de uitkomst van
      de formule

      0,20 × M + ((0,40 × Inwgemmo/Inwcgmo) + 0,50 × ((Linkgemmo × Kpreggemmo)/(Linkcgmo × Kpregcgmo)) + 0.10 × (Ugemmo/
      Ucgmo)) × (Midmocgmo –Basismocgmo)+Basismogem + (0,90 × (Inwgemvo/Inwcgvo) + 0,10 × (Mingemvo/Mincgvo)) × ((Midvo –
      Basisvocgvo))+Basisvogem + N + Q + R.

      In deze formule is

        - M: het bedrag van de aandelen van de gemeente in de middelen voor veiligheid en leefbaarheid, voor het
      terugdringen van voortijdig schoolverlaten en voor de bestrijding van gezondheidsachterstanden;
        - Inwgemmo: het aantal inwoners in het maatschappelijke zorggebied van de gemeente, op 1 januari van het
      voorafgaande kalenderjaar;
        - Inwcgmo: het aantal inwoners in de maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten op 1
      januari van het voorafgaande kalenderjaar;
        - Linkgemmo: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref1], in het maatschappelijke zorggebied van de gemeente
      volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek van het CBS;
        - Linkcgmo: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref2], in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek
      van het CBS;
        - Kpreggemmo: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref3] op 1 januari van het voorafgaande kalenderjaar in
      het maatschappelijke zorggebied van de gemeente;
        - Kpregcgmo: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref4] op 1 januari van het voorafgaande kalenderjaar in de
      maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten;
        - Ugemmo: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref5] in het maatschappelijke zorggebied
      van de gemeente, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref6] in dat gebied, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Ucgmo: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref7] in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref8] in die gebieden, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Midmocgmo: het deel van de middelen voor maatschappelijke opvang en verslavingsbeleid dat aan het kalenderjaar is
      toe te rekenen;
        - Basismocgmo: het deel van de basisbedragen voor maatschappelijke opvang en verslavingsbeleid van de
      maatschappelijke centrumgemeenten dat aan het kalenderjaar is toe te rekenen;
        - Basismogem: het deel van het basisbedrag voor maatschappelijke opvang en verslavingsbeleid van de gemeente dat
      aan het kalenderjaar is toe te rekenen;
        - Inw: het aantal inwoners;
        - Inwgemvo: het aantal inwoners van het zorggebied voor vrouwenopvang van de gemeente;
        - Inwcgvo: het aantal inwoners van de centrumgemeenten voor vrouwenopvang en de regiogemeenten op 1 januari van het
      voorafgaande kalenderjaar;
        - Mingemvo: Het totaal van het aantal inwoners op 1 januari van het voorafgaande kalenderjaar
      in het zorggebied voor vrouwenopvang van de gemeente volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref9];
        - Mincgvo: Het totaal van het aantal inwoners op 1 januari van het voorafgaande kalenderjaar in de zorggebieden
      voor vrouwenopvang van de centrumgemeenten voor vrouwenopvang volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref10];
        - Midvo: het deel van de middelen voor vrouwenopvang dat aan het kalenderjaar is toe te rekenen;
        - Basisvocgvo: het deel van de basisbedragen voor vrouwenopvang van de centrumgemeenten voor vrouwenopvang dat aan
      het kalenderjaar is toe te rekenen;
        - Basisvogem: het deel van het basisbedrag voor vrouwenopvang van de gemeente dat aan het kalenderjaar is toe
      rekenen;
        - N: het aan het kalenderjaar op basis van het tweede lid toe te rekenen bedrag van de gemeente voor de extra
      veiligheidsmiddelen;
        - Q: de op basis van de [artikelen 14b, eerste lid][ref11], en [14c][ref12] vast te stellen voorschotten voor
      inburgering;
        - R: de op basis van de [artikelen 14b, derde lid][ref13], en [14c][ref14] vast te stellen voorschotten voor
      inburgering.

      2 Het bedrag van de gemeente voor de extra veiligheidsmiddelen bedraagt voor:

      a. het kalenderjaar 2005, 8,17% van het aandeel van de gemeente in de extra veiligheidsmiddelen;

      b. het kalenderjaar 2006, 25,67% van het aandeel van de gemeente in de extra veiligheidsmiddelen;

      c. het kalenderjaar 2007, 27,33% van het aandeel van de gemeente in de extra veiligheidsmiddelen;

      d. het kalenderjaar 2008, 21,50% van het aandeel van de gemeente in de extra veiligheidsmiddelen, en

      e. het kalenderjaar 2009, 17,33% van het aandeel van de gemeente in de extra veiligheidsmiddelen.

      3 Het verleende voorschot voor een kalenderjaar wordt in twee termijnen betaald.

      4 Het in 2005 aan de gemeente Heerlen te verlenen voorschot wordt verhoogd met het bedrag dat de minister op grond
      van [artikel 12, derde lid][ref15], heeft verleend.

      5 Aan Sittard-Geleen wordt vanaf 2006 ambtshalve jaarlijks een voorschot verleend van € 1.494.327,–,
      met in 2006 een extra bedrag voor inburgering van € 870.420,–. De te verlenen voorschotten worden in
      de jaren 2007, 2008 en 2009 steeds verhoogd met de bedragen die de Minister heeft verleend op grond van
      [artikel 9, derde lid van het Besluit][ref16], alsmede op grond van [artikel 12b, achtste en negende lid][ref17],
      [artikel 12ba, derde lid][ref18], [artikel 12bb, zesde en zevende lid][ref19], en
      [artikel 12c, vijfde en zesde lid][ref20], van de Uitvoeringsregeling brede doeluitkering sociaal, integratie en
      veiligheid.

      6 De aan de vier gemeenten, genoemd in [artikel 12a, eerste lid][ref21], te verlenen voorschotten worden verhoogd
      met de bedragen die de minister op grond van [artikel 12a, vierde en vijfde lid][ref22], heeft verleend.

      7 De aan de in het eerste lid van [artikel 12b][ref23] bedoelde gemeenten te verlenen voorschotten worden verhoogd
      met de bedragen die de minister op grond van [artikel 12b, achtste en negende lid][ref24], heeft verleend. Het
      procentuele aandeel voor het jaar 2006, als bedoeld in [artikel 12b, tweede lid][ref25], wordt door de minister als
      voorschot vóór 1 oktober 2006 beschikbaar gesteld. Dit voorschot wordt verstrekt, vooruitlopend op de beschikking
      tot verlening, als bedoeld in [artikel 12b, achtste en negende lid][ref26].

      8 De aan gemeenten te verlenen voorschotten worden steeds verhoogd op de volgende wijze:

      a. De aan de gemeenten, bedoeld in [artikel 12b, eerste lid][ref27], te verlenen voorschotten worden in de
      jaren 2007, 2008 en 2009 verhoogd met de bedragen, die de minister ten behoeve van het schooljaar 2007–2008
      respectievelijk het schooljaar 2008–2009 op grond van [artikel 12ba, derde lid][ref28], heeft toegekend;

      b. De aan de gemeenten, bedoeld in [artikel 12b, eerste lid][ref29], te verlenen voorschotten worden in de jaren
      2008 en 2009 verhoogd met de bedragen, die de minister op grond van [artikel 12bb, zesde en zevende lid][ref30],
      voor 2008 en 2009 heeft toegekend, onverminderd de verhoging bedoeld in onderdeel a;

      c. De aan de vier gemeenten, genoemd in [artikel 12bb, derde lid][ref31], te verlenen voorschotten worden in 2008
      en 2009 verhoogd met de bedragen, die de minister op grond van [artikel 12bb, zesde lid][ref32], voor 2008 en 2009
      heeft toegekend, onverminderd de verhoging bedoeld in de onderdelen a en b.

      9 De aan de gemeenten, waaraan op grond van [artikel 12c][ref33] een aanvulling op de uitkering wordt verleend, te
      verlenen voorschotten worden in de jaren 2007 tot en met 2009 steeds verhoogd met een derde deel van het bedrag dat
      op grond van [artikel 12c, vijfde en zesde lid][ref34], is verleend.

      10 De aan gemeenten te verlenen voorschotten ten behoeve van de impuls ‘Sociale Herovering’ worden op de volgende
      wijze verleend:

      a. De aan de gemeenten, genoemd in [artikel 12d][ref35], te verlenen voorschotten worden verhoogd met € 808.333,–
      voor het jaar 2006 en met € 1.191.667,– voor het jaar 2007;

      b. Het aan de gemeente Leeuwarden te verlenen voorschot wordt verhoogd met € 50.000,– voor het jaar 2008,
      onverminderd de verhoging bedoeld in onderdeel a.

      11 De aan gemeenten te verlenen voorschotten ten behoeve van ‘Aanval op de Uitval’ worden op de volgende wijze
      verleend:

      a. De aan de gemeenten, die op basis van [artikel 12e, zesde lid][ref36], in aanmerking komen voor een
      bijdrage in het kader van het initiatief ‘Aanval op de Uitval’, te verlenen voorschotten worden verhoogd met €
      100.000 per toegekend project voor het jaar 2006. Het aan Hengelo te verlenen voorschot wordt ten gevolge van
      [artikel 12e, achtste lid][ref37], voor het jaar 2006 verhoogd met € 120.000;

      b. Het aan de gemeente Leeuwarden te verlenen voorschot wordt verhoogd met € 150.000,– voor het jaar 2008,
      onverminderd de verhoging bedoeld in onderdeel a.

      12 De aan de elf gemeenten, genoemd in [artikel 12f, eerste lid][ref38], te verlenen voorschotten worden in de
      jaren 2006, 2007, 2008 en 2009 steeds verhoogd met respectievelijk 17,69%, 17,69%, 43,08% en 21,54% van het bedrag
      dat de minister op grond van [artikel 12f, vierde en vijfde lid][ref39], heeft verleend.

      13 De aan de centrumgemeenten voor vrouwenopvang te verlenen voorschotten worden:

      a. voor het jaar 2008 en het jaar 2009 verhoogd met de helft van het bedrag dat de minister op grond van
      [artikel 12g, derde lid][ref40], heeft verleend, en

      b. voor het jaar 2008 en het jaar 2009 verhoogd met de bedragen, die de minister op grond van
      [artikel 12ga, vierde en vijfde lid][ref41], heeft verleend, onverminderd de verhoging, bedoeld in onderdeel a.

      14 De aan de maatschappelijke centrumgemeenten te verlenen voorschotten worden op de volgende wijze verleend:

      a. De aan de maatschappelijke centrumgemeenten te verlenen voorschotten worden voor de jaren 2007, 2008 en 2009
      verhoogd met het bedrag dat de minister op grond van [artikel 12h, vierde en vijfde lid][ref42], heeft verleend.
      Indien een maatschappelijke centrumgemeente bij de inwerkingtreding van deze regeling niet beschikt over een Plan
      van aanpak maatschappelijke opvang, wordt het procentuele aandeel, bedoeld in [artikel 12h, tweede lid][ref43],
      door de minister als voorschot vóór 1 augustus 2007 respectievelijk 1 augustus 2008 beschikbaar gesteld,
      vooruitlopend op de beschikking tot verlening, bedoeld in [artikel 12h, vierde en vijfde lid][ref44];

      b. Het procentuele aandeel aan de maatschappelijke centrumgemeenten Amsterdam, Rotterdam, Den Haag en Utrecht,
      bedoeld in [artikel 12ha, tweede lid][ref45], wordt door de minister voor de jaren 2007, 2008 en 2009 op grond
      van [artikel 12ha, derde lid][ref46], beschikbaar gesteld, onverminderd de verhoging bedoeld in onderdeel a. Het
      voorschot betreft een vooruitbetaling, vooruitlopend op de beschikking tot verlening, bedoeld als voorfinanciering
      van een eventuele herverdeling van de verdeelsleutel maatschappelijke opvang en voor de voortgang in de uitvoering
      van het Plan van aanpak maatschappelijk opvang van de betrokken centrumgemeenten.


