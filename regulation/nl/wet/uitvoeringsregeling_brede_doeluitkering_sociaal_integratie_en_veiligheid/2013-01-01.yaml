    text: |-
      1 De uitkeringen aan de maatschappelijke centrumgemeenten worden verhoogd ten laste van de middelen die vanuit
      hoofdstuk XVI van de Rijksbegroting voor 2007, 2008 en 2009 ter beschikking worden gesteld voor activiteiten op het
      terrein van de openbare geestelijke gezondheidszorg.

      2 Het procentuele aandeel van de betreffende maatschappelijke centrumgemeenten in de middelen, bedoeld in het
      eerste lid, wordt voor 2007, 2008 en 2009 vastgesteld volgens de volgende verdeelmaatstaven:

        - 30% via het aantal inwoners van de gemeente;
        - 40% via de gewogen maatstaf aantal inwoners met een laag inkomen;
        - 12,5% via het aantal uitkeringsgerechtigden;
        - 12,5% via het aantal 15–30-jarige jongeren (speciaal ontwikkelde maatstaf);
        - 5,0% via het aantal minderheden.

      3 Uiterlijk 1 april 2008 dienen de colleges van burgemeester en wethouders van de betreffende gemeenten bij de
      Minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een wijziging
      van het meerjarenontwikkelingsprogramma, waarin als te bereiken resultaat is vastgelegd dat er een Plan van aanpak
      maatschappelijke opvang is opgesteld. Als bijlage bij de aanvraag dient tevens dit Plan van aanpak zelf te zijn
      bijgevoegd. Een Plan van aanpak maatschappelijke opvang dat door het college van burgemeester en wethouders van een
      maatschappelijke centrumgemeente is ingediend voor de inwerkingtreding van dit artikel, wordt aangemerkt als een
      aanvraag als bedoeld in dit artikel.

      4 De Minister neemt een beschikking tot verlening van een in het eerste lid bedoelde verhoging binnen acht weken na
      het tijdstip waarop de in het derde lid bedoelde aanvraag is ontvangen. Indien het Plan van aanpak maatschappelijke
      opvang van een maatschappelijke centrumgemeente reeds voor de inwerkingtreding van deze regeling is ingediend,
      neemt de Minister een beschikking tot verlening van de in het eerste lid bedoelde verhoging binnen acht weken na
      het tijdstip van de inwerkingtreding van deze regeling. De verhoging wordt in zijn geheel toegedeeld aan het in het
      derde lid bedoelde Plan van aanpak als indicator.

      5 De Minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien
      het ingediende Plan van aanpak maatschappelijke opvang naar het oordeel van de Minister van Volksgezondheid,
      Welzijn en Sport daartoe aanleiding geeft.

      6 De Minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij
      het college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van het Plan van
      aanpak maatschappelijke opvang in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel12h
