    text: |-
      Het procentuele aandeel van de gemeente in de middelen voor leefbaarheid en veiligheid, bedoeld in
      [artikel 4, eerste lid, van het Besluit][ref1], wordt bepaald volgens de formule:

      0,3366 × ((0,50 × Inw2004gem /Inw2004G30) + 0,50 (Nwal2004gem/Nwal2004G30)) + 0,4795 × ((0,3333 × (Jong2004gem/
      Jong2004G30) + 0,3333 × (A/B) + 0,3333 × (HKS2003gem/HKS2003G30)) + 0,1839 × ((0,50 × Inw2004gem/Inw2004G30)
      + 0,25 × ((Link2004gem × Kpreg2004gem)/(Link2004G30 × Kpreg2004G30)+ 0,25 × (Jonggem × Kpreg2004gem)/(JongG30
      × Kpreg2004G30)).

      In deze formule is

        - Inw2004gem: aantal inwoners van de gemeente op 1 januari 2004;
        - Inw2004G30: aantal inwoners van de G30 op 1 januari 2004;
        - Nwal2004gem: aantal niet westerse allochtonen op 1 januari 2004 in de gemeente;
        - Nwal2004G30: aantal niet westerse allochtonen op 1 januari 2004 in de G30;
        - Jong2004gem: het aantal inwoners van de gemeente dat 24 jaar of jonger is op 1 januari 2004 in de gemeente;
        - Jong2004G30: het aantal inwoners van de G30 dat 24 jaar of jonger is op 1 januari 2004;
        - A: (Nwal2004gem/Inw2004gem) × Jong2004gem;
        - B: (Nwal2004G30/Inw2003G30) × Jong2004G30;
        - HKS2003gem: aantal inwoners van de gemeente van twaalf tot en met vierentwintig jaar dat in 2003 voorkomt in het
      herkenningssysteem van de politie
        - HKS2003G30: aantal inwoners van de G30 van twaalf tot en met vierentwintig jaar dat in 2003 voorkomt in het
      herkenningssysteem van de politie;
        - Link2004gem: het aantal huishoudens in de gemeente volgens de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref2], volgens de meest recente vóór 2004 vastgestelde
      inkomensstatistiek van het CBS;
        - Link2004G30: het aantal huishoudens in de G30 volgens de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref3], volgens de meest recente vóór 2004 vastgestelde
      inkomensstatistiek van het CBS;
        - Kpreg2004gem: het aantal potentiële regionale klanten van de woonkernen in de gemeente als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref4] op 1 januari 2004;
        - Kpreg2004G30: het aantal potentiële regionale klanten van de woonkernen in de G30 als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref5] op 1 januari 2004;
        - Jonggem: het aantal inwoners van de gemeente op 1 januari 2004 dat 19 jaar of jonger is;
        - JongG30: het aantal inwoners van de G30 op 1 januari 2004 dat 19 jaar of jonger is.


