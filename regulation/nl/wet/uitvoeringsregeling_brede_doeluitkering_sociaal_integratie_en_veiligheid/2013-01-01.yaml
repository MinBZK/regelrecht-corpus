    text: |-
      1 Ten behoeve van het meten van de maatschappelijke effecten die zijn bereikt met de uitvoering van het
      ontwikkelingsprogramma worden periodiek gegevens verzameld op basis van de volgende indicatoren:

      a. slachtofferschap:

      i. vermogensdelicten: het aantal respondenten dat in het voorafgaande jaar binnen het grondgebied van de gemeente
      te maken heeft gehad met poging tot inbraak, inbraak, fietsendiefstal, diefstal uit auto’s, diefstal van auto’s,
      diefstal of vernieling aan de buitenkant van auto’s en zakkenrollerij;

      ii. geweldsdelicten: het aantal respondenten dat in het voorafgaande jaar binnen het grondgebied van de gemeente te
      maken heeft gehad met diefstal met geweld, mishandeling en bedreiging;

      b. een meting van de onveiligheidsgevoelens in de buurt;

      c. verloedering: een schaalscore, gebaseerd op de volgende elementen:

      i. bekladding van muren en gebouwen;

      ii. vernieling van telefooncellen, bus- en tramhokjes;

      iii. rommel op straat;

      iv. hondenpoep op straat;

      d. sociale kwaliteit: een schaalscore, gebaseerd op de reacties op de volgende stellingen:

      i. de mensen in de buurt kennen elkaar nauwelijks;

      ii. de mensen gaan op een prettige manier met elkaar om;

      iii. ik woon in een buurt waar veel saamhorigheid is;

      iv. ik voel mij thuis bij de mensen die hier wonen.

      2 De in het eerste lid bedoelde gegevens worden zowel op het niveau van de wijk als op het niveau van de gemeente
      verzameld.

      3 Het college van burgemeester en wethouders verstrekt de in het eerste lid bedoelde gegevens uiterlijk op 30 juni
      2005, 31 mei 2007 en 15 juli 2010 aan de minister.

      4 De uiterlijk per 30 juni 2005 te verstrekken gegevens hebben zoveel mogelijk betrekking op de stand per 31
      december 2004, voorzover in het eerste lid niet anders is aangegeven.

      5 De in 2007 en 2010 te verstrekken gegevens die voortkomen uit registratiesystemen hebben zoveel mogelijk
      betrekking op de stand per 31 december 2006, respectievelijk 31 december 2009. Voorzover het college van
      burgemeester en wethouders gebruik maakt van enquêtes, worden deze uitgevoerd in de periode oktober 2006–maart
      2007, respectievelijk 15 september–31 december 2009 en hebben deze betrekking op 2006, respectievelijk 2009.
