  - number: 14c
    text: |-
      1 De Minister stelt jaarlijks de voorschotvergoedingen, bedoeld in [artikel 14b][ref1], respectievelijk de
      bijdragevergoedingen, bedoeld in [artikel 9a][ref2], vast.

      2 De Minister stelt ten behoeve van de vast te stellen hoogte van de bijdragevergoedingen de onderlinge
      verhouding vast tussen de onderdelen, bedoeld in [artikel 9a, eerste lid, letters A, C en G][ref3] enerzijds
      en de onderdelen, bedoeld in [artikel 9a, eerste lid, letters I, K, M en O][ref4] anderzijds, respectievelijk
      het onderdeel, bedoeld in [artikel 9a, tweede lid, letter A][ref5] enerzijds en het onderdeel, bedoeld in
      [artikel 9a, tweede lid, letter C][ref6] anderzijds.

      3 De Minister stelt de bijdragevergoedingen vast aan de hand van de verhouding, bedoeld in het tweede lid, en een
      uitvalpercentage ter hoogte van 10%.

      4 De Minister maakt de hoogte van de voorschotvergoedingen, alsmede de verhouding jaarlijks voor 15 september
      bekend.


