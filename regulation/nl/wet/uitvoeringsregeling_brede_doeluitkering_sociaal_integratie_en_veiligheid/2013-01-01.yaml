    text: |-
      1 De uitkeringen aan de centrumgemeenten voor vrouwenopvang worden in 2008 en 2009 verhoogd ten laste van de
      middelen die vanuit hoofdstuk XVI van de Rijksbegroting voor 2008 en 2009 ter beschikking worden gesteld voor een
      extra impuls op het terrein van vrouwenopvang om de capaciteit aan opvangplaatsen uit te breiden en de advies-
      en steunpunten huiselijk geweld te versterken, voor crisisinterventie en daderopvang, mede met het oog op de
      [Wet tijdelijk huisverbod][ref1], en voor de opvang en hulp aan tienermoeders.

      2 Het procentuele aandeel van de betreffende centrumgemeenten in de middelen, bedoeld in het eerste lid, wordt voor
      2008 en 2009 vastgesteld overeenkomstig [artikel 6][ref2].

      3 Binnen vier weken na inwerkingtreding van deze regeling dienen de colleges van burgemeester en wethouders van
      de betreffende gemeenten bij de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag
      gaat vergezeld van een wijziging van het ontwikkelingsprogramma. In deze wijziging van het ontwikkelingsprogramma
      worden de te bereiken resultaten opnieuw geformuleerd met inachtneming van de in het ontwikkelingsprogramma eerder
      vastgelegde te bereiken resultaten, bedoeld in [artikel 5, tweede lid, van het Besluit][ref3], en met inachtneming
      van de indicatoren, bedoeld in [artikel 10, onderdelen i, k en r][ref4]. Aanvragen die zijn ingediend voor de
      inwerkingtreding van dit artikel worden aangemerkt als aanvragen als bedoeld in dit artikel.

      4 De minister neemt een beschikking tot verlening van de in het eerste lid bedoelde verhoging binnen vier weken
      na de inwerkingtreding van dit artikel. De verhoging, bedoeld in het eerste lid, wordt voor 15 procent toegedeeld
      aan de indicator, bedoeld in [artikel 10, onderdeel i][ref5], voor 15 procent aan de indicator, bedoeld in
      [artikel 10, onderdeel k][ref6], en voor 70 procent aan indicator, bedoeld in [artikel 10, onderdeel r][ref7].
      Als bij de indicatoren, bedoeld in [artikel 10, onderdelen k en r][ref8], gekozen is voor een uitsplitsing in
      subindicatoren, wordt de 15 en 70 procent toegedeeld aan die subindicatoren met gelijke percentages.

      5 De minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien de
      in het ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.

      6 De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.


