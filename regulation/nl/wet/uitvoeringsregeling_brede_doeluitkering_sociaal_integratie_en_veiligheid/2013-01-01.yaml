articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Besluit: [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1];

      b. G30: de gemeenten Alkmaar, Almelo, Amersfoort, Amsterdam, Arnhem, Breda, Den Haag, Deventer, Dordrecht,
      Eindhoven, Emmen, Enschede, Groningen, Haarlem, Heerlen, Helmond, Hengelo (Overijssel), ’s-Hertogenbosch,
      Leeuwarden, Leiden, Lelystad, Maastricht, Nijmegen, Rotterdam, Schiedam, Tilburg, Utrecht, Venlo, Zaanstad en
      Zwolle;

      c. niet westerse allochtoon: persoon waarvan ten minste één van de ouders in Turkije, in een land in Afrika,
      Latijns Amerika of in Azië, met uitzondering van Indonesië en Japan, is geboren;

      d. CBS: Centraal bureau voor de statistiek;

      e. maatschappelijke centrumgemeenten: centrumgemeenten voor maatschappelijke opvang, openbare geestelijke
      gezondheidszorg en verslavingsbeleid die zijn vermeld in de bij deze regeling behorende [bijlage A][ref2];

      f. maatschappelijk zorggebied: zorggebied voor maatschappelijke opvang, openbare geestelijke gezondheidszorg en
      verslavingsbeleid volgens de in de bij deze regeling behorende [bijlage A][ref3] opgenomen gebiedsindeling;

      g. zorggebied voor vrouwenopvang: zorggebied volgens de in de bij deze regeling behorende [bijlage B][ref4]
      opgenomen gebiedsindeling;

      h. verklaring: door het bevoegd gezag van een instelling uitgereikte verklaring, bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref5];

      i. beschikking omtrent een inburgeringsprogramma: beschikking als bedoeld in
      [artikel 1, onderdeel g, van het Bekostigingsbesluit inburgering nieuwkomers][ref6];

      j. wijk: GSB-wijk zoals opgenomen in het rapport ‘Wijkmonitoring G30’ van 30 december 2004;

      k. de minister: de Minister van Sociale Zaken en Werkgelegenheid;

      l. voorschoolse educatie: een programma dat door gekwalificeerd personeel wordt verzorgd in kinderdagverblijven en
      peuterspeelzalen voor doelgroepkinderen van 2 en 3 jaar;

      m. doelgroepkind: kind met onderwijsachterstand dat op grond van [artikel 6 van het Besluit bekostiging WPO][ref7],
      zoals dat luidde op 31 juli 2006, in aanmerking komt voor het volgen van voorschoolse educatie,
      dan wel kind met onderwijsachterstand voor wie een gewicht is vastgesteld op grond van
      [artikel 27 van het Besluit bekostiging WPO][ref8], zoals dat luidde op 31 juli 2006, en dat in aanmerking komt
      voor het volgen van vroegschoolse educatie;

      n. schakelklas: groep of groepje leerlingen als bedoeld in de [artikelen 166][ref9] en
      [166a van de Wet op het primair onderwijs][ref10];

      o. schoolgewicht: schoolgewicht als bedoeld in [artikel 27 van het Besluit bekostiging WPO][ref11], zoals dat
      luidde op 31 juli 2006;

      p. volwasseneneducatie: opleidingen voortgezet algemeen volwassenenonderwijs, opleidingen gericht op breed
      maatschappelijk functioneren, opleidingen gericht op sociale redzaamheid, of opleidingen Nederlands als tweede
      taal, als bedoeld in [artikel 7.3.1, eerste lid, van de Wet educatie en beroepsonderwijs][ref12];

      q. roc: regionaal opleidingencentrum als bedoeld in [artikel 1.3.1 van de Wet educatie en beroepsonderwijs][ref13];

      r. G27: de gemeenten, behorend tot de G31, met uitzondering van Amsterdam, Den Haag, Rotterdam en Utrecht;

      s. inburgeringsexamen: het inburgeringsexamen, bedoeld in [hoofdstuk 4 van de Wet inburgering][ref14] zoals die
      luidde op 31 december 2012;

      t. inburgeringscursus: een cursus welke een inburgeringsplichtige of inburgeraar in staat stelt mondelinge en
      schriftelijke vaardigheden in de Nederlandse taal en kennis van de Nederlandse samenleving te verwerven, teneinde
      het inburgeringsexamen te behalen;

      u. eigen bijdrage: de bijdrage, bedoeld in [artikel 23, tweede lid, van de Wet inburgering][ref15] zoals die luidde
      op 31 december 2012;

      v. exameninstelling: de exameninstelling, bedoeld in [artikel 1, onderdeel i, van de Wet inburgering][ref16] zoals
      die luidde op 31 december 2012;

      w. Informatiesysteem Inburgering: het Informatiesysteem Inburgering, bedoeld in
      [artikel 47 van de Wet inburgering][ref17] zoals die luidde op 31 december 2012;

      x. inburgeringsbedrijf: een natuurlijk persoon of rechtspersoon die in het kader van uitoefening van beroep of
      bedrijf de inburgering van personen in Nederland bevordert;

      y. persoonlijk inburgeringsbudget: een budget dat door het college van burgemeester en wethouders, in het kader
      van een te sluiten overeenkomst met een inburgeringsbedrijf, ten behoeve van een inburgeraar ter beschikking wordt
      gesteld en met behulp waarvan de inburgeraar zijn inburgering op een individuele wijze vorm geeft;

      z. staatsexamen: het staatsexamen Nederlands als tweede taal I en II, bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref18];

      aa. duale inburgeringsvoorziening: duale inburgeringsvoorziening als bedoeld in
      [artikel 1.1, onderdeel p, van het Besluit inburgering][ref19] zoals dit luidde op 31 december 2012;

      bb. taalkennisvoorziening: taalkennisvoorziening als bedoeld in
      [artikel 19, tweede lid, van de Wet inburgering][ref20] zoals die luidde op 31 december 2012.


