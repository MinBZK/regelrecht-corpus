      1 Onverminderd de [artikelen 5][ref1] en [12h, eerste lid][ref2], worden de uitkeringen aan de maatschappelijke
      centrumgemeenten Amsterdam, Rotterdam, Den Haag en Utrecht verhoogd ten laste van de middelen die vanuit
      hoofdstuk XVI van de Rijksbegroting voor 2007, 2008 en 2009 ter beschikking worden gesteld ten behoeve van de
      voorfinanciering van een eventuele herverdeling van de verdeelsleutel maatschappelijke opvang en voor de voortgang
      in de uitvoering van het Plan van aanpak maatschappelijk opvang, bedoeld in [artikel 12h, derde lid][ref3].

      2 Het procentuele aandeel van de betreffende maatschappelijke centrumgemeenten in de middelen, bedoeld in het
