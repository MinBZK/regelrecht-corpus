  - number: 12e
    text: |-
      1 De uitkering kan ten laste van de middelen die vanuit hoofdstuk VII van de Rijksbegroting voor het jaar 2006
      ter beschikking worden gesteld ten behoeve van het initiatief ‘Aanval op de Uitval’ van de G27, verhoogd worden
      ten behoeve van experimentele projecten, gericht op het tegengaan van uitval van jeugd of van kansarmen, of op de
      uitval van wijken in relatie tot de zorg van bewoners voor hun eigen buurt.

      2 Voor 15 november 2006 kunnen de colleges van burgemeester en wethouders bij de bestuurlijke kern van de G27 een
      aanvraag indienen voor een verhoging als bedoeld in het eerste lid. Aanvragen die voor de inwerkingtreding van deze
      regeling zijn ingediend worden mede aangemerkt als een aanvraag als bedoeld in dit lid.

      3 De bestuurlijke kern van de G27 toetst de aanvragen aan de criteria, genoemd in het eerste en vierde lid en zendt
      deze, vergezeld van een advies, voor 20 november 2006 door naar de minister. Het advies is vormgegeven volgens het
      model in [bijlage C][ref1] bij deze regeling.

      4 De aanvraag gaat vergezeld van een wijziging van het meerjaren-ontwikkelingsprogramma. Deze wijziging voldoet aan
      de volgende eisen:

      a. het project:

      1°. maakt de omslag van aanbodsgericht naar vraaggericht beleid zichtbaar en richt zich op concrete vragen en
      problemen van burgers;

      2°. experimenteert met succesvol gebleken methoden met het oog op verdere verfijning daarvan;

      3°. is gericht op verbetering van de samenwerking tussen overheden, maatschappelijke instellingen of andere private
      partijen en

      b. de resultaten van het project zijn in principe bruikbaar voor de andere G27 gemeenten en de aanvrager is bereid
      deze bekend te maken.

      5 Voor de verhoging, bedoeld in het eerste lid, is een bedrag van € 1.400.000,– beschikbaar. Per project wordt een
      bedrag van € 100.000,– toegekend.

      6 De minister neemt uiterlijk 1 december 2006 een beslissing over verlening van de verhogingen bedoeld in het
      eerste lid.

      7 De bestuurlijke kern van de G27 informeert de minister voor BVK uiterlijk 31 december 2007 over de behaalde
      resultaten van de projecten waarvoor een verhoging als bedoeld in het eerste lid is verleend. Daarbij wordt in
      ieder geval ingegaan op de volgende vragen:

      a. welke knelpunten zijn in de projecten aangepakt;

      b. welke oplossingsrichtingen zijn voorgesteld en in hoeverre hebben die oplossingsrichtingen bij de uitvoering
      gewerkt;

      c. is een verdere verspreiding van de voorgestelde oplossingsrichtingen aan te bevelen en zo ja, hoe kan dat het
      beste gebeuren.

      8 Onverminderd het eerste lid wordt de uitkering aan de gemeente Hengelo verhoogd met een bedrag van € 120.000,–
      ten behoeve van de projectmanagementkosten van het initiatief ‘Aanval op de Uitval’ van de G27.


      [ref1]: https://wetten.overheid.nl/BWBR0018516
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0018516
  - number: 12ea
    text: |-
      1 De uitkering aan de gemeente Leeuwarden kan worden verhoogd met € 300.000,– ten laste van de middelen die vanuit
      hoofdstuk XVIII van de Rijksbegroting voor de jaren 2008 en 2009 ter beschikking worden gesteld ten behoeve van de
      uitvoering door het Nicis Institute van het tweejarige programma ‘Aanval op de Uitval II’ van de G27, ten behoeve
      van activiteiten in de G31, gericht op het opleiden en coachen van gemeenten in de complexiteit van de stedelijke
      regie.

      2 Binnen vier weken na inwerkingtreding van deze regeling dient het college van burgemeester en wethouders van de
      gemeente Leeuwarden, namens het dagelijks bestuur van de G27, bij de minister een aanvraag in tot de verhoging,
      bedoeld in het eerste lid. Een aanvraag die is ingediend voor de inwerkingtreding van dit artikel worden aangemerkt
      als aanvraag als bedoeld in dit artikel.

      3 De minister neemt een beschikking over verlening van de verhoging, bedoeld in het eerste lid, binnen vier weken
      na de inwerkingtreding van dit artikel.

      4 Aan de verlening van de verhoging, bedoeld in het eerste lid, kunnen door de minister voorwaarden worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel12ea
  - number: 12f
    text: |-
      1 De uitkeringen aan de gemeenten Amsterdam, Rotterdam, Den Haag, Utrecht, Eindhoven, Tilburg, Arnhem, Enschede,
      Zaanstad, Dordrecht en Nijmegen kunnen ten laste van de middelen die vanuit hoofdstuk XVI van de Rijksbegroting
      ter beschikking worden gesteld voor het vergroten van de sportdeelname onder allochtone jeugd op de volgende wijze
      worden verhoogd:

      a. voor Amsterdam met ten hoogste € 3.571.598,–;

      b. voor Rotterdam met ten hoogste € 2.942.561,–;

      c. voor Den Haag met ten hoogste € 2.108.468,–;

      d. voor Utrecht met ten hoogste € 799.779,–;

      e. voor Eindhoven met ten hoogste € 428.098,–;

      f. voor Tilburg met ten hoogste € 370.978,–;

      g. voor Arnhem met ten hoogste € 336.383,–;

      h. voor Enschede met ten hoogste € 302.729,–;

      i. voor Zaanstad met ten hoogste € 295.324,–;

      j. voor Dordrecht met ten hoogste € 276.186,–, en

      k. voor Nijmegen met ten hoogste € 267.895,–.

      2 Binnen vier weken na inwerkingtreding van deze regeling dienen de colleges van burgemeester en wethouders van de
      in het eerste lid genoemde gemeenten bij de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid.
      De aanvraag gaat vergezeld van een wijziging van het meerjaren-ontwikkelingsprogramma. Daarin wordt vastgelegd de
      in de GSB III periode te bereiken resultaten die bijdragen aan het vergroten van de sportdeelname onder allochtone
      jeugd. Aanvragen die zijn ingediend voor de inwerkingtreding van dit artikel worden aangemerkt als aanvragen als
      bedoeld in dit artikel.

      3 In de wijziging van het meerjarenprogramma worden de te bereiken resultaten geformuleerd met inachtneming van
      een of meer door de gemeente te bepalen indicatoren op het gebied van het vergroten van de sportdeelname onder
      allochtone jeugd.

      4 De minister neemt een beschikking over verlening van een in het eerste lid bedoelde verhoging binnen acht weken
      na de inwerkingtreding van dit artikel. De in het derde lid bedoelde indicator of indicatoren, met bijbehorende
      overeengekomen resultaten, worden voor elk van de elf in het eerste lid genoemde gemeenten afzonderlijk in de
      beschikking tot verlening van de verhoging van de uitkering vastgelegd. De verhoging wordt voor 100% aan de
      indicator of indicatoren toegedeeld met gelijke percentages.

      5 De Minister kan de verhoging lager vaststellen dan de bedragen genoemd in het eerste lid, indien de in het
      ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.

      6 De minister geeft niet eerder toepassing aan het vijfde lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel12f
