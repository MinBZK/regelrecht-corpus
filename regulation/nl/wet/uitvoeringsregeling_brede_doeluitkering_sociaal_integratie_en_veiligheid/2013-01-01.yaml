  - number: '15'
    text: |-
      1 Het bedrag dat in 2005 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend is de uitkomst van de
      formule ((O/P) × Midverkl + (Q:R) × Midbesch) – ½S + (T × € 6400).

      In deze formule is

        - O: het aantal verklaringen van de gemeente in 2003;
        - P: het aantal verklaringen van de G30 in 2003;
        - Midverkl: het bedrag dat voor de G30 voor de maatstaf verklaringen beschikbaar is;
        - Q: het aantal beschikkingen van de gemeente in 2003;
        - R: het aantal beschikkingen van de G30 in 2003;
        - Midbesch: het bedrag dat voor de G30 voor de maatstaf beschikkingen beschikbaar is;
        - S: de door de Minister voor Vreemdelingenzaken en Integratie geraamde door
      een gemeente opgebouwde reserve aan niet bestede rijksbijdragen als bedoeld in
      [artikel 1, onderdeel g, van het Bekostigingsbesluit inburgering nieuwkomers][ref1], per 31 december 2004;
        - T: het door de Minister voor Vreemdelingenzaken en Integratie vastgestelde aantal oudkomers dat bij de verlening
      van de voorschotten wordt betrokken.

      2 Als de reserve, bedoeld in onderdeel S van de formule, genoemd in het eerste lid, negatief is wordt S gesteld
      op 0.

      3 Het bedrag dat in 2005 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend bedraagt in afwijking
      van het eerste lid ten minste T × € 6400.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '1'
  - number: 15a
    text: |-
      Onverminderd [artikel 15][ref1] wordt in november 2005 een additioneel voorschot verstrekt op het inburgeringsdeel,
      ter hoogte van het verschil tussen enerzijds de helft van de door de Minister voor Vreemdelingenzaken en
      Integratie geraamde door een gemeente opgebouwde reserve aan niet bestede rijksbijdragen als bedoeld in
      [artikel 1, onderdeel g, van het Bekostigingsbesluit inburgering nieuwkomers][ref2], per 31 december 2004, en
      anderzijds de helft van de verantwoorde reserve van een gemeente per 31 december 2004, mits dat verschil groter is
      dan € 0.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel15a
