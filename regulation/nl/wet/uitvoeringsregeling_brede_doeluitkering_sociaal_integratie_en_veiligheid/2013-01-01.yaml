  - number: '6'
    text: |-
      Het procentuele aandeel van de gemeente die behoort tot de centrumgemeenten voor vrouwenopvang in de middelen voor
      vrouwenopvang, bedoeld in [artikel 4, eerste lid, van het Besluit][ref1], wordt bepaald volgens de formule

      In deze formule is

        - Inwgem: het aantal inwoners van het zorggebied voor vrouwenopvang van de gemeente op 1 januari van het
      voorafgaande kalenderjaar;
        - Inwcgvo: het aantal inwoners van de zorggebieden van de centrumgemeenten voor vrouwenopvang op 1 januari van het
      voorafgaande kalenderjaar;
        - Mingem: het totaal van het aantal inwoners van de gemeente in het zorggebied voor vrouwenopvang
      op 1 januari van het voorafgaande kalenderjaar, volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref2];
        - Mincgvo: Het totaal van het aantal inwoners in de zorggebieden voor vrouwenopvang van de centrumgemeenten
      voor vrouwenopvang op 1 januari van het voorafgaande kalenderjaar, volgens de Maatstaf minderheden, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref3];
        - Midvo: het deel van de middelen voor vrouwenopvang dat aan het kalenderjaar is toe te rekenen;
        - Basisvocgvo: het deel van de basisbedragen voor vrouwenopvang van de centrumgemeenten voor vrouwenopvang dat aan
      het kalenderjaar is toe te rekenen;
        - Basisvogem: het deel van het basisbedrag voor vrouwenopvang van de gemeente dat aan het kalenderjaar is toe
      rekenen;
        - Midvo: de middelen voor vrouwenopvang in de GSB III periode.


