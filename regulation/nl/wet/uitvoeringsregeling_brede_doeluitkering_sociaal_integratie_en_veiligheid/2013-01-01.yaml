    text: |-
      Het procentuele aandeel van de gemeente die behoort tot de maatschappelijke centrumgemeenten in de middelen voor
      maatschappelijke opvang en verslavingsbeleid, bedoeld in [artikel 4, eerste lid, van het Besluit][ref1], wordt
      bepaald volgens de formule

      In deze formule is

        - Inwgem: het aantal inwoners van het maatschappelijk zorggebied van de gemeente op 1 januari van het voorafgaande
      kalenderjaar;
        - Inwcgmo: het aantal inwoners van de maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten op 1
      januari van het voorafgaande kalenderjaar;
        - Linkgem: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref2], in het maatschappelijke zorggebied van de gemeente,
      volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek van het CBS;
        - Linkcgmo: het aantal huishoudens op basis van de Maatstaf lage inkomens, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref3], in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten volgens de meest recente vóór het kalenderjaar vastgestelde inkomensstatistiek
      van het CBS;
        - Kpreggem: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref4] op 1 januari van het voorafgaande kalenderjaar in
      het maatschappelijke zorggebied van de gemeente;
        - Kpregcgmo: het aantal potentiële regionale klanten van de woonkernen als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref5] op 1 januari van het voorafgaande kalenderjaar in de
      maatschappelijke zorggebieden van de maatschappelijke centrumgemeenten;
        - Ugem: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref6], in het maatschappelijke zorggebied
      van de gemeente, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref7] in dat gebied, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Ucgmo: het aantal personen volgens de Maatstaf uitkeringsontvangers, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref8] in de maatschappelijke zorggebieden van de
      maatschappelijke centrumgemeenten, verminderd met het aantal personen volgens de bijstandsmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref9] in die gebieden, op 31 december van het jaar dat twee
      jaar voorafgaat aan het kalenderjaar;
        - Midmocgmo: het deel van de middelen voor maatschappelijke opvang en verslavingsbeleid dat aan het kalenderjaar is
      toe te rekenen;
        - Basismocgmo: het deel van de basisbedragen voor maatschappelijke opvang en verslavingsbeleid van de
      maatschappelijke centrumgemeenten dat aan het kalenderjaar is toe te rekenen;
        - Basismogem: het deel van het basisbedrag voor maatschappelijke opvang en verslavingsbeleid van de gemeente dat
      aan het kalenderjaar is toe te rekenen;
        - Midmo: de middelen voor maatschappelijke opvang en verslavingsbeleid in de GSB III periode.


