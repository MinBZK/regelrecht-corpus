  - number: 14a
    text: |-
      De Minister maakt uiterlijk 1 maart 2007 een indicatieve rijksbijdrage bekend met betrekking tot het aandeel van
      de gemeente in de middelen voor inburgering, bedoeld in [artikel 4, eerste lid, onderdeel Q, van het Besluit][ref1]
      voor de jaren 2007, 2008 en 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel4
