  - number: 12c
    text: |-
      1 Indien het bij koninklijke boodschap van 21 september 2005 ingediende voorstel van Wet houdende regels inzake
      inburgering in de Nederlandse samenleving (Wet inburgering, Kamerstukken I 2005/06, 30 308, nr. A) nadat het
      tot wet is verheven, in werking treedt, worden de uitkeringen aan alle gemeenten met ingang van de datum van
      inwerkingtreding van die Wet verhoogd ten laste van de middelen die vanuit hoofdstuk VIII van de Rijksbegroting ter
      beschikking worden gesteld voor educatie.

      2 Het procentuele aandeel van elke gemeente wordt berekend op basis van de
      [artikelen 3.2.1. tot en met 3.2.3 van het Uitvoeringsbesluit Web][ref1] en wordt aan elke gemeente bekendgemaakt
      in het verleningsbesluit, bedoeld in het vijfde lid.

      3 Uiterlijk op 15 november 2006 dienen de colleges van burgemeester en wethouders van de betreffende gemeenten
      bij Onze Minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag gaat vergezeld van een
      wijziging van het meerjarenontwikkelingsprogramma.

      4 De wijziging van het meerjarenontwikkelingsprogramma voldoet aan de volgende aanvullende eisen:

      a. zij bevat een doelgroepenanalyse, waarin wordt aangegeven met welke doelgroepen van de educatie de gemeente te
      maken heeft, wat de omvang is van de onderscheiden doelgroepen en op welke doelgroep(en) het gemeentelijk beleid
      wordt gericht, alsmede een overzicht van het aantal deelnemers in de onderscheiden opleidingen educatie;

      b. aangegeven wordt welk deel van het budget wordt besteed aan educatie. Indien de gemeente voornemens is
      tien procent of meer van de voor educatie beschikbaar gestelde middelen niet in te zetten voor educatie,
      bevat de wijziging van het meerjarenprogramma een motivatie daarvoor, alsmede een gezamenlijke verklaring van
      het college van burgemeester en wethouders en het betrokken roc, of de betrokken roc’s, waaruit blijkt dat
      [artikel 4.1.3, eerste en tweede lid, van de Uitvoeringsregeling Web][ref2] in acht is genomen en waaruit tevens
      blijkt op welke wijze deelnemers in staat worden gesteld hun opleiding af te maken;

      c. het te bereiken resultaat wordt geformuleerd op een van de indicatoren, bedoeld in
      [artikel 10, onderdelen d tot en met g][ref3]. Als de gemeente in de wijziging van het
      meerjarenontwikkelingsprogramma heeft gekozen voor de indicator, bedoeld in [artikel 10, onderdeel g][ref4], en
      daarbij heeft gekozen voor een uitsplitsing in subindicatoren, geeft de wijziging van het meerjarenontwikkelings-
      programma tevens aan in welke mate de beschikbare middelen worden toegerekend aan elk van die subindicatoren.

      5 De minister neemt een beschikking tot verlening van een in het eerste lid respectievelijk in het negende lid
      bedoelde verhoging binnen acht weken na het tijdstip waarop de in het tweede lid respectievelijk in het negende
      lid bedoelde aanvraag is ontvangen. De verhoging wordt in zijn geheel toegerekend aan de gekozen indicator.
      Als is gekozen voor de indicator, bedoeld in [artikel 10, onderdeel g][ref5], met daarbij een uitsplitsing in
      subindicatoren, wordt de verhoging toegerekend aan die subindicatoren op de wijze als aangegeven in de wijziging
      van het meerjarenontwikkelingsprogramma.

      6 De minister kan minder dan 100% verlenen van het in het tweede lid bedoelde procentuele aandeel respectievelijk
      de in het negende lid bedoelde verhoging, indien de in het ontwikkelingsprogramma opgenomen resultaten naar zijn
      oordeel daartoe aanleiding geven.

      7 De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.

      8 Indien activiteiten als bedoeld in
      [artikel 2.3.4, derde lid, onder a van de Wet educatie en beroepsonderwijs][ref6], waarvoor het college van
      burgemeester en wethouders van de betreffende gemeente zich heeft verplicht, niet of niet volledig zijn verricht en
      het college van burgemeester en wethouders uit dien hoofde in 2006 aanspraken heeft jegens de instelling, besteedt
      het college van burgemeester en wethouders de uit die aanspraken voortvloeiende en terugontvangen middelen die
      afkomstig zijn uit de rijksbijdrage 2006 in de resterende GSB III periode opnieuw voor volwasseneneducatie, en
      verantwoordt het college van burgemeester en wethouders die middelen bij de verantwoording van de uitkering.

      9 Indien er sprake is van een verhoging van de uitkering met de in het achtste lid bedoelde middelen, kan dit voor
      de Minister aanleiding zijn het college van burgemeester en wethouders van de betreffende gemeente te verzoeken
      hiervoor een aanvraag in te dienen, vergezeld van een wijziging van het meerjarenontwikkelingsprogramma, binnen
      een door hem te bepalen termijn. In deze wijziging van het ontwikkelingsprogramma wordt het te bereiken resultaat
      opnieuw geformuleerd met inachtneming van de in het derde lid bedoelde aanvraag en met inachtneming van de in het
      vierde lid, onderdelen a en c, gestelde eisen.


