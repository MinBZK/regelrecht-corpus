  - number: 15b
    text: |-
      1 Het bedrag dat aan de gemeenten in 2006 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend is de
      uitkomst van de formule ((O/P) × Midverkl + (Q:R) × Midbesch) + (T × € 6400).

      In deze formule is

      O: het aantal verklaringen van de gemeente in 2004;

      P: het aantal verklaringen van de G30 in 2004;

      Midverkl: het bedrag dat voor de G30 voor de maatstaf verklaringen beschikbaar is;

      Q: het aantal beschikkingen van de gemeente in 2004;

      R: het aantal beschikkingen van de G30 in 2004;

      Midbesch: het bedrag dat voor de G30 voor de maatstaf beschikkingen beschikbaar is;

      T: het door de Minister voor Vreemdelingenzaken en Integratie vastgestelde aantal oudkomers dat bij de verlening
      van de voorschotten wordt betrokken.

      2 Het bedrag dat in 2006 ambtshalve aan voorschotten op het inburgeringsdeel wordt verleend bedraagt in afwijking
      van het eerste lid ten minste T × € 6400.
    url: https://wetten.overheid.nl/BWBR0018516/2013-01-01#Artikel15b
  - number: 15c
    text: |-
      Onverminderd [artikel 15b][ref1] kan in 2006 en 2007 een additioneel voorschot worden verstrekt op
      het inburgeringsdeel, maximaal ter hoogte van het verschil tussen enerzijds de op de grondslag van
      [artikel 7, eerste en tweede lid][ref2], vast te stellen middelen voor de inburgering van nieuwkomers en
      anderzijds het op grond van [artikel 15, eerste en tweede lid][ref3], verstrekte voorschot voor de inburgering van
      nieuwkomers, mits dat verschil groter is dan nul.


      [ref1]: https://wetten.overheid.nl/BWBR0018516#Artikel15b
