  - number: '9'
    text: |-
      Het procentuele aandeel van de gemeente in de extra middelen voor veiligheid, bedoeld in
      [artikel 4, eerste lid, van het Besluit][ref1], wordt bepaald volgens de formule

      0,1950 × (Inw2004gem/Inw2004G30) + 0,2090 × (Min2004gem/Min2004G30) + 0,12 × (Jonggem/JongG30) + 0,12 × (K/L) +
      0,12 × (HKS2003gem/HKS2003G30) + 0,083 × (ABWontgem/ABWontG30) + 0,083 × (Loplgem/LoplG30) + 0,035 × ((Li2004gem ×
      Kpreg2004gem)/(Li2004G30 × Kpreg2004G30)) + 0, 035 × ((Jonggem × Kpreg2004gem)/(JongG30 × Kpreg2004G30)).

      In deze formule is

        - Inw2004gem: aantal inwoners van de gemeente op 1 januari 2004;
        - Inw2004G30: aantal inwoners van de G30 op 1 januari 2004;
        - Min2004gem: Het totaal van het aantal inwoners op 1 januari 2004 in de gemeente volgens de Maatstaf minderheden,
      bedoeld in [bijlage 2 van het Besluit financiële verhouding 2001][ref2];
        - Min2004G30: Het totaal van het aantal inwoners in de G30 op 1 januari 2004, volgens de Maatstaf minderheden,
      bedoeld in [bijlage 2 van het Besluit financiële verhouding 2001][ref3];
        - Jonggem: het aantal inwoners van de gemeente dat negentien jaar of jonger is op 1 januari 2004;
        - JongG30: het aantal inwoners van de G30 dat negentien jaar of jonger is op 1 januari 2004 op 1 januari 2004;
        - K: (Min2004gem/Inw2004gem) × Jonggem;
        - L: (Min2004G30/Inw2004G30) × JongG30;
        - HKS2003gem: aantal jongeren van twaalf tot en met vierentwintig jaar in de gemeente dat in 2003 voorkomt in het
      herkenningssysteem van de politie;
        - HKS2003G30: aantal jongeren van twaalf tot en met vierentwintig jaar in de G30 dat in 2003 voorkomt in het
      herkenningssysteem van de politie;
        - ABWontgem: aantal personen in de gemeente op 31 december 2003 op basis van de Bijstandmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref4];
        - ABWontG30: aantal personen in de G30 op 31 december 2003 op basis van de Bijstandmaatstaf, bedoeld in
      [bijlage 2 van het Besluit financiële verhouding 2001][ref5];
        - Loplgem: gemiddeld aantal inwoners in de gemeente van vijftien jaar tot en met vierenzestig jaar over de jaren
      1997–2002 met ten hoogste een diploma op het niveau van het Voorbereidend Beroepsonderwijs;
        - LoplG30: gemiddeld aantal inwoners in de G30 van vijftien jaar tot en met vierenzestig jaar over de jaren 1997–
      2002 met ten hoogste een diploma op het niveau van het Voorbereidend Beroepsonderwijs;
        - Kpreg2004gem: het aantal potentiële regionale klanten van de woonkernen in de gemeente als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref6] op 1 januari 2004;
        - Kpreg2004G30: het aantal potentiële regionale klanten van de woonkernen in de G30 als bedoeld in
      [artikel 10 van het Besluit financiële verhouding 2001][ref7] op 1 januari 2004.


