  - number: 12bb
    text: |-
      1 De uitkeringen aan de gemeenten, bedoeld in [artikel 12b, eerste lid][ref1], worden met ingang van 2008 verhoogd
      ten laste van de middelen die vanuit hoofdstuk VIII van de Rijksbegroting voor 2008 en 2009 ter beschikking
      worden gesteld voor een extra rijksbijdrage op het terrein van voorschoolse educatie om het bereik van het aantal
      doelgroepkinderen te vergroten en tevens de kwaliteit en toegankelijkheid te verbeteren.

      2 Het procentuele aandeel van de betreffende gemeenten in de middelen, bedoeld in het eerste lid, wordt vastgesteld
      door de som van de schoolgewichten, volgens de definitie van schoolgewicht zoals die luidde op 31 juli 2006 en
      berekend aan de hand van het totaal aantal leerlingen op 1 oktober 2004 van de hoofdvestigingen en nevenvestigingen
      van basisscholen voor zover deze zich bevinden op het grondgebied van een gemeente, te vermenigvuldigen met:

      a. een bedrag van € 251,00;

      b. een bedrag van € 157,00 in 2009, in aanvulling op het bedrag, bedoeld in onderdeel a.

      3 Onverminderd het eerste lid, [artikel 12b, eerste lid][ref2], en [artikel 12ba, eerste lid][ref3], worden
      de uitkeringen aan de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht ten laste van de middelen die vanuit
      hoofdstuk VIII van de Rijksbegroting voor 2008 en 2009 ter beschikking worden gesteld ten behoeve van een
      extra impuls voor het realiseren van een dekkend aanbod aan voorschoolse plaatsen voor doelgroepkinderen in de
      Krachtwijken, op de volgende wijze verhoogd:

      a. voor Amsterdam: met € 1.770.000,– per jaar voor 2008 en 2009;

      b. voor Rotterdam: met € 1.680.000,– per jaar voor 2008 en 2009;

      c. voor Den Haag: met € 1.110.000,– per jaar voor 2008 en 2009;

      d. voor Utrecht: met € 440.000,– per jaar voor 2008 en 2009.

      4 Binnen vier weken na inwerkingtreding van deze regeling dienen de colleges van burgemeester en wethouders van
      de betreffende gemeenten bij de minister een aanvraag in tot de verhoging, bedoeld in het eerste lid. De aanvraag
      gaat vergezeld van een wijziging van het ontwikkelingsprogramma. In deze wijziging van het ontwikkelingsprogramma
      worden de te bereiken resultaten opnieuw geformuleerd met inachtneming van de in het ontwikkelingsprogramma eerder
      vastgelegde te bereiken resultaten, bedoeld in [artikel 5, tweede lid, van het Besluit][ref4], en met inachtneming
      van de indicatoren, bedoeld in [artikel 10, onderdelen a en ba][ref5].

      5 Aanvragen die zijn ingediend voor de inwerkingtreding van dit artikel worden aangemerkt als aanvragen als bedoeld
      in dit artikel. Voor de gemeenten Amsterdam, Rotterdam, Den Haag en Utrecht geldt als aanvraag de ‘Bestuurlijke
      overeenkomst over voorschoolse educatie in de G4’, die op 17 maart 2008 is getekend door de wethouders Onderwijs
      van de betreffende gemeenten en de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, mevrouw Sharon A.M.
      Dijksma.

      6 De minister neemt een beschikking tot verlening van de in het eerste en derde lid bedoelde verhoging binnen
      vier weken na de inwerkingtreding van dit artikel. De verhoging, bedoeld in het eerste lid, wordt voor 30 procent
      toegedeeld aan de indicator, bedoeld in [artikel 10, onderdeel a][ref6], en voor 70 procent aan de indicator,
      bedoeld in [artikel 10, onderdeel ba][ref7]. Als bij de indicator, bedoeld in [artikel 10, onderdeel ba][ref8],
      gekozen is voor een uitsplitsing in subindicatoren, wordt de 70 procent toegedeeld aan die subindicatoren met
      gelijke percentages. De verhoging, bedoeld in het derde lid, wordt in zijn geheel toegedeeld aan de betreffende
      subindicator, bedoeld in [artikel 10, onderdeel ba][ref9].

      7 De minister kan minder dan 100 percent verlenen van het in het tweede lid bedoelde procentuele aandeel, indien de
      in het ontwikkelingsprogramma opgenomen resultaten naar zijn oordeel daartoe aanleiding geven.

      8 De minister geeft niet eerder toepassing aan het vorige lid dan nadat hij het college van burgemeester en
      wethouders van de betreffende gemeente heeft geïnformeerd waarom hij voornemens is daartoe over te gaan en hij het
      college binnen een door hem te bepalen termijn in de gelegenheid heeft gesteld een aanpassing van de wijziging van
      het ontwikkelingsprogramma in te zenden.


