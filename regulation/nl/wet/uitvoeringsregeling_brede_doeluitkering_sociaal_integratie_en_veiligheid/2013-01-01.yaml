  - number: '10'
    text: |-
      De indicatoren, bedoeld in [artikel 7, tweede lid, van het Besluit][ref1], zijn:

      a. het aantal doelgroepkinderen dat deelneemt aan voorschoolse educatie;

      b. het aantal leerlingen dat heeft deelgenomen aan een schakelklas;

      ba. een door het college van burgermeester en wethouders van de betreffende gemeente te bepalen indicator op het
      gebied van onderwijsachterstandenbeleid anders dan bedoeld onder a en b; onder deze door de gemeente te bepalen
      indicator kan het college van burgemeester en wethouders van de betreffende gemeente tevens kiezen voor een
      uitsplitsing in subindicatoren;

      c. het aantal voortijdig schoolverlaters onder de drieëntwintig jaar dat is herplaatst en alsnog
      een startkwalificatie behaalt van tenminste het niveau van de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onder b, van de Wet educatie en beroepsonderwijs][ref2];

      ca. een door het college van burgermeester en wethouders van de betreffende gemeente te bepalen indicator op het
      gebied van het terugdringen van voortijdig schoolverlaten anders dan bedoeld onder c;

      d. het aantal trajecten dat door een gemeente bij een roc wordt ingekocht, waarbij een traject kan worden opgebouwd
      uit onderdelen van opleidingen educatie;

      e. het aantal deelnemers dat met een opleiding educatie is gestart;

      f. het aantal deelnemers dat een opleiding educatie succesvol heeft afgerond;

      g. een door het college van burgemeester en wethouders van de betreffende gemeente te bepalen indicator op het
      gebied van educatie anders dan bedoeld onder d tot en met f; onder deze door de gemeente te bepalen indicator
      kan het college van burgemeester en wethouders van de betreffende gemeente tevens kiezen voor een uitsplitsing in
      subindicatoren naar onderdelen van opleidingen educatie;

      h. de gemiddelde verblijfsduur in de maatschappelijke opvang;

      i. het aantal plaatsen in de vrouwenopvang;

      j. het aantal behandelingen op het gebied van de verslavingszorg dat per jaar wordt afgesloten;

      k. een door het college van burgemeester en wethouders van de betreffende gemeente te bepalen indicator op het
      gebied van maatschappelijke opvang, de verslavingszorg of van vrouwenopvang anders dan bedoeld onder h tot en
      met j; onder deze door de gemeente te bepalen indicator kan het college van burgemeester en wethouders van de
      betreffende gemeente tevens kiezen voor een uitsplitsing in subindicatoren;

      l. het aantal personen van nul tot negentien jaar met overgewicht die via de Jeugdgezondheidszorg wordt opgespoord
      en voor wie gezondheidsinterventies worden ingezet;

      m. een door de gemeenteraad te bepalen doelstelling op het gebied van de bestrijding van gezondheidsachterstanden
      anders dan bedoeld onder l;

      n.

      o.

      p. het procentuele deel van de personen die overlast geven op straat dat in maatschappelijke opvang kan worden
      geplaatst, die in crisissituaties vierentwintig uur per dag beschikbaar is;

      q. de aanwezigheid van een convenant of van een ander arrangement tussen alle partijen betrokken bij huiselijk
      geweld;

      r. de aanwezigheid van een advies- en steunpunt huiselijk geweld voor 1 januari 2009 (incl. aanvullende afspraken
      extra impuls); onder deze indicator kan het college van burgemeester en wethouders van de betreffende gemeente
      tevens kiezen voor een uitsplitsing in subindicatoren;

      s.

      t. het verminderen van criminaliteit in risicogebieden en in de woonomgeving uitgedrukt in een door de gemeenteraad
      te bepalen indicator;

      u. een door de gemeenteraad te bepalen doelstelling op het gebied van veiligheid anders dan bedoeld onder n tot en
      met t;

      v. het aantal vast te stellen inburgeringsvoorzieningen;

      w. het aantal vast te stellen gecombineerde inburgeringsvoorzieningen;

      x. het aantal bekend te maken handhavingsbeschikkingen en te verstrekken kennisgevingen;

      y. het aantal vast te stellen inburgeringsvoorzieningen ten behoeve van geestelijke bedienaren;

      z. het door de gemeenteraad te bepalen aantal inburgeringsplichtigen en
      inburgeraars dat op 1 januari 2007 deelneemt aan opleidingen educatie, bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel d, van de Wet educatie en beroepsonderwijs][ref3], alsmede de door de
      gemeenteraad te bepalen omvang van het bedrag dat benodigd is om deze opleidingen educatie gedurende het jaar 2007
      te bekostigen;

      aa. het aantal vast te stellen inburgeringsvoorzieningen ten behoeve van inburgeringsplichtigen, bedoeld in
      het besluit van de Staatssecretaris van Justitie van 12 juni 2007, nr. 2007/11, houdende wijziging van de
      Vreemdelingencirculaire 2000, aan wie geen persoonsvolgend budget is verstrekt;

      bb. het aantal vast te stellen duale inburgeringsvoorzieningen;

      cc. het aantal vast te stellen taalkennisvoorzieningen.


