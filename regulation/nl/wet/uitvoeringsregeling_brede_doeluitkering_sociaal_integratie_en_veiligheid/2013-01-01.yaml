    text: |-
      1 De percentsgewijze verdeling van de middelen voor leefbaarheid en veiligheid over de indicatoren, bedoeld in
      [artikel 7, tweede lid, van het Besluit][ref1], is als volgt samengesteld:

      a. 40,35 percent aan de indicator, bedoeld in [artikel 10, onder p][ref2], en

      b. 59,65 percent aan de indicator, bedoeld in [artikel 10, onder t][ref3].

      2 Bij de percentsgewijze verdeling van de middelen voor het terugdringen van voortijdig schoolverlaten over
      de indicatoren, bedoeld in [artikel 7, tweede lid, van het Besluit][ref4], wordt 100 percent toegedeeld
      aan de indicator, bedoeld in [artikel 10, onder c][ref5]. Indien ten aanzien van de indicator, bedoeld in
      [artikel 10, onder c][ref6], geen resultaat is vastgelegd, wordt 100 percent toegedeeld aan de indicator, bedoeld
      in [artikel 10, onder ca][ref7].

      3 De percentsgewijze verdeling van de middelen voor de bestrijding van gezondheidsachterstanden over de
      indicatoren, bedoeld in [artikel 7, tweede lid, van het Besluit][ref8], is als volgt samengesteld:

      a. 80 percent aan de indicator, bedoeld in [artikel 10, onder l][ref9], en

      b. 20 percent aan de indicator, bedoeld in [artikel 10, onder m][ref10].

      4 De percentsgewijze verdeling van de middelen voor maatschappelijke opvang en verslavingsbeleid respectievelijk
      voor vrouwenopvang over de indicatoren, bedoeld in [artikel 7, tweede lid, van het Besluit][ref11], is steeds als
      volgt samengesteld:

      a. 33,90 percent aan de indicator, bedoeld in [artikel 10, onder h][ref12];

      b. 17,50 percent aan de indicator, bedoeld in [artikel 10, onder i][ref13];

      c. 28,60 percent aan de indicator, bedoeld in [artikel 10, onder j][ref14], en

      d. 20,00 percent aan de indicator, bedoeld in [artikel 10, onder k][ref15]. Voor de centrumgemeenten voor
      maatschappelijke opvang, openbare geestelijke gezondheidszorg en verslavingsbeleid Amsterdam, Rotterdam, Den Haag
      en Utrecht, die een Plan van aanpak maatschappelijke opvang, bedoeld in [artikel 12h, derde lid][ref16], hebben
      opgesteld, met daarin opgenomen de te bereiken resultaten, wordt de percentsgewijze verdeling van de middelen,
      bedoeld in onderdeel a respectievelijk onderdeel c van dit lid, tezamen met de percentsgewijze verdeling van
      de middelen, bedoeld in [artikel 12h, vierde lid][ref17], toegevoegd aan de 20,00 percent, bedoeld in de eerste
      zin van dit onderdeel. Als bij de indicator, bedoeld in [artikel 10, onderdeel k][ref18], gekozen is voor een
      uitsplitsing in subindicatoren, wordt het totale percentage, bedoeld in de vorige zin, toegerekend aan die
      subindicatoren met gelijke percentages.

      5 De percentsgewijze verdeling van de extra middelen voor veiligheid over de indicatoren, bedoeld in
      [artikel 7, tweede lid, van het Besluit][ref19], is als volgt samengesteld:

      a. 26,67 percent aan de indicator, bedoeld in [artikel 10, onder q][ref20];

      b. 26,67 percent aan de indicator, bedoeld in [artikel 10, onder r][ref21];

      c. 26,67 percent aan de indicator, bedoeld in [artikel 10, onder t][ref22], en

      d. 20,00 percent aan de indicator, bedoeld in [artikel 10, onder u][ref23].

      6 De bedragen, bedoeld in de [artikelen 12d][ref24] en [12e, eerste lid][ref25], worden toegerekend aan de
      middelen, genoemd in het eerste tot en met vijfde lid, evenredig naar de omvang van die middelen, en daarbinnen
      naar rato van de in die leden genoemde percentsgewijze verdeling over de indicatoren.


