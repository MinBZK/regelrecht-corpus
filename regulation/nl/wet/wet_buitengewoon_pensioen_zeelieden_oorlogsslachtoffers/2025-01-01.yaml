  - number: 27a
    text: |-
      1 Zo spoedig mogelijk na het overlijden van een zeeman, die op het tijdstip van zijn overlijden recht op
      buitengewoon pensioen ontleende aan [artikel 3][ref1], wordt een uitkering (overlijdensuitkering) ten bedrage
      van tweemaal het bedrag van het buitengewoon pensioen van de overledene over de maand, waarin hij is overleden,
      uitbetaald:

      a. aan de langstlevende der echtgenoten, indien de overledene niet duurzaam van de andere echtgenoot gescheiden
      leefde;

      b. bij ontstentenis van de onder *a* bedoelde persoon aan de minderjarige kinderen die in familierechtelijke
      betrekking tot de overledene stonden of minderjarige kinderen, waarvoor de overledene ten tijde van het overlijden
      de pleegouderlijke zorg droeg;

      c. bij ontstentenis van de onder *a* en *b* bedoelde personen aan ouders, meerderjarige kinderen, broers of zusters
      van de overledene, indien de overledene ten tijde van het overlijden grotendeels in de kosten van het bestaan van
      deze betrekkingen voorzag;

      d. bij ontstentenis van de onder *a*, *b* en *c* bedoelde personen aan degenen, ten aanzien van wie de overledene
      ten tijde van het overlijden grotendeels in de kosten van het bestaan voorzag en met wie hij tot zijn overlijden
      duurzaam in gezinsverband heeft geleefd.

      2 In het eerste lid wordt verstaan onder:

      a. buitengewoon pensioen: het pensioen, bedoeld in [artikel 8][ref2], verhoogd met de vermeerdering, bedoeld in de
      [artikelen 9][ref3] en [10][ref4], ongeacht het bepaalde in [artikel 11][ref5];

      b. het bedrag van het buitengewoon pensioen: het pensioenbedrag, bedoeld in [artikel 28][ref6];

      c. pleegouderlijke zorg: de zorg voor het onderhoud en de opvoeding van een kind, als ware het een eigen kind,
      onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding daarvoor.

      3 Zo spoedig mogelijk na het overlijden van de weduwe of de gewezen echtgenote van een zeeman wordt, indien die
      weduwe of die gewezen echtgenote op het tijdstip van haar overlijden recht op buitengewoon pensioen ontleende
      aan [artikel 14, eerste onderscheidenlijk tweede lid][ref7], een uitkering (overlijdensuitkering) ten bedrage
      van tweemaal het bedrag van het buitengewoon pensioen van de overledene over de maand, waarin zij is overleden,
      uitbetaald aan de minderjarige kinderen die in familierechtelijke betrekking tot de overledene stonden, welke
      met het overlijden van hun moeder ouderloos zijn geworden, of minderjarige kinderen, waarvoor de overledene ten
      tijde van het overlijden de pleegouderlijke zorg droeg. Het bepaalde in de vorige volzin is van overeenkomstige
      toepassing na het overlijden van de weduwnaar of de gewezen echtgenoot van een vrouwelijke schepeling.

      4 In het derde lid wordt verstaan onder:

      a. buitengewoon pensioen: het pensioen, bedoeld in artikel 17,  en , onderscheidenlijk *i* en *j*, vastgesteld
      met inachtneming van het bepaalde in [de artikelen 18][ref8] en [19][ref9], ongeacht het bepaalde in
      [artikel 20][ref10];

      b. het bedrag van het buitengewoon pensioen: het pensioenbedrag, bedoeld in [artikel 28][ref11];

      c. pleegouderlijke zorg: hetgeen daaronder wordt verstaan in het eerste lid.

      5 Indien er geen rechthebbenden als bedoeld in het eerste en derde lid zijn, is de Sociale verzekeringsbank
      bevoegd de in die leden bedoelde uitkering geheel of gedeeltelijk uit te betalen aan de persoon of de personen,
      die daarvoor naar zijn oordeel op billijkheidsoverwegingen in aanmerking komt onderscheidenlijk komen, mits
      deze daartoe binnen zes maanden na het overlijden een verzoek bij genoemde Sociale verzekeringsbank heeft
      onderscheidenlijk hebben ingediend.

      6 Op een krachtens dit artikel verleende uitkering worden op grond van hetzelfde overlijden krachtens andere
      wettelijke voorschriften verstrekte uitkeringen van overeenkomstige aard in mindering gebracht, indien die andere
      uitkeringen voortvloeien uit door de overledene genoten inkomsten als bedoeld in [artikel 11, derde lid][ref12].

      7 De voorgaande leden zijn van overeenkomstige toepassing ingeval van vermissing van een buitengewoon
      pensioengerechtigde zeeman en van een buitengewoon pensioengerechtigde weduwe (weduwnaar) of gewezen echtgenote
      (echtgenoot) van een zeeman (vrouwelijke schepeling).

      8 Indien meer pensioen is uitbetaald dan overeenstemt met [artikel 24][ref13], wordt het teveel betaalde
      teruggevorderd, voor zover verrekening daarvan kan plaatsvinden met een overlijdensuitkering krachtens dit artikel.

      9 Indien een vermiste in leven blijkt te zijn, kan hetgeen aan tijdelijk pensioen, als bedoeld in
      [artikel 16, derde lid][ref14], en aan een krachtens dit artikel verleende overlijdensuitkering is uitbetaald
      worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002035#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel9
