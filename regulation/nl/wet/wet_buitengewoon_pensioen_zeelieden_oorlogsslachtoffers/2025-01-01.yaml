  - number: '28'
    text: |-
      Voor de toepassing van [artikel 28a ][ref1] en van de tot uitvoering daarvan genomen besluiten worden verstaan
      onder:

      a. pensioenbedragen: de aan [artikel 2, eerste lid][ref2], ontleende pensioenen, vermeerderd met de toeslag
      krachtens de [Toeslagwet buitengewone pensioenen 1966][ref3], voordat het bepaalde in de [artikelen 11][ref4],
      onderscheidenlijk [20][ref5] en [26a ][ref6] daarop is toegepast;

      b. grondslagen, welke voor de toepassing van [artikel 11, tweede lid][ref7], gelden voor
      de verrekening van inkomsten met het buitengewoon pensioen: de krachtens het bepaalde in de
      [Toeslagwet buitengewone pensioenen 1966][ref8] fictief verhoogde grondslagen;

      c. maxima, bedoeld in de [artikelen 17, e, f en g][ref9], [18, eerste lid][ref10] en [19, eerste lid][ref11],: de
      krachtens het bepaalde in de [Toeslagwet buitengewone pensioenen 1966][ref12] fictief verhoogde maxima.


