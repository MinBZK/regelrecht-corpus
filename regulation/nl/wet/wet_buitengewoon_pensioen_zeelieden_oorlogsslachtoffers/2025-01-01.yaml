  - number: 38a
    text: |-
      1 De schoonouders, die op de dag, voorafgaande aan die, waarop artikel 396, eerste lid, van Boek 1
      van het Burgerlijk Wetboek (nieuw) in werking treedt, recht hebben op buitengewoon pensioen krachtens
      [artikel 15, eerste lid, onder ][ref1], juncto artikel 17, , behouden dit recht, indien en voor zolang zij dit
      zouden hebben, wanneer artikel 464 van het Burgerlijk Wetboek (oud) nog van kracht zou zijn.

      2 De schoonmoeder, die op de dag, voorafgaande aan die, waarop
      [artikel 396, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2] (nieuw) in werking treedt, uitzicht heeft op
      wedertoekenning van buitengewoon pensioen krachtens [artikel 25, derde lid][ref3], behoudt dit uitzicht, indien en
      voor zolang zij dit zou hebben, wanneer artikel 464 van het Burgerlijk Wetboek (oud) nog van kracht zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel15
