  - number: 35d
    text: |-
      1 De pensioengrondslag van een zeeman, die gedurende een aaneengesloten periode van ten minste drie jaren andere
      of meer omvattende werkzaamheden heeft verricht dan die, in verband waarmede deze grondslag is vastgesteld,
      wordt, indien betrokkene deze werkzaamheden op grond van een verwonding, verminking, ziekte of gebrek als bedoeld
      in [artikel 3][ref1] of van de verergering daarvan heeft moeten beëindigen, op diens verzoek of op verzoek van
      zijn nagelaten betrekkingen opnieuw vastgesteld. Deze hernieuwde vaststelling geschiedt op de wijze, bepaald in
      [artikel 7][ref2], met dien verstande, dat voor het deel van de grondslag, dat verband hield met werkzaamheden
      van de zeeman, bij de hernieuwde vaststelling voor dat deel van de grondslag rekening wordt gehouden met de
      omstandigheden in het jaar, waarin de in de vorige volzin bedoelde werkzaamheden moesten worden beëindigd of - zo
      dit voor de belanghebbende gunstiger zou zijn - met de omstandigheden in het jaar, voorafgaande aan dat, waarin de
      inkomsten uit die werkzaamheden ten gevolge van een verwonding, verminking, ziekte of gebrek als bedoeld in artikel
      3 of van de verergering daarvan vermindering hebben ondergaan.

      2 Indien de pensioengrondslag opnieuw wordt vastgesteld, wordt tevens het percentage van de arbeidsongeschiktheid,
      als bedoeld in [artikel 8][ref3], opnieuw bepaald.

      3 De nieuwe vaststelling van de pensioengrondslag en van de arbeidsongeschiktheid blijft achterwege, indien blijkt,
      dat deze niet zou leiden tot een hoger buitengewoon pensioen.

      4 Het op de herziene grondslag gebaseerde pensioen gaat in op de eerste dag van de maand, volgende op die, waarin
      de in het eerste lid bedoelde werkzaamheden zijn beëindigd. Het bepaalde in [artikel 23, tweede lid][ref4], is van
      overeenkomstige toepassing. Jaar voor jaar wordt geen lager bedrag betaalbaar gesteld dan indien het eerste lid
      geen toepassing had gevonden.

      5 Ingeval een herziening, bedoeld in het eerste lid, plaatsvindt, wordt het jaarbedrag, waarvan de grondslag
      overeenkomstig het bepaalde in [artikel 7, derde lid][ref5], wordt afgeleid, berekend door het peiljaar-inkomen te
      herleiden tot een inkomen ten tijde van het inwerkingtreden van deze wet met toepassing van een op de indexcijfers
      der lonen gebaseerde rekenfactor. Deze rekenfactor wordt door Onze Minister per 1 januari 1978 vastgesteld en
      vervolgens telkens met ingang van 1 januari door hem herzien.

      6 Indien het jaarbedrag, hetwelk met toepassing van het bepaalde in [artikel 35][ref6], is vastgesteld ingeval
      een herziening, bedoeld in [artikel 35][ref7], heeft plaatsgevonden, en waarvan de grondslag overeenkomstig
      het bepaalde in [artikel 7, derde lid][ref8], is afgeleid, verhoogd met het percentage, waarmede het peil der
      buitengewone pensioenen in de periode 1947 tot en met 31 december van het voor de vaststelling van de grondslag
      gediend hebbende peiljaar is gestegen, als uitkomst een bedrag oplevert, dat vijf procent of meer ten achter blijft
      bij de inkomsten, die de zeeman in dat peiljaar op grond van de in [artikel 35][ref9], bedoelde werkzaamheden
      heeft genoten, of zou hebben genoten, indien hij zijn werkzaamheden in verband met zijn arbeidsongeschiktheid of
      de verergering daarvan, in de loop van dat jaar heeft moeten beëindigen, of indien hij in de loop van dat jaar is
      overleden wordt de grondslag, in afwijking van het bepaalde in [artikel 7, tweede lid][ref10], overeenkomstig het
      bepaalde in [artikel 7, derde lid][ref11] , afgeleid van het jaarbedrag dat wordt verkregen, door de inkomsten,
      die in het peiljaar door de zeeman zijn of zouden zijn genoten op grond van de in [artikel 35][ref12], bedoelde
      werkzaamheden, kinderbijslag of kindertoeslag daarin niet begrepen, met hantering van het percentage, waarmede
      het peil der buitengewone pensioenen is aangepast als rekenfactor, te herleiden tot een inkomen ten tijde van het
      inwerkingtreden van deze wet.


