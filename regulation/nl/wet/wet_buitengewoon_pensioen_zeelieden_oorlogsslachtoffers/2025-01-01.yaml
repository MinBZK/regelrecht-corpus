  - number: '19'
    text: |-
      1 De buitengewone pensioenen, toegekend aan de personen, bedoeld in artikel 17, ,  en , zullen tezamen niet
      meer mogen bedragen dan tachtig procent van de eerste € 2268,90 en veertig procent van het overige bedrag van de
      pensioengrondslag.

      2 Indien de buitengewone pensioenen van de personen, bedoeld in artikel 17, ,  en , tezamen meer zouden bedragen
      dan het in het eerste lid voor hen gestelde maximum, zal elk buitengewoon pensioen een evenredige vermindering
      ondergaan.

      3 In geval het bepaalde bij het tweede lid is toegepast en in het aantal op buitengewoon pensioen recht hebbende
      kinderen wijziging komt, zal de toegepaste evenredige vermindering worden herzien en wel met ingang van de maand
      volgende op die, waarin de wijziging is ingetreden.

      4 Indien het recht op buitengewoon pensioen van een der nagelaten betrekkingen, bedoeld in [artikel 17][ref1],
      teniet gaat of krachtens [artikel 14, tweede lid][ref2], later ingaat, alsmede indien het recht op buitengewoon
      pensioen krachtens [artikel 25][ref3] eindigt dan wel opnieuw ingaat, vindt een herziening op grond van het
      bepaalde in [artikel 18 en de voorgaande leden van dit artikel][ref4] alleen plaats ten aanzien van de buitengewone
      pensioenen van de overige rechthebbenden bedoeld in artikel 17, , , , ,  en .


