        hoofdstuk: Achtste
  - number: '14'
    text: |-
      1 Recht op buitengewoon pensioen heeft de weduwe van een zeeman, indien haar echtgenoot het leven heeft
      verloren in verband met zijn dienstbetrekking als zeeman gedurende het in het [eerste lid van artikel 1][ref1]
      genoemde tijdvak, of in verband met zijn gevangenhouding door de vijand dan wel indien hij op
      het tijdstip van zijn overlijden recht op buitengewoon pensioen ontleende aan het bepaalde in
      [artikel 3, eerste, tweede, derde en vierde lid][ref2].

      2 Eveneens recht op buitengewoon pensioen heeft de vrouw, met wie een overleden zeeman gehuwd is geweest, mits:

      a. de man op de dag waarop de beschikking tot echtscheiding of de ontbinding van het huwelijk is
      uitgesproken dan wel het geregistreerd partnerschap ingevolge [artikel 80c, onder c en d, van Boek 1 van
      het Burgerlijk Wetboek](onbekend) is beëindigd, recht op buitengewoon pensioen ontleende aan het bepaalde in
      [artikel 3, eerste, tweede, derde en vierde lid][ref3], en hij dat recht ook op het tijdstip van zijn overlijden
      kon doen gelden,

      b. de onder *a* bedoelde dag ligt na het tijdstip van de inwerkingtreding van de Wet herziening echtscheidingsrecht
      en de echtscheiding of de ontbinding van het huwelijk niet is uitgesproken met toepassing van het vóór genoemd
      tijdstip geldende recht, en

      c. de vrouw niet als gevolg van hertrouwen, het aangaan van een huwelijk na een geregistreerd partnerschap, het
      aangaan van een geregistreerd partnerschap na een huwelijk dan wel het opnieuw aangaan van een geregistreerd
      partnerschap met haar vroegere echtgenoot ter zake van diens overlijden recht op buitengewoon weduwenpensioen
      verkrijgt.

      Met dien verstande, dat indien de vrouw op de datum van overlijden van haar vroegere echtgenoot is hertrouwd of
      geregistreerd dan wel opnieuw geregistreerd, het recht op buitengewoon pensioen, hetwelk zij aan dat overlijden
      ontleent, eerst ontstaat op de dag, volgende op die, waarop dat volgende door haar gesloten huwelijk is ontbonden.

      3 Buitengewoon pensioen als in de voorgaande leden van dit artikel bedoeld, komt eveneens toe aan:

      a. de weduwnaar van een vrouwelijke schepeling, die als zeeman in de zin van deze wet kan worden aangemerkt;

      b. de man, met wie een overleden vrouwelijke schepeling, die als zeeman in de zin van deze wet kan worden
      aangemerkt, gehuwd is geweest.

      Op het buitengewoon pensioen van de in de vorige volzin onder *a* en *b* genoemde personen zijn de bepalingen van
      deze wet, betrekking hebbende op het buitengewoon pensioen van de in het eerste onderscheidenlijk tweede lid van
      dit artikel genoemde personen, van overeenkomstige toepassing.

      4 Het bepaalde in [artikel 3, vijfde lid][ref4], is op de in het eerste, tweede en derde lid van dit artikel
      genoemde personen van overeenkomstige toepassing.

      5 De in het eerste, tweede en derde lid van dit artikel genoemde personen, die van ontrouw aan de zaak van Ons
      Koninkrijk, aan Ons of aan Onze Regering hebben blijk gegeven, kunnen geen rechten ontlenen aan het bepaalde in
      deze wet, tenzij de Raad termen aanwezig acht anders te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002035#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel3
