  - number: 35e
    text: |-
      1 De beschikking van de Raad of de Sociale verzekeringsbank kan door hem in het nadeel van de bij die beschikking
      betrokkene worden herzien op grond van gebleken onjuistheid van aan die beschikking ten grondslag gelegde feiten,
      dan wel op grond van gegevens die niet bekend waren ten tijde van het geven van die beschikking, en die, zo zij wel
      bekend waren geweest, tot een andersluidende beschikking zouden hebben geleid. Indien deze herziening zou leiden
      tot intrekking van het recht op buitengewoon pensioen, wordt de herzieningsbeschikking eerst gegeven nadat de
      betrokkene door de Raad of de Sociale verzekeringsbank is gehoord.

      2 Indien een ingevolge deze wet genomen beschikking in het nadeel van de belanghebbende wordt herzien,
      wordt hetgeen reeds was uitbetaald ingevolge die beschikking niet teruggevorderd of verrekend, tenzij in de
      herzieningsbeschikking is uitgesproken, dat de gebleken onjuistheid van de aan de oorspronkelijke beschikking ten
      grondslag gelegde feiten was te wijten aan opzet dan wel grove nalatigheid van betrokkene.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel35e
  - number: 35f
    text: |-
      De Raad of de Sociale verzekeringsbank is bevoegd, op daartoe door of vanwege de belanghebbende gedane aanvrage,
      een door de Raad of de Sociale verzekeringsbank of de Centrale Raad van Beroep gegeven beschikking dan wel
      uitspraak in het voordeel van de bij die beschikking dan wel uitspraak betrokkene te herzien.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel35f
  - number: 35g
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van de [artikelen 35][ref1], [35][ref2] en [35][ref3] is
      het vierde hoofdstuk van overeenkomstige toepassing, met uitzondering van [artikel 22, tweede lid][ref4], en
      [artikel 22][ref5].


