  - number: '39'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur nadere voorschriften te geven omtrent de uitvoering van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel39
  - number: '40'
    text: Deze wet kan worden aangehaald onder de titel "Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers".
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel40
  - number: '41'
    text: Deze wet treedt in werking met ingang van de dag volgende op die harer afkondiging.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel41
