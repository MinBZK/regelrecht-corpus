  - number: 28f
    text: |-
      Het van toepassing zijnde normbedrag bedraagt:

      a. voor de gepensioneerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet heeft bereikt; zeventig procent van de
      minimum-pensioengrondslag op maandbasis'

      b. voor de gepensioneerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt: vijftig procent van de minimum-
      pensioengrondslag op maandbasis, vermeerderd met twintig procent van het bedrag van het bruto-ouderdomspensioen
      voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref3]
      alsmede van het bedrag van de bruto-vakantie-uitkering, vastgesteld overeenkomstig
      [artikel 29, eerste lid, aanhef en onder a, van die wet][ref4].


