  - number: 28g
    text: De garantietoeslag gaat in op de eerste dag van de maand, waarin het recht op de garantietoeslag is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel28g
  - number: 28h
    text: |-
      1 Indien de pensioengerechtigde over zijn buitengewoon pensioen of garantietoeslag de inkomensafhankelijke
      bijdrage, bedoeld in [artikel 43 van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een
      toeslag. Deze toeslag bedraagt het percentage van het buitengewoon pensioen of de garantietoeslag dat overeenkomt
      met het bijdragepercentage, bedoeld in [artikel 45, tweede lid, van de Zorgverzekeringswet][ref2], vermenigvuldigd
      met anderhalf, voorzover het pensioen of de garantietoeslag is te rekenen tot het deel van het bijdrage-inkomen,
      bedoeld in [artikel 43, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref3].

      2 Indien de pensioengerechtigde over zijn buitengewoon pensioen of garantietoeslag de bijdrage, bedoeld in
      [artikel 68b, vijfde lid][ref4], of [artikel 69, tweede lid, van de Zorgverzekeringswet][ref5], verschuldigd
      is, heeft hij recht op een toeslag. Voor de berekening van deze toeslag is het eerste lid, tweede volzin, van
      overeenkomstige toepassing.

      3 Het in aanmerking te nemen bijdrage-inkomen bedraagt op jaarbasis ten hoogste het bedrag, bedoeld in
      [artikel 43, derde lid, van de Zorgverzekeringswet][ref6].

      4 Op de toeslagen, bedoeld in het eerste en tweede lid, is het [zevende hoofdstuk][ref7] van toepassing, met
      uitzondering van de [artikelen 28i][ref8] en [31b][ref9].


