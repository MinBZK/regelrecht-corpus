  - number: '15'
    text: |-
      1 Indien de zeeman het leven heeft verloren in verband met zijn dienstbetrekking als zeeman gedurende het in
      het [eerste lid van artikel 1][ref1] genoemde tijdvak, of in verband met zijn gevangenhouding door de vijand,
      dan wel indien hij is overleden aan de gevolgen van verwonding, verminking, ziekten of gebreken als bedoeld in
      [artikel 3, eerste en tweede lid][ref2], ontstaat voorts recht op buitengewoon pensioen voor:

      a. elk kind dat in familierechtelijke betrekking stond tot de overledene; voorts onder de voorwaarden in
      [artikel 18][ref3] gesteld, voor:

      b. elk ander kind, ten behoeve van hetwelk aan de overledene onderhoudsplicht krachtens het Burgerlijk Wetboek was
      opgelegd of ten behoeve van hetwelk de overledene een zodanige onderhoudsplicht had erkend dan wel te wiens behoeve
      het opleggen of de erkenning van die onderhoudsplicht door oorlogsomstandigheden is verhinderd;

      c. de ouders, of bij ontstentenis van deze de grootouders van de overledene, indien deze hun kostwinner was;

      d. elk ouderloos kleinkind van de overledene, indien deze deszelfs kostwinner was;

      e. de schoonouders van de overledene, indien deze hun kostwinner was.

      2 Eveneens recht op buitengewoon pensioen heeft elk kind dat in familierechtelijke betrekking stond
      tot een zeeman, die is overleden door andere oorzaken dan in het vorige lid bedoeld, mits de zeeman
      op het tijdstip van zijn overlijden recht op buitengewoon pensioen ontleende aan het bepaalde in
      [artikel 3, eerste, tweede, derde en vierde lid][ref4].

      3 Recht op buitengewoon pensioen bestaat voor de kinderen, bedoeld in het eerste lid, onder a, b en d, alsmede voor
      de kinderen, bedoeld in het tweede lid, zolang zij beneden de leeftijd van eenentwintig jaren en niet gehuwd of
      gehuwd geweest zijn en voor de schoonouders, bedoeld in het eerste lid, onder e, zolang de overledene, ware hij nog
      in leven, als behuwdkind jegens hen onderhoudsplichtig zou zijn geweest.

      4 Voor de toepassing van deze wet worden met de in het eerste lid, onder a, bedoelde kinderen gelijkgesteld
      kinderen, die op het tijdstip van het overlijden op kosten van de zeeman werden opgevoed en na diens overlijden
      geen kostwinner hebben.

      5 Het bepaalde in [artikel 14, vijfde lid][ref5], is op de hiervoren genoemde nagelaten betrekkingen van
      overeenkomstige toepassing.


