preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen met betrekking tot het recht
    op buitengewoon pensioen ten behoeve van zeelieden, die door de oorlog zijn getroffen, alsmede van hun nagelaten
    betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze wet wordt verstaan onder:

      "Onze Minister": Onze Minister van Volksgezondheid, Welzijn en Sport;

      "de Raad": de Pensioen- en Uitkeringsraad, bedoeld in
      [artikel 3 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref1];

      de Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      "zeeman": de kapitein of schepeling, een vrouwelijke schepeling inbegrepen, die, Nederlander zijnde, deel uitmaakte
      van de bemanning van een zeevaartuig op enig tijdstip gedurende het tijdvak van 1 september 1939 tot en met 2
      maart 1946 of van een zeevissersvaartuig op enig tijdstip gedurende het tijdvak van 1 september 1939 tot en met 15
      december 1945;

      "gewezen echtgenote": de vrouw, bedoeld in [artikel 14, tweede lid][ref3];

      "peiljaar": het jaar vastgesteld ingevolge [artikel 7, tweede lid][ref4], en [artikel 35][ref5];

      "minimum-pensioengrondslag": de pensioengrondslag, bedoeld in [artikel 7, derde lid, aanhef][ref6].

      2 Voor de toepassing van deze wet hebben de woorden "zeevaartuig", "zeevissersvaartuig", en "lid van de bemanning"
      dezelfde betekenis als die, welke daaraan was toegekend in de Zeeongevallenwet 1919, zoals deze was gewijzigd
      bij de Wet van 18 september 1946, G 255, terwijl mede als zeevaartuig worden beschouwd de vaartuigen, waarop de
      Zeeongevallenwet 1919 van toepassing zou zijn geweest, indien zij ten tijde van de bovengenoemde wijziging nog in
      de vaart waren geweest.

      3 Het bepaalde in het tweede lid is niet van toepassing op het zeevaartuig, zeevissersvaartuig of lid van de
      bemanning, hetwelk zich bevond in de feitelijke macht van een vijandelijke mogendheid of van een mogendheid, welker
      gebied, ingevolge het Koninklijk besluit van 27 maart 1941, *Stb.* B 30, met vijandelijk gebied was gelijkgesteld.


