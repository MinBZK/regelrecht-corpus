  - number: '4'
    text: Een buitengewoon pensioen kan blijvend of voorlopig worden toegekend.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel4
  - number: '5'
    text: |-
      Het buitengewoon pensioen wordt blijvend toegekend, indien hetzij bij de eerste toekenning, hetzij bij vernieuwing
      van pensioen, verandering van het percentage van arbeidsongeschiktheid voor de toekomst niet aannemelijk wordt
      geacht.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het buitengewoon pensioen wordt voorlopig toegekend, indien verandering van het percentage van
      arbeidsongeschiktheid voor de toekomst aannemelijk wordt geacht.

      2 Het voorlopig buitengewoon pensioen wordt voor ten hoogste vijf jaren toegekend; het kan meermalen worden
      verleend.

      3 Indien, nadat een voorlopig buitengewoon pensioen niet is vernieuwd, doordat de arbeidsongeschiktheid van de
      zeeman is gedaald beneden tien procent, later blijkt, dat de arbeidsongeschiktheid wederom tot ten minste tien
      procent is gestegen, zonder dat de aanwezigheid van een nieuwe oorzaak aannemelijk moet worden geacht, wordt
      opnieuw voorlopig buitengewoon pensioen, of indien verandering van het percentage van arbeidsongeschiktheid voor de
      toekomst niet aannemelijk wordt geacht, blijvend buitengewoon pensioen toegekend.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel6
  - number: '7'
    text: |-
      1 Ingeval krachtens deze wet aanspraak op buitengewoon pensioen ontstaat, wordt door de Raad de pensioensgrondslag
      vastgesteld, waarnaar het buitengewoon pensioen moet worden berekend.

      2 De pensioensgrondslag wordt overeenkomstig het bepaalde in het derde lid afgeleid van het jaarbedrag, dat naar
      redelijkheid nodig is om de zeeman in staat te stellen te leven op de voet, waarop gelijksoortige valide personen
      gemiddeld leefden ten tijde van de inwerkingtreding van deze wet, met dien verstande, dat bij de vaststelling
      van dit bedrag geen rekening wordt gehouden met de mogelijkheid van bevordering of anderszins en voorts met de
      bepaling, dat voor de vaststelling van deze voet geen rekening wordt gehouden met het bedrag, waarmede lonen het
      maximum, dat daarvoor door het College van Rijksbemiddelaars is goedgekeurd, overschrijden.

      3 De pensioengrondslag bedraagt ten minste € 1 225,21 en ten hoogste:

      100 procent van de eerste € 2813,44,

      36,84 procent van de volgende € 1724,37,

      30 procent van de volgende € 907,56,

      20 procent van de volgende € 907,56,

      10 procent van de volgende € 907,56, en

      5 procent van de volgende € 1815,12 van het jaarbedrag bedoeld in het tweede lid.

      4 Omtrent de vaststelling van de pensioensgrondslag kunnen bij algemene maatregel van bestuur nadere regelen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel7
  - number: '8'
    text: |-
      1 Het buitengewoon pensioen bedraagt zoveel procent van het bedrag van de pensioensgrondslag als het voor de
      belanghebbende vastgestelde percentage van arbeidsongeschiktheid beloopt.

      2 Percentages van arbeidsongeschiktheid boven 10 procent worden uitgedrukt in veelvouden van 10 procent.

      3 Voor de toepassing van het eerste lid wordt bij een percentage van minder dan tien arbeidsongeschiktheid geacht
      niet te bestaan.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel8
  - number: '9'
    text: |-
      Het buitengewoon pensioen wordt éénmaal met twintig procent van de pensioensgrondslag vermeerderd, wanneer ten
      gevolge van de verwonding, verminking, ziekten of gebreken, in [artikel 3][ref1] bedoeld:

      a. één der ledematen (handen of voeten) is verloren gegaan, of voorgoed geheel onbruikbaar is geworden, dan wel een
      toestand is ontstaan, welke met een zodanig verlies of een zodanige onbruikbaarheid is gelijk te stellen;

      b. twee of meer ledematen dermate in beweeglijkheid of bruikbaarheid zijn verminderd, dat de toestand van de
      belanghebbende met die onder *a* beschreven is gelijk te stellen;

      c. het gezichtsvermogen door organische en/of traumatische oorzaken zodanig is beperkt, dat het vermogen om zich
      zelfstandig te bewegen er ernstig door wordt getroffen;

      d. belangrijke misvorming van het gelaat is ontstaan, welke door hulpmiddelen niet voldoende te verbergen is, zodat
      de belanghebbende de omgang met zijn medemensen ernstig wordt bemoeilijkt; of

      e. een blijvend buitengewoon pensioen is verleend uit hoofde van een arbeidsongeschiktheid van 80 of 90 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel3
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel9
    references:
