  - number: '16'
    text: |-
      1 Aan de in de [artikelen 14][ref1] en [15][ref2] genoemde nagelaten betrekkingen van een zeeman wordt eveneens
      recht op buitengewoon pensioen verleend, indien zich een der gevallen voordoet, bedoeld in artikel 12 van de
      Zeeongevallenwet 1919.

      2 Als de dag van overlijden van de in het eerste lid bedoelde zeeman wordt voor de toepassing van deze wet
      aangenomen de dag, welke voor de toepassing van de Zeeongevallenwet 1919 als dag van overlijden is vastgesteld.

      3 Aan de in de [artikelen 14][ref3] en [15][ref4] genoemde betrekkingen van een zeeman wordt tijdelijk een
      buitengewoon pensioen verleend, indien de zeeman anders dan tengevolge van de vaarplicht of de oorlog vermist is
      geraakt en hij op het tijdstip van zijn vermissing recht op buitengewoon pensioen ontleende aan het bepaalde in
      [artikel 3][ref5].

      4 Het bedrag van het in het vorige lid bedoelde tijdelijke pensioen zal gelijk zijn aan het bedrag, waarop de
      belanghebbenden recht zouden hebben, wanneer de vermiste zou zijn overleden.

      5 Het tijdelijk pensioen gaat van rechtswege over in een blijvend buitengewoon pensioen, zodra het overlijden van
      de vermiste vaststaat of indien omtrent hem bij rechterlijke uitspraak de vermissing is vastgesteld.

      6 De overige bepalingen van dit hoofdstuk zijn ook op het tijdelijk buitengewoon pensioen van toepassing.


