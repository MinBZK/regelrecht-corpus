  - number: 28b
    text: |-
      1 Indien [artikel 28a][ref1] toepassing heeft gevonden worden bedoeld met:

      a. pensioenbedragen: de krachtens dat artikel verhoogde of verlaagde bedragen;

      b. grondslagen, welke voor de toepassing van [artikel 11, tweede lid][ref2], gelden voor de verrekening van
      inkomsten met het buitengewoon pensioen: de in [artikel 28, onder b][ref3], bedoelde grondslagen, welke,
      overeenkomstig het in [artikel 28a][ref4] voor de pensioenbedragen bepaalde, fictief zijn herzien;

      c. maxima, bedoeld in de [artikelen 17, e, f en g][ref5], [18, eerste lid][ref6] en [19, eerste lid][ref7],:
      de in [artikel 28, onder c][ref8], bedoelde maxima, welke, overeenkomstig het in [artikel 28a][ref9] voor de
      pensioenbedragen bepaalde, fictief zijn herzien.

      2 De pensioenbedragen alsmede de bedragen van de grondslagen en de maxima, bedoeld in het eerste lid, worden naar
      boven afgerond tot hele euro’s.


