  - number: '2'
    text: |-
      1 Onder de voorwaarden en naar de regelen, bij of krachtens deze wet gesteld, wordt buitengewoon pensioen verleend
      aan zeelieden, alsmede aan hun nagelaten betrekkingen.

      2 De zeeman, die van ontrouw aan de zaak van Ons Koninkrijk, aan Ons of aan Onze Regering heeft blijk gegeven, dan
      wel zijn diensten niet bij voortduring en naar behoren heeft vervuld, kan geen rechten ontlenen aan het bepaalde in
      deze wet, tenzij de Raad termen aanwezig acht anders te beslissen.

      3 De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      nadat het ontwerp in de *Staatscourant* is bekend gemaakt en aan een ieder de gelegenheid is geboden om binnen vier
      weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen.
      Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel2
  - number: '3'
    text: |-
      1 De zeeman heeft recht op buitengewoon pensioen in geval van:

      a. verwonding of verminking, ontstaan in dienst van het zeevaartuig of zeevissersvaartuig, bekomen in verband met
      de vaarplicht of de oorlog;

      b. ziekten of gebreken, welke geheel of gedeeltelijk het gevolg zijn van verrichtingen of vermoeienissen, aan
      zijn dienstbetrekking als zeeman gedurende het in het [eerste lid van artikel 1][ref1] genoemde tijdvak verbonden,
      of van de behandeling ondervonden tijdens gevangenhouding door de vijand, of van bijzondere omstandigheden of
      toestanden, welke zich in verband met zijn dienstbetrekking als zeeman gedurende genoemd tijdvak hebben voorgedaan,
      dan wel die tot uiting zijn gekomen of verergerd onder overwegende invloed van die verrichtingen, vermoeienissen,
      behandeling, bijzondere omstandigheden of toestanden; een en ander onder voorbehoud, dat die verwondingen,
      verminkingen, ziekten of gebreken niet door eigen opzettelijk toedoen zijn ontstaan, tot uiting gekomen of
      verergerd.

      2 Indien de in het eerste lid bedoelde verwonding, verminking, ziekten of gebreken een arbeidsongeschiktheid van
      ten minste veertig procent veroorzaken, doch het totaal der arbeidsongeschiktheid een hoger percentage bedraagt,
      geldt voor de vaststelling van de mate van arbeidsongeschiktheid, waarnaar het buitengewoon pensioen wordt
      berekend, dit hoger percentage, voorzoveel de meerdere arbeidsongeschiktheid niet duidelijk uit andere oorzaken dan
      de vaarplicht of de oorlog is ontstaan.

      3 Het verband of gevolg, bedoeld in het eerste lid, wordt geacht aanwezig te zijn, indien de zeeman:

      a. naar het oordeel van de Raad in verband met de aard van zijn verrichtingen als zeeman aan buitengewoon zware
      en langdurige spanningen heeft blootgestaan dan wel in het in [artikel 1, eerste lid][ref2], genoemde tijdvak in
      verband met de vaarplicht of de oorlog drie maanden of langer in gevangenschap heeft doorgebracht en

      b. voor ten minste zestig procent arbeidsongeschikt is en deze arbeidsongeschiktheid niet duidelijk uit andere
      oorzaken dan de vaarplicht of de oorlog is ontstaan.

      4 Bij de toepassing van het eerste, tweede en derde lid wordt rekening gehouden met de inzichten en ervaringen
      van de medische wetenschap met betrekking tot de relatie tussen de vaarplicht of de oorlog en de geestelijke en
      lichamelijke gezondheidstoestand.

      5 In bijzondere gevallen is de Raad bevoegd, het recht op buitengewoon pensioen toe te kennen aan een zeeman, op
      wie de voorafgaande bepalingen dezer wet niet of niet geheel van toepassing zijn. Een dergelijk besluit wordt niet
      genomen dan nadat Onze Minister daarin heeft toegestemd. Toestemming kan worden onthouden wegens strijd met het
      recht of het algemeen belang.

      6 Wanneer op grond van verwonding, verminking, ziekten of gebreken als bedoeld in het eerste lid een buitengewoon
      pensioen wordt toegekend en uit hoofde van die verwonding, verminking, ziekten of gebreken behandeling of
      verpleging is vereist, wordt aan de gepensioneerde ter zake daarvan vergoeding verleend volgens bij of krachtens
      algemene maatregel van bestuur te stellen regelen.

      7 In afwijking van het zesde lid kan aan categorieën gepensioneerden vergoeding ter zake van bepaalde de
      behandeling of verpleging omvattende voorzieningen worden verleend zonder dat deze voorzieningen uit hoofde van
      verwonding, verminking, ziekten of gebreken als bedoeld in het eerste lid, zijn vereist. Bij algemene maatregel van
      bestuur worden ter zake regels gesteld.

      8 Bij algemene maatregel van bestuur worden regels gesteld betreffende de mogelijkheid om de vergoeding ter
      zake van bepaalde de behandeling of verpleging omvattende voorzieningen na het overlijden van de gepensioneerde
      gedurende een bepaalde tijd ten gunste van de weduwe of weduwnaar voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002035#Artikel1
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel3
