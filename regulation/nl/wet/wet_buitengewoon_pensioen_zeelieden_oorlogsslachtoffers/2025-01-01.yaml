  - number: '21'
    text: |-
      1 Zij, die aanspraak menen te hebben op buitengewoon pensioen of vergoeding krachtens deze wet, dienen daartoe
      bij de Raad of de Sociale verzekeringsbank een aanvrage in. Indien zij niet eerder aanspraken op deze wet hebben
      doen gelden, moeten zij daarbij overleggen een verklaring ten genoege van de Raad of de Sociale verzekeringsbank,
      waaruit blijkt of zij al dan niet aanspraak hebben op een uitkering krachtens de Zeeongevallenwet 1919, de
      [Liquidatiewet ongevallenwetten][ref1] of de [Wet op de arbeidsongeschiktheidsverzekering][ref2].

      2 Zij, aan wie een voorlopig buitengewoon pensioen is toegekend, dienen, als zij menen ook verder voor buitengewoon
      pensioen in aanmerking te komen, binnen twee jaren na het einde van de termijn waarover voorlopig buitengewoon
      pensioen werd toegekend, een aanvrage in om weder in het genot van buitengewoon pensioen te worden gesteld.

      3 Personen, die verkeerden in het geval, bedoeld in het [derde lid van artikel 6][ref3], dienen, wanneer zij menen
      opnieuw aanspraak op buitengewoon pensioen te kunnen doen gelden, een aanvrage in.

      4 Indien door de overheid of enig door de overheid ingesteld of erkend orgaan een uitkering of onderstand is
      verleend over een tijdvak waarover later met terugwerkende kracht buitengewoon pensioen wordt verleend, worden
      deze als voorschotten aangemerkt, en wordt de som hiervan zonder enige beperking op het bedrag van het pensioen
      ingehouden ten gunste van het fonds, de overheid of de organen, als bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002553
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel6
