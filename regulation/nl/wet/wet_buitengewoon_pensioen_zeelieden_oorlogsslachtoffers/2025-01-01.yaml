  - number: '18'
    text: |-
      1 De buitengewone pensioenen, toegekend aan de personen, bedoeld in artikel 17, , , , , ,  en , zullen tezamen niet
      meer mogen bedragen dan negentig procent van de pensioengrondslag, waarnaar die pensioenen zijn berekend, met dien
      verstande, dat:

        - de personen, bedoeld in artikel 17, , alleen aanspraak hebben op buitengewoon pensioen, indien de personen,
      bedoeld in artikel 17, , , , ,  en , hun volle buitengewoon pensioen ontvangen hebben;
        - de personen, bedoeld in artikel 17, , alleen aanspraak hebben op buitengewoon pensioen, indien de personen,
      bedoeld in artikel 17, , , ,  en , hun volle buitengewoon pensioen ontvangen hebben;
        - de personen, bedoeld in artikel 17,  en , alleen aanspraak hebben op buitengewoon pensioen, indien de personen,
      bedoeld in artikel 17, ,  en , allen hun volle buitengewoon pensioen ontvangen hebben.

      2 Indien de buitengewone pensioenen van de personen, bedoeld in artikel 17, ,  en , tezamen meer zouden bedragen
      dan het in het eerste lid voor hen gestelde maximum, zal elk buitengewoon pensioen een evenredige vermindering
      ondergaan.

      3 Indien de personen, bedoeld in artikel 17,  en , niet het volle buitengewoon pensioen kunnen ontvangen, zal het
      buitengewoon pensioen van ieder hunner een evenredige vermindering ondergaan.

      4 Het in het vorige lid bepaalde is ook van toepassing op de kleinkinderen als bedoeld in artikel 17, , indien van
      dezen meer dan een in leven zijn en elk kleinkind niet zijn volle buitengewoon pensioen kan ontvangen.

      5 Ingeval het bepaalde bij het tweede lid is toegepast en in het aantal op buitengewoon pensioen recht hebbende
      kinderen wijziging komt, zal de toegepaste evenredige vermindering worden herzien, en wel met ingang van de maand
      volgende op die, waarin de wijziging is ingetreden.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel18
  - number: 18a
    text: |-
      1 Het buitengewoon pensioen van de weduwe, wier echtgenoot over een periode van ten minste drie maanden,
      voorafgaande aan zijn overlijden in het genot was gesteld van een blijvend buitengewoon pensioen uit hoofde van
      een arbeidsongeschiktheid van ten minste negentig procent wordt gedurende het eerste jaar na het overlijden van de
      echtgenoot verhoogd met twintig procent van de pensioengrondslag en gedurende het tweede jaar na het overlijden met
      tien procent van die grondslag, voor zover het verhoogde buitengewoon weduwenpensioen daardoor gedurende het eerste
      jaar niet meer dan vijfentachtig procent van de minimum-pensioengrondslag bedraagt en gedurende het tweede jaar
      niet meer dan vijfenzeventig procent van die grondslag.

      2 De verhoging, bedoeld in het eerste lid, wordt voor de toepassing van [artikel 18][ref1] buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel18
