  - number: 28a
    text: |-
      1 Het buitengewoon pensioen of de garantietoeslag wordt door de Sociale verzekeringsbank
      aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag, genoemd in
      [artikel 8, eerste lid, onder b, van de Wet minimumloon en minimumvakantiebijslag][ref1] ingevolge
      [artikel 14 van die wet][ref2] wordt herzien.

      2 De pensioenbedragen, bedoeld in [artikel 28b, eerste lid, onder a][ref3], worden door Onze Minister, naar gelang
      de grondslagen waarvan zij zijn afgeleid, aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag,
      genoemd in [artikel 8, eerste lid, onder b, van de Wet minimumloon en minimumvakantiebijslag][ref4] ingevolge
      [artikel 14 van die wet][ref5] wordt herzien.

      3 Bij de aanpassing, bedoeld in het eerste lid, wordt uitgegaan van het laatst vastgestelde dan wel overeenkomstig
      het eerste lid aangepaste buitengewoon pensioen of de laatst vastgestelde dan wel overeenkomstig het eerste lid
      aangepaste garantietoeslag.

      4 De aanpassing, bedoeld in het eerste lid, vindt plaats zonder dat dit bij beschikking is vastgesteld.

      5 Het aangepaste buitengewoon pensioen of de aangepaste garantietoeslag, bedoeld in het vierde lid, wordt betaald
      bij de eerstvolgende betaling nadat de aanpassing heeft plaatsgevonden.


