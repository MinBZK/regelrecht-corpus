  - number: 22b
    text: |-
      1 Indien de aanvrager kennis wenst te nemen van gegevens, welke mede tot de beschikking van de Raad of de Sociale
      verzekeringsbank hebben geleid, worden deze hem op zijn verzoek binnen vier weken alsnog door de Raad of de Sociale
      verzekeringsbank verstrekt, indien en voor zover door het verstrekken van deze gegevens geen inbreuk wordt gemaakt
      op de persoonlijke levenssfeer van derden.

      2 De Raad of de Sociale verzekeringsbank kan in het belang van de geestelijke of lichamelijke gezondheid
      van de betrokken persoon, al dan niet op verzoek van de geneeskundig adviseur, bepalen dat het kennisnemen
      van geneeskundige rapporten niet wordt toegestaan aan de belanghebbende persoonlijk maar uitsluitend aan een
      gemachtigde die hetzij arts, hetzij advocaat is, dan wel van de Raad of de Sociale verzekeringsbank bijzondere
      toestemming heeft verkregen.

      3 Indien de gegevens, bedoeld in het tweede lid, aan de gemachtigde ter kennis zijn gebracht, wordt hiervan door
      de Raad of de Sociale verzekeringsbank binnen een termijn van ten hoogste drie maal vierentwintig uur aan de
      belanghebbende mededeling gedaan, onder vermelding van de datum waarop de gegevens zijn verstrekt.

      4 Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel22b
  - number: '23'
    text: |-
      1 Behoudens afwijkende bepalingen gaat het buitengewoon pensioen in op 1 januari 1946 of, indien het recht
      op buitengewoon pensioen later is ontstaan, op de dag van ontstaan van dat recht. Indien degene, aan wie het
      buitengewoon pensioen wordt ontleend, nà 1 januari 1946 overleden is, gaat het buitengewoon pensioen in op
      de eerste dag, volgende op die van het overlijden. Het tijdelijk buitengewoon pensioen, verleend op grond van
      [artikel 16, derde lid][ref1], gaat in op de dag, volgende op die der vermissing.

      2 Wanneer de aanvrage tot het verkrijgen van het buitengewoon pensioen niet binnen twee jaren na de dag, waarop het
      recht op buitengewoon pensioen kon worden geldend gemaakt, is ontvangen, gaat het buitengewoon pensioen in op de
      eerste dag der maand, volgende op die, waarin de aanvrage is ingekomen, doch niet voor het einde van de termijn,
      waarvoor eventueel reeds een voorlopig buitengewoon pensioen was verleend.

      3 Een voorlopig buitengewoon pensioen, dat bij vernieuwing wordt toegekend, alsmede een blijvend buitengewoon
      pensioen, dat verleend wordt ter vervanging van een voorlopig buitengewoon pensioen, gaat in op de dag,
      volgende op die, waarop het vorige buitengewoon pensioen heeft opgehouden, behalve in de gevallen genoemd in
      [artikel 6, derde lid][ref2], in welke gevallen het buitengewoon pensioen ingaat op de dag, waarop de aanvrage
      daartoe is ingekomen.

      4 Ingeval de aanvrage, bedoeld in [artikel 21, tweede lid][ref3], niet is ontvangen binnen de daar gestelde termijn
      van twee jaren, zal de vervanging of verlenging van het voorlopig buitengewoon pensioen ingaan op de dag, waarop de
      aanvrage is binnengekomen, tenzij de Sociale verzekeringsbank termen aanwezig acht anders te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002035#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel21
