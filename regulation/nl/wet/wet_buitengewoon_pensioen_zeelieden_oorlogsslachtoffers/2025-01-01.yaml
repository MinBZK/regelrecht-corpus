  - number: 21a
    text: |-
      De ontvangst van de aanvrage wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven over
      de verdere procedure en de geldende behandeltermijnen.
    url: https://wetten.overheid.nl/BWBR0002035/2025-01-01#Artikel21a
  - number: '22'
    text: |-
      1 Bij de bekendmaking van de beschikking wordt voorlichting gegeven over de procedure en de voor het bezwaarschrift
      geldende termijn van behandeling.

      2 De beschikking op een aanvrage krachtens [artikel 3, eerste lid][ref1], onderscheidenlijk de [artikelen 14][ref2]
      en [15][ref3] voor zover de overleden zeeman geen aanspraken op deze wet heeft doen gelden, wordt gegeven binnen
      negen maanden na de datum waarop de aanvrage is ingekomen. Indien de Raad ten gevolge van bijzondere omstandigheden
      niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste acht weken worden verlengd. Van de
      verlenging doet de Raad schriftelijk mededeling aan de belanghebbende.

      3 De beschikking op een aanvrage krachtens [artikel 3, zesde lid][ref4], de [artikelen 14][ref5] en
      [15][ref6] voor zover de overleden zeeman aanspraken op deze wet heeft doen gelden, onderscheidenlijk
      [artikel 21, tweede en derde lid][ref7], wordt gegeven binnen dertien weken na de datum waarop de aanvrage is
      ingekomen. Indien de Raad of de Sociale verzekeringsbank ten gevolge van bijzondere omstandigheden niet binnen deze
      termijn kan beslissen, kan hij eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad
      of de Sociale verzekeringsbank schriftelijk mededeling aan de belanghebbende.

      4 Met betrekking tot een aanvrage, bedoeld in het derde lid, die wordt ingediend terwijl een aanvrage, bedoeld
      in het tweede lid, nog in behandeling is geldt, in afwijking van het derde lid, de termijn die resteert voor de
      beschikking op de aanvrage, bedoeld in het tweede lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel3
