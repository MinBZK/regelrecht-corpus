  - number: '13'
    text: |-
      1 Een buitengewoon pensioen wordt eerst verleend of gewijzigd, nadat over het ontstaan, de aard en de gevolgen
      van de verwonding, verminking, ziekten of gebreken, welke recht geven op buitengewoon pensioen, een geneeskundig
      onderzoek heeft plaatsgehad en het percentage van arbeidsongeschiktheid is vastgesteld.

      2 Het geneeskundig onderzoek zal, op last van de Raad of de Sociale verzekeringsbank éénmaal worden herhaald,
      indien de belanghebbende daartoe de wens te kennen geeft in zijn bezwaarschrift als bedoeld in [artikel 33][ref1],
      en voorts in elk geval waarin een herhaling door de Raad of de Sociale verzekeringsbank wenselijk wordt geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel33
