  - number: '20'
    text: |-
      1 Op het buitengewoon pensioen, toegekend aan de personen, bedoeld in [artikel 17][ref1], is het bepaalde in
      [artikel 11, eerste lid, tweede lid, tweede volzin, onder a][ref2], alsmede het derde, zesde en zevende lid van
      overeenkomstige toepassing, behoudens het bepaalde in het tweede lid.

      2 Voor zover door de weduwe of de gewezen echtgenote inkomsten uit vermogen worden genoten, dan wel krachtens
      de Schepelingenongevallenregeling 1940 of de Zeeongevallenwet 1919, al dan niet in verbinding met de
      [Liquidatiewet ongevallenwetten][ref3], worden deze voor vijftig procent van die inkomsten op het buitengewoon
      pensioen in mindering gebracht, met dien verstande, dat, indien die inkomsten minder dan € 680,67 per jaar
      bedragen, slechts een zodanig bedrag in mindering wordt gebracht als waarmede die inkomsten een som van € 340,34
      mochten te boven gaan.

      3 Voor zover door de weduwe of de gewezen echtgenote andere inkomsten dan waarop in het eerste en tweede lid
      wordt gedoeld worden genoten, wordt vijftig procent van het bedrag, waarmede die inkomsten de som van € 453,78
      overschrijden, op het buitengewoon pensioen in mindering gebracht. Onverminderd het bepaalde in de vorige
      volzin worden, indien de daar bedoelde overschrijding uitsluitend of mede het gevolg is van het genot van een
      ouderdomspensioen krachtens de [Algemene Ouderdomswet][ref4] van meer dan € 453,78 van het bedrag, waarmede dat
      ouderdomspensioen de som van € 453,78 overschrijdt, in plaats van vijftig procent de volgende percentages op het
      buitengewoon pensioen in mindering gebracht:

      a. op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 17, a en b][ref5], heeft
      ondergaan: zestig procent;

      b. op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 17, a en b][ref6], heeft
      ondergaan: een evenredig deel van het onder *a* genoemde percentage;

      c. op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 17, i en j][ref7], een deel van
      zestig procent, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikel-onderdelen genoemde berekeningsformule door de letter *p* onderscheidenlijk *x* wordt voorgesteld, zich
      verhoudt tot veertig jaar.

      Voor een buitengewoon pensioen, toegekend aan de in [artikel 17, b][ref8], bedoelde weduwe alsook voor een
      buitengewoon pensioen, toegekend aan de gewezen echtgenote, bedoeld in [artikel 17, j][ref9], wordt het op deze
      pensioenen ingevolge de vorige volzin in mindering te brengen bedrag beperkt tot een percentage daarvan, gelijk
      aan dat der arbeidsongeschiktheid, waarnaar het buitengewoon pensioen van de overleden echtgenoot onderscheidenlijk
      gewezen echtgenoot laatstelijk was of zou zijn berekend.

      4 Indien door de weduwe of de gewezen echtgenote zowel inkomsten, bedoeld in het tweede lid als inkomsten
      bedoeld in het derde lid worden genoten, worden, in afwijking van het bepaalde aan het slot van het tweede lid,
      de inkomsten bedoeld in het tweede lid voor vijftig procent van die inkomsten op het buitengewoon pensioen in
      mindering gebracht, met dien verstande, dat in elk geval een bedrag van € 340,34 van het totaal der inkomsten niet
      in mindering wordt gebracht.

      5 Indien een uitkering ingevolge de [Algemene nabestaandenwet][ref10] wordt genoten, wordt die uitkering niet
      gerekend tot de met het buitengewoon pensioen verrekenbare inkomsten, als in de voorgaande leden bedoeld. In
      dat geval worden echter, nadat de voorgaande leden zijn toegepast, van het bedrag van de uitkering ingevolge de
      [Algemene nabestaandenwet][ref11] de volgende percentages op het buitengewoon pensioen in mindering gebracht:

      a. op een buitengewoon weduwenpensioen, dat geen vermindering als bedoeld in [artikel 17, a en b][ref12], heeft
      ondergaan, en op het buitengewoon wezenpensioen: zestig procent;

      b. op een buitengewoon weduwenpensioen, dat een vermindering als bedoeld in [artikel 17, a en b][ref13], heeft
      ondergaan, een evenredig deel van het onder *a* genoemde percentage;

      c. op het buitengewoon pensioen van de gewezen echtgenote, bedoeld in [artikel 17, i en j][ref14], een deel van
      zestig procent, hetwelk tot dat percentage in dezelfde verhouding staat als het aantal jaren, hetwelk in de in die
      artikel-onderdelen genoemde berekeningsformule door de letter *p* onderscheidenlijk *x* wordt voorgesteld, zich
      verhoudt tot veertig jaar.

      Het bepaalde in de derde volzin van het derde lid van dit artikel is van overeenkomstige toepassing.

      Indien de weduwe tevens in het genot is van een invaliditeitsrente krachtens de Invaliditeitswet, waarop zij tot
      het in werking treden van dit artikellid ingevolge de Wet tot aanvulling van renten krachtens de Invaliditeitswet
      en de Wet van 3 februari 1954 (*Stb.* 60) toe- en bijslagen genoot, komt het totaalbedrag dezer toe- en bijslagen
      in aanmerking voor aftrek op de in de vorige volzin bedoelde vermindering.

      Ten aanzien van degene, die aantoont, dat uit hoofde van zijn aanspraak op uitkering ingevolge de
      [Algemene nabestaandenwet][ref15] mede een vermindering plaatsvindt van enig ander pensioen of enige andere
      verplichte periodieke uitkering, en dat het gezamenlijk bedrag der verminderingen zestig procent van het bedrag van
      bedoeld bodempensioen overschrijdt, wordt de vermindering in de vorige volzinnen van dit artikellid bedoeld zodanig
      beperkt, dat het inkomen van de belanghebbende zo mogelijk veertig procent van het bedrag van bedoeld bodempensioen
      meer bedraagt dan in geval geen uitkering ingevolge de [Algemene nabestaandenwet][ref16] wordt genoten.

      6 Het ingevolge de voorafgaande leden met het buitengewoon pensioen van de weduwe en/of de gewezen echtgenote
      wegens het genot van neveninkomsten verrekenbare bedrag wordt beperkt tot het bedrag, waarmede het buitengewoon
      pensioen van de vrouw - ongeacht de vermindering, bedoeld in de [artikelen 18][ref17] en [19][ref18] -,
      vermeerderd met die neven-inkomsten, vijfenzestig procent van de in [artikel 11, tweede lid][ref19], bedoelde
      grondslag overschrijdt, met dien verstande evenwel, dat de verrekening van een pensioen of uitkering als
      bedoeld in [artikel 11, derde lid][ref20], zomede de verrekening ter zake van een uitkering ingevolge de
      [Algemene nabestaandenwet][ref21] en ter zake van een pensioen ingevolge de [Algemene Ouderdomswet][ref22]
      onverkort blijft. Tot de neven-inkomsten, bedoeld in de vorige volzin, worden niet gerekend de kinderbijslagen of
      -toeslagen zomede de inkomsten, welke onverplicht door derden worden verschaft.


