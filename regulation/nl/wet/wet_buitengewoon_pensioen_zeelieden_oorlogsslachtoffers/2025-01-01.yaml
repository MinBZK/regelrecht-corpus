  - number: '24'
    text: |-
      1 Elk buitengewoon pensioen eindigt met het einde van de maand, waarin de rechthebbende is overleden. In geval van
      vermissing van de rechthebbende eindigt diens pensioen met een door de Sociale verzekeringsbank te bepalen dag.

      2 Het buitengewoon pensioen van de in [artikel 15][ref1] bedoelde kinderen eindigt tevens met het einde van de
      maand, waarin de rechthebbende:

      a. de leeftijd van 21 jaren heeft bereikt of in het huwelijk is getreden;

      b. is geadopteerd.

      3 Een vervallen verklaard of ingetrokken buitengewoon pensioen eindigt met het einde van de maand, waarin de
      beschikking inzake het vervallen verklaren of de intrekking is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel15
