        bwb_id: BWBR0002035
        artikel: '3'
        hoofdstuk: Tweede
        paragraaf: '1'
  - number: '10'
    text: |-
      Het buitengewoon pensioen wordt éénmaal met veertig procent van de pensioensgrondslag vermeerderd, wanneer ten
      gevolge van de verwonding, verminking, ziekten of gebreken, in [artikel 3][ref1] bedoeld:

      a. twee of meer ledematen (handen of voeten) zijn verloren gegaan of voorgoed geheel onbruikbaar zijn geworden, dan
      wel een toestand is ontstaan, welke met een zodanig verlies of een zodanige onbruikbaarheid is gelijk te stellen;

      b. het gezichtsvermogen voorgoed geheel verloren is gegaan of een toestand is ontstaan, welke met blindheid is
      gelijk te stellen;

      c. onherstelbare krankzinnigheid is ontstaan, of een toestand, welke daarmede is gelijk te stellen; of

      d. een blijvend buitengewoon pensioen is verleend uit hoofde van een arbeidsongeschiktheid van 100 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0002035#Artikel3
