    text: |-
      Het bedrag, genoemd in [artikel 11, tweede lid, onder c][ref1], wordt door Onze Minister telkens herzien met ingang
      van 1 januari, indien en voor zover de ontwikkeling van de consumentenprijsindex in de periode 1 november tot 31
      oktober daaraan voorafgaand, daartoe aanleiding geeft.


