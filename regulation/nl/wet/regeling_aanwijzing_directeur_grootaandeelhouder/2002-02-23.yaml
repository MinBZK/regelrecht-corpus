$id: regeling_aanwijzing_directeur_grootaandeelhouder
regulatory_layer: WET
publication_date: '2015-07-10'
valid_from: '2002-02-23'
bwb_id: BWBR0009232
url: https://wetten.overheid.nl/BWBR0009232/2002-02-23
preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Financiën;

    Gelet op artikel 6, vierde lid, van de Ziektewet, artikel 6, vierde lid, van de Wet op de
    arbeidsongeschiktheidsverzekering en artikel 6, vierde lid, van de Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            Uitvoeringsinstituut werknemersverzekeringen:

              het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];



            b
            vennootschap:

              een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid als bedoeld in de
      [Titels 4][ref2] en [5 van Boek 2 van het Burgerlijk Wetboek][ref3];



            c
            bestuurder:

              de statutair bestuurder van een vennootschap;



            d
            echtgenoot:

              de persoon die met de bestuurder gehuwd is of die daarmee een gezamenlijke huishouding voert, tenzij het
      betreft een bloedverwant in de eerste graad.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
  - number: '2.1'
    text: |-
      Onder directeur-grootaandeelhouder, bedoeld in [artikel 6, eerste lid, onderdeel d, van de Ziektewet][ref1],
      [artikel 6, eerste lid, onderdeel d, van de Wet op de arbeidsongeschiktheids-verzekering][ref2] en
      [artikel 6, eerste lid, onderdeel d, van de Werkloosheidswet][ref3], wordt verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '6'
  - number: 2.1.a
    text: |-
      de bestuurder die, al dan niet tezamen met zijn echtgenoot, houder is van aandelen die ten minste de helft van de
      stemmen in de algemene vergadering van de vennootschap vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
  - number: 2.1.b
    text: |-
      de bestuurder die, al dan niet tezamen met zijn echtgenoot, houder is van een zodanig aantal aandelen dat, indien
      in de statuten is bepaald dat het besluit tot schorsing of tot ontslag van deze bestuurder slechts mag worden
      genomen met een versterkte meerderheid in de algemene vergadering van de vennootschap, de overige aandeelhouders
      niet over deze versterkte meerderheid beschikken;
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
  - number: 2.1.c
    text: |-
      bestuurders die in de algemene vergadering van de vennootschap allen een gelijk of nagenoeg gelijk aantal stemmen
      kunnen uitbrengen; of
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
  - number: 2.1.d
    text: |-
      de bestuurder van een vennootschap waarvan ten minste tweederde deel van de aandelen worden gehouden door zijn
      bloed- of aanverwanten tot en met de derde graad.
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de bestuurder die zeggenschap heeft in de algemene vergadering
      van de vennootschap door tussenkomst van een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel2
  - number: '3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd, in afwijking van [artikel 2][ref1], een bestuurder
      niet als directeur-grootaandeelhouder aan te merken, indien deze door feiten en omstandigheden aantoont
      daadwerkelijk ondergeschikt te zijn aan de algemene vergadering van de vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0009232#Artikel2
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009232
        artikel: '2'
  - number: '4'
    text: |-
      Deze regeling is van overeenkomstige toepassing op de bestuurder van een vennootschap met een in aandelen verdeeld
      kapitaal die niet naar Nederlands recht is opgericht.
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel4
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van het tijdstip
      waarop de [artikelen XXXII][ref1], [XXXIV, onderdeel A][ref2] en
      [XXXV, onderdeel A, van de Invoeringswet nieuwe en gewijzigde arbeidsongeschiktheidsregelingen][ref3] in werking
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXII
      [ref2]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXIV
      [ref3]: https://wetten.overheid.nl/BWBR0008658#ArtikelXXXV
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008658
        artikel: XXXII
      - id: ref2
        bwb_id: BWBR0008658
        artikel: XXXIV
      - id: ref3
        bwb_id: BWBR0008658
        artikel: XXXV
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing directeur-grootaandeelhouder.'
    url: https://wetten.overheid.nl/BWBR0009232/2002-02-23#Artikel6
