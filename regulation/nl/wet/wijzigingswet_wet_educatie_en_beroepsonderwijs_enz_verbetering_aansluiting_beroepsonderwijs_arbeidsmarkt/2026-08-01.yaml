regulatory_layer: WET
publication_date: '2026-07-07'
valid_from: '2026-08-01'
bwb_id: BWBR0052867
url: https://wetten.overheid.nl/BWBR0052867/2026-08-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is de onderwijsurennorm te vereenvoudigen, meer ruimte
    voor beroepsopleidingen met een verkort onderwijsprogramma te creëren, de landelijk vastgestelde koppeling van
    keuzedelen aan kwalificaties los te laten, de artikelen voor niet uit ’s Rijks kas bekostigd beroepsonderwijs te
    herzien en enige andere wijzigingen door te voeren, teneinde de aansluiting van het bekostigd en niet uit ’s Rijks
    kas bekostigd beroepsonderwijs op de arbeidsmarkt te verbeteren;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0052867/2026-08-01#ArtikelAanhef
articles:
  - number: XVI
    text: >-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0052867/2026-08-01#ArtikelXVI
  - number: XVII
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0052867/2026-08-01#ArtikelXVII
