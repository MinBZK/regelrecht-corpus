  - number: '25'
    text: |-
      Ingeval een richtlijn of een andere regeling van internationaal of interregionaal recht voorziet in het automatisch
      verstrekken van inlichtingen kan Onze Minister aan de bevoegde autoriteit van een staat meedelen dat hij geen
      automatische inlichtingen inzake bepaalde inkomsten- en vermogenscategorieën of inzake inkomsten en vermogens onder
      een minimumbedrag wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel25
  - number: '26'
    text: |-
      De ontvangst van spontaan verkregen inlichtingen wordt door Onze Minister onmiddellijk, doch in elk geval binnen
      zeven werkdagen na ontvangst aan de bevoegde autoriteit van de verstrekkende lidstaat bevestigd.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel26
  - number: '27'
    text: |-
      1 Onze Minister kan de bevoegde autoriteit van een aangezochte staat verzoeken ter uitwisseling van inlichtingen
      in het kader van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], dat ambtenaren van de rijksbelastingdienst,
      dan wel andere ambtenaren die belast zijn met de heffing van belastingen, overeenkomstig de door de bevoegde
      autoriteit van de aangezochte staat vastgestelde procedurele regelingen:

      a. aanwezig zijn in de kantoren waar de ambtenaren van de aangezochte staat hun taken vervullen;

      b. aanwezig zijn bij een administratief onderzoek dat wordt uitgevoerd op het grondgebied van de aangezochte staat;

      c. deelnemen aan onderzoeken die in de aangezochte staat worden uitgevoerd, waar passend met gebruik van
      elektronische communicatiemiddelen.

      2 Voor zover het in de aangezochte staat wettelijk is toegestaan, kunnen in het kader van de overeenkomst, bedoeld
      in het eerste lid, de bij een administratief onderzoek aanwezige ambtenaren van de rijksbelastingdienst, dan wel
      andere ambtenaren die belast zijn met de heffing van belastingen, personen ondervragen en bescheiden onderzoeken.

      3 Ambtenaren van de rijksbelastingdienst, dan wel andere ambtenaren die belast zijn met de heffing van belastingen,
      die overeenkomstig het eerste lid in de aangezochte staat deelnemen aan een onderzoek, al dan niet met gebruik
      van elektronische communicatiemiddelen, kunnen overeenkomstig de door de aangezochte staat gestelde procedurele
      regelingen personen ondervragen en bescheiden onderzoeken.


