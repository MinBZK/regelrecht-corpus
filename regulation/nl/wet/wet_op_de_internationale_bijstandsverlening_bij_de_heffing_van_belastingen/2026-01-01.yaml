  - number: 8a
    text: |-
      1 Onze Minister kan met de bevoegde autoriteit van één of meer andere staten overeenkomen om gelijktijdig, elk op
      het eigen grondgebied, bij één of meer personen ten aanzien van wie zij een gezamenlijk of complementair belang
      hebben, controles te verrichten en de aldus verkregen inlichtingen uit te wisselen.

      2 Onze Minister bepaalt welke personen hij voor een gelijktijdige controle wil voorstellen. Hij deelt de bevoegde
      autoriteit van de andere betrokken staten met opgave van redenen mee welke dossiers hij voor een gelijktijdige
      controle voorstelt. Hij bepaalt binnen welke termijn de controles moeten plaatsvinden.

      3 Onze Minister beslist of hij aan een door een andere bevoegde autoriteit voorgestelde gelijktijdige controle
      wenst deel te nemen. Hij stuurt die bevoegde autoriteit binnen een termijn van zestig dagen na ontvangst van het
      voorstel een bevestiging van deelname of een gemotiveerde weigering.

      4 Onze Minister wijst een vertegenwoordiger aan die voor Nederland wordt belast met de leiding en de coördinatie
      van de controle.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel8a
  - number: '9'
    text: |-
      1 Onze Minister kan door de bevoegde autoriteit van een verzoekende staat worden verzocht, ter uitwisseling
      van inlichtingen in het kader van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], dat door de bevoegde
      autoriteit van die verzoekende staat gemachtigde ambtenaren overeenkomstig de door Nederland vastgestelde
      procedurele regelingen:

      a. aanwezig zijn in de kantoren van de ambtenaren van de rijksbelastingdienst, dan wel van andere ambtenaren die
      belast zijn met de heffing van belastingen;

      b. aanwezig zijn bij onderzoeken die in Nederland worden uitgevoerd;

      c. deelnemen aan onderzoeken die in Nederland worden uitgevoerd, waar passend met gebruik van elektronische
      communicatiemiddelen.

      Indien de verlangde inlichtingen vermeld staan in bescheiden waartoe de ambtenaren, bedoeld in onderdeel a,
      toegang hebben, ontvangen de ambtenaren van de bevoegde autoriteit van de verzoekende staat een afschrift van die
      bescheiden.

      2 Onze Minister reageert op een verzoek als bedoeld in het eerste lid binnen een termijn van zestig dagen na
      ontvangst van dat verzoek. Hij deelt de bevoegde autoriteit van de verzoekende staat de inwilliging van het verzoek
      of de gemotiveerde weigering ervan mee.

      3 Indien door de bevoegde autoriteit van de verzoekende staat gemachtigde ambtenaren deelnemen aan een onderzoek,
      al dan niet met gebruik van elektronische communicatiemiddelen, kunnen zij met inachtneming van de door Nederland
      vastgestelde procedurele regelingen personen ondervragen en bescheiden onderzoeken.

      4 Ambtenaren uit de verzoekende staat die in Nederland aanwezig zijn, dienen te allen tijde een schriftelijke
      opdracht te kunnen overleggen waaruit hun identiteit en hun officiële hoedanigheid blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
