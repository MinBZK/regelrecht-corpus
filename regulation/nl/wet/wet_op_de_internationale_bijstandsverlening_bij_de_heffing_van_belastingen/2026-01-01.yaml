  - number: 10q
    text: |-
      1 Indien een gegevensinbreuk in Nederland plaatsvindt, meldt Onze Minister die inbreuk en alle daaropvolgende
      corrigerende maatregelen onverwijld aan de Europese Commissie.

      2 Indien de gegevensinbreuk niet onmiddellijk en op passende wijze onder controle kan worden gebracht, verzoekt
      Onze Minister de Europese Commissie schriftelijk om een schorsing van de toegang tot het CCN-netwerk voor de
      toepassing van deze wet.

      3 Onze Minister kan de uitwisseling van inlichtingen met een lidstaat waar een gegevensinbreuk heeft plaatsgevonden
      schorsen door de Europese Commissie en de betrokken lidstaat daarvan schriftelijk in kennis te stellen. Een
      dergelijke schorsing wordt onmiddellijk van kracht.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel10q
  - number: '11'
    text: |-
      1 Indien het aan opzet of grove schuld van de belastingplichtige, de administratieplichtige, de rapporterende
      financiële instelling of degene die de toegang, bedoeld in [artikel 10g][ref1], moet verlenen, is te wijten dat de
      verplichtingen, bedoeld in [artikel 8][ref2] en [afdeling 4a][ref3] en de op dat artikel en die afdeling berustende
      bepalingen en artikel 10g, niet, niet tijdig, niet volledig of niet juist zijn of worden nagekomen, vormt dit een
      vergrijp ter zake waarvan Onze Minister hem, onderscheidenlijk haar, een bestuurlijke boete van ten hoogste het
      bedrag van de vierde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref4], kan
      opleggen.

      2 Indien het aan opzet of grove schuld van de intermediair of de relevante belastingplichtige is te wijten dat
      de verplichtingen, bedoeld in [hoofdstuk II][ref5], [afdeling 4ab][ref6], en de daarop berustende bepalingen,
      niet, niet tijdig, niet volledig of niet juist zijn of worden nagekomen, vormt dit een vergrijp ter zake
      waarvan Onze Minister hem een bestuurlijke boete van ten hoogste het bedrag van de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7], kan opleggen.

      3 Indien het aan opzet of grove schuld van de rapporterende platformexploitant, bedoeld in de
      [artikelen 10j, eerste lid][ref8], [10k, eerste lid][ref9], en [10l, eerste en tweede lid][ref10], is te wijten
      dat de verplichtingen, bedoeld in [hoofdstuk II, afdeling 4ac][ref11], en de daarop berustende bepalingen,
      niet, niet tijdig, niet volledig of niet juist zijn of worden nagekomen, vormt dit een vergrijp ter zake
      waarvan Onze Minister hem een bestuurlijke boete van ten hoogste het bedrag van de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref12], kan opleggen.

      4 [Hoofdstuk VIIIA, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref13] is van overeenkomstige
      toepassing met betrekking tot een bestuurlijke boete die op grond van het eerste, tweede of derde lid wordt
      opgelegd.

      5 In afwijking in zoverre van [artikel 5:45 van de Algemene wet bestuursrecht][ref14] vervalt de bevoegdheid tot
      het opleggen van de bestuurlijke boete, bedoeld in het eerste, tweede en derde lid, vijf jaren na het einde van het
      kalenderjaar waarin de verplichting is ontstaan.

      6 [Hoofdstuk IX van de Algemene wet inzake rijksbelastingen][ref15], met uitzondering van het in
      [artikel 69 van die wet][ref16] genoemde vereiste dat het feit ertoe strekt dat te weinig belasting wordt geheven,
      is van overeenkomstige toepassing ten aanzien van degene die niet voldoet aan de verplichtingen, bedoeld in de
      [artikelen 8][ref17], [10][ref18] en [10g][ref19] en [hoofdstuk II][ref20], [afdelingen 4a][ref21], [4ab][ref22] en
      [4ac][ref23], en de op die artikelen en die afdelingen berustende bepalingen.


