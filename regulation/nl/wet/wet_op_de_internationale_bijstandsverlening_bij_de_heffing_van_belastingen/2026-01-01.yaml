  - number: 10m
    text: |-
      1 Indien de rapporterende platformexploitant, bedoeld in [artikel 10l, tweede lid,][ref1] na twee aanmaningen van
      Onze Minister niet voldoet aan de rapportageverplichting, bedoeld in artikel 10l, derde tot en met vijfde lid,
      trekt Onze Minister de registratie, bedoeld in artikel 10l, tweede lid, in.

      2 De intrekking vindt niet eerder plaats dan na het verstrijken van dertig dagen na de tweede aanmaning en niet
      later dan na het verstrijken van negentig dagen na die aanmaning.

      3 Een rapporterende platformexploitant als bedoeld in bijlage V, deel I, onderdeel A, onder 4, subonderdeel b, van
      [Richtlijn 2011/16](32011L0016)/EU ten aanzien van wie de registratie is ingetrokken op grond van een met artikel
      8 bis quater, vierde lid, van [Richtlijn 2011/16](32011L0016)/EU overeenkomende wettelijke bepaling, kan zich enkel
      in Nederland registreren indien hij aan Onze Minister passende waarborgen verstrekt inzake zijn vaste voornemen om
      te voldoen aan de rapportageverplichtingen, bedoeld in [artikel 10l, derde tot en met vijfde lid][ref2].


