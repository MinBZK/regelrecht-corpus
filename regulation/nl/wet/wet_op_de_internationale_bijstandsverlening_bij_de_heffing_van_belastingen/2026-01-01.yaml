  - number: '20'
    text: |-
      1 Onze Minister ziet af van iedere eis tot terugbetaling van kosten die uit de uitvoering van Richtlijn 2011/16/EU
      voortvloeien, behalve in voorkomend geval van de kosten van aan deskundigen betaalde vergoedingen.

      2 Onze Minister en de verzoekende autoriteit van een staat kunnen afspraken maken over de vergoeding van kosten die
      samenhangen met het verlenen van wederzijdse bijstand bij de heffing van belastingen die vallen onder de reikwijdte
      van de wederzijdse bijstand, bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel20
