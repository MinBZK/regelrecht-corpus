  - number: '30'
    text: |-
      1 Tenzij een bevoegde autoriteit van een andere staat anders bepaalt, kunnen de door haar aan Onze Minister
      verstrekte inlichtingen uitsluitend worden gebruikt voor de heffing van belastingen die vallen onder de reikwijdte
      van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], alsmede voor de vaststelling, tenuitvoerlegging en
      handhaving van de Nederlandse wetgeving met betrekking tot de omzetbelasting en andere indirecte belastingen.

      2 Onze Minister kan aan een bevoegde autoriteit van een staat toestemming vragen de inlichtingen voor een ander
      doel te gebruiken dan voor de heffing van belastingen die vallen onder de reikwijdte van de wederzijdse bijstand,
      bedoeld in [artikel 1][ref2].

      3 Inlichtingen die aan Onze Minister zijn verstrekt ter uitvoering van Richtlijn 2011/16/EU mogen behalve voor de
      in [artikel 1][ref3] bedoelde doeleinden ook worden gebruikt:

      a. voor de vaststelling en invordering van andere belastingen en rechten die vallen onder artikel 2 van
      Richtlijn 2010/24/EU van de Raad van 16 maart 2010 betreffende de wederzijdse bijstand inzake de invordering van
      schuldvorderingen die voortvloeien uit bepaalde belastingen, rechten en andere maatregelen (PbEU 2010, L 84);

      b. voor de vaststelling en invordering van verplichte socialezekerheidsbijdragen;

      c. in mogelijk tot bestraffing leidende gerechtelijke en administratieve procedures wegens overtreding van de
      belastingwetgeving, onverminderd de algemene regels en de bepalingen betreffende de rechten van de verdachten en
      getuigen in dergelijke procedures.

      4 De bevoegde autoriteit van een andere lidstaat kan Onze Minister een lijst mededelen van andere dan de in het
      eerste en derde lid bedoelde doeleinden waarvoor de verstrekte inlichtingen kunnen worden gebruikt overeenkomstig
      de Nederlandse wetgeving. Onze Minister kan die inlichtingen zonder de toestemming, bedoeld in het tweede lid,
      gebruiken voor alle doeleinden die in de lijst zijn medegedeeld.

      5 Indien Onze Minister van oordeel is dat de van de bevoegde autoriteit van een andere lidstaat ter uitvoering
      van Richtlijn 2011/16/EU verkregen inlichtingen voor de bevoegde autoriteit van een derde lidstaat van nut kunnen
      zijn voor de in het eerste of derde lid bedoelde doeleinden, mag hij de inlichtingen, met inachtneming van het
      vijfde lid, aan deze derde lidstaat doorgeven, op voorwaarde dat dit in overeenstemming is met de vastgelegde
      voorschriften en procedures zoals opgenomen in Richtlijn 2011/16/EU.

      6 Onze Minister stelt de bevoegde autoriteit van de lidstaat die de inlichtingen heeft verstrekt in kennis van
      zijn voornemen om die inlichtingen aan de bevoegde autoriteit van een derde lidstaat te verstrekken. Onze Minister
      verstrekt de inlichtingen niet aan de bevoegde autoriteit van een derde lidstaat, indien de bevoegde autoriteit
      van de lidstaat die de inlichtingen heeft verstrekt zich hiertegen verzet binnen tien werkdagen na de datum van
      ontvangst van de kennisgeving van Onze Minister.

      7 Inlichtingen, verslagen, verklaringen en andere bescheiden, alsook voor eensluidend gewaarmerkte afschriften of
      uittreksels daarvan, die zijn verkregen ter uitvoering van Richtlijn 2011/16/EU kunnen in Nederland op dezelfde
      voet als bewijs worden aangevoerd als soortgelijke inlichtingen, verslagen, verklaringen en andere bescheiden,
      alsook voor eensluidend gewaarmerkte afschriften of uittreksels daarvan, die zijn verkregen in Nederland zelf.


