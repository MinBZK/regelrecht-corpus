preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verplichtingen ten behoeve van de belastingheffing
    beter af te stemmen op verplichtingen van internationaal en interregionaal recht op het gebied van het verlenen
    van bijstand door Nederland aan andere staten bij de heffing van belastingen teneinde te bevorderen dat
    belastingschulden op het juiste bedrag kunnen worden vastgesteld en dat het ontgaan en ontwijken van belastingen
    wordt bestreden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De bepalingen van deze wet strekken tot uitvoering van richtlijnen van de Raad van de Europese Unie en andere
      regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse bijstand bij de heffing van
      belastingen, alsmede renten daarover en bestuursrechtelijke sancties en boeten die daarmee verband houden.

      2 Onder de in het eerste lid bedoelde belastingen valt elke vorm van belastingen die door of namens een staat of de
      territoriale of bestuurlijke onderdelen van een staat, met inbegrip van de lokale overheden, worden geheven.

      3 Deze wet is niet van toepassing bij het verlenen van wederzijdse bijstand op het gebied van:

      a. de omzetbelasting in het kader van Verordening (EU) nr. 904/2010 van de Raad van 7 oktober 2010 betreffende de
      administratieve samenwerking en de bestrijding van fraude op het gebied van de belasting over de toegevoegde waarde
      (PbEU 2010, L 268);

      b. de accijnzen in het kader van Verordening (EU) nr. 389/2012 van de Raad van 2 mei 2012 betreffende
      administratieve samenwerking op het gebied van de accijnzen en houdende intrekking van Verordening (EG)
      nr. 2073/2004 (PbEU 2012, L 121).

      Bij toepassing van die verordeningen zijn de [artikelen 8, derde lid][ref1], en [11][ref2] van overeenkomstige
      toepassing.

      4 Deze wet is niet van toepassing bij het verlenen van wederzijdse bijstand op het gebied van
      rechten bij invoer en rechten bij uitvoer met inbegrip van de belasting bij invoer, genoemd in
      [artikel 22 van de Wet op de omzetbelasting 1968][ref3], en van accijns bij invoer, genoemd in
      [artikel 62 van de Wet op de accijns][ref4].


