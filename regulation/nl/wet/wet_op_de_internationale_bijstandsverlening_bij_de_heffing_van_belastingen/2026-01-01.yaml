  - number: 2e
    text: |-
      Voor de toepassing van dit artikel, [artikel 6g][ref1], [artikel 8, eerste lid][ref2], [hoofdstuk II][ref3],
      [afdeling 4ac][ref4], en de daarop berustende bepalingen en [artikel 11][ref5] wordt verstaan onder:

        - *platform:* een platform als bedoeld in bijlage V, deel I, onderdeel A, onder 1, van [Richtlijn 2011/16]
      (32011L0016)/EU;
        - *platformexploitant:* een entiteit als bedoeld in bijlage V, deel I, onderdeel A, onder 2, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *uitgesloten platformexploitant:* een platformexploitant als bedoeld in bijlage V, deel I, onderdeel A, onder 3,
      van [Richtlijn 2011/16](32011L0016)/EU;
        - *rapporterende platformexploitant:* een platformexploitant als bedoeld in bijlage V, deel I, onderdeel A, onder
      4, van [Richtlijn 2011/16](32011L0016)/EU;
        - *gekwalificeerde platformexploitant buiten de Unie:* een platformexploitant als bedoeld in bijlage V, deel I,
      onderdeel A, onder 5, van [Richtlijn 2011/16](32011L0016)/EU;
        - *gekwalificeerd niet-Unierechtsgebied:* een niet-Unierechtsgebied als bedoeld in bijlage V, deel I, onderdeel A,
      onder 6, van [Richtlijn 2011/16](32011L0016)/EU;
        - *van kracht zijnde adequate overeenkomst tussen bevoegde autoriteiten:* een overeenkomst tussen de bevoegde
      autoriteiten van een lidstaat en een niet-Unierechtsgebied als bedoeld in bijlage V, deel I, onderdeel A, onder 7,
      van [Richtlijn 2011/16](32011L0016)/EU;
        - *relevante activiteit:* een activiteit als bedoeld in bijlage V, deel I, onderdeel A, onder 8, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *gekwalificeerde relevante activiteiten:* relevante activiteiten als bedoeld in bijlage V, deel I, onderdeel A,
      onder 9, van [Richtlijn 2011/16](32011L0016)/EU;
        - *tegenprestatie:* een compensatie als bedoeld in bijlage V, deel I, onderdeel A, onder 10, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *persoonlijke dienst:* een dienst als bedoeld in bijlage V, deel I, onderdeel A, onder 11, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *verkoper:* een gebruiker van een platform als bedoeld in bijlage V, deel I, onderdeel B, onder 1, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *actieve verkoper:* een verkoper als bedoeld in bijlage V, deel I, onderdeel B, onder 2, van [Richtlijn 2011/16]
      (32011L0016)/EU;
        - *te rapporteren verkoper:* een actieve verkoper, die geen uitgesloten verkoper is, die een ingezetene is als
      bedoeld in bijlage V, deel II, onderdeel D, van [Richtlijn 2011/16](32011L0016)/EU van een lidstaat of ingezetene
      is als bedoeld in deel II, paragraaf D, OESO-modelregels van een gekwalificeerd niet-Unierechtsgebied, of die een
      onroerend goed heeft verhuurd dat in een lidstaat of gekwalificeerd niet-Unierechtsgebied is gelegen;
        - *uitgesloten verkoper:* een verkoper als bedoeld in bijlage V, deel I, onderdeel B, onder 4, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *entiteit:* een rechtspersoon of een juridische constructie als bedoeld in bijlage V, deel I, onderdeel C, onder
      1, eerste zin, van [Richtlijn 2011/16](32011L0016)/EU;
        - *gelieerde entiteit van een entiteit:* een entiteit die tot de andere entiteit in een verhouding staat als
      bedoeld in bijlage V, deel I, onderdeel C, onder 1, tweede tot en met vierde zin, van [Richtlijn 2011/16]
      (32011L0016)/EU;
        - *overheidsinstantie:* een instantie als bedoeld in bijlage V, deel I, onderdeel C, onder 2, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *btw-identificatienummer:* het unieke nummer, bedoeld in bijlage V, deel I, onderdeel C, onder 4, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *hoofdadres:* het adres, bedoeld in bijlage V, deel I, onderdeel C, onder 5, van [Richtlijn 2011/16](32011L0016)/
      EU;
        - *rapportageperiode:* het kalenderjaar, bedoeld in bijlage V, deel I, onderdeel C, onder 6, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *eigendomslijst:* alle onroerende zaken als bedoeld in bijlage V, deel I, onderdeel C, onder 7, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *identificatiecode van de financiële rekening:* het identificatienummer of referentienummer, bedoeld in bijlage
      V, deel I, onderdeel C, onder 8, van [Richtlijn 2011/16](32011L0016)/EU;
        - *goederen:* alle materiële zaken;
        - *OESO-modelregels:* de modelregels zoals goedgekeurd op 29 juni 2020 met als citeertitel: «OECD (2020), Model
      Rules for Reporting by Platform Operators with respect to Sellers in the Sharing and Gig Economy, OECD, Paris».


