        artikel: '1'
        hoofdstuk: I
  - number: '18'
    text: |-
      Indien Onze Minister een wederzijdse samenwerking aangaat met de bevoegde autoriteit van een staat die verder reikt
      dan de samenwerking die mogelijk is op grond van Richtlijn 2011/16/EU, gaat hij deze verder reikende samenwerking
      ook aan met een lidstaat die om deze samenwerking verzoekt.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel18
  - number: '19'
    text: |-
      1 Het meedelen van de gevraagde inlichtingen, bedoeld in [artikel 5][ref1], de ontvangstbevestiging, bedoeld
      in [artikel 5a, derde lid][ref2], het verzoek om aanvullende achtergrondinformatie, bedoeld in artikel 5a,
      vierde lid, de mededeling dat niet of niet tijdig aan het verzoek kan of zal worden voldaan, bedoeld in artikel
      5a, eerste en vijfde lid, en de beantwoording van een verzoek om een administratief onderzoek als bedoeld
      in [artikel 8, tweede lid][ref3], worden voor zover mogelijk langs elektronische weg en door middel van een
      standaardformulier, dat voldoet aan de in of krachtens Richtlijn 2011/16/EU gestelde voorwaarden, gedaan.

      2 De verstrekking van inlichtingen, bedoeld in [artikel 7, eerste lid][ref4], de beantwoording van het
      verzoek tot betekening, bedoeld in [artikel 12, eerste lid][ref5], het verzoek om terugmelding, bedoeld in
      [artikel 15, eerste lid][ref6], het verlenen van de toestemming, bedoeld in [artikel 17, tweede lid][ref7],
      het mededelen van de lijst, bedoeld in artikel 17, derde lid, het vragen van de toestemming, bedoeld in
      [artikel 30, tweede lid][ref8], het doorgeven van de inlichtingen, bedoeld in artikel 30, vijfde lid, de
      kennisgeving van het voornemen, bedoeld in artikel 30, zesde lid, en het doorgeven van de inlichtingen, bedoeld in
      [artikel 31, tweede lid][ref9], worden door middel van een standaardformulier, dat voldoet aan de in of krachtens
      Richtlijn 2011/16/EU gestelde voorwaarden, en voor zover mogelijk langs elektronische weg gedaan.

      3 De automatische inlichtingenuitwisseling, bedoeld in de [artikelen 6b][ref10], [6c][ref11], [6d][ref12],
      [6e][ref13], [6f][ref14] en [6g][ref15], wordt door middel van een standaardformulier, dat voldoet aan de in of
      krachtens Richtlijn 2011/16/EU gestelde voorwaarden, en voor zover mogelijk langs elektronische weg gedaan.

      4 Het standaardformulier, bedoeld in het eerste tot en met derde lid, kan vergezeld gaan van verslagen,
      verklaringen en andere bescheiden, of van voor eensluidend gewaarmerkte afschriften of uittreksels daarvan.


