  - number: 10a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften voor rapporterende financiële instellingen
      gegeven met het oog op het door die instellingen verstrekken van gegevens en inlichtingen als bedoeld in de
      [artikelen 10b tot en met 10f][ref1] en de identificatie van de te rapporteren rekeningen en te rapporteren
      personen en met het oog op de door Onze Minister te verstrekken informatie, bedoeld in de [artikelen 10b][ref2]
      en [10c][ref3], aan rechtsgebieden ten aanzien waarvan het land Nederland een verplichting heeft om die informatie
      te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel10c
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel10a
