  - number: '29'
    text: |-
      1 Indien de bevoegde autoriteit van de staat die de inlichtingen heeft verstrekt hierom verzoekt, doet Onze
      Minister met inachtneming van [artikel 67 van de Algemene wet inzake rijksbelastingen][ref1], zo snel mogelijk,
      doch uiterlijk drie maanden nadat het resultaat van het gebruik van gevraagde of spontaan verkregen inlichtingen
      bekend is, een terugmelding naar de bevoegde autoriteit van de staat die de inlichtingen heeft verstrekt.

      2 Onze Minister doet eenmaal per jaar, overeenkomstig bilateraal overeengekomen praktische afspraken, een
      terugmelding over de automatische uitwisseling van inlichtingen naar de betrokken lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
