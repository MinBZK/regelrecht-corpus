    text: |-
      1 Deze wet en de daarop berustende bepalingen verstaan onder:

      a. Nederland: het in Europa gelegen deel van het Koninkrijk;

      b. Onze Minister: Onze Minister van Financiën;

      c. lidstaat: lidstaat van de Europese Unie;

      d. staat: een lidstaat, een Mogendheid of een bestuurlijke eenheid waarmee in de relatie met Nederland een
      wederkerige regeling bestaat die voorziet in wederzijdse bijstand bij de heffing van belastingen, alsmede Aruba,
      Curaçao en Sint Maarten;

      e.

      f. bevoegde autoriteit: de door een staat tot het uitwisselen van inlichtingen aangewezen persoon of instantie;

      g.

      h. Richtlijn 2011/16/EU: Richtlijn 2011/16/EU van de Raad van 15 februari 2011 betreffende de administratieve
      samenwerking op het gebied van de belastingen en tot intrekking van Richtlijn 77/799/EEG (PbEU 2011, L 64);

      i. centraal verbindingsbureau: een door de bevoegde autoriteit van een lidstaat aangewezen bureau dat is belast met
      de primaire zorg voor de contacten met de andere lidstaten op het gebied van de administratieve samenwerking;

      j. administratief onderzoek: alle door de staten bij het vervullen van hun taken verrichte controles, onderzoeken
      en acties ter waarborging van de juiste toepassing van de belastingwetgeving;

      k. uitwisseling van inlichtingen op verzoek: de uitwisseling van inlichtingen in antwoord op een verzoek van de
      verzoekende staat aan de aangezochte staat met betrekking tot een specifiek geval;

      l. automatische uitwisseling: de systematische verstrekking van vooraf bepaalde inlichtingen aan een andere staat,
      zonder voorafgaand verzoek, met regelmatige, vooraf vastgestelde tussenpozen;

      m. spontane uitwisseling: het niet-systematisch, te eniger tijd en ongevraagd verstrekken van inlichtingen aan een
      andere staat;

      n. persoon:

      1°. een natuurlijk persoon;

      2°. een rechtspersoon;

      3°. indien de geldende wetgeving in een staat in die mogelijkheid voorziet, een vereniging van personen die bevoegd
      is rechtshandelingen te verrichten, maar niet de status van rechtspersoon bezit, of

      4°. een andere juridische constructie, ongeacht de aard of vorm ervan, met of zonder rechtspersoonlijkheid, die
      activa, met inbegrip van de daardoor gegenereerde inkomsten, bezit of beheert die aan een onder deze wet vallende
      belasting zijn onderworpen;

      o. langs elektronische weg: door middel van elektronische apparatuur voor gegevensverwerking – met inbegrip
      van digitale compressie – en gegevensopslag, met gebruikmaking van kabels, radio, optische technologie of
      elektromagnetische middelen;

      p. CCN-netwerk: het op het gemeenschappelijk communicatienetwerk (common communication network – CCN) gebaseerde
      gemeenschappelijk platform dat de Europese Unie heeft ontwikkeld voor het elektronische berichtenverkeer tussen
      autoriteiten die bevoegd zijn op het gebied van douane en belastingen;

      q. Richtlijn (EU) 2015/849: Richtlijn (EU) 2015/849 van het Europees Parlement en de Raad van 20 mei 2015 inzake
      de voorkoming van het gebruik van het financiële stelsel voor het witwassen van geld of terrorismefinanciering,
      tot wijziging van Verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad en tot intrekking van
      [Richtlijn 2005/60/EG](32005L0060) van het Europees Parlement en de Raad en [Richtlijn 2006/70/EG](32006L0070) van
      de Commissie (PbEU 2015, L 141);

      r. gezamenlijke audit: een administratief onderzoek dat gezamenlijk door de bevoegde autoriteiten van twee of meer
      lidstaten wordt uitgevoerd, en verband houdt met een of meer personen van gezamenlijk of complementair belang voor
      de bevoegde autoriteiten van die lidstaten;

      s. gegevensinbreuk: een inbreuk op de beveiliging die leidt tot vernietiging, verlies, wijziging of elk voorval van
      ongepaste of ongeoorloofde inzage, openbaarmaking of gebruik van inlichtingen, met inbegrip van persoonsgegevens
      die worden doorgegeven, opgeslagen of anderszins verwerkt, als gevolg van opzettelijke onwettige handelingen,
      nalatigheid of ongevallen, waarbij geldt dat een gegevensinbreuk betrekking kan hebben op de vertrouwelijkheid, de
      beschikbaarheid en de integriteit van gegevens.

      2 Wijzigingen van [Richtlijn 2011/16](32011L0016)/EU of Richtlijn (EU) 2015/849 gaan voor de toepassing van deze
      wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
