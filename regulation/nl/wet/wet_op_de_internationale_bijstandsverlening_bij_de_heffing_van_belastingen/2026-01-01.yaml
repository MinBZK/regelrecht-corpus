  - number: 10d
    text: |-
      1 In afwijking van [artikel 10b, eerste lid, onderdelen a, b en c][ref1], is een rapporterende financiële
      instelling ter zake van een bestaande rekening niet verplicht het fiscale identificatienummer of de geboortedatum
      van de te rapporteren persoon of de rekeninghouder te verstrekken indien dat fiscale identificatienummer,
      onderscheidenlijk die geboortedatum, niet in het dossier van de rapporterende financiële instelling voorhanden
      is en de rapporterende financiële instelling niet uit hoofde van andere wetgeving of enig rechtsinstrument van de
      Europese Unie verplicht is dat gegeven te verzamelen.

      2 Een rapporterende financiële instelling verricht redelijke inspanningen om aan het einde van het tweede
      kalenderjaar volgend op het jaar waarin een bestaande rekening als te rapporteren rekening is aangemerkt het
      fiscale identificatienummer, bedoeld in het eerste lid, en de geboortedatum, bedoeld in het eerste lid, te
      verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
