  - number: 10j
    text: |-
      1 Een rapporterende platformexploitant die niet kiest voor rapportage in een andere lidstaat als bedoeld in
      [artikel 10k][ref1] rapporteert aan Onze Minister de gegevens en inlichtingen, bedoeld in het tweede, derde,
      vierde, vijfde en zesde lid, met betrekking tot de rapportageperiode uiterlijk op 31 januari van het jaar dat
      volgt op het kalenderjaar waarin een verkoper als te rapporteren verkoper is aangemerkt, ingeval die rapporterende
      platformexploitant fiscaal ingezetene is van Nederland of, indien dat niet het geval is en die rapporterende
      platformexploitant ook geen fiscaal ingezetene is van een lidstaat, voldoet aan de voorwaarde dat:

      a. hij is opgericht naar Nederlands recht;

      b. de plaats van de werkelijke leiding zich in Nederland bevindt; of

      c. hij een vaste inrichting in Nederland heeft en geen gekwalificeerde platformexploitant buiten de Europese Unie
      is.

      2 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn met betrekking tot de rapporterende
      platformexploitant zelf:

      a. de naam, het geregistreerde kantooradres, het fiscale identificatienummer en, in voorkomend geval, het
      op grond van [artikel 10l, tweede lid][ref2], toegewezen individuele registratienummer van de rapporterende
      platformexploitant;

      b. de handelsnaam of -namen van het platform of de platformen waarover de rapporterende platformexploitant
      rapporteert.

      3 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn met betrekking tot elke te rapporteren verkoper
      die ingezetene is als bedoeld in bijlage V, deel II, onderdeel D, van [Richtlijn 2011/16](32011L0016)/EU van een
      lidstaat en een andere relevante activiteit heeft verricht dan de verhuur van onroerende zaken:

      a. de inlichtingen die op grond van bijlage V, deel II, onderdeel B, van [Richtlijn 2011/16](32011L0016)/EU worden
      verzameld;

      b. de identificatiecode van de financiële rekening, voor zover bekend bij de rapporterende platformexploitant en
      voor zover de bevoegde autoriteit van de lidstaat waarvan de te rapporteren verkoper een ingezetene is als bedoeld
      in bijlage V, deel II, onderdeel D, van [Richtlijn 2011/16](32011L0016)/EU niet heeft bekendgemaakt dat zij niet
      voornemens is de identificatiecode van de financiële rekening voor dat doel te gebruiken;

      c. de naam van de houder van de financiële rekening waarop de tegenprestatie wordt betaald of gecrediteerd
      indien deze verschillend is van de naam van de te rapporteren verkoper en voor zover deze bekend is bij de
      rapporterende platformexploitant, alsook alle andere financiële identificatiegegevens waarover de rapporterende
      platformexploitant beschikt met betrekking tot die rekeninghouder;

      d. elke lidstaat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in bijlage V, deel II, onderdeel
      D, van [Richtlijn 2011/16](32011L0016)/EU;

      e. de totale tegenprestatie die is betaald of gecrediteerd, weergegeven per kwartaal van de rapportageperiode, en
      het aantal relevante activiteiten waarvoor deze is betaald of gecrediteerd;

      f. alle honoraria, commissielonen of belastingen die door de rapporterende platformexploitant werden ingehouden of
      geheven, weergegeven per kwartaal van de rapportageperiode.

      4 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn met betrekking tot elke te rapporteren verkoper
      die een andere relevante activiteit heeft verricht dan de verhuur van onroerende zaken en die ingezetene is als
      bedoeld in deel II, paragraaf D, OESO-modelregels van een niet-Unierechtsgebied dat een van kracht zijnde adequate
      overeenkomst heeft met Nederland die voorziet in de wederkerige uitwisseling van gelijkwaardige inlichtingen tussen
      Nederland en die staat:

      a. de inlichtingen die op grond van deel II, paragraaf B, OESO-modelregels worden verzameld;

      b. ieder ander beschikbaar fiscaal identificatienummer, inclusief de staat van uitgifte;

      c. de identificatiecode van de financiële rekening, voor zover bekend bij de rapporterende platformexploitant en
      voor zover de bevoegde autoriteit van de staat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in
      de aanhef, niet heeft bekendgemaakt dat zij niet voornemens is de identificatiecode van de financiële rekening voor
      dat doel te gebruiken;

      d. de naam van de houder van de financiële rekening waarop de tegenprestatie wordt betaald of gecrediteerd
      indien deze verschillend is van de naam van de te rapporteren verkoper en voor zover deze bekend is bij de
      rapporterende platformexploitant, alsook alle andere financiële identificatiegegevens waarover de rapporterende
      platformexploitant beschikt met betrekking tot die rekeninghouder;

      e. elke staat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in deel II, paragraaf D, OESO-
      modelregels;

      f. de totale tegenprestatie die is betaald of gecrediteerd, weergegeven per kwartaal van de rapportageperiode, en
      het aantal relevante activiteiten waarvoor deze is betaald of gecrediteerd;

      g. alle honoraria, commissielonen of belastingen die door de rapporterende platformexploitant werden ingehouden of
      geheven, weergegeven per kwartaal van de rapportageperiode.

      5 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn met betrekking tot elke te rapporteren verkoper
      die ingezetene is als bedoeld in bijlage V, deel II, onderdeel D, van [Richtlijn 2011/16](32011L0016)/EU van een
      lidstaat en als relevante activiteit de verhuur van onroerende zaken heeft verricht:

      a. de inlichtingen die op grond van bijlage V, deel II, onderdeel B, van [Richtlijn 2011/16](32011L0016)/EU worden
      verzameld;

      b. de identificatiecode van de financiële rekening, voor zover bekend bij de rapporterende platformexploitant en
      voor zover de bevoegde autoriteit van de lidstaat waarvan de te rapporteren verkoper een ingezetene is als bedoeld
      in bijlage V, deel II, onderdeel D, van [Richtlijn 2011/16](32011L0016)/EU niet heeft bekendgemaakt dat zij niet
      voornemens is de identificatiecode van de financiële rekening voor dat doel te gebruiken;

      c. de naam van de houder van de financiële rekening waarop de tegenprestatie wordt betaald of gecrediteerd
      indien deze verschillend is van de naam van de te rapporteren verkoper en voor zover deze bekend is bij de
      rapporterende platformexploitant, alsook alle andere financiële identificatiegegevens waarover de rapporterende
      platformexploitant beschikt met betrekking tot die rekeninghouder;

      d. elke lidstaat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in bijlage V, deel II, onderdeel
      D, van [Richtlijn 2011/16](32011L0016)/EU;

      e. het adres van elke eigendomslijst, vastgesteld op basis van de procedures als omschreven in bijlage V, deel II,
      onderdeel E, van [Richtlijn 2011/16](32011L0016)/EU en, indien beschikbaar, het kadasternummer of het equivalent
      daarvan in het nationale recht van de lidstaat waar de onroerende zaak gelegen is;

      f. de totale tegenprestatie die is betaald of gecrediteerd, weergegeven per kwartaal van de rapportageperiode, en
      het aantal relevante activiteiten dat is verricht voor elke eigendomslijst;

      g. alle honoraria, commissielonen of belastingen die door de rapporterende platformexploitant werden ingehouden of
      geheven, weergegeven per kwartaal van de rapportageperiode;

      h. voor zover beschikbaar, het aantal dagen dat elke eigendomslijst werd verhuurd tijdens de rapportageperiode en
      het type van elke eigendomslijst.

      6 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn met betrekking tot elke te rapporteren verkoper die
      als relevante activiteit de verhuur van onroerende zaken heeft verricht en die ingezetene is als bedoeld in deel
      II, paragraaf D, OESO-modelregels van een niet-Unierechtsgebied dat een van kracht zijnde adequate overeenkomst
      heeft met Nederland die voorziet in de wederkerige uitwisseling van gelijkwaardige inlichtingen tussen Nederland en
      die staat:

      a. de inlichtingen die op grond van deel II, paragraaf B, OESO-modelregels worden verzameld;

      b. ieder ander beschikbaar fiscaal identificatienummer, inclusief de staat van uitgifte;

      c. de identificatiecode van de financiële rekening, voor zover bekend bij de rapporterende platformexploitant en
      voor zover de bevoegde autoriteit van de staat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in
      de aanhef, niet heeft bekendgemaakt dat zij niet voornemens is de identificatiecode van de financiële rekening voor
      dat doel te gebruiken;

      d. de naam van de houder van de financiële rekening waarop de tegenprestatie wordt betaald of gecrediteerd
      indien deze verschillend is van de naam van de te rapporteren verkoper en voor zover deze bekend is bij de
      rapporterende platformexploitant, alsook alle andere financiële identificatiegegevens waarover de rapporterende
      platformexploitant beschikt met betrekking tot die rekeninghouder;

      e. elke staat waarvan de te rapporteren verkoper een ingezetene is als bedoeld in deel II, paragraaf D, OESO-
      modelregels;

      f. het adres van elke eigendomslijst, vastgesteld op basis van de procedures als omschreven in deel II, paragraaf
      E, OESO-modelregels en, indien beschikbaar, het kadasternummer of het equivalent daarvan in het nationale recht van
      de lidstaat waar de onroerende zaak gelegen is;

      g. de totale tegenprestatie die is betaald of gecrediteerd, weergegeven per kwartaal van de rapportageperiode, en
      het aantal relevante activiteiten dat is verricht voor elke eigendomslijst;

      h. alle honoraria, commissielonen of belastingen die door de rapporterende platformexploitant werden ingehouden of
      geheven, weergegeven per kwartaal van de rapportageperiode;

      i. voor zover beschikbaar, het aantal dagen dat elke eigendomslijst werd verhuurd tijdens de rapportageperiode en
      het type van elke eigendomslijst.

      7 De inlichtingen met betrekking tot de tegenprestatie die is betaald of gecrediteerd in een fiduciaire valuta
      worden gerapporteerd in de munt waarin zij is betaald of gecrediteerd. Ingeval de tegenprestatie is betaald of
      gecrediteerd in een andere vorm dan een fiduciaire valuta, worden de inlichtingen gerapporteerd in de lokale munt,
      waarbij zij worden omgezet of gewaardeerd in die munt op een door de rapporterende platformexploitant consistent
      vastgestelde wijze.

      8 De rapporterende platformexploitant, bedoeld in het eerste lid, is ontheven van de verplichting tot het
      rapporteren van de gegevens en inlichtingen, bedoeld in het tweede, derde, vierde, vijfde en zesde lid, aan Onze
      Minister indien hij aannemelijk maakt dat die gegevens en inlichtingen bedoeld in het tweede, derde en vijfde
      lid op grond van een met artikel 8 bis quater, eerste lid, van [Richtlijn 2011/16](32011L0016)/EU overeenkomende
      wettelijke bepaling door een andere rapporterende platformexploitant zijn gerapporteerd.


