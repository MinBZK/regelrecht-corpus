      1 Onze Minister verstrekt op grond van [Richtlijn 2011/16](32011L0016)/EU de bevoegde autoriteit van elke lidstaat
      automatisch de gegevens en inlichtingen, bedoeld in [artikel 10h, tweede lid][ref1].

      2 Onze Minister verstrekt de gegevens en inlichtingen, bedoeld in het eerste lid, binnen een maand te rekenen vanaf
      het einde van het kwartaal waarin die gegevens en inlichtingen zijn verstrekt.


