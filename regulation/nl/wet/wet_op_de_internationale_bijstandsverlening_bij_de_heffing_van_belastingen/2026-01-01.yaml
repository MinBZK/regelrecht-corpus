  - number: 10b
    text: |-
      1 Een rapporterende financiële instelling verstrekt jaarlijks ter zake van elke bij haar aangehouden te rapporteren
      rekening aan Onze Minister de volgende gegevens en inlichtingen:

      a. de naam, het adres, de fiscale woonstaat en het fiscale identificatienummer van de te rapporteren personen die
      rekeninghouder van de rekening zijn;

      b. indien een te rapporteren persoon als bedoeld in onderdeel a een natuurlijk persoon is: de geboortedatum en de
      geboorteplaats van die persoon;

      c. indien de rekeninghouder een entiteit is waarvan op grond van de identificatie- en rapportagevoorschriften,
      bedoeld in artikel 10a, is vastgesteld dat deze een of meer uiteindelijk belanghebbenden heeft die een te
      rapporteren persoon is, onderscheidenlijk zijn:

      1°. de naam, het adres, de fiscale woonstaat en het fiscale identificatienummer van die entiteit;

      2°. de naam, het adres, de fiscale woonstaat, het fiscale identificatienummer, de geboortedatum en de
      geboorteplaats van die te rapporteren persoon;

      d. het rekeningnummer of, bij het ontbreken van een rekeningnummer, het functionele equivalent daarvan;

      e. de naam en het identificatienummer van de rapporterende financiële instelling;

      f. het saldo of de waarde van de rekening, in geval van een kapitaalverzekering of lijfrenteverzekering met
      inbegrip van de geldswaarde of waarde bij afkoop, aan het eind van het kalenderjaar of een andere relevante periode
      waarover wordt gerapporteerd, of, indien de rekening tijdens dat jaar of die periode werd opgeheven, het feit dat
      de rekening werd opgeheven.

      2 Een rapporterende financiële instelling vermeldt bij de gegevens en inlichtingen, bedoeld in het eerste lid,
      onderdeel f, ten aanzien van elk bedrag de valuta waarin het bedrag is uitgedrukt.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het uiterste tijdstip en
      de wijze waarop de gegevens en inlichtingen, bedoeld in het eerste lid, aan Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel10b
  - number: 10c
    text: |-
      1 Een rapporterende financiële instelling verstrekt jaarlijks ter zake van elke bij haar aangehouden te rapporteren
      rekening aan Onze Minister, naast de gegevens en inlichtingen, bedoeld in [artikel 10b, eerste lid][ref1], de
      volgende gegevens en inlichtingen:

      a. indien het een bewaarrekening betreft:

      1°. het op of ter zake van die rekening gestorte of bijgeschreven totale brutobedrag aan rente, totale brutobedrag
      aan dividenden en totale brutobedrag aan overige inkomsten gegenereerd met betrekking tot de activa op de rekening
      gedurende het kalenderjaar of een andere relevante periode waarover wordt gerapporteerd;

      2°. de totale bruto-opbrengsten van de verkoop, terugbetaling of afkoop van financiële activa, die zijn gestort
      of bijgeschreven op die rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt
      gerapporteerd ter zake waarvan de rapporterende financiële instelling voor de rekeninghouder optrad als bewaarder,
      makelaar, vertegenwoordiger of anderszins als gevolmachtigde;

      b. indien het een depositorekening betreft: het totale brutobedrag aan rente dat is gestort of bijgeschreven op die
      rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt gerapporteerd;

      c. indien het een andere rekening betreft dan bedoeld in de onderdelen a en b: het totale brutobedrag dat is
      betaald of bijgeschreven op die rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt
      gerapporteerd ter zake waarvan de rapporterende financiële instelling een betalingsverplichting heeft of debiteur
      is, met inbegrip van het totaalbedrag aan afbetalingen aan de rekeninghouder van die rekening gedurende het
      kalenderjaar of een andere relevante periode waarover wordt gerapporteerd.

      2 Artikel 10b, tweede en derde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
