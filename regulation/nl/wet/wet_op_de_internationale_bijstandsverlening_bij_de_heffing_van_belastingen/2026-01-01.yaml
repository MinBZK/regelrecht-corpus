  - number: 2c
    text: |-
      1 Voor de toepassing van dit artikel en van [artikel 6d][ref1] wordt verstaan onder een voorafgaande
      verrekenprijsafspraak: een uitlating door of namens de inspecteur, dan wel Onze Minister, ongeacht of er effectief
      gebruik van wordt gemaakt, die:

      a. is gedaan ten aanzien van een persoon of groep van personen die zich daarop kan, onderscheidenlijk kunnen,
      beroepen;

      b. voordat grensoverschrijdende transacties tussen gelieerde lichamen hebben plaatsgevonden, een passende reeks
      criteria vaststelt voor de bepaling van de verrekenprijzen voor die transacties of voor de toerekening van winsten
      aan een vaste inrichting.

      2 Voor de toepassing van het eerste lid wordt verstaan onder een grensoverschrijdende transactie:

      a. een transactie of reeks van transacties tussen gelieerde lichamen die niet allemaal hun fiscale woonplaats in
      Nederland hebben; of

      b. een transactie of reeks van transacties die een grensoverschrijdend effect heeft, onderscheidenlijk hebben.

      3 Lichamen zijn voor de toepassing van dit artikel gelieerde lichamen indien een lichaam, onmiddellijk of
      middellijk, deelneemt aan de leiding van of het toezicht op, dan wel in het kapitaal van een ander lichaam of
      indien eenzelfde persoon onmiddellijk of middellijk, deelneemt aan de leiding van of het toezicht op, dan wel in
      het kapitaal van het ene en het andere lichaam.

      4 Verrekenprijzen als bedoeld in het eerste lid zijn de prijzen die een lichaam aan gelieerde lichamen in rekening
      brengt voor de overdracht van materiële en immateriële goederen of voor het verlenen van diensten.

      5 [Artikel 2b, derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel2b
