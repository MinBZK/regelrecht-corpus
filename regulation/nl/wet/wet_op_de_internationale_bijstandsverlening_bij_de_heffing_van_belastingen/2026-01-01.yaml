  - number: 10f
    text: |-
      In afwijking van [artikel 10b, eerste lid, onderdeel b][ref1], is een rapporterende financiële instelling niet
      verplicht de geboorteplaats van een te rapporteren persoon te verstrekken, tenzij:

      a. de rapporterende financiële instelling krachtens andere wetgeving of uit hoofde van een rechtsinstrument van
      de Europese Unie dat van kracht is of op 5 januari 2015 van kracht was, verplicht is of was die geboorteplaats te
      verkrijgen en te rapporteren, en

      b. de geboorteplaats beschikbaar is in de elektronisch doorzoekbare gegevens die door de rapporterende financiële
      instelling worden beheerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
