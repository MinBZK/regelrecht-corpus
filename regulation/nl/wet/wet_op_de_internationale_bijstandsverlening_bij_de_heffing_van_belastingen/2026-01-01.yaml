      1 Een verzoek om inlichtingen als bedoeld in [artikel 23, eerste lid][ref1], en een verzoek om een administratief
      onderzoek als bedoeld in artikel 23, tweede lid, worden voor zover mogelijk gedaan met gebruikmaking van
      een standaardformulier dat voldoet aan de in of krachtens Richtlijn 2011/16/EU gestelde voorwaarden en langs
      elektronische weg.

      2 De ontvangstbevestiging van spontaan verkregen inlichtingen, bedoeld in [artikel 26][ref2], en de terugmelding,
      bedoeld in [artikel 28][ref3], wordt met gebruikmaking van een standaardformulier dat voldoet aan de in of
      krachtens Richtlijn 2011/16/EU gestelde voorwaarden gedaan. Het formulier wordt voor zover mogelijk langs
      elektronische weg verzonden.


