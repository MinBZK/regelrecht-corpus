  - number: '3'
    text: |-
      Onze Minister wordt voor Nederland aangewezen als bevoegde autoriteit en centraal verbindingsbureau. Onze Minister
      is tevens verantwoordelijk voor de contacten met de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel3
  - number: '5'
    text: |-
      Op verzoek van de bevoegde autoriteit van een verzoekende staat deelt Onze Minister alle inlichtingen die hij in
      zijn bezit heeft of naar aanleiding van een administratief onderzoek verkrijgt en die naar verwachting van belang
      zijn voor de administratie en handhaving van de nationale wetgeving van de verzoekende staat met betrekking tot de
      heffing van belastingen die vallen onder de reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1],
      aan die bevoegde autoriteit mee.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 5bis
    text: |-
      1 Voor een verzoek als bedoeld in [artikel 5][ref1] zijn de verzochte inlichtingen naar verwachting van belang
      indien de bevoegde autoriteit van een verzoekende staat op het moment van het verzoek van oordeel is dat er
      overeenkomstig haar nationale wetgeving een redelijke mogelijkheid bestaat dat de verzochte inlichtingen van belang
      zullen zijn voor de belastingaangelegenheden van een of meerdere belastingplichtigen, bij naam geïdentificeerd of
      anderszins, en het verzoek gerechtvaardigd is voor de doeleinden van het onderzoek.

      2 Om het verwachte belang van de verzochte inlichtingen aan te tonen, verstrekt de bevoegde autoriteit van een
      verzoekende staat ten minste de volgende inlichtingen aan Onze Minister:

      a. het fiscale doel waarvoor de informatie wordt opgevraagd; en

      b. een specificering van de inlichtingen die nodig zijn voor de uitvoering of handhaving van haar nationale
      wetgeving.

      3 Indien een verzoek als bedoeld in [artikel 5][ref2] betrekking heeft op een groep belastingplichtigen die niet
      individueel kunnen worden geïdentificeerd, verstrekt de bevoegde autoriteit van een verzoekende staat aan Onze
      Minister ten minste de volgende inlichtingen:

      a. een gedetailleerde beschrijving van de groep;

      b. een toelichting bij de van toepassing zijnde wetgeving en bij de feiten op basis waarvan redelijkerwijs kan
      worden vermoed dat de belastingplichtigen in de groep die wetgeving niet hebben nageleefd;

      c. een toelichting bij de manier waarop de gevraagde inlichtingen zouden bijdragen aan het bepalen van de mate
      waarin de belastingplichtigen in de groep aan de van toepassing zijnde wetgeving voldoen; en

      d. in voorkomend geval, feiten en omstandigheden die verband houden met de betrokkenheid van een derde die actief
      heeft bijgedragen aan de mogelijke niet-naleving van de van toepassing zijnde wetgeving door de belastingplichtigen
      in de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel5
