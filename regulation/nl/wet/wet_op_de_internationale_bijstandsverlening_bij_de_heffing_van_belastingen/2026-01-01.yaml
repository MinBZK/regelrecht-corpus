  - number: 6d
    text: |-
      1 Onze Minister verstrekt op grond van Richtlijn 2011/16/EU de bevoegde autoriteit van elke lidstaat en de Europese
      Commissie automatisch de volgende inlichtingen over voorafgaande grensoverschrijdende rulings of voorafgaande
      verrekenprijsafspraken:

      a. de identificatiegegevens van de relevante persoon, niet zijnde een natuurlijke persoon, en in voorkomend geval
      van de groep personen waartoe deze behoort;

      b. een samenvatting van de inhoud van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, waaronder een algemene omschrijving van de relevante zakelijke activiteiten of transacties
      of reeks van transacties, alsook alle andere inlichtingen die voor de bevoegde autoriteit van de lidstaat nuttig
      kunnen zijn bij de evaluatie van een mogelijk belastingrisico, met dien verstande dat die verstrekking niet mag
      leiden tot de openbaarmaking van:

      1°. een commercieel, industrieel of beroepsgeheim;

      2°. inlichtingen indien de openbare orde van de Nederlandse staat zich daartegen verzet;

      c. de datum waarop de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak is afgegeven,
      gemaakt, gewijzigd of hernieuwd;

      d. de aanvangsdatum van de geldigheidsperiode van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, indien vermeld;

      e. de einddatum van de geldigheidsperiode van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, indien vermeld;

      f. het type grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak;

      g. het bedrag van de transactie of reeks van transacties waar de voorafgaande grensoverschrijdende ruling of
      voorafgaande verrekenprijsafspraak op ziet, indien dit bedrag in de voorafgaande grensoverschrijdende ruling of
      voorafgaande verrekenprijsafspraak is vermeld;

      h. in het geval van een voorafgaande verrekenprijsafspraak: de beschrijving van de criteria die zijn gebruikt voor
      de verrekenprijsvaststelling of de verrekenprijs zelf;

      i. in het geval van een voorafgaande verrekenprijsafspraak: de methode die wordt gebruikt voor de
      verrekenprijsvaststelling of de verrekenprijs zelf;

      j. de namen van andere lidstaten, indien van toepassing, waarvoor de voorafgaande grensoverschrijdende ruling of de
      voorafgaande verrekenprijsafspraak naar alle waarschijnlijkheid van invloed zal zijn;

      k. de personen, niet zijnde natuurlijke personen, in andere lidstaten, indien van toepassing, voor wie de
      voorafgaande grensoverschrijdende ruling of de voorafgaande verrekenprijsafspraak naar alle waarschijnlijkheid van
      belang zal zijn en de vermelding met welke lidstaten de betrokken personen in dat geval verbonden zijn;

      l. de vermelding of de verstrekte inlichtingen gebaseerd zijn op de voorafgaande grensoverschrijdende ruling of de
      voorafgaande verrekenprijsafspraak zelf, dan wel op het verzoek, bedoeld in het vierde lid.

      2 In afwijking van het eerste lid worden de inlichtingen, bedoeld in het eerste lid, onderdelen a, b, h en k, niet
      aan de Europese Commissie verstrekt.

      3 Het eerste lid is niet van toepassing op een voorafgaande grensoverschrijdende ruling ingeval deze uitsluitend
      betrekking heeft op belastingzaken van een of meer natuurlijke personen.

      4 Het eerste lid is niet van toepassing op bilaterale of multilaterale voorafgaande verrekenprijsafspraken met
      derde landen indien het verdrag uit hoofde waarvan over de voorafgaande verrekenprijsafspraken is onderhandeld,
      niet toestaat dat deze verrekenprijsafspraken aan derden worden vrijgegeven. Ingeval de eerste volzin toepassing
      vindt, worden de inlichtingen, bedoeld in het eerste lid, verstrekt op basis van het verzoek dat tot de bilaterale
      of multilaterale voorafgaande verrekenprijsafspraak heeft geleid.

      5 Onze Minister verstrekt de inlichtingen, bedoeld in het eerste lid, onverwijld zodra de voorafgaande
      grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak is afgegeven of gemaakt, gewijzigd of hernieuwd
      en:

      a. ingeval de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak in het eerste halfjaar
      van een kalenderjaar is afgegeven, gemaakt, gewijzigd of hernieuwd: uiterlijk binnen drie maanden na afloop van dat
      eerste halfjaar;

      b. ingeval de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak in het tweede halfjaar
      van een kalenderjaar is afgegeven, gemaakt, gewijzigd of hernieuwd: uiterlijk binnen drie maanden na afloop van
      dat kalenderjaar.
