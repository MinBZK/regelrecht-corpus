  - number: '31'
    text: |-
      1 Indien Onze Minister van een staat inlichtingen ontvangt die naar verwachting van belang zijn voor de
      administratie en de handhaving van de Nederlandse wetgeving betreffende de heffing van belastingen die vallen onder
      de reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], kan hij deze inlichtingen verstrekken aan
      de bevoegde autoriteiten van de lidstaten voor wie die inlichtingen van nut kunnen zijn, en aan elke verzoekende
      autoriteit van een lidstaat, mits dat krachtens een overeenkomst met de staat waar de inlichtingen vandaan komen,
      is toegestaan.

      2 Onze Minister kan, met inachtneming van [artikel 67 van de Algemene wet inzake rijksbelastingen][ref2], ter
      uitvoering van Richtlijn 2011/16/EU ontvangen inlichtingen doorgeven aan een staat, op voorwaarde dat:

      a. de bevoegde autoriteit van de lidstaat waarvan de inlichtingen afkomstig zijn, daarin heeft toegestemd, en

      b. die staat zich ertoe heeft verbonden de medewerking te verlenen die nodig is om bewijsmateriaal bijeen te
      brengen omtrent het ongeoorloofde of onwettige karakter van verrichtingen die in strijd blijken te zijn met of een
      misbruik blijken te vormen van de belastingwetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
