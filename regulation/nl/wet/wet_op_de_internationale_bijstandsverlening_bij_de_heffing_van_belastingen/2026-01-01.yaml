  - number: 5a
    text: |-
      1 Bij een verzoek om inlichtingen van de bevoegde autoriteit van een lidstaat verstrekt Onze Minister de
      inlichtingen, bedoeld in [artikel 5][ref1], zo spoedig mogelijk, doch uiterlijk drie maanden na de datum van
      ontvangst van het verzoek. Indien Onze Minister niet binnen die termijn van drie maanden aan het verzoek kan
      voldoen, deelt hij de redenen hiervoor onmiddellijk, en in elk geval uiterlijk drie maanden na ontvangst van
      het verzoek, mee aan de bevoegde autoriteit van een verzoekende lidstaat met vermelding van de datum waarop hij
      denkt aan het verzoek te kunnen voldoen, waarbij geldt dat aan het verzoek uiterlijk zes maanden na de datum van
      ontvangst van het verzoek dient te worden voldaan. In afwijking van de eerste en tweede zin verstrekt Onze Minister
      inlichtingen die reeds in zijn bezit zijn binnen twee maanden na de datum van ontvangst van het verzoek.

      2 In bijzondere gevallen kunnen Onze Minister en de bevoegde autoriteit van een verzoekende lidstaat, andere dan de
      in het eerste lid vastgestelde termijnen overeenkomen.

      3 Onze Minister bevestigt aan de bevoegde autoriteit van een verzoekende lidstaat, indien mogelijk langs
      elektronische weg, onmiddellijk, en in elk geval uiterlijk zeven werkdagen na ontvangst, de ontvangst van een
      verzoek.

      4 Onze Minister laat in voorkomend geval, uiterlijk een maand na ontvangst van een verzoek, aan de bevoegde
      autoriteit van de verzoekende lidstaat weten welke tekortkomingen het verzoek vertoont en welke aanvullende
      achtergrondinformatie hij verlangt. De in het eerste lid gestelde termijnen gaan in dit geval in op de datum waarop
      Onze Minister de nodige aanvullende informatie ontvangt.

      5 Indien Onze Minister niet over de gevraagde inlichtingen beschikt en niet aan het verzoek kan voldoen of het
      verzoek om de in [artikel 14][ref2] genoemde redenen afwijst, deelt hij de redenen hiervoor onmiddellijk, en in elk
      geval uiterlijk een maand na ontvangst van het verzoek, aan de bevoegde autoriteit van de verzoekende lidstaat mee.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel14
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel5a
