  - number: 2d
    text: |-
      1 Voor de toepassing van dit artikel, [artikel 8, eerste lid][ref1], [hoofdstuk II][ref2], [afdeling 4ab][ref3], en
      de daarop berustende bepalingen en [artikel 11][ref4] wordt verstaan onder:

        - *grensoverschrijdende constructie:* een constructie als bedoeld in artikel 3, achttiende lid, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *meldingsplichtige grensoverschrijdende constructie:* een grensoverschrijdende constructie als bedoeld in artikel
      3, negentiende lid, van [Richtlijn 2011/16](32011L0016)/EU;
        - *wezenskenmerk:* een eigenschap of kenmerk van een grensoverschrijdende constructie die geldt als een indicatie
      van een mogelijk risico op belastingontwijking als bedoeld in bijlage IV van [Richtlijn 2011/16](32011L0016)/EU;
        - *intermediair:* een persoon als bedoeld in artikel 3, eenentwintigste lid, van [Richtlijn 2011/16](32011L0016)/
      EU;
        - *relevante belastingplichtige:* een persoon als bedoeld in artikel 3, tweeëntwintigste lid, van [Richtlijn
      2011/16](32011L0016)/EU;
        - *verbonden onderneming:* een persoon die gelieerd is aan een andere persoon als bedoeld in artikel 3,
      drieëntwintigste lid, van [Richtlijn 2011/16](32011L0016)/EU;
        - *marktklare constructie:* een grensoverschrijdende constructie als bedoeld in artikel 3, vierentwintigste lid,
      van [Richtlijn 2011/16](32011L0016)/EU;
        - *constructie op maat:* een grensoverschrijdende constructie als bedoeld in artikel 3, vijfentwintigste lid, van
      [Richtlijn 2011/16](32011L0016)/EU.

      2 Voor zover voor de toepassing van het eerste lid, onderdeel b, de main benefit test, bedoeld in bijlage
      IV, deel I, van [Richtlijn 2011/16](32011L0016)/EU, toepassing vindt, wordt aan die test voldaan indien kan
      worden aangetoond dat het belangrijkste voordeel dat of een van de belangrijkste voordelen die, gelet op alle
      relevante feiten en omstandigheden, redelijkerwijs te verwachten valt van een constructie het verkrijgen van een
      belastingvoordeel is.


