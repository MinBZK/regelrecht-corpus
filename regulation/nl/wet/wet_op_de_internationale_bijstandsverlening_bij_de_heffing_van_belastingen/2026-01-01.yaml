        artikel: '1'
        hoofdstuk: I
  - number: '21'
    text: |-
      1 Een verzoek om wederzijdse bijstand, waaronder een verzoek tot betekening als bedoeld in
      [artikel 12, eerste lid][ref1], en de bijgevoegde bescheiden kunnen in elke door Onze Minister en de bevoegde
      autoriteit van de verzoekende staat overeengekomen taal zijn gesteld.

      2 Onze Minister kan in bijzondere gevallen een met redenen omkleed verzoek doen aan de bevoegde autoriteit van de
      verzoekende staat om diens verzoek om bijstand vergezeld te laten gaan van een vertaling in het Nederlands.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel12
