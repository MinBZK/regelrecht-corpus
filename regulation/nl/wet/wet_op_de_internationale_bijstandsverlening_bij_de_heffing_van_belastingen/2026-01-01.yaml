  - number: '24'
    text: |-
      1 In de gevallen waarin dat naar verwachting van belang is voor de heffing van belastingen die vallen onder de
      reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], kan Onze Minister zich, behalve uit eigen
      beweging, ook op verzoek van een college van gedeputeerde staten, een college van burgemeester en wethouders of
      een dagelijks bestuur van een waterschap tot de bevoegde autoriteit van een andere staat wenden met een verzoek om
      bijstand bij de heffing van belastingen of met een verzoek tot een administratief onderzoek.

      2 Een college van gedeputeerde staten, een college van burgemeester en wethouders en een dagelijks bestuur van een
      waterschap verstrekken alle inlichtingen die voor het doen van een verzoek om bijstand nuttig kunnen zijn.

      3 Wanneer een verzoek om bijstand bij de heffing van belastingen is gedaan op verzoek van een college van
      gedeputeerde staten, een college van burgemeester en wethouders of een dagelijks bestuur van een waterschap,
      wordt dit college of dit bestuur onverwijld op de hoogte gesteld van de vragen en mededelingen van de aangezochte
      autoriteit van de staat waaraan het verzoek was gericht met betrekking tot de uitvoering van het verzoek om
      bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel24
