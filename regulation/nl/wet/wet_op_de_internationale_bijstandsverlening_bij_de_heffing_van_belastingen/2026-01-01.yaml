        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '13'
    text: |-
      De colleges van gedeputeerde staten, de colleges van burgemeester en wethouders en de dagelijkse besturen van
      waterschappen verlenen desgevraagd hun medewerking aan de uitvoering van een verzoek om bijstand bij de heffing
      van belastingen.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel13
  - number: '14'
    text: |-
      1 Onze Minister verstrekt geen inlichtingen indien de verstrekking daarvan niet strekt tot uitvoering van
      richtlijnen van de Raad van de Europese Unie of van andere regelingen van internationaal en interregionaal
      recht tot het verlenen van wederzijdse bijstand bij de heffing van belastingen, alsmede renten daarover en
      bestuursrechtelijke sancties en boeten die daarmee verband houden.

      2 Onze Minister behoeft geen inlichtingen te verstrekken indien:

      a. de openbare orde van de Nederlandse staat zich daartegen verzet;

      b. die inlichtingen in Nederland krachtens wettelijke bepalingen of op grond van de administratieve praktijk niet
      zouden kunnen worden verkregen voor de heffing van een in [artikel 1][ref1] bedoelde belasting, alsmede voor de
      renten daarover of bestuursrechtelijke sancties of boeten die daarmee verband houden;

      c. aannemelijk is dat de bevoegde autoriteit in de eigen staat niet eerst de gebruikelijke mogelijkheden voor het
      verkrijgen van de door haar gevraagde inlichtingen heeft benut, die zij in de gegeven situatie had kunnen benutten
      zonder het beoogde resultaat in gevaar te brengen;

      d. de bevoegde autoriteit voor wie de inlichtingen zouden zijn bestemd, niet bevoegd of in staat is Onze Minister
      soortgelijke inlichtingen te verstrekken;

      e. daarmee een commercieel, een industrieel of een beroepsgeheim zou worden onthuld;

      f. de verstrekking strijdig zou zijn met algemeen aanvaarde beginselen van belastingheffing of overige begrenzingen
      die voortvloeien uit de van toepassing zijnde bepalingen van internationaal en interregionaal recht.

      3 In geen geval kan het tweede lid zo worden uitgelegd dat de verstrekking van inlichtingen geweigerd kan worden
      uitsluitend omdat:

      a. de inlichtingen berusten bij een bank, een andere financiële instelling, een gevolmachtigd persoon of een
      persoon die als vertegenwoordiger of trustee optreedt, of

      b. de inlichtingen betrekking hebben op eigendomsbelangen in een persoon.

      4 Onze Minister deelt de bevoegde autoriteit van de verzoekende staat mee op welke gronden hij het verzoek om
      inlichtingen afwijst.

      5 Dit artikel vindt geen toepassing ten aanzien van de inlichtingen, bedoeld in de [artikelen 6b][ref2],
      [6c][ref3], [6d][ref4], [6e][ref5], [6f][ref6] en [6g][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
