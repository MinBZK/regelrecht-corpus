  - number: 27a
    text: Onze Minister kan de bevoegde autoriteit van een lidstaat verzoeken een gezamenlijke audit uit te voeren.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel27a
  - number: '28'
    text: |-
      Op inlichtingen die door Onze Minister in het kader van wederzijdse bijstand van een bevoegde autoriteit van
      een andere staat zijn verkregen, alsmede op inlichtingen die op grond van de [artikelen 8][ref1], [10b][ref2],
      [10c][ref3], [10g][ref4], [10h][ref5],[10j][ref6] en [10l][ref7] zijn verkregen, is de verplichting tot
      geheimhouding, bedoeld in [artikel 67 van de Algemene wet inzake rijksbelastingen][ref8], van overeenkomstige
      toepassing.


