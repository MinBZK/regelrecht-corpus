  - number: 10fa
    text: |-
      Als sprake is van een overeenkomst of praktijk waarvan het primaire doel naar redelijkerwijs moet worden aangenomen
      is het omzeilen van een verplichting als bedoeld in deze afdeling of de daarop berustende bepalingen, geldt die
      verplichting alsof die overeenkomst, onderscheidenlijk die praktijk, er niet is.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel10fa
  - number: 10g
    text: |-
      1 Onze Minister verkrijgt met het oog op de tenuitvoerlegging en handhaving van de tot uitvoering van [Richtlijn
      2011/16](32011L0016)/EU strekkende bepalingen van deze wet en de daarop berustende bepalingen en teneinde te
      waarborgen dat de administratieve samenwerking waarin [Richtlijn 2011/16](32011L0016)/EU voorziet, functioneert,
      desgevraagd binnen een door hem te stellen termijn en op een door hem te bepalen wijze toegang tot de mechanismen,
      procedures, documenten en overige inlichtingen, bedoeld in de artikelen 13, 30, 31, 32 bis en 40 van Richtlijn (EU)
      2015/849, voor zover deze artikelen zijn geïmplementeerd in de Nederlandse wetgeving.

      2 Het eerste lid is van overeenkomstige toepassing op verkrijging van toegang met het oog op de tenuitvoerlegging
      en handhaving van [artikel 2a][ref1] en [afdeling 4a][ref2] en de daarop berustende bepalingen, alsmede met het oog
      op het nakomen van overeenkomsten met rechtsgebieden op grond waarvan het land Nederland de informatie, bedoeld in
      de [artikelen 10b][ref3] en [10c][ref4], aan die rechtsgebieden zal verstrekken.


