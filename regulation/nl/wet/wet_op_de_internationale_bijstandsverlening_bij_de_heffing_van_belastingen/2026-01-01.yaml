  - number: '6'
    text: |-
      Onze Minister kan in overleg met een bevoegde autoriteit gevallen of groepen van gevallen aanwijzen in welke hij
      zonder voorafgaand verzoek inlichtingen zal verstrekken, alsmede de voorwaarden bepalen waaronder de verstrekking
      zal geschieden.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel6
  - number: 6b
    text: |-
      1 Onze Minister verstrekt op grond van Richtlijn 2011/16/EU de bevoegde autoriteit van elke lidstaat automatisch
      alle inlichtingen waarover hij ten aanzien van ingezetenen van die andere lidstaat beschikt inzake de volgende
      specifieke inkomsten- en vermogenscategorieën:

      a. arbeidsinkomen;

      b. directiehonoraria;

      c. levensverzekeringsproducten die niet vallen onder andere rechtsinstrumenten van de Raad van de Europese Unie
      inzake de uitwisseling van inlichtingen noch onder soortgelijke voorschriften;

      d. pensioenen;

      e. eigendom van en inkomsten uit onroerende zaken;

      f. royalty’s.

      2 Onder beschikbare inlichtingen als bedoeld in het eerste lid worden inlichtingen verstaan die zich in de
      belastingdossiers van Nederland bevinden en die opvraagbaar zijn overeenkomstig de procedures voor het verzamelen
      en verwerken van inlichtingen in Nederland.

      3 Inlichtingen inzake inkomsten- en vermogenscategorieën als bedoeld in het eerste lid worden niet automatisch
      verstrekt voor zover een lidstaat heeft aangegeven geen inlichtingen te willen ontvangen inzake een of meer van
      die categorieën.

      4 Onze Minister verstrekt de inlichtingen, bedoeld in het eerste lid, ten minste eenmaal per jaar, binnen zes
      maanden na het verstrijken van het belastingjaar in de loop waarvan de inlichtingen beschikbaar zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel6b
  - number: 6c
    text: |-
      1 Onze Minister verstrekt op grond van [Richtlijn 2011/16](32011L0016)/EU en met inachtneming van de identificatie-
      en rapportagevoorschriften, bedoeld in [artikel 10a][ref1], de bevoegde autoriteit van elke lidstaat automatisch
      de gegevens en inlichtingen, bedoeld in de [artikelen 10b tot en met 10f][ref2], die betrekking hebben op
      ingezetenen van die andere lidstaat.

      2 Onze Minister verstrekt de in het eerste lid bedoelde gegevens en inlichtingen jaarlijks binnen negen maanden na
      het einde van het kalenderjaar waarop de gegevens en inlichtingen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
