  - number: 10n
    text: |-
      Indien Onze Minister vaststelt dat een platformexploitant een uitgesloten platformexploitant is, stelt hij de
      bevoegde autoriteiten van de andere lidstaten daarvan, alsmede van eventuele latere wijzigingen, in kennis.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel10n
  - number: 10o
    text: |-
      Onverminderd [artikel 10p][ref1], verstrekt een rapporterende platformexploitant als bedoeld in de
      [artikelen 10j, eerste lid][ref2], en [10l, tweede lid][ref3], de gegevens en inlichtingen, bedoeld in artikel 10j,
      derde, vierde, vijfde en zesde lid, uiterlijk op 31 januari van het jaar dat volgt op het kalenderjaar waarin de
      verkoper is aangemerkt als een te rapporteren verkoper tevens aan de te rapporteren verkoper waarop die gegevens en
      inlichtingen betrekking hebben.


