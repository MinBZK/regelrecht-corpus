  - number: '7'
    text: |-
      1 Onze Minister verstrekt de bevoegde autoriteit van een andere lidstaat spontaan inlichtingen in de gevallen
      waarin:

      a. vermoed wordt dat in de lidstaat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf
      of vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;

      b. in Nederland een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van invloed
      kan zijn op de belastingheffing in de lidstaat van die bevoegde autoriteit;

      c. in Nederland rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in de
      lidstaat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;

      d. zulks overigens naar het oordeel van Onze Minister is geboden.

      2 Onze Minister kan een bevoegde autoriteit van een andere staat uit eigen beweging inlichtingen verstrekken die
      voor haar van belang kunnen zijn bij de bepaling van een belastingschuld in de gevallen waarin:

      a. vermoed wordt dat in de staat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf
      of vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;

      b. in Nederland een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van invloed
      kan zijn op de belastingheffing in de staat van die bevoegde autoriteit;

      c. in Nederland rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in de
      staat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;

      d. zulks overigens naar het oordeel van Onze Minister is geboden.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel7
