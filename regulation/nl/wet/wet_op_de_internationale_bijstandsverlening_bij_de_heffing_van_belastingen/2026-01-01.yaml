  - number: 10p
    text: |-
      Elke rapporterende financiële instelling als bedoeld in [artikel 2a, eerste lid, onderdeel a][ref1], intermediair
      als bedoeld in [artikel 10h, eerste lid][ref2], of rapporterende platformexploitant als bedoeld in de
      [artikelen 10j, eerste lid][ref3], of [10l, tweede lid][ref4], is gehouden:

      a. elke betrokken natuurlijke persoon in kennis te stellen van het feit dat de hem betreffende gegevens en
      inlichtingen op grond van deze wet en de daarop berustende bepalingen zullen worden verzameld en gerapporteerd, en

      b. elke betrokken natuurlijke persoon tijdig en, in elk geval, voordat de gegevens en inlichtingen worden
      gerapporteerd, alle gegevens en inlichtingen te verstrekken waarop hij op grond van [Verordening (EU) 2016/679]
      (32579R2016) van de rapporterende financiële instelling, intermediair of rapporterende platformexploitant recht
      heeft, zodat die natuurlijke persoon zijn rechten inzake gegevensbescherming kan uitoefenen.


