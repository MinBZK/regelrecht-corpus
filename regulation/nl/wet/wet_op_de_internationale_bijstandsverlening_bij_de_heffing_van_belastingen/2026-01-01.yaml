  - number: '8'
    text: |-
      1 Onze Minister laat door een ambtenaar van de rijksbelastingdienst zo nodig een onderzoek instellen ten behoeve
      van het verstrekken van inlichtingen, bedoeld in de[ artikelen 5][ref1], [6][ref2], [6f][ref3], [6g][ref4]
      of [7][ref5].

      2 Een onderzoek als bedoeld in het eerste lid kan ook plaatsvinden op verzoek van een bevoegde autoriteit van een
      verzoekende staat. Indien Onze Minister van oordeel is dat er geen administratief onderzoek nodig is, deelt hij de
      bevoegde autoriteit van de verzoekende lidstaat onmiddellijk de redenen daarvoor mee.

      3 Bij het in het eerste lid bedoelde onderzoek zijn de bepalingen van [Hoofdstuk VIII, afdeling 2][ref6],
      met uitzondering van [artikel 53, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref7] van
      overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur worden administratieplichtigen aangewezen die gehouden zijn
      eigener beweging bij of krachtens algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen te
      verstrekken aan Onze Minister met het oog op de uitvoering van richtlijnen van de Raad van de Europese Unie of
      van andere regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse bijstand bij de
      heffing van belastingen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot
      het uiterste tijdstip en de wijze waarop de in de eerste volzin bedoelde gegevens en inlichtingen aan Onze Minister
      dienen te worden verstrekt.

      5 Bij of krachtens algemene maatregel van bestuur worden belastingplichtigen aangewezen die gehouden zijn eigener
      beweging bij of krachtens algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen die op henzelf
      betrekking hebben te verstrekken aan Onze Minister met het oog op de uitvoering van richtlijnen van de Raad van de
      Europese Unie of van andere regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse
      bijstand bij de heffing van belastingen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met
      betrekking tot het uiterste tijdstip en de wijze waarop de in de eerste volzin bedoelde gegevens en inlichtingen
      aan Onze Minister dienen te worden verstrekt.

      6 Geen beroep kan worden ingesteld tegen de aankondiging van een onderzoek als bedoeld in het eerste lid, alsmede
      tegen het onderzoek zelve.


