  - number: '16'
    text: |-
      Onze Minister verstrekt geen inlichtingen aan een bevoegde autoriteit indien de wetgeving van de staat van die
      autoriteit geen verplichting tot geheimhouding oplegt aan ambtenaren van de belastingadministratie van die staat
      met betrekking tot hetgeen hun wordt medegedeeld of blijkt bij de uitvoering van de belastingwetten van die staat.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel16
  - number: '17'
    text: |-
      1 Inlichtingen die Onze Minister aan de bevoegde autoriteit van een andere lidstaat verstrekt ter uitvoering van
      Richtlijn 2011/16/EU kunnen door die andere lidstaat tevens worden gebruikt:

      a. voor de vaststelling, tenuitvoerlegging en handhaving van het nationale recht van de andere lidstaat met
      betrekking tot de omzetbelasting en andere indirecte belastingen;

      b. voor de vaststelling en invordering van andere belastingen en rechten die vallen onder artikel 2 van
      Richtlijn 2010/24/EU van de Raad van 16 maart 2010 betreffende de wederzijdse bijstand inzake de invordering van
      schuldvorderingen die voortvloeien uit bepaalde belastingen, rechten en andere maatregelen (PbEU 2010, L 84);

      c. voor de vaststelling en invordering van verplichte socialezekerheidsbijdragen;

      d. in mogelijk tot bestraffing leidende gerechtelijke en administratieve procedures wegens overtreding van de
      belastingwetgeving, onverminderd de algemene regels en de bepalingen betreffende de rechten van verdachten en
      getuigen in dergelijke procedures.

      2 Onze Minister kan de bevoegde autoriteit van een andere lidstaat toestemming verlenen de verstrekte inlichtingen
      voor andere dan de in het eerste lid bedoelde doeleinden te gebruiken. Deze toestemming wordt in ieder geval
      verleend, indien de inlichtingen in Nederland voor soortgelijke doeleinden kunnen worden gebruikt.

      3 Onze Minister kan de bevoegde autoriteit van een andere lidstaat een lijst mededelen van andere dan de in
      het eerste lid bedoelde doeleinden waarvoor de verstrekte inlichtingen kunnen worden gebruikt. De bevoegde
      autoriteit van de lidstaat die de inlichtingen ontvangt, kan deze zonder de toestemming, bedoeld in het tweede
      lid, overeenkomstig het nationale recht van die lidstaat gebruiken voor alle doeleinden die in de lijst zijn
      medegedeeld.

      4 Onze Minister kan zich binnen tien werkdagen na de datum van ontvangst van de kennisgeving van een bevoegde
      autoriteit van een lidstaat, verzetten tegen het voornemen van die bevoegde autoriteit om de ontvangen inlichtingen
      aan de bevoegde autoriteit van een derde lidstaat te verstrekken.

      5 Toestemming voor het overeenkomstig het tweede lid gebruiken van overeenkomstig het derde lid doorgegeven
      inlichtingen kan alleen worden verleend door Onze Minister.

      6 Onze Minister kan aan de bevoegde autoriteit van een staat toestemming verlenen de inlichtingen voor een ander
      doel te gebruiken dan voor de heffing van belastingen die onder de reikwijdte vallen van de wederzijdse bijstand,
      bedoeld in [artikel 1][ref1].

      7 Onze Minister kan op een daartoe strekkend verzoek een bevoegde autoriteit van een staat toestemming verlenen de
      van hem ontvangen inlichtingen aan een bevoegde autoriteit van een andere staat te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel17
    references:
      - id: ref1
