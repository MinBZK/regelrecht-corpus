  - number: '22'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003954/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister kan een verzoek om inlichtingen doen aan de bevoegde autoriteit van een andere staat wanneer
      de gevraagde inlichtingen naar verwachting van belang zijn voor de heffing van belastingen die vallen onder de
      reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1].

      2 Voor een verzoek zijn de verzochte inlichtingen naar verwachting van belang indien Onze Minister op het moment
      van het verzoek van oordeel is dat er overeenkomstig de Nederlandse wetgeving een redelijke mogelijkheid bestaat
      dat de verzochte inlichtingen van belang zullen zijn voor de belastingaangelegenheden van een of meerdere
      belastingplichtigen, bij naam geïdentificeerd of anderszins, en het verzoek gerechtvaardigd is voor de doeleinden
      van het onderzoek.

      3 Om het verwachte belang van de verzochte inlichtingen aan te tonen, verstrekt Onze Minister ten minste de
      volgende inlichtingen aan de bevoegde autoriteit van de aangezochte staat:

      a. het fiscale doel waarvoor de informatie wordt opgevraagd; en

      b. een specificering van de inlichtingen die nodig zijn voor de uitvoering of handhaving van de Nederlandse
      wetgeving.

      4 Indien een verzoek betrekking heeft op een groep belastingplichtigen die niet individueel kunnen worden
      geïdentificeerd, verstrekt Onze Minister aan de bevoegde autoriteit van de aangezochte staat ten minste de volgende
      inlichtingen:

      a. een gedetailleerde beschrijving van de groep;

      b. een toelichting bij de van toepassing zijnde wetgeving en bij de feiten op basis waarvan redelijkerwijs kan
      worden vermoed dat de belastingplichtigen in de groep die wetgeving niet hebben nageleefd;

      c. een toelichting bij de manier waarop de gevraagde inlichtingen zouden bijdragen aan het bepalen van de mate
      waarin de belastingplichtigen in de groep aan de van toepassing zijnde wetgeving voldoen; en

      d. in voorkomend geval, feiten en omstandigheden die verband houden met de betrokkenheid van een derde die actief
      heeft bijgedragen aan de mogelijke niet-naleving van de van toepassing zijnde wetgeving door de belastingplichtigen
      in de groep.

      5 Het in het eerste lid bedoelde verzoek kan een met redenen omkleed verzoek om een bepaald administratief
      onderzoek omvatten.

      6 Onze Minister kan de bevoegde autoriteit van de aangezochte staat verzoeken om originele stukken toegezonden
      te krijgen.

      7 Onze Minister kan met de bevoegde autoriteit van de aangezochte staat termijnen overeenkomen waarbinnen de
      gevraagde inlichtingen verstrekt worden.


