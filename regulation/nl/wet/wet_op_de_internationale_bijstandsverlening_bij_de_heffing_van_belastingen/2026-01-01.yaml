      Onze Minister en de bevoegde autoriteit van de aangezochte staat overeengekomen taal zijn gesteld.

      2 Onze Minister laat in bijzondere gevallen, op een met redenen omkleed verzoek van de bevoegde autoriteit van de
      aangezochte staat, het in het eerste lid bedoelde verzoek vergezeld gaan van een vertaling in de officiële taal of
      één van de officiële talen van de aangezochte staat.


