  - number: 10h
    text: |-
      1 Een intermediair verstrekt aan Onze Minister over een meldingsplichtige grensoverschrijdende constructie de
      gegevens en inlichtingen, bedoeld in het tweede lid, waarvan hij kennis of bezit of waarover hij controle heeft,
      indien hij:

      a. fiscaal inwoner is van Nederland;

      b. een vaste inrichting heeft in Nederland door middel waarvan de diensten met betrekking tot de meldingsplichtige
      grensoverschrijdende constructie, bedoeld in het tweede lid, worden verleend;

      c. is opgericht naar Nederlands recht of onder de toepassing van de Nederlandse wetgeving valt; of

      d. in Nederland is ingeschreven bij een beroepsorganisatie in verband met de verlening van juridische, fiscale
      of adviesdiensten.

      2 De gegevens en inlichtingen, bedoeld in het eerste lid, zijn, voor zover van toepassing:

      a. de naam, de fiscale woonplaats en het fiscale identificatienummer van de intermediair, relevante
      belastingplichtige en, indien relevant, personen die een verbonden onderneming vormen met de relevante
      belastingplichtige;

      b. indien de intermediair of de relevante belastingplichtige een natuurlijk persoon is: de geboortedatum en de
      geboorteplaats van die persoon;

      c. nadere bijzonderheden over de wezenskenmerken op grond waarvan de meldingsplichtige grensoverschrijdende
      constructie gemeld moet worden;

      d. een samenvatting van de inhoud van de meldingsplichtige grensoverschrijdende constructie, met onder meer de
      benaming waaronder zij algemeen bekendstaat, indien voorhanden, en een omschrijving van de relevante zakelijke
      activiteiten of constructies, in algemene bewoordingen gesteld, die niet mag leiden tot de openbaarmaking van een
      handelsgeheim, bedrijfsgeheim, nijverheidsgeheim of beroepsgeheim of een fabriekswerkwijze of handelswerkwijze, of
      van inlichtingen waarvan de onthulling in strijd zou zijn met de openbare orde;

      e. de datum waarop de eerste stap van de implementatie van de meldingsplichtige grensoverschrijdende constructie is
      of zal worden gezet;

      f. nadere bijzonderheden van de nationale bepalingen die aan de meldingsplichtige grensoverschrijdende constructie
      ten grondslag liggen;

      g. de waarde van de meldingsplichtige grensoverschrijdende constructie;

      h. de lidstaat van de relevante belastingplichtige en eventuele andere lidstaten waarop de meldingsplichtige
      grensoverschrijdende constructie naar alle waarschijnlijkheid van invloed zal zijn;

      i. de identificatiegegevens van andere personen in een lidstaat op wie de meldingsplichtige grensoverschrijdende
      constructie naar alle waarschijnlijkheid van invloed zal zijn, waarbij wordt vermeld met welke lidstaten die
      personen een relatie hebben.

      3 De intermediair, bedoeld in het eerste lid, stelt in het geval van marktklare constructies elke drie maanden een
      periodiek verslag op met een overzicht van nieuwe meldingsplichtige gegevens en inlichtingen als bedoeld in het
      tweede lid, aanhef en onderdelen a, b, e, h en i, waarvan hij sinds het laatst ingediende verslag kennis, bezit of
      controle heeft gekregen en verstrekt dit aan Onze Minister.

      4 Indien de intermediair, bedoeld in het eerste lid, op grond van een met artikel 8 bis ter, eerste of tweede lid,
      van [Richtlijn 2011/16](32011L0016)/EU overeenkomende wettelijke bepaling verplicht is de gegevens en inlichtingen,
      bedoeld in het tweede lid, ook aan de bevoegde autoriteiten van een andere lidstaat te verstrekken, worden die
      gegevens en inlichtingen alleen verstrekt aan de lidstaat die als eerste voorkomt op de lijst, bedoeld in artikel
      8 bis ter, derde lid, van [Richtlijn 2011/16](32011L0016)/EU. De intermediair is ontheven van de verplichting,
      bedoeld in het eerste of derde lid, indien hij aannemelijk kan maken dat de gegevens en inlichtingen, bedoeld in
      het tweede lid, aan de laatstbedoelde lidstaat zijn verstrekt.

      5 [Artikel 53a, eerste lid, van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing.
      Als de intermediair, bedoeld in het eerste lid, zich op deze overeenkomstige toepassing beroept, stelt hij andere
      intermediairs die bij dezelfde meldingsplichtige grensoverschrijdende constructie zijn betrokken of, bij gebreke
      daarvan, de relevante belastingplichtige onverwijld in kennis van hun, onderscheidenlijk diens, verplichtingen
      op grond van een met artikel 8 bis ter, eerste, tweede of zesde lid, van [Richtlijn 2011/16](32011L0016)/EU
      overeenkomende wettelijke bepaling.

      6 Bij afwezigheid van een intermediair geldt de verplichting, bedoeld in het eerste lid, voor de relevante
      belastingplichtige die:

      a. fiscaal inwoner is van Nederland;

      b. een vaste inrichting heeft in Nederland die begunstigde van de meldingsplichtige grensoverschrijdende
      constructie is;

      c. in Nederland inkomsten ontvangt of winsten genereert, hoewel hij niet fiscaal inwoner van een lidstaat is noch
      een vaste inrichting in een lidstaat heeft; of

      d. in Nederland een activiteit uitoefent, hoewel hij niet fiscaal inwoner van een lidstaat is noch een vaste
      inrichting in een lidstaat heeft.

      7 Het zesde lid is van overeenkomstige toepassing ingeval naast de intermediair of
      intermediairs die zich ingevolge het vijfde lid op de overeenkomstige toepassing van
      [artikel 53a, eerste lid, van de Algemene wet inzake rijksbelastingen][ref2] of op een bepaling als bedoeld in
      artikel 8 bis ter, vijfde lid, van [Richtlijn 2011/16](32011L0016)/EU beroept, onderscheidenlijk beroepen, geen
      andere intermediair bij dezelfde meldingsplichtige grensoverschrijdende constructie is betrokken.

      8 Indien de relevante belastingplichtige, bedoeld in het zesde lid, op grond van een met artikel 8 bis ter,
      zesde lid, van [Richtlijn 2011/16](32011L0016)/EU overeenkomende wettelijke bepaling verplicht is de gegevens en
      inlichtingen, bedoeld in het tweede lid, ook aan de bevoegde autoriteiten van een andere lidstaat te verstrekken,
      worden die gegevens en inlichtingen alleen verstrekt aan de lidstaat die als eerste voorkomt op de lijst, bedoeld
      in artikel 8 bis ter, zevende lid, van [Richtlijn 2011/16](32011L0016)/EU. De relevante belastingplichtige is
      ontheven van de verplichting, bedoeld in het zesde lid, indien hij aannemelijk kan maken dat de gegevens en
      inlichtingen, bedoeld in het tweede lid, in de laatstbedoelde lidstaat zijn verstrekt.

      9 De intermediair, bedoeld in het eerste lid, is ontheven van de verplichting tot het verstrekken van de gegevens
      en inlichtingen, bedoeld in het tweede lid, indien hij aannemelijk kan maken dat die gegevens en inlichtingen op
      grond van een met artikel 8 bis ter, eerste of tweede lid, van [Richtlijn 2011/16](32011L0016)/EU overeenkomende
      wettelijke bepaling door een andere intermediair zijn verstrekt.

      10 Indien sprake is van meer dan één relevante belastingplichtige met betrekking tot een meldingsplichtige
      grensoverschrijdende constructie rust de verplichting tot het verstrekken van de gegevens en inlichtingen, bedoeld
      in het tweede lid, op de relevante belastingplichtige die als eerste voorkomt op de lijst, bedoeld in artikel 8
      bis ter, tiende lid, van [Richtlijn 2011/16](32011L0016)/EU. De relevante belastingplichtige, bedoeld in het zesde
      lid, is ontheven van de verplichting tot het verstrekken van de gegevens en inlichtingen, bedoeld in het tweede
      lid, indien hij aannemelijk kan maken dat die gegevens en inlichtingen op grond van een met artikel 8 bis ter,
      zesde lid, van [Richtlijn 2011/16](32011L0016)/EU overeenkomende wettelijke bepaling door een andere relevante
      belastingplichtige zijn verstrekt.

      11 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het uiterste tijdstip
      en de wijze waarop de gegevens en inlichtingen, bedoeld in het tweede lid, aan Onze Minister worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53a
