  - number: 2b
    text: |-
      1 Voor de toepassing van dit artikel en van [artikel 6d][ref1] wordt verstaan onder een voorafgaande
      grensoverschrijdende ruling: een uitlating door of namens de inspecteur, dan wel Onze Minister, ongeacht of er
      effectief gebruik van wordt gemaakt, die:

      a. is gedaan ten aanzien van een persoon of groep van personen die zich daarop kan, onderscheidenlijk kunnen,
      beroepen;

      b. de interpretatie of toepassing betreft van een wettelijke bepaling ter uitvoering of handhaving van de nationale
      belastingwetgeving;

      c. betrekking heeft op een grensoverschrijdende transactie of op de mogelijke aanwezigheid van een vaste inrichting
      in Nederland of in een ander rechtsgebied; en

      d. eerder tot stand is gekomen dan:

      1°. de grensoverschrijdende transactie;

      2°. de activiteiten in Nederland of in een ander rechtsgebied op grond waarvan mogelijkerwijs sprake is van een
      vaste inrichting; of

      3°. de indiening van een belastingaangifte voor het tijdvak waarin de grensoverschrijdende transactie of de
      activiteiten in Nederland of in een ander rechtsgebied hebben plaatsgevonden.

      2 Voor de toepassing van het eerste lid wordt verstaan onder een grensoverschrijdende transactie:

      a. een transactie of reeks van transacties waarbij niet alle partijen bij de transactie of reeks van transacties
      hun fiscale woonplaats hebben in Nederland;

      b. een transactie of reeks van transacties waarbij een of meer van de partijen bij de transactie of reeks van
      transacties hun fiscale woonplaats tegelijkertijd in Nederland en in een ander rechtsgebied hebben;

      c. een transactie of reeks van transacties waarbij een van de partijen bij de transactie of reeks van transacties
      met een fiscale woonplaats in Nederland haar bedrijf uitoefent via een vaste inrichting in een ander rechtsgebied
      dan Nederland en de transactie of reeks van transacties alle of een deel van de activiteiten van de vaste
      inrichting uitmaakt, onderscheidenlijk uitmaken, waaronder tevens begrepen de regelingen die worden getroffen door
      een persoon ten aanzien van de bedrijfsactiviteiten die hij in een ander rechtsgebied via een vaste inrichting
      uitoefent;

      d. een transactie of reeks van transacties die een grensoverschrijdend effect heeft, onderscheidenlijk hebben.

      3 Onder inspecteur als bedoeld in het eerste lid wordt verstaan: de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
