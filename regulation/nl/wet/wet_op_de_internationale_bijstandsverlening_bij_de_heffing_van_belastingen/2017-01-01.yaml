preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verplichtingen ten behoeve van de belastingheffing
    beter af te stemmen op verplichtingen van internationaal en interregionaal recht op het gebied van het verlenen
    van bijstand door Nederland aan andere staten bij de heffing van belastingen teneinde te bevorderen dat
    belastingschulden op het juiste bedrag kunnen worden vastgesteld en dat het ontgaan en ontwijken van belastingen
    wordt bestreden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De bepalingen van deze wet strekken tot uitvoering van richtlijnen van de Raad van de Europese Unie en andere
      regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse bijstand bij de heffing van
      belastingen, alsmede renten daarover en bestuursrechtelijke sancties en boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
  - number: '1.2'
    text: |-
      Onder de in het eerste lid bedoelde belastingen valt elke vorm van belastingen die door of namens een staat of de
      territoriale of bestuurlijke onderdelen van een staat, met inbegrip van de lokale overheden, worden geheven.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
  - number: '1.3'
    text: 'Deze wet is niet van toepassing bij het verlenen van wederzijdse bijstand op het gebied van:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
  - number: 1.3.a
    text: |-
      de omzetbelasting in het kader van Verordening (EU) nr. 904/2010 van de Raad van 7 oktober 2010 betreffende de
      administratieve samenwerking en de bestrijding van fraude op het gebied van de belasting over de toegevoegde waarde
      (PbEU 2010, L 268);
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
  - number: 1.3.b
    text: |-
      de accijnzen in het kader van Verordening (EU) nr. 389/2012 van de Raad van 2 mei 2012 betreffende administratieve
      samenwerking op het gebied van de accijnzen en houdende intrekking van Verordening (EG) nr. 2073/2004 (PbEU 2012,
      L 121).
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
  - number: '1.4'
    text: |-
      Deze wet is niet van toepassing bij het verlenen van wederzijdse bijstand op het gebied van
      rechten bij invoer en rechten bij uitvoer met inbegrip van de belasting bij invoer, genoemd in
      [artikel 22 van de Wet op de omzetbelasting 1968][ref1], en van accijns bij invoer, genoemd in
      [artikel 62 van de Wet op de accijns][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel22
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '22'
  - number: '2.1'
    text: 'Deze wet en de daarop berustende bepalingen verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.a
    text: 'Nederland: het in Europa gelegen deel van het Koninkrijk;'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.b
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.c
    text: 'lidstaat: lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.d
    text: |-
      staat: een lidstaat, een Mogendheid of een bestuurlijke eenheid waarmee in de relatie met Nederland een wederkerige
      regeling bestaat die voorziet in wederzijdse bijstand bij de heffing van belastingen, alsmede Aruba, Curaçao en
      Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.f
    text: 'bevoegde autoriteit: de door een staat tot het uitwisselen van inlichtingen aangewezen persoon of instantie;'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.h
    text: |-
      Richtlijn 2011/16/EU: Richtlijn 2011/16/EU van de Raad van 15 februari 2011 betreffende de administratieve
      samenwerking op het gebied van de belastingen en tot intrekking van Richtlijn 77/799/EEG (PbEU 2011, L 64);
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.i
    text: |-
      centraal verbindingsbureau: een door de bevoegde autoriteit van een lidstaat aangewezen bureau dat is belast met de
      primaire zorg voor de contacten met de andere lidstaten op het gebied van de administratieve samenwerking;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.j
    text: |-
      administratief onderzoek: alle door de staten bij het vervullen van hun taken verrichte controles, onderzoeken en
      acties ter waarborging van de juiste toepassing van de belastingwetgeving;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.k
    text: |-
      uitwisseling van inlichtingen op verzoek: de uitwisseling van inlichtingen in antwoord op een verzoek van de
      verzoekende staat aan de aangezochte staat met betrekking tot een specifiek geval;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.l
    text: |-
      automatische uitwisseling: de systematische verstrekking van vooraf bepaalde inlichtingen aan een andere staat,
      zonder voorafgaand verzoek, met regelmatige, vooraf vastgestelde tussenpozen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.m
    text: |-
      spontane uitwisseling: het niet-systematisch, te eniger tijd en ongevraagd verstrekken van inlichtingen aan een
      andere staat;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.n
    text: 'persoon:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.n.1°
    text: een natuurlijk persoon;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.n.2°
    text: een rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.n.3°
    text: |-
      indien de geldende wetgeving in een staat in die mogelijkheid voorziet, een vereniging van personen die bevoegd is
      rechtshandelingen te verrichten, maar niet de status van rechtspersoon bezit, of
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.n.4°
    text: |-
      een andere juridische constructie, ongeacht de aard of vorm ervan, met of zonder rechtspersoonlijkheid, die activa,
      met inbegrip van de daardoor gegenereerde inkomsten, bezit of beheert die aan een onder deze wet vallende belasting
      zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.o
    text: |-
      langs elektronische weg: door middel van elektronische apparatuur voor gegevensverwerking – met inbegrip
      van digitale compressie – en gegevensopslag, met gebruikmaking van kabels, radio, optische technologie of
      elektromagnetische middelen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2.1.p
    text: |-
      CCN-netwerk: het op het gemeenschappelijk communicatienetwerk (common communication network – CCN) gebaseerde
      gemeenschappelijk platform dat de Europese Unie heeft ontwikkeld voor het elektronische berichtenverkeer tussen
      autoriteiten die bevoegd zijn op het gebied van douane en belastingen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      Wijzigingen van Richtlijn 2011/16/EU gaan voor de toepassing van deze wet gelden met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2
  - number: 2a.1
    text: |-
      Voor de toepassing van dit artikel en [afdeling 4A][ref1] en de daarop berustende bepalingen wordt verstaan onder:
        - *rapporterende financiële instelling:* een Nederlandse financiële instelling, niet zijnde een niet-rapporterende
      financiële instelling;
        - *Nederlandse financiële instelling:* 1°. een in Nederland gevestigde financiële instelling, met uitzondering
      van niet in Nederland gelegen filialen van die instelling; 2°. een in Nederland gelegen filiaal van een niet in
      Nederland gevestigde financiële instelling;
        - *financiële instelling:* een financiële instelling als bedoeld in bijlage I, sectie VIII, onderdeel A, onder 3
      tot en met 8, van [Richtlijn 2011/16](32011L0016)/EU;
        - *niet-rapporterende financiële instelling:* een niet-rapporterende financiële instelling als bedoeld in
      bijlage I, sectie VIII, onderdeel B, onder 1, onderdelen a, b, d en e, en onder 2 tot en met 9, van Richtlijn
      2011/16/EU, alsmede een door Onze Minister, met inachtneming van bijlage I, sectie VIII, onderdeel B, onder 1,
      onderdeel c, van Richtlijn 2011/16/EU als zodanig aangewezen financiële instelling die is opgenomen in de lijst,
      bedoeld in artikel 8, lid 7 bis, van Richtlijn 2011/16/EU;
        - *financiële instelling in een deelnemend rechtsgebied:* 1°. een in een deelnemend rechtsgebied gevestigde
      financiële instelling, met uitzondering van niet in dat rechtsgebied gelegen filialen van die instelling; 2°. een
      in een deelnemend rechtsgebied gelegen filiaal van een niet in dat rechtsgebied gevestigde financiële instelling;
        - *deelnemend rechtsgebied:* 1°. een andere lidstaat; 2°. een rechtsgebied waarmee het land Nederland een
      overeenkomst heeft op grond waarvan dat rechtsgebied informatie als bedoeld in de [artikelen 10b][ref2] en
      [10c][ref3] zal verstrekken en dat voorkomt op een door Nederland gepubliceerde en aan de Europese Commissie
      toegezonden lijst; 3°. een ander rechtsgebied waarmee de Europese Unie een overeenkomst heeft op grond waarvan dat
      rechtsgebied informatie als bedoeld in de [artikelen 10b][ref4] en [10c][ref5] zal verstrekken en dat voorkomt op
      een door de Europese Commissie gepubliceerde lijst;
        - *financiële rekening:* een financiële rekening als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 1 tot en
      met 8, van Richtlijn 2011/16/EU, niet zijnde een uitgezonderde rekening;
        - *uitgezonderde rekening:* een uitgezonderde rekening als bedoeld in bijlage I, sectie VIII, onderdeel C,
      onder 17, onderdelen a tot en met f, van Richtlijn 2011/16/EU, alsmede een door Onze Minister, met inachtneming
      van bijlage I, sectie VIII, onderdeel C, onder 17, onderdeel g, van Richtlijn 2011/16/EU als zodanig aangewezen
      rekening die is opgenomen in de lijst, bedoeld in artikel 8, lid 7 bis, van Richtlijn 2011/16/EU;
        - *depositorekening:* een depositorekening als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 2, van
      Richtlijn 2011/16/EU;
        - *bewaarrekening:* een bewaarrekening als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 3, van Richtlijn
      2011/16/EU;
        - *lijfrenteverzekering:* een lijfrenteverzekering als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 6, van
      Richtlijn 2011/16/EU;
        - *kapitaalverzekering:* een kapitaalverzekering als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 7, van
      Richtlijn 2011/16/EU;
        - *bestaande rekening:* 1°. een financiële rekening die op 31 december 2015 werd aangehouden door een rapporterende
      financiële instelling; 2°. een financiële rekening als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 9,
      onderdeel b, van Richtlijn 2011/16/EU;
        - *nieuwe rekening:* een financiële rekening als bedoeld in bijlage I, sectie VIII, onderdeel C, onder 10, van
      Richtlijn 2011/16/EU;
        - *te rapporteren rekening:* een financiële rekening die, met inachtneming van bijlage II, onder 4, van
      Richtlijn 2011/16/EU, wordt aangehouden door een rapporterende financiële instelling en die, met inachtneming
      van bijlage I, sectie VIII, onderdeel E, onder 1, van Richtlijn 2011/16/EU, wordt gehouden door een of meer te
      rapporteren personen of door een passieve NFE met een of meer uiteindelijk belanghebbenden die een te rapporteren
      persoon is, onderscheidenlijk zijn, mits de rekening als zodanig is aangemerkt op basis van de identificatie- en
      rapportagevoorschriften, bedoeld in [artikel 10a][ref6];
        - *te rapporteren persoon:* een persoon uit een deelnemend rechtsgebied, niet zijnde: 1°. een vennootschap waarvan
      de aandelen regelmatig worden verhandeld op een of meer erkende effectenbeurzen; 2°. een vennootschap die een
      gelieerde entiteit is van een vennootschap als bedoeld in onderdeel 1°; 3°. een overheidsinstantie als bedoeld
      in bijlage I, sectie VIII, onderdeel B, onder 2, van Richtlijn 2011/16/EU; 4°. een internationale organisatie
      als bedoeld in bijlage I, sectie VIII, onderdeel B, onder 3, van Richtlijn 2011/16/EU; 5°. een centrale bank als
      bedoeld in bijlage I, sectie VIII, onderdeel B, onder 4, van Richtlijn 2011/16/EU; 6°. een financiële instelling;
        - *persoon uit een deelnemend rechtsgebied:* 1°. een natuurlijk persoon of een entiteit die ingezetene is van een
      deelnemend rechtsgebied onder de fiscale wetgeving van dat rechtsgebied; 2°. een nalatenschap van een erflater die
      ingezetene was van een deelnemend rechtsgebied;
        - *gelieerde entiteit van een entiteit:* een entiteit die tot de andere entiteit in een verhouding staat als
      bedoeld in bijlage I, sectie VIII, onderdeel E, onder 4, van Richtlijn 2011/16/EU;
        - *uiteindelijk belanghebbenden:* de uiteindelijk belanghebbenden, bedoeld in bijlage I, sectie VIII, onderdeel D,
      onder 5, van Richtlijn 2011/16/EU;
        - *niet-financiële entiteit (NFE):* een entiteit, niet zijnde een financiële instelling;
        - *entiteit:* een entiteit als bedoeld in bijlage I, sectie VIII, onderdeel E, onder 3, van Richtlijn 2011/16/EU;
        - *passieve niet-financiële entiteit (passieve NFE):* 1°. een NFE die niet een actieve NFE is; 2°. een
      beleggingsentiteit als bedoeld in bijlage I, sectie VIII, onderdeel A, onder 6, onderdeel b, van Richtlijn 2011/16/
      EU die niet een financiële instelling in het land Nederland of in een deelnemend rechtsgebied is;
        - *actieve niet-financiële entiteit (actieve NFE):* een actieve NFE als bedoeld in bijlage I, sectie VIII,
      onderdeel D, onder 8, van Richtlijn 2011/16/EU;
        - *rekeninghouder:* een rekeninghouder als bedoeld in bijlage I, sectie VIII, onderdeel E, onder 1, van Richtlijn
      2011/16/EU;
        - *financiële activa:* financiële activa als bedoeld in bijlage I, sectie VIII, onderdeel A, onder 7, van Richtlijn
      2011/16/EU;
        - *het land Nederland:* Nederland en de BES eilanden, bedoeld in
      [artikel 2, derde lid, onderdeel d, onder 4°, van de Algemene wet inzake rijksbelastingen][ref7].


