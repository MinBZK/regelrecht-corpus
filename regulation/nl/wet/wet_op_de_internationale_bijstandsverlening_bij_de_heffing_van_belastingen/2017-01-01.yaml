  - number: 2b.1
    text: |-
      Voor de toepassing van dit artikel en van [artikel 6d][ref1] wordt verstaan onder een voorafgaande
      grensoverschrijdende ruling: een uitlating door of namens de inspecteur, dan wel Onze Minister, ongeacht of er
      effectief gebruik van wordt gemaakt, die:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 6d
        hoofdstuk: II
        afdeling: '2'
  - number: 2b.1.a
    text: |-
      is gedaan ten aanzien van een persoon of groep van personen die zich daarop kan, onderscheidenlijk kunnen,
      beroepen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.b
    text: |-
      de interpretatie of toepassing betreft van een wettelijke bepaling ter uitvoering of handhaving van de nationale
      belastingwetgeving;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.c
    text: |-
      betrekking heeft op een grensoverschrijdende transactie of op de mogelijke aanwezigheid van een vaste inrichting in
      Nederland of in een ander rechtsgebied; en
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.d
    text: 'eerder tot stand is gekomen dan:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.d.1°
    text: de grensoverschrijdende transactie;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.d.2°
    text: |-
      de activiteiten in Nederland of in een ander rechtsgebied op grond waarvan mogelijkerwijs sprake is van een vaste
      inrichting; of
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.1.d.3°
    text: |-
      de indiening van een belastingaangifte voor het tijdvak waarin de grensoverschrijdende transactie of de
      activiteiten in Nederland of in een ander rechtsgebied hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.2
    text: 'Voor de toepassing van het eerste lid wordt verstaan onder een grensoverschrijdende transactie:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.2.a
    text: |-
      een transactie of reeks van transacties waarbij niet alle partijen bij de transactie of reeks van transacties hun
      fiscale woonplaats hebben in Nederland;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.2.b
    text: |-
      een transactie of reeks van transacties waarbij een of meer van de partijen bij de transactie of reeks van
      transacties hun fiscale woonplaats tegelijkertijd in Nederland en in een ander rechtsgebied hebben;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.2.c
    text: |-
      een transactie of reeks van transacties waarbij een van de partijen bij de transactie of reeks van transacties met
      een fiscale woonplaats in Nederland haar bedrijf uitoefent via een vaste inrichting in een ander rechtsgebied dan
      Nederland en de transactie of reeks van transacties alle of een deel van de activiteiten van de vaste inrichting
      uitmaakt, onderscheidenlijk uitmaken, waaronder tevens begrepen de regelingen die worden getroffen door een persoon
      ten aanzien van de bedrijfsactiviteiten die hij in een ander rechtsgebied via een vaste inrichting uitoefent;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.2.d
    text: een transactie of reeks van transacties die een grensoverschrijdend effect heeft, onderscheidenlijk hebben.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Onder inspecteur als bedoeld in het eerste lid wordt verstaan: de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 2c.1
    text: |-
      Voor de toepassing van dit artikel en van [artikel 6d][ref1] wordt verstaan onder een voorafgaande
      verrekenprijsafspraak: een uitlating door of namens de inspecteur, dan wel Onze Minister, ongeacht of er effectief
      gebruik van wordt gemaakt, die:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 6d
        hoofdstuk: II
        afdeling: '2'
  - number: 2c.1.a
    text: |-
      is gedaan ten aanzien van een persoon of groep van personen die zich daarop kan, onderscheidenlijk kunnen,
      beroepen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.1.b
    text: |-
      voordat grensoverschrijdende transacties tussen gelieerde lichamen hebben plaatsgevonden, een passende reeks
      criteria vaststelt voor de bepaling van de verrekenprijzen voor die transacties of voor de toerekening van winsten
      aan een vaste inrichting.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.2
    text: 'Voor de toepassing van het eerste lid wordt verstaan onder een grensoverschrijdende transactie:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.2.a
    text: |-
      een transactie of reeks van transacties tussen gelieerde lichamen die niet allemaal hun fiscale woonplaats in
      Nederland hebben; of
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.2.b
    text: een transactie of reeks van transacties die een grensoverschrijdend effect heeft, onderscheidenlijk hebben.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.3
    text: |-
      Lichamen zijn voor de toepassing van dit artikel gelieerde lichamen indien een lichaam, onmiddellijk of middellijk,
      deelneemt aan de leiding van of het toezicht op, dan wel in het kapitaal van een ander lichaam of indien eenzelfde
      persoon onmiddellijk of middellijk, deelneemt aan de leiding van of het toezicht op, dan wel in het kapitaal van
      het ene en het andere lichaam.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.4
    text: |-
      Verrekenprijzen als bedoeld in het eerste lid zijn de prijzen die een lichaam aan gelieerde lichamen in rekening
      brengt voor de overdracht van materiële en immateriële goederen of voor het verlenen van diensten.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
  - number: 2c.5
    text: |-
      [Artikel 2b, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel2b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 2b
        hoofdstuk: I
  - number: '3'
    text: |-
      Onze Minister wordt voor Nederland aangewezen als bevoegde autoriteit en centraal verbindingsbureau. Onze Minister
      is tevens verantwoordelijk voor de contacten met de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel3
  - number: '5'
    text: |-
      Op verzoek van de bevoegde autoriteit van een verzoekende staat deelt Onze Minister alle inlichtingen die hij in
      zijn bezit heeft of naar aanleiding van een administratief onderzoek verkrijgt en die naar verwachting van belang
      zijn voor de administratie en handhaving van de nationale wetgeving van de verzoekende staat met betrekking tot de
      heffing van belastingen die vallen onder de reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1],
      aan die bevoegde autoriteit mee.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 5a.1
    text: |-
      Bij een verzoek om inlichtingen van de bevoegde autoriteit van een lidstaat, verstrekt Onze Minister de in
      [artikel 5][ref1] bedoelde inlichtingen zo snel mogelijk, doch uiterlijk zes maanden na de datum van ontvangst van
      het verzoek. In afwijking van de eerste volzin verstrekt Onze Minister inlichtingen die reeds in zijn bezit zijn
      binnen twee maanden na de datum van ontvangst van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: 5a.2
    text: |-
      In bijzondere gevallen kunnen Onze Minister en de bevoegde autoriteit van een verzoekende lidstaat, andere dan de
      in het eerste lid vastgestelde termijnen overeenkomen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
  - number: 5a.3
    text: |-
      Onze Minister bevestigt aan de bevoegde autoriteit van een verzoekende lidstaat, indien mogelijk langs
      elektronische weg, onmiddellijk, en in elk geval uiterlijk zeven werkdagen na ontvangst, de ontvangst van een
      verzoek.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Onze Minister laat in voorkomend geval, uiterlijk een maand na ontvangst van een verzoek, aan de bevoegde
      autoriteit van de verzoekende lidstaat weten welke tekortkomingen het verzoek vertoont en welke aanvullende
      achtergrondinformatie hij verlangt. De in het eerste lid gestelde termijnen gaan in dit geval in op de datum waarop
      Onze Minister de nodige aanvullende informatie ontvangt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
  - number: 5a.5
    text: |-
      Indien Onze Minister niet binnen de op basis van het eerste, tweede en vierde lid geldende termijn aan het verzoek
      kan voldoen, deelt hij de redenen hiervoor onmiddellijk, en in elk geval uiterlijk drie maanden na ontvangst van
      het verzoek, aan de bevoegde autoriteit van de verzoekende lidstaat mee, met vermelding van de datum waarop hij
      denkt aan het verzoek te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
  - number: 5a.6
    text: |-
      Indien Onze Minister niet over de gevraagde inlichtingen beschikt en niet aan het verzoek kan voldoen of het
      verzoek om de in [artikel 14][ref1] genoemde redenen afwijst, deelt hij de redenen hiervoor onmiddellijk, en in elk
      geval uiterlijk een maand na ontvangst van het verzoek, aan de bevoegde autoriteit van de verzoekende lidstaat mee.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel14
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '14'
        hoofdstuk: II
        afdeling: '6'
  - number: '6'
    text: |-
      Onze Minister kan in overleg met een bevoegde autoriteit gevallen of groepen van gevallen aanwijzen in welke hij
      zonder voorafgaand verzoek inlichtingen zal verstrekken, alsmede de voorwaarden bepalen waaronder de verstrekking
      zal geschieden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6
  - number: 6b.1
    text: |-
      Onze Minister verstrekt op grond van Richtlijn 2011/16/EU de bevoegde autoriteit van elke lidstaat automatisch
      de inlichtingen waarover hij ten aanzien van ingezetenen van die andere lidstaat beschikt inzake de volgende
      specifieke inkomsten- en vermogenscategorieën:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.1.a
    text: arbeidsinkomen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.1.b
    text: directiehonoraria;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.1.c
    text: |-
      levensverzekeringsproducten die niet vallen onder andere rechtsinstrumenten van de Raad van de Europese Unie inzake
      de uitwisseling van inlichtingen noch onder soortgelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.1.d
    text: pensioenen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.1.e
    text: eigendom van en inkomsten uit onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.2
    text: |-
      Onder beschikbare inlichtingen als bedoeld in het eerste lid worden inlichtingen verstaan die zich in de
      belastingdossiers van Nederland bevinden en die opvraagbaar zijn overeenkomstig de procedures voor het verzamelen
      en verwerken van inlichtingen in Nederland.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.3
    text: |-
      Inlichtingen inzake inkomsten- en vermogenscategorieën als bedoeld in het eerste lid worden niet automatisch
      verstrekt voor zover een lidstaat heeft aangegeven geen inlichtingen te willen ontvangen inzake een of meer van die
      categorieën. Onze Minister verstrekt geen inlichtingen aan een lidstaat die de Europese Commissie niet in kennis
      stelt van enige categorie ten aanzien waarvan hij over inlichtingen beschikt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6b.4
    text: |-
      Onze Minister verstrekt de inlichtingen, bedoeld in het eerste lid, ten minste eenmaal per jaar, binnen zes maanden
      na het verstrijken van het belastingjaar in de loop waarvan de inlichtingen beschikbaar zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6b
  - number: 6c.1
    text: |-
      Onze Minister verstrekt op grond van [Richtlijn 2011/16](32011L0016)/EU en met inachtneming van de identificatie-
      en rapportagevoorschriften, bedoeld in [artikel 10a][ref1], de bevoegde autoriteit van elke lidstaat automatisch
      de gegevens en inlichtingen, bedoeld in de [artikelen 10b tot en met 10f][ref2], die betrekking hebben op
      ingezetenen van die andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10a
        hoofdstuk: II
        afdeling: 4a
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 6c.2
    text: |-
      Onze Minister verstrekt de in het eerste lid bedoelde gegevens en inlichtingen jaarlijks binnen negen maanden na
      het einde van het kalenderjaar waarop de gegevens en inlichtingen betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6c
  - number: 6d.1
    text: |-
      Onze Minister verstrekt op grond van Richtlijn 2011/16/EU de bevoegde autoriteit van elke lidstaat en de Europese
      Commissie automatisch de volgende inlichtingen over voorafgaande grensoverschrijdende rulings of voorafgaande
      verrekenprijsafspraken:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.a
    text: |-
      de identificatiegegevens van de relevante persoon, niet zijnde een natuurlijke persoon, en in voorkomend geval van
      de groep personen waartoe deze behoort;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.b
    text: |-
      een samenvatting van de inhoud van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, waaronder een algemene omschrijving van de relevante zakelijke activiteiten of transacties
      of reeks van transacties, met dien verstande dat die samenvatting niet mag leiden tot de openbaarmaking van:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.b.1°
    text: een commercieel, industrieel of beroepsgeheim;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.b.2°
    text: inlichtingen indien de openbare orde van de Nederlandse staat zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.c
    text: |-
      de datum waarop de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak is afgegeven,
      gemaakt, gewijzigd of hernieuwd;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.d
    text: |-
      de aanvangsdatum van de geldigheidsperiode van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, indien vermeld;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.e
    text: |-
      de einddatum van de geldigheidsperiode van de voorafgaande grensoverschrijdende ruling of voorafgaande
      verrekenprijsafspraak, indien vermeld;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.f
    text: het type grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.g
    text: |-
      het bedrag van de transactie of reeks van transacties waar de voorafgaande grensoverschrijdende ruling of
      voorafgaande verrekenprijsafspraak op ziet, indien dit bedrag in de voorafgaande grensoverschrijdende ruling of
      voorafgaande verrekenprijsafspraak is vermeld;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.h
    text: |-
      in het geval van een voorafgaande verrekenprijsafspraak: de beschrijving van de criteria die zijn gebruikt voor de
      verrekenprijsvaststelling of de verrekenprijs zelf;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.i
    text: |-
      in het geval van een voorafgaande verrekenprijsafspraak: de methode die wordt gebruikt voor de
      verrekenprijsvaststelling of de verrekenprijs zelf;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.j
    text: |-
      de namen van andere lidstaten, indien van toepassing, waarvoor de voorafgaande grensoverschrijdende ruling of de
      voorafgaande verrekenprijsafspraak naar alle waarschijnlijkheid van invloed zal zijn;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.k
    text: |-
      de personen, niet zijnde natuurlijke personen, in andere lidstaten, indien van toepassing, voor wie de voorafgaande
      grensoverschrijdende ruling of de voorafgaande verrekenprijsafspraak naar alle waarschijnlijkheid van belang zal
      zijn en de vermelding met welke lidstaten de betrokken personen in dat geval verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.1.l
    text: |-
      de vermelding of de verstrekte inlichtingen gebaseerd zijn op de voorafgaande grensoverschrijdende ruling of de
      voorafgaande verrekenprijsafspraak zelf, dan wel op het verzoek, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.2
    text: |-
      In afwijking van het eerste lid worden de inlichtingen, bedoeld in het eerste lid, onderdelen a, b, h en k, niet
      aan de Europese Commissie verstrekt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.3
    text: |-
      Het eerste lid is niet van toepassing op een voorafgaande grensoverschrijdende ruling ingeval deze uitsluitend
      betrekking heeft op belastingzaken van een of meer natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.4
    text: |-
      Het eerste lid is niet van toepassing op bilaterale of multilaterale voorafgaande verrekenprijsafspraken met derde
      landen indien het verdrag uit hoofde waarvan over de voorafgaande verrekenprijsafspraken is onderhandeld, niet
      toestaat dat deze verrekenprijsafspraken aan derden worden vrijgegeven. Ingeval de eerste volzin toepassing vindt,
      worden de inlichtingen, bedoeld in het eerste lid, verstrekt op basis van het verzoek dat tot de bilaterale of
      multilaterale voorafgaande verrekenprijsafspraak heeft geleid.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.5
    text: 'Onze Minister verstrekt de inlichtingen, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.5.a
    text: |-
      ingeval de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak in het eerste halfjaar
      van een kalenderjaar is afgegeven, gemaakt, gewijzigd of hernieuwd: binnen drie maanden na afloop van dat eerste
      halfjaar;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: 6d.5.b
    text: |-
      ingeval de voorafgaande grensoverschrijdende ruling of voorafgaande verrekenprijsafspraak in het tweede halfjaar
      van een kalenderjaar is afgegeven, gemaakt, gewijzigd of hernieuwd: binnen drie maanden na afloop van dat
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel6d
  - number: '7.1'
    text: 'Onze Minister verstrekt de bevoegde autoriteit van een andere lidstaat spontaan inlichtingen in de gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.1.a
    text: |-
      vermoed wordt dat in de lidstaat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf
      of vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.1.b
    text: |-
      in Nederland een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van invloed kan
      zijn op de belastingheffing in de lidstaat van die bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.1.c
    text: |-
      in Nederland rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in de
      lidstaat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.1.d
    text: zulks overigens naar het oordeel van Onze Minister is geboden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan een bevoegde autoriteit van een andere staat uit eigen beweging inlichtingen verstrekken die voor
      haar van belang kunnen zijn bij de bepaling van een belastingschuld in de gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.2.a
    text: |-
      vermoed wordt dat in de staat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf of
      vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.2.b
    text: |-
      in Nederland een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van invloed kan
      zijn op de belastingheffing in de staat van die bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.2.c
    text: |-
      in Nederland rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in de
      staat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7.2.d
    text: zulks overigens naar het oordeel van Onze Minister is geboden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7
  - number: 7a
    text: |-
      Onze Minister verstrekt de in [artikel 7, eerste lid][ref1], bedoelde inlichtingen zo snel mogelijk, doch uiterlijk
      binnen één maand nadat hij de inlichtingen beschikbaar krijgt, aan de autoriteit van de andere betrokken lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel7
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
  - number: '8.1'
    text: |-
      Onze Minister laat door een ambtenaar van de rijksbelastingdienst zo nodig een onderzoek instellen ten behoeve van
      het verstrekken van inlichtingen, bedoeld in de[ artikelen 5][ref1], [6][ref2] of [7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel7
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '6'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
  - number: '8.2'
    text: |-
      Een onderzoek als bedoeld in het eerste lid kan ook plaatsvinden op verzoek van een bevoegde autoriteit van een
      verzoekende staat. In voorkomend geval deelt Onze Minister de bevoegde autoriteit van de verzoekende staat mee op
      welke gronden hij een onderzoek niet noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij het in het eerste lid bedoelde onderzoek zijn de bepalingen van [Hoofdstuk VIII, afdeling 2][ref1], met
      uitzondering van [artikel 53, tweede en derde lid, van de Algemene wet inzake rijksbelastingen][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel53
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '53'
  - number: '8.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden administratieplichtigen aangewezen die gehouden zijn eigener
      beweging bij of krachtens algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen te verstrekken
      aan Onze Minister met het oog op de uitvoering van richtlijnen van de Raad van de Europese Unie of van andere
      regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse bijstand bij de heffing van
      belastingen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het uiterste
      tijdstip en de wijze waarop de in de eerste volzin bedoelde gegevens en inlichtingen aan Onze Minister dienen te
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden belastingplichtigen aangewezen die gehouden zijn eigener
      beweging bij of krachtens algemene maatregel van bestuur aan te wijzen gegevens en inlichtingen die op henzelf
      betrekking hebben te verstrekken aan Onze Minister met het oog op de uitvoering van richtlijnen van de Raad van de
      Europese Unie of van andere regelingen van internationaal en interregionaal recht tot het verlenen van wederzijdse
      bijstand bij de heffing van belastingen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met
      betrekking tot het uiterste tijdstip en de wijze waarop de in de eerste volzin bedoelde gegevens en inlichtingen
      aan Onze Minister dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
  - number: '8.6'
    text: |-
      Geen beroep kan worden ingesteld tegen de aankondiging van een onderzoek als bedoeld in het eerste lid, alsmede
      tegen het onderzoek zelve.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8
  - number: 8a.1
    text: |-
      Onze Minister kan met de bevoegde autoriteit van één of meer andere staten overeenkomen om gelijktijdig, elk op het
      eigen grondgebied, bij één of meer personen ten aanzien van wie zij een gezamenlijk of complementair belang hebben,
      controles te verrichten en de aldus verkregen inlichtingen uit te wisselen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8a
  - number: 8a.2
    text: |-
      Onze Minister bepaalt welke personen hij voor een gelijktijdige controle wil voorstellen. Hij deelt de bevoegde
      autoriteit van de andere betrokken staten met opgave van redenen mee welke dossiers hij voor een gelijktijdige
      controle voorstelt. Hij bepaalt binnen welke termijn de controles moeten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8a
  - number: 8a.3
    text: |-
      Onze Minister beslist of hij aan een door een andere bevoegde autoriteit voorgestelde gelijktijdige controle wenst
      deel te nemen. Hij stuurt die bevoegde autoriteit een bevestiging van deelname of een gemotiveerde weigering.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Onze Minister wijst een vertegenwoordiger aan die voor Nederland wordt belast met de leiding en de coördinatie van
      de controle.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Onze Minister kan met de bevoegde autoriteit van een verzoekende staat overeenkomen dat, ter uitwisseling van
      inlichtingen in het kader van de in [artikel 1][ref1] bedoelde wederzijdse bijstand, door de bevoegde autoriteit
      van die verzoekende staat gemachtigde ambtenaren onder de door Onze Minister gestelde voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 9.1.a
    text: |-
      aanwezig kunnen zijn in de kantoren van de ambtenaren van de rijksbelastingdienst, dan wel van andere ambtenaren
      die belast zijn met de heffing van belastingen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel9
  - number: 9.1.b
    text: aanwezig kunnen zijn bij onderzoeken die in Nederland worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel9
  - number: '9.2'
    text: |-
      In de overeenkomst, bedoeld in het eerste lid, kan Onze Minister toestaan dat ambtenaren van de bevoegde autoriteit
      van de verzoekende staat in Nederland personen kunnen ondervragen en bescheiden kunnen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel9
  - number: '9.3'
    text: |-
      Ambtenaren uit de verzoekende staat die in Nederland aanwezig zijn, dienen te allen tijde een schriftelijke
      opdracht te kunnen overleggen waaruit hun identiteit en hun officiële hoedanigheid blijkt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel9
  - number: '10'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 8][ref1] wordt ingesteld, is verplicht de ambtenaar van
      de rijksbelastingdienst alsmede de ambtenaar die ingevolge [artikel 9][ref2] bij dit onderzoek aanwezig is, ten
      behoeve van dit onderzoek toegang te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel9
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: 10a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden identificatie- en rapportagevoorschriften voor rapporterende
      financiële instellingen gegeven met het oog op het door die instellingen verstrekken van gegevens en inlichtingen
      als bedoeld in de [artikelen 10b tot en met 10f][ref1] en de identificatie van de te rapporteren rekeningen en te
      rapporteren personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 10b.1
    text: |-
      Een rapporterende financiële instelling verstrekt jaarlijks ter zake van elke bij haar aangehouden te rapporteren
      rekening aan Onze Minister de volgende gegevens en inlichtingen:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.a
    text: |-
      de naam, het adres, de fiscale woonstaat en het fiscale identificatienummer van de te rapporteren personen die
      rekeninghouder van de rekening zijn;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.b
    text: |-
      indien een te rapporteren persoon als bedoeld in onderdeel a een natuurlijk persoon is: de geboortedatum en de
      geboorteplaats van die persoon;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.c
    text: |-
      indien de rekeninghouder een entiteit is waarvan op grond van de identificatie- en rapportagevoorschriften, bedoeld
      in artikel 10a, is vastgesteld dat deze een of meer uiteindelijk belanghebbenden heeft die een te rapporteren
      persoon is, onderscheidenlijk zijn:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.c.1°
    text: de naam, het adres, de fiscale woonstaat en het fiscale identificatienummer van die entiteit;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.c.2°
    text: |-
      de naam, het adres, de fiscale woonstaat, het fiscale identificatienummer, de geboortedatum en de geboorteplaats
      van die te rapporteren persoon;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.d
    text: het rekeningnummer of, bij het ontbreken van een rekeningnummer, het functionele equivalent daarvan;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.e
    text: de naam en het identificatienummer van de rapporterende financiële instelling;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.1.f
    text: |-
      het saldo of de waarde van de rekening, in geval van een kapitaalverzekering of lijfrenteverzekering met inbegrip
      van de geldswaarde of waarde bij afkoop, aan het eind van het kalenderjaar of een andere relevante periode waarover
      wordt gerapporteerd, of, indien de rekening tijdens dat jaar of die periode werd opgeheven, het feit dat de
      rekening werd opgeheven.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.2
    text: |-
      Een rapporterende financiële instelling vermeldt bij de gegevens en inlichtingen, bedoeld in het eerste lid,
      onderdeel f, ten aanzien van elk bedrag de valuta waarin het bedrag is uitgedrukt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het uiterste tijdstip en
      de wijze waarop de gegevens en inlichtingen, bedoeld in het eerste lid, aan Onze Minister worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10b
  - number: 10c.1
    text: |-
      Een rapporterende financiële instelling verstrekt jaarlijks ter zake van elke bij haar aangehouden te rapporteren
      rekening aan Onze Minister, naast de gegevens en inlichtingen, bedoeld in [artikel 10b, eerste lid][ref1], de
      volgende gegevens en inlichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 10c.1.a
    text: 'indien het een bewaarrekening betreft:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10c.1.a.1°
    text: |-
      het op of ter zake van die rekening gestorte of bijgeschreven totale brutobedrag aan rente, totale brutobedrag
      aan dividenden en totale brutobedrag aan overige inkomsten gegenereerd met betrekking tot de activa op de rekening
      gedurende het kalenderjaar of een andere relevante periode waarover wordt gerapporteerd;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10c.1.a.2°
    text: |-
      de totale bruto-opbrengsten van de verkoop, terugbetaling of afkoop van financiële activa, die zijn gestort
      of bijgeschreven op die rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt
      gerapporteerd ter zake waarvan de rapporterende financiële instelling voor de rekeninghouder optrad als bewaarder,
      makelaar, vertegenwoordiger of anderszins als gevolmachtigde;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10c.1.b
    text: |-
      indien het een depositorekening betreft: het totale brutobedrag aan rente dat is gestort of bijgeschreven op die
      rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt gerapporteerd;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10c.1.c
    text: |-
      indien het een andere rekening betreft dan bedoeld in de onderdelen a en b: het totale brutobedrag dat is betaald
      of bijgeschreven op die rekening gedurende het kalenderjaar of een andere relevante periode waarover wordt
      gerapporteerd ter zake waarvan de rapporterende financiële instelling een betalingsverplichting heeft of debiteur
      is, met inbegrip van het totaalbedrag aan afbetalingen aan de rekeninghouder van die rekening gedurende het
      kalenderjaar of een andere relevante periode waarover wordt gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10c.2
    text: Artikel 10b, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10c
  - number: 10d.1
    text: |-
      In afwijking van [artikel 10b, eerste lid, onderdelen a, b en c][ref1], is een rapporterende financiële instelling
      ter zake van een bestaande rekening niet verplicht het fiscale identificatienummer of de geboortedatum van de te
      rapporteren persoon of de rekeninghouder te verstrekken indien dat fiscale identificatienummer, onderscheidenlijk
      die geboortedatum, niet in het dossier van de rapporterende financiële instelling voorhanden is en de rapporterende
      financiële instelling niet uit hoofde van andere wetgeving of enig rechtsinstrument van de Europese Unie verplicht
      is dat gegeven te verzamelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 10d.2
    text: |-
      Een rapporterende financiële instelling verricht redelijke inspanningen om aan het einde van het tweede
      kalenderjaar volgend op het jaar waarin een bestaande rekening als te rapporteren rekening is aangemerkt het
      fiscale identificatienummer, bedoeld in het eerste lid, en de geboortedatum, bedoeld in het eerste lid, te
      verkrijgen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10d
  - number: 10e
    text: |-
      In afwijking van [artikel 10b, eerste lid, onderdelen a en c][ref1], is een rapporterende financiële instelling
      niet verplicht het fiscale identificatienummer van een te rapporteren persoon of een rekeninghouder te verstrekken
      indien de fiscale woonstaat van die te rapporteren persoon, onderscheidenlijk van die rekeninghouder, hem geen
      fiscaal identificatienummer heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 10f
    text: |-
      In afwijking van [artikel 10b, eerste lid, onderdeel b][ref1], is een rapporterende financiële instelling niet
      verplicht de geboorteplaats van een te rapporteren persoon te verstrekken, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
  - number: 10f.a
    text: |-
      de rapporterende financiële instelling krachtens andere wetgeving of uit hoofde van een rechtsinstrument van de
      Europese Unie dat van kracht is of op 5 januari 2015 van kracht was, verplicht is of was die geboorteplaats te
      verkrijgen en te rapporteren, en
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10f
  - number: 10f.b
    text: |-
      de geboorteplaats beschikbaar is in de elektronisch doorzoekbare gegevens die door de rapporterende financiële
      instelling worden beheerd.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel10f
  - number: '11.1'
    text: |-
      Indien het aan opzet of grove schuld van de belastingplichtige, de administratieplichtige of de
      rapporterende financiële instelling is te wijten dat de verplichtingen, bedoeld in [artikel 8][ref1] en
      [afdeling 4A][ref2] en de op dat artikel en die afdeling berustende bepalingen, niet, niet tijdig, niet
      volledig of niet juist zijn of worden nagekomen, vormt dit een vergrijp ter zake waarvan Onze Minister hem,
      onderscheidenlijk haar, een bestuurlijke boete van ten hoogste het bedrag van de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3], kan opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003954#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003954
        hoofdstuk: II
        afdeling: 4a
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '11.2'
    text: |-
      [Hoofdstuk VIIIA, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing
      met betrekking tot een bestuurlijke boete die op grond van het eerste lid wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '11.3'
    text: |-
      In afwijking in zoverre van [artikel 5:45 van de Algemene wet bestuursrecht][ref1] vervalt de bevoegdheid tot het
      opleggen van de bestuurlijke boete, bedoeld in het eerste lid, vijf jaren na het einde van het kalenderjaar waarin
      de verplichting is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '11.4'
    text: |-
      [Hoofdstuk IX van de Algemene wet inzake rijksbelastingen][ref1], met uitzondering van het in
      [artikel 69 van die wet][ref2] genoemde vereiste dat het feit ertoe strekt dat te weinig belasting wordt geheven,
      is van overeenkomstige toepassing ten aanzien van degene die niet voldoet aan de verplichtingen, bedoeld in
      de [artikelen 8][ref3] en [10][ref4] en [afdeling 4A][ref5] en de op die artikelen en die afdeling berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003954#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003954#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0003954
        artikel: '10'
        hoofdstuk: II
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0003954
        hoofdstuk: II
        afdeling: 4a
  - number: '12.1'
    text: Op verzoek van de bevoegde autoriteit van een staat gaat Onze Minister over tot betekening van stukken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel12
  - number: '12.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de betekening van stukken verstaan: de uitreiking aan
      de geadresseerde in Nederland van een door een administratieve autoriteit van een lidstaat uitgevaardigd document,
      houdende een akte of beslissing inzake de heffing van een belasting die valt onder de reikwijdte van de wederzijdse
      bijstand, bedoeld in [artikel 1][ref1], alsmede renten of bestuursrechtelijke sancties of boeten die daarmee
      verband houden.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '12.3'
    text: |-
      Onze Minister stelt de bevoegde autoriteit van een lidstaat onverwijld in kennis van het aan het verzoek gegeven
      gevolg en in het bijzonder van de datum waarop de akte of het besluit de geadresseerde ter kennis is gebracht.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel12
  - number: '13'
    text: |-
      De colleges van gedeputeerde staten, de colleges van burgemeester en wethouders en de dagelijkse besturen van
      waterschappen verlenen desgevraagd hun medewerking aan de uitvoering van een verzoek om bijstand bij de heffing
      van belastingen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister verstrekt geen inlichtingen indien de verstrekking daarvan niet strekt tot uitvoering van richtlijnen
      van de Raad van de Europese Unie of van andere regelingen van internationaal en interregionaal recht tot het
      verlenen van wederzijdse bijstand bij de heffing van belastingen, alsmede renten daarover en bestuursrechtelijke
      sancties en boeten die daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: '14.2'
    text: 'Onze Minister behoeft geen inlichtingen te verstrekken indien:'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.2.a
    text: de openbare orde van de Nederlandse staat zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.2.b
    text: |-
      die inlichtingen in Nederland krachtens wettelijke bepalingen of op grond van de administratieve praktijk niet
      zouden kunnen worden verkregen voor de heffing van een in [artikel 1][ref1] bedoelde belasting, alsmede voor de
      renten daarover of bestuursrechtelijke sancties of boeten die daarmee verband houden;


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 14.2.c
    text: |-
      aannemelijk is dat de bevoegde autoriteit in de eigen staat niet eerst de gebruikelijke mogelijkheden voor het
      verkrijgen van de door haar gevraagde inlichtingen heeft benut, die zij in de gegeven situatie had kunnen benutten
      zonder het beoogde resultaat in gevaar te brengen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.2.d
    text: |-
      de bevoegde autoriteit voor wie de inlichtingen zouden zijn bestemd, niet bevoegd of in staat is Onze Minister
      soortgelijke inlichtingen te verstrekken;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.2.e
    text: daarmee een commercieel, een industrieel of een beroepsgeheim zou worden onthuld;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.2.f
    text: |-
      de verstrekking strijdig zou zijn met algemeen aanvaarde beginselen van belastingheffing of overige begrenzingen
      die voortvloeien uit de van toepassing zijnde bepalingen van internationaal en interregionaal recht.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: '14.3'
    text: |-
      In geen geval kan het tweede lid zo worden uitgelegd dat de verstrekking van inlichtingen geweigerd kan worden
      uitsluitend omdat:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.3.a
    text: |-
      de inlichtingen berusten bij een bank, een andere financiële instelling, een gevolmachtigd persoon of een persoon
      die als vertegenwoordiger of trustee optreedt, of
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: 14.3.b
    text: de inlichtingen betrekking hebben op eigendomsbelangen in een persoon.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: '14.4'
    text: |-
      Onze Minister deelt de bevoegde autoriteit van de verzoekende staat mee op welke gronden hij het verzoek om
      inlichtingen afwijst.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
  - number: '14.5'
    text: |-
      Dit artikel vindt geen toepassing ten aanzien van de inlichtingen, bedoeld in de [artikelen 6b][ref1], [6c][ref2]
      en [6d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel6c
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 6b
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 6c
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 6d
        hoofdstuk: II
        afdeling: '2'
  - number: '15'
    text: |-
      Indien Onze Minister overeenkomstig de [artikelen 5][ref1] of [7][ref2] inlichtingen verstrekt, kan hij de
      bevoegde autoriteit van de ontvangende staat om terugmelding betreffende de ontvangen inlichtingen verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel7
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
  - number: '16'
    text: |-
      Onze Minister verstrekt geen inlichtingen aan een bevoegde autoriteit indien de wetgeving van de staat van die
      autoriteit geen verplichting tot geheimhouding oplegt aan ambtenaren van de belastingadministratie van die staat
      met betrekking tot hetgeen hun wordt medegedeeld of blijkt bij de uitvoering van de belastingwetten van die staat.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel16
  - number: '17.1'
    text: |-
      Inlichtingen die Onze Minister aan de bevoegde autoriteit van een andere lidstaat verstrekt ter uitvoering van
      Richtlijn 2011/16/EU kunnen door die andere lidstaat tevens worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: 17.1.a
    text: |-
      voor de vaststelling en invordering van andere belastingen en rechten die vallen onder artikel 2 van Richtlijn
      2010/24/EU van de Raad van 16 maart 2010 betreffende de wederzijdse bijstand inzake de invordering van
      schuldvorderingen die voortvloeien uit bepaalde belastingen, rechten en andere maatregelen (PbEU 2010, L 84);
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: 17.1.b
    text: voor de vaststelling en invordering van verplichte socialezekerheidsbijdragen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: 17.1.c
    text: |-
      in mogelijk tot bestraffing leidende gerechtelijke en administratieve procedures wegens overtreding van de
      belastingwetgeving, onverminderd de algemene regels en de bepalingen betreffende de rechten van verdachten en
      getuigen in dergelijke procedures.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan de bevoegde autoriteit van een andere lidstaat toestemming verlenen de verstrekte inlichtingen
      voor andere dan de in het eerste lid bedoelde doeleinden te gebruiken. Deze toestemming wordt in ieder geval
      verleend, indien de inlichtingen in Nederland voor soortgelijke doeleinden kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: '17.3'
    text: |-
      Onze Minister kan zich binnen tien werkdagen na de datum van ontvangst van de kennisgeving van een bevoegde
      autoriteit van een lidstaat, verzetten tegen het voornemen van die bevoegde autoriteit om de ontvangen inlichtingen
      aan de bevoegde autoriteit van een derde lidstaat te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: '17.4'
    text: |-
      Toestemming voor het overeenkomstig het tweede lid gebruiken van overeenkomstig het derde lid doorgegeven
      inlichtingen kan alleen worden verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: '17.5'
    text: |-
      Onze Minister kan aan de bevoegde autoriteit van een staat toestemming verlenen de inlichtingen voor een ander
      doel te gebruiken dan voor de heffing van belastingen die onder de reikwijdte vallen van de wederzijdse bijstand,
      bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '17.6'
    text: |-
      Onze Minister kan op een daartoe strekkend verzoek een bevoegde autoriteit van een staat toestemming verlenen de
      van hem ontvangen inlichtingen aan een bevoegde autoriteit van een andere staat te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel17
  - number: '18'
    text: |-
      Indien Onze Minister een wederzijdse samenwerking aangaat met de bevoegde autoriteit van een staat die verder reikt
      dan de samenwerking die mogelijk is op grond van Richtlijn 2011/16/EU, gaat hij deze verder reikende samenwerking
      ook aan met een lidstaat die om deze samenwerking verzoekt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het meedelen van de gevraagde inlichtingen, bedoeld in [artikel 5][ref1], de ontvangstbevestiging, bedoeld in
      [artikel 5a, derde lid][ref2], het verzoek om aanvullende achtergrondinformatie, bedoeld in artikel 5a, vierde lid,
      de mededeling dat niet aan het verzoek kan of zal worden voldaan, bedoeld in artikel 5a, vijfde en zesde lid, en de
      beantwoording van een verzoek om een administratief onderzoek als bedoeld in [artikel 8, tweede lid][ref3], worden
      voor zover mogelijk langs elektronische weg en door middel van een standaardformulier, dat voldoet aan de in of
      krachtens Richtlijn 2011/16/EU gestelde voorwaarden, gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel8
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 5a
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
  - number: '19.2'
    text: |-
      De verstrekking van inlichtingen, bedoeld in [artikel 7, eerste lid][ref1], de beantwoording van het verzoek
      tot betekening, bedoeld in [artikel 12, eerste lid][ref2], en het verzoek om terugmelding, bedoeld in
      [artikel 15, eerste lid][ref3], worden door middel van een standaardformulier, dat voldoet aan de in of krachtens
      Richtlijn 2011/16/EU gestelde voorwaarden, en voor zover mogelijk langs elektronische weg gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel15
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '12'
        hoofdstuk: II
        afdeling: 4b
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '15'
        hoofdstuk: II
        afdeling: '6'
  - number: '19.3'
    text: |-
      De automatische inlichtingenuitwisseling, bedoeld in de [artikelen 6b][ref1], [6c][ref2] en [6d][ref3], wordt door
      middel van een standaardformulier, dat voldoet aan de in of krachtens Richtlijn 2011/16/EU gestelde voorwaarden, en
      voor zover mogelijk langs elektronische weg gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel6c
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel6d
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 6b
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 6c
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 6d
        hoofdstuk: II
        afdeling: '2'
  - number: '19.4'
    text: |-
      Het standaardformulier, bedoeld in het eerste tot en met derde lid, kan vergezeld gaan van verslagen, verklaringen
      en andere bescheiden, of van voor eensluidend gewaarmerkte afschriften of uittreksels daarvan.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister ziet af van iedere eis tot terugbetaling van kosten die uit de uitvoering van Richtlijn 2011/16/EU
      voortvloeien, behalve in voorkomend geval van de kosten van aan deskundigen betaalde vergoedingen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister en de verzoekende autoriteit van een staat kunnen afspraken maken over de vergoeding van kosten die
      samenhangen met het verlenen van wederzijdse bijstand bij de heffing van belastingen die vallen onder de reikwijdte
      van de wederzijdse bijstand, bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '21.1'
    text: |-
      Een verzoek om wederzijdse bijstand, waaronder een verzoek tot betekening als bedoeld in
      [artikel 12, eerste lid][ref1], en de bijgevoegde bescheiden kunnen in elke door Onze Minister en de bevoegde
      autoriteit van de verzoekende staat overeengekomen taal zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel12
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '12'
        hoofdstuk: II
        afdeling: 4b
  - number: '21.2'
    text: |-
      Onze Minister kan in bijzondere gevallen een met redenen omkleed verzoek doen aan de bevoegde autoriteit van de
      verzoekende staat om diens verzoek om bijstand vergezeld te laten gaan van een vertaling in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel21
  - number: '22'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister kan een verzoek om inlichtingen doen aan de bevoegde autoriteit van een andere staat wanneer de
      gevraagde inlichtingen naar verwachting van belang zijn voor de heffing van belastingen die vallen onder de
      reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '23.2'
    text: |-
      Het in het eerste lid bedoelde verzoek kan een met redenen omkleed verzoek om een bepaald administratief onderzoek
      omvatten.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister kan de bevoegde autoriteit van de aangezochte staat verzoeken om originele stukken toegezonden te
      krijgen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel23
  - number: '23.4'
    text: |-
      Onze Minister kan met de bevoegde autoriteit van de aangezochte staat termijnen overeenkomen waarbinnen de
      gevraagde inlichtingen verstrekt worden.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel23
  - number: '24.1'
    text: |-
      In de gevallen waarin dat naar verwachting van belang is voor de heffing van belastingen die vallen onder de
      reikwijdte van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], kan Onze Minister zich, behalve uit eigen
      beweging, ook op verzoek van een college van gedeputeerde staten, een college van burgemeester en wethouders of
      een dagelijks bestuur van een waterschap tot de bevoegde autoriteit van een andere staat wenden met een verzoek om
      bijstand bij de heffing van belastingen of met een verzoek tot een administratief onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '24.2'
    text: |-
      Een college van gedeputeerde staten, een college van burgemeester en wethouders en een dagelijks bestuur van een
      waterschap verstrekken alle inlichtingen die voor het doen van een verzoek om bijstand nuttig kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel24
  - number: '24.3'
    text: |-
      Wanneer een verzoek om bijstand bij de heffing van belastingen is gedaan op verzoek van een college van
      gedeputeerde staten, een college van burgemeester en wethouders of een dagelijks bestuur van een waterschap,
      wordt dit college of dit bestuur onverwijld op de hoogte gesteld van de vragen en mededelingen van de aangezochte
      autoriteit van de staat waaraan het verzoek was gericht met betrekking tot de uitvoering van het verzoek om
      bijstand.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel24
  - number: '25'
    text: |-
      Ingeval een richtlijn of een andere regeling van internationaal of interregionaal recht voorziet in het automatisch
      verstrekken van inlichtingen kan Onze Minister aan de bevoegde autoriteit van een staat meedelen dat hij geen
      automatische inlichtingen inzake bepaalde inkomsten- en vermogenscategorieën of inzake inkomsten en vermogens onder
      een minimumbedrag wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel25
  - number: '26.1'
    text: |-
      De ontvangst van spontaan verkregen inlichtingen wordt door Onze Minister onmiddellijk, doch in elk geval binnen
      zeven werkdagen na ontvangst aan de bevoegde autoriteit van de verstrekkende lidstaat bevestigd.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel26
  - number: '26.2'
    text: |-
      De ontvangst van inlichtingen over voorafgaande grensoverschrijdende rulings of voorafgaande verrekenprijsafspraken
      als bedoeld in Richtlijn 2011/16/EU wordt door Onze Minister onmiddellijk, doch in elk geval binnen zeven werkdagen
      na ontvangst, aan de bevoegde autoriteit van de verstrekkende lidstaat bevestigd indien deze bevoegde autoriteit
      heeft aangegeven dat deze inlichtingen naar alle waarschijnlijkheid van belang zullen zijn voor Nederland.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel26
  - number: '27.1'
    text: |-
      Onze Minister en de bevoegde autoriteit van een aangezochte staat kunnen overeenkomen dat, ter uitwisseling
      van inlichtingen in het kader van de in [artikel 1][ref1] bedoelde wederzijdse bijstand, ambtenaren van de
      rijksbelastingdienst, dan wel andere ambtenaren die belast zijn met de heffing van belastingen, onder de door de
      bevoegde autoriteit van de aangezochte staat gestelde voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 27.1.a
    text: aanwezig kunnen zijn in de kantoren waar de ambtenaren van de aangezochte staat hun taken vervullen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel27
  - number: 27.1.b
    text: |-
      aanwezig kunnen zijn bij een administratief onderzoek dat wordt uitgevoerd op het grondgebied van de aangezochte
      staat.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel27
  - number: '27.2'
    text: |-
      Voor zover het in de aangezochte staat wettelijk is toegestaan, kunnen in het kader van de overeenkomst, bedoeld
      in het eerste lid, de bij een administratief onderzoek aanwezige ambtenaren van de rijksbelastingdienst, dan wel
      andere ambtenaren die belast zijn met de heffing van belastingen, personen ondervragen en bescheiden onderzoeken.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel27
  - number: '27.3'
    text: |-
      Ambtenaren van de rijksbelastingdienst, dan wel andere ambtenaren die belast zijn met de heffing van belastingen,
      die overeenkomstig het eerste lid in de aangezochte staat aanwezig zijn, dienen te allen tijde een schriftelijke
      opdracht te kunnen overleggen waaruit hun identiteit en hun officiële hoedanigheid blijkt.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel27
  - number: '28'
    text: |-
      Op inlichtingen die door Onze Minister in het kader van wederzijdse bijstand van een bevoegde autoriteit
      van een andere staat zijn verkregen, alsmede op inlichtingen die op grond van de [artikelen 8][ref1],
      [10b][ref2] en [10c][ref3] zijn verkregen, is de verplichting tot geheimhouding, bedoeld in
      [artikel 67 van de Algemene wet inzake rijksbelastingen][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel10c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 10b
        hoofdstuk: II
        afdeling: 4a
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 10c
        hoofdstuk: II
        afdeling: 4a
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '67'
  - number: '29.1'
    text: |-
      Indien de bevoegde autoriteit van de staat die de inlichtingen heeft verstrekt hierom verzoekt, doet Onze Minister
      met inachtneming van [artikel 67 van de Algemene wet inzake rijksbelastingen][ref1], zo snel mogelijk, doch
      uiterlijk drie maanden nadat het resultaat van het gebruik van gevraagde of spontaan verkregen inlichtingen bekend
      is, een terugmelding naar de bevoegde autoriteit van de staat die de inlichtingen heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '67'
  - number: '29.2'
    text: |-
      Onze Minister doet eenmaal per jaar, overeenkomstig bilateraal overeengekomen praktische afspraken, een
      terugmelding over de automatische uitwisseling van inlichtingen naar de betrokken lidstaten.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel29
  - number: '30.1'
    text: |-
      Tenzij een bevoegde autoriteit van een andere staat anders bepaalt, kunnen de door haar aan Onze Minister
      verstrekte inlichtingen uitsluitend worden gebruikt voor de heffing van belastingen die vallen onder de reikwijdte
      van de wederzijdse bijstand, bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '30.2'
    text: |-
      Onze Minister kan aan een bevoegde autoriteit van een staat toestemming vragen de inlichtingen voor een ander
      doel te gebruiken dan voor de heffing van belastingen die vallen onder de reikwijdte van de wederzijdse bijstand,
      bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '30.3'
    text: |-
      Inlichtingen die aan Onze Minister zijn verstrekt ter uitvoering van Richtlijn 2011/16/EU mogen behalve voor de in
      [artikel 1][ref1] bedoelde doeleinden ook worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 30.3.a
    text: |-
      voor de vaststelling en invordering van andere belastingen en rechten die vallen onder artikel 2 van Richtlijn
      2010/24/EU van de Raad van 16 maart 2010 betreffende de wederzijdse bijstand inzake de invordering van
      schuldvorderingen die voortvloeien uit bepaalde belastingen, rechten en andere maatregelen (PbEU 2010, L 84);
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: 30.3.b
    text: voor de vaststelling en invordering van verplichte socialezekerheidsbijdragen;
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: 30.3.c
    text: |-
      in mogelijk tot bestraffing leidende gerechtelijke en administratieve procedures wegens overtreding van de
      belastingwetgeving, onverminderd de algemene regels en de bepalingen betreffende de rechten van de verdachten en
      getuigen in dergelijke procedures.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: '30.4'
    text: |-
      Indien Onze Minister van oordeel is dat de van de bevoegde autoriteit van een andere lidstaat ter uitvoering van
      Richtlijn 2011/16/EU verkregen inlichtingen voor de bevoegde autoriteit van een derde lidstaat van nut kunnen
      zijn voor de in het eerste of derde lid bedoelde doeleinden, mag hij de inlichtingen, met inachtneming van het
      vijfde lid, aan deze derde lidstaat doorgeven, op voorwaarde dat dit in overeenstemming is met de vastgelegde
      voorschriften en procedures zoals opgenomen in Richtlijn 2011/16/EU.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: '30.5'
    text: |-
      Onze Minister stelt de bevoegde autoriteit van de lidstaat die de inlichtingen heeft verstrekt in kennis van zijn
      voornemen om die inlichtingen aan de bevoegde autoriteit van een derde lidstaat te verstrekken. Onze Minister
      verstrekt de inlichtingen niet aan de bevoegde autoriteit van een derde lidstaat, indien de bevoegde autoriteit
      van de lidstaat die de inlichtingen heeft verstrekt zich hiertegen verzet binnen tien werkdagen na de datum van
      ontvangst van de kennisgeving van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: '30.6'
    text: |-
      Inlichtingen, verslagen, verklaringen en andere bescheiden, alsook voor eensluidend gewaarmerkte afschriften of
      uittreksels daarvan, die zijn verkregen ter uitvoering van Richtlijn 2011/16/EU kunnen in Nederland op dezelfde
      voet als bewijs worden aangevoerd als soortgelijke inlichtingen, verslagen, verklaringen en andere bescheiden,
      alsook voor eensluidend gewaarmerkte afschriften of uittreksels daarvan, die zijn verkregen in Nederland zelf.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel30
  - number: '31.1'
    text: |-
      Indien Onze Minister van een staat inlichtingen ontvangt die naar verwachting van belang zijn voor de administratie
      en de handhaving van de Nederlandse wetgeving betreffende de heffing van belastingen die vallen onder de reikwijdte
      van de wederzijdse bijstand, bedoeld in [artikel 1][ref1], kan hij deze inlichtingen verstrekken aan de bevoegde
      autoriteiten van de lidstaten voor wie die inlichtingen van nut kunnen zijn, en aan elke verzoekende autoriteit van
      een lidstaat, mits dat krachtens een overeenkomst met de staat waar de inlichtingen vandaan komen, is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '31.2'
    text: |-
      Onze Minister kan, met inachtneming van [artikel 67 van de Algemene wet inzake rijksbelastingen][ref1], ter
      uitvoering van Richtlijn 2011/16/EU ontvangen inlichtingen doorgeven aan een staat, op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '67'
  - number: 31.2.a
    text: de bevoegde autoriteit van de lidstaat waarvan de inlichtingen afkomstig zijn, daarin heeft toegestemd, en
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel31
  - number: 31.2.b
    text: |-
      die staat zich ertoe heeft verbonden de medewerking te verlenen die nodig is om bewijsmateriaal bijeen te brengen
      omtrent het ongeoorloofde of onwettige karakter van verrichtingen die in strijd blijken te zijn met of een misbruik
      blijken te vormen van de belastingwetgeving.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel31
  - number: '32.1'
    text: |-
      Een verzoek om inlichtingen als bedoeld in [artikel 23, eerste lid][ref1], en een verzoek om een administratief
      onderzoek als bedoeld in artikel 23, tweede lid, worden voor zover mogelijk gedaan met gebruikmaking van
      een standaardformulier dat voldoet aan de in of krachtens Richtlijn 2011/16/EU gestelde voorwaarden en langs
      elektronische weg.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel23
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '23'
        hoofdstuk: III
        afdeling: '1'
  - number: '32.2'
    text: |-
      De ontvangstbevestiging van spontaan verkregen inlichtingen, bedoeld in [artikel 26][ref1], en de terugmelding,
      bedoeld in [artikel 28][ref2], wordt met gebruikmaking van een standaardformulier dat voldoet aan de in of
      krachtens Richtlijn 2011/16/EU gestelde voorwaarden gedaan. Het formulier wordt voor zover mogelijk langs
      elektronische weg verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel28
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '26'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '28'
        hoofdstuk: III
        afdeling: '4'
  - number: '33.1'
    text: |-
      Een verzoek om inlichtingen als bedoeld in [artikel 23][ref1] en de bijgevoegde bescheiden kunnen in elke door Onze
      Minister en de bevoegde autoriteit van de aangezochte staat overeengekomen taal zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel23
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '23'
        hoofdstuk: III
        afdeling: '1'
  - number: '33.2'
    text: |-
      Onze Minister laat in bijzondere gevallen, op een met redenen omkleed verzoek van de bevoegde autoriteit van de
      aangezochte staat, het in het eerste lid bedoelde verzoek vergezeld gaan van een vertaling in de officiële taal of
      één van de officiële talen van de aangezochte staat.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel33
  - number: '34'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel34
  - number: 34a.1
    text: |-
      De [artikelen 2, eerste lid, onderdelen e en g][ref1], [4a tot en met 4k][ref2], [4m tot en met 4p][ref3],
      [6a][ref4] en [14, vijfde lid][ref5], en de daarop gebaseerde bepalingen, zoals deze op 31 december 2015 luidden,
      zijn van overeenkomstige toepassing ter zake van rentebetalingen die vóór 1 januari 2016 hebben plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel4m
      [ref4]: https://wetten.overheid.nl/BWBR0003954#Artikel6a
      [ref5]: https://wetten.overheid.nl/BWBR0003954#Artikel14
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 4m
        hoofdstuk: IA
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003954
        artikel: 6a
        hoofdstuk: II
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0003954
        artikel: '14'
        hoofdstuk: II
        afdeling: '6'
  - number: 34a.2
    text: |-
      De [artikelen 2, eerste lid, onderdeel e][ref1], [4l][ref2] en [4n][ref3], zoals deze op 31 december 2015 luidden,
      zijn van overeenkomstige toepassing op een verzoek als bedoeld in artikel 4l in verband met rentebetalingen die
      zijn gedaan na 31 december 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel4l
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel4n
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 4l
        hoofdstuk: IA
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: 4n
        hoofdstuk: IA
        paragraaf: '3'
        afdeling: '2'
  - number: '35'
    text: |-
      Verwijzingen naar Richtlijn 77/799/EEG van de Raad van 19 december 1977 betreffende de wederzijdse bijstand van
      de bevoegde autoriteiten van de Lid-Staten op het gebied van de directe belastingen (PbEG 1977, L 336) gelden als
      verwijzing naar Richtlijn 2011/16/EU.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel35
  - number: '36.1'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel36
  - number: '36.2'
    text: 'Deze wet kan worden aangehaald als: Wet op de internationale bijstandsverlening bij de heffing van belastingen.'
    url: https://wetten.overheid.nl/BWBR0003954/2017-01-01#Artikel36
