preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verplichtingen ten behoeve van de belastingheffing
    beter af te stemmen op verplichtingen van internationaal en interregionaal recht op het gebied van het verlenen
    van bijstand door Nederland aan andere staten bij de heffing van belastingen teneinde te bevorderen dat
    belastingschulden op het juiste bedrag kunnen worden vastgesteld en dat het ontgaan en ontwijken van belastingen
    wordt bestreden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De bepalingen van deze wet strekken ten behoeve van de nakoming van verplichtingen die voortvloeien uit richtlijnen
      van de Raad van de Europese Gemeenschappen en uit andere regelingen van internationaal en interregionaal recht tot
      het verlenen van wederzijdse bijstand bij de heffing van belastingen naar het inkomen, de winst en het vermogen, de
      heffing van belastingen van nalatenschappen en verkrijgingen krachtens erfrecht en schenkingen, alsmede de heffing
      van omzetbelasting en van accijns en de heffing op verzekeringspremies.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is niet van toepassing op de samenwerking in het kader van artikel 19, zesde lid, van [richtlijn nr.
      92/12/EEG](31992L0012) van de Raad van de Europese Gemeenschappen van 25 februari 1992 betreffende de algemene
      regeling voor accijnsprodukten, het voorhanden hebben en het verkeer daarvan en de controles daarop (*PbEG* L76).
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel1
  - number: '1.3'
    text: |-
      Deze wet is niet van toepassing bij het verlenen van wederzijdse bijstand op het gebied van de omzetbelasting in
      het kader van [verordening (EG) nr. 1798/2003](32003R1798) van de Raad van de Europese Unie van 7 oktober 2003
      betreffende de administratieve samenwerking op het gebied van de belasting over de toegevoegde waarde en tot
      intrekking van [verordening (EEG) nr. 218/92](31992R0218) (PbEU L 264). Bij toepassing van die verordening zijn de
      [artikelen 8, tweede lid][ref1], en [11][ref2] van deze wet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel11
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '11'
        hoofdstuk: II
        afdeling: '4'
  - number: '2'
    text: 'Deze wet en de daarop berustende bepalingen verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
  - number: 2.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
  - number: 2.b
    text: 'lidstaat: lidstaat van de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
  - number: 2.c
    text: |-
      staat: een lidstaat, een Mogendheid of een bestuurlijke eenheid waarmee in de relatie met Nederland een wederkerige
      regeling bestaat die voorziet in wederzijdse bijstand bij de heffing van de in [artikel 1][ref1] bedoelde
      belastingen, alsmede de Nederlandse Antillen en Aruba;


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 2.d
    text: |-
      bevoegde functionaris: de functionaris van de rijksbelastingdienst die als zodanig bij ministeriële regeling is
      aangewezen;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
  - number: 2.e
    text: 'bevoegde autoriteit: de door een staat tot het uitwisselen van inlichtingen aangewezen persoon of instantie.'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Als belastingen naar het inkomen, de winst en het vermogen als bedoeld in [artikel 1][ref1] worden, ongeacht de
      wijze waarop de belasting wordt geheven, beschouwd alle belastingen die worden geheven naar het gehele inkomen,
      naar de gehele winst, naar het gehele vermogen of naar bestanddelen van het inkomen, van de winst of van het
      vermogen, daaronder begrepen belastingen naar voordelen verkregen uit de vervreemding van roerende of onroerende
      zaken en belastingen geheven naar loonsommen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '4'
    text: 'Met betrekking tot de in Nederland geheven belastingen vindt deze wet toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.a
    text: de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.b
    text: de loonbelasting;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.c
    text: de vennootschapsbelasting;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.d
    text: de dividendbelasting;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.e
    text: de rechten van successie, van overgang en van schenking;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.f
    text: de assurantiebelasting;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
  - number: 4.g
    text: |-
      de omzetbelasting, voor zover deze wordt geheven met toepassing van de bepalingen van de [Algemene wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 4.h
    text: |-
      de accijns, voor zover deze wordt geheven met toepassing van de bepalingen van de [Algemene wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 4.i
    text: |-
      alle soortgelijke rijksbelastingen, voor zover deze worden geheven met toepassing van de bepalingen van de
      [Algemene wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 4a.1
    text: 'Voor de toepassing van deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.1.a
    text: |-
      rentebetaling: rente, uitbetaald of bijgeschreven op een rekening, die is terug te voeren op enigerlei
      schuldvordering, al dan niet gedekt door hypotheek of voorzien van een winstdelingsclausule, en met name de
      opbrengsten van overheidspapier en obligatieleningen, inclusief daaraan gehechte premies en prijzen; boete voor te
      late betaling wordt niet als rentebetaling aangemerkt;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.1.b
    text: |-
      uiteindelijk gerechtigde: elke natuurlijke persoon die een rentebetaling ontvangt, of ten gunste van wie een
      rentebetaling wordt bewerkstelligd;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.1.c
    text: |-
      marktdeelnemer: ieder lichaam als bedoeld in
      [artikel 2, eerste lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref1] dat rentebetalingen
      verricht of iedere natuurlijke persoon die in het kader van de uitoefening van zijn onderneming of beroep
      rentebetalingen verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 4a.1.d
    text: |-
      uitbetalende instantie: de marktdeelnemer die rente uitbetaalt of een rentebetaling bewerkstelligt ten
      onmiddellijke gunste van de uiteindelijk gerechtigde, ongeacht of deze marktdeelnemer de debiteur is van de
      rentedragende schuldvordering dan wel de marktdeelnemer die door de debiteur of de uiteindelijk gerechtigde is
      belast met het uitbetalen van de rente of het bewerkstelligen van de rentebetaling;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.1.e
    text: |-
      icbe: een instelling voor collectieve belegging in effecten waaraan een vergunning is verleend overeenkomstig de
      algemene vereisten van [richtlijn nr. 85/611/EEG](31985L0611) van de Raad van de Europese Gemeenschappen van 20
      december 1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen
      voor collectieve belegging in effecten (Pb EG L 375).
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.2
    text: |-
      Waar een uiteindelijke gerechtigde woont, of waar een marktdeelnemer of een uitbetalende instantie woont of is
      gevestigd, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Voor de toepassing van deze afdeling of bepalingen daarvan kunnen bij ministeriële regeling staten, bedoeld in
      artikel 17, tweede lid, onderdeel i, van de [richtlijn nr. 2003/48/EG](32003L0048) van de Raad van de Europese
      Unie van 3 juni 2003 betreffende belastingheffing op inkomsten uit spaargelden in de vorm van rentebetaling (Pb
      EU L 157), en afhankelijke en geassocieerde gebieden, bedoeld in artikel 17, tweede lid, onderdeel ii, van die
      richtlijn, worden gelijkgesteld met een lidstaat.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4a
  - number: 4b.1
    text: 'Voor de toepassing van deze afdeling wordt onder rentebetaling mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.1.a
    text: |-
      de rente die is aangegroeid of gekapitaliseerd op het moment van de verkoop, de terugbetaling of de aflossing van
      de schuldvordering;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.1.b
    text: |-
      inkomsten uit rentebetalingen als bedoeld in [artikel 4a, eerste lid, onderdeel a][ref1], en dit lid, onderdeel
      a, indien deze rechtstreeks of via een uitbetalende instantie als bedoeld in [artikel 4d][ref2], worden uitgekeerd
      door een collectieve beleggingsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel4d
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: 4d
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4b.1.c
    text: |-
      inkomsten die zijn gerealiseerd bij de verkoop, terugbetaling of aflossing van aandelen of bewijzen van deelneming
      in een collectieve beleggingsinstelling, indien een dergelijke instelling rechtstreeks of via een andere dergelijke
      instelling meer dan 15% van zijn vermogen belegt in schuldvorderingen.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.2
    text: 'Voor de toepassing van dit artikel wordt onder collectieve beleggingsinstelling verstaan:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.2.a
    text: een icbe;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.2.b
    text: |-
      een entiteit die gebruik mag maken van de keuzemogelijkheid van [artikel 4e][ref1], of een overeenkomstige
      keuzemogelijkheid in de lidstaat van vestiging;


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4e
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4e
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4b.2.c
    text: |-
      een instelling voor collectieve belegging die is gevestigd buiten het grondgebied waarop artikel 299 van het
      Verdrag tot oprichting van de Europese Gemeenschap van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.3
    text: |-
      De inkomsten, bedoeld in het eerste lid, onderdeel c, worden slechts als rentebetaling aangemerkt
      voorzover deze rechtstreeks of middellijk afkomstig zijn van rentebetalingen als bedoeld in
      [artikel 4a, eerste lid, onderdeel a][ref1], en dit artikel, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4b.4
    text: |-
      Indien een uitbetalende instantie met het oog op de toepassing van het eerste lid, onderdelen b en c, geen
      informatie heeft over het deel van de inkomsten dat voortkomt uit rentebetalingen, bedoeld in die onderdelen, wordt
      het volledige bedrag aan inkomsten als rentebetaling aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.5
    text: |-
      De inkomsten, bedoeld in het eerste lid, onderdeel b, worden, indien deze afkomstig zijn van een in Nederland
      gevestigde collectieve beleggingsinstelling niet als rentebetaling aangemerkt indien blijkt dat de beleggingen
      in schuldvorderingen rechtstreeks of via een andere dergelijke instelling of entiteit niet meer dan 15% van het
      vermogen van de desbetreffende instelling of entiteit uitmaken.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.6
    text: |-
      De percentages, bedoeld in het eerste lid, onderdeel c en het vijfde lid, worden bepaald aan de hand van de
      beleggingspolitiek zoals die in het fondsreglement of de statuten van de betrokken collectieve beleggings-
      instelling is neergelegd, en bij het ontbreken daarvan op basis van de feitelijke samenstelling van de
      beleggingsportefeuille van de instelling.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.7
    text: |-
      Indien een uitbetalende instantie met het oog op de toepassing van het eerste lid, onderdeel c, geen informatie
      heeft over het percentage van het vermogen dat is belegd in schuldvorderingen, wordt dat percentage geacht meer dan
      15% te bedragen.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4b.8
    text: |-
      Indien een uitbetalende instantie met het oog op de toepassing van het eerste lid, onderdeel c, het bedrag van de
      door de uiteindelijk gerechtigde gerealiseerde inkomsten niet kan bepalen, worden die inkomsten geacht de opbrengst
      van de verkoop, aflossing of terugbetaling van de aandelen of bewijzen van deelneming te zijn.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4b
  - number: 4c.1
    text: |-
      Binnenlandse en internationale obligaties en andere verhandelbare schuldinstrumenten die voor het eerst zijn
      uitgegeven vóór 1 maart 2001 of waarvan het oorspronkelijke emissieprospectus vóór die datum is goedgekeurd door
      de bevoegde autoriteiten in de zin van de [richtlijn nr. 80/390/EEG](31980L0390) van de Raad van de Europese
      Gemeenschappen van 17 april 1980 tot coördinatie van de eisen gesteld aan de opstelling van, het toezicht op en
      de verspreiding van het prospectus dat gepubliceerd moet worden voor de toelating van effecten tot de officiële
      notering aan een effectenbeurs (Pb EG L 100) of door de verantwoordelijke autoriteiten in landen buiten de Europese
      Unie, worden niet aangemerkt als schuldvorderingen.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4c
  - number: 4c.2
    text: |-
      Het eerste lid is niet van toepassing indien op of na 1 maart 2002 een aanvullende emissie plaatsvindt of heeft
      plaatsgevonden van de daar bedoelde verhandelbare schuldinstrumenten.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4c
  - number: 4c.3
    text: |-
      Indien op of na 1 maart 2002 een vervolgemissie plaatsvindt van een verhandelbaar schuldinstrument als bedoeld
      in het eerste lid, dat is uitgegeven door een overheid of een gelijkgestelde entiteit die als overheidsinstantie
      optreedt of waarvan de rol is erkend bij een internationaal verdrag als bedoeld in de bijlage bij de [richtlijn nr.
      2003/48/EG](32003L0048) van de Raad van de Europese Unie van 3 juni 2003 betreffende belastingheffing op inkomsten
      uit spaargelden in de vorm van rentebetaling (Pb EG L 157), wordt de gehele emissie van dit schuldinstrument,
      bestaande uit de oorspronkelijke emissie en vervolgemissies, aangemerkt als een schuldvordering.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4c
  - number: 4c.4
    text: |-
      Indien op of na 1 maart 2002 een vervolgemissie plaatsvindt van een verhandelbaar schuldinstrument als bedoeld in
      het eerste lid, dat is uitgegeven door een emittent die niet valt onder het bepaalde in het derde lid, wordt deze
      nieuwe emissie aangemerkt als een schuldvordering.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4c
  - number: 4d.1
    text: |-
      Voor de toepassing van deze afdeling wordt een in een lidstaat gevestigde entiteit waaraan rente wordt uitbetaald
      of ten aanzien van wie een rentebetaling wordt bewerkstelligd ten gunste van de uiteindelijk gerechtigde op
      het moment van het verrichten of het bewerkstelligen van die rentebetaling eveneens als uitbetalende instantie
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4d
  - number: 4d.2
    text: |-
      Het eerste lid is niet van toepassing indien de marktdeelnemer op basis van een door de in het eerste lid bedoelde
      entiteit overgelegd officieel bewijskrachtig document redenen heeft om aan te nemen dat deze entiteit:
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4d
  - number: 4d.2.a
    text: |-
      een rechtspersoon is, niet zijnde een rechtspersoon als bedoeld in artikel 4, lid 5, van de [richtlijn nr. 2003/48/
      EG](32003L0048) van de Raad van de Europese Unie van 3 juni 2003 betreffende belastingheffing op inkomsten uit
      spaargelden in de vorm van rentebetaling (Pb EG L 157), of
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4d
  - number: 4d.2.b
    text: een entiteit is waarvan de winst wordt belast volgens de algemene belastingregels voor ondernemingen, of
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4d
  - number: 4d.2.c
    text: een icbe is.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4d
  - number: 4e.1
    text: |-
      De entiteit die op grond van [artikel 4d][ref1] als uitbetalende instantie wordt aangemerkt, wordt, indien deze
      daarvoor kiest, voor de toepassing van deze afdeling mede als icbe aangemerkt. Een in Nederland gevestigde entiteit
      maakt de keuze, bedoeld in de eerste volzin, kenbaar aan de bevoegde functionaris. De bevoegde functionaris
      bevestigt bij beschikking indien is voldaan aan de voorwaarden voor de keuze.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4d
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4d
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4e.2
    text: Omtrent de keuzemogelijkheid in het eerste lid kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4e
  - number: 4e.3
    text: |-
      De entiteit die de in het eerste lid bedoelde keuze heeft gemaakt, overhandigt aan de marktdeelnemer een afschrift
      van de door de bevoegde functionaris afgegeven beschikking.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4e
  - number: 4f.1
    text: |-
      Een natuurlijk persoon wordt niet aangemerkt als uiteindelijk gerechtigde indien hij aantoont dat de rentebetaling
      niet te zijner gunste is ontvangen of is bewerkstelligd, maar dat hij:
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
  - number: 4f.1.a
    text: |-
      handelt als een uitbetalende instantie als bedoeld in [artikel 4a, eerste lid, onderdeel d][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4a
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4a
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4f.1.b
    text: handelt namens een rechtspersoon, of
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
  - number: 4f.1.c
    text: |-
      handelt namens een entiteit waarvan de winst wordt belast volgens de algemene belastingregels voor ondernemingen,
      of
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
  - number: 4f.1.d
    text: handelt namens een icbe, of
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
  - number: 4f.1.e
    text: |-
      handelt namens een uitbetalende instantie als bedoeld in [artikel 4d][ref1] en hij aan de marktdeelnemer die de
      rentebetaling verricht de naam en het adres van deze uitbetalende instantie bekendmaakt, of


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4d
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4d
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4f.1.f
    text: |-
      handelt namens een andere natuurlijke persoon die de uiteindelijk gerechtigde is, en hij aan de uitbetalende
      instantie met inachtneming van [artikel 4g][ref1] de identiteit van die uiteindelijk gerechtigde bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4g
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4g
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4f.2
    text: |-
      Het eerste lid, onderdeel e, is slechts van toepassing indien blijkt dat de daar bedoelde marktdeelnemer de hem
      bekendgemaakte informatie op zijn beurt doorgeeft aan de bevoegde autoriteit van de lidstaat waar hij woont of
      is gevestigd.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
  - number: 4f.3
    text: |-
      De uitbetalende instantie is gehouden redelijke maatregelen te nemen om met inachtneming van [artikel 4g][ref1] de
      identiteit van de uiteindelijk gerechtigde vast te stellen indien zij beschikt over gegevens die doen vermoeden dat
      de natuurlijke persoon die een rentebetaling ontvangt of ten gunste van wie een rentebetaling wordt bewerkstelligd,
      niet de uiteindelijk gerechtigde is, en die persoon niet valt onder het eerste lid, onderdelen a, b, c, d of e.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4g
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: 4g
        hoofdstuk: IA
        paragraaf: '1'
        afdeling: '2'
  - number: 4g.1
    text: |-
      Voor contractuele betrekkingen die zijn aangegaan vóór 1 januari 2004, stelt de in Nederland wonende of gevestigde
      uitbetalende instantie de identiteit vast van de in een andere lidstaat wonende uiteindelijk gerechtigde, bestaande
      uit diens naam en adres, aan de hand van de informatie waarover zij beschikt, met name ter uitvoering van de in
      Nederland geldende wettelijke voorschriften waaronder de [Wet identificatie bij dienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006330
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4g
    references:
      - id: ref1
        bwb_id: BWBR0006330
  - number: 4g.2
    text: |-
      Voor contractuele betrekkingen die zijn of worden aangegaan op of na 1 januari 2004 of voor transacties die bij het
      ontbreken van contractuele betrekkingen zijn of worden verricht op of na die datum, bepaalt de in Nederland wonende
      of gevestigde uitbetalende instantie met inachtneming van het bepaalde in het volgende lid de identiteit van de
      in een andere lidstaat wonende uiteindelijk gerechtigde, bestaande uit diens naam, adres, en, indien dat bestaat,
      diens door de fiscale woonstaat toegekend fiscaal identificatienummer.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4g
  - number: 4g.3
    text: |-
      De identiteit, bedoeld in het tweede lid, wordt bepaald op basis van het paspoort of de officiële identiteitskaart
      van de uiteindelijk gerechtigde. Indien het adres niet is vermeld in het paspoort of in de officiële
      identiteitskaart, wordt het adres bepaald op basis van enig ander bewijskrachtig document dat door de uiteindelijk
      gerechtigde wordt overgelegd. Indien het fiscaal identificatienummer niet is vermeld in het paspoort, in de
      officiële identiteitskaart of in enig ander bewijskrachtig document dat door de uiteindelijk gerechtigde wordt
      overgelegd, wordt diens naam en adres aangevuld met de vermelding van diens geboorteplaats en geboortedatum zoals
      vermeld in het paspoort of de officiële identiteitskaart.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4g
  - number: 4h.1
    text: |-
      Voor contractuele betrekkingen die zijn aangegaan vóór 1 januari 2004, stelt de in Nederland wonende of gevestigde
      uitbetalende instantie de woonplaats van de in een andere lidstaat wonende uiteindelijk gerechtigde vast aan de
      hand van de informatie waarover zij beschikt, met name ter uitvoering van de in Nederland geldende wettelijke
      voorschriften waaronder de [Wet identificatie bij dienstverlening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006330
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4h
    references:
      - id: ref1
        bwb_id: BWBR0006330
  - number: 4h.2
    text: |-
      Voor contractuele betrekkingen die zijn of worden aangegaan op of na 1 januari 2004 of voor transacties die bij het
      ontbreken van contractuele betrekkingen zijn of worden verricht op of na die datum, stelt de in Nederland wonende
      of gevestigde uitbetalende instantie de woonplaats van de in een andere lidstaat wonende uiteindelijk gerechtigde
      vast op basis van het adres dat vermeld staat in het paspoort of op de officiële identiteitskaart of, zo nodig,
      op basis van enig ander door de uiteindelijk gerechtigde overgelegd bewijskrachtig document, volgens de procedure,
      bedoeld in het volgende lid.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4h
  - number: 4h.3
    text: |-
      Van de natuurlijke persoon die een door een lidstaat uitgereikt paspoort of officiële identiteitskaart overlegt
      en die verklaart ingezetene te zijn van een land buiten de Europese Unie, wordt de woonplaats vastgesteld op basis
      van een fiscale woonplaatsverklaring die is afgegeven door de bevoegde autoriteit van het land buiten de Europese
      Unie waarvan de natuurlijke persoon verklaart ingezetene te zijn. Wordt een verklaring niet overgelegd, dan wordt
      de natuurlijke persoon geacht zijn woonplaats te hebben in de lidstaat die het paspoort of enig ander officieel
      identiteitskaart heeft uitgereikt.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4h
  - number: 4h.4
    text: |-
      Behoudens het bepaalde in de vorige leden wordt als woonplaats aangemerkt de plaats waar de uiteindelijk
      gerechtigde zijn vaste adres heeft.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4h
  - number: 4h.5
    text: |-
      Voor de toepassing van het derde lid wordt onder bevoegde autoriteit verstaan: de bevoegde autoriteit voor de
      toepassing van bilaterale of multilaterale belastingverdragen of, bij ontstentenis daarvan, een autoriteit die
      bevoegd is om een fiscale woonplaatsverklaring af te geven.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4h
  - number: 4i
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4i
  - number: 4j
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4j
  - number: 4k
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4k
  - number: 4l
    text: |-
      Op verzoek van de uiteindelijke gerechtigde verstrekt de bevoegde functionaris binnen twee maanden na een verzoek
      als bedoeld in artikel 13 van de [richtlijn nr. 2003/48/EG](32003L0048) van de Raad van de Europese Unie van 3 juni
      2003 betreffende belastingheffing op inkomsten uit spaargelden in de vorm van rentebetaling (Pb EG L 157) bij
      beschikking een verklaring met daarin de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4l
  - number: 4l.a
    text: naam, adres en sociaal-fiscaalnummer van de uiteindelijke gerechtigde;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4l
  - number: 4l.b
    text: naam en adres van de uitbetalende instantie;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4l
  - number: 4l.c
    text: |-
      rekeningnummer van de uiteindelijke gerechtigde of, bij ontstentenis daarvan, een eenduidige omschrijving van het
      schuldinstrument.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4l
  - number: 4m
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4m
  - number: 4n
    text: |-
      Op het bezwaar, beroep en beroep in cassatie inzake de op de voet van deze afdeling genomen beschikkingen is
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4n
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
  - number: 4o
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4o
  - number: 4p
    text: '[gereserveerd]'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel4p
  - number: '5.1'
    text: |-
      Op verzoek van een bevoegde autoriteit kan Onze Minister haar de inlichtingen verstrekken waarom zij vraagt en die
      voor haar van belang kunnen zijn bij de heffing van een van de in [artikel 1][ref1] bedoelde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '5.2'
    text: |-
      Onze Minister stelt degene van wie de inlichtingen afkomstig zijn en die in Nederland woont of is gevestigd, in
      kennis van zijn besluit tot inwilliging van het verzoek om inlichtingen. Bij de kennisgeving geeft Onze Minister
      een omschrijving van de te verstrekken inlichtingen en vermeldt hij de bevoegde autoriteit van wie het verzoek
      afkomstig is.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      Bij een besluit als bedoeld in het tweede lid geldt, in afwijking van
      [artikel 8:1 van de Algemene wet bestuursrecht][ref1], uitsluitend als belanghebbende degene tot wie de
      kennisgeving van het besluit is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.4'
    text: |-
      Tenzij dringende redenen daartoe aanleiding geven, wordt aan de inwilliging van het verzoek om inlichtingen geen
      uitvoering gegeven dan na tien dagen na de dagtekening van de kennisgeving, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel5
  - number: '5.5'
    text: |-
      Indien dringende redenen daartoe aanleiding geven, kan Onze Minister, in afwijking van
      [artikel 3:40 van de Algemene wet bestuursrecht][ref1], aan de inwilliging van het verzoek om inlichtingen
      uitvoering geven voordat degene van wie de inlichtingen afkomstig zijn, daarvan in kennis is gesteld. Alsdan vindt
      de kennisgeving zo spoedig mogelijk plaats, doch niet later dan vier maanden na het begin van de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '6.1'
    text: |-
      Onze Minister kan in overleg met een bevoegde autoriteit gevallen of groepen van gevallen aanwijzen in welke hij
      zonder voorafgaand verzoek inlichtingen zal verstrekken, alsmede de voorwaarden bepalen waaronder de verstrekking
      zal geschieden.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde aanwijzingen en voorwaarden worden door plaatsing in de *Staatscourant* bekend
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan een bevoegde autoriteit uit eigen beweging inlichtingen verstrekken die voor haar van belang
      kunnen zijn bij de bepaling van een belastingschuld in de gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
  - number: 7.1.a
    text: |-
      vermoed wordt dat in de staat van de bevoegde autoriteit ten onrechte een vermindering, ontheffing, teruggaaf of
      vrijstelling van belasting zou worden verleend dan wel heffing van belasting ten onrechte achterwege zou blijven
      ingeval de inlichtingen niet zouden zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
  - number: 7.1.b
    text: |-
      in Nederland een vermindering, ontheffing, teruggaaf of vrijstelling van belasting is verleend die van invloed kan
      zijn op de belastingheffing in de staat van die bevoegde autoriteit;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
  - number: 7.1.c
    text: |-
      in Nederland rechtshandelingen of andere handelingen zijn verricht met het doel de heffing van belasting in de
      staat van de bevoegde autoriteit geheel of ten dele onmogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
  - number: 7.1.d
    text: zulks overigens naar het oordeel van Onze Minister is geboden.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister stelt degene van wie de inlichtingen afkomstig zijn en die in Nederland woont of is gevestigd, in
      kennis van zijn besluit de inlichtingen te verstrekken. Bij de kennisgeving geeft Onze Minister een omschrijving
      van de te verstrekken inlichtingen en vermeldt hij de bevoegde autoriteit aan wie de inlichtingen zullen worden
      verstrekt.[ Artikel 5, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
  - number: 7a.1
    text: Op verzoek van een bevoegde autoriteit van een lidstaat kan Onze Minister overgaan tot de notificatie van stukken.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7a
  - number: 7a.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder de notificatie van stukken verstaan de uitreiking aan
      de geadresseerde in Nederland van een door een administratieve autoriteit van een lidstaat uitgevaardigd document,
      houdende een akte of beslissing, inzake de heffing van een belasting als bedoeld in [artikel 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: 7a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende de notificatie van stukken en de behandeling van
      het verzoek daartoe.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel7a
  - number: '8.1'
    text: |-
      Onze Minister laat door een ambtenaar van de rijksbelastingdienst zo nodig een onderzoek instellen ten behoeve van
      het verstrekken van inlichtingen, bedoeld in de[ artikelen 5][ref1], [6][ref2] of [7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel7
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '5'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '6'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
  - number: '8.2'
    text: |-
      Bij het in het eerste lid bedoelde onderzoek zijn de bepalingen van [Hoofdstuk VIII, afdeling 2, met uitzondering
      van artikel 53, tweede en derde lid, van de Algemene wet](onbekend) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel8
  - number: 8a.1
    text: Onze Minister kan na overleg met een of meer bevoegde autoriteiten overgaan tot een gelijktijdig onderzoek.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel8a
  - number: 8a.2
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder een gelijktijdig onderzoek verstaan een onderzoek als
      bedoeld in [artikel 8][ref1], dat gelijktijdig wordt uitgevoerd met een onderzoek in een of meer andere staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
  - number: 8a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld betreffende het gelijktijdige onderzoek en de behandeling
      van een voorstel daartoe.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Onze Minister kan na overleg met een bevoegde autoriteit van een staat toestaan dat een ambtenaar van de
      belastingadministratie van die staat aanwezig is bij een onderzoek als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
  - number: '9.2'
    text: |-
      Bij het overleg worden de voorwaarden vastgesteld waaronder Onze Minister de in het eerste lid bedoelde toestemming
      kan verlenen.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien een ambtenaar van de rijksbelastingdienst een onderzoek instelt in aanwezigheid van ambtenaren van een
      andere staat aan wie Onze Minister toestemming heeft verleend als bedoeld in het eerste lid, geeft Onze Minister,
      in afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1], aan de inwilliging van het verzoek om
      inlichtingen uitvoering voordat degene van wie de inlichtingen afkomstig zijn, daarvan in kennis is gesteld. Alsdan
      vindt de kennisgeving zo spoedig mogelijk plaats, doch niet later dan vier maanden na het begin van de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 8][ref1] wordt ingesteld, is verplicht de ambtenaar van
      de rijksbelastingdienst alsmede de ambtenaar die ingevolge [artikel 9][ref2] bij dit onderzoek aanwezig is, ten
      behoeve van dit onderzoek toegang te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel9
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '11'
    text: |-
      [Hoofdstuk IX van de Algemene wet][ref1] is van overeenkomstige toepassing ten aanzien van degene die niet voldoet
      aan de in [artikel 8][ref2] en [artikel 10][ref3] bedoelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukIX
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003954#Artikel10
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003954
        artikel: '10'
        hoofdstuk: II
        afdeling: '4'
  - number: '12'
    text: |-
      Ten dienste van de heffing van de in [artikel 4][ref1] bedoelde belastingen kan Onze Minister een ambtenaar van de
      rijksbelastingdienst aanwijzen om aanwezig te zijn bij een onderzoek in een andere staat, dat door of vanwege de
      bevoegde autoriteit van die staat wordt ingesteld, in het kader van het verstrekken van inlichtingen aan Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '4'
        hoofdstuk: IA
        afdeling: '1'
  - number: '13.1'
    text: 'Onze Minister verstrekt geen inlichtingen indien:'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: 13.1.a
    text: |-
      de verstrekking daarvan niet voortvloeit uit verplichtingen van de Richtlijn van de Raad van de Europese
      Gemeenschappen van 19 december 1977, nr. 77/799/EEG, PbEG 1977, L336, of uit andere verplichtingen van
      internationaal en interregionaal recht;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: 13.1.b
    text: de openbare orde van de Nederlandse staat zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: 13.1.c
    text: |-
      die inlichtingen in Nederland krachtens wettelijke bepalingen of op grond van de administratieve praktijk niet
      zouden kunnen worden verkregen voor de heffing van de in [artikel 4][ref1] bedoelde belastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '4'
        hoofdstuk: IA
        afdeling: '1'
  - number: 13.1.d
    text: |-
      aannemelijk is dat de bevoegde autoriteit in de eigen staat niet eerst de gebruikelijke mogelijkheden voor het
      verkrijgen van de door haar gevraagde inlichtingen heeft aangewend;
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: 13.1.e
    text: |-
      de bevoegde autoriteit voor wie de inlichtingen zouden zijn bestemd, niet bevoegd of in staat is Onze Minister
      soortgelijke inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister verstrekt ter uitvoering van de verplichtingen ingevolge het op 25 januari 1988 te Straatsburg tot
      stand gekomen Verdrag inzake wederzijdse administratieve bijstand in belastingzaken (Trb. 1991, 4) voorts geen
      inlichtingen indien de verstrekking ten dienste zou staan van belastingheffing in de staat die om inlichtingen
      verzoekt, welke hij strijdig acht met algemeen aanvaarde beginselen van belastingheffing, met de bepalingen van
      een verdrag ter voorkoming van dubbele belasting of met de bepalingen van enig ander verdrag dat Nederland met die
      staat mocht hebben gesloten. De eerste volzin is van overeenkomstige toepassing indien met een bestuurlijke eenheid
      regelen ter voorkoming van dubbele belasting zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister behoeft geen inlichtingen te verstrekken indien daarmede een commercieel, een industrieel of een
      beroepsgeheim zou worden onthuld.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het bepaalde betreffende de verplichting tot geheimhouding in artikel 67 van de Algemene wet is van overeenkomstige
      toepassing op de inlichtingen die door een bevoegde autoriteit zijn verstrekt, alsmede op inlichtingen die bij een
      onderzoek, als is bedoeld in [artikel 8][ref1], zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel8
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '8'
        hoofdstuk: II
        afdeling: '4'
  - number: '14.2'
    text: |-
      Onze Minister verstrekt geen inlichtingen aan een bevoegde autoriteit indien de wetgeving van de staat van die
      autoriteit geen verplichting tot geheimhouding oplegt aan ambtenaren van de belastingadministratie van die staat
      met betrekking tot hetgeen hun wordt medegedeeld of blijkt bij de uitvoering van de belastingwetten van die staat.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel14
  - number: '15.1'
    text: |-
      Tenzij een bevoegde autoriteit anders bepaalt, kunnen de door haar aan Onze Minister verstrekte inlichtingen
      uitsluitend worden gebruikt voor de heffing van de in [artikel 4][ref1] bedoelde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel4
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '4'
        hoofdstuk: IA
        afdeling: '1'
  - number: '15.2'
    text: |-
      Uitsluitend met toestemming van de bevoegde autoriteit van een staat kan Onze Minister de door hem van haar
      ontvangen inlichtingen aan de bevoegde autoriteit van een andere staat verstrekken.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel15
  - number: '15.3'
    text: |-
      De in artikel 7, eerste lid, eerste alinea, van de richtlijn van de Raad van de Europese Gemeenschappen van 19
      december 1977, nr. 77/799/EEG (PbEG L 336) bedoelde inlichtingen mogen door de bevoegde autoriteit van de andere
      lidstaat worden gebruikt voor de vaststelling van heffingen, rechten en belastingen die vallen onder artikel 2 van
      de richtlijn van de Raad van de Europese Gemeenschappen van 15 maart 1976, nr. 76/308/EEG (PbEG L 73).
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister kan aan een bevoegde autoriteit toestemming verlenen de inlichtingen voor een ander doel te gebruiken
      dan voor de heffing van de in [artikel 1][ref1] bedoelde belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel1
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003954
        artikel: '1'
        hoofdstuk: I
  - number: '15.5'
    text: |-
      Onze Minister kan op een daartoe strekkend verzoek een bevoegde autoriteit toestemming verlenen de van hem
      ontvangen inlichtingen aan een bevoegde autoriteit van een andere staat te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel15
  - number: '16.1'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel16
  - number: '16.2'
    text: 'Deze wet kan worden aangehaald als: Wet op de internationale bijstandsverlening bij de heffing van belastingen.'
    url: https://wetten.overheid.nl/BWBR0003954/2005-01-01#Artikel16
