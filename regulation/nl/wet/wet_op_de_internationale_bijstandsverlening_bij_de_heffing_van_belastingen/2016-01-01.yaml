  - number: 2a.2
    text: |-
      Voor de toepassing van het eerste lid, onderdelen b en e, wordt de vestigingsplaats van een financiële instelling
      bepaald met inachtneming van bijlage II, onder 3, van Richtlijn 2011/16/EU.
    url: https://wetten.overheid.nl/BWBR0003954/2016-01-01#Artikel2a
  - number: 2a.3
    text: |-
      Een entiteit zonder fiscale woonplaats wordt, met inachtneming van bijlage II, onder 5, van Richtlijn 2011/16/EU,
      voor de toepassing van het eerste lid, onderdeel q, behandeld als ingezetene van het rechtsgebied waar de plaats
      van de werkelijke leiding ervan is gelegen.
    url: https://wetten.overheid.nl/BWBR0003954/2016-01-01#Artikel2a
  - number: 2a.4
    text: |-
      Voor de toepassing van het eerste, tweede en derde lid wordt, waar direct of indirect wordt verwezen naar de
      bepalingen in de bijlagen I en II van Richtlijn 2011/16/EU, in de desbetreffende bepalingen, voor zover deze
      niet ook al op andere rechtsgebieden betrekking hebben, onder lidstaat mede verstaan andere rechtsgebieden dan
      de lidstaten.
    url: https://wetten.overheid.nl/BWBR0003954/2016-01-01#Artikel2a
  - number: 2a.5
    text: |-
      Voor de toepassing van het eerste lid, onderdelen p en q, wordt als deelnemend rechtsgebied mede aangemerkt een
      rechtsgebied waarmee het land Nederland een overeenkomst heeft op grond waarvan het land Nederland de informatie,
      bedoeld in de [artikelen 10b][ref1] en [10c][ref2], aan dat rechtsgebied zal verstrekken. Voor de toepassing
      van het eerste lid, onderdelen p en q, wordt in afwijking van het eerste lid, onderdeel f, niet als deelnemend
      rechtsgebied aangemerkt een rechtsgebied waarmee het land Nederland een overeenkomst heeft op grond waarvan dat
      rechtsgebied informatie als bedoeld in de artikelen 10b en 10c aan het land Nederland zal verstrekken, terwijl het
      land Nederland niet zodanige informatie hoeft te verstrekken aan dat rechtsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003954#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0003954#Artikel10c
