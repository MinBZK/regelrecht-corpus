  - number: 6.6.3
    text: |-
      De hoogte van de boete wordt gemotiveerd en is afhankelijk van de aard en ernst van de overtreding en de
      maatschappelijke gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.6
  - number: 6.6.4
    text: |-
      Een bestuurlijke boete en daarmee verband houdende documenten worden aan de betrokkene meegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.6
  - number: 6.7.1
    text: Met het onderzoek in verband met de op te leggen bestuurlijke boete zijn belast de toezichthouders.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.2
    text: |-
      Indien deze toezichthouders een redelijk vermoeden hebben dat een bepaalde natuurlijke persoon of rechtspersoon
      een overtreding heeft begaan, is er geen verplichting aan de zijde van die natuurlijke persoon of rechtspersoon ter
      zake een verklaring af te leggen. De betrokkenen worden hiervan in kennis gesteld voordat hun mondeling ter zake om
      informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.3
    text: Een toezichthouder die vaststelt dat een overtreding is begaan, maakt daarvan een rapport op.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.4
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.4.a
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.4.b
    text: waar en wanneer de feiten, bedoeld onder a, zich hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.4.c
    text: het overtreden wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.7.5
    text: Een kopie van het rapport wordt gezonden aan degene die de overtreding heeft begaan.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.7
  - number: 6.8.1
    text: |-
      Een belanghebbende wordt schriftelijk opgeroepen om naar keuze schriftelijk of mondeling zijn zienswijze naar voren
      te brengen omtrent het rapport, bedoeld in [artikel 6.7, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.8.2
    text: Een boete wordt opgelegd bij beschikking.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
  - number: 6.8.3
    text: 'In de beschikking worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
  - number: 6.8.3.a
    text: de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
  - number: 6.8.3.b
    text: de overtreding ter zake waarvan zij is gegeven, alsmede het overtreden voorschrift.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
  - number: 6.8.4
    text: |-
      De beschikking dient te worden gegeven binnen dertien weken nadat het rapport, bedoeld in
      [artikel 6.7, derde lid][ref1], is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.8.5
    text: |-
      De werkzaamheden die verband houden met de uitvoering dit artikel worden verricht door toezichthouders die niet
      betrokken zijn geweest bij de opstelling van het rapport en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.8
  - number: 6.9.1
    text: Een boete wordt betaald binnen zes weken nadat de beschikking waarbij de boete is opgelegd, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.9
  - number: 6.9.2
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt de boete vermeerderd met de wettelijke
      rente, te rekenen zes weken vanaf de dag waarop de in het eerste lid genoemde beschikking is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.9
  - number: 6.9.4
    text: |-
      [Artikel 6.5, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.9
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '6.10'
    text: |-
      De [artikelen 2, vierde lid][ref1], [6b][ref2], [7][ref3], [8][ref4], [9][ref5], [10][ref6], [12a][ref7]
      en [12t van de Instellingswet Autoriteit Consument en Markt][ref8] zijn van overeenkomstige toepassing voor de
      uitvoering van de taken en het uitoefenen van toezicht krachtens deze wet door de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Artikel6b
      [ref3]: https://wetten.overheid.nl/BWBR0033043#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0033043#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0033043#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0033043#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref8]: https://wetten.overheid.nl/BWBR0033043#Artikel12t
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.10
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0033043
        artikel: 6b
      - id: ref3
        bwb_id: BWBR0033043
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0033043
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0033043
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0033043
        artikel: '10'
      - id: ref7
        bwb_id: BWBR0033043
        artikel: 12a
      - id: ref8
        bwb_id: BWBR0033043
        artikel: 12t
  - number: 6.11.1
    text: |-
      Een afnemer die een geschil heeft met een distributeur over de wijze waarop deze zijn taken en bevoegdheden bij
      of krachtens deze wet uitoefent, dan wel aan zijn verplichtingen op grond van deze wet voldoet, kan, nadat de
      klachtprocedure, bedoeld in [artikel 3.10, eerste lid, onderdeel b][ref1], is doorlopen, een klacht indienen bij de
      Autoriteit Consument en Markt, of indien het een klacht aangaande kwaliteit, veiligheid of leveringszekerheid van
      drinkwater betreft, bij Onze Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 6.11.2
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat beslist op een klacht binnen
      twee maanden na ontvangst van die klacht. Onze Minister van Infrastructuur en Waterstaat of de Autoriteit Consument
      en Markt kan deze termijn met twee maanden verlengen als zij aanvullende gegevens van de indiener van de klacht of
      van een distributeur nodig heeft. Indien de klager daarmee instemt, is verdere verlenging mogelijk.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.11
  - number: 6.11.3
    text: De beslissing van de Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat is bindend.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.11
  - number: 6.11.4
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid laat elke mogelijkheid onverlet voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.11
  - number: 6.12.1
    text: |-
      Indien Onze Minister vaststelt dat een producent of een distributeur niet in staat is zijn bij of krachtens deze
      wet gestelde taken uit te voeren of zijn verplichtingen na te komen, kan hij een producent of een distributeur
      opdragen voorzieningen of maatregelen te treffen, waaronder het staken van de productie of de distributie.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
  - number: 6.12.2
    text: |-
      Onze Minister kan in het belang van een betrouwbare, toegankelijke en duurzame voorziening en de volksgezondheid
      geheel of gedeeltelijk voorzien in faciliteiten, middelen en bijstand die noodzakelijk zijn voor het uitvoeren van
      het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
  - number: 6.12.3
    text: |-
      Onze Minister kan van een producent, een distributeur, een eigenaar van een installatie als bedoeld in
      [artikel 3.13][ref1] of een afnemer de gegevens en inlichtingen verzoeken die hij nodig heeft voor de uitvoering
      van de taken en bevoegdheden op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 6.12.4
    text: |-
      Een producent, distributeur of eigenaar van een installatie als bedoeld in [artikel 3.13][ref1] geeft onmiddellijk
      kennis aan Onze Minister van omstandigheden die het uitvoeren van het bepaalde bij of krachtens deze wet ernstig in
      gevaar brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 6.12.5
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden, zo mogelijk na overleg met de distributeur en het
      eilandsbestuur en zo lang als die omstandigheden dat vereisen, maatregelen treffen die hij redelijkerwijs nodig
      acht in het belang van de veiligstelling van de openbare drinkwatervoorziening. De maatregelen hebben geen
      betrekking op het tarief van drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
  - number: 6.12.6
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder dwangsom van het bepaalde in dit artikel.
      [Artikel 6.5, tweede tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.13.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan tijdelijk ontheffing verlenen van de kwaliteitseisen voor stoffen,
      bedoeld in [artikel 2.3, tweede lid, onder a][ref1], voor zover dit geen gevaar voor de volksgezondheid oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 6.13.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de procedure voor het
      verlenen van een ontheffing en de inhoud van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.13
  - number: 6.14.1
    text: |-
      Onze Minister van Infrastructuur en Waterstaat stelt een handhavingsplan vast waarin gemotiveerd wordt aangegeven
      welke doelen met het toezicht op de naleving en verdere handhaving nagestreefd worden, welke activiteiten hij
      daartoe zal uitvoeren en welke afspraken hij heeft gemaakt met andere betrokken organen die zijn belast met het
      toezicht en de verdere handhaving. Bij de voorbereiding van het handhavingsbeleid worden het bestuurscollege,
      bedoeld in [artikel 36 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], en de Autoriteit
      Consument en Markt geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel36
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '36'
  - number: 6.14.2
    text: |-
      Onze Minister van Infrastructuur en Waterstaat legt het plan ter inzage bij het ministerie en bij de desbetreffende
      openbare lichamen en publiceert het plan op het internet.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.14
  - number: '7.3'
    text: |-
      In aanvulling op [artikel 3.16, tweede lid][ref1], wordt het vaste gebruikstarief voor een periode van vijf jaar na
      afsluiting, tevens in rekening gebracht bij afnemers voor elektriciteit met een aansluiting met een capaciteit van
      meer dan 14 kVA of bij de afnemers met een aansluiting voor drinkwater die op het tijdstip van inwerkingtreding van
      [artikel 3.14][ref2] van deze wet een aansluiting op het net hadden en na die datum op hun verzoek zijn afgesloten
      en in hun eigen elektriciteit of drinkwater zijn gaan voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 7.4.1
    text: |-
      Diegenen die op 1 juli 2016 reeds elektriciteit of drinkwater produceerden of distribueerden en op grond van
      [artikel 2.1][ref1] vergunningplichtig zijn geworden of op grond van [artikel 3.1][ref2] een aanwijzing nodig
      hebben, vragen voor 1 juli 2026 dan wel, indien die datum verstreken is, binnen een door Onze Minister te bepalen
      termijn van ten hoogste een jaar na die datum, een vergunning aan als bedoeld in [artikel 2.2][ref3] of een
      aanwijzing als bedoeld in [artikel 3.2][ref4]. De artikelen 2.1, eerste lid, en 3.1, eerste lid, zijn niet van
      toepassing op de in de eerste zin bedoelde personen tot het tijdstip waarop onherroepelijk op de aanvraag is
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037861#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 7.4.2
    text: |-
      Onverminderd het eerste lid geldt voor de in dat lid bedoelde rechtspersonen of natuurlijke personen tot het
      tijdstip waarop onherroepelijk op de aanvraag om een vergunning of aanwijzing is beslist, het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.4
  - number: 7.4.3
    text: |-
      Indien een distributeur op 1 juli 2016 niet voldeed aan de eis, bedoeld in [artikel 3.12, tweede lid][ref1],
      voldoet deze distributeur, in afwijking van het tweede lid, voor 1 juli 2026 dan wel, indien die datum verstreken
      is, binnen een door Onze Minister te bepalen termijn van ten hoogste een jaar na die datum aan de betreffende eis.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '7.5'
    text: |-
      Het beleid, bedoeld in [artikel 4.4, eerste lid][ref1], wordt voor de eerste keer vastgesteld op het moment dat de
      eerstvolgende beleidsnota, bedoeld in [artikel 6 van de Drinkwaterwet][ref2], na inwerkingtreding van artikel 4.4
      van deze wet, wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '6'
  - number: '7.7'
    text: |-
      Deze wet is niet van toepassing voor zover bij of krachtens
      [hoofdstuk 2 van de Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES][ref1] regels van dezelfde aard
      zijn gesteld ten aanzien van een leidingnet of een installatie die deel uitmaakt van een gebouw als bedoeld in
      [artikel 1.2 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '1'
  - number: '7.8'
    text: |-
      De [Wet elektriciteitsconcessies BES][ref1] en de[ Wet drinkwater BES][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028194
      [ref2]: https://wetten.overheid.nl/BWBR0028180
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0028194
      - id: ref2
        bwb_id: BWBR0028180
  - number: '7.9'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.9
  - number: '7.10'
    text: 'Deze wet wordt aangehaald als: Wet elektriciteit en drinkwater BES.'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel7.10
