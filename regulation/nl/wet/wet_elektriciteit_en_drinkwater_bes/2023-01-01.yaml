  - number: 3.2.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de procedure voor het
      geven van een aanwijzing, de criteria en de inhoud van de aanwijzing en de voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
  - number: 3.3.1
    text: Een distributeur beschikt over het eigendom van het door hem beheerde net.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De aandelen van een distributeur berusten direct of indirect bij de Staat, een provincie, een gemeente of een
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.3
  - number: 3.4.1
    text: De raad van commissarissen van een distributeur bestaat uit maximaal vijf leden.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.4
  - number: 3.4.2
    text: De benoeming en het ontslag van een lid van de raad van commissarissen behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.4
  - number: 3.5.1
    text: 'Een distributeur heeft in het kader van transport tot taak:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.1.a
    text: |-
      te waarborgen dat het net zonder verstoring kan voldoen aan de vraag naar het transport van elektriciteit of
      drinkwater en dit transport uit te voeren,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.1.b
    text: |-
      te zorgen dat de wijze van distributie, en voor drinkwater de daarbij gebruikte materialen en chemicaliën en
      de wijze van toepassing, geen gevaar voor de volksgezondheid en het milieu veroorzaken en zijn net te beheren,
      te onderhouden en te ontwikkelen op een wijze die de veiligheid, betrouwbaarheid en doelmatigheid van zijn net
      waarborgt,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.1.c
    text: afnemers te voorzien van een aansluiting op het net, tenzij dit bedrijfseconomisch niet verantwoord is,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.1.d
    text: |-
      zorg te dragen voor het installeren van een meetinrichting en voor het beheer en onderhoud van de meetinrichting
      bij afnemers, en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.1.e
    text: de afgenomen hoeveelheid elektriciteit of drinkwater te meten.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.2
    text: 'Een distributeur heeft in het kader van de levering tot taak:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.2.a
    text: |-
      zorg te dragen voor een betrouwbare levering van elektriciteit of drinkwater van goede kwaliteit en, voor
      drinkwater, in een zodanige hoeveelheid, en in geval van een drinkwaternet, onder een zodanige druk, als in het
      belang van de volksgezondheid vereist is. [Artikel 2.3, tweede lid][ref1], is van overeenkomstige toepassing op de
      kwaliteit van het drinkwater;


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.5.2.b
    text: redelijke voorwaarden voor de levering van elektriciteit of drinkwater op te stellen;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.2.c
    text: |-
      de afnemers ten minste jaarlijks in kennis te stellen van elke wijziging van de tarieven voor distributie van
      elektriciteit en drinkwater en van elk voornemen tot wijziging van de voorwaarden; en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.2.d
    text: |-
      zorg te dragen voor een noodvoorziening waardoor ook bij uitval van de drinkwatervoorziening de hoeveelheid
      drinkwater geleverd kan worden die in het belang van de volksgezondheid is vereist.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      Een distributeur zendt iedere twee jaar aan Onze Minister en de Autoriteit Consument en Markt een kwaliteits- en
      capaciteitsdocument met risicoanalyse waarin hij:
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.3.a
    text: een vijfjarige prognose van de vraag naar elektriciteit of drinkwater opneemt,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.3.b
    text: |-
      aannemelijk maakt dat hij over voldoende capaciteit beschikt om te voorzien in de totale behoefte aan het transport
      van elektriciteit of drinkwater en aangeeft welke capaciteitsknelpunten in de door hem beheerde netten eventueel te
      verwachten zijn en welke maatregelen hij zal nemen om deze op te heffen en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.3.c
    text: |-
      aannemelijk maakt dat hij beschikt over een doeltreffend kwaliteitsbeheersingssysteem om de kwaliteitseisen die
      zijn gesteld bij of krachtens deze wet te borgen; en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.3.d
    text: |-
      de maatregelen opneemt die hij neemt om aan de verplichting, bedoeld in het tweede lid, aanhef en onder d, te
      kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Indien er sprake is van een geïntegreerd bedrijf heeft een kwaliteits- en capaciteitsdocument tevens betrekking op
      de productie.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.a
    text: de uitvoering van de meettaak, bedoeld in het eerste lid, onder e;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.b
    text: de minimum hoeveelheid en druk waarmee drinkwater wordt geleverd op een aansluiting van een afnemer;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.c
    text: het gebruik van materialen en chemicaliën en de wijze van toepassing, bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.d
    text: het kwaliteits- en capaciteitsdocument, bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.e
    text: de kwaliteitscontrole, waaronder een meetprogramma, en rapportage door een distributeur aan de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.f
    text: de leveringszekerheid;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: 3.5.5.g
    text: |-
      de periode gedurende welke tenminste nooddrinkwater geleverd moet kunnen worden en de minimum hoeveelheid
      nooddrinkwater per inwoner per dag.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      Indien een aansluiting op het drinkwaternet bedrijfseconomisch onverantwoord is, heeft een distributeur tot taak om
      het transport van drinkwater uit te voeren via tankauto’s, tankschepen of andere transportvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.6
  - number: '3.7'
    text: Een distributeur onthoudt zich van discriminatie tussen afnemers of categorieën afnemers.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      Indien een distributeur bij de uitvoering van zijn taken de beschikking krijgt over gegevens waarvan hij het
      vertrouwelijke karakter kent of redelijkerwijs kan vermoeden, is hij verplicht tot geheimhouding van die gegevens,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taken de noodzaak tot
      mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Een distributeur stelt al hetgeen redelijkerwijs in zijn vermogen ligt in het werk om afsluiting of verstoring te
      voorkomen en, indien een verstoring optreedt, deze zo snel mogelijk te verhelpen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.9
  - number: 3.9.2
    text: |-
      Een distributeur stelt een afnemer ten minste drie dagen van tevoren op de hoogte van door hem geplande
      werkzaamheden waarbij naar verwachting verstoring optreedt.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.9
  - number: 3.9.3
    text: |-
      Een distributeur biedt voor drinkwater een alternatieve wijze van levering aan indien een verstoring langer duurt
      dan een periode van 12 uur.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.9
  - number: 3.9.4
    text: |-
      Een distributeur brengt een door de Autoriteit Consument en Markt vast te stellen forfaitair bedrag in rekening
      bij een afnemer voor het heraansluiten van die afnemer indien de afsluiting te wijten is aan een verzuim van de
      afnemer.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.9
  - number: 3.9.5
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over het beëindigen van de distributie van elektriciteit
      of drinkwater, de heraansluiting en de hoogte van het forfaitaire bedrag en over preventieve maatregelen om
      beëindiging zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.9
  - number: 3.10.1
    text: 'Een distributeur voorziet in een transparante, eenvoudige en goedkope procedure voor:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.1.a
    text: het melden van storingen in de levering aan een afnemer en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.1.b
    text: de behandeling van klachten van afnemers.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Een distributeur registreert van de gemelde storing de datum en het tijdstip van het begin van de onderbrekingen,
      de duur van de onderbrekingen, de locatie, aard en oorzaak van de onderbrekingen en het aantal getroffen afnemers.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.3
    text: |-
      Bij ministeriële regeling kan de hoogte worden vastgesteld van de compensatie bij een ernstige storing in de
      levering van elektriciteit, die voor storingen van verschillende tijdsduur, verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.4
    text: 'De in het eerste lid, aanhef en onder b, bedoelde procedure voorziet er in dat:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.4.a
    text: |-
      de behandeling van de klacht geschiedt door een persoon die niet bij de gedraging waarop de klacht betrekking
      heeft, betrokken is geweest,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.4.b
    text: |-
      de klager schriftelijk en gemotiveerd in kennis wordt gesteld van de bevindingen naar aanleiding van de klacht en
      van de conclusies die daaraan worden verbonden en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.10.4.c
    text: de klacht zo spoedig mogelijk, doch uiterlijk binnen acht weken na dagtekening wordt afgehandeld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.10
  - number: 3.11.1
    text: |-
      De boekhouding van een distributeur bevat betrouwbare en op een inzichtelijke wijze vormgegeven informatie over de
      integrale kosten en opbrengsten die verband houden met de distributie van elektriciteit of drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
  - number: 3.11.2
    text: |-
      Het toerekenen van kosten aan activiteiten die verband houden met de distributie van elektriciteit of drinkwater
      geschiedt in overeenstemming met het daadwerkelijk gebruik van financiële of andere middelen voor die activiteiten.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
  - number: 3.11.3
    text: |-
      In de toelichting op de jaarrekening wordt ieder bedrijf waarmee een distributeur een overeenkomst heeft gesloten
      waarvan de opbrengst of de kosten een bedrag van USD 100.000 te boven gaat, vermeld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
  - number: 3.11.4
    text: |-
      Een distributeur voegt jaarlijks bij zijn boekhouding een overzicht waaruit blijkt dat hij voldoet aan
      [artikel 3.12, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.11.5
    text: |-
      Een distributeur legt zijn jaarrekening voor een ieder ter inzage op het kantoor van zijn hoofdvestiging op het
      betreffende openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
  - number: 3.11.6
    text: |-
      [Titel 5, Afdeling 4, van Boek 2 van het Burgerlijk Wetboek BES][ref1] is van overeenkomstige toepassing op een
      distributeur.


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Afdeling4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0028744
        afdeling: '4'
  - number: 3.11.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van de boekhouding van een
      distributeur.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      Een distributeur voert een goed financieel beheer waardoor hij langdurig in staat is om zijn taken en
      verplichtingen, gesteld bij of krachtens deze paragraaf, te vervullen en na te komen. Hij bezit voldoende eigen
      vermogen voor noodzakelijke investeringen in netten.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      De totale schuld gedeeld door de som van de totale schuld en het eigen vermogen inclusief minderheidsbelangen en
      preferente aandelen is maximaal 0,7.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Een eigenaar van een productie-installatie van drinkwater voor eigen gebruik waarmee ook aan anderen drinkwater ter
      beschikking wordt gesteld, heeft tot taak:
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.13
  - number: 3.13.1.a
    text: |-
      te zorgen dat het door hem ter beschikking gestelde drinkwater van goede kwaliteit is. De eisen gesteld krachtens
      [artikel 2.3, tweede lid][ref1], zijn van overeenkomstige toepassing. Bij of krachtens algemene maatregel van
      bestuur kan worden bepaald dat niet alle eisen op deze productie-installaties van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.13.1.b
    text: |-
      te zorgen dat de productie-installatie zodanig wordt beheerd, onderhouden en ontwikkeld dat de veiligheid van
      de productie wordt gewaarborgd en dat deze installatie, de gebruikte materialen en chemicaliën en de wijze van
      toepassing daarvan geen gevaar voor de volksgezondheid en het milieu veroorzaken. [Artikel 2.3, derde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.13.2
    text: |-
      De eigenaar van een op het drinkwaternet aangesloten installatie, niet zijnde een woninginstallatie, waarmee aan
      anderen drinkwater ter beschikking wordt gesteld, draagt er zorg voor dat die installatie geen nadelige gevolgen
      heeft voor de kwaliteit van het drinkwater en dat de gebruikte materialen en chemicaliën en de wijze van toepassing
      daarvan geen gevaar voor de volksgezondheid en het milieu veroorzaken. [Artikel 2.3, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.13.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de volksgezondheid installaties als
      bedoeld in het tweede lid worden aangewezen waarop de bij of krachtens [artikel 2.3, tweede lid][ref1], gestelde
      eisen bij die maatregel van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 3.14.1
    text: |-
      De Autoriteit Consument en Markt stelt, op voorstel van een distributeur, de tarieven vast die de distributeur ten
      hoogste zal berekenen aan de afnemers voor de distributie van elektriciteit of drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.2
    text: In afwijking van het eerste lid wordt geen tarief voor drinkwater vastgesteld voor het openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.3
    text: 'Er worden vier tarieven onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.3.a
    text: aansluittarief;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.3.b
    text: vast gebruikstarief;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.3.c
    text: variabel gebruikstarief;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.3.d
    text: wegtransporttarief voor drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.4
    text: De tarieven kunnen verschillen voor verschillende categorieën afnemers.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.5
    text: |-
      De tarieven zijn niet-discriminerend, transparant en gebaseerd op de werkelijke kosten met inachtneming van het
      vierde lid en een redelijk rendement.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.6
    text: |-
      De Autoriteit Consument en Markt hanteert voor de vaststelling van de tarieven een methode ter bevordering van een
      doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.7
    text: |-
      De tarieven treden in werking op een door de Autoriteit Consument en Markt te bepalen datum en gelden tot
      1 januari van het jaar volgend op de datum van inwerkingtreding van het besluit tot vaststelling van de tarieven
      met uitzondering van het variabel gebruikstarief dat op 1 januari en 1 juli van ieder kalenderjaar kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.8
    text: |-
      Indien op 1 januari de tarieven voor dat jaar nog niet zijn vastgesteld, gelden de laatst vastgestelde tarieven tot
      de datum van inwerkingtreding van het besluit tot vaststelling van de tarieven voor het volgende jaar.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.14.9
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de procedure en de elementen en de wijze
      van berekening van de tarieven, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Het aansluittarief verdisconteert de kosten die verband houden met de taak, bedoeld in
      [artikel 3.5, eerste lid, aanhef en onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.15.2
    text: |-
      Het aansluittarief wordt eenmalig in rekening gebracht bij een ieder die door een distributeur wordt aangesloten op
      een net.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.15
  - number: 3.15.3
    text: |-
      De hoogte van het aansluittarief is afhankelijk van de grootte van de aansluitcapaciteit en indien de lengte van de
      verbinding groter is dan 25 meter, van de lengte van de verbinding, en wordt uitgedrukt in een vast bedrag in USD.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.15
  - number: 3.15.4
    text: |-
      Indien op een aansluiting van een afnemer die een lengte heeft van meer dan 25 meter binnen vijf jaar een nieuwe
      aansluiting wordt aangelegd voor een andere afnemer, dan wordt de afnemer die betaald heeft voor de bestaande
      aansluiting daarvoor deels gecompenseerd via de distributeur door de afnemer met een nieuwe aansluiting.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Het vaste gebruikstarief verdisconteert de kosten die verband houden met de taken, bedoeld in
      [artikel 3.5, eerste lid, aanhef en onderdelen a, b, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.16.2
    text: |-
      Het vaste gebruikstarief wordt in rekening gebracht bij iedere afnemer die elektriciteit of drinkwater ontvangt op
      een aansluiting en bij ieder afnemer die elektriciteit invoedt op het net.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.16
  - number: 3.16.3
    text: |-
      De hoogte van het vaste gebruikstarief is afhankelijk van de grootte van de aansluitcapaciteit, wordt berekend per
      aansluiting en wordt uitgedrukt in een vast bedrag in USD.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.16
  - number: 3.16.4
    text: |-
      Voor bepaalde categorieën afnemers kan een lager vast gebruikstarief worden vastgesteld. Bij ministeriële regeling
      kan worden bepaald dat voor afnemers met een lage aansluitcapaciteit een korting wordt gegeven op het vaste
      gebruikstarief, waarbij in de regeling het kortingspercentage wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.16
  - number: 3.16.5
    text: |-
      Kosten die verband houden met moedwillige vernielingen door een afnemer worden individueel bij die afnemer in
      rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.16
  - number: 3.17.1
    text: |-
      Het variabele gebruikstarief verdisconteert de productieprijs, bedoeld in [artikel 2.5, eerste lid][ref1], en
      de kosten die verband houden met de taken en verplichtingen van een distributeur, met uitzondering van kosten
      die verband houden met de taken waarvoor een aansluittarief, vast gebruikstarief of een wegtransporttarief zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.17.2
    text: |-
      Het variabele gebruikstarief wordt uitgedrukt in een bedrag per kWh of per kubieke meter drinkwater en wordt in
      rekening gebracht bij iedere afnemer die elektriciteit of drinkwater ontvangt.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.17
  - number: 3.17.3
    text: |-
      In afwijking van het eerste lid en [artikel 3.16, tweede en derde lid][ref1], kan, indien er sprake is van
      een systeem waarbij vooraf voor een bepaalde hoeveelheid elektriciteit of drinkwater wordt betaald, door een
      distributeur bij een afnemer uitsluitend een door de Autoriteit Consument en Markt vast te stellen bijzonder
      variabel gebruikstarief in rekening worden gebracht. In dit bijzondere variabel gebruikstarief wordt het vaste
      gebruikstarief, bedoeld in 3.16, eerste lid, verdisconteerd waarbij wordt uitgegaan van een bij ministeriële
      regeling vast te stellen jaarverbruik van elektriciteit of drinkwater.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.18.1
    text: |-
      Het wegtransporttarief voor drinkwater verdisconteert de kosten die verband houden met de taak, bedoeld in
      [artikel 3.6][ref1], en wordt verhoogd met de productieprijs, bedoeld in [artikel 2.5, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 3.18.2
    text: |-
      Het wegtransporttarief voor drinkwater wordt in rekening gebracht bij iedere afnemer die drinkwater ontvangt via
      een transportmiddel als bedoeld in [artikel 3.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.18.3
    text: Het wegtransporttarief wordt uitgedrukt in een bedrag in USD per kubieke meter drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.18
  - number: 4.1.1
    text: |-
      Voor een afnemer die hernieuwbare elektriciteit invoedt op een net, factureert en int een distributeur het
      variabele gebruikstarief, bedoeld in [artikel 3.14, derde lid, onderdeel c][ref1], op basis van de aan het net
      onttrokken elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.1.2
    text: |-
      Voor op het net ingevoede elektriciteit wordt bij ministeriële regeling een terugleververgoeding of een methode
      tot vaststelling van die vergoeding door de Autoriteit Consument en Markt vastgesteld, die kan verschillen voor
      categorieën afnemers of naar openbaar lichaam, en die ten minste nul USD per kWh bedraagt en maximaal gelijk is aan
      de energiekosten van de productieprijs, bedoeld in [artikel 2.5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 4.1.3
    text: |-
      Indien de hoeveelheid op het net ingevoede elektriciteit in de periode van 1 januari tot 1 juli of van 1 juli
      tot en met 31 december van een kalenderjaar groter is dan de aan het net onttrokken elektriciteit in die periode,
      ontvangt een afnemer voor het meerdere geen vergoeding.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Een distributeur heeft, in aanvulling op [artikel 3.5, eerste lid, aanhef en onderdeel d][ref1], tot taak om bij
      een afnemer als bedoeld in het eerste lid, voor rekening van die afnemer, een meetinrichting te installeren die het
      actuele elektriciteitsverbruik kan weergeven en die informatie kan geven over daadwerkelijk verbruik en invoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 4.1.5
    text: |-
      Afnemers die gebruik maken van een systeem waarbij vooraf voor een bepaalde hoeveelheid elektriciteit of drinkwater
      wordt betaald als bedoeld in [artikel 3.17, vierde lid][ref1], kunnen geen elektriciteit invoeden op het net.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.2.1
    text: |-
      Onze Minister kan een noodproducent en, voor drinkwater, eveneens een nooddistributeur, aanwijzen die elektriciteit
      of nooddrinkwater produceert en zo nodig distribueert. De noodproducent of nooddistributeur ontvangt een redelijke
      vergoeding voor de noodproductie en de nooddistributie.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de noodvoorziening, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over maatregelen die worden genomen
      door een distributeur van drinkwater indien het drinkwater niet voldoet aan de eisen, bedoeld in 2.3, tweede
      lid, onderdeel a, en dit te wijten is aan de installatie van een afnemer, waaronder mede een voorziening voor het
      zuiveren of opslaan van drinkwater wordt begrepen, of het onderhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister van Infrastructuur en Waterstaat stelt voor drinkwater de hoofdlijnen en beginselen van het
      beleid ter uitvoering van deze wet vast. Dit omvat ten minste de productie en distributie van drinkwater en de
      veiligstelling van een betrouwbare en duurzame openbare drinkwatervoorziening.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Het beleid wordt opgenomen in de beleidsnota, bedoeld in [artikel 6, eerste lid, van de Drinkwaterwet][ref1].
      Artikel 6, derde tot en met vijfde lid, van de Drinkwaterwet is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '6'
  - number: '4.5'
    text: |-
      Onze Minister zendt het bestuurscollege, bedoeld in
      [artikel 36 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], dat het aangaat en de Autoriteit
      Consument en Markt een afschrift van de besluiten die hij neemt op basis van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel36
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '36'
  - number: 5.1.1
    text: |-
      Onze Minister kan op aanvraag voor een kalenderjaar subsidie verlenen aan een aangewezen distributeur als bedoeld
      in [artikel 3.2][ref1], met als doel een deel van de kosten te dekken die worden verdisconteerd in het vaste
      gebruikstarief en het wegtransporttarief, teneinde deze tarieven die in rekening worden gebracht bij afnemers te
      verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 5.1.2
    text: 'In de subsidiebeschikking worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: 5.1.2.a
    text: |-
      het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald en het kalenderjaar waarvoor deze wordt
      verleend,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: 5.1.2.b
    text: de voorwaarden waaronder de subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: 5.1.2.c
    text: |-
      de verplichtingen voor de subsidieontvanger, waaronder verplichtingen met betrekking tot administratie en
      gegevensverwerking,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: 5.1.2.d
    text: de wijze van betaling van de subsidie en het verlenen van voorschotten en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: 5.1.2.e
    text: de wijze van vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel5.1
  - number: '6.1'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bepaalde bij of krachtens de
      [hoofdstukken 2][ref1], [3][ref2] en [4][ref3], met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0037861#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037861
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0037861
        hoofdstuk: '4'
  - number: 6.1.a
    text: |-
      de verboden, bedoeld in [artikel 2.1, eerste lid][ref1], en [artikel 3.1, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 6.1.b
    text: |-
      de bepalingen inzake de kwaliteit, veiligheid en leveringszekerheid, waaronder verstoring en de noodvoorziening,
      bedoeld in [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 6.2.1
    text: 'Onze Minister van Infrastructuur en Waterstaat is belast met het toezicht op de naleving van:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.2
  - number: 6.2.1.a
    text: |-
      de verboden, bedoeld in [artikel 2.1, eerste lid][ref1], en [artikel 3.1, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 6.2.1.b
    text: |-
      de bepalingen inzake de kwaliteit, veiligheid en leveringszekerheid, waaronder verstoring en de noodvoorziening,
      bedoeld in [artikel 4.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 6.2.2
    text: |-
      Bij besluit van Onze Minister van Infrastructuur en Waterstaat aangewezen ambtenaren zijn belast met het toezicht
      op de naleving, bedoeld in het eerste lid. Dit besluit wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.2
  - number: 6.2.3
    text: |-
      Bij een besluit als bedoeld in het tweede lid kunnen tevens ambtenaren ressorterend onder een openbaar lichaam
      worden aangewezen. Bij ministeriële regeling worden in dat geval regels gesteld betreffende de vervulling van hun
      in het tweede lid bedoelde taak, in overeenstemming met het openbaar lichaam dat het aangaat.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.2
  - number: 6.3.1
    text: |-
      Een toezichthouder is, uitsluitend voor zover dat voor de vervulling van zijn taak redelijkerwijze noodzakelijk
      is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.1.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.1.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.1.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.1.d
    text: alle plaatsen, met uitzondering van woningen, zonder uitdrukkelijke toestemming van de bewoner te betreden;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.1.e
    text: |-
      woningen of tot bewoning bestemde gedeelten van vaartuigen zonder de uitdrukkelijke toestemming van de bewoner
      binnen te treden.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.2
    text: |-
      Zo nodig wordt de toegang tot een plaats als bedoeld in het eerste lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.3
    text: |-
      Op het binnentreden van woningen of van tot woning bestemde gedeelten van vaartuigen als bedoeld in het eerste
      lid, onderdeel e, is [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van overeenkomstige
      toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [157, tweede en derde lid][ref3],
      [158, eerste lid, laatste zinsnede][ref4], en met dien verstande dat de machtiging wordt verleend door de
      procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel158
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '158'
  - number: 6.3.4
    text: |-
      Een ieder is verplicht aan een toezichthouder alle medewerking te verlenen die op grond van het tweede lid wordt
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.5
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: 6.3.6
    text: |-
      Bij de uitoefening van zijn taak draagt een toezichthouder een legitimatiebewijs met een foto van de toezichthouder
      en vermelding van diens naam en hoedanigheid bij zich. Desgevraagd toont hij zijn legitimatiebewijs aanstonds.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat kan een bindende gedragslijn
      opleggen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.4
  - number: 6.5.1
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat kan in geval van overtreding
      van het bepaalde bij of krachtens deze wet, voor zover hij krachtens [artikel 6.1][ref1] of [artikel 6.2][ref2] met
      het toezicht is belast, de overtreder een last onder dwangsom opleggen, die ertoe strekt de overtreding ongedaan te
      maken dan wel een herhaling van de overtreding te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel6
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.5.2
    text: |-
      Een last onder dwangsom wordt niet opgelegd indien het belang dat het betrokken voorschrift beoogt te beschermen
      zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
  - number: 6.5.3
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat stelt de dwangsom vast op een
      bedrag ineens, op een bedrag per tijdseenheid waarin de last niet is uitgevoerd of op een bedrag per overtreding
      van de last. De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat stelt tevens een
      bedrag vast waarboven geen dwangsom meer wordt verbeurd. Het vastgestelde bedrag van de dwangsom dient in redelijke
      verhouding te staan tot de zwaarte van het geschonden belang en beoogde werking van de dwangsomoplegging.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
  - number: 6.5.4
    text: |-
      In de beschikking tot oplegging van een last onder dwangsom, wordt een termijn gesteld gedurende welke de
      overtreder de last kan uitvoeren zonder dat een dwangsom wordt verbeurd.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
  - number: 6.5.5
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat kan op verzoek van de overtreder
      de last opheffen, de looptijd ervan opschorten voor een bepaalde termijn of de dwangsom verminderen ingeval van
      blijvende of tijdelijke gehele of gedeeltelijke onmogelijkheid voor de overtreder om aan zijn verplichtingen te
      voldoen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
  - number: 6.5.6
    text: |-
      De Autoriteit Consument en Markt of Onze Minister van Infrastructuur en Waterstaat kan van de overtreder bij
      dwangbevel de verschuldigde dwangsom, verhoogd met de op de invordering vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
  - number: 6.5.7
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering BES][ref1] kan worden ten uitvoer gelegd. De betekening van het dwangbevel
      geschiedt op kosten van de overtreder. Gedurende een maand na betekening staat verzet tegen het dwangbevel open
      door dagvaarding van de Staat der Nederlanden. Het verzet schorst de tenuitvoerlegging. Op verzoek van de Staat der
      Nederlanden kan de rechter de schorsing van de tenuitvoerlegging opheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 6.6.1
    text: |-
      De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens
      [artikel 2.2][ref1], [2.3][ref2], [2.4][ref3], [3.5][ref4], [3.6][ref5], [3.7][ref6], [3.8][ref7], [3.9][ref8],
