        bwb_id: BWBR0037861
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2
    text: Onze Minister kan voorschriften en beperkingen verbinden aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Onze Minister kan de aanwijzing wijzigen en intrekken indien een distributeur de verplichtingen niet kan nakomen
      of de taken niet kan uitvoeren, die bij of krachtens dit hoofdstuk zijn gesteld, of kan op verzoek van een
      distributeur de aanwijzing intrekken.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
  - number: 3.2.4
    text: |-
      In afwijking van het eerste lid wijst Onze Minister, indien in een openbaar lichaam geen drinkwaternet aanwezig
      is, voor dat openbaar lichaam ten minste één rechtspersoon aan als distributeur die de taak heeft te voorzien
      in de distributie van drinkwater via tankauto’s, tankschepen of andere transportvoorzieningen. Het tarief
      daarvoor wordt vastgesteld overeenkomstig de [artikelen 3.14][ref1] en [3.18][ref2]. De eisen, gesteld krachtens
      [artikel 3.5, eerste lid, onder a, b en e, tweede lid en vijfde lid][ref3], en [artikel 3.6][ref4], [3.7][ref5] en
      [3.8][ref6] zijn van toepassing. De overige artikelen van dit hoofdstuk zijn niet van toepassing.


