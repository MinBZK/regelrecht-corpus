  - number: '1.2'
    text: Deze wet is van toepassing in de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      Deze wet is niet van toepassing op het vervaardigen of verhandelen als bedoeld in
      [artikel 1 van de Warenwet BES][ref1] van drinkwaren in verpakkingen als bedoeld in die wet, behoudens de productie
      en distributie van drinkwater of nooddrinkwater in bij regeling van Onze Minister van Infrastructuur en Waterstaat
      in overeenstemming met Onze Minister van Volksgezondheid, Welzijn en Sport aangewezen verpakkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel1
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '1'
  - number: 2.1.1
    text: Het is verboden zonder vergunning elektriciteit of drinkwater te produceren ten behoeve van de distributie.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.1
  - number: 2.1.2
    text: 'In afwijking van het eerste lid is geen vergunning nodig:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.1
  - number: 2.1.2.a
    text: |-
      voor het produceren van hernieuwbare elektriciteit met behulp van een installatie die hoofdzakelijk produceert voor
      eigen gebruik van een afnemer en de geproduceerde elektriciteit die niet wordt verbruikt invoedt op het net;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.1
  - number: 2.1.2.b
    text: voor het produceren van drinkwater voor eigen gebruik dat niet wordt ingevoed op het drinkwaternet;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.1
  - number: 2.1.2.c
    text: |-
      voor het produceren van elektriciteit of nooddrinkwater door een krachtens [artikel 4.2, eerste lid][ref1],
      aangewezen noodproducent.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037861
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 2.2.1
    text: |-
      Onze Minister kan op aanvraag een vergunning voor de productie van elektriciteit of drinkwater voor een periode van
      ten hoogste vijftien jaar verlenen aan een rechtspersoon die:
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taken en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      redelijkerwijs in staat kan worden geacht de verplichtingen na te komen en de taken uit te voeren, gesteld bij of
      krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Onze Minister kan voorschriften en beperkingen verbinden aan de vergunning, waarbij in ieder geval een voorschrift
      wordt verbonden omtrent de hoeveelheid elektriciteit of drinkwater die ten minste per tijdseenheid wordt
      geproduceerd.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Onze Minister kan de vergunning wijzigen en wijzigt de vergunning indien de hoeveelheid elektriciteit of drinkwater
      die een producent moet produceren, wijzigt.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Onze Minister kan de vergunning intrekken indien een producent de verplichtingen niet kan nakomen of de taken niet
      kan uitvoeren die bij of krachtens dit hoofdstuk zijn gesteld of op verzoek van een producent.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de procedure voor
      vergunningverlening, de criteria, bedoeld in het eerste lid, de inhoud van de vergunning en de voorschriften en
      beperkingen, bedoeld in het tweede, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.2
  - number: 2.3.1
    text: 'Een producent heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.1.a
    text: te zorgen voor een betrouwbare productie van goede kwaliteit en een betrouwbare levering aan een distributeur,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.1.b
    text: |-
      een zodanige productiecapaciteit te waarborgen dat zonder verstoringen aan de vraag naar elektriciteit of
      drinkwater wordt voldaan. Indien meerdere producenten een vergunning hebben voor het grondgebied van een openbaar
      lichaam, voorzien zij gezamenlijk in deze vraag en voorziet iedere producent ten minste in de hoeveelheid die bij
      zijn vergunning is bepaald en
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.1.c
    text: |-
      te zorgen dat de wijze van productie, en, voor drinkwater, de daarbij gebruikte materialen en chemicaliën en
      de wijze van toepassing, geen gevaar voor de volksgezondheid en het milieu veroorzaken en dat een productie-
      installatie zodanig wordt beheerd, onderhouden en ontwikkeld dat de veiligheid, doelmatigheid en betrouwbaarheid
      van de productie worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      de kwaliteitseisen waaraan drinkwater ten minste moet voldoen ten aanzien van micro-organismen, parasieten of
      stoffen in hoeveelheden of concentraties die een gevaar kunnen opleveren voor de volksgezondheid,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.2.b
    text: |-
      de kwaliteitscontrole, waaronder een meetprogramma, en rapportage door een producent van drinkwater aan de
      toezichthouder.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.3
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.3.a
    text: |-
      de kwaliteit van water of grondstof bestemd voor de bereiding van drinkwater en van de aan een producent te
      verstrekken informatie;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.3.b
    text: de kwaliteitscontrole en -borging bij de winning en bewerking tot grondstof,
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.3.3.c
    text: het gebruik van materialen en chemicaliën en de wijze van toepassing, bedoeld in het eerste lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      De boekhouding van een producent bevat betrouwbare informatie over de integrale kosten en opbrengsten die verband
      houden met de productie van elektriciteit of drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.4.2
    text: 'De boekhouding bevat:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.4.2.a
    text: een balans en een winst- en verliesrekening;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.4.2.b
    text: |-
      een specificatie van de toerekening van de activa en de passiva en de lasten en baten verbonden aan de productie
      van elektriciteit of drinkwater, waarbij, indien van toepassing, een onderscheid wordt gemaakt in de toerekening
      aan elektriciteit of drinkwater;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.4.2.c
    text: een toelichting op de gebruikte regels voor de afschrijving.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van de boekhouding van een
      producent.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De Autoriteit Consument en Markt stelt op 1 januari van ieder jaar, op voorstel van een producent, de
      productieprijs vast die deze producent ten hoogste zal berekenen aan een distributeur voor de geproduceerde
      elektriciteit of voor het geproduceerde drinkwater.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      In afwijking van het eerste lid wordt geen productieprijs voor drinkwater vastgesteld voor het openbaar lichaam
      Saba.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      De productieprijs voor elektriciteit of drinkwater is gebaseerd op de werkelijke kosten van de productie met
      inachtneming van een redelijk rendement en omvat de operationele- en onderhoudslasten, de energiekosten en de
      kapitaalslasten.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.4
    text: |-
      In afwijking van het eerste lid kunnen de energiekosten als maandelijks te variëren onderdeel van de productieprijs
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.5
    text: |-
      De Autoriteit Consument en Markt hanteert voor de vaststelling van de productieprijs een methode ter bevordering
      van een doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.6
    text: |-
      Indien er sprake is van een geïntegreerd bedrijf vindt op basis van de in het eerste lid bedoelde prijs interne
      verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.7
    text: |-
      Indien op 1 januari de productieprijs nog niet is vastgesteld, geldt de laatst vastgestelde productieprijs tot de
      datum van inwerkingtreding van het besluit tot vaststelling van de productieprijs.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 2.5.8
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de procedure en de elementen en de wijze
      van berekening van de productieprijs, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel2.5
  - number: 3.1.1
    text: |-
      Het is verboden zonder een aanwijzing als bedoeld in [artikel 3.2][ref1] elektriciteit of drinkwater te
      distribueren.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.1
