        paragraaf: '4.2'
  - number: 3.2.1
    text: 'Onze Minister kan op aanvraag voor ieder openbaar lichaam één rechtspersoon aanwijzen als distributeur indien deze:'
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
  - number: 3.2.1.a
    text: |-
      beschikt over de benodigde organisatorische, financiële en technische kwaliteiten voor een goede uitvoering van
      zijn taken;
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
  - number: 3.2.1.b
    text: |-
      redelijkerwijs in staat kan worden geacht de verplichtingen na te komen en de taken uit te voeren, gesteld bij of
      krachtens [paragraaf 3.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.2
    references:
