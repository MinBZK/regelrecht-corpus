preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, om, gelet op het belang van het betrouwbaar, duurzaam
    en doelmatig functioneren van de elektriciteits- en de drinkwatervoorziening in Caribisch Nederland, regels te
    stellen inzake de productie en de distributie van elektriciteit en drinkwater;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aansluiting:* één of meer leidingen en
      daarmee verbonden hulpmiddelen ten behoeve van transport van elektriciteit of drinkwater die een net verbinden met
      een installatie;
        - *afnemer:* natuurlijke persoon of rechtspersoon die elektriciteit of drinkwater afneemt voor eigen gebruik;
        - *Autoriteit Consument en Markt:* Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bindende gedragslijn:* enkele last tot het verrichten van bepaalde handelingen ter bevordering van de naleving
      van wettelijke voorschriften die niet wegens een overtreding wordt opgelegd;
        - *distributie:* opslag, transport en levering van elektriciteit of drinkwater aan afnemers via netten of via
      transportmiddelen als bedoeld in [artikel 3.6][ref2];
        - *distributeur:* een distributeur van elektriciteit of drinkwater die op grond van [artikel 3.2][ref3] is
      aangewezen;
        - *drinkwater:* water bestemd voor drinken, koken of voedselbereiding, met uitzondering van water dat alleen door
      omgekeerde osmose is behandeld;
        - *drinkwaternet:* een leiding of een samenstel van leidingen en daarmee verbonden koppelingen, kleppen en
      andere technische voorzieningen van een distributeur voor het transport en de levering van drinkwater tot aan een
      installatie;
        - *elektriciteitsnet:* één of meer verbindingen en de daarmee verbonden transformator-, schakel-, verdeel- en
      onderstations en andere hulpmiddelen van een distributeur voor het transport en de levering van elektriciteit tot
      aan een installatie;
        - *geïntegreerd bedrijf:* bedrijf of groep van bedrijven waarin zowel productie van elektriciteit of drinkwater als
      distributie van elektriciteit respectievelijk drinkwater plaatsvindt;
        - *hernieuwbare elektriciteit:* elektriciteit, opgewekt in een productie-installatie die uitsluitend gebruik maakt
      van wind, zonne-energie, omgevingslucht, oppervlaktewater en aardwarmte, energie uit de oceanen, waterkracht,
      biomassa, stortgas, rioolwaterzuiveringsgas of biogas;
        - *installatie:* materieel dat, leidingen die en toestellen die: a. onderling duurzaam zijn verbonden, b. zijn
      bestemd voor of ten dienste staan aan het verbruik, de opslag of de productie van elektriciteit of drinkwater, c.
      worden gebruikt of beheerd door een afnemer of een producent en d. zich ten opzichte van het net bevinden achter de
      voorzieningen die het net beveiligen of, voor drinkwater, zijn gelegen binnen een woning of ander gebouw;
        - *net:* een elektriciteitsnet of een drinkwaternet;
        - *nooddrinkwater:* drinkwater dat bij een verstoring die langer duurt dan 24 uur ter beschikking wordt gesteld
      aan afnemers;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat voor zover het elektriciteit betreft of Onze
      Minister van Infrastructuur en Waterstaat voor zover het drinkwater betreft, tenzij anders bepaald;
        - *openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *producent:* producent van elektriciteit of drinkwater die op grond van [artikel 2.2, eerste lid][ref4], een
      vergunning heeft gekregen;
        - *productie van drinkwater:* bereiding en daarmee verband houdende opslag en transport van drinkwater tot aan het
      punt van levering aan een distributeur;
        - *toezichthouder:* door de Autoriteit Consument en Markt aangewezen toezichthouder of de krachtens
      [artikel 6.2, tweede of derde lid][ref5], aangewezen toezichthouder;
        - *verstoring:* uitval of aantasting van de productie of distributie van elektriciteit of drinkwater, waardoor de
      continuïteit van de distributie van elektriciteit of drinkwater wordt verbroken of in gevaar komt;
        - *woninginstallatie:* op een drinkwaternet aangesloten installatie die deel uitmaakt van een woning.


