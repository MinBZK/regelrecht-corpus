        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.1.2
    text: |-
      In afwijking van het eerste lid is geen aanwijzing nodig voor de distributie van nooddrinkwater door een krachtens
      [artikel 4.2, eerste lid][ref1], aangewezen nooddistributeur.


      [ref1]: https://wetten.overheid.nl/BWBR0037861#Artikel4
    url: https://wetten.overheid.nl/BWBR0037861/2023-01-01#Artikel3.1
    references:
