  - number: 6.6.2
    text: |-
      Onze Minister van Infrastructuur en Waterstaat kan in geval van overtreding van het bepaalde bij en krachtens
      [artikel 2.1][ref1], [2.3][ref2], [3.1][ref3], [3.5][ref4], [3.6][ref5], [3.9][ref6], [3.13][ref7], [4.2][ref8]
