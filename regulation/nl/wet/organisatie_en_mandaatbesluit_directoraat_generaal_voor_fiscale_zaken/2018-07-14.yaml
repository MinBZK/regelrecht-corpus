---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: organisatie_en_mandaatbesluit_directoraat_generaal_voor_fiscale_zaken
regulatory_layer: WET
publication_date: '2019-12-30'
valid_from: '2018-07-14'
bwb_id: BWBR0035773
url: https://wetten.overheid.nl/BWBR0035773/2018-07-14
preamble:
  text: |-
    Gelet op artikel 10 van het Organisatie- en mandaatbesluit ministerie van Financiën;

    Gehoord de Ondernemingsraad van het directoraat-generaal voor Fiscale Zaken;

    In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#ArtikelAanhef
articles:
  - number: '2.2'
    text: |-
      De directeuren zijn met inachtneming van de bepalingen in het
      [Organisatie- en mandaatbesluit ministerie van Financiën][ref1] verantwoordelijk voor hun beleidsterreinen zoals
      genoemd in [bijlage 1 van het Organisatie- en mandaat ministerie van Financiën][ref2], voor de samenhang tussen
      hun beleidsterreinen en voor de bijbehorende bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037135
      - id: ref2
        bwb_id: BWBR0037135
  - number: '2.3'
    text: |-
      In de bij dit besluit behorende [bijlage 2][ref1] wordt vastgesteld welke afdelingshoofden tevens plaatsvervangend
      directeur zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '3'
    text: |-
      In [bijlage 2][ref1] zijn de budgethouders aangewezen alsmede de budgetten waarvoor zij bevoegd zijn. De
      budgethouders zijn bevoegd verplichtingen – met financiële consequenties – aan te gaan en uitgaven goed te keuren
      binnen hun budgetten en passend binnen hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '4.1'
    text: |-
      De directeuren van de in [bijlage 1 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref1]
      genoemde directies en hun plaatsvervangers hebben binnen het kader van hun jaarplannen en binnen door de minister
      of namens de minister door de secretaris-generaal of de algemene leiding van het directoraat-generaal voor
      Fiscale Zaken gegeven richtlijnen mandaat tot het nemen van besluiten en afdoen van stukken betreffende alle
      beleidsaangelegenheden die behoren tot hun werkterrein genoemd in bijlage 1 van het Organisatie- en mandaatbesluit
      ministerie van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037135
  - number: '4.2'
    text: |-
      De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de onder
      de directeuren ressorterende functionarissen die daartoe worden gemandateerd in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '4.3'
    text: |-
      Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders in
      overleg met de algemene leiding van het directoraat-generaal voor Fiscale Zaken en/of met de bewindspersoon die
      het aangaat.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel4
  - number: '4.4'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS
      VAN FINANCIËN, namens deze, (handtekening) gevolgd door naam en functie van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel4
  - number: '5.1'
    text: |-
      De directeuren van de in [bijlage 1 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref1]
      genoemde directies en hun plaatsvervangers hebben, binnen het kader van hun jaarplannen en binnen door de minister
      of namens de minister door de secretaris-generaal of directeur-generaal voor Fiscale Zaken gegeven richtlijnen en
      behoudens de bepalingen in het [Organisatie- en Mandaatbesluit ministerie van Financiën][ref2], mandaat tot het
      nemen van besluiten en afdoen van stukken betreffende alle bedrijfsvoeringsaangelegenheden die behoren tot hun
      werkterrein genoemd in bijlage 1 van het Organisatie- en mandaatbesluit ministerie van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0037135
      [ref2]: https://wetten.overheid.nl/BWBR0035769
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037135
      - id: ref2
        bwb_id: BWBR0035769
  - number: '5.2'
    text: |-
      De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de onder
      de directeuren ressorterende functionarissen die daartoe worden gemandateerd in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '5.4'
    text: |-
      Onverminderd het eerste lid is de bevoegdheid tot het afdoen en ondertekenen van besluiten namens de in het eerste
      lid gemandateerde functionarissen toegekend aan het hoofd en het plaatsvervangend hoofd van de eenheid Organisatie
      & Personeel van de directie Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: '5.5'
    text: |-
      Aan de in het eerste lid gemandateerde functionarissen is voorbehouden het afdoen en ondertekenen van besluiten
      aangaande:
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.a
    text: vaststelling feitelijk opgedragen functie;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.b
    text: (verlengde) aanstellingsbesluiten;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.c
    text: ver- en herplaatsing;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.d
    text: aanstelling in vaste dienst;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.e
    text: tijdelijk opdragen van andere werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.f
    text: toekennen extra periodieke verhoging;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.g
    text: onthouden van een periodieke verhoging;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.h
    text: wijziging van salarisschaal;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.i
    text: incidentele beloning voor bijzondere prestaties;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: 5.5.j
    text: korting bezoldiging bij arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: '5.6'
    text: |-
      De ondertekening van uitgaande stukken zal luiden als volgt: DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS
      VAN FINANCIËN, namens deze, (handtekening) gevolgd door naam en functie van de (onder)gemandateerde functionaris.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel5
  - number: '6'
    text: |-
      Onderdeel van deze regeling vormt een mandaatregister dat is opgenomen in [bijlage 2][ref1]. Het mandaatregister
      bevat handtekeningen en parafen van de in de [artikelen 3][ref2], [4][ref3] en [5][ref4] gemandateerde
      functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
      [ref2]: https://wetten.overheid.nl/BWBR0035773#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035773#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0035773#Artikel5
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035773
      - id: ref2
        bwb_id: BWBR0035773
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035773
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0035773
        artikel: '5'
  - number: '7'
    text: |-
      De in [artikel 3][ref1] en [artikel 4][ref2] tweede lid gemandateerde functionarissen zijn verantwoordelijk voor
      een adequate uitvoering van het toegekende mandaat.


      [ref1]: https://wetten.overheid.nl/BWBR0035773#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035773#Artikel4
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035773
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035773
        artikel: '4'
  - number: '8'
    text: |-
      De volgende regeling wordt ingetrokken: Organisatie- en mandaatbesluit directoraat-generaal voor Fiscale Zaken,
      zoals laatstelijk gewijzigd bij besluit van 25 mei 2010.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot 1 mei 2014.
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Organisatie- en mandaatbesluit directoraat-generaal voor Fiscale Zaken.'
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-14#Artikel10
