preamble:
  text: |-
    Gelet op artikel 10 van het Organisatie- en mandaatbesluit ministerie van Financiën;

    Gehoord de Ondernemingsraad van het directoraat-generaal voor Fiscale Zaken;

    In overeenstemming met de secretaris-generaal;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035773/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De directeur-generaal voor Fiscale Zaken en de plaatsvervangend directeur-generaal voor Fiscale Zaken vormen de
      algemene leiding van het directoraat-generaal voor Fiscale Zaken.

      2 Een van de directeuren van het directoraat-generaal voor Fiscale Zaken is tevens de plaatsvervangend directeur-
      generaal voor Fiscale Zaken.

      3 In de bij dit besluit behorende [bijlage 2][ref1] wordt vastgesteld welke directeur tevens plaatsvervangend
      directeur-generaal is.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '2'
    text: |-
      1 De organisatie en taken van de onder de directeur-generaal voor Fiscale Zaken ressorterende directies worden
      vastgesteld zoals weergegeven in de bij dit besluit behorende [bijlage 1][ref1].

      2 De directeuren zijn verantwoordelijk voor hun beleidsterreinen zoals genoemd in [bijlage 1][ref2], voor de
      samenhang tussen hun beleidsterreinen en voor de bijbehorende bedrijfsvoering.

      3 In de bij dit besluit behorende [bijlage 2][ref3] wordt vastgesteld welke afdelingshoofden tevens
      plaatsvervangend directeur zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
      [ref2]: https://wetten.overheid.nl/BWBR0035773
      [ref3]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035773
      - id: ref2
        bwb_id: BWBR0035773
      - id: ref3
        bwb_id: BWBR0035773
  - number: '3'
    text: |-
      In [bijlage 2][ref1] zijn de budgethouders aangewezen alsmede de budgetten waarvoor zij bevoegd zijn. De
      budgethouders zijn bevoegd verplichtingen – met financiële consequenties – aan te gaan en uitgaven goed te keuren
      binnen hun budgetten en passend binnen hun taken.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035773
  - number: '4'
    text: |-
      1 De directeuren van de in [bijlage 1][ref1] genoemde directies en hun plaatsvervangers hebben binnen het kader van
      hun jaarplannen en binnen door de minister of namens de minister door de secretaris-generaal of de algemene leiding
      van het directoraat-generaal voor Fiscale Zaken gegeven richtlijnen mandaat tot het nemen van besluiten en afdoen
      van stukken betreffende alle beleidsaangelegenheden die behoren tot hun werkterrein genoemd in [bijlage 1][ref2].

      2 De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de
      onder de directeuren ressorterende functionarissen die daartoe worden gemandateerd in [bijlage 2][ref3].

      3 Over vraagstukken die van politiek gevoelige of anderszins zwaarwegende aard zijn, treden mandaathouders in
      overleg met de algemene leiding van het directoraat-generaal voor Fiscale Zaken en/of met de bewindspersoon die
      het aangaat.

      4 De ondertekening van uitgaande stukken zal luiden als volgt:

      DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,

      namens deze,

      (handtekening)

      gevolgd door naam en functie van de (onder)gemandateerde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0035773
      [ref2]: https://wetten.overheid.nl/BWBR0035773
      [ref3]: https://wetten.overheid.nl/BWBR0035773
    url: https://wetten.overheid.nl/BWBR0035773/2018-07-01#Artikel4
