        bwb_id: BWBR0035773
  - number: '5'
    text: |-
      1 De directeuren van de in [bijlage 1][ref1] genoemde directies en hun plaatsvervangers hebben, binnen
      het kader van hun jaarplannen en binnen door de minister of namens de minister door de secretaris-
      generaal of directeur-generaal voor Fiscale Zaken gegeven richtlijnen en behoudens de bepalingen in het
      [Organisatie- en Mandaatbesluit ministerie van Financiën][ref2], mandaat tot het nemen van besluiten en
      afdoen van stukken betreffende alle bedrijfsvoeringsaangelegenheden die behoren tot hun werkterrein genoemd in
      [bijlage 1][ref3].

      2 De in het eerste lid toegekende mandaten kunnen binnen het kader van hun taken ook worden uitgeoefend door de
      onder de directeuren ressorterende functionarissen die daartoe worden gemandateerd in [bijlage 2][ref4].

      3 Aan de algemene leiding van het directoraat-generaal voor Fiscale Zaken is voorbehouden het nemen en ondertekenen
      van besluiten aangaande:

      a. alle beslissingen betreffende plaatsing, ontslag en bezoldiging van medewerkers vanaf schaal 15, behoudens het
      bepaalde in [artikel 20 van het Organisatie- en mandaatbesluit ministerie van Financiën][ref5];

      b. vaststellen van de formatie;

      c. bijzondere aanstelling in tijdelijke dienst ([artikel 6a ARAR][ref6]);

      d. (tijdelijke) plaatsing in het buitenland;

      e. bezoldigingsbeslissingen op basis van [artikel 8 BBRA][ref7] en [artikel 22a BBRA][ref8] met uitzondering van de
      toekenning van incidentele beloningen voor bijzondere prestaties;

      f. disciplinaire maatregelen ([hoofdstuk 8 ARAR][ref9]);

      g. schadeloosstelling ([artikel 69 ARAR][ref10]);

      h. reorganisatieontslag ([artikel 96 ARAR][ref11]);

      i. vertrekregelingen;

      j. ontslag op andere gronden ([artikel 99 ARAR][ref12]);

      k. aanbestedingsprocedures, indien een andere dan de procedures als bedoeld in de [hoofdstukken 1.2][ref13] en
      [2.1 van de Aanbestedingswet 2012][ref14] wordt gevolgd.

      4 Onverminderd het eerste lid is de bevoegdheid tot het afdoen en ondertekenen van besluiten namens de in het
      eerste lid gemandateerde functionarissen toegekend aan het hoofd en het plaatsvervangend hoofd van de eenheid
      Organisatie & Personeel van de directie Bedrijfsvoering.

      5 Aan de in het eerste lid gemandateerde functionarissen is voorbehouden het afdoen en ondertekenen van besluiten
      aangaande:

      a. vaststelling feitelijk opgedragen functie;

      b. (verlengde) aanstellingsbesluiten;

      c. ver- en herplaatsing;

      d. aanstelling in vaste dienst;

      e. tijdelijk opdragen van andere werkzaamheden;

      f. toekennen extra periodieke verhoging;

      g. onthouden van een periodieke verhoging;

      h. wijziging van salarisschaal;

      i. incidentele beloning voor bijzondere prestaties;

      j. korting bezoldiging bij arbeidsongeschiktheid;

      6 De ondertekening van uitgaande stukken zal luiden als volgt:

      DE MINISTER VAN FINANCIËN, resp. DE STAATSSECRETARIS VAN FINANCIËN,

      namens deze,

      (handtekening)

      gevolgd door naam en functie van de (onder)gemandateerde functionaris.


