  - number: '4'
    text: |-
      1 Van het voornemen graskarpers uit te zetten, dient tevoren mededeling te worden gedaan aan de directie Visserij
      van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.

      2 Deze mededeling wordt gedaan op een bij de Dienst Regelingen verkrijgbaar formulier.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel5
