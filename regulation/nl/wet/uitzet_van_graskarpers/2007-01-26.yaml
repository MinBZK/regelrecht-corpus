---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitzet_van_graskarpers
regulatory_layer: WET
publication_date: '2008-09-26'
valid_from: '2007-01-26'
bwb_id: BWBR0004763
url: https://wetten.overheid.nl/BWBR0004763/2007-01-26
preamble:
  text: |-
    Gelet op artikel 17, eerste en derde lid, van de Visserijwet 1963 (Stb. 312);

    Gezien de adviezen van de Natuurbeschermingsraad en de Raad voor de Binnenvisserij;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De toestemming als bedoeld in [artikel 17, eerste lid, van de Visserijwet 1963][ref1] wordt verleend voor het
      uitzetten van de graskarper (Ctenopharyngodon idella) onder de navolgende voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel17
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '17'
  - number: '2.1'
    text: 'Het uitzetten van de graskarper is slechts toegestaan:'
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.1.a
    text: met instemming van de eigenaar van het water waarin de graskarper wordt uitgezet en
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.1.b
    text: 'in een water voor zover dat:'
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.1.b.1
    text: niet in enige open verbinding staat met andere wateren dan wel
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.1.b.2
    text: |-
      van andere wateren is gescheiden door een hekwerk, bestaande uit een spijlenhek met een onderlinge afstand tussen
      de spijlen van ten hoogste 3 cm of een gaashek, gegalvaniseerd en gelast met vierkante mazen van ten hoogste 2.5
      cm.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: '2.2'
    text: 'Het hekwerk bedoeld in het eerste lid, dient:'
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.2.a
    text: in bodem en talud te zijn ingegraven;
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.2.b
    text: |-
      voorzien te zijn van een springflap van circa 50 cm schuin omhoog geplaatst onder een hoek van ca. 45° in de
      richting van het water waarin de graskarper wordt uitgezet en
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: 2.2.c
    text: |-
      met inbegrip van de onder b, bedoelde springflap bij de hoogste waterstand ten minste 50 cm boven water uit te
      steken.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: '2.3'
    text: |-
      Het hekwerk dient aanwezig te blijven en in deugdelijke staat te worden gehouden zolang de graskarper in het water
      dat met het hekwerk wordt afgesloten, aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel2
  - number: '3'
    text: |-
      De toestemming als bedoeld in [artikel 1][ref1] geldt niet voor het uitzetten van graskarpers in:


      [ref1]: https://wetten.overheid.nl/BWBR0004763#Artikel1
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004763
        artikel: '1'
  - number: 3.a
    text: beken en rivieren;
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel3
  - number: 3.b
    text: |-
      wateren die geheel dan wel ten dele zijn gelegen in gebieden als bedoeld in [artikel 10][ref1], [10a][ref2] en
      [12 van de Natuurbeschermingswet 1998][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009641#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0009641#Artikel12
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009641
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009641
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0009641
        artikel: '12'
  - number: 3.c
    text: |-
      wateren die geheel dan wel ten dele zijn gelegen op percelen die als natuurgebied zijn aangewezen in een
      bestemmingsplan als bedoeld in [artikel 10, eerste en tweede lid, van de Wet op de ruimtelijke ordening][ref1]
      (Stb. 1985, 626), dat is goedgekeurd op grond van [artikel 28 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel28
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '28'
  - number: '4.1'
    text: |-
      Van het voornemen graskarpers uit te zetten, dient tevoren mededeling te worden gedaan aan de directie Visserij van
      het Ministerie van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel4
  - number: '4.2'
    text: Deze mededeling wordt gedaan op een bij de Dienst Regelingen verkrijgbaar formulier.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004763/2007-01-26#Artikel5
