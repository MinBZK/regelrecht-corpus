  - number: '4'
    text: >-
      1 Van het voornemen graskarpers uit te zetten, dient tevoren mededeling te worden gedaan aan LASER.


      2 Deze mededeling wordt gedaan op een bij LASER verkrijgbaar formulier.
    url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#Artikel4
  - number: '5'
    text: Deze regeling treedt in werking met ingang van de dag na die van haar bekendmaking in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#Artikel5
