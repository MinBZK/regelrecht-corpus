preamble:
  text: >-
    Gelet op artikel 17, eerste en derde lid, van de Visserijwet 1963 (Stb. 312);


    Gezien de adviezen van de Natuurbeschermingsraad en de Raad voor de Binnenvisserij;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De toestemming als bedoeld in [artikel 17, eerste lid, van de Visserijwet 1963][ref1] wordt verleend voor het
      uitzetten van de graskarper (Ctenopharyngodon idella) onder de navolgende voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416#Artikel17
    url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
        artikel: '17'
  - number: '2'
    text: >-
      1 Het uitzetten van de graskarper is slechts toegestaan:


      a. indien de graskarper van of door tussenkomst van de Organisatie ter Verbetering van de Binnenvisserij wordt
      betrokken;


      b. met instemming van de eigenaar van het water waarin de graskarper wordt uitgezet en


      c. in een water voor zover dat:


      1. niet in enige open verbinding staat met andere wateren dan wel


      2. van andere wateren is gescheiden door een hekwerk, bestaande uit een spijlenhek met een onderlinge afstand
      tussen de spijlen van ten hoogste 3 cm of een gaashek, gegalvaniseerd en gelast met vierkante mazen van ten hoogste
      2.5 cm.


      2 Het hekwerk bedoeld in het eerste lid, dient:


      a. in bodem en talud te zijn ingegraven;


      b. voorzien te zijn van een springflap van circa 50 cm schuin omhoog geplaatst onder een hoek van ca. 45° in de
      richting van het water waarin de graskarper wordt uitgezet en


      c. met inbegrip van de onder b, bedoelde springflap bij de hoogste waterstand ten minste 50 cm boven water uit
      te steken.


      3 Het hekwerk dient aanwezig te blijven en in deugdelijke staat te worden gehouden zolang de graskarper in het
      water dat met het hekwerk wordt afgesloten, aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#Artikel2
  - number: '3'
    text: |-
      De toestemming als bedoeld in [artikel 1][ref1] geldt niet voor het uitzetten van graskarpers in:

      a. beken en rivieren;

      b. wateren die geheel dan wel ten dele zijn gelegen op percelen die als beschermd natuurmonument zijn aangewezen op
      grond van [artikel 7, eerste lid, van de Natuurbeschermingswet][ref2] (Stb. 1967, 572);

      c. wateren die geheel dan wel ten dele zijn gelegen op percelen die als beschermd staatsnatuurmonument zijn
      aangewezen op grond van [artikel 21, eerste lid, van de Natuurbeschermingswet][ref3];

      d. wateren die geheel dan wel ten dele zijn gelegen op percelen die als natuurgebied zijn aangewezen in een
      bestemmingsplan als bedoeld in [artikel 10, eerste en tweede lid, van de Wet op de ruimtelijke ordening][ref4]
      (Stb. 1985, 626), dat is goedgekeurd op grond van artikel 28 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004763#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002611#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel10
    url: https://wetten.overheid.nl/BWBR0004763/1996-12-18#Artikel3
