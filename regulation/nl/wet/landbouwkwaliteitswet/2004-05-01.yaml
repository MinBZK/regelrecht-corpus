preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van de afzet een algemene regeling vast
    te stellen betreffende de kwaliteit van voortbrengselen van de landbouw en de visserij;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder: Onze Minister: Onze
      Minister van Landbouw en Visserij; landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw -
      daaronder begrepen fruitteelt en het kweken van bomen, bloemen en bloembollen -, teelt van griendhout en elke
      andere vorm van bodemcultuur met inbegrip van bosbouw; visserij: het vangen of kweken van vissen, schaal- en
      schelpdieren; produkten: alle voortbrengselen van de landbouw en de visserij, alsmede de bij be- of verwerking
      daarvan verkregen voortbrengselen, derivaten en afvallen; bedrijfslichaam: een bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1], ingesteld voor ondernemingen, die in het
      bedrijfsleven een functie vervullen ten aanzien van enig produkt; landbouwkwaliteitsbesluit: een algemene maatregel
      van bestuur, bedoeld in [artikel 2][ref2]; controle-instelling: een privaatrechtelijke rechtspersoon met volledige
      rechtsbevoegdheid, bedoeld in [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt mede verstaan onder: in- en uitvoer: iedere
      handeling, die kennelijk rechtstreeks gericht is op het bewerkstelligen van invoer, onderscheidenlijk uitvoer.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel1
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van de afzet regelen worden gesteld
      betreffende de kwaliteit van produkten. Deze regelen kunnen betrekking hebben op de oorsprong, de hoedanigheid,
      de sortering, de verzorging, de verpakking, de vorm, de afwerking, de aanduiding, de maat en het gewicht van
      produkten, alsmede op de betaling naar gelang van de kwaliteit van produkten.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur, in het eerste lid bedoeld, kunnen tevens regelen worden
      gesteld inzake
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.a
    text: de inrichting en het gebruik, met betrekking tot produkten, van bedrijfsgebouwen en vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.b
    text: het gebruik en verbruik, met betrekking tot produkten, van toevoegingen, grond- en hulpstoffen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.c
    text: de be- en verwerkingswijzen van produkten;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.d
    text: het gebruik, met betrekking tot produkten, van machines, werktuigen en gereedschappen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.e
    text: de hoedanigheid en het gebruik van verpakkingsmiddelen voor produkten;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: 2.2.f
    text: |-
      de verplichting voor een controle-instelling tot betaling aan bij haar aangeslotenen van door hen verschuldigde
      toeslagen in verband met de kwaliteit van produkten, alsmede de verplichting voor deze aangeslotenen tot betaling
      aan de controle-instelling van toegepaste kortingen in verband met de kwaliteit van produkten en van andere
      geldsommen ter financiering van de toeslagen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: '2.3'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, in het eerste lid
      bedoeld, wordt Ons gedaan door Onze Minister en Onze Ministers, wie het mede aangaat, tezamen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens een landbouwkwaliteitsbesluit kan worden voorzien in het verlenen van vrijstelling, en, op
      aanvrage, ontheffing van hetgeen bij of krachtens dat besluit is geregeld.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      Aan vrijstellingen en ontheffingen, bedoeld in het eerste lid, kunnen voorschriften worden verbonden. Zij kunnen
      onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel3
  - number: '4.1'
    text: |-
      Bij of krachtens een landbouwkwaliteitsbesluit kan medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regelen
      bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister en van Onze Ministers, wie het
      mede aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voor zover zulks bij of krachtens het
      landbouwkwaliteitsbesluit is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel4
  - number: '4.3'
    text: |-
      Verordeningen, bedoeld in het tweede lid, kunnen onder meer inhouden toekenning aan een daarbij aan te wijzen
      orgaan van de bevoegdheid vrijstelling, en, op aanvrage, ontheffing van die verordeningen of krachtens deze vast te
      stellen voorschriften te verlenen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel4
  - number: '4.4'
    text: |-
      [Artikel 3, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel3
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '3'
  - number: '5.1'
    text: |-
      Wij bepalen bij algemene maatregel van bestuur, in welke gevallen Onze Minister of Onze Minister en Onze Ministers,
      wie het mede aangaat, tezamen regelen krachtens een landbouwkwaliteitsbesluit ten aanzien van ondernemingen, waarin
      daarbij aan te wijzen bedrijven op het gebied van industrie, handel en ambacht worden uitgeoefend, niet vaststellen
      dan in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel5
  - number: '5.2'
    text: |-
      Bij dat besluit bepalen Wij tevens, in welke gevallen Onze Minister of Onze Minister en Onze Ministers, wie het
      mede aangaat, tezamen regelen krachtens een landbouwkwaliteitsbesluit niet vaststellen dan in overeenstemming met
      Onze Minister van Economische Zaken met het oog op de daarbij betrokken consumentenbelangen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel5
  - number: '5.3'
    text: |-
      In zodanige gevallen behoeven verordeningen van bedrijfslichamen, als bedoeld in [artikel 4][ref1], mede de
      goedkeuring van Onze genoemde Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel4
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '4'
  - number: '6.1'
    text: |-
      In een landbouwkwaliteitsbesluit kan worden bepaald, dat de ten in- of uitvoer bestemde produkten, waarop het
      betrekking heeft, ten invoer, onderscheidenlijk ten uitvoer moeten worden aangeboden op door Onze Minister en Onze
      Ministers, wie het mede aangaat, tezamen in overeenstemming met Onze Minister van Financiën aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel6
  - number: '6.2'
    text: De in- en uitvoer, anders dan met inachtneming van het bepaalde krachtens het eerste lid, is verboden.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel6
  - number: '7.1'
    text: |-
      Indien bij of krachtens een landbouwkwaliteitsbesluit regelen zijn gesteld omtrent keuring van produkten, kunnen
      daarbij merken, tekenen of bewijsstukken worden vastgesteld als uitsluitend bestemd om door of vanwege de daartoe
      gerechtigde op produkten of op hun verpakking te worden aangebracht, dan wel bij die produkten te worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens een besluit, in het eerste lid bedoeld, kunnen regelen worden gesteld betreffende het
      vervaardigen, voorhanden en in voorraad hebben, zomede het afleveren en gebruiken van merken, tekenen of
      bewijsstukken en van cliché's, stempels en andere werktuigen tot het vervaardigen of aanbrengen van die merken,
      tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel7
  - number: '8.1'
    text: |-
      In een landbouwkwaliteitsbesluit kunnen een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid worden belast met het toezicht op de naleving door de bij hen aangeslotenen van bij of krachtens
      dat besluit gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel8
  - number: '8.2'
    text: |-
      In een landbouwkwaliteitsbesluit kunnen een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid worden belast met de keuring, bedoeld in artikel 7, of met het toezicht daarop. Zij kunnen
      daarbij tevens bevoegd worden verklaard tot het uitreiken van merken, tekenen of bewijsstukken, in hetzelfde
      artikel bedoeld.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel8
  - number: '8.3'
    text: |-
      In een landbouwkwaliteitsbesluit kunnen één of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid worden belast met de uitvoering van de bij of krachtens dat besluit gestelde regelen inzake de
      betaling naar gelang van de kwaliteit van produkten.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel8
  - number: '9.1'
    text: |-
      In een landbouwkwaliteitsbesluit kan worden bepaald, dat gedragingen, ter zake waarvan bij of krachtens dat besluit
      regelen zijn gesteld, uitsluitend zijn toegestaan aan degenen, die zijn aangesloten bij een controle-instelling,
      daarbij krachtens [artikel 8][ref1] aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '9.2'
    text: |-
      In een landbouwkwaliteitsbesluit kan worden bepaald, dat controle-instellingen, welke daarin krachtens
      [artikel 8][ref1] bevoegd zijn verklaard tot het uitreiken van merken, tekenen of bewijsstukken, in
      [artikel 7][ref2] bedoeld, die merken, tekenen of bewijsstukken slechts mogen uitreiken aan of ten behoeve van bij
      hen aangeslotenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel7
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '7'
  - number: '10.1'
    text: 'Een controle-instelling dient te voldoen aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: 10.1.a
    text: |-
      zij moet ten doel hebben, door middel van het uitoefenen van toezicht of van keuring, de goede hoedanigheid,
      sortering, verzorging, verpakking, vorm, afwerking of aanduiding van een of meer produkten te bevorderen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: 10.1.b
    text: zij mag niet werkzaam zijn met het oogmerk winst te behalen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: 10.1.c
    text: |-
      zij moet ieder als aangeslotene toelaten, die haar schriftelijk de wens te kennen geeft zich overeenkomstig het in
      de statuten bepaalde aan haar toezicht te onderwerpen;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: 10.1.d
    text: zij moet door de samenstelling van haar bestuur een algemeen de belanghebbenden vertegenwoordigend karakter hebben;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: 10.1.e
    text: |-
      zij moet, indien bij of krachtens een landbouwkwaliteitsbesluit overeenkomstig [artikel 7][ref1] een keuring is
      voorgeschreven, een reglement vaststellen betreffende het verloop van de keuring en van het uitreiken van merken,
      tekenen en bewijsstukken, bedoeld in [artikel 7][ref2], indien de instelling overeenkomstig [artikel 8][ref3] tot
      dat keuren en uitreiken bevoegd is verklaard; zij moet in dat reglement tevens regelen stellen inzake het maken van
      bezwaar tegen bij de keuring genomen beslissingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '10.2'
    text: |-
      Een controle-instelling als bedoeld in [artikel 8, derde lid][ref1], moet in zoverre in afwijking van het in het
      eerste lid bepaalde: - ten doel hebben de goede hoedanigheid van een of meer produkten door middel van betaling
      naar gelang van de kwaliteit te bevorderen;
        - één of meer reglementen vaststellen welke een goede uitvoering van de regelen inzake de betaling van produkten
      naar gelang van de kwaliteit waarborgen; zij moet in die reglementen tevens regelen stellen inzake het maken van
      bezwaar tegen andere besluiten dan algemeen geldende voorschriften van één der organen van de controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '10.3'
    text: |-
      De statuten en reglementen, alsmede wijzigingen daarvan behoeven de goedkeuring van Onze Minister en van Onze
      Ministers, wie het mede aangaat, te zamen. Zij worden door de zorg van Onze Minister in de *Staatscourant*
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel10
  - number: '11.1'
    text: |-
      Een controle-instelling kan bedragen vaststellen voor de kosten van toezicht, keuring en, indien zij is een
      controle-instelling, bedoeld in [artikel 8, derde lid][ref1], de in dat lid bedoelde uitvoering; zij regelt daarbij
      de wijze van inning van het uit dien hoofde door aangeslotenen verschuldigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '11.2'
    text: |-
      Regelingen, bedoeld in het eerste lid, behoeven de goedkeuring van Onze Minister. Zij worden door de zorg van Onze
      Minister in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister benoemt de voorzitter van een controle-instelling, overeenkomstig het daaromtrent bij
      landbouwkwaliteitsbesluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel12
  - number: '12.2'
    text: De benoeming van een directeur van een controle-instelling behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel12
  - number: '12.3'
    text: |-
      De door Onze Minister aan te wijzen ambtenaren hebben recht van toegang tot de vergaderingen van het bestuur van
      een instelling. Zij hebben daarin een raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel12
  - number: '12.4'
    text: |-
      Op een controle-instelling wordt rijkstoezicht uitgeoefend vanwege Onze Minister volgens door deze vast te
      stellen regelen. Zij is verplicht ten behoeve van het welslagen daarvan alle inlichtingen te verstrekken en alle
      medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel12
  - number: '13.1'
    text: |-
      Bij overtreding van bij of krachtens een landbouwkwaliteitsbesluit gestelde regelen kunnen een of meer van de
      volgende tuchtrechtelijke maatregelen worden opgelegd:
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: 13.1.a
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: 13.1.b
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: 13.1.c
    text: het stellen van de betrokkene onder verscherpte controle op zijn kosten voor ten hoogste twee jaren;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: 13.1.d
    text: openbaarmaking van de uitspraak op kosten van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: '13.2'
    text: |-
      De controle-instelling regelt bij reglement de samenstelling en bevoegdheid van haar organen die de
      tuchtrechtspraak uitoefenen, alsmede de rechtsgang van het tuchtrechtelijk geding, een en ander met inachtneming
      van bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: '13.3'
    text: |-
      De [artikelen 1, onderdeel b][ref1], [3 tot en met 6][ref2], [21 tot en met 25][ref3], [27 tot en met 41][ref4],
      [42, eerste lid][ref5], en [44 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref6] zijn van overeenkomstige
      toepassing, met dien verstande dat onder «de voorzitter van het bedrijfslichaam» en «bedrijfslichaam» in die
      artikelen telkens moet worden verstaan: de controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0016341#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0016341#Artikel42
      [ref6]: https://wetten.overheid.nl/BWBR0016341#Artikel44
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016341
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0016341
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0016341
        artikel: '27'
      - id: ref5
        bwb_id: BWBR0016341
        artikel: '42'
      - id: ref6
        bwb_id: BWBR0016341
        artikel: '44'
  - number: '13.4'
    text: |-
      De controle-instelling geeft aan de opbrengsten van de geldboeten een bijzondere bestemming, welke de goedkeuring
      van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
  - number: '13.5'
    text: |-
      In afwijking van [artikel 7:1 van de Algemene wet bestuursrecht][ref1] kan tegen een besluit van een tuchtgerecht
      of een centraal tuchtgerecht, ingesteld door een controle-instelling, geen bezwaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '14'
    text: |-
      Tegen een besluit van Onze Minister of van Onze Minister en Onze Ministers, wie het mede aangaat, tezamen,
      krachtens een landbouwkwaliteitsbesluit genomen, tot verlening, weigering of intrekking van een vergunning of
      ontheffing, kan een belanghebbende beroep instellen bij het College van Beroep voor het bedrijfsleven. Gelijk
      beroep staat open tegen zodanige besluiten van controle-instellingen.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel14
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van bij of krachtens een landbouwkwaliteitsbesluit gestelde eisen voor zover het
      betreft de bij een controle-instelling aangeslotenen, zijn belast de bij besluit van Onze Minister aangewezen
      personen, in dienst van die instelling. De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '15.2'
    text: |-
      Onze Minister en Onze Ministers, wie het mede aangaat, kunnen tezamen nadere voorschriften geven betreffende de
      monsterneming, de verpakking, de conservering, de verzegeling, de verzending en het onderzoek der monsters.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel15
  - number: '15.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel15
  - number: '18.1'
    text: |-
      Aan het slot van [artikel 1, onder 4][ref1] wordt toegevoegd de zinsnede: de Landbouwkwaliteitswet, de artikelen 2,
      eerste en tweede lid, 3, tweede lid, 4, vierde lid, 6 en 9, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '18.2'
    text: |-
      [Artikel 13][ref1] vindt geen toepassing, indien de Officier van Justitie, na overleg met de controle-instelling,
      heeft beslist, dat een overtreding strafrechtelijk zal worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel13
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '13'
  - number: '19.1'
    text: |-
      Met ingang van het tijdstip, waarop een landbouwkwaliteitsbesluit in werking treedt ten aanzien van een produkt,
      met betrekking waartoe bij of krachtens een van de volgende wetten, wetsdelen of besluiten, regelen zijn gesteld,
      wordt die wet, dat wetsdeel of dat besluit ten aanzien van dat produkt buiten werking gesteld:
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
  - number: 19.1.a
    text: |-
      de wet van 17 juni 1905, *Stb.* 213, houdende bepalingen betreffende het merken van boter, afkomstig van
      aangeslotenen bij een onder Rijkstoezicht staand botercontrolestation;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
  - number: 19.1.b
    text: |-
      de wet van 17 juli 1911, *Stb.* 209, houdende bepalingen betreffende het merken van kaas, afkomstig van
      aangeslotenen bij een kaascontrolestation, hetwelk zich onder Rijkstoezicht heeft gesteld;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
  - number: 19.1.c
    text: de wet van 31 mei 1929, *Stb.* 276, houdende bepalingen betreffende de in- en doorvoer van kippe- en eende-eieren;
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
  - number: 19.1.d
    text: |-
      de artikelen 5-7 van de [Landbouwuitvoerwet][ref1] 1929;


      [ref1]: https://wetten.overheid.nl/BWBR0001990
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001990
  - number: 19.1.e
    text: |-
      de Uitvoercontrolebesluiten, vastgesteld op grond van [artikel 2 der Landbouwuitvoerwet 1938][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel2
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '2'
  - number: '19.2'
    text: |-
      Elke der in het vorige lid genoemde wetten vervalt met ingang van het tijdstip, waarop alle regelen, vastgesteld
      bij of krachtens die wet of de daarvan vermelde artikelen, buiten werking zijn getreden.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel19
  - number: '20.1'
    text: 'Deze wet kan worden aangehaald als: "Landbouwkwaliteitswet".'
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel20
  - number: '20.2'
    text: Zij treedt in werking met ingang van een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002755/2004-05-01#Artikel20
