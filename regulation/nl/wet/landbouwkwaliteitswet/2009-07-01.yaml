preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter bevordering van de afzet een algemene regeling vast
    te stellen betreffende de kwaliteit van voortbrengselen van de landbouw en de visserij;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder: - Onze Minister: Onze Minister
      van Landbouw, Natuur en Voedselkwaliteit;
        - landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw – waaronder mede wordt verstaan
      fruitteelt en het kweken van bomen, bloemen en bloembollen -, teelt van griendhout en elke andere vorm van
      bodemcultuur met inbegrip van bosbouw;
        - visserij: het vangen of kweken van vissen, schaal- en schelpdieren;
        - produkten: alle voortbrengselen van de landbouw en de visserij, alsmede de bij be- of verwerking daarvan
      verkregen voortbrengselen, derivaten en afvallen;
        - bedrijfslichaam: een bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1], ingesteld voor ondernemingen, die in het
      bedrijfsleven een functie vervullen ten aanzien van enig produkt;
        - landbouwkwaliteitsbesluit: een algemene maatregel van bestuur, bedoeld in [artikel 2][ref2];
        - controle-instelling: een privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid, bedoeld in
      [artikel 8][ref3];
        - verordening 510/2006: verordening (EG) nr. 510/2006 van de Raad van 20 maart 2006 inzake de bescherming van
      geografische aanduidingen en oorsprongsbenamingen van landbouwproducten en levensmiddelen (PbEU L 93);
        - geografische aanduiding: geografische aanduiding als bedoeld in artikel 2, eerste lid, onder b, van verordening
      510/2006;
        - houder van de geografische aanduiding: een natuurlijke of rechtspersoon, die op grond van verordening 510/2006
      gerechtigd is een geografische aanduiding te bezigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '2.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van de afzet regelen worden gesteld
      betreffende de kwaliteit van produkten. Deze regelen kunnen betrekking hebben op de oorsprong, de hoedanigheid,
      de sortering, de verzorging, de verpakking, de vorm, de afwerking, de aanduiding, de maat en het gewicht van
      produkten.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Bij of krachtens een algemene maatregel van bestuur, in het eerste lid bedoeld, kunnen tevens regelen worden
      gesteld inzake
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.a
    text: de inrichting en het gebruik, met betrekking tot produkten, van bedrijfsgebouwen en vervoermiddelen;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.b
    text: het gebruik en verbruik, met betrekking tot produkten, van toevoegingen, grond- en hulpstoffen;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.c
    text: de be- en verwerkingswijzen van produkten;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.d
    text: het gebruik, met betrekking tot produkten, van machines, werktuigen en gereedschappen;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.e
    text: de hoedanigheid en het gebruik van verpakkingsmiddelen voor produkten;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: 2.2.f
    text: de registratie van de onder die maatregel vallende betrokkenen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Een voordracht tot vaststelling, wijziging of intrekking van een algemene maatregel van bestuur, in het eerste lid
      bedoeld, wordt Ons gedaan door Onze Minister en Onze Ministers, wie het mede aangaat, tezamen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      Bij of krachtens een landbouwkwaliteitsbesluit kan worden voorzien in het verlenen van vrijstelling, en, op
      aanvrage, ontheffing van hetgeen bij of krachtens dat besluit is geregeld.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      Aan vrijstellingen en ontheffingen, bedoeld in het eerste lid, kunnen voorschriften worden verbonden. Zij kunnen
      onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Bij of krachtens een landbouwkwaliteitsbesluit kan medewerking worden gevorderd van het bestuur van een
      bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat in het stellen van nadere regelen
      bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister en van Onze Ministers, wie het
      mede aangaat, tezamen. Krachtens de verordening genomen besluiten behoeven, voor zover zulks bij of krachtens het
      landbouwkwaliteitsbesluit is bepaald, de goedkeuring van de daarbij aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel4
  - number: '4.3'
    text: |-
      Verordeningen, bedoeld in het tweede lid, kunnen onder meer inhouden toekenning aan een daarbij aan te wijzen
      orgaan van de bevoegdheid vrijstelling, en, op aanvrage, ontheffing van die verordeningen of krachtens deze vast te
      stellen voorschriften te verlenen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      [Artikel 3, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel3
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '3'
  - number: '5.1'
    text: |-
      Wij bepalen bij algemene maatregel van bestuur, in welke gevallen Onze Minister of Onze Minister en Onze Ministers,
      wie het mede aangaat, tezamen regelen krachtens een landbouwkwaliteitsbesluit ten aanzien van ondernemingen, waarin
      daarbij aan te wijzen bedrijven op het gebied van industrie, handel en ambacht worden uitgeoefend, niet vaststellen
      dan in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel5
  - number: '5.2'
    text: |-
      Bij dat besluit bepalen Wij tevens, in welke gevallen Onze Minister of Onze Minister en Onze Ministers, wie het
      mede aangaat, tezamen regelen krachtens een landbouwkwaliteitsbesluit niet vaststellen dan in overeenstemming met
      Onze Minister van Economische Zaken met het oog op de daarbij betrokken consumentenbelangen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel5
  - number: '5.3'
    text: |-
      In zodanige gevallen behoeven verordeningen van bedrijfslichamen, als bedoeld in [artikel 4][ref1], mede de
      goedkeuring van Onze genoemde Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel4
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '4'
  - number: '7.1'
    text: |-
      Indien bij of krachtens een landbouwkwaliteitsbesluit regelen zijn gesteld omtrent keuring van produkten, kunnen
      daarbij merken, tekenen of bewijsstukken worden vastgesteld als uitsluitend bestemd om door of vanwege de daartoe
      gerechtigde op produkten of op hun verpakking te worden aangebracht, dan wel bij die produkten te worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      Bij of krachtens een besluit, in het eerste lid bedoeld, kunnen regelen worden gesteld betreffende het
      vervaardigen, voorhanden en in voorraad hebben, zomede het afleveren en gebruiken van merken, tekenen of
      bewijsstukken en van cliché's, stempels en andere werktuigen tot het vervaardigen of aanbrengen van die merken,
      tekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel7
  - number: '8.1'
    text: |-
      In een landbouwkwaliteitsbesluit kunnen een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid worden belast met het toezicht op de naleving van de bij of krachtens dat besluit gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel8
  - number: '8.2'
    text: |-
      In een landbouwkwaliteitsbesluit kunnen een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid worden belast met de keuring, bedoeld in [artikel 7][ref1], of met het toezicht daarop. Zij
      kunnen daarbij tevens bevoegd worden verklaard tot het uitreiken van merken, tekenen of bewijsstukken, in hetzelfde
      artikel bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel7
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '7'
  - number: '10.1'
    text: Een controle-instelling is niet werkzaam met het oogmerk om winst te behalen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel10
  - number: '10.2'
    text: |-
      Een controle-instelling stelt een reglement vast waarin wordt geregeld de wijze waarop de keuring, bedoeld
      in [artikel 7][ref1], wordt uitgevoerd, de wijze waarop het uitreiken van bewijsstukken, merken en tekenen
      plaatsvindt, en de wijze waarop de controles plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel7
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '7'
  - number: '10.3'
    text: |-
      Het in het tweede lid bedoelde reglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden
      onthouden wegens strijd met het recht of op de grond dat het reglement naar het oordeel van Onze Minister een goede
      taakuitoefening door de controle-instelling kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel10
  - number: '10.4'
    text: |-
      De statuten van een controle-instelling alsmede wijzigingen daarvan behoeven, alvorens zij van kracht zijn, de
      instemming van Onze Minister. Onze Minister draagt zorg voor de publicatie van de statuten in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een controle-instelling kan tarieven vaststellen voor de kosten ter zake van het in [artikel 8][ref1] bedoelde
      toezicht en de keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '11.2'
    text: |-
      Indien Onze Minister bij of krachtens een landbouwkwaliteitsbesluit de in het eerste lid bedoelde activiteiten
      uitvoert, kan Onze Minister voor de kosten ter zake van deze activiteiten tarieven vaststellen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: '11.3'
    text: |-
      De tarieven, bedoeld in het eerste lid, behoeven goedkeuring van Onze Minister. De goedkeuring kan worden onthouden
      wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: '11.4'
    text: 'De tarieven, bedoeld in het eerste en tweede lid:'
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: 11.4.a
    text: hebben een rechtstreeks verband met de in die leden bedoelde activiteiten, en
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: 11.4.b
    text: |-
      belopen niet meer dan nodig is ter dekking van de gemaakte kosten die zijn toe te rekenen aan die onderscheiden
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: '11.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de oplegging en inning van de
      tarieven alsmede met betrekking tot het periodiek aanpassen van de tarieven aan de ontwikkeling van de lonen en
      de prijzen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
  - number: '11.6'
    text: |-
      Bij gebreke van betaling binnen de door de controle-instelling of door Onze Minister gestelde termijn
      kan de controle-instelling of Onze Minister het verschuldigde bedrag invorderen bij dwangbevel. De
      [artikelen 4:114 tot en met 4:124 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11.7'
    text: |-
      De controle-instelling of Onze Minister kan besluiten geen activiteiten als bedoeld in
      [artikel 8, tweede lid][ref1], te verrichten of deze te staken, indien niet het ingevolge dit artikel verschuldigde
      bedrag wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel8
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '8'
  - number: '12.1'
    text: De benoeming en het ontslag van de voorzitter van een controle-instelling behoeven goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      Op een controle-instelling wordt rijkstoezicht uitgeoefend door Onze Minister overeenkomstig bij ministeriële
      regeling vast te stellen regels.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      De controle-instelling houdt een afzonderlijke boekhouding bij ter zake van de bij of krachtens deze wet opgedragen
      taken en daaruit onmiddellijk voortvloeiende werkzaamheden en verantwoordt die taken en werkzaamheden afzonderlijk
      in haar jaarrekening.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '12.4'
    text: |-
      De controle-instelling stelt jaarlijks een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '12.5'
    text: Het jaarverslag wordt aan Onze Minister toegezonden en algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '12.6'
    text: |-
      De controle-instelling verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde
      inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      Bij overtreding van bij of krachtens een landbouwkwaliteitsbesluit gestelde regelen kunnen een of meer van de
      volgende tuchtrechtelijke maatregelen worden opgelegd:
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: 13.1.a
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: 13.1.b
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: 13.1.c
    text: het stellen van de betrokkene onder verscherpte controle op zijn kosten voor ten hoogste twee jaren;
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: 13.1.d
    text: openbaarmaking van de uitspraak op kosten van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      De controle-instelling regelt bij reglement de samenstelling en bevoegdheid van haar organen die de
      tuchtrechtspraak uitoefenen, alsmede de rechtsgang van het tuchtrechtelijk geding, een en ander met inachtneming
      van bij algemene maatregel van bestuur te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: '13.3'
    text: |-
      De [artikelen 1, onderdeel b][ref1], [3 tot en met 6][ref2], [21 tot en met 25][ref3], [27 tot en met 41][ref4],
      [42][ref5] en [44 van de Wet tuchtrechtspraak bedrijfsorganisatie 2004][ref6] zijn van overeenkomstige toepassing,
      met dien verstande dat onder «de voorzitter van het bedrijfslichaam» en «bedrijfslichaam» in die artikelen telkens
      moet worden verstaan: de controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0016341#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0016341#Artikel42
      [ref6]: https://wetten.overheid.nl/BWBR0016341#Artikel44
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0016341
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0016341
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0016341
        artikel: '27'
      - id: ref5
        bwb_id: BWBR0016341
        artikel: '42'
      - id: ref6
        bwb_id: BWBR0016341
        artikel: '44'
  - number: '13.4'
    text: |-
      De controle-instelling geeft aan de opbrengsten van de geldboeten een bijzondere bestemming, welke de goedkeuring
      van Onze Minister behoeft.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: '13.5'
    text: |-
      In afwijking van [artikel 7:1 van de Algemene wet bestuursrecht][ref1] kan tegen een besluit van een tuchtgerecht
      of een centraal tuchtgerecht, ingesteld door een controle-instelling, geen bezwaar worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '13.6'
    text: |-
      In verband met de uitvoering van voorschriften van de Raad van de Europese Unie, van het Europees Parlement en de
      Raad van de Europese Unie gezamenlijk of van de Commissie van de Europese Gemeenschappen kan in afwijking van het
      eerste lid bij of krachtens algemene maatregel van bestuur worden bepaald dat geen tuchtrechtelijke maatregelen
      worden gesteld op overtreding van de bij of krachtens die algemene maatregel van bestuur aangewezen bepalingen of
      onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13
  - number: 13a.1
    text: |-
      De houder van een geografische aanduiding kan zijn recht handhaven jegens een ieder die, zonder daartoe gerechtigd
      te zijn, een van de handelingen genoemd in artikel 13, eerste lid, van verordening 510/2006 verricht.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.2
    text: |-
      De rechter kan op vordering van de houder van een geografische aanduiding tussenpersonen wier diensten door derden
      worden gebruikt om inbreuk op het recht van de houder te maken, bevelen de diensten die worden gebruikt om die
      inbreuk te maken, te staken.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.3
    text: |-
      De voorzieningenrechter kan op vordering van de houder van een geografische aanduiding tijdelijke voortzetting van
      de vermeende inbreuk op dit recht toestaan onder de voorwaarde dat zekerheid wordt gesteld voor vergoeding van de
      door de houder geleden schade. Onder dezelfde voorwaarden kan de rechter voortzetting van de dienstverlening door
      de tussenpersoon als bedoeld in het tweede lid toestaan.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.4
    text: |-
      Schadevergoeding kan slechts worden gevorderd van degene die de handelingen bewust verricht. Van bewust handelen is
      in elk geval sprake, indien de inbreuk is gepleegd nadat de betrokkene bij deurwaardersexploot op de strijd tussen
      de handelingen en de geografische aanduiding is gewezen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.5
    text: In passende gevallen kan de rechter de schadevergoeding vaststellen als een forfaitair bedrag.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.6
    text: |-
      In plaats van schadevergoeding kan worden gevorderd, dat de gedaagde veroordeeld wordt de door de inbreuk genoten
      winst af te dragen en dienaangaande rekening en verantwoording af te leggen; indien de rechter echter van oordeel
      is dat de omstandigheden van het geval geen aanleiding geven tot een dergelijke veroordeling, zal de rechter de
      gedaagde tot schadevergoeding kunnen veroordelen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.7
    text: |-
      De houder van een geografische aanduiding kan de vorderingen tot schadevergoeding of het afdragen van winst ook
      namens of mede namens de overige houders van de desbetreffende geografische aanduiding instellen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.8
    text: |-
      De houder van een geografische aanduiding heeft de bevoegdheid roerende zaken, waarmee een inbreuk op zijn recht
      wordt gemaakt, of materialen en werktuigen die voornamelijk zijn gebruikt bij de voortbrenging van die zaken
      als zijn eigendom op te eisen, dan wel onttrekking aan het verkeer, vernietiging of onbruikbaarmaking daarvan
      te vorderen. Bij de beoordeling van de vordering wordt een afweging gemaakt tussen de ernst van de inbreuk en de
      gevorderde maatregelen alsmede de belangen van derden.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.9
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslag en executie tot afgifte
      van roerende zaken, zijn van toepassing. Bij samenloop met een ander beslag, gaat degene die beslag heeft gelegd
      krachtens dit artikel voor.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 13a.10
    text: |-
      De maatregelen bedoeld in het achtste en negende lid worden op kosten van de gedaagde uitgevoerd, tenzij bijzondere
      redenen dit beletten.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: 13a.11
    text: |-
      De rechter kan op vordering van de houder van een geografische aanduiding degene die inbreuk op diens recht
      heeft gemaakt, bevelen al hetgeen aan laatstgenoemde bekend is omtrent de herkomst en distributiekanalen van
      de goederen of diensten die inbreuk maken, aan de houder van de geografische aanduiding mee te delen en alle
      daarop betrekking hebbende gegevens aan deze te verstrekken. Onder dezelfde voorwaarden kan dit bevel worden
      gegeven aan een derde die op commerciële schaal inbreukmakende goederen in zijn bezit heeft of gebruikt, die
      op commerciële schaal diensten verleent die bij de inbreuk worden gebruikt, of die door een van deze derden
      is aangewezen als zijnde betrokken bij de productie, fabricage of distributie van deze goederen of bij het
      verlenen van deze diensten. Deze derde kan zich verschonen van het verstrekken van informatie die bewijs zou
      vormen van deelname aan een inbreuk op een recht van intellectuele eigendom door hem zelf of door de andere in
      [artikel 165, derde lid, Wetboek van Burgerlijke Rechtsvordering][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: 13a.12
    text: |-
      De rechter kan op vordering van de houder van een geografische aanduiding gelasten dat op kosten van degene die
      inbreuk op diens recht heeft gemaakt passende maatregelen worden getroffen tot verspreiding van informatie over
      de uitspraak.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel13a
  - number: '14'
    text: |-
      Tegen een besluit van Onze Minister of van Onze Minister en Onze Ministers, wie het mede aangaat, tezamen,
      krachtens een landbouwkwaliteitsbesluit genomen, tot verlening, weigering of intrekking van een vergunning of
      ontheffing, kan een belanghebbende beroep instellen bij het College van Beroep voor het bedrijfsleven. Gelijk
      beroep staat open tegen zodanige besluiten van controle-instellingen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van bij of krachtens een landbouwkwaliteitsbesluit gestelde eisen zijn belast
      de bij besluit van Onze Minister aangewezen ambtenaren en de bij besluit van Onze Minister aangewezen personen,
      werkzaam bij een controle-instelling.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister en Onze Ministers, wie het mede aangaat, kunnen tezamen nadere voorschriften geven betreffende de
      monsterneming, de verpakking, de conservering, de verzegeling, de verzending en het onderzoek der monsters.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel15
  - number: '15.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel15
  - number: '18.1'
    text: |-
      Aan het slot van [artikel 1, onder 4][ref1] wordt toegevoegd de zinsnede: de Landbouwkwaliteitswet, de artikelen 2,
      eerste en tweede lid, 3, tweede lid, 4, vierde lid, 6 en 9, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '18.2'
    text: |-
      [Artikel 13][ref1] vindt geen toepassing, indien de Officier van Justitie, na overleg met de controle-instelling,
      heeft beslist, dat een overtreding strafrechtelijk zal worden afgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002755#Artikel13
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002755
        artikel: '13'
  - number: '19'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel19
  - number: '20.1'
    text: 'Deze wet kan worden aangehaald als: "Landbouwkwaliteitswet".'
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel20
  - number: '20.2'
    text: Zij treedt in werking met ingang van een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002755/2009-07-01#Artikel20
