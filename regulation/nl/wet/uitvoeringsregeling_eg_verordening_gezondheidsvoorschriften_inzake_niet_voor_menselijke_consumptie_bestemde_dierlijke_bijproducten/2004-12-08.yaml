  - number: 22.b
    text: |-
      verwerking: het onschadelijk maken van categorie 1-materiaal, categorie 2-materiaal of categorie 3-materiaal door
      het overeenkomstig [verordening (EG) nr. 1774/2002](32002R1774) te verwerken of te verwijderen.
