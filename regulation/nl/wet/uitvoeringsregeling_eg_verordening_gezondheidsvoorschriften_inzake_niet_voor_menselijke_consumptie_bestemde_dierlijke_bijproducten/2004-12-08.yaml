        artikel: '29'
  - number: 34.b
    text: |-
      [artikel 30, vierde lid, van het Destructiebesluit 1996][ref1] verstaan onder crematorium: een door de Minister op
      grond van artikel 12, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774) erkende verbrandingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel30
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '30'
  - number: '35.1'
    text: |-
      De aangifteplichtige doet van categorie 1-materiaal of categorie 2-materiaal als bedoeld in
      [artikel 12 van de Destructiewet][ref1] zo spoedig mogelijk doch uiterlijk op de eerste werkdag, volgende op
      de dag dat waarop dit materiaal is ontstaan, aangifte bij het op grond van artikel 13 van [verordening (EG) nr.
      1774/2002](32002R1774) door de Minister erkende categorie 1-verwerkingsbedrijf onderscheidenlijk erkende categorie
      2-verwerkingsbedrijf in wiens gebied het materiaal zich bevindt. De aangifte geschiedt telefonisch onder opgave van
      de soort en de hoeveelheid van het materiaal alsmede van de plaats waar het zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '12'
  - number: '35.2'
    text: |-
      In zoverre in afwijking van de eerste zin van het eerste lid geschiedt de aangifte, indien het materiaal betreft
      dat op een vaste dag wordt opgehaald, uiterlijk op de werkdag voorafgaand aan de dag dat het materiaal wordt
      opgehaald.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel35
  - number: '35.3'
    text: |-
      Na aangifte wordt in de daaropvolgende week in ieder geval eenmaal het in [artikel 38, eerste lid][ref1], bedoelde
      materiaal opgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel38
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '38'
        paragraaf: '5'
  - number: '36.1'
    text: |-
      De aangifteplichtige deponeert categorie 1-materiaal of categorie 2-materiaal als bedoeld in
      [artikel 12 van de Destructiewet][ref1] op de dag dat het door het verwerkingsbedrijf wordt opgehaald op
      een zodanige plaats dat het vanaf de verharde openbare weg binnen het vrij bereik ligt van de laadkraan van
      het vervoermiddel waarmee het materiaal wordt opgehaald. Indien door plaatselijke omstandigheden de fysieke
      mogelijkheid hiertoe ontbreekt, wordt tussen de aangifteplichtige en het verwerkingsbedrijf schriftelijk een andere
      plaats van deponering afgesproken, waarbij uitgangspunt is dat het vervoermiddel niet verder dan één wagenlengte op
      het erf behoeft te komen. Bij geschillen tussen de aangifteplichtige en het verwerkingsbedrijf over de plaats van
      deponering, zal, met inachtneming van hetgeen hiervoor is gesteld, de plaats worden bepaald door de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '12'
  - number: '36.2'
    text: |-
      Het eerste lid is niet van toepassing indien tussen de aangifteplichtige en het verwerkingsbedrijf een overeenkomst
      is gesloten strekkende tot het deponeren van het materiaal op een andere plaats. Het materiaal wordt dan telkens op
      die plaats gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel36
  - number: '37.1'
    text: |-
      De aangifteplichtige draagt er zorg voor dat categorie 1-, categorie 2- of categorie 3-materiaal tot het moment
      waarop het wordt opgehaald:
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: 37.1.a
    text: |-
      op een zodanige manier wordt bewaard dat het materiaal niet vrij toegankelijk is voor anderen dan de
      aangifteplichtige en het bedrijf dat het materiaal ophaalt;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: 37.1.b
    text: |-
      voor zover het kadavers betreft, dat materiaal op een zodanig manier is afgedekt dat het is onttrokken aan het
      oog van passanten en niet vrij toegankelijk is voor vogels, knaagdieren, honden en katten en de afdekking door het
      bedrijf dat het materiaal ophaalt makkelijk verwijderbaar is.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: '37.2'
    text: |-
      In gevallen als bedoeld in [artikel 35, tweede lid][ref1], wordt het materiaal in vaten passend in de
      laadinrichting van het bedrijf dat het materiaal ophaalt aangeboden. De aangifteplichtige draagt er zorg voor dat
      op de vaten duidelijk is aangegeven welk type materiaal zij bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel35
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '35'
        paragraaf: '5'
  - number: '37.3'
    text: |-
      De aangifteplichtige draagt er zorg voor dat categorie 1- en categorie 2-materiaal op een zodanige plaats wordt
      aangeboden dat:
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: 37.3.a
    text: het duidelijk van elkaar gescheiden is en herkenbaar is van ander materiaal;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: 37.3.b
    text: |-
      het categorie 1-materiaal onderscheidenlijk categorie 2-materiaal door het bedrijf dat het materiaal ophaalt apart
      kan worden geladen.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel37
  - number: '38.1'
    text: 'De aangifteplichtige draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel38
  - number: 38.1.a
    text: |-
      kadavers van vee als bedoeld in artikel 2 van [verordening (EG) nr. 1774/2002](32002R1774) tot een gewicht van 40
      kg, met uitzondering van kadavers van kalveren, tot het moment waarop dit materiaal wordt opgehaald, worden bewaard
      bij een omgevingstemperatuur van ten hoogste 10°C;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel38
  - number: 38.1.b
    text: |-
      het in [artikel 12 van de Destructiewet][ref1] bedoelde categorie 1 of categorie 2-materiaal, met uitzondering van
      kadavers of bloed, tot het moment waarop dit materiaal wordt opgehaald, wordt bewaard bij een omgevingstemperatuur
      van ten hoogste 10°C of een inwendige temperatuur van ten hoogste 15°C;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '12'
  - number: 38.1.c
    text: |-
      bloed, voor zover het categorie 1- of categorie 2-materiaal betreft, wordt bewaard bij een inwendige temperatuur
      van ten hoogste 15°C.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel38
  - number: '38.2'
    text: |-
      Het eerste lid is niet van toepassing op materiaal dat ontstaat op slachterijen, mits dit materiaal op dezelfde dag
      waarop het als zodanig is ontstaan, wordt opgehaald, met dien verstande dat materiaal dat overeenkomstig artikel
      23, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774) is bestemd voor gebruik voor het voederen van de
      in dat artikel genoemde dieren binnen twaalf uur na het ontstaan wordt opgehaald.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel38
  - number: '39'
    text: |-
      De overdracht van categorie 1- of categorie 2-materiaal door de aangifteplichtige aan het verwerkingsbedrijf
      geschiedt door overlading van dat materiaal in het daarvoor bestemde vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel39
  - number: '40'
    text: |-
      De eigenaar of houder van categorie 3-materiaal draagt er zorg voor dat dat materiaal wordt bewaard bij een
      omgevingstemperatuur van ten hoogste 10°C, tenzij het materiaal binnen twaalf uur na het ontstaan wordt opgehaald
      om overeenkomstig artikel 6, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774) te worden verwerkt of
      verwijderd.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel40
  - number: '41'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 7 september 2005.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel41
  - number: '42'
    text: |-
      Deze regeling wordt aangehaald als: Uitvoeringsregeling E.G.-verordening gezondheidsvoorschriften inzake niet voor
      menselijke consumptie bestemde dierlijke bijproducten.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel42
