  - number: '23'
    text: |-
      In zoverre in afwijking van [artikel 1 van de Destructiewet][ref1] wordt, ter uitvoering van [verordening
      (EG) nr. 1774/2002](32002R1774), voor de toepassing van [artikel 4a, eerste lid, van die wet][ref2]
      verstaan onder hoog- of gespecificeerd hoog-risicomateriaal als bedoeld in
      [artikel 2, eerste lid, onder a tot en met e, en tweede lid][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0015527#Artikel2
