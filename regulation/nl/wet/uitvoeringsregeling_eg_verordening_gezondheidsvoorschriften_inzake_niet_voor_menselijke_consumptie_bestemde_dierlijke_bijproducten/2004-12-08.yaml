    text: |-
      In zoverre in afwijking van [artikel 1 van de Destructiewet][ref1] wordt, ter uitvoering van [verordening (EG) nr.
      1774/2002](32002R1774), voor de toepassing van [artikel 4, eerste lid, van die wet][ref2] verstaan onder:


