  - number: 23.a.2
    text: kadavers van gezelschapsdieren.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel23
  - number: 23.b
    text: |-
      categorie 2-materiaal als bedoeld in artikel 5, eerste lid, onderdelen b, c, d, e, f en g, van verordening (EG)
      nr. 1774/2002, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel23
  - number: 23.b.1
    text: |-
      kadavers van paarden, mits het kadavers betreft die overeenkomstig artikel 5, tweede lid, onderdeel a, van
      [verordening (EG) nr. 1774/2002](32002R1774) worden verwerkt in een op grond van artikel 12, tweede lid, van die
      verordening erkende verbrandingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel23
