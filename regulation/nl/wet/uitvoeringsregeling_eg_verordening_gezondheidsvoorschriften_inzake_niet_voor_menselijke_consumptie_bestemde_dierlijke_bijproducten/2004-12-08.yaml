preamble:
  text: |-
    Gelet op verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad van 3 oktober 2002 tot vaststelling
    van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke bijproducten (PbEG L 273),
    verordening (EG) nr. 999/2001/EG van het Europees Parlement en de Raad van 22 mei 2001, houdende vaststelling van
    voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën
    (PbEG L 147), verordening (EG) nr. 809/2003 van de Europese Commissie van 12 mei 2003 inzake overgangsmaatregelen
    krachtens verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad wat betreft de verwerkingsnormen
    voor categorie 3-materiaal en mest, gebruikt in composteerinstallaties (PbEG L 117), verordening (EG) nr. 810/2003
    van de Europese Commissie van 12 mei 2003 inzake overgangsmaatregelen krachtens verordening (EG) nr. 1774/2002 van
    het Europees Parlement en de Raad wat betreft de verwerkingsnormen voor categorie 3-materiaal en mest, gebruikt
    in biogasinstallaties (PbEG L 117), verordening (EG) nr. 811/2003 van de Europese Commissie van 12 mei 2003 ter
    uitvoering van verordening (EG) nr. 1774/2002 van het Europees Parlement en de Raad wat betreft het verbod op
    hergebruik binnen dezelfde soort voor vis, de begraving en verbranding van dierlijke bijproducten en bepaalde
    overgangsmaatregelen (PbEG L 117), beschikking nr. 2003/326 van de Europese Commissie van 12 mei 2002 inzake
    overgangsmaatregelen krachtens verordening (EG) nr. 1774/2002 van het Europese Parlement en de Raad wat betreft
    de scheiding van categorie 2- en categorie 3-oleochemische bedrijven (PbEG L 117), beschikking nr. 2003/329 van de
    Europese Commissie van 12 mei 2003 inzake overgangsmaatregelen krachtens verordening (EG) nr. 1774/2002 wat betreft
    de warmtebehandeling van mest (PbEG L 117), artikel 19 van de Landbouwwet, de artikelen 2, 3, 12 en 23 van de
    Destructiewet en de artikelen 16, 17a, 18 en 28 van het Destructiebesluit 1996;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.a
    text: |-
      [verordening (EG) nr. 1774/2002](32002R1774): [verordening (EG) nr. 1774/2002](32002R1774) van het Europees
      Parlement en de Raad van 3 oktober 2002 tot vaststelling van gezondheidsvoorschriften inzake niet voor menselijke
      consumptie bestemde dierlijke bijproducten (PbEG L 273);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.b
    text: |-
      [verordening nr. (EG) 809/2003](32003R0809): [verordening (EG) nr. 809/2003](32003R0809) van de Commissie
      van 12 mei 2003 inzake overgangsmaatregelen krachtens [Verordening (EG) nr. 1774/2002](32002R1774) van het
      Europees Parlement en de Raad wat betreft de verwerkingsnormen voor categorie 3-materiaal en mest, gebruikt in
      composteerinstallaties (PbEG L 117);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.c
    text: |-
      [verordening (EG) nr. 810/2003](32003R0810); [verordening (EG) nr. 810/2003](32003R0810) van de Commissie
      van 12 mei 2003 inzake overgangsmaatregelen krachtens [Verordening (EG) nr. 1774/2002](32002R1774) van het
      Europees Parlement en de Raad wat betreft de verwerkingsnormen voor categorie 3-materiaal en mest gebruikt in
      biogasinstallaties (PbEG L 117);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.d
    text: |-
      [verordening (EG) nr. 811/2003](32003R0811); [verordening (EG) nr. 811/2003](32003R0811) van de Commissie van 12
      mei 2003 ter uitvoering van [verordening (EG) nr. 1774/2002](32002R1774) van het Europees Parlement en de Raad
      wat betreft het verbod op hergebruik binnen dezelfde soort voor vis, de begraving en verbranding van dierlijke
      bijproducten en bepaalde overgangsmaatregelen (PbEG L 117);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.e
    text: |-
      [verordening (EG) nr. 999/2001](32001R0999): [verordening (EG) nr. 999/2001](32001R0999) van het Europees Parlement
      en de Raad van 22 mei 2001, houdende vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van
      bepaalde overdraagbare spongiforme encefalopathieën (PbEG L 147);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.f
    text: |-
      [richtlijn nr. 2000/76/EG](32000L0076): [richtlijn nr. 2000/76](32000L0076) van het Europees Parlement en de Raad
      van 4 december 2000 betreffende de verbranding van afval (PbEG L 332);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.g
    text: |-
      beschikking nr. 2003/326: beschikking nr. 2003/326 van de Commissie van 12 mei 2003 inzake overgangsmaatregelen
      krachtens [Verordening (EG) nr. 1774/2002](32002R1774) van het Europees Parlement en de Raad wat betreft de
      scheiding van categorie 2- en categorie 3-oleochemische bedrijven (PbEG L 117);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.h
    text: |-
      beschikking nr. 2003/329: beschikking nr. 2003/329 van de Commissie van 12 mei 2003 inzake overgangsmaatregelen
      krachtens [Verordening (EG) nr. 1774/2002](32002R1774) wat betreft de warmtebehandeling van mest (PbEG L 117);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.i
    text: |-
      beschikking nr. 2004/407: beschikking nr. 2004/407/EG van de Commissie van de Europese Gemeenschappen van 26
      april 2004 inzake overgangsbepalingen op het gebied van hygiëne en certificatie krachtens [Verordening (EG) nr.
      1774/2002](32002R1774) van het Europees Parlement en de Raad wat betreft de invoer van fotografische gelatine uit
      bepaalde derde landen (PbEG L208);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.j
    text: |-
      overlaadstation: intermediair categorie 1- of categorie 2-bedrijf waarin niet verwerkt categorie 1- of categorie
      2-materiaal wordt gehanteerd of tijdelijk opgeslagen met het oog op verder vervoer naar een categorie 1- of 2-
      verwerkingsbedrijf en waarin uitsluitend voorbereidende activiteiten plaatsvinden die verband houden met het
      vervoer van dat materiaal;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.k
    text: |-
      aangifteplichtige: eigenaar of houder als bedoeld in [artikel 12, eerste lid, van de Destructiewet][ref1], niet
      zijnde een natuurlijke of rechtspersoon die, onderscheidenlijk dat, een bedrijf of installatie exploiteert waar
      categorie 1-materiaal of categorie 2-materiaal overeenkomstig [verordening (EG) nr. 1774/2002](32002R1774) wordt
      gehanteerd, opgeslagen of verwerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel12
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '12'
  - number: 1.1.l
    text: 'de Minister: de Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.m
    text: |-
      VWA: Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport van 8
      juli 2002 (Stcrt. 127);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: 1.1.n
    text: 'bijlage: bijlage bij [verordening (EG) nr. 1774/2002](32002R1774).'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling gelden de definities, bedoeld in artikel 2 van [verordening (EG) nr.
      1774/2002](32002R1774), met dien verstande dat onder gespecificeerd risicomateriaal wordt verstaan: gespecificeerd
      risicomateriaal genoemd in bijlage XI, hoofdstuk A, punt 1, onder a, punt i en ii, van [verordening (EG) nr.
      999/2001](32001R0999).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel1
  - number: '2'
    text: 'De Minister is de bevoegde autoriteit, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel2
  - number: 2.a
    text: |-
      de artikelen 5, tweede lid, onderdeel e, 10, eerste lid, 11, eerste lid, 12, tweede en derde lid, 13, eerste
      lid, 14, eerste lid, 15, eerste lid, 17, eerste lid, en 18, eerste lid, van [verordening (EG) nr. 1774/2002]
      (32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel2
  - number: 2.b
    text: |-
      bijlage II, hoofdstuk III en hoofdstuk VIII, eerste zin, bijlage V, hoofdstuk III, bijlage VI, hoofdstuk II,
      bijlage VII, hoofdstuk I en hoofdstuk II, punt 13, en bijlage VIII, hoofdstuk III.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel2
  - number: '3'
    text: 'De ambtenaren van de VWA zijn de bevoegde autoriteit, bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel3
  - number: 3.a
    text: |-
      de artikelen 8, vierde en vijfde lid, 10, tweede lid, onderdeel d, 10, derde lid, onderdeel d, 11, tweede lid,
      onderdeel b, 13, tweede lid, onderdeel, c, 13, tweede lid, onderdeel e, 14, tweede lid, onderdeel c, 14, tweede
      lid, onderdeel d, 15, tweede lid, onderdeel c, 17, tweede lid, onderdeel c, 17, tweede lid, onderdeel e, 18, tweede
      lid, 25 en 26 van [verordening (EG) nr. 1774/2002](32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel3
  - number: 3.b
    text: |-
      bijlage II, hoofdstuk V, bijlage II, hoofdstuk VIII, tweede zin, bijlage III, hoofdstuk II, bijlage IV, hoofdstuk
      VII, bijlage V, hoofdstuk IV, bijlage V, hoofdstuk V, en bijlage VII, hoofdstuk II, punten 10, 11 en 12.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het tweede lid, is het verboden in strijd te handelen met artikel 4, tweede en derde lid, van
      [verordening (EG) nr. 1774/2002](32002R1774), met dien verstande dat bij verwerking van categorie 1-materiaal
      overeenkomstig artikel 4, tweede lid, aanhef en onderdeel b, van de verordening de Minister kan bepalen dat
      uitsluitend verwerkingsmethode 1 wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel4
  - number: '4.2'
    text: |-
      Het is uitsluitend toegestaan categorie 1-materiaal overeenkomstig artikel 4, tweede lid, onderdelen a, c en e, van
      [verordening (EG) nr. 1774/2002](32002R1774) te verwerken of te verwijderen indien daarvoor toestemming is verleend
      door de Minister.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel4
  - number: '4.3'
    text: |-
      De in het tweede lid bedoelde toestemming is niet vereist voor de verwijdering van kadavers van gezelschapsdieren
      overeenkomstig artikel 4, tweede lid, onderdeel a, van [verordening (EG) nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd het tweede lid, is het verboden in strijd te handelen met artikel 5, tweede en derde lid, van
      [verordening (EG) nr. 1774/2002](32002R1774), met dien verstande dat bij verwerking van categorie 2-materiaal
      overeenkomstig artikel 5, tweede lid, aanhef en onderdeel b, van de verordening de Minister kan bepalen dat
      uitsluitend verwerkingsmethode 1 wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel5
  - number: '5.2'
    text: |-
      Het is uitsluitend toegestaan categorie 2-materiaal overeenkomstig artikel 5, tweede lid, onderdelen a, c,
      subonderdeel iii, d, f en g, van [verordening (EG) nr. 1774/2002](32002R1774), of, voor zover van toepassing,
      overeenkomstig artikel 8 van [verordening (EG) nr. 811/2003](32003R0811), te verwerken of te verwijderen indien
      daarvoor toestemming is verleend door de Minister.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel5
  - number: '5.3'
    text: De Minister kan de in bijlage VI, hoofdstuk I, in punt 2 bedoelde toestemming verlenen.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel5
  - number: '6'
    text: 'Het is verboden in strijd te handelen met:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel6
  - number: 6.a
    text: artikel 6, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel6
  - number: 6.b
    text: artikel 6, derde lid, van [verordening (EG) nr. 1774/2002](32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel6
  - number: 6.c
    text: artikelen 3 en 4 van verordening (EG) nr. 811/2003.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel6
  - number: '7.1'
    text: 'Het is verboden in strijd te handelen met:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: 7.1.a
    text: artikel 7, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: 7.1.b
    text: artikel 7, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774);
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: 7.1.c
    text: artikel 7, vijfde lid, van [verordening (EG) nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: '7.2'
    text: 'Het verbod, gesteld in het eerste lid, geldt niet ter zake van het verzamelen en vervoeren van onverwerkte mest:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: 7.2.a
    text: |-
      die rechtstreeks wordt vervoerd tussen twee punten op dezelfde boerderij, voor zover deze zich in Nederland
      bevinden;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
  - number: 7.2.b
    text: |-
      die via een intermediaire onderneming als bedoeld in het
      [Besluit administratieve verplichtingen Meststoffenwet][ref1] wordt vervoerd tussen boerderijen en gebruikers,
      voor zover deze zich in Nederland bevinden, met dien verstande dat bijlage II, hoofdstuk II, op dat vervoer van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009000
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009000
  - number: '8.1'
    text: |-
      Het is verboden dierlijke bijproducten en verwerkte producten in strijd met artikel 8, eerste tot en met derde lid,
      van [verordening (EG) nr. 1774/2002](32002R1774):
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.1.a
    text: naar andere lidstaten te zenden;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.1.b
    text: uit lidstaten in Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: '8.2'
    text: 'Voorafgaand aan de zending, bedoeld in het eerste lid, onderdeel a:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.2.1°
    text: |-
      bevestigt de afzender aan de VWA dat de in artikel 8, tweede lid, eerste zin, van [verordening (EG) nr. 1774/2002]
      (32002R1774) bedoelde toestemming door de lidstaat van bestemming is verleend, en
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.2.2°
    text: zendt de afzender aan de VWA een kopie van het handelsdocument.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: '8.3'
    text: |-
      De in het artikel 8, tweede lid, eerste zin, van [verordening (EG) nr. 1774/2002](32002R1774) bedoelde toestemming,
      voor zover het betreft het brengen in Nederland van dierlijke bijproducten en verwerkte producten, kan door de
      Minister worden verleend, met dien verstande deze toestemming niet is vereist voor het brengen in Nederland van:
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.3.a
    text: verwerkte dierlijke eiwitten;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8.3.b
    text: |-
      verwerkte mest en overige verwerkte producten die afgeleid zijn van categorie 2-materiaal die verwerkingsmethode 1
      hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: '8.4'
    text: |-
      Het eerste en derde lid is niet van toepassing op onverwerkte mest, mits is voldaan aan, voor zover van toepassing,
      [artikel 2.2a][ref1] of [artikel 2.8b van de Regeling keuring en handel dierlijke producten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '8.5'
    text: |-
      Het is verboden categorie 1- of categorie 2-materiaal alsmede daarvan afgeleide producten, niet zijnde in bijlage
      VII of VIII genoemde producten, uit Nederland naar een derde land uit te voeren, via Nederland vanuit een derde
      land in de Gemeenschap in te voeren of via Nederland door te voeren.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: '8.6'
    text: |-
      Het is verboden categorie 3-materiaal via Nederland vanuit een derde land in de Gemeenschap in te voeren, tenzij
      voldaan is aan bijlage XI, hoofdstuk A, punt 15, van verordening (EG) nr. 999/2001.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8
  - number: 8a.1
    text: |-
      Het verbod, bedoeld in [artikel 8, vijfde lid][ref1], geldt niet ten aanzien van de invoer van de in artikel 1 van
      beschikking nr. 2004/407 genoemde fotografische gelatine vanuit de in bijlage I bij deze beschikking genoemde derde
      landen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel8
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '8'
        paragraaf: '2'
  - number: 8a.1.a
    text: |-
      de fotografische gelatine vergezeld gaat van het in bijlage III, van beschikking nr. 2004/407 bedoelde
      gezondheidscertificaat;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.1.b
    text: |-
      de fotografische gelatine afkomstig is van de in bijlage I, van beschikking nr. 2004/407 genoemde bedrijven van
      oorsprong;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.1.c
    text: |-
      de fotografische gelatine via de in bijlage I, van beschikking nr. 2004/407 genoemde grensinspectieposten wordt
      ingevoerd,
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.1.d
    text: |-
      de fotografische gelatine bestemd is voor de in bijlage I, van beschikking nr. 2004/407 genoemde en door de
      Minister erkende fotografische fabrieken.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.2
    text: |-
      In afwijking van het eerste lid, onderdeel c, kan in door de Minister te bepalen bijzondere gevallen de
      fotografische gelatine via een andere grensinspectiepost worden ingevoerd.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.3
    text: |-
      Het is uitsluitend toegestaan fotografische gelatine te gebruiken voor de vervaardiging van fotografische
      producten, in fotografische fabrieken als bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.4
    text: |-
      De exploitant van een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, voldoet aan artikel 3,
      eerste lid, van beschikking nr. 2004/407.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.5
    text: |-
      Een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, wordt door de Minister erkend indien het een
      administratie bijhoudt als bedoeld in artikel 3, tweede lid, van beschikking nr. 2004/407 en deze gedurende twee
      jaar bewaart.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.6
    text: |-
      De erkenning, bedoeld in het vijfde lid, wordt door de Minister ingetrokken, indien naar het oordeel van de
      Minister blijkt dat een fotografische fabriek als bedoeld in het eerste lid, onderdeel d, niet voldoet aan het
      vierde en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.7
    text: |-
      Fotografische gelatine wordt in voertuigen, waarin niet tegelijkertijd voor levensmiddelen of diervoeders bestemde
      producten worden vervoerd, met inbegrip van gelatine bestemd voor andere doeleinden dan gebruik in de fotografische
      industrie, rechtstreeks van de grensinspectieposten, bedoeld in het eerste lid, onderdeel c, vervoerd naar de
      fotografische fabrieken, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: 8a.8
    text: |-
      Tijdens het vervoer, bedoeld in het zevende lid, gaat de fotografische gelatine vergezeld van het in bijlage III,
      van beschikking nr. 2004/407 bedoelde gezondheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel8a
  - number: '9'
    text: Het is verboden in strijd te handelen met artikel 9, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel9
  - number: '10.1'
    text: Het is verboden in strijd te handelen met artikel 22, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '10.2'
    text: Het verbod, gesteld in het eerste lid, geldt niet ter zake van het voederen van vismeel aan vissen.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '10.3'
    text: |-
      Het is de eigenaar of de houder van ander vee dan pelsdieren verboden keukenafval en etensresten of voedermiddelen
      die keukenafval en etensresten bevatten of daarvan afkomstig zijn voorhanden te hebben.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '10.4'
    text: |-
      Het verbod, gesteld in het derde lid, geldt niet ter zake van het voorhanden hebben van keukenafval en etensresten
      die zijn ontstaan in de eigen huishouding van de eigenaar of houder van ander vee dan pelsdieren, indien deze
      uitsluitend verpakt voorhanden worden gehouden in afwachting van afvoer, op zodanige wijze dat zij onbereikbaar
      zijn voor het vee.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '10.5'
    text: |-
      Het is verboden keukenafval en etensresten of voedermiddelen die keukenafval en etensresten bevatten of daarvan
      afkomstig zijn te vervoeren naar plaatsen waar ander vee dan pelsdieren wordt gehouden of af te leveren aan
      eigenaren of houders van ander vee dan pelsdieren.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '10.6'
    text: |-
      Onverminderd de leden één tot en met vijf is het verboden dieren, ongeacht het gebruiksdoel of de
      leefomgevingomgeving van deze dieren te voederen met keukenafval en etensresten of voedermiddelen die keukenafval
      en etensresten bevatten of daarvan afkomstig te zijn.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel10
  - number: '11.1'
    text: |-
      Het is verboden de in artikel 23, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774) genoemde
      activiteiten te verrichten, tenzij daarvoor toestemming is verleend door de Minister.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
  - number: '11.2'
    text: |-
      Het is verboden de in artikel 23, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774) genoemde
      activiteiten te verrichten, tenzij daarvoor toestemming is verleend door de Minister.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
  - number: '11.3'
    text: |-
      De in het eerste en tweede lid bedoelde toestemming, alsmede de toestemming, bedoeld in de
      [artikelen 4, tweede lid][ref1], [5, tweede lid][ref2], [8, derde lid][ref3], en [12, eerste lid][ref4], wordt
      aangevraagd bij de VWA.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0015527#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0015527#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0015527#Artikel12
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015527
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015527
        artikel: '8'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015527
        artikel: '12'
        paragraaf: '2'
  - number: '11.4'
    text: |-
      Het verbod, gesteld in het eerste lid, geldt tot 1 mei 2004 niet voor het gebruik van dierlijke bijproducten voor
      diagnose, onderwijs en onderzoek, mits daarvoor op grond van [artikel 13, tweede lid, van de Destructiewet][ref1]
      voor de inwerkingtreding van deze regeling een ontheffing is verleend dan wel op grond van
      [artikel 50, eerste lid, onderdeel c, van de Vleeskeuringswet][ref2] een aanwijzing is verricht, en de ontheffing,
      onderscheidenlijk de aanwijzing, op het tijdstip van inwerkingtreding van deze regeling geldig is en de toegestane
      activiteiten overeenkomstig de bij de ontheffing, onderscheidenlijk de aanwijzing, gestelde voorschriften worden
      verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001896#Artikel50
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001896
        artikel: '50'
  - number: '11.5'
    text: |-
      Het verbod, gesteld in het tweede lid, geldt tot 1 mei 2004 niet voor het gebruik van het in artikel 23, tweede
      lid, onderdeel b, onder ii, van [verordening (EG) nr. 1774/2002](32002R1774) genoemde materiaal voor het voederen
      aan edelpelsdieren, mits de houder of eigenaar van die dieren:
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
  - number: 11.5.a
    text: |-
      op het tijdstip van inwerkingtreding van deze regeling in bezit is van een op dat tijdstip geldige door de
      Minister, op grond van [artikel 13, vierde lid, aanhef en onderdeel a, van de Destructiewet][ref1], verleende
      ontheffing;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel13
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '13'
  - number: 11.5.b
    text: voor zover van toepassing, de eisen van bijlage IX naleeft.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel11
  - number: '12.1'
    text: |-
      De verwijdering van dierlijke bijproducten, bedoeld in artikel 24 van [verordening (EG) nr. 1774/2002](32002R1774),
      geschiedt niet zonder toestemming van de Minister en geschiedt, voor zover van toepassing, met inachtneming van de
      artikelen 6, 7 en 9 van [verordening (EG) nr. 811/2003](32003R0811).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel12
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde toestemming is niet vereist voor het begraven van kadavers van gezelschapsdieren,
      mits de kadavers rechtstreeks als afval worden verwijderd door begraving op een terrein dat ter beschikking staat
      van de eigenaar of houder van desbetreffende dode dieren, dan wel op een plaats die ingevolge een besluit van het
      gemeentebestuur daarvoor is toegelaten.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel12
  - number: '13'
    text: Het is verboden in strijd te handelen met artikel 25 van [verordening (EG) nr. 1774/2002](32002R1774).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel13
  - number: '14'
    text: |-
      Het merken, bedoeld in de artikelen 4, tweede lid, onderdelen b en c, en 5, tweede lid, onderdelen b en c, van
      [verordening (EG) nr. 1774/2002](32002R1774), bijlage VI, hoofdstuk I, onder C, en in bijlage XI, hoofdstuk A,
      punt 11, bij [verordening (EG) nr. 999/2001](32001R0999) geschiedt door middel van kleuring met de kleurstoffen
      methyleen blauw, patent-blauw E 131, brillant-blauw E133, pistache-groen E102 of pistache-groen E131 of door middel
      van een andere door de toezichthoudende ambtenaar goedgekeurde methode.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel14
  - number: '15'
    text: |-
      Het is verboden in strijd te handelen met bijlage XI, hoofdstuk A, punt 5, bij [verordening (EG) nr. 999/2001]
      (32001R0999).
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel15
  - number: '16.1'
    text: 'Het is verboden zonder erkenning:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.a
    text: |-
      als bedoeld in artikel 10, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een intermediair categorie
      1-bedrijf, een intermediair categorie 2-bedrijf of een intermediair categorie 3-bedrijf in werking te hebben, uit
      te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.b
    text: |-
      als bedoeld in artikel 11, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een opslagbedrijf in
      werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.c
    text: |-
      als bedoeld in artikel 12, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een
      verbrandingsinstallatie als bedoeld in artikel 12, tweede of derde lid, van [verordening (EG) nr. 1774/2002]
      (32002R1774) in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.d
    text: |-
      als bedoeld in artikel 13, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een categorie 1-
      verwerkingsbedrijf of een categorie 2-verwerkingsbedrijf in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.e
    text: |-
      als bedoeld in artikel 14, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een categorie 2-
      oleochemisch bedrijf of een categorie 3-oleochemisch bedrijf in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.f
    text: |-
      als bedoeld in artikel 15, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een biogasinstallatie of
      een composteerinstallatie in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.g
    text: |-
      als bedoeld in artikel 17, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een categorie 3-
      verwerkingsbedrijf in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.h
    text: |-
      als bedoeld in artikel 18, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een bedrijf voor de
      productie van voeder voor gezelschapsdieren in werking te hebben, uit te breiden of te wijzigen;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: 16.1.i
    text: |-
      als bedoeld in artikel 18, eerste lid, van [verordening (EG) nr. 1774/2002](32002R1774), een technisch bedrijf in
      werking te hebben, uit te breiden of te wijzigen.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid, aanhef en onderdeel i, bedoelde erkenning wordt verleend voor behandeling of productie van
      een of meer van de in bijlage VIII genoemde technische producten of voor niet in die bijlage genoemde technische
      producten.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: '16.3'
    text: De in het eerste lid bedoelde erkenning wordt aangevraagd bij de VWA.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel16
  - number: '17.1'
    text: |-
      Tot 1 mei 2004 wordt met een erkenning voor een categorie 1-verwerkingsbedrijf of een categorie 2-verwerkingsbedrijf
      als bedoeld in [artikel 16, eerste lid, aanhef en onderdeel d][ref1], gelijkgesteld een vóór de inwerkingtreding
      van deze regeling op grond van [artikel 5, eerste lid, aanhef en onderdeel a, van de Destructiewet][ref2] verleende
      vergunning voor een verwerkingsbedrijf voor hoog risico-materiaal onderscheidenlijk gespecificeerd hoog-risico-
      materiaal, waarvan de geldigheid op het tijdstip van inwerkingtreding van deze regeling niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002244#Artikel5
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002244
        artikel: '5'
  - number: '17.2'
    text: |-
      Tot 1 mei 2004 wordt met een erkenning als bedoeld in [artikel 16, eerste lid, aanhef en onderdeel g][ref1],
      gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
  - number: 17.2.a
    text: |-
      een vóór de inwerkingtreding van deze regeling op grond van
      [artikel 5, eerste lid, aanhef en onderdeel b, van de Destructiewet][ref1] verleende vergunning waarvan de
      geldigheid op het tijdstip van inwerkingtreding van deze regeling niet is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '5'
  - number: 17.2.b
    text: |-
      een vóór de inwerkingtreding van deze regeling op grond van
      [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref1] verrichte registratie, mits de
      registratie op het tijdstip van inwerkingtreding van deze regeling niet is doorgehaald en de registratie betrekking
      heeft op één of meer van de in bijlage VII genoemde producten.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '11'
  - number: '17.3'
    text: |-
      Tot 1 mei 2004 wordt met een erkenning als bedoeld in [artikel 16, eerste lid, aanhef en onderdeel h][ref1],
      gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
  - number: 17.3.a
    text: |-
      een vóór de inwerkingtreding van deze regeling op grond van [artikel 5, tweede lid, van de Destructiewet][ref1]
      verrichte registratie voor een verwerkingsbedrijf dat laag-risico-materiaal gebruikt voor de bereiding van
      voeder voor gezelschapsdieren, mits de registratie op het tijdstip van inwerkingtreding van deze regeling niet
      is doorgehaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel5
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002244
        artikel: '5'
  - number: 17.3.b
    text: |-
      een vóór de inwerkingtreding van deze regeling op grond van
      [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref1] verrichte registratie, mits de
      registratie op het tijdstip van inwerkingtreding van deze regeling niet is doorgehaald en de registratie betrekking
      heeft op één of meer van de in bijlage VIII, hoofdstuk II, genoemde producten.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '11'
  - number: '17.4'
    text: |-
      Tot 1 mei 2004 wordt met een erkenning als bedoeld [artikel 16, eerste lid, aanhef en onderdeel i][ref1], voor de
      vervaardiging van een technisch product, gelijkgesteld een vóór de inwerkingtreding van de regeling op grond van
      [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref2] verrichte registratie voor desbetreffend
      technisch product, mits de registratie op het tijdstip van inwerkingtreding van deze regeling niet is doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel11
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '11'
  - number: '17.5'
    text: |-
      Het vierde lid is niet van toepassing op een technisch bedrijf als bedoeld in [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel18
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '18'
        paragraaf: '3'
  - number: '17.6'
    text: |-
      Een overlaadstation als bedoeld in [artikel 13 van het Destructiebesluit 1996][ref1] dat overeenkomstig dat artikel
      op het tijdstip van inwerkingtreding van deze regeling in werking is, is door de Minister tot 1 mei 2004 erkend als
      intermediair categorie 1- of categorie 2-bedrijf, met dien verstande dat in dat bedrijf uitsluitend voorbereidende
      activiteiten worden verricht die verband houden met het verdere vervoer van categorie 1- of categorie 2-materiaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel13
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '13'
  - number: '17.7'
    text: |-
      Een crematorium als bedoeld in [artikel 30, eerste lid, onderdeel b, van het Destructiebesluit 1996][ref1] dat
      overeenkomstig dat artikellid op het tijdstip van inwerkingtreding van deze regeling in werking is, is door
      de Minister tot 1 mei 2004 erkend als een verbrandingsinstallatie als bedoeld in artikel 12, derde lid, van
      [verordening (EG) nr. 1774/2002](32002R1774).


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel30
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007837
        artikel: '30'
  - number: '18.1'
    text: |-
      [Artikel 16][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
  - number: 18.1.a
    text: |-
      een biogasinstallatie of composteerinstallatie waarin uitsluitend mest of categorie 3-materiaal als grondstof wordt
      verwerkt;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.1.b
    text: een oleochemisch bedrijf dat zowel van categorie 2-materiaal als van categorie 3-materiaal verkregen vet verwerkt;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.1.c
    text: |-
      een technisch bedrijf voor vervaardiging van verwerkte mest, mits de installatie of het bedrijf door de Minister
      is erkend en de installatie of het bedrijf sinds 1 november 2002 overeenkomstig de in het tweede lid genoemde
      voorwaarden in gebruik is.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: '18.2'
    text: 'Indien:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.2.a
    text: |-
      het een biogasinstallatie betreft, is voldaan aan bijlage VI, hoofdstuk II, onder B, is de installatie uitgerust
      overeenkomstig artikel 1, tweede lid, van [verordening (EG) nr. 810/2003](32003R0810) en is voldaan aan artikel 1,
      derde lid, van die verordening;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.2.b
    text: |-
      het een composteerinstallatie betreft, is voldaan aan bijlage VI, hoofdstuk II, onder B, is de installatie
      uitgerust overeenkomstig artikel 1, tweede lid, van [verordening (EG) nr. 809/2003](32003R0809) en is voldaan aan
      artikel 1, derde lid, van die verordening;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.2.c
    text: |-
      het een oleochemisch bedrijf betreft, wordt in het bedrijf een methode toegepast voor monitoring en controle op
      kritische controlepunten op basis van het gebruikte procédé en wordt overeenkomstig artikel 1, tweede lid, van
      beschikking (EG) nr. 2003/326 gehandeld;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.2.d
    text: |-
      het een technisch bedrijf betreft*,*is het bedrijf sinds 1 november 2002 tot de inwerkingtreding van deze regeling
      op grond van [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref1] geregistreerd en is voldaan
      aan bijlage VIII, hoofdstuk III, punt 5, met dien verstande dat onderdeel b van punt 5 niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '11'
  - number: '18.3'
    text: |-
      De in het eerste lid bedoelde erkenning alsmede de in [artikel 17, zesde en zevende lid][ref1], bedoelde erkenning,
      vervalt indien de installatie of het bedrijf wordt uitgebreid of de werkzaamheden worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel17
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '17'
        paragraaf: '3'
  - number: '18.4'
    text: 'Het eerste lid is van toepassing tot:'
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.4.a
    text: 1 januari 2005, voor zover het een biogas- of composteerinstallatie of een technisch bedrijf betreft;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: 18.4.b
    text: 1 november 2005, voor zover het een oleochemisch bedrijf betreft.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: '18.5'
    text: |-
      De in het eerste lid bedoelde erkenning wordt binnen 1 maand na de inwerkingtreding van deze regeling aangevraagd
      bij de VWA.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: '18.6'
    text: |-
      Met de erkenning, bedoeld in het eerste lid, wordt gelijkgesteld, indien het een
      technisch bedrijf betreft, een vóór de inwerkingtreding van de regeling op grond van
      [artikel 11.6 van de Regeling keuring en handel dierlijke producten][ref1] verrichte registratie voor desbetreffend
      technisch product, mits de registratie op het tijdstip van inwerkingtreding van deze regeling niet is doorgehaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel11
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '11'
  - number: '18.7'
    text: |-
      In zoverre in afwijking van het eerste lid is het vanaf de inwerkingtreding van deze regeling voor een tijdvak van
      3 maanden toegestaan een biogasinstallatie, composteerinstallatie of oleochemisch bedrijf als bedoeld in dat lid in
      werking te hebben zonder dat daarvoor een erkenning als bedoeld in het eerste lid is verleend.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel18
  - number: '19.1'
    text: |-
      Het is, voor zover van toepassing, verboden een overeenkomstig [artikel 16][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel16
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015527
        artikel: '16'
        paragraaf: '3'
  - number: 19.1.a
    text: |-
      erkend intermediair categorie 1-bedrijf of intermediair categorie 2-bedrijf in werking te hebben in strijd met de
      eisen van bijlage III, hoofdstuk I en hoofdstuk II, onderdeel B;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.b
    text: |-
      erkend intermediair categorie 3-bedrijf in werking te hebben in strijd met de eisen van bijlage III, hoofdstuk I en
      hoofdstuk II, onderdeel A;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.c
    text: erkend opslagbedrijf in werking te hebben in strijd met de eisen van bijlage III, hoofdstuk III;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.d
    text: |-
      erkende verbrandingsinstallatie of een erkende meeverbrandingsinstallatie waarop [richtlijn nr. 2000/76/EG]
      (32000L0076) niet van toepassing is in werking te hebben in strijd met artikel 12, derde lid, onderdelen a en b,
      van [verordening (EG) nr. 1774/2002](32002R1774) en met de eisen van bijlage IV;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.e
    text: |-
      erkend categorie 1-verwerkingsbedrijf of categorie 2-verwerkingsbedrijf in werking te hebben in strijd met de eisen
      van bijlage V, hoofdstukken I en II, en bijlage VI, hoofdstuk I;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.f
    text: |-
      erkend categorie 2-oleochemisch bedrijf of categorie 3-oleochemisch bedrijf in werking te hebben in strijd met
      artikel 14, tweede lid, onderdelen c en d, van [verordening (EG) nr. 1774/2002](32002R1774) en met de eisen van
      bijlage VI, hoofdstuk III;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.g
    text: |-
      erkende biogasinstallatie of composteerinstallatie in werking te hebben in strijd met artikel 15, tweede lid,
      onderdelen d en e, van [verordening (EG) nr. 1774/2002](32002R1774) en met de eisen van bijlage VI, hoofdstuk II;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.h
    text: |-
      erkend categorie 3-verwerkingsbedrijf in werking te hebben in strijd met de eisen van bijlage V, hoofdstukken I en
      II, bijlage VII en, indien het een verzamelcentrum is, bijlage IX, of, voor zover van toepassing, in strijd met de
      artikelen 3 en 4 van verordening (EG) nr. 811/2003;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.i
    text: |-
      erkend bedrijf voor de vervaardiging van voeder voor gezelschapsdieren in werking te hebben in strijd met artikel
      18, tweede lid, van [verordening (EG) nr. 1774/2002](32002R1774) en met de eisen van bijlage VIII;
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: 19.1.j
    text: |-
      erkend technisch bedrijf in werking te hebben in strijd met artikel 18, tweede lid, van [verordening (EG) nr.
      1774/2002](32002R1774) en met de eisen van bijlage VIII.
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
  - number: '19.2'
    text: |-
      Het is verboden een op grond van [artikel 18, eerste lid][ref1], erkende biogasinstallatie of composteerinstallatie
      of een op grond van dat artikellid erkend oleochemisch of technisch bedrijf in werking te hebben in strijd met
      [artikel 18, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015527#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0015527#Artikel18
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel19
