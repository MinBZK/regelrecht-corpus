    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel34
  - number: 34.a
    text: |-
      [artikel 29, tweede en derde lid, van het Destructiebesluit 1996][ref1] verstaan onder de beheerder: de natuurlijke
      of rechtspersoon die een categorie 1-, 2- of 3-verwerkingsbedrijf in stand houdt;


      [ref1]: https://wetten.overheid.nl/BWBR0007837#Artikel29
    url: https://wetten.overheid.nl/BWBR0015527/2004-12-08#Artikel34
    references:
