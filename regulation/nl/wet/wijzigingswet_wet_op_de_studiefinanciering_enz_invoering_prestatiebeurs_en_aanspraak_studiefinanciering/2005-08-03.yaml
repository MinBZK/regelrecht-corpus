preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om ter uitvoering van het Regeerakkoord het stelsel van
    studievoortgangscontrole in het hoger onderwijs te vervangen door een stelsel van prestatiebeurs;

    dat het tevens wenselijk is de leeftijdsgrens van 18 jaar voor aanspraken op studiefinanciering in het hoger
    onderwijs te laten vervallen;

    dat in verband daarmee wijziging van onder meer de Wet op de studiefinanciering en de Wet op het hoger onderwijs en
    wetenschappelijk onderzoek nodig is;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007972/2005-08-03#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      1 Deze wet treedt in werking met ingang van 1 augustus 1996, met dien verstande dat de bepalingen, genoemd in lid
      1*a* tot en met het zevende lid, in werking treden op de in die leden aangeduide tijdstippen.

      1a Artikel I met uitzondering van de onderdelen Q, R en S, en artikel II treden in werking met ingang van 1
      september 1996.

      2 Artikel VIII treedt in werking met ingang van 1 oktober 1996.

      3 Artikel I, de onderdelen Q, R en S, treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0007972/2005-08-03#ArtikelXIV
