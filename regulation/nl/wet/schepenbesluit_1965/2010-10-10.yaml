      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: '8'
    text: |-
      1

      2

      3 Een schip wordt in verband met de certificaten, bedoeld in [artikel 3, tweede lid][ref1], en de
      [artikelen 4][ref2] en [5][ref3], onderworpen aan de volgende onderzoeken:

      a. een eerste onderzoek voordat het schip in dienst wordt gesteld,

      b. een hernieuwd onderzoek in de periode van drie maanden voor het verstrijken van de geldigheidsduur van het
      certificaat, voor de vernieuwing daarvan,

      c. jaarlijkse onderzoeken in de periode van drie maanden voor tot drie maanden na de verjaardatum,

      d. tussentijdse of periodieke onderzoeken in de periode van drie maanden voor tot drie maanden na ofwel de tweede
      ofwel de derde verjaardatum,

      e. onderzoeken om bijzondere redenen na herstellingen en vernieuwingen aan het schip.

      4 Een schip wordt tevens onderworpen aan een onderzoek van de romp, de machine- en elektrische installaties en de
      uitrusting volgens de regels van het gekozen klassebureau.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel5
