  - number: '20'
    text: |-
      Indien een in Aruba, Curaçao of Sint Maarten ingediende aanvraag van een certificaat wordt afgewezen, geschiedt de
      afwijzing schriftelijk en met redenen omkleed door toezending of uitreiking aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel20
  - number: '21'
    text: |-
      1 Een certificaat van deugdelijkheid voor passagiersschepen en een veiligheidscertificaat voor passagiersschepen
      hebben een geldigheidsduur van een jaar. Alle overige certificaten hebben een geldigheidsduur van vijf jaar.

      2 Het Hoofd van de Scheepvaartinspectie kan certificaten afgeven met een kortere geldigheidsduur dan in het eerste
      lid bepaald indien nog niet alle onderzoeken naar zijn genoegen zijn voltooid of indien hij nog niet over alle door
      hem gevraagde gegevens van het schip beschikt.
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel21
  - number: '22'
    text: |-
      Na de voltooiing van een hernieuwd onderzoek is het nieuwe certificaat, in afwijking van
      [artikel 21, eerste lid][ref1], geldig vanaf de datum van voltooiing van het hernieuwde onderzoek tot:

      a. indien het een veiligheidscertificaat voor een passagiersschip betreft: een datum niet later dan twaalf maanden
      na de vervaldatum van het bestaande certificaat;

      b. voor alle andere certificaten met uitzondering van het conformiteitsdocument en het
      veiligheidsmanagementcertificaat: een datum niet later dan vijf jaar na de vervaldatum van het bestaande
      certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel21
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '21'
        hoofdstuk: III
  - number: '30'
    text: |-
      Een certificaat van deugdelijkheid verliest zijn geldigheid indien het schip wordt onttrokken aan de bestemming die
      het had ten tijde van de afgifte van dat certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel30
  - number: 63a
    text: |-
      Aan boord van een schip moeten maatregelen worden getroffen om geluidhinder te beperken. In ruimten voor machines
      moet daartoe worden voldaan aan het bepaalde in [artikel 36 van bijlage II van dit besluit][ref1] . In overige
      ruimten moet daartoe worden voldaan aan de door het Hoofd van de Scheepvaartinspectie gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 67a
    text: |-
      1 Tezamen met de resultaten van de hellingproef als bedoeld in [artikel 12 van dit besluit][ref1], dienen voldoende
      gegevens betreffende de stabiliteit voor verschillende hellingen van het schip te worden overgelegd aan het Hoofd
      van de Scheepvaartinspectie. De stabiliteit van het schip dient daarbij in alle voorkomende bedrijfstoestanden ten
      minste te voldoen aan door het Hoofd van de Scheepvaartinspectie vast te stellen criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel12
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '12'
        hoofdstuk: III
  - number: '93'
    text: |-
      1 Aan boord van een schip is de bij ministeriële regeling voorgeschreven medische uitrusting, bestaande uit
      geneesmiddelen, verplegingsartikelen en antidota, met de daarbij behorende controlelijsten en handleidingen,
      aanwezig volgens de voorschriften, vervat in [Bijlage XVI][ref1].

      2 De kapitein is verplicht zorg te dragen dat de medische uitrusting in goede staat verkeert, wordt
      aangevuld en zonodig wordt vernieuwd, zodra dit mogelijk is, in ieder geval bij voorrang tijdens de normale
      bevoorradingsprocedures. Hij kan het gebruik en het beheer van de medische uitrusting aan boord, onverminderd
      zijn eigen verantwoordelijkheid, overdragen aan een of meer schepelingen die voldoen aan de eisen, bedoeld in
      [artikel 117a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel117a
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
        artikel: 117a
        hoofdstuk: VII
  - number: 93a
    text: |-
      Aan boord van een schip, geen klein vaartuig zijnde, dat is voorzien van een automatische stuurinrichting, moet op
      de brug een wachtalarminstallatie van een goedgekeurd type zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel93a
  - number: '130'
    text: |-
      Gevaarlijke stoffen worden in de volgende klassen onderverdeeld:

      Klasse 1. ontplofbare stoffen;

      Klasse 2. samengeperste, tot vloeistof verdichte of onder druk opgeloste gassen;

      Klasse 3. ontvlambare vloeistoffen;

      Klasse 4.1. gemakkelijk vlam vattende vaste stoffen;

      Klasse 4.2. aan broei of zelfontbranding onderhevige stoffen;

