  - number: 1a
    text: De bepalingen van dit besluit zijn niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel1a
  - number: '3'
    text: |-
      1 Een certificaat als bedoeld in [artikel 3, eerste lid, van de wet][ref1] wordt alleen afgegeven indien:

      a. de eigenaar van een passagiersschip of een schip van 500 ton of meer beschikt over een geldig
      conformiteitsdocument (document of compliance) als bedoeld in de ISM-code voor de bedrijfsvoering van de
      organisatie;

      b. een passagiersschip of een schip van 500 ton of meer een veiligheidsmanagementcertificaat (safety management
      certificate) als bedoeld in de ISM-code aan boord heeft.

      2 De certificaten, bedoeld in [artikel 3, eerste lid, van de wet][ref2] zijn:

      a. voor elk schip van 150 ton of meer, dat is gebouwd vóór 21 juli 1968, en voor elk schip dat is gebouwd op
      of na 21 juli 1968 en dat een lengte heeft van 24 meter of meer: een internationaal certificaat van uitwatering
      (international load line certificate);

      b. voor andere schepen dan die, bedoeld onder a: een nationaal certificaat van uitwatering;

      c. voor alle schepen: een nationaal certificaat van deugdelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      Onze Minister wijst de natuurlijke personen of de rechtspersonen aan, klassebureaus genaamd, waarvan de regels
      kunnen gelden als eisen als bedoeld in [artikel 3a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 3a
  - number: '7'
    text: |-
      1 Voordat een eerste onderzoek plaatsvindt voor de verlening van certificaten, andere dan die genoemd in
      [artikel 3, eerste lid][ref1], kiest de eigenaar of de bouwer van een schip voor de regels van een bepaald
      klassebureau. Bij volgende onderzoeken worden de regels van dat klassebureau toegepast. Een schip voldoet met
      betrekking tot de romp, de machine- en elektrische installaties en de uitrusting aan de regels, gegeven door dat
      klassebureau, voorzover die regels niet in strijd zijn met het bepaalde bij of krachtens dit besluit.

      2


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#Artikel7
