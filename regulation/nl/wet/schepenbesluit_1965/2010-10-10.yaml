preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 17 mei 1965, no. 30.505 J, Directoraat-Generaal
    van Scheepvaart;

    Gelet op de artikelen 3, 4bis, 5, 9, 17, 66 en 73 van de Schepenwet;

    Gezien de bepalingen van het vanwege Ons op 17 juni 1960 te Londen ondertekende Internationaal Verdrag voor de
    beveiliging van mensenlevens op zee, 1960;

    De Raad van State van het Koninkrijk gehoord (advies van 9 juni 1965, no. 28);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 juli 1965, no. 31.032 J, Directoraat-
    Generaal van Scheepvaart;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002501/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onverminderd het bepaalde in het derde lid van dit artikel en het bepaalde in [artikel 107][ref1] van dit
      besluit, wordt voor de toepassing van dit besluit verstaan onder:

      *wet:* de [Schepenwet][ref2];

      *Onze Minister:* Onze Minister van Verkeer en Waterstaat;

      *kapitein:* elke gezagvoerder van een schip of die deze vervangt;

      *schepelingen:* allen die zich als scheepsofficieren of scheepsgezellen aan boord bevinden of zich als zodanig
      hebben verbonden; scheepsofficieren zijn de schepelingen aan wie de monsterrol de rang van officier toekent,
      scheepsgezellen zijn alle overige schepelingen;

      *gediplomeerden:* zij die in het bezit zijn van een diploma bedoeld in de Wet op de zeevaartdiploma's (Stb. 1935,
      456);

      *Radioreglement:* het Radioreglement (Trb. 1981, 78), behorende bij het op 6 november 1982 te Nairobi tot stand
      gekomen Internationale Verdrag betreffende de Telecommunicatie (Trb. 1983, 164);

      *ISM-code:* de internationale veiligheidscode voor de scheepvaart en ter voorkoming van verontreiniging
      (International Safety Management Code), vastgesteld bij resolutie A.741(18) van 4 november 1993 door de Algemene
      Vergadering van de Internationale Maritieme Organisatie;

      *passagiers:* alle personen aan boord, met uitzondering van:

      1e. de kapitein en de schepelingen;

      2e. andere personen die, in welke hoedanigheid ook, aan boord ten behoeve van het schip in dienst of tewerkgesteld
      zijn;

      3e. kinderen die op de dag van inscheping de leeftijd van één jaar nog niet hebben bereikt;

      *passagiersregistratiebeambte:* de verantwoordelijke persoon aan de wal die door de eigenaar van een
      passagiersschip is aangewezen om aan de verplichtingen van de ISM-code te voldoen of een persoon aan de wal die
      door de eigenaar verantwoordelijk is gemaakt voor het bijhouden van de gegevens van personen die aan boord zijn
      gegaan van een passagiersschip;

      *aangewezen instantie:* de bevoegde instantie van een staat die verantwoordelijk is voor de opsporings- en
      reddingsoperaties of de afwikkeling van de gevolgen van een ongeluk.

      *stoom- of motorschip:* een schip, geen zeilschip zijnde, met middelen tot werktuiglijke voortstuwing van een
      voldoend vermogen, te beoordelen naar normen die in verband met de vorm en de afmetingen van het schip, door het
      Hoofd van de Scheepvaartinspectie worden vastgesteld;

      *zeilschip:* een schip, al dan niet voorzien van middelen tot werktuiglijke voortstuwing, voldoende zeilen voerend
      om alleen daarmede veilig te kunnen varen, te beoordelen naar normen die in verband met de vorm en de afmetingen
      van het schip door het Hoofd van de Scheepvaartinspectie worden vastgesteld;

      *passagiersschip:* elk schip dat door de eigenaar is bestemd om meer dan twaalf passagiers te vervoeren, dan wel
      een schip, dat meer dan twaalf passagiers vervoert;

      *vrachtschip:* elk schip geen passagiersschip of vissersvaartuig zijnde;

      *tankschip:* een vrachtschip dat is gebouwd of is aangepast voor het vervoer in bulk van vloeibare lading van
      ontvlambare aard;

      *chemicaliëntankschip:* een vrachtschip dat is gebouwd of is aangepast en wordt gebruikt voor het vervoer in bulk
      van vloeibare lading zoals vermeld in de opsomming van minimumeisen per stof, behorende bij de door Onze Minister
      voor een zodanig schip gestelde aanvullende eisen, bedoeld in [artikel 130g][ref3];

      *gastankschip:* een vrachtschip dat is gebouwd of is aangepast en wordt gebruikt voor het vervoer in
      bulk van lading bestaande uit vloeibaar gemaakt gas of andere stoffen zoals vermeld in de opsomming van
      minimumeisen, behorende bij de door Onze Minister voor een zodanig schip gestelde aanvullende eisen, bedoeld in
      [artikel 130g][ref4];

      *combinatietankschip:* een schip ingericht voor het vervoer van afwisselend olie en stortladingen;

      *olietankschip:* een schip dat is gebouwd voor of aangepast aan voornamelijk het vervoer van olie in bulk in zijn
      laadruimten, daaronder begrepen combinatietankschepen en elk chemicaliëntankschip indien dit schip een gehele of
      gedeeltelijke lading olie in bulk vervoert;

      *bulkcarrier:* een schip dat in het algemeen is gebouwd met een enkel dek, top-zijtanks en hopper-zijtanks in
      de vrachtruimen en dat is bestemd voor het vervoer van stortlading, waaronder worden begrepen ertsschepen en
      combinatietankschepen;

      *hogesnelheidsvaartuig:* een vaartuig dat een maximum snelheid in meters per seconde kan ontwikkelen gelijk aan of
      groter dan 3,7 ▿0,1667, waarin ▿ = waterverplaatsing gemeten op de ontwerp-waterlijn (m3);

      *klein vaartuig:* elk schip, dat

      a. minder dan 500 ton meet;

      b. een lengte, als bedoeld in artikel 2, eerste lid, van bijlage I bij dit besluit, heeft van minder dan 24 meter;

      c. gebruikt wordt of bestemd is voor gebruik in een beperkt vaargebied van ten hoogste 30 zeemijlen uit de kust;

      d. niet is een passagiersschip dat internationale reizen maakt; en

      e. niet is een passagiersschip dat is ingericht om meerdaagse reizen te maken;

      *vissersvaartuig:* elk vaartuig dat wordt gebezigd voor het vangen van vis, walvissen, zeehonden, walrussen of
      andere levende rijkdommen van de zee;

      *baggermaterieel:* elk schip dat door bouw en inrichting uitsluitend is aangewezen voor het verrichten van of voor
      het gebruik ten dienste van aannemerswerken van waterbouwkundige aard;

      *internationale reis:* een reis tussen twee verschillende landen, waarbij een gebied voor welks buitenlandse
      betrekkingen een buiten dat gebied zetelende regering verantwoordelijk is of waarvan de Verenigde Naties het
      besturend lichaam zijn, mede als een afzonderlijk land wordt aangemerkt;

      *korte internationale reis:* een internationale reis gedurende welke het schip zich niet meer dan 200 zeemijlen
      verwijdert van een haven of een plaats waar passagiers en bemanning veilig kunnen worden geland en waarbij noch de
      afstand tussen de laatste aanloophaven in het land waar de reis aanvangt en de uiteindelijke haven van bestemming,
      noch de terugreis 600 zeemijlen overschrijden. Hierbij is de uiteindelijke haven van bestemming de laatste
      aanloophaven van de vastgestelde reis, waarvandaan het schip de terugreis onderneemt naar het land waar de reis
      aanving;

      *ton:* registerton van 1/0,353 kubieke meter;

      waar in dit besluit de grootte van een schip in deze eenheid wordt uitgedrukt, wordt daaronder verstaan de bruto-
      inhoud van het schip als vastgesteld volgens de bepalingen krachtens de Meetbrievenwet 1948;

      indien de grootte van een schip is vastgesteld volgens de bepalingen krachtens de [Meetbrievenwet 1981][ref5] en
      derhalve wordt aangegeven als bruto-tonnage, heeft deze term dezelfde betekenis als de term bruto-inhoud uitgedrukt
      in registerton;

      *lastlijn:* de waterlijn bij de grootste geoorloofde inzinking in zeewater;

      *vrijboord:* de in het midscheepse vlak vertikaal gemeten afstand van de bovenkant van de deklijn, als aangegeven
      in [artikel 3 van bijlage I van dit besluit][ref6], tot de bovenkant van de van toepassing zijnde lijn van het
      uitwateringsmerk, als aangegeven in [artikel 5 van genoemde bijlage][ref7] ;

      *indompelingsgrenslijn:* een lijn, gedacht op het scheepsboord, evenwijdig aan en op een afstand van 76 millimeter
      onder de aansnijding van de bovenzijde van het schottendek met dit boord;

      *voortstuwingsvermogen:*

      a. het maximale vermogen, uitgedrukt in kiloWatt (kW), dat door de voortstuwingsmachine(s) zonder overbelasting
      gedurende onbeperkte tijdsduur kan worden geleverd, zoals dit vermogen, op grond van door de fabrikant verstrekte
      gegevens, door het Hoofd van de Scheepvaartinspectie wordt vastgesteld, of

      b. een door het Hoofd van de Scheepvaartinspectie vastgesteld lager vermogen, indien te zijnen genoegen wordt
      aangetoond dat slechts dit lagere vermogen ten behoeve van de voortstuwing kan worden gebruikt; dit vermogen mag
      niet worden vastgesteld op een waarde lager dan 75 percent van het maximale vermogen;

      *vlampunt:* de laagste temperatuur van een vloeistof waarbij deze voldoende damp aan de lucht afgeeft om een
      ontplofbaar mengsel van damp en lucht te doen ontstaan. Het vlampunt moet worden bepaald volgens de gesloten-
      kroes-methode van Abel, Abel-Pensky of Pensky-Martens en gecorrigeerd voor een barometerstand van 760 millimeter
      kwikkolom;

      *goedgekeurd:* goedgekeurd door het Hoofd van de Scheepvaartinspectie;

      *leeftijd van een schip:* de tijd verlopen sedert het bouwjaar zoals aangegeven op het certificaat van
      deugdelijkheid van het betreffende schip;

      *klassebureau:* een natuurlijke persoon of rechtspersoon, aangewezen krachtens artikel 6, tweede lid, van de wet en
      krachtens artikel 6 van dit besluit;

      *verjaardatum:* de datum van afgifte van de eerste certificaten voor een bepaald schip, in elk kalenderjaar,
      volgend op het jaar waarin de eerste certificaten zijn afgegeven;

      *een schip gebouwd:* een schip waarvan:

      a. de kiel is gelegd, of

      b. 1°. de aanbouw, herkenbaar als behorend tot een bepaald schip, is aangevangen, en

      2°. is aangevangen met de samenbouw die ten minste 50 000 kg moet omvatten of één percent van de geschatte massa
      van al het bouwmateriaal, welke van deze twee waarden de laagste is;

      *belangrijke verbouwing:* de verbouwing van een schip:

      a. waardoor de afmetingen, het laadvermogen of de passagierscapaciteit van het schip in belangrijke mate wordt
      gewijzigd;

      b. waardoor het scheepstype wordt gewijzigd; of

      c. die naar het oordeel van het Hoofd van de Scheepvaartinspectie voornamelijk is gericht op het verlengen van de
      levensduur van het schip.

      2 Voor de toepassing van dit besluit wordt onder «schip» begrepen een vaartuig, een sleepschip, een dok en elk
      ander dergelijk drijvend voorwerp, dat over zee naar zijn bestemming wordt gesleept.

      3 Voor de toepassing van dit besluit worden personen, die ten gevolge van schipbreuk of andere bijzondere
      onvoorziene omstandigheden aan boord zijn genomen, niet als passagiers aangemerkt.

      4 Voor de toepassing van dit besluit wordt, ook wat de strafbepalingen betreft, onder «eigenaar» verstaan de
      persoon, die het beheer over het schip heeft, hetzij hij eigenaar, reder of boekhouder is van de rederij van het
      schip, hetzij hem het schip in gebruik is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel107
