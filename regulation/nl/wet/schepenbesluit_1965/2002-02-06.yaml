  - number: 182a.1
    text: |-
      Voor schepen gebouwd vóór 26 mei 1965, zijn de voorschriften van dit besluit met betrekking tot de constructie
      en inrichting, voor zover deze afwijken van die van het Schepenbesluit 1952, alleen van toepassing indien zulks
      praktisch uitvoerbaar en redelijk kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel182a
  - number: 182a.2
    text: |-
      De uit het bepaalde in het eerste lid voortvloeiende veranderingen van de constructie en inrichting aan boord
      van bedoelde schepen moeten – in overleg met de ambtenaren van de Scheepvaartinspectie – worden uitgevoerd bij
      belangrijke reparaties en vernieuwingen aan het casco, bij ingrijpende veranderingen in de accommodatie, bij het
      vernieuwen van installaties en bij andere daartoe geëigende gelegenheden. Als regel mogen schepen als bedoeld in
      het eerste lid, door het ondergaan van een reparatie of een verandering niet in geringere mate aan de voorschriften
      van dit besluit voldoen dan zij vóór de reparatie of de verandering deden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel182a
  - number: 182a.3
    text: |-
      Voor de in het eerste lid van dit artikel bedoelde schepen zijn de voorschriften van dit besluit met betrekking
      tot de uitrusting, voorzover deze afwijken van die van het Schepenbesluit 1952, van toepassing zoals hierna is
      aangegeven:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel182a
  - number: 182a.3.a
    text: |-
      vervanging van in het Schepenbesluit 1952 verplicht gestelde uitrustingsartikelen door die van het in het
      Schepenbesluit 1965 voorgeschreven type, moet plaats vinden bij vernieuwing van de betreffende artikelen of wanneer
      deze grote reparaties vereisen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel182a
  - number: 182a.3.b
    text: |-
      de verdere aanpassing van in het Schepenbesluit 1952 verplicht gestelde uitrusting aan die welke is voorgeschreven
      in het Schepenbesluit 1965, dient – voorzover zulks praktisch uitvoerbaar en redelijk is – plaats te hebben in
      overleg met de ambtenaren van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel182a
  - number: '183'
    text: |-
      Ministeriële regelingen vastgesteld krachtens dit besluit worden bekendgemaakt in de Staatscourant, in de
      Curaçaosche Courant en in het Afkondigingsblad van Aruba.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel183
  - number: '184'
    text: Dit besluit kan worden aangehaald als «Schepenbesluit 1965». Het werkt terug tot 26 mei 1965.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel184
