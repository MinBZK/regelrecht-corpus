  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt onder «schip» begrepen een vaartuig, een sleepschip, een dok en elk ander
      dergelijk drijvend voorwerp, dat over zee naar zijn bestemming wordt gesleept.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit worden personen, die ten gevolge van schipbreuk of andere bijzondere onvoorziene
      omstandigheden aan boord zijn genomen, niet als passagiers aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1
  - number: '1.4'
    text: |-
      Voor de toepassing van dit besluit wordt, ook wat de strafbepalingen betreft, onder «eigenaar» verstaan de persoon,
      die het beheer over het schip heeft, hetzij hij eigenaar, reder of boekhouder is van de rederij van het schip,
      hetzij hem het schip in gebruik is gegeven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1
  - number: 1a
    text: De bepalingen van dit besluit zijn niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1a
  - number: 1b.1
    text: |-
      Met de bij of krachtens dit besluit vastgestelde technische normen of technische eisen worden gelijkgesteld daaraan
      gelijkwaardige technische normen of technische eisen, vastgesteld door of vanwege een andere lid-staat van de
      Europese Unie dan wel door of vanwege een staat die partij is bij de overeenkomst inzake de Europese Economische
      Ruimte.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1b
  - number: 1b.2
    text: |-
      Met de bij of krachtens dit besluit geëiste typegoedkeuringen worden gelijkgesteld daaraan gelijkwaardige
      typegoedkeuringen, geëist door of vanwege een andere lid-staat van de Europese Unie dan wel door of vanwege een
      staat die partij is bij de overeenkomst inzake de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel1b
  - number: '2'
    text: |-
      Een schip van 100 ton of meer is voorzien van een uniek scheepsidentificatienummer dat voldoet aan bij ministeriële
      regeling te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel2
  - number: '3.1'
    text: |-
      Een certificaat als bedoeld in [artikel 3, eerste lid, van de wet][ref1] wordt alleen afgegeven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '3'
  - number: 3.1.a
    text: |-
      de eigenaar van een passagiersschip of een schip van 500 ton of meer beschikt over een geldig conformiteitsdocument
      (document of compliance) als bedoeld in de ISM-code voor de bedrijfsvoering van de organisatie;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
  - number: 3.1.b
    text: |-
      een passagiersschip of een schip van 500 ton of meer een veiligheidsmanagementcertificaat (safety management
      certificate) als bedoeld in de ISM-code aan boord heeft.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
  - number: '3.2'
    text: |-
      De certificaten, bedoeld in [artikel 3, eerste lid, van de wet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: 3.2.a
    text: |-
      voor elk schip van 150 ton of meer, dat is gebouwd vóór 21 juli 1968, en voor elk schip dat is gebouwd op of
      na 21 juli 1968 en dat een lengte heeft van 24 meter of meer: een internationaal certificaat van uitwatering
      (international load line certificate);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
  - number: 3.2.b
    text: 'voor andere schepen dan die, bedoeld onder a: een nationaal certificaat van uitwatering;'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
  - number: 3.2.c
    text: 'voor alle schepen: een nationaal certificaat van deugdelijkheid.'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel3
  - number: '4'
    text: |-
      De certificaten, bedoeld in [artikel 3, eerste lid, van de wet][ref1] zijn voorts:


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '3'
  - number: 4.a
    text: |-
      voor passagiersschepen: een internationaal veiligheidscertificaat voor passagiersschepen (passenger ship safety
      certificate) met bijbehorend uitrustingsrapport (record of equipment);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel4
  - number: 4.b
    text: |-
      voor vrachtschepen van 500 ton of meer: een internationaal veiligheidscertificaat voor vrachtschepen (cargo ship
      safety certificate) met bijbehorend uitrustingsrapport (record of equipment);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel4
  - number: 4.c
    text: |-
      voor vrachtschepen van 300 ton of meer, maar van minder dan 500 ton: een internationaal radioveiligheidscertificaat
      (cargo ship safety radio certificate) met bijbehorend uitrustingsrapport (record of equipment).
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel4
  - number: '5.1'
    text: |-
      Een schip dat vanuit Nederland, de Nederlandse Antillen of Aruba paarden, rundvee, varkens, schapen of geiten
      vervoert, anders dan als deklading, dient voorts te beschikken over een nationaal dierenvervoercertificaat voor de
      te ondernemen reis.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel5
  - number: '5.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat hogesnelheidsvaartuigen, olietankschepen, gas- en
      chemicaliëntankschepen, bulkcarriers en andere categorieën schepen, bestemd of gebruikt voor het vervoer van
      bepaalde stoffen of voor bijzondere doeleinden, over bijzondere certificaten dienen te beschikken.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel5
  - number: '6'
    text: |-
      Onze Minister wijst de natuurlijke personen of de rechtspersonen aan, klassebureaus genaamd, waarvan de regels
      kunnen gelden als eisen als bedoeld in [artikel 3a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: 3a
  - number: '7.1'
    text: |-
      Voordat een eerste onderzoek plaatsvindt voor de verlening van certificaten, andere dan die genoemd in
      [artikel 3, eerste lid][ref1], kiest de eigenaar of de bouwer van een schip voor de regels van een bepaald
      klassebureau. Bij volgende onderzoeken worden de regels van dat klassebureau toegepast. Een schip voldoet met
      betrekking tot de romp, de machine- en elektrische installaties en de uitrusting aan de regels, gegeven door dat
      klassebureau, voorzover die regels niet in strijd zijn met het bepaalde bij of krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      Voor de onderzoeken met betrekking tot de certificaten, genoemd in [artikel 3, eerste lid][ref1], kiest de eigenaar
      van een schip voor een klassebureau, dat een ander klassebureau kan zijn dan het klassebureau, gekozen op grond van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      De bedrijfsvoering van de eigenaar van een passagiersschip of van een schip van 500 ton of meer wordt in verband
      met het document, bedoeld in [artikel 3, eerste lid, onder a][ref1], onderworpen aan de volgende onderzoeken:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: 8.1.a
    text: een eerste onderzoek voor de verlening van het document,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.1.b
    text: een hernieuwd onderzoek voor de vernieuwing van het document,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.1.c
    text: |-
      jaarlijkse onderzoeken in de periode van drie maanden voor tot drie maanden na de datum van afgifte van het
      document.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: '8.2'
    text: |-
      Een schip wordt in verband met het certificaat, bedoeld in [artikel 3, eerste lid, onder b][ref1], onderworpen aan
      de volgende onderzoeken:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
  - number: 8.2.a
    text: een eerste onderzoek voordat het schip in dienst wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.2.b
    text: een hernieuwd onderzoek voor de vernieuwing van het certificaat,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.2.c
    text: een tussentijds onderzoek in de periode tussen 24 en 36 maanden na de datum van afgifte van het certificaat,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.2.d
    text: onderzoeken om bijzondere redenen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: '8.3'
    text: |-
      Een schip wordt in verband met de certificaten, bedoeld in [artikel 3, tweede lid][ref1], en de [artikelen 4][ref2]
      en [5][ref3], onderworpen aan de volgende onderzoeken:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel5
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '5'
        hoofdstuk: II
  - number: 8.3.a
    text: een eerste onderzoek voordat het schip in dienst wordt gesteld,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.3.b
    text: |-
      een hernieuwd onderzoek in de periode van drie maanden voor het verstrijken van de geldigheidsduur van het
      certificaat, voor de vernieuwing daarvan,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.3.c
    text: jaarlijkse onderzoeken in de periode van drie maanden voor tot drie maanden na de verjaardatum,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.3.d
    text: |-
      tussentijdse of periodieke onderzoeken in de periode van drie maanden voor tot drie maanden na ofwel de tweede
      ofwel de derde verjaardatum,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: 8.3.e
    text: onderzoeken om bijzondere redenen na herstellingen en vernieuwingen aan het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: '8.4'
    text: |-
      Een schip wordt tevens onderworpen aan een onderzoek van de romp, de machine- en elektrische installaties en de
      uitrusting volgens de regels van het gekozen klassebureau.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling wordt het aanvullende uitgebreide inspectieprogramma vastgesteld waaraan de in
      [artikel 5, tweede lid][ref1], bedoelde schepen zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel5
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '5'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Voor de verkrijging van een conformiteitsdocument dient een scheepseigenaar te beschikken over een
      veiligheidsmanagementsysteem dat voldoet aan de eisen, gesteld in [bijlage VI][ref1]. Een eerste onderzoek vindt
      plaats nadat het systeem ten minste gedurende drie maanden is toegepast in de bedrijfsorganisatie van de eigenaar
      alsmede aan boord van ten minste één schip van ieder type waarop het systeem betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '9.2'
    text: |-
      Een voorlopig conformiteitsdocument met een geldigheidsduur van ten hoogste twaalf maanden wordt afgegeven ten
      behoeve van een nieuw gevestigde eigenaar dan wel een eigenaar die een nieuw scheepstype in gebruik neemt. Tijdens
      die periode vindt een eerste onderzoek als bedoeld in het eerste lid plaats. Het onderzoek is voltooid vóór de
      vervaldatum van het document.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel9
  - number: '9.3'
    text: |-
      Jaarlijks wordt in de periode van drie maanden voor tot drie maanden na de datum van afgifte van het document de
      doelmatigheid van het veiligheidsmanagementsysteem onderzocht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel9
  - number: '9.4'
    text: |-
      In de periode van zes maanden voor de vervaldatum van het document vindt een hernieuwd onderzoek plaats naar het
      veiligheidsmanagementsysteem alvorens een nieuw document wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel9
  - number: '10.1'
    text: |-
      Voor de verkrijging van een veiligheidsmanagementcertificaat dient aan boord van het schip het
      veiligheidsmanagementsysteem van de eigenaar van het schip te worden toegepast. Een eerste onderzoek vindt plaats
      nadat het systeem gedurende ten minste drie maanden is toegepast.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel10
  - number: '10.2'
    text: |-
      Een voorlopig veiligheidsmanagementcertificaat met een geldigheidsduur van ten hoogste zes maanden wordt afgegeven
      ten behoeve van een schip dat voor het eerst door de eigenaar in gebruik wordt genomen. Tijdens die periode vindt
      een eerste onderzoek als bedoeld in het eerste lid plaats. Het onderzoek is voltooid vóór de vervaldatum van het
      document.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel10
  - number: '10.3'
    text: |-
      Bij een tussentijds onderzoek, dat plaatsvindt tussen 24 en 36 maanden na de datum van afgifte van het certificaat,
      wordt onderzocht of de bedrijfsvoering op het schip nog voldoet aan de eisen, gesteld in [bijlage VI][ref1]. Van
      dit onderzoek wordt een aantekening geplaatst op het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '10.4'
    text: |-
      Een veiligheidsmanagementcertificaat wordt slechts afgegeven indien een kopie van het conformiteitsdocument, geldig
      voor het desbetreffende type schip, aan boord is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel10
  - number: '10.5'
    text: |-
      In de periode van zes maanden voor de vervaldatum van het certificaat vindt een hernieuwd onderzoek plaats naar het
      veiligheidsmanagementsysteem alvorens een nieuw certificaat wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel10
  - number: '11.1'
    text: |-
      Voor de verkrijging en voor de vernieuwing van een internationaal of een nationaal certificaat van uitwatering
      wordt een schip onderworpen aan een eerste, onderscheidenlijk een hernieuwd onderzoek, dat een volledige inspectie
      omvat van de constructie en de uitrusting voorzover hieraan bij of krachtens dit besluit eisen zijn gesteld ten
      aanzien van de uitwatering. Bij een eerste onderzoek wordt bovendien een vrijboordrapport opgemaakt. Het onderzoek
      is in het bijzonder gericht op de inrichting, het materiaal en de verbanddelen als bedoeld in [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '11.2'
    text: 'Bij het jaarlijkse onderzoek wordt onderzocht:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
  - number: 11.2.a
    text: |-
      of er veranderingen in de romp of in de bovenbouw zijn aangebracht die van invloed zijn op de berekeningen tot
      vaststelling van de plaats van de uitwateringslijn,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
  - number: 11.2.b
    text: |-
      of de onderdelen en de middelen voor de bescherming van openingen, de verschansing of het relingwerk, de
      waterloospoorten en de toegangen tot de verblijven van de bemanning in deugdelijke staat verkeren,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
  - number: 11.2.c
    text: of de vrijboordmerken juist en onuitwisbaar zijn aangebracht, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
  - number: 11.2.d
    text: |-
      of de ingevolge [artikel 10 van bijlage I][ref1] vereiste gegevens omtrent de stabiliteit aanwezig zijn. Van dit
      onderzoek wordt een aantekening geplaatst op het certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '12.1'
    text: 'Een nationaal certificaat van deugdelijkheid wordt afgegeven nadat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: 12.1.a
    text: |-
      uit een hellingproef is gebleken dat het schip voldoet aan de eisen, bij of krachtens dit besluit gesteld ten
      aanzien van de stabiliteit,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: 12.1.b
    text: de aan het schip verstrekte zeebrief en meetbrief zijn overgelegd, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: 12.1.c
    text: |-
      de overige certificaten die voor het schip zijn vereist, alsmede geldige certificaten voor de romp en de machine-
      en elektrische installaties, afgegeven door het klassebureau van het schip, zijn overgelegd dan wel, indien het
      een schip van minder dan 500 ton betreft, nadat uit een onderzoek is gebleken dat het schip voldoet aan de eisen,
      gesteld bij of krachtens dit besluit. Het document inzake de minimum voorgeschreven bemanningssamenstelling,
      bedoeld in [artikel 109, derde lid][ref1], wordt als aanhangsel bij het certificaat van deugdelijkheid gevoegd.
      Voor vrachtschepen van minder dan 500 ton wordt bovendien een uitrustingsrapport bij het certificaat gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel109
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '109'
        hoofdstuk: VII
  - number: '12.2'
    text: |-
      Indien er aanleiding is om in verband met de klassenotatie, de bouw, de toestand of de uitrusting van het schip
      beperkingen op te leggen betreffende het toe te kennen vaargebied, bepaalt het Hoofd van de Scheepvaartinspectie
      voor welk vaargebied of voor welke reizen het certificaat van deugdelijkheid geldig is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '12.3'
    text: |-
      Bij het jaarlijkse onderzoek wordt onderzocht of het schip nog voldoet aan de eisen, gesteld bij of krachtens
      dit besluit. Van het onderzoek wordt een aantekening op het certificaat van deugdelijkheid geplaatst. Schepen van
      minder dan 500 ton worden bovendien gedurende elk tijdvak van vijf jaar tweemaal onderworpen aan een onderzoek van
      de buitenzijde van de romp, waarbij de periode tussen twee onderzoeken ten hoogste 36 maanden mag omvatten. Van dit
      onderzoek wordt een aantekening geplaatst op het certificaat van deugdelijkheid.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '12.4'
    text: |-
      Indien een schip wijzigingen heeft ondergaan die van invloed zijn op de voor het schip vastgestelde
      stabiliteitsgegevens, kan het Hoofd van de Scheepvaartinspectie verlangen dat het schip opnieuw aan een
      hellingproef wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '12.5'
    text: |-
      Voorts kan een schip aan een hellingproef worden onderworpen indien de nodige stabiliteitsgegevens niet kunnen
      worden overgelegd, of indien deze gegevens naar het oordeel van het Hoofd van de Scheepvaartinspectie onvoldoende
      betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '12.6'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan ontheffing verlenen van het bepaalde in het eerste lid, onder a, indien
      resultaten van een hellingproef beschikbaar zijn van een zusterschip en ten genoegen van het Hoofd wordt aangetoond
      dat hieraan betrouwbare gegevens kunnen worden ontleend over de stabiliteit van het schip waarvoor een certificaat
      van deugdelijkheid wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '12.7'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voorts ontheffing verlenen van het bepaalde in het eerste lid, onder
      a, ten behoeve van een schip dat speciaal is ontworpen voor het vervoer in bulk van vloeistoffen of erts, indien
      uit resultaten van een hellingproef met een gelijksoortig schip blijkt dat ten gevolge van de afmetingen en de
      inrichting van het schip de aanvangsstabiliteit in alle te verwachten beladingstoestanden voldoende zal zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel12
  - number: '13.1'
    text: |-
      Voor de verkrijging van een veiligheidscertificaat voor passagiersschepen wordt een passagiersschip onderworpen aan
      een eerste onderzoek, dat een volledige inspectie omvat van de constructie van het schip, de machine-installaties
      en de uitrusting, met inbegrip van de gehele romp van het schip aan de buitenzijde en het in- en uitwendige van de
      ketels, overeenkomstig de eisen daaraan gesteld bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel13
  - number: '13.2'
    text: |-
      Een hernieuwd onderzoek omvat een inspectie van de constructie van het schip, de machine-installaties en de
      uitrusting, met inbegrip van de gehele romp van het schip aan de buitenzijde, en de ketels en de drukvaten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel13
  - number: '13.3'
    text: |-
      Een passagiersschip wordt eenmaal per vijf jaar onderworpen aan een deadweight-onderzoek als bedoeld in
      [artikel 22, tweede lid, van bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '13.4'
    text: |-
      Indien een passagiersschip tijdens een bepaalde reis minder personen aan boord heeft dan het in het
      veiligheidscertificaat vermelde maximum aantal, kan het Hoofd van de Scheepvaartinspectie een aanhangsel bij
      het certificaat afgeven, waarin het aantal reddingboten en andere reddingmiddelen wordt vermeld waarmee voor die
      bepaalde reis kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel13
  - number: '14.1'
    text: |-
      Voor de verkrijging en voor de vernieuwing van een veiligheidscertificaat voor vrachtschepen wordt een vrachtschip
      onderworpen aan een eerste, onderscheidenlijk een hernieuwd onderzoek, dat omvat de constructie, de machine-
      installaties en de uitrusting, de romp aan de buitenzijde, de radio-installaties met inbegrip van die, gebruikt
      in groepsreddingmiddelen, de reddingmiddelen en andere uitrusting, overeenkomstig de eisen, daaraan gesteld bij of
      krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: '14.2'
    text: 'Bij het jaarlijkse onderzoek worden onderzocht:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: 14.2.a
    text: de constructie, de machine-installaties en de uitrusting,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: 14.2.b
    text: de reddingmiddelen en de andere uitrusting van het schip, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: 14.2.c
    text: de radio-installaties, met inbegrip van die welke worden gebruikt in groepsreddingmiddelen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: '14.3'
    text: |-
      Ten aanzien van de in het tweede lid, onder a, genoemde onderdelen vindt een tussentijds onderzoek plaats, dat in
      de plaats treedt van ofwel het tweede ofwel het derde jaarlijkse onderzoek. Van dit tussentijdse onderzoek wordt
      een aantekening geplaatst op het certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: '14.4'
    text: |-
      Ten aanzien van de in het tweede lid, onder b, genoemde onderdelen vindt een periodiek onderzoek plaats, dat in
      de plaats treedt van ofwel het tweede ofwel het derde jaarlijkse onderzoek. Van dit periodieke onderzoek wordt een
      aantekening geplaatst op het certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: '14.5'
    text: |-
      De buitenzijde van de romp van een vrachtschip wordt gedurende elk tijdvak van vijf jaar tweemaal onderzocht,
      waarbij de periode tussen twee onderzoeken ten hoogste 36 maanden mag omvatten. Van dit onderzoek wordt een
      aantekening geplaatst op het certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel14
  - number: '15.1'
    text: |-
      Voor de verkrijging van een radioveiligheidscertificaat wordt de radio-installatie van een vrachtschip, met
      inbegrip van die, gebruikt in groepsreddingmiddelen, onderworpen aan een volledige inspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel15
  - number: '15.2'
    text: |-
      Bij het periodieke onderzoek en bij het hernieuwde onderzoek wordt de radio-installatie, met inbegrip van die,
      gebruikt in groepsreddingmiddelen, onderworpen aan een inspectie. Van het periodiek onderzoek wordt een aantekening
      geplaatst op het certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel15
  - number: '16'
    text: |-
      Een nationaal certificaat voor dierenvervoer wordt afgegeven nadat uit een onderzoek is gebleken dat het schip
      voldoet aan de eisen, gesteld in [bijlage XX][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '17'
    text: |-
      Indien het Hoofd van de Scheepvaartinspectie ten behoeve van een schip ontheffing verleent van bij of krachtens
      dit besluit gestelde eisen, voegt hij aan het desbetreffende certificaat een certificaat van ontheffing toe. Van
      deze toevoeging wordt een aantekening geplaatst op het oorspronkelijke certificaat. De geldigheidsduur van een
      certificaat van ontheffing kan niet langer zijn dan de geldigheidsduur van het certificaat waarbij het behoort.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel17
  - number: '18.1'
    text: |-
      De onderzoeken in verband met een conformiteitsdocument en een veiligheidsmanagementcertificaat worden uitgevoerd
      door een klassebureau naar keuze van de eigenaar van het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: '18.2'
    text: |-
      Indien een schip bij een klassebureau is ondergebracht, dan worden, naast de onderzoeken van de romp en de machine-
      en elektrische installaties, ook de volgende onderzoeken door dat klassebureau uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: 18.2.a
    text: het eerste, het jaarlijkse en het hernieuwde onderzoek in verband met het certificaat van uitwatering,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: 18.2.b
    text: |-
      het jaarlijkse onderzoek van de uitrusting en het eerste, het hernieuwde, het jaarlijkse en het tussentijdse
      onderzoek van de constructie van vrachtschepen en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: 18.2.c
    text: het onderzoek van de constructie van passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: '18.3'
    text: In alle andere gevallen worden de onderzoeken uitgevoerd door ambtenaren van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: '18.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan, indien daartoe dringende redenen zijn, bepalen dat een onderzoek
      als bedoeld in het eerste of tweede lid niet wordt uitgevoerd door het desbetreffende klassebureau maar door de
      ambtenaren van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: '18.5'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan toestaan dat het periodiek onderzoek van de uitrusting en van de radio-
      installatie van een vrachtschip en de onderzoeken van de buitenzijde van de romp worden uitgevoerd door een
      klassebureau.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel18
  - number: '19.1'
    text: De aanvraag van certificaten geschiedt schriftelijk bij het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: '19.2'
    text: |-
      Bij de eerste aanvraag van een certificaat, niet zijnde een conformiteitsdocument of een
      veiligheidsmanagementcertificaat, worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: 19.2.a
    text: de voor de controle van de bouw en de inrichting van het schip noodzakelijke tekeningen,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: 19.2.b
    text: 'indien voor het schip in een ander land certificaten zijn afgegeven: afschriften van deze certificaten,'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: 19.2.c
    text: |-
      indien het schip is ondergebracht bij een klassebureau: verklaringen van dat klassebureau betreffende de romp en de
      machine- en elektrische installaties.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: '19.3'
    text: |-
      Bij de eerste aanvraag van een conformiteitsdocument of een veiligheidsmanagementcertificaat wordt een verklaring
      overgelegd van het desbetreffende klassebureau dat het eerste onderzoek naar het veiligheidsmanagementsysteem aan
      de wal en aan boord van het schip is voltooid.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: '19.4'
    text: |-
      Het tijdvak van geldigheid, alsmede nadere voorschriften of beperkingen, verbonden aan het certificaat, worden bij
      de afgifte op het certificaat aangetekend.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel19
  - number: '20'
    text: |-
      Indien een op de Nederlandse Antillen of op Aruba ingediende aanvraag van een certificaat wordt afgewezen,
      geschiedt de afwijzing schriftelijk en met redenen omkleed door toezending of uitreiking aan de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel20
  - number: '21.1'
    text: |-
      Een certificaat van deugdelijkheid voor passagiersschepen en een veiligheidscertificaat voor passagiersschepen
      hebben een geldigheidsduur van een jaar. Alle overige certificaten hebben een geldigheidsduur van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel21
  - number: '21.2'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan certificaten afgeven met een kortere geldigheidsduur dan in het eerste
      lid bepaald indien nog niet alle onderzoeken naar zijn genoegen zijn voltooid of indien hij nog niet over alle door
      hem gevraagde gegevens van het schip beschikt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel21
  - number: '22'
    text: |-
      Na de voltooiing van een hernieuwd onderzoek is het nieuwe certificaat, in afwijking van
      [artikel 21, eerste lid][ref1], geldig vanaf de datum van voltooiing van het hernieuwde onderzoek tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel21
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '21'
        hoofdstuk: III
  - number: 22.a
    text: |-
      indien het een veiligheidscertificaat voor een passagiersschip betreft: een datum niet later dan twaalf maanden na
      de vervaldatum van het bestaande certificaat;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel22
  - number: 22.b
    text: |-
      voor alle andere certificaten met uitzondering van het conformiteitsdocument en het
      veiligheidsmanagementcertificaat: een datum niet later dan vijf jaar na de vervaldatum van het bestaande
      certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel22
  - number: '23'
    text: |-
      Indien de geldigheid van een certificaat is vervallen omdat een jaarlijks, een tussentijds of een periodiek
      onderzoek of een onderzoek van de romp aan de buitenzijde door omstandigheden die buiten de macht van de eigenaar
      of de kapitein van het schip zijn gelegen, niet binnen de daarvoor gestelde termijn heeft plaatsgevonden, kan het
      Hoofd van de Scheepvaartinspectie de geldigheid van het certificaat herstellen indien naar zijn mening bij een
      inspectie voldoende is gebleken dat het schip voldoet aan de desbetreffende eisen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel23
  - number: '24.1'
    text: |-
      Na de voltooiing van een hernieuwd onderzoek is een nieuw conformiteitsdocument of een nieuw
      veiligheidsmanagementcertificaat, in afwijking van [artikel 21, eerste lid][ref1], geldig vanaf de datum van
      voltooiing van het hernieuwde onderzoek tot een datum niet later dan vijf jaar na de vervaldatum van het bestaande
      document onderscheidenlijk certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel21
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '21'
        hoofdstuk: III
  - number: '24.2'
    text: |-
      Wanneer een hernieuwd onderzoek voor een conformiteitsdocument of voor een veiligheidsmanagementcertificaat wordt
      voltooid na de vervaldatum van het bestaande document of certificaat, is het nieuwe document of certificaat geldig
      vanaf de datum van voltooiing van het onderzoek tot ten hoogste vijf jaar na de vervaldatum van het bestaande
      document of certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel24
  - number: '25'
    text: |-
      Indien een hernieuwd onderzoek is voltooid en er geen nieuw certificaat kan worden afgegeven of aan het schip kan
      worden verstrekt voor de vervaldatum van het bestaande certificaat, kan degene die het onderzoek heeft uitgevoerd
      daarvan een aantekening plaatsen op het bestaande certificaat. In dat geval wordt het certificaat nog als geldig
      aangemerkt voor een tijdvak van ten hoogste vijf maanden na de vervaldatum.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel25
  - number: '26'
    text: |-
      Indien een schip zich op het tijdstip waarop een certificaat zijn geldigheid verliest niet in een haven bevindt
      waar een onderzoek kan plaatsvinden, kan het Hoofd van de Scheepvaartinspectie de geldigheidsduur van het
      certificaat verlengen voor een tijdvak van ten hoogste drie maanden ten einde het schip in staat te stellen zijn
      reis naar de haven waar het zal worden onderzocht te voltooien. Het schip mag die haven niet verlaten zonder nieuw
      certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel26
  - number: '27'
    text: |-
      De geldigheid van een certificaat dat is afgegeven ten behoeve van een schip dat korte reizen maakt en waarvan
      de geldigheid niet reeds uit anderen hoofde is verlengd, kan door het Hoofd van de Scheepvaartinspectie voor ten
      hoogste een maand worden verlengd. Na de voltooiing van het hernieuwde onderzoek is het nieuwe certificaat geldig
      tot:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel27
  - number: 27.a
    text: |-
      indien het een veiligheidscertificaat voor een passagiersschip betreft: een datum niet later dan twaalf maanden na
      de oorspronkelijke vervaldatum van het bestaande certificaat;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel27
  - number: 27.b
    text: |-
      voor alle andere certificaten: een datum niet later dan vijf jaar na de oorspronkelijke vervaldatum van het
      bestaande certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel27
  - number: '28'
    text: |-
      Indien in verband met schade aan het schip een hernieuwd onderzoek heeft plaatsgevonden meer dan drie maanden
      voordat een certificaat zijn geldigheid verliest, kan het Hoofd van de Scheepvaartinspectie afwijken van de
      [artikelen 22][ref1], [26][ref2] en [27][ref3]. In dat geval is het nieuwe certificaat geldig tot:


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel27
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '22'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '26'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '27'
        hoofdstuk: III
  - number: 28.a
    text: |-
      indien het een veiligheidscertificaat voor een passagiersschip betreft: een datum niet later dan twaalf maanden na
      de datum van voltooiing van het hernieuwde onderzoek;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel28
  - number: 28.b
    text: |-
      voor alle andere certificaten: een datum niet later dan vijf jaar na de datum van voltooiing van het hernieuwde
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel28
  - number: '29'
    text: |-
      Indien een jaarlijks, een tussentijds of een periodiek onderzoek is voltooid vóór de aanvang van het tijdvak waarin
      het dient plaats te vinden, worden er één of meer aanvullende jaarlijkse, tussentijdse of periodieke onderzoeken
      verricht op zodanig gekozen tijdstippen dat de maximum perioden tussen de voorgeschreven onderzoeken niet worden
      overschreden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel29
  - number: '30'
    text: |-
      Een certificaat van deugdelijkheid verliest zijn geldigheid indien het schip wordt onttrokken aan de bestemming die
      het had ten tijde van de afgifte van dat certificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel30
  - number: '31'
    text: |-
      Nadat een onderzoek als bedoeld in de [artikelen 11 tot en met 16][ref1] is beëindigd wordt de toestand van het
      schip, voorzover het onderworpen is geweest aan een onderzoek, gehandhaafd in overeenstemming met het bepaalde
      bij of krachtens dit besluit en in overeenstemming met de regels van het desbetreffende klassebureau. Zonder
      voorafgaande toestemming van het Hoofd van de Scheepvaartinspectie, onderscheidenlijk van het desbetreffende
      klassebureau indien dit het onderzoek heeft uitgevoerd, mag geen verandering in de toestand van het schip worden
      aangebracht, voorzover deze toestand aan het onderzoek was onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel11
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '11'
        hoofdstuk: III
  - number: '32.1'
    text: |-
      Indien een schip schade heeft opgelopen of zich iets heeft voorgedaan waardoor het vermoeden rijst dat schade
      dan wel een gebrek is ontstaan waardoor de veiligheid van het schip dan wel de deugdelijkheid of de volledigheid
      van de reddingmiddelen of van de andere uitrusting kan zijn beïnvloed, licht de kapitein zo spoedig mogelijk de
      Scheepvaartinspectie in. Indien het bedoelde voorval betrekking heeft op de romp of de machine- en elektrische
      installaties en een klassebureau het onderzoek, bedoeld in [artikel 7][ref1], heeft verricht, licht de kapitein
      tevens het desbetreffende klassebureau in. Indien het schip zich buiten het Koninkrijk bevindt, dienen tevens de
      bevoegde autoriteiten van de eerstvolgende haven te worden ingelicht, dan wel de autoriteiten van de haven waarin
      het schip zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel7
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '7'
        hoofdstuk: III
  - number: '32.2'
    text: |-
      Indien het schip zich in een haven bevindt, mag de reis niet worden voortgezet voordat de kapitein van de
      Scheepvaartinspectie of van het desbetreffende klassebureau een verklaring heeft ontvangen, inhoudende dat
      eventuele herstellingen naar behoren zijn geschied of dat de reis zonder bezwaar voor de veiligheid van het schip
      kan worden voortgezet, voorzover de ter plaatse bevoegde autoriteiten zich niet tegen voortzetting van de reis
      verzetten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel32
  - number: '33'
    text: |-
      De [artikelen 3, eerste en tweede lid][ref1], [4][ref2] en [5][ref3] zijn niet van toepassing op niet
      werktuiglijk voortbewogen schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel5
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '5'
        hoofdstuk: II
  - number: '35'
    text: |-
      Het voor de bouw van de scheepsromp en van de voornaamste werktuigen te bezigen materiaal, zomede dat, te gebruiken
      bij verbouwing, belangrijke herstelling of vernieuwing van vitale delen, moet voldoen aan en zijn gekeurd volgens
      de door een klassebureau gestelde eisen en zijn gekeurd op de wijze, als daarin is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel35
  - number: '38'
    text: |-
      De huid en de wanden van waterdichte afdelingen, als schotten, dekken en de tanktop van een dubbele bodem, moeten
      deugdelijk waterdicht zijn afgewerkt. De huid en deze wanden moeten voldoende zijn verstijfd tegen de waterdruk die
      ter plaatse, ook in geval van nood, kan optreden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel38
  - number: '39.1'
    text: |-
      De waterdichte indeling moet zo doeltreffend zijn als redelijkerwijs, in verband met de eisen van het bedrijf, kan
      worden verlangd en moet tevens voldoen aan de voorschriften van [bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '39.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid moeten aan boord van een klein vaartuig ten minste de volgende
      waterdichte afdelingen aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
  - number: 39.2.a
    text: voorpiek;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
  - number: 39.2.b
    text: voortstuwingsruimte, indien het schip voorzien is van middelen tot voortstuwing; en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
  - number: 39.2.c
    text: achterpiek.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
  - number: '39.3'
    text: |-
      De stabiliteit van een schip in beschadigde toestand moet voldoen aan de voorschriften van
      [bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '40.1'
    text: |-
      Terugslagkleppen of afsluiters in waterdichte schotten, die deel uitmaken van een pijpleidingsysteem, en
      waterdichte deuren moeten goed sluiten en voldoende sterk zijn en hun bewegings- en sluitingsinrichtingen moeten
      een goede werking te allen tijde kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel40
  - number: '40.2'
    text: |-
      Waterdichte deuren op een passagiersschip moeten voldoen aan de eisen gesteld in
      [bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '40.3'
    text: |-
      Mangaten op ruimten voor berging van water en olie en op kofferdammen en droge tanks moeten, wanneer het schip
      ledig is, gemakkelijk bereikbaar zijn en naar behoren kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel40
  - number: '41.1'
    text: |-
      Aan boord van een passagiersschip moeten waterdichte deuren zowel wat soort en plaats betreft waar zij mogen zijn
      aangebracht, als de plaats en de wijze waarop zij beweegbaar moeten kunnen zijn, voldoen aan de eisen gesteld in
      [bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '41.2'
    text: |-
      Aan boord van een schip, geen passagiersschip zijnde, moeten waterdichte deuren, met uitzondering van draaideuren,
      door middel van een handwiel of van een ronddraaiende kruk of een andere goedgekeurde inrichting die dezelfde
      veiligheid biedt, buiten de voortstuwingsruimte en op een toegankelijke plaats beweegbaar zijn van een dek dat
      boven de bovenste lastlijn is gelegen. Tunneldeuren moeten bovendien ter plaatse van de deur, aan beide zijden
      van het schot, door middel van een handwiel of van een ronddraaiende kruk of een andere goedgekeurde inrichting
      die dezelfde veiligheid biedt, kunnen worden bewogen. Schuifdeuren moeten zijn voorzien van standaanwijzers die
      op alle plaatsen waar de deur beweegbaar doch niet zichtbaar is, aangeven of de deur is geopend dan wel gesloten.
      Deze deuren, andere dan tunneldeuren, mogen slechts met toestemming van het Hoofd van de Scheepvaartinspectie
      zijn aangebracht. Waterdichte draaideuren mogen, onder door het Hoofd van de Scheepvaartinspectie te stellen
      voorwaarden, slechts worden aangebracht op het hoogste niveau dat mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: '41.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid moeten aan boord van een klein vaartuig, geen passagiersschip
      zijnde, waterdichte deuren in waterdichte schotten, als schuifdeuren zijn uitgevoerd. Deze deuren moeten hetzij met
      de hand, hetzij werktuiglijk en tevens met de hand beweegbaar zijn. De deuren moeten buiten de voortstuwingsruimte
      en op een toegankelijke plaats beweegbaar zijn van een dek dat boven de bovenste lastlijn is gelegen. De deuren
      moeten zijn voorzien van standaanwijzers die op alle plaatsen waar de deur beweegbaar doch niet zichtbaar is,
      aangeven of de deur is geopend dan wel gesloten. In een voorpiekschot zijn onder het vrijboorddek geen waterdichte
      deuren, mangaten of andere toegangsopeningen toegestaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: '41.4'
    text: |-
      In afwijking van het gestelde in het derde lid mag, in die gevallen dat een bovendekse toegang, gezien de aard en
      inrichting van het kleine vaartuig, niet praktisch te verwezenlijken is, in het achterpiekschot een waterdichte
      draaideur worden aangebracht, teneinde een toegang tot de stuurmachineruimte te verkrijgen. Een dergelijke deur
      moet:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: 41.4.a
    text: tijdens normaal bedrijf zijn gesloten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: 41.4.b
    text: zo hoog mogelijk in het schot zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: 41.4.c
    text: zijn voorzien van een centrale knevelsluiting;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: 41.4.d
    text: naar achteren te openen zijn; en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: 41.4.e
    text: 'zijn voorzien van het opschrift: Onmiddellijk na gebruik sluiten.'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel41
  - number: '42.1'
    text: |-
      Patrijspoorten en lichtranden moeten voldoen aan de eisen gesteld in [bijlage I][ref1] en – voorzover van
      toepassing – in de [bijlagen II][ref2], [IV][ref3] en [V van dit besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501
      [ref4]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
      - id: ref4
        bwb_id: BWBR0002501
  - number: '42.2'
    text: |-
      Alle patrijspoorten, ramen en lichtranden moeten overigens voldoen aan de door het Hoofd van de
      Scheepvaartinspectie gestelde eisen betreffende type en sterkte.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel42
  - number: '43.1'
    text: Op dubbele bodem- of andere tanks moeten luchtpijpen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: 43.2.a
    text: |-
      Luchtpijpen moeten in laadruimten en aan dek zodanig beschermd of zo sterk zijn, dat zij door verschuiven van
      lading niet kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: 43.2.b
    text: |-
      Luchtpijpen van tanks die, hetzij door het openen van een of meer kranen of afsluiters van buitenboord kunnen
      vollopen, hetzij door middel van een werktuiglijk gedreven pomp kunnen worden gevuld, alsmede alle luchtpijpen
      van dubbele bodemtanks en kofferdammen en van voorraad-, bezink- en dagtanks voor brandstofolie, moeten boven
      het vrijboorddek, op een passagiersschip tevens boven het schottendek, in de openlucht uitmonden en aldaar steeds
      toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: 43.2.c
    text: |-
      De luchtpijpen van brandstoftanks moeten bovendien op een naar het oordeel van het Hoofd van de
      Scheepvaartinspectie veilige plaats uitkomen en zijn voorzien van een doelmatige vlamkerende inrichting.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: 43.2.d
    text: |-
      Het is toegestaan de luchtpijpen van die tanks waarvan de inhoud bij uitvloeien op het open dek gevaar kan
      opleveren of om andere redenen ongewenst is, naar een overvloeitank of een andere hiervoor geschikte voorraadtank
      te leiden. In dat geval dient de ontluchting van de overvloeitank boven het vrijboorddek, op een passagiersschip
      tevens boven het schottendek, in de openlucht uit te monden en aldaar steeds toegankelijk te zijn. De ontluchting
      van de overvloeitank dient zodanig te zijn bemeten, dat deze de maximum te verwachten toevoer zonder overmatige
      drukverhoging kan verwerken. De overvloeitank dient voldoende ruim bemeten te zijn. Een alarminrichting moet worden
      aangebracht welke alarmeert bij een vooraf bepaald niveau in tanks of wanneer de tanks overvloeien.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: '43.3'
    text: |-
      De hoogte van de opening van luchtpijpen boven blootgestelde delen van het vrijboorddek of van het
      dek van een bovenbouw, zomede de afsluiting van die opening, moeten voldoen aan het bepaalde in
      [artikel 20 van bijlage I van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '43.4'
    text: Vulpijpen op drinkwatertanks moeten ten minste 15 cm boven het dek reiken.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43
  - number: 43a.1
    text: Tanks en andere ruimten die niet te allen tijde toegankelijk zijn, zijn uitgerust met een voorziening voor peilen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.2
    text: 'Als voorziening voor peilen worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.2.a
    text: |-
      peilinrichtingen ingericht voor aflezing op afstand, waarbij de aflezing van de diverse te peilen ruimten op een
      centrale plaats geschiedt,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.2.b
    text: peilinrichtingen in de vorm van peilglazen,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.2.c
    text: |-
      peilinrichtingen, geen peilglazen zijnde, ingericht voor aflezing aan of in de directe nabijheid van de te peilen
      ruimten, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.2.d
    text: peilinrichtingen in de vorm van peilpijpen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.3
    text: |-
      Indien een peilinrichting als bedoeld in het tweede lid, onder a of c, wordt toegepast, is deze van een
      goedgekeurd type. Bij ministeriële regeling kunnen nadere regels worden gesteld voor de constructie en aanleg van
      peilinrichtingen als bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.4
    text: |-
      Indien een peilinrichting als bedoeld in het tweede lid, onder a, wordt toegepast, is de desbetreffende tank of
      ruimte tevens uitgerust met een voorziening voor de controle van het juiste vloeistofniveau.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.5
    text: |-
      Het vierde lid is niet van toepassing op kleinere tanks, met inbegrip van sludge-, buffer- en lekolietanks,
      smeerolieaflooptanks, koelwater- en ketelwatertanks alsmede vullingen van laadruimten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.6
    text: |-
      De voorziening voor peilen op de vullingen van laadruimten bestaat uit een peilinrichting als bedoeld in het tweede
      lid, onder a, c of d.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.7
    text: |-
      Indien een tankschip is uitgerust met een inertgassysteem, is de peilinrichting voor de ladingtanks van het
      gesloten type.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.8
    text: |-
      De voorzieningen voor peilen van ladingtanks aan boord van gas- en chemicaliëntankschepen voldoen aan bij
      ministeriële regeling gestelde nadere regels.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.9
    text: |-
      Waar peilpijpen worden toegepast, komen deze zo veel mogelijk op een veilige en toegankelijke plaats uit boven
      het vrijboorddek, op een passagiersschip tevens boven het schottendek. Waar redelijkerwijs niet aan deze eis kan
      worden voldaan, kan het Hoofd van de Scheepvaartinspectie toestaan dat kortere peilpijpen worden toegepast. Korte
      peilpijpen die onder het vrijboorddek of op een passagiersschip onder het schottendek uitkomen, zijn voorzien van
      een zelfsluitende kraan. Indien de tanks brandbare vloeistoffen bevatten, wordt tevens voldaan aan het bepaalde in
      [artikel 15, leden 2.6, 3 en 4, van bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 43a.10
    text: Onder peilpijpen zijn stootplaatjes aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.11
    text: |-
      Indien peilpijpen door laadruimten worden gevoerd, zijn zij aldaar en aan dek zodanig beschermd of zodanig sterk
      dat zij door het verschuiven van lading niet kunnen worden beschadigd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: 43a.12
    text: Indien op drinkwatertanks peilpijpen zijn aangebracht, reiken deze ten minste 15 cm boven het dek.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel43a
  - number: '44.1'
    text: |-
      Openingen in het scheepsboord, als toegangs-, laad- en kolenpoorten moeten door deugdelijke afsluitingsmiddelen van
      voldoende sterkte waterdicht kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel44
  - number: '44.2'
    text: |-
      Openingen in de eindschotten van een gesloten bovenbouw en openingen in de aan weer en wind blootgestelde gedeelten
      van de dekken moeten op doeltreffende wijze door deugdelijke afsluitingsmiddelen tegen weer en wind kunnen worden
      afgesloten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel44
  - number: '44.3'
    text: |-
      Paalmasten en laadpalen, die als luchtkokers zijn ingericht alsmede niet afneembare luchtkokers moeten zijn
      voorzien van goed sluitende dempers die aan dek kunnen worden bewogen. Indien afneembare luchtkokers een
      zodanige diameter, lengte of gewicht hebben dat het afnemen hiervan bezwaarlijk is, kan het Hoofd van de
      Scheepvaartinspectie voorschrijven dat ook deze van goed sluitende dempers moeten zijn voorzien. Standaanwijzers
      die aangeven of de demper de doorgang openlaat dan wel afsluit, moeten aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel44
  - number: '44.4'
    text: |-
      De in de vorige leden van dit artikel genoemde openingen en luchtkokers moeten bovendien voldoen aan de eisen
      gesteld in [bijlage I van dit besluit][ref1]. Aan boord van een passagiersschip moeten de in het eerste en tweede
      lid van dit artikel genoemde openingen tevens voldoen aan de eisen gesteld in [bijlage II van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
  - number: 45.1.a
    text: |-
      De toegangen naar de verblijven van de opvarenden moeten te allen tijde buiten ruimten voor machines – als bedoeld
      in [artikel 3, onder 20, van bijlage IV van dit besluit][ref1] – om, behoorlijk bereikbaar zijn. Daarbij dient
      rekening te worden gehouden met de eisen gesteld in de [bijlagen I][ref2] en [IV][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
  - number: 45.1.b
    text: |-
      Het gestelde onder a. van dit lid geldt eveneens ten aanzien van de plaatsen waar de schepelingen hun werk plegen
      te verrichten, tenzij deze plaatsen geheel in de ruimten voor machines zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
  - number: '45.2'
    text: Ruimten voor machines mogen niet in rechtstreekse verbinding staan met de verblijven voor passagiers en bemanning.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
  - number: '45.3'
    text: |-
      In en vanuit alle voor passagiers en bemanning bestemde ruimten en ruimten waarin door de bemanning
      onder normale omstandigheden dienst wordt gedaan, alsmede in ruimten van bijzondere aard als bedoeld
      in [artikel 3, onder 18, van bijlage IV van dit besluit][ref1], in ro/ro laadruimten als bedoeld in
      [artikel 3, onder 14, van bijlage IV van dit besluit][ref2], en in iedere ruimte voor machines moeten de nodige
      voorzieningen voor ontsnapping zijn aangebracht om het inschepingsdek voor de reddingboten en reddingvlotten
      snel te kunnen bereiken. Daarbij dient, voorzover van toepassing, te zijn voldaan aan het bepaalde in de
      [artikelen 28 en 45 van bijlage IV][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
  - number: 45.4.a
    text: |-
      Aan boord van een passagiersschip moet de breedte van trappen, deuropeningen en gangen voldoen aan het bepaalde in
      [artikel 28a van bijlage IV van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 45.4.b
    text: |-
      Aan boord van een schip geen passagiersschip zijnde, moet de breedte van trappen, deuropeningen en gangen voldoen
      aan het bepaalde in [artikel 45a van bijlage IV van dit besluit][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '45.5'
    text: |-
      De constructieve brandbescherming van liftschachten dient, voorzover van toepassing, te voldoen aan het bepaalde in
      [artikel 29, derde lid, en artikel 46, eerste lid, van bijlage IV van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 45.6.a
    text: |-
      Personenliften en roltrappen die aan boord zijn opgesteld moeten zijn voorzien van een certificaat. Zulk een
      certificaat wordt afgegeven, nadat bij een eerste of een hernieuwd onderzoek is gebleken dat aan de desbetreffende
      eisen, geldend bij of krachtens dit besluit, is voldaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
  - number: 45.6.b
    text: |-
      Onderzoeken aan liften en roltrappen worden verricht door een keuringsinstantie, aangewezen krachtens
      [artikel 5, eerste lid, van de Wet op de gevaarlijke werktuigen][ref1] of door een klassebureau.


      [ref1]: https://wetten.overheid.nl/BWBR0002087#Artikel5
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002087
        artikel: '5'
  - number: 45.6.c
    text: |-
      Degene die het certificaat afgeeft, stelt daarbij vast voor welk tijdvak dit zal gelden, met dien verstande dat dit
      tijdvak niet langer mag zijn dan vijf jaar. Degene die het jaarlijks of het tussentijds onderzoek heeft verricht,
      plaats bij een gunstige uitslag van dit onderzoek een aantekening op het certificaat dat het onderzoek heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
  - number: 45.6.d
    text: Personenliften en roltrappen die niet voldoen aan het gestelde onder a, worden buiten gebruik gesteld.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel45
  - number: '46'
    text: 'Ter bescherming van de bemanning moeten:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel46
  - number: 46.a
    text: |-
      op alle aan weer en wind blootgestelde dekken, alsmede voor het gaan naar of het komen van hun verblijven,
      voortstuwingsruimten en alle andere gedeelten die nodig zijn voor de behandeling van het schip, voorzieningen zijn
      aangebracht in overeenstemming met het bepaalde in [artikel 25 van bijlage I van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 46.b
    text: |-
      waar nodig in verblijven, voortstuwingsruimten en alle andere gedeelten die nodig zijn voor de behandeling van het
      schip, deugdelijk relingwerk, handleiders of andere afdoende middelen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel46
  - number: '47'
    text: |-
      Alle aan weer en wind blootgestelde dekken moeten zijn voorzien van voldoende inrichtingen om zo spoedig
      mogelijk van overkomend water te worden bevrijd. Deze inrichtingen moeten voldoen aan het bepaalde in
      [artikel 24 van bijlage I van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '48.1'
    text: |-
      Buitenboordsin- en -uitlaatopeningen van pijpleidingen, behorende tot de werktuiglijke inrichting, moeten voldoen
      aan het bepaalde in [het tweede en vijfde lid van artikel 22 van bijlage I van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '48.2'
    text: |-
      Buitenboordsuitlaten, andere dan die bedoeld in het eerste lid van dit artikel, moeten voldoen aan het bepaalde
      in [het eerste, derde en vijfde lid van artikel 22 van bijlage I van dit besluit][ref1] en, voorzover het een
      passagiersschip betreft, bovendien aan het bepaalde in artikel 17, achtste en negende lid, van bijlage II van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '49.1'
    text: |-
      Aan boord van elk schip moeten de inrichting en indeling van de brug, alsmede de plaatsing van de daarin opgestelde
      apparatuur, zodanig zijn dat een doelmatige en veilige navigatie mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel49
  - number: '49.2'
    text: 'De plaats van de brug dient zodanig te zijn gekozen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel49
  - number: 49.2.a
    text: de roerganger vanaf de plaats waar het schip wordt bestuurd een vrij uitzicht over het voorschip heen heeft;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel49
  - number: 49.2.b
    text: het uitzicht rondom voldoende is om veilig te kunnen manoeuvreren en navigeren;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel49
  - number: 49.2.c
    text: |-
      de scheepszijden vanaf de brug waarneembaar zijn, tenzij de bedrijfsvoering zich hiertegen verzet. In dat geval kan
      het Hoofd van de Scheepvaartinspectie toestaan dat de brug niet over de gehele breedte van het schip doorloopt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel49
  - number: '50'
    text: |-
      De stuurinrichtingen en het roer moeten voldoen aan het bepaalde in
      [artikel 29 van bijlage II van dit besluit][ref1] en, voorzover van toepassing, aan het bepaalde in
      [artikel 30 van die bijlage][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
  - number: '51.1'
    text: |-
      De ankers moeten in voldoend aantal aanwezig en van voldoende gewicht en sterkte zijn. De ankerkettingen of
      ankertouwen moeten van voldoende lengte, gewicht en sterkte zijn, terwijl elk van de ankerkettingen uit de nodige,
      onderling verbonden, losneembare einden moet bestaan. Er moet een reserve anker- en kettingsluiting aan boord
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '51.2'
    text: |-
      Uit een certificaat, afgegeven na een onderzoek, dient te blijken dat de ankers en kettingen voldoen aan de regels
      die ter zake zijn opgesteld door een klassebureau.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '51.3'
    text: |-
      De ankerkettingen moeten zodanig aan het schip zijn bevestigd, dat zij buiten de kettingbak kunnen worden
      ontsloten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '51.4'
    text: |-
      De voor een schip bestemde ankerkettingen mogen niet worden gebruikt voor het remmen tijdens het te water lopen van
      het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '51.5'
    text: |-
      De ankerinrichting moet, wat bouw, plaatsing en vermogen betreft, zodanig zijn, dat de ankers gemakkelijk en snel
      kunnen worden bediend, terwijl een bijzondere borginrichting van de ankers aanwezig moet zijn, die het uitlopen ten
      gevolge van schok of stoot voorkomt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '51.6'
    text: |-
      Al het aan boord aanwezige meergerei moet van voldoende sterkte zijn en moet geschikt zijn voor het beoogde
      gebruik.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel51
  - number: '52'
    text: |-
      Bij de constructie, de indeling en de inrichting van elk schip moeten voor de bescherming tegen brand de
      nodige voorzorgen zijn getroffen. Daartoe moet worden voldaan, voorzover van toepassing, aan het bepaalde in
      [bijlage IV van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '57'
    text: |-
      Met betrekking tot het gebruik van vloeibare brandstof voor voortstuwingswerktuigen en
      andere werktuigen dient te worden voldaan aan het bepaalde in, voorzover van toepassing,
      [artikel 15, eerste lid, van bijlage IV van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '59.1'
    text: |-
      Elk gedeelte van het schip, voorzover het Hoofd van de Scheepvaartinspectie het hiervoor vatbaar acht, en
      elke waterdichte afdeling die niet permanent is bestemd voor de berging van olie of water, moet onder alle
      omstandigheden die in de praktijk van een ramp kunnen voorkomen, hetzij het schip recht ligt dan wel slagzij
      heeft, door een lensinrichting kunnen worden lensgepompt. Aan boord van een werktuiglijk voortbewogen schip
      moet deze lensinrichting voldoen aan het bepaalde in [bijlage III van dit besluit][ref1]. Aan boord van schepen,
      geen werktuiglijk voortbewogen schepen zijnde, moet de lensinrichting voldoen aan het door het Hoofd van de
      Scheepvaartinspectie te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '59.2'
    text: |-
      Indien in een gedeelte van een schip door de aard van het bedrijf of om andere redenen ongewenste hoeveelheden
      water kunnen voorkomen, kan het Hoofd van de Scheepvaartinspectie bijzondere voorzieningen voorschrijven voor het
      lenzen van dit gedeelte.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel59
  - number: '62'
    text: |-
      De elektrische installatie moet voldoen aan de eisen gesteld in [bijlage II][ref1] en [bijlage IV][ref2] van dit
      besluit, voorzover van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
  - number: 63a
    text: |-
      Aan boord van een schip moeten maatregelen worden getroffen om geluidhinder te beperken. In ruimten voor machines
      moet daartoe worden voldaan aan het bepaalde in [artikel 36 van bijlage II van dit besluit][ref1] . In overige
      ruimten moet daartoe worden voldaan aan de door het Hoofd van de Scheepvaartinspectie gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '64.1'
    text: |-
      De verblijven van de schepelingen moeten voldoen aan de eisen gesteld in het [Schepelingenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '64.2'
    text: De verblijven van de kapitein moeten ten minste voldoen aan de eisen als bedoeld in het eerste lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel64
  - number: 64a
    text: |-
      De berging van de voeding en het drinkwater moet voldoen aan de eisen gesteld in het [Schepelingenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '65'
    text: |-
      De samenstellende delen van de scheepsromp en van de werktuigen en inrichtingen, die van belang kunnen zijn voor de
      veiligheid van schip en opvarenden, mogen niet te veel zijn ingeteerd of versleten. Assen mogen niet op gevaarlijke
      wijze zijn verzakt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel65
  - number: '66.1'
    text: |-
      Het Hoofd van de Scheepvaartinspectie stelt voor alle schepen, met uitzondering van dokken en andere
      soortgelijke drijvende voorwerpen, het vrijboord vast voor reizen in de gebieden als omschreven in
      [hoofdstuk V van bijlage I van dit besluit][ref1], zomede de vermindering voor zoetwater voor elk vrijboord.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '66.2'
    text: |-
      Het vrijboord en de vermindering voor zoetwater als bedoeld in het eerste lid van dit artikel worden vastgesteld in
      overeenstemming met de in [bijlage I van dit besluit][ref1] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '66.3'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan een vrijboord toekennen dat groter is dan dat vastgesteld in
      overeenstemming met het bepaalde in het tweede lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
  - number: '66.4'
    text: |-
      Het berekenen van het vrijboord en het aanbrengen van de uitwateringsmerken en deklijnen kan, mits onder toezicht
      vanwege het Hoofd van de Scheepvaartinspectie, door een klassebureau geschieden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
  - number: '66.5'
    text: |-
      De uitwateringsmerken en de deklijn moeten aan elke zijde van het schip zijn aangebracht op de wijze als in
      [bijlage I van dit besluit][ref1] is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '66.6'
    text: |-
      Op voor- en achterschip moeten diepgangsmerken zijn aangebracht, die het mogelijk maken zowel aan stuurboords- als
      aan bakboordszijde de diepgang vóór en achter af te lezen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
  - number: '66.7'
    text: |-
      Aan boord van een schip waarvoor een vrijboord is vastgesteld, moet een afschrift van het vrijboordrapport aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
  - number: '66.8'
    text: |-
      Aan boord van schepen, met uitzondering van sleepboten, baggermaterieel, dokken en andere soortgelijke drijvende
      voorwerpen, moet een schaal van waterverplaatsing aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel66
  - number: '67.1'
    text: |-
      Indien een schip aan de in [bijlage I van dit besluit ][ref1]gestelde bijzondere eisen voor dieper afladen voldoet,
      kan het Hoofd van de Scheepvaartinspectie overeenkomstig de mede in die bijlage aangegeven regelen een vermindering
      van vrijboord toestaan bij vervoer van deklasten hout. In dat geval moeten de lijnen van de houtvaartuitwatering
      (houtvaartmerken) aan elke zijde van het schip zijn aangebracht als in die bijlage is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '67.2'
    text: |-
      Het laden tot het van toepassing zijnde uitwateringsmerk voor de houtvaart, als bedoeld in het voorgaande lid, is
      echter slechts toegestaan indien de kuilen op het vrijboorddek met hout zijn gevuld tot een hoogte, die ten minste
      gelijk is aan de standaardhoogte van de bovenbouw, geen verhoogd halfdek zijnde, vastgesteld in overeenstemming met
      het bepaalde in [artikel 33 van bijlage I van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 67a.1
    text: |-
      Tezamen met de resultaten van de hellingproef als bedoeld in [artikel 12 van dit besluit][ref1], dienen voldoende
      gegevens betreffende de stabiliteit voor verschillende hellingen van het schip te worden overgelegd aan het Hoofd
      van de Scheepvaartinspectie. De stabiliteit van het schip dient daarbij in alle voorkomende bedrijfstoestanden ten
      minste te voldoen aan door het Hoofd van de Scheepvaartinspectie vast te stellen criteria.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel12
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '12'
        hoofdstuk: III
  - number: 67a.2
    text: |-
      Aan de kapitein moeten voldoende nauwkeurige en betrouwbare gegevens betreffende de stabiliteit bij hellingen van
      het schip ter beschikking worden gesteld, opdat op een snelle en eenvoudige wijze de stabiliteit van het schip in
      verschillende bedrijfstoestanden kan worden beoordeeld. Indien het schip wijzigingen heeft ondergaan die van enige
      invloed zijn op de aan de kapitein afgegeven stabiliteitsgegevens, moeten hem gewijzigde gegevens ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67a
  - number: 67a.3
    text: |-
      Aan de kapitein van een chemicaliëntanker of een gastanker moeten goedgekeurde gegevens ter beschikking
      worden gesteld die nodig zijn om in alle voorkomende bedrijfsomstandigheden voor een voldoende stabiliteit
      in onbeschadigde toestand te kunnen zorg dragen, opdat het schip elke beschadiging als door het Hoofd van de
      Scheepvaartinspectie aan te geven, kan doorstaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67a
  - number: 67b
    text: |-
      Aan boord van elk schip moeten de reddingmiddelen en -voorzieningen aanwezig zijn als voorgeschreven in
      [bijlage XIA van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel67b
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '87.1'
    text: |-
      Aan boord van een schip dat reizen maakt waarbij het waarschijnlijk is dat van een loods gebruik zal worden
      gemaakt, zijn deugdelijke voorzieningen aanwezig die de loods in staat stellen veilig aan en van boord te gaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.2'
    text: Deze voorzieningen zijn schoon, worden in goede staat gehouden en worden regelmatig nagezien.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.3'
    text: |-
      Het gereedmaken van de voorzieningen voor het overnemen van de loods en het aan en van boord gaan van een loods
      geschiedt onder toezicht van een verantwoordelijke officier van het schip die beschikt over middelen om met de
      brug te communiceren en die de loods via een veilige weg naar en vanaf de brug begeleidt. Scheepsgezellen, belast
      met het gereedmaken en bedienen van mechanische voorzieningen, worden onderricht in het werken hiermee. Deze
      voorzieningen worden voor gebruik getest.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.4'
    text: De voorzieningen zijn geschikt voor gebruik aan beide zijden van het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.5'
    text: |-
      Op alle schepen waar de verticale afstand tussen het wateroppervlak en het punt van aan en van boord gaan meer dan
      9 meter bedraagt en het de bedoeling is de loods aan boord te nemen of te ontschepen met gebruik van de valreep of
      een mechanische loodsladder, of op een andere even veilige en gemakkelijke wijze in combinatie met een loodsladder,
      zijn deze voorzieningen aan beide zijden aangebracht, tenzij zij zodanig verplaatsbaar zijn dat ze aan beide zijden
      kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.6'
    text: 'Teneinde veilig en gemakkelijk aan en van boord te gaan is het schip voorzien van:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.a
    text: |-
      een loodsladder, die vanaf het wateroppervlak een klim vergt van ten minste 1,5 meter en ten hoogste 9 meter, en
      die zodanig veilig is opgehangen dat hij:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.a.1°
    text: vrij hangt van alle mogelijke spuipijpen van het schip;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.a.2°
    text: |-
      evenwijdig aan het vlak van kiel en stevens en, voorzover uitvoerbaar, binnen een kwart scheepslengte vanuit
      midscheeps hangt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.a.3°
    text: |-
      met alle treden stevig tegen de scheepshuid rust, met dien verstande dat waar speciale constructies zoals
      berghouten, verhinderen dat de treden van de loodsladder stevig tegen de scheepshuid rusten, maatregelen getroffen
      zijn om het aan of van boord gaan veilig te kunnen doen geschieden;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.a.4°
    text: |-
      uit een enkele lengte bestaat en lang genoeg is om vanaf de inschepingsplaats aan boord het water te bereiken,
      rekening houdend met alle beladingstoestanden van het schip, met kop- en stuurlast en met slagzij naar de andere
      zijde van 15 graden, met dien verstande dat de bevestigingspunten, sluitingen en sjordraden ten minste even sterk
      zijn als de zijleiders; of
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.b
    text: |-
      een valreep in combinatie met een loodsladder, of iedere andere gelijkwaardige en veilige oplossing, indien de
      afstand van het wateroppervlak tot de inschepingsplaats groter is dan 9 meter, met dien verstande dat de valreep
      naar het achterschip wijst, en als de valreep gebruikt wordt het onderste deel stevig tegen dat deel van de
      scheepshuid rust dat evenwijdig loopt met het vlak van kiel en stevens, en dat, voorzover uitvoerbaar, binnen een
      kwart scheepslengte vanuit midscheeps ligt en vrij is van mogelijke spuipijpen; of
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.6.c
    text: |-
      een mechanische loodsladder, zodanig opgesteld dat hij evenwijdig aan het vlak van kiel en stevens en, voorzover
      uitvoerbaar, binnen een kwart scheepslengte vanuit midscheeps, vrij is van mogelijke spuipijpen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.7'
    text: |-
      Er zijn voorzieningen aanwezig ten einde een ieder in staat te stellen op veilige, gemakkelijke en onbelemmerde
      wijze vanaf het boveneinde van de loodsladder, de valreep of elk ander middel aan dek te stappen of omgekeerd.
      Als het overstappen geschiedt door een opening in het hekwerk of de verschansing zijn handgrepen aangebracht. Als
      het overstappen geschiedt door middel van een verschansingstrap is deze stevig bevestigd aan het schip teneinde
      omvallen te voorkomen. Er zijn twee rechtopstaande houvasten aangebracht die nabij de onderzijde alsmede op een
      hoger gelegen punt stevig aan het schip bevestigd zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.8'
    text: |-
      Zijdeuren in het schip die gebruikt worden voor het aan boord nemen of ontschepen van een loods, openen, voorzover
      redelijkerwijs uitvoerbaar, niet naar buiten toe.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.9'
    text: |-
      De mechanische loodsladder en bijbehorende uitrusting zijn van een goedgekeurd type en voldoen aan de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.a
    text: |-
      de installatie is ontworpen om dienst te doen als een beweegbare ladder om iemand via de zijde van het schip aan
      of van boord te brengen of als een platform om een of meerdere personen via de zijde van het schip aan of van boord
      te brengen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.b
    text: |-
      de installatie is zodanig ontworpen en gebouwd dat de loods veilig aan of van boord kan gaan, waaronder mede wordt
      begrepen een veilige toegang van de ladder naar het dek en omgekeerd, met dien verstande dat dit kan worden bereikt
      door middel van een platform voorzien van een hekwerk;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.c
    text: |-
      een doelmatige handbediening is aanwezig en voor gebruik gereed, teneinde de persoon of personen die vervoerd
      worden te kunnen laten zakken of ophalen in geval van een stroomstoring;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.d
    text: |-
      de hijsinrichting is stevig aan het schip bevestigd met dien verstande dat de hijsinrichting niet uitsluitend aan
      de verschansing van het schip bevestigd is en indien de hijsinrichting verplaatsbaar is, het schip aan elke zijde
      voorzien is van goede en sterke bevestigingspunten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.e
    text: |-
      indien een berghout of stootrand is aangebracht op de plaats van de hijsinrichting, dan is die zodanig onderbroken,
      dat de loodsladder tegen de scheepshuid komt te rusten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.f
    text: |-
      naast de hijsinrichting is een loodsladder zodanig voor onmiddellijk gebruik gereedgemaakt, dat op elk punt
      hierop kan worden overgestapt en de loodsladder lang genoeg is om vanaf de inschepingsplaats aan boord het water
      te bereiken;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.g
    text: de plaats op de scheepshuid waar de hijsinrichting wordt neergelaten is aangegeven;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.h
    text: een verplaatsbare hijsinrichting is op een beschermde plaats opgeborgen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.9.i
    text: |-
      teneinde het gevaar van ijsafzetting te vermijden wordt bij koud weer de verplaatsbare hijsinrichting vlak voor
      gebruik gereedgemaakt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.10'
    text: 'De volgende bijbehorende uitrusting is voor onmiddellijk gebruik gereed tijdens het overnemen van personen:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.10.a
    text: twee handleiders, stevig aan het schip bevestigd, met een diameter van ten minste 0,028 meter;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.10.b
    text: een reddingboei voorzien van een zelfontbrandend licht;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: 87.10.c
    text: een hieuwlijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.11'
    text: |-
      Er is een doelmatige voorziening aanwezig om de overneemuitrusting buitenboord, de plaats aan dek waar iemand aan
      boord wordt genomen of ontscheept en de bediening van de mechanische loodsladder te verlichten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '87.12'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de constructie van loodsladders.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel87
  - number: '88'
    text: |-
      Aan boord van elk schip moeten middelen voor het opsporen en bestrijden van brand aanwezig zijn volgens de in
      [bijlage IV van dit besluit][ref1] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '89'
    text: |-
      Aan boord van een schip moet ten minste één elektrische veiligheidslamp van een goedgekeurd type
      aanwezig zijn om te gebruiken in ruimten waar dampen die tot een ontploffing aanleiding kunnen
      geven, kunnen worden verwacht. Een elektrische veiligheidslamp moet voldoen aan het bepaalde in
      [artikel 45, lid 10.2, van bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 89a
    text: |-
      Aan boord van een schip moeten de nodige middelen aanwezig zijn ter persoonlijke bescherming van de schepelingen
      tegen letsel dat uit door hen te verrichten werkzaamheden zou kunnen voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel89a
  - number: 92a
    text: |-
      Uit een certificaat, afgegeven na een onderzoek, dient te blijken dat de hefwerktuigen die niet reeds krachtens
      de [Arbeidsomstandighedenwet 1998][ref1] aan toezicht zijn onderworpen en die worden gebruikt voor bergings- en
      constructiewerkzaamheden, voldoen aan de regels die ter zake zijn opgesteld door een klassebureau.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel92a
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '93.1'
    text: |-
      Aan boord van een schip is de bij ministeriële regeling voorgeschreven medische uitrusting, bestaande uit
      geneesmiddelen, verplegingsartikelen en antidota, met de daarbij behorende controlelijsten en handleidingen,
      aanwezig volgens de voorschriften, vervat in [Bijlage XVI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '93.2'
    text: |-
      De kapitein is verplicht zorg te dragen dat de medische uitrusting in goede staat verkeert, wordt
      aangevuld en zonodig wordt vernieuwd, zodra dit mogelijk is, in ieder geval bij voorrang tijdens de normale
      bevoorradingsprocedures. Hij kan het gebruik en het beheer van de medische uitrusting aan boord, onverminderd
      zijn eigen verantwoordelijkheid, overdragen aan een of meer schepelingen die voldoen aan de eisen, bedoeld in
      [artikel 117a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel117a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 117a
        hoofdstuk: VII
  - number: 93a
    text: |-
      Aan boord van een schip, geen klein vaartuig zijnde, dat is voorzien van een automatische stuurinrichting, moet op
      de brug een wachtalarminstallatie van een goedgekeurd type zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel93a
  - number: '94.1'
    text: |-
      Aan boord van elk schip moeten de voor de te ondernemen reis benodigde zeekaarten aanwezig zijn. Deze zeekaarten
      moeten van een voldoend grote schaal zijn om er behoorlijk op te kunnen navigeren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: '94.2'
    text: 'Aan boord van elk schip moeten voorts aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.a
    text: de voor de te ondernemen reis benodigde zeemansgidsen en lichtenlijsten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.b
    text: de voor de te ondernemen reis benodigde stroomatlassen of -kaarten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.c
    text: de nodige getijtafels en een zeemansalmanak van het lopende jaar;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.d
    text: |-
      hulpmiddelen voor zeevaartkundige berekeningen, indien het schip is uitgerust met een chronometer, voorgeschreven
      in [artikel 97, tweede lid, van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel97
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '97'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 94.2.e
    text: een parallelliniaal of een stel van twee navigatiedriehoeken;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.f
    text: twee passers;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 94.2.g
    text: een betrouwbaar uurwerk.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: '94.3'
    text: |-
      Zeekaarten en boekwerken moeten in goede staat verkeren en worden bijgehouden aan de hand van berichten aan
      zeevarenden. Zeekaarten en boekwerken, die door gebruik of anderszins onvoldoende leesbaar zijn geworden, dan wel
      vanwege de uitgevende instanties zijn vervallen verklaard, worden geacht niet in goede staat te verkeren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel94
  - number: 95.1.a
    text: |-
      Aan boord van een schip van minder dan 1600 ton, dat is gebouwd vóór 1 september 1984, en aan boord van een
      schip van minder dan 500 ton, dat is gebouwd op of na 1 september 1984, moeten ten minste twee vast opgestelde
      magnetische kompassen aanwezig zijn. Op één van deze kompassen, het standaardkompas, moet gepeild en op het andere,
      het stuurkompas, moet gestuurd kunnen worden. Van deze magnetische kompassen mag het stuurkompas worden vervangen
      door een gyrokompas, met dien verstande dat in een dergelijk geval op het standaardkompas tevens moet kunnen worden
      gestuurd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.1.b
    text: |-
      In afwijking van het bepaalde onder a kan aan boord van een schip dat een door het Hoofd van de
      Scheepvaartinspectie vast te stellen gebied bevaart, worden volstaan met één vast opgesteld magnetisch
      standaardkompas, waarop zowel moet kunnen worden gepeild als gestuurd. Aan boord van een schip met een lengte
      over alles van minder dan 60 meter, behoeft op dit kompas niet te kunnen worden gepeild, indien een naar het
      oordeel van het Hoofd van de Scheepvaartinspectie gelijkwaardig elektronisch middel tot plaatsbepaling alsmede een
      radarinstallatie van goedgekeurd type aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.1.c
    text: |-
      Aan boord van een schip van 1600 ton of meer, dat is gebouwd vóór 1 september 1984, en aan boord van een schip
      van 500 ton of meer, dat is gebouwd op of na 1 september 1984, moet ten minste één vast opgesteld magnetisch
      standaardkompas aanwezig zijn waarop zowel moet kunnen worden gepeild als gestuurd. Tevens moet een gyrokompas
      aanwezig zijn, dat voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.1.c.(i)
    text: |-
      het gyro-moederkompas of een gyro-dochterkompas moet duidelijk afleesbaar zijn voor de roerganger vanaf de plaats
      waar gewoonlijk wordt gestuurd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.1.c.(ii)
    text: |-
      aan boord van een schip van 500 ton of meer moeten op de brug één of meerdere gyro-dochterkompassen aanwezig zijn,
      die zodanig moeten zijn opgesteld dat peilingen kunnen worden genomen over een boog van de horizon van, voorzover
      praktisch uitvoerbaar, 360 graden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.1.d
    text: |-
      Op een schip met een noodstuurpositie moet een telefoon of ander communicatiemiddel, waarmee informatie over de
      voorliggende koers van het schip naar die positie kan worden doorgegeven, aanwezig zijn. In aanvulling daarop
      moeten aan bood van zulk een schip van 500 ton of meer en gebouwd op of na 1 februari 1992 bij de noodstuurpositie
      voorzieningen zijn getroffen waarmee het kompas waarop wordt gestuurd kan worden afgelezen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.2.a
    text: |-
      De in het eerste lid voorgeschreven magnetische kompassen moeten geschikt zijn voor het doel waarvoor zij zijn
      bestemd en dienen in het vlak van kiel en stevens te zijn opgesteld. De opstellingsplaatsen van alle kompassen,
      met inbegrip van alle magnetische elementen ten behoeve van de navigatie, het sturen en de controle daarop, moeten
      doelmatig zijn en zodanig zijn gekozen, dat deze instrumenten, rekening houdend met het doel waarvoor zij worden
      gebruikt, geen onaanvaardbare storing ondervinden van in hun nabijheid geplaatste ijzermassa's en elektrische
      leidingen. Hiertoe moeten tijdig de aanwijzingen worden gevraagd van het Hoofd van de Scheepvaartinspectie. Deze
      aanwijzingen dienen eveneens te worden gevraagd indien aan schip of uitrusting wijzigingen worden aangebracht, die
      invloed kunnen hebben op de goede werking van deze magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.2.b
    text: |-
      Bij de aanleg van elektrische leidingen in de nabijheid van magnetische kompassen moet rekening worden gehouden met
      het daaromtrent bepaalde in [artikel 45d van bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 95.2.c
    text: |-
      Ter plaatse van een magnetisch kompas waarop moet kunnen worden gepeild, dient een vrij uitzicht te zijn over een
      boog van de horizon van, voorzover uitvoerbaar, 360 graden, doch in ieder geval van niet minder dan 230 graden,
      gerekend van recht vooruit tot 25 graden achterlijker dan dwars aan elke zijde.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.2.d
    text: |-
      Er dient een doelmatige voorziening aanwezig te zijn voor communicatie tussen de plaats waar het magnetisch
      standaardkompas staat opgesteld en de plaats vanwaar gewoonlijk de navigatie wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.a
    text: |-
      De horizontale en verticale scheepsmagnetische storingsvelden ter plaatse van de magnetische kompassen en van
      de magnetische elementen moeten door een bevoegd persoon behoorlijk zijn gecompenseerd, onder afgifte van een
      foutentabel voor elk magnetisch kompas en een verklaring voor elk magnetisch element.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.b
    text: Bij elk magnetisch kompas dient een foutentabel aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.c
    text: |-
      Telkenmale wanneer zich omstandigheden hebben voorgedaan die van invloed kunnen zijn op de gevonden fouten, dient
      hercompensatie plaats te vinden door een bevoegd persoon.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.d
    text: |-
      Telkenmale wanneer een ambtenaar van de Scheepvaartinspectie dit nodig oordeelt en in ieder geval eenmaal per
      jaar dienen de fouten van elk magnetisch kompas door een bevoegd persoon te worden geverifieerd, tenzij uit
      aantekeningen van de kapitein blijkt dat deze fouten op zee door waarnemingen geregeld worden geverifieerd en zij
      binnen redelijke grenzen blijven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.e
    text: |-
      Indien de verificaties, bedoeld onder d, naar het oordeel van een ambtenaar van de Scheepvaartinspectie daartoe
      aanleiding geven, dient hercompensatie ten behoeve van het magnetisch kompas en tevens van elk magnetisch element
      door een bevoegd persoon plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95.3.f
    text: |-
      De aanwijzing van de onder a, c, d en e bedoelde bevoegde personen geschiedt door Onze Minister, die tevens nadere
      regels kan stellen met betrekking tot de werkzaamheden van die personen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: '95.4'
    text: |-
      Voor het magnetisch kompas, bedoeld onder c van het tweede lid, moet een peilinrichting aanwezig zijn. Aan boord
      van een schip van 1600 ton of meer moet tevens een peilinrichting aanwezig zijn voor het gyrokompas, bedoeld onder
      c van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: '95.5'
    text: De in dit artikel bedoelde magnetische kompassen en gyrokompassen moeten van een goedgekeurd type zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95
  - number: 95a.1
    text: |-
      Een schip van 500 ton of meer doch minder dan 10 000 ton, gebouwd op of na 1 september 1984, en een schip van 1600
      ton of meer doch minder dan 10 000 ton, gebouwd vóór 1 september 1984, moeten zijn voorzien van ten minste één
      radarinstallatie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: 95a.2
    text: |-
      Vanaf 1 februari 1995 moeten een passagiersschip van minder dan 10 000 ton en een vrachtschip van 300 ton of meer
      doch minder dan 10 000 ton zijn voorzien van tenminste één radarinstallatie, welke moet kunnen werken in de 9 Ghz
      band.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: 95a.3
    text: |-
      Een schip van 10 000 ton of meer moet zijn voorzien van ten minste twee radarinstallaties die in staat zijn
      onafhankelijk van elkaar te werken. Ten minste één van deze radarinstallaties moet vanaf 1 februari 1995 kunnen
      werken in de 9 Ghz band.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: 95a.4
    text: |-
      Op de brug van een schip dat ingevolge één der voorgaande leden is voorzien van een radarinstallatie, moeten
      plotvoorzieningen aanwezig zijn. Op een schip van 1600 ton of meer, gebouwd op of na 1 september 1984, moeten deze
      voorzieningen ten genoegen van het Hoofd van de Scheepvaartinspectie zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: 95a.5
    text: |-
      Automatische radar-plot-apparatuur moet aanwezig zijn op een schip van 10 000 ton of meer, behalve op een
      schip, geen tankschip zijnde, van minder dan 15 000 ton dat gebouwd is vóór 1 september 1984. Het Hoofd van de
      Scheepvaartinspectie kan hiervan ontheffing verlenen, indien het naar zijn oordeel onredelijk of onnodig is dat
      deze apparatuur op een schip aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: 95a.6
    text: |-
      De in dit artikel bedoelde radarinstallatie en automatische radar-plot-apparatuur moeten van een goedgekeurd type
      zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel95a
  - number: '96.1'
    text: |-
      Een schip van 1600 ton of meer, gebouwd op of na 1 september 1980, doch vóór 1 februari 1995, moet tot 1 februari
      1999 zijn voorzien van radio-apparatuur bestemd voor het peilen recht vooruit («homing») op de radiotelefonie
      noodfrequentie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel96
  - number: '96.2'
    text: |-
      Een schip van 1600 ton of meer is voorzien van een richtingzoeker of van een ander elektronisch navigatiemiddel. De
      apparatuur is van een goedgekeurd type en wordt geplaatst ten genoegen van het Hoofd van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel96
  - number: '97.1'
    text: |-
      Behoudens aan boord van schepen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk schip ten minste één hoekmeetinstrument aanwezig zijn, waarvan de fouten bekend
      zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.2'
    text: |-
      Behoudens aan boord van schepen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk schip ten minste één deugdelijke chronometer aanwezig zijn, waarvan stand en gang
      bekend zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.3'
    text: Aan boord van elk schip moet ten minste één barometer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.4'
    text: Aan boord van elk schip moet een deugdelijke kijker aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.5'
    text: Aan boord van elk schip moet een echolood aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.6'
    text: |-
      Behoudens aan boord van schepen die een door het Hoofd van de Scheepvaartinspectie vast te stellen beperkt gebied
      bevaren, moet aan boord van elk schip een log aanwezig zijn. Aan boord van schepen van 500 ton of meer, gebouwd op
      of na 1 september 1984, moet deze log de vaart en verheid aangeven. Aan boord van schepen die zijn uitgerust met
      automatische radar-plot-apparatuur als bedoeld in [artikel 95a, vijfde lid, van dit besluit][ref1], moet deze log
      de vaart en verheid door het water aangeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel95a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 95a
        hoofdstuk: VI
        paragraaf: '3'
  - number: '97.7'
    text: |-
      Aan boord van een schip moet een roerstandaanwijzer, een tachometer voor elke schroef en bovendien, indien het
      schip is voorzien van verstelbare schroeven of schroeven met zijdelingse stuwkracht, een instrument dat de spoed
      en wijze van gebruik van die schroeven aangeeft, aanwezig zijn. Deze instrumenten moeten afleesbaar zijn vanaf de
      plaats waar de navigatie wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.8'
    text: |-
      Aan boord van een schip van 100 000 ton of meer, dat is gebouwd op of na 1 september 1984, moet een bochtaanwijzer
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.9'
    text: |-
      De instrumenten bedoeld in het zesde tot en met negende lid moeten van een goedgekeurd type zijn en voldoen aan de
      door het Hoofd van de Scheepvaartinspectie ter zake gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '97.10'
    text: |-
      Alle in het eerste, tweede en derde lid bedoelde nautische instrumenten moeten zijn voorzien van een
      fabriekscertificaat. De instrumenten, bedoeld in het zesde tot en met het negende lid, moeten van een goedgekeurd
      type zijn en voldoen aan de bij ministeriële regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel97
  - number: '98.1'
    text: |-
      Aan boord van elk schip moet het Handboek Opsporing en Redding op Zee (Mersar), alsmede een door het Hoofd van de
      Scheepvaartinspectie vastgestelde lijst van reddingseinen aanwezig zijn. Dit handboek en deze lijst moeten steeds
      op de brug bij de hand zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel98
  - number: '98.2'
    text: |-
      Aan boord van een schip van 150 ton of meer moet een dagseinlamp van een goedgekeurd type aanwezig zijn. De
      dagseinlamp moet ook kunnen worden gevoed door de noodkrachtbron van het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel98
  - number: '98.3'
    text: Aan boord van een schip van 150 ton of meer moet het Internationaal Seinboek aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel98
  - number: '98.4'
    text: Aan boord van een schip van 500 ton of meer moet een volledig stel seinvlaggen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel98
  - number: '99'
    text: |-
      Het bepaalde in de [artikelen 94 tot en met 98 van dit besluit][ref1] is niet van toepassing op een schip
      dat gesleept naar zijn bestemming wordt gebracht, met dien verstande dat, indien het schip is bemand, een
      lood met gemerkte lijn van voldoende lengte aan boord moet zijn en moet worden voldaan aan het bepaalde in
      [het tweede lid van artikel 98 van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel98
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '94'
        hoofdstuk: VI
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '98'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '100.1'
    text: |-
      Aan boord van elk schip moeten de middelen aanwezig zijn om te kunnen voldoen aan de van kracht zijnde bepalingen
      ter voorkoming van aanvaringen op zee. Deze middelen moeten, ook met betrekking tot de opstelling aan boord,
      voldoen aan de eisen gesteld in genoemde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
  - number: 100.2.a
    text: |-
      De lantaarns voorgeschreven in de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee moeten
      uitsluitend zijn ingericht voor elektrisch licht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
  - number: 100.2.b
    text: |-
      Behoudens aan boord van een schip van minder dan 500 ton, geen passagiersschip of een schip ingericht voor
      het vervoer van gevaarlijke stoffen als lading zijnde, moet aan boord van een schip voor elk van de top- en
      boordlantaarns en voor de heklantaarn een reservelantaarn aanwezig zijn die op de voor het gebruik bestemde plaats
      vast is aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
  - number: 100.3.a
    text: |-
      De elektrische installatie ten behoeve van de lantaarns en de middelen tot het geven van geluidsseinen die zijn
      voorgeschreven in de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee, met inbegrip van de
      reservelantaarns als bedoeld onder b. van het tweede lid van dit artikel, moet voldoen aan de eisen gesteld in
      [artikel 45b of artikel 68 van bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 100.3.b
    text: |-
      Lantaarns die ingevolge de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee aan boord
      aanwezig zijn, met inbegrip van alle reservelantaarns, moeten van een goedgekeurd type zijn en voorzien van een
      fabriekscertificaat.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
  - number: '100.4'
    text: |-
      Aan boord van elk schip dat de openbare wateren in Nederland, de Nederlandse Antillen of Aruba bevaart, die voor de
      scheepvaart open staan, moeten bovendien de hulpmiddelen aanwezig zijn, die nodig zijn om aan de voorschriften van
      de ter plaatse geldende reglementen te kunnen voldoen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100
  - number: 100a
    text: |-
      Tankschepen van 20 000 ton of meer, met inbegrip van olie-, gas- en chemicaliëntankschepen, met een draagvermogen
      als bedoeld in [artikel 3, onder 19, van bijlage II][ref1] zijn zowel op het voorschip als op het achterschip
      voorzien van een nood-sleepvoorziening, die voldoet aan bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '101'
    text: |-
      Met inachtneming van de eisen die voortvloeien uit het Radioreglement, het Besluit radio-elektrische inrichtingen
      (Stb. 1988, 552) en uit op het gebied van de maritieme communicatie gesloten internationale verdragen waartoe het
      Koninkrijk is toegetreden, moet de radio-installatie en de radiocommunicatie aan boord van een schip voldoen aan
      het bepaalde in [bijlage V van dit besluit][ref1], aan door Onze Minister te stellen veiligheidseisen, en tevens
      zijn voorzien van een door Onze Minister afgegeven verklaring van toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '105'
    text: |-
      De eigenaar van een schip moet kennis geven aan het betrokken districtshoofd van de Scheepvaartinspectie indien het
      schip wordt uitgerust met niet in dit hoofdstuk voorgeschreven reddingmiddelen, veiligheidsmiddelen, hulpmiddelen
      ter voorkoming van aanvaring en bij de plaatsbepaling, en radio-inrichtingen. Voorzover het middelen of
      inrichtingen betreft die in dit besluit met name zijn genoemd, moeten zij voldoen aan alle daarvoor in dit besluit
      omschreven eisen en in deugdelijke toestand verkeren; voorzover zij niet met name zijn genoemd dienen zij naar
      het oordeel van het Hoofd van de Scheepvaartinspectie voor het doel geschikt te zijn en in deugdelijke toestand
      te verkeren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel105
  - number: '121.1'
    text: |-
      Aan boord van een passagiersschip moeten de voor passagiers bestemde ruimten voldoen aan de eisen gesteld in
      [bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '121.2'
    text: |-
      Aan boord van een schip, geen passagiersschip zijnde, moeten de voor passagiers bestemde ruimten voldoen aan de
      in het eerste lid van dit artikel genoemde eisen. Het Hoofd van de Scheepvaartinspectie kan echter in bijzondere
      gevallen, rekening houdende met de aard van het schip, afwijking van deze eisen toestaan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel121
  - number: '122.1'
    text: |-
      Aan boord van een passagiersschip, ingericht voor het vervoer van 50 passagiers of meer, moet op reizen die meer
      dan drie etmalen duren, een ziekenverblijf aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: '122.2'
    text: |-
      Aan boord van een passagiersschip dat ingevolge het bepaalde in het eerste lid van dit artikel niet van een
      ziekenverblijf behoeft te zijn voorzien, moet ten minste één afzonderlijke ziekenkooi zijn ingebouwd. Het
      ziekenverblijf en de ziekenkooi moeten voldoen aan de navolgende eisen:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.a
    text: het ziekenverblijf moet een afzonderlijk verblijf zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.b
    text: het ziekenverblijf moet doelmatig zijn gelegen, zodat de patiënten gerieflijk zijn gehuisvest;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.c
    text: |-
      het ziekenverblijf moet zo groot zijn, dat de verpleging naar behoren kan geschieden. De patiënten moeten op
      gemakkelijke wijze in en uit het verblijf kunnen worden gebracht. De verlichting, ventilatie en verwarming moeten
      ten genoegen van het Hoofd van de Scheepvaartinspectie zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.d
    text: |-
      in het ziekenverblijf moet voldoende wasgelegenheid met toebehoren en afvoer van vuil water zijn aangebracht.
      Indien aan boord een systeem van stromend koud en warm zoet water aanwezig is, moet de wasgelegenheid daarop zijn
      aangesloten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.e
    text: |-
      indien het aantal passagiers dat verblijf houdt in hutten voor meer dan één persoon, niet meer dan 30 bedraagt,
      moet het ziekenverblijf zijn voorzien van ten minste één slaapplaats. Bedraagt het aantal meer dan 30, dan zijn
      twee slaapplaatsen vereist of zoveel meer als in verband met de omstandigheden van de reis door het Hoofd van de
      Scheepvaartinspectie wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.f
    text: |-
      de slaapplaatsen mogen niet boven elkaar zijn aangebracht. Hun inrichting moet ten minste voldoen aan de eisen
      gesteld onder j, terwijl zij binnenwerks gemeten ten minste 2,00 m lang en 0,80 m breed moeten zijn. De inrichting
      van de slaapplaatsen moet voldoende waarborg bieden voor wering van ongedierte en een gemakkelijke, grondige
      schoonmaak mogelijk maken;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.g
    text: |-
      bij het ziekenverblijf moeten een privaat en een hiervan afgescheiden badgelegenheid voor uitsluitend gebruik van
      de patiënten beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.h
    text: |-
      bij het ziekenverblijf moet een ruimte aanwezig zijn waar de genees- en verbandmiddelen en verplegingsartikelen
      worden opgeborgen en waar medicijnen kunnen worden bereid. Deze ruimte moet tevens als verbandkamer dienen of
      daarmede verbonden zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.i
    text: |-
      het ziekenverblijf mag niet voor andere doeleinden dan het verplegen of behandelen van zieken en gewonden worden
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: 122.2.j
    text: |-
      de ziekenkooi als bedoeld in het tweede lid, moet op de daarvoor meest geschikte plaats zijn ingebouwd en zodanig
      zijn ingericht, dat de zieke er gemakkelijk kan worden ingebracht en uitgenomen, waartoe zo nodig de kooiplanken
      wegneembaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: '122.4'
    text: |-
      Het in het eerste lid van dit artikel voorgeschreven ziekenverblijf met de daarbij behorende ruimte waar de genees-
      en verbandmiddelen en verplegingsartikelen worden opgeborgen en waar de medicijnen worden bereid, privaat en
      badgelegenheid kunnen worden samengevoegd met die voorgeschreven in het [Schepelingenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '122.5'
    text: |-
      Aan boord van elk passagiersschip moet gelegenheid zijn iemand die aan een ernstige of aan een besmettelijke ziekte
      lijdt, afgezonderd van alle anderen behoorlijk te verplegen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel122
  - number: '123'
    text: |-
      Ten behoeve van de passagiers moet voldoende voeding en drinkwater aanwezig zijn, waarvan de hoedanigheid en de
      wijze van berging gelijk moeten zijn aan die, welke voor voeding en drinkwater ten behoeve van de schepelingen zijn
      voorgeschreven in het [Schepelingenbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '124'
    text: Dekpassagiers mogen slechts worden vervoerd op reizen die korter dan 48 uur duren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel124
  - number: '127.1'
    text: |-
      Het beladen en het stuwen moeten voldoen aan de eisen van goed zeemanschap opdat de lading of een
      gedeelte daarvan niet levendig kan worden. Daarbij dient tevens te worden voldaan aan het bepaalde in
      [artikel 135 van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel135
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '135'
        hoofdstuk: X
  - number: '127.2'
    text: |-
      Een schip dat zonder lading of met weinig lading naar zee gaat, moet zo nodig voldoende, goed in het schip
      geplaatst en doelmatige ballast aan boord hebben. Ballast die zou kunnen overgaan, moet hiertegen op afdoende wijze
      zijn verzekerd. Ten aanzien van de stabiliteit dient hierbij rekening te worden gehouden met het bepaalde in het
      eerste lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel127
  - number: '128'
    text: |-
      Het vervoer van gestort graan of zaad, waaronder mede begrepen rijst en peulvruchten, is alleen toegestaan indien
      het geschiedt met inachtneming van de voorschriften gesteld in [bijlage XIX van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '129.1'
    text: |-
      Het vervoer van steenkool, eierkolen, steenkoolbriketten, enzovoort, is alleen toegestaan indien het geschiedt
      met inachtneming van de voorschriften gesteld in dit artikel en met inachtneming van de door het Hoofd van de
      Scheepvaartinspectie gestelde nadere regels.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel129
  - number: '129.2'
    text: |-
      De ruimte boven een lading steenkool, eierkolen of steenkoolbriketten moet deugdelijk kunnen worden geventileerd.
      Een luchtstroom door de lading moet worden vermeden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel129
  - number: '129.3'
    text: |-
      Elke ruimte waarin de in het eerste lid van dit artikel genoemde stoffen zijn geladen, moet zijn voorzien van een
      voldoend aantal, ten minste twee, luchtkokers, die gelijkelijk over het voor- en achtereinde van zulk een ruimte
      zijn verdeeld. Deze luchtkokers moeten een middellijn hebben van ten minste 0,30 m aan boord van een schip van 1000
      ton of meer en van ten minste 0,20 m aan boord van een schip van minder dan 1000 ton. De luchtkokers moeten boven
      de vaste gedeelten van het schip uitsteken, zodat de vrije toe- en afvoer van lucht niet wordt belemmerd. De kokers
      moeten voldoende sterk zijn om weerstand te kunnen bieden tegen de kracht van overkomend water bij ongunstig weer.
      De luchtkokers moeten doelmatig zijn ingericht, zodat zij voldoende luchtafvoer kunnen bewerkstelligen. Bovendien
      moeten zij zijn voorzien van middelen om bij slecht weer binnendringen van water te kunnen voorkomen. Indien
      kunstmatige ventilatie wordt gebezigd, dient de inrichting daarvan zodanig te zijn dat de af te voeren gasmengsels
      de ventilatiemotoren niet kunnen bereiken. Het materiaal en de constructie van de ventilatoren moet zodanig zijn,
      dat het ontstaan van vonken onder alle omstandigheden wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel129
  - number: '129.4'
    text: |-
      In de ruimten, beladen met de in het eerste lid van dit artikel bedoelde stoffen mag geen vuur
      aanwezig zijn. Behalve van een vast aangebrachte elektrische verlichting, waarvoor gebruik moet
      worden gemaakt van explosieveilige, drukvaste kamparmaturen, mag in genoemde ruimten voor de
      verlichting slechts gebruik worden gemaakt van veiligheidslampen die voldoen aan de eisen gesteld in
      [artikel 45, lid 10.2, van bijlage II van dit besluit][ref1]. Andere elektrische inrichtingen, behoudens de voor de
      hiervoor genoemde verlichting benodigde kabels, mogen in de bedoelde ruimten niet aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '129.5'
    text: |-
      Indien in een schip dat niet in het bijzonder voor het vervoer van steenkool is ingericht, eierkolen, nootjes
      of dergelijke steenkoolsoorten, die gemakkelijk kunnen overgaan, worden geladen, moet zonodig gevelingen zijn
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel129
  - number: '130'
    text: |-
      Gevaarlijke stoffen worden in de volgende klassen onderverdeeld: Klasse 1. ontplofbare stoffen; Klasse 2.
      samengeperste, tot vloeistof verdichte of onder druk opgeloste gassen; Klasse 3. ontvlambare vloeistoffen; Klasse
      4.1. gemakkelijk vlam vattende vaste stoffen; Klasse 4.2. aan broei of zelfontbranding onderhevige stoffen;
      Klasse 4.3. stoffen die in aanraking met water of vochtige lucht brandbare gassen afgeven; Klasse 5.1. oxyderende
      stoffen (zuurstofdragers); Klasse 5.2. organische peroxyden; Klasse 6.1. vergiftige stoffen; Klasse 6.2. gevaar
      voor besmetting opleverende stoffen; Klasse 7. radioactieve stoffen; Klasse 8. bijtende stoffen; Klasse 9. andere
      stoffen die gevaar kunnen opleveren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130
  - number: 130a
    text: |-
      Het vervoer van gestorte gevaarlijke stoffen als bedoeld in [artikel 130 van dit besluit][ref1]
      is alleen toegestaan indien het geschiedt met inachtneming van de voorschriften gesteld in
      [artikel 54 van bijlage IV ][ref2]en in de [artikelen 4 en 5 van bijlage XVII van dit besluit][ref3], alsmede met
      inachtneming van de door het Hoofd van de Scheepvaartinspectie gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
  - number: 130b
    text: |-
      Het vervoer van gestorte ladingen, andere dan graan, kolen of gevaarlijke stoffen, als bedoeld in onderscheidenlijk
      [artikel 128][ref1], [129][ref2] en [130a van dit besluit][ref3], die - gemakkelijk kunnen overgaan,
        - een grote dichtheid hebben,
        - geheel of gedeeltelijk vloeibaar kunnen worden gedurende de reis,
        - gevaren van chemische aard kunnen inhouden, of
        - andere gevaarlijke eigenschappen bezitten is alleen toegestaan indien het geschiedt met inachtneming van de door
      het Hoofd van de Scheepvaartinspectie gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel130a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130b
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '128'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '129'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0002501
        artikel: 130a
        hoofdstuk: IX
  - number: 130c
    text: |-
      De nadere regels bedoeld in de [artikelen 129][ref1], [130a][ref2] en [130b van dit besluit][ref3] zijn vermeld
      in een door het Hoofd van de Scheepvaartinspectie samen te stellen« Handboek Gestorte Ladingen», waarin tevens is
      opgenomen een opsomming van de meest voorkomende gestorte ladingen en hun eigenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel129
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel130a
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel130b
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130c
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '129'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
        artikel: 130a
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0002501
        artikel: 130b
        hoofdstuk: IX
  - number: 130d
    text: |-
      Het vervoer van verpakte gevaarlijke stoffen als bedoeld in [artikel 130 van dit besluit][ref1] is alleen
      toegestaan indien het geschiedt met inachtneming van de voorschriften gesteld in [artikel 54 bijlage IV][ref2] en
      in [bijlage XVII van dit besluit ][ref3]alsmede met inachtneming van de door het Hoofd van de Scheepvaartinspectie
      gestelde nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002501
      [ref3]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130d
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
      - id: ref3
        bwb_id: BWBR0002501
  - number: 130e
    text: |-
      De nadere regels, bedoeld in [artikel 130d van dit besluit][ref1], zijn vermeld in een door het Hoofd van de
      Scheepvaartinspectie samen te stellen «Handboek Gevaarlijke Stoffen», waarin tevens is opgenomen een opsomming van
      de meest voorkomende verpakte gevaarlijke stoffen en hun eigenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130d
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130e
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 130d
        hoofdstuk: IX
  - number: 130f
    text: |-
      Het bepaalde in [artikel 130d van dit besluit][ref1] is niet van toepassing op het meevoeren van gevaarlijke
      stoffen bestemd voor eigen scheepsgebruik of behorend tot de eigen scheepsuitrusting.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130d
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130f
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 130d
        hoofdstuk: IX
  - number: 130g.1
    text: |-
      Het vervoer in bulk van vloeibare ladingen, waaronder mede begrepen vloeibaar gemaakte gassen, met gevaarlijke
      eigenschappen is alleen toegestaan indien het geschiedt met inachtneming van de voorschriften gesteld in
      [bijlage II van dit besluit][ref1] en met inachtneming van door Onze Minister gestelde nadere regels, voorzover van
      toepassing. In het geval van vloeibare lading met brandgevaarlijke eigenschappen geldt dit voorschrift onverminderd
      het bepaalde in [bijlage IV, hoofdstuk D, van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130g
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
  - number: 130g.2
    text: |-
      De in het eerste lid bedoelde nadere regels kunnen afwijken van het bepaalde in dit besluit, mits zodanige
      regels ten minste even doelmatig zijn en daarbij de door de Internationale Maritieme Organisatie (IMO) aanvaarde
      aanbevelingen en voorschriften ter zake in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130g
  - number: 130h
    text: |-
      Wanneer aan boord van het vaartuig gevaarlijke stoffen worden meegevoerd, zijn tevens de bij ministeriële regeling
      voorgeschreven antidota en een zuurstofbeademingskoffer met onderhoudsset, met de daarbij behorende controlelijst
      en handleiding, aanwezig.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel130h
  - number: '131.1'
    text: De kruitkamer moet waterdicht zijn en kunnen worden afgesloten door een waterdichte deur met slot.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel131
  - number: '131.2'
    text: |-
      De kruitkamer moet, door het verrichten van een eenvoudige handeling, door een vaste leiding met water kunnen
      worden gevuld en gevuld worden gehouden. De kruitkamer moet een inrichting ter ontluchting aan dek hebben, die van
      dubbel veiligheidsgaas moet zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel131
  - number: '131.3'
    text: |-
      De kruitkamer moet bovendien voldoen aan het bepaalde in het «Handboek Gevaarlijke Stoffen» genoemd in
      [artikel 130e van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130e
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 130e
        hoofdstuk: IX
  - number: '132.1'
    text: |-
      Het dek ter plaatse waar deklast is gestuwd moet voldoende sterk zijn. De nodige middelen moeten aanwezig zijn om
      het overgaan van de deklast te beletten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.2'
    text: |-
      De deklast mag niet zo zwaar zijn, dat de stabiliteit van het schip erdoor in gevaar wordt gebracht. Bij deklast
      die door het overnemen van water in gewicht toeneemt, moet met die gewichtstoename rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.3'
    text: |-
      De deklast mag op generlei wijze de navigatie, de bediening van de redding- en brandblusmiddelen, lieren,
      peil- en temperatuurkokers, lenspompen en de toegang tot verblijven, enzovoort, belemmeren. Het licht van de
      navigatielantaarns mag niet worden onderschept.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.4'
    text: |-
      Indien de verschansing of reling van het schip niet hoog genoeg boven de deklast uitsteekt, moeten relingen of
      stutten met keertouwen worden aangebracht, zodat een veilig verkeer van de bemanning over de deklast is verzekerd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.5'
    text: |-
      Indien de bovenzijde van de deklast niet vlak genoeg is om erover te kunnen lopen, moeten de nodige planken en
      handleiders worden aangebracht om de bemanning in staat te stellen de verschillende delen van het schip zonder
      gevaar te bereiken.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.6'
    text: |-
      Deklasten moeten zodanig zijn gestuwd, dat overgenomen water gemakkelijk door de waterloospoorten kan wegvloeien.
      Op een deklast cokes mogen geen werkboten of andere zware voorwerpen worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '132.7'
    text: Het vervoer van een deklast hout voldoet bovendien aan de bij ministeriële regeling gestelde nadere regels.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel132
  - number: '133.1'
    text: |-
      Het vervoer van paarden, rundvee, varkens, schapen en geiten moet plaatsvinden in overeenstemming met de eisen
      gesteld in [bijlage XX van dit besluit ][ref1]dan wel, indien de inscheping plaatsvindt in een haven buiten
      Nederland, de Nederlandse Antillen of Aruba alwaar plaatselijke voorschriften betreffende het vervoer van dieren
      gelden, in overeenstemming met die voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '133.2'
    text: |-
      Indien de inscheping in een Nederlandse haven of in een haven van de Nederlandse Antillen of Aruba plaats heeft,
      moet de Scheepvaartinspectie tijdig vóór de inscheping worden gewaarschuwd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel133
  - number: 133a
    text: |-
      De kapitein is verplicht aan degene die een onderzoek verricht, alle medewerking te verlenen die deze
      redelijkerwijs bij de uitoefening van zijn taak kan vorderen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel133a
  - number: '134.1'
    text: |-
      De kapitein is verplicht zorg te dragen dat bij het ondernemen van een reis en ook gedurende de reis het schip geen
      geringer vrijboord heeft dan blijkens het afgegeven «certificaat van uitwatering» is geoorloofd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel134
  - number: '134.2'
    text: |-
      De kapitein van een schip dat gedurende een reis een ander vaargebied als bedoeld in
      [Hoofdstuk V van bijlage I van dit besluit][ref1] bereikt, is verplicht zorg te dragen, dat het schip geen geringer
      vrijboord heeft dan in dit vaargebied is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '134.3'
    text: |-
      a. De kapitein van een passagiersschip is verplicht zorg te dragen dat bij het ondernemen van een reis en ook
      gedurende de reis het schip geen geringer vrijboord heeft dan blijkens het afgegeven veiligheidscertificaat
      is geoorloofd. b. De kapitein van een chemicaliëntanker of een gastanker is verplicht zorg te dragen dat bij
      het ondernemen van een reis en ook gedurende de reis het schip geen geringer vrijboord heeft dan blijkens de
      goedgekeurde gegevens betreffende het doorstaan van een bepaalde aanvaring of stranding, geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel134
  - number: '134.4'
    text: |-
      Indien een schip op een rivier of in een binnenwater wordt beladen, is het de kapitein toegestaan dieper af te
      laden dan volgens het eerste en derde lid van dit artikel is geoorloofd en wel zoveel, als overeenkomt met het
      gewicht aan brandstof, enzovoort, dat wordt verbruikt tussen de plaats van vertrek en de plaats waar het schip
      buitengaats komt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel134
  - number: '134.5'
    text: De kapitein is verplicht zorg te dragen dat de uitwateringsmerken goed zichtbaar zijn en blijven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel134
  - number: '135.1'
    text: |-
      De kapitein van een schip is verplicht zorg te dragen dat bij het ondernemen van een reis voldoende gegevens aan
      boord zijn om hem in staat te stellen het schip zodanig te beladen en te ballasten dat onaanvaardbare spanningen in
      de scheepsconstructie worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
  - number: 135.2.a
    text: |-
      De kapitein van een schip waarvoor de nodige door het Hoofd van de Scheepvaartinspectie goedgekeurde gegevens
      betreffende de stabiliteit van het schip in onbeschadigde toestand zijn vastgesteld, is verplicht zorg te dragen
      dat bij het ondernemen van een reis deze gegevens aan boord zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
  - number: 135.2.b
    text: |-
      De kapitein van een passagiersschip is bovendien verplicht zorg te dragen dat bij het ondernemen van een reis de
      gegevens, bedoeld in de [artikelen 22 en 23a van bijlage II van dit besluit][ref1], aan boord zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 135.2.c
    text: |-
      De kapitein van een chemicaliëntanker of een gastanker is bovendien verplicht zorg te dragen dat bij het ondernemen
      van een reis de gegevens, bedoeld in [artikel 67a, derde lid][ref1], van dit besluit aan boord zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel67a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 67a
        hoofdstuk: V
  - number: 135.3.a
    text: |-
      De kapitein van een schip is verplicht zorg te dragen dat tijdens de reis de stabiliteit van het schip naar zijn
      oordeel voldoende is. Voor een schip als bedoeld in het tweede lid, onder a, van dit artikel moet tijdens de reis
      de stabiliteit van het schip in alle voorkomende bedrijfstoestanden ten minste voldoen aan door het Hoofd van de
      Scheepvaartinspectie vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
  - number: 135.3.b
    text: |-
      De kapitein van een passagiersschip is bovendien verplicht zorg te dragen dat tijdens de reis wordt voldaan aan het
      gestelde in de instructie, bedoeld in [artikel 23a van bijlage II van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '135.4'
    text: |-
      Het Hoofd van de Scheepvaartinspectie kan voor schepen van een bepaald type of van een bepaalde grootte ontheffing
      verlenen van de in het eerste lid van dit artikel genoemde eis.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135
  - number: 135a.1
    text: |-
      De kapitein is verplicht gedurende de reis regelmatig peiling te doen nemen van kofferdammen en van vullingen en
      voorts van alle tanks, uitgezonderd ladingtanks aan boord van tankschepen, gas- en chemicaliëntankschepen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
  - number: 135a.2
    text: 'De kapitein is voorts verplicht ten minste eenmaal per vier maanden het navolgende te doen controleren:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
  - number: 135a.2.a
    text: de juiste aanwijzing van de peilinrichting die is ingericht voor aflezing op afstand;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
  - number: 135a.2.b
    text: |-
      de juiste aanwijzing van de peilinrichting, geen peilglas zijnde, die is ingericht voor aflezing aan of in de
      directe nabijheid van de te peilen ruimte;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
  - number: 135a.2.c
    text: |-
      de juiste werking van de inrichting die door alarmering aangeeft, dat het vloeistofniveau in een ruimte een
      ingestelde waarde heeft overschreden;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
  - number: 135a.2.d
    text: |-
      de juiste werking van de in [artikel 48, eerste lid, van bijlage II van dit besluit][ref1] bedoelde
      alarminstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel135a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 136a
    text: 'De kapitein van elk schip is verplicht zorg te dragen dat voor het ondernemen van een reis en gedurende reis:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.a
    text: |-
      alle reddingmiddelen en -voorzieningen als bedoeld in [artikel 67b van dit besluit][ref1] , zijn geplaatst,
      opgesteld dan wel geborgen zoals aangegeven op het aan boord aanwezige, goedgekeurde veiligheidsplan indien zulk
      een plan ingevolge het bepaalde in [artikel 138 van dit besluit ][ref2]is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel138
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 67b
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '138'
        hoofdstuk: X
  - number: 136a.b
    text: |-
      alle reddingmiddelen en -voorzieningen steeds in goede staat verkeren en voor onmiddellijk gebruik gereed zijn, en
      voor het dagelijks toezicht hierop een of meer scheepsofficieren zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.c
    text: |-
      de uitrusting van de redding- en hulpverleningsboten steeds in goede staat verkeert en voor onmiddellijk gebruik
      gereed is, en in die boten geen andere zaken worden geborgen dan die tot de uitrusting behoren;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.d
    text: |-
      een gediplomeerd sloepsgast is belast met het bevel over elk groepsreddingmiddel, en voor elke reddingboot tevens
      een plaatsvervanger is aangewezen, dan wel, wanneer zulks door het Hoofd van de Scheepvaartinspectie is toegestaan,
      een persoon met ervaring in de behandeling en bediening van reddingvlotten is belast met het bevel over elk
      reddingvlot;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.e
    text: |-
      degene die met het bevel over een groepsreddingmiddel is belast en de plaatsvervanger beschikken over een lijst
      met namen van de hun toegewezen bemanning van het groepsreddingmiddel en toezien dat die bemanningsleden hun taken
      kennen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.f
    text: |-
      voor elke motorreddingboot iemand is aangewezen die de motor kan bedienen en kleine herstellingen daaraan kan
      verrichten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
  - number: 136a.g
    text: |-
      de handboeken voor opleiding ter zake van de reddingmiddelen en -voorzieningen, bedoeld in
      [artikel 18, lid 2, van bijlage XIA van dit besluit,][ref1] aan boord zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 136a.h
    text: |-
      de instructies voor het onderhoud van de reddingmiddelen en -voorzieningen, bedoeld in
      [artikel 19, lid 3, van bijlage XIA van dit besluit][ref1], aan boord zijn en het onderhoud dienovereenkomstig
      wordt uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 136a.i
    text: |-
      de periodieke beproevingen, inspecties en keuringen van de reddingmiddelen en -voorzieningen worden uitgevoerd op
      een wijze als voorgeschreven in [artikel 19, lid 6 tot en met 9, van bijlage XIA van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 136b.1
    text: |-
      De kapitein van een passagiersschip draagt er zorg voor dat het aantal opvarenden van het schip voor het vertrek
      uit de haven wordt geteld en wordt medegedeeld aan hem en aan de passagiersregistratiebeambte van de eigenaar of
      aan een zich aan wal bevindend systeem van de eigenaar dat voor hetzelfde doel dient.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.2
    text: |-
      Hij ziet er op toe dat het aantal opvarenden niet groter is dan het schip ingevolge het veiligheidscertificaat voor
      passagiersschepen mag vervoeren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3
    text: |-
      De kapitein van een passagiersschip dat een reis maakt van meer dan 20 zeemijl vanaf de plaats van vertrek draagt
      er zorg voor dat voor het vertrek de volgende gegevens worden verzameld en uiterlijk 30 minuten na het vertrek
      worden doorgegeven aan de passagiersregistratiebeambte van de eigenaar of aan een zich aan wal bevindend systeem
      van de eigenaar dat hetzelfde doel dient:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3.a
    text: de achternamen van de opvarenden,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3.b
    text: de voornamen of de initialen,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3.c
    text: het geslacht,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3.d
    text: de leeftijdscategorie (volwassene, kind of zuigeling) waartoe de persoon behoort, dan wel leeftijd of geboortejaar,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 136b.3.e
    text: |-
      door passagiers op eigen initiatief verstrekte informatie in verband met behoefte aan speciale zorg of bijstand
      in noodsituaties.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel136b
  - number: 137a
    text: 'De kapitein van elk schip is verplicht zorg te dragen dat voor het ondernemen van een reis:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel137a
  - number: 137a.a
    text: |-
      een alarmrol als bedoeld in [artikel 8, lid 3, van bijlage XIA van dit besluit][ref1], is samengesteld en
      exemplaren daarvan zijn opgehangen op in het oog vallende plaatsen, waaronder begrepen de brug, de machinekamer en
      de bemanningsverblijven;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 137a.b
    text: |-
      de alarmrol wordt herzien of vernieuwd wanneer een verandering in de samenstelling van de bemanning zulks
      noodzakelijk maakt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel137a
  - number: 137a.c
    text: |-
      instructies voor noodgevallen als bedoeld in [artikel 8, lid 4, van bijlage XIA van dit besluit][ref1], aanwezig
      zijn in de passagiershutten en -verblijven, alsmede op de verzamelplaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel137a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '138.1'
    text: Aan boord van elk schip is een veiligheidsplan aanwezig.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
  - number: '138.2'
    text: |-
      Het veiligheidsplan, bestaande uit een algemeen plan, geeft aan waar de diverse dekken, de verbindingen tussen
      de dekken onderling, de compartimenten en de toegangen tot deze compartimenten zich bevinden, en verschaft op
      duidelijke en overzichtelijke wijze informatie over de aanwezige brandblus-, redding- en veiligheidsmiddelen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
  - number: '138.3'
    text: Het veiligheidsplan is op toegankelijke en kenbare plaatsen opgehangen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
  - number: '138.4'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de inhoud van het veiligheidsplan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
  - number: '138.5'
    text: |-
      De kapitein van een schip, geen passagiersschip zijnde, met een lengte als omschreven in artikel 2 van bijlage I
      van dit besluit van 24 m of meer, alsmede de kapitein van een passagiersschip is verplicht zorg te dragen dat:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
  - number: 138.5.1°
    text: |-
      de brandbeveiligingsplannen als voorgeschreven in [artikel 20 van bijlage IV van dit besluit][ref1], permanent
      zijn opgehangen op de daarvoor in aanmerking komende plaatsen en zijn opgeborgen in de duidelijk gemerkte en
      weerbestendige bergplaats aan de buitenzijde van het dekhuis; of


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 138.5.2°
    text: |-
      wanneer ingevolge het bepaalde in [artikel 20 van bijlage IV van dit besluit][ref1] het gebruik van
      brandbeveiligingsboekjes is toegestaan door het Hoofd van de Scheepvaartinspectie, een exemplaar van zulk een
      boekje is uitgereikt aan iedere officier, een exemplaar op een toegankelijke plaats beschikbaar is en een exemplaar
      is opgeborgen in een duidelijk gemerkte en weerbestendige bergplaats aan de buitenzijde van het dekhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '138.6'
    text: |-
      Op een schip, geen passagiersschip zijnde, met een lengte als bedoeld in [artikel 2 van bijlage I ][ref1]van 24
      meter of meer, mag het veiligheidsplan, bedoeld in het eerste lid, met de brandbeveiligingsplannen, bedoeld in
      het vijfde lid, tot een gezamenlijk plan worden gecombineerd. In een dergelijk geval zorgt de kapitein ervoor dat
      een exemplaar van het veiligheidsplan is opgeborgen in een duidelijk gemerkte en weerbestendige bergplaats aan de
      buitenzijde van het dekhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 139a.1
    text: 'De kapitein van een passagiersschip is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.1.a
    text: |-
      appèls van de passagiers, appèls van de bemanning, oefeningen« schip verlaten», oefeningen in het blussen van
      brand, oefeningen met de hulpverleningsboten, opleiding en instructie in het gebruik van de reddingmiddelen
      en oefeningen met reddingvlotten van het strijkbare type worden gehouden overeenkomstig het bepaalde in
      [artikel 18, leden 3 en 4, en artikel 25, van bijlage XIA van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 139a.1.b.1°
    text: een doelmatige brandrondedienst wordt onderhouden om elk begin van brand zo spoedig mogelijk te kunnen ontdekken;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.1.b.2°
    text: |-
      indien op een schip ruimten van bijzondere aard als bedoeld in
      [artikel 3, onderdeel 18, van bijlage IV van dit besluit][ref1], aanwezig zijn, deze ruimten eveneens in de
      brandrondedienst worden betrokken. Tenzij in bedoelde ruimten een vast aangebrachte brandontdekkingsinstallatie als
      bedoeld in [artikel 37, lid 1.4.1, van bijlage IV van dit besluit][ref2], is aangebracht, moet de brandrondedienst
      in bedoelde ruimten worden onderhouden door een permanent aanwezige brandwacht;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002501
      - id: ref2
        bwb_id: BWBR0002501
  - number: 139a.1.c
    text: |-
      elk lid van de onder b genoemde brandrondedienst wordt geoefend, zodat deze op de hoogte is van de indeling van het
      schip en van de plaats en de werking van de uitrusting die hij eventueel zou moeten hanteren;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.1.d
    text: |-
      het schip te allen tijde, op zee zowel als in de haven, zo is bemand of uitgerust, dat zeker wordt gesteld dat een
      daarvoor verantwoording dragend bemanningslid elk eerste brandalarm onmiddellijk ontvangt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.2
    text: |-
      De kapitein van een vrachtschip is verplicht zorg te dragen dat appels van de passagiers, appels van de bemanning,
      oefeningen «schip verlaten», oefeningen in het blussen van brand, oefeningen met de hulpverleningsboten, opleiding
      en instructie in het gebruik van de reddingmiddelen en oefeningen met reddingvlotten van het strijkbare type worden
      gehouden overeenkomstig het bepaalde in [artikel 18, leden 3 en 4, van bijlage XIA van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 139a.3
    text: 'De kapitein van een passagiersschip of een vrachtschip is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.3.a
    text: |-
      de oefeningen in het blussen van brand er op gericht zijn de leden van de bemanning vertrouwd te maken met de
      inrichting en de voorzieningen van het schip, met hun taak en met het gebruik van alle bij de oefening benodigde
      middelen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: 139a.3.b
    text: tijdens de oefeningen in het blussen van brand alle brandbluspompen worden beproefd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel139a
  - number: '140.1'
    text: 'De kapitein van een schip is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.a
    text: |-
      alle brandontdekkingsmiddelen en -bestrijdingsmiddelen steeds in goede staat en voor onmiddellijk gebruik gereed
      zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.b
    text: |-
      de brandslangen alleen worden gebruikt voor brandblusdoeleinden, voor het beproeven van de brandblusinrichting of
      bij oefeningen en inspecties;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.c
    text: de brandslangen telkenmale na verloop van ten hoogste zes maanden worden beproefd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.d
    text: |-
      de periodieke controle en beproeving van draagbare en niet-draagbare brandblustoestellen, alsmede van vast
      aangebrachte brandblusinstallaties met inbegrip van de eventueel bij deze toestellen of installaties behorende
      gascilinders, geschiedt op een wijze als door het Hoofd van de Scheepvaartinspectie wordt voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.e
    text: |-
      de voortstuwingsruimten, andere ruimten voor machines en de kombuizen behoorlijk worden schoongehouden en worden
      vrijgehouden van olieresten, lekolie, met olie doordrenkt poetskatoen en dergelijke verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.1.f
    text: |-
      voor scheepsgebruik bestemde of tot de scheepsuitrusting behorende, stoffen of onderdelen met brandgevaarlijke
      eigenschappen zeevast worden opgeborgen op een veilige plaats, verwijderd van ruimten voor machines, kombuizen en
      plaatsen waar open vuur wordt gebezigd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: '140.2'
    text: |-
      De kapitein van een passagiersschip dat niet is voorzien van een afstandbediening van brandbluspompen, is verplicht
      zorg te dragen dat de hoofdbrandblusleiding voortdurend onder druk wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: '140.3'
    text: |-
      De kapitein van een vrachtschip, waarvoor de wachtbezetting van de machinekamer slechts uit één man bestaat
      dan wel waarvoor door het Hoofd van de Scheepvaartinspectie is aanvaard dat de machinekamer tijdelijk onbemand
      is, en dat niet is voorzien van een afstandbediening van brandbluspompen, is verplicht zorg te dragen dat de
      hoofdbrandblusleiding voortdurend onder druk wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: '140.4'
    text: |-
      De kapitein van een schip dat wordt gebezigd voor het vervoer van gevaarlijke stoffen als bedoeld in
      [artikel 130 van dit besluit][ref1], en dat niet is voorzien van een afstandbediening van brandbluspompen, is
      verplicht zorg te dragen dat de hoofdbrandblusleiding voortdurend onder druk wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
  - number: 140.5.a
    text: |-
      De kapitein van een schip aan boord waarvan een of meer ruimten aanwezig zijn, bestemd voor het vervoer van
      motorrijtuigen waarvan de tank met brandstof voor eigen aandrijving is gevuld, is verplicht het voor deze ruimte
      bestemde mechanische ventilatiesysteem te allen tijde in werking te doen zijn, wanneer zich dergelijke voertuigen
      in die ruimten bevinden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: 140.5.b
    text: |-
      In afwijking van het bepaalde onder a van dit lid behoeft aan boord van een ro-ro-vrachtschip, waarvan de
      elektrische apparatuur en leidingen in gesloten ro/ro laadruimten van een type zijn dat geschikt is voor het
      gebruik in explosieve mengsels van benzine en lucht, het mechanische ventilatiesysteem van die laadruimten niet te
      allen tijde in werking te zijn, doch kan worden volstaan met dagelijks gedurende een beperkte periode – afhankelijk
      van de weersomstandigheden – te ventileren. In ieder geval dient dit te geschieden gedurende een redelijke periode
      vóór de lossing van de voertuigen. Alvorens de lossing kan aanvangen, moet worden aangetoond dat de betreffende
      ruimte gasvrij is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel140
  - number: '141'
    text: 'De kapitein is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
  - number: 141.a
    text: |-
      waterdichte deuren in schotten die tussendekslaadruimen van elkaar scheiden, en toegangs-, laad- en kolenpoorten in
      het scheepsboord, vóór het schip de haven of rede verlaat, zijn gesloten en gedurende de reis gesloten blijven;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
  - number: 141.b
    text: |-
      de overige waterdichte deuren gedurende de reis zijn gesloten, tenzij deze noodzakelijkerwijze geopend moeten
      worden of blijven, zoals omschreven in [bijlage II van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 141.c
    text: |-
      indien zich in de voortstuwingsruimten wegneembare platen in waterdichte schotten bevinden, deze platen, vóór
      het schip de haven of rede verlaat, aangebracht en waterdicht verpakt zijn en op zee, behalve bij gebiedende
      noodzakelijkheid, niet worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
  - number: 141.d
    text: |-
      het openen en sluiten van patrijspoorten in een tussendek geschiedt in overeenstemming met het bepaalde in
      [bijlage II van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 141.e
    text: |-
      patrijspoorten die gedurende de reis niet bereikbaar zijn, vóór het schip de haven of rede verlaat, behoorlijk met
      hun blinden zijn gesloten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
  - number: 141.f
    text: |-
      de deksels en kleppen van stortkokers voor as, vuil en dergelijke, die niet in gebruik zijn en waarvan de
      binnenboordsopeningen geheel of gedeeltelijk beneden de indompelingsgrenslijn zijn gelegen, behoorlijk zijn
      gesloten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel141
  - number: '142'
    text: 'De kapitein van een passagiersschip is verplicht zorg te dragen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel142
  - number: 142.a
    text: |-
      oefeningen in het behandelen van waterdichte deuren, patrijspoorten, kleppen en afsluiters wekelijks plaats hebben
      en indien de reis langer dan een week duurt, bovendien, vóór het schip de haven of rede verlaat, een volledige
      oefening wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel142
  - number: 142.b
    text: |-
      alle werktuiglijk bewogen waterdichte deuren en alle waterdichte draaideuren in hoofddwarsschotten, die op zee uit
      hoofde van de behoeften van de dienst noodzakelijk geopend moeten blijven, éénmaal daags worden gesloten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel142
  - number: 142.c
    text: |-
      de waterdichte deuren en alle daarbij behorende bewegingsinrichtingen en standaanwijzers, alle afsluiters die
      moeten zijn gesloten om een afdeling waterdicht te maken, benevens alle afsluiters in dwarsscheepse overvloei-
      inrichtingen als bedoeld in [bijlage II van dit besluit][ref1], gedurende de reis geregeld, ten minste éénmaal per
      week, worden nagezien.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 142a
    text: |-
      De kapitein is verplicht zorg te dragen dat de schepelingen bekend zijn met het gebruik van de beschermende
      uitrusting als bedoeld in [artikel 89a van dit besluit][ref1]. Hij dient erop toe te zien dat deze uitrusting in
      daartoe in aanmerking komende omstandigheden wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel89a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel142a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 89a
        hoofdstuk: VI
        paragraaf: '2'
  - number: '143'
    text: 'De kapitein is verplicht zodanige maatregelen te nemen dat:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.a
    text: |-
      in vochtige ruimten en in ruimten met ontploffingsgevaar geen werkzaamheden aan ongeïsoleerde delen van de
      elektrische installatie worden uitgevoerd, zolang deze onder spanning staan;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.b
    text: |-
      in ruimten met ontploffingsgevaar geen werkzaamheden geschieden, waarbij vonkvorming kan optreden en werkzaamheden
      aan machines, toestellen, transformatoren, schakel- en verdeelinrichtingen, lamparmaturen en leidingen met
      toebehoren slechts plaatsvinden, nadat het desbetreffende gedeelte der installatie spanningsloos is gemaakt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.c
    text: |-
      in andere dan onder a genoemde ruimten slechts werkzaamheden aan blanke of daarmede gelijk te stellen
      onder spanning staande delen van de elektrische installatie worden uitgevoerd, indien voor de veiligheid en
      bedrijfszekerheid van het schip dringende redenen aanwezig zijn om deze onder spanning te verrichten, mits:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.c.(i)
    text: alle zich in de nabijheid bevindende metalen delen deugdelijk tegen aanraking zijn beschermd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.c.(ii)
    text: de metalen delen van het bij de werkzaamheden benodigde gereedschap voorzover mogelijk deugdelijk zijn geïsoleerd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.c.(iii)
    text: zij die de werkzaamheden uitvoeren zich op een deugdelijk isolerende laag bevinden;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.c.(iv)
    text: |-
      voorzover dit in verband met de plaats en de omstandigheden nodig is, duidelijk leesbare waarschuwingen zijn
      aangebracht om te voorkomen dat aan een niet met de werkzaamheden belaste persoon een ongeval overkomt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.d
    text: |-
      werkzaamheden in de nabijheid van blanke of daarmede gelijk te stellen delen van de elektrische installatie slechts
      geschieden, indien deze spanningsloos zijn gemaakt, tenzij dit om bedrijfstechnische redenen niet mogelijk is, in
      welk geval alle maatregelen moeten zijn genomen, die een veilig verloop van de arbeid kunnen waarborgen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.e
    text: |-
      bij voeding van het scheepsnet of een gedeelte daarvan vanaf de wal, geen spanningen en stroomsoorten en bij
      draaistroom bovendien geen frequenties en volgorden der fasen, waarvoor de elektrische installatie aan boord niet
      geschikt is, worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.f
    text: dat isolatiefouten in de elektrische installatie zo spoedig mogelijk worden verholpen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.g
    text: |-
      dat de noodkrachtbron en de tijdelijke noodkrachtbron, indien aanwezig, zomede de automatische inrichtingen van de
      noodinstallatie wekelijks worden beproefd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: 143.h
    text: dat de noodverlichting maandelijks wordt beproefd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel143
  - number: '144.1'
    text: |-
      De kapitein van een schip, geen klein vaartuig zijnde, is met betrekking tot de stuurinrichting verplicht zorg te
      dragen dat:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.a
    text: binnen 12 uur vóór vertrek de stuurinrichting door de bemanning wordt gecontroleerd en beproefd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b
    text: |-
      bij de beproevingsprocedure als bedoeld onder a, voorzover van toepassing, de werking van de volgende onderdelen
      is begrepen:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(i)
    text: de hoofdstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(ii)
    text: de hulpstuurinrichting;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(iii)
    text: de afstandbedieningssystemen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(iv)
    text: de besturingsmogelijkheden op de brug;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(v)
    text: de noodkrachtvoorziening;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(vi)
    text: de roerstandaanwijzers, vergeleken met de werkelijke stand van het roer;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(vii)
    text: de alarmeringen voor het uitvallen van de bekrachtiging van de afstandbedieningssystemen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(viii)
    text: de alarmeringen voor het uitvallen van de krachtwerktuigen van de stuurinrichting, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.b.(ix)
    text: |-
      de automatische voorzieningen waarmee een defect gedeelte van de stuurinrichting buiten bedrijf wordt gesteld en
      andere automatische uitrusting;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.c
    text: 'bij de onder a van dit lid bedoelde controles en beproevingen zijn inbegrepen:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.c.(i)
    text: het bewegen van het roer over de volle uitslag zoals vereist voor de betreffende stuurinrichting,
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.c.(ii)
    text: een visuele inspectie van de stuurinrichting met de daaraan verbonden systemen, en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.c.(iii)
    text: de werking van de communicatiemiddelen tussen de brug en de stuurmachinekamer;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.d
    text: |-
      eenvoudige gebruiksaanwijzingen met een blokdiagram waarop de overschakelingsprocedures zijn aangegeven voor
      de afstandbedieningssystemen en de krachtwerktuigen voor de stuurmachine, op de brug en in de stuurmachinekamer
      permanent zijn opgehangen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.e
    text: |-
      alle officieren die betrokken zijn bij de behandeling of het onderhoud van de stuurinrichting, vertrouwd zijn met
      de werking van de stuursystemen en met de procedures om van het ene systeem over de schakelen op het andere.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.f
    text: |-
      in aanvulling op de geregelde controles en beproevingen als bedoeld onder a van dit lid, ten minste eenmaal in de
      drie maanden oefeningen plaatsvinden voor de besturing van het schip in gevallen waarbij één of meer onderdelen
      van het stuursysteem is (zijn) uitgevallen, ten einde hiermede ervaring op te doen. Bij deze oefeningen dienen
      te zijn inbegrepen de directe bediening in de stuurmachinekamer, de communicatieprocedure met de brug en – indien
      toepasselijk – het gebruik van vervangende krachtvoorzieningen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.g
    text: |-
      de data waarop de controles en beproevingen als bedoeld onder a van dit lid, zijn gehouden en de data met de
      bijzonderheden van de oefeningen als omschreven onder f van dit lid, worden aangetekend in het scheepsdagboek;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.1.h
    text: de onderdelen voor de hulpstuurinrichting voor onmiddellijk gebruik gereed zijn opgeborgen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: '144.2'
    text: |-
      De kapitein van een schip is verplicht zorg te dragen dat in gebieden waar de navigatie bijzondere aandacht vergt,
      meer dan één krachtwerktuig van de stuurinrichting in bedrijf is, indien dergelijke werktuigen geschikt zijn om de
      stuurinrichting gelijktijdig te voeden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: '144.3'
    text: |-
      De kapitein van een schip, geen klein vaartuig zijnde, dat is uitgerust met een automatische stuurinrichting, is
      verplicht zorg te dragen dat:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.3.a
    text: |-
      in gebieden met een grote vaardichtheid, bij beperkt zicht en in alle andere voor de navigatie gevaarlijke
      situaties, waarin gebruik wordt gemaakt van de automatische stuurinrichting, de officier van de wacht onverwijld
      kan beschikken over de diensten van een bekwame roerganger die op ieder moment de besturing moet kunnen overnemen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.3.b
    text: |-
      het overschakelen van automatische besturing op handbesturing en omgekeerd, geschiedt door of onder toezicht van
      een verantwoordelijk officier;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144.3.c
    text: |-
      de handbesturing wordt beproefd nadat gedurende een langere tijd gebruik is gemaakt van de automatische
      stuurinrichting en voordat gebieden worden binnengevaren waar de navigatie bijzondere aandacht vergt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: '144.4'
    text: |-
      De kapitein van een klein vaartuig moet vóór vertrek de goede werking van de hoofd- en hulpstuurinrichting doen
      controleren, doch deze controle behoeft niet vaker dan éénmaal per week plaats te vinden, waarbij de data van de
      controle en eventuele bijzonderheden in het scheepsdagboek moeten worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144
  - number: 144a
    text: |-
      De kapitein van een schip is verplicht zorg te dragen dat op de brug de nodige gegevens beschikbaar zijn
      betreffende de manoeuvreereigenschappen en de stopweg bij voor het schip karakteristieke vaarsnelheden en
      diepgangen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel144a
  - number: '145'
    text: |-
      De kapitein is verplicht zorg te dragen dat de luiken en luikschilden niet worden gebruikt voor doeleinden,
      waarvoor zij niet zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel145
  - number: '146.1'
    text: |-
      De kapitein is verplicht zorg te dragen dat de fouten van elk magnetisch kompas éénmaal per jaar door een bevoegd
      persoon als bedoeld in [artikel 95 van dit besluit][ref1], worden geverifieerd, tenzij deze fouten in zee door
      waarnemingen geregeld worden geverifieerd en zij binnen redelijke grenzen blijven. Bovendien is de kapitein
      verplicht hercompensatie door een bevoegd persoon als bovenbedoeld te doen plaatsvinden, telkenmale wanneer zich
      omstandigheden hebben voorgedaan die van invloed kunnen zijn op de gevonden fouten.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel95
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '95'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '146.2'
    text: De kapitein is verplicht zorg te dragen dat bij elk magnetisch kompas een foutentabel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel146
  - number: '147.1'
    text: |-
      De kapitein van een schip uitgerust met een richtingzoeker is verplicht zorg te dragen dat éénmaal per jaar de
      fouten van de richtingzoeker door een bevoegd persoon als bedoeld in [artikel 96 van dit besluit][ref1], worden
      geverifieerd, tenzij deze fouten in zee door waarnemingen geregeld worden geverifieerd en zij binnen redelijke
      grenzen blijven. Bovendien is de kapitein verplicht verifiëring te doen plaats vinden, telkenmale wanneer in de
      positie van enige antenne, dan wel van enige constructie aan dek, veranderingen zijn aangebracht die de gevonden
      fouten van de richtingzoeker merkbaar zouden kunnen beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel96
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel147
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '96'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '147.2'
    text: |-
      De kapitein is verplicht zorg te dragen dat de grafiek, aangevende de correctie die op de afgelezen peiling moet
      worden toegepast om de ware peiling ten opzichte van de kiellijn te verkrijgen, voor onmiddellijk gebruik bij de
      richtingzoeker aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel147
  - number: '147.3'
    text: |-
      De kapitein is verplicht zorg te dragen dat gedurende het nemen van radiopeilingen de antennes van ontvangers,
      toebehorende aan opvarenden, zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel147
  - number: '148'
    text: |-
      De kapitein is verplicht zorg te dragen dat de radiowachten, bedoeld in
      [artikel 14 van bijlage V van dit besluit][ref1], worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '149'
    text: |-
      De kapitein is verplicht zorg te dragen dat door de stuurlieden regelmatig wordt geoefend met de elektronische
      navigatiemiddelen waarmede het schip is uitgerust.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel149
  - number: '150.1'
    text: |-
      De kapitein van elk schip is verplicht zorg te dragen dat zijn schip is bemand in overeenstemming met het bepaalde
      in [hoofdstuk VII van dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: VII
  - number: '150.2'
    text: |-
      De kapitein van elk schip is bovendien verplicht zorg te dragen dat de wachtbezetting aan boord geschiedt in
      overeenstemming met het bepaalde in de [artikelen 113][ref1] en [114 van dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel114
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '113'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '114'
        hoofdstuk: VII
  - number: '150.3'
    text: |-
      De kapitein van een schip dat veilig in de haven gemeerd of ten anker ligt, is verplicht zorg te dragen dat een
      doeltreffende wacht wordt gehouden met het oog op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150
  - number: '150.4'
    text: |-
      De kapitein van een schip dat gevaarlijke stoffen als bedoeld in
      [het eerste lid van artikel 130 van dit besluit][ref1], in bulk vervoert – ongeacht of deze explosief, ontvlambaar
      of giftig zijn of kunnen zijn, dan wel de gezondheid bedreigen of kunnen bedreigen of het milieu verontreinigen of
      kunnen verontreinigen – dient te zorgen, aan dek en in de machinekamer, voor een doeltreffende wacht met het oog
      op de veiligheid. Daartoe dienen op ieder ogenblik één of meer gediplomeerde officieren snel beschikbaar te zijn,
      evenals scheepsgezellen, indien nodig, zelfs wanneer het schip veilig in de haven gemeerd of ten anker ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
  - number: '150.5'
    text: |-
      De kapitein van een schip dat gevaarlijke stoffen als bedoeld in
      [het eerste lid van artikel 130 van dit besluit][ref1] anders dan in bulk vervoert – ongeacht of deze explosief,
      ontvlambaar of giftig zijn of kunnen zijn, dan wel de gezondheid bedreigen of kunnen bedreigen of het milieu
      verontreinigen of kunnen verontreinigen – dient bij het treffen van regelingen inzake een doeltreffende wacht met
      het oog op de veiligheid ten volle rekening te houden met de aard, hoeveelheid, verpakking en wijze van stuwen van
      de gevaarlijke stoffen en met alle bijzondere omstandigheden aan boord, zowel op zee als wanneer het schip veilig
      in de haven gemeerd of ten anker ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
  - number: 150a
    text: |-
      De kapitein is verplicht er op toe te zien dat de in het [Schepelingenbesluit][ref1] met betrekking tot de voeding
      en het drinkwater gestelde voorschriften, waarvan de zorg aan hem is opgedragen, in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001985
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel150a
    references:
      - id: ref1
        bwb_id: BWBR0001985
  - number: '154.1'
    text: |-
      De kapitein is verplicht zorg te dragen dat ten aanzien van het vervoer van lading rekening wordt gehouden met de
      voorschriften gesteld in [hoofdstuk IX van dit besluit][ref1] en is voorts verplicht die maatregelen te treffen die
      in verband met de aard van de lading en de wijze van stuwen nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#HoofdstukIX
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
        hoofdstuk: IX
  - number: '154.2'
    text: |-
      De kapitein is verplicht zowel bij het openen der luiken als bij het betreden van die ruimten extra
      voorzorgsmaatregelen te treffen, indien stoffen zijn geladen die aanleiding kunnen geven tot het aanwezig zijn van
      ontplofbare, giftige of andere schadelijke dampen, dan wel stoffen die aanleiding kunnen geven tot zuurstofarmoede.
      Bij het gebruik van werktuigen voor het mechanisch verwerken van lading in een ruim, is de kapitein verplicht
      ervoor zorg te dragen dat zodanige maatregelen worden getroffen dat de veiligheid en de gezondheid van de in het
      ruim aanwezige personen zoveel doenlijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: '154.3'
    text: |-
      De kapitein van een schip dat gevaarlijke stoffen als bedoeld in [artikel 130 van dit besluit][ref1]
      vervoert, is verplicht zich voor het ondernemen van een reis ervan te vergewissen, dat de in
      [artikel 4, vijfde lid, van bijlage XVII van dit besluit][ref2] bedoelde speciale lijst of gedetailleerd stuwplan
      aan boord is.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
  - number: '154.4'
    text: |-
      De kapitein van een schip dat wordt gebezigd voor het vervoer in bulk van vloeibare of gasvormige gevaarlijke
      stoffen, mag geen passagiers vervoeren en is voorts verplicht de ter zake geldende bedieningsvoorschriften en
      veiligheidsmaatregelen in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: '154.5'
    text: |-
      De kapitein van een schip dat is bestemd voor het afwisselend vervoer van olie en stortladingen is, tenzij de
      inrichting en de getroffen voorzieningen van zulk een schip ten genoegen van het Hoofd van de Scheepvaartinspectie
      zijn, verplicht zorg te dragen dat geen vaste stortladingen worden vervoerd wanneer niet alle ladingtanks,
      sloptanks daaronder begrepen, vrij van olie zijn en gasvrij zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: '154.6'
    text: |-
      De kapitein van een tankschip dat is voorzien van een vast aangebracht inertgassysteem ter bescherming
      van de ladingtanks, is verplicht zorg te dragen dat bij overschrijding van het zuurstofgehalte van het
      inertgas van 8 percent, gemeten in de hoofdtoevoerleiding voor inertgas aan de afvoerzijde van de inertgas
      ventilatoren, onmiddellijk maatregelen worden genomen welke kunnen leiden tot het verbeteren van de
      kwaliteit van het inertgas. Tenzij de kwaliteit van het gas verbetert, is hij verplicht zorg te dragen dat
      alle handelingen met betrekking tot de ladingtanks worden opgeschort alsmede dat de afsluiter, bedoeld in
      [artikel 62, lid 10.8, van bijlage IV van dit besluit][ref1], wordt gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '154.7'
    text: |-
      De kapitein van een tankschip dat is gebouwd op of na 1 september 1984, is verplicht werkzaamheden in verband met
      het gasvrij maken van ladingtanks zodanig uit te voeren dat:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: 154.7.a
    text: |-
      indien het schip is voorzien van een inertgassysteem, gassen uit de ladingtanks worden uitgedreven door middel van
      de voorzieningen, voorgeschreven in [artikel 62, lid 13, van bijlage IV van dit besluit][ref1], tot de concentratie
      van koolwaterstoffen in de tanks is gereduceerd tot minder dan 2 volumepercenten, alvorens ontluchting dan wel het
      uitdrijven van gassen ter hoogte van het ladingtankdek plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 154.7.b
    text: |-
      indien het schip niet is voorzien van een inertgassysteem, brandbare dampmengsels om te beginnen worden
      uitgedreven:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: 154.7.b.(i)
    text: |-
      door middel van de uitlaten voor ontluchting, voorgeschreven in
      [artikel 59, lid 1.9, van bijlage IV van dit besluit][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 154.7.b.(ii)
    text: |-
      door middel van uitlaten voor ontluchting welke voldoen aan het bepaalde in
      [artikel 59, lid 2.2.3, van bijlage IV van dit besluit][ref1]; of;


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 154.7.b.(iii)
    text: |-
      indien het schip gebouwd is op of na 1 februari 1992, door middel van uitlaten voor ontluchting, welke voldoen aan
      het bepaalde in [artikel 59, lid 2.2.2., van bijlage IV van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: '154.8'
    text: |-
      De kapitein van een tankschip dat is gebouwd vóór 1 september 1984 is verplicht werkzaamheden in verband met het
      gasvrij maken van ladingtanks uit te voeren in overeenstemming met voor het Hoofd van de Scheepvaartinspectie
      aanvaardbare procedures.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel154
  - number: '155'
    text: |-
      De kapitein is verplicht zorg te dragen dat ten aanzien van noodalarmering en noodseinen de volgende regelen in
      acht worden genomen:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel155
  - number: 155.a
    text: slechts hij is bevoegd bevel te geven tot het gebruik van noodalarmering of noodseinen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel155
  - number: 155.b
    text: |-
      de noodalarmering en de daarop volgende uitzending van nood-, spoed- en veiligheidsberichten, alsmede het annuleren
      van deze berichten moeten geschieden op de wijze als aangegeven in het Radioreglement; en
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel155
  - number: 155.c
    text: |-
      het gebruik van enige noodalarmering of van enig noodsein anders dan om aan te geven dat een schip, luchtvaartuig
      of persoon in ernstig en dreigend gevaar verkeert en onmiddellijk hulp nodig heeft, evenals het gebruik van enige
      alarmering of enig sein dat met de noodalarmering of een noodsein kan worden verward, is verboden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel155
  - number: '156.1'
    text: |-
      De kapitein van een zich op zee bevindend schip is verplicht, wanneer hij een melding, uit welke bron ook, ontvangt
      dat een schip of een vliegtuig of reddingmiddelen daarvan afkomstig, in nood is of zijn, met de meeste spoed de in
      nood verkerende personen te hulp te komen, hen zo mogelijk daaromtrent inlichtende. Indien hij niet in staat is of
      het, gezien de bijzondere omstandigheden van het geval, onredelijk of onnodig acht hen te hulp te komen, moet hij
      in het scheepsdagboek vermelden om welke reden hij de in nood verkerende personen niet te hulp is gekomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel156
  - number: '156.2'
    text: |-
      De kapitein van een in nood verkerend schip heeft het recht, na voorzover dat mogelijk is de kapiteins van de
      schepen, die zijn oproep om hulp hebben beantwoord, te hebben geraadpleegd, één of meer van deze schepen, die
      hij het beste in staat acht hulp te verlenen, daartoe op te vorderen en het is de plicht van de kapitein van een
      opgevorderd schip daaraan te voldoen door met de meeste spoed het te hulp komen van de in nood verkerende personen
      voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel156
  - number: '156.3'
    text: |-
      De kapitein van een schip is ontheven van de ingevolge het bepaalde in het eerste lid van dit artikel op hem
      rustende verplichting wanneer hij verneemt, dat één of meer schepen, doch niet het zijne, is of zijn opgevorderd en
      daaraan gevolg geeft of geven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel156
  - number: '156.4'
    text: |-
      De kapitein van een schip is ontheven van de ingevolge het bepaalde in het eerste lid van dit artikel op hem
      rustende verplichting en, indien zijn schip is opgevorderd, van de ingevolge het bepaalde in het tweede lid van dit
      artikel op hem rustende verplichting, indien hem door de in nood verkerende personen of door de kapitein van een
      ander schip, dat deze personen heeft bereikt, wordt medegedeeld dat hulpverlening niet langer nodig is.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel156
  - number: '157.1'
    text: |-
      De kapitein is verplicht, indien hij gevaarlijk ijs, een gevaarlijk wrak of een ander onmiddellijk gevaar voor
      de scheepvaart, of een tropische storm ontmoet, of luchttemperaturen onder het vriespunt gepaard gaande met
      stormwinden, die zware ijsafzetting op de bovenbouw veroorzaken, of stormen met windkracht 10 of hoger volgens
      de schaal van Beaufort, waarvoor geen stormwaarschuwing werd ontvangen, ondervindt, met alle hem ter beschikking
      staande middelen schepen in de omgeving en via het eerste punt aan de wal, waarmede hij verbinding kan krijgen ook
      de bevoegde autoriteiten, daarvan op de hoogte te brengen. De vorm waarin de inlichtingen worden gegeven, is niet
      bindend voorgeschreven. Zij mogen worden uitgezonden hetzij in verstaanbare taal – bij voorkeur Engels –, hetzij
      in code met gebruikmaking van het Internationaal Seinboek. Zij moeten worden uitgezonden aan alle in de omgeving
      zijnde schepen en voorts worden verzonden aan het eerste punt aan de wal, waarmede verbinding kan worden gemaakt,
      met verzoek voor overbrenging aan de bevoegde autoriteiten zorg te dragen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: '157.2'
    text: 'Berichten omtrent gevaren moeten de volgende inlichtingen bevatten:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.a
    text: 'IJs, wrakken en andere onmiddellijke gevaren voor de scheepvaart:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.a.(i)
    text: de soort van het waargenomen ijs, wrak of gevaar;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.a.(ii)
    text: de plaats van het ijs, wrak of gevaar toen dit het laatst werd waargenomen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.a.(iii)
    text: de datum en tijd (Gecoördineerde Wereldtijd-UTC) van de laatste waarneming.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b
    text: |-
      Tropische stormen (orkanen in West-Indië, tyfonen in de Chinese Zee, cyclonen in de Indische Oceaan en stormen van
      soortgelijk karakter in andere streken):
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(i)
    text: |-
      een mededeling, dat een tropische storm werd ontmoet. Deze verplichting dient ruim te worden opgevat en
      inlichtingen moeten worden verzonden telkens als de kapitein goede redenen heeft om aan te nemen dat een tropische
      storm zich ontwikkelt of in zijn nabijheid bestaat;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(ii)
    text: datum, tijd (Gecoördineerde Wereldtijd-UTC) en bestek van het schip op het moment van de waarneming;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii)
    text: 'in het bericht moeten zoveel mogelijk inlichtingen over het navolgende worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(aa)
    text: |-
      barometerstand, bij voorkeur gecorrigeerd (met vermelding of de aflezing in millibaren, inches of millimeters is en
      of de aflezing al dan niet is gecorrigeerd);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(bb)
    text: tendens van de luchtdruk (verandering in de barometerstand gedurende de afgelopen drie uren);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(cc)
    text: ware windrichting;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(dd)
    text: windkracht (volgens de schaal van Beaufort);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(ee)
    text: toestand van de zee (vlak, kabbelend tot lichtgolvend, golvend, aanschietend, hoog);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(ff)
    text: |-
      deining (laag, matig hoog, hoog) en de ware richting van waar deze komt. Opgave van periode of lengte van de
      deining (kort, matig lang, lang) kan ook van belang zijn;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.b.(iii).(gg)
    text: ware koers en vaart van het schip.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.c
    text: |-
      Latere waarnemingen. Wanneer de kapitein een tropische storm of andere gevaarlijke storm heeft gerapporteerd, is
      het gewenst, hoewel niet verplicht, dat zolang het schip onder invloed van de storm blijft, verdere waarnemingen
      om het uur worden verricht en verzonden en dat, wanneer dit niet mogelijk is, deze waarnemingen in elk geval met
      tussenpozen van niet langer dan drie uur worden verricht en verzonden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.d
    text: |-
      Stormen met windkracht 10 of hoger volgens de schaal van Beaufort, waarvoor geen stormwaarschuwing werd ontvangen.
      Hiermede worden bedoeld andere stormen dan de tropische stormen genoemd onder b van dit lid. Bij het ontmoeten van
      zulk een storm dient het te verzenden bericht gegevens te bevatten overeenkomstig die, vermeld onder b van dit lid,
      evenwel met uitzondering van de bijzonderheden betreffende zee en deining.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.e
    text: |-
      Luchttemperaturen onder het vriespunt gepaard gaande met stormwinden, die zware ijsafzetting op de bovenbouw
      veroorzaken:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.e.(i)
    text: datum en tijd (Gecoördineerde Wereldtijd-UTC);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.e.(ii)
    text: temperatuur van de lucht;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.e.(iii)
    text: temperatuur van het zeewater (indien mogelijk);
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: 157.2.e.(iv)
    text: kracht en richting van de wind.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel157
  - number: '158.1'
    text: |-
      Voor de toepassing van het bepaalde in dit artikel wordt onder routeringssysteem verstaan: elk systeem bestaande
      uit één of meer routes en/of routeringsmaatregelen, gericht op het verminderen van gevaar voor scheepsongevallen;
      het omvat verkeersscheidingsstelsels, vaarwegen voor tweerichtingsverkeer, aanbevolen koerslijnen, gebieden die
      dienen te worden gemeden, zones voor kustverkeer, rotondes, voorzorgsgebieden en diepwaterroutes.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158
  - number: '158.2'
    text: |-
      De kapitein is verplicht een passend gebruik te maken van de verkeersscheidingsstelsels als bedoeld in Voorschrift
      10 van het besluit «Bepalingen ter voorkoming van aanvaringen op zee, 1972» (Stb. 773) en daarbij in het bijzonder
      de gedragsregels ten aanzien van het gebruik van deze verkeersscheidingsstelsels, vervat in genoemd Voorschrift, na
      te komen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158
  - number: '158.3'
    text: |-
      De kapitein is voorts verplicht een passend gebruik te maken van de overige routeringssystemen die door de
      Internationale Maritieme Organisatie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158
  - number: 158.4.a
    text: |-
      De kapitein van elk schip dat vaart in de buurt van de Grote Banken van Newfoundland, dient, voorzover dit
      uitvoerbaar is, de visgronden van Newfoundland benoorden 43° noorderbreedte te mijden en te varen buiten de
      gebieden waarvan bekend is of verondersteld wordt dat zij ten gevolge van ijs gevaarlijk zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158
  - number: 158.4.b
    text: |-
      Indien ijs is gemeld op of nabij de koerslijn van zijn schip, is de kapitein verplicht des nachts een matige vaart
      te lopen of zijn koers zodanig te veranderen dat deze goed vrij van het gevaarlijke gebied loopt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158
  - number: 158a
    text: |-
      De kapitein van een schip is verplicht te voldoen aan de bij ministeriële regeling gestelde voorschriften inzake
      meldingssystemen, vastgesteld overeenkomstig richtlijnen en criteria van de Internationale Maritieme Organisatie,
      en aan de bevoegde lokale autoriteit alle informatie te verstrekken die in overeenstemming met de voorschriften van
      een dergelijk systeem wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel158a
  - number: '159'
    text: |-
      De kapitein van een schip, binnengekomen in een haven in Nederland, de Nederlandse Antillen of Aruba, is verplicht
      zo spoedig mogelijk, doch in elk geval binnen drie werkdagen na binnenkomst aan de Scheepvaartinspectie kennis
      te geven van op de afgelopen reis voorgekomen averijen en ongevallen. Het overleggen der dagboeken, onder
      schriftelijke verwijzing naar de aantekening omtrent de averij of het ongeval, wordt als zodanige kennisgeving
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel159
  - number: '160.1'
    text: |-
      Behoudens hetgeen bij of krachtens de bepalingen van het voor Nederland, de Nederlandse Antillen, onderscheidenlijk
      Aruba geldende [Wetboek van Koophandel][ref1] ten aanzien van het houden van scheeps- en machinedagboeken is
      voorgeschreven, is de kapitein verplicht in deze dagboeken aantekening te doen houden:


      [ref1]: https://wetten.overheid.nl/BWBR0001838
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0001838
  - number: 160.1.a
    text: van de diepgang van het schip, telkenmale na het innemen van lading en van brandstoffen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.b
    text: |-
      van het periodiek te water laten van reddingboten, hulpverleningsboten en reddingvlotten van het strijkbare type,
      alsmede van de toestand waarin deze reddingmiddelen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.c
    text: |-
      van de maandelijkse inspectie van de reddingmiddelen en de reddingbootuitrusting, alsmede van de toestand waarin de
      uitrusting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.d
    text: van de beproeving der brandslangen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.e
    text: |-
      van de controles en beproevingen als bedoeld in [het eerste lid van artikel 144 van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel144
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '144'
        hoofdstuk: X
  - number: 160.1.f.1°
    text: |-
      van de regelmatig, gedurende de reis, te nemen peilingen, bedoeld in
      [artikel 135a, eerste lid, van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel135a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 135a
        hoofdstuk: X
  - number: 160.1.f.2°
    text: |-
      van de viermaandelijkse controle, bedoeld in [artikel 135a, tweede lid, van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel135a
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 135a
        hoofdstuk: X
  - number: 160.1.g
    text: |-
      van alle appèls, oefeningen «schip verlaten», oefeningen in het blussen van brand, oefeningen met de
      hulpverleningsboten, opleiding en instructie in het gebruik van de reddingmiddelen en oefeningen met reddingvlotten
      van het strijkbare type, alsmede, wanneer deze niet op de voorgeschreven tijden zijn gehouden, van de redenen
      waarom dit niet is geschied.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.h
    text: |-
      in voorkomende gevallen, van de redenen waarom hij, na het waarnemen of het ontvangen van een noodsein, heeft
      nagelaten de in nood verkerende personen te hulp te komen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.i
    text: |-
      aan boord van een passagiersschip, van de tijdstippen van openen en sluiten van waterdichte deuren, patrijspoorten,
      toegangs-, laad- en kolenpoorten en andere openingen in het scheepsboord, dan wel het afnemen en aanbrengen van
      wegneembare platen, die volgens het bepaalde in [artikel 141 van dit besluit][ref1] moeten zijn gesloten dan wel
      aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel141
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '141'
        hoofdstuk: X
  - number: 160.1.j
    text: |-
      aan boord van een passagiersschip, van alle oefeningen in het behandelen en alle inspecties van waterdichte deuren,
      patrijspoorten, kleppen en afsluiters en van de daarbij te voorschijn gekomen gebreken;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.k
    text: |-
      aan boord van een passagiersschip dat gevaarlijke stoffen als bedoeld in [artikel 130 van dit besluit][ref1]
      vervoert, van al hetgeen bij het laden, gedurende de reis en bij het lossen is gedaan om ongevallen als gevolg van
      de aanwezigheid van deze stoffen te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
        hoofdstuk: IX
  - number: 160.1.l
    text: |-
      aan boord van een schip, dat een deklast hout vervoert, van de hoogte van de deklast en van de peilingen van de
      ballasttanks bij het begin van en gedurende de reis;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.m
    text: |-
      aan boord van een schip voorzien van een noodkrachtbron, van een tijdelijke noodkrachtbron en van automatische
      inrichtingen van de noodinstallatie, van de beproevingen daarvan;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.n
    text: aan boord van een schip voorzien van elektrische noodverlichting, van de beproeving daarvan;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.o
    text: |-
      van de controles en beproevingen als bedoeld in [het eerste lid, onder d, van artikel 140 van dit besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel140
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '140'
        hoofdstuk: X
  - number: 160.1.p.1°
    text: van de persoon aangewezen voor afhandeling van de radioberichtgeving tijdens noodgevallen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.2°
    text: |-
      van het tijdstip, waarop bij het verlaten van de haven, de radiowacht begint en het tijdstip, waarop bij het
      binnenlopen van de haven, die wacht wordt beëindigd;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.3°
    text: van de gegevens betreffende controle, onderhoud en het laden van de accumulatorbatterijen;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.4°
    text: wekelijks van de bijzonderheden omtrent het beproeven van de verplicht aanwezige draagbare VHF radio-installaties;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.5°
    text: |-
      wekelijks van de bijzonderheden omtrent het beproeven van de eventueel aanwezige vast aangebrachte VHF radio-
      installaties in reddingboten;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.6°
    text: |-
      maandelijks van de bijzonderheden omtrent het beproeven van het verplicht aanwezige satellietnoodradiobaken en
      de radartransponders;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.7°
    text: van bijzonderheden omtrent de radiorichtingzoeker;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.8°
    text: van de berichtenwisseling met betrekking tot het nood-, spoed- en veiligheidsverkeer in samengevatte vorm;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: 160.1.p.9°
    text: van alle afwijkingen in de goede werking van de radio-installaties.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: '160.2'
    text: |-
      De kapitein is verplicht zorg te dragen dat de wachtdoende stuurman en de wachtdoende scheepswerktuigkundige,
      alsmede de persoon belast met de radiowacht, het scheepsdagboek en het machinedagboek ook overigens op de juiste
      wijze bijhouden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: '160.3'
    text: |-
      De kapitein is verplicht de laatste data van inspecties, appèls en oefeningen als bedoeld in het eerste lid van dit
      artikel onder b, c, d, e, g, j, m, n en o bij het in gebruik nemen van een nieuw dagboek uit het vorige dagboek te
      doen overnemen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: '160.4'
    text: |-
      De kapitein van een schip binnengekomen in een haven in Nederland, de Nederlandse Antillen, of Aruba, is verplicht
      binnen drie dagen na binnenkomst en in ieder geval vóór het vertrek het scheepsdagboek aan de betrokken ambtenaar
      van de Scheepvaartinspectie ter inzage te zenden. Indien daartoe het verzoek wordt gedaan, moet het machinedagboek
      mede ter inzage worden gegeven. Blijft het schip langer dan één jaar buiten een haven als hierboven bedoeld,
      dan is de kapitein verplicht de scheepsdagboeken van de afgelopen reizen, telkenmale na verloop van ten hoogste
      één jaar, te zenden aan de Scheepvaartinspectie. Wordt het schip opgelegd in een haven buiten Nederland, de
      Nederlandse Antillen of Aruba, dan is de kapitein verplicht de scheepsdagboeken binnen acht dagen te zenden aan
      de Scheepvaartinspectie. Van de naleving van de in dit lid gegeven voorschriften kan de Scheepvaartinspectie
      vrijstelling verlenen, al dan niet onder bepaalde voorwaarden in verband met de korte duur van de reis of op grond
      van bijzondere omstandigheden. De kapitein ontvangt de ingezonden dagboeken zo spoedig mogelijk terug, voorzien
      van een gedagtekende en ondertekende verklaring, dat zij door een ambtenaar van de Scheepvaartinspectie zijn
      gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel160
  - number: '162'
    text: |-
      De kapitein draagt ervoor zorg dat de loodsladder schoon en in goede staat wordt gehouden en alleen wordt gebruikt
      voor het aan boord nemen of ontschepen van een loods, alsmede van havenautoriteiten bij aankomst in of vertrek uit
      een haven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel162
  - number: '163.1'
    text: 'De kapitein is verplicht zorg te dragen dat aan boord aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
  - number: 163.1.a
    text: |-
      de [Schepenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0001876
  - number: 163.1.b
    text: het Schepenbesluit 1965;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
  - number: 163.1.c
    text: de door het Hoofd van de Scheepvaartinspectie uitgegeven bekendmakingen aan de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
  - number: 163.1.d
    text: de van kracht zijnde bepalingen ter voorkoming van aanvaringen op zee.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
  - number: 163.2.a
    text: |-
      De kapitein van een schip dat verpakte gevaarlijke stoffen als bedoeld in [artikel 130d van dit besluit][ref1]
      als lading vervoert, is verplicht zorg te dragen dat het in [artikel 130e][ref2] vermelde «Handboek Gevaarlijke
      Stoffen», alsmede de in voornoemd Handboek vermelde «International Maritime Dangerous Goods Code», beide bijgewerkt
      in overeenstemming met de daarop verschenen aanvullingen, aan boord aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130d
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel130e
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 130d
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
        artikel: 130e
        hoofdstuk: IX
  - number: 163.2.b
    text: |-
      De kapitein van een schip dat gestorte ladingen als bedoeld in de [artikelen 128][ref1], [129][ref2],
      [130a][ref3] en [130b van dit besluit][ref4] vervoert, is verplicht zorg te dragen dat het in
      [artikel 130c van dit besluit ][ref5]vermelde «Handboek Gestorte Ladingen», bijgewerkt in overeenstemming met de
      daarop verschenen aanvullingen, aan boord aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel129
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel130a
      [ref4]: https://wetten.overheid.nl/BWBR0002501#Artikel130b
      [ref5]: https://wetten.overheid.nl/BWBR0002501#Artikel130c
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '128'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '129'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0002501
        artikel: 130a
        hoofdstuk: IX
      - id: ref4
        bwb_id: BWBR0002501
        artikel: 130b
        hoofdstuk: IX
      - id: ref5
        bwb_id: BWBR0002501
        artikel: 130c
        hoofdstuk: IX
  - number: '163.3'
    text: |-
      De kapitein van een tankschip is verplicht zorg te dragen dat een handboek aan boord aanwezig is, waarin de voor
      het betreffende schip geldende operationele veiligheids- en bedrijfsvoorschriften zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel163
  - number: '164.1'
    text: |-
      De eigenaar van een passagiersschip of van een schip van 500 ton of meer is verplicht een
      veiligheidsmanagementsysteem te ontwikkelen en toe te passen voor de bedrijfsvoering van de organisatie
      en van de schepen. Het veiligheidsmanagementsysteem dient te voldoen aan de eisen, gesteld in
      [bijlage VI bij dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002501
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002501
  - number: 164a
    text: |-
      De eigenaar is verplicht aan degene die een onderzoek verricht alle medewerking te verlenen die deze redelijkerwijs
      kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel164a
  - number: '165.1'
    text: |-
      De eigenaar van een schip is verplicht zorg te dragen dat de romp van het schip aan de buitenzijde wordt onderzocht
      overeenkomstig het bepaalde in [artikel 12, derde lid, derde volzin][ref1], [artikel 13, derde lid][ref2], en
      [artikel 14, vijfde lid, van dit besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel14
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '12'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '13'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002501
        artikel: '14'
        hoofdstuk: III
  - number: '165.2'
    text: |-
      Telkens indien van een schip de romp aan de buitenzijde zal worden onderzocht of indien aan het schip of aan de
      werktuigen of installaties herstellingen of wijzigingen zullen plaatshebben, wordt hiervan door of vanwege de
      eigenaar tijdig aan de Scheepvaartinspectie en aan het desbetreffende klassebureau kennis gegeven ten einde de
      Scheepvaartinspectie en het klassebureau in de gelegenheid te stellen hierbij toezicht te houden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel165
  - number: '166'
    text: |-
      De eigenaar van een schip is verplicht aan de kapitein de middelen te verschaffen, die deze, in verband met de
      uitvoering van de taak hem in dit besluit opgedragen, behoeft.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166
  - number: 166a.1
    text: |-
      De eigenaar van een passagiersschip zet een systeem op voor de registratie van passagiersgegevens, dat voldoet aan
      de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166a.1.a
    text: '*leesbaarheid:* de formattering van de gegevens moet zodanig zijn dat zij gemakkelijk leesbaar zijn;'
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166a.1.b
    text: |-
      *beschikbaarheid:* de vereiste gegevens moeten onmiddellijk beschikbaar zijn voor de aangewezen instanties waarvoor
      de in het systeem opgeslagen informatie van belang is;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166a.1.c
    text: |-
      *vlotte werking:* het systeem moet zo in elkaar zitten dat er geen onnodige vertraging ontstaat voor de passagiers
      die zich inschepen dan wel aan land gaan;
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166a.1.d
    text: |-
      *beveiliging:* de gegevens moeten voldoende beveiligd zijn tegen het per ongeluk of onwettig vernietigen of
      verloren gaan en tegen wijziging, bekendmaking of toegang door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166a.2
    text: |-
      Het systeem behoeft de goedkeuring van het Hoofd van de Scheepvaartinspectie. De eigenaar draagt ervoor zorg dat
      de voorgeschreven gegevens te allen tijde onmiddellijk beschikbaar zijn om aan de aangewezen instantie te worden
      doorgegeven voor opsporings- en reddingsoperaties in een noodgeval of na een ongeluk. De persoonsgegevens die zijn
      verzameld overeenkomstig [artikel 136b][ref1] en [166b][ref2] mogen niet langer worden bewaard dan noodzakelijk is
      in verband met opsporings- en reddingsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel136b
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel166b
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: 136b
        hoofdstuk: X
      - id: ref2
        bwb_id: BWBR0002501
        artikel: 166b
        hoofdstuk: XI
  - number: 166a.3
    text: De eigenaar van een passagiersschip stelt een passagiersregistratiebeambte aan.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166a
  - number: 166b
    text: |-
      De eigenaar van een passagiersschip draagt er zorg voor dat nadere gegevens over personen die hebben verklaard
      in noodsituaties speciale zorg of bijstand nodig te hebben, naar behoren worden geregistreerd en aan de kapitein
      worden doorgegeven voordat het passagiersschip vertrekt.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel166b
  - number: '167'
    text: |-
      Teneinde in het belang van de veiligheid van schepen en hun opvarenden in tijden van oorlog of oorlogsgevaar
      de oorlogsuitrusting van schepen op eenvoudige wijze te kunnen aanbrengen, moeten de constructie en inrichting
      van schepen van meer dan 300 ton ten aanzien van de plaatsing van de defensieve uitrusting, de bergplaatsen van
      de bijbehorende munitie, de kanonniersaccommodatie, alsmede de inrichting voor de demagnetisering, voldoen aan
      de eisen, daartoe door het Hoofd van de Scheepvaartinspectie, in overeenstemming met de Chef van de Marinestaf,
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel167
  - number: '168.1'
    text: |-
      De kapitein is verplicht de hem vanwege de Chef van de Marinestaf ter hand te stellen bescheiden te aanvaarden,
      daarvan kennis te nemen en de daarbij gegeven aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel168
  - number: '168.2'
    text: De kapitein is verplicht deze bescheiden op een doelmatige plaats te bewaren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel168
  - number: '169.1'
    text: |-
      In geval van oorlogsgevaar en gedurende een oorlog waarin het Koninkrijk der Nederlanden al of niet is betrokken,
      moet aan boord van alle schepen, daartoe aangewezen door het Hoofd van de Scheepvaartinspectie, in overeenstemming
      met de Chef van de Marinestaf, de vereiste oorlogsuitrusting worden aangebracht en in stand gehouden,
      overeenkomstig de daartoe door genoemd Hoofd, in overeenstemming met de Chef van de Marinestaf, gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel169
  - number: '169.2'
    text: |-
      De kapitein is verplicht de aanwijzingen op te volgen, die door het Hoofd van de Scheepvaartinspectie worden
      gegeven ter voorkoming van ongevallen, ten gevolge van na een oorlog nog aanwezige oorlogsgevaren.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel169
  - number: '170'
    text: |-
      In geval van oorlogsgevaar en gedurende een oorlog, waarin het Koninkrijk der Nederlanden al of niet is betrokken,
      moeten de kapiteins van alle schepen die door het Hoofd van de Scheepvaartinspectie, in overeenstemming met de
      Chef van de Marinestaf, daartoe zijn aangewezen, voldoen aan de verplichtingen ten aanzien van de veiligheid en de
      constructie, door genoemd Hoofd in overeenstemming met de Chef van de Marinestaf aan hen opgelegd.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel170
  - number: '171'
    text: |-
      De aanwijzingen en eisen, krachtens de [ artikelen 169][ref1] en [170 van dit besluit][ref2] gegeven en gesteld,
      treden na verloop van drie maanden buiten werking, tenzij zij inmiddels door Ons zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel169
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel170
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel171
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '169'
        hoofdstuk: XII
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '170'
        hoofdstuk: XII
  - number: '172'
    text: (vervallen)
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel172
  - number: '173.1'
    text: |-
      Indien één of meer bepalingen van dit besluit op het ogenblik dat een reis wordt ondernomen niet op een schip van
      toepassing zijn, zullen zij, indien en voorzover het schip ten gevolge van slecht weer of ten gevolge van een ander
      geval van overmacht is genoodzaakt van de voorgenomen reis af te wijken, niet op dit schip van toepassing worden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel173
  - number: '173.2'
    text: |-
      Bij de beoordeling van de vraag of een bepaling van dit besluit al dan niet op een schip van toepassing is,
      wordt met personen die zich daar aan boord bevinden ten gevolge van overmacht of ten gevolge van een wettelijke
      verplichting van de kapitein om hetzij schipbreukelingen, hetzij andere personen over te voeren, geen rekening
      gehouden.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel173
  - number: '174.1'
    text: |-
      In het belang van een goede uitvoering van dit besluit, kunnen door het Hoofd van de Scheepvaartinspectie nadere
      regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174
  - number: '174.2'
    text: |-
      Indien een voorziening of constructie ingevolge dit besluit of de bijbehorende bijlagen ten genoegen van het Hoofd
      van de Scheepvaartinspectie moet zijn, stelt deze geen verdergaande eisen dan:
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174
  - number: 174.2.a
    text: |-
      bij de ten tijde van de beslissing bestaande stand van de techniek algemeen gebruikelijk zijn, of, gelet op een
      rendabele exploitatie van het schip, redelijkerwijs gevergd kunnen worden, of
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174
  - number: 174.2.b
    text: met het oog op de veiligheid van het schip, de lading of de bemanning dringend noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174
  - number: '174.3'
    text: |-
      De ambtenaren als bedoeld in [artikel 10 van de Schepenwet][ref1], kunnen in elk bijzonder geval, rekening houdende
      met de terzake door het Hoofd van de Scheepvaartinspectie gegeven algemene aanwijzingen, voorschriften geven ter
      bevordering van de juiste naleving van het bepaalde in dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel10
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '10'
  - number: 174a.1
    text: |-
      Met inachtneming van de door de Internationale Maritieme Organisatie (IMO) aanvaarde aanbevelingen ter zake, kan
      Onze Minister met betrekking tot de constructie, inrichting en uitrusting van een schip dat is gebouwd of geschikt
      gemaakt en wordt gebezigd voor doeleinden van bijzondere aard, regelen stellen die afwijken van het bepaalde in dit
      besluit, mits zodanige regelen ten minste even doelmatig zijn.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174a
  - number: 174a.2
    text: |-
      Met inachtneming van de door de Internationale Maritieme Organisatie (IMO) aanvaarde aanbevelingen ter zake,
      kan Onze Minister nadere regelen stellen met betrekking tot installaties aan boord, welke samenhangen met de
      werkzaamheden van een schip dat is gebouwd of is geschikt gemaakt en wordt gebezigd voor doeleinden van bijzondere
      aard.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174a
  - number: 174b
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van een bindend besluit van de Raad van de Europese Unie, van
      het Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen regels worden
      gesteld met betrekking tot eisen die aan passagiersschepen in het kader van de veilige exploitatie van geregelde
      diensten worden gesteld en met betrekking tot onderzoeken waaraan passagiersschepen in het kader van de veilige
      exploitatie van geregelde diensten worden onderworpen. Deze eisen en onderzoeken kunnen mede betrekking hebben op
      de bedrijfsvoering over die schepen.
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel174b
  - number: '175'
    text: |-
      Overtreding van de [artikelen 136a][ref1], [136b][ref2], [139a][ref3], [140][ref4], [141][ref5], [142][ref6],
      [150, derde lid][ref7], [154][ref8], [158a][ref9], [160, vierde lid][ref10], [165][ref11], [166][ref12],
      [166a][ref13] en [166b][ref14] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel136a
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel136b
      [ref3]: https://wetten.overheid.nl/BWBR0002501#Artikel139a
      [ref4]: https://wetten.overheid.nl/BWBR0002501#Artikel140
      [ref5]: https://wetten.overheid.nl/BWBR0002501#Artikel141
      [ref6]: https://wetten.overheid.nl/BWBR0002501#Artikel142
      [ref7]: https://wetten.overheid.nl/BWBR0002501#Artikel150
      [ref8]: https://wetten.overheid.nl/BWBR0002501#Artikel154
      [ref9]: https://wetten.overheid.nl/BWBR0002501#Artikel158a
      [ref10]: https://wetten.overheid.nl/BWBR0002501#Artikel160
      [ref11]: https://wetten.overheid.nl/BWBR0002501#Artikel165
      [ref12]: https://wetten.overheid.nl/BWBR0002501#Artikel166
      [ref13]: https://wetten.overheid.nl/BWBR0002501#Artikel166a
      [ref14]: https://wetten.overheid.nl/BWBR0002501#Artikel166b
    url: https://wetten.overheid.nl/BWBR0002501/2002-02-06#Artikel175
