        artikel: 8a.48
  - number: '2'
    text: |-
      1 De geluidbelasting L en de geluidbelasting L worden bepaald overeenkomstig bijlage II van de [Richtlijn 2002/49/
      EG](32002L0049) van het Europees parlement en de Raad van 25 juni 2002 inzake de evaluatie en beheersing van
      omgevingslawaai (PbEU 2002, L 189).

      2 De gezondheidseffecten van luchtvaartlawaai worden bepaald overeenkomstig de methode opgenomen in bijlage
      Bepalingsmethode gezondheidseffecten bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel2
  - number: '3'
    text: Een geluidbelastingkaart bestaat ten minste uit tabellen en uit een of meer geografische kaarten.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel3
  - number: '4'
    text: |-
      1 In de tabellen van een geluidbelastingkaart worden per geluidbelastingklasse ten minste aangegeven:

      a. het aantal woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen dat is blootgesteld aan een
      geluidsbelasting die gelijk is aan of groter dan:

      1º. 55, 60, 65, 70 en 75 dB L;

      2º. 50, 55, 60, 65 en 70 dB L;

      b. het aantal bewoners van de onder a bedoelde woningen;

      c. indien beschikbaar een opgave van het aantal woningen en geluidgevoelige gebouwen uit hoofde van de wet dat is
      voorzien van extra geluidwering.

      2 Voor de toepassing van het eerste lid, onder b, wordt het aantal bewoners van woningen bepaald overeenkomstig de
      gemiddelde huishoudensgrootte volgens de meest recente publicatie van het Centraal Bureau voor de Statistiek.

      3 De aantallen, bedoeld in het eerste lid, onder a en b, worden afgerond op honderdtallen.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel4
  - number: '5'
    text: |-
      1 Op de geografische kaarten van een geluidbelastingkaart staan duidelijk aangegeven:

      a. de ligging van de luchthaven met het banenstelsel;

      b. de geluidscontouren van 55, 60, 65, 70 en 75 dB L;

      c. de geluidscontouren van 50, 55, 60, 65 en 70 dB L;

      d. de ligging van eventuele geluidgevoelige terreinen.

      2 De schaal van de geografische kaarten bedraagt 1: 50.000.

      3 De geografische kaarten bevatten een legenda waarin wordt verklaard hoe de informatie, bedoeld in het eerste lid,
      is weergegeven.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel5
  - number: '6'
    text: |-
      Aan een verzoek om verstrekking van inlichtingen en gegevens als bedoeld in
      [artikel 8a.46, eerste lid, van de wet][ref1], wordt voldaan binnen 3 maanden na de dag waarop het verzoek is
      ontvangen, of, indien de gevraagde inlichtingen en gegevens nog niet beschikbaar zijn, onverwijld nadat deze
      beschikbaar zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.46
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a.46
  - number: '7'
    text: |-
      1 Een actieplan bevat ten minste:

      a. een beschrijving van het wettelijke kader met betrekking tot geluidbelasting;

      b. een samenvatting van de gegevens die zijn vervat in de geluidbelastingkaart of geluidbelastingkaarten waarop het
      actieplan berust;

      c. een beschrijving van de wijze waarop aan eenieder de gelegenheid is geboden om zienswijzen over het ontwerp van
      het actieplan naar voren te brengen;

      d. een inhoudelijke reactie op de onder c bedoelde zienswijzen;

      e. een overzicht van belangrijke infrastructurele werken die zijn voorgenomen in de planperiode;

      f. een overzicht van bestaande en in voorbereiding of uitvoering zijnde bron- en overdrachtsmaatregelen met
      betrekking tot de betrokken geluidsbron of geluidsbronnen;

      g. voor zover beschikbaar en openbaar, financiële informatie met betrekking tot de voorgenomen maatregelen;

      h. een evaluatie van de uitvoering en de resultaten van het vorige actieplan.

      2 Een actieplan bevat voorts een beknopte samenvatting van de in het eerste lid bedoelde aspecten.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel7
  - number: '8'
    text: |-
      1 Een actieplan bevat een beschrijving van het beleid voor de eerstkomende vijf jaren en, voor zover dit
      redelijkerwijs is aan te geven, voor de vijf jaren daarna, om de geluidbelasting vanwege luchtvaartlawaai te
      beperken.

      2 In de beschrijving van het beleid wordt in elk geval aandacht besteed aan de situaties waarin de grenswaarden
      voor geluid opgenomen in het [Luchthavenverkeerbesluit Schiphol][ref1] zijn overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0014330
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014330
  - number: '9'
    text: |-
      1 In een actieplan wordt een plandrempel aangegeven, zijnde een daarbij aangegeven geluidbelasting L en
      geluidsbelasting L, vanwege vliegtuiglawaai.

      2 In het actieplan wordt in elk geval aangegeven welke maatregelen worden overwogen of in uitvoering zijn om te
      voorkomen of ongedaan te maken dat de plandrempel wordt overschreden.

      3 Het actieplan geeft tevens de planning en de te verwachten effecten van de maatregelen aan.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling omgevingslawaai luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel11
