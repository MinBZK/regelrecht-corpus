  - number: 1a
    text: |-
      Deze regeling berust op de [artikelen 8a.45, vijfde lid][ref1], [8a.46, tweede lid][ref2], en
      [8a.48, vierde lid van de Wet luchtvaart][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.45
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.46
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.48
    url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#Artikel1a
    references:
