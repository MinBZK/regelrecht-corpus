  text: |-
    Gelet op richtlijn nr. 2002/24/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
    inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) en de artikelen 8.30a, vierde lid, 8.30b,
    tweede lid, en 8.30d, vierde lid, van de Wet luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020592/2022-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *actieplan:* actieplan dat is vastgesteld op basis van [artikel 8a.48, eerste lid, van de wet][ref1];
        - *geluidbelasting L:* geluidbelasting L als bedoeld in [artikel 8a.45, derde lid, van de wet][ref2];
        - *geluidbelasting L:* geluidbelasting L als bedoeld in [artikel 8a.45, derde lid, van de wet][ref3];
        - *geluidbelastingkaart:* geluidbelastingkaart die is vastgesteld op basis van
      [artikel 8a.45, eerste en tweede lid, van de wet][ref4], en
        - *wet:* [Wet luchtvaart][ref5].


