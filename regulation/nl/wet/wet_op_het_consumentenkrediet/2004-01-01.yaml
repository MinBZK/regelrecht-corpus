  - number: '69'
    text: |-
      Overtreding van voorschriften, gesteld bij of krachtens de [artikelen 26][ref1], [34][ref2], [36][ref3] en
      [38][ref4] is slechts strafbaar voor zover deze van toepassing zijn op een leverancier of een kredietbemiddelaar,
      alsmede, indien het het bij of krachtens [artikel 26][ref5] bepaalde betreft, op een kredietgever die niet beschikt
      over een vergunning als bedoeld in [artikel 9][ref6].


