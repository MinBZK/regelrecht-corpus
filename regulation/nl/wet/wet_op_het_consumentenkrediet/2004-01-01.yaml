  - number: '71'
    text: |-
      De vijfde titel A van [Boek 7A van het Burgerlijk Wetboek][ref1] geldt niet voor overeenkomsten als bedoeld in
      [artikel 30, eerste lid][ref2], die ingevolge [artikel 1576 van Boek 7A van het Burgerlijk Wetboek][ref3] als
      koop en verkoop op afbetaling moeten worden aangemerkt, met uitzondering evenwel van de [artikelen 1576a][ref4],
      [1576h][ref5], [1576k tot en met 1576n][ref6], [1576r][ref7], [1576u][ref8], [1576w][ref9] en [1576x][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0006000
