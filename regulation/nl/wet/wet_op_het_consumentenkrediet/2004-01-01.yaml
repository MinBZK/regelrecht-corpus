  - number: '75.3'
    text: |-
      De [artikelen 30 tot en met 32][ref1], [33, onder ][ref2], [34][ref3], [36][ref4], voor zover het betreft
      het bedingen van een niet variabele kredietvergoeding, [37][ref5], [40 tot en met 42][ref6], [43][ref7],
      [44, eerste lid][ref8], [45][ref9] en [46][ref10] gelden niet voor overeenkomsten met een bepaalde looptijd, welke
      zijn aangegaan voor het tijdstip van in werking treden van deze wet, en ten aanzien van voor dat tijdstip aangegane
      overeenkomsten met een onbepaalde looptijd eerst met ingang van de dag, liggende drie jaar na dat tijdstip.


