---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_consumentenkrediet
regulatory_layer: WET
publication_date: '2016-10-14'
valid_from: '2004-01-01'
bwb_id: BWBR0004815
url: https://wetten.overheid.nl/BWBR0004815/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te geven met betrekking tot het
    consumentenkrediet, mede ter vervanging van de bepalingen van de Wet op het consumptief geldkrediet (Stb. 1972,
    399) en de Wet op het afbetalingsstelsel 1961 (Stb. 1976, 515) en, in verband daarmee, de Colportagewet (Stb.
    1973, 438) te wijzigen en voorts, dat de richtlijn (EEG) nr. 87/102 van de Raad van de Europese Gemeenschappen, van
    22 december 1986, betreffende de harmonisatie van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten
    inzake het consumentenkrediet (PbEG L 42), noodzaakt tot het vaststellen van een aantal wettelijke bepalingen met
    betrekking tot het consumentenkrediet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.a
    text: '*krediettransactie:* iedere overeenkomst en ieder samenstel van overeenkomsten met de strekking dat:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.a.1°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer) een geldsom ter
      beschikking wordt gesteld en de tweede partij aan de eerste partij een of meer betalingen doet,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.a.2°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer) het genot van een
      roerende zaak wordt verschaft of een bij algemene maatregel van bestuur aangewezen dienst wordt verleend en de
      tweede partij aan de eerste partij een of meer betalingen doet, of
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.a.3°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer), dan wel ten behoeve van
      deze aan een derde partij (de leverancier) een geldsom ter beschikking wordt gesteld ter zake van het verschaffen
      van het genot van een roerende zaak of het verlenen van een bij algemene maatregel van bestuur aangewezen dienst
      aan de tweede partij, en de tweede partij aan de eerste partij of aan de derde partij een of meer betalingen doet,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.b
    text: '*krediet verlenen:* het als kredietgever deelnemen aan een krediettransactie;'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.c
    text: |-
      *kredietbemiddeling:* alle bedrijfs- of beroepsmatige verrichtingen en bemoeiingen, gericht op het tot stand
      brengen van een krediettransactie, van iemand (de kredietbemiddelaar) die geen partij is bij die transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.d
    text: '*geldkrediet:* een krediettransactie als bedoeld onder *a*, 1°;'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.e
    text: '*goederenkrediet:* een krediettransactie als bedoeld onder *a*, 2° of 3°;'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.f
    text: |-
      *doorlopend geldkrediet:* een geldkrediet, waarbij de kredietnemer op verschillende tijdstippen geldsommen bij de
      kredietgever kan opnemen, voor zover het uitstaand saldo een bepaald bedrag (de kredietlimiet) niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.g
    text: |-
      *doorlopend goederenkrediet:* een goederenkrediet, waarbij de kredietgever dan wel de leverancier ervoor heeft te
      zorgen, dat aan de kredietnemer op verschillende tijdstippen het genot van zaken wordt verschaft of diensten worden
      verleend, voor zover het uitstaand saldo een bepaald bedrag (de kredietlimiet) niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.h
    text: |-
      *uitstaand saldo bij geldkrediet:* het op enig tijdstip bestaande totaal van de tot en met dat tijdstip door
      de kredietnemer opgenomen geldsommen, vermeerderd met de tot en met dat tijdstip aan deze in rekening gebrachte
      kredietvergoeding en verminderd met de door deze tot en met dat tijdstip gedane betalingen;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.i
    text: |-
      *uitstaand saldo bij goederenkrediet:* het op enig tijdstip bestaande totaal van de contantprijzen van de
      zaken onderscheidenlijk diensten, waarvan aan de kredietnemer tot en met dat tijdstip het genot is verschaft,
      onderscheidenlijk welke aan de kredietnemer zijn verleend, vermeerderd met het totaalbedrag van de in dat kader tot
      en met dat tijdstip aan de kredietnemer in rekening gebrachte kredietvergoeding en verminderd met het totaalbedrag
      van de in dat kader tot en met dat tijdstip door de kredietnemer gedane betalingen;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.j
    text: |-
      *kredietvergoeding:* alle beloningen en vergoedingen, in welke vorm ook, die de kredietgever of de leverancier
      ter zake van een krediettransactie bedingt, in rekening brengt of aanvaardt, bij goederenkrediet verminderd met
      het totaal van de contantprijzen van de zaken onderscheidenlijk diensten, waarvan de kredietnemer het genot wordt
      verschaft onderscheidenlijk welke aan de kredietnemer worden verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.k
    text: |-
      *effectief kredietvergoedingspercentage op jaarbasis:* de bij afwikkeling van een krediettransactie overeenkomstig
      de betalingsregeling aan de kredietnemer in rekening te brengen kredietvergoeding, uitgedrukt in een percentage op
      jaarbasis van het uitstaand saldo;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.l
    text: |-
      *kredietsom bij geldkrediet:* de geldsom die de kredietnemer in het kader van een geldkrediet ter beschikking wordt
      gesteld, met dien verstande, dat bij doorlopend geldkrediet de kredietlimiet als die geldsom wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.m
    text: |-
      *kredietsom bij goederenkrediet:* het verschil tussen het totaal van de contantprijzen van de zaken
      onderscheidenlijk diensten, waarvan de kredietnemer het genot wordt verschaft, onderscheidenlijk welke aan de
      kredietnemer worden verleend, en de door deze in dat kader gedane contante betalingen, met dien verstande, dat bij
      doorlopend goederenkrediet de kredietlimiet als dat verschil wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.n
    text: '*gemeentelijke kredietbank:* een instelling voor kredietverlening, opgericht door een of meer gemeenten;'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.o
    text: '*Onze Minister:* Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: 1.p
    text: |-
      *richtlijn:* [richtlijn (EEG) nr. 87/102](31987L0102) van de Raad van de Europese Gemeenschappen, van 22 december
      1986, betreffende de harmonisatie van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten inzake het
      consumentenkrediet (*PbEG* L 42).
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel1
  - number: '2'
    text: |-
      Deze wet geldt slechts voor krediettransacties, waaraan de kredietgever en, in voorkomend geval, de leverancier,
      deelnemen in de uitoefening van een bedrijf of beroep en waarbij de kredietnemer een natuurlijke persoon is.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel2
  - number: '3.1'
    text: Deze wet geldt niet voor krediettransacties, waarbij de kredietsom meer dan € 40 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel3
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid geldt het bepaalde bij of krachtens [artikel 26][ref1] mede ten aanzien van
      krediettransacties waarbij de kredietsom meer dan veertigduizend euro bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel26
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '26'
        hoofdstuk: III
  - number: '3.3'
    text: |-
      Het in het eerste en tweede lid genoemde bedrag kan bij algemene maatregel van bestuur in verband met
      geldontwaarding, dan wel in verband met een herziening van de in de richtlijn genoemde bedragen ingevolge artikel
      13, tweede lid, van de richtlijn, worden gewijzigd. Een zodanige maatregel kan niet eerder dan twee jaar na het
      tijdstip van in werking treden van deze wet worden vastgesteld en vervolgens niet eerder dan twee jaar na het
      vaststellen van de vorige maatregel. Het nieuw vast te stellen bedrag kan slechts € 2 500 of een veelvoud daarvan
      afwijken van het voordien geldende bedrag, tenzij de wijziging verband houdt met een herziening als bedoeld in
      artikel 13, tweede lid, van de richtlijn. Een aldus bij algemene maatregel van bestuur vastgesteld bedrag treedt in
      de plaats van het in het eerste en tweede lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel3
  - number: '4.1'
    text: 'Deze wet geldt voorts niet voor krediettransacties:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.a
    text: |-
      waarbij het effectieve kredietvergoedingspercentage op jaarbasis, berekend op door Onze Minister aan te geven
      wijze, op het tijdstip van aangaan van de transactie niet meer bedraagt dan de wettelijke rente, zoals vastgesteld
      bij de algemene maatregel van bestuur, bedoeld in [artikel 120 van Boek 6 van het Burgerlijk Wetboek][ref1], mits
      geen openbaar aanbod wordt gedaan tot het deelnemen aan die transacties;


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
  - number: 4.1.b
    text: |-
      betreffende zaken, die naar hun aard uitsluitend in de uitoefening van een bedrijf of van een zelfstandig
      uitgeoefend beroep plegen te worden gebruikt of verbruikt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.c
    text: |-
      waaraan als kredietnemer deelneemt een ondernemer, die de betrokken zaken in de uitoefening van een bedrijf
      wederverkoopt;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.d
    text: |-
      waaraan als kredietnemer deelneemt een ondernemer of zelfstandige beroepsbeoefenaar en met betrekking waartoe in
      een door de kredietnemer ondertekende verklaring staat vermeld, dat het krediet wordt verleend ten behoeve van de
      uitoefening van diens bedrijf of beroep;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.e
    text: |-
      die bestaan uit een overeenkomst van huur en verhuur of waartoe een zodanige overeenkomst behoort, tenzij
      deze betrekking heeft op bij algemene maatregel van bestuur aan te wijzen zaken en de strekking heeft dat het
      verschaffen van het genot van de zaak, waarop de overeenkomst betrekking heeft, al of niet door verlenging van die
      overeenkomst of het aangaan van een nieuwe overeenkomst, langer dan zes maanden zal duren;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.f
    text: |-
      die bestaan uit een geldkrediet, bij het aangaan waarvan hypothecaire zekerheid wordt verleend, dan wel een
      geldkrediet met betrekking waartoe reeds hypothecaire zekerheid bestaan, mits het krediet wordt verleend tegen een
      voor hypothecaire financieringen van de betrokken kredietgever gebruikelijk effectief kredietvergoedingspercentage
      op jaarbasis;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.g
    text: die bestaan uit belening van een levensverzekering bij de betrokken levensverzekeraar;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.h
    text: |-
      die bestaan uit belening van ter beurze genoteerde effecten dan wel van niet ter beurze genoteerde effecten, voor
      zover de waarde daarvan door middel van een openbare prijsaanduiding voor een ieder kenbaar is, mits de kredietsom
      de waarde van de betrokken effecten op het tijdstip van het aangaan van de transactie niet te boven gaat;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: 4.1.i
    text: |-
      die bestaan uit een belening in de zin van de [Pandhuiswet][ref1] (*Stb.* 1910, 321), welke plaats vindt in een
      bank van lening als bedoeld in artikel 1, eerste lid, van die wet, indien daar in hoofdzaak beleningen plaatsvinden
      op de in die bepaling omschreven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0001880
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001880
  - number: 4.1.j
    text: waaraan wordt deelgenomen door openbare lichamen, ter uitvoering van een wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid geldt het bepaalde bij of krachtens de [artikelen 26][ref1] en [69][ref2] mede ten
      aanzien van krediettransacties als bedoeld in het eerste lid, onder f en h.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel69
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '26'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '69'
        hoofdstuk: X
  - number: '4.3'
    text: |-
      Indien een kredietgever bij het deelnemen aan krediettransacties als bedoeld in het eerste lid, onder *a*,
      handelt in strijd met hetgeen van een goed kredietgever in het maatschappelijk verkeer mag worden verwacht kan
      Onze Minister deze wet dan wel een of meer bepalingen daarvan van toepassing verklaren ter zake van zodanige
      krediettransacties.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel4
  - number: '5.1'
    text: |-
      [Hoofdstuk II][ref1] van deze wet geldt niet voor kredietverlening door een gemeentelijke kredietbank.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004815
        hoofdstuk: II
  - number: '5.2'
    text: |-
      De [artikelen 33, onder ][ref1], en [40][ref2] gelden niet voor kredietverlening door een gemeentelijke
      kredietbank:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: 5.2.a
    text: 'waaraan als kredietnemer deelneemt:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
  - number: 5.2.a.1º
    text: |-
      echtgenoten of geregistreerde partners als bedoeld in [artikel 3 van de Wet werk en bijstand][ref1], van wie het
      gezamenlijk netto maandinkomen niet hoger is dan de norm genoemd in [artikel 21, onderdeel c, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 5.2.a.2º
    text: |-
      een alleenstaande ouder als bedoeld in [artikel 4, onderdeel b, van de Wet werk en bijstand][ref1], van wie het
      netto maandinkomen niet hoger is dan negentig procent van de norm bedoeld onder 1°; of


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '4'
  - number: 5.2.a.3º
    text: |-
      een alleenstaande als bedoeld in [artikel 4, onderdeel a, van de Wet werk en bijstand][ref1], van wie het netto
      maandinkomen niet hoger is dan zeventig procent van de norm bedoeld onder 1°, dan wel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '4'
  - number: 5.2.b
    text: in het kader van een regeling met betrekking tot de bestaande schuldenlast van een kredietnemer (saneringskrediet).
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel5
  - number: '6'
    text: |-
      Een gemeentelijke kredietbank wordt opgericht en opgeheven bij of ingevolge een daartoe strekkend besluit van de
      gemeenteraad. Het besluit wordt onderworpen aan de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel6
  - number: '7.1'
    text: |-
      De gemeenteraad stelt voor de bedrijfsvoering van de gemeentelijke kredietbank een reglement vast,
      waaruit ten minste dient te blijken op welke wijze zal worden voldaan aan het bepaalde bij of krachtens de
      [hoofdstukken III][ref1] en [IV][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004815#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004815
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004815
        hoofdstuk: IV
  - number: '7.2'
    text: |-
      In het reglement worden regels gesteld van gelijke strekking als het voorschrift, bedoeld in
      [artikel 14, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '14'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.3'
    text: Het reglement wordt onderworpen aan de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel7
  - number: '9'
    text: |-
      Het is verboden zonder daartoe verleende vergunning krediet te verlenen, dan wel zich als kredietgever voor te
      doen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel9
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de wijze, waarop de aanvraag
      om een vergunning moet worden ingediend, de gegevens welke daarbij moeten worden verstrekt en de bescheiden die
      daarbij moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel10
  - number: '10.2'
    text: |-
      De aanvrager is ten gunste van ’s Rijks schatkist een bij of krachtens de maatregel vast te stellen bedrag
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel10
  - number: '11.1'
    text: Op een aanvraag om een vergunning wordt beslist door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel11
  - number: '11.2'
    text: Op de aanvraag wordt beslist binnen drie maanden na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een vergunning kan worden verleend aan een rechtspersoon met volledige rechtsbevoegdheid en daarbij aangesloten
      instellingen te zamen, indien die rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel12
  - number: 12.1.a
    text: |-
      beschikt over voldoende statutaire bevoegdheden jegens de aangesloten instellingen om een handelen van een zodanige
      instelling in strijd met het bij of krachtens deze wet bepaalde, dan wel met hetgeen anderszins van een goed
      kredietgever in het maatschappelijk verkeer mag worden verwacht, tegen te kunnen gaan,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel12
  - number: 12.1.b
    text: beschikt over voldoende mogelijkheden tot deskundige ondersteuning van de aangesloten instellingen, en
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel12
  - number: 12.1.c
    text: |-
      gemachtigd is die instellingen bij de vergunningaanvraag en ook overigens voor de toepassing van dit hoofdstuk
      te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien na de verlening van een vergunning als bedoeld in het eerste lid een instelling zich op gelijke voet
      aansluit bij de rechtspersoon, gaat de vergunning mede gelden voor die instelling.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel12
  - number: '13'
    text: 'Onze Minister verleent de vergunning tenzij er gegronde reden is om aan te nemen dat:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel13
  - number: 13.a
    text: de feitelijke toestand niet met het in of bij de aanvraag vermelde in overeenstemming is of zal zijn;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel13
  - number: 13.b
    text: |-
      bij de kredietverlening in strijd zal worden gehandeld met het bij of krachtens deze wet bepaalde dan wel met
      hetgeen anderszins van een goed kredietgever in het maatschappelijk verkeer mag worden verwacht;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel13
  - number: 13.c
    text: de aanvrager bij de kredietverlening niet voor eigen rekening en risico zal optreden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel13
  - number: '14.1'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      Aan de vergunning wordt het voorschrift verbonden dat de houder op een daarbij aan te geven wijze dient deel
      te nemen aan een stelsel van kredietregistratie, tenzij dit voorschrift naar het oordeel van Onze Minister in
      redelijkheid niet aan de vergunning kan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      Aan een vergunning als bedoeld in [artikel 12][ref1] wordt het voorschrift verbonden dat aan Onze Minister
      melding moet worden gedaan van de aansluiting van een instelling als bedoeld in [artikel 12, tweede lid][ref2],
      onderscheidenlijk van de beëindiging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel12
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: 14a
    text: |-
      Zodra een instelling ingevolge[ artikel 52, tweede lid, onder ][ref1] in het in dat artikel bedoelde register is
      ingeschreven, beschikt die instelling, voor zover het aan die instelling ingevolge [artikel 31, tweede lid][ref2],
      [32, tweede lid][ref3], [50, eerste lid][ref4], onderscheidenlijk [artikel 51][ref5] van genoemde wet is
      toegestaan krediet te verlenen, over een van rechtswege, zonder beperkingen, verleende vergunning als bedoeld in
      [artikel 9][ref6] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0004815#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0004815#Artikel9
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '31'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '32'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '50'
      - id: ref5
        bwb_id: BWBR0004815
        artikel: '51'
        hoofdstuk: VII
      - id: ref6
        bwb_id: BWBR0004815
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: 14b.1
    text: |-
      Zodra de inschrijving van een instelling als bedoeld in [artikel 14][ref1] openbaar is gemaakt, zendt Onze Minister
      die instelling onverwijld een schriftelijke bevestiging van de in dat artikel bedoelde vergunning, vergezeld
      van een verzoek tot het verschaffen van de in het tweede lid bedoelde gegevens en bescheiden betreffende de
      kredietverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: 14a
        hoofdstuk: II
        afdeling: '1'
  - number: 14b.2
    text: |-
      Bij ministeriële regeling wordt bepaald welke gegevens en bescheiden moeten worden verstrekt, alsmede op welke
      wijze dit dient te geschieden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14b
  - number: 14b.3
    text: |-
      De instelling doet de gegevens en bescheiden binnen drie maanden na ontvangst van het in het eerste lid bedoelde
      verzoek toekomen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14b
  - number: 14c.1
    text: |-
      Onze Minister kan binnen drie maanden na de dag waarop de in [artikel 14][ref1] bedoelde gegevens en bescheiden
      zijn ontvangen in het belang van een goede uitvoering van deze wet voorschriften verbinden aan de vergunning van de
      betrokken instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14b
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: 14b
        hoofdstuk: II
        afdeling: '1'
  - number: 14c.2
    text: |-
      [Artikel 14, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '14'
        hoofdstuk: II
        afdeling: '1'
  - number: '15'
    text: |-
      Op schriftelijk verzoek van de vergunninghouder kan Onze Minister de beperkingen en voorschriften wijzigen,
      aanvullen of intrekken, alsnog beperkingen aanbrengen of voorschriften aan de vergunning verbinden dan wel de
      vergunning intrekken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel15
  - number: '16.1'
    text: 'Onze Minister kan een aanwijzing geven aan de vergunninghouder:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: 16.1.a
    text: die handelt in strijd met de bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: 16.1.b
    text: |-
      die anderszins handelt in strijd met hetgeen van een goed kredietgever in het maatschappelijk verkeer mag worden
      verwacht;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: 16.1.c
    text: die bij de kredietverlening niet voor eigen rekening en risico optreedt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: '16.2'
    text: |-
      De aanwijzing vermeldt de handelingen welke de vergunninghouder naar het oordeel van Onze Minister dient te
      verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: '16.3'
    text: |-
      Onze Minister kan bij het geven van de aanwijzing verklaren dat deze buiten beschouwing blijft voor de toepassing
      van [artikel 17, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel17
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '17'
        hoofdstuk: II
        afdeling: '1'
  - number: '16.4'
    text: |-
      Onze Minister kan een aanwijzing ter openbare kennis brengen wanneer deze niet meer door een beslissing in beroep
      kan worden getroffen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel16
  - number: '17.1'
    text: |-
      Buiten de gevallen, bedoeld in [artikel 15][ref1], kan een vergunning door Onze Minister worden ingetrokken of
      beperkt of kunnen daaraan door hem voorschriften worden verbonden:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel15
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '15'
        hoofdstuk: II
        afdeling: '1'
  - number: 17.1.a
    text: |-
      indien de te harer verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken, dat de vergunning
      zou zijn geweigerd, onderscheidenlijk onder beperkingen of met voorschriften zou zijn verleend, indien bij de
      behandeling van de aanvraag de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
  - number: 17.1.b
    text: |-
      indien binnen twee jaar, nadat een krachtens [artikel 16][ref1] aan de houder gegeven aanwijzing onherroepelijk is
      geworden, zich wederom een geval als bedoeld in [artikel 16, eerste lid][ref2], voordoet;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel16
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '16'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '16'
        hoofdstuk: II
        afdeling: '1'
  - number: 17.1.c
    text: indien de vergunninghouder aan een aanwijzing geen gevolg geeft;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
  - number: 17.1.d
    text: |-
      indien de vergunninghouder gedurende een periode van ten minste twaalf opeenvolgende maanden minder dan honderd
      kredieten heeft verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
  - number: 17.1.e
    text: |-
      indien de vergunninghouder in staat van faillissement is komen te verkeren, indien ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard of indien door een rechterlijke
      beschikking één of meer goederen van de vergunninghouder onder een bewind als bedoeld in [artikel 380][ref1],
      [409][ref2] of [431 van Boek 1 van het Burgerlijk Wetboek][ref3] zijn gesteld of indien diens ondercuratelestelling
      is uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel380
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel409
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '380'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '409'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '431'
  - number: '17.2'
    text: |-
      Een vergunning wordt door Onze Minister ingetrokken of beperkt of daaraan worden door hem voorschriften verbonden,
      indien blijkt van gedragingen van de vergunninghouder of van handelingen in zijn onderneming welke in zodanige
      mate indruisen tegen hetgeen van een goed kredietgever in het maatschappelijk verkeer redelijkerwijs mag worden
      verwacht dat het krediet verlenen hem niet langer dan wel slechts met beperkingen of onder voorschriften kan worden
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het bepaalde in het eerste lid, onder *a*, *d* en *e*, is niet van toepassing ten aanzien van de houder van een
      vergunning als bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: 14a
        hoofdstuk: II
        afdeling: '1'
  - number: '18.1'
    text: 'De vergunning vervalt, behoudens het bepaalde in het tweede lid, door:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: 18.1.a
    text: overlijden van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: 18.1.b
    text: het onherroepelijk worden van een rechterlijke beschikking houdende ondercuratelestelling van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: 18.1.c
    text: fusie of splitsing van de rechtspersoon aan wie de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: 18.1.d
    text: ontbinding van de rechtspersoon aan wie de vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: 18.1.e
    text: overdracht door de vergunninghouder van de onderneming waarvoor de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien toepassing is gegeven aan [artikel 12][ref1] en zich een van de in het eerste lid bedoelde feiten of
      omstandigheden voordoet ten aanzien van een van de aangesloten instellingen, vervalt de werking van de vergunning
      voor de betrokken instelling. Indien het de in [artikel 12][ref2] genoemde rechtspersoon als zodanig betreft,
      vervalt de vergunning in haar geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel12
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: '18.3'
    text: |-
      Het bepaalde in het eerste en tweede lid is niet van toepassing ten aanzien van een vergunning als bedoeld in
      [artikel 14][ref1]. Een zodanige vergunning vervalt zodra de inschrijving, bedoeld in [artikel 14][ref2], is komen
      te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: 14a
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: 14a
        hoofdstuk: II
        afdeling: '1'
  - number: '18.4'
    text: |-
      Indien zich een geval als bedoeld in het eerste, tweede of derde lid voordoet en de onderneming waarvoor
      de vergunning werd verleend, onderscheidenlijk waarvoor de vergunning mede geldt, aan een andere persoon is
      overgedragen of op een andere persoon is overgegaan, blijft de vergunning voor die persoon gelden gedurende twee
      maanden na de dag waarop ingevolge het eerste, tweede of derde lid de vergunning, onderscheidenlijk de werking
      daarvan, zou vervallen en, indien binnen die tijdsruimte door die persoon een nieuwe vergunning is aangevraagd,
      verder tot het tijdstip waarop de beslissing op de aanvraag onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel18
  - number: '19'
    text: |-
      Van het tijdstip af waarop de vergunning is vervallen of ingetrokken, onderscheidenlijk de werking daarvan
      is vervallen, geldt het in [artikel 9][ref1] bedoelde verbod niet voor de voormalige vergunninghouder,
      onderscheidenlijk de betrokken instelling, voor zover het de afwikkeling van de lopende zaken betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel9
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
  - number: '20.1'
    text: |-
      Er is een register waarin de vergunninghouders worden ingeschreven ter bescherming van de belangen van
      kredietnemers. Onze Minister is verantwoordelijk voor het register. Het register is voor een ieder kosteloos ter
      inzage.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister bepaalt welke gegevens betreffende de vergunninghouders in het register worden opgenomen en op welke
      wijze het register wordt ingericht.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel20
  - number: '21.1'
    text: |-
      De inschrijving van een vergunninghouder geschiedt zodra hem een vergunning als bedoeld in [artikel 9][ref1] is
      verleend, onderscheidenlijk een bevestiging als bedoeld in [artikel 14][ref2], is gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel14b
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '9'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: 14b
        hoofdstuk: II
        afdeling: '1'
  - number: '21.2'
    text: |-
      De inschrijving van een vergunninghouder wiens vergunning onherroepelijk is ingetrokken of is vervallen wordt
      doorgehaald.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel21
  - number: '21.3'
    text: |-
      Onze Minister brengt de nodige aanvullingen of wijzigingen in de ingeschreven gegevens aan indien zich een geval
      als bedoeld in [artikel 12, tweede lid][ref1], voordoet, dan wel de werking van een vergunning voor een aangesloten
      instelling als bedoeld in [artikel 12, eerste lid][ref2], vervalt door het beëindigen van de aansluiting of door de
      werking van [artikel 18, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004815#Artikel18
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004815
        artikel: '18'
        hoofdstuk: II
        afdeling: '1'
  - number: '21.4'
    text: |-
      Indien hem genoegzaam is gebleken dat de ten aanzien van een vergunninghouder ingeschreven gegevens niet
      overeenstemmen met de werkelijke situatie is Onze Minister bevoegd de nodige wijzigingen in de ingeschreven
      gegevens aan te brengen. Hij doet hiervan aan de vergunninghouder zo spoedig mogelijk schriftelijk mededeling.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel21
  - number: '22.1'
    text: |-
      Onze Minister verstrekt aan een ieder op diens verzoek afschriften van, uittreksels uit of mededelingen betreffende
      in het register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel22
  - number: '22.2'
    text: Onze Minister stelt de voor de verstrekking van andere dan mondelinge gegevens verschuldigde bedragen vast.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel22
  - number: '23.1'
    text: De vergunninghouder zorgt voor een behoorlijke administratie van zijn bedrijf of beroep.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel23
  - number: '23.2'
    text: |-
      De vergunninghouder richt de administratie zodanig in dat aan de hand hiervan de naleving van de bij of krachtens
      deze wet gegeven voorschriften zo goed mogelijk kan worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel23
  - number: '23.3'
    text: |-
      De vergunninghouder of de voormalige vergunninghouder is verplicht alle bescheiden die gegevens inhouden
      betreffende een door hem verleend krediet onder zich te houden gedurende vijf jaren na de dag waarop die
      krediettransactie is afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel23
  - number: '23.4'
    text: |-
      In gevallen waarin een vergunning als bedoeld in [artikel 12][ref1] is verleend, rusten de in het eerste tot
      en met derde lid bedoelde verplichtingen op de in [artikel 12][ref2] genoemde rechtspersoon onderscheidenlijk
      elk van de afzonderlijke aangesloten instellingen, voor zover het de bedrijfsuitoefening van die rechtspersoon
      onderscheidenlijk van een zodanige instelling betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel12
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '12'
        hoofdstuk: II
        afdeling: '1'
  - number: '24.1'
    text: |-
      Iedere vergunninghouder is verplicht Onze Minister binnen een half jaar na afloop van elk kalenderjaar een opgave
      te verstrekken van:
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel24
  - number: 24.1.a
    text: |-
      het aantal in het afgelopen kalenderjaar verleende kredieten alsmede het totaal van de kredietsommen daarvan,
      onderverdeeld naar grootte van de kredietsom, looptijd en kredietvergoeding;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel24
  - number: 24.1.b
    text: |-
      het aantal van de tot en met het afgelopen kalenderjaar verstrekte, nog lopende kredieten alsmede de uitstaande
      saldi daarvan, onderverdeeld als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan regels stellen aangaande de wijze waarop de in het eerste lid bedoelde gegevens moeten worden
      verstrekt en nadere regels aangaande de onderverdeling van die gegevens. Daarbij kan hij bepalen dat de gegevens
      moeten worden verstrekt door tussenkomst van een dienst waarbij de ingevolge [artikel 57][ref1] aangewezen
      ambtenaren werkzaam zijn, dan wel van de in [artikel 62, eerste lid][ref2], bedoelde organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel62
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '57'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '62'
        hoofdstuk: VIII
  - number: '25.1'
    text: |-
      De vergunninghouder geeft jaarlijks opdracht aan een onafhankelijke accountant tot het verrichten van onderzoek
      ten behoeve van het door Onze Minister uit te oefenen toezicht op de naleving van het bij en krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel25
  - number: '25.2'
    text: |-
      Onze Minister stelt regels ten aanzien van het in het eerste lid bedoelde onderzoek. Deze regels hebben in elk
      geval betrekking op de gegevens die moeten worden verzameld, de wijze waarop het onderzoek dient te geschieden, de
      werkzaamheden die in dat kader dienen te worden verricht en de verslaglegging aangaande het onderzoek.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel25
  - number: '25.3'
    text: |-
      De vergunninghouder brengt het door de accountant aan hem uitgebrachte verslag van het onderzoek ter kennis van
      Onze Minister, uiterlijk op een door deze te bepalen tijdstip. Onze Minister kan bepalen dat het verslag te zijnen
      behoeve ter kennis wordt gebracht van een dienst waarbij de ingevolge [artikel 57][ref1] aangewezen ambtenaren
      werkzaam zijn of aan de in [artikel 62, eerste lid][ref2], bedoelde organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel62
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '57'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '62'
        hoofdstuk: VIII
  - number: '25.4'
    text: |-
      De vergunninghouder verleent bij de opdracht tot het onderzoek de accountant een schriftelijke machtiging om
      desgevraagd aan de ingevolge [artikel 57][ref1] aangewezen ambtenaren en de ingevolge [artikel 62][ref2] aangewezen
      accountants alle inlichtingen te verstrekken, die redelijkerwijs nodig zijn ter uitvoering van hun taak. Indien
      een zodanige ambtenaar of accountant inlichtingen verlangt van de accountant die een opdracht tot onderzoek van de
      vergunninghouder heeft ontvangen, stelt hij de vergunninghouder of een door deze aan te wijzen vertegenwoordiger in
      de gelegenheid aanwezig te zijn bij het verstrekken van de inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel62
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '57'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '62'
        hoofdstuk: VIII
  - number: '26.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot aan het publiek te
      verstrekken informatie door kredietgevers, leveranciers en kredietbemiddelaars.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel26
  - number: '26.2'
    text: |-
      Tot de regels, bedoeld in het eerste lid, behoort in elk geval de verplichting tot vermelding van het effectieve
      kredietvergoedingspercentage op jaarbasis in prospectussen en in andere aanbiedingen waarin melding wordt gemaakt
      van kredietvergoeding of van betalingen, te verrichten door de kredietnemer. Onze Minister stelt regels aangaande
      de berekening van dit percentage en de vermelding daarvan. Daarbij bepaalt Onze Minister dat in aanbiedingen van
      geldkrediet als bedoeld in [artikel 4, eerste lid, onder f][ref1], de berekening en de vermelding geschieden op de
      wijze die is vastgelegd in een daarbij aan te wijzen overeenkomst tussen kredietgevers, indien hij van oordeel is
      dat aldus op genoegzame wijze uitvoering wordt gegeven aan artikel 3 van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel4
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '4'
        hoofdstuk: I
        afdeling: '2'
  - number: '26.3'
    text: |-
      Tot de regels, bedoeld in het eerste lid, behoort voorts voor de kredietgever op wie
      [artikel 28, tweede lid][ref1], van toepassing is, de verplichting om te vermelden hetgeen hij ter voldoening aan
      die bepaling verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel28
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '28'
        hoofdstuk: III
  - number: '26.4'
    text: |-
      Onze Minister kan, op aanvraag, bepalen dat een kredietgever, leverancier of kredietbemiddelaar niet behoeft
      te voldoen aan alle in het eerste lid bedoelde regels indien de kredietgever, leverancier of kredietbemiddelaar
      aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt te
      bereiken anderszins voldoende zijn bereikt. Onze Minister kan een besluit als bedoeld in de vorige volzin wijzigen
      of intrekken indien naar zijn oordeel de omstandigheden waaronder het besluit is genomen zodanig zijn gewijzigd dat
      de doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het is de kredietbemiddelaar verboden bij het verlenen van bemiddeling tot het afsluiten van een krediettransactie
      een beloning of vergoeding, in welke vorm ook, te bedingen of te aanvaarden van, dan wel in rekening te brengen aan
      een ander dan de kredietgever. Hetzelfde geldt ten aanzien van de leverancier voor het door deze bevorderen van het
      tot stand komen van een krediettransactie.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel27
  - number: '27.2'
    text: |-
      Bij algemene maatregel van bestuur worden, ten einde een zorgvuldige kredietbemiddeling te bevorderen, regels
      gesteld ter zake van de beloning of vergoeding, bedoeld in het eerste lid, alsmede ter zake van de wijze van
      uitbetaling daarvan.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel27
  - number: '27.3'
    text: |-
      Nietig is een overeenkomst, voor zover daarbij van het eerste lid of van de regels, bedoeld in het tweede lid,
      wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel27
  - number: '28.1'
    text: |-
      De kredietgever neemt niet deel aan een krediettransactie waarvan de kredietsom meer dan € 1 000 bedraagt, zonder
      te beschikken over genoegzame, andere dan mondelinge, inlichtingen aangaande de kredietwaardigheid van degene, voor
      wie het krediet wordt aangevraagd. De kredietgever houdt van de inlichtingen aantekening in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel28
  - number: '28.2'
    text: |-
      Indien de kredietgever ingevolge het voorschrift, bedoeld in [artikel 14, tweede lid][ref1], deelneemt aan een
      stelsel van kredietregistratie is hij verplicht, alvorens een krediet te verlenen waarvan de kredietsom € 1 000
      of meer bedraagt, de in dat kader geregistreerde gegevens over reeds aan degene, voor wie het krediet wordt
      aangevraagd, verleende kredieten op te vragen, voor zover hij bevoegd is deze te verkrijgen. De kredietgever is
      verplicht van de verkregen gegevens aantekening te houden in zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '14'
        hoofdstuk: II
        afdeling: '1'
  - number: '28.3'
    text: |-
      Het in het eerste en tweede lid genoemde bedrag kan, in verband met geldontwaarding, bij algemene maatregel van
      bestuur worden gewijzigd. Een aldus bij algemene maatregel van bestuur vastgesteld bedrag treedt in de plaats van
      het in het eerste en tweede lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien de kredietaanvraag niet wordt ingewilligd doet de kredietgever de aanvrager op diens verzoek schriftelijk
      opgaaf van de redenen daarvan.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het is de kredietgever verboden ter zake van een niet ingewilligde kredietaanvraag een beloning of vergoeding, in
      welke vorm ook, in rekening te brengen aan of te bedingen dan wel te aanvaarden van de aanvrager of degene, ten
      behoeve van wie het krediet is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel29
  - number: '29.3'
    text: Nietig is een overeenkomst, voor zover daarbij van het tweede lid wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel29
  - number: '30.1'
    text: |-
      Een overeenkomst die een krediettransactie vormt of tot een zodanige transactie behoort en waarbij een kredietnemer
      partij is, wordt aangegaan bij een door of namens alle partijen ondertekende onderhandse of notariële akte.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '30.2'
    text: |-
      Indien een overeenkomst als bedoeld in het eerste lid wordt aangegaan bij onderhandse akte, verstrekt de
      kredietgever of, in geval van een overeenkomst waarbij uitsluitend een leverancier en een kredietnemer partij zijn,
      de leverancier een door hem ondertekend afschrift aan de kredietnemer.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '30.3'
    text: |-
      De kredietgever en de leverancier dragen er, ieder voor zover hij aan de transactie deelneemt, zorg voor, dat de
      akte in ieder geval de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.a
    text: de naam en het adres van ieder der partijen;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.b
    text: de naam en het adres van de kredietbemiddelaar die bij de totstandkoming van de overeenkomst betrokken is geweest;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.c
    text: de kredietsom in cijfers en in letterschrift;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.d
    text: |-
      bij goederenkrediet: de contantprijs van elk van de zaken of diensten, met dien verstande dat bij doorlopend
      goederenkrediet slechts de contantprijs behoeft te worden vermeld van de zaken onderscheidenlijk diensten,
      waarvan bij het aangaan van de transactie bekend is dat aan de kredietnemer het genot daarvan wordt verschaft
      onderscheidenlijk dat zij worden verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.e
    text: |-
      het totaalbedrag van de kredietvergoeding, voor zover het niet betreft een doorlopend krediet of een
      krediettransactie waarbij de kredietvergoeding variabel is;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.f
    text: het effectieve kredietvergoedingspercentage op jaarbasis, berekend op door Onze Minister aan te geven wijze;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.g
    text: de betalingsregeling;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.h
    text: |-
      de bedingen betreffende zekerheidsrechten van de kredietgever of de leverancier, met inbegrip van een afzonderlijke
      aanduiding van elke zaak waarop een zodanig recht rust en de ingevolge [artikel 40, tweede lid][ref1], geldende
      regeling betreffende overgang van eigendom;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: 30.3.i
    text: de bevoegdheid van de kredietnemer tot volledige of gedeeltelijke vervroegde aflossing;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: 30.3.j
    text: de plaats en datum van ondertekening.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '30.4'
    text: De in het derde lid voorgeschreven vermeldingen moeten duidelijk leesbaar en bevattelijk zijn.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '30.5'
    text: |-
      Indien niet is voldaan aan het bepaalde in het eerste of tweede lid, is de overeenkomst vernietigbaar; slechts de
      kredietnemer kan een beroep op de vernietigingsgrond doen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '30.6'
    text: |-
      Bedingen waarbij aan de kredietnemer een verplichting wordt opgelegd of een recht wordt ontnomen ingeval hij een
      beroep op de vernietigingsgrond doet, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel30
  - number: '31.1'
    text: |-
      Een kredietnemer kan geen volmacht tot ondertekening van een overeenkomst als bedoeld in
      [artikel 30, eerste lid][ref1], verlenen aan een kredietgever, een leverancier, een kredietbemiddelaar of iemand,
      die bij een van hen werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: '31.2'
    text: |-
      Bedingen waarbij aan de kredietnemer een verplichting wordt opgelegd of een recht wordt ontnomen ingeval hij een
      beroep op de ongeldigheid van de volmacht doet, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel31
  - number: '31.3'
    text: |-
      De kredietnemer kan geen onherroepelijke volmacht tot ondertekening van een overeenkomst als bedoeld in
      [artikel 30, eerste lid][ref1], verlenen. Bedingen waarbij aan de kredietnemer een verplichting wordt opgelegd of
      een recht wordt ontnomen ingeval hij een volmacht tot zodanige ondertekening herroept, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: '32.1'
    text: |-
      In afwijking van [artikel 30, eerste lid][ref1], kunnen de kredietgever en de leverancier ten aanzien van een
      krediettransactie, waarvan de kredietsom niet meer dan € 1 000 bedraagt, volstaan met het onverwijld aan de
      kredietnemer verstrekken van een schriftelijke bevestiging van de transactie, ieder voor zover hij daaraan heeft
      deelgenomen. [Artikel 30, derde tot en met zesde lid][ref2], is van overeenkomstige toepassing ten aanzien van de
      schriftelijke bevestiging.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: '32.2'
    text: |-
      Het in het eerste lid bedoelde bedrag kan, in verband met geldontwaarding, bij algemene maatregel van bestuur
      worden gewijzigd. Een aldus bij algemene maatregel van bestuur vastgesteld bedrag treedt in de plaats van het in
      het eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel32
  - number: '33'
    text: |-
      Nietig is een overeenkomst als bedoeld in [artikel 30, eerste lid][ref1], voor zover daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: 33.a
    text: |-
      de kredietgever of leverancier de bevoegdheid wordt verleend, anders dan bij wijze van een verhoging van
      de kredietvergoeding welke is toegelaten ingevolge het bepaalde krachtens [artikel 35][ref1], eenzijdig de
      kredietvergoeding te verhogen of anderszins de verplichtingen van de kredietnemer te verzwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: 33.b
    text: 'de kredietnemer zich verplicht tot het aangaan van een andere overeenkomst, anders dan ingeval:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.b.1°
    text: |-
      uitdrukkelijk aan de kredietnemer het recht wordt toegekend te bepalen met welke wederpartij die overeenkomst zal
      worden aangegaan, of
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.b.2°
    text: |-
      de overeenkomst verplicht tot het aanhouden van een betaalrekening bij de kredietgever, door middel waarvan de uit
      de krediettransactie voortvloeiende betalingen dienen plaats te vinden en waaraan voor de kredietnemer geen kosten
      zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c
    text: 'vervroegde opeisbaarheid van het door de kredietnemer verschuldigde wordt bedongen, anders dan voor het geval dat:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.1°
    text: |-
      de kredietnemer, die gedurende ten minste twee maanden achterstallig is in de betaling van een vervallen
      termijnbedrag, na in gebreke te zijn gesteld nalatig blijft in de nakoming van zijn verplichtingen,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.2°
    text: |-
      de kredietnemer Nederland metterwoon heeft verlaten, dan wel redelijkerwijs kan worden aangenomen dat de
      kredietnemer binnen enkele maanden Nederland metterwoon zal verlaten,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.3°
    text: |-
      de kredietnemer is overleden en de kredietgever gegronde reden heeft om aan te nemen dat diens verplichtingen uit
      hoofde van de overeenkomst niet zullen worden nagekomen,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.4°
    text: |-
      de kredietnemer in staat van faillissement is komen te verkeren of ten aanzien van de kredietnemer de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard,
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.5°
    text: de kredietnemer de tot zekerheid verbonden zaak heeft verduisterd, of
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.c.6°
    text: |-
      de kredietnemer aan de kredietgever, met het oog op het aangaan van de overeenkomst, bewust onjuiste inlichtingen
      heeft verstrekt van dien aard, dat de kredietgever de overeenkomst niet of niet onder dezelfde voorwaarden zou
      hebben aangegaan indien hem de juiste stand van zaken bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.d
    text: |-
      de kredietnemer enig recht op arbeidsloon, salaris, pensioen, andere inkomsten uit arbeid of uitkering ingevolge
      een sociale verzekeringswet, dan wel levensonderhoud, verschuldigd ingevolge Boek 1 van het Burgerlijk Wetboek,
      ter zake van een krediettransactie op enigerlei wijze overdraagt, vervreemdt of bezwaart, dan wel tot invordering
      daarvan een onherroepelijke volmacht, in welke vorm of onder welke benaming ook, verleent;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
  - number: 33.e
    text: |-
      wordt afgeweken van het bepaalde bij of krachtens de [artikelen 34 tot en met 46][ref1], met uitzondering van een
      afwijking als bedoeld in [artikel 42, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel42
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '42'
        hoofdstuk: IV
        afdeling: '4'
  - number: '34'
    text: |-
      Het is de kredietgever en de leverancier verboden enige andere vorm van kredietvergoeding te bedingen, in rekening
      te brengen of te aanvaarden dan:
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel34
  - number: 34.a
    text: een vergoeding welke verschuldigd is bij afwikkeling overeenkomstig de betalingsregeling van de transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel34
  - number: 34.b
    text: |-
      een vergoeding die verschuldigd wordt ingeval de kredietnemer, na ingebrekestelling, nalatig blijft in zijn
      verplichting tot betaling ingevolge de transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel34
  - number: 34.c
    text: een vergoeding die verschuldigd wordt indien de kredietnemer vervroegd aflost.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel34
  - number: '35.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt, ten einde het aanvaarden door kredietgevers van te
      grote risico’s tegen te gaan, de ten hoogste toegelaten kredietvergoeding vastgesteld en worden regels gegeven
      betreffende de tijdstippen waarop de kredietvergoeding in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel35
  - number: '35.2'
    text: |-
      De ten hoogste toegelaten kredietvergoeding wordt uitgedrukt in een geldsom, een percentage of in enige andere
      vorm. Deze kan verschillen naar gelang van de hoogte van de kredietsom, de looptijd van de transactie, mede in
      verband met de termijnen van aflossing, de vorm van de kredietvergoeding bedoeld in [artikel 34][ref1], en het al
      dan niet variabel zijn van de kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '35.3'
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, wordt bepaald dat ter zake van krediettransacties, waarbij de
      kredietvergoeding variabel is, geen vergoeding als bedoeld in [artikel 34, onder ][ref1], is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '36'
    text: |-
      Het is de kredietgever en de leverancier verboden een hogere kredietvergoeding in rekening te brengen, te bedingen
      of te aanvaarden, dan wel kredietvergoeding op een ander tijdstip in rekening te brengen, dan is toegelaten
      ingevolge [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: '37.1'
    text: De kredietnemer is te allen tijde bevoegd tot volledige of gedeeltelijke vervroegde aflossing.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel37
  - number: '37.2'
    text: |-
      De kredietgever of de leverancier kan bedingen dat gedeeltelijke vervroegde aflossing slechts plaatsvindt door
      een betaling ter grootte van ten minste een termijnbedrag overeenkomstig de betalingsregeling of, indien meer
      wordt afgelost, een veelvoud van een zodanig bedrag, op een tijdstip waarop ingevolge de betalingsregeling een
      termijnbedrag dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel37
  - number: '38'
    text: 'Het is de kredietgever en de leverancier verboden:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel38
  - number: 38.a
    text: |-
      ter zake van nog niet opeisbare verplichtingen van de kredietnemer andere dan chartale betaalmiddelen aan te nemen,
      anders dan voor volledige of gedeeltelijke vervroegde aflossing;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel38
  - number: 38.b
    text: |-
      een wissel op de kredietnemer te trekken of een orderbriefje van de kredietnemer aan te nemen ter zake van hetgeen
      de kredietnemer verschuldigd is, dan wel een van de kredietnemer ter betaling ontvangen cheque over te dragen aan
      een derde.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel38
  - number: '39.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, in het belang van een goede voorlichting, regels worden gesteld
      ten aanzien van de inhoud van schriftelijke mededelingen betreffende het uitstaand saldo en de hoogte van de
      kredietvergoeding, welke gedurende de looptijd van de krediettransactie door de kredietgever aan de kredietnemer
      worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel39
  - number: '39.2'
    text: |-
      Bij transacties met een variabele kredietvergoeding is de kredietgever verplicht om van elke wijziging van de
      kredietvergoeding op het eerstvolgende rekeningafschrift mededeling te doen aan de kredietnemer, waarbij hij tevens
      het gewijzigde effectieve kredietvergoedingspercentage op jaarbasis, berekend op door Onze Minister aangegeven
      wijze, vermeldt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel39
  - number: '39.3'
    text: |-
      De kredietgever verstrekt op een daartoe strekkend verzoek van de kredietnemer een gespecificeerd overzicht van het
      uitstaand saldo. Hij kan daarbij een vergoeding in rekening brengen tot ten hoogste het bedrag van de werkelijke
      kosten.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel39
  - number: '39.4'
    text: |-
      Binnen korte tijd na het tenietgaan van de verbintenis van de kredietnemer verstrekt de kredietgever aan de
      kredietnemer op diens verzoek kosteloos een gespecificeerde afrekening.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel39
  - number: '40.1'
    text: |-
      Het is de kredietgever en de leverancier slechts toegestaan tot zekerheid van de nakoming van een
      verbintenis van de kredietnemer uit hoofde van een krediettransactie, een pandrecht als bedoeld in
      [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1] te vestigen op een zaak, indien die zaak door de
      kredietnemer met het geleende geld wordt aangeschaft of aan de kredietnemer ingevolge de transactie het genot van
      die zaak wordt verschaft. De eerste volzin is van overeenkomstige toepassing ten aanzien van het bedingen van een
      eigendomsvoorbehoud alsmede ten aanzien van het vestigen van een pandrecht op een vordering van de kredietnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
  - number: '40.2'
    text: |-
      Een pandrecht als bedoeld in [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1] dat in het kader van een
      doorlopende krediettransactie op een zaak is gevestigd, eindigt van rechtswege en de eigendom van een zaak die in
      het kader van een doorlopende krediettransactie is voorbehouden, gaat van rechtswege over op de kredietnemer zodra
      deze aflossingen heeft gedaan ter grootte van het verschil tussen de contantprijs van die zaak en het bedrag van de
      contante betaling betreffende het genot van die zaak, dan wel, indien geen contante betaling is gedaan, ter grootte
      van die contantprijs. Aflossingen worden bij goederenkrediet toegerekend aan verschillende zaken in dezelfde
      volgorde als waarin met het verschaffen van het genot daarvan een aanvang is gemaakt en bij geldkrediet in dezelfde
      volgorde als waarin zij zijn aangeschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
  - number: '41.1'
    text: |-
      Afgifte van een zaak, waarop een pandrecht als bedoeld in [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1]
      is gevestigd of waarvan de eigendom is voorbehouden in het kader van een krediettransactie,
      kan slechts worden gevorderd in de gevallen, bedoeld in [artikel 33, onder ][ref2].
      [Artikel 496, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel496
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '33'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '496'
  - number: '41.2'
    text: |-
      Afgifte van een zaak als bedoeld in het eerste lid kan niet meer worden gevorderd indien meer dan drie vierde
      deel van de kredietsom is afgelost. De vorige volzin vindt geen toepassing met betrekking tot doorlopende
      krediettransacties.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel41
  - number: '41.3'
    text: |-
      Afgifte van een zaak als bedoeld in het eerste lid heeft, indien zij geschiedt in overeenstemming met het
      bepaalde in dit artikel, tot gevolg dat de tot de krediettransactie behorende overeenkomsten van rechtswege worden
      ontbonden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel41
  - number: '41.4'
    text: |-
      De kredietnemer kan niet worden verplicht de kredietgever of de leverancier toe te laten tot zijn woning of erf om
      de tot zekerheid dienende zaak te bezichtigen of tot zich te nemen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel41
  - number: '42.1'
    text: |-
      Indien de kredietnemer binnen veertien dagen nadat hij de zaak heeft afgegeven het totale op het tijdstip van
      inlossing achterstallige bedrag, benevens de vergoeding, bedoeld in [artikel 34, onder ][ref1], betaalt, wordt de
      zaak door de kredietgever teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '42.2'
    text: |-
      Door de in het eerste lid bedoelde betaling wordt de ontbinding van de tot de krediettransactie behorende
      overeenkomsten ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel42
  - number: '42.3'
    text: |-
      Bij herhaalde afgifte van de zaak behoeft deze door de kredietgever slechts te worden teruggegeven na betaling
      door de kredietnemer van het in het eerste lid bedoelde bedrag, benevens het restant van de kredietsom,
      alsmede de bedongen kredietvergoeding, voor zover toegelaten ingevolge [artikel 35][ref1], met dien verstande,
      dat bij een doorlopende krediettransactie in plaats van het restant van de kredietsom het restant van de in
      [artikel 40, tweede lid, eerste volzin][ref2], bedoelde aflossingen moet worden betaald; de tweede volzin van dat
      lid vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '42.4'
    text: |-
      Indien de kredietgever een redelijk belang heeft bij weigering van de teruggave, kan de rechter bepalen dat het
      eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel42
  - number: '42.5'
    text: Van de bepalingen van dit artikel kan door partijen slechts ten voordele van de kredietnemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel42
  - number: '43.1'
    text: |-
      In afwijking van [artikel 229 van Boek 3 van het Burgerlijk Wetboek][ref1] ontstaat een pandrecht op een vordering
      tot vergoeding die in de plaats treedt van een zaak als bedoeld in [artikel 40, eerste lid][ref2], slechts voor het
      geval die zaak geheel teniet gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '43.2'
    text: 'Een pandrecht als bedoeld in het eerste lid eindigt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
  - number: 43.2.a
    text: indien de kredietnemer gelijkwaardige vervangende zekerheid stelt, of
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
  - number: 43.2.b
    text: zodra de kredietnemer drie vierde deel van de kredietsom heeft afgelost.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
  - number: '43.3'
    text: |-
      De kredietgever, onderscheidenlijk de leverancier, die tot inning van de in het eerste lid bedoelde verpande
      vordering overgaat, stelt de kredietnemer daarvan terstond schriftelijk in kennis. Daarbij deelt hij de
      kredietnemer mee dat deze in de gelegenheid is om gelijkwaardige vervangende zekerheid te stellen. [Artikel
      40, eerste lid](onbekend), is niet van toepassing ten aanzien van de door de kredietnemer gestelde vervangende
      zekerheid.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
  - number: '43.4'
    text: |-
      [Artikel 229 van Boek 3 van het Burgerlijk Wetboek][ref1] en het eerste tot en met het derde lid zijn
      van overeenkomstige toepassing bij een eigendomsvoorbehoud ten aanzien van een zaak als bedoeld in
      [artikel 40, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '44.1'
    text: |-
      Een overeenkomst als bedoeld in [artikel 30, eerste lid][ref1], kan slechts door rechterlijke tussenkomst worden
      ontbonden, behoudens het bepaalde in [artikel 41, derde lid][ref2], van deze wet en de [artikelen 37][ref3] en
      [38][ref4] (*Stb.* 1893, 140).


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel38a
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '41'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0001860
        artikel: 38a
  - number: '44.2'
    text: |-
      Indien bij ontbinding van zodanige overeenkomst een der partijen in een betere vermogenstoestand zou geraken dan
      bij het in stand blijven van die overeenkomst en afwikkeling overeenkomstig de betalingsregeling, vindt volledige
      verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel44
  - number: '45.1'
    text: |-
      Indien de leverancier van een roerende zaak of een dienst waarop een krediettransactie als bedoeld in
      [artikel 1, onder ][ref1], betrekking heeft, jegens de kredietnemer tekortschiet in de nakoming van zijn
      verbintenis, is de kredietnemer jegens de kredietgever bevoegd op dezelfde voet de nakoming van zijn
      verplichtingen uit die transactie op te schorten als hij zou zijn indien het een transactie als bedoeld in
      [artikel 1, onder ][ref2], betrof, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel1
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '1'
        hoofdstuk: I
        afdeling: '1'
  - number: 45.1.a
    text: |-
      de kredietnemer het krediet heeft verkregen krachtens een voordien tussen de kredietgever en de leverancier
      tot stand gekomen overeenkomst op grond waarvan uitsluitend door die kredietgever aan een wederpartij van die
      leverancier krediet wordt verstrekt, en
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
  - number: 45.1.b
    text: |-
      de kredietnemer van de leverancier schriftelijk nakoming van diens verbintenis heeft verlangd en de leverancier in
      gebreke is gebleven daaraan te voldoen.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
  - number: '45.2'
    text: |-
      De in het eerste lid bedoelde bevoegdheid vervalt zodra de leverancier zijn verbintenis volledig aan de
      kredietnemer heeft voldaan of voor de voldoening van die verbintenis zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
  - number: '45.3'
    text: |-
      Indien op grond van de in het eerste lid, onder *b*, bedoelde niet-nakoming de overeenkomst tussen de
      kredietnemer en de leverancier wordt ontbonden, kan de kredietnemer de vordering die hij op de voet van
      [het tweede lid van artikel 44][ref1] heeft jegens de leverancier, geldend maken jegens de kredietgever. Het
      bepaalde in het eerste lid, onder *b*, is van overeenkomstige toepassing, tenzij de ontbinding van de overeenkomst
      geschiedt in verband met het faillissement van de leverancier of de toepassing ten aanzien van de leverancier van
      de schuldsaneringsregeling natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel44
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '44'
        hoofdstuk: IV
        afdeling: '5'
  - number: '45.4'
    text: |-
      Dit artikel is niet van toepassing op een krediettransactie waarbij de kredietsom minder dan € 200 bedraagt. Het
      in de vorige volzin genoemde bedrag kan in verband met geldontwaarding, dan wel in verband met een herziening
      van bedragen als bedoeld in artikel 13, tweede lid, van de richtlijn bij algemene maatregel van bestuur worden
      aangepast. Een aldus bij algemene maatregel van bestuur vastgesteld bedrag treedt in de plaats van het in de eerste
      volzin genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
  - number: '45.5'
    text: Van de bepalingen van dit artikel kan door partijen slechts ten voordele van de kredietnemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel45
  - number: '46'
    text: |-
      De bepalingen van dit hoofdstuk omtrent nietigheid en vernietigbaarheid zijn mede van toepassing op overeenkomsten
      als bedoeld in [artikel 30, eerste lid][ref1], die buiten Nederland worden gesloten door een buiten Nederland
      gevestigde kredietgever of leverancier met een kredietnemer die zijn gewone verblijfplaats in Nederland heeft en
      die het krediet in Nederland heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: '47.1'
    text: Schuldbemiddeling is verboden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel47
  - number: '47.2'
    text: |-
      Onder schuldbemiddeling wordt verstaan het in de uitoefening van een bedrijf of beroep, anders dan door het aangaan
      van een krediettransactie, verrichten van diensten, gericht op de totstandkoming van een regeling met betrekking
      tot de bestaande schuldenlast van een natuurlijke persoon, geheel of gedeeltelijk voortvloeiend uit een of meer
      krediettransacties.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel47
  - number: '48.1'
    text: |-
      Het in [artikel 47, eerste lid][ref1], bedoelde verbod is niet van toepassing op schuldbemiddeling:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel47
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '47'
        hoofdstuk: V
  - number: 48.1.a
    text: om niet;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
  - number: 48.1.b
    text: |-
      door gemeenten, gemeentelijke kredietbanken of andere door gemeenten gehouden instellingen, die zich krachtens hun
      doelstelling met schuldbemiddeling bezighouden;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
  - number: 48.1.c
    text: |-
      door advocaten, procureurs, curatoren en bewindvoerders ingevolge de [Faillissementswet][ref1] aangesteld,
      notarissen, deurwaarders, registeraccountants en accountants-administratieconsulenten;


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 48.1.d
    text: |-
      door natuurlijke personen of rechtspersonen, dan wel categorieën daarvan, aan te wijzen bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
  - number: '48.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de vergoeding voor schuldbemiddeling voor ingevolge
      het eerste lid, onder *d*, aangewezen personen of categorieën van personen niet meer mag bedragen dan een daarbij
      te bepalen percentage van het bedrag van de schulden, voor zover daaromtrent een regeling is tot stand gekomen,
      dat de vergoeding niet meer mag bedragen dan de kosten van de bemiddeling, alsmede dat geen vergoeding mag
      worden bedongen, in rekening gebracht of aanvaard indien geen regeling is tot stand gekomen. Deze regels kunnen
      verschillen naar gelang van de aangewezen personen of categorieën van personen, waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
  - number: '48.3'
    text: Nietig is een overeenkomst, voor zover daarbij wordt afgeweken van het bij of krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel48
  - number: '49'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel49
  - number: '57.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel57
  - number: '57.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel57
  - number: '62.1'
    text: |-
      Onze Minister kan het verzamelen van gegevens ten behoeve van het door hem uit te oefenen toezicht op
      vergunninghouders opdragen aan door hem aan te wijzen accountants, die samenwerken in één organisatie.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel62
  - number: '62.2'
    text: |-
      Indien Onze Minister toepassing geeft aan het eerste lid stelt hij tevens regels ten aanzien van de uitvoering van
      de werkzaamheden, alsmede aangaande de rapportage over de verzamelde gegevens en de uitvoering van de werkzaamheden
      van de accountants en de organisatie ingevolge deze wet. Onze Minister kan voorts aanwijzingen dienaangaande geven
      aan de aangewezen accountants.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel62
  - number: '62.3'
    text: Onze Minister kan een aanwijzing als bedoeld in het eerste lid ten aanzien van een of meer accountants intrekken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel62
  - number: '63.1'
    text: |-
      Iedere vergunninghouder is periodiek een bijdrage verschuldigd in de kosten die gemoeid zijn met de ingevolge deze
      wet door de in [artikel 62][ref1] bedoelde accountants en organisatie verrichte werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel62
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '62'
        hoofdstuk: VIII
  - number: '63.2'
    text: |-
      De bijdragen worden in rekening gebracht en geïnd door de in [artikel 62, eerste lid][ref1], bedoelde organisatie.
      De organisatie legt jaarlijks een begroting van de kosten ter goedkeuring voor aan Onze Minister, volgens de
      door deze te stellen regels. Onze Minister stelt voorts regels aangaande de berekening van de bijdragen van
      de vergunninghouders, op basis van de door hem goedgekeurde begroting, alsmede het in rekening brengen van de
      bijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel62
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '62'
        hoofdstuk: VIII
  - number: '64'
    text: 'De regels welke krachtens deze wet worden vastgesteld, kunnen verschillen al naar gelang zij betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel64
  - number: 64.a
    text: verschillende kredietsoorten;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel64
  - number: 64.b
    text: |-
      houders van een vergunning als bedoeld in [artikel 14][ref1] dan wel andere vergunninghouders;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: 14a
        hoofdstuk: II
        afdeling: '1'
  - number: 64.c
    text: kredietgevers die al dan niet een vestiging in Nederland hebben.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van krachtens deze wet vastgestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel65
  - number: '65.2'
    text: |-
      Een vrijstelling en een ontheffing als bedoeld in het eerste lid kunnen onder beperkingen worden verleend. Aan een
      zodanige vrijstelling en ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel65
  - number: '66.1'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in de [artikelen 1, onder ][ref1],
      [4, eerste lid, onder ][ref2], [28, derde lid][ref3], [45, vierde lid][ref4], en [56][ref5] wordt gedaan door Onze
      Minister, in overeenstemming met Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004815#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0004815#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0004815#Artikel56
