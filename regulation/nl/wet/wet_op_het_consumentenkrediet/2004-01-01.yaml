  - number: '75.5'
    text: |-
      Deze wet geldt niet voor een krediet dat wordt verleend in de vorm van een toegelaten
      debetstand op een rekening bij een kredietgever, tevens houder van een vergunning als bedoeld in
      [artikel 2 van de Wet toezicht kredietwezen][ref1], indien die rekening:


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel2
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '2'
  - number: 75.5.a
    text: bestemd is voor het verrichten en ontvangen van betalingen aan, onderscheidenlijk van, derden;
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
  - number: 75.5.b
    text: strekt tot gebruik in de uitoefening van het bedrijf of het beroep van de kredietnemer en
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
  - number: 75.5.c
    text: |-
      geopend is voor het tijdstip, bedoeld in [artikel 77, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel77
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
