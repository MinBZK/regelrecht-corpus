  - number: '74'
    text: |-
      De Wet op het consumptief geldkrediet (*Stb.* 1972, 399) en de Wet op het afbetalingsstelsel 1961 (*Stb.* 1976,
      515) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel74
  - number: '75.1'
    text: |-
      [Artikel 7, eerste en tweede lid][ref1], geldt gedurende een jaar na het tijdstip van in werking treden van deze
      wet niet met betrekking tot een gemeentelijke kredietbank, voor de bedrijfsvoering waarvan voor dat tijdstip een
      reglement was vastgesteld en goedgekeurd ingevolge artikel 8 van de Wet op het consumptief geldkrediet.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel7
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '7'
        hoofdstuk: I
        afdeling: '3'
  - number: '75.2'
    text: |-
      Ten aanzien van degene, die op het tijdstip van in werking treden van deze wet in de uitoefening van een bedrijf
      of beroep als de in [artikel 1, onder ][ref1], bedoelde eerste partij rechtmatig pleegt deel te nemen aan
      overeenkomsten als bedoeld in die bepaling, blijft [hoofdstuk II][ref2] buiten toepassing gedurende drie maanden na
      dat tijdstip en voorts, indien binnen die termijn door Onze Minister een aanvraag als bedoeld in [artikel 10][ref3]
      van die kredietgever is ontvangen, tot op die aanvraag onherroepelijk is beslist. [Artikel 11, tweede lid][ref4],
      is niet van toepassing. De vergunning wordt verleend voor zover die betrekking heeft op een voortzetting van de in
      de eerste volzin van dit lid bedoelde werkzaamheid en de aanvrager op het tijdstip van in werking treden van deze
      wet in het bezit is van een vergunning als bedoeld in [artikel 2 van de Wet toezicht kredietwezen][ref5] (*Stb.*
      1978, 255).


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004815#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0004815#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004815#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel2
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel75
