  - number: '67'
    text: |-
      Onze Minister doet, zodra een beschikking als bedoeld in [artikel 4, derde lid][ref1], [11, eerste lid][ref2],
      [17][ref3], indien het een intrekking van de vergunning betreft, [51][ref4] of [65][ref5] is vastgesteld, daarvan
      mededeling in de *Nederlandse Staatscourant*. Evenzo doet Onze Minister mededeling van een aanwijzing als bedoeld
      in [artikel 57][ref6] of [62, eerste lid][ref7], alsmede de intrekking van een zodanige aanwijzing, en kan Onze
      Minister mededeling doen van andere beschikkingen die worden genomen op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel4
