  - number: '66.2'
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in de [artikelen 3, derde lid][ref1],
      [10, eerste lid][ref2], [26][ref3], [27, tweede lid][ref4], [28, derde lid][ref5], [35, eerste lid][ref6],
      [39, eerste lid][ref7], [45, vierde lid][ref8], en [56][ref9] wordt gedaan door Onze Minister, in overeenstemming
