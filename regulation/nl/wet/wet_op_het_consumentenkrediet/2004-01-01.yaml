        artikel: '77'
        hoofdstuk: X
  - number: '76'
    text: |-
      [Artikel 75, derde en vierde lid][ref1], is van overeenkomstige toepassing met betrekking tot de
      inwerkingtreding van een verhoging van het in [artikel 3, eerste lid][ref2], genoemde bedrag, op grond van
      [artikel 3, derde lid][ref3], alsmede een verlaging van het in [artikel 45, vierde lid][ref4], genoemde bedrag, op
      grond van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel3
