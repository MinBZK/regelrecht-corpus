  - number: '66.3'
    text: |-
      Een ministeriële regeling als bedoeld in de [artikelen 4, eerste lid, onder ][ref1], [14][ref2],
      [20, tweede lid][ref3], [22, tweede lid][ref4], [24, tweede lid][ref5], [25, tweede en derde lid][ref6],
