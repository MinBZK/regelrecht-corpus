  - number: '77'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een ander
      tijdstip worden vastgesteld, waarop [hoofdstuk VII][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0004815/2004-01-01#Artikel77
