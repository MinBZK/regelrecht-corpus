---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_consumentenkrediet
regulatory_layer: WET
publication_date: '2016-10-14'
valid_from: '2014-04-01'
bwb_id: BWBR0004815
url: https://wetten.overheid.nl/BWBR0004815/2014-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe regels te geven met betrekking tot het
    consumentenkrediet, mede ter vervanging van de bepalingen van de Wet op het consumptief geldkrediet (Stb. 1972,
    399) en de Wet op het afbetalingsstelsel 1961 (Stb. 1976, 515) en, in verband daarmee, de Colportagewet (Stb.
    1973, 438) te wijzigen en voorts, dat de richtlijn (EEG) nr. 87/102 van de Raad van de Europese Gemeenschappen, van
    22 december 1986, betreffende de harmonisatie van de wettelijke en bestuursrechtelijke bepalingen der Lid-Staten
    inzake het consumentenkrediet (PbEG L 42), noodzaakt tot het vaststellen van een aantal wettelijke bepalingen met
    betrekking tot het consumentenkrediet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.a
    text: '*krediettransactie:* iedere overeenkomst en ieder samenstel van overeenkomsten met de strekking dat:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.a.1°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer) een geldsom ter
      beschikking wordt gesteld en de tweede partij aan de eerste partij een of meer betalingen doet,
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.a.2°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer) het genot van een
      roerende zaak wordt verschaft of een bij algemene maatregel van bestuur aangewezen dienst wordt verleend en de
      tweede partij aan de eerste partij een of meer betalingen doet, of
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.a.3°
    text: |-
      door of vanwege de eerste partij (de kredietgever) aan de tweede partij (de kredietnemer), dan wel ten behoeve van
      deze aan een derde partij (de leverancier) een geldsom ter beschikking wordt gesteld ter zake van het verschaffen
      van het genot van een roerende zaak of het verlenen van een bij algemene maatregel van bestuur aangewezen dienst
      aan de tweede partij, en de tweede partij aan de eerste partij of aan de derde partij een of meer betalingen doet;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.b
    text: '*krediet verlenen:* het als kredietgever deelnemen aan een krediettransactie;'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.c
    text: |-
      *kredietbemiddeling:* alle bedrijfs- of beroepsmatige verrichtingen en bemoeiingen, gericht op het tot stand
      brengen van een krediettransactie, van iemand (de kredietbemiddelaar) die geen partij is bij die transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.d
    text: '*geldkrediet:* een krediettransactie als bedoeld onder *a*, 1°;'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.e
    text: '*goederenkrediet:* een krediettransactie als bedoeld onder *a*, 2° of 3°;'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.f
    text: |-
      *doorlopend geldkrediet:* een geldkrediet, waarbij de kredietnemer op verschillende tijdstippen geldsommen bij de
      kredietgever kan opnemen, voor zover het uitstaand saldo een bepaald bedrag (de kredietlimiet) niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.g
    text: |-
      *doorlopend goederenkrediet:* een goederenkrediet, waarbij de kredietgever dan wel de leverancier ervoor heeft te
      zorgen, dat aan de kredietnemer op verschillende tijdstippen het genot van zaken wordt verschaft of diensten worden
      verleend, voor zover het uitstaand saldo een bepaald bedrag (de kredietlimiet) niet overschrijdt;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.h
    text: |-
      *uitstaand saldo bij geldkrediet:* het op enig tijdstip bestaande totaal van de tot en met dat tijdstip door
      de kredietnemer opgenomen geldsommen, vermeerderd met de tot en met dat tijdstip aan deze in rekening gebrachte
      kredietvergoeding en verminderd met de door deze tot en met dat tijdstip gedane betalingen;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.i
    text: |-
      *uitstaand saldo bij goederenkrediet:* het op enig tijdstip bestaande totaal van de contantprijzen van de
      zaken onderscheidenlijk diensten, waarvan aan de kredietnemer tot en met dat tijdstip het genot is verschaft,
      onderscheidenlijk welke aan de kredietnemer zijn verleend, vermeerderd met het totaalbedrag van de in dat kader tot
      en met dat tijdstip aan de kredietnemer in rekening gebrachte kredietvergoeding en verminderd met het totaalbedrag
      van de in dat kader tot en met dat tijdstip door de kredietnemer gedane betalingen;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.j
    text: |-
      *kredietvergoeding:* alle beloningen en vergoedingen, in welke vorm ook, die de kredietgever of de leverancier
      ter zake van een krediettransactie bedingt, in rekening brengt of aanvaardt, bij goederenkrediet verminderd met
      het totaal van de contantprijzen van de zaken onderscheidenlijk diensten, waarvan de kredietnemer het genot wordt
      verschaft onderscheidenlijk welke aan de kredietnemer worden verleend;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.k
    text: |-
      *effectief kredietvergoedingspercentage op jaarbasis:* de bij afwikkeling van een krediettransactie overeenkomstig
      de betalingsregeling aan de kredietnemer in rekening te brengen kredietvergoeding, uitgedrukt in een percentage op
      jaarbasis van het uitstaand saldo;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.l
    text: |-
      *kredietsom bij geldkrediet:* de geldsom die de kredietnemer in het kader van een geldkrediet ter beschikking wordt
      gesteld, met dien verstande, dat bij doorlopend geldkrediet de kredietlimiet als die geldsom wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.m
    text: |-
      *kredietsom bij goederenkrediet:* het verschil tussen het totaal van de contantprijzen van de zaken
      onderscheidenlijk diensten, waarvan de kredietnemer het genot wordt verschaft, onderscheidenlijk welke aan de
      kredietnemer worden verleend, en de door deze in dat kader gedane contante betalingen, met dien verstande, dat bij
      doorlopend goederenkrediet de kredietlimiet als dat verschil wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.n
    text: '*gemeentelijke kredietbank:* een instelling voor kredietverlening, opgericht door een of meer gemeenten;'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: 1.o
    text: '*Onze Minister:* Onze Minister van Financiën.'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel1
  - number: '2.1'
    text: |-
      Onverminderd de bepalingen van [titel 2A van Boek 7 van het Burgerlijk Wetboek][ref1] gelden voor de daar geregelde
      kredietovereenkomsten de volgende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '2.2'
    text: |-
      Onverminderd de bepalingen van [titel 2A van Boek 7 van het Burgerlijk Wetboek][ref1] gelden, in afwijking van
      het eerste lid, voor krediettransacties waarbij de betalingen van de kredietnemer plaatsvinden binnen drie maanden
      nadat de geldsom ter beschikking is gesteld, onderscheidenlijk nadat met het verschaffen van het genot van de zaak
      of het verlenen van de dienst een aanvang is gemaakt, uitsluitend de [artikelen 34 tot en met 36][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid, gelden de volgende bepalingen niet voor de overeenkomst betreffende
      effectenkrediet, bedoeld in [artikel 57 lid 1, onderdeel o, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel57
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '57'
  - number: '3.1'
    text: Deze wet geldt niet voor krediettransacties, waarbij de kredietsom meer dan € 40 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel3
  - number: '5'
    text: |-
      De [artikelen 33, onder d][ref1], en [40][ref2] gelden niet voor kredietverlening door een gemeentelijke
      kredietbank:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '33'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: 5.a
    text: 'waaraan als kredietnemer deelneemt:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
  - number: 5.a.1°
    text: |-
      echtgenoten of geregistreerde partners als bedoeld in [artikel 3 van de Wet werk en bijstand][ref1], van wie het
      gezamenlijk netto maandinkomen niet hoger is dan de norm genoemd in [artikel 21, onderdeel c, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 5.a.2°
    text: |-
      een alleenstaande ouder als bedoeld in [artikel 4, onderdeel b, van de Wet werk en bijstand][ref1], van wie het
      netto maandinkomen niet hoger is dan negentig procent van de norm bedoeld onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '4'
  - number: 5.a.3°
    text: |-
      een alleenstaande als bedoeld in [artikel 4, onderdeel a, van de Wet werk en bijstand][ref1], van wie het netto
      maandinkomen niet hoger is dan zeventig procent van de norm bedoeld onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel4
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '4'
  - number: 5.b
    text: in het kader van een regeling met betrekking tot de bestaande schuldenlast van een kredietnemer (saneringskrediet).
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel5
  - number: '31.1'
    text: |-
      Een kredietnemer kan geen volmacht tot ondertekening van een overeenkomst als bedoeld in
      [artikel 61 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], verlenen aan een kredietgever, een leverancier, een
      kredietbemiddelaar of iemand, die bij een van hen werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
  - number: '31.2'
    text: |-
      Bedingen waarbij aan de kredietnemer een verplichting wordt opgelegd of een recht wordt ontnomen ingeval hij een
      beroep op de ongeldigheid van de volmacht doet, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel31
  - number: '31.3'
    text: |-
      De kredietnemer kan geen onherroepelijke volmacht tot ondertekening van een overeenkomst als bedoeld in
      [artikel 61 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], verlenen. Bedingen waarbij aan de kredietnemer
      een verplichting wordt opgelegd of een recht wordt ontnomen ingeval hij een volmacht tot zodanige ondertekening
      herroept, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
  - number: '33'
    text: |-
      Nietig is een overeenkomst als bedoeld in [artikel 61 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], voor
      zover daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
  - number: 33.a
    text: |-
      de kredietgever of leverancier de bevoegdheid wordt verleend, anders dan bij wijze van een verhoging van
      de kredietvergoeding welke is toegelaten ingevolge het bepaalde krachtens [artikel 35][ref1], eenzijdig de
      kredietvergoeding te verhogen of anderszins de verplichtingen van de kredietnemer te verzwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: 33.b
    text: 'de kredietnemer zich verplicht tot het aangaan van een andere overeenkomst, anders dan ingeval:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.b.1°
    text: |-
      uitdrukkelijk aan de kredietnemer het recht wordt toegekend te bepalen met welke wederpartij die overeenkomst zal
      worden aangegaan, of
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.b.2°
    text: |-
      de overeenkomst verplicht tot het aanhouden van een betaalrekening bij de kredietgever, door middel waarvan de uit
      de krediettransactie voortvloeiende betalingen dienen plaats te vinden;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c
    text: 'vervroegde opeisbaarheid van het door de kredietnemer verschuldigde wordt bedongen, anders dan voor het geval dat:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.1°
    text: |-
      de kredietnemer, die gedurende ten minste twee maanden achterstallig is in de betaling van een vervallen
      termijnbedrag, na in gebreke te zijn gesteld nalatig blijft in de nakoming van zijn verplichtingen,
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.2°
    text: |-
      de kredietnemer Nederland metterwoon heeft verlaten, dan wel redelijkerwijs kan worden aangenomen dat de
      kredietnemer binnen enkele maanden Nederland metterwoon zal verlaten,
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.3°
    text: |-
      de kredietnemer is overleden en de kredietgever gegronde reden heeft om aan te nemen dat diens verplichtingen uit
      hoofde van de overeenkomst niet zullen worden nagekomen,
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.4°
    text: |-
      de kredietnemer in staat van faillissement is komen te verkeren of ten aanzien van de kredietnemer de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard,
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.5°
    text: de kredietnemer de tot zekerheid verbonden zaak heeft verduisterd, of
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.c.6°
    text: |-
      de kredietnemer aan de kredietgever, met het oog op het aangaan van de overeenkomst, bewust onjuiste inlichtingen
      heeft verstrekt van dien aard, dat de kredietgever de overeenkomst niet of niet onder dezelfde voorwaarden zou
      hebben aangegaan indien hem de juiste stand van zaken bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.d
    text: |-
      de kredietnemer enig recht op arbeidsloon, salaris, pensioen, andere inkomsten uit arbeid of uitkering ingevolge
      een sociale verzekeringswet, dan wel levensonderhoud, verschuldigd ingevolge Boek 1 van het Burgerlijk Wetboek,
      ter zake van een krediettransactie op enigerlei wijze overdraagt, vervreemdt of bezwaart, dan wel tot invordering
      daarvan een onherroepelijke volmacht, in welke vorm of onder welke benaming ook, verleent;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
  - number: 33.e
    text: |-
      wordt afgeweken van het bepaalde bij of krachtens de [artikelen 34 tot en met 46][ref1], met uitzondering van een
      afwijking als bedoeld in [artikel 42, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel42
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '42'
        hoofdstuk: IV
        afdeling: '4'
  - number: '34'
    text: |-
      Het is de kredietgever en de leverancier verboden enige andere vorm van kredietvergoeding te bedingen, in rekening
      te brengen of te aanvaarden dan:
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel34
  - number: 34.a
    text: een vergoeding welke verschuldigd is bij afwikkeling overeenkomstig de betalingsregeling van de transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel34
  - number: 34.b
    text: |-
      een vergoeding die verschuldigd wordt ingeval de kredietnemer, na ingebrekestelling, nalatig blijft in zijn
      verplichting tot betaling ingevolge de transactie;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel34
  - number: 34.c
    text: een vergoeding die verschuldigd wordt indien de kredietnemer vervroegd aflost.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel34
  - number: '35.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt, ten einde het aanvaarden door kredietgevers van te
      grote risico’s tegen te gaan, de ten hoogste toegelaten kredietvergoeding vastgesteld en worden regels gegeven
      betreffende de tijdstippen waarop de kredietvergoeding in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel35
  - number: '35.2'
    text: |-
      De ten hoogste toegelaten kredietvergoeding wordt uitgedrukt in een geldsom, een percentage of in enige andere
      vorm. Deze kan verschillen naar gelang van de hoogte van de kredietsom, de looptijd van de transactie, mede in
      verband met de termijnen van aflossing, de vorm van de kredietvergoeding bedoeld in [artikel 34][ref1], en het al
      dan niet variabel zijn van de kredietvergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '35.3'
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, wordt bepaald dat ter zake van krediettransacties, waarbij de
      kredietvergoeding variabel is, geen vergoeding als bedoeld in [artikel 34, onder ][ref1], is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '36'
    text: |-
      Het is de kredietgever en de leverancier verboden een hogere kredietvergoeding in rekening te brengen, te bedingen
      of te aanvaarden, dan wel kredietvergoeding op een ander tijdstip in rekening te brengen, dan is toegelaten
      ingevolge [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
  - number: '38'
    text: 'Het is de kredietgever en de leverancier verboden:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel38
  - number: 38.a
    text: |-
      ter zake van nog niet opeisbare verplichtingen van de kredietnemer andere dan chartale betaalmiddelen aan te nemen,
      anders dan voor volledige of gedeeltelijke vervroegde aflossing.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel38
  - number: '40.1'
    text: |-
      Het is de kredietgever en de leverancier slechts toegestaan tot zekerheid van de nakoming van een
      verbintenis van de kredietnemer uit hoofde van een krediettransactie, een pandrecht als bedoeld in
      [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1] te vestigen op een zaak, indien die zaak door de
      kredietnemer met het geleende geld wordt aangeschaft of aan de kredietnemer ingevolge de transactie het genot van
      die zaak wordt verschaft. De eerste volzin is van overeenkomstige toepassing ten aanzien van het bedingen van een
      eigendomsvoorbehoud alsmede ten aanzien van het vestigen van een pandrecht op een vordering van de kredietnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
  - number: '40.2'
    text: |-
      Een pandrecht als bedoeld in [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1] dat in het kader van een
      doorlopende krediettransactie op een zaak is gevestigd, eindigt van rechtswege en de eigendom van een zaak die in
      het kader van een doorlopende krediettransactie is voorbehouden, gaat van rechtswege over op de kredietnemer zodra
      deze aflossingen heeft gedaan ter grootte van het verschil tussen de contantprijs van die zaak en het bedrag van de
      contante betaling betreffende het genot van die zaak, dan wel, indien geen contante betaling is gedaan, ter grootte
      van die contantprijs. Aflossingen worden bij goederenkrediet toegerekend aan verschillende zaken in dezelfde
      volgorde als waarin met het verschaffen van het genot daarvan een aanvang is gemaakt en bij geldkrediet in dezelfde
      volgorde als waarin zij zijn aangeschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
  - number: '41.1'
    text: |-
      Afgifte van een zaak, waarop een pandrecht als bedoeld in [artikel 237 van Boek 3 van het Burgerlijk Wetboek][ref1]
      is gevestigd of waarvan de eigendom is voorbehouden in het kader van een krediettransactie,
      kan slechts worden gevorderd in de gevallen, bedoeld in [artikel 33, onder ][ref2].
      [Artikel 496, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel496
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '33'
        hoofdstuk: IV
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '496'
  - number: '41.2'
    text: |-
      Afgifte van een zaak als bedoeld in het eerste lid kan niet meer worden gevorderd indien meer dan drie vierde
      deel van de kredietsom is afgelost. De vorige volzin vindt geen toepassing met betrekking tot doorlopende
      krediettransacties.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel41
  - number: '41.3'
    text: |-
      Afgifte van een zaak als bedoeld in het eerste lid heeft, indien zij geschiedt in overeenstemming met het
      bepaalde in dit artikel, tot gevolg dat de tot de krediettransactie behorende overeenkomsten van rechtswege worden
      ontbonden.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel41
  - number: '41.4'
    text: |-
      De kredietnemer kan niet worden verplicht de kredietgever of de leverancier toe te laten tot zijn woning of erf om
      de tot zekerheid dienende zaak te bezichtigen of tot zich te nemen.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel41
  - number: '42.1'
    text: |-
      Indien de kredietnemer binnen veertien dagen nadat hij de zaak heeft afgegeven het totale op het tijdstip van
      inlossing achterstallige bedrag, benevens de vergoeding, bedoeld in [artikel 34, onder ][ref1], betaalt, wordt de
      zaak door de kredietgever teruggegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
  - number: '42.2'
    text: |-
      Door de in het eerste lid bedoelde betaling wordt de ontbinding van de tot de krediettransactie behorende
      overeenkomsten ongedaan gemaakt.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel42
  - number: '42.3'
    text: |-
      Bij herhaalde afgifte van de zaak behoeft deze door de kredietgever slechts te worden teruggegeven na betaling
      door de kredietnemer van het in het eerste lid bedoelde bedrag, benevens het restant van de kredietsom,
      alsmede de bedongen kredietvergoeding, voor zover toegelaten ingevolge [artikel 35][ref1], met dien verstande,
      dat bij een doorlopende krediettransactie in plaats van het restant van de kredietsom het restant van de in
      [artikel 40, tweede lid, eerste volzin][ref2], bedoelde aflossingen moet worden betaald; de tweede volzin van dat
      lid vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '35'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '42.4'
    text: |-
      Indien de kredietgever een redelijk belang heeft bij weigering van de teruggave, kan de rechter bepalen dat het
      eerste lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel42
  - number: '42.5'
    text: Van de bepalingen van dit artikel kan door partijen slechts ten voordele van de kredietnemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel42
  - number: '43.1'
    text: |-
      In afwijking van [artikel 229 van Boek 3 van het Burgerlijk Wetboek][ref1] ontstaat een pandrecht op een vordering
      tot vergoeding die in de plaats treedt van een zaak als bedoeld in [artikel 40, eerste lid][ref2], slechts voor het
      geval die zaak geheel teniet gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '43.2'
    text: 'Een pandrecht als bedoeld in het eerste lid eindigt van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
  - number: 43.2.a
    text: indien de kredietnemer gelijkwaardige vervangende zekerheid stelt, of
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
  - number: 43.2.b
    text: zodra de kredietnemer drie vierde deel van de kredietsom heeft afgelost.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
  - number: '43.3'
    text: |-
      De kredietgever, onderscheidenlijk de leverancier, die tot inning van de in het eerste lid bedoelde verpande
      vordering overgaat, stelt de kredietnemer daarvan terstond schriftelijk in kennis. Daarbij deelt hij de
      kredietnemer mee dat deze in de gelegenheid is om gelijkwaardige vervangende zekerheid te stellen. [Artikel
      40, eerste lid](onbekend), is niet van toepassing ten aanzien van de door de kredietnemer gestelde vervangende
      zekerheid.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
  - number: '43.4'
    text: |-
      [Artikel 229 van Boek 3 van het Burgerlijk Wetboek][ref1] en het eerste tot en met het derde lid zijn
      van overeenkomstige toepassing bij een eigendomsvoorbehoud ten aanzien van een zaak als bedoeld in
      [artikel 40, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel40
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '40'
        hoofdstuk: IV
        afdeling: '4'
  - number: '44.1'
    text: |-
      Een overeenkomst als bedoeld in [artikel 61 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1], kan slechts door
      rechterlijke tussenkomst worden ontbonden, behoudens het bepaalde in [artikel 41, derde lid][ref2], van deze wet en
      de [artikelen 37][ref3] en [38a van de Faillissementswet][ref4] (*Stb.* 1893, 140).


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel38a
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '61'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '41'
        hoofdstuk: IV
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0001860
        artikel: 38a
  - number: '44.2'
    text: |-
      Indien bij ontbinding van zodanige overeenkomst een der partijen in een betere vermogenstoestand zou geraken dan
      bij het in stand blijven van die overeenkomst en afwikkeling overeenkomstig de betalingsregeling, vindt volledige
      verrekening plaats.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel44
  - number: '46'
    text: |-
      De bepalingen van dit hoofdstuk omtrent nietigheid en vernietigbaarheid zijn mede van toepassing op overeenkomsten
      als bedoeld in [artikel 30, eerste lid][ref1], die buiten Nederland worden gesloten door een buiten Nederland
      gevestigde kredietgever of leverancier met een kredietnemer die zijn gewone verblijfplaats in Nederland heeft en
      die het krediet in Nederland heeft aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel30
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '30'
        hoofdstuk: IV
        afdeling: '1'
  - number: '47.1'
    text: Schuldbemiddeling is verboden.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel47
  - number: '47.2'
    text: |-
      Onder schuldbemiddeling wordt verstaan het in de uitoefening van een bedrijf of beroep, anders dan door het aangaan
      van een krediettransactie, verrichten van diensten, gericht op de totstandkoming van een regeling met betrekking
      tot de bestaande schuldenlast van een natuurlijke persoon, geheel of gedeeltelijk voortvloeiend uit een of meer
      krediettransacties.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel47
  - number: '48.1'
    text: |-
      Het in [artikel 47, eerste lid][ref1], bedoelde verbod is niet van toepassing op schuldbemiddeling:


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel47
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '47'
        hoofdstuk: V
  - number: 48.1.a
    text: om niet;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
  - number: 48.1.b
    text: |-
      door gemeenten, gemeentelijke kredietbanken of andere door gemeenten gehouden instellingen, die zich krachtens hun
      doelstelling met schuldbemiddeling bezighouden;
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
  - number: 48.1.c
    text: |-
      door advocaten, curatoren en bewindvoerders ingevolge de [Faillissementswet][ref1] of ingevolge
      [artikel 383, zevende lid][ref2], dan wel [artikel 435, zevende lid, van Boek 1 van het Burgerlijk Wetboek][ref3],
      notarissen, deurwaarders, registeraccountants en accountants-administratieconsulenten;


      [ref1]: https://wetten.overheid.nl/BWBR0001860
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel383
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel435
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001860
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '383'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '435'
  - number: 48.1.d
    text: |-
      door natuurlijke personen of rechtspersonen, dan wel categorieën daarvan, aan te wijzen bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
  - number: '48.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor het verrichten van schuldbemiddeling als bedoeld
      in het eerste lid een certificaat is vereist en dat de vergoeding voor schuldbemiddeling voor ingevolge het
      eerste lid, onder *d*, aangewezen personen of categorieën van personen niet meer mag bedragen dan een daarbij
      te bepalen percentage van het bedrag van de schulden, voor zover daaromtrent een regeling is tot stand gekomen,
      dat de vergoeding niet meer mag bedragen dan de kosten van de bemiddeling, alsmede dat geen vergoeding mag
      worden bedongen, in rekening gebracht of aanvaard indien geen regeling is tot stand gekomen. Deze regels kunnen
      verschillen naar gelang van de aangewezen personen of categorieën van personen, waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
  - number: '48.3'
    text: Nietig is een overeenkomst, voor zover daarbij wordt afgeweken van het bij of krachtens het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48
  - number: 48a
    text: |-
      Met het toezicht op de naleving van het bij of krachtens dit hoofdstuk bepaalde zijn belast de bij ministeriële
      regeling aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel48a
  - number: '69'
    text: |-
      Overtreding van voorschriften, gesteld bij of krachtens de [artikelen 34][ref1], [36][ref2] en [38][ref3] is
      slechts strafbaar voor zover deze van toepassing zijn op een leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0004815#Artikel38
    url: https://wetten.overheid.nl/BWBR0004815/2014-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '34'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004815
        artikel: '36'
        hoofdstuk: IV
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004815
        artikel: '38'
        hoofdstuk: IV
        afdeling: '3'
