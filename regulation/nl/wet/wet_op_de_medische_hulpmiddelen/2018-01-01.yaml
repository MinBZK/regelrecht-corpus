---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_medische_hulpmiddelen
regulatory_layer: WET
publication_date: '2021-03-17'
valid_from: '2018-01-01'
bwb_id: BWBR0002697
url: https://wetten.overheid.nl/BWBR0002697/2018-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de volksgezondheid regelen te stellen
    met betrekking tot medische hulpmiddelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: 1.1.a
    text: |-
      medisch hulpmiddel: elk instrument, toestel of apparaat, elke software of stof of elk ander artikel dat of die
      alleen of in combinatie wordt gebruikt, met inbegrip van elk hulpstuk en de software die voor de goede werking
      ervan benodigd is, dat of die door de fabrikant speciaal is bestemd om te worden gebruikt voor diagnostische of
      therapeutische doeleinden, en door de fabrikant is bestemd om bij de mens te worden aangewend voor: - diagnose,
      preventie, bewaking, behandeling of verlichting van ziekten,
        - diagnose, bewaking, behandeling, verlichting of compensatie van verwondingen of een handicap,
        - onderzoek naar of vervanging of wijziging van de anatomie of van een fysiologisch proces,
        - beheersing van de bevruchting, waarbij de belangrijkste beoogde werking in of aan het menselijk lichaam niet met
      farmacologische of immunologische middelen of door metabolisme wordt bereikt, maar wel door dergelijke middelen kan
      worden ondersteund;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: 1.1.b
    text: 'voorhanden hebben: ter aflevering voorhanden hebben;'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: 1.1.c
    text: 'toepassen: bezigen bij wege van uitoefening van enige functie in het maatschappelijk verkeer;'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: 1.1.d
    text: |-
      gebruiker: degene, die een medisch hulpmiddel bezigt anders dan bij wege van uitoefening van enige functie in het
      maatschappelijk verkeer;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: 1.1.e
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport.'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: '1.2'
    text: Deze wet is niet van toepassing op geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel1
  - number: '2'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de volksgezondheid worden bepaald, dat het verboden is
      medische hulpmiddelen van een bij de maatregel aangewezen soort te vervaardigen:
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel2
  - number: 2.a
    text: zonder vergunning van een bij de maatregel aangewezen orgaan van de centrale overheid;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel2
  - number: 2.b
    text: anders dan met inachtneming van de bij of krachtens de maatregel gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de volksgezondheid worden bepaald, dat het verboden is
      medische hulpmiddelen van een bij de maatregel aangewezen soort in te voeren, voorhanden te hebben, af te leveren
      of toe te passen:
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.a
    text: indien zij niet voldoen aan de bij of krachtens de maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.b
    text: |-
      indien zij niet voorzien zijn van een bewijs, dat zij door een bij of krachtens de maatregel aangewezen dienst of
      instelling zijn goedgekeurd, dan wel indien zij niet voorzien zijn van een bewijs, dat zij overeenstemmen met een
      door zodanige dienst of instelling goedgekeurd monster;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.c
    text: zonder vergunning van een bij de maatregel aangewezen orgaan van de centrale overheid;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.d
    text: indien de verpakking niet voldoet aan de bij of krachtens de maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.e
    text: |-
      indien niet voldaan is aan de voorschriften, bij of krachtens de maatregel gesteld omtrent het vermeld zijn, op of
      bij het middel of op de verpakking daarvan, van op het middel betrekking hebbende gegevens;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: 3.1.f
    text: anders dan met inachtneming van de bij of krachtens de maatregel gestelde andere voorschriften.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: '3.2'
    text: |-
      In geval van toepassing van het eerste lid, onder *b*, worden tevens bij of krachtens algemene maatregel
      van bestuur de bij de keuring te hanteren maatstaven vastgesteld en regelen gesteld omtrent de bewijzen van
      goedkeuring. In zodanig geval kunnen voorts bij of krachtens algemene maatregel van bestuur verdere regelen, de
      keuring betreffende, worden gesteld en kan bij algemene maatregel van bestuur worden bepaald dat ter zake van
      keuring een keurloon overeenkomstig de bij de maatregel gestelde regelen verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de volksgezondheid ten aanzien van medische hulpmiddelen
      van een bij de maatregel aangewezen soort worden bepaald:
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel4
  - number: 4.a
    text: dat het verboden is deze aan gebruikers af te leveren;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel4
  - number: 4.b
    text: |-
      dat het aan anderen dan personen, behorende tot een bij de maatregel aangewezen categorie, verboden is deze aan
      gebruikers af te leveren;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel4
  - number: 4.c
    text: |-
      dat het verboden is deze aan gebruikers af te leveren anders dan op voorschrift van een deskundige, behorende tot
      een bij de maatregel aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel4
  - number: '5'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van medische hulpmiddelen van een daarbij aangewezen soort,
      die ernstig gevaar voor de gezondheid kunnen opleveren, worden bepaald, dat het verboden is deze middelen te
      vervaardigen, in te voeren, voorhanden te hebben, af te leveren of toe te passen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel5
  - number: '6'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in een der [artikelen 2][ref1]-[5][ref2] wordt
      in de *Staatscourant* bekend gemaakt. De voordracht tot zodanige maatregel wordt Ons niet gedaan dan nadat twee
      maanden sinds die bekendmaking zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel5
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '5'
  - number: '7.1'
    text: |-
      Indien naar zijn oordeel het belang van de volksgezondheid een onverwijlde voorziening vordert, kan Onze Minister
      regelen als bedoeld in de [artikelen 2][ref1]-[5][ref2] stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel5
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '5'
  - number: '7.2'
    text: |-
      Een krachtens het eerste lid vastgesteld besluit wordt in de *Staatscourant* bekend gemaakt en vervalt, behoudens
      eerdere intrekking, twaalf maanden na zijn in werking treden.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan op aanvrage ontheffing verlenen van het krachtens een der [artikelen 2][ref1]-[5][ref2] dan wel
      krachtens [artikel 7][ref3] bepaalde. Onze Minister kan voorts op aanvrage en ten behoeve van de uitvoer van een
      specifiek medisch hulpmiddel dat voldoet aan het bij of krachtens deze wet bepaalde een verklaring afgeven met de
      strekking dat het medisch hulpmiddel in de lidstaten van de Europese Unie mag worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002697#Artikel7
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002697
        artikel: '7'
  - number: '8.2'
    text: |-
      Onze Minister kan de hem in het eerste lid toekomende bevoegdheid delegeren aan een door hem aan te wijzen ander
      orgaan van de centrale overheid.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel8
  - number: '8.3'
    text: Een krachtens het tweede lid vastgesteld besluit wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een vergunning of ontheffing kan onder beperkingen worden verleend. Aan een vergunning of ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel9
  - number: '9.2'
    text: |-
      Ingeval regelen worden vastgesteld krachtens een der [artikelen 2][ref1]-[5][ref2], kunnen tevens bij of krachtens
      algemene maatregel van bestuur met betrekking tot vergunningen en ontheffingen nadere regelen worden gesteld.
      Ingeval regelen worden vastgesteld krachtens [artikel 7][ref3] kunnen daarbij overeenkomstige voorzieningen worden
      getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002697#Artikel7
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0002697
        artikel: '7'
  - number: '9.3'
    text: |-
      Het is verboden ter zake van een aanvrage om vergunning of ontheffing onjuiste of onvolledige gegevens te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister wijst op aanvraag een of meer instellingen aan, die bevoegd zijn de door hem aan te wijzen procedures
      uit te voeren betreffende de goedkeuring, bedoeld in [artikel 3, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel3
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '3'
  - number: '10.2'
    text: |-
      Een aangewezen instelling is bevoegd om met inachtneming van de door Onze Minister gegeven aanwijzingen onderdelen
      van de door haar uit te voeren procedures door anderen te doen uitvoeren.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de gronden waarop
      de aanwijzing kan worden gegeven, ingetrokken dan wel gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10
  - number: '10.4'
    text: Aan een aanwijzing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10
  - number: 10a
    text: |-
      Onze Minister ziet toe op de rechtmatige en doeltreffende uitvoering van het bepaalde bij of krachtens deze wet
      door de krachtens [artikel 10][ref1] aangewezen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10b.1
    text: |-
      De krachtens [artikel 10][ref1] aangewezen instellingen verstrekken desgevraagd kosteloos aan Onze Minister de voor
      de uitoefening van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en
      bescheiden voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10b.2
    text: |-
      De krachtens [artikel 10][ref1] aangewezen instellingen zenden Onze Minister jaarlijks een verslag betreffende de
      door de instelling krachtens de aanwijzing verrichte werkzaamheden en de rechtmatigheid en doeltreffendheid van die
      werkzaamheden en werkwijze in het afgelopen jaar. Onze Minister kan met betrekking tot dit verslag nadere regels
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10c.1
    text: |-
      Onze Minister kan een krachtens [artikel 10][ref1] aangewezen instelling algemene aanwijzingen geven met betrekking
      tot de uitoefening van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10c.2
    text: De instelling is gehouden overeenkomstig de aanwijzingen te handelen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10c
  - number: 10d.1
    text: |-
      Indien naar het oordeel van Onze Minister een krachtens [artikel 10][ref1] aangewezen instelling de procedures,
      bedoeld in het eerste lid van dat artikel, niet of niet naar behoren uitvoert, kan Onze Minister de noodzakelijke
      voorzieningen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10d.2
    text: |-
      De in het eerste lid bedoelde voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan
      nadat de betrokken instelling in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn
      alsnog de procedures naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10d
  - number: 10e
    text: Tegen een beschikking inzake goedkeuring kan een belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10e
  - number: 10f
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de wet waarbij dit artikel in deze wet is
      ingevoegd, en vervolgens telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en
      doelmatigheid van het functioneren van de krachtens [artikel 10][ref1] aangewezen instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10f
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '10'
  - number: 10g.1
    text: |-
      De kosten die samenhangen met de bij of krachtens deze wet door Onze Minister of door het op grond van
      [artikel 8, tweede lid][ref1], aangewezen andere orgaan van de centrale overheid, dan wel ingevolge de krachtens
      [artikel 3, eerste lid][ref2], vastgestelde regels, verrichte werkzaamheden en afgegeven documenten, kunnen ten
      laste worden gebracht van degene ten behoeve van wie deze werkzaamheden worden verricht of de documenten worden
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel3
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10g
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '3'
  - number: 10g.2
    text: De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10g
  - number: 10h.1
    text: |-
      Voor de toepassing van dit artikel wordt verstaan onder: - *bijeenkomst:* een georganiseerde samenkomst voor
      natuurlijke personen die betrokken zijn bij de toepassing van een medisch hulpmiddel die kennelijk uitsluitend
      tot doel heeft hun kennis en kunde op het gebied van de beroepsuitoefening, de patiëntenzorg of de toepassing van
      medische hulpmiddelen te bevorderen;
        - *deelnamekosten:* de kosten voor deelname aan bijeenkomsten of manifestaties, waaronder de daaraan verbonden
      reis- en verblijfskosten;
        - *dienstverlening:* het verrichten van een prestatie door een natuurlijke persoon die betrokken is bij de
      toepassing van een medisch hulpmiddel of door een instelling voor de door de leverancier verstrekte of aangeboden
      gelden of op geld waardeerbare goederen of diensten;
        - *gunstbetoon:* het door een leverancier in het vooruitzicht stellen, aanbieden of toekennen van geld of op geld
      waardeerbare diensten of goederen aan een natuurlijke persoon die betrokken is bij de toepassing van een medisch
      hulpmiddel of aan een instelling of zorgverzekeraar met het kennelijke doel de verkoop van een medisch hulpmiddel
      te bevorderen;
        - *instelling:* een instelling als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1];
        - *leverancier:* de natuurlijke persoon of rechtspersoon die een medisch hulpmiddel invoert, voorhanden heeft of
      aflevert;
        - *manifestatie:* een georganiseerde samenkomst van natuurlijke personen die betrokken zijn bij de toepassing van
      een medisch hulpmiddel die kennelijk tot doel heeft het toepassen van medische hulpmiddelen te bevorderen;
        - *zorgverzekeraar:* een zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 10h.2
    text: |-
      Voor de toepassing van dit artikel wordt onder gunstbetoon tevens verstaan het aanvaarden, of het doen van een
      aanbod daartoe, door een natuurlijke persoon die betrokken is bij de toepassing van een medisch hulpmiddel of door
      een instelling of zorgverzekeraar, van geld of op geld waardeerbare diensten of goederen die door een leverancier
      in het vooruitzicht worden gesteld, worden aangeboden of worden toegekend, met het kennelijke doel de verkoop van
      een medisch hulpmiddel te bevorderen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: 10h.3
    text: 'Gunstbetoon is verboden, tenzij:'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: 10h.3.a
    text: |-
      het betreft een vergoeding van of het niet in rekening brengen van deelnamekosten, mits dit beperkt blijft tot
      hetgeen strikt noodzakelijk is om aan de bijeenkomst of manifestatie deel te nemen;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: 10h.3.b
    text: |-
      het betreft dienstverlening, mits deze redelijk is in verhouding tot het verstrekte of aangeboden geld of tot de
      op geld waardeerbare goederen of diensten, in een schriftelijke overeenkomst is vastgelegd en relevant is voor de
      leverancier of voor de beroepsuitoefening van de natuurlijke persoon die betrokken is bij de toepassing van een
      medisch hulpmiddel;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: 10h.3.c
    text: |-
      het betreft geld of op geld waardeerbare diensten of goederen, waartegenover geen prestatie staat van de
      natuurlijke persoon die betrokken is bij de toepassing van een medisch hulpmiddel, mits deze een geringe waarde
      hebben en relevant zijn voor de uitoefening van diens beroep;
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: 10h.3.d
    text: het betreft kortingen en bonussen die betrekking hebben op de inkoop van medische hulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel10h
  - number: '11.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid, alsmede andere ambtenaren met
      betrekking tot medische hulpmiddelen van een bij dat besluit aangewezen soort.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel11
  - number: '11.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel11
  - number: '12'
    text: |-
      De ambtenaren van het Staatstoezicht op de volksgezondheid zijn bevoegd tot het opleggen van een
      last onder bestuursdwang ter handhaving van een bevel als bedoeld in [artikel 12a][ref1], en de bij
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2] gestelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 12a
    text: |-
      De ambtenaren van het Staatstoezicht op de volksgezondheid zijn, ter voorkoming van schade aan de volksgezondheid,
      bevoegd een bevel te geven om de handel, invoer, uitvoer of aflevering van een medisch hulpmiddel op te schorten of
      te beëindigen, alsmede om een medisch hulpmiddel uit de handel te laten nemen.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel12a
  - number: '13.1'
    text: |-
      Hij die een voorwerp - al dan niet zijnde een medisch hulpmiddel - aanprijst als zijnde geschikt voor een der in
      [artikel 1, eerste lid, onder a][ref1], aangegeven functies, terwijl hij weet of redelijkerwijs moet vermoeden,
      dat de aangeprezen geschiktheid ontbreekt of de werkelijke geschiktheid in ernstige mate bij de aangeprezene
      achterblijft, wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel1
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '1'
  - number: '13.2'
    text: |-
      Met gelijke straf wordt gestraft hij die een voorwerp - al dan niet zijnde een medisch hulpmiddel -, dat
      op de verpakking of op een daarbijgevoegd geschrift wordt aangeprezen als zijnde geschikt voor een der in
      [artikel 1, eerste lid, onder a][ref1], aangegeven functies, verkoopt, ten verkoop aanbiedt, aflevert, verhuurt of
      in gebruik afstaat, terwijl hij weet of redelijkerwijs moet vermoeden, dat de aangeprezen geschiktheid ontbreekt of
      de werkelijke geschiktheid in ernstige mate bij de aangeprezene achterblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel1
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '1'
  - number: '13.3'
    text: |-
      Overtreding van [artikel 10h][ref1] is een strafbaar feit en wordt gestraft met hechtenis van ten hoogste zes
      maanden of een boete uit de derde categorie indien in de daaraan voorafgaande vierentwintig maanden tweemaal een
      bestuurlijke boete ter zake van dezelfde gedraging is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel10h
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: 10h
  - number: '13.4'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel13
  - number: '14'
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 900 000,– op te leggen ter zake van een
      gedraging die in strijd is met het bepaalde bij of krachtens [artikel 2][ref1], [3][ref2], [4][ref3], [5][ref4],
      [7, eerste lid][ref5], [9, eerste of derde lid][ref6], [10h][ref7], of [13][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002697#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002697#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002697#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002697#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0002697#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0002697#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0002697#Artikel10h
      [ref8]: https://wetten.overheid.nl/BWBR0002697#Artikel13
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002697
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002697
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002697
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002697
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0002697
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0002697
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0002697
        artikel: 10h
      - id: ref8
        bwb_id: BWBR0002697
        artikel: '13'
  - number: '15.1'
    text: |-
      [Artikel 1 van de Wet op de economische delicten][ref1] wordt aldus gewijzigd dat handelen of nalaten in strijd
      met de voorschriften gesteld bij of krachtens de artikelen 2, 3, eerste lid, 4, 5, 7, eerste lid, 9, eerste en
      derde lid, en 12, eerste lid, van de Wet op de medische hulpmiddelen een economisch delict oplevert, dat als
      overtreding als bedoeld in [artikel 6, eerste lid, onder 4°, van de Wet op de economische delicten][ref2] wordt
      gekwalificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel6
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '6'
  - number: '15.2'
    text: |-
      Onze Minister van Justitie is belast met de aanpassing van [artikel 1 van de Wet op de economische delicten][ref1]
      overeenkomstig het in het vorige lid bepaalde. De hiertoe strekkende beschikking wordt in het *Staatsblad*
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '16.1'
    text: 'Deze wet kan worden aangehaald als: Wet op de medische hulpmiddelen.'
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel16
  - number: '16.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002697/2018-01-01#Artikel16
