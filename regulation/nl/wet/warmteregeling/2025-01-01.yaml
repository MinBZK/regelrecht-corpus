  - number: '4'
    text: |-
      1 Als ernstige storing als bedoeld in [artikel 3a, eerste lid, van de wet][ref1] wordt aangemerkt een storing die
      langer duurt dan 8 uur.

      2 De hoogte van de financiële compensatie per aansluiting van een verbruiker bedraagt EUR 35,– bij een storing met
      een duur van 8 tot 12 uur, vermeerderd met EUR 20,– voor elke volgende aaneengesloten periode van 4 uur.

      3 Een storing:

      a. in een primair warmtenet van een leverancier of netbeheerder vangt voor alle verbruikers die zijn aangesloten
      op het door de storing getroffen primaire warmtenet aan op het tijdstip van ontvangst van de eerste melding van een
      storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door de
      leverancier of de netbeheerder;

      b. in een secundair warmtenet van een leverancier of netbeheerder vangt voor alle verbruikers die zijn aangesloten
      op het door de storing getroffen secundaire warmtenet aan op het tijdstip van ontvangst van de eerste melding van
      een storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door
      de leverancier of de netbeheerder;

      c. in een inpandig leidingstelsel van een gebouweigenaar vangt voor alle verbruikers die zijn aangesloten op het
      door de storing getroffen inpandig leidingstelsel aan op het tijdstip van ontvangst van de eerste melding van een
      storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door de
      leverancier, de netbeheerder of de gebouweigenaar, of

      d. in een aansluiting of een afleverset die eigendom is van een leverancier of netbeheerder vangt voor de getroffen
      verbruiker aan op het tijdstip van de eerste melding van de storing of, indien melding niet plaatsvindt of dit
      eerder is, het tijdstip van vaststelling van de storing door de leverancier of de netbeheerder.

      4 De tijdsduur van de storing waarvoor compensatie moet worden uitgekeerd wordt voor de door de storing getroffen
      verbruikers bepaald als de tijdsduur tussen:

      a. het tijdstip van aanvang van de storing, en

      b. het tijdstip waarop, door middel van een controle door de leverancier of netbeheerder, is vastgesteld dat de
      storing is hersteld voor alle getroffen verbruikers.

      5 Voor het bepalen van het tijdstip waarop de storing is hersteld voor alle getroffen verbruikers kan onderscheid
      worden gemaakt tussen:

      a. de verbruikers die zijn aangesloten op het door de storing getroffen primaire net;

      b. de verbruikers die zijn aangesloten op het door de storing getroffen secundaire net;

      c. de verbruikers die zijn aangesloten op het door de storing getroffen inpandig leidingstelsel van de
      gebouweigenaar, of

      d. de verbruiker van de door de storing getroffen aansluiting of afleverset.

      6 De compensatie wordt door de leverancier binnen zes maanden na het herstel van de onderbreking betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3a
