  - number: '5'
    text: |-
      1 Een leverancier beëindigt de levering van warmte aan een verbruiker niet wegens wanbetaling, tenzij aan de
      procedurele vereisten van de volgende leden en [artikel 5a][ref1] wordt voldaan.

      2 Indien een verbruiker niet binnen de gestelde termijn een vordering tot betaling van een leverancier voldoet,
      verstrekt de desbetreffende leverancier de verbruiker ten minste driemaal een schriftelijke herinnering met een
      nakomingstermijn van ten minste veertien dagen.

      3 De leverancier:

      a. wijst de verbruiker bij die herinnering op de mogelijkheid om een betalingsregeling te treffen en daarover in
      contact te treden;

      b. wijst de verbruiker bij die herinnering op de mogelijkheden voor schuldhulpverlening;

      c. biedt bij de herinnering aan met schriftelijke toestemming van de verbruiker de contactgegevens van de
      verbruiker, diens klantnummer, en informatie over de hoogte van diens schuld aan een instantie ten behoeve van
      schuldhulpverlening te verstrekken, tenzij de verbruiker geen natuurlijk persoon is;

      d. vermeldt bij de herinnering dat de verbruiker niet wordt afgesloten indien de [artikelen 5, eerste lid][ref2],
      [5b][ref3] of [6, tweede lid][ref4], van toepassing zijn.

      4 De leverancier spant zich tot het uiterste in om, zo nodig herhaaldelijk en via diverse communicatiekanalen, in
      persoonlijk contact te treden met de verbruiker.

      5 Onverminderd het vierde lid, biedt de leverancier de verbruiker een redelijke en passende betalingsregeling
      aan. De betalingsregeling omvat in ieder geval afspraken over de betaling en de afwikkeling van de openstaande
      vorderingen.

      6 Een leverancier beëindigt de levering van warmte naar een verbruiker niet wegens wanbetaling indien binnen een
      redelijke termijn een betalingsregeling wordt overeengekomen en nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0033862#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0033862#Artikel6
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
