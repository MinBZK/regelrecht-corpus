    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.i
    text: wat het gebruiksafhankelijk deel is;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.ii
    text: wat het gebruiksonafhankelijk deel is, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.iii
    text: 'indien in de prijs kortingen zijn verwerkt:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.iii.1°
    text: |-
      voor ieder jaar van de looptijd van de overeenkomst op welke wijze de korting in het jaarbedrag tot uitdrukking
      komt;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.iii.2°
    text: wat er gebeurt met het jaarbedrag wanneer de kortingsactie afloopt, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.a.iii.3°
    text: de voorwaarden waaronder van de korting gebruik kan worden gemaakt, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b
    text: het soort tarief, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.i
    text: 'indien er sprake is van een vast tarief:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.i.1°
    text: wat de looptijd is van het tarief, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.i.2°
    text: wat er gebeurt met het tarief na afloop van de looptijd van het vaste tarief, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.ii
    text: 'indien er sprake is van een variabel tarief:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.ii.1°
    text: in welke gevallen het tarief kan worden aangepast;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.ii.2°
    text: hoe vaak een wijziging kan plaatsvinden gedurende de looptijd van de overeenkomst, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.1.b.ii.3°
    text: |-
      wat de gevolgen van de prijswijziging, op basis van het persoonlijk verbruik van de verbruiker, zijn voor de het
      geschatte jaarbedrag en het te betalen voorschot.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
  - number: 3d.2
    text: |-
      Indien een leverancier de prijs waarvoor geleverd wordt, bedoeld in
      [artikel 5c, derde lid, onderdeel c, van het besluit][ref1], wijzigt, informeert hij de verbruiker hier uiterlijk 1
      maand voordat de tariefwijziging wordt geëffectueerd persoonlijk en schriftelijk over.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5c
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5c
  - number: 3e.1
    text: |-
      De transparante informatie over het opzeggen van de overeenkomst, bedoeld in
      [artikel 5c, derde lid, onderdeel d, van het besluit][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5c
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3e
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5c
  - number: 3e.1.a
    text: de voorwaarden waaronder de overeenkomst door de verbruiker of leverancier kan worden beëindigd, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3e
  - number: 3e.1.b
    text: |-
      indien er bij een tussentijdse opzegging van een overeenkomst voor bepaalde tijd een opzegvergoeding verschuldigd
      is, de hoogte van deze opzegvergoeding.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3e
  - number: 3e.2
    text: |-
      Een leverancier informeert een verbruiker schriftelijk en uiterlijk 2 maanden voor het aflopen van de overeenkomst
      over het opzeggen van een overeenkomst of het aflopen van een overeenkomst voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3e
  - number: 3f.1
    text: |-
      De persoonlijke situatie van de verbruiker, bedoeld in [artikel 5c, eerste lid, van het besluit][ref1], is
      gebaseerd op het meest recent beschikbare verbruik van de verbruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5c
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3f
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5c
  - number: 3f.2
    text: |-
      Indien de leverancier deze gegevens niet kan achterhalen en de verbruiker deze informatie niet kan of wil
      verstrekken maakt de leverancier een schatting op basis van door de verbruiker ingevulde kenmerken.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3f
  - number: '4.1'
    text: |-
      Als ernstige storing als bedoeld in [artikel 3a, eerste lid, van de wet][ref1] wordt aangemerkt een storing die
      langer duurt dan 8 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel3a
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 3a
  - number: '4.2'
    text: |-
      De hoogte van de financiële compensatie per aansluiting van een verbruiker bedraagt EUR 35,– bij een storing met
      een duur van 8 tot 12 uur, vermeerderd met EUR 20,– voor elke volgende aaneengesloten periode van 4 uur.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: '4.3'
    text: 'Een storing:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.3.a
    text: |-
      in een primair warmtenet van een leverancier of netbeheerder vangt voor alle verbruikers die zijn aangesloten op
      het door de storing getroffen primaire warmtenet aan op het tijdstip van ontvangst van de eerste melding van een
      storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door de
      leverancier of de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.3.b
    text: |-
      in een secundair warmtenet van een leverancier of netbeheerder vangt voor alle verbruikers die zijn aangesloten op
      het door de storing getroffen secundaire warmtenet aan op het tijdstip van ontvangst van de eerste melding van een
      storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door de
      leverancier of de netbeheerder;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.3.c
    text: |-
      in een inpandig leidingstelsel van een gebouweigenaar vangt voor alle verbruikers die zijn aangesloten op het
      door de storing getroffen inpandig leidingstelsel aan op het tijdstip van ontvangst van de eerste melding van een
      storing of, indien melding niet plaatsvindt of dit eerder is, het tijdstip van vaststelling van de storing door de
      leverancier, de netbeheerder of de gebouweigenaar, of
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.3.d
    text: |-
      in een aansluiting of een afleverset die eigendom is van een leverancier of netbeheerder vangt voor de getroffen
      verbruiker aan op het tijdstip van de eerste melding van de storing of, indien melding niet plaatsvindt of dit
      eerder is, het tijdstip van vaststelling van de storing door de leverancier of de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: '4.4'
    text: |-
      De tijdsduur van de storing waarvoor compensatie moet worden uitgekeerd wordt voor de door de storing getroffen
      verbruikers bepaald als de tijdsduur tussen:
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.4.a
    text: het tijdstip van aanvang van de storing, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.4.b
    text: |-
      het tijdstip waarop, door middel van een controle door de leverancier of netbeheerder, is vastgesteld dat de
      storing is hersteld voor alle getroffen verbruikers.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: '4.5'
    text: |-
      Voor het bepalen van het tijdstip waarop de storing is hersteld voor alle getroffen verbruikers kan onderscheid
      worden gemaakt tussen:
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.5.a
    text: de verbruikers die zijn aangesloten op het door de storing getroffen primaire net;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.5.b
    text: de verbruikers die zijn aangesloten op het door de storing getroffen secundaire net;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.5.c
    text: |-
      de verbruikers die zijn aangesloten op het door de storing getroffen inpandig leidingstelsel van de gebouweigenaar,
      of
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4.5.d
    text: de verbruiker van de door de storing getroffen aansluiting of afleverset.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: '4.6'
    text: De compensatie wordt door de leverancier binnen zes maanden na het herstel van de onderbreking betaald.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4
  - number: 4a
    text: |-
      Met een extreme situatie die niet aan de leverancier of netbeheerder kan worden toegerekend wordt bedoeld een niet
      te voorziene gebeurtenis of situatie die:
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4a
  - number: 4a.a
    text: |-
      redelijkerwijs buiten de controle van een netbeheerder of leverancier ligt en niet te wijten is aan een fout van
      een netbeheerder of leverancier;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4a
  - number: 4a.b
    text: zo weinig voorkomt dat het oneconomisch zou zijn om daarmee rekening te houden in de reguleringssystematiek, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4a
  - number: 4a.c
    text: niet beïnvloed kan worden door de netbeheerder of leverancier.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4a
  - number: 4b
    text: 'Een leverancier beëindigt de levering van warmte aan een verbruiker niet, tenzij:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
  - number: 4b.a
    text: de verbruiker hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
  - number: 4b.b
    text: er sprake is van fraude of misbruik door de verbruiker;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
  - number: 4b.c
    text: de onveiligheid van de installatie beëindiging van de levering noodzakelijk maakt;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
  - number: 4b.d
    text: de overeenkomst voor de levering van warmte van de verbruiker met de leverancier afloopt;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
  - number: 4b.e
    text: |-
      op grond van de [artikelen 5, eerste lid][ref1], [5b][ref2] of [6][ref3] de levering van warmte wegens wanbetaling
      kan worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0033862#Artikel6
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0033862
        artikel: 5b
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0033862
        artikel: '6'
        paragraaf: '4'
  - number: '5.1'
    text: |-
      Een leverancier beëindigt de levering van warmte aan een verbruiker niet wegens wanbetaling, tenzij aan de
      procedurele vereisten van de volgende leden en [artikel 5a][ref1] wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: 5a
        paragraaf: '4'
  - number: '5.2'
    text: |-
      Indien een verbruiker niet binnen de gestelde termijn een vordering tot betaling van een leverancier voldoet,
      verstrekt de desbetreffende leverancier de verbruiker ten minste driemaal een schriftelijke herinnering met een
      nakomingstermijn van ten minste veertien dagen.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: '5.3'
    text: 'De leverancier:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: 5.3.a
    text: |-
      wijst de verbruiker bij die herinnering op de mogelijkheid om een betalingsregeling te treffen en daarover in
      contact te treden;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: 5.3.b
    text: wijst de verbruiker bij die herinnering op de mogelijkheden voor schuldhulpverlening;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: 5.3.c
    text: |-
      biedt bij de herinnering aan met schriftelijke toestemming van de verbruiker de contactgegevens van de
      verbruiker, diens klantnummer, en informatie over de hoogte van diens schuld aan een instantie ten behoeve van
      schuldhulpverlening te verstrekken, tenzij de verbruiker geen natuurlijk persoon is;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: 5.3.d
    text: |-
      vermeldt bij de herinnering dat de verbruiker niet wordt afgesloten indien de [artikelen 5, eerste lid][ref1],
      [5b][ref2] of [6, tweede lid][ref3], van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0033862#Artikel6
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: 5a
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0033862
        artikel: 5b
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0033862
        artikel: '6'
        paragraaf: '4'
  - number: '5.4'
    text: |-
      De leverancier spant zich tot het uiterste in om, zo nodig herhaaldelijk en via diverse communicatiekanalen, in
      persoonlijk contact te treden met de verbruiker.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: '5.5'
    text: |-
      Onverminderd het vierde lid, biedt de leverancier de verbruiker een redelijke en passende betalingsregeling aan. De
      betalingsregeling omvat in ieder geval afspraken over de betaling en de afwikkeling van de openstaande vorderingen.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: '5.6'
    text: |-
      Een leverancier beëindigt de levering van warmte naar een verbruiker niet wegens wanbetaling indien binnen een
      redelijke termijn een betalingsregeling wordt overeengekomen en nagekomen.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5
  - number: 5a.1
    text: |-
      In geval van wanbetaling door een verbruiker die een natuurlijk persoon is, verstrekt de leverancier aan een
      instantie ten behoeve van schuldhulpverlening de informatie bedoeld in het tweede lid, indien de verbruiker heeft
      ingestemd met, of niet heeft gereageerd op, het in [artikel 5, derde lid, onderdeel c][ref1], bedoelde aanbod tot
      gegevensverstrekking aan een instantie ten behoeve van schuldhulpverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
  - number: 5a.1.a
    text: |-
      er ten minste twee termijnbedragen niet zijn voldaan, de leverancier ten minste twee schriftelijke herinneringen
      aan de verbruiker heeft verstuurd en er geen betalingsregeling als bedoeld in [artikel 5, vijfde lid][ref1], is
      overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
  - number: 5a.1.b
    text: de betalingsachterstand aanmerkelijk hoger is geworden;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5a.1.c
    text: |-
      de leverancier voornemens is om de levering te beëindigen, tenminste twintig werkdagen voorafgaand aan de
      beëindiging en niet eerder dan nadat de nakomingstermijn van de derde herinnering is verstreken.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5a.2
    text: 'De leverancier verstrekt aan een instantie, bedoeld in het eerste lid, de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5a.2.a
    text: de contactgegevens van de verbruiker, diens klantnummer en informatie over de hoogte van diens schuld;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5a.2.b
    text: informatie over de ontwikkeling van de betalingsachterstand;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5a.2.c
    text: voor zover van toepassing het voornemen van de leverancier om de levering te beëindigen.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5a
  - number: 5b.1
    text: 'Een leverancier kan de levering van warmte aan een verbruiker niet beëindigen wegens wanbetaling indien:'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5b
  - number: 5b.1.a
    text: |-
      de verbruiker binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als bedoeld in
      [artikel 5, tweede lid][ref1], een bewijs overlegt dat hij heeft verzocht om schuldhulpverlening, totdat op dat
      verzoek negatief is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
  - number: 5b.1.b
    text: |-
      de vordering van de leverancier binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als
      bedoeld in [artikel 5, tweede lid][ref1], betrokken wordt bij een lopend traject van schuldhulpverlening aan de
      verbruiker; of


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
  - number: 5b.1.c
    text: |-
      na de verstrekking van gegevens aan een instantie ten behoeve van de schuldhulpverlening, bedoeld in
      [artikel 5a, eerste lid, onderdelen a en b][ref1], nog geen vier weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: 5a
        paragraaf: '4'
  - number: 5b.2
    text: |-
      Een leverancier kan de levering van warmte aan een verbruiker niet beëindigen wegens wanbetaling, tenzij de
      schuldhulpverlening aan de verbruiker eindigt of indien de verbruiker de verplichtingen ten aanzien van de
      schuldhulpverlening niet nakomt.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel5b
  - number: '6.1'
    text: |-
      Onverminderd de [artikelen 4b][ref1] en [5][ref2], beëindigt een leverancier de levering van warmte aan een
      kwetsbare consument niet wegens wanbetaling indien de kwetsbare consument niet binnen een redelijke termijn
      een verklaring van een arts, die geen behandelend arts van de betrokkene is, kan overleggen om de zeer ernstige
      gezondheidsrisico’s aan te tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033862
        artikel: 4b
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0033862
        artikel: '5'
        paragraaf: '4'
  - number: '6.2'
    text: |-
      Een leverancier draagt er zorg voor dat de levering aan een kwetsbare consument die wegens wanbetaling is
      beëindigd, wordt hervat indien de kwetsbare consument een verklaring van een arts die geen behandelend arts van de
      betrokkene is, overlegt om de zeer ernstige gezondheidsrisico’s aan te tonen.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel6
  - number: '7'
    text: |-
      Een leverancier draagt er zorg voor dat de levering van warmte aan een verbruiker die wegens wanbetaling is
      beëindigd, wordt hervat indien de verbruiker een bewijs overlegt:
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7
  - number: 7.a
    text: |-
      dat hij heeft verzocht om schuldhulpverlening, totdat op dat verzoek negatief is beslist of totdat de
      schuldhulpverlening eindigt;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7
  - number: 7.b
    text: |-
      dat de vordering van de leverancier wordt betrokken bij een lopend traject van schuldhulpverlening aan de
      verbruiker.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7
  - number: 7a.1
    text: |-
      De beschrijving van het warmtenet, bedoeld in [artikel 7, tweede lid, onderdeel a, van het besluit][ref1], omvat
      voor ieder warmtenet tenminste informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel7
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '7'
  - number: 7a.1.a
    text: de gebiedsafbakening voor het warmtenet;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.1.b
    text: het aantal en type warmtebronnen waarmee het warmtenet wordt gevoed, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.1.c
    text: het aantal en type verbruikers aangesloten op het warmtenet.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.2
    text: |-
      De informatie over de energieprestatie en de CO-prestaties van de geleverde warmte over het verslagjaar, bedoeld in
      [artikel 7, tweede lid, onderdeel b, van het besluit][ref1], bevat tenminste informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel7
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '7'
  - number: 7a.2.a
    text: de CO emissie in kg per eenheid geleverde warmte in GJ;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.2.b
    text: de primaire fossiele energie-inzet per eenheid geleverde warmte;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.2.c
    text: het aandeel hernieuwbare warmte in de geleverde warmte, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.2.d
    text: |-
      de mate waarin het warmtenet voldoet aan de definitie voor efficiënte stadsverwarming en -koeling volgend uit
      artikel 2, lid 41, van [Richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PB L 315).
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3
    text: |-
      De informatie over de energiebalans, bedoeld in [artikel 7, tweede lid, onderdeel c, van het besluit][ref1], bevat
      tenminste informatie over:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel7
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '7'
  - number: 7a.3.a
    text: de omvang van de primaire fossiele energie die wordt ingezet ten behoeve van de productie en levering van warmte;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3.b
    text: de omvang van de hernieuwbare energie die wordt ingezet ten behoeve van de productie en levering van warmte;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3.c
    text: |-
      de omvang van de restwarmte die wordt ingezet ten behoeve van de productie en levering van warmte; de omvang van de
      hulpenergie die wordt ingezet ten behoeve van de productie en levering van warmte;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3.d
    text: de omvang van de warmteproductie;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3.e
    text: de omvang van de warmtelevering, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.3.f
    text: de omvang van het warmteverlies.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7a.4
    text: |-
      De informatie over de energieprestatie en de CO-prestaties van de geleverde warmte en de energiebalans wordt
      vastgesteld met gebruikmaking van een door de minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
  - number: 7b
    text: |-
      In het leveringsprofiel, bedoeld in [artikel 10a, eerste lid, onderdeel d, van het besluit][ref1], wordt in ieder
      geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel10a
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 10a
  - number: 7b.a
    text: hoeveel GJ warmte een producent maandelijks en jaarlijks verwacht te kunnen invoeden op een warmtenet;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: 7b.b
    text: een onderbouwing van het onder a bedoelde aantal GJ;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: 7b.c
    text: de temperatuur van de warmte die de producent verwacht te kunnen invoeden op een warmtenet;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: 7b.d
    text: indien de verwachte leveringstemperatuur varieert, wanneer welke temperatuur geleverd kan worden;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: 7b.e
    text: de warmtebron waarmee de te leveren warmte wordt opgewekt, en
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: 7b.f
    text: de verwachte duurzaamheid van de warmtebron waarmee de te leveren warmte wordt opgewekt.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7b
  - number: '8'
    text: |-
      De vergoeding die verschuldigd is op grond van [artikel 20, eerste lid, van de wet][ref1] voor het verlenen van een
      vergunning is € 500,– en voor het verkrijgen van toestemming is € 500,–.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel20
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '20'
  - number: '9'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Warmteregeling.'
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel10
