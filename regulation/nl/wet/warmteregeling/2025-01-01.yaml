  - number: '7'
    text: |-
      Een leverancier draagt er zorg voor dat de levering van warmte aan een verbruiker die wegens wanbetaling is
      beëindigd, wordt hervat indien de verbruiker een bewijs overlegt:

      a. dat hij heeft verzocht om schuldhulpverlening, totdat op dat verzoek negatief is beslist of totdat de
      schuldhulpverlening eindigt;

      b. dat de vordering van de leverancier wordt betrokken bij een lopend traject van schuldhulpverlening aan de
      verbruiker.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7
  - number: 7a
    text: |-
      1 De beschrijving van het warmtenet, bedoeld in [artikel 7, tweede lid, onderdeel a, van het besluit][ref1], omvat
      voor ieder warmtenet tenminste informatie over:

      a. de gebiedsafbakening voor het warmtenet;

      b. het aantal en type warmtebronnen waarmee het warmtenet wordt gevoed, en

      c. het aantal en type verbruikers aangesloten op het warmtenet.

      2 De informatie over de energieprestatie en de CO-prestaties van de geleverde warmte over het verslagjaar, bedoeld
      in [artikel 7, tweede lid, onderdeel b, van het besluit][ref2], bevat tenminste informatie over:

      a. de CO emissie in kg per eenheid geleverde warmte in GJ;

      b. de primaire fossiele energie-inzet per eenheid geleverde warmte;

      c. het aandeel hernieuwbare warmte in de geleverde warmte, en

      d. de mate waarin het warmtenet voldoet aan de definitie voor efficiënte stadsverwarming en -koeling volgend uit
      artikel 2, lid 41, van [Richtlijn 2012/27](32012L0027)/EU van het Europees Parlement en de Raad van 25 oktober 2012
      betreffende energie-efficiëntie, tot wijziging van [Richtlijnen 2009/125/EG](32009L0125) en [2010/30](32010L0030)/
      EU en houdende intrekking van de Richtlijnen [2004/8/EG](32004L0008) en [2006/32/EG](32006L0032) (PB L 315).

      3 De informatie over de energiebalans, bedoeld in [artikel 7, tweede lid, onderdeel c, van het besluit][ref3],
      bevat tenminste informatie over:

      a. de omvang van de primaire fossiele energie die wordt ingezet ten behoeve van de productie en levering van
      warmte;

      b. de omvang van de hernieuwbare energie die wordt ingezet ten behoeve van de productie en levering van warmte;

      c. de omvang van de restwarmte die wordt ingezet ten behoeve van de productie en levering van warmte;

      de omvang van de hulpenergie die wordt ingezet ten behoeve van de productie en levering van warmte;

      d. de omvang van de warmteproductie;

      e. de omvang van de warmtelevering, en

      f. de omvang van het warmteverlies.

      4 De informatie over de energieprestatie en de CO-prestaties van de geleverde warmte en de energiebalans wordt
      vastgesteld met gebruikmaking van een door de minister vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0033940#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0033940#Artikel7
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel7a
