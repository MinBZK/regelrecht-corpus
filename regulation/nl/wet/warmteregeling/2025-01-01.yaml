  - number: '2.1'
    text: |-
      Voor het vaststellen van het gebruiksonafhankelijke deel van de maximumprijs voor levering van warmte, bedoeld
      in [artikel 3, eerste lid, van het besluit][ref1], wordt bij het berekenen van het verschil in gebruikskosten
      uitgegaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel3
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '3'
  - number: 2.1.a
    text: |-
      door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van een
      cv-ketel voor de levering van ruimteverwarming en tapwater;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: 2.1.b
    text: |-
      door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van een
      afleverset voor de levering van ruimteverwarming en tapwater;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: 2.1.c
    text: |-
      een door de Autoriteit Consument en Markt vastgestelde vermogenskostenvoet, waarbij wordt uitgegaan van een
      redelijk rendement dat in het economisch verkeer gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: '2.2'
    text: |-
      De jaarlijkse operationele kosten van een cv-ketel, bedoeld in het eerste lid, onderdeel a, worden vastgesteld met
      inachtneming van de volgende formule: OK = (0,5 x OK) + (0,5 x OK) waarbij: OK = jaarlijkse operationele kosten
      van een cv-ketel; OK = de gemiddelde kosten van de aangeboden all-in onderhoudscontracten voor een cv-ketel; OK =
      de gemiddelde kosten van alle aangeboden onderhoudscontracten voor een cv-ketel met uitzondering van de aangeboden
      all-in onderhoudscontracten voor een cv-ketel.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor het vaststellen van het gebruiksonafhankelijk deel van de maximumprijs voor levering van warmte, bedoeld in
      [artikel 3, derde lid, van het besluit][ref1], wordt uitgegaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel3
