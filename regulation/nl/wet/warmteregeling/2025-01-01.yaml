        bwb_id: BWBR0033940
        artikel: 5b
  - number: 3b.1.a
    text: |-
      een individuele afleverset voor warmte voor alleen ruimteverwarming heeft een vermogen van 25 kilowatt en geen
      warmtewisselaar;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3b
  - number: 3b.1.b
    text: |-
      een collectieve afleverset voor warmte voor alleen ruimteverwarming heeft een vermogen van 100 kilowatt en geen
      warmtewisselaar;
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel3b
  - number: 3b.1.c
    text: |-
