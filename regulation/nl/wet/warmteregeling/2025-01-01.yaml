      1 Voor het vaststellen van het gebruiksonafhankelijke deel van de maximumprijs voor levering van warmte, bedoeld
      in [artikel 3, eerste lid, van het besluit][ref1], wordt bij het berekenen van het verschil in gebruikskosten
      uitgegaan van:

      a. door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van
      een cv-ketel voor de levering van ruimteverwarming en tapwater;

      b. door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van
      een afleverset voor de levering van ruimteverwarming en tapwater;

      c. een door de Autoriteit Consument en Markt vastgestelde vermogenskostenvoet, waarbij wordt uitgegaan van een
      redelijk rendement dat in het economisch verkeer gebruikelijk is.

      2 De jaarlijkse operationele kosten van een cv-ketel, bedoeld in het eerste lid, onderdeel a, worden vastgesteld
      met inachtneming van de volgende formule:

      OK = (0,5 x OK) + (0,5 x OK)

      waarbij:

      OK = jaarlijkse operationele kosten van een cv-ketel;

      OK = de gemiddelde kosten van de aangeboden all-in onderhoudscontracten voor een cv-ketel;

      OK = de gemiddelde kosten van alle aangeboden onderhoudscontracten voor een cv-ketel met uitzondering van de
      aangeboden all-in onderhoudscontracten voor een cv-ketel.

      3 Voor het vaststellen van het gebruiksonafhankelijk deel van de maximumprijs voor levering van warmte, bedoeld in
      [artikel 3, derde lid, van het besluit][ref2], wordt uitgegaan van:

      a. een basistarief voor aansluitingen voor levering van warmte met een vermogen tot 3 kilowatt (BT) van € 245,27
      inclusief BTW;

      b. een opslag per kilowatt extra vermogen van de aansluiting voor de levering van warmte (O) van € 62,06 inclusief
      BTW per kilowatt extra vermogen van de aansluiting.

      4 Bij het berekenen van de opslag aan een verbruiker met een centrale aansluiting voor de levering van warmte met
      een vermogen van meer dan 100 kilowatt, bedoeld in [artikel 3, vierde lid, van het besluit][ref3], wordt uitgegaan
      van:

      a. gemiddelde jaarlijkse vaste kosten van het transport, de levering en de aansluiting van gas van een aansluiting
      voor gas met een vermogen van 1.000 kilowatt (VK) en de meetkosten van een G100 aansluiting van € 3874,00 exclusief
      BTW;

      b. door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van
      een cv-ketel met een vermogen van 1.000 kilowatt voor de levering van ruimteverwarming en tapwater uitgaande van:

      i. onderhoudskosten van een cv-ketel van 3 procent van de investeringskosten, en

      ii. een door de Autoriteit Consument en Markt vastgestelde vermogenskostenvoet gelijk aan de vermogenskostenvoet,
      bedoeld in het eerste lid, onderdeel c;

      c. meetkosten voor een G100 gasaansluiting die zijn opgenomen in het bedrag, genoemd in onderdeel a;

      d. door de Autoriteit Consument en Markt vastgestelde gemiddelde jaarlijkse kapitaals- en operationele kosten van
      een afleverset voor een vermogen van 1.000 kilowatt voor de levering van ruimteverwarming en tapwater uitgaande
      van:

      i. onderhoudskosten van een afleverset van 2 procent van de investeringskosten, en

      ii. een door de Autoriteit Consument en Markt vastgestelde vermogenskostenvoet gelijk aan de vermogenskostenvoet,
      bedoeld in het eerste lid, onderdeel c;

      e. door de Autoriteit Consument en Markt vastgestelde meetkosten voor het gebruik van warmte op basis van
      het gewogen gemiddelde van de meettarieven voor G6 aansluitingen van de gasmeter van de netbeheerders van de
      gastransportnetten, bedoeld in [artikel 3, eerste lid, van het besluit][ref4] onder GK.

      5 De in dit artikel genoemde bedragen worden jaarlijks gecorrigeerd op basis van de relatieve wijziging van de
      consumentenprijsindex waarbij het jaar 2017 geldt als referentiejaar.


