      per kilowatt extra vermogen van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij het berekenen van de opslag aan een verbruiker met een centrale aansluiting voor de levering van warmte met een
      vermogen van meer dan 100 kilowatt, bedoeld in [artikel 3, vierde lid, van het besluit][ref1], wordt uitgegaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel3
