    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel2
  - number: 2.4.d.ii
    text: |-
      een door de Autoriteit Consument en Markt vastgestelde vermogenskostenvoet gelijk aan de vermogenskostenvoet,
