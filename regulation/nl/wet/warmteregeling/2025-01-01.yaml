      1 Voor het vaststellen van het gebruiksafhankelijk deel van de maximumprijs voor levering van warmte, bedoeld
      in [artikel 4, eerste lid, van het besluit][ref1], wordt bij de bepaling van het brandstofrendement van de
      warmteproductie gebruik gemaakt van de volgende factoren:

      a. warmtevraag voor ruimteverwarming als deel van de totale warmtevraag (VR), dat wordt vastgesteld op 0,79;

      b. warmtevraag voor warm tapwater als deel van de totale warmtevraag (VT), dat wordt vastgesteld op 0,21;

      c. gemiddeld opwekrendement voor ruimteverwarming (ηruimte), dat wordt vastgesteld op 0,94;

      d. gemiddeld warm tapwater rendement (ηtap), dat wordt vastgesteld op 0,68.

      2 Voor het vaststellen van het gebruiksafhankelijk deel van de maximumprijs voor levering van warmte, bedoeld in
      [artikel 4, eerste lid, van het besluit][ref2], wordt gebruik gemaakt van een bovenwaarde van de verbrandingswaarde
      van aardgas van 0,03517 GJ/Nm3 (CV).


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel4
