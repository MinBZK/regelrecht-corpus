      1 De persoonlijke situatie van de verbruiker, bedoeld in [artikel 5c, eerste lid, van het besluit][ref1], is
      gebaseerd op het meest recent beschikbare verbruik van de verbruiker.

      2 Indien de leverancier deze gegevens niet kan achterhalen en de verbruiker deze informatie niet kan of wil
