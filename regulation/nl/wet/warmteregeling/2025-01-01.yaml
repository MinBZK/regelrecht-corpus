      1 De transparante informatie over de prijs waarvoor geleverd zal worden, bedoeld in
      [artikel 5c, derde lid, onderdeel c, van het besluit][ref1], omvat in ieder geval op duidelijke en begrijpelijke
      wijze informatie over:

      a. de opbouw van het tarief, inclusief alle toeslagen en belastingen, waarin in ieder geval wordt weergegeven:

      i. wat het gebruiksafhankelijk deel is;

      ii. wat het gebruiksonafhankelijk deel is, en

      iii. indien in de prijs kortingen zijn verwerkt:

      1°. voor ieder jaar van de looptijd van de overeenkomst op welke wijze de korting in het jaarbedrag tot uitdrukking
      komt;

      2°. wat er gebeurt met het jaarbedrag wanneer de kortingsactie afloopt, en

      3°. de voorwaarden waaronder van de korting gebruik kan worden gemaakt, en

      b. het soort tarief, en

      i. indien er sprake is van een vast tarief:

      1°. wat de looptijd is van het tarief, en

      2°. wat er gebeurt met het tarief na afloop van de looptijd van het vaste tarief, en

      ii. indien er sprake is van een variabel tarief:

      1°. in welke gevallen het tarief kan worden aangepast;

      2°. hoe vaak een wijziging kan plaatsvinden gedurende de looptijd van de overeenkomst, en

      3°. wat de gevolgen van de prijswijziging, op basis van het persoonlijk verbruik van de verbruiker, zijn voor de
      het geschatte jaarbedrag en het te betalen voorschot.

      2 Indien een leverancier de prijs waarvoor geleverd wordt, bedoeld in
      [artikel 5c, derde lid, onderdeel c, van het besluit][ref2], wijzigt, informeert hij de verbruiker hier uiterlijk 1
      maand voordat de tariefwijziging wordt geëffectueerd persoonlijk en schriftelijk over.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5c
      [ref2]: https://wetten.overheid.nl/BWBR0033940#Artikel5c
