  - number: 3c
    text: |-
      De transparante informatie over de omschrijving van hetgeen wordt geleverd, bedoeld in
      [artikel 5c, derde lid, onderdeel b, van het besluit][ref1], omvat in ieder geval informatie over:

      a. de temperatuur van de geleverde warmte waarbij een onderscheid wordt gemaakt tussen warmte ten behoeve van:

      i. ruimteverwarming, en

      ii. verwarming van tapwater;

      b. indien de minimale temperatuur van de geleverde warmte kan verschillen, wanneer de verbruiker welke temperatuur
      warmte geleverd krijgt;

      c. indien warmte wordt geleverd van een temperatuur lager dan 70°C, wat de gevolgen zijn voor het comfortniveau
      voor de verbruiker, waaronder onder andere:

      i. of de geleverde warmte op basis van de door de verbruiker opgegeven kenmerken van de woon-of bedrijfsruimte en
      de binneninstallatie direct geschikt is voor het verwarmen van tapwater tot een temperatuur die voldoet aan de norm
      bedoeld in de [artikelen 3.110][ref2] en [4.203 van het Besluit bouwwerken leefomgeving][ref3], en

      ii. indien de geleverde warmte niet direct geschikt is voor ruimteverwarming of het verwarmen
      van tapwater tot een temperatuur die voldoet aan de norm bedoeld in de [artikelen 3.110][ref4] en
      [4.203 van het Besluit bouwwerken leefomgeving][ref5], een indicatie van de kosten die de verbruiker extra moet
      maken ten behoeve van ruimteverwarming of de verwarming van tapwater tot deze temperatuur;

      d. de opwekkingsbron van de warmte die geleverd zal worden, wanneer dit bij de wijze van aanprijzing en de keuze
      die de verbruiker zou maken, van belang is, en

      e. de diensten verbonden aan de levering van warmte.


