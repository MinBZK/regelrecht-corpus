  - number: 5b
    text: |-
      1 Een leverancier kan de levering van warmte aan een verbruiker niet beëindigen wegens wanbetaling indien:

      a. de verbruiker binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als bedoeld in
      [artikel 5, tweede lid][ref1], een bewijs overlegt dat hij heeft verzocht om schuldhulpverlening, totdat op dat
      verzoek negatief is beslist;

      b. de vordering van de leverancier binnen een redelijke termijn, in ieder geval vier weken, na een herinnering als
      bedoeld in [artikel 5, tweede lid][ref2], betrokken wordt bij een lopend traject van schuldhulpverlening aan de
      verbruiker; of

      c. na de verstrekking van gegevens aan een instantie ten behoeve van de schuldhulpverlening, bedoeld in
      [artikel 5a, eerste lid, onderdelen a en b][ref3], nog geen vier weken zijn verstreken.

      2 Een leverancier kan de levering van warmte aan een verbruiker niet beëindigen wegens wanbetaling, tenzij
      de schuldhulpverlening aan de verbruiker eindigt of indien de verbruiker de verplichtingen ten aanzien van de
      schuldhulpverlening niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0033862#Artikel5a
