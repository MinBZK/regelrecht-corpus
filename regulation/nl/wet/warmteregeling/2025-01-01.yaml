      1 De transparante informatie over het opzeggen van de overeenkomst, bedoeld in
      [artikel 5c, derde lid, onderdeel d, van het besluit][ref1], bevat in ieder geval:

      a. de voorwaarden waaronder de overeenkomst door de verbruiker of leverancier kan worden beëindigd, en

      b. indien er bij een tussentijdse opzegging van een overeenkomst voor bepaalde tijd een opzegvergoeding
      verschuldigd is, de hoogte van deze opzegvergoeding.

      2 Een leverancier informeert een verbruiker schriftelijk en uiterlijk 2 maanden voor het aflopen van de
      overeenkomst over het opzeggen van een overeenkomst of het aflopen van een overeenkomst voor bepaalde tijd.


