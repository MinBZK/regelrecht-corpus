preamble:
  text: |-
    Gelet op artikelen 3, vierde lid, en 4, derde lid, van de Warmtewet en de artikelen 3, tweede lid, 4, vierde lid,
    en 10, tweede lid, van het Warmtebesluit;
  url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *afleverset:* afleverset voor warmte als bedoeld in [artikel 8, eerste lid, van de wet][ref1];
        - *besluit:* [Warmtebesluit][ref2];
        - *kwetsbare consument:* een verbruiker voor wie de beëindiging van de levering van warmte zeer ernstige
      gezondheidsrisico’s tot gevolg zou hebben of voor de huisgenoten van de verbruiker;
        - *maximumprijs:* prijs die de Autoriteit Consument en Markt op grond van [artikel 5, eerste lid, van de wet][ref3]
      vaststelt;
        - *primair warmtenet:* transportnet waarmee warmte vanuit de primaire warmtebron wordt getransporteerd naar een
      secundair warmtenet of, zonder tussenkomst van een secundair warmtenet, naar de verbruiker;
        - *schuldhulpverlening:* toepassing van de schuldsaneringsregeling natuurlijke personen, bedoeld in
      [titel III van de Faillissementswet][ref4] of ondersteuning van natuurlijke personen door een instantie als bedoeld
      in [artikel 48, eerste lid, van de Wet op het consumentenkrediet][ref5] bij het vinden van een adequate oplossing
      voor schuldsituaties gericht op de aflossing van schulden;
        - *secundair warmtenet:* van het primaire warmtenet door middel van een onderstation of warmteoverdracht station
      afgescheiden deel van het warmtenet ten behoeve van transport van warmte aan verbruikers;
        - *storing:* iedere onderbreking van de levering van warmte, met uitzondering van voorziene onderbrekingen als
      bedoeld in [artikel 4, tweede lid, van de wet][ref6] en contractueel overeengekomen onderbrekingen van de levering
      van warmte;
        - *wet:* [Warmtewet][ref7].


