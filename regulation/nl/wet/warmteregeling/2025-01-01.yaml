  - number: 4a
    text: |-
      Met een extreme situatie die niet aan de leverancier of netbeheerder kan worden toegerekend wordt bedoeld een niet
      te voorziene gebeurtenis of situatie die:

      a. redelijkerwijs buiten de controle van een netbeheerder of leverancier ligt en niet te wijten is aan een fout van
      een netbeheerder of leverancier;

      b. zo weinig voorkomt dat het oneconomisch zou zijn om daarmee rekening te houden in de reguleringssystematiek, en

      c. niet beïnvloed kan worden door de netbeheerder of leverancier.
    url: https://wetten.overheid.nl/BWBR0033862/2025-01-01#Artikel4a
  - number: 4b
    text: |-
      Een leverancier beëindigt de levering van warmte aan een verbruiker niet, tenzij:

      a. de verbruiker hierom verzoekt;

      b. er sprake is van fraude of misbruik door de verbruiker;

      c. de onveiligheid van de installatie beëindiging van de levering noodzakelijk maakt;

      d. de overeenkomst voor de levering van warmte van de verbruiker met de leverancier afloopt;

      e. op grond van de [artikelen 5, eerste lid][ref1], [5b][ref2] of [6][ref3] de levering van warmte wegens
      wanbetaling kan worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5b
      [ref3]: https://wetten.overheid.nl/BWBR0033862#Artikel6
