  - number: 5a
    text: |-
      1 In geval van wanbetaling door een verbruiker die een natuurlijk persoon is, verstrekt de leverancier aan een
      instantie ten behoeve van schuldhulpverlening de informatie bedoeld in het tweede lid, indien de verbruiker heeft
      ingestemd met, of niet heeft gereageerd op, het in [artikel 5, derde lid, onderdeel c][ref1], bedoelde aanbod tot
      gegevensverstrekking aan een instantie ten behoeve van schuldhulpverlening;

      a. er ten minste twee termijnbedragen niet zijn voldaan, de leverancier ten minste twee schriftelijke herinneringen
      aan de verbruiker heeft verstuurd en er geen betalingsregeling als bedoeld in [artikel 5, vijfde lid][ref2], is
      overeengekomen;

      b. de betalingsachterstand aanmerkelijk hoger is geworden;

      c. de leverancier voornemens is om de levering te beëindigen, tenminste twintig werkdagen voorafgaand aan de
      beëindiging en niet eerder dan nadat de nakomingstermijn van de derde herinnering is verstreken.

      2 De leverancier verstrekt aan een instantie, bedoeld in het eerste lid, de volgende informatie:

      a. de contactgegevens van de verbruiker, diens klantnummer en informatie over de hoogte van diens schuld;

      b. informatie over de ontwikkeling van de betalingsachterstand;

      c. voor zover van toepassing het voornemen van de leverancier om de levering te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0033862#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033862#Artikel5
