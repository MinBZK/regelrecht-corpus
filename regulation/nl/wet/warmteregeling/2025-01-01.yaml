  - number: 3b
    text: |-
      1 De kenmerkende functionaliteiten van de categorieën afleversets, bedoeld in
      [artikel 5b, eerste lid, van het besluit][ref1], zijn:

      a. een individuele afleverset voor warmte voor alleen ruimteverwarming heeft een vermogen van 25 kilowatt en geen
      warmtewisselaar;

      b. een collectieve afleverset voor warmte voor alleen ruimteverwarming heeft een vermogen van 100 kilowatt en geen
      warmtewisselaar;

      c. een individuele afleverset voor warmte voor alleen verwarming van tapwater heeft een CW-waarde van 4 en geen
      elektronische regeling van de temperatuur van het tapwater;

      d. een collectieve afleverset voor warmte voor alleen verwarming van tapwater heeft geen elektronische regeling
      van de temperatuur van het tapwater en kan een hoeveelheid tapwater leveren die overeenkomt met een CW-waarde van
      4, waarbij ervan uitgegaan wordt dat niet alle verbruikers gelijktijdig een hoeveelheid tapwater nodig hebben die
      overeenkomt met CW-waarde 4;

      e. een individuele gecombineerde afleverset voor warmte voor ruimteverwarming en verwarming van tapwater heeft een
      vermogen van 25 kilowatt, geen warmtewisselaar voor de ruimteverwarming, een CW-waarde van 4 en geen elektronische
      regeling van de temperatuur van het tapwater;

      f. een collectieve gecombineerde afleverset voor warmte voor ruimteverwarming en verwarming van tapwater heeft
      een vermogen van 100 kilowatt, geen warmtewisselaar voor de ruimteverwarming, geen elektronische regeling van
      de temperatuur van het tapwater en kan een hoeveelheid tapwater leveren die overeenkomt met een CW-waarde van 4,
      waarbij ervan uitgegaan wordt dat niet alle verbruikers gelijktijdig een hoeveelheid tapwater nodig hebben die
      overeenkomt met CW-waarde 4.

      2 De Autoriteit Consument en Markt kan de aanvullende functionaliteiten van afleversets, bedoeld in
      [artikel 5b, tweede lid, van het besluit][ref2], uitsluitend vaststellen op basis van de volgende elementen:

      a. de mate waarin het vermogen van de afleverset afwijkt van het vermogen, genoemd in het eerste lid;

      b. de mate waarin de CW-waarde bij een individuele afleverset afwijkt van de CW-waarde, genoemd in het eerste lid;

      c. de mate waarin de hoeveelheid geleverde tapwater bij een collectieve afleverset afwijkt van de hoeveelheid die
      overeen komt met een CW-waarde van 4, waarbij ervan uitgegaan wordt dat niet alle verbruikers gelijktijdig een
      hoeveelheid tapwater nodig hebben die overeenkomt met CW-waarde 4;

      d. de aanwezigheid van een warmtewisselaar voor de ruimteverwarming;

      e. de aanwezigheid van een elektronische regeling van de temperatuur van het tapwater.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5b
