preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regels betreffende de stimulering van de
    milieukwaliteit van de elektriciteitsvoorziening om redenen van financiële beheersbaarheid aan te passen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020675/2007-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op aanvragen om subsidie die vóór de inwerkingtreding van deze wet zijn ingediend en op subsidies
      die vóór de inwerkingtreding van deze wet zijn verstrekt, blijft het bepaalde bij of krachtens
      [Hoofdstuk 5, paragraaf 2.2, van de Elektriciteitswet 1998][ref1] van toepassing zoals die onmiddellijk voor
      dat tijdstip luidde, met dien verstande dat slechts subsidie wordt verstrekt voor de hoeveelheid opgewekte
      elektriciteit die overeenkomt met de in [artikel 72r, tweede lid, onder a][ref2], genoemde raming.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Paragraaf2.2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel72r
    url: https://wetten.overheid.nl/BWBR0020675/2007-01-01#ArtikelII
