  - number: '11'
    text: |-
      1 De kosten van opslag van de inboedel, bedoeld in [artikel 18, vierde lid, van het besluit][ref1], zijn voor de
      duur van de tijdelijke onderbrenging voor rekening van het Rijk.

      2 Betaling van de kosten van opslag van de inboedel vindt plaats door de zorg van het Rijk, mits de hoogte van de
      kosten vooraf is goedgekeurd door het bevoegd gezag.

      3 De verzorging van de opslag van de inboedel, bedoeld in het eerste lid, geschiedt door een verhuisbedrijf bedoeld
      in [artikel 15, derde lid, van het besluit][ref2].


