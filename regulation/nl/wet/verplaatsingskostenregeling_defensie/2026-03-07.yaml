  - number: '22'
    text: |-
      De tegemoetkoming in pensionkosten, als bedoeld in [artikel 26, eerste en derde lid, van het besluit][ref1],
      bedraagt voor de ambtenaar die gewoonlijk met gezinsleden samenwoont 90%, en voor de overige ambtenaren 60% van de
      betaalde pensionkosten, voor zover deze kosten niet uitgaan boven de door het bevoegd gezag redelijk geoordeelde
      pensionkosten


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel26
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0032312
        artikel: '26'
  - number: '23'
    text: |-
      De volgende regelingen worden ingetrokken:

      a. de Verplaatsingskostenregeling burgerlijke ambtenaren defensie;

      b. de Verplaatsingskostenregeling militairen.
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel23
  - number: '24'
    text: |-
      Deze regeling treedt in werking met ingang van de datum van ondertekening en werkt terug tot 1 maart 2012 waarvan
      mededeling wordt gedaan in de Staatscourant. Deze regeling wordt gepubliceerd in serie Ministeriële Publicaties (MP
      31-300 en MP 33-410).
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel24
  - number: '25'
    text: |-
      Deze regeling wordt aangehaald als, Verplaatsingskostenregeling defensie.

      Deze regeling wordt gepubliceerd in de serie ministeriële publicaties waarvan mededeling zal worden gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel25
