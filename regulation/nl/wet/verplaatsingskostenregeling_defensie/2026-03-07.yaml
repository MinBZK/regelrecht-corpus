  - number: '8'
    text: |-
      1 De duur van de tijdelijke onderbrenging, bedoeld in [artikel 18 van het besluit][ref1], bedraagt maximaal 60
      dagen.

      2 Indien de defensieambtenaar binnen de in het eerste lid genoemde termijn de definitieve woonruimte, bedoeld in
      [artikel 18, eerste lid, onder a van het besluit][ref2], nog niet heeft betrokken en hij naar het oordeel van het
      bevoegd gezag voldoende heeft aangetoond dat hij aan de in het vierde lid van dat artikel genoemde verplichting
      heeft voldaan, kan de termijn als bedoeld in het eerste lid maximaal vijf keer worden verlengd met ten hoogste 60
      dagen per verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0032312#Artikel18
