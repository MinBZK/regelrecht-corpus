  - number: 1a
    text: |-
      1 Op verzoek van de defensieambtenaar kan het persoonlijk werkrooster eenmaal per vier weken worden gewijzigd.

      2 Bij wijziging van het persoonlijk werkrooster gaat de aanspraak op de tegemoetkoming op grond van de
      [artikelen 13][ref1], [14][ref2] en [17][ref3] in op de door de defensieambtenaar aangegeven datum van ingang
      roosterwijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0039786#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0039786#Artikel17
