  - number: '15'
    text: |-
      De defensieambtenaar die kiest voor de aanspraak op privégebruik van een door Defensie verstrekt openbaar
      vervoersbewijs, betaalt hiervoor een eigen bijdrage. Deze eigen bijdrage bedraagt per maand:

      a. € 48,29 indientrein, bus, tram en metro is inbegrepen dan wel

      b. € 21,08 indien uitsluitend trein is inbegrepen.
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel15
  - number: '16'
    text: |-
      In afwijking van het gestelde in de [artikelen 13][ref1] en [15][ref2], is de tegemoetkoming in de kosten van het
      dagelijks reizen tussen de woning of de plaats van legering en de plaats van tewerkstelling die beide zijn gelegen
      buiten Nederland, afhankelijk van het land van plaatsing, per kalendermaand gelijk aan: het product van de afstand
      en het in [bijlage 2][ref3], Tabel F, opgenomen kilometerbedrag, verminderd met de in bijlage 2, Tabel G, voor dat
      land vastgestelde eigen bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0039786#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0039786
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel16
