  - number: '3'
    text: |-
      1 De defensieambtenaar heeft aanspraak op het transport van zijn inboedel indien het transport wordt uitgevoerd
      door een verhuisbedrijf bedoeld in [artikel 15 derde lid van het besluit][ref1].

      2 De defensieambtenaar die het transport van zijn inboedel niet door een verhuisbedrijf laat verzorgen, maar de
      verhuizing in eigen beheer uitvoert, heeft aanspraak op vergoeding van de kosten van huur en brandstof van een
      bestel- of vrachtauto dan wel – indien het transport van de inboedel anderszins plaats vindt – op de tegemoetkoming
      per kilometer, met dien verstande dat niet meer dan twee ritten van de oude naar de nieuwe woning worden vergoed
      waarbij de tegemoetkoming wordt bepaald met toepassing van het [Besluit dienstreizen defensie][ref2]. De vergoeding
      bedraagt maximaal het bedrag van de transportkosten als bedoeld in het eerste lid.

      3 De defensieambtenaar heeft aanspraak op het transport van een motorvoertuig bij aanspraak op tegemoetkoming
      in de verhuiskosten naar of van een land buiten Europa, waarbij eventuele invoerrechten ten laste komen van de
      defensieambtenaar.

      4 De defensieambtenaar heeft aanspraak op een onbelaste tegemoetkoming in de kosten van het transport van
      huisdieren ingeval van een verhuizing naar of van een land buiten Europa. De tegemoetkoming bedraagt de werkelijke
      kosten maar ten hoogste € 200,–.

      5 Andere kosten dan transportkosten als bedoeld in het vierde lid, zoals kosten voor een bench, invoerrechten,
      quarantaine e.d. komen niet voor vergoeding in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007956
