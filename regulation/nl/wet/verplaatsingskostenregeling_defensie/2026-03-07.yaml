  - number: '6'
    text: |-
      De defensieambtenaar heeft ingeval van een internationale overzeese verscheping van zijn inboedel als gevolg van
      zijn verplaatsing van:

      a. Nederland naar buiten Nederland;

      b. Buiten Nederland naar Nederland;

      c. Buiten Nederland naar een ander land buiten Nederland,

      aanspraak op een onbelaste tegemoetkoming van ten hoogste € 539,74 in de kosten van de huur van een vervoermiddel
      gedurende de periode dat hij ten gevolge van die verscheping tijdelijk niet de beschikking heeft over zijn eigen
      motorvoertuig dan wel indien hij geen eigen motorvoertuig verscheept heeft, voor de periode tot hij kan beschikken
      over een ter plaatse aangeschaft motorvoertuig.
    url: https://wetten.overheid.nl/BWBR0039786/2026-03-07#Artikel6
  - number: '7'
    text: |-
      1 De tegemoetkoming in de gemaakte kosten voor de aanschaf ter plaatse van een personenauto bij verplaatsing naar
      een land buiten Europa, bedoeld in [artikel 16 van het besluit][ref1], bedraagt maximaal € 750,–.

      2 De over deze tegemoetkoming verschuldigde loonheffing en inhoudingen komen voor rekening van Defensie.


