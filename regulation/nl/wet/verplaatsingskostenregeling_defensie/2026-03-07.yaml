  - number: '4'
    text: |-
      1 De aanspraak op het transport van de inboedel van de defensieambtenaar en de meeverhuizende gezinsleden bedoeld
      in [artikel 15, tweede lid, onder a van het besluit][ref1] is bij verhuizingen naar een land gelegen buiten Europa,
      met uitzondering van Kreta, beperkt tot de kosten van het vervoer van een 40-voets container.

      2 De aanspraak op het transport van bagage bedoeld in [artikel 15, tweede lid, onder d van het besluit][ref2],
      wordt in het geval van transport per vliegtuig -onverminderd de vrijdom van vracht- beperkt tot 20 kg per persoon.

      3 Het te vervoeren voertuig bedoeld in [artikel 15, tweede lid, onder g van het besluit][ref3] dient in rijdende
      staat te verkeren en dient tezamen met de inboedel geladen te kunnen worden binnen de maximale afmetingen van een
      standaard 40-voets container dan wel indien het voertuig separaat vervoerd wordt binnen de maximale afmetingen van
      een standaard 20-voets container.

      4 De defensieambtenaar heeft aanspraak op een tegemoetkoming in de transportkosten van bagage bedoeld in
      [artikel 17 van het besluit][ref4], indien hij ten minste zes maanden buiten Nederland gaat verblijven. De
      tegemoetkoming bestaat uit de kosten van het transport van bagage van:

      a. voor de defensieambtenaar, maximaal 4 m3;

      b. voor de partner en voor elk tot het gezin behorend en meeverhuizend kind, maximaal 1 m3.


