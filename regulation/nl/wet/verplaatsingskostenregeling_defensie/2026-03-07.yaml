  - number: '17'
    text: |-
      1 De defensieambtenaar die niet dagelijks rijdt tussen de woning en de plaats van tewerkstelling, heeft aanspraak
      op een tegemoetkoming in de reiskosten van achtmaal per periode van vier weken. Indien de plaats van tewerkstelling
      in Nederland, België of Duitsland en de woning in Nederland, België of Duitsland is gelegen waarbij de
      tegemoetkoming per kalendermaand afhankelijk is van de afstand en het persoonlijk werkrooster is de tegemoetkoming
      gelijk aan de in [bijlage 4][ref1], tabel O opgenomen bedragen.

      2 De defensieambtenaar die niet dagelijks reist tussen de woning en de plaats van tewerkstelling, heeft aanspraak
      op een tegemoetkoming in de reiskosten van achtmaal per periode van vier weken. Indien de plaats van tewerkstelling
      en de woning beide in Nederland zijn gelegen en hij verplicht huisvesting van rijkswege ontvangt waarbij de
      tegemoetkoming per kalendermaand afhankelijk is van de afstand en het persoonlijk werkrooster is de tegemoetkoming
      gelijk aan de in [bijlage 4][ref2], tabel O opgenomen bedragen.

      3 De tegemoetkoming per kalendermaand in de kosten bij niet-dagelijks reizen tussen de woning en de plaats van
      tewerkstelling is – afhankelijk van de afstand en het persoonlijk werkrooster – voor de defensieambtenaar, bedoeld
      in:

      a. [artikel 20, onderdeel a, van het besluit][ref3] gelijk aan de in [bijlage 4][ref4], tabel S opgenomen bedragen
      voor zover de enkele reisafstand groter is dan 25 kilometer;

      b. [artikel 20, onderdeel b, van het besluit][ref5] gelijk aan de in [bijlage 4][ref6], tabel S opgenomen bedragen;

      c. [artikel 20, onderdeel c van het besluit][ref7], voor zover de enkele reisafstand groter is dan 25
      kilometer indien de plaats van tewerkstelling in Nederland, België of Duitsland is gelegen, gelijk aan de in
      [bijlage 3][ref8], tabel J en K opgenomen bedragen.

      4 [Bijlage 3][ref9], tabel K en M zijn van toepassing indien het betreft een militair met een hogere rang dan die
      van adjudant-onderofficier die reist per trein in de eerste klasse.

      5 [Bijlage 3][ref10], tabel H, blijft van toepassing op de defensieambtenaar die op 1 januari 2025 met toepassing
      van het eerste of tweede lid reeds aanspraak had op een tegemoetkoming op grond van tabel H en deze tegemoetkoming
      hoger is dan de tegemoetkoming die de defensieambtenaar op grond van [bijlage 4][ref11], tabel S zou ontvangen,
      tot het moment waarop sprake is van een wijziging van de plaats van tewerkstelling of een verhuizing van de
      defensieambtenaar.


