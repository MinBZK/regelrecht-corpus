  - number: '21'
    text: |-
      1 Indien de aanspraak op een tegemoetkoming in de kosten van het reizen tussen de woning of de plaats van legering
      en de plaats van tewerkstelling aanvangt of eindigt anders dan op de respectievelijk eerste of laatste werkdag van
      een kalendermaand wordt de tabeltegemoetkoming opgenomen in [bijlage 1 tot en met 4][ref1], voor die maand berekend
      naar rato van het aantal werkdagen.

      2 De aanspraak op een tegemoetkoming woon-werkverkeer wordt opgeschort, nadat de defensieambtenaar langer dan zes
      aaneengesloten weken afwezig is op de werklocatie. De tegemoetkoming vangt wederom aan op de eerste dag van de
      maand volgend op de datum van terugkeer op basis van het dan geldende persoonlijk werkrooster.

      3 De aanspraak op een tegemoetkoming woon-werkverkeer wordt opgeschort vanaf de eerste dag dat de defensieambtenaar
      op een uitzending gaat als bedoeld in de [Regeling Voorzieningen bij Vredes- en Humanitaire Operaties][ref2].
      De tegemoetkoming vangt wederom aan op de eerste dag van terugkeer op basis van het dan geldende persoonlijk
      werkrooster.

      4 De aanspraak op een tegemoetkoming woon-werkverkeer wordt opgeschort vanaf de 31ste
      dag dat de defensieambtenaar op een meerdaagse activiteit gaat als bedoeld in de
      [Regeling Vergoeding voor Overwerk, Onregelmatigheid, Beschikbaarheid en Bereikbaarheid][ref3]. De tegemoetkoming
      vangt wederom aan op de eerste dag van terugkeer op basis van het dan geldende persoonlijk werkrooster.

      5 Indien het persoonlijk werkrooster is gebaseerd op twee weken die anders zijn voor wat betreft de locaties waar
      de defensieambtenaar werkzaamheden verricht, wordt de tegemoetkoming op grond van de in [bijlage 1a][ref4] en
      [1b][ref5] tabellen berekend op basis van de gemiddelde afstand.

      6 Met inachtneming van het derde en het vierde lid heeft de defensieambtenaar waarvoor geen persoonlijk werkrooster
      is vastgesteld in een geautomatiseerd personeelssysteem op aanvraag aanspraak op een tabeltegemoetkoming opgenomen
      in [bijlage 1 tot en met 4][ref6].


