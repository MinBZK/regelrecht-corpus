  - number: '5'
    text: |-
      1 De tegemoetkoming in de reis- en verblijfkosten bij een verplaatsing naar een land of gebied buiten Nederland
      bedoeld in [artikel 2, vierde lid, onderdeel b van het besluit][ref1], strekt tot alle landen en gebieden.

      2 De tegemoetkoming bedoeld in het eerste lid betreft de gemaakte reis- en verblijfkosten voor de defensieambtenaar
      en zijn echtgenote, waarbij de reis naar een land binnen Europa de duur van twee overnachtingen niet overschrijdt
      en waarbij de reis naar een land buiten Europa de duur van vier overnachtingen niet overschrijdt.

      3 De tegemoetkoming wordt bepaald met toepassing van het [Besluit dienstreizen defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007956
