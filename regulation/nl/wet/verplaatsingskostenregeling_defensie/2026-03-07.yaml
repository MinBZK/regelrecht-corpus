  - number: '12'
    text: |-
      1 De defensieambtenaar is voor de tijdelijke onderbrenging een eigen bijdrage verschuldigd tot maximaal de door het
      Rijk verschuldigde kosten van onderbrenging als bedoeld in [artikel 10][ref1].

      2 In geval van onderbrenging in gemeubileerde of gestoffeerde woonruimte als bedoeld in [artikel 8, onder a][ref2],
      bedraagt de eigen bijdrage 15% van de voor de defensieambtenaar geldende salaris, in voorkomend geval vermeerderd
      met de toelage buitenland indien de tijdelijke onderbrenging plaats vindt in een gebied buiten Nederland.

      3 In geval van onderbrenging in een pension als bedoeld in [artikel 9 onder b][ref3], bedraagt de eigen bijdrage
      50% van de voor de defensieambtenaar geldende netto bezoldiging onderscheidenlijk het voor de defensieambtenaar
      geldende standaard netto Nederland vermeerderd met de toelage buitenland indien de tijdelijke onderbrenging plaats
      vindt in een gebied buiten Nederland.

      4 Indien tot het gezin van de defensieambtenaar kinderen behoren waarvoor aanspraak bestaat op kinderbijslag en
      die eveneens verblijf houden in het pension, wordt de netto bezoldiging onderscheidenlijk het standaard netto
      Nederland, vermeerderd met het bedrag van deze kinderbijslag.

      5 Indien tot het gezin van de defensieambtenaar kinderen behoren waarvoor geen aanspraak bestaat op kinderbijslag
      en die eveneens verblijf houden in het pension, wordt voor elk kind het percentage van 50% vermeerderd met 7,5
      procentpunten. Hierbij wordt geen rekening gehouden met een kind dat in de loop van een kwartaal wordt geboren en
      voor wie pas aanspraak bestaat op kinderbijslag met ingang van de eerste dag van het daaropvolgende kwartaal.

      6 Indien de defensieambtenaar gedurende de tijd van onderbrenging geen aanspraak heeft op bezoldiging of slechts op
      een gedeelte daarvan, wordt niettemin de eigen bijdrage berekend naar het volle bedrag van die bezoldiging.

      7 De berekening van de eigen bijdrage over een gedeelte van een maand vindt plaats naar evenredigheid, waarbij het
      bedrag per dag wordt vastgesteld door het bedrag verschuldigd over een volle maand te delen door dertig.


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel10
