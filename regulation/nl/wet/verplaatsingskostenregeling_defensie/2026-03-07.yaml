    text: |-
      1 De aanvraag voor tegemoetkoming in verhuiskosten dient ten minste een maand vóór de datum van de verhuizing bij
      het bevoegd gezag te zijn ingediend.

      2 Het bedrag, bedoeld in [artikel 2, vierde lid, onder f][ref1] en
      [artikel 12, eerste lid, onder c van het besluit][ref2], bedraagt: € 6.000,–.

      3 Het voeren van een eigen huishouding, bedoeld in [artikel 2, vierde lid, onder f][ref3] en
      [artikel 12, eerste lid, onder c, van het besluit][ref4], wordt geacht voort te duren indien dit voeren van de
      eigen huishouding met maximaal 6 maanden voorafgaande aan de datum van de verhuizing is onderbroken.

      4 Bij het verlaten van een ambts- of dienstwoning, bedoeld in [artikel 9, tweede lid, van het besluit][ref5]
      bedraagt de aanspraak op de overige kosten bedoeld in [artikel 12, eerste lid onder c van het besluit][ref6],
      € 1.350,–.

      5 Bij een verplaatsing naar Nederland, met toepassing van
      [artikel 2, derde lid, aanhef en onder b, van het besluit][ref7], is het toegestaan te verhuizen naar een ander
      land dan Nederland met dien verstande dat in dat geval de aanspraak op een tegemoetkoming in de verhuiskosten als
      bedoeld in [artikel 2, vierde lid van het besluit][ref8], niet meer bedraagt dan wanneer de defensieambtenaar naar
      Nederland zou zijn verhuisd, te rekenen tot de gebruikelijke grensovergang in Nederland.

      6 Indien de defensieambtenaar is verhuisd met toepassing van
      [artikel 2, derde lid, aanhef en onder b van het besluit][ref9], met een tegemoetkoming in de verhuiskosten naar
      een ander land dan Nederland, bedraagt de aanspraak op een tegemoetkoming in de verhuiskosten bij een verhuizing
      naar Nederland niet meer dan wanneer de defensieambtenaar binnen Nederland zou zijn verhuisd, te rekenen vanaf de
      gebruikelijke grensovergang in Nederland.

      7 Indien wordt verhuisd naar een gestoffeerde en gemeubileerde woning, bestaat geen aanspraak op het bedrag als
      bedoeld in lid twee.

      8 Bij een verhuizing van de ambtenaar in verband met een ontslag als bedoeld in
      [artikel 8, tweede lid, van het besluit][ref10], bestaat geen aanspraak op het bedrag als bedoeld in lid twee.


