  - number: '18'
    text: |-
      1 De tegemoetkoming in de kosten van het niet dagelijks reizen als bedoeld in [artikel 20, onder c][ref1], tussen
      de woning en de plaats van tewerkstelling, waarbij de woning en de plaats van tewerkstelling beide zijn gelegen
      buiten Nederland, België of Duitsland, is, bij het reizen per openbaar vervoer, gelijk aan de kosten daarvan. Bij
      het reizen met eigen vervoer is de tegemoetkoming gelijk aan het in de [bijlage 3][ref2], respectievelijk de in
      Tabel J en K of in Tabel L en M opgenomen bedragen.

      2 De tegemoetkoming in de kosten van het niet dagelijks reizen als bedoeld in [artikel 20, onder c][ref3], tussen
      de woning en de plaats van tewerkstelling, waarbij de woning in Nederland, België of Duitsland is gelegen en
      de plaats van tewerkstelling in Europa buiten Nederland, België of Duitsland, is bij het reizen per openbaar
      vervoer, gelijk aan de kosten daarvan. Bij het reizen met eigen vervoer is de tegemoetkoming gelijk aan het in de
      [bijlage 3][ref4], respectievelijk de in Tabel J en K of in L en M opgenomen bedragen.

      3 Indien gereisd wordt met het openbaar vervoer wordt de tegemoetkoming bepaald naar de klasse
      waarin de defensieambtenaar is gerechtigd te reizen overeenkomstig de [artikelen 4][ref5] en
      [5 van de Regeling dienstreizen defensie][ref6].


