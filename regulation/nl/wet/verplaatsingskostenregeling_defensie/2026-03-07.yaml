  - number: '10'
    text: |-
      1 Betaling van de kosten van de tijdelijke onderbrenging bedoeld in [artikel 18 van het besluit][ref1] vindt plaats
      door de zorg van het Rijk mits de hoogte daarvan vooraf is goedgekeurd door het bevoegd gezag. Eventuele bijkomende
      kosten voor schoonmaken, gas, water, elektriciteit verwarming, televisie, telefoon en toeristenbelasting,
      komen voor rekening van de defensieambtenaar en worden door de defensieambtenaar rechtstreeks met de verhuurder
      verrekend.

      2 In het geval van tijdelijke onderbrenging bedoeld in [artikel 9, onderdeel a, onder 2°][ref2], worden de kosten
      tot een maximum bedrag van € 874,44 per maand vergoed. Dit maximum bedrag zal jaarlijks worden aangepast op basis
      van de gemiddelde landelijke huurverhoging.

      3 Indien de defensieambtenaar twee of meer gezinsleden heeft, wordt het in het tweede lid genoemde maximum bedrag
      verhoogd met:

      a. bij twee gezinsleden: 13%;

      b. bij drie of meer gezinsleden: 17%.


      [ref1]: https://wetten.overheid.nl/BWBR0032312#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0039786#Artikel9
