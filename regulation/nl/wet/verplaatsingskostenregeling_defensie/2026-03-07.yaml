articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besluit:* het [Verplaatsingskostenbesluit defensie][ref1].
        - *bevoegd gezag:* 1°. de Secretaris-Generaal, voor zover het betreft de Bestuursstaf; 2°. de Commandant
      Zeestrijdkrachten, de Commandant Landstrijdkrachten, de Commandant Luchtstrijdkrachten, de Commandant Koninklijke
      Marechaussee, voor het desbetreffende commando; 3°. de directeur van de Defensie Materieel Organisatie, voor zover
      het betreft de Defensie Materieel Organisatie; 4°. de commandant van het Commando Diensten Centra, voor zover het
      betreft het Commando Diensten Centra.
        - *bezoldiging:* – voor de militair, de bezoldiging in de zin van
      [artikel 1, eerste lid, onderdeel k, van het Inkomstenbesluit militairen][ref2] (IBM; – voor de ambtenaar, de
      bezoldiging in de zin van [artikel 1, onderdeel j van het Inkomstenbesluit burgerlijke ambtenaren defensie][ref3]
      (IBBAD).
        - *commandant:* de commandant bedoeld in de Regeling aanwijzing commandanten defensie
        - *netto bezoldiging:* het voor de defensieambtenaar vastgestelde standaard netto Nederland, met dien verstande dat
      geen rekening wordt gehouden met de factor 1,1 respectievelijk 1,075.
        - *persoonlijk werkrooster:* een voor een periode vastgesteld schema van werk- en rusttijden en werklocaties van de
      defensieambtenaar, welke is opgenomen in een geautomatiseerd personeelssysteem.
        - *routeplanner:* 1°. voor het bepalen van de afstand gemeten langs de gebruikelijke openbare weg als bedoeld in
      [artikel 1 van het Verplaatsingskostenbesluit defensie][ref4], hanteert het Ministerie van Defensie de routeplanner
      Andes Nav Teq. 2°. de afstand wordt berekend met de opties: auto en snelste, waarbij tolwegen en veerpont zoveel
      als mogelijk vermeden wordt, en 3°. de routeplanner is gekoppeld aan Defensie Intranettoepassing Dienstreis
      Opdrachten.
        - *standaard netto Nederland:* het bedrag, vastgesteld volgens
      [artikel 1, eerste lid, onderdeel h van het Voorzieningenstelsel buitenland defensiepersoneel ][ref5](VBD).
        - *werklocatie:* de tussen de commandant en de medewerker overeengekomen plaats waar de defensieambtenaar de
      werkzaamheden verricht.


