  - number: '14'
    text: |-
      1 Voor de defensieambtenaar, wiens plaats van tewerkstelling door de Minister is aangewezen als een plaats
      van tewerkstelling die niet per openbaar vervoer is te bereiken, is in afwijking van [artikel 13][ref1] de
      tegemoetkoming in de kosten van het dagelijks reizen tussen de woning en de plaats van tewerkstelling – afhankelijk
      van de afstand en het persoonlijk werkrooster – gelijk aan de in [bijlage 1][ref2], tabel N, opgenomen bedragen.

      2 De tegemoetkoming, bedoeld in het eerste lid, is van overeenkomstige toepassing op de defensieambtenaar die
      behoort tot de door de commandant aangewezen groep voor wie de plaats van tewerkstelling niet per openbaar vervoer
      te bereiken is vanwege het regelmatig op ongebruikelijke uren verrichten van werkzaamheden.

      3 De tegemoetkoming, bedoeld in het eerste lid, is van overeenkomstige toepassing op de ambtenaar die in
      verband met een medische indicatie noodzakelijk van een eigen auto gebruik moet maken en daardoor de plaats van
      tewerkstelling niet per openbaar vervoer kan bereiken.

      4 Voor de ambtenaar op wie de verruiming van de tegemoetkoming in de kosten voor dagelijks woon-werkverkeer bij een
      opgelegde verplaatsing als bedoeld in hoofdstuk 9 van het Sociaal Beleidskader Defensie 2012–2016 van toepassing
      is en wiens plaats van tewerkstelling door de Minister is aangewezen als een plaats van tewerkstelling die niet
      per openbaar vervoer te bereiken is, is de tegemoetkoming in de kosten van het dagelijks reizen tussen de woning
      en de plaats van tewerkstelling – afhankelijk van de afstand en het persoonlijk werkrooster – gelijk aan de in
      [bijlage 1][ref3], tabel Q opgenomen bedragen.

      5 De tegemoetkoming in de kosten van het dagelijks reizen tussen de woning en de plaats van tewerkstelling voor
      de defensieambtenaar, bedoeld in [artikel 2, vijfde lid van het besluit][ref4], is gelijk aan het bedrag per
      kalendermaand van het in [bijlage 1][ref5], tabel N genoemde bedrag over de afstand binnen Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0039786#Artikel13
