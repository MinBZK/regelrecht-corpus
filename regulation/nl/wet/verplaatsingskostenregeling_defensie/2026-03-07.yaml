  - number: '13'
    text: |-
      1 Voor de defensieambtenaar die overwegend gebruik maakt van eigen vervoer, is de tegemoetkoming in de kosten van
      het dagelijks reizen tussen de woning of de plaats van legering en de plaats van tewerkstelling – afhankelijk van
      de afstand en het persoonlijk werkrooster – per kalendermaand gelijk aan de in [bijlage 1][ref1], tabel E genoemde
      bedragen.

      2 Voor de ambtenaar op wie de verruiming van de tegemoetkoming in de kosten voor dagelijks woon-werkverkeer bij een
      opgelegde verplaatsing als bedoeld in hoofdstuk 9 van het Sociaal Beleidskader Defensie 2012–-2016 van toepassing
      is, de tegemoetkoming in de kosten van het dagelijks reizen tussen de woning en de plaats van tewerkstelling –
      afhankelijk van de afstand en het persoonlijk werkrooster – gelijk aan de in [bijlage 1][ref2], tabel P opgenomen
      bedragen.

      3 De tegemoetkoming in de kosten van het dagelijks reizen tussen de woning en de plaats van tewerkstelling voor de
      defensieambtenaar, bedoeld in [artikel 2, vijfde lid][ref3], is gelijk aan het bedrag per kalendermaand van de in
      [bijlage 1][ref4], tabel E genoemde bedragen over de afstand binnen Nederland.


