  - number: '4'
    text: |-
      1 De compensatie bedraagt maximaal € 15 miljoen per belastingplichtige per jaar.

      2 Indien het bedrag, genoemd in het eerste lid, varieert gedurende de periode waarin aan de belastingplichtige
      de activiteiten, bedoeld in [artikel 1.14, eerste lid, van de wet][ref1] zijn opgedragen, wordt dit jaarbedrag
      berekend als het gemiddelde van de jaarlijkse compensatiebedragen die naar verwachting gedurende die periode zullen
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1.14
    url: https://wetten.overheid.nl/BWBR0034548/2021-07-01#Artikel4
    references:
