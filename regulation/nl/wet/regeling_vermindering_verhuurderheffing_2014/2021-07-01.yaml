  - number: '3'
    text: |-
      1 De aanmelding van een gerealiseerde investering bevat ten minste:

      a. een aanduiding van de gerealiseerde investering;

      b. een aanduiding van de postcodes en de adressen ten aanzien waarvan de gerealiseerde investering is verricht;

      c. de vergunning indien de investering vergunningplichtig is;

      d. indien sprake is van de bouw van huurwoningen als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 2°, van de wet][ref1]: een verhuurderverklaring
      waaruit blijkt dat de huurprijs lager is en zal zijn dan het bedrag, genoemd in
      [artikel 20, tweede lid, onderdeel a, van de Wet op de huurtoeslag][ref2];

      e. indien sprake is van verbouw van niet voor bewoning bestemde ruimten tot huurwoningen die gerealiseerd is na
      31 december 2017: een verhuurderverklaring waaruit blijkt dat de huurprijs lager is en zal zijn dan het bedrag,
      genoemd in [artikel 20, tweede lid, onderdeel a, van de Wet op de huurtoeslag][ref3];

      f. de datum waarop de investering is gerealiseerd;

      g. de gerealiseerde investeringskosten per huurwoning;

      h. indien sprake is van verduurzaming als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 8°, van de wet][ref4]: een energielabel dat is vastgesteld en
      afgegeven nadat de investering is voltooid.

      2 [Artikel 2, tweede lid][ref5], is van overeenkomstige toepassing.

      3 In afwijking van het eerste lid geschiedt de aanmelding van een gerealiseerde investering, waarvoor een
      voorlopige investeringsverklaring is afgegeven voor 1 januari 2021, met inachtneming van het eerste lid zoals dat
      gold voor 1 januari 2021.


