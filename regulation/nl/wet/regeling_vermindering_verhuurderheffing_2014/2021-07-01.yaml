  - number: 3a
    text: |-
      1 De aanvraag van een verklaring als bedoeld in [artikel 1.6, tweede lid, onderdeel c, van de wet][ref1] bevat
      ten minste:

      a. een aanduiding van de postcode en het adres van de woningen waarvan de belastingplichtige de eigendom verwerft
      en waarvoor de vrijstelling wordt aangevraagd;

      b. een verklaring van de toegelaten instelling die de woning in eigendom verwerft dat de aankoop onderdeel uitmaakt
      van een plan dat beoogt uitvoering te geven aan een activiteit in het kader van stedelijke vernieuwing als bedoeld
      in [artikel 1, eerste lid, van de Woningwet][ref2], en

      c. de datum van de eigendomsoverdracht van de woning aan de toegelaten instelling.

      2 De aanvraag van een verklaring als bedoeld in [artikel 1.6, vierde lid, onderdeel c, van de wet][ref3] bevat
      ten minste:

      a. een aanduiding van de postcodes dan wel de adressen van de woningen ten aanzien waarvan de vrijstelling wordt
      aangevraagd;

      b. de omgevingsvergunning, bedoeld in [artikel 1.6, vierde lid, onderdeel a, van de wet][ref4] voor die woningen,
      en

      c. de datum waarop de woningen zijn gerealiseerd.


