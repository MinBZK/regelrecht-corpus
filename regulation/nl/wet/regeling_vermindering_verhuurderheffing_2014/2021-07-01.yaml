articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *belastingplichtige:* belastingplichtige als bedoeld in [artikel 1.4 van de wet][ref1];

      b. *omgevingsvergunning:* omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onderdelen a en c, van de Wet algemene bepalingen omgevingsrecht][ref2];

      c. *Vrijstellingsbesluit DAEB:* besluit van de Europese Commissie van 20 december 2011 betreffende de toepassing
      van artikel 106, tweede lid, van het Verdrag betreffende de werking van de Europese Unie op staatssteun in de vorm
      van compensatie voor de openbare dienst, verleend aan bepaalde met het beheer van diensten van algemeen economisch
      belang belaste ondernemingen;

      d. *wet:* [Wet maatregelen woningmarkt 2014 II][ref3].


