        artikel: '1.14'
  - number: '5'
    text: |-
      De belastingplichtige administreert de netto kosten, bedoeld in artikel 5 van het Vrijstellingsbesluit DAEB,
      verbonden met de gerealiseerde investeringen op een zodanige wijze dat inzicht kan worden verkregen in de hoogte
      van deze kosten, zulks afgescheiden van de reguliere bedrijfsvoering, in relatie tot de heffingsvermindering.
    url: https://wetten.overheid.nl/BWBR0034548/2021-07-01#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0034548/2021-07-01#Artikel6
