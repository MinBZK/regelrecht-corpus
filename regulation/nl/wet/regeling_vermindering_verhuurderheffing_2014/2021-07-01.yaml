  - number: '2'
    text: |-
      1 De aanmelding van een voorgenomen investering bevat ten minste:

      a. een aanduiding van de voorgenomen investering;

      b. een aanduiding van de postcodes, de adressen, dan wel de kadastrale aanduidingen van de objecten ten aanzien
      waarvan de voorgenomen investering wordt verricht;

      c. een reële raming van de investeringskosten per huurwoning van de voorgenomen investering, en

      d. indien van toepassing: een opgave van de datum waarop het bevoegd gezag de ten behoeve van een voorgenomen
      investering afgegeven omgevingsvergunning heeft verstrekt of schriftelijk kenbaar heeft gemaakt die vergunning te
      zullen verstrekken;

      e. indien het een voorgenomen investering als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 8°, van de wet][ref1] betreft: een energielabel met een opnamedatum
      die op het tijdstip van aanmelding van de voorgenomen investering niet ouder is dan 6 maanden, alsmede het
      verwachte energielabel na realisatie van de investering.

      2 De belastingplichtige verklaart dat de voorgenomen investering betrekking heeft op een of meerdere huurwoningen.

      3 Het energielabel, bedoeld in het eerste lid, onderdeel e, is vastgesteld en afgegeven op de wijze, bedoeld in
      [artikel 2, eerste en tweede lid, van de Regeling energieprestatie gebouwen][ref2].

      4 Indien de belastingplichtige voor een huurwoning een aangemelde voorgenomen investering als bedoeld in
      [artikel 1.2, tweede lid, onderdeel b, onder 8°, van de wet][ref3], intrekt en voor die huurwoning binnen vijf
      werkdagen een nieuwe aanmelding voor een voorgenomen investering doet, kan hij eenmalig de bij de nieuwe aanmelding
      het energielabel overleggen die hij bij de ingetrokken voorgenomen investering heeft overlegd.

      5 In afwijking van het eerste lid, onderdeel e, kan bij de aanmelding van een voorgenomen investering tot 1 oktober
      2021 een energielabel gebruikt worden met een opnamedatum van na 1 juli 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0034553#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020921#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034553#Artikel1.2
