  - number: '2'
    text: |-
      Voor de operationalisering van de algemene definities van de ecologische toestand, die in bijlage V, de tabellen
      1.2.1 tot en met 1.2.4, van de kaderrichtlijn water zijn opgenomen, ten behoeve van de opstelling en uitvoering
      van het monitoringsprogramma wordt voor elk van de in Nederland voorkomende typen natuurlijke waterlichamen voor
      de in bijlage V, paragraaf 1.1, van de kaderrichtlijn water vermelde kwaliteitselementen, uitgezonderd specifieke
      verontreinigende stoffen, het met inachtneming van de intercalibratiebeschikking opgestelde Stowa-rapport voor
      natuurlijke watertypen gehanteerd.
    url: https://wetten.overheid.nl/BWBR0027502/2022-04-01#Artikel2
  - number: '3'
    text: |-
      1 In het monitoringsprogramma wordt ten behoeve van de toepassing van
      [artikel 6, eerste lid, van het besluit][ref1] bepaald dat een oppervlaktewater-lichaam voor een kwaliteitselement
      voldoet aan de richtwaarde voor de goede ecologische toestand van het type natuurlijk oppervlaktewater-lichaam
      waartoe het waterlichaam behoort, indien het oppervlaktewater-lichaam blijkens de monitoringsresultaten:

      a. voor specifieke verontreinigende stoffen geen hogere concentratie van een in de bijlage bij deze regeling
      vermelde stof bevat dan de waarde die daarin voor de desbetreffende stof is vermeld, en

      b. voor de andere kwaliteitselementen voldoet aan alle waarden, die voor deze kwaliteitselementen voor het type
      natuurlijk oppervlaktewaterlichaam waarin het desbetreffende waterlichaam is ingedeeld, zijn opgenomen in het
      Stowa-rapport voor natuurlijke watertypen.

      2 In het monitoringsprogramma wordt ten behoeve van de toepassing van [artikel 6, tweede lid, van het besluit][ref2]
      bepaald dat een sterk veranderd of kunstmatig oppervlaktewaterlichaam voor een kwaliteitselement voldoet aan het
      vereiste van een goed ecologisch potentieel, indien het oppervlaktewaterlichaam blijkens de monitoringsresultaten
      voldoet aan de specificaties die voor het kwaliteitselement zijn vastgesteld in:

      a. het beheerplan voor de rijkswateren, indien het rijkswateren betreft;

      b. het regionale waterplan, indien het regionale wateren betreft.

      3 Voor de indeling van een oppervlaktewaterlichaam in een type natuurlijk oppervlaktewaterlichaam worden de
      karakteriseringen gehanteerd, die voor de onderscheiden typen natuurlijke oppervlaktewaterlichamen zijn opgenomen
      in het Stowa-rapport voor natuurlijke watertypen. Indien sprake is van een kunstmatig oppervlaktewaterlichaam kan
      voor de indeling daarvan tevens gebruik worden gemaakt van het Stowa-rapport voor sloten en kanalen.


      [ref1]: https://wetten.overheid.nl/BWBR0027061#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027061#Artikel6
    url: https://wetten.overheid.nl/BWBR0027502/2022-04-01#Artikel3
    references:
