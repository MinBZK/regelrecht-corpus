  - number: '5'
    text: |-
      De Minister van Infrastructuur en Milieu stelt het monitoringsprogramma vast met inachtneming van richtlijn
      2009/90/EG van de Commissie van de Europese Unie van 31 juli 2009 tot vaststelling van technische specificaties
      voor de chemische analyse en monitoring van de watertoestand krachtens Richtlijn 2000/90/EG van het Europees
      Parlement en de Raad.
    url: https://wetten.overheid.nl/BWBR0027502/2022-04-01#Artikel5
