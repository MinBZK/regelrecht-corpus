preamble:
  text: |-
    Gelet op:

    richtlijn nr. 2000/60/EG van het Europees Parlement en de Raad van de Europese Unie van 23 oktober 2000 tot
    vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid (PbEG L 327);

    de beschikking van de Europese Commissie van 30 oktober 2008 tot vaststelling van de indelingswaarden voor de
    monitoringssystemen van de lidstaten die het resultaat zijn van de intercalibratie, overeenkomstig richtlijn
    2000/60/EG van het Europees Parlement en de Raad van de Europese Unie (PbEU L 332), en

    de artikelen 15 en 16, zesde lid, van het Besluit kwaliteitseisen en monitoring water 2009;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0027502/2022-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besluit:* [Besluit kwaliteitseisen en monitoring water 2009][ref1];
        - *intercalibratiebeschikking:* beschikking van de Europese Commissie van 30 oktober 2008 tot vaststelling van
      de indelingswaarden voor de monitoringssystemen van de lidstaten die het resultaat zijn van de intercalibratie,
      overeenkomstig [richtlijn 2000/60/EG](32000L0060) van het Europees Parlement en de Raad (PbEU L 332);
        - *kwaliteitselement:* kwaliteitselement dat is vermeld in bijlage V, paragraaf 1.1, bij de kaderrichtlijn water;
        - *Stowa-rapport voor natuurlijke watertypen:* rapport ‘Referenties en maatlatten voor natuurlijke watertypen
      voor de Kaderrichtlijn Water 2015–2021’, rapportnummer 2012-31, ISBN 978.90.5773.569.1, van de Stichting toegepast
      onderzoek waterbeheer, zoals gepubliceerd op: http://www.stowa.nl/;
        - *Stowa-rapport voor sloten en kanalen:* rapport ‘Omschrijving MEP en maatlatten voor sloten en kanalen voor
      de Kaderrichtlijn Water 2015–2021’, rapportnummer 2012-34, ISBN 978.90.5773.571.4, van de Stichting toegepast
      onderzoek waterbeheer, zoals gepubliceerd op: http://www.stowa.nl/.


      [ref1]: https://wetten.overheid.nl/BWBR0027061
    url: https://wetten.overheid.nl/BWBR0027502/2022-04-01#Artikel1
