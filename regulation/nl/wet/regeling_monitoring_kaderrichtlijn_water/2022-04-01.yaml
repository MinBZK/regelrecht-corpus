        artikel: '6'
      - id: ref2
        bwb_id: BWBR0027061
        artikel: '6'
  - number: '4'
    text: |-
      1 In het monitoringsprogramma wordt ten behoeve van de indeling van een oppervlaktewaterlichaam of een
      grondwaterlichaam in een toestandsklasse van de chemische toestand uitgegaan van de laagste toestandsklasse
      waarin het waterlichaam blijkens de monitoringsresultaten voor een in [bijlage I][ref1], onderscheidenlijk
      [bijlage II, bij het besluit][ref2] vermelde stof is ingedeeld.

      2 In het monitoringsprogramma wordt ten behoeve van de indeling van een oppervlaktewaterlichaam in een
      toestandsklasse voor specifieke verontreinigende stoffen uitgegaan van de laagste toestandsklasse waarin het
      waterlichaam blijkens de monitoringsresultaten voor een in de bijlage bij deze regeling vermelde stof is ingedeeld.

      3 In het monitoringsprogramma worden ten behoeve van de indeling van een natuurlijk
      oppervlaktewaterlichaam in een toestandsklasse van de ecologische toestand de grenzen tussen de in
      [artikel 16, vijfde lid, onderdeel a, 2°, van het besluit][ref3] onderscheiden toestandsklassen vastgesteld in
      overeenstemming met het Stowa-rapport voor natuurlijke watertypen.

      4 In het monitoringsprogramma wordt bepaald dat de indeling van een sterk veranderd of kunstmatig
      oppervlaktewaterlichaam in een toestandsklasse van het ecologisch potentieel plaatsvindt met toepassing van
      de ‘Handreiking MEP/GEP, handreiking voor vaststellen van status, ecologische doelstellingen en bijpassende
      maatregelenpakketten voor niet-natuurlijke wateren’ van de Projectgroep Implementatie Handreiking, Ministerie van
      Verkeer en Waterstaat, van november 2005. Hierbij wordt uitgegaan van het goede ecologisch potentieel dat voor het
      waterlichaam is vastgesteld in:

      a. voor rijkswateren: het beheerplan voor de rijkswateren;

      b. voor regionale wateren: het regionale waterplan.


