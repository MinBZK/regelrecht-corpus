preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is een voorziening te treffen met het oog op de
    mogelijkheid, dat voor eenzelfde veld meer dan eene mijnconcessie wordt verleend;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001889/1915-04-05#ArtikelAanhef
articles:
  - number: ''
    text: |-
      1 Bij eene acte van concessie als bedoeld in artikel 5 der wet van 21 April 1810, concernant les mines, les
      minières et les carrières, (*Bulletin des Lois* n°. 285) kan worden bepaald, dat in het belang van een andere voor
      hetzelfde veld reeds verleende of nog te verleenen mijnconcessie terreinen kunnen worden aangewezen, die door den
      concessionaris niet voor zijne ontginning zullen mogen worden gebruikt.

      2 Deze aanwijzing geschiedt met Onze machtiging door Onzen Minister, die met de uitvoering van het besluit tot
      verleening der concessie is belast.
    url: https://wetten.overheid.nl/BWBR0001889/1915-04-05#ArtikelEenig_artikel
