preamble:
  text: |-
    Gelet op artikel 5.15, derde lid en zesde lid, van de Wet inkomstenbelasting 2001;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze regeling geeft uitvoering aan
      [artikel 5.15, derde lid en zesde lid, van de Wet inkomstenbelasting 2001][ref1].

      2 Deze regeling verstaat onder:

      a. accountantsverklaring: een verklaring afgegeven door een registeraccountant of een accountant-
      administratieconsulent;

      b. project: in een ontwikkelingsland gelegen technisch, functioneel en in tijd samenhangend geheel van activa en
      werkzaamheden;

      c. bestaand project: een project dat voor 1 januari 2004 bestond dan wel een project waarvoor voor die datum een
      begin met de uitvoering van de fysieke werkzaamheden is gemaakt;

      d. ontwikkelingslanden: landen die voorkomen op de DAC 1 lijst van de OESO (Organisatie voor Economische
      Samenwerking en Ontwikkeling);

      e. projectbeheerder: degene voor wiens rekening en risico het project wordt ontwikkeld en in stand wordt gehouden;

      f. projectvermogen: het vermogen dat nodig is voor de financiering van de activa en werkzaamheden die noodzakelijk
      zijn voor en uitsluitend dienstbaar zijn aan de uitvoering van een project;

      g. verklaring: een schriftelijk besluit van de Minister voor Ontwikkelingssamenwerking als bedoeld in
      [artikel 5.15, derde lid, van de Wet inkomstenbelasting 2001][ref2], waarin wordt verklaard dat een project in
      het belang is van de voedselzekerheid en voedselverbetering, de sociale en culturele ontwikkeling of de economische
      ontwikkeling, werkgelegenheid en regionale ontwikkeling in een ontwikkelingsland.

      h. de ministers: de Minister voor Ontwikkelingssamenwerking in overeenstemming met de Minister van Financiën en de
      Minister van Buitenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.15
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5.15
