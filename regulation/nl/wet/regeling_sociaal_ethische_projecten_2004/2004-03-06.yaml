  - number: '10'
    text: |-
      Ten behoeve van het afgeven van een verklaring en van de daar toe van belang zijnde gegevens en van de
      daar aan verbonden rechten en plichten is ten aanzien van de kredietinstelling of de beleggingsinstelling,
      bedoeld in [artikel 5.15, tweede lid, van de Wet inkomstenbelasting 2001][ref1], en de projectbeheerder
      [Hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref2] van overeenkomstige toepassing,
      waarbij de aldaar jegens de inspecteur opgelegde verplichtingen mede gelden jegens de door de Minister voor
      Ontwikkelingssamenwerking aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.15
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
