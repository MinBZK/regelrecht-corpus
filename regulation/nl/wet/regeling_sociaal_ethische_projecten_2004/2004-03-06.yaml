  - number: '5'
    text: |-
      Bij de aanvraag van een verklaring moet worden overgelegd een document van de projectbeheerder waarin deze
      schriftelijk verklaart dat:

      a. hij gedurende de looptijd van de af te geven verklaring inzake het project te allen tijde aan daartoe door de
      Minister voor Ontwikkelingssamenwerking aan te wijzen personen toegang verleent tot het project en tot de op het
      project betrekking hebbende financiële, technische en organisatorische gegevens;

      b. hij volstrekte medewerking verleent aan deze personen bij hun taakuitoefening en hen behulpzaam zal zijn;

      c. hij onverwijld deze personen om niet afschriften verstrekt van de documenten die betrekking hebben op het
      project;

      d. hij op verzoek van de Minister voor Ontwikkelingssamenwerking een accountantsverklaring overlegt met betrekking
      tot de door deze minister aan te geven aspecten;

      e. hij zal voldoen aan de voorwaarden die opgenomen zullen worden in de verklaring;

      f. hij de vermogenstoestand van het project afzonderlijk, op eenduidige wijze en naar waarheid zal administreren;

      g. hij onverwijld de Minister voor Ontwikkelingssamenwerking in kennis zal stellen van wijzigingen in de uitvoering
      of de toestand van het project waardoor dit afwijkt van het project waarvoor de verklaring is aangevraagd;

      h. hij er mee instemt dat op de zaken aangaande aanvraag, afgifte, intrekking en toepassing van de verklaring en de
      controle hierop uitsluitend Nederlands recht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel5
  - number: '6'
    text: |-
      Bij de aanvraag van een verklaring moet worden overgelegd een document waarin de aanvragende instelling verklaart
      dat zij indien door haar wordt overgegaan tot kapitaalverschaffing:

      a. bij de uitvoering der regeling jegens de door de Minister voor
      Ontwikkelingssamenwerking aangewezen personen de verplichtingen in acht neemt die in
      [Hoofdstuk VIII, afdeling 2, van de Algemene wet inzake rijksbelastingen][ref1] zijn genoemd ten opzichte van
      de inspecteur;

      b. onverwijld de Minister voor Ontwikkelingssamenwerking in kennis stelt van wijzigingen in de uitvoering van het
      project waardoor dit afwijkt van het project waarvoor de verklaring is afgegeven;

      c. erop toeziet dat de vermogenstoestand van het project door de projectbeheerder afzonderlijk wordt
      geadministreerd op een zodanige wijze dat te allen tijde uit boeken en andere bescheiden de voor de
      belastingheffing van belang zijnde gegevens duidelijk blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '7'
    text: |-
      1 De Minister voor Ontwikkelingssamenwerking beslist, in overeenstemming met de Minister van Financiën en de
      Minister van Buitenlandse Zaken, op een aanvraag binnen acht weken na de indiening ervan.

      2 Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel7
  - number: '8'
    text: |-
      1 De verklaring kan voor geen langere periode worden afgegeven dan voor de verwachte levensduur van het project,
      maar voor ten hoogste tien jaren.

      2 De verklaring voor een project vervalt van rechtswege indien binnen 2 jaar na de dag van afgifte van de
      verklaring geen aanvang is gemaakt met de fysieke uitvoering van de werkzaamheden.

      3 De verklaring vermeldt de aard van het project, het projectvermogen, de kredietinstelling of de
      beleggingsinstelling op wiens aanvraag de verklaring wordt afgegeven, de naam van de projectbeheerder, de
      voorwaarden die op de verklaring van toepassing zijn en de periode waarvoor de verklaring geldt.
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel8
  - number: '9'
    text: |-
      1 De ministers kunnen de verklaring intrekken indien:

      a. blijkt dat de uitvoering of toestand van het project in aanzienlijke mate afwijkt van het project op grond
      waarvan de verklaring is afgegeven;

      b. de projectbeheerder de voorwaarden van [artikel 5][ref1] niet nakomt;

      c. de instelling, bedoeld in [artikel 4][ref2], de voorwaarden van [artikel 2, derde lid][ref3], of
      [artikel 6][ref4] niet nakomt;

      d. de projectbeheerder een ander is dan de projectbeheerder die in de aanvraag van een verklaring is gemeld tenzij
      de nieuwe projectbeheerder verklaart te handelen overeenkomstig de bepalingen in [artikel 5][ref5].

      e. de kapitaalverschaffer een ander is dan degene die de aanvraag heeft ingediend tenzij de kapitaalverschaffer
      schriftelijk verklaart te handelen overeenkomstig de bepalingen in [artikel 6][ref6].

      2 Het besluit tot intrekking kan terugwerkende kracht hebben.

      3 De verklaring wordt met terugwerkende kracht ingetrokken indien de ter zake verstrekte gegevens zodanig onjuist
      of onvolledig blijken, dat op de aanvraag een andere beslissing zou zijn genomen, als bij de beoordeling daarvan de
      juiste of volledige gegevens bekend waren geweest.

      4 Het besluit tot intrekking wordt gezonden aan de aanvrager die ingevolge [artikel 4, eerste lid][ref7], een
      aanvraag heeft ingediend.

      5 Een afschrift van het besluit wordt gezonden aan de projectbeheerder en aan de inspecteur Belastingdienst
      Amsterdam.


