        artikel: '5.15'
  - number: '2'
    text: |-
      1 Een verklaring wordt slechts afgegeven voor projecten die naar het oordeel van de ministers:

      a. in hoge mate in het belang zijn van:

        - de voedselzekerheid en voedselverbetering in een ontwikkelingsland;
        - de sociale en culturele ontwikkeling in een ontwikkelingsland of
        - de economische ontwikkeling, werkgelegenheid en regionale ontwikkeling in een ontwikkelingsland;

      b. geen negatieve effecten hebben op het milieu, waaronder begrepen grondstofgebruik en natuur, in de
      desbetreffende regio of elders;

      c. geen negatieve effecten hebben op de sociale omstandigheden, waaronder begrepen de positie van vrouwen en de
      armoede situatie, in de desbetreffende regio of elders;

      d. met participatie van de lokale bevolking tot stand komen en de sociaal-economische situatie van de armen
      verbeteren;

      e. worden uitgevoerd en instandgehouden met behulp van voldoende lokale kennis of op korte termijn beschikken over
      voldoende lokale kennis;

      f. lokaal een demonstratiekarakter hebben en aldaar navolging kunnen vinden;

      g. tot stand komen in een omgeving waarin bestaande formele financieringskanalen geen of nauwelijks toegang tot
      kredietverlening bieden; en

      h. in overeenstemming zijn met het Nederlandse buitenlandse en ontwikkelingsbeleid.

      2 Onverminderd het eerste lid kan voorts een verklaring worden afgegeven voor projecten in ontwikkelingslanden op
      het gebied van:

      a. krediet aan financiële instellingen voor het micro- en kleinbedrijf. Het betreft de specifieke dienstverlening
      aan het micro- en kleinbedrijf in ontwikkelingslanden waarbij de door de financiële instelling verstrekte
      financiering aan de eindbegunstigde niet groter is dan € 24.957 per begunstigde;

      b. krediet aan coöperaties. Dit betreft coöperaties in ontwikkelingslanden waarbij de kapitaalinbreng per lid
      maximaal € 24.957 betreft. Het eigen vermogen of risico dragend vermogen is geheel door de leden bijeen gebracht.
      De coöperatie staat geregistreerd bij de Kamer van Koophandel/Register voor Coöperaties in het land waar de
      coöperatie actief is;

      c. krediet ten behoeve van landbouwprojecten in ontwikkelingslanden die als biologisch zijn gecertificeerd op basis
      van EU bepalingen;

      d. krediet aan lokale producenten in ontwikkelingslanden van door FairTrade Labelling Organisations International
      gecertificeerde producten.

      3 Aan een verklaring kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel2
  - number: '3'
    text: |-
      Een verklaring wordt niet afgegeven voor:

      a. een bestaand project;

      b. een project waarvan het projectvermogen meer bedraagt dan € 4.537.802;

      c. een project waarvan niet aannemelijk is dat het enig eigen rendement heeft of zal hebben;

      d. een project waarvan het te verwachten rendement zodanig is dat het naar het oordeel van de ministers zonder
      toepassing van deze regeling tot stand kan komen.
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel3
  - number: '4'
    text: |-
      1 Een verklaring kan slechts worden aangevraagd door en afgegeven aan:

      a. een kredietinstelling die is ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref1], of

      b. een beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2].

      2 De aanvraag voor een verklaring dient te worden ingediend bij de Minister voor Ontwikkelingssamenwerking.

      3 Voor projecten waarvoor reeds eerder een verklaring is afgegeven kan een nieuwe aanvraag eerst drie jaar voor de
      afloop van de geldende verklaring worden ingediend.

      4 De aanvraag wordt ingediend met gebruikmaking van een formulier dat door de Minister voor
      Ontwikkelingssamenwerking op aanvraag beschikbaar wordt gesteld.

      5 Een verklaring wordt slechts afgegeven indien de nadere gegevens die naar het oordeel van de Minister voor
      Ontwikkelingssamenwerking van belang zijn voor de beoordeling van het project binnen een door hem te stellen
      periode worden verstrekt.

      6 Een verklaring wordt slechts afgegeven indien na een gedaan verzoek daartoe een accountantsverklaring is
      overgelegd waaruit de juistheid of de aannemelijkheid van de in de aanvraag vermelde gegevens of overige relevante
      gegevens blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0016457/2004-03-06#Artikel4
