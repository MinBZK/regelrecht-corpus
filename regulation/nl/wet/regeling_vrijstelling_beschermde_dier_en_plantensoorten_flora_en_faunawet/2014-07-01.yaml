preamble:
  text: 'Besluit:'
  url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a
               wet:

                [Flora- en faunawet][ref1];



              b
              de Minister:

                de Minister van Landbouw, Natuurbeheer en Visserij;



              c
               overeenkomst:

                Overeenkomst inzake de internationale handel in bedreigde in het wild levende dier- en plantensoorten
      (Trb. 1975, 23);



              d
               basisverordening:

                [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december 1996 inzake
      de bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer
      (PbEG 1997, L 61);



              e
              uitvoeringsverordening:

                [verordening (EG) nr. 1808/2001](32001R1808) van de Commissie van de Europese Gemeenschappen van 30
      augustus 2001, houdende uitvoeringsbepalingen van [Verordening (EG) nr. 338/97](31997R0338) van de Raad inzake
      de bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer
      (PbEG L 250);



              f
              verordening (EG) 1007/2009:

                verordening (EG) nr. 1007/2009 van het Europees Parlement en de Raad van de Europese Unie van
      16 september 2009 betreffende de handel in zeehondenproducten (PbEU L 286);



              g
              lid-staat:

                land behorende tot de Europese Unie;



              h
               derde land:

                land niet behorende tot de Europese Unie;



              i
              naadloos gesloten pootring:

                pootring die voldoet aan de criteria van artikel 36, vijfde lid, van de uitvoeringsverordening;



              j
               in gevangenschap geboren en gefokte specimens van een diersoort:

                specimens van een diersoort die voldoen aan de criteria van artikel 24 van de uitvoeringsverordening;



              k
              kunstmatig gekweekte specimens van een plantensoort:

                specimens van een plantensoort die voldoen aan de criteria van artikel 26 van de uitvoeringsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: '1.2'
    text: |-
      De begripsbepalingen van artikel 2 van de basisverordening en artikel 1 van de uitvoeringsverordening zijn van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van deze regeling wordt in de bepalingen van de basisverordening en de uitvoeringsverordening
      waarnaar in deze regeling wordt verwezen verstaan onder:
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1
  - number: 1.3.a
    text: |-
      certificaat van oorsprong: certificaat waaruit de oorsprong van specimens van soorten opgenomen in bijlage III bij
      de Overeenkomst blijkt, voor de uitvoer hiervan afgegeven door de nationale administratieve instantie die bevoegd
      is CITES-vergunningen en -certificaten af te geven;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1
  - number: 1.3.b
    text: |-
      douanekantoor aan de grens: douanekantoor dat, indien in Nederland gelegen, is aangewezen in de Regeling aanwijzing
      douanekantoren beschermde dier- en plantensoorten of, indien in een andere lid-staat gelegen, door die andere lid-
      staat is aangewezen overeenkomstig artikel 12 van de basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 75, tweede lid, van de Flora- en faunawet][ref1],
      [artikel 107 van de Gezondheids- en welzijnswet voor dieren][ref2] en de
      [artikelen 4, eerste lid][ref3], [11][ref4], [16, tweede lid, onderdeel b][ref5], [16h][ref6] en
      [artikel 17a, tweede lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0011853#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0011853#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0011853#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0011853#Artikel16h
      [ref7]: https://wetten.overheid.nl/BWBR0011853#Artikel17a
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1a
    references:
