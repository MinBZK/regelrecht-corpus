        artikel: 17a
  - number: 1b.1
    text: |-
      Als beschermde inheemse diersoort als bedoeld in
      [artikel 4, eerste lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] worden aangewezen de
      soorten, genoemd in [bijlage 1][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013486
  - number: 1b.2
    text: |-
      Als dieren als bedoeld in
      [artikel 11, eerste lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] worden aangewezen
      dieren, behorende tot de soorten genoemd in [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013486
  - number: 1b.3
    text: |-
      Als dieren als bedoeld in
      [artikel 11, tweede lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] worden aangewezen
      dieren, behorende tot de soorten genoemd in [bijlage 3][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0013486
  - number: 1b.4
    text: |-
      Als beschermde inheemse dier- en plantensoorten als bedoeld in
      [artikel 16b, tweede lid, onderdeel a, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1]
      worden aangewezen de soorten, genoemd in [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0013486
  - number: 1b.5
    text: |-
      Als diersoorten als bedoeld in
      [artikel 16h, eerste lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] worden aangewezen
      de soorten, genoemd in de [bijlagen 5 tot en met 7][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: 16h
      - id: ref2
        bwb_id: BWBR0013486
  - number: 1c
    text: |-
      Van het verbod, bedoeld in [artikel 34, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1], wordt
      ten behoeve van de bestrijding van ziekten, plagen of onkruiden vrijstelling verleend voor het houden van dieren,
      behorende tot de soorten genoemd in [bijlage 6][ref2] bij deze regeling, met het oog op de productie van van die
      dieren afkomstige producten.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0013486
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0013486
  - number: '2.1'
    text: 'De vrijstellingen, bedoeld in deze regeling, gelden slechts voorzover:'
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel2
  - number: 2.1.a
    text: |-
      met betrekking tot de aanvraag, afgifte, vorm, inhoud, overlegging en geldigheid en het gebruik van
      invoervergunningen, uitvoervergunningen, kennisgevingen van invoer en certificaten, dan wel afschriften daarvan,
      alsmede van merken en etiketten is voldaan aan hetgeen daarover in de basis- en uitvoeringsverordening is bepaald,
      en
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel2
  - number: 2.1.b
    text: |-
      het bewijs daarvan door de houder van de betrokken specimens desgevraagd aan de ambtenaren belast met de handhaving
      van de wet wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel2
  - number: '2.2'
    text: De vrijstellingen genoemd in deze regeling gelden met inachtneming van artikel 43 van de uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de vrijstellingen, bedoeld in de [artikelen 1c][ref1] en
      [7, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013486#Artikel1c
      [ref2]: https://wetten.overheid.nl/BWBR0013486#Artikel7
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013486
        artikel: 1c
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013486
        artikel: '7'
        paragraaf: '5'
  - number: '3.1'
    text: |-
      Indien is voldaan aan artikel 4, eerste onderscheidenlijk tweede, derde of vierde lid, van de basisverordening,
      geldt een vrijstelling van het verbod op het binnen het grondgebied van Nederland brengen, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1] voor specimens van soorten, genoemd in bijlage A, B, C of D bij de
      basisverordening, die vanuit een derde land op het grondgebied van de Europese Gemeenschap worden gebracht en
      bestemd zijn voor Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '3.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, geldt vanaf de plaats van binnenkomst in Nederland tot de plaats van
      bestemming een vrijstelling van het verbod op het vervoer, bedoeld in [artikel 13, eerste lid, van de wet][ref1]
      voor specimens van soorten, genoemd in bijlage A bij de basisverordening, specimens van soorten, behorende
      tot beschermde inheemse dier- of plantensoorten, genoemd in bijlage B, C of D bij de basisverordening, alsmede
      specimens van soorten als aangewezen in artikel 2 of artikel 4, eerste lid, onderdeel c, van de Regeling aanwijzing
      beschermde dier- en plantensoorten [Flora- en faunawet][ref2], voorzover deze soorten voorkomen op één van de
      bijlagen bij de basisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
  - number: '4.1'
    text: |-
      Indien is voldaan aan artikel 4, eerste onderscheidenlijk tweede, derde of vierde lid, van de basisverordening,
      geldt een vrijstelling van het verbod op het binnen of buiten het grondgebied van Nederland brengen, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1] voor specimens van soorten, genoemd in bijlage A, B, C of D bij de
      basisverordening, die vanuit een derde land op het grondgebied van de Europese Gemeenschap worden gebracht en
      bestemd zijn voor een andere lid-staat dan Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '4.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid, geldt vanaf de plaats van binnenkomst in Nederland tot aan de
      grens een vrijstelling van het verbod op het vervoer, bedoeld in [artikel 13, eerste lid, van de wet][ref1]
      voor specimens van soorten, genoemd in bijlage A bij de basisverordening, specimens van soorten, behorende
      tot beschermde inheemse dier- of plantensoorten, genoemd in bijlage B, C of D bij de basisverordening, alsmede
      specimens van soorten als aangewezen in artikel 2 of artikel 4, eerste lid, onderdeel c, van de Regeling aanwijzing
      beschermde dier- en plantensoorten [Flora- en faunawet][ref2], voorzover deze soorten voorkomen op één van de
      bijlagen bij de basisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
  - number: '5'
    text: De vrijstellingen genoemd in deze paragraaf gelden met inachtneming van artikel 23 van de uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel5
  - number: '6.1'
    text: |-
      Van de verboden op het binnen of buiten het grondgebied van Nederland brengen, alsmede het vervoer, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1] wordt ten behoeve van doorvoer vrijstelling verleend voor specimens van
      soorten, genoemd in bijlage A, B, C of D bij de basisverordening, die zijn verzonden vanuit een derde land en via
      Nederland bestemd zijn voor een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '6.2'
    text: |-
      Van de verboden op het binnen of buiten het grondgebied van Nederland brengen, alsmede op
      het vervoeren, bedoeld in [artikel 13, eerste lid, van de wet][ref1] wordt ten behoeve van
      doorvoer vrijstelling verleend voor dieren en producten van dieren van de soorten, genoemd in
      __REF001___________________________________________________________________________________________________________
      _________, die zijn verzonden vanuit een derde land en bestemd zijn voor doorvoer via Nederland naar een derde
      land.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013485#Artikel4
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0013485
        artikel: '4'
  - number: '6.3'
    text: |-
      De vrijstellingen als bedoeld in het eerste lid gelden met inachtneming van artikel 7, tweede lid, van de
      basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel6
  - number: '7'
    text: |-
      Ten behoeve van het intracommunautaire verkeer geldt een vrijstelling van
      [artikel 13, eerste lid, van de wet][ref1], voor het binnen of buiten het grondgebied van Nederland brengen van:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 7.a
    text: |-
      specimens van soorten, genoemd in bijlage A, B, C of D bij de basisverordening, voorzover betreffende specimens
      aantoonbaar overeenkomstig de in een lid-staat geldende wetgeving en met inachtneming van de basisverordening en
      uitvoeringsverordening zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel7
  - number: 7.b
    text: |-
      geprepareerde producten van dieren, waarop het verbod als bedoeld in [artikel 62, eerste lid, van de wet][ref1] van
      toepassing is, niet behorende tot soorten als bedoeld in onderdeel a, voorzover betreffende producten aantoonbaar
      overeenkomstig de in een lid-staat geldende wetgeving zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel62
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '62'
  - number: '8.1'
    text: |-
      Indien is voldaan aan artikel 5, eerste onderscheidenlijk vierde lid, van de basisverordening, geldt een
      vrijstelling van het verbod op het binnen of buiten het grondgebied van Nederland brengen, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1] voor specimens van soorten, genoemd in bijlage A, B of C bij de
      basisverordening, die vanuit Nederland of vanuit een andere lid-staat via Nederland buiten het grondgebied van de
      Europese Gemeenschap worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '8.2'
    text: |-
      Indien een fytosanitair certificaat, dat voldoet aan artikel 8, zesde en zevende lid, van de
      uitvoeringsverordening, is afgegeven door de Plantenziektenkundige Dienst of door een bevoegde administratieve
      instantie van een andere lid-staat, geldt een vrijstelling van het verbod op het binnen of buiten het grondgebied
      van Nederland brengen, bedoeld in [artikel 13, eerste lid, van de wet][ref1] voor kunstmatig gekweekte hybriden
      van niet van een annotatie voorziene soorten genoemd in bijlage A bij de basisverordening en kunstmatig gekweekte
      planten van soorten, genoemd in bijlage B of C bij de basisverordening, die vanuit Nederland of vanuit een andere
      lid-staat via Nederland buiten het grondgebied van de Europese Gemeenschap worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '8.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid, geldt ten behoeve van uitvoer een vrijstelling voor het
      vervoer, bedoeld in [artikel 13, eerste lid, van de wet][ref1], voor specimens van soorten, genoemd in bijlage A
      bij de basisverordening, specimens van soorten, behorende tot beschermde inheemse dier- of plantensoorten, genoemd
      in bijlage B of C bij de basisverordening, alsmede specimens van soorten als aangewezen in artikel 2 of artikel 4,
      eerste lid, onderdeel c, van de Regeling aanwijzing beschermde dier- en plantensoorten [Flora- en faunawet][ref2],
      voorzover deze soorten voorkomen op één van de bijlagen bij de basisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
  - number: '8.4'
    text: |-
      Van het verbod op het binnen of buiten het grondgebied van Nederland brengen en het vervoer, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor specimens van soorten, genoemd in
      bijlage D bij de basisverordening, die vanuit Nederland of vanuit een andere lid-staat via Nederland buiten het
      grondgebied van de Europese Gemeenschap worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '9'
    text: |-
      Indien voldaan is aan artikel 7, derde lid, van de basisverordening en artikel 27 onderscheidenlijk artikel 28
      van de uitvoeringsverordening, geldt een vrijstelling van het verbod op het binnen of buiten het grondgebied van
      Nederland brengen alsmede het vervoer, bedoeld in [artikel 13, eerste lid, van de wet][ref1] voor dode specimens,
      delen daarvan of daaruit verkregen producten van soorten, genoemd in bijlage A, B, C of D bij de basisverordening,
      die vallen onder persoonlijke bezittingen of huisraad die vanuit een derde land op het grondgebied van de
      Gemeenschap worden gebracht en bestemd zijn voor een lid-staat of die vanuit een lid-staat worden uitgevoerd naar
      een derde land.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '10.1'
    text: |-
      Met uitzondering van het verbod op het binnen of buiten het grondgebied van Nederland brengen of het onder zich
      hebben, geldt een vrijstelling van de verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1] voor:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 10.1.a
    text: |-
      specimens van soorten, genoemd in bijlage A bij de basisverordening, indien een certificaat is afgegeven op grond
      van artikel 8, derde lid, van de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
  - number: 10.1.b
    text: |-
      in gevangenschap geboren en gefokte specimens van de in bijlage VIII bij de uitvoeringsverordening genoemde
      diersoorten en de hybriden daarvan, indien voldaan is aan artikel 32, onderdeel a, bij de uitvoeringsverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
  - number: 10.1.c
    text: kunstmatig gekweekte specimens van plantensoorten, genoemd in bijlage A bij de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
  - number: 10.1.d
    text: |-
      meer dan 50 jaar geleden verkregen bewerkte specimens, genoemd in bijlage A bij de basisverordening, als omschreven
      in artikel 2, onder w, van de basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
  - number: '10.2'
    text: |-
      Onverminderd [artikel 13, vierde lid, van de wet][ref1], geldt met uitzondering van het verbod op het binnen
      of buiten het grondgebied van Nederland brengen of onder zich hebben, een vrijstelling van de verboden, bedoeld
      in [artikel 13, eerste lid, van de wet][ref2] voor specimens van soorten, genoemd in bijlage B, C of D bij de
      basisverordening, indien kan worden aangetoond dat betreffende specimens overeenkomstig het bij of krachtens de
      wet bepaalde en met inachtneming van de basisverordening en uitvoeringsverordening in Nederland zijn gebracht of
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '10.3'
    text: |-
      De vrijstellingen, bedoeld in het eerste en tweede lid, zijn van toepassing, voorzover voldaan is aan de krachtens
      [artikel 18 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
  - number: '10.4'
    text: |-
      De vrijstellingen, bedoeld in het eerste en tweede lid, zijn niet van toepassing op aan de natuur onttrokken
      specimens van soorten die voorkomen op bijlage IV bij [richtlijn 92/43](31992L0043) EEG van de Raad van de Europese
      Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna
      (PbEG L 206).
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel10
  - number: '11.1'
    text: |-
      Van het verbod op het onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1] geldt een
      vrijstelling voor dode specimens van in gevangenschap geboren en gefokte of uit het wild afkomstige dieren,
      behorende tot beschermde uitheemse diersoorten, genoemd in bijlage A bij de basisverordening, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 11.1.a
    text: |-
      het meer dan 50 jaar geleden verkregen bewerkte specimens betreft als omschreven in artikel 2, onder w, van de
      basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.1.b
    text: |-
      het persoonlijke bezittingen of huisraad betreft als omschreven in artikel 2, onderdeel j, van de basisverordening
      of
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.1.c
    text: |-
      kan worden aangetoond dat betreffende specimens overeenkomstig het bij of krachtens de wet bepaalde en met
      inachtneming van de basisverordening en uitvoeringsverordening in Nederland zijn gebracht of verkregen.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd [artikel 13, vierde lid, van de wet][ref1], geldt een vrijstelling van het verbod op het onder zich
      hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref2] voor levende en dode specimens van in gevangenschap
      geboren en gefokte dieren, behorende tot beschermde uitheemse diersoorten, genoemd in bijlage B, C of D bij de
      basisverordening, indien kan worden aangetoond dat de dieren in Nederland zijn gefokt, of indien het eieren, nesten
      of producten van die soorten betreft, betrokken producten van gefokte dieren afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '11.3'
    text: 'De vrijstellingen, bedoeld in het eerste en tweede lid, zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.3.a
    text: |-
      aan de natuur onttrokken dode specimens van soorten die voorkomen op bijlage IV, letter a), bij [richtlijn 92/43]
      (31992L0043) EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992 inzake de instandhouding van de
      natuurlijke habitats en de wilde flora en fauna (PbEG L 206);
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.3.b
    text: |-
      te prepareren producten van dieren, behorende tot de soorten roofvogels (orde Falconiformes) of uilen (orde
      Strigiformes), behorende tot beschermde uitheemse soorten, genoemd in bijlage A of B bij de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.3.c
    text: |-
      dode specimens van soorten, genoemd in bijlage A bij de basisverordening, voorzover het betreft botten en daarvan
      of daarmede vervaardigde producten van de tijger (Panthera tigris) en hoorns en daarvan of daarmede vervaardigde
      producten anders dan jachttrofeeën van Ceratotherium simum simum afkomstig van de populatie van Zuid-Afrika, van de
      soorten van de familie neushoorns (Rhinocerotidea);
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: 11.3.d
    text: |-
      levende specimens van soorten, behorende tot de orde van de primaten (Primates), de familie van de
      katachtigen (Felidae) genoemd in Bijlage 3 van de Regeling aanwijzing beschermde dier- en plantensoorten
      [Flora- en faunawet][ref1] of de fretkat (Cryptoprocta ferox), genoemd in bijlage B bij de basisverordening,
      behorende tot beschermde uitheemse diersoorten, genoemd in bijlage B bij de basisverordening;


      [ref1]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009640
  - number: 11.3.e
    text: |-
      voorzover het het bezit in het veld betreft, levende specimens van de soorten roofvogels (orde Falconiformes)
      of uilen (orde Strigiformes), behorende tot beschermde uitheemse diersoorten, genoemd in bijlage B bij de
      basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel11
  - number: '12.1'
    text: |-
      Van het verbod op het onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1] geldt een
      vrijstelling voor levende en dode specimens van in gevangenschap geboren en gefokte vogels, behorende tot
      beschermde inheemse diersoorten, genoemd in bijlage A, B, C of D bij de basisverordening, en levende specimens van
      in gevangenschap geboren en gefokte vogels, behorende tot beschermde uitheemse diersoorten, genoemd in bijlage A
      bij de basisverordening, indien kan worden aangetoond dat de vogels gefokt zijn, of, indien het eieren, nesten of
      producten van die vogels betreft, betrokken producten van gefokte vogels afkomstig zijn en voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 12.1.a
    text: |-
      deze vogels zijn voorzien van een naadloos gesloten pootring, met uitzondering van de vogelsoorten, bedoeld in
      bijlage VIII bij de uitvoeringsverordening, voorzover deze soorten niet van een annotatie zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: 12.1.b
    text: |-
      registratie heeft plaatsgevonden in de administratie, bedoeld in
      [artikel 8 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel8
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '8'
  - number: 12.1.c
    text: |-
      voldaan is aan de krachtens [artikel 18 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1]
      gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
  - number: '12.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, geldt eveneens voor levende en dode specimens van in gevangenschap
      geboren en gefokte vogels, behorende tot beschermde inheemse of uitheemse diersoorten, genoemd in bijlage A bij de
      basisverordening, indien deze vogels in overeenstemming met artikel 36 van de uitvoeringsverordening zijn voorzien
      van een microchiptransponder.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: '12.3'
    text: |-
      Indien een naadloos gesloten pootring of microchiptransponder als bedoeld in het eerste of tweede lid, wegens
      lichamelijke kenmerken van de betrokken specimens aantoonbaar niet veilig kan worden aangebracht, geldt de
      vrijstelling, bedoeld in het eerste lid, eveneens, indien een daartoe strekkende door de Minister of een door een
      overheidsorgaan van een andere lid-staat afgegeven verklaring kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: '12.4'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: 12.4.a
    text: |-
      te prepareren producten van dieren, behorende tot de orde roofvogels (Falconidae) of uilen (Strigiformes),
      behorende tot beschermde inheemse of uitheemse diersoorten, genoemd in bijlage A of B bij de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: 12.4.b
    text: |-
      levende specimens van de soort havik (Accipiter gentilis), behorende tot beschermde inheemse diersoorten, genoemd
      in bijlage A bij de basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: 12.4.c
    text: |-
      onverminderd onderdeel b, voorzover het het bezit in het veld betreft, levende specimens van de soorten roofvogels
      (orde Falconiformes) of uilen (orde Strigiformes), behorende tot beschermde inheemse of uitheemse diersoorten,
      genoemd in bijlage A of B bij de basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel12
  - number: '13.1'
    text: |-
      In Nederland in gevangenschap geboren en gefokte vogels als bedoeld in [artikel 12, eerste lid][ref1], met
      uitzondering van de vogelsoorten, bedoeld in bijlage VIII bij de uitvoeringsverordening, voorzover deze soorten
      niet van een annotatie zijn voorzien, zijn aantoonbaar rechtmatig voorzien van een door de Minister op aanvraag
      afgegeven naadloos gesloten pootring.


      [ref1]: https://wetten.overheid.nl/BWBR0013486#Artikel12
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013486
        artikel: '12'
        paragraaf: '9'
  - number: '13.2'
    text: |-
      De vrijstelling, bedoeld in [artikel 12, eerste en tweede lid][ref1], geldt eveneens voor in andere staten
      dan Nederland in gevangenschap geboren en gefokte vogels, die voorzien zijn van een merkteken, dat aantoonbaar
      overeenkomstig de in die andere staat geldende regelgeving en met inachtneming van artikel 36 van de
      basisverordening is afgegeven en aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013486#Artikel12
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013486
        artikel: '12'
        paragraaf: '9'
  - number: '14.1'
    text: |-
      Van het verbod op het onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1] geldt een
      vrijstelling voor levende specimens van in gevangenschap geboren en gefokte gewervelde dieren, behorende tot
      beschermde uitheemse diersoorten, genoemd in bijlage A bij de basisverordening, die geen in gevangenschap geboren
      en gefokte vogels zijn, indien kan worden aangetoond dat de betreffende dieren gefokt zijn en voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 14.1.a
    text: |-
      gewervelde dieren in overeenstemming met artikel 36, eerste lid, onderdeel b, van de uitvoeringsverordening, zijn
      voorzien van een microchiptransponder en
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
  - number: 14.1.b
    text: |-
      voldaan is aan de krachtens [artikel 18 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1]
      gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
  - number: '14.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, geldt eveneens, indien in overeenstemming met artikel 36 van de
      uitvoeringsverordening een ander merkteken is aangebracht, voorzover de Minister of een overheidsorgaan van een
      andere lid-staat dan Nederland een schriftelijke verklaring heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
  - number: '14.3'
    text: |-
      Indien een microchiptransponder of een ander merkteken als bedoeld in het eerste of tweede lid, wegens lichamelijke
      kenmerken van de betrokken specimens aantoonbaar niet veilig kan worden aangebracht, geldt de vrijstelling, bedoeld
      in het eerste lid, eveneens, indien een daartoe strekkende door de Minister of een door een overheidsorgaan van een
      andere lid-staat afgegeven verklaring kan worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
  - number: '14.4'
    text: |-
      De vrijstellingen, bedoeld in het eerste lid, zijn niet van toepassing op levende specimens van soorten, behorende
      tot de orde van de primaten (Primates) of de familie van de katachtigen (Felidae), behorende tot beschermde
      uitheemse diersoorten, genoemd in bijlage A bij de basisverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14
  - number: 14a.1
    text: |-
      Er geldt een vrijstelling van het verbod, bedoeld in [artikel 13, eerste lid, van de wet][ref1], voor het onder
      zich hebben van levende of dode wolven, indien kan worden aangetoond dat: - de dieren in gevangenschap zijn geboren
      en gefokt, en
        - dat de dieren vóór 1 juli 2014 in Nederland zijn gebracht of verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 14a.2
    text: |-
      Er geldt een vrijstelling van het verbod, bedoeld in [artikel 13, eerste lid, van de wet][ref1] voor het onder
      zich hebben van producten van wolven, indien kan worden aangetoond dat die producten afkomstig zijn van wolven als
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '15.1'
    text: |-
      Van het verbod op het onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1] geldt een
      vrijstelling voor dode specimens van kunstmatig gekweekte of uit het wild afkomstige planten, behorende tot
      beschermde uitheemse plantensoorten, genoemd in bijlage A bij de basisverordening, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 15.1.a
    text: |-
      het meer dan 50 jaar verkregen bewerkte specimens betreft als omschreven in artikel 2, onder w, van de
      basisverordening;
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
  - number: 15.1.b
    text: |-
      het persoonlijke bezittingen of huisraad betreft als omschreven in artikel 2, onderdeel j, van de basisverordening
      of indien
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
  - number: 15.1.c
    text: |-
      kan worden aangetoond dat betreffende specimens overeenkomstig het bij of krachtens de wet bepaalde en met
      inachtneming van de basisverordening en uitvoeringsverordening in Nederland zijn gebracht of verkregen.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
  - number: '15.2'
    text: |-
      Onverminderd [artikel 13, vierde lid, van de wet][ref1], geldt een vrijstelling van het verbod op het onder
      zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref2] voor levende en dode specimens van kunstmatig
      gekweekte planten, behorende tot beschermde uitheemse plantensoorten, genoemd in bijlage B, C of D bij de
      basisverordening, indien kan worden aangetoond dat de planten in Nederland zijn gekweekt, of, indien het producten
      van die planten betreft, betrokken producten van gekweekte planten afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '15.3'
    text: |-
      Van het verbod op het onder zich hebben, bedoeld in [artikel 13, eerste lid, van de wet][ref1] geldt een
      vrijstelling voor levende en dode specimens van kunstmatig gekweekte planten, behorende tot beschermde inheemse
      plantensoorten, genoemd in bijlage A, B, C of D bij de basisverordening, en levende specimens van kunstmatig
      gekweekte planten, behorende tot beschermde uitheemse plantensoorten, genoemd in bijlage A bij de basisverordening,
      indien kan worden aangetoond dat betreffende specimens overeenkomstig het bij of krachtens de wet bepaalde en met
      inachtneming van de basisverordening en uitvoeringsverordening in Nederland zijn gebracht of verkregen, of, indien
      kan worden aangetoond dat de planten in Nederland zijn gekweekt, of, indien het producten van die planten betreft,
      betrokken producten van gekweekte planten afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '15.4'
    text: |-
      De vrijstellingen, bedoeld in het eerste, tweede of derde lid, zijn van toepassing, voorzover voldaan is aan de
      krachtens [artikel 18 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
  - number: '15.5'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op aan de natuur onttrokken dode specimens van
      soorten die voorkomen op bijlage IV, letter b), bij [richtlijn 92/43](31992L0043) EEG van de Raad van de Europese
      Gemeenschappen van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna
      (PbEG L 206).
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel15
  - number: '16.1'
    text: |-
      Indien kan worden aangetoond dat specimens van soorten, genoemd in bijlage A, B, C of D bij de basisverordening,
      overeenkomstig het bij of krachtens de wet bepaalde en met inachtneming van de basisverordening en de
      uitvoeringsverordening rechtmatig binnen het grondgebied van Nederland zijn gebracht of verkregen, geldt, met
      inachtneming van artikel 9 van de basisverordening, een vrijstelling van het verbod op het vervoer, bedoeld in
      [artikel 13, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '16.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, geldt niet voor levende specimens van de soorten roofvogels (orde
      Falconiformes) of uilen (orde Strigiformes), behorende tot beschermde inheemse of uitheemse diersoorten, zoals
      opgenomen in bijlage A of B bij de basisverordening, voorzover het het vervoer in het veld betreft.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel16
  - number: '17'
    text: |-
      Onverminderd de bepalingen van de basisverordening en de uitvoeringsverordening, wordt een ontheffing als bedoeld
      in [artikel 75 van de wet][ref1] van de verboden voor het vervoer of onder zich hebben van een levende gefokte
      havik (Accipiter gentilis) slechts verleend, indien in overeenstemming met artikel 25 van de uitvoeringsverordening
      de aanvrager door het overleggen van DNA-fingerprints van zowel de oudervogels als de jonge vogel het bewijs levert
      dat de vogels inderdaad in gevangenschap zijn gefokt.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
  - number: '18'
    text: |-
      Van de verboden op het binnen of buiten het grondgebied van Nederland brengen, vervoeren en onder zich hebben,
      bedoeld in [artikel 13, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor specimens uit herbaria en
      andere geconserveerde, gedroogde of ingesloten specimens uit musea en voor levende planten, van soorten genoemd in
      bijlage A, B, C of D bij de basisverordening, indien is voldaan aan artikel 7, vierde lid, van de basisverordening
      en artikel 22 van de uitvoeringsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
  - number: '19.1'
    text: |-
      Van de verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor in
      gevangenschap geboren en gefokte dieren of kunstmatig gekweekte planten, behorende tot beschermde uitheemse dier-
      of plantensoorten, bedoeld in artikel 4, eerste lid, onderdeel b, van de Regeling aanwijzing beschermde dier- en
      plantensoorten [Flora- en faunawet][ref2], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
  - number: 19.1.a
    text: |-
      kan worden aangetoond dat de planten in Nederland gekweekt of de dieren in Nederland gefokt zijn, of, indien het
      producten van die planten of dieren betreft, betrokken producten van gekweekte planten of gefokte dieren afkomstig
      zijn, of,
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel19
  - number: 19.1.b
    text: |-
      bedoelde gefokte dieren of gekweekte planten of producten daarvan aantoonbaar in overeenstemming met de in een lid-
      staat geldende regelgeving zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel19
  - number: '19.2'
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is van toepassing, voorzover voldaan is aan de krachtens
      [artikel 18 van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011853#Artikel18
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011853
        artikel: '18'
  - number: '20.1'
    text: |-
      Van de verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor dieren
      en producten van dieren van de soorten, genoemd in artikel 4, tweede lid, onderdeel b, van de Regeling aanwijzing
      beschermde dier- en plantensoorten [Flora- en faunawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009640
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009640
  - number: '20.2'
    text: |-
      De in het eerste lid bedoelde vrijstelling geldt niet voor het vanuit derde landen binnen het grondgebied van
      Nederland brengen van pelzen en goederen die pelzen of delen daarvan bevatten, tenzij voldaan is aan [Verordening
      (EEG) nr. 3254/91](31991R3254) van de Raad van de Europese Gemeenschappen van 4 november 1991 houdende een verbod
      op het gebruik van de wildklem in de Gemeenschap en op het binnenbrengen in de Gemeenschap van pelzen en producten
      die vervaardigd zijn van bepaalde in het wild levende diersoorten uit landen waar gebruik wordt gemaakt van de
      wildklem of andere vangmethoden die niet stroken met de internationale normen voor humane vangst met behulp van
      vallen (PbEG L 308) en [Verordening (EG) nr. 35/97](31997R0035) van de Commissie van de Europese Gemeenschappen van
      10 januari 1997 tot vaststelling van bepalingen betreffende de certificatie van pelzen en goederen die vallen onder
      [Verordening (EEG) nr. 3254/91](31991R3254) van de Raad (PbEG L 8).
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20
  - number: 20a.1
    text: |-
      Van de verboden, bedoeld in de [artikelen 9][ref1] en [10 van de wet][ref2], en het verbod op het onder zich hebben
      van beschermde inheemse diersoorten, bedoeld in [artikel 13, eerste lid, van de wet][ref3], wordt vrijstelling
      verleend voor de aal (Anguilla anguilla).


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009640#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel13
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0009640
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '13'
  - number: 20a.2
    text: 'De vrijstelling, bedoeld in het eerste lid, is alleen van toepassing, indien kan worden aangetoond:'
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20a
  - number: 20a.2.−
    text: |-
      dat is voldaan aan het bij of krachtens de [Visserijwet 1963][ref1] bepaalde, of


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: 20a.2.–
    text: |-
      dat de aal in Nederland is gebracht of verkregen overeenkomstig het bij of krachtens de wet bepaalde en met
      inachtneming van de basisverordening en uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20a
  - number: 20b.1
    text: |-
      De verboden, bedoeld in [artikel 13, eerste lid, van de wet][ref1],
      gelden niet ten aanzien van producten van dieren van de soorten, genoemd in
      __REF001___________________________________________________________________________________________________________
      __________, voor zover is voldaan aan de voorwaarden, genoemd in artikel 3 van verordening (EG) 1007/2009, en
      evenmin ten aanzien van dieren van deze soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013485#Artikel4
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0013485
        artikel: '4'
  - number: 20b.2
    text: |-
      De [artikelen 3 tot en met 5][ref1], [7 tot en met 11][ref2] en [16][ref3] zijn niet van toepassing op producten
      van dieren van de soorten, bedoeld in het eerste lid, die eveneens worden genoemd in bijlage A, B, C of D bij de
      basisverordening, tenzij is voldaan aan de voorwaarden, genoemd in artikel 3, eerste en tweede lid, van verordening
      (EG) 1007/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0013486#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013486#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013486#Artikel16
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0013486
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0013486
        artikel: '7'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0013486
        artikel: '16'
        paragraaf: '12'
  - number: 20b.3
    text: |-
      De in het eerste lid bedoelde vrijstelling is niet van toepassing op het vanuit andere landen dan lidstaten van
      de Europese Unie binnen het grondgebied van Nederland brengen van huiden van jonge dieren, of delen of producten
      daarvan, van de soorten klapmuts (Cystophora cristata) en zadelrob (Phoca groenlandica), voor zover deze producten
      niet afkomstig zijn van de traditionele jacht van de Inuit en andere inheemse gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel20b
  - number: '21'
    text: |-
      Een wijziging van bijlage IV bij [Richtlijn nr. 92/43/EEG](31992L0043) van de Raad van de Europese Gemeenschappen
      van 21 mei 1992 inzake de instandhouding van de natuurlijke habitats en de wilde flora en fauna (PbEG L 206) geldt
      voor de toepassing van deze regeling met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel21
  - number: '22'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop [artikel 75, tweede lid, van de Flora- en faunawet][ref1] en
      [artikel 17a van het Besluit vrijstelling beschermde dier- en plantensoorten][ref2] in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0009640#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0011853#Artikel17a
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009640
        artikel: '75'
      - id: ref2
        bwb_id: BWBR0011853
        artikel: 17a
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Regeling vrijstelling beschermde dier- en plantensoorten Flora- en faunawet.'
    url: https://wetten.overheid.nl/BWBR0013486/2014-07-01#Artikel23
