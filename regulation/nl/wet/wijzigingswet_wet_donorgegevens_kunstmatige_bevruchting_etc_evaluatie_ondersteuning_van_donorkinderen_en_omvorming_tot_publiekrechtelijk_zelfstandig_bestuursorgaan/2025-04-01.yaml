preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging genomen hebben, dat het noodzakelijk is om in verband met de tweede evaluatie van de
    wet, het actieplan ter ondersteuning van donorkinderen en de omvorming van de Stichting donorgegevens kunstmatige
    donorbevruchting tot publiekrechtelijk zelfstandig bestuursorgaan de Wet donorgegevens kunstmatige bevruchting
    te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De voorzitter en leden die op het tijdstip van inwerkingtreding van deze wet zijn benoemd als voorzitter
      onderscheidenlijk lid van het bestuur van de Stichting donorgegevens kunstmatige bevruchting, worden met ingang
      van dat tijdstip benoemd tot voorzitter onderscheidenlijk lid van het College, ieder voor de resterende duur van
      diens benoemingsperiode.
    url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelII
  - number: III
    text: |-
      1 De gegevens die de Stichting donorgegevens kunstmatige bevruchting ter uitvoering van haar taken in bewaring en
      in beheer heeft op het tijdstip van inwerkingtreding van deze wet, worden overgedragen aan het College.

      2 Archiefbescheiden van de Stichting donorgegevens kunstmatige bevruchting betreffende zaken die op het tijdstip
      van inwerkingtreding van deze wet nog niet zijn afgedaan, worden overgedragen aan het College, voor zover zij niet
      overeenkomstig de [Archiefwet 1995][ref1] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: IV
    text: |-
      In wettelijke procedures en rechtsgedingen, waarbij de Stichting donorgegevens kunstmatige bevruchting is
      betrokken, treedt op het tijdstip van inwerkingtreding van deze wet het College in de plaats van de Stichting
      donorgegevens kunstmatige bevruchting.
    url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelIV
  - number: V
    text: |-
      De rechten en verplichtingen die de Stichting donorgegevens kunstmatige bevruchting heeft op het tijdstip van
      inwerkingtreding van deze wet, gaan op dat tijdstip over op de Staat.
    url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelV
  - number: VIII
    text: |-
      Deze wet treedt in werking op een bij Koninklijk Besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048615/2025-04-01#ArtikelVIII
