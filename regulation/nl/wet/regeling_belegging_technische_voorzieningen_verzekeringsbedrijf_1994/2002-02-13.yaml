        artikel: '94'
  - number: '2'
    text: |-
      1 De waarden tot dekking van de technische voorzieningen worden in de volgende categorieën van activa aangehouden:



              Beleggingen:

                obligaties en andere geld- en kapitaalmarktinstrumenten;
      leningen;
      aandelen en andere met aandelen gelijk te stellen niet-vastrentende waardepapieren;
      rechten van deelneming in instellingen voor collectieve belegging in effecten en deelnemingen in andere
      beleggingsfondsen;
      terreinen en gebouwen, alsmede zakelijke rechten op onroerende zaken;



              Vorderingen:

                vorderingen op herverzekeraars, met inbegrip van het aandeel van herverzekeraars in de technische
      voorzieningen;
      deposito's en vorderingen uit hoofde van herverzekering;
      vorderingen op verzekeringnemers en tussenpersonen uit hoofde van overeenkomsten van verzekering en herverzekering,
      voorzover binnen drie maanden opeisbaar;
      voor het schadeverzekeringsbedrijf: vorderingen uit hoofde van verhaalsrecht of subrogatie; voor het
      levensverzekeringsbedrijf; voorschotten op polissen;
      belastingtegoeden;
      vorderingen op garantiefondsen;



              Andere activa:

                materiële vaste activa, andere dan terreinen en gebouwen;
      liquide middelen en deposito's bij kredietinstellingen of bij andere instellingen die vergunning hebben om
      deposito's te ontvangen;
      overlopende acquisitiekosten;
      lopende interest en huur en andere overlopende posten;
      voor het levensverzekeringsbedrijf: zakelijke rechten waarvan het genot is uitgesteld.




      2 Bij de belegging in een dochteronderneming van de verzekeraar die alle of een deel van de beleggingen van die
      verzekeraar beheert, wordt uitgegaan van de onderliggende activa in het bezit van deze dochteronderneming.
    url: https://wetten.overheid.nl/BWBR0006775/2002-02-13#Artikel2
  - number: '3'
    text: |-
      1 De waarden tot dekking van de technische voorzieningen worden, ten opzichte van het totaal van de technische
      voorzieningen, per categorie van activa als bedoeld in [artikel 2][ref1] verdeeld met inachtneming van de volgende
      maxima:

      a. leningen aan ondernemingen en instellingen, niet zijnde een in een lidstaat gevestigde kredietinstelling,
      verzekeraar of beleggingsinstelling, voor zover deze leningen niet zijn voorzien van een garantie, hypotheek of
      andere zekerheid: vijf procent voor het totaal van deze leningen;

      b. kasmiddelen: drie procent;

      c. aandelen, andere met aandelen gelijk te stellen niet-vastrentende waardepapieren, obligaties en andere geld-
      en kapitaalmarktinstrumenten, voor zover deze effecten niet op een gereglementeerde markt worden verhandeld: tien
      procent voor het totaal van deze effecten.

      2 De waarden tot dekking van de technische voorzieningen worden, ten opzichte van het totaal van de technische
      voorzieningen, per individueel actief als bedoeld in [artikel 2][ref2] verdeeld met inachtneming van de volgende
      maxima:

      a. één bepaald gebouw of terrein dan wel een complex van verschillende gebouwen of terreinen dat als één belegging
      kan worden beschouwd: tien procent per object;

      b. één bepaalde lening aan een onderneming of instelling, niet zijnde een in een lid-staat gevestigde
      kredietinstelling, verzekeraar of beleggingsinstelling, voor zover deze lening niet is voorzien van een garantie,
      hypotheek of andere zekerheid: een procent per lening.

      3 De waarden tot dekking van de technische voorzieningen bestaan, ten opzichte van het totaal van de technische
      voorzieningen, voor maximaal vijf procent uit aandelen, andere met aandelen gelijk te stellen niet-vastrentende
      waardepapieren, obligaties en andere geld en kapitaalmarktinstrumenten uitgegeven door één bepaalde emittent
      of uit leningen aan één bepaalde kredietnemer, te zamen genomen. Waardepapieren uitgegeven of gegarandeerd door
      onderscheidenlijk leningen aan of gegarandeerd door centrale, regionale of lokale overheden of internationale
      instellingen of organisaties waarvan een of meer lid-staten deel uitmaken, blijven hierbij buiten beschouwing.

      4 De Pensioen- & Verzekeringskamer kan op verzoek van een levensverzekeraar het maximum, bedoeld in het eerste lid,
      onderdeel a, verhogen tot acht procent van de technische voorzieningen en het maximum, bedoeld in het tweede lid,
      onderdeel b, tot twee procent van de technische voorzieningen indien: zij van oordeel is dat de belangen van de
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich daartegen niet verzetten.

      5 De Pensioen- & Verzekeringskamer kan bepalen dat voor de toepassing van het derde lid met een overheid
      wordt gelijk gesteld een kredietinstelling met zetel in Nederland, waarvan de aandelen in handen zijn van de
      Nederlandse Staat of Nederlandse provincies, gemeenten, waterschappen of andere openbare lichamen als bedoeld in
      [artikel 134 van de Grondwet][ref3] en waarvan de werkzaamheden statutair bestaan in het door haar tussenkomst
      verstrekken van leningen aan, of met garantie van de Nederlandse Staat of andere overheden, dan wel het verstrekken
      van leningen aan nauw met de Nederlandse Staat of de lokale overheden verbonden instanties.

      6 Het maximum, bedoeld in het derde lid, wordt gesteld op tien procent van de technische voorzieningen mits de
      waarden tot dekking van de technische voorzieningen voor niet meer dan veertig procent bestaan uit leningen aan of
      waardepapieren van kredietnemers en emittenten waarin de verzekeraar meer dan vijf procent van zijn activa heeft
      belegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006775#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006775#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel134
