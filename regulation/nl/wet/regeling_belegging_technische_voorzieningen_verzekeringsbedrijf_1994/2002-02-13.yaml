preamble:
  text: |-
    Gelet op artikel 8, tweede lid, van het Besluit technische voorzieningen verzekeringsbedrijf 1994;

    Gezien het advies van de Verzekeringskamer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006775/2002-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt – voor zover niet anders blijkt – verstaan onder:



            a
            technische voorzieningen:

              de technische voorzieningen, bedoeld in [artikel 66, eerste lid][ref1], en
      [artikel 94, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2] zonder aftrek uit hoofde van
      herverzekering en met uitzondering van die technische voorzieningen waarbij de tot uitkering gerechtigde het
      beleggingsrisico draagt en van de spaarkasbeleggingen;



            b
            gereglementeerde markt:

              de markt, bedoeld in artikel 1, onder 13, van [richtlijn nr. 93/22/EEG](31993L0022) van de Raad van de
      Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in
      effecten (PbEG L 141);



            c
            vorderingen:

              de vorderingen op een derde na verrekening van de opeisbare schulden van de verzekeraar aan die derde.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel94
    url: https://wetten.overheid.nl/BWBR0006775/2002-02-13#Artikel1
