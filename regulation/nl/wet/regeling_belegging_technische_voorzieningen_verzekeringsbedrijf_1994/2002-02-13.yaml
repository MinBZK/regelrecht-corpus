  - number: '4'
    text: |-
      1 Een vordering op een herverzekeraar uit hoofde van een door een verzekeraar met zetel in Nederland als
      verzekeringnemer gesloten herverzekeringsovereenkomst komt als waarde tot dekking van de technische voorzieningen
      in aanmerking voor zover:

      a. geen tegenvordering openstaat; en

      b. het naar het oordeel van de Pensioen- & Verzekeringskamer aannemelijk is dat de vordering in de Gemeenschap
      zal worden voldaan of dat de verzekeraar buiten de Gemeenschap zijn uitkeringen aan verzekerden of gerechtigden op
      uitkeringen zal moeten voldoen.

      2 Het eerste lid is van overeenkomstige toepassing op verzekeraars met zetel buiten de Gemeenschap, met dien
      verstande dat het naar het oordeel van de Pensioen- & Verzekeringskamer aannemelijk moet zijn dat de vordering
      in Nederland zal worden voldaan of dat de verzekeraar buiten Nederland zijn uitkeringen aan verzekerden of
      gerechtigden op uitkeringen zal moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0006775/2002-02-13#Artikel4
  - number: '5'
    text: |-
      Onverminderd het bepaalde in artikel 3 stelt de Pensioen- & Verzekeringskamer nadere regels vast omtrent het
      gebruik van de waarden die dienen tot dekking van de technische voorzieningen en de daarbij in acht te nemen
      voorwaarden, ten aanzien van:

      a. leningen waarvoor niet door middel van een bankgarantie, een garantie toegekend door een verzekeraar, een recht
      van hypotheek of een andere wijze zekerheid is gegeven;

      b. deelnemingen in een beleggingsinstelling als bedoeld in
      [artikel 1 van de Wet toezicht belegginginstellingen][ref1], voor zover op deze instelling [richtlijn nr. 85/611/
      EEG](31985L0611) van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie van de wettelijke
      en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging in effecten (icbe's)
      (PbEG L 375) niet van toepassing is;

      c. effecten die niet worden verhandeld op een gereglementeerde markt;

      d. obligaties en andere geld- en kapitaalmarktinstrumenten uitgegeven door een emittent niet zijnde een centrale,
      regionale of lokale overheid of een ander openbaar lichaam, een internationale organisatie waarvan een of
      meer lid-staten deel uitmaken of een onderneming die behoort tot zone A als bedoeld in artikel 1, punt 14, van
      [Richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000
      betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 126).


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0006775/2002-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '1'
  - number: '6'
    text: |-
      De Pensioen- & Verzekeringskamer kan met inachtneming van
      [artikel 8, eerste lid, van het Besluit technische voorzieningen verzekeringsbedrijf 1994][ref1] in bijzondere
      gevallen ontheffing verlenen van het bepaalde in de [artikelen 2 tot en met 5][ref2] indien de belangen van de
      verzekeringnemers, verzekerden of gerechtigden op uitkeringen zich daartegen niet verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0006732#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006775#Artikel2
