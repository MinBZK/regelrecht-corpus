$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_delegatie_stichting_fonds_mkz_ai
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2004-03-17'
bwb_id: BWBR0016485
url: https://wetten.overheid.nl/BWBR0016485/2004-03-17
preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder Stichting: Stichting Fonds MKZ-AI.'
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel1
  - number: '2.1'
    text: |-
      Op grond van deze regeling kan op aanvraag subsidie worden verstrekt aan ondernemers in de agrarische sector en
      ondernemers in het midden- en kleinbedrijf die uitsluitend als gevolg van de maatregelen ter bestrijding van: -
      ofwel de op 13 maart 2001 uitgebroken mond- en klauwzeerepidemie;
        - ofwel de op 28 februari 2003 uitgebroken Aviaire Influenza-epidemie, en gegeven de omvang van hun inkomensverlies
      en de draagkracht van de onderneming, zodanig ernstig getroffen zijn dat zij de bedrijfsvoering noch op eigen
      kracht noch met behulp van door de rijksoverheid of andere overheden getroffen voorzieningen, met uitzondering
      van de voorziening getroffen in het [Besluit bijstandsverlening zelfstandigen][ref1] respectievelijk het
      [Besluit bijstandsverlening zelfstandigen 2004][ref2] kunnen voortzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0007335
      [ref2]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007335
      - id: ref2
        bwb_id: BWBR0015711
  - number: '2.2'
    text: |-
      De subsidie wordt uitsluitend verstrekt voorzover de subsidie in een redelijke verhouding staat tot de financiële
      gevolgen van de maatregelen ter bestrijding van de mond- en klauwzeerepidemie onderscheidenlijk de Aviaire
      Influenza-epidemie en een aantoonbaar causaal verband bestaat tussen de tegemoetkoming en de ter bestrijding van de
      mond- en klauwzeerepidemie onderscheidenlijk de Aviaire Influenza-epidemie getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel2
  - number: '2.3'
    text: |-
      De subsidies worden verstrekt in de vorm van rentesubsidies voor kortlopend overbruggingskrediet, voor krediet voor
      werkkapitaal en voor krediet ten behoeve van investeringen.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel2
  - number: '3'
    text: 'De subsidieverstrekking geschiedt:'
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel3
  - number: 3.a
    text: |-
      indien de aanvraag is gedaan ten behoeve van een agrarische ondernemer, in overeenstemming met: - de Communautaire
      richtsnoeren voor staatssteun in de landbouwsector (PB C 28, 1 februari 2000);
        - de Communautaire richtsnoeren voor reddings- en herstructureringssteun aan ondernemingen in moeilijkheden (PB C
      288, 9 oktober 1999).
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel3
  - number: 3.b
    text: |-
      indien de aanvraag is gedaan ten behoeve van een ondernemer in het midden- en kleinbedrijf die niet actief is in
      de transportsector, in overeenstemming met: - de [Verordening (EG) nr. 70/2001](32001R0070) van de Commissie van de
      Europese Gemeenschappen van 12 januari 2001 betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag
      op staatssteun voor kleine en middelgrote ondernemingen (PbEG L 10).
        - de [Verordening (EG) nr. 69/2001](32001R0069) van de Commissie van de Europese Gemeenschappen van 12 januari 2001
      betreffende de toepassing van de artikelen 87 en 88 van het EG-Verdrag op de minimis-steun (PbEG L 10).
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel3
  - number: 3.c
    text: |-
      indien de aanvraag is gedaan ten behoeve van een ondernemer in het midden- en kleinbedrijf die actief is in de
      transportsector, in overeenstemming met: - de Communautaire richtsnoeren voor reddings- en herstructureringssteun
      aan ondernemingen in moeilijkheden (PB C 288, 9 oktober 1999).
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel3
  - number: '4.1'
    text: De subsidie bedraagt per ondernemer minimaal € 4.500,– en maximaal € 100.000,–.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel4
  - number: '4.2'
    text: |-
      De subsidie bedraagt niet meer dan de inkomensachteruitgang van de betrokken ondernemer als gevolg van de getroffen
      maatregelen ter bestrijding van de mond- en klauwzeerepidemie onderscheidenlijk de Aviaire Influenza-epidemie.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie wordt verleend onder voorbehoud van goedkeuring van deze regeling door de Commissie van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel5
  - number: '5.2'
    text: |-
      De beslissing tot verlening van een subsidie kan worden ingetrokken of gewijzigd indien dit noodzakelijk is ter
      verkrijging van de goedkeuring van de Commissie van de Europese Gemeenschappen of wegens het uitblijven ervan.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel5
  - number: '6'
    text: |-
      Aanvragen voor subsidie door ondernemers die zijn getroffen door de Aviaire Influenza Epidemie 2003 kunnen worden
      ingediend tot en met 31 augustus 2004.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel6
  - number: '7.1'
    text: |-
      De uitvoering van deze regeling, met inbegrip van het nemen van besluiten op grond ervan, wordt gedelegeerd aan
      de Stichting.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel7
  - number: '7.2'
    text: De Stichting kan beleidsregels vaststellen ter zake van de in het eerste lid bedoelde bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel7
  - number: '8.1'
    text: |-
      Besluiten van de Stichting, genomen voorafgaand aan de inwerkingtreding van deze regeling, gelden als besluiten op
      grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel8
  - number: '8.2'
    text: |-
      Beleidsregels die door de Stichting zijn vastgesteld voorafgaand aan de inwerkingtreding van deze regeling gelden
      als beleidsregels vastgesteld op grond van [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016485#Artikel7
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016485
        artikel: '7'
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling delegatie Stichting Fonds MKZ-AI'
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot 13 juli 2001.
    url: https://wetten.overheid.nl/BWBR0016485/2004-03-17#Artikel10
