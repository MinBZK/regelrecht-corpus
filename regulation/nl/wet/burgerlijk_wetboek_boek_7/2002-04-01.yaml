        artikel: '15'
  - number: '906.4'
    text: |-
      De leden 1 en 2 gelden niet voor zover de strekking van de betrokken bepaling in verband met de aard van de
      rechtsverhouding zich tegen de overeenkomstige toepassing verzet.
