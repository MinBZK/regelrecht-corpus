  - number: '7.1'
    text: |-
      Degene aan wie een zaak is toegezonden en die redelijkerwijze mag aannemen dat deze toezending is geschied ten
      einde hem tot een koop te bewegen, is ongeacht enige andersluidende mededeling van de verzender jegens deze bevoegd
      de zaak om niet te behouden, tenzij het hem is toe te rekenen dat de toezending is geschied.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel7
  - number: '7.2'
    text: |-
      De toezending aan een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf van een niet
      door deze bestelde zaak met het verzoek tot betaling van een prijs, is niet toegestaan. Wordt desalniettemin een
      zaak toegezonden als bedoeld in de eerste volzin, dan is het in lid 1 bepaalde omtrent de bevoegdheid, de zaak om
      niet te behouden, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de ontvanger in de gevallen, bedoeld in de leden 1–2, de zaak terugzendt, komen de kosten hiervan voor
      rekening van de verzender.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel7
  - number: '7.4'
    text: |-
      Lid 2 is van overeenkomstige toepassing op het verrichten ten behoeve van een natuurlijk persoon die niet handelt
      in de uitoefening van een beroep of bedrijf van een niet door deze opgedragen dienst die niet een financiële dienst
      is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel7
  - number: '9.1'
    text: |-
      De verkoper is verplicht de verkochte zaak met toebehoren in eigendom over te dragen en af te leveren. Onder
      toebehoren zijn de aanwezige titelbewijzen en bescheiden begrepen; voor zover de verkoper zelf daarbij belang
      behoudt, is hij slechts verplicht om aan de koper op diens verlangen en op diens kosten een afschrift of uittreksel
      af te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel9
  - number: '9.2'
    text: Onder aflevering wordt verstaan het stellen van de zaak in het bezit van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel9
  - number: '9.3'
    text: |-
      In geval van koop met eigendomsvoorbehoud wordt onder aflevering verstaan het stellen van de zaak in de macht van
      de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel9
  - number: '10.1'
    text: |-
      De zaak is voor risico van de koper van de aflevering af, zelfs al is de eigendom nog niet overgedragen. Derhalve
      blijft hij de koopprijs verschuldigd, ongeacht tenietgaan of achteruitgang van de zaak door een oorzaak die niet
      aan de verkoper kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel10
  - number: '10.2'
    text: |-
      Hetzelfde geldt van het ogenblik af, waarop de koper in verzuim is met het verrichten van een handeling waarmede
      hij aan de aflevering moet medewerken. Ingeval naar de soort bepaalde zaken zijn verkocht, doet het verzuim van
      de koper het risico eerst op hem overgaan, wanneer de verkoper de voor de uitvoering van de overeenkomst bestemde
      zaken heeft aangewezen en de koper daarvan heeft verwittigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de koper op goede gronden het recht op ontbinding van de koop of op vervanging van de zaak inroept, blijft
      deze voor risico van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel10
  - number: '10.4'
    text: |-
      Wanneer de zaak na de aflevering voor risico van de verkoper is gebleven, is het tenietgaan of de achteruitgang
      ervan door toedoen van de koper eveneens voor rekening van de verkoper. De koper moet echter van het ogenblik af
      dat hij redelijkerwijs rekening moet houden met het feit dat hij de zaak zal moeten teruggeven, als een zorgvuldig
      schuldenaar voor het behoud ervan zorgen; [artikel 78 van Boek 6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel78
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '78'
  - number: '11'
    text: |-
      Indien bij een consumentenkoop de zaak bij de koper wordt bezorgd door de verkoper of een door deze aangewezen
      vervoerder, is de zaak pas voor risico van de koper van de bezorging af, zelfs al was zij reeds eerder afgeleverd
      in de zin van [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel9
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '9'
        afdeling: '2'
  - number: '12.1'
    text: Kosten van aflevering, die van weging en telling daaronder begrepen, komen ten laste van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel12
  - number: '12.2'
    text: Kosten van afhalen en kosten van een koopakte en van de overdracht komen ten laste van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel12
  - number: '13'
    text: |-
      Indien bij een consumentenkoop de zaak bij de koper wordt bezorgd door de verkoper of een door deze aangewezen
      vervoerder, kunnen daarvoor slechts kosten worden gevorderd, voor zover zij bij het sluiten van de overeenkomst
      door de verkoper afzonderlijk zijn opgegeven of door de verkoper de gegevens zijn verschaft op grond waarvan zij
      door hem worden berekend. Hetzelfde geldt voor kosten, verschuldigd voor andere werkzaamheden die de verkoper in
      verband met de koop voor de koper verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel13
  - number: '14'
    text: |-
      Van de dag van aflevering af komen de vruchten toe aan de koper, met dien verstande dat burgerlijke vruchten van
      dag tot dag berekend worden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel14
  - number: '15.1'
    text: |-
      De verkoper is verplicht de verkochte zaak in eigendom over te dragen vrij van alle bijzondere lasten en
      beperkingen, met uitzondering van die welke de koper uitdrukkelijk heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel15
  - number: '15.2'
    text: |-
      Ongeacht enig andersluidend beding staat de verkoper in voor de afwezigheid van lasten en beperkingen die
      voortvloeien uit feiten die vatbaar zijn voor inschrijving in de openbare registers, doch daarin ten tijde van het
      sluiten van de overeenkomst niet waren ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel15
  - number: '16'
    text: |-
      Wanneer tegen de koper een vordering wordt ingesteld tot uitwinning of tot erkenning van een recht waarmede de
      zaak niet belast had mogen zijn, is de verkoper gehouden in het geding te komen ten einde de belangen van de koper
      te verdedigen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel16
  - number: '17.1'
    text: De afgeleverde zaak moet aan de overeenkomst beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel17
  - number: '17.2'
    text: |-
      Een zaak beantwoordt niet aan de overeenkomst indien zij niet de eigenschappen bezit die de koper op grond van
      de overeenkomst mocht verwachten. De koper mag verwachten dat de zaak de eigenschappen bezit die voor een normaal
      gebruik daarvan nodig zijn en waarvan hij de aanwezigheid niet behoefde te betwijfelen, alsmede de eigenschappen
      die nodig zijn voor een bijzonder gebruik dat bij de overeenkomst is voorzien.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel17
  - number: '17.3'
    text: |-
      Een andere zaak dan is overeengekomen, of een zaak van een andere soort, beantwoordt evenmin aan de overeenkomst.
      Hetzelfde geldt indien het afgeleverde in getal, maat of gewicht van het overeengekomene afwijkt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel17
  - number: '17.4'
    text: |-
      Is aan de koper een monster of model getoond of verstrekt, dan moet de zaak daarmede overeenstemmen, tenzij het
      slechts bij wijze van aanduiding werd verstrekt zonder dat de zaak daaraan behoefde te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel17
  - number: '17.5'
    text: |-
      Bij koop van een onroerende zaak wordt vermelding van de oppervlakte vermoed slechts als aanduiding bedoeld te
      zijn, zonder dat de zaak daaraan behoeft te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel17
  - number: '18'
    text: |-
      Bij de beoordeling van de vraag of een op grond van een consumentenkoop afgeleverde zaak aan de overeenkomst
      beantwoordt, gelden mededelingen die door of ten behoeve van een vorige verkoper van die zaak, handelend in de
      uitoefening van een beroep of bedrijf, omtrent de zaak zijn openbaar gemaakt, als mededelingen van de verkoper,
      behoudens voor zover deze een bepaalde mededeling kende noch behoorde te kennen of duidelijk heeft weersproken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel18
  - number: '19.1'
    text: |-
      In geval van een executoriale verkoop kan de koper zich er niet op beroepen dat de zaak behept is met een last of
      een beperking die er niet op had mogen rusten, of dat deze niet aan de overeenkomst beantwoordt, tenzij de verkoper
      dat wist.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel19
  - number: '19.2'
    text: |-
      Hetzelfde geldt indien de verkoop bij wijze van parate executie plaatsvindt, mits de koper dit wist of had moeten
      weten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel19
  - number: '20'
    text: |-
      Is de zaak behept met een last of een beperking die er niet op had mogen rusten, dan kan de koper eisen dat de last
      of de beperking wordt opgeheven, mits de verkoper hieraan redelijkerwijs kan voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel20
  - number: '21.1'
    text: 'Beantwoordt het afgeleverde niet aan de overeenkomst, dan kan de koper eisen:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: 21.1.a
    text: aflevering van het ontbrekende;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: 21.1.b
    text: herstel van de afgeleverde zaak, mits de verkoper hieraan redelijkerwijs kan voldoen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: 21.1.c
    text: |-
      vervanging van de afgeleverde zaak, tenzij de afwijking van het overeengekomene te gering is om dit te
      rechtvaardigen, dan wel de zaak na het tijdstip dat de koper redelijkerwijze met ongedaanmaking rekening moet
      houden, teniet of achteruit is gegaan doordat hij niet als een zorgvuldig schuldenaar voor het behoud ervan heeft
      gezorgd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: '21.2'
    text: |-
      Indien bij een consumentenkoop de koper van een voor vervanging vatbare zaak herstel of vervanging daarvan
      overeenkomstig lid 1 onder *b* of *c* vordert, is de verkoper bevoegd tussen vervanging of teruggave van de
      koopprijs te kiezen. De verkoper is gehouden deze keuze binnen korte tijd te doen en vervolgens zijn verplichting
      binnen redelijke tijd na te komen; bij gebreke hiervan kan de koper zijn rechten op herstel of vervanging doen
      gelden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: '21.3'
    text: |-
      Indien bij een consumentenkoop de verkoper niet binnen een redelijke tijd nadat hij daartoe door de koper
      schriftelijk is aangemaand, aan zijn verplichting tot herstel van de afgeleverde zaak heeft voldaan, is de koper
      bevoegd het herstel door een derde te doen plaatsvinden en de kosten daarvan op de verkoper te verhalen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel21
  - number: '22'
    text: |-
      De rechten genoemd in de [artikelen 20][ref1] en [21][ref2] komen de koper toe onverminderd alle andere rechten
      of vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel21
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '20'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '21'
        afdeling: '3'
  - number: '23.1'
    text: |-
      De koper kan er geen beroep meer op doen dat hetgeen is afgeleverd niet aan de overeenkomst beantwoordt, indien
      hij de verkoper daarvan niet binnen bekwame tijd nadat hij dit heeft ontdekt of redelijkerwijs had behoren te
      ontdekken, kennis heeft gegeven. Blijkt echter aan de zaak een eigenschap te ontbreken die deze volgens de verkoper
      bezat, of heeft de afwijking betrekking op feiten die hij kende of behoorde te kennen doch die hij niet heeft
      meegedeeld, dan moet de kennisgeving binnen bekwame tijd na de ontdekking geschieden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel23
  - number: '23.2'
    text: |-
      Rechtsvorderingen en verweren, gegrond op feiten die de stelling zouden rechtvaardigen dat de afgeleverde zaak niet
      aan de overeenkomst beantwoordt, verjaren door verloop van twee jaren na de overeenkomstig het eerste lid gedane
      kennisgeving. Doch de koper behoudt de bevoegdheid om aan een vordering tot betaling van de prijs zijn recht op
      vermindering daarvan door gedeeltelijke ontbinding van de koop of op schadevergoeding tegen te werpen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel23
  - number: '23.3'
    text: De termijn loopt niet zolang de koper zijn rechten niet kan uitoefenen als gevolg van opzet van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel23
  - number: '24.1'
    text: |-
      Indien op grond van een consumentenkoop een zaak is afgeleverd die niet de eigenschappen bezit die de koper
      op grond van de overeenkomst mocht verwachten, heeft de koper jegens de verkoper recht op schadevergoeding
      overeenkomstig de [afdelingen 9][ref1] en [10 van titel 1 van Boek 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005289
        afdeling: '10'
  - number: '24.2'
    text: |-
      Bestaat de tekortkoming in een gebrek als bedoeld in [afdeling 3 van titel 3 van Boek 6][ref1], dan is de verkoper
      niet aansprakelijk voor schade als in die afdeling bedoeld, tenzij


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: 24.2.a
    text: hij het gebrek kende of behoorde te kennen,
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
  - number: 24.2.b
    text: hij de afwezigheid van het gebrek heeft toegezegd of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
  - number: 24.2.c
    text: |-
      het betreft zaakschade terzake waarvan krachtens [afdeling 3 van titel 3 van Boek 6][ref1] geen recht op
      vergoeding bestaat op grond van de in die afdeling geregelde franchise, onverminderd zijn verweren krachtens de
      [afdelingen 9][ref2] en [10 van titel 1 van Boek 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005289
        afdeling: '10'
  - number: '24.3'
    text: |-
      Indien de verkoper de schade van de koper vergoedt krachtens lid 2 onder *a* of *b*, is de koper verplicht zijn
      rechten uit [afdeling 3 van titel 3 van Boek 6][ref1] aan de verkoper over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: '25.1'
    text: |-
      Heeft de koper, in geval van een tekortkoming als bedoeld in [artikel 24][ref1], een of meer van zijn rechten ter
      zake van die tekortkoming tegen de verkoper uitgeoefend, dan heeft de verkoper recht op schadevergoeding jegens
      degene van wie hij de zaak heeft gekocht, mits ook deze bij die overeenkomst in de uitoefening van zijn beroep of
      bedrijf heeft gehandeld. Kosten ter zake van verweer worden slechts vergoed voor zover zij in redelijkheid door de
      verkoper zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel24
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '24'
        afdeling: '3'
  - number: '25.2'
    text: |-
      Op een beding tot uitsluiting of beperking van de aansprakelijkheid, bedoeld in lid 1, kan slechts een beroep
      worden gedaan, voorzover dit, gelet op alle omstandigheden van het geval, jegens de verkoper redelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
  - number: '25.3'
    text: |-
      Het recht op schadevergoeding krachtens lid 1 komt de verkoper niet toe indien de afwijking betrekking heeft op
      feiten die hij kende of behoorde te kennen, dan wel haar oorzaak vindt in een omstandigheid die is voorgevallen
      nadat de zaak aan hem werd afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
  - number: '25.4'
    text: |-
      Indien aan de zaak een eigenschap ontbreekt die deze volgens de verkoper bezat, is het recht van de verkoper
      op schadevergoeding krachtens lid 1 beperkt tot het bedrag waarop hij aanspraak had kunnen maken indien hij de
      toezegging niet had gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
  - number: '25.5'
    text: Op het verhaal krachtens eerdere koopovereenkomsten zijn de vorige leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
  - number: '25.6'
    text: |-
      De vorige leden zijn niet van toepassing voor zover het betreft schade als bedoeld in [artikel 24 lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel24
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '24'
        afdeling: '3'
  - number: '26.1'
    text: De koper is verplicht de prijs te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel26
  - number: '26.2'
    text: |-
      De betaling moet geschieden ten tijde en ter plaatse van de aflevering. Bij een consumentenkoop kan de koper tot
      vooruitbetaling van ten hoogste de helft van de koopprijs worden verplicht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel26
  - number: '26.3'
    text: |-
      Is voor de eigendomsoverdracht een notariële akte vereist, gevolgd door inschrijving daarvan in de daartoe bestemde
      openbare registers, dan moet het verschuldigde ten tijde van de ondertekening van de akte tenminste uit de macht
      van de koper zijn gebracht en behoeft het pas na de inschrijving in de macht van de verkoper te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel26
  - number: '27'
    text: |-
      Wanneer de koper gestoord wordt of goede grond heeft te vrezen dat hij gestoord zal worden door een vordering tot
      uitwinning of tot erkenning van een recht op de zaak dat daarop niet had mogen rusten, kan hij de betaling van
      de koopprijs opschorten, tenzij de verkoper voldoende zekerheid stelt om het nadeel te dekken dat de koper dreigt
      te lijden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel27
  - number: '28'
    text: Bij een consumentenkoop verjaart de rechtsvordering tot betaling van de koopprijs door verloop van twee jaren.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel28
  - number: '29.1'
    text: |-
      Heeft de koper de zaak ontvangen doch is hij voornemens deze te weigeren, dan moet hij als een zorgvuldig
      schuldenaar voor het behoud ervan zorgen; hij heeft op de zaak een retentierecht totdat hij door de verkoper voor
      de door hem in redelijkheid gemaakte kosten schadeloos is gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel29
  - number: '29.2'
    text: |-
      De koper die voornemens is een aan hem verzonden en op de plaats van bestemming te zijner beschikking gestelde zaak
      te weigeren, moet, zo dit geen betaling van de koopprijs en geen ernstige bezwaren of onredelijke kosten meebrengt,
      deze in ontvangst nemen, tenzij de verkoper op de plaats van bestemming aanwezig is of iemand aldaar bevoegd is
      zich voor zijn rekening met de zorg voor de zaak te belasten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel29
  - number: '30'
    text: |-
      Wanneer in de gevallen, in [artikel 29][ref1] voorzien, de zaak aan snel tenietgaan of achteruitgang onderhevig
      is of wanneer de bewaring daarvan ernstige bezwaren of onredelijke kosten zou meebrengen, is de koper verplicht de
      zaak op een geschikte wijze te doen verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel29
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '29'
        afdeling: '4'
  - number: '31'
    text: |-
      Indien de overeenkomst aan de koper de bevoegdheid geeft door aanwijzing van maat of vorm of op andere wijze de
      zaak te specificeren en hij daarmede in verzuim is, kan de verkoper daartoe zelf overgaan, met inachtneming van de
      hem bekende behoeften van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel31
  - number: '32'
    text: |-
      Ingeval de koper met de inontvangstneming in verzuim is, vindt [artikel 30][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel30
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '30'
        afdeling: '4'
  - number: '33'
    text: |-
      Indien de aflevering van een roerende zaak op een bepaalde dag essentieel is en op die dag de koper niet in
      ontvangst neemt, levert zulks een grond op tot ontbinding als bedoeld in [artikel 265 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel265
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '265'
  - number: '34'
    text: |-
      De verkoper kan de koop door een schriftelijke verklaring ontbinden, indien het achterwege blijven van
      inontvangstneming hem goede grond geeft te vrezen dat de prijs niet zal worden betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel34
  - number: '35.1'
    text: |-
      Indien de verkoper bij een consumentenkoop krachtens een bij die overeenkomst gemaakt beding de koopprijs na het
      sluiten van de koop verhoogt, is de koper bevoegd de koop door een schriftelijke verklaring te ontbinden, tenzij
      bedongen is dat de aflevering langer dan drie maanden na de koop zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel35
  - number: '35.2'
    text: |-
      Voor de toepassing van lid 1 wordt onder koopprijs begrepen het bedrag dat bij het sluiten van de overeenkomst
      onder voorbehoud van prijswijziging voorlopig als koopprijs is opgegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel35
  - number: '36.1'
    text: |-
      In geval van ontbinding van de koop is, wanneer de zaak een dagprijs heeft, de schadevergoeding gelijk aan het
      verschil tussen de in de overeenkomst bepaalde prijs en de dagprijs ten dage van de niet-nakoming.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel36
  - number: '36.2'
    text: |-
      Voor de berekening van deze schadevergoeding is de in aanmerking te nemen dagprijs die van de markt waar de koop
      plaatsvond, of, indien er geen dergelijke dagprijs is of deze bezwaarlijk zou kunnen worden toegepast, de prijs van
      de markt die deze redelijkerwijs kan vervangen; hierbij wordt rekening gehouden met verschillen in de kosten van
      vervoer van de zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel36
  - number: '37'
    text: |-
      Heeft de koper of de verkoper een dekkingskoop gesloten en is hij daarbij redelijk te werk gegaan, dan komt hem het
      verschil toe tussen de overeengekomen prijs en die van de dekkingskoop.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel37
  - number: '38'
    text: |-
      De bepalingen van de twee voorgaande artikelen sluiten het recht op een hogere schadevergoeding niet uit ingeval
      meer schade is geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel38
  - number: '39.1'
    text: |-
      De verkoper van een roerende, aan de koper afgeleverde zaak die niet een registergoed is, kan, indien de prijs niet
      betaald is en in verband daarmee aan de vereisten voor een ontbinding als bedoeld in [artikel 265 van Boek 6][ref1]
      is voldaan, de zaak door een tot de koper gerichte schriftelijke verklaring terugvorderen. Door deze verklaring
      wordt de koop ontbonden en eindigt het recht van de koper of zijn rechtsverkrijger; de [artikelen 271][ref2],
      [273][ref3], [275][ref4] en [276 van Boek 6][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel265
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel271
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel273
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel275
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel276
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '265'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '271'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '273'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '275'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '276'
  - number: '39.2'
    text: |-
      Is slechts de prijs van een bepaald deel van het afgeleverde niet betaald, dan kan de verkoper slechts dat deel
      terugvorderen. Is ten aanzien van het geheel een deel van de prijs niet betaald, dan kan de verkoper een daaraan
      evenredig deel van het afgeleverde terugvorderen indien het afgeleverde voor een zodanige verdeling vatbaar is. In
      beide gevallen wordt de koop slechts voor het teruggevorderde deel van het afgeleverde ontbonden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel39
  - number: '39.3'
    text: |-
      In alle andere gevallen van gedeeltelijke betaling van de prijs kan de verkoper slechts het afgeleverde in zijn
      geheel terugvorderen tegen teruggave van het reeds betaalde.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel39
  - number: '40.1'
    text: |-
      Is de koper in staat van faillissement verklaard of is aan hem surséance van betaling verleend, dan heeft de
      terugvordering geen gevolg, indien door de curator, onderscheidenlijk door de koper en de bewindvoerder, binnen een
      hun daartoe door de verkoper bij diens verklaring te stellen redelijke termijn de koopprijs wordt betaald of voor
      deze betaling zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien ten aanzien van de koper de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, tenzij de koopovereenkomst tot stand is gekomen na de uitspraak
      tot de toepassing van de schuldsaneringsregeling.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel40
  - number: '41'
    text: |-
      De bevoegdheid tot terugvordering kan slechts worden uitgeoefend voor zover het afgeleverde zich nog in dezelfde
      staat bevindt als waarin het werd afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel41
  - number: '42.1'
    text: |-
      Tenzij de zaak in handen van de koper is gebleven, vervalt de bevoegdheid tot terugvordering wanneer de zaak
      overeenkomstig [artikel 90 lid 1][ref1] of [artikel 91 van Boek 3][ref2] anders dan om niet is overgedragen aan een
      derde die redelijkerwijs niet behoefde te verwachten dat het recht zou worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel91
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '91'
  - number: '42.2'
    text: |-
      Is de zaak na de aflevering anders dan om niet in vruchtgebruik gegeven of verpand, dan is lid 1 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel42
  - number: '43'
    text: |-
      De verkoper kan zijn in [artikel 39][ref1] omschreven bevoegdheid niet uitoefenen, indien de koper voor de volle
      koopprijs handelspapier heeft geaccepteerd. Bij acceptatie voor een gedeelte van de prijs kan de verkoper die
      bevoegdheid slechts uitoefenen, indien hij ten behoeve van de koper zekerheid stelt voor de vergoeding van hetgeen
      de koper uit hoofde van zijn acceptatie zou moeten betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel39
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '39'
        afdeling: '8'
  - number: '44'
    text: |-
      De in [artikel 39][ref1] omschreven bevoegdheid van de verkoper vervalt, wanneer zowel zes weken zijn verstreken
      nadat de vordering tot betaling van de koopprijs opeisbaar is geworden, als zestig dagen, te rekenen van de dag
      waarop de zaak onder de koper of onder iemand van zijnentwege is opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel39
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '39'
        afdeling: '8'
  - number: '45.1'
    text: Koop op proef wordt geacht te zijn gesloten onder de opschortende voorwaarde dat de zaak de koper voldoet.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel45
  - number: '45.2'
    text: |-
      Laat deze een termijn, voldoende om de zaak te beoordelen, voorbijgaan zonder de verkoper van zijn beslissing in
      kennis te stellen, dan kan hij de zaak niet meer weigeren.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel45
  - number: '46'
    text: Zolang de koop niet definitief is, is de zaak voor risico van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46
  - number: 46a
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.a
    text: |-
      overeenkomst op afstand: de overeenkomst waarbij, in het kader van een door de verkoper of dienstverlener
      georganiseerd systeem voor verkoop of dienstverlening op afstand, tot en met het sluiten van de overeenkomst
      uitsluitend gebruik wordt gemaakt van één of meer technieken voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.b
    text: 'koop op afstand: de overeenkomst op afstand die een consumentenkoop is;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.c
    text: |-
      overeenkomst op afstand tot het verrichten van diensten: de tot het verrichten van diensten strekkende overeenkomst
      op afstand tussen een dienstverlener die handelt in de uitoefening van een beroep of bedrijf en een wederpartij,
      natuurlijk persoon, die niet handelt in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.d
    text: |-
      techniek voor communicatie op afstand: een middel dat zonder gelijktijdige persoonlijke aanwezigheid van partijen
      kan worden gebruikt voor het sluiten van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.e
    text: |-
      communicatietechniekexploitant: een natuurlijke persoon of rechtspersoon die zijn bedrijf maakt van het ter
      beschikking stellen van één of meer technieken voor communicatie op afstand aan verkopers of dienstverleners;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46a.f
    text: |-
      richtlijn: [richtlijn nr. 97/7/EG](31997L0007) van het Europees Parlement en de Raad van de Europese Unie van 20
      mei 1997 betreffende de bescherming van de consument bij op afstand gesloten overeenkomsten (PbEG L 144).
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46a
  - number: 46b.1
    text: |-
      [Artikel 5 lid 3][ref1] is niet van toepassing op koop op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '5'
        afdeling: '1'
  - number: 46b.2
    text: 'Deze afdeling is niet van toepassing op de koop op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46b
  - number: 46b.2.a
    text: die wordt gesloten met gebruikmaking van distributieautomaten of geautomatiseerde handelsruimten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46b
  - number: 46b.2.b
    text: op een veiling.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46b
  - number: 46b.3
    text: |-
      De [artikelen 46c-46e][ref1] en [46f lid 1][ref2] zijn niet van toepassing op de koop op afstand van hoofdzakelijk
      levensmiddelen die worden afgeleverd aan de koper op diens woon- of verblijfplaats of werkplek door frequent en op
      gezette tijden langskomende bezorgers.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46c.1
    text: |-
      Tijdig voordat de koop op afstand wordt gesloten, moeten aan de wederpartij met alle aan de gebruikte techniek voor
      communicatie op afstand aangepaste middelen en op duidelijke en begrijpelijke wijze, de volgende gegevens worden
      verstrekt, waarvan het commerciële oogmerk ondubbelzinnig moet blijken:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.a
    text: |-
      de identiteit en, indien de koop op afstand verplicht tot vooruitbetaling van de prijs of een gedeelte daarvan, het
      adres van de verkoper;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.b
    text: de belangrijkste kenmerken van de zaak;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.c
    text: de prijs, met inbegrip van alle belastingen, van de zaak;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.d
    text: 'voor zover van toepassing: de kosten van aflevering;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.e
    text: de wijze van betaling, aflevering of uitvoering van de koop op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.f
    text: |-
      het al dan niet van toepassing zijn van de mogelijkheid van ontbinding overeenkomstig de
      [artikelen 46d lid 1][ref1] en [46e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
  - number: 46c.1.g
    text: |-
      indien de kosten van het gebruik van de techniek voor communicatie op afstand worden berekend op een andere
      grondslag dan het basistarief: de hoogte van het geldende tarief;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.h
    text: de termijn voor de aanvaarding van het aanbod, dan wel de termijn voor het gestand doen van de prijs;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.1.i
    text: |-
      voor zover van toepassing, in geval van een koop op afstand die strekt tot voortdurende of periodieke aflevering
      van zaken: de minimale duur van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.2
    text: |-
      Tijdig bij de nakoming van de koop op afstand en, voor zover het niet aan derden af te leveren zaken betreft,
      uiterlijk bij de aflevering, moeten aan de koper op duidelijke en begrijpelijke wijze schriftelijk of, voor zover
      het de in de onderdelen a en c-e bedoelde gegevens betreft, op een andere te zijner beschikking staande en voor hem
      toegankelijke duurzame gegevensdrager, de volgende gegevens worden verstrekt, behoudens voor zover zulks reeds is
      geschied voordat de koop op afstand werd gesloten:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.2.a
    text: de gegevens, bedoeld in de onderdelen a-f van lid 1;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.2.b
    text: |-
      de vereisten voor de gebruikmaking van het recht tot ontbinding overeenkomstig de [artikelen 46d lid 1][ref1] en
      [46e lid 2][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
  - number: 46c.2.c
    text: het bezoekadres van de vestiging van de verkoper waar de koper een klacht kan indienen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.2.d
    text: |-
      voor zover van toepassing: gegevens omtrent de garantie en omtrent in het kader van de koop op afstand aangeboden
      diensten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46c.2.e
    text: |-
      indien de koop op afstand een duur heeft van meer dan een jaar dan wel een onbepaalde duur: de vereisten voor
      opzegging van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46c
  - number: 46d.1
    text: |-
      Gedurende zeven werkdagen na de ontvangst van de zaak heeft de koper het recht de koop op afstand zonder opgave van
      redenen te ontbinden. Indien niet is voldaan aan alle in [artikel 46c lid 2][ref1] gestelde eisen, bedraagt deze
      termijn drie maanden. De eerste zin is van overeenkomstige toepassing vanaf de voldoening binnen de in de tweede
      zin bedoelde termijn aan alle in [artikel 46c lid 2][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
  - number: 46d.2
    text: |-
      In geval van ontbinding overeenkomstig lid 1 kan de verkoper, behoudens ten hoogste de rechtstreekse kosten van het
      terugzenden van de zaak, aan de koper geen vergoeding in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.3
    text: |-
      In geval van ontbinding overeenkomstig lid 1 heeft de koper recht op kosteloze teruggave van het door hem aan de
      verkoper betaalde. De teruggave moet zo spoedig mogelijk en in ieder geval binnen dertig dagen na de ontbinding
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4
    text: 'De leden 1–3 zijn niet van toepassing op de koop op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.a
    text: |-
      van zaken waarvan de prijs gebonden is aan de schommelingen op de financiële markt, waarop de verkoper geen invloed
      heeft;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.b
    text: 'van zaken die:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.b.1°
    text: zijn tot stand gebracht overeenkomstig specificaties van de koper;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.b.2°
    text: duidelijk persoonlijk van aard zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.b.3°
    text: door hun aard niet kunnen worden teruggezonden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.b.4°
    text: snel kunnen bederven of verouderen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.c
    text: van audio- en video-opnamen en computerprogrammatuur, indien de koper hun verzegeling heeft verbroken;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46d.4.d
    text: van kranten en tijdschriften.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46d
  - number: 46e.1
    text: |-
      Ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] brengt van rechtswege en zonder dat
      de koper een boete is verschuldigd de ontbinding mee van een overeenkomst die ertoe strekt dat de verkoper aan de
      koper ten behoeve van de voldoening van de prijs een geldsom leent.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46e.2
    text: |-
      In geval van ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] heeft de koper tevens het
      recht een ingevolge een overeenkomst tussen de verkoper en een derde aangegane overeenkomst die ertoe strekt dat de
      derde aan de koper ten behoeve van de voldoening van de prijs een geldsom leent, zonder boete te ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46f.1
    text: |-
      Het verzuim van de verkoper treedt zonder ingebrekestelling in, wanneer de koop op afstand niet uiterlijk binnen
      dertig dagen, te rekenen van de dag waarop de koper zijn bestelling bij de verkoper heeft gedaan, is nagekomen,
      behalve voor zover de vertraging de verkoper niet kan worden toegerekend of nakoming reeds blijvend onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46f
  - number: 46f.2
    text: |-
      Indien nakoming onmogelijk is doordat de gekochte zaak niet beschikbaar is, moet de koper daarvan zo spoedig
      mogelijk worden kennis gegeven en heeft hij recht op kosteloze teruggave van het door hem aan de verkoper betaalde.
      De teruggave moet zo spoedig mogelijk en in ieder geval binnen dertig dagen na de kennisgeving plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46f
  - number: 46f.3
    text: |-
      Indien in het in lid 2 bedoelde geval de verkoper krachtens een voor dan wel bij het sluiten van de koop op afstand
      gemaakt beding de bevoegdheid heeft, een zaak van gelijke kwaliteit en prijs te geven, komen de kosten van het
      terugzenden van de zaak in geval van ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] ten
      laste van de verkoper. De koper moet daarvan op duidelijke en begrijpelijke wijze worden kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46g
    text: |-
      De natuurlijke persoon die niet handelt in de uitoefening van een beroep of bedrijf, van wie een betaalkaart
      frauduleus is gebruikt in het kader van koop op afstand, kan niet worden verplicht tot betaling van de hem als
      gevolg van dat frauduleuze gebruik in rekening gebrachte bedragen, behoudens voor zover dat gebruik een gevolg
      is van een omstandigheid die aan hem kan worden toegerekend. Het terzake reeds betaalde geldt als onverschuldigd
      betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46g
  - number: 46h.1
    text: |-
      Aan een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf moeten bij het gebruik van
      de telefoon voor het doen van ongevraagde oproepen ter bevordering van de totstandkoming van een koop op afstand,
      aan het begin van elk gesprek duidelijk de identiteit van de verkoper, alsmede het commerciële oogmerk van de
      oproep worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46h
  - number: 46h.2
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst en faxen voor het doen van ongevraagde
      oproepen, ter bevordering van de totstandkoming van een koop op afstand, aan een natuurlijk persoon die niet
      handelt in de uitoefening van een beroep of bedrijf, is uitsluitend toegestaan, indien de desbetreffende persoon
      daarvoor voorafgaand toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46h
  - number: 46h.3
    text: |-
      Het gebruik van andere dan de in lid 2 genoemde technieken voor communicatie op afstand voor het doen van
      ongevraagde oproepen of mededelingen, ter bevordering van de totstandkoming van een koop op afstand, aan een
      natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf, is toegestaan, tenzij de
      desbetreffende persoon te kennen heeft gegeven dat hij oproepen of mededelingen waarbij van deze technieken gebruik
      wordt gemaakt, niet wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46h
  - number: 46h.4
    text: |-
      Degene die ongevraagd oproepen of mededelingen ter bevordering van de totstandkoming van een koop op afstand doet,
      neemt passende maatregelen om ten minste eenmaal per jaar de personen, bedoeld in lid 3, bekend te maken met de
      mogelijkheden tot het doen van een kennisgeving als bedoeld in lid 3. De bekendmaking kan via een of meer dag-,
      nieuws- of huis-aan-huisbladen of op een andere geschikte wijze plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46h
  - number: 46i.1
    text: |-
      De [artikelen 46b lid 2][ref1], [46c][ref2], [46d leden 1–3 en 4, onderdeel a][ref3], [46e][ref4],
      [46f leden 1 en 2][ref5] en [46g-46h][ref6] zijn van overeenkomstige toepassing op de overeenkomst op afstand tot
      het verrichten van diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel46g
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46b
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
      - id: ref5
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
      - id: ref6
        bwb_id: BWBR0005290
        artikel: 46g
        afdeling: 9A
  - number: 46i.2
    text: 'In afwijking van lid 1 zijn de in dat lid genoemde artikelen niet van toepassing op de overeenkomst op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
  - number: 46i.2.a
    text: tot het verrichten van financiële diensten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
  - number: 46i.2.b
    text: |-
      tot het verrichten van diensten, die wordt gesloten met een telecommunicatie-exploitant door gebruikmaking van een
      openbare telefoon;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
  - number: 46i.2.c
    text: tot aanneming van werk die strekt tot de bouw van een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
  - number: 46i.3
    text: |-
      In afwijking van lid 1 zijn de [artikelen 46c-46e][ref1] en [46f lid 1][ref2] niet van toepassing op de
      overeenkomst op afstand tot het verrichten van diensten die logies, vervoer, het restaurantbedrijf of
      vrijetijdsbesteding betreft, indien de dienstverlener zich er bij het sluiten van de overeenkomst toe verplicht,
      deze diensten te verrichten op een bepaalde datum of tijdens een bepaalde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46i.4
    text: |-
      In afwijking van lid 1 is [artikel 46c lid 2][ref1] niet van toepassing op de overeenkomst op afstand tot het
      verrichten van diensten die in één keer worden verricht met behulp van een techniek voor communicatie op afstand
      en die in rekening worden gebracht door de communicatietechniekexploitant. Desalniettemin moet aan de wederpartij
      steeds het bezoekadres van de vestiging van de dienstverlener waar de wederpartij een klacht kan indienen, worden
      medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
  - number: 46i.5
    text: |-
      In afwijking van lid 1 is [artikel 46d][ref1] niet van toepassing op de overeenkomst op afstand tot het verrichten
      van diensten:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46i.5.a
    text: |-
      waarvan de nakoming met instemming van de wederpartij is begonnen voordat de in
      [artikel 46d lid 1, eerste en derde volzin][ref1], bedoelde termijn is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46i.5.b
    text: betreffende weddenschappen en loterijen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
  - number: 46i.6
    text: |-
      In geval van een overeenkomst op afstand tot het verrichten van diensten lopen de in
      [artikel 46d lid 1, eerste en tweede volzin][ref1], bedoelde termijnen vanaf het sluiten van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46j.1
    text: Van deze afdeling kan niet ten nadele van de koper dan wel de wederpartij worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46j
  - number: 46j.2
    text: |-
      Lid 1 is niet van toepassing op [artikel 46f lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46j.3
    text: |-
      De toepasselijkheid op de overeenkomst van een recht dat de door de richtlijn voorziene bescherming niet of
      slechts ten dele biedt, kan er niet toe leiden dat de koper dan wel de wederpartij de bescherming verliest die hem
      krachtens de richtlijn wordt geboden door de dwingende bepalingen van het recht van de lid-staat van de Europese
      Unie of de andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, waar hij zijn
      gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel46j
  - number: '47'
    text: |-
      Een koop kan ook op een vermogensrecht betrekking hebben. In dat geval zijn de bepalingen van de vorige afdelingen
      van toepassing voor zover dit in overeenstemming is met de aard van het recht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel47
  - number: '48.1'
    text: |-
      Hij die een nalatenschap verkoopt zonder de goederen daarvan stuk voor stuk op te geven, is slechts gehouden voor
      zijn hoedanigheid van erfgenaam in te staan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48
  - number: '48.2'
    text: |-
      Heeft de verkoper reeds vruchten genoten, een tot de nalatenschap behorende vordering geïnd of goederen uit de
      nalatenschap vervreemd, dan moet hij die aan de koper vergoeden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48
  - number: '48.3'
    text: |-
      De koper moet aan de verkoper vergoeden hetgeen deze wegens de schulden en lasten der nalatenschap heeft betaald en
      hem voldoen hetgeen hij als schuldeiser van de nalatenschap te vorderen had.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48
  - number: 48a
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48a
  - number: 48a.a
    text: |-
      koop: iedere overeenkomst en ieder samenstel van overeenkomsten met een duur van ten minste drie jaren en met de
      strekking dat de ene partij – de verkoper – tegen betaling van een totaalprijs aan de andere partij – de koper –
      een zakelijk of persoonlijk recht geeft of zich verbindt te geven tot het gebruik voor ten minste een week per jaar
      van een of meer tot bewoning bestemde onroerende zaken of bestanddelen daarvan;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48a
  - number: 48a.b
    text: 'verkoper: een verkoper als bedoeld onder *a*, die bij de koop handelt in de uitoefening van een beroep of bedrijf;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48a
  - number: 48a.c
    text: |-
      koper: een koper als bedoeld onder *a*, die een natuurlijk persoon is en bij de koop niet handelt in de uitoefening
      van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48a
  - number: 48a.d
    text: |-
      richtlijn: [richtlijn nr. 94/47/EG](31994L0047) van het Europees Parlement en van de Raad van de Europese Unie van
      26 oktober 1994 betreffende de bescherming van de verkrijger voor wat bepaalde aspecten betreft van overeenkomsten
      inzake de verkrijging van een recht van deeltijds gebruik van onroerende goederen (*PbEG* L 280).
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48a
  - number: 48b.1
    text: |-
      De koop wordt schriftelijk aangegaan. De koopakte moet ten minste de bij algemene maatregel van bestuur bepaalde
      gegevens bevatten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48b
  - number: 48b.2
    text: |-
      De in lid 1 bedoelde, tussen partijen opgemaakte, akte of een afschrift daarvan moet aan de koper worden ter hand
      gesteld, desverlangd tegen afgifte aan de verkoper van een gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48b
  - number: 48b.3
    text: De in lid 1 bedoelde akte moet zijn gesteld in de bij algemene maatregel van bestuur bepaalde taal of talen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48b
  - number: 48c.1
    text: |-
      Gedurende tien dagen na de terhandstelling van de akte of een afschrift daarvan overeenkomstig [artikel 48][ref1]
      heeft de koper het recht de koop zonder opgave van redenen te ontbinden. Indien de akte niet alle bij algemene
      maatregel van bestuur bepaalde gegevens vermeldt, wordt deze termijn verlengd met de tijd die is verstreken vanaf
      de terhandstelling van de akte of een afschrift daarvan totdat alle ontbrekende gegevens alsnog schriftelijk aan de
      koper zijn verstrekt, doch ten hoogste met drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48c.2
    text: |-
      De koper oefent zijn in lid 1 bedoelde recht de overeenkomst te ontbinden uit door binnen de gestelde termijn
      een daartoe strekkende verklaring te richten tot de verkoper of tot degene die daartoe overeenkomstig het in de
      algemene maatregel van bestuur bepaalde in de akte is vermeld. De verklaring wordt gedaan op een wijze die voor
      bewijs vatbaar is naar het volgens Nederlands internationaal privaatrecht toepasselijke recht. De gestelde termijn
      is in acht genomen, indien een schriftelijke verklaring binnen die termijn is verzonden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48c
  - number: 48c.3
    text: |-
      In geval van ontbinding overeenkomstig de leden 1–2 is de koper aan de verkoper geen enkele vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48c
  - number: 48d
    text: |-
      De koper kan binnen de in [artikel 48][ref1] bedoelde termijn niet worden verplicht tot vooruitbetaling van de
      prijs of een gedeelte daarvan. Binnen deze termijn gedane vooruitbetalingen gelden als onverschuldigd betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.1
    text: |-
      Ontbinding van de koop overeenkomstig [artikel 48][ref1] brengt van rechtswege en zonder dat de koper een boete is
      verschuldigd de ontbinding mee van een overeenkomst die ertoe strekt dat de verkoper aan de koper ten behoeve van
      de voldoening van de prijs een geldsom leent.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.2
    text: |-
      In geval van ontbinding van de koop overeenkomstig [artikel 48][ref1] heeft de koper tevens het recht een ingevolge
      een overeenkomst tussen de verkoper en een derde aangegane overeenkomst die ertoe strekt dat de derde aan de
      koper ten behoeve van de voldoening van de prijs een geldsom leent, zonder boete te ontbinden. Op de ontbinding
      overeenkomstig de voorgaande zin is [artikel 48][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.3
    text: |-
      Op de ontbinding overeenkomstig de leden 1–2 is [artikel 48][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48f.1
    text: |-
      De verkoper moet aan een ieder die verzoekt om inlichtingen over de onroerende zaak of zaken waarop het in
      [artikel 48][ref1] bedoelde, door hem te koop aangeboden recht betrekking heeft, de volgende bescheiden ter hand
      stellen:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: 48f.1.a
    text: |-
      een ontwerp van de in [artikel 48][ref1] bedoelde akte;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48f.1.b
    text: een schriftelijke mededeling betreffende de wijze waarop nadere inlichtingen kunnen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
  - number: 48f.2
    text: |-
      In reclame voor de onroerende zaak of zaken waarop het in [artikel 48][ref1] bedoelde, door de verkoper te
      koop aangeboden recht betrekking heeft, moet worden medegedeeld dat de in het vorige lid bedoelde bescheiden
      verkrijgbaar zijn, alsmede waar zij verkrijgbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: 48f.3
    text: |-
      Tot het aanbrengen van wijzigingen in het overeenkomstig lid 1 onder a ter hand gestelde ontwerp is de verkoper
      slechts bevoegd met wederzijds goedvinden, dan wel indien deze wijzigingen voortvloeien uit omstandigheden buiten
      zijn wil.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
  - number: 48f.4
    text: |-
      De verkoper moet wijzigingen als bedoeld in lid 3 mededelen voordat de koop wordt gesloten. Bovendien moeten zij
      uitdrukkelijk in de in [artikel 48][ref1] bedoelde akte worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48f.5
    text: De in lid 1 onder *b* bedoelde mededeling moet zijn gesteld in de bij algemene maatregel van bestuur bepaalde taal.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48f
  - number: 48g.1
    text: Van het bij of krachtens deze afdeling bepaalde kan niet ten nadele van de koper worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48g
  - number: 48g.2
    text: |-
      Aan de koper kan, indien de in de koop bedoelde onroerende zaak is gelegen op het grondgebied van een lid-staat
      van de Europese Unie of van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, de hem krachtens de richtlijn door het recht van die staat toegekende bescherming niet worden onthouden,
      ongeacht het recht dat de koop beheerst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel48g
  - number: '49'
    text: |-
      Ruil is de overeenkomst waarbij partijen zich verbinden elkaar over en weer een zaak in de plaats van een andere
      te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel49
  - number: '50'
    text: |-
      De bepalingen betreffende koop vinden overeenkomstige toepassing, met dien verstande dat elke partij wordt
      beschouwd als verkoper voor de prestatie die zij verschuldigd is, en als koper voor die welke haar toekomt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel50
  - number: '400.1'
    text: |-
      De overeenkomst van opdracht is de overeenkomst waarbij de ene partij, de opdrachtnemer, zich jegens de andere
      partij, de opdrachtgever, verbindt anders dan op grond van een arbeidsovereenkomst werkzaamheden te verrichten
      die in iets anders bestaan dan het tot stand brengen van een werk van stoffelijke aard, het bewaren van zaken, het
      uitgeven van werken of het vervoeren of doen vervoeren van personen of zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel400
  - number: '400.2'
    text: |-
      De [artikelen 401-412][ref1] zijn, onverminderd [artikel 413][ref2], van toepassing, tenzij iets anders voortvloeit
      uit de wet, de inhoud of aard van de overeenkomst van opdracht of van een andere rechtshandeling, of de gewoonte.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel401
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel413
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '401'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '413'
        afdeling: '1'
  - number: '401'
    text: De opdrachtnemer moet bij zijn werkzaamheden de zorg van een goed opdrachtnemer in acht nemen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel401
  - number: '402.1'
    text: |-
      De opdrachtnemer is gehouden gevolg te geven aan tijdig verleende en verantwoorde aanwijzingen omtrent de
      uitvoering van de opdracht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel402
  - number: '402.2'
    text: |-
      De opdrachtnemer die op redelijke grond niet bereid is de opdracht volgens de hem gegeven aanwijzingen uit
      te voeren, kan, zo de opdrachtgever hem niettemin aan die aanwijzingen houdt, de overeenkomst opzeggen wegens
      gewichtige redenen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel402
  - number: '403.1'
    text: |-
      De opdrachtnemer moet de opdrachtgever op de hoogte houden van zijn werkzaamheden ter uitvoering van de opdracht en
      hem onverwijld in kennis stellen van de voltooiing van de opdracht, indien de opdrachtgever daarvan onkundig is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel403
  - number: '403.2'
    text: |-
      De opdrachtnemer doet aan de opdrachtgever verantwoording van de wijze waarop hij zich van de opdracht heeft
      gekweten. Heeft hij bij de uitvoering van de opdracht ten laste van de opdrachtgever gelden uitgegeven of te diens
      behoeve gelden ontvangen, dan doet hij daarvan rekening.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel403
  - number: '404'
    text: |-
      Indien de opdracht is verleend met het oog op een persoon die met de opdrachtnemer of in zijn dienst een beroep
      of een bedrijf uitoefent, is die persoon gehouden de werkzaamheden, nodig voor de uitvoering van de opdracht, zelf
      te verrichten, behoudens voor zover uit de opdracht voortvloeit dat hij deze onder zijn verantwoordelijkheid door
      anderen mag laten uitvoeren; alles onverminderd de aansprakelijkheid van de opdrachtnemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel404
  - number: '405.1'
    text: |-
      Indien de overeenkomst door de opdrachtnemer in de uitoefening van zijn beroep of bedrijf is aangegaan, is de
      opdrachtgever hem loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel405
  - number: '405.2'
    text: |-
      Indien loon is verschuldigd doch de hoogte niet door partijen is bepaald, is de opdrachtgever het op de
      gebruikelijke wijze berekende loon of, bij gebreke daarvan, een redelijk loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel405
  - number: '406.1'
    text: |-
      De opdrachtgever moet aan de opdrachtnemer de onkosten verbonden aan de uitvoering van de opdracht vergoeden, voor
      zover deze niet in het loon zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel406
  - number: '406.2'
    text: |-
      De opdrachtgever moet de opdrachtnemer de schade vergoeden die deze lijdt ten gevolge van de hem niet toe
      te rekenen verwezenlijking van een aan de opdracht verbonden bijzonder gevaar. Heeft de opdrachtnemer in de
      uitoefening van zijn beroep of bedrijf gehandeld, dan geldt de vorige zin slechts, indien dat gevaar de risico’s
      welke de uitoefening van dat beroep of bedrijf naar zijn aard meebrengt, te buiten gaat. Geschiedt de uitvoering
      van de opdracht anderszins tegen loon, dan is de eerste zin slechts van toepassing, indien bij de vaststelling van
      het loon met het gevaar geen rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel406
  - number: '407.1'
    text: |-
      Indien twee of meer personen tezamen een opdracht hebben gegeven, zijn zij hoofdelijk tegenover de opdrachtnemer
      verbonden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel407
  - number: '407.2'
    text: |-
      Indien twee of meer personen tezamen een opdracht hebben ontvangen, is ieder van hen voor het geheel aansprakelijk
      ter zake van een tekortkoming in de nakoming, tenzij de tekortkoming niet aan hem kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel407
  - number: '408.1'
    text: De opdrachtgever kan te allen tijde de overeenkomst opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel408
  - number: '408.2'
    text: |-
      De opdrachtnemer die de overeenkomst is aangegaan in de uitoefening van een beroep of bedrijf, kan, behoudens
      gewichtige redenen, de overeenkomst slechts opzeggen, indien zij voor onbepaalde duur geldt en niet door
      volbrenging eindigt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel408
  - number: '408.3'
    text: |-
      Een natuurlijk persoon die een opdracht heeft verstrekt anders dan in de uitoefening van een beroep of bedrijf, is,
      onverminderd [artikel 406][ref1], ter zake van een opzegging geen schadevergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel408
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '409.1'
    text: Indien de opdracht met het oog op een bepaalde persoon is verleend, eindigt zij door zijn dood.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel409
  - number: '409.2'
    text: |-
      Alsdan zijn diens erfgenamen, indien zij kennis dragen van de erfopvolging en van de opdracht, verplicht al datgene
      te doen wat de omstandigheden in het belang van de wederpartij eisen. Een overeenkomstige verplichting rust op
      degenen in wier dienst of met wie de opdrachtnemer een beroep of bedrijf uitoefende.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel409
  - number: '410.1'
    text: |-
      De dood van de opdrachtgever doet de opdracht slechts eindigen, indien dit uit de overeenkomst voortvloeit, en dan
      eerst vanaf het tijdstip waarop de opdrachtnemer de dood heeft gekend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel410
  - number: '410.2'
    text: |-
      Eindigt de opdracht door de dood van de opdrachtgever, dan is de opdrachtnemer niettemin verplicht al datgene te
      doen wat de omstandigheden in het belang van de wederpartij eisen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel410
  - number: '411.1'
    text: |-
      Indien de overeenkomst eindigt voordat de opdracht is volbracht of de tijd waarvoor zij is verleend, is verstreken,
      en de verschuldigdheid van loon afhankelijk is van de volbrenging of van het verstrijken van die tijd, heeft de
      opdrachtnemer recht op een naar redelijkheid vast te stellen deel van het loon. Bij de bepaling hiervan wordt
      onder meer rekening gehouden met de reeds door de opdrachtnemer verrichte werkzaamheden, het voordeel dat de
      opdrachtgever daarvan heeft, en de grond waarop de overeenkomst is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel411
  - number: '411.2'
    text: |-
      In het in lid 1 bedoelde geval heeft de opdrachtnemer slechts recht op het volle loon, indien het einde van de
      overeenkomst aan de opdrachtgever is toe te rekenen en de betaling van het volle loon, gelet op alle omstandigheden
      van het geval, redelijk is. Op het bedrag van het loon worden de besparingen die voor de opdrachtnemer uit de
      voortijdige beëindiging voortvloeien, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel411
  - number: '412'
    text: |-
      Een rechtsvordering tegen de opdrachtnemer tot afgifte van de stukken die hij ter zake van de opdracht onder
      zich heeft gekregen, verjaart door verloop van vijf jaren na de aanvang van de dag, volgende op die waarop zijn
      bemoeiingen zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel412
  - number: '413.1'
    text: |-
      Van [artikel 408 lid 3][ref1] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '413.2'
    text: |-
      Van de [artikelen 408 lid 1][ref1] en [411][ref2] kan niet worden afgeweken ten nadele van een opdrachtgever als
      bedoeld in [artikel 408 lid 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel411
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '411'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '413.3'
    text: |-
      Van [artikel 412][ref1] kan slechts op dezelfde voet worden afgeweken als van de regels inzake de verjaring van
      rechtsvorderingen die in [titel 11 van Boek 3][ref2] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel412
      [ref2]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '412'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
  - number: '414.1'
    text: |-
      Lastgeving is de overeenkomst van opdracht waarbij de ene partij, de lasthebber, zich jegens de andere partij, de
      lastgever, verbindt voor rekening van de lastgever een of meer rechtshandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel414
  - number: '414.2'
    text: |-
      De overeenkomst kan de lasthebber verplichten te handelen in eigen naam; zij kan ook verplichten te handelen in
      naam van de lastgever.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel414
  - number: '415'
    text: Indien een lastgeving met twee of meer lasthebbers is aangegaan, is ieder van hen bevoegd zelfstandig te handelen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel415
  - number: '416.1'
    text: |-
      Een lasthebber kan slechts als wederpartij van de lastgever optreden, indien de inhoud van de rechtshandeling zo
      nauwkeurig vaststaat dat strijd tussen beider belangen is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel416
  - number: '416.2'
    text: |-
      Een lasthebber die slechts in eigen naam mag handelen, kan niettemin als wederpartij van de lastgever optreden,
      indien de inhoud van de rechtshandeling zo nauwkeurig vaststaat dat strijd tussen beider belangen is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel416
  - number: '416.3'
    text: |-
      Indien de lastgever een persoon is als bedoeld in [artikel 408 lid 3][ref1], is voor een rechtshandeling waarbij de
      lasthebber als zijn wederpartij optreedt, op straffe van vernietigbaarheid zijn schriftelijke toestemming vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '416.4'
    text: |-
      De lasthebber die in overeenstemming met de vorige leden als wederpartij van de lastgever optreedt, behoudt zijn
      recht op loon.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel416
  - number: '417.1'
    text: |-
      Een lasthebber mag slechts tevens als lasthebber van de wederpartij optreden, indien de inhoud van de
      rechtshandeling zo nauwkeurig vaststaat dat strijd tussen de belangen van beide lastgevers is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel417
  - number: '417.2'
    text: |-
      Indien de lastgever een persoon is als bedoeld in [artikel 408 lid 3][ref1], is voor de geoorloofdheid van
      een rechtshandeling waarbij de lasthebber ook als lasthebber van de wederpartij optreedt, zijn schriftelijke
      toestemming vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '417.3'
    text: |-
      Een lasthebber heeft geen recht op loon jegens een lastgever ten opzichte van wie hij in strijd met het in de
      vorige leden bepaalde handelt, onverminderd zijn gehoudenheid tot vergoeding van de dientengevolge door die
      lastgever geleden schade. Van deze bepaling kan niet ten nadele van een lastgever worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel417
  - number: '417.4'
    text: |-
      Indien een der lastgevers een persoon is als bedoeld in [artikel 408 lid 3][ref1], en de rechtshandeling strekt tot
      koop of verkoop dan wel huur of verhuur van een onroerende zaak of een gedeelte daarvan of van een recht waaraan de
      zaak is onderworpen, heeft de lasthebber geen recht op loon jegens de koper of huurder. Van deze bepaling kan niet
      ten nadele van de koper of huurder worden afgeweken, tenzij de rechtshandeling strekt tot huur of verhuur van een
      tot woonruimte bestemd gedeelte van een zelfstandige woning.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '418.1'
    text: |-
      Heeft, buiten de gevallen bedoeld in de [artikelen 416][ref1] en [417][ref2], een lasthebber direct of indirect
      belang bij de totstandkoming van de rechtshandeling, dan is hij verplicht de lastgever daarvan in kennis te
      stellen, tenzij de inhoud van de rechtshandeling zo nauwkeurig vaststaat dat strijd tussen beider belangen is
      uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel416
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel417
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '416'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '417'
        afdeling: '2'
  - number: '418.2'
    text: |-
      Een lasthebber heeft geen recht op loon jegens een lastgever ten opzichte van wie hij in strijd met het in lid 1
      bepaalde handelt, onverminderd zijn gehoudenheid tot vergoeding van de dientengevolge door de lastgever geleden
      schade. Van deze bepaling kan niet ten nadele van de lastgever worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel418
  - number: '419'
    text: |-
      Indien een lasthebber in eigen naam een overeenkomst heeft gesloten met een derde die in de nakoming van
      zijn verplichtingen tekortschiet, is de derde binnen de grenzen van hetgeen omtrent zijn verplichting tot
      schadevergoeding overigens uit de wet voortvloeit, jegens de lasthebber mede gehouden tot vergoeding van de schade
      die de lastgever door de tekortkoming heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel419
  - number: '420.1'
    text: |-
      Indien een lasthebber die in eigen naam een overeenkomst heeft gesloten met een derde, zijn verplichtingen
      jegens de lastgever niet nakomt, in staat van faillissement geraakt of indien ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing wordt verklaard, kan de lastgever de voor overgang
      vatbare rechten van de lasthebber jegens de derde door een schriftelijke verklaring aan hen beiden op zich doen
      overgaan, behoudens voor zover zij in de onderlinge verhouding tussen lastgever en lasthebber aan deze laatste
      toekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel420
  - number: '420.2'
    text: |-
      Dezelfde bevoegdheid heeft de lastgever indien de derde zijn verplichtingen tegenover de lasthebber niet nakomt,
      tenzij deze de lastgever voldoet alsof de derde zijn verplichtingen was nagekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel420
  - number: '420.3'
    text: |-
      De lasthebber is in de gevallen in dit artikel bedoeld gehouden de naam van de derde aan de lastgever op diens
      verzoek mede te delen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel420
  - number: '421.1'
    text: |-
      Indien een lasthebber die in eigen naam een overeenkomst heeft gesloten met een derde, zijn verplichtingen jegens
      de derde niet nakomt, in staat van faillissement geraakt of indien ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing wordt verklaard, kan de derde na schriftelijke mededeling aan de lasthebber en
      de lastgever zijn rechten uit de overeenkomst tegen de lastgever uitoefenen, voor zover deze op het tijdstip van de
      mededeling op overeenkomstige wijze jegens de lasthebber gehouden is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel421
  - number: '421.2'
    text: |-
      De lasthebber is in het geval in dit artikel bedoeld gehouden de naam van de lastgever aan de derde op diens
      verzoek mede te delen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel421
  - number: '422.1'
    text: |-
      Lastgeving eindigt, behalve door opzegging overeenkomstig [artikel 408][ref1], door:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: 422.1.a
    text: |-
      de dood, de ondercuratelestelling, het faillissement van de lastgever of het ten aanzien van hem van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, met dien verstande dat de dood of de
      ondercuratelestelling de overeenkomst doet eindigen op het tijdstip waarop de lasthebber daarvan kennis krijgt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
  - number: 422.1.b
    text: |-
      de dood, de ondercuratelestelling, het faillissement van de lasthebber of het ten aanzien van hem van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
  - number: '422.2'
    text: |-
      Van [artikel 408 lid 1][ref1] voor zover van toepassing op lastgeving, en van lid 1 onder *a* kan niet
      worden afgeweken. Voor zover de overeenkomst strekt tot het verrichten van een rechtshandeling in het
      belang van de lasthebber of van een derde, kan echter worden bepaald dat zij niet door de lastgever
      kan worden opgezegd, of dat zij niet eindigt door de dood of de ondercuratelestelling van de lastgever.
      [Artikel 74 leden 1, tweede zin, 2 en 4 van Boek 3][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '74'
  - number: '422.3'
    text: |-
      Eindigt de lastgeving door de dood of de ondercuratelestelling van de lastgever, dan is de lasthebber niettemin
      verplicht al datgene te doen wat de omstandigheden in het belang van de wederpartij eisen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
  - number: '422.4'
    text: |-
      Eindigt de lastgeving door de dood van de lasthebber, dan zijn diens erfgenamen, indien zij kennis dragen van
      de erfopvolging en van de lastgeving, verplicht al datgene te doen wat de omstandigheden in het belang van de
      wederpartij eisen. Een overeenkomstige verplichting rust op degenen in wier dienst of met wie de lasthebber een
      beroep of bedrijf uitoefende.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel422
  - number: '423.1'
    text: |-
      Indien is bedongen dat de lasthebber een aan de lastgever toekomend recht in eigen naam en met uitsluiting van de
      lastgever zal uitoefenen, mist deze de bevoegdheid tot deze uitoefening voor de duur van de overeenkomst ook jegens
      derden. De uitsluiting kan niet worden tegengeworpen aan derden die haar kenden noch behoorden te kennen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel423
  - number: '423.2'
    text: |-
      Indien de lasthebber die de uitsluiting bedong, een rechtspersoon is die zich ingevolge zijn statuten ten
      doel stelt de gezamenlijke belangen van meer lastgevers door de uitoefening van de aan hen toekomende rechten
      te behartigen, kan in afwijking van [artikel 422 lid 2][ref1] worden overeengekomen dat de lastgeving niet
      zal eindigen door opzegging door de lastgever op een termijn die minder dan een jaar bedraagt, noch door
      diens dood, ondercuratelestelling, faillissement of het ten aanzien van hem van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen. Dit beding sluit niet uit dat de overeenkomst op een termijn van
      tenminste één maand kan worden opgezegd door de erfgenamen van de lastgever of, in geval van diens faillissement
      of ondercuratelestelling, door de curator dan wel, indien ten aanzien van de lastgever de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, door de bewindvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel422
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '422'
        afdeling: '2'
  - number: '424.1'
    text: |-
      De [artikelen 415-423][ref1] zijn van overeenkomstige toepassing op andere overeenkomsten dan lastgeving krachtens
      welke de ene partij verplicht of bevoegd is voor rekening van de andere partij rechtshandelingen te verrichten,
      voor zover de strekking van de betrokken bepalingen in verband met de aard van de overeenkomst zich daartegen niet
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel415
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '415'
        afdeling: '2'
  - number: '424.2'
    text: Het vorige lid is niet van toepassing op overeenkomsten tot het vervoeren of doen vervoeren van personen of zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel424
  - number: '425'
    text: |-
      De bemiddelingsovereenkomst is de overeenkomst van opdracht waarbij de ene partij, de opdrachtnemer, zich tegenover
      de andere partij, de opdrachtgever, verbindt tegen loon als tussenpersoon werkzaam te zijn bij het tot stand
      brengen van een of meer overeenkomsten tussen de opdrachtgever en derden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel425
  - number: '426.1'
    text: |-
      De tussenpersoon heeft recht op loon zodra door zijn bemiddeling de overeenkomst tussen de opdrachtgever en de
      derde is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel426
  - number: '426.2'
    text: |-
      Indien het recht op loon afhankelijk is gesteld van de uitvoering van de bemiddelde overeenkomst en deze
      overeenkomst niet wordt uitgevoerd, is de opdrachtgever het loon ook verschuldigd, tenzij de niet-uitvoering niet
      aan hem kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel426
  - number: '427'
    text: |-
      De [artikelen 417][ref1] en [418][ref2] zijn van overeenkomstige toepassing op overeenkomsten waarbij de
      ene partij jegens de andere partij verplicht of bevoegd is als tussenpersoon werkzaam te zijn als bedoeld in
      [artikel 425][ref3], met dien verstande dat met een tussenpersoon die tevens werkzaam is voor de wederpartij,
      gelijkgesteld is een tussenpersoon die zelf als wederpartij optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel417
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel418
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel425
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '417'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '418'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '425'
        afdeling: '3'
  - number: '428.1'
    text: |-
      De agentuurovereenkomst is een overeenkomst waarbij de ene partij, de principaal, aan de andere partij, de
      handelsagent, opdraagt, en deze zich verbindt, voor een bepaalde of een onbepaalde tijd en tegen beloning bij
      de totstandkoming van overeenkomsten bemiddeling te verlenen, en deze eventueel op naam en voor rekening van de
      principaal te sluiten zonder aan deze ondergeschikt te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel428
  - number: '428.2'
    text: |-
      De bepalingen van deze afdeling zijn niet van toepassing op agentuurovereenkomsten waarop de
      [Wet assurantiebemiddelingsbedrijf][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004993
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0004993
  - number: '428.3'
    text: |-
      Ieder der partijen is verplicht de wederpartij op haar verzoek een ondertekend geschrift te verschaffen dat de dan
      geldende inhoud van de agentuurovereenkomst weergeeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel428
  - number: '429.1'
    text: |-
      De handelsagent kan zich voor verplichtingen die voor derden uit een door hem bemiddelde of afgesloten overeenkomst
      voortvloeien, uitsluitend schriftelijk aansprakelijk stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel429
  - number: '429.2'
    text: |-
      Tenzij schriftelijk anders is overeengekomen, is de handelsagent krachtens een beding van delcredere slechts
      aansprakelijk voor de gegoedheid van de derde.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel429
  - number: '429.3'
    text: |-
      Hij kan zich niet aansprakelijk stellen tot een hoger bedrag dan de overeengekomen provisie, tenzij het beding
      betrekking heeft op een bepaalde overeenkomst of op overeenkomsten die hij zelf in naam van de principaal sluit.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel429
  - number: '429.4'
    text: |-
      Indien er een kennelijke wanverhouding is tussen het risico dat de handelsagent op zich heeft genomen, en de
      bedongen provisie, kan de rechter het bedrag waarvoor de handelsagent aansprakelijk is, matigen, voor zover dit
      bedrag de provisie te boven gaat. De rechter houdt met alle omstandigheden rekening, in het bijzonder met de wijze
      waarop de handelsagent de belangen van de principaal heeft behartigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel429
  - number: '430.1'
    text: |-
      De principaal moet alles doen wat in de gegeven omstandigheden van zijn kant nodig is om de handelsagent in staat
      te stellen zijn werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel430
  - number: '430.2'
    text: |-
      Hij moet aan de handelsagent het nodige documentatiemateriaal ter beschikking stellen over de goederen en diensten
      waarvoor de handelsagent bemiddelt, en hem alle inlichtingen verschaffen die nodig zijn voor de uitvoering van
      de agentuurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel430
  - number: '430.3'
    text: |-
      Hij is verplicht de handelsagent onverwijld te waarschuwen, indien hij voorziet dat in een uitgesproken geringere
      mate dan de handelsagent mocht verwachten, overeenkomsten zullen of mogen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel430
  - number: '430.4'
    text: |-
      Hij moet de handelsagent binnen een redelijke termijn op de hoogte stellen van zijn aanvaarding of weigering of de
      niet-uitvoering van een door de handelsagent aangebrachte overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel430
  - number: '431.1'
    text: |-
      De handelsagent heeft recht op provisie voor de overeenkomsten die tijdens de duur der agentuurovereenkomst zijn
      tot stand gekomen:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: 431.1.a
    text: indien de overeenkomst door zijn tussenkomst is tot stand gekomen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: 431.1.b
    text: |-
      indien de overeenkomst is tot stand gekomen met iemand die hij reeds vroeger voor een dergelijke overeenkomst had
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: 431.1.c
    text: |-
      indien de overeenkomst is afgesloten met iemand die behoort tot de klantenkring die, of gevestigd is in het gebied
      dat aan de handelsagent is toegewezen, tenzij uitdrukkelijk is overeengekomen dat de handelsagent ten aanzien van
      die klantenkring of in dat gebied niet het alleenrecht heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: '431.2'
    text: |-
      De handelsagent heeft recht op provisie voor de voorbereiding van na het einde van de agentuurovereenkomst tot
      stand gekomen overeenkomsten:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: 431.2.a
    text: |-
      indien deze hoofdzakelijk aan de tijdens de duur van de agentuurovereenkomst door hem verrichte werkzaamheden zijn
      te danken en binnen een redelijke termijn na de beëindiging van die overeenkomst zijn afgesloten, of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: 431.2.b
    text: |-
      indien hij of de principaal, overeenkomstig de voorwaarden bepaald in het eerste lid, de bestelling van de derde
      heeft ontvangen voor de beëindiging van de agentuurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: '431.3'
    text: |-
      De handelsagent heeft geen recht op provisie, indien deze krachtens het tweede lid is verschuldigd aan zijn
      voorganger, tenzij uit de omstandigheden voortvloeit dat het billijk is de provisie tussen hen beiden te verdelen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel431
  - number: '432.1'
    text: |-
      Indien de rol van de handelsagent zich heeft beperkt tot het verlenen van bemiddeling bij de totstandkoming van
      de overeenkomst, wordt de order die hij aan zijn principaal heeft doen toekomen, voor wat betreft het recht op
      provisie krachtens [artikel 426][ref1] geacht te zijn aanvaard, tenzij de principaal de handelsagent binnen de
      redelijke termijn, bedoeld in [artikel 430 lid 4][ref2], mededeelt dat hij de order weigert of een voorbehoud
      maakt. Bij gebreke van een in de agentuurovereenkomst bepaalde termijn bedraagt de termijn een maand vanaf het
      tijdstip waarop hem de order is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel430
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
  - number: '432.2'
    text: |-
      Het beding dat het recht op provisie doet afhangen van de uitvoering van de overeenkomst, dient uitdrukkelijk te
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel432
  - number: '432.3'
    text: |-
      Indien het beding, bedoeld in het tweede lid, is gemaakt, ontstaat het recht op provisie uiterlijk wanneer de
      derde zijn deel van de overeenkomst heeft uitgevoerd, of dit had moeten doen, indien de principaal zijn deel van de
      transactie had uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel432
  - number: '433.1'
    text: |-
      De principaal is verplicht na afloop van iedere maand aan de handelsagent een schriftelijke opgave te verstrekken
      van de over die maand verschuldigde provisie, onder vermelding van de gegevens waarop de berekening berust; deze
      opgave moet worden verstrekt voor het einde van de volgende maand. Partijen kunnen schriftelijk overeenkomen dat de
      opgave twee- of driemaandelijks wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel433
  - number: '433.2'
    text: |-
      De handelsagent is bevoegd van de principaal inzage te verlangen van de nodige bewijsstukken, echter zonder afgifte
      te kunnen verlangen. Hij kan zich op zijn kosten doen bijstaan door een deskundige, aanvaard door de principaal of,
      bij afwijzing, benoemd door de voorzieningenrechter van de bevoegde rechtbank op verzoek van de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel433
  - number: '433.3'
    text: |-
      Echter kunnen partijen schriftelijk overeenkomen dat de inzage van de bewijsstukken zal geschieden aan een derde;
      indien deze zijn taak niet vervult, zal de voorzieningenrechter van de rechtbank een plaatsvervanger aanwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel433
  - number: '433.4'
    text: |-
      De overlegging van de bewijsstukken door de principaal geschiedt onder verplichting tot geheimhouding door de
      handelsagent en in de vorige leden vermelde personen. Deze laatsten zijn echter niet verplicht tot geheimhouding
      tegenover de handelsagent voor zover het betreft een in het eerste lid bedoeld gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel433
  - number: '434'
    text: |-
      De provisie wordt uiterlijk opeisbaar op het tijdstip waarop de schriftelijke opgave, bedoeld in
      [artikel 433][ref1], moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel433
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
  - number: '435.1'
    text: |-
      De handelsagent heeft recht op een beloning, indien hij bereid is zijn verplichtingen uit de agentuurovereenkomst
      na te komen of deze reeds heeft nagekomen, doch de principaal van de diensten van de handelsagent geen gebruik
      heeft gemaakt of in aanzienlijk geringere mate gebruik heeft gemaakt dan deze als normaal mocht verwachten, tenzij
      de gedraging van de principaal voortvloeit uit omstandigheden welke redelijkerwijs niet voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel435
  - number: '435.2'
    text: |-
      Bij de bepaling van deze beloning wordt rekening gehouden met het bedrag van de in de voorafgaande tijd verdiende
      provisie en met alle andere ter zake in acht te nemen factoren, zoals de onkosten die de handelsagent zich door het
      niet verrichten van werkzaamheden bespaart.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel435
  - number: '436'
    text: |-
      Een agentuurovereenkomst die na het verstrijken van de termijn waarvoor zij is aangegaan, door beide partijen wordt
      voortgezet, bindt partijen voor onbepaalde tijd op dezelfde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel436
  - number: '437.1'
    text: |-
      Indien de agentuurovereenkomst is aangegaan voor een onbepaalde tijd of voor een bepaalde tijd met recht van
      tussentijdse opzegging, is ieder der partijen bevoegd haar te doen eindigen met inachtneming van de overeengekomen
      opzeggingstermijn. Bij gebreke van een overeenkomst dienaangaande zal de opzeggingstermijn vier maanden bedragen,
      vermeerderd met een maand na drie jaren looptijd van de overeenkomst en met twee maanden na zes jaren.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel437
  - number: '437.2'
    text: |-
      De termijn van opzegging kan niet korter zijn dan een maand in het eerste jaar van de overeenkomst, twee maanden
      in het tweede jaar en drie maanden in de volgende jaren. Indien partijen langere termijnen overeenkomen, mogen deze
      voor de principaal niet korter zijn dan voor de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel437
  - number: '437.3'
    text: Opzegging behoort plaats te vinden tegen het einde van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel437
  - number: '438.1'
    text: De agentuurovereenkomst eindigt door het overlijden van de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel438
  - number: '438.2'
    text: |-
      In geval van overlijden van de principaal zijn zowel zijn erfgenamen als de handelsagent bevoegd, mits binnen negen
      maanden na het overlijden, de overeenkomst te doen eindigen met een opzeggingstermijn van vier maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel438
  - number: '439.1'
    text: |-
      De partij die de overeenkomst beëindigt zonder eerbiediging van haar duur of zonder inachtneming van de wettelijke
      of overeengekomen opzeggingstermijn en zonder dat de wederpartij daarin toestemt, is schadeplichtig, tenzij zij de
      overeenkomst doet eindigen om een dringende, aan de wederpartij onverwijld medegedeelde reden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel439
  - number: '439.2'
    text: |-
      Dringende redenen zijn omstandigheden van zodanige aard dat van de partij die de overeenkomst doet eindigen,
      redelijkerwijs niet gevergd kan worden de overeenkomst, zelfs tijdelijk, in stand te laten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel439
  - number: '439.3'
    text: |-
      Indien de beëindiging van de overeenkomst wegens een dringende reden gegrond is op omstandigheden waarvoor de
      wederpartij een verwijt treft, is laatstgenoemde schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel439
  - number: '439.4'
    text: |-
      Een beding waardoor aan een der partijen de beslissing wordt overgelaten of er een dringende reden aanwezig is,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel439
  - number: '440.1'
    text: |-
      Ieder der beide partijen is bevoegd de kantonrechter te verzoeken de agentuurovereenkomst te ontbinden op grond
      van:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
  - number: 440.1.a
    text: |-
      omstandigheden die een dringende reden opleveren in de zin van [artikel 439 lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
  - number: 440.1.b
    text: |-
      verandering in de omstandigheden welke van dien aard is, dat de billijkheid eist dat aan de overeenkomst dadelijk
      of na korte tijd een einde wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
  - number: '440.2'
    text: |-
      Spreekt de rechter de ontbinding uit op grond van een omstandigheid als bedoeld in het eerste lid onder *a* en kan
      van deze omstandigheid de verweerder een verwijt worden gemaakt, dan is deze schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
  - number: '440.3'
    text: |-
      Spreekt de rechter de ontbinding uit op grond van hetgeen is bepaald in het eerste lid onder *b*, dan kan hij aan
      een der partijen een vergoeding toekennen. Hij kan bepalen dat deze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
  - number: '440.4'
    text: |-
      [Het vijfde, zesde, zevende, negende, tiende en elfde lid van artikel 685 van Boek 7][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: '441.1'
    text: |-
      De partij die, krachtens [artikel 439][ref1] of [artikel 440 lid 2][ref2], schadeplichtig is, is aan de wederpartij
      een som verschuldigd gelijk aan de beloning over de tijd dat de agentuurovereenkomst bij regelmatige beëindiging
      had behoren voort te duren. Voor de vaststelling van deze som wordt rekening gehouden met de in de voorafgaande
      tijd verdiende provisie en met alle andere ter zake in acht te nemen factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel440
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '440'
        afdeling: '4'
  - number: '441.2'
    text: De rechter is bevoegd deze som te verminderen, indien zij hem met het oog op de omstandigheden te hoog voorkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel441
  - number: '441.3'
    text: |-
      De benadeelde partij kan, in plaats van de schadeloosstelling in de voorafgaande leden bedoeld, volledige
      vergoeding van haar schade vorderen, onder gehoudenheid de omvang daarvan te bewijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel441
  - number: '442.1'
    text: |-
      Ongeacht het recht om schadevergoeding te vorderen, heeft de handelsagent bij het einde van de agentuurovereenkomst
      recht op een vergoeding, klantenvergoeding, voor zover:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: 442.1.a
    text: |-
      hij de principaal nieuwe klanten heeft aangebracht of de overeenkomsten met de bestaande klanten aanmerkelijk heeft
      uitgebreid en de overeenkomsten met deze klanten de principaal nog aanzienlijke voordelen opleveren, en
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: 442.1.b
    text: |-
      de betaling van deze vergoeding billijk is, gelet op alle omstandigheden, in het bijzonder op de verloren provisie
      uit de overeenkomsten met deze klanten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: '442.2'
    text: |-
      Het bedrag van de vergoeding is niet hoger dan dat van de beloning van één jaar, berekend naar het gemiddelde
      van de laatste vijf jaren of, indien de overeenkomst korter heeft geduurd, naar het gemiddelde van de gehele duur
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: '442.3'
    text: |-
      Het recht op vergoeding vervalt, indien de handelsagent de principaal niet uiterlijk een jaar na het einde van de
      overeenkomst heeft medegedeeld dat hij vergoeding verlangt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: '442.4'
    text: 'De vergoeding is niet verschuldigd, indien de overeenkomst is beëindigd:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: 442.4.a
    text: |-
      door de principaal onder omstandigheden die de handelsagent ingevolge [artikel 439 lid 3][ref1] schadeplichtig
      maken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
  - number: 442.4.b
    text: |-
      door de handelsagent, tenzij deze beëindiging wordt gerechtvaardigd door omstandigheden die de principaal kunnen
      worden toegerekend, of wordt gerechtvaardigd door leeftijd, invaliditeit of ziekte van de handelsagent, op grond
      waarvan redelijkerwijs niet meer van hem kan worden gevergd dat hij zijn werkzaamheden voortzet;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: 442.4.c
    text: |-
      door de handelsagent die, overeenkomstig een afspraak met de principaal, zijn rechten en verplichtingen uit hoofde
      van de agentuurovereenkomst aan een derde overdraagt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel442
  - number: '443.1'
    text: |-
      Een beding dat de handelsagent beperkt in zijn vrijheid om na het einde van de agentuurovereenkomst werkzaam te
      zijn, is slechts geldig voor zover:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: 443.1.a
    text: het op schrift is gesteld, en
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: 443.1.b
    text: |-
      betrekking heeft op het soort goederen of diensten waarvan hij de vertegenwoordiging had, en op het gebied, of de
      klantenkring en het gebied, aan hem toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: '443.2'
    text: Zodanig beding is slechts geldig gedurende ten hoogste twee jaren na het einde van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: '443.3'
    text: 'Aan zodanig beding kan de principaal geen rechten ontlenen, indien de overeenkomst is geëindigd:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: 443.3.a
    text: |-
      doordat hij haar zonder toestemming van de handelsagent heeft beëindigd zonder inachtneming van de wettelijke of
      overeengekomen termijn en zonder een dringende aan de handelsagent onverwijld medegedeelde reden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: 443.3.b
    text: |-
      doordat de handelsagent de overeenkomst heeft beëindigd vanwege een dringende, onverwijld aan de principaal
      medegedeelde reden waarvoor laatstgenoemde een verwijt treft;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: 443.3.c
    text: door een rechterlijke uitspraak, gegrond op omstandigheden ter zake waarvan de principaal een verwijt treft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: '443.4'
    text: |-
      De rechter kan, indien de handelsagent dat vraagt, zulk een beding geheel of gedeeltelijk teniet doen op grond
      dat, in verhouding tot het te beschermen belang van de principaal, de handelsagent door het beding onbillijk wordt
      benadeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel443
  - number: '444'
    text: |-
      Rechtsvorderingen gegrond op de [artikelen 439][ref1] en [440][ref2] verjaren door verloop van één jaar na het feit
      dat de vordering deed ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel440
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '440'
        afdeling: '4'
  - number: '445.1'
    text: |-
      Partijen kunnen niet afwijken van de [artikelen 401][ref1], [402][ref2], [403][ref3] en [426 lid 2][ref4] noch
      van de [artikelen 428 lid 3][ref5], [429][ref6], [430][ref7], [431 lid 2][ref8], [432 lid 2][ref9], [433][ref10],
      [437 lid 2][ref11], [439][ref12], [440][ref13], [441][ref14], [443][ref15] en [444][ref16].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel401
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel402
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel403
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel428
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel429
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel430
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel431
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel433
      [ref11]: https://wetten.overheid.nl/BWBR0005290#Artikel437
      [ref12]: https://wetten.overheid.nl/BWBR0005290#Artikel439
      [ref13]: https://wetten.overheid.nl/BWBR0005290#Artikel440
      [ref14]: https://wetten.overheid.nl/BWBR0005290#Artikel441
      [ref15]: https://wetten.overheid.nl/BWBR0005290#Artikel443
      [ref16]: https://wetten.overheid.nl/BWBR0005290#Artikel444
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '401'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '402'
        afdeling: '1'
      - id: ref3
