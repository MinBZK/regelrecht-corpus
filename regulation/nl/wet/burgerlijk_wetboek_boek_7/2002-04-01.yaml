        artikel: '442'
        afdeling: '4'
  - number: '446.1'
    text: |-
      De overeenkomst inzake geneeskundige behandeling - in deze afdeling verder aangeduid als de
      behandelingsovereenkomst - is de overeenkomst waarbij een natuurlijke persoon of een rechtspersoon, de
      hulpverlener, zich in de uitoefening van een geneeskundig beroep of bedrijf tegenover een ander, de opdrachtgever,
      verbindt tot het verrichten van handelingen op het gebied van de geneeskunst, rechtstreeks betrekking hebbende
      op de persoon van de opdrachtgever of van een bepaalde derde. Degene op wiens persoon de handelingen rechtstreeks
      betrekking hebben wordt verder aangeduid als de patiënt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: '446.2'
    text: 'Onder handelingen op het gebied van de geneeskunst worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: 446.2.a
    text: |-
      alle verrichtingen - het onderzoeken en het geven van raad daaronder begrepen - rechtstreeks betrekking hebbende op
      een persoon en ertoe strekkende hem van een ziekte te genezen, hem voor het ontstaan van een ziekte te behoeden of
      zijn gezondheidstoestand te beoordelen, dan wel deze verloskundige bijstand te verlenen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: 446.2.b
    text: |-
      andere dan de onder *a* bedoelde handelingen, rechtstreeks betrekking hebbende op een persoon, die worden verricht
      door een arts of tandarts in die hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: '446.3'
    text: |-
      Tot de handelingen, bedoeld in lid 1, worden mede gerekend het in het kader daarvan verplegen en verzorgen van de
      patiënt en het overigens rechtstreeks ten behoeve van de patiënt voorzien in de materiële omstandigheden waaronder
      die handelingen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: '446.4'
    text: |-
      Onder handelingen als bedoeld in lid 1 zijn niet begrepen handelingen op het gebied van de artsenijbereidkunst
      in de zin van de [Wet op de Geneesmiddelenvoorziening][ref1], indien deze worden verricht door een gevestigde
      apotheker in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '446.5'
    text: |-
      Geen behandelingsovereenkomst is aanwezig, indien het betreft handelingen ter beoordeling van de
      gezondheidstoestand of medische begeleiding van een persoon, verricht in opdracht van een ander dan die persoon
      in verband met de vaststelling van aanspraken of verplichtingen, de toelating tot een verzekering of voorziening,
      of de beoordeling van de geschiktheid voor een opleiding, een arbeidsverhouding of de uitvoering van bepaalde
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel446
  - number: '447.1'
    text: |-
      Een minderjarige die de leeftijd van zestien jaren heeft bereikt, is bekwaam tot het aangaan van een
      behandelingsovereenkomst ten behoeve van zichzelf, alsmede tot het verrichten van rechtshandelingen die met de
      overeenkomst onmiddellijk verband houden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel447
  - number: '447.2'
    text: |-
      De minderjarige is aansprakelijk voor de daaruit voortvloeiende verbintenissen, onverminderd de verplichting van
      zijn ouders tot voorziening in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel447
  - number: '447.3'
    text: |-
      In op die behandelingsovereenkomst betrekking hebbende aangelegenheden is de minderjarige bekwaam in en buiten
      rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel447
  - number: '448.1'
    text: |-
      De hulpverlener licht de patiënt op duidelijke wijze, en desgevraagd schriftelijk in over het voorgenomen
      onderzoek en de voorgestelde behandeling en over de ontwikkelingen omtrent het onderzoek, de behandeling en de
      gezondheidstoestand van de patiënt. De hulpverlener licht een patiënt die de leeftijd van twaalf jaren nog niet
      heeft bereikt op zodanige wijze in als past bij zijn bevattingsvermogen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: '448.2'
    text: |-
      Bij het uitvoeren van de in lid 1 neergelegde verplichting laat de hulpverlener zich leiden door hetgeen de patiënt
      redelijkerwijze dient te weten ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: 448.2.a
    text: |-
      de aard en het doel van het onderzoek of de behandeling die hij noodzakelijk acht en van de uit te voeren
      verrichtingen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: 448.2.b
    text: de te verwachten gevolgen en risico’s daarvan voor de gezondheid van de patiënt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: 448.2.c
    text: andere methoden van onderzoek of behandeling die in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: 448.2.d
    text: |-
      de staat van en de vooruitzichten met betrekking tot diens gezondheid voor wat betreft het terrein van het
      onderzoek of de behandeling.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: '448.3'
    text: |-
      De hulpverlener mag de patiënt bedoelde inlichtingen slechts onthouden voor zover het verstrekken ervan kennelijk
      ernstig nadeel voor de patiënt zou opleveren. Indien het belang van de patiënt dit vereist, dient de hulpverlener
      de desbetreffende inlichtingen aan een ander dan de patiënt te verstrekken. De inlichtingen worden de patiënt
      alsnog gegeven, zodra bedoeld nadeel niet meer te duchten is. De hulpverlener maakt geen gebruik van zijn in de
      eerste volzin bedoelde bevoegdheid dan nadat hij daarover een andere hulpverlener heeft geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel448
  - number: '449'
    text: |-
      Indien de patiënt te kennen heeft gegeven geen inlichtingen te willen ontvangen, blijft het verstrekken daarvan
      achterwege, behoudens voor zover het belang dat de patiënt daarbij heeft niet opweegt tegen het nadeel dat daaruit
      voor hemzelf of anderen kan voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel449
  - number: '450.1'
    text: Voor verrichtingen ter uitvoering van een behandelingsovereenkomst is de toestemming van de patiënt vereist.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel450
  - number: '450.2'
    text: |-
      Indien de patiënt minderjarig is en de leeftijd van twaalf maar nog niet die van zestien jaren heeft bereikt, is
      tevens de toestemming van de ouders die het gezag over hem uitoefenen of van zijn voogd vereist. De verrichting kan
      evenwel zonder de toestemming van de ouders of de voogd worden uitgevoerd, indien zij kennelijk nodig is teneinde
      ernstig nadeel voor de patiënt te voorkomen, alsmede indien de patiënt ook na de weigering van de toestemming, de
      verrichting weloverwogen blijft wensen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel450
  - number: '450.3'
    text: |-
      In het geval waarin een patiënt van zestien jaren of ouder niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake, worden door de hulpverlener en een persoon als bedoeld in de
      [leden 2 of 3 van artikel 465][ref1], de kennelijke opvattingen van de patiënt, geuit in schriftelijke vorm toen
      deze tot bedoelde redelijke waardering nog in staat was en inhoudende een weigering van toestemming als bedoeld in
      lid 1, opgevolgd. De hulpverlener kan hiervan afwijken indien hij daartoe gegronde redenen aanwezig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '451'
    text: |-
      Op verzoek van de patiënt legt de hulpverlener in ieder geval schriftelijk vast voor welke verrichtingen van
      ingrijpende aard deze toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel451
  - number: '452'
    text: |-
      De patiënt geeft de hulpverlener naar beste weten de inlichtingen en de medewerking die deze redelijkerwijs voor
      het uitvoeren van de overeenkomst behoeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel452
  - number: '453'
    text: |-
      De hulpverlener moet bij zijn werkzaamheden de zorg van een goed hulpverlener in acht nemen en handelt daarbij
      in overeenstemming met de op hem rustende verantwoordelijkheid, voortvloeiende uit de voor hulpverleners geldende
      professionele standaard.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel453
  - number: '454.1'
    text: |-
      De hulpverlener richt een dossier in met betrekking tot de behandeling van de patiënt. Hij houdt in het dossier
      aantekening van de gegevens omtrent de gezondheid van de patiënt en de te diens aanzien uitgevoerde verrichtingen
      en neemt andere stukken, bevattende zodanige gegevens, daarin op, een en ander voor zover dit voor een goede
      hulpverlening aan hem noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel454
  - number: '454.2'
    text: |-
      De hulpverlener voegt desgevraagd een door de patiënt afgegeven verklaring met betrekking tot de in het dossier
      opgenomen stukken aan het dossier toe.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel454
  - number: '454.3'
    text: |-
      Onverminderd het bepaalde in [artikel 455][ref1], bewaart de hulpverlener de bescheiden, bedoeld in de vorige
      leden, gedurende tien jaren, te rekenen vanaf het tijdstip waarop zij zijn vervaardigd, of zoveel langer als
      redelijkerwijs uit de zorg van een goed hulpverlener voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel455
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel454
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '455'
        afdeling: '5'
  - number: '455.1'
    text: |-
      De hulpverlener vernietigt de door hem bewaarde bescheiden, bedoeld in [artikel 454][ref1], binnen drie maanden na
      een daartoe strekkend verzoek van de patiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel455
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '455.2'
    text: |-
      Lid 1 geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat de bewaring
      van aanmerkelijk belang is voor een ander dan de patiënt, alsmede voor zover het bepaalde bij of krachtens de wet
      zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel455
  - number: '456'
    text: |-
      De hulpverlener verstrekt aan de patiënt desgevraagd zo spoedig mogelijk inzage in en afschrift van de bescheiden,
      bedoeld in [artikel 454][ref1]. De verstrekking blijft achterwege voor zover dit noodzakelijk is in het belang
      van de bescherming van de persoonlijke levenssfeer van een ander. De hulpverlener mag voor de verstrekking van het
      afschrift een redelijke vergoeding in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel456
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '457.1'
    text: |-
      Onverminderd het in [artikel 448 lid 3, tweede volzin][ref1], bepaalde draagt de hulpverlener zorg, dat aan
      anderen dan de patiënt geen inlichtingen over de patiënt dan wel inzage in of afschrift van de bescheiden, bedoeld
      in [artikel 454][ref2], worden verstrekt dan met toestemming van de patiënt. Indien verstrekking plaatsvindt,
      geschiedt deze slechts voor zover daardoor de persoonlijke levenssfeer van een ander niet wordt geschaad. De
      verstrekking kan geschieden zonder inachtneming van de beperkingen, bedoeld in de voorgaande volzinnen, indien het
      bij of krachtens de wet bepaalde daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '448'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '457.2'
    text: |-
      Onder anderen dan de patiënt zijn niet begrepen degenen die rechtstreeks betrokken zijn bij de uitvoering van
      de behandelingsovereenkomst en degene die optreedt als vervanger van de hulpverlener, voor zover de verstrekking
      noodzakelijk is voor de door hen in dat kader te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel457
  - number: '457.3'
    text: |-
      Daaronder zijn evenmin begrepen degenen wier toestemming ter zake van de uitvoering van de behandelingsovereenkomst
      op grond van de [artikelen 450][ref1] en [465][ref2] is vereist. Indien de hulpverlener door inlichtingen over de
      patiënt dan wel inzage in of afschrift van de bescheiden te verstrekken niet geacht kan worden de zorg van een goed
      hulpverlener in acht te nemen, laat hij zulks achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '458.1'
    text: |-
      In afwijking van het bepaalde in [artikel 457 lid 1][ref1] kunnen zonder toestemming van de patiënt ten behoeve
      van statistiek of wetenschappelijk onderzoek op het gebied van de volksgezondheid aan een ander desgevraagd
      inlichtingen over de patiënt of inzage in de bescheiden, bedoeld in [artikel 454][ref2], worden verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '457'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: 458.1.a
    text: |-
      het vragen van toestemming in redelijkheid niet mogelijk is en met betrekking tot de uitvoering van het onderzoek
      is voorzien in zodanige waarborgen, dat de persoonlijke levenssfeer van de patiënt niet onevenredig wordt geschaad,
      of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: 458.1.b
    text: |-
      het vragen van toestemming, gelet op de aard en het doel van het onderzoek, in redelijkheid niet kan worden
      verlangd en de hulpverlener zorg heeft gedragen dat de gegevens in zodanige vorm worden verstrekt dat herleiding
      tot individuele natuurlijke personen redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: '458.2'
    text: 'Verstrekking overeenkomstig lid 1 is slechts mogelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: 458.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: 458.2.b
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: 458.2.c
    text: voor zover de betrokken patiënt tegen een verstrekking niet uitdrukkelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: '458.3'
    text: Bij een verstrekking overeenkomstig lid 1 wordt daarvan aantekening gehouden in het dossier.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel458
  - number: '459.1'
    text: |-
      De hulpverlener voert verrichtingen in het kader van de behandelingsovereenkomst uit buiten de waarneming van
      anderen dan de patiënt, tenzij de patiënt ermee heeft ingestemd dat de verrichtingen kunnen worden waargenomen
      door anderen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel459
  - number: '459.2'
    text: |-
      Onder anderen dan de patiënt zijn niet begrepen degenen van wie beroepshalve de medewerking bij de uitvoering van
      de verrichting noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel459
  - number: '459.3'
    text: |-
      Daaronder zijn evenmin begrepen degenen wier toestemming ter zake van de verrichting op grond van de
      [artikelen 450][ref1] en [465][ref2] is vereist. Indien de hulpverlener door verrichtingen te doen waarnemen niet
      geacht kan worden de zorg van een goed hulpverlener in acht te nemen, laat hij zulks niet toe.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '460'
    text: De hulpverlener kan, behoudens gewichtige redenen, de behandelingsovereenkomst niet opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel460
  - number: '461'
    text: |-
      De opdrachtgever is de hulpverlener loon verschuldigd, behoudens voor zover deze voor zijn werkzaamheden loon
      ontvangt op grond van het bij of krachtens de wet bepaalde dan wel uit de overeenkomst anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel461
  - number: '462.1'
    text: |-
      Indien ter uitvoering van een behandelingsovereenkomst verrichtingen plaatsvinden in een ziekenhuis dat bij die
      overeenkomst geen partij is, is het ziekenhuis voor een tekortkoming daarbij mede aansprakelijk, als ware het zelf
      bij de overeenkomst partij.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel462
  - number: '462.2'
    text: |-
      Onder ziekenhuis als bedoeld in lid 1 worden verstaan een voor de toepassing van de [Ziekenfondswet][ref1] of
      de [Algemene Wet Bijzondere Ziektekosten][ref2] als ziekenhuis, verpleeginrichting of zwakzinnigeninrichting
      toegelaten of aangewezen instelling of afdeling daarvan, een academisch ziekenhuis alsmede een abortuskliniek in de
      zin van de [Wet afbreking zwangerschap][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0003396
  - number: '463'
    text: |-
      De aansprakelijkheid van een hulpverlener of, in het geval bedoeld in [artikel 462][ref1], van het ziekenhuis, kan
      niet worden beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel462
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '462'
        afdeling: '5'
  - number: '464.1'
    text: |-
      Indien in de uitoefening van een geneeskundig beroep of bedrijf anders dan krachtens een behandelingsovereenkomst
      handelingen op het gebied van de geneeskunst worden verricht, zijn deze afdeling alsmede de [artikelen 404][ref1],
      [405 lid 2][ref2] en [406 van afdeling 1 van deze titel][ref3] van overeenkomstige toepassing voor zover de aard
      van de rechtsbetrekking zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel405
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '404'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '405'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '464.2'
    text: |-
      Betreft het handelingen als omschreven in [artikel 446 lid 5][ref1], dan:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel446
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '446'
        afdeling: '5'
  - number: 464.2.a
    text: |-
      worden de in [artikel 454][ref1] bedoelde bescheiden slechts bewaard zolang dat noodzakelijk is in verband met het
      doel van het onderzoek, tenzij het bepaalde bij of krachtens de wet zich tegen vernietiging verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: 464.2.b
    text: |-
      wordt de persoon op wie het onderzoek betrekking heeft in de gelegenheid gesteld mee te delen of hij de uitslag en
      de gevolgtrekking van het onderzoek wenst te vernemen en, zo ja, of hij daarvan als eerste wenst kennis te nemen
      teneinde te kunnen beslissen of daarvan mededeling aan anderen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel464
  - number: '465.1'
    text: |-
      De verplichtingen die voor de hulpverlener uit deze afdeling jegens de patiënt voortvloeien worden, indien de
      patiënt de leeftijd van twaalf jaren nog niet heeft bereikt, door de hulpverlener nagekomen jegens de ouders die
      het gezag over de patiënt uitoefenen dan wel jegens zijn voogd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '465.2'
    text: |-
      Hetzelfde geldt indien de patiënt de leeftijd van twaalf jaren heeft bereikt, maar niet in staat kan worden geacht
      tot een redelijke waardering van zijn belangen ter zake, tenzij zodanige patiënt meerderjarig is en onder curatele
      staat of ten behoeve van hem het mentorschap is ingesteld, in welke gevallen nakoming jegens de curator of de
      mentor geschiedt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '465.3'
    text: |-
      Indien een meerderjarige patiënt die niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake, niet onder curatele staat of ten behoeve van hem niet het mentorschap is ingesteld, worden de
      verplichtingen die voor de hulpverlener uit deze afdeling jegens de patiënt voortvloeien, door de hulpverlener
      nagekomen jegens de persoon die daartoe door de patiënt schriftelijk is gemachtigd in zijn plaats op te treden.
      Ontbreekt zodanige persoon, of treedt deze niet op, dan worden de verplichtingen nagekomen jegens de echtgenoot,
      de geregistreerde partner of andere levensgezel van de patiënt, tenzij deze persoon dat niet wenst, dan wel, indien
      ook zodanige persoon ontbreekt, jegens een ouder, kind, broer of zus van de patiënt, tenzij deze persoon dat niet
      wenst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '465.4'
    text: |-
      De hulpverlener komt zijn verplichtingen na jegens de in de leden 1 en 2 bedoelde wettelijke vertegenwoordigers
      van de patiënt en de in lid 3 bedoelde personen, tenzij die nakoming niet verenigbaar is met de zorg van een goed
      hulpverlener.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '465.5'
    text: |-
      De persoon jegens wie de hulpverlener krachtens de leden 2 of 3 gehouden is de uit deze afdeling jegens de patiënt
      voortvloeiende verplichtingen na te komen, betracht de zorg van een goed vertegenwoordiger. Deze persoon is
      gehouden de patiënt zoveel mogelijk bij de vervulling van zijn taak te betrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '465.6'
    text: |-
      Verzet de patiënt zich tegen een verrichting van ingrijpende aard waarvoor een persoon als bedoeld in de leden
      2 of 3 toestemming heeft gegeven, dan kan de verrichting slechts worden uitgevoerd indien zij kennelijk nodig is
      teneinde ernstig nadeel voor de patiënt te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel465
  - number: '466.1'
    text: |-
      Is op grond van [artikel 465][ref1] voor het uitvoeren van een verrichting uitsluitend de toestemming van een daar
      bedoelde persoon in plaats van die van de patiënt vereist, dan kan tot de verrichting zonder die toestemming worden
      overgegaan indien de tijd voor het vragen van die toestemming ontbreekt aangezien onverwijlde uitvoering van de
      verrichting kennelijk nodig is teneinde ernstig nadeel voor de patiënt te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel466
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '466.2'
    text: |-
      Een volgens de [artikelen 450][ref1] en [465][ref2] vereiste toestemming mag worden verondersteld te zijn gegeven,
      indien de desbetreffende verrichting niet van ingrijpende aard is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel466
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '467.1'
    text: |-
      Van het lichaam afgescheiden anonieme stoffen en delen kunnen worden gebruikt voor medisch statistisch of ander
      medisch wetenschappelijk onderzoek voor zover de patiënt van wie het lichaamsmateriaal afkomstig is, geen bezwaar
      heeft gemaakt tegen zodanig onderzoek en het onderzoek met de vereiste zorgvuldigheid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel467
  - number: '467.2'
    text: |-
      Onder onderzoek met van het lichaam afgescheiden anonieme stoffen en delen wordt verstaan onderzoek waarbij is
      gewaarborgd dat het bij het onderzoek te gebruiken lichaamsmateriaal en de daaruit te verkrijgen gegevens niet tot
      de persoon herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel467
  - number: '468'
    text: |-
      Van de bepalingen van deze afdeling en van de [artikelen 404][ref1], [405 lid 2][ref2] en
      [406 van afdeling 1 van deze titel][ref3] kan niet ten nadele van de patiënt worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel405
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel468
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '404'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '405'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '500.1'
    text: 'In deze titel en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.a
    text: |-
      reisorganisator: degene die, in de uitoefening van zijn bedrijf, op eigen naam aan het publiek of aan een groep
      personen van te voren georganiseerde reizen aanbiedt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.b
    text: |-
      reisovereenkomst: de overeenkomst waarbij een reisorganisator zich jegens zijn wederpartij verbindt tot het
      verschaffen van een door hem aangeboden van te voren georganiseerde reis die een overnachting of een periode van
      meer dan 24 uren omvat alsmede ten minste twee van de volgende diensten:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.b.1°
    text: vervoer,
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.b.2°
    text: verblijf,
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.b.3°
    text: |-
      een andere niet met vervoer of verblijf verband houdende, toeristische dienst die een significant deel van de reis
      uitmaakt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.c
    text: 'reiziger:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.c.1°
    text: de wederpartij van de reisorganisator,
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.c.2°
    text: degene te wiens behoeve de reis is bedongen en die dat beding heeft aanvaard, of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: 500.1.c.3°
    text: |-
      degene aan wie overeenkomstig [artikel 506][ref1] de rechtsverhouding tot de reisorganisator is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel506
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '506'
  - number: '500.2'
    text: |-
      Degene die in de uitoefening van zijn bedrijf als tussenpersoon optreedt van een niet in Nederland gevestigde
      reisorganisator, wordt jegens zijn wederpartij als reisorganisator aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel500
  - number: '501.1'
    text: |-
      Indien de reisorganisator een algemeen verkrijgbare prospectus of andere publikatie uitgeeft, vermeldt hij daarin
      de reissom en de andere bij algemene maatregel van bestuur bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel501
  - number: '501.2'
    text: |-
      Vóór het sluiten van de reisovereenkomst deelt de reisorganisator de wederpartij schriftelijk of op andere
      begrijpelijke en toegankelijke wijze de in het eerste lid bedoelde gegevens mee, voor zover die gegevens aan de
      wederpartij nog niet bekend zijn door verstrekking van de algemeen verkrijgbare prospectus of andere publikatie.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel501
  - number: '501.3'
    text: |-
      Het tweede lid is niet van toepassing indien de reisovereenkomst minder dan 72 uren voor de aanvang van de reis
      wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel501
  - number: '502.1'
    text: |-
      De reisorganisator verschaft de wederpartij na het sluiten van de overeenkomst onverwijld een afschrift van de
      voorwaarden, voor zover deze niet reeds in de overgelegde bescheiden besloten liggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel502
  - number: '502.2'
    text: |-
      Vóór de aanvang van de reis deelt de reisorganisator de wederpartij of degene aan wie overeenkomstig
      [artikel 506][ref1] de rechtsverhouding tot de reisorganisator is overgedragen schriftelijk of op andere
      begrijpelijke en toegankelijke wijze de bij algemene maatregel van bestuur bepaalde gegevens mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel506
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel502
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '506'
  - number: '503.1'
    text: De reiziger kan de reisovereenkomst te allen tijde met onmiddellijke ingang opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel503
  - number: '503.2'
    text: |-
      Indien de reiziger opzegt wegens een aan hem toe te rekenen omstandigheid, vergoedt de reiziger de reisorganisator
      de schade die deze tengevolge van de opzegging lijdt. De schadevergoeding bedraagt ten hoogste eenmaal de reissom.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel503
  - number: '503.3'
    text: |-
      Indien de reiziger opzegt wegens een niet aan hem toe te rekenen omstandigheid, heeft hij recht op teruggave of
      kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten, een evenredig deel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel503
  - number: '504.1'
    text: |-
      Onverminderd [artikel 505, vierde lid][ref1], kan de reisorganisator de reisovereenkomst slechts opzeggen wegens
      gewichtige, de reiziger onverwijld meegedeelde omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel505
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel504
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '505'
  - number: '504.2'
    text: |-
      Indien de reisorganisator opzegt wegens een niet aan de reiziger toe te rekenen omstandigheid, biedt hij deze een
      andere reis van gelijke of betere kwaliteit aan. Onverminderd het derde lid heeft de reiziger die dat aanbod niet
      aanvaardt, recht op teruggave of kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten, een
      evenredig deel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel504
  - number: '504.3'
    text: |-
      In geval van opzegging vergoedt de reisorganisator de reiziger de door deze geleden vermogensschade en een bedrag
      voor het derven van reisgenot, tenzij
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel504
  - number: 504.3.a
    text: |-
      hij de overeenkomst opzegt omdat het aantal aanmeldingen kleiner is dan het vereiste minimumaantal en de reiziger
      binnen de in de overeenkomst aangegeven termijn schriftelijk van de opzegging in kennis is gesteld, of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel504
  - number: 504.3.b
    text: |-
      de opzegging het gevolg is van overmacht, waaronder overboeken niet is begrepen. Onder overmacht worden in deze
      titel verstaan abnormale en onvoorzienbare omstandigheden die onafhankelijk zijn van de wil van degene die zich
      erop beroept en waarvan de gevolgen ondanks alle voorzorgsmaatregelen niet konden worden vermeden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel504
  - number: '505.1'
    text: |-
      De reisorganisator kan bedingen dat hij de reisovereenkomst op een wezenlijk punt mag wijzigen wegens gewichtige,
      de reiziger onverwijld medegedeelde omstandigheden. De reiziger kan de wijziging afwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel505
  - number: '505.2'
    text: |-
      Behoudens lid 1 kan de reisorganisator bedingen dat hij de reisovereenkomst mag wijzigen wegens gewichtige, de
      reiziger onverwijld meegedeelde omstandigheden. De reiziger kan de wijziging slechts afwijzen indien zij hem tot
      nadeel van meer dan geringe betekenis strekt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel505
  - number: '505.3'
    text: |-
      De reisorganisator kan bedingen dat hij tot twintig dagen voor de aanvang van de reis de reissom mag verhogen in
      verband met wijzigingen in de vervoerkosten met inbegrip van brandstofkosten, de verschuldigde heffingen of de
      toepasselijke wisselkoersen. Bij toepassing van dit beding geeft de reisorganisator aan op welke wijze de verhoging
      is berekend. De reiziger kan de verhoging afwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel505
  - number: '505.4'
    text: |-
      Na een afwijzing als in de voorgaande leden bedoeld, kan de reisorganisator de reisovereenkomst opzeggen. De
      reiziger heeft recht op teruggave of kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten,
      een evenredig deel daarvan. Indien de reisorganisator opzegt na een afwijzing door de reiziger als bedoeld in de
      leden 1 en 2 is bovendien [artikel 504, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel505
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
  - number: '506.1'
    text: |-
      Tijdig voor de aanvang van de reis kan de reiziger zijn rechtsverhouding tot de reisorganisator overdragen aan een
      derde die aan alle voorwaarden van de reisovereenkomst voldoet. Een termijn van zeven dagen voor de aanvang van de
      reis wordt geacht in ieder geval tijdig te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel506
  - number: '506.2'
    text: |-
      De overdracht vindt plaats door een daarop gerichte overeenkomst met de derde en schriftelijke mededeling daarvan
      door de overdragende reiziger aan de reisorganisator. De overdragende reiziger en de derde zijn hoofdelijk
      verbonden tot betaling van de reissom en de kosten in verband met de overdracht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel506
  - number: '507.1'
    text: |-
      De reisorganisator is verplicht tot uitvoering van de reisovereenkomst overeenkomstig de verwachtingen die de
      reiziger op grond van de reisovereenkomst redelijkerwijs mocht hebben.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
  - number: '507.2'
    text: |-
      Indien de reis niet verloopt overeenkomstig de verwachtingen die de reiziger op grond van de reisovereenkomst
      redelijkerwijs mocht hebben, is de reisorganisator verplicht de schade te vergoeden, tenzij de tekortkoming
      in de nakoming niet aan hem is toe te rekenen noch aan de persoon van wiens hulp hij bij de uitvoering van de
      overeenkomst gebruik maakt, omdat:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
  - number: 507.2.a
    text: de tekortkoming in de uitvoering van de reisovereenkomst is toe te rekenen aan de reiziger;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
  - number: 507.2.b
    text: |-
      de tekortkoming in de uitvoering van de reisovereenkomst die niet te voorzien was of kon worden opgeheven, is toe
      te rekenen aan een derde die niet bij de levering van de in de reis begrepen diensten is betrokken; of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
  - number: 507.2.c
    text: |-
      de tekortkoming in de uitvoering van de overeenkomst is te wijten aan overmacht als bedoeld in
      [artikel 504 lid 3 onder ][ref1] dan wel aan een gebeurtenis die de organisator of degene van wiens hulp hij bij
      de uitvoering van de reisovereenkomst gebruik maakt, met inachtneming van alle mogelijke zorgvuldigheid niet kon
      voorzien of verhelpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
  - number: '507.3'
    text: |-
      De reisorganisator is naar gelang van de omstandigheden verplicht de reiziger hulp en bijstand te verlenen, indien
      de reis niet verloopt overeenkomstig de verwachtingen die deze op grond van de reisovereenkomst redelijkerwijs
      mocht hebben. Indien de oorzaak daarvan aan de reiziger moet worden toegerekend, is de reisorganisator tot
      verlening van hulp en bijstand slechts verplicht voor zover dat redelijkerwijs van hem gevergd kan worden. De
      kosten voor de verleende hulp en bijstand komen in dat geval voor rekening van de reiziger. De kosten voor de
      verleende hulp en bijstand komen voor rekening van de reisorganisator, indien de tekortkoming in de nakoming aan
      hem of aan de persoon van wiens hulp hij bij de uitvoering van de overeenkomst gebruik maakt, overeenkomstig het
      tweede lid is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel507
  - number: '508.1'
    text: |-
      Tenzij het tweede lid van dit artikel van toepassing is, kan de reisorganisator zijn aansprakelijkheid voor schade,
      veroorzaakt door dood of letsel van de reiziger, niet uitsluiten of beperken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel508
  - number: '508.2'
    text: |-
      Indien op een in de reisovereenkomst begrepen dienst een verdrag van toepassing is, kan de reisorganisator zich
      beroepen op een uitsluiting of beperking van aansprakelijkheid die dat verdrag aan een dienstverlener als zodanig
      toekent of toestaat.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel508
  - number: '509.1'
    text: |-
      De reisorganisator kan zijn aansprakelijkheid voor schade die uit zijn eigen handelen of nalaten ontstaat niet
      beperken of uitsluiten, indien dat handelen of nalaten geschiedt met het opzet de schade te veroorzaken of het
      handelen of nalaten roekeloos geschiedt en met de wetenschap dat de schade daaruit waarschijnlijk zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel509
  - number: '509.2'
    text: |-
      Voor zover de reisorganisator niet zelf de in de reisovereenkomst begrepen diensten verleent, kan hij zijn
      aansprakelijkheid voor andere dan de in [artikel 508][ref1] bedoelde schade beperken tot driemaal de reissom.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel508
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel509
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '508'
  - number: '510'
    text: |-
      Een tekortkoming in de nakoming van een verbintenis die hem kan worden toegerekend, verplicht de reisorganisator
      mede tot vergoeding van ander nadeel dan vermogensschade, voor zover door die tekortkoming derving van reisgenot
      is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel510
  - number: '511'
    text: |-
      De vergoeding voor derving van reisgenot als bedoeld in de [artikelen 504, derde lid][ref1], en [510][ref2]
      bedraagt ten hoogste eenmaal de reissom.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel510
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel511
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '510'
  - number: '512.1'
    text: |-
      De reisorganisator neemt de maatregelen die nodig zijn om te verzekeren dat, wanneer hij wegens financieel
      onvermogen zijn verplichtingen jegens de reiziger niet of niet verder kan nakomen, wordt zorggedragen hetzij voor
      overneming van zijn verplichtingen door een ander hetzij voor terugbetaling van de reissom of, indien de reis reeds
      ten dele is genoten, een evenredig deel daarvan. Indien de reiziger reeds op de plaats van bestemming is aangekomen
      dient, voor zover de reisovereenkomst dat vervoer omvat, in ieder geval te worden zorggedragen voor de terugreis.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel512
  - number: '512.2'
    text: |-
      De reisorganisator maakt de in het eerste lid bedoelde maatregelen openbaar door deze te vermelden in de algemeen
      verkrijgbare prospectus of andere publikatie, bedoeld in [artikel 501][ref1], of op andere begrijpelijke en
      toegankelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel501
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel512
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '501'
  - number: '513'
    text: Van het bij of krachtens deze titel bepaalde kan ten nadele van de reiziger niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel513
  - number: '600'
    text: |-
      Bewaarneming is de overeenkomst waarbij de ene partij, de bewaarnemer, zich tegenover de andere partij, de
      bewaargever, verbindt, een zaak die de bewaargever hem toevertrouwt of zal toevertrouwen, te bewaren en terug te
      geven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel600
  - number: '601.1'
    text: |-
      Indien de overeenkomst door de bewaarnemer in de uitoefening van zijn beroep of bedrijf is aangegaan, is de
      bewaargever hem loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel601
  - number: '601.2'
    text: |-
      Indien loon verschuldigd is, doch de hoogte niet door partijen is bepaald, is de bewaargever het op de
      gebruikelijke wijze berekende loon of, bij gebreke daarvan, een redelijk loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel601
  - number: '601.3'
    text: |-
      De bewaargever moet aan de bewaarnemer de aan de bewaring verbonden onkosten vergoeden, voor zover deze niet in het
      loon zijn begrepen, alsook de schade die de bewaarnemer als gevolg van de bewaring heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel601
  - number: '602'
    text: De bewaarnemer moet bij de bewaring de zorg van een goed bewaarder in acht nemen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel602
  - number: '603.1'
    text: |-
      De bewaarnemer mag de zaak slechts gebruiken voor zover de bewaargever daarvoor toestemming heeft gegeven, of het
      gebruik nodig is om de zaak in goede staat te houden of te brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel603
  - number: '603.2'
    text: |-
      Zonder toestemming van de bewaargever mag de bewaarnemer de zaak niet aan een derde in bewaring geven, tenzij dit
      in het belang van de bewaargever noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel603
  - number: '603.3'
    text: |-
      Voor gedragingen van een onderbewaarnemer met betrekking tot de zaak is de bewaarnemer op gelijke wijze
      aansprakelijk als voor eigen gedragingen, tenzij de bewaarneming niet tegen bewaarloon geschiedt en de bewaarnemer
      tot het in onderbewaring geven genoodzaakt was ten gevolge van hem niet toe te rekenen omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel603
  - number: '604'
    text: |-
      De vruchten die de zaak in het tijdvak tussen de ontvangst en de teruggave oplevert, moeten door de bewaarnemer aan
      de bewaargever worden afgedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel604
  - number: '605.1'
    text: De bewaargever kan onverwijlde teruggave en de bewaarnemer onverwijlde terugneming van de zaak vorderen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel605
  - number: '605.2'
    text: |-
      Wegens gewichtige redenen kan de kantonrechter binnen wiens rechtsgebied de zaak zich bevindt, op verzoek van een
      van de partijen een van het vorige lid of van de overeenkomst afwijkend tijdstip voor de teruggave of terugneming
      bepalen. Dit lid is niet van toepassing in geval van gerechtelijke bewaring.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel605
  - number: '605.3'
    text: |-
      De teruggave moet geschieden op de plaats waar de zaak volgens de overeenkomst moet worden bewaard, tenzij bij de
      overeenkomst een andere plaats voor de teruggave is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel605
  - number: '605.4'
    text: De bewaarnemer is gehouden de zaak terug te geven in de staat waarin hij haar heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel605
  - number: '606'
    text: |-
      Indien twee of meer personen te zamen een zaak in bewaring hebben genomen, zijn zij hoofdelijk verbonden tot
      teruggave daarvan en tot vergoeding van de schade die het gevolg is van een tekortschieten in de nakoming van die
      verplichting, tenzij de tekortkoming aan geen van hen kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel606
  - number: '607.1'
    text: |-
      Indien ter zake van een bewaarneming een ceel of een ander stuk aan toonder of order is afgegeven, geldt levering
      daarvan vóór de aflevering van de daarin aangeduide zaken als levering van die zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel607
  - number: '607.2'
    text: Het eerste lid is niet van toepassing op registergoederen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel607
  - number: '608.1'
    text: |-
      Indien een onderbewaarnemer door een bewaargever buiten overeenkomst voor met betrekking tot de zaak geleden
      schade wordt aangesproken, is hij jegens deze niet verder aansprakelijk dan hij zou zijn als wederpartij bij de
      overeenkomst, waarbij de bewaargever de zaak in bewaring gegeven heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel608
  - number: '608.2'
    text: |-
      Indien een bewaarnemer buiten overeenkomst voor met betrekking tot de zaak geleden schade wordt aangesproken door
      een derde die geen bewaargever is, is hij niet verder aansprakelijk dan hij als wederpartij van de bewaargever uit
      de met deze gesloten overeenkomst zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel608
  - number: '608.3'
    text: |-
      Indien een onderbewaarnemer door een zodanige derde wordt aangesproken, is hij niet verder aansprakelijk dan hij
      als bewaarnemer op grond van het vorige lid zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel608
  - number: '608.4'
    text: |-
      De vorige leden kunnen niet worden ingeroepen door een bewaarnemer of onderbewaarnemer die bij het sluiten van
      de overeenkomst uit hoofde waarvan hij de zaak ontving, wist of had behoren te weten dat zijn wederpartij jegens
      degene door wie hij werd aangesproken, niet bevoegd was de zaak aan hem in bewaring te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel608
  - number: '609.1'
    text: |-
      De hotelhouder is als een bewaarnemer aansprakelijk voor beschadiging of verlies van zaken, die in het hotel zijn
      meegebracht door een gast die daar zijn intrek heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel609
  - number: '609.2'
    text: |-
      Hij is niet aansprakelijk voor gedragingen van personen die de gast zelf in het hotel heeft meegebracht of
      uitgenodigd, en voor schade door zaken die de gast zelf heeft meegebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel609
  - number: '609.3'
    text: |-
      Hij heeft op de in lid 1 bedoelde zaken een retentierecht voor al hetgeen hij van de gast te vorderen heeft ter
      zake van logies, kost, consumpties en als hotelhouder verrichte diensten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel609
  - number: '610.1'
    text: |-
      De arbeidsovereenkomst is de overeenkomst waarbij de ene partij, de werknemer, zich verbindt in dienst van de
      andere partij, de werkgever, tegen loon gedurende zekere tijd arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel610
  - number: '610.2'
    text: |-
      Indien een overeenkomst zowel aan de omschrijving van lid 1 voldoet als aan die van een andere door de wet
      geregelde bijzondere soort van overeenkomst, zijn de bepalingen van deze titel en de voor de andere soort van
      overeenkomst gegeven bepalingen naast elkaar van toepassing. In geval van strijd zijn de bepalingen van deze titel
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel610
  - number: 610a
    text: |-
      Hij die ten behoeve van een ander tegen beloning door die ander gedurende drie opeenvolgende maanden, wekelijks dan
      wel gedurende ten minste twintig uren per maand arbeid verricht, wordt vermoed deze arbeid te verrichten krachtens
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel610a
  - number: 610b
    text: |-
      Indien een arbeidsovereenkomst ten minste drie maanden heeft geduurd, wordt de bedongen arbeid in enige maand
      vermoed een omvang te hebben gelijk aan de gemiddelde omvang van de arbeid per maand in de drie voorafgaande
      maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel610b
  - number: '611'
    text: De werkgever en de werknemer zijn verplicht zich als een goed werkgever en een goed werknemer te gedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel611
  - number: '612.1'
    text: |-
      Een minderjarige die de leeftijd van zestien jaren heeft bereikt, is bekwaam tot het aangaan van een
      arbeidsovereenkomst. Hij staat in alles wat betrekking heeft op die arbeidsovereenkomst met een meerderjarige
      gelijk, en kan zonder bijstand van zijn wettelijke vertegenwoordiger in rechte verschijnen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel612
  - number: '612.2'
    text: |-
      Indien een daartoe onbekwame minderjarige een arbeidsovereenkomst heeft aangegaan en vervolgens vier weken in
      dienst van de werkgever arbeid heeft verricht zonder dat zijn wettelijke vertegenwoordiger een beroep op de in de
      onbekwaamheid gelegen vernietigingsgrond heeft gedaan, wordt hij geacht de toestemming van die vertegenwoordiger
      tot het aangaan van deze arbeidsovereenkomst te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel612
  - number: '612.3'
    text: |-
      Een onbekwame minderjarige die met toestemming van de wettelijke vertegenwoordiger een arbeidsovereenkomst heeft
      aangegaan, staat in alles wat betrekking heeft op die arbeidsovereenkomst met een meerderjarige gelijk, behoudens
      het bepaalde in lid 4.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel612
  - number: '612.4'
    text: |-
      Een onbekwame minderjarige kan niet zonder bijstand van zijn wettelijke vertegenwoordiger in rechte verschijnen,
      behalve wanneer de rechter is gebleken dat de wettelijke vertegenwoordiger niet bij machte is zich te verklaren.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel612
  - number: '613'
    text: |-
      De werkgever kan slechts een beroep doen op een schriftelijk beding dat hem de bevoegdheid geeft een in de
      arbeidsovereenkomst voorkomende arbeidsvoorwaarde te wijzigen, indien hij bij de wijziging een zodanig zwaarwichtig
      belang heeft dat het belang van de werknemer dat door de wijziging zou worden geschaad, daarvoor naar maatstaven
      van redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel613
  - number: '614'
    text: |-
      De termijn, bedoeld in [artikel 52 lid 1 onder d van Boek 3][ref1], begint met betrekking tot uit deze titel
      voortvloeiende vernietigingsgronden met de aanvang van de dag volgende op die waarop een beroep op het beding is
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel614
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '615'
    text: |-
      De bepalingen van deze titel zijn niet van toepassing ten aanzien van personen in dienst van staat, provincie,
      gemeente, waterschap of enig ander publiekrechtelijk lichaam, tenzij zij, hetzij vóór of bij de aanvang van de
      dienstbetrekking door of namens partijen, hetzij bij wet of verordening, van toepassing zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel615
  - number: '616'
    text: De werkgever is verplicht de werknemer zijn loon op de bepaalde tijd te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel616
  - number: '617.1'
    text: 'De vastgestelde vorm van loon mag niet anders zijn dan:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: 617.1.a
    text: geld;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: 617.1.b
    text: |-
      indien die vorm van loon gewoonte is of wenselijk is wegens de aard van de onderneming van de werkgever: zaken,
      geschikt voor het persoonlijk gebruik van de werknemer en zijn huisgenoten, met uitzondering van alcoholhoudende
      drank en andere voor de gezondheid schadelijke genotmiddelen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: 617.1.c
    text: het gebruik van een woning, alsmede verlichting en verwarming daarvan;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: 617.1.d
    text: |-
      diensten, voorzieningen en werkzaamheden door of voor rekening van de werkgever te verrichten, onderricht, kost en
      inwoning daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: 617.1.e
    text: effecten, vorderingen, andere aanspraken en bewijsstukken daarvan en bonnen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: '617.2'
    text: |-
      Aan de in lid 1 onder b, c en d bedoelde zaken, diensten en voorzieningen mag geen hogere waarde worden toegekend
      dan die welke met de werkelijke waarde daarvan overeenkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel617
  - number: '618'
    text: |-
      Indien geen loon is vastgesteld, heeft de werknemer aanspraak op het loon dat ten tijde van het sluiten van de
      overeenkomst voor arbeid als de overeengekomene gebruikelijk was of, bij gebreke van een dergelijke maatstaf, op
      een loon dat met inachtneming van de omstandigheden van het geval naar billijkheid wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel618
  - number: '619.1'
    text: |-
      Indien het loon voor het geheel of voor een gedeelte bestaat in een bedrag dat afhankelijk is gesteld van enig
      gegeven dat uit de boeken, bescheiden of andere gegevensdragers van de werkgever moet kunnen blijken, heeft de
      werknemer het recht van de werkgever overlegging te verlangen van zodanige bewijsstukken, als hij nodig heeft om
      dat gegeven vast te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel619
  - number: '619.2'
    text: |-
      Partijen kunnen bij schriftelijke overeenkomst overeenkomen aan wie, in afwijking van lid 1, overlegging van
      genoemde bewijsstukken zal geschieden. Als zodanig kunnen niet worden aangewezen werknemers die in dienst van de
      werkgever met de boekhouding zijn belast.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel619
  - number: '619.3'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van lid 1 of lid 2,
      tweede zin, een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel619
  - number: '619.4'
    text: |-
      De overlegging van de bewijsstukken door of vanwege de werkgever geschiedt desverlangd onder de uitdrukkelijke
      verplichting tot geheimhouding door de werknemer en degene die hem overeenkomstig lid 2 vervangt; deze kan echter
      nimmer tot geheimhouding tegenover de werknemer worden verplicht, behoudens voor zover het betreft de winst in de
      onderneming van de werkgever of in een deel daarvan gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel619
  - number: '620.1'
    text: |-
      De voldoening van het in geld vastgestelde loon geschiedt in Nederlands wettig betaalmiddel of door girale betaling
      overeenkomstig [artikel 114 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel114
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel620
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '114'
  - number: '620.2'
    text: |-
      De voldoening van het in geld vastgestelde loon kan in buitenlands geld geschieden, indien dit overeengekomen
      is. De werknemer is echter bevoegd voldoening in Nederlands geld te verlangen met ingang van de tweede komende
      betaaldag. Indien omrekening nodig is, geschiedt deze naar de koers, bedoeld in de [artikelen 124][ref1] en
      [126 van Boek 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel126
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel620
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '126'
  - number: '620.3'
    text: |-
      De voldoening van het in andere bestanddelen dan in geld vastgestelde loon geschiedt volgens hetgeen daarover is
      overeengekomen of, als daarover niets is overeengekomen, volgens het gebruik.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel620
  - number: '621.1'
    text: |-
      Voldoening van het loon, anders dan bij [artikel 620][ref1] is bepaald of, in andere vormen is vastgesteld dan door
      [artikel 617][ref2] is toegestaan, is niet bevrijdend. De werknemer behoudt het recht om het verschuldigde loon
      of, zo dit in een andere vorm dan geld is vastgesteld, de waarde van de verschuldigde prestatie van de werkgever te
      vorderen zonder gehouden te zijn het bij de niet-bevrijdende voldoening ontvangene terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel620
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel617
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel621
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '620'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '617'
        afdeling: '2'
  - number: '621.2'
    text: |-
      Niettemin kan de rechter bij toewijzing van de vordering van de werknemer de veroordeling beperken tot zodanig
      bedrag als hem met het oog op de omstandigheden billijk zal voorkomen, maar uiterlijk tot de som waarop de door de
      werknemer geleden schade zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel621
  - number: '621.3'
    text: |-
      Een rechtsvordering van de werknemer op grond van dit artikel verjaart door verloop van zes maanden na de dag
      waarop de niet-bevrijdende voldoening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel621
  - number: '622'
    text: |-
      De voldoening van in geld vastgesteld loon die niet met toepassing van [artikel 114 van Boek 6][ref1] plaatsvindt,
      geschiedt hetzij ter plaatse waar de arbeid in de regel wordt verricht, hetzij ten kantore van de werkgever indien
      dit gelegen is in dezelfde gemeente als die waarin de meerderheid van de werknemers woont, hetzij aan de woning van
      de werknemer, ter keuze van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel114
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel622
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '114'
  - number: '623.1'
    text: |-
      De werkgever is verplicht het in geld naar tijdruimte vastgestelde loon te voldoen telkens na afloop van het
      tijdvak waarover het loon op grond van de overeenkomst moet worden berekend, met dien verstande dat het tijdvak
      voor voldoening niet korter is dan één week en niet langer is dan één maand.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel623
  - number: '623.2'
    text: |-
      Het tijdvak na afloop waarvan het loon moet worden voldaan, kan bij schriftelijke overeenkomst worden verlengd,
      maar niet langer dan tot een maand wanneer het tijdvak waarover het loon op grond van de overeenkomst moet worden
      berekend, een week of korter is, en tot niet langer dan tot een kwartaal wanneer het tijdvak waarover het loon op
      grond van de overeenkomst moet worden berekend, een maand of langer is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel623
  - number: '623.3'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van dit artikel,
      een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel623
  - number: '624.1'
    text: |-
      Indien het in geld vastgestelde loon afhankelijk is van de uitkomsten van de te verrichten arbeid, houdt de
      werkgever de betalingstermijnen aan die gelden voor het naar tijdruimte vastgestelde loon voor vergelijkbare
      arbeid, tenzij met inachtneming van [artikel 623][ref1] andere termijnen zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel623
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '623'
        afdeling: '2'
  - number: '624.2'
    text: |-
      Indien op de betaaldag het bedrag van het loon als genoemd in lid 1 nog niet te bepalen is, is de werkgever
      verplicht tot voldoening van een voorschot ten bedrage van het loon waarop de werknemer gemiddeld per
      betalingstermijn aanspraak kon maken over de drie maanden voorafgaande aan de betaaldag of, indien dat niet
      mogelijk is, ten bedrage van het voor vergelijkbare arbeid gebruikelijke loon.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel624
  - number: '624.3'
    text: |-
      Schriftelijk kan worden overeengekomen dat het voorschot op een lager bedrag wordt gesteld, maar niet op minder dan
      drie vierde van het gemiddelde loon over drie maanden voorafgaande aan de betaaldag onderscheidenlijk van het voor
      vergelijkbare arbeid gebruikelijke loon.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel624
  - number: '624.4'
    text: |-
      Voor zover het in geld vastgestelde loon bestaat in een bedrag dat afhankelijk is gesteld van enig gegeven dat
      uit de boeken, bescheiden of andere gegevensdragers van de werkgever moet kunnen blijken, is de werkgever tot
      voldoening verplicht telkens wanneer het bedrag van dat loon kan worden bepaald, met dien verstande dat ten minste
      eenmaal per jaar voldoening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel624
  - number: '624.5'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van dit artikel,
      een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel624
  - number: '625.1'
    text: |-
      Voor zover het in geld vastgesteld loon of het gedeelte dat overblijft na aftrek van hetgeen door de werkgever
      overeenkomstig [artikel 628][ref1] mag worden verrekend, en na aftrek van hetgeen waarop derden overeenkomstig
      [artikel 633][ref2] rechten doen gelden, niet wordt voldaan uiterlijk de derde werkdag na die waarop ingevolge
      de [artikelen 623][ref3] en [624 lid 1][ref4] de voldoening had moeten geschieden, heeft de werknemer, indien
      dit niet-voldoen aan de werkgever is toe te rekenen, aanspraak op een verhoging wegens vertraging. Deze verhoging
      bedraagt voor de vierde tot en met de achtste werkdag vijf procent per dag en voor elke volgende werkdag een
      procent, met dien verstande dat de verhoging in geen geval de helft van het verschuldigde te boven zal gaan.
      Niettemin kan de rechter de verhoging beperken tot zodanig bedrag als hem met het oog op de omstandigheden billijk
      zal voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel633
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel623
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel624
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel625
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '633'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '623'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '624'
        afdeling: '2'
  - number: '625.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel625
  - number: '626.1'
    text: |-
      De werkgever is verplicht bij elke voldoening van het in geld vastgestelde loon de werknemer een schriftelijke
      opgave te verstrekken van het loonbedrag, van de bedragen waaruit dit is samengesteld, van de bedragen die
      op het loonbedrag zijn ingehouden, alsmede van het bedrag van het loon waarop een persoon van de leeftijd
      van de werknemer over de termijn waarover het loon is berekend ingevolge het bepaalde bij of krachtens de
      [Wet minimumloon en minimumvakantiebijslag][ref1] aanspraak heeft, tenzij zich ten opzichte van de vorige
      voldoening in geen van deze bedragen een wijziging heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel626
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '626.2'
    text: |-
      De opgave vermeldt voorts de naam van de werkgever en van de werknemer, de termijn waarover het loon is berekend,
      alsmede de overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel626
  - number: '626.3'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel626
  - number: '627'
    text: Geen loon is verschuldigd voor de tijd gedurende welke de werknemer de bedongen arbeid niet heeft verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel627
  - number: '628.1'
    text: |-
      De werknemer behoudt het recht op het naar tijdruimte vastgestelde loon indien hij de overeengekomen arbeid niet
      heeft verricht door een oorzaak die in redelijkheid voor rekening van de werkgever behoort te komen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: '628.2'
    text: |-
      Indien hem krachtens enige wettelijk voorgeschreven verzekering of krachtens enige verzekering of uit enig fonds
      waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst, een geldelijke uitkering
      toekomt, wordt het loon verminderd met het bedrag van die uitkering.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: '628.3'
    text: |-
      Indien het loon in geld op andere wijze dan naar tijdruimte is vastgesteld, zijn de bepalingen van dit artikel van
      toepassing, met dien verstande dat als loon wordt beschouwd het gemiddelde loon dat de werknemer, wanneer hij niet
      verhinderd was geweest, gedurende die tijd had kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: '628.4'
    text: |-
      Het loon wordt echter verminderd met het bedrag van de onkosten die de werknemer zich door het niet-verrichten van
      de arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: '628.5'
    text: |-
      Van de leden 1 tot en met 4 kan voor de eerste zes maanden van de arbeidsovereenkomst slechts bij schriftelijke
      overeenkomst worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: '628.6'
    text: |-
      In geval van elkaar opvolgende arbeidsovereenkomsten in de zin van [artikel 668a][ref1] kan een afwijking als
      bedoeld in lid 5 in totaal voor ten hoogste zes maanden worden overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
        afdeling: '9'
  - number: '628.7'
    text: |-
      Na het verstrijken van de termijn, bedoeld in lid 5, kan van dit artikel slechts bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele
      van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628
  - number: 628a.1
    text: |-
      Indien een arbeidsomvang van minder dan 15 uur per week is overeengekomen en de tijdstippen waarop de arbeid moet
      worden verricht niet zijn vastgelegd, dan wel indien de omvang van de arbeid niet of niet eenduidig is vastgelegd,
      heeft de werknemer voor iedere periode van minder dan drie uur waarin hij arbeid heeft verricht, recht op het loon
      waarop hij aanspraak zou hebben indien hij drie uur arbeid zou hebben verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628a
  - number: 628a.2
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel628a
  - number: '629.1'
    text: |-
      Voor zover het loon niet meer bedraagt dan het maximum dagloon, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref1], behoudt de werknemer voor een tijdvak
      van tweeënvijftig weken recht op 70% van het naar tijdruimte vastgestelde loon, maar ten minste op het voor
      hem geldende wettelijke minimumloon, indien hij de bedongen arbeid niet heeft verricht omdat hij in verband met
      ongeschiktheid ten gevolge van ziekte, zwangerschap of bevalling daartoe verhinderd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '629.2'
    text: |-
      Voor de werknemer die ten behoeve van zijn werkgever uitsluitend of nagenoeg uitsluitend huiselijke of persoonlijke
      diensten op minder dan drie dagen per week verricht, geldt het in lid 1 bedoelde recht voor een tijdvak van zes
      weken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: '629.3'
    text: 'De werknemer heeft het in lid 1 bedoelde recht niet:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: 629.3.a
    text: |-
      indien de ziekte door zijn opzet is veroorzaakt of het gevolg is van een gebrek waarover hij in het kader van een
      aanstellingskeuring valse informatie heeft verstrekt en daardoor de toetsing aan de voor de functie opgestelde
      belastbaarheidseisen niet juist kon worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: 629.3.b
    text: voor de tijd, gedurende welke door zijn toedoen zijn genezing wordt belemmerd of vertraagd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: 629.3.c
    text: |-
      voor de tijd, gedurende welke hij, hoewel hij daartoe in staat is, zonder deugdelijke grond
      passende arbeid als bedoeld in [artikel 658a lid 3][ref1] voor de werkgever of voor een door
      de werkgever met toestemming van het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] aangewezen derde, waartoe de
      werkgever hem in de gelegenheid stelt, niet verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 629.3.d
    text: |-
      voor de tijd, gedurende welke hij zonder deugdelijke grond weigert mee te werken aan door de werkgever of door een
      door hem aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen die erop gericht zijn om de
      werknemer in staat te stellen passende arbeid als bedoeld in [artikel 658a lid 3][ref1] te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 629.3.e
    text: |-
      voor de tijd, gedurende welke hij zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en
      bijstellen van een plan van aanpak als bedoeld in [artikel 658a lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: '629.4'
    text: |-
      In afwijking van lid 1 heeft de vrouwelijke werknemer het in dat lid bedoelde recht niet
      gedurende de periode dat zij zwangerschaps- of bevallingsverlof geniet overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '629.5'
    text: |-
      Het loon wordt verminderd met het bedrag van enige geldelijke uitkering die de werknemer toekomt krachtens enige
      wettelijke voorgeschreven verzekering of krachtens enige verzekering of uit enig fonds waarin de werknemer niet
      deelneemt. Het loon wordt voorts verminderd met het bedrag van de inkomsten, door de werknemer in of buiten
      dienstbetrekking genoten voor werkzaamheden die hij heeft verricht gedurende de tijd dat hij, zo hij daartoe niet
      verhinderd was geweest, de bedongen arbeid had kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: '629.6'
    text: |-
      De werkgever is bevoegd de betaling van het in het lid 1 bedoelde loon op te schorten voor de tijd, gedurende
      welke de werknemer zich niet houdt aan door de werkgever schriftelijk gegeven redelijke voorschriften omtrent het
      verstrekken van de inlichtingen die de werkgever behoeft om het recht op loon vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: '629.7'
    text: |-
      De werkgever kan geen beroep meer doen op enige grond het loon geheel of gedeeltelijk niet te betalen of de
      betaling daarvan op te schorten, indien hij de werknemer daarvan geen kennis heeft gegeven onverwijld nadat bij hem
      het vermoeden van het bestaan daarvan is gerezen of redelijkerwijs had behoren te rijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: '629.8'
    text: |-
      [Artikel 628 lid 3][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
        afdeling: '2'
  - number: '629.9'
    text: |-
      Van dit artikel kan ten nadele van de werknemer slechts in zoverre worden afgeweken dat bedongen kan worden dat de
      werknemer voor de eerste twee dagen van het in lid 1 of lid 2 bedoelde tijdvak geen recht op loon heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: '629.10'
    text: |-
      Voor de toepassing van de leden 1, 2 en 9 worden perioden, waarin de werknemer in verband met ongeschiktheid
      ten gevolge van ziekte, zwangerschap of bevalling verhinderd is geweest zijn arbeid te verrichten, samengeteld,
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen. Bij de vaststelling van de periode
      van vier weken blijven perioden, waarin zwangerschaps- of bevallingsverlof wordt genoten overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '629.11'
    text: 'Het tijdvak, bedoeld in lid 1, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: 629.11.a
    text: |-
      met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan in dat artikel is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 629.11.b
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], indien die wachttijd op grond
      van het zevende lid van dat artikel wordt verlengd;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 629.11.c
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '629.12'
    text: |-
      Ingeval van verlenging op grond van lid 11 kan het tijdvak, bedoeld in lid 1, niet meer dan honderdvier weken
      bedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629
  - number: 629a.1
    text: |-
      De rechter wijst een vordering tot betaling van loon als bedoeld in [artikel 629][ref1] af, indien bij de eis
      niet een verklaring is gevoegd van een deskundige, benoemd door het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], omtrent de verhindering
      van de werknemer om de bedongen of andere passende arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 629a.2
    text: |-
      Lid 1 geldt niet indien de verhindering niet wordt betwist of het overleggen van de verklaring in redelijkheid niet
      van de werknemer kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
  - number: 629a.3
    text: |-
      De deskundige, die zijn benoeming heeft aanvaard, is verplicht zijn onderzoek onpartijdig en naar beste weten te
      volbrengen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
  - number: 629a.4
    text: |-
      De deskundige die de hoedanigheid van arts bezit, kan de voor zijn onderzoek van belang zijnde inlichtingen over de
      werknemer inwinnen bij de behandelend arts of de behandelend artsen. Zij verstrekken de gevraagde inlichtingen voor
      zover daardoor de persoonlijke levenssfeer van de werknemer niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
  - number: 629a.5
    text: |-
      De rechter kan op verzoek van een der partijen of ambtshalve bevelen dat de deskundige zijn verklaring nader
      schriftelijk of mondeling toelicht of aanvult.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
  - number: 629a.6
    text: |-
      De werknemer wordt ter zake van een vordering als bedoeld in het eerste lid slechts in de kosten van de werkgever
      als bedoeld in [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] veroordeeld in geval van
      kennelijk onredelijk gebruik van procesrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
  - number: 629a.7
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan kan
      worden bepaald dat de in het eerste lid bedoelde deskundige door een ander dan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '630.1'
    text: |-
      De werkgever die tijdelijk is verhinderd het loon, voor zover dit in een andere vorm dan in geld is vastgesteld,
      te voldoen zonder dat deze verhindering het gevolg is van een eigen toedoen van de werknemer, is aan deze een
      vergoeding schuldig, waarvan het bedrag bij overeenkomst wordt vastgesteld of, bij gebreke van een overeenkomst,
      door de rechter wordt bepaald volgens het gebruik of de billijkheid.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel630
  - number: '630.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel630
  - number: '631.1'
    text: |-
      Een beding waarbij de werkgever het recht krijgt enig bedrag van het loon op de betaaldag in te houden, is nietig,
      onverminderd de bevoegdheid van de werknemer om de werkgever een schriftelijke volmacht te verlenen om uit het uit
      te betalen loon betalingen in zijn naam te verrichten. Deze volmacht is te allen tijde herroepelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.2'
    text: |-
      Bedingen waarbij de werknemer zich jegens de werkgever verbindt het ontvangen loon of zijn overige inkomsten of een
      gedeelte daarvan op bepaalde wijze te besteden, en bedingen waarbij de werknemer zich verbindt zijn benodigdheden
      op een bepaalde plaats of bij een bepaalde persoon aan te schaffen, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.3'
    text: 'De leden 1 en 2 zijn niet van toepassing op het beding waarbij de werknemer zich verbindt:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: 631.3.a
    text: |-
      deel te nemen in een fonds waarop de [Pensioen- en spaarfondsenwet][ref1] van toepassing is en ten aanzien waarvan
      aan de voorschriften van die wet wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 631.3.b
    text: |-
      bij te dragen tot de premiebetaling voor een verzekering overeenkomstig de voorschriften dienaangaande door de
      [Pensioen- en spaarfondsenwet][ref1] gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 631.3.c
    text: |-
      deel te nemen in enig ander fonds dan in onderdeel a bedoeld, mits dat fonds voldoet aan de voorwaarden, bij
      algemene maatregel van bestuur gesteld;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: 631.3.d
    text: |-
      deel te nemen aan een regeling tot sparen te zijnen behoeve, anders dan in de onderdelen *a* tot en met *c*
      bedoeld, mits die regeling voldoet aan de voorwaarden, bij algemene maatregel van bestuur gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.4'
    text: |-
      Voor de nakoming van een beding als bedoeld in lid 3 mag de werkgever de daartoe nodige bedragen op het loon van
      de werknemer inhouden; hij is alsdan verplicht deze bedragen overeenkomstig het beding ten behoeve van de werknemer
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.5'
    text: |-
      Op de deelneming door een minderjarige aan een regeling als bedoeld in lid 3 is [artikel 612][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel612
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '612'
        afdeling: '1'
  - number: '631.6'
    text: |-
      Indien de werknemer ingevolge een nietig beding als bedoeld in lid 2 een overeenkomst met de werkgever of een
      derde heeft aangegaan, heeft hij het recht hetgeen hij uit dien hoofde heeft voldaan van de werkgever te vorderen.
      Indien hij de overeenkomst met de werkgever heeft aangegaan, heeft hij bovendien de bevoegdheid de overeenkomst
      te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.7'
    text: |-
      De rechter kan bij toewijzing van een vordering van de werknemer op grond van lid 6 de verplichting tot betaling
      van de werkgever beperken tot zodanig bedrag als hem met het oog op de omstandigheden billijk voorkomt, maar
      uiterlijk tot de som waarop hij de door de werknemer geleden schade vaststelt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '631.8'
    text: |-
      Een rechtsvordering van de werknemer op grond van dit artikel verjaart door verloop van zes maanden na de dag van
      het ontstaan van het vorderingsrecht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel631
  - number: '632.1'
    text: |-
      Behalve bij het einde van de arbeidsovereenkomst is verrekening door de werkgever van zijn schuld ter zake van het
      uit te betalen loon slechts toegelaten met de volgende vorderingen op de werknemer:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: 632.1.a
    text: de door de werknemer aan de werkgever verschuldigde schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: 632.1.b
    text: |-
      de boetes, door de werknemer volgens [artikel 650][ref1] aan de werkgever verschuldigd, mits door deze een
      schriftelijk bewijs wordt afgegeven, die het bedrag vermeldt van iedere boete alsmede de tijd waarop en de reden
      waarom zij is opgelegd, met opgave van de overtreden bepaling van een schriftelijk aangegane overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel650
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '650'
        afdeling: '5'
  - number: 632.1.c
    text: |-
      de voorschotten op het loon, door de werkgever in geld aan de werknemer verstrekt, mits daarvan schriftelijk
      blijkt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: 632.1.d
    text: het bedrag van hetgeen op het loon te veel is betaald;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: 632.1.e
    text: |-
      de huurprijs van een woning of een andere ruimte, een stuk grond of van werktuigen, machines en gereedschappen,
      door de werknemer in eigen bedrijf gebruikt, en die bij schriftelijke overeenkomst door de werkgever aan de
      werknemer zijn verhuurd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: '632.2'
    text: |-
      Verrekening heeft geen plaats op het deel van het loon waarop beslag onder de werkgever niet geldig kan zijn. Ter
      zake van hetgeen de werkgever krachtens lid 1, onderdeel b, zou kunnen vorderen, mag door hem bij elke voldoening
      van het loon niet meer worden verrekend dan een tiende gedeelte van het in geld vastgestelde loon dat alsdan zou
      moeten worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: '632.3'
    text: |-
      Hetgeen de werkgever uit hoofde van een op het loon gelegd beslag inhoudt, komt in mindering op het voor
      verrekening toegelaten maximum.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: '632.4'
    text: |-
      Een beding waardoor de werkgever een ruimere bevoegdheid tot verrekening zou krijgen, is vernietigbaar, met dien
      verstande dat de werknemer bevoegd is tot vernietiging ter zake van elke afzonderlijke verrekeningsverklaring van
      de werkgever die van de geldigheid van het beding uitgaat.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel632
  - number: '633.1'
    text: |-
      Overdracht, verpanding of elke andere handeling waardoor de werknemer enig recht op zijn loon aan derden toekent,
      is slechts in zover geldig als een beslag op zijn loon geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel633
  - number: '633.2'
    text: Een volmacht tot de vordering van loon wordt schriftelijk verleend. Deze volmacht is te allen tijde herroepelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel633
  - number: '633.3'
    text: Van dit artikel kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel633
  - number: '634.1'
    text: |-
      De werknemer verwerft over ieder jaar waarin hij gedurende de volledige overeengekomen arbeidsduur recht op loon
      heeft gehad, aanspraak op vakantie van ten minste vier maal de overeengekomen arbeidsduur per week of, als de
      overeengekomen arbeidsduur in uren per jaar is uitgedrukt, van ten minste een overeenkomstige tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel634
  - number: '634.2'
    text: |-
      De werknemer die over een deel van een jaar recht op loon heeft gehad, verwerft over dat deel aanspraak op vakantie
      die een evenredig gedeelte bedraagt van datgene waarop hij recht zou hebben gehad als hij gedurende het gehele jaar
      recht had op loon over de volledige overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel634
  - number: '634.3'
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan kan ten
      aanzien van werknemers wier arbeidsovereenkomst eindigt nadat deze ten minste een maand heeft geduurd, van lid 2
      worden afgeweken in dier voege dat de aanspraak op vakantie wordt berekend over tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel634
  - number: '635.1'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer aanspraak op vakantie over het tijdvak, gedurende
      hetwelk hij geen recht heeft op in geld vastgesteld loon, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: 635.1.a
    text: |-
      hij, anders dan voor oefening en opleiding, als dienstplichtige is opgeroepen ter vervulling van zijn militaire
      dienst of vervangende dienst;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
  - number: 635.1.b
    text: |-
      hij vakantie als bedoeld in [artikel 641 lid 3][ref1] geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
        afdeling: '3'
  - number: 635.1.c
    text: |-
      hij, met toestemming van de werkgever, deelneemt aan een bijeenkomst die wordt georganiseerd door een vakvereniging
      waarvan hij lid is;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
  - number: 635.1.d
    text: |-
      hij, anders dan ten gevolge van de arbeidsongeschiktheid, bedoeld in de leden 2 tot en met 4, tegen zijn wil niet
      in staat is om de overeengekomen arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
  - number: 635.1.e
    text: |-
      hij verlof als bedoeld in [artikel 643][ref1] geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel643
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '643'
        afdeling: '3'
  - number: '635.2'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de vrouwelijke werknemer die wegens zwangerschap of
      bevalling niet gedurende een geheel jaar aanspraak op loon verwerft, over de volledige overeengekomen
      arbeidsduur aanspraak op vakantie over het tijdvak dat zij recht heeft op een uitkering als bedoeld in
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '635.3'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer die wegens adoptieverlof niet gedurende een geheel jaar
      aanspraak op loon verwerft, over de volledige overeengekomen arbeidsduur aanspraak op vakantie over het tijdvak dat
      hij recht heeft op een uitkering als bedoeld in [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '635.4'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer die de bedongen arbeid niet verricht wegens ziekte,
      ongeacht of hij aanspraak heeft op loon, aanspraak op vakantie over het tijdvak van de laatste zes maanden
      waarin de arbeid niet werd verricht, met dien verstande dat tijdvakken worden samengeteld als zij elkaar met een
      onderbreking van minder dan een maand opvolgen. De werknemer die de bedongen arbeid slechts voor een gedeelte van
      de overeengekomen arbeidsduur niet verricht wegens ziekte, verwerft slechts aanspraak op vakantie die een evenredig
      gedeelte bedraagt van datgene waarop hij recht zou hebben gehad als hij gedurende de volledige arbeidsduur arbeid
      zou hebben verricht. Indien de ziekte door opzet van de werknemer is ontstaan of het gevolg is van een gebrek
      waarover hij in het kader van een aanstellingskeuring opzettelijk valse inlichtingen heeft gegeven, verwerft de
      werknemer evenmin aanspraak op vakantie. De werknemer heeft evenmin aanspraak op vakantie voor de tijd gedurende
      welke hij door zijn toedoen zijn genezing belemmert of vertraagt , hij, hoewel hij daartoe in staat is, zonder
      deugdelijke grond passende arbeid als bedoeld in [artikel 658a lid 3][ref2] voor de werkgever of voor een door
      de werkgever met toestemming van het Uitvoeringsinstituut werknemersverzekeringen aangewezen derde, waartoe de
      werkgever hem in de gelegenheid stelt, niet verricht dan wel hij zonder deugdelijke grond weigert mee te werken
      aan door de werkgever of door een door hem aangewezen deskundige gegeven redelijke voorschriften en getroffen
      maatregelen die erop gericht zijn om de werknemer in staat te stellen passende arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: '635.5'
    text: |-
      De jeugdige werknemer verwerft aanspraak op vakantie over de tijd die hij besteedt aan het volgen van het
      onderricht waartoe hij krachtens de wet door de werkgever in de gelegenheid moet worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
  - number: '635.6'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van de leden 1 tot en met 4
      worden afgeweken ten nadele van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '636.1'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer de overeengekomen arbeid niet verricht wegens een van de redenen,
      bedoeld in [artikel 635 leden 1, 3 en 4][ref1] kunnen slechts indien in een voorkomend geval de werknemer ermee
      instemt worden aangemerkt als vakantie, met dien verstande dat de werknemer ten minste recht houdt op het in
      [artikel 634][ref2] bedoelde minimum.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel636
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '636.2'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer de overeengekomen arbeid niet verricht wegens de in
      [artikel 635 lid 2][ref1] bedoelde reden, kunnen niet worden aangemerkt als vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel636
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
  - number: '637.1'
    text: |-
      Bij schriftelijke overeenkomst kan worden bepaald dat dagen of gedeelten van dagen waarop de werknemer in enig
      jaar de overeengekomen arbeid niet heeft verricht wegens de reden, bedoeld in [artikel 635 lid 4][ref1] worden
      aangemerkt als vakantie tot ten hoogste het aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref2]
      bedoelde minimum is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '637.2'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer tijdens een vastgestelde vakantie ziek is, gelden niet als
      vakantie. In afwijking van de vorige volzin kan bij schriftelijke overeenkomst worden bepaald dat de in enig jaar
      verleende vakantiedagen of gedeelten daarvan waarop de werknemer ziek is, als vakantie gelden tot ten hoogste het
      aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref1] bedoelde minimum is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '637.3'
    text: |-
      Indien in enig jaar zowel lid 1 als lid 2, tweede volzin, worden toegepast, kunnen in totaal niet meer dan het
      aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref1] bedoelde minimum is overeengekomen, als
      vakantie gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '638.1'
    text: |-
      De werkgever is verplicht de werknemer ieder jaar in de gelegenheid te stellen de vakantie op te nemen waarop de
      werknemer op grond van [artikel 634][ref1] ten minste aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '638.2'
    text: |-
      Voorzover in de vaststelling van de vakantie niet is voorzien bij schriftelijke overeenkomst dan wel bij of
      krachtens collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan of de
      wet, stelt de werkgever de tijdstippen van aanvang en einde van de vakantie vast overeenkomstig de wensen van de
      werknemer tenzij gewichtige redenen zich daartegen verzetten. Indien de werkgever niet binnen twee weken nadat de
      werknemer zijn wensen schriftelijk heeft kenbaar gemaakt, schriftelijk aan de werknemer gewichtige redenen heeft
      aangevoerd, is de vakantie vastgesteld overeenkomstig de wensen van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
  - number: '638.3'
    text: |-
      In geval van gewichtige redenen wordt de vakantie op zodanige wijze vastgesteld dat de werknemer desverlangd,
      voorzover zijn aanspraak daartoe toereikend is, gedurende twee opeenvolgende weken of tweemaal een week geen arbeid
      behoeft te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
  - number: '638.4'
    text: |-
      De werkgever stelt de vakantie zo tijdig vast dat de werknemer gelegenheid heeft tot het treffen van
      voorbereidingen voor de besteding van de vakantie.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
  - number: '638.5'
    text: |-
      De werkgever kan, indien daartoe gewichtige redenen zijn, na overleg met de werknemer, het vastgestelde tijdvak
      van de vakantie wijzigen. De schade die de werknemer lijdt ten gevolge van de wijziging van het tijdvak van de
      vakantie, wordt door de werkgever vergoed.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
  - number: '638.6'
    text: |-
      De werkgever is verplicht de werknemer de resterende aanspraak op vakantie in dagen of uren te verlenen, tenzij
      gewichtige redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
  - number: '638.7'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van de in lid 2 genoemde termijn
      worden afgeweken ten nadele van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel638
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '639.1'
    text: De werknemer behoudt gedurende zijn vakantie recht op loon.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel639
  - number: '639.2'
    text: |-
      Indien hierin bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan
      is voorzien, kan de werkgever aan zijn verplichting om gedurende de vakantie loon te betalen voldoen hetzij
      door aan de werknemer vakantiebonnen over te dragen ten laste van een fonds, hetzij door betaling aan een
      fonds ten laste waarvan de werknemer gelijkwaardige rechten verwerft. Voor de toepassing van dit artikel worden
      vakantiebonnen als loon beschouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel639
  - number: '640.1'
    text: |-
      De werknemer kan tijdens de duur van de arbeidsovereenkomst geen afstand doen van zijn aanspraak op vakantie tegen
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel640
  - number: '640.2'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van lid 1 worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel640
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '641.1'
    text: |-
      Een werknemer die bij het einde van de arbeidsovereenkomst nog aanspraak op vakantie heeft, heeft recht op
      een uitkering in geld tot een bedrag van het loon over een tijdvak overeenkomend met de aanspraak, tenzij
      [artikel 639 lid 2][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel639
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel641
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '639'
        afdeling: '3'
  - number: '641.2'
    text: |-
      De werkgever is verplicht aan de werknemer een verklaring uit te reiken waaruit blijkt over welk tijdvak de
      werknemer bij het einde van de arbeidsovereenkomst nog aanspraak op vakantie heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel641
  - number: '641.3'
    text: |-
      Indien de werknemer een nieuwe arbeidsovereenkomst aangaat, heeft hij tegenover de nieuwe werkgever aanspraak op
      vakantie zonder behoud van loon gedurende het tijdvak waarover hij blijkens de in lid 2 bedoelde verklaring nog
      aanspraak op vakantie had.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel641
  - number: '641.4'
    text: |-
      Bij schriftelijke overeenkomst kan van lid 3 worden afgeweken, met dien verstande dat de werknemer ten minste recht
      houdt op het in [artikel 634][ref1] bedoelde minimum.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel641
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '642'
    text: |-
      Een rechtsvordering tot toekenning van vakantie verjaart door verloop van vijf jaren na de laatste dag van het
      kalenderjaar waarin de aanspraak is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel642
  - number: '643.1'
    text: |-
      De werknemer kan verlangen dat de werkgever hem verlof zonder behoud van loon verleent voor het als lid bijwonen
      van vergaderingen van de Eerste Kamer der Staten-Generaal, van vertegenwoordigende organen van publiekrechtelijke
      lichamen die bij rechtstreekse verkiezing worden samengesteld, uitgezonderd echter de Tweede Kamer der Staten-
      Generaal, alsmede van commissies uit deze organen. Deze bepaling vindt mede toepassing op de werknemer die deel
      uitmaakt van een met algemeen bestuur belast orgaan van een waterschap.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel643
  - number: '643.2'
    text: |-
      Indien daarover tussen de werkgever en de werknemer geen overeenstemming bestaat, stelt de rechter op verzoek
      van de meest gerede partij vast in welke mate dit verlof behoort te worden verleend. De rechter beoordeelt in
      hoever, gezien het belang dat de werknemer aan de in lid 1 bedoelde vergaderingen kan deelnemen, in redelijkheid
      van de werkgever kan worden gevergd dat de werknemer afwezig is. De beschikking van de rechter is uitvoerbaar bij
      voorraad.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel643
  - number: '643.3'
    text: |-
      De leden 1 en 2 vinden overeenkomstige toepassing op gedeputeerden, wethouders en leden van het dagelijks bestuur
      van een waterschap, wier functie niet als een volledige wordt bezoldigd. Bij algemene maatregel van bestuur
      wordt bepaald, welke gedeputeerdenfuncties en wethoudersfuncties voor de toepassing van dit artikel als volledig
      bezoldigd worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel643
  - number: '643.4'
    text: |-
      Dit artikel blijft buiten toepassing ten aanzien van die groepen werknemers voor wie uit hoofde van verlening van
      rijksvergoeding bij of krachtens de wet een andere regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel643
  - number: '645'
    text: |-
      Van de [artikelen 634 tot en met 643][ref1] kan niet ten nadele van de werknemer worden afgeweken, tenzij zodanige
      afwijking bij die artikelen is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel645
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '646.1'
    text: |-
      De werkgever mag geen onderscheid maken tussen mannen en vrouwen bij het aangaan van de arbeidsovereenkomst, het
      verstrekken van onderricht aan de werknemer, in de arbeidsvoorwaarden, bij de bevordering en bij de opzegging van
      de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.2'
    text: |-
      Van lid 1 mag, voor zover het betreft het aangaan van de arbeidsovereenkomst en het verstrekken
      van onderricht, worden afgeweken in die gevallen waarin het geslacht bepalend is. Daarbij is
      [artikel 5, derde lid, van de Wet gelijke behandeling van mannen en vrouwen][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel5
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '5'
  - number: '646.3'
    text: |-
      Van lid 1 mag worden afgeweken indien het bedingen betreft die op de bescherming van de vrouw, met name in verband
      met zwangerschap of moederschap, betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.4'
    text: |-
      Van lid 1 mag worden afgeweken indien het bedingen betreft die vrouwelijke werknemers in een bevoorrechte positie
      beogen te plaatsen ten einde feitelijke ongelijkheden op te heffen of te verminderen en het onderscheid in een
      redelijke verhouding staat tot het beoogde doel.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.5'
    text: |-
      In dit artikel wordt onder onderscheid tussen mannen en vrouwen verstaan direct en indirect onderscheid tussen
      mannen en vrouwen. Onder direct onderscheid wordt mede verstaan onderscheid op grond van zwangerschap, bevalling
      en moederschap. Onder indirect onderscheid wordt verstaan onderscheid op grond van andere hoedanigheden dan het
      geslacht, bijvoorbeeld echtelijke staat of gezinsomstandigheden, dat onderscheid op grond van geslacht tot gevolg
      heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.6'
    text: |-
      Het in lid 1 neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid dat objectief
      gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.7'
    text: Een beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '646.8'
    text: |-
      Indien degene die meent dat te zijnen nadeel een onderscheid is of wordt gemaakt als bedoeld in dit artikel, in
      rechte feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in
      strijd met dit artikel is gehandeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel646
  - number: '647.1'
    text: |-
      De opzegging van de arbeidsovereenkomst door de werkgever in strijd met [artikel 646 lid 1][ref1] of wegens
      de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op [artikel 646 lid 1][ref2] is
      vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
  - number: '647.2'
    text: |-
      Indien de werknemer niet binnen twee maanden na de opzegging een beroep op deze vernietigingsgrond doet, vervalt
      zijn bevoegdheid daartoe. [ Artikel 55 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '647.3'
    text: |-
      Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel647
  - number: '647.4'
    text: |-
      De opzegging, bedoeld in [artikel 646 lid 1][ref1], maakt de werkgever niet schadeplichtig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
  - number: '648.1'
    text: |-
      De werkgever mag geen onderscheid maken tussen werknemers op grond van een verschil in arbeidsduur in de
      voorwaarden waaronder een arbeidsovereenkomst wordt aangegaan, voortgezet dan wel opgezegd, tenzij een dergelijk
      onderscheid objectief gerechtvaardigd is. De opzegging van de arbeidsovereenkomst door de werkgever in strijd
      met de vorige zin of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op het
      bepaalde in de vorige zin is vernietigbaar. [Artikel 647, leden 2 en 3][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel647
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel648
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '647'
        afdeling: '4'
  - number: '648.2'
    text: Een beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel648
  - number: '648.3'
    text: De opzegging, bedoeld in de eerste zin van lid 1, maakt de werkgever niet schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel648
  - number: '648.4'
    text: |-
      De Commissie gelijke behandeling, genoemd in [artikel 11 van de Algemene wet gelijke behandeling][ref1], kan
      onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in het eerste lid. De [artikelen 12][ref2],
      [13][ref3], [14][ref4], [15][ref5], [20, tweede lid][ref6], en [33 van de Algemene wet gelijke behandeling][ref7]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006502#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006502#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0006502#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0006502#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006502#Artikel33
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel648
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006502
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0006502
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0006502
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0006502
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0006502
        artikel: '33'
  - number: '650.1'
    text: |-
      De werkgever kan slechts boete stellen op de overtreding van de voorschriften van de arbeidsovereenkomst, indien
      in de arbeidsovereenkomst de voorschriften op de overtreding waarvan boete is gesteld en het bedrag van de boete
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.2'
    text: De overeenkomst waarbij boete wordt bedongen, wordt schriftelijk aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.3'
    text: |-
      De overeenkomst waarbij boete is bedongen, vermeldt nauwkeurig de bestemming van de boete. Zij mogen noch
      onmiddellijk noch middellijk strekken tot persoonlijk voordeel van de werkgever zelf of van degene aan wie de
      werkgever de bevoegdheid heeft verleend om aan werknemers een boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.4'
    text: |-
      Iedere boete, in een overeenkomst bedongen, is op een bepaald bedrag gesteld, uitgedrukt in het geld waarin het
      loon in geld is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.5'
    text: |-
      Binnen een week mag aan de werknemer geen hoger bedrag aan gezamenlijke boetes worden opgelegd dan zijn in geld
      vastgesteld loon voor een halve dag. Geen afzonderlijke boete mag hoger dan dit bedrag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.6'
    text: |-
      Elk beding in strijd met enige bepaling van dit artikel is nietig. Echter mag, doch alleen ten aanzien van
      werknemers wier in geld vastgesteld loon meer bedraagt dan het voor hen geldende minimumloon bij schriftelijk
      aangegane overeenkomst van de bepalingen van de leden 3, 4 en 5 worden afgeweken. Is zulks geschied, dan zal de
      rechter steeds bevoegd zijn de boete op een kleinere som te bepalen, indien de opgelegde boete hem bovenmatig
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.7'
    text: |-
      Ondergaat het bedrag van het loon, genoemd in lid 6, wijziging, dan wordt de werking van bedingen waarbij van de
      leden 3, 4 en 5 is afgeweken, geschorst jegens de werknemer wiens in geld vastgesteld loon niet meer bedraagt dan
      het gewijzigde bedrag van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
  - number: '650.8'
    text: |-
      Onder het stellen en bedingen van boete in de zin van dit artikel wordt begrepen het door de werkgever bedingen van
      boete als bedoeld in de [artikelen 91 tot en met 94 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel91
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel650
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '91'
  - number: '651.1'
    text: |-
      De mogelijkheid een boete op te leggen laat het recht op schadevergoeding op grond van de wet onverlet. Echter mag
      de werkgever ter zake van een zelfde feit niet boete heffen en tevens schadevergoeding vorderen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel651
  - number: '651.2'
    text: Elk beding in strijd met de tweede zin van lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel651
  - number: '652.1'
    text: Indien partijen een proeftijd overeenkomen, is deze voor beide partijen gelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.2'
    text: De proeftijd wordt schriftelijk overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.3'
    text: |-
      Bij het aangaan van een arbeidsovereenkomst voor onbepaalde tijd kan een proeftijd worden overeengekomen van ten
      hoogste twee maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.4'
    text: |-
      Bij het aangaan van een arbeidsovereenkomst voor bepaalde tijd kan een proeftijd worden overeengekomen van ten
      hoogste:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: 652.4.a
    text: een maand, indien de overeenkomst is aangegaan voor korter dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: 652.4.b
    text: twee maanden, indien de overeenkomst is aangegaan voor twee jaren of langer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.5'
    text: |-
      Indien het einde van een arbeidsovereenkomst voor bepaalde tijd niet op een kalenderdatum is gesteld, kan een
      proeftijd worden overeengekomen van ten hoogste een maand.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.6'
    text: |-
      Van de leden 4, onder a, en 5, kan slechts bij collectieve arbeidsovereenkomst of bij regeling door of namens een
      daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '652.7'
    text: |-
      Elk beding waarbij de proeftijd niet voor beide partijen gelijk is dan wel op langer dan twee maanden wordt
      gesteld, alsmede elk beding waarbij door het aangaan van een nieuwe proeftijd de gezamenlijke proeftijden langer
      dan twee maanden worden, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel652
  - number: '653.1'
    text: |-
      Een beding tussen de werkgever en de werknemer waarbij deze laatste wordt beperkt in zijn bevoegdheid om na het
      einde van de overeenkomst op zekere wijze werkzaam te zijn, is slechts geldig, indien de werkgever dit schriftelijk
      is overeengekomen met een meerderjarige werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel653
  - number: '653.2'
    text: |-
      De rechter kan zulk een beding geheel of gedeeltelijk vernietigen op grond dat, in verhouding tot het te beschermen
      belang van de werkgever, de werknemer door dat beding onbillijk wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel653
  - number: '653.3'
    text: |-
      Aan een beding als bedoeld in lid 1 kan de werkgever geen rechten ontlenen, indien hij wegens de wijze waarop de
      overeenkomst is geëindigd, schadeplichtig is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel653
  - number: '653.4'
    text: |-
      Indien een beding als bedoeld in lid 1 de werknemer in belangrijke mate belemmert om anders dan in dienst van
      de werkgever werkzaam te zijn, kan de rechter steeds bepalen dat de werkgever voor de duur van de beperking
      aan de werknemer een vergoeding moet betalen. De rechter stelt de hoogte van deze vergoeding met het oog op de
      omstandigheden van het geval naar billijkheid vast; hij kan toestaan dat de vergoeding op de door hem te bepalen
      wijze in termijnen wordt betaald. De vergoeding is niet verschuldigd, indien de werknemer wegens de wijze waarop de
      overeenkomst is geëindigd, schadeplichtig is.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel653
  - number: '654.1'
    text: |-
      Wanneer een arbeidsovereenkomst schriftelijk wordt aangegaan of gewijzigd, zijn de kosten van het geschrift en
      andere bijkomende kosten ten laste van de werkgever.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel654
  - number: '654.2'
    text: |-
      De werkgever is verplicht kosteloos een volledig, door hem ondertekend, afschrift van het geschrift waarbij de
      arbeidsovereenkomst is aangegaan of gewijzigd, aan de werknemer te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel654
  - number: '655.1'
    text: |-
      De werkgever is verplicht aan de werknemer een schriftelijke opgave te verstrekken met ten minste de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.a
    text: naam en woonplaats van partijen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.b
    text: de plaats of plaatsen waar de arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.c
    text: de functie van de werknemer of de aard van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.d
    text: het tijdstip van indiensttreding;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.e
    text: indien de overeenkomst voor bepaalde tijd is gesloten, de duur van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.f
    text: de aanspraak op vakantie of de wijze van berekening van de aanspraak;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.g
    text: de duur van de door partijen in acht te nemen opzegtermijnen of de wijze van berekening van deze termijnen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.h
    text: |-
      het loon en de termijn van uitbetaling alsmede, indien het loon afhankelijk is van de uitkomsten van de te
      verrichten arbeid, de per dag of per week aan te bieden hoeveelheid arbeid, de prijs per stuk en de tijd die
      redelijkerwijs met de uitvoering is gemoeid;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.i
    text: de gebruikelijke arbeidsduur per dag of per week;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.j
    text: of de werknemer gaat deelnemen aan een pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.k
    text: |-
      indien de werknemer voor een langere termijn dan een maand werkzaam zal zijn buiten Nederland, mede de duur van
      die werkzaamheid, de huisvesting, de toepasselijkheid van de Nederlandse sociale verzekeringswetgeving dan wel
      opgave van de voor de uitvoering van die wetgeving verantwoordelijke organen, de geldsoort waarin betaling zal
      plaatsvinden, de vergoedingen waarop de werknemer recht heeft en de wijze waarop de terugkeer geregeld is;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.l
    text: de toepasselijke collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: 655.1.m
    text: |-
      of de arbeidsovereenkomst een uitzendovereenkomst is als bedoeld in [artikel 690][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '655.2'
    text: |-
      Voor zover de gegevens, bedoeld in lid 1, onderdelen *a* tot en met *j*, zijn vermeld in een schriftelijk aangegane
      arbeidsovereenkomst of in de opgave, bedoeld in [artikel 626][ref1], kan vermelding achterwege blijven. Voor
      zover de gegevens, bedoeld in het eerste lid, onderdelen *f* tot en met *i*, zijn vermeld in een toepasselijke
      collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan, kan worden volstaan
      met een verwijzing naar deze overeenkomst of regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel626
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '626'
        afdeling: '2'
  - number: '655.3'
    text: |-
      De werkgever verstrekt de opgave binnen een maand na de aanvang van de werkzaamheden of zo veel eerder als de
      overeenkomst eindigt. De gegevens, bedoeld in lid 1, onderdeel *k*, worden verstrekt voor het vertrek. De opgave
      wordt door de werkgever ondertekend. Wijziging in de gegevens wordt binnen een maand nadat de wijziging van kracht
      is geworden, aan de werknemer schriftelijk medegedeeld, tenzij deze voortvloeit uit wijziging van een wettelijk
      voorschrift, collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: '655.4'
    text: |-
      Indien de overeenkomst betreft het doorgaans op minder dan drie dagen per week uitsluitend of nagenoeg uitsluitend
      verrichten van huishoudelijke of persoonlijke diensten ten behoeve van een natuurlijk persoon, behoeft de werkgever
      slechts op verlangen van de werknemer de gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: '655.5'
    text: |-
      De werkgever die weigert de opgave te verstrekken of daarin onjuiste mededelingen opneemt, is jegens de werknemer
      aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: '655.6'
    text: |-
      De leden 1 tot en met 5 zijn van overeenkomstige toepassing op een overeenkomst die de voorwaarden regelt van
      een of meer arbeidsovereenkomsten die partijen zullen sluiten indien na oproep arbeid wordt verricht, en op het
      aangaan van een andere overeenkomst dan een arbeidsovereenkomst, al dan niet gevolgd door andere soortgelijke
      overeenkomsten, waarbij de ene partij, natuurlijk persoon, zich verbindt voor de andere partij tegen beloning
      arbeid te verrichten, tenzij deze overeenkomst wordt aangegaan in beroep of bedrijf. Op de in dit lid bedoelde
      overeenkomsten is [artikel 654][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel654
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '654'
        afdeling: '6'
  - number: '655.7'
    text: |-
      Indien lid 6 van toepassing is, wordt in de schriftelijke opgave, bedoeld in lid 1, tevens vermeld welke
      overeenkomst is aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: '655.8'
    text: Een beding in strijd met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel655
  - number: '656.1'
    text: |-
      De werkgever is verplicht bij het einde van de arbeidsovereenkomst de werknemer op diens verzoek een getuigschrift
      uit te reiken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '656.2'
    text: 'Het getuigschrift vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: 656.2.a
    text: de aard van de verrichte arbeid en de arbeidsduur per dag of per week;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: 656.2.b
    text: de begindatum en de einddatum van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: 656.2.c
    text: een opgave van de wijze waarop de werknemer aan zijn verplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: 656.2.d
    text: een opgave van de wijze waarop de arbeidsovereenkomst is geëindigd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: 656.2.e
    text: indien de werkgever de arbeidsovereenkomst heeft opgezegd, de reden daartoe.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '656.3'
    text: |-
      De in lid 2, onderdelen *c*, *d* en *e*, genoemde gegevens worden slechts op verzoek van de werknemer in het
      getuigschrift vermeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '656.4'
    text: |-
      Indien de werknemer de arbeidsovereenkomst heeft opgezegd en hij deswege schadeplichtig is geworden, is de
      werkgever gerechtigd dit in het getuigschrift te vermelden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '656.5'
    text: |-
      De werkgever die weigert het gevraagde getuigschrift af te geven, nalaat aan een verzoek als bedoeld in lid 3
      te voldoen, in het getuigschrift door opzet of schuld onjuiste mededelingen opneemt of het getuigschrift van
      een kenmerk voorziet of op een bepaalde wijze inricht om daarmee aangaande de werknemer enige mededeling te
      doen die niet in de bewoordingen van het getuigschrift is vervat, is zowel jegens de werknemer als jegens derden
      aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '656.6'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel656
  - number: '658.1'
    text: |-
      De werkgever is verplicht de lokalen, werktuigen en gereedschappen waarin of waarmee hij de arbeid doet verrichten,
      op zodanige wijze in te richten en te onderhouden alsmede voor het verrichten van de arbeid zodanige maatregelen
      te treffen en aanwijzingen te verstrekken als redelijkerwijs nodig is om te voorkomen dat de werknemer in de
      uitoefening van zijn werkzaamheden schade lijdt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658
  - number: '658.2'
    text: |-
      De werkgever is jegens de werknemer aansprakelijk voor de schade die de werknemer in de uitoefening van zijn
      werkzaamheden lijdt, tenzij hij aantoont dat hij de in lid 1 genoemde verplichtingen is nagekomen of dat de schade
      in belangrijke mate het gevolg is van opzet of bewuste roekeloosheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658
  - number: '658.3'
    text: |-
      Van de leden 1 en 2 en van hetgeen [titel 3 van Boek 6][ref1], bepaalt over de aansprakelijkheid van de werkgever
      kan niet ten nadele van de werknemer worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: '658.4'
    text: |-
      Hij die in de uitoefening van zijn beroep of bedrijf arbeid laat verrichten door een persoon met wie hij geen
      arbeidsovereenkomst heeft, is overeenkomstig de leden 1 tot en met 3 aansprakelijk voor de schade die deze persoon
      in de uitoefening van zijn werkzaamheden lijdt. De kantonrechter is bevoegd kennis te nemen van vorderingen op
      grond van de eerste zin van dit lid.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658
  - number: 658a.1
    text: |-
      De werkgever is verplicht zo tijdig mogelijk zodanige maatregelen te treffen en voorschriften te geven als
      redelijkerwijs nodig is, opdat de werknemer, die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is
      de bedongen arbeid te verrichten, in staat wordt gesteld de eigen of andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658a
  - number: 658a.2
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in lid 1, stelt de werkgever in overeenstemming met de werknemer een plan
      van aanpak op als bedoeld in [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].
      Het plan van aanpak wordt met medewerking van de werknemer regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 658a.3
    text: |-
      Onder passende arbeid als bedoeld in lid 1 wordt verstaan alle arbeid die voor de krachten en bekwaamheden van de
      werknemer is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem kan
      worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel658a
  - number: '659.1'
    text: |-
      De werknemer is verplicht de arbeid zelf te verrichten; hij kan zich daarin niet dan met toestemming van de
      werkgever door een derde doen vervangen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel659
  - number: '659.2'
    text: |-
      De rechtsvordering tot nakoming van de arbeidsverplichting van de werknemer onder de bepaling van een dwangsom of
      van gijzeling is niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel659
  - number: '660'
    text: |-
      De werknemer is verplicht zich te houden aan de voorschriften omtrent het verrichten van de arbeid alsmede aan die
      welke strekken ter bevordering van de goede orde in de onderneming van de werkgever, door of namens de werkgever
      binnen de grenzen van algemeen verbindende voorschriften, of overeenkomst aan hem, al dan niet tegelijk met andere
      werknemers, gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel660
  - number: 660a
    text: |-
      De werknemer die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te
      verrichten, is verplicht:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel660a
  - number: 660a.a
    text: |-
      gevolg te geven aan door de werkgever of een door hem aangewezen deskundige gegeven redelijke voorschriften en
      mee te werken aan door de werkgever of een door hem aangewezen deskundige getroffen maatregelen als bedoeld in
      [artikel 658a lid 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 660a.b
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 658a lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 660a.c
    text: |-
      passende arbeid als bedoeld in [artikel 658a lid 3][ref1] te verrichten waartoe de werkgever hem in de gelegenheid
      stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: '661.1'
    text: |-
      De werknemer die bij de uitvoering van de overeenkomst schade toebrengt aan de werkgever of aan een derde jegens
      wie de werkgever tot vergoeding van die schade is gehouden, is te dier zake niet jegens de werkgever aansprakelijk,
      tenzij de schade een gevolg is van zijn opzet of bewuste roekeloosheid. Uit de omstandigheden van het geval kan,
      mede gelet op de aard van de overeenkomst, anders voortvloeien dan in de vorige zin is bepaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel661
  - number: '661.2'
    text: |-
      Afwijking van lid 1 en van [artikel 170 lid 3 van Boek 6][ref1] ten nadele van de werknemer is slechts mogelijk bij
      schriftelijke overeenkomst en slechts voor zover de werknemer te dier zake verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel170
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel661
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '170'
  - number: '662'
    text: Voor de toepassing van deze afdeling wordt
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel662
  - number: 662.a
    text: onder onderneming een dienst of instelling begrepen;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel662
  - number: 662.b
    text: |-
      onder overgang van een onderneming verstaan: overgang van een onderneming of een onderdeel daarvan ten gevolge van
      een overeenkomst, inzonderheid een overeenkomst tot verkoop, verhuur, verpachting of uitgifte in vruchtgebruik, of
      ten gevolge van een splitsing als bedoeld in [artikel 334a van Boek 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel662
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
  - number: '663'
    text: |-
      Door de overgang van een onderneming gaan de rechten en verplichtingen die op dat tijdstip voor de werkgever in die
      onderneming voortvloeien uit een arbeidsovereenkomst tussen hem en een daar werkzame werknemer van rechtswege over
      op de verkrijger. Evenwel is die werkgever nog gedurende een jaar na de overgang naast de verkrijger hoofdelijk
      verbonden voor de nakoming van de verplichtingen uit de arbeidsovereenkomst, die zijn ontstaan vóór dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel663
  - number: '664.1'
    text: |-
      [Artikel 663][ref1] is niet van toepassing op rechten en verplichtingen van de werkgever die voortvloeien uit
      een toezegging omtrent pensioen als omschreven in [artikel 1, eerste lid, onderdeel ][ref2], dan wel uit een
      spaarregeling als bedoeld in [artikel 3, eerste lid, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002089#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002089
        artikel: '3'
  - number: '664.2'
    text: |-
      Voor de nakoming van verplichtingen van de werkgever die op het tijdstip van de overgang van de
      onderneming voor hem voortvloeien uit een pensioentoezegging of spaarregeling als bedoeld in lid 1, waarop
      [artikel 2, eerste lid][ref1], onderscheidenlijk [3, eerste lid, van de Pensioen- en spaarfondsenwet][ref2]
      ingevolge het bij of krachtens die wet bepaalde niet van toepassing is, is de verkrijger hoofdelijk verbonden naast
      de eerstgenoemde.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '3'
  - number: '664.3'
    text: |-
      Lid 2 is niet van toepassing voor wat betreft verplichtingen jegens een werknemer die op het tijdstip van de
      overgang middellijk of onmiddellijk houder is van aandelen die ten minste een tiende gedeelte van het geplaatste
      kapitaal van de onderneming vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel664
  - number: '665'
    text: |-
      Indien de overgang van een onderneming een wijziging van de omstandigheden ten nadele van de werknemer tot gevolg
      heeft en de arbeidsovereenkomst deswege wordt ontbonden ingevolge [artikel 685][ref1], geldt zij met het oog op de
      toepassing van lid 8 van dat artikel als ontbonden wegens een reden welke voor rekening van de werkgever komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel665
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: '666.1'
    text: |-
      Deze afdeling is niet van toepassing op de overgang van een onderneming indien de werkgever in staat van
      faillissement is verklaard en de onderneming tot de boedel behoort.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel666
  - number: '666.2'
    text: Deze afdeling is niet van toepassing met betrekking tot de bemanning van een zeeschip.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel666
  - number: '667.1'
    text: |-
      Een arbeidsovereenkomst eindigt van rechtswege, wanneer de tijd is verstreken bij overeenkomst, bij de wet of door
      het gebruik aangegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.2'
    text: 'Voorafgaande opzegging is in dat geval nodig:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: 667.2.a
    text: indien zulks bij schriftelijk aangegane overeenkomst is bepaald;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: 667.2.b
    text: |-
      indien volgens de wet of het gebruik opzegging behoort plaats te vinden en daarvan niet, waar zulks geoorloofd is,
      bij schriftelijk aangegane overeenkomst is afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.3'
    text: |-
      Een arbeidsovereenkomst als bedoeld in lid 1 kan slechts tussentijds worden opgezegd indien voor ieder der partijen
      dat recht schriftelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.4'
    text: |-
      Indien een voor onbepaalde tijd aangegane arbeidsovereenkomst, die anders dan door rechtsgeldige opzegging of
      door ontbinding door de rechter is geëindigd, éénmaal of meermalen is voortgezet door een arbeidsovereenkomst voor
      bepaalde tijd met tussenpozen van niet meer dan drie maanden, is in afwijking van lid 1 voor de beëindiging van
      die laatste arbeidsovereenkomst voorafgaande opzegging nodig. De termijn van opzegging wordt berekend vanaf het
      tijdstip van totstandkoming van de arbeidsovereenkomst voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.5'
    text: |-
      Van een voortgezette arbeidsovereenkomst als bedoeld in lid 4 is eveneens sprake indien eenzelfde werknemer
      achtereenvolgens in dienst is geweest bij verschillende werkgevers die redelijkerwijze geacht moeten worden ten
      aanzien van de verrichte arbeid elkanders opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.6'
    text: Voor de beëindiging van een voor onbepaalde tijd aangegane arbeidsovereenkomst is voorafgaande opzegging nodig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.7'
    text: |-
      Een beding, krachtens hetwelk de arbeidsovereenkomst van rechtswege eindigt wegens het in het huwelijk treden van
      de werknemer of wegens het aangaan van een geregistreerd partnerschap door de werknemer, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '667.8'
    text: |-
      Een beding, krachtens hetwelk de arbeidsovereenkomst van rechtswege eindigt wegens zwangerschap of bevalling van de
      werkneemster, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel667
  - number: '668.1'
    text: |-
      Indien de arbeidsovereenkomst na het verstrijken van de tijd, bedoeld in [artikel 667 lid 1][ref1], door partijen
      zonder tegenspraak wordt voortgezet, wordt zij geacht voor dezelfde tijd, doch telkens ten hoogste voor een jaar,
      op de vroegere voorwaarden wederom te zijn aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel667
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '667'
        afdeling: '9'
  - number: '668.2'
    text: |-
      Hetzelfde geldt, wanneer in de gevallen waarin opzegging nodig is, tijdige opzegging achterwege blijft en de
      gevolgen van de voortzetting der arbeidsovereenkomst niet opzettelijk zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668
  - number: 668a.1
    text: 'Vanaf de dag dat tussen dezelfde partijen:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.1.a
    text: |-
      arbeidsovereenkomsten voor bepaalde tijd elkaar met tussenpozen van niet meer dan drie maanden hebben opgevolgd
      en een periode van 36 maanden, deze tussenpozen inbegrepen, hebben overschreden, geldt met ingang van die dag de
      laatste arbeidsovereenkomst als aangegaan voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.1.b
    text: |-
      meer dan 3 voor bepaalde tijd aangegane arbeidsovereenkomsten elkaar hebben opgevolgd met tussenpozen van niet meer
      dan 3 maanden, geldt de laatste arbeidsovereenkomst als aangegaan voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.2
    text: |-
      Lid 1 is van overeenkomstige toepassing op elkaar opvolgende arbeidsovereenkomsten tussen een werknemer en
      verschillende werkgevers, die ten aanzien van de verrichte arbeid redelijkerwijze geacht moeten worden elkanders
      opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.3
    text: |-
      Lid 1, onderdeel a en laatste zinsnede, is niet van toepassing op een arbeidsovereenkomst aangegaan voor niet meer
      dan 3 maanden die onmiddellijk volgt op een tussen dezelfde partijen aangegane arbeidsovereenkomst voor 36 maanden
      of langer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.4
    text: |-
      De termijn van opzegging wordt berekend vanaf het tijdstip van totstandkoming van de eerste arbeidsovereenkomst als
      bedoeld onder a of b van lid 1.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: 668a.5
    text: |-
      Van de leden 1 tot en met 4 kan slechts bij collectieve arbeidsovereenkomst of bij regeling door of namens een
      daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel668a
  - number: '669'
    text: |-
      Degene die de arbeidsovereenkomst opzegt, geeft de andere partij op diens verzoek schriftelijk opgave van de reden
      van opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel669
  - number: '670.1'
    text: |-
      De werkgever kan niet opzeggen gedurende de tijd dat de werknemer ongeschikt is tot het verrichten van zijn arbeid
      wegens ziekte, tenzij de ongeschiktheid:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
  - number: 670.1.a
    text: ten minste twee jaren heeft geduurd, of
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
  - number: 670.1.b
    text: |-
      een aanvang heeft genomen nadat een verzoek om toestemming als bedoeld in
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] door de Centrale organisatie werk en
      inkomen, genoemd in [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: '670.2'
    text: |-
      De werkgever kan de arbeidsovereenkomst met een werkneemster niet opzeggen gedurende de zwangerschap. De werkgever
      kan ter staving van de zwangerschap een verklaring van een arts of van een verloskundige verlangen. Voorts kan de
      werkgever de arbeidsovereenkomst van de werkneemster niet opzeggen gedurende de periode waarin zij bevallingsverlof
      als bedoeld in [artikel 3:1, derde lid, van de Wet arbeid en zorg][ref1] geniet en na werkhervatting, gedurende het
      tijdvak van zes weken aansluitend op dat bevallingsverlof, dan wel aansluitend op een periode van ongeschiktheid
      tot het verrichten van arbeid die haar oorzaak vindt in de bevalling of de daaraan voorafgaande zwangerschap en die
      aansluit op dat bevallingsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '670.3'
    text: |-
      De werkgever kan niet opzeggen gedurende de tijd dat de werknemer verhinderd is de bedongen arbeid te verrichten,
      omdat hij als dienstplichtige is opgeroepen ter vervulling van zijn militaire dienst of vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
  - number: '670.4'
    text: |-
      De werkgever kan de arbeidsovereenkomst met de werknemer die lid is van een ondernemingsraad, van
      een centrale ondernemingsraad, van een groepsondernemingsraad, van een vaste commissie van die
      raden of van een onderdeelcommissie van de ondernemingsraad, van een personeelsvertegenwoordiging
      of van een bijzondere onderhandelingsgroep of een Europese ondernemingsraad als bedoeld in de
      [Wet op de Europese ondernemingsraden][ref1], dan wel die krachtens die wet optreedt als vertegenwoordiger bij
      een andere wijze van informatieverstrekking en raadpleging van werknemers, niet opzeggen. Indien de werkgever aan
      de ondernemingsraad of de personeelsvertegenwoordiging een secretaris heeft toegevoegd, is de eerste volzin op
      die secretaris van overeenkomstige toepassing. Indien de werkgever aan de ondernemingsraad een secretaris heeft
      toegevoegd, is de eerste volzin van dit lid van overeenkomstige toepassing op die secretaris.


      [ref1]: https://wetten.overheid.nl/BWBR0008508
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0008508
  - number: '670.5'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen wegens het lidmaatschap van de werknemer van een vereniging
      van werknemers die krachtens haar statuten ten doel heeft de belangen van de leden als werknemer te behartigen dan
      wel wegens het verrichten van of deelnemen aan activiteiten ten behoeve van die vereniging, tenzij die activiteiten
      in de arbeidstijd van de werknemer worden verricht zonder toestemming van de werkgever.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
  - number: '670.6'
    text: |-
      De werkgever kan de arbeidsovereenkomst met de werknemer die daarvoor verlof heeft, niet opzeggen wegens het
      bijwonen van vergaderingen als bedoeld in [artikel 643][ref1]. Hetzelfde geldt indien tussen partijen geen
      overeenstemming over het verlof bestaat zolang de rechter omtrent het verlof niet heeft beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel643
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '643'
        afdeling: '3'
  - number: '670.7'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen wegens de omstandigheid dat de werknemer zijn recht op
      ouderschapsverlof als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref1] geldend maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '670.8'
    text: |-
      Van de leden 1 en 3 kan slechts worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling door of namens
      een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670
  - number: 670a.1
    text: |-
      De werkgever kan zonder voorafgaande toestemming van de kantonrechter de arbeidsovereenkomst niet opzeggen met een
      werknemer die:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
  - number: 670a.1.a
    text: |-
      geplaatst is op een kandidatenlijst voor een ondernemingsraad dan wel een personeelsvertegenwoordiging of
      korter dan twee jaar geleden lid is geweest van een ondernemingsraad, van een centrale ondernemingsraad,
      van een groepsondernemingsraad of van een commissie van die raden, van een personeelsvertegenwoordiging
      of van een bijzondere onderhandelingsgroep of een Europese ondernemingsraad als bedoeld in de
      [Wet op de Europese ondernemingsraden][ref1]dan wel die korter dan twee jaar geleden krachtens die wet is
      opgetreden als vertegenwoordiger bij een andere wijze van informatieverstrekking en raadpleging van werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0008508
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0008508
  - number: 670a.1.b
    text: |-
      lid is van een voorbereidingscommissie van een ondernemingsraad, van een centrale ondernemingsraad of van een
      groepsondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
  - number: 670a.1.c
    text: |-
      als deskundige werknemer als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1]
      werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 670a.1.d
    text: |-
      een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1] werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: 670a.2
    text: |-
      De toestemming van de kantonrechter wordt gevraagd bij verzoekschrift. De kantonrechter verleent de toestemming
      slechts indien de werkgever aannemelijk heeft gemaakt dat opzegging geen verband houdt met een omstandigheid als
      bedoeld in lid 1. Van de uitspraak staat geen hoger beroep of beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670a
  - number: 670b.1
    text: |-
      De [artikelen 670][ref1] en [670a][ref2] zijn niet van toepassing bij een opzegging gedurende de proeftijd of
      wegens een dringende reden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: 670b.2
    text: |-
      [De leden 1 tot en met 7 van artikel 670][ref1] en [artikel 670a][ref2] zijn niet van toepassing
      indien de werknemer schriftelijk met de opzegging instemt of indien de opzegging geschiedt wegens de
      beëindiging van de werkzaamheden van de onderneming of van het onderdeel van de onderneming, waarin de
      werknemer uitsluitend of in hoofdzaak werkzaam is. De opzegging wegens beëindiging van de werkzaamheden
      kan evenwel niet betreffen de werkneemster die zwangerschaps- of bevallingsverlof geniet als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 670b.3
    text: |-
      [Artikel 670, lid 1, aanhef en onder a][ref1], is niet van toepassing, indien de werknemer die in verband met
      ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te verrichten, zonder deugdelijke grond
      weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
  - number: 670b.3.a
    text: |-
      gevolg te geven aan door de werkgever of een door hem aangewezen deskundige gegeven redelijke voorschriften en
      mee te werken aan door de werkgever of een door hem aangewezen deskundige getroffen maatregelen om hem in staat te
      stellen de eigen of andere passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
  - number: 670b.3.b
    text: |-
      passende arbeid als bedoeld in [artikel 658a lid 3][ref1] te verrichten waartoe de werkgever hem in de gelegenheid
      stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 670b.3.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '672.1'
    text: |-
      Opzegging geschiedt tegen het einde van de maand, tenzij bij schriftelijke overeenkomst of door het gebruik een
      andere dag daarvoor is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.2'
    text: |-
      De door de werkgever in acht te nemen termijn van opzegging bedraagt bij een arbeidsovereenkomst die op de dag
      van opzegging:
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: 672.2.a
    text: 'korter dan vijf jaar heeft geduurd: één maand;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: 672.2.b
    text: 'vijf jaar of langer, maar korter dan tien jaar heeft geduurd: twee maanden;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: 672.2.c
    text: 'tien jaar of langer, maar korter dan vijftien jaar heeft geduurd: drie maanden;'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: 672.2.d
    text: 'vijftien jaar of langer heeft geduurd: vier maanden.'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.3'
    text: De door de werknemer in acht te nemen termijn van opzegging bedraagt één maand.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.4'
    text: |-
      Indien de toestemming bedoeld in [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945](onbekend)
      is verleend, wordt de door de werkgever in acht te nemen termijn van opzegging verkort met één maand, met dien
      verstande dat de resterende termijn van opzegging ten minste één maand bedraagt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.5'
    text: |-
      De termijn, bedoeld in lid 2, kan slechts worden verkort bij collectieve arbeidsovereenkomst of bij regeling door
      of namens een daartoe bevoegd bestuursorgaan. De termijn kan schriftelijk worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.6'
    text: |-
      Van de termijn, bedoeld in lid 3, kan schriftelijk worden afgeweken. De termijn van opzegging voor de werknemer
      mag bij verlenging niet langer zijn dan zes maanden en voor de werkgever niet korter dan het dubbele van die voor
      de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.7'
    text: |-
      Van lid 4 kan, voor zover het betreft de resterende termijn van opzegging van één maand, slechts bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele
      van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.8'
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan, mag de
      termijn van opzegging, bedoeld in lid 6, tweede volzin, voor de werkgever worden verkort, mits de termijn niet
      korter is dan die voor de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
  - number: '672.9'
    text: |-
      Voor de toepassing van lid 2 worden arbeidsovereenkomsten geacht eenzelfde, niet onderbroken arbeidsovereenkomst te
      vormen in geval van herstel van de arbeidsovereenkomst ingevolge [artikel 682][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel672
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '674.1'
    text: De arbeidsovereenkomst eindigt door de dood van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
  - number: '674.2'
    text: |-
      Niettemin is de werkgever verplicht aan de nagelaten betrekkingen van de werknemer over de periode vanaf de dag na
      overlijden tot en met één maand na de dag van het overlijden, een uitkering te verlenen ten bedrage van het loon
      dat de werknemer laatstelijk rechtens toekwam.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
  - number: '674.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder nagelaten betrekkingen verstaan de langstlevende der echtgenoten
      dan wel geregistreerde partners van wie de werknemer niet duurzaam gescheiden leefde dan wel degene met wie
      de werknemer ongehuwd samenleefde, bij ontstentenis van deze de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond en bij ontstentenis van dezen degene met wie de werknemer in gezinsverband
      leefde en in wiens kosten van bestaan hij grotendeels voorzag. Van ongehuwd samenleven als bedoeld in de eerste zin
      is sprake indien twee ongehuwde personen een gezamenlijke huishouding voeren, met uitzondering van bloedverwanten
      in de eerste graad. Van een gezamenlijke huishouding als bedoeld in de tweede zin is sprake indien de betrokkenen
      hun hoofdverblijf hebben in dezelfde woning en zij blijk geven zorg te dragen voor elkaar door middel van het
      leveren van een bijdrage in de kosten van de huishouding dan wel op andere wijze in elkaars verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
  - number: '674.4'
    text: |-
      De overlijdensuitkering, bedoeld in lid 2, kan worden verminderd met het bedrag van de uitkering dat aan de
      nagelaten betrekkingen ter zake van het overlijden van de werknemer toekomt krachtens een wettelijk voorgeschreven
      ziekte- of arbeidsongeschiktheidsverzekering en krachtens de [Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '674.5'
    text: |-
      Lid 2 geldt niet indien de werknemer onmiddellijk voorafgaande aan het overlijden door toepassing van
      [artikel 629 lid 3][ref1], geen aanspraak had op loon als bedoeld in [artikel 629 lid 1][ref2] of indien
      ten gevolge van het toedoen van de werknemer geen aanspraak bestaat op een uitkering krachtens een wettelijk
      voorgeschreven ziekte- of arbeidsongeschiktheidsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
  - number: '674.6'
    text: Van dit artikel kan niet ten nadele van de nagelaten betrekkingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel674
  - number: '675'
    text: |-
      De arbeidsovereenkomst eindigt niet door de dood van de werkgever, tenzij uit de overeenkomst het tegendeel
      voortvloeit. Echter zijn zowel de erfgenamen van de werkgever als de werknemer bevoegd de arbeidsovereenkomst,
      voor een bepaalde tijd aangegaan, op te zeggen met inachtneming van de [artikelen 670][ref1], [670a][ref2] en
      [672][ref3], als ware zij aangegaan voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel672
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel675
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
  - number: '676.1'
    text: |-
      Indien een proeftijd is bedongen, is ieder der partijen, zolang die tijd niet is verstreken, bevoegd de
      arbeidsovereenkomst met onmiddellijke ingang op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel676
  - number: '676.2'
    text: |-
      Bij een zodanige opzegging zijn de [artikelen 681][ref1] en [682][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel676
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '681'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '677.1'
    text: |-
      Ieder der partijen is bevoegd de arbeidsovereenkomst onverwijld op te zeggen om een dringende reden, onder
      gelijktijdige mededeling van die reden aan de wederpartij. De partij die opzegt zonder een dringende reden of
      zonder gelijktijdige mededeling van de dringende reden is schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel677
  - number: '677.2'
    text: De partij die opzegt tegen een eerdere dag dan tussen partijen geldt, is schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel677
  - number: '677.3'
    text: |-
      Eveneens is schadeplichtig de partij die door opzet of schuld aan de wederpartij een dringende reden heeft gegeven
      om de arbeidsovereenkomst onverwijld op te zeggen, indien de wederpartij van die bevoegdheid heeft gebruik gemaakt
      of de rechter op die grond krachtens [artikel 685][ref1] de arbeidsovereenkomst heeft ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: '677.4'
    text: |-
      Ingeval een der partijen schadeplichtig is, heeft de wederpartij de keus de in [artikel 680][ref1] genoemde
      gefixeerde schadevergoeding of een volledige schadevergoeding te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
        afdeling: '9'
  - number: '677.5'
    text: |-
      Het niet in acht nemen van [artikel 670 leden 1 tot en met 7][ref1], of van [artikel 670a][ref2] maakt de
      werkgever niet schadeplichtig. De werknemer kan in die gevallen gedurende twee maanden na de opzegging van de
      arbeidsovereenkomst een beroep doen op de vernietigingsgrond. Het beroep op de vernietigingsgrond geschiedt door
      kennisgeving aan de werkgever. [Artikel 55 van Boek 3][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '678.1'
    text: |-
      Voor de werkgever worden als dringende redenen in de zin van [lid 1 van artikel 677][ref1] beschouwd zodanige
      daden, eigenschappen of gedragingen van de werknemer, die ten gevolge hebben dat van de werkgever redelijkerwijze
      niet kan gevergd worden de arbeidsovereenkomst te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '678.2'
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.a
    text: |-
      wanneer de werknemer bij het sluiten van de overeenkomst de werkgever heeft misleid door het vertonen van valse of
      vervalste getuigschriften, of deze opzettelijk valse inlichtingen heeft gegeven omtrent de wijze waarop zijn vorige
      arbeidsovereenkomst is geëindigd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.b
    text: |-
      wanneer hij in ernstige mate de bekwaamheid of geschiktheid blijkt te missen tot de arbeid waarvoor hij zich heeft
      verbonden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.c
    text: wanneer hij zich ondanks waarschuwing overgeeft aan dronkenschap of ander liederlijk gedrag;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.d
    text: |-
      wanneer hij zich schuldig maakt aan diefstal, verduistering, bedrog of andere misdrijven, waardoor hij het
      vertrouwen van de werkgever onwaardig wordt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.e
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medewerknemers mishandelt, grovelijk beledigt
      of op ernstige wijze bedreigt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.f
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medewerknemers verleidt of tracht te verleiden
      tot handelingen, strijdig met de wetten of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.g
    text: |-
      wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, eigendom van de werkgever beschadigt of aan ernstig
      gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.h
    text: wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, zich zelf of anderen aan ernstig gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.i
    text: |-
      wanneer hij bijzonderheden aangaande de huishouding of het bedrijf van de werkgever, die hij behoorde geheim te
      houden, bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.j
    text: |-
      wanneer hij hardnekkig weigert te voldoen aan redelijke bevelen of opdrachten, hem door of namens de werkgever
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.k
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt, welke de arbeidsovereenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: 678.2.l
    text: wanneer hij door opzet of roekeloosheid buiten staat geraakt of blijft de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
  - number: '678.3'
    text: |-
      Bedingen waarbij aan de werkgever de beslissing wordt overgelaten of er een dringende reden in de zin van
      [artikel 677 lid 1][ref1] aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel678
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '679.1'
    text: |-
      Voor de werknemer worden als dringende redenen in de zin van [artikel 677 lid 1][ref1] beschouwd zodanige
      omstandigheden, die ten gevolge hebben dat van de werknemer redelijkerwijze niet kan gevergd worden de
      arbeidsovereenkomst te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '679.2'
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.a
    text: |-
      wanneer de werkgever de werknemer, diens familieleden of huisgenoten mishandelt, grovelijk beledigt of op ernstige
      wijze bedreigt, of gedoogt dat dergelijke handelingen door een van zijn huisgenoten of ondergeschikten worden
      gepleegd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.b
    text: |-
      wanneer hij de werknemer, diens familieleden of huisgenoten verleidt of tracht te verleiden tot handelingen,
      strijdig met de wetten of de goede zeden, of gedoogt dat een dergelijke verleiding of poging tot verleiding door
      een van zijn huisgenoten of ondergeschikten worden gepleegd;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.c
    text: wanneer hij het loon niet op de daarvoor bepaalde tijd voldoet;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.d
    text: wanneer hij, waar kost en inwoning overeengekomen zijn, niet op behoorlijke wijze daarin voorziet;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.e
    text: |-
      wanneer hij de werknemer wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, geen
      voldoende arbeid verschaft;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.f
    text: |-
      wanneer hij de werknemer wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, de
      bedongen hulp niet of niet in behoorlijke mate verschaft;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.g
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt welke de arbeidsovereenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.h
    text: |-
      wanneer hij, zonder dat de aard van de arbeidsovereenkomst dit medebrengt, de werknemer niettegenstaande diens
      weigering gelast arbeid in het bedrijf van een andere werkgever te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.i
    text: |-
      wanneer de voortduring van de arbeidsovereenkomst voor de werknemer zou zijn verbonden met ernstige gevaren
      voor leven, gezondheid, zedelijkheid of goede naam, die niet duidelijk waren ten tijde van het sluiten van de
      arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: 679.2.j
    text: |-
      wanneer de werknemer door ziekte of andere oorzaken zonder zijn toedoen buiten staat geraakt de bedongen arbeid
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
  - number: '679.3'
    text: |-
      Bedingen waarbij aan de werknemer de beslissing wordt overgelaten of er een dringende reden in de zin van
      [artikel 677 lid 1][ref1] aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel679
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '680.1'
    text: |-
      De gefixeerde schadevergoeding, bedoeld in [artikel 677 lid 4][ref1], is gelijk aan het bedrag van het in geld
      vastgesteld loon voor de tijd, dat de arbeidsovereenkomst bij regelmatige opzegging had behoren voort te duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '680.2'
    text: |-
      Is het loon van de werknemer, hetzij voor het geheel, hetzij gedeeltelijk, niet naar tijdruimte vastgesteld, dan
      geldt de maatstaf van [artikel 618][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel618
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '618'
        afdeling: '2'
  - number: '680.3'
    text: |-
      Elk beding waarbij ten behoeve van de werknemer een gefixeerde schadevergoeding tot een lager bedrag wordt
      bedongen, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
  - number: '680.4'
    text: Bij schriftelijke overeenkomst mag een gefixeerde schadevergoeding tot een hoger bedrag worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
  - number: '680.5'
    text: |-
      De rechter is bevoegd de gefixeerde schadevergoeding, zo deze hem met het oog op de omstandigheden van het geval
      bovenmatig voorkomt, op een kleinere som te bepalen, doch niet op minder dan het in geld vastgesteld loon voor de
      duur van de opzeggingstermijn ingevolge [artikel 672][ref1], noch op minder dan het in geld vastgesteld loon voor
      3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
  - number: '680.6'
    text: |-
      Indien de door de werknemer verschuldigde gefixeerde schadevergoeding meer bedraagt dan het in geld vastgesteld
      loon voor een maand of de door de werkgever verschuldigde gefixeerde schadevergoeding meer bedraagt dan het in geld
      vastgesteld loon voor 3 maanden, kan de rechter toestaan dat de schadevergoeding op door hem te bepalen wijze in
      termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
  - number: '680.7'
    text: |-
      Over het bedrag van de verschuldigde gefixeerde schadevergoeding is de wettelijke rente verschuldigd, te rekenen
      van de dag waarop de arbeidsovereenkomst is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680
  - number: 680a
    text: |-
      De rechter is bevoegd een vordering tot doorbetaling van loon die gegrond is op de vernietigbaarheid van de
      opzegging van de arbeidsovereenkomst te matigen, indien toewijzing in de gegeven omstandigheden tot onaanvaardbare
      gevolgen zou leiden, doch op niet minder dan het in geld vastgestelde loon voor de duur van de opzegtermijn
      ingevolge [artikel 672][ref1] noch op minder dan het in geld vastgestelde loon voor drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel680a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
  - number: '681.1'
    text: |-
      Indien een van de partijen de arbeidsovereenkomst, al of niet met inachtneming van de voor de opzegging geldende
      bepalingen, kennelijk onredelijk opzegt, kan de rechter steeds aan de wederpartij een schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: '681.2'
    text: 'Opzegging van de arbeidsovereenkomst door de werkgever zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.2.a
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.2.b
    text: |-
      wanneer, mede in aanmerking genomen de voor de werknemer getroffen voorzieningen en de voor hem bestaande
      mogelijkheden om ander passend werk te vinden, de gevolgen van de opzegging voor hem te ernstig zijn in
      vergelijking met het belang van de werkgever bij de opzegging;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.2.c
    text: |-
      wanneer deze geschiedt in verband met een verhindering van de werknemer om de bedongen arbeid te verrichten als
      bedoeld in [artikel 670 lid 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
  - number: 681.2.d
    text: |-
      wanneer deze geschiedt in afwijking van een in de bedrijfstak of de onderneming krachtens wettige regeling of
      gebruik geldende getalsverhouding- of anciënniteitsregeling, tenzij hiervoor zwaarwichtige gronden aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.2.e
    text: |-
      wanneer deze geschiedt wegens het enkele feit dat de werknemer met een beroep op een ernstig gewetensbezwaar
      weigert de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: '681.3'
    text: 'Opzegging van de arbeidsovereenkomst door de werknemer zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.3.a
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: 681.3.b
    text: |-
      wanneer de gevolgen van de opzegging voor de werkgever te ernstig zijn in vergelijking met het belang van de
      werknemer bij de opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: '681.4'
    text: |-
      Een beding waarbij aan een van de partijen de beslissing wordt overgelaten of de arbeidsovereenkomst al of niet
      kennelijk onredelijk is opgezegd, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel681
  - number: '682.1'
    text: |-
      De rechter kan de werkgever die schadeplichtig is geworden volgens [artikel 677][ref1] of die de
      arbeidsovereenkomst kennelijk onredelijk opzegt, ook veroordelen de arbeidsovereenkomst te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel682
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '682.2'
    text: |-
      Indien de rechter een zodanige veroordeling uitspreekt, kan hij bepalen voor of op welk tijdstip de
      arbeidsovereenkomst moet worden hersteld en kan hij voorzieningen treffen omtrent de rechtsgevolgen van de
      onderbreking.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel682
  - number: '682.3'
    text: |-
      De rechter kan in het vonnis, houdende de veroordeling tot herstel van de arbeidsovereenkomst, bepalen dat de
      verplichting tot herstel vervalt door betaling van een in het vonnis vastgestelde afkoopsom. Is in het vonnis
      geen afkoopsom vastgesteld, dan zal de rechter deze op verzoek van de werkgever alsnog vaststellen. Een zodanig
      verzoek schorst de tenuitvoerlegging van het vonnis, voor zover het betreft de veroordeling tot herstel van de
      arbeidsovereenkomst, totdat op het verzoek is beslist, met dien verstande dat de werkgever in ieder geval verplicht
      blijft gedurende de schorsing het loon te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel682
  - number: '682.4'
    text: |-
      De rechter stelt de hoogte van de afkoopsom met het oog op de omstandigheden van het geval naar billijkheid vast;
      hij kan toestaan dat de afkoopsom op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel682
  - number: '682.5'
    text: |-
      Indien een afkoopsom wegens het niet naleven van een verplichting om een arbeidsovereenkomst te herstellen op
      andere wijze is vastgesteld, kan de rechter het bedrag van de verschuldigde afkoopsom op verzoek van de meest
      gerede partij wijzigen in zodanig bedrag als hem met het oog op de omstandigheden van het geval billijk zal
      voorkomen en kan hij toelaten dat de afkoopsom op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel682
  - number: '683.1'
    text: |-
      Iedere rechtsvordering krachtens [artikelen 677 lid 4][ref1], [681 lid 1][ref2] en [682 lid 1][ref3], verjaart na
      verloop van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel683
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '681'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '683.2'
    text: |-
      Iedere rechtsvordering van de werknemer in verband met de vernietiging van de opzegging van de arbeidsovereenkomst
      krachtens [artikel 677 lid 5][ref1], verjaart na verloop van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel683
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '684.1'
    text: |-
      Indien de arbeidsovereenkomst is aangegaan voor langer dan vijf jaren of voor de duur van het leven van een
      bepaalde persoon, is niettemin de werknemer bevoegd, van het tijdstip waarop vijf jaren sedert haar aanvang zijn
      verlopen, haar op te zeggen met inachtneming van een termijn van zes maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel684
  - number: '684.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel684
  - number: '685.1'
    text: |-
      Ieder der partijen is te allen tijde bevoegd zich tot de kantonrechter te wenden met het verzoek de
      arbeidsovereenkomst wegens gewichtige redenen te ontbinden. Elk beding waarbij deze bevoegdheid wordt uitgesloten
      of beperkt, is nietig. De kantonrechter kan het verzoek slechts inwilligen indien hij zich ervan heeft vergewist of
      het verzoek verband houdt met het bestaan van een opzegverbod als bedoeld in de [artikelen 647][ref1], [648][ref2],
      [670][ref3] en [670a][ref4] of enig ander verbod tot opzegging van de arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel647
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel648
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '647'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '648'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: '685.2'
    text: |-
      Als gewichtige redenen worden beschouwd omstandigheden die een dringende reden als bedoeld in
      [artikel 677 lid 1][ref1] zouden hebben opgeleverd indien de arbeidsovereenkomst deswege onverwijld opgezegd
      zou zijn, alsook veranderingen in de omstandigheden, welke van dien aard zijn, dat de arbeidsovereenkomst
      billijkheidshalve dadelijk of na korte tijd behoort te eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '685.3'
    text: |-
      Het verzoek wordt gedaan aan de ingevolge de [tweede afdeling van de derde titel van het eerste boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend) bevoegde kantonrechter, dan wel aan de kantonrechter binnen
      wiens rechtsgebied de arbeid gewoonlijk wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.4'
    text: |-
      Het verzoekschrift vermeldt de plaats waar de arbeid gewoonlijk wordt verricht, alsmede de naam en de woonplaats of
      bij gebreke van een woonplaats in Nederland het werkelijk verblijf van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.5'
    text: |-
      De kantonrechter kan, indien het verzoek verknocht is aan een zaak die tussen dezelfde personen reeds voor een
      andere rechter aanhangig is, de verwijzing naar die andere rechter bevelen. De griffier zendt een afschrift van de
      beschikking, alsmede het verzoekschrift en de overige stukken van het geding ter verdere behandeling aan de rechter
      naar wie is verwezen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.6'
    text: De behandeling vangt niet later aan dan in de vierde week volgende op die waarin het verzoekschrift is ingediend.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.7'
    text: Indien de rechter het verzoek inwilligt, bepaalt hij op welk tijdstip de arbeidsovereenkomst eindigt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.8'
    text: |-
      Indien de rechter het verzoek inwilligt wegens veranderingen in de omstandigheden kan hij, zo hem dat met het
      oog op de omstandigheden van het geval billijk voorkomt, aan een van de partijen ten laste van de wederpartij een
      vergoeding toekennen; hij kan toestaan dat de vergoeding op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.9'
    text: |-
      Alvorens een ontbinding waaraan een vergoeding verbonden wordt, uit te spreken, stelt de rechter de partijen van
      zijn voornemen in kennis en stelt hij een termijn, binnen welke de verzoeker de bevoegdheid heeft zijn verzoek in
      te trekken. Indien de verzoeker dat doet, zal de rechter alleen een beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.10'
    text: |-
      Lid 9 is van overeenkomstige toepassing indien de rechter voornemens is een ontbinding uit te spreken zonder
      daaraan een door de verzoeker verzochte vergoeding te verbinden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '685.11'
    text: Tegen een beschikking krachtens dit artikel kan hoger beroep noch cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel685
  - number: '686'
    text: |-
      De bepalingen van deze afdeling sluiten voor geen van beide partijen de mogelijkheid uit van ontbinding wegens een
      tekortkoming in de nakoming van de overeenkomst en van schadevergoeding. De ontbinding kan slechts door de rechter
      worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel686
  - number: '687'
    text: |-
      De overeenkomst van handelsvertegenwoordiging is een arbeidsovereenkomst waarbij de ene partij, de
      handelsvertegenwoordiger, zich tegenover de andere partij, de patroon, verbindt tegen loon dat geheel of
      gedeeltelijk uit provisie bestaat, bij de totstandkoming van overeenkomsten bemiddeling te verlenen, en deze
      eventueel in naam van de patroon te sluiten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel687
  - number: '688.1'
    text: |-
      Op de overeenkomst van handelsvertegenwoordiging zijn de [artikelen 426][ref1], [429][ref2],
      [430 leden 2 tot en met 4][ref3], [431][ref4], [432][ref5], [433][ref6] en [434][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel429
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel430
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel431
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel433
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel434
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '429'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '432'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '434'
        afdeling: '4'
  - number: '688.2'
    text: |-
      Van de [artikelen 426 lid 2][ref1], [429][ref2], [430 leden 2 tot en met 4][ref3], [431 lid 2][ref4] en [433][ref5]
      kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel429
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel430
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel431
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel433
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '429'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
  - number: '688.3'
    text: |-
      Van de [artikelen 432 lid 3][ref1] en [434][ref2] kan niet ten nadele van de handelsvertegenwoordiger worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel434
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '432'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '434'
        afdeling: '4'
  - number: '688.4'
    text: |-
      Van de [artikelen 426 lid 1][ref1] en [431 lid 1][ref2] kan slechts schriftelijk ten nadele van de
      handelsvertegenwoordiger worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel431
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
  - number: '689'
    text: |-
      In afwijking van het bepaalde in [artikel 680 lid 2][ref1] wordt voor de vaststelling van de gefixeerde
      schadevergoeding, bedoeld in [artikel 677 lid 4][ref2], rekening gehouden met de in de voorafgaande tijd verdiende
      provisie en met alle andere ter zake in acht te nemen factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel689
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '690'
    text: |-
      De uitzendovereenkomst is de arbeidsovereenkomst waarbij de werknemer door de werkgever, in het kader van de
      uitoefening van het beroep of bedrijf van de werkgever ter beschikking wordt gesteld van een derde om krachtens een
      door deze aan de werkgever verstrekte opdracht arbeid te verrichten onder toezicht en leiding van de derde.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel690
  - number: '691.1'
    text: |-
      Op de uitzendovereenkomst is [artikel 668a][ref1] eerst van toepassing zodra de werknemer in meer dan 26 weken
      arbeid heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
        afdeling: '9'
  - number: '691.2'
    text: |-
      In de uitzendovereenkomst kan schriftelijk worden bedongen dat die overeenkomst van rechtswege eindigt doordat
      de terbeschikkingstelling van de werknemer door de werkgever aan de derde als bedoeld in [artikel 690][ref1] op
      verzoek van die derde ten einde komt. Indien een beding als bedoeld in de vorige volzin in de uitzendovereenkomst
      is opgenomen, kan de werknemer die overeenkomst onverwijld opzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '691.3'
    text: |-
      Een beding als bedoeld in lid 2 verliest zijn kracht indien de werknemer in meer dan 26 weken arbeid voor de
      werkgever heeft verricht. Na het verstrijken van deze termijn vervalt de bevoegdheid van de werknemer tot opzegging
      als bedoeld in lid 2.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
  - number: '691.4'
    text: |-
      Voor de berekening van de termijnen, bedoeld in de leden 1 en 3, worden perioden waarin arbeid wordt verricht die
      elkaar opvolgen met tussenpozen van minder dan een jaar mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
  - number: '691.5'
    text: |-
      Voor de berekening van de termijnen, bedoeld in de leden 1 en 3, worden perioden waarin voor verschillende
      werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid redelijkerwijze geacht moeten worden
      elkanders opvolger te zijn mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
  - number: '691.6'
    text: |-
      Dit artikel is niet van toepassing op de uitzendovereenkomst waarbij de werkgever en de derde in een groep zijn
      verbonden als bedoeld in [artikel 24b van Boek 2][ref1] dan wel de één een dochtermaatschappij is van de ander als
      bedoeld in [artikel 24a van Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '691.7'
    text: |-
      Van de termijnen bedoeld in de leden 1, 3 en 4 en van lid 5 kan slechts bij collectieve arbeidsovereenkomst of bij
      regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel691
  - number: '850.1'
    text: |-
      Borgtocht is de overeenkomst waarbij de ene partij, de borg, zich tegenover de andere partij, de schuldeiser,
      verbindt tot nakoming van een verbintenis, die een derde, de hoofdschuldenaar, tegenover de schuldeiser heeft of
      zal krijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel850
  - number: '850.2'
    text: Voor de geldigheid van een borgtocht is niet vereist dat de hoofdschuldenaar deze kent.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel850
  - number: '850.3'
    text: |-
      Op borgtocht zijn de bepalingen omtrent hoofdelijke verbintenissen van toepassing, voor zover daarvan in deze titel
      niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel850
  - number: '851.1'
    text: De borgtocht is afhankelijk van de verbintenis van de hoofdschuldenaar, waarvoor zij is aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel851
  - number: '851.2'
    text: |-
      Borgtocht kan slechts voor toekomstige verbintenissen van de hoofdschuldenaar worden aangegaan, voor zover zij
      voldoende bepaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel851
  - number: '852.1'
    text: |-
      Verweermiddelen die de hoofdschuldenaar jegens de schuldeiser heeft, kunnen ook door de borg worden ingeroepen,
      indien zij het bestaan, de inhoud of het tijdstip van nakoming van de verbintenis van de hoofdschuldenaar
      betreffen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel852
  - number: '852.2'
    text: |-
      Indien de hoofdschuldenaar bevoegd is om ter vernietiging van de rechtshandeling waaruit de verbintenis
      voortspruit, een beroep op een vernietigingsgrond te doen en hem door de borg of door de schuldeiser een redelijke
      termijn is gesteld ter uitoefening van die bevoegdheid, is de borg gedurende die termijn bevoegd de nakoming van
      zijn verbintenis op te schorten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel852
  - number: '852.3'
    text: |-
      Zolang de hoofdschuldenaar bevoegdelijk de nakoming van zijn verbintenis jegens de schuldeiser opschort, is ook de
      borg bevoegd de nakoming van zijn verbintenis op te schorten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel852
  - number: '853'
    text: |-
      Door voltooiing van de verjaring van de rechtsvordering tot nakoming van de verbintenis van de hoofdschuldenaar,
      gaat de borgtocht teniet.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel853
  - number: '854'
    text: |-
      Strekt de verbintenis van de hoofdschuldenaar tot iets anders dan tot betaling van een geldsom, dan geldt
      de borgtocht voor de vordering tot schadevergoeding in geld, verschuldigd op grond van niet-nakoming van die
      verbintenis, tenzij uitdrukkelijk anders is bedongen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel854
  - number: '855.1'
    text: |-
      De borg is niet gehouden tot nakoming voordat de hoofdschuldenaar in de nakoming van zijn verbintenis is tekort
      geschoten.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel855
  - number: '855.2'
    text: |-
      De schuldeiser die de hoofdschuldenaar overeenkomstig [artikel 82 van Boek 6][ref1] in gebreke stelt, is verplicht
      hiervan tegelijkertijd de borg mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel82
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '82'
  - number: '856.1'
    text: |-
      De borg is slechts wettelijke rente verschuldigd over het tijdvak dat hijzelf in verzuim is, tenzij de
      hoofdschuldenaar in verzuim is krachtens [artikel 83 onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel83
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel856
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '83'
  - number: '856.2'
    text: |-
      De borg is gehouden de kosten van rechtsvervolging van de hoofdschuldenaar te vergoeden, indien hij tijdig door
      mededeling van het voornemen tot rechtsvervolging in de gelegenheid is gesteld deze kosten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel856
  - number: '857'
    text: |-
      De bepalingen van deze afdeling zijn van toepassing op borgtochten die zijn aangegaan door een natuurlijk persoon
      die noch handelde in de uitoefening van zijn beroep of bedrijf, noch ten behoeve van de normale uitoefening van
      het bedrijf van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid, waarvan hij
      bestuurder is en alleen of met zijn medebestuurders de meerderheid der aandelen heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel857
  - number: '858.1'
    text: |-
      Indien het bedrag van de verbintenis van de hoofdschuldenaar op het tijdstip van het aangaan van de borgtocht niet
      vaststaat, is de borgtocht slechts geldig, voor zover een in geld uitgedrukt maximum-bedrag is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel858
  - number: '858.2'
    text: |-
      Overeenkomstig [artikel 856][ref1] verschuldigde rente en kosten kunnen ongeacht dit maximum worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel856
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '856'
        afdeling: '1'
  - number: '859.1'
    text: Tegenover de borg wordt de borgtocht slechts door een door hem ondertekend geschrift bewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel859
  - number: '859.2'
    text: |-
      De borgtocht kan door alle middelen worden bewezen, indien vaststaat dat de borg de verbintenis van de
      hoofdschuldenaar geheel of gedeeltelijk is nagekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel859
  - number: '859.3'
    text: |-
      Voor het bewijs van de overeenkomst die tot het aangaan van de borgtocht verplicht, geldt dezelfde eis als gesteld
      in lid 1 en in het geval van lid 2 dezelfde vrijheid.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel859
  - number: '860'
    text: |-
      De borg is niet gebonden, voor zover voor zijn verbintenis meer bezwarende voorwaarden zouden gelden dan die
      waaronder de hoofdschuldenaar gebonden is, behoudens voor zover het betreft de wijze waarop tegenover de borg het
      bewijs van bestaan en omvang van de verbintenis van de hoofdschuldenaar geleverd kan worden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel860
  - number: '861.1'
    text: 'Een borgtocht die voor toekomstige verbintenissen is aangegaan, kan:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: 861.1.a
    text: te allen tijde worden opgezegd, indien zij niet voor een bepaalde duur geldt;
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: 861.1.b
    text: na vijf jaren worden opgezegd, indien zij wel voor een bepaalde duur geldt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: '861.2'
    text: Na de opzegging duurt de borgtocht voor de reeds ontstane verbintenissen voort.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: '861.3'
    text: |-
      Een borg is niet verbonden voor toekomstige verbintenissen tot vergoeding van schade, waarvoor de hoofdschuldenaar
      jegens de schuldeiser aansprakelijk is, voor zover de schuldeiser de schade had kunnen voorkomen door een toezicht
      als redelijkerwijs van hem gevergd kon worden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: '861.4'
    text: |-
      Een borg is evenmin verbonden voor toekomstige verbintenissen uit een rechtshandeling die de schuldeiser
      onverplicht heeft verricht, nadat hij bekend was geworden met omstandigheden die de mogelijkheid van verhaal op de
      hoofdschuldenaar aanmerkelijk hebben verminderd, zulks tenzij de borg uitdrukkelijk met de rechtshandeling heeft
      ingestemd of deze handeling geen uitstel kon lijden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel861
  - number: '862'
    text: 'Niet kan ten nadele van de borg worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel862
  - number: 862.a
    text: |-
      van de [artikelen 852-856][ref1] en [858-861][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel852
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel858
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel862
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '852'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '858'
        afdeling: '2'
  - number: 862.b
    text: |-
      van de verplichtingen die de schuldeiser krachtens [artikel 154 van Boek 6][ref1] jegens de borg heeft met het oog
      op diens mogelijke subrogatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel154
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel862
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '154'
  - number: '863'
    text: |-
      De bepalingen van deze afdeling zijn van overeenkomstige toepassing op overeenkomsten, waarbij iemand als bedoeld
      in [artikel 857][ref1] zich verbindt tot een bepaalde prestatie voor het geval een derde een bepaalde verbintenis
      met een andere inhoud jegens de schuldeiser niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel857
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '857'
        afdeling: '2'
  - number: '864.1'
    text: |-
      Indien in opdracht en voor rekening van iemand als bedoeld in [artikel 857][ref1] ter zake van de verbintenis
      van een ander een borgtocht of een overeenkomst als bedoeld in [artikel 863][ref2] wordt aangegaan, heeft de
      opdrachtnemer voor hetgeen hij aan de schuldeiser heeft voldaan, geen recht op vergoeding jegens de opdrachtgever
      voor zover de onderhavige afdeling aan diens aansprakelijkheid als borg in de weg gestaan zou hebben.
      [Artikel 861][ref3] is tussen opdrachtgever en opdrachtnemer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel857
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel863
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel861
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel864
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '857'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '863'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '861'
        afdeling: '2'
  - number: '864.2'
    text: |-
      Van het eerste lid kan slechts worden afgeweken, indien dit geschiedt bij een door de opdrachtgever ondertekend
      geschrift waarin de aard van de afwijking wordt omschreven, en het een opdracht betreft aan een bank of andere
      instelling die haar bedrijf van het verstrekken van borgtochten maakt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel864
  - number: '865'
    text: |-
      Op de rechtsbetrekkingen tussen hoofdschuldenaar en borg en op die tussen borgen en voor de verbintenis
      aansprakelijke niet-schuldenaren onderling is [artikel 2 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel2
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel865
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '2'
  - number: '866.1'
    text: |-
      De borg heeft voor het gehele bedrag dat hij aan hoofdsom, rente en kosten aan de schuldeiser heeft moeten voldoen,
      krachtens [artikel 10 van Boek 6][ref1] een vordering op de hoofdschuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
  - number: '866.2'
    text: |-
      De borg kan noch aan [artikel 10][ref1], noch aan [artikel 12 van Boek 6][ref2] een vordering op de
      hoofdschuldenaar ontlenen voor wettelijke rente over de periode waarin hij door hem persoonlijk betreffende
      omstandigheden in verzuim is geweest of voor kosten die hem persoonlijk betreffen of door hem in redelijkheid niet
      behoefden te worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel12
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '12'
  - number: '866.3'
    text: |-
      Heeft iemand zich ter zake van dezelfde verbintenis borg gesteld voor twee of meer hoofdelijk verbonden
      hoofdschuldenaren, dan zijn deze in afwijking van [artikel 10 lid 1][ref1] en [artikel 12 lid 1 van Boek 6][ref2],
      jegens de borg hoofdelijk verbonden voor hetgeen deze aan hoofdsom, rente en kosten op hen kan verhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel12
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '12'
  - number: '866.4'
    text: |-
      Uit de rechtsverhouding tussen de borg en een of meer hoofdschuldenaren kan iets anders voortvloeien dan de leden
      1-3 meebrengen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel866
  - number: '867'
    text: |-
      Indien de borg de verbintenis is nagekomen zonder de hoofdschuldenaar daarvan mededeling te doen en deze daarna
      zijnerzijds de schuldeiser heeft betaald, kan de hoofdschuldenaar tegenover de borg volstaan met overdracht aan
      deze van zijn vordering wegens onverschuldigde betaling op de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel867
  - number: '868'
    text: |-
      Een krachtens [artikel 10 van Boek 6][ref1] aangesproken hoofdschuldenaar kan de verweermiddelen die hij op het
      tijdstip van het ontstaan van de verhaalsvordering jegens de schuldeiser had, ook inroepen tegen de borg; de
      [leden 2 en 4 van artikel 11 van Boek 6][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel11
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel868
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '11'
  - number: '869'
    text: |-
      De borg te wiens laste de schuld is gedelgd, kan met overeenkomstige toepassing van [artikel 152 van Boek 6][ref1]
      het onverhaalbaar gebleken gedeelte omslaan over zich zelf, zijn medeborgen en de niet-schuldenaren die voor de
      verbintenis aansprakelijk waren.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel152
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel869
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '152'
  - number: '870'
    text: |-
      De achterborg die de verbintenis van de borg is nagekomen, kan ten behoeve van zich zelf het verhaal uitoefenen
      dat de borg, indien hij zelf de verbintenis was nagekomen, zou hebben gehad jegens de hoofdschuldenaar of jegens
      medeborgen of niet-schuldenaren die voor de verbintenis aansprakelijk waren.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel870
  - number: '900.1'
    text: |-
      Bij een vaststellingsovereenkomst binden partijen, ter beëindiging of ter voorkoming van onzekerheid of geschil
      omtrent hetgeen tussen hen rechtens geldt, zich jegens elkaar aan een vaststelling daarvan, bestemd om ook te
      gelden voor zover zij van de tevoren bestaande rechtstoestand mocht afwijken.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel900
  - number: '900.2'
    text: |-
      De vaststelling kan tot stand komen krachtens een beslissing van partijen gezamenlijk of krachtens een aan één van
      hen of aan een derde opgedragen beslissing.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel900
  - number: '900.3'
    text: |-
      Een bewijsovereenkomst staat met een vaststellingsovereenkomst gelijk voor zover zij een uitsluiting van
      tegenbewijs meebrengt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel900
  - number: '900.4'
    text: Deze titel is niet van toepassing op de overeenkomst van arbitrage.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel900
  - number: '901.1'
    text: |-
      De totstandkoming van de vaststelling is gebonden aan de vereisten waaraan moet worden voldaan om de met de
      beslissing beoogde rechtstoestand, uitgaande van die waarvan zij mogelijk afwijkt, tot stand te brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel901
  - number: '901.2'
    text: |-
      Ieder van de partijen is jegens de andere verplicht te verrichten hetgeen van haar zijde nodig is om aan de
      vereisten voor de totstandkoming van de vaststelling te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel901
  - number: '901.3'
    text: |-
      Voor zover aan deze vereisten kan worden voldaan door een verklaring van partijen of een hunner, wordt deze
      verklaring in de vaststellingsovereenkomst besloten geacht, tenzij uit de overeenkomst anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel901
  - number: '902'
    text: |-
      Een vaststelling ter beëindiging van onzekerheid of geschil op vermogensrechtelijk gebied is ook geldig als zij
      in strijd mocht blijken met dwingend recht, tenzij zij tevens naar inhoud of strekking in strijd komt met de goede
      zeden of de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel902
  - number: '903'
    text: |-
      Een vaststelling van hetgeen in het verleden rechtens is geweest, kan geen afbreuk doen aan inmiddels verkregen
      rechten van derden.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel903
  - number: '904.1'
    text: |-
      Indien gebondenheid aan een beslissing van een partij of van een derde in verband met inhoud of wijze van
      totstandkoming daarvan in de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar
      zou zijn, is die beslissing vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel904
  - number: '904.2'
    text: |-
      Indien de beslissing van een partij of een derde vernietigd wordt, nietig blijkt of niet binnen een aan die partij
      of derde daartoe te stellen redelijke termijn wordt verkregen, kan de rechter een beslissing geven, tenzij uit de
      overeenkomst of de aard van de beslissing voortvloeit dat zij op andere wijze moet worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel904
  - number: '905'
    text: |-
      Indien een ontbinding van een vaststellingsovereenkomst wegens een tekortkoming in de nakoming daarvan een reeds
      tot stand gekomen, aan een partij of een derde opgedragen beslissing zou treffen, kan deze ontbinding niet door een
      eenzijdige verklaring geschieden en kan de rechter haar afwijzen op de grond dat degene die haar vordert, voldoende
      middelen heeft om van de wederpartij opheffing van of vergoeding voor de tekortkoming te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel905
  - number: '906.1'
    text: |-
      De bepalingen van deze titel vinden overeenkomstige toepassing, wanneer een vaststelling haar rechtsgrond elders
      dan in een overeenkomst vindt.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel906
  - number: '906.2'
    text: |-
      [Artikel 904][ref1] vindt overeenkomstige toepassing wanneer aan een der partijen bij een rechtsverhouding of aan
      een derde de bevoegdheid is gegeven de regeling van de verhouding aan te vullen of te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel904
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel906
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '904'
  - number: '906.3'
    text: |-
      Lid 2 geldt niet voor aanvulling of wijziging bij een besluit van een orgaan van een rechtspersoon, indien dit
      besluit krachtens [artikel 15 van Boek 2][ref1] bij strijd met redelijkheid en billijkheid vernietigbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel15
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel906
