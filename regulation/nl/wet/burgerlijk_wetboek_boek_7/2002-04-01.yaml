      - id: ref15
        bwb_id: BWBR0005290
        artikel: '443'
        afdeling: '4'
      - id: ref16
        bwb_id: BWBR0005290
        artikel: '444'
        afdeling: '4'
  - number: '445.2'
    text: |-
      Evenmin kan ten nadele van de handelsagent worden afgeweken van de [artikelen 432 lid 3][ref1], [434][ref2] en,
      vóór het einde van de overeenkomst, van [artikel 442][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel434
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel442
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '432'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
