articles:
  - number: '1'
    text: |-
      Koop is de overeenkomst waarbij de een zich verbindt een zaak te geven en de ander om daarvoor een prijs in geld
      te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel1
  - number: '4'
    text: |-
      Wanneer de koop is gesloten zonder dat de prijs is bepaald, is de koper een redelijke prijs verschuldigd; bij
      de bepaling van die prijs wordt rekening gehouden met de door de verkoper ten tijde van het sluiten van de
      overeenkomst gewoonlijk bedongen prijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel4
  - number: '5.1'
    text: |-
      In deze titel wordt verstaan onder "consumentenkoop": de koop met betrekking tot een roerende zaak, die wordt
      gesloten door een verkoper die handelt in de uitoefening van een beroep of bedrijf, en een koper, natuurlijk
      persoon, die niet handelt in de uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel5
  - number: '5.2'
    text: |-
      Wordt de zaak verkocht door een gevolmachtigde die handelt in de uitoefening van beroep of bedrijf, dan wordt de
      koop aangemerkt als een consumentenkoop, tenzij de koper ten tijde van het sluiten van de overeenkomst weet dat de
      volmachtgever niet handelt in de uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel5
  - number: '5.3'
    text: |-
      De vorige leden zijn niet van toepassing indien de overeenkomst een registergoed of door leidingen naar de
      verbruiker aangevoerd water of gas betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel5
  - number: '6.1'
    text: |-
      Bij een consumentenkoop kan van de afdelingen 1-7 van deze titel niet ten nadele van de koper worden afgeweken
      en kunnen de rechten en vorderingen die de wet aan de koper ter zake van een tekortkoming in de nakoming van de
      verplichtingen van de verkoper toekent, niet worden beperkt of uitgesloten, behoudens bij een standaardregeling als
      bedoeld in [artikel 214 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2002-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '6.2'
    text: |-
      Lid 1 is niet van toepassing op de [artikelen 11][ref1], [12][ref2], [13][ref3], [26][ref4] en [35][ref5], doch
      bedingen in algemene voorwaarden waarbij ten nadele van de koper wordt afgeweken van die artikelen, worden als
      onredelijk bezwarend aangemerkt.


