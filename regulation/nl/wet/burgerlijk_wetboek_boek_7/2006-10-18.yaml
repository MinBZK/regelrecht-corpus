articles:
  - number: '1'
    text: |-
      Koop is de overeenkomst waarbij de een zich verbindt een zaak te geven en de ander om daarvoor een prijs in geld
      te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel1
  - number: '2.1'
    text: |-
      De koop van een tot bewoning bestemde onroerende zaak of bestanddeel daarvan wordt, indien de koper een natuurlijk
      persoon is die niet handelt in de uitoefening van een beroep of bedrijf, schriftelijk aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel2
  - number: '2.2'
    text: |-
      De tussen partijen opgemaakte akte of een afschrift daarvan moet aan de koper ter hand worden gesteld, desverlangd
      tegen afgifte aan de verkoper van een gedateerd ontvangstbewijs. Gedurende drie dagen na deze terhandstelling
      heeft de koper het recht de koop te ontbinden. Komt, nadat de koper van dit recht gebruik gemaakt heeft, binnen zes
      maanden tussen dezelfde partijen met betrekking tot dezelfde zaak of hetzelfde bestanddeel daarvan opnieuw een koop
      tot stand, dan ontstaat het recht niet opnieuw.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel2
  - number: '2.3'
    text: |-
      De leden 1–2 zijn van overeenkomstige toepassing op de koop van deelnemings- of lidmaatschapsrechten die recht
      geven op het gebruik van een tot bewoning bestemde onroerende zaak of bestanddeel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel2
  - number: '2.4'
    text: |-
      Van het in de leden 1–3 bepaalde kan niet ten nadele van de koper worden afgeweken, behoudens bij een
      standaardregeling als bedoeld in [artikel 214 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '2.5'
    text: |-
      De leden 1–4 zijn niet van toepassing op huurkoop en koop op een openbare veiling ten overstaan van een notaris.
      Zij zijn evenmin van toepassing op een koop als bedoeld in [artikel 48a onder a][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: '3.1'
    text: |-
      De koop van een registergoed kan worden ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3][ref1], tenzij op het tijdstip van de inschrijving levering van dat goed door
      de verkoper nog niet mogelijk zou zijn geweest wegens de in [artikel 97 van Boek 3][ref2] vervatte uitsluiting van
      levering bij voorbaat van toekomstige registergoederen. Bij de koop van een tot woning bestemde onroerende zaak
      of bestanddeel daarvan kan, indien de koper een natuurlijk persoon is die niet handelt in de uitoefening van een
      beroep of bedrijf, van het in de vorige zin bepaalde niet ten nadele van de koper worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel97
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '97'
  - number: '3.2'
    text: |-
      Gedurende de bedenktijd, bedoeld in [artikel 2 lid 2][ref1], kan inschrijving slechts plaatsvinden indien de
      koopakte is opgesteld en medeondertekend door een in Nederland gevestigde notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '2'
        afdeling: '1'
  - number: '3.3'
    text: 'Tegen de koper wiens koop is ingeschreven kunnen niet worden ingeroepen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: 3.3.a
    text: |-
      een na de inschrijving van die koop tot stand gekomen vervreemding of bezwaring door de verkoper, tenzij deze
      vervreemding of bezwaring voortvloeit uit een eerder ingeschreven koop of plaatsvond uit hoofde van een recht op
      levering dat volgens [artikel 298 van Boek 3][ref1] ging voor dat van de koper en dat de koper op het tijdstip van
      de inschrijving van de koop kende of ten aanzien waarvan op dat tijdstip het proces-verbaal van een conservatoir
      beslag tot levering was ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel298
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '298'
  - number: 3.3.b
    text: |-
      vervreemdingen of bezwaringen die plaatsvinden als vervolg op de onder a bedoelde vervreemding of bezwaring door
      de verkoper;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: 3.3.c
    text: |-
      een onderbewindstelling die na de inschrijving van de koop is tot stand gekomen of die, zo zij tevoren was tot
      stand gekomen, toen niet in de openbare registers was ingeschreven, dit laatste tenzij de koper haar op het
      tijdstip van de inschrijving van de koop kende;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: 3.3.d
    text: een na de inschrijving van de koop tot stand gekomen verhuring of verpachting;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: 3.3.e
    text: |-
      een na de inschrijving van de koop ingeschreven beding als bedoeld in [artikel 252 van Boek 6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel252
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '252'
  - number: 3.3.f
    text: een executoriaal of conservatoir beslag waarvan het proces-verbaal na de inschrijving van de koop is ingeschreven;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: 3.3.g
    text: |-
      een faillissement of surséance van betaling van de verkoper of toepassing ten aanzien van hem van de
      schuldsaneringsregeling natuurlijke personen, uitgesproken na de dag waarop de koop is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: '3.4'
    text: |-
      De inschrijving van de koop verliest de in lid 3 bedoelde werking met terugwerkende kracht, indien het goed niet
      binnen zes maanden na de inschrijving aan de koper geleverd is. In dat geval wordt bovendien de koop niet geacht
      kenbaar te zijn door raadpleging van de openbare registers.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: '3.5'
    text: |-
      Nadat de inschrijving haar werking heeft verloren, kan gedurende zes maanden geen koop tussen dezelfde partijen met
      betrekking tot hetzelfde goed worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: '3.6'
    text: |-
      Inschrijving van de koop vindt slechts plaats indien onder de koopakte een ondertekende en gedateerde verklaring
      van een notaris is opgenomen, die zijn naam, voornamen, standplaats en kwaliteit bevat en waarin verklaard wordt
      dat de leden 1, 2 en 5 niet aan inschrijving in de weg staan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: '3.7'
    text: De leden 1–6 zijn niet van toepassing op huurkoop.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel3
  - number: '4'
    text: |-
      Wanneer de koop is gesloten zonder dat de prijs is bepaald, is de koper een redelijke prijs verschuldigd; bij
      de bepaling van die prijs wordt rekening gehouden met de door de verkoper ten tijde van het sluiten van de
      overeenkomst gewoonlijk bedongen prijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel4
  - number: '5.1'
    text: |-
      In deze titel wordt verstaan onder "consumentenkoop": de koop met betrekking tot een roerende zaak, elektriciteit
      daaronder begrepen, die wordt gesloten door een verkoper die handelt in de uitoefening van een beroep of bedrijf,
      en een koper, natuurlijk persoon, die niet handelt in de uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel5
  - number: '5.2'
    text: |-
      Wordt de zaak verkocht door een gevolmachtigde die handelt in de uitoefening van beroep of bedrijf, dan wordt de
      koop aangemerkt als een consumentenkoop, tenzij de koper ten tijde van het sluiten van de overeenkomst weet dat de
      volmachtgever niet handelt in de uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel5
  - number: '5.3'
    text: |-
      De vorige leden zijn niet van toepassing indien de overeenkomst door leidingen naar de verbruiker aangevoerd water
      betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel5
  - number: '5.4'
    text: |-
      Indien de te leveren roerende zaak nog tot stand moet worden gebracht en de overeenkomst krachtens welke deze zaak
      moet worden geleverd voldoet aan de omschrijving van [artikel 750][ref1], dan wordt de overeenkomst mede als een
      consumentenkoop aangemerkt indien de overeenkomst wordt gesloten door een aannemer die handelt in de uitoefening
      van een beroep of bedrijf, en een opdrachtgever, natuurlijk persoon, die niet handelt in de uitoefening van een
      beroep of bedrijf. De bepalingen van deze titel en die van [afdeling 1 van titel 12][ref2] zijn naast elkaar van
      toepassing. In geval van strijd zijn de bepalingen van deze titel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        afdeling: '1'
  - number: '6.1'
    text: |-
      Bij een consumentenkoop kan van de [afdelingen 1-7 van deze titel][ref1] niet ten nadele van de koper worden
      afgeweken en kunnen de rechten en vorderingen die de wet aan de koper ter zake van een tekortkoming in de nakoming
      van de verplichtingen van de verkoper toekent, niet worden beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '1'
  - number: '6.2'
    text: |-
      Lid 1 is niet van toepassing op de [artikelen 11][ref1], [12][ref2], [13][ref3], [26][ref4] en [35][ref5], doch
      bedingen in algemene voorwaarden waarbij ten nadele van de koper wordt afgeweken van die artikelen, worden als
      onredelijk bezwarend aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel35
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '11'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '12'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '13'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '26'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '35'
        afdeling: '6'
  - number: '6.3'
    text: |-
      De toepasselijkheid op de consumentenkoop van een recht dat de door de [richtlijn nr. 99/44/EG](31999L0044) van
      het Europees Parlement en de Raad van de Europese Unie van 25 mei 1999 betreffende bepaalde aspecten van de verkoop
      van en de garanties voor consumptiegoederen (PbEG L 171) voorziene bescherming niet of slechts ten dele biedt,
      kan er niet toe leiden dat de koper de bescherming verliest die hem krachtens deze richtlijn wordt geboden door
      de dwingende bepalingen van het recht van de lidstaat van de Europese Unie of de andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte, waar hij zijn gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6
  - number: 6a.1
    text: |-
      Indien in geval van een consumentenkoop in een garantie door de verkoper of de producent bepaalde eigenschappen
      zijn toegezegd, bij het ontbreken waarvan de koper bepaalde rechten of vorderingen worden toegekend, dan kan de
      koper deze uitoefenen onverminderd alle andere rechten of vorderingen die de wet de koper toekent.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.2
    text: |-
      In een garantie moet op duidelijke en begrijpelijke wijze worden vermeld welke in lid 1 bedoelde rechten of
      vorderingen een koper worden toegekend en moet worden vermeld dat deze een koper toekomen onverminderd de rechten
      of vorderingen die de wet hem toekent. Voorts moeten in een garantie de naam en het adres worden vermeld van de
      verkoper of de producent van wie de garantie afkomstig is, alsmede de duur en het gebied waarvoor de garantie
      geldt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.3
    text: |-
      De in lid 2 bedoelde gegevens moeten de koper op zijn verlangen worden verstrekt. Dit geschiedt schriftelijk of op
      een andere ter beschikking van de koper staande en voor hem toegankelijke duurzame gegevensdrager.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.4
    text: |-
      De aan de koper door de verkoper of de producent in een garantiebewijs toegekende rechten of vorderingen komen
      hem ook toe indien de zaak niet de eigenschappen bezit die in een reclame door deze verkoper of producent zijn
      toegezegd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.5
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.5.a
    text: 'garantie: een in een garantiebewijs of reclame gedane toezegging als bedoeld in lid 1;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: 6a.5.b
    text: |-
      producent: de fabrikant van de zaak, degene die de zaak in de Europese Economische Ruimte invoert, alsmede een
      ieder die zich als producent presenteert door zijn naam, zijn merk of een ander onderscheidingsteken op de zaak aan
      te brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel6a
  - number: '7.1'
    text: |-
      Degene aan wie een zaak is toegezonden en die redelijkerwijze mag aannemen dat deze toezending is geschied ten
      einde hem tot een koop te bewegen, is ongeacht enige andersluidende mededeling van de verzender jegens deze bevoegd
      de zaak om niet te behouden, tenzij het hem is toe te rekenen dat de toezending is geschied.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel7
  - number: '7.2'
    text: |-
      De toezending aan een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf van een niet
      door deze bestelde zaak met het verzoek tot betaling van een prijs, is niet toegestaan. Wordt desalniettemin een
      zaak toegezonden als bedoeld in de eerste volzin, dan is het in lid 1 bepaalde omtrent de bevoegdheid, de zaak om
      niet te behouden, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel7
  - number: '7.3'
    text: |-
      Indien de ontvanger in de gevallen, bedoeld in de leden 1–2, de zaak terugzendt, komen de kosten hiervan voor
      rekening van de verzender.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel7
  - number: '7.4'
    text: |-
      Lid 2 is van overeenkomstige toepassing op het verrichten ten behoeve van een natuurlijk persoon die niet handelt
      in de uitoefening van een beroep of bedrijf van een niet door deze opgedragen dienst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel7
  - number: '8'
    text: |-
      Wordt een nieuw gebouwde of te bouwen woning, bestaande uit een onroerende zaak of bestanddeel daarvan, verkocht
      en is de koper een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf, dan zijn de
      [artikelen 767][ref1] en [768][ref2] van overeenkomstige toepassing. Hiervan kan niet ten nadele van de koper
      worden afgeweken, behoudens bij een standaardregeling als bedoeld in [artikel 214 van Boek 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel767
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel768
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '767'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '768'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '9.1'
    text: |-
      De verkoper is verplicht de verkochte zaak met toebehoren in eigendom over te dragen en af te leveren. Onder
      toebehoren zijn de aanwezige titelbewijzen en bescheiden begrepen; voor zover de verkoper zelf daarbij belang
      behoudt, is hij slechts verplicht om aan de koper op diens verlangen en op diens kosten een afschrift of uittreksel
      af te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel9
  - number: '9.2'
    text: Onder aflevering wordt verstaan het stellen van de zaak in het bezit van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel9
  - number: '9.3'
    text: |-
      In geval van koop met eigendomsvoorbehoud wordt onder aflevering verstaan het stellen van de zaak in de macht van
      de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel9
  - number: '10.1'
    text: |-
      De zaak is voor risico van de koper van de aflevering af, zelfs al is de eigendom nog niet overgedragen. Derhalve
      blijft hij de koopprijs verschuldigd, ongeacht tenietgaan of achteruitgang van de zaak door een oorzaak die niet
      aan de verkoper kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel10
  - number: '10.2'
    text: |-
      Hetzelfde geldt van het ogenblik af, waarop de koper in verzuim is met het verrichten van een handeling waarmede
      hij aan de aflevering moet medewerken. Ingeval naar de soort bepaalde zaken zijn verkocht, doet het verzuim van
      de koper het risico eerst op hem overgaan, wanneer de verkoper de voor de uitvoering van de overeenkomst bestemde
      zaken heeft aangewezen en de koper daarvan heeft verwittigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel10
  - number: '10.3'
    text: |-
      Indien de koper op goede gronden het recht op ontbinding van de koop of op vervanging van de zaak inroept, blijft
      deze voor risico van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel10
  - number: '10.4'
    text: |-
      Wanneer de zaak na de aflevering voor risico van de verkoper is gebleven, is het tenietgaan of de achteruitgang
      ervan door toedoen van de koper eveneens voor rekening van de verkoper. De koper moet echter van het ogenblik af
      dat hij redelijkerwijs rekening moet houden met het feit dat hij de zaak zal moeten teruggeven, als een zorgvuldig
      schuldenaar voor het behoud ervan zorgen; [artikel 78 van Boek 6][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel78
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '78'
  - number: '11'
    text: |-
      Indien bij een consumentenkoop de zaak bij de koper wordt bezorgd door de verkoper of een door deze aangewezen
      vervoerder, is de zaak pas voor risico van de koper van de bezorging af, zelfs al was zij reeds eerder afgeleverd
      in de zin van [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel9
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '9'
        afdeling: '2'
  - number: '12.1'
    text: Kosten van aflevering, die van weging en telling daaronder begrepen, komen ten laste van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel12
  - number: '12.2'
    text: Kosten van afhalen en kosten van een koopakte en van de overdracht komen ten laste van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel12
  - number: '13'
    text: |-
      Indien bij een consumentenkoop de zaak bij de koper wordt bezorgd door de verkoper of een door deze aangewezen
      vervoerder, kunnen daarvoor slechts kosten worden gevorderd, voor zover zij bij het sluiten van de overeenkomst
      door de verkoper afzonderlijk zijn opgegeven of door de verkoper de gegevens zijn verschaft op grond waarvan zij
      door hem worden berekend. Hetzelfde geldt voor kosten, verschuldigd voor andere werkzaamheden die de verkoper in
      verband met de koop voor de koper verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel13
  - number: '14'
    text: |-
      Van de dag van aflevering af komen de vruchten toe aan de koper, met dien verstande dat burgerlijke vruchten van
      dag tot dag berekend worden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel14
  - number: '15.1'
    text: |-
      De verkoper is verplicht de verkochte zaak in eigendom over te dragen vrij van alle bijzondere lasten en
      beperkingen, met uitzondering van die welke de koper uitdrukkelijk heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel15
  - number: '15.2'
    text: |-
      Ongeacht enig andersluidend beding staat de verkoper in voor de afwezigheid van lasten en beperkingen die
      voortvloeien uit feiten die vatbaar zijn voor inschrijving in de openbare registers, doch daarin ten tijde van het
      sluiten van de overeenkomst niet waren ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel15
  - number: '16'
    text: |-
      Wanneer tegen de koper een vordering wordt ingesteld tot uitwinning of tot erkenning van een recht waarmede de
      zaak niet belast had mogen zijn, is de verkoper gehouden in het geding te komen ten einde de belangen van de koper
      te verdedigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel16
  - number: '17.1'
    text: De afgeleverde zaak moet aan de overeenkomst beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '17.2'
    text: |-
      Een zaak beantwoordt niet aan de overeenkomst indien zij, mede gelet op de aard van de zaak en de mededelingen die
      de verkoper over de zaak heeft gedaan, niet de eigenschappen bezit die de koper op grond van de overeenkomst mocht
      verwachten. De koper mag verwachten dat de zaak de eigenschappen bezit die voor een normaal gebruik daarvan nodig
      zijn en waarvan hij de aanwezigheid niet behoefde te betwijfelen, alsmede de eigenschappen die nodig zijn voor een
      bijzonder gebruik dat bij de overeenkomst is voorzien.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '17.3'
    text: |-
      Een andere zaak dan is overeengekomen, of een zaak van een andere soort, beantwoordt evenmin aan de overeenkomst.
      Hetzelfde geldt indien het afgeleverde in getal, maat of gewicht van het overeengekomene afwijkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '17.4'
    text: |-
      Is aan de koper een monster of model getoond of verstrekt, dan moet de zaak daarmede overeenstemmen, tenzij het
      slechts bij wijze van aanduiding werd verstrekt zonder dat de zaak daaraan behoefde te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '17.5'
    text: |-
      De koper kan zich er niet op beroepen dat de zaak niet aan de overeenkomst beantwoordt wanneer hem dit ten tijde
      van het sluiten van de overeenkomst bekend was of redelijkerwijs bekend kon zijn. Ook kan de koper zich er niet op
      beroepen dat de zaak niet aan de overeenkomst beantwoordt wanneer dit te wijten is aan gebreken of ongeschiktheid
      van grondstoffen afkomstig van de koper, tenzij de verkoper hem voor deze gebreken of ongeschiktheid had moeten
      waarschuwen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '17.6'
    text: |-
      Bij koop van een onroerende zaak wordt vermelding van de oppervlakte vermoed slechts als aanduiding bedoeld te
      zijn, zonder dat de zaak daaraan behoeft te beantwoorden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel17
  - number: '18.1'
    text: |-
      Bij de beoordeling van de vraag of een op grond van een consumentenkoop afgeleverde zaak aan de overeenkomst
      beantwoordt, gelden mededelingen die door of ten behoeve van een vorige verkoper van die zaak, handelend in de
      uitoefening van een beroep of bedrijf, omtrent de zaak zijn openbaar gemaakt, als mededelingen van de verkoper,
      behoudens voor zover deze een bepaalde mededeling kende noch behoorde te kennen of deze mededeling uiterlijk ten
      tijde van het sluiten van de overeenkomst op een voor de koper duidelijke wijze is herroepen, dan wel de koop niet
      door deze mededeling beïnvloed kan zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel18
  - number: '18.2'
    text: |-
      Bij een consumentenkoop wordt vermoed dat de zaak bij aflevering niet aan de overeenkomst heeft beantwoord, indien
      de afwijking van het overeengekomene zich binnen een termijn van zes maanden na aflevering openbaart, tenzij de
      aard van de zaak of de aard van de afwijking zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel18
  - number: '18.3'
    text: |-
      Indien in geval van een consumentenkoop de verkoper verplicht is zorg te dragen voor de installatie van de zaak
      en deze installatie ondeugdelijk is uitgevoerd, wordt dit gelijkgesteld aan een gebrek aan overeenstemming van de
      zaak aan de overeenkomst. Hetzelfde geldt indien de installatie door de koper ondeugdelijk is uitgevoerd en dit te
      wijten is aan de montagevoorschriften die met de levering van de zaak aan de koper zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel18
  - number: '19.1'
    text: |-
      In geval van een executoriale verkoop kan de koper zich er niet op beroepen dat de zaak behept is met een last of
      een beperking die er niet op had mogen rusten, of dat deze niet aan de overeenkomst beantwoordt, tenzij de verkoper
      dat wist.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel19
  - number: '19.2'
    text: |-
      Hetzelfde geldt indien de verkoop bij wijze van parate executie plaatsvindt, mits de koper dit wist of had moeten
      weten. Bij een consumentenkoop kan de koper zich er echter wel op beroepen dat de zaak niet aan de overeenkomst
      beantwoordt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel19
  - number: '20'
    text: |-
      Is de zaak behept met een last of een beperking die er niet op had mogen rusten, dan kan de koper eisen dat de last
      of de beperking wordt opgeheven, mits de verkoper hieraan redelijkerwijs kan voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel20
  - number: '21.1'
    text: 'Beantwoordt het afgeleverde niet aan de overeenkomst, dan kan de koper eisen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: 21.1.a
    text: aflevering van het ontbrekende;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: 21.1.b
    text: herstel van de afgeleverde zaak, mits de verkoper hieraan redelijkerwijs kan voldoen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: 21.1.c
    text: |-
      vervanging van de afgeleverde zaak, tenzij de afwijking van het overeengekomene te gering is om dit te
      rechtvaardigen, dan wel de zaak na het tijdstip dat de koper redelijkerwijze met ongedaanmaking rekening moet
      houden, teniet of achteruit is gegaan doordat hij niet als een zorgvuldig schuldenaar voor het behoud ervan heeft
      gezorgd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '21.2'
    text: |-
      De kosten van nakoming van de in lid 1 bedoelde verplichtingen kunnen niet aan de koper in rekening worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '21.3'
    text: |-
      De verkoper is verplicht om, mede gelet op de aard van de zaak en op het bijzondere gebruik van de zaak dat bij
      de overeenkomst is voorzien, binnen een redelijke termijn en zonder ernstige overlast voor de koper, zijn in lid 1
      bedoelde verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '21.4'
    text: |-
      Bij een consumentenkoop komt de koper in afwijking van lid 1 slechts dan geen herstel of vervanging van de
      afgeleverde zaak toe indien herstel of vervanging onmogelijk is of van de verkoper niet gevergd kan worden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '21.5'
    text: |-
      Herstel of vervanging kan bij een consumentenkoop van de verkoper niet gevergd worden indien de kosten daarvan
      in geen verhouding staan tot de kosten van uitoefening van een ander recht of een andere vordering die de koper
      toekomt, gelet op de waarde van de zaak indien zij aan de overeenkomst zou beantwoorden, de mate van afwijking
      van het overeengekomene en de vraag of de uitoefening van een ander recht of een andere vordering geen ernstige
      overlast voor de koper veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '21.6'
    text: |-
      Indien bij een consumentenkoop de verkoper niet binnen een redelijke tijd nadat hij daartoe door de koper
      schriftelijk is aangemaand, aan zijn verplichting tot herstel van de afgeleverde zaak heeft voldaan, is de koper
      bevoegd het herstel door een derde te doen plaatsvinden en de kosten daarvan op de verkoper te verhalen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel21
  - number: '22.1'
    text: |-
      Beantwoordt het afgeleverde niet aan de overeenkomst, dan heeft bij een consumentenkoop de koper voorts de
      bevoegdheid om:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
  - number: 22.1.a
    text: |-
      de overeenkomst te ontbinden, tenzij de afwijking van het overeengekomene, gezien haar geringe betekenis, deze
      ontbinding met haar gevolgen niet rechtvaardigt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
  - number: 22.1.b
    text: de prijs te verminderen in evenredigheid met de mate van afwijking van het overeengekomene.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
  - number: '22.2'
    text: |-
      De in lid 1 bedoelde bevoegdheden ontstaan pas wanneer herstel en vervanging onmogelijk zijn of van de
      verkoper niet gevergd kunnen worden, danwel de verkoper tekort is geschoten in een verplichting als bedoeld in
      [artikel 21 lid 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel21
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '21'
        afdeling: '3'
  - number: '22.3'
    text: |-
      Voorzover daarvan in deze afdeling niet is afgeweken zijn op de in lid 1 onder b bedoelde bevoegdheid de bepalingen
      van [afdeling 5 van titel 5 van Boek 6][ref1] omtrent ontbinding van een overeenkomst van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '5'
  - number: '22.4'
    text: |-
      De rechten en bevoegdheden genoemd in lid 1 en de [artikelen 20][ref1] en [21][ref2] komen de koper toe
      onverminderd alle andere rechten en vorderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel21
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '20'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '21'
        afdeling: '3'
  - number: '23.1'
    text: |-
      De koper kan er geen beroep meer op doen dat hetgeen is afgeleverd niet aan de overeenkomst beantwoordt, indien
      hij de verkoper daarvan niet binnen bekwame tijd nadat hij dit heeft ontdekt of redelijkerwijs had behoren te
      ontdekken, kennis heeft gegeven. Blijkt echter aan de zaak een eigenschap te ontbreken die deze volgens de verkoper
      bezat, of heeft de afwijking betrekking op feiten die hij kende of behoorde te kennen doch die hij niet heeft
      meegedeeld, dan moet de kennisgeving binnen bekwame tijd na de ontdekking geschieden. Bij een consumentenkoop moet
      de kennisgeving binnen bekwame tijd na de ontdekking geschieden, waarbij een kennisgeving binnen een termijn van
      twee maanden na de ontdekking tijdig is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel23
  - number: '23.2'
    text: |-
      Rechtsvorderingen en verweren, gegrond op feiten die de stelling zouden rechtvaardigen dat de afgeleverde zaak niet
      aan de overeenkomst beantwoordt, verjaren door verloop van twee jaren na de overeenkomstig het eerste lid gedane
      kennisgeving. Doch de koper behoudt de bevoegdheid om aan een vordering tot betaling van de prijs zijn recht op
      vermindering daarvan of op schadevergoeding tegen te werpen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel23
  - number: '23.3'
    text: De termijn loopt niet zolang de koper zijn rechten niet kan uitoefenen als gevolg van opzet van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel23
  - number: '24.1'
    text: |-
      Indien op grond van een consumentenkoop een zaak is afgeleverd die niet de eigenschappen bezit die de koper
      op grond van de overeenkomst mocht verwachten, heeft de koper jegens de verkoper recht op schadevergoeding
      overeenkomstig de [afdelingen 9][ref1] en [10 van titel 1 van Boek 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005289
        afdeling: '10'
  - number: '24.2'
    text: |-
      Bestaat de tekortkoming in een gebrek als bedoeld in [afdeling 3 van titel 3 van Boek 6][ref1], dan is de verkoper
      niet aansprakelijk voor schade als in die afdeling bedoeld, tenzij


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: 24.2.a
    text: hij het gebrek kende of behoorde te kennen,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
  - number: 24.2.b
    text: hij de afwezigheid van het gebrek heeft toegezegd of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
  - number: 24.2.c
    text: |-
      het betreft zaakschade terzake waarvan krachtens [afdeling 3 van titel 3 van Boek 6][ref1] geen recht op
      vergoeding bestaat op grond van de in die afdeling geregelde franchise, onverminderd zijn verweren krachtens de
      [afdelingen 9][ref2] en [10 van titel 1 van Boek 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling9
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Afdeling10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005289
        afdeling: '10'
  - number: '24.3'
    text: |-
      Indien de verkoper de schade van de koper vergoedt krachtens lid 2 onder *a* of *b*, is de koper verplicht zijn
      rechten uit [afdeling 3 van titel 3 van Boek 6][ref1] aan de verkoper over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: '3'
  - number: '25.1'
    text: |-
      Heeft de koper, in geval van een tekortkoming als bedoeld in [artikel 24][ref1], een of meer van zijn rechten ter
      zake van die tekortkoming tegen de verkoper uitgeoefend, dan heeft de verkoper recht op schadevergoeding jegens
      degene van wie hij de zaak heeft gekocht, mits ook deze bij die overeenkomst in de uitoefening van zijn beroep of
      bedrijf heeft gehandeld. Kosten ter zake van verweer worden slechts vergoed voor zover zij in redelijkheid door de
      verkoper zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel24
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '24'
        afdeling: '3'
  - number: '25.2'
    text: Van lid 1 kan niet ten nadele van de verkoper worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
  - number: '25.3'
    text: |-
      Het recht op schadevergoeding krachtens lid 1 komt de verkoper niet toe indien de afwijking betrekking heeft op
      feiten die hij kende of behoorde te kennen, dan wel haar oorzaak vindt in een omstandigheid die is voorgevallen
      nadat de zaak aan hem werd afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
  - number: '25.4'
    text: |-
      Indien aan de zaak een eigenschap ontbreekt die deze volgens de verkoper bezat, is het recht van de verkoper
      op schadevergoeding krachtens lid 1 beperkt tot het bedrag waarop hij aanspraak had kunnen maken indien hij de
      toezegging niet had gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
  - number: '25.5'
    text: Op het verhaal krachtens eerdere koopovereenkomsten zijn de vorige leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
  - number: '25.6'
    text: |-
      De vorige leden zijn niet van toepassing voor zover het betreft schade als bedoeld in [artikel 24 lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel24
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '24'
        afdeling: '3'
  - number: '26.1'
    text: De koper is verplicht de prijs te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
  - number: '26.2'
    text: |-
      De betaling moet geschieden ten tijde en ter plaatse van de aflevering. Bij een consumentenkoop kan de koper tot
      vooruitbetaling van ten hoogste de helft van de koopprijs worden verplicht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
  - number: '26.3'
    text: |-
      Is voor de eigendomsoverdracht een notariële akte vereist, gevolgd door inschrijving daarvan in de daartoe bestemde
      openbare registers, dan moet het verschuldigde ten tijde van de ondertekening van de akte tenminste uit de macht
      van de koper zijn gebracht en behoeft het pas na de inschrijving in de macht van de verkoper te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
  - number: '26.4'
    text: |-
      Bij de koop van een tot bewoning bestemde onroerende zaak of bestanddeel daarvan, kan de koper die een natuurlijk
      persoon is en niet handelt in de uitoefening van een beroep of bedrijf, niet worden verplicht tot vooruitbetaling
      van de koopprijs, behoudens dat kan worden bedongen dat hij ter verzekering van de nakoming van zijn verplichtingen
      een bedrag dat niet hoger is dan 10% van de koopprijs, in depot stort bij een notaris dan wel voor dit bedrag
      vervangende zekerheid stelt. Van het in de eerste zin bepaalde kan niet ten nadele van de koper worden afgeweken,
      behoudens bij een standaardregeling als bedoeld in [artikel 214 van Boek 6][ref1]. Het teveel betaalde geldt als
      onverschuldigd betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '26.5'
    text: |-
      Lid 4 is van overeenkomstige toepassing op de koop van deelnemings- of lidmaatschapsrechten die recht geven op het
      gebruik van een tot bewoning bestemde onroerende zaak of bestanddeel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
  - number: '26.6'
    text: |-
      De leden 4–5 zijn niet van toepassing op een koop als bedoeld in [artikel 48a onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: '27'
    text: |-
      Wanneer de koper gestoord wordt of goede grond heeft te vrezen dat hij gestoord zal worden door een vordering tot
      uitwinning of tot erkenning van een recht op de zaak dat daarop niet had mogen rusten, kan hij de betaling van
      de koopprijs opschorten, tenzij de verkoper voldoende zekerheid stelt om het nadeel te dekken dat de koper dreigt
      te lijden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel27
  - number: '28'
    text: Bij een consumentenkoop verjaart de rechtsvordering tot betaling van de koopprijs door verloop van twee jaren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel28
  - number: '29.1'
    text: |-
      Heeft de koper de zaak ontvangen doch is hij voornemens deze te weigeren, dan moet hij als een zorgvuldig
      schuldenaar voor het behoud ervan zorgen; hij heeft op de zaak een retentierecht totdat hij door de verkoper voor
      de door hem in redelijkheid gemaakte kosten schadeloos is gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel29
  - number: '29.2'
    text: |-
      De koper die voornemens is een aan hem verzonden en op de plaats van bestemming te zijner beschikking gestelde zaak
      te weigeren, moet, zo dit geen betaling van de koopprijs en geen ernstige bezwaren of onredelijke kosten meebrengt,
      deze in ontvangst nemen, tenzij de verkoper op de plaats van bestemming aanwezig is of iemand aldaar bevoegd is
      zich voor zijn rekening met de zorg voor de zaak te belasten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel29
  - number: '30'
    text: |-
      Wanneer in de gevallen, in [artikel 29][ref1] voorzien, de zaak aan snel tenietgaan of achteruitgang onderhevig
      is of wanneer de bewaring daarvan ernstige bezwaren of onredelijke kosten zou meebrengen, is de koper verplicht de
      zaak op een geschikte wijze te doen verkopen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel29
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '29'
        afdeling: '4'
  - number: '31'
    text: |-
      Indien de overeenkomst aan de koper de bevoegdheid geeft door aanwijzing van maat of vorm of op andere wijze de
      zaak te specificeren en hij daarmede in verzuim is, kan de verkoper daartoe zelf overgaan, met inachtneming van de
      hem bekende behoeften van de koper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel31
  - number: '32'
    text: |-
      Ingeval de koper met de inontvangstneming in verzuim is, vindt [artikel 30][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel30
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '30'
        afdeling: '4'
  - number: '33'
    text: |-
      Indien de aflevering van een roerende zaak op een bepaalde dag essentieel is en op die dag de koper niet in
      ontvangst neemt, levert zulks een grond op tot ontbinding als bedoeld in [artikel 265 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel265
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '265'
  - number: '34'
    text: |-
      De verkoper kan de koop door een schriftelijke verklaring ontbinden, indien het achterwege blijven van
      inontvangstneming hem goede grond geeft te vrezen dat de prijs niet zal worden betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel34
  - number: '35.1'
    text: |-
      Indien de verkoper bij een consumentenkoop krachtens een bij die overeenkomst gemaakt beding de koopprijs na het
      sluiten van de koop verhoogt, is de koper bevoegd de koop door een schriftelijke verklaring te ontbinden, tenzij
      bedongen is dat de aflevering langer dan drie maanden na de koop zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel35
  - number: '35.2'
    text: |-
      Voor de toepassing van lid 1 wordt onder koopprijs begrepen het bedrag dat bij het sluiten van de overeenkomst
      onder voorbehoud van prijswijziging voorlopig als koopprijs is opgegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel35
  - number: '36.1'
    text: |-
      In geval van ontbinding van de koop is, wanneer de zaak een dagprijs heeft, de schadevergoeding gelijk aan het
      verschil tussen de in de overeenkomst bepaalde prijs en de dagprijs ten dage van de niet-nakoming.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel36
  - number: '36.2'
    text: |-
      Voor de berekening van deze schadevergoeding is de in aanmerking te nemen dagprijs die van de markt waar de koop
      plaatsvond, of, indien er geen dergelijke dagprijs is of deze bezwaarlijk zou kunnen worden toegepast, de prijs van
      de markt die deze redelijkerwijs kan vervangen; hierbij wordt rekening gehouden met verschillen in de kosten van
      vervoer van de zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel36
  - number: '37'
    text: |-
      Heeft de koper of de verkoper een dekkingskoop gesloten en is hij daarbij redelijk te werk gegaan, dan komt hem het
      verschil toe tussen de overeengekomen prijs en die van de dekkingskoop.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel37
  - number: '38'
    text: |-
      De bepalingen van de twee voorgaande artikelen sluiten het recht op een hogere schadevergoeding niet uit ingeval
      meer schade is geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel38
  - number: '39.1'
    text: |-
      De verkoper van een roerende, aan de koper afgeleverde zaak die niet een registergoed is, kan, indien de prijs niet
      betaald is en in verband daarmee aan de vereisten voor een ontbinding als bedoeld in [artikel 265 van Boek 6][ref1]
      is voldaan, de zaak door een tot de koper gerichte schriftelijke verklaring terugvorderen. Door deze verklaring
      wordt de koop ontbonden en eindigt het recht van de koper of zijn rechtsverkrijger; de [artikelen 271][ref2],
      [273][ref3], [275][ref4] en [276 van Boek 6][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel265
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel271
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel273
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel275
      [ref5]: https://wetten.overheid.nl/BWBR0005289#Artikel276
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '265'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '271'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '273'
      - id: ref4
        bwb_id: BWBR0005289
        artikel: '275'
      - id: ref5
        bwb_id: BWBR0005289
        artikel: '276'
  - number: '39.2'
    text: |-
      Is slechts de prijs van een bepaald deel van het afgeleverde niet betaald, dan kan de verkoper slechts dat deel
      terugvorderen. Is ten aanzien van het geheel een deel van de prijs niet betaald, dan kan de verkoper een daaraan
      evenredig deel van het afgeleverde terugvorderen indien het afgeleverde voor een zodanige verdeling vatbaar is. In
      beide gevallen wordt de koop slechts voor het teruggevorderde deel van het afgeleverde ontbonden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel39
  - number: '39.3'
    text: |-
      In alle andere gevallen van gedeeltelijke betaling van de prijs kan de verkoper slechts het afgeleverde in zijn
      geheel terugvorderen tegen teruggave van het reeds betaalde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel39
  - number: '40.1'
    text: |-
      Is de koper in staat van faillissement verklaard of is aan hem surséance van betaling verleend, dan heeft de
      terugvordering geen gevolg, indien door de curator, onderscheidenlijk door de koper en de bewindvoerder, binnen een
      hun daartoe door de verkoper bij diens verklaring te stellen redelijke termijn de koopprijs wordt betaald of voor
      deze betaling zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel40
  - number: '40.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien ten aanzien van de koper de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, tenzij de koopovereenkomst tot stand is gekomen na de uitspraak
      tot de toepassing van de schuldsaneringsregeling.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel40
  - number: '41'
    text: |-
      De bevoegdheid tot terugvordering kan slechts worden uitgeoefend voor zover het afgeleverde zich nog in dezelfde
      staat bevindt als waarin het werd afgeleverd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel41
  - number: '42.1'
    text: |-
      Tenzij de zaak in handen van de koper is gebleven, vervalt de bevoegdheid tot terugvordering wanneer de zaak
      overeenkomstig [artikel 90 lid 1][ref1] of [artikel 91 van Boek 3][ref2] anders dan om niet is overgedragen aan een
      derde die redelijkerwijs niet behoefde te verwachten dat het recht zou worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel91
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '90'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '91'
  - number: '42.2'
    text: |-
      Is de zaak na de aflevering anders dan om niet in vruchtgebruik gegeven of verpand, dan is lid 1 van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel42
  - number: '43'
    text: |-
      De verkoper kan zijn in [artikel 39][ref1] omschreven bevoegdheid niet uitoefenen, indien de koper voor de volle
      koopprijs handelspapier heeft geaccepteerd. Bij acceptatie voor een gedeelte van de prijs kan de verkoper die
      bevoegdheid slechts uitoefenen, indien hij ten behoeve van de koper zekerheid stelt voor de vergoeding van hetgeen
      de koper uit hoofde van zijn acceptatie zou moeten betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel39
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '39'
        afdeling: '8'
  - number: '44'
    text: |-
      De in [artikel 39][ref1] omschreven bevoegdheid van de verkoper vervalt, wanneer zowel zes weken zijn verstreken
      nadat de vordering tot betaling van de koopprijs opeisbaar is geworden, als zestig dagen, te rekenen van de dag
      waarop de zaak onder de koper of onder iemand van zijnentwege is opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel39
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '39'
        afdeling: '8'
  - number: '45.1'
    text: Koop op proef wordt geacht te zijn gesloten onder de opschortende voorwaarde dat de zaak de koper voldoet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel45
  - number: '45.2'
    text: |-
      Laat deze een termijn, voldoende om de zaak te beoordelen, voorbijgaan zonder de verkoper van zijn beslissing in
      kennis te stellen, dan kan hij de zaak niet meer weigeren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel45
  - number: '46'
    text: Zolang de koop niet definitief is, is de zaak voor risico van de verkoper.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46
  - number: 46a
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.a
    text: |-
      overeenkomst op afstand: de overeenkomst waarbij, in het kader van een door de verkoper of dienstverlener
      georganiseerd systeem voor verkoop of dienstverlening op afstand, tot en met het sluiten van de overeenkomst
      uitsluitend gebruik wordt gemaakt van één of meer technieken voor communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.b
    text: 'koop op afstand: de overeenkomst op afstand die een consumentenkoop is;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.c
    text: |-
      overeenkomst op afstand tot het verrichten van diensten: de tot het verrichten van diensten strekkende overeenkomst
      op afstand tussen een dienstverlener die handelt in de uitoefening van een beroep of bedrijf en een wederpartij,
      natuurlijk persoon, die niet handelt in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.d
    text: |-
      financiële dienst: iedere dienst van bancaire aard of op het gebied van kredietverstrekking, verzekering,
      individuele pensioenen, beleggingen en betalingen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.e
    text: |-
      techniek voor communicatie op afstand: een middel dat zonder gelijktijdige persoonlijke aanwezigheid van partijen
      kan worden gebruikt voor het sluiten van de overeenkomst op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.f
    text: |-
      communicatietechniekexploitant: een natuurlijke persoon of rechtspersoon die zijn bedrijf maakt van het ter
      beschikking stellen van één of meer technieken voor communicatie op afstand aan verkopers of dienstverleners;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.g
    text: |-
      richtlijn nr. 97/7/EG: [richtlijn nr. 97/7/EG](31997L0007) van het Europees Parlement en de Raad van de Europese
      Unie van 20 mei 1997 betreffende de bescherming van de consument bij op afstand gesloten overeenkomsten (PbEG
      L 144);
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46a.h
    text: |-
      [richtlijn nr. 2002/65/EG](32002L0065): [richtlijn nr. 2002/65/EG](32002L0065) van het Europees Parlement en de
      Raad van de Europese Unie van 23 september 2002 betreffende de verkoop op afstand van financiële diensten aan
      consumenten (PbEG L 271).
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46a
  - number: 46b.1
    text: |-
      [Artikel 5 lid 3][ref1] is niet van toepassing op koop op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '5'
        afdeling: '1'
  - number: 46b.2
    text: 'Deze afdeling is niet van toepassing op de koop op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46b
  - number: 46b.2.a
    text: die wordt gesloten met gebruikmaking van distributieautomaten of geautomatiseerde handelsruimten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46b
  - number: 46b.2.b
    text: op een veiling.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46b
  - number: 46b.3
    text: |-
      De [artikelen 46c-46e][ref1] en [46f lid 1][ref2] zijn niet van toepassing op de koop op afstand van hoofdzakelijk
      levensmiddelen die worden afgeleverd aan de koper op diens woon- of verblijfplaats of werkplek door frequent en op
      gezette tijden langskomende bezorgers.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46c.1
    text: |-
      Tijdig voordat de koop op afstand wordt gesloten, moeten aan de wederpartij met alle aan de gebruikte techniek voor
      communicatie op afstand aangepaste middelen en op duidelijke en begrijpelijke wijze, de volgende gegevens worden
      verstrekt, waarvan het commerciële oogmerk ondubbelzinnig moet blijken:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.a
    text: |-
      de identiteit en, indien de koop op afstand verplicht tot vooruitbetaling van de prijs of een gedeelte daarvan, het
      adres van de verkoper;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.b
    text: de belangrijkste kenmerken van de zaak;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.c
    text: de prijs, met inbegrip van alle belastingen, van de zaak;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.d
    text: 'voor zover van toepassing: de kosten van aflevering;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.e
    text: de wijze van betaling, aflevering of uitvoering van de koop op afstand;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.f
    text: |-
      het al dan niet van toepassing zijn van de mogelijkheid van ontbinding overeenkomstig de
      [artikelen 46d lid 1][ref1] en [46e][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
  - number: 46c.1.g
    text: |-
      indien de kosten van het gebruik van de techniek voor communicatie op afstand worden berekend op een andere
      grondslag dan het basistarief: de hoogte van het geldende tarief;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.h
    text: de termijn voor de aanvaarding van het aanbod, dan wel de termijn voor het gestand doen van de prijs;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.1.i
    text: |-
      voor zover van toepassing, in geval van een koop op afstand die strekt tot voortdurende of periodieke aflevering
      van zaken: de minimale duur van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.2
    text: |-
      Tijdig bij de nakoming van de koop op afstand en, voor zover het niet aan derden af te leveren zaken betreft,
      uiterlijk bij de aflevering, moeten aan de koper op duidelijke en begrijpelijke wijze schriftelijk of, voor zover
      het de in de onderdelen a en c-e bedoelde gegevens betreft, op een andere te zijner beschikking staande en voor hem
      toegankelijke duurzame gegevensdrager, de volgende gegevens worden verstrekt, behoudens voor zover zulks reeds is
      geschied voordat de koop op afstand werd gesloten:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.2.a
    text: de gegevens, bedoeld in de onderdelen a-f van lid 1;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.2.b
    text: |-
      de vereisten voor de gebruikmaking van het recht tot ontbinding overeenkomstig de [artikelen 46d lid 1][ref1] en
      [46e lid 2][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
  - number: 46c.2.c
    text: het bezoekadres van de vestiging van de verkoper waar de koper een klacht kan indienen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.2.d
    text: |-
      voor zover van toepassing: gegevens omtrent de garantie en omtrent in het kader van de koop op afstand aangeboden
      diensten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46c.2.e
    text: |-
      indien de koop op afstand een duur heeft van meer dan een jaar dan wel een onbepaalde duur: de vereisten voor
      opzegging van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46c
  - number: 46d.1
    text: |-
      Gedurende zeven werkdagen na de ontvangst van de zaak heeft de koper het recht de koop op afstand zonder opgave van
      redenen te ontbinden. Indien niet is voldaan aan alle in [artikel 46c lid 2][ref1] gestelde eisen, bedraagt deze
      termijn drie maanden. De eerste zin is van overeenkomstige toepassing vanaf de voldoening binnen de in de tweede
      zin bedoelde termijn aan alle in [artikel 46c lid 2][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
  - number: 46d.2
    text: |-
      In geval van ontbinding overeenkomstig lid 1 kan de verkoper, behoudens ten hoogste de rechtstreekse kosten van het
      terugzenden van de zaak, aan de koper geen vergoeding in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.3
    text: |-
      In geval van ontbinding overeenkomstig lid 1 heeft de koper recht op kosteloze teruggave van het door hem aan de
      verkoper betaalde. De teruggave moet zo spoedig mogelijk en in ieder geval binnen dertig dagen na de ontbinding
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4
    text: 'De leden 1–3 zijn niet van toepassing op de koop op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.a
    text: |-
      van zaken waarvan de prijs gebonden is aan de schommelingen op de financiële markt, waarop de verkoper geen invloed
      heeft;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.b
    text: 'van zaken die:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.b.1°
    text: zijn tot stand gebracht overeenkomstig specificaties van de koper;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.b.2°
    text: duidelijk persoonlijk van aard zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.b.3°
    text: door hun aard niet kunnen worden teruggezonden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.b.4°
    text: snel kunnen bederven of verouderen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.c
    text: van audio- en video-opnamen en computerprogrammatuur, indien de koper hun verzegeling heeft verbroken;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46d.4.d
    text: van kranten en tijdschriften.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46d
  - number: 46e.1
    text: |-
      Ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] brengt van rechtswege en zonder dat
      de koper een boete is verschuldigd de ontbinding mee van een overeenkomst die ertoe strekt dat de verkoper aan de
      koper ten behoeve van de voldoening van de prijs een geldsom leent.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46e.2
    text: |-
      In geval van ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] heeft de koper tevens het
      recht een ingevolge een overeenkomst tussen de verkoper en een derde aangegane overeenkomst die ertoe strekt dat de
      derde aan de koper ten behoeve van de voldoening van de prijs een geldsom leent, zonder boete te ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46f.1
    text: |-
      Het verzuim van de verkoper treedt zonder ingebrekestelling in, wanneer de koop op afstand niet uiterlijk binnen
      dertig dagen, te rekenen van de dag waarop de koper zijn bestelling bij de verkoper heeft gedaan, is nagekomen,
      behalve voor zover de vertraging de verkoper niet kan worden toegerekend of nakoming reeds blijvend onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46f
  - number: 46f.2
    text: |-
      Indien nakoming onmogelijk is doordat de gekochte zaak niet beschikbaar is, moet de koper daarvan zo spoedig
      mogelijk worden kennis gegeven en heeft hij recht op kosteloze teruggave van het door hem aan de verkoper betaalde.
      De teruggave moet zo spoedig mogelijk en in ieder geval binnen dertig dagen na de kennisgeving plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46f
  - number: 46f.3
    text: |-
      Indien in het in lid 2 bedoelde geval de verkoper krachtens een voor dan wel bij het sluiten van de koop op afstand
      gemaakt beding de bevoegdheid heeft, een zaak van gelijke kwaliteit en prijs te geven, komen de kosten van het
      terugzenden van de zaak in geval van ontbinding van de koop op afstand overeenkomstig [artikel 46d lid 1][ref1] ten
      laste van de verkoper. De koper moet daarvan op duidelijke en begrijpelijke wijze worden kennis gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46g
    text: |-
      De natuurlijke persoon die niet handelt in de uitoefening van een beroep of bedrijf, van wie een betaalkaart
      frauduleus is gebruikt in het kader van koop op afstand, kan niet worden verplicht tot betaling van de hem als
      gevolg van dat frauduleuze gebruik in rekening gebrachte bedragen, behoudens voor zover dat gebruik een gevolg
      is van een omstandigheid die aan hem kan worden toegerekend. Het terzake reeds betaalde geldt als onverschuldigd
      betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46g
  - number: 46h.1
    text: |-
      Aan een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf moeten bij het gebruik van
      de telefoon voor het doen van ongevraagde oproepen ter bevordering van de totstandkoming van een koop op afstand,
      aan het begin van elk gesprek duidelijk de identiteit van de verkoper, alsmede het commerciële oogmerk van de
      oproep worden medegedeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.2
    text: |-
      Het gebruik van automatische oproepsystemen zonder menselijke tussenkomst, faxen en elektronische berichten voor
      het overbrengen van ongevraagde communicatie, ter bevordering van de totstandkoming van een koop op afstand, aan
      een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf, is uitsluitend toegestaan,
      indien de desbetreffende persoon daarvoor voorafgaand toestemming heeft verleend onverminderd hetgeen is bepaald in
      lid 3.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.3
    text: |-
      Een ieder die elektronische contactgegevens voor elektronische berichten heeft verkregen in het kader van de
      verkoop van een zaak mag deze gegevens gebruiken voor het overbrengen van communicatie ter bevordering van de
      totstandkoming van een koop op afstand met betrekking tot eigen gelijksoortige zaken, mits bij de verkrijging
      van de contactgegevens aan de klant duidelijk en uitdrukkelijk de gelegenheid is geboden om kosteloos en op
      gemakkelijke wijze verzet aan te tekenen tegen het gebruik van die elektronische contactgegevens, en, indien de
      klant hiervan geen gebruik heeft gemaakt, hem bij elke overgebrachte communicatie de mogelijkheid wordt geboden om
      onder dezelfde voorwaarden verzet aan te tekenen tegen het verder gebruik van zijn elektronische contactgegevens.
      [Artikel 41, tweede lid, van de Wet bescherming persoonsgegevens][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel41
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '41'
  - number: 46h.4
    text: |-
      Bij het gebruik van elektronische berichten ter bevordering van de totstandkoming van een koop op afstand dienen te
      allen tijde de volgende gegevens te worden vermeld:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.4.a
    text: de werkelijke identiteit van degene namens wie de communicatie wordt overgebracht, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.4.b
    text: |-
      een geldig postadres of nummer waaraan de ontvanger een verzoek tot beëindiging van dergelijke communicatie kan
      richten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.5
    text: |-
      Het gebruik van andere dan de in lid 2 genoemde technieken voor communicatie op afstand voor het overbrengen
      van ongevraagde communicatie of het doen van ongevraagde mededelingen, ter bevordering van de totstandkoming van
      een koop op afstand, aan een natuurlijk persoon die niet handelt in de uitoefening van een beroep of bedrijf, is
      toegestaan, tenzij de desbetreffende persoon te kennen heeft gegeven dat hij communicatie of mededelingen waarbij
      van deze technieken gebruik wordt gemaakt, niet wenst te ontvangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.6
    text: |-
      Degene die ongevraagd communicatie overbrengt of mededelingen doet ter bevordering van de totstandkoming van een
      koop op afstand, neemt passende maatregelen om ten minste eenmaal per jaar de personen, bedoeld in lid 5, bekend te
      maken met de mogelijkheden tot het doen van een kennisgeving als bedoeld in lid 5. De bekendmaking kan via een of
      meer dag-, nieuws- of huis-aan-huisbladen of op een andere geschikte wijze plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46h.7
    text: Aan de maatregelen, bedoeld in de leden 2 en 5, zijn voor de in die leden bedoelde personen geen kosten verbonden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46h
  - number: 46i.1
    text: |-
      De [artikelen 46b lid 2][ref1], [46c][ref2], [46d leden 1–3 en 4, onderdeel a][ref3], [46e][ref4] en
      [46f leden 1 en 2][ref5] zijn van overeenkomstige toepassing op de overeenkomst op afstand tot het verrichten van
      diensten die niet een financiële dienst zijn. De [artikelen 46g–46h][ref6] zijn van overeenkomstige toepassing op
      overeenkomsten op afstand tot het verrichten van diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46b
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel46e
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel46g
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46b
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 46e
        afdeling: 9A
      - id: ref5
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
      - id: ref6
        bwb_id: BWBR0005290
        artikel: 46g
        afdeling: 9A
  - number: 46i.2
    text: 'In afwijking van lid 1 zijn de in dat lid genoemde artikelen niet van toepassing op de overeenkomst op afstand:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
  - number: 46i.2.a
    text: |-
      tot het verrichten van diensten, die wordt gesloten met een telecommunicatie-exploitant door gebruikmaking van een
      openbare telefoon;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
  - number: 46i.2.b
    text: tot aanneming van werk die strekt tot de bouw van een onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
  - number: 46i.3
    text: |-
      In afwijking van lid 1 zijn de [artikelen 46c-46e][ref1] en [46f lid 1][ref2] niet van toepassing op de
      overeenkomst op afstand tot het verrichten van diensten die logies, vervoer, het restaurantbedrijf of
      vrijetijdsbesteding betreft, indien de dienstverlener zich er bij het sluiten van de overeenkomst toe verplicht,
      deze diensten te verrichten op een bepaalde datum of tijdens een bepaalde periode.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46i.4
    text: |-
      In afwijking van lid 1 is [artikel 46c lid 2][ref1] niet van toepassing op de overeenkomst op afstand tot het
      verrichten van diensten die in één keer worden verricht met behulp van een techniek voor communicatie op afstand
      en die in rekening worden gebracht door de communicatietechniekexploitant. Desalniettemin moet aan de wederpartij
      steeds het bezoekadres van de vestiging van de dienstverlener waar de wederpartij een klacht kan indienen, worden
      medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46c
        afdeling: 9A
  - number: 46i.5
    text: |-
      In afwijking van lid 1 is [artikel 46d][ref1] niet van toepassing op de overeenkomst op afstand tot het verrichten
      van diensten:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46i.5.a
    text: |-
      waarvan de nakoming met instemming van de wederpartij is begonnen voordat de in
      [artikel 46d lid 1, eerste en derde volzin][ref1], bedoelde termijn is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46i.5.b
    text: betreffende weddenschappen en loterijen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
  - number: 46i.6
    text: |-
      In geval van een overeenkomst op afstand tot het verrichten van diensten lopen de in
      [artikel 46d lid 1, eerste en tweede volzin][ref1], bedoelde termijnen vanaf het sluiten van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46d
        afdeling: 9A
  - number: 46i.7
    text: |-
      Een beding in een overeenkomst op afstand tot het verrichten van financiële diensten dat de wederpartij belast met
      het bewijs ter zake van de naleving van de verplichtingen die krachtens [richtlijn nr. 2002/65/EG](32002L0065) op
      de dienstverlener rusten, is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46i
  - number: 46j.1
    text: Van deze afdeling kan niet ten nadele van de koper dan wel de wederpartij worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46j
  - number: 46j.2
    text: |-
      Lid 1 is niet van toepassing op [artikel 46f lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46f
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46j
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46f
        afdeling: 9A
  - number: 46j.3
    text: |-
      De toepasselijkheid op de overeenkomst van een recht dat de door [richtlijn nr. 97/7/EG](31997L0007)
      respectievelijk [richtlijn nr. 2002/65/EG](32002L0065) voorziene bescherming niet of slechts ten dele biedt,
      kan er niet toe leiden dat de koper dan wel de wederpartij de bescherming verliest die hem krachtens [richtlijn
      nr. 97/7/EG](31997L0007) respectievelijk [richtlijn nr. 2002/65/EG](32002L0065) wordt geboden door de dwingende
      bepalingen van het recht van de lid-staat van de Europese Unie of de andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, waar hij zijn gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel46j
  - number: '47'
    text: |-
      Een koop kan ook op een vermogensrecht betrekking hebben. In dat geval zijn de bepalingen van de vorige afdelingen
      van toepassing voor zover dit in overeenstemming is met de aard van het recht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel47
  - number: '48.1'
    text: |-
      Hij die een nalatenschap verkoopt zonder de goederen daarvan stuk voor stuk op te geven, is slechts gehouden voor
      zijn hoedanigheid van erfgenaam in te staan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48
  - number: '48.2'
    text: |-
      Heeft de verkoper reeds vruchten genoten, een tot de nalatenschap behorende vordering geïnd of goederen uit de
      nalatenschap vervreemd, dan moet hij die aan de koper vergoeden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48
  - number: '48.3'
    text: |-
      De koper moet aan de verkoper vergoeden hetgeen deze wegens de schulden en lasten der nalatenschap heeft betaald en
      hem voldoen hetgeen hij als schuldeiser van de nalatenschap te vorderen had.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48
  - number: 48a
    text: 'In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48a
  - number: 48a.a
    text: |-
      koop: iedere overeenkomst en ieder samenstel van overeenkomsten met een duur van ten minste drie jaren en met de
      strekking dat de ene partij – de verkoper – tegen betaling van een totaalprijs aan de andere partij – de koper –
      een zakelijk of persoonlijk recht geeft of zich verbindt te geven tot het gebruik voor ten minste een week per jaar
      van een of meer tot bewoning bestemde onroerende zaken of bestanddelen daarvan;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48a
  - number: 48a.b
    text: 'verkoper: een verkoper als bedoeld onder *a*, die bij de koop handelt in de uitoefening van een beroep of bedrijf;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48a
  - number: 48a.c
    text: |-
      koper: een koper als bedoeld onder *a*, die een natuurlijk persoon is en bij de koop niet handelt in de uitoefening
      van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48a
  - number: 48a.d
    text: |-
      richtlijn: [richtlijn nr. 94/47/EG](31994L0047) van het Europees Parlement en van de Raad van de Europese Unie van
      26 oktober 1994 betreffende de bescherming van de verkrijger voor wat bepaalde aspecten betreft van overeenkomsten
      inzake de verkrijging van een recht van deeltijds gebruik van onroerende goederen (*PbEG* L 280).
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48a
  - number: 48b.1
    text: |-
      De koop wordt schriftelijk aangegaan. De koopakte moet ten minste de bij algemene maatregel van bestuur bepaalde
      gegevens bevatten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48b
  - number: 48b.2
    text: |-
      De in lid 1 bedoelde, tussen partijen opgemaakte, akte of een afschrift daarvan moet aan de koper worden ter hand
      gesteld, desverlangd tegen afgifte aan de verkoper van een gedateerd ontvangstbewijs.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48b
  - number: 48b.3
    text: De in lid 1 bedoelde akte moet zijn gesteld in de bij algemene maatregel van bestuur bepaalde taal of talen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48b
  - number: 48c.1
    text: |-
      Gedurende tien dagen na de terhandstelling van de akte of een afschrift daarvan overeenkomstig [artikel 48][ref1]
      heeft de koper het recht de koop zonder opgave van redenen te ontbinden. Indien de akte niet alle bij algemene
      maatregel van bestuur bepaalde gegevens vermeldt, wordt deze termijn verlengd met de tijd die is verstreken vanaf
      de terhandstelling van de akte of een afschrift daarvan totdat alle ontbrekende gegevens alsnog schriftelijk aan de
      koper zijn verstrekt, doch ten hoogste met drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48c.2
    text: |-
      De koper oefent zijn in lid 1 bedoelde recht de overeenkomst te ontbinden uit door binnen de gestelde termijn
      een daartoe strekkende verklaring te richten tot de verkoper of tot degene die daartoe overeenkomstig het in de
      algemene maatregel van bestuur bepaalde in de akte is vermeld. De verklaring wordt gedaan op een wijze die voor
      bewijs vatbaar is naar het volgens Nederlands internationaal privaatrecht toepasselijke recht. De gestelde termijn
      is in acht genomen, indien een schriftelijke verklaring binnen die termijn is verzonden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48c
  - number: 48c.3
    text: |-
      In geval van ontbinding overeenkomstig de leden 1–2 is de koper aan de verkoper geen enkele vergoeding
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48c
  - number: 48d
    text: |-
      De koper kan binnen de in [artikel 48][ref1] bedoelde termijn niet worden verplicht tot vooruitbetaling van de
      prijs of een gedeelte daarvan. Binnen deze termijn gedane vooruitbetalingen gelden als onverschuldigd betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.1
    text: |-
      Ontbinding van de koop overeenkomstig [artikel 48][ref1] brengt van rechtswege en zonder dat de koper een boete is
      verschuldigd de ontbinding mee van een overeenkomst die ertoe strekt dat de verkoper aan de koper ten behoeve van
      de voldoening van de prijs een geldsom leent.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.2
    text: |-
      In geval van ontbinding van de koop overeenkomstig [artikel 48][ref1] heeft de koper tevens het recht een ingevolge
      een overeenkomst tussen de verkoper en een derde aangegane overeenkomst die ertoe strekt dat de derde aan de
      koper ten behoeve van de voldoening van de prijs een geldsom leent, zonder boete te ontbinden. Op de ontbinding
      overeenkomstig de voorgaande zin is [artikel 48][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48e.3
    text: |-
      Op de ontbinding overeenkomstig de leden 1–2 is [artikel 48][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48c
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48c
        afdeling: 10A
  - number: 48f.1
    text: |-
      De verkoper moet aan een ieder die verzoekt om inlichtingen over de onroerende zaak of zaken waarop het in
      [artikel 48][ref1] bedoelde, door hem te koop aangeboden recht betrekking heeft, de volgende bescheiden ter hand
      stellen:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: 48f.1.a
    text: |-
      een ontwerp van de in [artikel 48][ref1] bedoelde akte;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48f.1.b
    text: een schriftelijke mededeling betreffende de wijze waarop nadere inlichtingen kunnen worden verkregen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
  - number: 48f.2
    text: |-
      In reclame voor de onroerende zaak of zaken waarop het in [artikel 48][ref1] bedoelde, door de verkoper te
      koop aangeboden recht betrekking heeft, moet worden medegedeeld dat de in het vorige lid bedoelde bescheiden
      verkrijgbaar zijn, alsmede waar zij verkrijgbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
        afdeling: 10A
  - number: 48f.3
    text: |-
      Tot het aanbrengen van wijzigingen in het overeenkomstig lid 1 onder a ter hand gestelde ontwerp is de verkoper
      slechts bevoegd met wederzijds goedvinden, dan wel indien deze wijzigingen voortvloeien uit omstandigheden buiten
      zijn wil.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
  - number: 48f.4
    text: |-
      De verkoper moet wijzigingen als bedoeld in lid 3 mededelen voordat de koop wordt gesloten. Bovendien moeten zij
      uitdrukkelijk in de in [artikel 48][ref1] bedoelde akte worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
        afdeling: 10A
  - number: 48f.5
    text: De in lid 1 onder *b* bedoelde mededeling moet zijn gesteld in de bij algemene maatregel van bestuur bepaalde taal.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48f
  - number: 48g.1
    text: Van het bij of krachtens deze afdeling bepaalde kan niet ten nadele van de koper worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48g
  - number: 48g.2
    text: |-
      Aan de koper kan, indien de in de koop bedoelde onroerende zaak is gelegen op het grondgebied van een lid-staat
      van de Europese Unie of van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, de hem krachtens de richtlijn door het recht van die staat toegekende bescherming niet worden onthouden,
      ongeacht het recht dat de koop beheerst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel48g
  - number: '49'
    text: |-
      Ruil is de overeenkomst waarbij partijen zich verbinden elkaar over en weer een zaak in de plaats van een andere
      te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel49
  - number: '50'
    text: |-
      De bepalingen betreffende koop vinden overeenkomstige toepassing, met dien verstande dat elke partij wordt
      beschouwd als verkoper voor de prestatie die zij verschuldigd is, en als koper voor die welke haar toekomt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel50
  - number: '51'
    text: 'In deze titel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.a
    text: |-
      financiëlezekerheidsovereenkomst: een financiëlezekerheidsovereenkomst tot overdracht of een
      financiëlezekerheidsovereenkomst tot vestiging van een pandrecht;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.b
    text: |-
      financiëlezekerheidsovereenkomst tot overdracht: een overeenkomst op grond waarvan de onder d of e bedoelde
      goederen worden overgedragen als waarborg voor een verplichting;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.c
    text: |-
      financiëlezekerheidsovereenkomst tot vestiging van een pandrecht: een overeenkomst op grond waarvan een pandrecht
      wordt verschaft op de onder d of e bedoelde goederen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.d
    text: 'geld: op een rekening of deposito gecrediteerd tegoed in geld;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.e
    text: |-
      effecten: aandelen en andere met aandelen gelijk te stellen effecten, obligaties en andere schuldinstrumenten
      indien deze op de kapitaalmarkt verhandelbaar zijn, en alle andere gewoonlijk verhandelde effecten waarmee
      die aandelen, obligaties of andere effecten via inschrijving, koop of omruiling kunnen worden verkregen of die
      aanleiding kunnen geven tot afwikkeling in geld met uitsluiting van waardepapieren die een betalingsopdracht
      belichamen, inclusief rechten van deelneming in instellingen voor collectieve belegging, geldmarktinstrumenten en
      vorderingen op of rechten ten aanzien van een van de voornoemde instrumenten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.f
    text: 'gelijkwaardige goederen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.f.1
    text: 'wanneer het betreft geld: hetzelfde bedrag in dezelfde valuta;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.f.2
    text: |-
      wanneer het betreft effecten: effecten van dezelfde uitgevende instelling of debiteur, behorende tot dezelfde
      emissie of categorie, ter waarde van hetzelfde nominale bedrag, luidende in dezelfde valuta en van dezelfde soort,
      onderscheidenlijk andere goederen indien de financiëlezekerheidsoverkomst voorziet in de overdracht daarvan na het
      plaatsvinden van een gebeurtenis die betrekking heeft op of gevolgen heeft voor de effecten waarop de schuldenaar
      een pandrecht heeft gevestigd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.g
    text: |-
      executiegrond: verzuim of een andere omstandigheid op grond waarvan de zekerheidsnemer krachtens een
      financiëlezekerheidsovereenkomst of de wet gerechtigd is verpande goederen te verkopen of zich toe te eigenen dan
      wel gebruik te maken van een verrekenbeding;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: 51.h
    text: |-
      verrekenbeding: een beding in een financiëlezekerheidsovereenkomst of een overeenkomst waarvan een
      financiëlezekerheidsovereenkomst deel uitmaakt, of een wettelijk voorschrift, op grond waarvan bij het voldoen
      aan de voorwaarden van een executiegrond: - de verplichtingen van partijen onmiddellijk opeisbaar worden, alsmede
      omgezet in een verplichting tot het betalen van een bedrag dat hun geschatte actuele waarde vertegenwoordigt,
      dan wel de verplichtingen vervallen en worden vervangen door een verplichting tot het betalen van het voornoemde
      bedrag, of
        - de verplichtingen van partijen worden verrekend en alleen het saldo verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel51
  - number: '52.1'
    text: 'Deze titel is van toepassing op financiëlezekerheidsovereenkomsten waarbij ten minste een van de partijen is:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
  - number: 52.1.a
    text: |-
      een overheidsinstantie, met inbegrip van: - instellingen behorend tot de overheidssector van de lidstaten van de
      Europese Unie die belast zijn met of een rol spelen bij het beheer van de overheidsschuld en;
        - instellingen behorend tot de overheidssector van de lidstaten van de Europese Unie die zijn gemachtigd om voor
      klanten rekeningen aan te houden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
  - number: 52.1.b
    text: |-
      een centrale bank, de Europese Centrale Bank, de Bank voor Internationale Betalingen, een multilaterale
      ontwikkelingsbank, het Internationaal Monetair Fonds en de Europese Investeringsbank.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
  - number: 52.1.c
    text: |-
      een financiële instelling onder financieel toezicht, met inbegrip van: - een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet toezicht kredietwezen 1992][ref1];
        - een financiële instelling als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Wet toezicht kredietwezen 1992][ref2];
        - een effecteninstelling als bedoeld in [artikel 1, onderdeel d, van de Wet toezicht effectenverkeer 1995][ref3];
        - een verzekeraar als bedoeld in [artikel 1, onderdeel h, van de Wet toezicht verzekeringsbedrijf 1993][ref4];
        - een beleggingsinstelling als bedoeld in [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref5];
        - een beheerder als bedoeld in [artikel 1, onderdeel e, van de Wet toezicht beleggingsinstellingen][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0004809
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0004809
        artikel: '1'
  - number: 52.1.d
    text: |-
      een centrale tegenpartij, een afwikkelende instantie of een verrekeningsinstituut als bedoeld in
      [artikel 212a, onderdeel c, d en e, van de Faillissementswet][ref1], inclusief onder het nationale recht van de
      lidstaten van de Europese Unie vallende gereglementeerde instellingen die actief zijn op de markten voor rechten op
      overdracht op termijn van goederen, opties en derivaten, en een andere dan een natuurlijke persoon die optreedt als
      trustee of in een vertegenwoordigende hoedanigheid namens een of meer personen waaronder enigerlei obligatiehouders
      of houders van andere schuldinstrumenten of enige instelling als omschreven in onderdeel a, b, c of dit onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '52.2'
    text: |-
      Deze titel is niet van toepassing indien een van de partijen bij een financiëlezekerheidsovereenkomst een
      natuurlijke persoon is die niet handelt in de uitoefening van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel52
  - number: '53.1'
    text: |-
      Bij een financiëlezekerheidsovereenkomst tot vestiging van een pandrecht kan worden bedongen dat de zekerheidsnemer
      de verpande goederen kan gebruiken of verkopen en de opbrengst behouden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel53
  - number: '53.2'
    text: |-
      Uitoefening van het recht tot gebruik of verkoop brengt van rechtswege een verplichting van de zekerheidsnemer mee
      tot overdracht van gelijkwaardige goederen aan de zekerheidsgever, uiterlijk op het tijdstip waarop moet worden
      voldaan aan de vordering waarvoor het verpande tot zekerheid strekt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel53
  - number: '53.3'
    text: |-
      In afwijking van lid 2 kan in de financiëlezekerheidsovereenkomst worden bepaald dat de zekerheidsnemer de
      vordering waarvoor het verpande tot zekerheid strekt verrekent met de waarde van gelijkwaardige goederen, op het
      tijdstip waarop de vordering moet worden voldaan of zoveel eerder als zich een executiegrond voordoet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel53
  - number: '53.4'
    text: |-
      Het pandrecht strekt zich van rechtswege uit over de goederen die als gevolg van dit artikel in de plaats worden
      gesteld van de verbonden goederen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel53
  - number: '54.1'
    text: |-
      Tenzij anders is bedongen in een financiëlezekerheidsovereenkomst tot de vestiging van een pandrecht, is de
      zekerheidsnemer, wanneer aan de voorwaarden van een executiegrond wordt voldaan, bevoegd:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: 54.1.a
    text: |-
      effecten waarop het pandrecht rust te verkopen en het hem verschuldigde op de opbrengst te verhalen
      onderscheidenlijk deze effecten zich toe te eigenen en de waarde van de effecten te verrekenen met het hem
      verschuldigde;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: 54.1.b
    text: geld waarop het pandrecht rust te verrekenen met het hem verschuldigde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: '54.2'
    text: |-
      De verkoop van effecten geschiedt op een markt door tussenkomst van een tussenpersoon in het vak of ter beurze door
      die van een bevoegde tussenpersoon overeenkomstig de regels en gebruiken die aldaar voor een gewone verkoop gelden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: '54.3'
    text: |-
      De zekerheidsnemer kan zich effecten toe-eigenen indien dit in de financiëlezekerheidsovereenkomst tot de vestiging
      van een pandrecht is bedongen en de waardering van de effecten is gebaseerd op de waarde op een markt of ter
      beurze.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: '54.4'
    text: |-
      In afwijking van lid 2 en lid 3 kan in een financiëlezekerheidsovereenkomst worden bedongen dat de
      voorzieningenrechter van de rechtbank op verzoek van de zekerheidsnemer of de zekerheidsgever kan bepalen dat
      effecten worden verkocht op een afwijkende wijze, of dat de voorzieningenrechter op verzoek van de zekerheidsnemer
      kan bepalen dat effecten voor een door de voorzieningenrechter vast te stellen bedrag bij wege van toe-eigening aan
      de zekerheidsnemer zullen verblijven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
  - number: '54.5'
    text: |-
      De [artikelen 235][ref1], [248 leden 1 en 2][ref2], [249][ref3], [250][ref4], [251][ref5] en [252 van Boek 3][ref6]
      zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel235
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel248
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel249
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel250
      [ref5]: https://wetten.overheid.nl/BWBR0005291#Artikel251
      [ref6]: https://wetten.overheid.nl/BWBR0005291#Artikel252
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '235'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '248'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '249'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '250'
      - id: ref5
        bwb_id: BWBR0005291
        artikel: '251'
      - id: ref6
        bwb_id: BWBR0005291
        artikel: '252'
  - number: '55'
    text: |-
      Een overdracht ter nakoming van een financiëlezekerheidsovereenkomst tot overdracht is geen overdracht tot
      zekerheid of een overdracht die de strekking mist het goed na de overdracht in het vermogen van de verkrijger te
      doen vallen in de zin van [artikel 84 lid 3 van Boek 3][ref1]. De regels betreffende pandrecht zijn op een zodanige
      overeenkomst en de uitvoering daarvan niet van toepassing of overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel84
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '84'
  - number: '56.1'
    text: |-
      Indien een financiëlezekerheidsovereenkomst betrekking heeft op giraal overdraagbare effecten, wordt het
      goederenrechtelijke regime met betrekking tot die effecten beheerst door het recht van de staat op welks
      grondgebied de rekening waarin de effecten worden geadministreerd, wordt gehouden. De verwijzing naar dat recht
      omvat niet mede een verwijzing naar het internationaal privaatrecht van die staat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: '56.2'
    text: 'Het in lid 1 bedoelde recht bepaalt:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: 56.2.a
    text: welke rechten op de effecten kunnen rusten en welke de aard en de inhoud van deze rechten zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: 56.2.b
    text: welke vereisten aan de overdracht of de vestiging van de onder a bedoelde rechten worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: 56.2.c
    text: wie gerechtigd is tot de uitoefening van de in de effecten besloten rechten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: 56.2.d
    text: |-
      op welke wijze de onder a bedoelde rechten zich wijzigen, overgaan en tenietgaan en welke hun onderlinge verhouding
      is;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: 56.2.e
    text: de executie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel56
  - number: '175.1'
    text: |-
      Schenking is de overeenkomst om niet, die ertoe strekt dat de ene partij, de schenker, ten koste van eigen vermogen
      de andere partij, de begiftigde, verrijkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel175
  - number: '175.2'
    text: |-
      Het tot een bepaalde persoon gericht schenkingsaanbod geldt als aangenomen, wanneer deze na er van kennis te hebben
      genomen het niet onverwijld heeft afgewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel175
  - number: '176'
    text: |-
      lndien de schenker feiten stelt waaruit volgt dat de schenking door misbruik van omstandigheden is tot stand
      gekomen, rust bij een beroep op vernietigbaarheid de bewijslast van het tegendeel op de begiftigde, tenzij van
      de schenking een notariële akte is opgemaakt of deze verdeling van de bewijslast in de gegeven omstandigheden in
      strijd met de eisen van redelijkheid en billijkheid zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel176
  - number: '177.1'
    text: |-
      Voor zover een schenking de strekking heeft dat zij pas na het overlijden van de schenker zal worden uitgevoerd,
      en zij niet reeds tijdens het leven van de schenker is uitgevoerd, vervalt zij met het overlijden van de schenker,
      tenzij de schenking door de schenker persoonlijk is aangegaan en van de schenking een notariële akte is opgemaakt.
      Voor zover de schenking betrekking heeft op kleren, lijfstoebehoren, bepaalde lijfsieraden, bepaalde tot de
      inboedel behorende zaken en bepaalde boeken, kan worden volstaan met een door de schenker geheel met de hand
      geschreven, gedagtekende en ondertekende onderhandse akte.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel177
  - number: '177.2'
    text: |-
      Indien een bevoegdheid is bedongen tot herroeping van een schenkingsovereenkomst als bedoeld in lid 1, kan deze
      herroeping behalve bij een tot de begiftigde gerichte verklaring ook bij een uiterste wilsbeschikking van de
      schenker zonder mededeling aan de begiftigde geschieden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel177
  - number: '178.1'
    text: |-
      Een schenking is vernietigbaar, indien zij gedurende een ziekte van de schenker wordt gedaan hetzij aan een
      beroepsbeoefenaar op het gebied van de individuele gezondheidszorg die hem bijstand verleent, hetzij aan een
      geestelijk verzorger die hem gedurende de ziekte bijstaat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel178
  - number: '178.2'
    text: |-
      Ook is een schenking vernietigbaar indien zij gedurende een verblijf van de schenker in een voor de verzorging of
      verpleging van bejaarden of geestelijk gestoorden bestemde instelling wordt gedaan aan degene die de instelling
      exploiteert of die daarvan de leiding heeft of daarin werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel178
  - number: '178.3'
    text: |-
      [Artikel 62 leden 2 en 3 van Boek 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel178
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '178'
  - number: '178.4'
    text: |-
      De bevoegdheid tot vernietiging op grond van de leden 1 en 2 verjaart drie jaar nadat de in lid 1 bedoelde ziekte,
      onderscheidenlijk het in lid 2 bedoelde verblijf, is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel178
  - number: '178.5'
    text: |-
      Na het overlijden van de schenker kan de vernietiging van de schenking op grond van lid 1 of lid 2 mede
      plaatsvinden door een ieder die door de schenking nadeel lijdt. De vernietiging vindt slechts plaats voor
      zover deze nodig is tot opheffing van het nadeel van degene die zich op de vernietigingsgrond beroept. Een
      rechtsvordering tot vernietiging ingevolge de eerste zin verjaart op een met overeenkomstige toepassing van
      [artikel 54 van Boek 4][ref1] te bepalen tijdstip, en in ieder geval drie jaar nadat de in lid 1 bedoelde ziekte,
      onderscheidenlijk het in lid 2 bedoelde verblijf, is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel54
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '54'
  - number: '179.1'
    text: |-
      Een aanbod tot schenking dat de aanbieder ten tijde van zijn overlijden nog kon herroepen, komt, in afwijking van
      [artikel 222 van Boek 6][ref1], door zijn dood te vervallen, tenzij uit een overeenkomst of uit het aanbod zelf het
      tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel222
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '222'
  - number: '179.2'
    text: |-
      Is het aanbod bij wijze van uitloving voor een bepaalde tijd gedaan, dan komt het door het overlijden van de
      aanbieder binnen die tijd te vervallen, indien ten tijde van het overlijden een gewichtige reden tot herroeping als
      bedoeld in [artikel 220 lid 1 van Boek 6][ref1] bestond of het overlijden zelf een zodanige reden oplevert; alsdan
      is [artikel 220 lid 2 van Boek 6][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel220
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '220'
  - number: '180'
    text: |-
      Op schenkingen onder een ontbindende voorwaarde en een daarbij aansluitende schenking onder opschortende voorwaarde
      zijn de [artikelen 140 lid 1][ref1] en [141 van Boek 4][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel141
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '140'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '141'
  - number: '181.1'
    text: |-
      Een aanbod tot schenking dat door de dood van de aanbieder niet vervalt, kan niet worden aanvaard door iemand die
      op het tijdstip van overlijden van de aanbieder nog niet bestond.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel181
  - number: '181.2'
    text: 'Lid 1 is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel181
  - number: 181.2.a
    text: |-
      indien de schenker heeft bepaald dat hetgeen hij schenkt aan een afstammeling van zijn vader of moeder, bij
      het overlijden van die afstammeling of op een eerder tijdstip zal ten deel vallen aan diens alsdan bestaande
      afstammelingen staaksgewijze;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel181
  - number: 181.2.b
    text: |-
      indien de schenker heeft bepaald dat hetgeen hij aan iemand schenkt, bij het overlijden van de begiftigde of op
      een eerder tijdstip zal ten deel vallen aan een afstammeling van een ouder van de schenker, en tevens dat, indien
      die afstammeling dat tijdstip niet overleeft, diens alsdan bestaande afstammelingen staaksgewijze in diens plaats
      zullen treden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel181
  - number: 181.2.c
    text: |-
      indien de schenker heeft bepaald dat hetgeen de begiftigde van het hem geschonkene bij zijn overlijden of op een
      eerder tijdstip onverteerd zal hebben gelaten, alsdan zal ten deel vallen aan een dan bestaande bloedverwant van de
      schenker in de erfelijke graad.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel181
  - number: '182.1'
    text: |-
      Bij een aanbod tot schenking dat schriftelijk wordt gedaan, kan worden bepaald dat het geschonkene onder bewind
      zal staan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel182
  - number: '182.2'
    text: |-
      Het bewind heeft dezelfde rechtsgevolgen als een bij uiterste wilsbeschikking ingesteld bewind, met dien verstande
      dat
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel182
  - number: 182.2.a
    text: |-
      de termijnen bedoeld in de [artikelen 178 leden 1 en 2][ref1], [179 lid 2][ref2] en [180 lid 2 van Boek 4][ref3],
      aanvangen op het tijdstip waarop de schenking wordt uitgevoerd, en


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel180
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '178'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '180'
  - number: 182.2.b
    text: |-
      het bewind, voor zover het niet in het belang van een ander dan de begiftigde is ingesteld, ook eindigt wanneer de
      schenker en de begiftigde een gemeenschappelijk besluit tot opheffing schriftelijk ter kennis van de bewindvoerder
      brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel182
  - number: '183.1'
    text: |-
      Een schenker is voor gebreken in het recht of voor feitelijke gebreken alleen aansprakelijk, wanneer hij deze
      niet heeft opgegeven ofschoon zij hem bekend waren, en de begiftigde deze gebreken niet ter gelegenheid van de
      aflevering van het geschonken goed had kunnen ontdekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel183
  - number: '183.2'
    text: |-
      Deze aansprakelijkheid strekt zich, behoudens in het geval van bedrog, niet uit tot schade geleden ten aanzien van
      het geschonken goed zelf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel183
  - number: '184.1'
    text: 'In de navolgende gevallen is een schenking, ongeacht of zij reeds is uitgevoerd, vernietigbaar:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel184
  - number: 184.1.a
    text: |-
      indien de begiftigde in verzuim is met de voldoening van een hem bij de schenking opgelegde verplichting, waarvan
      noch de schenker noch een derde nakoming kan vorderen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel184
  - number: 184.1.b
    text: indien de begiftigde opzettelijk een misdrijf jegens de schenker of diens naaste betrekkingen pleegt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel184
  - number: 184.1.c
    text: |-
      indien een begiftigde die wettelijk of krachtens overeenkomst verplicht is tot onderhoud van de schenker bij te
      dragen, in verzuim is deze verplichting na te komen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel184
  - number: '184.2'
    text: |-
      In lid 1, onder b, wordt mede verstaan onder misdrijf: poging tot, voorbereiding van en deelneming aan een
      misdrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel184
  - number: '185.1'
    text: |-
      Rechtsvorderingen tot vernietiging van de schenking op grond van [artikel 184][ref1] verjaren door verloop van
      een jaar, te rekenen van de dag waarop het feit dat grond tot vernietiging oplevert, ter kennis van de schenker
      is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel184
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '184'
  - number: '185.2'
    text: |-
      Na het overlijden van de schenker kan vernietiging van de schenking op grond van het in het vorige
      artikel bepaalde slechts plaatsvinden door een rechterlijke uitspraak en, in de gevallen genoemd in
      [artikel 184 lid 1, onder b en c][ref1], alleen indien het feit dat grond tot vernietiging oplevert, de dood van de
      schenker heeft veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel184
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '184'
  - number: '186.1'
    text: |-
      De bepalingen van deze titel zijn van overeenkomstige toepassing op andere giften dan schenkingen, voor zover de
      strekking van de betrokken bepalingen in verband met de aard van de handeling zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel186
  - number: '186.2'
    text: |-
      Als gift wordt aangemerkt iedere handeling die er toe strekt dat degeen die de handeling verricht, een ander ten
      koste van eigen vermogen verrijkt. Zolang degene tot wiens verrijking de handeling strekt, de prestatie niet heeft
      ontvangen, noch daarop aanspraak kan maken, worden handelingen als bedoeld in de eerste volzin niet beschouwd als
      gift.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel186
  - number: '187.1'
    text: |-
      Is de begiftigde in verband met de gift gehouden een tegenprestatie te verrichten, dan is
      [artikel 186 lid 1][ref1], behoudens voor zover het [artikel 182][ref2] betreft, van toepassing, en gelden voorts
      de volgende twee leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel186
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel182
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '186'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '182'
  - number: '187.2'
    text: |-
      In het geval, bedoeld in [artikel 177 lid 1][ref1], vervalt de gift niet, doch is zij vernietigbaar. De
      vernietiging werkt terug tot het overlijden van degene die de gift doet. De bevoegdheid tot vernietiging vervalt
      indien de begiftigde tijdig een aanvullende prestatie toezegt, die de handeling haar in [artikel 186 lid 2][ref2]
      bedoelde strekking ontneemt. Bovendien kan de rechter op verlangen van een erfgenaam of van de begiftigde, in
      plaats van de vernietiging uit te spreken, te dien einde de gevolgen van de handeling wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel186
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '177'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '186'
  - number: '187.3'
    text: |-
      ls de gift vernietigbaar op grond van [artikel 178][ref1], dan is [artikel 54 van Boek 3][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel54
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '178'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '54'
  - number: '187.4'
    text: |-
      Op handelingen die ten dele als gift, ten dele als nakoming van een natuurlijke verbintenis zijn te beschouwen,
      zijn de vorige leden van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel187
  - number: '188.1'
    text: |-
      De aanwijzing van een begunstigde bij een sommenverzekering wordt, wanneer zij is aanvaard of kan worden aanvaard,
      aangemerkt als een gift, tenzij zij geschiedt ter nakoming van een verbintenis anders dan een uit schenking. De
      [artikelen 177][ref1], [179][ref2], [181][ref3], [182][ref4] en[187][ref5] zijn op deze giften niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel177
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel181
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel187
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '177'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '181'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '182'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '187'
  - number: '188.2'
    text: |-
      Als waarde van een gift door begunstiging bij een sommenverzekering geldt de waarde van de daaruit voortvloeiende
      rechten op uitkering. Indien de begunstiging slechts ten dele als gift wordt aangemerkt, geldt als waarde van de
      gift een evenredig deel van de waarde van de daaruit voortvloeiende rechten op uitkering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel188
  - number: '188.3'
    text: |-
      Het bedrag dat de verzekeraar krachtens de wet of een overeenkomst met de verzekeringnemer op de uitkering inhoudt,
      komt in de eerste plaats op de waarde van de gift in mindering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel188
  - number: '201.1'
    text: |-
      Huur is de overeenkomst waarbij de ene partij, de verhuurder, zich verbindt aan de andere partij, de huurder, een
      zaak of een gedeelte daarvan in gebruik te verstrekken en de huurder zich verbindt tot een tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel201
  - number: '201.2'
    text: |-
      Huur kan ook op vermogensrechten betrekking hebben. In dat geval zijn de bepalingen van deze afdeling en de
      [afdelingen 2–4][ref1] van toepassing, voor zover de strekking van die bepalingen of de aard van het recht zich
      daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling4
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '4'
  - number: '201.3'
    text: De pachtovereenkomst wordt niet als huur aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel201
  - number: '202'
    text: |-
      Indien de huurder recht heeft op de vruchten van de zaak, geldt dit recht als een genotsrecht als bedoeld in
      [artikel 17 van Boek 5][ref1]. De huurder verkrijgt dit recht van de dag van ingang van de huur af met dien
      verstande dat burgerlijke vruchten van dag tot dag berekend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel17
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '17'
  - number: '203'
    text: |-
      De verhuurder is verplicht de zaak ter beschikking van de huurder te stellen en te laten voor zover dat voor het
      overeengekomen gebruik noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel203
  - number: '204.1'
    text: De verhuurder heeft met betrekking tot gebreken van de zaak de in deze afdeling omschreven verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel204
  - number: '204.2'
    text: |-
      Een gebrek is een staat of eigenschap van de zaak of een andere niet aan de huurder toe te rekenen omstandigheid,
      waardoor de zaak aan de huurder niet het genot kan verschaffen dat een huurder bij het aangaan van de overeenkomst
      mag verwachten van een goed onderhouden zaak van de soort als waarop de overeenkomst betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel204
  - number: '204.3'
    text: |-
      Een feitelijke stoornis door derden zonder bewering van recht als bedoeld in [artikel 211][ref1] en een bewering
      van recht zonder feitelijke stoornis zijn geen gebreken in de zin van lid 2.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel211
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '211'
        afdeling: '2'
  - number: '205'
    text: |-
      De uit deze afdeling voortvloeiende rechten van de huurder komen aan deze toe, onverminderd alle andere rechten
      en vorderingen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel205
  - number: '206.1'
    text: |-
      De verhuurder is verplicht op verlangen van de huurder gebreken te verhelpen, tenzij dit onmogelijk is of uitgaven
      vereist die in de gegeven omstandigheden redelijkerwijs niet van de verhuurder zijn te vergen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel206
  - number: '206.2'
    text: |-
      Deze verplichting geldt niet ten aanzien van de kleine herstellingen tot het verrichten waarvan de huurder
      krachtens [artikel 217][ref1] verplicht is, en ten aanzien van gebreken voor het ontstaan waarvan de huurder jegens
      de verhuurder aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel217
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '217'
        afdeling: '3'
  - number: '206.3'
    text: |-
      Is de verhuurder met het verhelpen in verzuim, dan kan de huurder dit verhelpen zelf verrichten en de daarvoor
      gemaakte kosten, voor zover deze redelijk waren, op de verhuurder verhalen, desgewenst door deze in mindering van
      de huurprijs te brengen. Hiervan kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel206
  - number: '207.1'
    text: |-
      De huurder kan in geval van vermindering van huurgenot ten gevolge van een gebrek een daaraan evenredige
      vermindering van de huurprijs vorderen van de dag waarop hij van het gebrek behoorlijk heeft kennis gegeven aan de
      verhuurder of waarop het gebrek reeds in voldoende mate bekend was om tot maatregelen over te gaan, tot die waarop
      het gebrek is verholpen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel207
  - number: '207.2'
    text: |-
      De huurder heeft geen aanspraak op huurvermindering terzake van gebreken die hij krachtens [artikel 217][ref1]
      verplicht is te verhelpen, of voor het ontstaan waarvan hij jegens de verhuurder aansprakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel217
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '217'
        afdeling: '3'
  - number: '208'
    text: |-
      Onverminderd de gevolgen van niet-nakoming van de verplichting van [artikel 206][ref1] is de verhuurder
      tot vergoeding van de door een gebrek veroorzaakte schade verplicht, indien het gebrek na het aangaan van
      de overeenkomst is ontstaan en aan hem is toe te rekenen, alsmede indien het gebrek bij het aangaan van de
      overeenkomst aanwezig was en de verhuurder het toen kende of had behoren te kennen, of toen aan de huurder heeft te
      kennen gegeven dat de zaak het gebrek niet had.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '206'
        afdeling: '2'
  - number: '209'
    text: |-
      Van de [artikelen 206, leden 1 en 2][ref1], [207][ref2] en[ 208][ref3] kan niet ten nadele van de huurder worden
      afgeweken voor zover het gaat om gebreken die de verhuurder bij het aangaan van de overeenkomst kende of had
      behoren te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel207
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel208
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '206'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '207'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '208'
        afdeling: '2'
  - number: '210.1'
    text: |-
      Indien een gebrek dat de verhuurder ingevolge [artikel 206][ref1] niet verplicht is te verhelpen, het genot dat de
      huurder mocht verwachten, geheel onmogelijk maakt, is zowel de huurder als de verhuurder bevoegd de huur op de voet
      van [artikel 267 van Boek 6][ref2] te ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel267
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '206'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '267'
  - number: '210.2'
    text: |-
      Een verplichting van een der partijen tot schadevergoeding ter zake van een gebrek omvat mede de door het eindigen
      van de huur ingevolge lid 1 veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel210
  - number: '211.1'
    text: |-
      Wanneer tegen de huurder door een derde een vordering wordt ingesteld tot uitwinning of tot verlening van een recht
      waarmee de zaak waarop de huurovereenkomst betrekking heeft, ingevolge die overeenkomst niet belast had mogen zijn,
      is de verhuurder na kennisgeving daarvan door de huurder gehouden in het geding te komen ten einde de belangen van
      de huurder te verdedigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel211
  - number: '211.2'
    text: |-
      De verhuurder moet aan de huurder alle door deze vordering ontstane kosten vergoeden, doch, als de kennisgeving
      niet onverwijld is geschied, alleen de na de kennisgeving ontstane kosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel211
  - number: '211.3'
    text: |-
      Wanneer tegen de onderhuurder een vordering betreffende het ondergehuurde wordt ingesteld door de hoofdverhuurder,
      zijn de voorgaande leden van overeenkomstige toepassing op de onderverhuurder. Voor de toepassing van [artikel
      2.9.5 van het Wetboek van Burgerlijke Rechtsvordering](onbekend) wordt deze vordering gelijkgesteld aan een
      vordering tot uitwinning.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel211
  - number: '212'
    text: De huurder is verplicht de tegenprestatie op de overeengekomen wijze en tijdstippen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel212
  - number: '213'
    text: De huurder is verplicht zich ten aanzien van het gebruik van de gehuurde zaak als een goed huurder te gedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel213
  - number: '214'
    text: |-
      De huurder is slechts bevoegd tot het gebruik van de zaak dat is overeengekomen, en, zo daaromtrent niets is
      overeengekomen, tot het gebruik waartoe de zaak naar zijn aard bestemd is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel214
  - number: '215.1'
    text: |-
      De huurder is niet bevoegd de inrichting of gedaante van het gehuurde geheel of gedeeltelijk te veranderen dan na
      schriftelijke toestemming van de verhuurder, tenzij het gaat om veranderingen en toevoegingen die bij het einde van
      de huur zonder noemenswaardige kosten kunnen worden ongedaan gemaakt en verwijderd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '215.2'
    text: |-
      Indien het de huur van woonruimte betreft, verleent de verhuurder binnen acht weken de toestemming in ieder geval,
      indien de voorgenomen veranderingen de verhuurbaarheid van het gehuurde niet schaden, dan wel niet leiden tot een
      waardedaling van het gehuurde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '215.3'
    text: |-
      Indien de verhuurder de toestemming niet verleent, kan de huurder vorderen dat de rechter hem zal machtigen tot
      het aanbrengen van de veranderingen. Indien de verhuurder niet tevens de eigenaar, vruchtgebruiker of erfpachter
      van de zaak is, draagt de verhuurder ervoor zorg dat ook de eigenaar, vruchtgebruiker of erfpachter tijdig in het
      geding wordt geroepen. Indien op de zaak een hypotheek rust, bestaat deze verplichting tevens ten aanzien van de
      hypotheekhouder.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '215.4'
    text: |-
      De rechter wijst de vordering in ieder geval toe, indien de verhuurder op grond van lid 2 toestemming had behoren
      te geven. In andere gevallen wijst hij de vordering slechts toe, indien de veranderingen noodzakelijk zijn voor een
      doelmatig gebruik van het gehuurde door de huurder of het woongenot verhogen en geen zwaarwichtige bezwaren aan de
      zijde van de verhuurder zich tegen het aanbrengen daarvan verzetten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '215.5'
    text: |-
      De rechter kan aan de machtiging voorwaarden verbinden of daarbij een last opleggen; hij kan op vordering van de
      verhuurder de huurprijs verhogen, indien de veranderingen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '215.6'
    text: |-
      Van de voorgaande leden kan niet ten nadele van de huurder worden afgeweken, tenzij het de buitenzijde van gehuurde
      woonruimte betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel215
  - number: '216.1'
    text: |-
      De huurder is tot de ontruiming bevoegd door hem aangebrachte veranderingen en toevoegingen ongedaan te maken, mits
      daarbij het gehuurde in de toestand wordt gebracht, die bij het einde van de huur redelijkerwijs in overeenstemming
      met de oorspronkelijke kan worden geacht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel216
  - number: '216.2'
    text: |-
      De huurder is niet verplicht tot het ongedaan maken van geoorloofde veranderingen en toevoegingen, onverminderd de
      bevoegdheid van de rechter om hem op de voet van [artikel 215 lid 5][ref1] de verplichting op te leggen hiervoor
      vóór de ontruiming van het gehuurde zorg te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel215
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '215'
        afdeling: '3'
  - number: '216.3'
    text: |-
      De huurder kan ter zake van geoorloofde veranderingen en toevoegingen die na het einde van de huurovereenkomst niet
      ongedaan worden gemaakt, vergoeding vorderen voor zover [artikel 212 van Boek 6][ref1] dat toestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel212
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel216
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '212'
  - number: '217'
    text: |-
      De huurder is verplicht te zijnen koste de kleine herstellingen te verrichten, tenzij deze nodig zijn geworden door
      het tekortschieten van de verhuurder in de nakoming van zijn verplichting tot het verhelpen van gebreken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel217
  - number: '218.1'
    text: |-
      De huurder is aansprakelijk voor schade aan de verhuurde zaak die is ontstaan door een hem toe te rekenen
      tekortschieten in de nakoming van een verplichting uit de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel218
  - number: '218.2'
    text: |-
      Alle schade wordt vermoed daardoor te zijn ontstaan, behoudens brandschade en, in geval van huur van een gebouwde
      onroerende zaak of een gedeelte daarvan, schade aan de buitenzijde van het gehuurde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel218
  - number: '218.3'
    text: |-
      Onverminderd [artikel 224 lid 2][ref1] wordt de huurder vermoed het gehuurde in onbeschadigde toestand te hebben
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel224
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel218
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '224'
        afdeling: '3'
  - number: '219'
    text: |-
      De huurder is jegens de verhuurder op gelijke wijze als voor eigen gedragingen aansprakelijk voor de gedragingen
      van hen die met zijn goedvinden het gehuurde gebruiken of zich met zijn goedvinden daarop bevinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel219
  - number: '220.1'
    text: |-
      Indien gedurende de huurtijd dringende werkzaamheden aan het gehuurde moeten worden uitgevoerd of de verhuurder
      krachtens [artikel 56 van Boek 5][ref1] iets moet toestaan ten behoeve van een naburig erf, moet de huurder
      daartoe gelegenheid geven, onverminderd zijn aanspraken op vermindering van de huurprijs, op ontbinding van de
      huurovereenkomst en op schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel56
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel220
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '56'
  - number: '220.2'
    text: |-
      Lid 1 is van overeenkomstige toepassing wanneer de verhuurder met voortzetting van de huurovereenkomst wil overgaan
      tot renovatie van de gebouwde onroerende zaak waarop die overeenkomst betrekking heeft, en daartoe aan de huurder
      een, gelet op het belang van de verhuurder en de belangen van de huurder en eventuele onderhuurders, redelijk
      voorstel doet. Een dergelijk voorstel wordt schriftelijk gedaan. Onder renovatie wordt zowel sloop met vervangende
      nieuwbouw als gedeeltelijke vernieuwing door verandering of toevoeging verstaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel220
  - number: '220.3'
    text: |-
      Indien de renovatie tien of meer woningen of bedrijfsruimten die een bouwkundige eenheid vormen, betreft wordt het
      in lid 2 bedoelde voorstel vermoed redelijk te zijn, wanneer 70% of meer van de huurders daarmee heeft ingestemd.
      De huurder die niet met het voorstel heeft ingestemd, kan binnen acht weken na de schriftelijke kennisgeving van de
      verhuurder aan hem dat 70% of meer van de huurders met het voorstel heeft ingestemd een beslissing van de rechter
      vorderen omtrent de redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel220
  - number: '220.4'
    text: |-
      De voorgaande leden doen niet af aan de bevoegdheid van de verhuurder om de huurovereenkomst op te zeggen op de
      grond dat hij de zaak dringend nodig heeft voor renovatie, voor zover zulks kan worden gebracht onder de wettelijke
      opzeggingsgronden die gelden voor een gebouwde onroerende zaak als waarop de huurovereenkomst betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel220
  - number: '221'
    text: |-
      De huurder is bevoegd het gehuurde geheel of gedeeltelijk aan een ander in gebruik te geven, tenzij hij moest
      aannemen dat de verhuurder tegen het in gebruik geven aan die ander redelijke bezwaren zal hebben.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel221
  - number: '222'
    text: |-
      Indien de huurder gebreken aan de zaak ontdekt of derden hem in zijn genot storen of enig recht op de zaak beweren,
      moet hij daarvan onverwijld aan de verhuurder kennis geven, bij gebreke waarvan hij verplicht is aan de verhuurder
      de door de nalatigheid ontstane schade te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel222
  - number: '223'
    text: |-
      De huurder van een onroerende zaak of een gedeelte daarvan is, indien de verhuurder tot verhuur na afloop van
      lopende huur of tot verkoop wenst over te gaan, verplicht te dulden dat aan de zaak de gebruikelijke kennisgevingen
      van het te huur of te koop zijn worden aangebracht, en aan belangstellenden gelegenheid te geven tot bezichtiging.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel223
  - number: '224.1'
    text: De huurder is verplicht het gehuurde bij het einde van de huur weer ter beschikking van de verhuurder te stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel224
  - number: '224.2'
    text: |-
      Indien tussen de huurder en verhuurder een beschrijving van het verhuurde is opgemaakt, is de huurder gehouden
      de zaak in dezelfde staat op te leveren waarin deze volgens de beschrijving is aanvaard, met uitzondering van
      geoorloofde veranderingen en toevoegingen en hetgeen door ouderdom is teniet gegaan of beschadigd. Indien geen
      beschrijving is opgemaakt, wordt de huurder, behoudens tegenbewijs, verondersteld het gehuurde in de staat te
      hebben ontvangen zoals deze is bij het einde van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel224
  - number: '225'
    text: |-
      Houdt de huurder na het einde van de huur het gehuurde onrechtmatig onder zich, dan kan de verhuurder over de tijd
      dat hij het gehuurde mist, een vergoeding vorderen gelijk aan de huurprijs, onverminderd, indien zijn schade meer
      dan deze vergoeding bedraagt, zijn recht op dit meerdere.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel225
  - number: '226.1'
    text: |-
      Overdracht van de zaak waarop de huurovereenkomst betrekking heeft en vestiging of overdracht van een zelfstandig
      recht van vruchtgebruik, erfpacht of opstal op de zaak waarop de huurovereenkomst betrekking heeft, door de
      verhuurder doen de rechten en verplichtingen van de verhuurder uit de huurovereenkomst, die daarna opeisbaar
      worden, overgaan op de verkrijger.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel226
  - number: '226.2'
    text: Overdracht door een schuldeiser van de verhuurder wordt met overdracht door de verhuurder gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel226
  - number: '226.3'
    text: |-
      De verkrijger wordt slechts gebonden door die bedingen van de huurovereenkomst, die onmiddellijk verband houden met
      het doen hebben van het gebruik van de zaak tegen een door de huurder te betalen tegenprestatie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel226
  - number: '226.4'
    text: |-
      Bij huur van een gebouwde onroerende zaak of een gedeelte daarvan alsmede van een woonwagen in de zin van
      [artikel 235][ref1] en van een standplaats in de zin van [artikel 236][ref2], kan niet van de voorgaande leden
      worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel235
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel236
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel226
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '235'
        paragraaf: Onderafdeling_1
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '236'
        paragraaf: Onderafdeling_1
        afdeling: '5'
  - number: '227'
    text: |-
      In geval van vestiging of overdracht van een beperkt recht op de verhuurde zaak, dat niet onder
      [artikel 226 lid 1][ref1] is begrepen, is de gerechtigde jegens de huurder verplicht zich te onthouden van een
      uitoefening van dat recht, die het gebruik door de huurder belemmert.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
        afdeling: '4'
  - number: '228.1'
    text: |-
      Een huur voor bepaalde tijd aangegaan, eindigt, zonder dat daartoe een opzegging vereist is, wanneer die tijd is
      verstreken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel228
  - number: '228.2'
    text: |-
      Een huur voor onbepaalde tijd aangegaan of voor onbepaalde tijd verlengd eindigt door opzegging. Heeft de huur
      betrekking op een onroerende zaak die noch woonruimte, noch bedrijfsruimte is, dan dient de opzegging te geschieden
      tegen een voor huurbetaling overeengekomen dag op een termijn van tenminste een maand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel228
  - number: '229.1'
    text: De dood van de huurder of de verhuurder doet de huur niet eindigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel229
  - number: '229.2'
    text: |-
      Indien de erfgenamen van de huurder niet bevoegd zijn de zaak aan een ander in gebruik te geven, kunnen zij,
      onderscheidenlijk zijn echtgenoot of geregistreerde partner in het geval zijn nalatenschap overeenkomstig
      [artikel 13 van Boek 4][ref1] wordt verdeeld, gedurende zes maanden na het overlijden van hun erflater de
      overeenkomst op een termijn van tenminste een maand opzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '229.3'
    text: |-
      Indien een huurder twee of meer erfgenamen nalaat, is de verhuurder verplicht zijn medewerking te verlenen aan de
      toedeling van de rechten en verplichtingen van de overleden huurder uit de huurovereenkomst door de gezamenlijke
      erfgenamen aan een of meer van hen, tenzij de verhuurder tegen een of meer van de aangewezenen redelijke bezwaren
      heeft. De eerste zin is niet van toepassing indien de nalatenschap ingevolge [artikel 13 van Boek 4][ref1] is
      verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '230'
    text: |-
      Indien na afloop van een huurovereenkomst de huurder met goedvinden van de verhuurder het gebruik van het gehuurde
      behoudt, wordt daardoor, tenzij van een andere bedoeling blijkt, de overeenkomst, ongeacht de tijd waarvoor zij was
      aangegaan, voor onbepaalde tijd verlengd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230
  - number: 230a.1
    text: |-
      Heeft de huur betrekking op een gebouwde onroerende zaak of gedeelte daarvan en is die zaak of dat gedeelte noch
      woonruimte, noch bedrijfsruimte in de zin van deze titel, dan kan de huurder na het einde van de huurovereenkomst
      de rechter verzoeken de termijn waarbinnen ontruiming moet plaats vinden, te verlengen. Het verzoek moet worden
      ingediend binnen twee maanden na het tijdstip waartegen schriftelijk ontruiming is aangezegd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.2
    text: |-
      Het eerste lid geldt niet in geval de huurder zelf de huur heeft opgezegd, uitdrukkelijk in de beëindiging daarvan
      heeft toegestemd of veroordeeld is tot ontruiming wegens niet nakoming van zijn verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.3
    text: |-
      De verhuurder kan niet verlangen dat de huurder voor het einde van de in lid 1 bedoelde termijn tot ontruiming
      overgaat. De indiening van het verzoek schorst de verplichting om tot ontruiming over te gaan, totdat op het
      verzoek is beslist.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.4
    text: |-
      Het verzoek wordt slechts toegewezen indien de belangen van de huurder en van de onderhuurder aan wie bevoegdelijk
      is onderverhuurd, door de ontruiming ernstiger worden geschaad dan die van de verhuurder bij voortzetting van het
      gebruik door de huurder. Het verzoek wordt niettemin afgewezen, indien de verhuurder aannemelijk maakt dat van
      hem wegens onbehoorlijk gebruik van het verhuurde, wegens ernstige overlast, de medegebruikers dan wel hemzelf
      aangedaan, of wegens wanbetaling niet gevergd kan worden dat de huurder langer het recht op het gebruik van de zaak
      of gedeelte daarvan behoudt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.5
    text: |-
      De verlenging kan worden uitgesproken voor een termijn van ten hoogste een jaar na het eindigen van de
      overeenkomst. Deze termijn kan op verzoek van de huurder nog tweemaal telkens met ten hoogste een jaar worden
      verlengd. Het verzoek tot verlenging moet uiterlijk een maand voor het verstrijken van de termijn worden ingediend.
      Lid 3, tweede zin, en lid 4 zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.6
    text: |-
      Zo partijen het niet eens zijn over de som die de huurder gedurende de termijn waarmee de verlenging heeft plaats
      gevonden, voor het gebruik van de zaak of gedeelte daarvan verplicht is te betalen, stelt rechter deze som vast op
      een, gezien het huurpeil ter plaatse, redelijk bedrag. Hij kan, zo een der partijen dit verzoekt, te dier zake een
      voorlopige voorziening treffen. Voor het overige blijven gedurende deze termijn de rechten en verplichtingen uit de
      huurovereenkomst tussen partijen van kracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.7
    text: |-
      Bij afwijzing van het verzoek stelt de rechter het tijdstip van ontruiming vast. De beschikking geldt als een
      veroordeling tot ontruiming tegen dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.8
    text: Tegen een beschikking krachtens dit artikel staat geen hogere voorziening open.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: 230a.9
    text: Van dit artikel kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel230a
  - number: '231.1'
    text: |-
      Ontbinding van een huurovereenkomst met betrekking tot een gebouwde onroerende zaak alsmede een woonwagen in
      de zin van [artikel 235][ref1] en een standplaats in de zin van [artikel 236][ref2] op de grond dat de huurder
      tekortgeschoten is in de nakoming van zijn verplichtingen, kan slechts geschieden door de rechter, behoudens in het
      geval van lid 2 en van [artikel 210][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel235
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel236
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel210
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel231
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '235'
        paragraaf: Onderafdeling_1
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '236'
        paragraaf: Onderafdeling_1
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '210'
        afdeling: '2'
  - number: '231.2'
    text: |-
      De verhuurder kan de overeenkomst op de voet van [artikel 267 van Boek 6][ref1] ontbinden op de
      grond dat door gedragingen in het gehuurde de openbare orde is verstoord en het gehuurde deswege op
      grond van [artikel 174a van de Gemeentewet][ref2] dan wel op grond van een verordening als bedoeld
      in [artikel 174 van die wet][ref3] is gesloten, door gedragingen in zodanig gebouw in strijd met
      [artikel 2][ref4] of [3 van de Opiumwet][ref5] is gehandeld en het desbetreffende gebouw deswege op grond van
      [artikel 13b van die wet][ref6] is gesloten, of zodanig gebouw op grond van [artikel 97 van de Woningwet][ref7]
      is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel267
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174a
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel174
      [ref4]: https://wetten.overheid.nl/BWBR0001941#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0001941#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0001941#Artikel13b
      [ref7]: https://wetten.overheid.nl/BWBR0005181#Artikel97
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel231
    references:
      - id: ref1
