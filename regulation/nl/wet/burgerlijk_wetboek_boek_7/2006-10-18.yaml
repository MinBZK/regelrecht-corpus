  - number: '446.1'
    text: |-
      De overeenkomst inzake geneeskundige behandeling - in deze afdeling verder aangeduid als de
      behandelingsovereenkomst - is de overeenkomst waarbij een natuurlijke persoon of een rechtspersoon, de
      hulpverlener, zich in de uitoefening van een geneeskundig beroep of bedrijf tegenover een ander, de opdrachtgever,
      verbindt tot het verrichten van handelingen op het gebied van de geneeskunst, rechtstreeks betrekking hebbende
      op de persoon van de opdrachtgever of van een bepaalde derde. Degene op wiens persoon de handelingen rechtstreeks
      betrekking hebben wordt verder aangeduid als de patiënt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: '446.2'
    text: 'Onder handelingen op het gebied van de geneeskunst worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: 446.2.a
    text: |-
      alle verrichtingen - het onderzoeken en het geven van raad daaronder begrepen - rechtstreeks betrekking hebbende op
      een persoon en ertoe strekkende hem van een ziekte te genezen, hem voor het ontstaan van een ziekte te behoeden of
      zijn gezondheidstoestand te beoordelen, dan wel deze verloskundige bijstand te verlenen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: 446.2.b
    text: |-
      andere dan de onder *a* bedoelde handelingen, rechtstreeks betrekking hebbende op een persoon, die worden verricht
      door een arts of tandarts in die hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: '446.3'
    text: |-
      Tot de handelingen, bedoeld in lid 1, worden mede gerekend het in het kader daarvan verplegen en verzorgen van de
      patiënt en het overigens rechtstreeks ten behoeve van de patiënt voorzien in de materiële omstandigheden waaronder
      die handelingen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: '446.4'
    text: |-
      Onder handelingen als bedoeld in lid 1 zijn niet begrepen handelingen op het gebied van de artsenijbereidkunst
      in de zin van de [Wet op de Geneesmiddelenvoorziening][ref1], indien deze worden verricht door een gevestigde
      apotheker in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002290
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
    references:
      - id: ref1
        bwb_id: BWBR0002290
  - number: '446.5'
    text: |-
      Geen behandelingsovereenkomst is aanwezig, indien het betreft handelingen ter beoordeling van de
      gezondheidstoestand of medische begeleiding van een persoon, verricht in opdracht van een ander dan die persoon
      in verband met de vaststelling van aanspraken of verplichtingen, de toelating tot een verzekering of voorziening,
      of de beoordeling van de geschiktheid voor een opleiding, een arbeidsverhouding of de uitvoering van bepaalde
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel446
  - number: '447.1'
    text: |-
      Een minderjarige die de leeftijd van zestien jaren heeft bereikt, is bekwaam tot het aangaan van een
      behandelingsovereenkomst ten behoeve van zichzelf, alsmede tot het verrichten van rechtshandelingen die met de
      overeenkomst onmiddellijk verband houden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel447
  - number: '447.2'
    text: |-
      De minderjarige is aansprakelijk voor de daaruit voortvloeiende verbintenissen, onverminderd de verplichting van
      zijn ouders tot voorziening in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel447
  - number: '447.3'
    text: |-
      In op die behandelingsovereenkomst betrekking hebbende aangelegenheden is de minderjarige bekwaam in en buiten
      rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel447
  - number: '448.1'
    text: |-
      De hulpverlener licht de patiënt op duidelijke wijze, en desgevraagd schriftelijk in over het voorgenomen
      onderzoek en de voorgestelde behandeling en over de ontwikkelingen omtrent het onderzoek, de behandeling en de
      gezondheidstoestand van de patiënt. De hulpverlener licht een patiënt die de leeftijd van twaalf jaren nog niet
      heeft bereikt op zodanige wijze in als past bij zijn bevattingsvermogen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: '448.2'
    text: |-
      Bij het uitvoeren van de in lid 1 neergelegde verplichting laat de hulpverlener zich leiden door hetgeen de patiënt
      redelijkerwijze dient te weten ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: 448.2.a
    text: |-
      de aard en het doel van het onderzoek of de behandeling die hij noodzakelijk acht en van de uit te voeren
      verrichtingen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: 448.2.b
    text: de te verwachten gevolgen en risico’s daarvan voor de gezondheid van de patiënt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: 448.2.c
    text: andere methoden van onderzoek of behandeling die in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: 448.2.d
    text: |-
      de staat van en de vooruitzichten met betrekking tot diens gezondheid voor wat betreft het terrein van het
      onderzoek of de behandeling.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: '448.3'
    text: |-
      De hulpverlener mag de patiënt bedoelde inlichtingen slechts onthouden voor zover het verstrekken ervan kennelijk
      ernstig nadeel voor de patiënt zou opleveren. Indien het belang van de patiënt dit vereist, dient de hulpverlener
      de desbetreffende inlichtingen aan een ander dan de patiënt te verstrekken. De inlichtingen worden de patiënt
      alsnog gegeven, zodra bedoeld nadeel niet meer te duchten is. De hulpverlener maakt geen gebruik van zijn in de
      eerste volzin bedoelde bevoegdheid dan nadat hij daarover een andere hulpverlener heeft geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel448
  - number: '449'
    text: |-
      Indien de patiënt te kennen heeft gegeven geen inlichtingen te willen ontvangen, blijft het verstrekken daarvan
      achterwege, behoudens voor zover het belang dat de patiënt daarbij heeft niet opweegt tegen het nadeel dat daaruit
      voor hemzelf of anderen kan voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel449
  - number: '450.1'
    text: Voor verrichtingen ter uitvoering van een behandelingsovereenkomst is de toestemming van de patiënt vereist.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel450
  - number: '450.2'
    text: |-
      Indien de patiënt minderjarig is en de leeftijd van twaalf maar nog niet die van zestien jaren heeft bereikt, is
      tevens de toestemming van de ouders die het gezag over hem uitoefenen of van zijn voogd vereist. De verrichting kan
      evenwel zonder de toestemming van de ouders of de voogd worden uitgevoerd, indien zij kennelijk nodig is teneinde
      ernstig nadeel voor de patiënt te voorkomen, alsmede indien de patiënt ook na de weigering van de toestemming, de
      verrichting weloverwogen blijft wensen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel450
  - number: '450.3'
    text: |-
      In het geval waarin een patiënt van zestien jaren of ouder niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake, worden door de hulpverlener en een persoon als bedoeld in de
      [leden 2 of 3 van artikel 465][ref1], de kennelijke opvattingen van de patiënt, geuit in schriftelijke vorm toen
      deze tot bedoelde redelijke waardering nog in staat was en inhoudende een weigering van toestemming als bedoeld in
      lid 1, opgevolgd. De hulpverlener kan hiervan afwijken indien hij daartoe gegronde redenen aanwezig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '451'
    text: |-
      Op verzoek van de patiënt legt de hulpverlener in ieder geval schriftelijk vast voor welke verrichtingen van
      ingrijpende aard deze toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel451
  - number: '452'
    text: |-
      De patiënt geeft de hulpverlener naar beste weten de inlichtingen en de medewerking die deze redelijkerwijs voor
      het uitvoeren van de overeenkomst behoeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel452
  - number: '453'
    text: |-
      De hulpverlener moet bij zijn werkzaamheden de zorg van een goed hulpverlener in acht nemen en handelt daarbij
      in overeenstemming met de op hem rustende verantwoordelijkheid, voortvloeiende uit de voor hulpverleners geldende
      professionele standaard.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel453
  - number: '454.1'
    text: |-
      De hulpverlener richt een dossier in met betrekking tot de behandeling van de patiënt. Hij houdt in het dossier
      aantekening van de gegevens omtrent de gezondheid van de patiënt en de te diens aanzien uitgevoerde verrichtingen
      en neemt andere stukken, bevattende zodanige gegevens, daarin op, een en ander voor zover dit voor een goede
      hulpverlening aan hem noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel454
  - number: '454.2'
    text: |-
      De hulpverlener voegt desgevraagd een door de patiënt afgegeven verklaring met betrekking tot de in het dossier
      opgenomen stukken aan het dossier toe.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel454
  - number: '454.3'
    text: |-
      Onverminderd het bepaalde in [artikel 455][ref1], bewaart de hulpverlener de bescheiden, bedoeld in de vorige
      leden, gedurende vijftien jaren, te rekenen vanaf het tijdstip waarop zij zijn vervaardigd, of zoveel langer als
      redelijkerwijs uit de zorg van een goed hulpverlener voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel455
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel454
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '455'
        afdeling: '5'
  - number: '455.1'
    text: |-
      De hulpverlener vernietigt de door hem bewaarde bescheiden, bedoeld in [artikel 454][ref1], binnen drie maanden na
      een daartoe strekkend verzoek van de patiënt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel455
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '455.2'
    text: |-
      Lid 1 geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat de bewaring
      van aanmerkelijk belang is voor een ander dan de patiënt, alsmede voor zover het bepaalde bij of krachtens de wet
      zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel455
  - number: '456'
    text: |-
      De hulpverlener verstrekt aan de patiënt desgevraagd zo spoedig mogelijk inzage in en afschrift van de bescheiden,
      bedoeld in [artikel 454][ref1]. De verstrekking blijft achterwege voor zover dit noodzakelijk is in het belang
      van de bescherming van de persoonlijke levenssfeer van een ander. De hulpverlener mag voor de verstrekking van het
      afschrift een redelijke vergoeding in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel456
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '457.1'
    text: |-
      Onverminderd het in [artikel 448 lid 3, tweede volzin][ref1], bepaalde draagt de hulpverlener zorg, dat aan
      anderen dan de patiënt geen inlichtingen over de patiënt dan wel inzage in of afschrift van de bescheiden, bedoeld
      in [artikel 454][ref2], worden verstrekt dan met toestemming van de patiënt. Indien verstrekking plaatsvindt,
      geschiedt deze slechts voor zover daardoor de persoonlijke levenssfeer van een ander niet wordt geschaad. De
      verstrekking kan geschieden zonder inachtneming van de beperkingen, bedoeld in de voorgaande volzinnen, indien het
      bij of krachtens de wet bepaalde daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '448'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: '457.2'
    text: |-
      Onder anderen dan de patiënt zijn niet begrepen degenen die rechtstreeks betrokken zijn bij de uitvoering van
      de behandelingsovereenkomst en degene die optreedt als vervanger van de hulpverlener, voor zover de verstrekking
      noodzakelijk is voor de door hen in dat kader te verrichten werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel457
  - number: '457.3'
    text: |-
      Daaronder zijn evenmin begrepen degenen wier toestemming ter zake van de uitvoering van de behandelingsovereenkomst
      op grond van de [artikelen 450][ref1] en [465][ref2] is vereist. Indien de hulpverlener door inlichtingen over de
      patiënt dan wel inzage in of afschrift van de bescheiden te verstrekken niet geacht kan worden de zorg van een goed
      hulpverlener in acht te nemen, laat hij zulks achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '458.1'
    text: |-
      In afwijking van het bepaalde in [artikel 457 lid 1][ref1] kunnen zonder toestemming van de patiënt ten behoeve
      van statistiek of wetenschappelijk onderzoek op het gebied van de volksgezondheid aan een ander desgevraagd
      inlichtingen over de patiënt of inzage in de bescheiden, bedoeld in [artikel 454][ref2], worden verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '457'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: 458.1.a
    text: |-
      het vragen van toestemming in redelijkheid niet mogelijk is en met betrekking tot de uitvoering van het onderzoek
      is voorzien in zodanige waarborgen, dat de persoonlijke levenssfeer van de patiënt niet onevenredig wordt geschaad,
      of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: 458.1.b
    text: |-
      het vragen van toestemming, gelet op de aard en het doel van het onderzoek, in redelijkheid niet kan worden
      verlangd en de hulpverlener zorg heeft gedragen dat de gegevens in zodanige vorm worden verstrekt dat herleiding
      tot individuele natuurlijke personen redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: '458.2'
    text: 'Verstrekking overeenkomstig lid 1 is slechts mogelijk indien:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: 458.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: 458.2.b
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: 458.2.c
    text: voor zover de betrokken patiënt tegen een verstrekking niet uitdrukkelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: '458.3'
    text: Bij een verstrekking overeenkomstig lid 1 wordt daarvan aantekening gehouden in het dossier.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel458
  - number: '459.1'
    text: |-
      De hulpverlener voert verrichtingen in het kader van de behandelingsovereenkomst uit buiten de waarneming van
      anderen dan de patiënt, tenzij de patiënt ermee heeft ingestemd dat de verrichtingen kunnen worden waargenomen
      door anderen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel459
  - number: '459.2'
    text: |-
      Onder anderen dan de patiënt zijn niet begrepen degenen van wie beroepshalve de medewerking bij de uitvoering van
      de verrichting noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel459
  - number: '459.3'
    text: |-
      Daaronder zijn evenmin begrepen degenen wier toestemming ter zake van de verrichting op grond van de
      [artikelen 450][ref1] en [465][ref2] is vereist. Indien de hulpverlener door verrichtingen te doen waarnemen niet
      geacht kan worden de zorg van een goed hulpverlener in acht te nemen, laat hij zulks niet toe.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '460'
    text: De hulpverlener kan, behoudens gewichtige redenen, de behandelingsovereenkomst niet opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel460
  - number: '461'
    text: |-
      De opdrachtgever is de hulpverlener loon verschuldigd, behoudens voor zover deze voor zijn werkzaamheden loon
      ontvangt op grond van het bij of krachtens de wet bepaalde dan wel uit de overeenkomst anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel461
  - number: '462.1'
    text: |-
      Indien ter uitvoering van een behandelingsovereenkomst verrichtingen plaatsvinden in een ziekenhuis dat bij die
      overeenkomst geen partij is, is het ziekenhuis voor een tekortkoming daarbij mede aansprakelijk, als ware het zelf
      bij de overeenkomst partij.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel462
  - number: '462.2'
    text: |-
      Onder ziekenhuis als bedoeld in lid 1 worden verstaan een krachtens artikel 5 van de Wet toelating zorginstellingen
      als ziekenhuis, verpleeginrichting of zwakzinnigeninrichting toegelaten instelling of afdeling daarvan, een
      academisch ziekenhuis alsmede een abortuskliniek in de zin van de [Wet afbreking zwangerschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003396
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0003396
  - number: '463'
    text: |-
      De aansprakelijkheid van een hulpverlener of, in het geval bedoeld in [artikel 462][ref1], van het ziekenhuis, kan
      niet worden beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel462
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel463
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '462'
        afdeling: '5'
  - number: '464.1'
    text: |-
      Indien in de uitoefening van een geneeskundig beroep of bedrijf anders dan krachtens een behandelingsovereenkomst
      handelingen op het gebied van de geneeskunst worden verricht, zijn deze afdeling alsmede de [artikelen 404][ref1],
      [405 lid 2][ref2] en [406 van afdeling 1 van deze titel][ref3] van overeenkomstige toepassing voor zover de aard
      van de rechtsbetrekking zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel405
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '404'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '405'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '464.2'
    text: |-
      Betreft het handelingen als omschreven in [artikel 446 lid 5][ref1], dan:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel446
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '446'
        afdeling: '5'
  - number: 464.2.a
    text: |-
      worden de in [artikel 454][ref1] bedoelde bescheiden slechts bewaard zolang dat noodzakelijk is in verband met het
      doel van het onderzoek, tenzij het bepaalde bij of krachtens de wet zich tegen vernietiging verzet;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel464
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
        afdeling: '5'
  - number: 464.2.b
    text: |-
      wordt de persoon op wie het onderzoek betrekking heeft in de gelegenheid gesteld mee te delen of hij de uitslag
      en de gevolgtrekking van het onderzoek wenst te vernemen. Indien die wens is geuit en de handelingen niet worden
      verricht in verband met een tot stand gekomen arbeidsverhouding of burgerrechtelijke verzekering dan wel een
      opleiding waartoe de betrokkene reeds is toegelaten, wordt bedoelde persoon tevens in de gelegenheid gesteld mee te
      delen of hij van de uitslag en de gevolgtrekking als eerste kennis wenst te nemen teneinde te kunnen beslissen of
      daarvan mededeling aan anderen wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel464
  - number: '465.1'
    text: |-
      De verplichtingen die voor de hulpverlener uit deze afdeling jegens de patiënt voortvloeien worden, indien de
      patiënt de leeftijd van twaalf jaren nog niet heeft bereikt, door de hulpverlener nagekomen jegens de ouders die
      het gezag over de patiënt uitoefenen dan wel jegens zijn voogd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '465.2'
    text: |-
      Hetzelfde geldt indien de patiënt de leeftijd van twaalf jaren heeft bereikt, maar niet in staat kan worden geacht
      tot een redelijke waardering van zijn belangen ter zake, tenzij zodanige patiënt meerderjarig is en onder curatele
      staat of ten behoeve van hem het mentorschap is ingesteld, in welke gevallen nakoming jegens de curator of de
      mentor geschiedt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '465.3'
    text: |-
      Indien een meerderjarige patiënt die niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake, niet onder curatele staat of ten behoeve van hem niet het mentorschap is ingesteld, worden de
      verplichtingen die voor de hulpverlener uit deze afdeling jegens de patiënt voortvloeien, door de hulpverlener
      nagekomen jegens de persoon die daartoe door de patiënt schriftelijk is gemachtigd in zijn plaats op te treden.
      Ontbreekt zodanige persoon, of treedt deze niet op, dan worden de verplichtingen nagekomen jegens de echtgenoot,
      de geregistreerde partner of andere levensgezel van de patiënt, tenzij deze persoon dat niet wenst, dan wel, indien
      ook zodanige persoon ontbreekt, jegens een ouder, kind, broer of zus van de patiënt, tenzij deze persoon dat niet
      wenst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '465.4'
    text: |-
      De hulpverlener komt zijn verplichtingen na jegens de in de leden 1 en 2 bedoelde wettelijke vertegenwoordigers
      van de patiënt en de in lid 3 bedoelde personen, tenzij die nakoming niet verenigbaar is met de zorg van een goed
      hulpverlener.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '465.5'
    text: |-
      De persoon jegens wie de hulpverlener krachtens de leden 2 of 3 gehouden is de uit deze afdeling jegens de patiënt
      voortvloeiende verplichtingen na te komen, betracht de zorg van een goed vertegenwoordiger. Deze persoon is
      gehouden de patiënt zoveel mogelijk bij de vervulling van zijn taak te betrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '465.6'
    text: |-
      Verzet de patiënt zich tegen een verrichting van ingrijpende aard waarvoor een persoon als bedoeld in de leden
      2 of 3 toestemming heeft gegeven, dan kan de verrichting slechts worden uitgevoerd indien zij kennelijk nodig is
      teneinde ernstig nadeel voor de patiënt te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel465
  - number: '466.1'
    text: |-
      Is op grond van [artikel 465][ref1] voor het uitvoeren van een verrichting uitsluitend de toestemming van een daar
      bedoelde persoon in plaats van die van de patiënt vereist, dan kan tot de verrichting zonder die toestemming worden
      overgegaan indien de tijd voor het vragen van die toestemming ontbreekt aangezien onverwijlde uitvoering van de
      verrichting kennelijk nodig is teneinde ernstig nadeel voor de patiënt te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel466
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '466.2'
    text: |-
      Een volgens de [artikelen 450][ref1] en [465][ref2] vereiste toestemming mag worden verondersteld te zijn gegeven,
      indien de desbetreffende verrichting niet van ingrijpende aard is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel450
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel465
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel466
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '450'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '465'
        afdeling: '5'
  - number: '467.1'
    text: |-
      Van het lichaam afgescheiden anonieme stoffen en delen kunnen worden gebruikt voor medisch statistisch of ander
      medisch wetenschappelijk onderzoek voor zover de patiënt van wie het lichaamsmateriaal afkomstig is, geen bezwaar
      heeft gemaakt tegen zodanig onderzoek en het onderzoek met de vereiste zorgvuldigheid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel467
  - number: '467.2'
    text: |-
      Onder onderzoek met van het lichaam afgescheiden anonieme stoffen en delen wordt verstaan onderzoek waarbij is
      gewaarborgd dat het bij het onderzoek te gebruiken lichaamsmateriaal en de daaruit te verkrijgen gegevens niet tot
      de persoon herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel467
  - number: '468'
    text: |-
      Van de bepalingen van deze afdeling en van de [artikelen 404][ref1], [405 lid 2][ref2] en [406][ref3] kan niet ten
      nadele van de patiënt worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel405
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel468
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '404'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '405'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '500.1'
    text: 'In deze titel en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.a
    text: |-
      reisorganisator: degene die, in de uitoefening van zijn bedrijf, op eigen naam aan het publiek of aan een groep
      personen van te voren georganiseerde reizen aanbiedt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.b
    text: |-
      reisovereenkomst: de overeenkomst waarbij een reisorganisator zich jegens zijn wederpartij verbindt tot het
      verschaffen van een door hem aangeboden van te voren georganiseerde reis die een overnachting of een periode van
      meer dan 24 uren omvat alsmede ten minste twee van de volgende diensten:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.b.1°
    text: vervoer,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.b.2°
    text: verblijf,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.b.3°
    text: |-
      een andere niet met vervoer of verblijf verband houdende, toeristische dienst die een significant deel van de reis
      uitmaakt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.c
    text: 'reiziger:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.c.1°
    text: de wederpartij van de reisorganisator,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.c.2°
    text: degene te wiens behoeve de reis is bedongen en die dat beding heeft aanvaard, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: 500.1.c.3°
    text: |-
      degene aan wie overeenkomstig [artikel 506][ref1] de rechtsverhouding tot de reisorganisator is overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel506
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '506'
  - number: '500.2'
    text: |-
      Degene die in de uitoefening van zijn bedrijf als tussenpersoon optreedt van een niet in Nederland gevestigde
      reisorganisator, wordt jegens zijn wederpartij als reisorganisator aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel500
  - number: '501.1'
    text: |-
      Indien de reisorganisator een algemeen verkrijgbare prospectus of andere publikatie uitgeeft, vermeldt hij daarin
      de reissom en de andere bij algemene maatregel van bestuur bepaalde gegevens.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel501
  - number: '501.2'
    text: |-
      Vóór het sluiten van de reisovereenkomst deelt de reisorganisator de wederpartij schriftelijk of op andere
      begrijpelijke en toegankelijke wijze de in het eerste lid bedoelde gegevens mee, voor zover die gegevens aan de
      wederpartij nog niet bekend zijn door verstrekking van de algemeen verkrijgbare prospectus of andere publikatie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel501
  - number: '501.3'
    text: |-
      Het tweede lid is niet van toepassing indien de reisovereenkomst minder dan 72 uren voor de aanvang van de reis
      wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel501
  - number: '502.1'
    text: |-
      De reisorganisator verschaft de wederpartij na het sluiten van de overeenkomst onverwijld een afschrift van de
      voorwaarden, voor zover deze niet reeds in de overgelegde bescheiden besloten liggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel502
  - number: '502.2'
    text: |-
      Vóór de aanvang van de reis deelt de reisorganisator de wederpartij of degene aan wie overeenkomstig
      [artikel 506][ref1] de rechtsverhouding tot de reisorganisator is overgedragen schriftelijk of op andere
      begrijpelijke en toegankelijke wijze de bij algemene maatregel van bestuur bepaalde gegevens mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel506
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel502
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '506'
  - number: '503.1'
    text: De reiziger kan de reisovereenkomst te allen tijde met onmiddellijke ingang opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel503
  - number: '503.2'
    text: |-
      Indien de reiziger opzegt wegens een aan hem toe te rekenen omstandigheid, vergoedt de reiziger de reisorganisator
      de schade die deze tengevolge van de opzegging lijdt. De schadevergoeding bedraagt ten hoogste eenmaal de reissom.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel503
  - number: '503.3'
    text: |-
      Indien de reiziger opzegt wegens een niet aan hem toe te rekenen omstandigheid, heeft hij recht op teruggave of
      kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten, een evenredig deel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel503
  - number: '504.1'
    text: |-
      Onverminderd [artikel 505, vierde lid][ref1], kan de reisorganisator de reisovereenkomst slechts opzeggen wegens
      gewichtige, de reiziger onverwijld meegedeelde omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel505
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel504
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '505'
  - number: '504.2'
    text: |-
      Indien de reisorganisator opzegt wegens een niet aan de reiziger toe te rekenen omstandigheid, biedt hij deze een
      andere reis van gelijke of betere kwaliteit aan. Onverminderd het derde lid heeft de reiziger die dat aanbod niet
      aanvaardt, recht op teruggave of kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten, een
      evenredig deel daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel504
  - number: '504.3'
    text: |-
      In geval van opzegging vergoedt de reisorganisator de reiziger de door deze geleden vermogensschade en een bedrag
      voor het derven van reisgenot, tenzij
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel504
  - number: 504.3.a
    text: |-
      hij de overeenkomst opzegt omdat het aantal aanmeldingen kleiner is dan het vereiste minimumaantal en de reiziger
      binnen de in de overeenkomst aangegeven termijn schriftelijk van de opzegging in kennis is gesteld, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel504
  - number: 504.3.b
    text: |-
      de opzegging het gevolg is van overmacht, waaronder overboeken niet is begrepen. Onder overmacht worden in deze
      titel verstaan abnormale en onvoorzienbare omstandigheden die onafhankelijk zijn van de wil van degene die zich
      erop beroept en waarvan de gevolgen ondanks alle voorzorgsmaatregelen niet konden worden vermeden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel504
  - number: '505.1'
    text: |-
      De reisorganisator kan bedingen dat hij de reisovereenkomst op een wezenlijk punt mag wijzigen wegens gewichtige,
      de reiziger onverwijld medegedeelde omstandigheden. De reiziger kan de wijziging afwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel505
  - number: '505.2'
    text: |-
      Behoudens lid 1 kan de reisorganisator bedingen dat hij de reisovereenkomst mag wijzigen wegens gewichtige, de
      reiziger onverwijld meegedeelde omstandigheden. De reiziger kan de wijziging slechts afwijzen indien zij hem tot
      nadeel van meer dan geringe betekenis strekt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel505
  - number: '505.3'
    text: |-
      De reisorganisator kan bedingen dat hij tot twintig dagen voor de aanvang van de reis de reissom mag verhogen in
      verband met wijzigingen in de vervoerkosten met inbegrip van brandstofkosten, de verschuldigde heffingen of de
      toepasselijke wisselkoersen. Bij toepassing van dit beding geeft de reisorganisator aan op welke wijze de verhoging
      is berekend. De reiziger kan de verhoging afwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel505
  - number: '505.4'
    text: |-
      Na een afwijzing als in de voorgaande leden bedoeld, kan de reisorganisator de reisovereenkomst opzeggen. De
      reiziger heeft recht op teruggave of kwijtschelding van de reissom of, indien de reis reeds ten dele is genoten,
      een evenredig deel daarvan. Indien de reisorganisator opzegt na een afwijzing door de reiziger als bedoeld in de
      leden 1 en 2 is bovendien [artikel 504, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel505
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
  - number: '506.1'
    text: |-
      Tijdig voor de aanvang van de reis kan de reiziger zijn rechtsverhouding tot de reisorganisator overdragen aan een
      derde die aan alle voorwaarden van de reisovereenkomst voldoet. Een termijn van zeven dagen voor de aanvang van de
      reis wordt geacht in ieder geval tijdig te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel506
  - number: '506.2'
    text: |-
      De overdracht vindt plaats door een daarop gerichte overeenkomst met de derde en schriftelijke mededeling daarvan
      door de overdragende reiziger aan de reisorganisator. De overdragende reiziger en de derde zijn hoofdelijk
      verbonden tot betaling van de reissom en de kosten in verband met de overdracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel506
  - number: '507.1'
    text: |-
      De reisorganisator is verplicht tot uitvoering van de reisovereenkomst overeenkomstig de verwachtingen die de
      reiziger op grond van de reisovereenkomst redelijkerwijs mocht hebben.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
  - number: '507.2'
    text: |-
      Indien de reis niet verloopt overeenkomstig de verwachtingen die de reiziger op grond van de reisovereenkomst
      redelijkerwijs mocht hebben, is de reisorganisator verplicht de schade te vergoeden, tenzij de tekortkoming
      in de nakoming niet aan hem is toe te rekenen noch aan de persoon van wiens hulp hij bij de uitvoering van de
      overeenkomst gebruik maakt, omdat:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
  - number: 507.2.a
    text: de tekortkoming in de uitvoering van de reisovereenkomst is toe te rekenen aan de reiziger;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
  - number: 507.2.b
    text: |-
      de tekortkoming in de uitvoering van de reisovereenkomst die niet te voorzien was of kon worden opgeheven, is toe
      te rekenen aan een derde die niet bij de levering van de in de reis begrepen diensten is betrokken; of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
  - number: 507.2.c
    text: |-
      de tekortkoming in de uitvoering van de overeenkomst is te wijten aan overmacht als bedoeld in
      [artikel 504 lid 3 onder ][ref1] dan wel aan een gebeurtenis die de organisator of degene van wiens hulp hij bij
      de uitvoering van de reisovereenkomst gebruik maakt, met inachtneming van alle mogelijke zorgvuldigheid niet kon
      voorzien of verhelpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
  - number: '507.3'
    text: |-
      De reisorganisator is naar gelang van de omstandigheden verplicht de reiziger hulp en bijstand te verlenen, indien
      de reis niet verloopt overeenkomstig de verwachtingen die deze op grond van de reisovereenkomst redelijkerwijs
      mocht hebben. Indien de oorzaak daarvan aan de reiziger moet worden toegerekend, is de reisorganisator tot
      verlening van hulp en bijstand slechts verplicht voor zover dat redelijkerwijs van hem gevergd kan worden. De
      kosten voor de verleende hulp en bijstand komen in dat geval voor rekening van de reiziger. De kosten voor de
      verleende hulp en bijstand komen voor rekening van de reisorganisator, indien de tekortkoming in de nakoming aan
      hem of aan de persoon van wiens hulp hij bij de uitvoering van de overeenkomst gebruik maakt, overeenkomstig het
      tweede lid is toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel507
  - number: '508.1'
    text: |-
      Tenzij het tweede lid van dit artikel van toepassing is, kan de reisorganisator zijn aansprakelijkheid voor schade,
      veroorzaakt door dood of letsel van de reiziger, niet uitsluiten of beperken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel508
  - number: '508.2'
    text: |-
      Indien op een in de reisovereenkomst begrepen dienst een verdrag van toepassing is, kan de reisorganisator zich
      beroepen op een uitsluiting of beperking van aansprakelijkheid die dat verdrag aan een dienstverlener als zodanig
      toekent of toestaat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel508
  - number: '509.1'
    text: |-
      De reisorganisator kan zijn aansprakelijkheid voor schade die uit zijn eigen handelen of nalaten ontstaat niet
      beperken of uitsluiten, indien dat handelen of nalaten geschiedt met het opzet de schade te veroorzaken of het
      handelen of nalaten roekeloos geschiedt en met de wetenschap dat de schade daaruit waarschijnlijk zou voortvloeien.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel509
  - number: '509.2'
    text: |-
      Voor zover de reisorganisator niet zelf de in de reisovereenkomst begrepen diensten verleent, kan hij zijn
      aansprakelijkheid voor andere dan de in [artikel 508][ref1] bedoelde schade beperken tot driemaal de reissom.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel508
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel509
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '508'
  - number: '510'
    text: |-
      Een tekortkoming in de nakoming van een verbintenis die hem kan worden toegerekend, verplicht de reisorganisator
      mede tot vergoeding van ander nadeel dan vermogensschade, voor zover door die tekortkoming derving van reisgenot
      is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel510
  - number: '511'
    text: |-
      De vergoeding voor derving van reisgenot als bedoeld in de [artikelen 504, derde lid][ref1], en [510][ref2]
      bedraagt ten hoogste eenmaal de reissom.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel504
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel510
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel511
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '504'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '510'
  - number: '512.1'
    text: |-
      De reisorganisator neemt de maatregelen die nodig zijn om te verzekeren dat, wanneer hij wegens financieel
      onvermogen zijn verplichtingen jegens de reiziger niet of niet verder kan nakomen, wordt zorggedragen hetzij voor
      overneming van zijn verplichtingen door een ander hetzij voor terugbetaling van de reissom of, indien de reis reeds
      ten dele is genoten, een evenredig deel daarvan. Indien de reiziger reeds op de plaats van bestemming is aangekomen
      dient, voor zover de reisovereenkomst dat vervoer omvat, in ieder geval te worden zorggedragen voor de terugreis.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel512
  - number: '512.2'
    text: |-
      De reisorganisator maakt de in het eerste lid bedoelde maatregelen openbaar door deze te vermelden in de algemeen
      verkrijgbare prospectus of andere publikatie, bedoeld in [artikel 501][ref1], of op andere begrijpelijke en
      toegankelijke wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel501
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel512
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '501'
  - number: '513'
    text: Van het bij of krachtens deze titel bepaalde kan ten nadele van de reiziger niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel513
  - number: '600'
    text: |-
      Bewaarneming is de overeenkomst waarbij de ene partij, de bewaarnemer, zich tegenover de andere partij, de
      bewaargever, verbindt, een zaak die de bewaargever hem toevertrouwt of zal toevertrouwen, te bewaren en terug te
      geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel600
  - number: '601.1'
    text: |-
      Indien de overeenkomst door de bewaarnemer in de uitoefening van zijn beroep of bedrijf is aangegaan, is de
      bewaargever hem loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel601
  - number: '601.2'
    text: |-
      Indien loon verschuldigd is, doch de hoogte niet door partijen is bepaald, is de bewaargever het op de
      gebruikelijke wijze berekende loon of, bij gebreke daarvan, een redelijk loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel601
  - number: '601.3'
    text: |-
      De bewaargever moet aan de bewaarnemer de aan de bewaring verbonden onkosten vergoeden, voor zover deze niet in het
      loon zijn begrepen, alsook de schade die de bewaarnemer als gevolg van de bewaring heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel601
  - number: '602'
    text: De bewaarnemer moet bij de bewaring de zorg van een goed bewaarder in acht nemen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel602
  - number: '603.1'
    text: |-
      De bewaarnemer mag de zaak slechts gebruiken voor zover de bewaargever daarvoor toestemming heeft gegeven, of het
      gebruik nodig is om de zaak in goede staat te houden of te brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel603
  - number: '603.2'
    text: |-
      Zonder toestemming van de bewaargever mag de bewaarnemer de zaak niet aan een derde in bewaring geven, tenzij dit
      in het belang van de bewaargever noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel603
  - number: '603.3'
    text: |-
      Voor gedragingen van een onderbewaarnemer met betrekking tot de zaak is de bewaarnemer op gelijke wijze
      aansprakelijk als voor eigen gedragingen, tenzij de bewaarneming niet tegen bewaarloon geschiedt en de bewaarnemer
      tot het in onderbewaring geven genoodzaakt was ten gevolge van hem niet toe te rekenen omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel603
  - number: '604'
    text: |-
      De vruchten die de zaak in het tijdvak tussen de ontvangst en de teruggave oplevert, moeten door de bewaarnemer aan
      de bewaargever worden afgedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel604
  - number: '605.1'
    text: De bewaargever kan onverwijlde teruggave en de bewaarnemer onverwijlde terugneming van de zaak vorderen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel605
  - number: '605.2'
    text: |-
      Wegens gewichtige redenen kan de kantonrechter van de rechtbank van het arrondissement waarin de zaak zich bevindt,
      op verzoek van een van de partijen een van het vorige lid of van de overeenkomst afwijkend tijdstip voor de
      teruggave of terugneming bepalen. Dit lid is niet van toepassing in geval van gerechtelijke bewaring.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel605
  - number: '605.3'
    text: |-
      De teruggave moet geschieden op de plaats waar de zaak volgens de overeenkomst moet worden bewaard, tenzij bij de
      overeenkomst een andere plaats voor de teruggave is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel605
  - number: '605.4'
    text: De bewaarnemer is gehouden de zaak terug te geven in de staat waarin hij haar heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel605
  - number: '606'
    text: |-
      Indien twee of meer personen te zamen een zaak in bewaring hebben genomen, zijn zij hoofdelijk verbonden tot
      teruggave daarvan en tot vergoeding van de schade die het gevolg is van een tekortschieten in de nakoming van die
      verplichting, tenzij de tekortkoming aan geen van hen kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel606
  - number: '607.1'
    text: |-
      Indien ter zake van een bewaarneming een ceel of een ander stuk aan toonder of order is afgegeven, geldt levering
      daarvan vóór de aflevering van de daarin aangeduide zaken als levering van die zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel607
  - number: '607.2'
    text: Het eerste lid is niet van toepassing op registergoederen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel607
  - number: '608.1'
    text: |-
      Indien een onderbewaarnemer door een bewaargever buiten overeenkomst voor met betrekking tot de zaak geleden
      schade wordt aangesproken, is hij jegens deze niet verder aansprakelijk dan hij zou zijn als wederpartij bij de
      overeenkomst, waarbij de bewaargever de zaak in bewaring gegeven heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel608
  - number: '608.2'
    text: |-
      Indien een bewaarnemer buiten overeenkomst voor met betrekking tot de zaak geleden schade wordt aangesproken door
      een derde die geen bewaargever is, is hij niet verder aansprakelijk dan hij als wederpartij van de bewaargever uit
      de met deze gesloten overeenkomst zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel608
  - number: '608.3'
    text: |-
      Indien een onderbewaarnemer door een zodanige derde wordt aangesproken, is hij niet verder aansprakelijk dan hij
      als bewaarnemer op grond van het vorige lid zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel608
  - number: '608.4'
    text: |-
      De vorige leden kunnen niet worden ingeroepen door een bewaarnemer of onderbewaarnemer die bij het sluiten van
      de overeenkomst uit hoofde waarvan hij de zaak ontving, wist of had behoren te weten dat zijn wederpartij jegens
      degene door wie hij werd aangesproken, niet bevoegd was de zaak aan hem in bewaring te geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel608
  - number: '609.1'
    text: |-
      De hotelhouder is als een bewaarnemer aansprakelijk voor beschadiging of verlies van zaken, die in het hotel zijn
      meegebracht door een gast die daar zijn intrek heeft genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel609
  - number: '609.2'
    text: |-
      Hij is niet aansprakelijk voor gedragingen van personen die de gast zelf in het hotel heeft meegebracht of
      uitgenodigd, en voor schade door zaken die de gast zelf heeft meegebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel609
  - number: '609.3'
    text: |-
      Hij heeft op de in lid 1 bedoelde zaken een retentierecht voor al hetgeen hij van de gast te vorderen heeft ter
      zake van logies, kost, consumpties en als hotelhouder verrichte diensten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel609
  - number: '610.1'
    text: |-
      De arbeidsovereenkomst is de overeenkomst waarbij de ene partij, de werknemer, zich verbindt in dienst van de
      andere partij, de werkgever, tegen loon gedurende zekere tijd arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel610
  - number: '610.2'
    text: |-
      Indien een overeenkomst zowel aan de omschrijving van lid 1 voldoet als aan die van een andere door de wet
      geregelde bijzondere soort van overeenkomst, zijn de bepalingen van deze titel en de voor de andere soort van
      overeenkomst gegeven bepalingen naast elkaar van toepassing. In geval van strijd zijn de bepalingen van deze titel
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel610
  - number: 610a
    text: |-
      Hij die ten behoeve van een ander tegen beloning door die ander gedurende drie opeenvolgende maanden, wekelijks dan
      wel gedurende ten minste twintig uren per maand arbeid verricht, wordt vermoed deze arbeid te verrichten krachtens
      arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel610a
  - number: 610b
    text: |-
      Indien een arbeidsovereenkomst ten minste drie maanden heeft geduurd, wordt de bedongen arbeid in enige maand
      vermoed een omvang te hebben gelijk aan de gemiddelde omvang van de arbeid per maand in de drie voorafgaande
      maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel610b
  - number: '611'
    text: De werkgever en de werknemer zijn verplicht zich als een goed werkgever en een goed werknemer te gedragen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel611
  - number: '612.1'
    text: |-
      Een minderjarige die de leeftijd van zestien jaren heeft bereikt, is bekwaam tot het aangaan van een
      arbeidsovereenkomst. Hij staat in alles wat betrekking heeft op die arbeidsovereenkomst met een meerderjarige
      gelijk, en kan zonder bijstand van zijn wettelijke vertegenwoordiger in rechte verschijnen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel612
  - number: '612.2'
    text: |-
      Indien een daartoe onbekwame minderjarige een arbeidsovereenkomst heeft aangegaan en vervolgens vier weken in
      dienst van de werkgever arbeid heeft verricht zonder dat zijn wettelijke vertegenwoordiger een beroep op de in de
      onbekwaamheid gelegen vernietigingsgrond heeft gedaan, wordt hij geacht de toestemming van die vertegenwoordiger
      tot het aangaan van deze arbeidsovereenkomst te hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel612
  - number: '612.3'
    text: |-
      Een onbekwame minderjarige die met toestemming van de wettelijke vertegenwoordiger een arbeidsovereenkomst heeft
      aangegaan, staat in alles wat betrekking heeft op die arbeidsovereenkomst met een meerderjarige gelijk, behoudens
      het bepaalde in lid 4.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel612
  - number: '612.4'
    text: |-
      Een onbekwame minderjarige kan niet zonder bijstand van zijn wettelijke vertegenwoordiger in rechte verschijnen,
      behalve wanneer de rechter is gebleken dat de wettelijke vertegenwoordiger niet bij machte is zich te verklaren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel612
  - number: '613'
    text: |-
      De werkgever kan slechts een beroep doen op een schriftelijk beding dat hem de bevoegdheid geeft een in de
      arbeidsovereenkomst voorkomende arbeidsvoorwaarde te wijzigen, indien hij bij de wijziging een zodanig zwaarwichtig
      belang heeft dat het belang van de werknemer dat door de wijziging zou worden geschaad, daarvoor naar maatstaven
      van redelijkheid en billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel613
  - number: '614'
    text: |-
      De termijn, bedoeld in [artikel 52 lid 1 onder d van Boek 3][ref1], begint met betrekking tot uit deze titel
      voortvloeiende vernietigingsgronden met de aanvang van de dag volgende op die waarop een beroep op het beding is
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel614
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '615'
    text: |-
      De bepalingen van deze titel zijn niet van toepassing ten aanzien van personen in dienst van staat, provincie,
      gemeente, waterschap of enig ander publiekrechtelijk lichaam, tenzij zij, hetzij vóór of bij de aanvang van de
      dienstbetrekking door of namens partijen, hetzij bij wet of verordening, van toepassing zijn verklaard.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel615
  - number: '616'
    text: De werkgever is verplicht de werknemer zijn loon op de bepaalde tijd te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel616
  - number: '617.1'
    text: 'De vastgestelde vorm van loon mag niet anders zijn dan:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: 617.1.a
    text: geld;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: 617.1.b
    text: |-
      indien die vorm van loon gewoonte is of wenselijk is wegens de aard van de onderneming van de werkgever: zaken,
      geschikt voor het persoonlijk gebruik van de werknemer en zijn huisgenoten, met uitzondering van alcoholhoudende
      drank en andere voor de gezondheid schadelijke genotmiddelen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: 617.1.c
    text: het gebruik van een woning, alsmede verlichting en verwarming daarvan;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: 617.1.d
    text: |-
      diensten, voorzieningen en werkzaamheden door of voor rekening van de werkgever te verrichten, onderricht, kost en
      inwoning daaronder begrepen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: 617.1.e
    text: effecten, vorderingen, andere aanspraken en bewijsstukken daarvan en bonnen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: '617.2'
    text: |-
      Aan de in lid 1 onder b, c en d bedoelde zaken, diensten en voorzieningen mag geen hogere waarde worden toegekend
      dan die welke met de werkelijke waarde daarvan overeenkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel617
  - number: '618'
    text: |-
      Indien geen loon is vastgesteld, heeft de werknemer aanspraak op het loon dat ten tijde van het sluiten van de
      overeenkomst voor arbeid als de overeengekomene gebruikelijk was of, bij gebreke van een dergelijke maatstaf, op
      een loon dat met inachtneming van de omstandigheden van het geval naar billijkheid wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel618
  - number: '619.1'
    text: |-
      Indien het loon voor het geheel of voor een gedeelte bestaat in een bedrag dat afhankelijk is gesteld van enig
      gegeven dat uit de boeken, bescheiden of andere gegevensdragers van de werkgever moet kunnen blijken, heeft de
      werknemer het recht van de werkgever overlegging te verlangen van zodanige bewijsstukken, als hij nodig heeft om
      dat gegeven vast te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel619
  - number: '619.2'
    text: |-
      Partijen kunnen bij schriftelijke overeenkomst overeenkomen aan wie, in afwijking van lid 1, overlegging van
      genoemde bewijsstukken zal geschieden. Als zodanig kunnen niet worden aangewezen werknemers die in dienst van de
      werkgever met de boekhouding zijn belast.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel619
  - number: '619.3'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van lid 1 of lid 2,
      tweede zin, een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel619
  - number: '619.4'
    text: |-
      De overlegging van de bewijsstukken door of vanwege de werkgever geschiedt desverlangd onder de uitdrukkelijke
      verplichting tot geheimhouding door de werknemer en degene die hem overeenkomstig lid 2 vervangt; deze kan echter
      nimmer tot geheimhouding tegenover de werknemer worden verplicht, behoudens voor zover het betreft de winst in de
      onderneming van de werkgever of in een deel daarvan gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel619
  - number: '620.1'
    text: |-
      De voldoening van het in geld vastgestelde loon geschiedt in Nederlands wettig betaalmiddel of door girale betaling
      overeenkomstig [artikel 114 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel114
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel620
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '114'
  - number: '620.2'
    text: |-
      De voldoening van het in geld vastgestelde loon kan in buitenlands geld geschieden, indien dit overeengekomen
      is. De werknemer is echter bevoegd voldoening in Nederlands geld te verlangen met ingang van de tweede komende
      betaaldag. Indien omrekening nodig is, geschiedt deze naar de koers, bedoeld in de [artikelen 124][ref1] en
      [126 van Boek 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel126
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel620
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '126'
  - number: '620.3'
    text: |-
      De voldoening van het in andere bestanddelen dan in geld vastgestelde loon geschiedt volgens hetgeen daarover is
      overeengekomen of, als daarover niets is overeengekomen, volgens het gebruik.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel620
  - number: '621.1'
    text: |-
      Voldoening van het loon, anders dan bij [artikel 620][ref1] is bepaald of, in andere vormen is vastgesteld dan door
      [artikel 617][ref2] is toegestaan, is niet bevrijdend. De werknemer behoudt het recht om het verschuldigde loon
      of, zo dit in een andere vorm dan geld is vastgesteld, de waarde van de verschuldigde prestatie van de werkgever te
      vorderen zonder gehouden te zijn het bij de niet-bevrijdende voldoening ontvangene terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel620
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel617
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel621
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '620'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '617'
        afdeling: '2'
  - number: '621.2'
    text: |-
      Niettemin kan de rechter bij toewijzing van de vordering van de werknemer de veroordeling beperken tot zodanig
      bedrag als hem met het oog op de omstandigheden billijk zal voorkomen, maar uiterlijk tot de som waarop de door de
      werknemer geleden schade zal worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel621
  - number: '621.3'
    text: |-
      Een rechtsvordering van de werknemer op grond van dit artikel verjaart door verloop van zes maanden na de dag
      waarop de niet-bevrijdende voldoening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel621
  - number: '622'
    text: |-
      De voldoening van in geld vastgesteld loon die niet met toepassing van [artikel 114 van Boek 6][ref1] plaatsvindt,
      geschiedt hetzij ter plaatse waar de arbeid in de regel wordt verricht, hetzij ten kantore van de werkgever indien
      dit gelegen is in dezelfde gemeente als die waarin de meerderheid van de werknemers woont, hetzij aan de woning van
      de werknemer, ter keuze van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel114
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel622
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '114'
  - number: '623.1'
    text: |-
      De werkgever is verplicht het in geld naar tijdruimte vastgestelde loon te voldoen telkens na afloop van het
      tijdvak waarover het loon op grond van de overeenkomst moet worden berekend, met dien verstande dat het tijdvak
      voor voldoening niet korter is dan één week en niet langer is dan één maand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel623
  - number: '623.2'
    text: |-
      Het tijdvak na afloop waarvan het loon moet worden voldaan, kan bij schriftelijke overeenkomst worden verlengd,
      maar niet langer dan tot een maand wanneer het tijdvak waarover het loon op grond van de overeenkomst moet worden
      berekend, een week of korter is, en tot niet langer dan tot een kwartaal wanneer het tijdvak waarover het loon op
      grond van de overeenkomst moet worden berekend, een maand of langer is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel623
  - number: '623.3'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van dit artikel,
      een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel623
  - number: '624.1'
    text: |-
      Indien het in geld vastgestelde loon afhankelijk is van de uitkomsten van de te verrichten arbeid, houdt de
      werkgever de betalingstermijnen aan die gelden voor het naar tijdruimte vastgestelde loon voor vergelijkbare
      arbeid, tenzij met inachtneming van [artikel 623][ref1] andere termijnen zijn overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel623
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel624
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '623'
        afdeling: '2'
  - number: '624.2'
    text: |-
      Indien op de betaaldag het bedrag van het loon als genoemd in lid 1 nog niet te bepalen is, is de werkgever
      verplicht tot voldoening van een voorschot ten bedrage van het loon waarop de werknemer gemiddeld per
      betalingstermijn aanspraak kon maken over de drie maanden voorafgaande aan de betaaldag of, indien dat niet
      mogelijk is, ten bedrage van het voor vergelijkbare arbeid gebruikelijke loon.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel624
  - number: '624.3'
    text: |-
      Schriftelijk kan worden overeengekomen dat het voorschot op een lager bedrag wordt gesteld, maar niet op minder dan
      drie vierde van het gemiddelde loon over drie maanden voorafgaande aan de betaaldag onderscheidenlijk van het voor
      vergelijkbare arbeid gebruikelijke loon.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel624
  - number: '624.4'
    text: |-
      Voor zover het in geld vastgestelde loon bestaat in een bedrag dat afhankelijk is gesteld van enig gegeven dat
      uit de boeken, bescheiden of andere gegevensdragers van de werkgever moet kunnen blijken, is de werkgever tot
      voldoening verplicht telkens wanneer het bedrag van dat loon kan worden bepaald, met dien verstande dat ten minste
      eenmaal per jaar voldoening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel624
  - number: '624.5'
    text: |-
      Slechts aan de werknemer komt de bevoegdheid toe om ter vernietiging van een beding dat afwijkt van dit artikel,
      een beroep op de vernietigingsgrond te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel624
  - number: '625.1'
    text: |-
      Voor zover het in geld vastgesteld loon of het gedeelte dat overblijft na aftrek van hetgeen door de werkgever
      overeenkomstig [artikel 628][ref1] mag worden verrekend, en na aftrek van hetgeen waarop derden overeenkomstig
      [artikel 633][ref2] rechten doen gelden, niet wordt voldaan uiterlijk de derde werkdag na die waarop ingevolge
      de [artikelen 623][ref3] en [624 lid 1][ref4] de voldoening had moeten geschieden, heeft de werknemer, indien
      dit niet-voldoen aan de werkgever is toe te rekenen, aanspraak op een verhoging wegens vertraging. Deze verhoging
      bedraagt voor de vierde tot en met de achtste werkdag vijf procent per dag en voor elke volgende werkdag een
      procent, met dien verstande dat de verhoging in geen geval de helft van het verschuldigde te boven zal gaan.
      Niettemin kan de rechter de verhoging beperken tot zodanig bedrag als hem met het oog op de omstandigheden billijk
      zal voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel633
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel623
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel624
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel625
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '633'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '623'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '624'
        afdeling: '2'
  - number: '625.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel625
  - number: '626.1'
    text: |-
      De werkgever is verplicht bij elke voldoening van het in geld vastgestelde loon de werknemer een schriftelijke
      opgave te verstrekken van het loonbedrag, van de bedragen waaruit dit is samengesteld, van de bedragen die
      op het loonbedrag zijn ingehouden, alsmede van het bedrag van het loon waarop een persoon van de leeftijd
      van de werknemer over de termijn waarover het loon is berekend ingevolge het bepaalde bij of krachtens de
      [Wet minimumloon en minimumvakantiebijslag][ref1] aanspraak heeft, tenzij zich ten opzichte van de vorige
      voldoening in geen van deze bedragen een wijziging heeft voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel626
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: '626.2'
    text: |-
      De opgave vermeldt voorts de naam van de werkgever en van de werknemer, de termijn waarover het loon is berekend,
      alsmede de overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel626
  - number: '626.3'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel626
  - number: '627'
    text: Geen loon is verschuldigd voor de tijd gedurende welke de werknemer de bedongen arbeid niet heeft verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel627
  - number: '628.1'
    text: |-
      De werknemer behoudt het recht op het naar tijdruimte vastgestelde loon indien hij de overeengekomen arbeid niet
      heeft verricht door een oorzaak die in redelijkheid voor rekening van de werkgever behoort te komen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: '628.2'
    text: |-
      Indien hem krachtens enige wettelijk voorgeschreven verzekering of krachtens enige verzekering of uit enig fonds
      waarin de deelneming is overeengekomen bij of voortvloeit uit de arbeidsovereenkomst, een geldelijke uitkering
      toekomt, wordt het loon verminderd met het bedrag van die uitkering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: '628.3'
    text: |-
      Indien het loon in geld op andere wijze dan naar tijdruimte is vastgesteld, zijn de bepalingen van dit artikel van
      toepassing, met dien verstande dat als loon wordt beschouwd het gemiddelde loon dat de werknemer, wanneer hij niet
      verhinderd was geweest, gedurende die tijd had kunnen verdienen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: '628.4'
    text: |-
      Het loon wordt echter verminderd met het bedrag van de onkosten die de werknemer zich door het niet-verrichten van
      de arbeid heeft bespaard.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: '628.5'
    text: |-
      Van de leden 1 tot en met 4 kan voor de eerste zes maanden van de arbeidsovereenkomst slechts bij schriftelijke
      overeenkomst worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: '628.6'
    text: |-
      In geval van elkaar opvolgende arbeidsovereenkomsten in de zin van [artikel 668a][ref1] kan een afwijking als
      bedoeld in lid 5 in totaal voor ten hoogste zes maanden worden overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
        afdeling: '9'
  - number: '628.7'
    text: |-
      Na het verstrijken van de termijn, bedoeld in lid 5, kan van dit artikel slechts bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele
      van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628
  - number: 628a.1
    text: |-
      Indien een arbeidsomvang van minder dan 15 uur per week is overeengekomen en de tijdstippen waarop de arbeid moet
      worden verricht niet zijn vastgelegd, dan wel indien de omvang van de arbeid niet of niet eenduidig is vastgelegd,
      heeft de werknemer voor iedere periode van minder dan drie uur waarin hij arbeid heeft verricht, recht op het loon
      waarop hij aanspraak zou hebben indien hij drie uur arbeid zou hebben verricht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628a
  - number: 628a.2
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel628a
  - number: '629.1'
    text: |-
      Voor zover het loon niet meer bedraagt dan het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met betrekking tot een loontijdvak
      van een dag, behoudt de werknemer voor een tijdvak van 104 weken recht op 70% van het naar tijdruimte vastgestelde
      loon, maar de eerste 52 weken ten minste op het voor hem geldende wettelijke minimumloon, indien hij de bedongen
      arbeid niet heeft verricht omdat hij in verband met ongeschiktheid ten gevolge van ziekte, zwangerschap of
      bevalling daartoe verhinderd was.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '629.2'
    text: |-
      Voor de werknemer die ten behoeve van zijn werkgever uitsluitend of nagenoeg uitsluitend huiselijke of persoonlijke
      diensten op minder dan drie dagen per week verricht, geldt het in lid 1 bedoelde recht voor een tijdvak van zes
      weken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: '629.3'
    text: 'De werknemer heeft het in lid 1 bedoelde recht niet:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: 629.3.a
    text: |-
      indien de ziekte door zijn opzet is veroorzaakt of het gevolg is van een gebrek waarover hij in het kader van een
      aanstellingskeuring valse informatie heeft verstrekt en daardoor de toetsing aan de voor de functie opgestelde
      belastbaarheidseisen niet juist kon worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: 629.3.b
    text: voor de tijd, gedurende welke door zijn toedoen zijn genezing wordt belemmerd of vertraagd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: 629.3.c
    text: |-
      voor de tijd, gedurende welke hij, hoewel hij daartoe in staat is, zonder deugdelijke grond
      passende arbeid als bedoeld in [artikel 658a lid 4][ref1] voor de werkgever of voor een door
      de werkgever met toestemming van het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] aangewezen derde, waartoe de
      werkgever hem in de gelegenheid stelt, niet verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 629.3.d
    text: |-
      voor de tijd, gedurende welke hij zonder deugdelijke grond weigert mee te werken aan door de werkgever of door een
      door hem aangewezen deskundige gegeven redelijke voorschriften of getroffen maatregelen die erop gericht zijn om de
      werknemer in staat te stellen passende arbeid als bedoeld in [artikel 658a lid 4][ref1] te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 629.3.e
    text: |-
      voor de tijd, gedurende welke hij zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en
      bijstellen van een plan van aanpak als bedoeld in [artikel 658a lid 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 629.3.f
    text: |-
      voor de tijd gedurende welke hij zonder deugdelijk grond zijn aanvraag om een uitkering als bedoeld in
      [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] later indient dan in
      [dat artikel][ref2] is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
  - number: '629.4'
    text: |-
      In afwijking van lid 1 heeft de vrouwelijke werknemer het in dat lid bedoelde recht niet
      gedurende de periode dat zij zwangerschaps- of bevallingsverlof geniet overeenkomstig
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '629.5'
    text: |-
      Het loon wordt verminderd met het bedrag van enige geldelijke uitkering die de werknemer toekomt krachtens enige
      wettelijke voorgeschreven verzekering of krachtens enige verzekering of uit enig fonds waarin de werknemer niet
      deelneemt, voorzover deze uitkering betrekking heeft op de bedongen arbeid waaruit het loon wordt genoten. Het loon
      wordt voorts verminderd met het bedrag van de inkomsten, door de werknemer in of buiten dienstbetrekking genoten
      voor werkzaamheden die hij heeft verricht gedurende de tijd dat hij, zo hij daartoe niet verhinderd was geweest, de
      bedongen arbeid had kunnen verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: '629.6'
    text: |-
      De werkgever is bevoegd de betaling van het in het lid 1 bedoelde loon op te schorten voor de tijd, gedurende
      welke de werknemer zich niet houdt aan door de werkgever schriftelijk gegeven redelijke voorschriften omtrent het
      verstrekken van de inlichtingen die de werkgever behoeft om het recht op loon vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: '629.7'
    text: |-
      De werkgever kan geen beroep meer doen op enige grond het loon geheel of gedeeltelijk niet te betalen of de
      betaling daarvan op te schorten, indien hij de werknemer daarvan geen kennis heeft gegeven onverwijld nadat bij hem
      het vermoeden van het bestaan daarvan is gerezen of redelijkerwijs had behoren te rijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: '629.8'
    text: |-
      [Artikel 628 lid 3][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel628
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '628'
        afdeling: '2'
  - number: '629.9'
    text: |-
      Van dit artikel kan ten nadele van de werknemer slechts in zoverre worden afgeweken dat bedongen kan worden dat de
      werknemer voor de eerste twee dagen van het in lid 1 of lid 2 bedoelde tijdvak geen recht op loon heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: '629.10'
    text: |-
      Voor de toepassing van de leden 1, 2 en 9 worden perioden, waarin de werknemer in verband met ongeschiktheid
      ten gevolge van ziekte, zwangerschap of bevalling verhinderd is geweest zijn arbeid te verrichten, samengeteld
      indien zij elkaar met een onderbreking van minder dan vier weken opvolgen, of indien zij direct voorafgaan
      aan en aansluiten op een periode waarin zwangerschaps- of bevallingsverlof wordt genoten als bedoeld in
      [artikel 3:1, tweede en derde lid, van de Wet arbeid en zorg][ref1], tenzij de ongeschiktheid redelijkerwijs niet
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '629.11'
    text: 'Het tijdvak van 104 weken, bedoeld in lid 1, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
  - number: 629.11.a
    text: |-
      met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan in dat artikel is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 629.11.b
    text: |-
      met de duur van de vertraging indien de aanvraag, bedoeld in
      [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] later wordt gedaan dan in of op
      grond van [dat artikel][ref2] is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
  - number: 629.11.c
    text: |-
      met de duur van het verlengde tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 24, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] heeft vastgesteld of met de duur
      van het tijdvak, bedoeld in [artikel 25, negende lid, eerste zin, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 629.11.d
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], indien die wachttijd op grond
      van het zevende lid van dat artikel wordt verlengd; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 629.11.e
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '629.12'
    text: |-
      Indien de werknemer passende arbeid als bedoeld in [artikel 658a lid 4][ref1] verricht, blijft de
      arbeidsovereenkomst onverkort in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 629a.1
    text: |-
      De rechter wijst een vordering tot betaling van loon als bedoeld in [artikel 629][ref1] af, indien bij de eis
      niet een verklaring is gevoegd van een deskundige, benoemd door het Uitvoeringsinstituut werknemersverzekeringen,
      genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], omtrent de verhindering
      van de werknemer om de bedongen of andere passende arbeid te verrichten respectievelijk diens nakoming van de
      verplichtingen, bedoeld in [artikel 660a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel660a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 660a
        afdeling: '7'
  - number: 629a.2
    text: |-
      Lid 1 geldt niet indien de verhindering respectievelijk de nakoming niet wordt betwist of het overleggen van de
      verklaring in redelijkheid niet van de werknemer kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
  - number: 629a.3
    text: |-
      De deskundige, die zijn benoeming heeft aanvaard, is verplicht zijn onderzoek onpartijdig en naar beste weten te
      volbrengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
  - number: 629a.4
    text: |-
      De deskundige die de hoedanigheid van arts bezit, kan de voor zijn onderzoek van belang zijnde inlichtingen over de
      werknemer inwinnen bij de behandelend arts of de behandelend artsen. Zij verstrekken de gevraagde inlichtingen voor
      zover daardoor de persoonlijke levenssfeer van de werknemer niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
  - number: 629a.5
    text: |-
      De rechter kan op verzoek van een der partijen of ambtshalve bevelen dat de deskundige zijn verklaring nader
      schriftelijk of mondeling toelicht of aanvult.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
  - number: 629a.6
    text: |-
      De werknemer wordt ter zake van een vordering als bedoeld in het eerste lid slechts in de kosten van de werkgever
      als bedoeld in [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] veroordeeld in geval van
      kennelijk onredelijk gebruik van procesrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
  - number: 629a.7
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan kan
      worden bepaald dat de in het eerste lid bedoelde deskundige door een ander dan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel629a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '630.1'
    text: |-
      De werkgever die tijdelijk is verhinderd het loon, voor zover dit in een andere vorm dan in geld is vastgesteld,
      te voldoen zonder dat deze verhindering het gevolg is van een eigen toedoen van de werknemer, is aan deze een
      vergoeding schuldig, waarvan het bedrag bij overeenkomst wordt vastgesteld of, bij gebreke van een overeenkomst,
      door de rechter wordt bepaald volgens het gebruik of de billijkheid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel630
  - number: '630.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel630
  - number: '631.1'
    text: |-
      Een beding waarbij de werkgever het recht krijgt enig bedrag van het loon op de betaaldag in te houden, is nietig,
      onverminderd de bevoegdheid van de werknemer om de werkgever een schriftelijke volmacht te verlenen om uit het uit
      te betalen loon betalingen in zijn naam te verrichten. Deze volmacht is te allen tijde herroepelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.2'
    text: |-
      Bedingen waarbij de werknemer zich jegens de werkgever verbindt het ontvangen loon of zijn overige inkomsten of een
      gedeelte daarvan op bepaalde wijze te besteden, en bedingen waarbij de werknemer zich verbindt zijn benodigdheden
      op een bepaalde plaats of bij een bepaalde persoon aan te schaffen, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.3'
    text: 'De leden 1 en 2 zijn niet van toepassing op het beding waarbij de werknemer zich verbindt:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: 631.3.a
    text: |-
      deel te nemen in een fonds waarop de [Pensioen- en spaarfondsenwet][ref1] van toepassing is en ten aanzien waarvan
      aan de voorschriften van die wet wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 631.3.b
    text: |-
      bij te dragen tot de premiebetaling voor een verzekering overeenkomstig de voorschriften dienaangaande door de
      [Pensioen- en spaarfondsenwet][ref1] gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 631.3.c
    text: |-
      deel te nemen in enig ander fonds dan in onderdeel a bedoeld, mits dat fonds voldoet aan de voorwaarden, bij
      algemene maatregel van bestuur gesteld;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: 631.3.d
    text: |-
      deel te nemen aan een regeling tot sparen te zijnen behoeve, anders dan in de onderdelen *a* tot en met *c*
      bedoeld, mits die regeling voldoet aan de voorwaarden, bij algemene maatregel van bestuur gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.4'
    text: |-
      Voor de nakoming van een beding als bedoeld in lid 3 mag de werkgever de daartoe nodige bedragen op het loon van
      de werknemer inhouden; hij is alsdan verplicht deze bedragen overeenkomstig het beding ten behoeve van de werknemer
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.5'
    text: |-
      Op de deelneming door een minderjarige aan een regeling als bedoeld in lid 3 is [artikel 612][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel612
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '612'
        afdeling: '1'
  - number: '631.6'
    text: |-
      Indien de werknemer ingevolge een nietig beding als bedoeld in lid 2 een overeenkomst met de werkgever of een
      derde heeft aangegaan, heeft hij het recht hetgeen hij uit dien hoofde heeft voldaan van de werkgever te vorderen.
      Indien hij de overeenkomst met de werkgever heeft aangegaan, heeft hij bovendien de bevoegdheid de overeenkomst
      te vernietigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.7'
    text: |-
      De rechter kan bij toewijzing van een vordering van de werknemer op grond van lid 6 de verplichting tot betaling
      van de werkgever beperken tot zodanig bedrag als hem met het oog op de omstandigheden billijk voorkomt, maar
      uiterlijk tot de som waarop hij de door de werknemer geleden schade vaststelt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '631.8'
    text: |-
      Een rechtsvordering van de werknemer op grond van dit artikel verjaart door verloop van zes maanden na de dag van
      het ontstaan van het vorderingsrecht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel631
  - number: '632.1'
    text: |-
      Behalve bij het einde van de arbeidsovereenkomst is verrekening door de werkgever van zijn schuld ter zake van het
      uit te betalen loon slechts toegelaten met de volgende vorderingen op de werknemer:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: 632.1.a
    text: de door de werknemer aan de werkgever verschuldigde schadevergoeding;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: 632.1.b
    text: |-
      de boetes, door de werknemer volgens [artikel 650][ref1] aan de werkgever verschuldigd, mits door deze een
      schriftelijk bewijs wordt afgegeven, die het bedrag vermeldt van iedere boete alsmede de tijd waarop en de reden
      waarom zij is opgelegd, met opgave van de overtreden bepaling van een schriftelijk aangegane overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel650
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '650'
        afdeling: '5'
  - number: 632.1.c
    text: |-
      de voorschotten op het loon, door de werkgever in geld aan de werknemer verstrekt, mits daarvan schriftelijk
      blijkt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: 632.1.d
    text: het bedrag van hetgeen op het loon te veel is betaald;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: 632.1.e
    text: |-
      de huurprijs van een woning of een andere ruimte, een stuk grond of van werktuigen, machines en gereedschappen,
      door de werknemer in eigen bedrijf gebruikt, en die bij schriftelijke overeenkomst door de werkgever aan de
      werknemer zijn verhuurd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: '632.2'
    text: |-
      Verrekening heeft geen plaats op het deel van het loon waarop beslag onder de werkgever niet geldig kan zijn. Ter
      zake van hetgeen de werkgever krachtens lid 1, onderdeel b, zou kunnen vorderen, mag door hem bij elke voldoening
      van het loon niet meer worden verrekend dan een tiende gedeelte van het in geld vastgestelde loon dat alsdan zou
      moeten worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: '632.3'
    text: |-
      Hetgeen de werkgever uit hoofde van een op het loon gelegd beslag inhoudt, komt in mindering op het voor
      verrekening toegelaten maximum.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: '632.4'
    text: |-
      Een beding waardoor de werkgever een ruimere bevoegdheid tot verrekening zou krijgen, is vernietigbaar, met dien
      verstande dat de werknemer bevoegd is tot vernietiging ter zake van elke afzonderlijke verrekeningsverklaring van
      de werkgever die van de geldigheid van het beding uitgaat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel632
  - number: '633.1'
    text: |-
      Overdracht, verpanding of elke andere handeling waardoor de werknemer enig recht op zijn loon aan derden toekent,
      is slechts in zover geldig als een beslag op zijn loon geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel633
  - number: '633.2'
    text: Een volmacht tot de vordering van loon wordt schriftelijk verleend. Deze volmacht is te allen tijde herroepelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel633
  - number: '633.3'
    text: Van dit artikel kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel633
  - number: '634.1'
    text: |-
      De werknemer verwerft over ieder jaar waarin hij gedurende de volledige overeengekomen arbeidsduur recht op loon
      heeft gehad, aanspraak op vakantie van ten minste vier maal de overeengekomen arbeidsduur per week of, als de
      overeengekomen arbeidsduur in uren per jaar is uitgedrukt, van ten minste een overeenkomstige tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel634
  - number: '634.2'
    text: |-
      De werknemer die over een deel van een jaar recht op loon heeft gehad, verwerft over dat deel aanspraak op vakantie
      die een evenredig gedeelte bedraagt van datgene waarop hij recht zou hebben gehad als hij gedurende het gehele jaar
      recht had op loon over de volledige overeengekomen arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel634
  - number: '634.3'
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan kan ten
      aanzien van werknemers wier arbeidsovereenkomst eindigt nadat deze ten minste een maand heeft geduurd, van lid 2
      worden afgeweken in dier voege dat de aanspraak op vakantie wordt berekend over tijdvakken van een maand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel634
  - number: '635.1'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer aanspraak op vakantie over het tijdvak, gedurende
      hetwelk hij geen recht heeft op in geld vastgesteld loon, omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: 635.1.a
    text: |-
      hij, anders dan voor oefening en opleiding, als dienstplichtige is opgeroepen ter vervulling van zijn militaire
      dienst of vervangende dienst;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
  - number: 635.1.b
    text: |-
      hij vakantie als bedoeld in [artikel 641 lid 3][ref1] geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel641
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '641'
        afdeling: '3'
  - number: 635.1.c
    text: |-
      hij, met toestemming van de werkgever, deelneemt aan een bijeenkomst die wordt georganiseerd door een vakvereniging
      waarvan hij lid is;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
  - number: 635.1.d
    text: |-
      hij, anders dan ten gevolge van de arbeidsongeschiktheid, bedoeld in de leden 2 tot en met 4, tegen zijn wil niet
      in staat is om de overeengekomen arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
  - number: 635.1.e
    text: |-
      hij verlof als bedoeld in [artikel 643][ref1] geniet;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel643
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '643'
        afdeling: '3'
  - number: 635.1.f
    text: |-
      hij verlof als bedoeld in [hoofdstuk 5, afdeling 2, van de Wet arbeid en zorg][ref1] geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '5'
  - number: '635.2'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de vrouwelijke werknemer die wegens zwangerschap of
      bevalling niet gedurende een geheel jaar aanspraak op loon verwerft, over de volledige overeengekomen
      arbeidsduur aanspraak op vakantie over het tijdvak dat zij recht heeft op een uitkering als bedoeld in
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '635.3'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer die wegens adoptieverlof of verlof voor het opnemen
      van een pleegkind niet gedurende een geheel jaar aanspraak op loon verwerft, over de volledige overeengekomen
      arbeidsduur aanspraak op vakantie over het tijdvak dat hij recht heeft op een uitkering als bedoeld in
      [hoofdstuk 3, afdeling 2, van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Afdeling2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0013008
        afdeling: '2'
  - number: '635.4'
    text: |-
      In afwijking van [artikel 634][ref1] verwerft de werknemer die de bedongen arbeid niet verricht wegens ziekte,
      ongeacht of hij aanspraak heeft op loon, aanspraak op vakantie over het tijdvak van de laatste zes maanden
      waarin de arbeid niet werd verricht, met dien verstande dat tijdvakken worden samengeteld als zij elkaar met een
      onderbreking van minder dan een maand opvolgen. De werknemer die de bedongen arbeid slechts voor een gedeelte van
      de overeengekomen arbeidsduur niet verricht wegens ziekte, verwerft slechts aanspraak op vakantie die een evenredig
      gedeelte bedraagt van datgene waarop hij recht zou hebben gehad als hij gedurende de volledige arbeidsduur arbeid
      zou hebben verricht. Indien de ziekte door opzet van de werknemer is ontstaan of het gevolg is van een gebrek
      waarover hij in het kader van een aanstellingskeuring opzettelijk valse inlichtingen heeft gegeven, verwerft de
      werknemer evenmin aanspraak op vakantie. De werknemer heeft evenmin aanspraak op vakantie voor de tijd gedurende
      welke hij door zijn toedoen zijn genezing belemmert of vertraagt , hij, hoewel hij daartoe in staat is, zonder
      deugdelijke grond passende arbeid als bedoeld in [artikel 658a lid 4][ref2] voor de werkgever of voor een door
      de werkgever met toestemming van het Uitvoeringsinstituut werknemersverzekeringen aangewezen derde, waartoe de
      werkgever hem in de gelegenheid stelt, niet verricht dan wel hij zonder deugdelijke grond weigert mee te werken
      aan door de werkgever of door een door hem aangewezen deskundige gegeven redelijke voorschriften en getroffen
      maatregelen die erop gericht zijn om de werknemer in staat te stellen passende arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: '635.5'
    text: |-
      De jeugdige werknemer verwerft aanspraak op vakantie over de tijd die hij besteedt aan het volgen van het
      onderricht waartoe hij krachtens de wet door de werkgever in de gelegenheid moet worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
  - number: '635.6'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van de leden 1 tot en met 4
      worden afgeweken ten nadele van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel635
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '636.1'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer de overeengekomen arbeid niet verricht wegens een van de redenen,
      bedoeld in [artikel 635 leden 1, 4 en 5][ref1] kunnen slechts indien in een voorkomend geval de werknemer ermee
      instemt worden aangemerkt als vakantie, met dien verstande dat de werknemer ten minste recht houdt op het in
      [artikel 634][ref2] bedoelde minimum.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel636
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '636.2'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer de overeengekomen arbeid niet verricht wegens een van de redenen,
      bedoeld in [artikel 635, leden 2 en 3][ref1], kunnen niet worden aangemerkt als vakantie.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel636
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
  - number: '637.1'
    text: |-
      Bij schriftelijke overeenkomst kan worden bepaald dat dagen of gedeelten van dagen waarop de werknemer in enig
      jaar de overeengekomen arbeid niet heeft verricht wegens de reden, bedoeld in [artikel 635 lid 4][ref1] worden
      aangemerkt als vakantie tot ten hoogste het aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref2]
      bedoelde minimum is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel635
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '635'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '637.2'
    text: |-
      Dagen of gedeelten van dagen waarop de werknemer tijdens een vastgestelde vakantie ziek is, gelden niet als
      vakantie. In afwijking van de vorige volzin kan bij schriftelijke overeenkomst worden bepaald dat de in enig jaar
      verleende vakantiedagen of gedeelten daarvan waarop de werknemer ziek is, als vakantie gelden tot ten hoogste het
      aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref1] bedoelde minimum is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '637.3'
    text: |-
      Indien in enig jaar zowel lid 1 als lid 2, tweede volzin, worden toegepast, kunnen in totaal niet meer dan het
      aantal vakantiedagen dat voor dat jaar boven het in [artikel 634][ref1] bedoelde minimum is overeengekomen, als
      vakantie gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel637
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '638.1'
    text: |-
      De werkgever is verplicht de werknemer ieder jaar in de gelegenheid te stellen de vakantie op te nemen waarop de
      werknemer op grond van [artikel 634][ref1] ten minste aanspraak heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '638.2'
    text: |-
      Voorzover in de vaststelling van de vakantie niet is voorzien bij schriftelijke overeenkomst dan wel bij of
      krachtens collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan of de
      wet, stelt de werkgever de tijdstippen van aanvang en einde van de vakantie vast overeenkomstig de wensen van de
      werknemer tenzij gewichtige redenen zich daartegen verzetten. Indien de werkgever niet binnen twee weken nadat de
      werknemer zijn wensen schriftelijk heeft kenbaar gemaakt, schriftelijk aan de werknemer gewichtige redenen heeft
      aangevoerd, is de vakantie vastgesteld overeenkomstig de wensen van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
  - number: '638.3'
    text: |-
      In geval van gewichtige redenen wordt de vakantie op zodanige wijze vastgesteld dat de werknemer desverlangd,
      voorzover zijn aanspraak daartoe toereikend is, gedurende twee opeenvolgende weken of tweemaal een week geen arbeid
      behoeft te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
  - number: '638.4'
    text: |-
      De werkgever stelt de vakantie zo tijdig vast dat de werknemer gelegenheid heeft tot het treffen van
      voorbereidingen voor de besteding van de vakantie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
  - number: '638.5'
    text: |-
      De werkgever kan, indien daartoe gewichtige redenen zijn, na overleg met de werknemer, het vastgestelde tijdvak
      van de vakantie wijzigen. De schade die de werknemer lijdt ten gevolge van de wijziging van het tijdvak van de
      vakantie, wordt door de werkgever vergoed.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
  - number: '638.6'
    text: |-
      De werkgever is verplicht de werknemer de resterende aanspraak op vakantie in dagen of uren te verlenen, tenzij
      gewichtige redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
  - number: '638.7'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van de in lid 2 genoemde termijn
      worden afgeweken ten nadele van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel638
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '639.1'
    text: De werknemer behoudt gedurende zijn vakantie recht op loon.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel639
  - number: '639.2'
    text: |-
      Indien hierin bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan
      is voorzien, kan de werkgever aan zijn verplichting om gedurende de vakantie loon te betalen voldoen hetzij
      door aan de werknemer vakantiebonnen over te dragen ten laste van een fonds, hetzij door betaling aan een
      fonds ten laste waarvan de werknemer gelijkwaardige rechten verwerft. Voor de toepassing van dit artikel worden
      vakantiebonnen als loon beschouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel639
  - number: '640.1'
    text: |-
      De werknemer kan tijdens de duur van de arbeidsovereenkomst geen afstand doen van zijn aanspraak op vakantie tegen
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel640
  - number: '640.2'
    text: |-
      Indien een aanspraak op vakantie is verworven die het in [artikel 634][ref1] bedoelde minimum te boven gaat, kan
      voorzover die aanspraak dat minimum te boven gaat, bij schriftelijke overeenkomst van lid 1 worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel640
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '641.1'
    text: |-
      Een werknemer die bij het einde van de arbeidsovereenkomst nog aanspraak op vakantie heeft, heeft recht op
      een uitkering in geld tot een bedrag van het loon over een tijdvak overeenkomend met de aanspraak, tenzij
      [artikel 639 lid 2][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel639
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel641
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '639'
        afdeling: '3'
  - number: '641.2'
    text: |-
      De werkgever is verplicht aan de werknemer een verklaring uit te reiken waaruit blijkt over welk tijdvak de
      werknemer bij het einde van de arbeidsovereenkomst nog aanspraak op vakantie heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel641
  - number: '641.3'
    text: |-
      Indien de werknemer een nieuwe arbeidsovereenkomst aangaat, heeft hij tegenover de nieuwe werkgever aanspraak op
      vakantie zonder behoud van loon gedurende het tijdvak waarover hij blijkens de in lid 2 bedoelde verklaring nog
      aanspraak op vakantie had.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel641
  - number: '641.4'
    text: |-
      Bij schriftelijke overeenkomst kan van lid 3 worden afgeweken, met dien verstande dat de werknemer ten minste recht
      houdt op het in [artikel 634][ref1] bedoelde minimum.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel641
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '642'
    text: |-
      Een rechtsvordering tot toekenning van vakantie verjaart door verloop van vijf jaren na de laatste dag van het
      kalenderjaar waarin de aanspraak is ontstaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel642
  - number: '643.1'
    text: |-
      De werknemer kan verlangen dat de werkgever hem verlof zonder behoud van loon verleent voor het als lid bijwonen
      van vergaderingen van de Eerste Kamer der Staten-Generaal, van vertegenwoordigende organen van publiekrechtelijke
      lichamen die bij rechtstreekse verkiezing worden samengesteld, uitgezonderd echter de Tweede Kamer der Staten-
      Generaal, alsmede van commissies uit deze organen. Deze bepaling vindt mede toepassing op de werknemer die deel
      uitmaakt van een met algemeen bestuur belast orgaan van een waterschap.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel643
  - number: '643.2'
    text: |-
      Indien daarover tussen de werkgever en de werknemer geen overeenstemming bestaat, stelt de rechter op verzoek
      van de meest gerede partij vast in welke mate dit verlof behoort te worden verleend. De rechter beoordeelt in
      hoever, gezien het belang dat de werknemer aan de in lid 1 bedoelde vergaderingen kan deelnemen, in redelijkheid
      van de werkgever kan worden gevergd dat de werknemer afwezig is. De beschikking van de rechter is uitvoerbaar bij
      voorraad.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel643
  - number: '643.3'
    text: |-
      De leden 1 en 2 vinden overeenkomstige toepassing op gedeputeerden, wethouders en leden van het dagelijks bestuur
      van een waterschap, wier functie niet als een volledige wordt bezoldigd. Bij algemene maatregel van bestuur
      wordt bepaald, welke gedeputeerdenfuncties en wethoudersfuncties voor de toepassing van dit artikel als volledig
      bezoldigd worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel643
  - number: '643.4'
    text: |-
      Dit artikel blijft buiten toepassing ten aanzien van die groepen werknemers voor wie uit hoofde van verlening van
      rijksvergoeding bij of krachtens de wet een andere regeling is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel643
  - number: '645'
    text: |-
      Van de [artikelen 634 tot en met 643][ref1] kan niet ten nadele van de werknemer worden afgeweken, tenzij zodanige
      afwijking bij die artikelen is toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel634
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel645
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '634'
        afdeling: '3'
  - number: '646.1'
    text: |-
      De werkgever mag geen onderscheid maken tussen mannen en vrouwen bij het aangaan van de arbeidsovereenkomst,
      het verstrekken van onderricht aan de werknemer, in de arbeidsvoorwaarden, bij de arbeidsomstandigheden bij de
      bevordering en bij de opzegging van de arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.2'
    text: |-
      Van lid 1 mag, voor zover het betreft het aangaan van de arbeidsovereenkomst en het verstrekken van onderricht,
      worden afgeweken indien het gemaakte onderscheid is gebaseerd op een kenmerk dat verband houdt met het geslacht
      en dat kenmerk wegens de aard van de betrokken specifieke beroepsactiviteiten of de context waarin deze worden
      uitgevoerd, een wezenlijk en bepalend beroepsvereiste is, mits het doel legitiem is en het vereiste evenredig aan
      dat doel is. Daarbij is [artikel 5, derde lid, van de Wet gelijke behandeling van mannen en vrouwen][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003299#Artikel5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
    references:
      - id: ref1
        bwb_id: BWBR0003299
        artikel: '5'
  - number: '646.3'
    text: |-
      Van lid 1 mag worden afgeweken indien het bedingen betreft die op de bescherming van de vrouw, met name in verband
      met zwangerschap of moederschap, betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.4'
    text: |-
      Van lid 1 mag worden afgeweken indien het bedingen betreft die vrouwelijke werknemers in een bevoorrechte positie
      beogen te plaatsen ten einde nadelen op te heffen of te verminderen en het onderscheid in een redelijke verhouding
      staat tot het beoogde doel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.5'
    text: |-
      In dit artikel wordt onder onderscheid verstaan direct en indirect onderscheid alsmede de opdracht tot het maken
      van onderscheid. Onder direct onderscheid wordt verstaan onderscheid tussen mannen en vrouwen. Onder direct
      onderscheid wordt mede verstaan onderscheid op grond van zwangerschap, bevalling en moederschap. Onder indirect
      onderscheid wordt verstaan onderscheid op grond van andere hoedanigheden dan het geslacht, bijvoorbeeld echtelijke
      staat of gezinsomstandigheden, dat onderscheid op grond van geslacht tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.6'
    text: |-
      Het in dit artikel neergelegde verbod van direct onderscheid houdt mede in een verbod op intimidatie en een verbod
      op seksuele intimidatie.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.7'
    text: |-
      Onder intimidatie als bedoeld in lid 6 wordt verstaan: gedrag dat met het geslacht van een persoon verband houdt en
      dat tot doel of gevolg heeft dat de waardigheid van de persoon wordt aangetast en dat een bedreigende, vijandige,
      beledigende, vernederende of kwetsende omgeving wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.8'
    text: |-
      Onder seksuele intimidatie als bedoeld in lid 6 wordt verstaan: enige vorm van verbaal, non-verbaal of fysiek
      gedrag met een seksuele connotatie dat als doel of gevolg heeft dat de waardigheid van de persoon wordt aangetast,
      in het bijzonder wanneer een bedreigende, vijandige, beledigende, vernederende of kwetsende situatie wordt
      gecreëerd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.9'
    text: |-
      De werkgever mag de werknemer die het in de leden 7 en 8 bedoelde gedrag afwijst of lijdzaam ondergaat, niet
      benadelen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.10'
    text: |-
      Het in lid 1 neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid indien dat
      onderscheid objectief gerechtvaardigd wordt door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.11'
    text: Een beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.12'
    text: |-
      Indien degene die meent dat te zijnen nadeel een onderscheid is of wordt gemaakt als bedoeld in dit artikel, in
      rechte feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in
      strijd met dit artikel is gehandeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '646.13'
    text: De leden 2 en 3 zijn niet van toepassing op het verbod van intimidatie en seksuele intimidatie, bedoeld in lid 6.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel646
  - number: '647.1'
    text: |-
      De opzegging van de arbeidsovereenkomst door de werkgever in strijd met [artikel 646 lid 1][ref1] of wegens de
      omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op [artikel 646 lid 1][ref2] of terzake
      bijstand heeft verleend is vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
  - number: '647.2'
    text: |-
      Indien de werknemer niet binnen twee maanden na de opzegging een beroep op deze vernietigingsgrond doet, vervalt
      zijn bevoegdheid daartoe. [Artikel 55 van Boek 3][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '647.3'
    text: |-
      Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel647
  - number: '647.4'
    text: |-
      De opzegging, bedoeld in [artikel 646 lid 1][ref1], maakt de werkgever niet schadeplichtig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
  - number: '647.5'
    text: |-
      De werkgever mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte een
      beroep heeft gedaan op [artikel 646 lid 1][ref1] of terzake bijstand heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel647
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
        afdeling: '4'
  - number: '648.1'
    text: |-
      De werkgever mag geen onderscheid maken tussen werknemers op grond van een verschil in arbeidsduur in de
      voorwaarden waaronder een arbeidsovereenkomst wordt aangegaan, voortgezet dan wel opgezegd, tenzij een dergelijk
      onderscheid objectief gerechtvaardigd is. De opzegging van de arbeidsovereenkomst door de werkgever in strijd
      met de vorige zin of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op het
      bepaalde in de vorige zin is vernietigbaar. [Artikel 647, leden 2 en 3][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel647
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel648
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '647'
        afdeling: '4'
  - number: '648.2'
    text: Een beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel648
  - number: '648.3'
    text: De opzegging, bedoeld in de eerste zin van lid 1, maakt de werkgever niet schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel648
  - number: '648.4'
    text: |-
      De Commissie gelijke behandeling, genoemd in [artikel 11 van de Algemene wet gelijke behandeling][ref1], kan
      onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in het eerste lid. De [artikelen 12][ref2],
      [13][ref3], [14][ref4], [15][ref5], [20, tweede lid][ref6], en [33 van de Algemene wet gelijke behandeling][ref7]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006502#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006502#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0006502#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0006502#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006502#Artikel33
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel648
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006502
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0006502
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0006502
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0006502
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0006502
        artikel: '33'
  - number: '649.1'
    text: |-
      De werkgever mag geen onderscheid maken tussen werknemers in de arbeidsvoorwaarden op grond van het al dan niet
      tijdelijke karakter van de arbeidsovereenkomst, tenzij een dergelijk onderscheid objectief gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel649
  - number: '649.2'
    text: |-
      De opzegging van de arbeidsovereenkomst door de werkgever wegens de omstandigheid dat de werknemer in of buiten
      rechte een beroep heeft gedaan op het bepaalde in lid 1, is vernietigbaar. [Artikel 647 leden 2 en 3][ref1] is
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel647
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel649
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '647'
        afdeling: '4'
  - number: '649.3'
    text: Een beding in strijd met lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel649
  - number: '649.4'
    text: |-
      De Commissie gelijke behandeling, genoemd in [artikel 11 van de Algemene wet gelijke behandeling][ref1], kan
      onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in lid 1. De [artikelen 12][ref2], [13][ref3],
      [14][ref4], [15][ref5], [20, tweede lid][ref6] en [33 van de Algemene wet gelijke behandeling][ref7] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006502#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006502#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0006502#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0006502#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006502#Artikel33
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel649
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006502
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0006502
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0006502
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0006502
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0006502
        artikel: '33'
  - number: '649.5'
    text: |-
      Het bepaalde in de leden 1 tot en met 4 is niet van toepassing op een uitzendovereenkomst als bedoeld in
      [artikel 690][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel649
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '650.1'
    text: |-
      De werkgever kan slechts boete stellen op de overtreding van de voorschriften van de arbeidsovereenkomst, indien
      in de arbeidsovereenkomst de voorschriften op de overtreding waarvan boete is gesteld en het bedrag van de boete
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.2'
    text: De overeenkomst waarbij boete wordt bedongen, wordt schriftelijk aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.3'
    text: |-
      De overeenkomst waarbij boete is bedongen, vermeldt nauwkeurig de bestemming van de boete. Zij mogen noch
      onmiddellijk noch middellijk strekken tot persoonlijk voordeel van de werkgever zelf of van degene aan wie de
      werkgever de bevoegdheid heeft verleend om aan werknemers een boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.4'
    text: |-
      Iedere boete, in een overeenkomst bedongen, is op een bepaald bedrag gesteld, uitgedrukt in het geld waarin het
      loon in geld is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.5'
    text: |-
      Binnen een week mag aan de werknemer geen hoger bedrag aan gezamenlijke boetes worden opgelegd dan zijn in geld
      vastgesteld loon voor een halve dag. Geen afzonderlijke boete mag hoger dan dit bedrag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.6'
    text: |-
      Elk beding in strijd met enige bepaling van dit artikel is nietig. Echter mag, doch alleen ten aanzien van
      werknemers wier in geld vastgesteld loon meer bedraagt dan het voor hen geldende minimumloon bij schriftelijk
      aangegane overeenkomst van de bepalingen van de leden 3, 4 en 5 worden afgeweken. Is zulks geschied, dan zal de
      rechter steeds bevoegd zijn de boete op een kleinere som te bepalen, indien de opgelegde boete hem bovenmatig
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.7'
    text: |-
      Ondergaat het bedrag van het loon, genoemd in lid 6, wijziging, dan wordt de werking van bedingen waarbij van de
      leden 3, 4 en 5 is afgeweken, geschorst jegens de werknemer wiens in geld vastgesteld loon niet meer bedraagt dan
      het gewijzigde bedrag van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
  - number: '650.8'
    text: |-
      Onder het stellen en bedingen van boete in de zin van dit artikel wordt begrepen het door de werkgever bedingen van
      boete als bedoeld in de [artikelen 91 tot en met 94 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel91
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel650
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '91'
  - number: '651.1'
    text: |-
      De mogelijkheid een boete op te leggen laat het recht op schadevergoeding op grond van de wet onverlet. Echter mag
      de werkgever ter zake van een zelfde feit niet boete heffen en tevens schadevergoeding vorderen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel651
  - number: '651.2'
    text: Elk beding in strijd met de tweede zin van lid 1 is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel651
  - number: '652.1'
    text: Indien partijen een proeftijd overeenkomen, is deze voor beide partijen gelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.2'
    text: De proeftijd wordt schriftelijk overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.3'
    text: |-
      Bij het aangaan van een arbeidsovereenkomst voor onbepaalde tijd kan een proeftijd worden overeengekomen van ten
      hoogste twee maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.4'
    text: |-
      Bij het aangaan van een arbeidsovereenkomst voor bepaalde tijd kan een proeftijd worden overeengekomen van ten
      hoogste:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: 652.4.a
    text: een maand, indien de overeenkomst is aangegaan voor korter dan twee jaren;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: 652.4.b
    text: twee maanden, indien de overeenkomst is aangegaan voor twee jaren of langer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.5'
    text: |-
      Indien het einde van een arbeidsovereenkomst voor bepaalde tijd niet op een kalenderdatum is gesteld, kan een
      proeftijd worden overeengekomen van ten hoogste een maand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.6'
    text: |-
      Van de leden 4, onder a, en 5, kan slechts bij collectieve arbeidsovereenkomst of bij regeling door of namens een
      daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '652.7'
    text: |-
      Elk beding waarbij de proeftijd niet voor beide partijen gelijk is dan wel op langer dan twee maanden wordt
      gesteld, alsmede elk beding waarbij door het aangaan van een nieuwe proeftijd de gezamenlijke proeftijden langer
      dan twee maanden worden, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel652
  - number: '653.1'
    text: |-
      Een beding tussen de werkgever en de werknemer waarbij deze laatste wordt beperkt in zijn bevoegdheid om na het
      einde van de overeenkomst op zekere wijze werkzaam te zijn, is slechts geldig, indien de werkgever dit schriftelijk
      is overeengekomen met een meerderjarige werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel653
  - number: '653.2'
    text: |-
      De rechter kan zulk een beding geheel of gedeeltelijk vernietigen op grond dat, in verhouding tot het te beschermen
      belang van de werkgever, de werknemer door dat beding onbillijk wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel653
  - number: '653.3'
    text: |-
      Aan een beding als bedoeld in lid 1 kan de werkgever geen rechten ontlenen, indien hij wegens de wijze waarop de
      overeenkomst is geëindigd, schadeplichtig is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel653
  - number: '653.4'
    text: |-
      Indien een beding als bedoeld in lid 1 de werknemer in belangrijke mate belemmert om anders dan in dienst van
      de werkgever werkzaam te zijn, kan de rechter steeds bepalen dat de werkgever voor de duur van de beperking
      aan de werknemer een vergoeding moet betalen. De rechter stelt de hoogte van deze vergoeding met het oog op de
      omstandigheden van het geval naar billijkheid vast; hij kan toestaan dat de vergoeding op de door hem te bepalen
      wijze in termijnen wordt betaald. De vergoeding is niet verschuldigd, indien de werknemer wegens de wijze waarop de
      overeenkomst is geëindigd, schadeplichtig is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel653
  - number: '654.1'
    text: |-
      Wanneer een arbeidsovereenkomst schriftelijk wordt aangegaan of gewijzigd, zijn de kosten van het geschrift en
      andere bijkomende kosten ten laste van de werkgever.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel654
  - number: '654.2'
    text: |-
      De werkgever is verplicht kosteloos een volledig, door hem ondertekend, afschrift van het geschrift waarbij de
      arbeidsovereenkomst is aangegaan of gewijzigd, aan de werknemer te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel654
  - number: '655.1'
    text: |-
      De werkgever is verplicht aan de werknemer een schriftelijke opgave te verstrekken met ten minste de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.a
    text: naam en woonplaats van partijen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.b
    text: de plaats of plaatsen waar de arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.c
    text: de functie van de werknemer of de aard van zijn arbeid;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.d
    text: het tijdstip van indiensttreding;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.e
    text: indien de overeenkomst voor bepaalde tijd is gesloten, de duur van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.f
    text: de aanspraak op vakantie of de wijze van berekening van de aanspraak;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.g
    text: de duur van de door partijen in acht te nemen opzegtermijnen of de wijze van berekening van deze termijnen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.h
    text: |-
      het loon en de termijn van uitbetaling alsmede, indien het loon afhankelijk is van de uitkomsten van de te
      verrichten arbeid, de per dag of per week aan te bieden hoeveelheid arbeid, de prijs per stuk en de tijd die
      redelijkerwijs met de uitvoering is gemoeid;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.i
    text: de gebruikelijke arbeidsduur per dag of per week;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.j
    text: of de werknemer gaat deelnemen aan een pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.k
    text: |-
      indien de werknemer voor een langere termijn dan een maand werkzaam zal zijn buiten Nederland, mede de duur van
      die werkzaamheid, de huisvesting, de toepasselijkheid van de Nederlandse sociale verzekeringswetgeving dan wel
      opgave van de voor de uitvoering van die wetgeving verantwoordelijke organen, de geldsoort waarin betaling zal
      plaatsvinden, de vergoedingen waarop de werknemer recht heeft en de wijze waarop de terugkeer geregeld is;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.l
    text: de toepasselijke collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: 655.1.m
    text: |-
      of de arbeidsovereenkomst een uitzendovereenkomst is als bedoeld in [artikel 690][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '655.2'
    text: |-
      Voor zover de gegevens, bedoeld in lid 1, onderdelen *a* tot en met *j*, zijn vermeld in een schriftelijk aangegane
      arbeidsovereenkomst of in de opgave, bedoeld in [artikel 626][ref1], kan vermelding achterwege blijven. Voor
      zover de gegevens, bedoeld in het eerste lid, onderdelen *f* tot en met *i*, zijn vermeld in een toepasselijke
      collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan, kan worden volstaan
      met een verwijzing naar deze overeenkomst of regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel626
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '626'
        afdeling: '2'
  - number: '655.3'
    text: |-
      De werkgever verstrekt de opgave binnen een maand na de aanvang van de werkzaamheden of zo veel eerder als de
      overeenkomst eindigt. De gegevens, bedoeld in lid 1, onderdeel *k*, worden verstrekt voor het vertrek. De opgave
      wordt door de werkgever ondertekend. Wijziging in de gegevens wordt binnen een maand nadat de wijziging van kracht
      is geworden, aan de werknemer schriftelijk medegedeeld, tenzij deze voortvloeit uit wijziging van een wettelijk
      voorschrift, collectieve arbeidsovereenkomst of regeling door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: '655.4'
    text: |-
      Indien de overeenkomst betreft het doorgaans op minder dan drie dagen per week uitsluitend of nagenoeg uitsluitend
      verrichten van huishoudelijke of persoonlijke diensten ten behoeve van een natuurlijk persoon, behoeft de werkgever
      slechts op verlangen van de werknemer de gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: '655.5'
    text: |-
      De werkgever die weigert de opgave te verstrekken of daarin onjuiste mededelingen opneemt, is jegens de werknemer
      aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: '655.6'
    text: |-
      De leden 1 tot en met 5 zijn van overeenkomstige toepassing op een overeenkomst die de voorwaarden regelt van
      een of meer arbeidsovereenkomsten die partijen zullen sluiten indien na oproep arbeid wordt verricht, en op het
      aangaan van een andere overeenkomst dan een arbeidsovereenkomst, al dan niet gevolgd door andere soortgelijke
      overeenkomsten, waarbij de ene partij, natuurlijk persoon, zich verbindt voor de andere partij tegen beloning
      arbeid te verrichten, tenzij deze overeenkomst wordt aangegaan in beroep of bedrijf. Op de in dit lid bedoelde
      overeenkomsten is [artikel 654][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel654
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '654'
        afdeling: '6'
  - number: '655.7'
    text: |-
      Indien lid 6 van toepassing is, wordt in de schriftelijke opgave, bedoeld in lid 1, tevens vermeld welke
      overeenkomst is aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: '655.8'
    text: Een beding in strijd met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel655
  - number: '656.1'
    text: |-
      De werkgever is verplicht bij het einde van de arbeidsovereenkomst de werknemer op diens verzoek een getuigschrift
      uit te reiken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '656.2'
    text: 'Het getuigschrift vermeldt:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: 656.2.a
    text: de aard van de verrichte arbeid en de arbeidsduur per dag of per week;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: 656.2.b
    text: de begindatum en de einddatum van het dienstverband;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: 656.2.c
    text: een opgave van de wijze waarop de werknemer aan zijn verplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: 656.2.d
    text: een opgave van de wijze waarop de arbeidsovereenkomst is geëindigd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: 656.2.e
    text: indien de werkgever de arbeidsovereenkomst heeft opgezegd, de reden daartoe.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '656.3'
    text: |-
      De in lid 2, onderdelen *c*, *d* en *e*, genoemde gegevens worden slechts op verzoek van de werknemer in het
      getuigschrift vermeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '656.4'
    text: |-
      Indien de werknemer de arbeidsovereenkomst heeft opgezegd en hij deswege schadeplichtig is geworden, is de
      werkgever gerechtigd dit in het getuigschrift te vermelden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '656.5'
    text: |-
      De werkgever die weigert het gevraagde getuigschrift af te geven, nalaat aan een verzoek als bedoeld in lid 3
      te voldoen, in het getuigschrift door opzet of schuld onjuiste mededelingen opneemt of het getuigschrift van
      een kenmerk voorziet of op een bepaalde wijze inricht om daarmee aangaande de werknemer enige mededeling te
      doen die niet in de bewoordingen van het getuigschrift is vervat, is zowel jegens de werknemer als jegens derden
      aansprakelijk voor de daardoor veroorzaakte schade.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '656.6'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel656
  - number: '657.1'
    text: |-
      De werkgever is verplicht de werknemer met een arbeidsovereenkomst voor bepaalde tijd tijdig en duidelijk in kennis
      te stellen van een vacature terzake van een arbeidsovereenkomst voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel657
  - number: '657.2'
    text: |-
      Het bepaalde in lid 1 is niet van toepassing op een uitzendovereenkomst als bedoeld in [artikel 690][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel657
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '658.1'
    text: |-
      De werkgever is verplicht de lokalen, werktuigen en gereedschappen waarin of waarmee hij de arbeid doet verrichten,
      op zodanige wijze in te richten en te onderhouden alsmede voor het verrichten van de arbeid zodanige maatregelen
      te treffen en aanwijzingen te verstrekken als redelijkerwijs nodig is om te voorkomen dat de werknemer in de
      uitoefening van zijn werkzaamheden schade lijdt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658
  - number: '658.2'
    text: |-
      De werkgever is jegens de werknemer aansprakelijk voor de schade die de werknemer in de uitoefening van zijn
      werkzaamheden lijdt, tenzij hij aantoont dat hij de in lid 1 genoemde verplichtingen is nagekomen of dat de schade
      in belangrijke mate het gevolg is van opzet of bewuste roekeloosheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658
  - number: '658.3'
    text: |-
      Van de leden 1 en 2 en van hetgeen [titel 3 van Boek 6][ref1], bepaalt over de aansprakelijkheid van de werkgever
      kan niet ten nadele van de werknemer worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658
    references:
      - id: ref1
        bwb_id: BWBR0005289
  - number: '658.4'
    text: |-
      Hij die in de uitoefening van zijn beroep of bedrijf arbeid laat verrichten door een persoon met wie hij geen
      arbeidsovereenkomst heeft, is overeenkomstig de leden 1 tot en met 3 aansprakelijk voor de schade die deze persoon
      in de uitoefening van zijn werkzaamheden lijdt. De kantonrechter is bevoegd kennis te nemen van vorderingen op
      grond van de eerste zin van dit lid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658
  - number: 658a.1
    text: |-
      De werkgever bevordert ten aanzien van de werknemer die in verband met ongeschiktheid ten gevolge van ziekte
      verhinderd is de bedongen arbeid te verrichten, de inschakeling in de arbeid in zijn bedrijf. Indien vaststaat
      dat de eigen arbeid niet meer kan worden verricht en in het bedrijf van de werkgever geen andere passende arbeid
      voorhanden is, bevordert de werkgever, gedurende het tijdvak waarin de werknemer jegens hem recht op loon heeft op
      grond van [artikel 629][ref1], [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      of [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3], de inschakeling van de
      werknemer in voor hem passende arbeid in het bedrijf van een andere werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 658a.2
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in lid 1, is de werkgever verplicht zo tijdig mogelijk
      zodanige maatregelen te treffen en aanwijzingen te verstrekken als redelijkerwijs nodig is, opdat de werknemer, die
      in verband met ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te verrichten, in staat wordt
      gesteld de eigen of andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
  - number: 658a.3
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in lid 1, stelt de werkgever
      in overeenstemming met de werknemer een plan van aanpak op als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en
      [artikel 25, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2]. Het plan van aanpak wordt met
      medewerking van de werknemer regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
  - number: 658a.4
    text: |-
      Onder passende arbeid als bedoeld in lid 1 en 2 wordt verstaan alle arbeid die voor de krachten en bekwaamheden van
      de werknemer is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
  - number: 658a.5
    text: |-
      De werkgever en degene door wie de werkgever zich op grond van
      [artikel 14 van de Arbeidsomstandighedenwet 1998][ref1] laat bijstaan, verstrekken een reïntegratiebedrijf
      als bedoeld in [artikel 1 van de Wet werk en inkomen naar arbeidsvermogen][ref2] gegevens voorzover
      deze noodzakelijk zijn voor de uitvoering van de door de werkgever aan dit bedrijf opgedragen
      werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid door dat
      reïntegratiebedrijf wordt bevorderd. Het reïntegratiebedrijf verwerkt deze gegevens slechts voorzover
      dat noodzakelijk is voor deze werkzaamheden en gebruikt slechts met dat doel het sociaal-fiscaalnummer
      bij die verwerking. Onder sociaal-fiscaalnummer wordt in dit artikel verstaan het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 658a.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op de eigenrisicodrager, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref1] en de persoon, bedoeld in
      [artikel 63, eerste lid, van de Ziektewet][ref2], gedurende de periode dat de eigenrisicodrager aan die persoon
      ziekengeld moet betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '63'
  - number: 658b.1
    text: |-
      De rechter wijst een vordering tot nakoming van de verplichting, bedoeld in [artikel 658a lid 2][ref1], af,
      indien bij de eis niet een verklaring is gevoegd van een deskundige, benoemd door het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      omtrent de nakoming van die verplichting door de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: 658b.2
    text: |-
      Lid 1 geldt niet indien de nakoming niet wordt betwist of het overleggen van de verklaring in redelijkheid niet van
      de werknemer kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
  - number: 658b.3
    text: |-
      De deskundige, die zijn benoeming heeft aanvaard, is verplicht zijn onderzoek onpartijdig en naar beste weten te
      volbrengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
  - number: 658b.4
    text: |-
      De deskundige die de hoedanigheid van arts bezit, kan de voor zijn onderzoek van belang zijnde inlichtingen over de
      werknemer inwinnen bij de behandelend arts of de behandelend artsen. Zij verstrekken de gevraagde inlichtingen voor
      zover daardoor de persoonlijke levenssfeer van de werknemer niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
  - number: 658b.5
    text: |-
      De rechter kan op verzoek van een der partijen of ambtshalve bevelen dat de deskundige zijn verklaring nader
      schriftelijk of mondeling toelicht of aanvult.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
  - number: 658b.6
    text: |-
      De werknemer wordt ter zake van een vordering als bedoeld in het eerste lid slechts in de kosten van de werkgever,
      bedoeld in [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1], veroordeeld in geval van kennelijk
      onredelijk gebruik van procesrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
  - number: 658b.7
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan kan
      worden bepaald dat de in het eerste lid bedoelde deskundige door een ander dan het Uitvoeringsinstituut
      werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel658b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '659.1'
    text: |-
      De werknemer is verplicht de arbeid zelf te verrichten; hij kan zich daarin niet dan met toestemming van de
      werkgever door een derde doen vervangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel659
  - number: '659.2'
    text: |-
      De rechtsvordering tot nakoming van de arbeidsverplichting van de werknemer onder de bepaling van een dwangsom of
      van gijzeling is niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel659
  - number: '660'
    text: |-
      De werknemer is verplicht zich te houden aan de voorschriften omtrent het verrichten van de arbeid alsmede aan die
      welke strekken ter bevordering van de goede orde in de onderneming van de werkgever, door of namens de werkgever
      binnen de grenzen van algemeen verbindende voorschriften, of overeenkomst aan hem, al dan niet tegelijk met andere
      werknemers, gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel660
  - number: 660a
    text: |-
      De werknemer die in verband met ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te
      verrichten, is verplicht:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel660a
  - number: 660a.a
    text: |-
      gevolg te geven aan door de werkgever of een door hem aangewezen deskundige gegeven redelijke voorschriften en
      mee te werken aan door de werkgever of een door hem aangewezen deskundige getroffen maatregelen als bedoeld in
      [artikel 658a lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 660a.b
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 658a lid 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 660a.c
    text: |-
      passende arbeid als bedoeld in [artikel 658a lid 4][ref1] te verrichten waartoe de werkgever hem in de gelegenheid
      stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel660a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: '661.1'
    text: |-
      De werknemer die bij de uitvoering van de overeenkomst schade toebrengt aan de werkgever of aan een derde jegens
      wie de werkgever tot vergoeding van die schade is gehouden, is te dier zake niet jegens de werkgever aansprakelijk,
      tenzij de schade een gevolg is van zijn opzet of bewuste roekeloosheid. Uit de omstandigheden van het geval kan,
      mede gelet op de aard van de overeenkomst, anders voortvloeien dan in de vorige zin is bepaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel661
  - number: '661.2'
    text: |-
      Afwijking van lid 1 en van [artikel 170 lid 3 van Boek 6][ref1] ten nadele van de werknemer is slechts mogelijk bij
      schriftelijke overeenkomst en slechts voor zover de werknemer te dier zake verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel170
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel661
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '170'
  - number: '662.1'
    text: |-
      In afwijking van [artikel 615][ref1] is deze afdeling ook van toepassing op de werknemer die arbeid verricht in een
      onderneming die in stand wordt gehouden door staat, provincie, gemeente, waterschap of enig ander publiekrechtelijk
      lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel615
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel662
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '615'
        afdeling: '1'
  - number: '662.2'
    text: 'Voor de toepassing van deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel662
  - number: 662.2.a
    text: |-
      overgang: de overgang, ten gevolge van een overeenkomst, een fusie of een splitsing, van een economische eenheid
      die haar identiteit behoudt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel662
  - number: 662.2.b
    text: |-
      economische eenheid: een geheel van georganiseerde middelen, bestemd tot het ten uitvoer brengen van een al dan
      niet hoofdzakelijk economische activiteit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel662
  - number: '662.3'
    text: |-
      Voor de toepassing van deze afdeling wordt een vestiging of een onderdeel van een onderneming of vestiging
      beschouwd als een onderneming.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel662
  - number: '663'
    text: |-
      Door de overgang van een onderneming gaan de rechten en verplichtingen die op dat tijdstip voor de werkgever in die
      onderneming voortvloeien uit een arbeidsovereenkomst tussen hem en een daar werkzame werknemer van rechtswege over
      op de verkrijger. Evenwel is die werkgever nog gedurende een jaar na de overgang naast de verkrijger hoofdelijk
      verbonden voor de nakoming van de verplichtingen uit de arbeidsovereenkomst, die zijn ontstaan vóór dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel663
  - number: '664.1'
    text: |-
      [Artikel 663, eerste volzin][ref1], is niet van toepassing op rechten en verplichtingen
      van de werkgever die voortvloeien uit een toezegging omtrent pensioen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Pensioen- en spaarfondsenwet][ref2] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '1'
  - number: 664.1.a
    text: |-
      de verkrijger aan de werknemer, bedoeld in [artikel 663][ref1], dezelfde toezegging doet, die hij reeds voor het
      tijdstip van overgang heeft gedaan aan zijn werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
  - number: 664.1.b
    text: |-
      de verkrijger op grond van [artikel 2 van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref1],
      verplicht is deel te nemen in een bedrijfstakpensioenfonds en de werknemer, bedoeld in [artikel 663][ref2], gaat
      deelnemen in dat fonds;


      [ref1]: https://wetten.overheid.nl/BWBR0012092#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0012092
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
  - number: 664.1.c
    text: |-
      bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan is afgeweken
      van de toezegging omtrent pensioen, bedoeld in de aanhef.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
  - number: '664.2'
    text: |-
      Het eerste lid is niet van toepassing indien de werknemer, bedoeld in [artikel 663][ref1], voor de overgang op
      grond van [artikel 2 van de Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref2], verplicht is
      deel te nemen in een bedrijfstakpensioenfonds en deze zelfde verplichting blijft gelden na de overgang.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref2]: https://wetten.overheid.nl/BWBR0012092#Artikel2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0012092
        artikel: '2'
  - number: '664.3'
    text: |-
      [Artikel 663][ref1], eerste volzin, is niet van toepassing op rechten en verplichtingen van de werkgever die
      voortvloeien uit een spaarregeling als bedoeld in [artikel 3, eerste lid, van de Pensioen- en spaarfondsenwet][ref2]
      indien de verkrijger de werknemer, bedoeld in [artikel 663][ref3], opneemt in de spaarregeling die reeds voor het
      tijdstip van overgang gold voor zijn werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel664
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0002089
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '663'
        afdeling: '8'
  - number: '665'
    text: |-
      Indien de overgang van een onderneming een wijziging van de omstandigheden ten nadele van de werknemer tot gevolg
      heeft en de arbeidsovereenkomst deswege wordt ontbonden ingevolge [artikel 685][ref1], geldt zij met het oog op de
      toepassing van lid 8 van dat artikel als ontbonden wegens een reden welke voor rekening van de werkgever komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: 665a
    text: |-
      Indien in een onderneming geen ondernemingsraad is ingesteld, noch een personeelsvertegenwoordiging is ingesteld
      krachtens [artikel 35c, eerste lid][ref1], of [artikel 35d, eerste lid, van de Wet op de ondernemingraden][ref2],
      stelt de werkgever de eigen werknemers die betrokken zijn bij de overgang van de onderneming tijdig in kennis van


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel35c
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel35d
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 35c
      - id: ref2
        bwb_id: BWBR0002747
        artikel: 35d
  - number: 665a.a
    text: het voorgenomen besluit tot overgang;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
  - number: 665a.b
    text: de voorgenomen datum van de overgang;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
  - number: 665a.c
    text: de reden van de overgang;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
  - number: 665a.d
    text: de juridische, economische, en sociale gevolgen van de overgang voor de werknemers, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
  - number: 665a.e
    text: de ten aanzien van de werknemers overwogen maatregelen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel665a
  - number: '666.1'
    text: |-
      De [artikelen 662 tot en met 665][ref1], en [artikel 670, lid 8][ref2], zijn niet van toepassing op de overgang
      van een onderneming indien de werkgever in staat van faillissement is verklaard en de onderneming tot de boedel
      behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel666
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
  - number: '666.2'
    text: Deze afdeling is niet van toepassing met betrekking tot de bemanning van een zeeschip.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel666
  - number: '667.1'
    text: |-
      Een arbeidsovereenkomst eindigt van rechtswege, wanneer de tijd is verstreken bij overeenkomst, bij de wet of door
      het gebruik aangegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.2'
    text: 'Voorafgaande opzegging is in dat geval nodig:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: 667.2.a
    text: indien zulks bij schriftelijk aangegane overeenkomst is bepaald;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: 667.2.b
    text: |-
      indien volgens de wet of het gebruik opzegging behoort plaats te vinden en daarvan niet, waar zulks geoorloofd is,
      bij schriftelijk aangegane overeenkomst is afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.3'
    text: |-
      Een arbeidsovereenkomst als bedoeld in lid 1 kan slechts tussentijds worden opgezegd indien voor ieder der partijen
      dat recht schriftelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.4'
    text: |-
      Indien een voor onbepaalde tijd aangegane arbeidsovereenkomst, die anders dan door rechtsgeldige opzegging of
      door ontbinding door de rechter is geëindigd, éénmaal of meermalen is voortgezet door een arbeidsovereenkomst voor
      bepaalde tijd met tussenpozen van niet meer dan drie maanden, is in afwijking van lid 1 voor de beëindiging van
      die laatste arbeidsovereenkomst voorafgaande opzegging nodig. De termijn van opzegging wordt berekend vanaf het
      tijdstip van totstandkoming van de arbeidsovereenkomst voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.5'
    text: |-
      Van een voortgezette arbeidsovereenkomst als bedoeld in lid 4 is eveneens sprake indien eenzelfde werknemer
      achtereenvolgens in dienst is geweest bij verschillende werkgevers die redelijkerwijze geacht moeten worden ten
      aanzien van de verrichte arbeid elkanders opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.6'
    text: Voor de beëindiging van een voor onbepaalde tijd aangegane arbeidsovereenkomst is voorafgaande opzegging nodig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.7'
    text: |-
      Een beding, krachtens hetwelk de arbeidsovereenkomst van rechtswege eindigt wegens het in het huwelijk treden van
      de werknemer of wegens het aangaan van een geregistreerd partnerschap door de werknemer, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '667.8'
    text: |-
      Een beding, krachtens hetwelk de arbeidsovereenkomst van rechtswege eindigt wegens zwangerschap of bevalling van de
      werkneemster, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel667
  - number: '668.1'
    text: |-
      Indien de arbeidsovereenkomst na het verstrijken van de tijd, bedoeld in [artikel 667 lid 1][ref1], door partijen
      zonder tegenspraak wordt voortgezet, wordt zij geacht voor dezelfde tijd, doch telkens ten hoogste voor een jaar,
      op de vroegere voorwaarden wederom te zijn aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel667
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '667'
        afdeling: '9'
  - number: '668.2'
    text: |-
      Hetzelfde geldt, wanneer in de gevallen waarin opzegging nodig is, tijdige opzegging achterwege blijft en de
      gevolgen van de voortzetting der arbeidsovereenkomst niet opzettelijk zijn geregeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668
  - number: 668a.1
    text: 'Vanaf de dag dat tussen dezelfde partijen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.1.a
    text: |-
      arbeidsovereenkomsten voor bepaalde tijd elkaar met tussenpozen van niet meer dan drie maanden hebben opgevolgd
      en een periode van 36 maanden, deze tussenpozen inbegrepen, hebben overschreden, geldt met ingang van die dag de
      laatste arbeidsovereenkomst als aangegaan voor onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.1.b
    text: |-
      meer dan 3 voor bepaalde tijd aangegane arbeidsovereenkomsten elkaar hebben opgevolgd met tussenpozen van niet meer
      dan 3 maanden, geldt de laatste arbeidsovereenkomst als aangegaan voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.2
    text: |-
      Lid 1 is van overeenkomstige toepassing op elkaar opvolgende arbeidsovereenkomsten tussen een werknemer en
      verschillende werkgevers, die ten aanzien van de verrichte arbeid redelijkerwijze geacht moeten worden elkanders
      opvolger te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.3
    text: |-
      Lid 1, onderdeel a en laatste zinsnede, is niet van toepassing op een arbeidsovereenkomst aangegaan voor niet meer
      dan 3 maanden die onmiddellijk volgt op een tussen dezelfde partijen aangegane arbeidsovereenkomst voor 36 maanden
      of langer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.4
    text: |-
      De termijn van opzegging wordt berekend vanaf het tijdstip van totstandkoming van de eerste arbeidsovereenkomst als
      bedoeld onder a of b van lid 1.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: 668a.5
    text: |-
      Van de leden 1 tot en met 4 kan slechts bij collectieve arbeidsovereenkomst of bij regeling door of namens een
      daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel668a
  - number: '669'
    text: |-
      Degene die de arbeidsovereenkomst opzegt, geeft de andere partij op diens verzoek schriftelijk opgave van de reden
      van opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel669
  - number: '670.1'
    text: |-
      De werkgever kan niet opzeggen gedurende de tijd dat de werknemer ongeschikt is tot het verrichten van zijn arbeid
      wegens ziekte, tenzij de ongeschiktheid:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670.1.a
    text: ten minste twee jaren heeft geduurd, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670.1.b
    text: |-
      een aanvang heeft genomen nadat een verzoek om toestemming als bedoeld in
      [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] door de Centrale organisatie werk en
      inkomen, genoemd in [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: '670.2'
    text: |-
      De werkgever kan de arbeidsovereenkomst met een werkneemster niet opzeggen gedurende de zwangerschap. De werkgever
      kan ter staving van de zwangerschap een verklaring van een arts of van een verloskundige verlangen. Voorts kan de
      werkgever de arbeidsovereenkomst van de werkneemster niet opzeggen gedurende de periode waarin zij bevallingsverlof
      als bedoeld in [artikel 3:1, derde lid, van de Wet arbeid en zorg][ref1] geniet en na werkhervatting, gedurende het
      tijdvak van zes weken aansluitend op dat bevallingsverlof, dan wel aansluitend op een periode van ongeschiktheid
      tot het verrichten van arbeid die haar oorzaak vindt in de bevalling of de daaraan voorafgaande zwangerschap en die
      aansluit op dat bevallingsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '670.3'
    text: |-
      De werkgever kan niet opzeggen gedurende de tijd dat de werknemer verhinderd is de bedongen arbeid te verrichten,
      omdat hij als dienstplichtige is opgeroepen ter vervulling van zijn militaire dienst of vervangende dienst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: '670.4'
    text: 'De werkgever kan de arbeidsovereenkomst niet opzeggen met de werknemer die lid is van:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670.4.1°
    text: |-
      een ondernemingsraad, een centrale ondernemingsraad, een groepsondernemingsraad, een vaste commissie van die raden
      of van een onderdeelcommissie van de ondernemingsraad, of van een personeelsvertegenwoordiging;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670.4.2°
    text: |-
      een bijzondere onderhandelingsgroep of een Europese ondernemingsraad als bedoeld in de
      [Wet op de Europese ondernemingsraden][ref1], dan wel die krachtens die wet optreedt als vertegenwoordiger bij een
      andere wijze van informatieverstrekking en raadpleging van werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0008508
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0008508
  - number: 670.4.3°
    text: |-
      een bijzondere onderhandelingsgroep, of een SE-ondernemingsraad of als werknemersvertegenwoordiger
      lid is van het toezichthoudend of het bestuursorgaan van de SE als bedoeld in
      [hoofdstuk 1 van de Wet rol werknemers bij Europese rechtspersonen][ref1], dan wel die krachtens die wet optreedt
      als vertegenwoordiger bij een andere wijze van informatieverstrekking en raadpleging van werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '1'
  - number: 670.4.4°
    text: |-
      een bijzondere onderhandelingsgroep, of een SCE-ondernemingsraad of als werknemersvertegenwoordiger
      lid is van het toezichthoudend of het bestuursorgaan van de SCE als bedoeld in
      [hoofdstuk 2 van de Wet rol werknemers bij Europese rechtspersonen][ref1] dan wel die krachtens
      [hoofdstuk 2 van die wet][ref2] optreedt als vertegenwoordiger bij een andere wijze van informatieverstrekking en
      raadpleging van werknemers.


      [ref1]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0018115
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '2'
  - number: '670.5'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen wegens het lidmaatschap van de werknemer van een vereniging
      van werknemers die krachtens haar statuten ten doel heeft de belangen van de leden als werknemer te behartigen dan
      wel wegens het verrichten van of deelnemen aan activiteiten ten behoeve van die vereniging, tenzij die activiteiten
      in de arbeidstijd van de werknemer worden verricht zonder toestemming van de werkgever.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: '670.6'
    text: |-
      De werkgever kan de arbeidsovereenkomst met de werknemer die daarvoor verlof heeft, niet opzeggen wegens het
      bijwonen van vergaderingen als bedoeld in [artikel 643][ref1]. Hetzelfde geldt indien tussen partijen geen
      overeenstemming over het verlof bestaat zolang de rechter omtrent het verlof niet heeft beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel643
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '643'
        afdeling: '3'
  - number: '670.7'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen wegens de omstandigheid dat de werknemer
      zijn recht op adoptieverlof of verlof voor het opnemen van een pleegkind als bedoeld in
      [artikel 3:2 van de Wet arbeid en zorg][ref1], op kort- en langdurend zorgverlof als bedoeld in
      [hoofdstuk 5 van de Wet arbeid en zorg][ref2], dan wel zijn recht op ouderschapsverlof als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref3] geldend maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '670.8'
    text: |-
      De werkgever kan de arbeidsovereenkomst met de in zijn onderneming werkzame werknemer niet opzeggen wegens de in
      [artikel 662, lid 2, onderdeel a][ref1], bedoelde overgang van die onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
        afdeling: '8'
  - number: '670.9'
    text: |-
      De werkgever kan de arbeidsovereenkomst niet opzeggen wegens de omstandigheid
      dat de werknemer geen instemming verleent aan het werken op zondag als bedoeld in
      [artikel 5:4, eerste lid, derde volzin, van de Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
  - number: '670.10'
    text: 'De termijn van twee jaren, bedoeld in lid 1, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670.10.a
    text: |-
      met de duur van de vertraging indien de werkgever de aangifte, bedoeld in
      [artikel 38, eerste lid, van de Ziektewet][ref1] later doet dan in [dat artikel][ref2] is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 670.10.b
    text: |-
      met de duur van de vertraging indien de aanvraag, bedoeld in
      [artikel 64, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] later wordt gedaan dan in of op
      grond van [dat artikel][ref2] is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
  - number: 670.10.c
    text: |-
      met de duur van de verlenging van de wachttijd, bedoeld in
      [artikel 19, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], indien die wachttijd op grond
      van [het zevende lid van dat artikel][ref2] wordt verlengd; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 670.10.d
    text: |-
      met de duur van het tijdvak dat het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 24, eerste lid][ref1], of [artikel 25, negende lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2]
      dan wel op grond van [artikel 71a, negende lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] heeft
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '670.11'
    text: |-
      Voor de toepassing van lid 4 en [artikel 670a lid 1][ref1] wordt tevens onder de SE-ondernemingsraad verstaan:
      het orgaan dat de werknemers vertegenwoordigt in een SE die haar statutaire zetel heeft in een andere lidstaat, en
      dat is ingesteld krachtens de bepalingen in het nationale recht van die lidstaat ter omzetting van de [richtlijn
      nr. 2001/86](32001L0086) van de Raad van de Europese Unie van 8 oktober 2001 tot aanvulling van het statuut van de
      Europese vennootschap met betrekking tot de rol van de werknemers (PbEG L 294).


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: '670.12'
    text: |-
      Voor de toepassing van het vierde lid en [artikel 670a lid 1][ref1] wordt tevens onder de SCE-ondernemingsraad
      verstaan: het orgaan dat de werknemers vertegenwoordigt in een SCE die haar statutaire zetel heeft in een andere
      lidstaat, en dat is ingesteld krachtens de bepalingen in het nationale recht van die lidstaat ter omzetting van
      de [richtlijn nr. 2003/72/EG](32003L0072) van de Raad van de Europese Unie van 22 juli 2003 tot aanvulling van het
      statuut van de Europese coöperatieve vennootschap met betrekking tot de rol van de werknemers (PbEG L 207).


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: '670.13'
    text: |-
      Van de leden 1 eerste zin en 3 kan slechts worden afgeweken bij collectieve arbeidsovereenkomst of bij regeling
      door of namens een daartoe bevoegd bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670
  - number: 670a.1
    text: |-
      De werkgever kan zonder voorafgaande toestemming van de kantonrechter de arbeidsovereenkomst niet opzeggen met een
      werknemer die:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
  - number: 670a.1.a
    text: |-
      geplaatst is op een kandidatenlijst voor een ondernemingsraad dan wel een personeelsvertegenwoordiging of
      korter dan twee jaar geleden lid is geweest van een ondernemingsraad, van een centrale ondernemingsraad,
      van een groepsondernemingsraad of van een commissie van die raden, van een personeelsvertegenwoordiging
      of van een bijzondere onderhandelingsgroep of een Europese ondernemingsraad, een SE-ondernemingsraad of
      een SCE-ondernemingsraad als bedoeld in de [Wet op de Europese ondernemingsraden][ref1] respectievelijk de
      [hoofdstukken 1][ref2] respectievelijk [2 van de Wet rol werknemers bij Europese rechtspersonen][ref3] dan wel die
      korter dan twee jaar geleden krachtens een van die wetten is opgetreden als vertegenwoordiger bij een andere wijze
      van informatieverstrekking en raadpleging van werknemers;


      [ref1]: https://wetten.overheid.nl/BWBR0008508
      [ref2]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0018115#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0008508
      - id: ref2
        bwb_id: BWBR0018115
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0018115
        hoofdstuk: '2'
  - number: 670a.1.b
    text: |-
      lid is van een voorbereidingscommissie van een ondernemingsraad, van een centrale ondernemingsraad of van een
      groepsondernemingsraad;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
  - number: 670a.1.c
    text: |-
      als deskundige werknemer als bedoeld in [artikel 13, eerste en tweede lid][ref1], of als deskundige persoon als
      bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref2] werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '13'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 670a.1.d
    text: |-
      een functionaris voor de gegevensbescherming als bedoeld in
      [artikel 62 van de Wet bescherming persoonsgegevens][ref1] werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel62
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '62'
  - number: 670a.2
    text: |-
      De toestemming van de kantonrechter wordt gevraagd bij verzoekschrift. De kantonrechter verleent de toestemming
      slechts indien de werkgever aannemelijk heeft gemaakt dat opzegging geen verband houdt met een omstandigheid als
      bedoeld in lid 1. Van de uitspraak staat geen hoger beroep of beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670a
  - number: 670b.1
    text: |-
      De [artikelen 670][ref1] en [670a][ref2] zijn niet van toepassing bij een opzegging gedurende de proeftijd of
      wegens een dringende reden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: 670b.2
    text: |-
      De [leden 1 tot en met 9 van artikel 670][ref1] en [artikel 670a][ref2] zijn niet van toepassing
      indien de werknemer schriftelijk met de opzegging instemt of indien de opzegging geschiedt wegens de
      beëindiging van de werkzaamheden van de onderneming of van het onderdeel van de onderneming, waarin de
      werknemer uitsluitend of in hoofdzaak werkzaam is. De opzegging wegens beëindiging van de werkzaamheden
      kan evenwel niet betreffen de werkneemster die zwangerschaps- of bevallingsverlof geniet als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 670b.3
    text: |-
      [Artikel 670, lid 1, aanhef en onder a][ref1], is niet van toepassing, indien de werknemer die in verband met
      ongeschiktheid ten gevolge van ziekte verhinderd is de bedongen arbeid te verrichten, zonder deugdelijke grond
      weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
  - number: 670b.3.a
    text: |-
      gevolg te geven aan door de werkgever of een door hem aangewezen deskundige gegeven redelijke voorschriften en
      mee te werken aan door de werkgever of een door hem aangewezen deskundige getroffen maatregelen om hem in staat te
      stellen de eigen of andere passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
  - number: 670b.3.b
    text: |-
      passende arbeid als bedoeld in [artikel 658a lid 4][ref1] te verrichten waartoe de werkgever hem in de gelegenheid
      stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel658a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 658a
        afdeling: '6'
  - number: 670b.3.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als
      bedoeld in [artikel 25, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] dan wel
      [artikel 71a, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel670b
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '672.1'
    text: |-
      Opzegging geschiedt tegen het einde van de maand, tenzij bij schriftelijke overeenkomst of door het gebruik een
      andere dag daarvoor is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.2'
    text: |-
      De door de werkgever in acht te nemen termijn van opzegging bedraagt bij een arbeidsovereenkomst die op de dag
      van opzegging:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: 672.2.a
    text: 'korter dan vijf jaar heeft geduurd: één maand;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: 672.2.b
    text: 'vijf jaar of langer, maar korter dan tien jaar heeft geduurd: twee maanden;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: 672.2.c
    text: 'tien jaar of langer, maar korter dan vijftien jaar heeft geduurd: drie maanden;'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: 672.2.d
    text: 'vijftien jaar of langer heeft geduurd: vier maanden.'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.3'
    text: De door de werknemer in acht te nemen termijn van opzegging bedraagt één maand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.4'
    text: |-
      Indien de toestemming bedoeld in [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945](onbekend)
      is verleend, wordt de door de werkgever in acht te nemen termijn van opzegging verkort met één maand, met dien
      verstande dat de resterende termijn van opzegging ten minste één maand bedraagt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.5'
    text: |-
      De termijn, bedoeld in lid 2, kan slechts worden verkort bij collectieve arbeidsovereenkomst of bij regeling door
      of namens een daartoe bevoegd bestuursorgaan. De termijn kan schriftelijk worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.6'
    text: |-
      Van de termijn, bedoeld in lid 3, kan schriftelijk worden afgeweken. De termijn van opzegging voor de werknemer
      mag bij verlenging niet langer zijn dan zes maanden en voor de werkgever niet korter dan het dubbele van die voor
      de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.7'
    text: |-
      Van lid 4 kan, voor zover het betreft de resterende termijn van opzegging van één maand, slechts bij collectieve
      arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele
      van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.8'
    text: |-
      Bij collectieve arbeidsovereenkomst of bij regeling door of namens een daartoe bevoegd bestuursorgaan, mag de
      termijn van opzegging, bedoeld in lid 6, tweede volzin, voor de werkgever worden verkort, mits de termijn niet
      korter is dan die voor de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
  - number: '672.9'
    text: |-
      Voor de toepassing van lid 2 worden arbeidsovereenkomsten geacht eenzelfde, niet onderbroken arbeidsovereenkomst te
      vormen in geval van herstel van de arbeidsovereenkomst ingevolge [artikel 682][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel672
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '674.1'
    text: De arbeidsovereenkomst eindigt door de dood van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
  - number: '674.2'
    text: |-
      Niettemin is de werkgever verplicht aan de nagelaten betrekkingen van de werknemer over de periode vanaf de dag na
      overlijden tot en met één maand na de dag van het overlijden, een uitkering te verlenen ten bedrage van het loon
      dat de werknemer laatstelijk rechtens toekwam.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
  - number: '674.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder nagelaten betrekkingen verstaan de langstlevende der echtgenoten
      dan wel geregistreerde partners van wie de werknemer niet duurzaam gescheiden leefde dan wel degene met wie
      de werknemer ongehuwd samenleefde, bij ontstentenis van deze de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond en bij ontstentenis van dezen degene met wie de werknemer in gezinsverband
      leefde en in wiens kosten van bestaan hij grotendeels voorzag. Van ongehuwd samenleven als bedoeld in de eerste zin
      is sprake indien twee ongehuwde personen een gezamenlijke huishouding voeren, met uitzondering van bloedverwanten
      in de eerste graad. Van een gezamenlijke huishouding als bedoeld in de tweede zin is sprake indien de betrokkenen
      hun hoofdverblijf hebben in dezelfde woning en zij blijk geven zorg te dragen voor elkaar door middel van het
      leveren van een bijdrage in de kosten van de huishouding dan wel op andere wijze in elkaars verzorging voorzien.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
  - number: '674.4'
    text: |-
      De overlijdensuitkering, bedoeld in lid 2, kan worden verminderd met het bedrag van de uitkering dat aan de
      nagelaten betrekkingen ter zake van het overlijden van de werknemer toekomt krachtens een wettelijk voorgeschreven
      ziekte- of arbeidsongeschiktheidsverzekering en krachtens de [Toeslagenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: '674.5'
    text: |-
      Lid 2 geldt niet indien de werknemer onmiddellijk voorafgaande aan het overlijden door toepassing van
      [artikel 629 lid 3][ref1], geen aanspraak had op loon als bedoeld in [artikel 629 lid 1][ref2] of indien
      ten gevolge van het toedoen van de werknemer geen aanspraak bestaat op een uitkering krachtens een wettelijk
      voorgeschreven ziekte- of arbeidsongeschiktheidsverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel629
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '629'
        afdeling: '2'
  - number: '674.6'
    text: Van dit artikel kan niet ten nadele van de nagelaten betrekkingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel674
  - number: '675'
    text: |-
      De arbeidsovereenkomst eindigt niet door de dood van de werkgever, tenzij uit de overeenkomst het tegendeel
      voortvloeit. Echter zijn zowel de erfgenamen van de werkgever als de werknemer bevoegd de arbeidsovereenkomst,
      voor een bepaalde tijd aangegaan, op te zeggen met inachtneming van de [artikelen 670][ref1], [670a][ref2] en
      [672][ref3], als ware zij aangegaan voor onbepaalde tijd. Wanneer de nalatenschap van de werkgever ingevolge
      [artikel 13 van Boek 4][ref4] wordt verdeeld, komt de bevoegdheid van de erfgenamen, bedoeld in de vorige zin, toe
      aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel672
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel675
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '676.1'
    text: |-
      Indien een proeftijd is bedongen, is ieder der partijen, zolang die tijd niet is verstreken, bevoegd de
      arbeidsovereenkomst met onmiddellijke ingang op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel676
  - number: '676.2'
    text: |-
      Bij een zodanige opzegging zijn de [artikelen 681][ref1] en [682][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel676
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '681'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '677.1'
    text: |-
      Ieder der partijen is bevoegd de arbeidsovereenkomst onverwijld op te zeggen om een dringende reden, onder
      gelijktijdige mededeling van die reden aan de wederpartij. De partij die opzegt zonder een dringende reden of
      zonder gelijktijdige mededeling van de dringende reden is schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel677
  - number: '677.2'
    text: De partij die opzegt tegen een eerdere dag dan tussen partijen geldt, is schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel677
  - number: '677.3'
    text: |-
      Eveneens is schadeplichtig de partij die door opzet of schuld aan de wederpartij een dringende reden heeft gegeven
      om de arbeidsovereenkomst onverwijld op te zeggen, indien de wederpartij van die bevoegdheid heeft gebruik gemaakt
      of de rechter op die grond krachtens [artikel 685][ref1] de arbeidsovereenkomst heeft ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: '677.4'
    text: |-
      Ingeval een der partijen schadeplichtig is, heeft de wederpartij de keus de in [artikel 680][ref1] genoemde
      gefixeerde schadevergoeding of een volledige schadevergoeding te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
        afdeling: '9'
  - number: '677.5'
    text: |-
      Het niet in acht nemen van [artikel 670 leden 1 tot en met 9][ref1], of van [artikel 670a][ref2] maakt de
      werkgever niet schadeplichtig. De werknemer kan in die gevallen gedurende twee maanden na de opzegging van de
      arbeidsovereenkomst een beroep doen op de vernietigingsgrond. Het beroep op de vernietigingsgrond geschiedt door
      kennisgeving aan de werkgever. [Artikel 55 van Boek 3][ref3] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel677
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '678.1'
    text: |-
      Voor de werkgever worden als dringende redenen in de zin van [lid 1 van artikel 677][ref1] beschouwd zodanige
      daden, eigenschappen of gedragingen van de werknemer, die ten gevolge hebben dat van de werkgever redelijkerwijze
      niet kan gevergd worden de arbeidsovereenkomst te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '678.2'
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.a
    text: |-
      wanneer de werknemer bij het sluiten van de overeenkomst de werkgever heeft misleid door het vertonen van valse of
      vervalste getuigschriften, of deze opzettelijk valse inlichtingen heeft gegeven omtrent de wijze waarop zijn vorige
      arbeidsovereenkomst is geëindigd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.b
    text: |-
      wanneer hij in ernstige mate de bekwaamheid of geschiktheid blijkt te missen tot de arbeid waarvoor hij zich heeft
      verbonden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.c
    text: wanneer hij zich ondanks waarschuwing overgeeft aan dronkenschap of ander liederlijk gedrag;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.d
    text: |-
      wanneer hij zich schuldig maakt aan diefstal, verduistering, bedrog of andere misdrijven, waardoor hij het
      vertrouwen van de werkgever onwaardig wordt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.e
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medewerknemers mishandelt, grovelijk beledigt
      of op ernstige wijze bedreigt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.f
    text: |-
      wanneer hij de werkgever, diens familieleden of huisgenoten, of zijn medewerknemers verleidt of tracht te verleiden
      tot handelingen, strijdig met de wetten of de goede zeden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.g
    text: |-
      wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, eigendom van de werkgever beschadigt of aan ernstig
      gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.h
    text: wanneer hij opzettelijk, of ondanks waarschuwing roekeloos, zich zelf of anderen aan ernstig gevaar blootstelt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.i
    text: |-
      wanneer hij bijzonderheden aangaande de huishouding of het bedrijf van de werkgever, die hij behoorde geheim te
      houden, bekendmaakt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.j
    text: |-
      wanneer hij hardnekkig weigert te voldoen aan redelijke bevelen of opdrachten, hem door of namens de werkgever
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.k
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt, welke de arbeidsovereenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: 678.2.l
    text: wanneer hij door opzet of roekeloosheid buiten staat geraakt of blijft de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
  - number: '678.3'
    text: |-
      Bedingen waarbij aan de werkgever de beslissing wordt overgelaten of er een dringende reden in de zin van
      [artikel 677 lid 1][ref1] aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel678
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '679.1'
    text: |-
      Voor de werknemer worden als dringende redenen in de zin van [artikel 677 lid 1][ref1] beschouwd zodanige
      omstandigheden, die ten gevolge hebben dat van de werknemer redelijkerwijze niet kan gevergd worden de
      arbeidsovereenkomst te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '679.2'
    text: 'Dringende redenen zullen onder andere aanwezig geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.a
    text: |-
      wanneer de werkgever de werknemer, diens familieleden of huisgenoten mishandelt, grovelijk beledigt of op ernstige
      wijze bedreigt, of gedoogt dat dergelijke handelingen door een van zijn huisgenoten of ondergeschikten worden
      gepleegd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.b
    text: |-
      wanneer hij de werknemer, diens familieleden of huisgenoten verleidt of tracht te verleiden tot handelingen,
      strijdig met de wetten of de goede zeden, of gedoogt dat een dergelijke verleiding of poging tot verleiding door
      een van zijn huisgenoten of ondergeschikten worden gepleegd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.c
    text: wanneer hij het loon niet op de daarvoor bepaalde tijd voldoet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.d
    text: wanneer hij, waar kost en inwoning overeengekomen zijn, niet op behoorlijke wijze daarin voorziet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.e
    text: |-
      wanneer hij de werknemer wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, geen
      voldoende arbeid verschaft;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.f
    text: |-
      wanneer hij de werknemer wiens loon afhankelijk van de uitkomsten van de te verrichten arbeid is vastgesteld, de
      bedongen hulp niet of niet in behoorlijke mate verschaft;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.g
    text: wanneer hij op andere wijze grovelijk de plichten veronachtzaamt welke de arbeidsovereenkomst hem oplegt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.h
    text: |-
      wanneer hij, zonder dat de aard van de arbeidsovereenkomst dit medebrengt, de werknemer niettegenstaande diens
      weigering gelast arbeid in het bedrijf van een andere werkgever te verrichten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.i
    text: |-
      wanneer de voortduring van de arbeidsovereenkomst voor de werknemer zou zijn verbonden met ernstige gevaren
      voor leven, gezondheid, zedelijkheid of goede naam, die niet duidelijk waren ten tijde van het sluiten van de
      arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: 679.2.j
    text: |-
      wanneer de werknemer door ziekte of andere oorzaken zonder zijn toedoen buiten staat geraakt de bedongen arbeid
      te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
  - number: '679.3'
    text: |-
      Bedingen waarbij aan de werknemer de beslissing wordt overgelaten of er een dringende reden in de zin van
      [artikel 677 lid 1][ref1] aanwezig is, zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel679
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '680.1'
    text: |-
      De gefixeerde schadevergoeding, bedoeld in [artikel 677 lid 4][ref1], is gelijk aan het bedrag van het in geld
      vastgesteld loon voor de tijd, dat de arbeidsovereenkomst bij regelmatige opzegging had behoren voort te duren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '680.2'
    text: |-
      Is het loon van de werknemer, hetzij voor het geheel, hetzij gedeeltelijk, niet naar tijdruimte vastgesteld, dan
      geldt de maatstaf van [artikel 618][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel618
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '618'
        afdeling: '2'
  - number: '680.3'
    text: |-
      Elk beding waarbij ten behoeve van de werknemer een gefixeerde schadevergoeding tot een lager bedrag wordt
      bedongen, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
  - number: '680.4'
    text: Bij schriftelijke overeenkomst mag een gefixeerde schadevergoeding tot een hoger bedrag worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
  - number: '680.5'
    text: |-
      De rechter is bevoegd de gefixeerde schadevergoeding, zo deze hem met het oog op de omstandigheden van het geval
      bovenmatig voorkomt, op een kleinere som te bepalen, doch niet op minder dan het in geld vastgesteld loon voor de
      duur van de opzeggingstermijn ingevolge [artikel 672][ref1], noch op minder dan het in geld vastgesteld loon voor
      3 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
  - number: '680.6'
    text: |-
      Indien de door de werknemer verschuldigde gefixeerde schadevergoeding meer bedraagt dan het in geld vastgesteld
      loon voor een maand of de door de werkgever verschuldigde gefixeerde schadevergoeding meer bedraagt dan het in geld
      vastgesteld loon voor 3 maanden, kan de rechter toestaan dat de schadevergoeding op door hem te bepalen wijze in
      termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
  - number: '680.7'
    text: |-
      Over het bedrag van de verschuldigde gefixeerde schadevergoeding is de wettelijke rente verschuldigd, te rekenen
      van de dag waarop de arbeidsovereenkomst is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680
  - number: 680a
    text: |-
      De rechter is bevoegd een vordering tot doorbetaling van loon die gegrond is op de vernietigbaarheid van de
      opzegging van de arbeidsovereenkomst te matigen, indien toewijzing in de gegeven omstandigheden tot onaanvaardbare
      gevolgen zou leiden, doch op niet minder dan het in geld vastgestelde loon voor de duur van de opzegtermijn
      ingevolge [artikel 672][ref1] noch op minder dan het in geld vastgestelde loon voor drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel680a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
        afdeling: '9'
  - number: '681.1'
    text: |-
      Indien een van de partijen de arbeidsovereenkomst, al of niet met inachtneming van de voor de opzegging geldende
      bepalingen, kennelijk onredelijk opzegt, kan de rechter steeds aan de wederpartij een schadevergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: '681.2'
    text: 'Opzegging van de arbeidsovereenkomst door de werkgever zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.2.a
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.2.b
    text: |-
      wanneer, mede in aanmerking genomen de voor de werknemer getroffen voorzieningen en de voor hem bestaande
      mogelijkheden om ander passend werk te vinden, de gevolgen van de opzegging voor hem te ernstig zijn in
      vergelijking met het belang van de werkgever bij de opzegging;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.2.c
    text: |-
      wanneer deze geschiedt in verband met een verhindering van de werknemer om de bedongen arbeid te verrichten als
      bedoeld in [artikel 670 lid 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
  - number: 681.2.d
    text: |-
      wanneer deze geschiedt in afwijking van een in de bedrijfstak of de onderneming krachtens wettige regeling of
      gebruik geldende getalsverhouding- of anciënniteitsregeling, tenzij hiervoor zwaarwichtige gronden aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.2.e
    text: |-
      wanneer deze geschiedt wegens het enkele feit dat de werknemer met een beroep op een ernstig gewetensbezwaar
      weigert de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: '681.3'
    text: 'Opzegging van de arbeidsovereenkomst door de werknemer zal onder andere kennelijk onredelijk geacht kunnen worden:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.3.a
    text: wanneer deze geschiedt zonder opgave van redenen of onder opgave van een voorgewende of valse reden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: 681.3.b
    text: |-
      wanneer de gevolgen van de opzegging voor de werkgever te ernstig zijn in vergelijking met het belang van de
      werknemer bij de opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: '681.4'
    text: |-
      Een beding waarbij aan een van de partijen de beslissing wordt overgelaten of de arbeidsovereenkomst al of niet
      kennelijk onredelijk is opgezegd, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel681
  - number: '682.1'
    text: |-
      De rechter kan de werkgever die schadeplichtig is geworden volgens [artikel 677][ref1] of die de
      arbeidsovereenkomst kennelijk onredelijk opzegt, ook veroordelen de arbeidsovereenkomst te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel682
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '682.2'
    text: |-
      Indien de rechter een zodanige veroordeling uitspreekt, kan hij bepalen voor of op welk tijdstip de
      arbeidsovereenkomst moet worden hersteld en kan hij voorzieningen treffen omtrent de rechtsgevolgen van de
      onderbreking.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel682
  - number: '682.3'
    text: |-
      De rechter kan in het vonnis, houdende de veroordeling tot herstel van de arbeidsovereenkomst, bepalen dat de
      verplichting tot herstel vervalt door betaling van een in het vonnis vastgestelde afkoopsom. Is in het vonnis
      geen afkoopsom vastgesteld, dan zal de rechter deze op verzoek van de werkgever alsnog vaststellen. Een zodanig
      verzoek schorst de tenuitvoerlegging van het vonnis, voor zover het betreft de veroordeling tot herstel van de
      arbeidsovereenkomst, totdat op het verzoek is beslist, met dien verstande dat de werkgever in ieder geval verplicht
      blijft gedurende de schorsing het loon te betalen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel682
  - number: '682.4'
    text: |-
      De rechter stelt de hoogte van de afkoopsom met het oog op de omstandigheden van het geval naar billijkheid vast;
      hij kan toestaan dat de afkoopsom op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel682
  - number: '682.5'
    text: |-
      Indien een afkoopsom wegens het niet naleven van een verplichting om een arbeidsovereenkomst te herstellen op
      andere wijze is vastgesteld, kan de rechter het bedrag van de verschuldigde afkoopsom op verzoek van de meest
      gerede partij wijzigen in zodanig bedrag als hem met het oog op de omstandigheden van het geval billijk zal
      voorkomen en kan hij toelaten dat de afkoopsom op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel682
  - number: '683.1'
    text: |-
      Iedere rechtsvordering krachtens [artikelen 677 lid 4][ref1], [681 lid 1][ref2] en [682 lid 1][ref3], verjaart na
      verloop van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel682
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel683
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '681'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '682'
        afdeling: '9'
  - number: '683.2'
    text: |-
      Iedere rechtsvordering van de werknemer in verband met de vernietiging van de opzegging van de arbeidsovereenkomst
      krachtens [artikel 677 lid 5][ref1], verjaart na verloop van zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel683
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '684.1'
    text: |-
      Indien de arbeidsovereenkomst is aangegaan voor langer dan vijf jaren of voor de duur van het leven van een
      bepaalde persoon, is niettemin de werknemer bevoegd, van het tijdstip waarop vijf jaren sedert haar aanvang zijn
      verlopen, haar op te zeggen met inachtneming van een termijn van zes maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel684
  - number: '684.2'
    text: Van dit artikel kan niet ten nadele van de werknemer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel684
  - number: '685.1'
    text: |-
      Ieder der partijen is te allen tijde bevoegd zich tot de kantonrechter te wenden met het verzoek de
      arbeidsovereenkomst wegens gewichtige redenen te ontbinden. Elk beding waarbij deze bevoegdheid wordt uitgesloten
      of beperkt, is nietig. De kantonrechter kan het verzoek slechts inwilligen indien hij zich ervan heeft vergewist of
      het verzoek verband houdt met het bestaan van een opzegverbod als bedoeld in de [artikelen 647][ref1], [648][ref2],
      [670][ref3] en [670a][ref4] of enig ander verbod tot opzegging van de arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel647
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel648
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel670
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel670a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '647'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '648'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '670'
        afdeling: '9'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 670a
        afdeling: '9'
  - number: '685.2'
    text: |-
      Als gewichtige redenen worden beschouwd omstandigheden die een dringende reden als bedoeld in
      [artikel 677 lid 1][ref1] zouden hebben opgeleverd indien de arbeidsovereenkomst deswege onverwijld opgezegd
      zou zijn, alsook veranderingen in de omstandigheden, welke van dien aard zijn, dat de arbeidsovereenkomst
      billijkheidshalve dadelijk of na korte tijd behoort te eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '685.3'
    text: |-
      Het verzoek wordt gedaan aan de ingevolge de [artikelen 99][ref1], [100][ref2], en
      [107 tot en met 109 van het Wetboek van Burgerlijke Rechtsvordering][ref3] bevoegde kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel107
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '100'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '107'
  - number: '685.4'
    text: |-
      Het verzoekschrift vermeldt de plaats waar de arbeid gewoonlijk wordt verricht, alsmede de naam en de woonplaats of
      bij gebreke van een woonplaats in Nederland het werkelijk verblijf van de wederpartij.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.5'
    text: |-
      De kantonrechter kan, indien het verzoek verknocht is aan een zaak die tussen dezelfde personen reeds voor een
      andere rechter aanhangig is, de verwijzing naar die andere rechter bevelen. De griffier zendt een afschrift van de
      beschikking, alsmede het verzoekschrift en de overige stukken van het geding ter verdere behandeling aan de rechter
      naar wie is verwezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.6'
    text: De behandeling vangt niet later aan dan in de vierde week volgende op die waarin het verzoekschrift is ingediend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.7'
    text: Indien de rechter het verzoek inwilligt, bepaalt hij op welk tijdstip de arbeidsovereenkomst eindigt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.8'
    text: |-
      Indien de rechter het verzoek inwilligt wegens veranderingen in de omstandigheden kan hij, zo hem dat met het
      oog op de omstandigheden van het geval billijk voorkomt, aan een van de partijen ten laste van de wederpartij een
      vergoeding toekennen; hij kan toestaan dat de vergoeding op door hem te bepalen wijze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.9'
    text: |-
      Alvorens een ontbinding waaraan een vergoeding verbonden wordt, uit te spreken, stelt de rechter de partijen van
      zijn voornemen in kennis en stelt hij een termijn, binnen welke de verzoeker de bevoegdheid heeft zijn verzoek in
      te trekken. Indien de verzoeker dat doet, zal de rechter alleen een beslissing geven omtrent de proceskosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.10'
    text: |-
      Lid 9 is van overeenkomstige toepassing indien de rechter voornemens is een ontbinding uit te spreken zonder
      daaraan een door de verzoeker verzochte vergoeding te verbinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '685.11'
    text: Tegen een beschikking krachtens dit artikel kan hoger beroep noch cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel685
  - number: '686'
    text: |-
      De bepalingen van deze afdeling sluiten voor geen van beide partijen de mogelijkheid uit van ontbinding wegens een
      tekortkoming in de nakoming van de overeenkomst en van schadevergoeding. De ontbinding kan slechts door de rechter
      worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel686
  - number: '687'
    text: |-
      De overeenkomst van handelsvertegenwoordiging is een arbeidsovereenkomst waarbij de ene partij, de
      handelsvertegenwoordiger, zich tegenover de andere partij, de patroon, verbindt tegen loon dat geheel of
      gedeeltelijk uit provisie bestaat, bij de totstandkoming van overeenkomsten bemiddeling te verlenen, en deze
      eventueel in naam van de patroon te sluiten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel687
  - number: '688.1'
    text: |-
      Op de overeenkomst van handelsvertegenwoordiging zijn de [artikelen 426][ref1], [429][ref2],
      [430 leden 2 tot en met 4][ref3], [431][ref4], [432][ref5], [433][ref6] en [434][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel429
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel430
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel431
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel433
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel434
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '429'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '432'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '434'
        afdeling: '4'
  - number: '688.2'
    text: |-
      Van de [artikelen 426 lid 2][ref1], [429][ref2], [430 leden 2 tot en met 4][ref3], [431 lid 2][ref4] en [433][ref5]
      kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel429
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel430
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel431
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel433
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '429'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
  - number: '688.3'
    text: |-
      Van de [artikelen 432 lid 3][ref1] en [434][ref2] kan niet ten nadele van de handelsvertegenwoordiger worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel434
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '432'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '434'
        afdeling: '4'
  - number: '688.4'
    text: |-
      Van de [artikelen 426 lid 1][ref1] en [431 lid 1][ref2] kan slechts schriftelijk ten nadele van de
      handelsvertegenwoordiger worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel431
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel688
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '431'
        afdeling: '4'
  - number: '689'
    text: |-
      In afwijking van het bepaalde in [artikel 680 lid 2][ref1] wordt voor de vaststelling van de gefixeerde
      schadevergoeding, bedoeld in [artikel 677 lid 4][ref2], rekening gehouden met de in de voorafgaande tijd verdiende
      provisie en met alle andere ter zake in acht te nemen factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel680
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel689
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '680'
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '677'
        afdeling: '9'
  - number: '690'
    text: |-
      De uitzendovereenkomst is de arbeidsovereenkomst waarbij de werknemer door de werkgever, in het kader van de
      uitoefening van het beroep of bedrijf van de werkgever ter beschikking wordt gesteld van een derde om krachtens een
      door deze aan de werkgever verstrekte opdracht arbeid te verrichten onder toezicht en leiding van de derde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel690
  - number: '691.1'
    text: |-
      Op de uitzendovereenkomst is [artikel 668a][ref1] eerst van toepassing zodra de werknemer in meer dan 26 weken
      arbeid heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel668a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 668a
        afdeling: '9'
  - number: '691.2'
    text: |-
      In de uitzendovereenkomst kan schriftelijk worden bedongen dat die overeenkomst van rechtswege eindigt doordat
      de terbeschikkingstelling van de werknemer door de werkgever aan de derde als bedoeld in [artikel 690][ref1] op
      verzoek van die derde ten einde komt. Indien een beding als bedoeld in de vorige volzin in de uitzendovereenkomst
      is opgenomen, kan de werknemer die overeenkomst onverwijld opzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
        afdeling: '11'
  - number: '691.3'
    text: |-
      Een beding als bedoeld in lid 2 verliest zijn kracht indien de werknemer in meer dan 26 weken arbeid voor de
      werkgever heeft verricht. Na het verstrijken van deze termijn vervalt de bevoegdheid van de werknemer tot opzegging
      als bedoeld in lid 2.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
  - number: '691.4'
    text: |-
      Voor de berekening van de termijnen, bedoeld in de leden 1 en 3, worden perioden waarin arbeid wordt verricht die
      elkaar opvolgen met tussenpozen van minder dan een jaar mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
  - number: '691.5'
    text: |-
      Voor de berekening van de termijnen, bedoeld in de leden 1 en 3, worden perioden waarin voor verschillende
      werkgevers arbeid wordt verricht die ten aanzien van de verrichte arbeid redelijkerwijze geacht moeten worden
      elkanders opvolger te zijn mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
  - number: '691.6'
    text: |-
      Dit artikel is niet van toepassing op de uitzendovereenkomst waarbij de werkgever en de derde in een groep zijn
      verbonden als bedoeld in [artikel 24b van Boek 2][ref1] dan wel de één een dochtermaatschappij is van de ander als
      bedoeld in [artikel 24a van Boek 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '691.7'
    text: |-
      Van de termijnen bedoeld in de leden 1, 3 en 4 en van lid 5 kan slechts bij collectieve arbeidsovereenkomst of bij
      regeling door of namens een daartoe bevoegd bestuursorgaan worden afgeweken ten nadele van de werknemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel691
  - number: '750.1'
    text: |-
      Aanneming van werk is de overeenkomst waarbij de ene partij, de aannemer, zich jegens de andere partij, de
      opdrachtgever, verbindt om buiten dienstbetrekking een werk van stoffelijke aard tot stand te brengen en op te
      leveren, tegen een door de opdrachtgever te betalen prijs in geld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel750
  - number: '750.2'
    text: |-
      Bestaat de tegenprestatie niet of niet geheel in geld, dan vindt deze titel toepassing, voor zover de aard van de
      tegenprestatie zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel750
  - number: '751'
    text: |-
      De aannemer is bevoegd het werk onder zijn leiding door anderen te doen uitvoeren, en ten aanzien van onderdelen
      ook de leiding aan anderen over te laten, zulks onverminderd zijn aansprakelijkheid voor de deugdelijke nakoming
      van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel751
  - number: '752.1'
    text: |-
      Indien de prijs bij het sluiten van de overeenkomst niet is bepaald of slechts een richtprijs is bepaald, is de
      opdrachtgever een redelijke prijs verschuldigd. Bij de bepaling van de prijs wordt rekening gehouden met de door de
      aannemer ten tijde van het sluiten van de overeenkomst gewoonlijk bedongen prijzen en met de door hem ter zake van
      de vermoedelijke prijs gewekte verwachtingen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel752
  - number: '752.2'
    text: |-
      Indien een richtprijs was bepaald, zal deze richtprijs met niet meer dan 10% mogen worden overschreden, tenzij
      de aannemer de opdrachtgever zo tijdig mogelijk voor de waarschijnlijkheid van een verdere overschrijding heeft
      gewaarschuwd, om hem de gelegenheid te geven het werk alsnog te beperken of te vereenvoudigen. De aannemer zal
      binnen de grenzen van het redelijke aan zulke beperking of vereenvoudiging moeten meewerken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel752
  - number: '752.3'
    text: |-
      Lid 2 is van overeenkomstige toepassing op aannemingen van werk waarbij de prijs afhankelijk is gesteld van de bij
      de overeenkomst geschatte tijdsduur voor de uitvoering van het werk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel752
  - number: '753.1'
    text: |-
      Indien na het sluiten van de overeenkomst kostenverhogende omstandigheden ontstaan of aan het licht komen zonder
      dat zulks aan de aannemer kan worden toegerekend, zal de rechter op vordering van de aannemer de overeengekomen
      prijs geheel of gedeeltelijk aan de kostenverhoging kunnen aanpassen, mits de aannemer bij het bepalen van de prijs
      geen rekening heeft behoeven te houden met de kans op zulke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel753
  - number: '753.2'
    text: |-
      De aannemer mag de prijs zonder tussenkomst van de rechter aanpassen, indien de kostenverhoging het gevolg is van
      door de opdrachtgever verschafte onjuiste gegevens welke voor de prijsbepaling van belang zijn, tenzij de aannemer
      de onjuistheid der gegevens vóór het vaststellen van de prijs had behoren te ontdekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel753
  - number: '753.3'
    text: |-
      Het in de leden 1 en 2 bepaalde geldt slechts indien de aannemer de opdrachtgever zo spoedig mogelijk voor de
      noodzaak van een prijsverhoging heeft gewaarschuwd, opdat deze tijdig hetzij gebruik kan maken van het hem in
      [artikel 764][ref1] toegekende recht, hetzij een voorstel kan doen tot beperking of vereenvoudiging van het werk.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel764
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel753
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '764'
        afdeling: '1'
  - number: '754'
    text: |-
      De aannemer is bij het aangaan of het uitvoeren van de overeenkomst verplicht de opdrachtgever te waarschuwen voor
      onjuistheden in de opdracht voor zover hij deze kende of redelijkerwijs behoorde te kennen. Hetzelfde geldt in
      geval van gebreken en ongeschiktheid van zaken afkomstig van de opdrachtgever, daaronder begrepen de grond waarop
      de opdrachtgever een werk laat uitvoeren, alsmede fouten of gebreken in door de opdrachtgever verstrekte plannen,
      tekeningen, berekeningen, bestekken of uitvoeringsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel754
  - number: '755'
    text: |-
      In geval van door de opdrachtgever gewenste toevoegingen of veranderingen in het overeengekomen werk kan de
      aannemer slechts dan een verhoging van de prijs vorderen, wanneer hij de opdrachtgever tijdig heeft gewezen op
      de noodzaak van een daaruit voortvloeiende prijsverhoging, tenzij de opdrachtgever die noodzaak uit zichzelf had
      moeten begrijpen. Van deze bepaling kan niet ten nadele van de opdrachtgever worden afgeweken, behoudens bij een
      standaardregeling als bedoeld in [artikel 214 van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel755
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '756.1'
    text: |-
      Indien reeds vóór de vastgestelde tijd van oplevering waarschijnlijk wordt dat het werk niet op tijd of niet
      behoorlijk zal worden opgeleverd, kan de rechter de overeenkomst op vordering van de opdrachtgever geheel of
      gedeeltelijk ontbinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel756
  - number: '756.2'
    text: |-
      Indien reeds vóór de oplevering waarschijnlijk wordt dat de opdrachtgever niet op tijd of niet behoorlijk aan
      zijn verplichtingen zal voldoen, of dat de aannemer de overeenkomst niet zal kunnen uitvoeren ten gevolge van een
      omstandigheid die hem niet kan worden toegerekend, kan de rechter de overeenkomst op vordering van de aannemer
      geheel of gedeeltelijk ontbinden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel756
  - number: '756.3'
    text: |-
      De rechter bepaalt de gevolgen van de ontbinding; hij kan de ontbinding ook doen afhangen van door hem te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel756
  - number: '757.1'
    text: |-
      Wordt de uitvoering van het werk onmogelijk doordat de zaak waarop of waaraan het werk moet worden uitgevoerd,
      tenietgaat of verloren raakt zonder dat dit aan de aannemer kan worden toegerekend, dan is de aannemer gerechtigd
      tot een evenredig deel van de vastgestelde prijs op grondslag van de reeds verrichte arbeid en gemaakte kosten.
      In geval van opzet of grove schuld van de opdrachtgever is de aannemer gerechtigd tot een bedrag berekend
      overeenkomstig het bepaalde in [artikel 764 lid 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel764
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel757
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '764'
        afdeling: '1'
  - number: '757.2'
    text: |-
      Bevond de zaak zich echter in het geval, bedoeld in het vorige lid, onder de aannemer, dan is de opdrachtgever tot
      geen enkele vergoeding gehouden, tenzij het tenietgaan of verloren raken aan zijn schuld was te wijten, in welk
      geval het vorige lid onverminderd toepassing vindt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel757
  - number: '758.1'
    text: |-
      Indien de aannemer te kennen heeft gegeven dat het werk klaar is om te worden opgeleverd en de opdrachtgever het
      werk niet binnen een redelijke termijn keurt en al dan niet onder voorbehoud aanvaardt dan wel onder aanwijzing
      van de gebreken weigert, wordt de opdrachtgever geacht het werk stilzwijgend te hebben aanvaard. Na de aanvaarding
      wordt het werk als opgeleverd beschouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel758
  - number: '758.2'
    text: |-
      Na oplevering is het werk voor risico van de opdrachtgever. Derhalve blijft hij de prijs verschuldigd, ongeacht
      tenietgaan of achteruitgang van het werk door een oorzaak die niet aan de aannemer kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel758
  - number: '758.3'
    text: |-
      De aannemer is ontslagen van de aansprakelijkheid voor gebreken die de opdrachtgever op het tijdstip van oplevering
      redelijkerwijs had moeten ontdekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel758
  - number: '759.1'
    text: |-
      Indien het werk na oplevering gebreken vertoont waarvoor de aannemer aansprakelijk is, moet de opdrachtgever,
      tenzij zulks in verband met de omstandigheden niet van hem kan worden gevergd, aan de aannemer de gelegenheid
      geven de gebreken binnen een redelijke termijn weg te nemen, onverminderd de aansprakelijkheid van de aannemer voor
      schade ten gevolge van de gebrekkige oplevering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel759
  - number: '759.2'
    text: |-
      De opdrachtgever kan vorderen dat de aannemer de gebreken binnen redelijke termijn wegneemt, tenzij de kosten
      van herstel in geen verhouding zouden staan tot het belang van de opdrachtgever bij herstel in plaats van
      schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel759
  - number: '760.1'
    text: |-
      De gevolgen van een ondeugdelijke uitvoering van het werk, die te wijten is aan gebreken of ongeschiktheid van door
      de aannemer gebruikte materialen of hulpmiddelen, komen voor rekening van de aannemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel760
  - number: '760.2'
    text: |-
      Is de ondeugdelijke uitvoering echter te wijten aan gebreken of ongeschiktheid van zaken afkomstig van de
      opdrachtgever, daaronder begrepen de grond waarop hij een werk laat uitvoeren, dan komen de gevolgen voor zijn
      rekening, voor zover de aannemer niet zijn in [artikel 754][ref1] bedoelde waarschuwingsplicht heeft geschonden of
      anderszins met betrekking tot deze gebreken in deskundigheid of zorgvuldigheid tekort is geschoten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel754
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel760
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '754'
        afdeling: '1'
  - number: '760.3'
    text: |-
      Lid 2 is van overeenkomstige toepassing in geval van fouten of gebreken in door de opdrachtgever verstrekte
      plannen, tekeningen, berekeningen, bestekken of uitvoeringsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel760
  - number: '761.1'
    text: |-
      Elke rechtsvordering wegens een gebrek in het opgeleverde werk verjaart door verloop van twee jaren nadat
      de opdrachtgever ter zake heeft geprotesteerd. Indien de opdrachtgever de aannemer een termijn heeft gesteld
      waarbinnen deze het gebrek zal kunnen wegnemen, begint de verjaring pas te lopen bij het einde van die termijn, of
      zoveel eerder als de aannemer te kennen heeft gegeven het gebrek niet te zullen herstellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel761
  - number: '761.2'
    text: |-
      De rechtsvordering verjaart in ieder geval door verloop van twintig jaren na de oplevering in geval van aanneming
      van bouwwerken en door verloop van tien jaren na de oplevering in alle andere gevallen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel761
  - number: '761.3'
    text: |-
      Indien de rechtsvordering krachtens het bepaalde in de vorige leden zou verjaren tussen het tijdstip waarop de
      aannemer aan de opdrachtgever heeft medegedeeld dat hij het gebrek zal onderzoeken of herstellen, en het tijdstip
      waarop hij het onderzoek en de pogingen tot herstel kennelijk als beëindigd beschouwt, wordt de verjaringstermijn
      verlengd overeenkomstig [artikel 320 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel320
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel761
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '320'
  - number: '761.4'
    text: |-
      De leden 1–3 laten onverlet de bevoegdheid van de opdrachtgever om aan een vordering tot betaling van de prijs
      zijn recht op vermindering daarvan door gedeeltelijke ontbinding van de overeenkomst of op schadevergoeding tegen
      te werpen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel761
  - number: '762'
    text: |-
      De aansprakelijkheid van de aannemer voor hem bekende verborgen gebreken die hij heeft verzwegen, kan niet worden
      uitgesloten of beperkt, noch kan zij aan kortere verjaringstermijnen worden onderworpen dan die voorzien in
      [artikel 761][ref1]. Verzwijging door degenen die de aannemer met de leiding over de uitvoering van het werk heeft
      belast, wordt gelijkgesteld met verzwijging door de aannemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel761
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel762
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '761'
        afdeling: '1'
  - number: '763'
    text: |-
      Indien de aannemer na het sluiten van de overeenkomst overlijdt of duurzaam arbeidsongeschikt wordt, kan ieder der
      partijen de overeenkomst beëindigen, voor zover zij, gezien de aard van de overeenkomst, aan het overlijden of de
      duurzame arbeidsongeschiktheid een redelijk belang bij beëindiging kan ontlenen. Voor de reeds verrichte arbeid en
      gemaakte kosten is de opdrachtgever een naar redelijkheid en met inachtneming van alle omstandigheden te bepalen
      vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel763
  - number: '764.1'
    text: De opdrachtgever is te allen tijde bevoegd de overeenkomst geheel of gedeeltelijk op te zeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel764
  - number: '764.2'
    text: |-
      In geval van zulke opzegging zal hij de voor het gehele werk geldende prijs moeten betalen, verminderd met de
      besparingen die voor de aannemer uit de opzegging voortvloeien, tegen aflevering door de aannemer van het reeds
      voltooide werk. Indien de prijs afhankelijk was gesteld van de werkelijk door de aannemer te maken kosten, wordt de
      door de opdrachtgever verschuldigde prijs berekend op grondslag van de gemaakte kosten, de verrichte arbeid en de
      winst die de aannemer over het gehele werk zou hebben gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel764
  - number: '765'
    text: |-
      Deze afdeling is van toepassing op aanneming van werk die strekt tot de bouw van een woning, bestaande uit een
      onroerende zaak of bestanddeel daarvan, in opdracht van een natuurlijk persoon die niet handelt in de uitoefening
      van een beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel765
  - number: '766.1'
    text: |-
      Een overeenkomst als bedoeld in [artikel 765][ref1] wordt schriftelijk aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel765
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel766
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '765'
        afdeling: '2'
  - number: '766.2'
    text: |-
      De tussen partijen opgemaakte akte of een afschrift daarvan moet aan de opdrachtgever ter hand worden gesteld,
      desverlangd tegen afgifte aan de aannemer van een gedateerd ontvangstbewijs. Gedurende drie dagen na deze
      terhandstelling heeft de opdrachtgever het recht de overeenkomst te ontbinden. Komt, nadat de opdrachtgever van
      dit recht gebruik gemaakt heeft, binnen zes maanden tussen dezelfde partijen met betrekking tot dezelfde te bouwen
      woning opnieuw een overeenkomst tot stand, dan ontstaat het recht niet opnieuw.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel766
  - number: '766.3'
    text: |-
      De leden 1–2 zijn niet van toepassing indien de overeenkomst strekt tot de bouw van een woning op grond die de
      opdrachtgever reeds toebehoort, en de overeenkomst niet met de koop van deze grond in verband staat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel766
  - number: '767'
    text: |-
      De opdrachtgever kan slechts worden verplicht tot het doen van betalingen die, althans bij benadering,
      overeenstemmen met de voortgang van de bouw of met de waarde van de aan hem overgedragen goederen, behoudens dat
      kan worden bedongen dat hij ter verzekering van de nakoming van zijn verplichtingen een bedrag dat niet hoger is
      dan 10% van de aanneemsom, in depot stort bij een notaris dan wel voor dit bedrag vervangende zekerheid stelt. Het
      teveel betaalde geldt als onverschuldigd betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel767
  - number: '768.1'
    text: |-
      De opdrachtgever kan, zonder beroep te doen op [artikel 262 van Boek 6][ref1] en onder behoud van zijn recht op
      oplevering, maximaal 5% van de aanneemsom inhouden op de laatste termijn of laatste termijnen en dit bedrag in
      plaats van aan de aannemer te betalen, in depot storten bij een notaris.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel262
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel768
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '262'
  - number: '768.2'
    text: |-
      De notaris brengt het bedrag in de macht van de aannemer nadat drie maanden zijn verstreken na het tijdstip van
      oplevering, tenzij de opdrachtgever van de in [artikel 262 van Boek 6][ref1] toegekende bevoegdheid wenst gebruik
      te maken. In dat geval deelt de opdrachtgever aan de notaris mee tot welk bedrag het depot moet worden gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel262
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel768
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '262'
  - number: '768.3'
    text: |-
      De notaris brengt het bedrag voorts in de macht van de aannemer voor zover de opdrachtgever daarin toestemt, de
      aannemer vervangende zekerheid stelt of bij een uitspraak die partijen bindt, is beslist dat een depot niet of niet
      langer gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel768
  - number: '768.4'
    text: |-
      Indien de opdrachtgever aan de aannemer schadevergoeding verschuldigd is wegens de in lid 1 bedoelde depotstorting
      of de door de aannemer gestelde vervangende zekerheid, wordt deze gesteld op de wettelijke rente bedoeld in
      [artikel 119 van Boek 6][ref1]. Gedurende de drie maanden bedoeld in lid 2, is zij niet verschuldigd, zelfs niet
      indien geen gebreken worden geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel768
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
  - number: '769'
    text: |-
      Van deze afdeling en voor zover voor de toepassing van [artikel 768][ref1] nodig, van
      [artikel 262 van Boek 6][ref2], kan niet ten nadele van de opdrachtgever worden afgeweken, behoudens bij een
      standaardregeling als bedoeld in [artikel 214 van Boek 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel768
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel214
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel769
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '768'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '262'
      - id: ref3
        bwb_id: BWBR0005289
        artikel: '214'
  - number: '850.1'
    text: |-
      Borgtocht is de overeenkomst waarbij de ene partij, de borg, zich tegenover de andere partij, de schuldeiser,
      verbindt tot nakoming van een verbintenis, die een derde, de hoofdschuldenaar, tegenover de schuldeiser heeft of
      zal krijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel850
  - number: '850.2'
    text: Voor de geldigheid van een borgtocht is niet vereist dat de hoofdschuldenaar deze kent.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel850
  - number: '850.3'
    text: |-
      Op borgtocht zijn de bepalingen omtrent hoofdelijke verbintenissen van toepassing, voor zover daarvan in deze titel
      niet wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel850
  - number: '851.1'
    text: De borgtocht is afhankelijk van de verbintenis van de hoofdschuldenaar, waarvoor zij is aangegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel851
  - number: '851.2'
    text: |-
      Borgtocht kan slechts voor toekomstige verbintenissen van de hoofdschuldenaar worden aangegaan, voor zover zij
      voldoende bepaalbaar zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel851
  - number: '852.1'
    text: |-
      Verweermiddelen die de hoofdschuldenaar jegens de schuldeiser heeft, kunnen ook door de borg worden ingeroepen,
      indien zij het bestaan, de inhoud of het tijdstip van nakoming van de verbintenis van de hoofdschuldenaar
      betreffen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel852
  - number: '852.2'
    text: |-
      Indien de hoofdschuldenaar bevoegd is om ter vernietiging van de rechtshandeling waaruit de verbintenis
      voortspruit, een beroep op een vernietigingsgrond te doen en hem door de borg of door de schuldeiser een redelijke
      termijn is gesteld ter uitoefening van die bevoegdheid, is de borg gedurende die termijn bevoegd de nakoming van
      zijn verbintenis op te schorten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel852
  - number: '852.3'
    text: |-
      Zolang de hoofdschuldenaar bevoegdelijk de nakoming van zijn verbintenis jegens de schuldeiser opschort, is ook de
      borg bevoegd de nakoming van zijn verbintenis op te schorten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel852
  - number: '853'
    text: |-
      Door voltooiing van de verjaring van de rechtsvordering tot nakoming van de verbintenis van de hoofdschuldenaar,
      gaat de borgtocht teniet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel853
  - number: '854'
    text: |-
      Strekt de verbintenis van de hoofdschuldenaar tot iets anders dan tot betaling van een geldsom, dan geldt
      de borgtocht voor de vordering tot schadevergoeding in geld, verschuldigd op grond van niet-nakoming van die
      verbintenis, tenzij uitdrukkelijk anders is bedongen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel854
  - number: '855.1'
    text: |-
      De borg is niet gehouden tot nakoming voordat de hoofdschuldenaar in de nakoming van zijn verbintenis is tekort
      geschoten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel855
  - number: '855.2'
    text: |-
      De schuldeiser die de hoofdschuldenaar overeenkomstig [artikel 82 van Boek 6][ref1] in gebreke stelt, is verplicht
      hiervan tegelijkertijd de borg mededeling te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel82
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel855
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '82'
  - number: '856.1'
    text: |-
      De borg is slechts wettelijke rente verschuldigd over het tijdvak dat hijzelf in verzuim is, tenzij de
      hoofdschuldenaar in verzuim is krachtens [artikel 83 onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel83
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel856
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '83'
  - number: '856.2'
    text: |-
      De borg is gehouden de kosten van rechtsvervolging van de hoofdschuldenaar te vergoeden, indien hij tijdig door
      mededeling van het voornemen tot rechtsvervolging in de gelegenheid is gesteld deze kosten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel856
  - number: '857'
    text: |-
      De bepalingen van deze afdeling zijn van toepassing op borgtochten die zijn aangegaan door een natuurlijk persoon
      die noch handelde in de uitoefening van zijn beroep of bedrijf, noch ten behoeve van de normale uitoefening van
      het bedrijf van een naamloze vennootschap of besloten vennootschap met beperkte aansprakelijkheid, waarvan hij
      bestuurder is en alleen of met zijn medebestuurders de meerderheid der aandelen heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel857
  - number: '858.1'
    text: |-
      Indien het bedrag van de verbintenis van de hoofdschuldenaar op het tijdstip van het aangaan van de borgtocht niet
      vaststaat, is de borgtocht slechts geldig, voor zover een in geld uitgedrukt maximum-bedrag is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel858
  - number: '858.2'
    text: |-
      Overeenkomstig [artikel 856][ref1] verschuldigde rente en kosten kunnen ongeacht dit maximum worden gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel856
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel858
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '856'
        afdeling: '1'
  - number: '859.1'
    text: Tegenover de borg wordt de borgtocht slechts door een door hem ondertekend geschrift bewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel859
  - number: '859.2'
    text: |-
      De borgtocht kan door alle middelen worden bewezen, indien vaststaat dat de borg de verbintenis van de
      hoofdschuldenaar geheel of gedeeltelijk is nagekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel859
  - number: '859.3'
    text: |-
      Voor het bewijs van de overeenkomst die tot het aangaan van de borgtocht verplicht, geldt dezelfde eis als gesteld
      in lid 1 en in het geval van lid 2 dezelfde vrijheid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel859
  - number: '860'
    text: |-
      De borg is niet gebonden, voor zover voor zijn verbintenis meer bezwarende voorwaarden zouden gelden dan die
      waaronder de hoofdschuldenaar gebonden is, behoudens voor zover het betreft de wijze waarop tegenover de borg het
      bewijs van bestaan en omvang van de verbintenis van de hoofdschuldenaar geleverd kan worden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel860
  - number: '861.1'
    text: 'Een borgtocht die voor toekomstige verbintenissen is aangegaan, kan:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: 861.1.a
    text: te allen tijde worden opgezegd, indien zij niet voor een bepaalde duur geldt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: 861.1.b
    text: na vijf jaren worden opgezegd, indien zij wel voor een bepaalde duur geldt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: '861.2'
    text: Na de opzegging duurt de borgtocht voor de reeds ontstane verbintenissen voort.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: '861.3'
    text: |-
      Een borg is niet verbonden voor toekomstige verbintenissen tot vergoeding van schade, waarvoor de hoofdschuldenaar
      jegens de schuldeiser aansprakelijk is, voor zover de schuldeiser de schade had kunnen voorkomen door een toezicht
      als redelijkerwijs van hem gevergd kon worden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: '861.4'
    text: |-
      Een borg is evenmin verbonden voor toekomstige verbintenissen uit een rechtshandeling die de schuldeiser
      onverplicht heeft verricht, nadat hij bekend was geworden met omstandigheden die de mogelijkheid van verhaal op de
      hoofdschuldenaar aanmerkelijk hebben verminderd, zulks tenzij de borg uitdrukkelijk met de rechtshandeling heeft
      ingestemd of deze handeling geen uitstel kon lijden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel861
  - number: '862'
    text: 'Niet kan ten nadele van de borg worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel862
  - number: 862.a
    text: |-
      van de [artikelen 852-856][ref1] en [858-861][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel852
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel858
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel862
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '852'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '858'
        afdeling: '2'
  - number: 862.b
    text: |-
      van de verplichtingen die de schuldeiser krachtens [artikel 154 van Boek 6][ref1] jegens de borg heeft met het oog
      op diens mogelijke subrogatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel154
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel862
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '154'
  - number: '863'
    text: |-
      De bepalingen van deze afdeling zijn van overeenkomstige toepassing op overeenkomsten, waarbij iemand als bedoeld
      in [artikel 857][ref1] zich verbindt tot een bepaalde prestatie voor het geval een derde een bepaalde verbintenis
      met een andere inhoud jegens de schuldeiser niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel857
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel863
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '857'
        afdeling: '2'
  - number: '864.1'
    text: |-
      Indien in opdracht en voor rekening van iemand als bedoeld in [artikel 857][ref1] ter zake van de verbintenis
      van een ander een borgtocht of een overeenkomst als bedoeld in [artikel 863][ref2] wordt aangegaan, heeft de
      opdrachtnemer voor hetgeen hij aan de schuldeiser heeft voldaan, geen recht op vergoeding jegens de opdrachtgever
      voor zover de onderhavige afdeling aan diens aansprakelijkheid als borg in de weg gestaan zou hebben.
      [Artikel 861][ref3] is tussen opdrachtgever en opdrachtnemer van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel857
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel863
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel861
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel864
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '857'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '863'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '861'
        afdeling: '2'
  - number: '864.2'
    text: |-
      Van het eerste lid kan slechts worden afgeweken, indien dit geschiedt bij een door de opdrachtgever ondertekend
      geschrift waarin de aard van de afwijking wordt omschreven, en het een opdracht betreft aan een bank of andere
      instelling die haar bedrijf van het verstrekken van borgtochten maakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel864
  - number: '865'
    text: |-
      Op de rechtsbetrekkingen tussen hoofdschuldenaar en borg en op die tussen borgen en voor de verbintenis
      aansprakelijke niet-schuldenaren onderling is [artikel 2 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel2
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel865
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '2'
  - number: '866.1'
    text: |-
      De borg heeft voor het gehele bedrag dat hij aan hoofdsom, rente en kosten aan de schuldeiser heeft moeten voldoen,
      krachtens [artikel 10 van Boek 6][ref1] een vordering op de hoofdschuldenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
  - number: '866.2'
    text: |-
      De borg kan noch aan [artikel 10][ref1], noch aan [artikel 12 van Boek 6][ref2] een vordering op de
      hoofdschuldenaar ontlenen voor wettelijke rente over de periode waarin hij door hem persoonlijk betreffende
      omstandigheden in verzuim is geweest of voor kosten die hem persoonlijk betreffen of door hem in redelijkheid niet
      behoefden te worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel12
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '12'
  - number: '866.3'
    text: |-
      Heeft iemand zich ter zake van dezelfde verbintenis borg gesteld voor twee of meer hoofdelijk verbonden
      hoofdschuldenaren, dan zijn deze in afwijking van [artikel 10 lid 1][ref1] en [artikel 12 lid 1 van Boek 6][ref2],
      jegens de borg hoofdelijk verbonden voor hetgeen deze aan hoofdsom, rente en kosten op hen kan verhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel12
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel866
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '12'
  - number: '866.4'
    text: |-
      Uit de rechtsverhouding tussen de borg en een of meer hoofdschuldenaren kan iets anders voortvloeien dan de leden
      1-3 meebrengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel866
  - number: '867'
    text: |-
      Indien de borg de verbintenis is nagekomen zonder de hoofdschuldenaar daarvan mededeling te doen en deze daarna
      zijnerzijds de schuldeiser heeft betaald, kan de hoofdschuldenaar tegenover de borg volstaan met overdracht aan
      deze van zijn vordering wegens onverschuldigde betaling op de schuldeiser.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel867
  - number: '868'
    text: |-
      Een krachtens [artikel 10 van Boek 6][ref1] aangesproken hoofdschuldenaar kan de verweermiddelen die hij op het
      tijdstip van het ontstaan van de verhaalsvordering jegens de schuldeiser had, ook inroepen tegen de borg; de
      [leden 2 en 4 van artikel 11 van Boek 6][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel11
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel868
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '11'
  - number: '869'
    text: |-
      De borg te wiens laste de schuld is gedelgd, kan met overeenkomstige toepassing van [artikel 152 van Boek 6][ref1]
      het onverhaalbaar gebleken gedeelte omslaan over zich zelf, zijn medeborgen en de niet-schuldenaren die voor de
      verbintenis aansprakelijk waren.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel152
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel869
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '152'
  - number: '870'
    text: |-
      De achterborg die de verbintenis van de borg is nagekomen, kan ten behoeve van zich zelf het verhaal uitoefenen
      dat de borg, indien hij zelf de verbintenis was nagekomen, zou hebben gehad jegens de hoofdschuldenaar of jegens
      medeborgen of niet-schuldenaren die voor de verbintenis aansprakelijk waren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel870
  - number: '900.1'
    text: |-
      Bij een vaststellingsovereenkomst binden partijen, ter beëindiging of ter voorkoming van onzekerheid of geschil
      omtrent hetgeen tussen hen rechtens geldt, zich jegens elkaar aan een vaststelling daarvan, bestemd om ook te
      gelden voor zover zij van de tevoren bestaande rechtstoestand mocht afwijken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel900
  - number: '900.2'
    text: |-
      De vaststelling kan tot stand komen krachtens een beslissing van partijen gezamenlijk of krachtens een aan één van
      hen of aan een derde opgedragen beslissing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel900
  - number: '900.3'
    text: |-
      Een bewijsovereenkomst staat met een vaststellingsovereenkomst gelijk voor zover zij een uitsluiting van
      tegenbewijs meebrengt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel900
  - number: '900.4'
    text: Deze titel is niet van toepassing op de overeenkomst van arbitrage.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel900
  - number: '901.1'
    text: |-
      De totstandkoming van de vaststelling is gebonden aan de vereisten waaraan moet worden voldaan om de met de
      beslissing beoogde rechtstoestand, uitgaande van die waarvan zij mogelijk afwijkt, tot stand te brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel901
  - number: '901.2'
    text: |-
      Ieder van de partijen is jegens de andere verplicht te verrichten hetgeen van haar zijde nodig is om aan de
      vereisten voor de totstandkoming van de vaststelling te voldoen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel901
  - number: '901.3'
    text: |-
      Voor zover aan deze vereisten kan worden voldaan door een verklaring van partijen of een hunner, wordt deze
      verklaring in de vaststellingsovereenkomst besloten geacht, tenzij uit de overeenkomst anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel901
  - number: '902'
    text: |-
      Een vaststelling ter beëindiging van onzekerheid of geschil op vermogensrechtelijk gebied is ook geldig als zij
      in strijd mocht blijken met dwingend recht, tenzij zij tevens naar inhoud of strekking in strijd komt met de goede
      zeden of de openbare orde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel902
  - number: '903'
    text: |-
      Een vaststelling van hetgeen in het verleden rechtens is geweest, kan geen afbreuk doen aan inmiddels verkregen
      rechten van derden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel903
  - number: '904.1'
    text: |-
      Indien gebondenheid aan een beslissing van een partij of van een derde in verband met inhoud of wijze van
      totstandkoming daarvan in de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid onaanvaardbaar
      zou zijn, is die beslissing vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel904
  - number: '904.2'
    text: |-
      Indien de beslissing van een partij of een derde vernietigd wordt, nietig blijkt of niet binnen een aan die partij
      of derde daartoe te stellen redelijke termijn wordt verkregen, kan de rechter een beslissing geven, tenzij uit de
      overeenkomst of de aard van de beslissing voortvloeit dat zij op andere wijze moet worden vervangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel904
  - number: '905'
    text: |-
      Indien een ontbinding van een vaststellingsovereenkomst wegens een tekortkoming in de nakoming daarvan een reeds
      tot stand gekomen, aan een partij of een derde opgedragen beslissing zou treffen, kan deze ontbinding niet door een
      eenzijdige verklaring geschieden en kan de rechter haar afwijzen op de grond dat degene die haar vordert, voldoende
      middelen heeft om van de wederpartij opheffing van of vergoeding voor de tekortkoming te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel905
  - number: '906.1'
    text: |-
      De bepalingen van deze titel vinden overeenkomstige toepassing, wanneer een vaststelling haar rechtsgrond elders
      dan in een overeenkomst vindt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel906
  - number: '906.2'
    text: |-
      [Artikel 904][ref1] vindt overeenkomstige toepassing wanneer aan een der partijen bij een rechtsverhouding of aan
      een derde de bevoegdheid is gegeven de regeling van de verhouding aan te vullen of te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel904
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel906
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '904'
  - number: '906.3'
    text: |-
      Lid 2 geldt niet voor aanvulling of wijziging bij een besluit van een orgaan van een rechtspersoon, indien dit
      besluit krachtens [artikel 15 van Boek 2][ref1] bij strijd met redelijkheid en billijkheid vernietigbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel15
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel906
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '15'
  - number: '906.4'
    text: |-
      De leden 1 en 2 gelden niet voor zover de strekking van de betrokken bepaling in verband met de aard van de
      rechtsverhouding zich tegen de overeenkomstige toepassing verzet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel906
  - number: '907.1'
    text: |-
      Een overeenkomst strekkende tot vergoeding van schade die is veroorzaakt door een gebeurtenis of gelijksoortige
      gebeurtenissen, gesloten door een stichting of vereniging met volledige rechtsbevoegdheid met één of meer andere
      partijen, die zich bij deze overeenkomst hebben verbonden tot vergoeding van deze schade, kan door de rechter op
      gezamenlijk verzoek van de partijen die de overeenkomst hebben gesloten verbindend worden verklaard voor personen
      aan wie de schade is veroorzaakt, mits de stichting of vereniging de belangen van deze personen ingevolge haar
      statuten behartigt. Onder personen aan wie de schade is veroorzaakt worden mede begrepen personen die een vordering
      ter zake van deze schade onder algemene of bijzondere titel hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: '907.2'
    text: 'De overeenkomst bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.a
    text: |-
      een omschrijving van de groep dan wel groepen van personen ten behoeve van wie de overeenkomst is gesloten, naar
      gelang van de aard en de ernst van hun schade;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.b
    text: een zo nauwkeurig mogelijke aanduiding van het aantal personen dat tot deze groep of groepen behoort;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.c
    text: de vergoeding die aan deze personen wordt toegekend;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.d
    text: de voorwaarden waaraan deze personen moeten voldoen om voor die vergoeding in aanmerking te komen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.e
    text: de wijze waarop de vergoeding wordt vastgesteld en kan worden verkregen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.2.f
    text: |-
      de naam en de woonplaats van degene aan wie de in [artikel 908 leden 2 en 3][ref1] bedoelde schriftelijke
      mededeling kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel908
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '908'
  - number: '907.3'
    text: 'De rechter wijst het verzoek af indien:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.a
    text: de overeenkomst niet aan lid 2 voldoet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.b
    text: |-
      de hoogte van de toegekende vergoedingen niet redelijk is, mede gelet op de omvang van de schade, de eenvoud en
      snelheid waarmee de vergoedingen verkregen kunnen worden en de mogelijke oorzaken van de schade;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.c
    text: |-
      onvoldoende zekerheid is gesteld voor de voldoening van de vorderingen van degenen ten behoeve van wie de
      overeenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.d
    text: de overeenkomst niet voorziet in een onafhankelijke vaststelling van de vergoedingen ingevolge de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.e
    text: |-
      de belangen van de personen ten behoeve van wie de overeenkomst is gesloten anderszins onvoldoende gewaarborgd
      zijn;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.f
    text: |-
      de stichting of vereniging, bedoeld in lid 1 niet voldoende representatief is ter zake van de belangen van degenen
      ten behoeve van wie de overeenkomst is gesloten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.g
    text: |-
      de groep van personen ten behoeve van wie de overeenkomst is gesloten van onvoldoende omvang is om een
      verbindendverklaring te rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: 907.3.h
    text: |-
      er een rechtspersoon is die ingevolge de overeenkomst de vergoedingen verstrekt, en deze geen partij is bij de
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: '907.4'
    text: De rechter kan alvorens te beslissen partijen gelegenheid geven de overeenkomst aan te vullen of te wijzigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: '907.5'
    text: |-
      Het verzoek, bedoeld in lid 1, stuit de verjaring van een rechtsvordering tot vergoeding van schade tegen
      de personen die partij zijn bij de overeenkomst, voorzover de overeenkomst in de vergoeding van deze schade
      voorziet. Indien het verzoek onherroepelijk is toegewezen, begint een nieuwe verjaringstermijn te lopen met
      de aanvang van de dag, volgende op die waarop definitief is beslist welke vergoeding wordt toegekend. Voorts
      begint een nieuwe verjaringstermijn te lopen met de aanvang van de dag volgende op die waarop een mededeling
      als bedoeld in [artikel 908 lid 2][ref1] is gedaan. Indien het verzoek niet tot toewijzing leidt, begint een
      nieuwe verjaringstermijn te lopen met de aanvang van de dag, volgende op die waarop dit onherroepelijk vaststaat.
      Indien de overeenkomst ingevolge [artikel 908 lid 4][ref2] wordt opgezegd, begint een nieuwe verjaringstermijn
      te lopen met de aanvang van de dag, volgende op die waarop dit overeenkomstig dat lid plaatsvindt.
      [Artikel 319 lid 2 van Boek 3][ref3] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel908
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel908
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel319
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '908'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '908'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '319'
  - number: '907.6'
    text: |-
      De overeenkomst kan bepalen dat een recht op vergoeding ingevolge de overeenkomst vervalt indien een gerechtigde
      tot een vergoeding niet binnen een termijn van ten minste één jaar na de aanvang van de dag, volgende op die waarop
      hij met de opeisbaarheid van zijn vergoeding bekend is geworden, daarop aanspraak heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel907
  - number: '908.1'
    text: |-
      Zodra het verzoek tot verbindendverklaring onherroepelijk is toegewezen heeft de overeenkomst, bedoeld
      in [artikel 907][ref1], tussen partijen en de gerechtigden tot een vergoeding de gevolgen van een
      vaststellingsovereenkomst waarbij ieder der gerechtigden als partij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel908
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '907'
  - number: '908.2'
    text: |-
      De verbindendverklaring heeft geen gevolg ten aanzien van een gerechtigde tot een vergoeding
      die binnen een door de rechter te bepalen termijn van ten minste drie maanden na de in
      [artikel 1017 lid 3 van het Wetboek van Burgerlijke Rechtsvordering][ref1] bedoelde aankondiging van de beschikking
      door een schriftelijke mededeling aan de in [artikel 907 lid 2, onder f][ref2], bedoelde persoon heeft laten weten
      niet gebonden te willen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1017
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel907
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel908
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1017'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '907'
  - number: '908.3'
    text: |-
      Voor een gerechtigde tot een vergoeding die bij de in lid 2 bedoelde aankondiging niet met zijn schade bekend
      kon zijn heeft een verbindendverklaring geen gevolg indien hij na het bekend worden van zijn schade door een
      schriftelijke mededeling aan de in [artikel 907 lid 2, onder f][ref1], bedoelde persoon heeft laten weten niet
      gebonden te willen zijn. Een partij die zich bij de overeenkomst heeft verbonden tot vergoeding van schade kan een
      gerechtigde tot een vergoeding als bedoeld in de eerste zin schriftelijk een termijn van ten minste zes maanden
      stellen waarbinnen deze kan laten weten niet gebonden te willen zijn. Daarbij wordt tevens mededeling gedaan van de
      naam en de woonplaats van de in [artikel 907 lid 2, onder f][ref2], bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel907
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel908
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '907'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '907'
  - number: '908.4'
    text: |-
      Een beding dat een partij bij de overeenkomst ten nadele van de gerechtigden tot een vergoeding van een verbintenis
      bevrijdt is na een verbindendverklaring nietig, tenzij het de partijen, die zich bij de overeenkomst hebben
      verbonden tot de vergoeding van de schade gezamenlijk de bevoegdheid geeft om uiterlijk binnen zes maanden na
      verloop van de in lid 2 bedoelde door de rechter te bepalen termijn de overeenkomst op te zeggen op de grond
      dat de verbindendverklaring voor te weinig gerechtigden tot een vergoeding gevolgen heeft. Opzegging vindt in
      dat geval plaats door aankondiging in twee nieuwsbladen en door een schriftelijke mededeling aan de stichting of
      vereniging, bedoeld in [artikel 907 lid 1][ref1]. De partijen die de overeenkomst hebben opgezegd dragen er zorg
      voor dat daarvan zo spoedig mogelijk schriftelijk mededeling wordt gedaan aan de bekende gerechtigden tot een
      vergoeding, waarbij de partijen zich kunnen houden aan de laatste hen bekende woonplaatsen van de gerechtigden tot
      een vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel908
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '907'
  - number: '908.5'
    text: |-
      Nadat de overeenkomst verbindend is verklaard kunnen de partijen die de overeenkomst hebben gesloten
      zich niet beroepen op de vernietigingsgronden als bedoeld in de [artikelen 44 lid 3 van Boek 3][ref1] en
      [228 van Boek 6][ref2], en kan een gerechtigde tot een vergoeding zich niet beroepen op de vernietigingsgrond als
      bedoeld in [artikel 904 lid 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel228
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel904
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel908
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '228'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '904'
  - number: '909.1'
    text: |-
      Een ingevolge de overeenkomst genomen definitieve beslissing over de vergoeding die een gerechtigde tot een
      vergoeding toekomt, is bindend. Indien evenwel deze beslissing, of de wijze waarop deze tot stand is gekomen,
      naar maatstaven van redelijkheid en billijkheid onaanvaardbaar is, is de rechter bevoegd over de vergoeding te
      beslissen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel909
  - number: '909.2'
    text: |-
      Indien een beslissing over de toekenning van een vergoeding niet binnen een daartoe te stellen redelijke termijn
      wordt verkregen, is de rechter bevoegd over de vergoeding te beslissen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel909
  - number: '909.3'
    text: |-
      De stichting of vereniging, bedoeld in [artikel 907 lid 1][ref1], kan nadat de overeenkomst verbindend is verklaard
      nakoming jegens een gerechtigde tot een vergoeding vorderen, tenzij deze zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel909
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '907'
  - number: '909.4'
    text: |-
      De gerechtigde tot een vergoeding ontvangt krachtens de overeenkomst geen vergoeding waardoor hij in een duidelijk
      voordeliger positie zou geraken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel909
  - number: '909.5'
    text: |-
      Indien de partij of de partijen, die zich bij de overeenkomst hebben verbonden tot de vergoeding van schade, aan
      hun verplichtingen uit de overeenkomst kunnen voldoen door betaling van een in de overeenkomst vastgesteld bedrag,
      en het totaalbedrag van de verschuldigde vergoedingen het totaal te voldoene bedrag overschrijdt, worden, nadat dit
      gebleken is, de nadien nog verschuldigde vergoedingen naar evenredigheid verminderd tot het beloop van het dan nog
      overgebleven bedrag. Naar gelang van onder meer de aard en de ernst van de schade kan in de overeenkomst een van
      dan de in de eerste zin afwijkende wijze van vermindering worden opgenomen. De betaling van een nog verschuldigde
      vergoeding kan worden opgeschort indien in verband met het in de eerste en tweede zin bepaalde op redelijke gronden
      kan worden betwijfeld welk bedrag dient te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel909
  - number: '910.1'
    text: |-
      Zijn naast de partij of partijen die zich bij de overeenkomst hebben verbonden tot de vergoeding van schade, andere
      schuldenaren hoofdelijk aansprakelijk, dan is [artikel 14 van Boek 6][ref1] van overeenkomstige toepassing. Tenzij
      van een andere bedoeling blijkt, wordt de overeenkomst geacht mede een beding in te houden als in die bepaling
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel14
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel910
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '14'
  - number: '910.2'
    text: |-
      Indien de partij of de partijen, die zich bij de overeenkomst hebben verbonden tot de vergoeding van schade,
      aan hun verplichtingen uit de overeenkomst hebben voldaan door betaling van een in de overeenkomst vastgesteld
      bedrag en er na voldoening van de gerechtigden tot een vergoeding een restant is overgebleven, kan deze partij,
      of kunnen deze partijen gezamenlijk de rechter die de overeenkomst verbindend heeft verklaard, verzoeken om degene
      die deze gelden beheert te bevelen dit restant aan deze partij of, in geval van meer partijen, aan elke partij in
      evenredigheid van ieders bijdrage, uit te keren. De rechter wijst het verzoek af indien onvoldoende aannemelijk is
      dat alle gerechtigden tot een vergoeding zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel910
  - number: '925.1'
    text: |-
      Verzekering is een overeenkomst waarbij de ene partij, de verzekeraar, zich tegen het genot van premie jegens
      haar wederpartij, de verzekeringnemer, verbindt tot het doen van een of meer uitkeringen, en bij het sluiten der
      overeenkomst voor partijen geen zekerheid bestaat, dat, wanneer of tot welk bedrag enige uitkering moet worden
      gedaan, of ook hoe lang de overeengekomen premiebetaling zal duren. Zij is hetzij schadeverzekering, hetzij
      sommenverzekering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel925
  - number: '925.2'
    text: Persoonsverzekering is de verzekering welke het leven of de gezondheid van een mens betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel925
  - number: '926.1'
    text: Onder uitkering is begrepen een prestatie anders dan in geld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel926
  - number: '926.2'
    text: |-
      In deze afdeling wordt onder de tot uitkering gerechtigde verstaan degene die in geval van verwezenlijking van het
      risico krachtens de verzekering recht heeft op uitkering of door aanvaarding van de aanwijzing recht op uitkering
      kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel926
  - number: '927'
    text: De bepalingen van deze titel zijn niet van toepassing op herverzekering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel927
  - number: '928.1'
    text: |-
      De verzekeringnemer is verplicht vóór het sluiten van de overeenkomst aan de verzekeraar alle feiten mede te
      delen die hij kent of behoort te kennen, en waarvan, naar hij weet of behoort te begrijpen, de beslissing van de
      verzekeraar of, en zo ja, op welke voorwaarden, hij de verzekering zal willen sluiten, afhangt of kan afhangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
  - number: '928.2'
    text: |-
      Indien de belangen van een bij het aangaan van de verzekering bekende derde worden gedekt, omvat de in lid 1
      bedoelde verplichting mede de hem betreffende feiten die deze kent of behoort te kennen, en waarvan naar deze weet
      of behoort te begrijpen, de beslissing van de verzekeraar afhangt of kan afhangen. De vorige zin mist toepassing
      bij persoonsverzekering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
  - number: '928.3'
    text: |-
      Betreft een persoonsverzekering het risico van een bekende derde die de leeftijd van zestien jaren heeft bereikt,
      dan omvat de mededelingsplicht mede de hem betreffende feiten die deze kent of behoort te kennen en waarvan, naar
      hij weet of behoort te begrijpen, de beslissing van de verzekeraar afhangt of kan afhangen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
  - number: '928.4'
    text: |-
      De mededelingsplicht betreft niet feiten die de verzekeraar reeds kent of behoort te kennen, en evenmin
      feiten, die niet tot een voor de verzekeringnemer ongunstiger beslissing zouden hebben geleid. De
      verzekeringnemer of de derde, bedoeld in lid 2 of lid 3, kan zich er echter niet op beroepen dat de
      verzekeraar bepaalde feiten reeds kent of behoort te kennen indien op een daarop gerichte vraag een onjuist
      of onvolledig antwoord is gegeven. De mededelingsplicht betreft voorts geen feiten waarnaar ingevolge de
      [artikelen 4 tot en met 6 van de Wet op de medische keuringen][ref1] in de daar bedoelde gevallen geen medisch
      onderzoek mag worden verricht en geen vragen mogen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel4
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '4'
  - number: '928.5'
    text: |-
      De verzekeringnemer is slechts verplicht feiten mede te delen omtrent zijn strafrechtelijk verleden of omtrent dat
      van derden, voor zover zij zijn voorgevallen binnen de acht jaren die aan het sluiten van de verzekering vooraf
      zijn gegaan en voor zover de verzekeraar omtrent dat verleden uitdrukkelijk een vraag heeft gesteld in niet voor
      misverstand vatbare termen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
  - number: '928.6'
    text: |-
      Indien de verzekering is gesloten op de grondslag van een door de verzekeraar opgestelde vragenlijst, kan deze zich
      er niet op beroepen dat vragen niet zijn beantwoord, of feiten waarnaar niet was gevraagd, niet zijn medegedeeld,
      en evenmin dat een in algemene termen vervatte vraag onvolledig is beantwoord, tenzij is gehandeld met het opzet de
      verzekeraar te misleiden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel928
  - number: '929.1'
    text: |-
      De verzekeraar die ontdekt dat aan de in [artikel 928][ref1] omschreven mededelingsplicht niet is voldaan, kan de
      gevolgen daarvan slechts inroepen indien hij de verzekeringnemer binnen twee maanden na de ontdekking op de niet-
      nakoming wijst onder vermelding van de mogelijke gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel929
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
  - number: '929.2'
    text: |-
      De verzekeraar die ontdekt dat de verzekeringnemer heeft gehandeld met het opzet hem te misleiden of die bij
      kennis van de ware stand van zaken geen verzekering zou hebben gesloten, kan de overeenkomst binnen twee maanden na
      ontdekking met dadelijke ingang opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel929
  - number: '929.3'
    text: |-
      De verzekeringnemer kan de overeenkomst met dadelijke ingang opzeggen binnen twee maanden nadat de verzekeraar
      overeenkomstig lid 1 heeft gehandeld of zich bij de verwezenlijking van het risico op de niet-nakoming van de
      mededelingsplicht beroept. Bij persoonsverzekering kan de verzekeringnemer de beëindiging beperken tot de persoon,
      wiens risico het beroep op de niet-nakoming betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel929
  - number: '930.1'
    text: |-
      Indien aan de in [artikel 928][ref1] omschreven mededelingsplicht niet is voldaan, bestaat alleen recht op
      uitkering overeenkomstig de leden 2 en 3.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel930
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
  - number: '930.2'
    text: |-
      De bedongen uitkering geschiedt onverkort, indien de niet of onjuist meegedeelde feiten van geen belang zijn voor
      de beoordeling van het risico, zoals dit zich heeft verwezenlijkt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel930
  - number: '930.3'
    text: |-
      Indien aan lid 2 niet is voldaan, maar de verzekeraar bij kennis van de ware stand van zaken een hogere premie zou
      hebben bedongen, of de verzekering tot een lager bedrag zou hebben gesloten, wordt de uitkering verminderd naar
      evenredigheid van hetgeen de premie meer of de verzekerde som minder zou hebben bedragen. Zou de verzekeraar bij
      kennis van de ware stand van zaken andere voorwaarden hebben gesteld, dan is slechts een uitkering verschuldigd als
      waren deze voorwaarden in de overeenkomst opgenomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel930
  - number: '930.4'
    text: |-
      In afwijking van de leden 2 en 3 is geen uitkering verschuldigd indien de verzekeraar bij kennis van de ware stand
      van zaken geen verzekering zou hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel930
  - number: '930.5'
    text: |-
      In afwijking van de leden 2 en 3 is geen uitkering verschuldigd aan de verzekeringnemer of de derde, bedoeld in
      [artikel 928 lid 2 of lid 3][ref1], die heeft gehandeld met het opzet de verzekeraar te misleiden. Evenmin is een
      uitkering verschuldigd aan de derde indien de verzekeringnemer, met het opzet de verzekeraar te misleiden, niet
      heeft voldaan aan de mededelingsplicht betreffende de derde.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel930
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
  - number: '931'
    text: |-
      De verzekeraar kan zich niet beroepen op de vernietigingsgronden als bedoeld in de
      [artikelen 44 lid 3 van Boek 3][ref1] en [228 van Boek 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel228
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel931
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '228'
  - number: '932.1'
    text: |-
      De verzekeraar geeft zo spoedig mogelijk een akte, polis genaamd, af, waarin de overeenkomst is vastgelegd. De
      vorige zin geldt niet indien de aard van de overeenkomst afwijkend gebruik rechtvaardigt en de verzekeringnemer bij
      afgifte van de polis geen belang heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel932
  - number: '932.2'
    text: Op wijzigingen in de overeenkomst is lid 1 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel932
  - number: '932.3'
    text: |-
      Indien een door een verzekeraar afgegeven bewijsstuk verloren is gegaan, geeft hij desverlangd tegen vergoeding van
      de kosten een nieuw bewijsstuk af. Indien het bewijsstuk aan toonder of order is gesteld en bij een verzekering van
      zaken die door middel van documenten plegen te worden verhandeld, kan de verzekeraar als voorwaarde voor het doen
      van een uitkering aan de houder van een nieuw bewijsstuk verlangen, dat hem door de houder gedurende de tijd dat de
      verzekeraar tot betaling kan worden gedwongen, zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel932
  - number: '933.1'
    text: |-
      Alle mededelingen waartoe de bepalingen van deze titel of de overeenkomst de verzekeraar aanleiding geven,
      geschieden schriftelijk. De verzekeraar kan zich daarbij houden aan de laatste hem bekende woonplaats van de
      geadresseerde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel933
  - number: '933.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen van lid 1 afwijkende regels worden gesteld ten aanzien van de verzending
      van mededelingen langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel933
  - number: '933.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel933
  - number: '934'
    text: |-
      Het niet nakomen van de verplichting tot betaling van de vervolgpremie kan eerst leiden tot beëindiging
      of schorsing van de verzekeringsovereenkomst of de dekking, nadat de schuldenaar na de vervaldag onder
      vermelding van de gevolgen van het uitblijven van betaling vruchteloos is aangemaand tot betaling binnen een
      termijn van 14 dagen, aanvangende de dag na aanmaning. De eerste zin geldt niet voor het geval bedoeld in
      [artikel 83, onder c, van Boek 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel83
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel934
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '83'
  - number: '935.1'
    text: |-
      De verzekeraar kan hetgeen hij schuldig is aan de tot uitkering gerechtigde die geen schuldenaar van de premie is,
      verrekenen met opeisbare premie voor dezelfde verzekering, de schade wegens vertraging in de voldoening daarvan en
      de kosten, bedoeld in [artikel 96 lid 2, onder c, van Boek 6][ref1]. De eerste zin geldt niet bij verzekeringen die
      aan toonder of order zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel96
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel935
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '96'
  - number: '935.2'
    text: |-
      Bij een verzekering tegen aansprakelijkheid kan de verzekeraar in afwijking van
      [artikel 127 lid 2 van Boek 6][ref1] geen andere premie, schade en kosten als bedoeld in lid 1 verrekenen met
      hetgeen hij aan de tot uitkering gerechtigde schuldig is, dan die ter zake van dezelfde verzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel127
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel935
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '127'
  - number: '936.1'
    text: |-
      Heeft een tussenpersoon zich bij de verzekeringsovereenkomst tegenover de verzekeraar tot betaling van premie en
      kosten als eigen schuld verbonden, dan is de verzekeringnemer jegens de verzekeraar gekweten voor zover de premie
      en kosten voor rekening van de tussenpersoon zijn gekomen of aan deze zijn voldaan. De verzekeringnemer is tot
      vergoeding van die premie en kosten aan de tussenpersoon gehouden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '936.2'
    text: |-
      Is een uitkering verschuldigd geworden, dan is de verzekeraar desverlangd, ongeacht rechten van derden, gehouden
      daarvan aan de tussenpersoon zoveel af te dragen als deze ingevolge het in lid 1 bepaalde van de verzekeringnemer
      heeft te vorderen. Is de verzekeringnemer krachtens de verzekeringsovereenkomst tot de uitkering gerechtigd, dan
      heeft de verzekeraar eenzelfde verplichting ten aanzien van andere verzekeringen waarbij dezelfde nemer en dezelfde
      tussenpersoon zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '936.3'
    text: |-
      De verzekeraar die voornemens is een uitkering te doen aan een ander dan de tussenpersoon, verzoekt deze laatste
      om binnen tien dagen het bedrag op te geven, dat deze ingevolge lid 1 van de verzekeringnemer heeft te vorderen.
      Indien de tussenpersoon daaraan gevolg geeft, draagt de verzekeraar voor zoveel mogelijk het opgegeven bedrag aan
      hem af. Heeft de verzekeraar hieraan voldaan of heeft de tussenpersoon binnen de gestelde termijn niets opgegeven,
      dan staat het de verzekeraar vrij aan de ander de nog verschuldigde uitkering te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '936.4'
    text: 'De leden 2 en 3 missen toepassing:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: 936.4.a
    text: bij verzekeringen die aan toonder of order zijn gesteld, tenzij de verzekeringnemer tot de uitkering is gerechtigd;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: 936.4.b
    text: bij verplichte aansprakelijkheidsverzekering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '936.5'
    text: 'Het in lid 2, tweede zin, bepaalde mist bovendien toepassing:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: 936.5.a
    text: |-
      indien op het recht op uitkering een pandrecht rust als bedoeld in [artikel 229 van Boek 3][ref1], of een voorrecht
      als bedoeld in [artikel 283 van Boek 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel283
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '229'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '283'
  - number: 936.5.b
    text: bij onverplichte verzekering tegen aansprakelijkheid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '936.6'
    text: |-
      Wanneer de tussenpersoon de uitkering namens de tot uitkering gerechtigde in ontvangst neemt, is hij bevoegd om
      de vergoeding als bedoeld in lid 1, tweede zin, te verrekenen met hetgeen hij aan de tot uitkering gerechtigde
      schuldig is tot het bedrag van zijn uit de leden 2, 4 en 5 voortvloeiende aanspraken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel936
  - number: '937'
    text: |-
      De verzekeraar die een uitkering doet aan de tussenpersoon, is jegens de tot uitkering gerechtigde gekweten
      voorzover hetgeen hij aan de tot uitkering gerechtigde verschuldigd is aan deze laatste is voldaan, doch in ieder
      geval voorzover de tot uitkering gerechtigde door de betaling aan de tussenpersoon is gebaat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel937
  - number: '938.1'
    text: |-
      Behoudens het geval van opzet van de verzekeringnemer of de derde, bedoeld in [artikel 928 lid 2 of lid 3][ref1]
      om de verzekeraar te misleiden is geen premie verschuldigd indien in het geheel geen risico is gelopen. Indien over
      een vol verzekeringsjaar geen risico is gelopen, is over dat jaar geen premie verschuldigd. De verzekeraar heeft
      recht op een billijke vergoeding van de te zijnen laste gekomen kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel938
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
  - number: '938.2'
    text: |-
      Gedurende één maand na afloop van een vol verzekeringsjaar waarin geen risico is gelopen, mag elke partij de
      overeenkomst met ingang van het nieuwe verzekeringsjaar opzeggen. Deze opzegging heeft geen rechtskracht, indien
      risico is gelopen tussen de aanvang van het nieuwe verzekeringsjaar en de opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel938
  - number: '938.3'
    text: |-
      Is slechts risico gelopen over een kleiner aantal zaken of een kleinere hoeveelheid dan was verzekerd, dan zijn de
      leden 1 en 2 van toepassing voor zover geen risico is gelopen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel938
  - number: '939'
    text: |-
      Behalve bij opzegging wegens opzet de verzekeraar te misleiden, wordt bij tussentijdse opzegging de lopende premie
      naar billijkheid verminderd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel939
  - number: '940.1'
    text: |-
      Bij opzegging tegen het einde van een verzekeringsperiode teneinde verlenging van de overeenkomst te verhinderen,
      wordt een termijn van twee maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel940
  - number: '940.2'
    text: |-
      De verzekeringnemer en, tenzij het een persoonsverzekering betreft, de verzekeraar kunnen een overeenkomst die is
      aangegaan voor een periode van meer dan vijf jaar, of die voor zulk een periode is verlengd, opzeggen tegen het
      einde van elk vijfde jaar binnen die periode. Daarbij geldt de in lid 1 genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel940
  - number: '940.3'
    text: |-
      Indien de verzekeraar de bevoegdheid heeft bedongen de overeenkomst tussentijds op te zeggen, komt de
      verzekeringnemer een gelijke bevoegdheid toe. Tenzij jegens hem is gehandeld met het opzet tot misleiding
      neemt de verzekeraar onderscheidenlijk de verzekeringnemer daarbij een termijn van twee maanden in
      acht. Indien een verzekering dekking biedt tegen schade veroorzaakt door risico’s als bedoeld in
      [artikel 64 lid 2 van de Wet toezicht verzekeringsbedrijf 1993][ref1], kan, bij de verwezenlijking van een
      dergelijk risico of bij een dreiging van het ophanden zijn daarvan, de verzekeraar onderscheidenlijk de
      verzekeringnemer in afwijking van deze termijn van twee maanden, de overeenkomst met inachtneming van een termijn
      van zeven dagen opzeggen. De verzekeraar kan slechts tussentijds opzeggen op in de overeenkomst vermelde gronden
      welke van dien aard zijn dat gebondenheid aan de overeenkomst niet meer van de verzekeraar kan worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel64
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel940
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '64'
  - number: '940.4'
    text: |-
      Indien de verzekeraar de voorwaarden van de overeenkomst ten nadele van de verzekeringnemer of de tot uitkering
      gerechtigde wijzigt, is de verzekeringnemer gerechtigd de overeenkomst op te zeggen tegen de dag waarop de
      wijziging ingaat, en in ieder geval gedurende één maand nadat de wijziging hem is meegedeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel940
  - number: '940.5'
    text: |-
      De verzekeraar kan een persoonsverzekering niet beëindigen of wijzigen op grond van verzwaring van het
      gezondheidsrisico, voor zover dat is gelegen in de persoon van degeen, die de verzekering betreft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel940
  - number: '941.1'
    text: |-
      Zodra de verzekeringnemer of de tot uitkering gerechtigde van de verwezenlijking van het risico op de hoogte is,
      of behoort te zijn, is hij verplicht aan de verzekeraar de verwezenlijking te melden. Dit geschiedt zo spoedig als
      redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel941
  - number: '941.2'
    text: |-
      De verzekeringnemer en de tot uitkering gerechtigde zijn verplicht binnen redelijke termijn de verzekeraar alle
      inlichtingen en bescheiden te verschaffen welke voor deze van belang zijn om zijn uitkeringsplicht te beoordelen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel941
  - number: '941.3'
    text: |-
      Indien door de tot uitkering gerechtigde een verplichting als bedoeld in de leden 1 of 2 niet is nagekomen, kan de
      verzekeraar de uitkering verminderen met de schade die hij daardoor lijdt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel941
  - number: '941.4'
    text: |-
      De verzekeraar kan het vervallen van het recht op uitkering wegens niet-nakoming van een verplichting als bedoeld
      in de leden 1 en 2 slechts bedingen voor het geval hij daardoor in een redelijk belang is geschaad.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel941
  - number: '941.5'
    text: |-
      Het recht op uitkering vervalt indien de verzekeringnemer of de tot uitkering gerechtigde een verplichting als
      bedoeld in de leden 1 en 2 niet is nagekomen met het opzet de verzekeraar te misleiden, behoudens voor zover deze
      misleiding het verval van het recht op uitkering niet rechtvaardigt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel941
  - number: '942.1'
    text: |-
      Een rechtsvordering tegen de verzekeraar tot het doen van een uitkering verjaart door verloop van drie jaren na
      de aanvang van de dag, volgende op die waarop de tot uitkering gerechtigde met de opeisbaarheid daarvan bekend
      is geworden. Niettemin verjaart de rechtsvordering bij verzekering tegen aansprakelijkheid niet voordat zes
      maanden zijn verstreken nadat de vordering waartegen de verzekering dekking verleent, binnen de voor deze geldende
      verjarings- of vervaltermijn is ingesteld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel942
  - number: '942.2'
    text: |-
      De verjaring wordt gestuit door een schriftelijke mededeling, waarbij op uitkering aanspraak wordt gemaakt. Een
      nieuwe verjaringstermijn begint te lopen met de aanvang van de dag, volgende op die waarop de verzekeraar hetzij
      de aanspraak erkent, hetzij bij aangetekende brief ondubbelzinnig heeft medegedeeld de aanspraak af te wijzen onder
      eveneens ondubbelzinnige vermelding van het in lid 3 vermelde gevolg.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel942
  - number: '942.3'
    text: In geval van afwijzing verjaart de rechtsvordering door verloop van zes maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel942
  - number: '943.1'
    text: |-
      Van de [artikelen 931][ref1], [932][ref2], [935 lid 2][ref3], [936][ref4] en [939][ref5] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel931
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel932
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel935
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel936
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel939
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel943
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '931'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '932'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '935'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '936'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '939'
        afdeling: '1'
  - number: '943.2'
    text: |-
      Van de [artikelen 933, eerste zin][ref1], [937][ref2], [940 leden 1, 3 en 5][ref3], [941 leden 1, 2, 4 en 5][ref4]
      en [942][ref5] kan niet ten nadele van de verzekeringnemer of de tot uitkering gerechtigde worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel933
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel937
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel940
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel941
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel942
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel943
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '933'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '937'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '940'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '941'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '942'
        afdeling: '1'
  - number: '943.3'
    text: |-
      Van de [artikelen 928 tot en met 930][ref1], [934][ref2] en [940 leden 2 en 4][ref3] kan niet ten nadele van de
      verzekeringnemer of de tot uitkering gerechtigde worden afgeweken indien de verzekeringnemer een natuurlijk persoon
      is en hij de verzekering sluit anders dan in de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel934
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel940
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel943
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '934'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '940'
        afdeling: '1'
  - number: '944'
    text: |-
      Schadeverzekering is de verzekering strekkende tot vergoeding van vermogensschade die de verzekerde zou kunnen
      lijden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel944
  - number: '945'
    text: |-
      In deze afdeling wordt onder verzekerde verstaan degene die in geval van door hem geleden schade krachtens de
      verzekering recht heeft op vergoeding of door aanvaarding van de aanwijzing recht op vergoeding kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel945
  - number: '946.1'
    text: De overeenkomst dekt slechts belangen van de verzekeringnemer, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel946
  - number: '946.2'
    text: |-
      Indien ingevolge een huwelijk of geregistreerd partnerschap een zaak in een gemeenschap valt, zijn bij een
      verzekering van die zaak de deelgenoten voor hun belang verzekerde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel946
  - number: '947'
    text: |-
      De verzekeringnemer kan de aanwijzing van een derde aan wie in geval van schade een uitkering moet worden gedaan,
      slechts herroepen met medewerking van de verzekeraar of van de derde. Met betrekking tot een reeds gevallen schade
      kunnen de verzekeringnemer en de verzekeraar de aanwijzing ook niet gezamenlijk ongedaan maken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel947
  - number: '948.1'
    text: |-
      Bij overdracht van een zaak of een beperkt recht waaraan een zaak is onderworpen, gaan de rechten en verplichtingen
      uit de verzekering die het belang van de vervreemder bij het behoud van de zaak dekt, met het risico op
      de verkrijger over, ook indien het risico al voor de overdracht overgaat. Hetzelfde geldt voor bijkomstige
      verzekeringen die bij diezelfde overeenkomst tot stand zijn gekomen. Geen overgang vindt plaats indien zulks
      voortvloeit uit de rechtshandeling waarbij het goed wordt overgedragen of uit een verklaring van de nieuwe
      belanghebbende aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel948
  - number: '948.2'
    text: |-
      De overeenkomst vervalt een maand nadat zij op de nieuwe verzekerde is overgegaan, tenzij deze binnen die termijn
      aan de verzekeraar verklaart de overeenkomst voort te zetten. In dat geval kan de verzekeraar binnen twee maanden
      nadat de verklaring is afgelegd, de overeenkomst met inachtneming van een termijn van een maand opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel948
  - number: '948.3'
    text: |-
      Premies verschenen voordat de nieuwe verzekerde heeft verklaard de overeenkomst voort te zetten, zijn uitsluitend
      door de verzekeringnemer verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel948
  - number: '948.4'
    text: |-
      Het in lid 2 bepaalde leidt niet tot verlenging van de duur van de overeenkomst noch tot beperking van het recht
      tot opzegging uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel948
  - number: '948.5'
    text: |-
      De leden 1 tot en met 4 missen toepassing, indien de verzekering de verkrijger aanwijst als derde, bedoeld in
      [artikel 947][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel947
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel948
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '947'
        afdeling: '2'
  - number: '949'
    text: |-
      Bij verzekeringen als bedoeld in [artikel 932 lid 3, tweede zin][ref1], geldt de houder van de polis of van een
      ander door de verzekeraar afgegeven bewijsstuk als verzekerde, mits het verzekerde belang bij hem berust. De
      [artikelen 253 lid 2 van Boek 6][ref2], [947][ref3], [948][ref4] en [950][ref5] missen hier toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel932
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel253
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel947
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel948
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel950
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel949
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '932'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '253'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '947'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '948'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '950'
        afdeling: '2'
  - number: '950'
    text: |-
      Indien de verzekeringnemer overlijdt, kunnen zijn erfgenamen en de verzekeraar de overeenkomst binnen negen maanden
      nadat zij met dit overlijden bekend zijn geworden met inachtneming van een termijn van een maand opzeggen. Wanneer
      de nalatenschap van de verzekeringnemer ingevolge [artikel 13 van Boek 4][ref1] wordt verdeeld, komt de bevoegdheid
      van de erfgenamen, bedoeld in de vorige zin, toe aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel950
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '951'
    text: |-
      De verzekeraar vergoedt geen schade aan een verzekerde zaak indien die is veroorzaakt door de aard of een gebrek
      van die zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel951
  - number: '952'
    text: |-
      De verzekeraar vergoedt geen schade aan de verzekerde die de schade met opzet of door roekeloosheid heeft
      veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel952
  - number: '953'
    text: |-
      Indien een verzekering tegen aansprakelijkheid bepaalde erkenningen door de verzekerde verbiedt, heeft overtreding
      van dat verbod geen gevolg voor zover de erkenning juist is. Een verbod tot erkenning van feiten heeft nimmer
      gevolg.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel953
  - number: '954.1'
    text: |-
      Indien in geval van een verzekering tegen aansprakelijkheid de verzekeraar ingevolge [artikel 941][ref1] de
      verwezenlijking van het risico is gemeld, kan de benadeelde verlangen, dat indien de verzekeraar een uitkering
      verschuldigd is, het bedrag dat de verzekerde daarvan ter zake van de schade van de benadeelde door dood of letsel
      te vorderen heeft, aan hem wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
        afdeling: '1'
  - number: '954.2'
    text: |-
      De benadeelde kan zonder melding deze betaling verlangen indien de verzekerde een rechtspersoon was die heeft
      opgehouden te bestaan en de verplichting tot vergoeding van de schade van de benadeelde niet op een ander is
      overgegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '954.3'
    text: |-
      Indien de benadeelde zijn in lid 1 bedoelde bevoegdheid nog niet heeft uitgeoefend, kan de verzekeraar slechts
      bevrijdend aan de verzekerde betalen nadat hij de benadeelde tevergeefs verzocht heeft binnen vier weken mede te
      delen of hij deze bevoegdheid wil uitoefenen, of indien deze daarvan afstand heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '954.4'
    text: |-
      De verzekerde is niet bevoegd ten nadele van de benadeelde over zijn vordering op de verzekeraar te beschikken,
      voorzover deze vordering schade door dood of letsel betreft, noch is deze vordering in zoverre voor anderen dan de
      benadeelde vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '954.5'
    text: |-
      Voorzover de verzekeraar in verband met overschrijding van een verzekerde som tot minder gehouden is dan het bedrag
      waarvoor de verzekerde aansprakelijk is, wordt de verschuldigde uitkering naar evenredigheid toegerekend aan de
      schade van elk der benadeelden alsmede, voorzover zij benadeelden betreft met zowel schade door dood of letsel als
      andere schade, aan deze onderscheiden schadesoorten. Niettemin blijft de verzekeraar die, onbekend met het bestaan
      van vorderingen van andere benadeelden, te goeder trouw aan een benadeelde of de verzekerde een groter bedrag dan
      het aan deze toekomende deel heeft uitgekeerd, jegens de andere benadeelden slechts gehouden tot het beloop van
      het overblijvende gedeelte van de verzekerde som. De betaling aan de benadeelden kan worden opgeschort voorzover
      in verband met het in de eerste zin bepaalde op redelijke gronden kan worden betwijfeld welk bedrag dient te worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '954.6'
    text: |-
      De benadeelde die ter zake van zijn schade door dood of letsel een rechtsvordering instelt tegen de verzekeraar, is
      daartoe slechts bevoegd indien hij er zorg voor draagt dat de verzekerde tijdig in het geding wordt geroepen. Dit
      lijdt uitzondering in het geval, bedoeld in lid 2.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '954.7'
    text: |-
      De leden 1 tot en met 6 missen toepassing voor zover de benadeelde schadeloos is gesteld of voor zover hem door de
      wet jegens de verzekeraar een eigen recht op schadevergoeding is toegekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel954
  - number: '955.1'
    text: |-
      De verzekerde som is het hoogste bedrag van de schadevergoeding tot uitkering waarvan de verzekeraar als gevolg van
      eenzelfde voorval kan worden verplicht, behoudens het bij [artikel 959][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel959
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel955
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '959'
        afdeling: '2'
  - number: '955.2'
    text: Door een uitkering als bedoeld in lid 1, wordt de verzekerde som niet verminderd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel955
  - number: '956'
    text: |-
      Een gebouw is naar zijn herbouwwaarde, en andere zaken zijn naar hun vervangingswaarde verzekerd. Vervangingswaarde
      is het bedrag benodigd voor het verkrijgen van naar soort, kwaliteit, hoeveelheid, staat en ouderdom gelijkwaardige
      zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel956
  - number: '957.1'
    text: |-
      Zodra de verzekeringnemer of de verzekerde van de verwezenlijking van het risico of het ophanden zijn daarvan
      op de hoogte is, of behoort te zijn, is elk hunner, naar mate hij daartoe in de gelegenheid is, verplicht binnen
      redelijke grenzen alle maatregelen te nemen, die tot voorkoming of vermindering van de schade kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel957
  - number: '957.2'
    text: |-
      De verzekeraar vergoedt de kosten aan het nemen van de in lid 1 bedoelde maatregelen verbonden, en de schade aan
      zaken die daarbij worden ingezet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel957
  - number: '957.3'
    text: |-
      Indien de verzekerde de in lid 1 bedoelde verplichting niet is nagekomen, kan de verzekeraar de uitkering
      verminderen met de schade die hij daardoor lijdt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel957
  - number: '958.1'
    text: 'Er is totaal verlies, wanneer een zaak:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: 958.1.a
    text: is tenietgegaan,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: 958.1.b
    text: zo is beschadigd dat zij heeft opgehouden een zaak van de verzekerde soort te zijn, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: 958.1.c
    text: buiten de macht van de verzekerde is geraakt en herkrijging niet is te verwachten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: '958.2'
    text: Bij totaal verlies vergoedt de verzekeraar de waarde van het verzekerde belang bij de zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: '958.3'
    text: |-
      Heeft de verzekeraar in het geval van lid 1 onder c voldaan aan zijn verplichting en wordt het daarna mogelijk de
      zaak te herkrijgen, dan heeft de verzekeraar ter keuze van de verzekerde recht op terugbetaling van de vergoeding
      of op overdracht van de zaak.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: '958.4'
    text: |-
      De verzekeraar vergoedt in geval van verzekering tegen vervangings-, herbouw- of nieuwwaarde bij gedeeltelijke
      schade te zijner keuze hetzij de kosten van herstel en de waardevermindering naar verkoopwaarde ondanks herstel,
      hetzij de verzekerde waarde van de onbeschadigde zaak verminderd met de verkoopwaarde van de restanten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: '958.5'
    text: |-
      Indien het bedrag van de verzekerde som lager is dan de waarde die aan de schadeberekening ten grondslag ligt,
      wordt de vergoeding volgens de leden 2 en 4 verminderd naar evenredigheid van hetgeen dat bedrag lager is dan de
      waarde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel958
  - number: '959.1'
    text: |-
      De in [artikel 957][ref1] bedoelde vergoeding en de redelijke kosten tot het vaststellen van de schade gemaakt,
      komen ten laste van de verzekeraar, ook al zou daardoor, tezamen met de vergoeding van de schade, de verzekerde som
      worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel959
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '957'
        afdeling: '2'
  - number: '959.2'
    text: |-
      Indien de naar de grondslag van de verzekering berekende waarde van de onbeschadigde zaak niet ten volle
      is verzekerd, komt de in [artikel 957][ref1] bedoelde vergoeding slechts met overeenkomstige toepassing van
      [artikel 958 lid 5][ref2] ten laste van de verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel957
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel958
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel959
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '957'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '958'
        afdeling: '2'
  - number: '960'
    text: |-
      De verzekerde zal krachtens de verzekering geen vergoeding ontvangen waardoor hij in een duidelijk voordeliger
      positie zou geraken. De vorige zin mist toepassing bij voorafgaande taxatie van de waarde van een zaak tot
      stand gekomen krachtens een aan een deskundige opgedragen beslissing of krachtens een beslissing van partijen
      overeenkomstig het advies van een deskundige.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel960
  - number: '961.1'
    text: |-
      Indien dezelfde schade door meer dan een verzekering wordt gedekt, kan de verzekerde met inachtneming van
      [artikel 960][ref1] elke verzekeraar aanspreken. De verzekeraar is daarbij bevoegd de nakoming van zijn
      verplichting tot schadevergoeding op te schorten totdat de verzekerde de andere verzekeringen heeft genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel960
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel961
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '960'
        afdeling: '2'
  - number: '961.2'
    text: |-
      Voor de toepassing van lid 1 wordt met schade die door een verzekering wordt gedekt gelijkgesteld schade die door
      de verzekeraar onverplicht wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel961
  - number: '961.3'
    text: |-
      De verzekeraars hebben onderling verhaal opdat ieder zijn deel draagt, naar evenredigheid van de bedragen waarvoor
      een ieder afzonderlijk kan worden aangesproken. Verzekeraars hebben op gelijke voet onderling verhaal voor hun
      redelijke kosten tot het vaststellen van de schade, alsmede voor hun redelijke kosten van verweer in en buiten
      rechte. De verzekerde is jegens de verzekeraars afzonderlijk verplicht zich te onthouden van elke gedraging die ten
      koste van dezen afbreuk doet aan hun onderling verhaal.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel961
  - number: '961.4'
    text: |-
      De bij eenzelfde verzekering betrokken verzekeraars zijn niet verder aansprakelijk dan voor hun evenredig deel van
      hetgeen in totaal ten laste van die verzekering komt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel961
  - number: '962.1'
    text: |-
      Indien de verzekerde terzake van door hem geleden schade anders dan uit verzekering vorderingen tot
      schadevergoeding op derden heeft, gaan die vorderingen bij wijze van subrogatie op de verzekeraar over voor
      zover deze, al dan niet verplicht, die schade vergoedt. De verzekerde moet zich, nadat het risico zich heeft
      verwezenlijkt, onthouden van elke gedraging welke aan het recht van de verzekeraar tegen die derden afbreuk doet.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel962
  - number: '962.2'
    text: |-
      De verzekeraar kan de vordering waarin hij is gesubrogeerd, of die hij door overdracht heeft verkregen, niet ten
      nadele van het recht op schadevergoeding van de verzekerde uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel962
  - number: '962.3'
    text: |-
      De verzekeraar krijgt geen vordering op de verzekeringnemer, een mede-verzekerde, de niet van tafel en bed
      gescheiden echtgenoot of de geregistreerde partner van een verzekerde, de andere levensgezel van een verzekerde,
      noch op de bloedverwanten in de rechte lijn van een verzekerde, op een werknemer of de werkgever van de verzekerde,
      of op degene die in dienst staat tot dezelfde werkgever als de verzekerde. Deze regel geldt niet voor zover zulk
      een persoon jegens de verzekerde aansprakelijk is wegens een omstandigheid die afbreuk zou hebben gedaan aan de
      uitkering, indien die omstandigheid aan de verzekerde zou zijn toe te rekenen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel962
  - number: '963.1'
    text: |-
      Van de [artikelen 960][ref1] en [962 lid 2 en lid 3, eerste zin][ref2], kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel960
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel962
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '960'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '962'
        afdeling: '2'
  - number: '963.2'
    text: |-
      Van [artikel 953][ref1] kan niet ten nadele van de verzekerde worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel953
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '953'
        afdeling: '2'
  - number: '963.3'
    text: |-
      Van [artikel 947, tweede zin][ref1], kan niet ten nadele van de derde worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel947
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '947'
        afdeling: '2'
  - number: '963.4'
    text: |-
      Van [artikel 954][ref1] kan niet ten nadele van de benadeelde worden afgeweken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel954
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '954'
        afdeling: '2'
  - number: '963.5'
    text: |-
      Van [artikel 957 lid 2][ref1] kan niet ten nadele van de verzekeringnemer of de verzekerde worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '957'
        afdeling: '2'
  - number: '963.6'
    text: |-
      Van [artikel 959 lid 1][ref1] kan niet ten nadele van de verzekeringnemer of de verzekerde worden afgeweken
      voor zover de in dit lid bedoelde kosten niet het bedrag overschrijden dat gelijk is aan de verzekerde som en
      de verzekeringnemer een natuurlijk persoon is die de verzekering anders dan in de uitoefening van een beroep of
      bedrijf heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel959
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel963
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '959'
        afdeling: '2'
  - number: '964'
    text: |-
      Sommenverzekering is de verzekering waarbij het onverschillig is of en in hoeverre met de uitkering schade
      wordt vergoed. Zij is slechts toegelaten bij persoonsverzekering en bij verzekeringen welke daartoe bij algemene
      maatregel van bestuur, zonodig binnen daarbij vast te stellen grenzen, zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel964
  - number: '965'
    text: |-
      In deze afdeling wordt verstaan onder verzekerde: degene op wiens leven of gezondheid de verzekering betrekking
      heeft; onder begunstigde: degene die tot het ontvangen van een uitkering is aangewezen. Onder uitkering zijn de
      bedragen, bedoeld in de [artikelen 978 lid 2][ref1], [980 lid 2][ref2], [981][ref3] en [983][ref4] begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel980
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel981
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel983
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel965
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '980'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '981'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '983'
        paragraaf: '2'
        afdeling: '3'
  - number: '966.1'
    text: 'De verzekeringnemer kan door schriftelijke mededeling aan de verzekeraar:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: 966.1.a
    text: |-
      zichzelf of, al dan niet naast zichzelf, één of meer derden als begunstigde aanwijzen, hetzij als hoofdgerechtigde,
      hetzij als beperkt gerechtigde;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: 966.1.b
    text: het recht op uitkering onder bewind stellen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: 966.1.c
    text: een beschikking als onder a of b bedoeld herroepen of wijzigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: '966.2'
    text: |-
      De verzekeraar kan een aanwijzing of een wijziging daarvan afwijzen, indien zij de nakoming van zijn
      uitkeringsverplichting onredelijk zou bemoeilijken. Hij oefent dit recht uit door binnen een maand na de aanwijzing
      of de wijziging de verzekeringnemer van zijn afwijzing in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: '966.3'
    text: |-
      Het bewind over een recht op uitkering heeft dezelfde rechtsgevolgen als een bij uiterste wilsbeschikking ingesteld
      bewind, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: 966.3.a
    text: |-
      de termijnen bedoeld in de [artikelen 178][ref1], [179 lid 2][ref2] en [180 lid 2 van Boek 4][ref3] aanvangen op
      het tijdstip waarop de uitkering of de eerste van een reeks uitkeringen opeisbaar wordt, en


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel178
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel180
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '178'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '180'
  - number: 966.3.b
    text: |-
      het bewind, voor zover het niet in het belang van een ander dan de begunstigde is ingesteld, ook eindigt wanneer
      de verzekeringnemer en de begunstigde een gemeenschappelijk besluit tot opheffing schriftelijk ter kennis van de
      bewindvoerder brengen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: '966.4'
    text: |-
      Een aanwijzing van een begunstigde als hoofdgerechtigde tot zekerheid geldt als een aanwijzing als pandhouder. Op
      een aanwijzing als hoofdgerechtigde tot aflossing van een schuld is de vorige zin van overeenkomstige toepassing,
      tenzij de aanwijzing is beperkt tot hetgeen ter zake aan de begunstigde is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel966
  - number: '967.1'
    text: 'Tenzij van een andere bedoeling blijkt, vervalt de aanwijzing van een begunstigde, indien hij overlijdt vóórdat:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: 967.1.a
    text: hij de aanwijzing heeft aanvaard, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: 967.1.b
    text: een uitkering waarop de aanwijzing betrekking had, opeisbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.2'
    text: |-
      Is de begunstigde in hoedanigheid aangeduid, dan wordt de aanwijzing vermoed te zijn gedaan ten behoeve van
      hem die deze hoedanigheid bezit ten tijde dat de aanwijzing volgens [artikel 968, onder b tot en met d][ref1],
      onherroepelijk wordt. Indien de begunstigde zowel bij naam als in hoedanigheid is aangeduid, wordt de aanwijzing
      vermoed te zijn gedaan ten behoeve van de bij naam aangewezen begunstigde.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel968
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '968'
        paragraaf: '1'
        afdeling: '3'
  - number: '967.3'
    text: |-
      In afwijking van het in lid 2 bepaalde strekt de begunstiging steeds ten behoeve van de begunstigde wiens
      aanwijzing door aanvaarding onherroepelijk is geworden, terwijl hij de in de aanwijzing aangeduide hoedanigheid
      bezat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.4'
    text: |-
      Zijn de als zodanig aangeduide erfgenamen van de verzekeringnemer of van de verzekerde als begunstigden aangewezen,
      dan worden daaronder diegenen verstaan die als erfgenamen tot de nalatenschap zijn geroepen, ongeacht of zij haar
      hebben aanvaard. Zij zijn tot de uitkering gerechtigd in dezelfde verhouding als waarin zij tot de nalatenschap
      zijn geroepen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.5'
    text: |-
      Is de nalatenschap van de verzekeringnemer of van de verzekerde als begunstigde aangewezen, dan komt het recht
      op uitkering toe aan de erfgenamen die de nalatenschap hebben aanvaard. Zij zijn tot de uitkering gerechtigd in
      dezelfde verhouding als waarin zij in de nalatenschap delen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.6'
    text: |-
      Zijn als zodanig aangeduide kinderen als begunstigden aangewezen, dan worden daaronder hun afstammelingen bij
      plaatsvervulling begrepen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.7'
    text: |-
      Indien een uitkering door de dood van de verzekerde opeisbaar wordt en deze en een begunstigde derde gelijktijdig
      zijn overleden, dan wel indien beiden zijn gestorven en men niet kan weten wie het eerst is overleden, valt, tenzij
      van een andere bedoeling blijkt, de uitkering niet aan die begunstigde ten deel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '967.8'
    text: |-
      Zolang geen derde als begunstigde is aangewezen, komt het recht op uitkering toe aan de verzekeringnemer. De
      verzekeringnemer wordt voorts geacht zichzelf als begunstigde te hebben aangewezen voor het geval dat geen
      aanwijzing van een derde als begunstigde gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel967
  - number: '968'
    text: 'De aanwijzing van een derde als begunstigde kan niet worden herroepen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel968
  - number: 968.a
    text: indien die derde haar heeft aanvaard;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel968
  - number: 968.b
    text: indien het risico is geëindigd door het overlijden van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel968
  - number: 968.c
    text: indien een uitkering opeisbaar wordt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel968
  - number: 968.d
    text: indien dit uit de overeenkomst voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel968
  - number: '969.1'
    text: |-
      De begunstigde derde verkrijgt zijn recht op uitkering door aanvaarding van zijn aanwijzing. In afwijking van
      [artikel 253 leden 3 en 4 van Boek 6][ref1] kan hij slechts aanvaarden door een tot de verzekeraar gerichte
      verklaring. Tenzij de aanwijzing onherroepelijk is volgens [artikel 968, onder b tot en met d][ref2], kan de
      begunstigde slechts schriftelijk aanvaarden met op gelijke wijze aan de verzekeraar kenbaar gemaakte toestemming
      van de verzekeringnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel253
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel968
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel969
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '253'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '968'
        paragraaf: '1'
        afdeling: '3'
  - number: '969.2'
    text: |-
      Is de aanwijzing volgens [artikel 968, onder b tot en met d][ref1] onherroepelijk, dan kan de begunstigde derde
      zijn aanwijzing door een tot de verzekeraar gerichte verklaring afwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel968
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel969
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '968'
        paragraaf: '1'
        afdeling: '3'
  - number: '969.3'
    text: |-
      De begunstigde derde maakt de aanvaarding van zijn aanwijzing ongedaan door afstand te doen van zijn recht op
      uitkering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel969
  - number: '970.1'
    text: |-
      De rechten van de verzekeringnemer uit een sommenverzekering kunnen, onverminderd de tweede zin, slechts
      gezamenlijk worden overgedragen. Uit een sommenverzekering voortvloeiende vorderingsrechten kunnen afzonderlijk
      worden overgedragen, voor zover uit de wet of de overeenkomst niet anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel970
  - number: '970.2'
    text: |-
      Levering van rechten uit een verzekering vereist een daartoe bestemde akte en schriftelijke mededeling daarvan aan
      de verzekeraar door de vervreemder of de verkrijger.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel970
  - number: '971.1'
    text: |-
      Bij het vestigen van een pandrecht op uit een sommenverzekering voortvloeiende rechten mist
      [artikel 239 van Boek 3][ref1] toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel239
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel971
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '239'
  - number: '971.2'
    text: |-
      Indien het pandrecht rust op een recht op uitkering, treedt voor de toepassing van de [artikelen 246][ref1] en
      [253 van Boek 3][ref2] en [artikel 490b van het Wetboek van Burgerlijke Rechtsvordering][ref3] de hoofdgerechtigde
      voor de pandgever in de plaats. Heeft een als hoofdgerechtigde aangewezen derde zijn aanwijzing nog niet aanvaard,
      dan stelt de pandhouder de derde daartoe in de gelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel253
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel490b
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel971
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '246'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '253'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 490b
  - number: '971.3'
    text: |-
      In afwijking van lid 2 kan de pandhouder een overschot als bedoeld in
      [artikel 253 lid 1, tweede zin, van Boek 3][ref1] ook afdragen aan de verzekeraar. De verzekeraar is het bedrag
      verschuldigd aan de hoofdgerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel253
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel971
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '253'
  - number: '972.1'
    text: |-
      De verzekeringnemer kan zijn uit de overeenkomst voortvloeiende rechten slechts uitoefenen met schriftelijke
      toestemming:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel972
  - number: 972.1.a
    text: |-
      van de begunstigde, wanneer een aanwijzing volgens [artikel 968][ref1] onherroepelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel968
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel972
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '968'
        paragraaf: '1'
        afdeling: '3'
  - number: 972.1.b
    text: |-
      van de beperkt gerechtigde, wanneer een beperkt recht is gevestigd op de voor de verzekeringnemer uit de
      overeenkomst voortvloeiende rechten, dan wel op het recht op een uitkering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel972
  - number: '972.2'
    text: |-
      Indien uitoefening van de in lid 1 bedoelde rechten niet zou leiden tot wijziging van de rechtspositie van de
      begunstigde, onderscheidenlijk de beperkt gerechtigde, is daarvoor diens toestemming niet vereist.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel972
  - number: '973'
    text: |-
      Aan de overeenkomst kunnen geen rechten worden ontleend door degeen die onherroepelijk veroordeeld is ter zake dat
      hij de verwezenlijking van het risico opzettelijk teweeg heeft gebracht of daaraan opzettelijk meegewerkt heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel973
  - number: '974'
    text: |-
      Van de vormvoorschriften van de [artikelen 966 lid 1][ref1] en [969 lid 1, tweede zin][ref2], en van de
      [artikelen 972][ref3] en [973][ref4] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel966
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel969
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel972
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel973
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel974
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '966'
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '969'
        paragraaf: '1'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '972'
        paragraaf: '1'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '973'
        paragraaf: '1'
        afdeling: '3'
  - number: '975'
    text: |-
      Levensverzekering is de in verband met het leven of de dood gesloten sommenverzekering met dien verstande dat
      ongevallenverzekering niet als levensverzekering wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel975
  - number: '976'
    text: |-
      De [artikelen 978 lid 1][ref1], [980 lid 1][ref2] en [981][ref3], en [artikel 986][ref4] voor zover het op deze
      bepalingen betrekking heeft, missen toepassing bij verzekeringen strekkende tot voorziening in de kosten van
      lijkbezorging. Bij algemene maatregel van bestuur kunnen hiervoor nadere maatstaven worden gesteld. De waarde van
      deze verzekeringen en de uit deze verzekeringen voortvloeiende rechten zijn niet vatbaar voor beslag en blijven
      buiten het faillissement van of de toepassing van de schuldsaneringsregeling op de verzekeringnemer en vereffening
      van zijn nalatenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel980
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel981
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel986
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel976
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '980'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '981'
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '986'
        paragraaf: '2'
        afdeling: '3'
  - number: '977.1'
    text: |-
      Behoudens het elders in deze titel bepaalde kan de verzekering niet door de verzekeraar worden opgezegd of
      ontbonden, noch krachtens enig beding vervallen. De eerste zin staat niet in de weg aan een beding dat de
      verzekering eindigt of door de verzekeraar kan worden opgezegd, indien zij als gevolg van in de overeenkomst
      voorziene verrekening van premie, bedongen rente en kosten niet langer premievrije waarde of afkoopwaarde heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel977
  - number: '977.2'
    text: |-
      Behoudens het elders in deze afdeling bepaalde kan de verzekeraar de verzekering slechts afkopen of premievrij
      voortzetten met medewerking van de verzekeringnemer, verkregen na het aangaan van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel977
  - number: '978.1'
    text: |-
      De verzekeringnemer heeft het recht de verzekering, voor zover deze stellig voorziet in een of meer uitkeringen,
      geheel of gedeeltelijk door de verzekeraar te doen afkopen. Door afkoop eindigt de verzekering, behoudens voor
      zover uit de verzekering nog uitkeringen kunnen voortvloeien. De afkoopwaarde komt de verzekeringnemer toe.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel978
  - number: '978.2'
    text: |-
      Indien de verzekering premievrije waarde heeft, komt de verzekeringnemer het recht toe, haar premievrij te doen
      voortzetten. Dit recht kan worden uitgesloten voor het geval dat bij premievrijmaking tegen verminderde bedragen de
      hoogte van de verminderde uitkering of uitkeringen beneden een bij algemene maatregel van bestuur vast te stellen
      grens zou blijven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel978
  - number: '979.1'
    text: |-
      De verzekeringnemer heeft het recht de verzekering als bedoeld in [artikel 978 lid 1][ref1] tot het bedrag van de
      afkoopwaarde bij de verzekeraar te belenen op bij deze gebruikelijke voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel979
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
  - number: '979.2'
    text: |-
      De verzekeraar mag het bedrag dat hij ter zake van de belening betaalt, vermeerderd met rente en kosten, voor zover
      het hem niet wordt terugbetaald, in mindering brengen op de contante waarde van periodieke uitkeringen, en inhouden
      op betalingen uit hoofde of ten laste van de verzekering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel979
  - number: '980.1'
    text: |-
      Het niet-betalen van vervolgpremie heeft eerst gevolg, indien de verzekeraar na de vervaldag de verzekeringnemer,
      de begunstigde, indien deze zijn aanwijzing heeft aanvaard, de pandhouder en de beslaglegger door een mededeling op
      dat gevolg heeft gewezen en betaling binnen een daarbij op ten minste één maand gestelde termijn is uitgebleven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel980
  - number: '980.2'
    text: |-
      Indien betaling is uitgebleven, wordt de verzekering die premievrije waarde heeft, premievrij voortgezet of,
      indien de overeenkomst daarin voorziet, voortgezet door middel van verrekening van de premie en de bedongen rente
      en kosten met de afkoopwaarde. Bestaat geen recht op voortzetting als in de vorige zin bedoeld, dan eindigt de
      verzekering, en heeft de verzekeringnemer bij een verzekering die afkoopwaarde heeft, recht op die waarde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel980
  - number: '980.3'
    text: In afwijking van lid 1 kan worden bedongen dat van de vervaldag af rente en kosten verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel980
  - number: '981'
    text: |-
      Overlijdt de verzekerde ten gevolge van een van het risico uitgesloten oorzaak en heeft de verzekering
      afkoopwaarde, dan wordt de verzekeraar een bedrag verschuldigd gelijk aan de afkoopwaarde berekend naar de dag
      voorafgaande aan het overlijden. Dat bedrag komt de begunstigde toe. Heeft de verzekering geen afkoopwaarde,
      maar wel premievrije waarde, dan wordt de verzekeringnemer geacht de dag vóór het overlijden het recht te hebben
      uitgeoefend als bedoeld in [artikel 978 lid 2][ref1] en wordt de verzekerde geacht te zijn overleden door een niet
      van het risico uitgesloten oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel981
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
  - number: '982.1'
    text: |-
      Indien de leeftijd of het geslacht van de verzekerde onjuist is opgegeven, wordt de verzekering geacht te zijn
      gesloten tot de aan de juiste leeftijd of het juiste geslacht aangepaste uitkering, of uitkeringen, bij handhaving
      van hetgeen omtrent de premiebetaling is overeengekomen. De [artikelen 929][ref1] en [930][ref2] en [983][ref3]
      missen in zoverre toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel929
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel930
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel983
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel982
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '929'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '930'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '983'
        paragraaf: '2'
        afdeling: '3'
  - number: '982.2'
    text: |-
      Lid 1 mist toepassing indien de verzekeraar bij kennis van de juiste leeftijd of het juiste geslacht geen
      verzekering zou hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel982
  - number: '983.1'
    text: |-
      Indien een verzekering die de verzekeringnemer krachtens wet of overeenkomst kan doen afkopen, overeenkomstig
      [artikel 929][ref1] wordt opgezegd, verkrijgt de verzekeringnemer recht op de afkoopwaarde van de dag vóór haar
      beëindiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel929
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel983
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '929'
        afdeling: '1'
  - number: '983.2'
    text: |-
      De begunstigde verkrijgt recht op een op gelijke wijze berekend bedrag, indien de verzekeraar bij het einde van het
      risico een beroep doet op de gevolgen van het niet nakomen van [artikel 928][ref1]. Zou echter de toepassing van
      [artikel 930 lid 2 of 3][ref2] tot een hogere uitkering leiden, dan verkrijgt de begunstigde daarop aanspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel930
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel983
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '930'
        afdeling: '1'
  - number: '983.3'
    text: |-
      De verzekeraar die ingevolge artikel 929 de verzekeringnemer op het niet nakomen van [artikel 928][ref1]
      wijst onder voorbehoud van zijn rechten of die de gevolgen van dat niet nakomen inroept, stelt de begunstigde
      die zijn aanwijzing heeft aanvaard, en de pandhouder daarvan in kennis. In het geval, bedoeld in de
      eerste zin, stelt de verzekeraar ook de beslaglegger in kennis, tenzij nog geen verklaring als bedoeld in
      [artikel 476a, eerste lid, Wetboek van Burgerlijke Rechtsvordering][ref2] is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel928
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel476a
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel983
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '928'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 476a
  - number: '984.1'
    text: |-
      Rust een pandrecht op de rechten van de verzekeringnemer, dan kan de pandhouder de verzekering doen afkopen, tenzij
      de verzekeringnemer de bevoegdheid mist de verzekering te doen afkopen. Tevens kan de pandhouder de begunstiging
      wijzigen ten behoeve van de verzekeringnemer, voor zover deze niet onherroepelijk is. Hij kan de verzekering
      slechts doen afkopen indien de schuldenaar in verzuim is gekomen en nadat hij daarna zijn voornemen tot het doen
      afkopen ten minste vier weken tevoren, bij aangetekende brief of bij deurwaardersexploit, aan de verzekeringnemer
      heeft medegedeeld. De verzekeraar is niet gehouden te onderzoeken of de schuldenaar in verzuim is. De pandhouder
      doet een afschrift van de brief of het exploit, bedoeld in de derde zin, toekomen aan de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel984
  - number: '984.2'
    text: |-
      Om de verzekering te kunnen doen afkopen, dient de pandhouder bij de mededeling van een voornemen van afkoop tevens
      te vermelden dat de verzekeringnemer, tenzij deze bevoegdheid is uitgesloten, de verzekering binnen de termijn
      van vier weken, bedoeld in lid 1, kan belenen ter voldoening, voor zover mogelijk, van hetgeen aan de pandhouder
      verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel984
  - number: '984.3'
    text: |-
      Heeft de pandhouder de verzekering doen afkopen of de verzekeringnemer deze overeenkomstig lid 2 beleend, dan rust
      het pandrecht nog slechts op de vordering ter zake van die afkoop of die belening.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel984
  - number: '984.4'
    text: |-
      De pandhouder is niet bevoegd tot verkoop overeenkomstig [artikel 248 van Boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel248
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel984
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '248'
  - number: '985'
    text: |-
      Een rechtsvordering tegen de verzekeraar tot het doen van een uitkering verjaart door verloop van vijf jaar na de
      dag waarop die vordering opeisbaar is geworden, tenzij een langere termijn is bedongen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel985
  - number: '986.1'
    text: |-
      Van [artikel 984][ref1] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel984
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel986
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '984'
        paragraaf: '2'
        afdeling: '3'
  - number: '986.2'
    text: |-
      Van de [artikelen 977][ref1], [981][ref2] en [982][ref3] kan niet ten nadele van de verzekeringnemer, de
      begunstigde of de pandhouder worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel977
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel981
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel982
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel986
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '977'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '981'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '982'
        paragraaf: '2'
        afdeling: '3'
  - number: '986.3'
    text: |-
      Van de [artikelen 978 lid 2][ref1], [980][ref2], en [983][ref3] kan niet ten nadele van de verzekeringnemer,
      de begunstigde, de pandhouder of de beslaglegger worden afgeweken, indien de verzekeringnemer is een natuurlijk
      persoon en deze de verzekering sluit anders dan in verband met de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel980
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel983
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel986
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '980'
        paragraaf: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '983'
        paragraaf: '2'
        afdeling: '3'
  - number: '986.4'
    text: |-
      Beperking of uitsluiting van het recht, bedoeld in [artikel 978 lid 1][ref1], kan niet worden tegengeworpen aan
      schuldeisers van de verzekeringnemer, de curator in het faillissement van de verzekeringnemer, diens bewindvoerder
      in geval van surséance van betaling of toepassing van de schuldsaneringsregeling, dan wel de vereffenaar van
      de nalatenschap van de verzekeringnemer. Bij een verzekering die recht geeft op periodieke uitkeringen of
      verstrekkingen, mist de eerste zin toepassing voor zover de ter zake voldane premies, mede op de grond dat de
      verzekering bepaalt dat zij niet kan worden afgekocht, voor de heffing van de inkomstenbelasting in aanmerking
      konden worden genomen voor de bepaling van het belastbaar inkomen uit werk en woning.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel978
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel986
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '978'
        paragraaf: '2'
        afdeling: '3'
  - number: '990'
    text: |-
      Lijfrente is het van het in leven zijn van één of meer personen afhankelijke recht op een periodieke uitkering
      in geld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel990
  - number: '991.1'
    text: |-
      Indien een uitkering op de vervaldag niet is betaald en ook binnen een maand na een schriftelijke aanmaning nog
      niet is voldaan, kan de gerechtigde de lijfrente, voor zover nog verschuldigd, bij een schriftelijke mededeling
      aan de schuldenaar omzetten in een vordering tot vergoeding van het bedrag dat is vereist voor het kopen van een
      gelijke lijfrente.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel991
  - number: '991.2'
    text: |-
      Nochtans is de schuldenaar van de lijfrente bevoegd de nakoming van zijn verbintenis op te schorten indien hij op
      redelijke gronden betwijfelt of het lijf nog in leven is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel991
  - number: '992'
    text: |-
      Over een periode waarin het lijf overlijdt, is de rente slechts verschuldigd naar evenredigheid van het aantal
      dagen dat hij heeft geleefd. Indien de rente vooruit moest worden betaald blijft zij over de gehele termijn
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel992
