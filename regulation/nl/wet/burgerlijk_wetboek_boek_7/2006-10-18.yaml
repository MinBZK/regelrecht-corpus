        bwb_id: BWBR0001941
        artikel: 13b
      - id: ref7
        bwb_id: BWBR0005181
        artikel: '97'
  - number: '231.3'
    text: Van lid 1 kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel231
  - number: '232.1'
    text: Deze afdeling is uitsluitend van toepassing op huur van woonruimte.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel232
  - number: '232.2'
    text: |-
      Deze afdeling is niet van toepassing op huur welke een gebruik van woonruimte betreft dat naar zijn aard slechts
      van korte duur is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel232
  - number: '232.3'
    text: |-
      De [artikelen 206 lid 3][ref1], [270][ref2], [271 lid 4][ref3], [272][ref4], [273][ref5], [274][ref6], [275][ref7],
      [276][ref8], [277][ref9] en [281][ref10] zijn gedurende negen maanden na het ingaan van de overeenkomst niet van
      toepassing op huur van woonruimte die niet een zelfstandige woning vormt en deel uitmaakt van een woning waarin
      de verhuurder zijn hoofdverblijf heeft en waarin niet eerder aan dezelfde huurder deze of andere woonruimte is
      verhuurd geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel270
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel272
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel273
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel274
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel275
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel276
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel277
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel281
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel232
    references:
      - id: ref1
