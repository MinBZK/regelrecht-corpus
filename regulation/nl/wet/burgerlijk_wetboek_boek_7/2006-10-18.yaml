        afdeling: '5'
  - number: '232.4'
    text: |-
      De [artikelen 206 lid 3][ref1], [269 lid 1 en 2][ref2], [270][ref3],[ 271 tot en met 277][ref4],
      [278 leden 1 en 2][ref5] en [281][ref6] zijn niet van toepassing op de huur van woonruimte in gebouwen, welke aan
      een gemeente toebehoren en ten tijde van het aangaan van de overeenkomst voor afbraak zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel269
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel270
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel278
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel281
