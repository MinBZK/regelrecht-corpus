        afdeling: '5'
  - number: '233'
    text: |-
      Onder woonruimte wordt verstaan een gebouwde onroerende zaak voor zover deze als zelfstandige dan wel niet
      zelfstandige woning is verhuurd, dan wel een woonwagen of een standplaats, alsmede de onroerende aanhorigheden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel233
  - number: '234'
    text: |-
      Onder zelfstandige woning wordt verstaan de woning welke een eigen toegang heeft en welke de bewoner kan bewonen
      zonder daarbij afhankelijk te zijn van wezenlijke voorzieningen buiten de woning.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel234
  - number: '235'
    text: |-
      Onder woonwagen wordt verstaan een voor bewoning bestemd gebouw, dat is geplaatst op een standplaats,
      in zijn geheel of in delen kan worden verplaatst en waarvoor een bouwvergunning als bedoeld in
      [artikel 40 van de Woningwet][ref1] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: '236'
    text: |-
      Onder standplaats wordt verstaan een kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen
      aanwezig zijn die op het leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen
      worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel236
  - number: '237.1'
    text: |-
      In deze afdeling wordt onder prijs verstaan het geheel van de verplichtingen die de huurder tegenover de verhuurder
      bij of ter zake van huur op zich neemt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel237
  - number: '237.2'
    text: Onder huurprijs wordt verstaan de prijs die is verschuldigd voor het enkele gebruik van de woonruimte.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel237
  - number: '237.3'
    text: |-
      Onder servicekosten wordt verstaan de vergoeding voor de in verband met de bewoning van de woonruimte geleverde
      zaken en diensten. Bij algemene maatregel van bestuur kunnen zaken en diensten worden aangewezen waarvoor de
      vergoeding moet worden aangemerkt als servicekosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel237
  - number: '238'
    text: |-
      Onder huurcommissie wordt verstaan de huurcommissie bedoeld in
      [artikel 21 van de Uitvoeringswet huurprijzen woonruimte][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel21
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '21'
  - number: '239'
    text: Onder Onze Minister wordt verstaan de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel239
  - number: '240'
    text: |-
      Bij algemene maatregel van bestuur kunnen herstellingen worden aangewezen die moeten worden aangemerkt als kleine
      herstellingen die krachtens [artikel 217][ref1] voor rekening van de huurder zijn. Van de krachtens het onderhavige
      artikel vastgestelde bepalingen kan niet ten nadele van de huurder worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel217
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel240
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '217'
        afdeling: '3'
  - number: '241'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke tekortkomingen in elk geval als gebreken
      worden aangemerkt. Van de krachtens dit artikel vastgestelde bepalingen kan niet ten nadele van de huurder worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel241
  - number: '242.1'
    text: |-
      Behoudens bij standaardregeling bedoeld in [artikel 214 van Boek 6][ref1] kan niet ten nadele van de huurder worden
      afgeweken van de [artikelen 204][ref2], [206 leden 1 en 2][ref3], [207][ref4], [208][ref5] en [217][ref6], tenzij
      het gaat om herstellingen aan door de huurder aangebrachte veranderingen en toevoegingen of gebreken aan door de
      huurder aangebrachte veranderingen en toevoegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel214
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel204
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel206
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel207
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel208
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel217
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '214'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '204'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '206'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '207'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '208'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '217'
        afdeling: '3'
  - number: '242.2'
    text: |-
      Van de [artikelen 216 lid 3][ref1], [224 lid 2][ref2] en [230][ref3] kan niet ten nadele van de huurder worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel216
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel224
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel230
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel242
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '216'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '224'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '230'
        afdeling: '4'
  - number: '243'
    text: |-
      Indien woonruimte in een gebouwde onroerende zaak verbetering behoeft als bedoeld in
      [artikel 15 lid 2 onder d tot en met f van de Woningwet][ref1], kan de rechter op verzoek van de huurder bepalen
      dat de verhuurder verplicht is deze verbetering op eigen kosten aan te brengen, mits de huurder zich bereid
      heeft verklaard tot het betalen van een huurverhoging die in redelijke verhouding staat tot deze kosten. Van deze
      bepaling kan niet ten nadele van de huurder worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel15
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '15'
  - number: '244'
    text: |-
      In afwijking van [artikel 221][ref1] is de huurder van woonruimte niet bevoegd het gehuurde geheel of gedeeltelijk
      aan een ander in gebruik te geven. De huurder van een zelfstandige woning die in die woning zijn hoofdverblijf
      heeft, is echter bevoegd een deel daarvan aan een ander in gebruik te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel221
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel244
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '221'
        afdeling: '3'
  - number: '245'
    text: |-
      In de [Uitvoeringswet huurprijzen woonruimte][ref1] worden nadere regels gegeven aangaande huurprijzen en andere
      vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0014315
  - number: '246'
    text: |-
      Ter zake van huur gelden de huurprijzen die partijen zijn overeengekomen, voorzover uit deze onderafdeling niet
      anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel246
  - number: '247'
    text: |-
      De volgende artikelen van deze onderafdeling zijn, behoudens de [artikelen 249][ref1], [251][ref2],
      [259][ref3], [261 lid 1][ref4] en [264][ref5], niet van toepassing op een overeenkomst van huur en verhuur,
      die betrekking heeft op een zelfstandige woning, ten aanzien waarvan bij de aanvang van de bewoning een
      huurprijs gold of geldt, die, indien nodig herleid tot een bedrag per jaar, hoger is dan het krachtens
      [artikel 3 lid 2 van de Uitvoeringswet huurprijzen woonruimte][ref6] vastgesteld bedrag, indien


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel249
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel251
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel259
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel261
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel264
      [ref6]: https://wetten.overheid.nl/BWBR0014315#Artikel3
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '249'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '251'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '259'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '261'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '264'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref6
        bwb_id: BWBR0014315
        artikel: '3'
  - number: 247.a
    text: die overeenkomst op of na 1 juli 1994 is totstandgekomen, dan wel,
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel247
  - number: 247.b
    text: die overeenkomst betrekking heeft op een woning die is totstandgekomen op of na 1 juli 1989.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel247
  - number: '248.1'
    text: |-
      De huurprijs kan worden verhoogd hetzij op grond van een beding in de huurovereenkomst dat in deze wijziging
      voorziet, hetzij indien een dergelijk beding niet van kracht is, op de wijze als voorgeschreven in de
      [artikelen 252][ref1] en [253][ref2]. Gedurende het bestaan van een dergelijk beding is toepassing van de
      [artikelen 252][ref3] en [253][ref4] uitgesloten. Indien een dergelijk beding niet meer van kracht is, kan vanaf
      een tijdvak van twaalf maanden na het tijdstip waarop laatstelijk toepassing is gegeven aan het beding, aan de
      hiervoor genoemde artikelen toepassing worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '252'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '253'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '248.2'
    text: |-
      Leidt toepassing van een beding als bedoeld in lid 1 tot verhoging van de huurprijs met een hoger
      percentage dan het door Onze Minister vastgestelde maximale huurverhogingspercentage als bedoeld in
      [artikel 10 lid 2 van de Uitvoeringswet huurprijzen woonruimte][ref1], dan is het beding nietig voorzover zij tot
      dit hogere percentage leidt en geldt de huurprijs als verhoogd met het door Onze Minister vastgestelde maximale
      huurverhogingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
  - number: '249'
    text: |-
      De huurder kan tot uiterlijk zes maanden na het tijdstip waarop een door hem met betrekking tot die woonruimte
      voor de eerste maal aangegane huurovereenkomst is ingegaan, de huurcommissie verzoeken uitspraak te doen over de
      redelijkheid van de overeengekomen huurprijs.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel249
  - number: '250.1'
    text: |-
      De huurprijs kan op verzoek van de verhuurder worden verhoogd op de wijze voorgeschreven in de
      [artikelen 252][ref1] en [253][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel253
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '253'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: 250.1.a
    text: gedurende het eerste tijdvak van twaalf maanden na de dag van ingang van de huur ten hoogste eenmaal, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
  - number: 250.1.b
    text: |-
      telkens tegen het einde van elkaar opvolgende tijdvakken van twaalf maanden na hetzij het ingaan van de onder a
      bedoelde verhoging, hetzij bij gebreke van zodanige verhoging de dag van ingang van de huur.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
  - number: '250.2'
    text: |-
      Een verhoging van de huurprijs krachtens lid 1 is niet mogelijk, zolang er tussen huurder
      en verhuurder geen overeenstemming is dat de, bij toepassing van de [artikelen 12][ref1] en
      [16 van de Uitvoeringswet huurprijzen woonruimte][ref2], geconstateerde gebreken ten aanzien van de woonruimte
      zijn opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel16
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '16'
  - number: '250.3'
    text: |-
      In afwijking van lid 1 kan de huurprijs worden verhoogd tegen het einde van een tijdvak dat even zoveel korter dan
      twaalf maanden is als het daaraan voorafgaande tijdvak langer dan twaalf maanden is geweest.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
  - number: '250.4'
    text: |-
      De huurprijs kan op verzoek van de huurder worden verlaagd op de wijze voorgeschreven in de [artikelen 252][ref1]
      en [254][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel254
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
        paragraaf: Onderafdeling_2
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '254'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '251'
    text: |-
      Bepalingen in huurovereenkomsten die tot gevolg hebben dat de huurprijs in enig tijdvak van twaalf maanden meer dan
      eenmaal wordt verhoogd, zijn nietig, tenzij het gaat om het geval van [artikel 255][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel251
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '252.1'
    text: |-
      Een voorstel tot wijziging van de huurprijs moet tenminste twee maanden voor de voorgestelde dag van ingang van de
      wijziging schriftelijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: '252.2'
    text: 'Het in lid 1 bedoelde voorstel dient te vermelden:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: 252.2.a
    text: de geldende huurprijs;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: 252.2.b
    text: het percentage of het bedrag van de wijziging van de huurprijs;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: 252.2.c
    text: de voorgestelde huurprijs;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: 252.2.d
    text: de voorgestelde dag van ingang van de voorgestelde huurprijs;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: 252.2.e
    text: |-
      de wijze waarop en het tijdvak waarbinnen de huurder, wanneer hij bezwaren heeft tegen het voorstel, daarvan kan
      doen blijken, en de gevolgen die deze onderafdeling verbindt aan het niet doen blijken van bezwaren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: '252.3'
    text: |-
      Voor het doen van een voorstel tot verlaging van de huurprijs dient gebruik te worden gemaakt van een krachtens
      [artikel 47 lid 1 onder c van de Uitvoeringswet huurprijzen woonruimte][ref1] vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel47
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '47'
  - number: '252.4'
    text: |-
      Indien een overeenkomst tot wijziging van de huurprijs tot stand komt naar aanleiding van een voorstel daartoe,
      dat niet voldoet aan lid 1 en lid 2 aanhef en onder b, d of e dan wel aan het in lid 3 bepaalde, blijft de voordien
      geldende huurprijs verschuldigd, tenzij blijkt dat degene tot wie het voorstel was gericht niet door het verzuim
      is benadeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel252
  - number: '253.1'
    text: |-
      Indien de huurder voor het tijdstip waarop de verhoging van de huurprijs blijkens het voorstel had moeten ingaan,
      schriftelijk verklaart met het voorstel van de verhuurder niet in te stemmen, kan de verhuurder tot zes weken na
      dat tijdstip onder overlegging van een afschrift van dat voorstel en van voornoemde verklaring van de huurder de
      huurcommissie verzoeken uitspraak te doen over de redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: '253.2'
    text: |-
      De huurder kan de huurcommissie binnen drie maanden na het in lid 1 bedoelde tijdstip verzoeken uitspraak te doen
      over de redelijkheid van het voorstel, indien:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: 253.2.a
    text: |-
      hij noch vóór het in lid 1 bedoelde tijdstip de daar bedoelde schriftelijke verklaring doet, noch door het betalen
      van de voorgestelde huurverhoging doet blijken met die verhoging in te stemmen, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: 253.2.b
    text: |-
      de verhuurder hem binnen zes weken na het in lid 1 bedoelde tijdstip bij aangetekend schrijven nogmaals van het
      voorstel in kennis heeft gesteld, waarbij een afschrift van het voorstel is gevoegd, en hij met het voorstel tot
      huurverhoging niet instemt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: '253.3'
    text: |-
      De huurder wordt geacht de voorgestelde verhoging van de huurprijs met ingang van de in het voorstel genoemde datum
      van ingang met de verhuurder te zijn overeengekomen indien hij, na ontvangst van het in het tweede lid bedoelde
      schrijven, niet binnen drie maanden na die datum van ingang een verzoek tot de huurcommissie heeft gericht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: '253.4'
    text: |-
      Indien de huurder het in het tweede lid bedoelde verzoek doet, stelt de huurcommissie de verhuurder daarvan
      onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
  - number: '253.5'
    text: |-
      Indien de verhuurder een voorstel als bedoeld in [artikel 252 lid 1 aanhef][ref1] bij aangetekend schrijven heeft
      gedaan, kan hij, indien voldaan is aan lid 2 onder a en b, binnen zes weken na het in lid 1 bedoelde tijdstip de
      huurcommissie verzoeken uitspraak te doen over de redelijkheid van het voorstel. De verhuurder legt bij dit verzoek
      een afschrift over van het voorstel en een bewijs van aangetekende verzending.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel252
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel253
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '252'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '254'
    text: |-
      Indien de verhuurder met een voorstel van de huurder tot verlaging van de huurprijs niet instemt, kan de
      huurder tot uiterlijk zes weken na het tijdstip waarop de verlaging blijkens het voorstel had moeten ingaan, de
      huurcommissie verzoeken uitspraak te doen over de redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel254
  - number: '255.1'
    text: 'De huurprijs van woonruimte waarin of waaraan gedurende de huurtijd door of vanwege de verhuurder:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel255
  - number: 255.1.a
    text: |-
      voorzieningen zijn aangebracht die verband houden met een maatregel die gericht is
      op het opheffen of verminderen van beperkingen die een gehandicapte, als bedoeld in
      [artikel 1 lid 1 onder a, van de Wet voorzieningen gehandicapten][ref1], bij het normale gebruik van zijn
      woonruimte ondervindt, in de kosten waarvan ingevolge enige wettelijke regeling een financiële tegemoetkoming is
      verleend, of


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '1'
  - number: 255.1.b
    text: |-
      veranderingen of toevoegingen, waaronder niet wordt verstaan het verhelpen van gebreken als bedoeld in
      [artikel 204][ref1], zijn aangebracht, waardoor het woongerief geacht kan worden te zijn gestegen en die niet
      ingrepen zijn als bedoeld onder a, is de huurprijs, vermeerderd met een bedrag dat in redelijke verhouding
      staat tot de door de verhuurder gemaakte kosten van deze ingrepen, veranderingen of toevoegingen met dien
      verstande dat de nieuwe huurprijs niet hoger mag zijn dan die welke bij toepassing van de regels bedoeld in
      [artikel 10 lid 1 van de Uitvoeringswet huurprijzen woonruimte][ref2] als redelijk is aan te merken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel204
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '204'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '10'
  - number: '255.2'
    text: |-
      Indien partijen geen overeenstemming hebben kunnen bereiken over het bedrag van de verhoging, kan ieder van hen
      binnen drie maanden na de totstandkoming van de ingrepen, veranderingen of toevoegingen de huurcommissie verzoeken
      daarover een uitspraak te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel255
  - number: '256.1'
    text: |-
      De huurprijs van een woning die ingevolge [artikel 29 van de Woningwet][ref1] onbewoonbaar is verklaard, bedraagt
      9,08 per maand, dan wel, indien op het tijdstip waarop de onbewoonbaarverklaring onherroepelijk is gevonden, een
      lagere huurprijs gold, die lagere huurprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel29
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '29'
  - number: '256.2'
    text: |-
      De krachtens lid 1 geldende huurprijs is verschuldigd met ingang van de dag volgende op het einde van de
      betalingstermijn, waarin de onbewoonbaarverklaring onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel256
  - number: '257.1'
    text: |-
      Voor de vordering van de huurder tot vermindering van de huurprijs op grond van [artikel 207 lid 1][ref1] in
      verbinding met [artikel 242][ref2] geldt een met inachtneming van de volgende leden toe te passen vervaltermijn
      van zes maanden na de aanvang van de dag volgend op die waarop de huurder van het gebrek kennis heeft gegeven aan
      de verhuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel207
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel242
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '207'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '242'
        paragraaf: Onderafdeling_1
        afdeling: '5'
  - number: '257.2'
    text: |-
      Is de vordering van de huurder gegrond op een tekortkoming die krachtens [artikel 241][ref1] als een gebrek heeft
      te gelden, dan kan de huurder, in plaats van zijn vordering binnen de in lid 1 bedoelde termijn bij de rechter
      in te stellen, binnen zes maanden na de aanvang van de dag volgend op die waarop de huurder van het gebrek heeft
      kennis gegeven aan de verhuurder, de huurcommissie verzoeken over de vermindering uitspraak te doen overeenkomstig
      de in [artikel 16 lid 2 van de Uitvoeringswet huurprijzen woonruimte][ref2] bedoelde algemene maatregel van
      bestuur. De huurder kan eerst een verzoek tot de huurcommissie richten, indien de verhuurder niet binnen zes weken
      na de aanvang van de dag volgend op die waarop de huurder van het gebrek kennis heeft gegeven aan de verhuurder,
      het gebrek heeft verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel241
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel16
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '241'
        paragraaf: Onderafdeling_1
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '16'
  - number: '257.3'
    text: |-
      Na het verstrijken van de in de voorgaande leden bedoelde termijn van zes maanden kan, voor wat het verleden
      betreft, geen huurvermindering worden verlangd over een langere periode dan zes maanden, voorafgaande aan het
      instellen van de vordering of het indienen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel257
  - number: '258'
    text: |-
      Indien de huurovereenkomst meer omvat dan het enkele gebruik van de woonruimte en bij die overeenkomst
      slechts de hoogte van de prijs en niet die van de huurprijs is vastgesteld, stelt de huurcommissie op
      verzoek van de huurder de huurprijs vast en het voorschotbedrag voor de servicekosten. Een dergelijk verzoek
      kan ook door de verhuurder worden gedaan, indien de overeengekomen prijs lager is dan 55% van de krachtens
      [artikel 10 lid 1 van de Uitvoeringswet huurprijzen woonruimte][ref1] geldende maximale huurprijsgrens.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
  - number: '259.1'
    text: |-
      De betalingsverplichting van de huurder met betrekking tot servicekosten beloopt het bedrag dat door de huurder
      en verhuurder is overeengekomen of, bij gebreke van overeenstemming, het bedrag dat in overeenstemming is met de
      voor de berekening daarvan geldende wettelijke voorschriften of met hetgeen als een redelijke vergoeding voor de
      geleverde zaken en diensten kan worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel259
  - number: '259.2'
    text: |-
      De verhuurder verstrekt de huurder elk jaar, uiterlijk zes maanden na het verstrijken van een kalenderjaar, een
      naar de soort uitgesplitstoverzicht van de in dat kalenderjaar in rekening gebrachte servicekosten, met vermelding
      van de wijze van berekening daarvan. Indien aan de verhuurder kosten in rekening worden gebracht die niet een
      kalenderjaar betreffen, maar een andere periode van twaalf maanden, die een boekjaar vormt en in het verstreken
      kalenderjaar eindigt, neemt de verhuurder de kosten over die andere periode in het overzicht van dat verstreken
      kalenderjaar op.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel259
  - number: '259.3'
    text: |-
      Bij beëindiging van de huurovereenkomst heeft het overzicht als in lid 2 bedoeld betrekking op het tijdvak van het
      kalenderjaar dat op het tijdstip van de beëindiging reeds is verstreken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel259
  - number: '259.4'
    text: |-
      De verhuurder biedt de huurder desverzocht de gelegenheid, na verstrekking van het overzicht bedoeld in lid 2, tot
      inzage van de aan het overzicht ten grondslag liggende boeken en andere bescheiden of van afschriften daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel259
  - number: '260.1'
    text: |-
      Indien de huurder en verhuurder geen overeenstemming hebben kunnen bereiken over een betalingsverplichting van
      de huurder met betrekking tot servicekosten, kan de huurder of verhuurder de huurcommissie verzoeken uitspraak
      daarover te doen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel260
  - number: '260.2'
    text: |-
      Het verzoek heeft betrekking op niet meer dan één tijdvak van ten hoogste twaalf maanden voor elke kostensoort
      waarop het verzoek betrekking heeft. Het verzoek kan worden gedaan tot uiterlijk vierentwintig maanden nadat de in
      [artikel 259 lid 2][ref1] genoemde termijn voor het verstrekken van het overzicht door de verhuurder is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel259
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '259'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '261.1'
    text: |-
      Het voorschotbedrag dat de huurder krachtens overeenkomst of rechterlijke uitspraak ter zake van de servicekosten
      verschuldigd is, mag, tenzij na het ingaan van de huur anders is overeengekomen, slechts worden verhoogd:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel261
  - number: 261.1.a
    text: |-
      met ingang van de dag, volgend op het einde van de betalings-termijn waarin de overeengekomen uitbreiding van de
      levering van zaken of diensten heeft plaatsgevonden dan wel met ingang van de betalingstermijn met ingang waarvan
      die uitbreiding heeft plaats gevonden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel261
  - number: 261.1.b
    text: |-
      met ingang van de dag, volgende op de betalingstermijn, waarin het laatste overzicht, bedoeld in
      [artikel 259][ref1], aan de huurder is verstrekt met dien verstande dat elk overzicht slechts eenmaal tot een
      verhoging mag leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel259
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '259'
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '261.2'
    text: |-
      De huurder is gebonden aan een wijziging van de levering van zaken of diensten en het daarbij behorende gewijzigde
      voorschotbedrag, indien die wijziging betrekking heeft op zaken of diensten die slechts aan een aantal huurders
      gezamenlijk geleverd kunnen worden, en tenminste 70% van die huurders daarmee heeft ingestemd. Een huurder die
      niet met de wijziging heeft ingestemd, kan binnen acht weken na de schriftelijke kennisgeving van de verhuurder
      dat overeenstemming is bereikt met tenminste 70% van de huurders, een beslissing van de rechter vorderen omtrent de
      redelijkheid van het voorstel.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel261
  - number: '261.3'
    text: |-
      Indien het door de huurder verschuldigde voorschotbedrag aanzienlijk hoger is dan de te verwachten servicekosten,
      kan de huurcommissie op verzoek van de huurder het voorschotbedrag verlagen tot een bedrag dat in redelijke
      verhouding staat tot die kosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel261
  - number: '262.1'
    text: |-
      Wanneer de huurcommissie op een verzoek van de huurder of verhuurder als bedoeld in de [paragrafen 1][ref1] en
      [2][ref2] uitspraak heeft gedaan, worden zij geacht te zijn overeengekomen wat in die uitspraak is vastgesteld,
      tenzij een van hen binnen acht weken nadat aan hen afschrift van die uitspraak is verzonden, een beslissing van de
      rechter heeft gevorderd over het punt waarover de huurcommissie om een uitspraak was verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling5
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0005290
        paragraaf: Onderafdeling_1
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        paragraaf: Onderafdeling_2
        afdeling: '5'
  - number: '262.2'
    text: Tegen een beslissing krachtens dit artikel is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel262
  - number: '263'
    text: |-
      Een wijziging van de huurprijs, vastgesteld in een uitspraak van de huurcommissie of van de rechter, mag in
      rekening worden gebracht met ingang van de in het voorstel tot wijziging voorgestelde dag dan wel indien de
      huurprijs is vastgesteld zonder dat daartoe een voorstel is gedaan, de dag waarop vaststelling is verzocht aan
      de huurcommissie of vaststelling is gevorderd bij de rechter. Zo in de uitspraak een latere dag van ingang wordt
      vastgesteld, geldt die wijziging met ingang van die latere dag.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel263
  - number: '264.1'
    text: |-
      Elk in verband met de totstandkoming van een huurovereenkomst betreffende woonruimte gemaakt beding, niet de
      huurprijs betreffende, voorzover daarbij ten behoeve van een der partijen een niet redelijk voordeel wordt
      overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel264
  - number: '264.2'
    text: |-
      Elk in verband met de totstandkoming van een zodanige huurovereenkomst gemaakt beding, voorzover daarbij door of
      tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel264
  - number: '265'
    text: Van de bepalingen van deze onderafdeling kan niet worden afgeweken, tenzij uit die bepalingen anders voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel265
  - number: '266.1'
    text: |-
      De echtgenoot of geregistreerde partner van een huurder is van rechtswege medehuurder, zolang de woonruimte de
      echtgenoot of geregistreerde partner tot hoofdverblijf strekt, ongeacht of de huurovereenkomst voor dan wel na het
      aangaan van het huwelijk of van het geregistreerde partnerschap is gesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel266
  - number: '266.2'
    text: |-
      Voor de verplichtingen uit de huurovereenkomst, behalve voor zover deze reeds opeisbaar waren voordat de echtgenoot
      of geregistreerde partner medehuurder werd, zijn de huurder en de medehuurder jegens de verhuurder hoofdelijk
      aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel266
  - number: '266.3'
    text: Indien de huurovereenkomst ten aanzien van de huurder eindigt, wordt de medehuurder huurder.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel266
  - number: '266.4'
    text: |-
      Indien de in lid 1 bedoelde echtgenoot of geregistreerde partner hetzij ingevolge een beschikking als bedoeld in
      [artikel 826, lid 1 onder a, van het Wetboek van Burgerlijke Rechtsvordering][ref1], hetzij ingevolge onderlinge
      overeenstemming in verband met een verzoek tot echtscheiding of scheiding van tafel en bed, dan wel ingevolge
      beëindiging van geregistreerd partnerschap niet het gebruik heeft van de echtelijke woning, brengt dit voor de
      toepassing van dit artikel geen verandering in het hoofdverblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel826
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '826'
  - number: '266.5'
    text: |-
      In geval van echtscheiding of scheiding van tafel en bed of beëindiging van geregistreerd partnerschap kan de
      rechter op verzoek van een echtgenoot of geregistreerde partner bepalen wie van de echtgenoten of geregistreerde
      partners huurder van de woonruimte zal zijn. De rechter bepaalt tevens de dag van ingang van de huur met deze
      echtgenoot of partner. Op dezelfde dag eindigt de huur met de andere echtgenoot of partner.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel266
  - number: '267.1'
    text: |-
      Indien op het gezamenlijk verzoek van een huurder en van een andere persoon die in de woonruimte zijn hoofdverblijf
      heeft en met de huurder een duurzame gemeenschappelijke huishouding heeft, alsmede van een medehuurder wanneer die
      er is, de verhuurder niet binnen drie maanden schriftelijk heeft verklaard er mede in te stemmen dat die andere
      persoon medehuurder zal zijn, kunnen de huurder en die andere persoon, alsmede een medehuurder wanneer die er
      is, gezamenlijk verzoeken dat de rechter zal bepalen dat deze persoon met ingang van een in het vonnis te bepalen
      tijdstip medehuurder zal zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '267.2'
    text: |-
      Nadat een verzoek aan de verhuurder als bedoeld in lid 1 is gedaan, kan een vordering tot ontbinding van de
      huur op de grond dat de huurder in strijd met hetgeen overeengekomen is, met een ander in de woonruimte een
      gemeenschappelijke huishouding heeft, niet meer worden toegewezen. Deze grond levert alsdan evenmin een grond voor
      opzegging van de huurovereenkomst op.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '267.3'
    text: 'De rechter wijst de vordering bedoeld in lid 1 slechts af:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: 267.3.a
    text: |-
      indien de persoon bedoeld in lid 1 niet gedurende tenminste twee jaren in de woonruimte zijn hoofdverblijf heeft en
      met de huurder een duurzame gemeenschappelijke huishouding heeft;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: 267.3.b
    text: |-
      indien, mede gelet op hetgeen is komen vast te staan omtrent de gemeenschappelijke huishouding en de tijdsduur
      daarvan, de vordering kennelijk slechts de strekking heeft de persoon bedoeld in lid 1 op korte termijn de positie
      van huurder te verschaffen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: 267.3.c
    text: |-
      indien de persoon bedoeld in lid 1 vanuit financieel oogpunt onvoldoende waarborg biedt voor een behoorlijke
      nakoming van de huur.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '267.4'
    text: |-
      Voor de verplichtingen uit de huur zijn de persoon die de huur heeft aangegaan en ieder van de personen die op
      grond van dit artikel medehuurder of huurder is, hoofdelijk jegens de verhuurder aansprakelijk, met dien verstande
      dat een medehuurder niet aansprakelijk is voor verplichtingen die reeds opeisbaar waren voordat hij medehuurder
      werd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '267.5'
    text: |-
      De bepalingen omtrent het eindigen van de huur zijn op de personen bedoeld in lid 4 afzonderlijk van toepassing
      met dien verstande dat een persoon de hoedanigheid van medehuurder in ieder geval verliest, indien hij zijn
      hoofdverblijf niet langer in de woonruimte heeft. Indien de huur ten aanzien van de huurder eindigt, wordt de
      medehuurder huurder.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '267.6'
    text: |-
      Is ten aanzien van de woonruimte [hoofdstuk II van de Huisvestingswet][ref1] van toepassing, dan zet de medehuurder
      in afwijking van lid 5 de huur slechts voort, indien de rechter dit heeft bepaald op een daartoe door die persoon
      binnen acht weken na het tijdstip waarop hij huurder is geworden, ingestelde vordering en in elk geval zolang op
      deze vordering nog niet onherroepelijk is beslist. De rechter wijst de vordering slechts af, indien de eiser niet
      een voor hem geldende huisvestingsvergunning als bedoeld in [artikel 7 lid 1 van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: '267.7'
    text: |-
      Ieder van de personen bedoeld in lid 4 kan vorderen dat de rechter zal bepalen dat een of meer van deze personen
      de huur met ingang van een in het vonnis te bepalen tijdstip niet langer zullen voortzetten. De rechter wijst de
      vordering slechts toe, indien dit naar billijkheid, met inachtneming van de omstandigheden van het geval, geboden
      is, met dien verstande dat hij de vordering in ieder geval toewijst, indien de eiser aantoont dat de persoon waarop
      de vordering betrekking heeft, zijn positie van medehuurder heeft verkregen op grond van een niet mede door de
      eiser aan de verhuurder gedaan verzoek of van een door hem ingestelde vordering bedoeld in lid 1.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel267
  - number: '268.1'
    text: |-
      Bij overlijden van de huurder zet de medehuurder de huur als huurder voort. Hij kan de huur binnen zes maanden
      na het overlijden bij exploot of aangetekende brief opzeggen met ingang van de eerste dag van de tweede maand na
      de opzegging.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: '268.2'
    text: |-
      De persoon die niet op grond van lid 1 huurder wordt, doch wel in de woonruimte zijn hoofdverblijf heeft en met de
      overleden huurder een duurzame gemeenschappelijk huishouding heeft gehad, zet de huur voort gedurende zes maanden
      na het overlijden van de huurder; de tweede zin van lid 1 is van toepassing. Hij zet de huur ook nadien voort,
      indien de rechter dit heeft bepaald op een daartoe strekkende binnen die termijn ingestelde vordering, en in elk
      zolang op deze vordering niet onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: '268.3'
    text: 'De rechter wijst de vordering bedoeld in lid 2 in ieder geval af:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: 268.3.a
    text: indien de eiser niet aannemelijk heeft gemaakt dat hij aan de vereisten van lid 2 voldoet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: 268.3.b
    text: indien de eiser vanuit financieel oogpunt onvoldoende waarborg biedt voor een behoorlijke nakoming van de huur;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: 268.3.c
    text: |-
      indien het woonruimte betreft waarop [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, indien de eiser
      niet een huisvestingsvergunning als bedoeld in [artikel 7 lid 1 van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: '268.4'
    text: |-
      [Lid 4, de eerste zin van lid 5 en lid 7 van artikel 267][ref1] zijn van overeenkomstige toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel267
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '267'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '268.5'
    text: |-
      Komt vast te staan, dat een persoon ten onrechte een beroep op voortzetting van de huur krachtens dit artikel
      heeft gedaan, dan blijft hij over de tijd gedurende welke hij het genot van de woonruimte heeft gehad jegens de
      verhuurder aansprakelijk voor de nakoming van de huur die voor hem zou hebben bestaan als hij huurder was geweest.
      Heeft meer dan één persoon ten onrechte een beroep op voortzetting van de huur gedaan, dan is ieder van hen jegens
      de verhuurder hoofdelijk aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: '268.6'
    text: |-
      Zijn er geen personen die krachtens dit artikel de huur voortzetten, dan eindigt deze aan het eind van de
      tweede maand na het overlijden van de huurder. De erfgenamen zijn bevoegd de huur tegen het eind van de eerste
      maand na het overlijden van de huurder te doen eindigen. Wanneer de nalatenschap van de huurder ingevolge
      [artikel 13 van Boek 4][ref1] wordt verdeeld, komt de bevoegdheid van de erfgenamen, bedoeld in de vorige zin, toe
      aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '268.7'
    text: |-
      Van dit artikel kan niet ten nadele van de personen aan wie dit artikel recht op voortzetting van de huur
      toekent en van de erfgenamen, onderscheidenlijk de echtgenoot of geregistreerde partner, bedoeld in lid 6, worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
  - number: '268.8'
    text: |-
      Van [artikel 229 leden 1 en 3][ref1] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel229
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '229'
        afdeling: '4'
  - number: '269.1'
    text: |-
      De onderhuur die betrekking heeft op een zelfstandige woning waar de onderhuurder zijn hoofdverblijf heeft, wordt
      in geval van beëindiging van de huur tussen huurder en verhuurder voortgezet door de verhuurder.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
  - number: '269.2'
    text: |-
      De verhuurder kan binnen zes maanden nadat hij op grond van lid 1 de onderhuur heeft voortgezet vorderen dat de
      rechter zal bepalen dat de huur met ingang van een in het vonnis te bepalen tijdstip zal eindigen op de grond dat:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
  - number: 269.2.a
    text: de wederpartij vanuit financieel oogpunt onvoldoende waarborg biedt voor een behoorlijk nakoming van de huur;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
  - number: 269.2.b
    text: de onderhuur is aangegaan met de kennelijke strekking de onderhuurder de positie van huurder te verschaffen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
  - number: 269.2.c
    text: |-
      in de gegeven omstandigheden naar maatstaven van redelijkheid en billijkheid, mede gelet op de inhoud van de
      huurovereenkomsten die betrekking hebben op soortgelijke woonruimte alsmede op de inhoud van de geëindigde huur
      tussen hem en de huurder en de inhoud van de voortgezette huurovereenkomst, niet van hem kan worden gevergd dat hij
      de huur met de wederpartij voortzet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
  - number: 269.2.d
    text: |-
      de wederpartij indien het woonruimte betreft waarop [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is,
      niet een huisvestingsvergunning als bedoeld in [artikel 7 lid 1 van die wet][ref2] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: '269.3'
    text: |-
      Ingeval van onderverhuur welke al dan niet een zelfstandige woning vormt, zet degene die op grond van de
      [artikelen 266][ref1], [267][ref2] en [268][ref3] huurder is geworden of de huur heeft voortgezet, als
      onderverhuurder de huur met de onderhuurder voort.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel268
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
        paragraaf: Onderafdeling_3
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '267'
        paragraaf: Onderafdeling_3
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '268'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '270.1'
    text: |-
      De huurder die een ruil van woonruimte wenst te bewerkstelligen, kan vorderen dat de rechter
      hem zal machtigen om een ander in zijn plaats als huurder te stellen. Indien op de woonruimte
      [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, moet de eiser een ten behoeve van de voorgestelde
      huurder afgegeven huisvestingsvergunning als bedoeld in [artikel 7 lid 1 van die wet][ref2] met betrekking tot
      woonruimte overleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel270
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: '270.2'
    text: |-
      De rechter beslist met inachtneming van de omstandigheden van het geval, met dien verstande dat hij de vordering
      slechts kan toewijzen, indien de huurder een zwaarwichtig belang bij de ruil van woonruimte heeft en dat hij
      deze afwijst, indien de voorgestelde huurder vanuit financieel oogpunt niet voldoende waarborg biedt voor een
      behoorlijke nakoming van de huur. De rechter kan aan de machtiging voorwaarden verbinden of daarbij een last
      opleggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel270
  - number: '270.3'
    text: Van deze bepaling kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel270
  - number: 270a
    text: |-
      Ingeval van voortzetting van de huur op grond van de[ artikelen 266][ref1], [268][ref2] en [269][ref3] is degene
      die de huur voortzet, verplicht daarvan mededeling te doen aan de verhuurder.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel268
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel269
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel270a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
        paragraaf: Onderafdeling_3
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '268'
        paragraaf: Onderafdeling_3
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '269'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '271.1'
    text: |-
      In afwijking van [artikel 228 lid 1][ref1] eindigt een voor bepaalde tijd aangegane huur niet door het enkele
      verloop van de huurtijd; zij kan door elk van beide partijen worden opgezegd tegen een voor de betaling van de
      huurprijs overeengekomen dag, niet vallend voor het verstrijken van de bepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel228
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '228'
        afdeling: '4'
  - number: '271.2'
    text: |-
      Een voor onbepaalde tijd aangegane of voor onbepaalde tijd verlengde huur kan door elk van beide partijen worden
      opgezegd tegen een voor de betaling van de huurprijs overeengekomen dag.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: '271.3'
    text: |-
      De opzegging moet geschieden bij exploot of bij aangetekende brief. Is in gevolge [artikel 266][ref1] de echtgenoot
      of geregistreerde partner van de huurder medehuurder, dan moet de opzegging aan beide echtgenoten of geregistreerde
      partners afzonderlijk worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '271.4'
    text: |-
      De opzegging door de verhuurder moet op straffe van nietigheid de gronden vermelden die tot de opzegging hebben
      geleid. Een opzegging door de verhuurder op andere dan de in [artikel 274 lid 1][ref1] genoemde gronden, is nietig.
      De huurder moet bij de opzegging worden gevraagd binnen zes weken aan de verhuurder mede te delen of hij al dan
      niet toestemt in beëindiging van de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '274'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '271.5'
    text: 'Bij de opzegging moeten de volgende termijnen in acht worden genomen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: 271.5.a
    text: |-
      bij opzegging door de huurder: een termijn gelijk aan de tijd die tussen twee opvolgende voor betaling van de
      huurprijs overeengekomen dagen verstrijkt, doch niet korter dan een maand en niet langer dan drie maanden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: 271.5.b
    text: |-
      bij opzegging door de verhuurder: een termijn niet korter dan drie maanden, voor elk jaar dat de huurder krachtens
      overeenkomst ononderbroken het gehuurde in gebruik heeft gehad verlengd met één maand tot ten hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: '271.6'
    text: |-
      Een opzegging die in strijd met lid 1, lid 3 of lid 5 onder a is gedaan en een opzegging die op een kortere termijn
      is gedaan dan die van lid 5 onder b gelden niettemin als waren zij gedaan tegen de voorgeschreven dag en met
      inachtneming van de voorgeschreven termijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: '271.7'
    text: |-
      Elk beding waarbij in strijd met lid 5 onder a een langere opzegtermijn of waarbij in strijd met lid 5 onder b
      een kortere opzegtermijn wordt overeengekomen of waarbij van andere bepalingen van dit artikel wordt afgeweken, is
      nietig. Eveneens is nietig elk beding dat de huur zonder opzegging doet eindigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: '271.8'
    text: Dit artikel geldt niet, indien de beëindiging geschiedt met wederzijds goedvinden nadat de huur is ingegaan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel271
  - number: '272.1'
    text: |-
      Een opgezegde huurovereenkomst blijft, tenzij de huurder de overeenkomst heeft opgezegd of na de opzegging door de
      verhuurder schriftelijk in de beëindiging ervan heeft toegestemd, na de dag waartegen rechtsgeldig is opgezegd van
      rechtswege van kracht, tot de rechter onherroepelijk heeft beslist op een vordering van de verhuurder als in lid
      2 bedoeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel272
  - number: '272.2'
    text: |-
      De verhuurder kan, indien hij zes weken na de opzegging niet van de huurder een schriftelijke mededeling heeft
      ontvangen dat hij in de beëindiging van de huurovereenkomst toestemt, op de gronden vermeld in de opzegging
      vorderen dat de rechter het tijdstip zal vaststellen waarop de huurovereenkomst zal eindigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel272
  - number: '273.1'
    text: |-
      Bij zijn beslissing op de vordering bedoeld in [artikel 272 lid 2][ref1] neemt de rechter uitsluitend de in de
      opzegging vermelde gronden in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel272
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel273
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '272'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '273.2'
    text: |-
      Indien de rechter de vordering afwijst, wordt de overeenkomst van rechtswege verlengd. De rechter beslist of de
      overeenkomst voor onbepaalde tijd of voor een door hem vast te stellen bepaalde tijd wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel273
  - number: '273.3'
    text: |-
      Indien de rechter de vordering toewijst, stelt hij tevens het tijdstip van ontruiming vast. De toewijzing geldt als
      een veroordeling tot ontruiming tegen dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel273
  - number: '274.1'
    text: De rechter kan de vordering slechts toewijzen
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.a
    text: indien de huurder zich niet heeft gedragen zoals een goed huurder betaamt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.b
    text: |-
      indien de verhuurder zijn vordering grondt op een beding als omschreven in lid 2 en aan de eisen van dat lid is
      voldaan, tenzij de verhuurder geen belang meer heeft bij de ontruiming;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.c
    text: |-
      indien de verhuurder aannemelijk maakt dat hij het verhuurde zo dringend nodig heeft voor eigen gebruik,
      vervreemding van de gehuurde woonruimte niet daaronder begrepen, dat van hem, de belangen van beide partijen en
      van onderhuurders naar billijkheid in aanmerking genomen, niet kan worden gevergd dat de huurovereenkomst wordt
      verlengd, en tevens blijkt dat de huurder, met uitzondering van de huurder, bedoeld in lid 4, andere passende
      woonruimte kan verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.d
    text: |-
      indien de huurder niet toestemt in een redelijk aanbod tot het aangaan van een nieuwe huurovereenkomst met
      betrekking tot dezelfde woonruimte, voor zover, in het geval dat onderafdeling 2 op de opgezegde huurovereenkomst
      van toepassing is, dit aanbod niet een wijziging inhoudt van de huurprijs of van de servicekosten;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.e
    text: |-
      indien de verhuurder een krachtens een geldend bestemmingsplan op het verhuurde liggende bestemming wil
      verwezenlijken;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.1.f
    text: |-
      indien de huurovereenkomst een onzelfstandige woning betreft, die deel uitmaakt van de woning waarin de verhuurder
      zijn hoofdverblijf heeft, en de verhuurder aannemelijk maakt dat zijn belangen bij beëindiging van de huur zwaarder
      wegen dan die van de huurder bij voortzetting daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '274.2'
    text: |-
      In het geval dat uitdrukkelijk is bedongen dat de gehuurde woonruimte na afloop van de bij dat beding
      overeengekomen termijn moet worden ontruimd, kan de verhuurder overeenkomstig lid 1 aanhef en onder b, op dat
      beding de in dat lid bedoelde vordering gronden:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.2.a
    text: |-
      indien de verhuurder die de woonruimte niet zelf heeft bewoond, noch deze eerder heeft verhuurd, na afloop van die
      termijn de woning zelf wil betrekken;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.2.b
    text: |-
      indien de verhuurder die zelf de vorige bewoner van de woonruimte is, na afloop van die termijn die woonruimte zelf
      opnieuw wil betrekken;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.2.c
    text: |-
      indien de verhuurder jegens wie de vorige huurder het recht heeft verkregen na afloop van die termijn de woning
      opnieuw te betrekken, deze huurder daartoe gelegenheid wil geven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '274.3'
    text: 'Onder eigen gebruik in de zin van lid 1 onder c, wordt mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.3.a
    text: renovatie van woonruimte die zonder beëindiging van de huur niet mogelijk is, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.3.b
    text: |-
      het verstrekken van een zelfstandige woning aan een gehandicapte als bedoeld in
      [artikel 1 lid 1 onder a, van de Wet voorzieningen gehandicapten][ref1], indien die woning:


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel1
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '1'
  - number: 274.3.b.1°
    text: reeds bij de bouw ervan was ingericht en bestemd voor bewoning door een gehandicapte, dan wel
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.3.b.2°
    text: |-
      na de bouw met geldelijke steun op grond van enige wettelijke regeling aangepast is ten behoeve van bewoning door
      een gehandicapte;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.3.c
    text: |-
      het verstrekken aan een oudere van een zelfstandige woning welke onderdeel uitmaakt van een complex van
      zelfstandige woningen, welk complex reeds bij de bouw ervan was ingericht en bestemd voor de bewoning door ouderen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '274.4'
    text: |-
      Onder eigen gebruik in de zin van lid 1 onder c, wordt bovendien mede begrepen het verstrekken van woonruimte aan
      een student, indien:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.4.1°
    text: die woonruimte krachtens de huurovereenkomst bestemd is voor studenten, als bedoeld in dit lid;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.4.2°
    text: |-
      de huurder, tegen wie de in lid 1 bedoelde vordering is ingesteld, niet heeft voldaan aan een schriftelijk
      verzoek van de verhuurder, dat deze jaarlijks kan doen, om binnen drie maanden een kopie van het bewijs van zijn
      inschrijving aan een instelling, universiteit of hogeschool als bedoeld in dit lid inzake het lopende studiejaar
      over te leggen, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.4.3°
    text: |-
      in de huurovereenkomst met de huurder tegen wie de in lid 1 bedoelde vordering is ingesteld, is bepaald dat
      die woonruimte na beëindiging van de huurovereenkomst opnieuw aan een student als bedoeld in dit lid zal worden
      verhuurd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '274.5'
    text: Een vordering, gegrond op eigen gebruik in de zin van lid 1 onder c is niet toewijsbaar
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: 274.5.a
    text: |-
      ten aanzien van woonruimte waarop [hoofdstuk II van de Huisvestingswet][ref1] van toepassing is, zolang de
      verhuurder geen huisvestingsvergunning als bedoeld in [artikel 7 lid 1 van die wet][ref2] overlegt behoudens het
      geval dat het eigen gebruik in iets anders bestaat dan bewoning;


      [ref1]: https://wetten.overheid.nl/BWBR0005674#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel7
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
    references:
      - id: ref1
        bwb_id: BWBR0005674
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005674
        artikel: '7'
  - number: 274.5.b
    text: |-
      indien de verhuurder de rechtsopvolger van de vorige verhuurder is en de opzegging is geschied binnen drie jaar
      nadat de rechtsopvolging schriftelijk ter kennis van de huurder is gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '274.6'
    text: |-
      In de gevallen bedoeld in lid 1 onder a en d kan de rechter, voordat hij de vordering toewijst, aan de huurder
      een termijn van ten hoogste een maand toestaan om alsnog aan zijn verplichtingen te voldoen of het aanbod te
      aanvaarden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel274
  - number: '275'
    text: |-
      De rechter kan in zijn beslissing tot toewijzing van de vordering tot beëindiging van de huurovereenkomst op de
      gronden, bedoeld in [artikel 274 lid 1 onder c en e][ref1], een bedrag vaststellen dat de verhuurder aan de huurder
      moet betalen ter tegemoetkoming in diens verhuis- en inrichtingskosten. Voordat hij een beslissing geeft, waarin
      dit bedrag wordt vastgesteld, brengt de rechter zijn voornemen ter kennis van partijen en stelt hij een termijn
      waarbinnen de verhuurder de opzegging kan intrekken. Maakt de verhuurder van deze bevoegdheid gebruik, dan beslist
      de rechter uitsluitend omtrent de proceskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '274'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '276.1'
    text: |-
      Indien de verhuurder de overeenkomst heeft opgezegd op de grond, bedoeld in [artikel 274 lid 1 onder c][ref1] en
      de vordering tot beëindiging van de huurovereenkomst is toegewezen dan wel de huurder met de beëindiging heeft
      ingestemd, is de verhuurder jegens de huurder tot schadevergoeding gehouden, indien de wil om het verhuurde
      duurzaam in eigen gebruik te nemen in werkelijkheid niet aanwezig is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '274'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '276.2'
    text: |-
      Behoudens tegenbewijs wordt die wil geacht niet aanwezig te zijn geweest, indien niet binnen een jaar na het einde
      van de overeenkomst het verhuurde duurzaam door hem in gebruik is genomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel276
  - number: '276.3'
    text: |-
      De rechter die een vordering op de grond, bedoeld in [artikel 274 lid 1 onder c][ref1], toewijst, kan op verlangen
      van de huurder of ambtshalve een bedrag bepalen dat de verhuurder aan de huurder moet betalen, indien later mocht
      blijken dat de wil om het verhuurde duurzaam in eigen gebruik te nemen in werkelijkheid niet aanwezig is geweest,
      onverminderd het recht van de huurder op verdere schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel274
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '274'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '276.4'
    text: De vordering van de huurder op grond van dit artikel vervalt vijf jaren na het einde van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel276
  - number: '276.5'
    text: |-
      De verhuurder is eveneens tot schadevergoeding gehouden jegens onderhuurders aan wie bevoegdelijk is onderverhuurd
      of die krachtens [artikel 269][ref1] bevoegd waren hun overeenkomst met de hoofdverhuurder voort te zetten. De
      voorgaande leden zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel269
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '269'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '277.1'
    text: |-
      Indien de rechter de huurovereenkomst heeft verlengd, kan de verhuurder de overeenkomst opnieuw met
      inachtneming van [artikel 271][ref1] en van de in lid 2 vermelde termijnen opzeggen en overeenkomstig de
      [artikelen 272 tot en met 274][ref2] vorderen dat de rechter het tijdstip zal vaststellen, waarop de overeenkomst
      zal eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel272
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '271'
        paragraaf: Onderafdeling_4
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '272'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '277.2'
    text: |-
      Indien de rechter de overeenkomst voor onbepaalde tijd heeft verlengd, kan de verhuurder haar niet eerder opnieuw
      opzeggen dan drie jaren nadat deze beslissing onherroepelijk is geworden. Indien de rechter de overeenkomst voor
      bepaalde tijd heeft verlengd, kan de verhuurder haar niet eerder opzeggen dan drie maanden voor het einde van de
      tijd waarvoor is verlengd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel277
  - number: '278.1'
    text: |-
      Een onderhuurovereenkomst van woonruimte die niet krachtens [artikel 269][ref1] na beëindiging van de hoofdhuur
      door de hoofdverhuurder wordt voortgezet, eindigt op het door de rechter op vordering van de hoofdverhuurder
      overeenkomstig [artikel 273 lid 3][ref2] vastgestelde tijdstip van ontruiming.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel269
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel273
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '269'
        paragraaf: Onderafdeling_3
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '273'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '278.2'
    text: |-
      Indien de hoofdhuurder bij de beëindiging en de bepaling van het tijdstip van ontruiming onvoldoende voor de
      belangen van de onderhuurder heeft gewaakt, is hij verplicht de schade die de onderhuurder daardoor lijdt te
      vergoeden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel278
  - number: '278.3'
    text: |-
      De hoofdhuurder tegen wie door de hoofdverhuurder een vordering wordt ingesteld, die mede de belangen van de
      onderhuurder raakt, is bevoegd om deze in het geding te roepen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel278
  - number: '279.1'
    text: |-
      Indien een gebrek in de zin van [artikel 204][ref1] het deel van gehuurde woonruimte dat voor de huurder en zijn
      gezin voor bewoning noodzakelijk is, onbewoonbaar maakt dan wel werkzaamheden tot verhelpen van een zodanig gebrek
      dit doen of zullen doen, is de huurder bevoegd de huur op de voet van [artikel 267 van Boek 6][ref2] te ontbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel204
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel267
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel279
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '204'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '267'
  - number: '279.2'
    text: De huurder heeft dezelfde bevoegdheid, wanneer het gebruik van de gehuurde woonruimte gevaren oplevert.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel279
  - number: '279.3'
    text: |-
      [Artikel 210 lid 2][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel210
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel279
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '210'
        afdeling: '2'
  - number: '280'
    text: |-
      Alvorens op de voet van [artikel 231][ref1] een ontbinding uit te spreken, kan de rechter de huurder een termijn
      van ten hoogste een maand toestaan om alsnog aan zijn verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel231
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '231'
        afdeling: '4'
  - number: '281.1'
    text: |-
      Indien iemand op de voet van [artikel 226][ref1] verhuurder is geworden en een krachtens een geldend
      bestemmingsplan op het verhuurde liggende bestemming wil verwezenlijken, ontbindt de rechter op vordering van de
      verhuurder de huurovereenkomst met ingang van een door hem te bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
        afdeling: '4'
  - number: '281.2'
    text: |-
      De huurder en de onderhuurder aan wie bevoegdelijk is onderverhuurd of met wie de huurovereenkomst anders op
      de voet van [artikel 269][ref1] zou zijn voortgezet, hebben recht op schadeloosstelling. Wanneer de huurtijd
      of onderhuurtijd zonder de ontbinding nog een jaar of langer zou hebben geduurd, is de schadeloosstelling ten
      minste gelijk aan de huurprijs van twee jaren. Wanneer de huurtijd of onderhuurtijd zonder de ontbinding minder
      dan een jaar zou hebben geduurd, is de schadeloosstelling ten minste gelijk aan de huurprijs van een jaar.
      Bij de berekening van de schade wordt niet gelet op veranderingen die kennelijk zijn tot stand gebracht om de
      schadeloosstelling te verhogen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel269
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '269'
        paragraaf: Onderafdeling_3
        afdeling: '5'
  - number: '282'
    text: |-
      Van de [artikelen 272 tot en met 281][ref1] kan niet ten nadele van de huurder dan wel onderhuurder worden
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel272
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '272'
        paragraaf: Onderafdeling_4
        afdeling: '5'
  - number: '290.1'
    text: De bepalingen van deze afdeling zijn van toepassing op huur en verhuur van bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: '290.2'
    text: 'Onder bedrijfsruimte wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: 290.2.a
    text: |-
      een gebouwde onroerende zaak of gedeelte daarvan, die krachtens overeenkomst van huur en verhuur is bestemd voor
      de uitoefening van een kleinhandelsbedrijf, van een restaurant- of cafébedrijf, van een afhaal- of besteldienst of
      van een ambachtsbedrijf, een en ander indien in de verhuurde ruimte een voor het publiek toegankelijk lokaal voor
      rechtstreekse levering van roerende zaken of voor dienstverlening aanwezig is;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: 290.2.b
    text: |-
      een gebouwde onroerende zaak of gedeelte daarvan die krachtens zulk een overeenkomst bestemd is voor de uitoefening
      van een hotelbedrijf;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: 290.2.c
    text: een onroerende zaak die krachtens zulk een overeenkomst is bestemd voor de uitoefening van een kampeerbedrijf.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: '290.3'
    text: |-
      Tot de in lid 2 bedoelde bedrijfsruimte worden ook gerekend de onroerende aanhorigheden, de bij het een en ander
      behorende grond en de, mede gelet op de bestemming van die bedrijfsruimte, afhankelijke woning.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel290
  - number: '291.1'
    text: Van de bepalingen van deze afdeling kan niet ten nadele van de huurder worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel291
  - number: '291.2'
    text: |-
      Bedingen die ten nadele van de huurder afwijken van de bepalingen van deze afdeling, kunnen evenwel, behoudens
      wanneer het betreft een afwijking van [artikel 307][ref1], niet op die grond worden vernietigd, indien zij zijn
      goedgekeurd door de rechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel307
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel291
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '307'
        afdeling: '6'
  - number: '291.3'
    text: |-
      Ieder van de partijen kan een zodanige goedkeuring verzoeken. De goedkeuring wordt alleen gegeven indien het
      beding de rechten die de huurder aan deze afdeling ontleent, niet wezenlijk aantast of diens maatschappelijke
      positie in vergelijking met die van de verhuurder zodanig is dat hij de bescherming van de onderhavige afdeling in
      redelijkheid niet behoeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel291
  - number: '291.4'
    text: Het verzoek bevat, behalve de gronden waarop het berust, de tekst van de goed te keuren bedingen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel291
  - number: '292.1'
    text: |-
      De huurovereenkomst geldt voor vijf jaar of, als een langere bepaalde duur is overeengekomen, voor die langere
      duur.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel292
  - number: '292.2'
    text: |-
      De huurovereenkomst die voor vijf jaar geldt, wordt na het verstrijken daarvan van rechtswege met vijf jaar
      verlengd. De overeenkomst die is aangegaan voor een termijn die langer is dan vijf jaar maar korter dan tien jaar,
      wordt na het verstrijken van die termijn van rechtswege verlengd met een tweede termijn die zoveel korter is dan
      vijf jaar als de eerste termijn langer is dan vijf jaar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel292
  - number: '293.1'
    text: |-
      De overeenkomst die voor vijf jaar geldt, en de overeenkomst die is aangegaan voor een termijn langer
      dan vijf jaar, maar korter dan tien jaar, kunnen tegen het einde van de termijn en tegen het einde van
      de in [artikel 292 lid 2][ref1] bedoelde tweede termijn door ieder van de partijen worden opgezegd.
      [Artikel 228 lid 1 en lid 2, eerste zin][ref2], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel292
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel228
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel293
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '292'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '228'
        afdeling: '4'
  - number: '293.2'
    text: |-
      De opzegging moet geschieden bij exploot of bij aangetekende brief. De termijn van opzegging bedraagt tenminste
      een jaar.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel293
  - number: '293.3'
    text: |-
      Geen opzegging is vereist, indien de beëindiging geschiedt met wederzijds goedvinden, nadat de huurovereenkomst
      is totstandgekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel293
  - number: '294'
    text: Een opzegging door de verhuurder is nietig indien zij niet de gronden vermeldt die tot de opzegging hebben geleid.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel294
  - number: '295.1'
    text: |-
      Een opgezegde huurovereenkomst blijft, tenzij de huurder de overeenkomst heeft opgezegd of na de opzegging door
      de verhuurder schriftelijk in de beëindiging ervan heeft toegestemd, na de dag waartegen rechtsgeldig is opgezegd
      van rechtswege van kracht, tot de rechter onherroepelijk heeft beslist op een vordering van de verhuurderals in
      lid 2 bedoeld. De rechter kan evenwel, indien het verweer van de huurder hem kennelijk ongegrond voorkomt, zijn
      toewijzend vonnis uitvoerbaar bij voorraad verklaren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel295
  - number: '295.2'
    text: |-
      De verhuurder kan, indien hij zes weken na de opzegging niet van de huurder een schriftelijke mededeling heeft
      ontvangen dat hij in de beëindiging van de huurovereenkomst toestemt, op de gronden vermeld in de opzegging
      vorderen dat de rechter het tijdstip zal vaststellen waarop de overeenkomst zal eindigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel295
  - number: '296.1'
    text: |-
      Indien de opzegging is gedaan tegen het einde van de in [artikel 292 lid 1][ref1] bedoelde eerste termijn waarvoor
      de huurovereenkomst geldt of is aangegaan, kan de rechter de vordering slechts toewijzen, op de grond dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel292
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '292'
        afdeling: '6'
  - number: 296.1.a
    text: de bedrijfsvoering van de huurder niet is geweest zoals een goed huurder betaamt, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: 296.1.b
    text: |-
      de verhuurder aannemelijk maakt dat hij, zijn echtgenoot, zijn geregistreerde partner, een bloed- of aanverwant
      in de eerste graad of een pleegkind het verhuurde persoonlijk in duurzaam gebruik wil nemen en hij daartoe het
      verhuurde dringend nodig heeft. Onder duurzaam gebruik wordt niet begrepen vervreemding van de bedrijfsruimte, maar
      wel renovatie van de bedrijfsruimte die zonder beëindiging van de huur niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: '296.2'
    text: |-
      Een vordering, ingesteld op de in lid 1 onder b bedoelde grond, is niet toewijsbaar indien de verhuurder de
      rechtsopvolger is van een vorige verhuurder en hij niet is diens echtgenoot, geregistreerde partner, bloed- of
      aanverwant in de eerste graad of pleegkind, en de opzegging is geschied binnen drie jaar nadat de rechtopvolging
      schriftelijk ter kennis van de huurder is gebracht. Onder pleegkind wordt verstaan degene die duurzaam als eigen
      kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: '296.3'
    text: |-
      Indien de opzegging is gedaan tegen het einde van de termijn waarmee de overeenkomst krachtens
      [artikel 292 lid 2][ref1] is verlengd, kan de rechter de vordering toewijzen, op grond van een redelijke
      afweging van de belangen van de verhuurder bij beëindiging van de overeenkomst tegen die van de huurder en van
      de onderhuurder aan wie bevoegdelijk is onderverhuurd, bij verlenging van de overeenkomst. De rechter wijst de
      vordering in elk geval af indien van de huurder, bij een redelijke afweging van de voormelde belangen van hem en
      van de onderhuurder aan wie bevoegdelijk is onderverhuurd, tegen de voormelde belangen van de verhuurder, niet kan
      worden gevergd dat hij het gehuurde ontruimt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel292
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '292'
        afdeling: '6'
  - number: '296.4'
    text: |-
      In het geval van lid 3 wijst de rechter de vordering in ieder geval toe indien zich een der in lid 1, onder a en b,
      in samenhang met lid 2 omschreven gronden voordoet en voorts indien:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: 296.4.c
    text: |-
      de huurder niet toestemt in een redelijk aanbod tot het aangaan van een nieuwe overeenkomst met betrekking tot het
      gehuurde, voor zover dit aanbod niet een wijziging van de huurprijs inhoudt, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: 296.4.d
    text: de verhuurder een krachtens een geldig bestemmingsplan op het verhuurde liggende bestemming wil verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: '296.5'
    text: |-
      Indien de rechter de vordering toewijst, stelt hij tevens het tijdstip van de ontruiming vast. De toewijzing geldt
      als een veroordeling tot ontruiming tegen dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel296
  - number: '297.1'
    text: |-
      De rechter kan in zijn beslissing tot toewijzing van de vordering een bedrag vaststellen dat de verhuurder aan
      de huurder of aan degene aan wie bevoegdelijk is onderverhuurd, moet betalen ter tegemoetkoming in diens verhuis-
      en inrichtingskosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel297
  - number: '297.2'
    text: |-
      Alvorens een beslissing te geven waarin een bedrag als bedoeld in lid 1 wordt vastgesteld, brengt de rechter zijn
      voornemen ter kennis van partijen en stelt hij een termijn vast waarbinnen de verhuurder de bevoegdheid heeft de
      vordering in te trekken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel297
  - number: '297.3'
    text: |-
      Indien de verhuurder binnen deze termijn zijn vordering intrekt, geeft de rechter slechts een beslissing over de
      proceskosten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel297
  - number: '298'
    text: |-
      In het geval, bedoeld in [artikel 296 lid 4 onder c][ref1], kan de rechter de huurder een termijn toestaan van ten
      hoogste een maand om het aanbod tot het aangaan van een nieuwe overeenkomst alsnog te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel296
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel298
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
  - number: '299.1'
    text: |-
      Indien de overeenkomst is opgezegd op de grond dat een in [artikel 296 lid 1 onder b][ref1] genoemde persoon het
      verhuurde persoonlijk in duurzaam gebruik wil nemen en de huurder in de beëindiging van de overeenkomst heeft
      toegestemd dan wel de vordering tot beëindiging van de overeenkomst op die grond dan wel op de grond, bedoeld
      in [artikel 296 lid 3][ref2], is toegewezen, is de verhuurder jegens de huurder en degene die bevoegdelijk heeft
      ondergehuurd, tot schadevergoeding gehouden, indien de wil om het verhuurde persoonlijk in duurzaam gebruik te
      nemen in werkelijkheid niet aanwezig is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel296
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
  - number: '299.2'
    text: |-
      Behoudens tegenbewijs wordt die wil geacht niet aanwezig te zijn geweest, indien het verhuurde niet binnen een
      jaar na het einde van de overeenkomst door een persoon als bedoeld in [artikel 296 lid 1 onder b][ref1] in duurzaam
      gebruik is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel296
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
  - number: '299.3'
    text: |-
      De rechter kan in een beslissing tot toewijzing van een vordering tot beëindiging, gegrond op de in
      [artikel 296 lid 1 onder b][ref1] bedoelde wil van een der daar bedoelde personen, op verzoek van de huurder of
      ambtshalve een bedrag bepalen dat de verhuurder aan de huurder of degene die bevoegdelijk heeft ondergehuurd moet
      betalen, indien later mocht blijken dat die wil in werkelijkheid niet aanwezig is geweest, onverminderd het recht
      van de huurder op verdere schadevergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel296
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
  - number: '299.4'
    text: |-
      De vordering van de huurder of onderhuurder tot schadevergoeding of tot betaling van het in lid 3 bedoelde bedrag
      vervalt vijf jaren na het einde van de huurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel299
  - number: '300.1'
    text: |-
      Indien de oorspronkelijk duur van de overeenkomst krachtens [artikel 292 lid 2][ref1] is verlengd en de verlengde
      overeenkomst niet tegen het einde van de in dat lid bedoelde tweede termijn is opgezegd, wordt de overeenkomst
      voortgezet voor onbepaalde tijd, tenzij uit de overeenkomst een bepaalde tijd voortvloeit of partijen een bepaalde
      tijd overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel292
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '292'
        afdeling: '6'
  - number: '300.2'
    text: |-
      Wordt de overeenkomst krachtens lid 1 voor onbepaalde tijd voortgezet, dan kan zij door ieder van de partijen
      worden opgezegd. Wordt de overeenkomst voor bepaalde tijd voortgezet of is zij aangegaan voor een duur van tien
      jaar of langer, dan eindigt zij, in afwijking van [artikel 228 lid 1][ref1], niet door het enkele verloop van de
      huurtijd, maar kan zij door ieder van de partijen tegen het einde van die huurtijd worden opgezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel228
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '228'
        afdeling: '4'
  - number: '300.3'
    text: |-
      De opzegging moet voldoen aan de vereisten van de [artikelen 293 leden 2 en 3][ref1] en van [artikel 294][ref2]. De
      [artikelen 295 tot en met 299][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel293
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel294
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel295
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel300
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '293'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '294'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '295'
        afdeling: '6'
  - number: '300.4'
    text: |-
      Indien een vordering tot vaststelling van het tijdstip waarop de overeenkomst zal eindigen, is afgewezen, en uit
      de overeenkomst niet voortvloeit dat zij dan wordt voortgezet voor een bepaalde termijn tegen het einde waarvan zij
      opnieuw opgezegd kan worden, kan de overeenkomst slechts rechtsgeldig opnieuw opgezegd worden nadat een termijn van
      een jaar is verstreken nadat de afwijzing onherroepelijk is geworden. De rechter kan bij zijn afwijzende beslissing
      een langere termijn vaststellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel300
  - number: '301.1'
    text: |-
      De [artikelen 291 tot en met 300][ref1] zijn niet van toepassing op een overeenkomst van twee jaar of korter.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel291
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '291'
        afdeling: '6'
  - number: '301.2'
    text: |-
      Indien het gebruik, aangevangen krachtens een overeenkomst als bedoeld in lid 1, langer dan twee jaar heeft
      geduurd, geldt van rechtswege een overeenkomst op de tussen partijen overeengekomen voorwaarden, doch voor vijf
      jaar, waarop de reeds verstreken twee jaar in mindering komen. De [artikelen van 291 tot en met 300][ref1] zijn op
      deze overeenkomst van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel291
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '291'
        afdeling: '6'
  - number: '301.3'
    text: |-
      Het in lid 2 bedoelde rechtsgevolg treedt niet in, indien partijen voor het verstrijken van de termijn van twee
      jaar een andere overeenkomst sluiten die onder [artikel 292 lid 1][ref1] valt, dan wel een daarvan afwijkende
      overeenkomst, mits de in [artikel 291][ref2] bedoelde goedkeuring is verzocht voor het verstrijken van de termijn
      van twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel292
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel291
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '292'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '291'
        afdeling: '6'
  - number: '301.4'
    text: |-
      Indien voor het verstrijken van deze termijn op de voet van [artikel 291][ref1] goedkeuring van afwijkende
      bedingen is verzocht en de rechter dit verzoek afwijst, kan hij op verzoek van de verhuurder tevens bepalen dat
      de overeenkomst wordt beëindigd en het tijdstip van de ontruiming vaststellen. Deze vaststelling geldt als een
      veroordeling tot ontruiming tegen dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel291
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel301
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '291'
        afdeling: '6'
  - number: '302'
    text: |-
      Opzegging van de overeenkomst door de erfgenamen van de huurder, onderscheidenlijk zijn echtgenoot of
      geregistreerde partner, op de voet van [artikel 229 lid 2][ref1] dient te geschieden op een termijn van tenminste
      zes maanden. [Artikel 293 lid 2, eerste zin, en lid 3][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel229
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel293
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '229'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '293'
        afdeling: '6'
  - number: '303.1'
    text: |-
      Zowel de huurder als de verhuurder kunnen vorderen dat de rechter de huurprijs, zo deze niet overeenstemt met die
      van vergelijkbare bedrijfsruimte ter plaatse, nader zal vaststellen:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: 303.1.a
    text: indien de overeenkomst voor bepaalde tijd geldt, na afloop van de overeengekomen duur;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: 303.1.b
    text: |-
      in alle andere gevallen, telkens wanneer tenminste vijf jaar zijn verstreken sinds de dag waarop de laatste
      door partijen vastgestelde huurprijs is ingegaan of waarop de laatste door de rechter vastgestelde huurprijs is
      gevorderd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: '303.2'
    text: |-
      Bij de nadere vaststelling van de huurprijs let de rechter op het gemiddelde van de huurprijzen van vergelijkbare
      bedrijfsruimte ter plaatse, die zich hebben voorgedaan in een tijdvak van vijf jaren voorafgaande aan de dag van
      het instellen van de vordering. Iedere aldus in de vergelijking te betrekken huurprijs wordt herleid volgens de
      algemene ontwikkeling van het prijspeil sinds de dag waarop die huurprijs gold tot aan die van het instellen van
      de vordering. Zo het niet mogelijk is de rechter de voor de toepassing van deze maatstaf benodigde gegevens te
      verschaffen, maakt de rechter een schatting aan de hand van de wel te zijner beschikking staande gegevens, waarbij
      hij die maatstaf zoveel mogelijk als richtsnoer bezigt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: '303.3'
    text: |-
      De rechter wijst een vordering tot verhoging van de huurprijs af, voor zover deze is gegrond op verbeteringen van
      het gehuurde, die op kosten van de huurder zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: '303.4'
    text: |-
      Indien de rechter de huurprijs nader vaststelt, geldt deze met ingang van de dag waarop deze is gevorderd,
      tenzij hij op vordering van een der partijen op grond van de bijzondere omstandigheden van het geval een andere
      ingangsdatum vaststelt. Hij kan daarbij tevens bepalen dat de huurprijs gedurende een door hem vast te stellen
      termijn van ten hoogste vijf jaren geleidelijk zal worden aangepast.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel303
  - number: '304.1'
    text: |-
      Een vordering tot nadere huurprijsvaststelling is slechts ontvankelijk, indien deze vergezeld gaat van een advies
      omtrent de nadere huurprijs, opgesteld door een of meer door partijen gezamenlijk benoemde ter zake deskundigen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel304
  - number: '304.2'
    text: |-
      Indien partijen geen overeenstemming bereiken over de benoeming van een deskundige, benoemt de rechter deze op
      verzoek van de meest gerede partij. Indien een zodanig verzoek wordt gedaan, geldt de dag van dat verzoek voor de
      toepassing van [artikel 303 leden 1, 2 en 4][ref1] als de dag waarop de vordering tot nadere vaststelling van de
      huurprijs is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel303
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '303'
        afdeling: '6'
  - number: '304.3'
    text: |-
      De kosten van het advies zijn proceskosten als bedoeld in
      [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1]; de [artikelen 195][ref2], [196][ref3],
      [199][ref4] en [244 van dat wetboek][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel195
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel196
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel199
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel244
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '195'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '196'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '199'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '244'
  - number: '305.1'
    text: |-
      De verhuurder die in gevolge een aanschrijving als bedoeld in [artikel 17a, eerste lid, van de Woningwet][ref1]
      verbeteringen als bedoeld in het tweede lid van dat artikel heeft aangebracht, is, ook buiten de gevallen van
      [artikel 303 lid 1 onder a en b][ref2], bevoegd om ter doorberekening van de kosten van deze verbeteringen, voor
      zover redelijk, een daarop afgestemde verhoging van de huur te verlangen. Indien de huurder en de verhuurder geen
      overeenstemming hebben kunnen bereiken over het bedrag van de verhoging, kan ieder van hen vaststelling van de
      verhoging door de rechter vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel303
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '303'
        afdeling: '6'
  - number: '305.2'
    text: |-
      Dit artikel is, behalve op bedrijfsruimte in de zin van [artikel 290][ref1], ook van toepassing op een gebouwde
      onroerende zaak of gedeelte daarvan, indien deze zaak of dit gedeelte voor de uitoefening van een ander bedrijf is
      verhuurd dan waarop bedrijfsruimte in de zin van [artikel 290][ref2] betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel290
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
  - number: '306.1'
    text: |-
      Een onderhuurovereenkomst van bedrijfsruimte eindigt op het door de rechter op vordering van de hoofdverhuurder
      overeenkomstig [artikel 296 lid 5][ref1] vastgestelde tijdstip van ontruiming.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel296
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel306
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '296'
        afdeling: '6'
  - number: '306.2'
    text: |-
      Indien de hoofdhuurder de onderhuurder niet of niet juist heeft voorgelicht omtrent de termijn waarvoor de
      hoofdhuur geldt of is aangegaan, of hij bij de beëindiging van de hoofdhuur en de bepaling van het tijdstip van
      ontruiming onvoldoende voor de belangen van de onderhuurder heeft gewaakt, is hij verplicht de schade die de
      onderhuurder daardoor lijdt, te vergoeden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel306
  - number: '306.3'
    text: |-
      De hoofdhuurder tegen wie door de hoofdverhuurder een vordering wordt ingesteld, die mede de belangen van de
      onderhuurder raakt, is bevoegd om deze in het geding te roepen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel306
  - number: '307.1'
    text: |-
      Indien overdracht door de huurder aan een derde van het in het gehuurde door de huurder zelf of een ander
      uitgeoefende bedrijf gewenst wordt, kan de huurder vorderen dat hij gemachtigd wordt om die derde als huurder in
      zijn plaats te stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel307
  - number: '307.2'
    text: |-
      De rechter beslist met inachtneming van de omstandigheden van het geval, met dien verstande dat hij de vordering
      slechts kan toewijzen, indien de huurder of de ander die het bedrijf uitoefent, een zwaarwichtig belang heeft
      bij de overdracht van het bedrijf en dat hij haar steeds afwijst, indien de voorgestelde huurder niet voldoende
      waarborgen biedt voor een volledige nakoming van de overeenkomst en voor een behoorlijke bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel307
  - number: '307.3'
    text: De rechter kan aan de machtiging voorwaarden verbinden of daarbij een last opleggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel307
  - number: '308.1'
    text: |-
      Indien de verhuurder, nadat de huurovereenkomst door opzegging zijnerzijds is geëindigd, voordeel geniet tengevolge
      van het feit dat het verhuurde vervolgens wordt gebezigd voor de uitoefening van een bedrijf, gelijksoortig aan het
      door de gewezen huurder of de onderhuurder aan wie bevoegdelijk is onderverhuurd aldaar uitgeoefende bedrijf, kan
      de gewezen huurder of de onderhuurder aan wie bevoegdelijk is onderverhuurd van de verhuurder een naar billijkheid
      te berekenen vergoeding vorderen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel308
  - number: '308.2'
    text: |-
      Voordeel, voortvloeiend uit de aard of ligging van het verhuurde of uit de daaraan aangebrachte veranderingen, komt
      voor de toepassing van lid 1 niet in aanmerking.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel308
  - number: '308.3'
    text: |-
      De vergoeding kan niet worden toegekend, wanneer het verhuurde voor de uitoefening van het gelijksoortige bedrijf
      eerst wordt gebezigd nadat sedert het eindigen van de huurovereenkomst meer dan een jaar is verstreken
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel308
  - number: '309.1'
    text: |-
      Indien een verhuurder op wie de rechten en verplichtingen uit de huurovereenkomst op de voet van
      [artikel 226][ref1] zijn overgegaan, deze overeenkomst door opzegging doet eindigen in verband met de omstandigheid
      dat het gebouwde met het oog op de uitvoering van werken in het algemeen belang zal worden afgebroken, is hij
      aan de huurder en de onderhuurder aan wie voor die overgang bevoegdelijk is onderverhuurd, een schadeloosstelling
      verschuldigd wegens het verlies van de kans dat de huurverhouding zonder deze overgang zou hebben voortgeduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel309
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
        afdeling: '4'
  - number: '309.2'
    text: |-
      De verhuurder is de in lid 1 bedoelde schadeloosstelling eveneens verschuldigd indien de overgang is geschied
      nadat de vorige verhuurder de huurovereenkomst heeft opgezegd in verband met de omstandigheid dat na de overgang
      het gebouwde met het oog op de uitvoering van werken in het algemeen belang zal worden afgebroken. Is de eigendom
      van het verhuurde overgedragen nadat de huurovereenkomst reeds door de opzegging was geëindigd, dan is de
      schadeloosstelling verschuldigd door de eigenaar die tot afbraak overgaat.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel309
  - number: '309.3'
    text: |-
      Een opzegging wordt vermoed in verband met de omstandigheid dat het gebouwde met het oog op de uitvoering van
      werken in het algemeen belang zal worden afgebroken, indien de afbraak binnen zes jaar na de opzegging aanvangt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel309
  - number: '309.4'
    text: |-
      Werken tot verwezenlijking van een bestemmingsplan, strekkende tot reconstructie van een bebouwde kom, worden in
      elk geval geacht in het algemeen belang te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel309
  - number: '309.5'
    text: |-
      Dit artikel is, behalve op bedrijfsruimte in de zin van [artikel 290][ref1], ook van toepassing op een gebouwde
      onroerende zaak of gedeelte daarvan, indien deze zaak of dit gedeelte voor de uitoefening van een ander bedrijf is
      verhuurd dan waarop bedrijfsruimte in de zin van [artikel 290][ref2] betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel290
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel309
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
  - number: '310.1'
    text: |-
      Indien een verhuurder op wie de rechten en verplichtingen uit de huurovereenkomst op de voet van
      [artikel 226][ref1] zijn overgegaan, een krachtens een geldend bestemmingsplan op het verhuurde liggende bestemming
      wil verwezenlijken, ontbindt de rechter op vordering van de verhuurder de huurovereenkomst met ingang van een door
      hem te bepalen dag.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel226
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '226'
        afdeling: '4'
  - number: '310.2'
    text: |-
      De huurder en de onderhuurder aan wie bevoegdelijk is onderverhuurd, kunnen een schadeloosstelling vorderen.
      Bij de bepaling daarvan wordt rekening gehouden met de kans dat de huurverhouding zonder de overgang zou hebben
      voortgeduurd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel310
  - number: '310.3'
    text: |-
      Dit artikel is, behalve op bedrijfsruimte in de zin van [artikel 290][ref1], ook van toepassing op een gebouwde
      onroerende zaak of gedeelte daarvan, indien deze zaak of dit gedeelte voor de uitoefening van een ander bedrijf is
      verhuurd dan waarop bedrijfsruimte in de zin van [artikel 290][ref2] betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel290
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel290
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '290'
        afdeling: '6'
  - number: '400.1'
    text: |-
      De overeenkomst van opdracht is de overeenkomst waarbij de ene partij, de opdrachtnemer, zich jegens de andere
      partij, de opdrachtgever, verbindt anders dan op grond van een arbeidsovereenkomst werkzaamheden te verrichten
      die in iets anders bestaan dan het tot stand brengen van een werk van stoffelijke aard, het bewaren van zaken, het
      uitgeven van werken of het vervoeren of doen vervoeren van personen of zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel400
  - number: '400.2'
    text: |-
      De [artikelen 401-412][ref1] zijn, onverminderd [artikel 413][ref2], van toepassing, tenzij iets anders voortvloeit
      uit de wet, de inhoud of aard van de overeenkomst van opdracht of van een andere rechtshandeling, of de gewoonte.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel401
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel413
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel400
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '401'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '413'
        afdeling: '1'
  - number: '401'
    text: De opdrachtnemer moet bij zijn werkzaamheden de zorg van een goed opdrachtnemer in acht nemen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel401
  - number: '402.1'
    text: |-
      De opdrachtnemer is gehouden gevolg te geven aan tijdig verleende en verantwoorde aanwijzingen omtrent de
      uitvoering van de opdracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel402
  - number: '402.2'
    text: |-
      De opdrachtnemer die op redelijke grond niet bereid is de opdracht volgens de hem gegeven aanwijzingen uit
      te voeren, kan, zo de opdrachtgever hem niettemin aan die aanwijzingen houdt, de overeenkomst opzeggen wegens
      gewichtige redenen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel402
  - number: '403.1'
    text: |-
      De opdrachtnemer moet de opdrachtgever op de hoogte houden van zijn werkzaamheden ter uitvoering van de opdracht en
      hem onverwijld in kennis stellen van de voltooiing van de opdracht, indien de opdrachtgever daarvan onkundig is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel403
  - number: '403.2'
    text: |-
      De opdrachtnemer doet aan de opdrachtgever verantwoording van de wijze waarop hij zich van de opdracht heeft
      gekweten. Heeft hij bij de uitvoering van de opdracht ten laste van de opdrachtgever gelden uitgegeven of te diens
      behoeve gelden ontvangen, dan doet hij daarvan rekening.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel403
  - number: '404'
    text: |-
      Indien de opdracht is verleend met het oog op een persoon die met de opdrachtnemer of in zijn dienst een beroep
      of een bedrijf uitoefent, is die persoon gehouden de werkzaamheden, nodig voor de uitvoering van de opdracht, zelf
      te verrichten, behoudens voor zover uit de opdracht voortvloeit dat hij deze onder zijn verantwoordelijkheid door
      anderen mag laten uitvoeren; alles onverminderd de aansprakelijkheid van de opdrachtnemer.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel404
  - number: '405.1'
    text: |-
      Indien de overeenkomst door de opdrachtnemer in de uitoefening van zijn beroep of bedrijf is aangegaan, is de
      opdrachtgever hem loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel405
  - number: '405.2'
    text: |-
      Indien loon is verschuldigd doch de hoogte niet door partijen is bepaald, is de opdrachtgever het op de
      gebruikelijke wijze berekende loon of, bij gebreke daarvan, een redelijk loon verschuldigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel405
  - number: '406.1'
    text: |-
      De opdrachtgever moet aan de opdrachtnemer de onkosten verbonden aan de uitvoering van de opdracht vergoeden, voor
      zover deze niet in het loon zijn begrepen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel406
  - number: '406.2'
    text: |-
      De opdrachtgever moet de opdrachtnemer de schade vergoeden die deze lijdt ten gevolge van de hem niet toe
      te rekenen verwezenlijking van een aan de opdracht verbonden bijzonder gevaar. Heeft de opdrachtnemer in de
      uitoefening van zijn beroep of bedrijf gehandeld, dan geldt de vorige zin slechts, indien dat gevaar de risico’s
      welke de uitoefening van dat beroep of bedrijf naar zijn aard meebrengt, te buiten gaat. Geschiedt de uitvoering
      van de opdracht anderszins tegen loon, dan is de eerste zin slechts van toepassing, indien bij de vaststelling van
      het loon met het gevaar geen rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel406
  - number: '407.1'
    text: |-
      Indien twee of meer personen tezamen een opdracht hebben gegeven, zijn zij hoofdelijk tegenover de opdrachtnemer
      verbonden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel407
  - number: '407.2'
    text: |-
      Indien twee of meer personen tezamen een opdracht hebben ontvangen, is ieder van hen voor het geheel aansprakelijk
      ter zake van een tekortkoming in de nakoming, tenzij de tekortkoming niet aan hem kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel407
  - number: '408.1'
    text: De opdrachtgever kan te allen tijde de overeenkomst opzeggen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel408
  - number: '408.2'
    text: |-
      De opdrachtnemer die de overeenkomst is aangegaan in de uitoefening van een beroep of bedrijf, kan, behoudens
      gewichtige redenen, de overeenkomst slechts opzeggen, indien zij voor onbepaalde duur geldt en niet door
      volbrenging eindigt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel408
  - number: '408.3'
    text: |-
      Een natuurlijk persoon die een opdracht heeft verstrekt anders dan in de uitoefening van een beroep of bedrijf, is,
      onverminderd [artikel 406][ref1], ter zake van een opzegging geen schadevergoeding verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel406
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel408
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '406'
        afdeling: '1'
  - number: '409.1'
    text: Indien de opdracht met het oog op een bepaalde persoon is verleend, eindigt zij door zijn dood.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel409
  - number: '409.2'
    text: |-
      Alsdan zijn diens erfgenamen, indien zij kennis dragen van de erfopvolging en van de opdracht, verplicht al datgene
      te doen wat de omstandigheden in het belang van de wederpartij eisen. Een overeenkomstige verplichting rust op
      degenen in wier dienst of met wie de opdrachtnemer een beroep of bedrijf uitoefende.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel409
  - number: '410.1'
    text: |-
      De dood van de opdrachtgever doet de opdracht slechts eindigen, indien dit uit de overeenkomst voortvloeit, en dan
      eerst vanaf het tijdstip waarop de opdrachtnemer de dood heeft gekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel410
  - number: '410.2'
    text: |-
      Eindigt de opdracht door de dood van de opdrachtgever, dan is de opdrachtnemer niettemin verplicht al datgene te
      doen wat de omstandigheden in het belang van de wederpartij eisen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel410
  - number: '411.1'
    text: |-
      Indien de overeenkomst eindigt voordat de opdracht is volbracht of de tijd waarvoor zij is verleend, is verstreken,
      en de verschuldigdheid van loon afhankelijk is van de volbrenging of van het verstrijken van die tijd, heeft de
      opdrachtnemer recht op een naar redelijkheid vast te stellen deel van het loon. Bij de bepaling hiervan wordt
      onder meer rekening gehouden met de reeds door de opdrachtnemer verrichte werkzaamheden, het voordeel dat de
      opdrachtgever daarvan heeft, en de grond waarop de overeenkomst is geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel411
  - number: '411.2'
    text: |-
      In het in lid 1 bedoelde geval heeft de opdrachtnemer slechts recht op het volle loon, indien het einde van de
      overeenkomst aan de opdrachtgever is toe te rekenen en de betaling van het volle loon, gelet op alle omstandigheden
      van het geval, redelijk is. Op het bedrag van het loon worden de besparingen die voor de opdrachtnemer uit de
      voortijdige beëindiging voortvloeien, in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel411
  - number: '412'
    text: |-
      Een rechtsvordering tegen de opdrachtnemer tot afgifte van de stukken die hij ter zake van de opdracht onder
      zich heeft gekregen, verjaart door verloop van vijf jaren na de aanvang van de dag, volgende op die waarop zijn
      bemoeiingen zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel412
  - number: '413.1'
    text: |-
      Van [artikel 408 lid 3][ref1] kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '413.2'
    text: |-
      Van de [artikelen 408 lid 1][ref1] en [411][ref2] kan niet worden afgeweken ten nadele van een opdrachtgever als
      bedoeld in [artikel 408 lid 3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel411
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '411'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '413.3'
    text: |-
      Van [artikel 412][ref1] kan slechts op dezelfde voet worden afgeweken als van de regels inzake de verjaring van
      rechtsvorderingen die in [titel 11 van Boek 3][ref2] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel412
      [ref2]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel413
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '412'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
  - number: '414.1'
    text: |-
      Lastgeving is de overeenkomst van opdracht waarbij de ene partij, de lasthebber, zich jegens de andere partij, de
      lastgever, verbindt voor rekening van de lastgever een of meer rechtshandelingen te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel414
  - number: '414.2'
    text: |-
      De overeenkomst kan de lasthebber verplichten te handelen in eigen naam; zij kan ook verplichten te handelen in
      naam van de lastgever.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel414
  - number: '415'
    text: Indien een lastgeving met twee of meer lasthebbers is aangegaan, is ieder van hen bevoegd zelfstandig te handelen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel415
  - number: '416.1'
    text: |-
      Een lasthebber kan slechts als wederpartij van de lastgever optreden, indien de inhoud van de rechtshandeling zo
      nauwkeurig vaststaat dat strijd tussen beider belangen is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel416
  - number: '416.2'
    text: |-
      Een lasthebber die slechts in eigen naam mag handelen, kan niettemin als wederpartij van de lastgever optreden,
      indien de inhoud van de rechtshandeling zo nauwkeurig vaststaat dat strijd tussen beider belangen is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel416
  - number: '416.3'
    text: |-
      Indien de lastgever een persoon is als bedoeld in [artikel 408 lid 3][ref1], is voor een rechtshandeling waarbij de
      lasthebber als zijn wederpartij optreedt, op straffe van vernietigbaarheid zijn schriftelijke toestemming vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel416
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '416.4'
    text: |-
      De lasthebber die in overeenstemming met de vorige leden als wederpartij van de lastgever optreedt, behoudt zijn
      recht op loon.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel416
  - number: '417.1'
    text: |-
      Een lasthebber mag slechts tevens als lasthebber van de wederpartij optreden, indien de inhoud van de
      rechtshandeling zo nauwkeurig vaststaat dat strijd tussen de belangen van beide lastgevers is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel417
  - number: '417.2'
    text: |-
      Indien de lastgever een persoon is als bedoeld in [artikel 408 lid 3][ref1], is voor de geoorloofdheid van
      een rechtshandeling waarbij de lasthebber ook als lasthebber van de wederpartij optreedt, zijn schriftelijke
      toestemming vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '417.3'
    text: |-
      Een lasthebber heeft geen recht op loon jegens een lastgever ten opzichte van wie hij in strijd met het in de
      vorige leden bepaalde handelt, onverminderd zijn gehoudenheid tot vergoeding van de dientengevolge door die
      lastgever geleden schade. Van deze bepaling kan niet ten nadele van een lastgever worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel417
  - number: '417.4'
    text: |-
      Indien een der lastgevers een persoon is als bedoeld in [artikel 408 lid 3][ref1], en de rechtshandeling strekt tot
      koop of verkoop dan wel huur of verhuur van een onroerende zaak of een gedeelte daarvan of van een recht waaraan de
      zaak is onderworpen, heeft de lasthebber geen recht op loon jegens de koper of huurder. Van deze bepaling kan niet
      ten nadele van de koper of huurder worden afgeweken, tenzij de rechtshandeling strekt tot huur of verhuur van een
      tot woonruimte bestemd gedeelte van een zelfstandige woning.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel417
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: '418.1'
    text: |-
      Heeft, buiten de gevallen bedoeld in de [artikelen 416][ref1] en [417][ref2], een lasthebber direct of indirect
      belang bij de totstandkoming van de rechtshandeling, dan is hij verplicht de lastgever daarvan in kennis te
      stellen, tenzij de inhoud van de rechtshandeling zo nauwkeurig vaststaat dat strijd tussen beider belangen is
      uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel416
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel417
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '416'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '417'
        afdeling: '2'
  - number: '418.2'
    text: |-
      Een lasthebber heeft geen recht op loon jegens een lastgever ten opzichte van wie hij in strijd met het in lid 1
      bepaalde handelt, onverminderd zijn gehoudenheid tot vergoeding van de dientengevolge door de lastgever geleden
      schade. Van deze bepaling kan niet ten nadele van de lastgever worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel418
  - number: '419'
    text: |-
      Indien een lasthebber in eigen naam een overeenkomst heeft gesloten met een derde die in de nakoming van
      zijn verplichtingen tekortschiet, is de derde binnen de grenzen van hetgeen omtrent zijn verplichting tot
      schadevergoeding overigens uit de wet voortvloeit, jegens de lasthebber mede gehouden tot vergoeding van de schade
      die de lastgever door de tekortkoming heeft geleden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel419
  - number: '420.1'
    text: |-
      Indien een lasthebber die in eigen naam een overeenkomst heeft gesloten met een derde, zijn verplichtingen
      jegens de lastgever niet nakomt, in staat van faillissement geraakt of indien ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing wordt verklaard, kan de lastgever de voor overgang
      vatbare rechten van de lasthebber jegens de derde door een schriftelijke verklaring aan hen beiden op zich doen
      overgaan, behoudens voor zover zij in de onderlinge verhouding tussen lastgever en lasthebber aan deze laatste
      toekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel420
  - number: '420.2'
    text: |-
      Dezelfde bevoegdheid heeft de lastgever indien de derde zijn verplichtingen tegenover de lasthebber niet nakomt,
      tenzij deze de lastgever voldoet alsof de derde zijn verplichtingen was nagekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel420
  - number: '420.3'
    text: |-
      De lasthebber is in de gevallen in dit artikel bedoeld gehouden de naam van de derde aan de lastgever op diens
      verzoek mede te delen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel420
  - number: '421.1'
    text: |-
      Indien een lasthebber die in eigen naam een overeenkomst heeft gesloten met een derde, zijn verplichtingen jegens
      de derde niet nakomt, in staat van faillissement geraakt of indien ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing wordt verklaard, kan de derde na schriftelijke mededeling aan de lasthebber en
      de lastgever zijn rechten uit de overeenkomst tegen de lastgever uitoefenen, voor zover deze op het tijdstip van de
      mededeling op overeenkomstige wijze jegens de lasthebber gehouden is.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel421
  - number: '421.2'
    text: |-
      De lasthebber is in het geval in dit artikel bedoeld gehouden de naam van de lastgever aan de derde op diens
      verzoek mede te delen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel421
  - number: '422.1'
    text: |-
      Lastgeving eindigt, behalve door opzegging overeenkomstig [artikel 408][ref1], door:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
  - number: 422.1.a
    text: |-
      de dood, de ondercuratelestelling, het faillissement van de lastgever of het ten aanzien van hem van
      toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, met dien verstande dat de dood of de
      ondercuratelestelling de overeenkomst doet eindigen op het tijdstip waarop de lasthebber daarvan kennis krijgt;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
  - number: 422.1.b
    text: |-
      de dood, de ondercuratelestelling, het faillissement van de lasthebber of het ten aanzien van hem van toepassing
      verklaren van de schuldsaneringsregeling natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
  - number: '422.2'
    text: |-
      Van [artikel 408 lid 1][ref1] voor zover van toepassing op lastgeving, en van lid 1 onder *a* kan niet
      worden afgeweken. Voor zover de overeenkomst strekt tot het verrichten van een rechtshandeling in het
      belang van de lasthebber of van een derde, kan echter worden bepaald dat zij niet door de lastgever
      kan worden opgezegd, of dat zij niet eindigt door de dood of de ondercuratelestelling van de lastgever.
      [Artikel 74 leden 1, tweede zin, 2 en 4 van Boek 3][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel408
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '408'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '74'
  - number: '422.3'
    text: |-
      Eindigt de lastgeving door de dood of de ondercuratelestelling van de lastgever, dan is de lasthebber niettemin
      verplicht al datgene te doen wat de omstandigheden in het belang van de wederpartij eisen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
  - number: '422.4'
    text: |-
      Eindigt de lastgeving door de dood van de lasthebber, dan zijn diens erfgenamen, indien zij kennis dragen van
      de erfopvolging en van de lastgeving, verplicht al datgene te doen wat de omstandigheden in het belang van de
      wederpartij eisen. Een overeenkomstige verplichting rust op degenen in wier dienst of met wie de lasthebber een
      beroep of bedrijf uitoefende.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel422
  - number: '423.1'
    text: |-
      Indien is bedongen dat de lasthebber een aan de lastgever toekomend recht in eigen naam en met uitsluiting van de
      lastgever zal uitoefenen, mist deze de bevoegdheid tot deze uitoefening voor de duur van de overeenkomst ook jegens
      derden. De uitsluiting kan niet worden tegengeworpen aan derden die haar kenden noch behoorden te kennen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel423
  - number: '423.2'
    text: |-
      Indien de lasthebber die de uitsluiting bedong, een rechtspersoon is die zich ingevolge zijn statuten ten
      doel stelt de gezamenlijke belangen van meer lastgevers door de uitoefening van de aan hen toekomende rechten
      te behartigen, kan in afwijking van [artikel 422 lid 2][ref1] worden overeengekomen dat de lastgeving niet
      zal eindigen door opzegging door de lastgever op een termijn die minder dan een jaar bedraagt, noch door
      diens dood, ondercuratelestelling, faillissement of het ten aanzien van hem van toepassing verklaren van de
      schuldsaneringsregeling natuurlijke personen. Dit beding sluit niet uit dat de overeenkomst op een termijn van
      tenminste één maand kan worden opgezegd door de erfgenamen van de lastgever of, in geval van diens faillissement
      of ondercuratelestelling, door de curator dan wel, indien ten aanzien van de lastgever de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, door de bewindvoerder. Wanneer de nalatenschap van de lastgever
      ingevolge [artikel 13 van Boek 4][ref2] wordt verdeeld, komt de bevoegdheid van de erfgenamen, bedoeld in de vorige
      zin, toe aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel422
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '422'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '424.1'
    text: |-
      De [artikelen 415-423][ref1] zijn van overeenkomstige toepassing op andere overeenkomsten dan lastgeving krachtens
      welke de ene partij verplicht of bevoegd is voor rekening van de andere partij rechtshandelingen te verrichten,
      voor zover de strekking van de betrokken bepalingen in verband met de aard van de overeenkomst zich daartegen niet
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel415
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel424
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '415'
        afdeling: '2'
  - number: '424.2'
    text: Het vorige lid is niet van toepassing op overeenkomsten tot het vervoeren of doen vervoeren van personen of zaken.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel424
  - number: '425'
    text: |-
      De bemiddelingsovereenkomst is de overeenkomst van opdracht waarbij de ene partij, de opdrachtnemer, zich tegenover
      de andere partij, de opdrachtgever, verbindt tegen loon als tussenpersoon werkzaam te zijn bij het tot stand
      brengen van een of meer overeenkomsten tussen de opdrachtgever en derden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel425
  - number: '426.1'
    text: |-
      De tussenpersoon heeft recht op loon zodra door zijn bemiddeling de overeenkomst tussen de opdrachtgever en de
      derde is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel426
  - number: '426.2'
    text: |-
      Indien het recht op loon afhankelijk is gesteld van de uitvoering van de bemiddelde overeenkomst en deze
      overeenkomst niet wordt uitgevoerd, is de opdrachtgever het loon ook verschuldigd, tenzij de niet-uitvoering niet
      aan hem kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel426
  - number: '427'
    text: |-
      De [artikelen 417][ref1] en [418][ref2] zijn van overeenkomstige toepassing op overeenkomsten waarbij de
      ene partij jegens de andere partij verplicht of bevoegd is als tussenpersoon werkzaam te zijn als bedoeld in
      [artikel 425][ref3], met dien verstande dat met een tussenpersoon die tevens werkzaam is voor de wederpartij,
      gelijkgesteld is een tussenpersoon die zelf als wederpartij optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel417
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel418
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel425
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '417'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '418'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '425'
        afdeling: '3'
  - number: '428.1'
    text: |-
      De agentuurovereenkomst is een overeenkomst waarbij de ene partij, de principaal, aan de andere partij, de
      handelsagent, opdraagt, en deze zich verbindt, voor een bepaalde of een onbepaalde tijd en tegen beloning bij
      de totstandkoming van overeenkomsten bemiddeling te verlenen, en deze eventueel op naam en voor rekening van de
      principaal te sluiten zonder aan deze ondergeschikt te zijn.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel428
  - number: '428.2'
    text: |-
      De bepalingen van deze afdeling zijn niet van toepassing op agentuurovereenkomsten waarop de
      [Wet financiële dienstverlening][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018329
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel428
    references:
      - id: ref1
        bwb_id: BWBR0018329
  - number: '428.3'
    text: |-
      Ieder der partijen is verplicht de wederpartij op haar verzoek een ondertekend geschrift te verschaffen dat de dan
      geldende inhoud van de agentuurovereenkomst weergeeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel428
  - number: '429.1'
    text: |-
      De handelsagent kan zich voor verplichtingen die voor derden uit een door hem bemiddelde of afgesloten overeenkomst
      voortvloeien, uitsluitend schriftelijk aansprakelijk stellen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel429
  - number: '429.2'
    text: |-
      Tenzij schriftelijk anders is overeengekomen, is de handelsagent krachtens een beding van delcredere slechts
      aansprakelijk voor de gegoedheid van de derde.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel429
  - number: '429.3'
    text: |-
      Hij kan zich niet aansprakelijk stellen tot een hoger bedrag dan de overeengekomen provisie, tenzij het beding
      betrekking heeft op een bepaalde overeenkomst of op overeenkomsten die hij zelf in naam van de principaal sluit.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel429
  - number: '429.4'
    text: |-
      Indien er een kennelijke wanverhouding is tussen het risico dat de handelsagent op zich heeft genomen, en de
      bedongen provisie, kan de rechter het bedrag waarvoor de handelsagent aansprakelijk is, matigen, voor zover dit
      bedrag de provisie te boven gaat. De rechter houdt met alle omstandigheden rekening, in het bijzonder met de wijze
      waarop de handelsagent de belangen van de principaal heeft behartigd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel429
  - number: '430.1'
    text: |-
      De principaal moet alles doen wat in de gegeven omstandigheden van zijn kant nodig is om de handelsagent in staat
      te stellen zijn werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel430
  - number: '430.2'
    text: |-
      Hij moet aan de handelsagent het nodige documentatiemateriaal ter beschikking stellen over de goederen en diensten
      waarvoor de handelsagent bemiddelt, en hem alle inlichtingen verschaffen die nodig zijn voor de uitvoering van
      de agentuurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel430
  - number: '430.3'
    text: |-
      Hij is verplicht de handelsagent onverwijld te waarschuwen, indien hij voorziet dat in een uitgesproken geringere
      mate dan de handelsagent mocht verwachten, overeenkomsten zullen of mogen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel430
  - number: '430.4'
    text: |-
      Hij moet de handelsagent binnen een redelijke termijn op de hoogte stellen van zijn aanvaarding of weigering of de
      niet-uitvoering van een door de handelsagent aangebrachte overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel430
  - number: '431.1'
    text: |-
      De handelsagent heeft recht op provisie voor de overeenkomsten die tijdens de duur der agentuurovereenkomst zijn
      tot stand gekomen:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: 431.1.a
    text: indien de overeenkomst door zijn tussenkomst is tot stand gekomen;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: 431.1.b
    text: |-
      indien de overeenkomst is tot stand gekomen met iemand die hij reeds vroeger voor een dergelijke overeenkomst had
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: 431.1.c
    text: |-
      indien de overeenkomst is afgesloten met iemand die behoort tot de klantenkring die, of gevestigd is in het gebied
      dat aan de handelsagent is toegewezen, tenzij uitdrukkelijk is overeengekomen dat de handelsagent ten aanzien van
      die klantenkring of in dat gebied niet het alleenrecht heeft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: '431.2'
    text: |-
      De handelsagent heeft recht op provisie voor de voorbereiding van na het einde van de agentuurovereenkomst tot
      stand gekomen overeenkomsten:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: 431.2.a
    text: |-
      indien deze hoofdzakelijk aan de tijdens de duur van de agentuurovereenkomst door hem verrichte werkzaamheden zijn
      te danken en binnen een redelijke termijn na de beëindiging van die overeenkomst zijn afgesloten, of
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: 431.2.b
    text: |-
      indien hij of de principaal, overeenkomstig de voorwaarden bepaald in het eerste lid, de bestelling van de derde
      heeft ontvangen voor de beëindiging van de agentuurovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: '431.3'
    text: |-
      De handelsagent heeft geen recht op provisie, indien deze krachtens het tweede lid is verschuldigd aan zijn
      voorganger, tenzij uit de omstandigheden voortvloeit dat het billijk is de provisie tussen hen beiden te verdelen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel431
  - number: '432.1'
    text: |-
      Indien de rol van de handelsagent zich heeft beperkt tot het verlenen van bemiddeling bij de totstandkoming van
      de overeenkomst, wordt de order die hij aan zijn principaal heeft doen toekomen, voor wat betreft het recht op
      provisie krachtens [artikel 426][ref1] geacht te zijn aanvaard, tenzij de principaal de handelsagent binnen de
      redelijke termijn, bedoeld in [artikel 430 lid 4][ref2], mededeelt dat hij de order weigert of een voorbehoud
      maakt. Bij gebreke van een in de agentuurovereenkomst bepaalde termijn bedraagt de termijn een maand vanaf het
      tijdstip waarop hem de order is medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel426
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel430
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '426'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '430'
        afdeling: '4'
  - number: '432.2'
    text: |-
      Het beding dat het recht op provisie doet afhangen van de uitvoering van de overeenkomst, dient uitdrukkelijk te
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel432
  - number: '432.3'
    text: |-
      Indien het beding, bedoeld in het tweede lid, is gemaakt, ontstaat het recht op provisie uiterlijk wanneer de
      derde zijn deel van de overeenkomst heeft uitgevoerd, of dit had moeten doen, indien de principaal zijn deel van de
      transactie had uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel432
  - number: '433.1'
    text: |-
      De principaal is verplicht na afloop van iedere maand aan de handelsagent een schriftelijke opgave te verstrekken
      van de over die maand verschuldigde provisie, onder vermelding van de gegevens waarop de berekening berust; deze
      opgave moet worden verstrekt voor het einde van de volgende maand. Partijen kunnen schriftelijk overeenkomen dat de
      opgave twee- of driemaandelijks wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel433
  - number: '433.2'
    text: |-
      De handelsagent is bevoegd van de principaal inzage te verlangen van de nodige bewijsstukken, echter zonder afgifte
      te kunnen verlangen. Hij kan zich op zijn kosten doen bijstaan door een deskundige, aanvaard door de principaal of,
      bij afwijzing, benoemd door de voorzieningenrechter van de bevoegde rechtbank op verzoek van de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel433
  - number: '433.3'
    text: |-
      Echter kunnen partijen schriftelijk overeenkomen dat de inzage van de bewijsstukken zal geschieden aan een derde;
      indien deze zijn taak niet vervult, zal de voorzieningenrechter van de rechtbank een plaatsvervanger aanwijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel433
  - number: '433.4'
    text: |-
      De overlegging van de bewijsstukken door de principaal geschiedt onder verplichting tot geheimhouding door de
      handelsagent en in de vorige leden vermelde personen. Deze laatsten zijn echter niet verplicht tot geheimhouding
      tegenover de handelsagent voor zover het betreft een in het eerste lid bedoeld gegeven.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel433
  - number: '434'
    text: |-
      De provisie wordt uiterlijk opeisbaar op het tijdstip waarop de schriftelijke opgave, bedoeld in
      [artikel 433][ref1], moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel433
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '433'
        afdeling: '4'
  - number: '435.1'
    text: |-
      De handelsagent heeft recht op een beloning, indien hij bereid is zijn verplichtingen uit de agentuurovereenkomst
      na te komen of deze reeds heeft nagekomen, doch de principaal van de diensten van de handelsagent geen gebruik
      heeft gemaakt of in aanzienlijk geringere mate gebruik heeft gemaakt dan deze als normaal mocht verwachten, tenzij
      de gedraging van de principaal voortvloeit uit omstandigheden welke redelijkerwijs niet voor zijn rekening komen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel435
  - number: '435.2'
    text: |-
      Bij de bepaling van deze beloning wordt rekening gehouden met het bedrag van de in de voorafgaande tijd verdiende
      provisie en met alle andere ter zake in acht te nemen factoren, zoals de onkosten die de handelsagent zich door het
      niet verrichten van werkzaamheden bespaart.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel435
  - number: '436'
    text: |-
      Een agentuurovereenkomst die na het verstrijken van de termijn waarvoor zij is aangegaan, door beide partijen wordt
      voortgezet, bindt partijen voor onbepaalde tijd op dezelfde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel436
  - number: '437.1'
    text: |-
      Indien de agentuurovereenkomst is aangegaan voor een onbepaalde tijd of voor een bepaalde tijd met recht van
      tussentijdse opzegging, is ieder der partijen bevoegd haar te doen eindigen met inachtneming van de overeengekomen
      opzeggingstermijn. Bij gebreke van een overeenkomst dienaangaande zal de opzeggingstermijn vier maanden bedragen,
      vermeerderd met een maand na drie jaren looptijd van de overeenkomst en met twee maanden na zes jaren.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel437
  - number: '437.2'
    text: |-
      De termijn van opzegging kan niet korter zijn dan een maand in het eerste jaar van de overeenkomst, twee maanden
      in het tweede jaar en drie maanden in de volgende jaren. Indien partijen langere termijnen overeenkomen, mogen deze
      voor de principaal niet korter zijn dan voor de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel437
  - number: '437.3'
    text: Opzegging behoort plaats te vinden tegen het einde van een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel437
  - number: '438.1'
    text: De agentuurovereenkomst eindigt door het overlijden van de handelsagent.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel438
  - number: '438.2'
    text: |-
      In geval van overlijden van de principaal zijn zowel zijn erfgenamen als de handelsagent bevoegd, mits binnen negen
      maanden na het overlijden, de overeenkomst te doen eindigen met een opzeggingstermijn van vier maanden. Wanneer de
      nalatenschap van de principaal ingevolge [artikel 13 van Boek 4][ref1] wordt verdeeld, komt de bevoegdheid van de
      erfgenamen, bedoeld in de vorige zin, toe aan zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel13
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel438
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '13'
  - number: '439.1'
    text: |-
      De partij die de overeenkomst beëindigt zonder eerbiediging van haar duur of zonder inachtneming van de wettelijke
      of overeengekomen opzeggingstermijn en zonder dat de wederpartij daarin toestemt, is schadeplichtig, tenzij zij de
      overeenkomst doet eindigen om een dringende, aan de wederpartij onverwijld medegedeelde reden.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel439
  - number: '439.2'
    text: |-
      Dringende redenen zijn omstandigheden van zodanige aard dat van de partij die de overeenkomst doet eindigen,
      redelijkerwijs niet gevergd kan worden de overeenkomst, zelfs tijdelijk, in stand te laten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel439
  - number: '439.3'
    text: |-
      Indien de beëindiging van de overeenkomst wegens een dringende reden gegrond is op omstandigheden waarvoor de
      wederpartij een verwijt treft, is laatstgenoemde schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel439
  - number: '439.4'
    text: |-
      Een beding waardoor aan een der partijen de beslissing wordt overgelaten of er een dringende reden aanwezig is,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel439
  - number: '440.1'
    text: |-
      Ieder der beide partijen is bevoegd de kantonrechter te verzoeken de agentuurovereenkomst te ontbinden op grond
      van:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
  - number: 440.1.a
    text: |-
      omstandigheden die een dringende reden opleveren in de zin van [artikel 439 lid 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
  - number: 440.1.b
    text: |-
      verandering in de omstandigheden welke van dien aard is, dat de billijkheid eist dat aan de overeenkomst dadelijk
      of na korte tijd een einde wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
  - number: '440.2'
    text: |-
      Spreekt de rechter de ontbinding uit op grond van een omstandigheid als bedoeld in het eerste lid onder *a* en kan
      van deze omstandigheid de verweerder een verwijt worden gemaakt, dan is deze schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
  - number: '440.3'
    text: |-
      Spreekt de rechter de ontbinding uit op grond van hetgeen is bepaald in het eerste lid onder *b*, dan kan hij aan
      een der partijen een vergoeding toekennen. Hij kan bepalen dat deze in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
  - number: '440.4'
    text: |-
      [Het vijfde, zesde, zevende, negende, tiende en elfde lid van artikel 685 van Boek 7][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
        afdeling: '9'
  - number: '441.1'
    text: |-
      De partij die, krachtens [artikel 439][ref1] of [artikel 440 lid 2][ref2], schadeplichtig is, is aan de wederpartij
      een som verschuldigd gelijk aan de beloning over de tijd dat de agentuurovereenkomst bij regelmatige beëindiging
      had behoren voort te duren. Voor de vaststelling van deze som wordt rekening gehouden met de in de voorafgaande
      tijd verdiende provisie en met alle andere ter zake in acht te nemen factoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel440
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '440'
        afdeling: '4'
  - number: '441.2'
    text: De rechter is bevoegd deze som te verminderen, indien zij hem met het oog op de omstandigheden te hoog voorkomt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel441
  - number: '441.3'
    text: |-
      De benadeelde partij kan, in plaats van de schadeloosstelling in de voorafgaande leden bedoeld, volledige
      vergoeding van haar schade vorderen, onder gehoudenheid de omvang daarvan te bewijzen.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel441
  - number: '442.1'
    text: |-
      Ongeacht het recht om schadevergoeding te vorderen, heeft de handelsagent bij het einde van de agentuurovereenkomst
      recht op een vergoeding, klantenvergoeding, voor zover:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: 442.1.a
    text: |-
      hij de principaal nieuwe klanten heeft aangebracht of de overeenkomsten met de bestaande klanten aanmerkelijk heeft
      uitgebreid en de overeenkomsten met deze klanten de principaal nog aanzienlijke voordelen opleveren, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: 442.1.b
    text: |-
      de betaling van deze vergoeding billijk is, gelet op alle omstandigheden, in het bijzonder op de verloren provisie
      uit de overeenkomsten met deze klanten.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: '442.2'
    text: |-
      Het bedrag van de vergoeding is niet hoger dan dat van de beloning van één jaar, berekend naar het gemiddelde
      van de laatste vijf jaren of, indien de overeenkomst korter heeft geduurd, naar het gemiddelde van de gehele duur
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: '442.3'
    text: |-
      Het recht op vergoeding vervalt, indien de handelsagent de principaal niet uiterlijk een jaar na het einde van de
      overeenkomst heeft medegedeeld dat hij vergoeding verlangt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: '442.4'
    text: 'De vergoeding is niet verschuldigd, indien de overeenkomst is beëindigd:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: 442.4.a
    text: |-
      door de principaal onder omstandigheden die de handelsagent ingevolge [artikel 439 lid 3][ref1] schadeplichtig
      maken;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
  - number: 442.4.b
    text: |-
      door de handelsagent, tenzij deze beëindiging wordt gerechtvaardigd door omstandigheden die de principaal kunnen
      worden toegerekend, of wordt gerechtvaardigd door leeftijd, invaliditeit of ziekte van de handelsagent, op grond
      waarvan redelijkerwijs niet meer van hem kan worden gevergd dat hij zijn werkzaamheden voortzet;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: 442.4.c
    text: |-
      door de handelsagent die, overeenkomstig een afspraak met de principaal, zijn rechten en verplichtingen uit hoofde
      van de agentuurovereenkomst aan een derde overdraagt.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel442
  - number: '443.1'
    text: |-
      Een beding dat de handelsagent beperkt in zijn vrijheid om na het einde van de agentuurovereenkomst werkzaam te
      zijn, is slechts geldig voor zover:
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: 443.1.a
    text: het op schrift is gesteld, en
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: 443.1.b
    text: |-
      betrekking heeft op het soort goederen of diensten waarvan hij de vertegenwoordiging had, en op het gebied, of de
      klantenkring en het gebied, aan hem toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: '443.2'
    text: Zodanig beding is slechts geldig gedurende ten hoogste twee jaren na het einde van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: '443.3'
    text: 'Aan zodanig beding kan de principaal geen rechten ontlenen, indien de overeenkomst is geëindigd:'
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: 443.3.a
    text: |-
      doordat hij haar zonder toestemming van de handelsagent heeft beëindigd zonder inachtneming van de wettelijke of
      overeengekomen termijn en zonder een dringende aan de handelsagent onverwijld medegedeelde reden;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: 443.3.b
    text: |-
      doordat de handelsagent de overeenkomst heeft beëindigd vanwege een dringende, onverwijld aan de principaal
      medegedeelde reden waarvoor laatstgenoemde een verwijt treft;
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: 443.3.c
    text: door een rechterlijke uitspraak, gegrond op omstandigheden ter zake waarvan de principaal een verwijt treft.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: '443.4'
    text: |-
      De rechter kan, indien de handelsagent dat vraagt, zulk een beding geheel of gedeeltelijk teniet doen op grond
      dat, in verhouding tot het te beschermen belang van de principaal, de handelsagent door het beding onbillijk wordt
      benadeeld.
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel443
  - number: '444'
    text: |-
      Rechtsvorderingen gegrond op de [artikelen 439][ref1] en [440][ref2] verjaren door verloop van één jaar na het feit
      dat de vordering deed ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel439
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel440
    url: https://wetten.overheid.nl/BWBR0005290/2006-10-18#Artikel444
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '439'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '440'
        afdeling: '4'
  - number: '445.1'
    text: |-
      Partijen kunnen niet afwijken van de [artikelen 401][ref1], [402][ref2], [403][ref3] en [426 lid 2][ref4] noch
      van de [artikelen 428 lid 3][ref5], [429][ref6], [430][ref7], [431 lid 2][ref8], [432 lid 2][ref9], [433][ref10],
      [437 lid 2][ref11], [439][ref12], [440][ref13], [441][ref14], [443][ref15] en [444][ref16].


