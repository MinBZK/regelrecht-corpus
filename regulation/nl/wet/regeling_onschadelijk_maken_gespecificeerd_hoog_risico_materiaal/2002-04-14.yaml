preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 3, derde lid, van de Destructiewet en artikel 17 a van het Destructiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011845/2002-04-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              [verordening 999/2001/EG](32001R0999):

              [verordening nr. 999/2001/EG](32001R0999) van het Europees Parlement en de Raad van 22 mei 2001, houdende
      vaststelling van voorschriften inzake preventie, bestrijding en uitroeiing van bepaalde overdraagbare spongiforme
      encefalopathieën.
    url: https://wetten.overheid.nl/BWBR0011845/2002-04-14#Artikel1
  - number: '2'
    text: |-
      1 Gespecificeerd hoog-risico-materiaal als bedoeld in
      [artikel 2, eerste lid, van de Regeling aanwijzing gespecificeerd hoog-risico-materiaal 2000][ref1] wordt behandeld
      en vernietigd overeenkomstig bijlage XI, hoofdstuk A, punt 7, van [verordening 999/2001/EG](32001R0999), met dien
      verstande dat:

        - kadavers van gestorven slachtdieren niet behoeven te worden gekleurd;
        - de voorbehandeling, bedoeld in bijlage XI, hoofdstuk A, punt 7, van [verordening 999/2001/EG](32001R0999),
      geschiedt door middel van een warmtebehandeling in een afgesloten verwerkingsinstallatie.

      2 Het kleuren als bedoeld in bijlage XI, hoofdstuk A, punt 7, van [verordening 999/2001/EG](32001R0999), vindt
      plaats met de kleurstoffen methyleen blauw, patent-blauw E131, brillant-blauw E133 of pistache-groen E102 of
      pistache-groen E131, dan wel met een andere door de toezichthoudende ambtenaar aangewezen kleurstof.


      [ref1]: https://wetten.overheid.nl/BWBR0011443#Artikel2
    url: https://wetten.overheid.nl/BWBR0011845/2002-04-14#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011443
        artikel: '2'
  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011845/2002-04-14#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling onschadelijk maken gespecificeerd hoog-risico-materiaal.'
    url: https://wetten.overheid.nl/BWBR0011845/2002-04-14#Artikel4
