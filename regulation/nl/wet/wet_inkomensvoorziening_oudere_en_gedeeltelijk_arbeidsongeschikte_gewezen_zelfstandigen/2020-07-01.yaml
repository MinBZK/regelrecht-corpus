preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een inkomensvoorziening te treffen voor oudere en
    gedeeltelijk arbeidsongeschikte gewezen zelfstandigen van wie het inkomen duurzaam minder bedraagt dan het sociaal
    minimum en die als gevolg daarvan het bedrijf of beroep hebben beëindigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#ArtikelAanhef
articles:
