    text: |-
      uitreiziger: persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen- en
      veiligheidsdiensten, gericht aan het college, is gebleken dat het gegronde vermoeden bestaat dat deze persoon zich
      buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van
      organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '2.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder gewezen zelfstandige: de persoon die voor de
      voorziening in het bestaan was aangewezen op arbeid in het eigen bedrijf of beroep en die:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
  - number: 2.1.1°
    text: |-
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], nog niet
      heeft bereikt en


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 2.1.2°
    text: na het bereiken van de leeftijd van 55 jaar het bedrijf of beroep heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
  - number: '2.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt met de gewezen zelfstandige gelijkgesteld de partner in de zin
      van [artikel 3.78 van de Wet inkomstenbelasting 2001][ref1] die voldoet aan het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '2.3'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede als gewezen zelfstandige aangemerkt de persoon die
      voldoet aan het bepaalde in het eerste of tweede lid, en die met anderen het bedrijf of beroep heeft uitgeoefend in
      de vorm van een maatschap, een vennootschap onder firma of een commanditaire vennootschap, indien:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
  - number: 2.3.1°
    text: de volledige zeggenschap in het bedrijf of beroep alleen of met die anderen werd uitgeoefend en
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
  - number: 2.3.2°
    text: de financiële risico’s van het bedrijf of beroep alleen of met die anderen werden gedragen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
  - number: '2.4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede als gewezen zelfstandige aangemerkt de persoon
      die voldoet aan het bepaalde in het eerste of tweede lid, en die, anders dan als werknemer in de zin van de
      [Werkloosheidswet][ref1], het bedrijf of beroep heeft uitgeoefend in de vorm van een besloten vennootschap of een
      naamloze vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '2.5'
    text: |-
      De gewezen zelfstandige was aangewezen op arbeid in het eigen bedrijf of beroep, indien werd voldaan aan het
      urencriterium, bedoeld in [artikel 3.6 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '3.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.1.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.1.c
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.1.d
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.2.a
    text: |-
      als echtgenoot aangemerkt degene die niet duurzaam gescheiden leeft van de gewezen zelfstandige met wie hij gehuwd
      is;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.2.b
    text: |-
      als echtgenoot mede aangemerkt de niet met de gewezen zelfstandige gehuwde persoon met wie de gewezen zelfstandige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in
      de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee meerderjarigen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht als de belanghebbenden hun hoofdverblijf hebben
      in dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.4.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: 3.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander, zoals bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.7'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het tweede lid, onderdeel b, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
  - number: '3.8'
    text: |-
      Onder voormalig pleegkind als bedoeld in het zevende lid wordt verstaan een pleegkind voor wie de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of de
      [Jeugdwet][ref2], of kinderbijslag ontving op grond van de [Algemene Kinderbijslagwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0034925
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0034925
      - id: ref3
        bwb_id: BWBR0002368
  - number: 3a
    text: |-
      In [hoofdstuk IV][ref1] van deze wet en de daarop berustende bepalingen wordt onder gegevens mede verstaan
      persoonsgegevens als bedoeld in de Algemene verordening gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        hoofdstuk: IV
  - number: '4.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4
  - number: 4.1.a
    text: |-
      alleenstaande gewezen zelfstandige: de niet gehuwde dan wel duurzaam gescheiden levende gewezen zelfstandige,
      die niet een gezamenlijke huishouding voert als bedoeld in [artikel 3, derde lid][ref1], tenzij het betreft een
      bloedverwant in de eerste graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in
      de tweede graad sprake is van zorgbehoefte;


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '3'
        hoofdstuk: I
  - number: 4.1.b
    text: |-
      kind: het kind jonger dan 18 jaar, dat niet als eigen kind, aangehuwd kind of pleegkind tot het huishouden
      van een ander dan de gewezen zelfstandige behoort en voor wie aan de gewezen zelfstandige op grond van
      [artikel 18 van de Algemene Kinderbijslagwet][ref1] kinderbijslag wordt betaald, zal worden betaald of zou worden
      betaald indien [artikel 7, tweede lid, van die wet][ref2] niet van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '4.2'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het eerste lid, onder a, wordt mede verstaan een meerderjarig
      aangehuwd kind of een meerderjarig voormalig pleegkind van de gewezen zelfstandige.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4
  - number: 4a
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4a
  - number: 4a.a
    text: |-
      arbeidsinschakeling: het verkrijgen van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een
      voorziening als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '34'
        hoofdstuk: III
  - number: 4a.b
    text: |-
      sociale activering: het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4a
  - number: 4a.c
    text: |-
      startkwalificatie: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref1] of
      een diploma hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs als bedoeld in
      [artikel 7][ref2] onderscheidenlijk [8 van de Wet op het voortgezet onderwijs][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
  - number: 4b.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder medisch urenbeperkt verstaan: als
      rechtstreeks en objectief medisch vast te stellen gevolg van ziekte, gebreken, zwangerschap of
      bevalling voor een geringer aantal uren belastbaar zijn dan de normale arbeidsduur, bedoeld in
      [artikel 12, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel12
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '12'
  - number: 4b.2
    text: 'Het college kan:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
  - number: 4b.2.a
    text: ambtshalve vaststellen of een persoon die een uitkering op grond van deze wet ontvangt medisch urenbeperkt is;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
  - number: 4b.2.b
    text: |-
      op schriftelijke aanvraag van een persoon die een uitkering op grond van deze wet ontvangt vaststellen of hij
      medisch urenbeperkt is.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
  - number: 4b.3
    text: Een aanvraag als bedoeld in het tweede lid, onderdeel b, kan slechts eenmaal per twaalf maanden worden ingediend.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
  - number: 4b.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verricht voor het college de werkzaamheden ten behoeve van de
      vaststelling of een persoon die een uitkering op grond van deze wet ontvangt medisch urenbeperkt is en adviseert
      het college hierover.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel4b
  - number: '5.1'
    text: |-
      Recht op uitkering hebben, indien het inkomen per maand na het beëindigen van het bedrijf of beroep minder bedraagt
      dan de overeenkomstig het vierde lid vastgestelde grondslag en indien aan de in het tweede of derde lid genoemde
      voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.1.a
    text: de gewezen zelfstandige en de echtgenoot;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.1.b
    text: |-
      de alleenstaande gewezen zelfstandige die niet met een of meer meerderjarige personen in dezelfde woning zijn
      hoofdverblijf heeft;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.1.c
    text: |-
      de alleenstaande gewezen zelfstandige die met een of meer meerderjarige personen in dezelfde woning zijn
      hoofdverblijf heeft.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde voorwaarden zijn voor de gewezen zelfstandige, bedoeld in [artikel 2][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel2
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '2'
        hoofdstuk: I
  - number: 5.2.1°
    text: |-
      de gewezen zelfstandige heeft gedurende drie jaar, onmiddellijk voorafgaand aan de aanvraag, onafgebroken
      rechtmatig een bedrijf of beroep in Nederland uitgeoefend en gedurende de zeven jaar daarvoor eveneens rechtmatig
      een bedrijf of beroep in Nederland uitgeoefend dan wel arbeid in dienstbetrekking verricht;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.2.2°
    text: |-
      het inkomen uit arbeid of overig inkomen van de gewezen zelfstandige bedroeg de laatste drie boekjaren gemiddeld
      minder dan € 25.909 per jaar;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.2.3°
    text: |-
      het inkomen uit arbeid of overig inkomen van de gewezen zelfstandige zou bij voortzetting van het bedrijf of beroep
      naar verwachting duurzaam minder dan € 27.140 per jaar bedragen; en
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.2.4°
    text: |-
      de aanvraag is ingediend voor het beëindigen van het bedrijf of beroep en de beëindiging heeft plaatsgevonden
      binnen een periode van anderhalf jaar, volgend op het tijdstip van aanvraag.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.3'
    text: |-
      Het recht op uitkering komt de gewezen zelfstandige en de echtgenoot gezamenlijk toe. De uitkering wordt aan de
      gewezen zelfstandige en de echtgenoot ieder voor de helft uitbetaald, dan wel op hun gezamenlijk verzoek aan een
      van hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.4'
    text: 'De grondslag bedoeld in het eerste lid, wordt zodanig vastgesteld dat voor:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.4.a
    text: de gewezen zelfstandige en de echtgenoot de helft van de grondslag netto gelijk is aan € 756,45;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.4.b
    text: voor de alleenstaande gewezen zelfstandige netto gelijk is aan € 1.059,03;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.4.c
    text: |-
      voor de alleenstaande gewezen zelfstandige, bedoeld in het eerste lid, onderdeel c, die met een of meer
      meerderjarige personen in dezelfde woning zijn hoofdverblijf heeft, de grondslag netto gelijk is aan € 756,45.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.5'
    text: |-
      De in het tweede lid, onderdelen 2 en 3, genoemde bedragen worden gewijzigd met ingang van de dag waarop het netto
      minimumloon wordt gewijzigd met het percentage van deze wijziging, zodanig dat deze netto gelijk zijn aan het netto
      minimumloon.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.6'
    text: |-
      De in het vierde lid genoemde bedragen worden gewijzigd met ingang van de dag waarop het netto minimumloon wordt
      gewijzigd met het percentage van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.7'
    text: 'Tot de personen, bedoeld in het eerste lid, onderdeel c, worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.7.a
    text: de persoon die de leeftijd van 21 jaar nog niet heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.7.b
    text: |-
      de persoon, niet zijnde een bloed- of aanverwant in de eerste of tweede graad van de alleenstaande gewezen
      zelfstandige, die op basis van een schriftelijke overeenkomst met de alleenstaande gewezen zelfstandige, waarbij
      een commerciële prijs is overeengekomen, als verhuurder, huurder, onderverhuurder, onderhuurder, kostgever of
      kostganger in dezelfde woning als de alleenstaande gewezen zelfstandige zijn hoofdverblijf heeft;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.7.c
    text: |-
      de persoon die op basis van een schriftelijke overeenkomst met een derde, waarbij een commerciële prijs
      is overeengekomen, als huurder, onderhuurder of kostganger in dezelfde woning als de alleenstaande gewezen
      zelfstandige zijn hoofdverblijf heeft, mits hij de overeenkomst heeft met dezelfde persoon als met wie de gewezen
      zelfstandige een schriftelijke overeenkomst heeft, waarbij een commerciële prijs is overeengekomen, als huurder,
      onderhuurder of kostganger; en
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.7.d
    text: 'de persoon:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5.7.d.1°
    text: |-
      die onderwijs volgt waarvoor aanspraak op studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid, van de Wet studiefinanciering 2000][ref1] kan bestaan en op enig moment
      tijdens dat onderwijs gelet op zijn leeftijd in aanmerking kan komen voor die studiefinanciering;


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 5.7.d.2°
    text: |-
      die onderwijs volgt waarvoor aanspraak kan bestaan op een tegemoetkoming op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] en op enig moment tijdens dat
      onderwijs gelet op zijn leeftijd in aanmerking kan komen voor die tegemoetkoming;


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 5.7.d.3°
    text: |-
      die een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref1] in de
      beroepsbegeleidende leerweg volgt;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 5.7.d.4°
    text: |-
      die een vergelijkbaar soort onderwijs of beroepsopleiding als bedoeld onder 1° tot en met 3° volgt buiten
      Nederland, waarbij voor onder 1° en 2° geldt dat hij op enig moment tijdens dat onderwijs jonger dan 30 jaar is of
      in de maand van aanvang de leeftijd van 30 jaren heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.8'
    text: |-
      Op verzoek van het college legt de alleenstaande gewezen zelfstandige de schriftelijke overeenkomst, bedoeld in
      het zevende lid, onderdeel b of onderdeel c, over en toont hij de betaling van de commerciële prijs aan door het
      overleggen van de bewijzen van betaling.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: '5.9'
    text: |-
      De gewijzigde bedragen en de dag waarop de wijzigingen ingaan worden door of namens Onze Minister medegedeeld in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5
  - number: 5a
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van gewezen zelfstandigen worden aangewezen die zijn
      vrijgesteld van de voorwaarden, bedoeld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Geen recht op uitkering ontstaat, zolang het bedrijf of beroep door de zelfstandige en de echtgenoot niet is
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: '6.2'
    text: 'Geen recht op uitkering heeft de gewezen zelfstandige die:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.2.a
    text: zelf dan wel van wie de echtgenoot de arbeid in bedrijf of beroep hervat of aanvangt;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.2.b
    text: buiten Nederland woont of aldaar anders dan tijdelijk verblijf houdt;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.2.c
    text: |-
      niet rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.2.d
    text: rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.2.e
    text: zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.2.f
    text: |-
      onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die met
      die persoon gehuwd is, ter hoogte van het bedrag van het verlies van inkomen uit arbeid als gevolg van het
      genieten van dat verlof, tenzij belanghebbende alleenstaande ouder is en hij verlof geniet als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: 6.2.g
    text: |-
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft
      bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 6.2.h
    text: een uitreiziger is.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: '6.3'
    text: |-
      Geen recht op uitkering heeft de echtgenoot, indien ten aanzien van deze, dan wel ten aanzien van de gewezen
      zelfstandige zich een omstandigheid voordoet als omschreven in het tweede lid. Indien zich ten aanzien van de
      echtgenoot een omstandigheid voordoet als omschreven in het tweede lid, onderdelen b, c, d, e en h, wordt de
      gewezen zelfstandige aangemerkt als alleenstaande.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: '6.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan die
      bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1] recht op uitkering hebben,
      onverminderd de overige vereisten voor dat recht:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.4.a
    text: ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
  - number: 6.4.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '6.5'
    text: |-
      Het tweede lid, onderdeel d, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting, een instelling voor verpleging van ter beschikking gestelden, of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '7'
    text: |-
      Indien het recht op uitkering als gevolg van werkaanvaarding van de gewezen zelfstandige of de echtgenoot is
      geëindigd, en vervolgens opnieuw werkloosheid ontstaat, herleeft het recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel7
  - number: '8.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder inkomen verstaan:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: 8.1.a
    text: |-
      voor de gewezen zelfstandige en de echtgenoot: de som van het inkomen uit arbeid of overig inkomen van hemzelf en
      zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: 8.1.b
    text: 'voor de alleenstaande gewezen zelfstandige: zijn inkomen uit arbeid of overig inkomen.'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.2'
    text: |-
      Als inkomen wordt voorts aangemerkt het inkomen uit het vermogen waarover de gewezen zelfstandige en zijn
      echtgenoot na de beëindiging van het bedrijf of beroep beschikken, met dien verstande dat daarbij een vermogen van
      € 136.848,00 buiten beschouwing blijft. Het inkomen uit vermogen wordt bepaald op 5%  per jaar van het vermogen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het eerste lid wordt niet als inkomen uit arbeid beschouwd het inkomen uit arbeid gedurende zes
      maanden tot 25 procent van dit inkomen, met een maximum van € 347,62 per maand, voor zover een uitkering wordt
      ontvangen en dit naar het oordeel van burgemeester en wethouders bijdraagt aan de arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.4'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder inkomen uit arbeid of overig inkomen
      als bedoeld in het eerste lid en in [artikel 5, tweede lid][ref1]. Daarbij kan tevens worden bepaald dat nader te
      bepalen inkomen dat gedeeltelijk, niet, of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of
      enig handelen of nalaten van betrokkene in aanmerking wordt genomen alsof het wel volledig wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8.5'
    text: |-
      Het bedrag, genoemd in het tweede lid, wordt gewijzigd met ingang van 1 januari van elk kalenderjaar, met het
      percentage waarmee het prijsindexcijfer van de gezinsconsumptie over de maand oktober daaraan voorafgaand afwijkt
      van het prijsindexcijfer waarop de laatste vaststelling van het bedrag is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.6'
    text: |-
      Onze Minister herziet het percentage, bedoeld in het tweede lid, zodra de rente-ontwikkeling daartoe aanleiding
      geeft.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.7'
    text: Onze Minister stelt regels met betrekking tot de waardering van het vermogen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.8'
    text: |-
      Het bedrag, genoemd in het derde lid, wordt gewijzigd met ingang van de dag waarop het in
      [artikel 31, tweede lid, onderdeel n, van de Participatiewet][ref1] genoemde bedrag wordt gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '8.9'
    text: |-
      In afwijking van het eerste lid wordt niet als inkomen uit arbeid beschouwd het inkomen uit arbeid van een
      alleenstaande ouder tot 12,5 procent van dit inkomen, met een maximum van € 215,36 per maand, gedurende een
      aaneengesloten periode van maximaal 30 maanden, voor zover hij een uitkering ontvangt, ingeval:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: 8.9.a
    text: hij de volledige zorg heeft voor zijn kind tot 12 jaar,
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: 8.9.b
    text: de periode van zes maanden, bedoeld in het derde lid, is verstreken, en
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: 8.9.c
    text: dit volgens het college bijdraagt aan zijn arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.10'
    text: |-
      Het bedrag, genoemd in het negende lid, wordt gewijzigd met ingang van de dag waarop het in
      [artikel 31, tweede lid, onderdeel r, van de Participatiewet][ref1] genoemde bedrag wordt gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '8.11'
    text: |-
      In afwijking van het eerste lid wordt niet als inkomen uit arbeid beschouwd het inkomen uit arbeid van een persoon
      die medisch urenbeperkt is tot 15 procent van dit inkomen uit arbeid, met een maximum van € 219,06 per maand, voor
      zover hij een uitkering op grond van deze wet ontvangt, tenzij het derde of negende lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '8.12'
    text: |-
      Het bedrag, genoemd in het elfde lid, wordt gewijzigd met ingang van de dag waarop het in
      [artikel 31, tweede lid, onderdeel y, van de Participatiewet][ref1] genoemde bedrag wordt gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
  - number: '8.13'
    text: |-
      De gewijzigde bedragen en de dag waarop de wijzigingen ingaan, worden door of namens Onze Minister medegedeeld in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel8
  - number: '9.1'
    text: De uitkering bedraagt het verschil tussen de van toepassing zijnde grondslag en het inkomen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel9
  - number: '9.2'
    text: |-
      In de in het eerste lid bedoelde uitkering is begrepen een vakantieuitkering ter hoogte van 8/108 van die
      uitkering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel9
  - number: '9.3'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt gewijzigd, wordt de in het
      tweede lid genoemde verhouding dienovereenkomstig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '11'
    text: |-
      Het recht op uitkering bestaat jegens het college van de gemeente waar de belanghebbende woonplaats heeft als
      bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: '12.1'
    text: |-
      Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en deze van
      oordeel zijn dat zij evenmin de aanvraag dienen te behandelen, terwijl er geen zekerheid kan worden verkregen over
      de in [artikel 11][ref1] bedoelde woonplaats, draagt het college die de doorgezonden aanvraag hebben ontvangen, er
      zorg voor dat het geschil aanhangig wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel11
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '12.2'
    text: |-
      In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      uitkering jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel12
  - number: '12.3'
    text: |-
      Het[ eerste en tweede lid van artikel 16][ref1] zijn van overeenkomstige toepassing, met dien verstande dat de daar
      genoemde termijnen beginnen te lopen vanaf de mededeling van die doorzending of beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel16
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '16'
        hoofdstuk: II
        paragraaf: '3'
  - number: '12.4'
    text: Uitkeringskosten verleend ingevolge het tweede lid worden vergoed door de gemeente waarvan de taak is waargenomen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel12
  - number: '13.1'
    text: |-
      De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling en het recht op uitkering, de hoogte of de duur van de uitkering, of op het bedrag van
      de uitkering dat aan hem wordt betaald. De verplichting geldt niet indien die feiten en omstandigheden door
      burgemeester en wethouders kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek
      aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij
      ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel13
  - number: '13.2'
    text: |-
      De belanghebbende is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '13.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '14.1'
    text: |-
      Onverminderd
      [artikel 30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens ten behoeve van de verlening van de uitkering dan wel de voortzetting
      daarvan door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd,
      alsmede de wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt. De gegevens en bewijsstukken
      worden door het college niet verkregen van de belanghebbende voor zover zij verkregen kunnen worden uit de
      polisadministratie, bedoeld in [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      de verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref3], alsmede uit de basisregistratie
      personen, tenzij hierdoor een goede vervulling van de taak van het college op grond van dit artikel wordt belet
      of bij wettelijk voorschrift anders is bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere
      administraties worden aangewezen waarvoor de tweede zin van toepassing is, worden regels gesteld over de gegevens
      die het betreft en kunnen administraties worden aangewezen waarvoor de tweede zin tijdelijk niet van toepassing is.
      Indien het authentieke gegevens uit andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
  - number: '14.2'
    text: 'In aanvulling op het eerste lid kan het college de belanghebbende verzoeken aan te tonen dat:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
  - number: 14.2.a
    text: |-
      hij een gewezen zelfstandige is als bedoeld in [artikel 5, vierde lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 14.2.b
    text: |-
      de feitelijke woonsituatie van hemzelf, van zijn echtgenoot of van een kind in overeenstemming is met het door hem
      verstrekte adres van hemzelf, zijn echtgenoot of van een kind.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
  - number: '14.3'
    text: |-
      Indien de belanghebbende niet desgevraagd aantoont dat hij een gewezen zelfstandige is als bedoeld in
      [artikel 5, vierde lid, onderdeel b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 14.3.a
    text: |-
      kent het college de uitkering toe respectievelijk herziet het de uitkering naar de helft van de grondslag, bedoeld
      in [artikel 5, vierde lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 14.3.b
    text: |-
      wordt de belanghebbende voor de toepassing van de [artikelen 37a, tweede lid][ref1], en [38][ref2] niet als
      alleenstaande ouder aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel38
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 37a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '38'
        hoofdstuk: III
  - number: '14.4'
    text: |-
      Indien de belanghebbende niet desgevraagd de woonsituatie, bedoeld in het tweede lid, onderdeel b, aantoont op de
      wijze bedoeld in de laatste zin van dat lid, schort het college de betaling van de uitkering op, niet dan nadat
      het college aan belanghebbende gelegenheid heeft gegeven op andere wijze aan te tonen dat het feitelijke woonadres
      overeenkomt met het verstrekte adres, indien daartoe niet eerder aan belanghebbende gelegenheid is geboden.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
  - number: '14.5'
    text: |-
      Het college doet schriftelijke mededeling van de opschorting aan de belanghebbende en stelt hem daarbij
      in de gelegenheid om aan te tonen dat het feitelijke woonadres overeenstemt met het verstrekte adres.
      [Artikel 17a, vierde lid, tweede zin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 17a
        hoofdstuk: II
        paragraaf: '3'
  - number: '14.6'
    text: |-
      Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor de vaststelling van het recht op uitkering. Indien het
      onderzoek daartoe aanleiding geeft kan het college besluiten tot herziening van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
  - number: '14.7'
    text: |-
      De voordracht voor een krachtens het eerste lid, derde zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel14
  - number: '15.1'
    text: Het college stelt het recht op uitkering op schriftelijke aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel15
  - number: '15.2'
    text: |-
      De uitkering wordt door de gewezen zelfstandige en de echtgenoot gezamenlijk aangevraagd, dan wel door een van hen
      met schriftelijke toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel15
  - number: 16a.1
    text: |-
      Indien door het college is vastgesteld dat recht op uitkering bestaat, wordt de uitkering toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om uitkering aan te vragen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel16a
  - number: 16a.2
    text: |-
      Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de uitkering wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel16a
  - number: '17.1'
    text: |-
      Indien de belanghebbende de voor de verlening van de uitkering van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien
      de belanghebbende anderszins onvoldoende medewerking verleent aan het onderzoek, kan het college het recht op
      uitkering opschorten:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
  - number: 17.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
  - number: 17.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
  - number: '17.2'
    text: |-
      Het college doet mededeling van de opschorting aan de belanghebbende en nodigt hem uit binnen een door het college
      te stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
  - number: '17.3'
    text: |-
      Het college herziet een besluit tot toekenning van de uitkering, dan wel trekt een besluit tot toekenning
      van de uitkering in, indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 13, eerste lid][ref1], heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van
      uitkering. Onverminderd het elders in deze wet bepaalde ter zake van herziening of intrekking van een besluit tot
      toekenning van uitkering kan het college een besluit tot toekenning van uitkering herzien of intrekken, indien
      een gedraging als bedoeld in [artikel 20, tweede lid][ref2], heeft geleid tot het ten onrechte of tot een te hoog
      bedrag verlenen van uitkering of anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel20
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '17.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, kan het college na het verstrijken van deze termijn het besluit tot toekenning van uitkering intrekken met
      ingang van de eerste dag waarover het recht op uitkering is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17
  - number: 17a.1
    text: |-
      Indien bij de beoordeling van het recht op uitkering blijkt, dat het door een belanghebbende verstrekte adres van
      hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de basisregistratie
      personen staat ingeschreven, schort het college de betaling van de uitkering op.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: 17a.2
    text: 'Geen opschorting vindt plaats:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: 17a.2.a
    text: indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: 17a.2.b
    text: indien de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: 17a.3
    text: |-
      Het college doet schriftelijk mededeling van de opschorting aan de belanghebbende, en geeft daarbij de gelegenheid
      tot adreswijziging in de basisregistratie personen binnen een door het college te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: 17a.4
    text: |-
      De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het derde lid gestelde termijn nog bestaat, herziet het college het besluit tot
      toekenning van de uitkering, of trekt het dit in, met ingang van de eerste dag waarop de betaling van de uitkering
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel17a
  - number: '20.1'
    text: |-
      Het college verlaagt de uitkering overeenkomstig de verordening, bedoeld in [artikel 35, onderdeel a][ref1],
      ter zake van het niet of onvoldoende nakomen door de belanghebbende van een verplichting als bedoeld in
      [artikel 13, tweede en vierde lid][ref2], of een op grond van [hoofdstuk III][ref3] aan de uitkering verbonden
      verplichting, anders dan de verplichting, bedoeld in [artikel 37, eerste lid, onderdelen a en c][ref4], waaronder
      begrepen het zich jegens het college zeer ernstig misdragen, in de periode voorafgaand aan de aanvraag om een
      uitkering of ter zake van het nadien onvoldoende inzetten voor de voorziening in het bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0004163#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '35'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004163
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '20.2'
    text: |-
      Het college kan de uitkering blijvend of tijdelijk weigeren tot de mate waarin de belanghebbende die arbeid
      in dienstbetrekking heeft aanvaard uit of in verband met deze arbeid inkomen als bedoeld in of op grond van
      [artikel 8][ref1] zou hebben kunnen verwerven, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.2.a
    text: |-
      aan de beëindiging van zijn dienstbetrekking een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref1] en de belanghebbende ter zake een verwijt kan worden
      gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 20.2.b
    text: |-
      de dienstbetrekking is beëindigd door of op verzoek van de belanghebbende zonder dat aan de voortzetting ervan
      zodanige bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem zou kunnen worden gevergd;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
  - number: 20.2.c
    text: de belanghebbende nalaat algemeen geaccepteerde arbeid te aanvaarden; of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
  - number: 20.2.d
    text: de belanghebbende door eigen toedoen geen algemeen geaccepteerde arbeid verkrijgt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
  - number: '20.3'
    text: |-
      Van een verlaging als bedoeld in het eerste lid en een weigering als bedoeld in het tweede lid wordt afgezien,
      indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
  - number: '20.4'
    text: |-
      Het niet voeren van verweer door de belanghebbende tegen of het instemmen van de belanghebbende met een beëindiging
      van de dienstbetrekking door of op het verzoek van de werkgever leidt niet tot het opleggen van een maatregel op
      grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20
  - number: 20a.1
    text: |-
      Het college legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet of niet behoorlijk
      nakomen door de belanghebbende van de verplichting, bedoeld in [artikel 13, eerste lid][ref1]. Indien de feiten
      en omstandigheden, bedoeld in artikel 13, eerste lid, niet of niet behoorlijk zijn medegedeeld en deze overtreding
      opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en omstandigheden, bedoeld in
      artikel 13, eerste lid, niet of niet behoorlijk zijn medegedeeld en deze overtreding niet opzettelijk is begaan,
      bedraagt de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld in artikel 23, vierde lid,
      van het Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 20a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 13, eerste lid][ref1], ten onrechte of tot een te hoog
      bedrag aan uitkering is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 20a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de belanghebbende van een verplichting als
      bedoeld in [artikel 13, eerste lid][ref1], niet heeft geleid tot een benadelingsbedrag, legt het
      college een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 20a.4
    text: |-
      Het college kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven van een schriftelijke
      waarschuwing wegens het niet of niet behoorlijk nakomen door de belanghebbende van een verplichting als bedoeld
      in [artikel 13, eerste lid][ref1], in situaties die bij algemene maatregel van bestuur worden bepaald, tenzij het
      niet of niet behoorlijk nakomen van de verplichtingen plaatsvindt binnen een periode van twee jaar te rekenen vanaf
      de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 20a.5
    text: |-
      Het college legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de belanghebbende van
      de verplichting, bedoeld in [artikel 13, eerste lid][ref1], als gevolg waarvan ten onrechte of tot een te hoog
      bedrag aan uitkering is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met overeenkomstige
      toepassing van het eerste lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de
      overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding,
      bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 20a.6
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de belanghebbende is gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.7
    text: Het college kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.8
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het college de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.9
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.10
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.11
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 20a.12
    text: |-
      Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van opzet
      of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet nogmaals
      een overtreding wegens eenzelfde gedraging is begaan, is het college bevoegd op verzoek van degene aan wie de
      bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij medewerking aan
      een schuldregeling.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: 20a.13
    text: |-
      Het besluit tot kwijtschelding, bedoeld in het twaalfde lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding wegens eenzelfde gedraging is begaan.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel20a
  - number: '21.1'
    text: het college betaalt de uitkering in het algemeen per maand.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid wordt de vakantie-uitkering, voor zover niet reeds eerder betaald, jaarlijks
      betaald in de maand juni over de aan die maand voorafgaande maanden, dan wel in de maand waarin de uitkering
      eindigt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel21
  - number: '22'
    text: |-
      De uitkering wordt betaald tot de dag waarop de gewezen zelfstandige de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '23.1'
    text: |-
      In geval van overlijden van de echtgenoot van de gewezen zelfstandige wordt tot en met één maand na de dag van het
      overlijden, betaald naar de voordien vastgestelde grondslag.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel23
  - number: '23.2'
    text: |-
      In geval van overlijden van de gewezen zelfstandige wordt de uitkering tot en met één maand na de dag van het
      overlijden, betaald naar de voordien vastgestelde grondslag aan:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel23
  - number: 23.2.a
    text: de echtgenoot van de gewezen zelfstandige;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel23
  - number: 23.2.b
    text: bij ontstentenis van de onder *a* bedoelde persoon, het kind of de kinderen in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel23
  - number: '24.1'
    text: De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel24
  - number: '24.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel24
  - number: '24.3'
    text: Elk beding strijdig met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel24
  - number: '25.1'
    text: |-
      Het college van de gemeente die de uitkering heeft verleend, vordert de uitkering terug voor zover de uitkering
      ten onrechte of tot een te hoog bedrag is ontvangen als gevolg van het niet of niet behoorlijk nakomen van de
      verplichting, bedoeld in [artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.2'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 17, derde of vierde lid][ref1], of
      [artikel 20][ref2], anders dan in het eerste lid, ten onrechte of tot een te hoog bedrag is verleend, alsmede
      hetgeen anderszins onverschuldigd is betaald, kan van de belanghebbende worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel20
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '25.3'
    text: |-
      De uitkering kan van de belanghebbende worden teruggevorderd indien blijkt dat deze over dezelfde periode waarover
      een uitkering op grond van deze wet is verleend, later inkomsten ontvangt waarmede bij de vaststelling van de
      uitkering rekening zou zijn gehouden.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: '25.4'
    text: Het college is bevoegd tot verrekening van in de voorgaande drie maanden ontvangen middelen met de uitkering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: '25.5'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering
      betrekking hebbende kosten. Loonbelasting en de premie voor de volksverzekeringen waarvoor het college
      dat de uitkering verstrekt krachtens de [Wet op de loonbelasting 1964][ref1], onderscheidenlijk de
      [Wet financiering sociale verzekeringen][ref2] inhoudingsplichtige is, kunnen worden teruggevorderd, voor zover
      deze belasting en premie niet verrekend kunnen worden met de door het college af te dragen loonbelasting en premie
      volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0017745
  - number: '25.6'
    text: |-
      In afwijking van het eerste lid kan het college besluiten van terugvordering of van verdere terugvordering als
      bedoeld in het eerste lid af te zien, indien de persoon van wie de uitkering wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: 25.6.a
    text: gedurende tien jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: 25.6.b
    text: |-
      gedurende tien jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: 25.6.c
    text: |-
      gedurende tien jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: 25.6.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom, in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: '25.7'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van terugvordering
      als bedoeld in het eerste lid af te zien.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel25
  - number: '26.1'
    text: |-
      Indien de uitkering met inachtneming van [artikel 3][ref1], is verleend, worden voor de toepassing van deze
      paragraaf als belanghebbenden aangemerkt de in dat artikel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '3'
        hoofdstuk: I
  - number: '26.2'
    text: |-
      Indien de uitkering met inachtneming van [artikel 3][ref1] had moeten worden verleend, maar zulks achterwege is
      gebleven omdat de belanghebbende onjuiste of onvolledige inlichtingen heeft verstrekt, dan wel de verplichting,
      bedoeld in [artikel 13][ref2], niet of niet behoorlijk is nagekomen, kan de gedurende het betrokken tijdvak ten
      onrechte verleende uitkering mede worden teruggevorderd van de persoon met wiens inkomen bij de verlening van de
      uitkering rekening had moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel13
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '26.3'
    text: |-
      De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van de ten
      onrechte verleende uitkering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel26
  - number: '27'
    text: |-
      De persoon van wie wordt teruggevorderd is verplicht desgevraagd aan het college de inlichtingen te verstrekken die
      voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel27
  - number: '28.1'
    text: |-
      Het college kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 25, eerste, tweede en derde lid][ref1],
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel25
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: '28.2'
    text: |-
      Indien degene van wie de uitkering op grond van [artikel 25, eerste lid][ref1], wordt teruggevorderd
      dan wel verplicht is tot betaling van een bestuurlijke boete als bedoeld in [artikel 20a][ref2]
      en een eerdere bestuurlijke boete wegens eenzelfde gedraging als bedoeld in artikel 20a, vijfde
      lid, algemene bijstand op grond van de [Participatiewet][ref3] of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref5] ontvangt, verrekent het college die uitkering en bestuurlijke
      boete met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: 20a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0015711
  - number: '28.3'
    text: |-
      Indien degene van wie de uitkering op grond van [artikel 25, tweede of derde lid][ref1], wordt
      teruggevorderd algemene bijstand op grond van de [Participatiewet][ref2] of een uitkering op grond van
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref4] ontvangt, is het college bevoegd tot verrekening van die
      uitkering met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0015703
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0015703
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0015711
  - number: '28.4'
    text: |-
      Indien degene van wie de uitkering wordt teruggevorderd dan wel verplicht is tot betaling van een
      bestuurlijke boete als bedoeld in [artikel 20a][ref1] een uitkering of algemene bijstand ontvangt van
      een andere gemeente dan de gemeente waarvan het college de uitkering terugvordert of de bestuurlijke
      boete heeft opgelegd, dan wel een uitkering of inkomensvoorziening ontvangt op grond van de
      [Werkloosheidswet][ref2], de [Ziektewet][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering][ref7],
      de [Wet arbeidsongeschiktheidsvoorziening militairen][ref8], de [Wet arbeid en zorg][ref9], de
      [Wet inkomensvoorziening oudere werklozen][ref10], de [Toeslagenwet][ref11], de [Algemene Ouderdomswet][ref12]
      of de [Algemene nabestaandenwet][ref13], betaalt dat college, het Uitvoeringsinstituut werknemersverzekeringen,
      onderscheidenlijk de Sociale verzekeringsbank het bedrag van de terugvordering of de bestuurlijke boete, zonder dat
      daarvoor een machtiging nodig is van de belanghebbende, op verzoek aan het college, dat besluit tot terugvordering
      of de bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0019057
      [ref7]: https://wetten.overheid.nl/BWBR0002524
      [ref8]: https://wetten.overheid.nl/BWBR0002822
      [ref9]: https://wetten.overheid.nl/BWBR0013008
      [ref10]: https://wetten.overheid.nl/BWBR0024394
      [ref11]: https://wetten.overheid.nl/BWBR0004043
      [ref12]: https://wetten.overheid.nl/BWBR0002221
      [ref13]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 20a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0019057
      - id: ref7
        bwb_id: BWBR0002524
      - id: ref8
        bwb_id: BWBR0002822
      - id: ref9
        bwb_id: BWBR0013008
      - id: ref10
        bwb_id: BWBR0024394
      - id: ref11
        bwb_id: BWBR0004043
      - id: ref12
        bwb_id: BWBR0002221
      - id: ref13
        bwb_id: BWBR0007795
  - number: '28.5'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene van wie uitkering wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '28.6'
    text: |-
      Zolang de belanghebbende de verplichtingen, bedoeld in de [artikelen 20a, achtste lid][ref1], en [27][ref2], niet
      of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel27
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 20a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '27'
        hoofdstuk: II
        paragraaf: '5'
  - number: 28.6.a
    text: |-
      is het college, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot
      verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 28.6.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de artikelen
      [475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij invordering van de onverschuldigd betaalde
      uitkering en de bestuurlijke boete bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '28.7'
    text: |-
      Onverminderd het eerste tot en met het zesde lid kan het college een vordering die een belanghebbende op hem heeft,
      verrekenen met een vordering als bedoeld in [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel25
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '25'
        hoofdstuk: II
        paragraaf: '5'
  - number: 29a
    text: |-
      Door het college wordt geen medewerking verleend aan een schuldregeling indien een vordering is ontstaan
      door het niet of niet behoorlijke nakomen door de belanghebbende van de verplichting, bedoeld in
      [artikel 13, eerste lid][ref1], en hiervoor een bestuurlijke boete is opgelegd, dan wel met betrekking
      tot het niet of niet behoorlijk nakomen van die verplichtingen aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref2], voor zover deze medewerking leidt tot gehele of gedeeltelijke kwijtschelding van
      deze vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
  - number: '30.1'
    text: |-
      De vorderingen ingevolge deze paragraaf zijn bevoorrecht en volgen onmiddellijk na die in [artikel 288 van Boek 3
      van het Burgerlijk Wetboek](onbekend) omschreven.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien de uitkeringen op verschillende tijdvakken betrekking hebben, heeft de terugvordering over het vroegste
      tijdvak voorrang.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel30
  - number: '31'
    text: |-
      Onder uitkering in de zin van deze paragraaf wordt verstaan de uitkering, bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel9
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: '34.1'
    text: 'Het college is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel34
  - number: 34.1.a
    text: |-
      het verlenen van een uitkering aan de gewezen zelfstandige, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel2
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '2'
        hoofdstuk: I
  - number: 34.1.b
    text: |-
      het ontwikkelen van beleid ten behoeve van het verrichten van een tegenprestatie als bedoeld in
      [artikel 37, eerste lid, onderdeel f][ref1], en het uitvoeren ervan, overeenkomstig de verordening, bedoeld in
      [artikel 35, eerste lid, onderdeel e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel35
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '35'
        hoofdstuk: III
  - number: '34.2'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel34
  - number: '34.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel34
  - number: '35'
    text: 'De gemeenteraad stelt bij verordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel35
  - number: 35.a
    text: |-
      de weigering en verlaging, bedoeld in [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel20
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: 35.b
    text: |-
      de bestrijding van het ten onrechte ontvangen van een uitkering alsmede van misbruik en oneigenlijk gebruik van de
      wet in het kader van het financiële beheer;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel35
  - number: 35.c
    text: |-
      het verlagen van de uitkering, bedoeld in [artikel 38, twaalfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel38
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '38'
        hoofdstuk: III
  - number: 35.d
    text: |-
      het opdragen van een tegenprestatie als bedoeld in [artikel 37, eerste lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '36.1'
    text: |-
      Belanghebbenden die een uitkering ontvangen, hebben overeenkomstig de verordening, bedoeld in
      [artikel 8a van de Participatiewet][ref1], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het
      oordeel van het college noodzakelijk geachte voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 8a
  - number: '36.2'
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel11
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
  - number: '37.1'
    text: |-
      De belanghebbende die voor de zelfstandige voorziening in het bestaan is aangewezen op arbeid in dienstbetrekking
      is vanaf de dag van melding, bedoeld in [artikel 16a, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 16a
        hoofdstuk: II
        paragraaf: '3'
  - number: 37.1.a
    text: naar vermogen te trachten algemeen geaccepteerde arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37.1.b
    text: |-
      ervoor te zorgen dat hij als werkzoekende geregistreerd is bij het Uitvoeringsinstituut
      werknemersverzekeringen en geregistreerd blijft, indien hem daartoe het recht toekomt op grond van
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30b
  - number: 37.1.c
    text: algemeen geaccepteerde arbeid te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37.1.d
    text: na te laten hetgeen inschakeling in de arbeid belemmert;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37.1.e
    text: |-
      gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37.1.f
    text: |-
      naar vermogen door het college opgedragen onbeloonde maatschappelijk nuttige werkzaamheden te verrichten die worden
      verricht naast of in aanvulling op reguliere arbeid en die niet leiden tot verdringing op de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37.1.g
    text: |-
      zich te onthouden van zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en
      instanties tijdens het verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: '37.2'
    text: |-
      Indien uitkering wordt verleend aan echtgenoten gelden de verplichtingen bedoeld in het eerste lid voor ieder van
      hen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37
  - number: 37a.1
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een of meer verplichtingen als bedoeld in [artikel 37][ref1]. Zorgtaken kunnen als dringende redenen
      worden aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als bedoeld
      in [artikel 34, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '34'
        hoofdstuk: III
  - number: 37a.2
    text: |-
      De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37a
  - number: 37a.4
    text: |-
      De verplichting, bedoeld in [artikel 37, eerste lid, onderdeel f][ref1], is niet van toepassing op de
      alleenstaande ouder die in het bezit is van een ontheffing als bedoeld in [artikel 38, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel38
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '38'
        hoofdstuk: III
  - number: '38.1'
    text: |-
      Onverminderd [artikel 37a, eerste lid][ref1], verleent het college aan een alleenstaande ouder die de volledige
      zorg heeft voor een tot zijn last komend kind tot vijf jaar op diens verzoek ontheffing van de verplichtingen,
      bedoeld in [artikel 37, eerste lid, onderdelen a tot en met d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37a
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 37a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.2'
    text: De ontheffing, bedoeld in het eerste lid, wordt eenmalig verleend.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: '38.3'
    text: |-
      De ontheffing, bedoeld in het eerste lid, wordt niet verleend voor zover uit houding en
      gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [artikel 37, eerste lid, onderdeel e][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.4'
    text: |-
      De ontheffing, bedoeld in het eerste lid, geldt zolang het jongste kind van de alleenstaande ouder de leeftijd van
      vijf jaar nog niet heeft bereikt. Onverminderd de eerste zin geldt de ontheffing gedurende ten hoogste vijf jaar.
      Bij verhuizing naar een andere woonplaats wordt op deze periode in mindering gebracht de periode, dan wel perioden,
      waarin de alleenstaande ouder in de voorgaande woonplaats, dan wel de voorgaande woonplaatsen, gebruik heeft
      gemaakt van de ontheffing bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: '38.5'
    text: 'De ontheffing, bedoeld in het eerste lid, wordt, indien de volledige duur van vijf jaar nog niet volledig is benut:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: 38.5.a
    text: van rechtswege opgeschort, met ingang van de datum waarop het jongste kind de leeftijd van vijf jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: 38.5.b
    text: van rechtswege opgeschort indien niet langer recht op bijstand bestaat;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: 38.5.c
    text: |-
      door het college opgeschort op een daartoe strekkend verzoek van de alleenstaande ouder aan wie de ontheffing,
      bedoeld in het eerste lid, is verleend; of
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: 38.5.d
    text: |-
      door het college ingetrokken indien uit houding en gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat
      hij zijn verplichtingen, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.6'
    text: |-
      Op een daartoe strekkend verzoek van de alleenstaande ouder met een kind tot vijf jaar beëindigt het college een
      opschorting als bedoeld in het vijfde lid, onderdelen a tot en met c, indien de daarin genoemde omstandigheden niet
      langer van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: '38.7'
    text: |-
      Het college stelt binnen zes maanden na ontvangst van het verzoek, bedoeld in het eerste lid, een plan van
      aanpak op voor de invulling van de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], voor de
      alleenstaande ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.8'
    text: |-
      Het college verricht na het opstellen van het plan van aanpak, bedoeld in het zevende lid, iedere zes maanden
      een heronderzoek naar de in het van toepassing zijnde plan van aanpak opgenomen voorziening, bedoeld in
      [artikel 37, eerste lid, onderdeel e][ref1]. Het heronderzoek strekt zich mede uit tot de naleving van de in het
      van toepassing zijnde plan van aanpak opgenomen voorziening. Het college beoordeelt tevens bij het verrichten van
      het heronderzoek of er aanleiding bestaat de voorziening te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.9'
    text: |-
      Indien het heronderzoek, bedoeld in het achtste lid, daartoe aanleiding geeft stelt het college een gewijzigd plan
      van aanpak op.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
  - number: '38.10'
    text: |-
      Het college vult de voorziening, bedoeld in [artikel 37, eerste lid, onderdeel e][ref1], voor de alleenstaande
      ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid en die niet beschikt over een
      startkwalificatie ten minste in met scholing of opleiding die de toegang tot de arbeidsmarkt bevordert, tenzij
      naar het oordeel van het college een dergelijke scholing of opleiding de krachten of bekwaamheden van betrokkene te
      boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel37
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '37'
        hoofdstuk: III
  - number: '38.11'
    text: |-
      Op verzoek van de alleenstaande ouder die beschikt over een startkwalificatie en aan wie een ontheffing is
      verleend als bedoeld in het eerste lid, vult het college de voorziening in met een opleiding, als bedoeld in
      [artikel 7.2.2., tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref1], die de toegang tot de
      arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of
      bekwaamheden van de alleenstaande ouder te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '38.12'
    text: |-
      Het college verlaagt de uitkering overeenkomstig de verordening, bedoeld in [artikel 35, onderdeel c][ref1], indien
      het college de ontheffing, bedoeld in het eerste lid, heeft ingetrokken op grond van het vijfde lid, onderdeel d.
      Van een verlaging wordt afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel35
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '35'
        hoofdstuk: III
  - number: 38a
    text: |-
      Het college kan ter uitvoering van [artikel 34, eerste lid, onderdeel a][ref1], degene die uitkering op grond van
      deze wet ontvangt en voor wie de kans op inschakeling in het arbeidsproces gering is en die daardoor vooralsnog
      niet bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten gedurende maximaal
      twee jaar. [Artikel 10a, tweede tot en met zesde en achtste tot en met tiende lid, van de Participatiewet][ref2]
      alsmede de regels, bedoeld in [artikel 8a, eerste lid, onderdelen c en d, van die wet][ref3], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '34'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 10a
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 8a
  - number: '39'
    text: Gereserveerd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel39
  - number: '40'
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van
      [paragraaf 4][ref3] van dit hoofdstuk en [paragraaf 5 van hoofdstuk V][ref4], in de plaats van de betrokken
      burgemeesters en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004163#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0004163#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004163
        hoofdstuk: IV
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0004163
        hoofdstuk: V
        paragraaf: '5'
  - number: '42'
    text: |-
      Het college draagt zorg voor de realisatie en vormgeving van cliëntenparticipatie bij de uitvoering van de wet, met
      inachtneming van [artikel 150 van de Gemeentewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '44.1'
    text: |-
      Ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen te
      verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte
      van een persoon te wiens behoeve een uitkering is gevraagd of wordt verleend en die in zijn dienst dan wel voor
      hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich mede uit tot de
      inkomsten van een persoon van wie uitkeringen ingevolge [hoofdstuk II, paragraaf 5][ref1], worden of kunnen worden
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004163
        hoofdstuk: II
        paragraaf: '5'
  - number: '44.2'
    text: |-
      De opgaven en inlichtingen moeten desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel44
  - number: '44.3'
    text: |-
      Op verzoek van het college legt de meerderjarige persoon die in dezelfde woning als de gewezen zelfstandige
      zijn hoofdverblijf heeft, als bedoeld in [artikel 5, eerste en vierde lid][ref1], desgevraagd alle gegevens en
      inlichtingen over die voor de beoordeling van de aanspraak op uitkering van belang kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '45.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.b
    text: het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.c
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.d
    text: |-
      het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref1], de Nederlandse
      Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de zorgverzekeraars in de zin van de
      [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de [Wet langdurige zorg][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0035917
  - number: 45.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
  - number: 45.1.f
    text: |-
      de Kamer van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 45.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 45.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      betreffende de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 45.1.i
    text: Onze Minister van Onderwijs, Cultuur en Wetenschap;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.j
    text: |-
      Onze Minister van Economische Zaken betreffende de omvang van de productiebeperkende maatregelen voor het bedrijf
      van de ondernemer in de agrarische sector;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.k
    text: |-
      Onze Minister van Veiligheid en Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is ontnomen
      of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.l
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.m
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.n
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.1.o
    text: |-
      Onze Minister betreffende de toepassing van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '45.2'
    text: |-
      Het vragen door burgemeester en wethouders en het verstrekken door de in het eerste lid bedoelde instanties van de
      in het eerste lid bedoelde opgaven en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.3'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college
      kosteloos alle gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken
      die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.4'
    text: 'De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.4.a
    text: |-
      van wie kosten van uitkeringen worden of kunnen worden teruggevorderd ingevolge [hoofdstuk II, paragraaf 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004163#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004163
        hoofdstuk: II
        paragraaf: '5'
  - number: 45.4.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.4.b.1°
    text: te wiens behoeve een uitkering ingevolge deze wet is gevraagd of wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: 45.4.b.2°
    text: |-
      van wie kosten van uitkering worden of kunnen worden teruggevorderd ingevolge [hoofdstuk II, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004163#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004163
        hoofdstuk: II
        paragraaf: '5'
  - number: '45.5'
    text: |-
      De in het eerste en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.6'
    text: |-
      De in het eerste lid, onderdeel a tot en met k, genoemde instanties treffen desgevraagd met het college en met het
      Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het tweede lid en de inhoud en
      vormgeving van de in het zesde lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde
      lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste tot en met zevende lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven met betrekking tot inkomen en vermogen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.10'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het negende lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '45.11'
    text: |-
      Onze Minister van Veiligheid en Justitie verstrekt ten aanzien van de persoon die rechtens zijn
      vrijheid is ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of
      vrijheidsbenemende maatregel, onverwijld en kosteloos de beschikbare informatie en alle overige opgaven
      en inlichtingen, die van invloed kunnen zijn op het recht op uitkering, aan het college, door tussenkomst
      van het Inlichtingenbureau, waarbij hij gebruik kan maken van het het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '45.12'
    text: |-
      De Belastingdienst verstrekt aan het college zonder dat daaraan een verzoek ten grondslag ligt gegevens als bedoeld
      in het eerste lid over samenloop van een uitkering met inkomen uit of in verband met arbeid of bedrijf, die bij de
      uitvoering van een belastingwet of bij de invordering van enige rijksbelasting bekend zijn geworden voor zover die
      gegevens noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel45
  - number: '46.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt medegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: '46.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: 46.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: 46.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: 46.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: '46.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer van de belanghebbenden daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
  - number: '46.4'
    text: |-
      Degene die op grond van de[ artikelen 44 tot en met 48][ref1] gegevens verstrekt dient na te gaan of degene aan wie
      de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel44
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '44'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '47'
    text: |-
      Het college is verplicht, indien zij bij de uitvoering van deze wet het gegronde vermoeden krijgen van een misdrijf
      dat is gepleegd ten nadele van een uitvoeringsorgaan van de sociale verzekeringswetten of van een overheidsorgaan,
      voorzover dit is belast met het verrichten van uitkeringen, het doen van verstrekkingen dan wel het heffen van
      bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel47
  - number: '48.1'
    text: |-
      Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet
      aan de hieronder vermelde organen en derden kosteloos de gegevens te verstrekken die noodzakelijk zijn voor de
      uitvoering van de hierbij vermelde wetten of wettelijke regelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 48.1.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref2], en [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 48.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 48.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de [Participatiewet][ref1] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
  - number: 48.1.d
    text: |-
      het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref1], de Nederlandse
      Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2], de zorgverzekeraars in de zin van
      [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref3], voor de uitvoering van de [Zorgverzekeringswet][ref4]
      of de Wlz-uitvoerders, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref5], voor de uitvoering van de
      [Wet langdurige zorg][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018450
      [ref5]: https://wetten.overheid.nl/BWBR0035917#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0018450
      - id: ref5
        bwb_id: BWBR0035917
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0035917
  - number: 48.1.e
    text: |-
      derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: 48.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: 48.1.g
    text: |-
      bestuursorganen van Aruba, Curaçao, en Sint Maarten voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: 48.1.h
    text: |-
      Onze Minister voor de uitvoering van de [Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 48.1.i
    text: |-
      Onze Minister van Veiligheid en Justitie in verband met de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: '48.2'
    text: |-
      Het verstrekken door burgemeester en wethouders aan de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: '48.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      belanghebbenden daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: '48.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel48
  - number: '49.1'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 45][ref1] en
      [48][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel48
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '45'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '48'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen, maken gebruik van het burgerservicenummer voor zover dat noodzakelijk is voor het verrichten van
      werkzaamheden die in het kader van een voorziening als bedoeld in [artikel 34, eerste lid, onderdeel a][ref1],
      worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '34'
        hoofdstuk: III
  - number: '52.1'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      vaststelt, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele
      gevallen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel52
  - number: '52.2'
    text: |-
      In de aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft gebracht
      met de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel52
  - number: '53'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van het
      college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel53
  - number: '54.1'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel54
  - number: '54.2'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel54
  - number: '55.1'
    text: |-
      Het college verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel55
  - number: '55.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de soort informatie die het college
      verstrekt en de wijze waarop het college de gegevens en inlichtingen verzamelt en verstrekt, waarbij kan worden
      bepaald, dat categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel55
  - number: '55.3'
    text: |-
      De gegevens en inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in
      [artikel 54][ref1], worden kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel54
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '54'
        hoofdstuk: IV
        paragraaf: '4'
  - number: '60'
    text: |-
      Voor de toepassing van [artikel 8:1 van de Algemene wet bestuursrecht][ref1], wordt met een besluit gelijkgesteld
      het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of terugvordering van
      de uitkering of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 60b.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van [artikel 3, tweede tot en met zesde lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '3'
        hoofdstuk: I
  - number: 60b.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel60b
  - number: '61'
    text: |-
      [Paragraaf 3 van Hoofdstuk V][ref1] blijft van toepassing op de vaststelling van de vergoeding, uitkering en
      kosten, bedoeld in [artikel 59c][ref2] en [artikel 59e][ref3], zoals deze artikelen luidden voor inwerkingtreding
      van de Wet van 17 december 2009 tot bundeling van uitkeringen inkomensvoorziening aan gemeenten (Stb. 592), voor
      kosten die betrekking hebben op kalenderjaren gelegen voor die van inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel59c
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel59e
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004163
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: 59c
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: 59e
        hoofdstuk: V
        paragraaf: '4'
  - number: 62a
    text: |-
      Het recht tot strafvordering vervalt indien het college aan de belanghebbende ter zake van hetzelfde feit reeds een
      bestuurlijke boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel62a
  - number: '63.1'
    text: |-
      Onverminderd het derde lid wordt tot een bij ministeriële regeling bepaald tijdstip, dat voor verschillende
      groepen personen verschillend kan worden vastgesteld, onder gewezen zelfstandige in deze wet en de daarop
      berustende bepalingen mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      op grond van [artikel 2, eerste lid, onderdeel b][ref2], zoals dat luidde op die dag, werd aangemerkt als gewezen
      zelfstandige.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel2
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '2'
        hoofdstuk: I
  - number: '63.2'
    text: |-
      Onder gewezen zelfstandige in deze wet en de daarop berustende bepalingen wordt
      mede verstaan: de persoon die op de dag voorafgaand aan de inwerkingtreding van
      [artikel 1.10, onderdeel C, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1]
      werd aangemerkt als gewezen zelfstandige op grond van [artikel 2, eerste lid, onderdeel b][ref2], en die op grond
      van [artikel 3 van de Toeslagenwet][ref3] geen recht heeft op grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004043#Artikel3
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004043
        artikel: '3'
  - number: '63.3'
    text: |-
      [Artikel 7][ref1] is niet van toepassing op de persoon die als gevolg van de inwerkingtreding van
      [artikel 1.18, onderdeel A, van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2]
      geen gewezen zelfstandige is en de echtgenoot van die persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '1'
  - number: '63.4'
    text: |-
      Op de persoon die op grond van het eerste of tweede lid als gewezen zelfstandige wordt aangemerkt en zijn
      echtgenoot blijven de [artikelen 2][ref1], [5, derde lid][ref2], [5a][ref3], [6][ref4], en [8, derde lid][ref5],
      en de daarop berustende bepalingen zoals deze luidden op 28 december 2005 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0004163#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: 5a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004163
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004163
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: 63a
    text: |-
      De [artikelen 3, zevende en achtste lid][ref1], en [4, tweede lid][ref2], zijn niet van toepassing, indien voor
      de inwerkingtreding van deze artikelleden, op grond van [artikel 5][ref3] recht bestaat op een uitkering voor de
      zelfstandige en de echtgenoot, omdat de ongehuwde uitkeringsgerechtigde wegens een gezamenlijke huishouding met een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind is aangemerkt als echtgenoot, voor zolang dit
      recht op uitkering bestaat, tenzij toepassing van de genoemde artikelleden leidt tot een hogere uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '3'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '4'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 63d
    text: |-
      De [artikelen 4a, eerste lid, onderdeel c][ref1], en [38][ref2],
      zoals deze luidden op de dag voor de inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________, blijven van toepassing op de alleenstaande ouder die op de dag voor inwerkingtreding van de
      Wet tot wijziging van de Wet werk en bijstand en samenvoeging van die wet met de Wet investeren in jongeren
      gericht op bevordering van deelname aan de arbeidsmarkt en vergroting van de eigen verantwoordelijkheid van
      uitkeringsgerechtigden een ontheffing heeft op grond van artikel 38, gedurende de duur van de ontheffing, doch ten
      hoogste gedurende zes maanden na inwerkingtreding van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0030997
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63d
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: 4a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '38'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0030997
  - number: 63e
    text: |-
      [Artikel 8, derde lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van [artikel V van de Wet vrijlating
      lijfrenteopbouw en inkomsten uit arbeid en bevordering vrijwillige voortzetting pensioenopbouw](onbekend), blijft
      van toepassing op de persoon op wie de vrijlating van inkomsten uit arbeid, bedoeld in artikel 8, derde lid,
      van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen van toepassing
      was voorafgaand aan de dag gelegen zes maanden voor inwerkingtreding van artikel V van de Wet vrijlating
      lijfrenteopbouw en inkomsten uit arbeid en bevordering vrijwillige voortzetting pensioenopbouw, tot zijn recht op
      uitkering op grond van deze wet waarin die vrijlating van toepassing was, eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel8
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel63e
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '64.1'
    text: |-
      In het belang van een goede uitvoering van het bij en krachtens deze wet bepaalde kunnen bij algemene maatregel van
      bestuur nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel64
  - number: '64.2'
    text: |-
      Onze Minister kan, wanneer hij overweegt een voordracht tot vaststelling, wijziging of intrekking van een in
      het eerste lid bedoelde algemene maatregel van bestuur te doen en naar zijn oordeel een gewichtige reden een
      onmiddellijke voorziening eist, overeenkomstig de in overweging zijnde maatregel regels stellen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel64
  - number: '64.3'
    text: |-
      De regeling, bedoeld in het tweede lid, blijft, behoudens eerdere intrekking, van kracht totdat de in het eerste
      lid bedoelde algemene maatregel van bestuur in werking treedt, doch uiterlijk tot 12 maanden na de dag van
      inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel64
  - number: '68'
    text: Deze wet treedt in werking met ingang van 1 juli 1987.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel68
  - number: '69'
    text: |-
      Deze wet kan worden aangehaald als Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen
      zelfstandigen.
    url: https://wetten.overheid.nl/BWBR0004163/2020-07-01#Artikel69
