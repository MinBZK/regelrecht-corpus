  - number: '66.3'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt voor de eerste
      maal niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel66
  - number: '67'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel67
  - number: '68'
    text: 'Deze wet wordt aangehaald als: Dienstenwet.'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel68
