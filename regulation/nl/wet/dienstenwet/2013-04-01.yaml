        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.1'
    text: |-
      Het bij of krachtens deze wet bepaalde is van toepassing op de eisen en vergunningstelsels met betrekking tot de
      vrijheid van vestiging en het vrij verkeer van diensten die onder de reikwijdte van de richtlijn vallen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid geldt in ieder geval voor de eisen en vergunningstelsels, bedoeld in dat lid, die zijn opgenomen in
      een regeling van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: '2.3'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.a.1°
    text: |-
      onderwerpen en diensten die op grond van artikel 1, tweede tot en met zevende lid, artikel 2, derde lid en artikel
      3, tweede lid, van de richtlijn, van het toepassingsgebied van de richtlijn zijn uitgezonderd,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.a.2°
    text: |-
      diensten en sectoren die op grond van de artikel 2, tweede lid, van de richtlijn, van het toepassingsgebied van de
      richtlijn zijn uitgezonderd,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.a.3°
    text: |-
      bepalingen van communautaire regelgeving, die ingeval zich een strijdigheid voordoet als omschreven in artikel 3,
      eerste lid, van de richtlijn, van het toepassingsgebied van de richtlijn zijn uitgezonderd;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.b
    text: procedures van bezwaar en beroep;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.c
    text: andere rechterlijke procedures of vormen van geschilbeslechting;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: 2.3.d
    text: regels en procedures betreffende overheidsopdrachten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: '2.4'
    text: |-
      Een wijziging van de richtlijn met betrekking tot de eisen en vergunningstelsels die onder de reikwijdte van de
      richtlijn vallen gaat voor de toepassing van het bij en krachtens deze wet bepaalde gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekendgemaakt, een eerder tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel2
  - number: '3'
    text: Het bij of krachtens deze wet bepaalde is mede van toepassing in de Nederlandse exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel3
  - number: '4.1'
    text: |-
      Een bevoegde instantie waaraan een afnemer of dienstverrichter gegevens of bescheiden overlegt ten bewijze dat aan
      een eis is voldaan of een vergunning is verkregen aanvaardt ook:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: 4.1.a
    text: |-
      gegevens en bescheiden uit een andere lidstaat die een gelijkwaardig doel dienen of waaruit blijkt dat aan de
      betrokken eis is voldaan of de vergunning is verkregen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: 4.1.b
    text: daartoe strekkende formulieren als bedoeld in artikel 5, tweede lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: '4.2'
    text: |-
      Bij de toepassing van het eerste lid kan een bevoegde instantie voor gegevens en bescheiden uit een andere lidstaat
      uitsluitend originelen, afschriften van originelen die als eensluidend met het origineel gewaarmerkt zijn, of een
      authentieke vertaling van originelen, verlangen, indien dit uit een verdrag van de Europese Unie of uit een voor
      lidstaten bindend besluit van één of meer instellingen van de Europese Unie volgt, of indien dit op grond van een
      dwingende reden van algemeen belang gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: '4.3'
    text: |-
      Onverminderd het tweede lid kan een bevoegde instantie bij de toepassing van het eerste lid voor gegevens
      en bescheiden uit een andere lidstaat in een vreemde taal een niet-gelegaliseerde vertaling verlangen in de
      Nederlandse of Friese taal.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: '4.4'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op gegevens en bescheiden als bedoeld in artikel 5, vierde lid,
      van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister draagt zorg voor de inrichting, instandhouding, werking en beveiliging van een centraal loket met
      behulp waarvan:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.a
    text: 'ten behoeve van dienstverrichters:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.a.1°
    text: |-
      informatie toegankelijk wordt gemaakt die van belang is voor het verkrijgen van toegang tot of de uitoefening van
      diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.a.2°
    text: |-
      berichtenverkeer dat betrekking heeft op procedures en formaliteiten wordt uitgewisseld tussen dienstverrichters en
      bevoegde instanties.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.b
    text: 'ten behoeve van zakelijke afnemers:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.b.1°
    text: informatie toegankelijk wordt gemaakt in verband met het afnemen van diensten in Nederland of een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: 5.1.b.2°
    text: op verzoek informatie wordt verschaft in verband met het afnemen van diensten in een andere lidstaat dan Nederland.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: '5.2'
    text: Het centraal loket is gemakkelijk langs elektronische weg bereikbaar.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      inrichting, instandhouding, werking en beveiliging van het centraal loket.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel5
  - number: '6.1'
    text: |-
      De Autoriteit Consument en Markt draagt zorg voor de inrichting, instandhouding, werking en beveiliging van een
      informatiepunt met behulp waarvan ten behoeve van consumenten:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel6
  - number: 6.1.a
    text: informatie toegankelijk wordt gemaakt in verband met het afnemen van diensten in Nederland of een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel6
  - number: 6.1.b
    text: op verzoek informatie wordt verschaft in verband met het afnemen van diensten in een andere lidstaat dan Nederland.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel6
  - number: '6.2'
    text: Het informatiepunt is gemakkelijk langs elektronische weg bereikbaar.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel6
  - number: '6.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      inrichting, instandhouding, werking en beveiliging van het informatiepunt.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel6
  - number: '7'
    text: 'Onze Minister maakt de volgende informatie voor dienstverrichters via het centraal loket toegankelijk:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel7
  - number: 7.a
    text: |-
      de eisen en vergunningstelsels, bedoeld in [artikel 2][ref1], en de namen en adresgegevens van de bij die eisen en
      vergunningstelsels betrokken bevoegde instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 7.b
    text: |-
      de rechtsmiddelen die algemeen voorhanden zijn voor het beslechten van geschillen tussen bevoegde instanties en
      dienstverrichters, tussen dienstverrichters en afnemers of tussen dienstverrichters onderling;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel7
  - number: 7.c
    text: |-
      de middelen en voorwaarden om toegang te krijgen tot openbare registers en openbare databanken met gegevens over
      dienstverrichters en diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel7
  - number: 7.d
    text: |-
      de namen en adresgegevens van verenigingen en organisaties zonder winstoogmerk, anders dan de bevoegde instanties,
      van welke dienstverrichters praktische bijstand kunnen krijgen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel7
  - number: '8.1'
    text: |-
      Een bevoegde instantie die betrokken is bij één of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], maakt de volgende informatie voor dienstverrichters langs elektronische weg toegankelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 8.1.a
    text: de eisen of vergunningstelsels, waarbij die instantie is betrokken en haar naam en adresgegevens;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel8
  - number: 8.1.b
    text: |-
      de rechtsmiddelen die algemeen voorhanden zijn voor het beslechten van geschillen tussen haar en een
      dienstverrichter over eisen en vergunningstelsels waarbij zij is betrokken.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel8
  - number: '8.2'
    text: |-
      Een bevoegde instantie maakt tevens informatie voor dienstverrichters langs elektronische weg toegankelijk over de
      middelen en voorwaarden om toegang te krijgen tot een openbaar register of een openbare databank met gegevens over
      dienstverrichters en diensten, voor zover die instantie daarbij betrokken is.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel8
  - number: '9'
    text: |-
      De informatie, bedoeld in de [artikelen 7][ref1] en [8][ref2] is actueel, duidelijk en ondubbelzinnig.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel8
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '10'
    text: |-
      Bij ministeriële regeling kunnen ten behoeve van een goede uitvoering van [artikel 7][ref1] regels worden gesteld
      over de wijze waarop bevoegde instanties informatie als bedoeld in [artikel 8][ref2] ordenen en toegankelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel8
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '11'
    text: |-
      Indien daarin niet op andere wijze is voorzien, draagt Onze Minister ten behoeve van dienstverrichters zorg voor
      het gemakkelijk langs elektronische weg toegankelijk maken van informatie over:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel11
  - number: 11.a
    text: de betekenis van bepaalde keurmerken;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel11
  - number: 11.b
    text: de criteria voor het aanvragen van keurmerken;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel11
  - number: 11.c
    text: andere kwaliteitsaanduidingen voor diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel11
  - number: 11.d
    text: |-
      op communautair niveau vastgestelde gedragscodes die gericht zijn op de vergemakkelijking van de toegang tot of
      uitoefening van diensten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel11
  - number: '12.1'
    text: |-
      Een bevoegde instantie verstrekt een dienstverrichter op diens verzoek algemene informatie over de gebruikelijke
      uitleg en toepassing van eisen of vergunningstelsels, bedoeld in [artikel 2][ref1], waarbij die bevoegde instantie
      is betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde informatie wordt zo spoedig mogelijk verstrekt, is actueel, duidelijk en
      ondubbelzinnig. Waar passend wordt informatie verstrekt in de vorm van een handleiding.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
  - number: '12.3'
    text: Indien een bevoegde instantie de verzochte informatie niet kan verstrekken, deelt zij dat onverwijld mee.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
  - number: '12.4'
    text: |-
      Een bevoegde instantie draagt er zorg voor dat zij langs elektronische weg voldoende bereikbaar is voor een verzoek
      van een dienstverrichter om informatie als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
  - number: '12.5'
    text: |-
      Een bevoegde instantie verzendt een bericht met de verzochte informatie als bedoeld in het eerste lid, of een
      mededeling als bedoeld in het derde lid, langs elektronische weg, voor zover een dienstverrichter waarvoor het
      bericht bestemd is aan de bevoegde instantie kenbaar heeft gemaakt dat hij langs deze weg voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
  - number: '12.6'
    text: |-
      Het vijfde lid geldt, voor zover van toepassing, in afwijking van
      [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '13.1'
    text: |-
      Onze Minister biedt een dienstverrichter respectievelijk een bevoegde instantie de mogelijkheid berichten die
      betrekking hebben op procedures en formaliteiten via het centraal loket te verzenden en te ontvangen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel13
  - number: '13.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake vernietigingstermijnen van via het centraal loket
      verzonden berichten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister draagt onverwijld zorg voor vernietiging van een bericht na verloop van de krachtens het tweede lid
      gestelde termijnen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel13
  - number: '14.1'
    text: 'Een bevoegde instantie die betrokken is bij de afwikkeling van procedures en formaliteiten:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: 14.1.a
    text: draagt zorg voor aansluiting op het centraal loket;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: 14.1.b
    text: |-
      verzendt daarop betrekking hebbende berichten via het centraal loket, voor zover een dienstverrichter waarvoor een
      bericht bestemd is via het centraal loket aan de bevoegde instantie kenbaar heeft gemaakt dat hij langs deze weg
      voldoende bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: 14.1.c
    text: |-
      draagt er zorg voor dat zij via het centraal loket voldoende bereikbaar is voor daarop betrekking hebbende
      berichten van een dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: '14.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot technische eisen waaraan door een
      bevoegde instantie als bedoeld in het eerste lid moet worden voldaan met het oog op aansluiting op het centraal
      loket.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: '14.3'
    text: |-
      Het eerste lid geldt, voor zover van toepassing, in afwijking van
      [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '14.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van door de Europese Commissie met
      inachtneming van artikel 8, derde lid, van de richtlijn vastgestelde gedetailleerde regels.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: '14.5'
    text: |-
      Indien een via het centraal loket verzonden bericht dat op procedures en formaliteiten betrekking heeft, is
      ondertekend met een elektronische handtekening die afwijkt van een elektronische handtekening die bij of krachtens
      wettelijk voorschrift is voorgeschreven of door een bevoegde instantie wordt geëist, kan een bevoegde instantie dit
      bericht niet om die reden weigeren, indien de elektronische handtekening voldoet aan een van de in de ministeriële
      regeling, bedoeld in het vierde lid, genoemde elektronische handtekeningen, tenzij:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: 14.5.a
    text: |-
      het een elektronische handtekening betreft waarvan het niveau van betrouwbaarheid lager is dan de elektronische
      handtekening die bij of krachtens wettelijk voorschrift is voorgeschreven of door een bevoegde instantie wordt
      geëist, of
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: 14.5.b
    text: |-
      de in de ministeriële regeling, bedoeld in het vierde lid, genoemde elektronische handtekening met het laagste
      niveau van betrouwbaarheid bij of krachtens wettelijk voorschrift is voorgeschreven of door een bevoegde instantie
      wordt geëist.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel14
  - number: '15.1'
    text: |-
      [Artikel 2:15, tweede lid, van de Algemene wet bestuursrecht][ref1], is niet van toepassing op de verzending via
      het centraal loket van gegevens en bescheiden die op procedures en formaliteiten betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '15.2'
    text: |-
      Voor zover daarvan bij of krachtens deze wet niet wordt afgeweken, zijn de [artikelen 2:14, derde lid][ref1],
      [2:15, derde en vierde lid][ref2], [2:16][ref3] en [2:17 van de Algemene wet bestuursrecht][ref4] van
      overeenkomstige toepassing op berichten waarop dit hoofdstuk en [hoofdstuk 4][ref5] van toepassing zijn en waarbij
      een bevoegde instantie niet als bestuursorgaan is betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0026759#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0026759
        hoofdstuk: '4'
  - number: '16.1'
    text: |-
      Onze Minister verwerkt persoonsgegevens als bedoeld in
      [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref1], met het doel de uitwisseling van
      berichtenverkeer dat betrekking heeft op de afwikkeling van procedures en formaliteiten via het centraal loket voor
      dienstverrichters mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '16.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde verwerking van persoonsgegevens, is Onze Minister verantwoordelijke
      in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '17'
    text: 'Onze Minister maakt via het centraal loket voor zakelijke afnemers toegankelijk:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: 17.a
    text: |-
      de informatie, bedoeld in [artikel 7, onderdelen a en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel7
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 17.b
    text: algemene informatie over in andere lidstaten geldende eisen inzake toegang tot en uitoefening van diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: 17.c
    text: |-
      de rechtsmiddelen die algemeen voorhanden zijn voor het beslechten van geschillen tussen bevoegde instanties en
      zakelijke afnemers of tussen dienstverrichters en zakelijke afnemers;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: 17.d
    text: |-
      algemene informatie over in andere lidstaten beschikbare rechtsmiddelen voor het beslechten van geschillen tussen
      dienstverrichters en zakelijke afnemers;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: 17.e
    text: |-
      de namen en adresgegevens van verenigingen of organisaties zonder winstoogmerk, anders dan de bevoegde instanties,
      waarvan zakelijke afnemers praktische bijstand kunnen krijgen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: 17.f
    text: |-
      de namen en adresgegevens van verenigingen of organisaties zonder winstoogmerk, die geen bevoegde instantie in
      enige lidstaat zijn, en waar zakelijke afnemers praktische bijstand van kunnen krijgen in een andere lidstaat dan
      Nederland.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel17
  - number: '18'
    text: 'De Autoriteit Consument en Markt maakt via het informatiepunt voor consumenten toegankelijk:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: 18.a
    text: |-
      de informatie, bedoeld in [artikel 7, onderdelen a en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel7
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 18.b
    text: |-
      algemene informatie over in andere lidstaten geldende eisen inzake toegang tot en uitoefening van diensten, in het
      bijzonder informatie inzake consumentenbescherming;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: 18.c
    text: |-
      de rechtsmiddelen die algemeen voorhanden zijn voor het beslechten van geschillen tussen bevoegde instanties en
      consumenten of tussen dienstverrichters en consumenten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: 18.d
    text: |-
      algemene informatie over in andere lidstaten beschikbare rechtsmiddelen voor het beslechten van geschillen tussen
      dienstverrichters en consumenten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: 18.e
    text: |-
      de namen en adresgegevens van verenigingen of organisaties zonder winstoogmerk, anders dan de bevoegde instanties,
      waarvan consumenten praktische bijstand kunnen krijgen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: 18.f
    text: |-
      de namen en adresgegevens van verenigingen of organisaties zonder winstoogmerk, die geen bevoegde instantie
      in enige lidstaat zijn, en waar consumenten praktische bijstand van kunnen krijgen in een andere lidstaat dan
      Nederland.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel18
  - number: '19'
    text: |-
      Een bevoegde instantie die betrokken is bij één of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], maakt voor afnemers langs elektronische weg toegankelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 19.a
    text: |-
      de informatie, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], en artikel 8, tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel8
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 19.b
    text: |-
      de rechtsmiddelen die algemeen voorhanden zijn voor het beslechten van geschillen tussen haar en een afnemer of
      tussen een dienstverrichter en een afnemer.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel19
  - number: '20'
    text: |-
      De informatie, bedoeld in de [artikelen 17][ref1], [18][ref2] en [19][ref3], is actueel, duidelijk en
      ondubbelzinnig.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel19
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0026759
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen ten behoeve van een goede uitvoering van [artikel 17, onderdelen a, c en e][ref1],
      regels worden gesteld over de wijze waarop bevoegde instanties informatie als bedoeld in [artikel 19][ref2] ordenen
      en toegankelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel19
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '17'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '19'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '22'
    text: |-
      Indien daarin niet op andere wijze is voorzien, draagt Onze Minister ten behoeve van afnemers zorg voor het
      gemakkelijk langs elektronische weg toegankelijk maken van informatie over:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel22
  - number: 22.a
    text: de betekenis van bepaalde keurmerken;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel22
  - number: 22.b
    text: de criteria voor het aanvragen van keurmerken;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel22
  - number: 22.c
    text: andere kwaliteitsaanduidingen voor diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel22
  - number: 22.d
    text: |-
      op communautair niveau vastgestelde gedragscodes die gericht zijn op de vergemakkelijking van de toegang tot of
      uitoefening van diensten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel22
  - number: '23'
    text: 'Onze Minister verstrekt een zakelijke afnemer op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel23
  - number: 23.a
    text: |-
      algemene informatie over in de andere lidstaten geldende eisen inzake de toegang tot en de uitoefening van
      diensten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel23
  - number: 23.b
    text: |-
      algemene informatie over in andere lidstaten beschikbare rechtsmiddelen voor het beslechten van geschillen tussen
      een dienstverrichter en een zakelijke afnemer;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel23
  - number: 23.c
    text: |-
      namen en adresgegevens van verenigingen en organisaties zonder winstoogmerk uit een andere lidstaat, die geen
      bevoegde instanties in die lidstaat zijn, en van welke een zakelijke afnemer praktische bijstand kan krijgen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel23
  - number: '24'
    text: 'De Autoriteit Consument en Markt verstrekt een consument op diens verzoek:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel24
  - number: 24.a
    text: |-
      algemene informatie over in de andere lidstaten geldende eisen inzake de toegang tot en uitoefening van diensten,
      in het bijzonder die inzake consumentenbescherming;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel24
  - number: 24.b
    text: |-
      algemene informatie over in andere lidstaten beschikbare rechtsmiddelen voor het beslechten van geschillen tussen
      een dienstverrichter en een consument;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel24
  - number: 24.c
    text: |-
      namen en adresgegevens van verenigingen en organisaties zonder winstoogmerk uit een andere lidstaat, die geen
      bevoegde instanties in die lidstaat zijn, en van welke een consument praktische bijstand kan krijgen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel24
  - number: '25'
    text: |-
      Een bevoegde instantie verstrekt een afnemer op diens verzoek algemene informatie over de gebruikelijke uitleg
      en toepassing van eisen of vergunningstelsels, bedoeld in [artikel 2][ref1], waarbij die bevoegde instantie is
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '26'
    text: |-
      Op een informatieverzoek als bedoeld in de [artikelen 23 tot en met 25][ref1] is
      [artikel 12, tweede tot en met zesde lid][ref2], van overeenkomstige toepassing, met dien verstande dat de
      behandeling van een tot Onze Minister gericht verzoek geschiedt via het centraal loket en een tot de Autoriteit
      Consument en Markt gericht verzoek via het informatiepunt.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel12
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27.1'
    text: |-
      Onze Minister verstrekt aan een relevante organisatie als bedoeld in artikel 21, derde lid, van de richtlijn
      op verzoek informatie als bedoeld in artikel 21, eerste lid, onderdelen a tot en met c, van de richtlijn, voor
      Nederland ten behoeve van zakelijke afnemers.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel27
  - number: '27.2'
    text: |-
      De Autoriteit Consument en Markt verstrekt aan een relevante organisatie als bedoeld in artikel 21, derde lid,
      van de richtlijn op verzoek informatie als bedoeld in artikel 21, eerste lid, onderdelen a tot en met c, van de
      richtlijn, voor Nederland ten behoeve van consumenten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel27
  - number: '27.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van op grond van artikel 21, derde
      lid, laatste volzin en artikel 21, vierde lid, van de richtlijn vastgestelde praktische regelingen en
      uitvoeringsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel27
  - number: '28.1'
    text: |-
      In afwijking van [artikel 4:20a, eerste lid, van de Algemene wet bestuursrecht][ref1] is
      [paragraaf 4.1.3.3 van die wet][ref2] van toepassing op een aanvraag om een vergunning, tenzij bij wettelijk
      voorschrift anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '28.2'
    text: |-
      Het eerste lid is niet van toepassing op de aanvraag om een vergunning, ingesteld bij of ter uitvoering van een
      verordening of besluit als bedoeld in artikel 288 van het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel28
  - number: '29.1'
    text: |-
      Een bevoegde instantie bevestigt de ontvangst van een aanvraag om een vergunning zo snel mogelijk. De
      ontvangstbevestiging bevat de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel29
  - number: 29.1.a
    text: |-
      de bij wettelijk voorschrift met betrekking tot die vergunning bepaalde termijn waarbinnen de beschikking wordt
      gegeven of de termijn van acht weken, bedoeld in [artikel 31, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel31
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '31'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 29.1.b
    text: beschikbare rechtsmiddelen om tegen de beschikking op te komen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel29
  - number: '29.2'
    text: |-
      Indien [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] op een aanvraag van toepassing is, vermeldt
      de ontvangstbevestiging tevens dat de gevraagde beschikking van rechtswege is gegeven, indien niet tijdig op de
      aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '30.1'
    text: |-
      Een dienstverrichter voldoet aan een eis die bij de voorbereiding van een beschikking op een aanvraag voor een
      vergunning geldt, indien de dienstverrichter reeds in Nederland of in een andere lidstaat aan een gelijkwaardige
      eis voldoet.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel30
  - number: '30.2'
    text: |-
      Een bevoegde instantie verricht bij de voorbereiding van een beschikking als bedoeld in het eerste lid geen
      onderzoek naar een eis als in dat lid bedoeld, indien reeds in Nederland of in een andere lidstaat onderzoek naar
      een gelijkwaardige eis is verricht en hieruit blijkt dat de dienstverrichter aan die eis voldoet.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel30
  - number: '31.1'
    text: |-
      Indien bij wettelijk voorschrift geen termijn is bepaald binnen welke een beschikking op een aanvraag om de
      desbetreffende vergunning dient te worden gegeven, wordt de beschikking zo spoedig mogelijk, doch uiterlijk binnen
      acht weken na ontvangst van de aanvraag gegeven.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel31
  - number: '31.2'
    text: |-
      [Artikel 4:14, eerste lid, van de Algemene wet bestuursrecht][ref1] vindt alleen toepassing indien een beslissing
      op een aanvraag om een vergunning vanwege de ingewikkeldheid van het onderwerp niet kan worden gegeven binnen de in
      het eerste lid bedoelde termijn. De termijn kan eenmaal worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '31.3'
    text: |-
      De in [artikel 4:14, derde lid, van de Algemene wet bestuursrecht][ref1] bedoelde kennisgeving wordt bij toepassing
      van het tweede lid gedaan binnen de desbetreffende termijn, is met redenen omkleed, en geeft een zo kort mogelijke
      termijn waarbinnen de beslissing wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '31.4'
    text: |-
      Indien [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] op een aanvraag van toepassing
      is, kan een bevoegde instantie de termijn voor het geven van de beschikking, in afwijking van
      [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref2] ten hoogste eenmaal voor beperkte duur
      verlengen. De verlenging en de duur daarvan wordt, met inachtneming van de in artikel 3:18, tweede lid, bedoelde
      termijn van acht weken, gemotiveerd aan de aanvrager medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '32.1'
    text: |-
      Indien een aanvrager van een vergunning met toepassing van [artikel 4:5 van de Algemene wet bestuursrecht][ref1]
      de gelegenheid krijgt de aanvraag binnen de daarvoor door de bevoegde instantie gestelde termijn aan te vullen,
      vermeldt de bevoegde instantie tevens de gevolgen daarvan voor de termijn van het geven van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '32.2'
    text: |-
      In afwijking van [artikel 4:15, eerste lid, onderdeel b, van de Algemene wet bestuursrecht][ref1], wordt de termijn
      voor het geven van een beschikking op een aanvraag voor een vergunning niet opgeschort door een mededeling als
      bedoeld in dat onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '33.1'
    text: |-
      Een bevoegde instantie beperkt een vergunning die zij al dan niet voor onbepaalde tijd kan verlenen niet in
      geldigheidsduur, tenzij:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: 33.1.a
    text: die geldigheidsduur automatisch wordt verlengd,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: 33.1.b
    text: het aantal beschikbare vergunningen beperkt is door een dwingende reden van algemeen belang, of
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: 33.1.c
    text: een beperkte duur gerechtvaardigd is om een dwingende reden van algemeen belang.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: '33.2'
    text: |-
      Een vergunning waarvan de geldigheidsduur uitsluitend afhankelijk is van de voortdurende vervulling van de
      vergunningsvoorwaarden wordt aangemerkt als een vergunning voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: '33.3'
    text: |-
      Onder een vergunning met beperkte geldigheidsduur wordt niet verstaan een vergunning die op grond van wettelijke
      voorschriften of aan de vergunning verbonden voorwaarden zijn geldigheid verliest indien een dienstverrichter niet
      binnen de daartoe in de vergunning gestelde termijn zijn dienstverrichtingen aanvangt.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: '33.4'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: 33.4.a
    text: vergunningen die naar hun aard beperkt zijn in de tijd;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: 33.4.b
    text: |-
      vergunningen waarvan het aantal beperkt is door schaarste van de beschikbare natuurlijke hulpbronnen of de
      bruikbare technische mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: '33.5'
    text: |-
      Een bevoegde instantie verleent een vergunning als bedoeld in het vierde lid, onderdeel b, voor een passende
      beperkte duur.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel33
  - number: '34.1'
    text: 'Een dienstverrichter stelt de bevoegde instantie die een vergunning heeft verleend in kennis van:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel34
  - number: 34.1.a
    text: de oprichting van dochterondernemingen waarvan de activiteiten onder de desbetreffende vergunning vallen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel34
  - number: 34.1.b
    text: wijzigingen in zijn situatie waardoor niet meer aan de voorwaarden van de desbetreffende vergunning wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel34
  - number: '34.2'
    text: |-
      Een dienstverrichter die de aanvraag om de vergunning heeft gedaan via het centraal loket, verricht de mededeling,
      bedoeld in het eerste lid, door verzending via het centraal loket.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel34
  - number: '35.1'
    text: |-
      Een bevoegde instantie bevestigt de ontvangst van een melding die een dienstverrichter krachtens wettelijk
      voorschrift bij een bevoegde instantie moet verrichten, indien:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel35
  - number: 35.1.a
    text: |-
      het doen van die melding en het verloop van een bij wettelijk voorschrift bepaalde termijn na die melding een
      voorwaarde is tot vestiging en
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel35
  - number: 35.1.b
    text: de bevoegde instantie bevoegd is binnen de termijn, bedoeld in onderdeel a, een vergunning te verlenen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel35
  - number: '35.2'
    text: |-
      Een dienstverrichter voldoet aan een eis die bij een melding als bedoeld in het eerste lid geldt, indien
      de dienstverrichter reeds in Nederland of in een andere lidstaat aan een gelijkwaardige eis voldoet.
      [Artikel 30, tweede lid][ref1], is van overeenkomstige toepassing op een bevoegde instantie die bevoegd is binnen
      de termijn, bedoeld in het eerste lid, onderdeel a, een vergunning te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel30
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '30'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '36.1'
    text: |-
      Een dienstverrichter stelt de bevoegde instantie bij welke hij een melding heeft gedaan als bedoeld in
      [artikel 35, eerste lid][ref1], in kennis van:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel35
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 36.1.a
    text: de oprichting van dochterondernemingen waarvan de activiteiten onder de desbetreffende melding vallen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel36
  - number: 36.1.b
    text: wijzigingen in de gegevens die hij bij de melding heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel36
  - number: '36.2'
    text: |-
      Een dienstverrichter die reeds gebruik heeft gemaakt van de mogelijkheid, bedoeld in
      [artikel 13, eerste lid][ref1], verricht de mededeling, bedoeld in het eerste lid, door verzending via het centraal
      loket.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel13
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '37.1'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 37.1.a
    text: |-
      verstrekt op verzoek van een bevoegde instantie uit een andere lidstaat informatie over een dienstverrichter en
      zijn dienstverrichtingen,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel37
  - number: 37.1.b
    text: |-
      verricht op verzoek van een bevoegde instantie uit een andere lidstaat verificaties, inspecties en onderzoeken naar
      een dienstverrichter en zijn dienstverrichtingen, indien het verzoek deugdelijk is gemotiveerd en de desbetreffende
      instantie bevoegd is om aan het verzoek te voldoen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel37
  - number: '37.2'
    text: |-
      Een bevoegde instantie verstrekt de in het eerste lid, onderdelen a en b, bedoelde informatie en resultaten van
      verificaties, inspecties en onderzoeken, alsmede informatie over genomen maatregelen jegens de desbetreffende
      dienstverrichter, binnen de kortst mogelijke termijn en langs elektronische weg.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel37
  - number: '37.3'
    text: |-
      De in het tweede lid bedoelde verstrekking geschiedt via het interne markt informatiesysteem, tenzij naar het
      oordeel van de bevoegde instantie ter uitvoering van regelgeving van de Europese Gemeenschap een ander elektronisch
      communicatiesysteem is aangewezen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel37
  - number: '38.1'
    text: |-
      Indien een bevoegde instantie niet kan voldoen aan een verzoek als bedoeld in
      [artikel 37, eerste lid, onderdeel a of b][ref1], stelt zij de instantie die het verzoek heeft gedaan daarvan snel
      in kennis, teneinde een oplossing te vinden.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '38.2'
    text: |-
      Een bevoegde instantie informeert het in [artikel 55][ref1] bedoelde contactpunt:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 38.2.a
    text: |-
      indien zij niet bevoegd is om aan een verzoek als bedoeld in [artikel 37, eerste lid, onderdeel a of b][ref1],
      te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 38.2.b
    text: indien de toepassing van het eerste lid niet leidt tot een oplossing met de instantie die het verzoek heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel38
  - number: '39.1'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], motiveert op een deugdelijke wijze een verzoek aan een bevoegde instantie uit een andere
      lidstaat:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 39.1.a
    text: om informatie over een dienstverrichter en zijn dienstverrichtingen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel39
  - number: 39.1.b
    text: |-
      tot het verrichten van verificaties, inspecties en onderzoeken naar een dienstverrichter en zijn
      dienstverrichtingen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel39
  - number: '39.2'
    text: |-
      Indien een bevoegde instantie uit een andere lidstaat niet voldoet aan een verzoek als bedoeld in het eerste lid,
      onderdeel a of b, informeert de desbetreffende bevoegde instantie het in [artikel 55][ref1] bedoelde contactpunt
      hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '40.1'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], verstrekt op verzoek van een bevoegde instantie van een andere lidstaat informatie over
      onherroepelijke bestuursrechtelijke sancties of onherroepelijke tuchtrechtelijke maatregelen die door de
      eerstbedoelde bevoegde instantie jegens een dienstverrichter zijn getroffen, indien het desbetreffende verzoek
      deugdelijk is gemotiveerd en de desbetreffende instantie bevoegd is om aan het verzoek te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '40.2'
    text: |-
      Een bevoegde instantie verstrekt de in het eerste lid bedoelde informatie, onder vermelding van de bepalingen
      die zijn overtreden, binnen de kortst mogelijke termijn en langs elektronische weg, met inachtneming van
      [artikel 37, derde lid][ref1]. De dienstverrichter wordt daarvan onverwijld schriftelijk in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '41.1'
    text: |-
      Voor de toepassing van artikel 33, eerste lid, van de richtlijn wordt een verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] aangemerkt als informatie omtrent
      strafrechtelijke sancties.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '41.2'
    text: |-
      In afwijking van [artikel 33 van de Wet justitiële en strafvorderlijke gegevens][ref1] wordt een aanvraag tot het
      afgeven van een verklaring als bedoeld in het eerste lid met betrekking tot een dienstverrichter ingediend door een
      bevoegde instantie uit een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel33
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '33'
  - number: '41.3'
    text: |-
      Een aanvraag als bedoeld in het tweede lid wordt, in afwijking van
      [artikel 30, eerste lid, eerste volzin, van de Wet justitiële en strafvorderlijke gegevens][ref1] ingediend bij
      Onze Minister van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel30
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '30'
  - number: '41.4'
    text: |-
      [Artikel 37, derde lid][ref1], is van overeenkomstige toepassing op de in het tweede lid bedoelde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '42.1'
    text: |-
      Voor de toepassing van de [artikelen 32, eerste lid][ref1], [34][ref2], [35][ref3] en
      [36 van de Wet justitiële en strafvorderlijke gegevens][ref4] wordt als aanvrager aangemerkt de dienstverrichter
      ten aanzien van wie de verklaring wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0014194#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0014194#Artikel36
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0014194
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0014194
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0014194
        artikel: '36'
  - number: '42.2'
    text: |-
      Onze Minister van Veiligheid en Justitie stelt de dienstverrichter ten aanzien van wie de verklaring wordt
      gevraagd in kennis van de in [artikel 41, tweede lid][ref1], bedoelde aanvraag en vraagt zijn instemming met het in
      behandeling nemen van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel41
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '41'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '42.3'
    text: |-
      Indien de dienstverrichter geen instemming verleent, bericht Onze Minister van Veiligheid en Justitie dit aan de
      bevoegde instantie die de verklaring heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel42
  - number: '42.4'
    text: |-
      [Artikel 37, tweede en derde lid][ref1], zijn van overeenkomstige toepassing op de in het derde lid bedoelde
      berichten.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '42.5'
    text: |-
      Voor het in behandeling nemen van een aanvraag tot afgifte van een verklaring omtrent het gedrag kan Onze
      Minister van Veiligheid en Justitie van de aanvrager, bedoeld in het eerste lid, een vergoeding van kosten
      verlangen. [Artikel 39, tweede en vierde lid, van de Wet justitiële en strafvorderlijke gegevens][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel39
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '39'
  - number: '43.1'
    text: |-
      Onze Minister van Veiligheid en Justitie informeert de dienstverrichter ten aanzien van wie de verklaring wordt
      gevraagd indien hij voornemens is de afgifte van de verklaring omtrent het gedrag te weigeren.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel43
  - number: '43.2'
    text: |-
      Onze Minister van Veiligheid en Justitie verstrekt de verklaring omtrent het gedrag dan wel de weigering tot
      afgifte daarvan aan de in het eerste lid bedoelde dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel43
  - number: '43.3'
    text: |-
      Onze Minister van Veiligheid en Justitie stelt de bevoegde instantie uit een andere lidstaat zo spoedig mogelijk
      op de hoogte van de afgifte dan wel weigering van de verklaring omtrent het gedrag. Bij de kennisgeving over de
      afgifte van de verklaring wordt de strekking van de afgegeven verklaring medegedeeld.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel43
  - number: '43.4'
    text: |-
      Indien de weigering van de verklaring omtrent het gedrag nog niet onherroepelijk is informeert Onze Minister van
      Veiligheid en Justitie de bevoegde instantie uit een andere lidstaat daarover.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel43
  - number: '43.5'
    text: |-
      [Artikel 37, tweede en derde lid][ref1], is van overeenkomstige toepassing op de informatieverschaffing, bedoeld in
      het derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '44.1'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], motiveert op deugdelijke wijze een verzoek aan een bevoegde instantie uit een andere lidstaat
      om informatie over aan een dienstverrichter opgelegde bestuursrechtelijke sancties, tuchtrechtelijke maatregelen of
      strafrechtelijke sancties of met betrekking tot een dienstverrichter genomen beslissingen betreffende insolventie
      of faillissement waarbij sprake is van frauduleuze praktijken.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '44.2'
    text: |-
      [Artikel 39, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel39
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '39'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '45'
    text: 'Deze paragraaf is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel45
  - number: 45.a
    text: |-
      indien de wettelijke voorschriften op grond waarvan de maatregel wordt genomen, vallen onder een communautaire
      harmonisatiemaatregel op het gebied van de veiligheid van diensten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel45
  - number: 45.b
    text: |-
      op opsporingsonderzoeken als bedoeld in [artikel 132a van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel132a
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 132a
  - number: '46'
    text: |-
      Voor de toepassing van de [artikelen 47 tot en met 49][ref1] beschikken de bevoegde instanties over de toezichts-
      en handhavingsbevoegdheden die hen bij wettelijk voorschrift zijn toegekend, voor zover die bevoegdheden
      uitsluitend kunnen worden uitgeoefend ten aanzien van in Nederland gevestigde dienstverrichters.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel47
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '47'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], kan uitsluitend in buitengewone omstandigheden ten behoeve van de veiligheid van
      dienstverrichtingen maatregelen treffen jegens een dienstverrichter die is gevestigd in een andere lidstaat en die
      diensten verricht in het gebied waarop deze wet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '48.1'
    text: |-
      Voordat een bevoegde instantie een maatregel treft als bedoeld in [artikel 47][ref1], verzoekt zij de bevoegde
      instantie uit de lidstaat van vestiging van de dienstverrichter jegens hem maatregelen te nemen. Daarbij verstrekt
      de bevoegde instantie alle relevante informatie over de betrokken dienstverrichter, zijn dienstverrichtingen en de
      omstandigheden ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel47
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '48.2'
    text: |-
      De bevoegde instantie stelt de Europese Commissie, de bevoegde instantie uit de lidstaat van vestiging en het in
      [artikel 55][ref1] bedoelde contactpunt in kennis van het voornemen tot het treffen van maatregelen, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 48.2.a
    text: |-
      naar haar oordeel de bevoegde instantie uit de lidstaat van vestiging het krachtens het eerste lid gedane verzoek
      om maatregelen te treffen niet of onvoldoende heeft ingewilligd en
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: 48.2.b
    text: zij haar voornemen tot het treffen van een maatregel jegens de dienstverrichter handhaaft.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: '48.3'
    text: |-
      De kennisgeving, bedoeld in het tweede lid, geschiedt voor zover het de Europese Commissie en de bevoegde instantie
      uit de lidstaat van vestiging betreft, via het interne markt informatiesysteem en bevat de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: 48.3.a
    text: |-
      de redenen waarom de door de bevoegde instantie van de lidstaat van vestiging van de dienstverrichter genomen of
      voorgenomen maatregelen onvoldoende zijn,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: 48.3.b
    text: |-
      de redenen waarom de voorgenomen maatregel de afnemer van de dienst meer bescherming biedt dan de maatregel die de
      bevoegde instantie van de lidstaat van vestiging zou nemen en
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: 48.3.c
    text: een toelichting op de evenredigheid van de voorgenomen maatregel.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: '48.4'
    text: |-
      De bevoegde instantie treft de maatregel niet eerder dan nadat de bij of krachtens de richtlijn daarvoor gestelde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: '48.5'
    text: |-
      De bevoegde instantie geeft terstond uitvoering aan een verzoek van de Europese Commissie om, vanwege de
      strijdigheid van die maatregel met het Gemeenschapsrecht, de maatregel niet te treffen of de uitvoering ervan te
      staken.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel48
  - number: '49.1'
    text: |-
      Indien een bevoegde instantie op grond van [artikel 47][ref1] een maatregel treft, kan zij in spoedeisende
      gevallen de toepassing van [artikel 48, eerste tot en met vierde lid][ref2], achterwege laten. In dat geval stelt
      zij de Europese Commissie, de bevoegde instantie uit de lidstaat van vestiging van de dienstverrichter en het in
      [artikel 55][ref3] bedoelde contactpunt onverwijld in kennis van de genomen maatregel met opgave van de redenen
      waarom er sprake is van een spoedeisend karakter.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '49.2'
    text: |-
      [Artikel 48, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel48
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '50.1'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], treft op verzoek van een bevoegde instantie uit een andere lidstaat maatregelen jegens een in
      Nederland gevestigde dienstverrichter indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: 50.1.a
    text: |-
      het desbetreffende verzoek alle relevante informatie bevat over de betrokken dienstverrichter, zijn
      dienstverrichtingen en de omstandigheden ter zake;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
  - number: 50.1.b
    text: de desbetreffende instantie bevoegd is om aan het verzoek te voldoen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
  - number: 50.1.c
    text: de verzochte maatregelen verband houden met de veiligheid van dienstverrichtingen in een andere lidstaat;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
  - number: 50.1.d
    text: zij er voldoende van overtuigd is dat de aan het verzoek ten grondslag liggende feiten juist zijn.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
  - number: '50.2'
    text: |-
      De bevoegde instantie stelt de instantie die het verzoek heeft gedaan en het in [artikel 55][ref1] bedoelde
      contactpunt onverwijld in kennis van de genomen of voorgenomen maatregelen dan wel van de redenen waarom zij geen
      maatregelen treft.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '50.3'
    text: |-
      Op een kennisgeving aan de bevoegde instantie als bedoeld in het tweede lid is [artikel 37, derde lid][ref1], van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel37
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '37'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '51.1'
    text: |-
      Zodra een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], kennis neemt van gedragingen, ernstige specifieke handelingen of omstandigheden met betrekking
      tot een dienstverrichter of een dienstverrichting die ernstige schade aan de gezondheid, veiligheid van personen
      of het milieu kan veroorzaken, stelt deze instantie alle andere lidstaten, de Europese Commissie en het in
      [artikel 55][ref2] bedoelde contactpunt daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel55
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '51.2'
    text: |-
      De in het eerste lid bedoelde kennisgeving geschiedt via het interne markt informatiesysteem, tenzij naar het
      oordeel van de bevoegde instantie ter uitvoering van regelgeving van de Europese Gemeenschap een ander elektronisch
      communicatiesysteem is aangewezen.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel51
  - number: '51.3'
    text: De kennisgeving wordt gelijkgesteld met een besluit.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel51
  - number: '51.4'
    text: |-
      Tegelijkertijd met of zo spoedig mogelijk na de bekendmaking wordt van het besluit mededeling gedaan aan de
      dienstverrichter.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel51
  - number: '51.5'
    text: |-
      Het eerste lid is niet van toepassing op opsporingsonderzoeken als bedoeld in
      [artikel 132a van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel132a
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 132a
  - number: '52'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van de door de Europese Commissie krachtens
      artikel 32, derde lid, van de richtlijn vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel52
  - number: '53'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], ziet niet af van de toepassing van toezichts- of handhavingsmaatregelen jegens een
      dienstverrichter die in Nederland is gevestigd vanwege het feit dat de door die dienstverrichter verrichte dienst
      in een andere lidstaat is verricht of daar schade heeft veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '54'
    text: |-
      [Artikel 5:20 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing indien een bevoegde
      instantie medewerking vordert naar aanleiding van een verzoek van een bevoegde instantie uit een andere lidstaat
      als bedoeld in de [paragrafen 6.1][ref2], [6.2][ref3] en [6.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0026759#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0026759
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0026759
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0026759
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '55.1'
    text: Onze Minister draagt zorg voor de inrichting en instandhouding van een contactpunt.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: '55.2'
    text: 'Het contactpunt:'
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.a
    text: |-
      ondersteunt de uitwisseling van verzoeken om informatie over en tot het verrichten van verificaties, inspecties
      en onderzoeken naar dienstverrichters en hun dienstverrichtingen tussen de bevoegde instanties en de bevoegde
      instanties uit andere lidstaten;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.b
    text: is de bevoegde instanties al dan niet op verzoek behulpzaam bij
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.b.1°
    text: |-
      het oplossen van problemen bij verzoeken om informatie over en tot het verrichten van verificaties, inspecties en
      onderzoeken naar dienstverrichters en hun dienstverrichtingen aan of van bevoegde instanties uit andere lidstaten,
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.b.2°
    text: het gebruik van het waarschuwingsmechanisme;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.c
    text: |-
      verstrekt al dan niet op verzoek aan de bevoegde instanties de nodige informatie met betrekking tot gelijkwaardige,
      of gezien hun doel in wezen vergelijkbare eisen en onderzoeken waaraan een dienstverrichter in een andere lidstaat
      is onderworpen;
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: 55.2.d
    text: |-
      onderhoudt contacten met de contactpunten van andere lidstaten ten behoeve van een goede werking van de
      administratieve samenwerking.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel55
  - number: '56'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], draagt zorg voor aansluiting op het interne markt informatiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '57'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot technische eisen waaraan de bevoegde
      instanties moeten voldoen met het oog op aansluiting op het interne markt informatiesysteem en met betrekking tot
      de beveiliging van persoonsgegevens bij gebruik van het interne markt informatiesysteem.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel57
  - number: '58'
    text: |-
      Een bevoegde instantie die is betrokken bij een of meer eisen of vergunningstelsels als bedoeld in
      [artikel 2][ref1], kan het interne markt informatiesysteem benutten voor de uitwisseling van gegevens binnen
      Nederland met betrekking tot dienstverrichters en dienstverrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '59.1'
    text: |-
      Onze Minister verwerkt persoonsgegevens als bedoeld in
      [artikel 1, onderdeel a, van de Wet bescherming persoonsgegevens][ref1], bestaande uit de contactgegevens van de
      contactpersonen van de bevoegde instanties, met het doel de uitwisseling van berichten die betrekking hebben op de
      afwikkeling van verzoeken om informatie en verificaties, inspecties en onderzoeken en op waarschuwingsberichten,
      bedoeld in dit hoofdstuk, door bevoegde instanties via het interne markt informatiesysteem mogelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '59.2'
    text: |-
      Ten aanzien van de verwerking van persoonsgegevens, bedoeld in het eerste lid, is onze Minister verantwoordelijke
      in de zin van [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel1
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '1'
  - number: '60'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van door de Commissie krachtens artikel 36
      van de richtlijn vastgestelde uitvoeringsmaatregelen en praktische regels voor de elektronische uitwisseling van
      informatie tussen de lidstaten.
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel60
  - number: '65'
    text: |-
      [Artikel 28][ref1] is tot 1 januari 2012 niet van toepassing op vergunningen, verleend
      krachtens de [Provinciewet][ref2], de [Gemeentewet][ref3], de [Waterschapswet][ref4], de
      [Wet gemeenschappelijke regelingen][ref5] en de [Wet op de bedrijfsorganisatie][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005645
      [ref3]: https://wetten.overheid.nl/BWBR0005416
