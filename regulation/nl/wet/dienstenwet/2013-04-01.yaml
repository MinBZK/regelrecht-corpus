preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is om te voorzien in wettelijke regels om uitvoering te
    geven aan richtlijn nr. 2006/123/EG van het Europees Parlement en de Raad van de Europese Unie van 12 december 2006
    betreffende de diensten op de interne markt (PbEU L 376);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *afnemer:* natuurlijke persoon die onderdaan
      is van een lidstaat of die rechten heeft die hem door communautaire besluiten zijn verleend, of een rechtspersoon
      in de zin van artikel 48 van het Verdrag die in een lidstaat is gevestigd en, al dan niet voor beroepsdoeleinden,
      van een dienst gebruik maakt of wil maken;
        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *bevoegde instantie:* bestuursorgaan, een ander orgaan of een autoriteit, dat of die een toezichthoudende,
      vergunningverlenende of regelgevende rol vervult ten aanzien van diensten;
        - *centraal loket:* het centraal loket, bedoeld in [artikel 5, eerste lid][ref2];
        - *consument:* afnemer die een natuurlijke persoon is, niet handelend in de uitoefening van een beroep of bedrijf;
        - *dienst:* economische activiteit, anders dan in loondienst, die gewoonlijk tegen vergoeding geschiedt, als
      bedoeld in artikel 50 van het Verdrag;
        - *dienstverrichter:* natuurlijke persoon die onderdaan is van een lidstaat of een rechtspersoon in de zin van
      artikel 48 van het Verdrag, die in een lidstaat is gevestigd en die een dienst aanbiedt of verricht;
        - *dwingende redenen van algemeen belang:* redenen die als zodanig zijn erkend in de rechtspraak van het Hof van
      Justitie van de Europese Gemeenschappen;
        - *eis:* verplichting, verbodsbepaling, voorwaarde of beperking uit hoofde van wettelijke en bestuursrechtelijke
      bepalingen of voortvloeiend uit de rechtspraak, de administratieve praktijk, de regels van beroepsorden
      of de collectieve regels van beroepsverenigingen of andere beroepsorganisaties, die deze in het kader van
      de hun toegekende bevoegdheden hebben vastgesteld, met uitzondering van regels vastgelegd in collectieve
      arbeidsovereenkomsten waarover door de sociale partners is onderhandeld;
        - *gereglementeerd beroep:* beroepsactiviteit of een geheel van beroepsactiviteiten als bedoeld in artikel 3,
      eerste lid, onder a, van richtlijn nr. 2005/36/EG van het Europees Parlement en de Raad van de Europese Unie van
      7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU L 255);
        - *informatiepunt:* het informatiepunt, bedoeld in [artikel 6, eerste lid][ref3];
        - *interne markt informatiesysteem:* elektronisch informatiesysteem, bedoeld in artikel 34 van de richtlijn, voor
      de uitwisseling van informatie tussen de bevoegde instanties van de lidstaten;
        - *lidstaat:* lidstaat van de Europese Unie of van de Europese Economische Ruimte;
        - *lidstaat van vestiging:* lidstaat op het grondgebied waarvan de dienstverrichter is gevestigd;
        - *Onze Minister:* Onze Minister van Economische Zaken, Landbouw en Innovatie;
        - *procedures en formaliteiten:* activiteiten die naar hun aard door middel van uitwisseling van gegevens en
      bescheiden tussen een dienstverrichter en een of meer bevoegde instanties plaatsvinden en die op een eis of een
      vergunning betrekking hebben;
        - *richtlijn:* [richtlijn 2006/123/EG](32006L0123) van het Europees Parlement en de Raad van de Europese Unie van
      12 december 2006 betreffende diensten op de interne markt (PbEU L 376);
        - *Verdrag:* Verdrag tot oprichting van de Europese Gemeenschap;
        - *vergunningstelsel:* procedure die voor een dienstverrichter of afnemer de verplichting inhoudt bij een bevoegde
      instantie stappen te ondernemen ter verkrijging van een vergunning;
        - *vergunning:* beslissing, uitdrukkelijk of stilzwijgend, over de toegang tot of de uitoefening van een dienst;
        - *vestiging:* daadwerkelijke uitoefening van een economische activiteit als bedoeld in artikel 43 van het Verdrag,
      door een dienstverrichter voor onbepaalde tijd en vanuit een duurzame infrastructuur, van waaruit daadwerkelijk
      diensten worden verricht;
        - *zakelijke afnemer:* afnemer, niet zijnde een consument.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel6
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel1
    references:
