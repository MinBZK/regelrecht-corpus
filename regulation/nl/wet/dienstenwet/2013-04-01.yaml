  - number: '66.1'
    text: |-
      Bij algemene maatregel van bestuur worden tot 1 januari 2012 de vergunningen aangewezen
      waarvan de aanvraag op grond van [artikel 28][ref1] is uitgezonderd van de toepassing van
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0026759/2013-04-01#Artikel66
    references:
