      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '66.2'
    text: |-
      Het eerste lid is niet van toepassing op vergunningen, verleend krachtens de [Provinciewet][ref1],
      de [Gemeentewet][ref2], de [Waterschapswet][ref3], de [Wet gemeenschappelijke regelingen][ref4] en de
      [Wet op de bedrijfsorganisatie][ref5].


