$id: experimentenwet_onderwijs
regulatory_layer: WET
publication_date: '1996-04-23'
valid_from: '2020-11-01'
bwb_id: BWBR0002718
url: https://wetten.overheid.nl/BWBR0002718/2020-11-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het voor de ontwikkeling van het onderwijs wenselijk is een regeling
    te treffen op grond waarvan onderwijskundige experimenten kunnen worden gehouden die vallen buiten de kaders van
    de afzonderlijke onderwijswetten en in de Wet op het voortgezet onderwijs (Stb. 1967, 387) de mogelijkheden te
    verruimen tot afwijking wegens de bijzondere inrichting van het onderwijs;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: "Onze Minister": Onze Minister van Onderwijs, Cultuur en Wetenschap;
      "onderwijswetten": de [Wet op het primair onderwijs][ref1], de [Wet op de expertisecentra][ref2],
      de [Wet op het voortgezet onderwijs][ref3], de [Wet primair onderwijs BES][ref4], de
      [Wet voortgezet onderwijs BES][ref5]; "school": een school of instelling in de zin van een onderwijswet; "het
      bevoegd gezag": voor wat betreft


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0030280
      [ref5]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0003549
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0030280
      - id: ref5
        bwb_id: BWBR0030284
  - number: 1.a
    text: |-
      een gemeentelijke school: het college van burgemeester en wethouders, voor zover de raad niet anders bepaalt, en,
      indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen regelen;
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel1
  - number: 1.b
    text: 'een bijzondere school: het schoolbestuur;'
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel1
  - number: 1.c
    text: |-
      een openbare school in de openbare lichamen Bonaire, Sint Eustatius en Saba: het bestuurscollege van het openbaar
      lichaam Bonaire, Sint Eustatius of Saba;
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel1
  - number: '2.1'
    text: |-
      Indien het bevoegd gezag bij wijze van experiment onderwijs wenst te geven dat valt buiten de kaders van de
      afzonderlijke onderwijswetten, kan Onze Minister beslissen dat dit onderwijs uit de openbare kas wordt bekostigd.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister maakt zijn beslissing op een aanvraag als bedoeld in het eerste lid binnen negen maanden na ontvangst
      daarvan aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister beslist niet tot de bekostiging, bedoeld in het eerste lid, indien redelijkerwijs te verwachten is
      dat daardoor het leerlingenaantal van andere scholen in het voedingsgebied zodanig zal dalen dat hun voortbestaan
      wordt bedreigd.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister draagt er zorg voor dat krachtens dit artikel genomen beslissingen waar mogelijk in overeenstemming
      zijn met het beginsel van een evenwichtig geheel van onderwijsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '2.5'
    text: |-
      Een beslissing als bedoeld in het eerste lid, wordt gegeven voor een of meer tijdvakken, te zamen ten hoogste 10
      jaren omvattend. Onze Minister kan de termijn van 10 jaren met ten hoogste 5 jaren verlengen.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '2.6'
    text: 'De bekostiging krachtens het eerste lid kan voor de afloop van de daarvoor bepaalde termijn, worden beëindigd:'
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: 2.6.a
    text: op een met redenen omkleed verzoek van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: 2.6.b
    text: |-
      door Onze Minister indien niet meer wordt voldaan aan de regelen en voorwaarden, bedoeld in
      [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel4
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '4'
  - number: 2.6.c
    text: door Onze Minister indien het experiment niet tot de daarmee beoogde doeleinden blijkt te leiden;
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: 2.6.d
    text: |-
      indien Onze Minister van oordeel is, dat voortzetting van het experiment niet in het belang van de leerlingen zou
      zijn.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel2
  - number: '3.1'
    text: |-
      Indien toepassing van [artikel 2, eerste lid][ref1], wordt verlangd voor een gemeentelijke , voor een bijzondere
      school of voor een openbare school in het openbaar lichaam Bonaire, Sint Eustatius of Saba, dient het bevoegd gezag
      bij Onze Minister een verzoek in onder bijvoeging van een experimenteerplan en een begroting van uitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
  - number: '3.2'
    text: |-
      Het experimenteerplan geeft een duidelijke omschrijving van de doeleinden en de achtergronden van het experiment,
      van de werkmethode, de wetenschappelijke begeleiding, de evaluatie en de rapportering.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel3
  - number: '4.1'
    text: |-
      Op een school bekostigd ingevolge [artikel 2, eerste lid][ref1], zijn de door Onze Minister bij zijn beslissing
      aangewezen regelen en voorwaarden, gegeven bij of krachtens een der onderwijswetten, van toepassing. Voor zover
      niet krachtens de vorige volzin geregeld, bepaalt Onze Minister bij zijn beslissing welke regelen en voorwaarden
      voor de bekostiging zullen gelden, alsmede de wijze van bekostiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
  - number: '4.2'
    text: |-
      Indien de bekostiging van een experiment wordt beëindigd aan een school die onmiddellijk voorafgaand aan de
      toepassing van [artikel 2, eerste lid][ref1], uit de openbare kas werd bekostigd, wordt wederom vergoeding
      toegekend volgens dezelfde regelen en voorwaarden als voor het schooltype gelden, waartoe de school behoorde voor
      de aanvang van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
  - number: '4.3'
    text: |-
      Indien de bekostiging wordt beëindigd van een experiment waarop het tweede lid niet van toepassing is, zijn voor
      het uit de openbare kas bekostigde personeel dat ten gevolge daarvan wordt ontslagen, de regelingen, geldend bij
      ontslag van personeel van een vergelijkbare, in een der onderwijswetten geregelde schoolsoort van overeenkomstige
      toepassing. In geval van twijfel welke de vergelijkbare schoolsoort is, beslist Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4
  - number: '4.4'
    text: |-
      Bij beëindiging van de bekostiging, bedoeld in het derde lid, is het bevoegd gezag verplicht alle met de van
      het Rijk ontvangen gelden aangeschafte zaken aan het Rijk over te dragen volgens door Onze Minister te geven
      aanwijzingen. Indien naar het oordeel van Onze Minister andere onderwerpen regeling behoeven, bepaalt hij wat te
      dien aanzien zal gelden.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4
  - number: 4a.1
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand van het personeel wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4a
  - number: 4a.2
    text: |-
      Het bevoegd gezag en de personeelsorganisaties, bedoeld in het tweede en derde lid, kunnen gezamenlijk besluiten
      dat het overleg over de in dat lid bedoelde aangelegenheden, voor zover dit betrekking heeft op een of meer door
      het bevoegd gezag in stand gehouden scholen, wordt gevoerd met de personeelsgeleding van de medezeggenschapsraad,
      bedoeld in de [Wet medezeggenschap op scholen][ref1], van de desbetreffende school of scholen. Het bevoegd gezag en
      de personeelsorganisaties bepalen daarbij onder welke voorwaarden dat overleg wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020685
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020685
  - number: 4a.3
    text: |-
      Indien het overleg, bedoeld in het vierde lid, niet leidt tot een afronding overeenkomstig de op grond van dat
      lid vastgestelde voorwaarden, wordt alsnog over de desbetreffende aangelegenheden het overleg, bedoeld in het
      tweede en derde lid, gevoerd. De algemene maatregel van bestuur bepaalt tevens de gevallen waarin in dat overleg
      overeenstemming met de personeelsorganisaties dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4a
  - number: 4a.6
    text: |-
      Dit artikel is tot een bij koninklijk besluit te bepalen tijdstip niet van toepassing in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel4a
  - number: '5'
    text: |-
      De werking van de beschikking op een verzoek om verlenging van de bekostigingstermijn, alsmede omtrent beëindiging
      van de bekostiging op grond van [artikel 2, zesde lid][ref1], wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
  - number: '6'
    text: |-
      Onze Minister bepaalt welke rechten zijn verbonden aan akten, getuigschriften, diploma’s of verklaringen van een
      school die op grond van [artikel 2][ref1] uit de openbare kas wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
  - number: 7a.1
    text: |-
      Ten aanzien van hoger beroepsonderwijs waarop deze wet van toepassing is op het tijdstip van inwerkingtreding van
      de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], blijft het bepaalde bij of krachtens deze wet
      van toepassing tot het tijdstip waarop de bekostiging voor het desbetreffende experiment wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: 7a.2
    text: |-
      Indien een experiment een school voor de opleiding van leraren betreft, wordt aan die school geen nascholing
      verzorgd onverminderd artikel XIV, eerste volzin, van de wet van 7 juli 1993 (*Stb.* 405).
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7a
  - number: 7b
    text: |-
      Ten aanzien van educatie en beroepsonderwijs waarop deze wet van toepassing is op de dag voor inwerkingtreding van
      de desbetreffende bepalingen van de [Wet educatie en beroepsonderwijs][ref1], blijft het bepaalde bij of krachtens
      deze wet van toepassing tot het tijdstip waarop de bekostiging voor het desbetreffende experiment wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 7c.1
    text: |-
      Indien aan [artikel 2, eerste lid][ref1], toepassing wordt gegeven voor een experimentele school voor speciaal
      onderwijs, voor voortgezet speciaal onderwijs dan wel voor speciaal en voortgezet speciaal onderwijs, of voor
      een instelling voor speciaal en voortgezet speciaal onderwijs, zijn op die school onderscheidenlijk instelling de
      bepalingen van de [Wet op de expertisecentra][ref2] van toepassing, voor zover die betreffen de bekostiging door
      de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002718#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002718
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003549
  - number: 7c.2
    text: |-
      Voor de toepassing van het eerste lid bepaalt Onze Minister of de experimentele school of instelling wordt
      gelijkgesteld met een schoolsoort als bedoeld in de [Wet op de expertisecentra][ref1] dan wel of deze door de
      gemeente als een eigensoortige school voor speciaal onderwijs of voor voortgezet speciaal onderwijs, dan wel een
      eigensoortige school of instelling voor speciaal en voortgezet speciaal onderwijs dient te worden beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0003549
  - number: 7c.3
    text: |-
      Onze Minister vergoedt aan het bevoegd gezag van een experimentele school voor speciaal onderwijs, voor voortgezet
      speciaal onderwijs dan wel voor speciaal en voortgezet speciaal onderwijs, of een instelling voor speciaal en
      voortgezet speciaal onderwijs de uitgaven die naar zijn oordeel voor het experiment noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7c
  - number: 7d
    text: |-
      Ten behoeve van leerlingen van een experimentele school voor speciaal onderwijs, voor voortgezet speciaal onderwijs
      dan wel voor speciaal en voortgezet speciaal onderwijs, of een instelling voor speciaal en voortgezet speciaal
      onderwijs past de gemeente [artikel 4 van de Wet op de expertisecentra][ref1] toe, alsof het leerlingen zijn van
      een dergelijke school of instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel4
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '4'
  - number: '8'
    text: Deze wet kan worden aangehaald als "Experimentenwet onderwijs".
    url: https://wetten.overheid.nl/BWBR0002718/2020-11-01#Artikel8
