        artikel: 2a
  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *wet:* Wet waardering onroerende zaken;

      b. *besluit:* Uitvoeringsbesluit kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken;

      c. *waardering:* waardebepaling en waardevaststelling van onroerende zaken op basis van de wet;

      d. *verwerkbare gegevens:* gegevens voor de afnemers die voldoen aan de door de Waarderingskamer opgestelde
      kwaliteitscriteria;

      e. *object:* een onroerende zaak die ten minste een van de afnemers betrekt in de heffing van een belasting naar
      een waardemaatstaf.
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel2
  - number: '3'
    text: |-
      1 De Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt jaarlijks voor de individuele waterschappen het
      aandeel in de kosten van de waardering, bedoeld in artikel 2, tweede lid, van het besluit, vast. Ten behoeve van
      deze vaststelling verstrekt de Unie van Waterschappen de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      uiterlijk op 1 februari van het kalenderjaar een schriftelijke opgave van het aantal objecten per individueel
      waterschap.

      2 De in het eerste lid bedoelde vaststelling geschiedt op basis van een vast bedrag per
      object, voorzover gelegen in de gebieden die volgens de provinciale verordeningen bedoeld in
      [artikel 2, eerste lid, van de Waterschapswet][ref1] in waterschapsverband gelegen zijn, naar de stand van 1
      januari van het voorafgaande kalenderjaar, zoals bekend op 1 november van het voorafgaande kalenderjaar, en wordt
      uiterlijk op 1 maart van het kalenderjaar door de Minister van Binnenlandse Zaken en Koninkrijksrelaties aan de
      individuele waterschappen bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel2
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '2'
  - number: '4'
    text: |-
      De individuele waterschappen betalen aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties uiterlijk op 1
      april van het kalenderjaar het op de voet van [artikel 3][ref1] door hem vastgestelde individuele aandeel van het
      waterschap in de kosten van de waardering, bedoeld in [artikel 2, tweede lid][ref2], van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0015059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015059#Artikel2
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel4
    references:
