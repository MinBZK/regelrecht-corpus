  - number: '6'
    text: |-
      1 De Minister van Binnenlandse Zaken en Koninkrijksrelaties verricht uiterlijk op 1 mei van het kalenderjaar de
      uitbetaling aan elke individuele gemeente van de op de voet van [artikel 5][ref1] berekende vergoeding voor die
      gemeente.

      2 Indien een afnemer binnen een termijn van acht weken na de aanvang van het kalenderjaar niet of niet volledig
      beschikt over een gegevensbestand met verwerkbare gegevens van een gemeente naar de stand van 1 januari van
      dat kalenderjaar, vindt in afwijking van het eerste lid voor of op 1 mei van dat jaar geen volledige betaling
      plaats aan die gemeente indien deze afnemer de Minister van Binnenlandse Zaken en Koninkrijksrelaties binnen
      vier weken direct volgend op genoemde termijn van acht weken schriftelijk verzoekt, met afschrift van dit verzoek
      aan de Waarderingskamer en de gemeente, om de uitbetaling aan die gemeente gefaseerd te laten plaatsvinden.
      Bij dit verzoek geeft de desbetreffende afnemer aan hoe hoog het percentage van verwerkbare gegevens is van het
      gegevensbestand waarover hij beschikt.

      3 Indien een afnemer verzoekt om gefaseerde uitbetaling als bedoeld in het tweede lid, vindt de fasering als volgt
      plaats:

        - 0% uitbetaling bij een gegevensbestand met verwerkbare gegevens van 0% tot 35%;
        - 35% uitbetaling bij een gegevensbestand met verwerkbare gegevens van 35% tot 55%;
        - 55% uitbetaling bij een gegevensbestand met verwerkbare gegevens van 55% tot 75%;
        - 75% uitbetaling bij een gegevensbestand met verwerkbare gegevens van 75% tot 95%;
        - 95% uitbetaling bij een gegevensbestand met verwerkbare gegevens van 95% tot 100%, en
        - 100% uitbetaling bij een gegevensbestand met volledig verwerkbare gegevens.

      4 Indien meer dan één afnemer verzoekt om een gefaseerde uitbetaling als bedoeld in het tweede lid wordt bij de
      fasering uitgegaan van de afnemer met het laagste percentage verwerkbare gegevens.

      5 Indien het tweede lid toepassing heeft gevonden, dient het - deel van het - geleverde gegevensbestand dat door de
      afnemer niet verwerkbaar werd geacht in onderling overleg tussen de afnemer en de gemeente door de desbetreffende
      gemeente in overeenstemming te worden gebracht met de kwaliteitscriteria van de Waarderingskamer, met dien
      verstande dat partijen vanaf 1 juli van het kalenderjaar aan de Waarderingskamer kunnen verzoeken aan te geven
      op welke wijze het geleverde gegevensbestand in overeenstemming met de kwaliteitscriteria van de Waarderingskamer
      kan worden gebracht. Indien op deze wijze een toename van het percentage verwerkbare gegevens wordt gerealiseerd,
      wordt de Minister van Binnenlandse Zaken en Koninkrijksrelaties hierover door de gemeente en de afnemer, met
      afschrift aan de Waarderingskamer, schriftelijk geïnformeerd en gaat de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties binnen vier weken na ontvangst van deze schriftelijke opgave over tot uitbetaling.

      6 Indien na afloop van de in het tweede lid genoemde termijn van acht weken alsnog door de individuele gemeente
      gegevens worden geleverd naar de stand van 1 januari van het kalenderjaar, stelt deze gemeente de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties schriftelijk, met afschrift aan de Waarderingskamer en de afnemer, op de
      hoogte van deze levering en geeft daarbij aan hoe hoog het percentage verwerkbare gegevens volgens deze gemeente
      is. Voor de wijze van uitbetaling door de Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen de volgende
      twee situaties worden onderscheiden:

      1°. indien de afnemer niet binnen vier weken na de levering van deze gegevens de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties schriftelijk informeert dat de aldus geleverde gegevens niet of niet volledig verwerkbaar zijn,
      worden de gegevens binnen vier weken na de levering verwerkbaar geacht en gaat de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties vervolgens na het verstrijken van genoemde termijn, binnen vier weken doch niet vóór 1 mei
      van het kalenderjaar, over tot uitbetaling op basis van de door de gemeente verstrekte opgave;

      2°. indien de afnemer wel binnen vier weken na de levering van deze gegevens de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties schriftelijk, met afschrift aan de Waarderingskamer en de desbetreffende gemeente, informeert
      dat de aldus geleverde gegevens niet of niet volledig verwerkbaar zijn en daarbij aangeeft hoe hoog de toename
      van het percentage verwerkbare gegevens volgens deze afnemer is, gaat de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties niet over tot uitbetaling volgens de door de gemeente verstrekte opgave, maar gaat hij binnen
      vier weken na ontvangst van de schriftelijke opgave van de afnemer over tot uitbetaling op basis van de door de
      afnemer verstrekte opgave.

      7 De in het vijfde en zesde lid genoemde betalingen door de Minister van Binnenlandse Zaken en Koninkrijksrelaties
      vinden, met inachtneming van het vierde lid, plaats volgens de in het derde lid opgenomen fasering.


      [ref1]: https://wetten.overheid.nl/BWBR0015059#Artikel5
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel6
