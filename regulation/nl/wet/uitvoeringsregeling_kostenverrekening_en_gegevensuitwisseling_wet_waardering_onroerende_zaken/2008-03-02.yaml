  - number: '5'
    text: |-
      1 De in [artikel 2a van het besluit][ref1] bedoelde jaarlijkse vergoeding van het Rijk en de waterschappen ter zake
      van de kosten van de waardering wordt als volgt over de individuele gemeenten verdeeld:

      a. op de gezamenlijke vergoeding van het Rijk en de waterschappen in de kosten van waardering wordt eerst in
      mindering gebracht een bedrag van € 1.000.000 dat wordt uitgekeerd aan de Vereniging van Nederlandse Gemeenten
      ter vergoeding van kosten die samenhangen met verbeteringen op het gebied van kwaliteit en kostenbeheersing bij de
      uitvoering van de wet;

      b. het na de vermindering ingevolge onderdeel a overblijvende bedrag wordt over de individuele gemeenten verdeeld,
      waarbij de hoogte van de vergoeding voor elke individuele gemeente door de Minister van Binnenlandse Zaken en
      Koninkrijksrelaties als volgt wordt vastgesteld:

      1° een basisbedrag van € 10 921 voor elke gemeente, dat ingevolge het derde lid nog kan worden verlaagd of
      verhoogd;

      2° een variabele vergoeding per object die als volgt wordt berekend:









                            (Wg + 2 x Ng + Ag)




                            (T - Gt x € 10 921)


                            x -----------------------------------





                            (Wt + 2 x Nt + At)






      waarbij

      T voorstelt: de gezamenlijke vergoeding van het Rijk en de waterschappen voor de kosten van waardering, verminderd
      met de vergoeding voor de Vereniging van Nederlandse Gemeenten;

      Gt voorstelt: het totaal aantal gemeenten bij het begin van het kalenderjaar;

      Wt voorstelt: het totaal aantal woningen in alle gemeenten tezamen;

      Nt voorstelt: het totaal aantal niet-woningen in alle gemeenten tezamen;

      At voorstelt: het totaal aantal adressen in het buitengebied van alle gemeenten tezamen;

      Wg voorstelt: het totaal aantal woningen in de individuele gemeente;

      Ng voorstelt: het totaal aantal niet-woningen in de individuele gemeente;

      Ag voorstelt: het totaal aantal adressen in het buitengebied in de individuele gemeente.

      Als peildatum voor het totaal aantal woningen, niet-woningen en adressen wordt genomen 1 januari van het
      voorafgaande kalenderjaar.

      2 Nadat de gezamenlijke vergoeding van het Rijk en de waterschappen op de voet van het eerste lid is verdeeld,
      vindt er een berekening plaats om te bepalen in welke mate het in het eerste lid, onderdeel b, onder 1°, bedoelde
      basisbedrag moet worden verhoogd of verlaagd. Voor deze berekening wordt een gemiddelde vergoeding per object
      berekend volgens de formules:








                    gemiddelde vergoeding per object voor alle gemeenten tezamen =


                    T





                    ------------------------





                    (Wt + Nt)








                    gemiddelde vergoeding per object voor de individuele gemeente =


                    A





                    ------------------------





                    (Wg + Ng)






      waarbij

      A voorstelt: het volgens het eerste lid, onderdeel b, onder 1° en 2°, berekende aandeel voor de individuele
      gemeente.

      3 Indien de volgens het tweede lid berekende gemiddelde vergoeding per object voor de individuele gemeente minder
      bedraagt dan 90 procent van de volgens dat lid berekende gemiddelde vergoeding per object voor alle gemeenten
      tezamen, wordt het in het eerste lid, onderdeel b, onder 1°, genoemde basisbedrag zodanig verhoogd dat de
      gemiddelde vergoeding per object voor die individuele gemeente uitkomt op de bedoelde 90 procent. Het totaalbedrag
      van de aldus vastgestelde verhogingen van de basisbedragen van de individuele gemeenten die daarvoor in aanmerking
      komen, wordt in mindering gebracht op het totaal van de basisbedragen van de resterende gemeenten en over die
      gemeenten verdeeld, met dien verstande dat de vermindering voor een individuele gemeente er niet toe mag leiden dat
      de gemiddelde vergoeding per object voor die gemeente minder wordt dan de in de eerste volzin bedoelde 90 procent.

      4 De hoogte van de op de voet van de vorige leden berekende vergoeding voor de individuele gemeente wordt door de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties uiterlijk op 1 maart van het kalenderjaar aan de gemeente
      bekendgemaakt.


