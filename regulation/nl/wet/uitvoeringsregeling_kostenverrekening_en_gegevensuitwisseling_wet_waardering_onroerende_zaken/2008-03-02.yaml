preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 2 en 2a van het Uitvoeringsbesluit kostenverrekening en gegevensuitwisseling Wet waardering
    onroerende zaken;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling geeft uitvoering aan de [artikelen 2][ref1] en
      [2a van het Uitvoeringsbesluit kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007230#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel2a
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel1
