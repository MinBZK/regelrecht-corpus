  - number: '7'
    text: |-
      Voor het kalenderjaar 2003 wordt:

      a. voor de in artikel 3, tweede lid, artikel 4, artikel 5, vierde lid, en artikel 6, eerste lid, tweede lid en
      vijfde lid, genoemde data van onderscheidenlijk 1 maart, 1 april, 1 maart, 1 mei, 1 mei en 1 juli gelezen: 15 mei,
      1 juni, 1 juni, 1 juli, 1 juli en 1 september;

      b. in artikel 6, tweede lid, voor `binnen een termijn van acht weken na de aanvang van het kalenderjaar' gelezen:
      op 15 mei;

      c. in artikel 6, tweede lid, voor `direct volgend op genoemde termijn van acht weken' gelezen: na 15 mei.
    url: https://wetten.overheid.nl/BWBR0015059/2008-03-02#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van
      de Staatscourant waarin zij wordt geplaatst en werkt terug tot en met het tijdstip
      waarop het Koninklijk Besluit van 28 april 2003, Stb. 2003, 179, tot wijziging van het
      [Uitvoeringsbesluit kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken][ref1], in verband
      met een nieuwe verdeelsystematiek van de kosten van de waardering in werking is getreden.


