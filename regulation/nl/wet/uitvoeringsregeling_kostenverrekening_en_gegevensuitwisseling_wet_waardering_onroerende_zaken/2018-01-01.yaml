  - number: '4'
    text: |-
      De individuele waterschappen betalen aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties uiterlijk op 1
      april van het kalenderjaar het op de voet van [artikel 3][ref1] door hem vastgestelde individuele aandeel van het
      waterschap in de kosten van de waardering, bedoeld in [artikel 2, vijfde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015059#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007230#Artikel2
    url: https://wetten.overheid.nl/BWBR0015059/2018-01-01#Artikel4
