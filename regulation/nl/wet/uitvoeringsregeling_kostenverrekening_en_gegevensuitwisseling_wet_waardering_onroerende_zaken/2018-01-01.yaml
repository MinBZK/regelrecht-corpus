  - number: '6'
    text: |-
      De Waarderingskamer zendt jaarlijks voor 1 december de begroting voor het daaropvolgende kalenderjaar aan de
      Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0015059/2018-01-01#Artikel6
  - number: '7'
    text: |-
      Het college plaatst de aantekening ‘in onderzoek’ bij een waardegegeven binnen vier dagen, nadat er ten aanzien van
      dat waardegegeven een terugmelding is gedaan of er overigens gerede twijfel is ontstaan omtrent de juistheid van
      dat gegeven.
    url: https://wetten.overheid.nl/BWBR0015059/2018-01-01#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van
      de Staatscourant waarin zij wordt geplaatst en werkt terug tot en met het tijdstip
      waarop het Koninklijk Besluit van 28 april 2003, Stb. 2003, 179, tot wijziging van het
      [Uitvoeringsbesluit kostenverrekening en gegevensuitwisseling Wet waardering onroerende zaken][ref1], in verband
      met een nieuwe verdeelsystematiek van de kosten van de waardering in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007230
    url: https://wetten.overheid.nl/BWBR0015059/2018-01-01#Artikel8
