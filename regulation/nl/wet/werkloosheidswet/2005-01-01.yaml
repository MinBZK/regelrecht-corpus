  - number: 97d.3
    text: |-
      Ingeval het Uitvoeringsinstituut werknemersverzekeringen een aan een overheidswerknemer toegekende uitkering als
      bedoeld in het tweede lid aan een overheidswerkgever betaalt met het oogmerk die uitkering door diens tussenkomst
      te doen uitbetalen:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97d
  - number: 97d.3.a
    text: |-
      wordt de bedoelde uitkering niet vermeerderd met de daarover door de werkgever verschuldigde premie op grond van
      het tweede lid en wordt die uitkering verminderd met het door de overheidswerknemer of gewezen overheidswerknemer
      verschuldigde deel van de premie op grond van dat lid;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97d
  - number: 97d.3.b
    text: |-
      treedt, in afwijking van [artikel 11, vierde lid][ref1],
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], en
      [artikel 11, derde lid, van de Ziektewet][ref3], voorzover die artikelleden betrekking hebben op de premie, bedoeld
      in het tweede lid, de overheidswerkgever niet in de plaats van het Uitvoeringsinstituut werknemersverzekeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel11
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97d
    references:
