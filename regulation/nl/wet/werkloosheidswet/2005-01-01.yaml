      - id: ref2
        bwb_id: BWBR0001888
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 39a
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '629'
  - number: 97f.1.g
    text: |-
      de korting op de door de overheidswerkgever verschuldigde premie, bedoeld in [artikel 97c, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97c
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97f.1.h
    text: |-
      het op grond van [artikel 42 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan het Reïntegratiefonds
      af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: 97f.1.i
    text: |-
      de financiële tegemoetkomingen op grond van [artikel 7:6 van de Wet arbeid en zorg][ref1] en de daaraan verbonden
      uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '7'
  - number: 97f.1.j
    text: |-
      de op diens aanvraag aan de werkgever door het Uitvoeringsinstituut werknemersverzekeringen te verlenen vergoeding
      van de schade, die de werkgever lijdt door toepassing van [artikel 22b, eerste lid][ref1], en de daaraan verbonden
      uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel22b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 22b
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 97f.1.k
    text: |-
      de uitvoeringskosten verbonden aan werkzaamheden gericht op het ontvangen van bedragen, premies en bijdragen als
      bedoeld in [artikel 97e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97e
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97e
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97f.1.l
    text: |-
      de kosten van de werkzaamheden, bedoeld in [artikel 63a, vierde en vijfde lid, van de Ziektewet][ref1] alsmede
      de schade, bedoeld het zesde lid van dat artikel, die wordt vergoed aan een eigenrisicodrager als bedoeld in
      [artikel 63 van die wet][ref2] en de daaraan verbonden uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63a
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '63'
  - number: 97f.1.m
    text: |-
      de vergoedingen op grond van [artikel 72a, vierde lid][ref1], en de daaraan verbonden uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 72a
        hoofdstuk: VI
  - number: 97f.1.n
    text: |-
      de tegemoetkoming in de kosten van kinderopvang, bedoeld in [artikel 29, eerste lid, van de Wet kinderopvang][ref1]
      ten behoeve van de ouder die een persoon is als bedoeld in [artikel 6, eerste lid, onder h, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
  - number: 97f.1.o
    text: |-
      de op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1] te betalen uitkeringen en
      de daaraan verbonden uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 97f.1.p
    text: |-
      de kosten in verband met de uitvoering van [artikel 72][ref1] ten behoeve van personen als bedoeld in
      [artikel 78a][ref2], die recht hebben op uitkering op grond van hoofdstuk IIa of IIb.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
  - number: 97f.2
    text: |-
      In afwijking van het eerste lid, onderdelen b, c en d, komen de uitkeringen, die worden betaald door een
      eigenrisicodrager als bedoeld in [artikel 63 van de Ziektewet][ref1] of een werkgever die een onderneming verkrijgt
      als bedoeld in [artikel 63b, derde lid, van die wet][ref2], en de door hem gemaakte kosten ter zake van de betaling
      van die uitkeringen en van de werkzaamheden, bedoeld in [artikel 63a, eerste lid, van die wet][ref3], alsmede de
      op grond van enige wet over die uitkeringen verschuldigde premies die niet op die uitkeringen in mindering kunnen
      worden gebracht, niet ten laste van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97f
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 63b
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
  - number: 97g.1
    text: |-
      Vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van [artikel 72, tweede lid][ref1], voor zover
      dat artikel wordt toegepast ten aanzien van personen als bedoeld in [artikel 78a][ref2], komen ten laste van het
      Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
  - number: 97g.2
    text: |-
      De subsidies, bedoeld in artikel 73a en de kosten in verband met de uitvoering van dat artikel komen, voor
      zover dat artikel wordt toegepast ten aanzien van personen als bedoeld in [artikel 78a][ref1], ten laste van het
      Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
  - number: 97h.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vergoedt, ten laste van het Uitvoeringsfonds voor de overheid,
      aan het Rijk bijdragen die vanwege het Rijk worden verleend aan uit het buitenland afkomstige werknemers, die geen
      Nederlander zijn en die terugkeren naar hun land van herkomst of emigreren naar een ander land en tot het tijdstip
      van vertrek uitkering op grond van deze wet ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97h
  - number: 97h.2
    text: |-
      De in het eerste lid bedoelde vergoedingen zijn ten hoogste gelijk aan de bedragen, die de in het eerste lid
      bedoelde werknemers op grond van deze wet zouden hebben kunnen ontvangen ten laste van het Uitvoeringsfonds voor de
      overheid, indien zij werkloos waren gebleven en niet naar hun land van herkomst of een ander land waren vertrokken.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97h
  - number: 97h.3
    text: Onze Minister stelt regels met betrekking tot de aan het Rijk te vergoeden bijdragen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97h
  - number: 97i
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties kan een bedrag worden vastgesteld dat, in verband met de toepassing van de
      [artikelen 85, derde en vijfde lid][ref1], [86, eerste lid][ref2], en [97d, tweede lid][ref3], op uitkeringen
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4], volgens een bij die regeling te bepalen
      verdeling wordt afgedragen aan het Uitvoeringsfonds voor de overheid dan wel de wachtgeldfondsen en het Algemeen
      Werkloosheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97d
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '85'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '86'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97d
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0002524
  - number: 97j
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen omtrent de verrekening tussen het
      Uitvoeringsfonds voor de overheid enerzijds en het Uitvoeringsinstituut werknemersverzekeringen anderzijds van
      ontvangen premies en overige ontvangsten enerzijds en van verstrekte uitkeringen en gemaakte kosten anderzijds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97j
  - number: 97k.1
    text: |-
      Onze Minister deelt het bedrijfs- en beroepsleven in sectoren in, waarbij elke sector één of meer takken van
      bedrijf of beroep of gedeelten daarvan omvat, nadat hij het Uitvoeringsinstituut werknemersverzekeringen in de
      gelegenheid heeft gesteld daarover advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97k
  - number: 97k.2
    text: |-
      Onze Minister kan een sector als bedoeld in het eerste lid indelen in sectoronderdelen, waarbij elk sectoronderdeel
      de bedrijfsactiviteiten vanéé n of meer werkgevers omvat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97k
  - number: 97k.3
    text: |-
      Indien Onze Minister een sector in sectoronderdelen heeft ingedeeld, stelt het Uitvoeringsinstituut
      werknemersverzekeringen ten aanzien van elke bij de betrokken sector aangesloten werkgever vast bij welk
      sectoronderdeel de werkgever behoort of bij welk sectoronderdeel de werkzaamheden die hij doet verrichten, behoren.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97k
  - number: 97l.1
    text: |-
      Een werkgever is van rechtswege aangesloten bij de op grond van [artikel 97k][ref1] vastgestelde sector waartoe de
      werkzaamheden behoren die hij als werkgever doet verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97k
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97l
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97k
        hoofdstuk: VII
        paragraaf: '3'
  - number: 97l.2
    text: |-
      Indien een werkgever werkzaamheden doet verrichten die behoren tot verschillende sectoren, is hij van rechtswege
      aangesloten bij de sector waartoe de werkzaamheden behoren waarvoor hij als werkgever in de regel het grootste
      bedrag aan loon betaalt of vermoedelijk zal betalen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97l
  - number: 97l.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan met betrekking tot de aansluiting van een of meer categorieën
      van werkgevers bij een sector regels stellen die afwijken van het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97l
  - number: 97m.1
    text: |-
      De werkgever die op grond van [artikel 97l][ref1] bij een sector is aangesloten of ophoudt bij een sector
      aangesloten te zijn, doet daarvan schriftelijk melding bij het Uitvoeringsinstituut werknemersverzekeringen binnen
      een door het Uitvoeringsinstituut werknemersverzekeringen te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97m
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97l
        hoofdstuk: VII
        paragraaf: '3'
  - number: 97m.2
    text: |-
      Een melding als bedoeld in het eerste lid is geen aanvraag in de zin van
      [artikel 1:3, derde lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97m
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 97m.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen deelt een werkgever mee, bij welke sector en vanaf welke datum hij
      op grond van [artikel 97l][ref1] is aangesloten. Indien de mededeling afwijkt van de melding, bedoeld in het eerste
      lid, geldt de mededeling als een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97m
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97l
        hoofdstuk: VII
        paragraaf: '3'
  - number: 97m.4
    text: |-
      In afwijking van [artikel 97l, tweede lid][ref1], is het Uitvoeringsinstituut werknemersverzekeringen bevoegd
      ambtshalve of op verzoek te besluiten dat een werkgever met ingang van een door het Uitvoeringsinstituut
      werknemersverzekeringen aan te geven datum voor door dit instituut aan te wijzen werkzaamheden is aangesloten bij
      een andere sector dan de sector waartoe de werkzaamheden behoren die hij overigens doet verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97m
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97l
        hoofdstuk: VII
        paragraaf: '3'
  - number: 97n.1
    text: |-
      Indien één of meer werkgevers van een sector overgaan naar een andere sector, kan het Uitvoeringsinstituut
      werknemersverzekeringen besluiten dat tevens een deel van het vermogen van dit instituut, dat betrekking heeft
      op het door dit instituut voor die sector afzonderlijk beheerde en geadministreerde wachtgeldfonds, overgaat
      naar het vermogen dat betrekking heeft op een door dit instituut voor een andere sector afzonderlijk beheerd en
      geadministreerd wachtgeldfonds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97n
  - number: 97n.2
    text: 'Met betrekking tot het eerste lid stelt het Uitvoeringsinstituut werknemersverzekeringen regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97n
  - number: 97n.2.a
    text: de gevallen waarin vermogen overgaat;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97n
  - number: 97n.2.b
    text: de wijze van berekening van vermogensbestanddelen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97n
  - number: 97n.2.c
    text: de termijnen waarin en de wijze waarop vermogen overgaat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97n
  - number: '98'
    text: In de uitvoering van deze wet wordt voorzien door het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel98
  - number: '99'
    text: De werknemer is verzekerd bij het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel99
  - number: '101.1'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt een uitkeringsreglement werkloosheidsverzekeringen vast.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: '101.2'
    text: 'Onverminderd het elders in deze wet dienaangaande bepaalde, bevat het uitkeringsreglement bepalingen omtrent:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.a
    text: voorschriften ten behoeve van een doelmatige controle, die ten aanzien van de werknemers moeten worden genomen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.b
    text: voorschriften met betrekking tot het genieten van vakantie tijdens de duur van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.c
    text: |-
      voorschriften in verband met de betaling van de uitkering door tussenkomst van de werkgever, indien tijdens
      werkloosheid de dienstbetrekking voortduurt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.d
    text: andere voorwaarden, die aan het ontvangen van uitkering zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.e
    text: |-
      het betalen van een deel van de uitkering in de vorm van bijdragen aan sociale fondsen, waaronder begrepen bonnen,
      zegels en certificaten, die door het desbetreffende fonds worden uitgegeven of voorgeschreven; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: 101.2.f
    text: samenloop van uitkering en inkomsten uit of in verband met arbeid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: '101.3'
    text: |-
      Het uitkeringsreglement mag geen bepalingen bevatten, welke strijdig zijn met deze wet en de daarop berustende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel101
  - number: '102.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt voor een sector als bedoeld in [artikel 97k][ref1], met
      uitzondering van de sectoren waartoe alleen overheidswerkgevers behoren, een wachtgeldfonds in.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97k
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97k
        hoofdstuk: VII
        paragraaf: '3'
  - number: '102.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert de middelen, bedoeld in [artikel 89][ref1], en de
      uitgaven, bedoeld in [artikel 90, eerste lid][ref2], gezamenlijk en administreert deze middelen en uitgaven met
      betrekking tot elk wachtgeldfonds afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '89'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '103'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de in [artikel 92][ref1]
      bedoelde middelen tot dekking van de uitgaven en de uitgaven, bedoeld in de [artikelen 93][ref2] en [95][ref3] in
      de vorm van een Algemeen Werkloosheidsfonds dat deel uitmaakt van het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel95
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '92'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '93'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
