  - number: '85.4'
    text: De in het derde lid bedoelde vervangende premie is door de werkgever verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel85
  - number: '85.5'
    text: |-
      Het deel van de in het derde lid bedoelde vervangende premie, dat ten gunste komt van het wachtgeldfonds, bedraagt
      ten hoogste de premie die op grond van het eerste lid is vastgesteld. Het resterende deel van de vervangende premie
      komt ten gunste van het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel85
  - number: '85.6'
    text: |-
      Behalve voor degene die loon ontvangt uit een arbeidsovereenkomst als bedoeld in
      [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1] wordt het derde lid niet toegepast ingeval
      het Uitvoeringsinstituut werknemersverzekeringen de uitkering, vermeerderd met de daarover door
      de werkgever verschuldigde premies, betaalt aan de werkgever, bedoeld in [artikel 9][ref2],
      [10][ref3] of [12 van deze wet][ref4] en de [Ziektewet][ref5] en in [artikel 8][ref6], [9][ref7] of
      [11 van de Wet op de arbeidsongeschiktheidsverzekering][ref8], onafhankelijk van het voortbestaan van de
      dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
