  - number: '86.1'
    text: |-
      Onze Minister stelt het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds, vast op een
      percentage van het loon van de werknemer, met dien verstande, dat dit percentage voor alle takken van het bedrijf
      en beroep hetzelfde is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel86
  - number: '86.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt de premie vast voor de vrijwillige verzekering bedoeld in
      [artikel 68 van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel68
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '68'
  - number: '86.3'
    text: |-
      Op dezelfde wijze als in het eerste en het tweede lid bepaald kan een vastgesteld percentage te allen tijde worden
      herzien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel86
  - number: '86.4'
    text: |-
      Indien een herziening van het in het eerste lid bedoelde premiepercentage of een wijziging in de verdeling van de
      premie op grond van [artikel 81, derde lid][ref1], ingaat op een ander tijdstip dan met ingang van 1 januari, stelt
      Onze Minister een voor alle takken van bedrijf en beroep gemiddeld percentage vast voor werkgevers respectievelijk
      werknemers dat zal gelden voor het gehele kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel81
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '81'
        hoofdstuk: VII
        paragraaf: '1'
