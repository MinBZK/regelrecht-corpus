        artikel: '104'
        hoofdstuk: VIII
  - number: '2.1'
    text: Waar een natuurlijk persoon woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen en luchtvaartuigen, die binnen Nederland hun thuishaven
      hebben, beschouwd als deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel2
  - number: '3.1'
    text: |-
      Werknemer is de natuurlijke persoon, jonger dan 65 jaar, die in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: '3.2'
    text: |-
      Wie zijn dienstbetrekking buiten Nederland vervult, wordt niet als werknemer beschouwd, tenzij hij in Nederland
      woont en zijn werkgever eveneens in Nederland woont of gevestigd is. Voor zover een werkgever:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland wonende of
      gevestigde vaste vertegenwoordiger heeft; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.2.b
    text: in Nederland een of meer personen in dienst heeft en hij door of vanwege Onze Minister als werkgever is aangewezen,
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt niet als werknemer beschouwd de vreemdeling die niet rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.4.a
    text: |-
      personen, die buiten Nederland wonen ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.4.b
    text: |-
      personen, die in Nederland wonen, ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen en hun werkgever buiten Nederland woont of gevestigd is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan van het eerste, tweede en derde lid worden afgeweken ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.5.a
    text: vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.5.b
    text: |-
      personen, op wie een regeling van toepassing is inzake verzekering tegen geldelijke gevolgen van werkloosheid van
      de Nederlandse Antillen, van Aruba, van een andere mogendheid, of van een volkenrechtelijke organisatie; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.5.c
    text: personen, die slechts tijdelijk in Nederland verblijven of tijdelijk in Nederland werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: '3.6'
    text: 'Bij een maatregel, als bedoeld in het vijfde lid, kan worden afgeweken van het derde lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.6.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
  - number: 3.6.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3a.a
    text: |-
      wordt als werknemer beschouwd de persoon van wie de verzekering op grond van deze wet voortvloeit uit de toepassing
      van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als werknemer beschouwd de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel3a
  - number: '4.1'
    text: 'Als dienstbetrekking wordt mede beschouwd de arbeidsverhouding van de persoon die:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.a
    text: |-
      anders dan als zelfstandige en anders dan als thuiswerker, op grond van een overeenkomst tot aanneming van werk als
      bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 4.1.b
    text: de in onderdeel *a* bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.c
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen
      van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde bemiddeling
      uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige werkzaamheid is
      en hij zich daarbij doorgaans door niet meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.d
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen
      van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander, mits hij
      de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem
      bijkomstige werkzaamheid is en hij zich daarbij doorgaans door niet meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.f
    text: 'als lid van de bemanning van een vissersvaartuig aanspraak heeft op een aandeel in de besomming, tenzij hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.f.1°
    text: |-
      als zodanig tegen geldelijke gevolgen van arbeidsongeschiktheid is verzekerd bij het Sociaal Fonds voor de
      Maatschapsvisserij; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.f.2°
    text: exploitant of mede-exploitant van het vaartuig is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.g
    text: zijn militaire dienstplicht of in plaats daarvan vervangende dienst vervult;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.1.h
    text: |-
      degene, die als bestuurder werkzaam is ten behoeve van een coöperatie die met haar leden uitsluitend
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] sluit,
      indien hij lid is van de coöperatie en deze blijkens haar statuten en met inachtneming van de vereisten gesteld in
      het derde lid en krachtens het vierde lid kan worden beschouwd als een coöperatie met werknemerszelfbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '4.2'
    text: |-
      Het eerste lid, onderdeel *a* en *b*, blijft buiten toepassing, indien de in onderdeel *a* bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: '4.3'
    text: 'Een coöperatie als bedoeld in het eerste lid, onderdeel *h*, dient te voldoen aan de vereisten, dat:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.3.a
    text: |-
      doorgaans ten minste twee derde deel van het aantal personen met wie de coöperatie een arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] heeft gesloten, lid van de
      coöperatie is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 4.3.b
    text: |-
      het lidmaatschap van de coöperatie door ieder van de in onderdeel *a* bedoelde personen onder dezelfde voorwaarden
      kan worden verkregen en voorwaarden van geldelijke aard geen wezenlijke belemmering vormen voor de verkrijging van
      het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.3.c
    text: de leden van de coöperatie ieder één stem hebben;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.3.d
    text: |-
      de arbeidsvoorwaarden van de leden van de coöperatie niet wezenlijk verschillen van hetgeen gebruikelijk is in
      gelijksoortige ondernemingen in de desbetreffende sector;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.3.e
    text: |-
      een lid van de coöperatie behoudens in geval van liquidatie van de coöperatie, bij beëindiging van zijn
      lidmaatschap ten hoogste aanspraak kan maken op het door hem uit hoofde van een geldelijke voorwaarde als bedoeld
      in onderdeel *b*, hetzij uit anderen hoofde aan de coöperatie betaalde bedrag, herrekend naar geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: '4.4'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld waarbij de in het derde lid genoemde vereisten
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.4.a
    text: nader worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.4.b
    text: |-
      worden aangevuld met andere vereisten op grond waarvan de coöperatie kan worden beschouwd als een coöperatie met
      werknemerszelfbestuur.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: '4.5'
    text: 'Voor de toepassing van het eerste lid, onderdeel a, wordt onder zelfstandige verstaan de persoon die:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
  - number: 4.5.a
    text: |-
      in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
  - number: 4.5.b
    text: |-
      niet in Nederland woont en die belastbare winst uit Nederlandse onderneming geniet als bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.2'
  - number: 4.5.c
    text: |-
      directeur-grootaandeelhouder is als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], en het werk tot
      stand brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, op grond waarvan eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel5
  - number: 5.a
    text: als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel5
  - number: 5.b
    text: de in onderdeel *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel5
  - number: 5.c
    text: als musicus of anderszins als artiest optreedt of als beroep een tak van sport beoefent; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel5
  - number: 5.d
    text: |-
      tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds op grond van dit artikel en de
      [artikelen 3][ref1] en [4][ref2] als dienstbetrekking wordt beschouwd, doch hiermee maatschappelijk gelijk kan
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6.1'
    text: 'Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van een persoon:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: 6.1.a
    text: die minister, staatssecretaris, Nationale ombudsman of substituut-ombudsman is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: 6.1.b
    text: |-
      die als vrijwilliger werkzaamheden verricht als politiebeambte, alsmede van degene die als vrijwilliger al dan niet
      tegen loon werkzaamheden verricht bij de gemeentelijke brandweer;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: 6.1.c
    text: |-
      die ten behoeve van de natuurlijke persoon, tot wie hij in dienstbetrekking staat, uitsluitend of nagenoeg
      uitsluitend huiselijke of persoonlijke diensten in diens huishouding verricht en die diensten doorgaans op minder
      dan drie dagen per week verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: 6.1.d
    text: die directeur-grootaandeelhouder is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: 6.1.e
    text: |-
      indien degene met wie hij de arbeidsverhouding heeft, met betrekking tot die arbeidsverhouding op grond van
      [artikel 6a van de Wet op de loonbelasting 1964][ref1] niet als inhoudingsplichtige wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 6a
  - number: '6.2'
    text: Het eerste lid is alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: '6.3'
    text: |-
      Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen onder
      directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel *d*, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Tot een bij of krachtens algemene maatregel van bestuur, op voordracht van Onze Minister
      tezamen met Onze Minister van Binnenlandse Zaken, te bepalen tijdstip wordt niet als
      dienstbetrekking beschouwd de arbeidsverhouding van de overheidswerknemer, bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '7.2'
    text: Het in het eerste lid bedoelde tijdstip kan voor groepen van overheidswerknemers verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen nadere en, zo nodig, van deze
      wet afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een persoon wiens dienstbetrekking is geëindigd, behoudt de hoedanigheid van werknemer, voor zover hij geen
      werkzaamheden verricht uit hoofde waarvan hij op grond van deze wet niet als werknemer wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden in de uitoefening van een
      bedrijf of in de zelfstandige uitoefening van een beroep, herkrijgt bij beëindiging van die werkzaamheden de
      hoedanigheid van werknemer, voor zover die beëindiging plaatsvindt binnen een tijdvak van anderhalf jaar nadat die
      werkzaamheden een aanvang hebben genomen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel8
  - number: '8.3'
    text: |-
      Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden als lid van de Eerste Kamer
      der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam, dat bij rechtstreekse
      verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap, herkrijgt bij beëindiging van die
      werkzaamheden de hoedanigheid van werknemer, voor zover die beëindiging plaatsvindt binnen het tijdvak van de bij
      de aanvang van die werkzaamheden voor die persoon nog geldende uitkeringsduur krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel8
  - number: '8.4'
    text: |-
      Onverminderd het tweede en derde lid herkrijgt de persoon na afloop van de in het eerste lid bedoelde werkzaamheden
      de hoedanigheid van werknemer, indien deze niet langer hebben geduurd dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel8
  - number: '9'
    text: |-
      Werkgever is de natuurlijke persoon tot wie, of het lichaam tot welk een of meer natuurlijke personen in
      dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel9
  - number: '10'
    text: 'Als werkgever wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel10
  - number: 10.a
    text: |-
      in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onderdeel: *a en b:* de aanbesteder; *c en d:* degene,
      met wie de overeenkomst tot bemiddeling is gesloten; *f:* de exploitant of mede-exploitant van het vaartuig; *g:*
      Onze Minister van Defensie of Onze Minister; *h:* de coöperatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: 10.b
    text: |-
      in de gevallen, bedoeld in [artikel 5][ref1], onderdeel: *a:* de opdrachtgever; *b:* de thuiswerker; *c:* degene,
      met wie het optreden of de sportbeoefening is overeengekomen; *d:* degene, die bij de in [artikel 5][ref2] bedoelde
      algemene maatregel van bestuur als werkgever wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '11.1'
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen wordt als werkgever beschouwd in de gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
  - number: 11.1.a
    text: |-
      ziekengeld wordt betaald op grond van de verplichte verzekering krachtens de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 11.1.b
    text: |-
      uitkering wordt betaald op grond van de verplichte verzekering of [hoofdstuk IV van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 11.1.c
    text: |-
      uitkering wordt betaald op grond van de verplichte verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 11.1.d
    text: |-
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1] aan
      de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 11.1.e
    text: |-
      geen ziekengeld wordt betaald op grond van [artikel 29, eerste lid][ref1], maar wel een toeslag op grond van de
      [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '29'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004043
  - number: '11.2'
    text: |-
      Ingeval het Uitvoeringsinstituut werknemersverzekeringen de uitkering of toeslag, bedoeld in het eerste
      lid, vermeerderd met de daarover door de werkgever verschuldigde premies, betaalt aan de werkgever, bedoeld
      in [artikel 9][ref1], [10][ref2] of [12][ref3], teneinde deze uitkering door diens tussenkomst te doen
      uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen, onafhankelijk van het voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel12
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '12'
        hoofdstuk: I
        paragraaf: '3'
  - number: '12'
    text: |-
      Onze Minister is bevoegd, in afwijking van de [artikelen 9][ref1] en [10][ref2], andere dan de aldaar bedoelde
      personen of lichamen aan te wijzen als werkgever ten aanzien van de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel10
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 12.a
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen van
      overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel12
  - number: 12.b
    text: een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel12
  - number: 12.c
    text: als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel12
  - number: '13'
    text: |-
      De werkgever is verplicht de werknemer de gelegenheid te geven tot het uitoefenen van de hem op grond van deze
      wet of de daarop berustende bepalingen toegekende bevoegdheden en tot het nakomen van de hem op grond van deze wet
      of de daarop berustende bepalingen opgelegde verplichtingen, voor zover de uitoefening van die bevoegdheden en de
      nakoming van die verplichtingen niet buiten de arbeidstijd kan geschieden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel13
  - number: '14.1'
    text: |-
      Loon is het loon in de zin van de [Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002126
  - number: '14.2'
    text: |-
      Minimumloon is het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1] of, indien het
      een werknemer jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], beide vermeerderd met de daarover
      berekende vakantietoeslag, bedoeld [in artikel 15 van die wet][ref4], en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '14.3'
    text: |-
      Loon, door verschillende personen te zamen onverdeeld ontvangen, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Met inachtneming van de [artikelen 16 tot en met 21][ref1] en de daarop berustende bepalingen heeft de werknemer
      die werkloos is recht op loongerelateerde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '16.1'
    text: 'Werkloos is de werknemer die:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.1.a
    text: |-
      ten minste vijf of ten minste de helft van zijn arbeidsuren per kalenderweek heeft verloren, alsmede het recht op
      onverminderde doorbetaling van zijn loon over die uren; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.1.b
    text: beschikbaar is om arbeid te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onder de in het eerste lid bedoelde arbeidsuren per kalenderweek wordt verstaan het aantal uren waarin de werknemer
      in de 26 kalenderweken onmiddellijk voorafgaande aan het intreden van zijn verlies van arbeidsuren gemiddeld per
      week als werknemer arbeid heeft verricht. Indien de werknemer minder dan vijf arbeidsuren per kalenderweek heeft
      verloren, wordt bij de bepaling van het aantal arbeidsuren, bedoeld in de eerste volzin, mede in aanmerking genomen
      het aantal uren waarin de werknemer in de 26 kalenderweken onmiddellijk voorafgaande aan het intreden van zijn
      verlies van arbeidsuren gemiddeld per week werkzaamheden heeft verricht uit hoofde waarvan hij niet als werknemer
      wordt beschouwd. Voor de vaststelling van de periode van 26 kalenderweken, bedoeld in de eerste en tweede zin,
      worden weken, tot een maximum van 78 weken, waarin de werknemer onbetaald verlof heeft genoten, niet in aanmerking
      genomen, tenzij dit leidt tot een lager aantal uren dan wanneer die weken wel in aanmerking zouden worden genomen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.3'
    text: |-
      Met het recht op onverminderde doorbetaling van zijn loon, bedoeld in het eerste lid, worden gelijkgesteld
      de inkomsten waarop de werknemer recht heeft in verband met de beëindiging van de dienstbetrekking,
      tot aan het bedrag aan loon dat de werknemer zou hebben ontvangen indien de dienstbetrekking door
      opzegging met inachtneming van de rechtens geldende termijn zou zijn geëindigd. Onder inkomsten als
      bedoeld in de eerste zin wordt niet verstaan een door de rechter toegewezen vergoeding van proceskosten.
      Onder de rechtens geldende termijn, bedoeld in de eerste zin, wordt verstaan de termijn die de
      werkgever of de werknemer op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref1], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref2] of een overeenkomstige bepaling van
      een soortgelijke regeling ieder voor zich bij opzegging in acht behoort te nemen. In geval de dienstbetrekking
      is geëindigd met wederzijds goedvinden wordt onder de rechtens geldende termijn, bedoeld in de eerste zin,
      verstaan de termijn die de werkgever op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref3], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref4] of een overeenkomstige bepaling van
      een soortgelijke regeling bij opzegging in acht behoort te nemen. Het in de eerste zin bedoelde bedrag wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel672
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel94
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '94'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '672'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: '94'
  - number: 16.3.a
    text: |-
      indien de dienstbetrekking door opzegging is geëindigd, toegerekend aan de periode onmiddellijk volgend op de datum
      waarop de dienstbetrekking is opgezegd;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.3.b
    text: |-
      indien de dienstbetrekking is geëindigd door ontbinding, toegerekend aan de periode onmiddellijk volgend op de
      datum van de beschikking tot ontbinding;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.3.c
    text: |-
      indien de dienstbetrekking is geëindigd met wederzijds goedvinden, toegerekend aan de periode onmiddellijk volgend
      op de datum waarop de beëindiging schriftelijk is overeengekomen, dan wel, bij gebrek aan een schriftelijke
      beëindigingsovereenkomst, aan de periode onmiddellijk volgend op het tijdstip waarop de dienstbetrekking is
      geëindigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.4'
    text: |-
      Het derde lid vindt geen toepassing indien de werkgever na het einde van de dienstbetrekking verkeert in een
      toestand als bedoeld in [artikel 61, eerste lid][ref1], en voorzover de werknemer als gevolg van die toestand de in
      het derde lid bedoelde inkomsten niet ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '16.5'
    text: 'Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.5.a
    text: |-
      omtrent de berekening van het verlies van arbeidsuren bij een opeenvolgend verlies van arbeidsuren, waarbij andere
      perioden voor de berekening van het aantal gewerkte arbeidsuren in aanmerking kunnen worden genomen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.5.b
    text: |-
      waarbij voor bepaalde groepen werknemers een kortere of langere periode voor de berekening van het aantal gewerkte
      arbeidsuren geldt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd ten aanzien van groepen van werknemers die in de regel
      meer dan 50 uren per kalenderweek werken, bij verlies van arbeidsuren uit een dienstbetrekking, waarin over de
      laatste 26 kalenderweken onmiddellijk voorafgaande aan het intreden van het verlies van arbeidsuren gemiddeld meer
      dan 50 uren is gewerkt, voor de toepassing van het tweede lid te bepalen welk aantal uren ten hoogste in aanmerking
      wordt genomen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de berekening van het aantal arbeidsuren, bedoeld in
      het tweede lid. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.7.a
    text: |-
      de gelijkstelling van uren waarin geen arbeid is verricht met arbeidsuren en het buiten beschouwing laten van uren
      waarin arbeid is verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: 16.7.b
    text: de berekening van het verlies van arbeidsuren met betrekking tot wisselende arbeidspatronen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.8'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen is de eerste dag van werkloosheid de eerste
      dag waarop een verlies van een of meer uren, alsmede een verlies van het recht op onverminderde doorbetaling van
      het loon over die uren intreedt in de kalenderweek waarin zich een situatie voordoet als bedoeld in het eerste of
      tiende lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '16.9'
    text: |-
      Indien bij het intreden van het arbeidsurenverlies, bedoeld in het eerste lid, niet wordt voldaan aan een
      van de overige in dat lid bedoelde voorwaarden, of de werknemer geen recht op uitkering heeft op grond van
      [artikel 19][ref1], wordt, in afwijking van het achtste lid, voor de toepassing van deze wet en de daarop
      berustende bepalingen als eerste werkloosheidsdag aangemerkt, de dag van de kalenderweek waarop aan de overige
      voorwaarden als bedoeld in het eerste lid wordt voldaan en [artikel 19][ref2] niet meer aan het recht op uitkering
      in de weg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '16.10'
    text: |-
      In afwijking van het eerste lid is tevens werkloos de werknemer die voldoet aan het eerste lid, onderdeel *a*,
      doch niet voldoet aan het eerste lid, onderdeel *b*, wegens het enkele feit dat hij voorafgaand aan of aansluitend
      op het arbeidsurenverlies deelneemt of gaat deelnemen aan een naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen noodzakelijke opleiding of scholing, als bedoeld in [artikel 76][ref1]. Voor de toepassing
      van het negende lid wordt een werknemer op wie de eerste volzin van toepassing is beschouwd als een werknemer die
      voldoet aan de voorwaarden van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
  - number: '16.11'
    text: Voor de toepassing van deze wet en de daarop berustende bepalingen is de maandag de eerste dag van de kalenderweek.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel16
  - number: '17'
    text: Recht op uitkering ontstaat voor de werknemer indien hij
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17
  - number: 17.a
    text: |-
      in 39 weken onmiddellijk voorafgaande aan de eerste dag van werkloosheid in ten minste 26 weken als werknemer
      arbeid heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17
  - number: 17.b.1°
    text: |-
      aantoont in de periode van vijf kalenderjaren onmiddellijk voorafgaande aan het jaar waarin zijn eerste
      werkloosheidsdag is gelegen, in ten minste vier kalenderjaren over 52 of meer dagen per jaar loon te hebben
      ontvangen; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17
  - number: 17.b.2°
    text: |-
      onmiddellijk voorafgaande aan of op zijn eerste dag van werkloosheid recht heeft op een uitkering op grond van een
      wet als genoemd in [artikel 19, eerste lid, onderdeel ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17a.1
    text: |-
      Voor de vaststelling van het in [artikel 17, onderdeel a][ref1], bedoelde aantal van 39 weken worden niet in
      aanmerking genomen weken gedurende welke de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17a.1.a
    text: wegens ziekte of arbeidsongeschiktheid geen arbeid kon verrichten;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
  - number: 17a.1.b
    text: |-
      werkzaamheden heeft verricht als bedoeld in [artikel 8][ref1] en hij op grond van dat artikel de hoedanigheid van
      werknemer heeft herkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 17a.1.d
    text: wegens het genieten van onbetaald verlof geen arbeid heeft verricht, tot een maximum van 78 weken; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
  - number: 17a.1.e
    text: |-
      geen arbeid heeft verricht maar wel recht op uitkering heeft op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 17a.2
    text: |-
      Voor de vaststelling van het in [artikel 17, onderdeel ][ref1], bedoelde aantal van 26 weken wordt de in een week
      verrichte arbeid slechts in aanmerking genomen, voor zover deze betrekking heeft op de dienstbetrekking waaruit de
      werknemer werkloos is geworden en op een of meer dienstbetrekkingen waarvoor eerstgenoemde dienstbetrekking in de
      plaats is gekomen, en voor zover deze niet reeds eerder heeft geleid tot het ontstaan van een recht op uitkering
      ingevolge dit hoofdstuk of [hoofdstuk II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IIB
  - number: 17a.3
    text: |-
      Bij algemene maatregel van bestuur kan voor bepaalde groepen werknemers het in [artikel 17, onderdeel ][ref1],
      bedoelde aantal van 26 weken lager worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17a.4
    text: |-
      Bij ministeriële regeling kunnen, zo nodig in afwijking van het tweede lid, regels worden gesteld omtrent de
      berekening van het in [artikel 17, onderdeel a][ref1], bedoelde aantal van 26 weken. Deze regels hebben betrekking
      op:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17a.4.a
    text: |-
      de gelijkstelling van weken waarin geen arbeid is verricht in de dienstbetrekking waaruit de werknemer werkloos is
      geworden met weken als bedoeld in [artikel 17, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17a.4.b
    text: het meer keren in aanmerking nemen van weken waarin arbeid is verricht.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17a
  - number: 17b.1
    text: |-
      Voor de toepassing van [artikel 17, onderdeel b, onder 1°][ref1], worden met dagen waarover loon is ontvangen,
      gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17b.1.a
    text: |-
      dagen waarover een persoon recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], berekend naar een arbeidsongeschiktheid van ten minste 80%,
      dan wel een uitkering ontvangt die naar aard en strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 17b.1.b
    text: |-
      dagen waarover een persoon een uitkering ontvangt op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1], berekend naar een
      arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al dan niet
      vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: 17b.2
    text: |-
      Voor de toepassing van [artikel 17, aanhef en onderdeel ][ref1], worden niet reeds in
      aanmerking genomen kalenderjaren waarin een persoon recht heeft op kinderbijslag op grond van
      [artikel 7 van de Algemene Kinderbijslagwet][ref2] of een andere gezinsbijslag als bedoeld in artikel 4, eerste
      lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van de Raad van de Europese Gemeenschap van 14
      juni 1971 betreffende de toepassing van socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun
      gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149) voor een tot zijn huishouden behorend kind dat
      bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, voor de helft gelijkgesteld met
      kalenderjaren waarin over 52 of meer dagen loon is ontvangen. De in de vorige zin bedoelde persoon wordt aangemerkt
      als verzorgend persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 17b.3
    text: |-
      Het tweede lid vindt geen toepassing indien de verzorgende persoon in een kalenderjaar voor een periode langer dan
      een half jaar als werknemer in de zin van een wettelijke regeling inzake werkloosheid recht heeft op een uitkering
      ter zake van werkloosheid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
  - number: 17b.4
    text: 'Voor de toepassing van het tweede en derde lid wordt onder:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
  - number: 17b.4.a
    text: een kind verstaan een eigen, aangehuwd of pleegkind;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
  - number: 17b.4.b
    text: een pleegkind verstaan een kind dat als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
  - number: 17b.5
    text: |-
      Voor de toepassing van [artikel 17, onderdeel b, onder 1°][ref1], worden dagen, tot een maximum van achttien
      maanden, waarover de werknemer onbetaald verlof heeft genoten, gelijkgesteld met dagen, waarover loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17b.6
    text: |-
      Voor de toepassing van dit artikel en van [artikel 17, onderdeel ][ref1], wordt


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17b.6.a
    text: |-
      de persoon, bedoeld in [artikel 7][ref1], geacht als werknemer in een dienstbetrekking in de zin van deze wet te
      staan;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: 17b.6.b
    text: |-
      niet als loon beschouwd een uitkering op grond van deze wet, met uitzondering van een
      uitkering op grond van [hoofdstuk IV van deze wet][ref1], alsmede een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], berekend naar een arbeidsongeschiktheid van minder dan 80%;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002524
  - number: 17b.6.c
    text: |-
      het aantal dagen, waarover loon wordt ontvangen vastgesteld overeenkomstig
      [artikel 9, vijfde en zesde lid, van de Coördinatiewet Sociale Verzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: 17b.7
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan voor het bepalen van het aantal
      van 52 dagen, bedoeld in [artikel 17, onderdeel ][ref1], dagen waarover, anders dan bedoeld in het vijfde lid, geen
      loon is ontvangen worden gelijkgesteld met dagen, waarover loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 17c.1
    text: |-
      Indien in de kalenderweek na het ontstaan van een recht op uitkering ter zake van gedeeltelijke werkloosheid uit
      een dienstbetrekking, een nieuw recht op uitkering ontstaat ter zake van toegenomen werkloosheid uit dezelfde
      dienstbetrekking, of een dienstbetrekking die voor eerstgenoemde dienstbetrekking in de plaats is gekomen, worden
      beide rechten samengevoegd tot een recht.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17c
  - number: 17c.2
    text: |-
      Het eerste lid vindt geen toepassing met betrekking tot een recht dat reeds door samenvoeging van rechten is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel17c
  - number: '18.1'
    text: |-
      De werknemer, die werkloos is uitsluitend als gevolg van vorst, sneeuwval, hoog water of andere buitengewone
      natuurlijke omstandigheden heeft recht op uitkering voor de duur van de buitengewone natuurlijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld op grond waarvan ten aanzien van een of meer bepaalde
      groepen werknemers voor de toepassing van het eerste lid, in afwijking van [artikel 16, eerste lid][ref1], ook als
      werkloos wordt beschouwd de werknemer die minder dan vijf arbeidsuren per kalenderweek heeft verloren, alsmede het
      recht op onverminderde doorbetaling van zijn loon over die uren.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '18.3'
    text: |-
      [Artikel 17][ref1] is niet van toepassing op de in het eerste lid bedoelde werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '18.4'
    text: |-
      Bij de vaststelling van de uitkeringsduur op grond van afdeling II en III blijven perioden waarin recht op
      uitkering op grond van het eerste lid bestaat buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel18
  - number: '19.1'
    text: 'Geen recht op uitkering heeft de werknemer die:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.a
    text: |-
      een uitkering ontvangt op grond van de [Ziektewet][ref1] of een uitkering die naar aard en strekking daarmee
      overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 19.1.b
    text: |-
      een uitkering ontvangt op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], berekend naar een
      arbeidsongeschiktheid van ten minste 80%, of een uitkering ontvangt die naar aard en strekking met die uitkering
      overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 19.1.c
    text: |-
      een uitkering ontvangt op grond van de [Liquidatiewet ongevallenwetten][ref1], berekend naar volledige
      arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0002553
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002553
  - number: 19.1.d
    text: |-
      een uitkering ontvangt op grond van [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1],
      berekend naar een arbeidsongeschiktheid van ten minste 80%, of een toelage op grond van dat hoofdstuk, die, al
      dan niet vermeerderd met de arbeidsongeschiktheidsuitkering, 70% of meer bedraagt van het dagloon waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: 19.1.e
    text: |-
      vakantiebonnen of daarmee overeenkomende aanspraken, bestemd voor bij of krachtens collectieve arbeidsovereenkomst
      aangewezen feestdagen en verplichte snipperdagen, heeft verkregen, over die dagen, tenzij deze vakantiebonnen
      of daarmee overeenkomende aanspraken zijn verstrekt als een deel van een uitkering op grond van dit hoofdstuk,
      dan wel naast een uitkering op grond van de [Ziektewet][ref1], indien de ziekengeldverzekering is ontleend aan
      [artikel 7 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 19.1.f
    text: buiten Nederland woont of verblijf houdt anders dan wegens vakantie;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.g
    text: |-
      niet rechtmatig in Nederland verblijf houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 19.1.h
    text: rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.i
    text: de eerste dag van de maand waarin hij 65 jaar wordt heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.j
    text: |-
      op grond van [artikel 17 van de Coördinatiewet Sociale Verzekering][ref1] een vrijstelling wegens gemoedsbezwaren
      heeft of wiens werkloosheid binnen 3 maanden na de datum van intrekking van een zodanige vrijstelling is
      aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '17'
  - number: 19.1.k
    text: vakantie geniet;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.l
    text: werkloos is ten gevolge van werkstaking of uitsluiting;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.1.m
    text: |-
      een uitkering ontvangt op grond van de [Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '19.2'
    text: |-
      Indien een uitkering als bedoeld in het eerste lid, onderdeel *a*, *b*, *c* of *d* niet wordt betaald wegens voor
      de werknemer geldende wachtdagen of wegens enig handelen of nalaten dat hem redelijkerwijs kan worden verweten,
      wordt het niet betalen daarvan voor de toepassing van het eerste lid gelijkgesteld met het ontvangen van die
      uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.3'
    text: 'Geen recht op uitkering heeft de werknemer over een dag waarop zijn arbeid wordt onderbroken uitsluitend doordat:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.3.a
    text: deze dag voor hem als rustdag geldt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.3.b
    text: |-
      deze dag een nationale of algemeen erkende christelijke feestdag is, dan wel een kerkelijke feestdag, die ter
      plaatse waar de werknemer pleegt te werken, algemeen als zodanig wordt gevierd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.4'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de werknemer die uitsluitend uit hoofde van een andere
      dienstbetrekking dan de dienstbetrekking waaruit hij werkloos is geworden in een omstandigheid verkeert als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.5'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.5.a
    text: met betrekking tot het begrip vakantie genieten, bedoeld in het eerste lid, onderdeel k;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.5.b
    text: |-
      met betrekking tot de vaststelling van de periode gedurende welke de werknemer, in afwijking van het eerste lid,
      onderdeel k, met behoud van zijn recht op uitkering vakantie kan genieten;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: 19.5.c
    text: |-
      met betrekking tot het buiten aanmerking laten van vakantiebonnen en daarmee overeenkomende aanspraken, bedoeld in
      het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.6'
    text: Het eerste lid, onderdeel l, blijft buiten toepassing in door Onze Minister aan te wijzen bijzondere gevallen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.7'
    text: |-
      Onze Minister is bevoegd voor gevallen waarin toepassing van het eerste lid, onderdeel *a* tot en met *h*, tot
      onbillijkheden zou kunnen leiden, regels te stellen op grond waarvan kan worden afgeweken van het bepaalde in die
      onderdelen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
  - number: '19.8'
    text: |-
      Het eerste lid, onderdeel h, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '20.1'
    text: 'Het recht op uitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.1.a
    text: voor zover de werknemer zijn hoedanigheid van werknemer verliest;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.1.b
    text: voor zover de werknemer niet langer werkloos is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.1.c
    text: |-
      indien ter zake van na het ontstaan van het recht verrichte arbeid een nieuw recht op uitkering is ontstaan, voor
      zover het aantal arbeidsuren waarnaar beide rechten samen zijn berekend, vermeerderd met het resterend aantal
      arbeidsuren per kalenderweek, groter is dan het aantal arbeidsuren, bedoeld in [artikel 16][ref1], voorafgaande aan
      het intreden van het verlies van arbeidsuren waarnaar het eerstgenoemde recht is berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 20.1.d
    text: |-
      zodra de werknemer geen recht op uitkering heeft op grond van [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 20.1.e
    text: zodra de voor de werknemer geldende uitkeringsduur is verstreken.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: '20.2'
    text: |-
      Voor de werknemer op wie het eerste lid, onderdeel *a*, van toepassing is eindigt het recht op uitkering terzake
      van het aantal uren dat hij werkzaamheden verricht uit hoofde waarvan hij niet als werknemer in de zin van deze wet
      wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: '20.3'
    text: 'Op grond van het eerste lid, onderdeel *b*, eindigt het recht op uitkering geheel indien de werknemer:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.3.a
    text: |-
      al dan niet opeenvolgend een zodanig aantal uren arbeid als werknemer verricht dat een verlies aan arbeidsuren
      resteert van minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in [artikel 16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 20.3.b
    text: |-
      beschikbaar is voor arbeid voor minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in
      [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '20.4'
    text: 'Op grond van het eerste lid, onderdeel *b*, eindigt het recht op uitkering gedeeltelijk indien de werknemer:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.4.a
    text: |-
      al dan niet opeenvolgend ten minste vijf of de helft van zijn arbeidsuren arbeid als werknemer verricht en nog
      een verlies aan arbeidsuren resteert van ten minste vijf of ten minste de helft van zijn arbeidsuren, bedoeld in
      [artikel 16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 20.4.b
    text: |-
      beschikbaar is voor arbeid voor minder arbeidsuren dan het aantal dat hij heeft verloren, doch voor ten minste vijf
      of ten minste de helft van zijn arbeidsuren, bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '20.5'
    text: 'Voor de werknemer op wie:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.5.a
    text: |-
      het vierde lid, onderdeel *a*, van toepassing is, eindigt het recht op uitkering ter zake van het aantal
      arbeidsuren dat hij arbeid als werknemer verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.5.b
    text: |-
      het vierde lid, onderdeel *b*, van toepassing is, eindigt het recht op uitkering ter zake van het aantal
      arbeidsuren dat hij minder beschikbaar is voor arbeid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: '20.6'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.6.a
    text: |-
      de berekening van het aantal arbeidsuren, bedoeld in het derde en vierde lid, ter zake waarvan het recht op
      uitkering eindigt. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.6.a.1°
    text: |-
      het buiten beschouwing laten van uren waarin arbeid wordt verricht en de gelijkstelling van uren waarin geen arbeid
      is verricht met uren waarin arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.6.a.2°
    text: de berekening van het aantal arbeidsuren met betrekking tot wisselende arbeidspatronen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: 20.6.b
    text: |-
      het geheel of gedeeltelijk eindigen van een recht op uitkering bij samenloop van uitkeringen op grond van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het recht op uitkering op grond van [artikel 20, eerste lid, onderdeel ][ref1], geheel of gedeeltelijk is
      geëindigd en vervolgens de omstandigheid die tot dat eindigen heeft geleid heeft opgehouden te bestaan, herleeft
      het recht op uitkering met inachtneming van het tweede lid, de in [artikel 8][ref2] en het derde lid genoemde
      termijnen en de op grond van het vierde lid gestelde regels, voor zover geen nieuw recht op uitkering ingevolge dit
      hoofdstuk bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '21.2'
    text: 'In afwijking van het eerste lid herleeft een recht dat geheel geëindigd is niet, indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: 21.2.a
    text: het recht op uitkering dat zou herleven een omvang zou hebben van minder dan één arbeidsuur per kalenderweek;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: 21.2.b
    text: |-
      een nieuw recht op uitkering ingevolge dit hoofdstuk is ontstaan uit een volledige dienstbetrekking en het verschil
      tussen het geëindigde recht en het nieuwe recht minder dan vijf arbeidsuren per kalenderweek bedraagt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: 21.2.c
    text: |-
      na de dag waarop het recht dat zou herleven geheel geëindigd is, een jaar is verstreken en het recht dat zou
      herleven een omvang zou hebben van minder dan vijf arbeidsuren per kalenderweek.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: '21.3'
    text: 'Een recht op uitkering dat geheel of gedeeltelijk is geëindigd:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: 21.3.a
    text: |-
      wegens een omstandigheid als bedoeld in [artikel 19, eerste lid, onderdeel ][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 21.3.b
    text: |-
      op grond van [artikel 20, eerste lid, onderdeel ][ref1], als gevolg van het niet kunnen voldoen aan de
      voorwaarde bedoeld in [artikel 16, eerste lid, onderdeel ][ref2], wegens andere omstandigheden dan ziekte of
      arbeidsongeschiktheid of het volgen van scholing of opleiding, terzake waarvan de werknemer een uitkering ontvangt
      als bedoeld in [artikel 19, eerste lid, onderdelen a, b, c, d of m][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 21.3.c
    text: |-
      wegens een combinatie van de hier bedoelde omstandigheden, kan, ook indien deze omstandigheden zich aaneensluitend
      voordoen, slechts herleven indien de periode tussen de eindiging van het recht en het vervallen van de
      omstandigheid of omstandigheden als hier bedoeld niet langer is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij ministeriële regeling kan worden geregeld dat het derde lid buiten toepassing blijft voor categorieën van
      werknemers.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel21
  - number: '22.1'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt op aanvraag vast of recht op uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
  - number: '22.2'
    text: |-
      Een aanvraag is gericht tot het Uitvoeringsinstituut werknemersverzekeringen en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend bij
      de Centrale organisatie werk en inkomen. Na de overdracht van de aanvraag door de Centrale
      organisatie werk en inkomen aan het Uitvoeringsinstituut werknemersverzekeringen ingevolge
      [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag verder
      behandeld door het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
  - number: '22.3'
    text: |-
      Op de toekenning en de beëindiging van een uitkering als bedoeld in [artikel 18][ref1]
      of van een uitkering die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] zijn de [artikelen 3:40][ref3]
      en [3:45 van de Algemene wet bestuursrecht][ref4] niet van toepassing, indien redelijkerwijs mag worden aangenomen
      dat aan de bekendmaking van de beschikking geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '22.4'
    text: |-
      Verzoekt de belanghebbende binnen een redelijke termijn echter om bekendmaking van de in het derde lid bedoelde
      beschikking, dan wordt deze zo spoedig mogelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
  - number: '22.5'
    text: |-
      Indien het een aanvraag betreft tot toekenning van een uitkering op grond van [artikel 18][ref1] of
      [artikel 61][ref2] dan wel van uitkering die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3], wordt, in afwijking van het
      tweede lid, de aanvraag ingediend bij het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '22.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat categorieën van aanvragen om uitkering,
      in afwijking van het tweede lid en [artikel 26, eerste lid, onderdeel b][ref1], bij het Uitvoeringsinstituut
      werknemersverzekeringen in plaats van de Centrale organisatie werk en inkomen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 22a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet het Uitvoeringsinstituut werknemersverzekeringen een
      dergelijk besluit of trekt het dat in:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22a
  - number: 22a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 24][ref1], [25][ref2] of
      [26][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 22a.1.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22a
  - number: 22a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 25][ref1] ertoe leidt dat niet
      kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 22a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van herziening of intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22a
  - number: 22b.1
    text: |-
      De intrekking of verlaging van een uitkering, die voortvloeit uit het door de werkgever ingesteld bezwaar of
      beroep, vindt niet eerder plaats dan de dag volgend op die waarop de beslissing op bezwaar is bekendgemaakt of de
      uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking van het bezwaar of
      beroep omdat het Uitvoeringsinstituut werknemersverzekeringen geheel of gedeeltelijk is tegemoet gekomen aan het
      bezwaar of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22b
  - number: 22b.2
    text: |-
      Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de werknemer ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel22b
  - number: '23'
    text: |-
      Het recht op uitkering kan niet worden vastgesteld over perioden gelegen voor 26 weken voorafgaand aan de dag
      waarop de aanvraag om een uitkering werd ingediend. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in
      bijzondere gevallen af te wijken van de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel23
  - number: '24.1'
    text: 'De werknemer voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.a
    text: verwijtbaar werkloos wordt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.b
    text: 'werkloos is of blijft, doordat hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.b.1°
    text: in onvoldoende mate tracht passende arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.b.2°
    text: nalaat aangeboden passende arbeid te aanvaarden of door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.b.3°
    text: door eigen toedoen geen passende arbeid behoudt; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.1.b.4°
    text: |-
      in verband met door hem te verrichten arbeid eisen stelt die het aanvaarden of verkrijgen van passende arbeid
      belemmeren.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: '24.2'
    text: 'De werknemer is verwijtbaar werkloos geworden indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.2.a
    text: |-
      hij zich verwijtbaar zodanig heeft gedragen dat hij redelijkerwijs heeft moeten begrijpen, dat dit gedrag de
      beëindiging van zijn dienstbetrekking tot gevolg zou kunnen hebben;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: 24.2.b
    text: |-
      de dienstbetrekking eindigt of is beëindigd zonder dat aan de voortzetting ervan zodanige bezwaren zijn verbonden,
      dat deze voortzetting redelijkerwijs niet van hem zou kunnen worden gevergd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: '24.3'
    text: |-
      De werknemer is niet verwijtbaar werkloos geworden, indien voor de opzegging van de dienstbetrekking toestemming
      is verleend krachtens [artikel 6 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] en die toestemming
      uitsluitend is gemotiveerd door bedrijfseconomische omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '6'
  - number: '24.4'
    text: |-
      Als passende arbeid, bedoeld in het eerste lid, wordt beschouwd alle arbeid die voor de krachten en bekwaamheden
      van de werknemer is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van
      hem kan worden gevergd. Niet als passende arbeid wordt beschouwd arbeid op grond van een arbeidsovereenkomst als
      bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '24.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent het begrip passende arbeid, bedoeld in het
      eerste en vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: '24.6'
    text: |-
      De werknemer is verplicht zich zodanig te gedragen dat hij door zijn doen en laten het Algemeen Werkloosheidsfonds,
      het wachtgeldfonds of het Uitvoeringsfonds voor de overheid niet benadeelt of zou kunnen benadelen. Onder
      benadeling in de zin van dit artikel is niet begrepen een gedraging als bedoeld in [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '24.7'
    text: |-
      Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdeel *b*, onder 1°, 2° en 4°, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel24
  - number: '25'
    text: |-
      De werknemer is verplicht aan het Uitvoeringsinstituut werknemersverzekeringen op zijn verzoek of onverwijld uit
      eigen beweging alle feiten en omstandigheden mede te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat
      zij van invloed kunnen zijn op het recht op uitkering, het geldend maken van het recht op uitkering, de hoogte of
      de duur van de uitkering, of op het bedrag van de uitkering dat aan de werknemer wordt betaald. Deze verplichting
      geldt niet, voor zover een recht op uitkering niet geldend kan worden gemaakt als gevolg van een blijvend gehele
      weigering.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel25
  - number: '26.1'
    text: 'De werknemer is verplicht:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: 26.1.a
    text: |-
      uiterlijk de eerste werkdag volgend op de eerste dag van werkloosheid bij de Centrale organisatie werk en inkomen
      aangifte te doen van zijn werkloosheid;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: 26.1.b
    text: |-
      binnen één week na het intreden van zijn werkloosheid bij de Centrale organisatie werk en inkomen een aanvraag om
      een uitkering in te dienen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: 26.1.c
    text: |-
      de voorschriften op te volgen die het Uitvoeringsinstituut werknemersverzekeringen ten behoeve van een doelmatige
      controle stelt;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: 26.1.d
    text: |-
      zich als werkzoekende bij de Centrale organisatie werk en inkomen te laten registreren en
      die registratie tijdig te doen verlengen, indien hem daartoe het recht toekomt op grond van
      [artikel 25, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '25'
  - number: 26.1.e
    text: |-
      mee te werken aan de activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid, bedoeld in de
      [hoofdstukken VI][ref1] en [XA][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukXA
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: XA
  - number: 26.1.f
    text: |-
      mee te werken aan een scholing of opleiding die noodzakelijk wordt geacht voor zijn
      inschakeling in de arbeid, beschikbaar te zijn voor de voorzieningen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] en mee te werken aan het verkrijgen van
      die voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 26.1.g
    text: |-
      mee te werken aan een voor hem gewenst onderzoek naar zijn arbeidsgeschiktheid door een arts, een psycholoog of een
      beroepskeuze-adviseur;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: 26.1.h
    text: |-
      te voldoen aan de andere voorwaarden die het Uitvoeringsinstituut werknemersverzekeringen op grond van
      [artikel 101, tweede lid][ref1], stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel101
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '101'
        hoofdstuk: VIII
  - number: 26.1.i
    text: |-
      de hem op grond van [hoofdstuk VI][ref1] opgelegde verplichtingen na te komen; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
  - number: 26.1.j
    text: |-
      de voorschriften op te volgen die het Uitvoeringsinstituut werknemersverzekeringen stelt in verband met het
      genieten van vakantie tijdens de duur van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd regels te stellen met betrekking tot het tijdstip van
      registratie, bedoeld in het eerste lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdelen d, f of g, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: '26.4'
    text: |-
      Indien het een aangifte van werkloosheid betreft als bedoeld in [artikel 18][ref1] of [artikel 61][ref2]
      dan wel aangifte van werkloosheid die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3], wordt, in afwijking van het
      eerste lid, onderdeel a, de aangifte gedaan bij het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '26.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat categorieën van aangiften van werkloosheid,
      in afwijking van het eerste lid, onderdeel a, bij het Uitvoeringsinstituut werknemersverzekeringen in plaats van de
      Centrale organisatie werk en inkomen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel26
  - number: '27.1'
    text: |-
      Indien de werknemer een verplichting, hem op grond van
      [artikel 24, eerste lid, onderdeel a, of onderdeel b, onder 3°][ref1] opgelegd, niet is nagekomen, weigert
      het Uitvoeringsinstituut werknemersverzekeringen de uitkering blijvend geheel, tenzij het niet nakomen
      van de verplichting de werknemer niet in overwegende mate kan worden verweten. In dat geval weigert het
      Uitvoeringsinstituut werknemersverzekeringen de uitkering over een periode van 26 weken gedeeltelijk door het
      uitkeringspercentage te verlagen van 70 naar 35.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '27.2'
    text: |-
      Indien de werknemer een verplichting, hem op grond van [artikel 24, eerste lid, onderdeel b, onder 2°][ref1],
      opgelegd, niet is nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen de uitkering blijvend over
      het aantal uren waarover het recht op uitkering zou zijn geëindigd of niet zou zijn ontstaan indien de werknemer de
      betreffende arbeid zou hebben aanvaard of verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '27.3'
    text: |-
      Indien de werknemer een verplichting, hem op grond van de
      [artikelen 24, eerste lid, onderdeel b, onder 1° of 4°, of zesde lid][ref1], of [26][ref2]
      of [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3]
      opgelegd, niet of niet behoorlijk is nagekomen, dan wel de verplichting,
      bedoeld in [artikel 25][ref4] of de [artikelen 28, tweede lid][ref5], en
      [29, eerste lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6], niet binnen de door het
      Uitvoeringsinstituut werknemersverzekeringen, onderscheidenlijk de Centrale organisatie werk en inkomen daarvoor
      vastgestelde termijn is nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen, de uitkering tijdelijk
      of blijvend, geheel of gedeeltelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '27.4'
    text: |-
      Een maatregel als bedoeld in het derde lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      werknemer de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien
      elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
  - number: '27.5'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 25][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van uitkering, of indien de werknemer zich niet houdt aan de
      voorschriften, bedoeld in [artikel 26, eerste lid, onderdelen a, b of d][ref4], kan het Uitvoeringsinstituut
      werknemersverzekeringen afzien van het opleggen van een maatregel als bedoeld in het derde lid en volstaan met
      het geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, of het
      zich niet houden aan de voorschriften, tenzij het niet tijdig nakomen van de verplichting, of het zich niet houden
      aan de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de
      werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '27.6'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een maatregel af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
  - number: '27.7'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 27a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '27.8'
    text: Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27
  - number: 27a.1
    text: |-
      Indien de werknemer een verplichting als bedoeld in
      [artikel 25 van deze wet][ref1] of [artikel 28, tweede lid][ref2],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet of niet behoorlijk is
      nagekomen, legt het Uitvoeringsinstituut werknemersverzekeringen hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 27a.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de werknemer de gedraging
      verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
  - number: 27a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van een verplichting als bedoeld
      in [artikel 25 van deze wet][ref1] of [artikel 28, tweede lid][ref2], of
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van uitkering, kan het Uitvoeringsinstituut werknemersverzekeringen
      afzien van het opleggen van een boete als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke
      waarschuwing ter zake van het niet of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 27a.4
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van
      het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
  - number: 27a.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
  - number: 27a.6
    text: Voor zover de boete nog niet is geïnd vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
  - number: 27a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27a
  - number: 27b.1
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen jegens de werknemer een handeling verricht waaraan deze
      in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden
      opgelegd, is de werknemer niet langer verplicht terzake van die gedraging enige verklaring af te leggen, voor zover
      het betreft de boeteoplegging. De werknemer wordt hiervan in kennis gesteld alvorens hem mondeling om informatie
      wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27b
  - number: 27b.2
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen voornemens is om aan de werknemer een boete op te leggen,
      wordt hiervan kennis gegeven aan de werknemer onder vermelding van de gronden waarop het voornemen berust. De
      kennisgeving is een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27b
  - number: 27b.3
    text: |-
      Op verzoek van de werknemer die de in het vorige lid bedoelde kennisgeving wegens zijn gebrekkige kennis van
      de Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut werknemersverzekeringen er zoveel
      mogelijk zorg voor dat de in die kennisgeving vermelde gronden aan de werknemer worden medegedeeld in een voor hem
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27b
  - number: 27b.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het Uitvoeringsinstituut
      werknemersverzekeringen de werknemer in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar
      voren te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 27b.5
    text: |-
      Indien de werknemer zijn zienswijze mondeling naar voren brengt, draagt het Uitvoeringsinstituut
      werknemersverzekeringen er op verzoek van de werknemer die de Nederlandse taal onvoldoende begrijpt, zorg voor dat
      een tolk wordt benoemd die de werknemer kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen
      behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27b
  - number: 27c.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 27][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27g
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27g
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 27c.2
    text: |-
      Op verzoek van de werknemer die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, draagt het Uitvoeringsinstituut werknemersverzekeringen er zoveel mogelijk
      zorg voor dat de in dat besluit vermelde informatie aan de werknemer wordt meegedeeld in een voor hem begrijpelijke
      taal.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27c
  - number: 27c.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27c
  - number: 27d.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27d
  - number: 27d.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de werknemer een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot
      strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 27d.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27d
  - number: 27e.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het Uitvoeringsinstituut werknemersverzekeringen de werknemer
      overeenkomstig het bepaalde in [artikel 27][ref1], in de gelegenheid heeft gesteld zijn zienswijze naar voren te
      brengen. Indien terzake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een
      jaar aan op de dag na die waarop het openbaar ministerie aan het Uitvoeringsinstituut werknemersverzekeringen heeft
      medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27b
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 27e.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27e
  - number: 27f
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de werknemer wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27g.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 27g.2
    text: |-
      Indien degene aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de [Ziektewet][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5]of de [Wet arbeid en zorg][ref6] of een toeslag op grond
      van de [Toeslagenwet][ref7], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0004043
  - number: 27g.3
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      [de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet werk en inkomen kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0017837
  - number: 27g.4
    text: |-
      Indien degene aan wie een boete is opgelegd geen uitkering als bedoeld in het tweede of derde lid ontvangt, of
      meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het tweede of derde lid niet mogelijk
      is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 27g.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
  - number: 27g.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
  - number: 27g.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door het Uitvoeringsinstituut werknemersverzekeringen op loon,
      sociale uitkeringen of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene aan wie
      een boete is opgelegd, zijn de [artikelen 479][ref1], behoudens [artikel 479][ref2] van overeenkomstige toepassing.
      De in [artikel 479][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 27g.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat
      de werknemer blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 27g.9
    text: |-
      Het achtste lid geldt niet, zolang de werknemer zijn verplichting bedoeld in [artikel 27a, vijfde lid][ref1], niet
      of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27a
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '28.1'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen een maatregel als bedoeld in [artikel 27][ref1] heeft
      opgelegd, zet het Uitvoeringsinstituut werknemersverzekeringen in geval van herleving van het recht op uitkering
      als bedoeld in [artikel 21][ref2] of [52][ref3], een weigering van de uitkering voort.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel52d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 52d
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: '28.2'
    text: |-
      In afwijking van het eerste lid zet het Uitvoeringsinstituut werknemersverzekeringen een weigering van de uitkering
      over de uren waarover het recht op uitkering ingevolge [artikel 21][ref1] herleeft niet voort, indien ter zake van
      arbeid verricht sinds de eerste dag waarop het recht op uitkering is ontstaan, is voldaan aan [artikel 52][ref2],
      en op grond van het derde lid van [dat artikel][ref3] geen recht op uitkering ingevolge hoofdstuk II is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel52b
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel52b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 52b
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 52b
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: '29.1'
    text: |-
      Bij een besluit tot herziening van de uitkering wordt mededeling gedaan van de herziening en, in een bijlage, van
      de op die herziening betrekking hebbende gewijzigde rechten en plichten van de werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien het Uitvoeringsinstituut werknemersverzekeringen ter uitvoering van de taak, bedoeld in [artikel 72][ref1],
      ten behoeve van de werknemer, die recht heeft op uitkering op grond van hoofdstuk IIa of IIb, een plan heeft
      opgesteld of heeft laten opstellen, gericht op het vergroten van de mogelijkheden tot inschakeling in het
      arbeidsproces, ondertekent de werknemer dit plan voor gezien en verstrekt het aan het Uitvoeringsinstituut
      werknemersverzekeringen. De bijlage wordt tevens getekend door het Uitvoeringsinstituut werknemersverzekeringen.
      Een afschrift wordt verstrekt aan de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: '29.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent dit artikel.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel29
  - number: '30.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de uitkering zo spoedig mogelijk, doch uiterlijk binnen
      een maand nadat het het recht op die uitkering heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel30
  - number: '30.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen schort de betaling van de uitkering op of schorst de betaling,
      indien het op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel30
  - number: 30.2.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel30
  - number: 30.2.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel30
  - number: 30.2.c
    text: |-
      de werknemer een verplichting, hem op grond van de artikelen 24,
      25 of 26 van deze wet of de [artikelen 28, tweede lid][ref1],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '31.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt uit eigen beweging een naar redelijkheid vast
      te stellen voorschot op een uitkering, indien uitsluitend onzekerheid bestaat omtrent de hoogte van die
      uitkering, omtrent het van de uitkering aan de werknemer te betalen bedrag of omtrent het nakomen van een
      verplichting als bedoeld in de artikelen 24, 25 en 26 van deze wet of de [artikelen 28, tweede lid][ref1],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '31.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd op verzoek van de werknemer een naar redelijkheid vast
      te stellen voorschot op een uitkering te betalen, indien onzekerheid bestaat omtrent het recht op uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: '31.3'
    text: |-
      In afwijking van het tweede lid betaalt het Uitvoeringsinstituut werknemersverzekeringen uit eigen beweging of op
      verzoek van de werknemer een naar redelijkheid vast te stellen voorschot op hetgeen hem krachtens een aanspraak
      naar burgerlijk recht of krachtens deze wet kan toekomen, indien:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: 31.3.a
    text: |-
      onzekerheid bestaat omtrent het recht op onverminderde doorbetaling van loon, ingeval niet vaststaat dat de
      dienstbetrekking rechtsgeldig is geëindigd; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: 31.3.b
    text: het recht, bedoeld in onderdeel *a*, vaststaat, doch de werkgever het loon niet voldoet.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: '31.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd aan een voorschot, bedoeld in het derde lid,
      voorschriften te verbinden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: '31.5'
    text: |-
      In afwijking van het derde lid betaalt het Uitvoeringsinstituut werknemersverzekeringen geen voorschot over
      tijdvakken waarin het loon niet wordt doorbetaald in verband met een geschil tussen de werknemer en zijn werkgever
      over het bestaan van ziekte van de werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: '31.6'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot als bedoeld in het eerste tot en
      met het derde lid beschouwd als een uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel31
  - number: '32'
    text: |-
      De uitkering die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in
      bijzondere gevallen ten gunste van de werknemer af te wijken van de in de eerste volzin genoemde drie maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt de uitkering in de regel per vier kalenderweken of per
      maand achteraf.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel33
  - number: '33.2'
    text: |-
      In afwijking van het eerste lid is het Uitvoeringsinstituut werknemersverzekeringen bevoegd, op verzoek van de
      werknemer of uit eigen beweging, de uitkering over een kortere periode te betalen, indien de werknemer over die
      kortere periode loon ontving.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel33
  - number: '33.3'
    text: |-
      In afwijking van het eerste lid betaalt het Uitvoeringsinstituut werknemersverzekeringen aan de werknemer die
      werkloos is ten gevolge van de eindiging van zijn dienstbetrekking en in wiens dagloon vakantiebijslag is berekend,
      een gedeelte van de uitkering als vakantiebijslag jaarlijks in de maand mei over de aan die maand voorafgaande 12
      maanden, of, indien het recht op uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende maand.
      De vakantiebijslag bedraagt 8/108 van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel33
  - number: '33.4'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van de teller en het getal boven het honderd in plaats van de noemer van de in
      het derde lid genoemde breuk. Het gewijzigde percentage wordt in aanmerking genomen over de uitkering waarop recht
      bestaat vanaf de dag waarop de wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '33.5'
    text: |-
      Op de toekenning van vakantiebijslag zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '34.1'
    text: 'Op de uitkering worden geheel in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.1.a
    text: inkomsten wegens loonderving;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.1.b
    text: inkomsten wegens ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.1.c
    text: |-
      inkomsten wegens uitkering op grond van het bepaalde bij of krachtens dan wel op de voet van de
      [Algemene pensioenwet politieke ambtsdragers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '34.2'
    text: |-
      De inkomsten, bedoeld in het eerste lid, dienen betrekking te hebben op de periode waarover de werknemer recht
      heeft op uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: '34.3'
    text: |-
      Indien de werknemer wegens eindiging van een dienstbetrekking ouderdomspensioen ontvangt, wordt, voor zoveel nodig
      in afwijking van het eerste lid, de uitkering per dag niet hoger gesteld dan op het verschil tussen de uitkering
      zoals die is of zou zijn vastgesteld op de eerste werkdag na die eindiging en het bedrag van het pensioen per dag
      dat op die dag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: '34.4'
    text: |-
      Voor de toepassing van het derde lid wordt het dagloon zoals dat is of zou zijn vastgesteld op de eerste dag waarop
      ouderdomspensioen wordt ontvangen, voor zoveel nodig herzien overeenkomstig [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '46'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: II
  - number: '34.5'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *a* van dat lid bedoelde inkomsten niet op de uitkering in
      mindering gebracht, indien zij:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.5.a
    text: verband houden met de eindiging van een dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.5.b
    text: ter zake van werkloosheid ten gevolge van een niet geëindigde dienstbetrekking worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.5.c
    text: |-
      bestaan uit een uitkering als bedoeld in [artikel 45, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: II
  - number: 34.5.d
    text: uit hoofde van een tijdens het recht op uitkering vervulde dienstbetrekking worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: '34.6'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *a* en *c* van dat lid bedoelde inkomsten niet op de
      uitkering in mindering gebracht, indien zij:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.6.a
    text: |-
      door de werknemer reeds voor het intreden van de werkloosheid werden ontvangen naast de inkomsten uit de
      dienstbetrekking waaruit hij werkloos is geworden;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34.6.b
    text: |-
      door de werknemer na het intreden van de werkloosheid worden ontvangen en zij betrekking hebben op een andere
      dienstbetrekking dan de dienstbetrekking, waaruit de werkloosheid is ontstaan en die dienstbetrekkingen voor het
      intreden van de werkloosheid naast elkaar werden vervuld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: '34.7'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *b* van dat lid bedoelde inkomsten niet op de uitkering
      in mindering gebracht, indien zij door de werknemer na het intreden van de werkloosheid worden ontvangen en zij
      betrekking hebben op een andere dienstbetrekking dan de dienstbetrekking, waaruit de werkloosheid is ontstaan en
      die dienstbetrekkingen voor het intreden van de werkloosheid naast elkaar werden vervuld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: '34.8'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *b* wordt onder ouderdomspensioen verstaan een uit een vervulde
      dienstbetrekking voortvloeiende, in beginsel levenslange periodieke uitkering bij wijze van oudedagsvoorziening.
      Onze Minister is bevoegd uitkeringen gelijk te stellen met ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34
  - number: 34a.1
    text: |-
      De uitkering wordt niet betaald over dagen, waarop de werknemer vakantie geniet en over bij of krachtens
      collectieve arbeidsovereenkomst aangewezen feest- en verplichte snipperdagen, en de werknemer vakantiebonnen
      of daarmee overeenkomende aanspraken, bestemd voor die vakantie-, feest- of snipperdagen heeft verkregen,
      mits deze vakantiebonnen of daarmee overeenkomende aanspraken zijn verstrekt als een deel van een uitkering
      op grond van dit hoofdstuk, dan wel naast een uitkering op grond van de [Ziektewet][ref1], indien de
      ziekengeldverzekering is ontleend aan [artikel 7 van die wet][ref2], of naast een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3], indien de werknemer gelijkgestelde was
      als bedoeld in [artikel 3:6, eerste lid, onderdeel b, van die wet][ref4] op grond van een ziekengeldverzekering die
      is ontleend aan [artikel 7 van de Ziektewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 34a.2
    text: |-
      [Artikel 19, vijfde lid][ref1], is van overeenkomstige toepassing met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '35'
    text: |-
      Indien de werkloze werknemer arbeid als werknemer gaat verrichten gedurende minder dan vijf en minder dan de helft
      van de arbeidsuren, bedoeld in [artikel 16][ref1], wordt de uitkering verminderd met 70% van hetgeen hij met die
      arbeid verdient.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 35a
    text: |-
      Indien de werknemer deelneemt aan een voor hem naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen noodzakelijke opleiding of scholing en het recht op uitkering op grond van
      [artikel 76][ref1] blijft bestaan, worden op de uitkering geheel in mindering gebracht de inkomsten uit of in
      verband met de opleiding of scholing voor zover zij meer bedragen dan een nader door Onze Minister vast te stellen
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
  - number: 35b.1
    text: |-
      Indien de werknemer meer dan één recht op uitkering heeft, wordt, indien tenminste één van die rechten ontstaan
      is uit hoofde van een dienstbetrekking als overheidswerknemer, voor de toepassing van de [artikelen 34][ref1],
      [35][ref2] en [35a][ref3] een volgorde in aanmerking genomen bij de vermindering van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '34'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '35'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 35a
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: 35b.2
    text: |-
      Bij de toepassing van het eerste lid worden de inkomsten bij voorrang in mindering gebracht op de uitkering waarmee
      zij de meeste samenhang hebben.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35b.3
    text: 'Een samenhang als bedoeld in het tweede lid wordt vastgesteld aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35b.3.a
    text: |-
      de dienstbetrekkingen uit hoofde waarvan de werknemer recht op uitkering op grond van deze wet heeft en die waaruit
      of in verband waarmee de inkomsten worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35b.3.b
    text: |-
      de bedrijfstak of bedrijfstakken waarin de werknemer werkzaam was en die waaruit of in verband waarmee de inkomsten
      worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35b.4
    text: |-
      Indien geen samenhang kan worden vastgesteld, worden de inkomsten gelijkelijk in mindering gebracht op de
      verschillende uitkeringen. Indien bij de toepassing van de eerste zin een uitkering lager is dan het daarop in
      mindering te brengen bedrag, wordt hetgeen aldus niet in mindering kan worden gebracht in gelijke mate in mindering
      gebracht op de andere uitkeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35b.5
    text: Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35b
  - number: 35c
    text: |-
      Indien tegelijkertijd recht bestaat op meer kortdurende uitkeringen en de som van de bedragen die aan deze
      uitkeringen zou moeten worden betaald groter is dan 70% van het minimumloon, wordt van elk van deze uitkeringen 70%
      van het minimumloon betaald, vermenigvuldigd met het aantal arbeidsuren terzake waarvan het betrokken recht bestaat
      gedeeld door het aantal arbeidsuren terzake waarvan recht op kortdurende uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel35c
  - number: '36.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 22][ref1] of [27][ref2] onverschuldigd
      is betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het Uitvoeringsinstituut
      werknemersverzekeringen van de betrokken werknemer teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 22a
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen besluiten van terugvordering
      of van verdere terugvordering af te zien, indien de betrokken werknemer:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: '36.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 36.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: '36.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het Uitvoeringsinstituut werknemersverzekeringen besluiten
      geheel of gedeeltelijk van terugvordering af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: '36.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 36a
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: '36.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het Uitvoeringsinstituut werknemersverzekeringen
      de inlichtingen te verstrekken die voor de terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: '36.7'
    text: |-
      In afwijking van het eerste lid kan het Uitvoeringsinstituut werknemersverzekeringen, onder voorwaarden die Onze
      Minister kan stellen, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een door Onze
      Minister vast te stellen bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36
  - number: 36a.1
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 36a.2
    text: |-
      [Artikel 27g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de artikelen [475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het Uitvoeringsinstituut
      werknemersverzekeringen de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27g
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 36b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de [artikelen 36][ref1] en [36a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel36a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 36a
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: '38.1'
    text: |-
      Voor het in ontvangst nemen en het verlenen van kwijting voor de betaling van de uitkering, wordt een minderjarige
      met een meerderjarige gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel38
  - number: '38.2'
    text: |-
      Indien de wettelijke vertegenwoordiger van de minderjarige zich schriftelijk bij het Uitvoeringsinstituut
      werknemersverzekeringen verzet tegen betaling aan de minderjarige wordt de uitkering aan de wettelijke
      vertegenwoordiger betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel38
  - number: '39.1'
    text: |-
      Indien degene, aan wie een uitkering is toegekend, ingevolge het bepaalde bij of krachtens
      [artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] een bijdrage verschuldigd is
      in de kosten van een verstrekking als bedoeld in de [artikelen 6][ref2] en [11 van die wet][ref3] of een
      vergoeding als bedoeld in de [artikelen 11][ref4] en [12 van die wet][ref5], is het Uitvoeringsinstituut
      werknemersverzekeringen bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan degene, aan wie de
      uitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '39.2'
    text: |-
      Indien degene, aan wie een uitkering is toegekend, in een inrichting ter verpleging van geesteszieken of van
      zwakzinnigen is opgenomen en het Uitvoeringsinstituut werknemersverzekeringen, van de desbetreffende inrichting
      of van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de uitkering aan die inrichting of die
      gemeente uit te betalen, is het Uitvoeringsinstituut werknemersverzekeringen bevoegd dat verzoek zonder het stellen
      van andere voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel39
  - number: '39.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking
      op het gedeelte van de uitkering, dat niet aan het College voor zorgverzekeringen, genoemd in
      [artikel 1a van de Ziekenfondswet][ref1], wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel1a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 1a
  - number: '39.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '40.1'
    text: De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel40
  - number: '40.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel40
  - number: '40.3'
    text: Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel40
  - number: '41'
    text: |-
      De uitkering wordt niet betaald indien deze per week doorgaans minder bedraagt dan een achtste deel van het
      minimumloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel41
  - number: '42.1'
    text: |-
      Te rekenen vanaf de eerste dag waarop het recht op uitkering is ontstaan, is de duur van de loongerelateerde
      uitkering bij een arbeidsverleden van ten minste: 4 jaren, zes maanden; 5 jaren, negen maanden; 10 jaren, een jaar;
      15 jaren, anderhalf jaar; 20 jaren, twee jaar; 25 jaren, tweeënhalf jaar; 30 jaren, drie jaar; 35 jaren, vier jaar;
      en 40 jaren, vijf jaar.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
  - number: '42.2'
    text: |-
      De duur van de loongerelateerde uitkering voor de werknemer die voldoet aan [artikel 17, onderdeel ][ref1], is bij
      een arbeidsverleden van minder dan 4 jaar zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '42.3'
    text: 'Het arbeidsverleden wordt berekend door samentelling van:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
  - number: 42.3.a
    text: |-
      het aantal kalenderjaren, vanaf en met inbegrip van 1998 tot en met het kalenderjaar onmiddellijk voorafgaand aan
      het kalenderjaar waarin zijn eerste werkloosheidsdag is gelegen, waarover de werknemer over 52 of meer dagen loon
      heeft ontvangen; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
  - number: 42.3.b
    text: |-
      het aantal kalenderjaren vanaf en met inbegrip van het jaar waarin de werknemer zijn 18e verjaardag bereikte tot
      1998.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
  - number: '42.4'
    text: |-
      Een kalenderjaar wordt in aanmerking genomen bij de berekening, bedoeld in het derde lid, onderdeel a, indien
      volgens de beschikking, bedoeld in [artikel 33a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      de werknemer in dat jaar over 52 of meer dagen loon heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33a
  - number: '42.5'
    text: |-
      Bij de toepassing van het derde lid, onderdeel a, wordt, indien over een kalenderjaar een beschikking als bedoeld
      in het vierde lid niet is afgegeven, dat kalenderjaar in aanmerking genomen indien de werknemer aantoont daarin
      over 52 of meer dagen loon te hebben ontvangen. [Artikel 17][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 17b
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '43.1'
    text: |-
      Telkens nadat het recht op uitkering na gehele eindiging van dat recht is herleefd op grond van [artikel 21][ref1],
      eindigt de loongerelateerde uitkering met inachtneming van het tweede en derde lid, zoveel later dan de in
      [artikel 42, eerste en tweede lid][ref2], genoemde periode als de periode tussen de eindiging en herleving van het
      recht op uitkering heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: II
  - number: '43.2'
    text: |-
      Voor de vaststelling van de periode tussen de eindiging en de herleving van het recht op uitkering worden, telkens
      nadat het recht op uitkering geheel is geëindigd wegens ziekte, de eerste drie maanden waarin de werknemer een
      uitkering ontvangt als bedoeld in [artikel 19, eerste lid, onderdeel ][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '43.3'
    text: |-
      Voor de bepaling van de periode van drie maanden bedoeld in het tweede lid, worden perioden waarover de in
      [artikel 19, eerste lid, onderdeel ][ref1], bedoelde uitkeringen worden ontvangen samengeteld, indien zij elkaar
      met een onderbreking van minder dan vier weken opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '43.4'
    text: |-
      [ Artikel 19, tweede lid][ref1], is van toepassing op het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '44'
    text: De uitkering op grond van deze afdeling wordt berekend naar het dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel44
  - number: '45.1'
    text: |-
      Voor de berekening van de uitkering waarop op grond van deze afdeling recht bestaat, wordt als dagloon beschouwd
      het loon dat de werknemer in de regel in de periode van 26 weken onmiddellijk voorafgaande aan het intreden van het
      arbeidsurenverlies als bedoeld in [artikel 16, eerste lid][ref1] gemiddeld per dag in de dienstbetrekking waaruit
      hij werkloos is geworden verdiende, voorzover dat loon in de sector algemeen gebruikelijk, vast, gegarandeerd en
      regelmatig verstrekt is, of inherent is aan de functie. Voor de vaststelling van de periode van 26 weken, bedoeld
      in de eerste zin, worden weken, tot een maximum van 78 weken, waarin de werknemer onbetaald verlof heeft genoten,
      niet in aanmerking genomen, tenzij dit leidt tot een lager verdiend loon dan wanneer die weken wel in aanmerking
      zouden worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '45.2'
    text: Onze Minister stelt met betrekking tot de vaststelling van het dagloon nadere regels.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel45
  - number: '45.4'
    text: |-
      De in het tweede lid bedoelde regels bevatten voor zover nodig bepalingen op grond waarvan voor
      een werknemer die naast een uitkering op grond van deze afdeling een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] ontvangt, dan wel een uitkering
      ontvangt die naar aard en strekking daarmee overeenkomt op grond van een regeling voor de persoon, bedoeld in
      [artikel 7, eerste lid][ref4], berekend naar een arbeidsongeschiktheid van minder dan 80%, een evenredige verlaging
      van het dagloon plaatsvindt, overeenkomend met een percentage dat gelijk is aan het verschil tussen 100 en het
      midden van de arbeidsongeschiktheidsklasse, waarin de werknemer is ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '45.5'
    text: |-
      Onverminderd het bepaalde in [artikel 46][ref1] kunnen de in het tweede en derde lid bedoelde regels bepalingen
      bevatten op grond waarvan het dagloon tijdens de uitkering kan worden herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '46'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: II
  - number: '46.1'
    text: |-
      De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder ][ref1] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '46.2'
    text: |-
      Onze Minister maakt in de *Staatscourant* bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel46
  - number: '46.3'
    text: |-
      Op een beschikking als gevolg van een herziening van het dagloon ingevolge het bepaalde in dit artikel zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '47.1'
    text: De uitkering bedraagt per dag 70% van het dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel47
  - number: '47.2'
    text: |-
      Voor de werknemer die bij het ontstaan van zijn recht op uitkering zijn arbeidsuren, bedoeld in [artikel 16][ref1],
      niet volledig heeft verloren of wiens verlies van arbeidsuren tijdens de duur van de uitkering wijziging ondergaat,
      bedraagt de uitkering 70% van het dagloon, vermenigvuldigd met het aantal uren werkloosheid per kalenderweek,
      gedeeld door het aantal arbeidsuren voorafgaande aan het intreden van het verlies van arbeidsuren waarnaar zijn
      recht is berekend. Het aantal arbeidsuren voorafgaande aan het intreden van het verlies van arbeidsuren wordt
      bepaald met toepassing van [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '47.3'
    text: |-
      Het tweede lid vindt geen toepassing voor zover bij de vaststelling onderscheidenlijk een herziening van het
      dagloon met de omstandigheden, bedoeld in dat lid, rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel47
  - number: 52a
    text: |-
      Met inachtneming van de [artikelen 16][ref1] en [52][ref2] en de daarop berustende bepalingen heeft de werknemer
      die werkloos is recht op kortdurende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel52b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 52b
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: 52b.1
    text: |-
      Recht op uitkering ontstaat voor de werknemer die in 39 weken onmiddellijk voorafgaande aan de eerste dag van
      werkloosheid in ten minste 26 weken als werknemer arbeid heeft verricht, doch die geen recht op loongerelateerde
      uitkering heeft omdat hij noch aan de voorwaarde van [artikel 17, onderdeel ][ref1], noch aan de voorwaarde van
      [artikel 17, onderdeel ][ref2], voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52b.2
    text: |-
      In afwijking van het eerste lid heeft een werknemer die terzake van werkloosheid uitsluitend als gevolg van vorst,
      sneeuwval, hoog water of andere buitengewone omstandigheden op grond van [artikel 18][ref1] recht op uitkering
      heeft, terzake van dezelfde werkloosheid geen recht op kortdurende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52b.3
    text: |-
      In afwijking van het eerste lid ontstaat geen recht op uitkering voor het aantal arbeidsuren waarover een recht
      op uitkering ingevolge [hoofdstuk IIa][ref1] herleeft, dan wel, indien een recht ingevolge [hoofdstuk IIa][ref2]
      na herleving nogmaals herleeft, voor het totaal aantal uren van dat recht na de laatste herleving. Indien de
      resterende duur van het recht op uitkering op grond van [hoofdstuk IIa][ref3] bij herleving korter is dan zes
      maanden, ontstaat, nadat de geldende duur van die uitkering is verstreken en met inachtneming van de overige
      voorwaarden daarvoor, recht op uitkering voor het aantal arbeidsuren waarover het recht op uitkering op grond van
      [hoofdstuk IIa][ref4] is geëindigd, en bedraagt de duur van die uitkering zes maanden verminderd met de duur van
      de herleefde uitkering op grond van [hoofdstuk IIa][ref5]. Geen recht op uitkering ontstaat indien, na toepassing
      van de eerste of tweede zin, het recht op uitkering dat zou ontstaan een omvang zou hebben van minder dan vijf
      arbeidsuren per kalenderweek en minder dan de helft van de arbeidsuren per kalenderweek.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref4]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref5]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref4
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref5
        bwb_id: BWBR0004045
        hoofdstuk: IIA
  - number: 52c
    text: |-
      De [artikelen 17a][ref1], [17c][ref2], [19][ref3], [20][ref4], en de daarop berustende bepalingen, zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17c
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52c
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 17a
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 17c
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52d.1
    text: |-
      Indien het recht op uitkering op grond van [artikel 52][ref1] in verbinding met
      [artikel 20, eerste lid, onderdeel ][ref2], geheel of gedeeltelijk is geëindigd en vervolgens de omstandigheid die
      tot dat eindigen heeft geleid heeft opgehouden te bestaan, herleeft het recht op uitkering met inachtneming van de
      in [artikel 8][ref3] en [artikel 21, derde lid][ref4], genoemde termijnen, voor zover geen nieuw recht op uitkering
      ingevolge dit hoofdstuk of ingevolge [hoofdstuk II][ref5] bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52c
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 52c
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref5
        bwb_id: BWBR0004045
        hoofdstuk: IIA
  - number: 52d.2
    text: |-
      [ Artikel 21, tweede en vierde lid][ref1], en de daarop berustende bepalingen zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52d.3
    text: |-
      Indien ter zake van na het ontstaan van het recht op kortdurende uitkering verrichte arbeid recht op
      loongerelateerde uitkering is ontstaan nadat het recht op kortdurende uitkering is herleefd, eindigt het
      recht op kortdurende uitkering voor zover het aantal arbeidsuren waarnaar beide rechten samen zijn berekend,
      vermeerderd met het resterende aantal arbeidsuren per kalenderweek, groter is dan het aantal arbeidsuren bedoeld
      in [artikel 52][ref1] in verbinding met [artikel 16][ref2], voorafgaande aan het intreden van het verlies van
      arbeidsuren waarnaar het eerstgenoemde recht is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52c
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 52c
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52d.4
    text: |-
      Indien na het ontstaan van het recht op kortdurende uitkering aansluitend of na verrichte arbeid het
      recht op loongerelateerde uitkering is herleefd, eindigt het recht op kortdurende uitkering voor zover het
      aantal arbeidsuren waarnaar beide rechten zijn berekend, vermeerderd met het resterende aantal arbeidsuren
      per kalenderweek, groter is dan het aantal arbeidsuren, bedoeld in [artikel 52a][ref1] in verbinding met
      [artikel 16][ref2], voorafgaande aan het intreden van het verlies van arbeidsuren op grond waarvan het recht op
      kortdurende uitkering is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 52a
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 52d.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het geheel of gedeeltelijk eindigen van
      rechten op loongerelateerde uitkering enerzijds en op kortdurende uitkering anderzijds, bij samenloop van deze
      rechten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52d
  - number: 52e
    text: |-
      De [artikelen 22 tot en met 27g][ref1], [28, eerste en derde lid][ref2], en de daarop berustende bepalingen zijn
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel28
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52e
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '22'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '28'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
  - number: 52f
    text: |-
      De [artikelen 30 tot en met 41][ref1], alsmede de daarop berustende bepalingen, zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel30
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52f
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '30'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: 52g
    text: |-
      De duur van de kortdurende uitkering is zes maanden, te rekenen vanaf de eerste dag waarop het recht op uitkering
      is ontstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52g
  - number: 52h.1
    text: |-
      Telkens nadat het recht op kortdurende uitkering na gehele eindiging van dat recht is herleefd op grond van
      [artikel 52][ref1], eindigt de kortdurende uitkering met inachtneming van het tweede lid, zoveel later dan de in
      [artikel 52][ref2] genoemde periode als de periode tussen de eindiging en de herleving van het recht op kortdurende
      uitkering heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52d
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel52g
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52h
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 52d
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 52g
        hoofdstuk: IIB
        afdeling: II
  - number: 52h.2
    text: |-
      [ Artikel 43, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52h
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '43'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: II
  - number: 52i.1
    text: De kortdurende uitkering bedraagt per dag 70% van het minimumloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
  - number: 52i.2
    text: |-
      [Artikel 51, tweede tot en met vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel51
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '51'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: III
  - number: 52i.3
    text: |-
      In afwijking van het eerste lid bedraagt de uitkering per dag 70% van het dagloon indien het dagloon lager is dan
      het minimumloon. De [artikelen 45][ref1] en [46][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '46'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: II
  - number: 52i.4
    text: |-
      [Artikel 52, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '52'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: III
  - number: 52i.5
    text: Indien
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
  - number: 52i.5.a
    text: |-
      het recht op kortdurende uitkering is ontstaan na toepassing van [artikel 52][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel52b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 52b
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: 52i.5.b
    text: |-
      tegelijkertijd een recht op kortdurende uitkering herleeft en een recht op uitkering ingevolge [hoofdstuk II][ref1]
      ontstaat,


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel52i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IIA
  - number: '53.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat, op zijn verzoek, tot de vrijwillige
      werkloosheidsverzekering toe de persoon, jonger dan 65 jaar, die op grond van het bepaalde bij of krachtens
      [artikel 3, tweede, vierde en vijfde lid][ref1], niet als werknemer wordt beschouwd, en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 53.1.a
    text: |-
      wiens werknemerschap is geëindigd en die buiten Nederland woont, aldaar direct aansluitend op de beëindiging van
      zijn werknemerschap een dienstbetrekking vervult voor de duur van maximaal vijf jaar en wiens werkgever binnen
      Nederland woont of gevestigd is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: 53.1.b
    text: |-
      die Nederlander is en die is uitgezonden om door de Minister voor Ontwikkelingssamenwerking aan te wijzen
      werkzaamheden in het kader van ontwikkelingssamenwerking te verrichten;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: 53.1.c
    text: |-
      die Nederlander is en die is uitgezonden om, in of buiten Nederland, werkzaamheden te verrichten voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: 53.1.d
    text: die in Nederland woont, en buiten Nederland een dienstbetrekking vervult; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: 53.1.e
    text: |-
      die Nederlander is en buiten Nederland werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in
      opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: '53.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat, op zijn verzoek, tot de vrijwillige werkloosheidsverzekering
      toe de persoon, jonger dan 65 jaar, wiens arbeidsverhouding op grond van [artikel 6, onderdeel c][ref1], niet als
      dienstbetrekking wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '53.3'
    text: |-
      Voorafgaand aan het vervullen van een dienstbetrekking, bedoeld in het eerste lid, onderdeel a, dient de persoon
      gedurende een aaneengesloten periode van tenminste één jaar de hoedanigheid van werknemer te bezitten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: '53.4'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, onderdeel b, c en e, wordt gelijkgesteld de persoon, die onderdaan
      is van één van de lidstaten van de Europese Gemeenschap of onderdaan is van een Staat, waarmee Nederland een
      verdrag inzake sociale zekerheid heeft gesloten, mits hij voor hij werd uitgezonden in Nederland woonde.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel53
  - number: '54.1'
    text: |-
      Het verzoek om toelating tot de vrijwillige werkloosheidsverzekering wordt ingediend bij het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
  - number: '54.2'
    text: 'Het verzoek om toelating als bedoeld in het eerste lid moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
  - number: 54.2.a
    text: |-
      door de in [artikel 53, eerste lid, onderdeel ][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werknemerschap is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.2.b
    text: |-
      door de in [artikel 53, eerste lid, onderdeel b, c en e][ref1] bedoelde persoon: binnen vier weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref2], bedoelde
      werkzaamheden worden verricht in Nederland, binnen vier weken na de dag waarop die werkzaamheden een aanvang hebben
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.2.c
    text: |-
      door de in [artikel 53, eerste lid, onderdeel ][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werkzaamheden buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '54.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd te verklaren dat een verzoek om toelating tot de
      vrijwillige werkloosheidsverzekering, ingediend na de ingevolge het tweede lid geldende termijn, tijdig is
      ingekomen, indien de persoon die het verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te
      zijn geweest.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
  - number: '54.4'
    text: 'De vrijwillige werkloosheidsverzekering vangt aan:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
  - number: 54.4.a
    text: |-
      voor de in [artikel 53, eerste lid, onderdeel a][ref1], bedoelde persoon: op de dag na die, waarop zijn
      werknemerschap is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.b
    text: |-
      voor de in [artikel 53, eerste lid, onderdeel b, c en e][ref1] bedoelde persoon: op de dag van zijn vertrek naar
      het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref2], bedoelde werkzaamheden worden
      verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.c
    text: |-
      voor de in [artikel 53, eerste lid, onder d][ref1], bedoelde persoon: op de dag waarop zijn werkzaamheden een
      aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.d
    text: |-
      voor de in [artikel 53, tweede lid][ref1], bedoelde persoon: op de dag van ontvangst van zijn verzoek om toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '55'
    text: |-
      Toelating van een persoon tot de vrijwillige werkloosheidsverzekering vindt slechts plaats, indien hij zich
      tegelijkertijd vrijwillig verzekert op grond van de [Ziektewet][ref1]. De in de eerste zin opgenomen verplichting
      is niet van toepassing indien betrokkene bij ziekte, zwangerschap of bevalling, recht heeft op loon dan wel
      bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '56'
    text: |-
      De persoon die is toegelaten tot de vrijwillige werkloosheidsverzekering wordt voor de toepassing van deze wet voor
      de duur van die verzekering als werknemer beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56
  - number: 56a
    text: 'Het Uitvoeringsinstituut werknemersverzekeringen beëindigt de vrijwillige werkloosheidsverzekering:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
  - number: 56a.a
    text: op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
  - number: 56a.b
    text: |-
      met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 53, eerste lid, onderdeel ][ref1],
      is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 56a.c
    text: |-
      met ingang van de dag, waarop de werkzaamheden bedoeld in [artikel 53, eerste en tweede lid][ref1] worden
      beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 56a.d
    text: met ingang van de dag waarop de vrijwillig verzekerde verplicht verzekerd wordt ingevolge deze wet;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
  - number: 56a.e
    text: |-
      indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet-tijdig
      is betaald; of
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
  - number: 56a.f
    text: |-
      indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 53, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '57'
    text: |-
      De persoon, bedoeld in [artikel 53, eerste lid, onderdeel a, b en c][ref1], die werkloos is, heeft eerst recht op
      uitkering na terugkeer in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '58.1'
    text: |-
      De persoon, die om toelating tot de vrijwillige werkloosheidsverzekering verzoekt, bepaalt bij de aanvang van de
      vrijwillige werkloosheidsverzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen
      dan:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
  - number: 58.1.a
    text: |-
      het in artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering genoemde bedrag eventueel verhoogd of
      verlaagd krachtens artikel 9*a* van die wet; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
  - number: 58.1.b
    text: |-
      het loon of het inkomen dat hij in geval van werkloosheid naar het oordeel van het Uitvoeringsinstituut
      werknemersverzekeringen derft.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
  - number: '58.2'
    text: De premie voor de vrijwillige werkloosheidsverzekering wordt geheven over het in het eerste lid bedoelde dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
  - number: '58.3'
    text: |-
      De premie bedraagt een door het Uitvoeringsinstituut werknemersverzekeringen te bepalen percentage van
      het in het eerste lid bedoelde dagloon, met dien verstande dat de premie niet meer bedraagt dan het deel
      van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds, bedoeld in artikel 86, eerste lid,
      vermeerderd met de vervangende premie, bedoeld in artikel 85, derde lid. Bij de bepaling van de premie blijft
      [artikel 9, derde en vierde lid, van de Coördinatiewet Sociale Verzekering][ref1] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel9
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '9'
  - number: '58.4'
    text: |-
      Voor de vaststelling van de hoogte van het recht op uitkering op grond van de vrijwillige werkloosheidsverzekering
      wordt, zonodig in afwijking van artikel 45 en de daarop berustende bepalingen, onder dagloon verstaan het in het
      eerste lid bedoelde dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel58
  - number: '59'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt nadere regels met betrekking tot de vrijwillige
      werkloosheidsverzekering. Deze regels bevatten in ieder geval bepalingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel59
  - number: 59.a
    text: de toelating tot de vrijwillige werkloosheidsverzekering;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel59
  - number: 59.b
    text: het einde van de vrijwillige werkloosheidsverzekering;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel59
  - number: 59.c
    text: de premie voor de vrijwillige werkloosheidsverzekering, en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel59
  - number: 59.d
    text: |-
      het dagloon, bedoeld in [artikel 58, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel58
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '58'
        hoofdstuk: III
  - number: '60'
    text: |-
      Voor zover bij of krachtens dit hoofdstuk niet anders is bepaald, zijn de overige artikelen van deze wet en de
      daarop berustende bepalingen, voor zoveel nodig, van overeenkomstige toepassing op het recht op uitkering, het
      geldend maken van het recht op uitkering, de betaling van de uitkering, de hoogte en de duur van de uitkering op
      grond van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel60
  - number: '61.1'
    text: |-
      Een werknemer heeft recht op uitkering op grond van dit hoofdstuk, indien hij van een werkgever, die in
      staat van faillissement is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is, of die anderszins verkeert in de blijvende toestand
      dat hij heeft opgehouden te betalen, loon, vakantiegeld, of vakantiebijslag te vorderen heeft of indien hij
      geldelijk nadeel kan ondervinden doordat deze werkgever bedragen die hij in verband met de dienstbetrekking met de
      werknemer aan derden verschuldigd is, niet heeft betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel61
  - number: '61.2'
    text: |-
      Over de in [artikel 64, onderdeel ][ref1], bedoelde termijn van opzegging heeft de werknemer slechts recht
      op uitkering op grond van dit hoofdstuk, voor zover hij arbeidsuren heeft verloren en beschikbaar is om
      arbeid te aanvaarden als bedoeld in [artikel 16, eerste lid][ref2], of voor zover hij voor de in het eerste
      lid bedoelde werkgever arbeid blijft verrichten. Aan de werknemer die wegens ziekte, gebreken, zwangerschap
      of bevalling ongeschikt is tot het verrichten van zijn arbeid of een uitkering ontvangt op grond van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref3], wordt het in de vorige volzin bedoelde vereiste van beschikbaarheid
      om arbeid te aanvaarden niet gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: '62'
    text: |-
      Geen recht op uitkering op grond van dit hoofdstuk heeft de werknemer, wiens dienstbetrekking met de
      werkgever reeds was geëindigd voordat de werkgever kwam te verkeren in een toestand als bedoeld in
      [artikel 61, eerste lid][ref1], tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: 62.a
    text: |-
      een duidelijke samenhang bestaat tussen de omstandigheden die tot het eindigen van de dienstbetrekking leidden en
      de omstandigheden, die tot die toestand hebben geleid;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel62
  - number: 62.b
    text: |-
      de werknemer een recht heeft op betaling van loon, vakantiegeld, vakantiebijslag of andere bedragen
      als bedoeld in [artikel 61, eerste lid][ref1], dat geen verband houdt met een toestand als bedoeld in
      [artikel 61, eerste lid][ref2], en dat niet geldend kan worden gemaakt uitsluitend wegens die toestand.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '63.1'
    text: |-
      De werknemer, wiens werkgever verkeert in een toestand als bedoeld in [artikel 61, eerste lid][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: 63.1.a
    text: |-
      indien geen tijdige betaling van loon, vakantiegeld of vakantiebijslag heeft plaatsgevonden, binnen een week na de
      dag waarop hij deze betaling normaal zou hebben ontvangen daarvan aangifte te doen bij de het Uitvoeringsinstituut
      werknemersverzekeringen; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel63
  - number: 63.1.b
    text: |-
      binnen een week na de dag waarop het hem redelijkerwijs duidelijk moet zijn geweest dat zijn werkgever de
      bedragen, bedoeld in [artikel 61, eerste lid][ref1], niet heeft betaald, daarvan aangifte te doen bij de het
      Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '63.2'
    text: |-
      Indien de werknemer een verplichting hem op grond van het eerste lid opgelegd, niet of niet behoorlijk is
      nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen de uitkering op grond van dit hoofdstuk
      tijdelijk of blijvend, geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel63
  - number: '63.3'
    text: |-
      Indien het de werknemer voor de totstandkoming van de dienstbetrekking of voor een wijziging in de
      arbeidsvoorwaarden tijdens de dienstbetrekking redelijkerwijs duidelijk moet zijn geweest dat in verband met een
      toestand als bedoeld in [artikel 61, eerste lid][ref1], geen of slechts ten dele betaling zou plaatsvinden van
      loon, vakantiegeld, vakantiebijslag of aan derden verschuldigde bedragen in verband met de dienstbetrekking van de
      werknemer, is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '64'
    text: 'Het recht op uitkering op grond van dit hoofdstuk omvat:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel64
  - number: 64.a
    text: |-
      het loon over ten hoogste 13 weken, onmiddellijk voorafgaande aan de dag van opzegging van de dienstbetrekking
      of, indien de dienstbetrekking niet of op een later dan het daarvoor redelijkerwijs in aanmerking komende
      moment is opgezegd, onmiddellijk voorafgaande aan de dag waarop de dienstbetrekking naar het oordeel van het
      Uitvoeringsinstituut werknemersverzekeringen redelijkerwijs had moeten worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel64
  - number: 64.b
    text: |-
      het loon over ten hoogste de voor de werknemer geldende termijn van opzegging of de termijn van opzegging,
      die zou hebben gegolden als deze termijn was aangevangen op de op grond van onderdeel *a* door het
      Uitvoeringsinstituut werknemersverzekeringen vastgestelde dag, met dien verstande dat de krachtens
      [artikel 40 van de Faillissementswet][ref1] ten aanzien van de werknemer geldende termijn, zowel in als buiten
      faillissement, niet wordt overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel40
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '40'
  - number: 64.c
    text: |-
      het vakantiegeld, de vakantiebijslag en de bedragen, die de werkgever in verband met de dienstbetrekking met de
      werknemer aan derden verschuldigd is, over ten hoogste het jaar onmiddellijk voorafgaande aan het tijdstip waarop
      de in onderdeel *b* bedoelde termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel64
  - number: '65'
    text: |-
      Op de uitkering, bedoeld in [artikel 64][ref1], worden geheel in mindering gebracht de inkomsten uit arbeid als
      werknemer en uit werkzaamheden als bedoeld in [artikel 16, tweede lid, tweede volzin][ref2], alsmede inkomsten
      wegens loonderving over de in die onderdelen bedoelde periode, tenzij de werknemer deze inkomsten reeds ontving
      naast het loon uit de dienstbetrekking uit hoofde waarvan hij recht op uitkering op grond van dit hoofdstuk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: '66.1'
    text: |-
      Voor zover het Uitvoeringsinstituut werknemersverzekeringen op grond van dit hoofdstuk een vordering van een
      schuldeiser van de werkgever voldoet, treedt het in alle rechten, die de schuldeiser ter zake van die vordering
      heeft.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel66
  - number: '66.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft met betrekking tot de premies op grond van de sociale
      verzekeringswetten over de uitkering op grond van dit hoofdstuk verhaal op de werkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel66
  - number: '67'
    text: 'Voor de toepassing van dit hoofdstuk wordt:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel67
  - number: 67.a
    text: |-
      onder loon verstaan: al hetgeen de werkgever in verband met de dienstbetrekking aan de werknemer rechtens
      verschuldigd is met uitzondering van vakantiegeld en vakantiebijslag;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel67
  - number: 67.b
    text: |-
      onder vakantiegeld en vakantiebijslag ook verstaan: vakantiebonnen, vakantiezegels en andere dergelijke
      waardepapieren; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel67
  - number: 67.c
    text: |-
      onder werknemer ook verstaan: de persoon die uitsluitend omdat hij 65 jaar of ouder is niet als werknemer wordt
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel67
  - number: '68.1'
    text: |-
      De [artikelen 17 tot en met 21][ref1], [28][ref2], [41][ref3], en [52][ref4] zijn niet van toepassing op het
      recht op uitkering, het geldend maken van het recht op uitkering en de betaling van de uitkering op grond van dit
      hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel52a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '28'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '41'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 52a
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: '68.2'
    text: |-
      Voor zover bij of krachtens dit hoofdstuk niet anders is bepaald zijn de overige artikelen van deze wet en de
      daarop berustende bepalingen, voor zoveel nodig, van overeenkomstige toepassing op het recht op uitkering, het
      geldend maken van het recht op uitkering en de betaling van de uitkering op grond van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel68
  - number: '72.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak de inschakeling in de arbeid te bevorderen van
      werknemers die recht op uitkering hebben op grond van [hoofdstuk IIa][ref1] of [IIb][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIB
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IIA
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IIB
  - number: '72.2'
    text: |-
      Het eerste lid is niet van toepassing op werknemers als bedoeld in het eerste lid, indien het Uitvoeringsinstituut
      werknemersverzekeringen met burgemeester en wethouders van een gemeente overeenkomen dat op die werknemers
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '72.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen laat de werkzaamheden waarmee de in het eerste lid bedoelde taak
      wordt uitgevoerd, verrichten door een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening
      van beroep of bedrijf de inschakeling van personen in de arbeid bevordert.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
  - number: '72.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verstrekt aan de in het derde lid bedoelde natuurlijke persoon
      of rechtspersoon gegevens voorzover deze noodzakelijk zijn voor de uitvoering van de in het derde lid bedoelde
      werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in de arbeid door die
      natuurlijke persoon of rechtspersoon wordt bevorderd. Deze natuurlijke persoon of rechtspersoon verwerkt de in dit
      lid bedoelde gegevens slechts voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het derde lid, en
      gebruikt slechts met dat doel het sociaal-fiscaalnummer bij die verwerking.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
  - number: '72.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitvoering van dit artikel,
      waarbij in ieder geval regels kunnen worden gesteld voor de inhoud van de overeenkomst met de in het derde lid
      bedoelde natuurlijke of rechtspersoon, het verstrekken en verwerken van gegevens en de soort werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
  - number: '72.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72
  - number: 72a.1
    text: |-
      Op verzoek van een overheidswerkgever kan het Uitvoeringsinstituut werknemersverzekeringen de taak om de
      inschakeling in de arbeid te bevorderen van een persoon als bedoeld in [artikel 78a][ref1], die recht heeft op
      uitkering op grond van hoofdstuk IIa of IIb overdragen aan die overheidswerkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
  - number: 72a.2
    text: |-
      De overheidswerkgever legt bij het verzoek, bedoeld in het eerste lid, een document over waaruit blijkt, dat
      dit verzoek wordt gedaan met instemming van de vertegenwoordigers van de werknemersorganisaties, waarmee de
      overheidswerkgever overleg pleegt te voeren over de arbeidsvoorwaarden en rechtspositie van zijn personeel.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: 72a.3
    text: |-
      De overheidswerkgever treedt bij overdracht als bedoeld in het eerste lid, voor de toepassing van dit
      [hoofdstuk VI][ref1] en [artikel 130, eerste lid][ref2], in de plaats van het Uitvoeringsinstituut
      werknemersverzekeringen. Bij de uitvoering van de werkzaamheden behorend bij die taak zijn voor de
      overheidswerkgever het [derde en vierde lid van artikel 72][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel130
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '130'
        hoofdstuk: XA
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 72a.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen betaalt een door hem nader te bepalen vergoeding aan de
      overheidswerkgever voor de door de overheidswerkgever op grond van dit artikel gedane uitgaven in verband met de
      inschakeling in het arbeidsproces van personen als bedoeld in [artikel 78a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
  - number: 72a.5
    text: 'Bij ministeriële regeling kunnen regels worden gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: 72a.5.a
    text: de vorm waarin en de termijn waarbinnen het in het eerste lid bedoelde verzoek wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: 72a.5.b
    text: |-
      de vorm waarin en de termijn waarbinnen een verzoek om een vergoeding als bedoeld in het vierde lid wordt
      ingediend;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: 72a.5.c
    text: |-
      de door de overheidswerkgever in verband met de uitvoering van dit artikel uit eigen beweging of desgevraagd te
      verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: 72a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan dit artikel of
      onderdelen daarvan van overeenkomstige toepassing zijn voor de werkgever, die geen overheidswerkgever is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel72a
  - number: '75'
    text: |-
      Onze Minister is bevoegd regels te stellen op grond waarvan, in bij die regels aan te geven gevallen en met
      inachtneming van bij die regels te stellen beperkingen, de werknemer bevoegd is deel te nemen aan een opleiding of
      scholing in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel75
  - number: '76.1'
    text: |-
      Indien de werknemer die recht heeft op een uitkering op grond van hoofdstuk II of II, deelneemt of gaat deelnemen
      aan een voor hem, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, noodzakelijke opleiding
      of scholing, blijft volgens door Onze Minister te stellen regels het recht op uitkering op grond van het
      desbetreffende hoofdstuk bestaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76
  - number: '76.2'
    text: |-
      In de door Onze Minister te stellen regels, die voor verschillende groepen werknemers verschillend kunnen luiden,
      worden in ieder geval voorschriften en beperkingen gegeven met betrekking tot de aard, de omvang en de duur van de
      opleiding of scholing als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76
  - number: 76a.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan ter uitvoering van de taak, genoemd in [artikel 72][ref1],
      toestemming verlenen aan de werknemer, die recht heeft op een uitkering op grond van hoofdstuk IIa of IIb, om op
      een proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 76a.2
    text: |-
      Voor de werknemer, bedoeld in het eerste lid, blijft het recht op uitkering op grond van hoofdstuk IIa of IIb
      bestaan, onverminderd [artikel 20, eerste lid, aanhef en onderdeel e][ref1], gedurende de periode waarover
      toestemming is verleend tot het verrichten van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
  - number: 76a.3
    text: 'De onbeloonde werkzaamheden op een proefplaats zijn:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.3.a
    text: werkzaamheden, waartoe de werknemer met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de werknemer heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.3.c
    text: |-
      werkzaamheden, die de werknemer niet reeds eerder onbeloond op een proefplaats bij die werkgever of diens
      rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.3.d
    text: |-
      werkzaamheden, waarbij er, naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen, een reëel
      uitzicht is op een op de onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor
      ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.4
    text: |-
      De werknemer die werkzaamheden verricht als bedoeld in het eerste lid, doet daarvan onverwijld mededeling aan het
      Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.5
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: 76a.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van het eerste tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel76a
  - number: '78'
    text: |-
      De werknemer, ten aanzien van wie [artikel 75][ref1], [76][ref2], [76a][ref3] of 77 wordt toegepast, wordt geacht
      werkloos te zijn en te blijven zolang die toepassing duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '75'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 76a
        hoofdstuk: VI
  - number: 78a.1
    text: |-
      Deze paragraaf is niet van toepassing op te betalen uitkeringen, te maken kosten, te heffen premie en
      te ontvangen bedragen met betrekking tot overheidswerknemers, voorzover verplicht verzekerd op grond
      van deze wet, overheidswerkgevers, voorzover zij werkgever zijn van overheidswerknemers, en degenen
      die uitkering op grond van de verplichte verzekering op grond van deze wet, de [Ziektewet][ref1] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] ontvangen, indien zij die uitkering uit hoofde van een
      dienstbetrekking als overheidswerknemer ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
  - number: 78a.2
    text: |-
      Voor de toepassing van het eerste lid wordt, indien de werknemer laatstelijk voor het intreden van de
      arbeidsongeschiktheid meer dan één dienstbetrekking had waaronder tenminste één dienstbetrekking als
      overheidswerknemer, een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] geacht
      te zijn genoten uit hoofde van een dienstbetrekking als overheidswerknemer, indien hem in de laatste maand voor
      het intreden van de arbeidsongeschiktheid uit zijn dienstbetrekking of dienstbetrekkingen als overheidswerknemer
      een groter bedrag aan loon is uitbetaald dan in zijn dienstbetrekking of dienstbetrekkingen anders dan als
      overheidswerknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 78a.3
    text: |-
      Het eerste lid is niet van toepassing op de bedragen die het Uitvoeringsinstituut werknemersverzekeringen ontvangt
      door de toepassing van de artikelen 6, derde lid, en 7 van de Wet financiering loopbaanonderbreking, de financiële
      tegemoetkomingen op grond van die wet en de daaraan verbonden uitvoeringskosten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel78a
  - number: '79'
    text: |-
      De financiële middelen tot dekking van de uitgaven ten laste van de wachtgeldfondsen en het Algemeen
      Werkloosheidsfonds, alsmede de financiële middelen voor het vormen en in stand houden van reserves voor bedoelde
      fondsen worden gevonden door het heffen van premie.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel79
  - number: '80'
    text: |-
      De premie wordt onderscheiden in een deel dat ten gunste komt van het wachtgeldfonds dat het Uitvoeringsinstituut
      werknemersverzekeringen voor de betrokken sector afzonderlijk administreert en een deel dat ten gunste komt van het
      Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel80
  - number: '81.1'
    text: De premie is verschuldigd door werkgevers en werknemers.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel81
  - number: '81.2'
    text: |-
      Het deel van de premie dat ten gunste komt van het wachtgeldfonds dat het Uitvoeringsinstituut
      werknemersverzekeringen voor de betrokken sector afzonderlijk administreert is verschuldigd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel81
  - number: '81.3'
    text: |-
      Het deel van de premie dat ten gunste komt van het Algemeen Werkloosheidsfonds is gedeeltelijk verschuldigd door
      de werkgever en gedeeltelijk door de werknemer. Bij ministeriële regeling wordt bepaald welk gedeelte door de
      werkgever en welk gedeelte door de werknemer is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel81
  - number: '81.4'
    text: |-
      Bij de vaststelling van de door werkgevers en werknemers verschuldigde premie die ten gunste komt van het Algemeen
      Werkloosheidsfonds, blijft de premie, bedoeld in [artikel 68 van de Ziektewet][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel68
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '68'
  - number: '82.1'
    text: |-
      In afwijking van [artikel 81][ref1] is de premie geheel door de werkgever verschuldigd ten aanzien van de
      werknemer, wiens loon geheel bestaat in verstrekkingen in natura, huisvesting en onderricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel81
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '81'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '82.2'
    text: |-
      De werkgever wordt, op diens aanvraag, ten laste van het Algemeen Werkloosheidsfonds, voor zolang de
      dienstbetrekking duurt doch ten hoogste gedurende de eerste drie jaar vanaf de aanvang van de dienstbetrekking
      voor de werknemer die op de dag van aanvang van die dienstbetrekking een arbeidsgehandicapte is als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] een korting toegekend van € 1021 per jaar op
      de door hem verschuldigde premie, bedoeld in het eerste lid. Een aanvraag als bedoeld in dit lid wordt binnen één
      jaar na aanvang van de dienstbetrekking gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: '82.3'
    text: |-
      De werkgever wordt, op diens aanvraag, met betrekking tot de werknemer die arbeidsgehandicapte is geworden als
      bedoeld in [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], voor zolang de dienstbetrekking
      duurt doch ten hoogste gedurende één jaar nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde
      werkgever geheel of gedeeltelijk heeft hervat dan wel gedurende één jaar nadat diens arbeidsplaats is aangepast
      tot behoud, herstel of ter bevordering van de mogelijkheden tot het verrichten van arbeid van die werknemer, een
      korting van € 1021 per jaar ten laste van het Algemeen Werkloosheidsfonds toegekend op de door hem verschuldigde
      premie, bedoeld in het eerste lid. Een aanvraag als bedoeld in dit lid wordt binnen één jaar nadat de werknemer
      zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of gedeeltelijke heeft hervat dan wel binnen
      één jaar nadat de arbeidsplaats is aangepast gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: '82.4'
    text: |-
      Het tweede en derde lid zijn slechts van toepassing indien het loon van de werknemer over het kalenderjaar
      tenminste 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer gold op
      1 januari van het desbetreffende kalenderjaar. Voor de werknemer wiens loon minder dan 50% van het hiervoor
      bedoelde minimumloon bedraagt, geldt een bedrag van € 227. Onverminderd het tweede en derde lid en de tweede
      volzin, wordt de werkgever een korting op de verschuldigde premie toegekend van € 680 voor de werknemer die tevens
      jonggehandicapte is als bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1]
      en diegenen die na rea-toets recht hebben op het rea-instrumentarium en bij wie hun beperking al voor hun 17e
      verjaardag bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: '82.5'
    text: |-
      Een aanvraag als bedoeld in het derde lid, wordt slechts in behandeling genomen
      als de werkgever gelijktijdig met de aanvraag een plan van aanpak als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '82.6'
    text: |-
      Bij ministeriële regeling worden nadere en zo nodig afwijkende regels gesteld met betrekking tot de gevallen waarin
      en de situaties waaronder bij onderbrekingen van het dienstverband dan wel bij opeenvolgende dienstverbanden bij
      dezelfde dan wel een andere werkgever, in afwijking van het tweede en derde lid wel premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
  - number: '82.7'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van een goede uitvoering van het tweede,
      derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
  - number: '82.8'
    text: Bij ministeriële regeling kunnnen de bedragen, bedoeld in het tweede, derde en vierde lid, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
  - number: '82.9'
    text: |-
      Indien de toepassing van dit artikel er toe zou leiden dat een negatieve premie wordt geheven, wordt de premie op
      nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82
  - number: 82a.1
    text: |-
      De werkgever wordt, op diens aanvraag, ten laste van het Algemeen Werkloosheidsfonds, voor zolang de
      dienstbetrekking duurt doch ten hoogste gedurende de eerste drie jaar vanaf de aanvang van de dienstbetrekking
      voor de werknemer die op de dag van aanvang van die dienstbetrekking een arbeidsgehandicapte is als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] een korting toegekend van € 1021 per jaar op
      de door hem verschuldigde premie, bedoeld in [artikel 81, eerste en derde lid][ref2]. Een aanvraag als bedoeld in
      dit lid wordt binnen één jaar na aanvang van de dienstbetrekking gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel81
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '81'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 82a.2
    text: |-
      De werkgever wordt, op diens aanvraag, met betrekking tot de werknemer die arbeidsgehandicapte is geworden als
      bedoeld in [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], voor zolang de dienstbetrekking
      duurt doch ten hoogste gedurende één jaar nadat die werknemer zijn eigen arbeid of een andere functie bij dezelfde
      werkgever geheel of gedeeltelijk heeft hervat dan wel gedurende één jaar nadat diens arbeidsplaats is aangepast
      tot behoud, herstel of ter bevordering van de mogelijkheden tot het verrichten van arbeid van die werknemer, een
      korting van € 1021 per jaar ten laste van het Algemeen Werkloosheidsfonds toegekend op de door hem verschuldigde
      premie, bedoeld in [artikel 81, eerste en derde lid][ref2]. Een aanvraag als bedoeld in dit lid wordt binnen één
      jaar nadat de werknemer zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of gedeeltelijke
      heeft hervat dan wel binnen één jaar nadat de arbeidsplaats is aangepast gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel81
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
