  - number: '90.1'
    text: 'Ten laste van een wachtgeldfonds komen:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
  - number: 90.1.a
    text: |-
      de op grond van deze wet over de eerste zes maanden vanaf de eerste werkloosheidsdag te betalen uitkering aan de
      werknemer, die in de kalenderweek onmiddellijk voorafgaande aan het intreden van zijn arbeidsurenverlies in de
      sector werkzaam is geweest waarvoor het wachtgeldfonds is ingesteld, waarbij, voor de bepaling van de periode van
      zes maanden, perioden waarin de werknemer geen recht op uitkering heeft, buiten beschouwing worden gelaten;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
  - number: 90.1.b
    text: |-
      de op grond van [artikel 18][ref1] te betalen uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
