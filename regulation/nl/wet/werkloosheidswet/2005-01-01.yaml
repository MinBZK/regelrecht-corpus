        artikel: 35b
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '59'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '97'
        hoofdstuk: VII
        paragraaf: '1'
