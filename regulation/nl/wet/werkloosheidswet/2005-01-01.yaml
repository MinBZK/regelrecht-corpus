      - id: ref3
        bwb_id: BWBR0004045
        artikel: '86'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 97d.2
    text: |-
      Over een uitkering op grond van deze wet, de [Ziektewet][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] en over een toeslag op grond van de
      [Toeslagenwet][ref3] aan een persoon als bedoeld in [artikel 78a][ref4] wordt premie geheven overeenkomstig
      de [artikelen 81, derde lid][ref5], [83][ref6], [84][ref7], [85, derde en vierde lid][ref8], en
      [artikel 86, eerste, derde en vierde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
