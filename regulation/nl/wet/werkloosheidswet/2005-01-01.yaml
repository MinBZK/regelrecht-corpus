  - number: 82a.3
    text: |-
      Het tweede en derde lid zijn slechts van toepassing indien het loon van de werknemer over het kalenderjaar
      tenminste 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer gold op
      1 januari van het desbetreffende kalenderjaar. Voor de werknemer wiens loon minder dan 50% van het hiervoor
      bedoelde minimumloon bedraagt, geldt een bedrag van € 227. Onverminderd het eerste en tweede lid en de tweede
      volzin, wordt de werkgever een korting op de verschuldigde premie toegekend van € 680 voor de werknemer die tevens
      jonggehandicapte is als bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1]
      en diegenen die na rea-toets recht hebben op het rea-instrumentarium en bij wie hun beperking al voor hun 17e
      verjaardag bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 82a.4
    text: |-
      Een aanvraag als bedoeld in het tweede lid, wordt slechts in behandeling genomen
      als de werkgever gelijktijdig met de aanvraag een plan van aanpak als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 82a.5
    text: |-
      Voor de toepassing van dit artikel wordt onder loon niet verstaan een uitkering krachtens de verplichte verzekering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] alsmede de toeslag daarop op grond van de
      [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0004043
  - number: 82a.6
    text: |-
      Bij ministeriële regeling worden nadere en zo nodig afwijkende regels gesteld met betrekking tot de gevallen waarin
      en de situaties waaronder bij onderbrekingen van het dienstverband dan wel bij opeenvolgende dienstverbanden bij
      dezelfde dan wel een andere werkgever, in afwijking van het eerste en tweede lid wel premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
  - number: 82a.7
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van een goede uitvoering van het eerste,
      tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
  - number: 82a.8
    text: Bij ministeriële regeling kunnen de bedragen, bedoeld in het eerste, tweede en derde lid, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
  - number: 82a.9
    text: |-
      Indien de toepassing van dit artikel er toe zou leiden dat een negatieve premie wordt geheven, wordt de premie op
      nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel82a
  - number: '83.1'
    text: |-
      De werkgever is gehouden zowel de door de werknemer als de door hemzelf verschuldigde premie aan het
      Uitvoeringsinstituut werknemersverzekeringen te betalen. De werkgever mag op het loon van de werknemer inhouden het
      door deze verschuldigde deel van de premie over de tijd, waarover dat loon wordt betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel83
  - number: '83.2'
    text: |-
      Indien de verschuldigde premie na de loonbetaling met terugwerkende kracht wordt verhoogd, of indien een
      voorschotpremie wordt gevorderd, mag bij de definitieve vaststelling van de kosten niets van een eventueel door de
      werkgever bij te betalen of bijbetaald bedrag op de werknemer worden verhaald.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel83
  - number: '84'
    text: De maatstaf voor de heffing van de premies is het loon, over het tijdvak, waarover dat loon wordt betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel84
  - number: '85.1'
    text: |-
      Het deel van de premie dat ten gunste komt van het wachtgeldfonds wordt door het Uitvoeringsinstituut
      werknemersverzekeringen bepaald op een percentage van het loon van de werknemer dat voor verschillende
      categorieën van werkgevers en van werknemers kan verschillen. Daarbij blijven ten aanzien van
      eigenrisicodragers als bedoeld in [artikel 63 van de Ziektewet][ref1], uitkeringen op grond van
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2], vermeerderd met een door het
      Uitvoeringsinstituut werknemersverzekeringen vast te stellen opslag in verband met kosten ter zake van de betaling
      van die uitkeringen en van de werkzaamheden, bedoeld in [artikel 63a, eerste lid, van die wet][ref3], alsmede de
      op grond van enige wet over die uitkeringen verschuldigde premies die niet op die uitkeringen in mindering kunnen
      worden gebracht, buiten beschouwing. Bij of krachtens algemene maatregel van bestuur kunnen hieromtrent nadere
      regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
  - number: '85.2'
    text: Op gelijke wijze als in het eerste lid bepaald kan een vastgesteld percentage te allen tijde worden herzien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel85
  - number: '85.3'
    text: |-
      In afwijking van [artikel 80][ref1] wordt met inachtneming van bij algemene maatregel
      van bestuur te stellen regels bij ministeriële regeling over een uitkering op grond van
      deze wet, de [Ziektewet][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref4] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref5], over een toeslag op grond van de [Toeslagenwet][ref6] en
      over loon ingevolge een arbeidsovereenkomst als bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref7]
      in plaats van het deel van de premie dat ten gunste komt van een wachtgeldfonds een vervangende premie vastgesteld.
      Deze vervangende premie wordt bepaald op een gemiddelde van de percentages, welke zijn vastgesteld op grond van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0004043
      [ref7]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
