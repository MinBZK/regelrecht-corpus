        artikel: '30'
  - number: '93'
    text: 'Ten laste van het Algemeen Werkloosheidsfonds komen:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
  - number: 93.a
    text: |-
      de op grond van deze wet te betalen uitkeringen, met uitzondering van de uitkeringen, bedoeld in
      [artikel 90, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 93.b
    text: |-
      de op grond van [artikel 29, tweede lid, onderdeel d, e, en f][ref1], en [artikel 70 van de Ziektewet][ref2] te
      betalen uitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel70
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '70'
  - number: 93.c
    text: de uitvoeringskosten, voorzover deze betrekking hebben op de in de onderdelen a en b bedoelde uitkeringen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
  - number: 93.d
    text: |-
      de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a en b, door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
  - number: 93.e
    text: |-
      de bedragen, die op grond van [artikel 90, vierde lid][ref1], door het Uitvoeringsinstituut werknemersverzekeringen
      ten laste van het Algemeen Werkloosheidsfonds zijn gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 93.f
    text: de subsidies op grond van de Wet tijdelijke bijdrage herstructurering arbeidsvoorziening havens;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
  - number: 93.g
    text: |-
      de premies voor de betaling waarvan aan werkgevers op grond van
      [artikel 5 van de Wet premieregime bij marginale arbeid][ref1] vrijstelling is verleend, voorzover deze niet ten
      laste komen van een wachtgeldfonds;


      [ref1]: https://wetten.overheid.nl/BWBR0008510#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0008510
        artikel: '5'
  - number: 93.h
    text: |-
      het op grond van [artikel 42 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] aan het Reïntegratiefonds
      af te dragen bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '42'
  - number: 93.i
    text: |-
      de financiële tegemoetkomingen op grond van [hoofdstuk 7 van de Wet arbeid en zorg][ref1] en de daaraan
      verbonden uitvoeringskosten, met uitzondering van hetgeen op grond van [artikel 97f][ref2] ten laste komt van het
      Uitvoeringsfonds voor de overheid;


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97f
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97f
        hoofdstuk: VII
        paragraaf: '2'
  - number: 93.j
    text: |-
      de tegemoetkoming in de kosten van kinderopvang, bedoeld in [artikel 29, eerste lid, van de Wet kinderopvang][ref1]
      ten behoeve van de ouder die een persoon is als bedoeld in [artikel 6, eerste lid, onder h, van die wet][ref2], met
      uitzondering van hetgeen op grond van [artikel 97f][ref3] ten laste komt van het Uitvoeringsfonds voor de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97f
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97f
        hoofdstuk: VII
        paragraaf: '2'
  - number: 93.k
    text: |-
      de op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1] te betalen uitkeringen en
      de daaraan verbonden uitvoeringskosten, met uitzondering van hetgeen op grond van [artikel 97f, onderdeel o][ref2],
      ten laste komt van het Uitvoeringsfonds voor de overheid;


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97f
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97f
        hoofdstuk: VII
        paragraaf: '2'
  - number: 93.l
    text: |-
      de kosten in verband met de uitvoering van [artikel 72][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 93b.1
    text: |-
      Vergoedingen aan gemeenten die worden overeengekomen ter uitvoering van [artikel 72, tweede lid][ref1], komen ten
      laste van het Algemeen Werkloosheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 93b.2
    text: |-
      De subsidies, bedoeld in artikel 73a, en de kosten in verband met de uitvoering van dat artikel komen ten laste van
      het Algemeen Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel93b
  - number: '94.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt elk jaar voor elk wachtgeldfonds afzonderlijk een maximum
      vast dat in een kalenderjaar op grond van [artikel 90][ref1] ten laste van dat wachtgeldfonds komt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '94.2'
    text: |-
      Bij de vaststelling van het maximum, bedoeld in het eerste lid, blijven buiten beschouwing: - de bedragen die ten
      laste van een wachtgeldfonds komen op grond van [artikel 90, eerste lid, onderdelen c en h][ref1]; en
        - de lasten die op grond van [artikel 90, vierde lid][ref2], bij het Uitvoeringsinstituut werknemersverzekeringen
      ten laste van het Algemeen Werkloosheidsfonds in rekening worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '94.3'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen stelt elk jaar voor het wachtgeldfonds voor de sector waartoe
      de werkgevers behoren die zich in het kader van de uitoefening van hun bedrijf of beroep bezighouden met het
      ter beschikking stellen van arbeidskrachten aan een derde om krachtens een door deze aan de werkgever verstrekte
      opdracht arbeid te verrichten onder leiding en toezicht van de derde, waarbij die arbeidskrachten werkzaam zijn
      op basis van een uitzendovereenkomst als bedoeld in [artikel 690 van boek 7 van het Burgerlijk Wetboek][ref1],
      waarin tevens een beding als bedoeld in [artikel 691, tweede lid, van boek 7 van het Burgerlijk Wetboek][ref2]
      is opgenomen, een maximum vast dat in een kalenderjaar ten laste van dat wachtgeldfonds komt, voorzover het
      betrekking heeft op de uitkeringen, bedoeld in [artikel 90, eerste lid, onderdeel c][ref3]. Dat maximum bedraagt
      per kalenderjaar 75 procent van het bedrag in dat kalenderjaar van die uitkeringen, de uitvoeringskosten met
      betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen verschuldigde premies die niet op
      die uitkeringen in mindering kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel691
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '690'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '691'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '94.4'
    text: |-
      Indien een of meer werkgevers eigenrisicodrager zijn als bedoeld in [artikel 63 van de Ziektewet][ref1], kan
      Onze Minister het deel van de premie dat ten gunste komt van het desbetreffende wachtgeldfonds maximeren,
      voorzover dat deel betrekking heeft op de uitkeringen, bedoeld in [artikel 90, eerste lid, onderdeel c][ref2],
      alsmede de uitvoeringskosten met betrekking tot die uitkeringen en de op grond van enige wet over die uitkeringen
      verschuldigde premies die niet op die uitkeringen in mindering kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel90
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '90'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '95.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen vergoedt, ten laste van het Algemeen Werkloosheidsfonds, aan
      het Rijk bijdragen die vanwege het Rijk worden verleend aan uit het buitenland afkomstige werknemers, die geen
      Nederlander zijn en die terugkeren naar hun land van herkomst of emigreren naar een ander land en tot het tijdstip
      van vertrek uitkering op grond van deze wet ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel95
  - number: '95.2'
    text: |-
      De in het eerste lid bedoelde vergoedingen zijn ten hoogste gelijk aan de bedragen die de in het eerste lid
      bedoelde werknemers op grond van deze wet zouden hebben kunnen ontvangen indien zij werkloos waren gebleven en niet
      naar hun land van herkomst of een ander land waren vertrokken.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel95
  - number: '95.3'
    text: Onze Minister stelt regels met betrekking tot de aan het Rijk te vergoeden bijdragen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel95
  - number: '97'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan regels stellen omtrent de verrekening tussen het Algemeen
      Werkloosheidsfonds en de wachtgeldfondsen enerzijds en het Uitvoeringsinstituut werknemersverzekeringen anderzijds
      van ontvangen premies en overige ontvangsten enerzijds en van verstrekte uitkeringen en gemaakte kosten anderzijds.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97
  - number: 97a
    text: |-
      De middelen tot dekking van de uitgaven van het Uitvoeringsfonds voor de overheid, alsmede de middelen benodigd
      voor het vormen en in stand houden van een reserve in dat fonds, worden gevonden door het in rekening brengen van
      de uitgaven, bedoeld in [artikel 97b, eerste lid][ref1], bij de overheidswerkgevers en door het heffen van premie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97b
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97b.1
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verhaalt op de overheidswerkgever tot wie de dienstbetrekking
      bestond uit hoofde waarvan de overheidswerknemer de in onderdeel a bedoelde uitkering ontvangt:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97b.1.a
    text: |-
      de op grond van deze wet te betalen uitkering aan een persoon als bedoeld in [artikel 78a][ref1], met uitzondering
      van de premie, bedoeld in [artikel 97d, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel78a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 78a
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97d
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97b.1.b
    text: |-
      de op grond van enige wet over de uitkering, bedoeld in onderdeel a, door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkering in mindering kunnen worden gebracht, met
      uitzondering van de premie, bedoeld in [artikel 97d, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97d
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97b.1.c
    text: |-
      de tegemoetkoming, bedoeld in [artikel 97f, onderdeel i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97f
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97f
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97b.1.d
    text: |-
      de vergoeding, bedoeld in [artikel 97h][ref1], die betrekking heeft op de persoon die de in onderdeel a bedoelde
      uitkering ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97h
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97h
        hoofdstuk: VII
        paragraaf: '2'
  - number: 97b.2
    text: |-
      Op het totaal van de bedragen die op de overheidswerkgever op grond van het eerste lid over enig tijdvak wordt
      verhaald, wordt in mindering gebracht hetgeen het Uitvoeringsinstituut werknemersverzekeringen in dat tijdvak
      ontvangt door de toepassing van [artikel 36][ref1] of de artikelen 6, derde lid, of 7 van de Wet financiering
      loopbaanonderbreking, onder aftrek van de daarop betrekking hebbende uitvoeringskosten, voorzover die
      toepassing betrekking heeft op uitkeringen, premies en tegemoetkomingen die eerder op grond van dat lid op de
      overheidswerkgever zijn verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: 97b.3
    text: |-
      Indien hetgeen op grond van het tweede lid in mindering wordt gebracht het totaal van de bedragen die op
      de overheidswerkgever over het betrokken tijdvak wordt verhaald overtreft, wordt dat meerdere door het
      Uitvoeringsinstituut werknemersverzekeringen betaald aan de overheidswerkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97b.4
    text: |-
      Indien de overheidswerkgever, bedoeld in het eerste lid, niet meer bestaat, wordt voor de toepassing van het eerste
      tot en met derde lid onder overheidswerkgever verstaan de rechtsopvolger van die overheidswerkgever. De eerste zin
      is niet van toepassing met betrekking tot de rechtsopvolger na faillissement.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97b.5
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies, tegemoetkoming of vergoeding worden verhaald,
      vermeldt de termijn of de termijnen waarbinnen deze moeten worden betaald, alsmede de wijze waarop het besluit bij
      gebreke van tijdige betaling, overeenkomstig het zesde tot en met achtste lid zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97b.6
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies, tegemoetkoming
      of vergoeding worden verhaald, levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 97b.7
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies, tegemoetkoming of vergoeding worden verhaald,
      wordt bij gebreke van tijdige betaling met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op
      kosten van de overheidswerkgever of diens rechtsopvolger betekend en ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 97b.8
    text: |-
      Bij gebreke van tijdige betaling wordt het te verhalen bedrag verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97b.9
    text: |-
      De [artikelen 13][ref1] en [16 van de Coördinatiewet Sociale Verzekering][ref2] zijn van overeenkomstige
      toepassing met betrekking tot dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002126#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
    references:
      - id: ref1
        bwb_id: BWBR0002126
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002126
        artikel: '16'
  - number: 97b.10
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan nadere regels stellen met betrekking tot het eerste tot en met
      derde lid en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97b
  - number: 97c.1
    text: |-
      De premie is verschuldigd door de overheidswerkgever. Deze betaalt de premie aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.2
    text: |-
      De overheidswerkgever mag de door hem verschuldigde premie niet verhalen op de overheidswerknemer. Elk beding
      waarbij van de eerste zin wordt afgeweken is nietig.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.3
    text: |-
      De premie wordt door het Uitvoeringsinstituut werknemersverzekeringen geheven naar een door Onze Minister
      vastgesteld percentage van het loon dat, in het tijdvak waarover de betaling loopt, is genoten door de
      overheidswerknemer. Dit percentage kan uitsluitend voor verschillende werkgevers verschillen, omdat bij de
      vaststelling daarvan ten aanzien van de eigenrisicodrager, bedoeld in [artikel 63 van de Ziektewet][ref1],
      uitkeringen op grond van [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref2], vermeerderd met een
      opslag in verband met kosten ter zake van de betaling van die uitkeringen en van de werkzaamheden als bedoeld in
      [artikel 63a, eerste lid, van die wet][ref3], alsmede de op grond van enige wet over die uitkeringen verschuldigde
      premies die niet op die uitkeringen in mindering kunnen worden gebracht, buiten beschouwing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '63'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63a
  - number: 97c.4
    text: Op gelijke wijze als in het derde lid bepaald kan een vastgesteld percentage te allen tijde worden herzien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.5
    text: |-
      Indien een herziening van het in het derde lid bedoelde percentage ingaat op een ander tijdstip dan 1 januari,
      stelt Onze Minister een voor alle overheidswerkgevers gemiddeld percentage vast dat zal gelden voor het gehele
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.6
    text: |-
      De overheidswerkgever wordt, op diens aanvraag, voor zolang de dienstbetrekking duurt doch ten hoogste
      gedurende de eerste drie jaar vanaf de aanvang van de dienstbetrekking voor de overheidswerknemer
      die op de dag van aanvang van die dienstbetrekking een arbeidsgehandicapte is als bedoeld in
      [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] een korting van € 1021 per jaar toegekend op
      de door hem verschuldigde premie, bedoeld in het eerste lid. Een aanvraag als bedoeld in dit lid wordt binnen één
      jaar na aanvang van de dienstbetrekking gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 97c.7
    text: |-
      De overheidswerkgever wordt, op diens aanvraag, met betrekking tot de overheidswerknemer die arbeidsgehandicapte
      is geworden als bedoeld in [artikel 2 van de Wet op de (re)integratie arbeidsgehandicapten][ref1], voor zolang
      de dienstbetrekking duurt doch ten hoogste gedurende één jaar nadat die werknemer zijn eigen arbeid of een
      andere functie bij dezelfde werkgever geheel of gedeeltelijk heeft hervat dan wel gedurende één jaar nadat diens
      arbeidsplaats is aangepast tot behoud, herstel of ter bevordering van de mogelijkheden tot het verrichten van
      arbeid van die werknemer, een korting van € 1021 per jaar toegekend op de door hem verschuldigde premie, bedoeld
      in het eerste lid. Een aanvraag als bedoeld in dit lid wordt binnen één jaar nadat de overheidswerknemer zijn eigen
      arbeid of een andere functie bij dezelfde werkgever geheel of gedeeltelijke heeft hervat dan wel binnen één jaar
      nadat de arbeidsplaats is aangepast gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '2'
  - number: 97c.8
    text: |-
      Het zesde en zevende lid zijn slechts van toepassing indien het loon van de werknemer over het kalenderjaar
      tenminste 50% van het naar een jaarbedrag herleide minimumloon bedraagt zoals dat voor de werknemer gold op
      1 januari van het desbetreffende kalenderjaar. Voor de werknemer wiens loon minder dan 50% van het hiervoor
      bedoelde minimumloon bedraagt, geldt een bedrag van € 227. Onverminderd het zesde en zevende lid en de tweede
      volzin, wordt de werkgever een korting op de verschuldigde premie toegekend van € 680 voor de werknemer die tevens
      jonggehandicapte is als bedoeld in [artikel 5 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1]
      en diegenen die na rea-toets recht hebben op het rea-instrumentarium en bij wie hun beperking al voor hun 17e
      verjaardag bestond.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '5'
  - number: 97c.9
    text: |-
      Een aanvraag als bedoeld in het zevende lid, wordt slechts in behandeling genomen
      als de werkgever gelijktijdig met de aanvraag een plan van aanpak als bedoeld in
      [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref1] overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 97c.10
    text: |-
      Voor de toepassing van het zesde en zevende lid wordt onder loon niet verstaan een uitkering krachtens de
      verplichte verzekering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] alsmede de toeslag
      daarop op grond van de [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0004043
  - number: 97c.11
    text: |-
      Bij ministeriële regeling worden nadere en zo nodig afwijkende regels gesteld met betrekking tot de gevallen waarin
      en de situaties waaronder bij onderbrekingen van het dienstverband dan wel bij opeenvolgende dienstverbanden bij
      dezelfde dan wel een andere werkgever, in afwijking van het zesde en zevende lid wel premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.12
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van een goede uitvoering van het zesde,
      zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.13
    text: Bij ministeriële regeling kunnen de bedragen, bedoeld in het zesde, zevende en achtste lid, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97c.14
    text: |-
      Indien de toepassing van dit artikel er toe zou leiden dat een negatieve premie wordt geheven, wordt de premie op
      nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97c
  - number: 97d.1
    text: |-
      De overheidswerkgever mag op het loon van de overheidswerknemer een bedrag inhouden overeenkomstig hetgeen op grond
      van de [artikelen 81, derde lid][ref1], [84][ref2] en [86][ref3] verschuldigd zou zijn door de overheidswerknemer
      indien die artikelen op hem van toepassing zouden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel86
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel97d
    references:
      - id: ref1
