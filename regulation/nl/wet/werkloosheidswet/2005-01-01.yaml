  - number: '90.2'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen is bevoegd in bijzondere gevallen voor de toepassing van het
      eerste lid, onderdeel a, werkzaamheden in de ene sector gelijk te stellen met werkzaamheden in een andere sector.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
  - number: '90.3'
    text: |-
      De [artikelen 21][ref1] en [52d][ref2] zijn met betrekking tot de in het eerste lid, onderdeel a, bedoelde periode
      waarover de uitkering ten laste van een wachtgeldfonds komt, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel52d
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 52d
        hoofdstuk: IIB
        paragraaf: '1'
        afdeling: I
  - number: '90.4'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen brengt hetgeen ten laste van het wachtgeldfonds komt, ten laste
      van het Algemeen Werkloosheidsfonds voor zoveel dit meer bedraagt dan het voor het wachtgeldfonds op grond van
      [artikel 94, eerste of derde lid][ref1], vastgestelde maximum.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel94
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '90.5'
    text: |-
      In afwijking van het eerste lid, onderdelen c, d en e, komen de uitkeringen, die worden betaald door een
      eigenrisicodrager als bedoeld in [artikel 63 van de Ziektewet][ref1] of een werkgever die een onderneming verkrijgt
      als bedoeld in [artikel 63b, derde lid, van die wet][ref2], en de door hem gemaakte kosten ter zake van de betaling
      van die uitkeringen en van de werkzaamheden, bedoeld in [artikel 63a, eerste lid, van die wet][ref3], alsmede de
      op grond van enige wet over die uitkeringen verschuldigde premies die niet op die uitkeringen in mindering kunnen
      worden gebracht, niet ten laste van een wachtgeldfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel63b
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
