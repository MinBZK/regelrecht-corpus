  - number: '131.2'
    text: |-
      Met gelijke straf wordt gestraft hij, die door hem op grond van deze wet betaalde of verschuldigde premie inhoudt
      op het loon van, of op enige andere wijze verhaalt op een werknemer of gewezen werknemer, zonder dat dit bij deze
      wet is toegestaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel131
  - number: '132'
    text: |-
      Overtreding van bepalingen van een op grond van deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel132
  - number: '135'
    text: |-
      De in de [artikelen 131][ref1] en [132][ref2] omschreven strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel132
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '131'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '132'
        hoofdstuk: XI
  - number: 135a
    text: |-
      Het recht tot strafvordering vervalt indien het Uitvoeringsinstituut werknemersverzekeringen aan de werknemer ter
      zake van hetzelfde feit reeds een boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel135a
  - number: '136'
    text: Deze wet treedt in werking op een bij of krachtens wet te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel136
  - number: '137'
    text: Deze wet kan worden aangehaald onder de titel "Werkloosheidswet".
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel137
