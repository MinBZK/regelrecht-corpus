  - number: '116.2'
    text: |-
      Een door het Uitvoeringsinstituut werknemersverzekeringen bepaald percentage als bedoeld in
      [artikel 85, eerste lid][ref1], behoeft de goedkeuring van Onze Minister. Indien Onze Minister zijn goedkeuring
      onthoudt aan het door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde percentage, stelt hij dat
      percentage zelf vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel85
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '85'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '116.3'
    text: |-
      Het door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde maximum, bedoeld in
      [artikel 94, eerste en derde lid][ref1], behoeft de goedkeuring van Onze Minister. Indien Onze Minister zijn
      goedkeuring onthoudt aan het door het Uitvoeringsinstituut werknemersverzekeringen vastgestelde maximum, stelt hij
      dat zelf vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel94
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '94'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '116.4'
    text: |-
      Een door het Uitvoeringsinstituut werknemersverzekeringen vastgesteld uitkeringsreglement
      werkloosheidsverzekeringen, bedoeld in [artikel 101, eerste lid][ref1], behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel101
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '101'
        hoofdstuk: VIII
  - number: '125'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in [artikel 7][ref1] wordt bekend gemaakt in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
  - number: '126'
    text: |-
      Een voordracht tot een algemene maatregel van bestuur als bedoeld in [artikel 7][ref1] wordt niet gedaan dan nadat
      twee maanden na de in [artikel 125][ref2] bedoelde mededeling zijn verstreken. Gelijktijdig met de mededeling wordt
      het ontwerp aan de beide kamers der Staten-Generaal overgelegd. Binnen 30 dagen na de overlegging kan door een der
      kamers of door tenminste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen worden
      gegeven dat het in de maatregel geregelde onderwerp bij wet wordt geregeld. Alsdan wordt een daartoe strekkend
      voorstel van wet zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel125
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '125'
        hoofdstuk: IX
  - number: '127.1'
    text: |-
      Onverminderd [artikel 127a][ref1], worden beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel127a
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 127a
        hoofdstuk: X
  - number: '127.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127
  - number: '127.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127
  - number: '127.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127
  - number: 127a.1
    text: |-
      Een beschikking over het verzekerd zijn op grond van deze wet wordt gegeven binnen dertien weken na ontvangst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
  - number: 127a.2
    text: |-
      Een beschikking over de betaling van een voorschot op grond van [artikel 31][ref1] wordt gegeven binnen vier weken
      na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '31'
        hoofdstuk: IIA
        paragraaf: '3'
        afdeling: I
  - number: 127a.3
    text: |-
      Een beschikking op grond van [hoofdstuk IV][ref1] en de daarop berustende bepalingen wordt gegeven binnen zes
      maanden na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 127a.4
    text: |-
      Een beschikking op grond van [artikel 97m, derde of vierde lid][ref1], wordt gegeven binnen dertien weken na de
      aanvraag dan wel de in [artikel 97m, derde lid][ref2], bedoelde melding.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97m
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97m
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97m
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97m
        hoofdstuk: VII
        paragraaf: '3'
  - number: 127a.5
    text: |-
      Indien een beschikking als bedoeld in het eerste, tweede, derde of vierde lid niet binnen de toepasselijke termijn
      kan worden gegeven, wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
  - number: 127a.6
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste, tweede, derde of vierde lid
      informatie is gevraagd aan een persoon of instantie buiten Nederland en om die reden de beschikking niet binnen
      de toepasselijke termijn gegeven kan worden, wordt deze termijn verlengd met ten hoogste zes maanden en wordt de
      aanvrager van deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel127a
  - number: '128'
    text: |-
      In afwijking van [artikel 7:2 van de Algemene wet bestuursrecht][ref1] wordt de belanghebbende in een
      bezwaarschriftprocedure ten aanzien van een besluit inzake de verschuldigde premie gehoord op zijn verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '129'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 129a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel129a
  - number: 129b
    text: |-
      Het bezwaar of beroep van een werkgever tegen het verhaal, bedoeld in [artikel 97b, eerste lid][ref1], kan niet
      zijn gegrond op de grief dat de uitkering ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97b
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel129b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97b
        hoofdstuk: VII
        paragraaf: '2'
  - number: 129c
    text: |-
      Ten aanzien van besluiten waaraan een medische beoordeling ten grondslag ligt zijn de
      [artikelen 88 tot en met 88i van de Wet op de arbeidsongeschiktheidsverzekering][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel88
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel129c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '88'
  - number: 129d
    text: |-
      Tegen een besluit op grond van [artikel 97k][ref1], [97l][ref2], [97m][ref3] of [97n][ref4] kan een belanghebbende
      beroep instellen bij de Centrale Raad van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97k
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97m
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel97n
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel129d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97k
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97l
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97m
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 97n
        hoofdstuk: VII
        paragraaf: '3'
  - number: '130.1'
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de inschakeling in de arbeid van werknemers die recht op uitkering hebben op grond
      van hoofdstuk IIa of IIb, doeltreffender uit te voeren, worden afgeweken van het bepaalde bij of krachtens de
      [artikelen 24][ref1], [26][ref2] en [72 tot en met 78][ref3] van deze wet. Bij toepassing van de eerste zin wordt
      bij algemene maatregel van bestuur geregeld op welke wijze van welke artikelen wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: IIA
        paragraaf: '2'
        afdeling: I
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: '130.2'
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vier jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. Het eerste lid, tweede zin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130
  - number: '130.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen worden getroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130
  - number: '130.4'
    text: |-
      Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130
  - number: '130.5'
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130
  - number: 130a.1
    text: |-
      Bij algemene maatregel van bestuur kan ten behoeve van experimenten met een tijdsduur van ten hoogste vier jaar,
      die ten doel hebben de inschakeling in het arbeidsproces te bevorderen van werknemers die recht hebben op uitkering
      op grond van [hoofdstuk IIa][ref1] of IIb, voor bepaalde groepen werknemers worden afgeweken van:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IIA
  - number: 130a.1.a
    text: |-
      de [artikelen 8, eerste lid][ref1], en [20, eerste lid, onderdeel b][ref2], in samenhang met de onderdelen b van
      het derde tot en met vijfde lid van dat laatste artikel;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
