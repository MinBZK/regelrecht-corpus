  - number: 130a.2
    text: |-
      Indien op grond van het eerste lid, onderdeel a, wordt afgeweken van de daar genoemde artikelen wordt
      de uitkering verminderd met 70% van de inkomsten van de werknemer uit werkzaamheden als bedoeld in
      [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 130a.3
    text: 'In de in het eerste lid bedoelde algemene maatregel van bestuur wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.3.a
    text: van welke van de in het eerste lid genoemde bepalingen wordt afgeweken;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.3.b
    text: voor welke groepen werknemers een afwijking geldt en gedurende welke periode;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.3.c
    text: het resultaat dat met het experiment wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.4
    text: |-
      In de in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat met betrekking tot bij dat
      besluit aan te wijzen onderdelen van het experiment door het Uitvoeringsinstituut werknemersverzekeringen nadere
      regels worden gesteld of kunnen worden gesteld. Die nadere regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inkomsten, bedoeld in het
      tweede lid, de berekening daarvan en de periode waaraan deze worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130a.6
    text: |-
      Bij algemene maatregel van bestuur kan een experiment als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele wettelijke regeling is getroffen, doch niet langer dan met een tijdsduur van
      ten hoogste twee jaar. Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130a
  - number: 130c.1
    text: |-
      Bij algemene maatregel van bestuur kan ten behoeve van een experiment met een tijdsduur van ten hoogste vier jaar,
      dat ten doel heeft het ontstaan van recht op uitkering op grond van deze wet te voorkomen, het Uitvoeringsinstituut
      werknemersverzekeringen als taak worden opgedragen te bevorderen dat bepaalde groepen werknemers, waarvan
      redelijkerwijs valt aan te nemen dat binnen vier maanden hun dienstbetrekking zal eindigen, ingeschakeld blijven in
      arbeid. De daaraan verbonden werkzaamheden worden door het Uitvoeringsinstituut werknemersverzekeringen opgedragen
      aan derden die in het kader van de uitoefening van beroep of bedrijf de inschakeling van personen in de arbeid
      bevorderen.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.2
    text: |-
      Bij ministeriële regeling wordt het budget bepaald, ten laste van de wachtgeldfondsen en het Uitvoeringsfonds
      voor de overheid, voor de uitvoering van het eerste lid, en kunnen nadere regels worden gesteld in verband met
      de besteding.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen informeert Onze Minister elk jaar voor 1 oktober omtrent de wijze
      waarop dit instituut het volgende kalenderjaar uitvoering zullen geven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.4
    text: 'In de in het eerste lid bedoelde algemene maatregel van bestuur wordt in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.4.a
    text: |-
      de periode gedurende welke het Uitvoeringsinstituut werknemersverzekeringen de in het eerste lid bedoelde taak
      wordt opgedragen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.4.b
    text: met betrekking tot welke groepen werknemers de in het eerste lid bedoelde taak wordt opgedragen;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.4.c
    text: het resultaat dat met het experiment wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.5
    text: |-
      In de in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat met betrekking tot bij dat
      besluit aan te wijzen onderdelen van het experiment door het Uitvoeringsinstituut werknemersverzekeringen nadere
      regels worden gesteld of kunnen worden gesteld. Die nadere regels behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130c.6
    text: |-
      Bij algemene maatregel van bestuur kan een experiment als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele wettelijke regeling is getroffen, doch niet langer dan met een tijdsduur van
      ten hoogste twee jaar. Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130c
  - number: 130d.1
    text: |-
      Onze Minister zendt uiterlijk zes maanden voor de beëindiging van een experiment, dat met toepassing van dit
      hoofdstuk is getroffen, een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de
      voortzetting van de desbetreffende regeling, anders dan als experiment, aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130d
  - number: 130d.2
    text: |-
      Indien een experiment, dat met toepassing van dit hoofdstuk is getroffen, eerder wordt beëindigd dan oorspronkelijk
      beoogd zendt Onze Minister, in afwijking van het eerste lid, uiterlijk twee maanden na de beëindiging van dat
      experiment een verslag over de doeltreffendheid en de effecten ervan alsmede een standpunt inzake de voortzetting
      van de desbetreffende regeling, anders dan als experiment, aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130d
  - number: 130e
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van dit hoofdstuk aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van dit hoofdstuk in de praktijk.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130e
  - number: 130f
    text: |-
      De voordracht voor een krachtens dit hoofdstuk vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan ieder de gelegenheid is geboden om binnen vier
      weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen.
      Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130f
  - number: 130g.1
    text: |-
      De artikelen 82, tweede lid, 82a, eerste lid, en 97c, zesde lid, zijn niet van toepassing indien de
      dienstbetrekking is aangegaan voor 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130g
  - number: 130g.2
    text: |-
      De artikelen 82, derde lid, 82a, tweede lid, en 97c, zevende lid, zijn niet van toepassing indien de werknemer
      voor 1 januari 2002 zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of gedeeltelijk heeft
      hervat dan wel indien diens arbeidsplaats voor die datum is aangepast tot behoud, herstel of ter bevordering van de
      mogelijkheden tot het verrichten van arbeid van die werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130g
  - number: 130g.3
    text: |-
      Zo nodig in afwijking van de artikelen 82, tweede, derde en vierde lid, 82a, eerste, tweede en derde lid, of 97c,
      zesde, zevende en achtste lid, kan het bedrag dat in mindering wordt gebracht op de door de werkgever verschuldigde
      premie en de premiekorting met betrekking tot het jaar 2002, in 2003 worden vastgesteld. Bij ministeriële regeling
      kunnen met betrekking tot dit lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130g
  - number: 130h.1
    text: |-
      Hoofdstuk IIA, Afdeling III, zoals dat luidde op de dag voor inwerkingtreding van de wet van 19 december 2003
      tot wijziging van de Werkloosheidswet in verband met afschaffing van de vervolguitkering (Stb. 546), blijft van
      toepassing op een recht op uitkering:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
  - number: 130h.1.a
    text: waarvan de eerste werkloosheidsdag is gelegen voor 11 augustus 2003;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
  - number: 130h.1.b
    text: |-
      ontstaan als gevolg van eindiging van de dienstbetrekking door opzegging, indien de aanzegging van de opzegging
      heeft plaatsgevonden voor de in onderdeel a genoemde datum;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
  - number: 130h.1.c
    text: |-
      ontstaan als gevolg van ontbinding door de rechter van de dienstbetrekking, indien de datum waarop de ontbinding is
      uitgesproken is gelegen voor de in onderdeel a genoemde datum.
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
  - number: 130h.2
    text: |-
      De artikelen 48, 51 en 52, zoals die luidden op de dag voor inwerkingtreding van de in het eerste lid genoemde wet,
      blijven van toepassing op de persoon:
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
  - number: 130h.2.a
    text: |-
      die voor 11 augustus 2003 recht op uitkering op grond van deze wet had, welk recht eindigt of is geëindigd op
      grond van het verrichten van werkzaamheden als werknemer, en die terzake van de verrichte werkzaamheden op of na 11
      augustus 2003 een nieuw recht op uitkering krijgt, tot aan het moment waarop dat eerste recht zonder toepassing van
      de [artikelen 43][ref1] en [50][ref2] zou hebben geduurd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel50
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '43'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '50'
        hoofdstuk: IIA
        paragraaf: '1'
        afdeling: III
  - number: 130h.2.b
    text: |-
      op wie het eerste lid, onderdeel b of c van toepassing is, en wiens recht als bedoeld in dat lid eindigt of
      is geëindigd op grond van het verrichten van werkzaamheden als werknemer, en die terzake van de verrichte
      werkzaamheden op of na 11 augustus 2003 een nieuw recht op uitkering krijgt, tot aan het moment waarop dat eerste
      recht zonder toepassing van de [artikelen 43][ref1] en [50][ref2] zou hebben geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel50
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel130h
