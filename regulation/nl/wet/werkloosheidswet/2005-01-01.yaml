        hoofdstuk: VII
        paragraaf: '1'
  - number: '104'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beheert en administreert afzonderlijk de in [artikel 97e][ref1]
      bedoelde middelen tot dekking van de uitgaven en de uitgaven, bedoeld in de [artikelen 97f][ref2], [97g][ref3] en
      [97h][ref4] in de vorm van een Uitvoeringsfonds voor de overheid dat deel uitmaakt van het Uitvoeringsinstituut
      werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel97e
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97f
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97g
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel97h
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 97e
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97f
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97g
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 97h
        hoofdstuk: VII
        paragraaf: '2'
  - number: '105'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan, zo dikwijls het zulks nodig oordeelt, degene met
      betrekking tot wie premiekorting als bedoeld in [artikel 82, tweede, derde of vierde lid][ref1], [82a][ref2]
      of [97c, zesde, zevende of achtste lid][ref3], wordt toegekend of wordt overwogen te worden toegekend, oproepen
      of doen oproepen en op een door of vanwege het Uitvoeringsinstituut werknemersverzekeringen te bepalen plaats
      ondervragen of doen ondervragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel82a
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel97c
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '82'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 82a
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 97c
        hoofdstuk: VII
        paragraaf: '2'
  - number: '111'
    text: |-
      Tussen Onze Minister en Onze Minister van Financiën dient overeenstemming te bestaan omtrent te stellen regels als
      bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel12
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '12'
        hoofdstuk: I
        paragraaf: '3'
  - number: '112'
    text: |-
      Alvorens regels te stellen als bedoeld in [artikel 95, derde lid][ref1], of [artikel 97h, derde lid][ref2], wordt
      door Onze Minister overleg gepleegd met de minister wie dat mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel97h
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '95'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 97h
        hoofdstuk: VII
        paragraaf: '2'
  - number: '116.1'
    text: |-
      De door het Uitvoeringsinstituut werknemersverzekeringen op grond van de [artikelen 16, zesde lid][ref1],
      [26, tweede lid][ref2], [35b, vijfde lid][ref3], [59][ref4], [97][ref5], [97b, tiende lid][ref6],
      [97l, derde lid][ref7], en [97n, tweede lid][ref8], gestelde regels behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35b
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel97
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel97b
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel97l
      [ref8]: https://wetten.overheid.nl/BWBR0004045#Artikel97n
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel116
    references:
      - id: ref1
