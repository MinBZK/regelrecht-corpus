    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
  - number: 90.1.e
    text: |-
      de op grond van enige wet over de uitkeringen, bedoeld in onderdeel a, b en c, door het Uitvoeringsinstituut
      werknemersverzekeringen verschuldigde premies die niet op deze uitkeringen in mindering kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0004045/2005-01-01#Artikel90
  - number: 90.1.f
