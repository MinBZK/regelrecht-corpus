        hoofdstuk: II
        paragraaf: '4'
  - number: 130o.3
    text: |-
      De [artikelen 16][ref1] en [31][ref2] en [hoofdstuk IV][ref3] en de daarop berustende bepalingen zoals deze
      luidden op de dag voor inwerkingtreding van artikel I, onderdeel H, onder 1, van de in het eerste lid genoemde wet
      blijven van toepassing met betrekking tot een recht op uitkering waarvan de eerste dag van de periode, bedoeld in
      [artikel 64, onderdeel a][ref4], zoals dat luidde op die dag, is gelegen op of voor die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel64
