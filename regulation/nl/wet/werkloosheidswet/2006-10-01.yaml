  - number: 130l.1
    text: |-
      Een aanvraag als bedoeld in [artikel 4 van het Tijdelijk besluit preventieve inzet sectorfondsen][ref1] van een
      werknemer als bedoeld in [artikel 3 van dat besluit][ref2] wordt vanaf 1 juli 2005 aangemerkt als een aanvraag om
      werkzaamheden waarmee de taak, bedoeld in [artikel 72, eerste lid onderdeel b][ref3], wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011324#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130l
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011324
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 130l.2
    text: |-
      Een traject als bedoeld in [artikel 4 van het Tijdelijk besluit preventieve inzet sectorfondsen][ref1]
      dat is aangevangen voor 1 juli 2005 wordt vanaf die datum aangemerkt als een traject, bedoeld in
      [artikel 72, eerste lid, onder b][ref2], met dien verstande dat de duur van het traject hierdoor niet wordt
      verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0011324#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130l
    references:
      - id: ref1
        bwb_id: BWBR0011324
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: 130l.3
    text: |-
      De [artikelen 72][ref1] en [72a][ref2], zoals die luidden op de dag voor inwerkingtreding van de wet van 16 juli
      2005, houdende wijziging van de Werkloosheidswet in verband met het preventief inzetten van reïntegratie-
      instrumenten, het opdragen van de reïntegratietaak aan overheidswerkgevers, het ondersteunen van WAO-
      herbeoordeelden bij scholing, het subsidiëren van scholing in het kader van de WAJONG en enkele andere wijzigingen
      in wetten die de reïntegratie-instrumenten betreffen (Stb. 382), blijven van toepassing op de persoon, die recht
      heeft op uitkering op grond van hoofdstuk IIa of IIb en van wie de eerste werkloosheidsdag is gelegen voor 1 juli
      2005.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130l
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 72a
        hoofdstuk: VI
  - number: 130l.4
    text: |-
      In afwijking van het derde lid is [artikel 72a, vierde lid][ref1], zoals dat luidde op de dag voor inwerkingtreding
      van de in het derde lid genoemde wet, slechts van toepassing op door de overheidswerkgever gedane uitgaven die
      betrekking hebben op tot 1 juli 2006 verrichte activiteiten in verband met de inschakeling in het arbeidsproces van
      personen als bedoeld in artikel 78a.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130l
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 72a
        hoofdstuk: VI
  - number: 130m
    text: |-
      [Artikel 34 van de Invoeringswet stelselherziening sociale zekerheid][ref1] en de daarop berustende bepalingen,
      zoals die luidden op de dag voorafgaand aan de dag van inwerkingtreding van de artikelen VI en VII, van de Wet
      administratieve lastenverlichting en vereenvoudiging in socialeverzekeringswetten, blijven van toepassing op de
      persoon wiens recht op uitkering op grond van deze wet is ontstaan voor de datum van inwerkingtreding van die
      artikelen, met betrekking tot die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel34
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130m
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '34'
  - number: 130n
    text: |-
      De periode waarbinnen de hoedanigheid van werknemer kan worden herkregen op grond van
      [artikel 8, tweede lid][ref1], bedraagt ten hoogste 38 maanden voor de persoon die voor de dag van inwerkingtreding
      van artikel I, onderdeel BB, van de Wet wijziging WW-stelsel recht op uitkering op grond van deze wet had.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130n
