      verenigingen maatschappelijk gelijk kunnen worden gesteld, ondernemingen van publiekrechtelijke rechtspersonen
      en doelvermogens;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
  - number: 1.f
    text: |-
      sector: een sector als bedoeld in [artikel 95 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
