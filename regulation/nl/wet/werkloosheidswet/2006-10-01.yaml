  - number: '131'
    text: |-
      De werkgever, die zijn verplichting als bedoeld in [artikel 13][ref1] niet nakomt, wordt gestraft met hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel13
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '13'
        hoofdstuk: I
        paragraaf: '3'
  - number: '132'
    text: |-
      Overtreding van bepalingen van een op grond van deze wet uitgevaardigde algemene maatregel van bestuur, voor zover
      uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid, wordt gestraft met hechtenis van ten hoogste
      een maand of geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel132
  - number: '135'
    text: |-
      De in de [artikelen 131][ref1] en [132][ref2] omschreven strafbare feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel132
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '131'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '132'
        hoofdstuk: XI
  - number: 135a
    text: |-
      Het recht tot strafvordering vervalt indien het UWV aan de werknemer ter zake van hetzelfde feit reeds een boete
      heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel135a
  - number: 135b
    text: |-
      Onze Minister zendt binnen drie jaar na de datum van inwerkingtreding van de onderdelen Aa, Ya en PPa van artikel
      I van de Wet wijziging WW-stelsel aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten in
      de praktijk van de [artikelen 8, tweede lid][ref1], [35aa][ref2] en [77a][ref3] van deze wet, zoals die artikelen
      vanaf die datum komen te luiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel35aa
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel135b
