        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
  - number: 130j.1.a
    text: een voor hem, naar het oordeel van het UWV, noodzakelijke opleiding of scholing volgt, of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130j
  - number: 130j.1.b
    text: |-
      een reïntegratie-uitkering als bedoeld in
      [artikel 23, eerste lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref1], zoals dat artikel luidde op
      de dag voor de inwerkingtreding van de in de aanhef genoemde wet, ontvangt,


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel23
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130j
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '23'
  - number: 130j.2
    text: |-
      In afwijking van [artikel 76a][ref1] blijven [artikel 130a][ref2] en het daarop berustende
      [Tijdelijk besluit proefplaatsing WW][ref3], zoals die luidden op de dag voor inwerkingtreding van de wet van
      23 december 2004 houdende wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband met het
      aanbrengen van enige vereenvoudigingen, van toepassing op de werknemer die voor de datum van inwerkingtreding van
      die wet werkzaamheden verricht in het kader van het [Tijdelijk besluit proefplaatsing WW][ref4], voor de duur van
      die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel130a
      [ref3]: https://wetten.overheid.nl/BWBR0011325
      [ref4]: https://wetten.overheid.nl/BWBR0011325
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130j
    references:
