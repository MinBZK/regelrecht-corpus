        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009267
        artikel: '53'
  - number: 1.i.2°
    text: |-
      een privaatrechtelijk lichaam als bedoeld in [artikel 2, eerste lid, onderdeel f, van de WPA][ref1] of
      [artikel 2, derde lid, van die wet][ref2], zoals die bepalingen luidden op de dag voorafgaande aan het tijdstip van
