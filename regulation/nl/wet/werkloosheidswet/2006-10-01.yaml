  - number: 130o.4
    text: |-
      De [artikelen 20][ref1] en [35][ref2] zoals deze luidden op de dag voor inwerkingtreding van artikel I, onderdeel
      O, onder 1, van de in het eerste lid genoemde wet blijven van toepassing op een verlies van arbeidsuren dat
      heeft plaatsgevonden op of voor die dag zolang er sprake is van aftrek van arbeidsinkomsten op grond van
      [artikel 35][ref3] zoals dat luidde op die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35
