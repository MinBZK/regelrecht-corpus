        artikel: '53'
  - number: 1.i.3°
    text: |-
      Onze Minister van Defensie in relatie tot de in [artikel 2, tweede lid, onderdeel f, van de WPA][ref1]
      uitgezonderde personen, zoals die bepaling luidde op de dag voorafgaande aan het tijdstip van aanvang van fase 2,
      bedoeld in [artikel 53 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
