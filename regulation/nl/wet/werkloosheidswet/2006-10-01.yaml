        artikel: 17a
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 17b
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '19'
