  - number: 130k
    text: |-
      De [artikelen 92, onderdelen g, h, en i][ref1], [93, onderdeel i][ref2], 97b, tweede lid, 97e,
      onderdeel j, en 97f, onderdeel i, zoals deze luidden op de dag voor inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      ________________________________________________________________________________________________ (Stb. 274)
      blijven van toepassing voor de duur van de periode waarin op grond van artikel IXa van die wet recht bestaat op een
      financiële tegemoetkoming op grond van [hoofdstuk 7 van de Wet arbeid en zorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel93
