        artikel: '53'
  - number: 1.j
    text: 'overheidswerknemer:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
  - number: 1.j.1°
    text: |-
      de overheidswerknemer in de zin van [artikel 2 van de WPA][ref1] zoals die bepaling
      luidde op de dag voorafgaande aan het tijdstip van aanvang van fase 2, bedoeld in
      [artikel 53 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2], jonger dan 65 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009267
        artikel: '53'
  - number: 1.j.2°
    text: de beroepsmilitair in de zin van de Algemene militaire pensioenwet, jonger dan 65 jaar;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
  - number: 1.j.3°
    text: |-
      degene die door de Koning in dienst is genomen om bij de Koninklijke Hofhouding werkzaam te zijn en die uit
      dien hoofde onder de Pensioenregeling van de Stichting tot verzorging van de pensioenen van het personeel van de
      Koninklijke Hofhouding van het Huis van Oranje-Nassau valt, jonger dan 65 jaar;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
  - number: 1.k
    text: |-
      Uitvoeringsfonds voor de overheid: het Uitvoeringsfonds voor de overheid, genoemd in
      [artikel 106 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel106
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '106'
  - number: 1.l
    text: |-
      reïntegratiebedrijf: een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van beroep
      of bedrijf de inschakeling van personen in de arbeid bevordert;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
  - number: 1.m
    text: |-
      CWI: de Centrale organisatie werk en inkomen, genoemd in
      [hoofdstuk 4 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '4'
  - number: '2.1'
    text: Waar een natuurlijk persoon woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen die binnen Nederland hun thuishaven hebben, beschouwd als deel
      van Nederland.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel2
  - number: '3.1'
    text: |-
      Werknemer is de natuurlijke persoon, jonger dan 65 jaar, die in privaatrechtelijke of in publiekrechtelijke
      dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: '3.2'
    text: |-
      Wie zijn dienstbetrekking buiten Nederland vervult, wordt niet als werknemer beschouwd, tenzij hij in Nederland
      woont en zijn werkgever eveneens in Nederland woont of gevestigd is. Voor zover een werkgever:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.2.a
    text: |-
      in Nederland een vaste inrichting voor de uitoefening van zijn bedrijf of beroep of een in Nederland wonende of
      gevestigde vaste vertegenwoordiger heeft; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.2.b
    text: in Nederland een of meer personen in dienst heeft en hij door of vanwege Onze Minister als werkgever is aangewezen,
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt niet als werknemer beschouwd de vreemdeling die niet rechtmatig in
      Nederland verblijf houdt in de zin van [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '3.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kan worden bepaald, dat:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.4.a
    text: |-
      personen, die buiten Nederland wonen ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.4.b
    text: |-
      personen, die in Nederland wonen, ook als werknemer worden beschouwd, voor zover zij hun dienstbetrekking buiten
      Nederland vervullen en hun werkgever buiten Nederland woont of gevestigd is.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan van het eerste, tweede en derde lid worden afgeweken ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.5.a
    text: vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.5.b
    text: |-
      personen, op wie een regeling van toepassing is inzake verzekering tegen geldelijke gevolgen van werkloosheid van
      de Nederlandse Antillen, van Aruba, van een andere mogendheid, of van een volkenrechtelijke organisatie; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.5.c
    text: personen, die slechts tijdelijk in Nederland verblijven of tijdelijk in Nederland werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: '3.6'
    text: 'Bij een maatregel, als bedoeld in het vijfde lid, kan worden afgeweken van het derde lid ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.6.a
    text: vreemdelingen die rechtmatig in Nederland arbeid verrichten, dan wel hebben verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
  - number: 3.6.b
    text: |-
      vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3a
    text: |-
      Zo nodig in afwijking van [artikel 3][ref1] en de daarop berustende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3a.a
    text: |-
      wordt als werknemer beschouwd de persoon van wie de verzekering op grond van deze wet voortvloeit uit de toepassing
      van bepalingen van een verdrag of van een besluit van een volkenrechtelijke organisatie;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3a
  - number: 3a.b
    text: |-
      wordt niet als werknemer beschouwd de persoon op wie op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie de wetgeving van een andere mogendheid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel3a
  - number: '4.1'
    text: 'Als dienstbetrekking wordt mede beschouwd de arbeidsverhouding van de persoon die:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.a
    text: |-
      anders dan als zelfstandige en anders dan als thuiswerker, op grond van een overeenkomst tot aanneming van werk als
      bedoeld in [artikel 750 van Boek 7 van het Burgerlijk Wetboek][ref1], persoonlijk een werk tot stand brengt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel750
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '750'
  - number: 4.1.b
    text: de in onderdeel *a* bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.c
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen
      van overeenkomsten tussen daartoe door hem te bezoeken personen en die ander, mits hij de bedoelde bemiddeling
      uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem bijkomstige werkzaamheid is
      en hij zich daarbij doorgaans door niet meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.d
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen
      van overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander, mits hij
      de bedoelde bemiddeling uitsluitend voor die ander verleent, het verlenen van die bemiddeling niet een voor hem
      bijkomstige werkzaamheid is en hij zich daarbij doorgaans door niet meer dan twee andere personen laat bijstaan;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.f
    text: 'als lid van de bemanning van een vissersvaartuig aanspraak heeft op een aandeel in de besomming, tenzij hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.f.1°
    text: |-
      als zodanig tegen geldelijke gevolgen van arbeidsongeschiktheid is verzekerd bij het Sociaal Fonds voor de
      Maatschapsvisserij; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.f.2°
    text: exploitant of mede-exploitant van het vaartuig is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.g
    text: zijn militaire dienstplicht of in plaats daarvan vervangende dienst vervult;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.1.h
    text: |-
      degene, die als bestuurder werkzaam is ten behoeve van een coöperatie die met haar leden uitsluitend
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] sluit,
      indien hij lid is van de coöperatie en deze blijkens haar statuten en met inachtneming van de vereisten gesteld in
      het derde lid en krachtens het vierde lid kan worden beschouwd als een coöperatie met werknemerszelfbestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '4.2'
    text: |-
      Het eerste lid, onderdeel *a* en *b*, blijft buiten toepassing, indien de in onderdeel *a* bedoelde overeenkomst
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: '4.3'
    text: 'Een coöperatie als bedoeld in het eerste lid, onderdeel *h*, dient te voldoen aan de vereisten, dat:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.3.a
    text: |-
      doorgaans ten minste twee derde deel van het aantal personen met wie de coöperatie een arbeidsovereenkomst als
      bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] heeft gesloten, lid van de
      coöperatie is;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 4.3.b
    text: |-
      het lidmaatschap van de coöperatie door ieder van de in onderdeel *a* bedoelde personen onder dezelfde voorwaarden
      kan worden verkregen en voorwaarden van geldelijke aard geen wezenlijke belemmering vormen voor de verkrijging van
      het lidmaatschap;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.3.c
    text: de leden van de coöperatie ieder één stem hebben;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.3.d
    text: |-
      de arbeidsvoorwaarden van de leden van de coöperatie niet wezenlijk verschillen van hetgeen gebruikelijk is in
      gelijksoortige ondernemingen in de desbetreffende sector;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.3.e
    text: |-
      een lid van de coöperatie behoudens in geval van liquidatie van de coöperatie, bij beëindiging van zijn
      lidmaatschap ten hoogste aanspraak kan maken op het door hem uit hoofde van een geldelijke voorwaarde als bedoeld
      in onderdeel *b*, hetzij uit anderen hoofde aan de coöperatie betaalde bedrag, herrekend naar geldontwaarding.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: '4.4'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld waarbij de in het derde lid genoemde vereisten
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.4.a
    text: nader worden bepaald;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.4.b
    text: |-
      worden aangevuld met andere vereisten op grond waarvan de coöperatie kan worden beschouwd als een coöperatie met
      werknemerszelfbestuur.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: '4.5'
    text: 'Voor de toepassing van het eerste lid, onderdeel a, wordt onder zelfstandige verstaan de persoon die:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
  - number: 4.5.a
    text: |-
      in Nederland woont en die belastbare winst uit onderneming geniet als bedoeld in
      [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        paragraaf: 3.2.1
  - number: 4.5.b
    text: |-
      niet in Nederland woont en die belastbare winst uit Nederlandse onderneming geniet als bedoeld in
      [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref1], tenzij hij de onderneming niet voor eigen rekening
      feitelijk drijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling7.2
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '7.2'
  - number: 4.5.c
    text: |-
      directeur-grootaandeelhouder is als bedoeld in [artikel 6, eerste lid, onderdeel d][ref1], en het werk tot
      stand brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, op grond waarvan eveneens als
      dienstbetrekking wordt beschouwd de arbeidsverhouding van de persoon die:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel5
  - number: 5.a
    text: als thuiswerker arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel5
  - number: 5.b
    text: de in onderdeel *a* bedoelde persoon als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel5
  - number: 5.c
    text: als musicus of anderszins als artiest optreedt of als beroep een tak van sport beoefent; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel5
  - number: 5.d
    text: |-
      tegen beloning persoonlijk arbeid verricht en wiens arbeidsverhouding niet reeds op grond van dit artikel en de
      [artikelen 3][ref1] en [4][ref2] als dienstbetrekking wordt beschouwd, doch hiermee maatschappelijk gelijk kan
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6.1'
    text: 'Als dienstbetrekking wordt niet beschouwd de arbeidsverhouding van een persoon:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: 6.1.a
    text: |-
      die minister, staatssecretaris, Nationale ombudsman, substituut-ombudsman, lid van gedeputeerde staten of
      wethouder, waaronder begrepen een lid van het dagelijks bestuur van een deelgemeente, is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: 6.1.b
    text: |-
      die als vrijwilliger werkzaamheden verricht als politiebeambte, alsmede van degene die als vrijwilliger al dan niet
      tegen loon werkzaamheden verricht bij de gemeentelijke brandweer;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: 6.1.c
    text: |-
      die ten behoeve van de natuurlijke persoon, tot wie hij in dienstbetrekking staat, uitsluitend of nagenoeg
      uitsluitend huiselijke of persoonlijke diensten in diens huishouding verricht en die diensten doorgaans op minder
      dan drie dagen per week verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: 6.1.d
    text: die directeur-grootaandeelhouder is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: 6.1.e
    text: |-
      indien degene met wie hij de arbeidsverhouding heeft, met betrekking tot die arbeidsverhouding op grond van
      [artikel 6a van de Wet op de loonbelasting 1964][ref1] niet als inhoudingsplichtige wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel6a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 6a
  - number: 6.1.f
    text: |-
      die als vrijwilliger als bedoeld in [artikel 2, zesde lid, van de Wet op de loonbelasting 1964][ref1], uitsluitend
      vergoedingen of verstrekkingen als bedoeld in dat lid ontvangt met een gezamenlijke waarde van ten hoogste € 150
      per maand en € 1 500 per kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '2'
  - number: '6.2'
    text: Het eerste lid is alleen van toepassing op de aldaar bedoelde arbeidsverhoudingen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: '6.3'
    text: |-
      Door Onze Minister worden, in overeenstemming met Onze Minister van Financiën, regels gesteld omtrent hetgeen onder
      directeur-grootaandeelhouder, bedoeld in het eerste lid, onderdeel *d*, wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel6
  - number: '7.1'
    text: |-
      Tot een bij of krachtens algemene maatregel van bestuur, op voordracht van Onze Minister
      tezamen met Onze Minister van Binnenlandse Zaken, te bepalen tijdstip wordt niet als
      dienstbetrekking beschouwd de arbeidsverhouding van de overheidswerknemer, bedoeld in
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009267#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009267
        artikel: '1'
  - number: '7.2'
    text: Het in het eerste lid bedoelde tijdstip kan voor groepen van overheidswerknemers verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen nadere en, zo nodig, van deze
      wet afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel7
  - number: '8.1'
    text: |-
      Een persoon wiens dienstbetrekking is geëindigd, behoudt de hoedanigheid van werknemer, voor zover hij geen
      werkzaamheden verricht uit hoofde waarvan hij op grond van deze wet niet als werknemer wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel8
  - number: '8.2'
    text: |-
      Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden in de uitoefening van een
      bedrijf of in de zelfstandige uitoefening van een beroep, herkrijgt bij beëindiging van die werkzaamheden de
      hoedanigheid van werknemer, indien de werkzaamheden worden beëindigd binnen een periode die gelijk is aan de
      uitkeringsduur, danwel binnen anderhalf jaar, indien de uitkeringsduur korter is dan anderhalf jaar.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel8
  - number: '8.3'
    text: |-
      Een persoon, wiens werknemerschap is geëindigd door het verrichten van werkzaamheden als lid van de Eerste Kamer
      der Staten-Generaal, van een vertegenwoordigend orgaan van een publiekrechtelijk lichaam, dat bij rechtstreekse
      verkiezing wordt samengesteld, of van een algemeen bestuur van een waterschap, herkrijgt bij beëindiging van die
      werkzaamheden de hoedanigheid van werknemer, voor zover die beëindiging plaatsvindt binnen het tijdvak van de bij
      de aanvang van die werkzaamheden voor die persoon nog geldende uitkeringsduur krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel8
  - number: '8.4'
    text: |-
      Onverminderd het tweede en derde lid herkrijgt de persoon na afloop van de in het eerste lid bedoelde werkzaamheden
      de hoedanigheid van werknemer, indien deze niet langer hebben geduurd dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel8
  - number: 8a
    text: |-
      Degene die op grond van de verplichte verzekering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1]
      of de [Wet op de arbeidsongeschiktheidsverzekering][ref2] een uitkering ontvangt verliest de hoedanigheid van
      werknemer indien hij niet in Nederland woont.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
  - number: '9'
    text: |-
      Werkgever is de overheidswerkgever onderscheidenlijk de natuurlijke persoon tot wie of het lichaam tot welk een of
      meer natuurlijke personen in dienstbetrekking staan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel9
  - number: '10'
    text: 'Als werkgever wordt beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel10
  - number: 10.a
    text: |-
      in de gevallen, bedoeld in [artikel 4, eerste lid][ref1], onderdeel: *a en b:* de aanbesteder; *c en d:* degene,
      met wie de overeenkomst tot bemiddeling is gesloten; *f:* de exploitant of mede-exploitant van het vaartuig; *g:*
      Onze Minister van Defensie of Onze Minister; *h:* de coöperatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '4'
        hoofdstuk: I
        paragraaf: '2'
  - number: 10.b
    text: |-
      in de gevallen, bedoeld in [artikel 5][ref1], onderdeel: *a:* de opdrachtgever; *b:* de thuiswerker; *c:* degene,
      met wie het optreden of de sportbeoefening is overeengekomen; *d:* degene, die bij de in [artikel 5][ref2] bedoelde
      algemene maatregel van bestuur als werkgever wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel5
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '5'
        hoofdstuk: I
        paragraaf: '2'
  - number: '11.1'
    text: 'Het UWV wordt als werkgever beschouwd in de gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
  - number: 11.1.a
    text: |-
      ziekengeld wordt betaald op grond van de verplichte verzekering krachtens de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 11.1.b
    text: |-
      uitkering wordt betaald op grond van de verplichte verzekering of [hoofdstuk IV van deze wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 11.1.c
    text: |-
      uitkering wordt betaald op grond van de verplichte verzekering op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1] of de [Wet op de arbeidsongeschiktheidsverzekering][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
  - number: 11.1.d
    text: |-
      uitkering wordt betaald op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1] aan
      de werknemer of gelijkgestelde, bedoeld in [artikel 3:6, eerste lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 11.1.e
    text: |-
      geen ziekengeld wordt betaald op grond van [artikel 29, eerste lid, van de Ziektewet][ref1] maar wel een toeslag op
      grond van de [Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0004043
  - number: '11.2'
    text: |-
      Ingeval het UWV de uitkering of toeslag, bedoeld in het eerste lid, vermeerderd met de daarover door de werkgever
      verschuldigde premies en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1], betaalt aan de
      werkgever, bedoeld in [artikel 9][ref2], [10][ref3] of [12][ref4], teneinde deze uitkering door diens tussenkomst
      te doen uitbetalen, treedt voor de toepassing van het eerste lid, deze in de plaats van het UWV, onafhankelijk van
      het voortbestaan van de dienstbetrekking met die werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel12
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '12'
        hoofdstuk: I
        paragraaf: '3'
  - number: '11.3'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de door de werkgever verschuldigde premies, bedoeld in het
      tweede lid, nadere en zonodig afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister is bevoegd, in afwijking van de [artikelen 9][ref1] en [10][ref2], andere dan de aldaar bedoelde
      personen of lichamen aan te wijzen als werkgever ten aanzien van de persoon die:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel10
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '9'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 12.a
    text: |-
      krachtens overeenkomst met een ander tegen beloning geregeld zijn bemiddeling verleent tot het tot stand komen van
      overeenkomsten tussen daartoe door hem te bezoeken personen en een opdrachtgever van die ander;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel12
  - number: 12.b
    text: een thuiswerker als hulp bij het verrichten van de arbeid bijstaat;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel12
  - number: 12.c
    text: als musicus of anderszins als artiest optreedt dan wel als beroep een tak van sport beoefent.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel12
  - number: '13'
    text: |-
      De werkgever is verplicht de werknemer de gelegenheid te geven tot het uitoefenen van de hem op grond van deze
      wet of de daarop berustende bepalingen toegekende bevoegdheden en tot het nakomen van de hem op grond van deze wet
      of de daarop berustende bepalingen opgelegde verplichtingen, voor zover de uitoefening van die bevoegdheden en de
      nakoming van die verplichtingen niet buiten de arbeidstijd kan geschieden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel13
  - number: '14.1'
    text: |-
      Loon is het loon in de zin van [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Minimumloon is het minimumloon per maand, bedoeld in [artikel 8, eerste lid, onderdeel ][ref1] of, indien het
      een werknemer jonger dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref2], en [artikel 8, derde lid, van genoemde wet][ref3], beide vermeerderd met de daarover
      berekende vakantietoeslag, bedoeld [in artikel 15 van die wet][ref4], en vervolgens gedeeld door 21,75.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '14.3'
    text: |-
      Loon, door verschillende personen te zamen onverdeeld ontvangen, wordt, voor zover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel14
  - number: '15'
    text: |-
      Met inachtneming van de [artikelen 16 tot en met 21][ref1] en de daarop berustende bepalingen heeft de werknemer
      die werkloos is recht op uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: '16.1'
    text: 'Werkloos is de werknemer die:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.1.a
    text: |-
      ten minste vijf of ten minste de helft van zijn arbeidsuren per kalenderweek heeft verloren, alsmede het recht op
      onverminderde doorbetaling van zijn loon over die uren; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.1.b
    text: beschikbaar is om arbeid te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.2'
    text: |-
      Onder de in het eerste lid bedoelde arbeidsuren per kalenderweek wordt verstaan het aantal uren waarin de werknemer
      in de 26 kalenderweken onmiddellijk voorafgaande aan het intreden van zijn verlies van arbeidsuren gemiddeld per
      week als werknemer arbeid heeft verricht. Indien de werknemer minder dan vijf arbeidsuren per kalenderweek heeft
      verloren, wordt bij de bepaling van het aantal arbeidsuren, bedoeld in de eerste volzin, mede in aanmerking genomen
      het aantal uren waarin de werknemer in de 26 kalenderweken onmiddellijk voorafgaande aan het intreden van zijn
      verlies van arbeidsuren gemiddeld per week werkzaamheden heeft verricht uit hoofde waarvan hij niet als werknemer
      wordt beschouwd. Voor de vaststelling van de periode van 26 kalenderweken, bedoeld in de eerste en tweede zin,
      worden weken, tot een maximum van 78 weken, waarin de werknemer onbetaald verlof heeft genoten, niet in aanmerking
      genomen, tenzij dit leidt tot een lager aantal uren dan wanneer die weken wel in aanmerking zouden worden genomen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.3'
    text: |-
      Met het recht op onverminderde doorbetaling van zijn loon, bedoeld in het eerste lid, worden gelijkgesteld
      de inkomsten waarop de werknemer recht heeft in verband met de beëindiging van de dienstbetrekking,
      tot aan het bedrag aan loon dat de werknemer zou hebben ontvangen indien de dienstbetrekking door
      opzegging met inachtneming van de rechtens geldende termijn zou zijn geëindigd. Onder inkomsten als
      bedoeld in de eerste zin wordt niet verstaan een door de rechter toegewezen vergoeding van proceskosten.
      Onder de rechtens geldende termijn, bedoeld in de eerste zin, wordt verstaan de termijn die de
      werkgever of de werknemer op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref1], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref2] of een overeenkomstige bepaling van
      een soortgelijke regeling ieder voor zich bij opzegging in acht behoort te nemen. In geval de dienstbetrekking
      is geëindigd met wederzijds goedvinden wordt onder de rechtens geldende termijn, bedoeld in de eerste zin,
      verstaan de termijn die de werkgever op grond van [artikel 672 van Boek 7 van het Burgerlijk Wetboek][ref3], de
      [artikelen 94 tot en met 97 van het Algemeen Rijksambtenarenreglement][ref4] of een overeenkomstige bepaling van
      een soortgelijke regeling bij opzegging in acht behoort te nemen. Het in de eerste zin bedoelde bedrag wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel672
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel672
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel94
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '672'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '94'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '672'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: '94'
  - number: 16.3.a
    text: |-
      indien de dienstbetrekking door opzegging is geëindigd, toegerekend aan de periode onmiddellijk volgend op de datum
      waarop de dienstbetrekking is opgezegd;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.3.b
    text: |-
      indien de dienstbetrekking is geëindigd door ontbinding, toegerekend aan de periode onmiddellijk volgend op de
      datum van de beschikking tot ontbinding;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.3.c
    text: |-
      indien de dienstbetrekking is geëindigd met wederzijds goedvinden, toegerekend aan de periode onmiddellijk volgend
      op de datum waarop de beëindiging schriftelijk is overeengekomen, dan wel, bij gebrek aan een schriftelijke
      beëindigingsovereenkomst, aan de periode onmiddellijk volgend op het tijdstip waarop de dienstbetrekking is
      geëindigd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.4'
    text: |-
      Het derde lid vindt geen toepassing indien de werkgever na het einde van de dienstbetrekking verkeert in een
      toestand als bedoeld in [artikel 61][ref1] en voorzover de werknemer als gevolg van die toestand de in het derde
      lid bedoelde inkomsten niet ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '16.5'
    text: 'Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste en het tweede lid regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.5.a
    text: |-
      omtrent de berekening van het verlies van arbeidsuren bij een opeenvolgend verlies van arbeidsuren, waarbij andere
      perioden voor de berekening van het aantal gewerkte arbeidsuren in aanmerking kunnen worden genomen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.5.b
    text: |-
      waarbij voor bepaalde groepen werknemers een kortere of langere periode voor de berekening van het aantal gewerkte
      arbeidsuren geldt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.6'
    text: |-
      Het UWV is bevoegd ten aanzien van groepen van werknemers die in de regel meer dan 50 uren per kalenderweek
      werken, bij verlies van arbeidsuren uit een dienstbetrekking, waarin over de laatste 26 kalenderweken onmiddellijk
      voorafgaande aan het intreden van het verlies van arbeidsuren gemiddeld meer dan 50 uren is gewerkt, voor de
      toepassing van het tweede lid te bepalen welk aantal uren ten hoogste in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.7'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de berekening van het aantal arbeidsuren, bedoeld in
      het tweede lid. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.7.a
    text: |-
      de gelijkstelling van uren waarin geen arbeid is verricht met arbeidsuren en het buiten beschouwing laten van uren
      waarin arbeid is verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16.7.b
    text: de berekening van het verlies van arbeidsuren met betrekking tot wisselende arbeidspatronen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: '16.8'
    text: |-
      In afwijking van het eerste lid is tevens werkloos de werknemer die voldoet aan het eerste lid, onderdeel *a*, doch
      niet voldoet aan het eerste lid, onderdeel *b*, wegens het enkele feit dat hij voorafgaand aan of aansluitend op
      het arbeidsurenverlies deelneemt of gaat deelnemen aan een naar het oordeel van het UWV noodzakelijke opleiding
      of scholing, als bedoeld in [artikel 76][ref1]. Voor de toepassing van [artikel 16a, tweede lid][ref2], wordt een
      werknemer op wie de eerste volzin van toepassing is beschouwd als een werknemer die voldoet aan de voorwaarden van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 16a
        hoofdstuk: II
        paragraaf: '1'
  - number: '16.9'
    text: |-
      In afwijking van het eerste lid is tevens werkloos de werknemer die voldoet aan het eerste lid, onderdeel b, doch
      niet voldoet aan het eerste lid, onderdeel a, uitsluitend vanwege het feit dat hij recht heeft op onverminderde
      doorbetaling van loon en de werkgever dit loon niet voldoet omdat hij verkeert in een toestand als bedoeld in
      [artikel 61][ref1]. De eerste zin vindt slechts toepassing gedurende de periode dat de voor de werknemer rechtens
      geldende opzegtermijn langer duurt dan de opzegtermijn, bedoeld in [artikel 64, eerste lid, onderdeel b][ref2],
      en voorzover de werknemer direct voorafgaande aan deze periode recht had op een uitkering op grond van
      [hoofdstuk IV][ref3] over de opzegtermijn bedoeld in [artikel 64, eerste lid, onderdeel b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: '16.10'
    text: |-
      Indien bij een beoordeling als bedoeld in
      [artikel 6, eerste lid, van de Wet Werk en inkomen naar arbeidsvermogen][ref1] is vastgesteld dat de werknemer voor
      een geringer aantal uren belastbaar is dan gezonde personen met soortgelijke opleiding en ervaring als bedoeld in
      [artikel 1 van die wet][ref2], doch minder dan 35% arbeidsongeschikt is, wordt onder de in het eerste lid bedoelde
      arbeidsuren per kalenderweek verstaan: het aantal uren dat die werknemer belastbaar is, tenzij dit leidt tot een
      hoger aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
  - number: '16.11'
    text: Voor de toepassing van deze wet en de daarop berustende bepalingen is de maandag de eerste dag van de kalenderweek.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16
  - number: 16a.1
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen is de eerste dag van werkloosheid de eerste
      dag waarop een verlies van een of meer uren, alsmede een verlies van het recht op onverminderde doorbetaling
      van het loon over die uren intreedt in de kalenderweek waarin zich een situatie voordoet als bedoeld in
      [artikel 16, eerste of achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: 16a.2
    text: |-
      Indien bij het intreden van het arbeidsurenverlies, bedoeld in [artikel 16, eerste lid][ref1], niet wordt voldaan
      aan een van de overige in dat lid bedoelde voorwaarden, of de werknemer geen recht op uitkering heeft op grond van
      [artikel 19][ref2], wordt, in afwijking van het eerste lid, voor de toepassing van deze wet en de daarop berustende
      bepalingen als eerste werkloosheidsdag aangemerkt, de dag van de kalenderweek waarop aan de overige voorwaarden,
      bedoeld in het eerste lid, wordt voldaan en [artikel 19][ref3] niet meer aan het recht op uitkering in de weg
      staat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 16a.3
    text: |-
      In afwijking van het eerste en tweede lid is de eerste dag van werkloosheid voor de werknemer,
      bedoeld in [artikel 16, negende lid][ref1], de dag na het einde van de termijn, bedoeld in
      [artikel 64, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: '17'
    text: |-
      Recht op uitkering ontstaat voor de werknemer indien hij in 36 weken onmiddellijk voorafgaande aan de eerste dag
      van werkloosheid in ten minste 26 weken als werknemer arbeid heeft verricht.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17
  - number: 17a.1
    text: |-
      Voor de vaststelling van het in [artikel 17][ref1] bedoelde aantal van 36 weken worden niet in aanmerking genomen
      weken gedurende welke de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 17a.1.a
    text: wegens ziekte of arbeidsongeschiktheid geen arbeid kon verrichten;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
  - number: 17a.1.b
    text: |-
      werkzaamheden heeft verricht als bedoeld in [artikel 8][ref1] en hij op grond van dat artikel de hoedanigheid van
      werknemer heeft herkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 17a.1.c
    text: wegens het genieten van onbetaald verlof geen arbeid heeft verricht, tot een maximum van 78 weken; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
  - number: 17a.1.d
    text: |-
      geen arbeid heeft verricht maar wel recht op uitkering heeft op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: 17a.2
    text: |-
      Voor de vaststelling van het in [artikel 17][ref1] bedoelde aantal van 26 weken wordt de in een week verrichte
      arbeid slechts in aanmerking genomen, voor zover deze betrekking heeft op de dienstbetrekking waaruit de werknemer
      werkloos is geworden en op een of meer dienstbetrekkingen waarvoor eerstgenoemde dienstbetrekking in de plaats is
      gekomen, en voor zover deze niet reeds eerder heeft geleid tot het ontstaan van een recht op uitkering op grond van
      dit hoofdstuk of op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: 17a.3
    text: |-
      Bij algemene maatregel van bestuur kan voor bepaalde groepen werknemers het in [artikel 17][ref1] bedoelde
      aantal van 36 weken hoger worden vastgesteld en het in dat onderdeel bedoelde aantal van 26 weken lager worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 17a.4
    text: |-
      Bij ministeriële regeling kunnen, zo nodig in afwijking van het tweede lid, regels worden gesteld omtrent de
      berekening van het in [artikel 17][ref1] bedoelde aantal van 26 weken. Deze regels hebben betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 17a.4.a
    text: |-
      de gelijkstelling van weken waarin geen arbeid is verricht in de dienstbetrekking waaruit de werknemer werkloos is
      geworden met weken als bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
  - number: 17a.4.b
    text: het meer keren in aanmerking nemen van weken waarin arbeid is verricht.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17a
  - number: 17b.1
    text: |-
      Indien in de kalenderweek na het ontstaan van een recht op uitkering ter zake van gedeeltelijke werkloosheid uit
      een dienstbetrekking, een nieuw recht op uitkering ontstaat ter zake van toegenomen werkloosheid uit dezelfde
      dienstbetrekking, of een dienstbetrekking die voor eerstgenoemde dienstbetrekking in de plaats is gekomen, worden
      beide rechten samengevoegd tot een recht.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17b
  - number: 17b.2
    text: |-
      Het eerste lid vindt geen toepassing met betrekking tot een recht dat reeds door samenvoeging van rechten is
      ontstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel17b
  - number: '18.1'
    text: |-
      De werknemer, die werkloos is uitsluitend als gevolg van vorst, sneeuwval, hoog water of andere buitengewone
      natuurlijke omstandigheden heeft recht op uitkering voor de duur van de buitengewone natuurlijke omstandigheden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel18
  - number: '18.2'
    text: |-
      De [artikelen 17][ref1] en [42, tweede lid][ref2], zijn niet van toepassing op de in het eerste lid bedoelde
      werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: '19.1'
    text: 'Geen recht op uitkering heeft de werknemer die:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.1.a
    text: |-
      een uitkering ontvangt op grond van de [Ziektewet][ref1] of een uitkering die naar aard en strekking daarmee
      overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 19.1.b
    text: |-
      een arbeidsongeschiktheidsuitkering dan wel een loongerelateerde uitkering van de werkhervattingsuitkering
      gedeeltelijk arbeidsgeschikten ontvangt op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 19.1.c
    text: |-
      een uitkering ontvangt op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], berekend naar een
      arbeidsongeschiktheid van ten minste 80%, of een uitkering ontvangt die naar aard en strekking met die uitkering
      overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 19.1.d
    text: |-
      een uitkering ontvangt op grond van [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1],
      berekend naar een arbeidsongeschiktheid van ten minste 80%, of een toelage op grond van dat hoofdstuk, die, al
      dan niet vermeerderd met de arbeidsongeschiktheidsuitkering, 70% of meer bedraagt van het dagloon waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: 19.1.e
    text: |-
      vakantiebonnen of daarmee overeenkomende aanspraken, bestemd voor bij of krachtens collectieve arbeidsovereenkomst
      aangewezen feestdagen en verplichte snipperdagen, heeft verkregen, over die dagen, tenzij deze vakantiebonnen
      of daarmee overeenkomende aanspraken zijn verstrekt als een deel van een uitkering op grond van dit hoofdstuk,
      dan wel naast een uitkering op grond van de [Ziektewet][ref1], indien de ziekengeldverzekering is ontleend aan
      [artikel 7 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 19.1.f
    text: buiten Nederland woont of verblijf houdt anders dan wegens vakantie;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.1.g
    text: |-
      niet rechtmatig in Nederland verblijf houdt als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 19.1.h
    text: rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.1.i
    text: de eerste dag van de maand waarin hij 65 jaar wordt heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.1.j
    text: |-
      op grond van [artikel 64 van de Wet financiering sociale verzekeringen][ref1] een ontheffing wegens gemoedsbezwaren
      heeft of wiens werkloosheid binnen 3 maanden na de datum van intrekking van een zodanige ontheffing is aangevangen;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: 19.1.k
    text: vakantie geniet;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.1.l
    text: |-
      werkloos is ten gevolge van werkstaking of uitsluiting, tenzij voor de werknemer een ontheffing is verleend op
      grond van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 19.1.m
    text: |-
      een uitkering ontvangt op grond van de [Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '19.2'
    text: |-
      Indien een uitkering als bedoeld in het eerste lid, onderdeel *a*, *b*, *c* of *d* niet wordt betaald wegens voor
      de werknemer geldende wachtdagen of wegens enig handelen of nalaten dat hem redelijkerwijs kan worden verweten,
      wordt het niet betalen daarvan voor de toepassing van het eerste lid gelijkgesteld met het ontvangen van die
      uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: '19.3'
    text: 'Geen recht op uitkering heeft de werknemer over een dag waarop zijn arbeid wordt onderbroken uitsluitend doordat:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.3.a
    text: deze dag voor hem als rustdag geldt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.3.b
    text: |-
      deze dag een nationale of algemeen erkende christelijke feestdag is, dan wel een kerkelijke feestdag, die ter
      plaatse waar de werknemer pleegt te werken, algemeen als zodanig wordt gevierd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: '19.4'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de werknemer die uitsluitend uit hoofde van een andere
      dienstbetrekking dan de dienstbetrekking waaruit hij werkloos is geworden in een omstandigheid verkeert als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: '19.5'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.5.a
    text: met betrekking tot het begrip vakantie genieten, bedoeld in het eerste lid, onderdeel k;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.5.b
    text: |-
      met betrekking tot de vaststelling van de periode gedurende welke de werknemer, in afwijking van het eerste lid,
      onderdeel k, met behoud van zijn recht op uitkering vakantie kan genieten;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.5.c
    text: |-
      met betrekking tot het buiten aanmerking laten van vakantiebonnen en daarmee overeenkomende aanspraken, bedoeld in
      het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: '19.6'
    text: |-
      Onze Minister is bevoegd voor gevallen waarin toepassing van het eerste lid, onderdeel *a* tot en met *h*, tot
      onbillijkheden zou kunnen leiden, regels te stellen op grond waarvan kan worden afgeweken van het bepaalde in die
      onderdelen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: '19.7'
    text: |-
      Het eerste lid, onderdeel h, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden, of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '19.9'
    text: 'Het eerste lid, onderdeel b, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.9.a
    text: |-
      de werknemer, bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 19.9.b
    text: |-
      de werknemer wiens werkloosheid uitsluitend het gevolg is van verkorting van de werktijd waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend, en


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 19.9.c
    text: |-
      de werknemer wiens werkloosheid is ontstaan na het ontstaan van het recht op de loongerelateerde
      uitkering van de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten op grond van de
      [Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: '19.10'
    text: |-
      In afwijking van het eerste lid, onderdeel f, blijft het recht op uitkering bestaan ten aanzien van de werknemer
      die buiten Nederland verblijf houdt anders dan wegens vakantie, indien hij gedurende dat verblijf meewerkt aan
      activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid als bedoeld in de [hoofdstukken VI][ref1] en
      [XA][ref2], mits:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukXA
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: XA
  - number: 19.10.a
    text: die activiteiten niet langer duren dan zes maanden;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.10.b
    text: |-
      die activiteiten blijkens een intentieverklaring een reëel uitzicht bieden op een aansluitende dienstbetrekking
      voor ten minste zes maanden;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.10.c
    text: |-
      die activiteiten plaatsvinden in een lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
  - number: 19.10.d
    text: |-
      het bedrag dat het Uitvoeringsinstituut werknemersverzekeringen is verschuldigd terzake van die activiteiten niet
      hoger is dan het op grond van [artikel 4.2, derde lid, van het Besluit SUWI][ref1] vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
  - number: '19.11'
    text: |-
      Voor de toepassing van dit artikel wordt onder intentieverklaring verstaan: een ondertekende verklaring waarin de
      ondertekenaar aangeeft dat hij het voornemen heeft om een werknemer die meewerkt aan activiteiten die bevorderlijk
      zijn voor zijn inschakeling in de arbeid als bedoeld in de [hoofdstukken VI][ref1] en [XA][ref2], na afloop van die
      activiteiten in dienst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukXA
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: XA
  - number: '20.1'
    text: 'Het recht op uitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.1.a
    text: voor zover de werknemer zijn hoedanigheid van werknemer verliest;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.1.b
    text: voor zover de werknemer niet langer werkloos is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.1.c
    text: |-
      indien ter zake van na het ontstaan van het recht verrichte arbeid een nieuw recht op uitkering is ontstaan, voor
      zover het aantal arbeidsuren waarnaar beide rechten samen zijn berekend, vermeerderd met het resterend aantal
      arbeidsuren per kalenderweek, groter is dan het aantal arbeidsuren, bedoeld in [artikel 16][ref1], voorafgaande aan
      het intreden van het verlies van arbeidsuren waarnaar het eerstgenoemde recht is berekend;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.1.d
    text: |-
      zodra de werknemer geen recht op uitkering heeft op grond van [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.1.e
    text: zodra de voor de werknemer geldende uitkeringsduur is verstreken.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: '20.2'
    text: |-
      Voor de werknemer op wie het eerste lid, onderdeel *a*, van toepassing is eindigt het recht op uitkering terzake
      van het aantal uren dat hij werkzaamheden verricht uit hoofde waarvan hij niet als werknemer in de zin van deze wet
      wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: '20.3'
    text: |-
      Voor de werknemer op wie het eerste lid, onderdeel b, van toepassing is, eindigt het recht op uitkering ter zake
      van het aantal arbeidsuren dat hij arbeid als werknemer verricht dan wel ter zake van het aantal arbeidsuren dat
      hij minder beschikbaar is voor arbeid dan het aantal arbeidsuren dat hij heeft verloren.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: '20.4'
    text: 'Zo nodig in afwijking van het derde lid eindigt het recht op uitkering geheel indien de werknemer:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.4.a
    text: |-
      al dan niet opeenvolgend een zodanig aantal uren arbeid als werknemer verricht dat een verlies aan arbeidsuren
      resteert van minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in [artikel 16][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: 20.4.b
    text: |-
      beschikbaar is voor arbeid voor minder dan vijf en minder dan de helft van zijn arbeidsuren, bedoeld in
      [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: '20.5'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.5.a
    text: |-
      de berekening van het aantal arbeidsuren, bedoeld in het derde en vierde lid, ter zake waarvan het recht op
      uitkering eindigt. Deze regels hebben betrekking op:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.5.a.1°
    text: |-
      het buiten beschouwing laten van uren waarin arbeid wordt verricht en de gelijkstelling van uren waarin geen arbeid
      is verricht met uren waarin arbeid wordt verricht;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.5.a.2°
    text: de berekening van het aantal arbeidsuren met betrekking tot wisselende arbeidspatronen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: 20.5.b
    text: |-
      het geheel of gedeeltelijk eindigen van een recht op uitkering bij samenloop van uitkeringen op grond van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel20
  - number: '21.1'
    text: |-
      Indien het recht op uitkering op grond van [artikel 20, eerste lid, onderdeel a, b, c of d][ref1], geheel of
      gedeeltelijk is geëindigd en vervolgens de omstandigheid die tot dat eindigen heeft geleid heeft opgehouden te
      bestaan, herleeft het recht op uitkering met inachtneming van het tweede lid, de in [artikel 8][ref2] en het derde
      lid genoemde termijnen en de op grond van het vierde lid gestelde regels, voor zover geen nieuw recht op uitkering
      ingevolge dit hoofdstuk bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '21.2'
    text: 'In afwijking van het eerste lid herleeft een recht dat geheel geëindigd is niet, indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: 21.2.a
    text: het recht op uitkering dat zou herleven een omvang zou hebben van minder dan één arbeidsuur per kalenderweek;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: 21.2.b
    text: |-
      een nieuw recht op uitkering ingevolge dit hoofdstuk is ontstaan uit een volledige dienstbetrekking en het verschil
      tussen het geëindigde recht en het nieuwe recht minder dan vijf arbeidsuren per kalenderweek bedraagt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: 21.2.c
    text: |-
      na de dag waarop het recht dat zou herleven geheel geëindigd is, een jaar is verstreken en het recht dat zou
      herleven een omvang zou hebben van minder dan vijf arbeidsuren per kalenderweek;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: 21.2.d
    text: |-
      [artikel 59, derde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel59
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '59'
  - number: '21.3'
    text: 'Een recht op uitkering dat geheel of gedeeltelijk is geëindigd:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: 21.3.a
    text: |-
      wegens een omstandigheid als bedoeld in [artikel 19, eerste lid, onderdeel f, h of k][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 21.3.b
    text: |-
      op grond van [artikel 20, eerste lid, onderdeel b][ref1], als gevolg van het niet kunnen voldoen aan de
      voorwaarde bedoeld in [artikel 16, eerste lid, onderdeel b][ref2], wegens andere omstandigheden dan ziekte of
      arbeidsongeschiktheid of het volgen van scholing of opleiding, terzake waarvan de werknemer een uitkering ontvangt
      als bedoeld in [artikel 19, eerste lid, onderdelen a, b, c of d][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: 21.3.c
    text: |-
      wegens een combinatie van de hier bedoelde omstandigheden, kan, ook indien deze omstandigheden zich aaneensluitend
      voordoen, slechts herleven indien de periode tussen de eindiging van het recht en het vervallen van de
      omstandigheid of omstandigheden als hier bedoeld niet langer is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: '21.4'
    text: |-
      Bij ministeriële regeling kan worden geregeld dat het derde lid buiten toepassing blijft voor categorieën van
      werknemers.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel21
  - number: '22.1'
    text: Het UWV stelt op aanvraag vast of recht op uitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
  - number: '22.2'
    text: |-
      Een aanvraag is gericht tot het UWV en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ingediend bij de CWI. Na de overdracht van de aanvraag door de CWI aan het UWV ingevolge
      [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag verder
      behandeld door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
  - number: '22.3'
    text: |-
      Op de toekenning en de beëindiging van een uitkering als bedoeld in [artikel 18][ref1]
      of van een uitkering die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] zijn de [artikelen 3:40][ref3]
      en [3:45 van de Algemene wet bestuursrecht][ref4] niet van toepassing, indien redelijkerwijs mag worden aangenomen
      dat aan de bekendmaking van de beschikking geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '22.4'
    text: |-
      Verzoekt de belanghebbende binnen een redelijke termijn echter om bekendmaking van de in het derde lid bedoelde
      beschikking, dan wordt deze zo spoedig mogelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
  - number: '22.5'
    text: |-
      Indien het een aanvraag betreft tot toekenning van een uitkering op grond van [artikel 18][ref1] of
      [artikel 61][ref2] dan wel van uitkering die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3], wordt, in afwijking van het
      tweede lid, de aanvraag ingediend bij het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '22.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat categorieën van aanvragen om uitkering,
      in afwijking van het tweede lid en [artikel 26, eerste lid, onderdeel b][ref1], bij het UWV in plaats van de CWI
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: 22a.1
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van uitkering en terzake van weigering van uitkering, herziet het UWV een dergelijk besluit of trekt het dat in:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22a
  - number: 22a.1.a
    text: |-
      indien het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 24][ref1], [25][ref2] of
      [26][ref3] heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: 22a.1.b
    text: indien anderszins de uitkering ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22a
  - number: 22a.1.c
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 25][ref1] ertoe leidt dat niet
      kan worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: 22a.2
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel22a
  - number: '23.1'
    text: |-
      De intrekking of verlaging van een uitkering, die voortvloeit uit het door de werkgever ingesteld bezwaar of
      beroep, vindt niet eerder plaats dan de dag volgend op die waarop de beslissing op bezwaar is bekendgemaakt of de
      uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing in geval van intrekking van het bezwaar of
      beroep omdat het UWV geheel of gedeeltelijk is tegemoet gekomen aan het bezwaar of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel23
  - number: '23.2'
    text: |-
      Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de werknemer ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel23
  - number: '24.1'
    text: 'De werknemer voorkomt dat hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.a
    text: verwijtbaar werkloos wordt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.b
    text: 'werkloos is of blijft, doordat hij:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.b.1°
    text: in onvoldoende mate tracht passende arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.b.2°
    text: nalaat aangeboden passende arbeid te aanvaarden of door eigen toedoen geen passende arbeid verkrijgt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.b.3°
    text: door eigen toedoen geen passende arbeid behoudt; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.1.b.4°
    text: |-
      in verband met door hem te verrichten arbeid eisen stelt die het aanvaarden of verkrijgen van passende arbeid
      belemmeren.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.2'
    text: 'De werknemer is verwijtbaar werkloos geworden indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: 24.2.a
    text: |-
      aan de werkloosheid een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref1] en de werknemer terzake een verwijt kan worden gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 24.2.b
    text: |-
      de dienstbetrekking is beëindigd door of op verzoek van de werknemer zonder dat aan de voortzetting ervan zodanige
      bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem kon worden gevergd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.3'
    text: |-
      Als passende arbeid, bedoeld in het eerste lid, wordt beschouwd alle arbeid die voor de krachten en bekwaamheden
      van de werknemer is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van
      hem kan worden gevergd. Niet als passende arbeid wordt beschouwd arbeid op grond van een arbeidsovereenkomst als
      bedoeld in [hoofdstuk 2 van de Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
  - number: '24.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent het begrip passende arbeid, bedoeld in het
      eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.5'
    text: |-
      De werknemer is verplicht zich zodanig te gedragen dat hij door zijn doen en laten het Algemeen Werkloosheidsfonds,
      het sectorfonds of het Uitvoeringsfonds voor de overheid niet benadeelt of zou kunnen benadelen. Onder benadeling
      in de zin van dit artikel is niet begrepen een gedraging als bedoeld in [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24.6'
    text: |-
      Het niet voeren van verweer door de werknemer tegen of het instemmen van de werknemer met een beëindiging van de
      dienstbetrekking door of op verzoek van de werkgever leidt niet tot overtreding van de verplichtingen, bedoeld in
      het eerste lid, aanhef en onderdeel a, of het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.7'
    text: |-
      Het tweede en zesde lid zijn van overeenkomstige toepassing met betrekking tot het eerste lid, onderdeel b, onder
      3°.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.8'
    text: |-
      Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdeel *b*, onder 1°, 2° en 4°, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '24.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers in
      individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van het eerste lid,
      onderdeel b, onder 1°, 2° of 4°, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel24
  - number: '25'
    text: |-
      De werknemer is verplicht aan het UWV op zijn verzoek of onverwijld uit eigen beweging alle feiten en
      omstandigheden mede te delen, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het
      recht op uitkering, het geldend maken van het recht op uitkering, de hoogte of de duur van de uitkering, of op het
      bedrag van de uitkering dat aan de werknemer wordt betaald. Deze verplichting geldt niet, voor zover een recht op
      uitkering niet geldend kan worden gemaakt als gevolg van een blijvend gehele weigering.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel25
  - number: '26.1'
    text: 'De werknemer is verplicht:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.a
    text: |-
      uiterlijk de eerste werkdag volgend op de eerste dag van werkloosheid bij de CWI aangifte te doen van zijn
      werkloosheid;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.b
    text: binnen één week na het intreden van zijn werkloosheid bij de CWI een aanvraag om een uitkering in te dienen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.c
    text: de voorschriften op te volgen die het UWV ten behoeve van een doelmatige controle stelt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.d
    text: |-
      zich als werkzoekende bij de CWI te laten registreren en die registratie
      tijdig te doen verlengen, indien hem daartoe het recht toekomt op grond van
      [artikel 25, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '25'
  - number: 26.1.e
    text: |-
      mee te werken aan de activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid, bedoeld in de
      [hoofdstukken VI][ref1] en [XA][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukXA
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: XA
  - number: 26.1.f
    text: |-
      mee te werken aan een scholing of opleiding die noodzakelijk wordt geacht voor zijn
      inschakeling in de arbeid, beschikbaar te zijn voor de voorzieningen, bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1] en mee te werken aan het verkrijgen van
      die voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 26.1.g
    text: |-
      mee te werken aan een voor hem gewenst onderzoek naar zijn arbeidsgeschiktheid door een arts, een psycholoog of een
      beroepskeuze-adviseur;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.h
    text: |-
      te voldoen aan de andere voorwaarden die het UWV op grond van [artikel 101, tweede lid][ref1], stelt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel101
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '101'
        hoofdstuk: VIII
  - number: 26.1.i
    text: |-
      de hem op grond van [hoofdstuk VI][ref1] opgelegde verplichtingen na te komen; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: VI
  - number: 26.1.j
    text: |-
      de voorschriften op te volgen die het UWV stelt in verband met het genieten van vakantie tijdens de duur van de
      uitkering;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: 26.1.k
    text: |-
      mee te werken aan het opstellen van de reïntegratievisie, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], en het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 26.1.l
    text: |-
      te voldoen aan de verplichtingen die zijn opgenomen in de reïntegratievisie, bedoeld in
      [artikel 30a, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], en het
      reïntegratieplan, bedoeld in [artikel 30a, derde lid, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 26.1.m
    text: |-
      indien de belanghebbende die bij deelname aan een reïntegratietraject zijn reïntegratieverplichtingen niet naleeft,
      de reden daarvan niet onmiddellijk aan het reïntegratiebedrijf heeft medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: '26.2'
    text: |-
      Het UWV is bevoegd regels te stellen met betrekking tot het tijdstip van registratie, bedoeld in het eerste lid,
      onderdeel d.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister is bevoegd regels te stellen waarbij bepaalde groepen werknemers worden vrijgesteld van
      verplichtingen, hun op grond van het eerste lid, onderdelen d, f of g, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: '26.4'
    text: |-
      Indien het een aangifte van werkloosheid betreft als bedoeld in [artikel 18][ref1] of [artikel 61][ref2]
      dan wel aangifte van werkloosheid die verband houdt met een verleende ontheffing op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref3], wordt, in afwijking van het
      eerste lid, onderdeel a, de aangifte gedaan bij het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '8'
  - number: '26.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat categorieën van aangiften van werkloosheid,
      in afwijking van het eerste lid, onderdeel a, bij het UWV in plaats van de CWI worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: '26.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers in
      individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van het eerste lid,
      onderdelen d, f of g, opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel26
  - number: '27.1'
    text: |-
      Indien de werknemer een verplichting, hem op grond van
      [artikel 24, eerste lid, onderdeel a, of onderdeel b, onder 3°][ref1] opgelegd, niet is nagekomen, weigert het UWV
      de uitkering blijvend geheel, tenzij het niet nakomen van de verplichting de werknemer niet in overwegende mate kan
      worden verweten. In dat geval weigert het UWV de uitkering gedeeltelijk door het uitkeringspercentage te verlagen
      naar 35 over de volledige duur van de uitkering, maar ten hoogste over een periode van 26 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.2'
    text: |-
      Indien de werknemer een verplichting, hem op grond van [artikel 24, eerste lid, onderdeel b, onder 2°][ref1],
      opgelegd, niet is nagekomen, weigert het UWV de uitkering blijvend over het aantal uren waarover het recht op
      uitkering zou zijn geëindigd of niet zou zijn ontstaan indien de werknemer de betreffende arbeid zou hebben
      aanvaard of verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.3'
    text: |-
      Indien de werknemer een verplichting, hem op grond van de
      [artikelen 24, eerste lid, onderdeel b, onder 1° of 4°][ref1], of vijfde lid, of [26][ref2],
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] of
      [artikel 28, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref4] opgelegd, niet of niet behoorlijk
      is nagekomen, dan wel de verplichting, bedoeld in [artikel 25][ref5] of de [artikelen 28, tweede lid][ref6], en
      [29, eerste lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7], niet binnen de door het UWV,
      onderscheidenlijk de CWI daarvoor vastgestelde termijn is nagekomen, weigert het UWV, de uitkering tijdelijk of
      blijvend, geheel of gedeeltelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref7]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref7
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '27.4'
    text: |-
      Een maatregel als bedoeld in het derde lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      werknemer de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval afgezien, indien
      elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
  - number: '27.5'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in
      [artikel 25][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van uitkering, of indien de werknemer zich niet houdt aan de
      voorschriften, bedoeld in [artikel 26, eerste lid, onderdelen a, b of d][ref4], kan het UWV afzien van het opleggen
      van een maatregel als bedoeld in het derde lid en volstaan met het geven van een schriftelijke waarschuwing ter
      zake van het niet tijdig nakomen van de verplichting, of het zich niet houden aan de voorschriften, tenzij het niet
      tijdig nakomen van de verplichting, of het zich niet houden aan de voorschriften, plaatsvindt binnen een periode
      van twee jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.6'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten van het opleggen van een maatregel af te
      zien.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
  - number: '27.7'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 27a][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '27.8'
    text: Het UWV stelt nadere regels met betrekking tot het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27
  - number: 27a.1
    text: |-
      Indien de werknemer een verplichting als bedoeld in
      [artikel 25][ref1] van deze wet of [artikel 28, tweede lid][ref2],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] niet of niet behoorlijk is
      nagekomen, legt het UWV hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 27a.2
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de werknemer de gedraging
      verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
  - number: 27a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen van een verplichting als bedoeld
      in [artikel 25][ref1] van deze wet of [artikel 28, tweede lid][ref2], of
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet heeft geleid tot het
      ten onrechte of tot een te hoog bedrag verlenen van uitkering, kan het UWV afzien van het opleggen van een boete
      als bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet
      of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige
      waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 27a.4
    text: Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten van het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
  - number: 27a.5
    text: |-
      Degene aan wie een boete is opgelegd is verplicht desgevraagd aan het UWV de inlichtingen te verstrekken die voor
      de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
  - number: 27a.6
    text: Voorzover de boete nog niet is geïnd, vervalt zij door het overlijden van degene aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
  - number: 27a.7
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27a
  - number: 27b.1
    text: |-
      Indien het UWV jegens de werknemer een handeling verricht waaraan deze in redelijkheid de gevolgtrekking kan
      verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden opgelegd, is de werknemer niet langer
      verplicht terzake van die gedraging enige verklaring af te leggen, voor zover het betreft de boeteoplegging. De
      werknemer wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27b
  - number: 27b.2
    text: |-
      Indien het UWV voornemens is om aan de werknemer een boete op te leggen, wordt hiervan kennis gegeven aan de
      werknemer onder vermelding van de gronden waarop het voornemen berust. De kennisgeving is een handeling als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27b
  - number: 27b.3
    text: |-
      Op verzoek van de werknemer die de in het vorige lid bedoelde kennisgeving wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, draagt het UWV er zoveel mogelijk zorg voor dat de in die kennisgeving
      vermelde gronden aan de werknemer worden medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27b
  - number: 27b.4
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het UWV de werknemer in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 27b.5
    text: |-
      Indien de werknemer zijn zienswijze mondeling naar voren brengt, draagt het UWV er op verzoek van de werknemer
      die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de werknemer kan bijstaan,
      tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27b
  - number: 27c.1
    text: |-
      Het besluit waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop het besluit bij gebreke van tijdige betaling, overeenkomstig [artikel 27g][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27g
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27g
        hoofdstuk: II
        paragraaf: '2'
  - number: 27c.2
    text: |-
      Op verzoek van de werknemer die het in het eerste lid bedoelde besluit wegens zijn gebrekkige kennis van de
      Nederlandse taal onvoldoende begrijpt, draagt het UWV er zoveel mogelijk zorg voor dat de in dat besluit vermelde
      informatie aan de werknemer wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27c
  - number: 27c.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27c
  - number: 27d.1
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27d
  - number: 27d.2
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de werknemer een
      strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot
      strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 27d.3
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27d
  - number: 27e.1
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het UWV de werknemer overeenkomstig het bepaalde in
      [artikel 27b, vierde lid][ref1], in de gelegenheid heeft gesteld zijn zienswijze naar voren te brengen. Indien
      terzake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een jaar aan op de dag
      na die waarop het openbaar ministerie aan het UWV heeft medegedeeld dat geen strafvervolging wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27b
        hoofdstuk: II
        paragraaf: '2'
  - number: 27e.2
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27e
  - number: 27f
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de werknemer wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 27g.1
    text: |-
      Het besluit waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 27g.2
    text: |-
      Indien degene aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de [Ziektewet][ref1],
      de [Wet werk en inkomen naar arbeidsvermogen][ref2], de [Wet op de arbeidsongeschiktheidsverzekering][ref3],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6]of de [Wet arbeid en zorg][ref7] of een toeslag op grond
      van de [Toeslagenwet][ref8], wordt het besluit waarbij de boete is opgelegd tenuitvoergelegd door verrekening met
      die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0008657
      [ref6]: https://wetten.overheid.nl/BWBR0002822
      [ref7]: https://wetten.overheid.nl/BWBR0013008
      [ref8]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0008657
      - id: ref6
        bwb_id: BWBR0002822
      - id: ref7
        bwb_id: BWBR0013008
      - id: ref8
        bwb_id: BWBR0004043
  - number: 27g.3
    text: |-
      Indien degene aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      [de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de
      [Wet werk en inkomen kunstenaars][ref6], betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken
      gemeente het bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het
      UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0017837
  - number: 27g.4
    text: |-
      Indien degene aan wie een boete is opgelegd geen uitkering als bedoeld in het tweede of derde lid ontvangt, of
      meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het tweede of derde lid niet mogelijk
      is, wordt het besluit waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend en tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 27g.5
    text: |-
      De tenuitvoerlegging van een besluit waarbij een boete is opgelegd vindt plaats met toepassing van het tweede of
      derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
  - number: 27g.6
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
  - number: 27g.7
    text: |-
      Op het executoriaal beslag ingevolge dit artikel door het UWV op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan degene
      aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 27g.8
    text: |-
      De tenuitvoerlegging van een besluit met toepassing van dit artikel geschiedt zodanig dat
      de werknemer blijft beschikken over een inkomen gelijk aan de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 27g.9
    text: |-
      Het achtste lid geldt niet, zolang de werknemer zijn verplichting bedoeld in [artikel 27a, vijfde lid][ref1], niet
      of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27a
        hoofdstuk: II
        paragraaf: '2'
  - number: 27h
    text: |-
      Indien het UWV de werknemer de uitkering op grond van deze wet tijdelijk of blijvend, geheel of gedeeltelijk
      heeft geweigerd dan wel hem een boete heeft opgelegd, stelt het UWV het reïntegratiebedrijf dat ten behoeve
      van die verzekerde werkzaamheden gericht op vergroting van de mogelijkheden tot het verrichten van arbeid of op
      inschakeling in arbeid verricht, van dat besluit in kennis voorzover dat noodzakelijk is voor de uitvoering van de
      werkzaamheden door het reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel27h
  - number: '28'
    text: |-
      Indien het UWV een maatregel als bedoeld in [artikel 27][ref1] heeft opgelegd, zet het in geval van herleving van
      het recht op uitkering als bedoeld in [artikel 21][ref2] een weigering van de uitkering voort.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
  - number: '29'
    text: |-
      Bij een besluit tot herziening van de uitkering wordt mededeling gedaan van de herziening en, in een bijlage, van
      de op die herziening betrekking hebbende gewijzigde rechten en plichten van de werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel29
  - number: '30.1'
    text: |-
      Het UWV betaalt de uitkering zo spoedig mogelijk, doch uiterlijk binnen een maand nadat het het recht op die
      uitkering heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: '30.2'
    text: |-
      Het UWV schort de betaling van de uitkering op of schorst de betaling, indien het op grond van duidelijke
      aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: 30.2.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: 30.2.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: 30.2.c
    text: |-
      de werknemer een verplichting, hem op grond van de [artikelen 24][ref1],
      [25][ref2] of [26][ref3] van deze wet of de [artikelen 28, tweede lid][ref4],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] opgelegd, niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '30.3'
    text: |-
      Indien een reïntegratiebedrijf aan het UWV heeft gemeld dat het gegronde vermoeden bestaat dat een persoon aan wie
      een uitkering op grond van deze wet is toegekend onvoldoende medewerking verleent aan de op hem betrekking hebbende
      werkzaamheden van het reïntegratiebedrijf, neemt het UWV een besluit omtrent de gehele of gedeeltelijke opschorting
      of schorsing van de betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: '30.4'
    text: |-
      Het UWV stelt het reïntegratiebedrijf in kennis van een besluit tot opschorting of schorsing als bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: '30.5'
    text: De uitkering wordt uitbetaald over 5 dagen per week.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel30
  - number: '31.1'
    text: |-
      Het UWV kan een uitkering over een door hem te bepalen tijdvak als voorschot betaalbaar stellen, indien onzekerheid
      bestaat over het recht op of de hoogte van de uitkering of de hoogte van het te betalen bedrag aan uitkering. Een
      verleend voorschot wordt verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende
      tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel31
  - number: '31.2'
    text: |-
      In afwijking van het tweede lid betaalt het UWV geen voorschot over tijdvakken waarin het loon niet wordt
      doorbetaald in verband met een geschil tussen de werknemer en zijn werkgever over het bestaan van ziekte van de
      werknemer.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel31
  - number: '31.3'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot als bedoeld in het eerste lid
      beschouwd als een uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel31
  - number: '32'
    text: |-
      De uitkering die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. Het UWV is bevoegd in bijzondere gevallen ten gunste van de werknemer
      af te wijken van de in de eerste volzin genoemde drie maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel32
  - number: '33.1'
    text: Het UWV betaalt de uitkering in de regel per vier kalenderweken of per maand achteraf.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel33
  - number: '33.2'
    text: |-
      In afwijking van het eerste lid is het UWV bevoegd, op verzoek van de werknemer of uit eigen beweging, de uitkering
      over een kortere periode te betalen, indien de werknemer over die kortere periode loon ontving.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel33
  - number: '33.3'
    text: |-
      In afwijking van het eerste lid betaalt het UWV aan de werknemer die werkloos is ten gevolge van de eindiging
      van zijn dienstbetrekking en in wiens dagloon vakantiebijslag is berekend, een gedeelte van de uitkering als
      vakantiebijslag jaarlijks in de maand mei over de aan die maand voorafgaande 12 maanden, of, indien het recht op
      uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende maand. De vakantiebijslag bedraagt 8/108
      van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel33
  - number: '33.4'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van de teller en het getal boven het honderd in plaats van de noemer van de in
      het derde lid genoemde breuk. Het gewijzigde percentage wordt in aanmerking genomen over de uitkering waarop recht
      bestaat vanaf de dag waarop de wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '33.5'
    text: |-
      Op de toekenning van vakantiebijslag zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '34.1'
    text: 'Op de uitkering worden geheel in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.1.a
    text: inkomsten wegens loonderving;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.1.b
    text: inkomsten wegens ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.1.c
    text: |-
      inkomsten wegens uitkering op grond van het bepaalde bij of krachtens dan wel op de voet van de Algemene
      pensioenwet politieke ambtsdragers.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.2'
    text: |-
      De inkomsten, bedoeld in het eerste lid, dienen betrekking te hebben op de periode waarover de werknemer recht
      heeft op uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.3'
    text: |-
      Indien de werknemer wegens eindiging van een dienstbetrekking ouderdomspensioen ontvangt, wordt, voor zoveel nodig
      in afwijking van het eerste lid, de uitkering per dag niet hoger gesteld dan op het verschil tussen de uitkering
      zoals die is of zou zijn vastgesteld op de eerste werkdag na die eindiging en het bedrag van het pensioen per dag
      dat op die dag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.4'
    text: |-
      Voor de toepassing van het derde lid wordt het dagloon zoals dat is of zou zijn vastgesteld op de eerste dag waarop
      ouderdomspensioen wordt ontvangen, voor zoveel nodig herzien overeenkomstig [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel46
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '46'
        hoofdstuk: II
        paragraaf: '5'
  - number: '34.5'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *a* van dat lid bedoelde inkomsten niet op de uitkering in
      mindering gebracht, indien zij:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.5.a
    text: verband houden met de eindiging van een dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.5.b
    text: ter zake van werkloosheid ten gevolge van een niet geëindigde dienstbetrekking worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.5.c
    text: |-
      bestaan uit een uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4] dan wel uit een uitkering die naar aard en
      strekking daarmee overeenkomt;


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
  - number: 34.5.d
    text: uit hoofde van een tijdens het recht op uitkering vervulde dienstbetrekking worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.6'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *a* en *c* van dat lid bedoelde inkomsten niet op de
      uitkering in mindering gebracht, indien zij:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.6.a
    text: |-
      door de werknemer reeds voor het intreden van de werkloosheid werden ontvangen naast de inkomsten uit de
      dienstbetrekking waaruit hij werkloos is geworden;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34.6.b
    text: |-
      door de werknemer na het intreden van de werkloosheid worden ontvangen en zij betrekking hebben op een andere
      dienstbetrekking dan de dienstbetrekking, waaruit de werkloosheid is ontstaan en die dienstbetrekkingen voor het
      intreden van de werkloosheid naast elkaar werden vervuld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.7'
    text: |-
      In afwijking van het eerste lid worden de in onderdeel *b* van dat lid bedoelde inkomsten niet op de uitkering
      in mindering gebracht, indien zij door de werknemer na het intreden van de werkloosheid worden ontvangen en zij
      betrekking hebben op een andere dienstbetrekking dan de dienstbetrekking, waaruit de werkloosheid is ontstaan en
      die dienstbetrekkingen voor het intreden van de werkloosheid naast elkaar werden vervuld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: '34.8'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *b* wordt onder ouderdomspensioen verstaan een uit een vervulde
      dienstbetrekking voortvloeiende, in beginsel levenslange periodieke uitkering bij wijze van oudedagsvoorziening.
      Onze Minister is bevoegd uitkeringen gelijk te stellen met ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34
  - number: 34a.1
    text: |-
      De uitkering wordt niet betaald over dagen, waarop de werknemer vakantie geniet en over bij of krachtens
      collectieve arbeidsovereenkomst aangewezen feest- en verplichte snipperdagen, en de werknemer vakantiebonnen
      of daarmee overeenkomende aanspraken, bestemd voor die vakantie-, feest- of snipperdagen heeft verkregen,
      mits deze vakantiebonnen of daarmee overeenkomende aanspraken zijn verstrekt als een deel van een uitkering
      op grond van dit hoofdstuk, dan wel naast een uitkering op grond van de [Ziektewet][ref1], indien de
      ziekengeldverzekering is ontleend aan [artikel 7 van die wet][ref2], of naast een uitkering op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3], indien de werknemer gelijkgestelde was
      als bedoeld in [artikel 3:6, eerste lid, onderdeel b, van die wet][ref4] op grond van een ziekengeldverzekering die
      is ontleend aan [artikel 7 van de Ziektewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0001888
        artikel: '7'
  - number: 34a.2
    text: |-
      [Artikel 19, vijfde lid][ref1], is van overeenkomstige toepassing met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '35'
    text: |-
      De uitkering wordt niet betaald over perioden gelegen voor 26 weken voorafgaand aan de dag waarop de aanvraag om
      een uitkering werd ingediend. Het UWV is bevoegd in bijzondere gevallen af te wijken van de eerste zin.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35
  - number: 35a
    text: |-
      Indien de werknemer deelneemt aan een voor hem naar het oordeel van het UWV noodzakelijke opleiding of scholing en
      het recht op uitkering op grond van [artikel 76][ref1] blijft bestaan, worden op de uitkering geheel in mindering
      gebracht de inkomsten uit of in verband met de opleiding of scholing voor zover zij meer bedragen dan een nader
      door Onze Minister vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
  - number: 35aa.1
    text: |-
      Indien de werknemer toestemming heeft verkregen van het UWV om werkzaamheden als bedoeld in [artikel 77a][ref1],
      eerste lid, te verrichten en het recht op uitkering op grond van het [tweede lid van dat artikel][ref2] blijft
      bestaan, wordt de uitkering verminderd met 70% van de inkomsten uit of in verband met die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35aa
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 77a
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 77a
        hoofdstuk: VI
  - number: 35aa.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inkomsten,
      bedoeld in het eerste lid, de berekening daarvan en de periode waaraan deze worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35aa
  - number: 35b.1
    text: |-
      Indien de werknemer meer dan één recht op uitkering heeft, wordt, indien tenminste één van die rechten ontstaan
      is uit hoofde van een dienstbetrekking als overheidswerknemer, voor de toepassing van de [artikelen 34][ref1],
      [35a][ref2] en [35aa][ref3] een volgorde in aanmerking genomen bij de vermindering van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35aa
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '34'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 35a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 35aa
        hoofdstuk: II
        paragraaf: '3'
  - number: 35b.2
    text: |-
      Bij de toepassing van het eerste lid worden de inkomsten bij voorrang in mindering gebracht op de uitkering waarmee
      zij de meeste samenhang hebben.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: 35b.3
    text: 'Een samenhang als bedoeld in het tweede lid wordt vastgesteld aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: 35b.3.a
    text: |-
      de dienstbetrekkingen uit hoofde waarvan de werknemer recht op uitkering op grond van deze wet heeft en die waaruit
      of in verband waarmee de inkomsten worden ontvangen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: 35b.3.b
    text: |-
      de bedrijfstak of bedrijfstakken waarin de werknemer werkzaam was en die waaruit of in verband waarmee de inkomsten
      worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: 35b.4
    text: |-
      Indien geen samenhang kan worden vastgesteld, worden de inkomsten gelijkelijk in mindering gebracht op de
      verschillende uitkeringen. Indien bij de toepassing van de eerste zin een uitkering lager is dan het daarop in
      mindering te brengen bedrag, wordt hetgeen aldus niet in mindering kan worden gebracht in gelijke mate in mindering
      gebracht op de andere uitkeringen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: 35b.5
    text: Het UWV kan nadere regels stellen met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel35b
  - number: '36.1'
    text: |-
      De uitkering die als gevolg van een besluit als bedoeld in [artikel 22a][ref1] of [27][ref2] onverschuldigd is
      betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het UWV teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 22a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '27'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36.2'
    text: |-
      In afwijking van het eerste lid kan het UWV besluiten van terugvordering of van verdere terugvordering af te zien,
      indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: '36.3'
    text: 'De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36.3.a
    text: |-
      het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de [artikelen 475c][ref1]
      en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 36.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel25
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '25'
        hoofdstuk: II
        paragraaf: '2'
  - number: '36.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van terugvordering af
      te zien.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: '36.5'
    text: |-
      Het besluit tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat het besluit bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 36a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 36a
        hoofdstuk: II
        paragraaf: '3'
  - number: '36.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het UWV de inlichtingen te verstrekken die voor de
      terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: '36.7'
    text: |-
      In afwijking van het eerste lid kan het UWV, onder voorwaarden die Onze Minister kan stellen, besluiten van
      terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen bedrag niet te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36
  - number: 36a.1
    text: |-
      Het besluit tot terugvordering levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 36a.2
    text: |-
      [Artikel 27g][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld inkomen
      van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de artikelen [475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het UWV de aflossingsbedragen
      lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27g
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 27g
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 36b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de [artikelen 36][ref1] en [36a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel36a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 36a
        hoofdstuk: II
        paragraaf: '3'
  - number: '37'
    text: |-
      Ingeval het UWV een aan een overheidswerknemer toegekende uitkering op grond van deze
      wet, de [Ziektewet][ref1], de [Wet op de arbeidsongeschiktheidsverzekering][ref2] of
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref3], dan wel een toeslag op grond van de
      [Toeslagenwet][ref4] betaalt aan een overheidswerkgever met het oogmerk die uitkering of toeslag door diens
      tussenkomst te doen uitbetalen:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref4]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0004043
  - number: 37.a
    text: |-
      wordt de bedoelde uitkering of toeslag niet vermeerderd met de daarover door de werkgever verschuldigde premie
      op grond van [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref1] en wordt die uitkering
      of toeslag verminderd met het door de overheidswerknemer of gewezen overheidswerknemer verschuldigde deel van de
      premie op grond van dat lid;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 37.b
    text: |-
      treedt, in afwijking van [artikel 11, tweede lid][ref1],
      [artikel 10, derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2], en
      [artikel 11, derde lid, van de Ziektewet][ref3], voorzover die artikelleden betrekking hebben op de premie bedoeld
      in [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref4], de overheidswerkgever niet in de
      plaats van het UWV;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '11'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 37.c
    text: |-
      wordt voor de inhouding, bedoeld in [artikel 32, eerste lid, van de Wet financiering sociale verzekeringen][ref1]
      onder loon niet verstaan de bedoelde uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel32
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '32'
  - number: '38.1'
    text: |-
      Voor het in ontvangst nemen en het verlenen van kwijting voor de betaling van de uitkering, wordt een minderjarige
      met een meerderjarige gelijk gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel38
  - number: '38.2'
    text: |-
      Indien de wettelijke vertegenwoordiger van de minderjarige zich schriftelijk bij het UWV verzet tegen betaling aan
      de minderjarige wordt de uitkering aan de wettelijke vertegenwoordiger betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel38
  - number: '39.1'
    text: |-
      Indien degene aan wie een uitkering is toegekend, aanspraak heeft op verstrekking of vergoeding van zorg als
      bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van [die wet][ref2] een bijdrage voor die
      zorg verschuldigd is, is het UWV bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan degene,
      aan wie de uitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor zorgverzekeringen,
      genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '39.2'
    text: |-
      Indien degene, aan wie een uitkering is toegekend, in een inrichting ter verpleging van geesteszieken of van
      zwakzinnigen is opgenomen en het UWV, van de desbetreffende inrichting of van het college van burgemeester en
      wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de uitkering aan die inrichting
      of die gemeente uit te betalen, is het UWV bevoegd dat verzoek zonder het stellen van andere voorwaarden in te
      willigen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel39
  - number: '39.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het gedeelte
      van de uitkering, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel39
  - number: '39.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '40.1'
    text: De uitkering is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel40
  - number: '40.2'
    text: |-
      Een machtiging tot het in ontvangst nemen van de uitkering, onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel40
  - number: '40.3'
    text: Elk beding, strijdig met het eerste of tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel40
  - number: '41'
    text: |-
      De uitkering wordt niet betaald indien deze per week doorgaans minder bedraagt dan een achtste deel van het
      minimumloon.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel41
  - number: '42.1'
    text: De uitkeringsduur is drie maanden, te rekenen vanaf de eerste dag waarop het recht op uitkering is ontstaan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: '42.2'
    text: 'Indien de werknemer:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: 42.2.a
    text: |-
      aantoont in de periode van vijf kalenderjaren onmiddellijk voorafgaande aan het kalenderjaar waarin zijn eerste
      werkloosheidsdag is gelegen, in tenminste vier kalenderjaren over 52 of meer dagen per kalenderjaar loon te hebben
      ontvangen; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: 42.2.b
    text: |-
      onmiddellijk voorafgaande aan of op zijn eerste dag van werkloosheid recht heeft op een uitkering op grond van een
      wet als genoemd in [artikel 19, eerste lid, onderdeel b, c, of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '42.3'
    text: |-
      Bij het vaststellen van de uitkeringsduur op grond van het eerste en tweede lid blijven perioden waarin recht op
      uitkering bestaat op grond van [artikel 18, eerste lid][ref1], buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: '42.4'
    text: 'Het arbeidsverleden, bedoeld in het tweede lid, wordt berekend door samentelling van:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: 42.4.a
    text: |-
      het aantal kalenderjaren, vanaf en met inbegrip van 1998 tot en met het kalenderjaar onmiddellijk voorafgaande aan
      het kalenderjaar waarin zijn eerste werkloosheidsdag is gelegen, waarover de werknemer over 52 of meer dagen loon
      heeft ontvangen; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: 42.4.b
    text: |-
      het aantal kalenderjaren vanaf en met inbegrip van het kalenderjaar waarin de werknemer zijn 18e verjaardag
      bereikte tot 1998.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
  - number: '42.5'
    text: |-
      Een kalenderjaar wordt in aanmerking genomen bij de berekening, bedoeld in
      het vierde lid, onderdeel a, indien volgens een beschikking als bedoeld in
      [artikel 83i van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de werknemer in dat kalenderjaar
      over 52 of meer dagen loon heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83i
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83i
  - number: '42.6'
    text: |-
      Voor de toepassing van het vierde lid, onderdeel a, wordt, indien over een kalenderjaar een beschikking als
      bedoeld in [artikel 83i van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] niet is afgegeven,
      dat kalenderjaar in aanmerking genomen indien de werknemer aantoont daarin over 52 of meer dagen loon te hebben
      ontvangen. [Artikel 42a][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83i
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83i
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 42a
        hoofdstuk: II
        paragraaf: '4'
  - number: 42a.1
    text: |-
      Voor de toepassing van [artikel 42, tweede lid, onderdeel a][ref1], worden met dagen waarover loon is ontvangen,
      gelijkgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42a.1.a
    text: |-
      dagen waarover recht bestond op een uitkering die naar aard en strekking overeenkomt met een uitkering
      op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1] of met een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] voorzover de uitkering wordt toegekend naar een
      arbeidsongeschiktheid van ten minste 80% respectievelijk wordt toegekend over periodes waarin de persoon
      slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen, bedoeld in
      [artikel 1 van eerstgenoemde wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 42a.1.b
    text: |-
      dagen waarover een persoon een uitkering ontvangt op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1], berekend naar een
      arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al dan niet
      vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: 42a.2
    text: |-
      Voor de toepassing van [artikel 42, tweede lid, onderdeel a][ref1], worden niet reeds in
      aanmerking genomen kalenderjaren waarin een persoon recht heeft op kinderbijslag op grond van
      [artikel 7 van de Algemene Kinderbijslagwet][ref2] of een andere gezinsbijslag als bedoeld in artikel 4, eerste
      lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van de Raad van de Europese Gemeenschap van
      14 juni 1971 betreffende de toepassing van socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op
      hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149) voor een tot zijn huishouden behorend kind
      dat bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, voor de helft gelijkgesteld
      met kalenderjaren waarin over 52 of meer dagen loon is ontvangen. De in de eerste zin bedoelde persoon wordt
      aangemerkt als verzorgend persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 42a.3
    text: |-
      Het tweede lid vindt geen toepassing indien de verzorgende persoon in een kalenderjaar voor een periode langer dan
      een half jaar als werknemer in de zin van een wettelijke regeling inzake werkloosheid recht heeft op een uitkering
      ter zake van werkloosheid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.4
    text: 'Voor de toepassing van het tweede lid wordt onder:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.4.a
    text: een kind verstaan een eigen, aangehuwd of pleegkind;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.4.b
    text: een pleegkind verstaan een kind dat als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.5
    text: |-
      Voor de toepassing van [artikel 42, tweede lid, onderdeel a][ref1], worden dagen, tot een maximum van achttien
      maanden, waarover de werknemer onbetaald verlof heeft genoten, gelijkgesteld met dagen, waarover loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42a.6
    text: |-
      Voor de toepassing van dit artikel en van [artikel 42, tweede lid, onderdeel a][ref1], wordt niet als loon
      beschouwd een uitkering:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42a.6.a
    text: |-
      op grond van deze wet, met uitzondering van een uitkering op grond van [hoofdstuk IV][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 42a.6.b
    text: |-
      op grond van [hoofdstuk 7 van de Wet werk en inkomen naar arbeidsvermogen][ref1], met uitzondering van een
      uitkering aan de persoon die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen,
      bedoeld in [artikel 1 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel1
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '1'
  - number: 42a.6.c
    text: |-
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], berekend naar een arbeidsongeschiktheid van
      minder dan 80%; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 42a.6.d
    text: die naar aard en strekking overeenkomt met een uitkering als bedoeld in onderdeel a, b of c.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.7
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
  - number: 42a.7.a
    text: |-
      ter vaststelling van het aantal dagen waarover loon is ontvangen, bedoeld in
      [artikel 42, tweede lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42a.7.b
    text: |-
      op grond waarvan voor het bepalen van het aantal van 52 dagen, bedoeld in
      [artikel 42, tweede lid, onderdeel a][ref1], dagen waarover, anders dan bedoeld in het vijfde lid, geen loon is
      ontvangen, worden gelijkgesteld met dagen waarover loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42b.1
    text: |-
      Indien het recht op uitkering geheel of gedeeltelijk is geëindigd en vervolgens een nieuw recht op uitkering
      is ontstaan, zonder dat aan de voorwaarde, bedoeld in [artikel 42, tweede lid][ref1], wordt voldaan, wordt met
      inachtneming van het tweede lid, de duur van dat nieuwe recht verlengd met de duur van de verlengde uitkering,
      bedoeld in [artikel 42, tweede lid][ref2], van het eerdere recht voorzover de werknemer hierover geen uitkering
      heeft ontvangen als gevolg van de eindiging van dat eerdere recht.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: 42b.2
    text: |-
      Het eerste lid vindt geen toepassing voorzover het eerdere recht geheel of gedeeltelijk was geëindigd op grond van
      [artikel 20, eerste lid, onderdeel a, b, c of d][ref1], en op grond van [artikel 21][ref2] niet voor herleving in
      aanmerking zou zijn gekomen wegens het overschrijden van de in laatstgenoemd artikel bedoelde termijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel21
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
  - number: '43.1'
    text: |-
      Telkens nadat het recht op uitkering na gehele eindiging van dat recht is herleefd op grond van
      [artikel 21][ref1], eindigt de uitkering met inachtneming van het tweede en derde lid, zoveel later dan de in
      [artikel 42, eerste en tweede lid][ref2], genoemde periode als de periode tussen de eindiging en herleving van het
      recht op uitkering heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '21'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
  - number: '43.2'
    text: |-
      Voor de vaststelling van de periode tussen de eindiging en de herleving van het recht op uitkering worden, telkens
      nadat het recht op uitkering geheel is geëindigd wegens ziekte, de eerste drie maanden waarin de werknemer een
      uitkering ontvangt als bedoeld in [artikel 19, eerste lid, onderdeel a][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '43.3'
    text: |-
      Voor de bepaling van de periode van drie maanden bedoeld in het tweede lid, worden perioden waarover de in
      [artikel 19, eerste lid, onderdeel a][ref1], bedoelde uitkeringen worden ontvangen samengeteld, indien zij elkaar
      met een onderbreking van minder dan vier weken opvolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '43.4'
    text: |-
      [ Artikel 19, tweede lid][ref1], is van toepassing op het tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel19
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '19'
        hoofdstuk: II
        paragraaf: '1'
  - number: '44'
    text: De uitkering op grond van dit hoofdstuk wordt berekend naar het dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel44
  - number: '45.1'
    text: |-
      Voor de berekening van de uitkering waarop op grond van dit hoofdstuk recht bestaat wordt als dagloon
      beschouwd 1/261 deel van het loon dat de werknemer in de periode van één jaar, die eindigt op de laatste
      dag van het aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin het arbeidsurenverlies, bedoeld
      in [artikel 16, eerste lid][ref1], is ingetreden, verdiende, doch ten hoogste het bedrag, bedoeld in
      [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref2], met betrekking tot een loontijdvak
      van een dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '45.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de vaststelling van het dagloon, bedoeld in
      het eerste lid, en de herziening ervan nadere en zo nodig afwijkende regels gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel45
  - number: '46.1'
    text: |-
      De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder ][ref1] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '46.2'
    text: |-
      Onze Minister maakt in de *Staatscourant* bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel46
  - number: '46.3'
    text: |-
      Op een beschikking als gevolg van een herziening van het dagloon ingevolge het bepaalde in dit artikel zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '47.1'
    text: |-
      De uitkering bedraagt gedurende de eerste twee maanden per dag 75% van het dagloon. Vanaf de derde maand bedraagt
      de uitkering per dag 70% van het dagloon.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel47
  - number: '47.2'
    text: |-
      Voor de werknemer die bij het ontstaan van zijn recht op uitkering zijn arbeidsuren, bedoeld in [artikel 16][ref1],
      niet volledig heeft verloren of wiens verlies van arbeidsuren tijdens de duur van de uitkering wijziging ondergaat,
      bedraagt de uitkering het op grond van het eerste lid vastgestelde percentage van het dagloon, vermenigvuldigd met
      het aantal uren werkloosheid per kalenderweek, gedeeld door het aantal arbeidsuren voorafgaande aan het intreden
      van het verlies van arbeidsuren waarnaar zijn recht is berekend. Het aantal arbeidsuren voorafgaande aan het
      intreden van het verlies van arbeidsuren wordt bepaald met toepassing van [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
  - number: '47.3'
    text: |-
      Het tweede lid vindt geen toepassing voorzover bij de vaststelling of een herziening van het dagloon met de
      omstandigheden, bedoeld in dat lid, rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel47
  - number: '53.1'
    text: |-
      Het UWV laat, op zijn verzoek, tot de vrijwillige werkloosheidsverzekering toe de persoon, jonger dan 65 jaar,
      die op grond van het bepaalde bij of krachtens [artikel 3, tweede, vierde en vijfde lid][ref1], niet als werknemer
      wordt beschouwd, en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '3'
        hoofdstuk: I
        paragraaf: '2'
  - number: 53.1.a
    text: |-
      wiens werknemerschap is geëindigd en die buiten Nederland woont, aldaar direct aansluitend op de beëindiging van
      zijn werknemerschap een dienstbetrekking vervult voor de duur van maximaal vijf jaar en wiens werkgever binnen
      Nederland woont of gevestigd is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: 53.1.b
    text: |-
      die Nederlander is en die is uitgezonden om door de Minister voor Ontwikkelingssamenwerking aan te wijzen
      werkzaamheden in het kader van ontwikkelingssamenwerking te verrichten;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: 53.1.c
    text: |-
      die Nederlander is en die is uitgezonden om, in of buiten Nederland, werkzaamheden te verrichten voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: 53.1.d
    text: die in Nederland woont, en buiten Nederland een dienstbetrekking vervult; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: 53.1.e
    text: |-
      die Nederlander is en buiten Nederland werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in
      opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: '53.2'
    text: |-
      Het UWV laat, op zijn verzoek, tot de vrijwillige werkloosheidsverzekering toe de persoon, jonger dan 65 jaar,
      wiens arbeidsverhouding op grond van [artikel 6, onderdeel c][ref1], niet als dienstbetrekking wordt beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel6
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '6'
        hoofdstuk: I
        paragraaf: '2'
  - number: '53.3'
    text: |-
      Voorafgaand aan het vervullen van een dienstbetrekking, bedoeld in het eerste lid, onderdeel a, dient de persoon
      gedurende een aaneengesloten periode van tenminste één jaar de hoedanigheid van werknemer te bezitten.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: '53.4'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, onderdeel b, c en e, wordt gelijkgesteld de persoon, die onderdaan
      is van één van de lidstaten van de Europese Gemeenschap of onderdaan is van een Staat, waarmee Nederland een
      verdrag inzake sociale zekerheid heeft gesloten, mits hij voor hij werd uitgezonden in Nederland woonde.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel53
  - number: '54.1'
    text: Het verzoek om toelating tot de vrijwillige werkloosheidsverzekering wordt ingediend bij het UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
  - number: '54.2'
    text: 'Het verzoek om toelating als bedoeld in het eerste lid moet worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
  - number: 54.2.a
    text: |-
      door de in [artikel 53, eerste lid, onderdeel a][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werknemerschap is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.2.b
    text: |-
      door de in [artikel 53, eerste lid, onderdeel b, c en e][ref1] bedoelde persoon: binnen vier weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref2], bedoelde
      werkzaamheden worden verricht in Nederland, binnen vier weken na de dag waarop die werkzaamheden een aanvang hebben
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.2.c
    text: |-
      door de in [artikel 53, eerste lid, onderdeel d][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werkzaamheden buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '54.3'
    text: |-
      Het UWV is bevoegd te verklaren dat een verzoek om toelating tot de vrijwillige werkloosheidsverzekering, ingediend
      na de ingevolge het tweede lid geldende termijn, tijdig is ingekomen, indien de persoon die het verzoek heeft
      gedaan, redelijkerwijs niet geacht kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
  - number: '54.4'
    text: 'De vrijwillige werkloosheidsverzekering vangt aan:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
  - number: 54.4.a
    text: |-
      voor de in [artikel 53, eerste lid, onderdeel a][ref1], bedoelde persoon: op de dag na die, waarop zijn
      werknemerschap is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.b
    text: |-
      voor de in [artikel 53, eerste lid, onderdeel b, c en e][ref1] bedoelde persoon: op de dag van zijn vertrek naar
      het buitenland dan wel, indien de in [artikel 53, eerste lid, onderdeel c][ref2], bedoelde werkzaamheden worden
      verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.c
    text: |-
      voor de in [artikel 53, eerste lid, onder d][ref1], bedoelde persoon: op de dag waarop zijn werkzaamheden een
      aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 54.4.d
    text: |-
      voor de in [artikel 53, tweede lid][ref1], bedoelde persoon: op de dag van ontvangst van zijn verzoek om toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '55'
    text: |-
      Toelating van een persoon tot de vrijwillige werkloosheidsverzekering vindt slechts plaats, indien hij zich
      tegelijkertijd vrijwillig verzekert op grond van de [Ziektewet][ref1]. De in de eerste zin opgenomen verplichting
      is niet van toepassing indien betrokkene bij ziekte, zwangerschap of bevalling, recht heeft op loon dan wel
      bezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: '56'
    text: |-
      De persoon die is toegelaten tot de vrijwillige werkloosheidsverzekering wordt voor de toepassing van deze wet voor
      de duur van die verzekering als werknemer beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56
  - number: 56a
    text: 'Het UWV beëindigt de vrijwillige werkloosheidsverzekering:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
  - number: 56a.a
    text: op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
  - number: 56a.b
    text: |-
      met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 53, eerste lid, onderdeel a][ref1],
      is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 56a.c
    text: |-
      met ingang van de dag, waarop de werkzaamheden bedoeld in [artikel 53, eerste en tweede lid][ref1] worden
      beëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: 56a.d
    text: met ingang van de dag waarop de vrijwillig verzekerde verplicht verzekerd wordt ingevolge deze wet;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
  - number: 56a.e
    text: |-
      indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet-tijdig
      is betaald; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
  - number: 56a.f
    text: |-
      indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 53, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '57'
    text: |-
      De persoon, bedoeld in [artikel 53, eerste lid, onderdeel a, b en c][ref1], die werkloos is, heeft eerst recht op
      uitkering na terugkeer in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '53'
        hoofdstuk: III
  - number: '58.1'
    text: |-
      De persoon, die om toelating tot de vrijwillige werkloosheidsverzekering verzoekt, bepaalt bij de aanvang van de
      vrijwillige werkloosheidsverzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen
      dan:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel58
  - number: 58.1.a
    text: |-
      het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1], met
      betrekking tot een loontijdvak van een dag eventueel verhoogd of verlaagd krachtens [artikel 18 van die wet][ref2];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
  - number: 58.1.b
    text: het loon of het inkomen dat hij in geval van werkloosheid naar het oordeel van het UWV derft.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel58
  - number: '58.2'
    text: |-
      Voor de vaststelling van de hoogte van het recht op uitkering op grond van de vrijwillige werkloosheidsverzekering
      wordt, zonodig in afwijking van [artikel 45][ref1] en de daarop berustende bepalingen, onder dagloon verstaan het
      in het eerste lid bedoelde dagloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel45
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '45'
        hoofdstuk: II
        paragraaf: '5'
  - number: '59'
    text: |-
      Het UWV stelt nadere regels met betrekking tot de vrijwillige werkloosheidsverzekering. Deze regels bevatten in
      ieder geval bepalingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel59
  - number: 59.a
    text: de toelating tot de vrijwillige werkloosheidsverzekering;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel59
  - number: 59.b
    text: het einde van de vrijwillige werkloosheidsverzekering;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel59
  - number: 59.c
    text: |-
      het dagloon, bedoeld in [artikel 58, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel58
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '58'
        hoofdstuk: III
  - number: '60'
    text: |-
      Voor zover bij of krachtens dit hoofdstuk niet anders is bepaald, zijn de overige artikelen van deze wet en de
      daarop berustende bepalingen, voor zoveel nodig, van overeenkomstige toepassing op het recht op uitkering, het
      geldend maken van het recht op uitkering, de betaling van de uitkering, de hoogte en de duur van de uitkering op
      grond van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel60
  - number: '61'
    text: |-
      Een werknemer heeft recht op uitkering op grond van dit hoofdstuk, indien hij van een werkgever, die in
      staat van faillissement is verklaard, aan wie surséance van betaling is verleend, ten aanzien van wie de
      schuldsaneringsregeling natuurlijke personen van toepassing is, of die anderszins verkeert in de blijvende toestand
      dat hij heeft opgehouden te betalen, loon, vakantiegeld, of vakantiebijslag te vorderen heeft of indien hij
      geldelijk nadeel kan ondervinden doordat deze werkgever bedragen die hij in verband met de dienstbetrekking met de
      werknemer aan derden verschuldigd is, niet heeft betaald.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel61
  - number: '62.1'
    text: |-
      Geen recht op uitkering op grond van dit hoofdstuk heeft de werknemer, wiens dienstbetrekking met de werkgever
      reeds was geëindigd voordat de werkgever kwam te verkeren in een toestand als bedoeld in [artikel 61][ref1],
      tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: 62.1.a
    text: |-
      een duidelijke samenhang bestaat tussen de omstandigheden die tot het eindigen van de dienstbetrekking leidden en
      de omstandigheden, die tot die toestand hebben geleid; of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
  - number: 62.1.b
    text: |-
      de werknemer een recht heeft op betaling van loon, vakantiegeld, vakantiebijslag of andere bedragen als bedoeld in
      [artikel 61][ref1], dat geen verband houdt met een toestand als bedoeld in [artikel 61][ref2] en dat niet geldend
      kan worden gemaakt uitsluitend wegens die toestand.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '62.2'
    text: |-
      Geen recht op uitkering over de in [artikel 64, eerste lid, onderdeel b][ref1], bedoelde termijn van opzegging,
      heeft de werknemer die niet beschikbaar is om arbeid te aanvaarden, tenzij de werknemer:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: 62.2.a
    text: wegens ziekte, gebreken, zwangerschap of bevalling ongeschikt is tot het verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
  - number: 62.2.b
    text: |-
      een uitkering ontvangt op grond van [hoofdstuk 3 van de Wet arbeid en zorg][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013008
        hoofdstuk: '3'
  - number: 62.2.c
    text: arbeid als werknemer of werkzaamheden verricht uit hoofde waarvan hij niet als werknemer wordt beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
  - number: '62.3'
    text: |-
      De werknemer heeft geen recht op uitkering indien de aanvraag om een uitkering is ingediend nadat 26 weken zijn
      verstreken na de dag waarop de werkgever is komen te verkeren in een toestand als bedoeld in [artikel 61][ref1].
      Het UWV is bevoegd in bijzondere gevallen af te wijken van de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '62.4'
    text: |-
      Indien de werkgever, bedoeld in [artikel 61][ref1], een vaste inrichting heeft op het grondgebied van ten
      minste één lidstaat van de Europese Unie of een in ten minste één andere lidstaat van de Europese Unie wonende
      of gevestigde vaste vertegenwoordiger, bestaat slechts recht op uitkering op grond van dit hoofdstuk indien de
      werknemer zijn arbeid voor deze werkgever gewoonlijk verricht of verrichtte voor een vaste inrichting van de
      werkgever in Nederland of een in Nederland wonende of gevestigd vaste vertegenwoordiger van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '63.1'
    text: |-
      De werknemer, wiens werkgever verkeert in een toestand als bedoeld in [artikel 61][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: 63.1.a
    text: |-
      indien geen tijdige betaling van loon, vakantiegeld of vakantiebijslag heeft plaatsgevonden, binnen een week na de
      dag waarop hij deze betaling normaal zou hebben ontvangen daarvan aangifte te doen bij het UWV; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel63
  - number: 63.1.b
    text: |-
      binnen een week na de dag waarop het hem redelijkerwijs duidelijk moet zijn geweest dat zijn werkgever de bedragen,
      bedoeld in [artikel 61][ref1], niet heeft betaald, daarvan aangifte te doen bij het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '63.2'
    text: |-
      Indien de werknemer een verplichting hem op grond van het eerste lid opgelegd, niet of niet behoorlijk is
      nagekomen, weigert het Uitvoeringsinstituut werknemersverzekeringen de uitkering op grond van dit hoofdstuk
      tijdelijk of blijvend, geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel63
  - number: '63.3'
    text: |-
      Indien het de werknemer voor de totstandkoming van de dienstbetrekking of voor een wijziging in de
      arbeidsvoorwaarden tijdens de dienstbetrekking redelijkerwijs duidelijk moet zijn geweest dat in verband met
      een toestand als bedoeld in [artikel 61][ref1], geen of slechts ten dele betaling zou plaatsvinden van loon,
      vakantiegeld, vakantiebijslag of aan derden verschuldigde bedragen in verband met de dienstbetrekking van de
      werknemer, is het tweede lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '64.1'
    text: 'Het recht op uitkering op grond van dit hoofdstuk omvat:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.a
    text: 'het loon over ten hoogste dertien weken, onmiddellijk voorafgaande aan:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.a.1°
    text: de dag waarop de dienstbetrekking door ontbinding eindigt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.a.2°
    text: de dag waarop de dienstbetrekking met wederzijds goedvinden eindigt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.a.3°
    text: de dag waarop de dienstbetrekking van rechtswege eindigt, of
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.a.4°
    text: de dag van opzegging van de dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: 64.1.b
    text: |-
      het loon over ten hoogste de voor de werknemer geldende termijn van opzegging of de termijn van opzegging, die
      zou hebben gegolden als deze termijn was aangevangen op de op grond van het tweede lid door het UWV vastgestelde
      dag, met dien verstande dat de krachtens [artikel 40 van de Faillissementswet][ref1] ten aanzien van de werknemer
      geldende termijn, zowel in als buiten faillissement, niet wordt overschreden; en


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel40
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '40'
  - number: 64.1.c
    text: |-
      het vakantiegeld, de vakantiebijslag en de bedragen, die de werkgever in verband met de dienstbetrekking met de
      werknemer aan derden verschuldigd is, over ten hoogste het jaar onmiddellijk voorafgaande aan het tijdstip waarop
      de in onderdeel a, onder 1°, 2°, 3° of de in onderdeel b bedoelde termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: '64.2'
    text: |-
      Ten aanzien van het eerste lid, onderdeel a, geldt dat het recht op uitkering op grond van dit hoofdstuk het loon
      omvat over ten hoogste dertien weken onmiddellijk voorafgaande aan de dag waarop de dienstbetrekking naar het
      oordeel van het UWV redelijkerwijs had moeten worden beëindigd of opgezegd, indien de dienstbetrekking niet of op
      een later dan het daarvoor redelijkerwijs in aanmerking komende moment is beëindigd of opgezegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
  - number: '64.3'
    text: |-
      De hoogte van de uitkering van het vakantiegeld, bedoeld in het eerste lid, onderdeel c, wordt berekend op grond
      van de aanspraak op vakantiedagen die de werknemer bij het einde van de dienstbetrekking heeft, met dien verstande
      dat de uitkering niet meer bedraagt dan het vakantiegeld over het aantal vakantiedagen dat hij kan verwerven in een
      jaar waarin hij een dienstbetrekking met de werkgever, bedoeld in [artikel 61][ref1], heeft en waarin hij gedurende
      de volledig overeengekomen arbeidsduur recht op loon heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: '65.1'
    text: |-
      Op de uitkering, bedoeld in [artikel 64][ref1], worden geheel in mindering gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: 65.1.a
    text: |-
      de inkomsten uit arbeid als werknemer en uit werkzaamheden uit hoofde waarvan hij niet als werknemer wordt
      beschouwd, verricht tijdens de periode, bedoeld in [artikel 64, eerste lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: 65.1.b
    text: |-
      de vakantiedagen en vakantiebijslag verworven uit arbeid als werknemer en uit werkzaamheden uit
      hoofde waarvan hij niet als werknemer wordt beschouwd, verricht tijdens de periode, bedoeld in
      [artikel 64, eerste lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: 65.1.c
    text: |-
      de door een werkgever niet zijnde de werkgever, bedoeld in [artikel 61][ref1], verrichte betalingen van bedragen
      die hij in verband met de dienstbetrekking met de werknemer aan derden verschuldigd is; en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
  - number: 65.1.d
    text: |-
      de inkomsten wegens loonderving over de periodes, bedoeld in [artikel 64, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: '65.2'
    text: |-
      Door de werkgever, bedoeld in [artikel 61][ref1], verrichte betalingen van verplichtingen als bedoeld in
      [artikel 64, eerste lid, onderdelen a, b en c][ref2], worden voor ieder van die verplichtingen afzonderlijk
      toegerekend aan de periode voorafgaand aan een periode als bedoeld in die onderdelen, indien de werknemer een
      vordering tot betaling van die verplichtingen heeft op de werkgever die op die beide periodes betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '61'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: '66.1'
    text: |-
      De vorderingen van de werknemer en derden op de werkgever, bedoeld in [artikel 64, eerste lid][ref1], gaan over op
      het UWV, voorzover deze vorderingen door het UWV worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel64
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '64'
        hoofdstuk: IV
  - number: '66.2'
    text: |-
      Het UWV verhaalt de door werkgevers verschuldigde premies op grond van
      [Wet financiering sociale verzekeringen][ref1] over de uitkering, bedoeld in dit hoofdstuk, op de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '66.3'
    text: |-
      De vorderingen van het UWV, bedoeld in het eerste en tweede lid, zijn bevoorrecht op alle goederen van de werkgever
      en gaan boven alle andere voorrechten met uitzondering van die van de [artikelen 287][ref1] en [288 onder a][ref2],
      alsmede die van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '67'
    text: 'Voor de toepassing van dit hoofdstuk wordt:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel67
  - number: 67.a
    text: |-
      onder loon verstaan: al hetgeen de werkgever in verband met de dienstbetrekking aan de werknemer rechtens
      verschuldigd is met uitzondering van vakantiegeld en vakantiebijslag;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel67
  - number: 67.b
    text: |-
      onder vakantiegeld en vakantiebijslag ook verstaan: vakantiebonnen, vakantiezegels en andere dergelijke
      waardepapieren; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel67
  - number: 67.c
    text: |-
      onder werknemer ook verstaan: de persoon die uitsluitend omdat hij 65 jaar of ouder is niet als werknemer wordt
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel67
  - number: '68.1'
    text: |-
      De [artikelen 17 tot en met 21][ref1], [28][ref2], [35][ref3], [41][ref4], [42][ref5], [42a][ref6] en [47][ref7]
      zijn niet van toepassing op het recht op uitkering, het geldend maken van het recht op uitkering en de betaling van
      de uitkering op grond van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref6]: https://wetten.overheid.nl/BWBR0004045#Artikel42a
      [ref7]: https://wetten.overheid.nl/BWBR0004045#Artikel47
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '28'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '35'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '41'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0004045
        artikel: 42a
        hoofdstuk: II
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0004045
        artikel: '47'
        hoofdstuk: II
        paragraaf: '5'
  - number: '68.2'
    text: |-
      Voor zover bij of krachtens dit hoofdstuk niet anders is bepaald zijn de overige artikelen van deze wet en de
      daarop berustende bepalingen, voor zoveel nodig, van overeenkomstige toepassing op het recht op uitkering, het
      geldend maken van het recht op uitkering en de betaling van de uitkering op grond van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel68
  - number: '72.1'
    text: 'Het UWV heeft tot taak de inschakeling in de arbeid te bevorderen van:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
  - number: 72.1.a
    text: |-
      werknemers, niet zijnde overheidswerknemers, die recht op uitkering hebben op grond van [hoofdstuk II][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 72.1.b
    text: |-
      werknemers, niet zijnde overheidswerknemers, die kunnen aantonen dat de dienstbetrekking binnen vier maanden zal
      eindigen en van wie naar het oordeel van de CWI redelijkerwijs valt aan te nemen dat zij recht zullen hebben op een
      uitkering op grond van [hoofdstuk II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '72.2'
    text: |-
      Het eerste lid is niet van toepassing op werknemers als bedoeld in het eerste lid, indien
      het UWV met burgemeester en wethouders van een gemeente overeenkomen dat op die werknemers
      [artikel 7, eerste lid, aanhef en onderdeel a, van de Wet werk en bijstand][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '72.3'
    text: |-
      Het UWV laat de werkzaamheden waarmee de in het eerste lid bedoelde taak wordt uitgevoerd, verrichten door een
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
  - number: '72.4'
    text: |-
      Het UWV verstrekt aan het reïntegratiebedrijf gegevens voorzover deze noodzakelijk zijn voor de uitvoering van de
      in het derde lid bedoelde werkzaamheden, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in
      de arbeid door dat reïntegratiebedrijf wordt bevorderd. Dit reïntegratiebedrijf verwerkt de in dit lid bedoelde
      gegevens slechts voorzover dat noodzakelijk is voor de werkzaamheden, bedoeld in het derde lid, en gebruikt slechts
      met dat doel het sociaal-fiscaalnummer bij die verwerking.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
  - number: '72.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de uitvoering van dit artikel,
      waarbij in ieder geval regels kunnen worden gesteld voor de inhoud van de overeenkomst met het reïntegratiebedrijf,
      het verstrekken en verwerken van gegevens en de soort werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
  - number: '72.6'
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72
  - number: 72a.1
    text: 'De overheidswerkgever heeft tot taak de inschakeling in de arbeid te bevorderen van:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72a
  - number: 72a.1.a
    text: |-
      een persoon die uit hoofde van een dienstbetrekking als overheidswerknemer met die overheidswerkgever recht heeft
      op uitkering op grond van [hoofdstuk II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 72a.1.b
    text: |-
      een overheidswerknemer die kan aantonen dat de dienstbetrekking binnen vier maanden zal eindigen en van wie naar
      het oordeel van de CWI redelijkerwijs valt aan te nemen dat hij recht zullen hebben op een uitkering op grond van
      [hoofdstuk II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 72a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het ten behoeve
      van een persoon als bedoeld in het eerste lid sluiten van een individuele reïntegratieovereenkomst met een
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel72a
  - number: '73'
    text: |-
      De werknemer die recht heeft op een uitkering op grond van deze wet heeft recht op ondersteuning bij
      arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen, op de naar het oordeel van
      het UWV of de overheidswerkgever noodzakelijk geachte voorziening gericht op arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel73
  - number: '75'
    text: |-
      Onze Minister is bevoegd regels te stellen op grond waarvan, in bij die regels aan te geven gevallen en met
      inachtneming van bij die regels te stellen beperkingen, de werknemer bevoegd is deel te nemen aan een opleiding of
      scholing in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel75
  - number: '76.1'
    text: |-
      Indien de werknemer die recht heeft op een uitkering op grond van [hoofdstuk II][ref1], deelneemt of gaat deelnemen
      aan een voor hem, naar het oordeel van het UWV, noodzakelijke opleiding of scholing, blijft volgens door Onze
      Minister te stellen regels het recht op uitkering op grond van dat hoofdstuk bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: '76.2'
    text: |-
      In de door Onze Minister te stellen regels, die voor verschillende groepen werknemers verschillend kunnen luiden,
      worden in ieder geval voorschriften en beperkingen gegeven met betrekking tot de aard, de omvang en de duur van de
      opleiding of scholing als bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76
  - number: '76.3'
    text: |-
      In afwijking van het eerste lid, blijft het recht op uitkering op grond van [hoofdstuk II][ref1] van de
      herbeoordeelde bestaan totdat de, naar het oordeel van het UWV noodzakelijke opleiding of scholing is beëindigd,
      indien de opleiding of scholing deel uit maakt van een plan als bedoeld in [artikel 29, tweede lid][ref2], dat
      binnen drie maanden na de datum van verlaging of intrekking van de arbeidsongeschiktheidsuitkering is opgesteld en
      met de opleiding of scholing is aangevangen voor de duur van de uitkering verstrijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel29
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '29'
        hoofdstuk: II
        paragraaf: '2'
  - number: '76.4'
    text: |-
      Onder herbeoordeelde als bedoeld in het derde lid wordt verstaan: de werknemer wiens
      arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg van de toepassing
      van [artikel 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of
      [artikel 28, vijfde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3], of de persoon,
      bedoeld in [artikel 2, derde lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref4],
      wiens arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0017207#Artikel2
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0017207
        artikel: '2'
  - number: 76a.1
    text: |-
      Het UWV kan toestemming verlenen aan de werknemer, die recht heeft op een uitkering op grond van
      [hoofdstuk II][ref1], om op een proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde
      werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 76a.2
    text: |-
      Voor de werknemer, bedoeld in het eerste lid, blijft het recht op uitkering op grond van [hoofdstuk II][ref1]
      bestaan, onverminderd [artikel 20, eerste lid, aanhef en onderdeel e][ref2], gedurende de periode waarover
      toestemming is verleend tot het verrichten van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
  - number: 76a.3
    text: 'De onbeloonde werkzaamheden op een proefplaats zijn:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.3.a
    text: werkzaamheden, waartoe de werknemer met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.3.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de werknemer heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.3.c
    text: |-
      werkzaamheden, die de werknemer niet reeds eerder onbeloond op een proefplaats bij die werkgever of diens
      rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.3.d
    text: |-
      werkzaamheden, waarbij er, naar het oordeel van het UWV, een reëel uitzicht is op een op de onbeloonde
      werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.4
    text: |-
      De werknemer die werkzaamheden verricht als bedoeld in het eerste lid, doet daarvan onverwijld mededeling aan het
      UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.5
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 76a.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de uitvoering van het eerste tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel76a
  - number: 77a.1
    text: |-
      Het UWV kan een werknemer toestemming verlenen om gedurende maximaal zes maanden werkzaamheden in de uitoefening
      van een bedrijf of in de zelfstandige uitoefening van een beroep te verrichten, indien:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
  - number: 77a.1.a
    text: aannemelijk is dat de werknemer in de toekomst met die werkzaamheden structureel in zijn bestaan kan voorzien;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
  - number: 77a.1.b
    text: de werkzaamheden nog geen aanvang hebben genomen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
  - number: 77a.1.c
    text: |-
      de werknemer recht heeft op uitkering op grond van [hoofdstuk II][ref1], anders dan op grond van
      [artikel 18][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel18
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '18'
        hoofdstuk: II
        paragraaf: '1'
  - number: 77a.1.d
    text: |-
      de werkloosheid van de werknemer niet uitsluitend een gevolg is van verkorting van de werktijd, waarvoor op grond
      van [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1] ontheffing is verleend; en


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '8'
  - number: 77a.1.e
    text: deze toestemming tijdens de uitkeringsduur niet eerder aan de werknemer is verleend.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
  - number: 77a.2
    text: |-
      Voor de werknemer, bedoeld in het eerste lid, blijft, onverminderd
      [artikel 20, eerste lid, aanhef en onderdeel e][ref1], het recht op uitkering op grond van [hoofdstuk II][ref2]
      bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '20'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: II
  - number: 77a.3
    text: |-
      De werknemer aan wie toestemming is verleend als bedoeld in het eerste lid wordt geacht werknemer te zijn en te
      blijven zolang die toepassing duurt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel77a
  - number: '78'
    text: |-
      De werknemer, ten aanzien van wie [artikel 75][ref1], [76][ref2], [76a][ref3], 77 of [77a][ref4] wordt toegepast,
      wordt geacht werkloos te zijn en te blijven zolang die toepassing duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel76a
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel77a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '75'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '76'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 76a
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0004045
        artikel: 77a
        hoofdstuk: VI
  - number: '79.1'
    text: |-
      Het UWV verhaalt op de overheidswerkgever tot wie de dienstbetrekking bestond uit hoofde waarvan de
      overheidswerknemer de in onderdeel a bedoelde uitkering ontvangt:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: 79.1.a
    text: |-
      de op grond van [hoofdstuk II][ref1] te betalen uitkering aan die overheidswerknemer,
      met uitzondering van de premie verschuldigd over een uitkering, als bedoeld in
      [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 79.1.b
    text: |-
      de op grond van enige wet over de uitkering, bedoeld in onderdeel a, door het UWV verschuldigde premies
      of vergoedingen als bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1] die niet op deze uitkering in
      mindering kunnen worden gebracht, met uitzondering van de premie verschuldigd over een uitkering, als bedoeld in
      [artikel 24, tweede lid, van de Wet financiering sociale verzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel24
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '24'
  - number: 79.1.c
    text: |-
      de vergoeding, bedoeld in [artikel 110 van de Wet financiering sociale verzekeringen][ref1], die betrekking heeft
      op de persoon die de in onderdeel a bedoelde uitkering ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel110
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '110'
  - number: '79.2'
    text: 'Voor de toepassing van het eerste lid wordt onder uitkering niet verstaan de uitkering aan een persoon:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: 79.2.a
    text: |-
      voor wie een beschikking geldt als bedoeld in
      [artikel 4a van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1] waarin hij met betrekking tot de, in
      de in het eerste lid bedoelde dienstbetrekking, verrichte soort van werkzaamheden wordt aangemerkt als zelfstandige
      als bedoeld in [artikel 4 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0008656#Artikel4
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0008656
        artikel: '4'
  - number: 79.2.b
    text: |-
      waarvan het de overheidswerkgever niet redelijkerwijs duidelijk kon zijn dat deze tot hem in een privaatrechtelijke
      of publiekrechtelijke dienstbetrekking stond.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '79.3'
    text: |-
      Op het totaal van de bedragen die op de overheidswerkgever op grond van het eerste lid over enig tijdvak
      wordt verhaald, wordt in mindering gebracht hetgeen het UWV in dat tijdvak ontvangt door de toepassing van
      [artikel 36][ref1], onder aftrek van de daarop betrekking hebbende uitvoeringskosten, voorzover die toepassing
      betrekking heeft op uitkeringen en premies die eerder op grond van dat lid op de overheidswerkgever zijn verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel36
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '36'
        hoofdstuk: II
        paragraaf: '3'
  - number: '79.4'
    text: |-
      Indien hetgeen op grond van het tweede lid in mindering wordt gebracht het totaal van de bedragen die op de
      overheidswerkgever over het betrokken tijdvak wordt verhaald overtreft, wordt dat meerdere door het UWV betaald aan
      de overheidswerkgever.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '79.5'
    text: |-
      Indien de overheidswerkgever, bedoeld in het eerste lid, niet meer bestaat, wordt voor de toepassing van het eerste
      tot en met derde lid onder overheidswerkgever verstaan de rechtsopvolger van die overheidswerkgever. De eerste zin
      is niet van toepassing met betrekking tot de rechtsopvolger na faillissement.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '79.6'
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies of vergoeding worden verhaald, vermeldt de
      termijn of de termijnen waarbinnen deze moeten worden betaald, alsmede de wijze waarop het besluit bij gebreke van
      tijdige betaling, overeenkomstig het zevende tot en met negende lid zal worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '79.7'
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies of vergoeding worden verhaald, levert een
      executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De
      titel heeft mede betrekking op de rente en kosten, bedoeld in het negende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '79.8'
    text: |-
      Het besluit waarbij de in het eerste lid bedoelde uitkering, premies of vergoeding worden verhaald, wordt bij
      gebreke van tijdige betaling met toepassing van het [Wetboek van Burgerlijke Rechtsvordering][ref1] op kosten van
      de overheidswerkgever of diens rechtsopvolger betekend en ten uitvoer gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '79.9'
    text: |-
      Bij gebreke van tijdige betaling wordt het te verhalen bedrag verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '79.10'
    text: Het UWV kan nadere regels stellen met betrekking tot het eerste tot en met derde lid en het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel79
  - number: '80.1'
    text: |-
      Een beschikking tot verhaal van uitkering, premies of vergoeding als bedoeld in [artikel 79, eerste lid][ref1],
      wordt niet meer gegeven indien meer dan vijf jaren sedert het einde van het kalenderjaar zijn verstreken, waarin
      zij zijn betaald of afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
        hoofdstuk: VII
  - number: '80.2'
    text: |-
      Uitkering, premies of vergoeding, die niet zijn ingevorderd binnen tien jaren na het geven van de beschikking tot
      verhaal, worden niet meer ingevorderd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel80
  - number: '80.3'
    text: |-
      De rechtsvordering tot terugbetaling van een onverschuldigd betaald bedrag in verband met verhaal van uitkering,
      premies of vergoeding verjaart door verloop van vijf jaren sedert het einde van het kalenderjaar waarin de
      beschikking tot verhaal is gegeven.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel80
  - number: '81'
    text: |-
      De vordering van het UWV wegens verhaal als bedoeld in [artikel 79, eerste lid][ref1], is
      bevoorrecht op alle goederen van de werkgever en gaat boven alle andere voorrechten met
      uitzondering van die van de [artikelen 287][ref2] en [288 onder a][ref3], alsmede dat van
      [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel287
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '287'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '98'
    text: In de uitvoering van deze wet wordt voorzien door het UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel98
  - number: '99'
    text: De werknemer is verzekerd bij het UWV.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel99
  - number: '101.1'
    text: Het UWV stelt een uitkeringsreglement werkloosheidsverzekeringen vast.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: '101.2'
    text: 'Onverminderd het elders in deze wet dienaangaande bepaalde, bevat het uitkeringsreglement bepalingen omtrent:'
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.a
    text: voorschriften ten behoeve van een doelmatige controle, die ten aanzien van de werknemers moeten worden genomen;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.b
    text: voorschriften met betrekking tot het genieten van vakantie tijdens de duur van de uitkering;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.c
    text: |-
      voorschriften in verband met de betaling van de uitkering door tussenkomst van de werkgever, indien tijdens
      werkloosheid de dienstbetrekking voortduurt;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.d
    text: andere voorwaarden, die aan het ontvangen van uitkering zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.e
    text: |-
      het betalen van een deel van de uitkering in de vorm van bijdragen aan sociale fondsen, waaronder begrepen bonnen,
      zegels en certificaten, die door het desbetreffende fonds worden uitgegeven of voorgeschreven; en
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: 101.2.f
    text: samenloop van uitkering en inkomsten uit of in verband met arbeid.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: '101.3'
    text: |-
      Het uitkeringsreglement mag geen bepalingen bevatten, welke strijdig zijn met deze wet en de daarop berustende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel101
  - number: '111'
    text: |-
      Tussen Onze Minister en Onze Minister van Financiën dient overeenstemming te bestaan omtrent te stellen regels als
      bedoeld in [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel12
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '12'
        hoofdstuk: I
        paragraaf: '3'
  - number: '116.1'
    text: |-
      De door het UWV op grond van de [artikelen 16, zesde lid][ref1], [26, tweede lid][ref2], [35b, vijfde lid][ref3],
      [59][ref4] en [79, tiende lid][ref5], gestelde regels behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel35b
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: 35b
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '59'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0004045
        artikel: '79'
        hoofdstuk: VII
  - number: '116.2'
    text: |-
      Een door het UWV vastgesteld uitkeringsreglement werkloosheidsverzekeringen, bedoeld in
      [artikel 101, eerste lid][ref1], behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel101
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '101'
        hoofdstuk: VIII
  - number: '126'
    text: |-
      In afwijking van [artikel 1:2 van de Algemene wet bestuursrecht][ref1] is de werkgever geen belanghebbende bij een
      besluit van het UWV over het verzekerd zijn op grond van deze wet als bedoeld in [artikel 127a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel127a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 127a
        hoofdstuk: X
  - number: '127.1'
    text: |-
      Onverminderd [artikel 127a][ref1], worden beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel127a
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 127a
        hoofdstuk: X
  - number: '127.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127
  - number: '127.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127
  - number: '127.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127
  - number: 127a.1
    text: |-
      Een aanvraag tot het geven van een beschikking over het verzekerd zijn op grond van deze wet kan door de werknemer
      uitsluitend bij het UWV worden ingediend. Het UWV geeft de beschikking binnen dertien weken na ontvangst van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127a
  - number: 127a.2
    text: |-
      Een beschikking over de betaling van een voorschot op grond van [artikel 31][ref1] wordt gegeven binnen vier weken
      na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '31'
        hoofdstuk: II
        paragraaf: '3'
  - number: 127a.3
    text: |-
      Een beschikking op grond van [hoofdstuk IV][ref1] en de daarop berustende bepalingen wordt gegeven binnen zes
      maanden na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: IV
  - number: 127a.4
    text: |-
      Indien een beschikking als bedoeld in het eerste, tweede of derde lid niet binnen de toepasselijke termijn kan
      worden gegeven, wordt dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127a
  - number: 127a.5
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste, tweede of derde lid informatie is
      gevraagd aan een persoon of instantie buiten Nederland en om die reden de beschikking niet binnen de toepasselijke
      termijn gegeven kan worden, wordt deze termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze
      verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel127a
  - number: '128'
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door het UWV gestelde redelijke termijn, verklaart dat hij
      gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '129'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het UWV binnen dertien
      weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 129a
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129a
  - number: 129b
    text: |-
      Het bezwaar of beroep van een werkgever tegen het verhaal, bedoeld in [artikel 79, eerste lid][ref1], kan niet zijn
      gegrond op de grief dat de uitkering ten onrechte of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129b
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
        hoofdstuk: VII
  - number: 129c
    text: |-
      Ten aanzien van besluiten waaraan een medische beoordeling ten grondslag ligt zijn de
      [artikelen 103 tot en met 110 van de Wet werk en inkomen naar arbeidsvermogen][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel103
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129c
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '103'
  - number: 129d.1
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen terzake van
      schending of verkeerde toepassing van de [artikelen 2 tot en met 12][ref1] en [14, eerste lid][ref2], en de daarop
      berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel14
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129d
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '2'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '14'
        hoofdstuk: I
        paragraaf: '4'
  - number: 129d.2
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel129d
  - number: '130.1'
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de inschakeling in de arbeid van werknemers die recht op uitkering hebben op grond
      van [hoofdstuk II][ref1], doeltreffender uit te voeren, worden afgeweken van het bepaalde bij of krachtens de
      [artikelen 24][ref2], [26][ref3] en [72 tot en met 78][ref4] van deze wet. Bij toepassing van de eerste zin wordt
      bij algemene maatregel van bestuur geregeld op welke wijze van welke artikelen wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0004045
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '24'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '26'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004045
        artikel: '72'
        hoofdstuk: VI
  - number: '130.2'
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste vier jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. Het eerste lid, tweede zin, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130
  - number: '130.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen worden getroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130
  - number: '130.4'
    text: |-
      Onze Minister meldt aan de Staten-Generaal hoe het experiment in de praktijk is verlopen, alsmede zijn standpunt
      inzake de voortzetting ervan anders dan als experiment.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130
  - number: '130.5'
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130
  - number: 130g.1
    text: |-
      De [artikelen 82, tweede lid][ref1], 82a, eerste lid, en 97c, zesde lid, zoals deze artikelen luidden
      op de dag voorafgaande aan het tijdstip van inwerkingtreding van de desbetreffende bepalingen van de
      [Invoeringswet Wet financiering sociale verzekeringen][ref2], zijn niet van toepassing indien de dienstbetrekking
      is aangegaan voor 1 januari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0017747
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '82'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0017747
  - number: 130g.2
    text: |-
      De [artikelen 82, derde lid][ref1], 82a, tweede lid, en 97c, zevende lid, zoals deze artikelen luidden
      op de dag voorafgaande aan het tijdstip van inwerkingtreding van de desbetreffende bepalingen van de
      [Invoeringswet Wet financiering sociale verzekeringen][ref2], zijn niet van toepassing indien de werknemer voor
      1 januari 2002 zijn eigen arbeid of een andere functie bij dezelfde werkgever geheel of gedeeltelijk heeft hervat
      dan wel indien diens arbeidsplaats voor die datum is aangepast tot behoud, herstel of ter bevordering van de
      mogelijkheden tot het verrichten van arbeid van die werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0017747
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '82'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0017747
  - number: 130g.3
    text: |-
      Zo nodig in afwijking van de [artikelen 82, tweede, derde en vierde lid][ref1], 82a, eerste,
      tweede en derde lid, of 97c, zesde, zevende en achtste lid, zoals deze artikelen luidden op de
      dag voorafgaande aan het tijdstip van inwerkingtreding van de desbetreffende bepalingen van de
      [Invoeringswet Wet financiering sociale verzekeringen][ref2], kan het bedrag dat in mindering wordt gebracht op
      de door de werkgever verschuldigde premie en de premiekorting met betrekking tot het jaar 2002, in 2003 worden
      vastgesteld. Bij ministeriële regeling kunnen met betrekking tot dit lid nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0017747
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130g
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '82'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0017747
  - number: 130h.1
    text: |-
      Hoofdstuk IIA, Afdeling III, zoals dat luidde op de dag voor inwerkingtreding van de wet van 19 december 2003
      tot wijziging van de Werkloosheidswet in verband met afschaffing van de vervolguitkering (Stb. 546), blijft van
      toepassing op een recht op uitkering:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.1.a
    text: waarvan de eerste werkloosheidsdag is gelegen voor 11 augustus 2003;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.1.b
    text: |-
      ontstaan als gevolg van eindiging van de dienstbetrekking door opzegging, indien de aanzegging van de opzegging
      heeft plaatsgevonden voor de in onderdeel a genoemde datum;
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.1.c
    text: |-
      ontstaan als gevolg van ontbinding door de rechter van de dienstbetrekking, indien de datum waarop de ontbinding is
      uitgesproken is gelegen voor de in onderdeel a genoemde datum.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.2
    text: |-
      De artikelen 48, 51 en 52, zoals die luidden op de dag voor inwerkingtreding van de in het eerste lid genoemde wet,
      blijven van toepassing op de persoon:
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.2.a
    text: |-
      die voor 11 augustus 2003 recht op uitkering op grond van deze wet had, welk recht eindigt of is geëindigd op
      grond van het verrichten van werkzaamheden als werknemer, en die terzake van de verrichte werkzaamheden op of na 11
      augustus 2003 een nieuw recht op uitkering krijgt, tot aan het moment waarop dat eerste recht zonder toepassing van
      de [artikelen 43][ref1] en [50][ref2] zou hebben geduurd;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel50
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '50'
        hoofdstuk: II
        paragraaf: '5'
  - number: 130h.2.b
    text: |-
      op wie het eerste lid, onderdeel b of c van toepassing is, en wiens recht als bedoeld in dat lid eindigt of
      is geëindigd op grond van het verrichten van werkzaamheden als werknemer, en die terzake van de verrichte
      werkzaamheden op of na 11 augustus 2003 een nieuw recht op uitkering krijgt, tot aan het moment waarop dat eerste
      recht zonder toepassing van de [artikelen 43][ref1] en [50][ref2] zou hebben geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel50
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '43'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '50'
        hoofdstuk: II
        paragraaf: '5'
  - number: 130h.3
    text: |-
      De artikelen 15, 35c, 52b, derde lid, en 52d, derde tot en met vijfde lid, zoals die luidden op de dag voor
      inwerkingtreding van de in het eerste lid genoemde wet, blijven van toepassing op de in het eerste en tweede lid
      bedoelde rechten respectievelijk personen.
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
  - number: 130h.4
    text: |-
      Met opzegging als bedoeld in het eerste lid, onderdeel b, wordt gelijkgesteld, ontslag als bedoeld in de
      [artikelen 93][ref1] en [94 van het Algemeen Rijksambtenarenreglement][ref2] of een overeenkomstige bepaling van
      een soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel94
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130h
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '93'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '94'
  - number: 130i.1
    text: |-
      De [artikelen 42][ref1] en [17b][ref2], zoals deze luidden op de dag voor inwerkingtreding van de wet van
      4 november 2004 tot wijziging van de Werkloosheidswet en de Wet structuur uitvoeringsorganisatie werk en
      inkomen in verband met de vervanging van fictief arbeidsverleden door feitelijk arbeidsverleden en de beperking
      van het verzorgingsforfait Stb. 2004, 594, blijven van toepassing op een recht op uitkering waarbij de eerste
      werkloosheidsdag is gelegen voor of op die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 17b
        hoofdstuk: II
        paragraaf: '1'
  - number: 130i.2
    text: |-
      In afwijking van de eerste zin van [artikel 17b, tweede lid][ref1], worden voor de toepassing van
      [artikel 17, aanhef en onderdeel b, onder 1°][ref2], niet reeds in aanmerking genomen kalenderjaren
      over de periode tot 1 januari 2005, waarin een persoon recht heeft op kinderbijslag op grond van
      [artikel 7 van de Algemene Kinderbijslagwet][ref3] of een andere gezinsbijslag als bedoeld in artikel 4, eerste
      lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van de Raad van de Europese Gemeenschap van 14
      juni 1971 betreffende de toepassing van socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun
      gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149) voor een tot zijn huishouden behorend kind
      dat bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, gelijkgesteld met, en worden
      dergelijke kalenderjaren over de periode van 1 januari 2005 tot 1 januari 2007 voor drie kwart gelijkgesteld met,
      kalenderjaren waarin over 52 of meer dagen loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130i
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 17b
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '17'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002368
        artikel: '7'
  - number: 130j.1
    text: |-
      De [artikelen 17a, eerste lid, onderdeel c][ref1], [17b, eerste lid, onderdeel a][ref2],
      [19, eerste lid, onderdeel m][ref3], [28, derde lid][ref4], [76, eerste lid][ref5], en de daarop berustende
      bepalingen, zoals die luidden op de dag voor inwerkingtreding van de wet van 23 december 2004 houdende
      wijziging van enkele socialeverzekeringswetten en enige andere wetten in verband met het aanbrengen van enige
      vereenvoudigingen, blijven van toepassing op de werknemer die voor de datum van inwerkingtreding van die wet:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel17b
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004045#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0004045#Artikel76
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel130j
    references:
      - id: ref1
