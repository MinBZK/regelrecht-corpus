      [artikel 2, eerste lid, onderdeel a, van de WPA][ref1], dan wel een privaatrechtelijk lichaam
      als bedoeld in [artikel 2, eerste lid, onderdeel b tot en met e, van die wet][ref2], zoals die
      bepalingen luidden op de dag voorafgaande aan het tijdstip van aanvang van fase 2, bedoeld in
      [artikel 53 van de Wet overheidspersoneel onder de werknemersverzekeringen][ref3], dat de overheidswerknemer
      rechtstreeks ten laste van dat lichaam bezoldigt of beloont;


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009267#Artikel53
    url: https://wetten.overheid.nl/BWBR0004045/2006-10-01#Artikel1
    references:
