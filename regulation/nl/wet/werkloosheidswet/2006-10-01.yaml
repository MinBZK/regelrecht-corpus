        hoofdstuk: '5'
  - number: 1.c
    text: |-
      sectorfonds: een sectorfonds als bedoeld in [artikel 94 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel94
