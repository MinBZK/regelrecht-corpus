  - number: '75'
    text: |-
      Onze Minister is bevoegd regels te stellen op grond waarvan, in bij die regels aan te geven gevallen en met
      inachtneming van bij die regels te stellen beperkingen, de werknemer bevoegd is deel te nemen aan een opleiding of
      scholing in dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel75
  - number: '76'
    text: |-
      1 Indien de werknemer die recht heeft op een uitkering op grond van [hoofdstuk II][ref1], deelneemt of gaat
      deelnemen aan een voor hem, naar het oordeel van het UWV, noodzakelijke opleiding of scholing, blijft volgens door
      Onze Minister te stellen regels het recht op uitkering op grond van dat hoofdstuk bestaan.

      2 In de door Onze Minister te stellen regels, die voor verschillende groepen werknemers verschillend kunnen luiden,
      worden in ieder geval voorschriften en beperkingen gegeven met betrekking tot de aard, de omvang en de duur van de
      opleiding of scholing als bedoeld in het eerste en derde lid.

      3 In afwijking van het eerste lid, blijft het recht op uitkering op grond van [hoofdstuk II][ref2] van
      de herbeoordeelde bestaan totdat de, naar het oordeel van het UWV noodzakelijke opleiding of scholing
      is beëindigd, indien de opleiding of scholing deel uit maakt van een re-integratievisie als bedoeld in
      [artikel 30a, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], die, of een re-
      integratieplan als bedoeld in [artikel 30a, zesde lid, van die wet][ref4], dat binnen drie maanden na de datum
      van verlaging of intrekking van de arbeidsongeschiktheidsuitkering is opgesteld en met de opleiding of scholing is
      aangevangen voor de duur van de uitkering verstrijkt.

      4 Onder herbeoordeelde als bedoeld in het derde lid wordt verstaan: de werknemer wiens
      arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken als gevolg van de toepassing
      van [artikel 34, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref5],
      [artikel 35, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] of
      [artikel 3:28, vijfde lid, van de Wet werk en arbeidsondersteuning jonggehandicapten][ref7], of de persoon, bedoeld
      in [artikel 2, derde lid, van het Besluit eenmalige herbeoordelingen arbeidsongeschiktheidswetten][ref8], wiens
      arbeidsongeschiktheidsuitkering is verlaagd of ingetrokken.


