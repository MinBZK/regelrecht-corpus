  - number: '18'
    text: |-
      1 De werknemer, die werkloos is uitsluitend als gevolg van vorst, sneeuwval, hoog water of andere buitengewone
      natuurlijke omstandigheden heeft recht op uitkering voor de duur van de buitengewone natuurlijke omstandigheden.

      2 De [artikelen 17][ref1] en [42, tweede lid, onderdeel a][ref2] zijn niet van toepassing op de in het eerste lid
      bedoelde werknemer.


