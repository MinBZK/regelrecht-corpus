  - number: 16a
    text: |-
      1 Voor de toepassing van deze wet en de daarop berustende bepalingen is de eerste dag van werkloosheid de eerste
      dag waarop een verlies van een of meer uren, alsmede een verlies van het recht op onverminderde doorbetaling
      van het loon over die uren intreedt in de kalenderweek waarin zich een situatie voordoet als bedoeld in
      [artikel 16, eerste of achtste lid][ref1].

      2 Indien bij het intreden van het arbeidsurenverlies, bedoeld in [artikel 16, eerste lid][ref2], niet wordt voldaan
      aan een van de overige in dat lid bedoelde voorwaarden, of de werknemer geen recht op uitkering heeft op grond van
      [artikel 19][ref3], wordt, in afwijking van het eerste lid, voor de toepassing van deze wet en de daarop berustende
      bepalingen als eerste werkloosheidsdag aangemerkt, de dag van de kalenderweek waarop aan de overige voorwaarden,
      bedoeld in het eerste lid, wordt voldaan en [artikel 19][ref4] niet meer aan het recht op uitkering in de weg
      staat.

      3 In afwijking van het eerste en tweede lid is de eerste dag van werkloosheid voor de werknemer,
      bedoeld in [artikel 16, negende lid][ref5], de dag na het einde van de termijn, bedoeld in
      [artikel 64, eerste lid, onderdeel b][ref6].


