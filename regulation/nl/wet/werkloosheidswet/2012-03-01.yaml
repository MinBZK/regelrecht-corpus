  - number: '36'
    text: |-
      1 De uitkering die als gevolg van een besluit als bedoeld in [artikel 22a][ref1] of [27][ref2] onverschuldigd is
      betaald, alsmede hetgeen anderszins onverschuldigd is betaald, wordt door het UWV teruggevorderd.

      2 In afwijking van het eerste lid kan het UWV besluiten van terugvordering of van verdere terugvordering af te
      zien, indien degene van wie wordt teruggevorderd:

      a. gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.

      3 De in het tweede lid, onder a en b, genoemde termijn is drie jaar indien:

      a. het gemiddeld inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c][ref3] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref4] niet te boven is gegaan; en

      b. de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 25][ref5].

      4 Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van terugvordering
      af te zien.

      5 Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het UWV de inlichtingen te verstrekken die voor
      de terugvordering van belang zijn.

      6 In afwijking van het eerste lid kan het UWV, onder voorwaarden die Onze Minister kan stellen, besluiten van
      terugvordering af te zien indien het terug te vorderen bedrag een door Onze Minister vast te stellen bedrag niet te
      boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
