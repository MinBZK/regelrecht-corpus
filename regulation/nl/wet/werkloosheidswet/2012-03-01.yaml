  - number: '62'
    text: |-
      1 Geen recht op uitkering op grond van dit hoofdstuk heeft de werknemer, wiens dienstbetrekking met de werkgever
      reeds was geëindigd voordat de werkgever kwam te verkeren in een toestand als bedoeld in [artikel 61][ref1],
      tenzij:

      a. een duidelijke samenhang bestaat tussen de omstandigheden die tot het eindigen van de dienstbetrekking leidden
      en de omstandigheden, die tot die toestand hebben geleid; of

      b. de werknemer een recht heeft op betaling van loon, vakantiegeld, vakantiebijslag of andere bedragen als bedoeld
      in [artikel 61][ref2], dat geen verband houdt met een toestand als bedoeld in [artikel 61][ref3] en dat niet
      geldend kan worden gemaakt uitsluitend wegens die toestand.

      2 Bij de overeenkomstige toepassing van [artikel 20, eerste lid, onderdeel b][ref4], eindigt het recht op
      uitkering niet ten aanzien van het aantal uren dat de werknemer voor de in het eerste lid bedoelde werkgever
      arbeid verricht, tenzij sprake is van onverminderde loonbetaling over die uren dan wel een vergoeding voor
      de verrichte werkzaamheden aan die werkgever. Aan de werknemer die wegens ziekte, gebreken, zwangerschap
      of bevalling ongeschikt is tot het verrichten van zijn arbeid of een uitkering ontvangt op grond van
      [hoofdstuk 3 van de Wet arbeid en zorg][ref5], wordt het in [artikel 20][ref6] bedoelde vereiste van
      beschikbaarheid om arbeid te aanvaarden niet gesteld.

      3 De werknemer heeft of de nagelaten betrekkingen hebben geen recht op uitkering indien de aanvraag om een
      uitkering is ingediend nadat 26 weken zijn verstreken na de dag waarop de werkgever is komen te verkeren in een
      toestand als bedoeld in [artikel 61][ref7]. Het UWV is bevoegd in bijzondere gevallen af te wijken van de eerste
      zin.

      4 Mede heeft recht op uitkering op grond van dit hoofdstuk de persoon, niet zijnde werknemer, bedoeld in de
      [artikelen 3][ref8] of [3a][ref9], die gewoonlijk arbeid in Nederland verricht voor de werkgever, bedoeld in
      [artikel 61][ref10] of [61a][ref11], mits er geen recht op een uitkering bestaat in een andere lidstaat van de
      Europese Unie dan wel in een land aangesloten bij de Europese Economische Ruimte.

      5 Indien de dienstbetrekking op grond waarvan de werknemer recht heeft op een uitkering is aangevangen in de
      periode van 26 kalenderweken, bedoeld in [artikel 16, tweede lid][ref12], wordt bij de overeenkomstige toepassing
      van [artikel 20, eerste lid, onderdelen a en b][ref13], het aantal hele kalenderweken in aanmerking genomen dat de
      dienstbetrekking, bedoeld in [artikel 61][ref14], in die periode heeft geduurd.


