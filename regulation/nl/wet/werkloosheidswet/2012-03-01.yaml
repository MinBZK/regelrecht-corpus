      1 De door het UWV op grond van de [artikelen 16, zesde lid][ref1], [26, tweede lid][ref2], [35b, vijfde lid][ref3],
      [59][ref4] en [79, zevende lid][ref5], gestelde regels behoeven de goedkeuring van Onze Minister.

      2 Een door het UWV vastgesteld uitkeringsreglement werkloosheidsverzekeringen, bedoeld in
      [artikel 101, eerste lid][ref6], behoeft de goedkeuring van Onze Minister.


