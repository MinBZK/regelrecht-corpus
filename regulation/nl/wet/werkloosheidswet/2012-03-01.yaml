  - number: '46'
    text: |-
      1 De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onder ][ref1] wordt herzien.

      2 Onze Minister maakt in de *Staatscourant* bekend met ingang van welke dag en met welk percentage een herziening
      als bedoeld in het eerste lid plaatsvindt.

      3 Een herziening van de uitkering als gevolg van een herziening van het dagloon vindt plaats zonder dat dit bij
      beschikking is vastgesteld.

      4 Het UWV betaalt de herziene uitkering, bedoeld in het derde lid, bij de eerstvolgende uitkeringsbetaling nadat de
      herziening, bedoeld in het eerste lid, heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0004045/2012-03-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '47'
    text: |-
      1 De uitkering bedraagt gedurende de eerste twee maanden per dag 75% van het dagloon. Vanaf de derde maand bedraagt
      de uitkering per dag 70% van het dagloon.

      2 Voor de werknemer:

      a. die bij het ontstaan van zijn recht op uitkering zijn arbeidsuren als bedoeld in [artikel 16][ref1] niet
      volledig heeft verloren, of

      b. wiens recht op uitkering gedeeltelijk is geëindigd op grond van [artikel 20][ref2],

      bedraagt de uitkering het op grond van het eerste lid vastgestelde percentage van het dagloon, vermenigvuldigd met
      het aantal uren recht op uitkering per kalenderweek, gedeeld door het aantal arbeidsuren in de dienstbetrekking uit
      hoofde waarvan het recht op uitkering is ontstaan voorafgaande aan het intreden van het verlies van arbeidsuren in
      die dienstbetrekking waarnaar zijn recht is berekend. Het aantal arbeidsuren voorafgaande aan het intreden van het
      verlies van arbeidsuren wordt bepaald met toepassing van [artikel 16][ref3].

      3 Het tweede lid vindt geen toepassing voorzover bij de vaststelling of een herziening van het dagloon met de
      omstandigheden, bedoeld in dat lid, rekening is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel16
